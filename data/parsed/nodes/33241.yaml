      <p>“how much attention were you really paying?”</p>
      <p>Much more than any user should be required to and MUCH more than with any application I have ever used since 1986. I have used the Adobe apps since they hit the streets on day one. I was quite able to figure out which was which untill they started the CS naming series. I use these applications every day—practically all day. When I am working in a fury trying to meet a deadline or keep a train of thought, I should not be impeded by a cryptic icon system. If I wanted pretty pictures, I can load my desktop with them. To me, the previous picture icons were like trying to read my tax forms in Bickham Script with swash and all the frillies turned on. It might look pretty but is a pain in the aß to read. Thank heavens Adobe saw the light and made their icons readable.</p>
      <p>ChrisL</p>
