    <p>Thanks to Adobe’s latest release, I can now actually tell all their programs apart! I just loaded my newly arrived CS3 suite. Miguel a while back posted some previews of the new icon system and I am pleased to say I LOVE the new system! With a very quick peek at the dock, I can instantly launch the Adobe app I want without having to figure what the butterfly/flower/whatever business is all about. It is now just, BaDaBing, right there! WHAT A PLEASURE! </p>
    <p>So Miguel, I don’t know who was smart enough to make the decision to go that way, but buy them a beer for me! BRAVO!!!</p>
    <p>ChrisL</p>
    <p></p><div class="imageWrap"><img src="/files/CS3icons_3956.png"></div><p></p>
