      <p>I’ve been using CS3 exclusively for a couple of weeks now, it really is a killer update. The new icon system is killer; I have yet to launch the wrong app. And talk about performance, it’s a pretty impressive performance tweak, at least by Adobe standards. All the DP apps are rock solid stable too.</p>
      <p>Of course, I’m still pretty ticked that getting this requires an expensive update with few new features that can justify the price. If Creative Suite had been published by a video game company, as opposed to Adobe, the performance overhaul and stability fixes from CS2 and CS3 would have been a free patch. If I actually had any money I would establish a fund to try and bring Inkscape, Scribus, and the GIMP up to par with Adobe’s apps so that we could stop having to buy upgrades just to get bugfixes.</p>
