      <p>Mr Hardy, if you are a Linux user, you are probably undaunted by the prospect of installing the TeX system on your machine. You don’t have to use TeX to take advantage of the fonts that come with it. The list of those fonts can be found at <a href="http://www.tug.org/fontname/html/Standard-PostScript-fonts.html" title="http://www.tug.org/fontname/html/Standard-PostScript-fonts.html">http://www.tug.org/fontname/html/Standard-PostScript-fonts.html</a></p>
      <p>If you don’t want that hassle, have a peek at Latin Modern:</p>
      <p><a href="http://www.tex.ac.uk/tex-archive/fonts/lm.zip" title="http://www.tex.ac.uk/tex-archive/fonts/lm.zip">http://www.tex.ac.uk/tex-archive/fonts/lm.zip</a></p>
      <p>It is basically Knuth’s Computer Modern in OpenType, with a comprehensive set of diacritics added for all the European languages that use the Latin alphabet. </p>
      <p>Computer/Latin Modern is not too popular with the Typophile crowd (for completely valid reasons) and is really designed for mathematical and scientific work, but it wouldn’t hurt to take a look at it.</p>
      <p>All that said, the suggestion of Perpetua still looks good to me.</p>
      <p>Jim Tubman<br>
      Calgary, Alberta, Canada<br>
      "The Stampede City"</p>
