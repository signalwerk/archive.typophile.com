      <p>Great-uncle Charlie was in good company. Stanley Morison was a C.O. during WWI as well, and his gift to typography is the <a class="freelinking external" href="http://typophile.com/node/54148" rel="nofollow">most ubiquitous of TrueType fonts, Times New Roman</a>.</p>
      <p>I'll be banned from this forum if I advise you to use Times, but you might take a look at Perpetua, also available as a TrueType font. It's roughly contemporary (1928), and it's the work of another English iconoclast, Eric Gill. (Full disclosure: Some designers avoid Gill's work because of his <a class="freelinking external" href="http://typophile.com/node/58166" rel="nofollow">bizarre private life</a>.)</p>
