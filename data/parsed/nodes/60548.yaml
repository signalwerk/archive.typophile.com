      <p><cite>In so far as I have a preference it is for type designed for digital use by newer designers, ahead of digitisations of established fonts.</cite></p>
      <p>This one I don’t quite understand. </p>
      <p>That's because you're expecting a sensible rationale :) What I mean is if it came to a choice between buying from a large house who have a digitised classic, say, Bodoni or Garamond, or an independent foundry which made a new all-digital face which gave a nod to historic forms then I might lean to the latter, for purely emotional reasons. Call it the woolly, liberal well-meaning, small-producer-supporting viewpoint. On this side of the pond I could say "Guardian reader" &amp; people would say "Ah, yes".</p>
      <p>The folly of this position of course is that someone like Matthew Carter has covered both sides of this divide with work for Linotype, Bitstream, Carter &amp; Cone etc. But then for me this is an indulgence, so I reserve the right to be irrational :)</p>
      <p>I like Gentium but like rvavruch I would find it distracting in a book.</p>
