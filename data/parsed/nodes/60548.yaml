      <p>I recommend Coldstyle by Ephemera, based on Oldstyle No.7.<br>
      With the subtle distress that is built in, it will evoke the letterpress typography of the era.<br>
      It is also relatively inexpensive.<br>
      I just took a glance at a copy of "The Common Cause", a suffrage publication, from 1912, and the text is printed in an "oldstyle" face.</p>
      <p>I would also say that if you keep the layout simple and not overly ambitious, any putative lack of design skill will be offset by your good taste.</p>
