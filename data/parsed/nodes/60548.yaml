      <p>TNR (well, yeah!)<br>
      Linux Libertine (available with genuine small caps, which is something at least)<br>
      Liberation serif<br>
      Gentium (wouldn't suit a book, I think?)<br>
      Cardo (too venetian?)<br>
      Lido STF<br>
      MgOpen Canonica  -- this is one of four free Magenta fonts; they look like copies of more famous fonts (Helvetica, Optima, Avant Garde, Times). </p>
      <p>You will probably have guessed I am a linux user. With the exception of Frantisek Storm's contribution they're a bit of a motley crew I admit, so it wouldn't hurt to look at a decent quality addition.</p>
