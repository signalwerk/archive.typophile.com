      <p>As an iconic American figure often said, "hold on thar."</p>
      <p><cite>But in the end I have plumped for Miller, principally for this reason; a diary will of course have dates peppered throughout the text, and as far as I can tell it’s the one with oldstyle numerals, which I think would be better.</cite></p>
      <p>As far as I know, the numbers in Miller are aligning, about 3/4 cap height. In this regard, similar to Monotype Bell. Nice enough, but not oldstyle.</p>
      <p>Again as far as I know, the oldstyle numbers for Miller haven't been generally released. I bought the roman os figures from Carter &amp; Cone after a few email exchanges. I believe M.C. said he hadn't yet drawn up oldstyle italic figures; I made something serviceable (with permission) for my own use.</p>
      <p>I believe that generally, Miller is sold through FontBureau, and FontBureau has had other designers work on some aspects of the Miler family. Whether or not <cite>they</cite> have gotten around to the OS figs or not, I don't know. In any case, the OS figs would be an extra purchase in Type 1 format, or, if included in the OT format, it may be the OT format has a higher price.</p>
      <p>There is nothing wrong with the shorter, aligning figures of Miller, unless, of course, you have your heart set on oldstyle. If you do, please check thoroughly on what is available, and at what price.</p>
      <p>Edit:</p>
      <p>One of the oddities of modern life is that I can offer to set the diary for you at no charge, but I cannot offer to lend you the fonts at no charge. I imagine this is a project you want to do yourself, but if it comes down to it, after all this internet talk, I'll offer the composition for free, from your keystrokes. Final product to be a PDF file, the same as we would give any publisher.</p>
