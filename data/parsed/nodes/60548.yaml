      <p>Well, may I say a big thank you for everyone's helpful comments. Having had to put Charles straight about my lack of reason, I now have to contend with accusations of good taste from Nick! I'm from Leeds, Nick -- need I say more? :)</p>
      <p>I looked at all your suggestions, and thought a good deal. Coldstyle is of course a fantastic value proposition with roman, italic and small caps combined for $20. But in the end I have plumped for Miller, principally for this reason; a diary will of course have dates peppered throughout the text, and as far as I can tell it's the one with oldstyle numerals, which I think would be better.</p>
      <p>I plan to buy the roman this month (26GBP via ITC which is very good) &amp; start writing, adhering strictly to paragraph styles. Then next month I will get the italic &amp; slot it in for the date tags. A brief unsystematic survey of Google's look inside feature suggests this is more contemporary for diary datelines than small caps, which seem to have been used later.</p>
      <p>Thanks again to you all,<br>
      Paul</p>
