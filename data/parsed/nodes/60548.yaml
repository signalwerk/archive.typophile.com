    html: |-
      <p><cite>The folly of this position of course is that someone like Matthew Carter has covered both sides of this divide with work for Linotype, Bitstream, Carter &amp; Cone etc. But then for me this is an indulgence, so I reserve the right to be irrational :)</cite></p>
      <p>Well, the other folly of the position is, with someone of Matthew Carter's age, in the metal era, working for a large foundry such as Linotype was all there was. When digital type became viable, he did break off &amp; form a smaller foundry. Twice.</p>
      <p>The three RDI's I know are Matthew, George Mackie, and the late Richard Eckersley. Richard was a "Guardian reader." I'm not going to start telling George Mackie stories, but he surely has his outrageous side(s). Matthew Carter is more of an enigma, at least to me, but I'd not confuse a sure hand with simple conventionality.</p>
      <p>But I do understand. For several years, I avoided Miller because it was first recommended to me by someone whose instincts I did not like or trust. My loss.</p>
