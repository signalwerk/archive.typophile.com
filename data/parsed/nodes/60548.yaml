      <p>Paul,</p>
      <p><cite>What is abundantly clear is that the quality of the type will far exceed the quality of the typesetting &amp; design.</cite></p>
      <p>Yes, I should have added that the choice of typeface usually pales in importance beside the choices of the page size, line length, leading (linespacing) and margins. If you get these proportions in a pleasing manner, most would forgive using, say, Times Roman.</p>
      <p><cite>In so far as I have a preference it is for type designed for digital use by newer designers, ahead of digitisations of established fonts.</cite></p>
      <p>This one I don't quite understand. There are slavish digitizations of metal fonts, and for technical reasons, they usually give poor service. Too, there are designs of type that appear dated. Their design was of a period of time, and as that passed, so too did the attractiveness of the fonts. Revivals of such can be used, I suppose, in an effort to recall those times, but one is usually better served by other choices. There are fonts that seem to span generations, to span *fashion*.</p>
      <p>There is also the phenomena of (graphic) designer boredom ("I've used that before"; or "I've used that too many times before"). This couples with typeface designers desire for "something new." IMSLTHO, new is fine as long as it doesn't get in the way of the primary purpose, which is still communication between a writer and an audience. But new is hard. Type is not art, you do not use type to ask an audience to view something in a new light. If you want to ask that of an audience, you must write the words yourself, perhaps changing not only the words, but the form by which you present them. </p>
      <p>Good luck with it,</p>
      <p>Charles</p>
