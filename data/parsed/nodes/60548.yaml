      <p>Let me come down on the anti side with Perpetua, for setting text. In Metal, the 14-point master was considered OK, other sizes, no. When first photocomp then digital type became the norm, Perpetua suffered; no attempt was made to adjust the fonts for the different printing technology. The possible exception would be if all you are going to print will come off a laser or ink-jet printer -- i.e., no offset printing will be done. If your lasers look fine -- not too thin -- then you are safe on that issue.</p>
      <p>Moving from the purely technical to the aesthetic, many of us don't consider Perpetua a good font for text. Gill's two best known fonts for text are Joanna and Pilgrim, with the latter being the best. Having said that, there has always been a faction that liked Perpetua for text, as well as the side that thought it dreadful. Whatever your personal feelings, one aspect of a *professional* designer is to consider how your decisions affect an audience. Be aware there are decidedly strong feelings about Perpetua.</p>
      <p>I would add that you can do a wonderful book with just two fonts, a roman and an italic. Purchase price for two fonts, if that is a factor, is quite small these days. As to free fonts, you will need the advice of others; I am afraid I don't know much about free fonts, save those bundled with Adobe software. </p>
      <p>It is always hard to pick a typeface without reading the material. Given your description of the man, his time, and the project, I would take a long look at Matthew Carter's Miller, an modern implementation/interpretation of the Scotch Romans. If the purchase price -- about U.S. $70 for two fonts -- is too high, then you are back to selecting from the myriad of free fonts out there. I would pick a simple font; let the words come through, they are far more important than the typeface.</p>
