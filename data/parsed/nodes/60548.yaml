    <p>Dear People,</p>
    <p>As a lay enthusiast I would like to ask for your advice please.</p>
    <p>I have been given a short diary written by my great-uncle Charlie in the First World War, accounting his experiences. He was a conscientious objector who served as a stretcher-bearer. Largely for my own interest I plan to transcribe the diary. However I may donate a copy to the regimental museum of the King's Own Yorkshire Light Infantry, the regiment he served with.<br>
    I would like to choose a typeface which complements the material, so if people have thoughts on what might be a good choice please let me know. As a healthcare worker and amateur grnealogist with zero design skills I would be grateful for any ideas. It also follows that I can't really justify an expensive professional typeface suite for this project for my own amusement, as it would be unfair on my family. I am ashamed to admit in this company that truetype would be better for my word processor.</p>
    <p>As a further aside, I should perhaps add that Charlie was a conscientious objector because of his Communist leanings/ affiliations, so perhaps the typeface doesn't want to look too "official" or "establishment"!</p>
    <p>Thanks in advance,</p>
    <p>P Hardy</p>
