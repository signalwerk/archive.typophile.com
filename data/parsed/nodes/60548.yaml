      <p>Mr Hardy, that sounds like a fascinating and worthy project. It may be of interest to more people and institutions than you might expect. (The Imperial War Museum comes to mind.) My cousin did a similar project with letters sent home from family members and friends who were serving with Canadian forces during the Second World War.</p>
      <p>You say that you can’t afford a professional typeface. Here are a question and a suggestion.</p>
      <p>The question is: what typefaces are available to you on whatever system you are presently using? The experts on Typophile (I’m not an expert) may be able to help you better if they know what you have at hand.</p>
      <p>The suggestion is: if you think that you may be doing other such projects in the future, it might be worthwhile to purchase a typeface to use for them. The price may not be as high as you think. For example, someone suggested Perpetua; Monotype (at <a href="http://www.fonts.com" title="www.fonts.com">www.fonts.com</a>) sells the Perpetua Complete Family Pack for $121 in Canadian dollars; that would be about £68. That gives you standard (Roman), italic, bold, and bold italic.</p>
      <p>Good luck with your project! We would be interested in knowing what your final choice is.</p>
      <p>Jim Tubman<br>
      Calgary, Alberta, Canada<br>
      "The Stampede City"</p>
