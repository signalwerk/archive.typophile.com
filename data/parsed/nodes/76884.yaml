    html: <p>Michael Doret's <a class="freelinking external" href="http://new.myfonts.com/fonts/alphabetsoup/orion-md/" rel="nofollow">Orion</a> is upright, and based on similar commercial lettering, but it's even more monoline than Radio. Tom Kennedy has the lovely <a class="freelinking external" href="http://www.letterheadfonts.com/fonts/cosmiccursive.php" rel="nofollow">Cosmic Cursive</a> over at Letterhead Fonts, although that might be a bit too "brushy".</p>
