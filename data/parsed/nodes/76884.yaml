  html: |-
    <p>Hi—</p>
    <p>I'm trying to source this lettering as a typeface—outside of the usual naff vernacular fonts available, and a few offerings<br>
    at House Industries, does anyone know if there is anything akin to this effort anywhere else?</p>
    <p>I know it's hand drawn, but there must be something similar.</p>
