    html: <p>Hi, you're right, it would definitely help a lot choosing one. <br> <br>In this past days haven't got much time to work in this, did as bj said, lots of sketches, and I thought about using Voom, and came with a logo, but a teammate is more in favour of Reiken. I'll think Reiken will be the name, and start from there. <br> <br>Visited the Gotcha (surfwear) site, duh! I've completely forgotten about that company! <br> <br>The term Gotcha (referring to paintball) seems to be more used out of the States, indistincly, but yes, it's generic.  <br> <br>Well, I'll keep you informed about how this goes, thanks!</p>
