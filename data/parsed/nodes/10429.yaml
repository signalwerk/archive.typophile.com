    html: <p>Maybe it's just a USA thing, but I am much more familiar with "paintball". <br> <br>I was thinking the surf brand, too. (Maybe we're just showing our age...) <br> <br>I would think choosing the name would help a lot in defining your starting point. On the other hand, you might find a font you like, and choose a name based on letterforms that look good... but in  a real life project, you would most likely have the constraint of a company name already in place (not to mention lots of other things that the client probably thinks they want...) so I'd pick the name first. <br> <br>One logo idea that comes to mind is "Gotcha" with a paint splat for the "o". But, if the sport itself is known as "Gotcha", that name might be ruled out as too generic. <br> <br>to JP - if Apple uses Myriad unaltered, why do they have it as a custom font, MyriadApple"? I would imagine they have done <i>something</i> to it...</p>
    html_clean: <p>Maybe it's just a USA thing, but I am much more familiar with "paintball". <br> <br>I was thinking the surf brand, too. (Maybe we're just showing our age...) <br> <br>I would think choosing the name would help a lot in defining your starting point. On the other hand, you might find a font you like, and choose a name based on letterforms that look good... but in  a real life project, you would most likely have the constraint of a company name already in place (not to mention lots of other things that the client probably thinks they want...) so I'd pick the name first. <br> <br>One logo idea that comes to mind is "Gotcha" with a paint splat for the "o". But, if the sport itself is known as "Gotcha", that name might be ruled out as too generic. <br> <br>to JP - if Apple uses Myriad unaltered, why do they have it as a custom font, MyriadApple"? I would imagine they have done <i>something</i> to it...</p>
