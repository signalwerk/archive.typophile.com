  html: "<p>Hi, I would greatly appreciate any help with a logo I'll be doing for classes, it's about Gotcha. <br> <br>I read the threads for Al Nadeem, Gotterball, Stamps &amp; Stamps, and the VH1, and saw great comments, also visited the Identity Works site (<a href=\"http://www.identityworks.com/tools/\" target=\"_blank\">http://www.identityworks.com/tools/</a>), and helped me a lot to generate and find names. <br> <br>This is so far what I got <br><img src=\"http://www.typophile.com/forums/messages/4100/70229.png\" alt=\"Names to Evaluate\"> <br>Voom, Reiken or Roken are the names that came up <br> <br>Do they work? What suggestions do you have?  I had the idea of a soldier for the logo, but maybe that's too generic or overused <img src=\"http://www.typophile.com/forums/clipart/sad.gif\" alt=\":-(\" border=\"0\"> <br> <br>thanks! <br> <br>P.S.: This is my first post!</p>"
