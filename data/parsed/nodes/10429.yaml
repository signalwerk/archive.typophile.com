    html: <p>Oh. Wasn't sure what you meant. <br> <br>As far as the marks ... hmmm, well you mentioned the Gutterball <br>thread, in which our friend Jay W. pointed out that a mark ought <br>to be more distinctive than simply typing a company name <br>in a specific font. Sometimes this is difficult b/c of time constraints. <br>But it sounds like you have some time before your classes start, yeah? <br> <br>I would humbly suggest that you select a name from your group <br>and play around with some sketches, just paper and pencil. <br>That is always a good starting point. You might try both uppercase  <br>and lowercase, or mixed; you might try different <br>forms of a specific letter; you might try different type classifications. <br> <br> <br>bj</p>
