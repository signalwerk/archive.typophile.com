    <p>hey,</p>
    <p>I’m just looking for some well designed labels, I’ve just been asked to create the label/logo for a new sandwich brand called ’Now that’s a Sandwich’ the brand values quality and all sandwiches are handmade, the bread used is stone oven baked (also handmade) and fully Irish owned using only Irish products. </p>
    <p>It’s a gourmet, quality sandwich so the design solution obviously needs to be reflective of those qualities. Any suggestions on possible typefaces or any samples of similar products would be greatly appreciated. This is my first job since graduating a few weeks ago so really want it to be effective.</p>
