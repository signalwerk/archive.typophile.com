    html: |-
      <p><cite>I’d rather go for initials: USD for dollar, EUR for euro …</cite></p>
      <p>These are two parts of the brain. The technical abbreviations you mention are just the poor modern banker’s workaround to circumvent his disability of handling $, £, € and the like on his devices. These *typographical* abbreviations, on the other hand, have been born out of the scribal need (of former centuries) to speed up the merchant’s everyday recording pensum by replacing “Libra” by £ – and getting faster. But not every currency inherited it’s own typographical symbol.</p>
      <p>However, signs like £ and $ have gained symbolic meaning over the time. So that it became desirable for emerging currencies/states to furnish their own monetary unit with a special typographical glyph – both as an abbreviation in text *and* a brand-like symbol. Therefore we have seen quite a lot enterprises to establish new signs of such kind recently: Armenia, Azerbaidschan, Russia, India; not to mention many <a class="freelinking external" href="http://www.signographie.de/cms/front_content.php?idart=238" rel="nofollow">local currency initiatives</a> which also embark on creating a captivating sign for their own money.</p>
      <p>I wondered about the Rp./.Rs issue for years. Thank you all for enlightening me.</p>
