    date: 2011-07-12T11:48:00
    votes: null
    html: <p>Andreas, the standardisation of <em>unique</em> currency codes is not just a technical workaround for instability in correctly displaying currency symbols, it is also necessary because some currencies do not have well established written symbols and some different currencies use the same written symbol. Many currencies use the $ sign, for instance, and not only for dollars, but also pesos and other currencies. These need to be differentiated in financial transactions; hence AUD, BBD, BSD, CAD, FJD, HKD, JMD, LRD, NIO, SGD, TOP, USD, WST, etc.</p>
