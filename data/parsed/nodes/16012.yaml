    html: |-
      <p>Here's <a href="/wiki/David%20Lemon" class="freelinking" rel="nofollow">David Lemon</a>'s own words about the presence of this glyph in Adobe's fonts:</p>
      <p>Back in the ancient days of Type 1 fonts, Adobe defined a basic character set for Latin. Since Type 1 fonts were limited to one-bye encodings, we soon decided we needed a supplemental set to hold the kinds of glyphs needed for more advanced typography. We set about building a list for what was to become the Expert set.</p>
      <p>Many pieces were obvious: small capitals, oldstyle figures, additional f ligatures, superior &amp; inferior figures, more dashes, and the "French" alphabetic superiors. We looked around, and noticed that this set, combined with the base set, was very similar to the set URW was producing for ITC fonts at that point. There were just two additional currency characters in the ITC set: the colon and rupiah.</p>
      <p>Adobe hadn't learned much about the Latin market outside Europe and North America yet. We decided that if ITC was including these currency characters, there was probably a good reason, and we might as well meet the ITC "standard". So we added them in the Expert set.</p>
      <p>Years later, when I mentioned this to Cynthia Hollandsworth (now Cynthia Batty), she suggested that the colon and rupiah got into the ITC set via Agfa, which had some large corporate clients doing business in those regions. The derivation of character sets is always intriguing, and full of odds bits of legacy!</p>
      <p>- thanks,<br>
        David L</p>
    html_clean: |-
