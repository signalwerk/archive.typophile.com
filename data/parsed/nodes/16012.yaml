      <p>Found it - <a href="http://www.myfonts.com/unicode/20a8/" title="http://www.myfonts.com/unicode/20a8/">http://www.myfonts.com/unicode/20a8/</a> </p>
      <p>"Rp" seems to be a legacy or possibly incorrect design for the Rupee in some fonts. Seems as if "Rs" is the current form.</p>
      <p><a href="http://www.unicode.org/charts/PDF/U20A0.pdf" title="http://www.unicode.org/charts/PDF/U20A0.pdf">http://www.unicode.org/charts/PDF/U20A0.pdf</a></p>
  - id: 93553
    user_id: 1262
    user_name: John Hudson
    user_path: null
    user_image: /files/pictures/picture-1262.gif
    date_raw: 3 Nov 2005 — 9:29am
    date: 2005-11-03T09:29:00
    votes: null
    html: <p>U+20A8 is the Indian rupeeh abbreviation, which is indeed <em>Rs</em>. I think there is some confusion because many years ago Adobe included the Indonesian rupiah abbreviation <em>Rp</em> in their expert set fonts. The rupiah sign is not encoded as such in Unicode, most likely because Indonesians simply use the letters <em>R</em> and <em>p.</em> In their OT fonts, Adobe use a Private Use Area codepoint for the rupia (U+F6DD). My guess is that the Monotype folk who worked on Palatino Linotype were familiar with the <em>Rp</em> glyph from Adobe expert set fonts, and thought this was the rupeeh sign.</p>
