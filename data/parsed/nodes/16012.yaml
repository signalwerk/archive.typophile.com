      <p>Greetings to you all.</p>
      <p><a class="freelinking external" href="http://id.wikipedia.org/wiki/Rupiah " rel="nofollow"> Rp</a> is the currency of Indonesia. Its history indeed is derived from the  Indian Rupee which of mentioning -- reasonably suspected -- to have been combined with the mention of Arabs so that being "rupiah" (name) and "Rp" (symbol) and also "IDR" (international code)</p>
      <p>The placement "Rp" at different codepoint on some fonts has confusing of course. While we see that Unicode still leaves some "empty slots" (U+20BA ... U+20CF). So in my humble opinion, it makes more sense if "Rp" should be moving to one of these codepoint. We wait from Unicode, Adobe, Microsoft or anyone authorized to handle this.</p>
      <p>And more importantly (related the standard codepage) I think this is the moment to arrange the codepoint of all the existing currencies.</p>
      <p>Best Regards.</p>
