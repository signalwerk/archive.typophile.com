    html: <p>Maria, although you probably won't get people here just sending you the fonts*, many foundries will provide means for people who can't afford to buy all the fonts they admire - which is most people! <br> <br>* At least I hope not! :-/ Good fonts like those take a lot of work to make and their authors want to make money from the effort, and are afraid copies of the fonts will start "drifting" to potential customers who will end up not buying them. <br> <br>And I'd also be curious to find out more about the project itself. <br> <br>hhp <br></p>
