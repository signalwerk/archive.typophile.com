    html: <p>Michael, if you send me your e-mail contact information (to tiro&lt;at&gt;tiro.com), I'll put you in touch with Fiona. Much of the work she did for Linotype is not currently available, as it has not been converted for today's technology yet, which is why you won't find much of it online. I'm sure Fiona would be happy to send you photocopies of old samples and answer your questions.</p>
