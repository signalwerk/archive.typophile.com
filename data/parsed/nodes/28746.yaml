    <p><cite>“The computer keyboard helped kill shorthand, and now it’s threatening to finish off <a href="/web/20081015142228/http://www.typophile.com/wiki/longhand" class="wiki-create">longhand</a>.</cite></p>
    <p><cite>When handwritten essays were introduced on the SAT exams for the class of 2006, just 15 percent of the almost 1.5 million students wrote their answers in <a href="/web/20081015142228/http://www.typophile.com/wiki/cursive" class="wiki">cursive</a>. The rest? They printed. <a href="/web/20081015142228/http://www.typophile.com/wiki/block%252Bletters" class="wiki-create">Block letters</a>.”</cite> - Wash Post </p>
    <p>The rest of the article is here:</p>
    <p><a href="https://web.archive.org/web/20081015142228/http://www.washingtonpost.com/wp-dyn/content/article/2006/10/10/AR2006101001475.html" title="http://www.washingtonpost.com/wp-dyn/content/article/2006/10/10/AR2006101001475.html">http://www.washingtonpost.com/wp-dyn/content/article/2006/10/10/AR200610...</a></p>
    <p>It’s interesting that this is happening even as scripts fonts are perhaps as popular as they have ever been. Maybe there is a connection even.</p>
