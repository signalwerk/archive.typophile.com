      <p>I’m not sure it’s lack of training, Dan.  Teachers only have so much time to mark papers — they barely have enough time now to skim through them as it is to ensure the student has some sort of grasp of the topic.  Throw in having to decipher poor handwriting, and you’d get even more of them quitting.</p>
      <p>Like Chris, I’m also in the “old fogey” category of having had cursive beaten into me at school: mine was pretty bad until I took a course in calligraphy as a teenager, and then it actually became legible.</p>
      <p>For awhile, that is, until I started spending way too much time in front of a computer.  ;-)  I think the only reason it’s still as functional as it is could be because I still edit hard copies, by hand, with a red pencil, most of the time.  And I’ve got an old friend who still has the most incredible cursive hand — a quick note from him looks like a fine engraved invitation.  I’m jealous!</p>
      <p>Perhaps it’s come down to “those who can write beautiful cursives, do: those who can’t, use (insert name of favourite cursive font here).”</p>
      <p>Sad....</p>
      <p>Linda</p>
