      <p><cite>Perhaps it’s come down to “those who can write beautiful cursives, do: those who can’t, use (insert name of favourite cursive font here).”</cite></p>
      <p>If only it had ever been as simple as “those who can do, those who can’t  are just people who will always have crummy handwriting so let’s just accept it.” I’m a big believer that so many people hate cursive because they got sick of elementary school teachers complaining about every little loop not being perfect, so they just stopped using it as soon as they hit sixth grade. It’s kind of like Matisse and his drawings–he just stopped showing them to people, so nobody saw most of them until after he died.</p>
