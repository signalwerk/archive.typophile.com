    html: <p>Though I doubt that this is widely the case, my interest in type design and typography (aside from my background in art and design in general) grew out of the fact that handwriting has always been painful for me, both physically and psychologically. If penmanship instruction were treated as an art rather than a reinforcement of obsessive-compulsive behaviors from the earliest levels, I might have had a different attitude about it.</p>
