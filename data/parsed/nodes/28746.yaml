    html: |-
      <p>I think there is a definite correlation.  Scripts are looked upon as an artform that is “new” to this young generation.  With script fonts, they get to avoid actual handwriting, yet have the look of the perceived artform.  Old fogies like me who had their wrists slapped for poor penmanship and never learned to type, have a different outlook:-)</p>
      <p>Students now take notes on a laptop and “pass notes in class” using text messaging on cell phones. Handwriting today is mostly self-communication and rarely is intended for reading by others.  When this generation becomes teachers, handwriting will become something to be studied by archeologists and historians instead of school children.</p>
      <p>ChrisL</p>
