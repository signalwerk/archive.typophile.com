      <p>I think their point about the SAT is only partially correct. Every single teacher I have ever had has told me to NEVER use cursive in an essay or on a test. In fact, I would get marked off points because of it. Teachers don’t want to have to decipher hieroglyphics just to grade a paper.</p>
      <p>Now, whether that is because of <cite>their</cite> lack of training, who knows?</p>
