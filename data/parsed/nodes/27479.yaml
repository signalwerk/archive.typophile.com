    html: |-
      <p>Gary: Too bad you didn’t get to visit Melbourne during the filming. Stephen has some really interesting work that would probably fit the film (talking without having seen it yet). I worked with Stephen Banham, of the Letterbox, teaching a post grad course in Typography, Identity &amp; Publication Design at RMIT in Melbourne. Stephen is often misinterpreted that he hates Helvetica from his Death to Helvetica t-shirts. He even considered not reprinting them at one stage from this very reason. What Stephen is trying to make a point of is designers use of Helvetica as an easy way out of an identity design jam. Slap on Helvetica and be safe.</p>
      <p>By the way Gary: We are thinking of holding a pre screening gathering at the Film Festival here in Bergen, Norway. Would you be interested in holding a pre screening short lecture/introduction in the mid/end of October? If interested I will start researching where we can find some funding to get you over (Probably the film festival would join forces with us; the local norwegian AIGA equivalent)</p>
    html_clean: |-
