    <p>Greetings Typophilers, just wanted to let you know about the documentary I'm making.</p>
    <p><strong>Helvetica</strong> is a feature-length independent film about typography, graphic design and global visual culture. It looks at the proliferation of one typeface (which will celebrate its 50th birthday in 2007) as part of a larger conversation about the way type affects our lives. The film is an exploration of major cities and the type that inhabits them, and discussions with renowned designers about their work, their views on type, and the past fifty years of graphic design. <strong>Helvetica</strong> was shot in high-definition on location in the United States and across Europe. The film is currently in post-production and will begin screening at film festivals worldwide in early 2007. </p>
    <p>Interviewees in the film include Matthew Carter, Massimo Vignelli, Erik Spiekermann, Michael Bierut, Wim Crouwel, Hermann Zapf, Stefan Sagmeister, Jonathan Hoefler, Tobias Frere-Jones, Lars Müller, Rick Poynor, Experimental Jetset, Pierre Miedinger, and many more. The film will also feature an original soundtrack with new music from Sonic Youth, Sam Prekop, Kim Hiorthøy, and others. </p>
    <p>For more info, there's now a website for the film: <a href="http://www.helveticafilm.com" title="http://www.helveticafilm.com">http://www.helveticafilm.com</a></p>
    <p>I'll also be screening a four-minute teaser at TypeCon this week, during Wednesday night's Typophile Film Festival. Hope to meet those of you who are attending. </p>
    <p>Looking forward to hearing all your thoughts and feedback on the film, and of course screening it all over the place in '07. We're currently finishing the editing process, and will be posting some clips and trailers on the site soon. If you'd like me to keep you posted about the film's progress, screenings and other news, we have a <a href="http://www.helveticafilm.com/mailing.html" rel="nofollow">mailing list</a> so if you're interested, get on it. </p>
    <p>Thanks!</p>
    <p>-Gary</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/sm_4063.badges.jpg"></div><p></p>
