      <p>One of the challenges putting this film together was my desire not to make it a standard talking-head film, where dozens of people chime in with one quote about the subject. I wanted each interview to be a mini-profile, so you're getting to spend a few minutes with, say, Matthew Carter, learning about his background, his views on type, what he tells people when they ask him what he does for a living, etc. And then you get his views about Helvetica. The downside of this approach is that I could only include so many people in the film. There are hundreds of people who've got an opinion about the typeface, or were in some way responsible for its popularity.</p>
      <p>It's funny because I originally wanted to make a documentary about type design, past/present/future. Then I realized that it would take a loooong time, like 3 to 5 years at least, to make a film that really covered all that and got it right. So I thought "Well, I'll just pick one typeface, that'll be easy!" </p>
      <p>But of course, I was wrong! </p>
      <p>-Gary</p>
