    <p>I’m not sure if this topic has been addressed already and I apologize if it’s a repeat issue, but I am currently working for a textbook publisher who’s now working a paperless workflow. We are currently using InDesign/InCopy on a server-based client with files generated outside the company (our studio) in InDesign using Mac Type 1 fonts. Our PDFs are generated through a PC server that we cannot change to an X-Serve at the moment. We have converted the fonts using TransType Pro 3.0.2 to Windows True Type as well Windows Open Type in  hopes to find a medium for the cross-platforms to see the fonts in the files. Currently, when a file is opened on a Windows machine, it states the fonts are missing. Is there a way to have InDesign PC recognize the TTF or OTF versions of the Mac Type 1 fonts in the file?</p>
    <p>Any and all insight you can provide is greatly appreciated.</p>
    <p>~Saritza</p>
