      <p>Hi, I'm a graphic designer. I've seen a number of fire departments use the Maltese cross, so it's okay if you want a traditional look. I'm not sure about the shape inside. Wine? Fire? Both the symbol and the typography need some work.</p>
      <p>Old Tom certainly gives a vintage look and might be an improvement, but coming up with a proper logo isn't well suited for top-of-your-head suggestions by people who know nothing about the company. Especially when you're not talking to the owner, who may have very different ideas.</p>
      <p>Keep in mind that changing a logo can involve a lot of time and expense — labels and other packaging, signage, stationery, promotional materials, website, etc.</p>
      <p>Don't get me wrong, I think it's great you want to make some improvements, but I'm hesitant to offer specific suggestions to a well-established company without hearing from the owners how they want the company to be viewed, their future plans, and their competition. </p>
      <p>I know this isn't the answer you wanted, but my suggestion would be to get a good local graphic designer to sit down with you and the owners to discuss the logo in depth.</p>
