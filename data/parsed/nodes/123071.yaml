    <p>Hello,<br>
    I recently moved into a marketing position for a new winery called Firehouse Wine Cellars, but I can't stand the logo they are using. It's  wrong in a million different ways (copperplate, unbalanced, palace script - see for yourself).<br>
    They want to keep a vintage feeling and use of a maltese cross. I was thinking about using something like LHF Old Tom for heading text, but am not sure what to pair it with or how to incorporate a maltese cross. Please help! I've hit a block!</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/winery%20old%20logo.jpg" width="1231" height="1443" alt="">
