      <p>"We would love for it to have a similar feel to our sister company."</p>
      <p>Firehouse Wine Cellars and Firehouse Brewing? A similar feel might be a good idea, although each should be designed with the particular customer base in mind, which might be different for the 2 products.</p>
      <p>I like the wine label, but I'd put the name with the logo on the back; right now it almost looks like a logo for Riesling.</p>
      <p>The current Firehouse Brewing logo might look good in a large sign, but it won't reduce well, which is essential for a modern logo. The illustration and other elements become a blur. Maybe with some simplification it could work. Also the bright yellow is a color I associate more with McDonalds and other fast food places.<br><img src="/sites/default/files/old-images/firehouse_5436.jpg"></p>
