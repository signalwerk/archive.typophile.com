      <p>I agree with James that this is not a process that you want to embark on casually. Either you do it "right" or you don't do it at all. The landscape is full of companies that have attempted to "update" their logo or mark and have ended up making matters worse, creating as many problems as they solve and ending up with just as big a mess as what they started with.</p>
      <p>I don't think Old Tom is your answer. It's TOO retro, and it's hot a firehouse type of font, it's more of a circus/saloon type font. Copperplate is actually not a bad solution but in your logo it is used poorly. It's a difficult font to space properly to begin with.</p>
      <p>I think your biggest challenge is going to be integrating the cross and the logotype together into one mark. Right now they are two distinct, unrelated elements. I'm assuming that the resulting mark needs to be generally square given the applications it gets used in, so taking the name and combining it with the cross is likely your best approach.</p>
      <p>Something like this:</p>
      <p><img src="/sites/default/files/old-images/firehouseWine_3874.png"></p>
