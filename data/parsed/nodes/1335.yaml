    html: <p> Looking at the first image you've posted, I still think that this sans is calling too much attention to itself. You have the elegance of the serif (Mrs. Eaves?) and then your sans is almost ... it is almost anti-design? It almost looks like a mono-space sans, again to me it looks this way. -- I do like this sans, but perhaps for other situtations. -- I'm also not so sure about the greying down of the word itself. -- ;) How about Anisette Petite? -- One more thought. The placement of the word 'ARCHITECT'. Correct me if I'm wrong, but the architect's job starts with a solid foundation, no? </p>
