    html: <p> One weakness in your earlier version -- the lc 'io' also read as '10'. -- Futura is better (although I know some of you are tired of it.) --  'ARCHITECT' seems to have no reason for ending at the point underneath the 'o', is it centered of the 'o'? it isn't that i dislike it, it is only that is calls more attention to the 'Cio', or rather it almost causes the words 'cio' and 'offi' to appear? maybe this is not a negative thing. The word 'cioffi', is this a last name or does it have other meanings or connotations? </p>
