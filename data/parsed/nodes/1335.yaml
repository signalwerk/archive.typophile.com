    html: "<p>Many variations have been explored with the client. Discussions with the architect directed me to create a visual identity that left a sense of \"creative formality\". By good fortune the name allowed for the beauty of the f-f-i ligature. The italic 'i' was chosen as a solution because of the interesting tension it created.  Is the italic looking too forced? Is it the correct weight? Here's an earlier study: <br> <br><img src=\"http://www.typophile.com/forums/messages/29/1651.jpg\" alt=\"cioffi2.jpg\"> <br> <br>The Mercury caps have two characteristics I like in this composition. The slab serif on the 'I' and the spur on the 'C'.  The earlier study here uses Futura. Do you think that is a better choice?    <br> <br>Thanks.</p>"
    html_clean: "<p>Many variations have been explored with the client. Discussions with the architect directed me to create a visual identity that left a sense of \"creative formality\". By good fortune the name allowed for the beauty of the f-f-i ligature. The italic 'i' was chosen as a solution because of the interesting tension it created.  Is the italic looking too forced? Is it the correct weight? Here's an earlier study: <br> <br><img src=\"http://www.typophile.com/forums/messages/29/1651.jpg\" alt=\"cioffi2.jpg\"> <br> <br>The Mercury caps have two characteristics I like in this composition. The slab serif on the 'I' and the spur on the 'C'.  The earlier study here uses Futura. Do you think that is a better choice?    <br> <br>Thanks.</p>"
