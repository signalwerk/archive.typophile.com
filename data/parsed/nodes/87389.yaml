    <p>Dear Typophiles,</p>
    <p>I'm looking into the convention of languages which set superscript letters in relation to number words (not sure if this the right word).</p>
    <p>Few examples below:</p>
    <p>ENG<br>
    1st, 2nd, 5th</p>
    <p>FR<br>
    1er, 2e</p>
    <p>NL<br>
    2e</p>
    <p>Can someone refer to a complete list? There most be more.<br>
    Also, are their any opentype fonts, which have these as superscript glyphs?</p>
    <p>Thanks for letting me know!</p>
