      <p>In French the letters used to indicate the ordinal form of a number are usually made superscript. In English, they are not usually superscript. However Microsoft Word decided to set their word processor to automatically superscript the letters in ordinal numbers and so now ordinal numbers using superscript characters are more common on the web and perhaps even in printed text.</p>
      <p>See <a href="http://en.wikipedia.org/wiki/Ordinal_indicator" title="http://en.wikipedia.org/wiki/Ordinal_indicator">http://en.wikipedia.org/wiki/Ordinal_indicator</a> for information on ordinal indicators in a number of languages that use the Latin script.</p>
      <p>Unicode does not include all possible superscript characters for Latin, as the Unicode consortium considers superscripting (and subscripting) to be a style variant, like bolding and italicizing and underlining. Superscript characters are only included in Unicode when the character is to be distinguished from its full-size  counterpart in phonetic writing.</p>
      <p>Otherwise every character in Unicode would have to also appear in superscript and subscript form, and in a superscript of the superscript form and subscript of the superscript from, and in a subscript of the subscript form and a superscript of the subscript form, and so on, ad infinitum.</p>
      <p>For a complete listing of pre-built superscript characters in Unicode see <a href="http://www.fileformat.info/info/unicode/char/search.htm?q=superscript&amp;preview=entity" title="http://www.fileformat.info/info/unicode/char/search.htm?q=superscript&amp;preview=entity">http://www.fileformat.info/info/unicode/char/search.htm?q=superscript&amp;pr...</a> and <a href="http://www.fileformat.info/info/unicode/char/search.htm?q=modifier&amp;preview=entity" title="http://www.fileformat.info/info/unicode/char/search.htm?q=modifier&amp;preview=entity">http://www.fileformat.info/info/unicode/char/search.htm?q=modifier&amp;previ...</a> .</p>
