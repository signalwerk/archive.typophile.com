      <p>Dear James,<br>
      Kerning with glyphs is really simple. Don’t cede to FL bad habits ;)<br>
      Please take a look of the image I’ve posted here.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/how-to-kern-with-glyphs-app_4830.gif"></div><br>
      Please take also in account you can forget the FL kerning-groups table. Just add your group name into the info box below your current glyph. You’ll see two “G:” labels, one for the left group, the other for the right one. <p></p>
      <p>You may also change the values of several of them at once in the panel at the bottom left of the main font view.</p>
  - id: 496453
    user_id: 8183
    user_name: schriftgestalt
    user_path: null
    user_image: /files/pictures/picture-8183.png
    date_raw: 25 Feb 2012 — 10:50am
    date: 2012-02-25T10:50:00
    votes: null
    html: |-
      <p>Hi James.<br>
      Considering you have typed VAY (as in the image above)<br>
      You can place the cursor between the V and the A. Then change the bottom left number in the info box. Or use the shortcut ctrl+opt+(shift)+left/right arrow keys. This is how I usually do it.<br>
      Additionally, without moving the cursor, you can adjust the kerning on the AY pair. By editing the value in the lower right corner of the info box. Or use the command cmd+opt+(shift)+left/right arrow keys.</p>
      <p>The keyboard shortcuts for changing the metrics are quite similar, just without the option key.</p>
      <p>From the three command keys next to the space, the left one (ctrl) modifies the left side of the selected letter and the right key (cmd) changes the right side of the letter. </p>
      <p>The shortcuts are not very obvious at first, but you get used to it after a few minutes.  </p>
      <p>And it helps if you change the shortcut for Spotlight (e.g. to ctrl+space, this also helps in Adobe apps) and Spaces in the system preferences.</p>
