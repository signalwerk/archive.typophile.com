      <p><cite>No doubt he's a master of your regular bog standard Nested Styles, but not so much of properly naming ID's features :)</cite></p>
      <p>I don’t understand what you are talking about. Of course as German I use a German version if InDesign and the features use menus have German names. So I don’t know if “nested character styles” is the usual term in English, but if I embed a series of character styles within a paragraph style, I would call that “nested character styles”. And it does’t seem that I am the only one who calls it this way: <a href="http://vimeo.com/9880383" title="http://vimeo.com/9880383">http://vimeo.com/9880383</a><br>
      If that’s not the proper way to name or understand it, just let me know.</p>
  - id: 496724
    user_id: 29994
    user_name: Theunis de Jong
    user_path: null
    user_image: /files/pictures/picture-29994.gif
    date_raw: 27 Feb 2012 — 10:45am
    date: 2012-02-27T10:45:00
    votes: null
    html: |-
      <p>Sorry Ralf, but your wording was understood by Charles to mean that character styles themself can be nested -- more than one style applied to the same text. Now that seems impossible in InDesign, as "Character Style" is a singleton text attribute, just like "font" (obviously you cannot assign two fonts at the same text), size, color, et cetera. (The very weird thing is that a GREP style suddenly <em>can</em> be applied on top of each other and on top of other char styles, so it's not an obvious problem for ID's internal structure.)</p>
      <p>I would hesitate to call a series of char styles in a single paragraph "nested". I think I'd just say they are "applied" or "used", like you can use several fonts in a single paragraph. The notion of "nesting" implies "on top of each other"; at least, that is my view when I read this term.</p>
