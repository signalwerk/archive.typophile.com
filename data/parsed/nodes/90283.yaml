    html: |-
      <p>Glyphs takes a while to get used to. The trick is just accepting the simplicity of it. Glyphs can seem really infuriating because Georg tries to keep most functions in one window as opposed to a collection of windows and palettes. So you have to force yourself to just work with the one window instead of jumping back and forth between the glyph window, the font window, the metrics window, and the preview window. I forced myself to use it full time for a week to wrap my head around it. Once you do get used to Glyphs the consolidated interface saves a lot of time. Especially once you realize that the Glyphs interface mostly obviates the need for Prepolator and makes multiple master development a breeze.</p>
      <p>As for kerning, are you using an old version of Glyphs? I have the latest version and it works with either the cursor between the two glyphs or by selecting either glyph and entering numeric values into the kern value box.</p>
