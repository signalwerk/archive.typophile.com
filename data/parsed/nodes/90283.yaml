      <p>James,<br>
      I have no problem with the FLS Metrics Window (except that tabbing through places a zero as a data point forever.  If you delete it, it stays a zero. The problem I have with FontLab deals mostly with opportunities to do things that a computer does well are often missed. Error reporting is a guessing game.  There should be an error message that tells you clearly what your error was and how to fix it.  It should even open the screen or panel or whatever, to the location of where that particular error can be fixed.  Also, errors should be prevented by having the software keep track of all data entries and prompting the proper solution. For example, if I attempt to place a glyph in 2 opposing kerning classes. There should be an audible beep and the error message "glyph yacute is already in a Left-side kerning group called "_y.L" Would you like to remove it from that Class? [at this point the class in question should pop up on the screen at the proper location.]  I should not have to wait until I generate the font to get a cryptic error message which can only be understood by a computer programmer. When their is an error in coding features, we should get a prompt such as "Syntax error--semicolon required at line ending"</p>
