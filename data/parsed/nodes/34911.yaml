      <p>As you show us that, I have something to show as well. Did you read this from  Vincent Connare's site:<br>
      "Comic Sans was shown with other fonts to Program Managers at Microsoft and was then included in the Windows 95 Plus Pack that was a supplemental product to Windows 95. Later a Project Manager decided to include Comic Sans into the list of system fonts for the OEM versions of Windows 95. This was after I included basic support for Greek and Cyrillic. Finally it was added with Trebuchet, Webdings and Verdana as additional fonts to the Windows System fonts for the original Internet Explorer.</p>
      <p>Now it is part of the Microsoft Windows system fonts.</p>
      <p><strong>Why?</strong></p>
      <p>Because it's sometimes better than Times New Roman, that's why. </p>
      <p>Or at least Apple thinks so. Comic Sans is the default font in  Apple's iCards on the web when it was first released."</p>
      <p>Source: <a href="http://www.connare.com/comic.htm" title="http://www.connare.com/comic.htm">http://www.connare.com/comic.htm</a></p>
