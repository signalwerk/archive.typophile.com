  - id: 101959
    user: 6016
    date: 2005-12-30T09:02:00
    date_raw: 30 December 2005 - 9:02am
    votes: null
    html: <p>This is indeed a custom face from FB, drawn by Cyrus Highsmith. It's a slab version of their sans, which was called Antenna last time I checked (which is a great name - i hope it sticks). The sans is also used by Poz, Popular Mechanics, and another publication or two, and has the extensive range of weights and widths one would expect from Font Bureau, but as far as I know the slab is exclusive to AARP, at least for the time being.</p>
