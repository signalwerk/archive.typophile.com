      <p>Counter is from the Latin <strong>contra </strong>— ‘against’ or ‘opposite’. Which should explain the meaning of counterpunch…</p>
      <p>It stands to reason that before type was made in a semi-industrial process with a punch, the term ‘counter’ was not used; the counter being the <em>result</em> of the use of a counterpunch.</p>
