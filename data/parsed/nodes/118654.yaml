    html: |-
      <p>You may know, in the days of hand-crafting metal types, that an engraver would carve a positive letter shape onto a metal rod called a punch and then strike that into softer metal to make the mold ("matrix") used to cast type. An engraver could relatively easily carve the outside shapes of that letter on the end of the punch, but it isn't easy to get into the interior spaces with the carving tool. So the punchcutter would make an additional punch of the negative shape, and strike that, head to head, into the punch first, then carve the rest. That additional punch for the negative space was called a counter punch (since the direction it was struck was counter to the way the punch proper was used). So interior spaces on the punch were achieved with the counterpunch tool, and the spaces in the resulting types were consequently called counters.<br>
      If you're interested in this nitty gritty, Fred Smeijers' /Counterpunch/ is a fantastic read.</p>
