    html: <p>"that even where the website is at fault, if it doesn't work with Firefox or Mozilla, or Opera, or web TV, or Liberty boxes, its not necessarily down to lazy web developers." <br> <br>That is true. I'd simply argue that it's USUALLY an issue of lazy web development (whether that be the developers, project management, upper management, etc.). <br> <br>"Often its down to budgets. And in the real world of corporate web development where testing takes place during and after development, it is a crucial and significant part of the development budget, which does influence which browsers/devices are supported. " <br> <br>I agree that that *is* a common excuse...but it's not usually (though it is sometimes) valid, as developing cross-browser web sites, provided the developers know what they're doing, doesn't cost more. <br> <br>We simply disagree on this point. So be it. ;o) ;o) <br> <br>To be fair, part of the problem is the toolset given the developers. I do a lot of .net development these days and, surprise, surprise, .net favours IE on the front-end. So I need to go in and develop my own front-end interfaces for most widgets rather than depending on .net's built in widgets.  <br> <br>I've worked with CMS tools that also favour only one specific browser. So, if the base set of tools is already flawed, then it's hard to blame the developers that need to work with said tool (though I could blame the folks that decided on that particular technology. ;o)</p>
