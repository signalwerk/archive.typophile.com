    html: <p>&gt;&gt;I can group my browsing in a subject-oriented manner, rather than in an unsorted mess <br> <br>OK - seems like a good reason to go for tabs. <br>(I think I was just having difficulty seeing the benefits in abstract, having little practical experience of tabbed browsers - more on that below). <br> <br>&gt;&gt;in Windows every document gets its own Taskbar item (except in apps like Photoshop) <br>I'm not sure how far this is true. I guess it depends on what you mean by 'apps like photoshop'. <br>As far as I can tell its only IE, plus MS Office applications that give each document its own Taskbar item (even those get documents stacked into a single taskbar item in XP). <br>Looking at my quicklaunch bar, I don't see any others that have more than one taskbar item for multiple documents. (Of course you could open multiple instances of the app, if you <i>wanted</i> multiple taskbar items). <br> <br> <br>&gt;&gt;I'm not a PC-hater... <br>Well I'm no zealot, but sometimes the superior air of <b>some</b> Mac users does get up my nose. (I don't mean anything in this thread, but there are occasional comments on Typophile which just show some people's ignorance). <br> <br>I use PCs as local machines, but my web work has always been on Unix servers, running Apache/PHP/MySQL so I'm already converted to the open source/gnu/free software cause. <br>I had stayed away from Mozilla because of its connections with the nightmare that was Netscape, but this thread convinced me that it was time to give Mozilla a go. I tried Firefox, but most of the sites I use don't work well (or at all, in many cases). I put this down to it being a beta, and downloaded Mozilla 1.7. Same result I'm afraid. <br>I can see that tabbed browsing could be an advantage, but I don't want to change browsers every time I want to go to my bank/bookies/remote e-mail etc. <br> <br> <br></p>
