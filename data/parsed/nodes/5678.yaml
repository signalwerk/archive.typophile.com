    html: <p>Hrant, the idea with the Thunderbird/Firefox stuff (both parts of the SeaMonkey project) is that it's essentially a kind of modularised Mozilla, so you're not downloading and using one monolithic do-it-all application, but lightweight, fast programs that do one thing well. So Thunderbird doesn't as such 'come with' Firefox, but it's the mailreading arm of the SeaMonkey project. There are other side-projects, all being developed by community, such as the Sunbird calendar, which can also integrate with Thunderbird (although the last time I tried it it was still awful buggy). <br> <br>And yeah, I can testify that the spam filtering in Thunderbird is great. From about ten a day I now get about one a month slipping through, and no false positives so far. <br> <br>Steve -- if you have the time (maybe a spare five minutes) you could report your non-working sites  on the Firefox <a href="http://forums.mozillazine.org/viewforum.php?f=9&amp;sid=7aeddd06e7d74ea63ad4090358e80d9a" target="_blank">forums</a>? It's easier than filing a full bug report (for which you need to be using the latest nightly build etc.) and the developers do seem to read the forums. FF is still, after all, in beta. <br> <br>Rob <br> <br></p>
