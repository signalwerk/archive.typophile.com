    html: <p>"If you want to put in a tender to, say, Barclays Bank, offering to test their website for 1/12th your hourly rate, then be prepared for them to laugh their socks off. Your offer will definately be the lowest, but you still won't get the job." <br> <br>You don't test sites AFTER they're built. That's like building a house, and then going in to retrofit it to be accessible. It's a nightmare and incredibly expensive.  <br> <br>Building an accessible web site is fairly painless, provided you make that a design priority from the get-go. <br> <br>I completely sympathize with your problem, Steve. There are a lot of sites that aren't built well. Just don't equate that with an assumption that it takes a lot of effort to build an accessible web site that works in most browsers vs. IE only. <br> <br>Hrant...definitely look at Thunderbird. It doesn't come WITH Firefox...it's a standalone application.</p>
