    html: "<p>I'm really surprised to hear about certain sites not being usable with Firefox. I haven't fired up IE since I switched over a few months ago, and I've never had a problem with any site: banks, forums, whatever. And I can't see any reason why I should. It's IE that's the 'problem browser' -- you have to deviate from standards-compliance to make certain sites work with IE, not the other way around. <br> <br>And Hrant: so far as I remember Thunderbird will automatically import mailboxes and address books from pretty much anywhere. Bearing in mind that all of the Mozilla stuff is ultimately derived from Netscape code, I can't imagine even NS4 would be a problem (although is it a different core, ie not Gecko? I can't remember) ... <br> <br>R <br> <br></p>"
