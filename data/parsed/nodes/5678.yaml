    html: <p>&gt;&gt;Steve -- if you have the time...FF is still, after all, in beta. <br> <br>OK, I can spare 5 minutes for that, but Mozilla 1.7 has the same problems, so its not really a beta issue. <br> <br>While I'm not naive enought to think that there's any software out there without bugs, I am quite prepared to believe that the problems with these sites <i>may</i> be that they have been authored for IE, and that it <i>may</i> be the site that's at fault, rather than the browser. Though it <i>may</i> be, a bug with the browser, so I'll try to find time to report the sites all the same. <br> <br>&lt;attempt-to-make-myself-clear-without-causing-a-row&gt; <br>The point I was trying (and failing) to make to Darrel was, and is, that even where the website is at fault, if it doesn't work with Firefox or Mozilla, or Opera, or web TV, or Liberty boxes, its not necessarily down to lazy web developers. <br>Often its down to budgets. And in the real world of corporate web development where testing takes place during <i>and</i> after development, it is a crucial and significant part of the development budget, which <b>does</b> influence which browsers/devices are supported. <br>Sometimes, its also due to browser bugs. <br>&lt;/attempt-to-make-myself-clear-without-causing-a-row&gt;</p>
