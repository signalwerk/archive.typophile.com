    html: "<p>\"IDG NEWS: IE market share measured at 94.73 percent on July 6.\" <br> <br>What does the market share of a browser on desktop PCs in the office have to do with the market share of a targetted demographic of humans?  <br> <br>ALL browser stats like this are--for the most part--not relevant to USER prefs. Of course IE leads. It always will. As long as corporations by cheap PCs with Windows on them, there will be a large portion of people that HAVE to use IE from 9-5 (whether they actually prefer that browser or not). <br> <br>The incorrect assumption is that 95% of web users use IE 100% of the time as their preferred browser. <br> <br>\"Used in the sense or portability between browsers, accessibility does require significantly more effort to implement in many websites. \" <br> <br>I'm sorry, Steve, but that is just wrong. You design to standards, fix a few layout bugs in IE, and you're up and running. Accessibility is accessibility. When designing with accessibility in mind (a core part of good web design IMHO) then the browser issue is resolved along the way. <br> <br>HTML is HTML. Javascript is Javascript. CSS is CSS. Designing with those tools, you can go a long way. Again, there's a few hiccups in IE/PC that you need to design around, but these aren't budget-doubling issues. Just small annoyances that--if you know about them--you can easily design around. <br> <br>This is really no different than in the real world. Building an accessible house isn't prohibitively more expensive. It does take a tad more planning. But once you know the jist of accessible design, it becomes a non-issue. <br> <br>\"Why do you think that you see so many websites which list only IE and some 4th gen version of NN as supported browsers?\" <br> <br>Because there are a LOT of crappy, lazy web development firms that screw their clients...along with a LOT of crappy, old, out-of-date web sites. For whatever reason, a Fortune 500 company wouldn't dream of publishing an AR with an out-of-gamut photo, but thinks nothing of having their web site be completely inaccessible. <br> <br>\"he reason is that its just prohibitively expensive to test large functional websites on every browser/OS combination.\" <br> <br>I can't argue you on this point. That's simply wrong. It takes me all of 5 minutes to test in all the major browsers. Plus, you don't NEED to test in EVERY browser...you just need to make sure it's accessible.  <br> <br>\"But the important thing about a browser, to me, is that I can use the sites I want to use. \" <br> <br>Oh sure. No argument there. I'm just trying to make it clear that the reason there are a lot of IE-only sites is predominantly due to lazy/incompetant developers...rather than the myth that it's difficult to develop accessible web sites. (FYI, Firefox can spoof its useragent, so you can get around a lot of sloppy browser detection scripts fairly easily.) <br></p>"
