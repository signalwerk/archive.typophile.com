    html: "<p>I've been using Firefox for a few months now (since it was called Firebird). I like it very much, and use it for everything except Windows updates, which seem to require IE. <br> <br>I use Mozilla's Thunderbird for e-mail, and am very happy with this also. I used to use Eudora, but got tired of waiting for them to support Unicode. <br> <br>Hrant, I thoroughly recommend Firefox for use with Win XP. I'm afraid I don't know hot to move you mail boxes from NS4.72, but I found the switch from Eudora e-mail to Mozilla Thundebird to be painless: my mail boxes were flawlessly converted. </p>"
