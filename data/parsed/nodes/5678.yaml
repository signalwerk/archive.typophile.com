    html: <p>&gt;&gt;What does the market share of a browser on desktop PCs in the office... <br> <br>Those figures aren't for 'market share of a browser on desktop PCs in the office'. <br>They are based on a daily survey of about 30 million browsers hitting thousands of different Web sites. <br>You could also look at Jupiter Media who survey over 200 million browser hits a month. Their figures are pretty much the same. <br> <br> <br>&gt;&gt;there will be a large portion of people that HAVE to use IE from 9-5 (whether they actually prefer that browser or not).  <br> <br>And in what way is it relevant if someone is not using the browser they want to use? <br> <br> <br>&gt;&gt;You design to standards, fix a few layout bugs in IE, and you're up and running <br> <br>Obviously, because there are no bugs in any other browsers...and they all implement flawless standards flawleslly <br>Meanwhile back in the real world... <br> <br> <br> <br>&gt;&gt;It takes me all of 5 minutes to test in all the major browsers <br> <br>OK. <br>1. What's a major browser? <br>Given that you're saying everyone else should bother to test in a browser with a market share of less than 5%, how minor does a browser need to be for you not to bother testing? Still, its nice to see that you accept the principle of 'testing in all the major browsers'. Its just the numbers we disagree on then. <br> <br>2. Five minutes. What kind of web site is that? <br>I have nothing against small websites. Some of the best uses of the internet are small websites, with only a few pages. <br>But many of the useful things on the internet are in much larger sites. Your looking at a testing period of closer to 5 weeks than 5 minutes. <br> <br>Anyway, as I said, I don't want to get drawn in. Feel free to answer this post if you want the last word. <br>I don't want to continue this any longer.</p>
