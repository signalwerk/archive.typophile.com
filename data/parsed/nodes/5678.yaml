    html: <p>I think the tabs are more convenient than separate windows, since they don't clutter your taskbar/dock -- they're all together in the browser where they belong. Of course you can still open multiple Firefox windows if you want to. <br> <br>When I want to follow a link without losing my place on the current page, I find it very convenient to open the link in a new tab. Just middle-click the link (assuming your mouse has three buttons or clickable scroll wheel). Whenever I'm forced to use IE, I find myself middle-clicking links out of habit. You can also configure new tabs to load in the background, so you can open pages for later browsing without interruption. There's a Tabbrowser extension that adds tons of other options.  <br> <br>I remember hearing of an IE plugin that adds tabbed browsing, but I'm not sure how it compares.</p>
    html_clean: <p>I think the tabs are more convenient than separate windows, since they don't clutter your taskbar/dock -- they're all together in the browser where they belong. Of course you can still open multiple Firefox windows if you want to. <br> <br>When I want to follow a link without losing my place on the current page, I find it very convenient to open the link in a new tab. Just middle-click the link (assuming your mouse has three buttons or clickable scroll wheel). Whenever I'm forced to use IE, I find myself middle-clicking links out of habit. You can also configure new tabs to load in the background, so you can open pages for later browsing without interruption. There's a Tabbrowser extension that adds tons of other options.  <br> <br>I remember hearing of an IE plugin that adds tabbed browsing, but I'm not sure how it compares.</p>
