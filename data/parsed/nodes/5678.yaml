to run my page through all of the above browsers. <br> <br>Again, if you're designing to standards, it's even less of a deal. When you do that, the only odd-ones out are IE/PC, IE/Mac and NN4...which there are plenty of well documented workarounds for their quirks. <br> <br>I'm not trying to bash you Steve...I'm just trying to dispell the common myth that you (and many many others) perpetuate. This is part of the problem why you have to keep IE on your computer. Microsoft has developed a nice little catch-22 with their browser. Everyone uses because there are so many sites only developed with IE in mind. There are so many sites only developed with IE in mind because so many developers assume everyone uses IE on windows. This has pretty much enabled MS to not have to worry about fixing a badly broken and rather insecure browser. </p>"
