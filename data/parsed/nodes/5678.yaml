    html: <p>True, true. Compatability and sites that only function in IE are the big shot against a lot of these open-source browsers. Safari's <i>pretty</i> good about all that, and will be improving dramatically this fall, from what I hear. Except for a brief spate of IE-only browsing in college, I've <i>always</i> used multiple browsers. So, I guess it's just something I'm used to. <br> <br>I certainly have a preference when it comes to OS/hardware, but I use both. I'd probably be Mac-only (at home/home office) if it weren't for gaming and the fact that sometimes things get sent to me in PC-only formats. Also, Macs are more typesetting-friendly, which goes a long way for me. However, I wouldn't be surprised if Longhorn puts an end to a lot of differences in that arena.</p>
