    html: "<p>Steve: <br> <br>I know where those stats are from. My point which I may not have made clear is that those are simply browser stats. They say nothing about the preferences of an actual user. I use IE day-in, day-out at work. I hate it. But I have to use it. So, when I visit sites, I'm logged as an 'IE/PC' user, when, in fact, I'm much more of a 'Firefox/Mac' user.  <br> <br>There isn't a lot of statistics based on this. I did a bit of research once and found a few folks that had access to large national web sites and were able to break down stats by time of day. After 5, they'd see a 5% swing in the amount of Mac users, for example.  <br> <br>\"And in what way is it relevant if someone is not using the browser they want to use?\" <br> <br>If you go on those generic browser stats alone, you'll lock out some of your audience. If Mary logs into your site at noon to buy something with IE/PC great, you made a sale. When she gets home to buy another item, but you block her because she uses Firefox, well, you lost a sale...even though you pegged her as an IE/PC user. <br> <br>\"Obviously, because there are no bugs in any other browsers...and they all implement flawless standards flawleslly <br>Meanwhile back in the real world...\" <br> <br>What are you talking about, Steve? Did I say browsers had no bugs? Like I said, design to standards, fix the layout bugs in IE. Are there other bugs? Sure...but nothing major that will affect your site 99% of the time. If you have examples of this big Mozilla bugs that are a hindrance, please share them. <br> <br>\"1. What's a major browser? \" <br> <br>Windows: IE 5+, latest Opera, Latest Mozilla(S), NN4 (I still check that one).  <br> <br>OSX: Latest Safari, Latest Mozilla(s), Latest Opera, Latest Omniweb <br> <br>OS9: IE5 (blech) <br> <br>Linux: Konquerer <br> <br>Other: A text browser, JAWS, etc. <br> <br>\"2. Five minutes. What kind of web site is that? \" <br> <br>Pretty much any. It takes me less than 5 minutes to run my page through all of the above browsers. <br> <br>Again, if you're designing to standards, it's even less of a deal. When you do that, the only odd-ones out are IE/PC, IE/Mac and NN4...which there are plenty of well documented workarounds for their quirks. <br> <br>I'm not trying to bash you Steve...I'm just trying to dispell the common myth that you (and many many others) perpetuate. This is part of the problem why you have to keep IE on your computer. Microsoft has developed a nice little catch-22 with their browser. Everyone uses because there are so many sites only developed with IE in mind. There are so many sites only developed with IE in mind because so many developers assume everyone uses IE on windows. This has pretty much enabled MS to not have to worry about fixing a badly broken and rather insecure browser. </p>"
