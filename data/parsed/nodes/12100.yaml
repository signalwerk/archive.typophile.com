    <p>Hello all,</p>
    <p>I’ll be getting started on a redesign for a healthcare book that used Optima as the headline style and Garamond as the body. This new book is part of a series and the publishers want to stick with Optima as the headline style but is willing to consider another body face. Does anyone have any suggestions for me to explore? Any help would be greatly appreciated. Thanks!</p>
    <p>Tammy</p>
