    <p>I know this typeface, I've used it, but I cannot remember the name of it and it's killing me!<br>
    The Js, Fs and Es are quite narrow, and there's a distinctive G.<br>
    Hopefully this is a simple ID for someone with better typeface ID expertise than me. Thanks in advance.</p>
