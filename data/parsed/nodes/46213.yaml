    <p>Any Metalocalypse fans out there? </p>
    <p>I'm trying to figure out what font they use... its unbelievably metal. Found a couple that are close but not quite, House's Blaktur and P22's Canterbury among them... both are also pretty metal.</p>
    <p>An example can be found here:<br>
    <a href="http://www.axelmusic.com/resources/covers/back/053939797725.jpg" title="http://www.axelmusic.com/resources/covers/back/053939797725.jpg">http://www.axelmusic.com/resources/covers/back/053939797725.jpg</a></p>
    <p>Thanks rockers<br>
    Go Font and Die.</p>
