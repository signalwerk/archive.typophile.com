      <p>Clearly this is a European forum (and I don't even know if I should capitalize that, or now if I should put an "s" instead of a "z" in capitalize, lol).</p>
      <p>Here in the U.S., I would bet that an exceedingly small percentage of the population knows the correct usage of England, Britain, United Kingdom, or Commonwealth for that matter. We're that isolated and provincial. In fact, most of the population can't distinguish between Scottish, Welsh, English, Australian, and South African accents. They are all "British accents." It's pretty revealing. But it's not because they are sloppy or stupid, it's because they simply don't know any better and have never had reason to educate themselves on the matter. You don't go out and learn particle physics just because one day you might run into a particle physicist.</p>
      <p>And worst of all, here in the U.S. most people don't bat an eye, or even recognize an issue, when the country is referred to "America". We are, after all, Americans. You just have to watch "Team America: World Police" to understand that. :)</p>
      <p>I can appreciate why you find the erroneous usage irksome, but it's your damn fault for having such a complicated geopolitical nomenclemature. :P</p>
