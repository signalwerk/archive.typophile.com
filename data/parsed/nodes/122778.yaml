      <div class="comment-spam-body"><p>That is certainly one way to look at it. And I have to admit, I also used 'England' to refer to Britain. But then I became aware of the different meanings. Once you know the difference, it is hard to fall back to your incorrect habit (at least for me). To be honest, when someone says "I've never been to England", I would respond with "And what about Wales or Scotland?". Not to be pedantic, honestly. But because I hear and read the correct terminology every day, in British media. I am used to it now.<br>
      People in the Netherlands might as well use 'Brittannië', which only has one more syllable than 'Engeland'. The Afrikaans -derived from Dutch- speaking inhabitants of South Africa got it right. They primarily use 'Brittanje' to refer to Britain. So why not us? But you are probably right about the colloquial language.<br>
      A lot of Americans say 'England' instead of Britain too. Funny actually. I guess the only people who get it right are the British themselves. And the Irish.</p>
      </div>
