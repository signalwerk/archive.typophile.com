      <p><cite>Then you don’t get all worked up about “wrong” usage, because you understand it might not really be wrong, but just “different” from your own usage.</cite></p>
      <p>Since England and Britain are <em>proper nouns</em>, even if one disdains prescriptivism in general, the terms right and wrong do apply, because those words are <em>names</em>, like the names of people, or like trademarks.</p>
      <p>Of course, there are exceptions even to this generalization.</p>
      <p>So I'm going to open up the <em>really big</em> can of worms associated with this topic.</p>
      <p>Thus, in English, "the Americas" is a body of land that includes North America, Central America, and South America. In French, the term for that same body of land is "Amèrique", and something similar is true for other Romance languages, including Spanish.</p>
      <p>At one time, decades ago now, the official name of Brazil was "Los Estados Unidos do Brasil".</p>
      <p>The official names of a few countries are, or were:</p>
      <p>The Dominion of Canada<br>
      The Commonwealth of Australia<br>
      République Française (The Republic of France, <em>lit.</em> French Republic)<br>
      The United States of America<br>
      The Union of South Africa<br>
      Los Estados Unidos do Brasil (The United States of Brazil)</p>
      <p>The pattern is clear; it is &lt;form of government&gt; of &lt;name of country&gt;.</p>
      <p>So these names referred to Canada, Australia, France, America, South Africa, and Brazil respectively.</p>
      <p>At least, this suits English speakers quite well, and makes perfect sense to them. America is one country, and the Americas are two continents linked by an isthmus.</p>
      <p>But in the Romance languages, the word for the Americas is their cognate to "America". This causes a great deal of confusion, and has led some people to claim that the conventional English usage of "America" for the United States of America is in some way bigoted or exclusionary or ignorant and so on.</p>
      <p>One way to reply is to note that neither Jamaica nor Ontario nor Guyana are part of "British Columbia". And what about the country that dares to call itself Colombia?</p>
      <p>Because Columbia is also a name for the lands discovered by Columbus - the Americas - as witness its use by Americans - the song "Hail Columbia", the name of CBS, the Columbia Broadcasting System.</p>
    html_clean: |-
