      <p><cite>Well, that depends. Foreigners saying 'England' when they mean Britain might understand each other. But once that persons speaks to a British person, than that person is the troublemaker.</cite></p>
      <p>If one uses words which can be misunderstood (or even offending) in a CERTAIN context, this can of course be a problem. No one is arguing about that I guess. </p>
      <p>But you generalize. You just throw around the words “right” and “wrong”, but they are not clear as you wish them to be. The words you are talking about are “right” and “wrong” according to YOUR specific knowledge or a specific source –&nbsp;or even a whole country. But that does not mean that these definitions are relevant for everybody in every context, past, present and future. That’s not how language works. </p>
      <p>Also, I am pretty sure that your own language is full of the “ignorance” you assign to others. Have you checked every word you use back to it’s roots hundreds or thousands of years ago and have you checked if they are “right” and unambiguous in every context? Probably not! You just assume correct usage through how you hear others talk and what you have learned and read. And through exactly that process others learn to say England and Holland and so on.<br>
      Words are no laws of nature – they change all the time. And yes, this can mean that old “errors” become the new “right”. Happens since thousands of years.<br>
      You can’t just pick one option and declare it “right”. That goes even for dictionaries. What do you think they list? They list accepted meanings among certain people at the time the dictionary was written. But since language changes all the time, people might move away from the meaning of the dictionary entry and then at some point the dictionary simply would have to change and remove that old meaning or deem it “out-dated”. </p>
      <p>There is nothing wrong with nudging people in the right direction, when you notice a usage of words which can be problematic. I actually do that all the time myself. But always mind the context and the conventions in this context. Then you don’t get all worked up about “wrong” usage, because you understand it might not really be wrong, but just “different” from your own usage.</p>
