      <p>Maybe you also need to get aware what “correct” means in the context of word use. ;-)<br>
      Words are just symbols which stand for ideas or objects in the physical world. Person A wants to talk about a certain object “O” and uses the symbol “X” to represent it in spoken or written language. Person B hears the symbol “X” and instantly thinks of the object “O”, just as A meant it. This was then a successful talk, because A and B understood each other perfectly well.<br>
      So should this be automatically “incorrect” just because there is a person C that does not connect “O” and “X” in the same way? As user R. already pointed out in a post above: it’s usually actually C who is the troublemaker because he deliberately tries to interfere with established and well understood conventions.</p>
