      <p><cite>I might be overreacting here</cite></p>
      <p>Yup. You know perfectly well what someone is telling you if she says (in Dutch or German or French or …): ‘I’ve never been to England’. This means that the linguistic convention—‘England’ by default refers to the UK—works in those languages. Everybody, including you, gets the intended meaning. So, why would you want to impose a different convention and try to ‘educate’ others? Linguistic symbols (e.g. words) are more or less arbitrary anyway: It doesn’t really matter whether we call the United Kingdom ‘the United Kingdom’, ‘England’, ‘Albion’ or ‘Gnushty’—as long as everybody gets the intended meaning. That’s the case. It might be unfortunate that the colloquial naming convention in some languages (UK = England) conflicts with a naming convention that’s used in other contexts (UK ≠ England), but these contexts seldom overlap and misunderstandings rarely arise (and if they do, they can usually be sorted out quickly). This means that the convention you suggest is actually worse than the one in place: Instead of being able to say ‘Engeland’, people would have to say ‘Groot-Brittannië’, which is longer and more difficult to spell, without much added benefit in everyday language (excluding precision for precision’s sake and the satisfaction of having avoided confusion that wasn’t even there in the first place). So, what I’m trying to say is: Understand that in different linguistic contexts, different things matter (most)—for instance brevity and simplicity in colloquial language or precision in scientific language. No one asks you to ever say ‘Engeland’ if you find this all too brief and simple, but I don’t see a valid reason to foist your discomfort with a perfectly normal linguistic convention on others.</p>
