      <p>Incidentally, to return to the original topic, just as the fact that the people of the United States are called American reinforces the use of America for the nation, and not for the Americas, the confusion between England and the whole United Kingdom is somewhat reinforced by the usual job title of a certain individual residing in England.</p>
      <p>Her Majesty Queen Elizabeth the Second is usually referred to as the Queen of England, not the Queen of Britain, the Queen of the United Kingdom, or the Queen of the British Commonwealth of Nations, though she reigns over all the places those names include.</p>
      <p>Of course, the historical root of that is simple enough; England, with its royal house, conquered and ruled over Wales, Scotland, and Ireland. Which is the real historic reason that Britain and England sometimes get confused.</p>
      <p>I mean, there's another part of the world that includes the national homelands of the Uighurs and the Tibetans, and yet we just call it China - of course, it calls itself China too (sort of... it calls itself China in English; its word for itself in Chinese is different), which makes the situation somewhat different from that of the United Kingdom.</p>
      <p>Thus, just as when dealing with the People's Republic, the people you will be negotiating with will usually be Chinese, with Uighurs and Tibetans and Yi and Mongols and so on not getting a lot of input, at least historically, when negotiating with Britain, it would be Englishmen one would be talking to, with the Welsh and the Scots just having to put up with whatever the English decided. And what with the Netherlands being so close to Britain, they may have had enough dealings with it that the cognate of England might even be their language's <em>word</em> for Britain.</p>
