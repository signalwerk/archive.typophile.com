      <p><cite>I believe the rest of the world should follow this example.</cite></p>
      <p>This usage may be imprecise and can be confusing, so it’s certainly not recommended for journalistic or scientific texts. In colloquial usage (outside the UK), however, it is too widespread to be likely to disappear in the near future—regardless of your valiant awareness campaign. You can probably see where this comes from: In many contexts (outside the UK), the distinction England/Great Britain/United Kingdom is not relevant because only one of these entities is discussed (typically the UK), so there can be no confusion. In this case, speakers of several languages just pick the shortest term. And as you noted yourself, confusion only arises when someone (e.g. you) deliberately misunderstands this usage and tries to teach others how to avoid a non-existent problem. I assure you that, if people felt that using ‘England’ to refer to the UK led to noticeable confusion, they would stop doing so. But they don’t.</p>
