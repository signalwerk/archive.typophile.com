  html: |-
    <p>I'm hoping someone has experience or a good hunch here.<br>
    I've been using Tribute for headlines and body on product labels, as well as throughout the brand.<br>
    Now I need to size down the supporting copy (all choppy fact bites) on the labels to 8/9 pt, add more of it, and think it's time to add a sans. </p>
    <p>Thoughts for what sans might feel good with Tribute and have a straightforward factual style?<br>
    Thanks so much in advance.</p>
