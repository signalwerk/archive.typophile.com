      <p>My <a href="http://www.myfonts.com/fonts/shinn/sensibility/" rel="nofollow">Sensibility</a> is very compact humanist sans, with eight weights, so would give you a lot of design ﬂexibility. Its partner <a href="http://www.myfonts.com/fonts/shinn/sense/" rel="nofollow">Sense</a> is plainer, but also with the marked overshoot of ascender over cap that would harmonize with Tribute.</p>
      <p>My <a href="http://www.myfonts.com/fonts/shinn/brown/" rel="nofollow">Brown</a> is more straightforward and also semi-condensed, and its detailing gives it a slightly old school/letterpress quality to match Tribute.</p>
      <p>Storm’s <a href="http://www.myfonts.com/fonts/storm/sebastian-pro/" rel="nofollow">Sebastian</a> has classic old style proportions, as do Mr Eaves and Brandon Grotesque with their small x-height.</p>
