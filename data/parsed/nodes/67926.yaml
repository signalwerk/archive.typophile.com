      <p>Oh help, is that <a href="http://www.dafont.com/harabara.font" rel="nofollow">Harabara</a>?<br>
      Try actually using Helvetica. I know you're not supposed to change the font, but Harabara is nothing but a bad ripoff of Helvetica with some corners broken off, so the flavor isn't really going to change. You could still remove some parts and round some corners if needed, but it's very likely to end up cleaner.</p>
