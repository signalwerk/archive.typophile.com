    html: |-
      <p>Acrobat tries to match the weight and proportions of the missing font, then modifies either Adobe Sans or Adobe Serif to match as near as possible. So, what it looks like it’s simulating is a very light serif font with an unusually narrow S and T and wide lowercase letters. My guess would be ITC Serif Gothic Extra Light. </p>
      <p></p><div class="imageWrap"><img src="/files/serif-gothic_5901.gif"></div><p></p>
    html_clean: |-
