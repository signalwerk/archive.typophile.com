    <p>I have a copy of CS3 Design premium and put it up on Craigslist. This guy almost immediately contacts me with his number and wants to buy it. Then I see the same phone number on another post offering to buy all these software programs. What's his deal? Why would he want to buy all this software? Am I missing an opportunity for more cash? Is he bootlegging it? Anyone have an idea?</p>
    <p><a href="http://sfbay.craigslist.org/scz/wan/4008031709.html" title="http://sfbay.craigslist.org/scz/wan/4008031709.html">http://sfbay.craigslist.org/scz/wan/4008031709.html</a></p>
