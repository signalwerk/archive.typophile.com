    html: <p>The absolutely most stable platform I ever used was Windows NT. I'd use it &amp; watch my wife's Mac crash &amp; crash, but NT just kept plugging along. I'd use it today if the software would work &amp; if it would take the needed memory with all the new stuff. Sadly, Microsoft never got one as stable again...</p>
