    html: <p>There are a lot of people who don't want to go to the Cloud. And there is a lot of layout work that doesn't require anything more than CS3. And the bugs are known, &amp; there are probably fewer of them. In other words, it could be a legitimate notion of how to make some money, as well as an illegitimate one.</p>
