      <p>&gt; watch my wife's Mac crash &amp; crash</p>
      <p>The early Macs did that a lot, I often got daily crashes. It got much better with OS-X (10). I'll have applications freeze occasionally (mostly Adobe stuff) but rarely have system crashes.</p>
