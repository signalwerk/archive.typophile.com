    <p>Aloha Typophiles!</p>
    <p>Cape Arcona Type Foundry is proud to announce our new release!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/side-0_4937.jpg"></div><p></p>
    <p>CA Cula is standing in the tradition of cool tempered sans serif typefaces like DIN. But at a closer look it reveals a tendency towards rounder reading-friendly forms. The denaturalized ink traps give CA Cula a very special and individual look in display sizes, whereas in smaller sizes the positive aspects of huge ink traps show effect. The text looks clean and bright without black dots in the typographic image. This makes CA Cula suitable even for longer text, while the bold weight makes pretty cool headlines.</p>
    <p>If you are looking for the <strong>extra fat kick,</strong> look out for CA Cula Superfat. </p>
    <p>Oh, <strong>CA Cula Light</strong> is for free. :)</p>
    <p>It is available at <a href="http://www.cape-arcona.com/start.php?link=cula" rel="nofollow">Cape Arcona Type Foundry</a></p>
    <p>and at <a href="http://new.myfonts.com/fonts/capearcona/ca-cula" rel="nofollow">Myfonts.com</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/side-1_3718.jpg"></div><p></p>
