      <div class="comment-spam-body"><p>The German expressionist font used in your poster is called Habsburg. It was designed by Heinrich (Heinz) Keune at J.G. Schelter &amp; Giesecke, Leipzig, in 1903. He also designed a narrower version called Wittelsbach. Here are two fonts as shown in a S&amp;G Schriften und Initialen type specimen book from the era </p><div class="imageWrap"><img src="http://typophile.com/files/HabsburgSM_6529.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/WittelsbachSM_6650.jpg"></div> Adapted from photos by Ben Mitchell on Flickr <a href="https://www.flickr.com/photos/ohbendy/13911086473/in/photostream/" title="https://www.flickr.com/photos/ohbendy/13911086473/in/photostream/">https://www.flickr.com/photos/ohbendy/13911086473/in/photostream/</a><br>
      AFAIK neither font has been digitized.<br>
      However, as previously suggested, Moritz is almost identical and would work as a digital substitute.<br>
      Don<p></p>
      </div>
