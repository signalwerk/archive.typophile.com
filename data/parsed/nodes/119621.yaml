      <p>Edited:<br>
      SeveralEuropean foundries had fonts of this general design during the early 20th century. Schelter &amp; Gieseke of Germany had several. Dan X. Solo digitized one from  the Brussels foundry of Van Loey-Nouri and called it Moritz <a href="https://www.myfonts.com/fonts/solotype/moritz/" title="https://www.myfonts.com/fonts/solotype/moritz/">https://www.myfonts.com/fonts/solotype/moritz/</a><br>
      Don</p><div class="imageWrap"><img src="http://typophile.com/files/MoritzInUse0_5863.gif"></div><div class="imageWrap"><img src="http://typophile.com/files/MoritzInUse1_5975.gif"></div><div class="imageWrap"><img src="http://typophile.com/files/MoritzInUse2_4622.gif"></div><div class="imageWrap"><img src="http://typophile.com/files/MoritzInUse2a_4649.gif"></div><div class="imageWrap"><img src="http://typophile.com/files/MoritzInUse3_4234.gif"></div> <a href="https://www.myfonts.com/fonts/solotype/moritz/" title="https://www.myfonts.com/fonts/solotype/moritz/">https://www.myfonts.com/fonts/solotype/moritz/</a><br>
      Don<p></p>
