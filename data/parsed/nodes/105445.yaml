    html: <p>As you said, painted so not-a-font. Can't say it could considered as close but you may like some of the digitizations of <a class="freelinking external" href="http://www.myfonts.com/search/de+vinne" rel="nofollow">De Vinne</a> (Grand Central, Denver, Romana, Publication...). May having a look to <a class="freelinking external" href="http://www.myfonts.com/foundry/Nicks_Fonts" rel="nofollow">Nick Curtis</a> and <a class="freelinking external" href="http://www.myfonts.com/foundry/Jeff_Levine" rel="nofollow">Jeff Levine</a>'s collections, they have both digitized many signage letterings.</p>
