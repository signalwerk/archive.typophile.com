    html: <p>Multiple master fonts never were a big hit commercially. I've got about three dozen of them and I think that was about how many were made.  <br> <br>But, they do work well on pre-OS X systems and, quite frankly, will for quite some time. OS X didn't exactly come out during the best of economic times and it still hasn't pulled over the "majority" of folks, or so the reports from MacWorld indicate. <br> <br>Problem with Multiple Masters was that they were •••-backwards. Works better to extrapolate from the medium point not interpolate from the end points. Like QuickDraw GX did back in 1994. <br> <br>Still waiting, and waiting for OpenType to look spectacular. Starting to look like just another format isn't it? <br> <br></p>
