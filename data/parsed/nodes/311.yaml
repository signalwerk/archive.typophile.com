    html: <p>i think kyle is absolutely right. forget multiple master, it's hardly breathing anymore. <br> <br>there probably isn't a correct way and it usually depends on the kind of design you're working on. i personally have found it to be efficient to work both ways at the same time. you can use the "change weight comand - resize to x-height" as a sort of reference and also to get your accents, punctuation etc. you still have to tweak those, but it's less of a hassle then also tweaking all the main letters from that. those you should definately draw manually. <br> <br>it also helps layering all weights of one character atop of each other and optimizing the "new" weights right there in one window in comparisson with your finished regular weight.</p>
