    html: <p>FontLab 4.5 ships with a demo Python script called 'Family Generator', which automatically produces a Light, Bold and Heavy design from a Regular. Of course, the results are never perfect and always require manual editing to clean them up, but depending on your design this can be surprisingly effective as a first step. The other thing to realise, of course, is that you can <i>edit the Python script</i>, and so tailor the weight and width adjustments made by the script to your design.</p>
    html_clean: <p>FontLab 4.5 ships with a demo Python script called 'Family Generator', which automatically produces a Light, Bold and Heavy design from a Regular. Of course, the results are never perfect and always require manual editing to clean them up, but depending on your design this can be surprisingly effective as a first step. The other thing to realise, of course, is that you can <i>edit the Python script</i>, and so tailor the weight and width adjustments made by the script to your design.</p>
