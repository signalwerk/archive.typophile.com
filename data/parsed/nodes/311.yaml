    html: <p>I heard Jonathan Hoefler describe the development of  <br><a href="http://www.typography.com/catalog/champion/index.html" target="_blank">Champion</a> in the same way Thomas describes. Of <br>course that was 4 years ago, so I'll have to fudge the  <br>details. But in essence the method is to start with the  <br>regular weight, then manually design the extremes (the  <br>widest black and the narrowest thin). Then have the  <br>software create the basis for the intermediate weights. (If   <br>my memory is correct, the software would've generated 3  <br>weights of Champion.) Then of course, there is a lot of  <br>cleanup work to do to add some human care/finesse to the  <br>intermediate weights. <br> <br>In other words, the computer can help take some of the  <br>tedium out of the process, but it can't make up for  <br>attention to detail.</p>
