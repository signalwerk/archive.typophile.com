    html: <p>One should consider that multiple master can be used as a design tool, without ever generating multiple master fonts in the end. Most recent Adobe fonts were designed in MM space, without ever being built as MMs. <br> <br>Personally, I would add a weight axis to the regular, design the black weight, extrapolate the light weight, set it as the new master at the light end, and then clean it up. <br> <br>One good piece of advice Robert Slimbach gave me on the family I'm working on right now was that designing the extreme masters and interpolating really helps the intermediate weights come out better. It forces you to fix things in the extreme masters that might not be so noticeable in intermediate weights. <br> <br>Cheers, <br> <br>T</p>
    html_clean: <p>One should consider that multiple master can be used as a design tool, without ever generating multiple master fonts in the end. Most recent Adobe fonts were designed in MM space, without ever being built as MMs. <br> <br>Personally, I would add a weight axis to the regular, design the black weight, extrapolate the light weight, set it as the new master at the light end, and then clean it up. <br> <br>One good piece of advice Robert Slimbach gave me on the family I'm working on right now was that designing the extreme masters and interpolating really helps the intermediate weights come out better. It forces you to fix things in the extreme masters that might not be so noticeable in intermediate weights. <br> <br>Cheers, <br> <br>T</p>
