    html: "<p>Hrant,  <br> <br>no -- that's why it's called RoboFab (a name that could be expanded into something like Robotic Fabulous FontLab). There is more in-depth comments about the ideas behind it on the FontLab-Scripting list: <a href=\"http://mail.letterror.com/pipermail/fontlab-scripting/2003-July/thread.html\" target=\"_blank\">http://mail.letterror.com/pipermail/fontlab-scripting/2003-July/thread.html</a>  <br>(just read everything for July).  <br>The RoboFog MkII was supposed to be free of the Fontographer code, but it seemed like completely writing a font editor in Python from scratch was a bit too heavy. But now, with Just's FontTools (in-depth technical font manipulation) and Yuri's FontLab (a more abstract and more universal toolset), the Dutch Connection and House's Tal Leming seem to be back in game <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\">  <br>Adam</p>"
