  html: "<p>In my friday fonts efforts, I'm getting close to having one weight just the way I want it. Next I  <br>want to start thinking about other weights. What is the \"right\" way to go about this. I have  <br>a regular version, and I want a light, regular, bold, and heavy. <br> <br>In looking through the FontLab pdf manual I got this idea: If I draw up the heavy version  <br>next, taking care to use similar points to define the outlines, can I use that and the  <br>regular version I have to create a multiple master for the bold? From there, I could  <br>extrapolate to the light version. I imagine it will take some tweeking to get these intermediate  <br>weights the way I want them.  <br> <br>My questions are these: <br>How hard is it to set up a mulitple master from two weights? How much tweaking is  <br>neccessary? Will this save time, or cause more of a headache? Does this make any  <br>sense at all? <br> <br>Thanks for your thoughts! <br>Randy</p>"
  html_clean: "<p>In my friday fonts efforts, I'm getting close to having one weight just the way I want it. Next I  <br>want to start thinking about other weights. What is the \"right\" way to go about this. I have  <br>a regular version, and I want a light, regular, bold, and heavy. <br> <br>In looking through the FontLab pdf manual I got this idea: If I draw up the heavy version  <br>next, taking care to use similar points to define the outlines, can I use that and the  <br>regular version I have to create a multiple master for the bold? From there, I could  <br>extrapolate to the light version. I imagine it will take some tweeking to get these intermediate  <br>weights the way I want them.  <br> <br>My questions are these: <br>How hard is it to set up a mulitple master from two weights? How much tweaking is  <br>neccessary? Will this save time, or cause more of a headache? Does this make any  <br>sense at all? <br> <br>Thanks for your thoughts! <br>Randy</p>"
