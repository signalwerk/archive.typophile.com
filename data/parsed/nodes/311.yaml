    html: "<p>You'll get different answers about the \"right way\", but to me best compromise is what I did in Patria: <br> <br>1) Assuming you have a non-extreme weight at hand, use the software's \"weight change\" to make the light and dark extremes. Confine to the x-axis. <br>2) Tweak like there's no tomorrow, specifically by decreasing the contrast in the light extreme while increasing it in the dark. But you should also adjust the overshoots: the lighter the greater. <br>3) Create a new intermediate of where you started, and compare it to your original. Assuming you still like your original better, tweak the two extremes (not the resultant intermediate) to get back to where your original was. <br>4) Once you end up with extremes that you like, and they generate your original intermediate weight to your liking, you're done. You shouldn't have to tweak any intermediates at all. In general.  :-) <br> <br>Two words of caution: <br>1) Very light weights reveal problems in stroke thickness very obviously. <br>2) Very dark weights can get too pudgy. It takes a lot of expertise to put the sparkle in them - few people can manage - I for one can't. Look at the darkest weights of Galliard for guidance there. <br> <br>BTW, you don't have to make an actual MM font - in fact most users would have trouble with that! Just have your axis \"internal\" to your font app, and generate the necessary intermediate weights. Four weights is a good number - too many weights and some users can get confused. If you have very light and dark weights, go to 6. <br> <br>Spacing the weight gradation is   v e r y   t r i c k y ...  and very open to personal preference. <br> <br>hhp <br></p>"
    html_clean: "<p>You'll get different answers about the \"right way\", but to me best compromise is what I did in Patria: <br> <br>1) Assuming you have a non-extreme weight at hand, use the software's \"weight change\" to make the light and dark extremes. Confine to the x-axis. <br>2) Tweak like there's no tomorrow, specifically by decreasing the contrast in the light extreme while increasing it in the dark. But you should also adjust the overshoots: the lighter the greater. <br>3) Create a new intermediate of where you started, and compare it to your original. Assuming you still like your original better, tweak the two extremes (not the resultant intermediate) to get back to where your original was. <br>4) Once you end up with extremes that you like, and they generate your original intermediate weight to your liking, you're done. You shouldn't have to tweak any intermediates at all. In general.  :-) <br> <br>Two words of caution: <br>1) Very light weights reveal problems in stroke thickness very obviously. <br>2) Very dark weights can get too pudgy. It takes a lot of expertise to put the sparkle in them - few people can manage - I for one can't. Look at the darkest weights of Galliard for guidance there. <br> <br>BTW, you don't have to make an actual MM font - in fact most users would have trouble with that! Just have your axis \"internal\" to your font app, and generate the necessary intermediate weights. Four weights is a good number - too many weights and some users can get confused. If you have very light and dark weights, go to 6. <br> <br>Spacing the weight gradation is   v e r y   t r i c k y ...  and very open to personal preference. <br> <br>hhp <br></p>"
