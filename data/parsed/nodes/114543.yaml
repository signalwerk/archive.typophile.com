      <p>Even with a <a class="freelinking external" href="http://somethingtiny.com.au" rel="nofollow">better sample</a>, I wasn't able to spot a match. Actually, the more I look at it the more I think it's (almost) all customized. Everything looks "constructed". /t/i look to share the exact same backbone, same for /u/h. I can't even state if the base font was formerly a slab serif.<br>
      For what it's worth, I'd probably start with some font like <a class="freelinking external" href="http://myfonts.us/td-6q2zjK" rel="nofollow">Insigna</a>, reconstructing /i from /t and adding slab serifs to the whole thing.</p>
