    html: |-
      <p>That looks like the original logo, which was done in the 50's, before digital type.I always assumed it was hand-drawn to resemble the stenciling sometimes seen on buildings (presumably in the West Side of Manhattan).</p>
      <p>I seems like it could be easy enough to fake the same look with fonts.</p>
      <p>- Mike Yanega</p>
