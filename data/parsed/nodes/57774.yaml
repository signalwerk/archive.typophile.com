    html: |-
      <p>My guess is that the designer started out with wood type, which was enjoying a revival of popularity at that time. If so, the distressing might be genuine.<br>
      The "stencil" lines are too thin to have been functional in a real stencil, but the designer may have added them to suggest the stencilled labels on packing crates at the docks along the Hudson River.</p>
