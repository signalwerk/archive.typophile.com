  html: |-
    <p>Has anyone ever attempted to convert the Hershey Vector fonts (seen here <a href="http://www.batbox.org/font.html" title="http://www.batbox.org/font.html">http://www.batbox.org/font.html</a> and here <a href="http://emergent.unpythonic.net/software/hershey" title="http://emergent.unpythonic.net/software/hershey">http://emergent.unpythonic.net/software/hershey</a>) to a standard/modern format?  Obviously it would be impossible to keep them as pure lines, but it seems like someone would have used them for a thin typeface or one designed to be used with strokes.</p>
    <p>Second question: if no one has done this yet, is it a suitable project for a beginner?</p>
  html_clean: |-
    <p>Has anyone ever attempted to convert the Hershey Vector fonts (seen here <a href="http://www.batbox.org/font.html" title="http://www.batbox.org/font.html" class="link-external">http://www.batbox.org/font.html</a> and here <a href="http://emergent.unpythonic.net/software/hershey" title="http://emergent.unpythonic.net/software/hershey" class="link-external">http://emergent.unpythonic.net/software/hershey</a>) to a standard/modern format?  Obviously it would be impossible to keep them as pure lines, but it seems like someone would have used them for a thin typeface or one designed to be used with strokes.</p>
    <p>Second question: if no one has done this yet, is it a suitable project for a beginner?</p>
