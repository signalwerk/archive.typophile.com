    html: |-
      <p>Very nice. Your ampersand is quite like the Linotype Univers ampersand with its very definite horizontal bar. </p>
      <p>I wouldn't worry too much about this being a very saturated market, unless you earn a living from it it is just nice to craft something you can be proud of. I particularly like the curved base on the lowercase 'v' and 'w'. I can see this working really well in a corporate situation as it is very distinctive without being over-bearing.</p>
