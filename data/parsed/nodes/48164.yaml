      <p>Hi,<br>
      I quite like this. With all the other modern sans designs out there, it might not be easy to make it a commercial success, but perhaps that's not the reason you are making this.<br>
      I like this ampersand, its forms and proportions are neat.<br>
      For me, the D and N are a bit wide. I wonder if the bottom right leg of the k could be chopped like the top (not horizontal ending). I think the tail of the Q could move right a bit?<br>
      j might need a longer base. y looks too narrow and needs more space, and the brackets () too thin and pointy (this kind of tapering is not seen in any other glyph).<br>
      I like the @.<br>
      Just some ideas...see what you think :)</p>
