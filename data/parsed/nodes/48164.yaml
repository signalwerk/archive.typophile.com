      <p>Hi Rui,</p>
      <p>I have 2 thoughts:  I find this looks too close to Neo Sans. It also reminds me of other square sans designs like Apex, Amplitude and Stainless. Which brings me to my second thought: There are so many square sans designs out there. It's a saturated area in type. </p>
      <p>Also: The more mechanical a typeface looks, the more anonymous and undifferentiated I find it. Is there something really fresh or distinctive you can do with this? Right now it doesn't seem like it has its own identity.</p>
