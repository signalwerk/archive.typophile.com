      <p>Okay, first my thanks to Ricardo—again—for pointing me to <a class="freelinking-external" href="https://web.archive.org/web/20080821124626/http://typophile.com/node/34373">the earlier thread</a>. There I found a link to <a class="freelinking-external" href="https://web.archive.org/web/20080821124626/http://www.fontshop.be/details.php?entry=161">An Intro to Type Design</a>. I’ve already read both and asked Unzipper when “the second and third episodes ... on the [type designer as] the craftsman and the technician respectively” will appear.</p>
      <p>After that I went to Amazon and located a boatload of books on designing type, typefaces, and fonts. Too many looked worthwhile to buy any yet, so I started by ordering half a boatload of them from my public library.</p>
      <p>I cannot quite put my finger on why the interest at all, and why just now. But I find myself considering trying my hand at designing a typeface family purely as a creative exercise. I suppose it could make me a better book designer/typesetter/page compositor/typographer, etc. (I am never 100% sure what to call myself.) That said there are difficulties, and I definitely feel the need to expand some on all I’m saying here on <a class="freelinking-external" href="https://web.archive.org/web/20080821124626/http://www.tianodesign.com/blog">my blog</a>.</p>
      <p>I repeat: I do not draw or paint. Never felt I could.</p>
      <p>Still, I’ve decided that the the best reasons, as I have gleaned from the earlier thread, why one bothers to try to design a typeface, are:</p>
      <p>as [new typefaces] are put out in the world and used they get associations attached to them. This of course can work for us in reinforcing the meaning that we are trying to communicate …</p>
      <p>I take this to mean that branding may take place. I’m reminded of a certain bakery brand that’s sold in NY—I think I’ve seen it in other parts of the country, too, but it originates here (on Long Island). I don’t know that the typeface that their name is written in was created for them originally, but it is definitely identifiable as theirs. I first learned this when I noticed an auto body shop that I pass regularly had a sign that looked so familiar to me and yet I couldn’t place why that it really bothered me. I stopped my car and stared for awhile. Driving away, I had an aha moment when I realized it was the same typeface as the bakery brand used.</p>
      <p>making the type better for the reader</p>
      <p>As a book designer and layout artist that’s my number one objective: to bring the author’s work to readers clearly and in a way that is easy on their eyes. I want to encourage them to read the book completely and with maximum comprehesion.</p>
      <p>… arrogance and vanity. Possibly.</p>
      <p>All the above goes to my simplified  take,  if you will, on why I might want to try my hand at designing a typeface family. My reasons are not necessarily good ones; they obviously are not the only reasons to take on such a project. That said, I move on to figuring just what this entails.</p>
      <p>My list of physical tasks to do may not be complete. I may be unaware of any number of steps. And my steps could be out of a correct order. Please let me know what I m missing and where I ve gone wrong.</p>
      <p>First a question. I use the word  draw  below, for want of any other better term. It sounds to easy:  Draw a letterform.  Is that done in <!--
