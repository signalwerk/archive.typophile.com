    <p>To the tune of an old, old Genesis song: “I can’t draw, I can’t paint. Only thing about me is the books that I make.”</p>
    <p>So what I’m saying is, I’d never think to design a new typeface. And I wonder what might go thru the mind of someone getting up one morning and thinking, “Hey, I think I’ll get started creating a new typeface today.” In simple terms, I’m sure there’s some kind of a desire to create letterforms that are clear to the reader, easy for eyes to follow, and appear somehow new—having some unique aspect to their appearance. But I’m only guessing.</p>
    <p>I’ve been considering that and just why one turns to designing type, as opposed to anything else, for a few days straight now. It’s largely why I signed onto Typophile—and glad I am that I did.</p>
    <p>Anyhow, anyone care to oblige a newcomer with their take?</p>
