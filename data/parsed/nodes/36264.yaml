      <p>Well, I’m not in to designing type for too long yet, so my motivations are mainly that I just like (and always have) to draw lettershapes. So at this point I’m not really concerned with what people think of it. Or markets or potential usage. Well I am of course, but I’m not selling it anyway. My interest in typefaces was mostly sparked with general interest in typography itself.<br>
      I don’t know, I just really enjoy grabbing a piece of paper or my moleskine and doodle away with letterforms that have popped up. At the moment I’m more working on lettering than complete typefaces. Very bad answer to your question. I think some of the more hardcore type designers might give you better insight. ;)</p>
      <p>Oh, and welcome to Typophile. :)</p>
