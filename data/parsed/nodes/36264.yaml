    html: |-
      <p>I just started designing typefaces too, but here are some potental motivations that come to mind:</p>
      <ul>
      <li>to revive an old typeface: you see something around you on street signs or in an old book and you think to yourself “wow, that is beautiful, I would like to have it in digital”. Revivalism is much more complicated than that, of course; sometimes you just want to explore more the tastes and letterforms of a certain period or a certain designer, and doing your own version of someone else’s typeface helps retracing the steps he went through and the decisions he had to make;</li>
      <li>for a specific purpose: there are many situations that call for new typefaces. Think about advances in technology like fonts for computer or PDA screen, pixel fonts for mobile phones, etc. that call for new letterforms, or think about different versions of an existing typeface for new setting: maybe one of your clients uses a specific typeface for all its corporate image but they notice that when they use that font in posters or in very large settings it doesn’t quite work. Then you need to draw a new weight or optical size or whatever…;</li>
      <li>to scratch a technical itch: what happens if I take Bodoni and remove the serifs? <a href="https://web.archive.org/web/20080821124626/http://www.yoworks.com/moderno/index.html">Oh, I see</a>…;</li>
      <li>I know some type designers that often start with an æstetic research, trying new curves or shapes and see what they like…;</li>
      </ul>
      <p>Of course these are just a few ideas, but I hope you get the point. I felt as you do when I was getting interested in typography and then later in type design, I wondered where do these people got the inspiration to do what they did, but then studying the history of type design helped me see things a bit clearer.</p>
      <p>Now: from there to actually know how to create meaningful work, <em>that</em> is something that is still a mystery to me too.</p>
