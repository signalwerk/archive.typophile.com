    <p>Hi, I have 3 questions related to licensing.... </p>
    <p>I downloaded a bunch of free fonts online and now I'm looking to use them for commercial use. I can't seem to find where to buy the font license for these 2 fonts: Angelina and Kayleigh.  Any ideas?</p>
    <p>Also, does anyone know what company does sort of an overall font audit?  Or is it just the individual font houses that do it for their own fonts?  Who would I contact to ask licensing-related questions?</p>
    <p>Legal suggestions...I'm in CA and my biz partner is in PA and our printer is in IL.  I was looking over the licenses for several companies and I'm overwhelmed with thinking that I'd have to buy 3 copies of each font.  The CA and PA offices are NOT going to do any printing of the fonts only the IL printer.  The co is based in CA, we don't need to file as an LLC in PA b/c nothing is being sold there. And, nothing will be physically sold out of the CA office because the printer in IL is going to do the shipping as well.  So, do you think I'd need to by 3 copies of each font?  Would one copy be sort of Kosher?  (The co is just me and my biz partner.)</p>
    <p>Thank you thank you!<br>
    Jessica</p>
