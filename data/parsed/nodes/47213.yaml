      <p>Harrington is from Font Bureau - it's a font bundled with various Microsoft products so it’s likely you may already be licensed. </p>
      <p>The two freeware fonts seem to be unattributed so it may be hard to track down their designers. But they seem to be posted to the usual sites without a license, so there doesn't appear to be any restrictions on commercial use.</p>
