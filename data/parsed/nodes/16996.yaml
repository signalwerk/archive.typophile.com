      <p>My first four languages were forced on me - the only dedication I needed for those was the desparate need -or maybe even just the automatic decision- to stay in school! Spanish is the only language I learned willingly. As for reading scripts without knowing the language, that's just plain fun.</p>
      <p>Paul, Indian musicals are nothing short of amazing - the energy and quality<br>
      is just... wow. And this from somebody like me who normally hates musicals.</p>
      <p>BTW, the problems with sounding native are that: it's extremely hard, and even requires some innate talent - I certainly can't manage it with French... or maybe even English; and it's all about listening, not reading, so you can't learn it from a book. TV is actually good that way, so rent French movies like Kristina does... but turn off the subtitles, at least the first time you watch a given movie - you don't need the content to distract you (and reading takes up too much bandwidth to do both well - I think there was even a study that showed you can't really do both at the same time). Learning language is incorrectly considered by most people as requiring formalism - to me it's quite the opposite - it's about letting your brain figure things out on its own, otherwise you'll never really get it. Formal instruction of language could possibly even harm true learning I think.</p>
      <p>&gt; have the TV on without the sound</p>
      <p>One exercise I like to do is watch a sitcom while consciously blocking out the laugh track: you realize how completely boring the jokes really are. Except when I told this to a friend of mine recently, he exclaimed: "Why the hell would you want to NOT laugh?!" He has a point.</p>
      <p>hhp</p>
