      <p>I don't need solitude in order to design type -- or write, for that matter --, but I think other people may want to keep their distance some of the time. When I get myself into the middle of a design problem, I'm liable to get irritable and cranky until I've found my way back out again. If I have to leave off work on something part way through, I'll be distracted and ill at ease until I can get back to it. But on the other hand I'm happy working away in the middle of a noisy airport terminal, and don't mind having other people around.</p>
      <p>It is a long time since I have written any poetry, but I suspect this would benefit more from solitude than type design or, for that matter, other forms of writing.</p>
