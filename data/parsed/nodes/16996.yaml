      <p><em>Which sort of runs parallel to my<br>
      view that poetry for example is more about expression<br>
      than communication.</em></p>
      <p>It is a bit of both and neither, and most importantly something else entirely. Poetry is linked to song, and hence to music, and like music and song it seeks direct emotional and epiphanic connection. What happens at the point of connection varies, but very often it involves a shared insight that is arrived at by the reader rather than, as in expository prose, explained to him. This could be considered a kind of communication, but it is a whole lot more powerful than most of our nattering to each other.</p>
      <p>Funnily, I've known a number of fine prose writers who wish they could do what poets do, and a number of good poets who wish they could do what composers do. I'm not sure who composers envy. Maybe angels.</p>
