      <p>My co-worker in the cubicle next to me is polish. She has long conversations with her friends and her kids, in Polish of course. It amazes me that although I can only identify 5 or 6 words, I often know what she's talking about. OF course, I'm informed by what I know about events in her life or here at work. Still, the expression, the tone of voice say a lot. </p>
      <p>I don't watch TV at all.</p>
      <p>I do rent movies, and lately I've been choosing French movies. I get a kick out of following the English subtitles while I listen and I enjoy catching discrepancies in the translation. What gets left out and the subtle variations are often quite interesting.</p>
      <p>Hrant, it's wonderful that you can dedicate yourself to learning other languages and alphabets. I have yet to get past English and French, and the feeling I'll never master either of them.</p>
      <p>K.</p>
