      <p><em>One exercise I like to do is watch a sitcom while consciously blocking out the laugh track: you realize how completely boring the jokes really are.</em></p>
      <p>Which makes <a href="http://www.amazon.com/gp/product/B0002W4P98/qid=1137112729" rel="nofollow">The Office</a> seem even more brilliant, since there is no laugh track. Of course, in that case, the excrutiating emotional pain and embarassment wouldn't be well served by the typical laugh track anyway. As a friend of mine said after watching the first four episodes back-to-back, 'I think I've chewed my thumb off'.</p>
