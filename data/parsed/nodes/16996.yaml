    <p>So here's a question I've been mulling over -- not exclusively related to type, but I think it relates, because I think there's creativity/artistry involved in type design and typography. Just looking for other perspectives on this.</p>
    <p>I'm a writer more than an editor. I find it extremely difficult to write poetry when I've been around others. I require a lot of solitary time to get my head and creative gears tuned to language, and if I'm not alone for long enough stretches, it just ain't gonna happen. Being busy doesn't interfere, as long as I'm alone.</p>
    <p>What's your take? Do you feel your creative work requires solitude? If so, what do you do to make sure you get it?</p>
    <p>Kristina</p>
  html_clean: |-
