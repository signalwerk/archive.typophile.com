      <p>Poetry: I used to try in my teens. But then I realized it didn't feel right - partly because prosody seemed a barrier more than anything else. Coincidentally, I also don't like lyrics in music. Except "token" lyrics, like in some trance music; the banality of such lyrics -in the context of "pure" music- somehow seems very fitting to me. And I think it's for the same reason that I adore Soul Coughing. Hmmm, or maybe that's a contradiction...  :-)</p>
      <p>To me travel -or, more generally, getting out of one's "normal" environment, whatever that means- isn't for creating, it's for absorbing, for "warehousing" inspiration, often deep down, which will eventually bubble up. I'm still making shapes due [in part] to a trip to Bangkok many years ago.</p>
      <p>hhp</p>
