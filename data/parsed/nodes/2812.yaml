gner/ artist and the end result affect the meaning of how typographic elements function in an individual situation, and whether it is typography or typographic. <br> <br>I think. ...I'm starting to twist my thoughts a little too hard, but I believe this is a conceptually consistent post. But what better place to have this discussion than with Typophiles? <br> <br><img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"></p>"
