    html: "<p>I'm going to chime in with a question and a definition. <br> <br>Roy, did you mean: what's the literal definition of typography, stated as succinctly as possible? Or more of a 'What typography means to me' kind of a situation? Although, I suppose you can't really state them separately, as you've seen so far. <br> <br>At its most basic, I'd call it '<i>the consideration and/ or appearance of typeset matter</i>'. I mean, it's all there in the name. When I say 'appearance and/ or consideration', I'm hitting on design's potential presence, but design is such a loaded word, I'd be inclined towards a more neutral term, that also carries no value judgements (sorry, John), because I believe that design implies intent. With modern 'typesetting' being so automated, much of the process for amateurs contains no intent, but contains many defaults. Also, I'm including the action and the thing itself. Typography can be good and bad, as in: \"Man, that typography sucks,\" which is not the action, but the result of it. Typography exists when type is present, but design exists only when it is exercised (I know, this is debatable, but I'm sticking to it for now.). <br> <br>But that basic definition can be taken as very inclusive or exclusive, depending on your opinions about: the role of the typesetter/ typographer vs. the role of the graphic designer (or, typography vs. design). <br> <br>I can look at a poster that uses type as a purely visual element (you might call it a typographic element), but that does not, in my mind, represent the result of typesetting (typography). It's a typographic design, and in the sense that typographic elements exist there, but I'm not sure it's typography as a manifestation of typesetting. See the problem? Type isn't only geometry, it's a set of symbolic glyphs. But, those glyphs only get meaning based on how they're treated. That's what makes (in my mind) the definition so potentially contentious. The intent of the typesetter/ designer/ artist and the end result affect the meaning of how typographic elements function in an individual situation, and whether it is typography or typographic. <br> <br>I think. ...I'm starting to twist my thoughts a little too hard, but I believe this is a conceptually consistent post. But what better place to have this discussion than with Typophiles? <br> <br><img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"></p>"
