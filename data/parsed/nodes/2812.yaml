    html: "<p>Typography is the making of images from type. <br>And also: <br>Typography is an image made from type <br> <br>Some people would add an adjectival qualifier \"artistic\" or \"pleasing\", to differentiate Typography from mere typesetting. But this muddles the definition, because such value judgements are subjective: one person's typography is another's typesetting, and vice versa. <br> <br>And this is what John has done with the concept of \"design\". Who is to say whether a piece of typography has been designed? -- unless of course all typesetting is designed, because \"you cannot not design\". <br> <br>Consider the typography you are now reading. In a sense, I am the designer, but so is the site designer, and also the end user who stipulates browser preferences: we all have some say in the determination of typographic variables such as font, size, paragraph leading, punctuation style, even aliasing. On the Internet: the Post-modernity of multiple authorship.</p>"
