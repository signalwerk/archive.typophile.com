    html: <p>Nick, <br> <br>I resemble that statement.  <br> <br>The problem is this Nick. You do indeed "type" but you do not typeset unless you are setting type. If it is not type, it is not typography. So I am in agreement. I was just trying to be kind. Never works for me. <br> <br>But let us examine first the non noun definition of type, or rather <i>to type.</i> <br> <br><b>Penguin:</b>  <i>To write something using a typewriter or computer.</i> <br> <br>Now that's pretty modern. At least the latter. <br> <br>However the noun <i>type.</i> <br><b>Penguin:</b> <i>A small metal block with a raised character or letter on its upper surface, used in printing.</i> <br> <br>We are fooling ourselves to think otherwise. I am easily talked into that distinction. I am a typographer, even by Fournier's definition. <br> <br>This illustration is "modernized". See Giampa. <br><a href="http://lanstontype.com/TypeStick.html" target="_blank">http://lanstontype.com/TypeStick.html</a> <br> <br>Setting. <br><a href="http://lanstontype.com/GiampaStick.html" target="_blank">http://lanstontype.com/GiampaStick.html</a> <br><a href="http://lanstontype.com/TypeSet.html" target="_blank">http://lanstontype.com/TypeSet.html</a> <br> <br>Printing. <br><a href="http://lanstontype.com/GiampaHat.html" target="_blank">http://lanstontype.com/GiampaHat.html</a> <br> <br>Designing. <br><a href="http://lanstontype.com/ATF.html" target="_blank">http://lanstontype.com/ATF.html</a> <br><a href="http://lanstontype.com/EzraPound.html" target="_blank">http://lanstontype.com/EzraPound.html</a> <br> <br>Publishing <br><a href="http://lanstontype.com/Robin-Blaser-Poet.html" target="_blank">http://lanstontype.com/Robin-Blaser-Poet.html</a> <br> <br>Type Founding <br><a href="http://lanstontype.com/OrphanAnnie.html" target="_blank">http://lanstontype.com/OrphanAnnie.html</a> <br><a href="http://lanstontype.com/CaliforniaCase.html" target="_blank">http://lanstontype.com/CaliforniaCase.html</a> <br><a href="http:/