    html: "<p>I will stick to the traditional meaning of typography. I see <i>no need</i> to redefine. Even with new technology there is insufficient excuse to review. These two definitions I provide are already <i>Cyborgian</i> friendly. <br> <br><b>First definition: Collins Dictionary.</b> <br> <br><b>TYPOGRAPHY:</b> <i>The art, craft, or process of composing type and printing from it.</i>  <br> <br><b>Second definition: Penguin Dictionary</b> <br> <br><b>TYPOGRAPHY:</b> <i>The style, arrangement, or appearance of typeset matter.</i>  <br> <br>The Collins Dictionary more closely resembles <i>root definition.</i> Fournier's definition of a t<i>ypographer</i> includes, printing and  typefounding. These peas from the modern dictionaries are boiled enough, let us not make them mushy. <br> <br></p>"
    html_clean: "<p>I will stick to the traditional meaning of typography. I see <i>no need</i> to redefine. Even with new technology there is insufficient excuse to review. These two definitions I provide are already <i>Cyborgian</i> friendly. <br> <br><b>First definition: Collins Dictionary.</b> <br> <br><b>TYPOGRAPHY:</b> <i>The art, craft, or process of composing type and printing from it.</i>  <br> <br><b>Second definition: Penguin Dictionary</b> <br> <br><b>TYPOGRAPHY:</b> <i>The style, arrangement, or appearance of typeset matter.</i>  <br> <br>The Collins Dictionary more closely resembles <i>root definition.</i> Fournier's definition of a t<i>ypographer</i> includes, printing and  typefounding. These peas from the modern dictionaries are boiled enough, let us not make them mushy. <br> <br></p>"
