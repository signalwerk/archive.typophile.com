    html: <p>Generally, when I say text I mean something written. The idea of 'oral text' is problematic in this regard, but can be ignored unless specifically talking about oral literature. I don't have much time for the more extreme post-modern thesis that anything can be regarded as a text, not least because it imposes an ideological primacy of writing that I think is wrong. <br> <br>However, in the interest of seeking a genuine synthesis of our ideas, I'd happily include the word 'visual' in my definition, e.g. 'The application of design to the visual articulation of text'. Or, to simplify further, and remove that word design which is troubling you, one could forumulate a working definition of typography simply as 'the visual articulation of text'. <br> <br>I dislike the term 'image' because it suggests a visual whole which is presented 'all at once' -- as a painting or a photograph -- and not a text, which is a thing that you move through temporally. The image of typography is its most superficial aspect. I also think there is a tyranny of the image in much contemporary design, especially in North America, and a corresponding lack of regard for text. This is evident from the pages of 'typography' annuals, in which one sees few examples of type that is not sitting on top of or adjacent to a photograph, illustration, or other image, and usually subservient to it. This attitude has its ideological expression in Bruce Mau's statement 'Heaven is a place without text'. Wanker. <br></p>
