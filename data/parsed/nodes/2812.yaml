    html: <p>John, I agree with you that the word design does not literally constitute a value judgement. However, in practice much professional typography, especially at the high end, is done by (graphic) designers. So to use the term "design" in a definition is problematic -- it suggests that there is some aspect of professionalism involved, when that is not a prerequisite to making typography. <br> <br>I can see what you're getting at with "articulation", but it's surely necessary to include the word "image", because as it stands, your definition could equally apply to "text to sound". <br> <br> <br></p>
