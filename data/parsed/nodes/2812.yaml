    html: <p>On a computer screen, type is displayed, not printed. <br>It is not set, but varies according to different readers' equipment and preferences. <br> <br>Rather than the maestro's virtuosity, with its single, authoritative interpretation of the text, we have a  situtation where there are many "authors" (typographers) involved. <br> <br>So you are right Gerald, those dictionaries have the modern definition. But it's out-of-date. We need a post-modern definition. <br> <br></p>
