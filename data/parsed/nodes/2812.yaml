    html: "<p>Nick, I don't think the word design constitutes a 'value judgement'. Design is an activity, or more accurately a collection of activities, and in my understanding this includes what might be termed micro-typographic aspects of 'mere typesetting' such as the decision about how much space to put on between a letter and a following punctuation mark. <br> <br>I'm not keen on your term 'image', because it seems to overemphasise the whole to the detriment of a proper consideration of the parts. Again, this is not about value judgement, but whether one focuses on the product of typography as a key to its definition, or on the process of typography. Probably both approaches are valid. <br> <br>The idea of 'articulation of text', which is central to my working definition, does imply a value judgement, because it suggests a measure of the success of any piece of typography -- or act of typography, if I were really to stress the process -- relative to a text. This is why it is a <i>working</i> definition, and different from my simpler definition: design with type. The working definition tells you something about the kind of work I do.</p>"
    html_clean: "<p>Nick, I don't think the word design constitutes a 'value judgement'. Design is an activity, or more accurately a collection of activities, and in my understanding this includes what might be termed micro-typographic aspects of 'mere typesetting' such as the decision about how much space to put on between a letter and a following punctuation mark. <br> <br>I'm not keen on your term 'image', because it seems to overemphasise the whole to the detriment of a proper consideration of the parts. Again, this is not about value judgement, but whether one focuses on the product of typography as a key to its definition, or on the process of typography. Probably both approaches are valid. <br> <br>The idea of 'articulation of text', which is central to my working definition, does imply a value judgement, because it suggests a measure of the success of any piece of typography -- or act of typography, if I were really to stress the process -- relative to a text. This is why it is a <i>working</i> definition, and different from my simpler definition: design with type. The working definition tells you something about the kind of work I do.</p>"
