    html: <p>Having reread my post many hours later, I have to admit that I'm not sure what <i>my own</i> point was (I think there were a few, in fact). <br> <br>I meant it to bring up the differences between design and typography and how they merge and blend with type, largely because it carries meaning in such a unique fashion. And thus, the definition becomes loaded with potential meaning. But I don't think it went as well as I meant it to.</p>
