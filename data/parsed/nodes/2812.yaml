    html: "<p>As I mentioned, 'articulation of text' is a <i>working</i> definition, which doesn't claim to be exhaustive. I think it is appropriate to the majority of typographic work, and certainly to the kind that most interests me, but there are of course uses of type in which text is secondary to the overall image or, less often, in which text is not a factor at all. To encompass all this, a more general definition is necessary. <br> <br>As regards a definition of type, I think you would need to include the prefabricated and reusable nature of type that distinguishes it from chirography and other unique, manual expressions of written forms. At TypeCon last year, Allan Haley gave a talk on what he called 'non-font typography', by which he meant hand-lettering in a graphic design context. He showed some nice work by various people, but his terminology was a mess of misconceptions: hand-lettering is not typography, non-font or otherwise.</p>"
