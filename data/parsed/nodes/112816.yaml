      <p>It looks like all text (big text, small text, numbers) are set in <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Dafont-1&amp;ffam=DIN%20Schablonierschrift%20-%20Regular&amp;fid=e1489c73438fc46f0c3ddbca3e7a4905&amp;fsize=48&amp;text=SKOOL%20LUV%20AFFAIR%20COMEBACK%20TRAILER%20182%3A32%3A2&amp;wrap=2" rel="nofollow">DIN Schablonierschrift</a></strong> free font by Marian Steinbach<br>
      If you look closely at the small text you can easily see the stencil cuts on letters /A &amp; /M</p>
