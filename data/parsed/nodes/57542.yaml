      <p>I meant that it was distracting and disruptive. Seemed like the worst of both worlds.  </p>
      <p>Justification always leads to compromise in internal spacing. The reason one accepts such compromises — the payoff — is to have consistent, orderly margins and text blocks, relatively fixed from page to page. A fixed framework removes some of the external variables and allows focus to remain on the internal. </p>
      <p>Flush-left/ragged-right exchanges the priority, preferring internal consistency in spacing, and accepting a variable margin.</p>
      <p>Your sample had highly variable internal spacing married with constantly changing external margins. The changing margin was actually made more noticeable by the hard line of the alignment.</p>
      <p>I can imagine a changing measure working acceptably if the range of variation was kept quite small, so as to be essentially unnoticeable. But I’m not sure you’d gain anything by it.</p>
    html_clean: |-
