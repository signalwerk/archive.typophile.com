      <p>kent lew said:<br>
      &gt;   I can imagine a changing measure working<br>
      &gt;   acceptably if the range of variation was kept<br>
      &gt;   quite small, so as to be essentially unnoticeable.<br>
      &gt;   But I’m not sure you’d gain anything by it.</p>
      <p>well, in an e-book, any change in variation will be<br>
      “noticeable”, because of the end-user’s ability to<br>
      rapidly thumb through the exactly-placed pages.<br>
      it’s quite easy to actually see the margins shifting.</p>
      <p>in a p-book, the normal vagaries of printing will<br>
      make any such variation be much less noticeable,<br>
      since the margins will be less exact to begin with,<br>
      and the inability to compare pages directly means<br>
      changes in the margins would be harder to detect.</p>
      <p>but e-books is what i’m interested in...</p>
      <p>&gt;   Your sample had highly variable internal spacing</p>
      <p>you will remember that that was due in large part<br>
      to the nature of that experiment, which was to test<br>
      if justification could be done without hyphenation.</p>
      <p>if i’d used hyphenation with a variable measure,<br>
      the “compromise” you talked about will not only<br>
      not be as bad as usual, it will actually be better,<br>
      because most lines are not stretched as much...</p>
      <p>but that’s really beside the point, because my aim<br>
      was to see whether those three factors together —<br>
      justification-on, hyphenation-off, variable-measure<br>
      — would balance out.  so your conclusion that it is<br>
      “the worst of both worlds” is directly relevant to me,<br>
      and i thank you so much  for sharing your impression.</p>
      <p>it’s kinda hard to have a conversation amidst all this<br>
      hyperventilation, isn’t it?  thanks for being on-topic.</p>
      <p>-bowerbird</p>
