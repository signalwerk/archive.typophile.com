    <p>i’ve been here on typophile for 8 weeks now!<br>
    this is turning into quite a relationship, eh?</p>
    <p>***</p>
    <p>ok, here’s a new question for all of you...</p>
    <p>following an unspoken rule, printed books<br>
    always use the same measure on every page.</p>
    <p>in an electronic-book, on the other hand,<br>
    the measure can be set independently for<br>
    each page, according to the length of its<br>
    longest line (or the second longest line)...</p>
    <p>so — just off the top of your head now —<br>
    what would you think of doing it that way?</p>
    <p>later i’ll show you a book where it’s done,<br>
    so you can see what it actually looks like,<br>
    and make a judgment on the results, but<br>
    for now, how does the _idea_ strike you?</p>
    <p>-bowerbird</p>
