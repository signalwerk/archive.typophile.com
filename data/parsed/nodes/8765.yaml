    html: <p>Abeno, <br> <br>It's not that straightforward. You're confusing the restrictions embedded in the font with the EULA. These two issues are almost orthogonal to each other. EULAs can be much more complicated. <br> <br>Put another way, the EULA can say that you can only embed the font if at least one of your parents or half the founders of your corporation were born in Kenya. Weird, but somebody could write a EULA that did that. There's no way to use flags in the font to indicate that, and even if there were, there'd be no way to automatically enforce it with software. <br> <br>"Commercial embedding" clauses are actually common, but there's no way for the software making the PDF to know what's going to be done with the PDF downstream. So this one has to be enforced by users, not by the PDF creation software. <br> <br>Tiffany, <br> <br>I can't tell you what it means to create a PS file for a service bureau as opposed to a PDF - that's a question for your EULA. Certainly Adobe's EULA permits both. I have seen other EULAs that treated PS files more liberally than PDFs, however. The main problem is that setting up the PS file correctly can be a little complicated. <br> <br>Regards, <br> <br>T</p>
    html_clean: <p>Abeno, <br> <br>It's not that straightforward. You're confusing the restrictions embedded in the font with the EULA. These two issues are almost orthogonal to each other. EULAs can be much more complicated. <br> <br>Put another way, the EULA can say that you can only embed the font if at least one of your parents or half the founders of your corporation were born in Kenya. Weird, but somebody could write a EULA that did that. There's no way to use flags in the font to indicate that, and even if there were, there'd be no way to automatically enforce it with software. <br> <br>"Commercial embedding" clauses are actually common, but there's no way for the software making the PDF to know what's going to be done with the PDF downstream. So this one has to be enforced by users, not by the PDF creation software. <br> <br>Tiffany, <br> <br>I can't tell you what it means to create a PS file for a service bureau as opposed to a PDF - that's a question for your EULA. Certainly Adobe's EULA permits both. I have seen other EULAs that treated PS files more liberally than PDFs, however. The main problem is that setting up the PS file correctly can be a little complicated. <br> <br>Regards, <br> <br>T</p>
