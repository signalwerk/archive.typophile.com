    html: <p>&gt;&gt; The main problem is that setting up the PS file correctly can be a little complicated.  &gt;&gt; <br> <br>Well, one good way is to make a PDF file, then use Acrobat to write off a PS file to send to the printer. Before the printers could RIP PDF files, that is what they'd do -- take the supplied PDF, then dump out a PS file they could RIP. <br> <br>. . . <br> <br>The odd thing is that if I send a publisher a PS file, they could distill it &amp; make a PDF with embedded fonts which they could then send to NetLibrary. As long as the publisher didn't own the font(s), they wouldn't be breaking a licensing agreement. Isn't that an oddity! Whether I would or would not be breaking my EULA would be a matter of the language in the specific license. Many of my fonts were purchased long before Acobat became a standard, &amp; with many of them, "font embedding" wasn't mentioned. In fact, my  Erhardt font from Monotype is so old the font was in a Type 3 format  . . . <br> <br>Charles</p>
