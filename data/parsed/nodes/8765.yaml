    html: "<p>Asking printers to make alterations to \"finished\" jobs has a long history. It's not something that started in the desktop publishing era. <br> <br>Ideally, the graphic designer should make any last minute alterations to the original files and send those to the printer. In practice, expediency rules and printers are sometimes asked to make alterations to files themselves in order to meet a client's deadline. <br> <br>A job created using a font restricted to \"Print &amp; Preview\" would prevent (legally at least, if not through some software mechanism) the printer from making alterations. Thus, such fonts require that jobs be delivered to the printer without flaws or with enough time built into the schedule to allow the designer to make the alterations, and that the designer be available to make such alterations on short notice. Often, none of these things are true. <br> <br>The upshot is that some designers will either avoid purchasing fonts with such restrictions or buy them and ignore the EULA. <br> <br>I imagine the foundries who put such restrictions on their fonts expect (or hope) that printers will have no choice but to purchase their own copies of fonts used in jobs sent to them, or perhaps that the client or designer will purchase an extra license for the printer. I wonder how often this happens. <br> <br>FYI: \"Subsetting\" means including a subset of the characters from a font, i.e., only the characters used in the document, not the full font.</p>"
    html_clean: "<p>Asking printers to make alterations to \"finished\" jobs has a long history. It's not something that started in the desktop publishing era. <br> <br>Ideally, the graphic designer should make any last minute alterations to the original files and send those to the printer. In practice, expediency rules and printers are sometimes asked to make alterations to files themselves in order to meet a client's deadline. <br> <br>A job created using a font restricted to \"Print &amp; Preview\" would prevent (legally at least, if not through some software mechanism) the printer from making alterations. Thus, such fonts require that jobs be delivered to the printer without flaws or with enough time built into the schedule to allow the designer to make the alterations, and that the designer be available to make such alterations on short notice. Often, none of these things are true. <br> <br>The upshot is that some designers will either avoid purchasing fonts with such restrictions or buy them and ignore the EULA. <br> <br>I imagine the foundries who put such restrictions on their fonts expect (or hope) that printers will have no choice but to purchase their own copies of fonts used in jobs sent to them, or perhaps that the client or designer will purchase an extra license for the printer. I wonder how often this happens. <br> <br>FYI: \"Subsetting\" means including a subset of the characters from a font, i.e., only the characters used in the document, not the full font.</p>"
