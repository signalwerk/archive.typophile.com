    html: <p>Tina, <br> <br>Which fonts are you using? That might help us clarify if indeed you can embed your fonts for your service bureau.  <br> <br>Postscript dumping and printing to disk is basically creating a postscript file for your service bureau. AFAIU this would be considered the same as creating a PDF ... or would it? Thomas, where do think Adobe stands on this? Tina, if you create a PS file for your service bureau, you would include such things as cropmarks and printer's marks as well as printing separations. All information is contained in the file. Back in the day this is how we would output film for some COREL documents off of a PC. <br> <br>If you want a quick run through you can also read my article--<a href="http://fontlab.wikidev.net/The_Case_for_a_User-Friendly_EULA" target="_blank">The Case for a User-Friendly EULA</a>--on the FontLab wiki which has a comparative chart that might help you.</p>
