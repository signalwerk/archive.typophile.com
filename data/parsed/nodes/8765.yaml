  html: <p>Is there a legal issue/problem if I want to give a font (or fonts) to a service bureau? (printer?) <br> <br>do I need to copy the fonts? How?  <br> <br>How to send my file/document - Quark or ID - to a service bureau?  ( I know this is a huge issue, but can you explain to me with simple &amp; plain English - how to do it, PLEASE!!! <br> <br>what is Postscript dump/print-to-disk? <br> <br>Thank you very much!!!</p>
