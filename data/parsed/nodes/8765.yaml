    html: "<p>&gt;Someone needs to tell the lawyers how type is used; maybe then they can come up with a license that make sense.  <br> <br>I'm a law student studying IP, so maybe someone could explain a few of the points in this thread to facilitate a greater typographer-attorney understanding <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br>&gt; After much negotiation with Enschede, we got a license that does allow subsetting the characters in a PDF file to send to the Printer. <br> <br>what is \"subsetting\" in book design and why would your printer need to alter or correct a .pdf you send him? <br> <br>the PDF embedding issue seems straightforward for TrueType fonts, which can be assigned one of four levels of embedding restrictions: 1) Restricted, 2) Print &amp; Preview (meaning read-only), 3) Editable, and 4) Installable. Other type formats may contain similar embedding schemes. <br> <br>getting back to that printer, I would assume (although I may be wrong) that most commercial fonts from Emigre, FB, etc are licensed to the Print &amp; Preview level. In my limited graphic design experience, the printer should not have to alter the contents of PDFs-- that's the designer's job. <br> <br>Any comments?</p>"
    html_clean: "<p>&gt;Someone needs to tell the lawyers how type is used; maybe then they can come up with a license that make sense.  <br> <br>I'm a law student studying IP, so maybe someone could explain a few of the points in this thread to facilitate a greater typographer-attorney understanding <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br>&gt; After much negotiation with Enschede, we got a license that does allow subsetting the characters in a PDF file to send to the Printer. <br> <br>what is \"subsetting\" in book design and why would your printer need to alter or correct a .pdf you send him? <br> <br>the PDF embedding issue seems straightforward for TrueType fonts, which can be assigned one of four levels of embedding restrictions: 1) Restricted, 2) Print &amp; Preview (meaning read-only), 3) Editable, and 4) Installable. Other type formats may contain similar embedding schemes. <br> <br>getting back to that printer, I would assume (although I may be wrong) that most commercial fonts from Emigre, FB, etc are licensed to the Print &amp; Preview level. In my limited graphic design experience, the printer should not have to alter the contents of PDFs-- that's the designer's job. <br> <br>Any comments?</p>"
  - id: 57507
