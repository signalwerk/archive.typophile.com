    <p>I have an assignent at my academy that we have to design one letter of the alphabet. I'm currently using Fontographer 5 to build up my letter. (I could do it with Illustrator in like 5 minutes, but I want to learn the new softwares ;))<br>
    So my question is: While I'm building up my letter at some places I left 2 points at the same spot, and when I tried to merge them I didn't get one point instead of 2, but none and a curve.</p>
    <p>Something went wrong with the image uploads, so I'll just add the links.</p>
    <p>what I want: <a href="http://cl.ly/1b0N0Z323z260O0E1V3K/Screen_shot_2011-03-29_at_11.04.31_AM.png">http://cl.ly/1b0N0Z323z260O0E1V3K/Screen_shot_2011-03-29_at_11.04.31_AM.png</a><br>
