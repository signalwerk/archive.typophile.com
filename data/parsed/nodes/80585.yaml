    html: <p>In Fontographer, "Merge Points" basically means "delete point(s) without breaking the contour". So if you select two points and Merge, both of them will be deleted (and adjacent points may be automatically modified to try and maintain the overall shape of of the contour). So you probably want to select just one of the two points -- whichever is more out of alignment -- then Merge Points. And as Nick pointed out, the contour is broken at the top right.</p>
