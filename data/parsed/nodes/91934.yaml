      <p>Phototypesetting—first by film-strip or grid, later by digitization—on dedicated systems followed metal, and computerized front ends allowed for a finer grid. When the transition was made to the desktop, various foundries probably saw no need to reinvent the wheel.</p>
      <p>It's interesting how all of the Garamonds shown have the highest frequency of characters almost dead-center in the spectrum of widths. If one synched this spectrum to the visible spectrum, one might say that Garamond is a decidedly green style.</p>
