      <p>Ben — The original hot-metal Linotype did not require unitizing. </p>
      <p>But when Mergenthaler developed its first phototypesetters, the stepping motor used for the character advance dictated some sort of unitization, and they adopted an 18-unit system, initially, because Monotype had already established that scheme so well.</p>
      <p>Later when a continuous mechanism replaced the stepping motor, the unitizing approach was refined to 54 units (3×18), which could accommodate more nuance, while still being backward compatible with 18-unit designs. </p>
      <p>[<em>Edit: Oops, the foregoing contains several errors. See below.</em>]</p>
