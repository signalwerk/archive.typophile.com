    <p>Having been intrigued by the nice glyph width chart on the <a href="http://www.fontbureau.com/nhg/features/#refined_spacing" rel="nofollow">Neue Haas Grotesk</a> page, I could think of no better way to spend half this holiday than to write a Python script that will plot a glyph width histogram.</p>
    <p>The results are, not surprising, that different digitizations differ wildly in their glyph unit systems.</p>
    <p>Here are some examples:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/hist_sglt_4429.png"></div><p></p>
    <p>The Linotype Stempel Garamond is based on a rough 18 unit grid.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/hist_sgur_4553.png"></div><p></p>
    <p>URW Garamond No. 8 has something like 3 times 18 units, 54 units.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/hist_sgbt_5623.png"></div><p></p>
    <p>The Berthold digitization of Stempel Garamond uses a completely incompatible grid, i.e. 48 units.</p>
    <p>The same grids can be seen in the attached PDFs of different Univers digitizations.</p>
    <p>If anyone is interested, I may clean up the Python script and make it available.</p>
    <p>Cheers,<br>
    Jens</p>
