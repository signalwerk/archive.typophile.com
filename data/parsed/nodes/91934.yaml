      <p>Sorry, my memory failed me. I have details wrong in my previous message there. </p>
      <p>I found my correspondence from Matthew Carter on this subject. </p>
      <p>I had the mechanisms backward. The original Linotype phototypesetters utilized a <em>continuous-speed</em> writing prism. Horizontal positioning was achieved by timing the shutter opening and closing. For this reason, discrete timings were needed, hence a unitized system.</p>
      <p>MC said he thinks that the initial 18-unit system was adopted because of its precedence in the TTS newspaper system (which was probably influenced by Monotype’s 18-unit system, but that’s just speculation on my part). And newspapers were, of course, Linotype’s bread-and-butter clientele.</p>
      <p>Later, the introduction of a stepping motor allowed <em>discontinuous</em> movement, which allowed a more refined system — even standing still, and thus zero-width characters, for complex scripts.</p>
