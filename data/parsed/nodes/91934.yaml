    html: |-
      <p>This is a complex topic and Nick Sherman and I are currently doing heavy research on it. Yes, Kent is right, a unit-system for Linotype fonts was first introduced with the TTS teletypesetting systems because those had to calculate the line length. A handful of Mergenthaler newspaper faces, spearheaded by the Legibility Group, were adjusted to the 18 units, mostly 15 different width with 4 units being the smallest. So unitized and normal versions of the same typefaces were available. All other Linotype mats did not need to adhere to a unit system but we speculate that this principle might have found its way into the production of normal typefaces, too, maybe for practicability reasons? (Currently trying to find evidence for that.)</p>
      <p>Later in phototype, all manufacturers had their own unit system (the idea of incompatibility and dependence on a supplier was more or less the business model). Berthold used 48, the Lumitype 36, Monotype later 96 etc.</p>
