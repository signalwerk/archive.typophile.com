      <p>Actually, Hrant, I think you’re probably thinking of ATF’s later incarnation of the concept, trademarked as “Quick-Set” (patented in 1918), which was an evolution of Linn Boyd Benton’s original “Self Spacing” scheme (patented in 1883).</p>
      <p>Patricia Cost discusses Benton’s original invention in her book, <em>The Bentons</em>, p. 47 ff. (RIT Cary Graphic Arts Press, 2011). She also touches on some of its shortcomings, which the later Quick-Set system purports to overcome.</p>
