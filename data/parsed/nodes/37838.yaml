      <p>If you ask Microsoft, the answer is ’SharePoint’.</p>
      <p>But SharePoint really sucks.</p>
      <p>personally, for organizing things on my own HardDrive, I think the solution is diligent folder heierarchies and a decent search tool. Windows doesn’t have a decent search tool built in (and, in fact, I’m not finding Mac’s ’spotlight’ all that great either, though it is fast)</p>
