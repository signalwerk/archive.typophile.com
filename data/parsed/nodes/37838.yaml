      <p>You want advanced properties.<br>
      * right click object (file) &gt; properties &gt; Summary tab &gt; </p>
      <p>looks like this:</p>
      <p></p><div class="imageWrap"><img src="/files/summarytab_6700.gif"></div><p></p>
      <p>Windows XP has an Indexing Service.<br>
      * right click object (file) &gt;  Advanced button &gt; check For fast searching, allow Indexing Service to index this file.</p>
      <p>Indexing Service can be turned on or off.<br>
      - right click My Computer &gt; Manage &gt; Computer Management console &gt; Indexing Service &gt; Stop and Pause buttons appear on console toolbar.</p>
      <p>j a m e s</p>
