    html: "<p>Yves, <br> <br>You're welcome.  <br> <br>It's interesting: When I thought to post the link, it was because seemed a good piece to share with English users in the US (and perhaps English-speaking areas of Canada and the UK). <br> <br>I hadn't thought until you mentioned it, that it might also benefit those working with English elsewhere - like Belgium - where it must be especially confusing. <br> <br>You might call English \"inventovative\". <br> <br>:-) <br> <br>And highly possessive. <br> <br>Joe <br> <br> <br></p>"
