    html: <p>Tell me about it. I noticed that a whole damn lot of  <br>native English speakers frequently make mistakes  <br>against its use, and it's quite silly a Dutch/French- <br>speaking guy like me trips over these typos. (I hate  <br>that, it even makes me stop reading on certain  <br>occasions.) <br> <br>Then again, I make loads of other mistakes and my  <br>use of the English language is often quite... eh...  <br>let's call it "inventive". So who am I to judge? <br> <br>Good article BTW. THX for the link, Mr. Treacy.</p>
