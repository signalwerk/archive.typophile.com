    <p></p><div class="imageWrap"><img src="http://typophile.com/files/EF500_6662.jpg"></div><p></p>
    <p>Mike Adkins about the FHA Eccentric French font form the Fontry...</p>
    <p>The curves are vintage and the serifs are big. They're so big that for years I never had the courage to tackle this intimidating font. But when fellow signmaker Frank Smith laid the groundwork for this intriguing typeface by Frank H. Atkinson, I couldn't pass on the opportunity to take it from paper to keyboard. After all, at over 100 years old, I felt this alphabet had never been given a proper, digital treatment. More…</p>
    <p>So how did this face survive the last century? Well, for those who don't know the history, it survived in Atkinson’s ubiquitous book, Sign Painting, published first in 1908, the generational standard for anyone interested in sign-related type design. The layouts and lettering treatments in this book have influenced countless designers for more than a hundred years, but most haunting to me was this strange face with the big serifs.</p>
    <p>Well, I'm haunted no more. The work is done, the kerning is complete, and nothing but a mouse-click separates a very old idea from the modern world.</p>
    <p>It’s wide, it’s big, and with those crazy serifs, it is definitely eccentric-!!!</p>
    <p>Available from Myfonts <a class="freelinking external" href="http://new.myfonts.com/fonts/fontry/fha-eccentric-french/"> Myfonts</a></p>
    <p><a class="freelinking external" href="http://cdn.myfonts.com/s/aw/original/42/0/21920.pdf"> Complete specimen doc...</a></p>
