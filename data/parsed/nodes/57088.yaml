    <p><a href="/wiki/Typophile" class="freelinking" rel="nofollow">Typophile</a> Film Fest 4 is presented by <a href="/wiki/Punchcut" class="freelinking" rel="nofollow">Punchcut</a> in association with the Society of Graphic Designers of Canada</p>
    <p>Typophile Film Fest 4 will showcase a rare and unequaled selection of short typographic films. Hailing from Portugal, The Netherlands, Austria, Canada and the US, the films create a visual mashup of motion design, typographic animation and short stories. It includes broadcast motion design, documentaries and typographic eye candy from Trollbäck + Company, <a href="/wiki/Strange%20Attractors" class="freelinking" rel="nofollow">Strange Attractors</a>, Heebok Lee, <a href="/wiki/Nick%20Shinn" class="freelinking" rel="nofollow">Nick Shinn</a>, Juan Leguizamon as well as exclusive out takes from the acclaimed documentary film <a href="/wiki/Helvetica" class="freelinking" rel="nofollow">Helvetica</a>. Thanks to the Society of Graphic Designers of Canada, British Columbia, for helping make this presentation possible.</p>
    <p>Saturday April 25, 2009<br>
    Doors open: 7PM<br>
    Films: 8PM—11PM<br>
    Note: All Justified West attendees receive free entrance to the Typophile Film Fest.</p>
    <p>COST<br>
    GDC Members: $15<br>
    Non GDC Members: $20</p>
    <p><a class="freelinking external" href="http://www.gdc.net/about/store/product_category1/product43.php" rel="nofollow">BUY TICKETS NOW</a></p>
    <p>LOCATION<br>
    PLAZA 500 Hotel, Vancouver<br>
    Located at the corner of Cambie Street &amp; 12th Avenue</p>
    <p>// ABOUT PUNCHCUT<br>
    Punchcut is a San Francisco-based user interface design company that specializes in improving mobile user experiences. To us, mobile is not a device, it is a lifestyle. We work with device manufacturers, operators and leading entertainment brands to design for people in motion. //</p>
    <p>// ABOUT TYPOPHILE<br>
    Typophile is an international collaborative community of visual designers, typographers and type designers. Typophile is driven by sharing and the idea that we are always learning. Now in its ninth year, it is one of the oldest design communities online. Typophile is a Punchcut brand. //</p>
    <p>// ABOUT THE SOCIETY OF GRAPHIC DESIGNERS OF CANADA<br>
    The Society of Graphic Designers of Canada (GDC) is a member-based organization of design professionals, educators, administrators,students and associates in communications, marketing, media and design related fields.<br>
    Since 1956, the GDC has been an advocate, voice and resource for Canada's graphic design profession. We are a national certified body of graphic designers promoting high standards of visual design and ethical business practices for the benefit of Canadian industry, commerce, public service and education. Through the media, publications, seminars, events, conferences and exhibits, the GDC builds awareness of graphic design and its essential role in business and society.<br>
    The GDC has more than 1,000 members in 9 chapters across Canada. In addition to our professional members, we are also lucky to have several hundred student members. Find out how you can be part of Canada's foremost graphic design association. //</p>
