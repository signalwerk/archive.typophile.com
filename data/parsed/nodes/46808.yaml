    <p>TypeCon2008 Conference event series- Buffalo NY July 15-20<br>
    Public Event </p>
    <p><strong>Typographic Excursion to RIT</strong><br>
    Cary Graphic Arts Collection<br>
    90 Lomb Memorial Drive<br>
    Rochester NY<br>
    Tuesday July 15, Noon<br>
    Free, Open to the general public</p>
    <p>Take advantage of an opportunity to visit the Cary Graphic Arts Collection at RIT. David Pankow, the curator, will show rare typographic treasures from the collection, including the recently acquired original drawings and final artwork for Hermann Zapf's seminal work Feder und Stichel (Pen and Graver). Visitors will also be able to view an exhibition of Artists' Books from the RIT collections in the Cary showcases.</p>
    <p>One of the most comprehensive archives of 19th-century type design resides in the Cary Graphic Arts Collection at RIT.</p>
    <p>Arrive on your own by 12 noon<br>
    For reservations email: <a href="mailto:info@typesociety.org">info@typesociety.org</a><br>
    or Xpress shuttle only $10 for TypeCon attendees ($20 for general public)<br>
    (van leaves Downtown Buffalo Hyatt Hotel at 10 sharp)</p>
    <p><a href="http://www.typecon.com/" title="http://www.typecon.com/">http://www.typecon.com/</a></p>
