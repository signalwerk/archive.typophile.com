    <p>woohoo! i just bought myself a christmas present, one of the <a href="http://store.house33.com/index.php?page=clothing&amp;id=54&amp;category=sweaters#54" rel="nofollow">spiffy trainers from House 33</a>. the best part, i can install it on 6 devices:<br>
    <code><br>
    Product ····················· Devices Qty Price Extended<br>
    ----------------------------- ------- --- ----- --------<br>
    House·Industries·Trainer ·········· 6 · 1 ·XXX.00 XXX.00<br>
    ----------------------------- ------- --- ----- --------<br>
    ········································· Shipping: X.00<br>
    ···································· Grand Total: XXX.00<br>
    </code><br>
    does that mean that i can let up to 5 other people borrow it when i'm not wearing it???</p>
    <p>(it's a pity that typophile deletes all my extra spaces so i had to use middots)</p>
