    html: "<p>This looks like a combination of Futura and Bayer's \"Universal\". It often helps to look at the work of other designers, so take a gander at these: <br><a href=\"http://www.myfonts.com/FontFamily4606.html\" target=\"_top\">http://www.myfonts.com/FontFamily4606.html</a> <br><a href=\"http://www.thefoundrystudio.co.uk/architypes.html\" target=\"_top\">http://www.thefoundrystudio.co.uk/architypes.html</a> <br> <br>Aesthetically, I'd say that the horizontal bar of \"f\" is a bit short (so is the \"t\"'s), the missing dot on the \"j\" is great, the \"k\"'s upper arm should reach the x-height, the \"r\"'s beak is too big, the \"s\" is too flat/wide, and the \"t\", \"v\" &amp; \"z\" are nice. <br> <br>Technically, I'd point out that you really need to taper the joints (like between bowl and stem in the \"b\") at least a little, to avoid clotting. Like this: <a href=\"http://www.myfonts.com/Character0062Style577.html\" target=\"_top\">http://www.myfonts.com/Character0062Style577.html</a> <br> <br>But I see a bigger problem: this design is very mechanical (your \"systematic thought\"), which might be OK except it doesn't convey the balance you say you're shooting for. You might consider putting some quirkiness in each character, either structurally (like giving the \"z\" a descender - although the \"z\" actually has a lot of flair already), or in terms of finish (like giving the terminals some calligraphic inflection). <br> <br>hhp</p>"
    html_clean: "<p>This looks like a combination of Futura and Bayer's \"Universal\". It often helps to look at the work of other designers, so take a gander at these: <br><a href=\"http://www.myfonts.com/FontFamily4606.html\" target=\"_top\" class=\"link-external\">http://www.myfonts.com/FontFamily4606.html</a> <br><a href=\"http://www.thefoundrystudio.co.uk/architypes.html\" target=\"_top\" class=\"link-external\">http://www.thefoundrystudio.co.uk/architypes.html</a> <br> <br>Aesthetically, I'd say that the horizontal bar of \"f\" is a bit short (so is the \"t\"'s), the missing dot on the \"j\" is great, the \"k\"'s upper arm should reach the x-height, the \"r\"'s beak is too big, the \"s\" is too flat/wide, and the \"t\", \"v\" &amp; \"z\" are nice. <br> <br>Technically, I'd point out that you really need to taper the joints (like between bowl and stem in the \"b\") at least a little, to avoid clotting. Like this: <a href=\"http://www.myfonts.com/Character0062Style577.html\" target=\"_top\" class=\"link-external\">http://www.myfonts.com/Character0062Style577.html</a> <br> <br>But I see a bigger problem: this design is very mechanical (your \"systematic thought\"), which might be OK except it doesn't convey the balance you say you're shooting for. You might consider putting some quirkiness in each character, either structurally (like giving the \"z\" a descender - although the \"z\" actually has a lot of flair already), or in terms of finish (like giving the terminals some calligraphic inflection). <br> <br>hhp</p>"
