    <p>I've completed a three-weight font with class kerning and everything. The font has many glyphs with alternates, but now after looking the font for awhile, I'm having second thoughts. I'd like to switch the alternate as the main character, for example, /four with /four.alt and /S with /S.alt and so on. Is there any easy way to change all instances of a glyph and its name in a font (including kerning, classes, code, etc)? Any macros or scripts that could handle this? I'm working with Fontlab 5.04.</p>
    <p>EDIT: Anyone? Please help, it's a two days of manual work there, all very prone to mistakes.</p>
  html_clean: |-
