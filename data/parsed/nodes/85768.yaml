    html: |-
      <p>Mark's script works pretty well in Robofont as well. If I wasn't busy I'd figure out how to update the character set sorting. This would be great if I could pair it with groups and a gui. </p>
      <pre># Swap Lists of Glyphs
      # Original version by Mark Simonson

      f = CurrentFont()

      tString = "A" # first glyph list
      listOne = tString.split(" ")

      tString = "B" # second glyph list
      listTwo = tString.split(" ")

      listTemp = [] 
      for i in listOne:
      	listTemp.append(i + ".temp")

      l = len(listOne)

      def setGlyphNames(listA, listB):
      	i = 0
      	while i &lt; l:
      		g = f[listA[i]]
      		g.name = listB[i]
      		g.update()
      		g.autoUnicodes()
      		g.update()
      		i = i+1
      		
      setGlyphNames(listOne, listTemp) # a -&gt; a.temp
      setGlyphNames(listTwo, listOne)  # A -&gt; a
      setGlyphNames(listTemp, listTwo) # a.temp -&gt; A

      print 'Done! %d pairs of glyphs swapped.' % l
      </pre>
