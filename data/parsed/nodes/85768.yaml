      <p>I asked about it on the RoboFab group ( <a href="http://groups.google.com/group/robofab" title="http://groups.google.com/group/robofab">http://groups.google.com/group/robofab</a> ) and Tal Leming responded:</p>
      <blockquote><p>Yes, with a caveat. The dialogs provided with robofab.interface.all.dialogs are misbehaving/not working in Mac OS 10.7. We're actively trying to resolve that but making a single API for all of the various OS, OS version and application combinations is frustrating. Other than that it works as far as we know. </p>
      <p>You'll need to install RoboFab from source. To do this you need to figure out which Python FontLab is using. I'd tell you which it is, but it changes frequently and I'm not 100% sure where things stand at the moment. To figure out the Python version, run this in the macro panel: </p>
      <p><code>import sys<br>
      print sys.version</code> </p>
      <p>Once you have this report, you can figure out which Terminal command you need. If you see 2.5, your command will be python2.5. If you see 2.6 and you are running OS 10.6, your command will be python. If you see 2.6 and you are running OS 10.7, your command will probably be python2.6 (I'm not running OS 10.7, so I'm guessing here). If you see 2.7, you are almost certainly running OS 10.7 (otherwise you really messed up your system) and your command will be python. </p>
      <p>Now follow these steps, replacing yourpythoncommand with your Python command as defined above. </p>
      <p>1. If you don't have it already, get the "RoboFab + FontTools + DialogKit Combo" zip here: <a href="http://robofab.com/download/index.html" title="http://robofab.com/download/index.html">http://robofab.com/download/index.html</a><br>
      2. Unpack the zip and put it in a location where you want the files to live. For example <code>/Applications/RoboFab</code>.<br>
      3. Open Terminal.<br>
      4. Type "<code>cd </code>" (the space is required) and drag the FontTools folder to the Terminal window. This should give you something like "<code>cd /Applications/RoboFab/FontTools</code>". Hit return.<br>
      5. Type "<code>sudo yourpythoncommand setup.py install</code>". Hit return.<br>
      6. A bunch of installation notes should appear.<br>
      7. Type "<code>sudo yourpythoncommand </code>" (the space is required) and drag the install.py file in the RoboFab directory to the Terminal window. Hit return.<br>
      8. "<code>Robofab is now installed.</code>" should appear along with some other text.<br>
      9. Type "<code>sudo yourpythoncommand </code>" (the space is required) and drag the install.py file in the DialogKit directory to the Terminal window. Hit return.<br>
      10. "<code>dialogKit is now installed.</code>" should appear along with some other text.<br>
      11. Restart FontLab if you have it open. </p>
      <p>Hopefully this will work. We'll likely try to make this easier when the dust settles.</p></blockquote>
      <p>This worked for me using MacOS 10.6 and FL 5.1. Scripts run noticeably faster, too.</p>
