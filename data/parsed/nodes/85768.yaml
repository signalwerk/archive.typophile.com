      <p>Scratch that script (unless it's useful for some reason). Here's a version that will swap any two lists of glyphs. Note: The lists (obviously) must be equal in length.</p>
      <pre># Swap Lists of Glyphs

      from robofab.world import CurrentFont, CurrentGlyph

      f = CurrentFont()

      tString = "a b c" # &lt;- put your first glyph list here
      listOne = tString.split(" ")

      tString = "A B C" # &lt;- put your second glyph list here
      listTwo = tString.split(" ")

      listTemp = [] 
      for i in listOne:
      	listTemp.append(i + ".temp")

      l = len(listOne)

      def setGlyphNames(listA, listB):
      	i = 0
      	while i &lt; l:
      		g = f[listA[i]]
      		g.name = listB[i]
      		g.update()
      		g.autoUnicodes()
      		g.update()
      		i = i+1
      		
      if len(listOne) == len(listTwo):
      	setGlyphNames(listOne, listTemp) # a -&gt; a.temp
      	setGlyphNames(listTwo, listOne)  # A -&gt; a
      	setGlyphNames(listTemp, listTwo) # a.temp -&gt; A
      	fl.UpdateFont()
      	print 'Done! %d pairs of glyphs swapped.' % l
      else:
      	print "Can't run. Lists are not equal."</pre><p>
      Edit: I deleted the version I posted here earlier. This version is shorter and more efficient.</p>
      <p>The second part about class kerning stands.</p>
