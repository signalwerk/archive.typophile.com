      <p>Maybe clearing the unicode values before running autoUnicodes would ensure that existing values don't persist.</p>
      <p>Here's a short script that swaps names and unicodes for any two selected glyphs in the font window:</p>
      <pre>#FLM: Swap Glyphs
      """Swaps two selected glyphs."""

      f = fl.font
      fIdx = fl.ifont

      selGlyphs = [ f.glyphs[gIdx] for gIdx in range( len(f.glyphs) ) if fl.Selected(gIdx) ]
      if len(selGlyphs) == 2:
        selGlyphs[0].name, selGlyphs[1].name = selGlyphs[1].name, selGlyphs[0].name
        selGlyphs[0].unicodes, selGlyphs[1].unicodes = selGlyphs[1].unicodes, selGlyphs[0].unicodes
        fl.UpdateFont(fIdx)
      </pre><p>
      And yes, it is possible to access classes and features through python via <code>fl.font.classes</code> and <code>fl.font.features</code>, but those require further parsing to manipulate the data. It'd be nice to have a python method similar to the "Rename Glyph" tool in the Glyph menu, but that functionality seems to be absent from the python API.</p>
