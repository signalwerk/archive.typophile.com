      <p>listThree? I don't see that. In an earlier version I posted it may have been in there (that was the name I previously used instead of "listTemp"). "listTemp" is a copy of "listOne" with ".temp" appended to the glyph names. It's necessary to assign these temporary names to the first set of glyphs before assigning the first list names to the glyphs in the second list. Once that's done, then it's safe to assign the names from the second list to the glyphs in the first list. You can't just sort of say a=A and A=a or you end up with both having the same names (wich won't work anyway).</p>
      <p>It's up to you to make sure the two lists have the same number of items. (Presumably, you are swapping pairs of glyphs; one list has the first member of the pair, the other list has the other. So they should number the same.) Edit: I rewrote it to include code to check that the lists are the same length. It will tell you if they are not.</p>
      <p>Also, it is possible to put way more than 19 glyphs in the lists. You can make the macro window wider, and you can scroll to the right. (I have run into a limit before, but it was way higher than 19.)</p>
      <p>It's probably possible to access the OT features and class data with a script, but I haven't investigated that.</p>
