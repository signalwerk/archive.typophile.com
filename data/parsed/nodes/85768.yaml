      <p>Here's a small script I wrote for renaming glyphs. It assumes Robofab is installed. You type in two list of glyph names--the current ones and the ones you'd like to replace them with. With your particular task, you'd probably have to run it three times--once to change your standard names to a temporary name (e.g., a.temp), once to change your alt glyphs to standard names, and once to change the temporarily named glyphs to the alt names. (Describing this sequence, it's apparent that it wouldn't be too hard to write a script that does it all in one run, but I have other things I'm supposed to be working on. Even so, it should still be faster than doing it manually.)</p>
      <p>As for the class kerning, I'll assume you've created the kerning classes in FontLab's class panel. You could export your classes as a text file, do a round of search and replaces in a text editor (similar to the steps I described with the script), and then import the classes, replacing the existing ones. Note: the kerning will stay with the original glyphs, even when you rename them. Once you've done all this, rebuild the kern feature. There's probably an easier way to do this, but I've done it this way and it works.</p>
      <p>Here's the script:</p>
      <pre>from robofab.world import CurrentFont, CurrentGlyph

      f = CurrentFont()

      tString = "a b c" # put your 'before' glyph list here
      listOne = tString.split(" ")

      tString = "a.1 b.1 c.1" # put your 'after' glyph list here
      listTwo = tString.split(" ")

      i = 0
      while i &lt; len(listOne):
      	g = f[listOne[i]]
      	g.name = listTwo[i]
      	g.update()
      	g.autoUnicodes()
      	g.update()
      	i = i+1
      		
      fl.UpdateFont()

      print "All done."</pre>
