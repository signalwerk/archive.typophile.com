    html: |-
      <p>Regarding the duplicate Unicode values when swapping with .alt or other non-coded glyphs— apparently Robofab’s <code>autoUnicodes</code> method doesn’t remove the value unless it finds a new one to substitute. Adding <code>g.unicodes = []</code> above <code>g.autoUnicodes()</code> will prevent coded glyphs from keeping their old values after swapping names with non-coded glyphs.</p>
      <p>As an exercise of my limited scripting abilities, I tried to extend my “Swap Two Selected Glyphs” macro to mimic Mark’s “Swap Lists of Glyphs”. This version is FontLab-only and does not require Robofab.</p>
      <pre>#FLM: Swap Two Glyph Lists
      """Swaps two sets of glyphs."""
      # (based on Mark Simonson's "Swap List of Glyphs")

      f = fl.font

      listOne = "a b c" # &lt;- put your first glyph list here
      listTwo = "A B C" # &lt;- put your second glyph list here

      listOne, listTwo = listOne.split(" "), listTwo.split(" ")

      if len(listOne) == len(listTwo):
      	for i in range( len(listOne) ):
      		g1 = f.glyphs[ f.FindGlyph( listOne[i] ) ]
      		g2 = f.glyphs[ f.FindGlyph( listTwo[i] ) ]
      		fl.SetUndo(g1.index)
      		fl.SetUndo(g2.index)
      		g1.name, g2.name = g2.name, g1.name
      		g1.unicodes, g2.unicodes = g2.unicodes, g1.unicodes
      	fl.UpdateFont()
      	print 'Done! %d pairs of glyphs swapped.' % len(listOne)
      else:
      	print "Can't run. Lists are not equal."
      </pre>
