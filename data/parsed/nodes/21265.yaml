      <p>Hey this is looking alot better. I like that first "f", something about that descender is nice. You might want to carry that look into the "t" and the "j". I see you reworked the "e" and the "s" as well, while the letterforms are much more consistant with the rest of the alphabet, they still seem unfinished. Both have a compressed look (as if smushed from the top down.) The "s" is definitely too wide as well. I know you're trying to make every character unique, I think in this instance, you might have to give up and go with a more traditional look to these characters (follow?) </p>
      <p>As far as the Capitals. I'm not really feeling the majority of these at all. Most of them look like you took the lowercase letters and extended them or resized and compressed them. While they're not all horrible, I think this might need some new attention. </p>
      <p>I'm still very impressed with the look. This will be a fun font when you're finished. Keep at it.</p>
