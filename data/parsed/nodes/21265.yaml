    <p>Hi all,</p>
    <p>Had originally created a logo for a ficticious record label called "Fire" but decided to take the project further by doing a whole typeface. (Done in Illustrator.) It's a work in progress as I've literally spent a couple of days on the lowercase characters.</p>
    <p>If you image I started with F I R and E, these were made from quarter circles / half arches, depending on what you want to called them. Anyway, the logo looked quite effective (see attached image) so I continue to use the original shapes plus some straight lines.</p>
    <p>I've tried not to be too traditional with X-height - the C and E are good examples. The idea is to try and keep the characters as clean and simple as possible. I ran into problems creating a effective S, T and Z... I'm quite happy with the S and T now, but the Z isn't quite right - it doens't look at all right... I'm tempted to go for a simple X-height version, but ideally I wanted it to have a descender, like the C and E. I'm also considering losing the dots off the I and J (as the original Fire logo didn't have this.)</p>
    <p>Anyway let me know what you like, don't like about it. Would like to finish the l/c before I even attempt the u/c set.</p>
    <p>For numbered characters, I was thinking to ditch the traditional idea of English/Mathematical numbers, but to replace with digits or even just the words: EG: "3" would be "three" or "..." - that way 131 would be: "onethreeone" or ". ... ."</p>
    <p>I wish I was a student again, I'd have ore time, but would lack money!<img src="/sites/default/files/old-images/Fire-Text_5007.gif][img:sites/default/files/old-images/Fire-Logo_4727.gif"></p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/Fire-Logo.gif" width="363" height="466" alt="">
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/Fire-Text.gif" width="2113" height="773" alt="">
