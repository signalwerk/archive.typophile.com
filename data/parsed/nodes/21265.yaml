      <p>Russ -</p>
      <p>     I really like this type face, although its definetly not a complete system yet and you should push it further. I know Im coming into this discussion late as its December now and you all havent posted since August but keep up the interesting work! </p>
      <p>   A couple quick suggestions:</p>
      <p>    - have you investigated what a rounded terminal would do for some of the characters?<br>
          - try adding a curling descender to certain letters (k, m, n, etc) like on your 'y' but with an exaggerated curl?<br>
          - Your caps do seem condensed, also the B and R have akward bowl shapes, I would reccomend incorporating a look similr to the g, p, q</p>
      <p>    Im really into this typeface, creating an entire type face is no small task, keep going. I think your number/lettering concept was interesting; kind of out there...have you looked into old numerals with offset baselines? I think you may be apt to follow that route as your descenders are already breaking ground so to speak, I would love to see that carry over into the numerals.</p>
      <p>~ 3r</p>
