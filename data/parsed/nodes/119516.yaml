  html: |-
    <p>Hi everybody! I am happy to announce the release of Cavatina: an experimental font for musical notation. It is the result of two years of work in design and programming.</p>
    <p>Cavatina is my misuse (to put it nicely) of the OpenType font architecture, inspired by Travis Kochel's FF Chartwell. Similarly, the font relies on contextual alternates and ligatures to take care of the formatting and allow the support of a wide range of musical grammar. Among others, it is possible to write over four octaves of different notes, key and time signatures, barlines, accidentals, articulations as well as ornamentation, providing a system robust enough to allow fast musical composition. Additionally, I have written an open-source converter that translates the Cavatina text files to MIDI and MusicXML. A browser based text editor with integrated MIDI playback is also provided for the majority of those who don’t have a Mac.</p>
    <p>Without any further talk, go check out the website: <a href="http://cavatinafont.com" rel="nofollow">cavatinafont.com</a>.<br>
    To test the font you can go through the <a href="http://cavatinafont.com/quickstart.html" rel="nofollow">quick start</a>. You don’t have to be a musician to understand how it works.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/web-promo-1_6202.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/web-promo-2_4803.png"></div><p></p>
    <p>Tell me what you think!</p>
