      <p>Hi I sent this to my musician friends, although I am not one myself. I tested it briefly just enough to realise the amount of work and ingenuity that it must have taken you to "mis"-use OT and with such apparent success. Congratulations.<br>
      May I suggest that when you promote it you make the image of the notes more prominent than the font name, lest people think it is just another letter font.<br>
      I 'misused' OT (in a much less demanding way than to create notation)  when I created a font to type diagrams for my physics paper:  <a href="http://vladimirtamari.com/beautiful_universe_font.html" title="http://vladimirtamari.com/beautiful_universe_font.html">http://vladimirtamari.com/beautiful_universe_font.html</a><br>
      Good luck!</p>
