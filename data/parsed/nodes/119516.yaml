    html: <p>Lex I am no authority on OT features, but using VOLT it is easy to change the positions of various elements. But after writing my comment I realised that not all software implement Arabic features (including marks) . For example Open Office does not display Arabic (right-to left text) correctly. Do try different ways..but 'if it ain't broke, don't fix it!" ;)</p>
