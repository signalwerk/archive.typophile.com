      <p>Agree Bob that it's lettering. There are quite a few condensed Gothics [sans serifs] but none are really close, having crossbars on the A that are lower than the lettering.<br>
      For example Gothic Narrow by Wooden Type Fonts<br><a href="http://www.myfonts.com/fonts/woodentypefonts/gothic-narrow/">http://www.myfonts.com/fonts/woodentypefonts/gothic-narrow/</a><br>
      Don</p>
