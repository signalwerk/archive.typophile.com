    html: |-
      <p>"It’d be great to know more about the creative process"</p>
      <p>My concept for the typeface was to give it a bit of a razorwire flavor so I did it all with straight lines and allowed sharp protrusions where there were intersections but in a controlled manner so that the glyphs would interlock a bit. I limited the angles to one oblique of a bout 40 degrees and 90 degrees from it or the baseline. I may complete the typeface and see if there is a market for a modern blackletter perhaps with the rock band folks or some such thing.</p>
      <p>The border is supposed to look like that tire chain stuff that is seen around license plates on cars.</p>
      <p>ChrisL</p>
    html_clean: |-
