      <p>I have just been looking at the posters that Zara kindly posted as examples and realize that mine is too slick for the genre. Randy has done a masterful job of catching the flavor perfectly. I am assuming these posters are typically hand done and bargain printed. Unlike boxing or WWF posters where big money promoters were involved, Luchador seems more grassroots. </p>
      <p>Great job, Randy!</p>
      <p>Tezzu, What does Vetico mean? I seem to be the only person on this thread who does not speak Spanish :-)</p>
      <p>ChrisL</p>
