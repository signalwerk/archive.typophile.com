    <p><strong>// THIS WEEK'S CHALLENGE:</strong></p>
    <p>This week's challenge has two parts. Choose one or both options for your submission.</p>
    <p>Option 1: Using a Luchador name of your choice, <cite>draw the type</cite> that would be used to set your Luchador name onto a Lucha Libre style poster. </p>
    <p>Option 2: Draw a set of dingbats that could be used on a Lucha Libre poster.</p>
    <p>Bonus points and extra bragging rights for those who do BOTH and/or design a Lucha Libre poster.</p>
    <p>References:<br>
    <a href="http://en.wikipedia.org/wiki/Lucha_libre" rel="nofollow">Lucha Libre</a><br>
    <a href="http://flickr.com/search/?z=t&amp;ss=2&amp;ct=6&amp;w=all&amp;q=lucha+libre+poster&amp;m=text" rel="nofollow">Poster samples</a><br>
    </p>
    <p>// ABOUT TYPOPHILE TYPE BATTLES</p>
    <p>Here's your chance to stretch your type muscles. You have one week to create and submit your entry. Anyone may submit a design response to the challenge. You may enter as often as you wish. Post anytime. Critiques and comments are welcome throughout the game, from participants and spectators alike. Smack talk is encouraged.</p>
    <p>As with any street battle, there is no panel of judges and no prize — only the ability to call yourself the best on the block.</p>
    <p>Link directly to this thread: <a href="http://www.typophile.com/battle24" title="http://www.typophile.com/battle24">http://www.typophile.com/battle24</a><br>
    View all past Type Battles: <a href="http://typophile.com/" rel="nofollow">Typophile</a> / <a href="http://www.typophile.com/projects/" rel="nofollow">Projects</a> / <a href="http://typophile.com/typebattles" rel="nofollow">Type Battles</a></p>
    <p>// REQUIREMENTS</p>
    <p>- Image size: 550 width x 400 height. 72 dpi<br>
    - Color: Usually we stipulate black and white, but not this week<br>
    - Format: Please save your graphics as PNG</p>
    <p>Winner take all, no holds barred. May be the best designer win.</p>
