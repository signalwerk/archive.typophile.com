    <p><strong> <a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12270" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typefaces</a>&nbsp;:&nbsp;Optima</strong></p>
    <p>Optima, one of <a href="/node/12150" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Hermann Zapf</a>’s most successful typefaces, was released by the <a href="/node/12158" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">D. Stempel <span class="caps">AG</span></a> in&nbsp;1958. </p>
    <p>In 1950, Zapf made his first sketches for his “serifless roman” while visiting the Santa Croce church in Florence. He sketched letters from grave plates that had been cut about 1530, and as he had no other paper with him at the time, the sketches were done on two 1000 lire bank notes. These letters from the floor of the church inspired Optima, a typeface that is classically roman in proportion and character, but without serifs. The letterforms were designed in the proportions of the Golden&nbsp;Ratio. </p>
    <p>In 1952, after careful legibility testing, the first drawings were finished. The type was cut by Stempel’s renowned punchcutter, <a href="/node/15687" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">August Rosenberger</a>. Optima was also produced in matrices for the <a href="/node/12232" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Linotype Machine</a>. With the clear, simple elegance of its sans serif forms and the warmly human touches of its tapering stems, this family has proved popular around the&nbsp;world. </p>
    <p>Optima is the typeface used for the text on the Vietnam Veterans’ Memorial in Washington, <span class="caps">D.C.</span></p>
    <p>In 2002, Hermann Zapf and <a href="/node/12234" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Akira Kobayashi</a> developed <a href="/node/15686" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Optima nova</a>, an expansion and redesign of the Optima family. The Linotype website has complete overviews of the <a href="http://www.linotype.com/1305/optima-family.html">original Optima type family</a>, as well as the <a href="http://www.linotype.com/54142/optimanova-family.html">Optima nova fonts</a>.</p>
    <p><strong>Discussion:</strong><br><a href="http://typophile.com/node/54094">Optima and&nbsp;friends</a></p>
