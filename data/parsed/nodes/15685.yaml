    <p><strong> <a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Typefaces" class="freelinking" rel="nofollow">Typefaces</a> : Optima</strong></p>
    <p><img src="http://upload.wikimedia.org/wikipedia/commons/thumb/7/70/Optima_font_sample.svg/198px-Optima_font_sample.svg.png" img=""></p>
    <p>Optima, one of <a href="/wiki/Hermann%20Zapf" class="freelinking" rel="nofollow">Hermann Zapf</a>'s most successful typefaces, was released by the <a href="/wiki/D.%20Stempel%20AG" class="freelinking" rel="nofollow">D. Stempel AG</a> in 1958. </p>
    <p>In 1950, Zapf made his first sketches for his "serifless roman" while visiting the Santa Croce church in Florence. He sketched letters from grave plates that had been cut about 1530, and as he had no other paper with him at the time, the sketches were done on two 1000 lire bank notes. These letters from the floor of the church inspired Optima, a typeface that is classically roman in proportion and character, but without serifs. The letterforms were designed in the proportions of the Golden Ratio. </p>
    <p>In 1952, after careful legibility testing, the first drawings were finished. The type was cut by Stempel's renowned punchcutter, <a href="/wiki/August%20Rosenberger" class="freelinking" rel="nofollow">August Rosenberger</a>. Optima was also produced in matrices for the <a href="/wiki/Linotype%20Machine" class="freelinking" rel="nofollow">Linotype Machine</a>. With the clear, simple elegance of its sans serif forms and the warmly human touches of its tapering stems, this family has proved popular around the world. </p>
    <p>Optima is the typeface used for the text on the Vietnam Veterans' Memorial in Washington, D.C.</p>
    <p>In 2002, Hermann Zapf and <a href="/wiki/Akira%20Kobayashi" class="freelinking" rel="nofollow">Akira Kobayashi</a> developed <a href="/wiki/Optima%20nova" class="freelinking" rel="nofollow">Optima nova</a>, an expansion and redesign of the Optima family. The Linotype website has complete overviews of the <a href="http://www.linotype.com/1305/optima-family.html" rel="nofollow">original Optima type family</a>, as well as the <a href="http://www.linotype.com/54142/optimanova-family.html" rel="nofollow">Optima nova fonts</a>.</p>
