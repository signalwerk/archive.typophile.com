      <p>There are several points that need to be specified in detail to calculate pricing. I'm going to try to list as many as I can think of here. If you lot have more let me hear.</p>
      <p>1) Glyph repertoire. Which languages have to be supported? (more glyphs, more time, time is money). Some styles are faster to design something like small caps for, eg. sans serif designs. Numerals: All four types or just one? Do you really need italic small caps?</p>
      <p>2) Quality – designing typefaces is an iterative process. Spend more time, get a better result. More time, more money.</p>
      <p>3) Intellectual property rights – Which immaterial rights are transferred to you, the client? A 'full buy-out' transfers all right for perpetuity (until they fall into the public domain) to you the client, and the designer does not get a royalty. This form of buy-out is costly, and based on the scope of the use. Large corporations with global use for all employees, and for all marketing, pay a lot more for this than a small company.</p>
      <p>3) Transfer rights. Can you, the client, sell, lend, or give away the typeface? This costs more. Is the typeface used in computer software incl. mobile telephones, sat-nav, television sets, set-top boxes, &amp;c?</p>
      <p>4) Technical considerations. How good does the fonts have to be technically speaking? Which software environments does the fonts have to work in, in which environments would 'partial functionality' be accepted, and which environments does not apply?</p>
      <p>Since screen rendering is important for you, then you must define exactly which environments you are talking about. Take as an example the popular (or so I've heard) Windows operating system. There are many versions of Windows with different rendering engines, combine that with user settings, browser versions, and user hardware and you have a very long list of targets. The 'hinting' process makes fonts render better on Windows. Hinting can be slow and expensive – especially if you target non-aliased environments.</p>
      <p>In many professional fields there goes the saying "You can have it good, fast, cheap. Pick any two." In typeface design you get to pick one.</p>
