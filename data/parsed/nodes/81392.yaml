      <p>For decent quality without hiring a big name, if you need to own it outright, you could expect to spend probably $20,000-60,000 USD on a project like that. Not too hard to keep it toward the lower end of that if you shop around and aren't set on using one of just a couple of specific designers.</p>
      <p>Yes, that's a big range. People's rates vary, as does quality and speed. More time and money from a given designer will give you more polish.</p>
      <p>Really big name type designers might charge more like ~ $100,000 per family, btw. Of course, they will usually only do it one way as well, really polished.</p>
      <p>These are just ballparks, but I have had occasion to price a lot of type design in the not too distant past.</p>
      <p>Cheers,</p>
      <p>T</p>
