    <p>I guess this is an RFQ, after all. Although really all I'm after is the general price range.</p>
    <p>Let's say I've fallen in love with a couple of typefaces, and I think they would pair beautifully just as they are, and I've bought them for my print uses.</p>
    <p>Let's say that screens are an important target medium for me, and initial tests suggest that the fonts I've bought have some minor problems at typical screen sizes (I go for 15px, more or less).</p>
    <p>I saw a vid clip once w/ Erik Spiekermann saying "when someone asks me for a font like font-X, I study it for a couple of days and then walk away from it for a couple of days and only THEN do I start to draw letters, relying on memory alone..." thereby ensuring that the new font is inspired by, but not a knock-off of, the source font. I think this is a cool idea.</p>
    <p>So let's say the design spec was: "here's two typefaces, I use them for my print stuff. I need similar faces that work better for web: slightly larger x-height, slightly more open counterforms, slightly larger aperature, slightly bigger letter spacing, blah blah blah. Oh, and x-height equalized between the two. Normal, Italics (true italics preferred), Bold, and Bold Italics for each."</p>
    <p>Oh and one of the source-inspiration fonts (the serif) doesn't have an italics to start with (and I know that that's for historical-accuracy purposes).</p>
    <p>What's this gonna set me back?!?</p>
    <p>p.s. as a bonus, how much additional to make me my type-based logo and draw my accompanying dragon-icon-logo for me?</p>
