      <p>Having done an enormous amount of custom font development during my career, my advice would be to put an average per glyph price on the work and present the results of the multiplier to your client as the price of the job,</p>
      <p>Per glyph price would include drawing, spacing kerning, and hinting, and could vary quite a bit based on level of exclusivity the final work would fit into.. One glyph may take an hour to draw and one may be a component assembly that is done in 5 seconds. That is why an AVERAGE per glyph price should be used in the calculations. Whatever that variation in price, I've found clients respond best to this approach rather than some number that to them may seemed plucked out of the air.</p>
