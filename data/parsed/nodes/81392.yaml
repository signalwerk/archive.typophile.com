      <p>Regarding asking typophile for quotes, I see somewhat of a slipery slope. I could argue both sides, but at the end of the day, preparing a quote is usually something that takes time and carefull consideration. Asking someone for a number off the top of their head has the potential to downplay the value, and, worst case scenario, result in a mis-informed under-bidding war.</p>
      <p>In an RFP context, people’s quotes usually aren’t shared publically. Communication happens between client and vendor.</p>
      <p>Perhaps a board dedicated to this with profiles and contact information that potential clients could browse and contact directly would be an idea?</p>
