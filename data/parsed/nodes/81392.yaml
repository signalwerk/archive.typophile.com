    votes: null
    html: <p>I second James' recommendation re. per-glyph costing. We generally perform fairly detailed glyph set analysis before quoting on font development, so are able to distinguish base glyphs and composites and assign different costs to each for design and hinting. Other aspects of the development, e.g. OpenType Layout work, is separately calculated based on time estimates.</p>
