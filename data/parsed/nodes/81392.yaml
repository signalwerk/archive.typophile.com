      <p>Chris: I wonder if what Hrant was saying was that seeing other people's analysis of the tasks and work involved might be educational, and help others notice potential gotchas and issues in the work? I recently had occasion to be consulted in the development of the RFP for a middling-large font project, and I must say that I caught more things each time I went over it. I imagine that responses to an RFP could be similar in that regard, if they were public.</p>
      <p>That being said, I agree that in most lines of work the proposals coming in are not public, and that there are competitive reasons for this related to pricing, and secondarily related to simply sharing expertise. Having proposals coming in be public would probably tend to generate more homogenous pricing (pushing pricing toward the lower middle, I expect), and making public the analysis-of-work component of the proposals would tend to give the largest benefit to the less experienced folks involved.</p>
      <p>So, at first blush I'm thinking public proposals are on average good for the lower-mid to very low-end producers, and probably bad for the upper-mid-range folks. Probably minimal effect on the top end, as they aren't competing on price anyway and have plenty of expertise to not miss issues in the project definition. Probably neutral to good for the customer, though that depends on a variety of particulars, including the complexity of the project and their likely price range and price sensitivity.</p>
