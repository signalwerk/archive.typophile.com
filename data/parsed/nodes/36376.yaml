      <p>There's a pretty good possibility that the original font used was unembellished, including the mid-stroke burrs. The font also looks rather compressed, which was probably done manually to. </p>
      <p>I wish Josh was on Typophile more often, but he's a busy man these days. </p>
      <p>I'm sure a well meaning email could illicit some better responses.</p>
      <p>you can find it at his website: hydro74.com</p>
