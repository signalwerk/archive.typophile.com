    <p>Hello all,</p>
    <p>This is a deceptively simple font to identify -- for me at least.  I've searched the web extensively, gone to <a href="http://www.whatthefont.com">www.whatthefont.com</a>, and have obtained no concrete results.  This font looks so familiar...but subtly different.</p>
    <p>The font I'm talking about is the font (or, what I'm assuming is a font) used in the logo for the movie "Titanic" : not Trajan, but the Impact-esque font used in the logo (with the rivets in the text).  First glances make this seem like Impact, but the font doesn't quite match up to the logo.  (For instance, the "T" is different...it has slight points on each end of the horizontal line.)</p>
    <p>Any suggestions as to what this font might be would be greatly appreciated.  Examples are included below.  (Some are taken from promotional material for the film; others are taken from the film's movie trailers.  These fonts seem to be roughly the same.)</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/titanic.jpg" width="241" height="100" alt="">
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/titaniclogo.jpg" width="470" height="188" alt="">
