    html: |-
      <p>The closest "Helvetica" I could find was "Helvetica Inserat," which is an almost exact duplicate of "Impact."  :(  The thing to notice is that there is a slight sharpness on the bottom and top edges of the letters, most noticeably in the bottom example (one with the rivets).  Notice how the T and I have a sort of spread-out at the bottom ... it's subtle, but noticeable.  Helvetica Inserat (and Impact) don't have this.  Also, for some reason, I think that the bar in the "A" character is a bit too high in Helvetica Inserat (and Impact)...I'm not sure why I say this, but it doesn't look right to me.  One of the closest fonts I've found thusfar is Agency FB Black Compressed; however, the C doesn't match up on this, and it's still very not close.</p>
      <p>Any other suggestions?</p>
