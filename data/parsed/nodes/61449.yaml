      <p>This is what is often referred to as psychadelic type. It's going to be hand-drawn in order to be wrapping in this style.</p>
      <p><a href="http://new.myfonts.com/fonts/adobe/arnold-boecklin/" rel="nofollow">Arnold Boecklin</a> is probably the most well known psychadelic style typeface.</p>
