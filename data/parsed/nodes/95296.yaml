  html: |-
    <p><img src="/sites/default/files/old-images/orga-a_3790.jpg"></p>
    <p>Hello there!</p>
    <p>We’re proud to announce the launch of our new type foundry <a href="http://www.typegroup.ie" title="Click to visit an external URL." class="freelink freelink-external freelink-external">TypeGroup</a>. Our first two releases are the ever-so-friendly sans-serif family <a href="http://www.typegroup.ie/fonts/orga" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Orga</a> and the chunky black slab <a href="http://www.typegroup.ie/fonts/kettle" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Kettle</a>.</p>
    <p>As well as designing and developing typefaces for sale, we’re seeking opportunities for collaboration on type-based projects.</p>
    <p>We love to talk about type so don’t be shy! Get in touch at <a href="mailto:hello@typegroup.ie">hello@typegroup.ie</a></p>
    <p>Follow us on Twitter <a href="http://twitter.com/typgrp" title="Click to visit an external URL." class="freelink freelink-external freelink-external">@typgrp</a></p>
