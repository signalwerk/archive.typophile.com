  html: |-
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/orga-a_3790.jpg"></div><p></p>
    <p>Hello there!</p>
    <p>We’re proud to announce the launch of our new type foundry <a class="freelinking external" href="http://www.typegroup.ie" rel="nofollow">TypeGroup</a>. Our first two releases are the ever-so-friendly sans-serif family <a class="freelinking external" href="http://www.typegroup.ie/fonts/orga" rel="nofollow">Orga</a> and the chunky black slab <a class="freelinking external" href="http://www.typegroup.ie/fonts/kettle" rel="nofollow">Kettle</a>.</p>
    <p>As well as designing and developing typefaces for sale, we’re seeking opportunities for collaboration on type-based projects.</p>
    <p>We love to talk about type so don’t be shy! Get in touch at <a href="mailto:hello@typegroup.ie">hello@typegroup.ie</a></p>
    <p>Follow us on Twitter <a class="freelinking external" href="http://twitter.com/typgrp" rel="nofollow">@typgrp</a></p>
