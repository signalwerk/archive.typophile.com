    <p>Hello. We’re looking for a second intern to join us in our San Francisco office. Rather than Typophile duties, we’re looking for a candidate to help with Punchcut marketing efforts. Please send a cover letter and PDF portfolio or portfolio URL to marketingposition [at] punchcut [dot] com.</p>
    <p><strong>DESCRIPTION</strong></p>
    <p>Punchcut is looking for a graphic design intern to aid with graphic design, event planning, publishing and public relations initiatives.</p>
    <p><strong>RESPONSIBILITIES</strong></p>
    <p>You will primarily:<br>
    • Coordinate design and production of online, print, mail, e-mail or other marketing campaigns: including web site updates, collateral and other items as requested</p>
    <p>You will also help:<br>
    • Maintain a marketing initiatives calendar, coordinate meetings with directors<br>
    • Maintain an event calendar and manage speaking submissions for events<br>
    • Coordinate marketing events and logistics (printing, shipping, etc.)<br>
    • Coordinate design and production of online, print, mail, e-mail or other marketing campaigns: including web site updates, collateral and other items as requested</p>
    <p><strong>QUALIFICATIONS</strong></p>
    <p>You must:<br>
    • exude pro-activity and possess a positive, energetic attitude<br>
    • have a creative approach to solving problems<br>
    • thrive in a flexible and evolving, entrepreneurial environment<br>
    • be detail-oriented and organized<br>
    • communicate well verbally and in writing<br>
    • have a knowledge of Adobe Creative Suite, Microsoft Office is a plus</p>
    <p>Additional Qualifications:<br>
    • Either you have 1-2 years working in a professional design environment,<br>
    • Or you are a Junior or Senior in a college level program focused on Design and/or Marketing communications</p>
    <p><strong>BENEFITS</strong></p>
    <p>The position is part time and requires working on site in our San Francisco Union Square office. We offer flexible hours, starting immediately. The duration is is negotiable and there is potential for full-time hire for the right candidate. This position reports to the M<!--
