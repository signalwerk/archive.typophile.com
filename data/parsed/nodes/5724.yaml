    html: "<p>Thanks Leslie &amp; Tiffany, I find this very entertaining. This did cheer me up, as did the fact that I was fortunately able to give some \"virtual\" talks at Fontlab Ltd.'s workshops at TypeCon, yesterday and today.  <br> <br>(I joined in over <a href=\"http://www.webex.com/\">WebEx</a>, a commercial online conferencing system that I must say I'm quite impressed with despite a few glitches.)  <br> <br>I definitely don't mind the story written by Leslie! But to clarify: I was not denied a visa but was rather victim to excessive bureaucracy that effectively prohibited me from applying for a visa in the first place. I <a href=\"http://www.typophile.com/forums/messages/4077/33767.html#POST68275\">described it in more detail</a> for those interested. Yuri did not even plan to go to TypeCon this time, BTW. But I definitely don't mind Leslie's and Tiffany's poetic license!  <br> <br>Unlike my non-existent terrorist links, I do confess that it was me who commited that satire piece about the \"respected educator and ATypI member\" who was arrested for changing the names on Roman statues to Greek. Damn it, it's <a href=\"http://www.atypi.org/30_past_conferences/10_Rome_2002/news_html?newsid=35\">still online</a>. Sorry Gerry! :&gt; I really hope that the story depicted there is so absurd that nobody would believe it! In particular, prospective type designers who want to study in Reading. BTW -- when I spoke to Gerry, the only thing he complained about was that I referred to him as \"scholar\" <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\">  <br> <br>Best,  <br>Adam <br> <br> <br></p>"
