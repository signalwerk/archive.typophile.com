    html: |-
      <p>Thanks for pointing me in the direction of slashed zero fonts but I was I was hoping to get away from programmer and windows based fonts.</p>
      <p>I was looking for something that was <strong>attractive and elegant</strong> while at the same time had the following characteristics:</p>
      <p>1.  Crisp clear characters.<br>
      2.  Extended characterset.<br>
      3.  'l', '1' and 'i' are easily distinguished<br>
      4.  '0', 'o' and 'O' are easily distinguished</p>
      <p>forward quotes from back quotes are easily distinguished -prefer mirrored appearance<br>
      Clear punctuation characters, especially braces, parenthesis and brackets.</p>
      <p>And whether on screen or printed looks fabulous and is a san serif.</p>
      <p>__________________________________________________<br>
      I know I am in my own little world, but its ok.  They know me here</p>
