    html: |-
      <p>Yes, Scala Sans can be a good text face. For titling, as you mentioned, you might try Luc(as) de Groot's Thesis Sans (or TheSans), especially the bolder weights, which will give a slightly different flavor to the headlines. Fred Smeijer's Quadraat Sans might be interesting, but I've never seen them paired like that, so the best option in that case would be to try it. :)</p>
      <p>If you're really going for some contrast, you might try Typotheque's Klimax, either Plus or Minus (or both), which will give you some very bold or light weights, respectively.</p>
      <p>Mixing type is really very subjective, especially within genres like sans, but it can make a design. But it really depends. What are you using it for?</p>
