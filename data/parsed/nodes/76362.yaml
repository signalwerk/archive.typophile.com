    html: |-
      <p>I've seen sans serifs with similar "spikes" on them, or perhaps you could call them overhangs... But I can't remember any of their names! I think Quadraat Sans would match very well for titling with Scala as text, they see to have some kind of similar structure. The best way to see is to try it! If you don't have Quadraat then you could probably go on fontshop or myfonts, or some similar site and type some example text and set it as large as you can, then go ahead and copy it and paste it onto your page. Print it out and see if it's good. You could also post a test here...</p>
      <p>As far as it goes, I think Quadraat Sans lends an air similar to that of a classic serif, but without the serifs. I don't know that it is necessarily elegant, but it just might work.</p>
      <p>Klimax is available for license from Typotheque. <a href="http://www.typotheque.com/fonts/" title="http://www.typotheque.com/fonts/">http://www.typotheque.com/fonts/</a> Also available from Typotheque is Brioni Sans, which may also work well. Or you could use DIN. I personally am intrigued with pairing Scala Sans with Quadraat Sans, but it could look great with any number of fonts I'm sure. :)</p>
      <p>Also, just curious, did you get inspiration for your original type selection idea from Ellen Lupton's Thinking With Type book? She used Scala for text, and Thesis Serif (TheSerif) for most headlines. Of course those are serif and not sans fonts, but the sans versions are probably similarly compatible.</p>
      <p>Also, if you're going for classy and elegant, you could break the sans only rule and use serifs a little. :)</p>
