    <p>Hello! I'd like to know your opinion, please!</p>
    <p>Is Scala Sans a good typeface for running text (body text)? (even thought its typographic colour seems a little "dark" and similar to Gill Sans, in my humble opinion)</p>
    <p>I really mean the sans version, not the serif one! (not Scala)</p>
    <p>And if it is good for running text, which typeface could be a good companion for it? (another sans, maybe for display headlines on a magazine?)</p>
    <p>I know there is a controversy mixing a sans serif with other sans serif, but I've seen it in use and it could work, sometimes, I guess?</p>
    <p>What do you people think? (maybe Scala Sans with TheSans or Scala Sans with DIN?)</p>
    <p>Thanks for your feedback!</p>
