      <p>My project is a magazine about design-related stuff, but actually, it's a magazine that wants to be a book. It must feel a little bit "classy" and "elegant", but without the serifs. The format is square, 24,6 x 24,6 cm. It is a magazine, but I want it to approach more the language of a book than of a magazine. It is not a "popular" magazine at all!</p>
      <p>I'll have a look at both Quadraat Sans and Klimax! (is Klimax available for licensing?)</p>
      <p>Thanks so much for your feedback, Brian! I never thought it was so complex to design a magazine that wants to be a book!</p>
