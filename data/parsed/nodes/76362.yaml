      <p>I loved Quadraat Sans "spiked" capitals! They look great! Is there any similar sans for headlines with such "spiked" capitals? But I didn't like the lower case "a", for example. In this case, I prefer the lowercases from "Thesis TheSans"! If only they had those "spiked"-like capitals!</p>
      <p>But it must all combine with Scala Sans...</p>
