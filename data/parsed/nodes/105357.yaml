  html: |-
    <p>Is the code correct or may be more simple?</p>
    <p>feature calt {<br>
    lookup swashes {<br>
      ignore sub [c ccedilla]' [b d f h k l]';<br>
      ignore sub o' [b d f h k l]';<br>
      ignore sub @originales' [i j t l]' @originales' @originales' ;<br>
      ignore sub r f;<br>
      sub [f.mid ff.mid] i' by dotlessi.alt;<br>
      sub i' t.mid by dotlessi.alt;<br>
      sub r' [g j y p q y z] by r.midcor;<br>
      sub [g j y p q y z] r' by r.midcor;<br>
      sub space @originales c' @originales by c.midcor;<br>
      sub space @originales ccedilla' @originales by ccedilla.midcor;<br>
      sub @originales @originales @NOmid' @originales @originales by @mid ;<br>
      } swashes ;<br>
      lookup cuatro {<br>
      ignore sub [c ccedilla]' [b d f h k l]';<br>
      ignore sub o' [b d f h k l]';<br>
          ignore sub @originales' [i j t l]' @originales' @originales' ;<br>
          ignore sub r f;<br>
      sub [f.mid ff.mid] i' by dotlessi.alt;<br>
      sub i' t.mid by dotlessi.alt;<br>
      sub r' [g j y p q y z] by r.midcor;<br>
      sub [g j y p q y z] r' by r.midcor;<br>
      sub @originales @originales @NOmid' @originales by @mid ;<br>
      sub @originales @NOmid' @originales @originales by @mid ;<br>
      } cuatro;<br>
      lookup tres {<br>
        ignore sub [c ccedilla]' [b d f h k l]';<br>
      ignore sub o' [b d f h k l]';<br>
          ignore sub @originales' [i j t l]' @originales' @originales' ;<br>
      ignore sub r f;<br>
      sub [f.mid ff.mid] i' by dotlessi.alt;<br>
      sub i' t.mid by dotlessi.alt;<br>
      sub r' [g j y p q y z] by r.midcor;<br>
      sub [g j y p q y z] r' by r.midcor;<br>
      sub space @originales @NOmid' @originales space by @mid ;<br>
      } tres ;<br>
      lookup casos {<br>
        ignore sub [c ccedilla]' [b d f h k l]';<br>
      ignore sub o' [b d f h k l]';<br>
          ignore sub @originales' [i j t l]' @originales' @originales' ;<br>
      ignore sub r f;<br>
      sub [f.mid ff.mid] i' by dotlessi.alt;<br>
      sub i' t.mid by dotlessi.alt;<br>
      sub r' [g j y p q y z] by r.midcor;<br>
      sub [g j y p q y z] r' by r.midcor;<br>
      sub space @NOmid [i j t l] @NOmid' space by @mid ;<br>
      sub space @NOmid' [i j t l] @NOmid space by @mid ;<br>
    } casos ;<br>
      lookup oritoree {<br>
      sub @originales by @reemplazan;<br>
      } oritoree;<br>
    } calt;</p>
    <p>Thanks in advance,<br>
    Eduardo</p>
