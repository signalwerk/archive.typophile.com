      <p>If you want a font with the tone of the lettering in Fitzgeralds, I can now recommend Suzee FY <a href="http://www.myfonts.com/fonts/fontyou/suzee-fy/" title="http://www.myfonts.com/fonts/fontyou/suzee-fy/">http://www.myfonts.com/fonts/fontyou/suzee-fy/</a> as being closer than any of the other suggestions. The _z_ and _g_ are quite different but the casual reader should accept Suzee FY as a continuation of the Fitzgeralds logo lettering.<br>
      Don</p>
