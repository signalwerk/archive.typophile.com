    html: <p>Can't identify it. Would like to know as well. Pretty convinced too it's a custom job based on some (recent) commercial brush script. The closest I have for the moment is <a class="freelinking external" href="http://www.myfonts.com/fonts/nikola-giacintova/rukola" rel="nofollow">Rukola</a> using some stylistic alternates (/<a class="freelinking external" href="http://www.myfonts.com/fonts/nikola-giacintova/rukola/regular/glyphs.html#glyphs/623986/577" rel="nofollow">F</a>, /<a class="freelinking external" href="http://www.myfonts.com/fonts/nikola-giacintova/rukola/regular/glyphs.html#glyphs/623986/660" rel="nofollow">r</a>, /<a class="freelinking external" href="http://www.myfonts.com/fonts/nikola-giacintova/rukola/regular/glyphs.html#glyphs/623986/614" rel="nofollow">d</a>). <a class="freelinking external" href="http://www.myfonts.com/fonts/mika-melvas/signalist" rel="nofollow">Signalist</a> is nice too. Still searching...</p>
