    date: 2004-04-09T09:04:00
    date_raw: 9 Apr 2004 — 9:04am
    votes: null
    html: <p>Mark, <br> <br>I invented an Embedded Electronic Device license for just this purpose. <br> <br>I have been regularly contacted by companies who want to make slot machine interfaces with my fonts (aka gaming devices) so I came up with a seperate license for this purpose. <br> <br>The main clause in this license states the font used must be protected and NOT be reverse engineerable or extractable from the electronic device. <br> <br>I define an electronic device as as a kiosk, gaming device, portable electronic device, etc. with no other restrictions beyond the normal scope of licensing. <br> <br>In some cases you can base the license fee on number of estimated or real SKUs being distributed with your font(s) on 'em. You can make this an annual license. <br> <br>In most cases they prefer not to disclose these numbers so you'll most likely need to do a one time buyout license of the font for this use for ONE title. (eg. Can use for Pac Man but not Ms. Pac Man) <br> <br>Stuart :D</p>
    html_clean: <p>Mark, <br> <br>I invented an Embedded Electronic Device license for just this purpose. <br> <br>I have been regularly contacted by companies who want to make slot machine interfaces with my fonts (aka gaming devices) so I came up with a seperate license for this purpose. <br> <br>The main clause in this license states the font used must be protected and NOT be reverse engineerable or extractable from the electronic device. <br> <br>I define an electronic device as as a kiosk, gaming device, portable electronic device, etc. with no other restrictions beyond the normal scope of licensing. <br> <br>In some cases you can base the license fee on number of estimated or real SKUs being distributed with your font(s) on 'em. You can make this an annual license. <br> <br>In most cases they prefer not to disclose these numbers so you'll most likely need to do a one time buyout license of the font for this use for ONE title. (eg. Can use for Pac Man but not Ms. Pac Man) <br> <br>Stuart :D</p>
  - id: 31233
    user: 1049
    date: 2004-04-09T10:59:00
    date_raw: 9 Apr 2004 — 10:59am
    votes: null
    html: <p>Hi, <br> <br>We're doing a workshop on the subject of type designers working with software companies at TypeCon this year. Jim Wasco from AMT and I will be leading it, and we're certainly going to be touching on this issue.  <br> <br>Security is certainly the key here, you should expect to be paid more if your font is a system-wide resource as opposed to it being locked into the application. <br> <br>However securing the font is not completely straight forward. You want to ask the customer if the font is going to be supplied as a TrueType or in some derivative format - having it in a non-standard format would make it much harder to re-use. If it's going to be a TTF even if the font is privately installed it is still theoretically possible for it to be snagged. On Win 9x a privately installed font has to exist on the hard-disk somewhere as a file. In more recent versions of Windows it can exist in memory. All of this protection is a bit of a waste if the font itself can be easily extracted from the installation package prior to install.  <br> <br>I would get details of the protection written into the contract, and have some clause that would pay-out if the fonts were found to be extractable. That way the customer is putting some money behind their assurances.  <br> <br>It's important not to get into side-tracked by embedding permissions - the OpenType and earlier TrueType specification make it completely clear that these relate to 'document' embedding. If someone tries to tell you they can embed your font into their application based on the embedding bits set in your retail fonts point them at the specs, and send them to me.  <br> <br>Hope this helps. <br> <br>Cheers, Si <br></p>
    html_clean: <p>Hi, <br> <br>We're doing a workshop on the subject of type designers working with software companies at TypeCon this year. Jim Wasco from AMT and I will be leading it, and we're certainly going to be touching on this issue.  <br> <br>Security is certainly the key here, you should expect to be paid more if your font is a system-wide resource as opposed to it being locked into the application. <br> <br>However securing the font is not completely straight forward. You want to ask the customer if the font is going to be supplied as a TrueType or in some derivative format - having it in a non-standard format would make it much harder to re-use. If it's going to be a TTF even if the font is privately installed it is still theoretically possible for it to be snagged. On Win 9x a privately installed font has to exist on the hard-disk somewhere as a file. In more recent versions of Windows it can exist in memory. All of this protection is a bit of a waste if the font itself can be easily extracted from the installation package prior to install.  <br> <br>I would get details of the protection written into the contract, and have some clause that would pay-out if the fonts were found to be extractable. That way the customer is putting some money behind their assurances.  <br> <br>It's important not to get into side-tracked by embedding permissions - the OpenType and earlier TrueType specification make it completely clear that these relate to 'document' embedding. If someone tries to tell you they can embed your font into their application based on the embedding bits set in your retail fonts point them at the specs, and send them to me.  <br> <br>Hope this helps. <br> <br>Cheers, Si <br></p>
  - id: 31234
    user: 1043
    date: 2004-04-09T12:08:00
    date_raw: 9 Apr 2004 — 12:08pm
    votes: null
    html: <p>Thanks everyone for the suggestions. I've made a special arrangement with the developer to include specific wording in his license for the application which explains that the font(s) may only used with the application and where to obtain a license for other use. The font(s) themselves will also include similar information. As he explains it, it's really impossible to protect a font absolutely from being extracted, but it's also not obvious or trivial to do so. The audience for the application is rather small, so I'm not too worried about it.</p>
