  html: <p>I've received an inquiry from a small developer who wants to embed one of my commercial fonts in an application he's developing. He says that the font won't be accessible for printing or use outside the application--it would just be used for interface elements. If anyone has dealt with this kind of thing before, I would love to get some advice. My standard license doesn't cover this kind of thing (yet).</p>
  html_clean: <p>I've received an inquiry from a small developer who wants to embed one of my commercial fonts in an application he's developing. He says that the font won't be accessible for printing or use outside the application--it would just be used for interface elements. If anyone has dealt with this kind of thing before, I would love to get some advice. My standard license doesn't cover this kind of thing (yet).</p>
