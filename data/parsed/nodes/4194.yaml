    html: <p>In this case, it's not a multimedia kind of thing, so I don't think the House EULA is relavent. The size the fonts would be used would be smallish--12 to 18 pixels roughly.  <br> <br>I have also found out that it would be possible (though probably not easy) to extract the font(s) from the application. Or, at least not possible to prevent extraction entirely (similar to the situation with PDF).</p>
