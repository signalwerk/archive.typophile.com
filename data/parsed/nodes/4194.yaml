    html: |-
      <p>Right. I guess once you've "rasterized" the typeface it is no longer ... really ... a font software. <br> <br>Emigre is pretty clear on how they feel about embedding for multi-media too. <br> <br><br>
      </p><blockquote>
      <hr size="0"><!---quote-!--><b>quote:</b>
      <p>Can I embed fonts into digital documents? <br>Web sites and CD-ROM titles may feature bitmap images made using our fonts, but the fonts themselves may not be distributed. Embeddable font formats require the duplication of the fonts and thus seriously compromise the security of typefaces. The Emigre license excludes font embedding, except as described in the Embedding License Addendum. This addendum allows restricted distribution of portable digital documents in Adobe Acrobat PDF format under specific circumstances. <br> <br>Distributing copies of a printed document is not the same as distributing copies of a digital document with embedded fonts. The latter also distributes live fonts, which add value to the digital document by making it more useful, flexible, and cheaper to distribute than a traditional printed document. <br> <br>Unfortunately, currently available embedding technologies, which incorporate live fonts into web pages and digital documents, do so by jeopardizing the security of the fonts. This is largely due to the fact that developers of these technologies have little or no vested interest in protecting the intellectual property of independent font developers. Before allowing such usage of their fonts, font developers want to be certain that encryption of the embedded fonts is secure enough to prevent unauthorized access or use. <br> <br>We can only hope that this situation will improve in the future. If not, independent font developers, who depend on the sales from their fonts, will find it increasingly difficult to invest in the development of new designs.<!---/quote-!--><br>
      </p><hr size="0"><!--!-/quote-!--><p></p><!--!-quote-!--></blockquote>
      <p></p><p> <br></p>
