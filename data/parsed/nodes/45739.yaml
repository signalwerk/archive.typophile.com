    <p>Hello all,</p>
    <p>I've noticed lately some great applications of Futura-like type:</p>
    <p>President's choice packaging (it is replacing the over-used Trajan they previously had on their labels): <a href="http://www.presidentschoice.ca/" title="http://www.presidentschoice.ca/">http://www.presidentschoice.ca/</a></p>
    <p>Sci-fi channel website: <a href="http://www.scifi.com/onair/index.php?id=0" title="http://www.scifi.com/onair/index.php?id=0">http://www.scifi.com/onair/index.php?id=0</a></p>
    <p>I was wondering what fonts are similar to this and have a similar feel.  So far I've discovered:</p>
    <p>-Futura<br>
    -Century Gothic</p>
    <p>what else is like those?</p>
