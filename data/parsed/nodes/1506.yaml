  html: <p>Hi,  <br> <br>I am new to this board.. well posting wise.. (my first post!) but i've been reading it alot over the past few months.  <br> <br>anyways,  <br> <br> <br> <br>currently im taking typography 1 at my college. its alot of fun, our current project is to design a 27th letter of the alphabet using a provided face. of all faces I was given times new roman! haha! anyways, I wanted to see what people thought about this, or any suggestions. I am still learning about type, and i figured this place could help me out. we have to render these in ink at 2.5 x height, 5 times, replacing the created character with a letter in a 5 letter word.  <br> <br>my current concerns pertain to the descender on my letter. should it be the same distance down as the 'j' ? or should it be smaller? personal preference? i was looking at the face, and i guess i could argue that it was meant to be a unique form in the alphabet like the loop on the 'g' my professor brought this up in critique tonight.  <br><img src="http://www.typophile.com/forums/messages/29/17783.gif" alt="Kerned example"> <br> <br>Thanks!</p>
