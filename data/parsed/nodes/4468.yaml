  html: <p>Hello to all members. <br>My first post here. Discovered this forum just a week ago and I'm already hooked to it. <br> <br>I've been asked to design a magazine for a local newspaper. The content of this special issue will be about companies that have succeeded in business through the added value of design in their products. (Mainly industrial design, but also graphic, packaging, etc) <br>My intention is to show also that the use of good typography can improve a lot the readability and the user experience. <br>I need a good combination of fonts for body text and headlines. Till now I've been using Rotis Semiserif for headlines and Univers Condensed for body text (I know is a bit weird but they give me always a LOT of text to fit in every page, and is the only way to deal with that) <br>I don't want to do like other "design" magazines that put unreadable microtext in futuristic fonts. I want to use some modern looking fonts but they must be readable... and affordable for a small studio too :-)  so please don't say the one that I'd love to try but I cannot afford. <br>If I find a nice combination that reflects this, it's even possible that we can write an article explaining that to illustrate the whole process. <br> <br>Thanks in advance for your kind answers, <br>Vicente</p>
  html_clean: <p>Hello to all members. <br>My first post here. Discovered this forum just a week ago and I'm already hooked to it. <br> <br>I've been asked to design a magazine for a local newspaper. The content of this special issue will be about companies that have succeeded in business through the added value of design in their products. (Mainly industrial design, but also graphic, packaging, etc) <br>My intention is to show also that the use of good typography can improve a lot the readability and the user experience. <br>I need a good combination of fonts for body text and headlines. Till now I've been using Rotis Semiserif for headlines and Univers Condensed for body text (I know is a bit weird but they give me always a LOT of text to fit in every page, and is the only way to deal with that) <br>I don't want to do like other "design" magazines that put unreadable microtext in futuristic fonts. I want to use some modern looking fonts but they must be readable... and affordable for a small studio too :-)  so please don't say the one that I'd love to try but I cannot afford. <br>If I find a nice combination that reflects this, it's even possible that we can write an article explaining that to illustrate the whole process. <br> <br>Thanks in advance for your kind answers, <br>Vicente</p>
