    html: <p>Nice icon. <br> <br>It's great that you're concerned a lot with readability, but remember that this special issue is specifically about Design - so I think your display font at least should be "self-conscious" in this respect. The trick will be finding a text font that has "attitude" but remains very readable. <br> <br>I'm partial to wedge-serif fonts, and the other day I saw a magazine cover using Alias's Key really well. For a text companion to that you could choose a bunch of things, like Swift or FF Olson. Whitman might be nice too although I think it's a bit too "soft-spoken" for this, I think. <br> <br>BTW, narrowness isn't always more economical, because a wider font can be set smaller while looking the same size as a larger narrow font. It depends a lot on your column width and frequency of linebreaks. <br> <br>hhp <br></p>
