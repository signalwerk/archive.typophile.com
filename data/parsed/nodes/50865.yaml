      <p>Start with libraries; New York is full of them. IIRC correctly the ATF collection ended up in the Columbia U. library and I’m sure that there’s plenty more in the holdings of the three big design schools. If you’re looking for a specific hard-to-find book email H&amp;FJ to see if they have a copy in their library that you can look at.</p>
      <p>As for purchasing, your best bet is to just search Amazon, Abebook, Alibris, and Ebay. You might have to do some Google searches to track down the correct names first. Finding specimens in stores isn’t easy; the last time I was trying to find them in New York the best lead I got was a phone number for an appointment-only antiquarian vendor.</p>
