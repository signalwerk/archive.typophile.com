    <p>I’m desperately looking for type spec books that typesetters used pre digital typesetting. I’m located in NYC and wondered if anyone was aware of any resources like any still existant typesetters, bookstores and or graphics designers willing to part with theirs.</p>
    <p>Thanks in advance.</p>
