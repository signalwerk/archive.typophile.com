      <p>I’ve been on a mac for about 6 months. I was raised in dos and windows. Here are some things I’ve done to help me adjust:</p>
      <p>In the system preferences &gt; appearance change the scroll arrows to appear at both ends of a scroll bar.</p>
      <p>I’m always accidently clicking too far to the left or right of a window and losing focus of the application. In photoshop, always hit F to go to full screen mode. Also, try to minimize the windows you’re not using. </p>
      <p>Control = Alt. It hurts at first, like learning a new guitar chord. I still get cramps in my left thumb from reaching it all the way under my palm to press that weird open-apple key. </p>
      <p>Font Explorer X has helped a lot with font management. Definately use it. </p>
      <p>I still don’t understand the mac file structure. I keep all my work on the desktop in job folders. The finder window is pretty neat though. I primarily use the column view, it’s the fastest and easiest. Kind of like the old 2 column windows explorer but a but more clumsy. </p>
      <p>Now I just wish I could figure out how to get rid of these stupid jelly buttons, rounded corners, and brushed aluminum.</p>
