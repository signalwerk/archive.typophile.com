      <p>I’ve been using Apple for about two years now. The most terrifying thing about Mac OS X is that when you copy a folder over an existing one, OS X completely replaces the destination folder (removing the old contents) rather than merging the contents, which is what Windows does. I still use my PC to access my Mac hard drive and do file management there (batch renaming, synchronizing various folders, moving stuff around), since it’s much faster than using the Finder. </p>
      <p>Also, there is one thing that I still haven’t figured out: with one Finder window open in a particular folder, how do I easily open a second Finder window in the same folder/path? (So I can go to a subfolder from there and conveniently — as much as it’s possible in Finder — copy/move stuff around)? </p>
      <p>A.</p>
