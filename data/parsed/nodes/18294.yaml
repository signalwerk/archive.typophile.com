      <p><em>If you double-click a folder icon while holding the command key (the apple key), it will open that folder in a new window while keeping the old one open. </em></p>
      <p>Hey, I didn’t know that. Now that I do, here is one way to do the shortcut Adam is looking for:</p>
      <p>With a Finder window open, double-click a folder in it while holding the command key. A new window (the folder) will open. Hold down the command key and click on the title of the new window. A pop-up menu showing the folder path will appear. Choose the enclosing folder (or volume). You now have two windows to the same file path. The only case when this wouldn’t work is when there are no folders in the window view you want to duplicate. There is probably a way to do this with AppleScript in a way that works regardless.</p>
      <p>FYI, before OS X, it was not possible to have two windows showing the same path. This is a Next carry-over that confused long-time Mac users at first.</p>
      <p>Control-click is the same as a right-click—handy if your mouse only has one button.</p>
