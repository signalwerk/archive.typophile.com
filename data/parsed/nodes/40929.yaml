    <p>Dear Typophiles,</p>
    <p>How do I choose (or calculate) the font size i use in a publication, and all the bigger and smaller sizes that will be used in it? and how to calculate the baseline grid (70% of font size space between the lines is that right?)</p>
    <p>i understand the page size, how many columns and all elements connect to each other in this calculation, how do i start? are there any equations available on the internet that i could use?</p>
    <p>this is in the process of redesigning a magazine, which already have the page size and the font type (but even font will be changed later) or should the font be changed first and then start calculating the sizes?</p>
    <p>thanks alot,</p>
    <p>b.</p>
