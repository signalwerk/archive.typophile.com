      <p>Hey b, I'm from the school that chooses the text font and size first. This is usually between 8.5 and 11 or so points, depending on how the typeface relates to the em (not a big deal), the overall density of the text face you choose, and the age and/or reading abilities of the perceived audience and your column width. The last three are the bigger issues. There are a lot of other ways, but usually a mag in redesign know what the logo and the text look like as they fill in between. </p>
      <p>Cheers!</p>
