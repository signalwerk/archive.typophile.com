      <p>Printing out a series of samples placed in columns works well. I would also do some research looking at different magazines and find ones that have a size that you like. Bring a ruler measure in mm for a more exact measurement or a pica ruler and then convert to points. you can download a demo application called the Art Directors Toolkit it is an amazing time saver, it also does grid calculations and more. check it out here: <a href="http://www.code-line.com/software/artdirectorstoolkit.html" title="http://www.code-line.com/software/artdirectorstoolkit.html">http://www.code-line.com/software/artdirectorstoolkit.html</a><br>
      I would not go any smaller than 7.5pt sans serif face or 8pt serif, it is all about legibility and aesthetics in the end.</p>
