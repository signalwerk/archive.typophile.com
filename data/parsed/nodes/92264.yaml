  html: |-
    <p>I have an idea of the font's I want to use but are wondering if there are any other options out there that may be better.   The font I like for this particular project is Kristen ITC (<a href="http://www.azfonts.net/load_font/itckris0.html" title="http://www.azfonts.net/load_font/itckris0.html">http://www.azfonts.net/load_font/itckris0.html</a>).  However for the "k" character I specifically need it to have a flat hump and then branch upwards.  The only font I found that is like this is Planet Estyle (<a href="http://www.dafont.com/planet-estyle.font" title="http://www.dafont.com/planet-estyle.font">http://www.dafont.com/planet-estyle.font</a>)</p>
    <p>Other than just taking the "k" from the one font and joining it to the other, does anybody know of any other fonts that could potentially work for this?  This is my first post here so I'm not sure what other information is needed - just let me know.</p>
    <p>Thanks in advance!</p>
