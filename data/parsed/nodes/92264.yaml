      <p>It’s pretty difficult that an handwriting font like Kristen will have a similar construction. And unfortunately, if you need the lowercase k, Nick’s clever suggestion wouldn’t work (Cyrillic к lacks an ascender).<br>
      If using a different style of font isn’t a problem, there are more possibilities. What’s the project about?</p>
