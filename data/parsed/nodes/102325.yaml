      <p>Thanks for the comments fellas.</p>
      <p>Sorry Nick, I don't have many examples to hand on file from past work, and I don't have the versions I used on other machines of course. But I do remember giving a good study at the time. I noticed slightly different x heights and different variations for the same corresponding weights. Because of the weight issue, some worked better a smaller sizes and others as large/display. As Frode mentioned, there were other factors, like language support, which wouldn't affect me as everything I've done is in English (well, once in German). </p>
      <p>So I guess what I wondered is maybe someone had already looked into the specifics of the different versions. I like the Linotype cut, but I really like the sound of Schwarz's Neue Hass Grotesk so hopefully one day I'll either get that or have an opportunity to use it. But what I really need to look into is the main differences between Linotype and Adobe versions. I know I should have before raising this thread!</p>
      <p>I didn't know about Unica, but made for interesting googling thanks. Sounds a little bit like the efforts made with aforementioned Neue Haas Grotesk remake? </p>
      <p>But in being the mighty, ubiquitous typeface that it is (I wrote a chapter in my university dissertation looking at the topic of globalisation and helvetica, or rather the global usage of it) it seems odd that it isn't easy to settle on a "definitive" version of it, at least out of the popularly available versions (as I imagine there is a theoretical debate about what constitutes a "definitive" version of it).</p>
