      <p>Issue 83 of <em>Eye</em> magazine is a must for Helvetica obsessives.</p>
      <p>Art director Simon Esterson sets the entire editorial matter of the magazine in a different typeface each issue, and for #83 it’s Neue Haas Grotesk.</p>
      <p>What makes it really interesting—apart from seeing such a typographic <em>tour de force</em> with Helvetica on many different kinds of paper stocks—is the feature on Massimo Vignelli, which reproduces some of his work with Helvetica in complete-page reproductions.</p>
      <p><a href="http://www.eyemagazine.com/feature/article/reputations-massimo-vignelli" title="http://www.eyemagazine.com/feature/article/reputations-massimo-vignelli">http://www.eyemagazine.com/feature/article/reputations-massimo-vignelli</a></p>
      <p>If only all the type foundry ads had been for their classic grotesque typefaces…</p>
