      <p>I just bumped into <a class="freelinking external" href="http://www.aisleone.net/tags/sans-serif/" rel="nofollow">a page</a> mentioning Post Grotesk and Runda, both of which looked like alternatives to Helvetica to me.</p>
      <p>Since Haas Unica originally came out for phototypesetters in 1977, I would have thought that the design was no longer protected even in Europe, just as Optima and Palatino are able to be copied. So I am surprised there are not imitations of it all over the place, given that it is felt to be Helvetica "done right".</p>
      <p>The typeface <a href="/wiki/https%3A/%252Fwww.behance.net/gallery/Heltar-Typeface/2634625" class="freelinking" rel="nofollow">Heltar</a> was referred to in one place as a Haas Unica redraw, but I don't know how accurate that is.</p>
