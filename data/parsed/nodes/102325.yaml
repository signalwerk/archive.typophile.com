    <p>Hello all,</p>
    <p>I've had a check through previous posts but not found this exact topic, please redirect me if there is.</p>
    <p>So what is your chosen version of Helvetica? Or should I say Helvetica Neue (as most people will be using as opposed to the original digit 'cut').</p>
    <p>From working at various design agencies, studios, other people's computers etc I have probably used every version of Helvetica going. There are many, plus now we also have Christian Schwarz's digitized Neue Haas Grotesk to content with. But is it possible to advise and settle the issue? Is one foundry's version objectively the best?</p>
    <p>Please discuss!</p>
    <p>Thanks,</p>
    <p>Lewis</p>
