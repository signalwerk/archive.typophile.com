    html: |-
      <blockquote><p>Or should I say Helvetica Neue</p></blockquote>
      <p>No, I think you shouldn’t. ‘Neue Helvetica’ is the right name. The decision to put ‘Neue’ behind Helvetica is a font menue sorting issue. Unfortunately, fonts do not have such a thing as a ‘sorting name’ by which both Adobe Garamond and ITC Garamond would be automatically sorting under G. And Helvetica and Neue Helvetica under H. Another thing is that PostScript fonts did not allow numbers in the font names. So Frutigers number system, which Stempel (they took care of the Linotype library those days) had adopted for naming the weights of many other new /re-designed families such as Janson Text, could not be used in the font menues. The Mac 4-style family strategy was ‘chosen’ instead. Shit happens.</p>
    html_clean: |-
