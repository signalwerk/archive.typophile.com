      <p>These factories stop doing interesting work at least when they grow over a critical size. Typically over five employees I would say. The whole system of getting new large business to keep the employees busy kills any form of design. It turns into lowest common denominator: charts, charts, and more charts, a dull new logo, an unexciting new colour palette, a generic corporate stock-photo library and so on.</p>
      <p>These big corporate entities do not have the guts to rise out of mediocrity, and the design factories are certainly not going to rock the boat they are in. It’s design by committee, so bland it disappears in background radiation.</p>
      <p>In my list the usual suspects at the ’top’ are the really the bottom. I don’t even think they should be allowed to be called design agencies.</p>
