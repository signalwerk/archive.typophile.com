      <p>I did not expect this to become as heated as it actually did;-) </p>
      <p>Having said that I have to agree with much of what both New guy and Hildebrant says. I don’t think it is impossible to combine great work with making a buck while sticking to a budget and a time constraint. I’m not saying it is easy but deffinetly possible.</p>
      <p>A lot of designers today come up with great ideas even in a corporate setting however many ideas gets discarded by the client due to poor knowledge, from the team, of the clients standing. If we all got better at wearing the clients shoes, understood their challenges and used this as a basis for the design it wouldn’t be as hard a sell. Form should always follow function. We as designers have a lot to learn from the industrial design scene.</p>
      <p>So what is good design? In my world something that is solved under a time constraint, within a budget with the user in focus, addressing the correct social group and is visually stunning within this market section (and allows me and my familly to eat at night). It doesn’t mean I don’t love what I do!</p>
      <p>To answer Hildebrant’s first question “What qualifies as top? Best Work? Highest Revenue?” I would say the combination of these 2 pluss trying to make a difference;-) </p>
      <p>Some of my favourites;<br>
      <a href="http://frostdesign.com.au" title="http://frostdesign.com.au">http://frostdesign.com.au</a><br>
      <a href="http://pentagram.com" title="http://pentagram.com">http://pentagram.com</a><br>
      <a href="http://spiekermannpartners.com" title="http://spiekermannpartners.com">http://spiekermannpartners.com</a></p>
      <p>Then again most of my favs are crossovers or within the industrial design field: Ideo is one example.</p>
