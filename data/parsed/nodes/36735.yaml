      <p>Mr. Berentzen was quite clear in posing his question that he was, “just curious.” It seems very odd that this ridiculous question would draw forth such negative blanket statements from Clauses and Gary Long.</p>
      <p>Now, the question itself is ridiculous, and was obviously just lobbed out there to spark some conversation. You may as well ask who the best classical violinist is, or the best chef. At a certain level, any rankings will be subjective. (Yes, Joshua Bell is a better classical violinist than my niece Joanie, but is he better than Gidon Kremer? Depends who you like better.)</p>
      <p>And Mr. Sørensen’s statement that any design firm larger than 5 people doesn’t do interesting work is patently ridiculous. His further statements just increase the idiocy of his original statement. Mr. Long chimes in with stupid statement about big design firms not “making a difference,” what ever that is supposed to mean.</p>
      <p>Is it the duty of design firms to serve their clients? Yes, of course. Is it their duty to do so in a way that brings interesting conceptual and formal solutions into the world? No, but it’s probably what most designers are striving to do, wherever they work, and whatever their level of talent. Is it the duty of design firms to “make a difference”? If they want to do that, they should open soup kitchens.</p>
      <p>There are PLENTY of corporate design agencies making good work AND doing good works. And there are plenty filled with money-grubbing hacks. Like any profession, there are those who are in it for the love of the pursuit, and those who just want to get paid. If you are hoping to make a big pile of cash in graphic design, then corporate identity is probably the way to go.</p>
      <p>Here are questions for Mr Sørensen and Mr Long: Have you risen out of mediocrity? Are you making a difference?</p>
      <p>Mr. Sørensen, you are a student - or maybe a recent graduate - so your idealism is the arrogance and ignorance of youth. What work have you done in the profession which raises you out of mediocrity?</p>
      <p>Mr. Long, according to your Typophile profile, you work at a vanity publisher: <a href="http://www.foxmeadowbooks.com/production.html" title="http://www.foxmeadowbooks.com/production.html">http://www.foxmeadowbooks.com/production.html</a> I’m sorry to say that this activity doesn’t seem to be terribly difference-making.</p>
      <p>JN</p>
