      <p>Mr. Muñoz Huerta, you are making the same mistake as Mr. Sørensen and Mr. Long, except in reverse, when you state that, “you can hardly be relevant in a global context with five people in your firm.”</p>
      <p>Stefan Sagmeister is one example of a designer with a very small office making “globally relevant” work. Paul Rand was another. (As an aside, many of type’s great innovators worked alone, or with one or two assistants, including Eric Gill, Frederic Goudy, and W.A. Dwiggins.)</p>
      <p>The only rule is that there are no rules. A single person or a team of 100 can make something extraordinary. A single person or a team of 100 can make something terrible.</p>
      <p>JN</p>
