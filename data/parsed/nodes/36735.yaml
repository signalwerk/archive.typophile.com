      <p>I think we should really think twice before making these type of silly blanket statements. There are a lot of firms out there “doing great work”, “making a difference” and “making a living” at the same time.</p>
      <p>If your boss came to you next week and said: “Well, we are going to change the direction of this firm. We are now doing only pro bono work. We want to start ’really making a difference’. What that means is that you won’t be getting a check anymore because we simply can’t afford to pay you”.</p>
      <p>If you desire to be involved in strictly non-profit work, then start a non-profit company. But don’t chastise the rest of us you are trying to make a living and support our families while doing what we love—and hopefully whenever possible, “making a difference”.</p>
      <p>The notion that you (or big firms) can’t produce good work while making a profit is just preposterous.  </p>
      <p>Enough on that, back to the original subject.</p>
      <p>Pentagram, Duffy &amp; Partners, FITCH and Sandstrom Design are just a few that pop into mind.</p>
