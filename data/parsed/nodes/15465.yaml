    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Kenn Munk</strong></p>
    <p>Kenn Munk is a Danish one-man foundry making alternative fonts and dingbats. They can be hard to use, the important thing is to never stop messing about with them.<br>
    Kenn’s designs are usually based on an underlying system that allows the user to ‘build’ words, or in the case of dingbats — images. This obsession is due to the hours and hours spent playing with LEGO bricks and model kits in his childhood.<br>
    Kenn Munk is also the designer of  "Antlor - The Deer Departed": <a href="http://www.antlor.net" title="http://www.antlor.net">http://www.antlor.net</a></p>
    <p>website: <a href="http://www.kennmunk.com" title="http://www.kennmunk.com">http://www.kennmunk.com</a><br>
    portfolio: <a href="http://folio.kennmunk.com" title="http://folio.kennmunk.com">http://folio.kennmunk.com</a></p>
