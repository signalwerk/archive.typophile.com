  - id: 591104
    user: 103753
    date: 2014-10-21T11:51:00
    date_raw: 21 Oct 2014 — 11:51am
    votes: null
    html: |-
      <p>Have you checked the sidebearings you want to be active for the kerning class? Have you remembered to click the "Accept" button after making any changes or additions to a class? It might be helpful if you posted a shot of your classes panel, showing the _a class.</p>
      <p>To your second question, click the third-last icon at the top of the Metric window ("Expand the window") it will reveal a table the sidebearings and kerning info for each glyph in whatever text you have active in the window. You can select the figures in the table to change them.</p>
      <p>To change sidebearings and advance widths you need to set up metrics classes separate from the kerning classes.</p>
      <p>The FontLab manual can be daunting but it is your friend, you just need to dig into it. Check the sections on Class-based Kerning and Metrics Assistance.</p>
