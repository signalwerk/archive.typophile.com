    <div class="node-spam-content"><p>I'm working with classes in my font to kern the font faster and more efficiently, but for some reason some classes aren't working. For example, I have to kern all my /a/s manually rather than kerning all /a/s at once. The /e/s are grouped though. I have the feeling things particularly go wrong when I have the base letter kerned before I apply the classes. What am I doing wrong?</p>
    </div>
