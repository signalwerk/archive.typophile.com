    date_raw: 23 Oct 2014 — 8:21am
    votes: null
    html: <p>You may have inadvertently created a kerning exception for the aacute. You can get a list of all kerning pairs by choosing "Table" from the "Options" pop-up menu at the bottom of the Metrics window. It displays a list of kerning pairs in a spreadsheet-like table on the right side of the Metrics window. You can select and delete kerning pairs from that table.</p>
