    <p>I was wondering if anyone might be able to take a crack at identifying this font. I'm interested in using it for a tattoo. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/0623092046_6191.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/0624091446_4403.jpg"></div><p></p>
    <p>I'm also open to similar styles if what you have in mind looks kind of like the above images but isn't quite right. I'm kind of partial to Indelible Victorian Regular (<a href="http://www.fonts.com/FindFonts/detail.htm?productid=275783" title="http://www.fonts.com/FindFonts/detail.htm?productid=275783">http://www.fonts.com/FindFonts/detail.htm?productid=275783</a>) as well, if it weren't quite so hard to read! </p>
    <p>Thanks for any help! I've been scouring the internet trying to figure this out but I'm pretty new to typography.</p>
