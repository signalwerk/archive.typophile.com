    votes: null
    html: |-
      <p>Nice work Akira. In Jaspert it says that 'Gracia' (Amsterdam) is one of the names it was sold under; also 'Donatello' (Niebolo) and 'Hertha' (Berling). The original design goes back to 1926 to Wagner &amp; Schmidt, then cast by many foundries in 1927. Troubador Open was a Haas design by E. Thiele from 1931, if I read this right.</p>
      <p>- Mike Yanega</p>
    html_clean: |-
