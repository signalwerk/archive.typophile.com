      <p>This is like some of the work done by Nick Curtis, but I checked his site for scripts and also looked at his old Freebie fonts. There were no exact matches, but I think you're right that this is from the Deco era. Nick's closest styles were <a href="http://www.myfonts.com/fonts/nicksfonts/pismo-clambake-nf/" rel="nofollow">Pismo Clambake</a> and <a href="http://www.myfonts.com/fonts/nicksfonts/jaunty-gent-nf/" rel="nofollow">Jaunty Gent</a>, which only show that the era is similar to his work here.</p>
      <p>Is Nick around? Do you recognize this script from one of your books?</p>
      <p>- Mike Yanega</p>
