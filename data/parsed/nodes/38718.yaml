      <p><a href="http://home.earthlink.net/~ziodavino/album1_009.htm" target="_blank" rel="nofollow">Rakowski</a> originally made his fonts as Mac shareware only. The original Rechtman, I believe, can be downloaded from the <a href="http://www.erik.co.uk/font/script.html" target="_blank" rel="nofollow">Mac Font Vault</a>.</p>
      <p>Also, <a href="http://www.faces.co.uk/fonts/fontview.cfm?productsku=IN100134" target="_blank" rel="nofollow">Faces.com</a> sells commercial versions of some of Rakowski's fonts. Presumably they are superior to the old shareware in technical quality or character set - but I don't know that for a fact.</p>
