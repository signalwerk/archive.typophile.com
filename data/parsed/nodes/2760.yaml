    date_raw: 19 Jan 2004 — 4:47pm
    votes: null
    html: "<p>Daniel, When I look around Schwab's site, the navigation font is a bold Sans, but not Neutraface. Futura, Metro and Kabel are similar to it, but they have splayed M's. Nobel  has flattened apex of N, but the M is better. Offhand I can't pick one font that matches both criteria: straight-sided M, pointed apex on N. Maybe he used Nobel with a Futura N?</p>"
    html_clean: "<p>Daniel, When I look around Schwab's site, the navigation font is a bold Sans, but not Neutraface. Futura, Metro and Kabel are similar to it, but they have splayed M's. Nobel  has flattened apex of N, but the M is better. Offhand I can't pick one font that matches both criteria: straight-sided M, pointed apex on N. Maybe he used Nobel with a Futura N?</p>"
  - id: 22002
    user: 618
    date: 2004-01-20T07:29:00
    date_raw: 20 Jan 2004 — 7:29am
    votes: null
    html: "<p>Hi Daniel, <br> <br>I suspect Schwwab's font is a custom one based on his lettering. This is conceivable given his illustrative superstardom. As you look through his posters and logos you find the same heavy deco sans lettering, but there are slight variations in weight and form which says to me that he is drawing his letters. To Mike's observations about the hallmarks of his lettering I would add: slightly rounded corners and a very dark A. These qualities are also found in the navigation font, though I suspect it's a digital version given it's regularity. <br> <br>I've always enjoyed Schwab's type. If you want to match it, for a logo, i'd suggest drawing :-) <br>Or if you haven't got time, then the alternatives mentioned plus Mark's <a href=\"http://www.ms-studio.com/FontSales/mostra.html\">Moestra</a> and <a href=\"http://www.ms-studio.com/FontSales/blakely.html\">Blakely</a></p>"
    html_clean: "<p>Hi Daniel, <br> <br>I suspect Schwwab's font is a custom one based on his lettering. This is conceivable given his illustrative superstardom. As you look through his posters and logos you find the same heavy deco sans lettering, but there are slight variations in weight and form which says to me that he is drawing his letters. To Mike's observations about the hallmarks of his lettering I would add: slightly rounded corners and a very dark A. These qualities are also found in the navigation font, though I suspect it's a digital version given it's regularity. <br> <br>I've always enjoyed Schwab's type. If you want to match it, for a logo, i'd suggest drawing :-) <br>Or if you haven't got time, then the alternatives mentioned plus Mark's <a href=\"http://www.ms-studio.com/FontSales/mostra.html\" class=\"link-external\">Moestra</a> and <a href=\"http://www.ms-studio.com/FontSales/blakely.html\" class=\"link-external\">Blakely</a></p>"
