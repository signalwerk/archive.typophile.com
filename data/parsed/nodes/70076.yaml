      <p>My lightest are <a href="http://www.shinntype.com/bodoni.html" rel="nofollow">Bodoni Egyptian Thin</a> and <a href="http://www.shinntype.com/beaufort.html" rel="nofollow">Beaufort Light</a>.</p>
      <p>Old school, it's <a href="http://www.fontshop.com/search/?q=light+classic+roman&amp;x=0&amp;y=0" rel="nofollow">Light Classic Roman</a></p>
      <p>I wrote about thin fonts nine years ago, <a href="http://www.shinntype.com/Writing/SeeLight.pdf" rel="nofollow">Seeing the Light</a>; since then, a great many more have been published. This is a golden age, but it's impossible to keep up with everything unless you're Stewf or crowdsourcing :-)</p>
