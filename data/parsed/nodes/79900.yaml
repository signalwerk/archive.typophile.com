      <p>I made a stripped down Trajan a few years ago called <a href="http://new.myfonts.com/fonts/typodermic/byington/" rel="nofollow">Byington</a>.</p>
      <p>Trajan has historical blah blah and there are many fine interpretations etc. For the general public, it might be more familiar as the official font of every movie poster ever. Byington was commissioned by Roxio for use in DVD titles, back when video interlace flicker was an issue, hence the chunkular, totally flat serifs. The proportions of most of the caps were drawn over photos of the column engravings. The lowercase, numerals are Sabon/Garamondesque; mostly modular with some relation to the caps.</p>
