    <p>I don't post here very often, but when I do, you know, I do. </p>
    <p>So. I had an idea that, so far, has proven popular among typographic types: Cleaning Trajan. </p>
    <p>The typeface is probably one of the oldest, dating back to the Roman Era (but not one of the oldest fonts),<br>
    the trouble I find with using Trajan at large sizes is that many of the glyphs appear uneven and raggedy through<br>
    a combination of it having been translated to computer before the modern day wizardry we have access to today<br>
    and the age of the typeface itself. Though I suspect that the guy who first carved this typeface was very, very<br>
    precise about it. </p>
    <p>So my intention is to re-do the outline and tidy it up a bit. I'm not sure if this has already been done, but it's<br>
    been fun to do so far.<br>
    I'm already receiving positive feedback and critique from some of the communities I inhabit and the two<br>
    attachments are pre-feedback, but it gives you a general idea.</p>
