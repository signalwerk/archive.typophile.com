    html: |-
      <p><em>The typeface is probably one of the oldest…</em></p>
      <p>It was designed in 1989.<br>
      You won't get very far by tweaking the Adobe outlines.<br>
      The Trajan typeface is only one interpretation of the Trajan’s Column lettering.<br>
      If you are serious about this, you should start from scratch by analyzing the original lettering, assimilating and synthesizing the letter shapes, and working out a system of serif treatment that is appropriate for a particular size, or at different sizes.<br>
      One of the reasons that Twombly's Trajan has been so successful is that its serifs <em>are</em> micro-detailed and small in proportion, making it suitable for display setting.</p>
      <p>You are misusing the term "modern"—in type it generally means either a Didone, or related to 20th century modernism, whereas what you are after is merely "clean".<br>
      Here's a clean Roman capital:<br>
      <a href="http://new.myfonts.com/fonts/berthold/senatus-bq/" title="http://new.myfonts.com/fonts/berthold/senatus-bq/">http://new.myfonts.com/fonts/berthold/senatus-bq/</a></p>
