    html: |-
      <p>As Nick said, there are many different interpretations of the letters on the Trajan Column out there, as well as letters inspired by roman inscribed lettering on buildings and monuments. They all focus on different aspects, some are more calligraphic, some more sculptural, some more clean whilst taking the basic shape of the letters. If you would be interested in doing a new interpretation of Trajan it would be better not to start from an existing interpretation. Rather have a look at the original letters. As these letters were chiseled into stone there is variation among the letters. Also you could have a look at the various interpretations already out there. Two the top of my head:</p>
      <p><a class="freelinking external" href="http://new.myfonts.com/fonts/castletype/goudy-trajan/" rel="nofollow">Goudy Trajan</a><br>
      <a class="freelinking external" href="http://new.myfonts.com/fonts/canadatype/jupiter-pro/" rel="nofollow">Jupiter</a></p>
      <p>And there are many that share its spirit but take more liberties with the original, echoing the original more in feel than in exact design.</p>
    html_clean: |-
