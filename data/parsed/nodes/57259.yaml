  html: |-
    <p>My girlfriend has been looking for an upscale restaurant job in Seattle for months now.  She has a great resume, but I finally realized we needed to do something to really make it pop.</p>
    <p>I'm not a designer, but I thought maybe we could pick a lovely display font for her name at the top of the page and make it big and bold so she has some distinctive branding.  Then, instead of an "Objective" we could just put some kind of snappy one-line tagline.</p>
    <p>For the display font, we both fell in love with Mousse Script Regular:<br>
    <a href="http://new.myfonts.com/fonts/sudtipos/mousse-script/regular/" title="http://new.myfonts.com/fonts/sudtipos/mousse-script/regular/">http://new.myfonts.com/fonts/sudtipos/mousse-script/regular/</a><br>
    in a dark navy.</p>
    <p>But... I'm having a hard time matching it to a good typeface for the rest of the document.  She likes Palatino with its serifs and kind of swoopy Q's, but it seems to look kind of old-fashioned next to the splashy header.  Is there some well balanced modern font (or a few suggestions) that might look good for the rest of her resume?</p>
    <p>Also, what about the "tagline"?  You think it should also be in Mousse Script, or the text font?</p>
    <p>After looking through hundreds of different typefaces my brain is starting to go numb.  A talented eye would be so appreciated.</p>
