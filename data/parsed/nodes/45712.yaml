    <p>Hey again,</p>
    <p>OK I will start with attaching my initial ideas for this little record company located in sweden. The first promo releases will be on 7” vinyl. It is electronic music with a soulfull twist .. want it to fell a bit vintage etc i think. A bit rockabill/ol blues stuff but with a modern finish cause it is still electronic music. So these will in the end be attached on vinyl-labels etc. Ok let me know what u guys think.</p>
    <p>Ciao!</p>
