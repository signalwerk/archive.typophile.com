    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Matthew Carter</strong></p>
    <p>Born: <a href="/wiki/United%20Kingdom" class="freelinking" rel="nofollow">United Kingdom</a>, 1937.</p>
    <p>Son of <a href="/wiki/Harry%20Carter" class="freelinking" rel="nofollow">Harry Carter</a>, Royal Designer for Industry, contemporary British type designer and ultimate craftsman, trained as a punchcutter at <a href="/wiki/Enschede" class="freelinking" rel="nofollow">Enschedé</a> by <a href="/wiki/Paul%20Raedisch" class="freelinking" rel="nofollow">Paul Rädisch</a>, responsible for Crosfield’s typographic program in the early 1960s, <a href="/wiki/Mergenthaler%20Linotype" class="freelinking" rel="nofollow">Mergenthaler Linotype</a>’s house designer 1965–1981.</p>
    <p>Carter is a prolific designer who has produced many successful and significant faces in his career such as <a href="/wiki/Olympian" class="freelinking" rel="nofollow">Olympian</a>, <a href="/wiki/Bell%20Centennial" class="freelinking" rel="nofollow">Bell Centennial</a>, <a href="/wiki/Galliard" class="freelinking" rel="nofollow">Galliard</a>, <a href="/wiki/Charter" class="freelinking" rel="nofollow">Charter</a> and <a href="/wiki/Miller" class="freelinking" rel="nofollow">Miller</a> (in chronological order).</p>
    <p>He has in recent years designed <a href="/wiki/Verdana" class="freelinking" rel="nofollow">Verdana</a>, <a href="/wiki/Tahoma" class="freelinking" rel="nofollow">Tahoma</a> and <a href="/wiki/Georgia" class="freelinking" rel="nofollow">Georgia</a> for <a href="/wiki/Microsoft" class="freelinking" rel="nofollow">Microsoft</a>; these fonts are tuned to be extremely legible even at very small sizes on the screen.</p>
    <p>Carter co-founded <a href="/wiki/Bitstream" class="freelinking" rel="nofollow">Bitstream</a> with Mike Parker in 1981. In 1991 he left Bitstream to form <a href="/wiki/carterandcone" class="freelinking" rel="nofollow">Carter &amp; Cone</a> with <a href="/wiki/Cherie%20Cone" class="freelinking" rel="nofollow">Cherie Cone</a>.</p>
    <p>Carter is a Royal Designer for Industry, a member of AGI, chairman of the type designers' committee of <a href="/wiki/ATypI" class="freelinking" rel="nofollow">ATypI</a>, and a Senior Critic on <a href="/wiki/Yale" class="freelinking" rel="nofollow">Yale</a>'s Graphic Design faculty. He has received the <a href="/wiki/Frederic%20W.%20Goudy" class="freelinking" rel="nofollow">Frederic W. Goudy</a> Award for outstanding contribution to the printing industry, the Middleton Award from the American Center for Design, a Chrysler Award for Innovation in Design, and medals from the <a href="/wiki/AIGA" class="freelinking" rel="nofollow">AIGA</a> and the <a href="/wiki/Type%20Directors%20Club" class="freelinking" rel="nofollow">Type Directors Club</a>. He holds the honorary degree of Doctor of Fine Arts.</p>
    <p><strong>Additional Articles:</strong><br>
    <a href="http://designmuseum.org/design/matthew-carter" rel="nofollow">British Council Design Museum: Matthew Carter</a></p>
