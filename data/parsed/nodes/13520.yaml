    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/17745" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Designers</a>&nbsp;: Matthew&nbsp;Carter</strong></p>
    <p>Born: <a href="/node/19577" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">United Kingdom</a>,&nbsp;1937.</p>
    <p>Son of <a href="/node/add/wiki?edit%5Btitle%5D=Harry%20Carter" title="Create node &quot;Harry Carter&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Harry Carter</a>, Royal Designer for Industry, contemporary British type designer and ultimate craftsman, trained as a punchcutter at <a href="/node/32260" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Enschedé</a> by <a href="/node/add/wiki?edit%5Btitle%5D=Paul%20Raedisch" title="Create node &quot;Paul Raedisch&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Paul Rädisch</a>, responsible for Crosfield’s typographic program in the early 1960s, <a href="/node/13676" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Mergenthaler Linotype</a>’s house designer&nbsp;1965–1981.</p>
    <p>Carter is a prolific designer who has produced many successful and significant faces in his career such as <a href="/node/add/wiki?edit%5Btitle%5D=Olympian" title="Create node &quot;Olympian&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Olympian</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Bell%20Centennial" title="Create node &quot;Bell Centennial&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Bell Centennial</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Galliard" title="Create node &quot;Galliard&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Galliard</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Charter" title="Create node &quot;Charter&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Charter</a> and <a href="/node/add/wiki?edit%5Btitle%5D=Miller" title="Create node &quot;Miller&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Miller</a> (in chronological&nbsp;order).</p>
    <p>He has in recent years designed <a href="/node/79472" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Verdana</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Tahoma" title="Create node &quot;Tahoma&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Tahoma</a> and <a href="/node/14719" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Georgia</a> for <a href="/node/20191" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Microsoft</a>; these fonts are tuned to be extremely legible even at very small sizes on the&nbsp;screen.</p>
    <p>Carter co-founded <a href="/node/13429" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Bitstream</a> with Mike Parker in 1981. In 1991 he left Bitstream to form <a href="/node/add/wiki?edit%5Btitle%5D=carterandcone" title="Create node &quot;carterandcone&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Carter <span class="amp">&amp;</span> Cone</a> with <a href="/node/add/wiki?edit%5Btitle%5D=Cherie%20Cone" title="Create node &quot;Cherie Cone&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Cherie Cone</a>.</p>
    <p>Carter is a Royal Designer for Industry, a member of <span class="caps">AGI</span>, chairman of the type designers’ committee of <a href="/node/13403" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal"><span class="caps">AT</span>ypI</a>, and a Senior Critic on <a href="/node/add/wiki?edit%5Btitle%5D=Yale" title="Create node &quot;Yale&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Yale</a>’s Graphic Design faculty. He has received the <a href="/node/19481" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Frederic W. Goudy</a> Award for outstanding contribution to the printing industry, the Middleton Award from the American Center for Design, a Chrysler Award for Innovation in Design, and medals from the <a href="/node/13814" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal"><span class="caps">AIGA</span></a> and the <a href="/node/13656" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Type Directors Club</a>. He holds the honorary degree of Doctor of Fine&nbsp;Arts.</p>
    <p><strong>Additional Articles:</strong><br><a href="http://designmuseum.org/design/matthew-carter">British Council Design Museum: Matthew&nbsp;Carter</a></p>
