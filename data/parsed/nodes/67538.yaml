    html: |-
      <p>Riccardo, thanks for digging up those older threads. In addition to what Mark said, I repeat what I have written before:</p>
      <p>In my opinion, the significance of a single-storey ‘a’ for children is, at least, debatable. Such a typeface might come in handy for teachers, when it is both used for reading and (as a model for) writing. Apart from that, the benefit of avoiding confusion of ‘a’ and ‘a’ is soon outweighed by the potential – and likely – confusion of ‘a’ and ‘o’.</p>
      <p>Children are not stupid, they can handle more than one representational form per character. Their world doesn’t end at the edges of their primer. They do spot and effortlessly read a lot of different ‘a’ glyphs every day: caps, italics, serifs, sans-serifs, scripts, fat letters, condensed letters, single-storey and double-storey …</p>
      <p>Furthermore, here’s what the researchers involved in the <a href="http://www.kidstype.org/" rel="nofollow">Typographic Design for Children Project</a> at the Department of Typography &amp; Graphic Communication (University of Reading) have found out about <a href="http://www.kidstype.org/The%20project/Testing%20typography/Typefaces/typefaces.html#infant%20character" rel="nofollow">infant characters</a>:</p>
      <p>“Most children in our study were well aware that there were different forms of a and g, and some even made the point that single storey a's and g's are what we write and double-storey a's and g's are what we read. Some commented favourably about what they perceived as the 'normal' g used in Gill Schoolbook.</p>
      <p>Other thought that double-storey a's and g's were 'harder' than single-storey a's and g's, but this did not affect their reading performance.</p>
      <p>If infant characters are used it is important that there is clear differentiation between charactes such as o, a and g. This is the case in Gill Educational, for example, but not in Avant Garde Gothic or Helvetica.”<br>
      — <a href="http://www.kidstype.org/The%20project/Testing%20typography/Typefaces/typefaces.html#infant%20character" rel="nofollow"> </a><a href="http://www.kidstype.org" title="www.kidstype.org">www.kidstype.org</a> </p>
