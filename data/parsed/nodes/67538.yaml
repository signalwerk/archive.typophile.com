      <p>The use of a schoolbook or infant version of a typeface can always of course be a choice based on the writing system taught within the publishers' country, but these tend to change multiple times every decade. </p>
      <p>One of the main selling points (and a problem) of these schoolbook versions is that we think children have a lot of difficulty understanding letterforms because of our adult conventions, For adults it is more difficult to learn different shapes since we are not used to them, for children this is far easier since they see every letterform in a different context anyway.</p>
      <p>So actually we make it much harder than it should be. Of course there are other problems, such as dyslexia, but a simple schoolbook type solution won't help there (nor will some of the so-called dyslexia-fixing typefaces, which complicate the matter by introducing far too many variables instead of looking for a simple solution)</p>
      <p>Since trying to teach children writing in block letters has been extremely sub par, the difference between the taught script and the reading letterforms is already huge, that the few 'schoolbook-specific' letterforms won't really matter much.</p>
