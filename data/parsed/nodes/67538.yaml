      <p><em>I suspect that the real reason behind these fonts is the other way around...</em></p>
      <p>Perhaps, but it's impossible to know without historical documentation.<br>
      At any rate, changing a couple of characters to make a product that scoops the educational market is an attractive business idea.</p>
      <p>Another theory: consider the sans serif situation mid-20th century, where alternate characters were provided by foundries, to enable their customers to turn Futura into Kabel (e.g. in the Anglosphere), on the one hand, or Gill into Futura on the other (e.g. for Europe). </p>
      <p>Might it not be that the type already existed (for grown-up aesthetic reasons) when the educationalist came calling, and all the foundry had to do was package the sorts?</p>
      <p>This conjecture begs the question: which came first, infant fonts in sans or serif?</p>
      <p><em>the many millions of users employing Verdana and Georgia to read, long have been proving the worth and excellence of infant font theory, no?</em></p>
      <p>Perhaps if Gadget had been bundled by Microsoft in a 4-font family with a 3-syllable name ending in "a", things would have been different!</p>
