    <p>Plantin Schoolbook/Infant, Bembo Infant, etc. </p>
    <p>Is it that they are easier for children to read? The single-story "y" and "g", the "a", etc., all look rather amusing and fun. They seem to be more decorative variants of the parent font, however. </p>
    <p>I assume children find it easier to read this sort of type. Correct? Is it that the single-story shapes are perhaps less complicated and more readily recognizable by children? Or is it that these characteristic letter shapes themselves are smaller and more compact variants, therefore making them "infants"?</p>
    <p>Thanks,</p>
    <p>Christian.</p>
