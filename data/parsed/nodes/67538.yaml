    html: |-
      <p>These are reductive, supposedly functionally superior forms.<br>
      The social idealism of modernism is at work here, applied to the proper instruction of the young.</p>
      <p>Post-modernism provided some perspective:  </p>
      <p>"Formalism was more symbolic than functional. It was symbolically functional. It represented function more than resulted from function. It looked functional more than worked functionally.” –Robert Venturi and Denise Scott-Brown, 1974.</p>
      <p>This doesn't deny the role of functionality in reading.<br>
      It just means that what is considered most functional no longer corresponds to the mid-20th century formalist style.<br>
      Now, it seems more reasonable that two-storey "a" and "g" are easier to read, as well as more interesting and more fun, and a richer cultural experience for children.</p>
      <p>Modernism, as a functionalist credo, is not discredited. But as a style, formalism is historical.<br>
      So the use of infant letterforms has a retro quality.</p>
      <p>Also, the theory of distinct and different character forms for early readers says something about how its proponents think about childhood -- that children are essentially different and not just mini-adults.</p>
