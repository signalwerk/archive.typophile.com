      <p>"I suspect that the rational behind Infant type variants is to avoid confusing children. If they are being taught to print one way, then the reading material they see in class should, presumably, be made the same way - at least if it's sans-serif."</p>
      <p>Yes, I'm sure this is the usual argument, if one is even made. However, it falls down on several grounds:</p>
      <p>- Kids see letters all over the place, not just in class. Most of the letters they see do not use the "infant" forms, so restricting the materials used in their class materials is of minimal help.</p>
      <p>- They already have to learn 52 letters, 10 numerals, and and assorted punctuation. Maybe about 65-70 characters altogether. Learning just a couple of variants is really going to be that hard?</p>
      <p>- If you want to avoid confusing them, actively *teach* them that these letters can take two different forms. They are going to encounter them anyway. What will really confuse them is encountering them without being told what they are! Similarly for sans vs serif and other concerns....</p>
      <p>- The one and only study on the subject, by Sue Walker, showed that even in first grade, kids preferred the more adult forms to the infant forms.</p>
      <p>Cheers,</p>
      <p>T</p>
