      <p>Thank you for the informative replies!</p>
      <p>I certainly find infant variants of typefaces interesting to read - "interesting" in the fact that their single-story letter features tend to jump out at me as oddities. As an advanced reader I (like most of us are) I'm capable of reading even partially obscured letterforms, partial words, etc. One learns to recognize words and entire phrases in even the poorest of conditions. Of course, I'm speaking as an adult. </p>
      <p>As for children, I think the issue is not as clear as some would like to think. While infant letterforms might mimic a child's handwriting (typically, at least), the child must eventually move on to fill the grown-up shoes of readers who are more readily familiar with standard letterforms. Which is especially true in this day and age of typed/on-screen material. Handwritten material (with a few exceptions) is going the way of the dinosaur. It might be best to move children into reading standardized type as soon as possible. perhaps avoiding infant variants entirely. Of course, this raises the issue of the importance of handwriting as an important step in the development of literacy.</p>
