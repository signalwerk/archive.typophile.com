      <p>I suspect that the rational behind Infant type variants is to avoid <em>confusing</em> children. If they are being taught to print one way, then the reading material they see in class should, presumably, be made the <em>same</em> way - at least if it's sans-serif.</p>
      <p>This, of course, doesn't require extensive research on testing reading speeds. Instead, it has to do with the questions students ask teachers, or errors made when children print by imitating the printed model. Even if such typefaces aren't used in books, they might be used in display charts illustrating the alphabet.</p>
      <p>Of course, this suggests the use of faces that simulate handprint instead of Infanta variants of normal typefaces. Fortunately, though, it is unlikely that anyone will stoop to teaching the children of the future to read with Comic Sans or anything similar. (And then there's the culturally-sensitive and politically-correct Papyrus...)</p>
      <p>I know that when I was young, although Century Schoolbook was used for early readers, there was a sense that the "canonical" form of the print alphabet was Caslon - all other typefaces being deviations from that one truth. Today, if schools want to avoid straining the brains of the young tykes by teaching them to recognize the English alphabet in multiple typefaces, they could just use Times Roman for everything.</p>
