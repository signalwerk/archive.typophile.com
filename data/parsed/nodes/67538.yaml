    html: |-
      <p>Just to reiterate, the "theory" behind the schoolbook variants is that they are easier for children to learn to write, and following on from that, that children would find it easier and more comfortable to read the same forms they write with.</p>
      <p>If children were kept in test tubes apart from school, and if all school materials were perfectly consistent, this might make sense. But of course they are exposed to plenty of material that does not fit this bill, and it seems they all learn the double-story "a" and "g" pretty quickly. It's hard to justify the schoolbook forms outside of materials specifically aimed at kindergarten age children. But somehow lots of publishers seem to think they are important.</p>
      <p>Of course, the obvious problem is that these letterforms are less distinctive than the alternative, and likely HARDER to read.</p>
      <p>Cheers,</p>
      <p>T</p>
