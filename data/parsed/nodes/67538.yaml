      <p>@Russell:<br>
      The traditional ‘Schoolbook’ or ‘Infant’ versions have different forms for a few key letters.<br>
      In <a href="http://www.fontshop.com/fonts/downloads/monotype/plantin_std_complete_vp/?&amp;sample_text=abcdefghijklmnopqrstuvwxyz&amp;sample_size=32&amp;update=0" rel="nofollow">Plantin</a> and <a href="http://www.fontshop.com/fonts/downloads/monotype/bembo_std_complete_vp/?&amp;sample_text=abcdefghijklmnopqrstuvwxyz&amp;sample_size=32&amp;update=0" rel="nofollow">Bembo</a>, that’s ‘a’, ‘g’, ‘y’.<br>
      In <a href="http://www.fontshop.com/fonts/downloads/monotype/gill_sans_infant_std_vp/?&amp;sample_text=aglyJ14&amp;sample_size=48&amp;update=0" rel="nofollow">Gill Sans</a>, that’s ‘a’, ‘g’, ‘l’, ‘y’, ‘J’, ‘1’, ‘4’.<br>
      In <a href="http://stonetypefoundry.com/tuffoverview.html" rel="nofollow">Tuff School</a>, that’s ‘a’ and ‘g’.</p>
      <p>For these four typefaces, the same applies to their italics respectively – except for the ‘a’, which is identical with the one in the standard (i.e. non-infant) version.</p>
      <p>[edit] Addition: <a href="http://www.signographie.de/cms/front_content.php?idart=304" rel="nofollow">Andron 2 ABC</a>: ‘a’, ‘g’, ‘ß’; Italic: ‘b’, ‘h’, ‘j’, ‘p’, ‘v’</p>
      <p>There is a large number of other families that offer optional glyphs like a single- and double-storey ‘a’ and/or ‘g’ within the standard fonts – usually via OpenType alternates – but which are not advertised as special ‘Schoolbook’ typefaces. Those include:</p>
