      <p></p><div class="imageWrap"><img src="http://typophile.com/files/JPNschoolbook_6066.jpg"></div><br>
      Here's a Japanese example.<br>
      Mincho is an ordinary book typeface which is equivalent of Roman in western world. Japanese schoolbook face is aimed to provide a good example of written form (with pencil). It has some different stroke from Mincho, in which many strokes are stylized. Hiragana has shorter swash in each stroke to make children to learn how to achieve legibility. This typeface is used in primary shool books (age 6-12). After that, Mincho replaces it entirely.<p></p>
      <p>Going back to Latin, as many people said already, I assume that the whole purpose of schoolbook typeface is that to teach children how to write (than to read). Therefore I think serifed schoolbook faces are pointless (e.g. Bembo). Upright italic typeface with serifless capital letters satisfies the purpose much more effectively. Hopefully, it should be monolinear to imitate pencil writing (Is this the reason why Comic Sans is popular in schools? At least I'm convinced). And it should be replaced with roman as soon as children become aware of the difference bewteen written form and typographic form.</p>
