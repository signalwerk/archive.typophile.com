      <p>Justin</p>
      <p>You might want to go to your local train store. There is a publisher, OSO Publishing/Evergreen Hill, which produced some books on the rails out there. They are a great resource. </p>
      <p>I partiularly love the Uintah Railway Co. My favorite is the 2-6-6-2 Steam engine used by them.</p>
      <p>Trains were the recipient of some great lettering/type so I would not discount the RR as a source. Cool stuff and some wonderful  lettering/type on engines, buildings and signage.</p>
      <p>Guess you can tell what I do in my spare time. HO all the way. Get your minds out of the gutter... HO is a train guage. Not you Justin ; )</p>
      <p> Michael</p>
