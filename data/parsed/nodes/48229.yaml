      <p>A wonderful aside.</p>
      <p>When I got into lettering in the early eighties I searched out a couple of the surviving old guys who did some of the buildings here in Richmond. </p>
      <p>One of them who was at least late in his nineties told me... “Ain’t a one of them (type designers, I assume) know what they’re doin’. I have to borrow an N from this style and an A from that one and then finagle them to work on the building, ain’t enough room for the damn showoff ten dollar names. Inc. or Co. don’t make a damn to me! Just shorten the rest of the malarky. I almost fell off my chair laughing. </p>
      <p>Michael</p>
