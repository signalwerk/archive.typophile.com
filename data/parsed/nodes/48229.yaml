    <p>I am working on a film about Portland OR, as well as the pacific northwest. Portland is filled with old building painted with great typography. It’s very railroad/lumber yard looking (which is Portland’s roots). The film is going to capture the essence of the rustic city, by featuring a sound track of all local artists and using old typography.</p>
    <p>I’ve attached some examples of the buildings, and some scans out of a book. I am NOT looking for a distressed font, or anything cheesy like that. I plan to use slighty imperfect letter spacing (as the type was painted by hand) and faded colors. Of course, I am really open to suggestions for interesting (but not over the top) type treatment ideas.</p>
    <p>If there are any typefaces you know of that are similar to what I’ve attached, it would be most appreciated. Bonus points if the type or typography has any historical relevance to the northwest.</p>
    <p>Thanks all!</p>
    <p></p><div class="imageWrap"><img src="/web/20081122114707im_/http://www.typophile.com/files/NWType_4294.jpg"></div><p></p>
