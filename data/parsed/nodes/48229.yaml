      <p>Your examples look to be from a wide time span but some simple ideas are:<br>
      -Neutratext, it has a similar feel.<br>
      -akzidenz grotesk (similar to what you have at the bottom-and the most prevelant pre-Helvetica Sans so probly in your time frame).<br>
      -Belwe (pretty classic)<br>
      -Ottomat<br>
      -Candida (personal favorite)<br>
      -Trade gothic (obvious! the classic face of the industrial revolution-this guy practically built the railroads!)<br>
      -Americana (a bit played out but relevant)<br>
      -AmfacParksHeadline (essentially serifed version of Trade)</p>
      <p>-Hope some of those help. You’re project sounds cool-the time in which Portland came up be was an interesting time for design and typography in general. Good Luck keep us posted</p>
