  html: |-
    <p>Hi all - what is the shortcut for the selection arrow in Fontographer (top left in toolbox)?<br>
    I know that:<br>
    1 is rectangle<br>
    2 is star<br>
    3 is circle<br>
    4 is line<br>
    5 is draw<br>
    6 is pen<br>
    7 is cutter<br>
    8 is round point<br>
    9 is hard point<br>
    0 is tangent point<br>
    O is outline layer<br>
    t is template layer<br>
    g is guides layer<br>
    h is hints layer.<br>
    But the thing I want to use the most, does not have a shortcut?</p>
