    html: |-
      <p><a class="freelinking external" href="http://typophile.com/node/101734" rel="nofollow">Previous discussion</a> on this topic. </p>
      <blockquote><p>Don't think it's a font as it, more a custom work based on some existing type or why not a hand-lettering by Otomo Katsuhiro himself mimicking some black condensed grotesk. If I had to reproduce it, I'd probably start with <a class="freelinking external" href="http://www.myfonts.com/search/Impact" rel="nofollow">Impact</a>, stretching it and pulling some points up/downwards to reduce bowlers. <a class="freelinking external" href="http://www.myfonts.com/fonts/fontbureau/tasse" rel="nofollow">Tasse</a> would be another good substitute.</p></blockquote>
