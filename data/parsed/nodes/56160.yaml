    <p><a class="freelinking external" href="http://www.youworkforthem.com/product.php?sku=T0259" rel="nofollow">Morricone</a> is a new gun with its own tune. After looking at some old exxamples of egyptian and italian slabs, I sketched out some letters that reduced the negative space between slabs and strokes. With some additional abstraction, Morricone took shape. </p>
