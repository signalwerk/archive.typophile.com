      <p>Ascender has some good info about this on their support FAQ:</p>
      <p><a href="http://www.ascendercorp.com/support/#cache" title="http://www.ascendercorp.com/support/#cache">http://www.ascendercorp.com/support/#cache</a></p>
      <p>I use the FontExplorer X, which has a utility built in for clearing font caches. </p>
      <p>I actually try to avoid clearing font caches as much as I can since it requires a restart every time. When I have a font under development, I change the font name with each new version I want to test. This sidesteps the cache issue since the system sees different names and assumes they are different fonts (which, if you think about it, they are).</p>
