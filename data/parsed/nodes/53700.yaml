    html: |-
      <p>I've seen both extra vertical space and negative vertical space (lines squish together or display as half height) in fonts generated by FontLab where the ascender is lower than the cap height.</p>
      <p>The way I see it, if the ascenderr line is lower than the cap height, the ascender line really serves no purpose, other than as a guide while editing/creating a font. Once you're done with the font you can ignore the actual ascender height and set the line a couple of em spaces higher than the cap height and that seems to usually fix the problem you're seeing.</p>
      <p>At least that's been my experience.</p>
