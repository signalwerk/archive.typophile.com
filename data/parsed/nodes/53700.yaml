  html: |-
    <p>I'm having this problem with the vertical metrics of my Print Clearly font on my Mac (OS X). The vertical metrics for Print Clearly and Print Dashed are extremely tall. This happens with the font preview, font book and TextEdit. The fonts match exactly as they should in Photoshop. Here's a screen grab:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/verticalsmac_4851.jpg"></div><p></p>
    <p>I've checked all the vertical metrics, looked for glyphs that might cause the problem, in fontlab and see nothing that would cause this problem. I'm perplexed.</p>
