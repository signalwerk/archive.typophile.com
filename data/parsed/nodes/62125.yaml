      <p>AdobeSongStd-Light (Adobe 宋体 Std L) and AdobeHeitiStd-Regular (Adobe 黑体 Std R) are Simplified Chinese fonts that are intended to be used for China, not Taiwan. While a significant number of glyphs are entirely appropriate for use in Taiwan, some are different, and sometimes in subtle ways. A not-so-subtle example is the ideograph 骨 and any ideograph that uses this as a component. Try rendering it using different Chinese fonts, Simplified and Traditional, and you'll see mirroring of the top portion.</p>
      <p>What I am trying to say is that you need to be prepared for some complaints, and chances are they will be about this very issue.</p>
      <p>In terms of using those fonts for body text and headlines, they are otherwise good choices, ignoring the Simplified versus Traditional issue. </p>
      <p>Dr. Ken Lunde<br>
      Senior Computer Scientist, CJKV Type Development<br>
      Adobe Systems Incorporated<br>
      <a href="mailto:lunde@adobe.com">lunde@adobe.com</a></p>
