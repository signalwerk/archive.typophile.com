      <p>Ken, David, thanks for your advice. I ended up using Adobe 宋体 Std L for body, and Adobe 黑体 Std R for headlines. I was told to use the Taiwanese Chinese language setting, and there was an editor that checked the final outcome of the text - so it seems that everything went well. (At least, I haven't heard any complaints). </p>
      <p><cite>In Chinese type, 細 means “Light”, not condensed.</cite><br>
      That makes sense! I was confused, since it didn't seem condensed at all.</p>
