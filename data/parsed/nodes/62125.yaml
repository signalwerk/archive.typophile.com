      <p>In my opinion, the most important decision that faces you is whether you need a Simplified Chinese or Traditional Chinese font. This has nothing to do with the number of glyphs in the font, but rather is a region-specific shape issue. For a large number of characters, the same glyphs can be used, but for a significant number of characters, distinct glyphs are necessary. Some of these differences are reflected as separate Unicode code poins, but some have been unified, meaning the same Unicode code point can accommodate both forms, but most fonts include only one of them. (A so-called Pan-Chinese font would include glyphs suitable for both Simplified Chinese and Traditional Chinese, and the only such fonts of which I am aware are two weights of STHeiti on Mac OS X 10.6 that are implemented as TTCs.)</p>
      <p>Anyway, if you let us know the target audience, which would indicate whether Simplified Chinese or Traditional Chinese would be appropriate, I can make some suggestions.</p>
      <p>Dr. Ken Lunde<br>
      Senior Computer Scientist, CJKV Type Development<br>
      Adobe Systems Incorporated<br>
      <a href="mailto:lunde@adobe.com">lunde@adobe.com</a></p>
