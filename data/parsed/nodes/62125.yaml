    <p>Could someone help me out with the following fonts?</p>
    <ul>Adobe 明體 Std [Ming]<br>
    細明體 [Ming Condensed?]<br>
    新細明體 [New Ming Condensed?]
    <p>Adobe 仿宋 Std R [Fangsong]<br>
    黑体 [Boldface]<br>
    Adobe 黑体 Std R<br>
    Adobe 楷体 Std R [Script]<br>
    宋体 [Arial]<br>
    Adobe 宋体 Std L<br>
    宋体-PUA<br>
    新宋体</p></ul>
    <p>Just a brief description/confirmation of the what kind it is (i.e., bold, condensed) or any helpful corollaries between these and other fonts I might recognize (i.e. this is the TNR equivalent), and any helpful usage info/tips.</p>
    <p>So far, what (I think) I've figured out is in brackets, plus I'm guessing R=Regular and L=Light. Just for reference I've attached text samples with each text.</p>
    <p>[Background] I'm designing an ad for a free Chinese magazine here in LA called "World Weekly" for my company. The problem is, I can't read Chinese at all, although I can figure out some things through my knowledge of Japanese. Probably, no one (that pays me) will care if I use the right fonts. But I've seen shoddy cross-cultural marketing, and one of the things that blares "WE DON'T SPEAK YOUR LANGUAGE" is the odd choice/misuse of fonts. So, I would like to avoid that, and any help would be appreciated! Unfortunately, I don't have the scads of time to do the research - just hopefully get some quick advice or any resources that might help. Thanks!<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Chinese-fonts_4426.jpg"></div><p></p>
