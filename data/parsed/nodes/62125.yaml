      <p>In Chinese type, 細 means "Light", not condensed.</p>
      <p>While many Japanese <em>kanji</em> are in fact Chinese characters (漢字), quite a few are simplified forms unique to Japanese.  Select one of these and AI's glyph palette can give you the "alternate" Chinese form -- click the little black triangle in the lower right corner.  Once you've re-encoded the character in the Chinese form, a Chinese font should work.  This feature is a good reason for using Adobe's Opentype fonts.</p>
      <p>But beginning in the late 1950s the People's Republic provided simplified versions of traditional characters, only some of which look like the Japanese simplifications.  Some can be found in Adobe Ming, but for simplified characters you're better off with Adobe Song.  Some audiences care a great deal about traditional Chinese vs. simplified.</p>
      <p>Ming/Song styles are generally a safe bet.  Fangsong 仿宋 (less common for Japanese) and Kai 楷 are more calligraphic; "gothic" 黑體 styles are also useful.  Which you choose is, well, a matter of style.</p>
      <p>Good luck,<br>
      David</p>
