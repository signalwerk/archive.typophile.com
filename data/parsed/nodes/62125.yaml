      <p>Also... I'm using Illustrator and it doesn't seem to understand that I want to use Chinese fonts, not Japanese ones. Even though I select the text and change it, it won't remain whichever Chinese font I've selected - it either switches back to Kozuka Gothic (a Japanese font) or is blank (in which case I go into the text, and it's usually Kozuka Gothic).</p>
      <p>Which is problematic, not the least of the problems being the X'ed rectangles that appear (the placeholder boxes when there is no matching character in the set).</p>
