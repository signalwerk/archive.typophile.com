    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 14.Mar.2008 5.24pm </div>
      <p>Greetings Friends!</p>
    <p>We’re pleased to announce the re-release of two breathtaking scripts from the Filmotype Font Library.</p>
    <p>Filmotype Alice marks the beginnings of the casual handwritten script aesthetic. Introduced by Filmotype in the late 1950s, it perfectly captures the mid-century playfulness of hand lettering while providing comfortable readability.</p>
    <p>You can look for Alice’s cousin Brooklyn to be released in the coming months. Brooklyn was a derivative weight of the Alice face that is slightly bolder and wider than the original.</p>
    <p>Strikingly poised and almost as exotic as it sounds, Filmotype Zanzibar is among Filmotype’s most amazing and beautiful formal scripts released. This hidden gem from the early 1950s has been meticulously redrawn from the original font filmstrips and has been expanded to include a full international character compliment, automatic fractionals, ordinals, and a host of alternate characters in dynamic OpenType format.</p>
    <p>We’re pleased to share the re-release of these amazing original designs from the 1950s and hope you’ll find them to be a perfect compliment to your design toolbox.</p>
    <p>You can purchase, preview and discover more about these faces online exclusivly at Font Bros!</p>
    <p>See ’em here: <a href="http://www.fontbros.com/filmotype.php" title="http://www.fontbros.com/filmotype.php">http://www.fontbros.com/filmotype.php</a></p>
    <p>Warmly,<br>
    Stuart</p>
