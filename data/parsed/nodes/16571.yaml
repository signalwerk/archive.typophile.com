      <p>Seems to me you need to ask a few specific questions of the potential employer. How can you know what you're expected to do if you don't ask?</p>
      <p>That said, in my experience it's not so much that the typesetter is proof-reading for spelling and grammar (the publisher will have their own house-style that will have to be followed, and that's more or less the project-editor's duty), but that you'll be expected to find and fix typographical errors, such as double-spaces after periods, use of proper diacritics where necessary, house-style defined use of hyphen/en-dash/em-dash, implementation of small-caps for acronyms, etc. But there is also the primary task of a typesetter, being to control the page-flow and keep widows and orphans at bay, and to create smooth word spacing through careful use of hyphenation and justification. None of this is necessarily "design," but all of it (and much more) is book typography &amp; typesetting.</p>
      <p>IF someone else has designed the layout and stylesheets it sounds like you're being shifted from your own background and into an entirely different field. These days, it seems, designers are typesetting their own projects, which just makes sense to me, but that doesn't sound like what you're being asked to do.</p>
      <p>If you don't have any training in typography and typesetting it would make me nervous that they're thinking of hiring you for the job. I don't mean that as a slag to you, it's just that if they're hiring someone with no experience that says to me they're not all that keen on having the job done well, and that sort of situation isn't good for anyone.</p>
      <p>As above, definitely look at the <a href="http://www.typophile.com/wiki/triumvirate" rel="nofollow"><em>triumvirate</em></a>, especially Bringhurst's book (but give yourself some real time to digest this very dense volume). Many of us around here have read that book and many others many, many times and still have much to learn. It seems to me that only after reading something like Bringhurst can you determine if typesetting holds any real interest for you. Not to mention that in many ways, book typography is the opposite of graphic design: in the latter your job is to dupe the reader, in the former it is to be of service to the reader.</p>
      <p>So, get reading, and that will help you ask your potential employers the right questions.</p>
      <p>ps. A while back I started putting together a sort of <a href="http://www.greenboathouse.com/dewinetz/pdf/book-typography-checklist.pdf" target="_blank" rel="nofollow"><em>checklist</em></a> for book typography. It stalled and I still have much to add to it, but it might be useful for you. Keep in mind that this list is made up of my personal tastes which may differ from yours and others, and also that this particular list includes spacing suggestions specifically for Adobe Minion Pro, which I use quite often in book work. I post it here simply as a reference, not as a set of rules, and my list is absolutely no substitute for Bringhurst <em>et al</em>.</p>
    html_clean: |-
