      <p>I have never typeset a whole book until the last week... It's a demanding job, specially for eyes (my poor eyes), but I enjoyed it. </p>
      <p>It took me four whole days to typeset this 176 pages book (included drawing 9 charts and diagrams), kinda slow I guess but it was my first time with this kind of task (and also my first time with Indesign).</p>
      <p>As this book is being paid by a public scolarship there was no money for a proofreader or style corrector, so I tried to point out as many ortographic and gramatical errors as I could with a pencil on the first proof I sent but I must admit I didn't read the whole thing, I had not enough time and it was a specialized text with lots of jargon so as mentioned by others I visually scanned every page twice looking for open lines, short lines, orphans widows, badly hypentated words, three hypens on a row, wrong dashes, double periods after question marks etc...</p>
      <p>After I got the corrected proof I scanned it again and spoted a couple of extra mistakes.</p>
      <p>I also had to make some decisions like substituting bold words with italics, turning some quoutes into indented italic text blocks, etc...</p>
      <p>I really had a bad time with one of the authors because he insisted so much in keeping periods after question marks and elipsis and also keeping bold words in the text. I had to show him recommendations against bold and the rules about periods on the "Manual de Diseño Editorial".</p>
      <p>I liked this job, I also wish there was a way to make it less stressful.</p>
      <p>Héctor</p>
