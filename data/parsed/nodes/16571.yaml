      <p>I'm with Héctor, even Cheryl's mention of four days for a 176 page book surprised me (including 9 custom drawn charts and diagrams, that's crazy). While I've done rush jobs in a week, I won't take such projects on anymore because they always end up a disappointment. My old man always said "if you're not gonna do the job right, do something else," so these days (when I can afford to) I decline the rush contracts and seek other projects.</p>
      <p>And Cheryl, your attitude to this opportunity does sound well suited to the job; that is, seeing your goal as learning the rules (there are lots of them to learn).</p>
      <p>As for suggestions in addition to the <a href="http://www.typophile.com/wiki/triumvirate" rel="nofollow"><em>triumvirate</em></a>, I echo David's mention of Richard Hendel's <em>On Book Design</em>, and Felici's <em>The Complete Manual of Typography</em>, as well as Tiff's reference to Hochuli &amp; Kinross' <em>Designing Books: Practice and Theory</em>. I found all 3 of these very informative the first time I came across them.</p>
