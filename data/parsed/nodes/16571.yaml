      <p>Cheryl,</p>
      <p>I am self employed, mainly kind of a sub-contractor for advertising agencies ang printers, but I do have a few customers of my own. I've done the typesetting for some doctoral dissertations (including charts etc) and annual reports, and I'm sure I couldn't do 600 pages in just a couple of days. i don't usually read the text properly, if it's long, but rather scan for possible problems. There is usually at least one other person to proof-read it, in case I miss something.</p>
      <p>As Miss Tiffany wrote, style sheets are the key here. It takes a bit of time to do the settings for them but they save a lot of time in the long run. If you have the choice, I'd choose InDesing to work with.</p>
