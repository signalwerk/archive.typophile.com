      <p>Cheryl,<br>
      First, welcome to Typophile!</p>
      <p>Regarding proof reading. It seems more logical that they are asking you to proofread for completeness (no lost text), correctness of typgraphic style (all the correct style sheets are used on the given text), and good color and fit (no widows and orphans, good H&amp;J. etc.). I don't think you will "read" the book, just scan for formatting.</p>
      <p>ChrisL</p>
