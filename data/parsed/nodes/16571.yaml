      <p>Congratulations.</p>
      <p>Welcome to the world of book typesetting. This is what I've been doing for the past 10 years or so, and I find it immensely gratifying.</p>
      <p>You will cultivate a tremendous attention to and respect for detail. You will often - and sometimes (but not often) mistakenly - assume that attention to a level of detail invisible to most eyes is more important than the holistic book. Should you begin thinking in these absolutes, unable to find a balance between detail and consistency, just remember that detail is consistency, and get back to work.</p>
      <p>Make sure you have the largest and brightest monitor possible. I recommend a 23 or 30 inch Apple studio display. It will become one of your closest friends.</p>
      <p>Do not attempt to depend on a 1-button mouse. Get a 3-button Microsoft optical mouse or a Microsoft trackball with at least 3 buttons.</p>
      <p>Read every Indesign manual / book you can acquire, and learn how to automate the application through stylesheets, macros and Applescript. This will save you untold hours of effort. Refuse to work with Quark or anything else - although Framemaker is acceptable, sometimes.</p>
      <p>Keep the Thames &amp; Hudson, the Chicago, MLA, Bringhurst, the AP and the GPO style manuals on your desk at all times and - if you must loan them out - keep backup copies for yourself.</p>
      <p>Invest in a good dictionary and a better thesaurus. "Copyeditor" may not be in your job description, but a good book typesetter is relied on to settle all arguments of style and usage, even among technical writers. Believe me; I work for two dozen trained writers, and they all look to me and the other typesetter here for answers to questions so arcane that Strunk &amp; White would tremble. Even if you don't have the answer, you must always talk a good game.</p>
      <p>Start out working at enormous magnification. I can read through a 140 page book, a line at a time, and edit as I go in one 7.5 hour shift. But it may take you a few years to get there. That's OK.</p>
      <p>If you wear glasses, get a special prescription for use with the monitor you do most of your day to day on.</p>
      <p>Try not to start smoking, and don't keep liquor in your desk. These are the fatal flaws of otherwise great typesetters.</p>
      <p>And to answer your question on reading vs. typesetting:</p>
      <p>I typically read 100 pages before in bed every night, in the 45 minutes I read before turning out my lamp. In optimal working conditions, and assuming very well-written and carefully edited copy, an already-finalized template (as if there were such a thing!) and an empty bladder, I may be able to typeset no more than 40 pages in the same amount of time. And I think I'm pretty fast; I think there's at least some connection between typing speed and thinking-while-reading-carefully speed, and I type a bit under 150 wpm.</p>
      <p>Best wishes and please to come to us with problems or questions.</p>
      <p>Yours</p>
      <p>Joshua</p>
      <p>---</p>
      <p>jlt : <a href="http://www.hewnandhammered.com" title="http://www.hewnandhammered.com">http://www.hewnandhammered.com</a> : rnrmf!</p>
