      <p>&gt; <cite>I think of typesetting as a creative job is it not? They have said this isn’t a design job.</cite></p>
      <p>Not knowing the specific job description, this is just an assumption based on previous experience:</p>
      <p>You would ONLY be responsible for typesetting -- that is, flowing copy, making sure it looks right, attention to the details, etc. Most likely someone else (the designer) will have already done the basic layout, chosen typefaces and possibly even set up style sheets before the job gets to you. Based on the designer's template of a couple of pages, your task is to finish the job for the remaining 600 pages of the book. </p>
      <p>Nonetheless, it would be great practical experience!</p>
