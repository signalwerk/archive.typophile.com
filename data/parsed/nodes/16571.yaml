      <p>Hi there</p>
      <p>I just finished up a year of educational publishing as a freelancer (40 books for a variety clients) and I can think of several companies that are looking to hire recent graduates for this kind of work. Just from what you've said I expect that you'll probably only have to flow in text and style it, and in that case 600 pages in a few days is not as scary as it sounds. When I was starting out ten years ago I used to freelance at a place where we would do books like that over the weekend. You'll get really fast and you'll learn how to set up a document in a way that's good for your sanity. It's a great way to learn the mechanical side of the design business.</p>
      <p>Style sheets, master pages, and characters are key. Especially the difference between a hard return and a soft return and a tab. You're going to run into a lot of manuscripts where editorial uses multiple tabs for a soft return and hard returns to break a line.</p>
      <p>Good luck! I hope you get the job, and that you keep looking for design opportunities while you're there.</p>
