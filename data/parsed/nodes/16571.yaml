    <p>I am a recent Graphic Design graduate and went to an interview for a Production Assistant at an educational publishing company.  The job would involve typesetting long documents, books and study materials in Quark or InDesign.</p>
    <p>I have not "typeset" long documents before and the thought of having to read and typeset a 600 page book in a couple of days seems daunting..</p>
    <p>Does anyone have any advice for me about typsetting in general, or know of any good websites/books which would help me get a head start if i do get the job??</p>
    <p>The other people in the publishing department have not come from a design background, so I was slightly confused.  I think of typesetting as a creative job is it not?  They have said this isn't a design job.  </p>
    <p>Any advice would be appreciated,</p>
