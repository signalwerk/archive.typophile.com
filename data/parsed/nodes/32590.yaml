      <p>This is a pretty crappy excuse, but it's probably because graphic design history is a pretty new field, and most of the people writing the books are not historians, they're designers. These books are not written as part of a grand tradition that's evolved since Vasari wrote the <em>Lives</em>. They're also often writing the books alone, without a cadre of interns to do things like excessive fact-checking, which doesn't help.</p>
      <p>It will get better in time. There are more design history books popping up than ever before, and future authors will be fixing the mistakes of their predecessors.</p>
