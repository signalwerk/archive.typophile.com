      <p><em>Are these concerns completely irrelevant ?</em></p>
      <p>No, but I don't think they make much difference.<br>
      I recently went to an exhibition, Avant-Garde Graphics 1918-1934, from the Merrill C. Berman collection. The catalog was very well done, and indeed has size and media annotated in the List of Works at the back. But in the front of the book where the reproductions are, there is no mention of size in their captions. This is extremely misleading, as a huge work like Theo Ballmer's "buro" poster of 1928 is reproduced smaller than magazine covers. There is no sense of scale. It's all about layout: the layout of the history book, and the layout of the works shown in it.</p>
      <p>Ideally, works should be shown in correct relative scaling, and with an excerpt of type at 100%, because the effect of typography is, of course, fundamentally size-specific.</p>
      <p>For an article in <a href="http://www.shinntype.com/Assets/Depts/Essays/4theMass.pdf" rel="nofollow">Druk No.8</a> (171mm x 314mm, CMYK offset on uncoated stock, perfect bound, soft cover, 2001, edited by Jan Middendorp, published by FontShop Belgium), I showed type specimens at 100%, but was not able to reproduce the pages they came from at a consistent relative size. The reason is that a reproduction of a large magazine page, already considerably shrunk, would have been next to a reproduction of a small magazine page surrounded by white space. To the reader, it would seem strange that the smaller page wasn't the same size as the larger one, when there was space for that, and the layout would have looked nice and consistent. </p>
      <p>In general, it seems that the expectation of a design history book is that the layout should look sweet and tasty, and this is more important than mere documentation. </p>
      <p>At the other extreme is brilliant research with abysmal reproductions -- two examples which spring to mind are "Spaces of Type", with illustrations of Aldine books that are poor photocopies, and Alphabets to Order, where many of the scans of 19th century type books could have easily been improved by a little photoshop work with a gradient mask. </p>
      <p>The best magazine reproductions I have come across are in the catalog of the Fotografía Pública exhibition, where the documents have been opened, flattened with glass, and photographed and reproduced with a vignetted dropshadow, as <em>objets</em>. (This was also the technique I used for my Druk article.) However, the dimensions of the works are not included in the Fotografía book.</p>
      <p>Another outstanding documentation is Baker and Bretano's <em>The World on Sunday</em>, where 1890s newspapers were photographed using a view camera and reproduced in a large book.</p>
