      <p><cite>i don’t think the real issue is that the history of the field is short but that graphic design and, shoulder-to-shoulder, type design are (by practical nature) fields of ephemera.</cite></p>
      <p>Well, except for books. They were suppose to last, and some thought of that is still carried on today, as witnessed by the "guidelines for permanence and durability of the committee on Production Guidelines for Book Longevity of the Council on Library Resources."</p>
      <p>But you're quite right, most other printing is termed "ephemeral," and to a large extent aimed at a very current audience, with an understanding of both time &amp; place. The latter would be as or more important than the technical details such as "what size type," which is often only an an answer to "what fits?"</p>
