    html: <p>i don't think the real issue is that the history of the field is short but that graphic design and, shoulder-to-shoulder, type design are (by practical nature) fields of ephemera. it usually wasn't until much after the fact that an item might be looked at with the "hey -- THIS piece might be important someday" viewpoint. that's starting to change, of course, but i can say it wasn't until 15 years ago that the college at which i teach classified graphic design as an "art." before that, it was a "craft," a distinction that carried a lot of connotations with it.</p>
