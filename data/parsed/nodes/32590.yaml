      <p>&gt;Well, except for books. </p>
      <p>And except for type design. At the Museum of Printing, Larry Oppenberg pointed out that at the time the focus of big companies like Linotype was on selling the machines, and type was a means to that. And there was continual change in the machinery of typesetting and printing from 1850 until the digital age. And it is still going on with direct to plate. </p>
      <p>But what turned out to be of most lasting value, Oppenberg--a type designer--pointed out were the typefaces. With every change of technology they were redrawn and revived. The work of Griffo, Garamond, Caslon, Baskerville, Bodoni we still look at daily, when the machines are only in a few museums.</p>
