    <p>Why aren't graphic design history books as thoroughly documented as art history books ? I'm a French graphic design teacher and I'm struggling every damn week to find proper description data of posters, magazines, ephemera, etc. (size, printing technique, etc.) for my graphic design/typography history course — when these facts are commonplace for any painting in any art history book. Are these concerns completely irrelevant ? Am I the only teacher around with this kind of problem ?<br>
    For instance, does ANYONE know the exact size of Swiss « Neue Grafik » magazine, launched in 1958 by Vivarelli, Neuburg, Lohse and Müller-Brockmann ? Thank you very much.</p>
    <p>PS : Please forgive me for my poor command of English writing.</p>
