      <p>Nick — I agree that the sense of relative scale is much too often sacrified for the sake of a cool layout. The "Avant-Garde Graphics" catalogue you're writing about is indeed not flawless in this respect, but at least the description data is available somewhere in it.<br>
      It is very difficult to give students a sense of respect for graphic design history (as something distinct from/as valuable as art history) if crucial data about the physical nature of artefacts seems to be less important in one case than in another (I don' know if I'm making myself perfectly clear here).</p>
