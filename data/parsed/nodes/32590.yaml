      <p><em> except for books.</em></p>
      <p>..appliance instructions (from barometers to dashboards), signage and logos, (The Bass triangle of 1876 famously appears in a painting by Manet.) </p>
      <p>The seeming non-importance of physical description is probably more due to graphic design's inherent lack of tangibility as a single <em>objet.</em> Logos and brands evolve, and are scalable.</p>
      <p>So discussing such, any particular physical iteration lacks the presence of the single art work, and reproduction of the image becomes as good as the original -- in the way that an ad may be scaled for poster, full page, or smaller.</p>
