    html: |-
      <p>With geometric sans serifs, the caps often have essentially oldstyle proportions.</p>
      <p>To me, the real question is, what serifed typeface would I *not* use with Futura or Century Gothic? I think anything too "quirky" is out. Just about anything by Goudy for instance, including Goudy Oldstyle. Anything too calligraphic in tone, including many Venetian oldstyle typefaces (Centaur, Adobe Jenson)... so no Brioso, probably not even Palatino.</p>
