    <p>Hello!</p>
    <p>I am working on a series of books and their titles are in Century Gothic, which I love. But I am having a hard time figuring out a typeface for the body text that goes well with it, probably a serif for better readability.</p>
    <p>Can you guys give me a hand on this? Which typefaces you think match century gothic?</p>
    <p>Thanks!</p>
