    <p>I need an OS X utiliy or font manager of some kind (like Typograf for Windows) that simply displays the number of kerning pairs for a given font.</p>
    <p>I know that Suitcase Fusion with Font Sense does this, but that’s a bit much just to check for kerning. Font Book, which comes with OS X Tiger, is nice and simple but gives no kerning info.</p>
    <p>Thanks.</p>
