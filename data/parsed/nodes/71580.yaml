  - id: 417259
    user: 23155
    date: 2010-06-24T00:08:00
    date_raw: 24 Jun 2010 — 12:08am
    votes: null
    html: |-
      <p>Straight off the bat I'd say that answering what separates good quality from bad is the same with everything - you can tell the difference between and cheap town car (not naming any names) and a full spec Mercedes right? It's about what has gone into something that makes it good quality; Time, effort, research &amp; skill. If you're saying you've been a graphic designer for 5 years (and I don't doubt that) then you should start seriously looking into the finer points of typography - it can only help you and improve your understanding of what works and why people are willing to pay the kind of prices you see from these font foundries.</p>
      <p>Neutra may seem a little expensive, but considering the different weights you get for your money and the fact that you're getting a font that not every spotty young wannabee with a few free fonts and a cracked copy of photoshop may have will lift your designs above the mediocre. You'll find a lot more mileage from a decent, well thought out font than you may realise.</p>
      <p>JH</p>
