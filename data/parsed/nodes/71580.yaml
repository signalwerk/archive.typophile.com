    html: |-
      <p>Thank you all for your responses, I do appreciate the help greatly.  I have been a graphic designer for 5 years, but I've always just chosen a font that looks good, without any real thought into the typography process.  Justin, you say those fonts are low quality, but I'm afraid I don't understand what a low quality font means.  To my eyes, and I could be grossly mistaken, all fonts look the same "quality". I mean, they don't have aliased edges and what not.  Is it a spacing or kerning issue?  What separates a good quality font from a bad quality one?</p>
      <p>Are there any resources for learning the basics of typography, and what font choices I should be looking for in certain circumstances?  I apologize if I sound like a novice, I'm really not.  I'm just more of a visual effects artist, who also happens to do a little motion graphics work as well.</p>
      <p>Thank you all for your incite and suggestions.</p>
