    html: <p>I must put in a recommendation for "Creative Lettering Today." Michael Harvey's book addresses lettering by hand, carved lettering, and digital type design. <br> <br>For digitizing your letters, I would recommend the ScanFont + FontLab combination. It's not cheap, however. For a lesser investment, TypeTool is a good choice. Of course, given the hundreds of hours you have to put in to make a decent typeface, the cost of tools may seem less extreme. <br> <br>Regards, <br> <br>T <br></p>
