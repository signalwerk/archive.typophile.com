  - id: 26704
    user: 2575
    date: 2004-03-12T09:27:00
    date_raw: 12 Mar 2004 — 9:27am
    votes: null
    html: "<p>Frank <br> <br>There are various methods of rendering finshed lettering. <br>Calligraphy is of course written spontaneously in a controlled manner, and the more innate talent and  control a person has, the more beautiful the effect. <br> <br>Lettering for things like type and logos etc. are done with the use of drafting tools, although some very talented people can completely freehand the work with  pen and brush. Frederic Goudy notes in his writings that his work was all lettered freehand; even in his sparing use of straight lines. And keep in mind, that white paint is also  for the little glitches. <br> <br>Since almost everything I do now is drawn for digital fonts, I need do only a pencil outline for hand digitizing. <br> <br>When I did all of my work on board, my method was to draw as perfect as possible a pencil drawing of the work, and then I inked it in with India. <br> <br>I have always needed to use drafting tools to get good work. For this I have a wide selection of plastic circle and oval templates from small to very large. Along with that I have a very old set of twenty or so gentle curves. I am told these are tailor's curves, and my set is made of about 1/16\" hardwood. I recall that I found them in their handsome wood box in \"Tiger Ted's Junk Store\" in  a little town near my home. I have found these curves to be very useful in the rendering of long, slight curves, like the flair of stems in letters. This type of tool is still available in aluminum. I do have two or three sizes of French curve tools, but use them rarely. Small curves like serif brackets I have always freehanded. <br> <br>This is just a bit of personal info from one who has done it for more than 40 years. But you are wise to get hold of all the books you can on the subject, and to get the advice of others who have done inked work. <br> <br>I agree that a calligraphy course is of great value to a type designer, even if you do not intend to do strictly calligraphic work. The practice of writing forms is a fine way of getting your head around how letters come about. <br> <br>The tools I use are: technical pens, croquill pen, Winsor Newton Series 6 brushes (expensive, and are damaged by India ink, but you need to have good brushes) good quality India Ink, Opaque white designer's colour white or good white-out paint. <br> <br>Some prefer a perfectly smooth hot press board for a super clean line. I have always preferred a very slightly toothed board, because it gives me a little more control, and I like the feel of it.  <br> <br>Jim Rimmer  <br> <br></p>"
