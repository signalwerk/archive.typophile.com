    html: <p>The latest version of ScanFont's autotrace is quite sophisticated. But the real advantage to using ScanFont is its ability to place eps outlines directly into the proper glyph cells in FontLab in one operation. <br> <br>No more cutting and pasting between Illustrator and font editor.</p>
