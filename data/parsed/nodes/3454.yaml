    html: '<p>Frank -- there are dozens of lettering books that <br>show you the ins and outs of drawing <br>and painting letters. <br> <br>go to <br><a href="http://www.bookfinder.com/" target="_blank">http://www.bookfinder.com/</a> <br>or another book search engine <br>and type in Lettering <br> <br>here is a nice list, too. <br><a href="http://www.letterhead.com/bookshop/amazon/lettering1.html" target="_blank">http://www.letterhead.com/bookshop/amazon/lettering1.html</a> <br> <br>Two that I recently got on the cheap (~$4 each) and <br>would recommend: <br> <br>Lettering for Reproduction by David Gates <br>The Art of Hand Lettering by Helm Wotzkow <br> <br> <br>bj <br></p>'
