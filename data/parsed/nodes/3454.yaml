    date_raw: 13 Mar 2004 — 12:07am
    votes: null
    html: <p>You can control quite a few variables of the ScanFont autotrace parameters, so you can make those decisions yourself to some degree. <br> <br>Whether or not you even use the autotracing, the main thing I always liked about it is that it has great features for taking in all the scans, slicing and dicing them and populating them in the glyph backgrounds for FontLab. <br> <br>I have not used the latest version of ScanFont, so I am not completely up to date. I haven't really needed it in a long time, so I don't have an excuse to buy it (or get Adobe to buy it for me). For previous versions, I found the autotracing a little frustrating for high-res scans, but I expect a lot depends on the quality of the original sketch or sample. <br> <br>Regards, <br> <br>T</p>
