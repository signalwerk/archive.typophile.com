ork. The practice of writing forms is a fine way of getting your head around how letters come about. <br> <br>The tools I use are: technical pens, croquill pen, Winsor Newton Series 6 brushes (expensive, and are damaged by India ink, but you need to have good brushes) good quality India Ink, Opaque white designer's colour white or good white-out paint. <br> <br>Some prefer a perfectly smooth hot press board for a super clean line. I have always preferred a very slightly toothed board, because it gives me a little more control, and I like the feel of it.  <br> <br>Jim Rimmer  <br> <br></p>"
