    date_raw: 12 Mar 2004 — 11:47am
    votes: null
    html: <p>Addison <br> <br>I use IKARUS from URW. The system consists of a tablet, and a hand-piece, with which you hand digitize your outlines.  <br> <br>I don't know how widespread is the popularity or use of this program, but I am hearing that other systems are much more in favour. <br> <br>Whatever program you intend to use, I believe that you can start at the drawing board rather than the computer and then scan and/or paste in your outlines. <br> <br>I am ignorant of the workings of other than IK, and have only a passing knowledge of Fontographer, and none at all of the other ones available. <br> <br>I would seek more info before you commit. <br> <br>Jim Rimmer</p>
