  html: <p>I am a graphic designer that has interest in designing a typeface, however I felt I should learn  how to draw a typeface before going onto the computer.  I have found drawing to be initially difficult..recently I have found that if i draw with a heavy hand, the contours are easier to control.  Are there any suggestions on how to draw a typeface? any techiniques?  </p>
