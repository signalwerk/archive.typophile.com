    html: "<p>Frank <br> <br>drawing and writing; was it sayed that this will be important? *g* <br> <br>A key for me into Typedesign was also the history. <br>I'm not drawing many of my types. Almost a  few letter exist on Paper. Im working directly on the computer. I prefer FontLab for this. So learn to handle the BezierCurves. Maybe this is a option for you. <br> <br>Scanning and autotracing: YOu have tho clean many. If you have a grafic table than you can put your drawings on it setting the points with the pen. The scetch tool of FontLab could help you by this. <br> <br>Greetings Jens</p>"
