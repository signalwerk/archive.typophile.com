      <p>Noam, well said.</p>
      <p>It's hard for me to imagine that the antique-looking "tied" ligatures like 'ct' ever looked normal to readers, but I assume they did, since they were so widely used once.</p>
      <p>Ligatures that solve optical problems certainly are not (should not be) going out of style, and I do think that OpenType layout has enabled type designers to think beyond the standard f-ligatures and consider other optical problems which can be solved with ligatures. The notorious 'Th' ligature in Adobe Originals is one such example. Not everyone likes these new ligatures, but ultimately it's up to the designer to decide how their typeface will serve the reader.</p>
      <p>It's true that the standard f-ligatures get shoehorned into a font because of their presence in standard encodings. We (Adobe) eventually realized that some OpenType fonts in our library (particularly monospaced fonts) should have these ligatures off by default, because some look truly bad when they appear.</p>
