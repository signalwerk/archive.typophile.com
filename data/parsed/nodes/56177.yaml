      <p>Certain ligatures are certainly functional, others are more of an aesthetic/historical thing. In many fonts, the traditional Latin ligatures are functional. Looking at an old MS Word document set in Times, you'll see thye f clashing with the i and it's not very pretty. That said, there are many fonts where the f is designed in a way that it doesn't extend far enough to collide into the i, l, j or what have you. Often these fonts include ligatures anyway, which sometimes are inoffensive and other times look plain silly. Look at the Latin ligatures in Gill Sans or Futura for example...they end up drawing attention to themselves, which is exactly what an f-ligature is designed to avoid.</p>
      <p>Ligatures in display faces can serve many aesthetic purposes. Matthew Carter's Mantinia is a good example. It takes a lot of inspiration from inscriptional carvings which sometimes used ligatures as a space-saving device. </p>
      <p>A more recent use of ligatures can be found in handwriting and script fonts. Zapfino and Bickham Script make heavy use of ligatures and contextual alternates to combat the uniformity of type, giving the impression of hand-drawn calligraphy. Many handwriting fonts similarly will use ligatures to imitate the pen strokes of the source material.</p>
      <p>This is all, of course, relating to Latin typefaces. when you get into non-Latin scripts, ligatures are often an integral part of the writing system.</p>
      <p>—Noam</p>
