    html: <p>Ifyour looking for present day artist then I think the list will be fairly short. I think a good look at any typographic book will give you a long list of artists such as the cubists (Picaso and Braque), The futurists (Bella, Cara and Severini) most importantly Fillippo Tommaso ("words in freedom") Marinetti. Then look at modernists like, El lissitsky (who created 'of two squares' typographical "paintings"). Constructavists Alaxandr Rodchenko. De stijl and Dada Theo Van Doesberg. The Bauhaus, Kurt Schwitters, Moholy Nagy, Lissitski and other modernists like Piet Zwart and Vilmos Haszar. You may also find that looking at some of hte graphis typographic manuals will give you a better modern approach and na incling of some more artistic renditions. I used to love the work of an excellent japanese sculpture/designer who's sculptural brushed steel work I would class as art but his name has been lost to time... I think it was something like, Takanobu Igerashi? you've got me onto a subject I love, so I'll find out ond get back to you.</p>
