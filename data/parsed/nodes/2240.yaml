    html: "<p>Consider the role that lettering played in some of the work of Jasper Johns. He was using vernacular stencil letters, as opposed to designing an alphabet himself, but some of his large alphabet paintings are remarkable in their exploration of two-dimensional space. One example:<a href=\"http://www.popartuk.com/art/0-through-9-tsa961-print.asp\" target=\"_blank\">\"0 through 9\"</a>, maybe not the best; I can't find any images online of his large, alphabet canvases. <br> <br>Although not what you're specifically asking about, I suspect, you might also take a look at the work of <a href=\"http://www.creativepro.com/story/feature/16701.html\" target=\"_blank\">Jack Stauffacher</a>, a typographer and printer who has explored letterforms as pure shape in compositions that he creates using old wood types. <br> <br>Almost completely unrelated to your exporation, but worth mentioning as a tangent, Beatrice Riese created a series of marvelous abstract, all-over compositions in pencil, each named for a different typeface. One example: <a href=\"http://www.uwrf.edu/history/prints/women/beatriceriese.html\" target=\"_blank\">\"Syntax, Souvenir, Symbol\"</a> (a lo-res scan can't do justice to the work, unfortunately).</p>"
    html_clean: "<p>Consider the role that lettering played in some of the work of Jasper Johns. He was using vernacular stencil letters, as opposed to designing an alphabet himself, but some of his large alphabet paintings are remarkable in their exploration of two-dimensional space. One example:<a href=\"http://www.popartuk.com/art/0-through-9-tsa961-print.asp\" target=\"_blank\" class=\"link-external\">\"0 through 9\"</a>, maybe not the best; I can't find any images online of his large, alphabet canvases. <br> <br>Although not what you're specifically asking about, I suspect, you might also take a look at the work of <a href=\"http://www.creativepro.com/story/feature/16701.html\" target=\"_blank\" class=\"link-external\">Jack Stauffacher</a>, a typographer and printer who has explored letterforms as pure shape in compositions that he creates using old wood types. <br> <br>Almost completely unrelated to your exporation, but worth mentioning as a tangent, Beatrice Riese created a series of marvelous abstract, all-over compositions in pencil, each named for a different typeface. One example: <a href=\"http://www.uwrf.edu/history/prints/women/beatriceriese.html\" target=\"_blank\" class=\"link-external\">\"Syntax, Souvenir, Symbol\"</a> (a lo-res scan can't do justice to the work, unfortunately).</p>"
