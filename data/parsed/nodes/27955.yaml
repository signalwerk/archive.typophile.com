    <p>I recently discovered <a href="http://www.letterror.com/code/ttx/index.html" rel="nofollow">TTX</a>, an amazing open-source compiler/decompiler for TrueType and OpenType fonts.</p>
    <p>The <a href="http://sourceforge.net/projects/fonttools" rel="nofollow">SourceForge TTX site</a> provides ready-to-use Windows and Mac builds of the latest official release of TTX (2.0b1).</p>
    <p><a href="http://typophile.com/wiki/Adam%20Twardoch" rel="nofollow">Adam Twardoch</a> also hosts his own <a href="http://www.font.org/software/ttx/" rel="nofollow">TTX for Windows</a> page that provides builds of the latest bleeding-edge unreleased versions of TTX.</p>
    <p>Adam's page has not been updated since March 2005. There are newer development "snapshots" of TTX available (the most recent one is from February this year), but no ready-made builds to use.</p>
    <p>Not wanting to bother Adam, I decided to build it myself. It took quite a bit of fiddling to get the build scripts to work at all using all the updated build tools I used, but I was eventually able to get a build together.</p>
    <p>In case anyone wants to use it, I'm making it available for download:</p>
    <p><a href="http://members.cox.net/typophile/TTX_2.0b2_2006-02-23.085153.exe" rel="nofollow">TTX_2.0b2_2006-02-23.085153.exe</a></p>
    <p>(File size: 2,407,971 bytes; MD5: 94ce29217ccd69e90e3da0cbcd56e8a3.)</p>
    <p>This is a Windows installer, and should work on all recent versions of Windows. I'm providing it with no warranties express or implied, but I have tested it on multiple computers, and it seems to work fine.</p>
    <p>It was built and packaged using the following:</p>
    <ul>
    <li><a href="http://www.python.org/" rel="nofollow">Python 2.4.3</a>
    </li><li><a href="http://sourceforge.net/projects/numpy/" rel="nofollow">Numerical Python -- Numeric 24.2</a>
    </li><li><a href="http://www.py2exe.org/" rel="nofollow">py2exe 0.6.5</a>
    </li><li><a href="http://msdn.microsoft.com/visualc/vctoolkit2003/" rel="nofollow">Microsoft Visual C++ Toolkit 2003</a>
    </li><li><a href="http://www.microsoft.com/downloads/details.aspx?familyid=EBA0128F-A770-45F1-86F3-7AB010B398A3" rel="nofollow">Microsoft Windows Server 2003 SP1 Platform SDK</a>
    </li><li><a href="http://www.microsoft.com/downloads/details.aspx?FamilyId=9B3A2CA6-3647-4070-9F41-A333C6B9181D" rel="nofollow">Microsoft .NET Framework SDK 1.1</a>
    </li><li><a href="http://upx.sourceforge.net/" rel="nofollow">UPX 2.02</a>
    </li><li><a href="http://advsys.net/ken/utils.htm" rel="nofollow">Kzip (Aug 26 2006)</a>
    </li><li><a href="http://advsys.net/ken/utils.htm" rel="nofollow">ZIPMIX (Sep 29 2005)</a>
    </li><li><a href="http://www.chmaas.handshake.de/delphi/freeware/xvi32/xvi32.htm" rel="nofollow">XVI32 2.51</a>
    </li><li><a href="http://www.jrsoftware.org/isinfo.php" rel="nofollow">Inno Setup 5.1.7</a></li></ul>
    <p>Adam, if you happen to read this: I'd be more than happy to have you host this build on your site. Please feel free to go ahead if you want to.</p>
