      <p>Not a hijack at all, Carl. The only reason I put "Windows" in the thread title is that I didn't want to disappoint any Mac users who might come in thinking I had built something for them as well. (If I had a Mac, I would have, but alas, I don't.)</p>
      <p>I think it would be cool if you built a Mac version of the latest CVS snapshot. I don't think you'd have <em>too</em> much trouble; for the most part, the code worked for me right out of the box with the newer versions of Python and Numerical Python that I used. The only real snags I ran into were Windows-specific; they mostly revolved around getting py2exe to work with build scripts that had been designed for an older (and incompatible) version of py2exe.</p>
