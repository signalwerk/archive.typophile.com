      <p>Unfortunately the posted sample doesn't show enough letters to see how good either suggested match is. The middle arm of the E in Nick's font is short and the closed C and S are not much like many of the techno fonts, since this typeface dates back to the 30's.</p>
      <p>- Mike Yanega</p>
