      <p>It's pretty similar to <a href="http://new.myfonts.com/fonts/processtype/stratum2/" rel="nofollow">Stratum 2 Bold</a> with the R leg moved towards the stem. This squared sans look is becoming almost generic and (overly) popular, so this might even be a freebie font somewhere.</p>
      <p>- Mike Yanega</p>
