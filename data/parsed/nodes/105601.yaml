    html: <p>Looks like a bespoke monogram to me. For what it's worth, if I have to reproduce it, I'd start from any "<a class="freelinking external" href="http://www.myfonts.com/search/trajan" rel="nofollow">Trajan</a>-like" of my choice, remove crossbar and add a custom one based on /~. Then, I'd contruct the corresponding counterless background "sans".</p>
