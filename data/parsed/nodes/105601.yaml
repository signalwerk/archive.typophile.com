  html: |-
    <p>Used as the logo for 'Art and Architecture' a now extinct organisation in the UK. </p>
    <p> This is from their manifesto. Cover and Inside cover. Designed by Pentagram and first published in 1989.<br>
    A beautiful booklet, each page containing a large letter ‘A’ from different and obscure typefaces.<br>
    The society put the subject of collaboration on building sites between artists and architects on the political and economic agenda.</p>
    <p><a href="http://blog.8faces.com/post/3881246155/art-and-architecture-manifesto-inside-cover" title="http://blog.8faces.com/post/3881246155/art-and-architecture-manifesto-inside-cover">http://blog.8faces.com/post/3881246155/art-and-architecture-manifesto-in...</a></p>
