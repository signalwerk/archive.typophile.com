  html: |-
    <p>I’m looking for suggestions for a body copy typeface that saves space but doesn’t seem condensed, similar to Times New Roman, but not Times New Roman. </p>
    <p>Efficiency and legibility over long, dense content is paramount followed by versatility and lastly a feminine quality (not overly important).</p>
    <p>Thanks.</p>
