    html: <p>I like the 'butterfly as bow' idea, but the 'on the run' concept is diminished in your newer versions. What if the butterfly was alighting on the upper-left plane of the diamond (box)? So you'd see the 'bow' from the side rather than from above? It would add some action/dynamics to the logo which would conceptually compliment 'on the run' while maintaining the bow thing. You could also add the ribbon cross back on the box. The top-down view reminds me of pinned insects in a museum.</p>
