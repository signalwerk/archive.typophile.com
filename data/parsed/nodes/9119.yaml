    html: <p>It might just be me, but I don't think your latest designs say high-end gifts. Overall I get the sense of a quickie-mart. Perhaps because there's a local gas station chain called "on the run" and the rounded corner diamond box reminds me more of a traffic sign than a gift. I think Chris had some very interesting suggestions in his Feb 9th critique. The new placement of the butterfly could help emphasize the "gift emerging" concept that brought in the butterfly symbol in the first place. And I would also suggest looking at different type solutions. The type in your initial posting had a little more of a sophicated feel to it. The sans, although easy and clear to read, in it's current layout (justified, and loosely kerned) just seems stuck on. Would it be possible to intergrate the type and the mark?</p>
