    html: <p>I don't know about it being the easy or fast answer. The butterfly idea was chosen over several concepts that weren't shown here. The client liked the idea of the butterfly because it is like a gift, emerging from the cocoon, etc... It sounds like you are critiquing the second layout with the more "realistic" butterfly--I did redraw the butterfly in the last item in my post--I agree that the more realistic butterfly was too easy and much too complicated for a logo, but I think the colour version simplifies and enhances the concept. The wings of the butterfly become bows on the box. <br> <br>I'm open to criticism on this, but I'm not sure I understand where you are coming from. Thanks.</p>
