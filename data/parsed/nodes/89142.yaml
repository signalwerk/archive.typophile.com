      <p>Federal is impressive, although of course it is not necessarily the same kind of study that we're trying to do here.</p>
      <p>Right now VALUCO is within a standard em square, although I am wondering if I need to expand that or attempt to reduce the quantity of hatching within our shadow. The letterform is admittedly "ultra-display" and only really effective after 72 pt.</p>
      <p>In process…</p>
