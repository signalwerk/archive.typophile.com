    html: |-
      <p>It’s easy to be skeptical about Kickstarter if one just looks at the merits of a typeface proposal, vis-a-vis what is already available.</p>
      <p>However, Kickstarter is a way for customers to become involved with a type designer's studio/foundry, especially through custom and short-run specimens, and even in some cases with sponsor-initiated design features.</p>
      <p>How a Kickstarter typeface proposal fares likely has a lot to do with how well the proposal is presented, and how effectively the various sponsor benefits are configured.</p>
    html_clean: |-
