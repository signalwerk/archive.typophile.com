    date: 2012-01-19T12:08:00
    date_raw: 19 Jan 2012 — 12:08pm
    votes: null
    html: <p>Oh, yeah. We're aware of Detroit as well as M&amp;K's equally accomplished Prismatic. What I  hope makes this face original in it's own right is that we are coming at it from the perspective of printmakers (screenprinters, speficically.) So by including actual hatching into the face we are attempting to pull off just as successful a bevel in this face with two colors whereas others require three or more. We have most DEFINITELY come at typography from a weird direction, beginning with screenprinted artwork and then attempting a font design from that. But I like to think that (in addition to Nick's assessment of Kickstarter) the site is also somewhat of an incubator for attempts at new ideas and uncharted territory, which is definitely what we are up to here.</p>
