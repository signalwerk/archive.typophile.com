    <p>Hey, All.<br>
    I run a design and printmaking studio in Minneapolis called Aesthetic Apparatus and we've just launched a Kickstarter campaign that I thought (hope) most some of you may find interest in. We are attempting to reconstruct a beveled typeface that we created for a side project into a working overlapping digital font.</p>
    <p>Here's the typographic-money-pleading below:<br>
    <a href="http://www.kickstarter.com/projects/2049768676/valuco-font-design" title="http://www.kickstarter.com/projects/2049768676/valuco-font-design">http://www.kickstarter.com/projects/2049768676/valuco-font-design</a></p>
    <p>And a big ol' sample image:<br>
    <img src="http://www.aestheticapparatus.com/SALE%21.jpg" alt="VALUCO" width="500" height="423"></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/VALUCO-sm_3652.jpg"></div><p></p>
    <p>Thanks!</p>
    <p>-Dan Ibarra<br>
    Aesthetic Apparatus</p>
