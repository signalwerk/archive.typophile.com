  - id: 358064
    user: 29994
    date: 2009-07-25T17:20:00
    date_raw: 25 Jul 2009 — 5:20pm
    votes: null
    html: |-
      <p>"Italic angle" is the exact value that the font file contains for "ItalicAngle". However, the Font Matrix in the file is what the renderer should use to transform each character, and that value may differ (a bit) from the Italic angle. This value is what FL calls its 'Slant' -- and notes it's only useful for Type 1.</p>
      <p>The value for ItalicAngle should be in degrees, rotating RIGHT for a positive number (although the Slant is (apparently) <em>negative</em>, and changing it changes the ItalicAngle sign as well ...).</p>
