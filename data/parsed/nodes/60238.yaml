    <p>I have the feeling the answer to this may be over my head technically, but here goes…<br>
    Some Adobe fonts like as in the old Laserwriter 35 collection have oblique versions rather than Italic. My first reaction is to imagine fake italics. So I opened up Avant Garde Oblique in Fontlab and find the letters are perfectly upright and the Italic box is even unchecked. Yet if you open the suite in Font Book or view it in any application, the obliques are slanted. Where and how is this accomplished?</p>
