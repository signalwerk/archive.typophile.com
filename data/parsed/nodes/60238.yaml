      <p>Hmm ... seems that FontLab can't read the value from a font, but it works. Try entering a value into "slant angle" of an upright font, generate and test ...</p>
      <p>“Copy Slant angle to Italic angle” just means that when the generated font is artificially slanted, this should be reflected in the Italic Angle property of the font.</p>
