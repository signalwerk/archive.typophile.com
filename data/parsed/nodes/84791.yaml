    html: |-
      <p>It's not Bodoni Poster. That's what I had originally thought it was but the 7 is different as well as the letters. It's very close but that's why I came here, to get the definitive answer on what it is. The serifs seem to extend up and out a little further than the Bodoni Poster font. The front of the 7 also is more straight up-and-down than the Bodoni version.</p>
      <p>Any other suggestions?</p>
      <p><strong>EDIT:</strong> Nevermind. It's Carousel OT, by Elsner+Flake.</p>
      <p><a href="http://www.fontshop.com/fonts/singles/elsnerflake/carousel_ot/" title="http://www.fontshop.com/fonts/singles/elsnerflake/carousel_ot/">http://www.fontshop.com/fonts/singles/elsnerflake/carousel_ot/</a></p>
