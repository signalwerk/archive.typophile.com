    html: "<p>Richard: <br>But Union is responsible to its designers. If even one of them has a problem with the preview ability on MyFonts (even if I for one think it's great), then there's a mismatch between one agreement and another (in this case subsequent) one. It's really just a matter of miscommunicating details, so nobody should feel outraged. But if a given font designer can point to an original agreement that prevents previewing (or even if he can show he was tricked into a preview allowance) then the preview needs to be pulled, one way or another. <br> <br>On the other hand, forbidding plain <i>linking</i> (or even static renderings from legally-owned fonts) is not viable. <br> <br>Jim: <br>If your site just says Emigre fonts exist (like MyFonts does with Adobe for example) then it's just dandy. <br> <br>hhp <br></p>"
