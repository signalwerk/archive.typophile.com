    html: <p>If you click through, they are selling the Indie Fonts book, which contains the font, not the font all by itself, so technically they don't appear to have done anything illegal with regards to licence agreements <br> <br>You're right, it is cheeky. <br>And it is misleading, because it infers that the price of the font is $39.95, and some people who don't click through will assume this is the case, and that MyFonts distributes Union Fonts. <br> <br>I wouldn't say it was shocking, rather that they have tried to do some clever marketing but outsmarted themselves. Also, it was easier to use their standard format, rather than prepare a special piece of artwork. I'm sure if you ask them, they will do the right thing -- either de-list the font, or prepare the special file that explains that the font is available bundled with Indie Fonts. <br> <br>On the upside, if MyFonts customers do "buy" HotMetal as part of IndieFonts, they also get to see all the other Union Fonts specimens in the book.</p>
