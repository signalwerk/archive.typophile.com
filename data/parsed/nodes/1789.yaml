    html: <p>This is an interesting issue. As the buck stops here guy with Indie Fonts, I would like to chime in. I think partially due to my personal admiration of how MyFonts has treated us, I made a decision to allow MyFonts to distribute the Indie fonts books. The entire Indie Fonts project was intended as co-operative distribution vehicle. The individual showings of each font from the Indie Fonts CDs are simply specific details from the book. The purchaser is getting the same end product (a book and a CD) as if they bought it in a Barnes and Noble. There is no download of the Indie fonts on Myfonts or anywhere else. MyFonts is one of the many places people can buy Indie Fonts. I never imagined that anyone would have a problem getting more exposure for their foundry and type designs. Our agreement with each foundry was very basic yet very much concerned with promoting the foundries and not dictating how they distribute their fonts. One of the many goals of the Indie Fonts books was to facilitate exposure of the participants fonts to people who might not otherwise see them. I did not see the need to get permission from the 35 foundries included in the 2 books and dreaded the idea of another group emailing that only half of the participants would respond to. Yes it is  a bit odd to see the price of the end product when you are looking at the detail (see the P22 extras sampler on MyFonts and it's bargain price). Unfair competition?...I don�t see this as the case at all. Do you think having the Union fonts name popping up on Amazon would be a bad thing?  <br>RK</p>
