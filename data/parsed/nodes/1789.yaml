    html: <p>MyFonts is a major distributor of mine, and like many foundries who were left in the lurch when Makambo folded, where would I be without them?  <br> <br>Sure, I'm critical of them occasionally  -- they are always trying new stuff and don't always get it exactly right first time. And as a major presence that aspires to be an industry resource, rather more than just another distributor, they should expect a little more heat. <br> <br>In their defence, Jim, sure it could be mistakenly construed that they are a Union distributor, but they have taken immediate steps to lessen that impression, and they also have a link to your site -- something that other distributors (eg Fonts.com, FontShop, Veer) do not provide online, even for their bona fide suppliers! <br> <br>Next up Laurence, can you fix the code so that it doesn't create grammar like "an Union font" or "contains one fonts"?  ;-) <br> <br> <br> <br> <br> <br></p>
