    html: "<p>&gt;<i>If Coke put Pepsi in the meta tags on there</i> <br>&gt;<i>website, would that be unfair competition...</i> <br> <br>In fact, this issue of meta tag usage has been cause for legal action in some cases. <br> <br>Search Engine Watch: Meta Tag Lawsuits <br> <a href=\"http://searchenginewatch.com/resources/print.php/34791_2156551\" target=\"_blank\">http://searchenginewatch.com/resources/print.php/34791_2156551</a> <br> <br>I personally have no issue with sites mentioning or linking to products they don't normally represent, providing they are displaying accurate contact information for the owner or foundry in question and that proper copyright or trademark attributions are in place.</p>"
