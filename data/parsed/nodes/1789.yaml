    html: "<p>I also need to chime in here. I wanted to add to what Richard says about how we have been marketing the Indie Fonts books at MyFonts. <br> <br>Internally, we realized that while some customers will be turned on by the books, others will be more so by the accompanying CD. The disks themselves, each containing dozens of fonts, will certainly appear as great value to many customers - as long as they can examine the fonts. (Although the CD is not much marketed by others selling Indie Fonts, this was no reason to avoid such marketing. Those of you who saw last week's newsletter will have seen this is exactly how we marketed it to our customers.) <br> <br>To reply to Nick (\"it was easier to use their standard format, rather than prepare a special piece of artwork\"), I have to say I don't see the problem - if we have a technology that displays fonts in a manner that allows comparisons, then why would we not use it? Custom artwork and texts too, if there's time &amp; resources: so we added several photos of the books, wrote articles about the books from scratch, and posted links to reviews and more pictures. <br> <br>Having said all that, I realize we were probably remiss in not checking it was acceptable for customers to use Test Drive on all these fonts: we're now checking to see with the relevant foundries which preview mode they would like to use on their fonts. Also, in response to those who note that our presentation seemed to imply MyFonts had a direct relationship with certain foundries, we just added a paragraph to clarify sources: e.g. \"MyFonts.com sells HOTMETAL by agreement with P-Type Publications\". Ralph notes this is still not ideal - we are working with Rich Kegler on this wording, and the mentions of font price. <br> <br>Some miscellaneous corrections from earlier in this thread. Yes, we do have a contract with Emigre to sell their fonts. To recorrect Hrant's self-correction, we *are* offering a font from Union Fonts (not for download), thanks to its presence on IF2 and our contract with P-Type. No, we don't sell Adobe fonts directly, but sell many Adobe fonts thanks to our contract with Linotype. <br> <br>BTW please contact me at lorp _at_ myfonts.com if you want to write directly, or foundrysupport _at_ myfonts.com for the whole team.</p>"
    html_clean: "<p>I also need to chime in here. I wanted to add to what Richard says about how we have been marketing the Indie Fonts books at MyFonts. <br> <br>Internally, we realized that while some customers will be turned on by the books, others will be more so by the accompanying CD. The disks themselves, each containing dozens of fonts, will certainly appear as great value to many customers - as long as they can examine the fonts. (Although the CD is not much marketed by others selling Indie Fonts, this was no reason to avoid such marketing. Those of you who saw last week's newsletter will have seen this is exactly how we marketed it to our customers.) <br> <br>To reply to Nick (\"it was easier to use their standard format, rather than prepare a special piece of artwork\"), I have to say I don't see the problem - if we have a technology that displays fonts in a manner that allows comparisons, then why would we not use it? Custom artwork and texts too, if there's time &amp; resources: so we added several photos of the books, wrote articles about the books from scratch, and posted links to reviews and more pictures. <br> <br>Having said all that, I realize we were probably remiss in not checking it was acceptable for customers to use Test Drive on all these fonts: we're now checking to see with the relevant foundries which preview mode they would like to use on their fonts. Also, in response to those who note that our presentation seemed to imply MyFonts had a direct relationship with certain foundries, we just added a paragraph to clarify sources: e.g. \"MyFonts.com sells HOTMETAL by agreement with P-Type Publications\". Ralph notes this is still not ideal - we are working with Rich Kegler on this wording, and the mentions of font price. <br> <br>Some miscellaneous corrections from earlier in this thread. Yes, we do have a contract with Emigre to sell their fonts. To recorrect Hrant's self-correction, we *are* offering a font from Union Fonts (not for download), thanks to its presence on IF2 and our contract with P-Type. No, we don't sell Adobe fonts directly, but sell many Adobe fonts thanks to our contract with Linotype. <br> <br>BTW please contact me at lorp _at_ myfonts.com if you want to write directly, or foundrysupport _at_ myfonts.com for the whole team.</p>"
