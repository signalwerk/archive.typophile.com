    <p>Hello all! I'm pulling my hair out because my client at one division of Fox won't just put me in touch with the design house that created the title treatment attached or seen here: <a class="freelinking external" href="http://fox.com/dontforget/" rel="nofollow">http://fox.com/dontforget/</a> and I need to ID the font. I KNOW I probably have it but after going through my entire FontExplorer X library one by one (over 3000+) and using Identifont, I'm no closer to having a match.</p>
    <p>It's not Droid <a class="freelinking external" href="http://www.1001fonts.com/font_details.html?font_id=1065" rel="nofollow">http://www.1001fonts.com/font_details.html?font_id=1065</a> and it's not SF Eccentric Opus <a class="freelinking external" href="http://www.abstractfonts.com/font/8696" rel="nofollow">http://www.abstractfonts.com/font/8696</a> — but I am fairly certain this is a common-ish font, right? Must be.</p>
    <p>Any ideas? I've got my fingers crossed that you smarties will come to my rescue again. As usual many, many thanks in advance! I'll owe you a Coke™!</p>
    <p>p.s. Don't yell at me for knowing the cheap-o knock-off fonts right off the bat! I have many thousands of dollars worth of legit, licensed and paid-for fonts!!  ; )</p>
