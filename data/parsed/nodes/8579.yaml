    html: <p>This looks hand-drawn to me. There are some irregularities to the curves, etc. Where is it from?</p>
    html_clean: <p>This looks hand-drawn to me. There are some irregularities to the curves, etc. Where is it from?</p>
  - id: 56609
    user: null
    date: null
    date_raw: null
    votes: null
    html: <p>It's from a calendar I picked up at Value Village (a thrift store). The typeface doesn't appear anywhere else in the calendar. I figured it was custom (the "A"s look like Futura with extended legs), but wanted to see if anyone recognised it as a real font. <br> <br> - Lex</p>
    html_clean: <p>It's from a calendar I picked up at Value Village (a thrift store). The typeface doesn't appear anywhere else in the calendar. I figured it was custom (the "A"s look like Futura with extended legs), but wanted to see if anyone recognised it as a real font. <br> <br> - Lex</p>
  - id: 56610
    user: null
    date: null
    date_raw: null
    votes: null
    html: <p>I agree with Patricia, at least to the point that I think it is customized. I could easily make this with <a href="http://www.myfonts.com/fonts/urw/bernhard-gothic/urw-t-light/testdrive.html?s=CALEUDAR&amp;p=48" target="_blank">Bernhard Gothic Light</a>, but using the O to make the C, flipping the U upside-down to make the N, and also flipping the E to make it high-waisted. I think I could slide up the A crossbar with the letter in outline form, and there I would have it.</p>
