  html: "<p>Breaking the Rules in Typography  <br>CALL FOR ENTRIES <br> <br>Deadline: Aug. 16, 2002 <br>Entry form: <a href=\"http://www.howdesign.com/typographybook.pdf\" target=\"_top\">http://www.howdesign.com/typographybook.pdf</a> <br> <br>At last year's HOW Design Conference in San Francisco, type guru Allan Haley delivered a lively presentation titled \"Bombshell Typography: How the Best and Brightest Break the Rules.\" In it, he took basic cannons of typography and provided examples of how the rules were broken, not only successfully, but elegantly. As a result of the positive feedback from this presentation, HOW Design Books has asked Mr. Haley to enlarge it into an equally educational and inspirational book.  <br> <br>This is where you come in. We're looking for examples of great typographic design that breaks the rules. If you've designed something within the last year that breaks one or more of the rules of typography</p>"
  html_clean: "<p>Breaking the Rules in Typography  <br>CALL FOR ENTRIES <br> <br>Deadline: Aug. 16, 2002 <br>Entry form: <a href=\"http://www.howdesign.com/typographybook.pdf\" target=\"_top\" class=\"link-external\">http://www.howdesign.com/typographybook.pdf</a> <br> <br>At last year's HOW Design Conference in San Francisco, type guru Allan Haley delivered a lively presentation titled \"Bombshell Typography: How the Best and Brightest Break the Rules.\" In it, he took basic cannons of typography and provided examples of how the rules were broken, not only successfully, but elegantly. As a result of the positive feedback from this presentation, HOW Design Books has asked Mr. Haley to enlarge it into an equally educational and inspirational book.  <br> <br>This is where you come in. We're looking for examples of great typographic design that breaks the rules. If you've designed something within the last year that breaks one or more of the rules of typography</p>"
