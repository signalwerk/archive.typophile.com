    html: |-
      <p>There are two criteria to sort glyphs in ID panel: by Unicode and by index. This is chosen in the panel menu. You don't have control over Unicode sorting as ID simply follows the sequence of codepoints. But for index sorting ID would show exactly the order you defined in FontLab.</p>
      <p>For index sorting, you must set FontLab maping mode to use "Glyph Index" and then freely drag-n-drop glyphs to define the desired order:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/sample-fl_3417.gif"></div><p></p>
      <p><em>FontLab maping mode menu in font window.</em></p>
      <p>InDesign let you set the order criteria in the panel menu (this sample is in Portuguese, but the menu order is the same in all languages):</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/sample-id_5072.gif"></div><p></p>
      <p><em>InDesign sorting mode in Glyph panel.</em></p>
      <p>If you don't see the same order in FL and ID for your font, test how ID exhibits glyphs from other fonts to identify if the problem come from it.</p>
    html_clean: |-
