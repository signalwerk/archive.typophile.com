  html: |-
    <p>Hello,</p>
    <p>does anybody knows how fontlab have to sort the glyphs that they will be show correct in Indesign or Illustrator.</p>
    <p>If I generate the Font and open it in Indesign and look at the Indesign glyph palette there is just chaos (f.e. you see one after another C, c.sc., cdot.sc, c, cdot etc). I like to change the order, maybe capital-group, smallcap-group, figures and so on.</p>
    <p>I hope somebody comprehend.</p>
    <p>thanks</p>
    <p>ot</p>
