    html: |-
      <p>It's the glyph index number in your own font.</p>
      <p>I re-sorted my own phonetics set, putting all 'a' variants together, then all 'b' variants, etc. (And the upside down 'v' is not in my 'a' section, where it belongs -- phonetically, that is -- but it's in my 'v' section because I sorted by eye.)<br>
      That way I can set the Glyph panel sorting to Unicode if I know the code to insert, or to Glyph Index if I don't have a clue and must hunt by eye.</p>
