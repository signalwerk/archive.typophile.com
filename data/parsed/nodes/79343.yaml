      <p><cite>If you don't see the same order in FL and ID for your font, test how ID exhibits glyphs from other fonts to identify if the problem come from it.</cite></p>
      <p>Igor, I'm quite sure the CID/GID (Character ID/Glyph ID) order is the exact order in the font file. If there is a discrepancy with FontLab, it's the latter that's wrong :-) (there are a lot of sorting options in FontLab, you'll have to find the 'don't sort at all' one).</p>
