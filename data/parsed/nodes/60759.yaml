  html: <p>As a student, I have been searching for a serif and a sans-serif to use together for my personal collateral. I have been using Univers 45 Light for the sans-serif and have tried in vain to pair it well with a serif. I think I may have found a harmonious match in Sabon. I need some other opinions on this though, so I'm posting the two together for comments. Thanks everyone! -Cory</p><div class="imageWrap"><img src="http://typophile.com/files/New_5431.jpg"></div><p></p>
