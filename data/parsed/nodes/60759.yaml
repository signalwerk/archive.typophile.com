      <p><cite>I have been searching for a serif and a sans-serif to use together . . . I have been using Univers 45 Light for the sans-serif and have tried in vain to pair it well with a serif. I think I may have found a harmonious match in Sabon. . . .</cite></p>
      <p>As a graphic design student, you know that it is more than font selection that lets you arrive at the proper mix of harmony and tension. (Don't forget the tension -- without it, all you have is bland.)</p>
      <p>You can make Universe 45 Light work with Sabon in a book, where the text is, say, 10-point, and Univers is used for chapter titles, say 20-point. Now, how are you going to make the subheads work -- subheads being roughly the same size as the text? Probably, you're going to have to use Sabon.</p>
      <p>The other point I'd make is unless you're going to be a web designer, where I imagine you can't control much of the space, "harmony" will be as much a factor of the white space as type. That, of course, doesn't show with your sample; there is no top, bottom, left, right -- no trim.</p>
