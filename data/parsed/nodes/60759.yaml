      <p><cite>"The whole point of modernism is to go beyond a time or context."</cite><br>
      How idealistic. :-)<br>
      I'd think that Modernism, like all eras, like all work ever created, exists within linear time, is rooted in it, and can't transgress it – however much you might like this particular stylistic device to work as well today as back then, it is going to be perceived by at least some initiated minds as taking recourse to a model from a different era. </p>
      <p>Sure, you can say screw them, they just don't understand that in my world, Modernism is still Valid today.<br>
      But on the other hand: You're working today.<br>
      Why copy recipes that have grown dusty?</p>
