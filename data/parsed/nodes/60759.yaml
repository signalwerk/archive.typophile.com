      <p><cite>"you haven’t seen my work yet"</cite><br>
      That's true. For the record, I'm playing Devil's advocate – trying to push you to see things from a different perspective, and ask deeper questions about what it is you're trying to do.</p>
      <p><cite>"What would your advice be?"</cite><br>
      Find your own graphic "instincts"; don't define yourself so much in relation to what others do / have done. There isn't just one correct way to solve a given design problem. But if you believe others have already found the Holy Grail, of course there's no need to go on searching.</p>
