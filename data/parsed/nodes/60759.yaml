    html: |-
      <p>Thanks for your responses everyone, I really appreciate it.</p>
      <p>@plainclothes: My case for modernism is one of durability and accessibility. I want to save the real type exploration for my client and/or personal work. This way the collateral has the feeling of being open to anything, and is timeless. </p>
      <p>Typography from years past looks dated only when it is ornamental or "cool" at the time it was created. I want something built to last.</p>
      <p>@Begsini: I consider brands to be reserved for companies, organizations, studios, products, festivals etc. Individual designers needing brands? I am not convinced that is necessary or even helpful. I am more focused on the work I can do for clients or specific projects, and wanting that to be what I am known for. If my dreams come true and I get to open my own design firm, then it may be branded. Especially being a student, it's all about my portfolio at this point.</p>
      <p>I do not think that Rand and Vignelli's type was part of their brands. I don't think they had brands at all, or maybe Vignelli's red type is branded a little more than Rand. But it's their work that when you look at you say "That must be Paul Rand", not their letterhead or business card. While Rand's collateral was modernist, some of his work makes you feel like you're at the circus! </p>
      <p>And what is the purpose of a brand? To identify, convey feelings/values and be noticed. When I hand out my business card, which has 8pt black Univers on a yellow background (maybe a brand color eventually, but now just for contrast), People usually say "wow" because they are not used to the modernist approach. This way I stand out. My lack of trying to wow people creates interest because they are used to the opposite in this beveled/embossed/shiny/widget bullshit era.  </p>
      <p>It is not my goal to be generic or ubiquitous, it is my goal however, to someday establish myself and my work as accessible and capable of taking<br>
      on any design problem.</p>
