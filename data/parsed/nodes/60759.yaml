      <p><cite>I have been searching for a serif and a sans-serif to use together for my personal collateral. I have been using Univers 45 Light for the sans-serif... I think I may have found a harmonious match in Sabon.</cite></p>
      <p><strong>dear cory.lasser,</strong></p>
      <p>The problem of combining type is normally posed when setting extended text, as in the typesetting of a book, where the serifed face will serve the basic text, and a sans-serif the notes and other marginalia. Here we should not be surprised that harmony is the desired effect.</p>
      <p><strong>Let us turn the microphone to Bringhurst (§6.5.5):</strong></p>
      <p><cite>Pair serifed and unserifed faces on the basis of their inner structure</cite></p>
      <p>Pay attention to particular letter forms, such the lower-case g (one story or two?). Compare both the roman and italics of both faces (very important). Read up on the faces to see if you can discern a common ancestry. You should quickly conclude that Univers and Sabon fail many of these tests.</p>
      <p>The bard himself goes on to recommend pairing Sabon (a Renaissance face designed by Jan Tschichold) with Hans Eduard Meier's <a class="freelinking external" href="http://new.myfonts.com/fonts/adobe/syntax/" rel="nofollow">Syntax</a>.</p>
      <p>If you want to look further afield for the sake of ``design'' (or because you are not typesetting a book), you might fancy Martin Majoor's <a class="freelinking external" href="http://new.myfonts.com/fonts/fontfont/ff-scala-sans/" rel="nofollow">Scala Sans</a> or even his <a class="freelinking external" href="http://new.myfonts.com/fonts/fontfont/seria-sans/" rel="nofollow">Seria Sans</a>, two faces that themselves have a serifed pair that you might consider in lieu of Sabon.</p>
      <p>Univers has little to recommend it in this game, but if you admire the work of its designer (Adrian Frutiger), Bringhurst recommends marrying <a class="freelinking external" href="http://new.myfonts.com/fonts/linotype/meridien/" rel="nofollow">Méridien</a> with the eponymous <a class="freelinking external" href="http://new.myfonts.com/fonts/adobe/frutiger/" rel="nofollow">Frutiger</a>.</p>
      <p><strong>Of course, I won't discount the chance that you are pairing two different typefaces in order to make a ``statement.''</strong> This can be done, but you should be very clear about what the statement is.</p>
      <p>EXHIBIT A: Khoi Vinh's T-shirt combining Helvetica and Fette Fraktur. (Later reprised via American Apparel):</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/060913_hel_fucking_vetica_3621.gif"></div><p></p>
