      <p>Thanks all, I forgot to mention the sample was not for actual use, just showing the two side by side… </p>
      <p>@charles_e: Good point on the white space, I was more focused on how the letterforms were playing with each other, but of course this depends greatly on context!</p>
      <p>@Nick Shinn: I actually have no nostaligic or other personal attachments to any one typeface. All situations call for their own solutions, but it is nice for a designer to be able to have certain type to use on their collateral. </p>
      <p>Unfortunately "contemporary" doesn't mesh with my dedication to modernism. I'm trying to find a type combination I can use until I die, not until the end of next semester. Also, the idea of a designer having "personality" to their collateral or to have a logo makes no sense to me because one designer is not a company. Why should one person brand themselves? It's your work that should really stand out.</p>
      <p>Take a look at the collateral of Massimo Vignelli and Paul Rand (see below): designers whose personal use of type on collateral reflected the "crystal goblet" approach to type: it's the information that is important, not the type itself.</p><div class="imageWrap"><img src="http://typophile.com/files/rand_4279.jpg"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/massimo-1_4996.jpg"></div><p></p>
      <p>"A new typeface is ideal for the neophyte who is intent on one-upmanship, and who equates the latest with the greatest…Although newness has its place, good design is not merely a question of novelty. The typographer is more important than the type he uses. You can’t blame the type if the typography is poor. It’s like putting the burden on the music when the musician is at fault." -Paul Rand</p>
