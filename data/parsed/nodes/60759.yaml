      <p><cite>"This way the collateral has the feeling of being open to anything, and is timeless"<br>
      </cite><br>
      But timeless it exactly isn't – it's modernist nostalgia.</p>
      <p>Modernism isn't an abstract, floating concept – it's anchored in design history, and its era is over. If you do the same thing today that worked for Paul Rand &amp; Co. back in the day, it <em>can't</em> work that way anymore. The context has shifted.</p>
      <p>Now if you were to explore how to make something that looks "neutral" <em>today</em>, that would be interesting! But "neutral" can't look the same today as it did decades ago. If you want to preserve the spirit of modernism, work to preserve the idea, not the form.</p>
