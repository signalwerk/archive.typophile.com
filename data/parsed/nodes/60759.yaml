      <p>Thanks for the comments everyone!</p>
      <p>@altaira: The whole point of modernism is to go beyond a time or context. It is not about nostalgia for any one period or time. Rand &amp; Vignelli are just good examples. It doesn't matter when they were around, it matters what they did!</p>
      <p>As soon as you design within a time's context, whether you are going with it or against it, you are hurting your chances at creating timeless work. </p>
      <p>Yes, the context has shifted, but it will always continue to do so. Do you want to be stuck in yesterday's context, or create something beyond context which will last?</p>
      <p>Compare the 17,000 year old paintings in Lascaux (beyond context) to "post-modern" graphic design of the 1980's and 1990's. Which looks more dated? </p>
      <p>@paragraph: I appreciate your concern, but I would think it is more important to save the real experimentation, learning &amp; growth for actual work in my portfolio, not my business cards, which was the subject of the original post. What do you think?</p>
