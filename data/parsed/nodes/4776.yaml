    date_raw: null
    votes: null
    html: <p>There is also a book store called Minotaurus (Sint-Antoniestraat), I didn't have the chance to go when i was there three weeks ago, they're closed on mondays, and open late on tuesdays, but it is a store dedicated to typography. There's a poster collectiona at Nijhof &amp; Lee? Missed it, but my wallet thanks me for it.</p>
