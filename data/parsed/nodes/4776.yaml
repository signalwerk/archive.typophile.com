    html: "<p>&lt;font class=\"dontLookLikeCrap\"&gt;I live in Amsterdam and strongly recomend going to KOK a *huge* second hand book store. The list of typographic material is really big there and the prices much cheaper than N&amp;L and Minotaurus (It's OK to go there, of course, but sometimes in KOK you have the same material for half price). <br>KOK is in the very downtown and close to Minotaurus. <br> <br>Check the material and the prices there: <a href=\"http://www.nvva.nl/kok/typografie.htm\" target=\"_blank\">http://www.nvva.nl/kok/typografie.htm</a> <br> <br>BTW, If your student want to visit the KABK or to have a little type-chat with a KABK's student, he can contact me to my mail: <a href=\"mailto:jazz@futurezone.com\">jazz@futurezone.com</a> <br> <br>&lt;/font&gt;</p>"
