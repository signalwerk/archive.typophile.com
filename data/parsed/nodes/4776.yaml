    html: <p>Nijhof &amp; Lee in Amsterdam is a fantastic book store with a great collection of typography books. I also recommend their poster collection. <br> <br><a href="http://www.nijhoflee.nl/design/typography/" target="_blank">http://www.nijhoflee.nl/design/typography/</a> <br> <br> <br> <br>Zara</p>
