    <p>Good afternoon Ladies and Gentleman,</p>
    <p>I work on a Golf magazine here in the UK, imaginatively entitled ’Golf Pages’, and we are currently redesigning the Logo (and most of the magazine). </p>
    <p>The old logo was in ITC esprit, and a little tired. However, the new logo suggested by the creative director is in Alba, and looks a little too-cool-for-school. </p>
    <p>We’re trying not to alienate the traditionally older audience (or the PGA who officially sponsor the magazine) but also to give the logo a bit of life to it and make it a little less stuffy. I was thinking of a modern looking serif rather than sans, as i feel it suits golf a little more.</p>
    <p>However...the company wants to use a font we already own (in other words they’re tight) and I don’t think any of those we own are right, so I might buy one myself if its about £20-30. </p>
    <p>anyway here are the old and prospective new logos. </p>
    <p>Any advice or suggestions would be most welcome.</p>
    <p></p><div class="imageWrap"><img src="/files/GOLFpages_LogoOld_4554.png"></div><p></p>
    <p></p><div class="imageWrap"><img src="/files/GOLFPAGESLOGO_5353.png"></div><p></p>
    <p>Many thanks, </p>
    <p>Graham</p>
