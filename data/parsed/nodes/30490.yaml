      <p>I agree that you should go with a fresher-feeling logo to alleviate the potential for stuffiness. However, I’m not crazy with the current revision. It does seem a bit self-consciously modern, which I’m not sure is ideal for your magazine. Also, the combination of the L and F seems awkward, as if the L is stunted, and it creates an odd shape that looks like a U with a big top serif that distracts.</p>
      <p>My suggestion would be some sort of slab serif — different from the norm, and the big serifs remind me mildly of clubs. I’d go with a modern interpretation, along the lines of PMN Caecilia. My favorite after a quick search is Freight Micro, but it’s out of your price range. For a logo, though, most would recommend that you do something custom, or at least tweak a font significantly.</p>
