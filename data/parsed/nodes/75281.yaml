    <p>Hi guys,</p>
    <p>I'm looking for serif typefaces that are inspired by or share some similarities with Baskerville. Different versions of Baskerville would be good as well, but I'm more interested in fonts that have their own character and personality, as subtle as that may be, but are definitely inspired or derived from Baskerville's shape and proportion.</p>
    <p><a class="freelinking external" href="http://www.emigre.com/EF.php?fid=109" rel="nofollow">Mrs Eaves</a> is a good one as it is consciously adapting aspects of Baskerville, are there any more that go through this process?</p>
    <p>Many thanks.</p>
    <p>Jordan</p>
  html_clean: |-
