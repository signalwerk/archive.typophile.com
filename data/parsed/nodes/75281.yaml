      <p><em>There is a hell of a way from transitionals to moderns.</em></p>
      <p>Inspiration does not necessarily produce similarity, as Jordan notes, and that is what particularly interests him.</p>
      <p>JB's dramatic innovations (smoother paper, blacker ink, type of greater contrast) were taken a step further by the Moderns -- this was recognized at the time and subsequently.</p>
      <p>However, although I have frequently seen it written that Bodoni admired Baskerville, I wonder if there is an actual quote from him to this effect, or whether it is an inference by historians to justify the "transitional" theory, and the narrative line of causality that is conventional wisdom. Even if he had purchased works printed with Baskerville's types, does that mean they inspired him to adopt similar tropes, or was he merely studying the competition, with the goal of emulating its success?</p>
      <p>After all, I have acquired a lot of type specimens, many of fonts that, if I consider them at all,  "inspire" me to avoid anything remotely similar.</p>
