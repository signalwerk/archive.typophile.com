    html: |-
      <p><em>According to Lawson, Bodoni’s trip to England was a trip to Birmingham to meet Baskerville.</em> </p>
      <p>If Lawson had any reason to write that he did not give it. Updike said that after the suicide of Ruggeri, his particular friend and patron, and director of the foreign-language printing office of the Propaganda Fide (not the Vatican), ‘Bodoni, unable to endure further employment at Rome, left the Press with the idea of seeking his fortune in England.’ As not uncommonly happens in Updike’s text, that remark is acute though lacking a source. Bodoni’s biographer De Lama said that when he had already spent eight years in Rome and was aware of his own capabilities (he had already cut some types) Bodoni was becoming interested in seeing countries ‘beyond the alps’. There were some enthusiasts in Rome (De Lama calls them <em>virtuosi</em>) who told him how generous the English were, and persuaded him at short notice to come with them. There is no mention of Baskerville or Birmingham. We know that, having stopped off in his native Piemonte, Bodoni was traced by the new librarian in Parma, Paciaudi, who had known him in Rome, and signed up for the new printing office that had been planned there for some years by the prime minister, Guillaume Du Tillot. He arrived in 1768.</p>
      <p>Bodoni wrote in the preface to the little specimen book he made in Parma in 1771 that when he was in Rome in the 1760s people were admiring Baskerville’s types and praising them, but that he thought it would be more ‘useful’ to follow those of Fournier which had better proportions. Useful because he really thought so or because French culture was supreme in Parma? He wisely does not explain. That is his only published reference to Baskerville’s types. Baskerville’s name does appear in the posthumously published <em>Manuale tipografico</em> of 1818 but only in a couple of very general references.</p>
      <p>Many of the types in the specimen of 1771 are Fournier’s, which Du Tillot had already imported. Some of the others are imitations of Fournier’s flowers and decorated letters, not all of them very good. There is also a single unnumbered leaf of Greek which is a straight copy of the type that Baskerville made for the University Press at Oxford. It is a pretty, small octavo specimen, very rare, with a decorative title page imitated directly from the second volume (the one with the specimen) of Fournier’s <em>Manuel typographique.</em> The title is <em>Fregi e majuscole incise e fuse da Giambattista Bodoni, direttore della Stamperia Reale</em>, ‘ornaments and capitals cut and cast by Giambattista Bodoni, director of the royal printing-office’. (In 1982 the Houghton Library in Cambridge MA issued a facsimile made from one of their own copies, including its printed wrappers. It is among their publications currently listed for sale. The price is six dollars.)</p>
      <p>Among the books associated with Bodoni at the Palatina Library in Parma is a rather battered copy of Fournier’s <em>Manuel typographique</em>, with some smoke proofs of punches in a style resembling Fournier’s on some of the pages. Pasted inside the front cover are quite a lot of fragments cut from Baskerville’s specimen sheet of about 1762. Marks on some of the fragments suggest that an attempt has been made to get copies from some of the letters.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Baskerville DP in MT at Parma 500_6562.jpg"></div><p></p>
