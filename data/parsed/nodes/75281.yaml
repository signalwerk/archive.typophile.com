      <p>It is at least conventional wisdom, as stated in Updike, that Baskerville opened the door through which Bodoni rushed. Thus, he stated that while Baskerville was a good typeface in itself, it was "mischevious" in its effects.</p>
      <p>Essentially, Baskerville designed a typeface that looked more impressive than Caslon, but one which required new high-quality printing techniques to look reasonable. Thus, he was unable to make an economic success of his printing business, and was roundly disliked by other printers.</p>
      <p>Bodoni and Didot then took the characteristics of letterforms pioneered by Baskerville to an extreme. Eventually, as printing technology caught up, and with a particular boost from the French Romain du Roi, another inspiration for Bodoni, (The Romain du Roi, though, was released in the year Caslon was born, which seems to complicate the usual story as I've understood it.)</p>
      <p>Thus, changes in fashion, each step seeming reasonable at the time, led to Caslon being replaced by a host of Scotch Roman faces, inspired by Bodoni, many of which now look to the eyes of many people today as unattractive.</p>
