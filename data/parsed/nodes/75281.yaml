      <p><cite>Moderns? Really James? There is a hell of a way from transitionals to moderns.</cite></p>
      <p>Regiment the letter widths a little, tweak some serifs, and you’re there. Particularly if you look at the early designs by Bodoni and Firmin Didot, as opposed to the later designs done after they had really developed the style. </p>
      <p><cite>However, although I have frequently seen it written that Bodoni admired Baskerville, I wonder if there is an actual quote from him to this effect…</cite></p>
      <p>I’ve never read any quotes from Bodoni. According to Lawson, Bodoni’s trip to England was a trip to Birmingham to meet Baskerville. Fortunately Taschen has just published a new English edition of the Manuale Tipografico, maybe it will include some of his writings. It should be here Tuesday.</p>
