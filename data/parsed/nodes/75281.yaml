      <p>Not quite what you had in mind, I guess, but in Oneleigh Italic I copied the idea of having a few swash capitals as default capitals. This is a conceit of Baskerville's italic, although not all revivals adhere to it. It's an idea which Goudy also adopted in several of his fonts.</p>
      <p><em>...any good transitional typeface designed in the last 10 years...</em></p>
      <p>Some people consider Scotch Romans to be transitional, e.g. H&amp;FJ's Chronicle.</p>
