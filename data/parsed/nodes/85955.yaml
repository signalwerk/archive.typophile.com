    <p></p><div class="imageWrap"><img src="http://typophile.com/files/birdy_590_263_4799.gif"></div><br>
    Birdy was especially created during the <a class="freelinking external" href="http://www.graphicdesignwalk.com" rel="nofollow">Graphic Design Walk</a> as part of the London Design Festival.The event was organised by the team of <a class="freelinking external" href="http://www.graphicbirdwatching.com" rel="nofollow">GraphicBirdWatching</a> who invited TypeTogether to participate. Veronika was drawing live this new typeface, Birdy, conceived there and then. A projector allowed visitors to follow her drawing letters and gave opportunity to ask questions directly about the design process. Birdy is now available for free to download. The character set is limited to upper- and lowercase a some basic punctuation. An extension is in progress. <a class="freelinking external" href="http://www.type-together.com/index.php" rel="nofollow">Keep in touch</a> for updates.<p></p>
    <p><a class="freelinking external" href="http://www.type-together.com/graphicdesignwalk" rel="nofollow"><strong>Download Birdy</strong></a></p>
