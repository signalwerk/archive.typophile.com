    <p>For Immediate Release<br>
    De Pinte, Belgium - September 12, 2008</p>
    <p><strong><a href="/wiki/OurType" class="freelinking" rel="nofollow">OurType</a> proudly presents three new additions to its collection –<br>
    Alto, Lirico and Meran.</strong> </p>
    <p><strong><a href="/wiki/Alto" class="freelinking" rel="nofollow">Alto</a> –<br>
    a versatile sanserif superfamily</strong><br>
    Designed by <a href="/wiki/Thomas%20Thiemich" class="freelinking" rel="nofollow">Thomas Thiemich</a>, Alto is a no-nonsense sanserif ‘superfamily’ that avoids quirky details in favour of down-to-earth usability. With a neutral design Alto is well attuned to the needs of day-to-day designing without adding too much flavour. It offers extensive language support and a wide range of typographic features to meet even the most demanding design briefs.<br>
    Available in nine weights of roman and italic designs, the Alto family is built around four widths – normal, condensed, extra condensed, and monospaced – making it OurType’s largest sanserif font family to date. Available in OpenType STD and PRO, covering Basic Latin and Latin Extended character sets.</p>
    <p><strong><a href="/wiki/Lirico" class="freelinking" rel="nofollow">Lirico</a> –<br>
    a fine text family</strong><br>
    <a href="/wiki/Hendrik%20Weber" class="freelinking" rel="nofollow">Hendrik Weber</a>’s Lirico is a characterful, contemporary text face that is at once elegant and sturdy, charming and reliable. Specifically designed for texts, Lirico is unabashedly traditional yet pleasantly up-to-date. Its qualities will delight graphic designers and experienced typographers alike.<br>
    The Lirico family consists of roman and italic designs in six weights.<br>
    Available in OpenType STD and PRO, covering Basic Latin and Latin Extended character sets.</p>
    <p><strong><a href="/wiki/Meran" class="freelinking" rel="nofollow">Meran</a> –<br>
    a unique contemporary sanserif</strong><br>
    Designed by <a href="/wiki/Maurice%20G%C3%B6ldner" class="freelinking" rel="nofollow">Maurice Göldner</a>, Meran is a contemporary sanserif with a fresh and distinctive look that we might call a ‘contemporary rotunda’. Impressive in display sizes and inviting to read in text sizes, Meran is a sanserif with an edge, which offers an exceptional blend between character and utility.<br>
    The Meran family consists of six weights of roman and italic designs. To offer additional choice and flexibility, the Meran family is built around three widths: normal, semi condensed and condensed. The semi condensed has been specially developed for font sizes above 14 point. Meran is available in OpenType STD and PRO, covering Basic Latin and Latin Extended character sets.</p>
    <p><strong>About Thomas Thiemich</strong><br>
    <cite> Thomas Thiemich is a typographic designer, fascinated by analytics, logic, mathematics and physics. He studied Computational Visualistics and later type design at the Hochschule für Grafik und Buchkunst in Leipzig (HGB), where he applied his knowledge on type design and type systems. Thomas holds a degree in Type Design from HGB and lectures on type design and technology. His work was shown in Antwerp, Weimar, and Leipzig. <cite></cite></cite></p>
    <p><strong>About Hendrik Weber</strong><br>
    <cite> Hendrik Weber is a typographic designer, educated at the University of Applied Sciences (FHP) in Potsdam and at the Hochschule für Grafik und Buchkunst in Leipzig, from where he graduated in Type Design.<br>
    During his time in Leipzig Hendrik rediscovered his calligraphic skills, fell in love with heavy, condensed sanserifs, and developed a special interest in italic letters.<br>
    Hendrik works and lives in Leipzig. <cite></cite></cite></p>
    <p><strong>About Maurice Göldner</strong><br>
    <cite> Maurice Göldner is a typographic designer, with a keen interest in lettering and typographic research. He studied communication and graphic design at the Burg Giebichenstein - Hochschule für Kunst und Design, Halle and later type design at the Hochschule für Grafik und Buchkunst in Leipzig. His work has been exhibited in Leipzig and Copenhagen. Maurice works and lives in Leipzig. <cite></cite></cite></p>
    <p><strong>About OurType</strong><br>
    <cite> Founded in 2002, OurType is an independent type foundry led by <a href="/wiki/Fred%20Smeijers" class="freelinking" rel="nofollow">Fred Smeijers</a>, <a href="/wiki/Corina%20Cotorobai" class="freelinking" rel="nofollow">Corina Cotorobai</a> and <a href="/wiki/Rudy%20Geeraerts" class="freelinking" rel="nofollow">Rudy Geeraerts</a>. OurType develops and retails premium typefaces, that respect traditional values yet tailored to contemporary needs.<br>
    Apart from renowned type designers like Smeijers and <a href="/wiki/Verheul" class="freelinking" rel="nofollow">Verheul</a>, OurType publishes fonts from some of the best young designers: <a href="/wiki/Nikola%20Djurek" class="freelinking" rel="nofollow">Nikola Djurek</a>, <a href="/wiki/Andr%C3%A9%20Leonardt" class="freelinking" rel="nofollow">André Leonardt</a>, <a href="/wiki/Merel%20Matzinger" class="freelinking" rel="nofollow">Merel Matzinger</a> and <a href="/wiki/Artur%20Schmal" class="freelinking" rel="nofollow">Artur Schmal</a>.<cite> </cite></cite></p>
    <p>OurType collection is available at <strong><a class="freelinking external" href="http://www.ourtype.com" rel="nofollow">ourtype.com</a></strong>.</p>
