    html: |-
      <p>Ouch, Charles. That should never happen.</p>
      <p>In regards to Steve's issue, I understand his frustration. He is probably able to access most sites without issue. Roadblocks like this one are unexpected. But these roadblocks will become more common as his browser ages. </p>
      <p>IE 5.5 (released 7 years ago) sees the web much differently than modern browsers. Whenever a company updates their site, decisions need to be made about what features to include, some of which will disable compatibility with older software. In the end, the convenience of the vast majority of customers takes precedence over the smallest minority. </p>
      <p>In FontShop's case, less than 0.1% of our visitors use IE 5.5. We make the (sometimes painful) decision to serve our largest customer base first, putting resources into more modern technologies, and then look to comply with least common browsers as time permits.</p>
      <p>This is why <a href="http://www.webstandards.org/" rel="nofollow">web standards</a> are so vital. Standards-compliant web browsers should have a longer lifespan than those that are not.</p>
      <p>All this said, keeping your software updated will always save you time and headaches in the long run. I echo the calls for using Firefox and keeping it up-to-date, which is surprisingly simple.</p>
    html_clean: |-
