  html: <p>OK, let's spark some more convo. Takatak is a logo that was inspired by Katakana, created entirely with line art, then tweaked to achieved the desired thickness and roundness.The name is suggestive of chopsticks clicking against each other. It also means "quickly" in modern Greek and has become a vernacular expression amongst our friends here in Montreal. I thought I could maybe do some interesting and weird ligatures, something unexpected and strange, more akin to plant life than type. I was also planning on introducing some fun icons and illustrations, sort of like what you see on the background. As you can see, for the identity pieces, I have paired up the logo with one of my favorite fonts, Gia, by patric king. <br> <br> <br><img src="http://www.typophile.com/forums/messages/29/571.jpg" alt="takatak.jpg"></p>
  html_clean: <p>OK, let's spark some more convo. Takatak is a logo that was inspired by Katakana, created entirely with line art, then tweaked to achieved the desired thickness and roundness.The name is suggestive of chopsticks clicking against each other. It also means "quickly" in modern Greek and has become a vernacular expression amongst our friends here in Montreal. I thought I could maybe do some interesting and weird ligatures, something unexpected and strange, more akin to plant life than type. I was also planning on introducing some fun icons and illustrations, sort of like what you see on the background. As you can see, for the identity pieces, I have paired up the logo with one of my favorite fonts, Gia, by patric king. <br> <br> <br><img src="http://www.typophile.com/forums/messages/29/571.jpg" alt="takatak.jpg"></p>
