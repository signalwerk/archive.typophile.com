    html: <p>This seems to be a version of <a href="http://www.identifont.com/show?HG6" rel="nofollow">AG Schoolbook</a> with some glyph alternates and, more importantly, with a stroke applied. The proper bold cut (or, as they dub it, <a href="http://new.myfonts.com/fonts/berthold/ag-schoolbook-bq/medium/" rel="nofollow">Medium</a>) looks slightly different and, well, better.</p>
