      <p>Re: Gripes...</p>
      <p>2. Use the knife tool to add a node, then RIGHT CLICK (or SHIFT+CLICK) the node: the Contextual Menu has an option to BREAK CONTOUR.</p>
      <p>3. No, you don't.</p>
      <p>4. Select nodes, RIGHT CLICK and select ALIGN NODES</p>
