    html: |-
      <p>Maybe try to remove the lid and make like two or three highly visible steam elements so you have a logo that can easily be reproduced. Furthermore I would really like to know more about the company. Thinking of clichés I would use red and yellow maybe a dark, not too highly saturated green if you want to emphazise the cafe.</p>
      <p>Regarding to typography I'd reconsider the kerning of 'Cafe'. It looks very loose compared to 'Bouillabaisse'. Especially the 'C-a' feels a bit strange. Personally I think that the typeface works for the additional information but it doesn't do the trick for the company's name. It feels so constructed which conflicts with deli in some way.</p>
      <p>Anyway, I do get some vibes from it but I think you can still improve your current approach.</p>
