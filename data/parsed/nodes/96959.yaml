      <p>Terminal of /e/ should be more pointy IMO.<br>
      I actually liked the informal character of /@/ before the revision (except again the terminal and the shape of the left arc).<br>
      /s/ is too wide.</p>
      <p>I like that you're being organized in your design. It shows off your dedication. Those corrections all go in the right direction, specially that of raising the tittles.</p>
      <blockquote><p>Para mejorar la legibilidad de una forma es más relevante prestarle atención a la contraforma que concentrarse en la forma misma.</p></blockquote>
      <p>Being conscious of and ‘tweaking’ the inner space of a shape <em>is</em> concentrating on the shape itself, isn't it?</p>
      <p>Is "contraforma" a usual term in spanish, or is it a neologism? :-)</p>
      <p>Me está gustando bastante, sigue así!</p>
