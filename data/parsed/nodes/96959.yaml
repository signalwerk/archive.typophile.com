      <p>Thank you Dave.</p>
      <p>I'm working now in the another /g/ and also I'll try to make a more conservative version of /y/ yes.. but I think leave this kind as alternatative design.. thanks to mention it.. so I really like even more... because this become a very attractive OTF idea. I'll try to do a version close to AE.. if looks well sure I replace the new version.</p>
      <p>And about floating zero version is a kind of solution to avoid confusions between the letter /O/o/0 (zero without slash or center pointed version)/. I know this look a little disturbing but wen you running alphanumeric combination this works a little eficiently.. even more than inverted contrast, but I need mor opinions about it.. in fact it's an alternative of zero slash.. and looks aesthetically close to oldstyle so my collegues that yet use this zero version mention no one negative comments or any, because I always finding ways to make more legible and clean versions of each letter and avoid ambiguity meanings.. I know this is not so easy, I appreciate a rational coments about.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/floating-zero_6034.png"></div><p></p>
