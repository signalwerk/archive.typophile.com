      <p>About /@/ I'll try how this looks like this version you mention here and after have a good comparision decide wich one works better in small sizes or digital environments, that's the reason of that kind of serif function, but if still workind could be no necesary, but I need test it, thanks to mention, I like the idea of a cleanest version one. Now I notive about width of /s/ really need fix it.</p>
