    <p>Hi typophile mates!</p>
    <p>I'm trying to improve this first version of this typeface, called "Limonada" its meaning is litteraly "Lemonade" and was sinesthetically referred as a formal abstraction to lemon shapes (i.e. lemon seed, lemon leaves, and lemon juice drop, etc.)<br>
    This weekend I'm very interested in make some correction on this one, so hope somebody can see it with another eye further than just mine ones and give me an opinion.</p>
    <p>I'll very thankful in advance.</p>
    <p>Kind regards<br>
    Pedro</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Limonada_WIP-IX_4416.gif"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Limonada_WIP-III_bn_5488.gif"></div><p></p>
    <p>P.S.: PDF Attached to check it out  in a better way.</p>
