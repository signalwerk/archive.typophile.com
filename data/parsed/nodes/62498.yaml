  html: |-
    <p>I am doing typographic research for a rebranding project, and one of our main reference points is the style associated with Italian Art Deco Ski Posters and the like. The closest thing we have found to what we want is Mark Simonson's  <a class="freelinking external" href="http://new.myfonts.com/fonts/marksimonson/mostra/" rel="nofollow">Mostra</a> and <a class="freelinking external" href="http://new.myfonts.com/fonts/marksimonson/mostra-nuova/" rel="nofollow">Mostra Nuova</a>.</p>
    <p>These may be sufficient for what we need, but I'm interested in seeing alternatives. I'm particularly after sans serif faces that make a somewhat less overt allusion to this style, without imitating it quite as literally (Neutraface came to mind because of the low x-height). Does anyone have any suggestions for either literal 30's Art Deco Poster Style OR something that might imply such a style a bit more subtly? Thanks in advance.</p>
