      <p>&gt;Does somebody know when the english term “blackletter” appeared the first time?<br>
      According to OED</p>
      <p>1640-4 Charge agst. Abp. Canterb. in Rushworth Hist. Coll. III. (1692) I. 115 His diligence to send for the Printer, and directing him to prepare a Black Letter, and to send it to his Servants at Edenburgh, for Printing this Book. 1712 ARBUTHNOT John Bull II. vii. (1727) 60 The Seven champions in the black-letter. 1871 EARLE Philol. Eng. Tong. §99 The form which is known to us as ‘Black Letter,’ and which was hardly less rectilinear than the old Runes themselves.</p>
      <p>1791 MAXWELL in Boswell Johnson an. 1770, He loved..the old black-letter books. 1800 RITSON Rob. Hood II. iv, From an old black-letter copy. 1808 W. IRVING Salmag. xviii. (1860) 410 There was a certain black-letter dignity in the name. 1820  Sketch Bk. II. 90 He was a complete black-letter hunter. 1845 LD. CAMPBELL Chancellors (1857) IV. lxxiv. 6 Not much of a lawyer compared with the black~letter men of these days. 1855 MACAULAY Hist. Eng. III. 31 He scornfully thrust aside..all that blackletter learning. 1862 BURTON Bk. Hunter I. 18 He was not a black-letter man, or a tall-copyist, or an uncut man. 1864 Reader 23 July 105/1 The collection of black-letter ballads.</p>
      <p>Tim</p>
