    html: <p>The idea of weight variations of a single typeface family happened in the late nineteenth century. Before that, bold typefaces existed, but were considered to be separate typefaces, even if they seemed to follow the style of a lighter typeface. Same thing with condensed and extended. Morris Fuller Benton is credited with the idea, around 1900, of a typeface family, with a range of weights and widths.</p>
