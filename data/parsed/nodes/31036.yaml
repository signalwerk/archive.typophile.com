    <p>Where do they come from? When did they emerge? The reason this question came to my mind, is that I seldom see bold serif fonts that i like. When i find a sans i like, i seldom like it's bold version. I don't think this has ever happened with a serif. For example, I think the bold garamonds I've seen are plain ugly. They don't look "natural" to me. how come?</p>
    <p>alex</p>
