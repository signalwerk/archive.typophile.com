    html: <p>Blackletter nameplates for newspapers originated with the 1712 introduction of newspaper taxes in Britain, when the sudden increase in paper costs forced publishers to economize on the amount of space alloted to the title line, minimizing its type size and choosing the darkest type then available, which was blackletter. (John E Allen, <em>Newspaper Designing,</em> Harper, 1947).</p>
