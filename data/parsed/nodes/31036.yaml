      <p><em>So just to clarify, what exactly was the “regular” typeface used by the Besley foundry in that piracy notice?</em></p>
      <p>Just one of the Great Primer types of the Fann Street Foundry. (I should probably have used that alternative name rather than Besley's, since he was the 'Co' of Thorowgood &amp; Co. when the Clarendon was registered in 1845. It becomes Besley &amp; Co. when Thorowgood retired in 1849, the 'Co. this time being the punchcutter Benjamin Fox.) It seems to match one called Great Primer No. 5 in a Fann Street specimen issued in 1844, but looks earlier to me, and as I said is not a very good match for the condensed proportions of the Clarendon cast to align with its baseline.</p>
      <p>The main point of this post is that I have looked out this image (albeit not brilliant quality) made from one of the Fann Street specimens of a showing of Clarendon used with roman, which explains the the foundry's usp, and I think is based on the original registration claim that I'll look up when I get the chance.</p>
      <p><img src="/sites/default/files/old-images/Fann St - Clarendon Br 1 bw a 600_5140.jpg"></p>
