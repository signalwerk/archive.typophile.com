      <p>The light weight of <em>Consort</em>, an excellent type I think, was another Fann Street type of the 1840s or 1850s, and was presumably cut by Fox. It doesn't match the Clarendons closely, though, having unbracketed serifs.</p>
      <p>The story of the bold and the italic is a rather sad one. They were made by H. Karl Görner, who was born in Germany in 1883, was taken on in 1907 as assistant punchcutter with Stephenson, Blake &amp; Co., Sheffield and stayed with them for the rest of his life. He died in 1964. Görner was probably trained to cut steel punches, but the work I know about was cut in typemetal, and electrotypes were grown to make matrices for casting. This was quite a usual practice, in the UK and the US at least, from the later 19th century onwards. </p>
      <p>I was told that, years before, Görner had made the type that was thought up by Robert Harling and marketed by Stephenson Blake under the name of <em>Chisel</em>. He cast type from matrices for <em>Bold Latin Condensed</em> and incised lines into the face. When SB wanted a bold and an italic to complete the <em>Consort</em> series, Görner cast a bold slab-serif from some quite early matrices and pared it down to make <em>Consort Bold</em>. I don’t know if he had a model for the italic. Probably not. I think they are awful types – travesties of the original cuttings of Clarendon.</p>
