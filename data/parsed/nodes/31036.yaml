      <p>It's one of those things that creep up on you. When most printing is being done in roman type, by contrast this 'old English' textura gothic suddenly looks – well – black. So that is what it is called on the Caslon specimen sheet of 1734. </p>
      <p>I prefer 'gothic' as a handy general term for all the types that are known as 'broken' type or letterforms in German – Fraktur, Schwabacher, textura, rotunda, bâtarde, civilité – but this can be tricky in the US where gothic became the name for sanserif. Which must be why it's called black letter (or blackletter) instead.</p>
    html_clean: |-
