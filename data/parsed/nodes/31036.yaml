      <p>Another "new media" theory for the design impetus towards Clarendons: it was prompted by smoother paper and finer printing drawing attention to the ink gain of the previous era. The Clarendon, therefore, was a cleaned-up, stylized interpretation of ink gain on deep-bite rag paper printing.</p>
      <p>McLuhan's Third Law, Retrieval, in action. This states that new media brings obsolesced "ground" back as "figure", part of the new form. In other words, the bolding effect of ink gain wasn't considered as a design feature (more of a bug), until it was seen in comparison with the new finer images. Then, once it was recognized as such, it was exploited and developed into the Clarendon style.</p>
      <p>The first Fourdrinier machines were installed in the 1800s in England, and these mechanically pulped and pressed recycled rags (wood pulp not being used till the second half of the century). Having seen some pretty poor paper (fragile, discoloured) in books from the first half of the 19th century -- but smooth -- I surmise that chemicals were used in the pulping then.</p>
    html_clean: |-
