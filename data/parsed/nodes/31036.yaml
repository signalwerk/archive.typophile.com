      <p>For the record, the Clarendon type of the Besley foundry is indeed the first type actually designed as a ‘related bold’ – that is, made to harmonize in design and align with the roman types it was set with. It was registered in Britain in 1845 under the new Ornamental Designs Act of 1842. But when protection ran out after only three years, the other founders also thought a related bold was a good idea. This is how Besley reacted.<br><img src="/sites/default/files/old-images/Fann St - Clarendon E - 600_4167.jpg"><br>
      But the idea of a ‘bold face’ goes back much further. Before the launch of Clarendon type printers picked out words in slab-serifs or any other heavy type. In the 18th century they used ‘English’ or ‘Old English’ types, which is why they became known as ‘black letter’. John Smith says in his <em>Printer’s grammar</em> (London, 1755). ‘Black Letter … is sometimes used … to serve for matter which the Author would particularly enforce to the reader.’<br>
      He means this sort of setting, from a mathematical handbook published in London in 1740:<br><img src="/sites/default/files/old-images/Ward - Mathematics 3 600_4427.jpg"></p>
