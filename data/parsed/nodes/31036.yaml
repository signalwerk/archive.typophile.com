      <p>There is something uncanny about the way that the Clarendons resemble regular type that has been mechanically modified, as in a phototypositor era "camera mod" made by swelling a photographic image, or a digital era "make parallel path/expand stroke" command -- the notorious "faux" bold.</p>
      <p>Was there any 1840s technology that prompted this approach, a contemporary meme?<br>
      Photography, of course. Perhaps woodtype pantographic routing. Or something in stereotyping?</p>
      <p>The development of shaded and outline fonts may have prompted this line of design development. Copperplate engraving had long ago produced the "shorthand" of monoline and outline lettering.</p>
      <p>At any rate, Benjamin Fox must surely have imagined the outline of type, and then conceptualized an outer outline and filled the whole thing in mentally, if not in a sketch book, before punching his cuts.</p>
      <p>I don't believe that type designers of that day worked entirely at scale, they must have had sketches and larger working drawings to help the design process. Other than the famous mathematical drawings for L'Imprimerie Royale c.1700, do any such drawings or sketches exist?</p>
      <p>**</p>
      <p>I enjoyed Mitja Miklavčič’s essay, and this thread has been very educational, but I must confess that I am beginning to find type histories based on specimen books to be tasty appetizers that leave me hungry for a main course of "real" commercial use.</p>
    html_clean: |-
