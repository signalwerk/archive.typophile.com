      <p>That makes it nice if you're planning on buying an "old" typeface like a Jenson revival. No need to waste the dough on a bunch of bold variants that are a)inauthentic and b)ugly. With today's opentype fonts, all you need to purchase is two types, regular and Italic, because the small caps and old style figures are included in the set. </p>
      <p>Instead of bold, most oldstyle typography used small caps. That's one thing that Bringhurst brings up. The italics were a separate style of type altogether. </p>
      <p>Bold fonts were originally their own typefaces, but when the different foundries started consolidating, all sorts of stuff started getting tossed together into groups willy nilly. Blah.</p>
