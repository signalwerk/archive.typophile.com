      <p><img src="/sites/default/files/old-images/Polkas_5206.jpg"><br>
      In 1850 London, before the Caslon revival, there were very few foundries and they all had pretty much the same typeface for basic text work. So although families as such did not exist yet, everything was nonetheless related. Here there are two versions of bold -- a "Clarendon" and a "Fatface".</p>
      <p>Actually, the contrast between a bold Clarendon and a Regular Scotch Modern is preferable to Regular and Bold of the same typeface, which is a relationship typographers have been tempted to use since families have been marketed with weight variants.</p>
      <p><img src="/sites/default/files/old-images/cadburys_4419.jpg"><br>
      This is from 1875.</p>
