      <p><em>So does the original roman still exist that Clarendon was designed to match?</em></p>
      <p>Dan, the Clarendon in that example from the Besley specimen is supposed to match the shape of and align with the roman it appears with. Not that closely, you may say (and I'd agree) but more so than a completely unrelated slab-serif. Incidentally, roman types of the 1840s were tending to become more compressed, which must be why the normal width of Clarendon looks condensed to us. The wide version of the type, a beautiful piece of type-making (presumably, like the Clarendon, the work of the house punchcutter Benjamin Fox, a partner in the Besley foundry) was recast from original matrices (or electros thereof) by Stephenson Blake in the 1950s under the name of <em>Consort.</em> </p>
      <p>I recall that this question of the 'related bold' was discussed in the original registration document for the Clarendon type in order to back up the foundry's argument that it was an original design. I can't currently put my hands on the text, so have been meaning for some time to go back to what we now call the National Archives and get a copy. I'll report back.</p>
      <p>And no, 'black letter' is not a 'related bold'. Sure is bold, though.</p>
