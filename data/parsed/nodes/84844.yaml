    html: |-
      <p>Helvetica. Optima. Times Roman.</p>
      <p>Goudy Old Style. Perpetua.</p>
      <p>Peignot Bold. Dom Casual. Pretorian. Hobo.</p>
      <p>Franklin Gothic. News Gothic. Century Schoolbook. Clarendon.</p>
      <p>These are some examples of typefaces which were popular in the 1960s and/or the 1970s.</p>
