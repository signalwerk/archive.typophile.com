    html: "<p>Nice presentation! <br> <br>Caps: I'd remove the bar on the \"J\", make the tail of the \"Q\" stronger, and redo the \"S\". <br> <br>lc: I'd make the \"a\" slightly narrower, the ear of the \"g\" stronger, the dots of the \"i\"/\"j\" higher and slightly larger, redo the \"s\" here too, and restore your original \"y\". BTW, have you considered making your \"rr\" descending? <br> <br>Others: I love the \"4\", I think your \"@\" should be upright and have a monocular \"a\" inside, the Florin should slant (more authentic), and the \"fi\"/\"fl\" are too tight, because: <br> <br>Spacing: although it's hard to be certain from that sample, your spacing seems too tight (for that light color). <br> <br>BTW, GIF works much better than JPEG for font specimens - you have some massive halos there. <br> <br>hhp <br></p>"
