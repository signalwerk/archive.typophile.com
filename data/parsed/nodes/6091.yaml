  html: <p>Here is Origen <br> <br>Is my first attempt to make a font for text. <br>As you can see it has rescue some elements of a serif type {like the contrast} in order to make it more legible. <br> <br>Origen is the develop of a type designed for me ina a Logo with the same name {posted here like two months ago}. The result ends in a total different thing, in order to increase it's legibility at samll sizes, but i think the spirit remains. The curve extreme ends, started as a way of keeping a relationship with the logo I develop, but in the end it rises like a good way to give this font a unique personality. <br> <br>In order to make the final version, i am gathering all yhe critics, and then i will put my self into work. <br> <br>Thanks for the feedback <br> <br>CG <br> <br> <br><img src="http://www.typophile.com/forums/messages/29/4287.jpg" alt="origenparatypophile.jpg"></p>
