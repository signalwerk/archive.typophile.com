    html: "<p>This Italic is simply delicious! And also <i>progressive</i> - my favorite thing. BTW, I'm pretty sure you have no idea about this, but there's a Greek face designed by Michail Semoglu which has this rare and wonderful letterform finish you're using. <br> <br>The things that bother me: <br>- The \"c\" is too wide. <br>- The \"g\" has too much detail - try making the bottom open. <br>- I'd make the \"m\" a hair narrower. <br>- The \"p\": don't let the chirographers force ductus bull on you. Do what <i>feels</i> right. <br>- The one glyph that simply doesn't work: \"t\". <br>- The \"x\" is too rigid. <br> <br>BTW, I think the Bold weight in your Roman needs more stroke contrast. <br> <br>hhp <br></p>"
    html_clean: "<p>This Italic is simply delicious! And also <i>progressive</i> - my favorite thing. BTW, I'm pretty sure you have no idea about this, but there's a Greek face designed by Michail Semoglu which has this rare and wonderful letterform finish you're using. <br> <br>The things that bother me: <br>- The \"c\" is too wide. <br>- The \"g\" has too much detail - try making the bottom open. <br>- I'd make the \"m\" a hair narrower. <br>- The \"p\": don't let the chirographers force ductus bull on you. Do what <i>feels</i> right. <br>- The one glyph that simply doesn't work: \"t\". <br>- The \"x\" is too rigid. <br> <br>BTW, I think the Bold weight in your Roman needs more stroke contrast. <br> <br>hhp <br></p>"
