    html: "<p>BTW, this is not exactly on-topic, but having a dedicated thread seems like too much, so please let me bring this up here: <br> <br>I finally finished reading issue #60 of tipoGrafica*, and one negative thing struck me. No mention of Typophile. If like me you've followed the \"upbringing\" of so many of the fonts in the Letras Latinas right here on this board, you might agree that somebody somewhere should have mentioned the positive effect of all the crits, large and small, that have been provided gratis. I think credit is due. <br> <br>* Note: This will be a collectors issue. Get yours before they end up selling for $50 at a type conference auction. <br> <br>hhp <br></p>"
