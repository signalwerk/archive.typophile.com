    html: "<p>Just a general thing: I don't know if you designed the forms in pencil or directly in some application on your computer, but my experience has made me realize that often is helpful to create some \"on-the-fly\" grids. <br>I mean that a precise grid goes against the casual feeling you wish to convey, but no grid at all could make you confused, expecially when you have designed all the letters, like in Origen. <br>Of course it's not an easy thing to do. I'm still trying to apply it in my own faces, too. <br>A \"grid\" may just mean also using parts of letters you have already designed that are satisfying and armonic as a basis for the others.  <br></p>"
    html_clean: "<p>Just a general thing: I don't know if you designed the forms in pencil or directly in some application on your computer, but my experience has made me realize that often is helpful to create some \"on-the-fly\" grids. <br>I mean that a precise grid goes against the casual feeling you wish to convey, but no grid at all could make you confused, expecially when you have designed all the letters, like in Origen. <br>Of course it's not an easy thing to do. I'm still trying to apply it in my own faces, too. <br>A \"grid\" may just mean also using parts of letters you have already designed that are satisfying and armonic as a basis for the others.  <br></p>"
