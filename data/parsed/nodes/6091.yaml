    html: <p>Making traps look good is an interesting challenge. Certain designs lend themselves to the process better than others. For example, the [currently re-emerging] Eastern European "fauve" style looks great with abrupt traps (with or without cavity shears), while in highly organic designs what might be called "cleavage" traps (with no cavity shearing) blend in great. In the cooler geometric designs (like Futura) it's hard to make traps look good. <br> <br>hhp <br></p>
    html_clean: <p>Making traps look good is an interesting challenge. Certain designs lend themselves to the process better than others. For example, the [currently re-emerging] Eastern European "fauve" style looks great with abrupt traps (with or without cavity shears), while in highly organic designs what might be called "cleavage" traps (with no cavity shearing) blend in great. In the cooler geometric designs (like Futura) it's hard to make traps look good. <br> <br>hhp <br></p>
