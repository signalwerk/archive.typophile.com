    html: "<p>So I checked out the PDF (which was pretty nice of itself): <br> <br>This is a really elegant design, with a great level of detailing. Nice traps too! My only serious concern is its color: especially if your target is small text, it's way too light. Of course that helps make it elegant, so I hope you have a wide weight range planned. <br> <br>The spacing needs work, and I think it's slightly loose (even for that light color). <br> <br>The lc is great - that \"g\" is killer. Some specifics in the UC: The \"G\", \"K\" and \"U\" seem narrow; the \"S\" is wide; I'd make the \"J\" descend. <br> <br>Numerals: very nice. Just the 7 and especially the 8 look narrow. <br> <br>I think the \"ae\" should have a joined middle bar, and in the \"oe\" the \"o\" is a \"c\". There's something wrong in the eszet, but I'm not German enough to give you good advice on that. In the \"ck\", raise the left side of the join. <br> <br>What's the logic behind the sizing of the currencies, like the Yen, Pound, and Cent? <br> <br>I think the Asterisk looks great at large sizes, but for smaller sizes (your target?) it's too busy. <br> <br>The TM needs to be darker. <br> <br>-- <br> <br>This is a wonderfully promising design, and I expect to see it used a lot once it's released! <br> <br>hhp <br></p>"
    html_clean: "<p>So I checked out the PDF (which was pretty nice of itself): <br> <br>This is a really elegant design, with a great level of detailing. Nice traps too! My only serious concern is its color: especially if your target is small text, it's way too light. Of course that helps make it elegant, so I hope you have a wide weight range planned. <br> <br>The spacing needs work, and I think it's slightly loose (even for that light color). <br> <br>The lc is great - that \"g\" is killer. Some specifics in the UC: The \"G\", \"K\" and \"U\" seem narrow; the \"S\" is wide; I'd make the \"J\" descend. <br> <br>Numerals: very nice. Just the 7 and especially the 8 look narrow. <br> <br>I think the \"ae\" should have a joined middle bar, and in the \"oe\" the \"o\" is a \"c\". There's something wrong in the eszet, but I'm not German enough to give you good advice on that. In the \"ck\", raise the left side of the join. <br> <br>What's the logic behind the sizing of the currencies, like the Yen, Pound, and Cent? <br> <br>I think the Asterisk looks great at large sizes, but for smaller sizes (your target?) it's too busy. <br> <br>The TM needs to be darker. <br> <br>-- <br> <br>This is a wonderfully promising design, and I expect to see it used a lot once it's released! <br> <br>hhp <br></p>"
