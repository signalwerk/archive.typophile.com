    votes: null
    html: <p>Hi Christian, <br> <br>This is lovely. Your italics sing with the lower case. Very nice. The italic you show looks a little dark for the roman (like semibold italic). <br> <br>The one thing that really bothers me is the strange structure of the M and N in all weights and variants. I really noticed it in your small cap M. Traditional would have an M = | thin, \ thick, / thin, | thick and and N = | thin, \ thick, | thin. I would stongly encourage you follow tradition on this one. Some people will say don't worry about it, but since the rest of the font is so well crafted, this divergence really breaks the rythm. <br> <br>Please do a Black version! (salivates) <br> <br>Cheers, <br>Randy</p>
