      <p>The conversion is not bad, but there’s a number of technical issues. I just looked into Century Schoolbook in FontLab, and tried to install and use the other ones. A few quick notes:</p>
      <ul>
      <li>Some ISO Latin codepages are not supported, so there’s no language support for some European latin-based languages.</li>
      <li>Kerning is there, but not very extensive, could be better when using class-based kerning.</li>
      <li>Some glyphs have double unicodes, this is not recommended.</li>
      <li>Some hinting errors</li>
      <li>The Romanian cedilla/commaaccent issue is not taken into account.</li>
      <li>dlig feature is wrong, Æ æ Œ œ are not ligatures but characters in their own right.</li>
      <li>Not all fonts share the same glyph set.</li>
      <li>Font names are a mess, especially when trying to use the fonts in Word Mac 2004. Some fonts appear in the menu but don’t display in text, some are accessible only through the style buttons but not all.</li>
      <li>Nimbus Sans Condensed doesn’t show up at all in Word 2003’s font menu on Windows and in InDesign because of duplicate names.</li>
      </ul>
      <p>edit: Did I really say “not bad”?</p>
      <p>Jens</p>
