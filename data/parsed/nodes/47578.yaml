      <p>Many thanks for the in-depth analysis.</p>
      <p>I’m a bit confused about the kerning issue. It looks to me like the OpenType fonts have more kerning pairs than the originals. For instance, a010013l (URW Gothic L Book) has “StartKernPairs 998” in its original type-1 afm file, while the fea file that I exported from of the otf has 1851 pos statements in it’s kernHorizontalKerninginLatinloo table. Does this mean that the unknown person that did the conversion took the time to improve the kerning (even though it’s still lacking by expert standars), or is this some artifact of the conversion to OpenType?</p>
      <p>The originals are here: <a href="http://downloads.sourceforge.net/gs-fonts/gnu-gs-fonts-std-6.0.tar.gz?modtime=946368000&amp;big_mirror=0" title="http://downloads.sourceforge.net/gs-fonts/gnu-gs-fonts-std-6.0.tar.gz?modtime=946368000&amp;big_mirror=0">http://downloads.sourceforge.net/gs-fonts/gnu-gs-fonts-std-6.0.tar.gz?mo...</a></p>
