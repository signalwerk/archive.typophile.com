    <p>There’s an OpenType version of the GPL’d URW (ghostscript) fonts floating around. Unfortunately, the author of the conversion could not be identified. There’s some discussion of including these in Fedora Linux. I have a couple of questions for the experts:</p>
    <p>1) I’d appreciate is someone can take a look and let me know what conversion tool was used. The otf version string (for Nimbus Regular) is “Version 1.500;PS 1.05;Core 1.0.38”. It looks like Adobe FDK was used. Am I correct?</p>
    <p>2) As far as I can tell, the conversion was well done. Kerning uses the GSUB/kern method. If you have any critique of the conversion, don’t hold back.</p>
    <p>Package here: <a href="http://www.cs.umd.edu/~gaburici/Urw%20Gnu%20Opentype.zip" title="http://www.cs.umd.edu/~gaburici/Urw%20Gnu%20Opentype.zip">http://www.cs.umd.edu/~gaburici/Urw%20Gnu%20Opentype.zip</a></p>
