  html: |-
    <p>I am collecting information on the ethics and legality of digital font usage for my undergraduate thesis using a survey. I'm focusing on students, instructors, and professionals who are involved in the design community. I've received over 80 responses so far, but am looking for as many as I can obtain, so please feel free to share with your friends or colleagues!</p>
    <p>If you would like to offer any additional resources/information in regards to these issues, please contact me at: <a href="mailto:alexgilbert2009@gmail.com">alexgilbert2009@gmail.com</a></p>
    <p>The link is below, and the survey takes about 5 minutes to complete. Thank you in advance!<br><a href="http://tinyurl.com/alexgilbertsurvey">http://tinyurl.com/alexgilbertsurvey</a></p>
