    html: "<p>&gt; Can I revive this discussion? <br> <br>No, sorry, it's already been revived too often.  ;-) <br> <br>&gt; the color is very uneven. <br> <br>Maybe it's an auto-trace. <br> <br>&gt; designing a revival of a face which has already been revived? <br> <br>I guess normally you want to diverge from all existing revivals, not just to avoid ethical issues, but also to deliver something more useful. The main things I think you should do are: make something that evokes \"rationalist\" royal France; make an italic that strikes a good balance between subservience, character and the rationalist ideology. <br> <br>Tiffany, Beauty: I think it's essentially undefinable. It's a convoluted, dynamic mix of nature and nurture - best pondered lightly. <br> <br>hhp</p>"
