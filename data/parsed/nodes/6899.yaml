    html: <p>Middle one is a Venitian of some kind, although a really funky cut with those concave serifs. Cleaner, more regularized digitizations include <a href="http://www.myfonts.com/fonts/linotype/golden-type-ef/golden-type-original/testdrive.html">ITC Golden</a> and <a href="http://www.myfonts.com/fonts/spiecegraphics/nicolas-jenson-sg/regular/testdrive.html">Nicolas Jenson</a> from Spiece. <br> <br>For the last one, try something from Dan Solo. <a href="http://www.myfonts.com/fonts/solotype/excelsis/?PREFS_SET%5BRenderSize%5D=36&amp;PREFS_SET%5BRenderString%5D=Best+5c.+cigar">Excelsis</a> is a decent match, but you might be able to get even closer. <br> <br>The first one has me stumped. It resembles <a href="http://www.myfonts.com/fonts/linotype/britannic/medium/testdrive.html?s=DROP+ONE+CENT+IN+THE+SLOT&amp;p=36">Brittanic</a>, but is obviously funkier. G'luck!</p>
    html_clean: <p>Middle one is a Venitian of some kind, although a really funky cut with those concave serifs. Cleaner, more regularized digitizations include <a href="http://www.myfonts.com/fonts/linotype/golden-type-ef/golden-type-original/testdrive.html" class="link-external">ITC Golden</a> and <a href="http://www.myfonts.com/fonts/spiecegraphics/nicolas-jenson-sg/regular/testdrive.html" class="link-external">Nicolas Jenson</a> from Spiece. <br> <br>For the last one, try something from Dan Solo. <a href="http://www.myfonts.com/fonts/solotype/excelsis/?PREFS_SET%5BRenderSize%5D=36&amp;PREFS_SET%5BRenderString%5D=Best+5c.+cigar" class="link-external">Excelsis</a> is a decent match, but you might be able to get even closer. <br> <br>The first one has me stumped. It resembles <a href="http://www.myfonts.com/fonts/linotype/britannic/medium/testdrive.html?s=DROP+ONE+CENT+IN+THE+SLOT&amp;p=36" class="link-external">Brittanic</a>, but is obviously funkier. G'luck!</p>
