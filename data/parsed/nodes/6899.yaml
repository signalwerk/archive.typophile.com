  html: <p>Can anyone put a name to these letters? I know I've seen the first one before but I can't think where. I've looked at Solotype and Spiece Graphics and Nick's Fonts and have struck out. <br> <br><img src="http://www.typophile.com/forums/messages/83/49991.jpg" alt="penny type 1"> <br><img src="http://www.typophile.com/forums/messages/83/49992.jpg" alt=""> <br><img src="http://www.typophile.com/forums/messages/83/49993.jpg" alt="nickel"></p>
