    html: <p>Paul, my only runin with German was when Remington Products thought they would sell cheap razors in Germany and we had to translate the user manual. We hired a translator and had them approve the galley proofs (typesetting days) I would guess it be a good  idea to invest in a translator and let the client assorb the cost. It always costs more to redo a job than to do it right in the first place.</p>
