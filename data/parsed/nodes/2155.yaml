    html: "<p>For German: <br> <br>1. Find a copy of <i><a href=\"http://www.amazon.de/exec/obidos/ASIN/3411040122/qid=1069372888/sr=2-1/ref=sr_aps_prod_1_1/028-1985432-0085309\">Der Duden</a>.</i> This is the offical German style guide. You'll need a German speaker to help you find the information you need, since the book is very large and detailed. <br> <br>2. German does use italics when set in 'antiqua' type: the restriction against italics is for blackletter. However, <i>Der Duden</i> will provide details on <i>how</i> italics are used in German. <br> <br>3. The most common form of quotation marks today are opening baseline quotes (look like commas) and upper closing quotes (note: what we think of as <i>left</i> quotes). These are included in the standard character sets for Western Europe. <br> <br><img src=\"http://www.typophile.com/forums/messages/30/20927.gif\" alt=\"German quotes\"> <br> <br>Formerly, German typesetters used inward-pointing guillemet. Refer to <i>Der Duden</i> for when to use single and double quotes. <br> <br>4. Do not be tempted to extrapolate from German typesetting rules to Dutch. Hopefully someone can direct you to a Dutch resource as useful as Der Duden is for German.</p>"
    html_clean: "<p>For German: <br> <br>1. Find a copy of <i><a href=\"http://www.amazon.de/exec/obidos/ASIN/3411040122/qid=1069372888/sr=2-1/ref=sr_aps_prod_1_1/028-1985432-0085309\" class=\"link-external\">Der Duden</a>.</i> This is the offical German style guide. You'll need a German speaker to help you find the information you need, since the book is very large and detailed. <br> <br>2. German does use italics when set in 'antiqua' type: the restriction against italics is for blackletter. However, <i>Der Duden</i> will provide details on <i>how</i> italics are used in German. <br> <br>3. The most common form of quotation marks today are opening baseline quotes (look like commas) and upper closing quotes (note: what we think of as <i>left</i> quotes). These are included in the standard character sets for Western Europe. <br> <br><img src=\"http://www.typophile.com/forums/messages/30/20927.gif\" alt=\"German quotes\"> <br> <br>Formerly, German typesetters used inward-pointing guillemet. Refer to <i>Der Duden</i> for when to use single and double quotes. <br> <br>4. Do not be tempted to extrapolate from German typesetting rules to Dutch. Hopefully someone can direct you to a Dutch resource as useful as Der Duden is for German.</p>"
