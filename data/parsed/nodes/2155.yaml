    html: "<p>1. What are the Dutch capitalization norms for titles and headlines? <br> <br>None in particular. Start with a capital and then only names of \"things\", cities and people are written i capitals. <br>Or start every word with a capital - it's up to the designer to decide, not? As long as it's not an \"official\" paper for academies, research etc. there are no rules. <br> <br>2. German does not use italics, correct? Do they indicate book titles in any particular way? How about Dutch? <br> <br>In Dutch, titles are either written in Italics or small caps (rare) as far as I know. But again I think it's up to the designer really. <br> <br> <br>3. What are the best quotation marks to use for Dutch? <br> <br>More and more single quotes. Nesting: single -double/double - single. Double quotes are still alright, but I find them old fashioned. <br> <br>4. Are there any other obvious rules I should know? <br> <br>No, not for Dutch, only if you're designing research papers, medical books, encyclopedias etc. (what is the exact term for those things?) where there is a list of resources you used. <br> <br></p>"
    html_clean: "<p>1. What are the Dutch capitalization norms for titles and headlines? <br> <br>None in particular. Start with a capital and then only names of \"things\", cities and people are written i capitals. <br>Or start every word with a capital - it's up to the designer to decide, not? As long as it's not an \"official\" paper for academies, research etc. there are no rules. <br> <br>2. German does not use italics, correct? Do they indicate book titles in any particular way? How about Dutch? <br> <br>In Dutch, titles are either written in Italics or small caps (rare) as far as I know. But again I think it's up to the designer really. <br> <br> <br>3. What are the best quotation marks to use for Dutch? <br> <br>More and more single quotes. Nesting: single -double/double - single. Double quotes are still alright, but I find them old fashioned. <br> <br>4. Are there any other obvious rules I should know? <br> <br>No, not for Dutch, only if you're designing research papers, medical books, encyclopedias etc. (what is the exact term for those things?) where there is a list of resources you used. <br> <br></p>"
