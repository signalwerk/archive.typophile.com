  html: <p>I'm typesetting a catalog for a client into several languages, and I realize that I don't know enough about editorial and typographic norms for Dutch and German. If anyone could answer these questions, I'd appreciate it. <br> <br>1. What are the Dutch and German capitalization norms for titles and headlines? <br> <br>2. German does not use italics, correct? Do they indicate book titles in any particular way? How about Dutch? <br> <br>3. What are the best quotation marks to use for German and Dutch? <br> <br>4. Are there any other obvious rules I should know? <br> <br>Paul</p>
  html_clean: <p>I'm typesetting a catalog for a client into several languages, and I realize that I don't know enough about editorial and typographic norms for Dutch and German. If anyone could answer these questions, I'd appreciate it. <br> <br>1. What are the Dutch and German capitalization norms for titles and headlines? <br> <br>2. German does not use italics, correct? Do they indicate book titles in any particular way? How about Dutch? <br> <br>3. What are the best quotation marks to use for German and Dutch? <br> <br>4. Are there any other obvious rules I should know? <br> <br>Paul</p>
