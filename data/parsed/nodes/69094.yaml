    votes: null
    html: |-
      <p>I think that it is someone's version of Devinne. Not the ornamental Devinne, but the boldface of Romana that ATF created and called Devinne - and other foundries mimicked. Opti, for one, offered a version years later with the pointed top to the 'A' and downward vee of the 'M' - as well as that 'R' as an alternate.</p>
      <p>Jeff Levine's <a href="http://www.myfonts.com/fonts/jnlevine/hand-stamped/" target="_blank" rel="nofollow">Hand Stamped JNL Regular</a> is a deliberately crude and inexact version of this.</p>
    html_clean: |-
