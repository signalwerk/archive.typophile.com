      <p>Andrew, I agree the proportions of Romana look closer, but the weights of Romana that match this have a flat top on the A, and the R leg angle seems different, I think maybe A.J. is right that this is Hawtorn that has been graphically manipulated into this shape.</p>
      <p>At least all the MyFonts versions of Romana I saw had these differences.</p>
