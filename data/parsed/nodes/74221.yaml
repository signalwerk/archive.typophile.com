    <p>LeFrançois is a typeface in OpenType format based on 3 series of capitals.<br>
    It seems to be classical but some glyphs show that it's not so conventional.<br>
    It's seems to be a typical French type, that's why its name is LeFrançois (with the accent please !)<br>
    With a particular work on kerning (about 5000 !) and ligatures, you'll be able to compose words as logotypes thanks to capitals and small caps.<br>
    It will be soon available at <a href="http://www.editions205.fr" title="http://www.editions205.fr">http://www.editions205.fr</a></p>
