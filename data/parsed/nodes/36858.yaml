  html: |-
    <p>After utilising a graphically-intensive (and indeed slightly overwhelming) style for my <a href="http://www.paulwilsdon.com" rel="nofollow">portfolio</a>, I've decided to go with something in line with <a href="http://www.alistapart.com" rel="nofollow">ALA</a> or <a href="http://www.markboulton.co.uk/" rel="nofollow">Mark Boulton</a> for my latest version.</p>
    <p>I've asked around, and some have compared it to a letter rather than a website, but I think it'll make a nice and refreshing change for the layout.</p>
    <p>The content requirement of the site is as any other portfolio: Bio, Work, Blog and Contact - however - there is a 52-week <em>daily</em> entry to be filled for my industrial placement for University, and I'm attempting to make it as legible as possible (something which definately does <strong>not</strong> happen with the current style).</p>
    <p>Any comments or suggestions would be greatly appreciated, and with that I'd like to introduce myself as one of the latest additions to this fantastic resource's arsenal of designers!</p>
    <p>It seems the file could not upload using T's submission tool - the image is hosted at <a href="http://img178.imageshack.us/my.php?image=picture1sy7.png" rel="nofollow">Imageshack</a></p>
    <p>Regards, </p>
    <p>Paul.</p>
