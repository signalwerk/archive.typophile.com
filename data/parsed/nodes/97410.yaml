      <p>I’ve built several OpenType math fonts and know about italic correction in <code>MATH</code> table, but its use there is just an abuse (it is (ab)used for positioning sub/superscripts, a left over from TeX which did so to maintain a compact font format in the olden days of tight computing resources). Italic correction in TeX (outside math) is certainly applied between fonts, it is simply an amount of kern that can be applied whenever requested to compensate for negative side bearings of italic glyphs, so in TeX with <code>({\it italic f\/})</code> you get <em>f</em>'s italic correction applied, as compared to <code>({\it italic f})</code>:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/ic1_6471.png"></div><p></p>
      <p>(this is “plain” TeX syntax, higher level formats like LaTeX automate applying italic correction when switching between italic and non-italic fonts.)</p>
