      <p>In general: Italics followed by upright punctuation often cause collisions or uncomfortable gaps. Since kerning doesn’t work across fonts (and even if it did, who would think of kerning italics against roman?)  and the two styles don’t necessarily space well, I usually set the punctuation in italics in these cases. It is a structural hack, but it looks a lot better. This is not a one-size-fits-all approach. Sometimes it is more important to communicate a clear structure.</p>
      <p>For the special cases: I don’t know about any rules, but I would at least italicize posessive s. I tend to end the italizing at the next wordspace.</p>
