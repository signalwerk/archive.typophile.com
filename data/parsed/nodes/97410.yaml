  html: <p>In my writing and editing, I italicize punctuation adjacent to italic words, i.e., periods, commas, quotation marks. However, in the the case of possessives, I don't know if the following /s/ should also be italicized. What are the "rules" about italics and punctuation by themselves, in quotes, and within parenthesis? Any other guidelines? TIA.</p>
