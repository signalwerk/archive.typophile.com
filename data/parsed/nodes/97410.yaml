    html: <p>Just to throw another style guide into the mix, Bringhurst says to italicize any punctuation following a word in italics. But he also says that parentheses and brackets should essentially never be italicized, even in the midst of italic text. He traces this to the "roman" forms of parentheses in Renaissance italic faces. You can choose whether to buy that or not.</p>
