      <blockquote><p> it perplexes me how, after all those years, this concept is not adopted by other systems or font format (a fellow TeXnician was very surprised when he learnt that OpenType does not have italic correction, he just couldn’t understand how people dealt with that).</p></blockquote>
      <p>Well, actually OpenType does have a way of handling this via the [MATH] table, wherein there is Italics correction. This isn't really implemented the same way as TeX, strangely, but that is another story. There is also the notion of cut-ins/outs for kerning purposes which would can also serve a similar function. Mind you, this wouldn't address the issue talked about here, which is more to do with being able to kern between fonts, which we can't do at the font level. Of course, mathematics typeset using proper Unicode-encoded text would infer a font that has the math italics in the same font as the regular glyphs. The math italic glyphs themselves would usually have differing spacing (and perhaps even glyph shapes) then would their 'normal' italic counterparts—all these constituents together allow for the proper spacing of text within a math context, but doesn't really help if the font doesn't support math layout (or if the typesetting environment doesn't either). There was talk of actually implementing a means of interaction between fonts (in terms of dynamic spacing) within an OpenType Math environment for inline maths (as opposed to display maths), but I don't know that its been implemented anywhere yet.</p>
