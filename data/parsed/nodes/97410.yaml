    html: <p>TeX had the concept of <em>italic correction</em> for almost 30 years now; it is a property of the glyph specifying how much space is applied after italics when followed by uprights, it can be also triggered manually using special command (actually it is not limited to italics, it can be applied to any glyph), it perplexes me how, after all those years, this concept is not adopted by other systems or font format (a fellow TeXnician was very surprised when he learnt that OpenType does not have italic correction, he just couldn’t understand how people dealt with that).</p>
