      <p>While I’m not a professional type designer, this debate to me seems to be very similar to the war that is currently being waged in the music industry. </p>
      <p>Metallica stood up and decided that Napster and other file sharing programs were illegal and stole profits from the artist and the music industry. What this did was ruin a huge potential (and might I add “free” marketing tool) to be utilized by both artists and record companies. Many of us who downloaded songs for free had the full intention of making actual music purchases. Song downloads could have been seen as “samples.” </p>
      <p>When Metallica “banned” myself and many others from Napster, (their songs I downloaded to see whether I was going to purchase their back catalogue of albums) I vowed never to purchase ANYTHING by Metallica as long as I live, and I still haven’t.</p>
      <p>Artists that are on major labels are getting raped by record companies because they’re stealing money from artists that they attribute to loss by illegal downloading. Consumers on the other hand (now I believe more than ever) pirate music as a backlash against record companies for putting out crap music and/or charging too much for it. Record companies are still losing money...</p>
      <p>Moral of the story: “dogma can destroy you.”</p>
