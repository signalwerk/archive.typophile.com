      <p>&gt;Horse ——.</p>
      <p>There seems to be some misunderstanding about the way the font business works.</p>
      <p>It’s organized around licence agreements, which are a form of legal contract. Not a perfect system, but it’s what we have.</p>
      <p>The person, or company, who writes a licence agreement can put any conditions they like in it. For instance, they could decide that licensees only be allowed to use the font if they’re wearing a paper hat. You might think that’s unreasonable, but if those are the terms of the agreement, and you don’t agree, you should licence your fonts from a different foundry. </p>
      <p>Hrant, Gerald, you seem to believe that users should be free to disregard whatever terms of a contract they consider unreasonable. That’s a slippery slope. The system is un-policed as it is (which does little to discourage abuse) so behavior is determined by social contract. Yes, people cheat, but at least let’s try and keep up appearances and not legitimize it, otherwise minority vices become mass habits.</p>
      <p>I agree with you that being allowed to modify the fonts which one has licensed is a good idea, which is why I permit it in my EULA, as do many other foundries. However, there are those who don’t, and that’s their prerogative.</p>
