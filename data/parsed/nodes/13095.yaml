      <p>According to Tiffany’s chart (Type Foundry EULAs: who allows what), most foundries allow modifications.</p>
      <p><a href="https://web.archive.org/web/20080829191852/http://fontlab.wikidev.net/The_Case_for_a_User-Friendly_EULA" title="http://fontlab.wikidev.net/The_Case_for_a_User-Friendly_EULA">http://fontlab.wikidev.net/The_Case_for_a_User-Friendly_EULA</a></p>
      <p>The concomitant stipulation is that any modified font can only be installed on a device which is licensed for the original. So the client commissioning the modification pays for licensing the original font, and the modification fee. This is reasonable, because the modification fee is paying for their exclusive custom version of the font.</p>
      <p>I’ve had this kind of work done on my fonts, and I’ve done it on fonts designed by others: for instance, for newspapers, headline or agate versions of “standard” fonts. My client could have contacted the original foundry, but was confident in my ability to do the work adequately, on time, and reasonably priced. No doubt the original foundry could have done it just as well, or better, but for my client they are an unknown quantity.</p>
      <p>However, I would never mess with the beziers of a font from Font Bureau, or any other foundry that prohibits it in their EULA. They are not being unreasonable, merely setting the terms of a contract which potential users can take or leave, and other font workers are legally bound to observe, no matter what they think of it. It’s not just a question of obeying the law, but of mutual respect amongst designers.</p>
      <p>There is a difference between civil disobedience such as speeding (citizen vs. state) and disrespecting the Bureau (citizen vs. citizen), which is a small design firm, not exactly what you’d call “those in power”, Hrant.</p>
