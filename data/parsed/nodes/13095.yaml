      <p>Or more problematic still, what if he’s mental?</p>
      <p>Hrant, I have a problem with this. I recall you posting this opinion here before, that it is okay to ignore an author/creator’s copyright if the author/creator is unreasonable.</p>
      <p>My problem is that “unreasonable” is too relative. Just because you, or anyone else deems a person “unreasonable,” that doesn’t automatically make them so. There are many computer users who think that all protection for fonts are unreasonable. Who is to sit judgement of the question of what is reasonable for all cases, and what is not?</p>
      <p>There may be designers who find your protection clauses unreasonable. How would you feel if Patria got out, and innumeral derivations of its design, some under other names attributed to other designers, began to circulate? I doubt that you would find it reasonable when others made cash from your efforts.</p>
      <p>That is the problem with terms like “reasonable” or “mental”.</p>
      <p>Either we are going to respect coppyright and EULAs or we aren’t. I’m not saying that there shouldn’t be dialog within (and outside of) the community about what EULA terms should be. But to say that EULAs which are “unreasonable” may be ignored will lead to big problems.</p>
      <p>If users find an EULA unreasonable, they should license type from someone else. Our field is not without competition, or change due to market circumstances. Those with unpopular EULAs will eventually get the message if their licensing numbers drop off drastically.</p>
      <p>__<br>
      <a href="https://web.archive.org/web/20080829191852/http://www.typeoff.de/" title="www.typeoff.de">www.typeoff.de</a></p>
