      <p>And Nick, the smaller you are (and you and I are both small) the more it’s plain dumb to blindly bend over for the system. Speaking of plain dumb, pragmatically, in the end it’s plain dumb to put a no-mods clause in a EULA. If your hubris or confusion about human nature cause you to be plain dumb*, hey, the most -and least- others should do is feel sorry; but just know that you’re the one who will suffer most for it.</p>
      <p>* Nevermind that you totally ignore the question of why you don’t have such a clause while some other houses do. Certainly the products and clientele aren’t always totally different. Is it too much to think about? Or perhaps the results of your thoughts would put a hole right through your formal legal absolutist facade... People can sense what not to think about - it’s called a coping mechanism. Some of us are lousy at that though; we feel dirty about looking the other way.</p>
      <p>Most tellingly, let’s try to figure out why font houses have gone back and forth about putting such a clause, while their product and clientele hasn’t changed. When were they right, when were they wrong? Oh, I forgot, A Business Is Never Wrong - it’s always the customer’s fault (since his lawyers are worse). What’s histerical of course is that this goes against a central tenet of Capitalism: The Customer Is Always Right. In the end, it’s neither. The truth is, The Customer Is Always Duped, And Made To Never Even Realize It.</p>
      <p>hhp</p>
