      <p>Parker</p>
      <p>I often have to modify a font a bit if I am going to use it for letterpress or if for normal print, to provide for different weighting.</p>
      <p>Minion was available as a MM font once upon a time and multiple masters did anticipate user interaction in regard to manipulating a font. </p>
      <p>I realize that a lot of type foundryes these days indicate in their terms of contract that you are not to modify a font but hey, I paid for Fontographer and FontLab and the right to use the PostScript or TrueType or OpenType formats just like they did.</p>
      <p>You don’t have to go too far back in type technologies to realize that all type design is tied to format or delivery device. And the owner of that has the real say about it all. Prior to 1986 you literally had to “submit” a design to ITC if you wanted your typeface out there (no other options).</p>
      <p>Reselling or redistibution of a font is a no no clearly but modification, nonsense. Hell I can modify a font by adjusting the software in my printer.</p>
      <p>Gerald</p>
