      <p>I don’t think anyone objects to what you’re calling “internal modification,” but I don’t think this is what’s being discussed here. Certainly anyone who buys a font to use on a book cover or a CD is welcome to have at the font with hammer and tongs; I’ve certainly seen my fonts adapted in any number of ways, some of them OK, some of them brilliant, and some of them not so brilliant. That’s the bell curve for you.</p>
      <p>The issue is “redistribution,” as you put it. The clients who call us beginning with “we love Minion, but...” — as described in the first post in this thread — are the ones who want to populate a large design system with “customized” fonts. In my experience, these include everything from fonts with a few serifs snipped off, to fonts whose only change is the font name and the copyright legend. This is not OK, and it’s not a question of relativism or personal morals: it is against the law.</p>
      <p>In the seventeen years I’ve worked in this industry, it has been my consistent experience that organizations understand this without the need for legal intervention. Anyone interested in customizing their typography is serious about branding, and anyone serious about branding has legal counsel familiar with intellectual property law.</p>
    html_clean: |-
      <p>I don’t think anyone objects to what you’re calling “internal modification,” but I don’t think this is what’s being discussed here. Certainly anyone who buys a font to use on a book cover or a CD is welcome to have at the font with hammer and tongs; I’ve certainly seen my fonts adapted in any number of ways, some of them OK, some of them brilliant, and some of them not so brilliant. That’s the bell curve for you.</p>
      <p>The issue is “redistribution,” as you put it. The clients who call us beginning with “we love Minion, but...” — as described in the first post in this thread — are the ones who want to populate a large design system with “customized” fonts. In my experience, these include everything from fonts with a few serifs snipped off, to fonts whose only change is the font name and the copyright legend. This is not OK, and it’s not a question of relativism or personal morals: it is against the law.</p>
      <p>In the seventeen years I’ve worked in this industry, it has been my consistent experience that organizations understand this without the need for legal intervention. Anyone interested in customizing their typography is serious about branding, and anyone serious about branding has legal counsel familiar with intellectual property law.</p>
