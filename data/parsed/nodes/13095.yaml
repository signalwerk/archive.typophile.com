      <p>Here is where old battle lines have been drawn.</p>
      <p>On one side, the designer of typefaces.<br>
      On the other side, the “expert” user of typefaces, sometimes referred to as typographer and/or type director.</p>
      <p>I’ve sat (or sometimes stood in pubs) between typographer and designer as they argued the point. For my part I am closer to being a typographer and have never drawn a single character that was ever released.</p>
      <p>The “expert” user is never content to leave alone what irritates them visually. And the type designer simply can’t please everyone.</p>
      <p>It’s just one of those relationships that you may not like, but I feel it keeps the art alive.</p>
      <p>Other than that, it simply isn’t practical or downright impossible to go back to the original designer for modifications. Once a typeface has moved through one, two or several re-cuts over years or even centuries, the “original” designer’s intent may have been lost completely. That’s why I used to examine earlier specimens of third-iteration typefaces, not to nit-pick but to try and understand the original intent of the designer.</p>
      <p>For some people it’s a sin to leave well enough alone.<br>
      Hmmm... I think this sauce needs a little more basil. How could that chef miss something so obvious as that?</p>
      <p>—————————————————-<br>
      Yes, I’m old, but I pick nits too!</p>
