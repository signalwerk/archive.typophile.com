      <p>What is “serious”? If it’s the ability to make money, I don’t think your argument holds water, since companies richer than the ones you would consider “serious” do that all the time. And if it’s not about money, then is it about typographic integrity? That’s also problematic, because of the cultural deficiencies in the concept of intellectual property, especially in something as inherently derivative as type.</p>
