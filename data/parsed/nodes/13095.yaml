      <p>Hrant is not quite right. Anyone customizing a digital outline absolutely has an obligation to abide by the license issued by the owner of that digital outline. EULAs differ from one foundry to the next, but most include some express policy regarding what may or may not be done to create “derivative works” from font data.</p>
      <p>On a personal note, I agree with Tiffany that modification is indeed a cop-out. The client who wants Helvetica, but “an ownable Helvetica” that’s “unique to our brand” should be dissuaded, since the result inevitably looks like Helvetica wearing a funny nose.</p>
