      <p>Without getting too deep in history, many corporations and countless high-end publishers of books and periodicals had one or several type families customized for their particular use.</p>
      <p>It’s the difference between “off-the-rack” fashions and tailor-fit clothing. Generally, “out-of-the-box” solutions need a certain amount of tweaking in order to be really good. By customizing widths, kerning pairs, character shapes, you cut down on the need to tweak and produce quality typesetting with uniformity and consistency.</p>
      <p>The purpose is not to create a new variation of the typeface. It’s to improve the output.</p>
      <p>———————————————————<br>
      Yes, I’m old, but I’m back in style!</p>
