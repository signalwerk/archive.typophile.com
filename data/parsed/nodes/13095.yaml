      <p>&gt; Anyone customizing a digital outline absolutely has an obligation<br>
      &gt; to abide by the license issued by the owner of that digital outline.</p>
      <p>And everyone driving a car is supposed to not exceed the speed limit even by one mile-per-hour. But the cops will <strong>never</strong> give you a ticket for that, and a court will throw out such a case. So the reality remains that it is <strong>unreasonable</strong> to expect full de facto adherence to the letter of the law. It’s all psychology, not a box.</p>
      <p>Clearly, there is a difference between the letter -or even the spirit- of the law, and how <strong>humans</strong> are really expected to behave. This discrepancy is natural considering that the law is designed to protect those [already] in power. Please, no hogwash about the law being intended to serve the People.</p>
      <p>Human beings are not modules in a computer program.</p>
      <p>&gt; “unreasonable” is too relative.</p>
      <p>Hey, <strong>Life</strong> is “too” relative. We have to live with that, quite literally! Every moment of every day we make entirely subjective and personal decisions. This is just another one of them, no matter how much the lawdogs try to intimidate us.</p>
      <p>&gt; How would you feel if Patria got out, and innumeral derivations of its design,<br>
      &gt; some under other names attributed to other designers, began to circulate?</p>
      <p>I have never advocated <strong>redistributing</strong> fonts, modified or otherwise. <strong>That</strong> is beyond reasonability; <strong>internal</strong> modification is not. The <strong>attempt</strong> at preventing internal modification is a scare tactic that can only backfire on the font house itself, because the main thing it does is place an unreasonable demand on the user, leading to a near-automatic violation of the clause, creating a precedent of de jure “misbehavior” in the user, in turn making him more comfortable carrying out further (less justifiable) violations. It’s bad for everybody, no matter how attractive draconian modernism is (to some people).</p>
      <p>&gt; Either we are going to respect coppyright and EULAs or we aren’t.</p>
      <p>Nope, I’m shades of gray, not black or white. You do what you think is right, I do what I think is right. I’m sorry if that’s Bad For Business.</p>
      <p>hhp</p>
