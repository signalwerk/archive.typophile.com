    html: <p>I'd go with FF Scala. Modern, yet humanist. Legible and robust even in small print, and the option to also use the sans serif. Clarendon might also be a good choice, but the design has to be specifically retromodern for that.  <br> <br>Why not Mrs. Eaves... it's a nice typeface.  <br>tribute and Filosofia also spring to mind... and what was that fishbook font font from mvb... although maybe that is a bit TOO heavy on the classic touch. </p>
