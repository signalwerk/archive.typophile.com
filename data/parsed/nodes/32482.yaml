      <p>Shaun, you simply need to tell your boss not to hanker after what she can't afford; if her idea of achieving economy is to have you spend your weekends cleaning up inferior faces in fontforge, then maybe she has some undeclared vices of her own...</p>
      <p><em> ...educate the people...</em> my students often download dodgy free fonts in an attempt to save on time, effort or money; when I tell them to turn the downloaded font into outlines, the application they're using invariably crashes, taking their (unsaved?) project work with it. Usually it only takes a couple of instances of this before they get the idea.</p>
