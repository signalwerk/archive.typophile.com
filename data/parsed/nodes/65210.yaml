  html: |-
    <p>After 10 years of waiting and using madtype.net, I have finally acquired <a class="freelinking external" href="http://www.madtype.com" rel="nofollow">madtype.com</a>. I'm very excited to finally have this URL and have updated my website to be integrated with wordpress. This will mean more content, searchability, and timely updates.</p>
    <p>I'd also like to announce my new typeface, Hessian. Inspired by motorcycle culture, the circus, heavy metal, and old tuscan wood type, Hessian will rock you.</p>
    <p>Available now at <a class="freelinking external" href="http://www.myfonts.com/fonts/madtype/hessian" rel="nofollow">Myfonts.com</a> and <a class="freelinking external" href="http://www.youworkforthem.com/product.php?sku=T0419" rel="nofollow">YouWorkForThem</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/hessian_01_4148.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/hessian_02_4024.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/hessian_03_6106.jpg"></div><p></p>
