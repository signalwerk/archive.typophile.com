      <p><em>I doubt if one should call M. F. Benton a type designer. Did he ever lift a pencil, seriously?</em></p>
      <p>The types didn’t design themselves.<br>
      Labour can be divided in many ways, but it’s customary to attribute authorship to one person in a creatively decisive position. In advertising and films, such “auteurs” are called directors, but in other disciplines they are called artists and designers, whether or not they do any of the heavy lifting themselves.</p>
      <p>As an engineering graduate, MFB had an appropriate education in designing and drafting—a training geared to directing others in drafting and executing his ideas. So, within the corporate environment of an industrial enterprise like ATF, with its integration of product development, manufacturing and marketing and its hierarchy of job functions, the question of how he wielded his pencil is moot.</p>
    html_clean: |-
