      <p>I understand that Erik Spiekermann works more as a director of others than one who actually pulls bezier handles himself. I would certainly still count him as a designer of type. Even if this is not the most often chosen way to work in our time, it is still valid and viable. I’ll give MFB the same nod and call him a type designer as well. Renaissance painters had collaborating staff to complete the master’s work, too. Why not type designers?</p>
      <p>ChrisL</p>
