      <p>James M.” “Which do you prefer?”</p>
      <p>Well, this is a very tough question. </p>
      <p>Caslon’s 36pt cap A is the printing of a thing...and is, while the Cloister Black drawing is a picture of things... to come. </p>
      <p>I hate the scaling of Cloister Black’s uppercase, and I love the olde hot metal. </p>
      <p>That MFB’s A is road kill compared to Caslon’s, is a good point, but the point in the context of my part in this thread is — MFB “had to” make an A design that could scale to a range of sizes, in ATF’s foundry. Even if a letter does not “work” for all users and uses, it still had to be made somehow. See, (I’m looking at the whole range in the 1912 book), he’s bashed this letter to save the whole typeface, it’s precious.</p>
      <p>My guess is, if You were to properly execute a scaleable version of Caslon’s A’s (6-72 pt)(and we can blessedly forget about the mental chaos of a machinable version now that we have digital), there would be a graceful opening of the top, in conjunction with refloating of flags and twisting of terminals, as the size went down, to expand and preserve that little baby triangle, diminish the complexity of the 5-way intersection up on its head, and broaden the body... that, is what I’d prefer. </p>
      <p>Cheers!</p>
