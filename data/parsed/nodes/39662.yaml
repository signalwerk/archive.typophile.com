      <p>&gt;Is that observation of the C yours or Juliet’s? It’s a nice one in any event.</p>
      <p>That’s one of many similar observations in Doyald Young’s wonderful book “Fonts and Logos”. —I expanded a bit on it. </p>
      <p>Young is wonderfully perceptive on how the details of a letter contribute to or detract from how letters work together, and in particular how variation in form can enhance even color. And he shows in re-drawing type for logos how the unity can be enhanced when you have the freedom to alter characters for the best look of a specific word. I have to thank Hrant for singing the praises of this book, as I got it because of that, and it is one of the handful I have learned most from about type. </p>
      <p>&gt;From what I can gather about his mode of work, I doubt if one should call M. F. Benton a type designer. Did he ever lift a pencil, seriously?</p>
      <p>Oh-oh, you are getting the acidity of a real Typophiler :) </p>
      <p>Why can’t Benton have been both a type director and a type designer? What exactly about how he worked leads you to think that he never picked up a pencil? I would think if he had a drawing office for new fonts he would draw a few key characters—such as “agone CHORD”, and then correct others’ drawings as they made the drawings based on these models. If he had an existing design, like Bodoni, then he might just blue pencil the original. But for a new design this wouldn’t be enough. </p>
      <p>Designs like Clearface and Franklin Gothic I thought were new designs, and in any case these clearly have been carefully thought through down to the smallest detail. Somebody *designed* these faces, and if not Benton—who claims to have designed them in the volume Juliet shows slides of—who did?</p>
