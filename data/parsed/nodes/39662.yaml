      <p>James. that was great. Thanks very much! RE: the A. I think making the inside white of the A bigger was smart even though it flies in the face of the scribal tradition. I say it’s ’smart’ in the sense that it confers some advantages; not that it is somehow universally ’right’. I think the advantages are that the larger opening may help recognition of the A by a person who is less familiar with this style of lettering. I know that it took me a long time to learn to recognize what certain blackletter caps were and I still have a rough time with some of them. I think that the result of his change is a a sort of Roman A in Blackletter clothing. I can see where that would sell more Cloister for Ads. And to echo previous comments I think it probably did help to resist in buildup. It is striking how the new composition does make your eye cycle around it very smoothly and over &amp; over. The old one holds my eye up at various points.</p>
      <p>I also think the little teardrop at the far lower left is interesting too. In the original it isn’t so important because of where the weight of the letter is - mostly on the right - but with the new distribution the need for support moves to the left and the teardrop has to be beefed up.</p>
      <p>RE; Being a designer. Even if Benton did not do the drafting, if his ideas were being expressed in the design I am willing to consider him the designer.</p>
      <p>I agree that the idea that MFB’s type is often a little too smooth is borne out in this example too. It is a little pasteurized somehow.</p>
      <p>Although in his defense I have to say that I think Franklin Gothic has an impish soul that I have often wondered over and admired.</p>
