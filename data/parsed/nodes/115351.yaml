    html: |-
      <p>You nailed it, it s the exact font, the A and R are actually lower cases.</p>
      <p>The old free Bitsumishi is also usable, the font was stretched horizontaly + 162% for that logo .</p>
      <p>Second line (BIOSYSTEMS) seems to be Helvetica LT Std Roman with tracking at +600 and horizontal stretch similar to the bitsumishi (Which show that Helvetica is really everywhere....)</p>
      <p>Thanks a lot</p>
      <p>ps: i was able to pretty much replicate the logo thanks to bowfinpw<br>
