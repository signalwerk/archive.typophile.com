    <p>Hello,</p>
    <p>is it just a bug of my FL5 Studio?<br>
    I can’t get FontLab to generate a .otf font from the same .vfb file i can generate a .ttf file with. It doesn’t give me any warning, FL just freezes at 92% while trying to generate the .otf font. I tried to save the .vfb file under a new name. It still generates .ttf but not .otf. How can i detect what’s wrong?</p>
