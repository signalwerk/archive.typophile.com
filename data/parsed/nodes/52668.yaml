    html: |-
      <p>Jürgen, </p>
      <p>if your font is very repetitive (e.g. consists just of dots or squares), then the subroutinization can take a really long time, sometimes 20 minutes, and for a large font even more. The result then is a very small font but well, the generation takes time. This is how it works, it's not a "problem". </p>
      <p>But if you don't care much about the font size, then you can turn of the subroutinization and the generation process will be much faster. </p>
      <p>In fact, Mac OS X 10.4 sometimes has problems with heavily-subroutinized fonts so actually it may make sense to turn it off altogether. </p>
      <p>Regards,<br>
      Adam</p>
