    html: |-
      <p>Yes, actually, the bug in Mac OS X is very annoying. After all, the point of the compression through subroutines was to get the smallest possible size, and this worked especially good in fonts with repetitive elements -- but such fonts actually "bomb" in Mac OS X 10.4 if using the compression. </p>
      <p>So basically, whenever you'd theoretically get the best possible results using the compression, you actually have to resign from the compression at all.</p>
