    votes: null
    html: |-
      <p>Blimey - it worked! :)</p>
      <p>I had two fonts that had all sorts of strange behaviour in OpenType format (on MacOSX 10.4), but worked fine in TrueType. Yes, both fonts contained repetitive elements, and I suspected that was somehow the culprit. I though I had tried turning off "subroutine compression" before generating too, but I probably had some remnants in some cache or something...<br>
      I tried unchecking and regenerating now, and both fonts work fine :)</p>
      <p>I have upgraded to 10.5 in the meantime, so that may have helped, though...</p>
      <p>Yes, the file size balooned, but at least the fonts work!<br>
      Lesson learned: turn off subroutine compression before generating OpenType fonts with very repetitive elements.<br>
      Thanks! :)</p>
