    html: <p>Ye Olde Compugraphic Power Page system was hard to beat. It used a modified flavor of SGML code, which made learning HTML subsequently a snap. And it had some features which even the best WYSIWYG layout programs lack today, including Auto-Tabs and precisely-controllable vertical justification.</p>
