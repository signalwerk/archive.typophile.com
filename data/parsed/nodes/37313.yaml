    html: <p>In Grade 6 I started typing school projects on my Mom’s three-ton L.C. Smith manual typewriter. Often I experimented with narrower columns of type pushed to one side, with drawings, etc., in the space created. Page numbers I’d embellish with coloured pencils with a graphic suitable to the topic. More effort usually went into the design of my projects than the research. I’d spend two weeks designing a cover and one night actually writing the text. For Christmas in my last year of high school I got my own typewriter—-a Smith-Corona manual portable. With that I figured I had university beat hands down! How times have changed!</p>
