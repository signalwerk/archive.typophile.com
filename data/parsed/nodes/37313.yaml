    html: <p>I originally had Quark 3.31 on a Mac LC, back in the “old” days, and loved it—in fact, I still have it on that computer and occasionally use it. The program was very intuitive. But of course you know what happened to Quark, and eventually I switched to InDesign CS on my G3 so that I could have updated typesetting features that Quark wasn’t offering yet. After Quark 3.31, InDesign seemed like some Microsoft program—clunky as all get out. I still haven’t got totally comfortable with it after three years of daily use. I might just go back to Quark. Hopefully InDesign CS3 is better. The printers I use accept either Quark or InDesign, and most now prefer pdf anyway.</p>
