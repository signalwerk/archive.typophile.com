    <p>’ello all</p>
    <p>I was curious as to what type gurus like you use as their main typesetting/layout program? I have been using Adobe’s Indesign for like 4 years now and i’m pretty comfy and settled with it as it gives total control over type features. I cannot see any other software atm that matches it, even newest of Quarks, imho.</p>
    <p>And if anyone has made the upgrade to version CS3 of Indesign, is it that much of a revolution over CS2?, considering that i need to upgrade to an intel-based Mac for the program to run smoothly or whatever...</p>
