      <p>I have recently started using InDesign CS3 at work (CS2 at home).<br>
      I haven’t found many standout features yet –&nbsp;this is probably because so far I am just using in in the same old way ... I’m sure there are some major advances I haven’t found (and may never find), but it’s only been a few weeks.</p>
      <p>I prefer the new interface in the CS3 versions of Photoshop, Illustrator and InDesign (Illustrator hasn’t changed as much as the others).</p>
      <p>CS3 runs fine on older PPC Macs, it’s ’Universal’ so it runs natively on both PPC and Intel.<br>
      I’m using a 3.5-year-old PowerBook (1GB RAM) and it works perfectly.<br>
      From friends I have talked with, the main reason to upgrade is if you already have an Intel Mac, because CS2 runs like a dog on them.</p>
      <p>However, if you need to persuade someone that you <em>need</em> a new Intel Mac then I’ll keep quiet ...</p>
