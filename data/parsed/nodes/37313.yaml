      <p>Since I work on InDesign, I’m not going to give my subjective opinions. However, I can say that version CS3 is basically the same speed as CS2 on the same machine. The Intel Macs do run faster than PPC Macs, so it appears as if InDesign CS3 runs “smoother” on them, but you won’t see much difference on the same machine.<br>
      The new features are listed at <a href="http://www.adobe.com/products/indesign/upgrade/" title="http://www.adobe.com/products/indesign/upgrade/">http://www.adobe.com/products/indesign/upgrade/</a> .<br>
      Some text-related details that aren’t called out are: CS3 handles OpenType mark positioning and justification of marks better than CS2 and composed Unicode works better — these help Vietnamese and Thai. We also improved our handling of some obscure polytonic Greek details.</p>
    html_clean: |-
