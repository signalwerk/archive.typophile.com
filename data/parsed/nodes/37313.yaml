      <p>For those who haven’t upgraded from InDesign CS2 to CS3, the major new feature — IMO — is the Table and Cell Styles. They’re still not perfect, but they add a whole new layer to production of table-heavy documents. For documents that I need to keep in CS2 format for some reason, I often build all the tables in CS3, then break the links to the styles and export the document to INX, then re-import into CS2: perfect tables in much less time.</p>
      <p>CS3 runs peachy on my PPC G5, btw. In my experience, it’s CS2 on Intel Macs that is the “problem child.”</p>
