    html: <p>I think all of the slightly irregular things in the logo (the loops' balance, the n slant) actually contribute to it's 'authenticity', it'd look too mechanical if everything slotted together too well IMO. <br> <br>That said, I would maybe bring the H loop down a little, so that the left stem of the H has a bit more length to it -- this may help the balance a little too without looking deliberate! <br> <br>Jordan</p>
