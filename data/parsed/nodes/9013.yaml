    html: "<p>All right, I think I owe another update. As you can see by the posting dates, this isn't a rush project! <br> <br>I gave Henry four different \"directions\": <br><img src=\"http://www.typophile.com/forums/messages/29/67763.gif\" alt=\"directions\"> <br> <br>He chose the third idea. I'm pretty sure at this point that we'll be using a gold decal. The area for the logo on the guitar is fairly small - roughly 8p x 3p. The pegs &amp; hardware will be metallic gold, and the wood is a fairly dark brown. After many adjustments, including redrawing the grid, here's what I came up with. <br><img src=\"http://www.typophile.com/forums/messages/29/67764.gif\" alt=\"whattya think\"> <br>Since the gold lettering will show up lighter than the brown wood, the reversed logo is probably more accurate. But there's both. <br> <br>What do you think? <br> <br>Thanks <br>Brian</p>"
