    html: <p>You may want to consider the shape of the peghead and its interaction with the design of the logo (mind the washers that hold the tuning keys in place).  <br> <br>Also, see if the maker uses the same color tuning keys all the time (gold, chrome, ivory finish etc.). I've found guitarists are sometimes sensitive to everything matching, or at least coordinating on their instruments.</p>
