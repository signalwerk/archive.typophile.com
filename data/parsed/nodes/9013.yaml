    html: <p>The last concept feels very 'Fender' -- I know that technically it's not very much like the Fender logo at all, but it does have that feeling about it. <br> <br>If it's blues they're playing, maybe you could go back to some classic blue-style inspiration. Think dirty, rough, customised, worn; the blues to me (I'm a big fan) is all about feeling, emotion, empathy; try and get some blood, sweat and tears into the logo. I know that's all a bit clich�d and abstract, sorry <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>On the other hand, as Tiffany says, you should probably not try and put too much character (of the music) into the logo, as it'll pigeonhole it too much. <br> <br>I do actually like the scripty logo -- maybe you could echo a fretboard somewhere in all the vertical strokes (particularly the 'H'). Just watch you don't go too 'Rock Caf�' ;)</p>
