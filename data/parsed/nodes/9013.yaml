  html: <p>Hi, <br>The logo will go on the heads of the guitars, and is the first name of the guitar maker. The woods are generally dark so I'm picturing this in white or cream, although if I can figure out how to get it to look good in metallic gold, I might go that route. Anyhow, after some sketching, I've cleaned up my favorites a little and here they are. Please let me know what you think, and I'll rework the best ones some (well, a lot) more. <br>Thanks, <br>Brian <br> <br><img src="http://www.typophile.com/forums/messages/29/64445.jpg" alt="guitar logo roughs"></p>
