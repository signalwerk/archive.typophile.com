    html: "<p>I almost didn't mention any names because I don't want to have too specific of a feel. The main thing is that it will go on acoustic guitars that don't need amplification. Some other ideas I'm trying to go for are: natural, man-made, and quality. <br> <br>This version is an angled script like D'Aquisto, Fender, and Gibson. I think the logo should look like a guitar logo, but hopefully it can still be unique.  <br> <br>I'm also concerned about the loop in the H and the loop in the y balancing. Also the n is not at exactly the same slant as everything else (it's baroque! -er, not really) so that the left stem of the n didn't get too clogged up where it meets the e and the stroke at the top of the n. I took out a small wedge at the top of the n to help. I'm not sure how much this will come into play if we need to screen it. But maybe this non-perfect angle makes it seem less mechanical. <br> <br>I do still want the final logo to feel personal and have some character even though I might not be going directly for 'blues'. So I just might end up giving it some texture, as long as it doesn't take too much away from any quality aspect.</p>"
    html_clean: "<p>I almost didn't mention any names because I don't want to have too specific of a feel. The main thing is that it will go on acoustic guitars that don't need amplification. Some other ideas I'm trying to go for are: natural, man-made, and quality. <br> <br>This version is an angled script like D'Aquisto, Fender, and Gibson. I think the logo should look like a guitar logo, but hopefully it can still be unique.  <br> <br>I'm also concerned about the loop in the H and the loop in the y balancing. Also the n is not at exactly the same slant as everything else (it's baroque! -er, not really) so that the left stem of the n didn't get too clogged up where it meets the e and the stroke at the top of the n. I took out a small wedge at the top of the n to help. I'm not sure how much this will come into play if we need to screen it. But maybe this non-perfect angle makes it seem less mechanical. <br> <br>I do still want the final logo to feel personal and have some character even though I might not be going directly for 'blues'. So I just might end up giving it some texture, as long as it doesn't take too much away from any quality aspect.</p>"
