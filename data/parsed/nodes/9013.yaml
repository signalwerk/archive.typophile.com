    html: <p>I asked a few questions, and he (Henry) doesn't ever plan on making electric guitars. I haven't asked about tuning key colors but I will soon. <br>He and his friends basically just play classical guitar music, like maybe something you'd hear from eric clapton. Some fingerpicking, but also using a pick, or strumming by hand. Nothing heavy, and nothing country. I do think the middle two are off because of this, but I'll try a few more revisions on just the middle-left one.  <br>I think the bottom left may end up being the best so I'm saving it for last - I think the single-stroke E would mirror the R really well. <br> <br>In the meantime, here's an update on the first one. Thanks again for all the thoughtful comments! <br> <br><img src="http://www.typophile.com/forums/messages/29/64683.gif" alt=""></p>
