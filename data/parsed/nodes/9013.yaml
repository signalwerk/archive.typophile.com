    html: <p>My next revision is below (f). While looking at the fi (good catch!), I also noticed that the 'ry' ligature is too tight, creating an optical illusion almost (The further back you are when you look at it, the more you can't tell where the r ends and the y starts). In (b), I tried making the r-y joint rounded, but pulling the pen back inside helped define the r, especially at small sizes, so in the last version (f) I redrew the joint so that it was the same style but spread apart more. <br> <br>(a) is the version from the last post. (c) and (d) show two versions of the h, to get rid of the appearance of "fi". <br> <br>I also spaced the letters out more. This helped them match up with the new 'ry' spacing and also made them easier to identify. <br> <br>The letters involve a few sharper angles where previously there were curves. Also, the first downstroke on the h, n, and r have a bit of a flair, and this also happens on the upstroke of the y. I know this still doesn't have the personality of some of the previous logo versions, but hopefully that at least gives it something. <br> <br>Lastly, I leveled out the bottoms (e) where before I was keeping the 45� pen angles. It takes it a step away from calligraphy but I like the cleaner line. <br> <br>Also I did want to try a cap H. I sketched &amp; scanned - do you think it is worth pursuing? Is it too feminine? If not, I'll work with it. I do like the way it looks initially. (har) I expected the H to throw off the balance more, but I don't think it is. .. ? <br> <br>Thanks again for any comments about the revisions, or future suggestions. <br> <br><img src="http://www.typophile.com/forums/messages/29/69356.gif" alt="boring chart"> <br> <br><img src="http://www.typophile.com/forums/messages/29/69357.gif" alt="a cross between Mezz &amp; Banshee!! Nope, it's just my cruddy sketch"></p>
    html_clean: <p>My next revision is below (f). While looking at the fi (good catch!), I also noticed that the 'ry' ligature is too tight, creating an optical illusion almost (The further back you are when you look at it, the more you can't tell where the r ends and the y starts). In (b), I tried making the r-y joint rounded, but pulling the pen back inside helped define the r, especially at small sizes, so in the last version (f) I redrew the joint so that it was the same style but spread apart more. <br> <br>(a) is the version from the last post. (c) and (d) show two versions of the h, to get rid of the appearance of "fi". <br> <br>I also spaced the letters out more. This helped them match up with the new 'ry' spacing and also made them easier to identify. <br> <br>The letters involve a few sharper angles where previously there were curves. Also, the first downstroke on the h, n, and r have a bit of a flair, and this also happens on the upstroke of the y. I know this still doesn't have the personality of some of the previous logo versions, but hopefully that at least gives it something. <br> <br>Lastly, I leveled out the bottoms (e) where before I was keeping the 45� pen angles. It takes it a step away from calligraphy but I like the cleaner line. <br> <br>Also I did want to try a cap H. I sketched &amp; scanned - do you think it is worth pursuing? Is it too feminine? If not, I'll work with it. I do like the way it looks initially. (har) I expected the H to throw off the balance more, but I don't think it is. .. ? <br> <br>Thanks again for any comments about the revisions, or future suggestions. <br> <br><img src="http://www.typophile.com/forums/messages/29/69356.gif" alt="boring chart"> <br> <br><img src="http://www.typophile.com/forums/messages/29/69357.gif" alt="a cross between Mezz &amp; Banshee!! Nope, it's just my cruddy sketch"></p>
