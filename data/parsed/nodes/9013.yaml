    html: "<p>I like the cap H. Not too feminine in my opinion. More workman. It's nice how the top right of the H echos the y tail. For a more ornate instrument, it might be nice to really swash out the tail of the y and the top right of the H, either creating some kind of wave into a little swirl or stacked ribbon top and bottom or possibly a double wave rule top and bottom. This would look great on acoustic instruments from mandolin to dreadnaught. <br> <br>Bottom line: I'd be proud to see this on my headstock. Bravo for drawing the letters. Type ID section will soon get requests for the Henry guitar logo font. And we will proudly say: sorry it's custom. <br> <br>Randy</p>"
