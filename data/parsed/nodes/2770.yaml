  html: '<p>I want to buy <a href="http://youworkforthem.com/product.php?sku=T0016">this font</a> which is offered in two formats: "Macintosh Postscript" and "Windows Truetype". I want to get a postscript font if possible, but I want it to be usable on PCs as well. Is Macintosh Postscript really only for Macintosh? Would it be impolite to ask the company for a Windows Postscript font?</p>'
