    <p>Hey all, I’d love you critique on a logo design I’m working on. This is a redesign for a church that has seen quite a bit of change in the last few months, and wants to carry that through to their print identity. While the church body has been around for a while, in many ways they’re like a new church plant. This church is part of the <a href="http://www.foursquare.org/">foursquare denomination</a>, which is a more charismatic church somewhat in between a baptist church and a pentecostal church. I’d love to have your opinions.</p>
    <p></p><div class="imageWrap"><img src="/files/logo3_4234.jpg"></div><br>
    <div class="imageWrap"><img src="/files/logo2_4631.jpg"></div><p></p>
