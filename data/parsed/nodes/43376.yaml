      <p>Well, this does look like the kind of logo you see for this type of church but I would love to see something more done with the type. The whole thing looks unbalanced. </p>
      <p>Maybe reducing the size of the logo in relation to the type and choosing a different type. The name GENESIS looks great set in all small caps in a font like Dolly. I think a font that has more character would be great. I keep mentioning Dolly because the small caps in Dolly has a squarish shape to me. I think it would match the shape of your logo better.</p>
      <p>Sharon</p>
