    html: <p>This feels really, really forced, but if you loosen up a little it can work. Also, the downward angle on the middle stroke of e just doesn’t make sense and looks odd. Last, ditch the “Christian Fellowship” tagline; leaving it in there is going to put everything this goes on in the same class as “Christian Babysitting” and “Christian Housekeeping”&nbsp;logos. There’s no reason the tagline cannot be added to individual project when appropriate, and in more creative ways.</p>
