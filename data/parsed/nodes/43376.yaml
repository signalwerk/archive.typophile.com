      <p>I looked at this several times before choosing to comment on it.  Overall, I think that you’re moving in a promising direction.  </p>
      <p>Here’s what I like about it:<br>
      - The shapes tastefully and subtly suggest foursquare.<br>
      - I get the impression of a cross in the negative space between the shapes.  With the curves, the cross seems to flow around the shapes and has motion.<br>
      - It looks better in black and white than in color (which is good, because it means your core design works well; you can always tweak colors later).</p>
      <p>Here’s what needs improvement:<br>
      - The smaller shapes in the upper left and lower right quadrants may improve by being increased in size slightly.<br>
      - A second on getting “Genesis” in all same-sized small caps.<br>
      - I think a more useful arrangement would be to center “genesis” (now in small caps) over “Christian Fellowship” and then horizontally (or even vertically) arrange the text with the shapes.  Right now, the arrangement is lumpy; I’m not perceiving a strong line that moves the eye through the whole work.</p>
    html_clean: |-
