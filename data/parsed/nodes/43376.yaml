  - id: 268187
    user: 9629
    date: 2008-03-24T11:24:00
    date_raw: 24.Mar.2008 11.24am
    votes: null
    html: <p>As a pastor who is used to seeing churches who have no basic understanding of identity and design, I have to say, it is thrilling to see the beginnings of a design like this one that looks smart and refined. I agree with everyone who has said, thus far, that it is on the right track, but needs a little bit of help. The main issue (as others have pointed out) is balance. The four squares look like they are going to flip the whole logo on its side. I agree with nvhladek that the negative space in the mark is nice. I disagree with James that you need to ditch the tagline entirely, because, in this context “Christian Fellowship” is how you are trying to denote that Genesis is a church. Thus, “Christian Fellowship” here isn’t a tagline, but rather an integral part of the name “Genesis Christian Fellowship.” As such, I think you should lose the italics and actually rework it into the overall design to give it more weight than it currently has. Does that make sense? Nice work. I’m looking forward to seeing how it evolves...</p>
