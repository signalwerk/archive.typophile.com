  html: |-
    <p>I am typesetting a book which uses eastern european diacritics like  "ş". The font I am supposed to use is "Sabon". It appears to me this font does not have the matching glyth set.<br>
    Is there a workaround?<br>
    If this happens only once in a while I thought I could I use two glyphs that combined would be the missing one , in my case Glyph ID 84 + and GID 131.<br>
    How can I combine them or would it be better to recommend a different font altogether?<br>
    Thanks for your help!<br>
    Miriam</p>
