    html: |-
      <p>Combining an accent with a base character can work, or not, depending on a number of things...<br>
      Your best bet is to modify the font itself, adding the required characters. Note that a given font's EULA might actually forbid that. But I myself find that particular restriction unethical, so would encourage you to do it anyway.</p>
