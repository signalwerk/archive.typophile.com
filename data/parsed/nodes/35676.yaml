  html: |-
    <p>It's beginning to look a lot like postmodernism out there, and I'm seeing more and more headline fonts that employ decoration for decoration's sake - and lots of them! This got me wondering; if we're heading in a generally decorative direction, I'm presuming that poor typographers have already set text in display typefaces ... I've certainly seen my share of brochures printed in Papyrus. But what are good contemporary examples of decorative text typefaces (I'm assuming here that there are some)? Old blackletter books come to mind ... but has the need for speed eliminated the possibility of decorative text outside of art books? I've seen manuscript web sites, such as coldplay.com - will we see simulated handwriting in books? </p>
    <p>Can text type can be decorative, and still effective?</p>
