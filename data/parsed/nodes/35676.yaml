      <p>&gt; Can text type can be decorative, and still effective</p>
      <p>Only in limited doses. Papyrus in a large enough size will work if the text is a sentance or two at a time. But I really wouldn't want to read a couple hundred words in it. (And neither would most people, making the brochure ineffective.)</p>
