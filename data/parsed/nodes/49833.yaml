    <p>Hello, there!<br>
    I am trying to ID the particular font that was (handwritten by two different scribes) on the original Winchester Manuscript of Malory’s Arthurian Legends. Like I said, late 15th century england. I am not even remotely knowledgable on the subject of fonts, but this is partly why I recently joined - I would like to know what this general type is considered.<br>
    Thanks!<br>
    Here are a couple of pics:</p>
