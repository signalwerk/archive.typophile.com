  html: |-
    <p>I am currently finalizing my font with MS Volt. The positioning data (kern, curs and marks lookups) in my font has reached to such a limit that if I add more positioning data to my font then the compilation starts failing in MS Volt though "Use extension Lookups" and "Use PairPosFormat 2" options are on in the MS Volt. </p>
    <p>I want to ask that after generating the final font with Volt, is it possible to add some more kerning and marks lookups to this font (generated by Volt)? From reading different posts I have guessed that it may be possible through TTX and Dtl OTMaster though I am not sure about it. Badly need some guidance in this respect.  Also I do not know which one will be easier. Any help will be appreciated.</p>
