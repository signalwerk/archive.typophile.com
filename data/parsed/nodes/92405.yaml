    html: |-
      <p>‘<em>[…] is it possible to add some kerning and marks lookups to this font […]’</em></p>
      <p>In <em>DTL OTMaster</em> one can export the layout features, edit/add stuff and subsequently recompile the tables.<br><img src="/sites/default/files/old-images/Marks_positioning_5554.gif"><br>
      One can use the ‘Import…features’ functionality for instance for the positioning of marks in Arabic fonts. A (standardized) features ﬁle containing the necessary information can be imported and subsequently the mark attachment points can be edited interactively or numerically via the <em>Tools</em> –&gt; <em>‘GPOS’/’GSUB’ Table Viewer</em> for the correct positioning of the (mark to) marks.</p>
      <p>FEB</p>
