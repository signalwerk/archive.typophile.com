      <p>The airport lettering looks like Modula, which had about 5 weights (shown in "Homage to the Alphabet" by Phil's Photo). There was a digital version of a medium weight that was called Obsidda by NovelFonts for which I can make a sample shortly.</p>
      <p>- Mike Yanega</p>
