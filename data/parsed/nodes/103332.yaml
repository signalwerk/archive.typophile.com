    html: |-
      <blockquote><p>That would still require creating new glyphs instead of applying an action/effect to existing glyphs.</p></blockquote>
      <p>Yes, it entails applying an action/effect to existing glyphs on the design end, where you have greater opportunity to evaluate and refine the results on a situational basis, rather than at the rasterization end where you will have little control and where one size rarely fits all.</p>
      <p>For alternative approaches, you can explore parameterized design and the Metafont format developed by Knuth for use in conjunction with TeX.</p>
