    html: |-
      <p>Simply scaling would change the weight relationship and in most situations would make things look wrong. Witness the disdain for faux small caps and faux fractions. A more sophisticated rule could probably be devised (probably relying upon hints), but would require a sophisticated implementation built into layout and rasterizing engines and would be highly unlikely to gain any traction I suspect.</p>
      <p>BTW, parentheses and braces are generally scaled down (in size, but not weight) for all-caps settings, not up.</p>
