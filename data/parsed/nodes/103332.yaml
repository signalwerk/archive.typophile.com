    <p>Hello!</p>
    <p>In OpenType – if I understand well – there are only two possible rules - SUBSTITUTION and POSITION (either/or/both).</p>
    <p>Why isn't there a rule for SCALE?</p>
    <p>For example, when the ALL CAPS "TT" is triggered in InDesign, scale the glyphs "(", ")", "{" and "}" up to 110% (from zero point/from centre/from cap height/from ascender height etc).</p>
    <p>If such a rule does not exist, it's either because it defeats some other purpose, or is unnecessary or is carried out by something else... and that I'm missing a point.</p>
    <p>Thanks!</p>
