rocessing.  (Unfortunately the tools I'm using make it awkward to work with OpenType fonts so I'm stuck with T1.) <br> <br>In the immortal words of that famous philosopher Dudley Do-Right, \"I learn something new every day.\"... and this has been a very interesting discussion.  Thanks.</p>"
