    votes: null
    html: "<p><i>&gt;I see most of the \"fonts for money\" issue more as ideology than anything else.  As an example, I've read Luc's discussion about fonts not actually being software; from a technical perspective I can easily agree with both sides of the argument.  On the other foot I get very unhappy with the idea of patenting algorithms, as many times there aren't any different or more efficient ways to accomplish the same ends, and the ideas aren't terribly innovative.  <br>  <br>What I [i]{do</i> know is I now clearly understand why people dislike Type 1 fonts... the character to glyph mapping is a mess, and the only workaround is a lot of manual processing.  (Unfortunately the tools I'm using make it awkward to work with OpenType fonts so I'm stuck with T1.)} <br> <br>42nd, Type 1 fonts are obsolete, 8-bit software, which will eventually no longer be supported at all. Some of the tech people weighed in well in this thread: <a href=\"http://www.typophile.com/forums/messages/30/51857.html?1098714511\" target=\"_blank\">http://www.typophile.com/forums/messages/30/51857.html?1098714511</a> <br> <br>Great things like Hrant's Baskerville aside, money is (and will remain) an essential necessity in order for new type technologies  and new text families to be developed. (Hrant, won't you still be able to sell special components and additions to your Baskerville, even though the bulk of it will be distributed for free?)</p>"
