    html: <p>I just purchased a license for Tribute to use on my website, and eventually on my PDF resume. I read Emigre's EULA, but not closely enough--a different type will have to be used on my resume unless I purchase another license. I totally understand the frustration, but I don't have a solution. <br> <br>I did want to mention that <a href="http://www.fountain.nu">Fountain</a> allows embedding and distribution (if I understand their EULA correctly) and they have some nice text fonts. There is a stipulation that only 60% of the font's character set can appear in a single document (or something like that). <a href="http://www.fountain.nu/designers/larsbergquist.asp">Lars Bergquist's types</a> are interesting to me, and <a href="http://www.fountain.nu/catalogue/delicato.asp">Delicato</a> appears to be a great set of types complete with ligatures and ornaments. Randy Jones' Eason will be available from Fountain at some point--another good choice.</p>
