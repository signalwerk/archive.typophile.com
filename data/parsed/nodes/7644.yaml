    html: <p>Of course there are. But they cost a lot more (mostly because the "better type designer" clause <i>does</i> apply to <i>them</i> quite well). Most notably here they generally cost too much for your typical non-profit organization, which is what TUG is. I'm sort of in a special situation where I can make fonts at the required level, but paying my bills doesn't depend on that, so I can "speculate" (in this case by hoping for good auxiliary retail sales) and lay foundations for my future. But I'm not the only one in such a situation. Which is why "being there" is so important. <br> <br>hhp</p>
