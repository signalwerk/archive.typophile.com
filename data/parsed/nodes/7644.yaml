    html: "<p>[i]{&gt;but we try really, really hard not to be evil ;)} <br> <br>Fair 'nough; it sounds to me Linotype is trying to do the right thing, many right things in fact. I wish more big companies would subscribe to this philosophy... seems an awful lot of them aspire to being as least as evil as possible. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\">  I humbly apologize for any slurs I have cast; in the future I will certainly malign some other evil font foundry. <br> <br>(To paraphrase Groucho: \"Stop by your local Linotype/DeSoto dealer tomorrow for a test drive... and tell'em Groucho sent ya.\") <br> <br>I think Adobe is another company trying to do \"the right thing\", at least when it comes to EULAs and embedded fonts.  'course they have a (slight?) vested interest in the issue, but as long as the consumer comes out ahead it's OK with me. <br> <br>I'm very impressed people can make a living \"tweaking individual glyphs\", as it were.  I could easily imagine people making a career out of creating fonts but never would've have guessed at a \"support\" role. <br> <br>I see most of the \"fonts for money\" issue more as ideology than anything else.  As an example, I've read Luc's discussion about fonts not actually being software; from a technical perspective I can easily agree with both sides of the argument.  On the other foot I get very unhappy with the idea of patenting algorithms, as many times there aren't any different or more efficient ways to accomplish the same ends, and the ideas aren't terribly innovative. <br> <br>I see fonts as closer to \"art\" than to \"technology\", even the electronic sort, so I'm more willing to cut font designers some slack.  But that's a very personal view not particularly justified by any facts. <br> <br>What I [i]{do} know is I now clearly understand why people dislike Type 1 fonts... the character to glyph mapping is a mess, and the only workaround is a lot of manual processing.  (Unfortunately the tools I'm using make it awkward to work with OpenType fonts so I'm stuck with T1.) <br> <br>In the immortal words of that famous philosopher Dudley Do-Right, \"I learn something new every day.\"... and this has been a very interesting discussion.  Thanks.</p>"
