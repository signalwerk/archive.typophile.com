    html: <p>I agree that Type 1 is relatively obsolete, but it has its good points.  But from a software perspective TT/OpenType's complex format is a pain to work with, and most Postscript printers still natively use Type 1 fonts anyway.  <br> <br>Dan, in the thread you mentioned you were asking why many people still use Type 1.  I do because that's all my software supports, so if I purchased any OpenType fonts I'd just have to convert them to their Type 1 equivalents... so I might as well just use the Type 1 font from the start.  Another practical reason some people still use it is because some printers have support for storing font files locally on the printer, and the majority of printers in use still only support Type 1.  I've also noticed that some OpenType fonts are more expensive than their Type 1 equivalents. <br> <br>Getting rid of Type 1 fonts won't push people to use OpenType, it'll just be an inconvenience for those who can't use it.  For example, my X server crashes when I give it OpenType fonts--even though they're supposed to be exactly equivalent to TT.  (It's obviously a bug in the X server, but I don't feel like spending the time right now to track it down or upgrading software.) <br> <br>The <i>other</i> reason (let's see if I can get the formatting right <i>this</i> time <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0">) people aren't rushing to switch <i>en masse</i> may be because of a perceived lack of benefits.  The only practical advantage <i>I</i> see for using OpenType is it mostly solves the glyph mapping issue--and for many (most?) people that's simply a non-issue.  That's not to say it doesn't have other advantages (it has many), but it's unlikely most of the software currently in use can take advantage of them. <br> <br>I also am wary of claims such as "it renders 300% better!"  It <i>may</i>; but I think most of us have heard these claims before. I hasten to point out that the most common way fonts are used in electronic publications (PDF/Postscript) still natively use Type 1 fonts and outlines.  (I also realize some of the OpenType benefits such as improved kerning would still apply--assuming the typesetting software can make use of it.) <br> <br>Hrant, I really appreciate your work in releasing a free version of Baskerville... more quality free fonts would be a really good thing, helping to save the world from the drugery of Arial Forever.  I think it makes a lot of sense to release a free core set and charge for the expert characters; it will be interesting to see how that works out... if nothing else, that approach should help to discourage pirating. <br> <br>Addison, thanks for the pointer.  I'm thinking about starting a webpage with links to foundries with "electronic-distribution-friendly" EULAs. I know they're out there, it's just a matter of knowing which ones. <br> <br>[Now, let's see if I can post this without the dreaded MySQL socket error... perhaps the server was trying to defend itself from one of my lengthy screeds.]</p>
