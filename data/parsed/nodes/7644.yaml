    html: <p>They chose it. Apparently it's a typeface that gets a lot of call among discerning TeX typographers, but the "natural" impediment is that they can't get it for free. I don't usually favor revivals*, but the user matters more. And anyway I actually think Baskerville is a good choice of its own in this case, since it brings some elegance to a typesetting environment that has generally lacked some aesthetic refinement, at least in its "default" choices, like Computer Modern. <br> <br>* Like I would never make a Baskerville out of blue to sell retail. <br> <br>hhp</p>
