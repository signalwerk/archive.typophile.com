    votes: null
    html: "<p>Eventually there will be an article in the TUG journal treating the process fully. I hope to make the article both revealing to non-typophiles and useful for geeks like us. It's even going to have a photo of the largest Baskerville glyph in the world*: a \"g\" from the Monotype cut about three stories tall on the side of the Sherman Oaks Galleria. <br> <br>* That I know of. If you know of a bigger one please send a photo! <br> <br>What I can tell you right now though is that I spent the first month gathering samples of existing Baskervilles (which included the printing of two metal cuts at ArcheType), thinking about what it needs to be (there's not much room for play in the Roman, but my Italic will actually attempt to be more Baskerville than Baskerville's original), and getting a grasp on the structures of certain tricky characters (like reconciling the ugliness of the \"a\" against historical fidelity). Now all the setup is done and I've started rendering out some key glyphs on paper. <br> <br>BTW, I've also sketched out the general design of the specimen, which will actually be sort of an homage to JB's specimen sheet of 1762. I will print some with photopolymer letterpress, to accompany sales of the extensions (and to send out as shameless plugs). <br> <br>hhp</p>"
