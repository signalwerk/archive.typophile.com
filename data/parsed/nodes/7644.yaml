some of the EULA restrictions may make sense in isolation, in the grand scheme of things these restrictions can become a serious problem, and the usual solution is to just ignore the agreement when it becomes too inconvenient. <br> <br>The whole issue of commercial fonts represents a personal quandary, as I'm a dyed-in-the-wool free software supporter and developer. I worked at Cygnus Support for a few years and I fully embraced their business model, I use Linux, and it's 99.9% certain anything I produce in the future will be freely available in some form.   <br> <br>At the same time it doesn't bother me (much) to pay a reasonable fee for use of a font--<i>as long as I can really make use of it</i>.  What's the difference?  There's no support model for fonts.  When a user obtains a font it \"just works\", and there's no way for a developer to make an income by providing support services.  (\"Pay us to tweak individual glyphs for you\" just doesn't sound viable. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\">)  <br> <br>While people may occasionally request development of new fonts, I suspect relying on this income source would severely limit the size of the market.</p>"
