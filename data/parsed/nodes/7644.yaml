    html: "<p>I feel a need to apologize--I got a bit distracted and forgot to check back... <br> <br>Thanks, everyone. I've enjoyed browsing through the site and the comments here are greatly appreciated.  I was feeling a tad bit frustrated at the time I wrote my rant, but I felt the message needed to be heard.  (Perhaps all the legalese was getting to my brain. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\">) <br> <br>Frustrated, because I was ready to spend money on entire font libraries from various publishers, but they couldn't see their way clear to allow use in free publications.  Obviously they have the right to make whatever licensing agreements they want--but I still believe they will eventually price themselves out of business this way.   <br> <br>While I love \"dead media\" (99.9% of the books I read are printed on paper and I have a large collection of rare books), it's crucial to recognize publishing solely in electronic form is a reality... and, with increasing display and laser printer resolution, quality fonts are becoming more important than ever.  (Bad sales pitches written for free on request. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\">) <br> <br>I've read several rants from typophilists complaining about the heavy (ab)use of certain ugly free fonts.  I gotta wonder if some of these people are the same ones who want to charge for embedding.  Ironic?  Naw... <br> <br>I certainly didn't mean to slam Linotype per se--they were just the first \"big name\" that popped into my head.  Dan, I've seen <i>many</i> admirable Linotype fonts, and I agree they're a good value; I'm sure I'll end up using several Linotype fonts in my projects.  Maybe they should feel honored that I view them as a giant juggernaut crushing the competition in their path... <br> <br>(The only complaint I have with Linotype's offerings is a minor one--I prefer buying \"volume sets\" for a family instead of individual faces, and frequently I find Linotype doesn't have a set for the family I'm looking at.  I should probably just break down and buy a complete library.) <br> <br>My main reason for wanting to support some of the newer houses is to promote diversity.  For ideological reasons I prefer markets with many participants rather than a few big ones, and given a choice of where to spend money I prefer to encourage smaller companies.  New entrants seem to be popping up anyway--it's just a personal bent. <br> <br>What struck me as a little strange was the uniformity of the EULAs in regards to font embedding, at least for the independent houses I looked at.  I'd see the same basic wording time and time again, even down to the same exact fees.  It really made me wonder if they were honestly thinking about these issues, or they were merely going with the crowd.   <br> <br>I honestly expected to find a few developers explicitly advertising \"we allow PDF font embedding with no restrictions!\".  No such luck... unless you count places such as SSI, of course.  I'm rather curious if most purchasers are aware of the embedding restrictions; actually, they probably are and just don't care. <br> <br>Tiffany: I'd read your excellent wiki before posting here and I pretty much agree with everything there.  While it strongly goes against my grain to see extra charges for embedding fonts in commercial contexts, I agree they should have the right to do this--and I see this as distinctly different from giving away or emailing a PDF document.   <br> <br>(I also find the laptop issue particularly amusing because I do all my work on one, and I'm sure the server installation issues are such a huge pain-in-the-arse in larger groups that people do it anyway.) <br> <br>Similar issues often come up with \"ordinary\" software, but I feel the situation is a little different with fonts because of the large number of them, and the transitory nature and contexts of their use.  While some of the EULA restrictions may make sense in isolation, in the grand scheme of things these restrictions can become a serious problem, and the usual solution is to just ignore the agreement when it becomes too inconvenient. <br> <br>The whole issue of commercial fonts represents a personal quandary, as I'm a dyed-in-the-wool free software supporter and developer. I worked at Cygnus Support for a few years and I fully embraced their business model, I use Linux, and it's 99.9% certain anything I produce in the future will be freely available in some form.   <br> <br>At the same time it doesn't bother me (much) to pay a reasonable fee for use of a font--<i>as long as I can really make use of it</i>.  What's the difference?  There's no support model for fonts.  When a user obtains a font it \"just works\", and there's no way for a developer to make an income by providing support services.  (\"Pay us to tweak individual glyphs for you\" just doesn't sound viable. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\">)  <br> <br>While people may occasionally request development of new fonts, I suspect relying on this income source would severely limit the size of the market.</p>"
