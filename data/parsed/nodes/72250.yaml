      <p>It seems to be a regular hyphen, albeit with a fairly non-standard design. It might be to match the rest of the font.</p>
      <p>"To-night", "To-morrow", with a hyphen, are ye olde spelling variants -- see also "To-day" on the bottom of the 2nd image.</p>
