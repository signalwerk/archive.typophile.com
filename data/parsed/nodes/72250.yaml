      <p>Side note: The typeface around the hyphen is Hermann Ihlenburg's Columbus, circa 1892 for MacKellar, Smiths &amp; Jordan / ATF. The 1902 italic version for ATF was called "American Italic" (for no obviously good reason).</p>
      <p>Cheers,</p>
      <p>T</p>
