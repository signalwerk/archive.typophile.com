      <p>There are some examples of drawn fists (including one on a Gutenberg page) <a class="freelinking external" href="http://www.hrc.utexas.edu/educator/modules/gutenberg/invention/marginalia/" rel="nofollow">here</a>. </p>
      <p>Looks like the information from William Sherman's <a class="freelinking external" href="http://www.livesandletters.ac.uk/papers/FOR_2005_04_002.html" rel="nofollow">posting</a> linked in one of those earlier Typophile threads appears in Sherman's <a class="freelinking external" href="http://books.google.com/books?id=B9dGU0iYaAAC" rel="nofollow">book</a>, too. </p>
      <p>Many of the Dadaists loved manicules. One of my favorite uses appears in Tristan Tzara's <a class="freelinking external" href="http://www.391.org/manifestos/19201212tristantzara_dmonflabl.htm" rel="nofollow">"manifesto on feeble love and bitter love"</a> from 1920. Marcel Duchamp put one in his last major painting, <a class="freelinking external" href="http://artgallery.yale.edu/pages/collection/popups/pc_modern/details19.html" rel="nofollow">Tu M'</a> (or rather hired a commercial artist to add it).  </p>
      <p>John, I agree that that hotdog of a finger could be scaled back a bit.</p>
