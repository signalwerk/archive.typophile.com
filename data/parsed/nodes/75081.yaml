  html: |-
    <p>Recently, I was asked for the first time to include a set of fists or indexes in a font, i.e. pointing hands. As someone whose skills and work do not usually involve figurative illustration, I found this quite a challenge, although I'm now quite happy with the slightly gaunt and ascetic result (now I look at it, I realise that somewhere in the back of my mind was an Eric Gill wood engraving of a pair of hands joined in prayer).</p>
    <p>The exercise started me pondering a few questions:</p>
    <p>What is the earliest exemplar of the typographic fist/index in use?</p>
    <p>What are some designs by my contemporary colleagues that include this character?</p>
    <p>And what are some favourite fists/indexes?</p>
    <p>Here is my effort, for the new custom types for the academic publisher Brill:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/brillfist_6643.png"></div><p></p>
