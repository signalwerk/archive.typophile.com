    <p>It's probably a stupid question. I've seen several fonts that were called De Vinne or Devinne. They all have serifs but that is where any similarity ends. So, back to the question, what is De Vinne relative to fonts - history, definition, etc.?  If someone would care to be enlightening, that would be awesome. </p>
    <p>James</p>
