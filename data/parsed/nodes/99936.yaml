      <p>Aggregating my own findings with those in this useful thread, here is a summary of the three disparate families now going by the name De Vinne, DeVinne, or Devinne:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/De Vinne 1892_5990.png"></div><br>
      <strong><a href="http://fontsinuse.com/typefaces/7888/de-vinne" rel="nofollow">De Vinne</a>, Gustav F. Schroeder, Central Type Foundry, c.1892</strong><br>
      	First released by Central Type Foundry around 1892. In the following years, Central (and then ATF) added many styles to the family. It disappears from ATF catalogs after 1923.<p></p>
      <p>	No digital version exists, other than a rough <a href="http://www.myfonts.com/fonts/woodentypefonts/de-vinne/?refby=typographica" rel="nofollow">wood facsimile</a>, but it’s still possible to get the metal type: <a href="http://www.arionpress.com/mandh/letterpress-type-fonts.html#D" rel="nofollow">M &amp; H</a> casts the Monotype version, which was called “<a href="http://archive.org/stream/monotypespecimen00lansrich#page/n295/mode/2up" rel="nofollow">No. 11</a>” or “<a href="http://www.flickr.com/photos/53177163@N00/4781254606/in/set-72157624341161439" rel="nofollow">Devinne</a>”.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/devinne-ornamental_3469.png"></div><br>
      	<strong><a href="http://fontsinuse.com/typefaces/17617/devinne-ornamental" rel="nofollow">DeVinne Ornamental</a>, Stephenson Blake, (Deberny &amp; Peignot Les Modernes, c.1900)</strong><br>
      DeVinne Ornamental was released by Stephenson Blake around 1900, based on a Deberny &amp; Peignot typeface called Les Modernes. [Reichardt]<p></p>
      <p>Various sources list Gustav F. Schroeder as the designer, but it is unclear that he had anything to do with this typeface, and these credits may be misapplied from his design for Central.</p>
      <p>There are at least three digital versions: <a href="http://www.myfonts.com/fonts/linotype/de-vinne/?refby=typographica" rel="nofollow">Linotype’s</a>, and two from <a href="http://www.myfonts.com/fonts/urw/de-vinne-ornament/?refby=typographica" rel="nofollow">URW</a>&nbsp;which are distinct and may be based on different metal sizes or different sources altogether. Naming also varies, adding to the confusion. This design is known at various outlets as “Devinne”, “De Vinne”, or “DeVinne”. “Ornament”, “Ornamented”, and “Ornamental” are also used.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/de-vinne-bt_3990.png"></div><br>
      <strong><a href="http://fontsinuse.com/typefaces/253/de-vinne-bt" rel="nofollow">De Vinne</a>, Linotype/Bitstream, (Bruce No. 11, 1890)</strong><br>
      MyFonts describes this De Vinne as a revival of Bruce’s No. 11. It was released by Linotype in 1902. It appears Linotype soon replaced the face with their “Modern” series, because De Vinne does not appear in catalogs after 1920. <a href="http://www.myfonts.com/fonts/bitstream/de-vinne/" rel="nofollow">Bitstream</a>’s revival is the&nbsp;only digital version called “De Vinne”. <p></p>
      <p>Despite its name, this typeface doesn’t seem to have anything specific to do with <a href="http://en.wikipedia.org/wiki/Theodore_Low_De_Vinne" rel="nofollow">Theodore Low De Vinne</a>&nbsp;except that No. 11 appears in <a href="http://archive.org/stream/typesofdevinnepr00devirich#page/156/mode/2up" rel="nofollow"><em>Text Types of the De Vinne Press</em></a>, a collection of specimens from various sources.</p>
      <p>———</p>
      <p>Links go to Fonts In Use where I’ll post the most updated info, including specimens and (of course) examples of the type in use. Please let me know if I have any of this wrong. I’ll post the list soon on <a href="http://typeology.org/" rel="nofollow">Typeology</a>.</p>
