      <p>Aggregating my own findings with those in this useful thread, here is a summary of the three disparate families now going by the name De Vinne, DeVinne, or Devinne:</p>
      <p><img src="/sites/default/files/old-images/De Vinne 1892_5990.png"><br><strong><a href="http://fontsinuse.com/typefaces/7888/de-vinne" class="link-external">De Vinne</a>, Gustav F. Schroeder, Central Type Foundry, c.1892</strong><br>
      	First released by Central Type Foundry around 1892. In the following years, Central (and then ATF) added many styles to the family. It disappears from ATF catalogs after 1923.</p>
      <p>	No digital version exists, other than a rough <a href="http://www.myfonts.com/fonts/woodentypefonts/de-vinne/?refby=typographica" class="link-external">wood facsimile</a>, but it’s still possible to get the metal type: <a href="http://www.arionpress.com/mandh/letterpress-type-fonts.html#D" class="link-external">M &amp; H</a> casts the Monotype version, which was called “<a href="http://archive.org/stream/monotypespecimen00lansrich#page/n295/mode/2up" class="link-external">No. 11</a>” or “<a href="http://www.flickr.com/photos/53177163@N00/4781254606/in/set-72157624341161439" class="link-external">Devinne</a>”.</p>
      <p><img src="/sites/default/files/old-images/devinne-ornamental_3469.png"><br><strong><a href="http://fontsinuse.com/typefaces/17617/devinne-ornamental" class="link-external">DeVinne Ornamental</a>, Stephenson Blake, (Deberny &amp; Peignot Les Modernes, c.1900)</strong><br>
