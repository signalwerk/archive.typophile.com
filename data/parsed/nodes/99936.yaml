    html: "<p>An interesting interlude: De Vinne 36pt was used directly as the pin mark for the famous Japanese type foundry, Tsukiji, which was founded by Tomiji Hirano. (Hirano is the surname and Tomiji is the first name) The foundry's pin mark is a De Vinne H in a circle.</p>"
