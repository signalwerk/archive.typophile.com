      <p>@William Berkson:<br><cite>There is also a Linotype DeVinne in metal, which is a Scotch style, without the thickened thin strokes of Century. It was very widely used, especially in scientific texts, I believe, though I may have it wrong; Bitstream did a revival of it, as Nick notes.</cite></p>
      <p>In general, because of the demand for mathematical formulas in scientific texts, Monotype, rather than Linotype, was used for them. It <em>is</em> true that Scotch Roman faces were very widely used in scientific texts.</p>
