      <p><img src="/sites/default/files/old-images/de-vinne-bt_3990.png"><br><strong><a href="http://fontsinuse.com/typefaces/253/de-vinne-bt" class="link-external">De Vinne</a>, Linotype/Bitstream, (Bruce No. 11, 1890)</strong><br>
      MyFonts describes this De Vinne as a revival of Bruce’s No. 11. It was released by Linotype in 1902. It appears Linotype soon replaced the face with their “Modern” series, because De Vinne does not appear in catalogs after 1920. <a href="http://www.myfonts.com/fonts/bitstream/de-vinne/" class="link-external">Bitstream</a>’s revival is the&nbsp;only digital version called “De Vinne”. </p>
