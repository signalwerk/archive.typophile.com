      <p>I see that DeVinne Ornamental, although it resembles a typeface I've spoken of before that came from ATF, Columbus, is definitely not the same typeface.</p>
      <p>In looking at old ATF catalogs, I ran across Samoa, which slightly resembled a typeface I ran across looking for Artistik look-alikes - but upon checking, I see that they're not really that similar. Unlike Artistik, neither of them differentiates mirror letters well.</p>
      <p>Incidentally, I see that Columbus was digitally revived by Sam Wang before a Kickstarter project to revive it - he also revived a few other noted old typefaces, such as Greeting Monotone (which I knew as Margery).</p>
