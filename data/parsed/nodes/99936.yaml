    html: |-
      <p>Nice commentary, Nick. Looking forward to your book! </p>
      <p>DeVinne was a great and unique character in the history of printing and type, being both the leading American printer and scholar of printing and type history in his day.  His <a class="freelinking external" href="http://archive.org/details/historicprinting00devirich" rel="nofollow">Historic Printing Types</a> is a great book and thankfully it's on line—the link goes to it. He has an superb eye, and his critiques are extremely insightful and not dated at all, which is pretty astonishing. </p>
      <p>I consulted it in doing my article about the 19th century revival of Old Style types, and Caslon in particular, for July 2011 edition of <em>Printing History</em>. There is also a first rate series of historical articles by Ovink, called '19th Century Reactions against the Didone Type Model' which includes the history of the French old styles. I consulted these also, thanks to the tip by William Peterson, then editor of Printing History. Nick, you might want to consult those, if you don't know them already. </p>
      <p>I think the 'grotesque' display 'DeVinne' is not worthy of his name, though he may not have had a problem with it. His legacy in type design is really the Century series, which bears the stamp of his ideas, even though the Bentons drew it. There is also a Linotype DeVinne in metal, which is a Scotch style, without the thickened thin strokes of Century. It was very widely used, especially in scientific texts, I believe, though I may have it wrong; Bitstream did a revival of it, as Nick notes. DeVinne himself constantly used a lot of Scotch style types as a printer, as Nick's illustration shows, even though his Century was intended to improve on the style.</p>
    html_clean: |-
