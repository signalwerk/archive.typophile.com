    <p>Hello All-</p>
    <p>I'm brand new to the site, and to type design. I currently am studying how to design my own typeface based off of my handwriting, and would love to get some feedback from experienced designers.</p>
    <p>The attached sample is a work in progress and I have noted that I need to delete the leaders on each letter for better spacing and open up some of my counters to increase legibility.  What else does anyone see? What features should I be looking at and modifying to make it more legible.</p>
    <p>Thank you in advance-<br>
    Giovanna Ghio<br>
    CCSF - Grph 152</p>
