      <p>giovanna, welcome to Typophile.</p>
      <p>can you show us some sample words set in this? and maybe you could post this as an inline image so it's more accessible for people to critique.</p>
      <p>the e, f, k, l, and y, among others, need to be opened up, imo. I'm not sure if you want some of the characters to be darker than others ... if not, the p and q and g feel too dark ... the J and the i and the j feel too light.</p>
