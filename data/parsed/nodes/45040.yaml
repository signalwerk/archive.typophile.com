    <p>Here's my new portfolio. The book itself I bought from <a class="freelinking external" href="http://www.officepdx.com" rel="nofollow">Office PDX</a>. They have the most incredible service. I love them!</p>
    <p>The cover is a Bex screwpost cover made by Pina Zangaro. I had to rush getting this finished as my husband was showing it to some folks this past weekend so if you see something that could be improved, let me know. Yes, I used a gazillion different faces. :-)</p>
    <p>There are 17 pictures currently in the portfolio. I know the plastic sleeves have some drawbacks but these shots were mostly printed on the new  baryta fiber papers which have a fragile surface. Many of the people looking wanted to touch the photos so it worked out well that they were protected.</p>
    <p>The text on the left hand side of the photo pages is info on the picture (when taken, etc.), the print and exhibition details. The small text is Sauna regular.</p>
    <p>Sharon</p>
