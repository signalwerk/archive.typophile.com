      <p>I was Prof. Joshi's student and he passed away this February. He was been my source of inspiration too to get into language typography which hasn't kept apace with developments in technology. He was more into Devanagari typography, but I believe was also involved with Microsoft's Indian language efforts to some extent. But Indian scripts being many and so diverse one cannot expect one person to be an expert in all of them. </p>
      <p>Turning on ClearType will makes it slightly better, but exaggerates its bad shapes further. I believe for on screen-reading bitmap fonts work best with B&amp;W pixels— Verdana nd Gorgia being the best models to emulate. The language technology part needs to be corrected first, with better and more acceptable conjunct formations and then the shapes which needs to be screen-friendly. merely replicating the print fonts for on-screen use is also hampering other Indian languages, to the best of my knowledge.</p>
      <p>Linotype Manorama designed by Fiona Ross is a good evolutionary model, though may not suitable for on-screen viewing. We need original designs which are hand-tuned for the screen.</p>
