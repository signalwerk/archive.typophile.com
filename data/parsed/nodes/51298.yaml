  html: |-
    <p>Microsoft had released Language support for many Indian Languages with WindowsXP. Crude and badly designed, the Malayalam typeface Karthika is an eyesore. With badly formed shapes, incorrect spacing and incorrect conjunct formation, the typeface and language support really mocks the language. Obviosuly people who didn't know the language were involved and made a mess out of it. On top of it, the OpenType/ Unicode support given is faulty and gives more disservice to the language.</p>
    <p>Some improvement was expected over the years, but nothing has happened. Unfortunately for want of a choice, people are using it for blogs and sites as if this is the norm/ default. This is likely to corrupt typography in the language and general aethetics forever.</p>
    <p>As a langauge lover and type designer in the language what can be done?</p><div class="imageWrap"><img src="http://typophile.com/files/malayalam_3550.gif"></div><p></p>
