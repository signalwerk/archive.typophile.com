    html: |-
      <p>No doubt. Prof. Joshi was the right person, but I wish linguists and type designers in the language were also consulted before designing the default typefaces in each language. I have heard similar complaints from other friends speaking different Indian languages.</p>
      <p>I can help with Malayalam if needed, having designed many typefaces in Malayalam (<a href="http://www.design-difference.com/typedes.htm" title="www.design-difference.com/typedes.htm">www.design-difference.com/typedes.htm</a>). But the Unicode/ OpenType problem also needs to be addressed simultaneously to make it acceptable to a larger audience.</p>
      <p>As you know there are two versions of Malayalam rendering: the traditional one (as recommended by Rachana, a group that recommends close to 900 characters to bring the language back to its original glory) and the reformed one (INSCRIPT/ C-DAC Gist with about 150 characters) which is more popular other than those used by various publishing houses (Summit's Indica, Mathrubhumi'system etc.). Karthika doesnot even match upto the INSCRIPT standards, bringing down typography in the language a few notches down. Script reformation in the 60's was an ill-thought-out step to make typewriters handle Malayalam, but Windows implementation corrupts the language further.</p>
