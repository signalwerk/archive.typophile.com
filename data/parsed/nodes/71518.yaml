      <p>Thanks Nina. Yes, Bodoni Egyptian is a strict monoline, where all the stems and serifs, upper and lower case, are the same thickness.</p>
      <p>Matching type details to elements of layout such as illustrations and line rules has always interested me. I was a big fan of Robert Priest's <a href="http://www.antiqbook.com/books/bookinfo.phtml?nr=1197092170&amp;l=en&amp;searchform=" rel="nofollow">Esquire</a> pages in the 1980s.</p>
