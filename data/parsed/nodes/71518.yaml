    html: <p>You could pick up on the hard contour idea and go with an outline font for the logo. Three very different examples would be <a class="freelinking external" href="http://www.fontshop.com/fonts/singles/bitstream/ambule_outline_ot/" rel="nofollow">Ambule Outline</a>, <a class="freelinking external" href="http://www.fontshop.com/fonts/singles/linotype/frutiger_capitalis_outline/" rel="nofollow">Frutiger Capitalis Outline</a>, or <a class="freelinking external" href="http://www.fontshop.com/fonts/singles/linotype/linotype_rough_com_outline/" rel="nofollow">Rough Com Outline</a>. (Of course, you could also easily stroke a different font to make an outline yourself.)</p>
