      <p>I have been looking at a more 1950's Americana approach and have been thinking of creating a badge style logo similar to baseball badges.  I really love this logo (although the G is a bit J like). I hope this concept works with the style  - you may see me posting on the critique board when I have something worth showing :)</p>
      <p>Thanks again for your help :)</p>
