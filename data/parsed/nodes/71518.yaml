    html: "<p>Interesting, Nick – before reading the replies, I was spontaneously thinking of one of yours too, but not a script: <a href=\"http://www.shinntype.com/bodoni.html\" rel=\"nofollow\">Bodoni Egyptian</a>. It's monoline, and it rides that fine line between clean/sharp and handmade/slightly quirky. I think it should be an excellent match. (After reading the other replies, I'm thinking I'm probably alone in this corner of the room, but figured I'd say it anyway. :)</p>"
