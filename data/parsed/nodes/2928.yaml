    html: <p>&gt;Suppose you want to collaborate on a report (or similar long document) with a subcontractor who doesn't have your fonts.  <br> <br>&gt;What do you do, lose all your formatting when you get the document back? <br> <br>One doesn't collaborate with subcontractors, one hires them. <br>Make it a stipulation of their contract that they obtain a licence for the fonts/software you intend to use, and they can build the cost of that into their bill to you. <br> <br>Otherwise, it is an arrogance on the part of the contractor to impose its corporate fonts on the subcontractor. <br> <br>If the contractor choses not to, and uses Arial or equivalent, it is less expensive, but less of a distinctive corporate branding. You get what you pay for (unless you have sufficient clout to bully your subcontractors into licensing your corporate fonts). <br> <br></p>
    html_clean: <p>&gt;Suppose you want to collaborate on a report (or similar long document) with a subcontractor who doesn't have your fonts.  <br> <br>&gt;What do you do, lose all your formatting when you get the document back? <br> <br>One doesn't collaborate with subcontractors, one hires them. <br>Make it a stipulation of their contract that they obtain a licence for the fonts/software you intend to use, and they can build the cost of that into their bill to you. <br> <br>Otherwise, it is an arrogance on the part of the contractor to impose its corporate fonts on the subcontractor. <br> <br>If the contractor choses not to, and uses Arial or equivalent, it is less expensive, but less of a distinctive corporate branding. You get what you pay for (unless you have sufficient clout to bully your subcontractors into licensing your corporate fonts). <br> <br></p>
