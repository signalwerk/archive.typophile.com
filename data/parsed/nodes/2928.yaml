    html: "<p>Nick,  <br> <br>Adobe were GIVIG AWAY Illustrator!? When was that? I thought Illustrator always cost money, and obviously, the customer also paid (among others) for the fonts included. They were not free copies, but of course, they were greatly reduced vs. the fonts sold separately.  <br> <br>I can't agree that Gill Sans is \"poor old\". I'd rather say it's \"great old\". I myself prefer a good typeface over a new typeface. Among the designs you listed, I can't find a single one that would be superior to Gill Sans. To me, the first sanserif for years that can stand up against Gill Sans is Frantisek Storm's Sebastian:  <br><a href=\"http://www.myfonts.com/fonts/storm/sebastian/\" target=\"_blank\">http://www.myfonts.com/fonts/storm/sebastian/</a> <br> <br>It's similarly sophisticated without being artificially elaborate.  <br> <br>If I were to choose between Gill and Cronos, I'd choose Gill -- even if both were designed at the same time. The same for Agenda vs. Gill etc. I won't even compare Scala Sans, Bliss or Eureka Sans. They're nice but have by no means the touch of eternity and universality that Gill Sans has. I'd say, Gill Sans is still better.  <br> <br>Adam <br></p>"
