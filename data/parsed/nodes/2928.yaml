    html: "<p>William suggested: <br> <br><i>&gt;It seems to me you are in a position to bargain  <br>&gt;with founderies, so if I were you I would talk to  <br>&gt;Adobe, Tankard, Montalbano, Fontbureau, and  <br>&gt;whomever else you fancy. Explain your needs and get  <br>&gt;them to propose a deal that will help you most. Make  <br>&gt;them work for your business, and you will probably  <br>&gt;get some great advice and a result you are confident  <br>&gt;about and happy with.</i> <br> <br>If you are seriously interested in several Font Bureau fonts (and I highly recommend them as a very good, long-term investment), then call them at (US) 617-423-8770 and talk to Harry Parker. Tell him what you're interested in and for how many workstations and get him to quote you a volume price. Volume is definitely a factor in the FB pricing structure, which is not immediately apparent from just their website. And depending upon how many families you're interested in licensing, you might be pleasantly surprised. They're quite comfortable and adept at working with studios who are library-building such as you are.  <br> <br>Good luck with your decisions. <br> <br>-- K. <br></p>"
