    html: <p><i>But "mood" is the only justification for making new type.</i> <br> <br>This is probably true for display type, but in my experience most new text type development is driven by economic and technical requirements and what might be termed 'appropriateness to purpose'. We need new types because we keep producing new texts, and new kinds of text. This has always been the case, and it is worthwhile to map major developments in the history of type design to developments in literature. 'Mood' may be one of the factors that makes a typeface appropriate to a text, but it is certainly not the only one. <br> <br>Of course, there is also the question of whether one needs to justify the making of new type -- or a new chair design, or a new piece of architecture -- other than by variety and by the human need to create new forms.</p>
