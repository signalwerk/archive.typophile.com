    html: "<p>&gt;What do you think? <br> <br>Gerald, part of the risk of going into business is that times change, and one will have invested money in something that becomes obsolete, either through a changing of fashion, the economy, or technology. There is no such thing as a right to a continuing ROI. <br> <br>Eric Gill is long gone. Let's support contemporary type culture, as an expression of the present day and age, by licensing contemporary fonts. <br> <br>I'm not saying there isn't a place for the classics, but they should not dominate the scene the way they do. <br> <br>Interesting that you mention Gill Sans, as this was one of the typefaces that Adobe gave away on an Illustrator CD in the mid 90s. Millions (I assume) of free copies. Well, that's one way to prime a market. But it kind of pulled the rug out from underneath Cronos. <br> <br>Gill Sans is a 1930s typeface. The bowl of the a has the bulbous look of the baby carriages of that era. To me, it looks totally incongruous today. However, it made a valuable contribution to the living tradition of type design: if art directors want to choose a typeface that, because of its structure and proportions, works in a similar manner, they should use the present day \"equivalents\", such as Cronos, Scala/Seria Sans, Bliss (good choice, m-ga), Agenda, Eureka Sans, etc. That would make our business more vital and sophisticated than if everyone just uses poor old Gill.   <br> <br> </p>"
    html_clean: "<p>&gt;What do you think? <br> <br>Gerald, part of the risk of going into business is that times change, and one will have invested money in something that becomes obsolete, either through a changing of fashion, the economy, or technology. There is no such thing as a right to a continuing ROI. <br> <br>Eric Gill is long gone. Let's support contemporary type culture, as an expression of the present day and age, by licensing contemporary fonts. <br> <br>I'm not saying there isn't a place for the classics, but they should not dominate the scene the way they do. <br> <br>Interesting that you mention Gill Sans, as this was one of the typefaces that Adobe gave away on an Illustrator CD in the mid 90s. Millions (I assume) of free copies. Well, that's one way to prime a market. But it kind of pulled the rug out from underneath Cronos. <br> <br>Gill Sans is a 1930s typeface. The bowl of the a has the bulbous look of the baby carriages of that era. To me, it looks totally incongruous today. However, it made a valuable contribution to the living tradition of type design: if art directors want to choose a typeface that, because of its structure and proportions, works in a similar manner, they should use the present day \"equivalents\", such as Cronos, Scala/Seria Sans, Bliss (good choice, m-ga), Agenda, Eureka Sans, etc. That would make our business more vital and sophisticated than if everyone just uses poor old Gill.   <br> <br> </p>"
