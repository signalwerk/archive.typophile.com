    html: <p>I don't think there is anything wrong with someone who has the job of choosing a typeface, for whatever purpose, falling back on a reliable and proven classic in the absence of the necessary experience and discernment required to be more daring. It is prudent. But if that person has to choose another typeface for another project next week, and again after that, and if choosing a typeface becomes part of that person's job description, e.g. if he is a graphic designer or art director, I think there is something wrong with choosing those reliable and proven typefaces year after year, for every purpose. It suggests a failure to develop discernment and to build on experience.</p>
