    <p>Hey all,</p>
    <p>I'm a graphic designer and decided to try my hand at producing a font. I know pretty much nothing about how the whole process works, but would still like your critiques on where I'm at so far! Tell me what you think... any tips would be greatly appriciated.</p>
    <p>Matt</p>
    <p>P.S. I know the "S" and "Z" need some work... they're still a bit choppy.</p>
