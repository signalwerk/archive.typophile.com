    html: |-
      <p>The Q <strong>is</strong> great.  I also like N, T, V, J, and the overall feel.  </p>
      <p>You're right, the S and Z need work. Don't make the middle part of the S and Z go completely horizontal -- use a bigger radius on the inner part of the curves, and have them meet diagonally. </p>
      <p>I'd bring the middle of the Y, P and R down, and the middle of the B and K up.</p>
      <p>The C, E, and F are too narrow.  Either widen them, or experiment with more variation in character widths across the entire alphabet.</p>
