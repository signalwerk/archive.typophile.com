    html: "<p>Fun little starter project you have there. A few tips: Where the circle sections meet the straight section, you should make the connection softer. Secondly: It seems that you have simply outlined a stroked path in Illustrator to create the letterforms. In this case stretch the letterforms vertically up by 10-15% before you outline the stroke, and then scale back down after outlining. That way you adjust for the optical illusion that horizontals look beefier than verticals. And yes, the S and Z are atrocious.</p>"
