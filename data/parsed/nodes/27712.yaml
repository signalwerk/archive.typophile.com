    html: |-
      <p>The bold weight of Flareserif 821 is closer, but it still isn't heavy enough.</p>
      <p><a href="http://www.hp.com/" rel="nofollow">Hewlett-Packard</a> used to ship an Albertus Extra Bold with their LaserJet printers (maybe they still do). I have still have a copy of this font, and it looks like an exact match to me.</p>
      <p>A newer laser printer of mine, a <a href="http://www.brother.com/" rel="nofollow">Brother</a>, came with something called Alaska Extrabold that also looks like a match.</p>
