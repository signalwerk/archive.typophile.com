      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Cuba-Fruit-Mart_comparison_6057.png"></div><p></p>
      <p>From top to bottom:</p>
      <ol>
      <li>Original sample posted by Mike Palmer
      </li><li>Albertus Extra Bold (HP)
      </li><li>Alaska Extrabold (Brother)</li></ol>
      <p>I think HP's Albertus Extra Bold is an exact match. (Small differences are due to artifacts introduced by Photoshop's anti-aliasing.)</p>
      <p>Brother's Alaska Extrabold: Close, but no cigar.</p>
