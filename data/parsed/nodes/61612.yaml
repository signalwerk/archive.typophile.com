    html: <p>It's not the hinting--that's really how it is drawn. It's based closely on Caslon's original design, I seem to recall. Almost all other Caslon revivals "correct" this feature. <a href="http://new.myfonts.com/search/caslon/fonts/?testdrive=custom%3D0%26seed%3D21%26dock%3D0%26size%3D153%26w%3D600%26src%3Dcustom%26text%3DWow%26fg%3D000000%26bg%3Dffffff%26goodies%3Dsingle%252Cot.liga">There are lots to choose from.</a></p>
