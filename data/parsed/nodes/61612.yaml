    <p>Hi all. </p>
    <p>My project is a for-screen pdf of text for a dark fantasy game. I've been going for a classic style, so I went with Adobe Caslon Pro for the text. It looks beautiful, especially underneath the FF Pitu headers, which really match the feel of the game. What I'm bothered by is Caslon's lowercase w, whose center bar is slightly lower than the arms'. When the pdf is viewed at less than 100% zoom (as most people probably will) the w looks curved and really blotchy, so much so that I'm considering changing. </p>
    <p><a class="freelinking external" href="http://typedia.com/explore/typeface/adobe-caslon">http://typedia.com/explore/typeface/adobe-caslon</a></p>
    <p>Is this happening because Caslon Pro might have been designed/adapted for print more than screen? Are there other versions of Caslon that might spare me from this? Or should I not worry because this can happen to any font, assuming that zooming out on a pdf doesn't change the font's size but just shrinks the display? </p>
    <p>I'll try Minion Pro next, but I'd love suggestions.</p>
