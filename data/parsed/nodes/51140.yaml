  html: |-
    <p>Microsoft Groups, <a href="http://groups.msn.com" title="http://groups.msn.com">http://groups.msn.com</a> which has been hosting a VOLT Users Community group and another for Fontlab has announced that it is closing all groups as of February 2009. It recommends that groups move to Microsoft's Multiply. </p>
    <p>In view of the large number of typographers who are members of these groups, and the extensive messages containing valuable advice exchanged over the years, I wonder whether Typophile could or would want to offer to host these groups, members, messages and all? </p>
    <p>Or at least invite members to join Typophile?</p>
  html_clean: |-
    <p>Microsoft Groups, <a href="http://groups.msn.com" title="http://groups.msn.com" class="link-external">http://groups.msn.com</a> which has been hosting a VOLT Users Community group and another for Fontlab has announced that it is closing all groups as of February 2009. It recommends that groups move to Microsoft's Multiply. </p>
    <p>In view of the large number of typographers who are members of these groups, and the extensive messages containing valuable advice exchanged over the years, I wonder whether Typophile could or would want to offer to host these groups, members, messages and all? </p>
    <p>Or at least invite members to join Typophile?</p>
