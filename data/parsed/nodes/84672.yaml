      <p>Kyle, thanks for the details.</p>
      <p>I guess you're making type because you enjoy it. That's not a bad reason at all, but you might be able to afford to enjoy it more if you position it more shrewdly. For example I wonder whether offering the font to the Lone Rider guy for let's say $100 (maybe with a limited-time exclusivity, after which you could sell it retail) might have been better: you might have actually made less money (compared to the ~$60/month for the past few months) but you could showcase it as a custom job - which sounds much better than having yet another retail font out there.</p>
      <p>hhp</p>
