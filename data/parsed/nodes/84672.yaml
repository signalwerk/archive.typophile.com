      <p>It's certainly not paying my rent, but I've had a pretty decent response. Last month I sold ±30 copies. My type designing hobby isn't to make money, or to be noticed. That's why I sell it for a couple bucks. It ensures low sales, while maintaining a user base who will let me know how I can improve the font.</p>
      <p>No, I didn't try to sell it to the lone rider guy. His interests are far from having custom type. But I have done this with other fonts that aren't up on my site.</p>
