      <p><em>Is there a defined copyright length for typefaces after the designers death?</em></p>
      <p>I am not a lawyer, this is not legal advice: I believe copyright for typefaces is only 25 years in Europe. Israel has artistic copyrights (Microsoft lost a lawsuit over this recently) and there may be other rights (design rights, design patents, and special German court appointed rights)</p>
