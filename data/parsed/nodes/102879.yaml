      <p>Would that it were so simple... There is no sanity with EULAs, as Tiffany Wardle lamented long ago. The original intent was probably to protect against piracy, but there are other financial issues at stake now.</p>
      <p>Check the EULA carefully In your particular case, for example, the EULA <strong>may</strong> permit embedding the font in the PDF sent to the printer, but no other uses. For web distribution, you would then make another PDF. With that one, several solutions -- use the WEB version of the fonts (i.e., pay more), turn the font characters to outlines, or ... probably other techniques I've missed.</p>
      <p>But the real answer, far as I'm concerned, is to only purchase fonts (licenses) that present a simple &amp; seamless workflow at your end. </p>
      <p>We've gotten to the point where Wall Street investment bankers and all too many font publishers have much in common.</p>
      <p>It's your money, spend it as you want.</p>
      <p>Buy nothing from Monotype/Linotype, H&amp;FJ, FontFont, etc. Some of the smaller font publishers have quite good EULAs. Not sure about Adobe's embedding restrictions, but I do know you can embed for printing. As Adobe is heavily invested in PDFs, there is an easy, seamless solution for web use, too.</p>
      <p>Youngsters find this appalling. So many fonts with either expensive or restrictive licenses when it comes to using them. But for 500+ years, until the mid 1990s, people worked with just a few fonts. Somehow, advertising got done, books written, culture preserved, etc. Even limiting yourself to fonts with sane EULAs, you have far more to choose from these days.</p>
