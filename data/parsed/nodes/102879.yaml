      <p>Are the fonts 100% embedded, or are they subset? Most foundries allow subsetting. It seems odd to me that if they are 100% embedded, their EULA prohibits the practice yet they failed to set the flag within the font to prevent it.</p>
      <p>The EULA's legal precedence would likely be superior to that of the font setting, and it probably is enforceable. Your best choice would be to contact the foundry and discuss this issue with them.</p>
