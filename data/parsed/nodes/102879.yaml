      <p>Darren , just like you should indeed be careful about taking the advice of type designers when it comes to buying fonts, be careful about taking the advice of somebody who uses fonts in a very niche way. So a blanket statement like "buy nothing from Monotype/Linotype, H&amp;FJ, FontFont" might be good advice for a small minority of people, but it's clearly bad advice for most people (probably including you).</p>
      <blockquote><p>Typophile runs about 10:1 type designers to type users</p></blockquote>
      <p>False. And very likely intentionally so.</p>
      <blockquote><p>Youngsters find this appalling.</p></blockquote>
      <p>Then they grow up. Many of them even end up liking classical music! The horror...</p>
      <p>A moment of lucidity:</p>
      <blockquote><p>I'm not much help either</p></blockquote>
      <p>I think you're quite helpful to anybody who is able to factor in how narrow (if refined) your experience is. It also helps a great deal to be able filter out your emotional hang-up against type designers.</p>
      <blockquote><p>They find users' concerns about costs puzzling.</p></blockquote>
      <p>This is also largely false. Most type designers are not rabid hermits.</p>
      <blockquote><p>But for 500+ years, until the mid 1990s, people worked with just a few fonts.</p></blockquote>
      <p>For much longer than that people worked without typesetters either... Obviously that's moot, and lamenting choice and cultural richness <em>will</em> turn you into a rabid hermit.</p>
      <p>Not everybody needs to appreciate the subtle visual language of typefaces, hence the real cultural need for a large number of fonts. But a good typesetter (one that will be hard to replace with an algorithm sooner rather than later) necessarily does. A good typesetter appreciates type designers.</p>
      <p>--</p>
      <p>Here's my advice:<br>
      - Do be aware of what you're paying for; avoid a font with a EULA that's likely to get you in trouble. Usually you'll be able to use any font you license in some productive ways, but not every productive way. For this client, avoid the problematic fonts (and let the foundries know that you did).<br>
      - If there's a EULA clause that you find unethical, violate it; just don't shy away from the consequences if you get caught. Don't do something because you think you can get away with it - do something because you believe in it, whether you think you can get away with it or not. To me, there's only one such -sadly common- clause: one that says you can't modify the font. Just keep the results -and the fact that you did it- internal.</p>
      <p>hhp</p>
