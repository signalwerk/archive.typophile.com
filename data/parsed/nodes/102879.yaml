      <p>You mentioned that a lot of your fonts come from Fontfont, who have a much clearer policy of embedding fonts than most.</p>
      <p><a href="https://www.fontfont.com/faq" title="https://www.fontfont.com/faq">https://www.fontfont.com/faq</a><br>
      <a href="http://fontfeed.com/wp-content/uploads/2009/09/ff-eula-non-editable-embedding-permitted.pdf" title="http://fontfeed.com/wp-content/uploads/2009/09/ff-eula-non-editable-embedding-permitted.pdf">http://fontfeed.com/wp-content/uploads/2009/09/ff-eula-non-editable-embe...</a></p>
      <p>I work in video games producing User Interfaces and this is a constant headache for me. For something that is not a particularly new idea, a huge number of foundries are struggling to keep up with the times and don't offer clear pricing for embedding without obtaining a custom quote. Sometimes the price that comes back is so much it's ridiculous. Things have only started to move on because of the web and the increasing popularity of tablet devices and app development.</p>
      <p>Increasingly we are turning to FontSpring because it's such a simple website to use, there are no custom quotes etc, the pricing is very clearly outlined. Their selection is quite limited however.</p>
