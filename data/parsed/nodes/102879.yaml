    <p>Hi all<br>
    One of my clients has asked me to provide the EULA for the fonts used in the design work. Not an issue as the fonts were legally purchased. However in reading the agreements, one of the foundries prohibits embedding. When producing PDFs for print and also electronic distribution the fonts are embedded (i.e. I'm not sending the font out of house) and without specific software, for all intents and purposes they are non-editable - would this be considered illegal and can they actually enforce this?</p>
    <p>If I send this to my client they are probably going to force a change in the font which I really don't want to do, but more of an issue is that this may effect many of my fonts and client work.</p>
    <p>Surely everybody needs to embed fonts in PDFs and for distribution and production?</p>
    <p>Has anyone experienced this before?</p>
    <p>Thanks, any advice hugely appreciated.</p>
