    html: "<p>I really like this design. Some quick, candid thoughts: 'C' slightly too wide? 'F' looks wider than 'E', should look narrower. I'd widen 'E' a bit. Arm serifs on both look more prominent than their other serifs. 'K' diagonal is too fat. 'a' looks a little unbalanced to me. 'g' beak should be better friends with 'i', 'n', 'm', 'r' serifs. Also, 'g' is too fat above its waistline. Try to rethink that glyph, I'd suggest. Tittles look crisper than the rest of the glyphs, I'd dullen them somewhat. 's' a little to narrow for my taste, but it works as it is. Some serious issues with its curves, though. It looks like you use too many points. Use as few as possible, and mind your extremas. There are similar issues with other curves too. Get rid of all the uneccessary points, and this will be good.</p>"
