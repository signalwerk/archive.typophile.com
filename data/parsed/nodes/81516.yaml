      <p>Much stronger. I think this is really pulling together and shaping up as a useful and distinguished face. Big improvements to c, r, and t.  The R's both gorgeous and sturdy now, and fitting in nicely. I'm still not convinced by the g or the o, though; the g looks a bit heavy and as if it's tipping backward to the left, and the o seems light and just not, I dunno, organic. And I prefer the previous tittles; the very slight rounding of two opposite corners just looks tentative and unfinished to me. I miss the old Palatino-ish broad s, but the new one will probably read better.  Though I do think it's got kind of a bump on the bottom of the spine, toward the upper left corner. And could the crossbar of the e be a tad light? But overall this looks tremendous to me, and I think it's getting to where it should be reviewed in text sizes in running text before a lot of further revision is done. </p>
      <p>Nice work!</p>
