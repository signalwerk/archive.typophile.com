    html: |-
      <p>Your text sample certainly highlights some problems, Gary, but I also think it's showing a whole lot of promise.  The paragraph already has a very pleasing look to me; firm, bookish, and distinctive without being eccentric or distracting.</p>
      <p>Maybe you should refine the letterspacing in your trial font before you go too far redrawing your glyphs?  I agree that the color is blotchy now, but a lot of those dark spots certainly come from too-tight and too-loose letter combos.  The left sidebearing of the a seems pretty narrow, for one thing, and the i's seem unmoored.  </p>
      <p>I agree that your g needs rethinking.  It's very dark now, with a very strong horizontal stress; the gg in your sample really jumps out.  And I find it just less handsome than most of your lowercase letters.</p>
      <p>I think the widths of s &amp; e are spot on, and that the a balances beautifully; I'd hate to see you mess with it too much.  But, yeah, those tittles look a little out of place now.  Maybe save the tilted squares for another face, and use some sort of rounded shape here?</p>
      <p>This is a pretty substantial face now, in my view.  Are you sure you want to make it darker still?</p>
      <p>I like the name.  But then, I'm writing this from Dublin, where I'm visiting my in-laws.  I agree that the name suggests something a bit more Gaelic than this.</p>
