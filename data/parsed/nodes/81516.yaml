      <p>I too am a big fan of the Dutch style typefaces. Your sketch definitely has a nice character to it. I find it a bit too sketchy at this point to really go into too many detail, but a few things you could look at: </p>
      <p>Mind the contrast (thick/thin), some letters are quite heavy compared to others (i.e. bottom of d/e are heavy compared to the c and b). </p>
      <p>The o looks a bit like a rotated transitional o, instead of a humanistic o. Perhaps you could draw a few o's with a broad nibbed pen or broad felt tip (or tape two pens to each other!), to see how you can get that interesting humanistic relation between the inner shape and the outer shape. Some other characters might benefit from this too. </p>
      <p>I find the s to be out of place; it doesn't really fit with the typeface (it is also too light), perhaps it's not humanistic enough. I.e. look at the terminals of the c and a, they are more brushy, while the s is very angular with its serifs. Speaking about the a; the top terminal looks a bit too light. </p>
      <p>The bottom of the t looks a little bit wobbly. The g looks more French-ish to me than Dutch.</p>
      <p>I also think what I said about the s could be applied to the capitals, they look a bit too rigid, especially because of the terminals and serifs. You know, the lowercase looks broad-nib/brushed, while the capitals look like they're chiseled.</p>
