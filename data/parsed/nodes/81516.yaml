    html: |-
      <p>This is gorgeous.  And unlike a lot of new designs out there, I think it really does have its own personality, its own reason for being.  Very strong and elegant.  Favorite glyphs: R, a, h, m, n, r, s.  And those tilted squarish tittles on i and j are killer.  You can't tell from a large-scale showing like this, but it looks like it might make a really readable face.  Mazel tov!</p>
      <p>That said, I do agree there's work to do.  For one thing, I just can't get comfortable with a mix of bracketed and unbracketed serifs.  I know rules were made to be broken, but it seems self-conscious to me.  I'd bracket them all, if I were you.</p>
      <p>The upper case and the lower don't quite marry for me yet.  For one thing, the upper case seems lighter.  The stems on the upper case should be a bit thicker than those on lc characters, since they need to be proportional to characters that are bigger overall.  The curved strokes need to be heavier still; the fattest part of C should be much thicker than the fattest part of I.  The diagonal legs of R and K seem too light to me.  (So does the diagonal leg of the k.)  And the feel of the whole upper case strikes me as more delicate, lapidary, and van Krimpen-ish than the lower, which has a vigor that reminds me of Lexicon.  Maybe you could try beefing up the upper case and bracketing the serifs, and see where that gets you?</p>
      <p>The u and t seem a bit heavy at the bottom, and the crossbar of the t seems short on the left side.  </p>
      <p>The top of that wonderful R seems a bit fragile; the big counter looks like it's ready to burst through it.</p>
      <p>There are a few places where the transitions from thick to thin stroke seems too abrupt; the eye of the e, the o, and the lower bowl of the g.  </p>
      <p>But this is a terrifically strong start.  I'm jealous, and I'd love to see where it goes next.</p>
