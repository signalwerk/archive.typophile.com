    html: |-
      <p>I agree completely with Bendy.</p>
      <p>'Lexicon' also has very thin junctions. My newspaper (NRC next) uses Lexicon those thin junctions work perfectly fine IMO. In fact, they help to make the text look crisper and more vivid, without being distracting.</p>
      <p>The g really seems to be too quirky compared to the rest. Try to base it slightly more on the g in lexicon, which has that crispness to it.</p>
      <p>I think it will help the comfort of reading if you let the joints in /n/ (and alikes) and /p/ (and alikes) meet the stem at the same height.</p>
      <p>Your thin points in /o/ should be the same thickness as the bottom of the bowl in b. </p>
      <p>I think it's a bit too early to move on to bolder/lighter weights, but it's your choice.</p>
      <p>Keep going!</p>
      <p>btw: There are still some quirky curves, but this isn't much of an issue at text size, so you might as well just ignore them.</p>
