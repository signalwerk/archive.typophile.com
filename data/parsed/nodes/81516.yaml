      <p>I'm with Bendy: the highly tapered junctions look good to me, and I also thought of Lexicon (and, of course, Swift).  Though of course these may need fine-tuning when you see high-res proofs of running text.</p>
      <p>I'd also like to draw your attention to Hendrik Weber's Lirico from Ourtype, where the junctions have been tapered down to literally nothing: there are tiny gaps between the stems and the arches.  And the result looks lovely and reads just fine:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/OTLiricoSample_5233.png"></div><p></p>
      <p>And I agree that the first iteration was about right for a book weight, and that the newer versions are getting a little plump.</p>
