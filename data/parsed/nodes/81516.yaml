    html: |-
      <p>&gt; <em> ...The o was drawn completely in Fontographer...</em></p>
      <p>Well, I think a typeface like this would really benefit from actually writing some of the letters with a broad nibbed pen or two regular pens taped to each other, so that you start to really understand how the tool has (historically) influenced the contrast and the relation between the inner and outer shapes.</p>
      <p>As for the o; it's probably mostly that the contrast is wrong compared to the other characters. The axis of the contrast is something like 30 degrees, but with the o it isn't. In other words, the thickest parts of the o should be at the 2 and 8 o-clock positions, approximately. Just like the thickest part of the b is at 2 o-clock and on the d at 8 o-clock.</p>
    html_clean: |-
