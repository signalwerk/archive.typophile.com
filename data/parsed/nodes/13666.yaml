      <p><a href="http://dafont.com/en/font.php?file=woodcut" target="_blank" rel="nofollow">Woodcut</a> isn't exact, but is free and would look close to the untrained eye.</p>
      <p><a href="http://dafont.com/en/font.php?file=barrelhouse_all_cap" target="_blank" rel="nofollow">Barrelhouse</a> is kind of grungy, but its letterforms are close if you remove the shadow and again, it's free.</p>
      <p><a href="http://www.fontshop.com/?fuseaction=catalog.fontpackage&amp;searchby=manufacturer&amp;displayfontid=LH.100644.0.0" target="_blank" rel="nofollow">Escorial</a> is a nice alternative in the same vein as Engravers.</p>
      <p>A nice <a href="http://www.fontshop.com/?fuseaction=catalog.fontdetail&amp;searchby=manufacturer&amp;displayfontid=EF.292.0.3" target="_blank" rel="nofollow">Caslon Black</a> might also work.</p>
      <p> - Lex</p>
