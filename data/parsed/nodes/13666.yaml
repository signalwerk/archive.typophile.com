    <p>Hi guys,</p>
    <p>we are asked to design a one dollar bill for promotional purposes (like a "Disney Dollar") and after a few hours of researches we still dont know what fonts are used on the original "One Dollar" bill. Would be great if you could have a look at the picture and may help us.</p>
    <p>Thanks, Flo..</p>
