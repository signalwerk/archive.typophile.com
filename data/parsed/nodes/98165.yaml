  html: |-
    <p>Hi,</p>
    <p>I've pieced myself a logo together with some letters, now my main concern is; every time I show<br>
    someone the logo, they start reading it. While that's a logical approach, the logo was intended to<br>
    be a form, a hieroglyphic kind of stamp. Maybe it's my fault for trying to be legible &amp; abstract at<br>
    the same time... although I'm not that far away from the answer :)<br>
    The way the setup works now is by merging the 'K' &amp; 'E' into the 'O';<br>
    because of the letter width compared to the 'I'.<br>
    Ah yes before I forget, it should read out 'op de koffie', but placing the 'op de' above the 'koffie'<br>
    didn't work out composition wise. Last problem that I'm aware of is the first 'F' being read as<br>
    an 'E'.</p>
    <p>So if there are any ideas floating around be sure to send them this way :)<br>
    Thanks in advance, Matt</p>
    <p><a href="http://tinypic.com?ref=30ddpox" target="_blank" rel="nofollow"><img src="http://i50.tinypic.com/30ddpox.jpg" border="0" alt="Image and video hosting by TinyPic"></a></p>
