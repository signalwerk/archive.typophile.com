      <p>I know this is an old thread, but I thought I'd concur with gargoyle that my font, "Mansion,"<br>
       is the style you are looking for. It's a Haunted Mansion font that was also used in the TV show "Knight Rider."</p>
      <p>You can check it out at <a href="http://davidocchino.com/portfolio/typography/mansion.html" title="http://davidocchino.com/portfolio/typography/mansion.html">http://davidocchino.com/portfolio/typography/mansion.html</a></p>
