  html: <p>Hello All, <br> <br>The following is a screen capture from the movie The Omega Man. It features a font I've seen many times being used in projects of the period (1960s-early 80s). Perhaps it's most notable use was as the typeface used for the Knight Rider television show. I've tried my usual sources. Does anyone know its name and whether it's been digitized?  <br> <br><img src="http://www.typophile.com/forums/messages/83/23568.jpg" alt=""></p>
