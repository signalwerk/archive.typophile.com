    html: <p><a href="http://www.myfonts.com/fonts/solotype/excelsis/">Excelsis</a> is similar but not quite identical to Rubens. I remember seeing Rubens on one of the Solotype CD's, probably the Victorian one. <a href="http://www.castcraft-software.com">Castcraft/Optifont</a> also sells <a href="http://www.castcraft-software.com/designer3/designer3.11.html">a version</a>. There is a "freeware" version of dubious origin under the name <a href="http://www.grimghosts.com/down/fonts/fonts.html">Ruben</a>. <br> <br>I worked on a new digitization of a condensed Rubens-style typeface, based on typography from Disney's Haunted Mansion attractions. It's called <a href="http://www.grimghosts.com/down/fonts/fonts.html">Ravenscroft</a> and is freeware. <br> <br><a href="http://www.frontiernet.net/~treehous/Typefaces.html">Treehouse</a> also has a Haunted Mansion inspired font called <a href="http://www.frontiernet.net/~treehous/Mansion.html">Victorian Mansion</a>.</p>
    html_clean: <p><a href="http://www.myfonts.com/fonts/solotype/excelsis/" class="link-external">Excelsis</a> is similar but not quite identical to Rubens. I remember seeing Rubens on one of the Solotype CD's, probably the Victorian one. <a href="http://www.castcraft-software.com" class="link-external">Castcraft/Optifont</a> also sells <a href="http://www.castcraft-software.com/designer3/designer3.11.html" class="link-external">a version</a>. There is a "freeware" version of dubious origin under the name <a href="http://www.grimghosts.com/down/fonts/fonts.html" class="link-external">Ruben</a>. <br> <br>I worked on a new digitization of a condensed Rubens-style typeface, based on typography from Disney's Haunted Mansion attractions. It's called <a href="http://www.grimghosts.com/down/fonts/fonts.html" class="link-external">Ravenscroft</a> and is freeware. <br> <br><a href="http://www.frontiernet.net/~treehous/Typefaces.html" class="link-external">Treehouse</a> also has a Haunted Mansion inspired font called <a href="http://www.frontiernet.net/~treehous/Mansion.html" class="link-external">Victorian Mansion</a>.</p>
