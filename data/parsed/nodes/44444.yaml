      <p>You know, speaking of R. Crumb, I believe Steven Heller dedicated the book <a href="http://www.stoutbooks.com/cgi-bin/stoutbooks.cgi/69003.html" rel="nofollow"><em>Handwritten</em></a> to him, with an introduction that displayed many examples of Crumb's lettering over the years. (I don't have a copy of the book now, but I once borrowed it from the Brooklyn Public Library.)</p>
      <p>[EDIT] And yeah, I agree -- those guys (Ware, Crumb, and others) are damn good when it comes to lettering, titling, etc.</p>
