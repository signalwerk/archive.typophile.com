      <p>I strongly doubt the name "Sand Saref" is a coincidence. Punny names are not uncommon in The Spirit comics.</p>
      <p>The poster with the buildings turned into letters is very much in keeping with the graphic style of The Spirit. Eisner often worked the title of the strip graphically into the opening "splash panel" of his comics like that. The poster may even be based on one of them.</p>
