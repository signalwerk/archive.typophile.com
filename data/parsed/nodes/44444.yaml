      <p>Nice links, Ricardo - I don't care much for Will Eisner's comics, but his approach was brilliant and influential on almost anything interesting or good being done today in comics.</p>
      <p>It seems there should be a huge crossover between fans of type and fans of comics/graphic novels... of all the art forms, comics takes its lettering most seriously. (Daniel Clowes &amp; Chris Ware are not my faves - but, oh, they can letter!  So can Crumb.  Damn.)</p>
