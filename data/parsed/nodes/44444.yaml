      <p>So forties! Aside from this fanciful usage, lettering made of bricks has an ancient heritage in Chinese and Islamic architecture. Bricks of different colors or in relief would form the outline of square-shaped letters in a frieze. Here is a an example<br>
      <a href="http://www.flickr.com/photos/youngrobv/884594610/" title="http://www.flickr.com/photos/youngrobv/884594610/">http://www.flickr.com/photos/youngrobv/884594610/</a><br>
      This style later evolved into an Arabic lettering - and now font - style called square kufic.<br>
      Sorry sii if this is not exactly the intended direction for this thread!</p>
