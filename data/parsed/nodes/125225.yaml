      <p>Saad,<br>
      I always love your work and its inspiration, its going to historical roots and/or experimenting.<br>
      I never used the Sabine Irsal and Mutamathil Taqlidi weights I licensed in 2008 because I never had the occasion to have a text typeset in Arabic (and I stopped upgrading to InDesign ME too, for the same reason).<br>
      So happy to meet you once again! (Vladimir just told me the Typophile forums were back online).</p>
      <p>Not having enough familiarity with the forms, may I ask: there are some letters whose curves do not look much armonized: did you strive to keep as close to the manuscript forms, instead of "redesigning" the letters in a more structured way? Anyway, I appreciate a lot your approach, and most of your typefaces. All the best!</p>
