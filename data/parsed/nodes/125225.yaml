      <p>Dear Vladimir, Thanks.  Your photo is showing fine.<br>
      The beautiful sample you posted is Mashq in its later mature stages, borrowing from its Kufi style.  A wonderful Iranian Calligrapher, Seyed Vahid Mousavi Jazayeri, worked very hard in the past two decades to revive this calligraphy, giving many workshops and producing master pieces. He discovered the exact Qalam angle cut used.  You can see his work on the kuficpedia.org site.   You should join our group!</p>
      <p>In my font I was more concerned with the various Mashq scripts. Both the the original Mashq and its Kufi version were unstable for a while, it seems. Original Mashq had three baseline levels triggered by the Haa' group, and one shape for Yaa' (see sample1).  Kufi eliminated that, eventually, and introduced three styles of Yaa' but maintained one baseline level for most.  Mashq lived for a while side by side Kufi, borrowing from it, as it is seen from the "battah"  Yaa' shape in the sample you uploaded.  In Sample 2 and 3 (early Kufi) the Haa' ligatures are mainly in initial positions to maintain one baseline. Notice medial Haa'. This is the style I adopted in my Mashq Kufi font.</p>
