      <p>Just beautiful. In my days as an art student in London around 1963 I became fascinated with this script<br>
      I was allowed to study closely a 7th. c. Koran in this script (see attached photo)and had  enlargements of the waw و ordered, but to this day I wonder how the calligraphers created that tiny counter for this and other letters- it was written with multiple passes of the pen, but how?<br>
      Anyway seeing Saad's fonts reminds me so much of the beauty of the original script. He  caught its noble spirit, neatness, and economy of form. Inevitably however the mechanical reproduction makes the page look too<br>
      slick when compared to the slight variations between letters in the handwritten originals, but that cannot be helped! Congratulations!</p>
