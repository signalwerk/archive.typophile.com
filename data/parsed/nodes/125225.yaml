      <p>Dear Claudio,<br>
      I am glad our group is back. Happy to meet you again, and thank you for your encouraging words. My main goal in designing this family was to make it easy for many to learn reading the Early Mashq/Kufic scripts.  Despite the extreme importance of these scripts, since they were the first Arabic calligraphic styles introduced, I could not find fonts available for them. It should be noted, most Arabic readers are unable to read these scripts.  In fact, I have seen works by some calligraphy experts mixing up Early Mashq with the derived Early Kufic!  In this project, I concentrated more on the script rules and early vocalization (Tanqits) than on the beautiful calligraphic quality of these styles, which could only be seen much later after the two styles matured.  Yes, I wanted the font to look and behave as much as possible like the very early scripts seen in the Quran manuscripts displayed in the Museums. Since this was a ground-breaking font design project, I had to revisit some of the common logic employed today in producing Arabic OTF fonts, to make sure the font would be compatible with current Arabic keyboard and the Unicode Arabic alphabet.<br>
      -Saad</p>
