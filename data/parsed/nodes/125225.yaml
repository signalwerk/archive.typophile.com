    <p>Our new Mashq font family, possibly the first typeface implementation ever of the early Quranic scripts of the Early Mashq, Mashq Kufi, and Mashq Ma'il, is now available.  The font family design is primarily based on the scripts of the Quran manuscripts of  the Topkapi Museum, the Bergstraesser Archive, and other scattered samples.  Early vocalization (harakat) and Tashkeel (niqat) are fully implemented.  The variant shapes of the letter families of Yaa', Haa', and their ligatures are  also implemented, but their baseline shifts are only implemented for initial and final positions in the early Mashq.</p>
    <p>Browse images and try the font at: <a href="http://bit.ly/2icThU9">http://bit.ly/2icThU9</a>  (you will need Java enabled and arabetics.com added to trusted sites in Java)</p>
