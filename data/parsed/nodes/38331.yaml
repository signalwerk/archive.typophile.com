      <p>This latest batch is good - this is the sort of thing I was talking about two posts ago.</p>
      <p>I’d make the curves of the wave much more subtle, barely deviating from the horizontal. Try to make the right side of the wave work with the natural gap in the ’e’. Reversing the flow of the wave may help this, or it may not.</p>
      <p>I also disagree with Jonathan - I think there should be more modulation in the stroke. Make it about twice as thick at either end, and just a hair thicker in the middle.</p>
      <p>As for colours, try something like PMS 7474 for the “water” and PMS 2915 for the “sky”. These are just suggestions. Play around with the colouring - it can work.</p>
      <p>As for one-colour, don’t use a patterned fill. This will only dull your logo’s impact. Keep it solid like you showed in your last example.</p>
      <p>Have you thought about using an italicized type to suggest speed? It might come off as cheesy, but it’s worth a look.</p>
      <p>I agree with Henry that this is going in a great direction and it just needs a little massaging to look good.</p>
      <p> - Lex</p>
