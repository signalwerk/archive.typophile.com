      <p>If the right side of my brain wasn’t dead at birth, it surely shrivled up and died in engineering school, so I really appreciate everyone’s suggestions and comments.  It is encouraging to know that while I know the logo is far from perfect, at least I am somewhat getting the idea across.    For some reason I can tell if a logo is crap or not, but seldom do I know what to do about it.</p>
      <p>I was busy today with the other kind of artwork that I do - circuit board layout.  I’m now switching gears over to logo work again and hope to incorporate everyone’s feedback into another revision.  I’ll post it up when I’ve got a rough image ready to go.</p>
      <p>And, to answer questions posed before, I am definitely inexperienced in the logo realm.  But, I work with a lot of other software tools (i.e. circuit design / capture / layout tools, autocad, etc) so I can usually acquire a rudimentary understanding of how to get around.  </p>
      <p>I’ve actually learned a lot so far, and that’s directly a result of those who donated their valuable time to critique my logo on this forum.  I have a new respect for logos and artwork when I see them now...</p>
