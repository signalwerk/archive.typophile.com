      <p>I think the original idea is workable. The contrast between the top color and bottom color would need to be reduced. On the cover it might be textured on the top, and smooth on the bottom. In print maybe blue and light blue. Or blue and aqua. Etc. Blue and White is too much contrast and hurts legibility I agree.</p>
      <p>An added benefit of lowering the contrast: you could get rid of the ouline stroke. That will also help legibility. Finally, if you must have the outline stroke, instead of outlining the letters themselves, copy the word, paste it behind the original and add the stroke from below. That way the interior shapes of the letters don’t get eaten away.</p>
      <p>R</p>
