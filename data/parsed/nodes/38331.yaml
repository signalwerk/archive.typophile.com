      <p>Hey Justin,</p>
      <p>The logo itself isn’t bad at all, kerning aside (and someone more knowledgable than me can advise), it’s simple and strong and does everything it needs to as far as I’m concerned. It’s mariny and sporty, nice work. </p>
      <p>However I would lose the outline and the reversed-out-flag thing cause the former is hard to read and the latter is hard to read and looks a bit wack. This would especially be tru at small sizes.</p>
      <p>I would keep the wave-device and simply make the lower part of the letters a lighter/different blue, whether that means a blue from a different tonal group of a screened back version of the original blue. You could either make each blue butt up against one another or leave a white line between to emphasise the shape, If I were doing this, I would play with the thickness of the line at various places along it to give it a bit of personality.<br>
      hope this is helpful</p>
      <p>Nick</p>
