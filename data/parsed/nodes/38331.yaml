      <p>To repeat myself once again: I think it’s a huge mistake to drop the two-color concept just because some people tell you they’ve been taught that the base concept for a logo have to be mono-color. Take a look at the world around you, that guideline is obviously no longer in touch with reality — if it ever has been. A logo need a somewhat acceptable mono-color representation, but that by no mean has to be the base concept.</p>
