      <p>I totally agree with Lex. And I also think that you’ve done a very good job so far so you don’t need any designer to hire. You’re on a good way to make this logo work.</p>
      <p>Lex suggested italic type. I wouldn’t suggest to use real italics, because their slant may be too much. Try to slant it yourself for about 5 deg. Your Futura is oblique anyway so you can slant it yourself.</p>
      <p>Regarding the line: follow Lex’s advice about thickens. But reverting the slant may create a negative effect of falling instead of raising. Try to adjust the curve that much so it will break the “e” below the horizontal joint. And it will stop there. And it will be much better.</p>
      <p>But I would suggest something else. Tweak your extenders to make them shorter. “h”, “y”, “d”, “p” and “h” extent too much to my eye. It will also make the logo more compact and even more powerful.</p>
      <p>Regarding the colours: use flat colours as Lex suggests. Don’t use gradients/raster. You don’t really need it.</p>
      <p>And when you create the “split wave” try to position it on the letters to not create any thin or very pointed parts on letters (look at your “s”). And avoid too many changes in a small area (as you have in your current “e”). This will make it more natural and it won’t look it forces the text to split.</p>
