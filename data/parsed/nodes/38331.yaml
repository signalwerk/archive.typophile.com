      <p>I like this logo too. Work on it. If nothing else you will create a logo yourself (which is already quite nice and working) learn a lot and save some money too while doing it.</p>
      <p>But. the last version with a rectangle and negatives over it is working and is readable. BUT. Yes there’s a flaw in it. Look at the curve on the letter “e”. It crosses it just where it shouldn’t ant it makes it messy. Your original design has a different and better solution in this area.</p>
      <p>You could also try a double colour version instead of a negative shape. Just don’t use outlines because you’d have nothing else than problems with it. But there’s still one concern with double colour version. Think of your logo in one solid colour (stamps for instance). How would you do it there? It would complicate things.</p>
