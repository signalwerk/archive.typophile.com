    <p>Hi,</p>
    <p>I’m looking for feedback from the much-more-creative-than-I community regarding the logo for my startup company.  I want to stay fairly simple but still exhibit the following characteristics (for the electronic product this logo will be attached to):</p>
    <p>easy-to-use<br>
    confident<br>
    ski-boat related (i.e. marine-like)<br>
    technological</p>
    <p>I’ve struggled with the ’wave’ traversing the logo, trying to keep the text easily readable yet big enough to show it was purposely placed there (i.e. it actually looks like a wave versus a ’wavy horizontal line that looks like a printer defect’).</p>
    <p>Anyway, my company has zero income currently, and thus I’m trying to do the logo myself if at all possible.  I’m very grateful for any ideas and feedback, regardless of how harsh.  I’m still open to professional design services if anyone can recommend a particular firm that’s not too expensive and outputs good work...(if recommendations are legit on this forum).</p>
    <p>Thanks in advance for everyone’s help!<br>
    Justin<br>
    </p><div class="imageWrap"><img src="/files/hydrophase_base_outline_blue_72_pt_close_spacing_new_curve_320_3545.gif"></div><p></p>
