      <p>@Henry:<br>
      You’re right. I can see that more and more logos these days completely discard the mono version. I can’t even imagine how a logo like Virgin Media would look like in mono? I don’t know how a mono version actual looks. Probably without blurs etc. Just clean lines.</p>
      <p>I used to be taught you have to create your logo mono and then add other things too it if needed. If it works in mono, it’s much easier to make it colourful and make it work with hues.</p>
      <p>But looking at usage these days, stamps are still VERY much used for various paperwork. It’s somehow a proof beside the signature. Normally. At least in the country where I’m from.</p>
      <p>And yes Henry. I did say to Justin that his original is a very good example how a not so experienced person in design can create something that works. It needs work, but the rough idea and the result is much better compared to many other designs we have seen here done by somehow professionals. We all know that creating a logo is not a simple process at all and it doesn’t rely so much on a professional mind than on a great idea. The end result may be much better when a professional does it but without a good idea even a professional can’t make miracles.</p>
