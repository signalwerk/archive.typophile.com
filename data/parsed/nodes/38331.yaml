      <p>What I reckon, for what it’s worth, this is good, better than the reversed out shape thing:</p>
      <p>I agree with Jonsel about the lowercase ’e’, it looks a bit ugly, the ’s’ too and even perhaps the ’y’ — the line really needs to be sympathetic to the shapes of the letters, to make sure bitsy, secondary and distracting shapes arn’t created, I’m not sure how to exactly do this but to start with:</p>
      <p>You could make a wave shape that isn’t completely symmetrical, so it might start lower on the ’h’ with a sharper curve and then flatten out more as it gets to the ’e’, you could experiment to try the best fit for the letters</p>
      <p>Or use a similar wave to what you have now but make sure the wave completely bisects/replaces the ’e’s eye that would get rid of the worst of the problems</p>
      <p>I like the differing line-height, I reckon the height on the ends could be made even greater so the effect is obvious and it looks decisive</p>
