    html: <p>Flash can be off-putting. But you just have to understand how it works with Vectors and Bitmaps. Each image CAN have its own compression (in library &gt; symbol properties). Because flash is a scalable format, like Fredrik said, your pixel line was not snapped to a pixel. <br> <br>Overall it's quite a sensible application. These aren't bugs in the program, just misunderstandings, don't treat it like a graphics app. <br> <br>&gt;<i>The way Flash "tweens" between keyframes is really clunky.</i> <br> <br>Don't tween in Flash. <br> <br>&gt;<i>Maybe I just don't know enough, but I've spent hours in this program trying to learn it... you'd think I'da figured it out by now. </i> <br> <br>Don't make me laugh. I've spent 5 years in this program and still don't understand a lot of it. Just stick with it, and in a few weeks you'll be flying. I think it would be a waste of time trying other applications, cos you'll reach a stage where you can't go any further, then you'll be forced to start learning Flash from the beginning. There are plenty of websites and tutorials for learning.</p>
    html_clean: <p>Flash can be off-putting. But you just have to understand how it works with Vectors and Bitmaps. Each image CAN have its own compression (in library &gt; symbol properties). Because flash is a scalable format, like Fredrik said, your pixel line was not snapped to a pixel. <br> <br>Overall it's quite a sensible application. These aren't bugs in the program, just misunderstandings, don't treat it like a graphics app. <br> <br>&gt;<i>The way Flash "tweens" between keyframes is really clunky.</i> <br> <br>Don't tween in Flash. <br> <br>&gt;<i>Maybe I just don't know enough, but I've spent hours in this program trying to learn it... you'd think I'da figured it out by now. </i> <br> <br>Don't make me laugh. I've spent 5 years in this program and still don't understand a lot of it. Just stick with it, and in a few weeks you'll be flying. I think it would be a waste of time trying other applications, cos you'll reach a stage where you can't go any further, then you'll be forced to start learning Flash from the beginning. There are plenty of websites and tutorials for learning.</p>
