    html: <p>Thanks for the suggestions. I did look into Adobe's LiveMotion, but since they discontinued it, I'd rather not trot down that path. <br> <br>There are several reasons I've grown to dislike Flash (in my limited time using it). One "for instance" is it's inability to properly display imported (bitmap) images. I cannot find a way to make it NOT compress them. If I have a 1px white line on a black background, imported into Flash, I want that 1px white line to look like a 1px white line. Flash always seems to want to compress it and make it look antialiased. <br> <br>That is, perhaps, a clumsy example, since I could just make a line in Flash itself... but what if I don't want to? <br> <br>Another reason I'd like to find an alternative, is because I've grown used to Adobe AfterEffect's interpolations techniques (since I have a background in video). The way Flash "tweens" between keyframes is really clunky. Maybe I just don't know enough, but I've spent hours in this program trying to learn it... you'd think I'da figured it out by now. <br> <br>Anyway... I appreciate the suggestions. I'll have a look. (I have a feeling I'll be waiting for another program to be introduced.)</p>
    html_clean: <p>Thanks for the suggestions. I did look into Adobe's LiveMotion, but since they discontinued it, I'd rather not trot down that path. <br> <br>There are several reasons I've grown to dislike Flash (in my limited time using it). One "for instance" is it's inability to properly display imported (bitmap) images. I cannot find a way to make it NOT compress them. If I have a 1px white line on a black background, imported into Flash, I want that 1px white line to look like a 1px white line. Flash always seems to want to compress it and make it look antialiased. <br> <br>That is, perhaps, a clumsy example, since I could just make a line in Flash itself... but what if I don't want to? <br> <br>Another reason I'd like to find an alternative, is because I've grown used to Adobe AfterEffect's interpolations techniques (since I have a background in video). The way Flash "tweens" between keyframes is really clunky. Maybe I just don't know enough, but I've spent hours in this program trying to learn it... you'd think I'da figured it out by now. <br> <br>Anyway... I appreciate the suggestions. I'll have a look. (I have a feeling I'll be waiting for another program to be introduced.)</p>
