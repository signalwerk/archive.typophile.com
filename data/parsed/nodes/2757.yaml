    html: <p>There is a very well know raster image bug with flash. It has apparently been corrected with the latest release as long as you're publishing a version 7 swf. So it still presents itself as a problem because not everyone's ready to deploy version 7 swfs. <br> <br>Here's a page detailing the bug and a workaround for it. <br><a href="http://www.fatorcaos.com.br/flashimagebug/" target="_blank">http://www.fatorcaos.com.br/flashimagebug/</a> <br>There is still no way to prevent this from happening when using dynamically loaded jpgs with a version 6 swf.</p>
