    html: <p>Yes, flash has some issues with bitmaps. <br>Some tips though. <br> <br>Make sure your images top-left corner is on a even pixel. Use the propertiesarea to manually set the bitmap position to a non decimal number. Also make sure that the numbers starts from top-left and not the center. You control that with the square with nine subsquares inside.  <br> <br>Well anyway flash has a really really steep learningcurve. I have worked with it since version 2 and there are still things that I learn (if you except the scripting wich I never will learn good enough). <br> <br>/fredde</p>
