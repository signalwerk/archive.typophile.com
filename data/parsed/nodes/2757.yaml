    html: <p>Adobe once had a program, but that is discontinued. I have a notion, though, that it won't be the last time Adobe will try to underminde Macromedia here.. it must irk them to no end that in THIS design area, another company holds a semi-monopol.  <br> <br>Corel, as far as I know, has a tool, but that is rather miserable, from what I hear.  <br> <br>Freehand can do very simple swfs, but these are only okay for simple animations (which is what some illustrators use it for, as the layer-technique s very similar to Photoshop and traditional animatoion, so they're used to it... also the editing tools are better than in Flash).  <br> <br>And finally, there is Swish, which started as a simple text-animationtool but has pretty much evolved and nowadays can do some stuff. It's nowhere near as powerful as Flash is, especially when it comes to scripting (which is the key to making solid Flash-websites, without Action Script you don't get anywhere). However, I really like SwishMax as a simple presentation tool or for online banners and all that, as the interface is simpler and the everyday stuff, like fades and so on), is quicker done. It's not a professional tool, at only 99 $ it doesn't have to be, but simpler stuff is quickly done here and the new version actually offers pretty solid typography, alas nowhere near the real typo capabilities of flash (which still are lightyears behind Photoshop or InDesign or even Freehand). you can download a demo at <a href="http://www.swishzone.com" target="_blank">www.swishzone.com</a></p>
