  html: <p>greetings all <br>here is my beginings on a type set im calling form + kaos.  <br>i am a designer/writer (graff) and this is a class project but  <br>i am very interested in creating faces (not just graff) for myself.  <br> <br><b>problem 1:</b> <br>besides general critique i have the problem of the display  <br>face (kaos) not working together when other words are formed,  <br>i plan to create alternate opening letters as well as closing <br>letters + accents to really capture the whole graff feel. but is  <br>this possible and how. <br> <br><b>problem 2:</b>  <br>my teacher said to me, 'you'll never be able to create a text  <br>face from that' and so now i <b>have</b> to create a text face <br>from that. i tried to really tone down the handstyle to make <br>it work and am looking for suggestions to have a readable but <br>graff style text face. <br> <br>thanks\ <br><img src="http://www.typophile.com/forums/messages/29/54290.jpg" alt="kaos (the display)"><img src="http://www.typophile.com/forums/messages/29/54291.jpg" alt=""><img src="http://www.typophile.com/forums/messages/29/54292.jpg" alt="form (the text)"></p>
