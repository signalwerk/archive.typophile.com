    html: "<p>&gt; 'you'll never be able to create a text face from that' <br> <br>Teachers can be so wonderful, no? <br>Or maybe it's the old \"humans can never be automated\" romanticism... As if. <br> <br>It was never <i>impossible</i> to make \"organic\" fonts (see Mistral for a masterwork, in metal parallelepipedes no less), just admittedly quite tedious, and generally equally tedious to use. But now with the OpenType format some careful table-filling can make for quite elegant solutions: <br><a href=\"http://www.typophile.com/forums/messages/72/53553.html\" target=\"_blank\">http://www.typophile.com/forums/messages/72/53553.html</a> <br> <br>On the other hand, if he/she is using the term \"text face\" like me, as in distinct from display face (pretty unlikely), then no, it's not possible, but not because of some lack in you or technology, but because of the way humans are made. <br> <br>hhp</p>"
