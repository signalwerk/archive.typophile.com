      <p>I think you are successful at creating a hand written typeface, yet this has no relation to "graffiti "style besides the fact that it is closely kerned. Don't get me wrong, I enjoy seeing attempts at typefaces from fellow "writers."</p>
      <p>Although there are no "real" rules to graffiti, consistant style shows experience. </p>
      <p>For example:<br>
      -M: it seems as if the heavier the wieght, the sloppier it gets.<br>
      -B&amp;R: they are both consistant with eachother, but not with the other letters<br>
      -G&amp;E: hits weird angles not found in the other letters<br>
      -S: too much white space. not a very good rendition of modern graff. Does not follow the condensed feel of the other letters.</p>
      <p>...hope this helps.</p>
