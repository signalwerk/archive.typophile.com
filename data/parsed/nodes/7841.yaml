    html: "<p>Well, I'm not sure what you mean. You can't create a text face from that. Long pages of 10pt text in a blackslanted, loopy style of lettering would never work. Text faces are supposed to be invisible. <br> <br>But if you meant TYPEface, of course you could develop a typeface from this. In fact, I hope you do! Just keep in mind two differences: the difference between display sizes and text sizes, and the difference between type and lettering. <br> <br>Typefaces, or more explicitly fonts, are little computer programs, almost machines of their own, which can be used by anyone to form any combination of letters, words, lines, or pages. Lettering is the creation of individual letters, usually by some sort of hand technique. Grafitti is an excellent example of lettering.  <br> <br>In lettering, it is more common than in type for the individual letters to be different. Every time the letter \"e\" appears in a lettering piece, it is a little different than the one before it. In type, this is usually not the case (although now it is easier to create alternates and ligatures and such which have the potential to make some typefaces more like lettering). <br> <br>What you are showing here is a design for a display typeface, based on grafitti-like lettering. <br> <br>I like the big loops that you have in the B and the R. Would it be possible to bring this element into any other letters? maybe numbers? will you be creating an upper and lowercase, or just a unicase (as this seems to be now)? <br> <br>I also like that you are thinking about a type \"family\" as is evident from what you have shown here with the 5 different weights. <br> <br>Keep up the good work. I'm still confused about the whole \"text\" thing. Are you really saying that you want to create a workable \"text\" face out of this? What kind of applications would you like to see this used in?</p>"
    html_clean: "<p>Well, I'm not sure what you mean. You can't create a text face from that. Long pages of 10pt text in a blackslanted, loopy style of lettering would never work. Text faces are supposed to be invisible. <br> <br>But if you meant TYPEface, of course you could develop a typeface from this. In fact, I hope you do! Just keep in mind two differences: the difference between display sizes and text sizes, and the difference between type and lettering. <br> <br>Typefaces, or more explicitly fonts, are little computer programs, almost machines of their own, which can be used by anyone to form any combination of letters, words, lines, or pages. Lettering is the creation of individual letters, usually by some sort of hand technique. Grafitti is an excellent example of lettering.  <br> <br>In lettering, it is more common than in type for the individual letters to be different. Every time the letter \"e\" appears in a lettering piece, it is a little different than the one before it. In type, this is usually not the case (although now it is easier to create alternates and ligatures and such which have the potential to make some typefaces more like lettering). <br> <br>What you are showing here is a design for a display typeface, based on grafitti-like lettering. <br> <br>I like the big loops that you have in the B and the R. Would it be possible to bring this element into any other letters? maybe numbers? will you be creating an upper and lowercase, or just a unicase (as this seems to be now)? <br> <br>I also like that you are thinking about a type \"family\" as is evident from what you have shown here with the 5 different weights. <br> <br>Keep up the good work. I'm still confused about the whole \"text\" thing. Are you really saying that you want to create a workable \"text\" face out of this? What kind of applications would you like to see this used in?</p>"
