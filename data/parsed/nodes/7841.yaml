      <p>man I took forever to reply to this. Sorry Tiff</p>
      <p>Pizza dude's stuff is just not accurate in comparison to the level of graffiti handstyles out on the streets. </p>
      <p>There are certain things that ameture writers (toys) do, which is try to complicate their letters too much. They see what is going on around them and try to take elements from various artists and mash them together. Of course, in the font/lettering world, its obvious that this is not the normal thing to do...but graff is not broken down to a science, and this is something you learn in the "field." </p>
      <p>Just to give some insight on how deep the styles go, graff handstyles used to be regional before the internet came about. Now alphabets are being raped and toys copy the "flavor of the month."</p>
      <p>I see many "graff" (note the quotes) fonts out there that do this same thing, not only the pizza ones, but pretty much every other one on the market. There is even a whole site dedicated to selling some really <strong>bad</strong> grafffonts.</p>
      <p>However, check out <a>Joker's</a> font from Handselecta...a foundry that is doing it the right way. Joker's font is pretty true to his handstyle, but taken down a notch so that it will work well as an overall font.</p>
      <p>*sorry Kamzo, took this subject in a totally different direction, hope that project worked out for you</p>
