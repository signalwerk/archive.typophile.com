    <strong>Short Description:</strong> A clean, smooth adaptation of the gothic types used by Johann Fust and Peter Schöffer in their famous Mainz Psalter (<em>Psalterium Moguntinum</em>) of 1457.<br>
    <strong>Font Details:</strong>  <a class="freelinking external" href="http://www.alterlittera.com/al_htm/oldtype/psalterium.htm" rel="nofollow">Font Page</a>  at <a class="freelinking external" href="http://www.alterlittera.com" rel="nofollow">Alter Littera's website</a>.<p></p>
    <p>Thanks in advance for your interest.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/alter_littera_logo_4653.png"></div><br>
