    <p>A friend of mine got this from a fleamarket in Normandie/France. Must be from the 50s. I’m not asking for an ID since this is obviously custom made. But maybe someone knows something about this kind of wonky style or of similar looking typefaces. Any input is appreciated.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/boucherie_4255.jpg"></div><p></p>
