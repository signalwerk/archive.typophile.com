      <p>If ever there were an argument for the use of hand-rendering over typesetting, that would be it. It's lovely - you must be terribly jealous! It actually reminds me of med 20th century American design; in fact, the "B" recalls the "R" from the Reese's logo, the second "e" resembles the Coca-Cola ribbon, and the looseness reminds me of 40s "speedway" type similar to Leslie Cabarga's Streamline.</p>
      <p>As far as similar stuff goes, I'm certainly no expert on scripts, but Schizotype's release of last year, Astroboy, has an idiosyncratic, loopy air about it. Whether it's of any use to you, Jan, is another question!</p>
      <p><a href="http://new.myfonts.com/fonts/schizotype/astroboy/" title="http://new.myfonts.com/fonts/schizotype/astroboy/">http://new.myfonts.com/fonts/schizotype/astroboy/</a></p>
      <p>-NJ</p>
