    html: <p>I suspect that Frutiger has been the single most influential typeface in the past thirty years. It established a pattern of opening the counters of the round letters c, e, etc., which has been widely followed, including by de Groot's Thesis. You can see it in many, many other sans, including Myriad - which is more humanist than Frutiger, though. [Helvetica etc are the most closed by comparison, and the tide has been running against them.]  <br> <br>I recently ran across <a href="http://www.myfonts.com/Search?searchtext=adsans" target="_blank">Adsans</a> of Walter Tracy, which opens the counters in a similar way, and is a decade older. I don't think it is artistically as successful, but it is a similar idea. I would be interested in the history of this opening of counters - which is a theme in Bringhurst - if anyone knows more about it. <br> <br>Thesis TheSans, compared to Frutiger, not only opens up the c and e more, but straightens the arms, and alters the shapes of the pdq to match; the hmn look narrower, it has a binocular g, etc. I don't think it is that close to Frutiger, compared to many others who also show Frutiger's (or is it Adsans?) heritage.    <br> <br></p>
