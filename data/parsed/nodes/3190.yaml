    html: <p>Matthew, I think you're right. ITC Johnston Underground is not as open as Gill, and I think Frutiger still more open, but the humanist proportions are what does it, and Johnston and Gill I believe started this. As Bringhurst explains, it seems that Frutiger's idea was to bring some humanist features to a more geometrical face. The openness (compared to his 'Universe') also was probably influenced by his task of making very legible signage that could be seen at a distance a Charles DeGaulle Airport. </p>
