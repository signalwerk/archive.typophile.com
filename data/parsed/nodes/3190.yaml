    <p>Though TheSans and Frutiger are quite similar, I find they have a quite different feel. Does anyone have any background on de Groot's method or whether or not he was inspired by Frutiger (the man or the face)? Any thoughts on the application of either? <br> <br>Attached is a pdf I (quickly) made comparing them. <br> <br></p>
