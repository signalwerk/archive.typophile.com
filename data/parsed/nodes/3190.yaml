    html: <p>Yeah, myriad is very close to frutiger, but still, a lot of the plain letters of TheSans resemble frutiger. TheSans's italics are fantastic and blow frutiger out of the water. <br> <br>I'm not defending frutiger at all, in fact, I quite dislike it. But though there are a lot of glyphs that don't follow frutiger, I think there are some that do. I'm actually debating my former professor on this. He thinks TheSans is a frutiger knock-off, I think he's crazy. I'm trying to play his side (though it's a weak leg to stand on). <br> <br>This is awesome input for me. I appreciate it. <br> <br>Hrant, how is de Groot's stuff of a different school? As in, it's more fluid, post-modern, rounded, etc? I'm just an observer. Tell me how you <i>feel</i>.</p>
