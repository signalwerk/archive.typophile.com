    <p></p><div class="imageWrap"><img src="http://typophile.com/files/icehockey 001_6705.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/icehockey 002_3820.jpg"></div><p></p>
    <p>The great game of Ice Hockey is played on a Rink internationally that is 30 meters wide by 60 meters long. In North America the rink size is approximately 200 feet long by 85 feet wide. Older rinks like the old Boston Garden were smaller and not consistent between buildings. This makes the international rink wider by approximately 15 feet. </p>
    <p>These narrow NA rinks make for a more congested ice surface. The international surface makes for a more exciting game and for the player it provides more room for an attacking style of play.</p>
