    html: <p>well, it seems I wasn't very specific with the details I have provided. Radix is involved in several field of IT. more can be found on <a href="http://www.radix.ro" target="_blank">www.radix.ro</a>, their corporate website. <br> <br>as I have already mentioned, they decided to rebrand due to several factors, among which the high similarity of their symbol to that of one competitor, and the anniversary of 10 years of activity. the celebration will be held on July the 19th and all the work has to be done by that moment. they decided for a logotype that incorporates some design element that would preserve a part of the visual equity of the brand, that's why the whole process is rather hard to develop. <br> <br>I will be providing refinements made to the logotype as I develop them. <br> <br>thank you for your imputs.</p>
