    html: "<p>I got in...company history states: <br><i>Radix SRL is a Romanian IT company positioned as corporate solution provider. Our solutions consist in a complete line of hardware supplies, services and software solutions for imaging, enterprise information portals, document and knowledge management, database replication, fax/messaging for networks, WAP solutions, communication lines sharing, CAD/CAM. Powerful partnership inside Radix group of companies gives us a strong competitive edge and power to address most of the challenges in the Romanian IT market. <br> <br>Now we have two offices: in Bucharest and Iasi providing us a strong and effective distribution network for our solutions over all the country. We want to be the most advantageous alternative to our customers, offering better conditions concerning price and performance and also providing effective warranties and service applicable in Romania. We use every possible way to accommodate the needs and wishes of our business partners even in the most difficult and unusual situations brought on by a constantly changing market and the evolving needs of our customers.</i> <br> <br>so I'm guessing a MEGA B2B co.</p>"
