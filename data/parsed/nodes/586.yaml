  html: "<p>we are involved in the rebranding of romania's seventh IT company and we have analysed so far rebranding programmes for IT companies. almost all of them go for the logotype solution. <br> <br>so, we tried to develop a logotype based on the visual personality of the old logo, in an attempt to preserve some brand equity. I wanted to ask all the great type designers on this forums where they get theit inspiration from. <br> <br>how do you start working on a logotype? <br> <br><img src=\"http://www.typophile.com/forums/messages/29/12809.gif\" alt=\"comparison\"> <br> <br>is the solution we came up with acceptable from the type pont of view? thank you all so much .... <br> <br>PS: there is another thing bothering me now: brand's verbal distinctiveness lies in its \"X\", but this letter evolved into a visual cliche. what's left to be done?</p>"
  html_clean: "<p>we are involved in the rebranding of romania's seventh IT company and we have analysed so far rebranding programmes for IT companies. almost all of them go for the logotype solution. <br> <br>so, we tried to develop a logotype based on the visual personality of the old logo, in an attempt to preserve some brand equity. I wanted to ask all the great type designers on this forums where they get theit inspiration from. <br> <br>how do you start working on a logotype? <br> <br><img src=\"http://www.typophile.com/forums/messages/29/12809.gif\" alt=\"comparison\"> <br> <br>is the solution we came up with acceptable from the type pont of view? thank you all so much .... <br> <br>PS: there is another thing bothering me now: brand's verbal distinctiveness lies in its \"X\", but this letter evolved into a visual cliche. what's left to be done?</p>"
