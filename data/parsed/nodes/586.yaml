    html: <p>I don't like to be rude, but maybe you should really think again about the concept of that double line in x letter. It is not just that it is a visual cliche, that cliche is also a bit dated and could even cause difficulties with legal protection in many countries.  <br> <br>&gt; how do you start working on a logotype?  <br> <br>Mostly the same way you did. What you did could be one of the schetches, but maybe you have to look for more solutions and than choose the one with no obvious problems like 'visual cliche'. <br> <br>In case you insist to present this logo, you will probably have to make vertical/horizontal optical correction. You should also consider the rythm of the logo which is broken (as Dmitry noticed) by the very wide and open D. It's counter is much larger than the ones in other letters.  <br> <br>I hope that we will be able to follow the evolution of this logo soon. <br> <br> <br></p>
    html_clean: <p>I don't like to be rude, but maybe you should really think again about the concept of that double line in x letter. It is not just that it is a visual cliche, that cliche is also a bit dated and could even cause difficulties with legal protection in many countries.  <br> <br>&gt; how do you start working on a logotype?  <br> <br>Mostly the same way you did. What you did could be one of the schetches, but maybe you have to look for more solutions and than choose the one with no obvious problems like 'visual cliche'. <br> <br>In case you insist to present this logo, you will probably have to make vertical/horizontal optical correction. You should also consider the rythm of the logo which is broken (as Dmitry noticed) by the very wide and open D. It's counter is much larger than the ones in other letters.  <br> <br>I hope that we will be able to follow the evolution of this logo soon. <br> <br> <br></p>
