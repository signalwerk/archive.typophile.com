    <p>Hello Everybody,</p>
    <p>Since it’s my first post here I hope am in the right section.</p>
    <p>I was wondering what size should be my document in illustrator when you design a glyph so when you take it to FontLab it is proportional to the rest of the glyphs that are already there (Having started from a already existing font).</p>
    <p>My first research made me use the UPM and set it to 1000 and then my illustrator file was set in points to 1000 by 1250 pt.<br>
    Then i had to see the descenders size and set guides in illustrator to draw my glyph there but then I stopped.</p>
    <p>I have no idea what size should my glyph be because even when i have the guides drawn and all i still have missing values.<br>
    I also checked the do not scale when importing .eps</p>
    <p>Thats about all i know till now about importing from illustrator.<br>
    If anyone can explain to me the logic behind the whole process and how to do it in the future without having to memorize without knowing the why’s behind every step.</p>
    <p>Thanks everyone.<br>
    Tyler.</p>
