      <p>Jan,</p>
      <p>Very close, thanks. The S&amp;W type has older looking, more rounded off serifs. Is there an older predecessor to Clearface that might be closer? Also, in order to get the yellow (Clearface) to be close to the underlying (blue) original, I did a LOT of horizontal scaling, kerning and even baseline shifting.</p>
      <p>For perspective though, S&amp;W told me they use Garamond Bold to approximate it. It doesn't.</p>
      <p>Thanks for the input!</p>
      <p>Joshua</p>
