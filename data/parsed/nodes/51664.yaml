      <p><em>Is there an older predecessor to Clearface that might be closer?</em></p>
      <p>Clearface was designed by Morris Fuller Benton for American Type Founders in 1907. In 1978, under license from ATF, the International Typeface Corporation commissioned Vic Caruso to develop it into a family of four weights with corresponding italics. ... And then it went digital. So, transformations happened.</p>
      <p>To answer your questions: Not in digital form.</p>
