    html: <p>I'm with Will, but I don't mind getting quotes over the phone. Perhaps I just don't trust myself or the printer enough. But I find that a conversation must take place in between myself and the printer. Discussing the project is where a lot of the bugs get worked out. If I only get a quote from a list of specifications and I don't get any remarks I worry that they are only scanning over what I've requested and are not really focussed on what I need.</p>
