      <p>1. What is the first thing you are looking for when visiting a printer’s website?<br>
      -Technical capabilities, prices and turnaround time.</p>
      <p>   2. Do you think that the quality of a printers’ website may be an indication of their services quality? If a site is too complicated - do you leave it and forget it or are you trying e-mail or call them?<br>
      -I would expect a competent and professional printer to likewise respect the quality of designer's work and invest in a conceptually sound and aesthetically pleasing website. At the same time, I would rather go for a relatively simple and crudely made site, then a confusing multi-tabbed juggernaut of marketing nonsense. I expect my relationship with the printer to be direct and personal, and the latter type of a site, would suggest the nightmarish future of being bounced between faceless departments, with all of the confusion, mistakes and misunderstandings that can arise from that.</p>
      <p>   3. Do you prefer to get a quote on-line or do it over a phone?<br>
      -Online (via email) if possible.</p>
      <p>   4. What else would you expect from a good printers’ website?<br>
      -Easy transfer of large files, examples of prior work, easily accessible templates for commonly used cd's and folders, list of preferred formats and file specs.</p>
      <p>_____________________________________________<br>
      Personal Art and Design Portal of Ivan Gulkov<br>
      <a href="http://www.ivangdesign.com" title="www.ivangdesign.com">www.ivangdesign.com</a></p>
