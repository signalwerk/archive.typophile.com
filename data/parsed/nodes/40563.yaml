      <p>Let me expand on what I earlier wrote.</p>
      <p>I only specify and buy printing for books, casebound and paperbound. I work with only six printers at the most over the course of a year. Sales and service staff at these printers and I know one another quite well. Specifications for books such as we publish are for the most part pretty standard. It is in the details where each differs from the others.</p>
      <p>That's why I type out my specs and require in return quotes that can be shown on paper: I want that paper trail.</p>
      <p>Plus: I am a bit constrained in my bidding process by state purchasing regulations. The paperless office is not yet here: the Finance office requires a paper copy and I keep one on hand for reference. Storage of quotes will always be an issue: paper in file cabinets or files on a server which is already overcrowded.</p>
      <p>powers</p>
