    <p>Dear Typophiles,</p>
    <p>I was asked to redesign a website for a printing company. After some research I have to say that most of printers' websites don't look very inviting, to put it mildly.</p>
    <p>I guess Typophile, full of people publishing for print, is the right place to ask my questions. Your feedback would be much appreciated.</p>
    <ol>
    <li>What is the first thing you are looking for when visiting a printer's website?</li>
    <li>Do you think that the quality of a printers' website may be an indication of their services quality? If a site is too complicated - do you leave it and forget it or are you trying e-mail or call them?</li>
    <li>Do you prefer to get a quote on-line or do it over a phone?</li>
    <li>What else would you expect from a good printers' website?</li>
    </ol>
    <p>If you have anything else to add, please don't hesitate to do so.</p>
    <p>Thanks.</p>
