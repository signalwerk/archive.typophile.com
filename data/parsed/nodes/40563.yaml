      <p>NO ON-LINE QUOTES!<br>
      I never get quotes on line or on the phone. I e-mail specifications to printers and I ask them to send me quotes back by e-mail.</p>
      <p>I find that no printer's web site quote apparatus is sufficient for me to convey all the info I need to give them. I have a boilerplate spec form that I customize to each project. I rarely get calls or e-mails asking me to clarify specifications. When I try to convey specifications via inadequate on-line forms I always get calls about what I meant. Usually the calls are stupid calls that could have been answered by the caller if she/she had taken 2 more minutes. </p>
      <p>Other than that, I want to know what kinds of books they produce, and especially what their binding capabilities are. I like to be able to see what kinds of text stock they keep on the floor.</p>
      <p>&amp; I don't care about the ability to upload files to a website or ftp site. I always send printers a stack of page proofs anyway, so I might as well burn the files to a CD and send it along. Not that much time difference.</p>
      <p>I realize that the quality of a web site has little to do with the quality of a finished book. But still, if I have to look at these things, I do hope they will be easy to navigate, at the very least. I do not want to see any stock photos of one person peeping over the shoulder of someone else sitting at a monitor.</p>
      <p>powers</p>
