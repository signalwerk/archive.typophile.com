    date: 2013-11-30T03:56:00
    date_raw: 30 Nov 2013 — 3:56am
    votes: null
    html: |-
      <p>It is not a problem. It is the Uniscribe text rendering as damma and kasra can not be placed simultaneously on a single letter, so the Uniscribe moves forward the second mark over the mark sign. Yes, you can apply a shadda with kasra to the same letter. {Uniscribe is the Microsoft Windows set of services for rendering Unicode-encoded text}</p>
      <p>Anyhow, you can get the required result in Adobe software.</p>
