  - id: 567433
    user: 43535
    date: 2013-12-08T03:58:00
    date_raw: 8 December 2013 - 3:58am
    votes: 0
    html: |-
      <p>You can solve it using the following syntax for all marks.</p>
      <p>uni25cc damma -&gt; damma</p>
      <p>Where uni25CC is the dotted circular shape below damma.</p>
