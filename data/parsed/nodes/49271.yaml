      <p>For some of the newly released typefaces I thought would be worth noting, check my series of <a href="http://for.ma/blog" target="_blank" rel="nofollow">(blog) posts</a> wisely named '<a href="http://for.ma/blog/?s=Type+releases" target="_blank" rel="nofollow">Type releases worth noting</a>'. ;)</p>
