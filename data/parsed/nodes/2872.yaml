    html: "<p>Your definition is too broad. <br>The conditions for a modular typeface should be: <br>1) the modules are separate <br>2) there is a limited number of modules <br> <br>In particular, there should be no joining strokes of irregular length between modules.</p>"
    html_clean: "<p>Your definition is too broad. <br>The conditions for a modular typeface should be: <br>1) the modules are separate <br>2) there is a limited number of modules <br> <br>In particular, there should be no joining strokes of irregular length between modules.</p>"
