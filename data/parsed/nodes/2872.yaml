    html: <p>Hey Tiffany and everybody else, thanks for replying.  :-) <br> <br>&gt;Does Wim Crouwel's book have a bibliography?  <br>No, he doesn't. He mentioned though some names that i will look after. But there are not many that are so consequent like Wim Crouwel. <br> <br>&gt; What other typefaces do you consider modular?  <br>LIke H�ctor Mu�oz Huerta and Nick Shinn indicated, there are many different grids for modular typefaces, technical or graphical. If you have a look at Albrecht Dürer's "Konstruktion der gotischen Minuskel", you will see that he used grid and modulars to explain or reconstruct a written typeface.  <br>Frank Blokland explained in his classes for calligraphy the construction of the "humanistische Kursive" and the "karolingische Minuskel" and if you want to see it this way, the single stroke of a pen can be seen as a modul.  <br>What i am trying to say is, that only the grids changed over the years, but the idea of modular typefaces exists for a long time.  <br> <br>&gt;Do the designer's of these typefaces have books which they have written?  <br>Is there a source in the net that can be used for this kind of research? Google drives me crazy with all the informations that i did not ask for.  <br> <br>&gt;Have you looked through magazine indexes?  <br>Just through the one of Eye, but the search function did not found anything about this theme.  <br> <br>&gt;Does modularity in typeface design belong strictly to modernism? Or does it flow into post-modernism as well? <br>I think modularity and grids are inspired or based on technical inventions. The grids of our time are based on horizontal and vertical measurements, but the grid of  the "karolingische minuskel" was based on handwriting, means the biological conditions of our hands and on the possibilities of a ink pen. <br> <br>So, i am looking for modular typefaces of all times and their backgrounds. I am also very interested on the further use of this typefaces. Were they used aswell for ornaments or illustrations? <br> <br>I just know one person that did this. Juan Trochut Blanchard, a catalan typographer.</p>
    html_clean: <p>Hey Tiffany and everybody else, thanks for replying.  :-) <br> <br>&gt;Does Wim Crouwel's book have a bibliography?  <br>No, he doesn't. He mentioned though some names that i will look after. But there are not many that are so consequent like Wim Crouwel. <br> <br>&gt; What other typefaces do you consider modular?  <br>LIke H�ctor Mu�oz Huerta and Nick Shinn indicated, there are many different grids for modular typefaces, technical or graphical. If you have a look at Albrecht Dürer's "Konstruktion der gotischen Minuskel", you will see that he used grid and modulars to explain or reconstruct a written typeface.  <br>Frank Blokland explained in his classes for calligraphy the construction of the "humanistische Kursive" and the "karolingische Minuskel" and if you want to see it this way, the single stroke of a pen can be seen as a modul.  <br>What i am trying to say is, that only the grids changed over the years, but the idea of modular typefaces exists for a long time.  <br> <br>&gt;Do the designer's of these typefaces have books which they have written?  <br>Is there a source in the net that can be used for this kind of research? Google drives me crazy with all the informations that i did not ask for.  <br> <br>&gt;Have you looked through magazine indexes?  <br>Just through the one of Eye, but the search function did not found anything about this theme.  <br> <br>&gt;Does modularity in typeface design belong strictly to modernism? Or does it flow into post-modernism as well? <br>I think modularity and grids are inspired or based on technical inventions. The grids of our time are based on horizontal and vertical measurements, but the grid of  the "karolingische minuskel" was based on handwriting, means the biological conditions of our hands and on the possibilities of a ink pen. <br> <br>So, i am looking for modular typefaces of all times and their backgrounds. I am also very interested on the further use of this typefaces. Were they used aswell for