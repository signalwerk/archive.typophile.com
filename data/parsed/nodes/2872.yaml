    html: <p>I think the broader you look the better you can analyse something interesting (as opposed to merely useful) out of Modularity. Like you, I don't think it's a good idea to have a very strict formal-structural benchmark. Maybe you should look at a module as any formal shape (out of a fixed set) that can however be applied in different ways, although only through predefined formal rules. <br> <br>hhp <br></p>
