    html: <p>The book Martin is looking for would be heavy on categorization, eg "How many Modules?" and "Shape of Module" and "Is there a grid?" and "Are the modules discrete?" <br> <br>Pixel fonts have one module. <br>Faces like Relay, LCD and Klaxon have more. <br>Test Pilot Collective has many interesting designs with strong modularity. <br>And then there's the classic, mysterious Fregio Mecano (22 units). <br>Don't forget Clotilde Olyffe. <br> <br></p>
    html_clean: <p>The book Martin is looking for would be heavy on categorization, eg "How many Modules?" and "Shape of Module" and "Is there a grid?" and "Are the modules discrete?" <br> <br>Pixel fonts have one module. <br>Faces like Relay, LCD and Klaxon have more. <br>Test Pilot Collective has many interesting designs with strong modularity. <br>And then there's the classic, mysterious Fregio Mecano (22 units). <br>Don't forget Clotilde Olyffe. <br> <br></p>
