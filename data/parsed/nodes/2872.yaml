    html: <p>You are right, the definition is very broad. But i am in the beginning of my research and do not want to decide in this state what is and what isn't a modular typeface.  <br>After your definition overlapping modules cannot produce a modular typeface, which would exclude very interesting typefaces based on modules.  <br>I agree though to make a difference in between constructed and modular typefaces.  </p>
