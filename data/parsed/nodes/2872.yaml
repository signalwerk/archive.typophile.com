  html: <p>Good morning to everybody, <br>i am making a research on the theme of modular typefaces and their changes over the time. It is very difficult finding good books about this theme. Most of them only offer Examples of typefaces, but very few are giving background informations.  <br>Maybe you know more.  :-)</p>
