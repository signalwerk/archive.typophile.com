    <p></p><div class="imageWrap"><img src="http://typophile.com/files/caffeine_font_5445.jpg"></div><p></p>
    <p>This is the font used for the top billing on the Caffeine poster as can be seen at <a href="http://www.impawards.com/2007/caffeine_ver2.html" title="http://www.impawards.com/2007/caffeine_ver2.html">http://www.impawards.com/2007/caffeine_ver2.html</a>.</p>
    <p>It's very familiar, so either I've seen it in font forums or in other designs, or both.  And while looking for it I've found a few similar looking fonts, but I can't seem to be able to nail the exact one.</p>
    <p>Anyone here that knows?</p>
    <p>m.</p>
