      <p>What’s your budget?<br>
      Who’s your audience?<br>
      What is the newspaper writing about?</p>
      <p>For basic text work you’ll need a family with minimum regular, italic, bold. I recommend a typeface with small caps and both old style figures and lining figures. I’d consider adding a medium and and a demi bold (slightly darker than the bold weight) as well, for setting white text on coloured background, and smaller text like footnotes, sidenotes captions and such. Another option is a text family with optical sizes.<br>
      Transitional typefaces are quite common in news design. They are less quiet than old style serifs (mainly used for books). Newsprint is rather dodgy, so you’ll need something that can handle ink spread and poor paper. </p>
      <p>Here’s a few contemporary suggestions:</p>
      <p>• <a href="http://www.vllg.com/KLIM/Newzald/mudTyper+Weights/">Newzald</a> by Kris Sowersby<br>
      • <a href="http://www.garagefonts.com/typespecimens.html?key=bannerfam&amp;thename=Freight&amp;link=T&amp;formsubmit=T">Freight</a> by Joshua Darden<br>
      • <a href="http://www.fontbureau.com/newspaper/fonts/Farnham">Farnham</a> by Christian Schwartz<br>
      • <a href="http://mitja-m.com/type/FF_Tisa.htm">FF Tisa</a> by Mitja Miklavčič<br>
      • <a href="http://www.vllg.com/Village/GalaxieCopernicus/mudTyper+Weights/">Galaxie Copernicus</a> by Chester Jenkins and Kris Sowersby</p>
      <p>For display you need something that can offer more punch. Perhaps a sans serif design — minimum light/regular/black(or bold) — or a serif design with a lot of contrast between horisontals and verticals. Depending on the content/format you might need narrow versions of the headline fonts. The display fonts will be your main tool for setting the tone of your newspaper. It can be whimsical, serious, trendy +++, depending on your audience.<br>
      I’d consider pairing a sans and a serif with similar skeleton to allow for variations.</p>
