    <p>Erik van Blokland (1967) studied Graphic and Typographic Design at the Royal Academy for Fine and Applied Arts in The Hague, Holland. Erik started to collaborate with <a href="/node/add/wiki?edit%5Btitle%5D=Just%20van%20Rossum" title="Create node &quot;Just van Rossum&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Just van Rossum</a> under the name <a href="/node/14101/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">LettError</a> in Berlin, while working at MetaDesign. After experimenting with computer programming in connection to type design, they came up with <a href="/node/add/wiki?edit%5Btitle%5D=Beowolf" title="Create node &quot;Beowolf&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Beowolf</a>, the first typeface with a mind of its own. It was released by <a href="/node/12019/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">FontShop</a> in July, 1990. The radical approach of Beowolf caused a lot of publicity for LeTterRor, and of course fame and fortune. Well, fame anyway. After stints at several places in the world, including David Berlow’s <a href="/node/13681/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Font Bureau</a>, van Blokland settled in The Hague as an independent designer, working together separately with van Rossum. Their work now includes type design, illustration, magazines, corporate design, interactive design, animation, music, and websites. And&nbsp;lectures.</p>
