    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Erik van Blokland</strong></p>
    <p>Erik van Blokland (1967) studied Graphic and Typographic Design at the Royal Academy for Fine and Applied Arts in The Hague, Holland. Erik started to collaborate with <a href="/wiki/Just%20van%20Rossum" class="freelinking" rel="nofollow">Just van Rossum</a> under the name <a href="/wiki/LettError" class="freelinking" rel="nofollow">LettError</a> in Berlin, while working at MetaDesign. After experimenting with computer programming in connection to type design, they came up with <a href="/wiki/Beowolf" class="freelinking" rel="nofollow">Beowolf</a>, the first typeface with a mind of its own. It was released by <a href="/wiki/FontShop" class="freelinking" rel="nofollow">FontShop</a> in July, 1990. The radical approach of Beowolf caused a lot of publicity for LeTterRor, and of course fame and fortune. Well, fame anyway. After stints at several places in the world, including David Berlow’s <a href="/wiki/Font%20Bureau" class="freelinking" rel="nofollow">Font Bureau</a>, van Blokland settled in The Hague as an independent designer, working together separately with van Rossum. Their work now includes type design, illustration, magazines, corporate design, interactive design, animation, music, and websites. And lectures.</p>
