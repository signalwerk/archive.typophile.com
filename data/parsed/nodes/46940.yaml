      <p>My sister is an interior designer and passed this onto me:</p>
      <p>Maharam: <a href="http://www.maharam.com" title="www.maharam.com">www.maharam.com</a> – go to “virtual library” and select the first book that says “Wallcovering – Vinyl” and flip through to the second page. It’s called “Alphabet 397710” and you can view the colors on the bottom right corner.</p>
      <p>Knoll: <a href="http://www.knoll.com" title="www.knoll.com">www.knoll.com</a> (textiles) <a href="http://www.knoll.com/products/textileproduct.jsp?prod_id=1034" title="http://www.knoll.com/products/textileproduct.jsp?prod_id=1034">http://www.knoll.com/products/textileproduct.jsp?prod_id=1034</a> it’s not readable, but it’s still text.</p>
