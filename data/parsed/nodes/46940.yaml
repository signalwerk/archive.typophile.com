    <p>No, not desktop wallpaper – "real" paper-on-walls-kinda-wallpaper.</p>
    <p>We'll be doing some re-decorating soon and I'd love to adorn one of the hallway walls (a slender and curving beauty, I might add) with some type-based wallpaper. Big letters, small letters, the odd number and diacritic, a few, handpicked punctuation marks, you get the picture. Alas, I haven't found any yet. Any ideas where I might find such a thing?</p>
