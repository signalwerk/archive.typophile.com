      <p>Thanks maxgraphic, that's a decent start. It really is difficult to find, especially because you basically can't google for it, because of desktop wallpaper usurping the name.</p>
      <p>If all else fails I suppose I can always either print my own or break out the scanner, project &amp; trace type onto standard wallpaper. Another idea might be something from Stefan Sagmeister's book: Mask off areas of sheets of wallpaper with type, then leave in the sun to fade, finally peel off the mask. Oh well, the search goes on, I appreciate the help.</p>
