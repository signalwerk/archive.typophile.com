    html: |-
      <p>Thanks very much; I've made adjustments benefiting from just about all of your comments, plus some others from my friends (the s was lacking overshoot, for instance). See the new pdf.</p>
      <p>The missing pairs were caused by putting multiple alphabets all into the same kerning classes. I've separated the classes out, but I still need to sort them into their language categories.</p>
      <p>Can you help me decide: The crossbar of the regular Latin capital A is really low, originally owing to the face's concept of big spacious counters wherever possible. I raised the crossbar some in its Greek and Cyrillic equivalents lest they be too easily confused with Δ and Д. Should I also change the Latin A to match, or is it okay that way?</p>
