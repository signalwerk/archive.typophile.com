    html: |-
      <p>Tilted vertical strokes in ЛД (as in daxline) is not traditional solution for cyrillic alphabet.<br>
      Interesting debate about this subjects was in lj<br>
      <a href="http://community.livejournal.com/ru_typography/535785.html" title="http://community.livejournal.com/ru_typography/535785.html">http://community.livejournal.com/ru_typography/535785.html</a><br>
      Leadinging designers have named such drawing of the letters «horrible».</p>
      <p>Traditional form of the letters is here<br>
      <a href="http://www.artlebedev.ru/everything/izdal/kniga_pro_bykvy/search/view/?page=C19D4BCE-0B08-42D0-A1CD-59FE40F7020C&amp;book=1&amp;words=232744&amp;text=%C4" title="http://www.artlebedev.ru/everything/izdal/kniga_pro_bykvy/search/view/?page=C19D4BCE-0B08-42D0-A1CD-59FE40F7020C&amp;book=1&amp;words=232744&amp;text=%C4">http://www.artlebedev.ru/everything/izdal/kniga_pro_bykvy/search/view/?p...</a></p>
      <p><a href="http://www.artlebedev.ru/everything/izdal/kniga_pro_bykvy/search/view/?page=443E720E-9711-4831-B823-B0946A8AA2BC&amp;book=1&amp;words=232913&amp;text=%CB" title="http://www.artlebedev.ru/everything/izdal/kniga_pro_bykvy/search/view/?page=443E720E-9711-4831-B823-B0946A8AA2BC&amp;book=1&amp;words=232913&amp;text=%CB">http://www.artlebedev.ru/everything/izdal/kniga_pro_bykvy/search/view/?p...</a></p>
      <p>Tail of б must be rise above lowercase letters.</p>
      <p>Latin variant of К looks more organic than cyrillic. It is better to use it for cyrillic. It is necessary to correct Ж.</p>
      <p>Breve in Й is too small.</p>
      <p>Rest letters looking not so terribly but unaccustomed for russian eye.</p>
