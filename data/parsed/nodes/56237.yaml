      <p>Nice work, seems like the Cyrillic/Greek really outshines the other letters for sure. The latin characters "e" and the R's could use a bit more work but the rest are pretty consistent.</p>
      <p>As far as the kerning issues, normally if I have kerning issues, the font is not spaced properly. Spacing is 99% of making a font look good also. Kerning really cements the fine details but if you are having to kern one letter a lot more than the others, its probably a spacing issue.</p>
