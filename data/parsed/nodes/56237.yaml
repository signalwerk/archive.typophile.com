    html: |-
      <p>Yes, I've heard of fonts having several thousand kerning pairs, I think...<br>
      This is pretty neat. I like the quirky way you have serifs blended with cut-off terminals (like on the G or between the S and T for instance). I love the caps especially. There's a kind of uncial feel going on in there too, which is surprising considering the sharp edges. The AKMWY are my favourites. I find the lowercase letters less successful and the curves look less polished. I find 2 unbalanced (always my hardest glyph by far!) and the regular e somehow distorted up close. I think £ could have a lower crossbar like the F? There's something wrong with the bottom curve of a in the bold and black, where it retroflexes back down to join the stem.<br>
      Your italic ampersand is fascinating. Bold and black somehow look better to me than the regular, not sure why. Can't say anything about the nonlatin glyphs I'm afraid.</p>
