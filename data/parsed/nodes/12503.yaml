      <p>Considering the audience, I would think a serif font would be more appropriate. They are easier to read, and it’s what the audience is used to. The Wall Street Journal’s text font is a variation of Scotch, so Scotch Roman may work…<br>
      <a href="http://www.myfonts.com/fonts/linotype/scotch/">http://www.myfonts.com/fonts/linotype/scotch/</a></p>
      <p>Modern extended is also nice (imho).<br>
      <a href="http://www.myfonts.com/fonts/urw/modern-extended/">http://www.myfonts.com/fonts/urw/modern-extended/</a></p>
      <p>There’s my 2¢,</p>
      <p>Cheers!</p>
