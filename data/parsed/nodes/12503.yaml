      <p>If you’re setting tables of financial data and blocks of text, a face with lining and oldstyle numerals is probably a good bet. That’s more common in serif faces, but is becoming more common in contemporary sans.</p>
      <p>Without knowing more, that’s as specific as I can get.</p>
