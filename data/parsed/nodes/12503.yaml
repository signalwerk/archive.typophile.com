      <p>I would think <a href="http://terminaldesign.com/retail_specimen.php?ID=1176&amp;viewFam=1" target="new">Giacomo</a>, a sweet sans by Terminal Design, might be ideal. It has tabular lining figures as well as proportional oldstyle figures, and looks great in a magazine.</p>
      <p>Edit: I just missed your second post. In that light, here are two more that might fit the bill: <a href="http://thirstype.com/fonts.php?font=ApexSans" target="new">Apex Sans</a> from Thirstype, and <a href="http://lux.thirstype.com/fonts.php?font=Section" target="new">Section</a> from Lux Typographics. To me, each conveys strength but with a modern flair.</p>
