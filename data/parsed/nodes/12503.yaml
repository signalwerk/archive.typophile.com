    <p>hi,</p>
    <p>i’m doing a couple of spreads in a magazine as an extra promotional section for selected financial services providers in the LA area…i’m looking for some opinions on what a good text face might be? </p>
    <p>i’m leaning more towards sans serif but serif is not out of the question…</p>
    <p>right now, there’s some ITC Franklin Gothic small giving address/phone number etc, but that is flexible depending on the textface chosen….opinions would be greatly appreciated</p>
    <p>thanks</p>
    <p>w|m</p>
