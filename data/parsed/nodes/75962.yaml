  html: |-
    <p>Hello! I need help with programming in beginning and ending swashes into a new script font I'm working on. I want to set this up in such a way that I can use both a beginning and an ending in the same word. I found an older thread on this, and followed it, but it wasn't working. I tried it with just one letter that has three variations, but it isn't working for me. This is what I have: </p>
    <p>feature calt {</p>
    <p>lookup caltstart {<br>
       ignore sub @letter_start @start';<br>
       sub @start' by @start_swash;<br>
    } caltstart;</p>
    <p>lookup caltend {<br>
       ignore sub @end' @letter_end;<br>
       sub @end' by @end_swash;<br>
    } caltend;</p>
    <p>} calt;</p>
    <p>- - - - - - - - - - - - - - - - - - - -</p>
    <p>@letter_start: t t.start<br>
    @start: t<br>
    @start_swash: t.start<br>
    @letter_end: t t.end<br>
    @end: t<br>
    @end_swash: t.end</p>
    <p>Thanks! :)</p>
    <p>~ Laura</p>
