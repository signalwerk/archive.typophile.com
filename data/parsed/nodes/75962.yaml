      <p>What’s with your classes, Laura?</p>
      <p><code>@class_name = [character character];</code> is the syntax. Please don't get angry, but in case of <em>this</em> question I must say it: Have a look into <strong><a href="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html#2.g.ii" rel="nofollow">the fu***** manual</a></strong>.</p>
