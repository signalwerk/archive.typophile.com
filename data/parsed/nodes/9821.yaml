    html: <p>Im usually a big proponent of white space but the top right corner seems awkward with the starburst/logo way up in the corner. <br> <br>Maybe try it bigger? <br> <br>Also maybe you want to put that splatter on the bottom right on top of the bridge?!? <br> <br>I really do like the bold shapes and white space(are these going to be silk screens or Photocopies?) but maybe you should but some more texture in it.. especially considering what the event is about.</p>
