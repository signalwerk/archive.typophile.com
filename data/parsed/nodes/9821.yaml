    <p>&lt;font class="dontLookLikeCrap"&gt;i need crit on this poster, so lemme tell you a few words about it. <br> <br>it is a promotional poster for a graffiti jam, commemorating the bombing of yugoslavia 24.03.1999 <br>the date is also the name of the event. <br>here's the logo of the event: <br><a href="http://i2.photobucket.com/albums/y38/TheJay/logo.gif" target="_blank">http://i2.photobucket.com/albums/y38/TheJay/logo.gif</a> <br>and here is the poster: <br><a href="http://i2.photobucket.com/albums/y38/TheJay/05_typo03.gif" target="_blank">http://i2.photobucket.com/albums/y38/TheJay/05_typo03.gif</a> <br> <br>on the poster the bridge connects the place of the jam, it takes place along the bombed and destroyed bridge here in novi sad. <br>i had problems with typo placement here. <br> <br>also there are a couple of other posters on this adress so if you wanna look deeper into it go right ahead. <br><a href="http://www.semperfi-1982.com" target="_blank">http://www.semperfi-1982.com</a> <br> <br>i have gotten some really contradictory crit from my profesor at school and from some other people so i think i'll need another oppinion. <br> <br>sorry if this sounds desperate, * sniffs for desperation scent in the air * , this is kind of important to me. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>ok, thanx in front.&lt;/font&gt;</p>
