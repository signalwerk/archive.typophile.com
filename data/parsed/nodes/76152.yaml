  html: |-
    <p>Doing a motion graphics piece using 18th &amp; 19th century engravings of mythical animals, etc...  Very fanciful and over the top.  Need a font for some Initial caps that resembles an embellished engravers, similar to fonts used on currency, but more fanciful.  Like this, only much nicer.  This, I think, is rather blunt and vulgar. </p>
    <p> </p><div class="imageWrap"><img src="http://typophile.com/files/prt_game2_thumb_5539.jpg"></div><p></p>
    <p> I can only explain what I'm looking for as "Baroque Victorian" which I know is no help at all. </p>
    <p>What are your favorite fonts (or EPS resources) for something like this?</p>
