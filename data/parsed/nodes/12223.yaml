    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>: <a href="/node/12212" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Tools</a>: <a href="/node/20717" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Font Editors</a>&nbsp;:&nbsp;FontForge</strong></p>
    <p>FontForge is a free software font editing tool. It was originally named pfaedit, but renamed as its capabilities grew far beyond the ability to edit PostScript Type 1 fonts (pfa files). Currently, it has support for TrueType, PostScript (Types 1, 3 and 0), OpenType, <span class="caps">CFF</span>, Type42 and <span class="caps">SVG</span> font formats. It also supports <span class="caps">BDF</span>, <span class="caps">NFNT</span>, <span class="caps">FON</span>, <span class="caps">FNT</span>, and <span class="caps">TTF</span>/<span class="caps">OTF</span> and <span class="caps">PS</span> Type3&nbsp;bitmaps.</p>
    <p>The interface is loosely based on <a href="/node/12024" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Fontographer</a> 4, down to the menu organization, keystrokes, the organization of editing windows, and the tools and operations available. If you are familiar with Fontographer, you will have no problem learning&nbsp;FontForge.</p>
    <p>The biggest detriment to the interface is that it uses its own homegrown widget set, which causes some display and interaction problems. The dependence on low level <span class="caps">X11</span> code also causes portability problems, especially on Windows. Mac <span class="caps">OS</span> X users can use the X server included with <span class="caps">OS</span> X, but the <span class="caps">UI</span> experience will be far from that of a native Mac <span class="caps">OS</span> X&nbsp;application.</p>
    <p>FontForge contains both its own scripting language, described in the documentation as “a mixture of C and shell commands”, and Python scripting. The “native” scripting language cannot edit glyph shapes, but is useful for conversions, re-encodings, etc. The python scripting support is quite new,  but has more powerful access to FontForge’s&nbsp;features.</p>
    <p>Newer versions of FontForge also include the ability to edit glyph outlines as <a href="/node/add/wiki?edit%5Btitle%5D=Spiro" title="Create node &quot;Spiro&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Spiro</a> curves (<a href="/node/add/wiki?edit%5Btitle%5D=Cornu%20spirals" title="Create node &quot;Cornu spirals&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Cornu spirals</a>), as well as <a href="/node/13680" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">bezier curves</a>.</p>
    <p>FontForge is an open-source project under active development. The author, George Williams, is very  accessible and responsive to comments and bug&nbsp;reports. </p>
    <p>Website: <a href="http://fontforge.sourceforge.net/">http://fontforge.sourceforge.net/</a></p>
    <p>Documentation: <a href="http://fontforge.sourceforge.net/overview.html">http://fontforge.sourceforge.net/overview.html</a></p>
