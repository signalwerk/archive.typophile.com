    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a>: <a href="/wiki/Tools" class="freelinking" rel="nofollow">Tools</a>: <a href="/wiki/Font%20Editors" class="freelinking" rel="nofollow">Font Editors</a> : FontForge</strong></p>
    <p>FontForge is a free software font editing tool. It was originally named pfaedit, but renamed as its capabilities grew far beyond the ability to edit PostScript Type 1 fonts (pfa files). Currently, it has support for TrueType, PostScript (Types 1, 3 and 0), OpenType, CFF, Type42 and SVG font formats. It also supports BDF, NFNT, FON, FNT, and TTF/OTF and PS Type3 bitmaps.</p>
    <p>The interface is loosely based on <a href="/wiki/Fontographer" class="freelinking" rel="nofollow">Fontographer</a> 4, down to the menu organization, keystrokes, the organization of editing windows, and the tools and operations available. If you are familiar with Fontographer, you will have no problem learning FontForge.</p>
    <p>The biggest detriment to the interface is that it uses its own homegrown widget set, which causes some display and interaction problems. The dependence on low level X11 code also causes portability problems, especially on Windows. Mac OS X users can use the X server included with OS X, but the UI experience will be far from that of a native Mac OS X application.</p>
    <p>FontForge contains both its own scripting language, described in the documentation as "a mixture of C and shell commands", and Python scripting. The "native" scripting language cannot edit glyph shapes, but is useful for conversions, re-encodings, etc. The python scripting support is quite new,  but has more powerful access to FontForge's features.</p>
    <p>Newer versions of FontForge also include the ability to edit glyph outlines as <a href="/wiki/Spiro" class="freelinking" rel="nofollow">Spiro</a> curves (<a href="/wiki/Cornu%20spirals" class="freelinking" rel="nofollow">Cornu spirals</a>), as well as <a href="/wiki/Bezier%20curves" class="freelinking" rel="nofollow">Bezier curves</a>.</p>
    <p>FontForge is an open-source project under active development. The author, George Williams, is very  accessible and responsive to comments and bug reports. </p>
    <p>Website: <a href="http://fontforge.sourceforge.net/" title="http://fontforge.sourceforge.net/">http://fontforge.sourceforge.net/</a></p>
    <p>Documentation: <a href="http://fontforge.sourceforge.net/overview.html" title="http://fontforge.sourceforge.net/overview.html">http://fontforge.sourceforge.net/overview.html</a></p>
