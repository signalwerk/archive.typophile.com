  html: "<p>The forums are an intriguing dynamic. There are many variables to consider: Threads, Posts, Responses, Date, Time, # of participants, rivalries, pseudonyms, most frequent participant, etc.  <br> <br>I've taken a quick stab at a visual representation of a thread, though this does not address date/time  (I thought about addressing this in Flash...) <br> <br>What are some other ways to represent these visually? <br> <br>...Yes, I realize this is a little out of date (1 day old) <br><img src=\"http://www.typophile.com/forums/messages/30/670.jpg\" alt=\"making_living\"></p>"
