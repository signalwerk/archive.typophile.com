    html: "<p> This is pretty cool! (But I don't think the second one really works; for one thing a given post isn't necessarily a reply to the one right before it.) <br> <br>Here's an idea: <br>Record each of us saying \"blah\" in his/her own voice, and play the whole thing as an audio sequence, real quick. The cacophony might make even me take a break from posting. <br> <br>Another: <br>Have a colored square, assign a color to each participant, and for a given post flash the participant's color in the box, and fade it out slowly. Do an RGB \"average\" when they overlap. Assign a color to each participant according to their general \"tone of voice\". I want orange. <br> <br>(BTW, if you look carefully you might see a very interesting relationship between Anonymous and one \"other\" participant. But it might be coincidental.) <br> <br>hhp </p>"
