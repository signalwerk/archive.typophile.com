    <p>dugud is a face originally developed for use in my design courses in which we created faux movie posters. I wanted something entirely copyright free so I just made my own font. Actually I now like to use it for my own personal work. I like highly condensed sans fonts.</p>
    <p>I posted this a long time ago but an re-posting as I'm nearer the end and am looking for your thoughts.</p>
    <p>Your thoughts?</p>
    <p>dglen</p>
