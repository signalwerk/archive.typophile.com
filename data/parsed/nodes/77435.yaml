      <p>I think the top counter of /A/ needs to be bigger, whether by lowering the crossbar or spreading the vertex or some combination of the two. You could also spread the top vertices of /M/ to help even out the counters there, too.<br>
      You might consider extending the ends of /C/S/c/s/ to reduce the admitted white space.</p>
