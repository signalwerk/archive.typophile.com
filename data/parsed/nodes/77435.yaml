    html: |-
      <p>Take a little more care in positioning your diacritics consistently. The diereses in particular are scattered all over the place. ë looks like the right height to use as a model for the others.</p>
      <p>The percent and the perthousand should be of the same design. But that percent... well, let's not talk about it. The perthousand is better but still a bit weird. Consider shorter o's that are not as scaled down.</p>
