    html: "<p>I agree that the ampersand needs work on integration. However, about the circles and such: they like the circles a lot and they like the fact that it does tie in so much to the original logo. The thing they now want is more depth in the actual logo itself. The only thing I can think of is an apple aqua effect... and I don’t want to do that.</p>"
