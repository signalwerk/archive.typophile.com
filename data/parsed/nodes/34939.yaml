    <p>Hello everyone, I thought I would start by just saying I have been lurking here ever since I started my internship at CJ&amp;P (this logo design) about a month ago. Just reading all of your discussions has really helped me a lot. And wouldn’t you know it, as soon as I wanted to join... Typophile went under for a couple of days!</p>
    <p>Anyways, like I said I am currently interning at CJ&amp;P, an ad firm. They wanted me to start working on a website for them but to really fit the website I had to mess around with their logo a bit (which they encouraged). Anyways, here is what I have come up with so far . Basically I am trying to take the same idea and modernize it just a bit. They like it, but for some reason I am not completely satisfied, some issues I can’t identify are nagging me. Any comments would be greatly appreciated.</p>
    <p>(new: top, old: bottom)</p>
