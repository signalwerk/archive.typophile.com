    votes: null
    html: "<p>It's better to only stick to English uppercase and lowercase letters, and European digits:  <br>A-Z a-z 0-9 <br>Also, spaces where appropriate.  <br> <br>Do NOT use any accented characters (Western or others) or any punctuation (ampersands, underscores, slashes, hyphens). You should only use one hyphen in the PS Font Name to separate the family name from the style name.  <br> <br>Adam</p>"
