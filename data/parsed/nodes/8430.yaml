  html: "<p>Quick question... <br> <br>Will an underscore in a font family name cause any problems? Example: 40_thieves-Regular <br> <br>I'm working on a font with a name like this and am having trouble generating TT and PS fonts but opentype generates fine.</p>"
  html_clean: "<p>Quick question... <br> <br>Will an underscore in a font family name cause any problems? Example: 40_thieves-Regular <br> <br>I'm working on a font with a name like this and am having trouble generating TT and PS fonts but opentype generates fine.</p>"
