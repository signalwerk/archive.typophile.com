      <p>When we build OpenType Korean fonts, which are CID-keyed, we calculate hinting parameters on a per hint dictionary basis. Specifically, all of the glyphs are used in the calculation, which is done by post-processing the output of the AFDKO "stemHist" tool.</p>
      <p>Hint dictionaries are assigned based on glyph class. The largest hint dictionary in our Korean fonts is for the glyphs for the 11,172 hangul. We apply the same stem width parameters to all of these glyphs through the use of rather simple techniques. One is to simply edit the hinting parameters in the appropriate hint dictionaries of the CIDFont resource, then run the AFDKO "autohint" tool to apply the hinting parameters to the glyphs.</p>
      <p>Of course, what you are describing is done within the context of FontLab Studio.</p>
