    <p>I developed some python script programs in FL.</p>
    <p>the module is for TTF hinting and is like below.</p>
    <p>1. auto-hinting in FL(differs from FL generating auto-Hinting)<br>
    2. copy &amp; paste of FL hinting instructions(by searching similar pattern)<br>
    3. export FL hinting to VTT(except 'double link' instructions;;)<br>
    4. import VTT hinting to FL(convertable instructions only;;)</p>
    <p>for Korean Hangul, module #1, #2 is very useful.<br>
    module #3, #4 is good for semi-autoHinted fonts for VTT.<br>
    especially #2 reduces working time by 50 ~ 70% of whole hinting work.(lots of Hangul designers agree with that.)<br>
    I think it is due to similarities of lots of consonants(elements) in hangul glyphs.<br>
    usually, hangul fonts have more than 2350(sometimes 11172) hangul glyphs.</p>
    <p>But, I don't know whether it is useful for English or other fonts..<br>
    is it useful for usual hinting for FL hinting?<br>
    if so, is it worth selling?</p>
    <p>how do you think??</p>
