    html: |-
      <p>If it has similar pattern, it can be done well I think.<br>
      I didn't think of pasting in different weight. :-)<br>
      But I think it will be okay, too.</p>
      <p>VTT &lt;-&gt; FL isn't suitable for those who wants the same result between FL and VTT.<br>
      In fact, it is only for VTT work, not for FL work.<br>
      I thought the process like below for VTT users.<br>
      1)auto-hint -&gt; ( 2)copy &amp; paste ) -&gt; 3)export to VTT -&gt; 4)detailed work in VTT -&gt; 5)import to FL -&gt; 6)copy &amp; paste the result of process #4 -&gt; 7)export to VTT -&gt; 8) detailed work which isn't supported by FL</p>
      <p>this is more detailed explanations about the program<br>
      <strong>1. auto-hinting in FL</strong><br>
      - do auto-hinting in FL<br>
      - almost similar algorithm with FL, I think<br>
      - little bit better than that of FL I think(but, it takes so long time : for hangul 6,400 glyphs, it takes almost 10 minutes)<br>
      - now update and debug is proceeding</p>
      <p><strong>2. copy &amp; paste of FL hinting instructions</strong><br>
      - copy and paste(include delete) some instructions<br>
      - search similar pattern with each node's pattern<br>
      - uses pywin32 extension for clipboard copy(for saving 'copy' glyph's index, nodes' index)<br>
      - some search option needs to be set(there can be default option, too)</p>
      <p><strong>3. export FL hinting to VTT</strong><br>
      - exports link, interpolate, delta, align to VTT(vtttalk)<br>
      - stem width, stem height, zone values are exported to cvt program<br>
      - due to prep, fpgm setting, the result can't be the same<br>
      - double link can't be exported (I think it can cause more 'delta' instructions, so I don't make, export it at all)<br>
      - easy work in VTT(auto hinting -&gt; export =&gt; semi-autohinting for VTT)<br>
      - with function #2, #4, it can be very useful for VTT</p>
      <p><strong>4. import VTT hinting to FL</strong><br>
      - VTT hinting can be much easier than before with function #2, #3 like below process<br>
       =&gt; export FL hinting -&gt; do minute manual hinting with importable instructions -&gt; import VTT hinting -&gt; copy &amp; paste -&gt; export<br>
      - only single link, interpolate, align, middle delta, final delta can be imported<br>
       =&gt; minimum distance, delta size(not x/8, but x/16, x/32, x/64), can be imported to g.note as a string<br>
      - due to prep, fpgm setting, the result can't be the same between FL and VTT<br>
      - cvt, zone values can't be imported(manual input, but if the values are the same, it needs no manual input)<br>
      - other instructions can't be imported(in fact, it can be imported as a string, but I think it's not so good way)</p>
