    <p>If your work deals with typography in any way, you are very likely familiar with the term ligature. But the definition of this term is often unclear. There seems to be one problem in particular: We usually use the term when we want to talk about a certain kind of ligature, to which cases like ﬁ and ﬂ belong. Their use suggests, that there are “real” letters of the alphabet like a, b, c and then there are ligatures like ﬁ and ﬂ. People then assume, that when something is a ligature, it cannot be a “real” letter of the alphabet. But this is not true …</p>
    <p>Read on: <a href="http://j.mp/UcJFWz" title="http://j.mp/UcJFWz">http://j.mp/UcJFWz</a></p>
