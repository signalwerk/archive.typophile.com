    html: "<p>Ine, I would encourage you to be very proactive in your search for an internship. Our industry is very small, and you should send letters to everyone. <br> <br>There are bigger font houses, smaller font houses (sometimes with just one or two people) and graphic design agencies who do typographic work and/or design type, too. I've met people who've interned at, or heard that internships exist, at least all of the following places: <br> <br>Linotype, Monotype, FontShop, Adobe, DaltonMaag, Xplicit, Meta, Porchez Typofonderie, Luc(as) Fonts, Font Bureau, H&amp;FJ, Gal</p>"
    html_clean: "<p>Ine, I would encourage you to be very proactive in your search for an internship. Our industry is very small, and you should send letters to everyone. <br> <br>There are bigger font houses, smaller font houses (sometimes with just one or two people) and graphic design agencies who do typographic work and/or design type, too. I've met people who've interned at, or heard that internships exist, at least all of the following places: <br> <br>Linotype, Monotype, FontShop, Adobe, DaltonMaag, Xplicit, Meta, Porchez Typofonderie, Luc(as) Fonts, Font Bureau, H&amp;FJ, Gal</p>"
