  html: <p>hello everybody, <br> <br>a few months ago I asked for your help with my graduationproject, a peacefont combining Arabic and Hebrew styles ( <a href="http://www.typophile.com/cgibin/discus.pl?pg=prev&amp;topic=4100&amp;page=50579" target="_blank">http://www.typophile.com/cgibin/discus.pl?pg=prev&amp;topic=4100&amp;page=50579</a> ). Thanx for all you help, it was a great succes, I graduated in June and my typeface (even though it's not completely finished) has been published in the german Spatium magazine. <br>Since my graduation I have taken some time off to travel, but I will be back at the end of januari. I would like to start looking for an internship in designing typefaces, typography. I was thinking of an internship of 6 months to a year, anywhere in the world. I feel like I still have a lot to learn about typography (there was only a little part of typography in my course in college), but I'm a fast learner. I have a little portfoliowebsite, nothing too special, but it will give you an idea of my work during college, <a href="http://users.pandora.be/inebeerten" target="_blank">http://users.pandora.be/inebeerten</a> . It  hasn't been updated since I've been travelling so the news-part is probably a little outdated. <br>Maybe interesting to know, my first languages are Dutch and English, then French and I also speak a little Spanish. <br> <br>So if anybody has some good ideas on how I could get such an internship or if anybody is looking for somebody to do an internship, please let me know... <br> <br>thanx, <br> <br>Ine</p>
  html_clean: <p>hello everybody, <br> <br>a few months ago I asked for your help with my graduationproject, a peacefont combining Arabic and Hebrew styles ( <a href="http://www.typophile.com/cgibin/discus.pl?pg=prev&amp;topic=4100&amp;page=50579" target="_blank" class="link-lost">http://www.typophile.com/cgibin/discus.pl?pg=prev&amp;topic=4100&amp;page=50579</a> ). Thanx for all you help, it was a great succes, I graduated in June and my typeface (even though it's not completely finished) has been published in the german Spatium magazine. <br>Since my graduation I have taken some time off to travel, but I will be back at the end of januari. I would like to start looking for an internship in designing typefaces, typography. I was thinking of an internship of 6 months to a year, anywhere in the world. I feel like I still have a lot to learn about typography (there was only a little part of typography in my course in college), but I'm a fast learner. I have a little portfoliowebsite, nothing too special, but it will give you an idea of my work during college, <a href="http://users.pandora.be/inebeerten" target="_blank" class="link-external">http://users.pandora.be/inebeerten</a> . It  hasn't been updated since I've been travelling so the news-part is probably a little outdated. <br>Maybe interesting to know, my first languages are Dutch and English, then French and I also speak a little Spanish. <br> <br>So if anybody has some good ideas on how I could get such an internship or if anybody is looking for somebody to do an internship, please let me know... <br> <br>thanx, <br> <br>Ine</p>
