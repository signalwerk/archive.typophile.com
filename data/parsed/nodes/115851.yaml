      <p>I suspect this won't be much help, because I don't know of a digital version, but this seems to match a film type from Photolettering Inc., called "Grandmother". It came in several versions, some with shadows, or outlines, or plain. It was in a catalog from 1965.</p>
      <p>- Mike Yanega</p>
