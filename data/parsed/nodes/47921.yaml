      <p>I read this site everyday for months, but this thread made my to register.</p>
      <p>typerror, there are plenty of warez forums, there are closed community, there are more opened ones, mostly they host on rapidshare and likes(eg. they host the files of fonts), but if russian, they host on russian servers as they don't have copyright law for internet and nobody cares too. And then there are irc channels, from where you can get freshest released fonts by groups, they are pure ones, no extracts from pdf's(as they buy those fonts, to give it for free to others.) And if you are deep into warez thing there are ftp's with basically everything on them - it is warez scheme for everithing, not only fonts.<br>
      So, I don't think that anyone should care about extracts(from pdfs) as mostly fonts dont have all glyphs and all weights, and sadly there are nothing you can do about the real fonts out there(you can ask thou, to the uploader via mail or pm not to upload, they all are grown up ppl, and I think that most of them will listen to you).<br>
      And its not true that those fonts are corrupted, mostly they are pure files, as the community tend to clean the "scene" from bad fonts.<br>
      So, why I know this all - because I live in Latvia :D Im glad, that I work at company that license fonts used in projects, but 80% of companies does not. But it is how it is, because life here sux.<br>
      And, at the end, I want to say, that piracy doesnt means that you loose money(it is speculatively and wrong to say that) as many ppl try fonts, and if they loves them, they buy license. As I wont buy 4 fonts, to just show them to client in real life, but I buy the one client chooses. Maybe its wrong, but I love typography and its not possible to license every font on my computer.<br>
      And I feel sorry that you need to see you work pirated, I Know how you feel!</p>
