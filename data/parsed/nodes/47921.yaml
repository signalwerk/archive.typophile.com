      <p>While we are playing nice and protective here, the dregs of font pirating society are out there trading favors and websites like hos.</p>
      <p>Let's put it this way.</p>
      <p>Our actions: One drop of rain just fell on the ocean. </p>
      <p>My thought is that as a Type community we need to be vigilant, not just seeing who can id the latest font request. We should be searching out free sites, questionable sites etc.... acting as a protective community.</p>
      <p>How about we form some search and destroy teams. TAAD - Typophiles Against Alphabet Defrauders, kinda like MADD.</p>
      <p>When we catch them we can have Sister Tiffany (formally Miss Tiffany) beat their knuckles with a Pica ruler and report them to the Great and Omnipotent Ampersand for judgement. The Great Ampersand, known as E.T., will then handcuff their BCP's,  correct their path direction and resign them to the first version of Font Studio. </p>
      <p>When someone steals my fonts all I have left is my sense of humor, sick as it is!<br>
      Michael</p>
