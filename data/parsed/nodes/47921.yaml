    html: |-
      <p>shoplifting, alas, is a flawed argument. There is a tangible loss of a sale for each unit taken.</p>
      <p>that doesn't exist with digital copies. For each font downloaded from that Russian site, is that one sale that would have happened? Odds are, probably not. Granted, there's really no way to tell.</p>
      <p>"Why would you deny a type designer the right to being vigilant?"</p>
      <p>I'm not. I'm saying that it's a rather futile endeavor to go after 'font collectors' who are swapping 1000s of fonts out there on the web. So, it can be a lot of effort for no real result.</p>
      <p>Go after commercial theft...design firms using illicit fonts for ad campaigns. Those are more likely real losses of sales. </p>
      <p>Ultimately, if one is selling digital media, they need to realize that the technology allows for unlimited copying. That's just the way it is. So the business model needs to cater to that. What some are saying (including myself) is that it's probably best to cater to the professional, paying market. Put attention towards those customers...not the 'possible' customer of anonymous kids in Russia who swap fonts to make gig flyers.</p>
