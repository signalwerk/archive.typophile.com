  html: |-
    <p>I need suggestions for a font for a long (900 page) philosophical novel with a good deal of dialogue, and italicized “inter-sections” (15) between sections/chapters.</p>
    <p>Having read a good many entries on ths forum and others, so far it seems the following come out as favorites:</p>
    <p>Warnock<br>
    Bembo Book<br>
    Berling<br>
    Life Bt<br>
    Quadraat</p>
    <p>Votes for any of these? Others?</p>
    <p>Your suggestions greatly appreciated!</p>
