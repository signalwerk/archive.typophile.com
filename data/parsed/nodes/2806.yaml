  html: <p>hi, <br> <br>addfoto.com will be a photographers gallery + stock photo + photography theory &amp; tutorials project. The concept off ADD something made me use the universal (+) symbol that will be the visual brand of the site &amp; logo. For now, the colors are not final, and I'm quite happy with the results. The card is of course not final, just to show the (+) cut I want to use on this ID. <br> <br>I want a strong ID, very simple and easy recognizable (memorable). <br> <br> <br><img src="http://www.typophile.com/forums/messages/29/24703.gif" alt=""> <br> <br>Thanks for all the feedback. <br>adriano</p>
