      <p>It is relatively easy to add the characters. Including them in the features &amp; class files takes a little more time -- you should probably also have them in small capitals as well, and include all in the kerning work; this font does use class-based kerning.</p>
      <p>I have done the underdots in Adobe Garamond Pro (not Premier) for roman &amp; italic; as I remember, it took me a couple of hours each font. Getting everything up to snuff for six fonts would likely take a day or so. BTW, I'm not offering to do the work -- we are a typesetting firm &amp; don't do font work for anyone else -- just offering some personal experience.</p>
      <p>It isn't hard, just involved.</p>
