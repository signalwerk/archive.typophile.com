  html: |-
    <p>I work for a small publishing company, and we would like to hire someone to add 20 characters to Adobe Garamond Premier Pro (6 faces). All of them involve simply adding an underdot or an overdot to an existing letter.</p>
    <p>The letters are d, D, h, H, l, L, m, M, n, N, r, R, s, S, t, T for dotunder, and m, M, n, N for dotover.</p>
    <p>The face is used in several of our series, and we don't have a Unicode compliant version of it that can produce these characters, which we use often.</p>
    <p>Many thanks,<br>
    David</p>
