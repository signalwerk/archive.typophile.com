    html: <p>Design-wise that's not a hard job as you say, but creating versions where it's actually still easy to enter those characters with a keyboard (without stripping out other characters you might need later) is a little more difficult. Simple if you want to create a separate version (ie called 'GaramondOverdot') that you use alongside the original, but less so if you want to include all these characters in the existing cut of the font. Can you expand a bit on the needs/reason for the typeface edits so it's clearer what would be a good way ahead?</p>
