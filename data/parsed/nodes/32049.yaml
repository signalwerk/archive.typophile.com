      <p>I thought the whole point of Unicode fonts was that there was a slot for every known character--a unique coding for each one, which expressly does not strip out other characters in the process. </p>
      <p>We already have a postscript version of this font that does as you say--supplants some of the existing 256 ascii characters with the diacritical characters that we need. We need an Adobe Garamond with these same characters, but in an Opentype Unicode format.</p>
      <p>Thanks<br>
      David</p>
