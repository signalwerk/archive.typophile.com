      <p>The main question unanswered in the thread is do you know how to access the Unicode Glyph in your OS? I can explain how to do it in OSX on the Mac. I am not sure how to do it on Windows boxes - but I could figure it out. Probably by searching here on Typophile.</p>
      <p>Or maybe the texts come to you in Unicode &amp; you just have to be able to set them.</p>
