    html: |-
      <p>We need them for transliterating Sanskrit into Roman characters. Our focus is Buddhism, so we do this a lot. The Premier Pro has many of the ones we need already, but not the underdots, at least not for the characters we want. Its "floating accents" include an underdot, but it only seems to work with certain characters.</p>
      <p>The glyphs are definitely part of the Unicode mapping--I can produce them easily with other Unicode fonts.</p>
      <p>David</p>
