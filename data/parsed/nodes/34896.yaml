    <p>Hi guys,</p>
    <p>The Politics magazine The Economist does is a special serif font designed for them named Eco.</p>
    <p><a href="http://www.myfonts.com/fonts/agfa/eco-101/" title="http://www.myfonts.com/fonts/agfa/eco-101/">http://www.myfonts.com/fonts/agfa/eco-101/</a></p>
    <p>However I could not help to notice that is looks very much alike some classic serif modern font but I cannot remember the name. Any help on this?</p>
    <p>By the way, did anybody saw The Econommist Magazine, three column page design with this font and the very tight leading? I do like the design but the leading so tight make it hard to read for me. What do you think? Most Economy and Political magazine, like Time and Newsweek use the same format.</p>
    <p>Thanks for any help and best,<br>
    Sebastiao</p>
