      <p><cite>Beginners should use a “simple” codeeditor instead of Dreamweaver and such.</cite></p>
      <p>Yup. Everywhere I look I see Dreamweaver classes, when the schools should be teaching XHTML/CSS and BBEdit. </p>
      <p><cite>I was having the hardest time trying to figure out all of the tables and all the extra code, and HOW DO I GET IT TO DO WHAT I WANT IT TO DO. Is that too much to ask for a supposedly WYSIWYG program?</cite></p>
      <p>XHTML doesn’t make that easy to do, at least not without limiting the user to a lot of carefully locked-down templates. This is why I expect Flash to eventually surpass XHTML/CSS: Macromedia was already doing a lot of great stuff with stylesheets, dynamic content, and database connectivity. Once Adobe’s engineers have overhauled Flash and Flex to be more user-friendly I expect that Flash will be the solution to everyone’s XHTML and browser compatibility woes.</p>
