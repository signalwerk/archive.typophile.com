    <p>Everyone remember my design teacher that said you should almost never use drop caps because they’re a waste of time?</p>
    <p>Well, <strong>he’s at it again.</strong></p>
    <p>Today he said that we should <strong>never</strong> use justified text because it causes too many rivers. Period. Oh, and nobody did justifed type until this century.  </p>
    <p>When I countered that Gutenberg used justifed text, he kinda brushed me off saying, “yeah, but he had lots of kerning.”</p>
    <p>AAAAAAAAAARRRRRRRRRRRGGGGGGGGGGGGHHHHHHHHHHHHHH!!!!!!!!!!!</p>
    <p>I think I’m better off never taking a class from him again. Yeck.</p>
    <p>Oh, and <strong>never use serif type for the web</strong></p>
    <p>AAAAAAAAAARRRRRRRRRRRGGGGGGGGGGGGHHHHHHHHHHHHHH!!!!!!!!!!!</p>
