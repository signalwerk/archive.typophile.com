      <p>Did you ask him if he DIDN’T have lots of kerning? He’s obviously a lousy typographer and he’s to ignorant to learn the software. I can’t believe that. That is rediculous.</p>
      <p>He’s never heard of H &amp; J’s? He’s never seen a gorgeous book from Hartley and Marks? Or Hyphen? Or David R. Godine? Does he use Bringhursts Elements? Has he ever seen a book? Has he ever seen a piece of classical literature?</p>
      <p>I feel brilliant compared to this guy. Well, your homework should be easy right. Just wipe with a couple pieces of paper, bind them together and put them on his desk, he’ll probably praise you as a genius.</p>
      <p>This just makes me angry. I’ve had a few teachers that talk like they know about things they actually dont, but this guy takes the cake.</p>
      <p>If you’d be so kind to your classmates and recommend to them, James Felici’s <a href="/wiki/Complete%252BManual%252Bof%252BTypography" class="wiki">Complete Manual of Typography</a> and regard anything he says with a grain of salt.</p>
      <p>*When you’re done with him for good, file a formal complaint with the school, and include TP threads to back you up. * You could learn more from that book in a week.</p>
