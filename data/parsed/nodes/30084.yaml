      <p><cite>You could learn more from that book in a week.</cite></p>
      <p>Ha! That’s so funny, because that is EXACTLY what I did for one of his classes! He teaches the web design class at my school, but I had a feeling he was teaching web design circa 1998. I asked him if you could design an entire web page NOT using tables, and he responded, “Why would you want to do that?”</p>
      <p>So I went and found the greatest book on web design I’ve ever seen, the Head First Guide to XHTML, sat down at Barnes and Nobles for about 8 hours reading almost the whole book, then proceded to prove him wrong by creating a thoroughly modern webpage sans tables.</p>
      <p>8 hours at Barnes and Nobles Vs. A Quarter of Web Design? Should have saved my money.</p>
      <p>The sad part is that this guy is the advisor for graduating students in the design program.</p>
