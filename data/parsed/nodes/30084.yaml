      <p>Our class was a Dreamweaver class. And I’m sorry, WYSIWYG doesn’t mean jack when you’re used to InDesign or even Pagemaker.</p>
      <p>I was having the hardest time trying to figure out all of the tables and all the extra code, and HOW DO I GET IT TO DO WHAT I WANT IT TO DO. Is that too much to ask for a supposedly WYSIWYG program?</p>
      <p>That’s why I went and got the book, which not only tells you what to do, it tells you WHY you need to do it. Purely semantic mark-up using XHTML Strict and CSS. Oh, and it teaches you to use TextEdit for all of your coding.</p>
      <p>It makes more sense for me as a designer, honestly. I can rough out the entire page by hand in picas like any other design, then the coding is purely spec’ing everything out in ems. It’s like what I suppose designers had to do way back in the day when they didn’t do their own typesetting.</p>
      <p>It allows me to focus on what I want to do, rather than what I can do. And, it means that my design will be better because I don’t start off on the computer.</p>
