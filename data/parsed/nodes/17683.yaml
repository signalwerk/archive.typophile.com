      <p>Not only is this utterly subjective but it also depends on if you want/need a warm or cold black &amp; what paper you are going to print to. </p>
      <p>Paper has color that affects the result &amp; differing absorbancy too. </p>
      <p>And there are varnishes. </p>
      <p>Differenet pressmen will give different results ( really! ) and different presses will too. </p>
      <p>That said there may be formulas out there that certain people like...</p>
      <p>It might be more useful to find a black *you* like &amp; try to trace how it was made. If you do that 4 or 5 times you might begin to see some common traits - plus you will be relying on your own eyes rather than someone else's.  </p>
      <p>Also, keep in mind that there are different Pantone blacks out there than can be used apart from Standard 'K' plus the hexachrome model exists too. </p>
      <p>It is a very complicated thing you are asking about!</p>
