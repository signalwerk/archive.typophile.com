      <p>Yes, the subject has been covered before: have you searched this site for "rich black"?</p>
      <p>As to AN answer to your question (if you locate the other thread, you'll see that there wasn't much agreement) is that 40% Cyan + 100% Black works very nicely AND doesn't put too much ink on the paper. Other people have their own opinions; if any of them actually WORK IN A PRINT SHOP (which I do) and TALK TO PRESSMEN ON A DAILY BASIS (which I also do), then listen to what they have to say as well, and make up your own mind.</p>
