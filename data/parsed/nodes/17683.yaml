      <p>We wanted to find out the best rich black to use too. As part of this we produced a handbook which shows six examples next to each other. We show examples which have a CMYK value of:</p>
      <ul>
      <li>0/0/0/100</li>
      <li>20/0/0/100</li>
      <li>100/100/100/100</li>
      <li>40/0/0/100</li>
      <li>50/20/20/100</li>
      <li>60/40/40/100</li>
      </ul>
      <p>So you can see for yourself.</p>
      <p>You can buy the handbook at <a class="freelinking external" href="http://www.printhandbook.com" rel="nofollow">http://www.printhandbook.com</a> if you want. We hope you find it useful.</p>
