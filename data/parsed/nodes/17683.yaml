    <p>Hi All,</p>
    <p>Apologies if this topic has been raised before (I've got a sneaking suspicion it might have been!), I googled and searched Typophile but couldn't find it mentioned. Anyway...</p>
    <p>Question: Can anyone recommend a really nice rich black out of CMYK? I know there are no hard and fast rules about this, so I thought that maybe someone out there has hit on a formula they could recommend.</p>
    <p>Thanks very much!</p>
    <p>Si</p>
