    html: <p>If it's a billboard job then it's being printing on an inkjet, not an offset.  And because it's an inkjet, it's going through its own cmyk conversion during the output, and only laying down as much ink as dictated by the machine and paper necessary to get a black-black.  I'm sure they told you 100:100:100:100 to ensure the printer would put down the blackest black it could.</p>
