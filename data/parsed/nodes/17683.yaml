    html: |-
      <p>The one constant in almost all rich black formulas is 100% K with some sort of mixture behind it. If you look at the CMYK sliders in Photoshop you can see the undercoating to the left of the black slider. I recently did an ad with a black background and a really large blue logo. I normally like cold black but in this case it was eating up the logo so I mixed up a warm black. It helped a lot. The best advice here is talk to your printer. They will know what works for them…<br>
      peace</p>
