    html: |-
      <p>Somewhere along the line, I heard to stay below 250 total coverage... Thus the C70M50Y30K100 formulation. If 240 makes a difference, I'd recommend C70M45Y25K100.</p>
      <p>The Y doesn't really add darkness, it just helps to neutralize the hue.</p>
      <p>The suggestion of adding a thin stroke of K around (and behind) the reversed text to allow for misregistration is very sound advice. My company publishes DVDs - the faces of which are silkscreened - and this technique has allowed us to print very small text sizes even with this notoriously temperamental printing method.</p>
      <p>I can recommend Dan Margulis' old-but-still-relevant book, <a href="http://www.amazon.com/gp/product/1558285083/sr=1-12/qid=1139065952" rel="nofollow"><em>Makeready: A Prepress Workbook</em></a>. It's saved my keester a number of times.</p>
      <p>--Michael.</p>
