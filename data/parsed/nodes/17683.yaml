    date_raw: 3 Feb 2006 — 11:19pm
    votes: null
    html: <p>Off topic a little, but something always interesting, is adding a fluorescent booster to your CMYK, making it five instead of four color process. Typically this will take the form of a bright orange or violet, at about a 40% screen. Jobs that need to have very bright, vibrant blues, yellows, and greens can often gain a significant amount of color saturation by this addition. In contrast, brighter colors are not always easy to obtain with CMYK, but if your client absolutely has to have that green, or that red, and it is outside the normal CMYK gamut, suggest the addition of the fifth color (fluorescent booster).</p>
    html_clean: <p>Off topic a little, but something always interesting, is adding a fluorescent booster to your CMYK, making it five instead of four color process. Typically this will take the form of a bright orange or violet, at about a 40% screen. Jobs that need to have very bright, vibrant blues, yellows, and greens can often gain a significant amount of color saturation by this addition. In contrast, brighter colors are not always easy to obtain with CMYK, but if your client absolutely has to have that green, or that red, and it is outside the normal CMYK gamut, suggest the addition of the fifth color (fluorescent booster).</p>
