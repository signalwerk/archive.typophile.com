    html: <p>Don't forget film type, Mike. Metal isn't the only other printing method for type. I think most of the stuff in the Solotype Catalog is film type, because of the manipulations that were shown in the back of the book. Many of those tricks are done using film. Between the late '50's(?) and early '90's I think film type was used for a great deal of display and general typesetting, until digital type began to become widespread.</p>
