    html: "<p>Mike, <br> <br>look for: <br> <br>*  Herman Freud  - Intertype Fotosetter, a first-generation phototypesetting system ( 1946). <br> <br>* Louis Moyroud , Rene Higonnet - second-generation phototypesetting system (1949) <br> <br> <br>The basic idea/principle: <br> <br>1. spinning disc + negative images of the typeface (to wit - letter is white. disc - black) <br> <br>2. lens turret - for the type size. <br> <br>3. prism - establishes type position (the letters can be condensed, extended etc. etc etc.) <br> <br>4. paper or film <br> <br> <br> <br> <br> <br> <br>David Hamuel <br> <br> <br></p>"
    html_clean: "<p>Mike, <br> <br>look for: <br> <br>*  Herman Freud  - Intertype Fotosetter, a first-generation phototypesetting system ( 1946). <br> <br>* Louis Moyroud , Rene Higonnet - second-generation phototypesetting system (1949) <br> <br> <br>The basic idea/principle: <br> <br>1. spinning disc + negative images of the typeface (to wit - letter is white. disc - black) <br> <br>2. lens turret - for the type size. <br> <br>3. prism - establishes type position (the letters can be condensed, extended etc. etc etc.) <br> <br>4. paper or film <br> <br> <br> <br> <br> <br> <br>David Hamuel <br> <br> <br></p>"
