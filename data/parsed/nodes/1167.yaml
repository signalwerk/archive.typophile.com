    html: |-
      <p>URW's version of <a href="http://www.myfonts.com/fonts/urw/art-gothic/urw-t-normal/charmap.html" target="_top">Art Gothic</a> contains several alternate characters that better match your sample Jared. <br> <br>Precision Type has a version. Versions/clones from defunct foundries are out there as well. <br> <br>Art Gothic appears in the Victorian section of the Solotype Catalog. <br> <br>Stephen, I'm sure that you are correct, but I'm left wondering about a few things then: <br> <br><br>
      </p><blockquote>1. Did metal type not contain alternate characters in a set? I know nothing about this, but noted that just the small sampling of Art Gothic in the Solotype Catalog contains two very different 'e's.</blockquote>
       <br><br>
      <blockquote>2. Could printing methods account for some of those variations, especially varying stroke weights?</blockquote>
       <br><br>
      <blockquote>3. When we see old type samplings (like Jared's apparently) that seem to mimic very old tyepfaces .... I don't know ... I guess this isn't a question. I'm just trying to picture what actually was being done. A lettering artist sitting and copying a printed sample next to him/her? With those handwritten variations we note � some clearly intentional. I suppose this makes sense if it was the case</blockquote>
       <br>I have a special interest in this area, because I love to go through the old greeting card and postcard bins in antique stores (in which I'd otherwise be bored to death while my wife does extended browsing). Every once in awhile I find lettering that I think is quite unique and potentially modern-day useful. <br><br> <br><br><p></p>
