    html: <p>Mike said:"I did learn some, though. I gather that individual letters of a typeface still had to be physically placed in a machine � unless I misunderstood)." <br> <br>It sounds to me that perhaps you do misunderstand the photolettering technique. I knew someone who had a filmsetting machine and the only type he used was on a photographically -produced optical disc. There was no actual, physical type, just a round glass plate with letters on it (I think the plate was black and the letters were clear, but I am not sure if I recall this properly). Your typing rotated the disc to select the character image and then 'printed' it photographically on another strip of film, I think. This could further be tweaked and kerned to produce a final piece of film or photographic plate that was used to print the copy, or more usually headlines.  I admit some of this explanation involves a bit of shaky memory, and an attempt to guess at the whole process, since I only saw a brief demonstration of this expensive piece of equipment when my friend first began his own printshop. This was well over 10 years ago, so may have been an investment that he regretted a few years later when digital equipment became much more common. I think photolettering is still used in limited applications, especially for personal stationery and wedding invitations, etc. <br> <br>I looked at the conversation you linked, which was principally about the use of letterpress, and saw only one or two references to the use of film, but the point about the clarity of the character images (and presumably the typography)  being more important than the printing methodology is certainly unassailable.</p>
