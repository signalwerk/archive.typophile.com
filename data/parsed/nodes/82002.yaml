    <p>This is my business card. It has all I think a good business card should have: basic contact info and some creativity, all of that in a white, one sided card with black text. The creativity is up to the reference for my name's correct pronunciation, inspired by language dictionaries, since I don't know many people who can correctly say this funky german names...</p>
    <p>I didn't think my visual ID needed a symbol, as I already have a impossible to pronounce remarkable name and surname. I also didn't fill my card with fancy graphics, as I preferred to show my creativity in a more discrete way. Anyone interested in more of my work can visit my online portfolio (<a class="freelinking external" href="http://www.behance.net/gerhardschlee" rel="nofollow">behance.net/gerhardschlee</a>, from where I took most of this text). By the way, the typeface I used is the beautiful <a class="freelinking external" href="http://www.akalollip.com/blog/?p=1673" rel="nofollow">Fengardo</a>.</p>
    <p>One thing I've sought in this work was to avoid cliches and seek differentiation through simplicity. One of my references was the <a class="freelinking external" href="http://swisslegacy.com/2011/01/27/paul-rands-business-card/" rel="nofollow">business card</a> of the legendary Paul Rand, which probably all of you already know. Just like uncle Paul, I tried to break the monotony of my design by aligning the informations asymmetrically, but still in a harmonic way.</p>
    <p>I believe I managed with this work to make something creative and attractive without too much visual pollution. Many people try a minimalist style and end up being simpleton, instead of being simple. I think a good minimalist design is, on contrary of what it may look for some (clients, mainly), hard to achieve.</p>
    <p>What do you think, people?</p>
    <p><a href="http://tinypic.com?ref=2n0n76w" target="_blank" rel="nofollow"><img src="http://i53.tinypic.com/2n0n76w.jpg" border="0" alt="Image and video hosting by TinyPic"></a></p>
