    html: <p>Yes. A heavy Mantinia lean. Serifs seem less delicate. Maybe the client specifically chose that typeface. Traditionally, I wonder, do lettering artists allow their customers/clients to choose a typeface to work with, or would they present them with some specimen of their own original designs?</p>
