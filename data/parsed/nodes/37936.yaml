    <p>1.  (FCC1.jpg) — letterhead from FCC stationery 1981<br>
    2.  (DIA1.jpg) — letterhead from DoD stationery 1977 (close to #1)<br>
    3.  (DIA2.jpg) — DoD envelope return address 1977<br>
    4.  (DIA3.jpg) — DoD envelope PSA-text 1977 (appears same as #3)</p>
    <p>Thanks in advance!</p>
