    <p>Founded in May 2002, Typographica was one of the first “blogs” to focus primarily on typography. The site was very active for many years until a dry spell in 2005-06 when software issues and time constraints limited new content. In July 2007, Typographica marked a reawakening with its annual <a href="http://typographica.org/001103.php" class="link-external">review of the year’s new fonts</a>. </p>
    <p>Typographica is edited by <a href="/node/12036/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Stephen Coles</a> and <a href="/node/12116/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Joshua Lurie-Terrell</a>. Contributors include <a href="/node/15527/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Mark Simonson</a>, <a href="/node/12040/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Yves Peters</a>, <a href="/node/12417/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">John Butler</a>, <a href="/node/12174/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Dan Reynolds</a>, <a href="/node/12151/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">John Hudson</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Joe%20Clark" title="Create node &quot;Joe Clark&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Joe Clark</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Ben%20Kiel" title="Create node &quot;Ben Kiel&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Ben Kiel</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Stephen%20Moye" title="Create node &quot;Stephen Moye&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Stephen Moye</a>, and <a href="/node/12088/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Grant&nbsp;Hutchinson</a></p>
