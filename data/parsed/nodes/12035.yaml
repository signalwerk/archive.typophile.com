    <p><strong> <a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12012" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Blogs</a>&nbsp;:&nbsp;Typographica</strong></p>
    <p>Founded in May 2002, Typographica was one of the first “blogs” to focus primarily on typography. The site was very active for many years until a dry spell in 2005-06 when software issues and time constraints limited new content. In July 2007, Typographica marked a reawakening with its annual <a href="http://typographica.org/001103.php">review of the year’s new fonts</a>. </p>
    <p>Typographica is edited by <a href="/node/12036" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Stephen Coles</a> and <a href="/node/12116" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Joshua Lurie-Terrell</a>. Contributors include <a href="/node/15527" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Mark Simonson</a>, <a href="/node/12040" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Yves Peters</a>, <a href="/node/12417" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">John Butler</a>, <a href="/node/12174" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Dan Reynolds</a>, <a href="/node/12151" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">John Hudson</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Joe%20Clark" title="Create node &quot;Joe Clark&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Joe Clark</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Ben%20Kiel" title="Create node &quot;Ben Kiel&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Ben Kiel</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Stephen%20Moye" title="Create node &quot;Stephen Moye&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Stephen Moye</a>, and <a href="/node/12088" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Grant&nbsp;Hutchinson</a></p>
    <p><a href="http://typographica.org">typographica.org</a></p>
