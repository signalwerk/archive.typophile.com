    <p><strong> <a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Blogs" class="freelinking" rel="nofollow">Blogs</a> : Typographica</strong></p>
    <p>Founded in May 2002, Typographica was one of the first "blogs" to focus primarily on typography. The site was very active for many years until a dry spell in 2005-06 when software issues and time constraints limited new content. In July 2007, Typographica marked a reawakening with its annual <a href="http://typographica.org/001103.php" rel="nofollow">review of the year's new fonts</a>. </p>
    <p>Typographica is edited by <a href="/wiki/Stephen%20Coles" class="freelinking" rel="nofollow">Stephen Coles</a> and <a href="/wiki/Joshua%20Lurie-Terrell" class="freelinking" rel="nofollow">Joshua Lurie-Terrell</a>. Contributors include <a href="/wiki/Mark%20Simonson" class="freelinking" rel="nofollow">Mark Simonson</a>, <a href="/wiki/Yves%20Peters" class="freelinking" rel="nofollow">Yves Peters</a>, <a href="/wiki/John%20Butler" class="freelinking" rel="nofollow">John Butler</a>, <a href="/wiki/Dan%20Reynolds" class="freelinking" rel="nofollow">Dan Reynolds</a>, <a href="/wiki/John%20Hudson" class="freelinking" rel="nofollow">John Hudson</a>, <a href="/wiki/Joe%20Clark" class="freelinking" rel="nofollow">Joe Clark</a>, <a href="/wiki/Ben%20Kiel" class="freelinking" rel="nofollow">Ben Kiel</a>, <a href="/wiki/Stephen%20Moye" class="freelinking" rel="nofollow">Stephen Moye</a>, and <a href="/wiki/Grant%20Hutchinson" class="freelinking" rel="nofollow">Grant Hutchinson</a></p>
    <p><a href="http://typographica.org" rel="nofollow">typographica.org</a></p>
