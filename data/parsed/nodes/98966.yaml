      <p>Tablet Gothic.</p>
      <p>Typekit:<br>
      <a href="https://typekit.com/fonts/tablet-gothic" title="https://typekit.com/fonts/tablet-gothic">https://typekit.com/fonts/tablet-gothic</a></p>
      <p>Type Together:<br>
      <a href="http://www.type-together.com/Tablet%20Gothic" title="http://www.type-together.com/Tablet%20Gothic">http://www.type-together.com/Tablet%20Gothic</a></p>
      <p>It's expensive but I'll tell you, it works hard for its money. Mind you, if you're only doing headlines the whole family might be overkill. I'm finding the narrow and regular to work very well at small sizes.</p>
      <p>The oblique hasn't yet made it to myfonts.</p>
      <p>EDIT:<br>
      Tablet Gothic isn't as straight-sided as your example typeface. But that's one of the things that actually makes it versatile. </p>
      <p>EDITx2:<br>
      Maybe you're looking for a free font. Sorry, if that's the case. Don't steal.</p>
