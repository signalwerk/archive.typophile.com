    <p>I'm looking for a versatile and (dare I say it) modern condensed grotesque, mainly for headlines and shorter texts.</p>
    <p>I need:</p>
    <p>- upper and lowercase<br>
    - italics<br>
    - A few weights would be nice<br>
    - the ability to use as a webfont.</p>
    <p>I've been using this as a "placeholder" for now:<br>
    <a href="http://www.fontsquirrel.com/fonts/bebas-neue" title="http://www.fontsquirrel.com/fonts/bebas-neue">http://www.fontsquirrel.com/fonts/bebas-neue</a></p>
    <p>Any suggestions?</p>
    <p>Best regards<br>
    Mads</p>
