    <p>The Artist Co-Op is hosting the Sketchbook Project #4. Sign up to be a contributor, receive a theme and a moleskin sketchbook, fill the sketchbook with your art and mail it back to put it in the Sketchbook library. Can’t wait- I already ordered mine!</p>
