    html: "<p>It seems like someone summoned me with something about scripts? The Tabac writing doesn't look too much like anything I know, but if I had to pick something that seems similar, it would come from Part 2 of the Script Font ID Guide (non-flowing formal scripts). The closest I found was Admiral, an R. H. Middleton design from 1953. Type Revivals had it, but someone else provided my sample of it (CybaPee, if any of you know her, from typOasis). Here is the sample she made: <br><img src=\"http://www.typophile.com/forums/messages/83/34344.gif\" alt=\"Admiral sample\"></p>"
