      <p>Welcome to Typophile, Katie. I'd pick A.  </p>
      <p>Abbreviating "Atlanta" seems a bit odd to me in the A layout. I'd spell it out and maybe delete GA. Everyone should know where Atlanta is, and I presume your full address will appear nearby anyway.</p>
      <p>The stars and smaller type may not hold up well when the logo is reproduced small. I'd suggest printing it out in tiny sizes and see what happens. And you might try simplifying the stars and not putting them at an angle.</p>
