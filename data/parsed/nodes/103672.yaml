      <p>&gt; How small will this have to work?</p>
      <p>That's a good question but may be hard for her to answer. You can anticipate what size it'll be on your website and stationery, but situations may come up later where you have to use it smaller. </p>
      <p>Like maybe you want to buy ad space but can only afford a tiny size. Or you want some promotional giveaway items but the imprint area is very small (I've had clients put their logos on pens). Or a charity event prints a microscopic row of logos to thank companies that contributed to the event.</p>
