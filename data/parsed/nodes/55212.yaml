      <p>Jan -- </p>
      <p>I do understand the principles underlying working with automatic align-to-grid. </p>
      <p>My comment about "lines pushed or pulled" was hasty and imprecise. You're right: technically, they only really get pushed. When the spacing of a floating item does not end up preserving grid spacing, only designated space before is honored, and extra space gets added after, so that a following snapped element will get pushed down to the next alignment. (And this is exactly the kind of automatic space manipulation that I find annoying -- but, hey, the app is just doing its job.)</p>
      <p>On some thread in the past, we had a long discussion about the pros &amp; cons of relying on snap to grid. Perhaps you were even part of that conversation. I'm not interested in repeating the points I made there. As I said, I don't begrudge those who choose to work this way. I do recognize the potential power of doing so, and you've been an articulate advocate for the advantages of this approach.</p>
