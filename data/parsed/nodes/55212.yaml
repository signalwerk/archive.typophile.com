      <p><em>that kicks the first line down one line space, but everything aligns to the grid. What’s the problem here?</em></p>
      <p>It could be the setting for the baseline grid start being too close to the top of the text area. A small adjustment there to allow the (presumably higher) ascenders of the italic to fit should do.</p>
      <p>This applies whichever way you define the grid, as for exmple here:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/basgrid_5487.png"></div><p></p>
      <p>So, moving the grid start to 20.2 mm should do the trick.</p>
