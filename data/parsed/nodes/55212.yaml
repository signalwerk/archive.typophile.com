      <p>I believe the culprit has to do with a discrepancy in one of the various ascender metrics in the font header, but someone with more tech savvy would have to identify the specifics for you. And if Linotype says there's nothing wrong internally, then perhaps its something else Indd-specific.</p>
      <p>To avoid just this sort of thing, I am in the habit of defining my Basic Text Frame object style for book documents so that Text Frame Baseline Options &gt; First Baseline is Fixed, with a value that is usually the same as my basic baseline measure or leading. That way, regardless of whether the first line in a frame is a heading or some other variation from text, the baseline will start in a consistent position and not vary depending upon the type size or ascender dimensions.</p>
      <p>At this point in your project, I'm not sure if redefining the Basic Text Frame would reliably propagate in your document and fix your problem without introducing other anomalies. If you're working with a fixed Master text block that isn't overridden on pages, then you might be able to manage the issue globally from there. You may need to use a little trial-and-error to figure out what First Baseline setting will match your existing baseline alignment without needing to adjust the position of all your text frames.</p>
      <p>Hope this makes sense and suggests some possible workarounds for you.</p>
      <p>-- Kent.</p>
