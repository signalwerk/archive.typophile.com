      <p>If a long text contains headings, the technique recommended above is not ideal, it leads to this look:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/firstbase_4736.png"></div><p></p>
      <p>Sorry, there is no way to expain this in a short post. A better solution is to use the baseline grid and snap to it, build the snap definitions into the styles. However, that requires that the whole design is modular. If, say, your body copy is 10/12, your grid could be 6 pt (half-a-line). You could then design the lager headings roughly at 6 pt leading jumps, say 16/18, 22/24, 28/30, you get the drift. You would limit your paragraph spaces above and below to increments of 6 pt: 6, 12, 18, etc.</p>
      <p>It is precisely to avoid the happening shown in the picture, that the default behaviour of InDesign text boxes is (roughly) to align ascender to the top edge of the text area. The headings (no matter how large) will not jump over the top of the text area, or even better over the top of the page :)</p>
      <p>Also, controlling the behaviour of a 900-page book with the text box properties is very limiting, it is much better to use individual settings for individual styles (snap some, leave others floating, snap only first lines, etc.). Another advantage of this approach is that lines align across spreads or at the bottom of columns or pages as well (within the 1/2 line jumps, which are easily adjusted).</p>
      <p>Hope this helps.</p>
