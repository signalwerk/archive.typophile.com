      <p>The 7.5 pt offset that Charles gives is completely reasonable for the work he does. </p>
      <p>The reason I usually prefer the underlying baseline leading value is that a lot of my work has been multi-column or profusely illustrated, with multiple and variable text frames. By using the leading value I can easily achieve precision by simply snapping the head of a text frame to the baseline grid, knowing that the first line will then be aligned, regardless of the text matter -- caption, sidebar, pull quote, whatever -- or where on the page it occurs. </p>
      <p>It's just a slight difference in working styles. But the concept is the same -- establish a controlled starting point, so that precision and consistency can be achieved easily and reliably.</p>
      <p>-- K.</p>
