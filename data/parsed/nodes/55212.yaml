      <p><em>Past experience is that lines will get pushed down or pulled up unexpectedly</em></p>
      <p>It is easier to understand the grid operation in these simple terms: within the grid (ignoring the page margins or text box edges), the only jumps are down, no dimension or space is compressed or lost. The element that does not fit into the grid is pushed down onto the first grid line that can accomodate it. By moving the whole grid up and down on the page (as shown above in the Preferences) the first line fit can be easily and globally controlled (this is the equivalent of snapping the first baseline inside the frame which, b.t.w., bypasses the grid altogether). Finally, it's really advisable to set the grid at a half or a third of body text leading, not on a whole line— to obtain fine-enough control.</p>
      <p>The following bit is really optional and only a suggestion for the brave: It is possible to use the grid as the main type control. The style definitions can be made truly minimalistic and simplistic: only minimum acceptable leading (say 10/11), only minimum acceptable paragraph spaces (say 3 mm above, 1 mm below for a heading). Then, by varying the grid the whole job can be changed from 10/11 to 10/12.5, 10/13, 10/13.8 to achieve a desired look or extent <em>without touching any style definitions again</em>. Assuming that other long-document controls are in place, such as properly defined ‘keeps’, a job can be re-flown repeatedly and easily (just do not tell the editors and publishers :)</p>
      <p>Finally, adjustments to the layout are then best done (no doubt strangely to people with good manners) by using manual overrides, simple click on the up arrow will jump the space by the half or third line defined in the grid.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/arrows_4653.png"></div><p></p>
      <p>If a change is required, select all and click the ‘Clear overrides’ button, and assuming you have been a good person, the only overrides will be these ones, and the job is pristine again.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/override_4806.png"></div><p></p>
