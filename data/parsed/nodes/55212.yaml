    html: |-
      <p><cite>The work I have done has usually been in a much greater state of editorial flux than I suspect Charles’s manuscripts are.</cite></p>
      <p>I imagine that is true, though not because the editors or authors are so careful. Almost all the books we set have an index, and that index is usually prepared from first proof. The publisher -- well, editors -- take pains to keep pages the same in revises, because significant changes can affect that index. And while alterations affecting an index isn't our specific problem (it is an editorial problem), viewed another way, the whole book is our concern, so we too take pains. If an alteration causes copy to change pages, we try to get back to the original pagination as soon as possible. You can make or loose lines fairly easily, etc.</p>
      <p>We probably don't do as many two-column books as Kent, but we do enough to pay attention to issues affecting them. We probably get more of a mix than most people on Typophile, all the way from straight, simple text through illustrated books, to single or dual column column text with two footnote streams, one dual column, one single column.</p>
      <p>Or worse; I have one with a pub date of July entitled <cite>Ballads of the Lords of New Spain</cite>, a transcription of a codex, much of the book Nahuatl on the verso, English on the recto; footnotes to the English but not the Nahuatl; and no getting ahead  with either language. With a few more complications . . .</p>
      <p>No technique is perfect for all kinds of work. In our shop, we also have multiple people working on most jobs, so we probably treasure a consistent approach more than most people.</p>
      <p>But with all that said, it is enlightening to see other people's techniques, often there is be something we can use.</p>
