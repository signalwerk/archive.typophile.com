      <p>A second example, further illustrating a point I made earlier. At the risk of basically repeating myself. FWIW.</p>
      <p>The majority of books that I have done (usually classified as trade illustrated reference) involve multiple planes of text, illustrations, photos, etc. Page layouts often vary spread by spread. So the basic text frame is not necessarily a relatively fixed entity always starting at the top and ending at the bottom of the live area. For that reason, I find it advantageous to work with the fixed baseline value equal to the baseline grid (leading) value. </p>
      <p>In the following excerpt I have a two-column layout with a photo and caption at the head of the second column.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/BaselineGrid_demo2_6270.png"></div><p></p>
      <p>&nbsp;<br>
      With margins, baseline grid, and text frames visible:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/BaselineGrid_demo2a_5530.png"></div><p></p>
      <p>&nbsp;<br>
      With the default text frame defined with First Baseline fixed at the full value of the baseline grid, it's a simple matter to adjust the second column to accommodate the photo &amp; caption by pulling the top handle down to snap to the grid. An ad hoc text frame created to hold the caption text also snaps at the top to the baseline grid, and thus the caption starts neatly on the grid (although the caption leading is not the same as the text).</p>
      <p>No big deal. Just nice and neat. But also flexible.</p>
      <p>One would be correct in noting that this is not anything that couldn't also be achieved with judicious application of align-to-grid and align-first-line-only properties in paragraph styles rather than text frame properties. Different strokes for different folks, as we used to say.</p>
      <p>Okay, enough pontificating from me.</p>
