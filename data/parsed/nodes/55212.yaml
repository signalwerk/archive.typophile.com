      <p>Jan -- Don't get me wrong (or Charles, I suspect): I am a big proponent of organizing using a baseline grid. I am just not generally in favor of relying on snap-to or align-to-grid commands, because I am distrustful of how space then gets handled for floating elements and other exceptions. Past experience is that lines will get pushed down or pulled up unexpectedly, and I'm too much of a control freak to risk that. </p>
      <p>I certainly don't begrudge those who choose to work with snap-to. And I will say that the "align first line only" feature is new to me, since I developed my working methods many many years ago, before InDesign, and never noticed this feature before. And to be able to apply that within a paragraph style .&nbsp;.&nbsp;. I can see how that might be useful. </p>
      <p>No longer resolving Michael's initial plea, but because I said I would come back and explain:</p>
      <p>I did not have a suitable real-world project close to hand, so this somewhat quick-and-dirty example must suffice. This is not presented as a paradigm of excellent design specs, but only to demonstrate an "engineering" technique.</p>
      <p>Here is an example of a heading with space above and below, both inline and occurring at the top of the column. When the head comes at the top, the decision here is to sink the head, in order to preserve the text alignment on the third baseline while preserving the amount of space after.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/BaselineGrid_demo1_3961.png"></div><p></p>
      <p>&nbsp;<br>
      Here is the same screenshot with margins, baseline grid, and text frames visible.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/BaselineGrid_demo1a_6201.png"></div><p></p>
      <p>&nbsp;<br>
      The basal text here is 11/13 pt. The baseline grid, therefore is 13 pt. Text frames are defined (via Basic Text Frame object style) to have First Baseline fixed at 13 pts. The heading is 15/13 pts with 17 pts space above and 9 pts space below: 17 + 9 = 26 = 2 x 13, thus preserving the grid spacing.</p>
      <p>However, here's the "trick": rather than specify the heading style with 17 pts before and 9 pts after, I specify the style with 13 pts before and 13 pts after, then baseline shift the text down 4 pts. </p>
      <p>Why? Despite the seeming inelegance of this approach, what this allows is that when a head occurs at the top of the column, the baseline is perceived by the application to fall directly on the grid. The baseline shift achieves the necessary sinkage. That way, I don't have to manually override the text frame inset, as in Charles's approach.</p>
      <p>The work I have done has usually been in a much greater state of editorial flux than I suspect Charles's manuscripts are. So, I developed a technique where I don't have to do manual fiddling for heads at the top of columns (or worse, undoing the manual work when the copy reflows due to editorial adjustments).</p>
      <p>-- K.</p>
