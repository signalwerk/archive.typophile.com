      <p>Venturing far afield from the original question, I'd note we make extensive use of paragraph styles. The reason is we consider the *file* to be the end product of composition, not a printed book. Paragraph styles can be used for XML tags, or at least a start (since the structure of InDesign coding is essentially flat, not a tree).</p>
      <p>For example, text in a numbered chapter is styled "chapter", text in the introduction is styled "introduction", even though both are the same -- say 10.2/13.5. Moreover, both are based on "basic text", so if a change is needed, it is made only in "basic text" paragraph style.</p>
      <p>By extension, extracts are "chapter.extract" and "introduction.extract". If spacing above &amp; below is different, we use "chapter.extract(1,0)" "chapter.extract(0,1)", and "chapter.extract(1,1)", all based on "chapter.extract". You guessed it, stuff in parentheses is ignored for processing the text outside the typeset book.</p>
      <p>We try to keep direct formatting to a minimum. That minimizes work needed later for a useful *file.* Where direct formatting won't affect the usefulness of the file (as in sinking a subhead), fine, we direct format.</p>
      <p>At first, it is a little daunting to be confronted with 30+ paragraph styles to fill in, but really there are only a few basic styles the rest are based on. Like most things, you get use to it.  </p>
      <p>I'm not advocating any of this for composition, simply pointing out that using InDesign styles can be helpful with certain kinds of workflows, depending on what you view the end product to be.</p>
