      <p>¶ -- I don't think it's necessarily the ascender itself. Different apps use different metrics from the font header info to determine where the "top" of the font is. It may or may not be the actual height of a typical ascender in the design of the typeface, depending upon the value(s) of the various font header fields. </p>
      <p>Miguel, can you tell us which field InDesign uses to determine this?</p>
      <p>Another workaround trick for Michael's problem might be to search-and-convert all Italic spaces to Roman spaces. For lines of Italic that occur as the first line in the text block, the Roman spaceband will force the Roman metrics and shift the line down to the equivalent alignment of others. It's not necessarily elegant, but it is a global fix. Presumably, the spaceband width is the same or very similar between Italic and Roman, and with justified setting any slight difference shouldn't matter much. (And hopefully there are no Italic kern pairs involving the space.) </p>
      <p>This assumes, of course, that the Italic lines are riding high. If not, then this trick won't work, since that would mean the Italic ascender metric is the larger value.</p>
