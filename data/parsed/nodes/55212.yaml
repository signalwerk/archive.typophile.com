      <p>Jan,</p>
      <p>It works fine, if you are doing a long book. For those pages you have a subhead beginning the page, you sink the the starting position. I'm home now &amp; can't bring up a picture, but if anybody really wants to see it, I (or I suspect Kent), can show it</p>
      <p>Of course, in any reasonable scholarly book, you'd never have any such honking big subheads, but you do have the situation I mentioned above, a subhead beginning a page, with +1/2 line specified to the text. Unless told otherwise, we'll sink such a subhead, so the text itself begins on line (that would be line 3) -- but no snapping!</p>
      <p>To further flesh out what Kent was saying about the offset value: If you use the ascender height, then any images to be placed at the top of the page will snap to the frame &amp; be in position. Exceptions are designers who want the images to top align with x-height of the first line. Then you can make a different decision, either use the x-height value so images can snap to the text frame, or mess with each image. But these days, most of the work we do specifies images to top align with the ascender position.</p>
      <p>BTW, I use the same number, usually 7.5 points -- with table settings (ID2). We usually set the tables separately &amp; put them in a library. We show them all in galley form at sample pages. Even when I'm designing a book, I set all the tables before finalizing the design. Using the 7.5 (or whatever) number, you do need extra spacing between the rows of course, but most of the body rows will use the same value, so you can highlight all of them &amp; specify the extra space at one time. This small value also lets you get tighter table rules if you want them fairly tight. ID (at least CS2) won't take a negative value. Another plus is that when placed, the tables will snap into place on the text frame.</p>
      <p>When you're doing a 600 page book with 100 images and 50 tables, little tricks like this help you stay somewhat sane. Of course, in such a book, you are not likely to have many subheads starting a page; I suppose if that were the norm, I might consider a different technique.</p>
