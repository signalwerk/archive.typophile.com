    <p>I'm working with PostScript SabonNext in InDesign CS2 (although this is something I've noticed with other faces and in Quark) and when there is italic type in the first line of a page, that line (and thus the following page of type) does not align to the baseline grid. I happen to be working with 10-point type, in which case the alignment is off by (about) half a point. If I check Align to Grid in the Paragraph Control Panel, that kicks the first line down one line space, but everything aligns to the grid. What's the problem here? And how do I avoid manually adjusting the 900+ pages of the book on which I'm working?</p>
    <p>I wrote to Linotype and they wrote back:</p>
    <p>We checked the font, but could not find any error. Please contact Adobe to see<br>
    why some fonts might lose the baseline.</p>
    <p>Any help will be greatly appreciated.</p>
  html_clean: |-
