      <p>Sorry, I did not realise that you do not want to use the baseline grid. If you do not use the grid in any form, the ascender of the first line aligns to the top of the text area/text box by default. So the baseline will be in a different spot in different typesizes, or italic or small caps. It's nothing wrong with the typeface.</p>
      <p>The jumping of one line down you described happens when baseline grid is in use and the space above the first baseline grid line is not large enough for the ascenders.</p>
