  html: "<p>I'm trying to create a kind of ornament font that uses reverse upper/lower letters in a rounded rectangle. This is for two-letter language codes for our labeling. I've created a bunch of custom fonts before, which contained my own drawings as characters. However now I need to create this font to look like our existing Myriad Pro text. <br> <br>I only need Upper/lower A-Z for this, plus [] and (). These will look like this: <br> <br> <img src=\"http://www.typophile.com/forums/messages/4100/36178.jpg\" alt=\"How it should look\"> <br> <br>This corresponds to: <br>English language/Great Britain <br>French/France <br>Hellenica (Greek)/Greece <br>Japanese/Japan <br>etc... <br> <br>Are there open-source/free font designs that I can use that are somewhat similar to the Myriad Pro Bold Condensed font I used for these? I don't want to use Adobe's outlines (like I did for this illustration) so that we don't have to worry about this font for internal company work. <br> <br>Is the best solution to just draw the entire font myself? I am just using the alphabet as a basis for the font I'll be creating, but I don't want to step on other people's design for my base glyphs, I only want to base the font on glyphs that I have the proper permission to derive my font from. <br> <br>Clear as mud?</p>"
  html_clean: "<p>I'm trying to create a kind of ornament font that uses reverse upper/lower letters in a rounded rectangle. This is for two-letter language codes for our labeling. I've created a bunch of custom fonts before, which contained my own drawings as characters. However now I need to create this font to look like our existing Myriad Pro text. <br> <br>I only need Upper/lower A-Z for this, plus [] and (). These will look like this: <br> <br> <img src=\"http://www.typophile.com/forums/messages/4100/36178.jpg\" alt=\"How it should look\"> <br> <br>This corresponds to: <br>English language/Great Britain <br>French/France <br>Hellenica (Greek)/Greece <br>Japanese/Japan <br>etc... <br> <br>Are there open-source/free font designs that I can use that are somewhat similar to the Myriad Pro Bold Condensed font I used for these? I don't want to use Adobe's outlines (like I did for this illustration) so that we don't have to worry about this font for internal company work. <br> <br>Is the best solution to just draw the entire font myself? I am just using the alphabet as a basis for the font I'll be creating, but I don't want to step on other people's design for my base glyphs, I only want to base the font on glyphs that I have the proper permission to derive my font from. <br> <br>Clear as mud?</p>"
