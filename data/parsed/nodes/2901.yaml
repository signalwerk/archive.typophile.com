    html: <p>What, exactly are you looking for in a Tengwar font?  I've got in my own collection most of the Windows freeware Tengwar fonts out there, (and a couple of them I made myself, actually).  Most of them follow Dan Smith's "standardized" character mapping, but there are also a few that are mapped phonetically.  I have also found a number of Roman-readable fonts based on Tengwar letter forms.  E-mail me if you have questions.</p>
