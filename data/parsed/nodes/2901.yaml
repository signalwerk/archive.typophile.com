  html: <p>okay, so if you know what this subject means, you must know that i'm a LOTR geek (check the current icon); i found some other information on <a href="/wiki/tengwar" class="freelinking" rel="nofollow">tengwar</a> fonts on the string about mixing scripts and thought it deserved its very own string. so i had a couple questions... first of all has the unicode been standardized for the script? secondly, does that really matter now with open type? i mean couldn't a person make a tengwar font these days that would just replace the appropriate ligature for the vowel placing? (or is ligature substitution what one would want to use for tengwar?) i've been interested in making my own tengwar font as the ones that are out there don't seem to be as interesting and/or artistic as the could be. (or can one of you point me towards some finer fonts?) i'm thinking that New Line had to have done SOMETHING for the LOTR series and some of their stuff (like the lettering on the ONE RING is absolutely gorgeous!) dunno if they actually made a font tho, would be great if they had. anyhow i'm just surprised that the movies hadn't sparked more interest in here on this topic! let's get some good dialog flowing... i'd love to be enlightened on this one!</p>
  html_clean: <p>okay, so if you know what this subject means, you must know that i'm a LOTR geek (check the current icon); i found some other information on <a href="/wiki/tengwar" class="freelinking link-lost" rel="nofollow">tengwar</a> fonts on the string about mixing scripts and thought it deserved its very own string. so i had a couple questions... first of all has the unicode been standardized for the script? secondly, does that really matter now with open type? i mean couldn't a person make a tengwar font these days that would just replace the appropriate ligature for the vowel placing? (or is ligature substitution what one would want to use for tengwar?) i've been interested in making my own tengwar font as the ones that are out there don't seem to be as interesting and/or artistic as the could be. (or can one of you point me towards some finer fonts?) i'm thinking that New Line had to have done SOMETHING for the LOTR series and some of their stuff (like the lettering on the ONE RING is absolutely gorgeous!) dunno if they actually made a font tho, would be great if they had. anyhow i'm just surprised that the movies hadn't sparked more interest in here on this topic! let's get some good dialog flowing... i'd love to be enlightened on this one!</p>
