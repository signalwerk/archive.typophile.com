      <p>hmmm I've had this problem before...</p>
      <p>Deactivate all fonts... this sometimes works..</p>
      <p>one option would be to reset Illustrator's prefs<br>
      by holding down Shift-Command-Option-Control<br>
      while launching the program...(save your workspaces!)</p>
