    <p>WIERD, all of a sudden, CS3 is freezing on me.</p>
    <p>Everytime I save a open file or livetrace something, it won't let me do anything, unless I close and reopen that file or click on the layers palette.</p>
    <p>It lets me zoom in and out, but I can't touch anything by clicking on it.</p>
    <p>Anyone else have this problem?</p>
