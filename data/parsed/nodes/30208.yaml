      <p>Do you have the Creative Suite? Then putting your fonts into<br>
      Users / [your user folder] / Library / Application Support / Adobe / Fonts<br>
      or into<br>
      Library / Application Support / Adobe / Fonts<br>
      should make them available to all CS applications.</p>
