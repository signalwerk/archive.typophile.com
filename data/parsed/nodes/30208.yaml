    html: |-
      <p>In the example you give, "CB_____.PFB and _C_____.PFM" you are describing a PFB for one font and a PFM for a different font. They should have identical file names except for the extension.</p>
      <p>That aside, you have a more basic problem. The private Adobe fonts folder only enables fonts for applications that use the shared Adobe font engine. This includes InDesign, Illustrator, Photoshop and AfterEffects (among others), but Fireworks is not part of that group. At least, not in the CS3 version.</p>
      <p>I don't know of any way, short of converting the font, to enable a Windows Type 1 font to work with Fireworks on Mac OS.</p>
      <p>Regards,</p>
      <p>T</p>
