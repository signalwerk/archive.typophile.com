      <p><cite>You’re not completely out of luck — PC TrueType (.ttf) and OpenType (.otf) files should work on your Mac simply by dragging them into one of the many Font folders.</cite></p>
      <p>Don't install many fonts this way! OS X can't deal well with a lot of fonts on its own before stability problems start popping up. Since it comes with hundreds (almost 500 in the newest factory-installs!) to begin with, it's important to use a font management tool to handle your fonts, <a href="http://www.linotype.com/fontexplorerX">Linotype's FontExplorer X</a> is free, seems to be the most stable app out there, and has some useful cleanup tools for when fonts go bad. Stay away from ATM—it's old and being phased out, so when bad stuff happens with it you're just sort of screwed.</p>
