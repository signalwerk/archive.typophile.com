      <p>Advo, the short answer is that you won't be able to use those fonts on your Mac. PFB and PFM files combine to make Postscript fonts on the PC. That format isn't supported by Mac OSX. </p>
      <p>You're not completely out of luck -- PC TrueType (.ttf) and OpenType (.otf) files should work on your Mac simply by dragging them into one of the many Font folders.</p>
      <p>Lots of useful info on Mac fonts, including which types are supported (and which folders you can use to make fonts active)</p>
      <p><a href="http://images.apple.com/macosx/pdf/MacOSX_Font_TB.pdf">http://images.apple.com/macosx/pdf/MacOSX_Font_TB.pdf</a></p>
      <p>.hqx is the extension for BinHex files, a format that turns files into ASCII for easier transmission on the internet.</p>
      <p>.sit is the extension for StuffIt, a compression format that's popular on the Mac.<br><a href="http://www.faqs.org/faqs/macintosh/games-faq/section-4.html">http://www.faqs.org/faqs/macintosh/games-faq/section-4.html</a></p>
