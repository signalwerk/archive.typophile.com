    <p>I have fairly recently switched from PC to Mac. Last night I tried to transfer a folder of fonts that I had on my pc over to my mac, but they are all in the format pfb and pfm.. </p>
    <p>I googled it and found out that I needed the program Adobe Type Manager Light, so I went and downloaded that, but it has come in a weird format that wont open.. (the full filename for it is "atm462.sit.hqx")..</p>
    <p>Do you guys know what I need to do to get these fonts? From what I can gather, pfb and pfm are sort of zip formats.. Please correct me if i'm wrong!</p>
    <p>Happy Christmas also!</p>
  html_clean: |-
