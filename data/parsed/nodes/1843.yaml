    html: "<p> Hrant --  <br> <br>Thinking about it last night, I realized the same thing about your formula: it's circular. A word like \"gypsy,\" with 5 letters and 4 descenders, comes out equal in score to a word like \"preapproving\" with 12/4.  <br> <br>So, are you looking for merely a high proportion of descenders? Pygmy and gypsy are 90%. Or are you looking for a long ascenderless word? Perspicaciousness is 17, but only 2 descenders. Prepossessing is 13/3. Preapproving and preoccupying are both 12/4. That's the best combination I've managed to come up with so far.  <br> <br>But I've been ruling out 't'. I'll think on it some more and see what else I can come up with. <br> <br>-- K. </p>"
    html_clean: "<p> Hrant --  <br> <br>Thinking about it last night, I realized the same thing about your formula: it's circular. A word like \"gypsy,\" with 5 letters and 4 descenders, comes out equal in score to a word like \"preapproving\" with 12/4.  <br> <br>So, are you looking for merely a high proportion of descenders? Pygmy and gypsy are 90%. Or are you looking for a long ascenderless word? Perspicaciousness is 17, but only 2 descenders. Prepossessing is 13/3. Preapproving and preoccupying are both 12/4. That's the best combination I've managed to come up with so far.  <br> <br>But I've been ruling out 't'. I'll think on it some more and see what else I can come up with. <br> <br>-- K. </p>"
