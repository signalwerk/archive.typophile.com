    html: <p> Hold everything. <br> <br>My formula is stupid - it always ends up equaling the number of descenders... So the Score is simply the number of descenders in the word (and no ascenders allowed). But the Kucera frequency is still the tie-breaker. OK? OK. <br> <br>BTW, the Kucera frequency for "gray" is 80. That of my 4-point word is... zero. So practically any word with 4 descenders and no ascenders beats it. Come on, you can do it! <br> <br>So, what the hell is the point? To find words that can imbalance multi-lingual settings where English is mixed directly into a non-Latin paragraph, specifically in a writing system that's "top heavy"... Just find me a juicy word and I'll show you, OK?!  :-) <br> <br>hhp </p>
