    html: "<p>&gt; Syzygy <br> <br>I'll be darned - that's a word! And a rich one too, in both meaning and descender-space. But of course with a frequency of zero in Kucera. <br> <br>So \"gypsy\" is the leader now (go David!), with a frequency of 4 (\"poppy\" and \"puppy\" are 2). And I like it best because it's not mostly just a bunch of \"p\"s. Mine was \"pygmy\", btw. I also came up with \"ping-pong\", but it's weak (in a number of ways). <br> <br>A frequency of 4 isn't great, but considering how rare descenders are in English*, it's not bad. Can anybody do a Score of 5? <br> <br>* <a href=\"http://www.themicrofoundry.com/image/s_rome1-4.gif\" target=\"_top\">http://www.themicrofoundry.com/image/s_rome1-4.gif</a> <br> <br>&gt; So, are you looking for merely a high proportion of descenders? <br> <br>Originally I was looking for a word that has the most descenders both in number as well as proportion. So a good equation might have been d^2 * c (instead of c * d/c , the original one), where d is the number of descenders and c the number of characters. So \"gray\" would have scored 16 and \"pygmy\" would have scored 16*5 = 80. <br> <br>But that's too math-y (in this context), so I figured to just settle for the number of descenders, especially since the original equation was that anyway. <br> <br>&gt; Or are you looking for a long ascenderless word? <br> <br>No, but it would definitely also be useful to find: <br>1. The longest word with no extenders at all: the word with the smallest height. <br>2. The longest word with the greatest proportion of extenders: the word with the greatest height. <br>(Non-exotic is a big plus.) <br> <br>The current search is for the word with the lowest \"center of gravity\". The word with the highest CoG is less interesting, because it's more in line with general behavior of English. I'm looking for aberrations. <br> <br>hhp</p>"
    html_clean: "<p>&gt; Syzygy <br> <br>I'll be darned - that's a word! And a rich one too, in both meaning and descender-space. But of course with a frequency of zero in Kucera. <br> <br>So \"gypsy\" is the leader now (go David!), with a frequency of 4 (\"poppy\" and \"puppy\" are 2). And I like it best because it's not mostly just a bunch of \"p\"s. Mine was \"pygmy\", btw. I also came up with \"ping-pong\", but it's weak (in a number of ways). <br> <br>A frequency of 4 isn't great, but considering how rare descenders are in English*, it's not bad. Can anybody do a Score of 5? <br> <br>* <a href=\"http://www.themicrofoundry.com/image/s_rome1-4.gif\" target=\"_top\">http://www.themicrofoundry.com/image/s_rome1-4.gif</a> <br> <br>&gt; So, are you looking for merely a high proportion of descenders? <br> <br>Originally I was looking for a word that has the most descenders both in number as well as proportion. So a good equation might have been d^2 * c (instead of c * d/c , the original one), where d is the number of descenders and c the number of characters. So \"gray\" would have scored 16 and \"pygmy\" would have scored 16*5 = 80. <br> <br>But that's too math-y (in this context), so I figured to just settle for the number of descenders, especially since the original equation was that anyway. <br> <br>&gt; Or are you looking for a long ascenderless word? <br> <br>No, but it would definitely also be useful to find: <br>1. The longest word with no extenders at all: the word with the smallest height. <br>2. The longest word with the greatest proportion of extenders: the word with the greatest height. <br>(Non-exotic is a big plus.) <br> <br>The current search is for the word with the lowest \"center of gravity\". The word with the highest CoG is less interesting, because it's more in line with general behavior of English. I'm looking for aberrations. <br> <br>hhp</p>"
