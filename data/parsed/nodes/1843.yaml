  html: "<p> Challenge: <br>Find the longest (English) word with no ascending characters, and the highest proportion of descending ones. A word's score is its length in characters multiplied by the descender proportion. <br>For example, \"gray\" is 4 * 50% = 2. <br> <br>(\"Normal\" Roman structure is assumed - like no descending \"z\"s, please.) <br> <br>In the case of a tie, the word with the highest frequency (according to Kucera) wins. <br> <br>BTW, the one I myself have so far scores 5 * 80% = 4. <br> <br>hhp </p>"
  html_clean: "<p> Challenge: <br>Find the longest (English) word with no ascending characters, and the highest proportion of descending ones. A word's score is its length in characters multiplied by the descender proportion. <br>For example, \"gray\" is 4 * 50% = 2. <br> <br>(\"Normal\" Roman structure is assumed - like no descending \"z\"s, please.) <br> <br>In the case of a tie, the word with the highest frequency (according to Kucera) wins. <br> <br>BTW, the one I myself have so far scores 5 * 80% = 4. <br> <br>hhp </p>"
