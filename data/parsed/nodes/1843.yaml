    html: "<p><i>&gt; 1. The longest word with no extenders at all: the word with the smallest height.</i> <br> <br>If you continue to accept 't', then there's instantaneousness with 17. But that suffix is a little forced. How about inattentiveness at 15; the suffix is a little less awkward here. But, okay skip that; there's uncommunicative (15) and incommensurate (14) and intermissions (13). <br> <br>If you nix the 't', it gets a little trickier, but there's inconvenience (13) or recursiveness (13) or incisiveness (12). But if you're going to throw Kucera back in the mix, then all bets are off. Obviously, the longer the word, the lower it's likely to score on a frequency scale. And without access to this mysterious Kucera, I'm just stabbing in the dark. <br> <br>Clearly I must have better things to do on a beautiful Saturday afternoon. It's been fun, but now you're on your own. <br> <br>-- K.</p>"
