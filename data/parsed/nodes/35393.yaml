  html: '<p>De Standaard -- one of the quality newspapers here in Flanders/Belgium – unveiled its new design three months ago. The typefaces used all are The Font Bureau, Inc. fonts: Miller Daily, Benton Sans and Escrow. I already noticed it back when the new style premiered, but it recently struck me again how badly those otherwise perfectly fine faces are mistreated. Read the entry on <a href="http://www.fontshop.be/details.php?entry=179" rel="nofollow">Unzipped</a> and feel free to comment (preferably in the blog itself).</p>'
