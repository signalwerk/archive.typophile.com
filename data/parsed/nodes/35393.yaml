    html: |-
      <p>Yves, I just posted there.</p>
      <p>It looks like the designers are wrestling with the pagination system, so it would be unfair to blame them for circumstances which are beyond their control.</p>
      <p>For instance, I suspect that the pagination system sets the word space value, which may account for the excessive word spacing in some heads, if their editor has asked for plenty of word space in the body text. Similarly, if the pagination system places restrictions on the number of kern pairs, then some will go missing.</p>
      <p>These are issues for the paper's designers to sort out with their IT department, the editor, the publisher, and the pagination system supplier -- it may take a while. At least they have progressed to the next level by implementing fonts where these kinds of subtle typographic distinctions are relevant!</p>
