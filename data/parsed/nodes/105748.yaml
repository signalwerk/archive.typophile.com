    <p>Hi,</p>
    <p>I was looking through some Computer Arts tutorials and came across Mark Bloom's modular grid system in illustrator.</p>
    <p><a class="freelinking external" href="http://www.computerarts.co.uk/tutorials/create-modular-grid-system-illustrator" rel="nofollow">http://www.computerarts.co.uk/tutorials/create-modular-grid-system-illustrator</a></p>
    <p>I thought it was refreshing to see Computer Arts highlight how a designer works with a grid system in their day-to-day design projects.</p>
    <p>I was wondering what people thought to the process Mark uses? I am interested to hear everyones thoughts about creating Modular grid systems, perhaps you feel you have a better solution? or perhaps you work for a design studio that likes you use grids a certain way?</p>
    <p>Appreciate anyones thoughts?</p>
    <p>Thanks<br>
    p</p>
