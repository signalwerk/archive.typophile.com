  html: |-
    <p>Hi</p>
    <p>I'm planning on doing a workshop about this subject on my university. If you have any interesting information I would love to know. A friend recently shared some info about an Alliance of German Designers workshop:</p>
    <p>------------------------------------------------------------------------<br>
    price per hour x hour = working price<br>
    ------------------------------------------------------------------------<br>
    Usage type simple 0.2<br>
    Usage type exclusve 1.0<br>
    ------------------------------------------------------------------------<br>
    Usage area national 0.1<br>
    Usage area regional 0.3<br>
    Usage area Europe 1.0<br>
    Usage area Europe 1.5<br>
    Usage area worldwide 2.5<br>
    ------------------------------------------------------------------------<br>
    Usage time 1 year 0.1<br>
    Usage time 5 years 0.3<br>
    Usage time 10 years 0.5<br>
    Usage time forever 1.5<br>
    ------------------------------------------------------------------------<br>
    usage extent small 0.1 (small print number under 500)<br>
    usage extent medium 0.3 (medium print number 500-5.000 copies)<br>
    usage extent big 0.7 (big print number above 5.000 -10.000 etc..)<br>
    usage extent seriously everywhere 1.0 (big print and or online)<br>
    ------------------------------------------------------------------------<br>
    Total Factor = X.X<br>
    ------------------------------------------------------------------------<br>
    working price x X.X = final price<br>
    ------------------------------------------------------------------------</p>
    <p>So, if you have some interesting information or some advice on this subject, I will be most grateful.</p>
