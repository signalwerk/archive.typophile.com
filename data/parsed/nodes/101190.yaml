    html: |-
      <p>&gt; small print number under 500</p>
      <p>Your list seems more like something used by an artist or commercial illustrator rather than a graphic designer.  A designer would typically list their hours by categories — consultation time (meetings, emails, phone calls), research, concept development, final art, revisions (with some clients, revisions may be a significant percentage of the total amount), etc —  and would list reimbursable expenses by category —photography, illustration, proofs, printing, etc.</p>
