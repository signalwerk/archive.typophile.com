    html: |-
      <p>"any subpixel rendering (ClearType) pays less attention to x-direction hints"</p>
      <p>That's correct. Almost all systems today subpixel render in x, and the majority pixel render fonts in y, aligning the baseline, descent and ascent, 3 y features, to the grid. All other features in y and all features in x are rendered by most systems without hints. </p>
      <p>This may be why icons are "over" and big skinny type is replacing them.</p>
