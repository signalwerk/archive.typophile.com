    html: |-
      <p>A quick peek into the 'sbix' table:</p>
      <p>Version: 2 USHORTS, as usual for TTF tables. Version seems to be 1.1<br>
      Num Sizes: ULONG -- 6, for Apple Color Emoji v.8.0d3e1<br>
         numSizes * ULONG: offset for size table, relative to the start of the sbix chunk</p>
      <p>Each size table starts with<br>
      Size   USHORT<br>
      Dpi   USHORT<br>
          The sizes in the six tables are  20, 40, 48, 64, 96, and 160 pixels (all individual images appear to be square). Dpi is '72' in all of the tables.</p>
      <p>Then follow (<em>numChars</em> + 1) * ULONG offsets from the start of the size table. <em>numChars</em> seems to be taken from the maxp table, plus 1 to add a 'last entry' file size.</p>
      <p>Each offset from the start of <em>this</em> table points to:<br>
      4 zero bytes \<br>
      "png "         / reminiscent of Apple's File Type/Creator data<br>
      .... raw PNG data</p>
      <p>The file size of the PNG data seems to be calculated from the offset to the <em>next</em> image; the last one is empty.</p>
      <p>There seems to be no direct link from bitmap index to Unicode or the character map. The first 41 images seems to always be of size 0; inverse parallel to InDesign's Glyph panel, where the first 41 glyphs contain visible vector data (the bitmaps are <em>not</em> visible in InDesign).</p>
      <p>Useful? I don't think so. Only Apple's own software can display these glyphs, probably through the shared code base for its own glyph rendering. Inserting a Color Emoji here: [*] ("Do Not Litter", U+1F6AF). It should look like this:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/emoji-852_4024.png"></div><p></p>
      <p>(My Shared Code base just got some support. I originally typed this into Safari, until remembering it doesn't allow me to insert an image. It did display the emoji above. Switched to Firefox, Insert image Yes but Color Emoji No.)</p>
      <p>[*] Ouch! Typophile does not like Color Emoji and cut off the rest of my post!</p>
