      <p>That was fun! I hard-coded one single image into my OTF (Type 1) generator and then generated a simple font. It works! ... Even though this is a Type 1 font. Must be some <em>serious</em> hacky overrides in Apple's code.</p>
      <p>This is in TextEdit; the character '^' contains the bitmap:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/moon_5785.png"></div><p></p>
      <p>One unexpected result is that the original vector data is drawn <em>over</em> the bitmap image. Not only that, it actually got scaled to both size and position of the '^' in my original font. My font generator doesn't allow for no-op drawing, so I had to draw a simple circle for a placeholder. I guess using Type 1 as a base is not that useful, because it doesn't allow an 'empty' drawing that still takes up space -- all ink marking are going to be visible.</p>
      <p>You can download the <a href="http://www.jongware.com/binaries/bitmapimage-regular.zip" rel="nofollow">zipped font</a> here; apart from the sbix table, the rest is nothing spectacular.</p>
    html_clean: |-
