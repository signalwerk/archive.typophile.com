      <blockquote><p>How much hinting does Windows ignore?</p></blockquote>
      <p>It depends on the rasterizer and display settings, but any subpixel rendering (ClearType) pays less attention to x-direction hints, and subpixel positioning (DirectWrite) means that any given glyph could render slightly differently depending on its location.</p>
      <p>None of this to suggest that hinting is useless—particularly (mainly?) for Windows—just that the variety of platforms and settings makes webfonts a poor mechanism for delivering "pixel precise" icons.</p>
