    <p>Hello all,</p>
    <p>I am quite new to the process of creating a font so please bear with the supreme beginner-like questions about to be asked. I have 2 core issues, one of which pertains to display resolution and rendering (and the specs needed to build the font to the appropriate scale):</p>
    <p>Glyph definition in relation to unicode standards<br>
    Pixel perfect glyphs for certain pixel scales</p>
    <p>Here's the jist: I am working the creation of a icon font for use on the web and I am having trouble sorting out the best way to go about producing a font with non-standard glyphs as each icon is different than others. This is basically meant to be a sprite file almost akin to what is done in webdings, etc. for my website.  All of this, I feel, boils down to Unicode definitions. Is there a guide or easy way to sort this out? Googling has left me somewhat worse for wear as none of the tutorials or guides give a soup-to-nuts scenario.</p>
    <p>FYI: I am using Glyphs (<a href="http://www.glyphsapp.com" title="www.glyphsapp.com">www.glyphsapp.com</a>) for font creation.</p>
    <p>Secondly, I am dealing with icons that have 2 different detail scales to accomodate for detail loss at smaller sizes due to pixel density of standard displays. I know that fonts scale as they are vector (and thus work perfectly fine for HiDPI displays) that is the nature of the beast, however, I need certain icons to be pixel precise and am unsure of how to go about this.</p>
    <p>Thanks for any and all help you can provide.</p>
    <p>-Sean</p>
