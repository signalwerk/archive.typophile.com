      <blockquote><p>I don't have a clue how you would make [bitmapfonts]</p></blockquote>
      <p>Fontographer can output BDFs (although it can't embed them); that's how I once made 5 sizes of bitmaps for Arasan (and used SBIT to embed). There are other tools too, including some that make color BDFs (which I once used to embed 16-gray bitmaps, which <em>sort of</em> worked - in fact much better than that MS passage implies, although still not robustly enough). But the problem isn't making or embedding them, the problem -as you imply- is that these days they get largely ignored.  :-(</p>
      <p>But maybe Apple has opened up an opportunity (which is quite ironic considering their anti-pixel font rendering philosophy).</p>
      <blockquote><p>It will only work on Apple's Mac OS X</p></blockquote>
      <p>What about a Windows plug-in/extension of some sort?</p>
      <blockquote><p>If you are concerned for the quality of your font at smaller sizes ....</p></blockquote>
      <p>Well, I <em>have</em> successfully made outline fonts that render out precise grayscale patterns at specific sizes (with special software by the now-defunct Ultrafonts):<br>
      <a href="http://www.themicrofoundry.com/manademo/" title="http://www.themicrofoundry.com/manademo/">http://www.themicrofoundry.com/manademo/</a><br>
      Although they don't work as robustly as they used to...</p>
      <p>The thing is, now that we're getting 250+ dpi screens I do have to admit it's becoming moot (although I still don't agree with Apple's full-fuzz philosophy). So the impetus now is something else, something that can't be done with current rendering/formats: color!</p>
      <p>Jens, good to have you here - my hope is now doubled!  :-)</p>
      <p>hhp</p>
