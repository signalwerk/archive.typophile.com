      <p>Tying this back to Sean's question -- apologies for the slight diversion :D</p>
      <ul>
      <li>You <em>can</em> embed optimised bitmaps (pixel representations) into a font (I must admit I don't have a clue how you would make them -- Photoshop? MS Paint?)</li>
      <li>.. although it depends on the end-user's software whether s/he gets to see your painstakingly hand drawn glyphs. Software may or may not use your pixel previews.</li>
      <li>The pixel previews are bound to a <em>pixel</em> size, and you don't know in advance which size(s) would be needed. Therefore, you typically would need to create lots of different sizes.</li>
      </ul>
      <p>A few random snippets from <a href="http://www.microsoft.com/typography/tt/win95tt.aspx" rel="nofollow">Microsoft's TrueType discussion</a>:</p>
      <blockquote><p>Embedded bitmaps are bitmaps that can be added to a TrueType font file. A font may contain one or more embedded bitmaps, for one or more pixel-per-em (ppem) sizes. For instance, a TrueType font might include embedded bitmaps of glyphs that are difficult to hint at small sizes, such as complex ideographs.</p></blockquote>
      <blockquote><p>[..] The TrueType font format currently does not support gray scale embedded bitmaps.</p></blockquote>
      <p>Is this new-fangled 'sbix' stuff something for you, then?<br>
      At first glance you might think so, because:<br>
      (1) you can use any color you want, including fully anti-aliased grayscale;<br>
      (2) you can provide optimized bitmaps for different pixel sizes.</p>
      <p>But, as per tests above, it comes with a few drawbacks as well!<br>
      (1) It will only work on Apple's Mac OS X,<br>
      (2) .. and then only with selected applications.<br>
      (3) You can show a vector over a bitmap, or just a bitmap. On unsupported systems, only the vector part will be visible.</p>
      <p>Here is my test font on a Windows 7 machine, in Microsoft Word:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/bitmapimage_4664.png"></div><p></p>
      <p>Bottom line is, best to stick to the OTF standard. If you are concerned for the quality of your font at smaller sizes, try and find out how you can generate, hand-optimize, and embed standard black-and-white pixel versions with your software.</p>
