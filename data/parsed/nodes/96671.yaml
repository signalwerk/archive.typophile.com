      <p>David: <em>And it gobbled up Unicodes when there are still scripts with 1000s of as yet to be encoded glyphs?</em></p>
      <p>We're not in risk of running out of Unicode codepoints any time soon, so I'm not concerned about them being gobbled up, per se. And I say that as one of the people who made the case <em>against</em> encoding emoji in Unicode, and I agree with you completely that this represents hijacking of the convenience of fonts and text encoding, but that's been the nature of pi fonts, wingdings, etc. for a long time.</p>
      <p><em>...to suit the needs of a party.</em></p>
      <p>Many parties, unless you group as one everyone involved in making and selling mobile phone hardware and software. That's who pushed the emoji encoding through.</p>
