      <p>On your first issue: try and stay semantic— if an icon has a related symbol in Unicode, use its Unicode value. Otherwise assign a PUA value and display it using a CSS replacement technique or (possibly) OpenType substitution. Some relevant links:</p>
      <p>On Unicode assignment in icon fonts: <a class="freelinking external" href="http://somerandomdude.com/2012/01/31/font-embedding-icons-the-right-way/" rel="nofollow">Font-Embedding Icons the Right Way</a></p>
      <p>Some common Unicode icon entities: <a class="freelinking external" href="http://www.codestyle.org/css/at-font-face/StandardUnicodeIconsWebFonts.shtml" rel="nofollow">Unicode icons in Web fonts</a></p>
      <p>Unicode character reference: <a class="freelinking external" href="http://www.fileformat.info/info/unicode/char/search.htm" rel="nofollow">Unicode Character Search</a></p>
      <p>Methods for HTML markup and CSS: <a class="freelinking external" href="http://css-tricks.com/html-for-icon-font-usage/" rel="nofollow">HTML for Icon Font Usage</a></p>
      <p>Semantic icon fonts using OpenType substitution:<br>
      <a class="freelinking external" href="http://symbolset.com/blog/semantic-symbol-fonts/" rel="nofollow">Symbolset - Semantic Symbol Fonts</a></p>
      <p>Pixel precision? Not likely. Even if you delta-hinted all of your glyphs for small ppem sizes, most modern platforms ignore some or all hinting, and embedded bitmaps are pretty much extinct. A convoluted solution might be to use CSS and javascript to detect device-pixel-ratio, then load/position an image sprite instead of the font.</p>
