    <p>Some time ago, I designed a letterhead for a local organization using CorelDRAW 11.  The result has been used since as a .pdf file.  Now I need to edit the letterhead and have discovered that I no longer have Kabel Bk BT and Kabel Ult BT on my computer system (Mac).  It may be that the fonts resided on an earlier computer which crashed.  The fonts may have originated from a set of disks that I loaned to a colleague (who claims he returned them), but I can no longer find them.</p>
    <p>Needless to say, I assume I need to reinstate the fonts in order to edit the file (I don’t suppose I can edit the .pdf file).  Could someone please advise me as to the simplest and cheapest method of achieving this?</p>
    <p>Cheers,</p>
    <p>Anthony (Ottawa)</p>
