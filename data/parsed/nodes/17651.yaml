    <p>You know when you get one of those sample kits from printers in the mail and they don’t really say much about printing? Well, that may all soon change if I get my way with this one. So far, the client has let me include whatever I want. So far they are grouped into cards by category. Color printing, measurements, paper sample, etc.</p>
    <p>And of course there is a typography card. I have quite a few ideas already, but if you could have any information about digial color printing (as is pertains to type) for reference at your fingerprints what would it be? Some I have, for example, are 1) pixelated vs. vector type 2) outlining type 3) type sizes, etc. These could be anything applicable. File setup, how things print, color, etc.</p>
    <p>What’s on your wishlist?</p>
    <p>Shu</p>
