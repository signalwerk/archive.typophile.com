      <p>I've seen that font before, with that ugly descending "t"… some free font, right?<br>
      I wouldn't use that, it looks like a mistake. (I'm not sure your font combination works anyway, to be honest.)</p>
      <p>BTW, "fax", "email", and "web" aren't abbreviations, why use a period?</p>
      <p>Also: If you can, please do make all the shades of blue the same. It looks like they might be supposed to be the same but clearly aren't, but there's not enough difference to make it look deliberate.</p>
