      <p><cite>And if someone could be able/willing to create/compile such a resource, which characteristics/tools would be needed?</cite></p>
      <p>Riccardo, I think the best is to build a relational database. This could be used in queries through the web or in some automatic tool. As any relational db can have its data exported in several ways, the information would feed since Python macros to standalone applications.</p>
      <p>This db structure would include a table for languages, a table for scripts, a table for glyphs, a table for countries and tables with associations between all these. The separation in various tables is needed to handle the n-to-n relationships (glyphs–alphabets–languages–scripts–countries). Glyph table needs a field to insert the glyph image.</p>
      <p>About tools, I think any db manager could do this –like phpMyAdmin for MySQL or even MS Access.</p>
