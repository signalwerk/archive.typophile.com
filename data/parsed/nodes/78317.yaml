      <p>I thought this kind of information came from the codepages supported, what is defined in the font and interpreted by the OS algorithm.</p>
      <p>If this is verified on the fly by MacOS taking into account the actual glyphs of the font, its database would be extremely useful. I'm searching for months to get all Latin-script languages mapped and it's an almost insane job.</p>
      <p>But if this is an algorithm, how it evalues the support given through combining diacritics? A proper support would need the base glyph, the combining diacritic and the ccmp declaration (and also a mark definition for most stacking diacritics). Does MacOs verify all this?</p>
      <p>In Windows I believe the OS simply takes language support from font codepages.</p>
