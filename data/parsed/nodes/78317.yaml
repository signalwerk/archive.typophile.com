    html: |-
      <p><cite>...reliable set of characters per language</cite></p>
      <p>The first question is: what are these databases used for, what is the objective?</p>
      <p>In the case of FontBook it is obviously to determine the set of supported languages for a given font.</p>
      <p>As a font maker, it would be the other way round: Which characters do I have to provide in order to support a certain language? It all boils down to minimizing the number of fail cases where a document requires a character that is not in the font. Or, to achieve a certain coverage (say, 99.95%) while minimizing the costs. What are the costs? Design effort is a cost, which is not the same for each character – some accented characters can be generated with two clicks, whereas other rarely used characters need to be designed from scratch. What if the rationale is to minimize the file size, e.g. for web fonts? Then the cost is in kB, not work. But we have a similar scenario: some characters cost more, others less (accented characters have very low data volume).</p>
      <p>So, we want to cover as many cases as possible with our font. In that sense, I think a linguistic approach does not help much. I believe trying to find out which characters are “required” is the wrong paradigm and 100% coverage is impossible to achieve. Also, “cases” is very difficult to define in the first place. Do we distinguish between geographic locations as well? Are we talking about the web? Print? The past, present or future? How about foreign words or place names? We can find “coöperation” in English texts, and “Café” with a French accent is standard in German. On the other hand, in German, the »angular« quotes, are very rarely used on websites although they are the classic form in novels. An “official” character set is very difficult to determine for most languages so in my opinion, a real-world basis (scanning large amounts of text) would make more sense than an academic one. Another difficult question is, what constitutes a language – only letters and letter-like symbols, also punctuation? Are figures part of a language? For example, In most middle-east countries they use “real” Arabic figures whereas in Northern Africa the “Latin Arabic” numerals we use seem to be preferred. How about mathematical punctuation, is that still language-specific, how much of it is “required”? I think this whole thing should not be restricted to letters. What does it help to know which letters I need to satisfy the needs of most of my users, but not the other characters.</p>
      <p>What we really need is the frequency of occurrence for each character in each language, found by a real-world survey. Then we can set a threshold and determine our set of required characters. Or, we can assign a nominal cost to each character, and then work out a tradeoff.</p>
