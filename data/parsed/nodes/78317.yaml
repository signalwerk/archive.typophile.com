    html: |-
      <p>Simon, thanks for the information. CLDR is a great tool, although a bit confuse. I was not aware about it and surely will take advantage of this tip.</p>
      <p>Anyway, use of these data may explain the problems with FontBook.</p>
      <p>First: the list of languages covered by CLDR is still limited. For example, under Z it lists just Zulu, so any support or reference about Záparo, Zapotec, Zarma, Zazaki, Zhuang or Zuni are missed by evaluations based on CLDR.</p>
      <p>Second: CLDR classifies characters as "approved" and "proposed". If FontBook (or any other tool) evalues the language support based only in "approved" (the safer way), it may miss some essential characters. And if it includes "proposed" (aiming a more complete analysis) it would return characters actually not needed. For example: it's known Latin script for Azerbaijani uses Schwa, but this character is not approved in CLDR until now. Thus, evaluation for Azerbaijani support based on CLDR would be inconsistent.</p>
      <p>I'm not saying CLDR is a bad tool – far from that, it's really useful. But it is under development and automated evaluations based on its data (as FontBook does) need to be understood as partial.</p>
