    html: |-
      <p>I hope so. The main 'objects' are script, language, writing system (what you get when you connect a script and a language, and a bit like a CLDR 'locale') and character. So you will be able to see what characters are used for a particular writing system - the main characters as well as auxiliary ones that are used for loan words, etc. We've focused more on characters than glyphs, although you'll be able to post details of glyph variants, cultural preferences, style differences, etc.</p>
      <p>You'll also be able to see what writing systems use a particular character, although the completeness of that answer depends on the completeness of the underlying data, and there is still a <em>lot</em> of that data that doesn't exist yet.</p>
