      <p><cite>.. it should be an algorithm</cite></p>
      <p>It <em>is</em> an algorithm. It could be sort a database of all possible languages, each with a set of glyphs this language needs, and all this algorithm needs to do is to check for each language</p>
      <p>∀(char) ∈ Language</p>
      <p>-- of course it depends on the database how many different "languages" (dialects? idolects?) it contains, and how strict the check is (as perhaps not all <em>possible</em> characters are <em>required</em> for each language). And, of course, "language" itself is a fluent concept.</p>
