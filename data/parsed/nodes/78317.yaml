      <p>Tim, as it <em>seems</em> FontBook does not evaluates the actual font contents but just the codepage declaration (which is arbitrary and may be wrong), the database may be simply a table with languages supported by each codepage. If this is what you need, a good startpoint is <a class="freelinking external" href="http://en.wikipedia.org/wiki/ISO/IEC_8859" rel="nofollow">here</a>.</p>
      <p>If you need more information about languages and alphabets, this <a class="freelinking external" href="http://typophile.com/node/74756" rel="nofollow">thread</a> has some good tips, including a link to Excel table referred above. There are also <a class="freelinking external" href="http://www.omniglot.com/writing" rel="nofollow">Omniglot</a> and <a class="freelinking external" href="http://www.languagegeek.com/" rel="nofollow">LanguageGeek</a> sites. For Latin script, a good general table is published in <a class="freelinking external" href="http://en.wikipedia.org/wiki/Latin-derived_alphabet" rel="nofollow">Wikipedia</a>.</p>
