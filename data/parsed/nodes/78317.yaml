      <p>Instead of setting up one more of the same, why not help Unicode improve CLDR – <a href="http://unicode-inc.blogspot.com/2011/02/unicode-consortium-announces-opening-of.html" target="_blank" rel="nofollow">now that they are asking</a>?</p>
      <p>My impression is that what is missing is a reliable set of characters per language. And I like the idea of having e.g. CLDR as a single source for a variety of locale information. CLDR's approach to classify character sets is an advantage and indicates that they are honest enough to point out "not sure". Applications can chose either approved or proposed sets and ideally would tell users about their choice.</p>
