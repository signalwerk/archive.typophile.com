      <p><em>I did ask for a place where these informations are compiled, but no one know such a site or book.</em></p>
      <p>We're working to change that. <a class="freelinking external" href="http://www.scriptsource.org/" rel="nofollow">ScriptSource</a> is a site dedicated to gathering info on scripts and writing systems. It supports 'tabular' data - lists of scripts, languages, characters, etc. - and the associations between them as well as text+graphics information. It's built on a database designed specifically for this type of linguistic data, and pulls in data from Unicode, the Ethnologue, various international standards (15924, 639-3) and CLDR. Text descriptions, articles, graphics, bibliographic links and even software can be connected to this skeleton of data.</p>
      <p>We're working closely with the CLDR committee, and working on strategies to dramatically expand CLDR data for minority languages. CLDR already contains a huge volume of data in a useful but rather complex system that supports important concepts such as inheritance, but as a result can be tricky to navigate. We hope that ScriptSource can present some of that data in an easier to read format, and serve as a place to collect documentation and data toward further CLDR submissions. We see CLDR and international standards - not ScriptSource - as the long-term repositories of writing system data, but use our site to pull them together and enhance them. </p>
      <p>ScriptSource is currently in testing and being refined for a public release later in the spring. If you're interested in finding our more go to <a class="freelinking external" href="http://www.scriptsource.org" rel="nofollow">www.scriptsource.org</a>. If you want to look at what we have so far and give us feedback drop me a line and I can give you an invitation, especially if you think that you might want to contribute to the site.</p>
