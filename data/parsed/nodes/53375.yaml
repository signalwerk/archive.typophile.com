    <p>Hi,</p>
    <p>If you were to recommend two typography, type design book(s) which will they be?<br>
    I have been searching and searching and probably think to find the better type books out there. but please share yours.</p>
    <p>thank you!</p>
    <p>I own copies of:</p>
    <p>The Elements of Typographic Style<br>
    Thinking with Type: A Critical Guide for Design<br>
    Made With FontFont<br>
    Letter Forms and Design of Eric Gill<br>
    Fred Smeijers - Type Now</p>
