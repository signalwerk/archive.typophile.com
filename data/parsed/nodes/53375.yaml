      <p><em>"In the typography class here in Basel we call her book «Anatomie der Buchstaben» the «Bible». ;) I just don’t know if Designing Type is the English version of it."</em></p>
      <p>Yes, it is. Not to be confused with "Anatomy of a Typeface", which is a different book.<br>
      I'm in the type design class in Zürich, and some of us have the Cheng book in German, some in English, and it looks like it's pretty much exactly the same.</p>
