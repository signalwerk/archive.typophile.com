      <p>Depends on if you want to design typefaces by yourself or just design _with_ typefaces.</p>
      <p>Have look at:<br>
      Designing Type by Karen Cheng<br>
      In the typography class here in Basel we call her book «Anatomie der Buchstaben» the «Bible». ;) I just don't know if Designing Type is the English version of it.</p>
      <p>Also great books, which I didn't find in English editions, are:</p>
      <p>Detailtypografie by Rald de Jong<br>
      Lesetypografie by Friedrich Forssman and Hans Peter Willberg</p>
      <p>Basic Knowledge about the use of typography:<br>
      Typography by Emil Ruder</p>
      <p>Great typographic design books are:<br>
      Type One by Robert Klanten, Michael Mischler and Silja Bilz<br>
      Fresh Type by Andres Janser and Christina Reble</p>
