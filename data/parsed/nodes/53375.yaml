      <p>And if you are looking for the very best book about the history of typography, I would suggest you to learn french and buy "Histoire de l'ecriture typographique" by Yves Perrousseaux. There is simply no english equivalent, and I sincerely pity the non-french speaking for not be able to have access to this wonderful, definitive book. Oh please make an english version.</p>
      <p>dr</p>
