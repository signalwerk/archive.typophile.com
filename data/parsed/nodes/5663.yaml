  html: <p>okay, maybe there's another forum that deals specificaly with OT development, but i haven't got hooked on it yet... so i'll post this one here untill i find a better place to post such questions. <br> <br>so my trouble is this... i'm working on a blackletter that incorporates the long s into the design. what are the rules for using the long s? are they really hard and fast or were/are they up to the discression of the scribe/designer. if i understand correctly the only constant is that the small s is used at the end of words, which leads into my problem... <br> <br>is the best way to incorporate the long s simply to <br><i>sub s by longs</i> in the hlig feature? i've tried <i>sub s' @classX by longs</i> where classX is any letter and this seems to work fine, but when there are two s's at the end of a word this doesn't work as it ends in long s followed by an s and it just looks goofy. <br> <br>anyhow, any help or suggestions would be helpful. thnx in advance.</p>
  html_clean: <p>okay, maybe there's another forum that deals specificaly with OT development, but i haven't got hooked on it yet... so i'll post this one here untill i find a better place to post such questions. <br> <br>so my trouble is this... i'm working on a blackletter that incorporates the long s into the design. what are the rules for using the long s? are they really hard and fast or were/are they up to the discression of the scribe/designer. if i understand correctly the only constant is that the small s is used at the end of words, which leads into my problem... <br> <br>is the best way to incorporate the long s simply to <br><i>sub s by longs</i> in the hlig feature? i've tried <i>sub s' @classX by longs</i> where classX is any letter and this seems to work fine, but when there are two s's at the end of a word this doesn't work as it ends in long s followed by an s and it just looks goofy. <br> <br>anyhow, any help or suggestions would be helpful. thnx in advance.</p>
