    html: <p>Paul,  <br> <br>I don't think it's a good idea to incorporate contextual substitutions of the long-s. Depending on the language used, the rules were very different. So for English, the rules are fairly simple, but for example for German, they aren't. The short s is not only used at the end of words, but also, in compound words, the short s is used where a prefix or a stem ends. For example, in "ansteigen" (because it's "an|steigen"), you would have a long s but in "austrinken" you would have a short s (as it's "aus|trinken"). Similarly, there are special rules for French, or Polish, or other languages that used long s in the past.  <br> <br>Therefore, it's impossible to build a proper universal contextual substitution mechanism. IMVHO, it doesn't make sense to make rules that would only work in one language (e.g. English) but perhaps actually break other languages.  <br> <br>As for the correct form of a ligature long s + short s, I do recommend to look at _well-designed_ sharp s (</p>
