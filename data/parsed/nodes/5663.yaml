    html: "<p>i got it to work just how i wanted to with this: <br> <br>feature hist { # Historical Forms <br> # Latin <br>lookup hist0 { <br>    sub s' @class3 by longs; <br>} hist0; <br>lookup hist1 { <br>    sub longs' s by s; <br>} hist1; <br>} hist; <br> <br>i guess i was too tired to come up with this last nite, i needed some additional help from you, thom. i figgered if using an s_s lig would work this above would work too. <br> <br><i>There are also occasional workshops and stuff at type conferences.</i> <br>Too bad i won't join you all at typecon this year... maybe next! i hope all of you that make it to sanfran this next week have a loverly time while i fly overhead on my way to seattle. ;^)</p>"
