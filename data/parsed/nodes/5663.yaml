    html: <p>The long s substitution should be in hist, not hlig. <br> <br>hlig is really for ct and st ligs. You do however also need a "long s + s" lig, as you have discovered. That might as well go in regular old liga, since if you've already got the long s in there, you want it to be a default ligature. <br> <br>The long s + s ligature is also the origin of the German double s character (eszett). <br> <br>Cheers, <br> <br>T</p>
