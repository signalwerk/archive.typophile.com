  - id: 40334
    user: 1133
    date: 2004-07-20T05:07:00
    date_raw: 20 Jul 2004 — 5:07am
    votes: null
    html: "<p>Paul,  <br> <br>there is no such thing as \"how does the hist feature work anyway\" ;) Application developers may choose several ways to implement the feature.  <br> <br>The OpenType specification:  <br><a href=\"http://www.microsoft.com/typography/otspec/features_fj.htm#hist\" target=\"_blank\">http://www.microsoft.com/typography/otspec/features_fj.htm#hist</a> <br>says that the feature should work as a GSUB lookup type 1, i.e. a simple substitution. This means that contextual substitutions should not be used.  <br> <br>Microsoft's Longhorn OpenType Layout implementation enumerates HinstoricalForms as \"boolean\" so it will be just an on/off function, just like ligatures in InDesign.  <br><a href=\"http://longhorn.msdn.microsoft.com/lhsdk/graphicsmm/overviews/text/typography_ovw.aspx\" target=\"_blank\">http://longhorn.msdn.microsoft.com/lhsdk/graphicsmm/overviews/text/typography_ovw.aspx</a> <br> <br>AFAIK, Adobe InDesign doesn't currently support the \"hist\" feature other than by the Glyphs palette, but may add an \"on/off\" support in future.  <br> <br>It is possible to implement different substitutions rules for different languages. However, (1) the OpenType specification recommends using only GSUB lookup type 1, i.e. simple substitutions (not contextual substitutions) for the feature. (2) As I explained earlier, a properly working contextual \"hist\" feature for many languages would be simply impossible to build, just like a properly working contextual ligatures feature that would substitute \"fi\" or \"fl\" ligatures -- in German, you are allowed to put the \"fl\" ligature in \"anfliegen\" but not in \"auflegen\", because the former is \"an|fliegen\" and the latter is \"auf|legen\". You are not allowed to put ligatures between a prefix and a stem. Supporting this in an automatic way would require dictionary support so it's not really possible to solve it within a font.  <br> <br>Therefore, I recommend implementing the \"hist\" feature just using a simple substitution:  <br> <br>sub s by long <br> <br>and let the user turn it on and off locally where required.  <br> <br>Regards,  <br>Adam <br></p>"
    html_clean: "<p>Paul,  <br> <br>there is no such thing as \"how does the hist feature work anyway\" ;) Application developers may choose several ways to implement the feature.  <br> <br>The OpenType specification:  <br><a href=\"http://www.microsoft.com/typography/otspec/features_fj.htm#hist\" target=\"_blank\" class=\"link-external\">http://www.microsoft.com/typography/otspec/features_fj.htm#hist</a> <br>says that the feature should work as a GSUB lookup type 1, i.e. a simple substitution. This means that contextual substitutions should not be used.  <br> <br>Microsoft's Longhorn OpenType Layout implementation enumerates HinstoricalForms as \"boolean\" so it will be just an on/off function, just like ligatures in InDesign.  <br><a href=\"http://longhorn.msdn.microsoft.com/lhsdk/graphicsmm/overviews/text/typography_ovw.aspx\" target=\"_blank\" class=\"link-external\">http://longhorn.msdn.microsoft.com/lhsdk/graphicsmm/overviews/text/typography_ovw.aspx</a> <br> <br>AFAIK, Adobe InDesign doesn't currently support the \"hist\" feature other than by the Glyphs palette, but may add an \"on/off\" support in future.  <br> <br>It is possible to implement different substitutions rules for different languages. However, (1) the OpenType specification recommends using only GSUB lookup type 1, i.e. simple substitutions (not contextual substitutions) for the feature. (2) As I explained earlier, a properly working contextual \"hist\" feature for many languages would be simply impossible to build, just like a properly working contextual ligatures feature that would substitute \"fi\" or \"fl\" ligatures -- in German, you are allowed to put the \"fl\" ligature in \"anfliegen\" but not in \"auflegen\", because the former is \"an|fliegen\" and the latter is \"auf|legen\". You are not allowed to put ligatures between a prefix and a stem. Supporting this in an automatic way would require dictionary support so it's not really possible to solve it within a font.  <br> <br>Therefore, I recommend implementing the \"hist\" feature just using a simple substitution:  <br> <br>sub s by long <br> <br>and let the user turn it on and off locally where required.  <br> <br>Regards,  <br>Adam <br></p>"
