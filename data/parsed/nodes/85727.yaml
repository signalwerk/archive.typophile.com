      <p>As In recall, the term "Pro" came about years ago in the early opentype era when Adobe was retro-fitting their legacy fonts with the old "Expert sets". The name was pulled out of the thinking that the only people who ever used the Expert Sets were design or publishing professionals.  It was also only 3 letters long.<br>
      Several years ago, I was asked by SoTA to write an article for their supposedly annual "Interrobang" publication on OpenType.  They never published it for some mysterious reason which I have ever been privy to.  Part of it addressed the "Pro" question.  I will try to dig up the old file and post the "pro" related part of it here if anyone is interested.</p>
    html_clean: |-
