    html: <p>I do not think that we can. We do not share standard encoding files, or in some cases, even agree on what glyphs constitute support for languages. And trying to create standards will no doubt attract advocates for constructed and fantasy languages like Esperanto and Klingon, which are of questionable use at best, and do not necessarily have orthographies that have been agreed upon by users. Then there will be the nationalist arguments over the names of certain languages claimed by bordering nations. I expect that the hassle would mean only a few designers would even see the process through, and plenty more will just ignore it.</p>
