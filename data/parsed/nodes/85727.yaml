      <p>Okay... I built it! This is the system I plan to use going forward.</p>
      <p>Everyone is welcome to use, in-part, or as a whole. I think it's elegant and all-inclusive. Easy to understand and expand on.</p>
      <p>'Font names' remain as short in length as possible, and offer a lot of information about what is contained in font.</p>
      <p>I personally, do not think that adding a brief description of weight or 'body proportion' is needed, but others may want to add this as well. I think that the 'user' will quickly get the idea, by the numbers alone, if font is 'regular weight', or 'condensed', or 'expanded' by the numbers alone. Maybe, down-the-road, we can start to drop this reference in order to minimize the font names still further. Anyway, a good start. General consensus, please?</p>
      <p>——————————————<br>
      TypeFaceName 53 Cd Rm<br>
      TypeFaceName 54 Cd It</p>
      <p>TypeFaceName 55 Rm<br>
      TypeFaceName 56 It</p>
      <p>TypeFaceName 57 Exp Rm<br>
      TypeFaceName 58 Exp It<br>
      ——————————————</p>
      <p>All the other weights (in the family) can be numbered as indicated above.</p>
      <p>25 Ult Thin<br>
      26 Ult Thin It</p>
      <p>35 Thin<br>
      36 Thin It</p>
      <p>45 Lgt<br>
      46 Lgt It</p>
      <p>65 Med<br>
      66 Med It</p>
      <p>75 Bld<br>
      76 Bld It</p>
      <p>85 Blk<br>
      85 Blk It</p>
      <p>95 Ult Blk<br>
      96 Ult Blk It</p>
      <p>—————————————</p>
      <p>These other 'useful' acronyms can be concatenated to end of 'font names':</p>
      <p>Small Caps= 'Sc'<br>
      Old Style Figures= 'OsF'<br>
      Sm Caps &amp; OsFigues= 'ScOsF</p>
      <p>Display= 'Dsp'<br>
      Caption= 'Cpt''</p>
      <p>Swash= 'Swh'<br>
      Ornamental Caps= 'OrC'</p>
      <p>Outline= 'Out'<br>
      Inline= 'Inl'</p>
      <p>Stencil= 'Stn'<br>
      Graffiti= 'Grf'</p>
      <p>Optical Axis (Large x-height)= 'Lxh'</p>
      <p>If anyone can think of any others, we can add to this list.</p>
      <p>I'm not sure about adding acronyms for 'extended language' support.</p>
      <p>But, that can easily be done... example...</p>
      <p>Central European= 'CE'</p>
      <p>Greek= 'Grk'</p>
      <p>Cyrillic= 'Cry'</p>
      <p>etc...</p>
      <p>Looking forward to everyones opinion on the subject. Thank you all.</p>
    html_clean: |-
