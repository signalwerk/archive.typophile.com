      <p>&gt;As I understand the original Adobe use of Pro, it was a font with some CE latin support. Some mistook that for meaning a font had rich typographic OT features, others took it to mean non-latin support.</p>
      <p>As I remember, 'Pro' was used to imply that the OT font had 'some' additional OT features incorporated into it to distinguish from other standard fonts. The only way a user could find out 'what those features' where, was to use the font and poke around to see what OT features where available from within an application.</p>
      <p>The 'Pro' at the end of font name meant nothing. Some understood it to mean 'Professional', whatever that means.</p>
      <p>Anyway, that's the whole problem with the way we all name stuff. Myself included. We are all guilty of this practice.</p>
      <p>I was hoping that at least within the 'typophile' group, we could all discuss the entire 'font naming' structure and come up with guidelines that we can all follow. At least, come to some sort of general consensus, and try to clarify what all these terms should mean.</p>
      <p>If we don't, who will?</p>
      <p>Here is previous link with some of my other concerns. Thank you.</p>
      <p><a href="http://typophile.com/node/88327" title="http://typophile.com/node/88327">http://typophile.com/node/88327</a></p>
