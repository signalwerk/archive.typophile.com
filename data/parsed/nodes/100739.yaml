  html: |-
    <p>Hi all</p>
    <p>I know this is a long shot but is there a macro or method to create glyph components from a mask. I have a large italic font, the accents glyphs were made up from components of the base glyph and accent. These glyphs have been mistakenly decomposed but I need them as components. I could generate the glyphs again with Glyph &gt; Generate Glyphs… , this would give me the components but the accents would be the wrong places. Any ideas.</p>
