    html: "<p>You might try this: Per each glyph, select the outline which you want to convert into a component and then choose \"Contour &gt; Convert &gt; Selection to Component\". If you use the shortcut for this, and also use a shortcut for \"Next Glyph\" (go to \"Tools &gt; Customize\" which has a search box) to quickly switch from one glyph to the other, you can revert to components with not too much work. I have done this a few times in the past. (I don't understand the mask part. Does \"Tools &gt; Mask &gt; Swap Outline with Mask\" help? Again \"Tools &gt; Customize\" allows you to assign a shortcut.)</p>"
