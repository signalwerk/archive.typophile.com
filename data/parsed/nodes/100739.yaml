    html: |-
      <p><cite>Per each glyph, select the outline which you want to convert into a component and then choose "Contour &gt; Convert &gt; Selection to Component".</cite></p>
      <p>Just a note: you can't select the whole glyph, say eacute, run the routine above, and wind up with two components. You have to run the routine on each component, selected separately.  </p>
      <p>Done this way, a change to either of the components will be reflected in all the composites based on it. </p>
      <p>Example: if you want to change the *e* glyph and all the e-accent glyphs, then <strong>if</strong> all the e-accent glyphs are composites, the change to the base glyph will reflect that change in all of them. The same thinking if you want, say, to change the length or thickness of a macron diacritical. The po0sitioning of each component will (essentially) remain.</p>
      <p>Given most text editing and layout software today, as long as authors use Unicode's precomposed accented characters rather than a base character and a combining diacritic, this becomes an important tool.</p>
      <p>Edit:</p>
      <p>Actually, since most font publishers -- including the major ones such as Adobe and Monotype -- don't bother with the combining diacritics, authors aren't to blame for not following the Unicode consortium's stated preference...</p>
