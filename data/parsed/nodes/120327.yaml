  html: |-
    <p>Hej guys, I'm a graphic design student from germany and I have found a beautiful font used in a dutch interior architecture magazine called FRAME. I'd love to know how this beautiful typeface is called and where I can purchase it. It has some neat features, for example the minor »r« has a dot-shaped terminal, the minor »t« has that interesting figure. I would be greatful if you could help me out, here. Thanks in advance :)</p><div class="imageWrap"><img src="http://typophile.com/files/humanist_touch_grotesque_3815.jpg"></div><p></p>
    <div class="field field-type-text field-field-solved">
          <div class="field-label">Font:&nbsp;</div>
        <div class="field-items">
                <div class="field-item odd">
                        Circular LL        </div>
            </div>
    </div>
