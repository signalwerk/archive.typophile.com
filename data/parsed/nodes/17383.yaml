    html: |-
      <p>• lacks subtlety &amp; detail</p>
      <p>• for grunge to be convincing it has to look detailed and natural. As it is your grunge finish looks contrived and phoney</p>
      <p><em>I also distressed it a little bit, to make it look like it is from the pages of an old book.</em></p>
      <p>• a "modern-looking serif" that "look[s] like its from the pages of an old book"? (scratching head) That makes it contradictory and hard to justify as in terms of style and appeal. A lot of designers won't see the sense in the combination.</p>
      <p>• you really need to define the purpose of the design. What kind of subject matter or context would it be used for?</p>
      <p>• ask yourself, "Does the world really need a grunged-up Eurostile with ad-hoc serifs?"</p>
      <p>• serif positions and the lack of authentic humanist/antiqua features won't please most roman type buyers (when in Roma, do as the Romans do)</p>
      <p>Best regards<br>
      j a m e s</p>
