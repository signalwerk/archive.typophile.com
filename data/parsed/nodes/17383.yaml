  html: |-
    <p>I'm a student studying graphic design at algonquin college. I am currently trying to develop my first font, and was hoping to get some comments on what I have so far. I wanted to make a modern looking serif, so i modeled the curves after Eurostile, condensed it, and added some serifs. I also distressed it a little bit, to make it look like it is from the pages of an old book. I want to make sure that my font doesn't look too much like eurostile.</p>
    <p>Any comments would be much appreciated.<br>
    Thanks.</p>
