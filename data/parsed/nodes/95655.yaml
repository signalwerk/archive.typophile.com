    html: |-
      <p>Some of the swashes (particularly at the top of the 'S' were a manual alteration to whatever the original typeface was. But I can't find anything that matches even the basic letters. Some current fonts from the Victorian era with a possibly similar feel include:</p>
      <p>Zinco (Solo) = Zinc Italian (Spiece Graphics) = Sevilla (Gophmann)</p>
      <p>Hasta La Pasta NF (Nick Curtis) = Gramophone ITC = Sturbridge Twisted (Intecsas)</p>
      <p>Cardinal (Steffmann) = Wedlock (Solo)</p>
      <p>Filibuster (Nick Curtis)</p>
      <p>Acadian (Scriptorium)</p>
      <p>Raphael (Adobe)</p>
      <p>Houghton (Many sources) = Edisson = Edison  = Edison Swirl = Potsdam</p>
      <p>Koster,  Nymphic,  Templar (Solo)</p>
      <p>and more </p>
      <p> - Herb</p>
