      <p>well the basis of my argument is “why-design for a reason”- which is some of the breakthoughs i have been pushing lately. if there is no justified reason for what is being done based on the content, then it shouldn’t be done. the troubles i have root from them not understanding the designed interpretation of their content. For instance, there was a story about funding the left ( what everyone knows but noone will say) in our last issue, so I chose the font Heathen (<a href="https://web.archive.org/web/20081120083406/http://www.myfonts.com/fonts/canadatype/heathen/" title="http://www.myfonts.com/fonts/canadatype/heathen/">http://www.myfonts.com/fonts/canadatype/heathen/</a>) and noone understood and thought it would be non-legible. I used larger similar swashes and swoops on the page as graphic elements that complemented the font- and they asked if i should put money signs in them. eventually, i won the argument.<br>
      I will definitely grab some other magazines that have similar styles and whatnot to the looks and feel i am trying to achieve, but its not easy, as they always refer to other lefty publications (which don’t have the greatest design either) oy.</p>
