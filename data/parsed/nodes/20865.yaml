    html: |-
      <p>Picking your battles is key. If they perceive you as difficult or a prima donna they will be resistant to your ideas whether they are good or not. You may have to concede on smaller points in order to make your larger points and preserve good relations. I always had to teach my design assistants this fact, which runs counter to the idea that you should never compromise your design aesthetic. Fact is, you work for them.</p>
      <p>Another tip - put in something you know they’ll want to change so you can give them that right away. My old boss for example hated green (how do you hate a color???) so I’d put something green in there to let him feel like he was top dog.</p>
      <p>Nothing is more frustrating than “I just don’t like it” or “it’s not there yet” but it can be hard to get non-designers to be more specific than that.</p>
      <p>You can show them mags like Rolling Stone or Entertainment Weekly (altho in truth I haven’t looked at them recently..) which do wildly creative designs in the well but stick to their formulas for the front and backmatter. I don’t think it matters if they are in different genres.</p>
