    html: <p>Conversation about common goals would be my suggested route. Focus on the goal/s and think about how your design idea might ( or might not ) achive it/them. Explain what you think the weakness of the current solution is - beyond ’it sucks’. Think about the con side of your idea/s too. Sometimes change for it’s own sake is expensive &amp; does nothing. Change needs to be justified. And what Dan said.</p>
