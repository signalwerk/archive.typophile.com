    html: <p>thanks- see, we have an issue critique next week and i am presenting how the design has changed and where i would like it to go in the future- i work for IN THESE TIMES magazine (<a href="https://web.archive.org/web/20081120083406/http://www.inthesetiems.com/" title="www.inthesetiems.com">www.inthesetiems.com</a>) and before I got on board, their design was terrible. I have redesigned basically everything since then, but sometimes I feel like we can go farther with some of the layout- stray from the branded magazine style with our features/culture pieces- and this last issue i fought tooth and nail for it- and I won that battle. its just hard telling someone, no, this will work, just because you haven’t been exposed to certain things doesn’t mean they are bad... yada yada. i just fear future design arguments- and want to have a really compelling argument next week during the critique. thanks for any ideas and suggestions!</p>
