  - id: 130663
    user: 13221
    date: 2006-06-22T13:15:00
    date_raw: 22.Jun.2006 1.15pm
    votes: null
    html: |-
      <p>as for the Helvetica problem... </p>
      <p>Make a mockup of some project but make it really badly. Then duplicate the mockup but change the font to something like univers or Akzidenz Grotesk or whatever you want to use. (something closer to helvetica would be easier) *Also modify the new layout to make it the one they will choose!</p>
      <p>Then you give it to the decision makers and ask which one they like better. (Or if they know less you can ask which type they like better.) They will probably assume you are talking about the layout difference (not even noticing you changed the type) and (hopefully) choose the one with the font you want to use!</p>
      <p>Just get them to sign off on it so when you start using your font you will have their signature to fall back on ;)</p>
