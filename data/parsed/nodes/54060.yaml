    <p>I'm sure this must have come up before here on Typophile, but I'm not sure even how to google this topic, so I'm starting a fresh discussion. (If you can find an old one to point me to, I'd be glad to read that too) So here's the question:</p>
    <p>What is a better term (if any) for Non-Latin scripts without using 'non' or 'Latin' to qualify them? I typically think of 'other' scripts as 'exotic', but I feel that maybe even that is a bit ethnocentric. Is there a solution to this dilemma?</p>
