      <p>Paul, I wonder if the CNN solution might work. They refer to everything as "International" and then label each country by name, the US, France, China, etc. Usually by 'International' CNN means non-American, but it's sufficiently flexible as to not alienate non-American viewers by calling them 'foreigner' in their own countries. It seems to work pretty well.</p>
      <p>Incidentally I heard that CNN will fine a newscaster if they use the word 'foreign' instead of 'international'. </p>
      <p>So International Scripts, and then Latin, Greek, Arabic, Chinese, etc. Then if you want to you can label groups positively: European scripts (Latin, Greek, Cyrillic), East Asian (CJK), South Asian, Semitic, etc. Also if you know you are discussing with other native readers of a particular script, I don't see anything wrong with non-latin, non-cyrillic, etc.</p>
