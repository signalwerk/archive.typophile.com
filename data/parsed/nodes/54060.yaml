      <p>I started out doing fonts in the Latin script, although I didn't think of them as such -- I just produced the standard encoding in my neck of the woods, at the time.</p>
      <p>When Adobe started bundling fonts with Greek and Cyrillic characters, I decided to give it a try (not the bundling!)<br>
      My relationship with the Greek and Cyrillic scripts has become too intimate for me to think of them as "non-" anything, they are Greek and Cyrillic. </p>
      <p>At the ATypI conference in St Petersburg, I realized on numerous occasions that many of the Russians I was speaking with about type knew far less about the "exotica" of Cyrillic than I had recently learned, for instance, its history, and non-Russian Cyrillic characters, such as the Big Yus that Maxim had persuaded me to include in my fonts--one fellow though it was a funny looking Zhe.<br>
      Another young designer thought the 19th century form of lower case "p", with its forked extenders, was unusable today: a good understanding for me to have, but I explained to him that an authentic revival shouldn't have anachronisms--so this is the same situation I face in my own script culture, where there is often a tendency to compromise otherness, to make it more acceptable to convention.</p>
