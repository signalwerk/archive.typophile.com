      <ul>
      <li><em>I typically think of ‘other’ scripts as ‘exotic’, but I feel that maybe even that is a bit ethnocentric.</em></li>
      </ul>
      <p>‘Other’? Other than what? ‘Exotic’... (‘bizarre’? ‘weird’?). Are you joking? ‘Peculiar’ is another great way to define them non-Latins:<br>
      </p><dl>
      <dd>‘As we have divisions of mankind, so we also have similar divisions among letters. In general, type faces take five forms, as follows: Gothic, Roman, Italic, Block and Script. These five are the basis of all type faces, except in those languages like Hebrew and Russian, which have peculiar styles of their own.’ [<em>A Manual of Style, Containing Typographical and Other Rules for Authors, Printers and Publishers, Recommended by the University of Chicago Press, Together with Specimens of Type</em>. Chicago: The University of Chicago Press, 1949.]</dd>
      </dl>
      <p></p><p>I personally find the above entry to the Chicago Style Manual unbeatable.</p>
      <ul>
      <li><em>In fact that “non” can be a great motivator.</em></li>
      </ul>
      <p>Definition by the absence of something is hardly reliable. Besides, there is always something disparaging about such definitions. Unfortunately, that was the pattern for centuries: infidel, non-white, un-american, unchristened, sans-culotte, etc.</p>
      <ul>
      <li><em>I’m curious, do speakers of, say Russian, refer to types as non-Cyrillic?</em></li>
      </ul>
      <p>I do, on occasion.</p>
      <ul>
      <li><em>Is there a term that groups the Cyrillic-Greek-Latin triad of scripts?</em></li>
      </ul>
      <p>I use ‘LGC’ (cf. ‘CJK’).</p>
