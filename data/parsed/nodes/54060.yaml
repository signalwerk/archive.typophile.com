      <p>Charles: <em>you could say “scripts that do not use the Latin alphabet.”</em></p>
      <p>I don't see what one gains from such an awkward formula. In any case, I would only use the phrase ‘the Latin alphabet’ to refer to the subset of letters used to write the Latin language and their order (as I refer to the English alphabet or the Finnish alphabet, etc.). What we call the Latin script would be better called the Roman script, but ‘Latin script’ is too ingrained in our usage for even me to try to change it.</p>
