      <p>Because of the way in which I work, and the way in which Tiro is organised, I'm blessed not to have to worry about such terminology: we do multiscript type design, and Latin is just one of the scripts. The relative importance of one script over another is project-specific, not part of our general outlook. Sometimes, a client needs a typeface in which one script ‘sets the tone’, as it were, for harmonised companions, but we don't have a Latin type department and a Non-Latin type department. It is in the latter situation that I think the term originated. Traditionally, type manufacturers and typesetters alike, in Europe and the Americas, have distinguished between ‘our typography’ and ‘everyone else's typography’, with the latter sometimes referred to as non-Latin and sometimes as exotics.</p>
      <p>Hrant, I don't think using the term non-Latin ever stopped anyone from Latinising a ‘non-Latin’ script. Rather, it maintains a status quo in which the identity of other writing systems are expressed relative to Latin.</p>
      <p>Paul, I would look at it this way: if you find yourself needing a term with which to refer to ‘everyone else’s typography’ maybe you need to reorganise the way in which you work. When you lose the need for such a term, you can be fairly confident that you are treating the typographic citizens of the world as equals.</p>
