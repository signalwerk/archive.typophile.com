    html: |-
      <p>The first thing that struck me is the unevenness of the S. The bottom is pretty round, the top is a bit flattened, and the inner curves are a bit squarish. And the stroke (especially in the bottom half) needs to be smoothed out. It's narrow in the cross bar, then gets really fat, then thins out a bit, then gets a little fatter, then gets thin (thinner than the end at the top, which seems odd).</p>
      <p>The K, even though I see that the lines are vertical, feels like it's leaning to the right. I think because the counter is narrower on the bottom than on the top.</p>
