    <p>Hey guys,</p>
    <p>It's been a while I haven't posted anything here.<br>
    Time to grow back into old habits.<br>
    I'm currently designing this monogram for a photograph.<br>
    This is still a work in progress but I would love your thoughts on this one while I'm trying to build some kinda balance and "excitement" to it.<br>
    Each letter has, of course, been entirely, designed from scratch.</p>
    <p>Many thanx in advance.</p>
