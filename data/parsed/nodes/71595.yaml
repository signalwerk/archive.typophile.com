  html: |-
    <p>At Miura_Lab we like to be at the cutting edge and we actively test and explore new design technologies. With the recent announcement of the Google Font Directory (<a href="http://code.google.com/webfonts">http://code.google.com/webfonts</a>) we thought we would offer a font comparison feature, so designers and developers could test different font variations before implementing them on their sites.</p>
    <p>All fonts offered by Google in the directory are available for use on your website under an open source license and are served by Google servers.</p>
    <p>I'm sure there are big discussions to be had with regards to Googles announcement, but for the moment we thought a nice simple tool could help.</p>
    <p><a href="http://bit.ly/aUDmXn">http://bit.ly/aUDmXn</a></p>
