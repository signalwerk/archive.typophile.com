    html: <p>The image I'm including was made using a font named Flanders Bold. <br>Some of the leading caps are off, but perhaps were modified? Kerning <br>was left as-is. <br><br> <br><img src="http://www.typophile.com/forums/messages/83/20534.gif" alt=""> <br><br> <br>It's copyright reads URW &amp; SoftMaker, 1992. Odd bedfellows to be sure. <br>It seems like all of <a href="http://www.softmaker.de/fonts_en.htm" target="_blank"> SoftMaker's</a> fonts are clones of other's commercial <br>offerings, but URW? I had thought they were legit. Does anyone know <br>the relationship of these two companies, other than that they're both <br>Deutsch? <br> <br><a href="http://www.urw.de/english/home.htm" target="_blank"> URW</a> doesn't offer Flanders, by that name or, as far as I could find, any <br>other. I'll be interested to see if anyone can give another, more legitimate <br>name to this this typeface. <br> <br>I obtained this font via the <a href="http://www.fontsite.com/Pages/OrderForm/OrderForm1.html" target="_blank"> Fontsite CD</a>, which is made up mostly of URW <br>fonts. <br><br></p>
    html_clean: <p>The image I'm including was made using a font named Flanders Bold. <br>Some of the leading caps are off, but perhaps were modified? Kerning <br>was left as-is. <br><br> <br><img src="http://www.typophile.com/forums/messages/83/20534.gif" alt=""> <br><br> <br>It's copyright reads URW &amp; SoftMaker, 1992. Odd bedfellows to be sure. <br>It seems like all of <a href="http://www.softmaker.de/fonts_en.htm" target="_blank"> SoftMaker's</a> fonts are clones of other's commercial <br>offerings, but URW? I had thought they were legit. Does anyone know <br>the relationship of these two companies, other than that they're both <br>Deutsch? <br> <br><a href="http://www.urw.de/english/home.htm" target="_blank"> URW</a> doesn't offer Flanders, by that name or, as far as I could find, any <br>other. I'll be interested to see if anyone can give another, more legitimate <br>name to this this typeface. <br> <br>I obtained this font via the <a href="http://www.fontsite.com/Pages/OrderForm/OrderForm1.html" target="_blank"> Fontsite CD</a>, which is made up mostly of URW <br>fonts. <br><br></p>
