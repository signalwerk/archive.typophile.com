    html: <p>I think 'Flanders' is a clone of Les Usherwood's <a href="http://www.philsfonts.com/detail.html?sku=BQ90106003P1" target="_blank">"Flange"</a>. It comes in 4 weights, with italics. I think this logo was Flange Regular (Book).</p>
