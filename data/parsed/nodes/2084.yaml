    html: <p>Bingo! I'd looked at Flange in a book (Lawrence Wallis' <i>Modern <br>Encyclopedia of Typefaces 1960-90</i> as well as Berthold's PDF <br>catalog, but several characters, notably the A &amp; E didn't match <br>up at all in the book and that PDF is about as useful as the <br>website (not!). Phil's Fonts' sample image gives a much clearer <br>picture. Thanks guys. <br> <br>How did Phil's Fonts manage to retain sales rights? Cool.</p>
