  - id: 16493
    user: 2088
    date: 2003-11-15T13:20:00
    date_raw: 15.Nov.2003 1.20pm
    votes: null
    html: <p>I think Berthold allowed Phil's to continue selling their fonts because it was agreed that the Phil's pricing would be identical to Berthold's. I think Adobe's bundling practices (or lack of it in some cases) meant that Berthold wasn't getting as much control over the pricing as they wanted when the new owners took over Berthold.  Someone else here probably knows the story in better detail, but that's the impression I got from discussions of the Berthold ownership change I have seen in various newsgroups.</p>
