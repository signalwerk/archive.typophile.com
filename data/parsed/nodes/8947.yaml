    html: <p><i>1. Do you feel that this revival is happening in other areas of design e.g. graphic design and typography? If so, what do you think this revival consists of and why is it happening?</i> <br> <br>Graphic Design styles tend to make pendulum-like swings. After the democratic, deconstrutionist early 1990s, "modernism" stormed back into the foreground during the late 1990s, and into the present day. Jeffery Keedy has written interesting essays about this in virtually each of all of the recent Emigre issues (since it switched to the Princeton Architectural Press paperback format). <br>  <br><i>2. Do you think there is a social, economical, political, functional or aesthetical need for the revival of the modernist, functionalist or internationalist ideology in the world today? Why and/or why not? Do we need another fresh start?</i> <br> <br>I think that it is caused by social, political, and economical factors. The world economy is not in as good shape as it was in the late 1990s, or at least, large groups of people seem to be pessimistic about it rather than optimistic. I think that some of the return to Swiss/Internation Style graphics might be a longing for some sort of economic normalness, i.e., not a bad one where people (including graphic designers) loose their jobs or can't find new work. Lastly, not just the United States but also some European countries are becoming more politically conservative (although conservative has a different definition in almost every country), and that might be a factor. I don't know how conservative politicians and business leaders feel about expressive typography, but my gut tells me that they probably prefer the "cleanliness" of the modern style</p>
