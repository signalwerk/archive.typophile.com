    html: <p>Obviously -- and as has been noted by numerous people including Robin Kinross, who wrote the book, literally, on modern typography --, Hrant uses the term Modernism an a way that is both idiosyncratic and  makes an answer to Ragnar's question impossible. If Modernism constitutes the whole of western civilisation from the Romans onwards, what sense is there in talking about a revival? If modernism is understood, as it usually is, as a movement -- or collection of related movements -- in 20th century art, architecture, design and music, with some earlier philosophical origins and precursors in the late Renaissance and Enlightnment, then the question makes more sense. <br> <br>Personally, I don't think there is a revival of modernism in the sense of a revival of the ideas/ideals/ideology of modernism. There are, however, revivals of modernism as a <i>style</i> in a generally expansive and largely unideological post-post-modernism in which anything goes. This is most evident in architecture that employs modernist materials and construction techniques, but does so as part of a more varied cityscape, in which this 'soft modernism' takes its place among other styles. In this context, elements of modernist design or construction may even be repurposed as <i>decoration</i>. Of course, 'modernism as style' is itself contrary to the critical spirit of the best of modernism, and could be seen as the final triumph</p>
