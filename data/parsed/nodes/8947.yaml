    html: "<p>The more I think about Modernism the less I like it, so I was going to refrain from saying anything, but since it's been totally quiet I guess controversy might at least serve as a good catalyst. But I <i>will</i> try to keep it concise. <br> <br>First I should state that my typographic specialty is type design. Not that I'm an expert at it but in the realm of composition I <i>really</i> suck - please take that into account. <br> <br>To me Modernism is a facet of what's most wrong in the West: the naive and arrogant lust for Control. The Romans started it, monotheism helped, the Enlightenment cemented it and now we're at a point where Analysis has overpowered humanity, formalism has trumped communication; the unmeasurable is treated as a weed that needs to be ignored, controlled. <br> <br>In the realm of type it's telling that you can't make a good text font based on the grid, or even modules; but you can make a great display face; and that dichotomy is a great clue: Modernism is concerned with superficial conscious appreciation; it ignores the hidden, nebulous half of human reality, the one that makes life worth living. Modernism causes all kinds of bad design, like encouraging people to make the vertical proportions in multi-ligual type families the same, or keeping the otherwise genial Legato firmly trapped in the realm of constructivism. All this does not make the PoMo hooliganism of the 90s OK. But it does mean that Modernism is totally inadequate of itself for creating things that truly satisfy humans. The most it can be is an expression of transitory cultural values. <br> <br>So please don't revive it. <br> <br>hhp</p>"
