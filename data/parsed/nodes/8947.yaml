    <p>Hello there <br> <br>My name is Ragnar and I am from Iceland. I am writing my thesis on internationalism in typography (International Typographic Style) and would really like to know your thoughts on few matters. Maybe you could point me to articles or other essays to read on these subjects.  <br> <br>1. First I would like to know your thoughts on the revival of modernism. Some say that the revival of modernism is already amongst us in architecture in the form of so called soft-modernism. Do you feel that this revival is happening in other areas of design e.g. graphic design and typography? If so, what do you think this revival consists of and why is it happening? <br> <br>2. Do you think there is a social, economical, political, functional or aesthetical need for the revival of the modernist, functionalist or internationalist ideology in the world today? Why and/or why not? Do we need another fresh start? <br> <br>3. What do you think of typographic design in general today? Do you think that the constructive ideology of the Swiss typography could be ideal for every typographic problem today? <br> <br>4. What are the designer's ethical and social responsibilities regarding legibility and readability and other means of communicating a message today? <br> <br>5. Do you think that modernism/Swiss typography is more "true" in its ideology and approach than other design movements? Why? <br> <br>Thank you very much for your help. <br> <br>Ragnar Freyr P</p>
