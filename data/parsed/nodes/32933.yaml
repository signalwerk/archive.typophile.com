      <p><cite>That said, it would be nice to maybe have some sort of calibration option within the DTP application... </cite></p>
      <p>Quark has had this since I can remember.</p>
      <p>Go to Preferences &gt; Display &gt; Display DPI value, and then put in your actual screen’s DPI, measured with a ruler (my 19” is 120dpi, I imagine all other 19” LCDs are too)</p>
      <p>Then 100% will indeed be 100%!</p>
      <p>I have no idea why this doesn’t feature in other graphics software, in lieu of it being supported in the OS.</p>
