      <p>“I’m wondering when the software companies will get with the program (so to speak) and recalibrate.”</p>
      <p>It’s not a software issue in the sense that the design application can do much about it. It’s an operating system issue. The operating system has no idea how physically big your monitor is, so really has no way of knowing what ’true size’ really is. It has to assume x pixels = x inches even though even monitor is different.</p>
      <p>That said, it would be nice to maybe have some sort of calibration option within the DTP application. Of course, if someone goes and changes your screen resolution, that get screwed up again. ;0)</p>
      <p>“Given this it seems that for wysiwyg we should be working in 96 dpi as a default when preparing p-shop files for the web.”</p>
      <p>All you need to work at in photoshop is where 1 pixel of your image takes up 1 pixel of your screen. I don’t know what photoshop defaults too for that. It maybe 72dpi or 96dpi or (more accurately) maybe it’s just a ’full size’ setting somewhere.</p>
