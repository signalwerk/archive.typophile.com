    html: <p>That meaurement is only right when your monitor is 72 pixels/inch. If the pixels are smaller (higher monitor resolution), everything is scaled down. In practice, this can help you (more pixels are better, right?). But it does mean that those rulers or percentages are wrong;  So you might ignore them completely, since that standard resolution is being replaced or superseded. Unless the DTP app can somehow be told the actual monitor resolution and then calculate the true size, those numbers will be meaningless. If you want to be able to have this “100 percent” view, zoom in until your onscreen page is the same size as the printed page and then save or remember that zoom factor.</p>
