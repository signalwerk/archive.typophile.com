      <p>To calibrate your own monitor, the steps would appear to be quite easy: Simply draw a 6 in. line in your favorite DTP program, and increase the magnification until it is as long as a 6 in. ruler you hold up to the screen. Make note of the resulting magnification percentage and, Bob’s your uncle, you’ve got the return of true WYSIWYG.</p>
      <p>The page below has a good overview of the history of higher and higher resolutions on Apple screens, and a nice table of effective dpi for relatively current Mac hardware. (I’ve been working under the assumption that my PB G4 17” had 96 dpi. Turns out that’s closer to 100 dpi. Who knew? [Well, besides them, smartypants.])</p>
      <p><a href="http://lowendmac.com/tech/pixels.html" title="http://lowendmac.com/tech/pixels.html">http://lowendmac.com/tech/pixels.html</a></p>
