      <p>To make matters more complicated, there is the issue of perceived size. Resolution, viewing distance and even contrast can alter how we perceive scale. Unfortunately, simply altering the zoom level of your on screen document to match the physical dimensions won’t give you an accurate picture of what it will look like, as evidenced by the comment, “the files now look HUGE”.</p>
      <p>I do a lot of work for mobile phone screens that have an effective resolutions anywhere from 72 to 150 dpi. It’s amazing how the visual relationships and hierarchies change when I move things from the 96 dpi computer monitor to much higher resolution phone screens.</p>
      <p>One time we wanted to run some tests on some designs before we had access to the target device, so we printed them out. The designs looked way too small. Oddly enough, though, they looked great on the actual device once we got them on there. Somehow on the bright backlit screen of the device they looked way larger then the print outs, even though they were exactly the same size and resolution at around 150ppi.</p>
    html_clean: |-
