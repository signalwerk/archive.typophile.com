      <p>As long as operating systems don’t know (or don’t care, due to pixel orientated rendering engines) about the physical monitor size, you’ll have to rely on what the apps can provide.</p>
      <p>xPress has a setting for screen resolution. If you enter your real physical resolution, 100% will be what you see is what you get.</p>
      <p>Same you can do with acrobat 7 and 8.</p>
      <p>Indesign and Illustrator don’t have such a setting, and Photoshop doesn’t need one (but please, let’s not discuss on this again :), but there are scripts that help you to get the appropriate zoom level via shortcut.</p>
      <p>How to determine your ppi-screenresolution (example):</p>
      <p>horizontal pixel dimension: 1600<br>
      vertical pixel dimension: 1200<br>
      diagonal screen in inches: 21” (measure this exactly!)</p>
      <p>determine diagonal pixel count:<br>
      sqrt(1600² + 1200²) = 2000</p>
      <p>get the pixel number for one inch:<br>
      2000px/21” = 95,2 = 95ppi</p>
      <p>If you enter this number to xpress or acrobat, you get wysiwyg at 100% zoom.</p>
