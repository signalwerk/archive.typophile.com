      <p>Actually a search tells me it is supported in Acrobat 7. Not in any other Adobe apps though.</p>
      <p><cite>100% in inDesign and Illustrator means 1 pixel on screen for every point on the printed page. That’s where 72 DPI comes from, isn’t it?</cite></p>
      <p>That’s kind of backwards... The Postscript point was defined as 1/72 inch, so to display 1 pixel per point on early DTP systems the screen was designed to be 72dpi. So at least to start with, it all worked fine.</p>
      <p>Oh and I have come across a couple of resolution independent UIs - one is the open source 3d app Blender (<a href="http://www.blender.org/" title="http://www.blender.org/">http://www.blender.org/</a>) where all the menus and dialogs are scalable vectors. Some Linux front ends (probably not correct terminology) already have scalable vector icons.</p>
      <p>Windows 95-2000 (and beyond if you use the Classic visual themes) used fonts to render window controls - the minimise, maximise and close icons, resize handles, etc were all in a Truetyoe font called Marlett.</p>
      <p>But I digress.</p>
