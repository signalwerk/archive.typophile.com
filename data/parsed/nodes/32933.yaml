    <p>I have a relatively new iMac and I’m noticing on this screen that viewing a document in either Quark or InDesign at 100% is quite misleading. In fact I pulled out a ruler and figured out that viewing a doc at 137% gives me accurate size. Of course I print things out to really check my font size etc but I’m wondering when the software companies will get with the program (so to speak) and recalibrate. I still have an old CRT monitor where the files now look HUGE but are in fact more accurately sized at 100%.</p>
    <p>This also hearkens to the earlier (endless) conversation about dpi’s relevance to the web. Conclusion of course that the term “dpi” is irrelevant, it’s pixels we’re dealing with, but I remember the conversation turning to whether to work in 96 vs 72 dpi. 96 is 133% larger than 72 - which is pretty close to my Quark mark-up. Given this it seems that for wysiwyg we should be working in 96 dpi as a default when preparing p-shop files for the web.</p>
