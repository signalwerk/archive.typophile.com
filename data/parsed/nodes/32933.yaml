      <p>“I’m wondering when the software companies will get with the program (so to speak) and recalibrate.”</p>
      <p>As far as Mac OS X is concerned, resolution independence will be built into Leopard, expected this June. From Apple’s Leopard developer pages (<a href="http://developer.apple.com/leopard/overview/" title="http://developer.apple.com/leopard/overview/">http://developer.apple.com/leopard/overview/</a>):</p>
      <p><cite>The old assumption that displays are 72dpi has been rendered obsolete by advances in display technology. Macs now ship with displays that sport native resolutions of 100dpi or better. Furthermore, the number of pixels per inch will continue to increase dramatically over the next few years. This will make displays crisper and smoother, but it also means that interfaces that are pixel-based will shrink to the point of being unusable. The solution is to remove the 72dpi assumption that has been the norm. In Leopard, the system, including the Carbon and Cocoa frameworks, will be able to draw user interface elements using a scale factor. This will let the user interface maintain the same physical size while gaining resolution and crispness from high dpi displays.</cite></p>
      <p><cite>The introduction of resolution independence may mean that there is work that you’ll need to do in order to make your application look as good as possible. For modern Cocoa and Carbon applications, most of the work will center around raster-based resources. For older applications that use QuickDraw, more work will be required to replace QuickDraw-based calls with Quartz ones.</cite></p>
      <p>Indeed, there is some resolution independence already in 10.4 Tiger. Geek out below:<br>
      <a href="http://developer.apple.com/releasenotes/GraphicsImaging/RN-ResolutionIndependentUI/" title="http://developer.apple.com/releasenotes/GraphicsImaging/RN-ResolutionIndependentUI/">http://developer.apple.com/releasenotes/GraphicsImaging/RN-ResolutionInd...</a></p>
