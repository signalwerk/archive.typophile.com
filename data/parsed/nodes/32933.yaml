      <p>That’ a pretty darn good range to choose from, don’t you think? I know they do.</p>
      <p>Monitors sold today have met a standard for reporting their native resolutions and have made it possible (finally) for OS to “do the right thing.” (that being to become scaleable) at the OS level. Shortened, this means if your resolution is 200 or 72, 12 pt is within a pixel of 1/6th of an inch. </p>
