      <p>AFAIK there is now ’easy way to define a shortcut for a particular zoompercentage. Maybe scripting is the way to go, but I’m completely ignorant re that.</p>
      <p>A workaround: Set your main window for a document to the zoompercentage that’s equiovalent to a hundred percent. Use Arrange:New Window to create a new window. That’s going to be in front… Use that for layout and mucking around. Want to see the ’real’ size? Go to original window (now in background), selecting it from the bottom of the Window-menu, or by clicking in a visible part (provided you use a cascade view).</p>
      <p>Don’t forget to close the ’first’ window last when quitting. The last view of a doc is the way it’s shown when you reopen it.</p>
