      <p>I was worried, too, only recently (2 yrs) having finally and (I thought) permanently made the switch to Mac.</p>
      <p>But, then, I thought, the speed and ease of use with the Mac OS comes mainly from the fact that it’s (a) well designed, (b) written for a narrow range of hardware, and, since OS X, (c) on a Unix base. So, as long as they keep all three of these characteristics, and provide some means for helping legacy users make the switch—this will be the real toughie—what does it matter what hardware Apple uses? The processor and the motherboard were the last proprietary hardware holdouts, anyway. (I bracket for the time being the issue of diversity in processor manufacturing; I doubt that Apple will be interested in making sure that its builds of future OSs will run as well on AMD chipsets as on Intel ones.) And the case design won’t revert to beige and black boxes.</p>
      <p>I found a (non-techie) post on a blog on my regular rounds (Crooked Timber) that puts this announcement in perspective pretty well, I think: <a href="http://crookedtimber.org/2005/06/06/apple-switches/" title="http://crookedtimber.org/2005/06/06/apple-switches/">http://crookedtimber.org/2005/06/06/apple-switches/</a>. This should be the permanent link; apologies if I screwed it up. (the Internets are pretty confusing sometimes.)</p>
