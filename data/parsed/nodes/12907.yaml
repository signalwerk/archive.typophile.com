      <p>Disclaimer: I actually know something about CPU architecture.</p>
      <p>For 90% of Mac users, it won’t make much difference whether the CPU is PPC or Intel. What distinguishes the Mac is the operating system. OSX will still be robust, offer a nice user experience, and not collect spyware and viruses like Windows.</p>
      <p>New versions of actively maintained software will just have to be recompiled; you won’t see much difference. Older, legacy software will run in an emulation layer; if all goes well, it’ll just be slower. Of course, there will be times when all does not go well.</p>
      <p>People debate the relative merits of the PPC and Intel architecture until they’re blue in the face, but there’s not that much practical difference. In areas where one had the edge (the G4 with its Altivec instruction set), the other caught up (SSE2 is as good; I know, as I’ve ported my vector-optimized inkjet halftoning code to both architectures). What does matter is the multibillion dollar investment Intel is putting into making a variety of chips across their product line, including cool-running laptops (Pentium M) and powerful server chips. It also helps that Intel has AMD nipping at their heels and keeping them honest. Apple was held hostage by PPC chip manufacturers (Motorola with the G4, IBM with the PPC970 = G5) who didn’t really need Apple’s business and weren’t willing to invest enough. In the case of the G4, the clock speed is stuck at a small fraction of what’s available in the rest of the world, and in the case of the PPC970, IBM wasn’t willing to do the engineering to make a low-power, laptop friendly version of the chip.</p>
      <p>Farther down the road, it’s hard to say what the implications will be. Apple plans to only ship OS X on their branded hardware, but in reality their gear won’t be any different than a beige box. Indeed, the Darwin kernel at the heart of OS X already runs on commodity Intel gear. Count on hackers to port the rest of the OS X runtime. I can’t say now whether this will remain a curiosity, or will cross over to being a mainstream alternative, just as all serious gamers now mod-chip their X-boxes.</p>
      <p>Overall, while this move signals the end of the era where aesthetics of computer architecture counted one whit, compared with the inexorable power of money, I see it as a good thing. Since Apple will be selling the exact same hardware as Dell, they will be forced to become price-competitive. Meanwhile, Mac users will actually get laptops with decent raw compute power, which otherwise would never have happened. There will probably be some adjustment pains, but when that’s over, I bet Apple will pick up another point or two of market share, which is absolutely necessary if for no other reason than to keep Microsoft honest.</p>
      <p>(oh, and not to flame-war, but current Intel chips are definitely not laughable. A 3.6GHz Pentium 4 delivers about 1700 base CINT2000 Specmarks, compared to about 986 for a 2.2GHz PPC970; it’s hard to get real benchmark data for the PPC architecture because Apple doesn’t seem to participate in the official Spec benchmark process; even the 2GHz Pentium M clocks in at a very respectable 1528. In the arena of raw processing power, Intel beats PPC hollow in price/performance, and that gap is likely to widen).</p>
