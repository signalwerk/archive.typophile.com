      <em>Meanwhile, Mac users will actually get laptops with decent raw compute power, which otherwise would never have happened.</em></p>
      <p>That’s what I’m looking forward to.</p>
      <p>Some are speculating that Apple will solely focus on the operating system and get out of selling boxes. I don’t think that’s true. Jobs killed the cloning business because the Mac clones were suffocating Apple profits (this was a move to not only stay in the hardware business, but keep it exclusive to Apple). Then again, that was 1997 or something.</p>
      <p>Others are speculating (and this is where I think it gets interesting) that Apple  wants an Intel chip because, unlike IBM, Motorola or AMD, Intel is supposedly close to a chip that will handle digital rights management (DRM). Doing so would put Apple in position to continue to dominate media on the desktop in the age of DRM.</p>
      <p>In the end, what I like about Apple hardware is that I can buy one and bring it home and never have to crack it open (if I don’t want to). What plagues Windows is having to be compatible with every device manufacturer. It’s Windows’ strength and it’s main weakness - being that open leaves room for incompatibilities, security holes and viruses.</p>
