      <p>&gt; I remember a time when there was no PowerPC inside.</p>
      <p>But it was still Motorola - the same people who now make the PowerPC! In fact back then both Motorola and Intel were making CISC (not RISC) chips, so they were architecturally closer! The main practical advantage Motorola had back then was in math (think 3D rendering), while the main advantage it has now is power-efficiency (think laptops).</p>
      <p>And it’s not a matter of short-term performance, but long-term platform issues: Will Apple eventually start making only -or mainly- software? And gadgets?</p>
      <p>hhp</p>
