      <p>Lacrima doesn't have a way to see all the letters, so it's hard to be sure. Part of my thinking is also that American Typewriter is way more well-known and has been around for a long time, while Lacrima is found only at a small Swiss web site. P22 Remington doesn't seem to match very well, judging from the 'c' and 'a' shapes in the italic. I'm putting my money on the ITC font (with distortion).</p>
      <p> - Mike Yanega</p>
