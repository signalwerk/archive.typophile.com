  html: <p>Im designing a magazine for a school project and Im looking for a good text face to use throughout. The mag is on stylish nightlife which includes fashion, music, and trendy bars and clubs around the world. I want the face to be very clean and look fresh.  <br> <br>Faces I have been playing around with include news gothic, franklin gothic, din, and monotype grotesque. Theyre all great faces and Im sure I'd do fine with any of them. I am just wondering what newer faces are out there that compare to these faces, especially as far as readability is concerned. Thanks!</p>
  html_clean: <p>Im designing a magazine for a school project and Im looking for a good text face to use throughout. The mag is on stylish nightlife which includes fashion, music, and trendy bars and clubs around the world. I want the face to be very clean and look fresh.  <br> <br>Faces I have been playing around with include news gothic, franklin gothic, din, and monotype grotesque. Theyre all great faces and Im sure I'd do fine with any of them. I am just wondering what newer faces are out there that compare to these faces, especially as far as readability is concerned. Thanks!</p>
