    html: <p>&gt; Body &amp; Soul <br> <br>I just checked it out. Alfon seems to work really well - better than what your (any?) website conveys. They should really use it for the whole thing, and dump that ridiculous Johnston for text. My only complaint with Alfon's Roman is that it's a bit light (or is that from their repro?), but then I realized that the whole magazine's look is light, so it's a great fit. As for the Italic, I really like it a LOT structurally -very progressive- but I do worry that it's a bit too close to the Roman for emphasis - just a bit. Great stuff overall! <br> <br>hhp <br></p>
