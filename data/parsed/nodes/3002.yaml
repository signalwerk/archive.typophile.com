  - id: 23872
    user: 1250
    date: 2004-02-06T12:57:00
    date_raw: 6 Feb 2004 — 12:57pm
    votes: null
    html: "<p>I'd certainly love to see some long text set in Priori - it's one of those borderline text faces that needs to be seen in action to know for sure. A similar case is Emigre's \"Tribute\": when I first saw it the \"g\" raised a flag, but I had to see it in actual setting to be sure that it is indeed too problematic, especially when doubled. Borderline glyphs aren't so bad when they're in a font with many of them, but when there's one single \"spike\" it reduces the overall utility of the font with little gain in personality/focus. In the case of Priori the \"a\" seems to be such a spike to me - a little too far beyond the \"envelope\" made by the rest of the font, especially when you consider it's such a common letter. <br> <br>hhp <br></p>"
    html_clean: "<p>I'd certainly love to see some long text set in Priori - it's one of those borderline text faces that needs to be seen in action to know for sure. A similar case is Emigre's \"Tribute\": when I first saw it the \"g\" raised a flag, but I had to see it in actual setting to be sure that it is indeed too problematic, especially when doubled. Borderline glyphs aren't so bad when they're in a font with many of them, but when there's one single \"spike\" it reduces the overall utility of the font with little gain in personality/focus. In the case of Priori the \"a\" seems to be such a spike to me - a little too far beyond the \"envelope\" made by the rest of the font, especially when you consider it's such a common letter. <br> <br>hhp <br></p>"
