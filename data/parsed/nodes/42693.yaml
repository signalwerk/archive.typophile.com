      <p>great name. the name alone would catch my eye, so you're home free !</p>
      <p>just a few quick thoughts : the scribble is nice but very dense - it could block up in certain media and might benefit from cheating those spaces a little bigger.</p>
      <p>the formality of font vs. concept could work but these fonts look formal to me as much as they conjure the kindler, gentler pseudo-formality brought into play with these styles (officina, etc.) in the last decade or so...  casual fridays fonts.<br>
      very useful style but possibly too familiar for this.</p>
      <p>i'm not as well versed in fonts as most folks here but i would suggest going MORE formal, to really push the tongue-in-cheek irony. high classical, or over-the-top decorative, or old world. might not work w/ the scribble, tho.  what about scribbling the font, precisely bounded as if within a stencil ? just a thought.</p>
      <p>or : did you try a more surprising combination of fonts ? not so much "ransom note" but more quirky, an out-of-place combo of two styles ? this was much abused in the 90's, i know, but somehow i think these words could support it with some experimenting.</p>
