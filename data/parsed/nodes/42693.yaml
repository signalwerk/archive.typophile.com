    <p>Hi all,</p>
    <p>My brother and I are planning on doing some creative work together... for fun initially. Later on we may try to sell merchandise like t-shirts, posters, etc. </p>
    <p>The name brilliant nonsense has been floating around in my brother's head for years. I liked it so we've decided to use it for our collaborative work.  I've been charged with coming up with a logo. Originally we were focused on doing a crest but I wasn't really loving the direction. Later I decided to try scribbling... playing off of nonsense. I scribbled and scribbled and then combined a few. We both really liked the one you see here.</p>
    <p>Now I am trying to pair the logo with type and I need some help. All of the fonts here have the feel I'm looking for, but the more I look at the word brilliant the stranger it looks to me...something about all those i's and l's in a row. I'm thinking the 2nd and the last may work better for this word. What do you think? Is there a better font for this? I've also been wondering if a formal serif might be interesting...contrasting the playfulness of the name with the formality of type. I may have to try that.</p>
    <p>I welcome all comments. Your help is greatly appreciated.</p>
