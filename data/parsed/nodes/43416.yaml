    html: <p>I like the use of Dolly, but the lower-case "i"s are throwing me off. They could potentially work with the serifs cut off, but the extra tight kerning around them doesn't help. Usually I think logotypes should be more integrated with their icon if there is one, but in this instance I would rather see her name in just plain dolly and then create an "i" icon that mirrors some of those shapes.</p>
