    html: |-
      <p>@Feelthekern. Yeah the kerning doesn't have to be that tight. I can definitely give it some room to breath as there is no reason why its that tight currently. It's a rough draft so i'll definitely boost up the tagline.</p>
      <p>@all The big "i" could be indeed all of those, as many speaker use mics and lecterns. Currently it's wanting to double as a mic and symbolically a person. The lowercase "i"s were modified from the microphone in the middle and carry over the same stem width as the original characters.</p>
      <p>What i'm wrestling with is how much to keep and how much to kill. I'd be perfectly happy with a simple word mark and the tagline, but i felt like something a bit more interesting needed to happen as many word marks rely on simple twists, otherwise its just Dolly and Bryant. Since i wouldn't want to take much away from the beauty that is Dolly, even the line connecting two people would be possibly symbolic enough in the context of speakers connecting with the listeners. Though is that too simple or just enough?</p>
      <p>If it helps her current audience types are primarily young African American girls and secondly a broader range of young people.</p>
      <p>So many options to choose from. I'll see if i can work out a more hand crafted mic, lectern, person icon that matches Dolly. Other thoughts are most welcome.</p>
