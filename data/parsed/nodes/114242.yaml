    <p>Hi there, </p>
    <p>I have a client wanting to redesign a magazine, including fonts for body text as well as headers, callouts, etc. What is the best way to compile and show, on paper, what different fonts look like in print? I'm finding that some foundries have PDF samples of text, but others and MyFonts don't, so not sure what the best strategy would be. Any resources you recommend?</p>
    <p>Thanks so much for your help.</p>
    <p>-Ella</p>
