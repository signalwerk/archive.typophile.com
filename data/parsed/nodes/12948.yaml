    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a>: <a href="/wiki/Foundries" class="freelinking" rel="nofollow">Foundries</a>: NIMX</strong></p>
    <p>NIMX was the brainchild of Dallas-based designer <a href="/wiki/Calvin%20Glenn" class="freelinking" rel="nofollow">Calvin Glenn</a>. NIMX typefaces were distributed direct as well as through several prominent resellers such as <a href="/wiki/Image%20Club" class="freelinking" rel="nofollow">Image Club</a>, <a href="/wiki/EyeWire" class="freelinking" rel="nofollow">EyeWire</a>, <a href="/wiki/Adobe%20Studios" class="freelinking" rel="nofollow">Adobe Studios</a> and <a href="/wiki/ITC" class="freelinking" rel="nofollow">ITC</a>. Calvin is currently the Marketing Manager at Oracle.</p>
