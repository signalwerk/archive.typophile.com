      <p><em>...the Greek Unicode range include Coptic too, I don’t know how many modern Greek typefaces include the latter.</em></p>
      <p>When Greek and Coptic were first encoded in Unicode, the common letters were unified in the Greek block, e.g. Greek alpha = Coptic alpha, etc. And the Coptic letters that are not part of the Greek alphabet were encoded in the same block. Later, Unicode accepted that they had made a mistake, and that it would be better to encode Coptic independent from Greek, so the new Coptic block was added (2C80-2CFF) to disunify the common letters; however, the other Coptic letters remained in the Greek block, because that would present fewer problems for software makers than trying to deprecate those codepoints and move the characters to a new block.</p>
      <p>Every once in a while, I get a request from a client who wants to support the entire Greek Unicode block. I can usually talk them out of supporting the Coptic letters in the Greek block, unless they intend to support the Coptic block too. However, one client did insist that I make the Greek block Coptic glyphs, even though they were not supporting Coptic and only because they were included in the Greek block. Sometimes software developers want simply to know with 100% certainty that a font supports all the assigned codepoints in a given Unicode block.</p>
