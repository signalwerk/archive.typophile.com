    html: |-
      <p>As a minumum, I recommend supporting all the characters that are part of the Windows and Macintosh Arabic 8-bit codepages. These ensures backwards compatibility, and ensures that you are supporting all the basic characters necessary for the three largest language groups using the script: Arabic, Persian and Urdu.</p>
      <p>If you want to support additional languages that employ the script, then you need to support more of the 0600 Unicode range, and perhaps the Arabic Supplement range (0750). You can either aim for complete language coverage or you can research the needs of individual languages and support the characters for these. If there are particular languages that you are interested in supporting, but are unsure about what characters you need, let me know and I can probably help you.</p>
      <p>You do <strong>not</strong> need any Presentation Form codepoints, although the decorative parentheses are useful as you've already discovered. You do not need ligature characters or positional form characters, because these can all be handled using OpenType Layout substitutions based on the 0600 range characters. The Presentation Form characters are only included in Unicode for legacy reasons, and can generally be ignored.</p>
      <p>Note that there is an Arabic Special Interest Group forum on Typophile:<br>
      <a href="http://typophile.com/forum/366" title="http://typophile.com/forum/366">http://typophile.com/forum/366</a></p>
