      <p>The longer version is: what is the target for the your typeface?<br>
      I'm not familiar with the arabic script, but I'll cite some examples in which you could choose <em>not</em> to include the full character set.<br>
      Latin script:<br>
      - a display face could include only uppercase letters.<br>
      - a text face aimed at Western Europe/USA most likely would not include glyphs needed for Eastern Europe scripts.<br>
      - a text/display face intended only for "modern" use will not include historical forms like the long "s".<br>
      Cyrillic:<br>
      - if the market is just Russia, it could not include ukrainian-only letters.<br>
      Greek:<br>
      - the Greek Unicode range include Coptic too, I don't know how many modern Greek typefaces include the latter.<br>
      Japanese:<br>
      - a face intended for children would include Hiragana, Katakana, and probably latin characters, but only a subset of, if any, Kanji.</p>
