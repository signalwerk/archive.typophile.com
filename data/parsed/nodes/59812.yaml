      <p>Heh. First feedback received on the Hebrew:</p>
      <p>"Oof. What's there sticks out badly. I think you should use script letterforms. Or even print ones that look more hand-drawn; these don't to my eye. Even the text color is off; it's much lighter than the surrounding paragraphs. Script can look denser."</p>
      <p>He's right. Back to the drawing board for the Hebrew.</p>
      <p>Michael Everson<br>
      evertype.com</p>
