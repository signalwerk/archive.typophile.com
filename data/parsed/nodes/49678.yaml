      <p>&lt;self-promotion&gt;</p>
      <p>The <a class="freelinking external" href="http://www.kentlew.com/WhitmDisOverview.html" rel="nofollow">Whitman Display</a> fonts were developed originally for newspaper headlines. (Minneapolis Star Tribune commissioned the initial styles.) The x-ht/extender proportions are a little more classical than some other recent news headletter styles and might be an easier transition from Garamond (if that's important).</p>
      <p>The fonts haven't yet been put up for Retail download on Font Bureau's website, but they are available for license by contacting FB directly. </p>
      <p>You can see samples at my site: <a href="http://www.kentlew.com" title="http://www.kentlew.com">http://www.kentlew.com</a>. </p>
      <p>Also, there's a PDF showing available (not linked on the site) here: <a href="http://www.kentlew.com/Type/WhitmanDisplay_Sample.pdf" title="http://www.kentlew.com/Type/WhitmanDisplay_Sample.pdf">http://www.kentlew.com/Type/WhitmanDisplay_Sample.pdf</a></p>
      <p>&lt;/self-promotion&gt;</p>
      <p>-- Kent.</p>
