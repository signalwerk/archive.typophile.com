    html: <p>A formal analysis of the character shapes makes me believe  <br>the logo is custom designed, or at least customized. The "fr"  <br>ligature is very uncommon (only one typeface I know of has it),  <br>the left side of the "u" fits snugly against the "r", the top left  <br>serif of the peculiar "v" follows perfectly the movement of the  <br>tail of the "f" into the foot serifs of the "r", while its swash fills  <br>the gap between the "r" and the "u" perfectly, and both "e"s  <br>are designed in such a way that they "perform" flawlessly.</p>
