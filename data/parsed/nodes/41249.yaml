      <p>Whaddaya know, FontHaus is now selling all the Image Club fonts. Here is <a class="freelinking external" href="http://www.fonthaus.com/products/fonts/view.cfm/sku/MI415591" rel="nofollow">East Bloc Closed</a>. There is an alternate version and two equivalent lined versions.</p>
      <p>[edit: hmmm, I guess they are getting them from Monotype, which also has this font. For some reason I thought Monotype had offloaded the Image Club fonts after having them for a while. Apparently they just decided they didn't need to be the exclusive vendors.]</p>
      <p>- Mike Yanega</p>
