    html: <p>The Dover Victorian font book/cd font may very well have the lowercase. I found <a href="http://store.doverpublications.com/0486999599.html" target="_blank">this</a> on the Dover site. If you click to get a close up of the cover, you will see they did the title of this book in Grant Antique, upper AND lowercase. Unfortunately, the Victorian font book doesn't seem to be on this site.</p>
