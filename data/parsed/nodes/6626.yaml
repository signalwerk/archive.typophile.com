    html: <p>Acording to <a href="http://216.109.117.135/search/cache?p=luc+dover+books+cd&amp;ei=UTF-8&amp;n=20&amp;fl=0&amp;u=cgm.cs.mcgill.ca/%7Eluc/fontbooks.html&amp;w=luc+dover+books+cd&amp;d=057E9B4853&amp;icp=1&amp;.intl=us" target="_top">Luc Devroye Site</a> (scroll down to Doverpress) Grant Antique <br>is in the  Dover's <a href="http://store.yahoo.com/doverpublications/0486999564.html" target="_top">Victorian Display Fonts CD</a>, and if you zoom to the cover you'll see it in the second line. <br>The question is if it comes with lowercase, maybe. Why don't you send them an e-mail?</p>
