    html: <p>There's one very similar to it in Photo-Lettering's <i>Alphabet Thesaurus Vol. 2</i> called Xenotype 3719. Not that it would be much help in this case. If you need to reproduce these exact characters, your best bet might be to redraw the just the ones you need based on this scan. The cent sign looks like it's a "c" from a different font.</p>
