    html: <p>Just a follow-up, and wanted to thank Mike Freiman, who sent me email and pointed out two excellent digital versions of Grant Antique. The first is Sheridan Gothic by Spiece Graphics <br><a href="http://www.myfonts.com/fonts/spiecegraphics/sheridan-gothic-sg/" target="_blank">http://www.myfonts.com/fonts/spiecegraphics/sheridan-gothic-sg/</a> <br>The second is Refugio by Nick's Fonts <br><a href="http://www.myfonts.com/fonts/nicksfonts/refugio-wbw/" target="_blank">http://www.myfonts.com/fonts/nicksfonts/refugio-wbw/</a> <br> <br>Here's the finished replica of the old card that started this thread. It's Sheridan Gothic from Spiece Graphics, my own version of DeVinne, FF Zapata, and Old Times American from Baseline Fonts.  <br> <br><img src="http://www.typophile.com/forums/messages/83/48775.jpg" alt="Grant solution"></p>
