    <p><strong> The Exhibition</strong><br>
    René Braginsky has compiled his spectacular collection of Hebrew manuscripts over a period of more than three decades. It includes medieval documents, artfully prepared wedding contracts, richly illustrated scrolls, illuminated manuscripts, and rare prints.</p>
    <p>The collection is characterized by a particular connection between text and art, as these Hebrew scriptures were often decorated with very elaborate illustrations. The focus is on illustrated manuscripts that originated in central and northern Europe of the 18th century showing high points of Jewish manuscript art. All the major Jewish calligraphers and illuminators of the period are represented with outstanding works in René Braginsky’s collection.</p>
    <p><a href="http://www.jmberlin.de/main/EN/01-Exhibitions/02-Special-Exhibitions/2014/braginsky.php" title="http://www.jmberlin.de/main/EN/01-Exhibitions/02-Special-Exhibitions/2014/braginsky.php">http://www.jmberlin.de/main/EN/01-Exhibitions/02-Special-Exhibitions/201...</a></p>
    <p><strong> The Design</strong><br>
    Ink as the origin of calligraphy — the creation and hence the basis of the Hebrew script. The ink evolves into a calligraphic letter aleph, which is the first letter in the Hebrew alphabet. The image shows development, formation and movement and — in a very aesthetic way — the beauty and the origin of the Hebrew script culture.<br>
    Design: Langesommer (<a href="http://www.langesommer.de/" title="http://www.langesommer.de/">http://www.langesommer.de/</a>)</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/jm_einladung_web_5407.jpg"></div><p></p>
