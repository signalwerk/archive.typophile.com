      <p>Hi Ben, you can do it in FontLab and even preview it (shamefully I do not remember how to do it, but I remember that it's pretty easy).</p>
      <p>And by 'someone' perhaps you mean me, right? The innovations in Kazuraki is that this is the genuinely proportional Japanese font made for the first time, whose engineering is actually much less straightforward than you think. The implementation of vertical ligatures was also something that nobody had done on a commercial level. Just read the first half of this (or at least the first page) if you want more detail:<br>
      <a href="http://www.adobe.com/content/dam/Adobe/en/devnet/font/pdfs/5901.Kazuraki_Tutorial.pdf" title="http://www.adobe.com/content/dam/Adobe/en/devnet/font/pdfs/5901.Kazuraki_Tutorial.pdf">http://www.adobe.com/content/dam/Adobe/en/devnet/font/pdfs/5901.Kazuraki...</a></p>
      <p>Hrant, thanks for your kind comments. Quadraat Headliner seems to create a very thin line when typeset vertically (I assume we're talking about upright vertical as opposed to rotated). As for horizontal proportion, I think the character needs to be relatively uniform in width so that one-stem characters (I, i, l) do not thin down the line too much. Japanese newspapers use vertically-condensed typefaces and set vertically, just like the western papers use horizontally-condensed ones, but whether a vertical Latin text in the former proportion looks good or not, I do not know (maybe interesting to try setting Univers Expanded vertically).</p>
