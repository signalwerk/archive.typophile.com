      <p>If I work on a typeface with a Japanese typesetting in mind, I would definitely do it. It doesn't harm to have a vertical metrics, and for most letters it can be automated; just apply the same metrics to the letters on the same height line. Also it's very important to align all characters at the central axis. Better yet, make vertical alternate (valt) letters for J and Q!</p>
      <p>Shame that non-Japanese version of InDesign doesn't do vertical setting while Illustrator and even Photoshop can do it.</p>
