      <p>Akira's home country is Niigata, not Kyoto. On the other hand, Kunihiko was actually born and raised in Kyoto. You should get in touch with him (just google his name to get a contact). He is very active in Japan and has done many jobs with Type Project (famous for Axis typeface) and Jiyu Kobo (Hiragino). Also Kunihiko was the gold prize winner of the Morisawa type competition in the Japanese category.</p>
      <p>Upright vertical Latin (particularly the lowercase) typesetting is ugly to begin with, but here's my thought. A good vertical Latin can only be found in Japan, but even then it is kinda difficult to find. What makes a good vertical Latin type is the presence of vertical metrics which you can only find in Japanese fonts. Also the short ascender and descender helps a lot (you'll see why when you set the word "typography" vertically; the ph creates a huge, unpleasing counter shape). I think one of the following fonts are good in that sense, although I cannot confirm it now: Axis, Hiragino, Kozuka, Meiryo.</p>
      <p>By the way, I'm another Japanese designer. A Reading graduate and type designer at Monotype UK (but haven't released any retail font yet), but since I wasn't born in Kyoto and don't work in Japan, perhaps I don't count.</p>
