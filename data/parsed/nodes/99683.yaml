    <p>I design a magazine, each issue is about a specific city. Previous issues have included Sarajevo, Detroit, London and Athens. The next city is Kyoto. I am trying to get in touch with any type designers who live and/or work in Japan, preferably Kyoto. Do you know of anyone? Do you know of any great examples of typefaces produced in Japan (that are Latin/Roman etc not Kanji/Hiragana etc.)</p>
    <p>I'm also currently investigating whether stacked/vertical type would be a suitable alternative to regular horizontal type. Can anyone recommend any interesting monospace/unicode faces that would make for a pleasing vertical stack?</p>
    <p>Any help or opinions on Japanese type please get in touch! thanks. Feel free to email me here: <a href="mailto:hello@luketonge.com">hello@luketonge.com</a></p>
