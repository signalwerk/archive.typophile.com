    html: |-
      <p>I guess you're problem is related to the way font families were merged and linked into one suitcase in the OS 9 days.<br>
      Try this to hopefully solve the problem: find your original font files (with separate suitcase files for each variant) and use those.<br>
      Or else use Font/DAMover (a Classic app!) to split up the faulty font suitcase(s) into separate suitcases for each subfamily.</p>
