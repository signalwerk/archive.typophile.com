  html: |-
    <p>Has anyone had any problems with Quark 6.5 and Linotype's FontExplorer?  I'm having an issue where only part of a set of fonts becomes active in Quark.  The complete set is available in Illustrator and InDesign, but not Quark.  What's up with that?  And I'm using Quark because my client requires it, so I must figure this out.</p>
    <p>Many thanks.</p>
