    html: |-
      <p>If your problem is with a OpenType font — that issue has been covered before (and in other forums as well). Here's the gist of it: older versions of Quark do not support OpenType-faces. Only the first 256 or so glyphs are recognized. Solution: update to QXP 7 or go the Adobe route (InDesign rocks!).<br>
      Possible solution: do not use OTF but only PS (with Expert-sets).</p>
