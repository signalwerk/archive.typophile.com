    <p>Hello everyone,</p>
    <p>I wonder if there was an outline operation available in fontlab to round the corner of a form as Xtream path does in illustrator… I saw that the bold operation have a "rounded corner" option. But I would like to make the round corners without bolded the glyphs.</p>
    <p>thanks</p>
