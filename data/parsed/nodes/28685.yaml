    html: |-
      <p>You could start your hairline weight as an unstroked path.<br>
      However, the "Expand path" command is a little cranky.<br>
      I've found that it's necessary to "Break Contour" at every point before expanding, in order to get a smooth effect, and even then some clean-up is required after "Merge contour".<br>
      If anyone knows of a better way....</p>
