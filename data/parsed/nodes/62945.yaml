    <p>I'm trying to get a typeface that exudes an 80's pop style.. Which one do you think is the best out of the three in this image... <a href="http://onenine90.deviantart.com/art/80s-typography-139685261" title="http://onenine90.deviantart.com/art/80s-typography-139685261">http://onenine90.deviantart.com/art/80s-typography-139685261</a><br>
    the bottom type of the image: I couldn't find a font that closely resembled the typography in this (in terms of the shape, not colour): <a href="http://www.deviantart.com/users/outgoing?http://www.ljplus.ru/img4/k/i/killacat/tb_logo_transparent_500.png" title="http://www.deviantart.com/users/outgoing?http://www.ljplus.ru/img4/k/i/killacat/tb_logo_transparent_500.png">http://www.deviantart.com/users/outgoing?http://www.ljplus.ru/img4/k/i/k...</a> so had to draw it myself. Does it pretty much look like the same typeface/style?</p>
    <p>Any help is greatly appreciated (especially constructive criticism)! Thanks!</p>
