      <p>I like it. It looks fresh and there are some nice ideas behind it.</p>
      <p>But you dont have to look at the letters itself but at how do the letters look in combination with others. The u and w for example looks really good but they dont fit in a word.<br>
      </p><div class="imageWrap"><img src="https://web.archive.org/web/20150124124109im_/http://typophile.com/files/fluid-u_5415.jpg"></div><p></p>
      <p>Look how much whitespace you get when typing those letters.    </p>
      <p>The same problem appears to be in the r. Below the halfcircle is too much space.     </p>
      <p>The lower horizontal bar of the t is too short    </p>
      <p>Bye: Steven</p>
    html_clean: |-
