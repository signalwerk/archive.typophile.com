      <p>Thanks for the comments!<br>
      Yeah, someone else recently pointed "Modula" out to me as well.  I will take a look at this font and use it as a guide to sort of try and get my font to the end of illustration stages.</p>
      <p>Steven: Yeah, I think some of these charecters would require soem hardcore manual kerning...  the L and the U, for example, could be kerned to the point where the bottom of the L and the tail of the U merged together.  In fact, this is somewhat my intention with this font.  Making some of the charecters merge together and flow in a "fluid" way.  Does that make sense?  But yeah, I totally see your point and can imagine the trouble it could cause for some.  </p>
      <p>Scott Craig<br>
      <a href="https://web.archive.org/web/20150124124109/http://www.cancerbox.com/" title="http://www.cancerbox.com">http://www.cancerbox.com</a> | http:www.cancerbox.com/photoblog</p>
