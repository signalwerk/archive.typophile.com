      <p>'Fluid' sure reminds me of '<a href="https://web.archive.org/web/20150124124109/http://www.emigre.com/EF.php?fid=107" target="_blank" rel="nofollow">Modula</a>', by Zuzana Licko.<br>
      <em>( Well, I like it, but I just wanted to make sure that you 'know' about / are aware of 'Modula', as well. Maybe looking some more, and closer, at 'Modula' and its details, you can get some hints for your type design. )</em></p>
      <p>The characters that would slightly bother me are the 's', because it just doesnt quite fit in with the others and sure seems quite 'cut up'; and the 'e', maybe try to slightly lower the crossbar.</p>
      <p>Dav</p>
