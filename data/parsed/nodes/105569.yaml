    html: |-
      <p>To answer my own question - Select Window/Panel/Editing Layers - pop-up window will appear. There are many boxes one can show, snap or LOCK! E.g. all layers, outline, guidelines, hints, masks, etc… UNCHECK "LOCK OUTLINE" THE 3RD BOX IN THE 2ND ROW, unless you really for some reason want to disable ALL the EDIT TOOLS.<br>
      Mensch! These new computers with their supersensitive touch pads can make you go crazy - I totally wasn't aware I had this box checked! Anyhow - problem solved - by myself - comme d'habitude!</p>
