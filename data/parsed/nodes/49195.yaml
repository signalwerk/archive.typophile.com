  html: |-
    <p>Well, this is an account of the way I understood the retchoso binding method, as described <a href="http://homepages.nildram.co.uk/~dawe5/bookbinding_pages/BB_welcome2.html">here</a><br>
    Maybe someone more expert than me can correct me if I’m wrong, otherwise you can find an explanation of rather simple way to bind a multisection book that open very flat that can be useful to bind your own notebook.</p>
    <p>I started preparing the signatures and making the holes for sewing. Then I started sewing from the central signature in that way (red dashed lines are when the thread is <em>inside</em> the signatures)</p>
    <p> </p><div class="imageWrap"><img src="/files/retch_1_4007.gif"></div><p></p>
    <p>Then when I reached one side I made returned toward the central signature and continue sewing until I reached the back of the book</p>
    <p></p><div class="imageWrap"><img src="/files/retch_2_5498.gif"></div><p></p>
    <p>And I returned back to the central signature where i stopped making a knot</p>
    <p></p>
