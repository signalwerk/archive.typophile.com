      <p>In Goudy’s own words: </p>
      <p>“I have the four-volume edition of Claudin’s _Monumental Histoire de l’Imprimerie en France au XV et XVI Siecle_ in which the introduction is set in a large letter (about 24-point according to modern measurements) which was attributed to Claude Garamond (1540). I made the drawings from this type.... I suggested the name “Garamont” instead of “Garamond,” as that name would show at once that it was a Monotype face, not to be confused with the faces of othes concerns also following the same source. The name was found by me in _Notice sur les Types Etrangers du Specimen de l’Imprimerie Royale_ about the type “attribuait a Garamont.....”</p>
      <p>But thanks for bringing this up. I have to reprint a book I published in 1986 from repros of the metal Garamont, which I no longer have. I didn’t realize this face was part of the P22 Lanst<!--
