    <p>A question: I have been fiddling around with the Tyopwiki page for <a href="/web/20081014051136/http://typophile.com/wiki/Garamond" class="wiki">Garamond</a>. One thing I tried to do was to divide “Garamonds” into “based on Claude Garamond”, “based on Jean Jannon”. On the authority of Bringhurst and Morison I had <a href="https://web.archive.org/web/20081014051136/http://www.p22.com/lanston/products/garamont.html"> LTC Garamont</a> as Goudy out of Jannon, and have so classified it. But P22’s Lanston website (linked above) says it was based on Garamond’s types of 1540 ... which would make it a Claude. I don’t have a decent sample, but my inclination would be to say that the Jannon attribution looks right, as well as being historically plausible.</p>
    <p>Have I got it wrong? Or have P22/Lanston? I don’t want to “correct” the Wiki and make it worse.</p>
