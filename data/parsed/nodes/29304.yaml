      <p>It seems to have a lot of similarities to Bernase Roman, but there are many differences too. The most obvious differences are the e, g, and y. Image Club used to have a version of this, and it was also shown in the 'Homage to the Alphabet' book from Phil's Photo. It had an alternate 'a' like your sample, and many of the other letters are very similar, including the 's' and 'c'. I will scan the sample and post it in a few minutes.</p>
      <p>- Mike Yanega</p>
