      <p><a href="http://www.typophile.com/node/4835">This thread</a> discussed Trooper and showed a sample of it that matched this posted Report font. It also mentions FontBank <a href="http://www.buyfonts.com/value_for_money/talon.htm">Talon</a>, which I have and that's why it looked so familiar.</p>
      <p>Oh the designers were not the same, apparently. 'Bernase Roman' was designed for ITC by Tom Carnase and Ron Bonder; 'Trooper Roman' was done by Dave Trooper, according to Mark's information. I have to say somebody was 'inspired' by somebody -- those have too many similarities. </p>
      <p>- Mike Yanega</p>
