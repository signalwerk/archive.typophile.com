      <p>Oh, since I did scan Bernase Roman, here it is. The only digital version of Trooper Roman I could find was ParaType's <a href="http://www.paratype.com/pstore/fonts/Troover.htm">Troover</a>. The ParaType version does not use all the same alternates that were used in the posted sample, but the full typeface is also shown in the 'Homage to the Alphabet' book. It would take a bit to restart my computer so I can make the scan and then post it again, but I would do that if anyone want's proof (Yves).</p>
