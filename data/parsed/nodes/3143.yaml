  html: <p>The following font was identified as Shelley Andante. (I'm only sorry that the sample, which by the way is from 1979, is of such a reduced size.)  <br> <br><img src="http://www.typophile.com/forums/messages/83/26564.gif" alt=""> <br> <br>The caps, obviously not as Shelley Andante's though, had me going for a better match, which brought me first to <a href="http://www.myfonts.com/fonts/bitstream/embassy/" target="_blank"> Embassy</a>, and later to <a href="http://www.myfonts.com/fonts/agfa/atflorentine-script-ii/" target="_blank"> Florentine Script II</a>... (The "s" has me going for Florentine Script II over Embassy...) Still, I'd very much appreciate the opinion of you, thank you so much.</p>
