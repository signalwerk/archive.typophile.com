    <p>From A to Z... all the letters are on <a href="http://www.planet-typography.com/" target="_blank" rel="nofollow">Planet typography</a>.</p>
    <p><a href="http://www.planet-typography.com/" target="_blank" rel="nofollow">Planet typography</a> is a portal dedicated to typefaces and typography which proposes a comprehensive directory of links, a webzine which introduces the most famous contemporary type designers (in the October issue, Jonathan Hoefler, designer of Hoefler text), a typographic manual, a bookshop and a section dedicated to the freeware creation.</p>
    <p>The site was launched in 1999 and is edited by a typo addict (but who does not work in the graphic design industry). Its target is to educate type users (all of us who have a computer) to the art of type creation and to vulgarize its unknown art.</p>
    <p>A new version has been launched in October.</p>
    <p>URL: <a href="http://www.planet-typography.com/" target="_blank" rel="nofollow">www.planet-typography.com</a></p>
