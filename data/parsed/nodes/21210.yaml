    <p>Hey all,</p>
    <p>I'm organizing a visit for this coming Fall (2006) in NYC, with a small group of my Montréal designer friends. </p>
    <p>Could you recommend places to visit in regard to graphic design? Museums, galleries, bookshops, ...</p>
    <p>THX!</p>
