      <p>The New York Public Library always has interesting exhibitions. Currently you can feast your eyes on a Gutenberg Bible and check out a show of "French Book Art/Livres d'Artistes: Artists and Poets in Dialogue":</p>
      <p><a href="http://www.nypl.org/research/calendar/exhib/hssl/hsslexhibdesc.cfm?id=411" title="http://www.nypl.org/research/calendar/exhib/hssl/hsslexhibdesc.cfm?id=411">http://www.nypl.org/research/calendar/exhib/hssl/hsslexhibdesc.cfm?id=411</a></p>
      <p>Not sure what will be around in the Fall, but the building is well worth visiting regardless of what is on view. </p>
      <p>The Morgan Library houses many objects of interest to designers including a handful of Gutenbergs and illuminated manuscripts. The space itself is, again, well worth the visit:</p>
      <p><a href="http://www.themorgan.org/" title="http://www.themorgan.org/">http://www.themorgan.org/</a></p>
