      <p>The BEST bookstore in the country (IMHO) is Strand Books, on the corner of Broadway and 12th Street. There's a huge art section on the second floor.</p>
      <p><a href="http://www.strandbooks.com/home/" title="http://www.strandbooks.com/home/">http://www.strandbooks.com/home/</a></p>
      <p>I used to live a block away and spent many, many afternoon perusing the reviewers' hardcovers (50% off!). Now that my visits are much fewer and far between (it's one of the few downsides of living in California) I load up on all the irresistible art and type books my bank account can bear, and then arrange for Strand to send them to my home. They don't charge sales tax on the books if you do this, and the postage is pretty cheap. (I don't know if it's as good of a deal when they ship to Canada though.)</p>
      <p>The Cooper Hewitt Design Museum has pretty good exhibitions. You might want to see if the show that's happening in November is of interest to you.</p>
      <p><a href="http://ndm.si.edu/" title="http://ndm.si.edu/">http://ndm.si.edu/</a></p>
      <p>New York is fantastic; art and inspiration is all around. Have a wonderful visit!</p>
