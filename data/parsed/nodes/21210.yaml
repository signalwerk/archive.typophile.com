    html: <p>Coney Island is always worth a visit for any fan of lettering and signage. If you're in town early enough in the Fall, you may still find most of the stalls and rides in and around Astroland open on the weekends. Aside from all the older signage that's still up, an organization called the <a href="http://www.creativetime.org/programs/archive/2004/dreamland/new/" rel="nofollow">Dreamland Artist Club</a> has been working on a project for the last few years to have artists and designers paint and build new signage for the businesses on the boardwalk. The results are super fun!</p>
