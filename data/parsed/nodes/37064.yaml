  - id: 226912
    user: 19337
    date: 2007-09-13T18:55:00
    date_raw: 13 Sep 2007 — 6:55pm
    votes: null
    html: <p>I've never had to do a layout like that. Both Quark and InDesign will allow it easily enough. I don't think the app I use (InDesign CS) would let me create two separate master text frames on the master page, so I'd probably make a master text frame for one of the parallel text flows, and flow that one automatically. For the other I'd create an ordinary master page text box and flow the text manually.</p>
