  votes: null
  html: '<p>I want to format a document such that the top portion of the page contains the primary text, the lower portion a "sub" text running in parallel throughout (the lower portion to be set in a slightly different but clearly related font). Is there a word-processing application that will allow me to work on what are essentially two different documents, on one and the same screen/page? Ditto for DTP software: is there an easy way to flow two separate text files in parallel across an identical page range?</p>'
  html_clean: '<p>I want to format a document such that the top portion of the page contains the primary text, the lower portion a "sub" text running in parallel throughout (the lower portion to be set in a slightly different but clearly related font). Is there a word-processing application that will allow me to work on what are essentially two different documents, on one and the same screen/page? Ditto for DTP software: is there an easy way to flow two separate text files in parallel across an identical page range?</p>'
