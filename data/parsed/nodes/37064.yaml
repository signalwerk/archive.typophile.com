    html: <p>Any DTP app will be able to do this without problem. Trying to do it in a word processor will be agony. <a class="freelinking external" href="http://www.scribus.net/" rel="nofollow">Scribus</a> is a free open source DTP application that will perform somewhat like QuarkXPress.</p>
