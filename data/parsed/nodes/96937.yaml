    <p></p><div class="imageWrap"><img src="http://typophile.com/files/adelle12_4663.gif"></div><p></p>
    <p>We are proud to announce the long anticipated release of the Cyrillic extension for our award-winning typeface <a class="freelinking external" href="http://www.type-together.com/Adelle" rel="nofollow">Adelle</a>. As its Latin sister, <a class="freelinking external" href="http://www.type-together.com/Adelle" rel="nofollow">Adelle</a> Cyrillic is intended for multi-purpose editorial use, providing robustness and personality. To guarantee consistency throughout the two scripts they share proportions, colour and general features without stepping beyond typographic acceptance. Please <a class="freelinking external" href="http://www.type-together.com/info" rel="nofollow">contact us</a> if you own <a class="freelinking external" href="http://www.type-together.com/Adelle" rel="nofollow">Adelle</a> and would like to upgrade to the Cyrillic version. </p>
    <p>More information: <a class="freelinking external" href="http://www.type-together.com/Adelle" rel="nofollow">http://www.type-together.com/Adelle</a>.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/adelle9b_5074.png"></div><p></p>
