    html: <p>Phil, was looking through my old Andresen  (Typographics, in L.A.) catalog and found Firenze and Florence with this type of alternate ampersand. A little less similar, but still in the ballpark are Didoni-Vixen, Mod Caslon and Pistilli Roman. These may or may not exist as digital fonts with these same names today. Good luck hunting. <br> <br> <br> <br> <br></p>
