    <p>i loved Ministry of Type’s post today:<br>
    <a href="http://ministryoftype.co.uk/words/article/studies_in_pen_art/#When:19:00:39Z" title="http://ministryoftype.co.uk/words/article/studies_in_pen_art/#When:19:00:39Z">http://ministryoftype.co.uk/words/article/studies_in_pen_art/#When:19:00...</a></p>
    <p>which led to this beautiful PDF, which you can find in jpg format on the IAMPETH website. <a href="http://www.iampeth.com/books/dennis_pen_art/dennis_pen_art_page19.html">This page</a> makes me think that the names penned are illustrations of different pen styles, probably American. Does anyone care to provide any more information or divulge where i can read more about the various styles?</p>
