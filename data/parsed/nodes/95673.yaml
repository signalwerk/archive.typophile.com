    <p>It appears patently obvious that, with the exception of four individuals known to me, the entire type community is quite content to let the eradication of my brand stand unchallenged: as you wish.</p>
    <p>Nonetheless, I intend to inform the following entities, known to me to have purchased fonts branded with my formerly credible suffix NF, that third parties have either actively destroyed—or passively allowed to be destroyed—that brand, which is my name and my face:</p>
    <p>Microsoft (Xbox)<br>
    Electronic Arts<br>
    Sega Europe<br>
    Hasbro Toys<br>
    Walt Disney Pictures (big black cock!)<br>
    Harper-Collins<br>
    Burger King<br>
    McGraw-Hill (although still pending, so they can get out of the deal)</p>
    <p>The publishers of books and magazines too numerous to mention which have featured my works under my brand name.<br>
    As soon as practicable, I shall have my attorney-in-fact—my kid brother, Tracy Peter Curtis, Esq., J.D.—draft a conciliatory document, offering my condolences that these entities—and any other members of a potential plaintiff class—of the unintended consequences of many third parties’ actions.</p>
    <p>The sole individual who offered to “take my entire type library off of my hands” did not read my post entirely, so you should not expect a reply.</p>
    <p>Thanks to all, and good day.</p>
