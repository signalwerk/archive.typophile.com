    html: '<p>Peter,  <br> <br>FontLab Studio 5 will ship with a ISO 8859-15 codepage definition. What your customer wants is "TT Unicode with the characters from ISO 8859-15 (Latin 9)." This means that the customer wants the glyph repertoire from ISO 8859-15, but not the ISO 8859-15 encoding. The simple difference: an encoding is a set of glyphs with a particular order, while a glyph repertoire is a set of glyphs with no specified order.  <br> <br>That is, the the font is supposed to include all the characters that are covered in ISO 8859-15, but the ordering/encoding should be Unicode.  <br> <br>Go to <a href="http://www.unicode.org" target="_blank">http://www.unicode.org</a>, download the ISO 8859-15 character set definition (in the Unicode data section) and make sure that your fonts includes all characters with Unicodes mentioned in the ISO 8859-15 definition.  <br> <br>Regards,  <br>Adam</p>'
    html_clean: '<p>Peter,  <br> <br>FontLab Studio 5 will ship with a ISO 8859-15 codepage definition. What your customer wants is "TT Unicode with the characters from ISO 8859-15 (Latin 9)." This means that the customer wants the glyph repertoire from ISO 8859-15, but not the ISO 8859-15 encoding. The simple difference: an encoding is a set of glyphs with a particular order, while a glyph repertoire is a set of glyphs with no specified order.  <br> <br>That is, the the font is supposed to include all the characters that are covered in ISO 8859-15, but the ordering/encoding should be Unicode.  <br> <br>Go to <a href="http://www.unicode.org" target="_blank" class="link-external">http://www.unicode.org</a>, download the ISO 8859-15 character set definition (in the Unicode data section) and make sure that your fonts includes all characters with Unicodes mentioned in the ISO 8859-15 definition.  <br> <br>Regards,  <br>Adam</p>'
