  html: "<p>Since I always get confused about encoding &amp; unicode: <br> <br>A customer wants a font delivered TT Unicode with the characters from ISO 8859-15 (Latin 9). <br> <br>Would what I choose in the codepages window in Fontlab make any difference, for instance \"MS Window 12252 Latin 1\" (couldn't find an ISO 8859-15 in the codepages list � it stops at ISO 8859-9)? <br> <br>All the characters/glyphs are in the set (and even some extras) and the right unicode numbers are assigned. <br> <br>I can never understand the difference between encoding, codepages &amp; unicode.  <br> <br>Anyone who has a clue? <br> <br>/peter</p>"
  html_clean: "<p>Since I always get confused about encoding &amp; unicode: <br> <br>A customer wants a font delivered TT Unicode with the characters from ISO 8859-15 (Latin 9). <br> <br>Would what I choose in the codepages window in Fontlab make any difference, for instance \"MS Window 12252 Latin 1\" (couldn't find an ISO 8859-15 in the codepages list � it stops at ISO 8859-9)? <br> <br>All the characters/glyphs are in the set (and even some extras) and the right unicode numbers are assigned. <br> <br>I can never understand the difference between encoding, codepages &amp; unicode.  <br> <br>Anyone who has a clue? <br> <br>/peter</p>"
