    html: <p>I'll simplify things just a little, but.... <br> <br>An encoding is a means of defining which characters are covered by the glyphs in the font, and relating those characters to the glyphs. So in a Unicode encoding the character numbered 20AC is the euro, and in a particular font might correspond to glyph number 571, while in another font it might be glyph 14. (Glyph numbering being simply the physical order of glyphs in the font, the "glyph index.") <br> <br>In a WinANSI encoding, the euro is encoded at (decimal) 128, while in MacRoman, it is encoded at (decimal) 219. <br> <br>A codepage is a defined set of characters, often (though not always) a single-byte set. Virtually always a heck of a lot smaller than all of Unicode. Back in the old days of single-byte fonts, you'd actually use the codepage with the associated encoding. These days, if you're using Unicode encoding, you may still declare which codepages (defined character sets) are covered by the font's total character set. One font can then support several or many codepages. <br> <br>In your particular case, it seems there is no defined Mac or Windows codepage corresponding to the particular character set you are using. I recommend that you claim coverage for codepage 1252 anyway, because if you don't claim any codepage support your font won't show up in the font menu of some common applications (we found that one out the hard way). <br> <br>I hope this helps! <br> <br>T</p>
    html_clean: <p>I'll simplify things just a little, but.... <br> <br>An encoding is a means of defining which characters are covered by the glyphs in the font, and relating those characters to the glyphs. So in a Unicode encoding the character numbered 20AC is the euro, and in a particular font might correspond to glyph number 571, while in another font it might be glyph 14. (Glyph numbering being simply the physical order of glyphs in the font, the "glyph index.") <br> <br>In a WinANSI encoding, the euro is encoded at (decimal) 128, while in MacRoman, it is encoded at (decimal) 219. <br> <br>A codepage is a defined set of characters, often (though not always) a single-byte set. Virtually always a heck of a lot smaller than all of Unicode. Back in the old days of single-byte fonts, you'd actually use the codepage with the associated encoding. These days, if you're using Unicode encoding, you may still declare which codepages (defined character sets) are covered by the font's total character set. One font can then support several or many codepages. <br> <br>In your particular case, it seems there is no defined Mac or Windows codepage corresponding to the particular character set you are using. I recommend that you claim coverage for codepage 1252 anyway, because if you don't claim any codepage support your font won't show up in the font menu of some common applications (we found that one out the hard way). <br> <br>I hope this helps! <br> <br>T</p>
