      <p>&gt;a teacher should know the subject. Duh.</p>
      <p>Hrant, Rousseau's views have been extremely influential in education. He argued at times (he wasn't consistent, but this is the influential bit) that people are all born wise and supertalented and will develop beautifully if only we get rid of adults messing them up. The main consequence of Rousseau's view is that teachers should get out of the way. That a teacher should know his subject is, as you say a big 'Duh', but this very influential view in education contradicts this obvious fact. </p>
      <p>I think Rousseau's influence has created very confused thinking about education, such as some of that in this thread. This confused thinking doesn't help teachers to do their job, and results in a lot of self-deception about what they are doing--that they are not giving direction when in fact they are all the time.  So when I read “prescriptivism destroys creativity “ and “Knowing the subject has very little to do with being a good teacher” I hear again for the n'th time the same confused ideas about teaching. </p>
      <p>I think that clarity about the real teaching process--not polluted by Rousseau's wrong ideas--helps people understand what they are really doing as teachers, and that clarity of purpose can only help them be better teachers.</p>
    html_clean: |-
