      <p>Being a big offender myself on spelling, I am also quite willing to forgive such mistakes. Also my hat is off to those who are bravely struggling with the English language, and I am happy to struggle to understand and to help. </p>
      <p>But typing in lower-case only is a decision, not a matter of speed--except perhaps in instant messages. Similarly, using "your" instead of "you're" is most often not a typing mistake. It's also not a great sin in on-line dialogue, but my point was that billygoat's claim that "prescriptivism is no longer the order of the day" is seriously misleading to students. </p>
      <p>You will NEVER find John Hudson or Nick Shinn, very articulate and literate Englishmen, making such mistakes as confusing your and you're. On Typophile it is almost always young Americans still in school or recently out of school who make such mistakes. After they learn by hard knocks that such mistakes stigmatize them, they wise up. Billygoat's advice will just delay their learning the facts of life, and subject them to humiliation or set-backs in their careers.</p>
