    <p>Hello,</p>
    <p>I recently recieved my frist assignment for my typography class at school, we have to make a study about about an font of our choice.</p>
    <p>I have chosen the "Sabon" by Jan Tschichold. I have gathered alot of information about Tschichold and the Sabon itself (including the Sabon Next).</p>
    <p>And now i'm a little stuck so how do i go from here? I have no idea how someone should explain the special features/highlights of this particular font. I wanted to ask my teacher but he's a little hard to get hold of, he did show us some great books about/from "Bram de Does" that gave my some idea how to handle this sort of thing but i could not take those home with me.</p>
    <p>So do you have any kind of reference material that i can use, any help is appreciated.</p>
    <p>(I'm new to this forum so i don't know if i'm posting this in the right category.)</p>
    <p>.pixr</p>
