      <p>T Bones,</p>
      <p>We have had lectures on how to apply type, but they prefer you to go away and try to set it without any guides. When you come to show your example, my tutor has then shown me where the errors are and how to correct them. I've found this a better way of learning, it is more of a one on one support, fine tuning aspects that if in a larger class I would not of been able to of grasped. Thats not to say I haven't read books on type, I have, but the hands on approach, to me anyway, has taught me much more than reading books (which I still use as a reference I might add!)</p>
      <p>It helps that my tutor is a brilliant typographer and to stop him from repeating himself he has handed out sheets on aspects of type and book making. There are only fourteen in our type group and each person has such varied requirements, some design and create fonts, others write, others set type. I have taught myself through trial and error how to get the rules right in order to break them and then had my tutor check  what I've done. Maybe I'm naive but I like to think that you have a knack for type and appreciation of language instilled in you already :-)</p>
      <p>The same aspect however applies for the other groups within my course, illustrators, information graphics and advertising, animation, script writers, printers - are all asigned individual tutors who are experienced within their field to help you develop your skills, you set your own briefs to help nourish your ideas and they help you learn the technical parts along the way. Thus making you develop confidence in your ability and to also give you a practical aspect of the industry.</p>
