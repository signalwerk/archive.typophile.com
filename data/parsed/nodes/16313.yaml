      <p>I think we have to make a difference between correcting a student on factual material and conceptual material. If a student makes an error in arithmetic, spelling, anatomy, law  or safe medical practice, this is one thing.  But "It Ain't Necessarily So," There is even wiggle room here.  I would not change the title of "Porgy and Bess" songs ("Bess You Is My Woman Now,") because they speak more correctly using wrong grammar.<br>
      Even typographical rules (Goudy and Spiekerman not withstanding) concerning illicit acts with sheep.  The crux of the matter is doing it well. Steph Geisbuller, April Grieman, and Willi Kunz letterspaced lowercase quite well. I am glad nobody slapped their wrists with a ruler for doing it.<br>
      When dealing with conceptual material with a student, I think the less iron-fast rules the better.  Every rule of today was at some point an exception in the conceptual arena. This is where dialogue and true enquiry are the best tools for teaching and learning.</p>
      <p>ChrisL</p>
