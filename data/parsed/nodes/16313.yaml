      <p>My favorite (and often used) line in Plato's Republic is "Yes Socrates, I agree"</p>
      <p>I fully understand that Plato uses Socrates as a hero character and gives him the best lines. I often used the Socratic method when I taught. It is much harder when you have to do it on the fly and you can't write the dialogue ahead of time. My goal as a teacher was not to use it to "win a point" but to get the student to analyze and support his/her own actions. My point was not to teach them to make a good design but to teach them to teach themselves how to do it and, most importantly, how to communicate their reasoning to their some-day clients.<br>
      I use my own take on the Socratic method both when I interview a client about a new project and when I present my design solution for it. I often quote back what the client said at our first meeting and try to show how I addressed those concerns in the design solution. I am not a salesman though. My aim is to solve the clients problem and prove to them how I did it. I have no interest in dog-and-pony-show lip service.</p>
      <p>"...whether a teacher should communicate judgment about what is better and worse... "</p>
      <p>I never tried to make an outright judgment even though that is what several of my students wanted me to do. I took the longer route and had the student extract their own judgment.  To me, this is more valuable for their future when there is no one to guide them.<br>
      "...teach a man to fish..."</p>
      <p>ChrisL</p>
