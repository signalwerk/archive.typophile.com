      <p>All of my <em><strong>best teachers</strong></em> (high school through college), with the exception of one, had no formal training to be educators. This is no longer possible in today's educational systems, since for the most part, masters degrees are required for educators.</p>
      <p>The questions now are:<br>
       - Why do I consider them the "best" of my teachers?<br>
       - What did they teach me?</p>
      <p>My judgement of these teachers is not based on conventional educational standards, but on how my very being was affected, even years after classes ended. In fact, two of my best teachers in college I truly detested until after time I started to realize what I had learned.</p>
      <p>So my opinion on what makes a <em>great</em> teacher is based less on what is taught (or even the subject for that matter) and more on how well a student's higher functions are nurtured.</p>
      <p>Teachers who have the ability to un-clog minds and kindle the flames of creative and original thought are generally kicked out of conventional educational institutions. And since much of the criteria for educational programs are outcome based (<em>how much has Johnny learned from the first to the last class</em>) much of what can be taught is whittled down to simple pragmatics and recombination.</p>
      <p>My best teachers gave me sleepless nights, either because I couldn't see or understand the solution, or because I was so incredibly stimulated my eyes wouldn't shut.</p>
      <p>My best teachers taught me how to throw away the extraneous and get to the heart of the situation or problem; how to dismiss conventional answers and to discover the essential meaning; and above all -- not to be afraid of seeing things differently.</p>
      <p>I owe an immense debt to my teachers, mentors and companions on the road of learning. This is chiefly why I re-emerged from my cave, in hopes of sharing and giving back to this community. This is why I encourage exploration in developing new excercises and programs for graphic designers. </p>
      <p>My fear is that we've abandoned these students because we've become confused on what to teach:<br>
      Something that can be tested at the end of the school year?<br>
      or something that awakens new vision and untapped skills?</p>
