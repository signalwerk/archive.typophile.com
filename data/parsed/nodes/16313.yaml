      <p>Barbara,<br>
      I don't think there is one set of attributes which would work as a litmus test.  I think you have to take the sum total of the person and balance there good and bad aspects (we ALL have both). If the sum is positive to you, fine.  The sum may also differ from student to student.  Some students want to be told the gospel and feel lost without strict direction.  Some want a devil's advocate to push them to their heights. Some want a gentle source of encouragement to give them a sense of self worth.  There are several other general patterns that students want in a teacher as well as mix and match from all.<br>
      I have had several different teachers with differing styles and personalities.  Most were good in spite of their failings. Some were bad even though they had strengths. The only common denominator I can think of is that all the good ones have an honest desire to further the knowledge and skills of their students. The bad ones tended towards self fulfillment over the needs of their students.<br>
      I can't be more specific than that.  I would only say give each teacher you have a fair chance but don't be afraid to challenge them when you don't see where they are taking you.</p>
      <p>ChrisL</p>
