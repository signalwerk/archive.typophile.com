      <p>Hello .pixr,</p>
      <p>I am not sure -- isn't there a PDF of the Sabon<br>
      Next brochure on the Linotype website? (Dan?)</p>
      <p>The one whom I'd recommend as truely exemplary<br>
      as regards "writing about type" is Max Caflisch<br>
      (he was a collegue of Tschichold by the way).<br>
      He analysed many typefaces for the Swiss magazine<br>
      "Typographische Monatsblätter / Revue suisse<br>
      de l'imprimerie / Swiss Typographic Magazine",<br>
      however, in German ...</p>
      <p>Then, John Dreyfus. Maybe you can get hold of<br>
      a copy of "Into Print. Selected Writings" (British<br>
      Library, 1994). It's about type history mainly,<br>
      and contains articles about Baskerville &amp;c.</p>
      <p>Anecdotes about his own types (which I find<br>
      funny and interesting) are in Frederic W Goudy's<br>
      "Goudy's Type Designs. His Story and his<br>
      Specimens" (The Myriade Press, 1978; also as<br>
      Typophile Chap Books XIII-XIV, "A Half Century<br>
      of Type Design").</p>
      <p>If you can get hold of a copy, B.H. Newdigate's<br>
      "Book Production Notes" (Tabard Private Press,<br>
      1986), mostly about typography, but also with<br>
      critical notes on typefaces.</p>
      <p>Good luck,<br>
      Karsten</p>
