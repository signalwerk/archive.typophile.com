      <p>&gt;rigid application of subject knowledge, however good that knowledge may be, does not necessarily lead to good learning on the behalf of the students.</p>
      <p>Ok, we're in agreement. Getting students to think for themselves is certainly a prime goal. So is conveying to them the wisdom and skills acquired by past generations. Part of this is a matter of what is better and worse in a given field. </p>
      <p>For example, if a student of Chris showed him a typographic solution that failed to visually reflect the heirarchy of ideas in the text, and so failed to served the client's desire to communicate effectively to readers, he would, I guess, suggest that the student seek new and varied solutions to better meet the clients needs. This is more effective teaching than saying 'you idiot, you got it wrong', but it is teaching standards and past knowledge none the less. </p>
      <p>What I don't like is the idea that teachers don't have anything to teach, and that they are just facilitators. Billygoat you seem to advocate this view when you say "Knowing the subject has very little to do with being a good teacher." </p>
      <p>To take an extreme example, I don't want the teachers of my heart surgeon, if I ever need one, to not know and teach what kind of surgery works to cure people, and to correct the skills of their trainees before they do surgery themselves. And then my surgeon would just creatively figure out his own method for cutting me open. No thanks. </p>
      <p>Now I know graphic design is not open heart surgery, but there is a large body of knowledge and standards, and students are going to do a better job if they know it. And they are less likely to learn it if their teachers are ignorant. Because there are a number of valid graphic solutions to any design problem, doesn't mean that some of the solutions are much worse and some much better. I'm sure that Chris Lozos and Nick Shinn, who are masters in their craft, would communicate that knowledge very effectively. And some very wonderful and kind facilitator who knew nothing about graphic design would do a much worse job.</p>
