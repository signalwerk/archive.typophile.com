      <p><em>Nick, is that “in” the colonies?</em></p>
      <p>Yes, indeed it is; good grammar and bad typing are not, it seems, mutually exclusive. And you may agree with T Bones about sloppy reflexive pronouns...it's your prerogative, but I don't agree, nor do the ghosts of my English professors (yes, several of them are now dead).</p>
      <p>And I must also disagree with you when you say that learning should not be about falling flat on your face. I have heard it said that an expert is a person who has made very mistake which can be made within a limited field of interest; hence, expertise is gained from constant and continuing face-falling. And, due to a certain perversity in human nature, learning from others' mistakes (especially those of our elders) is no substitute for learning from our own. Try; Crash;  Burn; Learn; Repeat as Needed...a crazy little thing called Life.</p>
