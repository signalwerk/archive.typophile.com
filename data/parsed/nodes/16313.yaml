      <p>&gt;Prescriptivism is no longer the order of the day.</p>
      <p>I assure you that editors and those who hire for literate occupations do prescribe. Such things as mixing up "your" and "you're" (pretty common on Typophile, alas) marks you as relatively less literate. Your writing is likely to be dismissed as a result. </p>
      <p>Also writing without capital letters, as guyt does, will gain you readers who are irritated that you can't bother to help them typographically. Perhaps brief instant messages to friends are an exception. In general, though, proper use of caps is considerate to your reader, and writing in only lower case a misguided attempt at informality.</p>
