      <p>Barbara,</p>
      <p>Good communication skills and the energy and passion for what your teaching otherwise it is pointless to try to convey information to a third party. </p>
      <p>The course I am on is so open wide every aspect of graphics arts and design is catered for and as you progress you can choose to fine tune your skills (in my case typography) or remain a general all rounder. You are then assigned a tutor who can cater to your needs.</p>
      <p>My tutor often says that he will not teach us, thats not what he does, he likes to draw things out of us, as we explore our creativity and develop our own skills, so he'll set briefs that help us do that and then only as we have started to develop has he given us guidelines to follow. For example I am making a book within a book, The outer book will hold two or three words that have the same three letters in the end, the three letters will sit in the inner book so as you turn the pages it becomes a puzzle to match the letters to their endings. ( It's hard to explain but when I show it you'll see what I mean!)<br>
      I had never made a book before so once I showed interest in it my tutor suggested areas to look at, bespoke printers and binders, the etiquette of 'high' book creation and so forth. </p>
      <p>I know as a person that to sit and read from a text book or be spoken at on 'this is how this is kerned' would of killed my passion for type years ago. The way in which I've been taught has made me so hungry for more that though it is not a traditional way to be taught it has helped me develop my creativity more than I've realised.</p>
