      <p>" In fact, two of my best teachers in college I truly detested until after time I started to realize what I had learned."</p>
      <p>This is something I wanted to mention as well. Even though you may be frustrated to the point of anger with a teacher at first, it doesn't mean that the Eureka affect won't set in later. I also had two teachers who affected me in this way.  The first one I had as a Freshman. I had come from a tough inner-city public high school where just not carrying a knife would get you a passing grade. After graduation, I was lucky enough to get a scholrship to a prestigious University.  In high school, I was king of the hill and sailed through with ease.  When I went to college, my new teacher had to dislodge me from my excess of unfounded confidence. It took me six months to realize what a great thing he had done for me.  I didn't get what I wanted but I got what I needed.<br>
      In my junior year, I encountered a teacher whom I didn't understand (neither did the whole class). It took three months for his terminology and concepts to make sense to me.  Once it did I took a quantum leap.  To this day, I think of this teacher as my greatest influence.</p>
      <p>ChrisL</p>
