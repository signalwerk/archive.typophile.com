      <p>Nick,</p>
      <p>My comment wasn't that learning SHOULDN'T BE about falling flat on your face, but rather that it DOESN'T HAVE TO BE about that. If someone has the common sense, savvy, presence of mind and, it may be argued, humility, to ask for help that will avoid such an incident, then surely they deserve to receive that help. </p>
      <p>I agree with you in that falling flat on your face surely DOES teach you something, but it's by no means the best and only way to make progress.</p>
      <p>While I didn't want to make an issue of the grammar aspect, I will  just say Nick, that perhaps you should be aware that the language of your professors died along with them. Prescriptivism is no longer the order of the day. </p>
      <p>Regards</p>
      <p>Paolo</p>
