      <p>&gt;William….you have a heart???</p>
      <p>Billygoat, I was disagreeing with your views. You seem to think this is cruel. I don't. I don't think that your disagreeing with me is cruel either--though though I think that your 'humor' about my being heartless is rude. I think that respectful debate, including between teacher and student, helps everyone--including the teacher--to learn.</p>
      <p>&gt;You seem to like putting words in people’s mouths…I didn’t say anything about teachers not having anything to teach. </p>
      <p>You said “Knowing the subject has very little to do with being a good teacher.” To me your statement clearly implies that whether the teachers have knowledge and skill to pass on is not that important, just their skills as a facilitator to the student learning on his own or her own. That view I think is mistaken, and my point was that if it is mistaken--as you seem now to agree--then so is your quoted statement.  </p>
      <p>&gt;I hate giving grades, but it’s a requirement of the job.</p>
      <p>Nick, when I asked about judgments, I wasn't referring to grading, but to your making judgments of students' work, and communicating your judgment, however tactfully. </p>
      <p>The excellent style guide you post at your site <a href="http://www.shinntype.com" title="www.shinntype.com">www.shinntype.com</a> , called 'Diggin It', is an example of the kind of typographic knowledge I trust you pass on to your graphic design students. And I would think that when they violate the guidelines, you would get them to think about whether they made the work worse or better--and if you think that is clear that their sample is the worse for it, I hope you would tactfully indicate why you think so, and suggest directions for improvement. </p>
      <p>This kind of tactful pointing out of where work needs strengthening is exactly the kind of thing that Matthew Carter, John Downer and Akira Kobayashi did at TypeCon in their critique of typefaces in progress. I think they were being helpful to those who brought their work, not cruel. Even though it is true that the person bringing work needs some toughness to welcome and learn from a critique.  </p>
      <p>Your views on Typophile are manifold and sharply put. I would hope that you communicate these interesting insights to your students--without expecting them to agree with everything you say. These are all your professional, experienced judgments and will help your students develop their own skills and tastes--which will not fully agree with yours or mine, hopefully. </p>
      <p>The nature of visual design is that all guidelines on occasion have reasons to be broken. But they shouldn't be broken without a reason, because then worse work results. An example of this approach is, I believe, Ellen Lupton's 'Thinking With Type: A Critical Guide for Designers, Writers, Editors, &amp; Students'. Note the word 'Critical' she is not a heartless and arrogant dictator, but she does give judgments and guidelines, which I what I think good teachers--of which she is clearly one--do. </p>
      <p>ps. I just read Chris Lozos' comment on how different students are best helped by different styles of teaching. Wise, and beautifully put. Thanks, Chris.</p>
      <p>I would just add that while it is true that both sides can adapt, different people will always have different teaching and learning styles. So teachers and students both need some understanding and tolerance of differing styles if they are to have good teacher-student relations, and effective teaching and learning.</p>
