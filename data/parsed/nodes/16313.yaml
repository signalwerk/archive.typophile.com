      <p>T Bones,</p>
      <p>Agreed, the subject is not grammar but, since you felt compelled to lecture me on manners, I thought that the schoolmarm ethic should be answered in kind, and a lecture on grammar was therefore appropriate. <strong>That</strong> as a generic relative pronoun is permissible for slackers and, apparently, Brits; as proper English is taught in graduate programs in English Language and Literature here is the Colonies, <strong>who</strong> is the proper pronoun to use when the antecedent is persons, <strong>which</strong> is the proper pronoun to use when the antecedent is things. Also, <strong>others</strong>, when used as a possessive pronoun, takes an apostrophe; <strong>his, hers, yours, ours</strong> and <strong>its</strong> do not.</p>
