      <p>I use "macro" in crits simply to mean global stuff that applies<br>
      to a face as a whole, as opposed to "micro" which is generally<br>
      for individual glyphs.</p>
      <p>I think the tail of the "J" should be stronger than anything up top.<br>
      Still love that "Q"! :-)  </p>
      <p>I don't like the top of the bowl of the "a" - somewhow it seems undecided whether it's going straight or curling up slightly. I think the "f" could be less shy. The dots of "i" and "j" are out of character; try make them a square but with the top edge at an angle (the same angle as the stem shears). The top of the eszet is too square. The angles on your grave and acute are very shallow - why?</p>
      <p>The numeral "4" seems a bit wide. And I think if you put that terminal on the seven, you should think about doing the same to the "2" and/or "5".</p>
      <p>Lastly: the vertical proportions, combined with the overall spacing* make me think that this needs to be slightly darker. Don't let my tough-in-spots crit discourage you though - when completed I think this face has a fighting chance to gain some recognition.</p>
      <p>* Your blank space is a bit too wide though.</p>
      <p>hhp</p>
