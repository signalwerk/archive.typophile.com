    html: |-
      <p>This looks really good!</p>
      <p>Some micro crits :-)<br>
      1. The 8 is slightly too dark. 2 is slightly too light.<br>
      2. The s is a little too wide.<br>
      3. l (lowercase L) has slightly too might space on the right sidebearing (this is the tradeoff of a design with a tail). Especially next to combinations where it should be kerned (lt, lw)<br>
      4. y is too dark in the crotch (the joint). I know this is a trademark letter, but I think it needs modification if this is to work in text. Perhaps a more traditional version of text? Y doesn't happen often in german :-) Not so in english.<br>
      5. c also a little too wide.<br>
      6. I don't like the comma/quotes. They are not long enough and too chunky. Too much like fat fake quotes!</p>
      <p>And macro crit:<br>
      I agree with that the overall spacing is not right. Optimize the spacing for 9-12 point. I also think the word space is too big. I disagree that you need to make it darker*. Just track the sidebarings out a little bit and close up the word space.</p>
      <p>*You might even make it lighter. This will help with interpolation later.</p>
      <p>Good stuff!<br>
      R</p>
