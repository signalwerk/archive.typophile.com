    html: |-
      <p>Dear Hanno Bennert,</p>
      <p>I see it is wider than the version 1., and it has a better x-height.<br>
      Some curves are stiff, the bottom part of ‘S’, and the ‘5’, as for the<br>
      five I prefer the previous version vith the oblique stroke.<br>
      Agree on consistency as it has been pointed.<br>
      The ‘B’ is too wide for me now, I’d go back to version 1. for it.<br>
      Is the ‘T’ little bit out of the cap height ?<br>
      ‘4’ is too wide now, and I’d I’d go back to version 1. for the figure one.<br>
      Agree on consistency as it has been pointed.<br>
      As for the ‘y’, I think the negative v-space is too much, so you might<br>
      improve your design by pulling up the all the control points in the joint.<br>
      I also disagree that you need to make it darker but you need to bold a tad<br>
      up the cedilla and probably the agonek. Assuming the ‘dieresis’ as correct<br>
      vertical position you have to line all the accetns to those dots but the ring.<br>
      The Euro sign is wrong, the right end of the bars does not have to be parallel.</p>
      <p>Keep up the good work.<br>
      Regards,<br>
      AS</p>
