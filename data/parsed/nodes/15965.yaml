    <p>WOW,<br>
    it's been almost a year!!! sadly i haven't been able to work on TRAMWAY for a long time, but now i'm back on track, so i hope you are all still interested in what i'm doing here.<br>
    i made several changes. the most important thing is that i reduced the cap-height, but there are many other, more subtle changes, that, i hope, improve legibility.<br>
    all other styles will be coming soon…</p>
    <p>and hrant, i just read your post from dec. 4th again, and in retrospect i'm not really sure what you meant with your "macro suggestion" (-&gt;adding shears). maybe you could elaborate on this (if you still remember)? ;-)</p>
    <p>as always, all critique is welcome.</p>
    <p>thanks in advance and so long…<br>
    hanno</p>
