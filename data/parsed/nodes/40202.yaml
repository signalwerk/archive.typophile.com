    <p>Found a few faces I quite liked in an old sample book and fancied bringing a couple into the digital age.  had a look around but couldn't find digital versions of any, but wanted a few more eyes to check them over and ensure I don't duplicate work...</p>
    <p>Faces are here: <a href="http://www.stone-soup.co.uk/uploads/fonts1.jpg" title="http://www.stone-soup.co.uk/uploads/fonts1.jpg">http://www.stone-soup.co.uk/uploads/fonts1.jpg</a></p>
    <p>Obviously Hidalgo is very much a Clarendon style slab, but there's a couple of differences (notably the 2 and 7 which I've failed to put on the sample), and Crusader seems to mostly be Swash/decorative caps -- I'm mostly interested in Philite, as I've fallen in love with it and want to get stuck in.</p>
    <p>Anyone spot any that I shouldn't bother with?</p>
