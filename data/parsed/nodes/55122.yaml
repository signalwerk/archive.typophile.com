      <p>I don't like the colors, specifically the choice of green. The white separator between two parts of the mark looks strange; I'd rather keep the mark either fully 3D or 2D. The text needs to be kerned, but I guess you are not at this stage yet. Also the choice of type is a "Web 2.0" cliche, though depending on your marketing strategy you may actually need that.</p>
      <p>The overall impression of the logo is quite good though. It looks decent and it is memorable. Just needs few tweaks IMO.</p>
