    <p>Hi,</p>
    <p>I've been working on a content management system for photographers called "Loupe".  It's nearing completion so I've started playing with a few ideas for a logo.</p>
    <p>It's based on the shape of a photographer's loupe and I'm aiming for a professional look.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/loupe 500px_6706.jpg"></div><p></p>
    <p>any feedback or ideas?</p>
    <p>cheers</p>
    <p>Paul</p>
