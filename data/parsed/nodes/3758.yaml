    html: <p>Isaac, that helps a lot. I never thought of it as a distorted humanist face. That helps a lot. I think it may even be Fruitiger black or something. I just found out that the this snippet is actually from a logo--the cineza logo for Sony's line of home projectors. They could have simply modified the z (pointy tips) and distorted Fruitiger or some other humanist face. Thanks isaac. </p>
