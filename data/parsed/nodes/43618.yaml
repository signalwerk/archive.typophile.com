    <p>How do you present to a client a logotype that you want them to purchase?<br>
    Do you show them a type specimen and say “isn’t this great?”<br>
    Of course there are ways to set the type in an online app and show them a screenshot, which is what I’ve been doing...</p>
    <p>Just curious as to everyone’s methods.</p>
    <p>Thank you!</p>
