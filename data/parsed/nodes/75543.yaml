    <p>I've been looking at typographic quotes, some from the forums on here, and just wondered if anyone could expand on the meaning of the one that attracted me the most?</p>
    <p>"Helvetica is the typeface for a deserted island" - Friedrich Friedl</p>
    <p>I'm asking just so I can get my head around the understanding of the quote, would be great if anyone could emphasise the meaning of this to me!</p>
    <p>Thanks</p>
