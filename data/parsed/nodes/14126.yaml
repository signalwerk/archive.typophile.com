    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/17745" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Designers</a>&nbsp;: Susan&nbsp;Kare</strong></p>
    <p>Susan Kare is a widely acclaimed type and icon designer. She designed the icons and <a href="/node/add/wiki?edit%5Btitle%5D=bitmap%20fonts" title="Create node &quot;bitmap fonts&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">bitmap typefaces</a> and interface icons for use on the original Macintosh computers. In doing so, she invented a language of metaphor and iconography still in use today. She later designed icons and graphics for Windows 3.0 and <span class="caps">OS</span>/2. Some of her typefaces, which have become ubiquitous on the Macintosh, include <a href="/node/add/wiki?edit%5Btitle%5D=Geneva" title="Create node &quot;Geneva&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Geneva</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Chicago" title="Create node &quot;Chicago&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Chicago</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Monaco" title="Create node &quot;Monaco&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Monaco</a>, and <a href="/node/20024" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">New York</a>. Her contribution to the history of user interface design and personal computing in general cannot be&nbsp;overstated.</p>
    <p>Some of her other bitmap type designs are available from <a href="/node/14114" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Atomic Media</a>.<br>
    Link:<br><a href="http://www.kare.com" title="external link to Susan Kare's website">Susan&nbsp;Kare</a></p>
