    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Susan Kare</strong></p>
    <p>Susan Kare is a widely acclaimed type and icon designer. She designed the icons and <a href="/wiki/bitmap%20fonts" class="freelinking" rel="nofollow">bitmap typefaces</a> and interface icons for use on the original Macintosh computers. In doing so, she invented a language of metaphor and iconography still in use today. She later designed icons and graphics for Windows 3.0 and OS/2. Some of her typefaces, which have become ubiquitous on the Macintosh, include <a href="/wiki/Geneva" class="freelinking" rel="nofollow">Geneva</a>, <a href="/wiki/Chicago" class="freelinking" rel="nofollow">Chicago</a>, <a href="/wiki/Monaco" class="freelinking" rel="nofollow">Monaco</a>, and <a href="/wiki/New%20York" class="freelinking" rel="nofollow">New York</a>. Her contribution to the history of user interface design and personal computing in general cannot be overstated.</p>
    <p>Some of her other bitmap type designs are available from <a href="/wiki/Atomic%20Media" class="freelinking" rel="nofollow">Atomic Media</a>.<br>
    Link:<br>
    <a href="http://www.kare.com" title="external link to Susan Kare's website" rel="nofollow">Susan Kare</a></p>
