      <p>That question was asked (in 2009) on the <a href="http://www.bibleworks.com/forums/showthread.php?4121-Unicode-and-Babylonian-vowel-pointing-for-Aramaic" rel="nofollow">BibleWorks user forums</a>. You can look at the answers. </p>
      <p>I have been "making fonts work" on my Macintosh for a few years now (I am an academic in a computer science department) and your question gave me an idea: why not make a font that can display the same source with different "vocalization styles" using the style mechanism of truetype and opentype fonts?</p>
      <p>To check if that can work, I took Maxim Iorsh's  <a href="http://culmus.sourceforge.net/" rel="nofollow">Culmus</a> David CLM font and added three styles, plus the ability to use in TextEdit on the Mac. Style 1 just shows blank vowels. Style 2 is basic babylonian, whitout the sheva and style 3 is what I made out of the Hebrew <a href="http://he.wikipedia.org/wiki/ניקוד_בבלי" rel="nofollow"><strong>ניקוד_בבלי</strong></a> article on the subject.</p>
      <p>Here is what it gives on a few lines copied from the Mechon Mamre <a href="http://www.mechon-mamre.org/i/t/u/u0101.htm" rel="nofollow">Targum Onqelos</a> (to compare with the Sperber grab of the <a href="http://www.bibleworks.com/forums/showthread.php?4121-Unicode-and-Babylonian-vowel-pointing-for-Aramaic" rel="nofollow">BibleWorks user forums</a>.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/DavidBabel_5867.jpg"></div><br>
      On top, the paste with the "standard style". Next, the blank vowel style etc. The font does no "intelligent" modifications, and vowels go on the mater lectionis instead of the preceding consonant (contrary to what Sperber does in the link above). That can be fixed using the keyboard. That's what I did in the last line.<p></p>
      <p> My guess it that using such a font on a text that is already vocalized with tiberian vowels, you can get with some properly implemented style a text close to what you want, with minimum effort;  you then make a few modifications for fine tuning. If you want to try you can download <a href="http://www.iro.umontreal.ca/~boyer/typophile/DavidCLMBabel.zip" rel="nofollow">DavidCLMBabel-Medium</a>.</p>
