    <p>Greetings! Do you know of a Hebrew font with babylonian vowels/punctuation? I know that a few years ago a proposal was made to implement the babylonian and palestinian systems into the Unicode standard; in the meantime, the easiest way is to keep the existing Hebrew vowels and use a font with babylonian-style design.<br>
    Thank you very much for any help you can give!<br>
    Michael.</p>
