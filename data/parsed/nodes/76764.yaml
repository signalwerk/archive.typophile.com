  - id: 441791
    user: 31798
    date: 2010-11-29T07:45:00
    date_raw: 29 Nov 2010 — 7:45am
    votes: null
    html: |-
      <p><cite> Ok, I found the issue. This was developed by former team member, so I am sorting debugging this from the wild. It seems they way over thought this, with double letters, coding the feature twice, and yes as mentioned above, I think it was overwriting the command with double actions (normal to alt, alt to normal). Also seems the code was kinda wrong, they had: </cite></p>
      <p><cite> sub w w' by w.alt; </cite></p>
      <p><cite> when it should have been </cite></p>
      <p><cite> sub w by w.alt; </cite></p>
      <p>I'm not clear what your substitutions are trying to do, but since you say you've left only the 'calt' feature it seems like the original developers probably had the former rather than the latter line of code (quoted above) in mind.</p>
      <p><code>&nbsp;&nbsp;&nbsp;sub w w' by w.alt; </code></p>
      <p>will substitute a w by w.alt when it follows another w (and if you have a bunch of w's in a row it will affect every second one).</p>
      <p><code>&nbsp;&nbsp;&nbsp;&nbsp;sub w by w.alt; </code></p>
      <p>on the other hand, will substitute any w with w.alt.</p>
      <p>If you really intend it to be the latter rather than the former then you probably don't want this substitution to appear in the 'calt' feature, but rather in a stylistic set ('ss01' - 'ss20') or, possibly, in 'salt'. What is the nature of the alternate glyphs?</p>
      <p>Also, features aren't initiated in 'aalt' -- 'aalt' is a distinct feature (access all alternates) which is responsible (for example) for mapping glyphs to their available alternates in the glyph palette.</p>
      <p>André</p>
