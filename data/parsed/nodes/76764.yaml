    html: |-
      <p>I think you need to tidy that up with OTF classes. You can create a class for all similar substitutions in one that represents @state1 then nearly identical class with all of your ".alts" in exactly the same order and number called @state2 (or whatever name you choose for the classes).</p>
      <p>Also, you may be making the same substitution in 2 different features.<br>
      {calt} is on by default and may take precedent over later features. You have to be very careful of the order you place not only your features with each other but which sub comes first in your string of code.</p>
