  html: |-
    <p>I have a stylistic alternates in my opentype values, but for some reason the opentype panel in Photoshop/Illustrator will not toggle them. The interesting thing is, the glyph window in Illustrator reads them fine, but toggling the alternates in the opentype window does nothing. In order to select an alternate, it has to be done via the glyph window. </p>
    <p>Has anyone ever experienced this, any ideas what is causing this?</p>
  html_clean: |-
    <p>I have a stylistic alternates in my opentype values, but for some reason the opentype panel in Photoshop/Illustrator will not toggle them. The interesting thing is, the glyph window in Illustrator reads them fine, but toggling the alternates in the opentype window does nothing. In order to select an alternate, it has to be done via the glyph window. </p>
    <p>Has anyone ever experienced this, any ideas what is causing this?</p>
