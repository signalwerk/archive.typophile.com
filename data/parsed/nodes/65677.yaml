      <p>Yes, Bald Condensed, I do. I've known for many months now. However, I went about finding out in a roundabout way. You see, since What the Font kept giving me disappointing results when I uploaded a fairly high resolution sample of the New Moon logo (only because HTF Requiem is so heavily modified in the Twilight logo), I scanned a font sample from the soundtrack to the Oliver Stone movie "Alexander" which I noticed used the very same font as in the Twilight and New Moon logos (I'm very sharp when it comes to fonts). It was identified for me by a kind soul on What the Font and I've known ever since. Clever, no? Lol.</p>
      <p>Thanks to everyone else for identifying the font.</p>
