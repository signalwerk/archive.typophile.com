      <p>Hey, those pangrams look familiar!</p>
      <p>If you're going to do that swoopy treatment at the bottom right of /n/m/h/, I think you should let it dip below the baseline a touch more. Those terminals look like they're riding high.</p>
      <p>I think you've identified well the letters that need the most work. I'm also not sure about /q/'s descender, and /t/ might be too wimpy above the crossbar.</p>
