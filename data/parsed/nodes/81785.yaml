  html: |-
    <p>Hello,<br>
    This is my debut typeface (which is still untitled).<br>
    What initially meant to be modular serif inspired by arab calligraphy, turned out into somewhat modernist base with elements used by older serif typeface styles.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Glyphs_4223.JPG"></div><br>
    Some glyphs still need work - namely N, Q, X, f, x, 4, 8.<br>
    Also I haven't started to work on kerning yet.<br>
    And FL technical features are like a plane cockpit to me.<p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Waterfall_5032.JPG"></div><br>
    These analogues are the closest of what I managed to find:<br>
    <a class="freelinking external" href="http://new.myfonts.com/fonts/bagraphics/sahara-bodoni/" rel="nofollow">Sahara Bodoni</a><br>
    <a class="freelinking external" href="http://www.type-o-tones.com/fonts.php?id=42#" rel="nofollow">Poster</a><br>
    <a class="freelinking external" href="http://commercialtype.com/typefaces/austin/austin/fat" rel="nofollow">Austin Fat</a><br>
    <a class="freelinking external" href="http://www.dafont.com/font.php?file=nouvelle_vague" rel="nofollow">Nouvelle Vague</a><br>
    <a class="freelinking external" href="http://new.myfonts.com/fonts/urw/basilia/black/" rel="nofollow">Basilia Black|</a><p></p>
    <p>Is it worth bothering with lighter weights?</p>
