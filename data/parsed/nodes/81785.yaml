  html: |-
    <p>Hello,<br>
    This is my debut typeface (which is still untitled).<br>
    What initially meant to be modular serif inspired by arab calligraphy, turned out into somewhat modernist base with elements used by older serif typeface styles.<br><img src="/sites/default/files/old-images/Glyphs_4223.JPG"><br>
    Some glyphs still need work - namely N, Q, X, f, x, 4, 8.<br>
    Also I haven't started to work on kerning yet.<br>
    And FL technical features are like a plane cockpit to me.</p>
    <p><img src="/sites/default/files/old-images/Waterfall_5032.JPG"><br>
    These analogues are the closest of what I managed to find:<br><a href="http://new.myfonts.com/fonts/bagraphics/sahara-bodoni/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Sahara Bodoni</a><br><a href="http://Poster" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Poster</a><br><a href="http://commercialtype.com/typefaces/austin/austin/fat" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Austin Fat</a><br><a href="http://Nouvelle Vague" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Nouvelle Vague</a><br><a href="http://new.myfonts.com/fonts/urw/basilia/black/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Basilia Black</a></p>
    <p>Is it worth bothering with lighter weights?</p>
