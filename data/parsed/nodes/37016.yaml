    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a> : Ragged r (r rotunda)</strong></p>
    <p>from John Smiths Printer’s Grammar, London 1755</p>
    <p>Blackletter consists of as many sorts as a common font of Roman; ſave that the first has two different r's, one of which is called <strong>ragged r</strong>, and is particulary used after letters that round off behind, whether they be capitals, or lowercase sorts. Thus thes are properly put after the following capitals, viz. B, D, G, D, P, V, W; and after these lowercase letters, viz. b, d, h, o, p and w.</p>
    <p><a href="http://typophile.com/node/37002" title="http://typophile.com/node/37002">http://typophile.com/node/37002</a></p>
