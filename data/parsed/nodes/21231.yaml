      <p>'Shelman' was in the Expresiv Fonts Brush Script Collection that was sold by Tiger Direct in the mid-90's. That is the font used for your lettering, as I have the collection. Of course it doesn't have any of the 3-D shading, but the letterforms match.</p>
      <p>- Mike Yanega</p>
