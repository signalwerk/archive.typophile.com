    html: "<p>\"Leaves from an Imaginary Type Specimen Book\". <br>and <br>\"As an experiment: 15 serifs applied to stems of similar weight to test serif influence in letter design.\" <br> <br>Oz Cooper wrote/designed/drew these essays for \"27 Chicago Designers Book\" (1937, 1936). They are reproduced in full in \"The Book of Oz Cooper\" (Society of Typographic Arts, Chicago, 1949). There are not a lot of this on the market, but if you can find one, they seem to be going for $100-$150 U.S., which is a small price to pay for such a beautiful, inspirational book. <br> <br>The essays are the most profound, instructive work on the practice of type design I've come across. When Oz says \"hybridizers have a moral responsibility...\" and draws a few words in a semi-serif type he's made up just to illustrate the point... <br> <br>I'd scan them for y'all, but I don't want to crack the spine.</p>"
    html_clean: "<p>\"Leaves from an Imaginary Type Specimen Book\". <br>and <br>\"As an experiment: 15 serifs applied to stems of similar weight to test serif influence in letter design.\" <br> <br>Oz Cooper wrote/designed/drew these essays for \"27 Chicago Designers Book\" (1937, 1936). They are reproduced in full in \"The Book of Oz Cooper\" (Society of Typographic Arts, Chicago, 1949). There are not a lot of this on the market, but if you can find one, they seem to be going for $100-$150 U.S., which is a small price to pay for such a beautiful, inspirational book. <br> <br>The essays are the most profound, instructive work on the practice of type design I've come across. When Oz says \"hybridizers have a moral responsibility...\" and draws a few words in a semi-serif type he's made up just to illustrate the point... <br> <br>I'd scan them for y'all, but I don't want to crack the spine.</p>"
