    html: <p>Stuart Sandler speaks truth! My book, Logo, Font &amp; Lettering Bible will be out in early February. The book is up on amazon.com though they don't have it yet. The book combines classic lettering rules and procedures with up-to-date Illustrator and Fontographer instructions. I tried to make it the BIBLE, though I know there's lots more to say. And I'm counting on all you typophiles to "beta test" the first edition and let me know where I've erred, so I can correct the next edition. For FontLab, I'm now working on "Learn FontLab Fast," due out in May. Check out both books at <a href="http://www.logofontandlettering.com" target="_blank">http://www.logofontandlettering.com</a>  (hey am I allowed to put urls here?--this is my first post). <br>Leslie</p>
