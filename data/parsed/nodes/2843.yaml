    html: <p>I have just finished 'Letters of Credit', and find it just an outstanding book. It is now back in print in paperback, so it is again accessible.  <br> <br>The way Tracy analyzes typefaces is really wonderful. He usually critiques individual letters from the point of view of how they harmonize or fail to harmonize in the overall face, and so how they work or fail to as text types. He is so experienced and with such broad tastes - he appreciates both van Krimpen and Goudy! - that the book is really an education, at least for this amateur typophile.  <br> </p>
