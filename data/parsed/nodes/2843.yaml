    html: <p>The Adrian Frutiger book "Type Sign Symbol" also contains some valuable information on type design. I also found Frederic Goudy's book "Typoligia" contains a lot of useful information. "The Verbum Book of Digital Typography" (1991) has several good chapters about type design with specific techniques in Fontographer described. It's a bit dated, but no more so than the Moye book.</p>
