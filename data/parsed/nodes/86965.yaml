      t=0.1  -  f1=[-398.25  -64.65]=abs 403  -  f2=[ 213. -621.]=abs 656
      t=0.2  -  f1=[-374.4 -124.2]  =abs 394  -  f2=[ 264. -570.]=abs 628
      t=0.3  -  f1=[-345.45 -178.65]=abs 388  -  f2=[ 315. -519.]=abs 607
