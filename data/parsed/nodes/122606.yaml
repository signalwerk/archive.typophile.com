      <blockquote><p>After some research I found what I was looking for: Colophon Relative Book.<br>
      I wasn't expecting such a well cut sans from them and I didn't think of checking on their website...</p></blockquote>
      <p>Shame... Colophon... I even checked their website but only 'Aperçu' with the assumption it couldn't have been one of their typefaces as they almost all look a bit odd/quirky/hipster-ish (like Radim Pesko's) and your sample was not.<br>
      My 2 cent now. I'm obsessed by typefaces but this one not. To me (but doesn't want to sound blase), it's "just" another re-interpretation of Helvetica (like Ampersand). Earmarks have been erased (/R leg, /a counter...) and faux-monospace treatment has been applied. For the rest, Graphik looks far better to my eyes.</p>
