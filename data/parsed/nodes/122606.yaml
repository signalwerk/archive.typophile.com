      <p>No match at the moment, not even a name. I firstly thought as COS is a sub-brand of H&amp;M, it could have been <a href="http://Ampersand" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Ampersand</a> (sample <a href="http://www.typesample.com/samples/Y9ehZ" title="Click to visit an external URL." class="freelink freelink-external freelink-external">here</a>). HM Ampersand is very close to <a href="http://Du Nord" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Du Nord</a> designed by Jonas Hecksher. Reminds me a bit of <a href="http://commercialtype.com/typefaces/graphik" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Graphik</a> too. My guess would be (a very common usage with Scandinavian companies/designs), they may have commissioned a Northern Europe foundry/design firm like <a href="http://playtype.com" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Playtype</a>, <a href="http://www.a2-type.co.uk" title="Click to visit an external URL." class="freelink freelink-external freelink-external">A2-Type</a>, <a href="https://monokrom.no" title="Click to visit an external secure URL." class="freelink freelink-external_ssl freelink-external">Monokrom</a>, <a href="http://www.schick-toikka.com" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Schick Toikka</a> or maybe Swiss (Lineto, Optimo, Grilli Type, Milieu Grotesque...) but I'm surely missing a lot.<br>
      Found also 2 more ones, somehow similar: <a href="http://www.newrailalphabet.co.uk" title="Click to visit an external URL." class="freelink freelink-external freelink-external">New Rail Alphabet</a> and <a href="http://www.a2-type.co.uk/html/regular_light.html" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Regular</a> both designed by A2-Type (their designers have also worked for Playtype).</p>
