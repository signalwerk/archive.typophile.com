      <p>Chris Lozos articulates a fundamental principle of design—though I hear often enough that clients don’t correctly understand their own problems.</p>
      <p>However there is too much good design of all styles—with expressive type and with neutral type, with an element of personal expression and with an anonymous style—to be dogmatic about one approach being ’best’.</p>
      <p>For a start, the length of work is a big factor. Too much artistic expressiveness in a lengthy text will seriously detract form the content of the author. But in a poster that tries to influence the viewer at a glance, expressive approaches may well get the better solutions.</p>
