    html: |-
      <p>Preferably jpg, gif (or png) file format, not wider than 600 pixels (<a href="http://typophile.com/readme" title="http://typophile.com/readme">http://typophile.com/readme</a>).</p>
      <p>Image linking makes sense for big pics (that would not fit the comfortable line length of the text messages) and pics of bandwidth-critical file size (I don't know if there's a file size limit for the "Insert Image" function of this board).</p>
      <p>For all other pictures (and most of the graphics that are typically posted on a type forum fall in this category) it's more convenient to actually have the pics <em>in</em> the discussion thread.</p>
      <p>Storing pictures outside of this board saves the visitor no bandwidth, as there's rarely a point in reading a discussion that deals with the pictures posted by someone without <em>seeing</em> these pictures, so the visitor will click the links anyway.</p>
      <p>PS: This thread is a request for a type face identification and, as such, would belong into the ID forum.</p>
