    html: <p>Helvetica Neue 97 (Black Condensed) is pretty darn close. Whatever is it, the E has definately been modified. If that is the case, then there is a good chance that some of the other characters have been modified as well. The D's look a little tweaked to me. There are so many different versions of Helvetica its often hard to tell which is which. Hope that helps.</p>
