    html: <p>By the way, people were burned for holding and refusing to repent of heretical beliefs, which were expressed in their Bible translations and in other books. The idea that somehow these people were martyrs to intellectual freedom, i.e. that they were burned because they wrote books and translated Bibles, is a modern anachronism. These people had no concept of intellectual freedom, and were just as quick to burn Catholics as Catholics had been to burn them, as seen in Calvin's Geneva.</p>
