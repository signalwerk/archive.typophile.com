    html: <p>"When was that?" When I was young, nothing other than Latin was spoken. The Priest forgot the homily and now I get to go to hell. John I was just not into getting lectured from a pompous potentate wearing a dress. I was a bad kid.  <br> <br>I don't believe the church objected to the sale of the Bible to churchmen. Most of those knowing Latin would be either rulers or churchman, often one and the same. But what if you were not a churchman but just went to church? To "the common man" it was merely gobbly gook, still is. Just ask me! <br> <br>The Gutenberg Bible contains the Latin version of the Hebrew Old Testament and the Greek New Testament, mainly the work of Jerome (c.342-420 AD) who translated some biblical texts from the originals and in other instances revised older Latin translations." <br> <br>I believe the problems John would be losing control over the masses. Endangering the Status Quo. <br> <br>..... <br>"I cannot think of a single time when the Church discouraged printing and publishing (although they certainly denounced specific products of the presses)." <br>..... <br> <br>John, the so called famous Douay-Rheims English Bible was one hundred years after the invention of printing. It simply does not cut the mustard for open source material. Considering in the first fifty years of printing there were over 2,000 different books published this feeble attempt to appease the masses is more than pathetic. <br> <br>So what did Gods little children read in the meantime? <br> <br>Three hundred and fifty years after the Douay-Rheims English Bible I was suffering through Mass in "Latin". Was I supposed to wait for the second coming? <br> <br>So what was that about? What are "we" not supposed to know? Well it worked because I don't have a clue. <br> <br>I think though, not to dilute the point. "Censor by murder" by the "spiritually enlightened" is a "big turn off". <br> <br> <br> <br></p>
