    html: <p>Actually you're right about the book using Ross' Garamond for reasons explained in the preface. If I remember well, I recall they said it might be an exact copy of the original but it's tough to prove. <br> <br>They're not sure if the original was actually done by Garamond himself or his master Antoine Augereau. Although they believe the italic was made by Garamond. <br> <br>As for being burnt for translating Bibles, I meant that they didn't translate them the way the Church would have wanted them to. Of course if they had translated in a way that would please the Church, I doubt they would have been burnt. <br> <br>I agree with you the type isn't really working there. It's just another average story book and I'm not sure if using that font really helps although it's somewhat justified by the content. <br> <br>As for the story, it's not going to give you an inner revolution (although I'm not finished) but it's one of the few stories that involve typography...and it will certainly inspire you to create a few letters. =)</p>
