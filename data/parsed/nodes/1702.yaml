    html: "<p><i>My understanding of the people being burnt was not that it was about content so much as translating the bible from latin to a laymans language.</i> <br> <br>I think this is a Protestant myth, as is the idea that the Church did not encourage the 'black art' of printing. The earliest surviving objects printed from moveable type in Europe are certificates of indulgences for the Bishop of Mainz. Gutenberg's Bibles and the F-S Psalter were purchased almost exclusively by churchmen; indeed, you could argue that at the beginning the Church was the only encourager of printing. The first roman types were cut by Schweynheim and Pannartz at the <i>monastery</i> of Subiaco, where they printed for many years before moving to Rome to be closer to their patron: the Holy See. During the spread of Protestantism, printing became all the more important to the Church, and the Council of Trent produced a huge wealth of Catholic publishing in refutation of Protestant teaching. I cannot think of a single time when the Church discouraged printing and publishing (although they certainly denounced specific products of the presses). <br> <br>I have yet to find any evidence of anyone condemned for translating scripture into vernacular languages per se. In every case, the issue was with the nature of the translation and the heretical teachings of the translator or the community to which he belonged. The Catholic response to Protestant Bible translation was not condemnation of all translation, but a substantial programme of publishing approved Catholic editions in the vernacular tongue, such as the famous Douay-Rheims English Bible which is still the translation of choice for many traditionalist Catholics. <br> <br><i>Also when I was young sermons at the Catholic Church were still only in Latin.</i> <br> <br>When was that? To my knowledge, homilies have never been delivered in Latin to the laity. All the readings of the traditional Mass are in Latin, but the homily is delivered in the vernacular. That is the whole point of the homily: to explain and explicate the text of the readings, which many priests repeat in vernacular at the beginning of the homily, even though most of the congregation has already read the translation in their missals.</p>"
