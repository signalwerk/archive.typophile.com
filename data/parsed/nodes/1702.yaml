      <p>[This is long, but arguably on-topic for this forum because it deals with the relationship of <i>text</i> to religion.] <br> <br>Gerald, my point about the Douay-Rheims translation was in reference to translation of the scriptures into the vernacular <i>not</i> publishing in general. Luther translated the New Testament into German in 1521, and the Old Testament in 1534. William Tyndale's first English New Testament was produced in 1525, although the first significantly disseminated English Bible was Coverdale's 1535 edition, the first complete English Bible. The most popular and widely read Protestant Bible in English prior to the King James edition was the Geneva Bible, published in 1560. The first Douay, Catholic English edition was published in the 1580s (for the record, I am not claiming that the Douay translation is a very good one: but it is the first English translation of the complete ancient canon of scripture including the Deuterocanonical books removed by the Protestants). And yes, during that 55-60 year gap between Tyndale and Douay, the Church did resist the publication of translations in the vernacular in general; although they did not, as far as I am aware, hand over anyone to imprisonment or death anyone for translation alone, but only for the <i>crime</i> of obstinate heresy.* <br> <br>One should also understand <i>why</i> the Church was concerned about translation of scripture into the vernacular, within the context of an opposing, specifically Protestant theology and culture of personal Bible reading. Protestants believe in a doctrine of <i>sola scriptura</i>, that everything that a man needs to know for his religious life is contained within the Bible, that he in fact needs nothing other than his Bible. This is a purely Protestant doctrine, without precedence, and we should recognise the radicalness of it in light not only to the teaching of both the Catholic and Orthodox traditions dating back to the early Church, but also of <i>Jewish</i> tradition. The irony of this doctrine of <i>sola scriptura</i> is that it is not supported by scripture. The Hebrew scriptures of the Tanach (the Christian Old Testament) presume the existence of both the <i> Torah Shebiksav</i> (the written Torah) and the <i>Torah Sheb</i></p><i>
      </i>
