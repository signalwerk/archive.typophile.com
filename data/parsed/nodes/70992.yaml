      <p>The AFDKO command tx does what you want.<br>
      <code><br>
      tx -pdf fontfilename.extension &gt; fontfilename.pdf<br>
      </code><br>
       does it. Here is the result on the TeX Gyre Pagella font (<a href="http://www.iro.umontreal.ca/~boyer/typophile/texgyrepagella.pdf" rel="nofollow"><strong>pdf</strong></a> 1.2Mb)</p>
