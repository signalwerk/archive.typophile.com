      <p>@ Michel</p>
      <p>Is the redirection per &gt; required on the Mac?</p>
      <p>On Windows it is more comfortable to write the command in this way:<br>
      tx -pdf -a fontFileName.extension</p>
      <p>The -a-option arranges the name of the output by taking the fontFileName as filename and the mode-option (in this case pdf) as extension. (Have you tried the -bc-mode-option? ASCII-art.)</p>
      <p>And -A instead of -a takes the internal fontname instead of the name of the input file.</p>
      <p>But I need a bit help with the options -dd and -sd. I get an error there: file error  [NameOfInputDirectory/-]</p>
