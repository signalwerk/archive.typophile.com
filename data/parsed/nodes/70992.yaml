    html: |-
      <p>You may try fontplot. It belongs to the AFDKO (Adobe Font Development Kit for OpenType).</p>
      <p>Command "fontplot -h" and "fontplot -help_params". Fontplot stores the character map as PDF. I am not sure, if there is an option for putting the index numbers into the boxes, but if not, maybe someone is willing to modify the Python script.</p>
      <p>I did not try it, but you also could redirect the output of the print commands of FontLab and convert the Postscript file to PDF.</p>
      <p>But I think, there are more comfortable ways.</p>
    html_clean: |-
