    html: |-
      <p>Redirection is not required. What you suggest also works on the mac.  I use Unix pipes a lot (with sed, grep and awk), and the last thing I do is to redirect; with programs whose output is the standard output, it is the thing to do.  I was in fact not aware of the -a or -A options. I just tried the dd option. I was in /library/fonts and, after creating the folder $HOME/Arno typed</p>
      <p><code>tx -pdf -a -dd $HOME/Arno Arno*otf</code></p>
      <p>which took as input all the files Arno*otf, applied tx -pdf on them, named the result with a pdf extension and put them in the folder $HOME/Arno. </p>
      <p>That is something I would have done with the line command</p>
      <p><code>for i in Arno*.otf; do tx -pdf $i &gt; $HOME/Arno/${i%.otf}.pdf; done<code></code></code></p>
      <p>It is faster to type than to read the output of <code>tx -u</code> but that is probably not the kind of text for a typophile thread. It is just to explain why I often miss many options in programs.</p>
      <p>Michel</p>
