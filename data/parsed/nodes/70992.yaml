    html: |-
      <p>@ Michel</p>
      <p>%%~dpf is the path to f inclusively the drive and exclusively file name and extension.</p>
      <p>-------</p>
      <p>For the Windows users. I would like to attach a few batch files, but this does not seem to be possible here.</p>
      <p>Create the folders Input and Output in the directory of your choice (same drive as [A]FDK[O]) and create the following batch files:</p>
      <p><strong>FDKvars.bat</strong> (Change path to the FDK [in the batch file], if it is different.)<br>
      <code>@echo off<br>
      set "FDK=C:\FDK_25_21898\Tools\win"</code></p>
      <p><strong>Make Character-Map-PDF [Boxes link to ExtraInfo].bat</strong><br>
      <code>@echo off<br>
      call FDKvars<br>
      for %%f in (Input\*.*) do %FDK%\tx -pdf -1 -dd Output "%%f" "%%~nf_Character-Map_and_Extra-Info.pdf"</code></p>
      <p><strong>Make Character-Map-PDF.bat</strong><br>
      @echo off<br>
      call FDKvars<br>
      for %%f in (Input\*.*) do %FDK%\tx -pdf -dd Output "%%f" "%%~nf_Character-Map.pdf"</p>
      <p><strong>Empty In- and Output.bat</strong><br>
      <code>for %%f in (Input\*.*; Output\*.*) do del "%%f"</code></p>
      <p><strong>TX Help.bat</strong><br>
      <code>@echo off<br>
      call FDKvars<br>
      %FDK%\tx -h<br>
      echo.<br>
      echo.<br>
      echo.<br>
      pause</code></p>
      <p><strong>TX Usage.bat</strong><br>
      <code>@echo off<br>
      call FDKvars<br>
      %FDK%\tx -u<br>
      echo.<br>
      echo.<br>
      echo.<br>
      pause</code></p>
