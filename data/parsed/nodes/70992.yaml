      <p>I have done it in this way now (in a batch file):</p>
      <p>set "p=path to directory with fonts with spaces in path"<br>
      for %%f in ("%p%\*.*") do tx -pdf -dd "%p%" -a "%%f"</p>
      <p>I wonder, why this did not work:</p>
      <p>for %%f in ("path to directory with fonts with spaces in path\*.*") do tx -pdf -dd "%%~dpf" -a "%%f"</p>
      <p>And I still have problems with the options sd and sr, when jokers are included. The problem is, that I meanwhile have forgotten so much, that I did know about batch programming.</p>
