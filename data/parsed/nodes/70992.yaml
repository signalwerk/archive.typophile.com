    user: 45774
    date: 2010-06-04T11:04:00
    date_raw: 4 Jun 2010 — 11:04am
    votes: null
    html: |-
      <p>Addition/correction (FDKvars.bat)</p>
      <p><strong>FDKvars.bat</strong> (Change path to the FDK [in the batch file], if it is different.)<br>
      <code>@echo off<br>
      set "FDK=C:\FDK_25_21898\Tools\win"<br>
      set "FDKPython=%FDK%\Python\Current\python"<br>
      set "FDKScripts=C:\FDK_25_21898\Tools\SharedData\FDKScripts"</code></p>
      <p><strong>Make Character-Map-PDF with Fontplot.bat</strong><br>
      <code>@echo off<br>
      call FDKvars<br>
      for %%f in (Input\*.*) do (<br>
      %FDKPython% %FDKScripts%\ProofPDF.py -o "Output\%%~nf_Character-Map_[Fontplot].pdf" -fontplot --openPDFWhenDone 0 --drawMeta_Hints 0 --drawMeta_SideBearings 0 --drawGlyph_XAdvance 0 --pageTitleFont Helvetica --metaDataFont Helvetica --metaDataNameSize 110 "%%f"<br>
      start Output\"%%~nf_Character-Map_[Fontplot].pdf")</code></p>
      <p>Note: The parameter for opening the pdf is set to 0, because on my PC the script starts it, before it is saved. So I have added the start command separately (start Output…).</p>
      <p><strong>Proof PDF Help-Params [Fontplot for example].bat</strong><br>
      <code>@echo off<br>
      call FDKvars<br>
      %FDKPython% %FDKScripts%\ProofPDF.py -help_params<br>
      echo.<br>
      echo.<br>
      echo.<br>
      pause</code></p>
      <p><strong>Proof PDF Help [Fontplot for example].bat</strong><br>
      <code>@echo off<br>
      call FDKvars<br>
      %FDKPython% %FDKScripts%\ProofPDF.py -h<br>
      echo.<br>
      echo.<br>
      echo.<br>
      pause</code></p>
