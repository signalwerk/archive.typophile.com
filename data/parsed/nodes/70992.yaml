  html: |-
    <p>Does any one know how to create a Glyph/Character map, say like how myfonts.com uses? <a href="http://new.myfonts.com/fonts/fontbureau/juliana/text-roman/characters.html" title="http://new.myfonts.com/fonts/fontbureau/juliana/text-roman/characters.html">http://new.myfonts.com/fonts/fontbureau/juliana/text-roman/characters.html</a></p>
    <p>I am trying to create some previews of my font designs, but cannot find a way to do something like this, and in a batch process. Any ideas?</p>
  html_clean: |-
