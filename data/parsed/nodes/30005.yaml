      <p>I'd change the color of the subtext, the contrast is too low against a white background. </p>
      <p>Regarding the type of organization, I'd prefer a softer main colour. Magenta is kinda harsh to me. But that's something personal.</p>
      <p>The text in italic and the logo are now leaning towards each other. Is that what you wanted? Maybe you could make the logo a bit more upright.</p>
      <p>Over all, it looks quite calm and neutral. Which is good, I suppose.</p>
