      <p>With a quick look, I feel that the modified G on the right might be improved by removing the perspective distortion on it that now makes it slant back and to the left. It seems like an unnecessary additional feature.</p>
      <p>You could also play with making the ends of the G sharper to make the shape's identification with the letter, not just the graphic of a head, clearer. Possibly making the left side of the arrowhead bigger than the right side might help. As is, it took me a second to realize that this was a face <em>and</em> a letter.</p>
      <p>Also, to help with "reading" the G as well as a face, you might rotate the G so that it looks more typical, with the face slightly looking up. That could also be suggestive of the organization: looking up toward hope.</p>
      <p>Maybe the star could be in the same color as the subtitle ("for domestic violence and abuse") to unite the image?</p>
      <p>And I agree with all of Jorik's suggestions, especially the angle of the type and the G.</p>
