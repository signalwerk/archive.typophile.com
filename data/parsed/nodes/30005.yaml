      <p>I agree with Jorik and Reed—if this logo is going to appear on white on a regular basis, it's  a bad idea to set the second line of text in yellow, as it's going to result in that text being illegible much of the time. And unless there's some good conceptual reason for the perspective effect, it doesn't need to be there. </p>
      <p>I'd lose the either the cross or the arrow in the big illustrated G. There's already a lot going on in that logo as it is, adding either of those really pushes it over the top. The arrow pointing up gets the point across on its own, if the client really insists on sticking the cross in, pointing at it is just too much.</p>
