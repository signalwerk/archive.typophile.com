    html: |-
      <p>I like the general Fontin `feel', and the subtle curves in the serif bases.&nbsp; I used Fontin Semi for my résumé to good effect, and may well switch when this is released.</p>
      <p>That said, the capital J feels like it's missing part of its tail (Semi &amp; Serif have distinct tails), and the joints on the lowercase k &amp; y feel `bumpy' even at small sizes.&nbsp; Also, most of the serif are symmetrical, even when most serif fonts introduce an asymmetry (<em>e.g.</em> to keep the P from `falling over' &amp;c.).</p>
      <p>—Joel</p>
    html_clean: |-
