    html: |-
      <p>Very well done!</p>
      <p>I agree about the J not complementing the other two fonts.</p>
      <p>Something else I've noticed. K. It looks like the top arm is going too much to the right and looks like it's wider on the top thus making it a bit unstable. Or maybe it just need the middle join to be moved a little bit lower. A small bit.</p>
      <p>The g looks more serif in Semi version than it looks in the Serif one. To me the Semi version is too serif and you should exchange these two letters from one to the other. Or do something about it.</p>
      <p>Lc s also need some work on the end of the bottom stroke, because I think it goes too high and closing the shape more than it should.</p>
