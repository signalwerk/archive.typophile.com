    html: |-
      <p>I really like this face. It feel very sensuous and curvy with a dark color, and makes me think of pinups by Vargas and Olivia.</p>
      <p>I think that the upper terminals on <strong>s</strong> and <strong>S</strong> are too heavy and seem to droop. It has something to do with thecloseness of the  the central stroke of the letter, which is why the hefty upper serif is not a problem in <strong>C</strong>. The crossbar on <strong>f</strong> breaking up and the left side could come down a little. It also seems like the terminal of the descender on <strong>y</strong> is lacking the sensuous nature of the rest of the letters and comes to an abrupt end.</p>
    html_clean: |-
