      <p>Looking at y this seems to be the Lanston version <a href="http://www.myfonts.com/fonts/lanston/ltc-nicolas-cochin/" rel="nofollow">LTC Nicolas Cochin</a> "Many foundries including Lanston released versions in the 1920s. Several digital versions can now be found, but none have kept the irregular details of the metal type which include strokes that cross over each other as if hand drawn (see letters K &amp; y). The new Lanston digitization is the only digital version to retain the idiosyncratic treatment which makes the metal type so alluring."<br>
      Don</p>
