      <p>If I'm not mistaken the date on the newspaper looks like 1952. That makes metal, or maybe film, the only alternative to hand-drawn. It also makes finding it pretty hard, because Italian type is not well documented in most font books I have access to.</p>
      <p>- Mike Yanega</p>
