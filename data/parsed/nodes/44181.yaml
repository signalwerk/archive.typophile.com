    <p>Hi everyone:</p>
    <p>I’m headed to Mexico City for a week in May, and I’m wondering if anyone has any suggestions of museums, studios, print shops, clubs, etc. relating to type, typography, printing history, letterpress, book arts, etc. either in Mexico City itself or nearby that I should check out.</p>
    <p>(Dining suggestions are also welcome!)</p>
    <p>Thank you so much!<br>
    Grendl.</p>
