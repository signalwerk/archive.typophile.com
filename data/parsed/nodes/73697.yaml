    html: |-
      <p>I see where a couple Gill Sans features popped into the design in the lowercase d and q (they are now a little different in my latest revision). This was not intentional, and I certainly was not modifying an existing outline. I tweaked the x-height and lowercase y as per your suggestions. Thank you very much for the feedback!</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/easysans2_6239.png"></div><p></p>
      <p>Attached is the latest revision.</p>
      <p>For now, I will be adding glyphs and figuring out the whole kerning/metrics process. Any thoughts or suggestions would be welcome.</p>
