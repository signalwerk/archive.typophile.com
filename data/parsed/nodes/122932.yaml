    html: |-
      <p>If you have Python installed and go to Macros and "Mark Problems" it shows up pink when points are not at the right place or when point should be inserted.<br>
      @oldnick. Unicode problems show up in red, but only at the unicode value, not at the part were the glyph is previewed.<br>
      Grey means that the glyph is part of the characterset, but is not active. If you would make an empty glyph, it would not show up grey.<br>
      ...on the other hand.. I use FontLab on Windows (that's an OS made by a company called Microsoft <a href="http://en.wikipedia.org/wiki/Microsoft" title="http://en.wikipedia.org/wiki/Microsoft">http://en.wikipedia.org/wiki/Microsoft</a>) so it could be different on a Mac</p>
