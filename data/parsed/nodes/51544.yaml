    html: |-
      <p>Signature marks, also called collation marks, such as the one shown above persisted in a variety of forms even into the early 20th century. As mechanization increased they became rarer.</p>
      <p>If you work in the book production racket these days, you will be familiar with the current form of signature marks. If you look at a pile of F&amp;Gs (folded and gathered signatures), you'll see black marks printed on the fold of each signature, stepping down the spine in order. As each book's signatures are gathered, these marks should always be in the same order. If they are out of order, an "electronic eye" sees this and shuts down the binding line. As recently as ten years ago, it was till regrettably common to find the occasional book with sigs out of order, or with two of the same sig, or with missing sigs. That has become far less common thanks to this system.</p>
      <p>These new marks perform the same function as the collation marks shown in the first post and explained above by Wolfgang.</p>
      <p>powers</p>
