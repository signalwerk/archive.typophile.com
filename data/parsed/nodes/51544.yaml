    html: |-
      <p>A. is an abreviation for the Latin word Ante-whatever, signifying the part of a book that comes before the main text. We Dutch call it ‘voorwerk’ — before work.<br>
      iii is a pag number, to be followed by iv, v, vi etc.</p>
      <p>. . .<br>
      Bert Vanderveen BNO</p>
