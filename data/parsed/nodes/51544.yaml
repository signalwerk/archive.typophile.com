    html: |-
      <p>A iii ist the Signature.</p>
      <p>A signature consists almost always of a letter (or a combination of letters) and a numbering in lc roman numbers. Its function is </p>
      <p>a) to help the book-binder to fold the printed sheet into a quire (and so to ensure the correct sequence of the leaves of a quire) – hence the numbers</p>
      <p>b) to help the binder to arrange the folded quires in the correct sequence in the order of the alphabet– hence the letters</p>
      <p>and so to arrange the whole book in the required order even if the binder was not able to read or understand the text. This was necessary because in early prints pagination was almost unknown and so many books were missbound. (Books from the 15th to 18th century were usually sold as unbound sheets and binding was left to the buyer).</p>
      <p>Wolfgang</p>
