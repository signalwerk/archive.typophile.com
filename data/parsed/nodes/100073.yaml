    <p>I was just visiting the <strong><a href="http://dyslexicfonts.com" rel="nofollow">OpenDyslexic website</a></strong> and I noticed when I hovered my cursor over the page, a light grey semi-transparent horizontal bar appeared. A feature I have not seen before.</p>
    <p>I’m fairly confidant it’s there to assist users with reading differences. Akin to how you used to use a ruler to help you read when you were learning.</p>
    <p>It’s still novel to me, but I think I like it. Then again, my vision isn’t that good, and I like big, easy to read type.</p>
    <p>Does anyone:<br>
    a) know how this feature technically implemented? (css, html 5, Flash &amp;c)<br>
    b) have any thoughts or feelings about it?</p>
