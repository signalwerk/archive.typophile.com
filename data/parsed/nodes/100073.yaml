      <p><em>…there is personal experience in the mix too…</em></p>
      <p>Dyslexic readers are a demographic category, and in that respect no different than any other slice of the pie.</p>
      <p>Communicators today need to deal with the issues of ﬁlter bubbles and the relevance paradox, as they try to ﬁne tune the tools they are using to understand the needs of different groups. But that kind of empirical research can only go so far towards making something that is easy to read and appealing to a particular group. Beyond that, as is always the case, the designer has to design, and you can’t do that without putting something of yourself into the work and taking your audience along for the ride.</p>
