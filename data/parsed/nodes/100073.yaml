      <p>“<em>For many people, lower contrast is needed.</em></p>
      <p>Do you have sources to peer reviewed studies which support this, or is this anecdotal and from your own experience (which I am confidant is far more significant than my own). I have yet* to come across anything published.</p>
      <p>Diemand-Yauman, C., Oppenheimer, D. M. &amp; Vaughan, E. B. (2010). Fortune favours the bold (and the italicized): Effects of disfluency on educational outcomes. <em>Cognition, 118(1)</em>, 111–115.</p>
      <p>But this sample population for Diemand-Yauman et al. (1020) were not readers with learning differences. Experiment 2 did have 222 subjects (Ss) however, so it’s possible there were a few Ss in there who did have learning differences but fell within their inclusion criteria of academic performance, or did not report any learning differences.</p>
      <p>I look forward to your response!</p>
