    votes: null
    html: |-
      <p>Filter bubbles are the envelope around a person that search engines create by limiting/prioritizing results according to demographic facts about that person: If you like that then you’ll like this.</p>
      <p>The relevance paradox is that one can’t know which of many possible factors will be relevant to an action about to be taken, and in editing out what appears to be irrelevant, one cannot avoid removing some factors that turn out to be important.</p>
      <p>To burst the bubble and ﬁll the gap left by the paradox, designers use personal, tacit knowledge to create something new.</p>
