    html: |-
      <p>I followed the British dyslexia associations recommendations:<br>
      <a href="http://www.bdadyslexia.org.uk/about-dyslexia/further-information/dyslexia-style-guide.html" title="http://www.bdadyslexia.org.uk/about-dyslexia/further-information/dyslexia-style-guide.html">http://www.bdadyslexia.org.uk/about-dyslexia/further-information/dyslexi...</a></p>
      <p>Lower contrast also helps people with scoptic sensitivity syndrome. <a href="http://en.wikipedia.org/wiki/Scotopic_sensitivity_syndrome#Scotopic_sensitivity_syndrome_Symptoms" title="http://en.wikipedia.org/wiki/Scotopic_sensitivity_syndrome#Scotopic_sensitivity_syndrome_Symptoms">http://en.wikipedia.org/wiki/Scotopic_sensitivity_syndrome#Scotopic_sens...</a></p>
      <p>The idea was to have a happy medium, because with contrast too low, and its obviously useless for everyone, but contrast too high would be difficult to read for some. </p>
      <p>The bar and the highlighting paragraphs are there to help keep focus on what you are reading. The highlighted paragraph is the current paragraph you are reading, and you can use the bar for the line. It's a similar concept to using an index card or bookmark for reading line by line. </p>
      <p><a href="http://beelinereader.com" title="http://beelinereader.com">http://beelinereader.com</a> accomplishes something similar using text gradients, which I also use personally.</p>
      <p>Obviously, there is personal experience in the mix too: I experimented quite a bit with colors and reading in college, but never mentioned anything openly about it until I realized others had similar issues and methods for dealing with them.</p>
