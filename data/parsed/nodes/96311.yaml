    html: <p>According to Wikipedia, only the Danish kroner is written with a period. Norwegian, Swedish, Icelandic all write "kr".  (Not counting Estonian, Austro-Hungarian, Yugoslav or Fiume krone, nor Czech or Slovak koruna.) The Pharoe Island and Greenland use the Danish kroner. FIY, "krone" translates to "crown" — and that’s already in the chess section of Unicode!</p>
