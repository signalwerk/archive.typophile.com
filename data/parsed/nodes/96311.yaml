      <p>Wow: some cool stuff so far.</p>
      <p>At present, there is no "client'; however, the idea is being floated in some circles to make the Icelandic kronur the Universal Internet Currency, which makes sense because Iceland has an incredibly awesome internet infrastructure, and blazing fast access speeds.</p>
      <p>Plus, through a proposed "pay-ahead" subscription plan, currency conversion charges would be minimal—typically, 1%. Which is to say: if you anticipate your internet purchases and pony up the money first to draw against later, in essence you have a virtual ATM card and, therefore, lower transaction fees overall. </p>
      <p>Anyhow, websafe (at bookmark size and up) ought to be a consideration, too.</p>
