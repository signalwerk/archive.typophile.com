      <p>Frode, I only had one sketch. And I actually wasn't trying to make it look like a rune. But I don't mind if it does - in fact I tend to like that idea. Westerners tend to brandish the term "racism" way too enthusiastically - I see that in the US daily. Something obvious might be boring (and I personally wouldn't want a currency to ignite passions anyway*) but that does not equate to insult. Runes aren't something to be embarrassed about.</p>
      <p>* For example the old Dutch notes were beautiful. But is the idea of currency beautiful? For one thing it was invented (in Smyrna) purely as a way to reduce bartering and facilitate taxation.</p>
      <p>Riccardo, agreed. Except for sets of countries that actually want their currencies to share a symbol, each one should be different. BTW when I said that the "K" isn't there enough it's because when I look at it I see the "R" first, which is a problem (but maybe mine has the same problem).</p>
      <p>hhp</p>
