    html: |-
      <p>Wow. Looks like you put a great effort in the Greek. I don't know anything bout it, but, purely aesthatically, I like it. In the 'normal', the serif on top of stems (in /i n p r, etc.) could use a little more overshoot. It doesn't optically align with the shoulder/bowl currently. If you just raise it a couple units, the white space between the bowl and the top of the stem will also increase, which is good for legibility.</p>
      <p>Cheers,<br>
      Jasper</p>
