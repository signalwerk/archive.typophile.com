  html: |-
    <p>I'm one of the far too many non-Greeks trying to come up with a decent Greek text face. </p>
    <p>I dislike latinization, and I also dislike the clash between Roman uppercase and Greek lowercase letters. After reading <a href="http://typophile.com/node/15819" title="http://typophile.com/node/15819">http://typophile.com/node/15819</a> (Nick: Non-common Greek Caps), I sketched together some Greek caps in the same style as the lowercase. </p>
    <p>Please take a look at the PDF.<br>
    Is it too exotic? Too informal? Does it ruin the relationship with the Roman entirely?</p>
    <p>I just want to get an idea whether this is worth pursuing.</p>
    <p>(If anyone wants to play with the font, I can upload that too.)</p>
