      <p>Sorry to drift off topic, but be wary of the similarity between your typeface and Minion Pro. I prefer yours as it is, so you don't need to move away from Minion, but just keep it in mind. And what I said about the serifs on top of stems can be seen clearly in Minion. Compare the top of your /n/ and the top of Minion's /n/ and you'll see it.</p>
      <p>Good luck!<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Picture2_6034.png"></div><p></p>
