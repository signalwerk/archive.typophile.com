      <p>I remember in the early days of digital fonts, Jonathan Hoefler had a Huxley Vertical for license. He didn't call it Huxley Vertical, and it is no longer available, but it was a very good Huxley. It was a FontHaus font if memory serves me, back when Jonathan was the "FontHaus Foundry". I'm sure if you looked at old U&amp;lc's you can find the ads.</p>
      <p>Memories!</p>
