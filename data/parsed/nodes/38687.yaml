    html: |-
      <p>If you use PostScript outlines take a look at chapter "3.5 Direction of Paths" in this PDF:<br>
      <a href="http://partners.adobe.com/public/developer/en/font/T1_SPEC.PDF" title="http://partners.adobe.com/public/developer/en/font/T1_SPEC.PDF">http://partners.adobe.com/public/developer/en/font/T1_SPEC.PDF</a></p>
      <p>If you use TrueType contours, it's the other way around.</p>
      <p>Ralf</p>
    html_clean: |-
      <p>If you use PostScript outlines take a look at chapter "3.5 Direction of Paths" in this PDF:<br>
      <a href="http://partners.adobe.com/public/developer/en/font/T1_SPEC.PDF" title="http://partners.adobe.com/public/developer/en/font/T1_SPEC.PDF" class="link-external">http://partners.adobe.com/public/developer/en/font/T1_SPEC.PDF</a></p>
