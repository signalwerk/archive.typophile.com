    <p>Hi all!<br>
    I recently made a visit to a used/old book store. By the way, we have a word in portuguese for these special stores, that sell old and used books: alfarrabista. Does English have a special word for this?Other them second-hand bookseller or antiquarian?</p>
    <p>I found some old pages from a catalogue with some typefaces and ornaments. I made a digitalisation of some to share with the “commutity”...<br>
    Enjoy</p>
    <p>António Fonseca</p>
    <p>PS- As soon as I get more free time I will digitalise the rest...</p>
