    html: |-
      <p>It depends on the code you have downstream. If you're not doing any localized treatment for Azeri, Turkish, etc. you only need the two first entries,<br>
      <code>languagesystem DFLT dflt;<br>
      languagesystem latn dflt;</code></p>
