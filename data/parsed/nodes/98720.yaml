    <p>Just in time for Xmas and New Year celebration we are proud to introduce a new font to our growing collection.</p>
    <p><strong><a href="http://www.myfonts.com/fonts/sudtipos/platinus-script-pro/" rel="nofollow">Platinus Script Pro</a></strong> is the latest example of what has now become a Sudtipos tradition: Adapting conventional calligraphic methods from the last two centuries to produce modern digital scripts for the current one. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/typophileplatinus_6176.jpg"></div><p></p>
    <p>This time the resulting font explores the evolution of invitation scripts from the classic commercial lettering of the 1930s to the ideas clearly visible in the greeting cards of the 1980s and 1990s. </p>
    <p>Most base characters are made up of a single stroke, with some of strokes driven from the top down,<br>
    and some from the bottom up, putting the emphasis on the casual but precise fluidity of the hand an emphasis magnified by the expert use of loops and swashes everywhere.</p>
    <p>The <strong><a href="http://www.myfonts.com/fonts/sudtipos/platinus-script-pro/" rel="nofollow">Platinus Script Pro</a></strong> family comes in two weights, each loaded with alternates and Latin-based langauge support, for more than 570 characters per font. Platinus Script Pro is great for product packaging, as well book covers, menus and greeting cards.</p>
    <p><strong><a href="http://www.myfonts.com/fonts/sudtipos/platinus-script-pro/" rel="nofollow">Platinus Script Pro</a></strong> is another addition by Koziupa &amp; Paul to the <strong>Sudtipos Collection</strong>.</p>
    <p>Get <strong><a href="http://www.myfonts.com/fonts/sudtipos/platinus-script-pro/" rel="nofollow">Platinus Script Pro</a></strong> at<br>
    <a href="http://www.myfonts.com/fonts/sudtipos/platinus-script-pro/" rel="nofollow">www.myfonts.com/fonts/sudtipos/platinus-script-pro/</a></p>
    <p>Visit us at<br>
    <a href="http://www.sudtipos.com" rel="nofollow">www.sudtipos.com</a></p>
