      <p>FOR IMMEDIATE RELEASE<br>
    Typeradio press announcement<br>
    The Hague - 04 April 2007</p>
    <p></p><div class="imageWrap"><img src="/web/20080820040711im_/http://typophile.com/files/typ-rad_4035.jpeg"></div><p></p>
    <p><strong>TYPERADIO — THE SWEET 16 SESSION</strong></p>
    <p>A 16 hour non-stop radio session on the 16th of May, broadcast worldwide from the 10th floor of the ‘Haus des Reisens’ at Alexanderplatz, Berlin. A 16 hour countdown to TypoBerlin 2007.</p>
    <p>In the recent years Typeradio has travelled to international design meetings in Helsinki, Berlin, New York, Lisbon, Vienna, San Francisco &amp; Bologna to meet designers and to talk to them.</p>
    <p>In January 2006 the very first Typeradio show in the 4th dimension took place, featuring the translating bear, the legendary Colour Girl, MC Rick Vermeulen &amp; MC Loudmouth. Since then Typeradio has performed this ‘radio-in-the-4th-dimension’ show at various locations and events, with a very different international line-up.</p>
    <p>May 2007, and it’s time for the next step. Welcome to <strong>SWEET 16,</strong> the live 16 hour radio marathon on the 16th of May. <strong>SWEET 16</strong> will present and interview 16 international guests (designers, artists, creative, architects), dealing with type and design in a very diverse way. To give you a glimpse of the line-up, here a few who already have been confirmed:</p>
    <p><strong>Justus Oehler:</strong> Pentagram, Partner.</p>
    <p><strong>Malcolm Garrett:</strong> widely regarded as a key influence on the development of contemporary UK graphic design and a pioneer of digital design. Malcolm Garrett made his name as a record cover designer, working with the Buzzcocks, and later established his own design company Assorted Images which produced similarly renowned pieces for Duran Duran, Cultu<!--
