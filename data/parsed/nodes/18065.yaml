    <p>Hi.<br>
    Im not very experienced in font building, and hope on somebodies help.<br>
    The goal was to prepare national (abkhazinan)fonts based on modern technological principles - Unicode and Open Type. So I make a font and indicates all glyphs according their unicode indexes (abkhazian characters are part of cyrrilic coderange and complitely regestered in Basic Multilingual Plan of Unicode Concorcium). After generating font file and installing in Windows XP system (I use MKLC for national keyboard layout) almost everything is OK in MS Office - I can see and type all abkhazian characters but when I use  Photoshop or Illustrator or Corel Draw I can type only cyrillic characters and one more abkhazian letter Dje (040F, 045F) which is ocasionaly the part of 1251 cyrillic codepage.<br>
    The same situation win Adobe CS applications but I dont use CS2.<br>
    Why.<br>
    Thanks, Akhra.</p>
