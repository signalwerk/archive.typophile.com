    <p>Hello, </p>
    <p>This is my first time posting but I've been browsing for a long time and I just wanted to say you guys are amazing! I'm a design student working on a film festival poster right now for Jean-Luc Godard. My logo type uses <a href="http://new.myfonts.com/fonts/k-type/poster-sans/" rel="nofollow">Poster Sans</a> and I was trying to find a supporting typeface or family that pairs well with it, preferably sans serif (which I understand is hard to do successfully). I really appreciate it!</p>
    <p>-Nick</p>
