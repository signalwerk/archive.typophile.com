    html: |-
      <p>UFO is an open font format for interchanging font data between different font tools. You need to install RoboFab to use it. Among other things, it adds Python scripts to FontLab that allow it to read and write to the UFO format.</p>
      <p>You can get it here: <a href="http://robofab.org/" title="http://robofab.org/">http://robofab.org/</a></p>
