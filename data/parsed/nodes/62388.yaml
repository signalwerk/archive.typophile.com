  html: |-
    <p>Hello all, </p>
    <p>I have designed three fonts recently in FontLab, a family of reg/ita (A-B), plus one other font (C). </p>
    <p>When I generate OT fonts and install on my Mac via Fontbook, all is normal, but on my laptop, fontbook gives me a warning that the fonts are corrupt and may crash the system. I have ignored it and installed, and the fonts work normally. </p>
    <p>When I mailed the fonts to my laptop instead of transferring on a USB keyring, there was no warning. </p>
    <p>I then mailed the fonts to two friends. One, using Fontbook, installed the A-B font without any problems but got a crash warning on the C font. The other friend, using Suitcase, installed the C font painlessly whereas the A-B font did not show up at all in Suitcase.</p>
    <p>In short, problems seem to occur randomly. Can anybody help?</p>
    <p>Regards, Per Jørgensen</p>
