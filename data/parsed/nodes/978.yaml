  html: <p>I'm trying to get a screencap, but let's see if anyone can get it with a verbal description. <br> <br>This was used in the titles for the movie Roger Dodger (not on the advertising material). It's an extended sans serif with a light, engraved feel (� la <a href="http://www.myfonts.com/fonts/agfa/burin-sans/"> Burin Sans</a>), but it has a two-storey g. It reminded me somewhat of Orange Italic's <a href="http://www.orangeitalic.com/luxury/collect02.html"> Gold</a>, but I believe there exist more than one width. Seems like the same typeface was used to set the music information in the credits, but it had a normal width. <br> <br>I'll try to take some screencaps.</p>
