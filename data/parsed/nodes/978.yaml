    html: "<p>It's Trade Gothic, dammit. Thanks to scoles for this one. I sometimes forget this sucker has a two-storey g (never see the lowercase), and the film softened it to the point where the terminals looked round. That's enough excuses. <br> <br>As Stephen puts it: \"Trade Gothic is like the American Robin to the birdwatcher: always taunts, always pretends to be something more exciting, until on further inspection, we find it's just the same old thing\"</p>"
