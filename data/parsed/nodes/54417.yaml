    html: |-
      <p>sIFR has documentation for taking a few small steps to protect the fonts that you've embedded in the .swf files that it uses:</p>
      <p><a href="http://wiki.novemberborn.net/sifr/Protecting+Commercial+Fonts" title="http://wiki.novemberborn.net/sifr/Protecting+Commercial+Fonts">http://wiki.novemberborn.net/sifr/Protecting+Commercial+Fonts</a></p>
      <p>...the idea being to allow only your website to access the .swf file that contains the font so that other sites can't just point themselves to the file and use it too. These are very likely the security precautions that those foundries may have been talking about (but double check with them to be sure).</p>
      <p>Andy</p>
