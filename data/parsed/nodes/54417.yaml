  html: <p>I lack the necessary knowledge on the subject, so I thought I'd ask. I'm looking at buying Bryant Condensed from Process and an employee of the foundry explained that I can use sIFR on a website if the files are secure (she did mention this was the short answer!). I don't want to be in violation of the EULA. How do I make sure the files cannot be downloaded?</p>
