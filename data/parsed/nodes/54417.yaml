    html: |-
      <p>Thank you all for your responses.<br>
      I guess I have to ask for the long answer concerning embedding with sIFR. I must say my position as consumer is rather frustrating. While their EULA did not seem overly limiting, it looks like it isn't clear enough either. With the current limitations of web typography, methods like sIFR (or @font-face) are a breath of fresh air. But are they secure? Here's the paragraph from the EULA that regulates embedding (<a class="freelinking external" href="http://www.processtypefoundry.com/help/ptflicense.html" rel="nofollow">Link</a>).</p>
      <p>&gt;Embedding of the Fonts into web pages or digital documents is permitted only in a secured, read-only mode. You must ensure that recipients of such web pages or documents cannot extract, install or use the embedded Fonts. The creation of new documents using an embedded copy of the Font Software is expressly prohibited. You further agree not to change or alter the embedding bits or other restrictions of the embedding programs within the Font Software itself.</p>
