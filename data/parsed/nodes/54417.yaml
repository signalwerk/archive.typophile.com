    html: |-
      <p>I think I can clear this up.</p>
      <p>First, thanks Dan for taking the time to understand our EULA and investigate whether it meets your needs before you purchase. That's really a best-case scenario.</p>
      <p>If you are to follow the advice that Andy linked to about protecting the files/font, then you should be within the bounds of our EULA and we would have no issue with that usage.</p>
      <p>Towards the notion of security. 'Secure' is difficult to define. There are few methods of font usage that are 100% secure, so we cannot expect a customer to keep our fonts 100% secure. Even in the print world, simply giving the file to a service bureau (which is allowed in our EULA) is not necessarily secure. But, we've tried to strike a balance between protecting our work from unreasonable, unlicensed distribution and giving customers usage rights that do not unduly burden their use of the fonts.</p>
      <p>So, we don't expect a customer to 'guarantee' the security of the fonts, which is simply not possible, but we do expect that they take reasonable measures to protect the fonts when they use them in ways that potentially put them at risk of unlicensed distribution.</p>
      <p>Nicole, Process Type Foundry</p>
