    votes: null
    html: <p>sIFR is about as protective as using straight-up images - someone could theoretically trace your letter shapes from any posted image. With a SWF the only difference is that the vectors could potentially be decompiled from the SWF (or like someone running autotrace on your lettershapes). But no metrics would be available. And you can subset the amount of glyphs that are embedded within the SWF, thus reducing even more what could potentially be pulled out of the SWF. At any rate, anyone going through that much effort to "pull" a font from a SWF values their time much more differently then I would.</p>
    html_clean: <p>sIFR is about as protective as using straight-up images - someone could theoretically trace your letter shapes from any posted image. With a SWF the only difference is that the vectors could potentially be decompiled from the SWF (or like someone running autotrace on your lettershapes). But no metrics would be available. And you can subset the amount of glyphs that are embedded within the SWF, thus reducing even more what could potentially be pulled out of the SWF. At any rate, anyone going through that much effort to "pull" a font from a SWF values their time much more differently then I would.</p>
