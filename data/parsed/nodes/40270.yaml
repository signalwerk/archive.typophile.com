  html: |-
    <p>"What started out as a typographic exercise to produce the logotype for TypeTrust turned out to be the product of obsession. Epic is the culmination of two years of work that has yielded a versatile and respectful contemporary garalde.</p>
    <p>"With a full complement of six weights and true italics, the Epic Complete family offers itself as a true workhorse for typesetting while ensuring visual interest as an effective headline face with the numerous standard and discretionary ligatures, majuscule ligatures, stylistic alternates and swash characters available."</p>
    <p><a href="http://typetrust.com/fonts/specimen_pdfs/TypeTrust-Epic.pdf">Download the Epic PDF.</a></p>
    <p><strong>Epic is available exclusively through <a href="http://typetrust.com">TypeTrust.com</a> at a 50% discount until January 21, 2008.</strong></p>
    <p><strong><a href="http://typetrust.com/font/epic">Epic Complete</a><br>
    $145 With Discount</strong><br>
    Regular Price : $290<br>
    12 fonts : Thin, Book, Normal, Medium, Bold, Ultra &amp; Italics</p>
    <p><strong><a href="http://typetrust.com/font/epic-a">Epic Pack A</a><br>
    $50 With Discount</strong><br>
    Regular Price : $100<br>
    4 fonts : Normal, Bold &amp; Italics</p>
    <p><strong><a href="http://typetrust.com/font/epic-b">Epic Pack B</a><br>
    $100 With Discount</strong><br>
    Regular Price : $200<br>
    8 fonts : Thin, Book, Medium, Ultra &amp; Italics</p>
