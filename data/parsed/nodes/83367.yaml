      <p>Concerning the actual translation:<br>
      1) If you need a very good Italian translator let me know and I'll put you in touch. Plus she's in NYC which is more convenient (not least ideologically :-) than Italy.<br>
      2) As Riccardo says Italian takes up more space on average (actually Italian isn't bad, it's that English is very compact) <em>plus</em> translation typically expands the text length too; so you're looking at around 15% more text. When I translated David Rault's Excoffon book* from French to English I tried very hard to be compact but I still ended up only slightly shorter (I mean even though English is more compact than French).</p>
      <p>* <a href="http://www.adverbum.fr/roger-excoffon-rault-david-atelier-perrousseaux_ouvrage-perrousseaux_4itkob6k386b.html" title="http://www.adverbum.fr/roger-excoffon-rault-david-atelier-perrousseaux_ouvrage-perrousseaux_4itkob6k386b.html">http://www.adverbum.fr/roger-excoffon-rault-david-atelier-perrousseaux_o...</a></p>
      <p>hhp</p>
