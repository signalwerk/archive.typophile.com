    <p>An interesting debate at work:</p>
    <p>Do you design a page on the established template (Header, body copy, pictures, key-lines, page numbers, etc.) and NOT worry about kerning the type at the moment since it will be translated(to our Italian market)? Then revisit type for our market later.</p>
    <p>OR</p>
    <p>Do you design a page on the established template and kern the type— asking the copy writers to add or subtract words, looking for rivers and widows, but causing the other offices to wait before translation. Your type is tasty and your job is done.</p>
    <p>/////</p>
    <p>I'm in the boat of getting it right the first time, setting the example for quality to the other office. Plus why not send the .doc file to Italy for translation first?</p>
    <p>My boss, however, wants to give them everything all at once, as long as the design elements are locked in, and we can tweak copy as the deadline gets closer. He likes to get things off his plate as quickly as possible.</p>
