      <p>Arabic is indeed extremely compact (and as far as I'm concerned dropping short vowels when they're obvious* is a great thing). BTW, a great reference for this stuff is Sadek &amp; Zhukov's "Typographia Polyglotta" - although you shouldn't get me started about its concluding paragraphs...</p>
      <p>* And in a consonantal language family like Semitic they generally are.</p>
      <p>hhp</p>
