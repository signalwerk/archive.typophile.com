      <p>I think your boss needs to just understand a little bit more about how translation works. Designing for another language is difficult enough to begin with, let alone trying to work out the finer issues with the text. I'd give the translators your general template, and possibly some guidelines for where you'd like things to fit. If you have it set, you put a lot on the translators--their jobs are hard enough as is, let alone with the stress of trying to fit something into your exact parameters.</p>
      <p>Riccard0 also has a point: Italian text is going to look very different from the English text.</p>
