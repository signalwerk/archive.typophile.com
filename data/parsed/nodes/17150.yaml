      <p>good point regarding the detailing of the "S" and "s". I vote for a gap top and bottom with a solid middle section. Acheive the stencil aesthetic while retaining the beautiful, curving portion of the "S" glyphs.</p>
      <p>I also like the notches. It made me think that there is an imaginary stencil cutter that has a little quirck in the mechanics that occasionaly causes a little divit to appear in the letter forms.</p>
      <p>I am an exhibit designer. I am always interested in type which has small details that come out when the type is used very large. Small details keep giant type from feeling cartoony when the visitor is closer.</p>
