    <p>I started this display type some weeks ago, and it has turned from a slab serif into a stenciled slab. I still work on the original.</p>
    <p>My intensions was to gather some of the things and charactistics i like from diffrent slab's and make my own interpretation of it - including my additions to make it more modern. It's not a diffinate display type, and will, in it's original form (the slab) work for text on print as well.</p>
    <p>What do you guys, gods and goddesses think?</p>
    <p>I just made a quick specimen for critics - not very nice ;)</p>
    <p>/Benjamin</p>
