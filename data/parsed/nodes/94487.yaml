  html: |-
    <p>Hello everyone,</p>
    <p>I have to admit I am a little confused about this font embedding theme for what concerns a website made in html, Javascript ecc.</p>
    <p>Obviously there are now diverse font services as „web type“ (<a href="http://www.webtype.com" title="www.webtype.com">www.webtype.com</a>) to give only an example.</p>
    <p>What I’d like to do is to embed my own font reliable into my homepage hosting it for myself on my server.<br>
    Is this possible and if yes, how is it to be done exactly.</p>
    <p>I am not interested in giving the user browser various font alternatives to use, I know how this works.<br>
    I want my font to be seen and none else.</p>
    <p>If it is possible to do so via alien servers it has to be possible storing the font data by oneselves.<br>
    Or am I wrong here?</p>
    <p>Thanks for your comments and ideas.<br>
    Script excerpts are obviously welcome!</p>
    <p>Salutes<br>
    Stefan</p>
