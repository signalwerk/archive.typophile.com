    <p>Part of the <a href="/node/13514" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Helvetica</a> Family</p>
    <p>Current <span class="caps">URL</span>:<br><a href="http://store1.adobe.com/cfusion/store/html/index.cfm?store=OLS-US&amp;event=displayFontPackage&amp;code=175">http://store1.adobe.com/cfusion/store/html/index.cfm?store<span class="caps">=OLS</span>-<span class="caps">US</span>&amp;event=…</a><br><a href="http://www.veer.com/products/typedetail.aspx?image=ADT0003257">http://www.veer.com/products/typedetail.aspx?image<span class="caps">=ADT0003257</span></a><br><a href="http://www.linotype.com/13208/helveticaroundedbold-font.html?CMP=NjR8Mjkz">http://www.linotype.com/13208/helveticaroundedbold-font.html?<span class="caps">CMP</span>=NjR8Mjkz</a><br><a href="http://www.fonts.com/findfonts/detail.htm?pid=202046">http://www.fonts.com/findfonts/detail.htm?pid=202046</a><br><a href="http://www.fontshop.com/fonts/singles/linotype/helvetica_rounded_bold/">http://www.fontshop.com/fonts/singles/linotype/helvetica_rounded_bold/</a><br><a href="http://www.itcfonts.com/fonts/detail.htm?pid=202046&amp;AID=5529319">http://www.itcfonts.com/fonts/detail.htm?pid=202046&amp;<span class="caps">AID</span>=5529319</a></p>
    <p>Designed by <a href="/node/13515" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Max&nbsp;Miedinger</a></p>
    <p>Published by <a href="/node/13428" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Adobe</a> <span class="amp">&amp;</span> <a href="/node/13697" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Linotype</a></p>
    <p>The basic design of Helvetica Rounded is the same as the design of the normal Helvetica fonts. The only difference is that the stroke endings of Helvetica Rounded are rounded rather than squared. The overall effect of this display type is more playful than its traditional relative. The original Helvetica design was created for the Haas Type foundry in Switzerland and further developed by the Stempel Type foundry and by Linotype. Based on earlier Grotesque designs, Helvetica brought a new level of mathematical accuracy to the sans serif genre. Helvetica™ is a trademark of Linotype Corp. registered in the <span class="caps">U.S.</span> Patent and Trademark Office and may be registered in certain other jurisdictions in the name of Linotype Corp. or its licensee Linotype&nbsp;GmbH.</p>
