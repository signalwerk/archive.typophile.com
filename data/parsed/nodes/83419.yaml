    <p>I really hope I'm putting this in the right place. Feel free to chew me out and move it if it's not, sorry!</p>
    <p>I was at a high school journalism conference at the University of Texas last weekend, and in the class I was in, we were given the opportunity to design a random page. So, the page I designed is one that I've had rolling around my head for quite some time; basically it was a feature page on student artists. For this, I decided to find a nice, messy, handwriting font for the headlines. Now, we were on UT's macs in their journalism room, so I didn't have access to the fonts I usually would have sprung for, but I settled on a nice font called Handwriting Dakota. When I got home, I started googling around to find more out about this font and I couldn't find anything. I don't know where it came from, or where I could get it to use again if I wanted.</p>
    <p>I'm going to post a sample of it, I'm curious to see what you guys think of it. It's, so far, my favorite messy, handwriting font I've been able to find. Are there other ones you guys like more? </p>
    <p>Here's a random sample (it's even hard to find samples of it!): <a href="http://2.bp.blogspot.com/_YISIpG_ed7o/SFqWFrIXO3I/AAAAAAAAAP4/LxrTQaHc0AY/s400/mind-dont-matter.gif" title="http://2.bp.blogspot.com/_YISIpG_ed7o/SFqWFrIXO3I/AAAAAAAAAP4/LxrTQaHc0AY/s400/mind-dont-matter.gif">http://2.bp.blogspot.com/_YISIpG_ed7o/SFqWFrIXO3I/AAAAAAAAAP4/LxrTQaHc0A...</a></p>
    <p>While I'm at it, I'm super new, could someone tell my how to embed a photo, instead of just posting a link?</p>
    <p>Thanks guys :]</p>
