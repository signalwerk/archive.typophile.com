    html: |-
      <p>That Dakota font is from the old ClickArt collection called Handwritten Fonts. I'm familiar with this collection because my hand printing sample became "Bowfin" in that collection. There was a company called Signature Font, I think,  that turned your printed sample into a font for around $50 back in the mid-1990's and they sent some of us letters requesting permission to use our fonts in a collection they were compiling for Click Art. As our payment, we got a free copy of the font CD when it was released.</p>
      <p>As  far as I know, besides Dakota being used by Apple, the collection is still available embedded with other ClickArt collections that are sold by Broderbund. </p>
      <p>The 'alias names' were from a WSi collection that had copied and renamed the ClickArt fonts. They distributed their renamed copies to other vendors to sell, until eventually I think they were told to cease and desist using fonts that were not their own. I'd like to think I was one of the people who blew the whistle on them, because Precision Type was starting to offer the renamed collection by WSi and I wrote to Precision Type and explained the history. They were immediately withdrawn from sale.</p>
      <p>- Mike Yanega</p>
