    html: "<p>Something I often suggest to potential clients with limited budgets is to approach local design schools with their project proposals.  Some schools will take on business projects as class efforts, give design students school credit for taking on such work, or suggest student designers who might be able to work within the client's budget limitations. <br> <br>On the topic of \"spec\" work the following article offers some good information: <br> <br><a href=\"http://www.creativelatitude.com/articles/articles_cb_spec.html\" target=\"_blank\">http://www.creativelatitude.com/articles/articles_cb_spec.html</a> <br> <br>Jeff Fisher <br>Engineer of Creative Identity <br> <br>Jeff Fisher LogoMotives <br><a href=\"http://www.jfisherlogomotives.com\" target=\"_blank\">http://www.jfisherlogomotives.com</a> <br> <br></p>"
