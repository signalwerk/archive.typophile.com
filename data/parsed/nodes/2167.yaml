  html: <p>There are several graphic design websites where I can go, post a dollar amount and a project overview, and people will post competing entries. I can then give feedback on the entries, and they'll be revised, altered, etc., until the deadline comes, at which point I pick a winner and they receive the cash. <br> <br>Is there anything like that for typography, possibly on this forum?  (It might be here and I'm just not seeing it...) <br> <br>There's a huge amount of talent here. I'm currently rebranding my firm, and I'd much rather have something designed by typographers than just graphic designers. <br> <br>Any suggestions? <br> <br>Thanks, <br>James</p>
  html_clean: <p>There are several graphic design websites where I can go, post a dollar amount and a project overview, and people will post competing entries. I can then give feedback on the entries, and they'll be revised, altered, etc., until the deadline comes, at which point I pick a winner and they receive the cash. <br> <br>Is there anything like that for typography, possibly on this forum?  (It might be here and I'm just not seeing it...) <br> <br>There's a huge amount of talent here. I'm currently rebranding my firm, and I'd much rather have something designed by typographers than just graphic designers. <br> <br>Any suggestions? <br> <br>Thanks, <br>James</p>
