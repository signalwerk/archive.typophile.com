    date: 2003-11-21T09:34:00
    date_raw: 21 Nov 2003 — 9:34am
    votes: null
    html: <p>James, a lot of graphic designers (and all major design associations) <i>do</i> frown on spec work. It devalues the work, invites amateurism, and opens the artist to all kinds of intellectual-property vulnerabilities. Design contests are often tolerated when run by nonprofit organizations, but that's about it. <br> <br>Good design involves more than just coming up with a neat idea. It requires research, investigation, and getting to know the client. If you want good design, hire professionals and pay them for their time and work. </p>
