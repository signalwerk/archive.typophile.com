  html: |-
    <p>I've seen this nice light extended slab serif typeface on 50s-60s signage, parking garages, schools, libraries, and old wood type block printing, but could never identify it! It's not Adore, Memphis, Serifa, Egyptienne, Beton... but it kind of resembles an extended Stymie, especially with the pointy bottom of the "N". I used to admire it daily on my way to the A Train in Bed-Stuy on a school on Malcolm X Blvd.</p>
    <p>thanks all,<br>
    Scott<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/light_slab_serif_retro_4169.png"></div><p></p>
