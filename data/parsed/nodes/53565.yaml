  html: |-
    <p>Here is a logo and some preliminary designs for stationery for a company providing high class programme for companies, events etc. The companys main focus is in performing arts and especially dance.</p>
    <p>The idea is to silkscreen-print the business card in white to black cardboard. The letterhead is black on the other side with reflected logo (which can be faintly seen on the other side). </p>
    <p>The logo is based on avant garde and the idea is to communicate professionalism and to separate the company from the others in the field. </p>
    <p>Any comments are welcome!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/movingarts_4608.jpg"></div><p></p>
