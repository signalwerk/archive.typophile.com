      <p>From the <a href="http://typophile.com/forums/typeid/faq/" rel="nofollow">FAQ</a> page:</p>
      <p><a href="forums/typeid/faq/#Q_10" rel="nofollow"><strong>The subject line of my thread has been changed.</strong></a><br>
      There's two possible reasons for that.<br>
      <strong>One</strong> | The name you gave to your thread was very vague so we changed it into something better defined. This makes it easier for our type IDers to keep track of the different threads.<br>
      <strong>Two</strong> | Your sample has been identified. Your thread gets tagged and we include the name of the typeface(s) you were looking for and the name(s) of the person(s) who IDed it/them for you. That way we don't need to needlessly open threads to check if there's still need for our services.</p>
      <p>See reason 1. ;^)</p>
