    html: |-
      <p>Awesome, thanks so much for the feedback guys. As always it's much appreciated.</p>
      <p>To provide a little perspective, I've uploaded a picture of how this layout is actually being used in the "real" elevator environment:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/elevator_panel_rendered_3682.png"></div><p></p>
      <p>With this image in mind, I'd like to respond to the comments so far. And I apologize in advance; I'm sure this will all sound like very transparent rationalization and excuse-making. :)</p>
      <p>1) The counters aren't being filled in for a stylistic reason, or at least not for a "directly" stylistic reason. As I think is clearer in the supplied image, the buttons are intended to have a very industrial, precision-machined feel to them, and casting them in a single piece of metal conveys that better than including separate, floating pieces in the counters. With the metal finish and the backlighting behind each button, I hope this looks more like a deliberate decision on a manufacturing level, if not a typographical one.</p>
      <p>2) I really appreciate the version of the layout with the skewed numerals. I agree, the layout is much more stable and consistent that way, and certainly easier to align/balance. Ultimately, though, one of my favorite parts of the diagonal buttons is the way the non-diagonal numerals contrast in their directions; alignment headaches aside, I think the vertical numerals generate interesting intersections with the angled edges of the buttons. The numbers almost appear to be "emerging" or "rising up" from the bottom of the buttons, rather than "sinking" along with them. For an elevator, I think this is an appropriate connotation.</p>
      <p>Also, on a purely optical level, I want to avoid the typical artifacts that affect the curves of algorithmically skewed letterforms.</p>
      <p>3) William's comment about the right alignment being problematic and unnecessary is true and not really one I can argue against. However, this was another case where I found the center alignment a bit bland (with the exception of "HELP", where it was simply unavoidable and, in my opinion, an acceptable exception since it's the one non-numeral). The right alignment, which I agree is a minefield and not hugely obvious in its necessity, ties back into the underlying elevator notion of up/down motion; my intent was to create a sense of lift in each letter, and by pushing the numerals to the highest point within each button (which just happens to be the right side), I think I capture a little more of that. In a lot of ways they almost resemble a person riding an escalator, which isn't EXACTLY appropriate for an elevator, but close enough. :)</p>
      <p>In other words, everything above is my way of saying that while I agree with all the practical and aesthetic arguments against the layout, these decisions play too heavy a role in my conception of the elevator concept to abandon, leaving me no choice but to make the best of them. So I've made some slight modifications to the 1/4/7 column that I think balance things out about as well as can be expected given the admittedly stubborn requirements listed above. In particular, the /1/ and /4/ numerals are now centered with the /7/ beneath them.</p>
      <p>There's probably still a lot to nitpick about the exact placement of everything, but I think overall this works well enough. Considering how awkward the premise of the layout is to begin with, "good enough" seems acceptable to me.</p>
      <p>Lastly, you'll notice that unlike the buttons, the array of 7-segment displays (the digits on the screen) is slanted along with the shape of the screen itself. This is arguably a pretty blatant inconsistency, so I'm going to experiment with a non-slanted version. (I just wanted to point that out preemptively :)</p>
      <p>Anyway, this process was extremely helpful, even if we don't have the same ultimate opinion on things, so thanks again! I really do appreciate the feedback either way. Additional commentary is still welcome, btw.</p>
