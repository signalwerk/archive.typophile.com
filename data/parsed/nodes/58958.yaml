      <p>Tiffany's custom typeface, Sterling, was designed by Hoefler &amp; Frere-Jones. See <a class="freelinking external" href="http://designarchives.aiga.org/entry.cfm/eid_640" rel="nofollow">this page</a>. I'd guess this logo was derived from these letters and possibly done for them by H&amp;FJ.</p>
      <p>- Mike Yanega</p>
