    html: |-
      <p>Well that's the thing, I've looked through XP and Office EULA's and they don't explictly state your right to use with the fonts.  I don't think Word 2003 even mentions fonts in the EULA, but 2007 gives a sentence that's really vague.</p>
      <p>I even asked a few questions to font licensing companies (and MS, but no response yet).  One company told me I needed to buy an additional license because the license I got for using MS fonts only applied to personal use.  Another said I was okay under MS's license and did not need further licensing unless I was sharing fonts, etc.  Which seems to be the real issue in font licensing from what I can tell.</p>
      <p>I did notice that the embedding license restrictions seems to kinda spell out usage, for exporting and so on.  I guess I'll have to go by that.</p>
      <p>I just want to play it straight, not violate anyone's rights, and compensate people where necessary.  You'd think MS and other companies would kinda spell things out a bit more...</p>
      <p>The last thing I want to do is get my project finished after what seems like an eternity, start selling it, and end up with a lawsuit over something that can be so ambiguous.</p>
