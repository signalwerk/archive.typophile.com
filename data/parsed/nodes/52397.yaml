    <p>Ok, so now I'm a bit lost.</p>
    <p>I'm pretty new to the concept of font licensing.  I'm working on my first commercial project, a small, animated film, incorporating fonts I found in Microsoft and Adobe fonts. </p>
    <p>The film itself uses a lot of text with varying fonts in certain spots and if we were to sell t-shirts of the characters, it would have to include some of these fonts as they are a part of the characters.  It probably sounds stupid, but it makes sense in the context of the show.</p>
    <p>Anyway, the fonts will only be used in a film and printed format.  Maybe in a logo as well.  But never distributing fonts for use by other users, etc.</p>
    <p>I can't seem to get a straight answer if I can legally use these fonts without further licensing in this way.</p>
    <p>Any advice would be appreciated.  Thank you.</p>
