    html: |-
      <p>“c. Font Components. While the software is running, you may use its fonts to display and print content. You may only<br>
      • embed fonts in content as permitted by the embedding restrictions in the fonts; and<br>
      • temporarily download them to a printer or other output device to help print content.”</p>
      <p>What's not clear about this is after you view the permissions of the fonts in the MS viewer, what they really mean.  Even the most permissive use doesn't exactly spell out the full extent of the use permitted.  Also in Word 2003, there's much less in the EULA regarding fonts.</p>
      <p>But I got an answer back from MS though which did clear things up:</p>
      <p>"Providing the fonts, or derivative fonts, are not being redistributed, commercial use of the fonts supplied with Microsoft software is permitted."</p>
      <p>That's good enough for me.  It would probably help if they put that on their website...</p>
      <p>As for consulting a lawyer, I did speak to some through my day job and through friends and while none thought it would require further licensing, none could give a definitive answer.</p>
