    <p></p><div class="imageWrap"><img src="http://typophile.com/files/mustache_main_6713.jpg"></div><p></p>
    <p>CMD: Your head head exists only as a home for your mustache.</p>
    <p>CS: That is a tshirt quote…</p>
    <p>CMD: stop saying im stealing stuff. im not.</p>
    <p>CS: no… i mean I want to make that into a shirt</p>
    <p>CMD: i’ll push you into the sea if we’re both ever near it at the same time. is that a good tshirt idea too?</p>
    <p>CS: yes, but not as good</p>
    <p>Quote as shown above by Cheaply Made Dreamland becomes the next Chop Shop tee with the illustrative stylings of Chris Piascik.</p>
