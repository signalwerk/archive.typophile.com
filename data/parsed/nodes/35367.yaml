      <p>I think "calligraphy is calligraphy" does more harm than good in multi-script type design. That said, I certainly agree there's no harmony there. My point:<br>
      Ἁρμονίη ἀφανὴς φανερῆς κρείττων.<br>
      The hidden harmony is superior to the obvious one.<br>
      –Heraclitus</p>
      <p>hhp</p>
