  - id: 598375
    user: 205259
    date: 2015-01-29T03:31:00
    date_raw: 29 Jan 2015 — 3:31am
    votes: null
    html: |-
      <div class="comment-spam-body"><p>This looks like an embroidery font that does not seem to match any retail font.<br>
      It seems to have been based on 19th century fonts styles ranging from "Antique" [Egyptian] to Clarendon.<br>
      The serif treatment on _S_ seems to be the key to the source fonts.<br>
      Perhaps the closest source might be Kinghorn 205 Med  </p><div class="imageWrap"><img src="http://typophile.com/files/Kinghorn205MedAsHMNZS_4685.gif"></div> <a href="http://www.myfonts.com/fonts/talbot/kinghorn-205/" title="http://www.myfonts.com/fonts/talbot/kinghorn-205/">http://www.myfonts.com/fonts/talbot/kinghorn-205/</a> which has  strokes and serifs all of a roughly equal weight similar to the lettering in the Cap Tallie. There is also a condensed version.<br>
      The reverse contrast -- top and bottom thicker than sides -- shown in the top of _S_ in the Cap Tallie might be a quirk of that the digital instructions for that letter.<br>
      Also consider Antique Central Heavy  <div class="imageWrap"><img src="http://typophile.com/files/AntiqueCentralHeavyAsHMNZS_5180.gif"></div>  <a href="http://www.myfonts.com/fonts/aboutype/antique-central/" title="http://www.myfonts.com/fonts/aboutype/antique-central/">http://www.myfonts.com/fonts/aboutype/antique-central/</a><br>
      if you want reverse contrast you could consider <div class="imageWrap"><img src="http://typophile.com/files/PTBarnumAsHMNZS_5815.gif"></div> <a href="http://www.myfonts.com/fonts/bitstream/p-t-barnum/" title="http://www.myfonts.com/fonts/bitstream/p-t-barnum/">http://www.myfonts.com/fonts/bitstream/p-t-barnum/</a> which suggests the _S_ but the vertical strokes are too thin.<br>
      Don<p></p>
      </div>
