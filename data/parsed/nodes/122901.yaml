      <div class="comment-spam-body"><p>The best match would be a Clarendon with strokes and serifs all of a roughly equal weight, which would differ from an Antique or Egyptian in that some of the terminals, such as those in _E_ and _L_, are tapered.<br>
      Part way there is Patrick Griffins Clarendon Text Bold<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/ClarendonTextBoldAsHMNZS_4966.gif"></div> <a href="https://www.myfonts.com/fonts/canadatype/clarendon-text/" title="https://www.myfonts.com/fonts/canadatype/clarendon-text/">https://www.myfonts.com/fonts/canadatype/clarendon-text/</a><br>
      Don<p></p>
      </div>
