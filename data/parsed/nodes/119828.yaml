  html: |-
    <p>I posted here for the first time a couple of weeks ago, asking for some technical recommendations for creating a typeface from some letters I had designed. I have not designed a typeface before now; this is my first attempt.</p>
    <p>The replies I received were helpful, so I thought I would share the result:</p>
    <p><a href="http://www.danielmitsui.com/00_misc/benedict_sample2.jpg">http://www.danielmitsui.com/00_misc/benedict_sample2.jpg</a><br><a href="http://www.danielmitsui.com/00_misc/benedict_sample.jpg">http://www.danielmitsui.com/00_misc/benedict_sample.jpg</a></p>
    <p>I am an artist who specializes in ink drawing, mostly in the style of 14th &amp; 15th century illuminated manuscripts. I am working to publish my own illustrated versions of blockbooks from that era; this typeface is what I intend to use for these projects. </p>
    <p>I wanted something that marries well to a late Gothic drawing style, but is more readable to modern eyes than blackletter.</p>
