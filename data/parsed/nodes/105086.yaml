      <p>It is very frustrating trying to find bibliographical information for any Stamperia Valdonega publications: almost all attention is directed to the more prestigious hand press operation of the Officina Bodoni.</p>
      <p>There is a 1992 Grolier Club exhibition catalogue, celebrating the centenary of Mardersteig's birth, which might contain the information you seek. The exhibition included books from both presses. The full title is <em>The Officina Bodoni &amp; the Stamperia Valdonega : an exhibition marking the 100th anniversary of the birth of Giovanni Mardersteig.</em></p>
