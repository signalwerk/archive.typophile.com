      <p>The German text appears to be something else that Mardersteig said, not the quotation being sought. It begins: "A book consists of five elements: the text, the typeface, the ink, the paper, and the binding".</p>
      <p>EDIT: Ah, here we are. First, find the German word for self-will in Google Translate, then search for it together with Mardersteig -</p>
      <p>Als erstes diene dem Autor, suche die beste Lösung für die Wirkung seines Themas. Als zweites diene dem Leser, mache ihm die Lektüre so angenehm und leicht wie möglich. Als drittes gib dem Ganzen ein anziehendes Gewand, ohne zu eigenwillig zu sein.</p>
