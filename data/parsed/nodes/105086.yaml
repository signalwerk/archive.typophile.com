      <p>Maxim,</p>
      <p>Mardersteig's "Credo" statement from 1929  reads very different in Italian and German, if compared to that "New Yorker"'s 1970 quotation. Here it is in Italian:</p>
      <p>"Cinque sono gli elementi del libro, ossia testo, carattere, inchiostro carta e legatura. Comporre con questi cinque elementi un tutto coerente e plausibile, non sottoposto alla moda, il cui pregio sia stabile e sciolto dal tempo; comporne delle opere affrancate, per quanto può esser dato a opere fatte da uomini, dagli influssi del capriccio e del caso, e degne dell’alto retaggio di cui siamo depositari e responsabili: questa è la nostra ambizione". (as quoted in Antonio Cavedoni's site: <a href="http://cavedoni.com/2007/02/credo" title="http://cavedoni.com/2007/02/credo">http://cavedoni.com/2007/02/credo</a>)</p>
      <p>And in German:</p>
      <p>"Ein Buch besteht aus fünf Elementen, das sind Text, Schrift, Druckfarbe, Papier, und Einband. Aus diesen Elementen eine Einheit zu schaffen, die selbstverständlich überzeugt, die nicht einer Modeströmung dient, sondern zeitlosen Wert anstrebt, das ist unser Wunsch. Vom Zufall und Laune frei, soweit dies menschliche Bedingtheit vermag, kennen diese Werke nur das Ziel, sich würdig in das hohe Erbe einzufügen, das uns in Hand und Verantwortung gegeben wird". (from Wikipedia)</p>
      <p>Another authoritative Italian source, by the way, is more similar to your quotation; it is taken from Il Polifilo publishing house site, who has edited a great Mardersteig book: <a href="http://www.ilpolifilo.it/storia_txt4.php" title="http://www.ilpolifilo.it/storia_txt4.php">http://www.ilpolifilo.it/storia_txt4.php</a>, and it goes like this:</p>
      <p>Per prima cosa servi l'autore,<br>
      cerca la soluzione migliore<br>
      per rendere comprensibile il testo.<br>
      In secondo luogo servi il lettore,<br>
      rendigli la lettura piacevole e facile.<br>
      In terzo luogo dai a tutto una veste attraente senza essere troppo eccentrico. </p>
      <p>My translation:</p>
      <p>First serve the author,<br>
      find the best solution<br>
      to make the text understandable.<br>
      Secondly serve the reader,<br>
      make his reading experience pleasing and easy.<br>
      Thirdly give the whole a charming look without being too eccentric.</p>
      <p>Hope this helps.</p>
