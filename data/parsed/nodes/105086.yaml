  html: <p>This often-quoted Mardersteig’s motto is quite well known. But when you try to “look it up”, it always comes up in English… Below is a clipping from <em>The New Yorker</em> (Vol. XLVI, No. 21; July 11, 1970, p. 47). Does any of you guys know what it sounds like in the original German? What is its actual source? That “short autobiographical sketch” referred to by Winthrop Sargeant? What was its title? <em>When</em> was it printed?<img src="http://ic.pics.livejournal.com/m_zhukov/967599/41559/41559_original.gif" hspace="0" vspace="18"></p>
