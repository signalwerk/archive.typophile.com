    <p>Hello,</p>
    <p>I'm wondering if you all can help me find some classic looking (think 1960s Jazz record credits/text) font similar to New Century Schoolbook. I have that font but it just seems a little limited. I don't really love the bold and regular versions, so I almost always just use italic. </p>
    <p>Help!</p>
