  html: "<p>Hi all, I had a hard time finding an appropriately close answer to my question elsewhere so I'll ask it outright. My studio is working on a custom sans serif font for a client (lc, UC, #s and punct). We started with just the end product in mind but now the client wants to buy the font outright so no other usage or distribution will be permitted. I have NO idea where to start with pricing something like this out. Any advice would be great. _w</p>"
