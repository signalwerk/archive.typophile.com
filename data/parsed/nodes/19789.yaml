      <p>We had an awesome thread on these issues a year ago entitled <a href="http://www.typophile.com/node/10191" rel="nofollow">the bouma of space craft</a>. See also <a href="http://typophile.com/node/9344" rel="nofollow">Theory of Spacing</a>. [edit: I see William linked the first thread already.]</p>
      <p>Bottom line, Kindersley's ideas are intriguing but seem unlikely to me to result in excellent spacing. Purely geometrical concepts like "moment" seem less useful as the basis for spacing than, say, spatial frequencies, which at least have some relation to the way the human visual system actually works.</p>
      <p>I don't understand the relevance of second and third moments. The standard definitions don't yield a position (as does the first moment), but rather a measure of how far away the "mass" is from the center. I'd probably get a better understanding of what Kindersley meant if I had his paper handy to read.</p>
      <p>Did you see <a href="http://www.spiked-magazine.co.uk/spiked4/holgate.htm" rel="nofollow">this interview</a> with David Holgate, who worked with Kindersley on the spacing research? There's also a <a href="https://listserv.heanet.ie/cgi-bin/wa?A2=ind0109&amp;L=typo-l&amp;T=0&amp;P=7028" rel="nofollow">review</a> by our own hrant. I'm pretty sure one of the threads mentioned above linked <a href="http://www.ics.uci.edu/~eppstein/gina/kern.html" rel="nofollow">this comp.fonts thread</a>, with fascinating input by Chuck Bigelow, John Hudson, and others, as well.</p>
      <p>If you're doing the spacing work by hand, as opposed to trying to construct an automated system, then I think Tracy's approach is basically sound.</p>
      <p>Lastly, you might be interested in trying <a href="http://www.typophile.com/node/10317" rel="nofollow">iKern</a>. I haven't heard much from Igino lately, but I think his ideas deserve wider exposure.</p>
