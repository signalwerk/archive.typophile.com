      <p>Gerrit Noordzij wants to use the space inside the letter as the benchmark. The space inside tha letterforms and the space between them must be in synchronicity.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/][img:"></div><p></p>
