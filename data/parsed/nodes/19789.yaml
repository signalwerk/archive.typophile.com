      <p>Based on the additional information, especially John Hudson’s interesting comments in the Raph’s linked thread, here are my current hypotheses about Kindersley’s work. </p>
      <p>1. It seems that the computer program based on Kindersley’s researches was never taken up. In the interesting thread linked by Raph, one person includes an e-mail from 1992 by the company who owned the rights saying that the program was “hard to implement in terms of getting the maths right every time, and choosing the correct variables to control the calculations.” It sounds like it wasn’t practical, whereas the stuff done by Zapf and URW was—which has been incorporated into Adobe’s ‘optical spacing.’</p>
      <p>2. Kindersley was a master letter and had great eyes for letter design and spacing. I suspect that his ideas of a natural ‘optical centre’ and ideal minimum advance width are sound, but that he never got them formalized into a practical algorithm, which was his goal. My guess is that he failed formalize his intuition because his efforts at formalization used only the black of the letters, didn’t include the effect of the white on the black. His approach shown in the above diagram of the light box thus was fundamentally flawed. I suspect that to formalize the ‘optical center’ properly one would need to include both white and black—that’s maybe why it’s different from the center of gravity of the black. </p>
      <p>3. Leaving aside the issue of making an algorithm to do spacing automatically, which I myself am not interested in pursuing, I suspect that the ‘optical center’ idea—following intuition that includes the counters rather than a program--leads to somewhat different and probably better results than the ‘equal area between the letters’ idea.</p>
      <p>4. The idea of designing around the optical center is fascinating, and may in the end be one of the most useful ideas he has. John, does he discuss this only in the Sassoon book, or is it elsewhere also? Can you describe the basic idea?</p>
      <p>5. Finally the ideal 'advance width' of a character design also raises the questions of designing the characters so the widths fit into a rhythm, and how best to do this. Perhaps the Fourier information can help here, but maybe also Kindersley's ideas.</p>
