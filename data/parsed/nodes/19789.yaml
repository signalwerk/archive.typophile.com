      <p>William wrote: <cite>Ok, so the penny just dropped</cite> about this "moment" concept. Yes, that makes a tremendous amount of sense, and it's also clear how the photographic filter wedge + light sensor technology could measure these quantities. That said, my intuition is telling me that it's far too crude a measure to be the primary basis for good spacing, as it does not take proximity into account at all, among other things.</p>
      <p>hrant: I must confess that I find some of your recurring themes to be frustrating because, to me, they're too vague and slippery. The use of the word "notan" to describe dark/light relationship sounds nice, but what does it actually <em>mean</em>? As to whether Kindersley's machine is measuring the black or white, I think you'll find that it doesn't actually matter. If you measured, say, a letter and its inverse image, you'd find that the sum of the two light flux quantities would be exactly the same as all-white. So, saying that it measures notan, black, or white brings no real insight to the table.</p>
      <p>Similarly for your insistance that stroke is secondary to outline. What does that <em>mean</em> in practice? That good fonts are not slavishly chirographic (in that the character shape should not just be a convolution between a static pen outline and a zero-width path)? We already knew that - all non-strawman presentations of chirography discuss include the principle that the pen shape is <em>not</em> fixed, but varies.</p>
      <p>One reason I've come to believe that chirography <em>is</em> important is that my visual system seems to be very good at doing a chirographic analysis or decomposition of an outline, let's say for example the lower right serif of a 60pt metal Centaur capital K. Even though the modulation of outline is extremely subtle, my eye seems to have no difficulty seeing that, at the very right side, the stroke is a continuation of the main diagonal stroke of the K, but the rest of that part of the outline belongs to the horizontal stroke comprising the bottom-right serif. Further, it makes intuitive sense to me that the human visual system is going to be very good at this kind of analysis, in parallel, and with extremely high bandwidth. Quick, which branch belongs to which tree? You'll care if you need to climb a tree suddenly because a tiger is chasing you.</p>
      <p>To convince me that "outline is more important than chirography" is more than a platitude will take a more detailed argument, with at least the possibility of empirical verification, than I've seen you advance. And I believe that one of the best tests for theories of readability, or type perception in general, is an algorithm that accurately predicts the perception of spacing.</p>
