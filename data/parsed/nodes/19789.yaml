      <p>Another issue is deciding the dimension of the advance. Is it a pure measure from the optical centre, or does it vary from letter to letter, which it must, I would think, in a proportional font. The Kindersley method seems to hold out the promise of a consistent spacing mechanism but does it also contain an method for determining how wide letter spaces should be?</p>
