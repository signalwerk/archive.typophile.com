      <p>&gt;The problem with this is how to determine the ‘extent’ of the white in partially enclosed forms like the ‘c’</p>
      <p>Peter, as I understand it, all the calculations are based on the black. The white is only taken into account indirectly by the use of the 'moments' in the calculation of the optical center of the black. That he was able to get so far without directly looking at the white is what is intriguing about his approach. </p>
      <p>If I am getting it right, it starts from an opposite approach from Gerrit Noordzij. Now the black and white are defined by the same stroke, so perhaps it is not a total surprise that you can start with one or the other and get similar results. But I am still surprised that Kindersley's approach was able to get anywhere at all. </p>
      <p>My guess is that both black and white do make contributions, and that Kindersley and Noordzij both have a part of the truth, but how much I don't know. </p>
      <p>Incidentally, in now re-reading Kindersley's 1976 edition of 'Optical  letterspacing', which I am now mostly understanding, he does discuss designing around the optical center. More later.</p>
