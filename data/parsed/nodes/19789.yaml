      <p>&gt;Doesn’t VA need to space tighter than AA?</p>
      <p>Well, Kindersley wanted the basic spacing of caps wide enough so that no kerning was necessary. Then if kerning was necessary, the LA RA etc would overlap. Obviously now with digital kerning and open type substitutions there are more options. Still, I would think that consistency of design of a letter and its spacing would help readbility. </p>
      <p>I suspect that whatever you do, there will be come compromises needed between various standards of ideal spacing--relating to proximity, area between letters, relation of counters, overall weight of black, etc. </p>
      <p>One of the things that might come out of a good mathematical analysis of the spacing problem would be to find out--by looking at the results--which of these should have the most weight. This would tell us something about the design of the letters also.</p>
