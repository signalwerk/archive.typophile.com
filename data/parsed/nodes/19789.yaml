      <p><cite>I don’t know if this is at all important, but Kindersley moved the letter, not the mask.</cite></p>
      <p>Nope, not at all important. One of the great things about linear systems is the many symmetries, invariants, and equivalences. Slide the letter or mask, invert positive and negative, scale the letter (relative to the mask), and the "optical center" as found by Kindersley's machine is always going to be in the same place.</p>
      <p><cite>Would your ‘wavelet’ approach catch any of these considerations?</cite></p>
      <p>Yes, but I see this "interchangeability" criterion as overly limiting. If you've got an algorithm to measure or adjust spacing, don't you want it to be sensitive to the individual spacing between two letters, rather than just between a letter and a virtual, generic neighbor? Doesn't VA need to space tighter than AA?</p>
