      <p>Thanks to Raph for the links and to Peter for a copy of 'Space Craft'.  And thanks, John, I am relieved to hear it is not just me who finds Kindersley difficult to decipher.</p>
      <p>Reading 'Space Craft' and the interesting links of Raph, I am starting to get a grip on what Kindersley was up to. </p>
      <p>First, it seems that I got it wrong in my first post. Kindersley was measuring and working on only the black of the letter, not the counters. Here, from 'Space Craft' is a diagram of his light apparatus. </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Kindersley Diagram3_4041.gif"></div><p></p>
      <p>The letter itself is transparent, and the background black, so his measurements are based only on the area within the outlines of the letter, not the counters. </p>
