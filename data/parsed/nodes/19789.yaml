      <p>[my longest post ever--hopefully worth it!]</p>
      <p>Nick, I think Kindersley is trying to capture best practice in lettering—not type--and bring that to type. He thought type was badly spaced. I don’t think knew the tradition in type spacing, at least at first. As Tracy notes, his own type founder’s approach to spacing goes back hundreds of years, at least to Fournier. The metal type problem of a single set of side-bearings for a letter is a non-problem for the letterer, as he or she is hand spacing each letter, and can also vary the shape of the letter. But because so many compromises do not need to be made, the letterer can try to get much closer to perfection in spacing. And this means that maybe lettering masters like Kindersley had a better eye for what the ideal is. Then when photo type and then digital type came along, the forced compromises of metal were a bit relaxed. So there was an opening for Kindersley to make a contribution. And I think he did, though the ‘system’ didn’t work. </p>
      <p>Is the idea of ‘optical centre’ valid? I do think there is something to it, at least for roman type, which sits on a base line. We have an instinctive sense of center of gravity—where to pick up an object where it will balance. And I think that this affects what we see as balanced in type. However, I suspect that the reason that the optical center is sometimes a bit off from the center of gravity is because of the opening of counters. I think this affects somehow what we see as ‘the letter’, and so its balance. So an algorithm that captures Kindersley’s idea would need to include white space in its calculations. It might even work with calculations on white only—which was my initial misreading of Kindersley. </p>
      <p>Given that the idea of ‘optical centre’ has something to it, I think Kindersley’s most interesting stuff is on ‘designing to the centre’. </p>
      <p>His basic principle of spacing is “each letter should appear to be exactly in the centre between its two neighbors. …To me this is the only criterion.” As we will see, he also brings in even color for considering the correct advance width, but what is notable here is that he leaves out proximity or equality of white space between letters. </p>
      <p>‘Designing to the centre’: “The secret of a good fit and an economical one lies precisely in moving the optical centre towards the mathematical center.”  By ‘moving’ he means changing the design of the letter to shift the optical center. By the ‘mathematical center’ I believe he means equal distance from the sides of the letter (not the side bearings). Thus designing to the center means bring the optical center of the letter, in so far as possible, to the center of the letter. Thus ‘designing to the center’ involves designing a *balanced asymmetry* in the glyph. </p>
      <p>The following is his example, a discussion of the ‘L’.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/KindersleyDiagram4_4062.gif"></div><p></p>
      <p>The interesting thing here is that adding a serif to the leg of the L *decreases* the space needed to the left of the L, by moving the optical center more to the right. One of the interesting features of this analysis is that it focuses on the black of the letter, and shows how focusing on the distribution of the black is critical to good design. </p>
      <p>Also this analysis opens the way to understanding an important function in the design of serifs and varying weight. For example what is the point of the tail of the ‘a’? Easy to answer if follow Kindersley, but who else has an answer? The tail of the ‘a’ moves the optical center of the ‘a’ nearer to the center of the glyph. Same with making the top arm of the ‘a’ shorter than the bowl.     </p>
      <p>As John notes above, Kindersley's strictness on optical centers leads him to downgrade adjusting spaces because of proximity. He first designs an upper case wide enough so that no kerning is needed. –It is interesting in this context that Tschichold regarded tight spacing of caps as a flat blunder. If you want to track closer, then Kindersley says it is better to keep the optical centers in the middle of the side bearings, and overlap the blacks of photo or digital characters, rather than re-space to avoid contact. </p>
      <p>So take for example the letter ‘r’. Does it threaten to contact letters to the right? Well then shorten the arm and thicken the end of it. Done together, these will give you better asymmetrical balance—bringing the optical center more to the middle of the letter—and it will space better. Pretty powerful concepts, I think. </p>
      <p>A second feature of ‘designing to the centre’ involves even color. Kindersley comments on the demand in photo type for a limited number of advance widths:</p>
      <p>“The space allotted to any character must ideally be an expression of that character. Therefore it would also be true that, if the space is predetermined, the letter must be an expression of the space. In other words, the intensity of two characters that are to occupy similar spaces must be equal for the retina. This does not mean, of course, that the designs must be similar, but that their weight expressed in moment terms around a centre must be equal. If therefore it is desirable to produce an alphabet with only six widths, it is equally desirable that the letters have only six different weights, if spacing and color are considered important.”</p>
      <p>I think it also follows from his thinking that the different width characters will also have proportionally different weights, so the whole alphabet will have even color, even while it will have characters that are quite divergent from one another and often quite asymmetrical in shape.</p>
      <p>I first was drawn to look up Kindersley’s work when I saw the ‘C’ diagram above--I'm not sure where--and was intrigued that he had a different approach to spacing than the traditional type one, and especially that he didn’t focus on avoiding contact and uniformity of inter-letter spacing. While these are valid concerns, I think a lot may still be learned and creatively extended from Kindersley’s approach.</p>
