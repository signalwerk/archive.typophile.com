      <p>Interesting, Nick. That does follow what I quote below from Kindersley, as Helvetica has wider round letters than Trade Gothic, if I am seeing right. </p>
      <p>Here's my next-to-last installment of 'my book report':</p>
      <p>The first edition of the ‘Optical Spacing’ monograph was in 1966, and the second, 1976, which I now have a photocopy of, has a final section ‘after 10 years.’ There is a final 2001 edition, edited by his widow, which must have additional material, but I can’t find any copy around here (Washington DC area). </p>
      <p>In the ‘after 10 years’ section Kindersley starts sounding much more like Walter Tracy and Gerrit Noordzij.  First of all he notes that ‘hand spacing’ will give more letter space to the combination ii, and then progressively a hair less to the nn, mm and the oo, the last of which has the least space of all. He comments:</p>
      <p>“ Obviously the letter form with the largest internal space to stroke ratio needs the least space outside of itself like the ‘O’.  Whereas a letter such and an ‘I’ needs all of its space externally. …The human eye sees the whole letter and requires a space outside that letter consistent with the dispersed black and white in the letter. …The bolder and more condensed the letter form—take ‘black’ letter—the more consistent the spaces. The thinner or lighter the stoke and the more extended the ‘letter form’ the greater the variation of spaces. The effect of paying attention to this natural optical characteristic is to give the page a remarkable consistent colour and at the same time avoid the ‘picket fence’ look of many type faces.”</p>
      <p>This is interesting and seems sound, but as far as I can tell none of this derives from his optical light box measurements, but rather from his practiced eye. So my general conclusion is that Kindersley’s efforts at an algorithm were a bust, but that he has a lot of interesting insights. So I think the thing is to look past the mess of the failed algorithm, and at the ideas.</p>
      <p>I’ll post next on what I have found most interesting, the idea of ‘designing to the optical centre.’</p>
