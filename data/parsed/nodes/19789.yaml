      <p>Bill, are you aware of the Kindersley article "Space Craft" in <em>Visible Language</em> VII 4 (Autumn 1973)?</p>
      <p>I'll (re)read it later today to see if it clarifies anything. I think it probably won't because it is earlier by 3 years, and probably shorter (13 pages in length). </p>
      <p>His guiding principle seems to be:<br>
      "The advantages of optical spacing, with as little compromise as possible, are quite considerable. Letters form more cohesively into words and thus increase our pattern recognition." (page 314) </p>
      <p>Here he sounds a bit Ferlinghettiish:<br>
      "I am hoping for nothing less than a new typographical attitude to text faces--where alphabets are designed to fit together rather than to fit into rectangles. This means an appreciation of a letter's optical centre and the need to design a letter into the mathematical centre of it's space." "In my opinion the next evolutionary step for our alphabet lies in spacing, conjunction, ligaturing, and kerning. Words will take the place of letters. [...] Research with the help of the opthalmologist is long overdue. The opthalmologist is aware that in 1973 no research has yet really revealed how the eye reads. Could anything be more important?" (page 323f)</p>
      <p>An abstract is <a href="http://www.id.iit.edu/visiblelanguage/VLCatalogueSearch/VLChronologicalTables/VolumeAbstracts07.html#spacecraft" rel="nofollow">here</a></p><div class="imageWrap"><img src="http://typophile.com/files/][img:"></div><div class="imageWrap"><img src="http://typophile.com/files/][img:"></div><div class="imageWrap"><img src="http://typophile.com/files/][img:"></div><p></p>
