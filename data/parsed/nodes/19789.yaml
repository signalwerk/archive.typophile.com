      <p>Yes, I had the LA overlap in mind when calling this combination problematic. L is indeed a "special case", but it may be similar for V W Y if Mr Kindersley's method is combined with spacing tighter than in his examples. Of course one can overlap letters -- if one likes this. Of course one can add heavy serifs to sanserif L's -- if one like this.&nbsp;&nbsp;;-)</p>
      <p><cite>Is the optical center stuff a mere side effect? Again, since according to Tracy’s method the side bearings are related to the inner space of the n or H, there is some degree of equivalence between the two approaches.</cite></p>
      <p>There is no contradiction. According to a more recent article by Peter Karow, of 1998, the "atomic model" (repulsion/attraction) element was completely kicked out of the URW spacing tool, which thus only uses the concept of inter-letter-space as a "viscose liquid" (Karow's terms). And -- here we are with Kindersley, Tschichold, Tracy again -- the space this viscose liquid covers should approximate the counter of the O for uppercase, or n for lowercase letters, and vary slightly with type size.<br>
      I really like the Kindersley model for it allows a fresh look at spacing, but it has its limits which you pointed out in your posts. To me, this is not a question of right or wrong, or Kindersley vs URW. What is of interest to me is, which method would work: Earlier I had hoped that in future it would be possible to not space letters at all on font level, but just define some "core spaces" -- inbetween uppercase letters, inbetween lowercase letters, and maybe some other contexts, plus a factor for type size -- and the type rasterizer would do the actual spacing job based on something like the URW method. Meanwhile I doubt that this is possible, or wanted.</p>
      <p>As to Tracy, it is some time back since I read the text. This was when I also studied Kindersley's and URW's methods. In direct comparison with these, I couldn't help finding Tracy's a bit trivial, helpful only as a very basic introduction. Maybe it's time to re-read it.</p>
      <p>Karsten</p>
