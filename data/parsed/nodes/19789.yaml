      <p><cite>Given that the idea of ‘optical centre’ has something to it, I think Kindersley’s most interesting stuff is on ‘designing to the centre’.</cite><br>
      ... plus the examples of flatter and rounder sided o's. Plus the L forms with longer/shorter horizontal bar and with/without serif:</p>
      <p>My first thought was -- you can view this from an optical-center point of view, but you can also view this from a compactness-of-letterforms point of view! (The older thread which touched the spacing of italics.) The first looks at letters and their center, the second looks at inter-letter-spacing. This might also shed some light on David Kindersley's vs URW/Adobe's spacing method.<br>
      From the second point of view, it weren't even necessary that the L "serif" be that fat. It were more important that the serif is not too short so it can "close" the letterform. That in mind, E C L Z of serifed alphabets are easier to space than the equivalents of sanserifs which are more "open" (say, Baskerville C vs Gill Sans C).</p>
      <p>How important is the optical-center aspect really, in spacing praxis? I cannot help regarding it as a mere side-effect. It doesn't tell anything about the amount of space actually needed -- and I was told that Mr Kindersley indeed did not care whether letters are spaced tighter or rather open. However, by his method he would run into serious trouble when spacing tightly, i.e. for today's eyes, "normal" spacing.&nbsp;&nbsp;:) </p>
      <p>What I find most helpful though is the "how to" example he gave in the Penrose Annual article: OI / OII / OIIIO / OI(anyletter)IO. I added IO(anyletter)OI, and this is the method by which I space uppercase letters for uppercase context.</p>
      <p>Karsten</p>
