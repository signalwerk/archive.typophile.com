      <p>I think I have a new way of seeing Kindersley's "moment" approach, one that suggests a mechanism by which it works reasonably well, and suggesting a hybrid approach that takes proximity into account as well. In short: wavelets.</p>
      <p>The process of sliding a photographic mask behind another image (in this case, of a letter shape) is essentially convolution. Finding a peak or optimum in this process is closely related to edge-finding, which has been an intense focus of human vision research.</p>
      <p>To see Kindersley's approach in a wavelet context, first consider the spacing between <em>two</em> letters rather than just the optical center of one. So, in Kindersley's approach, there are two "moment masks", one behind each letter. Consider combining the two by crossfading, so that the left one doesn't affect the right letter very much, and vice versa. The resulting mask will strongly resemble a 2nd derivative gaussian wavelet (first image of third row in <a href="http://www.nada.kth.se/~tony/cern-review/cern-html/node9.html" rel="nofollow">this image</a>).</p>
      <p>I propose that adjusting the spacing between the letters in the two-letter image, and sliding the wavelet mask, in order to get a global optimum (peak response), will (a) give a visually appealing spacing between letters and (b) fairly closely approximate what you'd get from an application of Kindersley's method.</p>
      <p>I also propose that the wavelets are much more powerful and general (albeit much more computationally expensive than was practical for Kindersley). By using wavelets at different scales, and localized in the y direction as well as the x, you can detect peak responses for proximity as well. I also think that you can adjust the scale of the wavelets to take into account the size of the type, to get different spacing results for text and display settings.</p>
      <p>Hopefully I'll have time to code up a rough implemenation of my ideas before too long.</p>
