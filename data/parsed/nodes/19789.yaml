      <p>At the very least, it tells us that forming the black (even while minding the white) is arbitrary. <cite>Practically</cite>, it tells us for example that the Letterror "shading" technique (which you've said you sometimes use in actual design, if only at a conceptual stage) has no bearing on what [I believe] is the main function of text type: to be read. So <cite>practically</cite> it tells you to stop doing that. It would in fact be a lot less bad if you "fleshed out" your black with circular motions. Even random motion would be better than simulating a broad-nib pen! As one of my favorite riddles goes: "What's the difference between a headless chicken and FILL-IN-THE-BLANK?" Answer: "A headless chicken has a random chance of going in the right direction."</p>
