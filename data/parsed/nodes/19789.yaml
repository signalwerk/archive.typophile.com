      <p><cite>Is this the idea that you ‘pour’ sand or a liquid between the letters, and the space filled up should be the same—one for caps one for lc? —presumably they make a decision on how far they assume the liquid penetrates open counters like the C.</cite></p>
      <p>In principle, yes. As to the URW approach, the adjective "viscose" is essential -- the space has some resistance. This addresses the C. And to my knowledge, a couple of exceptions are required. The "different spaces for LC and UC" however is my addition, I don't know if the URW engine makes a difference.<br>
      What I like about this idea is that it can be, that it has been, translated into a program. I cannot imagine how to do this with the Kindersley approach; some variables seem to be missing. [Added:] This touches, ironically, the essence of Kindersley's idea, the distribution of black (and white). Under the microscope, there needs to be rhythm/pattern so type becomes readable, to make individual letterforms distinct, to form recognizable word shapes. That is, unevenness in the distribution of black and white. From the distance, text should look more even (not completely even of course), which might be translated into a value of grey. This might in turn influence distances between particular letters, or the placement of one letter between its two neighbors. And everything starts to blur. Is the idea of placing a letter between its neighbors related to just two neighboring letters? This looks like too narrow a context.</p>
