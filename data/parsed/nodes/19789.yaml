      <p>Karsten, I don't know what exactly is the basis of the URW/Adobe method. If it is based on 'electrostatic repulsion', as one person in Raph's linked thread mentioned, then it mainly pushes away the contact points as they near. I can see that a heavier serif on the L shouldn't make so much of a difference in this method. But would even the sans L be spaced that differently from a serif L in the URW method? I think Kindersley's point about the L was that the whole cap alphabet could then be tracked closer, as L is a limiting character, and have balance. As far as its place between side bearings, it means you can shift it relatively more left, compared to a sans of the same dimension. Would the URW method do that? I don't think Tracy's method would recommend it. Would it be good?</p>
      <p>The OI OII etc stuff is also in 'Optical Spacing', but it seems not as connected with the theory, which is why I didn't go into it. It does seem quite useful, though.</p>
      <p>Is the optical center stuff a mere side effect? Again, since according to Tracy's method the side bearings are related to the inner space of the n or H, there is some degree of equivalence between the two approaches. I think where Kindersley may have something helpful is on changing weights of things and serifs, which I don't see Tracy as giving direction on. </p>
      <p>I certainly don't want to be dogmatic about who has it right. I was just excited that here is a fellow with a different approach, and it seems to give some different insights. But I would be happy to hear where he is wrong. </p>
      <p>I don't see why his method would get into trouble with tight spacing, as he gives some examples of that. He does avocate having the L overlap the A in LA rather than pushing it out, if the rest of the characters are tracked tight enough to demand it. Is this what you mean by trouble? </p>
      <p>As far as practicality, I think Tracy is the way to go for a first or second pass. But when it comes to making adjustments, especially to modifying the character's design for the sake of spacing, it looks to me like Kindersley's ideas could be helpful.</p>
