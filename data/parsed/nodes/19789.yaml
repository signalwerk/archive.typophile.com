      <p>&gt;viscose liquid</p>
      <p>Is this the idea that you 'pour' sand or a liquid between the letters, and the space filled up should be the same--one for caps one for lc? --presumably they make a decision on how far they assume the liquid penetrates open counters like the C. </p>
      <p>It was some dissatisfaction with this that led me to look at Kindersley. I think his idea of having the character look balanced between the other letters is not the same as the 'area' approach. In particular my feeling is that where the counter fits between the letters is important (this is me, not Kindersley), and this may 'fight' with the standard of the area between letters being equal. </p>
      <p>So I am looking for some rationale for how to compromise these competing ideals--both of which are probably desirable. What Kinderley has made be aware of this the way the black is distributed has an effect also. </p>
      <p>At present, I don't have any guideline or principle to come out of this, but when I eyeball this stuff, I'm now looking at the area between the letters, the position of the counter, and the distribution of the black. And I consider how modifying the shape of the letter might make the different ideals not fight with each other. </p>
      <p>Incidentally, I do suspect that in the cold metal punch cutting days in designing they were concerned with the balance of the individual letter between its left and right extremes, as Kindersley has it. This is because setting side bearings was a separate production process involving 'justifying' the matrices.</p>
