      <p>Re-reading  ‘Optical spacing’ by Kindersley, I now have a better grip on two important points I didn’t get earlier. </p>
      <p>1.	How he determined the advance width of characters.<br>
      2.	The idea of designing a character to the optical center. </p>
      <p>Advance width. </p>
      <p>He used the light box to try to set the advance width of characters, but in the end it didn’t fully work. His method was to measure the total light coming through a letter (in reverse, clear on black) after going through his ‘wedge’ filter--with the optical center of the letter at the center of the wedge, if I understand it rightly. </p>
      <p>He then put clear rectangles surrounded by black in front of the wedge. These were the same height as the letters in the case of the caps, but of varying widths. The width of rectangle that gave the same light as the letter was the basis for the advance width. To it was added a fixed amount that was determined by checking the minimum space that the most asymmetrical letter, L (later R, reports John) would take to be centered on its optical center without kerning. </p>
      <p>There had to be changes for the lower case, but even for the caps he reports that he had problems with O and the C. The O was consistently spaced slightly too widely using the ‘second moment’ wedge filter. The C with serifs was also placed off center slightly, as the optical center as determined by eye was to the right of where indicated by the filter. </p>
      <p>In order to compensate for his filter giving wrong results, he stuck with the inverse square filter, as it seemed to him “intuitively right”, but started changing its shape to various rings and frames. At this point the thing seemed so ad hoc to me that I lost interest. In my view stubbornly sticking to a refuted theory instead of looking elsewhere was a fundamental mistake.<br>
      Later I will post on ‘designing to the optical center’, which may be in the end Kindersley's most important idea, and my overall conclusions so far.</p>
