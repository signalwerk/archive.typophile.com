      <p><em>you’d be very hard-pressed to find a designer who doesn’t follow the tired old “space first, kern later/sort-of” routine.</em></p>
      <p>That's the physical sequence, but I suspect that most experienced type designers are aware, when they're setting sidebearings, of how kerning may subsequently be used to help smooth things out, and work accordingly. Also, when doing kerning, it sometimes becomes apparent that kerning won't fix a situation, and one has to go back and change the sidebearings, or even the glyph shape. That's something that I often have to do when designing an f that will work with the f_i ligature to form ffi, and also as a non-ligated f + i, and as part of an f_i ligature. A lot of back-and-forthing.</p>
