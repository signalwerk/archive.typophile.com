      <p>&gt;Bill, how could Kindersley have believed “[…] my system differs from any other in that it takes into account the space* inside a letter, as does the eye.”</p>
      <p>&gt;* “space as a tangible factor, equal in importance to the letter itself.”</p>
      <p>Here is my reading of these. In the first quote (p. 320) he is refering to the space *within* the outlines of the letter, what is normally black, but is reversed within his light box set up. He is in particular not referring to the counters, which his system does not directly take into account. </p>
      <p>The second quote comes from earlier in the essay, and there he is indeed talking about space, but primarily about spacing between letters, which is supposed to be indicated by his system. He does mention also designing letters with too much space within, so he clearly thought his system did take into account the internal spacing also, and you and Hrant are right that he *wanted* his system to. </p>
      <p>But does he actually take space into account effectively? </p>
      <p>The only element that takes into account counter space was his 'inverse square law' for his 'wedge' filters.  As I understand it--and that is not so much!--it works like this: The wedge has a density of vertical lines or or dots that is concentrated at the center, and then falls off to the right and left (but not vertically) in the inverse square law. </p>
      <p>This means that much more light is transmitted by the parts of the letters that extend farther to the left and right of the center of the filter. So for example sliding a letter to the left and right in front of the wedge, when one puts the the vertical of the L near the center of the wedge, it is shaded quite a bit, whereas the right end of the leg is quite bright. Thus the 'optical centre,' when the light to the right and left of the light box is equal, is further to the right than would be center of gravity. </p>
      <p>I haven't tried doing calculations, but I think that is the only way space within the counters are taken into account.</p>
      <p>And this doesn't, I think, deal effectively with the real optical centre as he would get it by eye, or the adjustments that he admitted you had to make after doing his system. John points out that the algorithm at least as explained in Sassoon doesn't take into account  that the thin sides of the N would normally get less space than the thick stems of the H. This involves the 'ideal minimum advance width' as I noted. But his later system doesn't seem to even have attempted to capture this, but rather the system using the upper case R, which only uses the 'optical center' and the actual extension of the leg.</p>
      <p>I thought he earlier idea was that he could even tell you how long the leg should be, which would be really informative. </p>
      <p>So, Hrant and Peter, I do think he wanted to take into account space within counters, but did so only indirectly and unsuccessfully.</p>
      <p>I think that his approach was heavily influenced by the fact that he was a letterer and not a type designer. He thought that all type was spaced badly and that photo type, doing away with the metal body, finally allowed proper spacing as a letterer would do. So far so good. But type designers, even into the pantagraphic punch cut days, thought of letters as done by a process of subtraction from a metal block, rather than by addition of ink to paper. Thus they naturally focused strongly on counter space. Kindersley took an 'ink' approach and I think the problem is basically that 'you can't get there from here' with that approach.</p>
