      <p>William, I'll need to dig out my Kindersley notes and publications to refresh my memory. I suspect your analysis is correct: Kindersley's ideas never got as far as an implementable algorithm that would give reliable results. I think this is why it is so hard to make sense of what he wrote: he was writing around the fact that it didn't really work.</p>
      <p>I've been meaning to discuss this stuff with Eiichi Kono, who knew Kindersley (and his wife) quite well, and may be more familiar with the unpublished side of things.</p>
      <p>In my own experiments, I found the optical centre spacing based on the uppercase R as explained in the Sassoon book to be quite good for spacing caps-to-caps. I met Sassoon in 2002, but didn't think to ask her about Kindersley's spacing. I wonder if she understood it any better than we do. Actually, I wonder if anyone ever understood it, or whether it was briefly a popular topic for publication because it sounds impressive.</p>
      <p>I do appreciate very much Kindersley's point in the <em>Visible Language</em> article about consistent spacing being more important than letter outline integrity, i.e. that letters should be allowed to collide and overlap if this maintains consistent spacing.</p>
