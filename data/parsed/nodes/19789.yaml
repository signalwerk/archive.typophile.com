      <p>Concerning the balance of positive and negative space, it's not possible to speak of the spacing of letters, as if the glyphs are designed first and then the spaces added after. The spacing and letterforms are conceived of as a related whole, and the relationships between them are a matter of judgement on the part of the designer.</p>
      <p>As you say Bill, Kindersley appears to be looking for a general principle which explains the consensus of judgements exhibited in the canon of best-practice faces. But I'm not sure there is a consensus: does Chalkboard play Helvetica to Comic Sans' News Gothic?<br>
