    <p>I recently got hold of the monograph 'Optical letter spacing for new printing systems' (1976) by David Kindersley. I was looking for enlightenment on his ideas, but unfortunately I find the presentation rather difficult to understand. </p>
    <p>His basic idea seems to be that the amount of space a letter should have--advance width times vertical extension--should be equal to the total white space within the letter, as defined by the black extremes left right, top and bottom--plus a fixed amount.</p>
    <p>One determines the left-right placing of the letter within this space the following way:<br>
    1. if one slides a vertical bar left and right over the letter, when the total left and right white spaces are equal, it is the correct 'optical center'.<br>
    2. The letter should be placed with its optical center equal distance between the extremes of the advance width.</p>
    <p>I'm not even sure whether I've got these basics right. Does anyone know more about Kindersley's ideas, and what happened to them? Did anyone take them up? Were they rejected? How do they relate to Tracy's principles in 'Letters of Credit'?</p>
