      <p>Ok, so the penny just dropped on how you can use the 'second moment' or 'moment of inertia' in defining an optical center. </p>
      <p>The first moment is the mass at a point times the lever arm. The second moment is the mass times the length of the lever arm, squared. </p>
      <p>Now think of the letter as solid, with a uniform depth and density, and it is fixed to the baseline. If you slide a fulcrum left and right along the base line, then at some point you get the summing up  of the first moment (mass at a point X length of lever arm) to the right and left the same. That is under the center of gravity. </p>
      <p>If instead you use the second moment (mass X length of lever arm squared), then in assymetrical letters you will get a different point from the center of gravity when the fulcrum will balance the sum of the moments of inertia to the left and right of the fulcrum. The point of equality will be different because you are weighting the parts of the letter more distant from the fulcrum much more heavily. </p>
      <p>So that is what his light box was doing--it was an analogue method of doing the calculus to find out the point at which the sum of the second moments would balance on two sides of a line through the letter. </p>
      <p>And you could do the same for a third moment, using the cube of the distance from the optical center. With the help of a scientist, Kindersley was able to print out a 'wedge' or filter that would do the analogue calculation for that, as well, using his light box. This would weight the more distant parts of the letter from the center even more heavily. </p>
      <p>So it all makes sense now. The only problem is that in the end it doesn't seem to have worked in capturing the more accurate intuition of Kindersley in identifying optical centers and spacing letters. It needed too many qualifications and exceptions.</p>
      <p>I'm going to re-read the monograph now that I understand the basic concept. </p>
      <p>Right now my working hypothesis is that the optical center is one factor in good spacing, and there are others such as roughly equal area between letters. What I think may be worth pursuing here is the idea of 'designing around the optical center'. </p>
      <p>It can happen with a design of a letter that when the side bearings give approximately equal area with other letters, the optical center of a letter is not in the middle of the advance space. This would mean that you haven't 'designed to the optical center', and the letter should be redrawn. </p>
      <p>Kindersley's ideas about ideal advance width, and how these relate to rhythm in type is also an interesting question. </p>
      <p>Overall, my feeling is now more positive that there are valuable things to be learned from Kindersley's effort, even if in the end it didn't work.</p>
