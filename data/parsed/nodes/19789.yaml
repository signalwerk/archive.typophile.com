      <p>&gt;a grasp the concept of moments.</p>
      <p>In what field is this theory? Where do I read about it?</p>
      <p>Doing a search on the internet, there seems to be a concept of moment in structural engineering different from the normal 'moment of inertia' in physics. But I don't see anything in these discussions about 'second moment' even in structural engineering having to do with a center. The rotation of an object normally seems to be around the center of gravity, so that would not be different from what he calls the 'first moment'. </p>
      <p>In any case, it is his 'optical center' which is his key concept, and not this other stuff, so perhaps it doesn't matter.  </p>
      <p>&gt;Kindersley article “Space Craft” </p>
      <p>No, I didn't know about this. Please let me know if it's any clearer.  </p>
      <p>My feeling is that he was on to something about the appropriate total space and centering being related to overall white space. But I'm not sure he really had a handle on it. </p>
      <p>His idea of 'designing to the optical center' you quote means that he thought spacing could be interfered with by design. This seems correct, but did he discuss how to 'design to the optical center', giving examples of good and bad design? I don't see anything like this in the book, which would indeed be interesting.</p>
