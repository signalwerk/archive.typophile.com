      <p>William,<br>
      I admit to knowing nothing about Kindersley but I wonder how feasible such a solution is. It seems to me that most type designers (except those who are fond of calculation) can arrive at reasonable letterspacing by eye and experience more quickly than making all the measurements and calculations a system like his might require. To me, from reading your post above, it seems the concept of proximity is not allowed for sufficiently in the method described above. Proximity may be my own dream as a concept, since I have not seen it mentioned elsewhere, but I can't see it not having a great affect in spacing. I define proximity as the distance between the 2 closest points of adjacent glyphs in a word. A double v will have very close proximity, a double i or l will not.  My theory is that proximity mitigates area of white space in adjoining letters. An example is the word "wavy" vs. the word "tilt"; here the proximity of the vy in wavy counteracts the large space created by the adjacent opposing diagonals.<br>
      Kindersley's theory in intriguing to me in the same way as statistical observations are like IQ. It is interesting to see an IQ number of a person compared to how well he functions in the real world but it is not always a good predictor. Is Kindersley always a good predictor of spacing and how would you judge that anyway unless by eye?</p>
      <p>Just an observation, not an absolute.</p>
      <p>ChrisL</p>
