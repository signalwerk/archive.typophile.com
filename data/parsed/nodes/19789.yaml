      <p>Nick is right.  It is not a linear process.  Some glyphs are apt to space quickly while others need numerous revisions to either outline, sidebearings, or kerning (or all).  The ones with holes and single protrusions like f, r, T, L, P, 7, etc., are more likely to need multiple surgeries than H or n.  I find that the first drawing of the glyph outlines is the quickest part of the process. The endless tinkering afterwards eats up the hours.</p>
      <p>ChrisL</p>
