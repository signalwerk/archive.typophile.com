      <p>"From the distance, text should look more even (not completely even of course), which might be translated into a value of grey. "</p>
      <p>To me the clue in this is if it is disturbing and makes you take note of it.  If you are reading and a wordshape is disturbed by a hole caused by a spacing/kerning issue, then it is inhibitive and bad.  The same holds true for a black spot where glyphs appear darker than the rest of the word.  The solution may be in refining either the space or the outline or both.  There are always devilish problems like double "g" situattions and double cap "T" situations.</p>
