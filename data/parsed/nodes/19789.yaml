      <p>&gt;Is the idea of placing a letter between its neighbors related to just two neighboring letters? This looks like too narrow a context.</p>
      <p>As I mentioned above, Kindersley actually qualifies this by the way he judged--or calculated--the advance width. A given advance width should have a letter that gives the same overall density (qualified by the weighting in his 'moment' stuff). And it seems that the wider advance widths would have similar density, though I'm not sure this is actually the case given his math. This even color applies to the whole alphabet, not just letters next to each other. </p>
      <p>By the way, I am questioning not the importance of the optical center, but whether it needs to be in the center of the letter. If you look at the typical weighted 2, its optical center will be to the right of the center of the letter, meaning that the 2 should be shifted left between its side bearings. But this is exactly what should happen because of the opening to the left, according to the Tracy and URW approach. So the idea would still be striking an assymetrical balance, but within the side bearings, rather than necessarily the letter itself. </p>
      <p>This still has implications for design, but they would be different from what Kindersley says.</p>
