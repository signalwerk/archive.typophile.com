      <p>It seems to work like physics where an uneven mass (compare a hammer to a bowling ball) causes the centre to shift balance point.  You might also add magnetism to alude to my proximity discussion above.  It all seems very exciting to me, not as a type designer, but just as an inquisitive human being.</p>
      <p>I quite agree that display spacing is different than text spacing.  This is why multiple axis designs are needed--not only for the change in glyph outlines but metrics as well.<br>
      I think there is a point in display type where type designers must hand over the final spacing adjustments to the graphic designer/typographer setting the job.  The individual characters at the chosen size can cause an interaction requiring individual adjustment to suit the words, context, and intended meaning. Turning over your typeface to a graphic designer is like handing your child, who has grown to adulthood, over to the world having done the best we could as parents in the time we had to raise them :-)  I guess I must be suffering from empty nest syndrome :-)</p>
      <p>ChrisL</p>
