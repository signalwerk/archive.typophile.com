      <p>"...Helvetica has wider round letters than Trade Gothic..."</p>
      <p>Not only that but Trade has flatter sides in the O which means there are more points in proximity than Helvetica's more rounded O.  A more drastic example is comparing a very round Futura to the flat-sided Din O.  It is not just a matter of a more open and larger counter space but the actual shape of the space.  The flatter the vertical sides of the O, the larger the sidebearings should be and conversely. This is true even if it is not a condensed face.</p>
      <p>ChrisL</p>
