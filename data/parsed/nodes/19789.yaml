      <p>&gt;type designers (except those who are fond of calculation) can arrive at reasonable letterspacing by eye and experience </p>
      <p>Well, the reason for my interest in Kindersley's work is that what the eye should be looking for is not totally obvious to me. As has been discussed in other threads, there is tension between different goals in spacing. One is to not have the extremes of letters touching. Another is to have the white area between letters approximately equal (the 'pouring sand between letters analogy'); another is to have a even rhythm of the counters moving across the page, etc. </p>
      <p>What should the trade-offs between these different goals be? The thing that worries me and has me looking at different theories is that what looks to the eye like good spacing for display might not be best from the point of readability in continuous text. </p>
      <p>For example, I think that taking into account proximity is necessary but dangerous. It is necessary because otherwise legibility is hurt when eg rn are not clearly separate. It is dangerous because if you give it too much emphasis you can hurt other more important goals such as good rhythm and color. In <a href="http://www.typophile.com/node/10191" rel="nofollow">this thread</a> Raph argues that the influence of serifs—and hence proximity—should be greater at large sizes, smaller at small sizes. </p>
      <p>I don't know that formulas such as Kindersley was seeking--and which Adobe's 'optical spacing' actually uses--will ever be as good or better than the eye of a designer, though I don't see how you can rule it out. My purpose, though, is not to find a formula, but just to understand the aspect of spacing he was exploring. </p>
      <p>Maybe it would help to put up his basic diagram. </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Kindersley Diagram2_4465.gif"></div><p></p>
      <p>Here is what Kindersley says about it:</p>
      <p>"In this 'C' the optical centre is very near the third moment centre and the mathematical centre. The mathematic centre is equidistant between the left and right projections of a letter (including serifs). </p>
      <p>"The other centres are from the left: (1) area; (2) first moment (gravity); (3) second moment (interia); (4) third moment (optical?); 5 mathematical centre or the vertical halfway between the left and right projections of the letter.  </p>
      <p>"The optical centre must coincide with the mathematical centre of the space. These two factors, the correct space and the correct optical centre, alone provide the key to the interchangeability of characters. At this time I could see no way of finding the optical center except by eye ..."</p>
      <p>I understand the center of area, but I'm not totally sure what area he is talking about--I am guessing it is the white area in the box bounded by the extremes of the black, but I'm not sure. The 'first moment' of gravity I assume is the center of gravity of the black figure, if it were solid. The 'second moment' I don't understand, as moment of inertia is, according to what I read, defined with respect to an axis of rotation. It doesn't define an axis, that I can see.</p>
      <p>Later in the book, Kindersley explains the idea of finding the optical center by sliding a vertical bar left and right until the white space is equal on both sides. The bar is then at the optical center. He actually used a light behind the letter and a black wedge for the vertical bar. And he measured the total light projected.   </p>
      <p>At any rate, if someone can enlighten me on these issues, and the status of Kindersley's effort, I would be interested.</p>
