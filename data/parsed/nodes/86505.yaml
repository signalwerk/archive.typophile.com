    <p>It the middle of the 20st century Detroit was the boom town of North America and the car manufacturers equipped their cars with shiny chrome parts – and a new kind of type design: Chrome Script. Based on this style, we developed two contemporary retro font family, called Hooptie Script. The fonts make full use of modern OpenType technology. Just turn on contextual alternates and ligatures and watch how each letter pair always connects perfectly. The full package includes seven bonus vector images of vectorized hooptie cars.</p>
    <p>An article about the design can be found here:<br><a href="http://j.mp/qSwUpN">http://j.mp/qSwUpN</a></p>
    <p>The fonts are available at <a href="http://www.fonts.info">http://www.fonts.info</a> and MyFonts.com</p>
    <p>@okaytype: Please refrain from commenting yet again. Thanks!</p>
