      <p>&gt;your religion</p>
      <p>Not only in my religion. I don't know of any religion in which angering and offending has merit in itself. Or for that matter any secular wisdom tradition. </p>
      <p>Certainly not in Judaism, Christianity, Islam, Buddhism, Confucianism, Greek Stoicism. While there are some exceptional circumstances where anger is regarded as acceptable in some of these traditions, in all it I believe it is regarded as an extremely dangerous emotion, generally sowing personal pain and interpersonal conflict.</p>
      <p>Incidentally, my own view is that anger can be functional as a warning signal of danger. However it--like other negative emotions--is in great danger of being stuck in the 'on' position, leading to actions that are irrationally harmful to the self and others. Unnecessarily offending others is an example of such generally self-defeating actions. </p>
      <p>In our society people can sometimes make a living out of insulting others, though. Don Imus comes to mind, among others.</p>
