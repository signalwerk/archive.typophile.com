      <p>So, I'm a long time lurker first time poster.  You know how that goes.</p>
      <p>David Carson was the most influential designer of the 90's because he was the best designer of the 90's.  Why was he the best?  He turned things upside down.  He threw up his middle finger at the establishment.  He pissed off everyone.  He was the epitome of 90's culture.  And like it or not, his influence still lives on.  His innovative use of type is still all over the place.  Especially grunge, which he may not have invented but he sure did perfect.</p>
      <p>I'm pretty much the biggest David Carson fan on the face of the earth so I am just a little more than biased.  His work inspired me to start designing, though, so I owe him a huge debt.  He may not be as relevant today as he was 10 or 15 years ago, but he left a mark.</p>
