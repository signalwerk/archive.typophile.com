      <p>More on Carson...</p>
      <p>It's true that he's more of a graphic artist as opposed to a designer, but this means his design work had an artistic bent to it.</p>
      <p>As far as his audience, sure it started out with the surfers and the alt community who read Raygun.  It went on past that, though.  What I meant by flipping the bird at the establishment was that at some point he said "I'm not going to do this like other designers.  I'm going to make this an art, not an industry".  And it worked for him because after those first years everyone wanted him to be the art director for whatever project it was they were working on.</p>
      <p>He was one of a few designers who made design art, not just something that made a page look good.</p>
    html_clean: |-
