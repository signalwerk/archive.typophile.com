    html: |-
      <p>"He turned things upside down. He threw up his middle finger at the establishment"</p>
      <p>I would hardly call the "Surfer dudes" who were his audience, the establishment. His work was for a very select vertical market whose culture was counterculture. If he wanted to thumb his nose at the establishment of his audience, he would have made "Raygun" look  like "Ladies Home Journal". There were plenty of folks out there who either did or could have done way-out stuff but were never "found" by the popular media. Carson might have gone on in obscurity as well, just like the others, but he was "discovered" by mainstream folks who decided it would be sheek to pay homage to him. He got lucky and caught a big wave—he hung 10 and rode that puppy until his 15 minutes of fame ended. I am not saying he is either a bad designer, a bad person, or an opportunist. He is a bright guy, an artist, and just followed the current that opportunity sailed him in. He was not a designer though. He was a painter of pages with whimsy and joy, not a communication problem solver. I wish him well and a happy life. Most of us will never get a chance to peer through the curl he did and come out smiling. “Lay on McCarson!”</p>
      <p>ChrisL</p>
