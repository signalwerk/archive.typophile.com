      <p>&gt;anger has merit where there would otherwise be only apathy</p>
      <p>Why would there otherwise be apathy? Once you are aware of a danger or need, you can be concerned and take action without being constantly angry. </p>
      <p>As I said above, I acknowledge that anger is functional as a warning signal; also as motivation that something needs doing. That is a merit, but not in itself. It is also functional in blocking compassion and giving you energy when it's a kill or be killed situation, such as in  battle. </p>
      <p>Anger in itself, without serving one of these functions is dangerous and destructive. And anger is in fact very often dysfunctional. Anger easily becomes a habit and leads to the distorted, self-defeating thinking that has been documented by cognitive psychologists: thinking in black and white, us-and-them, limiting the scope of searched options, over personalizing, 'catastrophizing', oscilating between grandiosity and self abasement, etc., etc. </p>
      <p>And insult creates lasting resentments and stokes the fires of conflict.</p>
