      <p>Artist and designer are not mutually exclusive, but they are also not the same thing. In Carson's case, he is an excellent artist and a crap designer. He is extravagantly admired by students and others who appreciate art, and not design. </p>
      <p>[Edit: for more views of Carson see <a href="http://typophile.com/node/29768" rel="nofollow">this thread</a>.] </p>
      <p>&gt;an artist doesn't do solutions, right?</p>
      <p>Artists also do challenging and difficult problem-solving, but the primary goal is self-expression or communication of a personal vision. Designers serve other useful purposes as well, and the designer's desire for self-expression is subordinate to those other purposes--such as communication of the meaning of a text.</p>
      <p>Personally, I love art, but I also fascinated with how other problems can be solved in a beautiful way--design. Art is something we take time from our lives to experience, whereas design is part of the warp and woof of everyday life.</p>
