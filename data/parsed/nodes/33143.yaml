      <p>Christopher, with all due respect, it is not different, but exactly on point. You have proposed that Carson is great because </p>
      <p>"He threw up his middle finger at the establishment. He pissed off everyone. He was the epitome of 90’s culture. And like it or not, his influence still lives on." </p>
      <p>Your later explanation that he didn't let the demands of design interfere with his art may be accurate, but I think your first comment better captures why so many students admire him. It is not just his ability as an artist, but his attitude of contempt which you and others are excited by. And I actually have come around to see that you are indeed right: he is characteristic of a period, just recently ended.  </p>
      <p>The admiration of 'attitude' is what I pointed out indeed has been popular, though I think it is misguided. Rappers have ridden anger and contempt for women to riches, and Don Imus had a successful show for years regularly insulting everybody as 'humor'. The 'hate radio' of Rush Limbaugh has also been hugely successful. </p>
      <p>David Carson is not a cultural critic but someone riding a wave of popularity of a contemptuous attitude as 'hip' and 'cool'.  </p>
      <p>I am the one being a counter-cultural--art school culture--critic, and here you are being the culture police and ruling me out of order. But I am now in fact seconding what you said, that Carson is important. --I just think the popularity was for the wrong reasons.</p>
      <p>Specifically, it is not 'advanced' and a breakthrough to push forward your own art to the detriment of a design purpose. It is self-indulgent and contemptuous of the client and reader. --and by the way Hrant and I I think agree about this. And as you can see, we don't agree about a lot! </p>
      <p>As a contrary example, I would cite the recent wonderful work of <a href="http://www.bantjes.com/" rel="nofollow">Marian Bantjes</a>. Her recent work would fall in the category of 'graphic art', as you have put Carson's. However, she is respectful of the client and the audience. Her art has a freedom, adventurousness and joy that reminds me of the Beatles in their prime. And not coincidentally, she knows the difference between art and design--as Patty above explained. </p>
      <p>At a talk at the TDC in New York, she told the story of how she decided she was fed up with design, and quit and devoted herself to the graphic art that her conservative clients didn't want. After a very lean year she started her first sales of her graphic art. Now, widely admired in only a few years, only accepts projects where she has "carte blanche". "And that's not really design," she said. She gets it.   </p>
      <p>Maybe the worm has turned and the recently fashionable contempt has turned back to a spirit of freedom, adventure and joy. By me, that would be great.</p>
