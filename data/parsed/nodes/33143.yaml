      <p>Coming in late to this but I'd have to say that the big typographic name of the mid 1990s was definitely David Carson. I was never a fan but I thought the awful purposefully bad kerning of RayGun on the first And the End of Print issue was absolutely brilliant and absolutely beyond my capabilities.</p>
      <p>I remember seeing his design for the Pepsi can in the supermarket. I think it was Pepsi, maybe Coke, it was really really bad. Word was he got a million for it up front, and when Pepsi or Coke complained about the fact that he didn't use the logo or put in all the required legal information he told them, "next time hire a typographer." I like that story. Tells it all.</p>
