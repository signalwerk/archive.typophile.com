      <p>I think the concept of most influential designer of the 1990s is just not something anyone can quantify at this time. For starters, there are people of varying ages, influenced by nineties design, who are still in school, many more in mid-to-junior jobs where they still aren’t making big creative decisions. It will be a long time before enough of the nineties has come and gone in design to quantify how it all played out.</p>
      <p>And it really is not possible for most of us to look at the subject on grounds that could even remotely be considered objective. As has already been noted regional design awareness has a profound impact on what we know about design; until this stuff has finally been collected and compared by multiple sources it will be hard to really know enough about Ninties design on a large scale to make credible pronouncements about it; at least unless your last name is Heller, Lupton, or Poynor.</p>
      <p>Lastly, we must also consider that there may be incredibly influential designers that none of us are aware of. For all we know there was a design in Laos whose work was knocked off in China and has since influenced myriad designers that have yet to be seen by our eyes. Hell, right now there might be a discussion just like this one going on in Mandarin with no mention of David Carson, Paula Scher, or Stefan Sagmeister. </p>
      <p>But it sure is fun to discuss :)</p>
    html_clean: |-
