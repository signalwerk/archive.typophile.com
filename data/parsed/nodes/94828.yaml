    html: |-
      <p>The more I look at it the more I think it's a custom job (part of the obvious oblique cuts on finals of course) based on <a class="freelinking external" href="http://myfonts.us/td-XkYsZX" rel="nofollow">Eurostile</a> (Extended Black), mainly beacause of the "HULK HOGAN" part which looks very close (even matching) to Eurostile. "Just" need to recreate some letters: /S (probably the "hardest") with /O or /C (keeping the top left quarter, extending it horizontally to the right, 180° mirrored to create the bottom part and connecting the all thing with a horizontal stroke), /A with /P (have a closer look to this one and you'll see the bowl's inside top right curve is not identical to the left one as it should be for a "regular" top rounded /A as this one) and /R with (also) /P (as it looks like /P with an additional leg).<br>
      Some more "to-customize"/base/similar fonts you might like: <a class="freelinking external" href="http://www.myfonts.com/fonts/dsgnhaus/saturn/" rel="nofollow">Saturn</a> (same base as Eurostile with a top rounded /A), <a class="freelinking external" href="http://www.myfonts.com/fonts/psyops/armchair-modern-ot-agauge/" rel="nofollow">Armchair Modern</a>, <a class="freelinking external" href="http://www.theleagueofmoveabletype.com/orbitron" rel="nofollow">Orbitron</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/fontbureau/stainless/ext-black/" rel="nofollow">Stainless Extended Black</a></p>
