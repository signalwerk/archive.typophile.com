      <p>Draw a lowercase n and then figure out how many other glyphs are hiding in there. Then draw a lower case o and examine it in the same way. Then look at both of them and see what else is lurking in there. Repeat for the Uppercase H and O.</p>
      <p>Rinse and repeat.</p>
