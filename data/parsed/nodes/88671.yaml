      <p><cite>Typophiles, what are your guidelines and workflow when it comes to starting a typeface?</cite></p>
      <p>Start small. Work in sections of the font—adhesion, hamburgefonts, alphabet and numbers, and then finish the rest. In between, stick the font in a folder and work on something else for at least a month.</p>
      <p><cite>What glyphs are the most definitive and will give me my basic curves and shapes for all the other letter forms?</cite><br>
      adhesion, handgloves, hamburgefonts</p>
      <p><cite>I'm kind of a noob at bezier curves. Type workshop had some really helpful tips on how to keep the handles of the curves vertical or horizontal and to keep it simple..but I can't get the curves I want (Yes, I'm talking about you, 'a' and 'C')</cite></p>
      <p>Add some on-curve, non-extrema points. The general rules are just general rules, not laws of physics.</p>
      <p><cite>Concerning construction in Illustrator, how does everyone go about making their letter forms? Do you use a grid? Right now, I am using stroked lines to trace out the shapes. Or is it better to construct them out of filled shapes by subtraction and addition with the Pathfinder? This question also leads me to....</cite></p>
      <p>Don’t work in Illustrator. Illustrator’s bezier tools are worthless shit. Design your letters in a font design application. Don’t try to build much with strokes unless you draw scripts. Letters don’t have even strokes, so why bother designing with them?</p>
      <p><cite>Different weights. How am I to achieve different weights? What is the logic behind increasing the weight of a typeface? How do I know where and when I should adjust curves? And should I keep a spare copy of my typeface in stroke-only format so I can increase and decrease the weight as needed using stroke weight, then expand it into a solid shape?</cite></p>
      <p>Don’t worry about families until you know what you’re doing. You’ll just waste a lot of time populating mistakes over multiple fonts. Draw a lot of single weight fonts based on the proportions of existing designs in a wide range of styles. Worry about families after you can already design a good light font, a good black font, and anything in between.</p>
