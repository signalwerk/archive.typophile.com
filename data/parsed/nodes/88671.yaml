    html: |-
      <p>Don't look at any other fonts, admired or hated, start working just from within what you see as you work.  Avoid How-to books and manuals of all kind.  Learn to see by looking as a child looks when seeing something for the first time.  Don't read any books on type design until you finish at least one font.  Spend days discovering what makes an "n" different than an "o". Create a curve that melts perfectly in to a straight line without a hitch or a bump.  Watch ice melt and notice the artful way it makes curves.  You have only one chance to work totally naively, don't throw that chance away.<br>
      Draw hard bezier curve lines that feel like spring steel.  Then draw some that look like overcooked pasta.  Figure out why they have these differing appearances.</p>
