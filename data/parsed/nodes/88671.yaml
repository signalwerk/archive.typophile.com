    <p>Greetings Typophiles!</p>
    <p>I'm starting work on my first typeface and I've run into a lot of issues and questions concerning how to translate my ideas from my sketches to vector. I've been sifting around for information quite a bit to get a sense for the process and all the little important details this encompasses...But for everything I've read I still don't quite have the experience to get me that confidence I need to get going with this project.</p>
    <p>Recently, I've read through these forums, countless blog entries and these websites:<br>
    <a href="http://www.typeworkshop.com" title="http://www.typeworkshop.com">http://www.typeworkshop.com</a><br>
    <a href="http://www.typedu.org" title="http://www.typedu.org">http://www.typedu.org</a><br>
    <a href="http://ilovetypography.com/2009/03/23/the-first-ones-the-hardest/" title="http://ilovetypography.com/2009/03/23/the-first-ones-the-hardest/">http://ilovetypography.com/2009/03/23/the-first-ones-the-hardest/</a><br>
    I even asked for this book for Christmas, which is proving to be quite a help concerning designing my letter forms and learning about them:<br>
    <a href="http://www.amazon.com/Designing-Type-Karen-Cheng/dp/0300111509" title="http://www.amazon.com/Designing-Type-Karen-Cheng/dp/0300111509">http://www.amazon.com/Designing-Type-Karen-Cheng/dp/0300111509</a></p>
    <p>One piece of the puzzle I'm missing after all my research is how to go about translating my sketches and ideas into vector format. </p>
    <ol>
    <li>Typophiles, what are your guidelines and workflow when it comes to starting a typeface?</li>
    <li>What glyphs are the most definitive and will give me my basic curves and shapes for all the other letter forms?</li>
    <li>I'm kind of a noob at bezier curves. Type workshop had some really helpful tips on how to keep the handles of the curves vertical or horizontal and to keep it simple..but I can't get the curves I want (Yes, I'm talking about you, 'a' and 'C')</li>
    <li>Concerning construction in Illustrator, how does everyone go about making their letter forms? Do you use a grid? Right now, I am using stroked lines to trace out the shapes. Or is it better to construct them out of filled shapes by subtraction and addition with the Pathfinder? This question also leads me to....</li>
    <li>Different weights. How am I to achieve different weights? What is the logic behind increasing the weight of a typeface? How do I know where and when I should adjust curves? And should I keep a spare copy of my typeface in stroke-only format so I can increase and decrease the weight as needed using stroke weight, then expand it into a solid shape?</li>
    </ol>
    <p>To help you to understand more about what I'm asking, I will enclose some sketches of the proposed typeface. Please note that this typeface is still in the conceptual stage and I have by no means refined it to anywhere near where I want it to be. These are simply sketches and doodles...</p>
    <ul>
    <li><a href="https://lh4.googleusercontent.com/-ob3sjL7ja54/TvybomhhTfI/AAAAAAAAA2A/0lWqD9-F0qA/s800/2011-12-29%25252010.57.22.jpg" rel="nofollow">Sketch sheet 1</a></li>
    <li><a href="https://lh4.googleusercontent.com/-laaDXTLvWC4/Tvybj47UQfI/AAAAAAAAA14/s-vaBIuGnNM/s800/2011-12-29%25252010.57.50.jpg" rel="nofollow">Sketch sheet 2</a></li>
    <li><a href="https://lh6.googleusercontent.com/-sdsl7zrp6_4/Tvybe7v-WMI/AAAAAAAAA1w/D9avLfxI7QA/s800/2011-12-29%25252010.58.43.jpg" rel="nofollow">Sketch sheet 3</a></li>
    <li><a href="http://i42.tinypic.com/312bu9x.jpg" rel="nofollow">AI Doodle 1</a></li>
    <li><a href="http://i42.tinypic.com/20sjcy0.jpg" rel="nofollow">AI Doodle 2</a></li>
    </ul>
    <p>I call it Canoe Sans because when I started to design it, the shape of the letters made me want to write 'canoe' over and over. It is very rounded and casual, but the organic curves are proving difficult for me to render digitally. Sorry for the wall of questions...any guidance or critique is greatly appreciated!</p>
    <p>Thanks</p>
    <p>Mary</p>
