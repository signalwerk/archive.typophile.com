    html: "<p> Right now it's a big, lovable mess. There are lots of interesting individual characters, but they're not hanging together as a whole. <br> <br>I think the most successful characters are the ones with the greatest thick/thin contrast: F,G,S,T,L,3. I'd like to see that top- or bottom-heavy approach applied throughout. <br> <br>Not sure the pixel/stair-stepping technique works for the Z,2 or 7 either. You might consider applying the rounded corner approach of the K. <br> <br>The double lump of the I and W is cool, too. More of that, maybe? </p>"
