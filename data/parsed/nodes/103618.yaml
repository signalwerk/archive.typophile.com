    html: |-
      <p>try maybe my quick script</p>
      <pre># -*- coding: utf-8 -*-
      import fontforge;

      def change_name_XXXX00001(arg1,font):
         prefix=fontforge.askString("Prefix..","Prefix:",'GLYPH');
         numer=1;
         for i in font.selection.byGlyphs:
            i.glyphname=prefix+("%04d" % numer);
            numer+=1;

      def EnableSel(arg1,font):
         for i in font.selection.byGlyphs:
            return True;
         return False;

      fontforge.registerMenuItem(change_name_XXXX00001,EnableSel,None,
      "Font",None,"Glyph_names","Change to XXXX00001");
      </pre><p>Save code to file or download it from:<br>
      <a class="freelinking external" href="http://www.glukfonts.pl/temp/gluk_names.py" rel="nofollow">www.glukfonts.pl/temp/gluk_names.py</a></p>
