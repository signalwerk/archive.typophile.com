      <p>You can define own scripts in 'Tools' menu. For example first script:</p>
      <p>import fontforge;</p>
      <p>def rename_unival(arg1,font):<br>
        for g in font.selection.byGlyphs:<br>
          if g.unicode != -1:<br>
            g.glyphname= fontforge.nameFromUnicode(g.unicode);</p>
      <p>def EnableSel(arg1,font):<br>
