    <p>Hi,</p>
    <p>I have around 2000 glyphs which needs to be renamed totally as most of them are more than 32 chars and truncated to 32 chars automatically by FontForge. This has created duplicate entries i think.</p>
    <p>What I need to do is give them a friendly name like GLYPH0001 - GLYPH2000.</p>
    <p>Is there any script which can do this. I will select the glyphs which i want to change and run the script in order todo so.</p>
    <p>Please help.</p>
    <p>Thanks &amp; Regards</p>
    <p>NOTE: I am a newbie in fonts and fontforge.</p>
