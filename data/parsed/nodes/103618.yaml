    html: |-
      <p>btw, Michael</p>
      <blockquote><p>
      [...] When you have many scripts, it is not handy to copy them all the time in the "Execute script" window [...]
      </p></blockquote>
      <p>You can define own scripts in 'Tools' menu. For example first script:</p>
      <pre>import fontforge;

      def rename_unival(arg1,font):
        for g in font.selection.byGlyphs:
          if g.unicode != -1:
            g.glyphname= fontforge.nameFromUnicode(g.unicode);

      def EnableSel(arg1,font):
         for g in font.selection.byGlyphs:
            return True;
         return False;

      fontforge.registerMenuItem(rename_unival,EnableSel,None,
      "Font",None,"Glyph_names","Rename to unicode value"); 
      </pre><p>
      Save them in change2uni.py in  .Fontforge/python/ directory, and now You have new menu item   'Rename to unicode value' in a submenu 'Glyph_names' of the 'Tools' menu (of the Font window).</p>
