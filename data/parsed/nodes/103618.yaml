    html: |-
      <p>Here is a native fontforge script that does the renaming</p>
      <pre>Open($1)
      SelectWorthOutputting()
      foreach
        SetCharName(NameFromUnicode(GlyphInfo("Unicode")))
      endloop
      Save($2)
      </pre><p>If you call it <code>renam.pe</code> then the call</p>
      <pre>fontforge -lang=ff -script renam.pe infile.sfd outfile.sfd
      </pre><p>should do about the same as the python script you appear to be having trouble with. In fact, I just tried that script and it even renamed <code>uni004F_uni0045.sc</code> to <code>O_E.sc</code>. I don't know much native fontforge scripting and I am somewhat surprised that it did that.</p>
