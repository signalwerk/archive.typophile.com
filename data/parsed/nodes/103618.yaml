    user: 18942
    date: 2013-07-04T10:08:00
    date_raw: 4 July 2013 - 10:08am
    votes: 0
    html: |-
      <p>Here is a native fontforge script that does the renaming</p>
      <p>Open($1)<br>
      SelectWorthOutputting()<br>
      foreach<br>
        SetCharName(NameFromUnicode(GlyphInfo("Unicode")))<br>
      endloop<br>
      Save($2)</p>
      <p>If you call it <code>renam.pe</code> then the call</p>
      <p>fontforge -lang=ff -script renam.pe infile.sfd outfile.sfd</p>
      <p>should do about the same as the python script you appear to be having trouble with. In fact, I just tried that script and it even renamed <code>uni004F_uni0045.sc</code> to <code>O_E.sc</code>. I don't know much native fontforge scripting and I am somewhat surprised that it did that.</p>
