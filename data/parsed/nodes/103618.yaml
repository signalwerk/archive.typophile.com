      <p>Here is a script that renames all glyphs to uniXXXX</p>
      <p>for g in fnt.glyphs():<br>
        if g.unicode != -1:<br>
          g.glyphname = "uni%04X" % (g.unicode)</p>
      <p>Here is one that renames all afii to uni:</p>
      <p>import string<br>
      for g in fnt.glyphs():<br>
        if string.find(g.glyphname,'afii') == 0:<br>
          g.glyphname = "uni%04X" % (g.unicode)</p>
      <p>I would personally not rename A to uni0041 but I rename all afii.</p>
