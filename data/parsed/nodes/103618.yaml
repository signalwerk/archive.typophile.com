    html: |-
      <p>Run this in a terminal window</p>
      <p>fontforge -lang=ff -c 'Print($haspython)'</p>
      <p>and if you get <code>0</code> then your FontForge was not compiled to use Python scripts. You should get <code>1</code> for python scripts to work.</p>
      <p>Also put your code between the tags &lt;pre&gt; and &lt;/pre&gt; else it is unindented and unreadable.</p>
