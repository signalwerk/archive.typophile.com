    html: |-
      <p>try maybe my quick script</p>
      <p># -*- coding: utf-8 -*-<br>
      import fontforge;</p>
      <p>def change_name_XXXX00001(arg1,font):<br>
         prefix=fontforge.askString("Prefix..","Prefix:",'GLYPH');<br>
         numer=1;<br>
         for i in font.selection.byGlyphs:<br>
            i.glyphname=prefix+("%04d" % numer);<br>
            numer+=1;</p>
      <p>def EnableSel(arg1,font):<br>
         for i in font.selection.byGlyphs:<br>
            return True;<br>
         return False;</p>
      <p>fontforge.registerMenuItem(change_name_XXXX00001,EnableSel,None,<br>
      "Font",None,"Glyph_names","Change to XXXX00001");</p>
      <p>Save code to file or download it from:<br><a href="http://www.glukfonts.pl/temp/gluk_names.py" title="Click to visit an external URL." class="freelink freelink-external freelink-external">www.glukfonts.pl/temp/gluk_names.py</a></p>
