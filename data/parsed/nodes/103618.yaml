  - id: 558344
    user: 18942
    date: 2013-06-25T22:19:00
    date_raw: 25 Jun 2013 — 10:19pm
    votes: null
    html: |-
      <blockquote><p> I ran the scripts
      </p></blockquote>
      <p>What I wrote  needs to be completed according to the way you use the code. I use such code in python scripts I call from bash shells. Above, Grzegorz wrote the script so as to call it from the GUI, using the "Execute script" window. Let me just add his lines to get a complete script to use that way:</p>
      <pre>---
      fnt=fontforge.activeFont()
      for g in fnt.selection.byGlyphs:
        if g.unicode != -1:
           g.glyphname= fontforge.nameFromUnicode(g.unicode)
      ---
      </pre><p>You first select the glyphs to rename and then, in the "Execute script" window with that script in it you click ok. That script renames according to the unicode value, not to the hex digits that follow the uniXXXX name; it does not look at the name at all.</p>
      <p>Now here is a script that looks at the uniXXXX name. It will  rename only glyphs with a name of the form uniXXXX and  it assumes glyph names that start with uni are followed by a valid hex number, nothing else;  it does not check that what follows uni is a valid hex number. </p>
      <pre>---
      import string
      fnt=fontforge.activeFont()
      for g in fnt.selection.byGlyphs:
        name=g.glyphname
        if string.find(name,'uni') == 0:
          g.glyphname=fontforge.nameFromUnicode(int(name[3:],16))
      ---
      </pre><p>Again, you select the glyphs to rename, and click ok in the "Execute script" window.</p>
      <p>When you have many scripts, it is not handy to copy them all the time in the "Execute script" window. What you can do is save them in some file, say <code>unicode2name.py</code> and <code>uniname2name.py</code>. You then click "File &gt; Preferences &gt; Script menu" and give a name for the menu name, say "Unicode to name"; then you click on the three dots, go to the folder containing the script, put "*.py" in the the line just above "Filter" and click "Filter"; you will see the files .py appear. You select the one you want to associate to the given menu name.</p>
      <p>After, you can execute the script on the selected glyphs by clicking on "File &gt; Script Menu" and the appropriate name associated to the script. You can also execute with some key combination (it is control alt digit on my mac).</p>
      <p>A script that checks that the hex values are valid and that handles alternates (.sc, .alt, .ss02 etc) and also glyph names separated by an underscore requires splitting the glyph name and handling piecewise. Here is one that checks that the hex is valid and that can handle names of the form uniXXXXX.sc.ss02 i.e. alternames of uniXX...X</p>
      <pre>---
      import string
      ff=fontforge
      fnt=ff.activeFont()

      def ishex(h):
        return all(c in string.hexdigits for c in h)

      def gname(altname):
        l = string.split(altname,'.')
        name=l[0]
        if string.find(name,'uni') == 0:
          hexd=name[3:]
          if ishex(hexd):
            l[0]= ff.nameFromUnicode(int(hexd,16))
            return '.'.join(l)
        return altname
       
      for g in fnt.selection.byGlyphs:
        g.glyphname=gname(g.glyphname)
      ---
      </pre>
