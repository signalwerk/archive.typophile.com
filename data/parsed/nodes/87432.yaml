    html: |-
      <p>Okay, I've looked into this and found a problem in the VOLT source for the Cambria Italic and Cambria Bold Italic fonts: the 'ccmp' feature lookup that substitutes the cap versions of above combining marks for subsequent positioning when preceded by an uppercase letters is not mapped to the feature in the Serbian 'SRB' language system. So far as I can tell, this only affects the Italic and Bold Italic fonts.</p>
      <p>Thanks for catching this. I'll get this logged as a bug and will send a fix to Microsoft today. I can't say how or when they will get the fix released, though.</p>
    html_clean: |-
      <p>Okay, I've looked into this and found a problem in the VOLT source for the Cambria Italic and Cambria Bold Italic fonts: the 'ccmp' feature lookup that substitutes the cap versions of above combining marks for subsequent positioning when preceded by an uppercase letters is not mapped to the feature in the Serbian 'SRB' language system. So far as I can tell, this only affects the Italic and Bold Italic fonts.</p>
      <p>Thanks for catching this. I'll get this logged as a bug and will send a fix to Microsoft today. I can't say how or when they will get the fix released, though.</p>
