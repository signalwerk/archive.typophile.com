    html: |-
      <p>Sylph: <em>Also, in Cambria, is the Combining Ring Below supposed to look like this?</em></p>
      <p>What is happening here is that the GPOS mark positioning is moving the mark beyond the OS/2 table usWinDescent value. This means that the mark will be clipped in some software, but not in others. If you are using MS Word, you can prevent this from happening by using an exact size of linespacing in the paragraph settings, rather than a multiple of the default linespacing.</p>
      <p>In Michel's image, I'd say that the position of the mark under the default italic <em>д</em> is a bug. Probably my fault, I'm afraid. I think the mark height must be inherited from the upright font, where it needs to be lower because of the descenders of the д.</p>
    html_clean: |-
      <p>Sylph: <em>Also, in Cambria, is the Combining Ring Below supposed to look like this?</em></p>
