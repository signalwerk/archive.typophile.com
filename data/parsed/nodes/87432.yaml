      <p>I have to admit that I've almost given up trying to understand how MS Word determines when and where to clip. Setting the linespacing to an exact value appears to do a better job avoiding clipping of marks above than below. Testing the sequence you show, less of the ring is clipped as the linespacing gets larger, but obviously this isn't a viable solution.</p>
      <p>Note that this clipping should not occur when you print the document, including printing to PDF: it is the result of how Word paints each line of text on screen.</p>
      <p>I'm not able to reproduce the problem you show with Calibri à vs а̀: these display identically in Word 2007 on my system.</p>
      <p>Look closely at your image, above: the grave accent on the right appears to be from a different font, so maybe what you are seeing is a copy/paste error. Select the whole word and ensure that the font is Calibri.</p>
