      <p><cite>I have to admit that I've almost given up trying to understand how MS Word determines when and where to clip.</cite></p>
      <p><cite>But maybe some clever dude(s) or dudette(s) will remedy the situation with a pan-linguistic cross-platform script to help typographers by making that metadata available on the fly...</cite></p>
      <p>There is not need to even try understanding it. :) This is clearly an application bug and needs to be fixed by the application developers.<br>
      GPOS, and its arbitrary mark stacking mechanism in particular, by design (designed by Microsoft!) contradicts the idea that any font metadata would delimit the vertical region up (or down) to which attachments are visible. And likewise, the suggestion that OS/2 ascent and descent values would need to reflect every possibly additional mark is in contradiction to the idea and design of GPOS.</p>
