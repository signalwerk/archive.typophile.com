      <p>The H&amp;FJ link on <a href="http://www.typography.com/fonts/font_history.php?historyItemID=1&amp;productLineID=100008" rel="nofollow">Gotham's History</a> relates the font to signage on buildings. Here is the word "CORNER" in Gotham Bold.</p>
      <p><img src="http://typophile.com/files/gotham_6637.png"></p>
      <p>Their text starts with "Long before the emergence of a profession called 'graphic design,' there was signage. Up until the mid-twentieth century, the job of providing architectural lettering often fell to engineers or draftsmen, most of whom worked outside of the typographic tradition. "</p>
      <p>Link to image restored: was dated 10 Mar 2012. No other change.</p>
