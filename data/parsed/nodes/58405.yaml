    <p>I’m proud to anounce the first release of a vfb QuickLook Plugin for MacOSX Leopard. This is the long-missing thumbnail and preview generator for FontLab Studio document files. Now the .vfb files are real citizens in MacOSX.</p>
    <p>please have a look at: <a class="freelinking external" href="http://schriftgestaltung.de/tools/vfb-QuickLook.html" rel="nofollow">schriftgestaltung.de/tools/vfb-QuickLook.html</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/vfb-quicklook-screenshot_5216.png"></div><p></p>
