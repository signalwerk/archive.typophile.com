    html: <p>Yup, that's the same Watchmen. BTW, there's a movie of it in the works. See <a href="http://www.efavata.com/CBM/Watchmen.htm" target="_blank">http://www.efavata.com/CBM/Watchmen.htm</a> <br> <br>I think the second edition of Elements has plenty of nice improvements (and a few corrections), but at this point I'd probably hold out for the next version. Two weeks ago Bringhurst told me he was "finishing up" the third edition, so I'm thinking it will be just a few months. <br> <br>On a side note, of all the business/technology books I've read, <i>Information Rules</i> is the most interesting, readable, solidly thought out and well-grounded. It is to the business strategy and economics of high tech and software what <i>Elements</i> is to typography. <br> <br>Cheers, <br> <br>T</p>
