    html: "<p>I have been referring to Mr Bringhurst's book for some time (the first edition: should one upgrade, as with software?) It is very useful, but occasionally gets me into trouble. <br> <br>His advice to \"omit unnecessary punctuation\" is at odds (as he admits) with standard practice in North America for \"Mr., Mrs., and Ms.\" My attempts at reform have, without exception, been met with derision from editors and clients. <br> <br>What's the practice for periods after Mr, Ms and Mrs in other English-speaking parts of the world?</p>"
