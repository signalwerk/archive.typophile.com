      <p>Cool job Stephen. Nicolete is definetely the correct spelling according to extremely reliable sources (<a href="/wiki/James%20Mosley" class="freelinking" rel="nofollow">J.Mosley</a> strikes again)</p>
      <p>No worries Bruce, there's no hurry. Every day I discover more material even here in Brazil. The main library at the FAU USP (architecture and Urbanism university of S. Paulo) is excellent, it's just a matter of time. Don't do anything that will damage the magazines and always wear gloves! </p>
      <p>Yesterday I received an authorization by email from the AR editorial staff to reproduce part of an article on the SP university's periodical. They say they only need me to print a credit line line "First published in AR month/year and reproduced courtesy of The Architectural Review" because it's for academic purposes, maybe for Typophile is the same? I don't know. Probably. In any case they asked me to confirm that I would do that and I have the email printed just in case.<br>
      And Happy Valentine to us all, of course!</p>
