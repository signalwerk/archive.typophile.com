      <p><cite>Which of these articles was most interesting to you?</cite><br>
      Street Lettering is mind blowing as it is so in tune with the spirit of the magazine and the Townscape methodology (the art of juxtapositions in the built environment) so fashionable in the mid 50s/60s in England. She describes how certain name plates add something to the character of the place, giving it continuity, unity and individuality. She provides wonderful examples (Bath, Cambridge, Venice) and analyses the differences and…boy, she can write. Nothing is left out, legibility, proportions, purpose, contrasts, material, lighting. Modern Movement is brilliant; I love Macintosh lettering and you can really see how it was integrated in the building. I could go on forever but if you are interested in the relationship between lettering and architecture, this is a must. I have to thank Prof. Morley for introducing me to N.Gray, I admit I was in the dark. Far from being a scholar Chris! Lol! Now, gentlewoman…I like that!</p>
