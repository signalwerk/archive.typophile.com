      <p>Thanks for this list, Lore. A gentlewoman indeed! I am currently reading <em>XIX Century Ornamented Types and Title Pages</em>, which I miraculously found at my local public library. Nicolete Gray's refreshing admiration for the slab serifs and fat faces of the Industrial Revolution is a great corrective to the view that only book types are to be admired and considered "good".</p>
      <p>If you haven't yet seen it, the book Eben mentions, <em><a href="http://www.amazon.com/History-Lettering-Creative-Experiment-Identity/dp/0879236124/sr=1-1/qid=1170312571/ref=sr_1_1/104-9672182-5386346?ie=UTF8&amp;s=books" target="_blank" rel="nofollow">A History of Lettering</a></em>, is chock full of great photographs.</p>
      <p>And the latest issue of <a href="http://www.hyphenpress.co.uk/titles/typo_papers6/contents.html" target="_blank" rel="nofollow">Typography Papers</a> has an article by her, too.</p>
