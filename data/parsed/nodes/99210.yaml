    html: <p>I'm cool with you keeping <em>his </em>confidence. But I can speak. I'm Alan Bell, black and I'm friends with Dorothy. Although I don't remember the guy's name—we were more acquaintances than friends—here's a few more details that might help. At the time I was probably working on gay newspaper project called <em>Gotham Ledger </em>or maybe a successor project called <em>Gaysweek. </em>The loft was on the second floor of a building on 9th Ave. at 13th St.</p>
