    <p>Hi All! </p>
    <p>I'm a thesis student at OCAD (Ontario College of Art and Design) in Toronto, Canada, and I'm trying to start up a typeface foundry at our school called Xheight. </p>
    <p>The foundry will promote, nurture and distribute student typeface design through the web. There's also a printed annual component. </p>
    <p>Please help my research out by doing the survey at <a href="http://www.xheight.org" title="www.xheight.org">www.xheight.org</a> ! Suggestions are much appreciated as well :D Thanks!</p>
