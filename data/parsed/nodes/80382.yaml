    html: |-
      <p>The main content  will be typefaces that students have designed for the school's type design courses, other design courses and on their own time. As the site grows, other content may include visual typographic experimentations (such as typographic illustrations or novel use of typefaces)  and writings on the subject of typography.</p>
      <p>The community will be centered around helping improve each other's typefaces through critical feedback, ratings, and advise. Students can recognition by having an outlet to distribute their typefaces for use by the public.</p>
      <p>We are also looking to get the school faculty involved in curating feature typefaces, as to add a layer of credibility to that process.</p>
