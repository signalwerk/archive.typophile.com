    <p>hello</p>
    <p>i’m not happy with photoshop’s text smoothing. when a font (non-pixel-font) is like 10 px there are always ugly smoothing edges.</p>
    <p>how do i achieve these very fine text smoothing like in <a href="http://www.filemaker.com/" title="http://www.filemaker.com/">http://www.filemaker.com/</a> (manage people etc. top left). in photoshop this just looks ugly.</p>
    <p>what is the way to make very fine and accurate smoothing when text size is only like 10 px? thanks.</p>
