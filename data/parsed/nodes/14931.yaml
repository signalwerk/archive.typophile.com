    html: |-
      <p>Ultrafonts is a font house that specializes in grayscale pixelfonts, which render out hand-crafted anti-aliased forms (although only at one give PPEM size). This level of quality cannot be -or at least has not yet been- automated. Also, you can’t “convert” from some other format to an ultrafont - at least not without spending gobs of time cleaning up - time better spent making one from scratch (like my stuff is).</p>
      <p>hhp</p>
