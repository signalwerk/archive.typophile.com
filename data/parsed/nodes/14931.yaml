      <p>If you have the time and are saving as .gifs you can have an extra level of control by changing or removing the colours used in the anti-aliasing from the colour table in Photoshops ’Save for Web’ dialog.</p>
      <p>This is easier in ImageReady though.</p>
      <p>Ed.</p>
