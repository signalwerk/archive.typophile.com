    html: '<p> &gt; There’s no point in pretending to be objective. <br>&gt; Just choose your favorites. <br><br>Totally. <br><br>But dude, Plantin is a man among boys — it’s the real thing (as opposed to Times, the Prom King). I don’t care if the lc “a” has a ﬂawed pedigree — it more than makes up for it. <br><br>On the other hand, I’m one of those crazies who thinks that Cheltenham (the real one, not the <span class="caps">ITC</span> caricature) deserved its popularity: it has a distinct charm, and a unique readability. I think the fact that it was designed by a non-type-designer tends to mar the objectivity of some stodgy -or overly conservative, or overly pedantic- type designers (like Tracy, as much as I admire him for other things). And maybe the same negative forces are at work in the denial of the true origin of Times — but that’s another can of worms. <br><br><span class="caps">BTW</span>, I thought Cooper university (no, it’s not a school where you learn to make chocolate letters) had something like an “<span class="caps">IFDB</span>”. <br><br>hhp </p>'
