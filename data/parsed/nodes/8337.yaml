    html: <p> &gt; It’ll make us all feel good. <br><br>But what’s better than that? <br><br>&gt; your present president took his post with less of a quarter of the adult population of this country having voted for him <br><br>:-&gt; <br>And what a quarter it was… <br><br>&gt; One Steve Jobs with an old Linotype catalog in his garage had a bigger inﬂuence on the course of typedesign than all living typedesigners together. <br><br>Let’s not forget the other Steve (Wozniak) — the guy who actually built the thing. <br><br>&gt; 1. What makes a good typeface is decided by the users, not the designer. <br><br>In terms of popularity, sure. But what about quality? For example, the “users” of movie theatres choose the stupidest stuﬀ. <br><br><span class="caps">BTW</span>, I guess there’s nothing interesting to do in San Francisco on a Sunday night since the .com implosion? (I know there certainly isn’t in Glendale, at *any* time of the week.) I’ve heard that all the sushi bars in <span class="caps">SF</span> are now Denny’s. &nbsp;;-) <br><br>&gt; When we talk about the ten most used typefaces, I am not sure which culture we are looking at. <br>&gt; …. <br>&gt; I presume we mean the Western world, but we should all be aware that these presumptions are very arrogant and very unprecise.  <br><br>Right on! <br>Well, my list of 10 (which I thought we were not supposed to reveal before the 15th…) has one non-Latin font in it. The problem, of course, is how do you judge a font in a script you’re not familiar with? So maybe when somebody presents a list he/she should state its scope. <br><br>&gt; we read best what we read most. <br><br>But we also read best what we read best, no? <br><br>Anyway, I thought your list was very informative! Thanks. <br><br>hhp </p>
