    html: '<p> So... the Ten Favourite Fonts list. <br>As far as fonts go i have two categories: 1) All time favorites 2) Fonts that inspire but does not nesecarily meet up to the criteria in the first category, but nevertheless are important and interessting. This second category is less predictable and will perhaps give us a few not so well known fonts..and perhaps that will spark a discussion on what we individually strive to express in a typeface.  <br> <br>The all time favourite fonts will most certainly include fonts that we allready know...so I dont think it will produce to many surprises to us...So <br>it would be nice if everyone added a font that they like (not nessesarily for its perfection..but rather for inspiration).  <br> <br>(I regret for posting as Anonymous the first time...<img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)"> <br> <br>Sbo </p>'
