    html: "<p> I have only just stumbled upon this thread. Haven’t got time to read all of it, but remembered that I’ve had similar discussions before. I think a list is a great idea, especially if it is such a personal test. It’ll make us all feel good. It will, however, not change the world of type-usage out there one bit.  I have my own theory about the success of certain faces and it would be nice to explore at some point how something as despicable as Avantgarde Gothic or something as sickly cute as Optima ever became so popular. But then, your present president took his post with less of a quarter of the adult population of this country having voted for him. One Steve Jobs with an old Linotype catalog in his garage had a bigger inﬂuence on the course of typedesign than all living typedesigners together. <br><br>A few years ago, a journalist asked me what I thought were the ten most popular typefaces in use today. His question implied that those would also be the ten best typefaces of all time.  <br><br>Here is an excerpt from my answer: <br><br>1. What makes a good typeface is decided by the users, not the designer. <br><br>2. Most good typefaces have been designed for one purpose, they do not come <br>from a&nbsp;designer</p>"
    html_clean: "<p> I have only just stumbled upon this thread. Haven’t got time to read all of it, but remembered that I’ve had similar discussions before. I think a list is a great idea, especially if it is such a personal test. It’ll make us all feel good. It will, however, not change the world of type-usage out there one bit.  I have my own theory about the success of certain faces and it would be nice to explore at some point how something as despicable as Avantgarde Gothic or something as sickly cute as Optima ever became so popular. But then, your present president took his post with less of a quarter of the adult population of this country having voted for him. One Steve Jobs with an old Linotype catalog in his garage had a bigger inﬂuence on the course of typedesign than all living typedesigners together. <br><br>A few years ago, a journalist asked me what I thought were the ten most popular typefaces in use today. His question implied that those would also be the ten best typefaces of all time.  <br><br>Here is an excerpt from my answer: <br><br>1. What makes a good typeface is decided by the users, not the designer. <br><br>2. Most good typefaces have been designed for one purpose, they do not come <br>from a&nbsp;designer</p>"
