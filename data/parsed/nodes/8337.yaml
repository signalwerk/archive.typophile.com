    html: <p> Wow! Erik Spiekermann! An immortal amongst us!  <br>Erik is spot on here. There’s no point in pretending to be objective. Just choose your favorites. Trouble is, I don’t think anyone here would be particularly interested in my top ten as it would probably include such boring fonts as Cheltenham and Plantin — and where’s the fun in that?! The 2001 idea is not bad — but not exactly easy to be sure of as release dates are never clear after a font is launched. Plus there are so many new fonts released in a year, and nobody keeps track of them all. Not unless someone wants to start <span class="caps">IFDB</span>.com, along the lines of the Internet Movie Database -&nbsp;imdb.com. </p>
