  html: <p> I have an idea for a thread that will be fun and maybe Joe or Jared can confirm some guidelines. <br> <br>Everyone jot a list of their Top 10 GREATEST Typefaces of All-Time. (Maybe 'jot' isn't the best word. How about 'obsess over' a list?) <br> <br>Greatness would measure things like originality, longetivity, beauty, practicality, social importance, designer significance, etc. <br> <br>Then, on a set day (maybe Sunday, Dec. 9) at a set time (noon PST?) everybody post their lists. Then let the debating and ranting begin. <br> <br>But nobody post a list before that time to prejudice others. <br> <br>Joe, Jared, Typophiles, is this workable? </p>
