  html: <p> I have an idea for a thread that will be fun and maybe Joe or Jared can conﬁrm some guidelines. <br><br>Everyone jot a list of their Top 10 <span class="caps">GREATEST</span> Typefaces of All-Time. (Maybe ‘jot’ isn’t the best word. How about ‘obsess over’ a list?) <br><br>Greatness would measure things like originality, longetivity, beauty, practicality, social importance, designer signiﬁcance, etc. <br><br>Then, on a set day (maybe Sunday, Dec. 9) at a set time (noon <span class="caps">PST</span>?) everybody post their lists. Then let the debating and ranting begin. <br><br>But nobody post a list before that time to prejudice others. <br><br>Joe, Jared, Typophiles, is this&nbsp;workable? </p>
