    html: |-
      <p>All the alternate glyphs in the fonts are encoded in the PUA area, so you can actually insert those glyphs in Word. You'll just need to hunt them down using Charmap. The spelling won't be preserved, and you might get gibberish if you switch to a font other than Bickham.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Bickham_in_Word_6657.png"></div><p></p>
