    html: |-
      <p><em>WORD is not a program that supports OTFs</em></p>
      <p>It does. But not every OpenType feature.<br>
      The same is true of all applications!<br>
      For instance, Photoshop has no glyph palette.<br>
      And now, many foundries are putting features in OpenType fonts (e.g. , , ) which are not yet supported in any application, AFAIK.<br>
      So this is one area of fine typography where it's important to be knowledgable of which features are in which fonts, and which applications support them.</p>
