    <p>Hello all,</p>
    <p>I just wanted to show two typographic illustration posters<br>
    I've been working on recently. Their purpose is to generate<br>
    interest in my typo-illustration work.</p>
    <p>It's the first two images here, 'Sexy as Hell' and 'Natural Beauty'. </p>
    <p><a href="http://www.seblester.co.uk" title="www.seblester.co.uk">www.seblester.co.uk</a></p>
    <p>Weird, cool, offensive? Just plain dull? Any input appreciated.</p>
    <p>Seb</p>
    <p>ps. The lettering can be seen here too...</p>
