      <p>&gt; (Note the <em>permanently reserved</em> here.) This is used for 'internal use only', for codes that would *never* indicate a displayable glyph, such as the BOM and the codes for switching RTL/LTR.</p>
      <p>A minor correction: Unicode “reservation” has nothing to do with whether the <em>glyph</em> (I would say <em>character</em>) is “displayable”.  The codes for switching RTL/LTR are just “normal” Unicode characters.</p>
