      <p>Ah, wait: you are wondering when a code points is "officially <em>declared</em> reserved"!</p>
      <p>Well ... in the example of U+03A2 above, the codes clearly run parallel from uppercase to lowercase, per design. So the code point U+03A2 would <em>logically</em> be 'uppercase terminal sigma'; but, because there is no such beast (as yet), the code point is "reserved for (possible) future use". Whereas other code points are simply 'left over' and could be used for anything.</p>
