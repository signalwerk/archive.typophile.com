    html: |-
      <p>There are 2 different types of "Reserved". From "2.13 Special Characters and Noncharacters":</p>
      <blockquote><p>The Unicode Standard contains a number of code points that are intentionally not used to represent assigned characters. These code points are known as noncharacters. They are permanently reserved for internal use and should never be used for open interchange of Unicode<br>
      text.</p></blockquote>
      <p>(Note the <em>permanently reserved</em> here.) This is used for 'internal use only', for codes that would *never* indicate a displayable glyph, such as the BOM and the codes for switching RTL/LTR.</p>
      <p>The other kind of "reserved" is simply 'not (yet) in use'. Most blocks contain some reserved -- unassigned -- codes at the end, which is probably just to align the start of the <em>next</em> code block on a round hexadecimal number. Also, this free space can be used to add one or two useful characters to an existing block.</p>
