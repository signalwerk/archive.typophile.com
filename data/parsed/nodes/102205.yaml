    <p>While there are many unallocated codepoints in the Unicode Standard, some codepoints are specifically listed as "reserved" in the code charts.</p>
    <p>Since AFAIK all unallocated codepoints are effectively reserved, I was wondering if anyone knows why some codepoints are explicitly indicated as such. I can't find anything in the unicode documentation (<cite>The Unicode Standard v6.2</cite>).</p>
    <p>Just curious,</p>
    <p>André</p>
