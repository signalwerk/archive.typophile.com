      <p>It seems the committee had been contemplating a possible future use for "U+03A2":</p>
      <blockquote><p>From: Michael Everson (<a href="mailto:xxx@xxx.com">xxx@xxx.com</a>)<br>
       Date: Fri Aug 02 2002 - 19:12:46 EDT<br>
      At 11:13 +0200 2002-08-01, Otto Stolz wrote: </p>
      <p>&gt;I have selected U+03A2 with care: this code point covers the place<br>
      &gt;of a non-existing "Greek capital letter final sigma". I think that<br>
      &gt;this code-point -- while, admittedly, unsafe as any other unassigned<br>
      &gt;one -- is rather unlikely to get assigned a character, in the fore-<br>
      &gt;seeable future.<br>
      &gt;<br>
      &gt;Please do not promote an assignation to U+03A2 just do make a point :-) </p>
      <p>Do not tempt us. Oh, do not tempt us. If ever GREEK CAPITAL LUNATE<br>
      SIGMA needed a place to hang its curvy hat, it is surely U+03A2. </p></blockquote>
      <p>There is no rhyme or reason to individual glyph assignments. In this case, someone thought it might be possible for a valid character to appear -- an uppercase equivalent of the lowercase pair "final sigma/regular sigma". In other cases, code points may simply have been removed from the specification.</p>
