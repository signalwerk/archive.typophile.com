      <p>Hi Theunis,</p>
      <p>Thanks for the response.</p>
      <p>I wasn't actually thinking of noncharacters here. As an example, within the Greek block, there are some characters listed as "reserved" (e.g. U+03A2) and other characters which are not so listed, but which are still unassigned (e.g. U+0378).</p>
      <p>André</p>
