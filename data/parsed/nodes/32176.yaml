      <p>Like Terry said, your first list members look nice but they mostly don't stand up to any kind of POE* test.  Your second list gets closer to the sort of people I was referring to as the "handful."</p>
      <p>*POE = Post-occupancy evaluation</p>
      <p><em>Which test?</em></p>
      <p>In POE, there's not just one-size-fits-all test you pull off a shelf.  To develop a test, a set of variables is defined as being specific for the venue to be examined, a range of objective values is determined for each variable, a statistical weighting is assigned for each variable to ensure that variables are ranked and prioritized, a sample of people is selected to subjectively evaluate the subject area, and then you crunch a lot of math.</p>
      <p>Someone who knows what they are doing can construct and develop a test that will result in a statistically acceptable variance when all is said and done, assuming there is a fairly homogeneous sample to perform the evaluation to start with.  </p>
      <p>But things can get much more "interesting" (i..e., complex) when the inquiry starts to cover multiple venues, diverse evaluating sample (wide range of ages and abilities, in particular), or a poorly selected set of variables and inappropriate weighting to start with.</p>
      <p>As I said above, very few designers, architects, and planners have this sort of expertise, and feel that they "know best" when it comes to wayfinding.</p>
      <p>With rare exception, they don't.</p>
    html_clean: |-
