    html: <p>I think that Avenir could be used well, but it's not ideal. The best typefaces for this purpose have big apertures, low contrast, and easily distinguishable letterforms. Frutiger and Meta, as you mentioned, would work well, but Univers is not ideal, owing to its tighter letterforms. This is the thinking behind <a href="http://www.clearviewhwy.com" rel="nofollow">the new Clearview Highway typeface</a>.</p>
