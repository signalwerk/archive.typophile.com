      <p>Perhaps implementation of signage is the most overlooked aspect. Typeface is talked about and reviewed because it is involved in the whole process. It is rare that much real anylitical thought goes into the wording and placement of individual signs. An example is the Washington Metro developed in the mid 70s. Yes, the type is your basic Helvetica vinyls sign letters but that is another story. The sadder part is the number of handwritten signs placed by local Metro staff or frustrated passengers in order to rectify the poor implementation of the designed signage. Things magic markered on paper that say "This way to Virginia"  or "Airport this way" indicate that after 30 years, the signage still does not do the job.</p>
