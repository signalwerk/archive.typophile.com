      <p>&gt;choose one that best serves it’s function?</p>
      <p>That's an excellent idea. However, roads, captioning on TV screens, and signage in buildings seem to me significantly different. </p>
      <p>Clearview is so far as I know the only font demonstrated to be superior to existing US signage. As I remember you can read it 2 seconds sooner at 60 mph, compared to the existing standard. </p>
      <p>Wayfinding within a building would seem to me to have much more latitude as far as the issue of legibility. There I would think aesthetics become much more important--enhancing the mood and spirit of the organization or purpose of the building. Outdoor signage for pedestrians would seem to me to be somewhere in between...</p>
