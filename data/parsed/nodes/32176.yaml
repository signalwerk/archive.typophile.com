    <p>A question.<br>
    Is Avenir an appropriate typeface for wayshowing signage?</p>
    <p>My feeling is due to its open and organic letter shapes, long ascenders and descenders, a more contained and regular typeface would be better suited. If I could recommend a font for signage, it would be the likes of Univers, Frutiger, Meta, even Argo.</p>
    <p>Am I wrong?</p>
    <p><a href="http://en.wikipedia.org/wiki/Image:AvenirSP.png" title="http://en.wikipedia.org/wiki/Image:AvenirSP.png">http://en.wikipedia.org/wiki/Image:AvenirSP.png</a></p>
