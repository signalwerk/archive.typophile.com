      <p>A small aperture (as in Helvetica) can cause e's and c's to look like o's. Generally, it's more familiar and thus easier to read type with a wide aperture. It all goes toward making each letterform as easily distinguishable from a distance as possible, although ultimately most type should be okay enough for typical signage.</p>
      <p>EDIT: Carl, you're right; it's not typical of me to surrender so easily when it comes to type. I was just trying to assure Jem that most of the typefaces mentioned in this thread should work well; there's no single incredibly legible type.</p>
