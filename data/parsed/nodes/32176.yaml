    html: |-
      <p>Tiresias was designed by a vision researcher, not by a type designer. No type designers were involved in declaring it the perfect font to "improve legibility for all". For starters, the way captioning is done requires more than one style; Tiresias doesn't even have an Italic. Here's my favorite quote from John Gill: </p>
      <p> “Within the time available, thorough testing to determine the optimal design of the typeface was not possible. However[,] limited testing was done with patients in a low-vision clinic to identify the features of a typeface which they found helpful.”</p>
      <p>Accessibility issues are different for people with low or impaired vision (John Gill's main concern), and for people with normal or average vision who are deaf, and who require captioning to access media content. Those issues were ignored in the Tiresias research, such as it was. And we're talking about type for wayfinding, which is yet a different challenge. Tiresias has a few merits for those with low vision, but it's far from ideal for general wayfinding.</p>
