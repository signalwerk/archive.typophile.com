  html: |-
    <p>Punchcut is looking for a Design Intern with strong interests in Interactive Design for a variety of experiences including next generation rich media for both Web-Based and Mobile User Interfaces. This opportunity will provide you with the crucial experience needed once the time comes to hit the pavement with your portfolio.</p>
    <p>//YOU:</p>
    <p>• Young design student or aficionado who is passionate about design and interactivity, and completely obsessive over the details. You probably enjoy discussions involving keyframes and anti-aliasing, and can typically be found staring at the letter spacing in that obscure, local rag. Favorite colors include, #FFCCFF, #99FF33, and R 67 G 59 B 255.</p>
    <p>• Proficient on Mac OSX and the following applications:<br>
    	  – Photoshop CS<br>
    	  – Illustrator CS<br>
    	  – InDesign CS (Not required)<br>
    	  – Fireworks (Not required)<br>
    	  – Flash (Not required)<br>
    	  – XBox 360 (Also not required, but useful)</p>
    <p>//PUNCHCUT:</p>
    <p>• Punchcut is a user interface design and development company that specializes in improving mobile UI experiences. With a solid understanding of the new contexts of mobile life, we design and develop next generation user interfaces that engage customers, streamline transactions and enhance mobile user experiences. Punchcut is also known for our passions in typography. In 2000, founding partner Jared Benson created Typophile, enabling students and novices to easily interact and communicate with the world’s greatest type design professionals. Today, Punchcut remains active in nurturing this community and is currently engaged in the design and development of our own typefaces optimized for mobile usage.</p>
    <p>• With a client list designed to impress, we will provide you with the necessary skills and experience to expand your portfolio and prepare you for a career in design.</p>
    <p>The position is available immediately, with a duration of 3 to 6 months. If you are a student that is currently enrolled in school, we are willing to make adjustments in the timeline based on class schedules. Punchcut is located in San Francisco and prefers to hire someone locally. However, we are willing to consider applications from any location.</p>
    <p>//SUBMISSION REQUIREMENTS:</p>
    <p>• Please submit a resume and a letter of intent. Explain to us why you believe you are right for the position.</p>
    <p>• Portfolio containing 5-10 pieces that demonstrates a solid understanding of design, typography, color theory, attention to 	  detail and most important, your personal design sensibilities. </p>
    <p>• Submission formats we will accept are: PDF, SWF or a provide a URL pointing to a site online. Please keep it under 10mb.</p>
    <p>• Send all submissions and inquiries via email to: <a href="mailto:zara@punchcut.com">zara@punchcut.com</a></p>
    <p>We look forward to hearing from you and can’t wait to review your work! If you have any questions, please don’t hesitate to email us at the email address listed above. Thanks!</p>
