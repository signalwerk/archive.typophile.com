      <p>I agree with you both - the spur at the foot of the G matches Bodoni Poster Compressed &amp; Onyx (Bitstream version). Interestingly, the other 3 versions of Onyx (<a href="http://www.myfonts.com/search?search%5Btext%5D=onyx" title="http://www.myfonts.com/search?search%5Btext%5D=onyx">http://www.myfonts.com/search?search%5Btext%5D=onyx</a>) have different shaping in this area. I think i’m going to go with the Bodoni version.</p>
      <p>Thanks both of you for your help &amp; time.</p>
