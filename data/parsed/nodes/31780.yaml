      <p>Well, I like logos in general... so I also like personal logos. Although I'm sure there's logos that use the paper icon (and I'm sure countless with CMYK color schemes) I've never seen one upside down. The fact that your first initial is hidden in there is a nice accident. I'd suggest to try adding a counter to the "P" but I think that would destroy the subtly... and probably ugly it up a bit.  </p>
      <p>Sometimes the most obvious solution is the best one.</p>
