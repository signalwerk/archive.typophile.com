    <p>Iv been designing a new website portfolio for myself, and i was using the 'paper' symbol on many printers for icons for each project. I am a print based designer usually. I wasnt trying to make a logo but i turned the symbol upside down and it looked like a P, so i made this:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/logos_6213.jpg"></div><p></p>
    <p>The thing is im never really in favour of personal logo's especially for students (like me), comes accross slightly pretentious to me. However im using the paper icon on my site anyway so i though this might be acceptable.</p>
    <p>What do you think about it? Does it say 'print designer', i have a bad feeling this is such an obvious logo it will have been done a thousand times. I wasnt really looking to make a personal logo but this just came to me...</p>
