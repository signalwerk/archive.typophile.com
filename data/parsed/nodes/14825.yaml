  html: |-
    <p>I am enquiring about information regarding typography for educational multimedia for primay school age children. I am aware that there is a vast difference between first and sixth graders in terms of skill level and needs.</p>
    <p>Specifically, I am interested in peoples thoughts on font selection:</p>
    <p>x-height<br>
    weight</p>
    <p>and, setting type:</p>
    <p>leading<br>
    kerning<br>
    point size<br>
    characters per line</p>
    <p>Thanks.</p>
