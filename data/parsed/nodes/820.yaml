    html: <p>Thank you all! <br> <br>Eras was my first guess at a design root for this face, but the similarities are merely aesthetic. <br> <br>The postmaster font is a bit, uh... sloppy, and the weights are off, but it'll do for my purposes. <br> <br>And by the word "jobbie" I mean that it was more than a one off, since it is used for the entire identity system for the USPS redesign. <br> <br>Thanks again!</p>
