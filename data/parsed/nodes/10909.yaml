    html: <p>Rob posted a pic <a href="http://www.paperbears.com/type/" target="_blank">on his site</a>. <br> <br>Left to right it's Jesse (is he picking my pocket?), me, then  <br>Graham Hicks, Jared Benson, Jim Parkinson, Roballoo and  <br>Cheshire Dave. Oh, and can't forget Chesh's girlfriend,  <br>behind the camera. <br> <br>Not pictured is Stephen who showed up two hours late, at  <br>Jared's. He had enough time to watch a classic Twilight  <br>Zone episode starring a mysterious Linotype. <br> <br>The funnest part was sitting in the cafe, watching <br>strangers come in and speculating whether they were  <br>typophiles or regular customers. The biggest surprise <br>was Oakland resident, Jim Parkinson who dropped in.</p>
