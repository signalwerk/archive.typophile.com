    html: "<p>To confirm the rumor, Yes! On Saturday, April 26th (eleven  <br>days from now) we're gathering for an impromptu meet and  <br>greet at a *yet-to-be named cafe in Emeryville, California.  <br>Just across the Bay bridge from SF. <br> <br>Come. Buy yourself lunch. Hang out and chat with other  <br>typophiles. Get your tee you've waited ages for. If we coerce  <br>Graham Hicks to come you can make him sign your shirt  <br>that he designed. **BYOS. <br> <br>So far the tentative guest list is: <br> <br>Jared Benson <br>Joe Pemberton <br>Stephen Coles <br>Cheshire Dave <br>Christopher Simmons <br>... <br> <br>How about you other Bay Area kids? <br>Rob  <br>Graham <br>Dan <br>Aaron <br>Dana  <br> <br> <br>* Cheshire, any recommendations for a good place <br>to eat? I only live there, I never dine there. <br> <br>** Bring your own Sharpie.</p>"
