    html: <p>OK - Decisions decisons.  <br> <br>Do I cut my Java programming class to attend this once in a lifetime event, or do I stay and try and get caught up on a class I'm already behind in? <br> <br>As to meeting actual font people in person, will this quell my burgeoning fontaholism or enrage an already expanding desire to unparalleled proportions furthter alienating me from my family and friends? <br> <br>Questions, questions. <br> <br>~ Roballoo!</p>
