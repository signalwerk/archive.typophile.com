    html: <p>When I've worked with Operina, I found the word spacing to be too wide in relation to the letterspacing. How do you find it? <br> <br>Watch word pairs that need tightening and loosening in relation to the swashy character too. And don't be afraid of the alternate characters, they did a beautiful job of giving plenty to play with. For instance, on the second page you could use an alternate R in "Resolution" to get the spacing in between R and e to look good. <br> <br>Fun use of a beautiful face.</p>
