    html: <p>Eduardo, thanks for the pointer on SC italics. I'll deal with that. <br> <br>As for a darker text face, I'm looking around for something Venetian-y or Garalde that's a shade darker than that garamond; no such luck yet. Kyle, I'm tempted to think that Pentegraf is too mannered; it's pretty, though. I'd like to avoid sinking large quantities of cash into this, since it's a personal project that I don't expect to produce much in the way of returns. (I'd appreciate recommendations, though; it's always good to expand one's type library.) <br> <br>If it helps to clarify my intention, the Operina is supposed to be a little jarring; it's only used for some very infrequent technical items. Italics are used for ordinary emphasis. Perhaps it'll improve the layout to tone down the contrast with the text a little, but I don't want to lose the effect entirely. <br> <br>Thanks for the pointers, all.</p>
