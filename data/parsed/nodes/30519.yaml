      <p>Well, my best hope was the Jaspert 'Encyclopaedia of Type Faces' and I struck out there. The closed P seems popular in some Dutch types, but even some American types in the early 20th century had it. We may not get this one unless someone has some good old German type books.</p>
      <p>- Mike Yanega</p>
