    html: <p>Ludwig, I own a couple of «Insel»-books of that time. In some of them, as well as in the mighty tome «Deutsche Buchkunst 1890 bis 1960», the type is simply referred to as <strong>Janson Antiqua</strong>. I’d imagine that it’s an otherwise unknown (and in my opinion quite ugly) version from the late 19th century. Have you already asked the <a href="http://www.bleisetzer.de" rel="nofollow">Bleisetzer</a> Georg Kraus? He might give you further advise.</p>
