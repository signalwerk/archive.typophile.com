  html: |-
    <p>Hi,<br>
    I found this german book from 1919, which was printed in Leipzig and I am trying to find out which type it is. Its quite narrow , I like the proportions, especially of the capital letters. Has anyone an idea what it could be? The title of the books "Jeremias" by Stefan Zweig and was published by Insel-Verlag.<br>
    ludwig</p>
