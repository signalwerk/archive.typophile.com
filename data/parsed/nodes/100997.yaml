    <p></p><div class="imageWrap"><img src="http://typophile.com/files/hwtpresents_March_6534_3806.png"></div><p></p>
    <p><a href="http://www.hamiltonwoodtype.com/arabesque.html" rel="nofollow">Arabesque</a>  and <a href="http://www.hamiltonwoodtype.com/bonair.html" rel="nofollow">Bon Air</a>, two alphabets from two different centuries, are not what most people immediately think of when they think "wood type". These quirky script fonts simulate hand lettering from very different eras and are now brought into the digital age for the first time ever. A third font, <a href="http://www.hamiltonwoodtype.com/catchwords.html" rel="nofollow">Catchwords</a> , brings a classic printshop resource into the digital designer's toolbox. </p>
    <p>Detailed information regarding these releases, including  the "Making Of The Font" feature, can be found at the Hamilton Wood Type Foundry website: <a href="http://www.hamiltonwoodtype.com/" rel="nofollow">here</a>.</p>
    <p><a href="http://www.hamiltonwoodtype.com/arabesque.html" rel="nofollow">HWT Arabesque</a> is long lost Art Nouveau wood type from the Hamilton Collection. It evokes the excesses of Victorian design and the equally quirky 1960s Psychedelic era revival of the Victorian type styles. Many characters have a lively eccentricity that were all left true to the original design. Additional characters were designed to fill out the standard range of characters found in digital fonts. This font includes over 280 characters for full unicode support of Western and Central European Latin characters. </p>
    <p><a href="http://www.hamiltonwoodtype.com/bonair.html" rel="nofollow">HWT Bon Air</a> is a "Mad Men" era display font. It was one of a series of script typefaces cut into wood by the Hamilton Manufacturing Company for the Morgan Sign Machine Co. in the mid 20th Century. The font was issued with several alternate letters and ligatures to simulate the effect of hand lettering. Its lively strokes and odd details give it an exotic flavor suitable for advertising display work. The digital version includes all of the original alternates plus new characters to fill out a full European character set. </p>
    <p>Catchwords have always been offered alongside standard alphabets in wood type catalogs and so often appear on posters as a decorative punch that they have become part of the wood type vernacular. Words like 'The', 'And', 'To', 'For', and less common abbreviations could be inserted into a design along with decorative ornaments or stars when space was tight or to add variety in the design. <a href="http://www.hamiltonwoodtype.com/catchwords.html" rel="nofollow">HWT Catchwords</a> features over 80 words based directly on designs offered by Hamilton and other wood type manufacturers of the 19th and early 20th Century. </p>
    <p><a href="http://www.hamiltonwoodtype.com/" rel="nofollow">Hamilton Wood Type Foundry</a></p>
