  html: |-
    <p>I was just wondering whether any of you guys recognized this face? To me it initially looked like bembo but it doesn't quite match. The question mark character is completely different, similar to MC's Galliard or Dante. I've looked at the aldus-like types such as Iowan, Dante, and some other garalde faces but can't find a match. Distinctive characters are the upper case Y, the ?, and the B, whose crossbar doesn't quite reach the stem. It looks so familiar, perhaps because of the similarity to the aformentioned faces but also perhaps because, like my <a href="https://web.archive.org/web/20080209134027/http://www.typophile.com/forums/messages/83/35876.html" target="_blank">Fritz Quadrata blunder</a>, I'm losing my mind.  <br> <br><img src="https://web.archive.org/web/20080209134027im_/http://www.typophile.com/forums/messages/83/36319.jpg" alt=""> <br><img src="https://web.archive.org/web/20080209134027im_/http://www.typophile.com/forums/messages/83/36320.jpg" alt=""></p>
