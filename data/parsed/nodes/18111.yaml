    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 22.Feb.2006 8.07am </div>
      <p>/////</p>
    <p>· Celebrating 10 years of Device Fonts, this beautiful volume exhaustively documents every design<br>
    · Introduction by reknowned type designer and creator of the Meta typeface, Erik Spiekermann<br>
    · Essay revealing the design processes behind the typefaces by Rian Hughes<br>
    · 160 pages packed to the brim with samples of each font, including brand new "Zephyrmen" releases</p>
    <p><strong>Available in:</strong><br>
    · Limpback edition with illustrated flaps<br>
    · Limited hardback edition, with full colour dustjacket and embossed lime-green hardcover, signed and numbered by Rian Hughes. <strong>Limited to just 150 copies!</strong></p>
    <p><strong>About the author:</strong><br>
    Rian Hughes is an internationally respected type designer, graphic designer and illustrator, whose clients include Swatch, Virgin Atlantic, MTV, the BBC and DC Comics. He has been awarded the BDA International Gold Award and Campaign Press Awards Silver in 1996, and a Merit Award from the New York Art Director's Club in 2000. He has contributed to numerous international exhibitions, lectured widely both in the UK and internationally, and a one-man exhibition of his work was held recently at the Conningsby Gallery, London. A retrospective book collection, <em>Art Commercial</em> was published in 2002.</p>
    <p><em>"...the commissions - and awards - keep coming. Hughes is a great communicator. As a vibrant sampler of one of the most succesful and prolific british illustrator-designers of the past twenty years, this is one device that any aspiring all-rounder should own."</em><br>
    <strong>Roger Sabin, <em>Eye magazine</em></strong><br>
    [reviewing <em>Art Commercial</em>]</p>
    <p><em>Rian Hughes is brit-pop for typography at its best.</em><br>
    <strong>signalgrau.com</strong></p>
    <p><em>Rian always produces fonts with an expertise and commitment that gives his work great depth.</em><br>
    <strong>Jonathan Barnbrook</strong></p>
    <p><em>With his ever-present penchant for self re-invention and his restless pursuit of innovation, Rian Hughes should retain his unpredictable creativity and predictable quality for a good many years to come.</em><br>
    <strong><em>Creative Technology</em></strong></p>
    <p><strong>Advance copies of the book available now from Fontworks</strong> - see contact details below</p>
    <p>Details: 160pp, 22.8 X 14.6 cm, published March 2006<br>
    Binding: Paperback or<br>
    Limited Edition Hardback<br>
    ISBN: 0 9551376 0 8 (Limpback)<br>
    0 9551376 1 6 (Hardback)<br>
    EAN: 9780955137600<br>
    Price: £9.99 (Paperback)<br>
    £19.99 (Limited Edition Hardback)</p>
    <p><strong>Available:</strong> From Fontworks and all good bookshops<br>
    <strong>Special Offer:</strong> Spend over £99 with Fontworks on Device Fonts and receive a free copy of the limpback<br>
    (while stocks last)</p>
    <p>Fontworks UK Ltd: <a href="http://www.type.co.uk" title="www.type.co.uk">www.type.co.uk</a><br>
    New North House, 202-208 New North Road, Islington,<br>
    London N1 7BJ. Tel: 020 7226 4411 Fax: 020 7226 4422<br>
    E: <a href="mailto:sales@type.co.uk">sales@type.co.uk</a> Press contact: <a href="mailto:joe@type.co.uk">joe@type.co.uk</a></p>
    <p>Published by Device: <a href="mailto:info@devicefonts.co.uk">info@devicefonts.co.uk</a><br>
    A comprehensive overview of the type design of one of modern graphics' leading figures</p>
