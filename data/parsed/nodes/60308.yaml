    <p>hello everybody,</p>
    <p>I have a friend who is psychiatrist/pedo-psychiatrist and who ask me for a logo. He ask me two thing; he'd like to have the "Psy" Ѱ greek letter inside the logo and/or to have a notion of evolution/getting better. Right now i didn't have found the solution - if any - with the two requirements. The initials of his familyname and forename are "mm"<br>
    So I have two projects, i tried to be very sober and minimalistic, the logo usage for his needs will be almost always in black:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/psy1_5735.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/psy2_5499.jpg"></div><br>
    So, any thoughs on this that might help?<br>
    thanks.<p></p>
