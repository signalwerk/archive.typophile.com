    html: |-
      <p>Small update. Still working away on this, seems to get php to read an otf file (even just extended latin chars) is not possible. But if the font is in ttf format, then it will display all the items (minus opentype extras). So, just getting say like the Euro symbol to show in php with the built in fucntions of imagettftext will not output via otf correctly, you would need to convert the otf to ttf first.</p>
      <p>Still made no ground on getting the opentype features to show yet, such as salts and swash, etc.  </p>
      <p>But I think there is some misleading info about php/gd is all you need, sure. But I am not seeing php/gd even read the extended items of OTF files correctly, tried numerous ways to send the unicode values into php, no dice.</p>
      <p>If anyone has done this (contradicting above), feel free to share..  ;)</p>
