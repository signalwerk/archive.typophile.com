      <p>It looks like they're using the GD library, if that wasn't glaringly obvious.</p>
      <p>You could cut out the work of drawing the grid and glyph-name characters by creating your own image, opening it and drawing the glyph set onto it.</p>
      <p>I believe GD lib works with .otf and .ttf and unicode, but check the documentation! If you need UTF-8 you may be out of luck.</p>
