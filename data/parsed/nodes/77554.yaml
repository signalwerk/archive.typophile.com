    html: <p>After a little break, I revisited this. Using Fontaine worked quite nice, its the only thing I have seen so far that can read both TTF and OTF very clean. Once I got the JSON output filtered, you can pluck out the JSON values you would like, very nice. But, this hasn't helped me much on the character map idea, at this point I might go exploring some outside coders to finish it. Not sure how GD and PHP only can display this idea (as mentioned above). Maybe with truetype files, but I cannot see just those two alone being able to display opentype glyph tables. You guys at fontsquirrel must be pulling some crazy GD/PHP trickery.</p>
