    html: |-
      <p><cite> ... without hacking the font itself.</cite></p>
      <p>Do you mean, without setting valid Unicode points to each and every single glyph? I've written a small utility to output the <em>character map</em> of an OTF font into a text file, but it's of no use for glyphs. (JSON is not in my list of output options, but it could be added, were I inclined to.)</p>
      <p>Using FreeType, it <em>should</em> be possible to write a C program to output an image alike the sample, but containing <em>all</em> glyphs, so it's probably possible with PHP as well.</p>
      <p> See <a href="http://www.typophile.com/node/52647" rel="nofollow">my SeeFont</a>, for example; a thin Windows wrapper around FreeType, not limited to showing just Unicode characters.</p>
    html_clean: |-
