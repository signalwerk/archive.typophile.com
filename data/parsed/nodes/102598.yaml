      <p>One big aesthetic and functional advantage of the broad-nib pen is its ability to generate stroke contrast (even though that was essentially dumb luck). Which to me however does not mean it deserves pride of place in type design.</p>
      <p>BTW there was actually a historic, long-running discussion between Nicolete Gray and Gerrit Noordzij about the relevance of the ball-point pen versus the broad-nib pen. Gray's position was that the ball-point pen is (or rather, was) the tool of our time. All I have to say is: now that we're back to the index finger I hope our typefaces don't start looking like they were made in pre-school!</p>
      <p>hhp</p>
