      <blockquote><p>Sans were first used for text in Germany, by the Bauhaus and then others as part of the modernist movement there.</p></blockquote>
      <p>In Germany, monoline scripts were used in technical drawings (standard as from 1919) and scientific illustrations long before (1850ties) the Bauhaus even noticed typography as something that could be designed. Before the first technical drawing pens such as the Standardgraph were constructed, round-tipped pens such as the Ornament-Feder by Brause or the Redis-Feder by Heintze &amp; Blanckertz were used.</p>
