      <p>Back in the late '50s when I was a teenager, I liked fountain pens. They had them with little plastic cartridges, so the spill/leakage problem was less. And the ball point pens of the time leaked, too. But the cartridges were a little expensive, and I could write smaller with a ball point....</p>
      <p>I was more interested in whether or not anyone felt the rise of the ball point had an effect on type design &amp; the rise of the sans serifs.</p>
