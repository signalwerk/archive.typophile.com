      <p>Albert Jan, that's interesting, and could have been an influence. Also in Germany I believe that a lot of scientific writing was published in roman script, even while black letter still dominated elsewhere. So probably those technical and scientific captions would have been done in roman style, rather than fraktur, right?</p>
      <p>Given that pencils go back to the 16th century, it is interesting that the thin monoline script never, it seems, became a model for printing. Perhaps they just don't work that well for the eye, at least in extended text.</p>
