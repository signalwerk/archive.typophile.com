  html: <p>I've read the thread on  Greek typography -- well, a goodly portion of the almost 300 posts. All the talk about scribes and pens lead me to wonder what effect  the ball-point pen has had on type. Does anyone *like* the writing from ball-point pens? Can we blame/credit it for the proliferation of sans-serifs? Etc.</p>
