      <p>Charles, I think the chronology is wrong for the ball point pen to have been a force, at least early on. Sans were first used for text in Germany, by the Bauhaus and then others as part of the modernist movement there. My own pet theory is that this was partly a nationalist thing: a way for German designers to reject blackletter for text, while not appearing to be traitors to foreigners, who had used roman style text for centuries. They weren't aping Italians or French, but rather becoming 'International'. The internationalism also matched the socialist ideals, which many modernists had allegiance to. </p>
      <p>Ball point pens didn't become widely used until after WWII: <a href="http://en.wikipedia.org/wiki/Ballpoint_pen#History" title="http://en.wikipedia.org/wiki/Ballpoint_pen#History">http://en.wikipedia.org/wiki/Ballpoint_pen#History</a> . So they could have conceivably helped ease the acceptance of the 'international style' that had started in the German speaking world. But they couldn't have been the thing that started it. </p>
      <p>There are now plenty of scripts and lettering influenced by the ball point pen, but they don't seem to be all that popular.</p>
