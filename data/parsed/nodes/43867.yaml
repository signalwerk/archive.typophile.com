    <p>I've been playing with FontShop's FontStruct for the past two days. I decided to turn Wim Crouwel's New Alphabet into a font. I thought FontStruct set up would work in recreating Crouwel's design. Wanted to post it up here for feedback.</p>
    <p><a class="freelinking external" href="http://fontstruct.fontshop.com/fontstructions/show/new_alphabet" rel="nofollow">http://fontstruct.fontshop.com/fontstructions/show/new_alphabet</a></p>
    <p>I also made an attempt at making New Alphabet more legible but sticking to the same principles.</p>
    <p>here's that:<br>
    <a class="freelinking external" href="http://fontstruct.fontshop.com/fontstructions/show/pentagrid_alphabet" rel="nofollow">http://fontstruct.fontshop.com/fontstructions/show/pentagrid_alphabet</a></p>
