      <p>&gt;In order to select "local" over "non-local" there<br>
      &gt; should be a clear benefit to doing that. </p>
      <p>Picking a local designer can have several advantages.  I think you can size up a person better when you meet them in person and look them in the eye, rather than through an email. A local designer may have local references you can check, which may include people or businesses you know personally. A local designer can meet the client and see their business in person, which can help them get a better feel for both. It's much easier for a local designer to design signage (which often requires making mockups and judging in person how they look), and can personally inspect the signage when it's delivered. A local designer can work with a local print shop, meet personally with the printer's rep, and do a press check while the jobs are being printed. A local designer may have a good working relationship with local newspapers and other media outlets where the client may want to advertise. </p>
      <p>And frankly it's easier to put a little pressure on a designer who's slacking off when you can physically walk into their office. </p>
      <p>I'm not saying that working with an out-of-town designer is bad; it's quite common and often works out well.  But there are advantages to working with someone local.</p>
