      <p>Or google "graphic designers". I'd avoid having it designed by a printing company as design is not their main business, but a printer may be able to suggest local designers.  And if any local businesses have nice logos, ask them for the name of their designer. </p>
      <p>Talk to several designers, look at their portfolios (especially their logos), get written estimates, and ask for the names of recent clients you can contact to ask how the jobs went.</p>
