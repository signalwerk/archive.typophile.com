      <p>tmac, I agree there's been some bad advice in this thread, but some of what you suggested I already suggested in an earlier post.</p>
      <p>And I'll add that a client who is a design novice should never just "buy a logo", even if it's from a good designer, because a logo is only seen by clients when it's in use on something — a letterhead, business card, website, flyer, or whatever, and you'll end up with a nice logo slapped on a series pieces that are poorly designed and don't communicate well.  The designer should not only create a logo but design the stationery, website, and related marketing materials.</p>
