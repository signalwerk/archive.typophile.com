      <p>Yeah, I may have trolled a little. But I found some of the suggestions outlandish.</p>
      <p>If I review my work it's 75% local. Maybe it's old fashioned but there is a benefit for a regional client to have a regional designer as they will have a better understanding of the cultural milieu. The OP is distinctly regional; it's not fishing charters in Belize for international clientele.</p>
      <p>Of course, there are examples showing the opposite. Such as Old Faithful (which, Apankrat, you probably know of). And the proprietor there, he did just as you said -- skimmed portfolios until he saw what he liked, which happened to be in Austin. The distinction is that this proprietor has a refined sense of what he wants his business to look like. </p>
      <p>Anyway, regional vs non-regional/international: this could go on forever and not be entirely fruitful. Over n out.</p>
