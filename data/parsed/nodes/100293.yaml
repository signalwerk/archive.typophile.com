      <p>And how many clients did you get through the local chamber of commerce?</p>
      <p>Also, an answer for #2 please.</p>
      <p>----</p>
      <p>The bottom line is that tmac is trolling. What he said is what any "local designer" <em>wants</em>, but it doesn't really align with the interests of a vast majority of potential clients. In order to select "local" over "non-local" there should be a clear benefit to doing that. A benefit that is absolutely bloody obvious to the client. And the way things stand there is no such benefit, especially not for those who look to design a one-off logo.</p>
      <p>The branding is indeed a face of a company, so picking a designer is a substantial commitment and it comes with an inherent risk of making the wrong choice. The way to lessen the risk is to look at designer's portfolio and "How I work" section. This is what matters. If the designer happens to be local, it's just an icing on the cake, but it's hardly <em>the</em> selection criteria.</p>
      <p>So the most sensible way to go about picking a designer for a project is to flip through their portfolios. And the simplest way to do that is to skim through sites that serve as portfolio aggregators - Behance, Dribbble and Logopond.</p>
      <p>"Sheesh."</p>
