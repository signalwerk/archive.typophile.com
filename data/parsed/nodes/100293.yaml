      <p>Wow, this thread is garbage.</p>
      <p>The advice is nearly a cliche of the stupidest things to do:<br>
      1. Go to the print shop/copy shop<br>
      2. Here's an irrelevant clip art POS<br>
      3. Go to logopond<br>
      4. Hire Jessica Hische! Sounds good. Hire Sagmiester too. Have Mathew Barney do your TV spots. Hire Alexander McQueen to do your fishing vests. Too bad Bruno Munari is gone -- he could have done you a kreel.</p>
      <p>Shane:<br>
      Hire a local graphic designer. Make sure your contract has a schedule, shows how many rounds of revisions, and perhaps has a option to kill the deal built into it. It should explicitly state deliverables, which include: Brand standards guide (can be very simple, specifying logo use, colour way, type specification), logo files in all necessary forms (vector, raster, B&amp;W, colour, etc), and anything else you think is needed (ie: it could include a series of icons or illustrations that work together). You are pretty much buying a toolset for communicating with the world, and for persuading people in the world to give you money. </p>
      <p>Get references from other businesses in your area. </p>
      <p>You may like to find a designer who knows what flyfishing is (that will speed up the process) and thus won't offer you clip art of a pike eating a treble-hooked thing.<br>
      Best of luck.</p>
      <p>Sheesh. Bad day on typophile. Or rather, just another day on typophile.</p>
