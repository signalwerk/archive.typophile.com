  html: "<p>I could use some help creating a simple <br>test font for Windows.  I'd like it to have the US latin alphabet and the following characters: <br> <br>\\u5000 <br>\\u20050 <br> <br>I don't have any experience creating fonts. <br>Can someone suggest a good tutorial site <br>or some 'font creator' software? <br> <br>Thanks in advance for any help. <br>--Erik Ostermueller</p>"
