      <p>Avil (Inland Type Foundry, 1904) was basically a version of Goudy's Pabst Oldstyle (ATF, 1902) but slightly narrower. Both were designs in a popular advertising vernacular of the time. </p>
      <p>Inland eventually merged with ATF in 1912. I suspect that Pabst was the better seller at the time (Goudy being more "name-brand") and the two designs are so similar, ATF probably chose not to continue producing Inland's Avil. It doesn't show up in the 1923 specimen.</p>
      <p>Both designs seem pretty anachronistic now.</p>
      <p>Lanston Type Company (now a division of P22) offers a digital version of Goudy's <a class="freelinking external" href="http://www.p22.com/lanston/pabst.html" rel="nofollow">Pabst Oldstyle</a>.</p>
