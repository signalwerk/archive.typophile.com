      <p>Thanks guys!  Kent, thanks for the link to P22 - they've got some great fonts there!  What I liked about Avil over Pabst was the seemingly taller ascenders.  I found "Nicolas Cochin" to fill that gap, though on the P22 site.  Awesome!</p>
      <p>Tipus, thanks for the book link.  If I get crazy enough I might buy some font software, scan the characters, and reproduce it.  I've been known to do stranger things - I picked up a NuArc Plate Burner a couple weeks ago!  =)  Fun stuff.</p>
      <p>--A</p>
