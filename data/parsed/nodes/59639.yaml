    <p>Hi all!  First post - likely not the last since I'm really super enjoying delving into this world!</p>
    <p>Was trying to find a font to match this typeset; seemingly no such luck.  The name of the type was "Avil" and I found it in the "American Specimen Book of Type Styles" from 1912. See attached image.  I'm doing research into older fonts to make myself a set of calling cards, and this one is a possibility.</p>
    <p>This isn't the first type I came across in that book that has no modern font equivalent.  That surprises me - I'd imagine they may not be patented and I'd think some enterprising soul would have created font sets based on all of them.  Has someone done this and I've missed it?</p>
    <p>Thanks so much for your help!</p>
    <p>--A</p>
