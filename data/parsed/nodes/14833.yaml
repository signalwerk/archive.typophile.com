      <p>i’d hafta say that fonts that <em>are</em> innovative will <em>feel</em> innovative. I think a good reference would be <a href="https://web.archive.org/web/20080828043449/http://typographi.com/000969.php">Typographica’s list of favorite fonts for 2004</a>. These are all innovative designs in different ways. You’re bound to find something that’ll work for you on that list. Some personal favorites on this list: Auto, Andulka, Olduvai &amp; Pill Gothic.</p>
      <p>I think typographica’s list is due for an update sometime soon as well,<!--
