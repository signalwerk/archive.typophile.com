    <p>Hello everyone.<br>
    I have been reading these forums for quite a while and finally decided to register.</p>
    <p>I am doing an identity for a group whose purpose is to promote creativity, in the form of the arts, music, etc. So I thought it would be cool/useful to see what you, the good people of Typophile, thought were some fonts that ’feel’ innovative, exciting, and/or creative. I am not as knowledgeable as I would like to be on available typefaces, and I am looking to expand my collection, as well as find a good font to use as a starting place for this logo.</p>
    <p>Thanks.</p>
    <p>-Nate</p>
