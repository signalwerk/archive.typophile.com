      <p>Fine picture of a D-3. Otherwise not a lot to go on. So we are looking at lettering created at some time between the 1940s and mid 1950s. The best candidate I can suggest is Twentieth Century Condensed Ultra Bold Italic<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/20thCentCondUltraItalic_5117.jpg"></div><br>
      designed by Sol Hess for Monotype between 1936 and 1947 <a href="http://www.identifont.com/find?font=Twentieth+Century+Condensed+Ultra+Bold&amp;q=Go" title="http://www.identifont.com/find?font=Twentieth+Century+Condensed+Ultra+Bold&amp;q=Go">http://www.identifont.com/find?font=Twentieth+Century+Condensed+Ultra+Bo...</a> and <a href="http://www.myfonts.com/fonts/mti/twentieth-century-mt/" title="http://www.myfonts.com/fonts/mti/twentieth-century-mt/">http://www.myfonts.com/fonts/mti/twentieth-century-mt/</a><br>
      Don<p></p>
