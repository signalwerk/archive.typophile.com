    <p>Differs from the logo from that era, the sides of the planes have additional United on their sides in a different typeface. Saw it in an old film and am curious as to if anyone knows what it is. Seems like Futura, but the e and the t are cut differently. See attached image of the font on the airplane. Cheers!</p><div class="imageWrap"><img src="http://typophile.com/files/united_3645.jpg"></div><p></p>
