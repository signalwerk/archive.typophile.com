  html: |-
    <p>Hi -</p>
    <p>I am working on a CD package and I am interested<br>
    in making this John Cage album cover bi-lingual.<br>
    I have chosen to use both english and japonese<br>
    characters for obvious reasons. But here is my<br>
    question.</p>
    <p>Working in AdobeIndesign, how do you set alternative<br>
    languages that are not native to your computer or<br>
    software. I am experimenting as a novice design<br>
    student and I'm composing this as a portfolio piece.</p>
    <p>Also, anyone who has this kind of knowledge of type-<br>
    setting in multiple languages would you have any<br>
    suggestions on what japonese typefaces pair well<br>
    with Frutiger's Univers?</p>
    <p>Best regards,<br>
    `j e a  n</p>
