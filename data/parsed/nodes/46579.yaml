    html: |-
      <p>If your on a recent Mac with a recent version of InDesign should be no problem to set the type manually.</p>
      <p>Choose Type &gt; Glyphs</p>
      <p>Scroll towards the bottom to see the Nihongo type choices. </p>
      <p>Hope this helps.</p>
