      <p>Virginia Commonwealth University's <a class="freelinking external" href="http://www.qatar.vcu.edu" rel="nofollow">Qatar campus in Doha</a> offers a full graphic design curriculum taught by US and european-trained faculty. The program is now coed, and is worth checking out. </p>
      <p>Disclosure: I'm a MFA student in design at VCU's Richmond campus, and I've met some of the faculty that teach there.</p>
