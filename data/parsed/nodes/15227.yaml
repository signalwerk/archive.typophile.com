      <p>Start&gt;Control Panel&gt;Date, Time, Language and Regional Options&gt;Regional &amp; Language Options&gt;Languages&gt;Details&gt;Settings&gt;Installed Services&gt;Add&gt;Japanese</p>
      <p>whew! i hope that helps.</p>
