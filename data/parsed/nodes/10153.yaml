  html: <p>Hi everyone, <br>I am doing a cyrillic version of Engravers' Gothic and as this is my first typeface ever, I've naturally stuck with some problems of formats and technical details. <br> <br>1. One problem is that TT and T1 seem to interpret ascenders height differently (or maybe x-height?) and thus my font looks differently when saving it as TT and as a T1. <a href="http://xtati.com/_misc/engrv/tt_t1_prob1.jpg">Look here</a> - the black one is TT, the purple one is T1. Why is that? How come? <br> <br>2. Further on, even if I use T1 as a solution or better to say, as a method to avoid hinting problems with TT, I get <a href="http://xtati.com/_misc/engrv/engravers_test_735_probs.pdf">this (pdf)</a>, when exporting a document from InDesign CS. <a href="http://xtati.com/_misc/engrv/engravers_test_735.pdf">This document (pdf)</a> in its turn is the same document printed through Distiller. What is this phenomenon and what do I do? <br> <br>3. Of course, if anyone wants to say anything regarding the type itself (its cyrillic part, of course), I am all ears. <br> <br>I am sorry for posting this thread into "Design" forum, but that's because I couldn't find "start thread" in "Build" forum. :/ If admins can move it there, that would be certainly much more appropriate. <br> <br>Thanks everyone in advance.</p>
