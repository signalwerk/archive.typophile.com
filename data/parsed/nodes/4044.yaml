  html: "<p>I've noticed that certain apps ignore certain kerning pairs, and there doesn't seem to be much rhyme or reason to it. For example, Photoshop doesn't apply kerns involving the trademark or the hyphen (although it does kern the emdash), while Word is pretty good except a negative kern of 250 is turned into -125 for my emdash-emdash sequence! I assume InDesign for example doesn't pull any such stunts, but since fonts can be used in any app I'm wondering if: <br>1) There are lists of ignored pairs somewhere, and/or some formal rationale. <br>2) There's a work-around, like maybe using Unicode? <br> <br>hhp <br></p>"
