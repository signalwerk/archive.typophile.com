    html: <p>I am a beginning FontLab user, and haven't spent too much time kerning the typeface I'm working on, but even the "automatic" kerning is lost in Freehand MX. Specifically, the S always overlaps an E or a U that follows it. What I find strange is that this doesn't happen in Flash (or any other apps I use). It would seem like all the Macromedia programs would handle type similarly, or that between the two programs, Freehand would have better kerning. </p>
