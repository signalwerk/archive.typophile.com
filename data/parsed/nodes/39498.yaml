      <p>Well this is operating under the premise that you're copying the kerning from one weight of the same typeface to another. Just to be clear, I'm not suggesting this would have any use if one were to copy the kerning and metrics from one typeface to an entirely different typeface. In other words, the shape of each glyph is the same; it's merely wider due to widened strokes and proportions. The idea isn't that the shapes are exactly identical, but rather that they're so similar, aside from their differences in width, that kerning and metrics from one weight to another are essentially the same, differing only by said difference in width.</p>
      <p>For instance, the kerning distance between A and V in a bold weight should be the same as the light weight; this script would allow that to be ported over, adjusting the kerning numerically to compensate for the wider glyphs but ultimately producing the same visual distance. Likewise, the space between letters based on sidebearings should also be the same from one weight to another; it merely needs to be adjusted when copied to take into account the wider glyph the sidebearings are surrounding.</p>
