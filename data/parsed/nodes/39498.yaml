    <p>I'm getting close to the point where I'll be adding the next weight to my current typeface project. Ideally, I've always wanted to be able to set the kerning and metrics for the Regular weight, and then automatically apply that to the Light and Bold weights, with the values being adjusted accordingly to accomodate the new glyph widths.</p>
    <p>As a result, I'm thinking about writing a script that will copy the metrics and kerning values from one font to another, expanding or contracting them by the difference in glyph widths on a per-glyph basis. Theoretically, assuming the fonts are simply different weights of the same typeface, this SHOULD work; there shouldn't be any need for additional hand tweaking, as the results should essentially be a perfect version of what I might have originally tried to do manually. Ultimately, since the glyphs are all identical aside from their heavier or lighter weights, the kerning and metrics should be identical too; just narrower or wider. In other words, it should all be relative.</p>
    <p>Before I get started though, am I missing anything obvious? Is there any reason why this wouldn't work as smoothly as I'm assuming? I don't mean technical/coding concerns, I just mean problems with the overal strategy from a designer's perspective. I wanted to do a sanity check on the idea before I wasted my time actually implementing it.</p>
