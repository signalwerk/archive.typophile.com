      <p>I don't think that would work, at least not better than copying exactly the kerning values. The kerning depends not on the advance width but on the shape of the glyphs.</p>
      <p>Another question: which glyph of the pair would you use as a reference, the left or the right one? Probably the average, I guess.</p>
      <p>Btw, if you want to scale all kerning equally, disregarding the individual glyph widths, you can do that by changing the UPM value of the font. That probably brings better results than on a per-glyph basis.</p>
