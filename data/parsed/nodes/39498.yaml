      <p>Alex, I think your theory does not work for regular/bold.</p>
      <p>It would work for copying between different widths of the same weight. Here, the slope of the A and V would actually change with the width of the letter. The "sideways-pointing" shape and width coincide.</p>
      <p>However, the fact that bold weights are generally wider does not mean that the "sideways-pointing" shape is any different. In fact, the A and V of a bold font can easily have precisely the same angle as in the regular – the only reason for the increase in width being the increase in stem weight. And if the angles of A and V stay the same you should probably not scale their kerning.</p>
      <p>But as William mentioned, the bold is spaced more tightly, which changes everything anyway.</p>
