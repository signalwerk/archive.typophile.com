      <p>Alex, I suggest you check other fonts that have some relation to yours stylistically.</p>
      <p>In general, bolder weights are spaced more tightly. For example, Minion's regular O has side bearings on both sides of 44. The bold O has 42 left and 41 right. According to Tracy's "Letters of Credit" this is recommended because the letter space should be related to the counter width, and the counters are generally narrower in bolder weights of the same type family. So Tracy does not accept your view that similar exterior shapes always take the same spacing. </p>
      <p>I think Tracy's view is accepted by most type designers today.</p>
