      <p>In case you still want to try the method you described, here's a tiny <a href="http://www.kltf.de/downloads/KLTF-KerningTools.zip" rel="nofollow">Expand Master's Kerning</a> script. Use it like this:<br>
      Do some kerning for one master in the Kerning Panel. Then run the script to 'expand' the current master's kerning to all other masters. Switch to another master and do some kerning. -- Each time you switch to another master, run this script first.<br>
      Only if you find that kerning is ok in all masters (remember: as of yet a pair has the same kerning value throughout all masters!), you adjust individual masters' kerning <em>without</em> running the script.</p>
      <p>Karsten</p>
