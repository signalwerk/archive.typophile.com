  html: |-
    <p>The two fonts developed by Monotype based on old engraver's lettering styles were given honorable mention on Stephen Coles' <a class="freelinking external" href="http://typographica.org/typeface-reviews/2012-honorable-mentions/" rel="nofollow">http://typographica.org/typeface-reviews/2012-honorable-mentions/</a></p>
    <p>JMC and Feldman Engraver are based on Masterplate styles from the American stationery engraver's industry, and were developed by Steve Matteson and Terrance Weinzeirl, of Monotype. Go team!</p>
    <p>Both fonts are FREE!<br>
    <a href="http://www.fonts.com/font/monotype-imaging/feldman-engraver" title="http://www.fonts.com/font/monotype-imaging/feldman-engraver">http://www.fonts.com/font/monotype-imaging/feldman-engraver</a><br>
    <a href="http://www.fonts.com/font/monotype-imaging/jmc-engraver" title="http://www.fonts.com/font/monotype-imaging/jmc-engraver">http://www.fonts.com/font/monotype-imaging/jmc-engraver</a></p>
    <p>These fonts were made possible for the launch of The Complete Engraver by this writer. <a href="http://www.papress.com/html/book.details.page.tpl?isbn=9781616890674" title="http://www.papress.com/html/book.details.page.tpl?isbn=9781616890674">http://www.papress.com/html/book.details.page.tpl?isbn=9781616890674</a></p>
