    html: <p>Hi Kerry,   <br>We ought to have an FAQ about sports jerseys of professional teams, but what it would say is that the lettering and logos for professional sports teams are almost always custom font designs. The teams and leagues do this for the reason that it makes it hard for anyone to imitate their products -- and it's all about marketing.  <br> <br>There are font designers like Dennis Ortiz-Lopez who specialize in designing fonts for sports franchises. <br> <br>Sorry.</p>
