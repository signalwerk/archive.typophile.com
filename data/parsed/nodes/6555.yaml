    html: <p><i>Mike, I think your statement might be a bit broad -- the logo for the major league baseball team here in Phoenix (the woeful Arizona Diamondbacks) uses a barely modified setting of Emigre's Matrix.  <br></i> <br> <br>Marc, There is also the chance that with a serif font like that, especially using all caps, that it might be hard not to look like <i>some</i> serif font. Is the high-centered M  the 'Matrix' earmark that makes your case? It seems like a name as long as DIAMONDBACKS would dictate as narrow an M as possible, and that style would fill the bill. Matrix isn't the only serif font with that kind of M, -- Red Rooster Kingsrow is another, for example --  but my point is still that <b>most</b> team lettering and logos, particularly newer teams, try to be distinctive so that they are more marketable, and harder to imitate. The Vikings  (Futura Black) is an exception, and as noted has been around a long time. If we were to make lists of the pro teams, I doubt many would use commercial fonts, but I'm not ready to take on that task.</p>
