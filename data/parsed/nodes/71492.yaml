    <p>Hi everyone,</p>
    <p>I would really appreciate some help/advise with the kerning on this logo. I always have trouble kerning capital letter. My main issue is with anly letter with a diagonal line in i, so the 'A's, 'V' and 'W'.</p>
    <p><img src="/sites/default/files/old-images/final_logo_6235.png"></p>
    <p>Thank you very much in advance. </p>
    <p>Emily</p>
