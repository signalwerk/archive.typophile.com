      <p>I know you didn't ask for more than kerning advice, but I'm in an analytical mood, so feel free to ignore my observations....but...the logo and logotype don't seem at all connected. IMHO, this is a much larger problem than the kerning. The two styles conflict and there is no relationship between them - they compete with each other. Some of the conflict is scale and placement, but I wouldn't bother fixing that until the styles are harmonious.  </p>
      <p>The logo? Could be for a TV station. The logotype? A cabinetmaker. Who/what is this logo for?</p>
