      <p>Hi Alaskan,</p>
      <p>Thank you for your input. I do appreciate it. I agree with what you're saying actually. The client chose this type for the logo from about 5 while looking at it on an iPhone so the type looked a lot cleaner. I'd forgotten this font had a weird texture to until I put it up here. (TBH I was starting to think I need to go back and find another font)</p>
      <p>Let me tell you a bit about Thom; he used to be a graffiti artist until a few years ago he stopped. He's now working as a voluntary Special constable but on the side he does portraits on canvases for people. Keeping with his graffiti root's he does them in a stencil/Banksy style. He needed a logo and brand. </p>
      <p>Thom wanted a marque that could become recognisable without text. We spent quite a while coming up with different ideas. Eventually we landed on what you see above. We where steering away from the obvious stencil/graffiti connotations. What you see above is a more clean cut sticker graffiti vibe. It can be used as a nice clean vector or can be stenciled on the back of his canvases. </p>
      <p>I've been trying to find the perfect font for over a week now. As you can see the marque is BOLD and I need a font that will sit comfortably with that. Do you have any suggestions? I was using Gotham Ultra.</p>
      <p>E</p>
      <p>P.S. I laughed out loud when you suggested cabinetmaker!</p>
