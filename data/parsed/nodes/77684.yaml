  html: |-
    <p>Some time ago I migrated my custom .enc files to FL 5 on the new Mac OS 10.6. Since then I face the mysterious fact that, when choosing them from the menu (in the Font window), in some instances only a part of the files’ contents gets displayed, the rest is invisible (even in the glyph cell’s heading).</p>
    <p>Are there special requirements to .enc files I am not aware of?<br>
    Any insights on this?</p>
