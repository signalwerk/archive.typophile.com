    html: |-
      <p>I opened the file(s) with Mac’s TextEdit, all content was there. Then I ”saved as“, choosing UTF-8 text encoding and applying the ”.enc“ suffix which TextEdit doesn’t like very much, but it does it.<br>
      The odd thing is, some of the encodings render properly in FL, some don’t. No clue so far about what makes the difference.</p>
      <p>BTW, in the old times I did the .enc-work in Simple Text. Worked smoothly. But Simple Text no longer runs under OS 10.6  :-(</p>
