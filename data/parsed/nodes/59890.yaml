    <p>Received a few minutes ago:</p>
    <p><em>The first cut of the Mexico City programme is now online.<br>
    <a class="freelinking external" href="http://www.atypi.org/04_Mexico/40_timetables" rel="nofollow">http://www.atypi.org/04_Mexico/40_timetables</a><br>
    Details and presentation will improve; registration should be available in the next week or so.<br>
    Looking interesting: the first three days (the 'main conference') are in a single track with often short presentations. The last two days, which combine TypeTech and a series of longer workshops, has several things going on at the same time and the opportunity to engage in depth.<br>
    --<br>
    Mark Barratt<br>
    Text Matters</em></p>
