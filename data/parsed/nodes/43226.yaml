    <p>I have seen a few threads on this but am looking for some more recommendations for serif fonts to pair with Ministry Script on a wedding invitation. The wedding won't be overly formal but I am looking for something that is classy and elegant to contrast Ministry Script. I've been testing Warnock Pro and Minion. Preferably something with an expert character set (small caps, etc.).</p>
    <p>Any ideas? Thanks for any help that you provide.</p>
