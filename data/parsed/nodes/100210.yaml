    html: <p>As almost all letterings coming from Nike, it could be a proprietary typeface. If I had to recreate it, I would probably start with some font like <a class="freelinking external" href="http://www.myfonts.com/fonts/jnlevine/canby/" rel="nofollow">Canby</a>/<a class="freelinking external" href="http://www.myfonts.com/fonts/chank/liquorstore/" rel="nofollow">Liquorstore</a>/<a class="freelinking external" href="http://www.letterbox.net.au/berber" rel="nofollow">Berber</a>/<a class="freelinking external" href="http://www.myfonts.com/fonts/hipopotam/olifant/" rel="nofollow">Olifant</a>/<a class="freelinking external" href="http://www.peter-wiegel.de/Fonts/index.html" rel="nofollow">Berlin Email</a> and rework the all thing.</p>
