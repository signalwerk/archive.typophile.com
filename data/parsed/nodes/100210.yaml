    html: |-
      <p>Definitely ask for an explanation (I only hold that back to save time - favoring instead merely the raising of a red flag) but <em>evidence</em> is often too much to expect. People don't typically make decisions -especially not important ones, like who to marry- based on hard evidence; people don't tread cautiously -which is all I'm asking- because they're <em>sure</em> something is wrong. And it's a fruitful act of humility to admit that somebody else's experience/instincts are superior to yours when it comes to smelling rotten fish; just like I have the humility to freely admit that I suck at IDing fonts, and sometimes that does indeed cause me trouble.</p>
      <p>In this particular case I'm seeing enough similarities between many of Wiegel's fonts and other existing commercial designs to simply suggest that people do more research. If somebody does the research and comes to believe all his work is legitimate, that's not a wasted effort - they can feel more comfortable supporting him, and they can tell others about their findings. Have you done the research?</p>
      <p>In fact, Wiegel, being an actual type designer (unlike virtually everybody IDing fonts...) might appreciate the sort of caution I'm expressing, and elect to merely reassure people that he's not one of the <em>majority</em> of people who produce a large number of fonts dishonorably.</p>
      <p>BTW Mike, I'm better at apologizing that most people I know, and most people here, and you. You need to be paying more attention to how my efforts have helped people here be more mindful of not hurting type designers. I can tell because I'm having to intervene far less often now than 2-3 weeks ago.</p>
      <p>hhp</p>
