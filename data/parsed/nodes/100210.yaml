      <p>Why the hell is that, Hrant? Herr Wiegel offers revivals of lots of old Deutsche typefaces - some of which are available nowhere else digitally. I'm <em>grateful</em> that people like him exist. A niche typographer with with some really cool offerings from the past. Making fonts few people care about any more.</p>
      <p>I am fascinated to know the reason for your gastrointestinal distress (AKA "gut feeling"). Is it the crappy website? Erm ... highly suspicious. Something else?</p>
      <p>This guy is a commercial type person, too. Small-time and with weak website development skills? Yep. Does he deserve your totally unsupported disdain on a public forum? Nope. An apology is what Herr Wiegel deserves (yeah, right ... ).</p>
      <p>Folks - I would think twice before listening to Hrant asking <em>you</em> to think twice. <em>Demand</em> at least some shred of supporting evidence.</p>
