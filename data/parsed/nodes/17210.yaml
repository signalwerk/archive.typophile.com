      <p>The simplest cross-platform way to something like that would be to use <a href="http://freetype.sourceforge.net/" rel="nofollow">FreeType</a>, possibly in conjuction with an image manipulation library such as the one that comes with <a href="http://www.imagemagick.org/" rel="nofollow">ImageMagick</a>.</p>
      <p>I've used FreeType in the past to write a full-fledged text renderer for the <a href="http://www.tivo.com/" rel="nofollow">TiVo</a> Series 1 platform. My application took arbitrary input text and presented it in a "dialog box" on the user's TV screen. Here's a screen shot:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/messagebox.jpg"></div><p></p>
      <p>I had to implement some of the fancy stuff (such as word wrap, kerning, and input text parsing) myself; fortunately, FreeType makes all the necessary metrics available to the programmer. Some of the hardest parts -- parsing the TrueType files, and rendering the actual glyphs -- are done by FreeType itself.</p>
      <p>Register.com's use of JPEG compression instead of PNG or GIF is just silly. Saving the rendered image to a proper PNG file can be done pretty simply by using <a href="http://www.libpng.org/pub/png/libpng.html" rel="nofollow">libpng</a>.</p>
