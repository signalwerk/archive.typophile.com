      <p>I've not looked at the text too closely but at a guess it looks like Lucida or a similar hinted TrueType font with both gridfitted hinting and grayscale antialiasing applied. </p>
      <p>You see very similar rendering on Windows under regular antialiasing if you hack the 'gasp' table of a hinted font like Tahoma using the TTFGasp tool. <a href="http://www.geocities.com/SiliconValley/Lakes/8162/" title="http://www.geocities.com/SiliconValley/Lakes/8162/">http://www.geocities.com/SiliconValley/Lakes/8162/</a></p>
