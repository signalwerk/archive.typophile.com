    <p>I just renewed a domain and went to Register.com<br>
    to see if it worked, and stumbled on this curiosity:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/register.gif"></div><p></p>
    <p>That's a canned paragraph, but it's followed by<br>
    some dynamically-generated text, rendered<br>
    on-the-fly certainly.</p>
    <p>I assume this is to prevent textual copying by<br>
    robots (or just by humans). Anyway, not that the<br>
    rendering is very good (the JPEG haloing for one<br>
    is pretty bad) but I'm curious as to the mechanics<br>
    of this. What kind of font, and software?</p>
    <p>hhp</p>
