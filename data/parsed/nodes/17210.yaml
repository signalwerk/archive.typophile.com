      <p>I'd be happy to test your TrueType font on my TiVo setup if you want. I've actually been following some of your progress, and I've been looking forward to seeing the results in action.</p>
      <p>Note that at the glyph level, the output will essentially be the output of the FreeType rasterizer.</p>
      <p>The FreeType rasterizer has many internal options that can be tweaked; for my specific application, I spent a lot of time experimenting in order to determine out the combination of options that best approximated the text rendering of the native TiVo software (which, by the way, is probably using FreeType itself). My goal was seamlessness rather than optimal subjective rendering quality. That's the reason that, for example, the tracking is too tight (in my opinion).</p>
      <p>Therefore, if I test your font under that particular setup, it may not look as good as it possibly can. Additionally: I'm not sure what you mean when you say that your TrueType font is "special", but if it uses esoteric TrueType features, it's possible that FreeType will choke on it in some way. The only way to know for sure is to try it.</p>
