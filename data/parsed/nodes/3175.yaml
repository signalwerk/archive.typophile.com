    date: 2004-02-25T09:32:00
    votes: null
    html: <p>Very nice. I agree with Eduardo's comment about the weight of your caps. A couple letters that might need a variant for connection ... <b>j</b>? (looks like a <b>y</b> sitting next to the <b>i</b>) ... The <b>u</b> going into the <b>v</b>? (looks like a <b>w</b>) ... and the <b>v</b> is it too abrupt? ... Is perhaps the <b>A</b> is a little too rotated? Could the bowl of the <b>p</b> be a little more curvy? Is the downward stroke on the back of the <b>p</b> too stiff? Is the <b>s</b> a little to wide/open? <br> <br>Love the stroke modulation by the way. Reminds me of Doris Day and Cary Grant movies. <br> <br><img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br><img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
