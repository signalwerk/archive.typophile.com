  html: "<p><img src=\"http://www.typophile.com/forums/messages/29/34651.gif\" alt=\"SIM logo\"> <br>Rebranding this mark for a small/regional company who are distributors of mid-range to high end office furniture. They've been in business since 1986. URL: <a href=\"http://www.shaddy.com\" target=\"_blank\">www.shaddy.com</a>  <br> <br>The toughest part was finding the right font for the word SIM. In these sketches, the word SIM uses Argus Extra Bold and for the tagline Eurostile or Helvetica Neue. I invite any suggestions and/or alternatives for font use, color scheme, and design.  <br> <br>Best, <br>MJ</p>"
  html_clean: "<p><img src=\"http://www.typophile.com/forums/messages/29/34651.gif\" alt=\"SIM logo\"> <br>Rebranding this mark for a small/regional company who are distributors of mid-range to high end office furniture. They've been in business since 1986. URL: <a href=\"http://www.shaddy.com\" target=\"_blank\" class=\"link-external\">www.shaddy.com</a>  <br> <br>The toughest part was finding the right font for the word SIM. In these sketches, the word SIM uses Argus Extra Bold and for the tagline Eurostile or Helvetica Neue. I invite any suggestions and/or alternatives for font use, color scheme, and design.  <br> <br>Best, <br>MJ</p>"
