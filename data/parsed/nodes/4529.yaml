    votes: null
    html: "<p>I like the Argus for the main logotype, but I'm not too keen on any of the others. Could be that it's too early in the am for lucidity <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br>Just some notes: if you're doing the knockout thing, make sure the box is big enough (1, 5) as opposed to too tight (2, somewhat). Eurostile caption text flows well with their existing logo but not so well with the new. <br> <br>What about incorporating elements of this logo: <br>http://www.shaddy.furnishgroup.com/sw/themes/930/images/40004647_title.gif <br> <br>It's part of the header inside their site and doesn't look too bad IMO.</p>"
    html_clean: "<p>I like the Argus for the main logotype, but I'm not too keen on any of the others. Could be that it's too early in the am for lucidity <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br>Just some notes: if you're doing the knockout thing, make sure the box is big enough (1, 5) as opposed to too tight (2, somewhat). Eurostile caption text flows well with their existing logo but not so well with the new. <br> <br>What about incorporating elements of this logo: <br>http://www.shaddy.furnishgroup.com/sw/themes/930/images/40004647_title.gif <br> <br>It's part of the header inside their site and doesn't look too bad IMO.</p>"
