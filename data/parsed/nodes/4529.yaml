    html: <p>Thanks for the feedback guys. <br> <br>I'll have to agree with both of you.  I prefer the logos without a knockout, and i do not think the Eurostile font is appropriate for the caption text. <br> <br>I'm looking at option 4 at the moment; however, i'm still undecided if Helvetica Neue is appropropriate for the caption.  In addition, would anyone suggest the use of ALL caps over lower case in this instance? <br> <br>Cheers, <br>MJ</p>
