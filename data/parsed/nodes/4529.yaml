  - id: 33304
    user: 3437
    date: 2004-04-29T14:02:00
    date_raw: 29 Apr 2004 — 2:02pm
    votes: null
    html: <p>I don't mind using all caps as long as you use small caps rather than titling caps. Something about a whole line of text in title caps just makes baby Jesus cry. <br> <br>What about mixed case? As long as you don't use Meta or something similarly high-tech looking, you won't risk a cliche logo.</p>
