      <p>Well, since you mention Bringhurst, what about trying some of the page and text area sizes and proportions he mentions? And then set some type—lorem ipsum type, if you like—in those different page samples. Have a look at what you like. My suggestion, however, is not to treat the process like you’re painting the Sistine Chapel. In other words, get on with it and then make some choices.</p>
      <p>Another of my favorites, and one I recommend with no hesitation is <em>Designing books: practice and theory,</em> by Jost Hochuli and Robin Kinross.</p>
      <p>Ultimately, tho’, you need to set up some pages and see what works with the material. Sure, you can learn by looking at examples of good book design and layout. But it isn’t as if there’s a list of the ten best book designs ever. And if there were such a list, it would be b.s.</p>
      <p>There are no absolutes! You can benefit by knowing any <em>rules.</em> Then you apply the ones that work for you and discard the ones that don’t. But you need to know them before you violate them, so that you violate them knwingly and with reason.</p>
      <p>Good luck!</p>
      <p>Stephen Tiano<br>
      Book Designer, Page Compositor and Layout Artist<br>
      <a href="http://www.tianodesign.com" title="http://www.tianodesign.com">http://www.tianodesign.com</a></p>
