      <p>With all the kind words about the <cite>Glossary of Typesetting Terms</cite> I got out my copy &amp; reread a little.</p>
      <p>I really can’t recommend anyone spending hard-earned dollars on this, at least, if their view is to find something as instructive as the books by Bringhurst, Hendel, etc.</p>
      <p>The <cite>Glossary</cite> came out of an AAUP panel in 1990 about why typesetting seemed to have fallen off in quality in “recent” times. As you may remember, 1990 was just at the beginning of the PostScript era, and most all composition was still done with photocomp machines, some of them “professional” (Linotron 202), some of them less so (the lesser offerings from Compugraphic, A/M, etc.). Part of the problem was the fonts, but the largest problem was the use of the equipment. </p>
      <p>So, there were multiple answers to why typesetting quality was diminishing: (1) good shops still turned out excellent comp, but (2) the cost of getting into setting type was much lower with photocomp, so anybody with $30,000 could get into the business, and (3) the unions were at an end, which mean the apprenticeship programs too were gone.</p>
      <p>There was a forth factor. Just as apprenticeship had fallen off for compositors, apprenticeship had also fallen off for designers, and to some extent, editors. Some newer designers had trouble expressing what they wanted, and a number of editors had little understanding of the compromises involved in setting type. This lead to an increase of proscriptive rules (don’t do this). As the number of things one couldn’t do increased, the choices a comp had in resolving an awkward situation diminished.</p>
      <p>In any case, the <cite>Glossary</cite> was aimed only at the fourth problem. But the world has changed again. By now (2008), many of the technical terms and procedures of the photocomp era seem out of date. The fonts are different (PostScript, OpenType), the layout programs are different (PageMaker, Quark, InDesign, etc.). In many ways, what is considered good design has changed as well.</p>
      <p>The <cite>Glossary</cite> covered a period of history and the problems of that time. I do think there is still something one can learn from it, but things have changed enough so anyone desiring a quick understanding of what constitutes “good design and composition” would be better served by works either more basic, or more specific to present times.</p>
      <p>FWIW</p>
      <p>Charles Ellertson</p>
