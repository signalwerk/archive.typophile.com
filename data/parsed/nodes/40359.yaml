      <p><cite> &gt;Can folks suggest publishers whose books tend to exemplify good design? I’m looking at hard-cover formats at sizes close to 6×9″.</cite></p>
      <p>Joel -- it's hard to recommend specific publishers, especially if you're looking for examples in trade fiction. Most large publishers are hit-or-miss (mostly miss, I'm afraid) when it comes to careful typography and layout. </p>
      <p>You're more apt for find good examples among smaller publishers where the publishing model and economics are slightly different and where they tend to put more care into individual titles. David R. Godine, Publisher, is one example. Robin Kinross' Hyphen Press, out of the UK, is another example. Mark Batty, Publisher, has some good titles. None of these publish fiction, per se, but you might find some titles in a similar format. </p>
      <p>If you can find anything designed by Jerry Kelly, his books are always worth emulating. But he works mostly for publishers of fine books -- Grolier Club and the like.</p>
      <p>If you want to stay focused on fiction, then you'll find your best models if you look further back to the period from about mid 1940s to late 1950s. That was the heyday of American book publishing, in my opinion. At that time, most of the major houses were putting out decent designs -- Alfred A. Knopf and Random House are just two examples.</p>
      <p>-- K.</p>
