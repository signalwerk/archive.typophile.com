      <p>I want to second Will's enthusiastic review of the <cite>Glossary of Typesetting Terms</cite>. The prosaic title may belie its value to a designer. ("A <em>glossary</em>? -- What, are you kidding me?!") Really, it is surprisingly readable. I, too, went pretty much straight through -- albeit not in a single sitting, not in a hammock, and not with summer refreshment. I continue to refer to it now and again, and it's a good resource to have, right alongside Bringhurst.</p>
      <p>When learning a craft, I think it's important to try to get inside the "rules" and understand the principles behind them. Charles is right to caution against using them as a crutch. One needs to educate one's eyes and one's mind. Part of this may come initially from following such guidelines, but only by then looking, contemplating, comparing, and understanding. </p>
      <p>But over time, rules should recede, and experience will take over.</p>
      <p>-- K.</p>
