      <p>Steve, I agree with you. But we get in all to many designs with a 5-pica head margin (thats 5 picas to the top of running head). If you take another 2 picas base to base, first text line, that puts the text page over 1-1/4 inches from the top trim. If you have to get a 2,800 character page, you need something like 70 characters per line and 39 lines per page. If your design aesthetic requires 14-point leading, add another 7.5 inches. Doesn't leave much for a foot margin with a 6x9, does it? Even 38 lines leaves a larger optical space at the head of the page than as the foot, esp. if the running head copy is short, or only folios are used.</p>
      <p>We also run into a lot of 5-pica (a little over 13/16 inch) or even 5.5 pica gutter margins. The reason is the tight binding of notch-bound books, cloth or paper. I buy this, and sometimes use a 13/16 inch gutter even when I know the book will be Smyth-sewn. As an aside, some of the short-range printers will give the same price for Smyth sewing as for notch binding -- Thomson-Shore for one, in quatites of 2,500 of less.</p>
      <p>Anyway, with a 5-pica gutter and a 26-pica text measure, you only get a 5 pica fore edge margin. (All these for 6x9 trim). Sure, optically the gutter is a little less, but it is a long way from classical proportions.</p>
      <p>The point is, it doesn't take too much to destroy the margins with the new, lotta-lead fashion going around.</p>
      <p>We've had books come in with a text page designed with 15- or 16-point leading. Decent margins. The catch is that you can expect to set only 2,000 characters per page -- this with a manuscript that has a total character count about 1,250,000. Thats 625 pages. When I have to do an estimate on some of those, the publisher frequently makes the designer get more characters per page. Invariably, the first place they go is the margins.</p>
      <p>One big problem I think, and I've said it before, is that designers print their layouts on an 8.5x11 sheet, or spreads on a 11x17 sheet. Then, they don't trim the sheets to final size. All that extra white space can lead even an experienced eye to missing the obvious.</p>
      <p>BTW, I set a lot of the books Rich Hendel designs, at least for UNC and Yale. He doesn't make those kind of mistakes. He has just retired as Design &amp; Production Manager from the University of North Carolina Press, but will continue freelance designing. I though his book wonderful, but I'm biased. It does deal more with how designers work than with "rules," which is a plus, but may not be what Joel wants.</p>
