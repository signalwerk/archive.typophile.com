      <p><cite> &gt; which is the “head margin”?</cite></p>
      <p>The head margin is the distance from the top trim to the top of the type block (or "type page"). If there is a running head in the design, then the top of that defines the top of the type page (since in metal this would have necessarily been part &amp; parcel of the type block which needed to be locked up).</p>
      <p><cite> &gt; (Which typesetting machine was in use circa 1965 that couldn’t handle kerned italics?)<cite></cite></cite></p>
      <p>That would have been set in Linotype (although 1965 would have been the tail end of its common use in book setting, I think). The major disadvantage of this otherwise rather amazing technology was that Linotype setting could not accommodate kerned characters. Italics suffered most from this limitation. And designs adapted from previous periods or other technologies usually show more compromise than original designs created with the limitations in mind.</p>
      <p><cite> &gt; (For example, adjusting the inter-paragraph spacing to avoid widows &amp; orphans, which I think looks better than changing all the leading on the page.)</cite></p>
      <p>Both of these practices are called <em>feathering</em> or <em>carding</em>. I would personally never accept either in a book under my control. There are always other, less disruptive ways to solve widows/orphans. A good typesetter can manage without feathering. In some cases, cooperation from Editorial is required; but again, a good comp can usually come to the copy editor with a perfectly good solution for approval -- or, at least, it used to be that way.</p>
      <p>-- K.</p>
