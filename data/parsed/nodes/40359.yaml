      <p><cite>Trouble is, by inclination and training I’m an engineer. I’m quite willing to experiment with various combinations till I get it ‘right’; I’m just not so comfortable with the notion of that judgement being subjective.</cite></p>
      <p>This is a hard notion for an engineer.</p>
      <p>But aesthetics, while not an engineering parameter, are also not entirely subjective. Example: Back in the 1970s, I was involved with a group doing "experimental" art. And I came to the conclusion this was an oxymoron. Art gets its appeal by being a cultural phenomena, appealing to a shared aesthetic. This can change -- but usually slowly and in incremental steps. Consider atonal music; at first for the few, and as more pieces became available, the audience widened, and discussions about "good" and "bad" became possible.</p>
      <p>Most of the typography being recommended here is 1940s British. It is certainly a classic form in the states &amp; UK. But if you go back a century, you can also find a different form (by &amp; large railed against by the 20th century Brits), and *some* of that was good -- especially for 19th century audiences.</p>
      <p>21st century typography hasn't matured much. We (well, "they") use a lot of leading. Sometimes this is because the publisher wants a 100-page book to take 200 pages, for marketing reasons. But more &amp; more, designers are embracing the 10/15 book. The problem comes about when the other spacing -- mainly the margins -- aren't considered. Sometimes this is due to the publisher wanting x-number of characters per page &amp; the designer not willing to give up the large leading, sometimes it is just because the designer has no eye --  or, if you prefer, is 100 years ahead of his/her time.</p>
      <p>But there are "correct" spatial arrangements that seem to have crossed time periods and many cultures. What is less clear is if the *background* (the paper of the book page, the light &amp; dark on a computer screen) has a common interaction. The book, as a physical object, has clearly delineated background &amp; foreground. The magazine, with so many full-bleeds, is a different object. And the computer web site is different still.  Yet all of these will influence what a modern audience  is comfortable with; will influence what is "right."</p>
      <p>But if you're a 1940s British afficianado, you're probably out of luck in terms of popular novels.     </p>
      <p>FWIW</p>
