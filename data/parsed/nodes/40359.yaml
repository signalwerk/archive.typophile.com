      <p>The simplest way to look for ideas is just to browse a good, cool bookstore...small or academic presses often have the finest cutting-edge book designs, and the cover is usually as cool as the inside. And bring a small inches/pica ruler with you.</p>
      <p>For type, until you learn otherwise, use Janson and Sabon, with oldstyle figures. Those are the two finest book text faces, have been used with phenomenal success for decades, and now look better than ever, regardless of subject matter. But the really fun part comes in matching period and thematic subjects to type faces. For instance, a book about mid-19th century social history is best told via ITC Bodoni Twelve with oldstyle figures. And a Renaissance art book could use Slimbach's new Arno Pro from Adobe, a cross between Palatino and Requiem, but with all the bells and whistles. Never use less than four points leading; German publishers tend toward 6 pts.</p>
      <p>If you use Quark 7, formatting mirror-image facing pages, with complementary gutters etc, is a snap. Inside gutters should never be less than 3/4" wide, but the top, bottom and outside gutters are easier to figure. Just measure the layouts that seem right to you.</p>
