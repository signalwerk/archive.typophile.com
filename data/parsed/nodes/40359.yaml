      <p>Gosh, this is the sort of topic I like to weigh in on, but I'm a bit late to the party, and a lot of good advice has been given already. But here are a few things:</p>
      <p>**  Let me second looking at Rich Hendel's "On Book Design." Its value is that it shows  designs by several designers and allows them to discuss their ideas; it is not one writer's opinions.</p>
      <p>**  Let me second the notion of trimming sample pages to the finished size of the book. Then go a step further and glue them up to form a dummy. This is the best way for you and your client to see how the book will look. It may even be worthwhile to move the text blocks closer in toward the bind, to see how the binding method will affect the look of the book. This will only be approximate. </p>
      <p>**  Take a look at books published by Jack Shoemaker over the past 30 years at his various imprints: North Point (before it was bought by FSG), Shoemaker &amp; Hoard, and Counterpoint. Especially books designed by David Bullen. There is a lof of good typography there.</p>
      <p>But most importantly, keep in mind that in the current publishing world, design is, perhaps unfortunately, constrained by many factors, and thus design has to incorporate compromise. To wit:<br>
      **  Publishers will at times want short mss blown out to 200 pages so they feel they are giving readers value for their money.<br>
      **  The same publisher in the same week will ask that a massive ms get its type shoved into a very tight layout with a high character-per-page count. This in order not to scare off readers who may be intimidated by a thick tome. Or perhaps because the book, while worthy of publication, may have only a small audience (some American publishers still publish that sort of book).<br>
      **  Publishers may be thwarted by their own aging eyes or by the aging eyes of readers. People who read books do often complain that type is too small, and some of these complaints make their way into design briefs. Commercial and advertising designers are often hit with "make the logo bigger." Book designers are often told to "make the text type larger."</p>
      <p>No book I design fully meets any set of other folks' criteria, not Bringhurst, not Tschichold, nor Felici, not Hendel, not Williamson. But each book is designed to solve a particular set of needs set forth by a publisher. At times I do things I'd rather not. Book designers like to think of ourselves as servants of readers. We also must serve the masters who pay us. But we need not capitulate at every turn. We do ourselves and those paymasters good service when we show them good design and then attempt to explain our work to them.</p>
      <p>I am afraid there's no easy way to come up with good book designs other than by designing lots of them. And by making lots of mistakes. And by making lots of compromises. And by having a lot of fun in the process.</p>
      <p>Pragmatically yours,</p>
      <p>powers</p>
