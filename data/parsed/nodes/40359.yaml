      <p>I did not speak of "rules." I did speak of what I'd call "good practice." And I have violated my own ideas of good practice quite often. Most of the time with intention. Sometimes by mistake that went un-caught. I have done all the things Charles notes that Richard did.</p>
      <p>One has to start out somewhere, especially when someone new to this sort of work asks opinions. I see that Mr Salomon is an engineer, and he has taken an interest in typography, asking advice from those of us who read this forum. So I suggested to him some good practices. I do not know how much leeway is allowed from good practice among engineers, people who deal with very precise specifications. I bet really good engineers know where they can introduce variations safely.</p>
      <p>I do not use crutches, and I trust my many years of experience. I also trust my skills and my understanding of the page to tell me when I may deviate from good practice. I also encourage myself to try new things, regardless of how they may vary from my training.</p>
      <p>I do regard Richard as an extraordinarily good book designer, and I'm sorry I did not have many occasions to talk about the craft with him. Saying that, I will suggest to anyone who wants to know how to put pages together that they read a very good book on which Richard &amp; Charles collaborated with 4 other skilled typographers.</p>
      <p>That book is "Glossary of Typesetting Terms", published in 1994 by U of Chicago Press. This is an essential text. When my copy arrived on a summer day, I took it to the hammock for a quick first look. What happened was that I did not get out of the hammock except once, to pour a good gin-and-tonic. I read the whole damn book through in one sitting, as thrilled as if it were a fine novel. And wrote comments all over the pages. For several years Chicago was selling it in their annual sale for 6 bucks a copy. I would buy ten or twelve copies and on the last day of typography class I'd give them to the students. This is as important a book as Bringhurst (which I have students work with during the semester).</p>
      <p>cheers.</p>
      <p>powers</p>
