      <p>&gt; A single first line of a paragraph standing alone at the bottom of a page or column</p>
      <p>The one area where this does not work, and probably why it is bundled in with widows as a no-no, is in technical documentation, or other work where there is a blank line before a paragraph. In this situation a lone (orphaned) line looks odd, rather like an additional footer.</p>
      <p>In bookwork, with no paragraph spacing, the orphan is completely acceptable (until you get an editor who knows a bit less than they think they know).</p>
