      <p>I have encountered so much contention, disagreement, and confusion about the definitions of <em>widow</em> and <em>orphan</em> that I now try to avoid using the terms altogether. The important thing, as Will outlined, is to understand the three questionable situations and to establish guidelines for what is and what is not acceptable and under what circumstances.</p>
      <p>Echoing some of what Will covered (with which I mostly concur):</p>
      <p><strong>A) A single last line separated from its paragraph by either page turn, or across the spread, or a jump to the top of the next column.</strong> All of these circumstances are almost universally considered <em>persona non grata</em>. I differ from Will in that I generally won't accept any of these even if the last line is nearly full measure. If the last line is truly full measure and will justify as such, then I might conceivably let it pass as a last resort. I will look more leniently on a full line separated across the spread than one across a page turn. In unjustified text, I might let a shorter line pass, but I reserve the right to judge such in context, and I would still try to avoid it.</p>
      <p><strong>B) A short final line in a paragraph.</strong> There are varying definitions/guidelines regarding what constitutes an unacceptable last line. The one I hear most commonly is "must have at least <em>x</em> letters," where <em>x</em> can vary usually from 5 to 7. I don't subscribe to such a fixed standard. To me, it is relative to the design. My general rule of thumb is that the last line should be at least twice the indent -- the point being that it should provide enough visual weight to the end of the paragraph that the indent of the next not combine to create a queer isthmus. </p>
      <p>Longer measures or more elegant designs are less tolerant of shorter last lines, in which case my rule might adjust to require a last line to be at least 1/3 the measure. Narrower columns or more prosaic matter, on the other hand, may admit of looser standards.</p>
      <p>A paragraph should never end with the tail of a hyphenated word break, regardless of its length.</p>
      <p><strong>C) A single first line of a paragraph standing alone at the bottom of a page or column.</strong> I agree that this is acceptable and I will generally let it stand. I do feel that it is not entirely desirable, and if there is an opportunity to avoid it immediately available, I will prefer to eliminate this situation.</p>
      <p>-- K.</p>
