      <p>Will,</p>
      <p>I wasn't being personal -- I'm well aware you don't need crutches. But book design is more akin to set design for the theater, or perhaps as often said, architecture (I'm less happy with the architecture analogy). I'm sure there are other possibilities as well. But whatever your favorite analogy, it shouldn't be engineering. A volt is a volt, and it shows up as such on a calibrated meter. </p>
      <p>The remark was aimed generally. I am puzzled that so many of the people who frequent Typophile feel Bringhurst's book is a kind of bible -- it is, after all, basically mid-20th century British typography -- and yet the same people feel the fonts of the period are dated &amp; should not be used.</p>
      <p>For J. C. Salmon, I believe the point to consider is that, at least historically, the proper element of a book is not a single page, but a spread; two pages. The relationship of the type block to the spread is such that the gutter (between the two pages) should be visually smaller that the outer margins.</p>
      <p>Now first of all, you may not agree that the *open* book is the proper thing to view. Certainly other means of presenting text give a different relationship. But even if you accept that traditional perspective, judging that gutter gets pretty difficult given the various binding techniques today. And remember too that most book design today is for a what is called "split production." That means that, say, 2,500 copies will be printed, and 1,000 will be Smythe-sewn with a hard case, and 1,500 will be bound paperback -- either perfect bound, or notch bound. That means compromise. Do you penalize the more expensive Smythe-sewn copies so the cheap paperbacks have a nice gutter, or do you suffer a tight paperback gutter for a pleasant cloth bound book? Or compromise both just a little?</p>
