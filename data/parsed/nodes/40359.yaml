       This (’81) reprint doesn’t keep every page properly placed, but the page spread shown looks pretty good to me: 3½×5″ type block on 5×7⅓″ paper makes for comfortable margins with room for thumbs, framing the type block nicely. Though charles_e might take issue with the 5pc gutter and the 3pc head margins. (Question on terminology: There are three picas between paper edge and the top of the header, and five between paper edge and the text block; which is the "head margin"?)<br>
