      <p>I find all these *rules* more like *crutches.* I think Will would allow that Richard Eckersley was one of the better book designers of the last half of the twentieth century. Much of Richard's attention was the look of the page. A few things he tried, and over time, accepted:</p>
      <p>1. Carding (feathering, vertical justification) was required in setting his books. He usually used about 13.5 points of lead, and around 38 lines (so 37 line spaces) per page. With carding, the variance would be 37 or 39 lines per page -- with 37, leading would be 13.875, with 39, leading would be 3.145. A "plus" carded page could not face a "minus" carded page.</p>
      <p>2. Avoid the first line of a paragraph ending a page. "Avoid" meant just that. If doing so caused a worse problem, go ahead &amp; end the page with a 1st line.</p>
      <p>3. No widows, but if a line ran 75% or more of full measure, and you were in a real bad situation, it was allowed. Of course, in a work having a lot of dialog, a single short line was allowed.</p>
      <p>When Richard was setting a book himself (always PageMaker), he would vary the measure a bit (for the whole page or spread) to see if he got a better page (well, chapter). Most of us use applications programs where this isn't practical. But I do remember from the days of the Linotron 202 that output could vary as much as 3 points over a 26-pica measure, day to day. If you were making patch corrections (2nd, 3rd proof) and that happened, you centered that long/short correction over the existing type, and it wasn't really noticeable. If the horizontal amplifier go so far off you could notice the different line lengths, you had to reset the correction, using a smaller (larger) specified measure. BTW, the older Linotype VIP was worse than the 202 at holding a constant measure across days.</p>
      <p>Anyway, the point is that from Richrd's perspective, the look of the page was paramount, and all his composition rules were keyed to how he wanted the page to look. Others may have a different idea of what constitutes a good page, or even feel that there is something more basic. To say the *rules* require this or that is only to show you don't have much experience and/or don't trust what your experience has shown you.</p>
