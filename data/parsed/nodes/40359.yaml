      <p>&gt; (For example, adjusting the inter-paragraph spacing to avoid widows &amp; orphans, which I think looks better than changing all the leading on the page.)</p>
      <p>I also object to feathering of this type. If there are only 3 paragraphs on a page, you are adding 4 or more points between them, which would look like a blank line to the average eye. (You can safely save or lose a line around a subhead by varying the spacing around these, in many cases).</p>
      <p>The traditional way of avoiding widows (when editing is not allowed) is to run pages a line short/long. Both pages on a spread are run either one line longer or shorter than the text block. You occasionally have to go back two or more spreads to avoid the problem. Normally you would never go directly from a long spread to a short spread, or vice versa.</p>
