      <p>I fully agree with Kent's &amp; Don's comments about feathering or adding space between paras. I recently did allow 1/4 point feathering of one page, for there really was no other way round it in a very complex ms and the facing page was so odd that no one would notice [except those fanatics who hold pages to the light to check back-up].</p>
      <p>But you also need to decide what you will call a widow and what you will call an orphan, and what is unacceptable. There is much difference of opinion among typographers concerning the correct definitions of these words, as well as difference about the acceptability of widows &amp; orphans.</p>
      <p>Here are my opinions, for book work.</p>
      <p>WIDOWS are not acceptable. A widow is defined as a paragraph exit line that is the first line of a text page &amp; that is less than full measure. A full-measure exit line in such position is not a widow, &amp; may be permitted to stand. A short single-line text paragraph is not a widow, wherever it falls. A single-line subhead of any length is not a widow. Widows approximately 75% of measure can be accepted in ragged right settings.</p>
      <p>ORPHANS are acceptable. An orphan is the first line of a paragraph falling as the last line of a page or column.</p>
      <p>Designers trained for advertising work often have harsher rules about widows and orphans than designers trained for bookwork, for their concerns are often more "aesthetic" than "text-serving."</p>
      <p>During my tenure as an advertising type director I was often asked by art directors to kill a short line—a "widow"—that fell in the middle of a column. The only thing I could do was haul in the writer and get text added or killed. For some reason these "widows" were not OK. I never could see that.</p>
      <p>Nor would they allow orphans (as described above). I was more willing to accept this than the overly-heated fear of short lines mid-text. But there's absolutely nothing wrong in book work with starting a para on the last line of a page. The indent is not unsightly.</p>
      <p>powers</p>
