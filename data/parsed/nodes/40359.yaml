      <p><cite>The problem comes about when the other spacing — mainly the margins — aren’t considered.</cite></p>
      <p>I cannot even conceive of a book designer not considering margins. White space is <em>so</em> important—not only to legibility, but to readability. Although the types I use in a book are probably the first things I think about when planning a book’s design—it is just naturally easy to think about—my text area, and therefore the margins, are next. Who doesn’t consider margins?</p>
      <p>Joel, if you're still looking for some inspiration, I've some other books for you to check out—perhaps one or two of these are in the library: Hugh Williamson's <em>Methods of Book Design;</em> this one with a background in metal type, gives a good pre-computer sense of things. Adrian Wilson's <em>The Design of Books,</em> Rich Hendel's <em>On Book Design,</em> and Andrew Haslam's <em>Bookdesign.</em> I realize that you need to make  some decisions post-haste, but learning some guidelines will take you a long way toward percolating ideas of your own.</p>
