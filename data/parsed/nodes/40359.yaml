      <p><cite> &gt; ☞How can I tell if the typography in a book is deliberate or accidental?☜</cite></p>
      <p>Joel -- I'm afraid I don't understand your question. The typography in a book is always deliberate, in that someone had to decide to put it there. That person may or may not have had training, and may or may not have good taste (or taste that coincides with one's own), etc. But books don't happen accidentally. </p>
      <p>If by "deliberate" you mean "given extensive thought to," then I would say that if the typography is "good," someone gave it some thought; if it is not good, then it doesn't really matter, deliberate or not. Good typography is hardly ever accidental.</p>
      <p>-- K.</p>
