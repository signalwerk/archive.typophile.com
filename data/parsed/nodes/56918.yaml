      <p>Tim: interesting observation about moving points along the curve. In my experience, that's <em>much</em> more true for G4 points than G2, especially if the point is on a curvature maxima. With the G2 points, all curvature minima and maxima must occur at the control points.</p>
      <p>And if moving the point really doesn't affect the curve at all, then perhaps that means some points could be removed.</p>
      <p>I certainly agree that redundancy is a bad thing. As for the Beziers or interpolating splines are fundamentally better for designing fonts, that may come down to a matter of individual preference. Beziers are cool, and are of course capable of really good work. Serious designers like David have invested years into making them do exactly what is wanted. He no doubt avoids "bad Beziers" completely subconsciously.</p>
      <p>I do suspect that the advantages of interpolating splines will come out more strongly when designing fonts with variation. Making a single Bezier outline G2 continuous (or nearly so) is not too hard if you have tools. Making a set of Multiple Masters that preserve that property across a wide range of interpolations is, uh, not so easy. Yet, with my interpolating splines, you get that by construction. I have only played around with interpolations a bit, because I don't (yet) have interactive tools for it, but so far it does seem much easier to get good results.</p>
