      <p>I'd love to read that paper, too.</p>
      <p>DB, you wrote:</p>
      <p><cite>And what are very sparse points? I mean, points are never sparser than those required for a given shape,"</cite></p>
      <p>Yes, but that minimum sparseness can be dependent on the math being used. There's a relationship between the way the curves are described (mathematical representation), and what shapes are most efficiently described by a given kind of math. Think about the differences between cubic and quadratic Bezier curves, for instance....</p>
      <p><cite>"... nor are they often less than sparse in professionally crafted fonts."</cite></p>
      <p>Sure, but it's hardly unusual to be forced to put an extra on-curve point on the curve of an "s," is it? The minimal sparse curve is defined by the combination of the desired shape and the math being used to describe it. Sometimes the shape requires more than just the minimum on-curve points one needs for that class of curve... at which point it becomes a reasonable question where there's some kind of math that would work better.</p>
      <p>Leastways, that's my way of thinking.</p>
      <p>Cheers,</p>
      <p>T</p>
