    html: |-
      <p><cite>Tim, in your Robothon talk I linked above, you seemed to argue that the main problem with ’bad’ curves was not their being Bezier curves</cite></p>
      <p>Correct. I guess nobody considers Bezier curves "bad", and if Raph uses spirals internally and it leads to a useful curve editor then that's fair enough. The current conversion problems are obvious but are not impossible to overcome. Time will tell how well the approach of on-curve points without any tangents works in real-life design.</p>
      <p><cite>... but rather too big a change in curvature at nodes joining two curves.</cite></p>
      <p>Exactly. Not having (too big) a change in curvature, in other words <cite>continuous curvature</cite>, is not my own concept. Mathematicians call it G2 continuity. I guess it is one of the most fundamental characteristics of a harmonious curve and establishing G2 (or making it "built in") is the most important step toward "good curves".</p>
      <p>Btw, this is a similar concept to what happens when we switch a node to "smooth" in FontLab: this means that FL enforces <cite>continuous diection</cite>, in mathematics this is called G1. Note that FL actively keeps the nodes smooth by secretly adjusting the other BCP as you drag the other. Smooth nodes are an application feature, not expressed in the curve mathematics and not even stored in the font files.</p>
      <p>So, G2 is just the next logical step from "kink" to "smooth" and as you may guess, there is also G3: a continuity of the derivative of curvature. Sounds a bit over the top, but it expresses the difference between "bumps" or "dents" in the outline (think of the top left part of Palatino's c, d or f, where this is intentional) or a really very smooth curve. In my SpotOn tool, G3 is built-into diagonals, and the Harmonizer will soon have it as an option.</p>
      <p><cite>If this is so, then having the Euler curve is not necessarily any advantage, which I take to be David’s view. </cite></p>
      <p>If it helps to find curves that have G2, G3 and even G4 (if I remember correctly) then it is may be a ueful means to an end.</p>
      <p>I see the main difference not in the mathematics used but in the "philosophy". One is the classic mathematical aproach of "something is given" (in this case, a set of points) and "something is to be found" (a curve through it). I am not sure whether this is the right approach for an interactive tool, however.<br>
      My concept is to say, the tool simply "does something" while the designer drags nodes/point/curves/lines until they get the shape they want. The "does something" could be anything. Although (or probably because) this gives me a lot of freedom, finding a good "does something" is quite a challenge. For me, the crucial question when developing a curve editor is: how does moving the points change the curve? This change should be predictable and traceable despite all the magic built-in smoothness.</p>
