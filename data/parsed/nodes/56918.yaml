      <p>J.H. -- <cite>Have you tried contextual interaction of dynamic mark positioning with kerning?</cite><br>
      D.B. -- <cite>I hope someone gets your message in a bottle. [...] I've kept sending more and better illustrated bottles [...]</cite></p>
      <p>No need for wasting time on illustrating bottles. DecoType has done so already, both with their ACE technology and typefaces, Naskh and their new <a href="http://typophile.com/node/44140#comment-341868" target="_blank" rel="nofollow">Nastaleeq</a>. Another kind of illustration is a little exercise. Produce such a Nastaleeq in OpenType, with as few glyphs and with comparable layout behavior. Or, for beginners, do systematic mark attachment in Latin script fonts. (Doing some trials right now which involves not just usual class/exception kerning but also contextual kerning of all possible base-mark combinations -- a simplified case of "contextual interaction of dynamic mark positioning with kerning" --, OpenType's limitations beat back around every corner. Unfortunately these limitations are structural.)</p>
      <p>Perhaps the most crucial point is to put more emphasis on the "open" in OT or OFF, as a platform that serves multiple specialized layout engines tailored around the needs of individual scripts, with special tables addressing each script and layout engine's logic. Maybe even additional shape description formats, like CJK may profit from <a href="http://engineering.tufts.edu/GradResearch/documents/GradResearch2006/jakubiak.pdf" rel="nofollow">stylized strokes</a>. But then keep each of these closed and well documented so it is reliable for all parties.</p>
      <p>Karsten</p>
