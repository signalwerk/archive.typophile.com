      <p>Following up on what I called my crucial question above, "How does moving the points change the curve?"</p>
      <p>While playing around with Spiro, I noticed the following:</p>
      <p>If I drag a point perpendicular to the contour then the contour is pushed in or out. Not surprising, and this is how you want a drawing tool to behave, of course.<br>
      However, if I move the point in the other direction, i.e. along the contour, then almost nothing happens. In other words: of the two dimensions you can move a point in, one seems to be "unused". Two degrees of freedom effectively controlling one. Isn't that redundancy a pity? I am quite convinced that redundancy is the root of all evil when it comes to curve editing. Another consequence is obviously that this increases the number of points that are necessary to control the shape.</p>
      <p>I think an ideal curve editing tool (independent of the underlying mathematics) should make use of the two degrees of freedom in which the user can tell the computer the desired change. Dragging the curve or an on-curve point should control two things: pushing the contour it in and out, i.e. removing or adding black "material", but also pushing the material to the side, making the curve move out on one side and in on the other. This is what happens when you move the on-curve Bezier nodes, so at least in this respect they behave like you would expect it. Bezier splines have their oddities, of course, but if the computer helps the designer tame them they come pretty close to what I consider an ideal tool.</p>
