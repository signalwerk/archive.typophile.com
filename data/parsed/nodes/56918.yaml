      <p>David, if you mean that the OFF standard will simply evolve continuously into a new format, then yes, that is one way it could go, although the result will be a giant mess of legacy compatibility issues: the MS Word of font formats. Within this framework, discussion is already under way about how to get past the 64k glyph limit and things like different vertical metrics requirements of different scripts, using composite fonts. Which of course raises issues of how to implement cross-font kerning and other layout intelligence. Doubtless some bright mind will come up with a solution to those problems, but in doing so will add layers of complexity to font development that wouldn't be necessary if the format were not saddled with that 64k limit in the first place.</p>
      <p>Then there are the things that OpenType can do -- and hence the way in which they do them will not be changed, because inertia is the measure of success for a standard -- but does so in ways that are painfully difficult. Have you tried contextual interaction of dynamic mark positioning with kerning?</p>
      <p>Then there are the incompatibility issues between different OT layout engines. Having a single font format standard is nice, but there is no single standard for implementing OT layout in systems and applications. I spent some time over the past couple of weeks helping a major software developer figure out what they were doing wrong in their OTL implementation, all the while with them complaining about the lack of an OTL implementation spec and lack of clarity in the OT font spec.</p>
      <p>Nor is there anything like cross-platform compatible script and language support, and since the OT standard relies on system and application resources for such things -- without the option of AAT/Graphite-like font level implementation -- the ability to create text in your native language may be tightly constrained or even impossible, while you wait for your culture to become a priority for someone else's strategic marketing.</p>
      <p>Yes, these issues can be addressed by hacking extensions on to the OT spec -- just as CFF PS support was hacked onto the TTO spec to create OT in the first place -- but its a heck of a lot cleaner to ask 'Okay, what have we learned from OpenType, and how can we do it better?'</p>
