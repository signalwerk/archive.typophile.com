      <p>Tim, in your Robothon talk I linked above, you seemed to argue that the main problem with 'bad' curves was not their being Bezier curves, but rather too big a change in curvature at nodes joining two curves. </p>
      <p>If this is so, then having the Euler curve is not necessarily any advantage, which I take to be David's view. </p>
      <p>Now everything is in the end converted to Beziers in Raph's approach. I believe that Raph did illustrate this sometime here on typophile, and the conversion was very good. So I think the question of usefulness is really whether this tool--or the one you are developing, or neither or both--make it easier to get curves of the kinds that type designers want to get. </p>
      <p>Since, as David says, we are in any case dealing with finite resolutions--2700 dpi or 96 dpi or something in between--many different closely related curves are equally "ideal". So the question is ease of use in getting curves you want.</p>
