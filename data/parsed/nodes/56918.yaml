      <p>I'll follow on with some images and other things when I'm on my home computer, but I did want to address a few of the questions.</p>
      <p>Spiro is based on Euler spirals, but with some refinement. The main thing is the straight-to-curve transition, which can't readily be done using pure Euler spirals. It also gives you a choice between G4 continuity and G2 (as Tim explained above). I used to use G4 for most of my outlines, but have more recently decided that it's virtually impossible to see the difference visually, so I can get just as good results with less effort using primarily G2 instead.</p>
      <p>The prototype tool I built for the paper uses a slightly different curve than Euler spirals - it has a shallower variation of curvature near the inflection point (center of an "S" curve), and that gives both a more taut (less "loopy") response and also better locality. Moving a control point causes less rippling outward. However, this tool is just open curves - it doesn't do the straight-to-curve transitions, or even corners and closed curves, so it's not very useful for making fonts (yet).</p>
      <p>I have an optimized conversion to cubic Beziers also, part of the spiro release. It's not well integrated with FontForge yet, and is very very slow (I've been hacking on both those issues, but haven't released the new version yet). The results, I think, are entirely suitable for real font production. However, I haven't addressed the issue of hinting at all. The resulting Beziers are clean and sparse enough that they're pretty easy to hint manually, but that doesn't help much in the case of variation.</p>
      <p>And by variation, yes, I mean things like interpolating between different widths or weights, but I also mean adding parameters for things like extender height - something that Metafont handled well, but Multiple Master doesn't.</p>
      <p>I know how to convert to optimized quadratics as well, but haven't actually written the code. For what I'm doing now, getting it into one industry-standard form is good enough. But perhaps quadratics are also interesting. Among other things, </p>
      <p>You can see one example of a conversion from spiro to Beziers on: <a href="http://levien.com/spiro/" title="http://levien.com/spiro/">http://levien.com/spiro/</a></p>
      <p>Thomas's description of sparseness is about what I'd say. I also have a fair amount of experience by now tracing outlines from metal type. Some representations require more points than others to get comparable results. In particular, evidence suggests that Spiro requires about half as many on-curve points as Ikarus, and lots and lots of real fonts got made using that tool.</p>
      <p>A new font format is certainly an interesting idea, but getting apps to adopt it is well-nigh impossible. So mostly I'm thinking about this as a technique for mastering fonts, then generating industry-standard formats from those masters.</p>
      <p>More later.</p>
