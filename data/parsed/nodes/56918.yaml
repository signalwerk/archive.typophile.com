      <p>Raph: <em>A new font format is certainly an interesting idea, but getting apps to adopt it is well-nigh impossible.</em></p>
      <p>Certainly true. But it's time to start talking about fonts post-OpenType, and my opinion is that anything and everything should be on the table, including outline formats. We should know what all the options are, and catalogue their pros and cons -- both technical and 'industrial' (in the sense of what might target industries accept) --, before we start describing the kind of fonts we'd like to be making ten-to-twenty years from now. Last time around, we -- font developers -- didn't get much of a say about it, and despite the huge improvements of OpenType over 8-bit Type 1, we're still stuck with a format with inherent limits (particularly with regard to table sizes, and some of us are already hitting those limits).</p>
