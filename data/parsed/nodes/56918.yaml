    <p>My paper for CAD Conferences is done. If you just happen to be in Reno on Jun 11, then by all means <a href="http://www.cadconferences.com/CAD09_Thursday.html" rel="nofollow">stop by</a>.</p>
    <p>The paper is entitled "Interpolating Splines:  Which is the Fairest of them all?" It tells the story in some considerably technical detail about my explorations to make a spline based on curves even better than the Euler spiral (also known as Cornu spiral) I've been working with for years.</p>
    <p>Part of the paper includes the results of the <a href="http://typophile.com/node/52821" rel="nofollow">survey</a> I did here a few months ago. Thanks again to all who participated in that.</p>
    <p>Here's an image comparing the two splines. The new curve is in black, the Euler spiral spline in blue. You can certainly <em>do</em> the desired curve with the older spline, it would just need more points. A major goal in pursuing the new curve is to make it possible to create good results with very sparse points, which, in turn, is especially useful when doing interpolation and other forms of variation.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/spline2_3566.png"></div><p></p>
    <p>I don't want to put the paper up at a public URL until the conference (as that's my understanding of the proper etiquette), but if anyone here is interested, just drop me a note and I'll be happy to send a private link.</p>
    <p>I haven't yet put it together into a tool useful enough to actually draw fonts with (there are issues with stability, and the numerical work is difficult), but I do think it's a promising path to explore.</p>
