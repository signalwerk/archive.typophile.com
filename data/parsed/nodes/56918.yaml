      <p><em>Tim, in your Robothon talk I linked above, you seemed to argue that the main problem with ’bad’ curves was not their being Bezier curves, but rather too big a change in curvature at nodes joining two curves.</em></p>
      <p>I totally agree that the problem is with <em>bad</em> Beziers rather than Beziers, but if one has a tool that makes it easier to have continuous curvature, isn't that worth exploring? I'd be the first to admit that there are better curve-sketchers than me, but there are times when I spend hours trying to get a Bezier "good".</p>
      <p>Of course a new curve family isn't going to magically make type design easy, especially when we have to convert to a different curve family for output, but I think new tools are worth exploring.</p>
      <p>With regards to John Hudson's idea of "a proposal for a font format using his curves natively," my intuition is that evaluation of these curves is rather resource-intensive, especially now that devices like phones are using standard font technology. On the other hand, if they can handle Splinter Cell, maybe they can handle a few continuous-curvature curves. Bezier curves, in contrast, are extremely fast to evaluate.</p>
      <p>So, Raph, colour me interested and send me a preprint.</p>
