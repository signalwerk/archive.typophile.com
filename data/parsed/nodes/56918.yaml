      <p>[Drifting perhaps off-topic, since this no longer involves Raph's work.]</p>
      <p>Tim, I've been testing your Harmoniser, and apart from problems with distorting serif structure, due to the tightness of the curves, it generally does what is advertised: makes nicely smooth curves. But there is a built-in problem with how it does this -- by adjusting the position of the on curve node -- because overall good letter form depends not only on the quality of individual curves but on the relationship between inner curves and outer curves. The Harmoniser frequently changes that relationship, by shifting the relative positions of extrema on inner and outer curves, thereby changing the nature of the stroke. In terms of Noordzijan stroke modelling, Harmoniser changes the angle of the moving front.</p>
