      <p>That's interesting, because while I see what you're saying, I find spiros less "action-at-a-distance-y". If I don't have the curve I want, I ask myself, where should this curve go instead, and I add a point there (or if there is already one nearby, I adjust it); with Beziers, on the other hand, I have to think which of the four relevant points (two on-curve and two off-curve) do I need to move, and where, to get the change I want. With a bit of practice, one learns to do this pretty easily, but it's not wholly intuitive (especially if the off-curve points are invisible -- ever used MS Paint's Bezier tool?).</p>
