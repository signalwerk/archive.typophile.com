      <p>I <code>cd</code> to the directory that contains the files to be converted, then run the command. It works for the Minion sample, but not mine. I created all of the documents using the Myriad files as templates, so I don't know if they are the problem.</p>
      <p>I'm reading Miguel Sousa's "Font production at Adobe" .pdf for some clues. I re-exported the .pfa using standard encoding, and that's getting me further along the line.</p>
