      <p>When doing the subsetting, you also have to modify the GSUB and GPOS tables to account for the new repertoire of glyphs -- I assume you are doing that?</p>
      <p>You might verify the font with <a class="freelinking external" href="http://www.microsoft.com/typography/fontvalidator.mspx" rel="nofollow">Microsoft Font Validator</a> or some other integrity-checking tool.</p>
      <p>PS: What free nastaleeq font did you start with?</p>
