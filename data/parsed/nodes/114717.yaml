    <p>Hi All,</p>
    <p>My first post, so abt me:<br>
    I'm a programmer (c/c++/python/perl), but fonts are my hobby. So, please forgive me for any gaps in my knowledge on fonts.<br>
    I've successfully converted a free nastaleeq font to woff and am able to use it on my server and results are great.<br>
    Now, I'm trying to optimize the load time of the page, which is obnoxious given the fine nastaleeq font.<br>
    So, I got into subsetting. I'm using a script to subset based on text I'm going to send out, and the resulting font looks fine to me.<br>
    I checked it in FontForge and compared with the original to the best of my (sparse) knowledge. Things look OK to me.<br>
    However, the text that looks correct (using ligatures) with the original ttf or woff, renders with isolated forms with the subset font.<br>
    I verifed that the subset font had the ligature at the same place as the original.<br>
    My text is unicode and so is the font. I can see GSUB(ccmp,init,medi,fina,rlig,calt,single) and GPOS(curs,mark,kern,mkmk etc) in the subset font</p>
    <p>Please help me identify why the ligatures stop working with the subset font. In other words, please let me know what is required in the font to make ligatures work, that might be getting left behind. Thanks.</p>
