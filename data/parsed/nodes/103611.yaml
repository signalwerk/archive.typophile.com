    <p>Helloooo! </p>
    <p>I really love the look of these letters, identifont suggested Schneidler EF (1936) as the closest match although it is not exact. I mean that S is pretty loopy.</p>
    <p>As this is architecture from 1916, I am now having doubts... Is this even a font? (Alternatively, has someone made it into one?)</p>
    <p>Thank you so much for your time!</p>
