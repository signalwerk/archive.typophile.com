    html: <p> This is visually interesting but very difficult to  <br>read. <br> <br>If the spirit of Bauhaus types were/are <br>about achieving ultimate simplicity,  <br>this seems to have totally lost that spirit. <br> <br>Can you say the same of a bitmap script?  <br>(Namely that bitmaps are the furthest thing  <br>from actual handwriting.) Probably. But that  <br>doesn't mean you shouldn't pursue it... <br> <br>Now that I'm done waxing on... Stephen's  <br>probably on to something with his suggestion  <br>of an increased px height. </p>
