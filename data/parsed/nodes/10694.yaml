  - id: 149781
    user: 1203
    date: 2002-02-08T23:51:00
    date_raw: 8 Feb 2002 — 11:51pm
    votes: null
    html: "<p> Miguel: <br> <br>For what you were attempting, it works very well. Still, I have to agree that it isn't very readable. <br> <br>The biggest part of the problem isn't in the design. I think the design is very good, again, for what you were attempting to create, which seems to be a display face that can be used at bitmapped text sizes. <br> <br>The problem instead lies in the fact that inline Bauhaus fonts like this were never meant to be used at sizes this small. It's the inline form relative to its size that's the problem -- not your interpretation of it. To that end, I'm not sure that thickening the black lines will be of significant help. I suspect that you'd just end up with an even heavier font that looks cool but is difficult to read at small sizes. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":)\"> <br> <br>I think perhaps the best solution would be to enlarge the font overall to a size where it has acceptible readability, and treat it as a (very cool) display face rather than a text face. <br> <br>David </p>"
    html_clean: "<p> Miguel: <br> <br>For what you were attempting, it works very well. Still, I have to agree that it isn't very readable. <br> <br>The biggest part of the problem isn't in the design. I think the design is very good, again, for what you were attempting to create, which seems to be a display face that can be used at bitmapped text sizes. <br> <br>The problem instead lies in the fact that inline Bauhaus fonts like this were never meant to be used at sizes this small. It's the inline form relative to its size that's the problem -- not your interpretation of it. To that end, I'm not sure that thickening the black lines will be of significant help. I suspect that you'd just end up with an even heavier font that looks cool but is difficult to read at small sizes. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":)\"> <br> <br>I think perhaps the best solution would be to enlarge the font overall to a size where it has acceptible readability, and treat it as a (very cool) display face rather than a text face. <br> <br>David </p>"
