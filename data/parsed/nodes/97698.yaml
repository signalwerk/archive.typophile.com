    html: |-
      <p>These glyphs need a lot of work.  The crossbar of the e looks childish to me.  Interestingly your sketches look better than your vectors, it doesn't seem like you copied them that closely.  For example, the top left corner of your g in your sketches seems to go almost as far to the left as the line that connects the bowls, and has a decent look to it, whereas in your vector, the line connecting the bowls seems to go way out in the middle of nowhere.  Also, your sketched a has a nice sense of proportion between the bowl and the rest of the letter, but your vector a's bowl is much too big.  I would try to get close to your original sketches, try to introduce just a little more thick/thin contrast, and round off the corners just a bit.</p>
      <p>Not trying to be mean, just telling you how I see it.</p>
