    html: |-
      <p>1. Variation like this is considered mild and often preferred for distinguishing glyphs that would otherwise be turned/flipped copies of each other. These letters have different histories manifesting in different expectations (for instance, the descender of |p| is more consistently expected to be straight) and it can be good to highlight these differences.</p>
      <p>2. |a| is excellent.<br>
      |g| is nicely original but may appear to have an excess of loose ends; I suggest making the third from the top into a curve or corner.<br>
      The sharp beak of |e| is awkward, but might be saved with more adjustments of weight and proportion. Unfortunately a wavy crossbar such as this is seldom successful. The anthropomorphized smile of an |e| can contribute a lot to a typeface's "voice" and this shape creates a sort of sneer.</p>
