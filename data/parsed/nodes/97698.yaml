    <p>Hello Everyone,<br>
    I am working on a Latin type face design to be used in Non Latin text to write a word ,Paragraph and Phrases , In writing systems such as Hebrew, Armenian, Ethiopic and Farsi etc… .<br>
    I am trying to make the X height as big as possible and open the bowls as much as I can . (It will be used on low resolution devices).<br>
    I also want one Glyph to invite the reader to the next Glyph by Imaginary line (Please see 2nd Image)for faster and pleasant reading. (Hard to do but will try my best).<br>
    Most of all I am trying to find the beauty, Proportion and balance of each individual Glyph ignoring the overall style where is needed.<br>
    My question is : 1.Is it acceptable to have different forms with one individual Latin font style  ?<br>
    For example on the second Image P and b has different tips .<br>
    2. I know the form of a,e,g are deciding factors on the rest form of Latin characters. What do you think about my a,e,g ?<br>
    I am particularly interested to hear about my g (Which I like most among Latin characters).<br>
    All suggestions are very much appreciated.<br>
    Thanks ,<br>
    Aleme<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Sketch_1_3724.png"></div><div class="imageWrap"><img src="http://typophile.com/files/Explanation_!_5468.png"></div><p></p>
