    html: |-
      <p>Tablets are generally used more by retouchers and the such who ’digitally paint’. Type design (if you’re talking actual production) is purely manipulation of single points. I don’t see how a tablet would be beneficial. That’s just my opinion though.</p>
      <p>If you’re talking about brainstorming phase, ideas, sketching etc. then I suppose you’d be better off getting your concepts out with a tablet.</p>
    html_clean: |-
