  - id: 112809
    user: 111
    date: 2006-03-15T21:27:00
    date_raw: 15.Mar.2006 9.27pm
    votes: null
    html: <p>After making the switch to a tablet, I don’t think I’ll return to using a mouse for anything other than web-browsing. Everyone works differently, but for me, whether it is drawing with vector tools or pixel pushing, my hand can move much more freely across the canvas, and with more accuracy. I find that it is more comfortable than using a mouse, however, strangely enough, I have developed a callous on my pinky finger (aka Wacom Callous™) from the way I hold the pen. :) Don’t let this scare you — I haven’t yet come across anyone else with this problem.</p>
