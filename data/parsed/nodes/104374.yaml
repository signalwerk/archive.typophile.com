      <p><em>Whenever publishing guidelines are not strict, I usually opt for some pretty typeface I deem suitable. </em></p>
      <p>Well, you’re walking into an oxymoron there.</p>
      <p>I don’t provide this degree of math support because there is not enough market to justify the development, for a commercial foundry.</p>
      <p>Firstly, various free fonts (from non-commercial foundries) address the need, e.g. Cambria and Old Standard.<br>
      Secondly, the academic community is not really typeface savvy, or has a perverse taste (witness the CERN announcment in Comic Sans). I can actually respect and understand that, as a pretty typeface might be construed as smoke-and-mirrors hype, which goes against the grain of dispassionate communication.</p>
      <p>A scientiﬁc version of Comic Sans would be much appreciated, I suspect, with the appearance of having been freshly written on a blackboard.</p>
