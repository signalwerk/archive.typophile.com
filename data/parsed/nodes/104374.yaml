      <p>OK,<br>
      sorry for the delayed reply.</p>
      <p>First let me say  "math" writing is a separate issue. As someone already mentioned, it is a very narrow niche that relies on an inordinate amount of weird glyphs (no offense!); furthermore, having a dedicated font comprising both scientific and common glyphs is largely unnecessary for math, given how publications in this field usually typeset equations 'out of the text'.</p>
      <p>I went combing my bibliographic database for normal science articles (in the field of natural and physical sciences) issued in both mainstream (~Science, Nature...) and highly-specialized journals (Acta Geologica Sinica). It seems the range of characters needed for run-in sentences is way lower than with maths. Roughly: a range of lowercase greek letters (alpha beta gamma delta epsilon seem the most common), subscript/superscript numbers and usual mathematical operators (₊₋₌₍₎⁺⁻⁼⁽⁾ⁿ), permil, and extended-latin glyphs (to account for east-european and turkish names... however foreign localities and names using exotic alphabets are almost invariably latinized - no need for cyrillic or simplified chinese glyphs!). I'll gladly dig into other scientific-non-mathematic fields e.g. medical biology and the such, to check if additional glyphs are routinely used.</p>
      <p>Some composite - and largely non-sensical - example:<br>
      <cite>In this study, ⁸⁷Sr/⁸⁶Sr ratios were calculated for samples of Mn⁴⁺-rich carbonates according to the method by Chlupáč et al. (1989). In addition, a δ¹⁸O signal of 5.3±0.07‰ for the phosphate fraction was measured by γ-diffractometry for samples of average composition (Xⁿ⁺Y²ⁿ)₂(CO₃)₂.</cite><br>
      Impossible to type that sentence "semantically" using e.g. the widespread and highly functional Myriad... for lack of a superscript plus.</p>
      <p>I agree that "Times &amp; Cambria &amp; Helvetica &amp; Lucida Sans Unicode &amp; Comic Sans" ought to be enough for anybody in the academia. Still I wonder whether these typefaces are used and abused because they're the top of the crop, or because nothing else is there to overthrow them... ;) Please bear in mind that communication is at the very heart of science, and increasingly so - scientific communication and popularization is now taught at universities, and includes how to use infographics etc.</p>
      <p>By the way, many science [e]books/textbooks but the driest ones use a surprising diversity of font combinations. I've already noticed Berkeley, Frutiger, Dante, Myriad, Warnock among others... a bit more fanciful than old boring Times, yet legible and serious enough for serious matters. The Proceedings volume of the last conference I attended had a <em>pretty</em> cover featuring some Stempel Garamond. No heart attack in the audience... none that I know of ;)</p>
      <p>edit: just got me a weight of Aragon ST (new typeface intended for scientific writing), and it appears to have all the glyphs I need. However their encoding is a bit... strange (relying on stylistic sets and Co.). Richler looks great, but lacks that damn sups+.</p>
