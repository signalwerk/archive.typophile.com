      <p>This is an area that I am looking into at the moment. I have added some of those features into fonts myself, to support content that requires correct Unicode support and the OpenType features to implement it.</p>
      <p>Are you aware of/do you use, <a class="freelinking external" href="http://www.mathjax.org/" rel="nofollow">MathJax</a>? It takes advantage of the <a class="freelinking external" href="http://www.stixfonts.org/" rel="nofollow">STIX fonts</a> and was created to address the need for math and scientific communities publishing content on the web.</p>
      <p><a href="/wiki/https%3A/%252Fgithub.com/khaledhosny/xits-math" class="freelinking" rel="nofollow">XITS</a> is a project which aims to create an OpenType implementation of the STIX fonts.</p>
      <p>Ross Mills, who did a lot of the engineering work on Cambria Math has also produced, <a class="freelinking external" href="http://www.tiro.com/Maxwell/Maxwell_beta_1.5_spec.pdf" rel="nofollow">Maxwell (this link leads to a PDF display or download depending on your browser)</a>.</p>
      <p>There is also an open source font called, <a class="freelinking external" href="http://www.ctan.org/tex-archive/fonts/Asana-Math/" rel="nofollow">Asana Math</a> designed to address the same need for typesetting within MS Word 2007/2010 as Cambria Math. It also works with XeTeX.</p>
      <p>Implementing the features and support that you require is definitely something that individuals and small groups are mindful of but doing it well can be extremely time consuming and difficult, which means that it is unlikely to see widespread adoption.</p>
