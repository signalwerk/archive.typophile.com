  html: |-
    <p>Hi,<br>
    I am looking for font designers of color in the US (african-american, and/or from the hispanic community in the US).<br>
    A client wants to make a book on artists of color, and the whole project is very conscious about that topic. (Un)fortunately, I have never ever paid attention to the font designers’ color up til now …&nbsp;(not much of a debate over here in Europe). But in this case I have to be prepared to be asked about these things or to present alternative font choices from font designers of color.<br>
    All hints are welcome!<br>
    Cheers</p>
