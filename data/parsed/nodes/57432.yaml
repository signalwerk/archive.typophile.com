    html: |-
      <p>I spoke too soon when I said <a href="http://webfonts.fonts.com/" title="http://webfonts.fonts.com/">http://webfonts.fonts.com/</a> had fonts rendered in different sizes on Chrome/Safari and on Firefox/IE. It came up that defining the text style as bold was causing Firefox and IE to faux bold them.<br>
      The only remark now is that the lack of anti-alias on the text in some xp machines complicates the use of condensed fonts.<br>
      <a href="http://webfonts.fonts.com/" title="http://webfonts.fonts.com/">http://webfonts.fonts.com/</a> is a beta service and at some point they will begin to charge. But for those like me who need bold condensed into dynamic text, is the best option I found so far.<br>
      Thank you.</p>
