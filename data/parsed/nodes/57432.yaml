  html: |-
    <p>Achtung! I can't wait for @font-face to actually work in most browsers. It will make finding a decent condensed face much easier.</p>
    <p>This is the state of things, as I see them:</p>
    <p>Arial Narrow =&gt; Horrible, ugly, ugly<br>
    Impact =&gt; Too black, too overused<br>
    Haettenschweiler =&gt; Only on Windows, see also Impact<br>
    Helvetica Neue =&gt; Only on Mac, how the heck do you specify it for anything other than Safari?<br>
    Tahoma =&gt; Tight fit, not really a condensed font. Just more condensed than Verdana.<br>
    Trebuchet =&gt; Tighter than Tahoma, still ugly</p>
    <p>Am I missing any?</p>
