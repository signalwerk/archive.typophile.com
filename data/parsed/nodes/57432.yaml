      <p>Dan, I am going through the same issue.<br>
      Linotype is currently offering a license extension for the use of Cufón, sIFR, Flash and EOT with @font-face. They do not permit using TTF or OTF with @font-face, as this would allow anyone to download and use the font.<br>
      Cufón transforms the font on a svg, and draws it with js. But the generator plus the font file in my case were more than 100ks, and the text can not be selected.<br>
      sIFR uses flash...<br>
      So I'm trying <a href="http://webfonts.fonts.com/" title="http://webfonts.fonts.com/">http://webfonts.fonts.com/</a>  which is pretty cool, but isn't perfect either.<br>
      After trying all the condensed options they offer, I chose Trade Gothic Next Bold Condensed. Unfortunately, Chrome and Safari renders the fonts way smaller than Firefox and IE.</p>
