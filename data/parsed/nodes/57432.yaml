    html: |-
      <p>&gt; Unfortunately, Chrome and Safari render[] the fonts way smaller than Firefox and IE.</p>
      <p>So there is that, and the fact that any fall back fonts you define for @ff condensed heads, should they be employed, will blow-up your layout; I'd start using <em>as graphics</em> whatever font you plan on for condensed (actually most web designers are looking to quench a bold condensed thirst), and then... if the browsers catch up, you'll be stylistically prepared to start serving a live condensed. (None of this is recommended below 18-20 px or in large quantities, all of this is recommended for those with stylistic requirements beyond the current sizing and rendering barriers of CSS/OS type).</p>
      <p>And in the mean time, I will see what I can do to give condensed and bold cond. families to everyone in the world for free, so sometime in the future, a fall back font won't blow up your layouts using condensed. If you want to change the Russian Doll inside this issue, lobby IE to support CSS: font-size-adjust. </p>
      <p>JC&gt;We can add this to the list of pearls of wisdom from David “Fools!” Berlow that are best avoided.</p>
      <p>What's the alternative, oh wise leader of da Fools?;)</p>
      <p>Cheers!</p>
