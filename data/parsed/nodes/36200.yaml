      <p>I’m not sure why he changed the basic roman forms. He explains that the objective of the typeface was to overcome the technical limitations of the low resolution output. However, the typeface could have come out more legible while still adhering to the 90° and 45° concept had he stuck to the basic forms. It seems like he was taking a chance at creating something revolutionary and experimental rather than really solving the problem.</p>
      <p>Thanks Gary. Can’t wait for the DVD! Already pre-ordered.</p>
