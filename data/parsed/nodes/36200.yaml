      <p><cite>It seems like he was taking a chance at creating something revolutionary and experimental rather than really solving the problem.</cite></p>
      <p>Shortly after Crouwel published the pamphlet (1967), Gerard Unger, who at the time was a student at the Rietveld Academy, published his response, entitled <cite>A Counter-proposal.</cite></p>
      <p>Here’s a detail from Unger’s response pamphlet (bad photo taken at the breakfast table this morning with an iphone... sorry), which uses the concepts from Crouwel’s proposal but applies them to more readable letterforms:</p>
      <p></p><div class="imageWrap"><img src="/files/unger1_5539.jpg"></div><p></p>
      <p>Unger’s manifesto from the back cover:</p>
      <p>“I see no reason in developing an alphabet which takes a totally new form. The introduction of such an alphabet requires an adaptation of men. It would be more logical to adapt the machine.</p>
      <p>Machines exist. They have been contructed by technicians, whose primary aim was to achieve a very fast composing machine. This was their concern.</p>
      <p>Letters are my concern. Letters, as elements of words and sentences, are used to communicate. Such communication must be as clear as possible, whatever the shape of the letters. This is the main criterion.</p>
      <p>An adaptation of old letterforms, to the new techniques and the old reading habits, is in my opinion the most reasonable solution. I wish to remain as close as possible to the old letterforms, owing to the fact that these have the most readability.</p>
      <p>I reject reproduction of old letterforms by new machines. The retangular pattern creates too great a disfiguration. When a Garamond face is used, the printed result is no longer recognizable as a Garamond. By doing so, the control of quality is lost, because the end result differs too greatly from the original. Too many of the finer points are lost.</p>
      <p>It will be necessary to invent new refinements for the old forms which can be faithfully reproduced by the new machines.”</p>
