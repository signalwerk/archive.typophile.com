    html: |-
      <p>I was thinking of the same thing when I posted earlier and watching the clip.</p>
      <p>When he was talking he had the letter ’a’ on the table (the flipped L form), I questioned why it looked like that, <em>even if</em> it’s just an experiment. Something more resembling an ’a’ is obviously possible even with only 90 and 45 degree angles. Unger’s solution seems more logical in my opinion. But maybe if Crouwel had designed something that ’normal’, it might not have been in the spotlights as much or be as interesting as it was now.</p>
