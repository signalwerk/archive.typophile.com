  html: <p>It has recently come up on a few occasions as to where the line between posting for the greater good of the community and self promotion exists. A topic worthy of discussion. To the best of my knowledge Typophile has no formal policy regarding this but it is something I am actively looking into. Your thoughts, opinions, and ideas are welcome.</p>
