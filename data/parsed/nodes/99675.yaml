      <p>Well stated. I mostly agree, and would elaborate thus:<br>
      - If you can quickly* think of an easy/affordable solution, offer it**. In the case of finding just the right font, some of us don't have an encyclopedic knowledge or haven't developed/collected search tools.<br>
      - Recommend customization only if you think it's unlikely to find a good canned solution, or if it brings something extra that the requester might value (like exclusivity).<br>
      - If you recommend yourself, also recommend that the person look to the rest of the Typophile crowd, and/or a specific expert: <a href="http://typophile.com/node/100207" title="http://typophile.com/node/100207">http://typophile.com/node/100207</a></p>
      <p>* Nobody should expect a "stranger" to spend hours helping him, with little hope for reward.</p>
      <p>** <a href="http://typophile.com/node/9482" title="http://typophile.com/node/9482">http://typophile.com/node/9482</a></p>
      <p>BTW this sort of thing shouldn't be done as a sort of false-modesty cover-up. It's simply good to be good.</p>
      <p>hhp</p>
