      <p>If you might accept a perspective based on a wider view of human ethics:</p>
      <p>Issue 1 - The Intention of a Question. To use a recent post as an example: "Alternative to «Quiosco»" ( <a href="http://typophile.com/node/100311" title="http://typophile.com/node/100311">http://typophile.com/node/100311</a> ), the intention of the question was to seek out suggestions for a quite specific set of requirements (foreign language and scientific accents which are more legible for school use). This type of intention is different than someone more simply looking for an alternative to a specific typeface for the purpose of saving a bit of money, or to find something in the same genre, but slightly different. Consequently, an operational suggestion might be to provide separate forum sections for these differing intentions.</p>
      <p>Issue 2 - Self-promotion in an answer. Self-promotion of a specific typeface (or in the case @hrant and the aforementioned Alternative to Quiosco post, the capacity to customize existing fonts to meet specific needs) is not necessarily a good/bad or wrong/right proposition. The ethics is: how to couch the answer? In my travels through diverse cultures and comprehensions of ethics, the effective answer might be this:</p>
      <p>(a) first, make an honest effort to identify already existing alternatives as @Igor Freiberger did in attempting to provide a broad answer to the student's question... and certainly, list your own designs and/or preferences amongst the wider list... but do so transparently and non-aggressively... I once counseled a large computer retailer to first listen to the specific needs of a customer, and provide tailored solutions to the customer... and if, for any reason, you don't have the specific solution, it is wise to recommend to the customer to go somewhere else for that specific occasion (even help them to identify which retailer to visit). Customers remember this, and come back to gain "honest" buying suggestions. Long-term value versus short-term grab for money. A couple of the type designers that frequent Typophile, unfortunately, are just grabbing for short-term profits rather than seeing the wider, long-term value that they COULD have been providing. As a side note: from a designer's perspective, their designs are a true work of art (and indeed, they are). But to the user, fonts/typefaces are tools. That distinction tends to be lost when designers participate on forums such as this. An example: I personally love the pure artistry in H&amp;FJ's Didot... and use it whenever it is appropriate. But there are other occasions where a condensed version of a didone is required... thus, I tend to turn to Porchez's Ambroise (which I also admire its artistry... if didones were wives, I would have these two!)... but, alas, at the end of the day, a specific function of the typeface is required, and I make my choice based on the needs of the reader, not the type designer.</p>
      <p>(b) only as last resort, should someone recommend a customization solution. How would you like to go into a computer store seeking solutions, and the salesperson, in his/her first breath says: hey, let me build you a custom computer?</p>
      <p>Well... just a view from the peanut gallery...</p>
