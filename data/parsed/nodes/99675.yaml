      <p>@hrant, why should it not be expected or hoped that a stranger might provide advice without expecting an immediate reward? Again, short-termism versus long-term relationships... how does one begin to build a relationship... only when there is a reward attached? I say this not merely from an ethical/spiritual perspective, but also from a practical perspective. The relationships that I am fortunate to have now, are most often as a result of many years ago providing counsel or just an ear/shoulder to someone in need... this is the human factor that I find missing in "western" culture, but is the core of socio-economic relationships in other parts of the world... there is a slippery slope component to your ethical judgements: it is predicated on "consequence" ethics, rather than ethical judgement based on "natural truth" as Immanuel Kant was trying to explore... if we truly love one another, then the relationships we develop (including economic relationships) will be much more than fruitful... they will be eternal in their power... </p>
      <p>See the power of a font?</p>
