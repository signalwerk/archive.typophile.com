      <p>When someone asks for a font recommendation, I’ll often suggest one of my own, along with one or two others in a similar genre. But it does take a lot more time to do the research for that, and to satisfy myself that those other fonts with which I’m less familiar would do the job. Of course, I could recommend the old faithfuls, and sometimes do (e.g. Avant Garde, recently), but would prefer to keep it fresh.</p>
      <p>I don’t start threads about my work, unless in the Release forum.</p>
      <p>I will often illustrate topics on subjects such as small caps or ﬁgure styles with my own types. Again, I’m familiar with them and the line of thinking that went into them, and have them on hand.</p>
      <p>BTW, what happened to the Featured Font?</p>
