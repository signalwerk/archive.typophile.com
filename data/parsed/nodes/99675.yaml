      <p>At this point it’s clear that members have different ideas of what constitutes self promotion. By my definition, I don’t consider recommending a font you designed to be self promotion, unless of course that’s all you do as a member. Another instance could be someone flagrantly posting examples of their work which don’t really bear any relevance to a thread, treating Typophile as a portfolio/job board of sorts to drum up business, without actually participating in the dialogue. This can easily be discerned by looking at a members history. The same way you can see if all someone uses Typophile for is an ID board and homework help. Obviously this is a scale, and not a black and white. You all raise good points. Thanks for your input.</p>
      <p>(now I have about 300 bot posts to delete)</p>
