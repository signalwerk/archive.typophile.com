      <p>There are two full-time typeface design degree programs in the world: one at Reading University in the UK, the other at the KABK in the Netherlands. But I know the former is Masters level, and I suspect the latter has steep entry requirements as well.</p>
      <p>I myself teach a typeface design course at ArtCenter, Thursday nights.* One reason I would recommend trying that first is you need to make sure you really like the idea of designing type before committing to it, since it's really a strange, strange field... :-)  BTW, you mention that you're in high school - I think ArtCenter has special deals for high schoolers.</p>
      <p>* <a href="http://typophile.com/node/27672" title="http://typophile.com/node/27672">http://typophile.com/node/27672</a></p>
      <p>hhp</p>
