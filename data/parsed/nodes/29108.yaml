      <p>It's not a strange field, it is different from most of the design jobs considered under a survey, route and gaze perspective : mental representations of environmental spaces can be viewed in any three different ways (Tversky, 2004), most probably the same is true for the cognitive collage of the space of design research in typographic art and fontography.<br>
      No other design discipline requires so much learning and training as fontography, and by no other aspect can amateurs be so easily distinguished from professionals.<br>
      You might find useful what Sebastien Sanfilippo shared :<br>
      <a href="http://typophile.com/node/17612" title="http://typophile.com/node/17612">http://typophile.com/node/17612</a></p>
