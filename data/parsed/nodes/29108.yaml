    <p>I've been wondering for some time about this. I'm in high school right now and lately I've realy wanted to explore a carrer in typography, possiblely as a type designer, graphic design with a typography specialization, ect. I've been looking at universities, and I wanted to know 1. what degree would I pursue for a career like that and 2. what schools specialize in this field.</p>
    <p>I live in Los Angeles, California, so I've been looking at the Art Center College of Design and Laguna College of Design. I would rather go to school on the west coast, but I'm interested on what you all (as experts in the field) know.</p>
