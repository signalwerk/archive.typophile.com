      <p>Quotes/apostrophe got more space in the new Arno Pro so they do not glue at the word as in earlier typefaces. I like this.</p>
      <p><cite>For the fun of it, try setting the string 'A' 'quoteright' 'comma' in Warnock Pro. The kerning is so tight that even though a 'quoteright' intervenes, the 'comma' runs into the 'A'</cite></p>
      <p>Currently kerning is limited to pairs, so it is a tough decision at times: kern less (always!) or take into account that such overlaps occur. (Similar for 'V comma quoteleft' in German where comma/period are inside the quote, not outside of it.)</p>
      <p>[Hm, something wrong with the smart quotes?]</p>
