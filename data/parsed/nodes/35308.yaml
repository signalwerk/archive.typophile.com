      <p>Bringhurst's book <em>The Elements of Typographic Style</em> is great, not just for its content, but also for its form which exemplifies the content. The book's text face is Minion Pro. In it's version 3.1, page 34, are given examples of kerning pairs for English, French and German. The first line of the next picture is taken from Bringhurst (with a basic camera), the second line is the kerning as given by my Minion Pro otf v 001.000 file (version 002.000 is still tighter).</p>
      <p><img src="/sites/default/files/old-images/BringhurstVsVersion001_4302.gif"></p>
      <p>&gt;But we have an antidote…</p>
      <p>I am afraid that the file mykerning.ldf has too many side effects to be used as an antidote and I have no time to work on it or to learn more about those ldf files.  The MinionPro package also contains the source files, and I used them to get the virtual fonts corresponding to MinionPro otf version 001.000 (and I felt that was an improvement, especially for the French apostrophe). The sources also contain a directory to add "missing kerning pairs"; I did not check if it overrides the original Adobe kerning, but that would be my next try.</p>
