      <p>Spacing is something that is language dependent. If your text is to contain many languages, changing the spacing in the font itself is thus of no help. LaTeX provides a mechanism that solves that problem, namely the babel package; by specifiying in the input what language you are starting to use, LaTeX uses the appropriate spacing and hyphenation patterns for the input till the next language change. For your question, here is a very basic file <a href="http://www.iro.umontreal.ca/~boyer/typophile/myspacing.ldf">myspacing.ldf</a> that does the job. First, instead of kerning by 0.5pt, it kerns by 0.05em, so as to handle all font sizes. If you put the file <a href="http://www.iro.umontreal.ca/~boyer/typophile/myspacing.ldf">myspacing.ldf</a> in your working directory and have the following input<br><code><br>
      \usepackage[myspacing]{babel}<br>
      \begin{document}\noindent<br>
      \Myspacingtrue<br>
      \LARGE he's \Large he's \large he's \normalsize he's\\[0.5ex]<br>
      \Myspacingfalse<br>
      \LARGE he's \Large he's \large he's \normalsize he's<br>
      \end{document}<br></code><br>
      then the output will be<br><img src="/sites/default/files/old-images/output_5211.gif"><br>
      You can turn on and off at will your spacing convention and adjust the file myspacing.ldf so as to get exactly what you want. All you need to do is to fix in it the line<br><code><br>
          \kern0.05em\string'\kern0.05em<br></code><br>
      so as to get the kerning you want.</p>
      <p>If someone that knows more about babel is watching, I would be glad to learn how I could improve this little ldf file.</p>
      <p>Michel</p>
      <p>[edit] There are problems with double quotes and for some reason, this file interferes with "thebibliography". It is thus far from being a "product". I think the idea is interesting though.</p>
      <p>[edit++] Of course, the input needs to start with \documentclass{article} and a command to select the font Minion Pro.</p>
