      <p>Thanks to everyone who responded, I very much appreciate the input.</p>
      <p>Regarding fonts in LaTeX, you should all try XeTeX. I've only used it on Mac OS X, but it gives you direct access to fonts installed in the system, making it extremely easy to try out new fonts. ("Extremely easy" if you're used to (La)TeX font installations, "as easy as you'd expect" if you're not.)</p>
      <p>The main drawback with XeTeX, I think, is that it doesn't support the microtype package (protrusion, font expansion and such) and I found direct PDF generation a bit tricky, but it works once you find the right driver.</p>
      <p>However, there is an easy way of getting Minion Pro in LaTeX, namely using the <a href="http://www.ctan.org/tex-archive/fonts/minionpro/">MinionPro</a> package (project home page is <a href="http://developer.berlios.de/projects/minionpro">here</a>). The installation is pretty simple and really fast since they have already extracted the metrics (which in the case of Optical sizes take an eternity). The package also allows easy switching between different figures, see the <a href="http://www.ctan.org/tex-archive/fonts/minionpro/MinionPro.pdf">documentation</a>.</p>
      <p>In fact, there is a <code>loosequotes</code> option, which adds 0.03 em around every single and double quote. However, I'm a bit reluctant to use it since I'm quite happy with the spacing in for example <em>f's</em> (= <code>f's</code>), and I want to disturb the original font design as little as possible.</p>
      <p>If you don't already have a working LaTeX installation, I'd recommend trying <a href="http://www.tug.org/texlive/">TeX Live</a>. Using the live-DVD you only have to install a small number of files (all in one single directory), the rest is accessed from a mounted DVD image.</p>
