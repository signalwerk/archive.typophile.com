      <p>Michel Boyer: Thanks for pointing out the defect in the LaTeX package, I had simply assumed that the package was correct in using the same metric for all font versions.</p>
      <p>I too have reverted to using the source package. I'd be a bit wary of the <code>--kern</code> switch (on by default) though, according to the README it will "add some missing kerning pairs". This is a bad idea if the designer felt the unkerned pair looked best, but more seriously they appear to overwrite some of Adobe's kerning. (I only checked Regular: <code>T adieresis</code>, <code>V adieresis</code>, <code>W adieresis</code>, <code>Y t</code> and <code>f egrave</code> appear to be different, at least in my version.)</p>
      <p>I haven't decided if I should use the additional/changed kerning provided by the package, but to "fix" the <em>'d</em>-kerning, I decided to add some space between the two (the easiest way is probably to add <code>--ligkern 'quoteright {desired-kerning} d'</code> to the definition of <code>extra_flags</code> in <code>scripts/maketfm</code>, or alternatively -- if <code>--kern</code> is used -- by using a <code>% LIGKERN quoteright {desired-kerning} d</code> line to the suitable <code>kerning/fontname.kern</code> file.)</p>
