      <p>I just took the time to look more closely at what is happening with LaTeX and which left me quite puzzled. Here is what I found.  When we install the MinionPro package, we download the same TeX virtual fonts, independently of the version of the otf font being used.  That means that, so far as I understand, the close tracking I got when I last tested with the MinionPro package had nothing to do with the version of the otf font I installed. If we apply vftovp for instance to the file MinionPro-Regular-lf-t1.vf, we can see that the virtual font kerns  a "d" by -0.138  after a quoteright (coded as octal 47). Many other vf files contain that kerning pair, to take care of the various package options. That means that the kerning corresponds to version 002.000 (see picture above), even if I installed version 001.000.</p>
      <p>Michel</p>
