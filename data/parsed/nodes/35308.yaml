    html: <p>@nelpod. The switch <code>--kern</code> overrites Adobe's kerns. I just added a <code>% LIGKERN quoteright {-85} d</code> (to try) in the file <code>Regular.kern</code>, applied <code>vftovp</code> to <code>MinionPro-Regular-lf-t1.vf</code> and saw in the output that the kern was indeed -0.085. It is still unclear to me why that kerning pair has changed so much from the type1 version to the last otf version and I'd like to know. For the moment, I am just experimenting.</p>
