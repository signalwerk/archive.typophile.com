      <p>I'm a great admirer of Slimbach, but I agree that his kerning of both apostrophes and quotes is much too tight. </p>
      <p>To me, the kerning in the apostrophe ideally would be between your Slimbach and the 'Optical' examples. The second Latex example is in the middle of the space, which looks right, but personally I'd like a little more space. </p>
      <p>My feeling is that the apostrophes should ideally be tighter than quotes. I'm going to have to deal with the soon in my font, but I don't know the best way to do it. I'd be interested in others' views. </p>
      <p>Right now I'm inclining to the view that one space around the right single quote should be able to serve both as a quote and an apostrophe, without a huge amount of kerning. After all, that's how they did it with metal type, and it worked well enough. </p>
      <p>In 'Letters of Credit', Tracy recommends a little more space after the opening quotes than before closing quotes. This tightness would also serve to keep the apostrophe not too loose.</p>
