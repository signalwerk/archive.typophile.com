      <p>I took a look for the fun of it. In the Minion Type 1 MM, the "quoteright" - "d" had a kern of -75 units. In my version of MininPro (Opticals, 05/08/2005) the kern is -105 units -- because of the class it is in. BTW, when I used Minion as a Type 1 font, I had changed the kern to -45 units.</p>
      <p>Even worse is the kern against the "e", as in "e" "quoteright".</p>
      <p>I doubt this is Slimbach's doing -- he may have had a say in the kerning of the original Type 1 fonts, but it is probably some lesser minion doing the class-based kerning now.</p>
      <p>For the fun of it, try setting the string "A" "quoteright" "comma" in Warnock Pro. The kerning is so tight that even though a "quoteright" intervenes, the "comma" runs into the "A"</p>
      <p>I'm almost to the point where I am going to throw out all the kerning in some of these Adobe fonts &amp; start over -- even though it would be weeks of work if you cover the full character complement. Sigh.</p>
