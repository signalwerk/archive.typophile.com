    votes: null
    html: "<p>gustavo, <br> <br>elementar is indeed a fine pixel font family, and i'm glad to have your feedback. <br> <br>i hadn't realized that elementar was such an expansive family. reason: i'd never clicked on the drop down menu for elementar at uf.com before. i see what you mean about the width variation. <br> <br>one thing about elementar that illustrates a point i've long held in my mind, while i doggedly persued traditional pixel font designs rather than jumping on the grays right away like many others, is the issue of uniqueness. <br> <br>before any misunderstanding may flare up, i do not mean to imply that elemntar lacks a unique design. i do have a family of fonts, of which one is available commercially right now, called \"nerve\". nerve and elementar (and others available around the web) share the same basic geometries. their individual styles, in my opinion, at least in the old pixel design world, were held largely in the use of individual character nuance, and methods of showing curvature. <br> <br>now, with the opportunity to fill those angular nuances, once blank pixels, with grays, it becomes much more difficult to upgrade one's own unique character sets without becoming derivative of other (previously published) gray offerings. <br> <br>i have a few strategies in mind, but the point is, for a lot of old-style one-pixel-wide designs, it seems the name of the game is to be the first one to upgrade his/her designs. <br> <br>has this development crossed your mind, and if so, what are your thoughts?</p>"
