  html: <p>trying to figure out how to use grays in pixel fonts here. these two families are designed to use black and three grays. i don't know if that's too many grays or not. <br> <br>one thing i've noticed in working with the grays is that it is much easier to develop extended familes of fonts than when working without the grays. perhaps because the grays make nuance much more attainable within each character set. <br> <br>the following are works in progress. any feedback is welcome. <br> <br><img src="http://www.typophile.com/forums/messages/29/50468.gif" alt=""> <br> <br><img src="http://www.typophile.com/forums/messages/29/50469.gif" alt=""></p>
