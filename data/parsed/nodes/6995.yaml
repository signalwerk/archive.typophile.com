    html: "<p>Elementar is a serious solution for typographic control in a very broad x,y range. Few people yet appreciate how to tap into it. I am proud to carry some of the family through Ultrafonts, but it's true, our design does not sell it well at all.  <br> <br>I particularly like the 6-point-capital Gustavo uses in red. That size is the same I attempted to answer with Halogen (on sale at FFF) and Miguel with Sugar (on sale at uf) but of course the feel is always different. <br> <br>As Tyler says, typographers will continue to crash into each other at the lower pixel scales. The gray dimension increases freedom somewhat. It may be time for extremely grayscale fonts. <br> <br>this looks like a good place for an announcement: <br>Ultrafonts officially will not pursue a patent on the \"Gray-Cell\" technology, concerning subpixel forms in TrueType pixelfonts. <br> <br>Why: The PC audio program \"Fruity Loops\" shipped product in 2001 including pixelfonts with subpixel \"knuckles\", developed by the UI designer and the founder, in pursuit of a beautiful GUI. They approached us kindly last week with examples and fonts. As a result we are back to building tools and working with developers instead of time consuming/annoying/costly patent work. <br> <br>This means you will have a choice of conversions, tools, and escalating possibilities. We intend to obliterate the distance between a typographer and the technical deployment and monetization of their ideas. We now do graphic-to-UPF conversion for type shops, individual developers and students, so fonts converted by the Ultrafonts converter, can be sold on Ultrafonts, or elsewhere. No licensing is required. <br> <br>Sorry for hijacking the forum, I will now cut-off my own microphone. <br> <br>-chris [Ultrafonts]</p>"
