    html: <p>Hrant, as always, you give careful, valuable feedback. <br> <br>i'd like to learn more about your method of grayspacing. it sounds interesting, regardless of how grays have impacted it. <br> <br>mana 16 was in fact, the one pixel font that opened my eyes to the extended family possibilities in pixel fonts. granted, craig kroeger (i'm a fan of his) has been systematically adding to his main families by point sizes--something i intend to do with these familes as well as others. however, mana 16 really impressed me with how well the bold version married the regular version. i'd never liked the way bold pixel fonts fit together with their regular weighted counterparts, and had been following a policy of developing single member families (aside from point size variations), and trying to make them as unique as possible by taking advantage of the physical differences between them. <br> <br>the grays, as mana illustrates, make this problem obselete, in my opinion. <br> <br>i am indeed on a mac, and will take your advice and view the files on a pc, although i'm not sure how to design them to look better on the pc. i simply picked my grays from the web safe palatte. <br> <br>i will also make the ascenders taller. i was wrestling with wheter or not to do that, actually. i think i err on the short side, as many of my designs feature stubby ascenders and decenders. <br> <br>thanks for your feedback on the unicase too, david. i like it too. it's the one with the most fun. i'll have to take hrant's tip and try to rework the khaki family with the darkest gray to remove some of the soft stuff, and tighten everything up. <br> <br>it is a lot of work, but it's fun!</p>
