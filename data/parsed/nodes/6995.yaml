    html: "<p>tyler, <br> <br>the 'expansive' features of the Elementar family are indeed  <br>hidden in the font-menu of the ultrafonts.com website - i  <br>hope to have this corrected in the future. <br> <br>i don't know if i got your point about uniqueness... for me,  <br>the uniqueness of the Elementar B family is its flexibility in  <br>comparison to other pixel fonts - although there are other  <br>bitmap fonts with multiple width variations, they are all 1- <br>bit only and were released after Elementar (afaik). <br> <br>the 'squariness' of Elementar B is what gives it its flexibility  <br>and identity through the different widths, weights and  <br>sizes. (the complete family was designed in the sizes 5, 7,  <br>9, 11, 13, 15 and 17 px, which shall be soon available at  <br>ultrafonts.com.) <br> <br>a more legible version called Elementar H, still in progress,  <br>is not so 'squary' and has diagonal strokes in characters  <br>such as v, w, k, y. the Elementar H family is more legible in  <br>larger text settings, but does not offer as many width  <br>variations as Elementar B. <br> <br>here is an image for comparison: <br> <br><img src=\"http://www.typophile.com/forums/messages/29/50846.gif\" alt=\"comparison between Elementar B and H\"> <br> <br>best, <br>- gustavo.</p>"
