fewer grays. <br> <br>And this unique 3-way balance is actually how grayscale font design is so different than either outline or b&amp;w bitmapfont design. It brings in the subtlety of outline design directly to the screen, where it can -and has to- be evaluated dynamically, not after printing samples on a lino. This makes it a much less iterative, a much more immersive, activity. The level of concentration required (a level that even outline type design doesn't attain) to produce results that really use the medium (as opposed to slapping on grays at the corners of an existing b&amp;w bitmapfont) is exhausting. <br> <br>hhp</p>"
