    html: "<p>Hey Tyler. Nice to see you get into grayscape. <br> <br>Number of grays: three is a good number. It's sort of the minimum, although the gain from using more isn't huge, and using more does create more brain strain. One very interesting thing about choosing the number of grays is how strongly it can actually affect the forms! When I made the first version of Mana-16 two grays is all I wanted to use, since I wanted to limit the bit depth per pixel to 2 (to save memory in a \"true\" bitmap format). Coupled to ideal spacing requirements (involving a strategy I call grayspacing) it resulted in diagonal lc letters (like the \"v\") becoming bowed. When the pixelfont aspect of grayscale design kicked in however, the depth issue disappeared, so I went to three grays... which actually resulted in being able to straighten the diagonals! It made Mana more conventional (or maybe less unconventional). <br> <br>But the grays you're using are slightly dark I think. Are you on Mac? That causes one to err on the side of blurriness, whereas working on Windows causes one to err on the side of aliasing (which isn't as bad). Before you go to far, test on the platform 90% of people use. <br> <br>Or maybe it's the way you're using the grays; Commerce is much tighter than Khaki. The latter also exhibits some bad strategy, like having solid lines of gray in the \"E\". Black should be your main color, otherwise blur becomes too strong. I certainly know it's tempting to rely on grays as much as possible, but the practical limits dictate a more conservative approach; you simply have to settle for <i>some</i> aliasing. Also: it seems you're not using your darkest shade to full effect; don't underestimate its bending power! <br> <br>One more thing: I'd make the ascenders (in both designs) one pixel taller. <br> <br>&gt; it is much easier to develop extended families of fonts <br> <br>Well, it's much easier to <i>arrive</i> at such, but it's also a lot more work! <br>The possibilities are enriching, but also challenging. <br> <br>hhp</p>"
