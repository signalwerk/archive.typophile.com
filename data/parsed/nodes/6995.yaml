    html: "<p>Thanks for the compliments. <br> <br>&gt; grayspacing <br> <br>Basically it's how you use grays to push the lateral profiles slightly to the left or right to get more even color, and how you can allow two glyphs to touch without creating a distracting blotch. <br> <br>&gt; how well the bold version married the regular version. <br> <br>One interesting thing in Mana is how the gray strategy is different between the Regular and Bold, but this actually makes them harmonize on a deeper level. There's more than one reason for the different strategy, but basically it's due to the two weights requiring a different balance between fidelity, even color and crispness (see below). It's very interesting how the weight of the font affects the way in which grays are optimally used. <br> <br>&gt; i'm not sure how to design them to look better on the pc. <br>&gt; i simply picked my grays from the web safe palatte. <br> <br>If you have no easy access to Windows what you could do is take a small group of letters that represent different structures (like \"h\", \"v\", \"e\", etc.) and test those once on a PC* to see how they should be balanced, then work from there on your Mac. <br> <br>* An easy way is to put up some web images and check them from a public internet terminal. I do that at the local Mac store every time I [have to] go to the mall.  :-) <br> <br>Another way to work might be to (temporarily) change the gamma on your Mac, assuming there's a utility (or something in the OS?) that can do that. FYI, the difference in nominal gamma is 2.2 for Windows versus 1.8 for Mac. <br> <br>&gt; what about glyph consistency? <br> <br>I remember what abruptly hit me about halfway into making Mana-16 was that there are three things that have to be balanced: fidelity (to the \"intended\" overall design), avoiding fuzziness (which limits the grays) and even color among the glyphs. The third factor is particularly hard to get an unwavering grip on, especially when you use fewer grays. <br> <br>And this unique 3-way balance is actually how grayscale font design is so different than either outline or b&amp;w bitmapfont design. It brings in the subtlety of outline design directly to the screen, where it can -and has to- be evaluated dynamically, not after printing samples on a lino. This makes it a much less iterative, a much more immersive, activity. The level of concentration required (a level that even outline type design doesn't attain) to produce results that really use the medium (as opposed to slapping on grays at the corners of an existing b&amp;w bitmapfont) is exhausting. <br> <br>hhp</p>"
