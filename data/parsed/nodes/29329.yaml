    <p>Mårten Thavenius is a <a href="/wiki/Sweden" class="freelinking" rel="nofollow">Swedish</a> type designer. This far, he has released Rattlescript, Aptifer Slab and Aptifer Sans, and Skilt Gothic.</p>
    <p>Mårten Thavenius is a GUI Architecht at IBM.</p>
    <p>He runs the type foundry <a href="/wiki/Fontcaster" class="freelinking" rel="nofollow">Fontcaster</a>.</p>
