    <div class="info">Submitted by <a href="/user/1049" title="View user profile.">Sii Daniels</a> : 7.Jan.2005 2.06pm </div>
      <p>hyphen <br>a typographic forum <br> <br>42 polemi street <br>542 48 thessaloniki <br>greece <br>T +30 2310 322.031 <br>F +30 2310 322.251 <br>E <a href="mailto:info@altervision.gr">info@altervision.gr</a>  <br> <br> <br>Call for papers <br> <br>Hyphen welcomes papers on typography and graphic communication and contributions at the meeting places between typography and other disciplines. <br> <br>Ten issues have been published since 1998 and the journal now appears on a yearly basis. <br> <br>The 2005 volume will be printed in July. <br> <br>The editor will be accepting contributions till the end of April and endeavours to acknowledge receipt within fifteen days after the contribution has arrived. <br> <br>On acceptance, the editor will ask contributors to supply their work as a word-processed file. <br> <br>Illustrative matter accompanying the text should be in an acceptable form to allow for the best possible reproduction. <br> <br>Proofs are sent to contributors about two months before publication. Contributors receive without charge three copies of the relevant volume.  <br> <br> <br>For more info please contact  <br> <br>Klimis Mastoridis <br>po box 503 66 <br>540 13 thessaloniki <br>greece <br><a href="mailto:klimis@altervision.gr">klimis@altervision.gr</a> <br><a href="mailto:klimis@uom.gr">klimis@uom.gr</a></p>
