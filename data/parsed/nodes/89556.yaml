      <p>Of all those you present I like #3 the most. But I would change a few things:</p>
      <p>1. Position the symbol so the square inter-space would align with the vertical delimiter in logo text<br>
      2. Align B to the right of the square so it connects with CP</p>
      <p>But I also have a suggestion. Why don't you try doing something in Mondrian's way... The Broadway Boogie Woogie...</p>
