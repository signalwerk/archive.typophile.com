    html: |-
      <p>The alts do appear in the character map for Letraset's Premier, still available for sale on MyFonts.</p>
      <p><a href="http://new.myfonts.com/fonts/letraset/premier/lightline/characters.html" title="http://new.myfonts.com/fonts/letraset/premier/lightline/characters.html">http://new.myfonts.com/fonts/letraset/premier/lightline/characters.html</a></p>
      <p>I imagine that the GatsbyFLF that Mike has linked to is the same one that Steve has been given.</p>
      <p>Another quick point - looking at the weight of the sample above, closer still would be the Premier Shaded variant, with the shading removed. However, the Letraset Premier Shaded contains the "R" and "A" alts in place of the standard characters, but does not contain the lower-set "A" or alternate "S". Give with one hand, take with the other.</p>
