    <p>I'm working on a family with Text and Display optical sizes and trying to decide on the best way to handle the family naming. I've been debating between three scenarios, which I've attempted to illustrate below. Does anyone have any thoughts, preferences, or general feedback? I'm leaning strongly toward Option 1, but I wanted to see what other people thought. </p>
    <p>-<br>
    Option 1 : Separate families for each size </p>
    <p>Font Family Text<br>
    • Light<br>
    • Light Italic<br>
    • Regular<br>
    • Regular Italic<br>
    • Semibold<br>
    • Semibold Italic<br>
    • Bold<br>
    • Bold Italic </p>
    <p>Font Family Display<br>
    • Light<br>
    • Light Italic<br>
    • Regular<br>
    • Regular Italic<br>
    • Semibold<br>
    • Semibold Italic<br>
    • Bold<br>
    • Bold Italic </p>
    <p>This is fairly common, probably even the standard way to do it. Everything is nicely organized and easy to manage. The downside is that switching between families is a two step process (change family, select style) and can get annoying. </p>
    <p>-<br>
    OPTION 2 - One family with styles ordered: Weight -Size-Italic </p>
    <p>Font Family<br>
    • Light Text<br>
    • Light Text Italic<br>
    • Light Display<br>
    • Light Display Italic<br>
    • Regular Text<br>
    • Regular Text Italic<br>
    • Regular Display<br>
    • Regular Display Italic<br>
    • Semibold Text<br>
    • Semibold Text Italic<br>
    • Semibold Display<br>
    • Semibold Display Italic<br>
    • Bold Text<br>
    • Bold Text Italic<br>
    • Bold Display<br>
    • Bold Display Italic </p>
    <p>I've seen this option used a few times as well. It's is easier and faster to use in font menus (just change the style) but it's a little messy. I also dislike how it hides the distinction between text and display. </p>
    <p>-<br>
    OPTION 3 - One family with styles ordered: Size-Weight-Italic... but tricked to be grouped by Size</p>
    <p>Font Family<br>
    • Display Light<br>
    • Display Light Italic<br>
    • Display Regular<br>
    • Display Regular Italic<br>
    • Display Semibold<br>
    • Display Semibold Italic<br>
    • Display Bold<br>
    • Display Bold Italic<br>
    • Text Light<br>
    • Text Light Italic<br>
    • Text Regular<br>
    • Text Regular Italic<br>
    • Text Semibold<br>
    • Text Semibold Italic<br>
    • Text Bold<br>
    • Text Bold Italic </p>
    <p>I've never actually seen this method used. It requires a little backend weight number fudging, are there any serious problems with this bit of trickery? </p>
    <p>One of the benefits to this method would be that I could add "Agate" and "Deck" sizes in there and have them appear in the correct size order. Option 1 only works alphabetically. </p>
    <p>-<br>
    Thanks.</p>
