    html: |-
      <p>Option 1! As Kent already said, you only have to select the complete text and pick up the other family from the font family menu in Indesign. Option 3 is also nice, if you, as Andreas said, abbreviate Display and Text, although I would prefer to have the text styles first in the list (You maybe can do that by faking the width classes in the fonts, but I am not sure, if Indesign also uses the width classes by building the order.):</p>
      <p>• D Light<br>
      • D Light Italic<br>
      • D Regular<br>
      • D Regular Italic<br>
      • D Semibold<br>
      • D Semibold Italic<br>
      • D Bold<br>
      • D Bold Italic<br>
      • T Light<br>
      • T Light Italic<br>
      • T Regular<br>
      • T Regular Italic<br>
      • T Semibold<br>
      • T Semibold Italic<br>
      • T Bold<br>
      • T Bold Italic</p>
      <p>Yes, that it is much clearer. You also could abbreviate Italic to Ita. ("Italic" was a keyword in Indesign and in case of Type 1, as far as I remember, even parts of the string "Italic" like "Ita". Again, as far as I remember. In other words, Indesign made the order with the help of that keyword. Or was it OpenType? I only remember, that it was a keyword and that there was a difference in the order, when I changed the name to "kursiv" for example.) Alternatively to the weight names, you also could use numbers.</p>
      <p>• D 1<br>
      • D 1 Ita<br>
      • D 2<br>
      • D 2 Ita<br>
      • D 3<br>
      • D 3 Ita<br>
      • D 4<br>
      • D 4 Ita<br>
      • T 1<br>
      • T 1 Ita<br>
      • T 2<br>
      • T 2 Ita<br>
      • T 3<br>
      • T 3 Ita<br>
      • T 4<br>
      • T 4 Ita</p>
      <p>(I would not use the weight class numbers 100–1000 for the names, because of potential trouble with style linking, when they are chosen correctly and irritations for the user of the menu, if they are not chosen correctly.)</p>
      <p>Option 2 is very irritating.</p>
      <p>---------------</p>
      <p>This also would work, because Indesign makes a difference between small and capital letters:</p>
      <p>• t Light<br>
      • t Light Italic<br>
      • t Regular<br>
      • t Regular Italic<br>
      • t Semibold<br>
      • t Semibold Italic<br>
      • t Bold<br>
      • t Bold Italic<br>
      • D Light<br>
      • D Light Italic<br>
      • D Regular<br>
      • D Regular Italic<br>
      • D Semibold<br>
      • D Semibold Italic<br>
      • D Bold<br>
      • D Bold Italic</p>
