    html: |-
      <p><cite> &gt; The downside is that switching between families is a two step process (change family, select style) and can get annoying</cite></p>
      <p>I guess this depends upon what software you’re talking about and what work habits one has.</p>
      <p>If weights and styles are named &amp; numbered in a proper and completely parallel fashion, then in InDesign you can change just the Family (if you’re working from the control bar or character palette) and it will match the style. Same in Photoshop.</p>
      <p>If you’re working from InDesign’s Type &gt; Font menu, then selecting the Family alone won’t do anything, true. You have to select the Family and slide out the flyout to the style. But that’s not really a two-step process. If that’s your work habit, then you have to do the same motion to change the Style anyway.</p>
      <p>AFAIK, Quark doesn’t distinguish Family from Style, so you have to change both at once anyway, and again, it’s not really a two-step process. </p>
      <p>Not sure what problem you’re trying to solve.</p>
      <p>Option 3 is clever, but I side more with Nick Shinn. With a list that long, I might just focus on the first set of sizes and not realize that there’s a whole ’nother set that starts over again.</p>
