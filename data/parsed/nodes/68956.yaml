      <p>I can't comment authoritatively on the technical implications, but from a usability point of view I like option 3. If the family grew to monumental proportions, it might be easier to go with option 1, but with the style list you have I vote for option 3.</p>
      <p>On a related topic, I've always wondered if Adobe will ever implement something where stylistic sets can be given custom names that will be visible to users from their app menus. That way you could get aggro with consolidation and just have all your optical sizes built in to one base set of fonts.</p>
