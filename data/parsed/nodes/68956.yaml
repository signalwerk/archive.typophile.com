      <p>Thanks for you insight, Kent. I'm not trying to solve a specific problem, just thinking through the best way to set things up. I've all but decided to go with Option 1.</p>
      <p>I'm surprised no one mentioned Option 2, which is very close to what Adobe uses in their Pro fonts. They do one family with a weight-size-italic style but follow OpenType naming specs and drop "Regular". It seems to get overwhelming very fast, I would need a taller monitor to select something in Minion Pro. </p>
      <p>Font Family<br>
      • Light Display<br>
      • Light Text<br>
      • Light Italic Display<br>
      • Light Italic Text<br>
      • Display<br>
      • Text<br>
      • Italic Display<br>
      • Italic Text<br>
      • Semibold Display<br>
      • Semibold Text<br>
      • Semibold Italic Display<br>
      • Semibold Italic Text<br>
      • Bold Display<br>
      • Bold Text<br>
      • Bold Italic Display<br>
      • Bold Italic Text</p>
