    html: <p><i>&gt;Do you mind if I insert (AND UNITIZING) and see if it meets with your approval.</i> <br> <br>Gerald -- <br> <br>Actually, I do not agree, in this instance. I think you are misinterpreting Mike's reference to TTS. The development of TTS machines led to the introduction of unitizing systems within the Linotype line, but these units were not subsequently applied to all projects. TTS was used only (or at least predominantly) in the transmission and setting of newspaper copy. TTS units would only have been used on faces intended for newspaper composition. <br> <br>This is my understanding, but you might double-check with Mike. I don't have his new number since he moved. <br> <br>Now, news faces were the large bulk of Linotype's bread and butter in the late 1950s and 1960s, as newspaper comp was the last bastion of Lino's market. (Mike has said that Jackson Burke lamented that most of his tenure at the head of the MLCo. type department was spent forever revising faces for ever-narrowing newspaper columns.)  <br> <br>But it was not the entirety of Lino's type output. Sabon would have been targeted toward the book composition market, and those houses would not have had TTS machines nor any need to conform to TTS standards. So I do not think it is reasonable to assume that Sabon needed to be designed to any unitized system on account of Linotype composition.  <br> <br>Sabon would have been developed while Mike was at the helm of the American MLCo. type dept., I believe. The face was cut by Stempel (who were essentially German Linotype), but Mike might have some direct recollections. You could ask him. <br> <br>Hrant --  <br> <br>I do not know which size this digital Sabon (Adobe's BTW) would have been based upon. I would presume the 12 point, based on what I know of the general transition of designs from metal to photo to digital. But I can only assume.  <br> <br>You may be right and the decision about which unit width to assign the 'a' to could have varied by size -- wider for the smaller sizes, narrower for display. On the other hand, I doubt that Tschichold would have made a different decision. Just a practical matter. Text would have been set primarily by machine comp; display would usually have been set by hand, I imagine. So all of the Lino and Mono sizes would probably all have the same wide 'a'. I suppose that the foundry display sizes could have been cut without these restrictions, but I don't know. I don't have information about what sizes were released in each medium. <br> <br>Clearly, you would have made a different decision under the same circumstances -- sacrificing the italic 'a'. Tschichold made the other decision.  <br> <br>Obviously, Sabon was ripe for revision in digital without all the constraints, as aptly demonstrated by Jean-Fran</p>
