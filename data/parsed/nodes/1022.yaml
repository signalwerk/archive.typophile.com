    html: "<p>Hmmm... <br>I'm not sure exactly what's going on. Let me show you what I have, and maybe we can figure things out. <br> <br>First of all, though: You're right, some of what I said is pretty tentative - I'm sorry if I jumped the gun. And some of my [provisional] conclusions are guided by what may be called \"quasi-scientific hunches\". I'll try to explain that bit as I go along. <br> <br>-- <br> <br>My intentions in this process are to arrive at guidelines for digital type designers wishing to make different cuts of a given design optimized for different sizes. So what I'm looking for is the set of deviations from some \"deliberative ideal\" that needs to be applied to a given size. The deviations are in width, color, letterspacing, vertical proportions and a bunch of other things. In my (still-ongoing) ATF Garamond analysis I'm measuring 10 parameters, but all in relation to the largest size I have at hand, the 48. This means that my values are scalar. Below is some of the data, for lc alphabet width: <br> <br> 6: 241 <br> 7: 225 <br> 8: 215 <br>10: 196 <br>12: 185 <br>14: 177 <br>18: 179 <br>24: 173 <br>30: 170 <br>36: 168 <br>48: 166 <br> <br>And here's what it looks like: <br> <br><img src=\"http://www.typophile.com/forums/messages/4100/15332.gif\" alt=\"ATF-G_length.gif\"> <br> <br>Some observations: <br>- There are two parts: 6-14, and 18-48. <br>- However, the 14 is suspicious (see below), so the cutoff might in fact be between 12/14 instead. <br>- The smaller-size section is not linear, it's curved. I'm not sure it's <i>quadratic</i>* as opposed to cubic or something else (and the data is probably too sparse and jumpy to ever know), but I gravitate to that because of three things: the next heuristically logical step after linear is quadratic; type is two-dimensional; and Luc[as] de Groot has found that weight gradation proceeds quadratically with respect to the horizontal scale. <br>- The larger-size section looks mostly linear. <br> <br>* I'm now using this instead of \"parabolic\". <br> <br>One big caveat: unlike the Centaur and Falcon specimens, my ATF Garamond stuff is \"unofficial\": Mr Benton wasn't there to assure me that each size of what I used is the real stuff. Of the 11 sizes I used, two of them look suspicious: the 14, which is somewhat too narrow; and the 7, which is obviously too light. I'm tempted to pull those out of my study, but there are some good reasons not to, and instead just give this caveat as needed. <br> <br>The other nine parameters I've studied even less, but the ones dealing with width seem to behave in exactly the same way as above, while: <br>- Vertical proportions also largely seem to follow the quadratic+linear combination. <br>- Weight seems to be one single quadratic curve. <br>- Stroke contrast looks... hard to describe right now. <br> <br>To be fair, I guess if you applied this technique to Falcon you'd get the same non-linear behavior! And as you say, your Falcon data (which was indeed my source) only spans the text sizes. <br> <br>So yes, it's too early to say with all confidence that ATF was better than Linotype at optical scaling. <i>On the other hand</i>, I've seen a body of anecdotal evidence (as well as just plain tangential observations) that seem to indicate that the Bentons were in fact on another level. I've revealed these to you in private recently, but if people here are interested I'll try to collect my thoughts enough for public delivery. <br> <br>-- <br> <br>BTW: <br>&gt; the face on the body in any given design is practically guaranteed to be linear by point size. <br> <br>I've found that this is not always the case. <br> <br>hhp <br></p>"
    html_clean: "<p>Hmmm... <br>I'm not sure exactly what's going on. Let me show you what I have, and maybe we can figure things out. <br> <br>First of all, though: You're right, some of what I said is pretty tentative - I'm sorry if I jumped the gun. And some of my [provisional] conclusions are guided by what may be called \"quasi-scientific hunches\". I'll try to explain that bit as I go along. <br> <br>-- <br> <br>My intentions in this process are to arrive at guidelines for digital type designers wishing to make different cuts of a given design optimized for different sizes. So what I'm looking for is the set of deviations from some \"deliberative ideal\" that needs to be applied to a given size. The deviations are in width, color, letterspacing, vertical proportions and a bunch of other things. In my (still-ongoing) ATF Garamond analysis I'm measuring 10 parameters, but all in relation to the largest size I have at hand, the 48. This means that my values are scalar. Below is some of the data, for lc alphabet width: <br> <br> 6: 241 <br> 7: 225 <br> 8: 215 <br>10: 196 <br>12: 185 <br>14: 177 <br>18: 179 <br>24: 173 <br>30: 170 <br>36: 168 <br>48: 166 <br> <br>And here's what it looks like: <br> <br><img src=\"http://www.typophile.com/forums/messages/4100/15332.gif\" alt=\"ATF-G_length.gif\"> <br> <br>Some observations: <br>- There are two parts: 6-14, and 18-48. <br>- However, the 14 is suspicious (see below), so the cutoff might in fact be between 12/14 instead. <br>- The smaller-size section is not linear, it's curved. I'm not sure it's <i>quadratic</i>* as opposed to cubic or something else (and the data is probably too sparse and jumpy to ever know), but I gravitate to that because of three things: the next heuristically logical step after linear is quadratic; type is two-dimensional; and Luc[as] de Groot has found that weight gradation proceeds quadratically with respect to the horizontal scale. <br>- The larger-size section looks mostly linear. <br> <br>* I'm now using this instead of \"parabolic\". <br> <br>One big caveat: unlike the Centaur and Falcon specimens, my ATF Garamond stuff is \"unofficial\": Mr Benton wasn't there to assure me that each size of what I used is the real stuff. Of the 11 sizes I used, two of them look suspicious: the 14, which is somewhat too narrow; and the 7, which is obviously too light. I'm tempted to pull those out of my study, but there are some good reasons not to, and instead just give this caveat as needed. <br> <br>The other nine parameters I've studied even less, but the ones dealing with width seem to behave in exactly the same way as above, while: <br>- Vertical proportions also largely seem to follow the quadratic+linear combination. <br>- Weight seems to be one single quadratic curve. <br>- Stroke contrast looks... hard to describe right now. <br> <br>To be fair, I guess if you applied this technique to Falcon you'd get the same non-linear behavior! And as you say, your Falcon data (which was indeed my source) only spans the text sizes. <br> <br>So yes, it's too early to say with all confidence that ATF was better than Linotype at optical scaling. <i>On the other hand</i>, I've seen a body of anecdotal evidence (as well as just plain tangential observations) that seem to indicate that the Bentons were in fact on another level. I've revealed these to you in private recently, but if people here are interested I'll try to collect my thoughts enough for public delivery. <br> <br>-- <br> <br>BTW: <br>&gt; the face on the body in any given design is practically guaranteed to be linear by point size. <br> <br>I've found that this is not always the case. <br> <br>hhp <br></p>"
