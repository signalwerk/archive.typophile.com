    html: "<p>Hmm. I'd like to be able to follow you here, but you lost me with your data. Can you describe how you arrived at those numbers -- give them units or relate them to something known or measureable? I can't figure what those numbers represent, so I can't assess the curve. <br> <br>I think the Bentons were possibly on another level with regard to optical compensation. But it's hard to separate that aspect from the other aspects that differentiate foundry from linecasting.  <br> <br><i>&gt;&gt; the face on the body in any given design is practically guaranteed to be linear by point size.  <br> <br>&gt;I've found that this is not always the case. </i> <br> <br>Well, then we can measure this parameter too, if you think it's important. <br> <br>I derived some formulae from my graphs. The interesting thing is that the ATF Garamond is pretty linear from 6 to 14, but from 14 to 48 is not -- *unless* you take out the 14. From 18 to 48 is strictly linear. <br> <br>In the following, y is lowercase alphabet length in points, x is nominal point size. <br> <br>ATF Garamond, text sizes [6-14]: y = 7.6875 (x + 5.252) <br>ATF Garamond, display sizes [18-48]: y = 9.5 (x + 2.2105) <br>Falcon, text sizes: y = 8.5 (x + 4.588) <br> <br>These are descriptive rather than prescriptive, so I'm sure they won't help you. But they do describe linear relationships. It is interesting to see just how accurately the results for y conform to the data measured. ATF Garamond 8 point is the only real outlier. <br> <br>When I have a better idea what you're doing, I'll have a better idea how what I'm doing compares. <br> <br>-- Kent. <br> <br> <br></p>"
