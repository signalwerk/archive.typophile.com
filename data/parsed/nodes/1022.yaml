    html: "<p>&gt; Goudy ... found it a long and difficult task <br> <br>And isn't it true that Goudy wasn't... uh... the sharpest tool in the shed when it came to technical stuff? <br> <br>&gt; jumbo Monotype speciman books <br> <br>BTW, I've seen the landmark specimen books for ATF and Linotype, but -besides the \"Tally of Types\" thing- nothing for Monotype. What are some dates for those, and which is the \"best\" one? For one thing, I'd like to see how [well] they did their optical scaling. <br> <br>&gt; .... the racetrack promoter .... <br> <br>Great memories! <br> <br>&gt; What I suggest is that with Linotype and <br>&gt; Monotype the unit system did not cause <br>&gt; any typeface to be a failure because <br>&gt; of the restrictions of width. <br> <br>What constitutes a \"failed typeface\"? <br> <br>&gt; I am ignorant of the Sabon a too-wide problem <br> <br>It's interesting how some people (like me) would consider knowing about the \"textbook\" Sabon case central to good type appreciation, while others may not. Obviously, you're living proof that you don't have to know about Sabon (or that \"class\" of insight in general) to do great work. But still. <br> <br>-- <br> <br>&gt; I think I may have heard that some members <br>&gt; of ATF continued to operate semi-independently <br> <br>Some tibdits from the 1981 book: <br>- The American Point System was adopted in 1886. <br>- ATF was formed in 1892. <br>- First collective specimen book (with no mention of ATF) was in 1893. <br>- First formal ATF specimen book: 1895. <br>- ATF consolidates its manufacturing facilities in 1903. <br> <br>So Updike's \"1894\" is about a year before ATF used its own name in any specimen, and about 9 years before ATF made all its fonts in one place. <br> <br>&gt; I do not think that .... <br> <br>But you do think that foundry was superior to both? <br>I mean in terms of type design integrity. <br> <br>What did JvK think? <br> <br>hhp <br></p>"
