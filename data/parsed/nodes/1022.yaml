    html: <p>Good morning from Finland, <br> <br>Kent, <br> <br>I thought my special efforts to have Mike Parker speak of the matter was appropriate, and as such did not muddy waters. Perhaps Jim Rimmer just missed the posting. I have included extra text of Parker's words which I feel may give "weight". Therefore more memorable. <br> <br>E-mail excerpt sent to Gerald Giampa about Linotype units by Mike Parker, these are his words. <br> <br>..... <br>The typefaces redrawn for teletypesetter use were a TINY group of popular newstext and classified designs, and NOTHING ELSE.  <br> <br>However, since Fairchild monkeyed with the standard ratio of set size to column width every few years, this small group of typefaces had to be redrawn over and over again just to maintain simple legibility on the current standard.  <br>  <br>TTS was a black curse to all designers of linecaster newstext and classified typefaces from 1940s to 1980s.  <br>  <br>While this group of types made up a tiny section of the library  of fonts, it made up a majority of matrices sold to constantly feed batteries of roaring teletypesetter high speed text machines smashing matrices together at speeds undreamt of by Ottmar Mergenthaler. They ate matrices for breakfast, lunch, dinner, with snacks in between.  <br>  <br>This dreadful exercise provided Mergenthaler with a large slice of annual profit, hence its importance to the company.  <br> <br>Mike Parker <br>.......... <br></p>
    html_clean: <p>Good morning from Finland, <br> <br>Kent, <br> <br>I thought my special efforts to have Mike Parker speak of the matter was appropriate, and as such did not muddy waters. Perhaps Jim Rimmer just missed the posting. I have included extra text of Parker's words which I feel may give "weight". Therefore more memorable. <br> <br>E-mail excerpt sent to Gerald Giampa about Linotype units by Mike Parker, these are his words. <br> <br>..... <br>The typefaces redrawn for teletypesetter use were a TINY group of popular newstext and classified designs, and NOTHING ELSE.  <br> <br>However, since Fairchild monkeyed with the standard ratio of set size to column width every few years, this small group of typefaces had to be redrawn over and over again just to maintain simple legibility on the current standard.  <br>  <br>TTS was a black curse to all designers of linecaster newstext and classified typefaces from 1940s to 1980s.  <br>  <br>While this group of types made up a tiny section of the library  of fonts, it made up a majority of matrices sold to constantly feed batteries of roaring teletypesetter high speed text machines smashing matrices together at speeds undreamt of by Ottmar Mergenthaler. They ate matrices for breakfast, lunch, dinner, with snacks in between.  <br>  <br>This dreadful exercise provided Mergenthaler with a large slice of annual profit, hence its importance to the company.  <br> <br>Mike Parker <br>.......... <br></p>
