e varied by size -- wider for the smaller sizes, narrower for display. On the other hand, I doubt that Tschichold would have made a different decision. Just a practical matter. Text would have been set primarily by machine comp; display would usually have been set by hand, I imagine. So all of the Lino and Mono sizes would probably all have the same wide 'a'. I suppose that the foundry display sizes could have been cut without these restrictions, but I don't know. I don't have information about what sizes were released in each medium. <br> <br>Clearly, you would have made a different decision under the same circumstances -- sacrificing the italic 'a'. Tschichold made the other decision.  <br> <br>Obviously, Sabon was ripe for revision in digital without all the constraints, as aptly demonstrated by Jean-Fran</p>
