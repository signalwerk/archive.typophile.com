    html: '<p>OK, I did some more calculations of Monotype Centaur. I measured the width of the word "the" (from leftmost black to rightmost black) in each size, normalized the measures by size, and then normalized to the 14 point (since that was the single original foundry size). Here are the [rounded] precentages: <br> <br> 6: 121% <br> 8: 114% <br> 9: 107% <br>10: 100% <br>11: 100% <br>12: 103% <br>14: 100% <br>16: 106% <br>18:  84% <br>22:  90% <br>24:  95% <br>30:  95% <br>36:  94% <br>42:  96% <br>48:  96% <br>60:  97% <br>72:  97% <br> <br>What I can tentatively conclude is that: <br>1) The groups are: 6; 8; 9-16; 18-72 <br>2) The spacing was done [totally] by eye (hence the sloppy fluctuations).  <br> <br>hhp <br></p>'
