    html: <p>Kent, nice experiment! <br> <br>&gt; If Sabon had been designed solely for Monotype, the roman 'a' could have been put on 8 units <br> <br>My problem with that is I think the cramping of the 8-unit Italic "a" is so slight that making the Roman "a" so much better would have made more sense. <br> <br>&gt; If Sabon had been designed solely for Monotype, the roman 'a' could have been put on 8 units, which would have given a more traditionally Garamondesque proportion; while the italic 'a' could have been placed on 9 units, so as not to be too narrow. <br> <br>Conversely, if Sabon had been designed solely for Linotype (with no Monotype issues), the two "a"s would have been duplexed, but to a more satisfying compromise width. <br> <br>hhp <br></p>
