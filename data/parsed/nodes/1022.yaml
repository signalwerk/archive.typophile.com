    html: "<p>I think the reason you gave (the combination of style duplexing and \"width snapping\") makes total sense. <br> <br>This all started when I said Monotype has at least that limitation which foundry (and digital) don't - something that's pretty obvious to anybody not religious about Monotype- and the blame for the width of the Sabon \"a\" can be attributed to that limitation, at least partially. When it comes to the Monotype \"width snapping\" limitation, Sabon is not a special case qualitatively, just quantitatively: the \"a\" would still have been too wide (just less), or maybe too narrow, even if JT didn't have to factor in the Linotype's limitation (duplexing) as well. <br> <br>My other line of thought was just an attempt at analyzing JT's design decisions. <br> <br>hhp <br></p>"
    html_clean: "<p>I think the reason you gave (the combination of style duplexing and \"width snapping\") makes total sense. <br> <br>This all started when I said Monotype has at least that limitation which foundry (and digital) don't - something that's pretty obvious to anybody not religious about Monotype- and the blame for the width of the Sabon \"a\" can be attributed to that limitation, at least partially. When it comes to the Monotype \"width snapping\" limitation, Sabon is not a special case qualitatively, just quantitatively: the \"a\" would still have been too wide (just less), or maybe too narrow, even if JT didn't have to factor in the Linotype's limitation (duplexing) as well. <br> <br>My other line of thought was just an attempt at analyzing JT's design decisions. <br> <br>hhp <br></p>"
