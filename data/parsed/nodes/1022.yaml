    html: <p>Hrant, <br> <br>Actually it is a simple mistake. It reads "Seven unit sizes". But it is based on 14 units. You can have 18 monotype units and have only 1 or 2 unit sizes, such as the 3 unit type for train schedules we custom cut for American Eastern Railways. Actually digitized the face in 1989, imagine! <br>  <br>....... <br>Rodolfo Capeto words, <br> <br>"The first was designed for use on Linotype and Monotype systems. The second version of Sabon was designed for Stempel handsetting". In any case the drawings reproduced in the Penrose Annual article (that you may have in your hands now) are of the "Stempel" variety (long extenders, narrow 'a'). Interestingly, they also conform to the Monotype 18-unit width grid." <br>........ <br> <br>This gives strength to my understanding of this particular cutting. Without more "surprise knowledge" of Stempel systems I would not think using Monotype's 18 unit grid would have been standard practice. <br> <br>Measures of "harmonious typesetting standardization" appear to be the very underpinning of intention for the "Sabon Project". It would seem to me, all parties were attempting to co-ordinate usage of Sabon to service some special objective. <br> <br>Few examples are so clearly illustrate the old adage, "the exception proves the rule". <br> <br> <br> <br> <br>Gerald Giampa</p>
