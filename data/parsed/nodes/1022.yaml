    html: "<p>Hrant, <br> <br>If Centaur did not have 11 pt patterns, I am surprised. Anything is possible but without question a goodly collection of patterns were made for Centaur/Metropolitan/Arrighi. <br> <br>Right hand column: <br><a href=\"http://www.lanstontype.com/Burgess5.html\" target=\"_blank\">http://www.lanstontype.com/Burgess5.html</a> <br> <br>Cutting cards are in existence, it is a matter of access. They would complete the story. <br> <br>If Bruce Rogers and Frederick Warde were happy, I would be happy. I have never heard they were not. <br> <br>I am not convinced that merely using every trick in the book makes for a good type face. A body of evidence supports the contrary. Some might say that is a matter of taste. I say, yes it is. <br> <br>Legibility and readability were not the predominant determining factors in this cutting. Bruce Rogers did not subscribe, either do I, to all of Stanley Morison's dictums of readability. Looking at Morison's own work, either did he. The point is, the adjustments were not made so that it could be read when \"overinked\", or readable for the \"nearly blind\". This cutting was designed for \"Book Arts\" production. <br> <br>The intent was to make this type face \"look right\" in different point sizes. I know it will seem crass to some of you readers, but I must dare use the word \"art\". <br> <br><a href=\"http://www.lanstontype.com/Metropolitan.html\" target=\"_blank\">http://www.lanstontype.com/Metropolitan.html</a> <br> <br>This cutting stands as exemplary type craftsmanship. Patterns for optical adjustments were made for many different point sizes. Cutting cards would certainly complete the story of this fine production. <br> <br> <br>Gerald Giampa <br>Lanston Type Company</p>"
    html_clean: "<p>Hrant, <br> <br>If Centaur did not have 11 pt patterns, I am surprised. Anything is possible but without question a goodly collection of patterns were made for Centaur/Metropolitan/Arrighi. <br> <br>Right hand column: <br><a href=\"http://www.lanstontype.com/Burgess5.html\" target=\"_blank\" class=\"link-external\">http://www.lanstontype.com/Burgess5.html</a> <br> <br>Cutting cards are in existence, it is a matter of access. They would complete the story. <br> <br>If Bruce Rogers and Frederick Warde were happy, I would be happy. I have never heard they were not. <br> <br>I am not convinced that merely using every trick in the book makes for a good type face. A body of evidence supports the contrary. Some might say that is a matter of taste. I say, yes it is. <br> <br>Legibility and readability were not the predominant determining factors in this cutting. Bruce Rogers did not subscribe, either do I, to all of Stanley Morison's dictums of readability. Looking at Morison's own work, either did he. The point is, the adjustments were not made so that it could be read when \"overinked\", or readable for the \"nearly blind\". This cutting was designed for \"Book Arts\" production. <br> <br>The intent was to make this type face \"look right\" in different point sizes. I know it will seem crass to some of you readers, but I must dare use the word \"art\". <br> <br><a href=\"http://www.lanstontype.com/Metropolitan.html\" target=\"_blank\" class=\"link-external\">http://www.lanstontype.com/Metropolitan.html</a> <br> <br>This cutting stands as exemplary type craftsmanship. Patterns for optical adjustments were made for many different point sizes. Cutting cards would certainly complete the story of this fine production. <br> <br> <br>Gerald Giampa <br>Lanston Type Company</p>"
