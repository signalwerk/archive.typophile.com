    html: "<p>{It's really frustrating being prevented from posting to the correct thread...} <br> <br>So I did some preliminary analysis of Monotype Centaur, by eyeballing the vertical proportions of enlargements of all the sizes, and it seems that there were different masters for the following size ranges: <br> <br>6 <br>8, 9 <br>10-12 <br>14, 16 <br>18-72 <br> <br>Five masters seems like a good amount (I've heard it was usually three), so they did take optical scaling pretty seriously, at least in the case of Centaur. <br> <br>On the other hand, I don't know yet if the compensation is linear or better. If it's linear, it would put Monotype slightly below Linotype in terms of optical compensation (since it seems the latter used progressive scaling for each size, but linear math - Kent might correct me). If it's better than linear, it would put Monotype at least as good as Linotype, and probably better depending on how you look at it and/or what actual point size you're looking at. But neither would be as good as ATF, where they used progressive parabolic-looking compensation. <br> <br>hhp <br></p>"
    html_clean: "<p>{It's really frustrating being prevented from posting to the correct thread...} <br> <br>So I did some preliminary analysis of Monotype Centaur, by eyeballing the vertical proportions of enlargements of all the sizes, and it seems that there were different masters for the following size ranges: <br> <br>6 <br>8, 9 <br>10-12 <br>14, 16 <br>18-72 <br> <br>Five masters seems like a good amount (I've heard it was usually three), so they did take optical scaling pretty seriously, at least in the case of Centaur. <br> <br>On the other hand, I don't know yet if the compensation is linear or better. If it's linear, it would put Monotype slightly below Linotype in terms of optical compensation (since it seems the latter used progressive scaling for each size, but linear math - Kent might correct me). If it's better than linear, it would put Monotype at least as good as Linotype, and probably better depending on how you look at it and/or what actual point size you're looking at. But neither would be as good as ATF, where they used progressive parabolic-looking compensation. <br> <br>hhp <br></p>"
