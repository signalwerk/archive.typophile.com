    html: "<p><i>&gt;But neither would be as good as ATF, where they used progressive parabolic-looking compensation.</i> <br> <br>Hrant, I need to back up a minute and re-examine this with you.  <br> <br>You have said that Linotype's optical grading was linear. I presume you are saying this based on a sample graph that I posted to some other thread a while back, in which a few parameters appeared to be essentially linear. Correct me if I'm mistaken. <br> <br>What parameters are you examining in ATF faces that lead you to the \"parabolic\" comment? <br> <br>The Linotype parameters that I presented were the few that I had data for immediately at hand (from the Advance Proofs for Dwiggins's Falcon) -- size of face (i.e., measurement from top of ascender to bottom of descender), height of the capital H, and length of lowercase alphabet.   <br> <br>I am looking at the waterfall of ATF Garamond that you sent me. We can, of course, discount the first parameter, since the face on the body in any given design is practically guaranteed to be linear by point size. Since this sample you sent shows only lowercase, I cannot measure the cap H height. But I can -- and did -- measure the lowercase alphabet length. Here is my graph. (Apologies for the large image.) <br> <br><img src=\"http://www.typophile.com/forums/messages/4100/15270.gif\" alt=\"ATF Garamond alphabet graph\"> <br> <br>My data --  <br>Point size (l.c. alphabet length in points): <br>6 pt (86.5) <br>7 pt (94.25) <br>8 pt (103) <br>10 pt (117.25) <br>12 pt (133) <br>14 pt (148) <br>18 pt (192) <br>24 pt (250.5) <br>30 pt (305.5) <br>36 pt (362) <br>48 pt (476) <br> <br>The y-axis is 1:1, but the x-axis is in a ratio of 10 points for every 1 point size increase; I did this so that it would be readable. Thus you can't infer anything necessarily from the angle of the line, but this doesn't affect its essential linearity. There does seem to be a shift in slope at the 14-point mark. We've noted that there is a shift in the underlying master design at this point, so I'm not surprised.  <br> <br>Aside from that, however, this data is essentially <b>linear</b>. Certainly no less so than the Falcon data (which only ranged from 6 to 12 point, BTW). I do not see any parabolic compensation. At least not in set-width: character widths combined with fitting. In this respect, in these cases, ATF and Linotype do not seem very different. <br> <br>For comparison: <br> <br><img src=\"http://www.typophile.com/forums/messages/4100/15271.gif\" alt=\"Falcon Alphabet Graph\"> <br> <br>6 pt (90) <br>7 pt (98) <br>8 pt (107) <br>9 pt (115) <br>10 pt (124) <br>11 pt (132) <br>12 pt (141) <br> <br>I am open to the possibility that other parameters -- stem weight, cap-height, x-height, extender proportions -- may not be linear. I will be interested to see data on these.  <br> <br>But I will ask you to extend the same openness to considerations of Linotype (or even Monotype) until we have data to examine. I have no personal stake in defending the Linotype drawing office. Linotype just happens to be an object of my study. I remain open to whatever results might turn up. <br> <br>But let's gather more evidence before drawing conclusions. <br> <br>-- Kent. <br></p>"
