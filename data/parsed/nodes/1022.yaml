    html: "<p><i>&gt;When it comes to the Monotype \"width snapping\" limitation, Sabon is not a special case qualitatively, just quantitatively: the \"a\" would still have been too wide (just less), or maybe too narrow, even if JT didn't have to factor in the Linotype's limitation (duplexing) as well.  <br></i> <br> <br>Missed this post earlier, as I guess we were cross-posting.  <br> <br>I don't disagree that the 18-unit system was a limitation. Absolutely. It certainly was.  <br> <br>It seems to me type design is always about confronting one technical limitation or another. I actually think that's part of the challenge and the fun. <br> <br>Still, I'm not so sure that Tschichold couldn't have made a completely acceptable 'a' if the Lino duplexing constraint was removed. It would be an interesting experiment to do an adaptation that still conforms to Mono unitizing, but without Lino duplexing, just to see.  <br> <br>For instance, the 'a' in my first example above seems almost completely fine in an 8-unit width. A little more tweaking throughout the alphabet and I bet you could come up with a version in which the 'a' appeared neither too wide nor too narrow, while still being Mono-friendly. <br> <br>-- Kent. <br></p>"
