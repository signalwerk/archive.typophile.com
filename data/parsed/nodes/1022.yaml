    html: "<p>Hrant, <br> <br>I am not so sure about that. First we must understand the meaning of this. <br> <br>Mike Parkers words. <br>..... <br>\"The idea was to replace linotype operators with faster tape drives. In order to justify lines predictably, each character had to have a predictable width. Fairchild established a standard width for each character expressed in a single fixed set of eighteen units to the set width em to be used for all typefaces regardless of typeface design. The wider the column width, the larger the eighteen unit set width required.\" <br> <br>..... <br> <br>I read this to mean: Unlike Monotype where the units were based on the em of the type, The units in Linotype were simple a fixed formulae giving truth to predictability of column width regardless of type design. In otherwords the column width is more important than the type width. In any event, it appears to be quite cumbersome. And I predict your solution would not be quite that simple. <br> <br>Perhaps I am wrong! I don't think so. <br> <br>Gerald Giampa</p>"
    html_clean: "<p>Hrant, <br> <br>I am not so sure about that. First we must understand the meaning of this. <br> <br>Mike Parkers words. <br>..... <br>\"The idea was to replace linotype operators with faster tape drives. In order to justify lines predictably, each character had to have a predictable width. Fairchild established a standard width for each character expressed in a single fixed set of eighteen units to the set width em to be used for all typefaces regardless of typeface design. The wider the column width, the larger the eighteen unit set width required.\" <br> <br>..... <br> <br>I read this to mean: Unlike Monotype where the units were based on the em of the type, The units in Linotype were simple a fixed formulae giving truth to predictability of column width regardless of type design. In otherwords the column width is more important than the type width. In any event, it appears to be quite cumbersome. And I predict your solution would not be quite that simple. <br> <br>Perhaps I am wrong! I don't think so. <br> <br>Gerald Giampa</p>"
