    html: <p>Hrant, <br> <br>Monotype should be easy to distinguish from Stemple, assuming Stemple has a pin mark. Odds are, with a Monotype, there will be no pin mark. <br> <br>Tinny, it could be, we ran hard foundry metal, which meant running slow and hot. Our type would not be distinguishable from foundry type by colour alone. <br> <br>Kent <br> <br>The picture of the Linotype Matrix, is exactly what I was, poorly, trying to say. Thank you. <br> <br>I agree that the unit system had limitations, but it was an engineering puzzle, not a method of soliciting customer complaint. It was a challenge as you say, but for the most part, the engineers did a very fine job. <br> <br>Monotype houses were noted for typographical expertise or they would have purchased a lessor system. More skill was required in running Monotype Systems than Linotypes. Monotypes were the system of choice for both trade typographers and book houses. Not so often, run of the mill print shops or newspapers. There were many exceptions. <br> <br>Lanston used typographers and fine book printers as, "Beta Testers". Bruce Rogers was amongst them. I can assure you, non were shy with comment, each trying to out do one another as a method of showing off their typographical finikitiness. (Is that a word?) And they didn't give a tinkers dam about punchcutters problems, or unit rows, they just wanted the typeface to pass their highest standards.  <br> <br>That was the primary goal of Lanston's punchcutting department. To satisfy production oriented owners and cranky artistic and very opinionated personalities. They did so, for the most part, very well. <br> <br>With "multiple typesetting system planning" the Sabon "roman and italic a' is not illustrative of English Monotypes finest capabilities, probably the same is true for Linotype. <br> <br>Criticism should be kept in perspective. This face is an exception, not a rule. This experiment in joint development was doomed to have "some fall out". <br> <br>Characters of the alphabet in the Monotype System, were not out of necessity, "too wide" or "too narrow" or as some would suggest, never quite right. In most cases adjustments were made and the type designer would never see the difference. Either did the fussy customers after their complaints had vanished. I know the problem with the Sabon roman and italic "a" could have been minimized to the point this discussion would never take place. This is a grossly exaggerated example.  <br> <br>However the Linotype duplex problem is an efficiency that is bound to cause problems. <br> <br>But the secret to making  Sabon "roman a" and the italic "b" appear correct in the Linotype version may lie in </p>
