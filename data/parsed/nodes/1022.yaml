    html: <p>Gerald -- <br> <br>A picture may be worth several words. Here's what a Linotype matrix looks like, for those who've never seen one. Sorry the photo isn't better. <br> <br><img src="http://www.typophile.com/forums/messages/4100/14919.jpg" alt="Linotype Matrix"> <br> <br>This is a 14-point 'w' matrix (I don't recall which face), roman duplexed with italic. This matrix is shown in its operating position -- i.e., "upside down". If you turned it over, you'd notice that the letters are actually right-reading, and the roman would be on the bottom and the italic on the top. Obviously, each letter must have the same set width. <br> <br>Generally speaking, a roman letter would be duplexed with the corresponding letter in either italic or bold. (This was not the case, however, with small caps, which duplexed with other sorts. There was a standard scheme of what went with what, but I don't have a map handy.) <br> <br>I hope this helps folks trying to make sense of this thread. <br> <br>-- K.</p>
    html_clean: <p>Gerald -- <br> <br>A picture may be worth several words. Here's what a Linotype matrix looks like, for those who've never seen one. Sorry the photo isn't better. <br> <br><img src="http://www.typophile.com/forums/messages/4100/14919.jpg" alt="Linotype Matrix"> <br> <br>This is a 14-point 'w' matrix (I don't recall which face), roman duplexed with italic. This matrix is shown in its operating position -- i.e., "upside down". If you turned it over, you'd notice that the letters are actually right-reading, and the roman would be on the bottom and the italic on the top. Obviously, each letter must have the same set width. <br> <br>Generally speaking, a roman letter would be duplexed with the corresponding letter in either italic or bold. (This was not the case, however, with small caps, which duplexed with other sorts. There was a standard scheme of what went with what, but I don't have a map handy.) <br> <br>I hope this helps folks trying to make sense of this thread. <br> <br>-- K.</p>
