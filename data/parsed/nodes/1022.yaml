    html: <p>Probably you are not asking me. Also I can not speak for another company. However this face was jointly developed. My instincts are that if there is a failure it would be because too many cooks could spoil the broth. The face was jointly developed by Monotype and Lanston. <br> <br>But my suspicions are they did a "good" job. I suspect it will be very hard to find a sample of Lanston's Metropolitan because it was a private cutting for the Metropolitan Museum of Art. <br> <br>You would have to look for theirs. I think the real question is, how is the optical scaling in Metropolitan and Centaur in the digital version? Not very good in either case, as there isn't any. I wonder why? <br> <br>Where are all those sharp blades in the software industry?  <br> <br>Gerald Giampa</p>
    html_clean: <p>Probably you are not asking me. Also I can not speak for another company. However this face was jointly developed. My instincts are that if there is a failure it would be because too many cooks could spoil the broth. The face was jointly developed by Monotype and Lanston. <br> <br>But my suspicions are they did a "good" job. I suspect it will be very hard to find a sample of Lanston's Metropolitan because it was a private cutting for the Metropolitan Museum of Art. <br> <br>You would have to look for theirs. I think the real question is, how is the optical scaling in Metropolitan and Centaur in the digital version? Not very good in either case, as there isn't any. I wonder why? <br> <br>Where are all those sharp blades in the software industry?  <br> <br>Gerald Giampa</p>
