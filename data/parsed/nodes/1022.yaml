    html: <p><i>&gt;More interesting is the comparison with Linotype, with their TTS. </i> <br> <br>Just to clarify, TTS did not belong to Linotype. As I understand it, the TeleTypesetting System was an independent technology for transmitting wire stories to newspapers. Those publishers who subscribed to the service would receive stories via wire, which came out as punched tape. These tapes were then fed into the composing machine and produced typeset stories for the newspaper to publish. The device that interpreted the punched tape would be fitted to any of the various composing systems. Linotype was only one (arguably the most common).  <br> <br>The point of the unitized standard for typefaces used with the TTS was that the stories would always run to the exact same characters per line and, consequently, an exact column length regardless of the layout of the paper -- specifically, regardless of the column width of the newspaper's grid.  <br> <br>Thus, a wire service could wait until the last possible hour to file a late-breaking story by indicating in advance that they would have the story run to X column inches and the papers could then continue to lay out their editions by holding open X inches of space for that story. This kind of just-in-time publishing depended upon reliable, consistent character counts, and column lengths. <br> <br>It had nothing to do with justification <i>per se.</i> <br> <br>The Linotype machine required no unit-system in order to achieve effortless justification. It employed a mechanical system that I think was ingenious, but I don't think I can describe it fully here. Basically, it employed wedge-shaped spacebands that adapted automatically to fill out the line. <br> <br>-- Kent. <br> <br></p>
    html_clean: <p><i>&gt;More interesting is the comparison with Linotype, with their TTS. </i> <br> <br>Just to clarify, TTS did not belong to Linotype. As I understand it, the TeleTypesetting System was an independent technology for transmitting wire stories to newspapers. Those publishers who subscribed to the service would receive stories via wire, which came out as punched tape. These tapes were then fed into the composing machine and produced typeset stories for the newspaper to publish. The device that interpreted the punched tape would be fitted to any of the various composing systems. Linotype was only one (arguably the most common).  <br> <br>The point of the unitized standard for typefaces used with the TTS was that the stories would always run to the exact same characters per line and, consequently, an exact column length regardless of the layout of the paper -- specifically, regardless of the column width of the newspaper's grid.  <br> <br>Thus, a wire service could wait until the last possible hour to file a late-breaking story by indicating in advance that they would have the story run to X column inches and the papers could then continue to lay out their editions by holding open X inches of space for that story. This kind of just-in-time publishing depended upon reliable, consistent character counts, and column lengths. <br> <br>It had nothing to do with justification <i>per se.</i> <br> <br>The Linotype machine required no unit-system in order to achieve effortless justification. It employed a mechanical system that I think was ingenious, but I don't think I can describe it fully here. Basically, it employed wedge-shaped spacebands that adapted automatically to fill out the line. <br> <br>-- Kent. <br> <br></p>
  - id: 7815
    user: 1215
    date: 2003-08-30T07:03:00
    date_raw: 30 Aug 2003 — 7:03am
    votes: null
    html: "<p><i>&gt;But maybe some smart investigation (like seeing what fonts were used in those pages) could narrow it down a lot.</i> <br> <br>Well, obviously, the fonts used were self-spacing types. ;-) <br> <br>Here's some research along different lines: <br> <br>Linn Boyd Benton took out his patent for a system of self-spacing type in 1883. The United States Type-Founders' Association defined the American point system of type sizes in 1886. Notice that this article still cross-references the old, named body sizes.  <br> <br>Updike (Vol. I pg. 34) mentions that \"In 1894 a western firm introduced this system of self-spacing types, every type in their entire output being placed on a body the width of which was equal to an even division of the standard 'pica em.'\" This term 'pica em' was apparently soon replaced by the term 'point-set'. Note that your article still refers to divisions of the Pica em. <br> <br>Given this, I am going to assert that this article dates from between 1886 and around 1896, somewhere thereabouts.  <br> <br>The first typeface issued by (American) Lanston Monotype was in 1896 and it was for the Model C keyboard, which I believe was the arrangement that introduced the 18-unit system. I do not know if this configuration was utilized prior to that. <br> <br>Hrant, is this article specifically identified by Lawson &amp; Bidwell as an ATF piece? Updike does not name the \"western firm\" he refers to. I would have thought that if it was ATF, he would have simply said so. ATF was formed in 1892 and Benton, Waldo &amp; Co. was one of the original founders that merged into it. I can't imagine there was any other sizable foundry left after that to introduce such a system, especially given Benton's patent on the scheme. Yet, Updike says that every type was adapted to this system, which certainly does not describe ATF.  <br> <br>-- Kent. <br> <br></p>"
