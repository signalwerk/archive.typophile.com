    html: "<p>Hrant -- <br> <br>The 1923 specimen refers to the Specimen of 1895. So that must be what you have a facsimile of. There you go then. <br> <br>Re: Updike. The problem I have with understanding Updike to be referring to Benton's foundry is that his date of 1894 would have been two years *after* Benton merged his foundry into the formation of ATF. Now, I think I may have heard that some members of ATF continued to operate semi-independently, so I suppose this could reconcile the matter. <br> <br>Jim Rimmer: <br><i>&gt;I was not really aware that Liontype even worked on a unitizes system.</i> <br> <br>I feel I must reiterate (because perhaps some of Gerald's intervening posts may have muddied things) -- the Linotype system (metal) <b>did not</b> require the type designer to work within fixed unit-widths. There were a few particular situations where a typeface would be unitized -- for reasons having nothing to do with the Linotype system <i>per se.</i> The foremost examples were TTS typefaces, for specialized newspaper setting, and special faces for setting tabular matter (which, as Jim pointed out, was a real pain on the Linotype). <br> <br>Let me be clear, I do not think that Linotype was superior to Monotype because of the lack of a unitizing constraint. Nor do I think that Monotype was superior to Linotype because it lacked duplexing constaints. I think both were marvelous inventions and amazing examples of mechanical ingenuity. I think the type designers and letter draftsmen (and women) did a remarkable job in both systems. Each had its strengths and its weaknesses. Both brought us, happily, to where we are now. <br> <br><i>&gt;It's Saturday morning and I have just spent the last five days cutting [...]</i> <br> <br>Jim, best of luck fitting that 'f'. <br> <br>-- Kent. <br></p>"
