    html: "<p>I don't know. But I don't think I'm understanding what you're trying to get at. <br> <br>Here's my point: If the design is based on an 18-unit system and the 'a' is allocated to 9 units, then even if there is slight adjustment overall, wider or narrower, for optical compensation at varying sizes, the 'a' will still be relatively wide.  <br> <br>It's all relative. The 'a' will always appear relatively wide, compared to the general proportions of the design, if none of the letters are reassigned to different unit widths. <br> <br>This makes sense to me. Does it to you? Or are you driving at something different? <br> <br>-- K. <br></p>"
