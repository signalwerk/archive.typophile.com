    html: <p>The way I got those numbers (which have no value on their own, just in relation to one-another) is that I measured in pixels from the 600 dpi scan, and then divided by point size. So what you get is a non-dimensional view, like in digital type design. <br> <br>&gt; differentiate foundry from linecasting <br> <br>Are you saying that the Linotype had optical scaling limitations? I can see the Monotype with a problem like that (because of its unitization issue), but not the Lino. <br> <br>&gt; we can measure this parameter too <br> <br>What I'm doing for the ATF Garamond is measuring the three lc zones separately, and I'll graph those stacked, to clearly show the changes in proportion. So you should be able to see if/how_much the size-on-body changes, as well as things like how the baseline moves. <br> <br>&gt; These ... do describe linear relationships. <br> <br>In fact the slopes (7.6875 and 9.5 versus 8.5) can be very useful. <br> <br>hhp <br></p>
    html_clean: <p>The way I got those numbers (which have no value on their own, just in relation to one-another) is that I measured in pixels from the 600 dpi scan, and then divided by point size. So what you get is a non-dimensional view, like in digital type design. <br> <br>&gt; differentiate foundry from linecasting <br> <br>Are you saying that the Linotype had optical scaling limitations? I can see the Monotype with a problem like that (because of its unitization issue), but not the Lino. <br> <br>&gt; we can measure this parameter too <br> <br>What I'm doing for the ATF Garamond is measuring the three lc zones separately, and I'll graph those stacked, to clearly show the changes in proportion. So you should be able to see if/how_much the size-on-body changes, as well as things like how the baseline moves. <br> <br>&gt; These ... do describe linear relationships. <br> <br>In fact the slopes (7.6875 and 9.5 versus 8.5) can be very useful. <br> <br>hhp <br></p>
