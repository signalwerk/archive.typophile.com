    <p>Thanks for reading.</p>
    <p>I’m looking for examples of typographic work with a comedic element, it doesn’t have to be funny. The most examples I’ve seen show letters expressing the word they build with their shape, rotation or color. It can be anything like an album cover or the intro to a movie. The Disney movie Alice In Wonderland has a good example:</p>
    <p><a href="https://web.archive.org/web/20080821130131/http://www.pixentral.com/show.php?picture=1QcVd3r1lWhgtMP9VTp5iRLOrr1lVQ" title="http://www.pixentral.com/show.php?picture=1QcVd3r1lWhgtMP9VTp5iRLOrr1lVQ">http://www.pixentral.com/show.php?picture=1QcVd3r1lWhgtMP9VTp5iRLOrr1lVQ</a></p>
    <p>The video:<br>
    <a href="https://web.archive.org/web/20080821130131/http://youtube.com/watch?v=QgbntWU7pG8" title="http://youtube.com/watch?v=QgbntWU7pG8">http://youtube.com/watch?v=QgbntWU7pG8</a></p>
    <p>Thanks a lot!</p>
