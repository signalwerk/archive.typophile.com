  html: <p>I set all the kerning/spacing in Fontographer Metrics Windows as I wanted it but after generating the font in TrueType format and trying to use it in any of my programmes (Photoshop7.0, <br>Illustractor 10 etc.) it seems to have not recognised any of my alterations.  In fact it appears exactly the same as if the 'Kerning Checkbox' in the Metrics Window was UNchecked but it isn't.  <br> <br>Any help would, I'm sure be extremely useful and greatly appreciated. <br> <br>Cheers, Nick.</p>
