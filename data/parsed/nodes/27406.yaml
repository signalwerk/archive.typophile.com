  html: |-
    <p>I think Silom is a quite useful font to build type images with. Here I made one, in some variations:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/typographyyesterday_4274.jpg"></div><p></p>
    <p>All critique is welcome.</p>
    <p>btw: I tried to find some info on the Silom typeface, but I couldn't find too much. Only thing I know, is that it's standard on Mac, though not used too often. (Or am I completely wrong with that?)<br>
    Anyway, I like to play with it.</p>
