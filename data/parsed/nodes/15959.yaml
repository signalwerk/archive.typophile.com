    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 31.Oct.2005 8.54pm </div>
      <p>——————————</p>
    <p>November 2005</p>
    <p>——————————</p>
    <p>Introducing new titles from International House of Fonts</p>
    <p>P22 Yule by James Grieshaber is a display font set inspired by a melange of ancient inscriptional writing, with visual references to Anglo-Saxon, Celtic, medieval and even a bit of ancient Greek and roman letterforms. Yule is exotic yet familiar and evocative of winter holidays.<br>
    <a href="http://www.p22.com/ihof/yuleset.html" title="http://www.p22.com/ihof/yuleset.html">http://www.p22.com/ihof/yuleset.html</a></p>
    <p>P22 Curwen is a set of 2 fonts by Colin Kahn. P22 Curwen Poster is a digitized version of a rare wood type used by the Curwen Press in England in the early 20th Century for poster work. P22 Curwen Maxima is a new hyper-stylized re-interpretation of Curwen Poster.<br>
    <a href="http://www.p22.com/ihof/curwenset.html" title="http://www.p22.com/ihof/curwenset.html">http://www.p22.com/ihof/curwenset.html</a></p>
    <p>—————————-</p>
    <p>Indie Fonts 50% off pre-holiday sale</p>
    <p>Anyone who visits graphic design sections of major bookshops may have noticed the Indie Fonts books as reprinted from a major publisher. These books are the second edition (with the exception of their logo all over, and theirs not using silver ink in Indie Fonts 2, the books are identical). For two weeks only get the first editions for 50% off! If you already have a copy, you know this makes a great gift and at half-price it makes it even better.<br>
    <a href="http://www.p22.com/indiefonts/indieset.html" title="http://www.p22.com/indiefonts/indieset.html">http://www.p22.com/indiefonts/indieset.html</a><br>
    This special pre-holiday sale expires Nov. 14th 2005</p>
    <p>——————————</p>
    <p>Look for more this month from P22 including classic Lanston holiday ornaments and more gift ideas.</p>
    <p>Cheers<br>
    P22 type foundry</p>
