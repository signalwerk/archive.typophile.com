      <p>When I lived in the DCMetro area, there were several pubs specificially for the visually/hearing impaired: you might also want to check out the mag shelves at Gallaudet, which should have a range for you to investigate....</p>
      <p>In doing my Masters, it was pretty obvious that when one sense was atrophied, others took over: folks who were hearing-impaired needed more obvious visual clues, and the visual-impaired needed both aural and touch-sensitive materials.</p>
