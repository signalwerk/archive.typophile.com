      <p>James, </p>
      <p>You may want to contact the Lighthouse in Manhattan. They have all sorts of tools to help the disable learn. My stepson is legally blind and during his time at school, the Lighthouse was fantastic. Getting him schoolbooks in large type, on records (yep in those days it was still record albums) helping where they could. It’s a wonderful organization - and extremely helpful. They were located on 58th or 59th Street - and are probably still there plugging away. It’s been years since I’ve been in touch with them.</p>
