      <p>I’ve got a profound hearing loss and therefore have a disability. I’ve got no issues with the word “disability”. However if people asked me the question, “are you disabled”, I’d simply answer “no” purely for political or social reasons. There are people who equate disability with “crippled” or someone with an inability to achieve anything substantial at all. This is a complete nonsense. A disability is simply an obstacle in life, if you can’t hear, see, taste, feel or walk, you gotta work around the problem like anything else, that’s all. It’s disappointing sometimes how people perceive disabilities but it’s improving all the time with increased understanding and also support for braille, captioning etc.</p>
      <p>I’m all for magazines about disabilities.</p>
    html_clean: |-
