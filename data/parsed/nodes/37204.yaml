    <p>This weekend I came across ADDitude, a magazine for individuals with attention deficit disorder and their families. The design was remarkable—it was extremely attractive and attention-getting visually, but had a well-developed—and followed—hierarchy that was clearly designed to make it easy on readers with ADD. This got me wondering—are there more magazines out there <em>designed</em> for readers with visual, reading, or learning disabilities?</p>
