      <p>I’m not against the term disability, but the problem I have with it is that it focuses on people with ’lesser’ ability rather than focusing on the fact that people, in general, are all different. I prefer terms like ’universal design’ as it is more inclusive of all people rather then exclusive.</p>
      <p>But, that’s just me. No biggie either way.</p>
