      <p>AD(H)D is, by any fair definition, a disability. Whether that fact bothers you or not is a separate question.</p>
      <p>There aren’t many magazines about disability at all; <a href="http://www.rrj.ca/print/697/" title="Article in ‘Ryerson Review of Journalism’">they tend not to want to bite the hands that feed them</a>. There’s a small Canadian magazine. The successor to the <cite>Disability Rag</cite> might still be in business.</p>
      <p>—<br>
      Joe Clark<br>
