      <p>Hi Ed,<br>
      I think its good start, at least as far as the colours are concerned (the blue from the Scottish flag?), but without reading what your initial concept was (playing on the word Watt=name/lightbulb=idea) I don't think I would've "got" the meaning from the question mark logo. For further exploration I would look at:<br>
      1. Your design style (ie, having an affinity toward Modern, Classical, post-Modern, etc) Its often helpful to get a second or third pair of eyes to look at one's work objectively. How could you represent that visually?<br>
      2. How you tackle a design problem, and maybe turn it into a metaphor.<br>
      3. If you really do wish to stick with the ? as the silhouette of a lightbulb, maybe make it more shadowy, or start with drawing the shadow of a real lightbulb so that it just happens to resemble a question mark.<br>
      Sometimes I've found it useful to do a whole lot of thumbnail sketches of ideas, and not get too hung up about the rendering. Sometimes that yields solutions I didn't think of before.<br>
      Hope that helps :)</p>
      <p>Regards,</p>
      <p>David</p>
