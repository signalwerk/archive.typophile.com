      <p>Hi, Ed --</p>
      <p>I like the (b) solution to the quex/bulb icon, much better than the shade/light line directions I was thinking. The threads let you know that there's a little more going on, w/o shouting.</p>
      <p>Re: FedEx -- the difference between FedEx and your mark is that FedEx is the message, and the arrow is the bonus. The reason most people don't see the arrrow is they get the "FedEx" message and then move on. In your case, people might see the question mark, decide that your message equals "huh?" and move on before they realize there is something more subtle going on. IOW, you don't want the obvious message to be a bad one. The improved threads at the bottom is a very nice pointer that there's more here that meets the eye.</p>
      <p>(...oooh, wait, you could call yourself "EdEx" and have the arrow ... never mind.)</p>
      <p>Again, I like it.</p>
      <p>Jay</p>
