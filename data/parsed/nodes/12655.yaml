      <p>watt,</p>
      <p>Not sure if I'm too late to comment, since I only just swung in, but I've got some observations that i hope you can make use of. I really like the possibilities here.</p>
      <p>1) I agree with everyone about the phrase. There are too many visual and verbal puns of equal importance that the viewer needs to untangle to 'get it'. Pick one and let the rest fall to the side or away completely. Personally, I'd make the sentence as easy as possible (removing the UKism) to read and focus on the 'watt as watts' &amp; lightbulb elements. "Watt is his name" could work, because the question mark changes the meaning.</p>
      <p>2) I actually think your first lightbulb icon was the strongest. The newer ones seem to drift from the solidity of the first. I'd scale it back to the original and make subtler adjustments: Angle the thread, but don't narrow or widen the size of the period; in the U.S., the bottom of the threaded part is actually more of a trapezoid when seen from the profile. If that's true in the UK, then ditch the semi-circle. Perhaps try a thin weight for the hook in the ? because it's meant to represent the silhouette of the edge, and a thinner weight will make the lightbulb more obvious.</p>
      <p>I've created a quick digital sketch to give a clearer idea of what I'm saying. It emphasizes the lightbulb/wattage thing over the question mark/question thing and leaves the second layer as a reward for later examinations. (like the FedEx arrow) Here it is: <a href="http://currentconfig.com/images/watt_ex1.gif" title="http://currentconfig.com/images/watt_ex1.gif">http://currentconfig.com/images/watt_ex1.gif</a></p>
