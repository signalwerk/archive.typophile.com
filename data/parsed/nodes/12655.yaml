      <p>I like the mark...honestly, the second you said lightbuld I cringed, but I was surpised and relieved to see that you handled the image with such subtlety. I would not make the symbol any more obvious than it is...and from the rest of these posts i don't think that's a problem. I happened to see the lightbulb right off, but I guess I was looking for it.</p>
      <p>I wonder, though the image looks great and you have a lot to work with visually, is this really what you want to say about yourself as a designer? The question mark/lightbulb pairing sort of makes me think, "where/what's the idea?" It makes you look like an unsure designer, like you don't quite know what the product of your design process will be.</p>
      <p>I do like how you've played on the pronounciation of your name...it rings and catches, but it also raises more questions. What's his name? And in that case, where is he? and what does he do (since it isn't apparent that you're a designer through the mark alone, it actually looks like a lightbulb brand)?</p>
      <p>I don't mean to ramble. In sum I think visually its handled pretty sweetly, but conceptually I'm not sure it's the best idea to raise questions with your identity. The client probably wants to know you'll be answering the questions, not asking them.</p>
