      <p><a href="http://www.onewatt.co.uk/wattsisname/WattId27May.jpg" target="_blank" rel="nofollow"> Ok here's the latest developments </a></p>
      <p>I've tried to deal with some of the issues you have all raised, specifically: </p>
      <p>1. The readability of 'what's his name'<br>
      After many different configurations and positioning of the apostrophies and word spaces, i've decided that maybe it reads best without any at all? I think the emphasis of 'Watt' is enough to communicate that it is my name, and the rest makes sense as you read it (I think!). It also looks cleaner.</p>
      <p>2. The legibility of the pun in the mark.<br>
      The mark has been developed from idea b with the 3 diagonal threads. Good point about the printing problems Tim, I've addressed this by making the mark quite large in scale and scrapping the version where the mark is the same size as the letters. I've also made the lines thicker and reversed them so that there are two clear yellow lines rather than 3 white ones.</p>
      <p>Jay, I think you're right about the FedEx thing and there definitely is an issue about my mark being a question. There's something about it I like though too - a question mark seems to be quite powerful - it grabs attention and forces investigation. Imagine a box with a question mark on the outside, it kind of says 'look inside me', if you know what I mean? I've been thinking about it and there are other positive points too and something quite ironic and interesting about making a mark out of something that almost asks 'where's the logo?'. It's almost an 'insert your logo here' statement. Anyway, I'm giving it another go but I may decide to drop it in the end.</p>
      <p>Dan, I'm in the design business.</p>
      <p>Thanks for your comments Paul. I'm partial to puns too. I love 'smile in your mind' design but I've heard widely varying opinions from a few professionals while on placements and from tutors etc. </p>
      <p>Here's a thought... how much does a pun improve a logo?</p>
