    html: |-
      <p>Thanks all again, it's great to get some more opinions and feedback. Interesting how some of you are reading my name as 'watts'. I suppose the grammatically correct way to deal with this is "watt's'isname" since there are two letters missing, the I and the H. I decided that two apostrophies was ugly and hindered the reading dramatically but perhaps I've dropped the wrong one.</p>
      <p>I've tried your suggestion Dan, and a few variations on the apostrophe placement in the file attached.</p>
      <p>Jay, It's a good point but I'm not too concerned about being subtle. The logo is something that will be seen over and over on any correspondence and so there's a lot of time for the idea to emerge. The <a href="http://www.onewatt.co.uk/wattsisname/globalhome_fedex_corp_logo.gif" rel="nofollow"> FedEx Logo</a> (famous 'subliminal arrow') is a good example of a subtle, almost hidden, extra and I quite like that idea.</p>
      <p>Jtyler, this really is a good point - one which I've struggled with since I got this idea. In some ways, a question mark is positive because it represents the problem solving process . . . But it also represents a problem - which is negative. It certainly gives off a message of uncertainty. As an icon, however, it raises the question 'where's the idea' - a perfect representation of my work as a positive question . . . because most of my work is based on a central idea and not just aesthetic or style. It could be almost a motto, as what I do is search for the idea - the solution. </p>
      <p>You raised the issue of what do I want to say... well I want to say 'I am a good designer', and in my opinion, good design is design with an idea at the centre. I want to communicate an ability to 'see' things differently, expressing clever visual thinking and a high quality of execution.  </p>
      <p>That's fine when it's explained though and you're right, what I should be saying is 'here are the ideas'or 'i have the ideas!'. Maybe I will drop the whole question mark icon - bulb thing and go with a logotype. The Watts'isname idea is quite strong on its own I suppose. Anybody got any thoughts?</p>
      <p>The main target audience for this identity is slightly uncertain because I'm putting toghether self promotional materials to try and get a job rather than finding more clients. Ideally I need something that works for both. I've thought about this and decided that designers will be impressed by good, effective design so if I concentrate on the clients as the main audience, the identity should work for designers as well.</p>
      <p>Anyway, I've linked to two files, one working on the mark:</p>
      <p><a href="http://www.onewatt.co.uk/wattsisname/wattIdMark25May.jpg" rel="nofollow"> Mark development</a></p>
      <p>and this one for the logotype:</p>
      <p><a href="http://www.onewatt.co.uk/wattsisname/wattIdLogotype25May.jpg" rel="nofollow"> Logotype development</a></p>
    html_clean: |-
