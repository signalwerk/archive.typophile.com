      <p>Do you have a couple other books that you think are useful? I'm really interested in the mechanical aspects of creating fonts. There are quite a few books on general type design (at least I'm pretty sure there are).</p>
      <p>What I need is a book or two similar to Cheng's. One where specific relations between letters are spelled out. I know such things vary per font but Cheng did a pretty good job of distilling each letter in relation to their case and other characters.</p>
      <p>I don't need how to's on software, that's easy, just suggestions, if you have any, on books like Chengs.</p>
      <p>dglen</p>
