    <p>Ceggo is an exercise in spacing and horizontal letter size. It's the horizontal width relations between the characters that was my focus.<br>
    Only have uc and lc right now. I'm creating the font in Glyphs (it's a really great app, very smooth).<br>
    Let me know what you think.<br>
    I was shooting for a Bold or Demi Condensed. I've called it bold for now.</p>
    <p>Regards,</p>
    <p>dglen</p>
