      <p>hrant</p>
      <p>You have a good eye. The h was an oversite. You look at these things for so long that after awhile that you literally don't see some obvious errors.</p>
      <p>The "S" is somewhat in the same boat. I'll have to check but it might be a different version than I had in mind.<br>
      So skip the "S", skip the "h". The font is like and old typewriter with two broken keys.</p>
      <p>Regarding the horizontal width of the characters. I'm using a book called "Designing Type" by Karen Cheng as a sort of textbook. She really goes into detail as to the size of characters. I've learned a lot.</p>
      <p>If it doesn't make sense it's not worth belaboring. It does make sense to me but I may not be able to properly articulate the idea.</p>
      <p>Thanks for the feedback.</p>
      <p>dglen</p>
