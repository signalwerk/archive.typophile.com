    <p>The use, misuse and abuse of quotation marks:<br>
    <a href="http://www.cooper.com/journal/2010/12/who_are_you_quoting.html" title="http://www.cooper.com/journal/2010/12/who_are_you_quoting.html">http://www.cooper.com/journal/2010/12/who_are_you_quoting.html</a></p>
    <p>I recently wrote about the "strange" but "fun" practice that seems have reached a pop culture moment, which somehow both irritates and entertains many. I'd be curious to hear any reactions here on Typophile, or perhaps any historical insights. One commenter asked when the practice stopped being used for movie posting titling, such as:</p>
