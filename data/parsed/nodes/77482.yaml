    html: <p>qualitycontrol - I applaud your open mindedness. Perhaps I should not have described the article above as the "The use, misuse and abuse of quotation marks" because in no part of the article do I describe any of the examples as an abuse. However, they are certainly perceived that way by some. The Target signage using made up quotes within quotation marks is not exactly an acceptable formal practice. More importantly, typographically, it strikes me as really intriguing, not just because it's a trend, but also because of the way the meaning and perception of the phrase is so easily shifted.</p>
