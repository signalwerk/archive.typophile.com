    html: <p>Some of the uses people are labeling as abuses seem perfectly fine to me, the target ads in your post for example. It seems obvious to me that they are being employed to identify a faux-testimonial, customers thinking the prices were "unbelievable" or "surprising," i.e. doing what quotation marks are for, quoting.</p>
