      <p>André - Thanks for reading and very good point. I struggled with that idea before finally posting because technically you're correct by some definitions. The term "scare quotes" though seems to have been expanded a bit from how it was originally coined. For example, when <a href="http://micusp.elicorpora.info/micusp-kibbitzers/1-scare-quotes-in-micusp-some-prelimin" rel="nofollow">studying scare quotes in collegiate writing</a>, the researchers laid out a set of characteristics that defined scare quotes as "uses of quotation marks that are not standard in the same way." (see link) It's possible I misunderstood them, you're welcome to double-check. I felt as though that practice was repeated elsewhere, however. When Greil Marcus was talking about scare quotes at the Harvard University Press Blog, he didn't define them, but did use the term in a variety of ways that I believe exceed how "scare quotes" are defined in a strict sense.</p>
      <p>In the end, I didn't think it was my place to invent a new, unused term for different kinds of quotation marks, but rather simply discuss them as they are currently being used in design using common language. As I point out in the article, a lexicographer did attempt to invent a new term -- "shout quotes" -- but received a lot of hateful comments for it; and that's his job.</p>
      <p>You're welcome by all means to call them "emphasis quotes" or "shout quotes", I just used language that I felt was commonly being used to describe them.</p>
