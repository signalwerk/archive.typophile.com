      <p>Hi Ivan,</p>
      <p>yeah, basically you’re right: This is ‘Kurrentschrift’, the ‘broken’ script that was used in Germany until it got banned, together with Fraktur and the other ‘broken’ typefaces, in the 1940s. [See here: Wikipedia on <a href="https://web.archive.org/web/20081007002012/http://de.wikipedia.org/wiki/Deutsche_Kurrentschrift">Deutsche Kurrentschrift</a>]. It still can be seen now and then in old people’s handwriting.</p>
      <p>And yes, Sütterlin is a reformed version of it; upright, with a larger x-height.</p>
      <p>Some remarks: The ‘N’ in Narrenturm looks like ‘St’.<br>
      And: you left out the word Operation<!--
