    <p>I am trying to replicate what a hastily scribbled note on the back of the business card would look like, if it were written some time between 1880 and 1910 by a well-educated German. It isn’t meant to be legible, but needs to look fairly authentic.</p>
    <p>Now, my knowledge of German is limited to the prase “Hände Hoch”, and what little reaserch I managed, is based on conjecture and automatic translations. Anyway, from what I could find, it seems that I need to use a version of the script that came before the spread of <a class="freelinking-external" href="https://web.archive.org/web/20081007002012/http://en.wikipedia.org/wiki/S%C3%BCtterlin">Sütterlin</a> which became popular after 1915. I’ve compiled a short sampling of handwritten notes from before that period, and tried to combine them with some letters from the <a class="freelinking-external" href="https://web.archive.org/web/20081007002012/http://www.waldenfont.com/product.asp?productID=8">Kurrent Kupferstich</a> font to get enough variation in repeating glyphs.</p>
    <p>Here’s what I got. Am I completely off the mark?</p>
    <p></p><div class="imageWrap"><img src="/web/20081007002012im_/http://www.typophile.com/files/German_6166.png"></div><p></p>
    <p>The German text is supposed to read:<br>
    Wo: Der Narrenturm, Operationssaal<br>
    Wann: 12. Januar, 9:30 Uhr<br>
    Ohne Fleiß kein Preis.</p>
