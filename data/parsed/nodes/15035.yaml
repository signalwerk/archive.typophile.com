      <p>Yes, Filosofia has a good unicase. </p>
      <p>Your post about unicase reminded me of a part in Simon Loxley's <a href="http://www.eyemagazine.com/review.php?id=119&amp;rid=549">Type: The Secret History of Letters</a>. So here's a little tangent that might help you decide which uppercase to drop in favor of lowercase or vice versa in your unicase design.</p>
      <p>Loxley talks about Bradbury Thompson's <a href="http://www.pbtweb.com/alpha26/alpha.htm">Alphabet 26</a>, his project to combine upper and lowercase letters into one consistent set of letters (in essence unicase). Thompson had felt that the variations between upper and lowercases of the same letter were too inconsistent and made it hard for children to learn to read. He eradicated most of the lowercases, except for a, e, m and n.</p>
