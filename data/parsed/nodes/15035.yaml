    <p>In my Typography class we have been asked to create a <a href="/node/39870" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">unicase</a> font, I've already got a rough idea about what that is. I've looked at examples and looked on the internet, but alas I can not find the information that I want (all I find on the internet, is UNicase fonts to download) </p>
    <p>I know that it's a full set of 26 letters that has upper and lower case letters (whichever you want to pick) but what it looks like is that all the letters... weither they be upper or lower case, all take up the same space (same x-height?) anyways, can anyone help me with this problem?</p>
    <p>For give my lack of Typography know how... I'm a newbie to all this, but I'm on the road to learning... and slowly developing a love for type.</p>
    <p>Thanks</p>
