      <p>Indeed, "strategy", but to me that applies more to the functional realm - a unicase font doesn't have to have style as its only/main objective. In fact, Thompson and Cassandre (Peignot) were both after <cite>improvement</cite>, not fashion: the former like Dana said, the latter because he felt -not without reason- that the lc forms were "bastardized" and he wanted to return to the more dignified uppercase roots*. So one can make yet another pretty font, or one can try to "serve" users.</p>
      <p>* See my "Improving the Tool" for more on that.</p>
      <p>hhp</p>
