      <p>Alphabet 26 is not the only unicase strategy to consider.<br>
      How about a "Peignot" version of Bodoni, Times, etc.?<br>
      And there are other strategies. You may even invent your own.<br>
      The choice of "donor" typeface might have something to do with how your design evolves.<br>
      When I taught the unicase course, I was always thrilled by the wide variety of design solutions that students came up with for the same brief.</p>
