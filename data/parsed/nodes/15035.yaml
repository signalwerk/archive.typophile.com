    html: |-
      <p>If that is a direct quote from your professor, no wonder you are confused.  ;)</p>
      <p>You mention width.... Make the widths such that the shapes match; i.e. the letters will all have different widths, but when you combine them, none will look weirdly narrow or wide. Do not try to do what Nick Shinn has done and make them monospaced as well. One thing at a time. </p>
      <p>A more important thing to worry about is the weights of the strokes. If you started with UC letters and scaled them down to match the heights of the lowercase, you would have a few letters looking light and small. You'll have to beef up the serifs, stems, and hairlines of the scaled-down letters. </p>
      <p>You might pick a font with small caps already supplied, so there will be less work matching the weights. There is likely to be some difference in height between lc and small caps, though. </p>
      <p>For a very clear example of a unicase font, take a look at <a href="http://www.emigre.com/Volume.php?p=UPEMFILFM">Filosofia</a> from Emigre. Licko has made a regular family of fonts and added a unicase one for fun. </p>
      <p>It's your call whether the new alphabet is x-height or cap height. Just consider how it will look in use.</p>
