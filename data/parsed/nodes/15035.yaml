      <p>It sounds like you mean monowidth, not unicase. That's a font where all the characters take up the same width (not related to x-height). Typically such fonts are used for setting computer programming code, if also to convey the programmatic.</p>
      <p>And I hope that's the case, because unicase fonts are generally<br>
      quite useless (although Panoptica manages to avoid that fate).</p>
      <p>hhp</p>
