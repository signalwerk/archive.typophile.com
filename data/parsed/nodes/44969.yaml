    html: '<p>It is refreshing to see Roman lettering used well on a web-page. I feel the overall effect is pleasing and the javascript opening captions under the figures is fun. Perhaps the page needs a bit more contrast in size between the large and small images and fonts. The colors are too cool: gray lettering  on a gray background with that pale blue gives a cold feeling. I wish Typophile will change that combination too. Let in some of that famous Tuscan sunshine. When you are finally happy with the result why not submit your css concepts to <a href="http://www.csszengarden.com/" title="http://www.csszengarden.com/">http://www.csszengarden.com/</a> ?  Good luck.</p>'
