      <p>You have what they call 'scroll blockers': horizontal elements at the point where it might be bottom of the web browser in a lot of windows. It can cause people to not register that there might be more content below. Something to keep in mind.</p>
      <p>As for the pattern, well, for me, yes, it's jarring and makes it hard to read the type easily.</p>
