    <p>Hello,</p>
    <p>I've redesigned my portfolio recently and I was kinda hoping that you could take a look and share some thoughts on it from the typography point of view.</p>
    <p>Here is the link: <a href="http://designr.it" title="http://designr.it">http://designr.it</a></p>
    <p>Is it pretty/pleasing/readable? Do you like it? What impression do you have seeing it for the first time?<br>
    I'd appreciate any comments on it.</p>
    <p>Kind regards,</p>
    <p>Piotr</p>
