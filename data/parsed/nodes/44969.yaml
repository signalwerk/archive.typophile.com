      <p>It's very nice. I'd suggest two changes:</p>
      <p>1) loose the patter as a background to the text (maybe set all text in a flat color background)</p>
      <p>2) Reverse the content hierarchy. Your work should be the primary focus. Right now, when the page loads, it's all the 'meta' info that has the primary focus, with your actual work way down at the bottom of the scrollbar.</p>
