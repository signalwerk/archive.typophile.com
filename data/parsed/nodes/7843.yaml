  html: "<p>I finally figured out that to build a nice quirky sans face, the first thing  you have to do is figure out the curves in the letters 'b, c, d. g, j, o, p, q, r, and s' Once you get those curves down, then you are in business. I wish somebody would have told me this months ago. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":)\"> <br>Back to the post about 'how do you build a face,' I would suggest making a lot of elliptical and rounded square shapes (unite/pathfinder a semi-circle on the end of a square). Then empty the fill and work off the stroke, but don't create outlines....always keep the outlines so the weight can stay consistent. When the face is finished, make sure your weights are consistent before you join and outline, or outline and unite. <br>Always save a copy of the beziers off to the side for tweaking. <br> <br>Here's apollo sans. Any feedback is welcome. <br> <br>bj <br><!---Attachment: apollo.swf-!--></p><center><table border=\"1\"><tbody><tr><td><img src=\"http://www.typophile.com/forums/icons/mime_gif.gif\" align=\"LEFT\" alt=\"application/x-shockwave-flash\">apollo.swf<br><a href=\"http://www.typophile.com/forums/messages/29/apollo.swf\"><b>apollo.swf</b></a> (22 k)</td></tr></tbody></table></center><!---/Attachment-!--><!--!-/attachment-!--><!--!-attachment:--><p></p>"
  html_clean: "<p>I finally figured out that to build a nice quirky sans face, the first thing  you have to do is figure out the curves in the letters 'b, c, d. g, j, o, p, q, r, and s' Once you get those curves down, then you are in business. I wish somebody would have told me this months ago. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":)\"> <br>Back to the post about 'how do you build a face,' I would suggest making a lot of elliptical and rounded square shapes (unite/pathfinder a semi-circle on the end of a square). Then empty the fill and work off the stroke, but don't create outlines....always keep the outlines so the weight can stay consistent. When the face is finished, make sure your weights are consistent before you join and outline, or outline and unite. <br>Always save a copy of the beziers off to the side for tweaking. <br> <br>Here's apollo sans. Any feedback is welcome. <br> <br>bj <br><!---Attachment: apollo.swf-!--></p><center><table border=\"1\"><tbody><tr><td><img src=\"http://www.typophile.com/forums/icons/mime_gif.gif\" align=\"LEFT\" alt=\"application/x-shockwave-flash\">apollo.swf<br><a href=\"http://www.typophile.com/forums/messages/29/apollo.swf\"><b>apollo.swf</b></a> (22 k)</td></tr></tbody></table></center><!---/Attachment-!--><!--!-/attachment-!--><!--!-attachment:--><p></p>"
