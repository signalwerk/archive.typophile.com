    html: <p> For getting rid of points, probably the best way is the "Merge Points" command (Cmd-M, under the "Points" menu). But make a copy of the original form in the Template layer beforehand, so that you can adjust the new form to something closer to the original (Fog doesn't do the best job with Merge). <br> <br>Another way is by using "Simplify Curves", but that's much harder to control. <br> <br>hhp </p>
    html_clean: <p> For getting rid of points, probably the best way is the "Merge Points" command (Cmd-M, under the "Points" menu). But make a copy of the original form in the Template layer beforehand, so that you can adjust the new form to something closer to the original (Fog doesn't do the best job with Merge). <br> <br>Another way is by using "Simplify Curves", but that's much harder to control. <br> <br>hhp </p>
