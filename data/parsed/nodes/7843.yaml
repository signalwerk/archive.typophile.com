    html: "<p> You have some interesting strokes and structures, but I think the font could benefit from some smoothing and balancing of the curves, particularly on the \"B\", \"J\", \"R\" (short-tailed version, especially -- maybe try cutting the tail's terminal obliquely?), \"S\", \"3\", \"5\", and, to a lesser extent, on the \"2\" and the tail of the \"Q\" (same suggestion as the \"R\"). <br> <br>The font as a whole seems as though it wants to be a geometric sans, but isn't quite making it. <br> <br>I'm also not sure you need the slight vestigal serifs on the tops of \"C\" and \"G\". <br> <br>The upper arm of the \"K\" could be pulled back in a bit, too, to keep it from looking top-heavy. <br> <br>The vertices of the \"N\" are bothering me a bit as well. In fact, I think it might work better with the rest of the font if it were simply inverted, placing the sharper vertex at the bottom right and the blunter vertex at the upper left. <br> <br>Final suggestion: tone down the horizontals of the brackets a bit, to keep them from looking heavier than the rest of the font. <br> <br>As far as the structures go, I really like the direction you're exploring. I've always thought that a geometric face should at least be playful with the geometry, or why bother with it at all? <br> <br>The \"G\" with a descending tail and double-V \"W\" are favorites of mine, and I also very much like your construction of the \"8\". </p>"
