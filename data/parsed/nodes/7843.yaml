    html: <p> David - Thanks for the comments. <br> <br>* some of the widths are off, evident when I type in certain words. <br> <br>* Definitely, the curves need some work. I noticed that when I dropped it into Fontographer, I chose clean up points, insert points at extrema and it messed up some curves. For example, zoom in on the 'O' and look at the counter. It used to be perfect, now it's nasty. I am now deleting stray points with the minus (pen) tool, though it takes longer. Anybody know a shortcut to remove strays but keep the basics intact? <br> <br> - I like your suggestion on the 'R' <br> <br>* I'll pull that K arm in. <br> <br>* Can you point me to any geometric sans in particular? <br> <br>* I'll see how the 'N' looks flipped. <br> <br>* the brackets were just bracketed on, not intended to match the face. Kind of like the movies where the words don't match the lips. <br> <br>Thanks David. <br> <br>Great to see you back. </p>
    html_clean: <p> David - Thanks for the comments. <br> <br>* some of the widths are off, evident when I type in certain words. <br> <br>* Definitely, the curves need some work. I noticed that when I dropped it into Fontographer, I chose clean up points, insert points at extrema and it messed up some curves. For example, zoom in on the 'O' and look at the counter. It used to be perfect, now it's nasty. I am now deleting stray points with the minus (pen) tool, though it takes longer. Anybody know a shortcut to remove strays but keep the basics intact? <br> <br> - I like your suggestion on the 'R' <br> <br>* I'll pull that K arm in. <br> <br>* Can you point me to any geometric sans in particular? <br> <br>* I'll see how the 'N' looks flipped. <br> <br>* the brackets were just bracketed on, not intended to match the face. Kind of like the movies where the words don't match the lips. <br> <br>Thanks David. <br> <br>Great to see you back. </p>
