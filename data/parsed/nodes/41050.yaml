      <p>As nobody has posted anything yet I thought I’d drop my 2 pence.<br>
      This logo isn’t really working for me. I might even say that I think that the name is a bit too obvious and design is always aimed at communication so the tagline also doesn’t really work I think. If you use a name like that you can use a nicer tagline.. even something like “making things looks pretty” (was it Sagmeister who said that as an explanation of his work??), improving your view, enhancing your vision (maybe these aren’t too great, but I just mean you can probably write something a bit more witty if you take some time to think about it).<br>
      You might also want to do some more mapping of other things that have to do with sharp eyes (blurry vision vs sharp vision). I’m not sure if the lettering works well inside the eye. You could also perhaps draw an eye (or even photograph a real eye or eyeball) and use that as a mark with “Sharp Eyes” written underneath.</p>
      <p>I think you need to experiment a bit more and try not to make everything too obvious. Also write down how you want your company to feel, what does it want to express. Just a few keywords to give yourself a certain feeling to what you want the logo to express.</p>
      <p>good luck and hope to see some more examples of different styles.<br>
      dav(2)</p>
