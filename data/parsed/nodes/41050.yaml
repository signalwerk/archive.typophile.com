      <p>Hi Dave,</p>
      <p>Thanks for the feedback.  I was beginning to wonder if I’d violated some typophile unwritten law about posting!  Your comments make a lot of sense.  I chose a name that has personal meaning for me as it was a nickname my dad gave me when I was young.  I have a background in copy editing and typesetting as well as design, so the name is a hint at that.  I want a logo that has a corporate feel as those are the clients I seem to get, but you are correct in that I’m being a bit obvious/safe.  My thinking was that “blurry vision” didn’t really give the connotation of  a company “sharp, exact, precise and on their game.  I used the tagline because I thought graphic design was a bit too common.  Anyway, I posted for exactly this kind of feedback, so I’m back to my sketchpad!</p>
      <p>Thanks Dave, I’ll post again when I have something relevant to present.</p>
      <p>Russell</p>
