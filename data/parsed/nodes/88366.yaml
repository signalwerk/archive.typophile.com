  html: |-
    <p>Dear all,</p>
    <p>I am currently in midst of designing a new form for the social security office of the city of Gothenburg in Sweden for the application of financial benefits. The situation of government related documents in Sweden is rather unique, since there are no centralised designs or house fonts and every county can decide on their own forms.</p>
    <p>The form is double-sided A3 sheet, which is folded in the middle and has been designed in constant feedback with both social security workers and benefit seekers. However, I am still looking for a suitable font.</p>
    <p>The font needs to be a sans serif which works well in small sizes (8pt for the most part). Apart from the disclaimer at the end, it will not be set in continuous text, but rather in single lines underneath the boxes to fill out. It should have a somewhat accessible nature and needs to include the standard Swedish letters Ö, Ä, Å. </p>
    <p>There is a large group of benefit seekers with an immigrant background so there will be a filling out help which is translated into Arabic and possibly Somali. If the fonts has some fitting equivalents in these languages it would be a huge benefit.</p>
    <p>Hope any of you might have some knowledge about design of forms or for governments and can help me with this.</p>
    <p>Thanks in advance.</p>
