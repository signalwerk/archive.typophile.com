    html: |-
      <p>All Somali orthography I've seen in Sweden has used Roman type, with the only special character being a prime mark glottal stop. Other languages that you'd generally see translations into include Finnish, Farsi, Spanish, Albanian, Polish, Sorani, Latin-orthography Serbian and perhaps some Cyrillic-alphabet ones, perhaps even Mongolian. So wide character set in both Arabic and Roman (and maybe Cyrillic) is a good policy.</p>
      <p>A really bloody-literal-minded government agency might even include Hebrew-alphabetted Yiddish, which after all is one of our five official national minority languages...</p>
      <p>edit: Oh, and Thai is a definite, slightly scary prospect. You should probably check out exactly what translations will happen before settling on a font.</p>
      <p>edit 2: the national social insurance agency (Försäkringskassan) has all the languages above, including Thai and Russian (but not Mongol or Yiddish), Nothern Sami (hello ŋ!), Dari, Turkish, Kurmanci as well as, to make it even harder, Tigrinja.</p>
