    html: |-
      <p>In one of the last public interviews Johnny Cash ever gave was with the King ... Larry King. Cash was asked who was the greatest country singer ... Cash said without hesitation ...Dwight Yoakam. </p>
      <p>I own pretty much near everything Yoakam has put out including his most remarkable 4 CD collection Reprise Please.</p>
      <p>This guy is 100% pure honky tonk country ... and also does an amazing job putting his style on any cover his has ever done ... Suspicious Minds is one of my favs for sure.  Songs like Thinking About Leaving, Bury Me, Two Doors Down, Love caught up to me, etc., etc.. ... I really can't express strong enough how this guy IS country and Honky Tonk ... old skool &amp; nu skool too!!</p>
      <p>At the heart of most every pure honky tonk / country song is a heart felt sense of humor... an incredible wit, a twist of phrase, a chord progression, even right down to the threads they wear Buck Owens as an example ... Dwight Yoakam is all of that too!</p>
      <p>Dwight Yoakam is a national treasure ... nuff said.</p>
      <p>As for my most awesome honky tonk graphic ... sorry but a day later on I still think it's awesome but even more so :)))</p>
      <p>Great linkage!! Thanks :)</p>
      <p>n.</p>
