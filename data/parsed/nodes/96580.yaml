    <p>So, I know a guy. He's a filmmaker by profession and, much like me, a total loon. We have collaborated on and off for the past thirty years or so on a number of minor film projects, on a variety of important subjects. Basically, I get a lot of creative freedom, designing the promotional material, and he promises to pay me, but never does. Which is cool, I suppose. Like I have a choice.</p>
    <p>Anyhow, he's got a new project in the works on the subject of alcohol-free Texas redneck rock…or something to that effect. The working title is <strong>RENEGADE HEARTS AND HONK-TONK NIGHTS</strong>, and here are a few clips…</p>
    <p><a href="http://www.youtube.com/watch?v=qka-WjP1KBs&amp;feature=plcp" title="http://www.youtube.com/watch?v=qka-WjP1KBs&amp;feature=plcp">http://www.youtube.com/watch?v=qka-WjP1KBs&amp;feature=plcp</a><br>
    <a href="http://www.youtube.com/watch?v=6_CN48ZCYMY&amp;feature=plcp" title="http://www.youtube.com/watch?v=6_CN48ZCYMY&amp;feature=plcp">http://www.youtube.com/watch?v=6_CN48ZCYMY&amp;feature=plcp</a></p>
    <p>Anyone up for designing a logo and promotional material for no pay? At present, I just have a little too much on my plate to devote the time and attention necessary. Of course, any Nick's Fonts you might need for the project would be on the house. Let me know…</p>
