  html: |-
    <p>Sistina is a metal titling typeface designed by <a href="/node/12150" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Hermann Zapf</a> for <a href="/node/12158" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">D. Stempel <span class="caps">AG</span></a>. The design was later converted to digital format by <a href="/node/13697" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Linotype</a>, and can be found <a href="http://www.linotype.com/56642/sistinaregular-font.html">here</a>.</p>
    <p>In 2005, as part of his <a href="/node/16863" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Palatino nova</a> family, Hermann Zapf redrew and extended Sistina, renaming it Palatino nova&nbsp;Imperial.</p>
    <p>View <a>Palatino nova Imperial on the Linotype website</a>.</p>
    <p>Please go to the <a href="/node/16864" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Palatino</a> entry for more&nbsp;information.</p>
