      <p>Eben,<br>
      I go back and forth between interletter spacing and glyph refinement. I don't think either is ever done. I don't just draw glyphs and then just do metrics. Sometimes what looks to me like a kerning issue works out to be an adjustment to the outlines of a few glyphs. What I find helpful is looking at multiple neighbor combinations. Some of the pages in my PDF are just permutations of letter combinations.<br>
      I don't have very fixed methods and patterns of working. I don't base judgments on theories others have come up with. I pretty much just use my eyes.  The trick is not to get too rigid. This may not work for other people. It also may not work for a revival where you are trying to get inside the head of the original designer.  Everyone needs to find what works best for them.</p>
      <p>ChrisL</p>
