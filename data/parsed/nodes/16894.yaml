    <p>Continuing the saga of NOW and following on the heels of <a href="https://web.archive.org/web/20150123031719/http://typophile.com/node/16147" rel="nofollow">NOW Light</a> comes the first sequel "NOW Bold--The Dark Side Menace!"</p>
    <p>Attached below is a PDF from Dec. 27. I corrected superior and inferior numbers and a few other characters. The fractions now build out of OTF.</p>
    <p>Comments are welcomed from one and all (See the white glyphs come over--to the Dark Side)</p>
    <p>ChrisL</p>
    <p></p><div class="imageWrap"><img src="https://web.archive.org/web/20150123031719im_/http://typophile.com/files/now-dark-side.gif"></div><p></p>
    <p>See last PDF called "NOW_boldnLight2-22a.pdf"  for latest changes as of 2-21-06<br>
    Made corrections based on William Berkson's suggestions.</p>
