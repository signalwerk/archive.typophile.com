      <p>I am still being very impressed with the whole thing! I think Terry's comments about contrast are right. I think having just a little bit more contrast despite the monoline nature here &amp; there would add some sparkle that I find desirable ( and probably increased legibility ) - especially in bold weights. 'Now light' has a distictive flavour that I miss in the bold. It's as if the font is getting watery in the bold. No matter what you decide about the main forms re: contrast, I really want to encourage you to look at the diacritical marks. This part is me going out on a limb because I am utterly new to the issue - but thats said - my admittedly inexperienced eye seems to prefer more contrast in diacritial marks *especially*. I think that this is because they need to communicate well in a smaller space than a full letter or something like that.</p>
      <p>A probably minor point. On page 4 of the PDF the word 'Woman' appears &amp; the spacing between W and O is really apalling. I am guessing that this is because the kerning isn't done or maybe even started.</p>
