      <p>Thanks Nick!<br>
      You are right, I'll fix the ones and fours (and the dreaded 3:-).<br>
      I don't know that I need the f-ligs either but I thought I would put them in because they are "expected" to be part of an OTF family (the user can just turn them off I guess). Also, since this is an axis weight, I thought it best to include them to generate the middle instances.<br>
      I'll pull the lc diacritics down some as you suggest.<br>
      When you say "l-slash more discreet" do you mean the slash is too long or too bold?<br>
      My O slashes are not done yet. I did not even mean to post them.  You are quite right, they look way over-the-top as they are now.<br>
      Regarding using the Extra-bold or Black as the axis--my experience with Leporello taught me that there is a "hump" in the weight range after which different corrections are required (the vertical sides of curves need to be more vertical, more points, and trapping is needed). I fully in tend to do a black weight but will do it after the others are done. I am hoping this will save me time correcting the middle weights. This is my plan but I might be wrong. I'll let you know either way.<br>
      ChrisL</p>
