      <p>I'm very impressed, Chris.<br>
      The balance of stem weights across case and style is something you do nicely.</p>
      <p>A few minor things stand out.<br>
      The 1 seems a bit too pointy on top, compared to the general feel of the face (the OSF version is better).<br>
      The 4, too, is a bit pointy on the left.<br>
      The waist of the Oldstyle 3 seems a bit high.</p>
      <p>I'm not sure you need f-ligatures. </p>
      <p>Your accents could sit lower on the lower case -- the way they align at the top is disconcerting in the slavic, especially when the UC accents are so close. Maybe try the "bottom alignment" strategy.</p>
      <p>The l-slash slash could be more discrete.<br>
      (Your ogoneks rock, dude -- that fine stroke detail is not amiss.)</p>
      <p>The O-slashes too -- I think the slash only needs to protrude a little, and be even on each side.</p>
      <p>***</p>
      <p>It's a good bold weight, but I'm puzzled why you wouldn't do the Extra Bold first, as the more extreme end of your weight axis. I seem to recall that your other sans face had a very heavy bold.</p>
