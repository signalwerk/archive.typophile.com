    html: |-
      <p>Thanks Terry! I have been fighting with the contrast for weeks.  The hard part about doing a family is that you have to make total family allowances even if some of the weights are not as successful as others.  I purposely made this bold more bold than its needs to be so that I had a fair extreme for the MM transition.  By the way, I started with the FL Bold technique and soon after dumped it because it was so bad.<br>
      Since I am trying for the appearance of a monoline family, I did not push the contrast as much as if I were doing a bold alone.  My guess is that I will have to revisit this bold version after I do the in-between weights.  There are things you have to do to keep extremes of a Multiple Master face compatible so that you don't just get a mash of junk for each instance.</p>
      <p>I always do Small Caps.  I like to give the user plenty of options.</p>
      <p>Thanks for your help! Keep coming back and check on my progress.</p>
      <p>ChrisL</p>
