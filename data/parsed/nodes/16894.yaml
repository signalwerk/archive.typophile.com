      <p>&gt;When you say “l-slash more discreet” do you mean the slash is too long or too bold?</p>
      <p>I think it sticks out too much.<br>
      In my experience, the l slash does not have to be such a demonstrative accent as the others, and I think the reason for this is that no other accent appears in the middle of the "l", whereas other accents appear in positions that are common to more than one.<br>
      So for the l-slash, all you have to do is offer the indication that "there is an accent here", and not be concerned with showing exactly what its form is. Perhaps rotate it a little counter-clockwise.</p>
