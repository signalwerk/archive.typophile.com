    date_raw: 15 Mar 2004 — 9:59am
    votes: null
    html: <p>You're right that the MLB logos are custom. Some were designed by artists long before digital fonts; some were designed my digital font designers for the Leagues or Teams, but the safe assumption is that few of them are going to be found in actual fonts, although sometimes you might find something close (Like using <a href="http://www.myfonts.com/Search?searchtext=Quentin" target="_blank">Quentin</a>, or a similar font for the Red Sox). <br> <br>We have talked about having an FAQ for this, since we get so many questions about commercial and Sports logos, and almost all of them are custom artwork or custom fonts in order to increase the exclusive marketing potential and/or identity aspect of the logo. <br> <br>If anyone could easily duplicate any look, the Sports teams would lose millions in souvenir sales and corporations would be suing people for trademark infringement (which does happen anyway).</p>
