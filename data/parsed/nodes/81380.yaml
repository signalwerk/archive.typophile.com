    html: <p>The lifespan of an inkjet cartridge is measured in pages. The lifespan of a laser cartridge is measured in thousands of pages. And they don't streak, clog, etc. I actually used a color laser printer for most of my drafts in art school and saved a fortune over kids who used inkjets.</p>
