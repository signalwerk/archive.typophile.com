      <p>Except from the text printing quality, there are two things, which are important with regard to the prints of text in my opinion:</p>
      <p>1. The duplex precision, because I think duplex is important for real proofing.<br>
      2. The mechanical resistance of the toner.</p>
      <p>Both is poor in case of my Samsung. I cannot fold the paper after the print without damaging the toner. It may sound freaky, but I am using an electric iron for reinforcing the toner in the edge of the folded paper (naturally only on the unprinted back!). Unfortunately the printer test magazines (online and printed) are very rare. The focus is often on the speed or other things, which are totally unimportant in my opinion. If the printer prints excellent, I would be even willing to wait twenty seconds per page. But I don’t need a printer, that prints 30 pages per minute or more. I have heard, that Lexmark is very good with regard to the mechanical resistance of the toner (document-quality). Nevertheless I am happy with my Samsung.</p>
      <p>If anyone knows magazines, that thoroughly test laser printers, I am very interested.</p>
      <p>By the way, Druckerchannel also has tested a cheaper Samsung B/W laser printer. And its text prints look better than the prints of my Samsung on the fotos, that are taken with the help of the microscope. For some of you it may sound abstract, to proof the quality with a microscope, but I think only in this way you can check, how big the equivalence of printed letter and the letter on screen is. If the aim is, to reproduce a letter in print as close to the original outline as possible, the microscope is very useful in my opinion. Unfortunately I only know Druckerchannel, that uses a microscope for the tests.</p>
