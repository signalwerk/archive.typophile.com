      <p>It IS common practice of printer manufacturers to initially load up printers with cartridges that contain far less toner (or ink, in the case of inkjets) than the regular ones you need to buy after the first ones run out. In some countries it is mandatory to point this out in the sales/promo material (I have seen instances where the difference was three or four times). You should look into that.</p>
      <p>(Isn’t it wonderful that for some models, in combination with promotions/rebates buying a new printer is cheaper than buying a full set of ink/toner — and that the manufacturers have ‘corrected’ this anomaly by reducing the load of the first run cartridges? That’s capitalism in optima forma!)</p>
