      <p>Short answer: Laser printers are more economical to operate than inkjet printers in the long run.</p>
      <p>Longer answer:<br>
      In general, even the smallest laser printer toner cartridges last much longer than the ink tanks in desktop inkjet printers. For a single user, one toner cartridge can easily last over a year, though using it for type design proofing might be more intense. They won't gum up when left unused the way idle inkjets are prone to do, but there are some internal parts that have to be maintained, and under certain circumstances replaced, like the imaging drum. Those aren't cheap, but they're less than the whole printer. Just be sure to read the operator's manual thoroughly. A good laser printer, properly maintained, can provide reliable service for about a decade, sometimes more.</p>
