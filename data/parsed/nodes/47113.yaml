      <p>I made something like this once before. </p>
      <p><a href="http://designrelated.com/portfolio/darintenb/page/1/entry/8375" title="http://designrelated.com/portfolio/darintenb/page/1/entry/8375">http://designrelated.com/portfolio/darintenb/page/1/entry/8375</a></p>
      <p>All I did was put all the text in a layer in Photoshop with the original photo in another layer.  Right click on the layer with the text and click select pixels.  Then invert the selection and change to the layer with the photo.  Hit delete and all the pixels that aren't the text will be erased leaving only the portions of the photo where there was text.  Hide the original text layer and presto, you've got what I did.</p>
