      <p>Well, here is how I would do it:</p>
      <p>— Create a new image in Photoshop with a white background and drag in the picture to which you want to apply the effect.</p>
      <p>— Duplicate the layer containing your chosen picture and set the opacity of the bottom one to about 10%</p>
      <p>— Create a layer of text that covers your subject matter, filling it with whatever text you please.</p>
      <p>— Right-click (or control-click) on the text layer in the Layers Palette and select "Create Work Path".</p>
      <p>— Select the top picture layer (the one at 100% opacity) and then go to the menu bar and choose Layer&gt;Vector Mask&gt;Current Path</p>
      <p>— Hide the text layer by clicking the little eye next to the "T" in the Layers Palette and you're done! (Just click on the background layer to get rid of the outline of the vector mask)</p>
    html_clean: |-
