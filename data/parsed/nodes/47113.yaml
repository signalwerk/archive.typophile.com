      <p>Like someone said there can be many ways to develop such ASCII portraits. Depends on what kind of results you want.</p>
      <p>Method one:<br>
      <a href="http://asciiconvert.com/" title="http://asciiconvert.com/">http://asciiconvert.com/</a><br>
      <a href="http://www.ascii-art-generator.com/" title="http://www.ascii-art-generator.com/">http://www.ascii-art-generator.com/</a><br>
      <a href="http://www.altarsoft.com/ascii_art_maker.shtml" title="http://www.altarsoft.com/ascii_art_maker.shtml">http://www.altarsoft.com/ascii_art_maker.shtml</a><br>
      <a href="http://www.network-science.de/ascii/" title="http://www.network-science.de/ascii/">http://www.network-science.de/ascii/</a></p>
      <p>Method two:<br>
      Use Illustrator's spray tool and experiment.</p>
      <p>Method three:<br>
      I guess this is how the sample image you have posted was been produced.</p>
      <p>Create two layers in the the Photoshop. The top layer should be the text layer and the bottom one should have the image you want to apply the effect. Make sure that your text is set either in white or Black. Now select the top(text) layer and keep playing with the various layers/transperency modes. Shortcut for this: "Shift" + "+".</p>
    html_clean: |-
