    html: <p>aluminum, I am totally with you. My instinct tells me to do an all-type based logo, but I wonder, is it appropriate. If the organization was more design oriented then yes it would seem. My intention for the logo is for the viewer to view a well designed illustration, i suppose, of a barbershop quartet singer, then the 1 and the 3 are to pop out. Kind of an "oh yea!" type of thing. It was based on the name "13th colony sound." I do understand that the eyes resemble apostrophes, and that might be why there's a push for an all-type based mark. I really appreciate your comments and suggestions everyone, this is very helpful.</p>
