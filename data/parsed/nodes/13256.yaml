    <p>hello all,<br>
    I am designing a logo for a local barbershop quartet organization called 13th Colony Sound. It is an organization of mainly retired gentlemen that get together and perform. </p>
    <p>With the logo, from what I understand, they want to capture the feeling of barbershop quartet as well as their southern "Savannah" location. The first I feel has been not to hard to capture. But with the Savannah feeling, I've tried to be a bit more subtle, using a Clarendon for the mustache and modified Clarendon for the nose, giving it that old-timey southern feeling. I want the logo to be fun, avoid the impulse of using a barbers pole, but reference the barbershop with the slicked over hair. I think the 13 should read as a nose and mustache first, and the number 13 second.</p>
    <p>What are your thoughts, is it working? Is there a unified nature to it, or is this just a bunch of elements thrown together? How can I make this better? Thanks.</p>
    <p><a href="http://studentpages.scad.edu/~sreinh21/13thColony.gif" title="http://studentpages.scad.edu/~sreinh21/13thColony.gif">http://studentpages.scad.edu/~sreinh21/13thColony.gif</a></p>
