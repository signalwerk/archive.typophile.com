      <p>&gt;defined by Andreas Stötzner, namely writing/drawing/etching; deforming material; or printing/punching/stamping).</p>
      <p>I'm thinking that all the acts of marking can happen in either constrained and unconstrained fields with constructed or unconstructed marks, before one even gets to classifying how the marks and fields are addressed by the mark maker, or whether the resulting material is lettering or a font. But generally, unless this needlepoint type can be reused, I'd think of it as lettering. </p>
      <p>Thanks for the ideas and Cheers!</p>
