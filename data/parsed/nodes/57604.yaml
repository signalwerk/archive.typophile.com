      <p>Nice post and images! I agree that using the term "pixel" here is a bit iffy... According to this <a href="http://www.foveon.com/files/ABriefHistoryofPixel2.pdf" rel="nofollow">document</a>, the term was first used in 1965.</p>
      <p>But the concept is clear: letterforms that fit into a grid. Grids <a href="http://www.amazon.com/Grid-Book-Hannah-B-Higgins/dp/0262512408/ref=sr_1_1?ie=UTF8&amp;s=books&amp;qid=1241480138&amp;sr=1-1" rel="nofollow">have existed for a long time</a>, so perhaps the term "gridded" is best.</p>
