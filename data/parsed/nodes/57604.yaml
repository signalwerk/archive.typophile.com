      <p>Yeah, I admit my use of "pixel" up top was mainly populist. :-&gt;</p>
      <p>Actually, I'm not sure I'm happy with "gridded" as a term. That's probably because I have my German nomenclature in mind… I'd like to keep viewing these as a sub-form of all "assembled" characters (like in mosaics; lettering composed of wall, roof, or floor tiles; LEDs; dot matrix printers; pebbles on the beach; rhinestone ornaments on girly shirts; lettering out of coffee cups photographed from above [Sagmeister]; etc., you know, the whole story). So they can be <em>gridded assembled</em> characters, but not <em>just</em> gridded. Does that make sense?<br>
      (Because, say, a glyph that's been automatically rasterized for on screen display is also gridded, but it's not consciously designed for that grid, so it wouldn't conform to my definition of an assembled character.)<br>
      BTW, does this "assembled" work? Or is "composed" better?</p>
      <p>Paul, thanks for the link! I'll have to get that book. I like the fact that they seem to have ordered the alphabets by cap height. But note that their samples "only" go back to the 18th century.</p>
