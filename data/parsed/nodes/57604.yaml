    <p>Time and again the question about the "oldest pixel font" crops up.<br>
    I went digging a bit.</p>
    <p>Pixelated <em>lettering</em> sure is old. You get mosaics in ancient cultures. But what about fonts? I'm going to go out on a limb here and propose that embroidery alphabets published as specimens for embroiderers should be considered fonts rather than lettering. The grid-bound specimens effectively constitute patterns of rules and instructions to be executed (albeit by humans).</p>
    <p>Given this definition (which is probably debatable), below are the oldest "pixel fonts" that I've been able to find so far. These two cross stitch alphabets were published in 1533. 476 years ago! Machiavelli's "Prince" had just been posthumously published, Luther's Bible was about to follow, Da Vinci had recently passed away, Michelangelo was alive and working, movable type was still a young technology, and the New York area had just been discovered by the Europeans.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/livre-nouveau-1533_6399.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/livre-nouveau-1533-2_6599.jpg"></div><br>
    These two alphabets were included in <em>Livre nouveau dict Patrons de lingerie,</em> edited by Pierre de Sainte-Lucie, published between 1530 and 1533. The alphabet of roman capitals (of which, unfortunately, I only have a cropped image) was apparently previously published, in a slightly differing form, in a book by a certain Schönsperger in 1524. The author of the book I got this from (Catherine Pouchelon, <em>Abécédaires Brodés</em>) maintains that that was the first cross stitch alphabet ever to be published.<p></p>
