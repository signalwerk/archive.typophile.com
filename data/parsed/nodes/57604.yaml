      <p>"Gridded" isn't bad. </p>
      <p>"Pixelated" (and I put that in quotation marks because it's only accurate in a sort of synecdocheal way), in terms of conforming to the same design limitations, structurally/morphologically, that pixelated screen type is bound to. (That was the short version.)</p>
      <p>I did a somewhat thorough analysis of the various structural types of what I have called "Gefügte Zeichen" in German, a couple of years ago*; in English I'm still missing a term for those, maybe "composed/assembled signs", basically meaning graphical signs that are built-up from individual smaller units (as opposed to the other methods of making signs as defined by Andreas Stötzner, namely writing/drawing/etching; deforming material; or printing/punching/stamping).</p>
      <p>From what I know, cross stitch specimens show the oldest forms of thusly "composed" signs (at least with regard to lettershapes) that are also <em>bound to a compulsory, rectilinear/orthogonal grid divided into roughly square units</em>, *and* are not rasterized automatically, but <em>designed for that grid</em>. They share that with bitmap screen fonts, and that makes them especially interesting to compare to the latter. Of course variables such as absolute size, historical context, purpose, and of course the nature of the light-emitting screen vs. cloth, et al., impose practical limits on the transferability of designs. Nevertheless, especially at small sizes the morphological parallelisms can be stunning.</p>
      <p>And I'm incapable of not digressing wildly when dealing with this overall subject. :-}</p>
      <p>* <a href="http://www.signographie.de/cms/front_content.php?idart=67" title="http://www.signographie.de/cms/front_content.php?idart=67">http://www.signographie.de/cms/front_content.php?idart=67</a></p>
