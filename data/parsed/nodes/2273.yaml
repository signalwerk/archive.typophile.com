    html: "<p>Hi Thomas, <br> <br>Here are some thoughts for you to consider: <br>1) The text version is better all the way around. I'd pursue that one. <br>2) This is condensed, but some glyphs are wide. Either narrow them up, or widen up the others. If you do intend this for text, i'd suggest widening the others. The wide letters are: c, g, s. <br>3) Again if this is in fact for text, you will probably want to decrease the x-height. That is, unless it is intended as a small-size, space saving type. In that case, you would need to refine the letterforms for performance at that size. <br>4) If you're going to put the caps with the text version, you may want to make the cap letterforms more open. (Compare upper and lower case Ss - caps vs text) Same goes for the numerals. <br> <br>5) Individual letters (text): <br>e: Has a slight overbite :-) <br>g: Tight in the waist. Drop the bottom down to rest on (or slightly above) the baseline. <br>i: Should it hook like the l? Just a thought. Or maybe it is a square serif to the right on both? <br>m,n: Is the m just two n's? if so you'll need to widen the n. If you choose to widen all the letters mentioned above, keep the m at it's current width. <br>r: Too narrow. Looks like a chopped n. You'll need to lower the join between the branch and stem + widen the branch adding a touch more heft at the end. <br>s: Looks flipped. But I bet if you rotate it 180 it will still look flipped. Try shortening the top arm. Lengthening the bottom arm, and raising the spine up to where it *looks* in the middle. <br>t: A bit wider on the right. <br>u: Looks like the n rotated 180. This make it look wider by comparison. They should *look* the same. <br>v,w: Several issues here. First, the bottoms are too flat. Look at Helvetica bold condesed for tricks to narrow up the base but keep the crotch deep (btw, this is a tough problem </p>"
