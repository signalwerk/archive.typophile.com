    html: <p>Hello all, and thank you very much indeed for all the kind and constructive words! <br>Og ikke mindst, til danskerne <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br>Hmmm... what to choose, the text or display version? -Well indeed I am quite sure the text version would be most interesting in all aspects, as it would undoubtfully be the best 'learning experience' to throw myself into the troubbles of making it well balanced and (hopefully) legible as well.  <br>And the possibility of adding more personality and a little more quirkyness to the face intrigues me equally. Also it would allow me to work on the capitals as well, as they would then need to be more in line with the lowercase.  <br>So, enough rambling, I think I'll leave the 'display' as it is, and focus on the 'text' version. I will continually be uploading work-progress in this thread (hopefully you might want to give me some pointers along the way..). <br>Again, thanks for the help -this sort of thing (forums that is..) might indeed be what makes the internet great! <br>-Thomas</p>
