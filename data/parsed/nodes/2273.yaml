    html: <p>Hi Dan. <br>The fact that the circles connect to the letters, is not per se the norm. But if you look into danish typography history (mostly based on a handful of architects and their work), you will find this detail in many early danish faces. I suspect the original idea of this was to 'save space' in order to have lesser leading. As most of the pioneers of danish type history were architects they were indeed more practical oriented rather than focused on typography history as such. Anyway, I included this feature in the face to keep some 'nationality' in it. I would gladly post some more about dansih type history if people are interested, as the subject is something I take great interest in myself ;) <br>-Thomas</p>
