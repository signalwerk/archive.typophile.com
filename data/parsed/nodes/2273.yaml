    html: <p>Hey, I saw my name mentioned in there :-) <br>Oday ouyay eakspay Nicolaj igpay atinlay? <br>(He he. Couldn't help myself!) <br> <br>So what will it be, my advice to go with the *text* version, or Nicolai's advice to go with the *display* version. We are a confused group aren't we? <br> <br>Since this is your first font I wouldn't worry about trying to make it too unique. Get the basics first. If it's too crazy, you can avoid wrestling with issues type designers have worked on since they put down the pen and picked up the press. My suggestion might be to make a thoroughly mundane type. Looking a lots of sources to guide your decisions. You will learn quickly in this fashion. Then use the knowledge as a point of departure. <br> <br>Randy</p>
