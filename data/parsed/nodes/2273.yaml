  html: "<p>Hello. <br>So, here follows my first modest attempt at creating a face, and my first post here as well. <br> <br>This first part of rambling concerns the \"display\" version: <br>What I initially had in mind was indeed a very dark 'grotesk' (yes I'm danish which is quite close to germany). And it was supposed to have been a display face including only capitals. As I progressed I felt it perhaps could be more and started working on lowercase as well. It is not to be seen as complete, rather very much in progress.  <br>The lowercase alphabet caused me a lot of troubble, and right now I can't seem to get on with it, so please critique would be nice.  <br> <br>Now the \"text\" version: <br>As I was doing the lowercase, I decided to progress it into a more human sans, and see wether that was possible. The result you see here is very much not finished, but indeed this is the face which I am in most need of critique and pointers. <br>I hope you'll help out, -Thomas <br>(By the way, the reason the lowercase 'g' is red, is that I am not quite sure wheter to do a single story or this..) <br><img src=\"http://www.typophile.com/forums/messages/29/21603.gif\" alt=\"Typeface v.01\"></p>"
  html_clean: "<p>Hello. <br>So, here follows my first modest attempt at creating a face, and my first post here as well. <br> <br>This first part of rambling concerns the \"display\" version: <br>What I initially had in mind was indeed a very dark 'grotesk' (yes I'm danish which is quite close to germany). And it was supposed to have been a display face including only capitals. As I progressed I felt it perhaps could be more and started working on lowercase as well. It is not to be seen as complete, rather very much in progress.  <br>The lowercase alphabet caused me a lot of troubble, and right now I can't seem to get on with it, so please critique would be nice.  <br> <br>Now the \"text\" version: <br>As I was doing the lowercase, I decided to progress it into a more human sans, and see wether that was possible. The result you see here is very much not finished, but indeed this is the face which I am in most need of critique and pointers. <br>I hope you'll help out, -Thomas <br>(By the way, the reason the lowercase 'g' is red, is that I am not quite sure wheter to do a single story or this..) <br><img src=\"http://www.typophile.com/forums/messages/29/21603.gif\" alt=\"Typeface v.01\"></p>"
