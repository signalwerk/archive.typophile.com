      <p>Thanks, Tina -- it appears that I did not search well enough...</p>
      <p>Previously on a Mac, I had become accustomed to Font Explorer. Now that I'm on Windows Vista, I've been using Bitstream Font Navigator, but it just doesn't cut it. I really liked the fact that Font Explorer made this nice, clean database of my fonts when installed -- it did all of the organizing for me.</p>
      <p>I've tinkered a bit with <a class="freelinking external" href="http://www.high-logic.com/maintype.html" rel="nofollow">MainType</a>, but I honestly haven't devoted enough time to it to make a decision. I had never heard of Typograf, so I'll have to give it a try.</p>
