  - id: 258410
    user: 18817
    date: 2008-02-12T16:17:00
    date_raw: 12 Feb 2008 — 4:17pm
    votes: null
    html: <p>In two decades I evaluated almost all of them and clearly the best are Bitstream Font Navigator, Typograf (both already mentioned) and OT1 Font Manager (jmberthier.com). (Extensis Suitcase seemed quite promising but I found it buggy.) But each suits a very different purpose. Typograf is best for previewing fonts (and allows fonts "loading", i. e. temporary installation until next restart or manual unloading). OT1 Font Manager provides best options for printing the specimens and Font Navigator is best for routine installing/uninstalling fonts and managing groups of fonts. You could also try ThumbsPlus that is actually a picture manager, but supports all formats of fonts. Allows creating font thumbnails with custom text, installing fonts and all standard file operations with thumbnails so you can actually visually organize fonts by moving thumbnails into various subfolders you create. You can also print contact sheets, the same way as you would do with photos.</p>
  - id: 258414
    user: 3775
    date: 2008-02-12T16:41:00
    date_raw: 12 Feb 2008 — 4:41pm
    votes: null
    html: |-
      <p>I have Typograf and love it. The interface isn't very elegant, but once you get used to it, it works very well. One window allows previewing, comparing and searching and another window has your font groups. It loads the font groups at start up unactivated. You just click on the icon in your system tray and select the group you want to load or install and it's that easy. You get full screen character maps also which I love. It also has general info screens, metric data and kerning pairs. It doesn't auto activate in Indesign but it is easy to make a font group of your project and activate that way.</p>
      <p>One disclaimer, I'm not a type designer and there may be things you want in the software that I don't know about. I'd be happy to provide screenshots if you need them but it seems like they have some on the web site. </p>
      <p>I have used Suitcase, Font Agent Pro for Windows (caused my XP pro machine problems) and Fontexplorer from Linotype (which caused serious system font problems) and Font Navigator. </p>
      <p><a class="freelinking external" href="http://www.neuber.com/typograph" rel="nofollow">Typograf</a></p>
      <p>Hope this helped,</p>
      <p>Sharon</p>
