      <p>Hi guys... I hope I haven't busted on to your topic too late to attract attention!</p>
      <p>My query is to be honest slightly off topic, but only slightly!</p>
      <p>I've been impressed with the way that Ubuntu (Linux) on my friends machine handles fonts in the regular Explorer-style filesystem, showing actual thumbnails of "Aa" for each font to give an at-a-glance representation.</p>
      <p>I've been searching for hours for some kind of plugin to do this in Windows XP explorer, but have found nothing and just hoped one of you guys might know of something that can do it, or at least put me out of my misery by telling me it definitely won't be found!</p>
      <p>Just to confirm, I'm not talking about a program, I want to be able to view live thumbnails of my .ttf files while I'm looking at the folder through the regular explorer set up. I hope it's not too much to ask!</p>
      <p>To contribute back on topic... it's ironic really I've not used anything other than akFontExplorer for years upon years, I must admit its use for me is nothing more than occasional - when I'm looking for a font to use for a title or menu on a website I'm creating I'll load it up and see what looks good for the phrase/button/title in question.</p>
      <p>From the links you've posted, and bearing in mind the little use I would get out of/am looking for in a font management program, I have the luxury of pretty much being able to choose any package as the difference in advanced features is almost irrelevant to me when I'm only looking for previews.</p>
      <p>Based on that, and checking out manufacturer's websites and screenshots:<br>
       - Typograf - I simply couldn't use this because of the Windows 3.1-looking GUI... i'm a such a ponce when it comes to things like this, but like I said when I'm only looking for simple functionality, I can afford to be choosy. The temporary installation thing would definitely be a potential pull though if I was to start using fonts more heavily<br>
       - Extensis Suitcase - looks good but seems to be too interweaved with Adobe software rather than an independent tool<br>
       - BitStream FontNavigator - despite finding the Bitstream homepage I couldn't find their page on FontNavigator - has it been discontinued?<br>
       - MainType - looks very nice, will be trying this one myself</p>
      <p>And a couple of new ideas for you:<br>
       - FontExpert 2007 (<a href="http://www.proximasoftware.com/fontexpert/screenshots.htm" title="http://www.proximasoftware.com/fontexpert/screenshots.htm">http://www.proximasoftware.com/fontexpert/screenshots.htm</a>) - this one looks pretty good, think I'll give it a try<br>
       - FontExplorer X (<a href="http://www.linotype.com/2629/fontexplorerxfeatures.html" title="http://www.linotype.com/2629/fontexplorerxfeatures.html">http://www.linotype.com/2629/fontexplorerxfeatures.html</a>) - also looks pretty good and a FREE download... BUT... the PC version is in between beta and release candidates and as such doesnt' seem to be available anywhere at the moment! :-(</p>
      <p>Not sure how this turned into an essay but it did. Hope to get some kind of response from someone somewhen!!</p>
