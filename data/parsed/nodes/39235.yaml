    html: <p>I used to paint on the windows of <a class="freelinking external" href="http://www.koppas.com" rel="nofollow">my family's grocery store</a> all the time. You can use just about any paint from the hardware store and any brush, though the pros probably use One Shot and horse hair. I've never had any trouble cleaning it off with a razor blade. This is a case where experimentation is a good teacher until you find someone who can tell you exactly what to do.</p>
