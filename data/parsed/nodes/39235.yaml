    <p>A friend and I are thinking about trying our hands at glass window sign painting. Our neighborhood is ripe for some life in it's signage because let's face it, squished and stretched giant arial on banner vinyl swinging from a beige awning just doesn't cut it.</p>
    <p>our drawback is we know very little and we're having a hard time finding reliable resources regarding materials, techniques, etc... i'm guessing at least a few typophiles have participated in this activity so I humbly request your insight and experience. We are mostly wondering where to start with paints so that cleanup and removal is as easy as possible later on</p>
    <p>thanks<br>
    _will</p>
