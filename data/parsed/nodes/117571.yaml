      <p>MFred is available to sell at typespec: <a href="http://typespec.co.uk/mfred-font" title="http://typespec.co.uk/mfred-font">http://typespec.co.uk/mfred-font</a><br>
      <a class="freelinking external" href="http://www.myfonts.com/fonts/filmotype/glenlake" rel="nofollow">Glenlake</a> might be an alternative.<br>
      For Timmons, some suggestions: <a class="freelinking external" href="http://www.myfonts.com/fonts/nicksfonts/uncle-sam-slim-nf" rel="nofollow">Uncle Sam</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/redrooster/chamfer-gothic-rr" rel="nofollow">Chamfer Gothic</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/doubletwo/xxii-dont-mess-with-vikings" rel="nofollow">Don't Mess With Vikings</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/fontbureau/herald-gothic" rel="nofollow">Herald Gothic</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/solotype/five-star-final" rel="nofollow">Five Star Final</a>, <a href="/wiki/https%3A/%252Fwww.playtype.com/font/cwm" class="freelinking" rel="nofollow">CWM</a></p>
