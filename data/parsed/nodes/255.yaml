      <p>And finally, a pdf. As I note in the ever so eloquent copy, the upper case was carefully <br>spaced, but not kerned, and the lowercase was autospaced. Two problems I saw were <br>that the lower case a looks wide, as does the actual space. <br> <br>A possible solution to the heavy caps (if in fact you agree that they are a bit heavy)  <br>would be to scale them down a bit. As it is, I think the assenders / cap height might <br>not suffer from being lowered. What do you think? <br> <br>Thanks all. <br>Randy <br> <br>I didn't spend too much time on the sample making it look pretty. Sorry :-) <br> <br> </p>
