    html: <p>I whole-heartedly agree with earlier posts that this effort warrants further work... congratulations! Based upon my first and immediate reaction, I prefer the second of the three lower case "a's". And one other observation (that may be due to my failure to renew a prescription more than keen typographic analysis) is that the vertical strokes of some upper case characters seem to bow out more than the normal optical illusion. They bring to mind jfp's brilliant suggestion for the "y" diagonal strokes in the recently posted yesyes logo. Again, congratulations.</p>
