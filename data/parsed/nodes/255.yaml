  html: "<p>So here's the latest from Friday Fonts, which has creeped into saturday, monday and <br>tuesday fonts! oops! A dangerous game I'm playing.  <br> <br>I moved in a different direction from Neweue Helpetica. I was feeling like it was too close <br>to helvetica and others. Simply adding a few alternate letterforms would not do. I haven't <br>totally scrapped what I was up to. If there's a  <br>major outcry, I will keep working on it. <br> <br>So now I have a complete upper and lower case for a new font. But, I think the caps are a  <br>hair too dark for the text! Overall though I like the flair of this one. A few things are still there:  <br>notably the k. Stay tuned for a glyph chart. <br> <br>Randy </p>"
  html_clean: "<p>So here's the latest from Friday Fonts, which has creeped into saturday, monday and <br>tuesday fonts! oops! A dangerous game I'm playing.  <br> <br>I moved in a different direction from Neweue Helpetica. I was feeling like it was too close <br>to helvetica and others. Simply adding a few alternate letterforms would not do. I haven't <br>totally scrapped what I was up to. If there's a  <br>major outcry, I will keep working on it. <br> <br>So now I have a complete upper and lower case for a new font. But, I think the caps are a  <br>hair too dark for the text! Overall though I like the flair of this one. A few things are still there:  <br>notably the k. Stay tuned for a glyph chart. <br> <br>Randy </p>"
