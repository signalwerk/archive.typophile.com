    html: "<p>I'm liking the texture in your latest sample. <br>And I think the cap weight is just fine now. <br> <br>&gt; symmetrical traps <br> <br>BTW, you can make asymmetrical traps using the Flower by revolving the new corner point along its circle, to the desired spot. Also, you can compensate for greater bleed in one dimension than the other by using [properly aspected] concentric ellipses instead of circles. <br> <br>&gt; The Q: I've always thought this is the one place  where you get to take a few liberties. <br> <br>You're right - on second thought it's probably just fine (and cute to boot) - as long as it doesn't clot on you. <br> <br>Descending UC \"J\"s: I personally love them. To me the only reason not to have it descending is for display work, and only if the \"Q\" is also non-descending (which rarely looks good though). Some people say that a descending \"J\" doesn't really help spacing, since it rarely occurs except as the first letter of a word/name - but of course that's a highly Anglo view - type designers from LJUBLJANA (they do exist) probably have nightmares about non-descending \"J\"s... I really think they help in every way. <br> <br>BTW, an idea for showing caps: <br><a href=\"http://www.typophile.com/forums/messages/4101/1329.html\" target=\"_blank\">http://www.typophile.com/forums/messages/4101/1329.html</a> <br> <br>hhp <br></p>"
    html_clean: "<p>I'm liking the texture in your latest sample. <br>And I think the cap weight is just fine now. <br> <br>&gt; symmetrical traps <br> <br>BTW, you can make asymmetrical traps using the Flower by revolving the new corner point along its circle, to the desired spot. Also, you can compensate for greater bleed in one dimension than the other by using [properly aspected] concentric ellipses instead of circles. <br> <br>&gt; The Q: I've always thought this is the one place  where you get to take a few liberties. <br> <br>You're right - on second thought it's probably just fine (and cute to boot) - as long as it doesn't clot on you. <br> <br>Descending UC \"J\"s: I personally love them. To me the only reason not to have it descending is for display work, and only if the \"Q\" is also non-descending (which rarely looks good though). Some people say that a descending \"J\" doesn't really help spacing, since it rarely occurs except as the first letter of a word/name - but of course that's a highly Anglo view - type designers from LJUBLJANA (they do exist) probably have nightmares about non-descending \"J\"s... I really think they help in every way. <br> <br>BTW, an idea for showing caps: <br><a href=\"http://www.typophile.com/forums/messages/4101/1329.html\" target=\"_blank\" class=\"link-lost\">http://www.typophile.com/forums/messages/4101/1329.html</a> <br> <br>hhp <br></p>"
