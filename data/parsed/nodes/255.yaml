    html: "<p>Hi all.  <br> <br>I've started on a black version of this font. As I mentioned in another thread, I'm thinking of  <br>light, regular, bold and black for the final family. So far I pleased with the caps, but  <br>chose to post the lc before finishing because I was unsure and wanted feedback. I know that  <br> <br>Big question is: does the black lc accuratly hold to the character of the regular version. I  <br>had to add some stroke contrast (there's no other way to get it all in!). I also chose to  <br>emphasis the squareness of the glyphs a bit more. I tried the same and less, and in both  <br>cases I felt like it lost some of the regular's feel. One area of concern is on the terminals  <br>(a, c, e, r, f etc) with the added stroke contrast they can start to look way different. I've tried  <br>two versions of the a. What do you think? <br> <br>Regards, <br>Randy   <br> <br><img src=\"http://www.typophile.com/forums/messages/29/11638.gif\" alt=\"black\"></p>"
