      <p>Thanks again all for the suggestions. <br> <br>The main thing I've changed in this PDF is the <br>weight of the caps. now they are 106% of the  <br>lower case. I think it works out better, but haven't <br>had a chance to look at a print. What do you think? <br> <br>Narrowed and lightened the lc a (went with the  <br>version with the straight join) <br> <br>Narrowed the lc n <br> <br>Fixed the cap P <br> <br>Fixed the cap R <br> <br>Comma is more robust. <br> <br>Flower Power: Nope, not using it. The method <br>I was using only works with precision on <br>symmetrical traps. That's where the flower is <br>really nice. I'll check it out, thanks. <br> <br>The Q: I've always thought this is the one place <br>where you get to take a few liberties. In what <br>way is it a bit much? I felt the tail fit nicely into <br>the space left by the upper or lower case U. <br> <br>Oh, JFP: I was wondering about the cap J. Is it  <br>the decending below the baseline that is a  <br>problem, or the narrowness, or both? I extended <br>it below the baseline to help with spacing. <br> <br>Hope to have some numerals before the day <br>is out. Thanks. <br> <br>Randy <br>Hope you enjoy this Dr. Seuss classic as  <br>much as I do. <br></p>
