    <p>I am on the Build bandwagon. I usually dont get too in love with certain designers but for whatever reason Michael C Place (Build) has stole the show for me in the last year or so.</p>
    <p>He has used this typeface before on a few projects, but I am just curious what it is. I love how he uses older lettraset fonts and legacy faces like Glaser, Beans, Akzidenz Grotesk, etc and gets them to twist nicely. I am just curious if he is using a custom face, or  what.</p>
