    html: <p>It looks like an <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=ITC&amp;ffam=ITC%20Caslon%20224%20Book%20-%20Regular&amp;fid=85161c9fd75f5994f04c435a622d8066&amp;fsize=60&amp;text=VALERIO&amp;fit=1" rel="nofollow">ITC Caslon 224 Book</a></strong> artificially stencilized, with a modified /A (You can also use a 180 deg. rotated /V in place of /A)</p>
  - id: 586246
    user: 222333
    date: 2014-08-20T11:46:00
    date_raw: 20 Aug 2014 — 11:46am
    votes: null
    html: <p>Thanks for your reply! The font does look similar but it seems like most of the letters in the font I'm searching for have disconnections. You can clearly see it in the 'O' for instance. The rotated V for an A could very well be true though.</p>
  - id: 586251
    user: 176276
    date: 2014-08-20T12:40:00
    date_raw: 20 Aug 2014 — 12:40pm
    votes: null
    html: <p>The disconnections you mention are typical in a stencil font, that's why I said the font it's probably "artificially stencilized". I can't find any stencil font like this, so I believe the disconnections are made by the logo designer and are not part of the original font used.</p>
