    date_raw: 21 Oct 2004 — 2:22pm
    votes: null
    html: <p>It looks nice, but this is a lot to read, considering the quickly viewed applications that are used in this industry (vehicles, signage, etc.). Nelson Earthworks, isn't too long in itself, but your execution with two different type approaches, one of them being a stencil (which is a busy stop'n'go face), and the triple-meaning crucifix/shovels/r-t ligature make for a boat load to take in. I suggest finding a way to simplify it. I think I might even like it better if it was all the same face, but only the "r" was stencil to accomodate the r-t lig. The only issue I would have with that is that I don't really see the shovels. As Hrant commented, "dagger" comes to mind, or even when I think in construction terms, I see a file, screwdriver, brush, etc...but not shovels. Overall, the concept behind the symbol is pretty clever...you've accomplished your client's objective, but kept it subtle enough to appeal to all audiences. <br> <br>Good work! <br> <br>Aloha, <br>Scott</p>
