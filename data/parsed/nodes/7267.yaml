  html: <p>This is an interesting one. He is a super guy, probably the most courteous and reliable client I have had thus far. (Y'know, the ones you will bend over backwards for). He has an earthmoving business, and wants to look professional, honest and reliable, with a view to engage with bigger professional contracts . He also wants to reflect his Christian belief in the logotype. I have come to the conclusion below. I think it works on two levels, the cross motif can suggest both the crucifix and shovels, both of which are particulary pertinent. Have at it! <br> <br> <br><img src="http://www.typophile.com/forums/messages/29/51711.gif" alt=""></p>
