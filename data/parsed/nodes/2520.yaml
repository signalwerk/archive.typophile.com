    html: "<p>\"Oregon\" was set in <a href=\"http://www.myfonts.com/fonts/bitstream/handel-gothic/handel-gothic/testdrive.html?s=OREGON&amp;p=48\" target=\"_blank\"> Handel Gothic</a> and customized*. <br>I really don't know what the big 'O' should be: it's very  <br>difficult to ID a font just by one character that carries so  <br>little specific traits. <br> <br>*stretched horizontally, converted the upper left curve  <br>on the \"E\" to a corner, flipped the \"U\" for the \"N\" and  <br>also converted the upper left curve to a corner. Not too  <br>difficult to recreate.</p>"
