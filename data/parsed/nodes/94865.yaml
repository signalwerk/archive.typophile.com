      <p>I believe it is simply hand drawn.  As for hand drawn typefaces with similar swashes and flourishes, have a look at these.</p>
      <p><a href="http://www.linotype.com/es/6450/williamlucas.html" title="http://www.linotype.com/es/6450/williamlucas.html">http://www.linotype.com/es/6450/williamlucas.html</a><br>
      <a href="http://www.linotype.com/1175/zapfino-family.html" title="http://www.linotype.com/1175/zapfino-family.html">http://www.linotype.com/1175/zapfino-family.html</a></p>
      <p>Fonts by Mans Greback  (some of these are free or very cheep for personal use)<br>
      <a href="http://www.myfonts.com/fonts/mawns/before-the-rain/" title="http://www.myfonts.com/fonts/mawns/before-the-rain/">http://www.myfonts.com/fonts/mawns/before-the-rain/</a><br>
      <a href="http://www.myfonts.com/fonts/mawns/sverige-script/" title="http://www.myfonts.com/fonts/mawns/sverige-script/">http://www.myfonts.com/fonts/mawns/sverige-script/</a><br>
      <a href="http://www.myfonts.com/fonts/mawns/respective/" title="http://www.myfonts.com/fonts/mawns/respective/">http://www.myfonts.com/fonts/mawns/respective/</a><br>
      <a href="http://www.myfonts.com/fonts/mawns/some-weatz/" title="http://www.myfonts.com/fonts/mawns/some-weatz/">http://www.myfonts.com/fonts/mawns/some-weatz/</a><br>
      <a href="http://www.myfonts.com/fonts/mawns/shipped-goods-1/" title="http://www.myfonts.com/fonts/mawns/shipped-goods-1/">http://www.myfonts.com/fonts/mawns/shipped-goods-1/</a></p>
      <p>You might also do a search for windsong which is a font that can be found for "free" around the net.  But since the author is a mystery, no one knows the license.  So I would not use it for anything commercial.</p>
