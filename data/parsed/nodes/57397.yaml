      <p>Dilemmas like this, decisions between historical accuracy and one's own eye, are one reason why I'm not sure I'd be capable of making (or wanting to make) revivals. I have nothing against this "8" structure in general, but with this sort of contrast it seems to look very odd. But yeah, maybe it's a matter of familiarity.</p>
