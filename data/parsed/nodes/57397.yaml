    html: |-
      <p>PS: This seems to have been quite a family. I found listings of a "corsiva", a "strettissima" (condensed?), and even a "contornata" (outlined? I wonder what THAT looked like!). The dates seem to differ a bit between different sources. </p>
      <p>One strange thing is that <a href="http://www.global-type.org/Schriften.567.0.html" rel="nofollow">Global Type</a> doesn't just list the medium as "B" (Blei = lead), but also "T" (Truetype) for the regular and italic, and for the outline version "F" (Fotosatz = phototype) and PS (PostScript). I wonder where that information comes from – or where it may lead. All the other sources I've found said nothing whatsoever about digital versions.<br>
      (BTW I'm not urgently needing this for a current project or something; I'm just very intrigued.)</p>
