    <p>Hey guys, this is from an old-ish Italian paperback. Unfortunately I only have the cover page, so I can't say for sure when it was printed – but it's definitely pre-digital.<br>
    Does anybody recognize this, and/or know if it exists in digital form? WTF didn't know.<br>
    Cheers!</p>
