    html: |-
      <p>I am not at home with all my type books, so I was limited to searching my Serif Guide online, but I found some similar looks. The only one with a funky k and y similar to these was LSC Condensed, which was an old ITC face (digitized in old Image Club collections). However, the other details of this face are nothing like your sample. Other sort of similar high contrast faces that have digital versions: Arsis, Big Figgins, Didoni, Falstaff and Modern Heavy Condensed. Most of these had the similar y, but not the k. Most also have the 'a' with a curved tail.</p>
      <p>Maybe Mark Simonson will know, since his book collection is probably better than mine anyway.</p>
      <p>- Mike Yanega</p>
