      <p>Thanks guys! That's a start.</p>
      <p>Craig, the one you mentioned is rather similar indeed structurally, except maybe for the "b".<br>
      Mike: Great pointers. LSC Condensed (<a href="http://e-daylight.jp/design/fonts/type/l/lsc-condensed.html" rel="nofollow">this one, right?</a>) has a wild "k" indeed! :-)  I can see the curly-armed "k" seems to be quite rare, at least more so than the "y" form above.</p>
      <p>Hmm… I'm beginning to wonder if this is even a font. Although there is an "il" to go with the "kybalion" and I left it out because the "i" and "l" really look like they're the same; on the other hand, the letters don't seem to be lining up perfectly (as can be seen in the foot serif of the "l" above). Hm.</p>
