      <p>If I may offer some thoughts on the type...</p>
      <p>As penn says, I think any of the last few iterations are very close to being complete, although my eye tells me somewhere between examples 1 &amp; 3. As well as raising the bowl of the 'd' I have a small issue with the stem of the 'r' - it seems to be leaning forward a touch, and could <em>possibly</em> do with being ever-so-slightly tapered in order to compensate. I know it may disrupt the precise vertical nature of the other letters, but I think a barely detectable adjustment may help the overall sturdiness.</p>
      <p>Other than that, this is lovely work.</p>
