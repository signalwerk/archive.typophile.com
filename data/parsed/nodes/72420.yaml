      <p>Hey there Ian, this is great stuff, I love it!</p>
      <p>I'm not a pro by any means, but there are some things I would suggest tweaking...At larger sizes, I would make more of a connect between the top and bottom of the F, small sizes works great. And then the e between i and d is standing out to me a little, maybe tighten the spacing a little. It also seems way heavier on the left side, making it look like its leaning backward. Besides that I would tighten the spacing of the tagline, fitting it in between the first 'i' and the bottom of the last 'e' and maybe make it a notch bolder. What are you using there anyway? Knockout? Love the icon/watermark!</p>
      <p>Good work!</p>
