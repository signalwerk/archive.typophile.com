    html: |-
      <p>Go with your gut on this one. Any of these most recent versions could work well. </p>
      <p>I'd still stick with the tracked out version of the 'photography' line. It's a nice clean respite from the strong logotype of the name. I wouldn't try to squeeze it together at all. The eye is drawn to where it needs to be and slowly falls to 'photography' when it feels ready.</p>
      <p>If you think it needs it, I might also draw up the top of the bowl of the 'd' as well. Just a touch to optically compensate for the height of the right side of the 'e'. (Similar issue that the 'r' had.)</p>
      <p>Please do post any further progress you have with this project. I'd love to see how you develop the identity and use the secondary logo watermark.</p>
      <p>I also like the way that you post lower res versions in the body of the post — makes it easier to track — then Higher res versions up above to examine closely. Just be sure to label them with a date or something so it's easy to know which high res attachments belong to which edits below.</p>
      <p>Nice work so far.</p>
      <p>--<br>
      <em>penn</em></p>
