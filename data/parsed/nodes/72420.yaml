      <p>I love typophiles, you guys are great!</p>
      <p>skosch<br>
      I liked direction 2 as well and i tried mucking around with it to see if i could get the r to have the same idiosyncrasies as the capitol f - no luck. Plus the client preferred option 3 (he works with me so he came over a few times during the day to add his feedback.) I really appreciate your quick sketch and it helped with these new directions. Especially option 1 where I altered the angle of the line coming out of the 'e' a bit so as to get the bar of the 'r' high enough quick enough. I'm not sure i like the negative shape it made though.</p>
      <p>Penn<br>
      Thanks also for the sketch it informed my second iteration in this new study attached. </p>
      <p>Jon<br>
      I just saw your comments as I started writing this - I think ill explore more of the relationship between the logo and the tag as i experiment with this identity moving forward into business cards, stationary,  etc. </p>
      <p>Attached are the studies based off your feedback.  My favorite is number 2 - the strong diagonal of the e supports the bottom of the 'r' and the curve at the top is reflected in the curve of the bottom almost as if a broad nib pen were to make one fluid motion. </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Fiedler3_3647.jpg"></div><p></p>
      <p>Thoughts guys? Thanks so much again! Do you want me to keep posting as I move into business cards and such? (Thats next for me.) I'm super stoked to make those - part of the deal with this identity was that i'd make it as long as we get the cards printed at Studio on Fire. Letterpress all the way!</p>
