      <p>@IanCrombie - For me, a 30-something person, this particular typeface style is tied rather strongly to a specific time period from the early second half of the last century. From the lettering on my grandma's fridge to the labels on kitchen gadgets and cars from the era - I look at your logo and I see 1950s. That's the primary <em>subjective</em> vibe I get from the logo.</p>
      <p>The constructive criticism part is that if you or your client care about the first impression the logo creates, then perhaps it looking like a 50 year old brand to some people is a point worth considering. Not saying my take on the logo is representative, nor am I saying that the logo is bad. I'm just pointing out that the interpretation of the logo might be ambiguous, and it may create some unintended associations and assumptions on viewer's part.</p>
