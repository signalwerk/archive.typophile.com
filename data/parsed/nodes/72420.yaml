    html: |-
      <p>Thanks for the comments guys, I've actually put this guy on the back burner, as the business cards are not slated to be printed for a month or so. My client is super pleased though and I cannot thank you guys enough for the help refining this bad boy.</p>
      <p>I've also quite enjoyed our debate over how type has associations. My opinion is that it is the designers job to leverage these qualities and use them to ignite those nostalgic feelings. It's important to intellectualize our typographic knowledge and harness it. </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Fiedler3_4527.jpg"></div><p></p>
      <p>For that reason I agree with Luca's recommendation to use Eurostile, attached is a screengrab of the business card in progress - just the front - this is one of the more dull ideas (the diagonal lines complement the angles of the logotype) but it showcases the new type lockup. Eurostiles structure is a nice complement the the boxier structure of the logotype. (Btw - the lines would be blind embossed.)</p>
      <p>Also when it comes to creating supplemental material - I feel that eurostile is more ownable and unique - and I've never designed with it before so it keeps things interesting. I find myself continually surprised by it - having once had some preconceived dislike of eurostile. </p>
      <p> I've been busy with a new branding project that I'm super excited about - super strict brief (mid century modern, serifs, high ascenders, and needs to complement neutra face) My new client is an architect and is rather savvy - so she keeps me on my toes.  I'll start a new thread on that soon. </p>
      <p>Thanks again everyone!</p>
