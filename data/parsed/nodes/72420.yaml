      <p>I like this a lot. Great concept, great execution, great colors.</p>
      <p>A few points of critique:</p>
      <p>• The stem of the 'r' could be a bit taller, I think, as right now it gives the impression that the 'r' sits optically lower than the rest of the letters.</p>
      <p>• The arm of the 'r' might suffer from the problem discussed here: <a href="http://typeworkshop.com/index.php?id1=type-basics&amp;id2=&amp;id3=&amp;id4=&amp;id5=&amp;idpic=17#pictloader" title="http://typeworkshop.com/index.php?id1=type-basics&amp;id2=&amp;id3=&amp;id4=&amp;id5=&amp;idpic=17#pictloader">http://typeworkshop.com/index.php?id1=type-basics&amp;id2=&amp;id3=&amp;id4=&amp;id5=&amp;id...</a> and could do with similar tweaks</p>
      <p>• [minor point] The crossbar of the 'F' seems like it's a triangle that is placed on top of the rectangular stem. Perhaps it could more organically come from the stem and mimic the shape of the top bar.</p>
      <p>• [minor point] The top bar of the 'F' seems a tad heavy.</p>
      <p>All in all, great job.</p>
      <p>--<br>
      <em>penn</em></p>
