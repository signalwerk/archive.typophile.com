    html: |-
      <p><em>... I look at your logo and I see 1950s.</em></p>
      <p>Well, say it does. Then is that a bad thing? To me – regardless of the fact that I'm just 20 – the fridges, appliances <em>and</em> cameras from that time were and are a symbol of manufacturing quality. It's precisely because my grandma's fridge and blender are from a time when consumer products tended to be sturdier than today that I can still see them in her kitchen today. A camera back then was an investment. Look at Ian's pictures – the brands are engraved in the metal case. <em>Engraved. Metal case.</em> Compare that to plastic point-and-shoots. And my grandchildren won't get to admire my fridge, that's for sure ...</p>
      <p>This logo will not be a rusty piece of lettering on a scrapped car, but probably – hopefully – appear in quality print on letters, portfolios, etc., where the context makes clear that this is an indication of quality, not antiquity. It will remind you of the good old days, with their good old cameras, and real <em>love</em> for photography (since films were really expensive, too).</p>
      <p>Paired with quality work and state-of-the-art equipment, I think this will work very well.</p>
