    html: <p>Okay. BJ was thinking along the same lines, but not quite <br>the same. So the top of these two images is what I meant,  <br>but now I take it back cause there are too many tricks in  <br>this bag. ¶ So then I tried the bottom of the two. I  <br>removed the cholla-ness of the letter (although it would  <br>be better to just draw your own shapes) and added a little  <br>uniqueness. Only for the sake of ideas. ¶ As for tests and  <br>finding a good fit when working on any identity (logo,  <br>whatever) IMO if you plan on altering the type to make it  <br>more "ownable" by the company, it is always easier (and  <br>best?) to start from a simple (yet strong) foundation and  <br>add. When using type that is too unique already (too  <br>tricky, trendy) it is difficult IMO to avoid making things  <br>even more tricky. <br> <br> <br><img src="http://www.typophile.com/forums/messages/29/1755.gif" alt="nothis.gif"></p>
