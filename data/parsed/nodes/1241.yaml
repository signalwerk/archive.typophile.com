    html: <p> I'm with Marc. I like the idea of the tail, but as it's drawn, it's not working. The outer curve of the tail should be less circular and more acute, thickening the stroke and emphasizing the angle of the bend a bit more. You still might ultimately decide against the tail, but you'll have a better tail to consider. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)"> <br> <br>I also like bj's idea of an "FI" ligature. It's worth a try. <br> <br>David </p>
