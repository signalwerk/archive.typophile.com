    html: <p> I have been busy that past couple of weeks and did not notice all the re-workings/posts till' tonight.  <br>I guess the thing to mention is that the client is kind of a minimalist. I tried a few extra mods that did not exactly increase legibility and client wanted it as simple as possible considering the budget ran out and new mods would cost extra them extra. I think perhaps the fi ligature is a bit too close to resembling a cap 'A" but it has gone to print and there is unfortunantly no more time for exploration. I appreciate the input. </p>
