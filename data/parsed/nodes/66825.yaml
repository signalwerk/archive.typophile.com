    <p>I am looking for the name of the font on the opening credits of the TV program "Medium", broadcast in the US.  I've tried to get a sample, but for some reason I can not create a registered account on CBS web site. Other attempts to get a sample, are from countries other then the US and the font a different.  The font in question appears to be Celtic, with dropped caps.  Can anyone help??</p>
    <p>g</p>
