      <p>You can check <a href="http://bowfinprintworks.com/LinedFontGuide02.html" target="_blank" rel="nofollow">Mike Yanega's Lined Font ID Guide</a> to see if there's anything you like.</p>
      <p>I'd also recommend <a href="http://www.myfonts.com/fonts/larabie/street-cred/" target="_blank" rel="nofollow">Street Cred</a> by <a href="/wiki/Ray%20Larabie" class="freelinking" rel="nofollow">Ray Larabie</a>. It's free, so it's worth a try.</p>
      <p> - Lex</p>
