  html: <p>Hi, <br> <br>I'm a video artist trying to simulate the look of closed captioning. I'm wondering if anyone out there might have a recommendation for a font that resembles the one typically associated with closed captioning. The look varies from TV to TV and from program to program, but generally looks something like the image in the next post. <br> <br>It would be a super bonus if that font were free or low cost. <br> <br>Thanks very much for any thoughts!  <br> <br>Best, <br>Neil</p>
  html_clean: <p>Hi, <br> <br>I'm a video artist trying to simulate the look of closed captioning. I'm wondering if anyone out there might have a recommendation for a font that resembles the one typically associated with closed captioning. The look varies from TV to TV and from program to program, but generally looks something like the image in the next post. <br> <br>It would be a super bonus if that font were free or low cost. <br> <br>Thanks very much for any thoughts!  <br> <br>Best, <br>Neil</p>
