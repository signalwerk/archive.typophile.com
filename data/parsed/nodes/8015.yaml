    html: <p>Look for <a href="http://www.myfonts.com/search?search%5Btext%5D=monospace" target="_blank">monospaced fonts</a>, including the ones at the MyFonts link I provided. <br> <br>Many of these should provide a similar feel, or you might find the same one your system uses.</p>
