      <p>For "MASA" you can use <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Dafont-1&amp;ffam=Freshman%20-%20Normal&amp;fid=4e0a731a29f56f42431919e8cf234b9e&amp;fsize=60&amp;text=MASA&amp;wrap=2" rel="nofollow">Freshman</a></strong> free font by William Boyd or <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Dafont-1&amp;ffam=CollegiateBlackFLF%20-%20Regular&amp;fid=722174466b9ed1961ab5b9b6d810afad&amp;fsize=60&amp;text=MASA&amp;wrap=2" rel="nofollow">Collegiate Black FLF</a></strong> by Casady &amp; Greene [1988]</p>
      <p>"SPADL DESZCZ?" could be <strong><a class="freelinking external" href="http://www.dafont.com/bebas-neue.font?text=SPADL+DESZCZ%3F" rel="nofollow">Bebas Neue</a></strong> free font by Ryoichi Tsunekawa [Dharma Type, 2010]</p>
      <p>"LEPIEJ DESZCZ": I don't have an exact match, but it looks close to <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Google-Web-Fonts&amp;ffam=PT%20Sans%20-%20Regular&amp;fid=f2eadd43911fbf66f2bf5c8b32f69724&amp;fsize=60&amp;text=LEPIEJ%20DESZCZ&amp;wrap=2" rel="nofollow">PT Sans</a></strong> by ParaType [2009] now part of Google Web Fonts</p>
      <p>"niz" is a modified <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Adobe&amp;ffam=Adobe%20Caslon%20-%20Bold%20Italic&amp;fid=5019f08eb3750eedae035769c2e102ca&amp;fsize=60&amp;text=niz&amp;wrap=2" rel="nofollow">Adobe Caslon (Bold Italic)</a></strong></p>
