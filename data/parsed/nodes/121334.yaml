      <p>EDIT: It appears that Don and I had the same idea...</p>
      <p>The graphic style derives from the architectural style of the same name. In the US, notable buildings in the style include Grand Central Terminal and the New York Public Library in NYC and Union Stations in Washington, D.C., and Chicago. In the UK, you have Selfridge’s and 14 Prince's Gate in London and Barrow-in-Furness Main Public Library, to name a few.</p>
      <p>If I had to describe the typographic style, I’d say it references classical models (Roman stone inscriptions), but experiments with proportions and decorative elements, much like the architecture.</p>
      <p>You’ll want to focus your search on typefaces designed between 1880 and 1920, or revivals of type from that era.</p>
      <p>A  beaux-arts revival typeface and similar typefaces:<br><a href="http://www.fontbureau.com/fonts/GrandCentral/">http://www.fontbureau.com/fonts/GrandCentral/</a><br><a href="http://www.identifont.com/find?similar=Grand+Central&amp;q=Go">http://www.identifont.com/find?similar=Grand+Central&amp;q=Go</a></p>
      <p>Some other beaux-arts resources that might prove helpful:<br><a href="http://typophile.com/node/44559">http://typophile.com/node/44559</a><br><a href="http://guity-novin.blogspot.com/2012/03/graphic-design-and-french-school.html">http://guity-novin.blogspot.com/2012/03/graphic-design-and-french-school...</a><br><a href="http://en.wikipedia.org/wiki/Beaux-Arts_architecture">http://en.wikipedia.org/wiki/Beaux-Arts_architecture</a><br><a href="http://books.google.com/books?id=0kf0AwAAQBAJ&amp;lpg=PA52&amp;ots=FBWyW3zE0r&amp;dq=%22beaux%20arts%20style%22%20graphic%20design&amp;pg=PA52#v=onepage&amp;q=%22beaux%20arts%20style%22%20graphic%20design&amp;f=false">http://books.google.com/books?id=0kf0AwAAQBAJ&amp;lpg=PA52&amp;ots=FBWyW3zE0r&amp;dq...</a></p>
