      <div class="comment-spam-body"><p>Tobias Frere-Jones designed Grand Central <a href="http://www.fontbureau.com/fonts/GrandCentral/" title="http://www.fontbureau.com/fonts/GrandCentral/">http://www.fontbureau.com/fonts/GrandCentral/</a> based on late 1920s Beaux Arts capital letters hand-painted on the walls of Grand Central Station in New York City. This style of letter originated with the French Oldstyle letters by Louis Perrin in Lyons in 1846. In Europe it is Elzevir and in the U.S. it was De Vinne -- different from the digital font that now uses the De Vinne name.<br>
      Previous Braux Arts fonts thread <a href="http://typophile.com/node/44559" title="http://typophile.com/node/44559">http://typophile.com/node/44559</a> Not very helpful.<br>
      Don</p>
      </div>
