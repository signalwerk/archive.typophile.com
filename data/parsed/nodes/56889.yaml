  html: |-
    <p>Is it appropriate to use punctuation in the vicinity of smiley faces?<br>
    For example :), does the comma look like a chin here?<br>
    I'm really confused :(...</p>
    <p>Sometimes I feel that surrounding punctuation undermines the legibility of those symbols  but on the other hand they should ideally be treated as full words.</p>
