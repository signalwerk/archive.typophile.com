  html: <p>Hello there. <br> <br>Small job here. It's an outdoor signage (2,4x0,40m) on acrilic + steel. This beautiful logo will be printed on vinyl and applied on the back side of the acrilic revealing a grey steel back as filling color (white space). I've choosen NEUTRAFACE as the type due to the... her... strange geometric concepts of the PAC logo. Any sugestion? I just can't ignore the logo <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br><img src="http://www.typophile.com/forums/messages/4100/24513.gif" alt=""></p>
