    html: <p>Have you tried puting into the location using a location photo &amp; photoshop? It can be a crude method but sometimes seeing what something looks like in context will show you that an otherwise wonderful design doesn't work in a specific space or place. I'd like to see the materials simulated too. That will tell you a great deal too. <br> <br>Regarding the design itself - I like what you have done. It's seems very restrained &amp; helpful rather than being showy. It's a good contrast with the logo. Having nice geometric Os does tie into the existing logo nicely. It seems responsible &amp; I mean that with respect.</p>
