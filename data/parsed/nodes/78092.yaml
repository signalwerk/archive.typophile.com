  html: |-
    <p>Hi everyone :)</p>
    <p>I need to find a print shop that will be able to print my brochure with the following requirements : </p>
    <p>- color printing<br>
    - on glossy white plastic sheets, A4 size, rounded corners (radius:50)<br>
    - untearable, unfoldable but bendable (400 gr.)<br>
    - 100 pages</p>
    <p>Do you know someone who could do that?<br>
    Since I'm located in France, an online print shop would be the best for me.</p>
    <p>Thanks a lot in advance :)</p>
