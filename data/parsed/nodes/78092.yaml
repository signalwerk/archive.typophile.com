    html: |-
      <p>I work at a printer USA and we have a HP Indigo 7000 digital printing press. It will print on different plastics, 12inx18in (304cm x 459cm). I'm betting there would be in printer in France that has one or it's competitor. We do it all the time on plastics. Some plastics need a treatment done to get the ink to stick though. For your finished size, it would probably print 2 on a sheet then round cornered via die, grinder or digital cutting table.</p>
      <p>More info Here: <a class="freelinking external" href="http://h10088.www1.hp.com/cda/gap/display/main/index.jsp?zn=gap&amp;cp=20000-13698-14391-14404^198593_4041_100__" rel="nofollow">HP Indigo 7000</a></p>
