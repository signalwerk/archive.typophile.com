    votes: null
    html: |-
      <p>You may find a sign shop that would inkjet print your design on adhesive vinyl and apply it to foamed PVC board (brand names such as Komatex, Sintra, etc. Other brands may be available in Europe) which can be obtained in thicknesses from 1mm to 25mm. A few shops may be able to print directly on the board, but rigid substrate printers consume a great deal of space and many smaller shops do not wish to sacrifice their working area to such monsters.</p>
      <p>A silkscreen printer (usually primarily a T-shirt printer, but most will accept other work) might be better able to handle your small quantity request, but might not have the corner rounding tool a sign shop has. Full-color can be done with silkscreen, but like anything that multiplies the set-up expense.</p>
      <p>There should be several sign shops and silkscreen printers in any area with a commercial base, even in France. With your very specific needs, it is better to be able to see the work done locally than to ship it off to some faraway land in mere hopes of getting a better price.</p>
      <p><a class="freelinking external" href="http://www.yupo.com/" rel="nofollow">Yupo</a> is a synthetic paper that may be more suited to your specifications than foamed PVC, and certain weights can be run through an ordinary offset press. It may not be economical for your small quantity, but there it is as another option to consider.</p>
    html_clean: |-
