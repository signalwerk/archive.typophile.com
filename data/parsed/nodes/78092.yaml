    html: |-
      <p>As others mentioned you might want to check with local sign shops. And I wonder if printers that prepare credit cards would be worth looking into, since they do high-quality printing on plastic with radius corners. The size and thickness would be different in your case, but they might be able to handle it or refer you to someone who could.</p>
      <p>By the way, you call it a "brochure" but that term (at least in the U.S.) usually refers to a folded piece. A piece that's a single unfolded sheet is usually called a flyer.</p>
