      <p>I've never been fully satisfied with the way the variuos versions of digital Sabon look. I've seen fews examples of Tschichold's original type from the late '60s (in books about type and typography) and it seems to me pretty much different from its digital renditions. What strikes me most is the shape of "a", for example: to my type-amateurish eye it looks narrower than the fatter "a" of, say, digital Adobe/Monotype Sabon. And the space between letters looks bigger in the digital version. In this respect, Sabon Next seems to me like a more faithful rendition of Tschichold's original work.</p>
      <p>Take a look here:</p>
      <p><a href="http://books.google.com/books?id=FiJ87ixLs0sC&amp;printsec=frontcover&amp;dq=Anatomy+of+a+Typeface&amp;hl=com" title="http://books.google.com/books?id=FiJ87ixLs0sC&amp;printsec=frontcover&amp;dq=Anatomy+of+a+Typeface&amp;hl=com">http://books.google.com/books?id=FiJ87ixLs0sC&amp;printsec=frontcover&amp;dq=Ana...</a></p>
      <p>It's "Anatomy of a Typeface" By Alexander S. Lawson; go to pages 151-157 and see the differences between Linotype, Monotype, Stempel and Monophoto Sabon. They look like four distinct types; and the digital version seems drawned on the basis of the Monotype version, while Sabon Next looks closer to the Linotype cut.</p>
      <p>And here's a (very bad) scan from a book by Jost Hochuli, showing Sabon Linotype on top and photocomp (bottom).</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/hochuli_sabon_4342.jpg"></div><p></p>
