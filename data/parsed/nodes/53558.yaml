      <p>Thanks Kent, nice piece of detective work!</p>
      <p>So, given that the face exists in a well-populated category, it wouldn't be Sabon without the wide roman "a", which is pretty much what Charles is saying.</p>
      <p>As so much of Sabon's identity, as designed, is predicated on its metrics, it's hard to see how Sabon Next is really a Sabon at all, other than trading on the name.</p>
      <p>But if you have to choose between Sabon and Sabon Next, I think the role of italics in your layout would be a deciding factor--whether you want them narrower than the roman, which is traditional and normal for a Garalde, or whether the more "modern" effect, of broad italics, which is distinctive in Sabon, is more to your fancy.</p>
      <p>(I say "modern", because it was a feature of the "pot-hook" style of italic in the early 19th century that it had a very similar character-count to the roman.)</p>
