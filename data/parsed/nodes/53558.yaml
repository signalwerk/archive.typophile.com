    date: 2009-01-21T19:14:00
    votes: null
    html: |-
      <p>Don't forget the effects of processing silver materials -- Lith film, and "lith" repro paper did not have a 90-degree slope.</p>
      <p>With most photocomp fonts, we "overexposed" and "overdeveloped" to get a little more gain with the fine strokes. Of course, the nature of a silver halide crystal being what it is, the heavy strokes picked up even more density (gain). The price you paid to get the fine lines from fonts not properly adjusted for the technology.</p>
      <p>And in making the negative, the printer tended to "underexpose" to reduce the lines needing opaquing. More gain.</p>
      <p>On Nick's skipping repro &amp; going straight to negative material -- I believe there was one time when we ran film, as a negative, on the Linotron 202. Frightfully expensive.</p>
      <p>On the whole matter of different masters in metal, of course. In the earlier days of photocomp, you could purchase different master sizes for a few fonts -- an 18-point, 12-point, and 8-point were the most common master sizes. Sometimes you simply used the 8-point for text, as it was the only one where the fine lines stood a chance of printing.</p>
      <p>And I remember Richard Eckersley using a font -- Vendome(?) for the text of a book. It was only available in an 18-point master, which meant we had to play a lot of tricks to get it to work.</p>
      <p>By in large, photocomp was pretty screwed up, but in some ways, such as different masters, it was ahead of where we are with most digital type. I see the 4- and 5-"masters" available from Adobe as a step toward recovery. Countering this is graphic designers (not type designers) falling out of love with a typeface about as fast as casual listeners fall out of love with the latest hit song, so there isn't time for us comps (end users) to fix things, even when a font has a lot of potential.</p>
      <p>This fixing isn't just a matter for type designers. It takes the graphic designers and the comps too; nobody, no matter how clever, can create a typeface that satisfies all needs.</p>
