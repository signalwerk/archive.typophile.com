    html: |-
      <p>The original artwork of the typeface letters was reproduced photographically four times:</p>
      <ol>
      <li>Original artwork of letters, from which a negative image was shot onto, for instance a glass grid (Diatronic). The original artwork had pre-emptive "ticks" to counteract image loss, however.</li>
      <li>Galley made--this was a positive image exposed from the font's negative image, through a lens, onto photo paper.</li>
      <li>Galley pasted onto artboard, negative film shot from artboard, through a lens.</li>
      <li>Film assembly contact printed as positive image onto printing plate.</li>
      </ol>
      <p>Compare with direct-to-plate digital imaging.</p>
      <p>In theory, it was possible to make the galley directly onto negative film, and skip step 3, but I didn't know anyone who did that. One  reason being that mechanical assembly artists were paid less than filmstrippers. Also more difficult to make proofs and do "author's alterations" to the copy (text).</p>
  - id: 324101
    user_id: 5094
    user_name: charles ellertson
