      <p>At our shop, there was a period where we were using both the Linotron 202 photocomp machine, and PostScript fonts, but with the output still on repro paper.</p>
      <p>The Sabon coming out of the 202 was better than the Linotype PostScript Sabon -- both to repro -- at least to my eye.</p>
      <p>So that's point one. I found another Sabon that didn't specifically prohibit modification, and reworked the italics. A long time ago, but as I remember, I threw out all the setwidths and reworked all the wide letters. I had sample of at least one foundry Sabon to look at, though I believe it was fairly large size. Also took the look of some characters from (of all things) Bernier, an A-M offering based on some Monotype Sabon.</p>
      <p>Well, my drawing skills rival Jake the Plumbers, but it was OK in text sizes. Taught me a fair bit, &amp; we still use it with jobs after informing the customer. </p>
      <p>But the main thing it taught me was sometimes it is best not to hang onto a typeface after a couple technological changes, even though it was a superlative font for it's intended use.</p>
