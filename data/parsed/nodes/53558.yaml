      <p><cite>"The wide roman a without which Nick says Sabon is not Sabon - - is not present in the larger sizes. (Nor is it present in the Scangraphic version which was digitized from a less familiar metal source."</cite></p>
      <p>Bill, you're a great source of historical information as always. I've never seen any version of Sabon by Scangraphic - and it would be interesting to see a sample.</p>
