      <p>It is a long story -- too long for a single post. But how about this: Sabon is basically a Garamond -- a *Garamond* Garamond rather than a *Jannon* "Garamond" (another long story).</p>
      <p>Sabon was commissioned in the hot metal days, so that both the Monotype and Linotype fonts would be the same.</p>
      <p>Lots of differences here -- , Monotype is based on the em-system and Linotype is not. With an em-based system, every character (sort) must have even units in width. Originally, an 18-unit em, I believe. No such limitation in Linotype.</p>
      <p>BUT. Linotype used duplexed mats, usually meaning the italic and roman were on the same matrix, and so had to have the same width.</p>
      <p>Fonts for machine-setting with Linotype/Monotype are different from foundry type, which has neither limitation. (Severe limitations in setting speed, though.) I believe originally, the commission was to have all three the same, but in the event, the machine-set fonts were the same, but different from the foundry fonts. If I have this wrong, somebody on this board will correct me.</p>
      <p>So. Sabon was a wonderful compromise, given the objectives. None of these objectives remain in today's composition. In fact, they were absent in the earlier photocomp days (em system yes, but a 54-unit em with Linotype and a 96-unit em with the last Monotype phtocomp machine). BUT. As it happened, Sabon in Linotype photocomp just happened to work out as a very good font -- it printed well. The italic was gappy, but you lived with it. The roman printed better than most other Linotron photocomp fonts</p>
      <p>So from my perspective, Sabon Next was completely recut to get rid of the compromises which occasioned the font in the first place. That essentially makes it another Garamond (of the "Garamond" variety). Take you pick.</p>
      <p>For more, search the web . . .</p>
