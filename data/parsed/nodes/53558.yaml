      <p><em>As so much of Sabon’s identity, as designed, is predicated on its metrics, it’s hard to see how Sabon Next is really a Sabon at all, other than trading on the name.</em></p>
      <p>It is worth bearing in mind that Tschichold designed Sabon for three different companies and their respective typesetting systems, not two: Linotype, Monotype, and Stempel 'foundry type', i.e, handset type. And despite the goal of making a metrically equivalent design for both Linotype and Monotype, the three designs were not identical. The foundry type version was not constrained by the mechanical restrictions, and if I recall correctly there is some indication that Tschichold designed the foundry version first and then modified the design to fit the restrictions of the mechanical systems. Jean François' Sabon Next is actually quite close to Tschichold's drawings <em>for the foundry version,</em> with additional influence from the same 16th Century specimen from which Tschichold himself worked. The specimen book and history that Linotype produced for Sabon Next is worth getting hold of if you can find a copy.</p>
      <p>That said, it remains a fact that very few people are familiar with Sabon in its original foundry version, and most typographers know it from the mechanical and derived photomechanical and digital versions. So there is a sense that Sabon properly has weird features like the huge italic o, because that is the form with which people are familiar.</p>
      <p>Also, I do think the regular weight of Sabon Next is too light for use below 12pt, which limits its effectiveness as a text face.</p>
