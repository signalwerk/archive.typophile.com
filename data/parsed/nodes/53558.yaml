      <p>&gt;Nick: it wouldn’t be Sabon without the wide roman “a”,</p>
      <p>&gt;Jean François’ Sabon Next is actually quite close to Tschichold’s drawings for the foundry version, with additional influence from the same 16th Century specimen from which Tschichold himself worked.</p>
      <p>DUH. Please remember that metal Sabon is not ONE design but many SIZE-OPTIMIZED designs. </p>
      <p>The wide roman a without which Nick says Sabon is not Sabon - - is not present in the larger sizes. (Nor is it present in the Scangraphic version which was digitized from a less familiar metal source.) (Didn't Stephen Harper go into all of this in the early 90s?)</p>
      <p>You can't discuss historical type design while you're still thinking in terms of a typeface that has a unitary, one-size-fits-all design. </p>
      <p>And that's the problem with type design since 1960!</p>
      <p>&gt;The point I was making: letterpress has ink gain to begin with, whereas phototype was likely to lose fine details, e.g. hairlines, as the image was repeatedly copied during the production process. This was why faces like ITC Garamond and Galliard were dodgy for text, pre-digital.</p>
      <p>Some would argue that the limitless resolution of a good photo master provides infinitely more subtlety and information than any Postscript version with its crude 1000x1000 unit grid. <em>Especially</em> for a face like Galliard or ITC Garamond. (The spectacular crudeness of Adobe Galliard is a special case.)</p>
