  html: '<p>Announcing a new, very round typeface: Circula™. It is a simplified geometric display typeface based on circles. It contains capitals and small capitals only (no lower case), basic symbols, superior and inferior numbers and common fractions. It supports Eastern European, Baltic and Turkish character sets. The medium cut is <em>free</em>. Get it at <a href="http://new.myfonts.com/fonts/paragraph/circula/">Myfonts</a>.<br><img src="/sites/default/files/old-images/circula-poster_4894.png"></p>'
