    <p><strong><a class="freelinking external" href="http://www.fontbureau.com/fonts/SalvoSans/" rel="nofollow">Salvo Sans</a> &amp; <a class="freelinking external" href="http://www.fontbureau.com/fonts/SalvoSerif/" rel="nofollow">Salvo Serif</a></strong><br>
    <a class="freelinking external" href="http://www.fontbureau.com/people/CyrusHighsmith/" rel="nofollow">Cyrus Highsmith</a> designed Salvo Sans &amp; Salvo Serif (originally called Boomer Sans &amp; Boomer Serif) as one series to tie the design of <em>AARP The Magazine</em> to <em>AARP The Bulletin</em> and <em>AARP Segunda Juventud</em>. Together the Salvos illustrate the guiding sentiments of the design director Courtney Murphy, “Hopeful, informative, alive, embracing and delightful. The right words draw people in, but on a subconscious level the typeface does that first.” FB 2007, 2011</p>
    <p>30 styles each: Light, Regular, Medium, Bold, and Black, all with Italics, in Normal, Condensed, and Extra Condensed Widths</p>
    <p>Salvo Sans &amp; Salvo Serif are available as OpenType fonts with both proportional and tabular figures plus arbitrary fractions.</p>
