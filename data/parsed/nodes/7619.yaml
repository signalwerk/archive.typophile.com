  html: <p>Is there a particular reason why opentype fonts cause problems or even crashes on Mac Os X Panther (applications like Safari, software actualisation, preferences, etc... doesn�t work correctly) ? <br> <br>Would it be possible that it is because the fonts have been sended from a Pc (used to edit the fonts) to a Mac, by e-mail ? <br> <br>  <br> <br>Thanks a lot, <br> <br>Elena Albertoni</p>
