    html: "<p>Remove the fonts from fonts folder, put on trash all OT fonts created, then put the X font cache on trash: <br> <br>HD/System/Library/Caches/fontTablesAnnex <br> <br>restart the OS, create another OT, with different date and version number. If its still doesn't working... hum, well, don't know, the font is not good. :-) <br> <br>Good luck!</p>"
