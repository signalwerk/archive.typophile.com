  html: |-
    <p>Over the years, I've been very enamored with Eurostile for a variety of applications.  I like that Eurostile has this very square look, but retains rounded edges to keep it from being overbearing. However, it's a bit too cold for what I'm trying to do at the moment.</p>
    <p>Does anyone have some recommendations?</p>
