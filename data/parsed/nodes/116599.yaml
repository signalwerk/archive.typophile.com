      <p>"even those of us who still cling to..."<br>
      I would delete "of us". It sounds like you're trying too hard to be a part of the group. Plus you already use "we" later in the same sentence.</p>
      <p>"and before the one space that follows."<br>
      This is unclear; I might know what you mean, but I would just delete this. It's too confusing.</p>
      <p>"beyond saving"<br>
      This joke is going to fall flat, at best, with your target audience.</p>
      <p>"our fonts for us, we only need..."<br>
      I would delete "for us". You are already using "our" and "we" in the same short phrase.</p>
      <p>Really, what you need are references to 10 or 15 or 20 authoritative sources (books or web) that make it clear that two spaces is a thing of the past. Start here:</p>
      <p>Matthew Butterick's Practical Typography<br>
      <a href="http://practicaltypography.com/" title="http://practicaltypography.com/">http://practicaltypography.com/</a><br>
      <a href="http://practicaltypography.com/one-space-between-sentences.html" title="http://practicaltypography.com/one-space-between-sentences.html">http://practicaltypography.com/one-space-between-sentences.html</a></p>
