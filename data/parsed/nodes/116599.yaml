    <p>Fellow type enthusiasts,</p>
    <p>I would like to submit the following short article which I wrote to explain the difference between monospaced fonts and proportional fonts, and why the latter requires only one space between the end of one sentence after the period, and the start of the next.</p>
    <p>My intent is to convince the double-spacers in my office that there is a real reason why they should convert. I have attempted to provide a historically accurate explanation, written as concisely as possible. I would appreciate any comments, including assurances that my facts are historically accurate.</p>
    <p>There is more that could be said on this topic, but brevity is extremely important here.</p>
    <p>Thanks in advance for your advice on this topic which continues to confuse people to this day!<br>
    John Sullivan</p>
