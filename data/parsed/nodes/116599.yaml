      <p>Wow. Butterick’s explanation is awesome. Thanks to Tillman for sharing it. It provides lots of other references, too.</p>
      <p>I will just add one more example: Web browsers automatically suppress multiple spaces at the end of a sentence, and turn them into a single space when they display the text. They are not icons of high-end typography, but this one thing they do.</p>
