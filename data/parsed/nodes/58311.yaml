    <p></p><div class="imageWrap"><img src="http://typophile.com/files/T0283_01_3800.jpg"></div><p></p>
    <p>Distill draws its inspiration mainly from Theo van Doesburg's De Stijl era lettering. The type he designed for the Aubette Café, De Stijl Magazine, etc. was used as a starting point and then expanded upon. While this typeface was inspired by historical references, it also has the ability to invoke a contemporary feel under the right conditions. Distill will work hard whether you are designing a neo-constructivist poster or a futuristic website. Distill is a family of 12 fonts: 4 weights, each containing condensed, regular, and expanded widths. It also features several alternate characters.<br>
    <a href="http://www.youworkforthem.com/product.php?sku=T0283" title="http://www.youworkforthem.com/product.php?sku=T0283">http://www.youworkforthem.com/product.php?sku=T0283</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/T0267_01_3756.jpg"></div><p></p>
    <p>Bandoleer from MADType is a new stencil typeface family. Inspiration for the typeface came from both Art Deco and Military sources. It comes with both a clean geometric and hand drawn version so you don't have to get carpal tunnel sketching it out yourself. This typeface is equally at home stenciled with paint on a wall or used on a music poster.<br>
    <a href="http://www.youworkforthem.com/product.php?sku=T0267" title="http://www.youworkforthem.com/product.php?sku=T0267">http://www.youworkforthem.com/product.php?sku=T0267</a></p>
