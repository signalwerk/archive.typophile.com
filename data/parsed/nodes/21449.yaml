    html: |-
      <p>Thanks Userone for that info.</p>
      <p>It is a great logo and the type works really well, I just wish they would use it more. Their website and other print materials use a lot of other display fonts none of which are as characteristic as the logo.</p>
      <p>Whenever I saw the logo and type it reminded me of Alex Scholing's 'Engine' &amp; 'Roice' fonts for FontFont. Similar qualities but very different.</p>
