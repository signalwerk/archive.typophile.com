      <p>The typeface used looks a lot like a fat version of <a href="http://bowfinprintworks.com/SerifGuide/serifsamples/serif_s/stymie_hairline_full.gif" rel="nofollow">ITC Stymie Hairline</a>, which had the same single-storey 'a' and serif on the 'y'. (I don't think this font is sold any more. I made this sample from an old Image Club font.)</p>
      <p>- Mike Yanega</p>
