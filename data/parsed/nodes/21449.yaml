    <p>Dear All,</p>
    <p>Posted this a little while ago but there were no takers, so try again...</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Takashimaya Sample_6125.jpg"></div><p></p>
    <p>This is the logotype from one of the large department stores here in Japan, Takashimaya (I am always seeing this one as it is my wife's favourite department store here! This one from a bag of rye bread).</p>
    <p>I am curious to know whether it is a font or custom lettering?</p>
    <p>Thanks,</p>
    <p>Grant</p>
