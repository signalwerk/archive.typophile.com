    html: |-
      <p>This is a *great* logo.</p>
      <p>I don't think you will find this as a font unless commissioned by head office.<br>
      Here is info from "Changes in logos and trademarks in Japan":</p>
      <p>The trademark with the Chinese character TAKA in a circle, the identical character when seen from the front or behind.</p>
      <p>version of circle-mark shown from 1886</p>
      <p>The mark registered in 1904. In 1968, the prototype of the mark was established to avoid distorted shapes by branches.</p>
