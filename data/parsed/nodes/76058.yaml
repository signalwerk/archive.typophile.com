    html: |-
      <p>It is true that type scales are used less these days, because so much of typesetting is done digitally.</p>
      <p>Also, laser photocopiers might enlarge by 4% or so as a precaution against counterfeiting. Even if laser printers don't do that, I wouldn't be surprised if computer systems would tend to start with a point size of exactly 1/72 inches, and then round it to the nearest multiple of 1/300 inch for most laser printers, and then the laser printer would actually print in units of 2.5 centimeters divided by 300, not one inch divided by 300.</p>
      <p>And if you don't live in an English-speaking country, any type scale you are likely to encounter would be in Didot points.</p>
      <p>So I can think of all sorts of things that could go wrong.</p>
