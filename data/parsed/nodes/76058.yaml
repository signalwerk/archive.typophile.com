  html: |-
    <p>Ever since a friend showed me what he called a "picómetro" in Spanish, I have been fond of the typescale as a tool particular to the craft of typography, and sure enough over the years I have found it pretty handy for page design and adjustments, even if mostly to compare against the measures in the computer file. </p>
    <p>Someone must keep buying typescales, since they seem to be persistently in stock (in art shops in the UK, and I came across one in Dubai not long ago), but I wonder, how useful are they considered by the typophiles? What use are they generally given in these digital times? </p>
    <p>And is there a particular typescale that can be recommended or deprecated? So far I am acquainted with:</p>
    <p>--Caxton typescale<br>
    --Linex DTP 30<br>
    --ruler.tex (as found in <a href="http://tug.ctan.org/" title="http://tug.ctan.org/">http://tug.ctan.org/</a>)<br>
    --Depth Scale (Technical Sales, London)</p>
    <p>Incidentally, this last one (I just got) appears to be seriously wrong in its measures. Anyone who can comment on this?</p>
    <p>Servus!<br>
    Juan</p>
