  html: "<p>Sorkin Type Co. was founded in 2011. It is currently engaged in making fonts for the Google Web Font project. Families and improved versions of these types will be available to license for both print and web use in the future. Designers creating these fonts include:  Elena Albertoni, Nicole Fally, Riccardo De Franceschi,  James Grieshaber, Karolina Lach, Viktoriya Gadomska-Grabowska, and Eben Sorkin.</p>"
