    html: |-
      <p>It's interesting looking in Jaspert's "Encyclopaedia of Type Faces", because that book shows "Post Roman" as a Berthold typeface from 1937 that seems to match this sample. It has a lower case, but the showings include "Post Title", which is all caps.  The Medium weights of each face has a very wide A and W, noticeably wider than in the Light and Bold weight versions.</p>
      <p>The digital "Post-Antiqua" seems to have called the Bold version "Medium" and has only two weights now.</p>
      <p>- Mike Yanega</p>
