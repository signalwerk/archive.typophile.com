    <p>I bought a pile of 1940s-50s Swedish poetry books yesterday at a second-hand book store, among them this 1947 collection. At first I assumed the cover was lettered (because 1940s), but on closer inspection it's clearly type, with exactly repeating characters.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/DSC_0135_lr_5093.jpg"></div><p></p>
    <p>Sorry for the lighting issues. Attached is as high-res as my phone camera allows if it helps; it's actually a fair bit crisper than that in real life.</p>
