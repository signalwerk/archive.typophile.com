      <p>In light of the above, I changed the solving credit to Albert Jan. I hope you don't mind, Ryuk, thanks for your effort as well!</p>
      <p>Is it just me or have both of the digital versions significantly tempered the most unique aspect of the type on the title page, the extreme letter widths on A and W?</p>
  - id: 572467
