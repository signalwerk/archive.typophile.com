    html: |-
      <p>That’s Post-Antiqua. It was designed by Herbert Post in 1932 for the Berthold type foundry in Berlin.<br>
      <a href="http://www.myfonts.com/fonts/berthold/post-antiqua-bq/" title="http://www.myfonts.com/fonts/berthold/post-antiqua-bq/">http://www.myfonts.com/fonts/berthold/post-antiqua-bq/</a><br>
      Procopius is a match, but the spacing seems to be corrupted, try Ja … or type in nbnjn. The side bearings have probably been set on an equal value, calculated from the x-extremes. The apostrophe, the quotes and the @ look as if they were taken from Arial. The euro is missing etc. …</p>
