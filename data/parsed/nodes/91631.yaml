    html: '<p>Sorry for being so late. I have provided a updated version of the Nudge Tool in the <a class="freelinking external" href="http://forum.fontlab.com/downloads.html;sa=view;down=5" rel="nofollow">download section at the FontLab Forum</a>. This version is MM aware and works always on the active master. It comes in two pieces: one tool script and a modified version of the InterpolateNode module. Other tools which depend on the InterpolateNode module will also benefit from the update, if you redirect the import statements to this new version (as far as I have tested).</p>'
