  html: <p>Is there a way to modify interpolated nudge so that it works on the currently viewed master? Currently, I have to use Rearrange Master to make the weight I want to work on wt0 so that Interpolate Master works properly. Just switching to "Next Master" would be much faster and efficient.</p>
