  html: |-
    <p>Hi everybody,<br>
    I have run some tests in order to evaluate the legibility of the fonts included in the "<a href="http://code.google.com/webfonts" rel="nofollow">Google font directory</a>".<br>
    I have tried to read a text at about 50cm from my screen and evaluated the legibility of each of the 18 fonts from 9 to 18pt x-height with 3 levels : non-legible / difficult legibility / good legibility.<br>
    The tests have been run up on Firefox (last version) and 3 OS : Mac OS-X / Win Vista and Win XP.</p>
    <p>The results of these tests are included in a <strong>pdf document</strong>, a kind of "Google fonts legibility cheat sheet".<br>
    If you are interested, you could <strong>download it for free</strong> (CC-licence).<br>
    Here is the link : <strong><a href="http://all-for-design.com/wp-content/uploads/2010/gfd/gdf-english.pdf" rel="nofollow">Google fonts legibility</a></strong>.</p>
    <p>I have written <a href="http://all-for-design.com/typographie/google-fonts-tests-de-lisibilite" rel="nofollow">an article (fr)</a> to explain my methodology on my blog. I will try to make an english translation when I would have some extra time.</p>
    <p>I think this pdf could be useful for everyone who wanted to choose a legible display font in the <a href="http://code.google.com/webfonts" rel="nofollow">Google font directory</a> to be used on the web.</p>
    <p><em>a french version of the pdf is available here : <strong><a href="http://all-for-design.com/wp-content/uploads/2010/gfd/gdf-french.pdf" rel="nofollow">Google fonts legibility (fr)</a></strong></em></p>
