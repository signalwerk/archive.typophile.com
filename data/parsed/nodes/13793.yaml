  html: |-
    <p>hi!</p>
    <p>i created this logo-drafts for the it-company “sys-it”.<br>
    they offer For small and medium sized companies all-inclusive it-support with open-source-software and the creation of content-management-systems (cms).<br>
    So it´s a bit like “Turn the existing chaos into a clear system”</p>
    <p>it´s a selfmade font, together with different signs.<br>
    the color will be either yellow (m30, y100) with cyan (100%) or one of them together with black.<br>
    now it´s time to decide which one is the best (or throw them away and create new ones …)</p>
    <p>thanks for your critics!</p>
    <p>greetings,<br>
    nau</p>
