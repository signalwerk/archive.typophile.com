    <p>Hello.</p>
    <p>I’m designing my own wedding invitations and am considering Zanzibar for some of the larger text, e.g. our names. We’re doing a jazz/art deco theme with a peacock motif throughout and I like Zanzibar for it’s movement. I’d like to use a font reminiscent of the 1920s era that will be highly legible when letter pressed, probably a sans, (and is not too over the top) for additional information on the invites. Any suggestions on what would compliment Zanzibar best and still get the feel across?</p>
    <p>Thanks!</p>
