      <p>I prefer spaces. IMHO by using no spaces for em dashes and spaces for en dashes we can make reading easier via by providing context clues that can be picked up in parafoveal vision. </p>
      <p>It’s also (IMHO) to keep things less complex. That way one is less likely to confuse weaker readers and it creates fewer trivial rules for designers and editors to deal with.</p>
