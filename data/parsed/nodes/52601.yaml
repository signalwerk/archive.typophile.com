      <p><cite>I’m sure everybody would agree that “The Elements of Typographic Style” by Robert Bringhurst is one of the most authoritative books on typography ever . . .</cite></p>
      <p>Actually, no, and I'm not alone here. I'll allow that from time to time, it is useful.</p>
      <p>I like the rest of your post, but again, it is the editor's call in a author &gt; editor &gt; designer &gt; (maybe comp) workflow.</p>
      <p>* * *</p>
      <p>Patty,</p>
      <p>I've always gotten around certain editorial prejudices on small matters by doing the work in the font. Ever since PostScript fonts and Fontographer became available, I've gone into the fonts &amp; reworked them. Mostly this is kerning, and if you wanted to kern the digit-dash-digit combinations, thats how to do it.</p>
      <p>I started using an em dash of three-quarter's em length with 1/8-em l&amp;r sidebearings to help Richard Eckersley (British) reach a compromise with his editors at Nebraska. In the end, Richard preferred this to either the word-spaced en-dash or full-length em dash. With this dash, I've only been called by an editor once in 16 years, and the explanation of "that's how it is in the font" seemed to satisfy them. </p>
      <p>Further refinements can be to set the width of the "ink" in the dash to the width of a capital M or W, whichever is longer, again with the small but significant sidebearings.</p>
      <p>The en-dash needs work too, as all too often it has no sidebearings. This may be the source of the original post. I usually start by giving the en-dash the same sidebearings as the hyphen, &amp; work from there. Kerning is still needed.</p>
      <p>This post is a bit off topic, because all these treatments of the dash build the spacing into the dash itself, so it is the same for all contexts. Still, it seems to be this *sameness* that gets things by most editors -- and it has been my experience that the few with a good enough eye to notice appreciate the work &amp; go along with it.</p>
