    html: <p>I agree with Bruce. I like having some space, but depending on the situation, a full character space may be too much. Inserting a smaller space in InDesign may be a better practice. Ultimately I believe these considerations are based upon the larger context of the piece on which you are working. The "negative/whitespace" that surrounds each letterform and each word must be carefully managed to create the feeling you want and effectively convey the information. Looking at the spacing attributes of an en dash in relation to the whole, as opposed to a general rule of practice, is very important. I also think that different typefaces require different spacing. I have always viewed the Chicago manual (and all such style manuals) as grammatic usage guides which are not specifically geared toward the needs of typographers and graphic designers. As such I design according to the benefit of the piece.</p>
