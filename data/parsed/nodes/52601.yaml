      <p>I'm sure everybody would agree that "The Elements of Typographic Style" by Robert Bringhurst is one of the most authoritative books on typography ever, and it says:</p>
      <p>5.2.1 Use close-set en dashes or three-to-em dashes between digits to indicate a range.</p>
      <p>Thus: 3--6 November; 4:30--5:00 PM; 25--30 mm. [...]</p>
      <p>When compound terms are linked with a dash in the midst of running prose, subtle clues of size and spacing can be crucial, and confusion can easily arise. A sentence such as <em>The office will be closed 24 December -- 3 January</em> is a linguistic and typographic trap. When it stands all alone in a schedule or list, the phrase <em>25 December -- 3 January</em> will be clear, but in running prose it is better both editorially and typographically to omit the dash and insert an honest preposition: <em>25 December to 3 January</em>.</p>
