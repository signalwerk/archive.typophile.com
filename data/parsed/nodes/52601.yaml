      <p>Thanks for the thinks. Yes, I prefer the thin space (if I am putting a space in) over the word space, and I will often globally kern en dash/number relationships (thanks to Quark XPress's kerning table edit) </p>
      <p>It is, as Charles says,  the editor's call, and on this job I will be doing it what I think is the "wrong" way. But what I'm curious about is if there is any documentary support for this approach (determined by function, not aesthetics) to dashes in these cases, i.e., July–August (no space) and July 5 – August 12 (space). </p>
      <p>I wonder if it is a British approach, because their traditions on the relationship between quotations and other punctuation has usually been determined by usage more that appearances. For example, the British would favour 'He said he was "sick".'</p>
      <p>Because "sick" is quoted within the sentence, the period must fall outside. In North America, the sentence would be:</p>
      <p>He said he was "sick."</p>
      <p>with the period inside the quotes.</p>
      <p>So perhaps it's a mstter of national philosophy.</p>
