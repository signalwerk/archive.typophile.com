    html: <p>John, if you haven't you might want to consider checking out some of the many varieties of Tibetan script. In addition to a "colloquial" cursive pen script, there are a number of other cursive styles used for commentaries and exegesis on Tibetan religious texts. On this page, the third of the three writing styles is one of several less formal cursive forms. <a href="http://nalandatranslation.org/offerings/the-vidyadharas-poetry/">http://nalandatranslation.org/offerings/the-vidyadharas-poetry/</a></p>
