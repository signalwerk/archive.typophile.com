    html: |-
      <p>The connection between Mongolian/Manchu writing and Aramaic, via Sogdian and Uighur, is well established. But the Uighurs (a Turkic people of Western China) were the first to rotate the Sogdian script and <a href="http://the_uighurs.tripod.com/images/scan.jpg" rel="nofollow">write/read it vertically</a>, presumably in imitation of Chinese writing (but read columns left-to-write).* The Mongolians adopted and adapted the old Uighur script. There is some scant evidence of Mongolian being written in other Chinese-style scripts, such as Kitan, also vertically, prior to the adoption of the Uighur script.</p>
      <p>*Later, after their conversion to Islam, the Uighurs adopted the nastaliq style of Perso-Arabic script, so their old script now survives primarily in the Mongolian context.</p>
    html_clean: |-
      <p>The connection between Mongolian/Manchu writing and Aramaic, via Sogdian and Uighur, is well established. But the Uighurs (a Turkic people of Western China) were the first to rotate the Sogdian script and <a href="http://the_uighurs.tripod.com/images/scan.jpg" rel="nofollow" class="link-external">write/read it vertically</a>, presumably in imitation of Chinese writing (but read columns left-to-write).* The Mongolians adopted and adapted the old Uighur script. There is some scant evidence of Mongolian being written in other Chinese-style scripts, such as Kitan, also vertically, prior to the adoption of the Uighur script.</p>
