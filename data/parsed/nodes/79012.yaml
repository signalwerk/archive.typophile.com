  html: |-
    <p>One of the theses I have put forward in various contexts on Typophile over the years is that every mature scribal culture produces both formal (literary, static) and informal (chancery, cursive) styles. So I was delighted to discover this illustration in György Kara’s <em>Books of the Mongolian nomads.</em> Most reproductions of Mongolian script focus on the formal literary hands found in religious manuscripts, and although I have seen examples of cursive brush style, this is the first specimen of a chancery quill style that I have seen. Isn't it splendid!<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/mongcurs_6700.jpg"></div><p></p>
