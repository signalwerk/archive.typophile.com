  html: |-
    <p>Hello, first time poster here! :)</p>
    <p>I'm looking for some critique on the typesetting &amp; layout of this white paper. Initially I wanted to do a two-column layout, but the text has so many breaks that the columns didn't flow very nicely, so I'm kinda stuck with one-column, which seems a bit boring to me.</p>
    <p>The fonts used are Neutraface 2, Belizio, and Chronicle Text for the main copy. This will be mainly for screen reading (that may change) so I didn't do facing-pages.</p>
    <p>Any comments/critiques are welcome!</p>
