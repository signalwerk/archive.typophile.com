      <p>I have the Brother HL5370DW printer as well, and it’s fine, but not really great when it comes to print type in small sizes IMHO. Some scans <a class="freelinking external" href="http://typophile.com/node/77541" rel="nofollow">here.</a> All in all, I’d say it’s a very good option if you have a limited budget.</p>
      <p><cite> &gt; would it actually be a smart thing buying a laser printer at the moment, i'm on a mac and the new OS Lion should come out around June</cite></p>
      <p>The problem is that you can’t work in March with a printer that you’ll buy in June. Since Brother has been updating the drivers for this model frequently (I was notified of the latest version one week ago or something), I’d say that it will be supported on Lion.</p>
