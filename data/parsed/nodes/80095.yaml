    <p>hey folks,</p>
    <p>Like the title says i'm looking to buy a good but affordable laser printer, my budget is around 200Euro's. Its going to be for type proofing but also to print out test pages for logo's, magazines etc.</p>
    <p>To be honest ive always had HP printers but i really do not like them, always had troubles with them after some time.</p>
    <p>is there any brand or specific model you guys can recommended, would really appreciate the help!</p>
    <p>(I know there are some topics about this subject but since there's always new models on the market i thought why not ask it again, maybe there's better stuff out there these days)</p>
