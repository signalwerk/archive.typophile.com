    html: |-
      <p>Thank you eliason.</p>
      <p>I am pretty sure that strange looking small r variation is not my invention, but I learned it in calligraphy class.</p>
      <p>All right, it looks like everyone is feeling odd about i. Actually I also do a bit (I felt that i is leaning too much).<br>
      I redesigned not only dot but stem too. Obviously this change was adapted to every ligature including i.</p>
      <p>In order to vary ascender characters, first l of ll ligature is shortened and d is very slightly shortend as well.<br>
      Overall, I exepct designers to utilize Opentype feature as I already prepare several variation for each asending characters.<br>
      Each of them has at least three other variations with the exeption of f.<br>
      Right now, if the ascenders or descenders of f crashes, there is no way to avoid it.<br>
      I think f should be made shorter from the very start so that it does not crash.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Newer-Tangerine_4211.gif"></div><p></p>
