    <p>Hi, everyone. I need your critique on my new script type. Since I am Japanese and have never designed a script type, I don't know if it's aesthetically good or bad. There is certain amount of alternates and ligatures, I did not post those images though.<br>
    Although this was supposed to be a display type,but one part I think that is cool is the shortened lowercases to avoid clashing the descender from upper line (see 'Alternate' section). I think it works nicely, but how do you feel?<br>
    Anyway, tell me anything you felt. I really like to know.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/pic2_5064.gif"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/pic1_4799.gif"></div><p></p>
