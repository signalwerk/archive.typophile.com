    html: |-
      <p>I hoped someone more expert than me could step forward.<br>
      Anyway, here are my thoughts:<br>
      1. You should revise spacing and kerning. The letters appears too tight and crowded.<br>
      Furthermore, even if this is an unconnected script, the letters’ flow should to some extent follow the one of cursive handwriting.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/american_5076.png"></div><div class="imageWrap"><img src="http://typophile.com/files/cursive_5970.png"></div><br>
      [cursive courtesy of fellow typophile Jess Latham’s <a href="http://www.bvfonts.com/fonts/fonts.php?pg=2&amp;show=free" rel="nofollow">Learning Curve</a>]<br>
      2. The dot of the “i” resembles a little too much an acute accent.<p></p>
