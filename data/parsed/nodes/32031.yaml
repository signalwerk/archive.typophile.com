    html: <p>Reggie – James is right about this; type-related design history on the web is in its infancy and there isn't much of it around, so you need to <em>physically</em> relocate yourself to a real bricks n'mortar library. Two books that have the same '20th-century-decade-by-decade' structure are 20th century type:remix by Lewis Blackwell (1998, Laurence King Publishing, London UK) and the earlier Graphic Design Sourcebook by Liz McQuiston and Barry Kitts (1987, Quarto Publishing, London UK). Both of them have a chapter devoted to the 1940s.</p>
