      <p><a href="http://typophile.com/wiki/Herbert%20Bayer" rel="nofollow">Herbert Bayer</a> emigrated to the United States in 1938 and set up practice in New York and with the PM Magazine December-January 1939-40 he wrote "Towards a Universal Type"...</p>
      <p><a href="http://www.drleslie.com/PMADMagazines/Spreads/bayer18_large.shtml" title="http://www.drleslie.com/PMADMagazines/Spreads/bayer18_large.shtml">http://www.drleslie.com/PMADMagazines/Spreads/bayer18_large.shtml</a></p>
