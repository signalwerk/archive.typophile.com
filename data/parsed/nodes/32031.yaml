      <p>Reggie</p>
      <p>An incident that has not been mentioned but one that had an enormous impact on the release of typeface designs (and a great many other things) from the very late 1920s through the War and into the late 1940s was this thing called the Great Depression, a succession of lengthly back to back recessions that essentially crippled world trade and economics, and basically led to World War as a solution. In this case, statistics don't lie, as much as they reveal.</p>
      <p>Gerald</p>
