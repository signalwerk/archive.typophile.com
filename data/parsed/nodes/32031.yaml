  html: <p>I am a Visual Communications student, and i am trying to find what fonts were popular for the 1940's.  More specific, fonts and styles used in advertising during this period and the history behind them.  i have not had much luck web searching for this info.  Is there no web sites with this info?  Any help, especially free sites for a student budget, would be greatly appreciated.  Thank You</p>
