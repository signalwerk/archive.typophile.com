      <p>For the same reason that new car design was suspended during WWII, new typeface design was not the primary thought going then. The type in use was from prior decades and what was available. The Library of Congress and the National Archives have collections of material printed during that time. I am sure there must be comparable collections in European libraries as well.</p>
      <p>ChrisL</p>
