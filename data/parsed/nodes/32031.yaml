      <p>I suggest you look for "old paper" shops in your area.<br>
      There is a subculture of people who collect and deal old paper ephemera -- comic books, posters, postcards, timetables, maps, stamps, money, certificates, (car) manuals, programs as well as magazines and newspapers. </p>
      <p>Alternatively, on the internet, search for well-known magazines.<br>
      Scientific American, National Geographic, Vogue, Mademoiselle.<br>
      Just enter "Fortune magazine 1945" - I just did and it's $4 on ebay. That magazine will have a sh!t-load of ads which will tell you much of what you need to know.</p>
      <p>Check out these pages (scroll down)<br>
      <a href="http://www.americanartarchives.com/dohanos.htm" title="http://www.americanartarchives.com/dohanos.htm">http://www.americanartarchives.com/dohanos.htm</a></p>
      <p>To identify and date the fonts in ads, use Matt McGrew's "American Metal Typefaces of the Twentieth Century" (Oak Knoll), which is remarkably comprehensive. If an ad "type" isn't in there, it's probably hand lettering.</p>
