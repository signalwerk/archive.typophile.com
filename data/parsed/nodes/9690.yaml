    html: "<p>Good question. <br> <br>Legal: nothing. <br> <br>Ethical: to me what would be nice is to give due credit to the source, and maybe alert the original designer of what you're planning, however reserving the right to go ahead or not depending on his reaction. <br> <br>hhp</p>"
