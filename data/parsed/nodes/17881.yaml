    date_raw: 15 Feb 2006 — 6:52pm
    votes: null
    html: |-
      <p>Dan &amp; Mark - <a href="http://www.printerm.com/micrdef.htm" title="http://www.printerm.com/micrdef.htm">http://www.printerm.com/micrdef.htm</a></p>
      <p>This page may explain the purpose of the thick/thin patterns.</p>
      <p>It seems that the MICR readers detect the presence of the magnetic ink over time. I suppose the thin/thick patterns of the E-13B helps differentiate each figure in order to increase the speed and accuracy of the face. The page I linked above seems to provide a technical explaination for the varying widths of the characters.</p>
      <p>Also, it is interesting to see how different the other MICR typefaces are, especially the CMC-7 below. It even has an accompanying alphabet !</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/cmc7.jpg"></div><br>
