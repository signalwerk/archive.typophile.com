    <p><strong>TYPE BATTLE: Week 5 (13 Feb)</strong></p>
    <p>Here's your chance to stretch your type muscles on a weekly basis. Each game kicks off on Monday with a new challenge, and closes at midnight PST on Friday. Anyone may submit a design response to the challenge. You may enter as often as you wish. Post anytime. Critiques and comments are welcome throughout the game, from participants and spectators alike. Smack talk is encouraged. </p>
    <p>Winner take all, no holds barred. May be the best designer win.</p>
    <p>Link directly to this thread: <a href="http://www.typophile.com/battle05" rel="nofollow">http://www.typophile.com/battle05</a></p>
    <p><strong>Requirements:</strong></p>
    <p>- Size: 600 width x 400 height. 72  dpi<br>
    - Color: Black and white only<br>
    - Format: Please save your graphics as PNG<br>
    - Only respond with the characters posted in the challenge.</p>
    <p>// <strong>THIS WEEK'S CHALLENGE:<br>
    // Using ONLY the following <a href="/wiki/MICR" class="freelinking" rel="nofollow">MICR</a> specimen as reference, design 5 characters of an accompanying alphabet.</strong><br>
    <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=BT.6419.0.3&amp;attributes.sampleSize=48&amp;sampleText=1234567890&amp;sampleSize=60" rel="nofollow"></a></p><div class="imageWrap"><a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=BT.6419.0.3&amp;attributes.sampleSize=48&amp;sampleText=1234567890&amp;sampleSize=60" rel="nofollow"><img src="http://typophile.com/files/micr0-9.png"></a></div><p></p>
