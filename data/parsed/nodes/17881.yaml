    html: |-
      <p>Alia,</p>
      <p>It has to do with how Illustrator deals with CMYK black versus RGB black. One of the black defaults in Illustrator is a "rich black" composed of different levels of C, M, Y, and K. The other is C0 M0 Y0 K100, and shows up as a very dark grey. In the most recent version of Illustrator, you can change how it handles black as far as displaying, printing, and exporting to other applications.</p>
      <p>Alternately, you can always just save the image from Illustrator using the "Save for Web" feature; it is extremely handy. Just set your crop marks in advance.</p>
      <p>- Josh</p>
      <p>—æ——æ——æ——æ——æ——æ——æ——æ——æ——æ——æ——æ——æ——æ——æ—<br>
