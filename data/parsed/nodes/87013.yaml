      <p>Part of the problem may be that Latin Extended D is relatively new and not all software might support it. As a name, uni00FE00AF is less than ideal since u00AF isn't a combining mark but a spacing character. Acrobat's 'ignore diacritics' might not view slashed thorn as a thorn plus a diacritic since it's really a scribal abbreviation rather than an accented character.</p>
      <p>If you need to be able to search for these, I'd just make sure to enter the character as a two character sequence in InDesign (Thorn + uni0304 or uni0335 or whatever you choose) since ID will then preserve the two unicode values in your exported .pdf.</p>
      <p>André</p>
