      <p>You're glyph names aren't valid. You should use the following:</p>
      <p>sub Thorn macron by uniA764;<br>
      sub thorn macron by uniA765;<br>
      sub AE macron by uni01E2;<br>
      sub ae macron by uni01E3;</p>
      <p>If you export a .pdf file from InDesign, the unicode values will be embedded, so it will be searching for those. When you insert your Thornmacron character from the glyph palette, you're giving it something which has no unicode value and to which it cannot assign one since it doesn't have a meaningful name. If you had named it either Thorn_uni0304 or uni00DE0304 you might have better luck since these names are at least interpretable.</p>
      <p>Whether a program will find (e.g.) eogonek when searching for e will depend entirely on how unicode savvy the program is. Some programs will decompose eogonek into e + uni0328 when searching. Others won't.</p>
      <p>André</p>
