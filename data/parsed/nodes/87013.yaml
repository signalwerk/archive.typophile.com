      <p>The behaviour will be determined by the rule type you use; the choice of feature differs in the following way:</p>
      <p>liga = standard ligatures, which in most applications will be turned on be default.<br>
      dlig = discretionary ligatures, which will generally be turned off unless the user turns it on.<br>
      ccmp = unicode composition, which will be turned on by default and generally cannot be turned off by the user.</p>
      <p>So which of these you should use will really depend on what you want the default behaviour to be. If you're using thorn + stroke (uni0335) then ccmp would probably be the best choice, though liga would also work.</p>
      <p>If you went with my second suggestion of a three-character combination (thorn_ae_t) then dlig would be the best choice (the use of barred thorn as an abbreviation for <em> þæt</em> is the only usage I'm familiar with -- if it has other uses this choice would be less than optimal).</p>
      <p>André</p>
