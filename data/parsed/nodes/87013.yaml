      <p>Just two quick additional notes:</p>
      <p>First, I'd put these sorts of substitutions (minus the f i) in the ccmp feature rather than the liga feature -- that is, after all, what it is for.</p>
      <p>Also, if you're going to allow your thorn with stroke character to be entered as a sequence, I wouldn't use the combining macron character. I'd instead use uni0335 or uni0337, neither of which is entirely appropriate but either of which is a better choice than uni0304. The macron sits above the character whereas the other two intersect it.</p>
      <p>André</p>
