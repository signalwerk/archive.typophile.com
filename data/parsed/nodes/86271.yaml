    html: <p>The problem is, that copy &amp; paste might not work properly for glyphs without Unicode value. But the script I linked above uses the GlyphID, so it can access really any glyph inside the font. And between Adobe apps like Illustrator and InDesign you can easily copy &amp; paste these glyphs.</p>
