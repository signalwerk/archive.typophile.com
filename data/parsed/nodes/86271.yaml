    html: |-
      <p>Worked like a charm! For anyone not familiar with scripts: save the script linked above in the InDesign Scripts folder*. It will then appear in the Scripts Panel where you can load it. Wicked!</p>
      <p>* on windows: Users &gt; [Username] &gt; AppData &gt; Roaming &gt; Adobe &gt; InDesign &gt; Version [6.0] &gt; nl_NL &gt; Scripts &gt; Scripts Panel</p>
