    html: |-
      <p>1 Use Small caps and lower case - they are usually designed to do exactly what you want - and may only need some small fractional adjustment in size and or weight to look right.<br>
      2 If the above is not possible - and it depends on whether you have already chosen the font or had it chosen for you ... A thought occurs - in teaching typography years ago - I used to get all my students - to understand the importance of x-height by getting them to work out conversion factors across a wide variety of professional fonts so that in a piece of running text they could set paragraphs utilising a wide range of types but ensure that all the x-heights matched even if from word to word if the font was changed from what would have been large appearing typefaces to small appearing typefaces eg Helvetica to Park Avenue. I used to arbitrarily take times new roman 10pt as the base index and run a sheet of xxxxxxx’s each one with the name of the font and adjust the type size until I got an exact match to the times new roman x-height and then record the size required for the visual match.<br>
      If I had your problem I might try two weights of the font the lighter one for the lowercase and character by character apply a similar conversion factor to the typesize so that the lowercase was enlarged to match the caps.<br>
      Love little problems like this that show off the brilliance of continuous digital adjustment ... and suggest new standards yet to be set - like measurement by actual appearing x-height - the most meaningful measure for the reader &amp; lets do it in q (quarter of millimetre typographic points). Have fun ...</p>
