    html: <p><a href="http://myfonts.us/td-kLWtw8">"Unicase"</a> will be a useful search term. Although in most unicase fonts the "case" is determined by the shape of the letter (those with extenders are given uppercase form, the others, lowercase). It sounds like you want the /u/ and /a/ to be lowercase form and the /F/B/S/ to be uppercase?</p>
