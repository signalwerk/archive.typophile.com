    <p>hi and sorry if my english is a bit square.<br>
    iam searching for fonts that has lower case with the same height/size as upper case.<br>
    do you know any good fonts like that?<br>
    is there a special name for fonts with that feature?</p>
    <p>i need it for a logo of a group that uses a strange short cut like FuBaSa but i want all letters in the same height like its FUBASA.<br>
    i have a graphic that will be on the top. that graphic has a flat bottom like a straight line and the space that appears between that line and the lower case makes me saaaaaaaaad.</p>
    <p>thank you for any tips!</p>
