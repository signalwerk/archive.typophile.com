    html: |-
      <p>If you're doing 3 pages and the readership is broad I would avoid a connected script. Print writing, like those you've mentioned, will be much more readable. Also <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_providence_sans/" rel="nofollow">FF Providence</a>, <a href="http://www.fontshop.com/fonts/downloads/creative_alliance/andy/" rel="nofollow">Andy</a>, <a href="http://www.fontshop.com/search/?q=felt%20tip" rel="nofollow">Felt Tip</a> or <a href="http://www.fontshop.com/fonts/singles/itc/itc_zemke_hand/" rel="nofollow">ITC Zemke Hand</a>. </p>
      <p>To avoid shape repetition you can move baselines a bit and flip symmetrical characters, but at 3 pages you're going to have a lot of the same letters regardless of how many alternates or ligatures you have. Readability is most important.</p>
      <p>Alternatively, you can pay a bit more and have your ideal <a href="http://www.fontshop.com/services/handfont.php" rel="nofollow">font created from scratch</a>.</p>
