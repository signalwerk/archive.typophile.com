    html: |-
      <p>The Amy Papaelias site is funny, but not quite what i was looking for :)</p>
      <p>And Olga has a bit too much variation in the x-height and character weight to sustain a few pages of text. </p>
      <p>Stephen, I totally agree with an unconnected script and I took a look at some of the ones you pointed out. They're close but they look like boy's handwriting. I'm anticipating needing to make adjustments to a few words here and there to reduce the impact of repeated letters (doubled letters, character angle, baselines...). </p>
      <p>As for getting a font made from scratch, I won't get any of the ligatures I'm hoping for. I suppose, in my dream world, I was hoping that a type designer who visits this site had one made of his/her daughters handwriting and went to the trouble of adding all the opentype features. Like I said, dream world.</p>
