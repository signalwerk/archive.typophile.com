    <p>I'm working on a book project and the editor has asked to include a handwriting typeface for central character. I've searched most of the free sites and pay sites, but the scripts that are good enough (opentype with ligatures, etc.) tend to be a bit too refined for a pre-teen girl. I must admit I'm a bit stuck.</p>
    <p>Her handwriting will likely go up to 3 pages and we need to include "reluctant readers," so legibility is important. </p>
    <p>I've managed to find two that come close to filling the job:<br>
    <a href="http://www.dafont.com/jennifer.font" rel="nofollow">Jennifer's Hand Writing</a> (captures the age)<br>
    and <a href="http://www.dafont.com/lauren-c-brown.font" rel="nofollow">Lauren C. Brown</a> (the legibility is decent)</p>
    <p>Neither have ligatures, so will require a lot of grooming that I'd love to avoid. I also don't mind paying for the font if it's the right one. I know that open type will be opening up doors, especially for script fonts, but I haven't seen anything that fits this niche. </p>
    <p>Help?</p>
