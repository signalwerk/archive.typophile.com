      <p>Thanks Joe. It's astonishing how hard it is to find definitive lists of what fonts are installed with which applications and operating systems.</p>
      <p>What I'd love to see as a next step with the matrix I compiled is a tool for automatically creating font stacks. For instance, type in "Clarendon" and it automatically spits out something like "font-family: 'Clarendon Std', 'Century Old Style Std', 'Century Schoolbook', Georgia, serif".</p>
