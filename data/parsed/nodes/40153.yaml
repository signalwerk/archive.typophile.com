    <p>My esteemed colleague <a href="http://clagnut.com/" title="Clagnut" rel="nofollow">Richard Rutter</a> did some research into <a href="http://24ways.org/2007/increase-your-font-stacks-with-font-matrix" title="Increase Your Font Stacks With Font Matrix" rel="nofollow">the fonts installed by default</a> in OS X and Windows systems and by applications like MS Office and Adobe Creative Suite. (Linux wasn’t included.)</p>
    <p>I know from my own attempts to compile such lists that they are error-prone and incomplete, but this is a good addition to the list of lists. If you can’t find a font you need for a general-interest Web site there, are you really trying? (Then again, you might go with Arial.)</p>
