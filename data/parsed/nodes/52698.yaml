    <p>Hi</p>
    <p>Does anyone know how to do that - disabling anti-aliasing or ClearType on headers in MS Word 2007?</p>
    <p>I've already successfully disabled ClearType on my Windows XP, and in MS Word 2007 I already have "Always use ClearType" (under "Word Options") unchecked. The main body fonts in MS Word already display as aliased, but strangely the headers are still anti-aliased.</p>
