      <p>Four for four: It's not type. While it would be elitist to presume that what is obvious to me should be obvious to anyone, it still bears saying that it is <em>really, really obvious</em> that the sign painter improvised this by hand. To me.</p>
      <p>The rounded "movies!" apparently added later is probably based on a typeface, but I wouldn't expend much effort trying to identify it without a clear indication that it's the focus of the inquiry.</p>
