    html: |-
      <p>It is quite a nice example of sign painting. The argument that technically any shape <em>could</em> be a typeface isn't very convincing here because you can see in the giant picture how heavily the painter relied on the bricks for construction guides.</p>
      <p>I should have said "much <em>more</em> effort" because I was curious enough to do some looking but I didn't find a match. It's not VAG Rounded because it has some thick-and-thin especially in the diagonals. It looks a lot like a rounded version of Franklin Gothic (with an upside-down W for the M), but if such a font exists I don't know where to find it.</p>
    html_clean: |-
