    date: 2002-02-11T11:12:00
    date_raw: 11 Feb 2002 — 11:12am
    votes: null
    html: <p> I am well familiar with her work and was properly one of the first designers to purchase her fonts. I got Envision back in 94' when it was $125 in Beta (unkerned, missing characters), when I later tried to get the finished version (which I was told would be a free upgrade) I was told that Envision had never been sold, strange. I wonder if someone in the studio released it without permission? <br>Anyway, I suspect this specimen is not done by Margo Chase, it seens too structured and her work is generally not so. I also find more wit and humor in her work. This one is too clean and well behaved to be a MC job. </p>
  - id: 68018
    user: 1250
    date: 2002-02-11T11:32:00
    date_raw: 11 Feb 2002 — 11:32am
    votes: null
    html: <p> In fact, a strong indication that it's not Chase's work is the lousy transition at the bottom of the "E". <br> <br>hhp </p>
