    <p>The Corporate Sans Serif Typeface with 6 weights is skilled for complex typography: PRO style.</p>
    <p>Each font has an extended character set to provide most Central and Western European together with Eastern European languages. The typefaces include ligatures, alternate- &amp; swash letters, smallcaps, fractions, lining-, tabular numbers, superior/inferior figures and ornaments. Carefully drawn.</p><div class="imageWrap"><img src="http://typophile.com/files/LupaSansPro_30off_6644.jpg"></div><p></p>
    <p><a href="http://www.myfonts.com/fonts/mellediete/lupa-sans-pro/" title="http://www.myfonts.com/fonts/mellediete/lupa-sans-pro/">http://www.myfonts.com/fonts/mellediete/lupa-sans-pro/</a></p>
