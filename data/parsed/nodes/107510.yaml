    html: |-
      <p>I suspect the sign is lettering not a font as such.  But I would be happy to learn of a matching font.<br>
      The lettering looks like something like _John Hancock_ -- Keystone Type Foundry, circa 1903, and condensed version  by Lanston Monotype, circa 1917, digitized by Claude Pelletier <a href="http://www.dafont.com/john-hancock-cp.font" title="http://www.dafont.com/john-hancock-cp.font">http://www.dafont.com/john-hancock-cp.font</a> -- meets early 20th century lettering for the _ g_. Here is one variation by Speedball with a bottom heavy _g_.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Speedball17_21WashingtonSM_6692.jpg"></div><br>
      What is the relationship between the sign and Harper's Weekly?<br>
      Another bottom heavy _g_, from a 1921 Motor Tours book:<br>
      <div class="imageWrap"><img src="http://typophile.com/files/MotorTours1921_5266.jpg"></div><br>
      Don<p></p>
