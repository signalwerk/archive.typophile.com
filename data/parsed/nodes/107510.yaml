      <p>Hi Steve. This was a golden age of lettering, with impressionist variations in letterforms. Check out the bottom heavy_g_ in these specimens designed cira 1915.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/LiteraryDigestFunk&amp;Wagnals1915caSM_4595.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/GoodHousekeeping1914SM_6711.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/GoodHousekeeping1914bSM_5051.jpg"></div><br>
      For the second Good Housekeeping the bottom heavy _g_ is in the author's name.<br>
      Finding fonts to do justice to your sample, or these letters is a real challenge. They are all opportunities to ambitious font makers.<br>
      Don<p></p>
