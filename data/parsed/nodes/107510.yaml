      <p>Hi Don</p>
      <p>Thank you so much for your input.<br>
      If memory serves, it was taken from an add for Williamsons(?) shaving soap, circa 1915 or so I would guess.<br>
      As the font is not entirely regular, I thought it may have been hand rendered but your leads for similar are very helpful. Apart from the 'g' it was the truncated 't' that grabbed me. :)</p>
