      <p>&gt;Simplified Chinese has less characters than Traditional Chinese. </p>
      <p>Not fewer characters, but fewer strokes per character. Simplified characters are still ideograms, not an alphabet or simply syllables representing sounds. They were based on simplifications commonly used in handwriting, for speed. For formal calligraphy even on the mainland they often use traditional characters, which are thought to be more beautiful than their simplified counterparts.</p>
