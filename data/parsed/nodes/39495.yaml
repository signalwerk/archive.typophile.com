      <p>William, there are special input programs(for example PinYin input) for typing Chinese characters, but no special keyboard. A Chinese font normally contains about 10000 characters, and Latin letters which include the accented ones. Here is how to type a character, type PinYin(no accents), the input program shows you all the characters that have the same PinYin(could be a lot) ordered by the tone, then you choose the one you want.<br>
      It takes hell of a time to finish a font because of the amount of characters.</p>
