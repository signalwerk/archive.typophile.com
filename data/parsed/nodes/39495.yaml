    <p>I am working on a corporate standardization project, and I need to offer some loose guidelines on what faces to specify for Chinese, Japanese, and Arabic documents. Do any Typophiles out there have a favorite resource for international typeface matters?</p>
    <p>JAPANESE: So far, I know that Japanese is split into Mincho (calligraphic) and Gothic (monoline) categories, but I'm looking for the names of faces in these categories that are easily found or procured for users of Windows XP, Vista, or Mac OS X.</p>
    <p>CHINESE: I'm assuming that these two categories also exist for Chinese characters, but I just need the names of those categories and a name of a corresponding typeface I can recommend.</p>
    <p>ARABIC: I'm ignorant. I can't even find if they have monoweight-stroke versions, though it's looking like the answer is no.</p>
    <p>Any help you could give me would be very much appreciated!</p>
    <p>Enrico</p>
