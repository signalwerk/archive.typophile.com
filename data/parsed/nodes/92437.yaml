  html: |-
    <p>Hello,</p>
    <p>I just designed a new logo / wordmark for my company "<a class="freelinking external" href="http://www.designbits.de" rel="nofollow">DesignBits</a>" and now I am looking for a font to accompany this new logo (see attachment below).</p>
    <p>Right now, I am using 'Helvetica Neue' which of course is completely overused and its shape has no resemblance with the boxy feel of my logo.</p>
    <p>So I am looking for a font that has a more boxy feel and whose "D" ideally resembles the corners of my logo. </p>
    <p>If you have any other suggestions / input, please let me know. But please don't be too harsh with me, logo design is not my main profession ;-)</p>
    <p>Thanks everyone.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/logo_6258.png"></div><p></p>
