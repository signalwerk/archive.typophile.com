    <p>Let me try to explain. After i am done tracking and kerning sometimes the space in between words looks to large. Is there a setting for this or is it common to go into each and every space and reduce the kerning manually to let's say -60. am i doing something wrong. please advise. thank you.</p>
    <p>james</p>
