    html: |-
      <p>In case you are working with InDesign: Change the wordspacing values in H&amp;J if you want tighter word spaces globally.<br>
      If you want to do this on a selection (and this is straight from InDesign Help):</p>
      <p>Adjust kerning between words<br>
       With the Type tool , select a range of text and do one of the following:<br>
      To add space between selected words, press Alt+Ctrl+\ (Windows) or Option+Command+\ (Mac OS).<br>
      To remove space between selected words, press Alt+Ctrl+Backspace (Windows) or Option+Command+Delete (Mac OS).<br>
      To multiply the kerning adjustment by 5, hold down Shift as you press the keyboard shortcut.</p>
      <p>. . .<br>
      Bert Vanderveen BNO</p>
