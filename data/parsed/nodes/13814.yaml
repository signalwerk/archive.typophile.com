  html: |-
    <p>American Institute of Graphic Arts (AIGA), the professional association for design, is committed to furthering excellence in design as a broadly-defined discipline, strategic tool for business and cultural force. AIGA is the place design professionals turn to first to exchange ideas and information, participate in critical analysis and research and advance education and ethical practice.</p>
    <p>The AIGA has chapters in most major US cities.</p>
    <p>URL: <a href="http://www.aiga.org" title="http://www.aiga.org">http://www.aiga.org</a></p>
