      &gt;“Pinched”, so you don’t like the “gravity” aspect of the lc in general..." </p>
      <p>No, I did not mean that. I meant that the effect is too abrupt and should transition more gently.  Look at most of your vertical stems--the worst offenders are in the lc n, m, h where you begin your stem widening right where the curve meets the stem giving me the pinching effect right at those points.  You might begin the gravity transition a bit lower and gently curve into it rather than so straight and abrubtly.</p>
