      <p>Right; don't do any kerning until you've finalized the spacing. If you're using InDesign, it will do a good job of autospacing, but be sure to switch from "Optical" spacing to "Metrics" to see what your built-in spacing looks like. Your font needs to be spaced well anyway, so you might keep "Metrics" spacing on by default while you develop this design. </p>
      <p>It's not particularly un-economical either. The economy gained in condensing a face has a tradeoff point where the font has to be set larger to look big enough, so don't worry too much about economy at this stage.  </p>
      <p>If you're interested in the tapering or gravity effect, consider doing a small test on 4-5 letters where all your outlines are curves. Even your stems could be curved. See where it takes you. FF Clifford is one typeface with lots of fluidity.</p>
