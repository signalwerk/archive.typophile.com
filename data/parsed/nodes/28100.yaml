    <p>Hi,</p>
    <p>I have been working over the last couple of weeks on a font, posted earlier as 'Tensa'. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Tensa_6535.jpg"></div><p></p>
    <p>After implementing lower and uppercase, I started to play around with the lower case to give it a bit more character. Basically I added some 'gravity' by lightly 'flaring' the vertical stems. I didn't update the upper case yet as I am interrested in getting some feedback first.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Primus_5877.jpg"></div><p></p>
    <p>I gave it the working title 'Primus' as this is my first font. Also I attached two pdf's with some sample text set in Tensa and Primus (text from WikiPedia: Punchcutting).</p>
    <p>I really would appreciate any feedback!</p>
    <p>Thanks,</p>
    <p>Sebastian</p>
