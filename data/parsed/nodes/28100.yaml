      <p>There isn't any such thing as "design rules". But there are conventions which evolved with the alphabet, which are in place for comfort, familiarity, and speed. Some people are interested in finding out how to diverge from these conventions, and which of them are meaningless and vestigial. Others confine themselves to the conventions, finding a narrower range of variation to work within. </p>
      <p>The conventions, taken together, make a typeface readable. But there's so much leeway there, that what makes a typeface readable is highly subjective. That's how you can have Bodoni, Goudy, Unger, Jannon, Tyfa and Dwiggins all doing essentially the same thing: making type for reading.  </p>
      <p>I think you ought to avoid, or at least be very skeptical of, literal concepts like gravity, weight, directionality. Reading is such a singular, complicated phenomenon, and I don't personally feel we are prepared to analyse it thoroughly. Meanwhile, you can certainly observe, and respond to those effects in type design which speed or facilitate reading, and those that impede it. In your design, right now, I see very few things that weaken the design for reading, and this is because the structure, or skeleton of your letters, is very conventional and familiar. If you set a page in your typeface at 8 point, however, you might find the fit is a little tight. Try more samples, and visit <a href="http://www.adhesiontext.com/" rel="nofollow">Adhesiontext</a> to get some text that uses only the characters you have drawn.</p>
