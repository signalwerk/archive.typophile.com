      <p>Did you notice all the "gravity" in Adobe Garamond Premier? It's everywhere. I haven't yet heard Robert Slimbach's thoughts on this effect. It might be an authentic artifact from Garamond himself, but I wouldn't know. What's your rationnale?</p>
