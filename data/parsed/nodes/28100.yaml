      <p>Hi Crossgrove,</p>
      <p>Thanks for your feedback.</p>
      <p>I just downloaded the Garamond Premier specimen and yes, it's everywhere! It is also very notable in "Quadraat" (FF), and this is one of the fonts that inspired me to try out the 'flaring'. I don't have a real rationnale. I am a 'freshman' and started out playing around to see what it would do to my font. What is noticable is that the flaring helps to firmly 'ground' the letters on the line. It adds a certain 'down to earth' mentality to the font. Although, overdoing it may lead to the opposite direction, a 'fantasy' sort of mood. </p>
      <p>The direction of the flare could serve as a cue in the reading direction, especially for the m, n, i, r etc. where the flare is asymmetric. (also visible in the Garamond Premier) For some of the other letters, it should have a direction such that it helps to optically balance the letter (esp. the long-hooked f). </p>
      <p>I wasn't aware of the trendy soft s-terminals. The first letter I designed was the a, and after some sketching I homed in on that type of terminal, which I used as a design element for some of the other letters (c, f, j, s, Q, J, etc.). After reading the thread on the 'Feijoa' font, I saw that this terminal was used in the s (and x), so I tried it out as well.</p>
      <p>Yes, the top of the f is very wide. I tried the fi and fb combinations and I will need ligatures here for sure. I like the long hook as it seems to add character and liveliness to the font. Note that a lot of fonts have overlapping f and b (I tried Bembo and Garamond).</p>
      <p>Are there particular letters jumping out that need changes? Did I infringe any established design rules? </p>
      <p>As I mentioned, these are my first steps in this field. Your comments are very much appreciated!</p>
      <p>Sebastian</p>
