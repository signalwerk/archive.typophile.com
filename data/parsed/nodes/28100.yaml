      <p>dezcom,</p>
      <p>Now I got your point on the pinching! I think this is what crossgrove also mentioned earlier. </p>
      <p>I applied the flaring rather quick to see what the effect would look like. Especially on the lc l, k and h, I started the widening right at the upper stem serif, which is not optimal. Note that I have to start implementing it on the uc. After figuring out 'what the rules are', this is the next step.</p>
      <p>I will try lowering the 'flaring point' down and see what can be done to the h, k and l. These are a bit tricky as they do not have a natural midway point where the flaring can start logically.</p>
      <p>Btw, I tweaked the g following your comments. To me, it now looks more balanced and the lower ear is more firmly aligned with the base-line. I believe the g is one of the harder letters to get down, as it is made up entirely of curves.</p>
      <p>Sebastian</p>
