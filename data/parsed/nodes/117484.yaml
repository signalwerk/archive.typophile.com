    <p>I've been looking for this McDonalds font everywhere.. I did lookup on whatfontis.com and it did find some close match but nothing dead on. Also I know that before using this font, McDo old lookalike font was: "Berthold Akzidenz Grotesk"</p>
    <p>This one is much more modern.. the capital R, is straight.. looks great. Thx for the help!</p>
