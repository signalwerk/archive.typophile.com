      <p>There are four attributes that I was trying to match: the J (above the baseline and fairly closed); the M (straight-sided, with vertex at baseline); the E (short center arm); and the R (straight leg intersecting the bowl). The closest sample I had in my Sans Guide was Berthold Balken, which I cannot find any more. However, it was condensed by comparison to this sample, so it was not an exact match unless it had been widened. </p>
      <p>Yehan's suggestion of <a class="freelinking external" href="http://www.myfonts.com/fonts/adobe/avenir/" rel="nofollow">Avenir</a>, does not have the uneven E, but it looks a lot like it in other respects, so let's say Avenir, with a modified E, and manufactured ligatures. This would get you very close.</p>
      <p> - Mike Yanega</p>
    html_clean: |-
