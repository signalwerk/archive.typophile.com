    <p>Alright I've been trying to ID this for a while. I know that for some of Mr. Mayer's stuff (website/iTunes artist page) he uses Avant Garde and I think that's what they're using here but the Rs are DEFINITELY not avant garde.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/JM_4675.jpg"></div><p></p>
    <p>Obviously this is a custom font... but what are it's roots?</p>
    <p>After doing a "What The Font?" On the John Mayer album cover for continuum, and it came up as News Gothic BT -- the R from that appears to match so perhaps its a combo of both I don't know.</p>
    <p><a class="freelinking external" href="http://www.johnmayer.com" rel="nofollow">john mayer.com</a><br>
    <a class="freelinking external" href="http://www.j-mayer.org/images/career/musichistory/continuum-big.jpg" rel="nofollow">continuum album cover</a></p>
