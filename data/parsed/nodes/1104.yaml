  html: <p>I've spent the last week on holiday and in that time I've filled two sketch books full of new font idea's. The Golden Bus Company typeface is the first I've transfered from sketches to screen (still need to transfer the lowercase sketches). <br> <br>I was reading a book called 'The Wrong Way Home'  by Peter Moore which covers his travels from London to Sydney overland (along the old hippy trail), and one part of the journey involves travelling across Pakistan on colourful buses, the pictures this put in my head were the starting point for the font. <br> <br><img src="http://www.typophile.com/forums/messages/29/15132.gif" alt=""></p>
