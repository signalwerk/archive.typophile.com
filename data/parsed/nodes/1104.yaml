  - id: 8655
    user: 2305
    date: 2003-09-15T13:51:00
    date_raw: 15 Sep 2003 — 1:51pm
    votes: null
    html: "<p>I'm partial to the second or fourth A. <br> <br>I like the beginnings of the lowercase, particularly a and k.  r and c stick out, though; r has a huge gap underneath it (maybe you can tweak your fishtail terminals to alleviate that - retracting the upper portion and extending the lower) and the serifs in c break the counter into two.  Also, in f and t the repetition of terminals creates this confusing sawtooth effect (I suspect that you could preserve your feel while alleviating this by using single-lobed terminals with the same characteristic 'fin' shape).  e also catches my eye for its thin strokes - how would a more open variant, with a diagonal crossbar perhaps, work out?  It seems to be a very linear character for a distinctly circular face. <br> <br>Quibble: The P is inconsistent with B and R.  Deliberate?</p>"
    html_clean: "<p>I'm partial to the second or fourth A. <br> <br>I like the beginnings of the lowercase, particularly a and k.  r and c stick out, though; r has a huge gap underneath it (maybe you can tweak your fishtail terminals to alleviate that - retracting the upper portion and extending the lower) and the serifs in c break the counter into two.  Also, in f and t the repetition of terminals creates this confusing sawtooth effect (I suspect that you could preserve your feel while alleviating this by using single-lobed terminals with the same characteristic 'fin' shape).  e also catches my eye for its thin strokes - how would a more open variant, with a diagonal crossbar perhaps, work out?  It seems to be a very linear character for a distinctly circular face. <br> <br>Quibble: The P is inconsistent with B and R.  Deliberate?</p>"
