    html: <p>The story behind the latest version of Golden Bus is that I met up with Peter Bilak and Max Kisman in Amsterdam, and not being shy, I got out print outs of two of my faces and invited comment. <br> <br>Peter kindly put in nicely... "It's interesting that you have made the width of the letters the same all the way round, because most people adjust the weight to make the letters flow better". <br> <br>So taking this advice and some of Max's scribbles on board, I've started to alter the weight of the letters... <br> <br>I think it's moving in the right direction, what do you think? <br> <br><img src="http://www.typophile.com/forums/messages/29/24394.gif" alt=""></p>
    html_clean: <p>The story behind the latest version of Golden Bus is that I met up with Peter Bilak and Max Kisman in Amsterdam, and not being shy, I got out print outs of two of my faces and invited comment. <br> <br>Peter kindly put in nicely... "It's interesting that you have made the width of the letters the same all the way round, because most people adjust the weight to make the letters flow better". <br> <br>So taking this advice and some of Max's scribbles on board, I've started to alter the weight of the letters... <br> <br>I think it's moving in the right direction, what do you think? <br> <br><img src="http://www.typophile.com/forums/messages/29/24394.gif" alt=""></p>
