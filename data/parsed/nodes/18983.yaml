      <p>Pieter,<br>
      The “strange thing” is actually why I made the page to begin with. I was testing my font to see if it could be used for every Latin based language. As you can see, Azurbaijani has a character which I did not put in the face yet. The upsidedown “e” (forgive me, I don’t know the real name for it) is set in Adobe Garamond Premier Pro so I could see what it was supposed to look like. There were also several Vietnamese glyphs which were not included, too many to show.</p>
      <p>ChrisL</p>
