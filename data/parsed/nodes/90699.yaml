      <p>@typerror  - Thanks )</p>
      <p>Michaelangelo by Zapf has a more "handwritten" basis... It is more "humanistic"<br>
      I did not set the task of making the Capitalis Qudrata, I wanted to give "spirit" of classical Roman architecture.<br>
      My font have more elongated proportions, I also added a lower-case.</p>
      <p>If the "R" is causing so much comment, I'm reviewing it. )))</p>
      <p>"Possible change?" - changes are always possible )))<br>
      But likely they are be insignificant.<br>
      I repeat - I like the "power" of her leg.<br>
      "The R loses the connection of the bowl" - I like the idea, I'll try it. )))</p>
