      <p>Hi Richard, welcome to Typophile :)</p>
      <p>This looks promising but I'd need a pdf to see up close.<br>
      First impressions, this looks rather nice. </p>
      <p>Uppercase:<br>
      I'd agree the B looks wide, also the PR and S; narrow ones include OQTX and possibly W.<br>
      Crossbar of G could be much more confident. J could be a bit wide, N perhaps a bit narrow.</p>
      <p>Lowercase<br>
      k needs some attention as Craig said.<br>
      Curve on f and t could be wider.<br>
      Difficult to scroll to the lowercase on this page.</p>
      <p>Other<br>
      8 looks narrow, 5 looks top-heavy, flag of 1 should be much more definite. Exclamation mark looks light. Octothorp is an unusual floating design? Asciicircumflex is way too high. Ampersand reads like a 3. Braces are out of character.</p>
