    html: <p>I think you should increase the overshoots slightly, especially on the top of round numbers (2, 6, 8 and 9).  I know a lot of people don't like overshoots on squarish fonts, but to me your rounder letters look too short.  It makes D hard to decide what to do with though!.  Curve on bottom of g should be squarer like the curves in the rest of the font.  I'd also consider a tail on lower case l.</p>
