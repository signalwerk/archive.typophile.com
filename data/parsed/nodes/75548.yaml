    html: |-
      <p>Looks good, but I'm not sure if it's 'different' enough. I agree with eliason about the i j and k. Here's what I see:<br>
      K is top heavy<br>
      B is top heavy and too wide<br>
      G should be simpler<br>
      J is too wide<br>
      s is top heavy<br>
      m n u h are too wide<br>
      x is too small<br>
      Z is top heavy<br>
      I think you need to redefine the width of a lot of the caps. With my expletus, I had the same problem. For me, Frutiger worked really well to help me do that.<br>
      IMO the common mistake with geometrical typefaces like this is that they are too much based on geometry, ignoring the optical illusions. For example, the middle horizontal stroke in the B is exactly in the middle, but it looks like it's underneath the middle, which doesn't add to that geometrical feeling. Look carefully at all glyphs with a blank mind, forget about the numbers, trust your eye and change accordingly.</p>
      <p>I hope this helps. I'm not a professional so feel free to disagree.</p>
