    <p></p><div class="imageWrap"><img src="http://typophile.com/files/AtypI logo_4267.jpg"></div><p></p>
    <p>Monotype Imaging is pleased to be a platinum sponsor of <a class="freelinking external" href="http://bit.ly/ATypI " rel="nofollow"> ATypI Hong Kong 2012</a>, the annual conference presented by ATypI (Association Typographique Internationale), Oct. 10–14. Several of our resident type experts from around the world will be sharing their knowledge and skills. Come by and join us as we take a look at Web fonts, Japanese typographic history, new automotive type trends and so much more. </p>
    <p>•	<a class="freelinking external" href="http://bit.ly/AlanT " rel="nofollow">Alan Tam</a>, director of product marketing for Web Font Services at Monotype Imaging, will present <a class="freelinking external" href="http://bit.ly/BrPerf" rel="nofollow">“How Web-based Fonts and Dynamic Subsetting Improve Brand Performance in East Asian Writing Systems.”</a> Developed initially to reduce the larger font file sizes of East Asian writing systems, Monotype’s patent-pending dynamic subsetting technology is ideal for enabling brands to improve the performance and user experience when using Web fonts.<br>
    Wednesday, Oct. 10 at 11:50 a.m.</p>
    <p>•	<a class="freelinking external" href="http://bit.ly/RobinH" rel="nofollow">Robin Hui</a>, a typographer at Monotype Imaging in Hong Kong, together with Kenneth Kwok, will present <a class="freelinking external" href="http://bit.ly/DesPro" rel="nofollow">“Ideographic Type Design and Production.”</a> There are many challenges when designing and producing Chinese, Japanese and Korean ideographic fonts. Robin and Kenneth will discuss how to maintain design consistency and tranquility using traditional techniques and design methodologies.<br>
    Thursday, Oct. 11 at 9:30 a.m. (workshop)<br>
    Sunday, Oct. 14 at 3:30 p.m. (presentation)</p>
    <p>•	<a class="freelinking external" href="http://bit.ly/ToshiO" rel="nofollow">Toshi Omagari</a>, a typeface designer at Monotype Imaging, will examine <a class="freelinking external" href="http://bit.ly/WebFo" rel="nofollow">“Web Fonts for Non-Latin Scripts.”</a> While Web fonts are gaining popularity in Latin typographic communities, the domain of non-Latin Web fonts remains relatively unexplored. Toshi will address how to work with specific browsers and scripts when implementing non-Latin Web fonts.<br>
    Thursday, Oct. 11 at 11:50 a.m.</p>
    <p>•	Linotype’s type director <a class="freelinking external" href="http://bit.ly/AkiraKo" rel="nofollow">Akira Kobayashi</a> will present <a class="freelinking external" href="http://bit.ly/SansJap" rel="nofollow">“Rounded Sans in Japan.”</a> In Western countries, sans serif letters are frequently the default choice for public signs. Very few Latin rounded sans serif types were available until very recently. In Japan, rounded sans serif letters were the default choice for public signs. He will discuss why historically rounded sans were so popular in Japan and why they are being replaced with square sans today.<br>
    Saturday, Oct. 13 at 9:00 a.m.</p>
    <p>•	<a class="freelinking external" href="http://bit.ly/VladLev" rel="nofollow">Vladimir Levantovsky</a>, senior technology strategist at Monotype Imaging, will discuss <a class="freelinking external" href="http://bit.ly/Fontle" rel="nofollow">“Evaluating Fonts Legibility in Automotive Environment.”</a> Vladimir will report on the new findings from a <a class="freelinking external" href="http://bit.ly/MITAGE " rel="nofollow">study</a> that links typeface style with reduced driver distraction risk. He’ll discuss why using typefaces optimized for the driver’s short glance patterns reduced average duration of glance time per subject. Full results of the study are available in an <a class="freelinking external" href="http://bit.ly/MITWP" rel="nofollow">MIT AgeLab white paper</a>, in addition to a <a class="freelinking external" href="http://bit.ly/MITVI" rel="nofollow">video</a> that highlights the research and its findings.<br>
    Saturday, Oct. 13 at 9:50 a.m.</p>
    <p>•	<a class="freelinking external" href="http://bit.ly/FloWit" rel="nofollow">Florian Wittig</a>, a font engineer at Linotype, will present <a class="freelinking external" href="http://bit.ly/ZhouYo" rel="nofollow"> “漢語拼音之父 – Zhou Youguang, the father of Pinyin.”</a> He will talk about the life and work of linguist Zhōu Yǒuguāng, who turned 106 this year. His most famous creation, the Hanyu Pinyin system, serves as the most frequently used input method for Chinese characters on computers and mobile devices. He will discuss how the Pinyin works, its advantages over other transcription methods and why it has never replaced Chinese characters.<br>
    Saturday, Oct. 13 at 5:35 p.m.</p>
