    <p>Hi,</p>
    <p>I urgently need an illustrator / type designer to create some type in the EXACT Daft Punk 'Get Lucky' / 'Random Access Memories' type style for a reasonable fee.</p>
    <p>This look heavily references the type also from Michael Jackson's 'Thriller' record cover.</p>
    <p>Please only respond if you are 100% confident that you can get this quickly, exactly right.</p>
    <p>It's two words that we need to be illustrated, in this exact style.</p>
    <p>Suggestions of good illustrator / type designers who could quickly do this welcome, also.</p>
    <p>Thanks.</p><div class="imageWrap"><img src="http://typophile.com/files/daft-punk-get-lucky-remix_6412.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/Daft-Punk-Random-Access-Memories copy_4801.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/RR0910_024_lg_3816.jpeg"></div><p></p>
