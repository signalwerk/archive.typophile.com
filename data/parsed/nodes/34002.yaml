    html: |-
      <p>Carolbee</p>
      <p>If you are thinking of setting up an eBay account, note that there are sellers' fees. Both eBay and PayPal. U&amp;lc issues don't go for much (somewhat of a hard sell). And their non-standard size is a negative factor in regard to shipping. They are what you might call a "give-away."</p>
      <p>But if you decide to partake, best word of advice: don't close an auction on a full moon. . . or during holidays. Or for that matter Fridays or Saturdays—web traffic drops dramatically. For some reason Sunday night through Monday morning is prime time and it just drops off from there on, with Thursday afternoon as endgame. And if you don't believe that, monitor the daily usage statistics of Typophile (ain't nothing ever going on here on the weekends—not sure what that reveals about type designers/typographers).</p>
      <p>Gerald</p>
