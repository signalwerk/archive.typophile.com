    html: <p>The font is <a href="http://www.fonts.com/findfonts/detail.asp?pid=206446" target="_blank">Estro</a>. Image Club had it in their collection, but this is the Mecanorma version at Agfa that I have linked. URW also has a version at MyFonts. <br> <br>Unfortunately T-26 also has a font with this name, but it is quite different.</p>
