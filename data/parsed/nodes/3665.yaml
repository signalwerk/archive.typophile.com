    html: <p>Mike, I think the above sample is similar to Estro, but it's not the same face. Specifically, the serifs and the consistency of the stroke weights are quite different. I'm thinking this is a freeware Estro-inspired knockoff. <br> <br><img src="http://www.typophile.com/forums/messages/83/28838.gif" alt="Image Club Estro"></p>
  - id: 27947
    user: 2088
    date: 2004-03-18T09:03:00
    date_raw: 18 Mar 2004 — 9:03am
    votes: null
    html: <p>My thought was that it had possibly been outlined in the same color as the background, making it look 'slimmer'.  Did you see if the Mecanorma Estro is identical to the one from Image Club? (I have them both, but I don't have time right now.)</p>
  - id: 27948
    user: 1011
    date: 2004-03-18T12:26:00
    date_raw: 18 Mar 2004 — 12:26pm
    votes: null
    html: <p>&gt; <i>My thought was that it had possibly been outlined in the</i> <br>&gt; <i>same color as the background, making it look 'slimmer'.</i> <br> <br>That's a possibility, but it looks to me that many of the characters are simply a different shape. Compare the bowls and curves of the lowercase 'a' and 'e'. <br> <br>&gt; <i>Did you see if the Mecanorma Estro is identical to the one from Image Club?</i> <br> <br>I don't have the Mecanorma version, so a close compare isn't possible. Other than perhaps the extent of the character set (there weren't any ligatures in the Image Club version, for example...) the two faces are nearly identical.</p>
