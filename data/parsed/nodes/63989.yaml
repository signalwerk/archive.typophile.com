      <p>Thanks for your thoughts, which of course make sense to me, dirtcastle :).</p>
      <p>Yes, the "too geometric" issue is definitely a thing I`ve been thinking about. But I didn`t want to draw the outer shapes rounder because then the contrast between the outer shapes and the inner shapes (rectangular) seemed too weird to my eyes. (Not sure, if you mean that)</p>
      <p>I understand your hint regarding the personality. I feel, driving it further in a humanist direction would lead to a completely different typeface -- I especially like the simple concept of the letters as they appear now, it is like one can immediately understand the letters and can draw them by hand on a plate (sign painter perspective). I liked that approach when I saw those plates in the streets of Prague and that`s what defines the character of the typeface at all, as I understand it. Maybe these letters can be a good starting point for a next typeface ;) -- </p>
      <p>For now, I´m not sure if all the letters play together in harmony -- on some days the lowercase v and w seem a bit dark to me. </p>
      <p>Also the "horizontal-vertical" issue: at the moment all strokes have the same weight -- which is unorthodox, I know (do you mean that with "baseline heavy"?). Maybe I should fix that and bring it in balance as a next step..</p>
      <p>hope you can follow my english (imagine me switching between the typophile.com tab and the dict.leo.org tab while writing this) :)</p>
