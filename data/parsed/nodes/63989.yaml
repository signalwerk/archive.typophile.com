      <p>Nice. It's relaxing. Breathes easily.</p>
      <p>Occasionally it feels baseline heavy. Stylistically, some might find it a bit too geometric. It seems to be hinting at a more humanist vibe, especially with those chiseled ears, but the dominance of parallel lines tempers it's personality. That isn't necessarily a bad thing, but it seems to have potential for a bit more personality (i.e., more curves), if that makes any sense.</p>
