      <p>Your English is excellent. I understand 100%.</p>
      <p>I think you are right that curves would change the personality of the font.</p>
      <p>And I think you are right that changing the weight could have a big effect.</p>
      <p>I think the reason why it feels baseline heavy is height and width of the serifs. I think they might be just a little bit too wide and too tall. </p>
      <p>Still, even as it is, I think this is a very nice looking font.</p>
