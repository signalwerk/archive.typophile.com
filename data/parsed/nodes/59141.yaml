      <p><cite> &gt; Would H&amp;FJ-style grades count? Chronicle Text, for example, has three weights that each comes in four grades...<br>
      </cite></p>
      <p>I'm going to assume they treated the grades in Chronicle Text the same as they did in Mercury Text; in which case, the Bold is the same weight for all grades. So the range would count as 9 "weights," not 12. </p>
      <p>Not criticizing -- this is standard practice in grading. FB takes the same approach. </p>
      <p>Just pointing out, is all.</p>
