  html: |-
    <p>I'm looking to list as many typefaces as I can that have more than nine weights.</p>
    <p>Secondarily, I'm interested in typefaces that don't have more than nine total, but have more than three weights which are lighter than "regular."</p>
    <p>Note that I am using the word "weights" in the strict sense of differing stroke thickness with the same basic form: light, regular, semibold, bold, and so on. Some people have taken to using the term "weights" to mean what I would call "styles" or "fonts." Italics or a separate small caps font do not comprise additional weights!</p>
    <p>Thanks!</p>
    <p>T</p>
