      I can imagine that in a parallel universe where MM endured, I might have produced Sense and Sensibility as such, along the humanist/modernist axis.</p>
      <p>Nowadays, variability seems to be conceptualized (by the type designer) and implemented (by the typographer) as discrete alternates grouped in Stylistic Sets, not as infinitely adjustable iterations.</p>
