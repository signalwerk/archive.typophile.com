    html: |-
      <p>Hrant is right. The reality is that MS wasn't interested in supporting MM tech within OpenType, and that Adobe had done a lousy job of evangelizing MM both internally and externally. Adobe was already needing to evangelize OpenType, and avoid making the same mistakes again. It woud have been possible to keep multiple master tech in OpenType, but it would essentially have doubled the evangelism required, and made success that much less sure.</p>
      <p>I don't know that it multiple master tech was too complicated for graphic designers to understand, but it was certainly complicated, and it would have required a major effort to educate and evangelize. The relevant people didn't realize that, or chose not to do it. Instead, MM fonts just had their prices reduced in an effort to boost sales. All that happened was that lots of people bought MMs but didn't even know they had them, or what was special about them.</p>
      <p>On the plus side, folks at Adobe learned from what happened and worked pretty hard to evangelize OpenType, both internally and externally. Arguably some of the problems solved by OpenType were more important, but I'm pretty sure that the difference in evangelism efforts made a huge difference in the relative success of the technology.</p>
      <p>Cheers,</p>
      <p>T</p>
