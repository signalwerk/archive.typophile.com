      <p>As long as they are the right ones ;-)</p>
      <p>We made up a custom version of Minion, by going back to the old Multiple Masters fonts and making up an OpenType instance, using 405 weight, 575 width, and 10-point optical. Heavier, and condensed just enough to recover the cpp setting of the original "regular."</p>
      <p>Just got in the first book printed DPT with the type. Man, it is a joy to see Minion with the proper weight again.</p>
      <p>The book used Thomas' Hypatia Sans for display (thanks, Thomas!).</p>
      <p>I don't know if Amazon's "look inside" can ever accurately show weight relationships, but here is the link:</p>
      <p><a href="http://www.amazon.com/Creativity-Its-Discontents-Industries-Intellectual/dp/0822350823" title="http://www.amazon.com/Creativity-Its-Discontents-Industries-Intellectual/dp/0822350823">http://www.amazon.com/Creativity-Its-Discontents-Industries-Intellectual...</a></p>
      <p>It could use a little more leading, and a little shorter measure, but the characters per page requirement didn't allow for that. The type is large enough that even these 65+ year old eyes can read it.</p>
      <p>These are my notes for anyone wishing to give something like this a try, things to consider...</p>
      <p><cite>405-575-10 settings from Minion Multiple Masters. For characters from newer Minion roman, increase weight by 1, scale horizontal 100.2 vertical 100, raise 1 unit -- (recover from scale only). Not perfect, but will do for non-Latin characters. For superscripts, MM 467 595 6 scale 60H 57.6V. Small caps scaled 102 percent.</cite></p>
