    html: |-
      <p>As a rule, I kern all possible letter combinations, plus numbers, common symbols and punctuation. BUT…before I kern, I go through all of the combinations in the Metrics Window. A slight nudge here and there can end up substantially reducing the number of kerning pairs required…or sometimes not.</p>
      <p>Once upon a time, I created outlines for a font with very unusual serifs (I was going to call the font Twinkletoes) based on hand-lettering from an old chapbook. As it turned out, the only way the letters really looked good together was as they were presented in the book—A to Z, upper and lower. Virtually EVERY other letter combination required kerning. Bummer…</p>
