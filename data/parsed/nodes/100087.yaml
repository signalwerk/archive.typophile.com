      <blockquote><p>Or should they denote a glyph's default letter-spacing, in which case kerning classes are an additional layer of spacing refinement?</p></blockquote>
      <p>Yes.<br>
      Relying only on kerning would be a nightmare: you'd have to kern every single pair! Plus some software ignores the kerning.</p>
      <p>So you set the sidebearings as best you can, accommodating all the possibilities as best you can. Just be warned: this makes the act of spacing a very zen-like effort.  :-)</p>
      <p>hhp</p>
