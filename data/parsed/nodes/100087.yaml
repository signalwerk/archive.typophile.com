    html: <p>To make your life a lot easier you should get your head around classes - both metrics and kerning. By doing this you can apply the same values to the similar elements of different characters, for example the left sides of b, h, i, k, l, m, n, p, r. And curved sides like the right of b, o  and p. etc. Setting classes up properly in the first place can hugely decrease the amount of time spent spacing and kerning , and also the number of kern pairs. It also helps consistency. If you end up with thousands of pairs you're doing it wrong.</p>
