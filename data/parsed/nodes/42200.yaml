    <p>From my thesis research I am getting the impression that FFMeta represents the first time an organization commissioned a typeface intended to become its typographic identity on all printed output (at least in the context of organizational systems, obviously newspaper and magazines commissions predate it). Is this correct, or is the popularity of FFMeta overshadowing another important design?</p>
