    html: |-
      <p><cite>Goudy did Pabst for Pabst.</cite></p>
      <p>Pabst was used for advertising and doesn’t really fit into the context of a identity system; at least not in the context of corporate identity as established during the 1930s and what that has evolved to today.</p>
      <p><cite>Kurt Weidemann’s Corporate A,S and E predates Meta.</cite></p>
      <p>It predates Meta actually being turned into  a usable font, but the commission—which is what I am interested in—for Meta came in 1981, and the Corporate A, S and E series were designed from 1985-1990, implying a 1984/1985 commission.</p>
      <p><cite>That wasn’t exactly a typeface, but nevertheless kind of a forerunner, no?</cite></p>
      <p>I think that there’s a pretty big gap there in terms of context.</p>
      <p>Keep in mind that I am not asking about commissions for specific uses, I am looking at a commission of a typeface that was meant to be used for <em>everything</em>, not just running copy or advertising or a signage system. I am looking for the commission that said ”we want to stop printing everything from business cards to our truck lettering in Helvetica and print everything in our own typeface” and I think that the Meta commission might be that moment.</p>
