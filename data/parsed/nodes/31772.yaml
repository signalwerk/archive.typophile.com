    <p>Hi everyone. I joined Typophile awhile back, but I've been inactive lately. I apologize for that. I have a project that I'm having a little trouble deciding on a font.</p>
    <p>My brother needs a business card. It's not much. Says we will do something nicer with a bigger budget down the line, but it's looking like this will be a 1 or 2 color, 1 sided card. He is not a business. Just himself. And since he doesnt have a logo I was going to do strictly typography. No time for a logo. He wants to send this to the printer MONDAY! (Yeah, I know.)</p>
    <p>So, really I just want to choose the right font. His work: home repair, remodeling, and maintenance. Carpentry. Flooring (wood, tile, laminate), Handyman services, appliance installation and repair (my dad is his sub on that end of the work).</p>
    <p>He has been doing work like this for years. Mostly on through word of mouth. He wants a card to bring in new business.</p>
    <p>Some keywords he has mentioned to me: trust, loyalty, craftsmanship, customer satisfaction, professionalism.</p>
    <p>Any ideas? Sans, Serif, Demi? I can justify most of the choices. But I have minimal fonts to use here at home. I'll have to purchase a fairly affordable one or find a free one that could work.</p>
