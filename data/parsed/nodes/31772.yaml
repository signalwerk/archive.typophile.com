      <p>I've been in this situation many of times too...</p>
      <p>Gentium is probably the best free font in the world (won a TDC award). Its good for text and very beautiful. Looks a little like ITC Gamma too just with the eccentricities. The PDF's on the Sil website prove that Gentium is not generic free 'stuff'. </p>
      <p><a href="http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;item_id=Gentium" title="http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;item_id=Gentium">http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;item_id=Gentium</a></p>
      <p>Also fontshop offers a free font of the month (or when ever new type is available). You can actually build a little library out of these fonts.</p>
      <p><a href="http://www.fontshop.com/features/free.cfm" title="http://www.fontshop.com/features/free.cfm">http://www.fontshop.com/features/free.cfm</a></p>
      <p>But I must tell you need to invest in commercial type.</p>
      <p>Now if you want a mind blowing value that no one can beat- Font Diner! Just about all of these fonts are for display but they work well with each other and with neutral classics like Futura and or Franklin Gothic that maybe installed on your machine.<br>
      The collections are only 28 dollars each!!! Sometimes you can't even buy ONE font for that price! Downside- not opentype.</p>
      <p><a href="http://www.fontdiner.com/main.html" title="http://www.fontdiner.com/main.html">http://www.fontdiner.com/main.html</a></p>
      <p>Also have a look at Fonts.com<br>
      Zapfino Extra Pro and Forte Pro could be had for only 35.00 and these come loaded with every feature in the book.<br>
      PNM Caecilia has integrated the small caps, ligatures, old style figures in one font file- actually saving you money when you buy as OpenType 29.00- not bad. And a range weights that you are looking for.</p>
      <p>And Ascendercorp.com has a fabulous collection of original fonts (oft under-appreciated)<br>
      Ascender does lots of business with Microsoft and other OEMs hence these are expertly hinted- you have to pay big bucks for fonts that are hinted- and price are still very good. </p>
      <p><a href="http://www.ascendercorp.com/Ascender_fonts.html" title="http://www.ascendercorp.com/Ascender_fonts.html">http://www.ascendercorp.com/Ascender_fonts.html</a></p>
      <p><a href="http://www.ascendercorp.com/pdf/Ascender_WPF_fonts.pdf" title="http://www.ascendercorp.com/pdf/Ascender_WPF_fonts.pdf">http://www.ascendercorp.com/pdf/Ascender_WPF_fonts.pdf</a></p>
      <p>Endurnace Pro, Kootenay Pro, Lindsey Pro, Massif Pro (has a similiar stroke modulation of the expensive Font Bureau Amira), etc. Pescadero is very special- no italic though.</p>
      <p>You might also want to consider font collections:</p>
      <p>FB Eagle, Coquette, and Columbus make the whole $19.00 collection worth it.</p>
      <p><a href="http://ascenderfonts.com/Merchant2/merchant.mvc?Screen=PROD&amp;Product_Code=CFP01-80-01-05&amp;Category_Code=Font_Pack" title="http://ascenderfonts.com/Merchant2/merchant.mvc?Screen=PROD&amp;Product_Code=CFP01-80-01-05&amp;Category_Code=Font_Pack">http://ascenderfonts.com/Merchant2/merchant.mvc?Screen=PROD&amp;Product_Code...</a></p>
      <p>Adobe collections are really the ultimate though. They cost more but this is really the creme de la creme!</p>
      <p><a href="http://www.adobe.com/type/collections.html" title="http://www.adobe.com/type/collections.html">http://www.adobe.com/type/collections.html</a></p>
      <p>Hope I have helped you. Don't forget to ask about student discounts if you are one.</p>
      <p>Mike Diaz :-)</p>
