      <p>typographia&gt;&gt;&gt; OpenType fonts work on the mac and the PC. They have special features such as glyph substitution ( such as f-ligatures ff, fi, fj, ffl, fl)  Just about all the fonts I suggested with the exception of the Font Diner choices are OpenType.</p>
      <p>OpenType is cross-platform. If all that is available to you is a windows machine- go right ahead- then when you get your mac you can use those same fonts and they will function just as well if not better (on the mac its very easy to work with OpenType and all it features)</p>
      <p><a href="http://www.adobe.com/type/opentype/" title="http://www.adobe.com/type/opentype/">http://www.adobe.com/type/opentype/</a></p>
      <p>But just remember the fonts on your boyfriends machine have to be uninstalled if he does not live you... I know that's dumb but that's how font licenses go.</p>
      <p>All the success to you,</p>
      <p>Mike Diaz :-)</p>
