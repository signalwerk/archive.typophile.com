  html: <p>I need help.  This logo is for a jewelry company that designs custom b/w photo jewelry set in sterling.  It's very simple, casual and meant to highlight the photos. The target market is mainly women with children/grandchildren.  Please tear this logo apart.  What would you change?<img src="http://www.typophile.com/forums/messages/29/34432.jpg" alt="nickel pickles logo"></p>
