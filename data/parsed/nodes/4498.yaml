    html: <p>Besides the name? Just kidding. <br> <br>I don't think the pickel illustration is necessary. In fact, since I don't think there is any relationship between pickels, nickels and jewelry I think I would deemphasize the pickel. The name is cutesy, so I think I would focus on the type rather than the literal pickel. <br> <br>Your service description indicates that they are in a specialized/specific market (b/w photo jewelry). Have you thought of any ways to indicate what they do or what their product is? <br> <br>I will reiterate</p>
