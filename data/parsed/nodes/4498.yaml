    votes: null
    html: "<p>Nichole: <br> <br>I think I know your target, and although I am not crazy about the name, I'm not certain that you would be defeated by it either. <br> <br>There is a successful second hand maternity clothing store near my home called Pickles and Ice Cream. That, of course, makes sense relative to the cravings that pregnant women are known for. <br> <br>If these charms are to be distributed through in-home parties, then the title might suffice, but if you're looking to expand into retail or catalog sales, then I think you'll need to come up with something that makes sense to the non-Huntsmans. <br> <br>My wife has a friend who sells a similar product under the title, Charming Connections. Brainstorm some elements (both physical and emotional, literal and implied) that are relevant to your product/service, then go from there. <br> <br>Aloha! <br>Scott</p>"
    html_clean: "<p>Nichole: <br> <br>I think I know your target, and although I am not crazy about the name, I'm not certain that you would be defeated by it either. <br> <br>There is a successful second hand maternity clothing store near my home called Pickles and Ice Cream. That, of course, makes sense relative to the cravings that pregnant women are known for. <br> <br>If these charms are to be distributed through in-home parties, then the title might suffice, but if you're looking to expand into retail or catalog sales, then I think you'll need to come up with something that makes sense to the non-Huntsmans. <br> <br>My wife has a friend who sells a similar product under the title, Charming Connections. Brainstorm some elements (both physical and emotional, literal and implied) that are relevant to your product/service, then go from there. <br> <br>Aloha! <br>Scott</p>"
