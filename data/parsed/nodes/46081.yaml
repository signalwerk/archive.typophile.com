    <p>Hello Again,</p>
    <p>Here is the second poster for the Kyoto protocol series that I'm doing for my blog ( <a href="http://whatype.wordpress.com/" title="http://whatype.wordpress.com/">http://whatype.wordpress.com/</a> ). This one shows the percentage of emissions that every country has signed to achieve by 2012.</p>
    <p>Once again I would really appreciate every input you could give me on this.</p>
    <p>Thank you so much in advance</p>
    <p>Pedro Monteiro<br>
