      <p>Oh get a grip, Jan. Pray tell us who's been "ripped off". Was it ITC Korinna, or Koralle by Classic Font Corporation, or Corel's Korinthia (sold with Corel Draw 3)? Was it Korinna BT or Softmaker's ("This is a copyrighted typeface") Korinth or their Kingston in their Megafont XXL collection?</p>
      <p>Let's face it: <a class="freelinking external" href="http://www.linotype.com/de/712/itckorinnabyadobe-schriftfamilie.html?viewmode=family&amp;id=712&amp;name=itckorinnabyadobe" rel="nofollow">The Korinna font was designed by Ed Benguiat, Victor Caruso and others in the 1970s, "ripping off" hot-metal type owned by Berthold AG and dating back to 1904</a> (follow the link and click the Über/About tab). The letter shapes have been in the public domain for some time now. So the alleged "rip-off" is perfectly legal and should be good enough for a starving college student :-)</p>
