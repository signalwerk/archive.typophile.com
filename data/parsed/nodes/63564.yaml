    <p>I have an assignment in my typography class where I have to A: find the history of the font "Katrina", and B: design a poster with it.</p>
    <p>Problem is, all I can find is stuff about hurricane katrina, and every font site just has the cartoony version.</p>
    <p>If its actually another font, (like arial is the same as helvetica...) then pleaaaaase help me find out what it is. Or just the history of it, I'm dying here!</p>
    <p>Thanks in advance</p>
    <p>An image is attached</p>
    <p>P.S. whoever figures this out gets cookies. an image, at least.</p>
