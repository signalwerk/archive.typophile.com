      <p>This looks like an interesting start. Here are a couple of thoughts.</p>
      <p>- Most of your glyphs look quite "constructed", like you were fusing them up from different parts that you were copy-pasting between letters. That means that most of them will need a bit of optical correction. For example, in the bpdq (and others), there is a little bump where the curve "becomes straight". These things need to be optically tweaked, away from pure geometry, in order to look right. Also look at the overall proportions, like why is the "e" so much narrower than the "o"?<br>
      Mind that if you really want to make it work for text, that's going to take even more optical correction, and lots of testing. It might be easier to first shoot for display, where it's more permissible to stick closer to geometry.</p>
      <p>- I like your curvy/tapering terminals on things like "c", "s", "a". In fact, I think the "a" is my favorite glyph. It's really quite nice.</p>
      <p>- The two-sided x-line serifs – on "v", "w", "x", "y" – are much thinner than the other ones. Actually, on the "x" the baseline serifs are also thin. I think I'd make them thicker to match all the other ones.</p>
      <p>- "k": the (upper) arm looks heavier than the leg. It should be the other way round.</p>
      <p>- "o" seems to have stronger contrast between thick and thin than the other letters.</p>
      <p>- The tail of the "g" has a similar problem. Best idea is probably to look at lots and lots of "g"s and figure out where the most weight should be. Also, that ear is too small.<br>
      On the other hand, have you tried making a single-storey "g"? Kind of like the "q" with the descender curving over to the left. It could work quite well in this font I think.</p>
      <p>Keep going! :-)</p>
