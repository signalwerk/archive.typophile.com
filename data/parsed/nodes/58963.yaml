      <p>Hi Rony,</p>
      <p>I love teaching Letter Design in India.</p>
      <p>Here is some feed back:<br>
      * Very Iinteresting design style:<br>
       with typical pointed endings in a,c,e &amp; s.<br>
       Visble heavy sress stokes especially vertical ones.<br>
       Clear capsule shape counter forms.<br>
       Condense character widths.</p>
      <p>Few corrections to be considered:<br>
      * y stand out with right side heavy sroke, normally it is left one.<br>
      * v,w,x &amp; z do not reflect the style atall.<br>
      * z is bit wider in width and upper stoke goes out to left and creats balance problem.<br>
      * the conclave curve serifs at the baseline does not reflect on descenders, p, q, &amp; y.</p>
      <p>Regrds,</p>
