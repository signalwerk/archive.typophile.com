    html: <p> Like Ben said, 'dura' should be full strength. I think that because the face is so geometric you will not be able to manipulate the logo much more.  <br>One thing you might consider is the 10% grey outline, either darken it or take it out. Light greys like that often dont copy well. <br> <br>To give the logo more substance you might try a bolder weight? that way at a smaller size it will read well. Have you also tried inverting the colour? (white on black) I often find it helpful to test for eventualities. <br> <br>That 'e' does need a redraw ;) <br> <br>Bren </p>
    html_clean: <p> Like Ben said, 'dura' should be full strength. I think that because the face is so geometric you will not be able to manipulate the logo much more.  <br>One thing you might consider is the 10% grey outline, either darken it or take it out. Light greys like that often dont copy well. <br> <br>To give the logo more substance you might try a bolder weight? that way at a smaller size it will read well. Have you also tried inverting the colour? (white on black) I often find it helpful to test for eventualities. <br> <br>That 'e' does need a redraw ;) <br> <br>Bren </p>
