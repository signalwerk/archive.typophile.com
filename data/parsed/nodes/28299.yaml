    date: 2006-10-04T08:16:00
    date_raw: 4 Oct 2006 — 8:16am
    votes: null
    html: "<p>Coop, I think the kind of advice you need at this point is beyond my realm of expertise (I'm a graphic designer, not a type designer). But there are a few things that I noticed. Maybe you can contact some of the regulars here directly, you may get a better response. A few things I noticed: the s seems to be falling over to the right; there is a feature on the leg of the k that doesn't seem to appear in any of the other characters, almost an inktrap effect where the leg meets the diagonal. I like the way it looks, but I don't see that treatment on any of the other characters; I think the o needs more contrast. If you can finese this a bit more I think you'll have something very solid. I think it looks great, very open and clean, and I would use it myself. Great work.</p>"
