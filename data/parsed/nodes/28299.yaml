    html: <p>The english text setting is much better. Personally I like seeing some large phrase, and single word settings on specimens as well. Take a look at Font Bureau's and Process Type Foundry specimen sheets. Pull some words that contain the characters you feel most strongly convey the spirit of the face. (Not trying to create more work for you, but I think it may help get some additional comments as well). I hope some of the type designers here chime in, I think this is a very solid face. There are a few things I noticed, will comment later when I have more time. Great work.</p>
