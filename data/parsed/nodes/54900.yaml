    html: |-
      <p>I actually started out with Photoshop and Illustrator long before I ever got into type design. When I finally started working with Fontlab, I found the vector tool really weird, and for a while I insisted on drawing in Illustrator. As I've worked more and more with Fontlab, I've grown used to its tools, and often find them better than Illustrator. They're definitely better for doing certain kinds of precision work...but for some jobs Illustrator is better. They're both based on different philosophies about how vectors should work. Going back to illustrator doesn't bother me. I think in part that's because I use it for different sorts of work.</p>
      <p>—Noam</p>
