    date_raw: 23 Feb 2009 — 3:00am
    votes: null
    html: |-
      <p>There's an excellent article in the March issue of Creative Review (UK) regarding Freehand users. There are still a surprising number of designers still using this sadly obsolete software. I have always preferred Freehand to Illustrator for drawing letters as it is just so much easier to use. Switching to FontLab was an easy transition as its' drawing behaviour is almost exactly the same as Freehand. I hate so many things about drawing with Illustrator - the way that you can't constrain angles when pulling a handle being the main gripe, selecting handles, having to use different pointers (why?), not being able to manipulate a section of a glyph, etc. It's a shame that when Adobe acquired Freehand they didn't incorporate Freehand's ease of drawing into Illustrator instead of just burying it. I still draw all logos in Freehand and then export the file to Illustrator and resave.</p>
      <p>I hope Freehand never becomes incompatible with the latest operating system otherwise Im buggered. Or maybe I'll have to use FontLab and copy and paste to Illustrator.</p>
      <p>Nick Cooke</p>
