  - id: 331009
    user: 1043
    date: 2009-02-22T20:19:00
    date_raw: 22 Feb 2009 — 8:19pm
    votes: null
    html: <p>I really liked Illustrator 8's drawing tools. I'm not quite sure what they did in the later versions, but they don't feel quite the same. Since I started using FontLab a few years ago, it's become harder for me to work in Illustrator. It's mainly because of FontLab's keyboard shortcuts for moving Bézier control handles and nodes, being able to slide nodes along a curve, being able to enter values for the length of control handles, and other little things that come in especially handy for drawing glyphs.</p>
