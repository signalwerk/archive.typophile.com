      <p><em> Pistilli Roman</em></p>
      <p>That's what I was going to say, before I finished reading the thread. :-)</p>
      <p>A very close alternative is Phil Martin's version of Pistilli Roman called <a href="http://www.roostertypes.com/view_fullfont.asp?catalogid=3192&amp;issingle=yes" rel="nofollow">Didoni</a>. Ironically, the slew of alternate characters he did which made his version different are not present in the URW digitization. The ampersand in the sample, which was an alternate in both Pistilli Roman and Didoni, is also not present.</p>
