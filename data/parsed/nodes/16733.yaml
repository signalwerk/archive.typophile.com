      <p>It also looks a lot like ITC Milano Roman, which Herb Lubalin would have probably have used, although it was designed by Tom Carnase and Ronnie Bonder. It has ampersands similar to both in the graphic, and a similar exclamation mark. I have it in the old Letterpress 5.0 CD from Image Club Graphics. Don't know if anyone still carries it.</p>
      <p>- Mike Yanega</p>
