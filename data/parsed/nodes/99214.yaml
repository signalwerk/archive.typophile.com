    <p>Computer keyboard fonts are quite similar, in other words the keyboard font typefaces compared between different computer keyboards, laptops and netbooks keyboards - in fact also computer printers, telephones and other items are quite similar,  could typographers say what is/are the font typeface name/s?  </p>
    <p>Also I would be interested to find out why is the serif font typeface not deployed on computer keyboards, laptops and netbooks keyboards,  computer printers, telephones and other items as normally only the sans serif typeface is usually put?</p>
    <p>Please also say from a colour design perspective or better still if you have had keyboard projects, why are the vast majority of the computer keyboards, laptops and netbooks keyboards black coloured these days as if they were a London taxicab?</p>
