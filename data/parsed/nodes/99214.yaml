      <p>I think a lot of it is Helvetica.</p>
      <p>I think sans actually makes sense because it's simpler and unobtrusive. Plus sans forms are closer to what we make when we write (not too relevant these days though) and they're easier to decipher individually.</p>
      <p>As for them being white-on-black: note that a lot of laptops have lighted keys...</p>
      <p>BTW it's very interesting that most keyboards use oblique type. I couldn't figure it out until I used a late-model Mac (which uses upright type) to type something: the letters on the left looked like they're falling backwards, and there's an overall impression of inconsistency - quite disconcerting.</p>
      <p>hhp</p>
