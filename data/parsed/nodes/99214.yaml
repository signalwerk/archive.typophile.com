      <p>I refer to the  wordy keycaps, for example, "Print Screen SysRq", PgUp, PgDn, Del, Caps Lock, Shift, Ctrl, Alt Gr, Tab, Insert, Delete, Home, End, F1....F12, etc and the keycaps' small areas at least on some keyboards in the UK.</p>
      <p>Could some keyboards font typeface/s also have gone through on these  wordy keycaps and/or keycaps' word/s individual letter/s, with or without sectioning to keyboard area/s,  by this process:</p>
      <p>(1)  spaces between each letter in a word condensed manually (standard / different) to ensure it was between the horizontal up and down margin and the vertical left and right margins, with or without sectioned to keyboard area/s?</p>
      <p>and/or</p>
      <p>(2)  used more than one font on the keyboard where one keycap has one font and another keycap another font depending on where the condensing is needed, with or without sectioned to keyboard area/s?</p>
      <p>and/or</p>
      <p>(3)  used different font sizes standardized across the keyboard depending on where it is needed, with or without sectioned to keyboard area/s?</p>
      <p>and/or</p>
      <p>(4)  used another font size on a certain keycap word/s letter/s and some other size on another letter/s on the same, with or without sectioned to keyboard area/s?</p>
      <p>and/or</p>
      <p>(5)  used mixed fonts in an individual keycap depending on where it is needed, with or without sectioned to keyboard area/s?</p>
      <p>or </p>
      <p>(6) are the above  views not applicable and instead the variations  noticed are  caused instead individually or in combination by all or part, the concave keycaps, the positioning of the keycap word on the concave, the keycap size and thus also the concave, thin or wide letters in a keycap word, plastic texture, keyboard build process, keycap ink and equipment  etc?</p>
