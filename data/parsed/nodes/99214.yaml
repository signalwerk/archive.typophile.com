    html: |-
      <p>@hrant:<br>
      <cite>I think a lot of it is Helvetica.</cite></p>
      <p>Indeed, because that's what IBM used on the original keyboard for the IBM Personal Computer.</p>
      <p>Other keyboard makers today will imitate the Macintosh, and use an italic sans-serif typeface.</p>
      <p>Before the IBM PC, while there were exceptions, the standard for keyboard keycaps was Leroy lettering. For those who are unfamiliar with this, it's a type of lettering guide so that a drawing pen will move in the shape of a letter, made by Keufel and Esser.</p>
