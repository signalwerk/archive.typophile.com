    html: <p>&gt;'digging into the paper'. <br> <br>John, digging in to the paper is the worst case scenario. <br>A more likely event is having one's nib "catch" on a piece of fibre. <br> <br>A supple pen (especially with a fine point) can be a disadvantage when doing a push stroke, because it will start to bend and catch at the slightest resistance, whereas a stiffer (and/or broader) nib will push through, or ride over, resisting fibres and hold its angle. <br> <br>But suppleness is not a simple issue. <br> <br>The structure of a nib, whether in a reed, quill, or metal, is designed to be supple when pushed down, yet stiff in other directions -- not only does this allow the user to regulate ink flow by the amount of downward pressure, it also keeps the nib firm when moved sideways or pushed, when stiffness is required to prevent the nib from catching. <br> <br>The relationship between the hardness of the nib material and the smoothness/hardness of the paper/vellum is also an issue. <br> <br>Whatever the pen, going against the grain is counter-intuitive to the way one has learned to write calligraphy, and the way the vast majority of characters are formed. <br> <br>However, strokes that are difficult for a nibbed instrument are no problem for a pencil or crayon, and calligraphers develop their embellishments -- complex flourishes -- as extemporized single strokes. So there is definitely a reason to incorporate the more difficult strokes into one's style.  <br> <br>Interestingly, a determining factor as to whether one executes a difficult ligature in a single move involving pushes, or splits it to avoid them, is how much ink is left in one's pen, and how smoothly it's flowing. If one has recently dipped, it's easier to do push strokes.</p>
