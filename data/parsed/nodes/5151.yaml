    html: <p>&gt;you have clearly illustrated why no one would ever have mistake a "c" for an "i" <br> <br>Have it your way. Others may see things differently. <br>But that's not the issue. <br>The purpose of the exercise was not to address the extreme situation of mistaking one letter for another. <br> <br>I demonstrated, as I intended, that a "c" can indeed look quite like a dotless "i", (and perhaps also create something that looks a bit like a "d") when the "c" and the crossbar of the "t" are not separated. That's all.  <br> <br>The point is not that readers will mistake the letter, but that it is unsatisfactory to have one letter look like another (as with I, l, and 1). <br> <br>The ct ligature is not a playful ornament that's added on to a perfectly good character combination -- in calligraphy it  results in an improved pen motion over doing the letters plain, and it also makes a distinctive glyph to replace a poor character sequence -- where the top terminal of the "c" or "s" meets the crossbar of the "t" indecisively (my left hand illustration, above), neither buffered by a serif, nor smoothly linked (center illo). <br> <br>Gerald, how do you account for the persistence of the fancy "ct" and "st" serifs, amongst those no-nosense printer boys of yore? <br> <br> <br> <br></p>
    html_clean: <p>&gt;you have clearly illustrated why no one would ever have mistake a "c" for an "i" <br> <br>Have it your way. Others may see things differently. <br>But that's not the issue. <br>The purpose of the exercise was not to address the extreme situation of mistaking one letter for another. <br> <br>I demonstrated, as I intended, that a "c" can indeed look quite like a dotless "i", (and perhaps also create something that looks a bit like a "d") when the "c" and the crossbar of the "t" are not separated. That's all.  <br> <br>The point is not that readers will mistake the letter, but that it is unsatisfactory to have one letter look like another (as with I, l, and 1). <br> <br>The ct ligature is not a playful ornament that's added on to a perfectly good character combination -- in calligraphy it  results in an improved pen motion over doing the letters plain, and it also makes a distinctive glyph to replace a poor character sequence -- where the top terminal of the "c" or "s" meets the crossbar of the "t" indecisively (my left hand illustration, above), neither buffered by a serif, nor smoothly linked (center illo). <br> <br>Gerald, how do you account for the persistence of the fancy "ct" and "st" serifs, amongst those no-nosense printer boys of yore? <br> <br> <br> <br></p>
