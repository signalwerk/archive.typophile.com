  html: "<p>I'm wondering, for discretionary ligatures like the \"ct\" and \"st\",was there a writing-facilitation justification for their creation, or did people just think they looked cool? Do they occur before printing? I guess they must. Any good references about \"aesthetic\" ligation in manuscripts? <br> <br>I'm about as good with a pen as I am at surfing (ergo: Munch and Carson have nothing to fear), so I can't figure out how the connections could be hand-induced, but maybe. <br> <br>hhp <br></p>"
