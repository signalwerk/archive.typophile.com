    html: <p>I know, no one wants my input? <br> <br><i>Renaissance reed pens</i> <br> <br>This would make a lot of sense. Especially for the { ct } <br> <br>It would appear, at first glance, most certainly in Caslon's time, {famous for the long s} that the {st } tied letters�ligature, was either, never inked, or most likely, would you agree, never cut? <br> <br>The long s, it would appear, occurs at the beginning and the middle of a word. Yes? <br> <br>The short s, It would appear occurs at the end of a word. No? <br> <br>So work with me. Why would Caslon have an {st} tied letter? Well, perhaps he didn't. <br> <br><a href="http://www.english.upenn.edu/~jlynch/long-s.html" target="_blank">http://www.english.upenn.edu/~jlynch/long-s.html</a> <br> <br> <br> <br></p>
