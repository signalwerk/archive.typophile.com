    html: "<p>Hrant, I'm late to the party, but I have to agree that it seems the origin is definitely chirographic. I made some illustrations for what they might be worth. <br> <br>A browse through some calligraphy instruction manuals show pretty consistent construction (I'm not a calligrapher but the books had letters in them...): <br> <br><img src=\"http://www.typophile.com/forums/messages/30/37065.jpg\" alt=\"letter construction\"> <br> <br>Here's a detail from an illustration in Fairbank's <i>A Handwriting Manual</i>: <br> <br><img src=\"http://www.typophile.com/forums/messages/30/37066.jpg\" alt=\"mercator detail\"> <br> <br>The highlight box shows typical construction of ss, ct, and st ligatures. Of note, but not highlighted is the flourished st ligature above the highlight box in the word 'est'. <br> <br>Fairbanks asserts that 'Joins are undoubtedly agents of speed'. This seems logical in the italic hand but here is an example of the ct and ss ligatures in use in a book hand (Fairbanks, Plate 2 detail): <br> <br><img src=\"http://www.typophile.com/forums/messages/30/37067.jpg\" alt=\"psalter detail\"> <br> <br>I guess it would preserve speed here too, though it looks as though there is no pretense at flourish or decoration here. <br> <br>I noticed (but did not scan) the text in Morison's <i>Letter Forms</i> which is set in Digital Fournier. The ct and st ligatures have lost most (not all) of their chirographic thick and thin and seem to be more sculpted into the serif on the c and s and into the top of the t (as contrasted with the lower left highlight in the last Psalter example). <br> <br><i>...sometimes the end of a line came unexpectedly so little tricks and alternate letterforms came about to save the day</i> <br> <br>Which is true and many letters that don't have crossbars end up with crossbars or a horizontal exit bar when this happens like the lc n occuring at the end of a line that needs justification to the one preceding. <br> <br>I hope any of this is useful. <br> <br>Jon</p>"
