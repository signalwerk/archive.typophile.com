    html: <p>Nick <br> <br><i>Gerald, how do you account for the persistence of the fancy "ct" and "st" serifs, amongst those no-nonsense printer boys of yore?</i> <br>�������������� <br> <br>Nick, obviously you have not read "Printing in the Twentieth Century"  by the Times. But I can understand that, you are a calligrapher. Dare I suggest, "printing is here to stay". But I admire your spunk. <br> <br>According to "Behind the Times" ligatures saves time. So maybe printers used the ct and st and other ligatures to distinguish themselves as "Non Union" printing establishments.  <br> <br><a href="http://www.themicrofoundry.com/other/polytypie.gif" target="_blank">http://www.themicrofoundry.com/other/polytypie.gif</a> <br> <br><i>"Hrant's words The Times newspaper was set in such a scheme in the beginning, but then the printers union -realizing the savings in time, hence reduction in their incomes- decided to charge by the letter and not the sort, so the efficiency of the system became moot. And then mechanical composition came around, so it didn't matter." </i> <br> <br>So according to Hrant these times were very progressive, they were searching for a "slower way to set type". <br> <br><b>BEFORE</b>  <br> <br><a href="http://lanstontype.com/TypeStick.html" target="_blank">http://lanstontype.com/TypeStick.html</a> <br> <br><b>AFTER</b> <br> <br><a href="http://lanstontype.com/MonotypeKeyboardHands.html" target="_blank">http://lanstontype.com/MonotypeKeyboardHands.html</a> <br> <br>So the Monotype put many people to work. That is a good thing for the economy. They also used the Benton Pantograph because cutting punches by hand was too fast. <br> <br>Perhaps the Union Print Shops would print their little Union Bug at the bottom of the page, Non Union shops wiggled in the ct st and all the ligatures to demarcate themselves from the foot dragging, "ball and chain unions". Pretty sneaky. <br> <br>What I find confusing is that the inclusion of the ligatures was always the work of skilled typographers, not the lazy ones. That has not changed even today. That goes against the grain of accepting Hrant�s theory cart blanc.  <br> <br>You see what I mean. You do don't you. <br> <br>One would think using Hrant's theory, lazy typesetters in a rush to get home to eat hot dogs and watch "Hockey Night in Canada" would be using the ligatures, the learned ones, like Hrant, and yourself, would not. <br> <br><b>Calvert Guthrie writes.</b> <br> <br><i>Most ligatures resulted from the need for speed.</i>  <br> <br>You see what I mean. Maybe if you guys had unionized you could have worked more hours. <br> <br>But no matter, reason or not, it is still a flourish. The reason I like the ct st ligatures is because they are really groovy ornaments. <br> <br><a href="http://lanstontype.com/GiampaJugendsali.html" target="_blank">http://lanstontype.com/GiampaJugendsali.html</a> <br> <br>They are right up my alley. Calligraphers feel the same way about the matter. <br> <br>���������������� <br> <br><b>Calvert Guthrie writes.</b> <br><i>And, yes, these ligatures are also ornamental...  <br>I still use them--even when I'm scrawling with a pencil. </i> <br>���������������� <br> <br>So I know that I am pretty shallow Nick but I think those ct and st ligatures are ornamental. I hope you won't hold that against me. <br> <br>You won't, won't you? <br> <br></p>
