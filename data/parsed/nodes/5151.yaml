    html: <p>Nick,  <br> <br>Thanks to you and to John Whipple for the interesting illustrations making clear the calligraphy behind the ligatures. I, at any rate, do appreciate the time you both took to do this. To me the point about the ct ligature is not that you will mistake the ct for this or that, but just that the ligature is an elegant clear solution to a problem, which you point out.  <br> <br>I found on the internet that the short s was used only as a final s, and hence there would be no traditional st ligature in calligraphy. Maybe it is just because I have known about this, but I find the ct ligature nice, in the right setting, but the st ligature consistently annoying. To me the way it redoubles the curve in the s just doesn't look good, and seems affected, unlike the ct ligature. <br> <br>Am I just imagining this or do some of you folks see the same thing? </p>
    html_clean: <p>Nick,  <br> <br>Thanks to you and to John Whipple for the interesting illustrations making clear the calligraphy behind the ligatures. I, at any rate, do appreciate the time you both took to do this. To me the point about the ct ligature is not that you will mistake the ct for this or that, but just that the ligature is an elegant clear solution to a problem, which you point out.  <br> <br>I found on the internet that the short s was used only as a final s, and hence there would be no traditional st ligature in calligraphy. Maybe it is just because I have known about this, but I find the ct ligature nice, in the right setting, but the st ligature consistently annoying. To me the way it redoubles the curve in the s just doesn't look good, and seems affected, unlike the ct ligature. <br> <br>Am I just imagining this or do some of you folks see the same thing? </p>
