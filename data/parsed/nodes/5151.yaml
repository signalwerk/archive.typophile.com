    html: <p>All you need is a small spot or smudge appearing on the page above Nick's middle example, and you have <i>fait</i> instead of <i>fact</i>. <br> <br>Having spent many months working with people who study ancient texts, looking at facsimiles of Hebrew Biblical manuscripts, I have developed a healthy respect for spots and smudges on the page and their ability to radically change the meaning of a text. Of course, if your vowel system consists largely of dots, the problems tend to be more numerous. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
