    html: <p>Hrant, <br> <br><i>"Printing in the twentieth century"</i> <br> <br><b>Twentieth Century, where�outer Mongolia?</b> <br> <br>Are you saying Monotypes were installed because <b>"handsetting was too fast"?</b>  The unions were complaining so the London Times searched for a "slower way" to set a daily newspaper? Are you saying, "If Monotypes were any slower the Times would have turned into a <i>weekly"</i>? <br> <br>The "Times" should have been renamed, "Behind the Times". Monotype and Linotypes were invented in the "nineteenth" century. This would indicated that the Times was still handsetting text. I wonder why a Monotype salesman never thought about dropping in on the establishment. After all, Monotype had an office up the street. <br> <br>Wait a minute, Times New Roman. I thought that was Monotype.  <br> <br></p>
