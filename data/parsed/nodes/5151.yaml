    html: <p>I don't remember the stroke order or even if this was done the same by most writers.  It was more on the order of a flourish and sometimes a way to make up for a spacing dilema.  An example is the end-of-line "e" which had a long extension below the crossbar.  Remember, letter and word spacing was done by eye and on the fly; sometimes the end of a line came unexpectedly so little tricks and alternate letterforms came about to save the day.  Later these variants became normal and sometimes could be used to distinguish individual hands.</p>
