    html: "<p>&gt; setting ligatures never saved any time <br> <br>This is not true. An entire system (actually, at least two of them) were devised beginning in the second half of the 18th century whereby \"logotypes\" consisting of frequent sequences of letters -much more than just two- were cast as individual sorts, to save time while composing. The Times newspaper was set in such a scheme in the beginning, but then the printers union -realizing the savings in time, hence reduction in their incomes- decided to charge by the letter and not the sort, so the efficiency of the system became moot. And then mechanical composition came around, so it didn't matter. <br> <br>And here's the layout from a similar scheme carried out by Henri Didot and Marcellin Legrand: <br><a href=\"http://www.themicrofoundry.com/other/polytypie.gif\" target=\"_blank\">http://www.themicrofoundry.com/other/polytypie.gif</a> <br>(Detailing mine.) <br> <br>hhp <br></p>"
