    html: <p>As I recall from Arnold Bank, my old calligraphy teacher, the ct and st ligs were originally done in calligraphy.  I think by dragging the corner of the flat pen or using low pressure on the pointed pen (and Wacom thought they started pressure sensitive drawing:-)  Look at Blackletter writing as well as cursive.  Those old guys were really good at it.</p>
