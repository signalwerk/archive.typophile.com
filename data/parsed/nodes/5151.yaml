    html: <p><i>To make the typical ct or st join according to the technique you describe, one has to push upwards (bottom right to top left) from the end of the c or s, digging the pen into the paper. </i> <br> <br>It is worth remembering that in the Renaissance reed pens were in more widespread use in Europe than they were in later times, when they were almost wholly supplanted by steel nibs. As any Arabic calligrapher can ably demonstrate, a reed pen can be pushed without 'digging into the paper'. In addition to widespread use of reed pens, contemporary instructions for the cutting of quills stress suppleness as a desirable quality.</p>
