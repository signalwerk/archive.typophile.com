    html: <p><i>Wow, nice treatment - definitely useful - thanks.</i> <br>My pleasure. <br> <br><i>Although in the Camp method, instead of a loop to the top of the stem I guess you'd just get a continuation into the bar - which however I have never noticed happen.</i> <br>Yes you definitely would. The examples that she shows are consistent with this. Her style also doesn't ligate except in tt, ra (which looks cool) and the ear on the g lending itself as the dot on i in a gi combination. <br> <br>The Mercator ligation does seem mannered especially in the word est and in the ct, though I think in the st ligation using the long s makes it look more natural. <br> <br>I think that the thin joins in Digital Fournier are definitely distracting. I asked my lady to read a page of the text and tell me what she thought, and she said those connectors on the s and t make me crazy. So in my informal survey, we're not the only ones. <br> <br>I have to say that ct and st ligatures can sure look cool. I like the idea of them. I think that the space between the letters having an arcing top could be nice like in the psalter example. I'd definitely consider including these ligatures in an italic companion to a text face. <br> <br>Personally, I think that ff fi tt <i>are</i> more important. <br> <br>As for the 'discretionary' descriptor, the employement of any ligatures would seem to be at the discretion of the typesetter, as their design is at the discretion of the type designer. Not really wrong but... <br> <br>It may be more useful to make a distinction about how <b>critical</b> a ligature is. In this regard I would say that fi is more critical than ct, as fi affords greater opportunity for letter shape collision and murkyness than st. Also since the st <i>is </i> a chirographic descendant, I would argue that it's existence is less critical and more appropriate to italic forms (though not exclusively). I think I would enjoy seeing a text face where the ct and st looping isn't as sculptered as in Digital Fournier, but more integrated as in the psalter example. And I could imagine that it could look very attractive... <br> <br>Jon</p>
