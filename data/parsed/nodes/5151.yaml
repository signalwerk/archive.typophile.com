    html: <p>I think Nick�s analysis comes closest to explaining <br>the pragmatic origins of the ct &amp; st lig�s. <br> <br>I want to add that the risk of snagging the surface on a push stroke isn�t a real concern when using a quill and working on vellum.  A properly polished steel nib shouldn't snag on sized &amp; pressed paper especially if the shaft is held more vertically. <br> <br>Most ligatures resulted from the need for speed. <br>When you lift your pen the flow stops for a moment. Getting it going again is quicker with a pull stroke than with a push stroke. After forming the second stroke of the lc c you have a little puddle of ink that can be pushed to the top of the t--the flow is still on and doesn�t need to be restarted.  <br> <br>I don't have it here at work to verify it, but I believe <br>Arrighi discusses this in his  Operina...(JHBenson's translation is the only English one I know of) <br> <br>A wetter pen allows you to start more letters with a push stroke but a wetter pen doesn't deliver the crisp consistency of form you get with a drier pen.  <br> <br>And, yes, these ligatures are also ornamental... <br>I still use them--even when I'm scrawling with a pencil. <br> <br>Calvert <br>Kansas City <br> <br> <br></p>
    html_clean: <p>I think Nick�s analysis comes closest to explaining <br>the pragmatic origins of the ct &amp; st lig�s. <br> <br>I want to add that the risk of snagging the surface on a push stroke isn�t a real concern when using a quill and working on vellum.  A properly polished steel nib shouldn't snag on sized &amp; pressed paper especially if the shaft is held more vertically. <br> <br>Most ligatures resulted from the need for speed. <br>When you lift your pen the flow stops for a moment. Getting it going again is quicker with a pull stroke than with a push stroke. After forming the second stroke of the lc c you have a little puddle of ink that can be pushed to the top of the t--the flow is still on and doesn�t need to be restarted.  <br> <br>I don't have it here at work to verify it, but I believe <br>Arrighi discusses this in his  Operina...(JHBenson's translation is the only English one I know of) <br> <br>A wetter pen allows you to start more letters with a push stroke but a wetter pen doesn't deliver the crisp consistency of form you get with a drier pen.  <br> <br>And, yes, these ligatures are also ornamental... <br>I still use them--even when I'm scrawling with a pencil. <br> <br>Calvert <br>Kansas City <br> <br> <br></p>
