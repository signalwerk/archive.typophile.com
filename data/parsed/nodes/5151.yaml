    html: "<p>&gt;If a 't' follows, you are now in a good position to loop upwards to the top of the stroke. <br> <br>Sorry Victor, the writer is in a difficult position. <br>To make the typical ct or st join according to the technique you describe, one has to push upwards (bottom right to top left) from the end of the c or s, digging the pen into the paper. <br> <br>However, it IS possible to do such a \"backwards\" stroke, keeping the pen barely touching the paper, and the stroke brief.  <br> <br>And it's a skill worth mastering, because the alternative is to bring one's pen back to the same spot three times, and each time to halt and raise/drop the pen: once at the end of the final \"c\" stroke, once at the beginning of the \"t \" diagobal upstroke (see Camp, in above JW post), and once again for the beginning of the \"t\" crossbar. This does not feel like good, flowing calligraphy, and I think this is one reason why calligraphy has developed the \"ct\" and \"st\" ligatures, to avoid this constricted series of motions. <br> <br>Another chirographic reason: from an aesthetic point of view, the combinations ct and st are unsatisfying, because the horizontal strokes at the top of the \"x height\" are close, and yet one cannot render them as one horizontal joining stroke (as in ti and fi), because that  would mess up the c/s (for the same reason that one does not top-join ci and si as ligatures). So, finishing the c/s with a flourished ligature provides a sense that the character has been concluded purposefully. <br> <br>Why did the ct and st ligatures persist in type when so many others were dropped? <br> <br>Because the humanist t with its very short ascender is a weak glyph. It looks quite similar to r and c in old-style faces from Bembo to Caslon. The ct and st ligatures add distinction, in more ways than one. <br> <br> <br> <br></p>"
