    html: <p>Yes and no. In German, the normal s can occur in the middle of a word at the end of a syllable. So "Haustier" would have a nomal s, while "Baustelle" would have a long s. But those same rules dictate that the st in "Haustier" would not ligate. And I've never seen the non-long st ligature in German to begin with. <br> <br>I'd be curious to know which languages the quaint st and ct appeared set in, and which ones they didn't.</p>
