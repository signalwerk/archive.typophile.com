 find confusing is that the inclusion of the ligatures was always the work of skilled typographers, not the lazy ones. That has not changed even today. That goes against the grain of accepting Hrant�s theory cart blanc.  <br> <br>You see what I mean. You do don't you. <br> <br>One would think using Hrant's theory, lazy typesetters in a rush to get home to eat hot dogs and watch "Hockey Night in Canada" would be using the ligatures, the learned ones, like Hrant, and yourself, would not. <br> <br><b>Calvert Guthrie writes.</b> <br> <br><i>Most ligatures resulted from the need for speed.</i>  <br> <br>You see what I mean. Maybe if you guys had unionized you could have worked more hours. <br> <br>But no matter, reason or not, it is still a flourish. The reason I like the ct st ligatures is because they are really groovy ornaments. <br> <br><a href="http://lanstontype.com/GiampaJugendsali.html" target="_blank" class="link-external">http://lanstontype.com/GiampaJugendsali.html</a> <br> <br>They are right up my alley. Calligraphers feel the same way about the matter. <br> <br>���������������� <br> <br><b>Calvert Guthrie writes.</b> <br><i>And, yes, these ligatures are also ornamental...  <br>I still use them--even when I'm scrawling with a pencil. </i> <br>���������������� <br> <br>So I know that I am pretty shallow Nick but I think those ct and st ligatures are ornamental. I hope you won't hold that against me. <br> <br>You won't, won't you? <br> <br></p>
