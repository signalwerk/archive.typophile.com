nd then go for that obscure box containing <i>"time and labour saving logotype, if only they had known they needed one, remember where it was, and had not loaned their roller skates to the baby sitter".</i> <br> <br>So don't go all "romantic, poetic and nostalgic on me about hot metal". I can't stand to see a grown digital junky weep.  <br> <br>Get the picture. <br> <br>Tell me how many ems per hour was set with that silly scheme you have dug up. I can't wait for you to remember all those combinations and where they go. The hoot word breaks would be interesting to watch. Want to make a wager, how about a "race"? <br> <br>Anyway, that said, I am glad your are interested in this sort of thing. If I ever get to my material I would welcome a more elaborate discussion on the many different inventions. Don't take this as a criticism, it is a backhanded compliment. <br> <br>������������ <br> <br> <br>Nick <br> <br>Your calligraphy is pretty good. <br> <br>So good you have clearly illustrated why no one would ever have mistake a "c" for an "i".  <br> <br>Thank you. <br> <br></p>
