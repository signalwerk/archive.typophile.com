    html: <p><i>A supple pen (especially with a fine point) can be a disadvantage when doing a push stroke, because it will start to bend and catch at the slightest resistance, whereas a stiffer (and/or broader) nib will push through, or ride over, resisting fibres and hold its angle.</i> <br> <br>Yes, I was probably misleading in mentioning suppleness, rather than the more specific qualities of reed pens (which I've only started using since taking an interest in semitic scripts). Because the outside of the reed is denser and less flexible than the inside, the reed pen will tend to flex when pulled but not when pushed, while the relative softness of the tip (relative to metal nibs) allows it to glide over even quite rough paper. I'm really quite thrilled with my reed pens, although they take some getting used to and managing ink flow is tricky for someone used to the regulated flow of a capilliary nib system. <br> <br><i>Whatever the pen, going against the grain is counter-intuitive to the way one has learned to write calligraphy, and the way the vast majority of characters are formed. </i> <br> <br>Unless you're writing Arabic <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
