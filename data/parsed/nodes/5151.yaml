    html: "<p>The 'ct' and 'st' ligatures have nothing to do with the line break; they can occur anywhere in the line. There's a little more functional sense to it than that.  <br> <br>One way of writing a 'c' is in *two* strokes:  <br> <br>Start at the thinnest part of the c (about 10:00) and continue down counterclockwise until the end of the lower arm. <br> <br>Then lift and go back to the starting point of your first stroke, but now proceed clockwise to finish the top arm of the c.  <br> <br>If a 't' follows, you are now in a good position to loop upwards to the top of the stroke. <br> <br>The same applies, mutatis mutandis, to an 's'. <br> <br> <br>Victor</p>"
    html_clean: "<p>The 'ct' and 'st' ligatures have nothing to do with the line break; they can occur anywhere in the line. There's a little more functional sense to it than that.  <br> <br>One way of writing a 'c' is in *two* strokes:  <br> <br>Start at the thinnest part of the c (about 10:00) and continue down counterclockwise until the end of the lower arm. <br> <br>Then lift and go back to the starting point of your first stroke, but now proceed clockwise to finish the top arm of the c.  <br> <br>If a 't' follows, you are now in a good position to loop upwards to the top of the stroke. <br> <br>The same applies, mutatis mutandis, to an 's'. <br> <br> <br>Victor</p>"
