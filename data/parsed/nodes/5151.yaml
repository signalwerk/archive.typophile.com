    html: <p>Calvert Guthrie  <br> <br><i>I think Nick�s analysis comes closest to explaining the pragmatic origins of the ct &amp; st lig�s.</i> <br> <br>Are you speaking of the "long s" or the "short s"? There is a difference. Conceivably one may agree with Nick if he were speaking about the "long st" ligature, but not if he was speaking of the "short st ligature". However, you will notice Nick is not speaking of the "long st ligature" but rather the "ct ligature". Follow? That the "ct ligature" is crucial to avoid confusing the "c" as if it were in fact an "i".  <br> <br>You know something, most typographers have forgotten this when printing medical texts, military manuals, modern scientific and mathematical texts not to mention legal contracts. Imagine nuclear accidents waiting to happen and needless deaths because the doctor mistook the "c" for an "i". God�my grandmother would be alive today. <br> <br>Text without the "ct ligature" is a friggin "ticking time bomb". <br> <br>Boy is this industry in for a mega class action lawsuit or what?  <br> <br>From now on the ct ligature should be legislated as mandatory, those that disobey should be decapitated. Think about it�some typographer killed granny. <br> <br>Naturally unless you have overwhelming evidence to the contrary, I care to disbelieve Nicks "ct ligature theory". <br> <br>Its a flourish, naturally. <br> <br>That's why you admit you like to play with them ornamentally.  <br> <br>Typography is fun. <br> <br>Now we are done with the ct and st ligatures.  <br> <br>��������������� <br> <br><i>Most ligatures resulted from the need for speed.</i> <br> <br>When speaking of "most ligatures" one would presume you speak of the fi, fj, ff, fl, ffl, ffi, ffj ligatures but not the "w ligature".  <br> <br>I don't think these are so much a result of the need for speed as need as for "preservation of form" and "spacing". In hot metal days, these same features were used to preserve form, spacing, not to mention avoid, "breakage or twisting".  <br> <br>Also, since you speak of speed, I can assure you setting ligatures never saved any time in the five hundred years of  "hot metal setting". They are not only a "typographical nicety" but they are also a "typographical necessity". Form and spacing. <br> <br>Beware of tracking? <br> <br>You know what I mean?</p>
