    html: "<p>Something I should have addressed originally: those \"logotypes\" were not ligated, so the reader couldn't tell the difference. So in both cases (Didot and The Times) obviously the only point was to save time, since most humans (there are 1 billion Chinese readers, after all) can handle a lot more than a few dozen glyphs. Sure, a few thousand is physically too much for a composer, but the few hundred in that Didot case seems fine. And note that the more logotypes you have, the smaller the sort boxes need to be, so you save body movements there. <br> <br>(Not that any of this will make a dent in Gerald's personal religion.) <br> <br>hhp <br></p>"
