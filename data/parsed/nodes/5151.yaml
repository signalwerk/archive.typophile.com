    html: <p>If I remember rightly, I read that the st ligature, with the short 's', is not historical. The switch to all short s only came after the French revolution. The long 's' with the t is the historically correct ligature, but here the character extends to the right and it is logical like the fi ligature. Was the ct ligature as common in the old days? Is there also an optical reason to separate the c and crossbar of the t?</p>
