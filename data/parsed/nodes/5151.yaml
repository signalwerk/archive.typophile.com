    html: "<p>\"So, doesn't this look better than Times?\" <br>\"Yeah, I guess so. But what's with all these curly things on the s-t?\" <br>\"Those are ligatures.\" <br>\"I don't like them.\" <br>\"Why not?\" <br>\"I don't know, they look kinda <i>pretentious</i>.\" <br>\"Pretentious? Why?\" <br>\"I don't know, they just do.\" <br>\"Dammit, Ma.\" <br> <br>\"So, doesn't this look better than Times?\" <br>\"Yeah, I guess so. But what's with all these curly things on the s-t?\" <br>\"Those are ligatures.\" <br>\"I don't like them.\" <br>\"Why not?\" <br>\"I don't know, they look kinda <i>gay</i>.\" <br>\"<b>GAY?!</b> WTF?!??! Why?!\" <br>\"I don't know, they just do.\" <br>\"Dammit, Dad.\" <br> <br>STATE OF FLORIDA BANS LIGATURES IN ALL OFFICIAL DOCUMENTS <br> <br>SF CHRONICLE ADOPTS LIGATURES IN BODY COPY IN FLORIDA PROTEST <br> <br>Dear Editors: <br> <br>Please cancel my subscription to your newspaper. After your overly trumpeted transition to your newfangled typesetting machines, I find I can no longer read your body copy without feeling irritated by these new, howyousay, \"ligatures.\"  <br> <br>Nobody seems to be able to convince me what purpose they serve, and I find that instead of getting annoyed by the President like I should, I keep get annoyed at the damn font. Otherwise I suppose it's nicer than the last. Or at least I take your word for it. I wouldn't know how to measure that, though. <br> <br>And I'm not convinced these \"ligature\" things have anything to do with gay people. Perhaps you don't either and are simply mocking the notion. But this has gone on for two weeks now and the joke isn't funny anymore. Get over yourselves. <br> <br>Bitterly Yours, <br>Frazzled in Fresno <br> <br>FOCUS ON THE FAMILY DECRIES GROWING USE OF DISCRETIONARY LIGATURES <br> <br>SENATOR ATTACKS FUNDING OF DISCRETIONARY LIGATURES <br> <br>VATICAN CLARIFICATION: VERSICLE AND RESPONSE SYMBOLS ARE NOT LIGATURES <br> <br>FHQWGADS TYPE FOUNDRY ANNOUNCES LIGATURE-FREE VERSIONS OF ALL TYPEFACES</p>"
