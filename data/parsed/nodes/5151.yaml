    votes: null
    html: <p>William, <br> <br><i>Maybe it is just because I have known about this, but I find the ct ligature nice, in the right setting, but the st ligature consistently annoying. To me the way it redoubles the curve in the s just doesn't look good, and seems affected, unlike the ct ligature.</i> <br> <br>You are a gentleman and a scholar, thank you. I had pointed out that the st was not entirely legitimate. That the "short s" was only used at the end of word therefore could not be followed by a "t". <br> <br><a href="http://lanstontype.com/Demijohn.html" target="_blank">http://lanstontype.com/Demijohn.html</a>  <br> <br>This specimen was pulled with a "proof planer". The type is set upon the stone, inked, a sheet of paper laid on the surface. Then a block of wood covered in felt is struck with a system of strokes by a wooden mallet. It tends to make the type bold which apparently makes some people really happy. <br> <br>I was setting a sample of the "long s". <br> <br>I like the st ligature but not in bookwork. To be honest I don't care if  the st ligature is "not historical" because I come from a progressive school of typographers that believe that "new" can be "good". Many in the forum disagree with this premise. <br> <br>In any event when printing books I choose to loose the "st ligature" but maintain the "ct ligature". Readers are accustomed to the "ct ligature" after 500 years but the "new st ligature is not so acceptable. Besides, I find the frequency rate far too high making them distracting. Also your superior instincts concluding the shape of connector in conjunction with the curve of the s makes it too stressful�for bookwork that is. <br> <br>Still, the "st ligature" is most attractive in display work. <br> <br> <br> </p>
    html_clean: <p>William, <br> <br><i>Maybe it is just because I have known about this, but I find the ct ligature nice, in the right setting, but the st ligature consistently annoying. To me the way it redoubles the curve in the s just doesn't look good, and seems affected, unlike the ct ligature.</i> <br> <br>You are a gentleman and a scholar, thank you. I had pointed out that the st was not entirely legitimate. That the "short s" was only used at the end of word therefore could not be followed by a "t". <br> <br><a href="http://lanstontype.com/Demijohn.html" target="_blank" class="link-external">http://lanstontype.com/Demijohn.html</a>  <br> <br>This specimen was pulled with a "proof planer". The type is set upon the stone, inked, a sheet of paper laid on the surface. Then a block of wood covered in felt is struck with a system of strokes by a wooden mallet. It tends to make the type bold which apparently makes some people really happy. <br> <br>I was setting a sample of the "long s". <br> <br>I like the st ligature but not in bookwork. To be honest I don't care if  the st ligature is "not historical" because I come from a progressive school of typographers that believe that "new" can be "good". Many in the forum disagree with this premise. <br> <br>In any event when printing books I choose to loose the "st ligature" but maintain the "ct ligature". Readers are accustomed to the "ct ligature" after 500 years but the "new st ligature is not so acceptable. Besides, I find the frequency rate far too high making them distracting. Also your superior instincts concluding the shape of connector in conjunction with the curve of the s makes it too stressful�for bookwork that is. <br> <br>Still, the "st ligature" is most attractive in display work. <br> <br> <br> </p>
