    html: <p>Hrant <br> <br>Bad ideas are frequent, even you can have them. <br> <br><i>The Times newspaper was set in such a scheme in the beginning, but then the printers union -realizing the savings in time, hence reduction in their incomes- decided to charge by the letter and not the sort, so the efficiency of the system became moot.</i> <br> <br>I am sure your meant to say, (so the efficiency of the system became a hoot.) <br> <br>Boy good thing that did not catch on, Linotypes, Monotypes and "Computers" would have been sold for "doorstops". <br> <br>I would challenge you over this so-called-union-problem. What is your source? The "Wizard of Ozz?" Not that I disbelieve you. Just that I would like to understand the nature of the objection myself. Unlike yourself I have "a more than considerable hot metal understanding'. I have "a working mans perspective". In other words this system is crapolla. <br> <br>There were many inventions and logotype schemes. Setting ligatures, (logotype) in hot metal "does not save time". If they did the non union shops would have welcomed them, yes? <br> <br>The more ligatures, the more memory, the more travel of the hands, arms or body. Remember, Chinese often set type using roller skates. <a href="http://lanstontype.com/ChineseWindow.html" target="_blank">http://lanstontype.com/ChineseWindow.html</a>  Maybe the British Unions did not think "roller skating was part of their job description". <br> <br>The California Job Case has spaces for ligatures, (logotypes). Believe me, they were not located in the major traffic zones. They were kept "out in the back forty". The boxes were so tiny it was hard getting your fingers into them, often the "labour hoot saving logotype ligatures" would jam themselves tight against the sides. <br> <br>Memory failure is certainly a consideration, if one did not realize at first they were setting a ligature, (logotype) they would have to think, stop, distribute the characters and then go for that obscure box containing <i>"time and labour saving logotype, if only they had known they needed one, remember where it was, and had not loaned their roller skates to the baby sitter".</i> <br> <br>So don't go all "romantic, poetic and nostalgic on me about hot metal". I can't stand to see a grown digital junky weep.  <br> <br>Get the picture. <br> <br>Tell me how many ems per hour was set with that silly scheme you have dug up. I can't wait for you to remember all those combinations and where they go. The hoot word breaks would be interesting to watch. Want to make a wager, how about a "race"? <br> <br>Anyway, that said, I am glad your are interested in this sort of thing. If I ever get to my material I would welcome a more elaborate discussion on the many different inventions. Don't take this as a criticism, it is a backhanded compliment. <br> <br>������������ <br> <br> <br>Nick <br> <br>Your calligraphy is pretty good. <br> <br>So good you have clearly illustrated why no one would ever have mistake a "c" for an "i".  <br> <br>Thank you. <br> <br></p>
