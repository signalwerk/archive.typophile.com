    html: <p><img src="http://www.typophile.com/forums/messages/30/37360.jpg" alt="fact"> <br>&gt;overwhelming evidence to the contrary <br> <br>Gerald, pay attention and stop trying to annoy me. <br>(And please excuse my rusty calligraphy.) <br> <br>1. shows the problem that can occur between c and t -- the weak ending of the top right of the c, the small gap between it and the crossbar of the t. <br> <br>2. shows why joining the top of the c with the crossbar of the t is not a good idea -- the form of the "c" is compromised (though not quite so dangerously as you would have us believe). <br> <br>3. typical form of the ligature.</p>
