    html: "<p>Wow, nice treatment - <i>definitely</i> useful - thanks. <br>So the top-last scheme in the \"c\" and \"s\" seems pretty standard. Although in the Camp method, instead of a loop to the top of the stem I guess you'd just get a continuation into the bar - which however I have never noticed happen. <br> <br>The Mercator ligation seems a bit mannered, no? It makes me think that, yes, the original motivation was chirographic facilitation, but then formal sensibilities kicked in. This, even though you're right in alluding to the fact that slanted/cursive writing is faster/less_formal. But the Psalter sample is much more sobre, and it still have ligation, albeit logically more reserved instances. <br> <br>&gt; Morison's <i>Letter Forms</i> .... more sculpted <br> <br>And to me those thin joins are awkward and distracting; sort of like the \"perfect\"-circle OS zero. <br> <br>-- <br> <br>All this makes me realize that \"discretionary\" isn't a really good term. For one thing, originally it was apparently an issue of facilitation (not caprice), plus it makes me ask: is the \"fi\" ligature in fact more important than the \"ct\" and \"st\", or is it perhaps that <i>an \"f\" with a strong beak is in fact itself \"discretionary\"?!</i> <br> <br>hhp <br></p>"
