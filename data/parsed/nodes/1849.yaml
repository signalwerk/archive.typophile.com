    html: <p> Ricardo, <br> <br>Joe is right about the @. Perhaps it doesn't work <br>because the tiny triangles are a shape that isn't <br>found anywhere else in the font. Why not keep the <br>symbol squarish to maintain consistency? <br> <br>While it's another LCD-digital-clock-calculator <br>face, I think it's one that hasn't been done <br>before. I thought the genre had been thoroughly <br>saturated, but you've managed to come up with <br>something new and appealing. Congrats. </p>
