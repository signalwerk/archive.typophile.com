    html: <p> Ricardo, <br> <br>The face has the essence of a digital clock, which makes it somewhat unique among similar faces. (I'm especially referring to the B, K and X.) <br> <br>Some of the symbols look awkward. The @  seems unnaturally forced and the greater-than and less-than don't really carry the essence of the face. <br> <br>Nice work. I like that asterisk the best... <br> <br>//joe </p>
