    html: <p> I really like the sheared corners. It adds a unique twist to all the blockish faces we've seen in the past little while. <br> <br>I have a few suggestions. <br> <br>I would revisit the BKR and X. I think that there are some other solutions to these that would push it closer to the constructivist influence and further from the lcd influence. Maybe you could try dropping in a few diagonals. I like the direction you've taken with the lc v, for example (the angle on the uc V is a little steep, I think). The S looks a little blocky. Maybe it could be a bit narrower. The shoulder on the f seems a little clunky, and could be shortened as well as the tail on the j. You could also do the same with the tails of the g and the y if you wanted to, but it isn't really necessary. The uc Q could also use a different quill. <br> <br>Good luck.  <br> <br>cr <br> <br>ps. the lc a is rad. </p>
