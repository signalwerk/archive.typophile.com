    <p>Hi All,</p>
    <p>I'm having some difficulty finding a Hebrew face that works well with Centaur. I'd like to find a Hebrew font that has some of the similar character of Centaur, but reads well. I'm using Centaur all caps letter spaced for the family name of a grave marker, but I need to add in Hebrew. Of course, I'll run the design by the family Rabbi, but since I can't read Hebrew I need a little help. I'm thinking something in the calligraphic tradition without having the traditional "Hebrew wave". I'd like it to be clean and elegant in a early 20th century romantic way, with a little "woodiness". Is that a word, "woodiness"? I mean the way that Centaur has the tree branch look.</p>
    <p>Any help or direction would be greatly appreciated!</p>
