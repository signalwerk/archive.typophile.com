    html: |-
      <p>v, - I bet you could pull the left side in a touch &amp; solve that. Not totally sure because of the scale of the rendering...</p>
      <p>y, - Maybe - or you could extend the foot slighty.</p>
      <p>z - Yes.</p>
      <p>m - m is tricky. Lighten the 1st hump &amp; maybe think about a faux serif for the right side like you have for the v or the top of the R</p>
      <p>J - You could pull it up. Or you could work on the curve &amp; let it be more gentle maybe. Maybe the top should be more bone like. Your I has that.</p>
      <p>j - I like it.</p>
      <p>M - why that kind of M? You don't have to match the 'W'. Your ARD are really nice Maybe you should think what matches them better.</p>
      <p>U - I think it's working well enough for now. I would go after biger fish for now.  </p>
      <p>Other things: </p>
      <p>- The top of Q is too low, the vertical of the b seems a little heavy, Maybe the right side of the cross bar on the f could be made heavier?, I really like the movement in the top of the b and I see it in the i too. Maybe it could find it's way into other glyphs such as the l,h,f,</p>
      <p>That C is tasty.</p>
      <p>This is really coming along!</p>
