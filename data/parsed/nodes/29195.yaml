      <p>Thanks Eben and Hrant, very helpful. I know it's been forever, since I've been working on this only during "free time" at work, but it's coming along.</p>
      <p>I widened the apertures and the decorative gaps between strokes quite a bit, because they were closing off at small sizes. I think I've evened the cap height out enough now, and I'm getting a better handle on the M / W question. I'm not sure now about the lowercase x though.</p>
      <p>More comments please! All the help is greatly appreciated.<br>
