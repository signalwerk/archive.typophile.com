      <p>Update - finally got all the caps drawn, so now it's time for tweaks.</p>
      <p>I wholly agree, Eben, and the E is now more roundy and bottom-heavy, t is a bit beefier, A is a little more grounded etc.</p>
      <p>Thanks a million by the way, poms; everybody likes some applause now and then.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/scripty2_4072.png"></div><p></p>
      <p>My first instincts: v, y, and z are a touch too light; m and J are too heavy and J is riding low; M's left leg is off-balance, and U is too square, especially on the right of the bowl. Any other spots jump out at you that could use some spit and polish?</p>
