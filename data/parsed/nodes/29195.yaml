    <p>This is something I've been working on in my off-time at work. The idea was sort of a mesh between sans-serif and script, taking cues from calligraphy but keeping it pretty subdued.</p>
    <p>Unfortunately, as I was laying out the beziers, I kept getting that "I've seen this shape before" feeling. Is there already something exactly like this out there, that I've been subconsciously stealing? Or in other words, is this face even worth continuing?</p>
    <p>Here's the progress so far. No spacing yet; it's all in Illustrator. And I know something has to happen to the N, I haven't been able to nail it down yet. Comments and questions please!</p>
