    <p>Hello everyone, I need font suggestions for a logo :</p>
    <p>I'm looking for something simple but chic. I need the letters like As and Vs to be pointy not rounded if that makes sense.<br>
    I want something feminine and soft but not too much "decoration", really sober. Its for a clothing line so it can have a little bit of a fashion reference but Im trying to go away from Didot and such. </p>
    <p>Thank you!</p>
    <p>Please excuse my english I'm french.</p>
