    html: |-
      <p>How many ligatures do you want to incorporate? You won't probably able to compose stylistic ligatures (as in the given example of BismiLlah) from simple glyphs. </p>
      <p>Any way the summary of the approach is to compose your ligatures in some font editing tool (e.g. FontLab). Then edit the font and add some OpenType rules through MS VOLT.</p>
