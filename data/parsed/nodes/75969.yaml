    <p>Hi,</p>
    <p>I'm working on an article that will bring people up to speed on the latest advancements in web fonts. Anyone have any suggestions for show-case sites, and/or trends in web font usage. In particular I'm interested in how web apps are using the technology.</p>
    <p>Cheers, Si</p>
