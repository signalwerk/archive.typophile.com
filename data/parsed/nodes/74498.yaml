    <p>Hello everyone,<br>
    I've been working on a font for a while and I want to take it into a development program to become functional.<br>
    However, I want the shapes to be as refined as possible before offering it to the world.</p>
    <p>Please be critical, I am taking all comments into consideration.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/satellite_5925.jpg"></div><p></p>
    <p>If you'd like a closer view of a letter or letters please ask and I can attach additional files for critiquing.</p>
    <p>Thank you</p>
