    html: |-
      <p>Great start, Matt!</p>
      <p>A few things at first glance:<br>
      Lower bowl of /B/ could be wider.<br>
      /K/ is off balance<br>
      /R/ is too narrow<br>
      /S/ and /s/ look upsidedown<br>
      /W/ is a little wide<br>
      descenders on /p/, /q/ and /y/ are too long</p>
      <p>I myself have recently started drawing type in <a class="freelinking external" href="http://www.fontlab.com/" rel="nofollow">FontLab</a>, a really great tool, I can recommend it. Consider this software before 'finishing' the design in some other programme, after which you'll have to import all glyphs into FontLab (or similar software) anyway.</p>
      <p>Keep going!</p>
