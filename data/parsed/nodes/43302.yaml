      <p>I got that same error message when I tried to substantially change the kerning in an existing Adobe font -- both class &amp; exceptions. FL didn't complain when the *features* were compiled (and yes, I made the changes in the features file, not the metrics window), but did when I tried to generate the .otf.</p>
      <p>I never solved it; I assumed I'd just done something to throw it into a loop.</p>
      <p>You might try renaming the alternate characters</p>
      <p>zero.alt<br>
      one.alt<br>
      two.alt<br>
      three.alt<br>
      . . .<br>
      nine.alt</p>
      <p>Then use your stylistic set feature with the replacement names suitably changed. It shouldn't help, but would be easy to do.</p>
      <p>I guess I'd also go back &amp; make sure the regular numbers were all OK. Then if it still didn't work, give it to FontLab &amp; see if they'll debug it.</p>
      <p>One thing worth trying if you go at it yourself is to limit things. Start a *new* font, and put in it only the regular numbers &amp; the alternative numbers. See if it will compile. The add the ss01 feature &amp; try again. If that works, there is something else in you *old* font getting in the way.</p>
