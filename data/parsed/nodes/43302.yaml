      <p>Gee whiz, I never thought I would be famous in Bulgaria... :-)</p>
      <p>Anyway, I'm still stumped. </p>
      <p>It seems odd that the error is only triggered when you add the lines for eight or nine. If it were a problem with missing glyphs or glyph names, the error would be different ("missing glyph" error). If it were a problem with Cyrillic characters creeping in, again it would be a different error ("invalid character" error). Instead, you just get this maddenly vague error ("there's a problem") which offers no clues. </p>
      <p>Have you tried contacting FontLab support? They may be willing to look at the font and tell you what's wrong.</p>
