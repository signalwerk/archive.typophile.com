      <p>Ivan,</p>
      <p>Just for the hell of it, I made up a little test font. It had only a space character and the numbers 0-9 (from some Stencil font). I added the numbers 0-9 from Sistina, named them *zero.ss01* etc., &amp; no Unicode index. Wrote a feature -- wrote it out longhand just like you did -- compiled the features &amp; made a font. Everything worked fine.</p>
      <p>Opened up ID-CS2, set the numbers twice, applied the stylistic set to the second row of numbers -- they changed. It even printed out.</p>
      <p>I'd say that whatever is going wrong for you isn't specifically your feature, but some inadvertent conflict with something else.</p>
      <p>Sorry I'm no help, &amp; good luck</p>
