    <p>Re-posting so I really hope on some insights. The problem that occurs is that I named the alternate numbers as follows:</p>
    <p>one.ss01<br>
    two.ss01<br>
    three.ss01</p>
    <p>and so on</p>
    <p>the ss01 feature looks like this:</p>
    <p>feature ss01{<br>
    sub one by one.ss01;<br>
    sub two by two.ss01;<br>
    sub three by three.ss01;<br>
    sub four by four.ss01;<br>
    sub five by five.ss01;<br>
    sub six by six.ss01;<br>
    sub seven by seven.ss01;<br>
    sub eight by eight.ss01;<br>
    sub nine by nine.ss01;<br>
    } ss01;</p>
    <p>But I keep on getting this message:</p>
    <p>ERROR: There was a problem while compiling OpenType font. Final .otf font is not saved. Please, check OpenType features definition for errors</p>
    <p>What’s wrong?</p>
