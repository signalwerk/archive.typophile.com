    <p><strong> <a href="/wiki/Indicies" class="freelinking" rel="nofollow">Indicies</a> : <a href="/wiki/Conferences" class="freelinking" rel="nofollow">Conferences</a> : Tag der Schrift</strong></p>
    <p>»Tag der Schrift« <em>(Day for Writing/Type/etc.)</em> is an annual one-day conference organized by the Swiss media union <a href="/wiki/comedia" class="freelinking" rel="nofollow">comedia</a> and the the School of Design in Zurich. </p>
    <p><strong>The 2005 Conference</strong><br>
    In 2005, the conference was held on June 18. It included lectures by <a href="/wiki/Gerard%20Unger" class="freelinking" rel="nofollow">Gerard Unger</a>, André Baldinger (Paris), Wang Chao Ying (China) and Volker Heim.</p>
    <p>More information: <a href="http://www.typo-online.ch/tds/2005/" rel="nofollow">http://www.typo-online.ch/tds/2005/</a><br>
    A report by <a href="/wiki/Peter%20Reichard" class="freelinking" rel="nofollow">Peter Reichard</a>, with images, can be found on <a href="/wiki/TypeOff" class="freelinking" rel="nofollow">TypeOff</a> at <a href="http://www.typeoff.de/?p=30" rel="nofollow">http://www.typeoff.de/?p=30</a></p>
    <p><strong>The 2006 Conference</strong><br>
    Plans for the 2006 Conference have not yet been announced.</p>
