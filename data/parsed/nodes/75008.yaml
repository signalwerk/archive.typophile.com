  date_raw: 7 Oct 2010 — 8:51pm
  votes: null
  html: |-
    <p>&amp; (the ampersand) is a ligature for 'et', latin for 'and'. Although archaic you can use '&amp;c' the same as 'etc' as a shortened 'Et cetera'. &amp; (the ampersand) being a ligature for 'et', I am curious to whether there are any historical examples of ligatures being designed for 'etc'.</p>
    <p>I created an example of what a ligature for 'etc' could look like: <a href="http://bit.ly/cKOH8v" title="http://bit.ly/cKOH8v">http://bit.ly/cKOH8v</a></p>
    <p>Does anyone know of any actual historical examples?</p>
