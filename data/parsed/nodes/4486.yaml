    html: "<p>(Caveat: there is no \"Proof\" of the following. Its only merit is making sense.) <br> <br>The monocular form is too modular with respect to the rest of the alphabet. It is very legible, but does not contribute much divergence to boumas. The conventional, closed binocular form is richly divergent, but it's way too complex - it violates the \"rules of belonging\" of the Latin alpahabet too strongly. Topologically only the \"B\" (which is way less frequent, and bowl-adjacent) is equal to it, and then there's the ear on top of that! Giving it an open bottom -especially with a diagonal join that swells- ties it nicely into shapes like the \"s\", while reducing \"alien\" complexity. The best example of this form is B&amp;R#2/Oxford/Monticello; another good example is Patria. <br> <br>That said, there might very well be other structures that nobody's even thought of yet (or at least that haven't been promulgated adequately) that are even better than the open binocular. I just haven't been able to think of any do far. <br> <br>hhp</p>"
