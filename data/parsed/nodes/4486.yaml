      <p>People can get used to anything. But that doesn't mean it doesn't affect them. I'm used to the traditional closed-bottom binocular "g" myself, and didn't realize there was anything wrong with it until I started seriously thinking about the Latin alphabet. But just look at it. It's almost an oriental logograph. Formally, I would point out that its topology is way more complex than any other lc letter; and in the entire alphanumerics only the "B" matches it, and at least the "B" has the two counters abutting - the "g" has a link on top of everything. Anecdotally, I would point out that this "unnatural" complexity is what makes it so hard to draw well, with many competent designers failing when they come to it (eg Matrix). It's especially hard to get a double-"g" not to form too strong a pattern that ruins the texture (affecting immersive reading). So it's not a legibility issue (almost anything is legible) it's an issue of standing out too much, and by itself. Don't get me wrong, I think complexity is da bomb - but it has to be balanced - and I feel that the open-bottom binocular form is the ideal (general) balance.</p>
      <p>hhp</p>
