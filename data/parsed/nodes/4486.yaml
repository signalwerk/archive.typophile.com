    html: <p>Overall, I think an important issue is whether you want this to be a text type. If you do see how the curves and spurs and relative widths are affected by being 12 pt and below. I think if you put readability at small sizes as your goal, it will help decide what direction you want to go with it, and get one font design.  <br> <br>On the other hand if you go for a maybe different or related display type, you will be more free to be expressive and innovative. <br> <br>Generally your letters are really beautiful, but it is said that a text type is 'not a collection of beautiful letters but a beautiful collection of letters' (Walter Tracy?) So if you go in the text direction, the main issue will be making everything fit and read well. I'm sure you will keep them elegant.  <br> <br>On the question of the original sharp terminal on the a, you might compare Kent Lew's Whitman, at FontBureau and his own site kentlew.com. I don't like the sharp a terminal on Perpetua, but Kent Lew made it work beautifully on his Whitman. It is sheared off rather than totally pointed though and the c s and r are also sharp in different ways. <br> <br>Your original had this kind of race car look and excitement about it, which would be a pity to lose at least for a display type... <br> <br> <br> </p>
