  - id: 32992
    user: 1551
    date: 2004-07-08T10:53:00
    date_raw: 8 Jul 2004 — 10:53am
    votes: null
    html: <p>I am just now doing my first face, a text face, and you are now at a point where the mysteries - to me - of spacing, relative widths, and thick thin contract become very important. One thing I have found is that the thickness of the horizontal part of round letters is very important, and that the thins get visually get thinner faster than the fats as you print out in text size. Thus for text faces the horzontals in my opinion shouldn't be too thin.  <br> <br>I would try reducing the contrast, and see how it looks in text sizes.  <br> <br>Also, I think the spacing needs work. It looks tight to me, but this might just be some letters. Also to me 9 point and 12 point are different animals. I believe that at 8 point the Adobe opticals 'caption size' generally are wider, looser and bolder.  <br> <br>The subtlety of the soft curves you have drawn get lost in small sizes, but this isn't necessarily a disaster, as people will see them more clearly in titles.  <br> <br>Also, I would say with the problems you say you are having with the sharp version, to try also reducing the contrast. This will mean changing the look of the terminals, but you might find a good solution.  <br> <br>One more issue that I don't understand is whether you have to do hinting first to get a decent read on the print out at 1200 dpi on a laser printer. Are you PDF's hinted? Are PDFs in general hinted?   <br> <br>Oh also the italic is great.   </p>
