    html: <p>I agree with Hrant that the binocular g is the most out-of-place character in the alphabet, but I don't buy the binocular g with open loop being necessarily better.  <br> <br>Among classic faces, Baskerville has it, but the loop is nearly closed. The slightly open loop - as in your face above also - I think is fine, but I find when faces try to open it more, it most often looks awkward. For example, the open binocular g I think mars Meta, which is otherwise great. I notice that in Unit, Spiekerman has the closed loop. <br> <br>I also do agree with Hrant that it is a letter where there is scope for new ideas. I just don't usually find the binocular loop opened a lot works well. The monocular g you have been experimenting with here is very interesting, for example, though I think it is not fully solved yet.   <br> <br>By the way, Kabel is one of the few that has a really different g that works well.</p>
