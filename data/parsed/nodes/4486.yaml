    html: "<p>Hi Kris, <br> <br>This is beautiful. <br>Here are some thoughts on your recent pdf. <br> <br>Caps: <br>U: Seems out of character IMHO. Yes with the sharp version, no with this version <br>R: The leg may want to extend a bit farther below the baseline. Right now it's looking raised off. <br>X: Consider moving the lower whole left leg a bit to the left. It will better balance, and optically allign them. <br>C: A little narrow? <br>f: Not sure about the bracketing on the bottom left of the crossbar. <br> <br>There are a few places where the flowing bracketing (which I like) seems dark to me:  <br>The join in the T, <br>The inside of the E and F (more like the B,P) <br> <br>Like the italic very much! Only thought there is to make sure the dots on the i and j are fare enough from the accute accent. <br> <br>Congratulations. This is nice! <br> <br>Randy</p>"
