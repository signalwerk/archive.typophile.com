    html: <p>&gt;sounds like a lot to start with <br> <br>At the 'Making Faces' seminar a few weeks ago in New York, when someone asked about the proliferation of styles and weights in type face families, David Berlow of the Font Bureau said "You know, we didn't start this." In other words, the demand came from clients.  <br> <br>I really think that having a variety of weights and styles, as well as optical variations, as Adobe has done, gives a face an edge over others for designers, as it becomes so adaptable to different challenges. So I think the variety you talk about is a good idea. <br> <br>Also by all means complete and include your display version, which you have already. Having this for subtitles to titles and even 'poster' is great, and gives you an edge, particularly because the display is so good.  <br> <br>As to what to do first, and how to market it, I think this is something that a font publisher can tell you best, because they know the market. Maybe the best thing is to approach them with what you've got, and see what they suggest. <br> <br>I agree with Aaron about the top of the g being slightly too heavy, but not about the k. When I printed it out (1200 dpi laser printer), the gap actually closed in the text size, and in any case it harmonizes with your other opened letters, bpq.</p>
    html_clean: <p>&gt;sounds like a lot to start with <br> <br>At the 'Making Faces' seminar a few weeks ago in New York, when someone asked about the proliferation of styles and weights in type face families, David Berlow of the Font Bureau said "You know, we didn't start this." In other words, the demand came from clients.  <br> <br>I really think that having a variety of weights and styles, as well as optical variations, as Adobe has done, gives a face an edge over others for designers, as it becomes so adaptable to different challenges. So I think the variety you talk about is a good idea. <br> <br>Also by all means complete and include your display version, which you have already. Having this for subtitles to titles and even 'poster' is great, and gives you an edge, particularly because the display is so good.  <br> <br>As to what to do first, and how to market it, I think this is something that a font publisher can tell you best, because they know the market. Maybe the best thing is to approach them with what you've got, and see what they suggest. <br> <br>I agree with Aaron about the top of the g being slightly too heavy, but not about the k. When I printed it out (1200 dpi laser printer), the gap actually closed in the text size, and in any case it harmonizes with your other opened letters, bpq.</p>
