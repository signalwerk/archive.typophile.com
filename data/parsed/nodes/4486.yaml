    html: "<p>&gt;a bit rude  <br> <br>No, of course not. But the reason for not more commentary is probably that it is not very clear where you want go with this.  <br> <br>I went last week for the first time to a type event, the 'Making Faces' seminar in New York. The two from House Industries, Font Bureau's David Berlow, Matthew Carter, and Hoefler &amp; Frere-Jones.  <br> <br>What I was really struck by in these folks who are producing and selling a lot of fonts is that the 'brief' for the font was critical. In the case of House Industries, it was more aesthetic: they wanted to take lettering they admired, and make functional type from it. For the others, it was producing fonts for specific purposes within a publication.  <br> <br>You have a lot of good ideas here and elsewhere, and a gift for elegant shapes, but I think you may be helped by a more clear brief for these fonts - either your own, or some one else's. For example, with your 'Eliza', you had a clear brief, and just produced the thing.  <br> <br>The scientist Michael Faraday kept a slip of paper in his top desk drawer. It said 'work, finish, publish.' I wish I always took this advice, but I think it's good. You will have chances to revisit old ideas once you do them for one purpose.</p>"
