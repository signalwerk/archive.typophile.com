    html: <p>Hoefler Type Foundry's <a href="http://www.typography.com/catalog/saracen/" target="_blank">"Saracen"</a> is a digital Latin headline font. <br> <br>I will look into Jaspert's "Encyclopaedia of Type Faces" to see what is shown about 50's-era Latins, and get back.</p>
