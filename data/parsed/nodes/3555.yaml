    date_raw: 12 Mar 2004 — 6:44am
    votes: null
    html: <p>Other than Monotype's Latin Antiques and Latin Condensed; and Blake's Latin Wide, all I found in the Jaspert book was Chisel, an inline version of Latin Bold. Judging from that sample, Latin wasn't a very popular style. <br> <br>I also found a display Latin metal type called "Primus" in the A.T.A. Type Comparison Book, but it is like a wide Black or Ultra weight. (Not the same as Berthold Primus type from 1964). <br> <br>Not much help in those places. Sorry. <br> <br>You can try typing 'Latin' at MyFonts and see what they show as current choices. <br> <br></p>
