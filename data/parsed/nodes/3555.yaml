  html: <p>I'm trying to identify the black serif type in a poster designed by Herbert Leupin in 1955.  <br>It appears he made a collage using a real newspaper from that year.  <br> <br><img src="http://www.typophile.com/forums/messages/83/28386.jpg" alt="trib"> <br> <br>The newspaper "Tribune de Lausanne" ceased publication in the early eighties.  <br>I have found no information as to when the TdL was first printed, as a clue to when  <br>the masthead was designed. <br>Any suggestions about Latin typefaces used in Europe before 1950, as well as  <br>any leads on digital Latins which approximate this face would be appreciated. <br>Thank you.</p>
  html_clean: <p>I'm trying to identify the black serif type in a poster designed by Herbert Leupin in 1955.  <br>It appears he made a collage using a real newspaper from that year.  <br> <br><img src="http://www.typophile.com/forums/messages/83/28386.jpg" alt="trib"> <br> <br>The newspaper "Tribune de Lausanne" ceased publication in the early eighties.  <br>I have found no information as to when the TdL was first printed, as a clue to when  <br>the masthead was designed. <br>Any suggestions about Latin typefaces used in Europe before 1950, as well as  <br>any leads on digital Latins which approximate this face would be appreciated. <br>Thank you.</p>
