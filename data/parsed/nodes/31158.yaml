    html: <p>Why not let two connectors narrow at the center of the x in the manner of the top of your b - for instance the lower right &amp; upper left ones? Same thing for the join at the base of the v. It looks bloated so a slice out will make it better I think. Why not the right side? The l looks too narrow to me. Maybe it's just this rendering. To solve for the s - look around. This is not an uncommon kind of 1st font. One way to begin might be rounding those corners.</p>
