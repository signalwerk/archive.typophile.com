    <p>Hi!<br>
    I am very new to designing typefaces. This is my first attempt. So please spare a couple of minutes to tell me how I can improve it and carry it forward. I was wondering if the letters 'v' and 'x' looked like they belonged to the family. Similarly I am not happy with the 's'. But please give me your views on it. Thank you!</p>
    <p>Vinu Chaitanya<br>
    Graphic Design student<br>
    India</p>
