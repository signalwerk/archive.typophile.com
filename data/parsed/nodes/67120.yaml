    <p>Does anyone know of a book in existence which documents type foundries' pinmarks? I thought I saw one once, but might very well be remembering a book on printer's marks or union bugs.</p>
    <p>BriarPress.org used to have a section devoted to pinmarks which was great, but it's been down since their redesign (<a href="http://www.briarpress.org/15798" title="http://www.briarpress.org/15798">http://www.briarpress.org/15798</a>).</p>
    <p>I'm also aware of the pinmark Flickr pool, but that still isn't very heavily populated.</p>
