  html: '<p>Font Production Workshop and Type Critiques Added to TypeCon2002 Schedule. <br> <br>BUFFALO, NY, APRIL 26, 2002 - The Society of Typographic Aficionados (SOTA) has announced additional special programming available at TypeCon2002. To be held in Toronto, Ontario, Canada, July 12-14, the fourth annual event is presented by SOTA and The Type Club of Toronto. <br> <br>Digital Font Production 101 is aimed at beginning type designers looking to develop or refine their technical skills. This hands-on workshop covers such topics as the basics of letter fitting and kerning, and hinting and building fonts using Fontographer. Q&amp;A and one-on-one assistance are included in this session. This workshop is intended as an overview for the beginner in the correct methods of preparing fonts for potential distribution - it is not geared toward experienced font designers. <br> <br>Hosted by Bitstream, this workshop will be held on Friday, July 12. This session is limited to eight participants, with space available on a first-come, first-served basis. Attendees must be registered for TypeCon2002 to participate in this event. The cost for DFP101 is $100USD/$160CAD. Lunch will be provided. <br> <br>Back by popular demand, Matthew Carter and John Downer will be available for individual type critique sessions during TypeCon2002. Critiques are limited to a single typeface/family per person, and are available to registered TypeCon2002 attendees on a first-come, first-served basis. Sign-up sheets will be posted beginning Friday, July 12. There is no additional charge to participate in these sessions. <br> <br>As a reminder: the early-bird discount on conference registration is available until May 1, 2002. Current pricing for students is $60USD/$95CAD and $100USD/$160CAD for professionals. During regular registration (May 2 through July 1), prices will increase to $75USD/$120CAD for students and $125USD/$200CAD for professionals. <br> <br>TypeCon2002 will take place at the Courtyard by Marriott in downtown Toronto. Discounted hotel room rates are available to conference attendees. Please visit the conference website for details. <br> <br>TypeCon2002 is the annual event of the not-for-profit Society of Typographic Aficionados, an international organization dedicated to the promotion, study, and support of typography and related arts. Secure conference registration and further information is available at <a href="http://www.typecon2002.com" target="_top">http://www.typecon2002.com</a>, or by email at mailto:<a href="mailto:info@typecon2002.com">info@typecon2002.com</a>. For more information about SOTA, please visit the website at <a href="http://www.typesociety.org" target="_top">http://www.typesociety.org</a>, or email mailto:<a href="mailto:info@typesociety.org">info@typesociety.org</a>.</p>'
