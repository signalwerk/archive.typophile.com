    <p>FOR IMMEDIATE RELEASE</p>
    <p>Stevens Point, Wis. (July 8, 2008) -- Independent digital type designer Tim Rolands has released a new cross-platform OpenType font called Prospero Pro to mark the tenth anniversary of his first public font release. </p>
    <p>The first publicly released font from Tim Rolands came just over ten years ago – a Nicolas Jenson-inspired oldstyle Roman called Prospero and distributed as shareware. Prospero Pro, a brand new OpenType remake of that early font includes completely redrawn letterforms that capture the character and spirit of the original while incorporating many improvements born of experience. </p>
    <p>"The outlines are cleaner, scale better and have a much more even color," says Rolands, "and the glyph set now includes numerous extended ligatures, alternate forms, swash forms and support for a wider range of languages."</p>
    <p>Prospero Pro is intended primarily for book and magazine work and would be a worthy choice for display work such as posters, advertising, branding, identity systems, and more.</p>
    <p>For a limited time, Prospero Pro is available from MyFonts.com for US$36.75, a savings of 25% off the regular price of US$49. Visit <a class="freelinking external" href="http://www.myfonts.com/fonts/timrolands/prospero-pro/" rel="nofollow">http://www.myfonts.com/fonts/timrolands/prospero-pro/</a> for details.</p>
    <p>OpenType, a font technology jointly developed by Microsoft and Adobe, eliminates the need for multiple files in multiple formats, combining everything into a single cross-platform font file that supports large character sets and advanced typographic features. Visit <a class="freelinking external" href="http://www.adobe.com/type/opentype" rel="nofollow">http://www.adobe.com/type/opentype</a> for more information.</p>
    <p>Long-time designer and type enthusiast Tim Rolands has released fonts exclusively through MyFonts.com since 2001. Current releases include the popular text font Envoy as well as Odyssey, Orlando, Miranda and the distinctive Anvil and Valor. Visit <a class="freelinking external" href="http://www.timrolands.com" rel="nofollow">http://www.timrolands.com</a> for more information.</p>
    <p>All trademarks are the properties of their respective owners.</p>
