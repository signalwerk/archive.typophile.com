    html: |-
      <p>If you could do a screen shot showing the unfilled outline, including the on- and off-curve nodes, we could give some more helpful advice.</p>
      <p>It looks as if perhaps you have an on-curve point whose corresponding BCP is collapsed right onto the point, causing what you want to be a smooth curve to exhibit a bit of a "kink." But without seeing the point structure it is hard to be sure. There are many ways to mess up a curve, unfortunately!  :)</p>
