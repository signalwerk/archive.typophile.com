      <p>Check Linotype's site. There is no mention of the derivation of Helvetica from AG, which was shown in the Helvetica documentary (so I've heard -- I haven't seen the film). So by adapting AG, and not acknowledging it, that's plagiarization.</p>
      <p>Helvetica is a revival, but Max Miedinger's bio at Linotype mentions that he was "commissioned to design a new sans serif typeface". You state that his refinement of AG is a "consistent new design idea". Sorry, but I don't think a makeover or restyling is really the same thing as a new design idea! </p>
      <p><em>How are their </em>[my revivals]<em> relations to past type faces different from Helvetica?</em></p>
      <p>Because I 'fess up.<br>
      Stated on my website, in PDF specimens -<br>
      Worldwide: "A revival in the Century genre"<br>
      Goodchild/Nicholas; "Jenson revival"<br>
      Bodoni Egyptian: not really a revival, but the derivation stated in the name.<br>
