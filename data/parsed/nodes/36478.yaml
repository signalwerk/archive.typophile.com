      <p>Uli, you will note also that nobody except you uses the word 'forgery' for improper copying of type designs. That is because,as Nick pointed out, the term is almost always used in the context of a criminal act of fraudulently creating a fake--painting, signature, etc.--to pass off as genuine.  </p>
      <p>The question of whether one design is too close to another--like whether one tune is too close to another--has a gray area, where it is often difficult to determine. The existence of a large gray area may be why there is no one really good term for improper copying vs appropriate influence. </p>
      <p>Here on Typophile you have been treating the issue of inappropriate copying as a completely black-and-white issue, which to me, and it seems a lot of others, indicates that you fundamentally misunderstand it. </p>
      <p>The history of type is full of copying of all sorts, so if you want to get it right you need to be clear that some is clearly OK, some is clearly not, and there is a lot where it is difficult to say.</p>
