      <p><cite>When taking in account the more ‘extreme’ glyphs Renner proposed for a, g, etcetera, I think his aim was more for a modern look than a classic.</cite></p>
      <p>I have the impression it is just the opposite. The alternative versions of a and g aimed at following the traditional models for romans and only when he realised these were not possible to "construct" in a convincing manner he chose the single storey a and the open g - which are much more radical in my eyes!</p>
      <p>However, how letter shapes are perceived is subjective and changes over time. I remember when we were talking about the atmoshphere of typefaces everyone called Helvetica conservative, classic or "retro". Then Gerard Unger, our teacher, reminded us that some 40 years ago almost everyone felt the opposite! Maybe the same goes for the a and g in Futura?</p>
