      <p>Mr. Berkson:</p>
      <p><cite>“Forge. 1. a. make (money etc.) in fraudulent imitation."</cite></p>
      <p>My own definition differs only slightly from the above definition. I would define: "to forge fonts = to copy fonts with intent to deceive". I prefer the notion of deception to the notion of fraud, because a font forgery and a deception AS SUCH (Latin: per se) is not (or not yet) a fraud. However, it may easily happen that the crime of fraud is committed in this connection.</p>
      <p>Example: During the years 2003 through late 2004 (until Bruno Steinert read my document forgers.pdf), Linotype offered the font forgery "Basic Commercial" at its website with the false statement that this font was designed by Morris Fuller Benton. For those non-dimwitted non-font-buyers who know that Linotype is telling lies at its website, no fraud could happen, but for those dimwitted font buyers, who bought this font forgery believing in the above false statement, the legal situation was different.</p>
