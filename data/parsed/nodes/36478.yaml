      <p><cite>The history of websites about the history of types is the history of forgeries</cite></p>
      <p>There is a grain of truth is your ironical statement:</p>
      <p>Herminio Javier Fernández, a professor of design at the university of Valencia, who wrote the above-mentioned "cuatrotipos" article, made a mistake by not digging deep enough:</p>
      <p>On comparing "Century Expanded" (1900) and "Amts-Antiqua" (1909), Prof. Fernández came to the correct conclusion:</p>
      <p><cite>"... pero la realidad está ahí: Century y Amts Antiqua eran al 99% iguales"<br>
      ("but the reality is: Century and Amts-Antiqua are 99% per cent identical")</cite>.</p>
      <p>But thereafter, due the fact that "Century Expanded" is older by 9 years, Prof. Fernández came to the logical, but in fact incorrect conclusion that "Century Expanded" is the "original" font.</p>
      <p>Recently, my sister gave me as a gift a very old book on Latin Synonymics, which was published in 1840 in Leipzig. While leafing through this old book printed on deckle-edge paper, it suddenly struck me, and after systematic checking of all roman and italic letters, I was convinced that this 1840 book was typeset using a foundry type, which was (using the words of Prof. Fernández) <cite>"99% per cent identical"</cite> with "Century Expanded" (attributed to Benton) alias "Amts-Antiqua" (attributed to Hoffmeister and later renamed by Stempel to "Madison") alias "Century 725" (Bitstream forgery) alias "Madame" (Scangraphic forgery) alias "Valencia" (Brendel forgery), etc. etc. etc.</p>
      <p>After checking the birth dates</p>
      <p>- Linn Boyd Benton, born 1844<br>
      - Morris Fuller Benton, born 1872<br>
      - Heinrich Hoffmeister, born 1857</p>
      <p>is was evident that none of these persons could have made a foundry type which was used in 1840 for typesetting the old book mentioned above. Therefore "Century Expanded" and "Amts-Antiqua" are forgeries too. Before the year 1840 (terminus ante quem), an anonymous punch cutter made regular, italic and bold cuts of a hand-composition typeface, which decades later was cloned by Benton and Hoffmeister.</p>
      <p>A major obstacle in discovering "who forged what?" is wrong information supplied by font forging outfits. For instance, the old Stempel font books do not disclose that "Amts-Antiqua" is a non-original font. And modern font books, e.g. the Font Books published by Font Shop, also conceal this fact.</p>
      <p>In the 1998 Font Book, at least the name "Hoffmeister" was mentioned in connection with "Madison":</p>
      <p><a href="http://www.sanskritweb.net/temporary/fontbook1998.gif" title="http://www.sanskritweb.net/temporary/fontbook1998.gif">http://www.sanskritweb.net/temporary/fontbook1998.gif</a></p>
      <p>But in the 2006 Font Book, Stephen Coles, responsible for "cross references", removed the font "Madison" and replaced it by the Scangraphic forgery "Madame" and removed the reference to "Hoffmeister" so that dim-witted font buyers are at a loss to recognize that "Madame" is a forgery:</p>
      <p><a href="http://www.sanskritweb.net/temporary/fontbook2006.gif" title="http://www.sanskritweb.net/temporary/fontbook2006.gif">http://www.sanskritweb.net/temporary/fontbook2006.gif</a></p>
      <p>Of course, Font Shop desiring to make money by selling such forgeries has to conceal such information, or else even dim-wits would begin to think twice before they would buy a font labeled as a forgery in the Font Book.</p>
