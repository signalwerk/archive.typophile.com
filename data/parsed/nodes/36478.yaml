      <p>Uli, it's not about "Americans" -- the salient point is that Typophile is in English, and most people post in English, including you and I, neither of whom are Americans. (Admitted, I do spell plagiarize with a "z" not an "s", a deviation from my British roots.)</p>
      <p>Although "plagiarism" is less used here than "knock-off," it's slightly less inflamatory, which is why I prefer it.<br>
      The use of knockoff and ripoff imply intent, but the lack of acknowledgment inherent in the meaning of "plagiarism" may also apply to the plagiarizer, who may simply be unaware of originality problems, and thinks the degree of derivation is acceptable.</p>
      <p>For instance, there is a big difference between tracing over someone else's design, and creating a design from nothing which ends up looking a bit like someone else's. But this subtle distinction, which is very important to type design, is not captured in any word, or phrase, even "unintentional plagiarism". What we need to be aware of, as type design professionals, is that even with the best intentions, one of our designs may resemble a recent and well-known effort of someone else's, and that is not acceptable unless the  face in question is an old classic such as Century.</p>
