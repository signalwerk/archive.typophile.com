      <p>Hello Uli:</p>
      <p>I see that the conversation has derived in an interesting terminological discussion.</p>
      <p>I don't want to interrupt it. But I just wanted to make three precisions, since my post in Cuatrotipos.com was the one that triggered this release:</p>
      <p>1) My English is not very fluid,(as you can read :-)),  but I understand that when you say “discussing forgeries and drawing heavily from my own site.” You are giving to understand, that I take control of your knowledge to do it mine.</p>
      <p>Nevertheless, in my post I recognize clearly your contribution, I mention your complete name and I link your Web two times. And not secretly, but in a quite extensive paragraph:</p>
      <p>“Ulrich Stiehl, maintains an controversial page Web, almost everything written in German, but that accumulates an abundant documentation on the industry of the fraud in the typography, mainly of these omnipresent collections of CDs with thousands of typographies with ridiculous prices. Also he gathers some recent issues like the one of the company of transport UPS that created UPS Sans like corporative typography in 2006, to save itself to pay the license by the massive use of FF Dax, designed in 1995 by Hans Reichel.”</p>
      <p>And I finished the articles mentioning two “preferential sources” in order to the readers link for further own investigation. The first, obviously, it is your web.</p>
      <p>Cuatrotipos is a little blog on journalistic design, in which we tried to discover to the friends interesting anecdotes and resources on design. I like to write clearly from where my information come direct or indirectly. Really I didn't do the post for “adapting to me” your work, but to present it to the Spanish-speaking readers, and I tried to leave it at any moment well clear.</p>
      <p>In that post I "draw heavily" in several web pages, and of course, I "link heavily" to the originals. As a journalist I understand that the value of my affirmations is in the value of my sources.</p>
      <p>2) It seems that you have understood that there was also an intentional appropiation of your “slogan". I have put your name alongside to him, and I link to your web by third time in the post.</p>
      <p>(The title of the post does not have that meaning: Is "From Century to Valencia: a little tale about typographic fraud” Because we use the same word "Historia" in Spanish for History and Story or Tale)</p>
      <p>3) As the title of post says, my only intention is to write the anecdote of how the city where I live, Valencia, has a typeface with its name. But unfortunately it isn't original, and it had not any reference to the town: in fact it is the changed name that Brendel emploied for avoiding to pay the license for a type that belonged legally to Stempel (and whose name Stempel had previously changed three times before, but the reference to its original author,Hoffmeister, was not lost with it).<br>
      After that, to find the similarities between Amts Antiqua and Century is not complicated, although at no moment I describe it as “forgery”, but as “excess of fervor in the inspiration”.</p>
      <p>I do not have as much typographic knowledge like the other members of this discussion.<br>
      I am just newspaper designer and professor of newspaper design. So I had not any reference about tha Linn Boyd Benton's Century (whose first version starts in 1894), were a copy of another previous typography. Obviously, it's not an isolated creation: it is a evolution of the modern Romans and with clear references to the Scotch Types of 1830s, but its x-height and his little modulation, are understood generally (between the non expert ones like me), as original contributions for legibility that created a trend.</p>
      <p>I suppose that I would have to create a new conversation on the matter, but I would like to see examples of those types of 1840 with as much similarity (99%!) with Century, tha deserve to be described as a "copy" . It is the first news that I have about that and it seems to me a very interesting reference.</p>
