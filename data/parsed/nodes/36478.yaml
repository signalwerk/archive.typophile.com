      <p>On account of its great importance for the history of typefaces, I think that it is imperative that the discussion about Helvetica should be raised to a more scholarly level. A "summary judgment" in the form of "<strong>The</strong> Helvetica is a "plagiarism" of <strong>the</strong> Akzidenz Grotesk" is unscholarly.</p>
      <p>I have many old and oldest printed samples of numerous foundry type cuts of Akzidenz Grotesk, some of which are downloadable here</p>
      <p><a href="http://www.sanskritweb.net/fontdocs/index.html#AKZIDENZ" title="http://www.sanskritweb.net/fontdocs/index.html#AKZIDENZ">http://www.sanskritweb.net/fontdocs/index.html#AKZIDENZ</a></p>
      <p>but I have none of the oldest printed samples of "Haas'sche Grotesk" and "Neue Haas'sche Grotesk". As far as I know, when Miedinger started the "Neue Haas'sche Grotesk" (neue = new), the Haas'sche foundry already sold the "Alte Haas'sche Grotesk" (alte = old) dating back to the 1940s, which at that time was simply called "Haas'sche Grotesk" (without "old").</p>
