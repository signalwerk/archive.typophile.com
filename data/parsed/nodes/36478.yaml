      <p>Nick, <a class="freelinking external" href="http://typophile.com/node/28845" rel="nofollow">this thread</a> I think sheds light on the issue of how new Helvetica is. Half way down the first page you can see the Breite Grotesk that was one of the influences on Helvetica. And to me it looks significantly different. In fact, as the poster mentions, FF Bau is an effort to revive Breite Grotesk that is has more of the original flavor. </p>
      <p>Also in that thread Erik Spiekermann says that the current AG is based on Helvetica, with relatively few changes, such as diagonal terminals. I wonder if Martin Majoor was mistakenly comparing Helvetica and the current AG, rather than Helvetica and the original German Grotesks that inspired Helvetica. </p>
      <p>&gt;Surely a new design needs new features, you can’t just do some renovation and call it a new building. Futura, is a genuine example of 20th century modernism, built from the ground up, not a reprise of 19th century modernism.</p>
      <p>I'm not sure what you'd call 'features'. If you mean structural features such as whether the W has crossed middle strokes or not, I would disagree. I think you can have all such features the same and have radically different faces. If you've ever used Identifont you'd agree: with the same features, it comes up with matches that have radically different styles. </p>
      <p>The handling of contrast, terminals, relative widths, proportions are as important as these structural features, and as much a source of originality in type, such as it is. </p>
      <p>I think Futura is a much greater typeface than Helvetica, but it is a different kind of modernism than Helvetica. According to the very interesting book on Renner, he was trying to be classic as much as modern, and it shows--for the better in my opinion. He was not trying for the bland-with-sparkle look that is the defining characteristic of Helvetica, and of which it is the prime exemplar.  </p>
      <p>When even Uli, who is always the first to cry 'forgery', questions you on whether Helvetica is improper copying, I think you are on thin ice on this one.</p>
