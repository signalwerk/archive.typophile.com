      <p><cite><strong>Plagiarism</strong>: I <strong>steal</strong> someone else’s type design and claim it as my own work.</cite></p>
      <p><cite>What has the <strong>law</strong> got to do with it? <strong>Plagiarization</strong> (or, as you term it “font forgery”) of type designs is <strong>legal</strong>, because they don’t have copyright protection.</cite></p>
      <p>Nick, when you want to say that something has got to do or has not got to do with the law or when you want to say that something is legal or not legal, you have to use the legal notions (words, terms, expressions) used in the law, not non-legal notions. The non-legal notions "plagiarism" and "plagiarization" are not known in the US Copyright Act nor in the UK Copyright Act, nor as "Plagiat" in the German laws. Hence I cannot use these <strong>non-legal notions</strong>, when writing documentations for legal authorities, as it is done at my website.</p>
      <p>On the other hand, you must not use <strong>legal notions</strong> of crimes, unless you are speaking of crimes. For instance, you are speaking of the crime of "stealing" (= theft) in connection with plagiarism (<cite>"I steal someone else's type design..."</cite>), but a few sentences later, you declare that plagiarization is legal. This is both illogical and not permitted by law. You cannot accuse someone of having committed the crime of theft, if you think that what he did was legal.</p>
      <p>The Typophile website often uses the notions "steal" and "theft", see e.g.:</p>
      <p><a href="http://dev.typophile.com/node/33080" title="http://dev.typophile.com/node/33080">http://dev.typophile.com/node/33080</a><br>
      ("The best way to design - steal")</p>
      <p><a href="http://www.typophile.com/node/15351" title="http://www.typophile.com/node/15351">http://www.typophile.com/node/15351</a><br>
      ("Site design by theft")</p>
      <p>If "plagiarism" were a legal notion, I could use it at my website, but since it is not a legal notion, I have to avoid to use this non-legal notion.</p>
