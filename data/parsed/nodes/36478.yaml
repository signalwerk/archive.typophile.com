      <p><em>my samples permit exact comparisons and reveal very different x-heights.</em></p>
      <p>As I mentioned, I assume that Max Miedinger would have begun by tracing one size of lower case, and photostats of resized capitals. On second thoughts, he would have probably done it the other way round, and resized the lower case. </p>
      <p>In my opinion, the process is important in determining the originality of a type design, as much as any comparison of physical characteristics. That's particularly true for design, as compared to art, where technique has become increasingly irrelevant, and a distinction has emerged between artists and makers.</p>
      <p>So when considering the modernity of, for instance, the Futura capitals, the principle of basing them on simple geometric shapes resonates with Purism and similar movements in 20th Century art, although the letterforms themselves resemble those of antiquity.</p>
