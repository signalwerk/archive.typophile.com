      <p>Uli, you are using the incorrect term "forgery" instead of "plagiarism".</p>
      <p>Plagiarism: I steal someone else's type design and claim it as my own work.<br>
      Forgery: I design a typeface and claim that it is someone else's work.</p>
      <p>The only digital-era font forgery I am aware of was a (tongue-in-cheek) hoax: House Industry's "Chalet".</p>
      <p>With regards to plagiarism, the norm in type design is a variant of this concept --redesign.</p>
      <p>Redesign: I take someone else's typeface, modify it, claim at least that much as my own work, AND credit the original designer. </p>
      <p>This kind of "revival" is considered homage not plagiarism, because the source is acknowledged, and, although copyright doesn't exist on typeface designs, nonetheless enough time has passed* that were the type design a painting or a novel, it would be in the public domain.</p>
      <p>The real bone of contention is, as it should be, redesigns of recent typefaces, i.e. rip-offs.</p>
      <p>(Piracy is generally understood to mean illegal copying of software files.) </p>
      <p>*St Clair, in "The Reading Public in the Romantic Period" notes the effect of different lengths of copyright protection on literary production, and comes to the conclusion that there is an optimum duration (around 25 years), which protects the author's investment in a work, while thereafter allowing accessiblility to copyright-expired works to stimulate the culture and the economy.</p>
