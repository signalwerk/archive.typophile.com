      <p>I am pleased, Prof. Fernández, that you contribute to the discussion here.</p>
      <p>You should not have written your lenghtly explanation, why you have "drawn heavily" on my site, because this did not annoy me at all. I was only surprised that you translated my expression "forgery" by the Spanish word "fraude". Since I did not learn Spanish, I contacted an email correspondent of mine from Spain, who is a linguist and who was kind enough to make for me a translation of your complete text at your website. She told me that "fraude" is "a very strong word" used in Spanish in conjunction with business crimes, e.g. in the stock market, similar to English "fraud and embezzlement".</p>
      <p>As regards the old synonymics book, which I mentioned, it is difficult to make scans, and moreover, I do not think that anyone wants to make researches in this direction. Nevertheless, if someone wants to make studies concerning the typeface used in this old book of 1940, I herewith reference to the complete bibliographical data, so that the book may be bought or borrowed from a library:</p>
      <p><a href="http://www.bookshopinc.com/cgi-bin/bsp455/165734.html" title="http://www.bookshopinc.com/cgi-bin/bsp455/165734.html">http://www.bookshopinc.com/cgi-bin/bsp455/165734.html</a></p>
      <p>As your intention was to write an anecdote about how your hometown Valencia has a typeface with its name, which is a "fraude tipográfico", it will be of interest for you to learn that "Valencia" was not the only font forgery sold under the name "Valencia". The American font forging outfit Atech published a font forgery of the font "Barcelona" (by Ed Benguiat in 1981) under the name "Valencia TA". The suffix "TA" was an abbreviation for "Type-O-Thek Allfonts".</p>
