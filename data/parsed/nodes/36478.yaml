      <p>My own definition of "font forgery" is given in my 3-year-old very first document, which started my series of documentations about this industry:</p>
      <p><a href="http://www.sanskritweb.net/forgers/forgers.pdf" title="http://www.sanskritweb.net/forgers/forgers.pdf">http://www.sanskritweb.net/forgers/forgers.pdf</a></p>
      <p>The fictitious "Shakespeare" forgery example on page 8 of this document may also elucidate my definition.</p>
      <p>The test purchase of "Basic Commercial" 3 years ago was my first and my last. When I opened the font file with a font editor, I read this notice:</p>
      <p><cite>"This typeface is original artwork of Morris Fuller Benton. The design may be protected in certain jurisdictions."</cite></p>
      <p>Wow, I thought, this bizarre and presumably mentally deranged font forger must be a really funny guy. Hence I called this industry the "funny" font forging industry.</p>
