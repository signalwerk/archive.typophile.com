      <p>Nick, Linotype acquired Helvetica when it took over Haas in 1989, according to the history on its web site. Haas and Meidinger could be praised or blamed for whatever they said then--and I don't know what it was. But to call Linotype plagiarists for not going into the history of a fifty year old font that they got 18 years ago seems to me weird. </p>
      <p>If they went into Akzidenz Grotesk, they would have to mention name of a rival product, and explain that Berthold's font of that name isn't really the same as the original varied metal fonts, but also a modern synthesis, of several faces etc., etc. I can understand their not wanting to open that can of worms.   </p>
      <p>Also 'plagiarism' implies a close or identical copying of material. It goes beyond a lack of graciousness in acknowledging inspirations for your work. And I think Helvetica is significantly different in its thoroughgoing modernism. </p>
      <p>Here is what Majoor says: "Compared to Akzidenz Grotesk, Helvetica has hardly any new features. Though claimed to be an improvement on Akzidenz Grotesk, it lacks all the character and charming clumsiness of Akzidenz Grotesk. Helvetica is blunt and colourless..."</p>
      <p>But that effort to cut out the clumsiness and be colorless and consistent was a new look, and it, along with Univers, which had a similar goal and appeared at the same time, were seen as path breaking as part of a new aesthetic of modern 'swiss design' or the 'international style.' </p>
      <p>Also Helvetica did a lot of things to 'lock in the whites' or 'activate the whites', which the Swiss were talking about at the time. (See my illustrations and comments about halfway down <a class="freelinking external" href="http://typophile.com/node/36301" rel="nofollow">this thread</a>.)</p>
      <p>Here on Typophile quite a few people say they love the current AG, but hate Helvetica. Not an AG admirer, but it shows that many people find a significant difference.</p>
