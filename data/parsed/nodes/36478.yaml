      <p>Of course, that was a generalization Bill.<br>
      There's no survey of redesigners' work that reveals their methods.<br>
      Nonetheless, the signs of autotracing (an important feature of Illustrator, Fontographer and FontLab) are apparent in the outline paths of many retro fonts, and faces such as Adobe Garamond were made with tracing, as shown in the Adobe Garamond specimen booklet.<br>
      I've used a variety of techniques, including the magnifying glass.<br>
      However, the similarities between Accidenz Grotesk and Helvetica are too great for me to reconcile with any technique other than tracing.</p>
      <p>**</p>
      <p>There's an important consideration that sets revivals of older letterpress text types apart, and that is the adjustment made from impressions with substantial gain, to present day offset reproduction (or display usage), which requires imagination and interpretation on the part of the redesigner. That forces a certain amount of originality upon the project, which you don't see in revivals that are made, for instance, from display sizes in early 20th century specimen books, or from phototypositor era specimens -- such as a recent post in this forum, Rustikalis.</p>
