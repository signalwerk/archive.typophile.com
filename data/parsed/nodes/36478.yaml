      <p>Nick, since laws are different in different countries, it is almost impossible to coin a term that might fit for most countries. At the Typophile website, besides undefined colloquial words such as "rip-off, knock-off, clone, etc.", I often see that words are used which directly denote criminal acts in many countries, e.g. "theft" (He has "stolen" my font), "fraud", "piracy", etc.</p>
      <p>While "theft" and "fraud" are crimes, the word I selected, namely "font forgery", is NOT a crime AS SUCH in the countries, whose laws are known to me. Hence, the term "font forgery" is a much milder term than such criminal law terms as e.g. "font theft", "font fraud", "font piracy", etc.</p>
      <p>While the forgery of banknotes and of deeds and similar documents are crimes, the forgery of fonts and of paintings etc. AS SUCH are no crimes, because the criminal codes (of the countries which I know) do NOT define "font forgery", "painting forgery", etc. as crimes ("Nullum crimen sine lege").</p>
      <p>But of course, a font forgery may be instrumental of a crime, for instance if a fraud is committed concerning a font forgery. But the font forgery as such is not a fraud.</p>
      <p>I avoid the terms "piracy" and "plagiarism", because they are (in most countries) related to the copyright law. Since in most countries fonts are not copyrightable, the terms "piracy" and "plagiarism" are nonsensical in such countries.</p>
      <p>Bill Troop said that my term font forgery is "loaded", but in fact, my term is less "loaded" than the criminal law terms "theft", "fraud", "piracy" etc., which are used so often here at Typophile.</p>
      <p>Prof. Fernández used the term "fraude tipográfico" (= typographical fraud), as if he were speaking of criminal acts. But a font forgery AS SUCH is not a crime in Spain, as far as I know.</p>
      <p>&gt; Forgery: I design a typeface and claim that it is someone else’s work.</p>
      <p>I do not know, where you got this definition from.</p>
