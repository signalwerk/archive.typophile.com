      <p>&gt;That’s how people do revivals, by tracing.</p>
      <p>I don't know what Max Miedinger did, but I know what I am doing with my revival of Caslon, and it is not following tracing. </p>
      <p>I have indeed done scans of the three best text sizes--all significantly different from one another. But I have drawn everything from scratch, except the initial i and o of the basic size--and I changed these two letters numerous times. I compared with a magnifying glass my drawings to the original printing of Caslon, to revivals of Caslon, both metal and digital, as well as other old faces. I have adopted what I like in Caslon, rejected what I don't, and added my own inventions. </p>
      <p>Matthew Carter compared a revival with a new performance of an old score. For my effort, I feel like it even more for me and Caslon it has been like taking an old theme from a symphony, and writing a new symphony with the same theme. </p>
      <p>It isn't a matter of cleaning up traces, or altering them here and there. It is a matter of finding a new vision of an old style--and it is in fact a Dutch style that went through many hands--and carrying that through systematically. </p>
      <p>Caslon did his interpretation of his Dutch predecessors, and I am doing my interpretation of his work. I feel like I'm in good company, and it is a company not of pirates, but of craftsman and artists.</p>
