      <p>As I remember from discussions of the origins of Helvetica here on Typophile, there was no single coherent Akzidenz Grotesk--that was a post-Helvetica creation by G.G. Lange--but a series of German sans fonts with different treatments. Akzidenz simply meant 'jobbing'--for advertising--but different sizes had different designs, and sometimes even different names. </p>
      <p>As type goes, the creation of Helvetica, inspired by a diverse but related group of faces, seems to me pretty original. According to the story in the film, it evidently struck people as fresh at the time is came out--1957--helping its rapid rise to popularity. </p>
      <p>As to acknowledgments, this complicated history, with no one source of inspiration, seems to me to let Linotype off the hook as far as acknowledgments in this case. </p>
      <p>Yours is certainly an expert opinion, but I would be very surprised if many other experienced type designers would agree with you that Helvetica is an example of improper copying.   </p>
      <p>Incidentally I don't have any pro-Helvetica bias. I think it is rotten in text, stale as display, and sub-par in signage.</p>
