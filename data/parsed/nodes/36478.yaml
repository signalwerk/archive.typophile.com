      <p>I should also point out that none of my revivals has yet achieved the ubiquity of Helvetica, and I've published many more original designs than revivals. I find it a sad reflection of type culture that so many of the best known and most used faces are derivative. It's not that I'm against the past, and in fact I've succumbed to revivalism for the past three years, working on the Modern Suite (if you can't beat 'em...). As I said, I just find it sad that the best-selling, best-known, most used typeface is a 50-year old revival -- compare typography with other fields of art and design. </p>
      <p>Actually, I'm very optimistic about the future of typography, so many great new typefaces have been designed in the last few years.</p>
