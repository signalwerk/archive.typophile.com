      <p><cite>I think Futura is a much greater typeface than Helvetica, but it is a different kind of modernism than Helvetica. According to the very interesting book on Renner, he was trying to be classic as much as modern, and it shows—for the better in my opinion. He was not trying for the bland-with-sparkle look that is the defining characteristic of Helvetica, and of which it is the prime exemplar.</cite></p>
      <p>When taking in account the more ‘extreme’ glyphs Renner proposed for <strong>a, g, </strong>etcetera, I think his aim was more for a modern look than a classic. Nevertheless Futura turned out to be a classic (and the royalties saw Renner through a very different period in his life). And I’d take Futura over Helvetica any day!</p>
      <p>The book is ‘Paul Renner’ by Burke, I presume?</p>
      <p>___<br>
      Bert Vanderveen BNO</p>
