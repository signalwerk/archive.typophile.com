      <p>I think the ornaments come from the same family (Bickman) as the script and therefore I don't have a problem with them. But I think two are redundant, I'd eliminate the top one, move the type up, and enlarge the ornament at the bottom.</p>
      <p>I'm not loving the way you broke up that one line (convidam...) into three - preferred it as one.</p>
      <p>I'm also slightly bothered by the centering of the two families' names - can you nudge the pair on the right a bit to the right? The entire block of names, as is, looks off center to the left.</p>
      <p>By 'set in stone' I think Tiffany meant is that some sort of standard wedding invitation size/shape (the square) or is there some flexibility about it.</p>
      <p>I'd also add more leading overall - both to the family names and to the text, open it up vertically a bit.</p>
