      <p>Rafael,</p>
      <p>Several thoughts:</p>
      <p>1. I think the "funeral" responses may have had to do with two things: the dagger and the static symmetry. The dagger is often used to represent the end of a text, or more symbolically, death. And the square bordered layout in which type is centered and spread out over the whole area evokes the layouts of gravestones....</p>
      <p>2. The border: these kinds of printed black lines that are usually coupled thick/thin like this one are devices used by printers to fool people into thinking that there is spatial depth to the page. Expensive invitations often use embossing to create multiple levels of impression into the page, but when someone doesn't want to spend the money on engraving embossed pages, they can fake it by printing 'shadow lines'....hence the overuse of borders. They become hackneyed and make things look cheap......</p>
      <p>3. It seems to me you could improve the type by clarifying when and why you use certain cases. The parents are in all-lowercase small caps (no larger capitals), the main message is in lower case, but the bride and groom are in title case (script italic), and the proper nouns in the last paragraph are also in title case.....</p>
      <p>When poets like e.e. cummings used lower case exclusively in their texts, they did it for a reason. They were eschewing established rules of grammar and punctuation they thought were too staid and musty. They wanted to strip all that out and focus purely on the content, insofar as words are capable of accurately conveying content.</p>
      <p>I'll stick my neck out and say that, roughly speaking:<br>
      upper case = 'stately, rigid, engraved, permanent, chiseled'<br>
      title case = 'formal, corporate, presentational, polished'<br>
      mixed case = 'conversational, flowing, normal, direct'<br>
      lower case = 'personal, intimate, humble, unassuming'</p>
      <p>It could then be inferred that the use of small caps is probably a hybrid between upper and title cases.</p>
      <p>Two more things: script and italic. The switch from separately formed letters to script indicates the sudden presence of the HAND (i.e., a calligraphic touch....personal, custom, elegant). And, the use of italics indicates the sudden presence of the VOICE (i.e. spoken conversation or a quotation, emphasis).</p>
      <p>Decide how you want to portray the tone of this event in the type and stick with it. Use the cases judiciously to support that decision. Right now, it's kind of scattershot: too much pepper in the chili.</p>
      <p>4. You could also get more out of the use of the script by using its "swashy" nature to connect the two names physically. Right now, there is a lot of space between the names and ampersand.....it looks a little like they're already sleeping on opposite sides of the bed! Perhaps put them closer together and draw some additional swashes that connect all three elements with a flourish...? This might also help the ornament at the bottom to not seem so merely decorative and gratuitous, but rather an echo of what's happening above.</p>
      <p>Cheers and Good Luck with it! And remember that people are going to be delighted to receive the message if it's good news to them, no matter how you set it.</p>
    html_clean: |-
