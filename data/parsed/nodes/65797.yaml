      <p>For myself, the main reason I haven't used any weight-interpolation math is that I don't make enough fonts! I work too slow for it to really help. :-/  But otherwise I'm a big believer in math, and in fact did use some in the designing of N&amp;P: I used letter-frequency analysis to decide the relative vertical proportions of the Latin and Armenian - see here:<br>
      <a href="http://themicrofoundry.com/ss_rome1.html" title="http://themicrofoundry.com/ss_rome1.html">http://themicrofoundry.com/ss_rome1.html</a><br>
      In that case math saved me from a ludicrous amount of iteration.</p>
      <p>BTW, a bit off-topic, but: Another technical trick I use is to make a given character in each weight a predictable "distance" in letterspacing from the other weights; so for example using -5 tracking on the Bold might make it width-identical to the Regular; this is useful in cases where the typographer wants to change the weight without affecting linebreaks for example.</p>
      <p>hhp</p>
