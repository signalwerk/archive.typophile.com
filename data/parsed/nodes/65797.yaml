      <p>Nathan, great thread to start.</p>
      <p>I don't know how much Luc[as] deviates from his method (it should be not too difficult to check), but I think it's generally quite sound; this is because it deals with human perception, not taste. The important thing to remember is that it's not meant to determine what weight is best for a Regular or any "master" weight. The point of it is to find a weight between two masters that looks equidistant from the two (and by extension you could split the range into more than two halves and get weights that span the segment equally).</p>
      <p>The thing is, as Nick says, if you have three master weights that are not nicely spaced, your intermediates aren't going to like each other. And this leads to another -more troublesome- issue, the one James noted: fonts tend to be used in pairs; typographers often use one weight for the body and something else for secondary stuff, so they need that pairing more than they need all the weights to play nice with each other, which means equidistance isn't really a big requirement. However, if you have a fine enough gradation in a font family (something that does appeal to me) this is less of an issue.</p>
      <p>&gt; I wind up tweaking the crap out of everything I interpolate anyway</p>
      <p>If you're tweaking the stuff between the extremes, either:<br>
      - you're an exceptional type designer,<br>
      - the design does not lend itself to interpolation,<br>
      and/or<br>
      - your extremes are not good enough.</p>
      <p>In my case it's never the first, rarely the second, almost always the third. What I'm getting at is: in general I recommend tweaking the crap out of the extremes until you get to 99% of the intermediates you want*. It's often overhead well spent.</p>
      <p>* It might seem nuts, but I dump my original Regular once I have an optimal weight axis going.</p>
      <p>&gt; I generally create 20 to 30 different instances</p>
      <p>For Nour&amp;Patria, I had to worry not only about the weights in the Latin playing nice and the weights in the Armenian playing nice, but since the system assumed in-line mixing of the two scripts I had to make sure the two scripts play nice with each other as well! So I got velox output of 5% increments between the lightest and the darkest* for each of the 5 typefaces (which means I guess 21 for each), cut up all the paragraphs into rectangles, and went through two grueling days of putting them all next to each other and doing Olympic Squinting! I don't think I've ever had to focus that intensely for that long in my life. Oh, and I made each Italic match the color of the Roman one step lighter (a useful trick).</p>
      <p>* Which actually happens to be a much-smaller-than-usual difference in N&amp;P, like the range in Rotis.</p>
      <p>hhp</p>
