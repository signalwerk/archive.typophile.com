      <p>Thanks for the responses, James and Hrant.</p>
      <p><cite>- you’re an exceptional type designer,<br>
      - the design does not lend itself to interpolation,<br>
      and/or<br>
      - your extremes are not good enough.</cite></p>
      <p>I can guarantee it's not the first; could well be due to the second; and is almost certainly caused by the third.</p>
      <p><cite>Oh, and I made each Italic match the color of the Roman one step lighter</cite></p>
      <p>Very cool.</p>
      <p><cite>Not a quick process at all.</cite></p>
      <p>I think what I'm looking for maybe isn't a process that's quick, so much as a process that helps me thread through the following two obstacles:</p>
      <p>(1) IMHO, the 'geometric mean' method can have a tendency to create families that are quite bland. Maybe that's not quite the right word. But as Hrant notes, because of the maths, the proportions amongst all the steps are <em>exactly</em> the same--'equidistant' as Hrant says. The pay-off is that these faces tend to be very flexible as far as combining a variety of weights on a page is concerned.</p>
      <p>(2) I find that some faces I use -- ones that obviously aren't based on a geometric mean -- can be somewhat restrictive. As though the hand of the type-designer is so apparent, that it suggests certain ways the face should be used. I can't think of a specific font of the top of my head; but, for example, a particular weight works great as a bold companion to another -- but not so hot as an intermediate weight between the two adjacent weights. Or, there are times when I think a demibold is a better bold than the 'actual' bold.</p>
      <p>Not to say that aren't times when the face should suggest how it wants to be used. But I don't think it's a solution for every typeface.</p>
      <p>I'd very much like the project I'm working on to be a utilitarian face--so I'm loathe to suggest too heavily to the end user which faces are the appropriate bolds for others. Yet I'd like it to have a bit more 'character' (again, for lack of a better term at hand) than the geometric mean might lend.</p>
      <p>It seems that the work-flow that James and Hrant mention is pretty similar. And since I admire the work of each of them, I'd probably be saved much aggravation and trigonometry by following their advice. But what fun would that be!? ;-) It's fortuitous that I have a seedy love affair with spreadsheet applications.</p>
      <p>BAD ANALOGY BELOW. BEWARE ALL YE WHO ENTER HERE:</p>
      <p>Music is probably a bad analogy, but I can't help comparing the weights in a typeface to the notes in a scale. The geometric mean is equal temperament in music (the math is the same). And you can play in every key equally well -- but everything is equally out of tune, except the octaves. And the major third is damn near unplayable. Then there's Pythagorean tuning, or perhaps Mean tone temperament, where you can play in a few keys beautifully and in tune, but other keys are unusable. </p>
      <p>What's in the middle of those two is what I find intriguing. The variety of 'well' tempered systems, particularly Bach's (or what some think is/was Bach's). Where you can play in every key, but each key has its own <em>Affekt</em> since the notes <em>aren't</em> equidistant from one another. In each key, some notes are more 'in tune' than others.</p>
      <p>And then I think: why does the family have to 'play in each key' anyway? In my own work, I (almost) always use the regular/medium/book/whatever weight as the 'musical' root or tonic or fundamental. And the heavier and lighter weights are 'intervals' of that. But, I suppose assuming all of the end users will work that way is being prescriptive, which is what I would like to avoid.</p>
    html_clean: |-
