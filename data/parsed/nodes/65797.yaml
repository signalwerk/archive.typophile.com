      <p>I think that designers like James -- who have an enormous amount of experience drawing letters, and looking at letters they've drawn -- bring a wealth of empirical knowledge to bear on their process. And whether or not that knowledge can really be articulated, it forms a very sophisticated system of decision-making.</p>
      <p>Designers, such as myself, who lack that wealth of experience, have to (or feel like they have to) find some other means of generating a similar system to inform their decision-making. Which is where math seems helpful. Even though there's always the chance that it is, in fact, not helpful at all.</p>
      <p>I'm beginning to think that I'm approaching this whole affair backwards. I'm hoping that there's some actual perceptual phenomena that would recommend certain weighting schemes. But without understanding the physiology, tinkering with the math is probably useless as far as forming a useful, rational system is concerned. But damn, it's still a fun hobby-horse to ride.</p>
      <p>The other thing I'm sure I've turned around is the attempt to compare a musical scale to weights in a typeface. I know less than nothing about the cognitive processes of the brain, but I'm pretty sure that the auditory distinctions we make are very different than the visual ones.</p>
      <p>If you take someone who's 'musically ignorant', and play them a perfectly tuned interval, and one that's slightly out of tune, they can hear the difference -- and typically pick out the one that's more "in tune". I don't think that the human eye is capable of discerning differences as slight as the ones that we can hear in the musical world. Not that there aren't people who have that level of visual acuity -- some highly skilled designers, and some autists maybe. But it's the exception not the rule.</p>
      <p>I.e., I can hear the awfulness of the major third on a guitar (which is one reason to turn the volume to 11, and overdrive your tubes!) -- but I can't think of a way that that same, slight, grating hideousness could be visible in the weights of a typeface. Not in the same way. I was fiddling with a 'well tempered' weight distribution this morning, and even a 4096 UPM em doesn't have sufficient granularity to render the differences between that an a geometric mean.</p>
      <p><cite>using -5 tracking on the Bold might make it width-identical to the Regular</cite></p>
      <p>Nifty trick. Seems like another way to give the end user a bit more leverage.</p>
      <p>Eben: Thanks for those links. I obviously didn't do my due diligence in looking up previous threads.</p>
