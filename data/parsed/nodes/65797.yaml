    html: <p>The thing that struck me when I tried to apply to formula to my Reading MATD design was that the jumps in weight didn't seem to correspond to what I wanted see. The changes were either too subtle or gross. This might not be true for another design - I have yet to try in on a sans for instance. But I suspect similar things will happen. But beyond that I also think that the scale the type will be used at is also factor. The jump you need at 36 points is probably different from what you need at 6 - and will probably follow to some extent pattern of type for small sizes needing features to be more robust.And finally it seems like testing the type outside of purely optical terms and thinking about it in document terms where implied semantic differences which make use of these changes need to be slight (or great) is also important.</p>
