      <p><a href="http://www.typophile.com/node/32313" rel="nofollow">Here</a> are some thoughts I had. I am working on a font that has six weights and it seems to work, based on the geometric progression (b^2=ac where b is the optical midpoint of a and c). Using a quadratic suggests to me that your three starting weights aren't 'pure' and that your lightest weight (hypothetically at least) is not zero units thick (otherwise you wouldn't need a C in the quadratic equation.</p>
      <p>For me, either your medium and dark weights (yellow line) are too far apart (gradient is too steep) or your light and medium (red line) are not close enough together (gradient is too shallow). Either way, I'd work out which of the two relationships I'm happier with and then finding out where the other weight ought to fall using the geometric mean.</p>
      <p>I'm not saying I'm right. The quadratic route may be better.</p>
