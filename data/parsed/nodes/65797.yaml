      <p>Apologies if it sounded as though I were putting words in your mouth, James. It wasn't meant as such -- but more of a general comment about experience.</p>
      <p>As I've been thinking about this, I've become more disheartened at the approach of looking at stem widths. After all, if I use several weights of a family on one page, rarely am I using them all at the same size. I'm guessing that most folks don't apply a geometric mean to the type sizes they combine on a page -- so if a geometric mean is structuring stem width, that progression is lost once the type sizes change. </p>
      <p>I looked briefly at some lowercase n's I've drawn for this family, comparing stem width to the width of the internal counter. And, oddly, even though the stem widths don't hold to a geometric mean, the ratio of stem width to counter width is pretty darn close to the mean.</p>
      <p>Unexpected.</p>
      <p>So I've dusted off some calculus and some RoboFab, hoping to calculate the surface area of positive and negative space. Thinking that if the ratio of black to white maintains an even progression, it shouldn't matter (as much) what size(s) the type is. The progression will be visible in the color of the weights. Of course this begs several questions; particularly 'Where does the counter space end?"</p>
