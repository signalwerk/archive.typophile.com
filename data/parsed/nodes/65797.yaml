      <p>Oh, incidentally, as an aside, there's another way to find the geometric mean series than the b^2=ac equation. One that's useful if you don't want/need to have a weight exactly in between the extremes. For anyone interested...</p>
      <p>You have your light and dark extremes--let's say the light is 20UPM and the dark is 260. And you want 6 weights in between them. That's a total of 8 weights, with seven 'steps' from light to dark.</p>
      <p>You can easily calculate a 'constant' to determine the weights in the series: (260/20)^(1/7). Or: darkest weight divided by lightest weight raised to the power of one over the amount of steps.</p>
      <p>Multiply the light weight by the constant to get the next weight. Multiply that weight to get the next, etc. After seven steps, you'll be at your darkest weight. Or you can start at the darkest weight and divide by the constant.</p>
      <p>As far as planning ahead for a geometric mean series, I find this equation to be a bit easier or more flexible to work with.</p>
