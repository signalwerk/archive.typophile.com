      <p>I generally create 20 to 30 different instances between the 0 and 1000 axes, print them out and then begin my decision making process taking into account that each lighter weigh must get a corresponding heavier weight to function as its bold. Where does the medium weight fall and how many weights on each side of the medium does the design support?</p>
      <p>Will the Medium be the classic 1:5 stroke width to height ratio, or something different?</p>
      <p>Not a quick process at all.</p>
