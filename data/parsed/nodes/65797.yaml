      <p>&gt; Oh, incidentally, as an aside, there’s another way to find the geometric mean series...</p>
      <p>Cheers, Nathan. That is an interesting and very helpful formula.</p>
      <p>Like others here, I have really enjoyed this thread. I like the thought that there is some deep maths involved here. It makes me think that God is very clever. I also love the fact that optics alone can find robust solutions to these challenges without needing to know the maths (if there are any!)</p>
      <p>My challenge is less how to find the mean weight(s) between two others and more how to know how much thicker on weight should be from the next to work as a robust family. This is where the golden section began to fascinate me. I was also convinced that if you were to use the golden section for the difference between a roman and a bold, that you could only satisfactorily have one intermediate weight between them.</p>
