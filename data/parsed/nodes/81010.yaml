    html: |-
      <p>Make a class "All"<br>
      These will be the default characters, leaning right.<br>
      Make a class "Allalt"<br>
      These will be the corresponding glyphs, leaning the other way.</p>
      <p><code>feature calt {<br>
      sub @All @All' by @Allalt ;<br>
      } calt;<br>
      </code></p>
      <p>This replaces every instance of a member of "All" following itself (marked with '), by the corresponding alternate.</p>
