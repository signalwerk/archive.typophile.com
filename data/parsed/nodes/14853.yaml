  html: |-
    <p>This is a familiar font, the closest thing I have is ‘royalacid’ based on the masthead font from Rollingstone magazine. Can someone help identify it for me? It reminds me of all the sweet TV shows I watched as a kid like “Hart to Hart”. Who can forget Mrs. H, she really was Gorgeous.</p>
    <p>Funnily enough there is another version of this album cover widely released which has really poor typography. Not sure why?</p>
    <p>Cheers,</p>
    <p>Dom</p>
