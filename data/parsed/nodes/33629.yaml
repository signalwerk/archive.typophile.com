    votes: null
    html: |-
      <p>You can not TM the actual shape of the letterforms (at least not in the US). You can copyright the actual code that makes up said font, however. You can also TM the name of the font. </p>
      <p>As such, there is nothing technical illegal about buying a font, printing it out, tracing it, scanning it back in, and selling that as a copy. Ethically and morally there are issues, of course.</p>
      <p>In your case, I think you are creating a significant departure from the original face while retaining enough likeness to call it a tribute. So I think you are fine on the ethical and moral POVs (IMHO, of course. Legally, you jsut want to be sure you are using your own set of mathematical curves and vectors in the software (the font itself).</p>
