    html: |-
      <p>The law will allow the appropriation of letterforms, but not "point piracy" -- i.e. tampering with font software. This creates the strange scenario where typefaces that look a lot more like Gill than yours are legal because they were created with fresh BCPs, whereas yours, which is conceptually quite a stretch from the original, is illegal because you started with someone else's digital data.</p>
      <p>I think the law is correct, because the intent is to stop cheating (i.e. capitalizing on someone else's work and taking a short-cut to the finished product), but not to give creators the kind of monopoly that censors cultural give-and-take. One issue is that this distinction is abused by foundries that knock off designs, but nonetheless remain within the letter of the law by making fresh outlines. Another issue is that sampling is a legitimate creative technique in the digital era, but its legality is problematic for copyright laws that were developed much earlier.</p>
      <p>So, if you were to print out your font, scan it, paste the images in the mask layer, and then use the pen tool to trace the outline of the glyphs, that would make it copasetic.</p>
      <p>Of course, you would have to make the metrics from scratch -- and that's an important chunk of work that isn't usually figured into the ethical equation.</p>
