      <p>Even if the EULA allowed for modifications, chances are it didn't allow for transferring. Further, and even less likely, it probably didn't allow for derivatives, or in other words, versions of the fonts to be given away for free or sold for profit. Given that Gill is owned by and/or licensed from Monotype I'd say you are stepping of shady ground in all 3 counts.</p>
