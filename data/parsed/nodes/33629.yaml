      <p>Ah yes, there were Gill Sans additions not by Gill. Consulting Robert Harling's <cite>The letter forms and type designs of Eric Gill</cite>, page 46 shows <cite>sans 'double elefans'</cite> drawings by Gill, uppercase only but including this strange lowercase 'f' and a few numerals. Obviously an early version.</p>
      <p><cite>So Haley should probably take a few liberties with the underlying structure, both to claim more authorship of the new design, and also to better suit the letter forms to the rounded treatment.</cite></p>
      <p>That's it. Maybe even study the rounded version very carefully to find out what makes it so special, then put it aside and draw something based on the special elements. This makes it also necessary to think about, how do I solve the 'n' shoulder? and which shape do I give the 'b' 'd' 'p' 'q' bowls and how do they intersect with the stem? Maybe the result will be even more radical than the ultra bold Gill Sans? I think this is a very funny game.&nbsp;&nbsp;:)</p>
      <p>Starting from zero (of course you have many typefaces in mind and even 'cite' this or that one) prevents you from the question you asked in the first place.<br>
      Sorry that my other post sounds rude, Haley. It was the combination with the Didot question which I found alarming. My opinion is: It is ok to modify a typeface for one's own use if the EULA allows. A very good exercise too. But the designer or foundry may not be too happy if one would start distributing a 'better' version of their typeface. (Irrespective if it's distributed for free or not, or if receivers do or don't have licensed the original version or not.) To me, this is more a fairness than a legal issue, both as regards intellectual and physical work on which one builds.</p>
