      <p>Generally, when a font is purchased it comes with a EULA that outlines what is acceptable use of the font and often includes a clause for such things as modifying and use of the modified font. </p>
      <p>Each foundry is different, so the best thing to do is to go and check out the ELUA on the vendors website and see what they have to say about it.</p>
