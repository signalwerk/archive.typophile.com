      <p>As to your "maybe Didot inspired" font. The European copyright laws are different from those in the States, but even so, since it isn't a direct visual copy, I would think it is not an issue. Otherwise, all the larger foundries would constantly be suing each other -- and some of the smaller ones, too.</p>
      <p>As to the free font: Cost &amp; license are unrelated. You may well have accepted a licensing agreement when you downloaded the font. There are free fonts that have more restrictive agreements than fonts you pay for. Check the EULA of your free "Champion" to see.</p>
