      <p>I really wasn't trying to be clever. It is more that the EULA represents a lawyer's effort to protect his client -- the type founder/seller. The language used is to me incomprehensible, but that's not the point. What I assume is going on is the lawyer is trying to help his client from (1) not losing sales, and (2) not looking foolish, should someone poorly modify a font.</p>
      <p>If I hold a license and modify a font for my use (when permitted), another holder of the same license could hire me to modify <cite>their</cite> font. Of course it counts as one of the permitted copies. But exactly the same situation results if I just send them a copy of my modification. Nobody's lost any money they would otherwise receive. I assume that's the point of the license in the first place.</p>
      <p>Isn't this correct?</p>
