      <p>From a design perspective (legal issues put aside):</p>
      <p>I consider it dangerous to start with an existing font, or with an existing non-digital type design: The original design may shine through even if you changed every detail. Design is more than serif forms, curves, stem width, sharp or curved edges, some ornamental addition, even proportions -- it is the 'mind' or 'logic' or 'rules' which make the various details a unity. Changing one or some of these details may just break the design, but most likely produce something derivative. Starting with something existing requires a deep understanding of the original design to do something truely different.<br>
      If I look at the rounded extra bold Gill Sans, I think what is so interesting about it (despite having round edges which is a current trend) are the proportions and the funny stroke contrast in the 'a' 'e' 'f', and the Sisyphean 'i'-dot, all of which are in the original design. Moreover, the rounded version inherits all shortcomings of the original design.<br>
      To make more evident what I mean: Do with Helvetica what you did with Gill Sans. Notice the difference?</p>
