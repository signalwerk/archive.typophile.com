    <p>I altered a version of Gill Sans for a project in art school. I recently was considering making it available for free to a few fellow designers who asked for a copy but was unsure of the legal issues surrounding it. Is there anywhere I can view guidelines on that sort of thing?</p>
    <p>Here is the extent of the editing:<br>
    <a href="http://www.kingdomofawesome.com/images/gillrounded.jpg" title="http://www.kingdomofawesome.com/images/gillrounded.jpg">http://www.kingdomofawesome.com/images/gillrounded.jpg</a></p>
