      <p>Charles, while your thinking is clever I'm not sure it would work as EULAs are geographic location sensitive. Adobe's EULA allows for modifications, but then that modified version becomes one of the copies licensed. Or in other words, if the given EULA (Adobe's in this case) is for 5 workstations, and you modify it to be used on 2 workstations, you only have 3 un-modified workstations left. </p>
      <p>Ack! A math problem. Run!</p>
