      <p>Nick, I believe it is actually more complex than that. If the original EULA permitted modifying for one's own use, and the intended recipient had also purchased the same font, with the same EULA, I believe it could be given to that person. If EULA's never changed, as long as both parties owned a license, both could have the modified font, as long as the "number of computers installed on" was adheared to. But EULA's do change.</p>
      <p>Secondly, I believe in Europe, you can copyright the design as well as the software that renders the font. Correct me if I'm wrong. But I hear you loud &amp; clear on the big foundries rip-offs. I believe Monotype was once sued over that; in the States, anyway, the ripoff of the "design only" was OK, since the data was not taken.</p>
      <p>In passing, when Apple sued Microsoft (over Windows), I always wondered why Xerox didn't file suit against Apple . . .</p>
