      <p>Nick says:</p>
      <p>" Why not do it with a broad nibbed pen, using the New Alphabet? (After all, it is an alphabet—unless the name is purely ironic—and so may be rendered in many ways.) […] I too designed a monowidth, unicase alphabet, which I termed the Panoptic alphabet, and executed it in a number of different typographic styles, as the typeface Panoptica."</p>
      <p>Nick, I believe (correct me otherwise), is drawing a distinction between alphabets and typefaces, which I believe applies to the New Alphabet. Just as the Latin alphabet can be rendered in many different styles, so can the New Alphabet (even if it is really a redesign of the Latin alphabet, and thus more like a code than a truly different alphabet).</p>
      <p>Even in <a class="freelinking external" href="http://www.papress.com/thinkingwithtype/teachers/type_lecture/lecture_images/WimCrouwel.gif" rel="nofollow">this image</a>, Crouwel shows two different typefaces for his alphabet.</p>
      <p>About legibility: I think that due to the strong resemblance of some letters to their customary lowercase latin forms, in context, the others can be quickly deciphered or assumed, making the text easy enough to read.</p>
