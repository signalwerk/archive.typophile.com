      <p>Well, it's obviously a redesign of the latin alphabet, because the characters correspond one-to-one with latin letters. I'm not sure that's any kind of critical analysis, though I suppose you need to realize that in order to start analyzing it for what it is.</p>
      <p>Why not look at what Crouwel was trying to achieve (or trying to prove) and then try to determine whether you think he succeeded. Maybe look at how others have used his design, and whether these uses fit with his intentions. That could be the basis for some kind of critical review.</p>
