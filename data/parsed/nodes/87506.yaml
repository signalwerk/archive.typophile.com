    html: |-
      <p>A sensible approach is to consider New Alphabet as a cultural product and read it as such. The discipline of semiotics is analyzing "signs" and "symbols" and their meaning to us. </p>
      <p>The context of the time is important, when there was of spirit of advancing to new forms of how basically everything should be structured, from society, to arts, to science and engineering. The speed of technological development was understood as exponential for the first time, and there was a certain feeling that the most impossible utopia might be just a few years away. The same thing with society, the strict post-WW2 social structures were too rigid, so the pendulum moved in the other direction of exploring which most unthinkable forms of social organisations might be possible too. In every domain you saw an explosion of new things, combined with an unprecedented economic boom. This is my interpretation however. </p>
      <p>So based on that context one can read New Alphabet as a cultural symbol. Therefore a semiotic approach seems to be a good angle. To understand it as such, a solid foundation of knowledge on postmodernity, pop culture and its referential approach, and cultural theory might be very helpful. </p>
      <p>Aesthetically New Alphabet is definitely influenced by the spirit of the time. The grid outline for example, inspired by the developing computer systems, digitalism, reductionism. It is a <em>referential</em> art piece, that references type history as well as other cultural products of that time, as well as the social conditions of that time. </p>
      <p>One probably could even relate its minimalism to the design movement in the first half of the century that was concerned with the function of things, like the Bauhaus movement, etc…</p>
      <p>I think the key is that New Alphabet is <em>referential</em>. You can argue that by well established theory work on pop culture, postmodernity, semiotics, and similar disciplines and theories. Now try to tie together WHAT it references and you have your critical analysis. :)</p>
