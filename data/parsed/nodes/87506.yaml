      <p>What I think is interesting about New Alphabet, is that one<br>
      can find two different aspects regarding form and function. </p>
      <p>As the creator stated in an interview he did not liked what<br>
       we would now call a “bitmap” font, which is composed of<br>
      pixel, rather than lines. He wanted to solve this problem<br>
      and therefore introduced a system which only needs 90°<br>
      angles with a 45° line in transition between to 90° lines.<br>
      Actually he wanted a solution that is <em>scaleable</em>! As<br>
      computer systems did not know vector lines, anchor<br>
      points and that kind of stuff he needed to come up with<br>
      such a restricted grid idea. Therefore his solution had a<br>
      certain <em>function</em>, but was working within severe<br>
      technical constraints. </p>
      <p>However, this constraint limited the usability of his<br>
      typeface, which is why it was not intended for real use.<br>
      Therefore it became more form than function, which in<br>
      my interpretation was not the starting point. When it<br>
      comes to the actual design process the shape of the<br>
      letters can not exclusively be traced to this starting point,<br>
      as with the same constraint one could have designed a<br>
      different typeface, therefore the letter shapes can be<br>
      further analysed too. </p>
      <p>Your topic is fun, I find.</p>
