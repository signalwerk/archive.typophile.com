      <p>A typeface has several components:</p>
      <p>The “font” part. Nowadays that is the file and the code of a typeface, the programming, the vector placement, the spacing, kerning, etc... everything technical. In early days it was how metal was carved I guess. A critical analyse of this part can only be from a technical perspective, which is quite irrelevant however for you, dare I say. </p>
      <p>Then there is an aesthetic dimension. This is hard, maybe impossible to analyse from a scientific perspective. </p>
      <p>The last dimension to a typeface is the cultural dimension: How is the typeface understood by an audience? Where does it have its history? How is it used? This can be analysed.</p>
