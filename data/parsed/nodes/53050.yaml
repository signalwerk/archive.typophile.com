    date: 2009-01-01T11:11:00
    votes: null
    html: <p>Kent, you are correct in your supposition about "gros". According to Charles Bigelow in his review of Galliard in <em>Fine Print on Type</em>, "[the] Gros Cicero (c. 1568) had an x-height comparable to a Garamond St. Augustin (14°) on a Cicero (12°) body. In Rome (c. 1583) he cut a larger, similarly proportioned face on the St. Augustine body, which is named Giubilate in the Vatican type specimen of 1628."</p>
