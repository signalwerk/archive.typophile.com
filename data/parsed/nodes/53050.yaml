      <p>I hope this is helpful.</p>
      <p>‘Gros Cicero’ is a name that has been given to one of Granjon’s types for which there are some matrices at the Plantin–Moretus Museum, but they were not acquired until quite some time after Plantin’s death, so it does not appear in books about him. One reason why it has become well known is that Pierpont, the Technical Director of the English Monotype Corporation, found it in a type specimen that was printed in 1905 from old types in the cases at the Plantin–Moretus Museum, and based Monotype Series 110, called Plantin, on it. In fact most of the letter a’s in this font are wrong-fount characters, and the italic is a later type that has nothing to do with Granjon. Nevertheless, Pierpont and his head of the type drawing office, Steltzer, between them made one of Monotype’s most accomplished typefaces on this worn and muddled fount, which was also used to set the introduction to the specimen.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Granjon Cicero MPM 1905 a 450_4264.jpg"></div><p></p>
      <p>So although this image from the 1905 specimen is not a brilliant one it may be the most useful one to offer it here, since it shows not only the wrong-fount a, which got into Monotype Plantin (and therefore into Times), and which by mischance is used here in Granjon’s name, but also the right one, which is seen with a grave accent in the first line and in ‘grande’ in the second.</p>
      <p>The most up to date and reliable account of the type can now be read in the well-illustrated collected edition of Hendrik Vervliet’s essays on the types of the major French 16th-century punchcutters, which has just appeared under the title <em>The palaeotypography of the French Renaissance</em> (Leiden and Boston: Brill, 2008). An important book, and much recommended. But beware: it is very expensive.</p>
      <p>Just to fill in the bare historical details, the type was used for nearly two hundred years in France, the Netherlands and Germany, where it has first been seen in use in in 1569. Its design is historically remarkable as one of the earliest types that have an unusually large ex-height and look larger than they are. (In fact, the fount at Antwerp has the name <em>S. Augustin</em>, which is a size larger than <em>Cicero</em>.) Matrices for the type were quite widely distributed, and it appears in the specimens of several different type foundries. Maybe the most useful reference, since there is a facsimile edition and the example is well printed from sharp, new type (with the correct letter a), is the specimen book of Lamesle, Paris, 1742, where it appears under the name of <em>Cicero gros œil</em> (‘Cicero with a big face’).</p>
