      <p>Here is the gros cicero as illustrated in the new Vervliet book (vol.1, p.226): the type in use in Surius' <em>Commentarius brevis rerum in orbe gestarum</em> (Cologne, 1574), above, and as cast from matrices at the Plantin-Moretus Museum, below. The relationship of this design to Galliard is most obvious from the latter.</p>
