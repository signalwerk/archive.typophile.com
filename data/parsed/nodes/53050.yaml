    html: |-
      <p>The consensus appears to be that not only the wrong-fount a in the cases at Antwerp but also the italic that Monotype adapted for their Plantin (which can be seen on that first page of the 1905 specimen) may be the work of Johann Michael Schmidt (died 1750), also known as J. M. Smit or Smid, a punchcutter who learned his trade in the Luther foundry in Frankfurt am Main, worked in the Netherlands and spent a few years in the 1730s with the newly-revived foundry of the Moretus (formerly Plantin) printing house in Antwerp, before going off to Sweden and finishing up in Berlin.</p>
      <p>Here is a close-up of the Gros Cicero as it appears in the specimen of Claude Lamesle, Paris, 1742. This is not a common book, but there are copies to be found in a number of libraries, and although the collotype facsimile published in 1965 is worth a look, there is nothing that quite compares with the sight of impressions from new type cast in the 16th-century matrices. The same specimen has spreads showing Garamond’s big Canon roman, and Granjon’s italic for the same body, and other romans and italics by both artists.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Granjon - Gros Cicero1a - 450_3632.jpg"></div><p></p>
      <p>And here’s a detail of Granjon’s bigger roman from the same book, on Petit Parangon (about 20 points) here but sometimes cast on a smaller body. In some ways it’s a more subtle working-out of a design similar to that of the Cicero but with a more normal x-height. That g is about as pretty as they get. The U is later.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Granjon - Petit Parangon rom det 450_6262.jpg"></div><p></p>
