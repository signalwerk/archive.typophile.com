    <p>Some people might know, most won't, but the website of the Rijksmuseum, the Netherlands had an overhaul. Most fancy about this is the overview of their archive, which includes a lot of high-resolution type and lettering material. It is a bit of a search, but there are some real gems to be found and is perfect for lazy browsing on a lazy sunday.</p>
    <p>Next to this, I wonder if some people might know of the origin of this type:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/MINN_6560.png"></div><p></p>
    <p>It's used by Johannes Enschedé around 1760 as a companion sheet to an etching.</p>
    <p>A link to the larger page:<br>
    <a href="https://www.rijksmuseum.nl/en/collection/RP-P-OB-24.123/letters" title="https://www.rijksmuseum.nl/en/collection/RP-P-OB-24.123/letters">https://www.rijksmuseum.nl/en/collection/RP-P-OB-24.123/letters</a></p>
    <p>The gallery is easy to browse and filtering is quite simple, which includes filtering on colors and techniques. The english version sadly doesn't translate the keywords, so that's a bit of a drawback.</p>
    <p>Much can be found at:<br>
    <a href="https://www.rijksmuseum.nl/en/search?f=1&amp;p=1&amp;ps=12&amp;technique=boekdruk&amp;imgonly=True" title="https://www.rijksmuseum.nl/en/search?f=1&amp;p=1&amp;ps=12&amp;technique=boekdruk&amp;imgonly=True">https://www.rijksmuseum.nl/en/search?f=1&amp;p=1&amp;ps=12&amp;technique=boekdruk&amp;im...</a></p>
    <p>or</p>
    <p><a href="https://www.rijksmuseum.nl/en/search?f=1&amp;p=1&amp;ps=12&amp;type=tekstblad&amp;imgonly=True" title="https://www.rijksmuseum.nl/en/search?f=1&amp;p=1&amp;ps=12&amp;type=tekstblad&amp;imgonly=True">https://www.rijksmuseum.nl/en/search?f=1&amp;p=1&amp;ps=12&amp;type=tekstblad&amp;imgonl...</a></p>
