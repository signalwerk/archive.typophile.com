    html: |-
      <p>I agree it currently looks too much like three lowercase l's.</p>
      <p>Maybe you can use the pipe '|' instead of the capital i? And if you are willing to do some more altering, maybe take the tilde, or a swash from another character and put in on-top/underneath of the three lines, to make it feel more like III (with serifs).</p>
      <p>Good luck!</p>
