  html: |-
    <p>I'm using Bickham Script for a wedding invitation.</p>
    <p>The groom happens to be a Third, as in William Gates III.</p>
    <p>Unfortunately the cap I is so heavily swashed that III looks like JJJ.</p>
    <p>In desperation I have substituted three lowercase ells but there has got to be a better way.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/20090923-benwedding_4986.png"></div><p></p>
    <p>How does one solve this problem generally?</p>
    <p>Does one spell out "The Third" in the invite?</p>
    <p>Or should I give up and switch to a non-script face?</p>
    <p>Or does it look okay as-is?  I'm too close, I can't tell.</p>
    <p>thanks in advance.</p>
