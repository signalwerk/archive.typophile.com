    html: |-
      <p>First, nice treatment on the "y" in the name - very pretty, and much better than the normal "y" in Bickham Script! I agree with both yourself and Solt; the three el's look bad, capital I is worse. Roman on a skew of 15% might work but I'd be tempted to use small caps rather than making the font smaller. I would present a few versions to your client and let him decide; he may surprise you and ask you to leave off the "3rd" in favor of keeping the font, which lends itself very well to a wedding invitation. Word of caution: if you're sending to a print shop as a .pdf, make sure this font embeds - I've had trouble with it in the past and had to turn to outlines.</p>
      <p>Best of luck! :)</p>
    html_clean: |-
