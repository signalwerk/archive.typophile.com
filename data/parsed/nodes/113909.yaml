      <p>I think it's coming along nicely, Matthew! A couple of things to consider:</p>
      <p>- there are some inconsistencies with your stroke weights, particularly in your thin strokes, such as the branching of the /m/ and the bottom branching of the /a/ and /d/ which need to be much thinner</p>
      <p>- a bit too much space in the counter of the /s/? Overall, that form doesn't carry as much weight as the other letters either, thicken it up a bit</p>
      <p>- the exit stroke of the /d/ could be a bit shorter as well</p>
      <p>- the crossbar of the /H/ and the adjoining top right loop seem to be different widths as well</p>
