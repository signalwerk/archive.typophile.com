    html: |-
      <p>You are right Mark, it's more likely an Arial ;)</p>
      <p>The only difference I can see is that:<br>
      a. Cordia New's Latin characters look much thinner than Arial at the same weight (e.g. Normal) and<br>
      b. you need to specify a point-size of 20 to Cordia New to match the height of a 14 pts Arial</p>
