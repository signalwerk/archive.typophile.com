  - id: 572919
    user: 52182
    date: 2014-03-06T03:10:00
    date_raw: 6 Mar 2014 — 3:10am
    votes: null
    html: |-
      <p>Oh you certainly need to guard the reputation of your type foundry, but from my perspective anyway releasing your work through MyFonts doesn't harm your reputation. As far as I'm concerned it actually establishes/verifies your reputation.</p>
      <p>Also, I don't like Fontshop. I go there once in a while if a typeface can't be found elsewhere, but it's definitely not a go-to spot for me when it comes to typefaces. I'm convinced by the quality of the fonts but I just don't like the website itself. You will probably find that most typefaces from Fontshop are also released through MyFonts, so I think it's an overgeneralisation when you say most fonts on MyFonts are crap. You can say that about websites like Dafont but MyFonts does a lot more quality control. They probably don't do as much quality control as Fontshop but they make up for that with their categorisation and validation systems. I find you actually have to work to get to the subpar fonts because the system is built on showcasing the most popular works, of which most have been validated by end users. The system works so well in fact that I'm always aware of most professional new releases and award nominations shortly after their release. In the end I actually get the feeling that MyFonts and Fontshop are more similar than you might think in terms of quality of fonts. It's just that Fontshop's target audience are generally professional designers while MyFonts speaks to a larger audience.</p>
      <p>I think you can rightfully say that being on Fontshop helps to establish and validate your reputation, but I doubt being on MyFonts harms your reputation. I think perhaps you're thinking too much of the value of exclusivity regarding foundries like TEFF and Dutch Type Library. They don't offer their fonts on MyFonts because it's not a similar target audience. With Proza you ARE speaking to a similar target audience, and so rather than a clever marketing strategy I think you're just excluding part of your target audience. Also, the fact that you're giving away a weight for free to me goes against the notion of exclusivity. I just don't think exclusivity is necessarily as important as you make it out to be.</p>
