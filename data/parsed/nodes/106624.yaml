    html: |-
      <p>Igor, William, Andreas, sim, Gary, Hrant, Martin: Thanks a bunch! It means a great deal to me to get such positive feedback from fellow typedesigners.</p>
      <p>Martin, I've been absent a while myself, but thanks a lot! The (very) basic character set of the serif is pretty much finalized, but I wouldn't expect a release anytime soon. I'm having very little time for typedesign at the moment, and the redrawn Proza Web, and Proza Display have my priority.</p>
      <p>On marketing: The marketing of fonts is not as simple as you paint it. Having a succesful typefoundry is as much about your reputation as it is about your work, especially if you want to do client based work in the future. Myfonts, despite its superior position in font sales, is mostly a shitpile of crappy typefaces. I would advise any starting typedesigner to join the fontshop before joining myfonts, establishing some sort of a professional reputation before going for the big money. </p>
      <p>I've been in contact with Myfonts though, and I'm really impressed with the way they're improving the quality of their library, so I've decided to join them sooner or later.</p>
      <p>Nick, yes that's right. Let's hope you're right :)</p>
