    html: <p>I've stopped caring hrant. I wrote an entire article on the development of Proza (<a href="http://ilovetypography.com/2013/11/01/making-fonts-proza-typeface/" title="http://ilovetypography.com/2013/11/01/making-fonts-proza-typeface/">http://ilovetypography.com/2013/11/01/making-fonts-proza-typeface/</a>), and I've been open about the design process from the very start, so it's certainly not a rip-off. That, and I am certainly not the only one who feels there's enough room between Cronos and Proza. It might turn out to be hard to rid myself of this rip-off reputation, but if I continue to deliver original quality over the coming years, I'm confident I'll get there. That's all I have left to say.</p>
