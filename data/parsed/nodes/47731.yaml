      <p>That chart you were referring to was a fairly confusing one. It shows lots of cursive forms that I've never encountered before, and it's also done in what appears to be a marker - hardly nice for something that should have precision.<br>
      What I meant by chirality issues on the ef is that the two bowls are mirror-symmetric, not rotationally symmetric, and that leads to stress on the left side for which a scribe would have to turn his pen some sixty degrees. I like when the pen angle is pretty constant throughout a font. I also noticed pen angle changes in the ya, Ya, Zhe, and now that I look for more, also the Eh, Ef, and maybe Ze (top part). For the lowercase em, I recommend you just use the el, and add an extra hump--that's usually the done thing, I believe.</p>
      <p>I looked at your Greek, too. I think the form you have for your upsilon now actually reads as a good kappa (strange, huh?). And the nu form would work as an upsilon, I think--I don't recall ever seeing an upsilon with a stem. For a nu form you'd have to come up with something new (no pun intended). Something without curves, maybe. Your Sigma is very confusing for me; do you have a precedent for that form? Also, for the same reason that form didn't work for cyrillic En, I don't think you can use the "h" form for Greek Eta. Chirality rears its head again in epsilon, Phi, phi, and omega. I love the texture, though, and most of the face--the lambda especially.</p>
