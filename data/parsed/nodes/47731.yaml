      <p>JT, thanks for all the comments.  I know Russian's not the only language for Cyrillic, but it's the simplest subset of the alphabet.  A lot of the others are more or less copy and paste operations.</p>
      <p>It's interesting that several people are pointing out the k looks like an n.  Maybe it's 'cause Greek lacks a c character and thus the sequence ic wouldn't happen, but my test version of this same thing in Greek was found to be surprisingly readable by my Greek friends.  I'll have to investigate other ways of doing it as the zhe won't work just chopping off the left.  Tho maybe if I use a top like a t it might distinguish itself more (also of note, the i+c formation seems to be the original method, not that original means best of course).  Slight change but it also gives it a short ascender that might help distinguish it and definitely goes better with the capital.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/cyrillic_fraktur_k_comparison_4362.png"></div><br>
      Here's a more modern-like n, definitely more readable although it loses its connexion with the capital (which was the inspiration for the miniscule).<br>
      <div class="imageWrap"><img src="http://typophile.com/files/cyrillic_fraktur_n_comparison_3573.png"></div><br>
      As for the ts and and the u, I'm a little hesitant to swap them, if only because the ts is visually essentially the same in all other styles to Latin Y and that's the shape it has in the Latin version of it, and I'd like to keep the tails of the u and shch the same.  That said though, here's a third version (with the other two for comparison) that I think might work better as ts, and then I can perhaps leave u as u.  What do you think?<br>
      <div class="imageWrap"><img src="http://typophile.com/files/cyrillic_fraktur_tsu_comparison_6481.png"></div><br>
      On a side note, I'll have the Greek one posted as soon as I can come up with an acceptable uc Omega.<p></p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
