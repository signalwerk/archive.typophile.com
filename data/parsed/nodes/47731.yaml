      <p>If I recall correctly (correct me if I'm wrong, of course, I remember the discussion from a year or two ago and simplifying now a good bit), and I'm simplifying a good, hrant makes a distinction between type design and calligraphy, one of which is dependent on the movement/form/handling of the pen and the other one free to do more.</p>
      <p>Put (again, I think, please correct if not right) another way, in this case, there's nothing wrong in touching up and fixing the curves it does the font good, but it shouldn't be "just" because that's how it would look with a pen.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
