      <p>Okay, new version posted, with also a test version of the Greek and samples in various cyrillic- and latin-based languages.  The letters in crimson I'm not convinced of their viability, and will probably update them strongly.</p>
      <p>Cerulean, great suggestion, and actually I was able to use the same form for л to make a far nicer lowercase A, so that makes three characters sharing that shape.  Is the t now more or less what you were thinking of?  My only Russian friend (who I only used to check and see if the letters are readable) didn't even seem to notice it, and it looks a bit nicer spacing wise.</p>
      <p>Paul/JT: how is the к now?  I think now I might have made it too much and it might stand out too much.  And just to JT: I've added in some of the other Cyrillic letters (the first six lines on the Unicode charts which I think covers all current-use native-Slavic Cyrillic letters).  Some of those capitals were interesting, and although I'm sure they're mostly unreadable, I suppose I can take comfort in the fact that most latin fraktur capitals are unreadable to English speakers :-)</p>
      <p>I've also finally come up with a name for the font, Ælbrocan.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
