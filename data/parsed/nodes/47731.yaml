    <p>I happened to be rereading the Shark thread and thought it might be interesting to try to do a design experiment making a would-be (since as far as I know Cyrillic never used anything resembling fraktur or other blackletters) Cyrillic font based on my previous fraktur work.  I've seen a few examples of Cyrillic frakturs but very modernized, more like a updated blackletter for English (where the x would be an x, instead of an r with a tail, etc).  So, I figured I'd make an attempt at what Cyrillic fraktur would have been back in the day.  Although I realize the almost impossibility of doing this for the capitals (though certainly an interesting experiment), I figured I'd go ahead and see what I might come up with for lower case.</p>
    <p>Not being a cyrillic user, I'd really like to hear people's comments, both on what works and what doesn't and maybe other avenues for exploration.</p>
