      <p>I've been toying with the idea of designing a Russian blackletter, whenever I have about a month of free time (i.e., not for years probably). This is a great effort in an akin type, especially from someone with no Russian background. I only have two semesters of Russian behind me, but I think I can help you. My main suggestion is to base the minuscules off of cyrillic script (handwriting) style characters, not the roman characters you always see in modern serifs. I don't know how much you know about this stuff, but cyrillic italics are still based off of the handwriting letterforms rather than the roman-modern-type ones, so you can look at a handy cyrillic italic to learn what these letterforms are. In a font like this, very kindred to handwriting, I expect the forms immediately to be of the handwriting type, and it's jarring to see them based off the serif forms. Probably the letter that throws me off the most is the em; it reads as a te, because a handwritten te looks exactly like that em. After that, the te strikes me more as a 7 than a te, and could even be mistaken for a che. The zhe seems too busy, maybe. The pe would read better if it looked exactly like your latin m. The de would work better in one of two forms: like an ð with no crossbar, or else like a single-story g--both of these read clearly as a de for cyrillic readers. The ve could be based on an e, with the outstroke coming back up to the bowl--that's a form I've been thinking should work for my possible blackletter. And your ya ought to be derived from the ah, because it started out as an ah with an i attached before it. This would fix the chirality issue it has. Other than that, your lowercase works very well, and would be really interesting to read in, if I could read Russian for any respectable length of text. Heck, I suppose it's still pretty interesting, even at my amateur fluency.</p>
      <p>The capitals are mostly a ton of fun. Occasional ones look a bit awkward, like the Zhe. The En isn't working at all; it needs to have two vertical lines and a crossbar, because  the "h" form isn't recognizable to cyrillic readers as equivalent with the "H" form. The cyrillic En derived from the Greek Nu, which of course looks exactly like our N. (If I may use a term from high-school biology, the two are an example of convergent evolution, like the similar shapes of insect and bird wings, even though the two evolved along completely different paths.) The El and Em are probably usable, though I'd be more at ease with them if they had no stems (like your lowercase el doesn't). The Te also, while probably legible, could do with some big honkin' serifs of some fashion on the crossbar.  Those serifs are where the "m" form of lowercase te came from, and in handwriting the big serifs are very common. A cursive Te is three vertical strokes, topped by a horizontal one. The Pe would follow the Te's design.</p>
      <p>I may have given you more information than you ever plan to use, but hopefully this has been useful to you. I hope you keep it up--I think you may be the first to try this (this statement awaits correction), so you're a pioneer in it!</p>
    html_clean: |-
