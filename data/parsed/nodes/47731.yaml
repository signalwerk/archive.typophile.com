      <p>I'm calling it Ælbrocan.  Brocen is the old English equivalent of fangere (« fratus « fraktur) and since I'm breaking other alphabets other than just latin, so to speak, I added on the prefix Æl (al- in modern English or omni- from the Latin).  Brocan's the participle form of brecan, so we have Ælbrocan — all broken/fractured (but in the sense of broken shaped letters rather than non-functioning).  That and I really like my Æ ligature. :)</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
