      <p>Other than the mass of black (for which Blackletter is named) it shares none of the characteristics of any of the four sub catagories of Blackletter: textura, rotunda, schwabacher or fractur. Granted, blackletter was a derivative of Carolingian but I still don't see the angularity and rigid penshifts.</p>
      <p>Is this something being taught somewhere? Did I miss something? </p>
      <p>Michael</p>
