      <p>Looks nice, but I think someone used to the traditional letterforms would be upset/perplexed by some of your letters (I'm speaking of the miniscules here...the capitals look good, mostly). For one, your ts looks more like an u than the u does. For another, your k looks like an n, and the n, in turn, looks like it was designed by someone used to the Latin alphabet, which might be a bad thing. </p>
      <p>You know, if you just switched the u and ts characters, it'd work a lot better, I think, as well as making the k definitely a k and the n definitely an n...</p>
      <p>Just figured I'd put in my two cents, since I took five semesters of Russian in college. </p>
      <p>Also...Russian Cyrillic isn't the only Cyrillic. Check out the Cyrillic subrange of any Unicode font. There are characters for other languages who use a modified Cyrillic. You might look into modifying your letters accordingly.</p>
      <p>But like I said, it looks cool. I've toyed around with blackletter/fraktur versions of Cyrillic in my notebooks myself.  </p>
      <p>Peace,<br>
      JT</p>
