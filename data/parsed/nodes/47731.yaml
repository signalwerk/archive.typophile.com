      <p>I think this is wonderful exercise, and there is much untapped ground in the realm of Cyrillic blackletters!</p>
      <p>As a Russian I found lowercase "el" "en" "k" "u" and "em" very confusing.</p>
      <p>л - looks like a scripty п<br>
      н - looks like a Latin "h" and has no relation to anything found in Cyrillic<br>
      к - looks like iс<br>
      у - is nearly impossible to recognize as anything but п<br>
      м - looks like a scripty form of т<br>
      ц - looks like either у or ч</p>
      <p>It took me over a minute to decipher the word "унциальному"</p>
      <p>Still, I think this could be a foundation of a really exquisite typeface!<br>
      _____________________________________________<br>
      Personal Art and Design Portal of Ivan Gulkov<br>
      <a href="http://www.ivangdesign.com" title="www.ivangdesign.com">www.ivangdesign.com</a></p>
