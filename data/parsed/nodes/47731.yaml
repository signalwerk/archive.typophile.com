      <p>I think the Л/л should always follow the shape of the Д/д. It's because they derive from the corresponding Greek capitals. This may be difficult with an open top...</p>
      <p>Looking into script forms should give you some insight into how the forms can be made less ambiguous. For instance, a lowercase г becomes a sort of backwards s in cursive. So, for your blackletter г, I suggest breaking the present join and connecting the top of the vertical to the right end of the horizontal with a thin stroke, making a sharp seveny shape.</p>
    html_clean: |-
