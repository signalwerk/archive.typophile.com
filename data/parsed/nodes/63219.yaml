    <p>Perhaps I'm just dense and am overlooking the obvious here, but is there anyway to lock the positions of the vertical metrics guidelines in FLS *without* locking the reference line? (by which I mean the red dotted guideline which is used for measuring sidebearings). View-&gt;Lock Layers-&gt;Vertical Metrics seems to affect both.</p>
    <p>TIA</p>
    <p>André</p>
