    <p></p><div class="imageWrap"><img src="http://typophile.com/files/OTM_370_release_4830.gif"></div><p></p>
    <p>Immediately after its initial release DTL OTMaster (OTM) was hailed as very practical stand-alone application for reviewing and editing tables of fonts with a SFNT ﬁle structure. OTM’s big advantage is that it allows editing of tables in a graphical user interface. As Dr. Ken Lunde, Sr. Computer Scientist at Adobe Systems, stated in 2009: ‘<em>As someone who works with OpenType fonts on an every-day basis, and with the tools that are used to build and check them, I would like to state here that DTL OTMaster is a fabulous tool. The best way for me to characterize it is that it gives me the power of some existing command-line tools, wrapped up in nice GUI. It handles CJK fonts well, including those with a large number of glyphs. I especially appreciate that there is a Mac OS X version.</em>’</p>
    <p>The new OTM edition has version number 3.7, while the previous one was numbered ‘2.4’. In the past two and a half years the functionality of OTM was enhanced and extended, hence the ascending numbering. The new edition is for that reason a major upgrade, containing a lot of new functionality. From the import/export of Ideographic Variation Sequences (IVS) to the editing of Feature Parameters, and from an autohinter for edited or newly added glyphs to support for COLR+CPAL tables.</p>
    <p>Some use OTM for font-spelunking, other use it Open(Type)-heart surgery. Some use it for compiling OpenType Layout features, applying the elegant automatic subsetting, others use it for mark positioning. OTM is the Swiss knife for CFF- and TTF-based OpenType, TrueType, and TTC (TrueType Collection) fonts.</p>
    <p>A listing of the new functionality in OTM 3.7 can be found <a href="http://www.fonttools.org/downloads/OTMA/RM/Read_Me_lb.txt" rel="nofollow">here</a>. DTL OTMaster can be ordered directly <a href="http://www.fontmaster.nl/Shops/FM_Shop/index1.html" rel="nofollow"> here</a>.</p>
