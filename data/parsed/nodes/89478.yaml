  html: |-
    <p>Hi typophiles,</p>
    <p>How big no-no it would be to use the horizontal terminal in "a"? Other glyphs have a angled terminal. In the second image, the "a" is also angled.  Does this look better to you? I'm wondering this because the arm of the "a" points to left, where all similar shapes in other glyphs point to right. So in both cases this terminal of the "a" will differ from the other glyphs. On its own, i think the horizontal "a" looks way more beautiful.</p>
    <p>Which one would you choose? Do you see any other solutions?</p>
