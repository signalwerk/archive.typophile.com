    html: "<p>No intention to do a text face here! I too like my \"a\"s like that, but maybe it's good to compromise in this case as the \"a\" is such a characteristic glyph for the typeface. But just a thought: is it really more consistent to have a one left-pointing angled terminal only in one glyph in a font?  After all, there is numerous horizontal lines all throughout the font, in almost every glyph? Excuse me, I'm just a beginner...</p>"
