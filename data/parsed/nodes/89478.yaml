      <p>You know I like my text "a"s with a soft top, so maybe<br>
      not this particular "a"; I just wouldn't want to see Topy<br>
      put too much weight on consistency. After all the power<br>
      of style is proportional to size, and when you get small<br>
      enough for immersive reading to click, style becomes<br>
      much less relevant; or rather, it moves into the realm<br>
      of unconscious texture, metamorphosing if you will.</p>
      <p>hhp</p>
