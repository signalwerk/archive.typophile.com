    html: <p>A sign painter might be able to help, especially an older one. I don't know enough about the history of various sign writing styles to date it. It was probably painted relatively recently. Paint doesn't last forever outdoors. However, that doesn't mean the style is recent. Old signs get repainted periodically.</p>
