    <p>Address numbers on an old residential hotel on Chicagos south side. The hotel had a popular jazz club located off the lobby and a lot of the building elements are connected to early jazz culture. Wondering what typeface these numbers are. </p>
    <p>Working on a project for the building and would love to find the history of the typeface and see if there is any jazz crossover. My gut says no but I would love to research further.</p>
    <p>Thank you as always for your time and thoughts. I truly appreciate it.</p>
