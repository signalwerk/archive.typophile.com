      <p>Christopher,</p>
      <p>Signpainters who wanted to keep up with the latest trends for many years subscribed to <em>Signs of the Times</em> magazine, which included tips, tricks and new display alphabets every month. The main branch of the city library may have back issues if you feel like going on an archæological dig. This site might help, too:</p>
      <p><a href="http://signmuseum.org/about.asp" title="http://signmuseum.org/about.asp">http://signmuseum.org/about.asp</a></p>
