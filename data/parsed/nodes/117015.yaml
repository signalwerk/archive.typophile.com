      <p>I love this. It's fun to look at, because it looks familiar, yet utterly idiosyncratic. And I agree with @Birdseeding—looking at individual letters, you think it's going to be frivolous, but then when you reach the text block, it's feels totally rational.</p>
      <p>My only note is that it looks to me like the Frutiger /k/ is out of place here—maybe try a broken /k/, or simply add a slight spur or curve to its legs.</p>
