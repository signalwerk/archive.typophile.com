    <p>Hello people,<br>
    I'm asking for feedback on a project I've been working on the past 9 months. Everything started with the <a href="http://www.polidesign.net/it/type" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Type Design</a> course @ Poli.Design in Milan. In a group of three people, we recieved the brief of creating some typeface to be used in high-res starting from a typeface with a low-resolution.<br><img src="/sites/default/files/old-images/prestypophile-02_3474.png"><br><img src="/sites/default/files/old-images/prestypophile-03_6261.png"><br>
    We found this old anatomy book (→ from which the name, "anatomia") printed in the early XX century, set in this ugly scottish face with exaggerated details that made it work in small sizes.<br>
    Our idea was to bring the skeleton, the proportions and some characteristic aspects into a grotesque-formula based typeface, being that the historical evolution of these modern faces. The details used as optical-helping elements in small sizes would become characteristic elements in big sizes (eg. the "a", "R" and "t" end, the axis of the terminals in "c", "a", "f").<br><img src="/sites/default/files/old-images/prestypophile-01_6417.png"><br>
    Need feedback now! I like the brief and the result of the course, that's why I kept working by myself on it these following months. The semi–condensed proportion make me think it's a bit uncertain as a weight, a bit lighter than a standard grotesk–regular. My idea would be to release to the public a regular, medium and bold weights with matching italics, but I know it would be a very long process. Italics sound so funny, though, judging on the italics of thestarting typeface.<br>
    What do you think of it? Please express your thoughts, every little opinion is very appreciated.<br>
    How can this character be fit in the huge range of quirky grotesks?<br><img src="/sites/default/files/old-images/prestypophile-04_6377.png"><br><img src="/sites/default/files/old-images/prestypophile-06_6013.png"><br><img src="/sites/default/files/old-images/prestypophile-05_5365.png"><br><img src="/sites/default/files/old-images/prestypophile-07_5079.png"><br>
    Thank you for any feedback!</p>
