      <p>Thanks for the comments.<br>
      Yes I'm actually working on a more stable weight now, a more medium one.<br>
      @bensyverson thank you, it's a thing I was thinking about with this k. I'll try both the curve or the broken version, I'll keep you updated.<br>
      @riccard0, true I opened a bit the characters. I think I'll fork it to another project that gets rid of its roots (––&gt; the scottish) and tries to give more power to this font's characteristics.<br>
      @hrant a good balance between polished and accentuated would be my goal. Thanks for the practical advice, maybe forking it to another project would do the job anyway.<br>
      @domdib My idea would be to keep this /a/ tail accentuated like other details in a "poster version". But...for the moment I'll maybe compress it a little. Even though I like to give a bit of non-equality.</p>
