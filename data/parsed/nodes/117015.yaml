    html: |-
      <div class="comment-spam-body"><p>The E seems a bit dark. Also, I don't think the exaggerated tail of /a should be causing problems with spacing necessarily. If you see it next to /m the spacing is just about right, but then you have an /e kerned very close to the /m which disturbs the rhythm. I think I would kern some characters a bit loser and kern /a a tiny bit tighter.</p>
      <p>Other than that, I'm absolutely ecstatic to see this!  Others seem initially dismissive but I like the first images as well, but indeed particularly the text blocks. I don't know if this is an appropriate association, but it reminds me of French typefaces. I know that's a very general statement, but a few times I've seen typefaces like these which aren't perfectly balanced but you just know it will look amazing in print. Antique Olive is a fairly good example of what I mean. Coincidentally the few typefaces I've seen which have this kind of atmosphere were all done by French designers. I love this intuitive-rather-than-rational approach. I just commented on one of Alexander Katt's designs which I feel has a similar attitude to the design approach. I feel I need more of that.</p>
      <p>I'm eagerly looking forward to get this typeface. Italics and a bold weight would be fantastic, if you're up to the challenge.</p>
      </div>
