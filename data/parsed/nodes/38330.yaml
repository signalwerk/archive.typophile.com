      <p>I don’t have a word processor; I’m lucky being in the design business that I have Adobe InDesign on my computer, and that’s what I use to compose personal correspondence. As to the typeface, I use, at various times, Elysium, Centaur, Bembo, Garamond, Goudy Old Style. The italic of some fonts (such as Goudy Old Style) is particularly readable and you may find these warmer and more informal than the roman. Also, if you set the text ragged right, it won’t seem as cold and formal as fully justified.</p>
      <p>The trick when using proportional typefaces for correspondence, if you’re putting them on 8.5” x 11” paper, don’t make the text column six and a half inches wide. Four inches is much easier to read. I push this narrower column to the right and use the wide space on the left for drawing cartoons, printing pictures, recipes, etc.</p>
