    <p>I don’t know much about typography, and I certainly wouldn’t begin to try and work out a font on my own.  But I do know that I really don’t like the fonts that get pushed on me from corporate America.  At least not for my printed, personal correspondence.  </p>
    <p>I don’t like Arial, I don’t like its successor, Calibri; and I hate using both in my personal correspondence.  I understand they look good on a myriad of computer screens, and thus will be the standard for e-mail for years and years to come.  I can live with that. But I actually still have people that I post written letters to, and am wondering if there are any really great alternatives.  </p>
    <p>My handwriting is atrocious, which makes reading letters from me more of a chore than a pleasure.  The reason I send certain things via snail mail has mostly do with the audience.  Most are old enough to remember when choosing Courier, Elite, or Pica was a revolution in convenience.  These are also people that I like to make a connection with, and would actually take the time to sit down and hand-write a letter if the result ever turned out legible.</p>
    <p>I guess I’m looking for a font that somehow conveys a certain warmth, familiarity, and homeyness.  Something that feels friendly.  Is that possible?</p>
    <p>I’ve played around with some scripts and handwriting fonts, but these seem either faked, forced, or are just hard to read. I’ve looked at some fonts that remind me of newspaper and book type, and like these better - I guess because I am a reader and these feel comfortable - but they also don’t seem very personal or personable.</p>
    <p>So, for all of the people here who obviously embrace typography as either a vocation or avocation, what do you use in your everyday correspondence, assuming you haven’t completely gone over to the dark side of electronic correspondence?  Do you just use Arial, or have you found something that feels a lot more personal?  What is in your word processor?</p>
