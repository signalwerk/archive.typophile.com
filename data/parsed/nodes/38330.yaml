      <p>For email, I use 14 pt Helvetica. Maybe I’m getting older—well, no maybe there—but my eyes find that larger-sounding size more comfortable. I guess I’ve just grown used to it; 14 pt does not seem huge to me any longer. And it’s true that sans serif is easier to read on-screen, at the same time that serif type is easier on the eyes on a printed page.</p>
      <p>For paper correspondence, Palatino has been my choice since the day I got my first Macintosh in November of 1989. I have always liked it’s contours.</p>
