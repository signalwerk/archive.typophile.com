      <p>Interesting thread. When I first went out on my own, I purchased and used Filosofia for my correspondence and invoices and other official correspondence. It was fantastic, at first. Then I grew more fond of, yes, Georgia in Microsoft Word. I think I was the only designer in the entire world that actually liked using Georgia because of its legibility in print and on screen. It really is a perfect in so many ways and I still contend that, despite it’s faults, it can look good in print.</p>
      <p>Unsurprsingly, for the past year or so I’ve been using Mercury because it has a nice range of textures and captures a sense, to me, of casual formality.</p>
