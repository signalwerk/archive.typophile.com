      <p>The interesting part of this thread are the responses.  Thanks to all who have posted so far, and to those who still might.  </p>
      <p>I feel Don McCahill’s pain.  I manage my wife’s medical practice, and had to redesign all the patient information forms.  Had I left it up to anyone else in the office, everything would use Arial.  I was real proud of myself for finding an appropriate font for headings and Verdana for text.</p>
      <p>Thanks to Gary Long for the additional suggestions.  I’m thinking that Goudy Old Style italicized is a winner.  Narrowing the print column in my letters: genius!</p>
      <p>I’m still re-thinking some of the fonts that I’m familiar with (eg Helvetica, Georgia) and tracking down those new to me (Brosio, Freight, Apex New, eg).</p>
      <p>Spire: You don’t know what you are missing, man.</p>
      <p>Thanks again.  There are probably three people in town that I could talk typography to (what little I know) and I’m not even sure who they would be. Sites like this are what make the internet great.</p>
