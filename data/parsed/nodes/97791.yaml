  html: |-
    <p>It is a pleasure to announce the release of Aleksei marking the official launch of our new typefoundry: Fatype.</p>
    <p><img src="http://www.fatype.com/img/fonts/Aleksei_B.jpg" alt="Aleksei"></p>
    <p>Designed by Anton Koovit, Aleksei mixes a contemporary design with the traits of a classic text typeface.<br>
    Aleksei comes in four weights, from Thin to Black, all with italics and a large character set including small capitals.</p>
    <p><img src="http://www.fatype.com/img/fonts/Adam_B02_800.jpg" alt="Aleksei"></p>
    <p>Along with Aleksei, we are re-releasing Adam. Previously available through another typefoundry, Adam is an original sans-serif, concceived as Anton's graduation project for the TypeMedia course (The Hague, Netherlands). Adam cyrillic is also available.</p>
    <p>In the coming weeks, we will offer Test versions for free download on our website.</p>
    <p>All our fonts are available exclusively from <a class="freelinking external" href="http://www.fatype.com" rel="nofollow">http://www.fatype.com</a><br>
    You can follow us on <a class="freelinking external" href="http://www.facebook.com/fatypefonts" rel="nofollow">facebook</a> and <a class="freelinking external" href="http://www.twitter.com/fatype" rel="nofollow">twitter</a>.</p>
