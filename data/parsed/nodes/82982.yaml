  html: |-
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Dutch Antiqua II_6665.jpg"></div><br>
    I started drawing this Dutch-sort-of text serif. <p></p>
    <p>Influenced by classical 16th-18th century Dutch and French designs by Plantin, Haultin, Fleischmann, Rosart and Fournier, and also drawing inspiration from modern interpretations like Renard, Collis, Dolly and Arnhem. I drew this from the inside out, starting with the counterspaces as an experiment in getting the glyphs to click widthwise.</p>
    <p>This is intended as a book face at 9pt. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Dutch Antiqua_3481.jpg"></div><p></p>
    <p>At this early stage, what I'm mostly worried about is that there may be too many things going on. The caps and lowercase are quite different in style, not sure if that can work. If the two cases need reconciling more, which features should I change? </p>
    <p>Also, do the caps need a bit more height?</p>
