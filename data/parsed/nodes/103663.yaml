    html: |-
      <p>The image is small scale so I can't make out the details of the lower case. A better view of g would be useful<br>
      So here are some possibilities.Triumph is a British product in business since 1903. Perhaps a British font in 1966?<br>
      The letter forms available in 1966 suggest that this could perhaps be a sloped and edited variation of Coronation, Stevenson Blake c. 1937. [designer?]. But the M is not right.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/coronation@20_5634.jpg"></div><br>
      Somewhat similar were Corvinius, designed by Imre Reiner for Bauer 1929-34 which had lighter serif features on T and E.<br>
      Also somewhat similar is Eden, designed by R.H.Middleton in 1934.<br>
      As for the g Coronation or Corvinius might match, but not Eden<br>
      I did not come across any digital versions of any of these fonts as an italic.<br>
      Don<p></p>
