    html: |-
      <p>What I say in the web fonts paper is:</p>
      <blockquote><p>EOT was one of the earliest web font formats and did not initially support all of what is needed to preserve FE. However, more recent changes in both the format and supporting development tools may provide what is needed. Deeper technical analysis of this is needed before a judgment can be made about this format.</p></blockquote>
      <p>Until recently, the only EOT tools available made considerable changes to the font, including removing some important key data, and the tools did not allow otherwise. The WOFF format and tools, however, can be used in ways that preserve FE (Functional Equivalence).</p>
      <p>I suspect that these limitations on EOT, however, may no longer be in place given the right tools. I have no conclusive evidence or examples of this, or that show that EOT fonts can be built in a way that preserves FE. Hence our decision to not take a stand either way for now.</p>
      <p>We would <strong>very much welcome</strong> a clear but thorough technical explanation that shows that FE can (or cannot) be preserved, and would happily add that as an appendix to the web fonts paper. It would need to show specifically how to preserve FE when building EOTs, so that developers can get it right in their tools and build systems. <em>Submissions welcome!</em></p>
