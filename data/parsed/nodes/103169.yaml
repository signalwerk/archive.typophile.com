    <p>Many of you are interested in issues surrounding open font licensing, so you may be interested in how the SIL Open Font License can be used in a web fonts world. There are some difficult issues, but after months of discussion with various industry representatives, we've come to some conclusions.</p>
    <p>Nicolas Spalinger and I, the maintainers of the SIL Open Font License, have posted a draft of an update to the OFL-FAQ (1.1-update3-draft). Although there are many small clarifications and refinements from version 1.1-update2, the main addition is a greatly expanded section related to web fonts. There is also a related discussion paper on Web Fonts and Reserved Font Names that deals with those issues in even more detail. Comments and feedback are welcome.</p>
    <p><a href="http://scripts.sil.org/OFL-FAQ_web_11update3draft" title="http://scripts.sil.org/OFL-FAQ_web_11update3draft">http://scripts.sil.org/OFL-FAQ_web_11update3draft</a><br>
    <a href="http://scripts.sil.org/OFL_web_fonts_and_RFNs" title="http://scripts.sil.org/OFL_web_fonts_and_RFNs">http://scripts.sil.org/OFL_web_fonts_and_RFNs</a></p>
    <p>We hope this helps to bring clarity to some of the many difficult issues related to web fonts and Reserved Font Names.</p>
    <p>Thanks,</p>
    <p>Victor Gaultney<br>
    SIL International</p>
