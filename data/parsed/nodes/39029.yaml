      <p>You don't say what kind of design it is, which might make a difference.</p>
      <p>There's sort of an escalating scale of bigger and bigger character sets one can consider, for language coverage. Semi-independently are some questions of typographic coverage.</p>
      <p>At Adobe, our most basic character set is essentially the union of MacRoman and WinANSI (codepage 1252), plus litre and estimated.</p>
      <p>Some typographic things one might consider as "relatively" standard, depending on the design:</p>
      <p>- having all five f-ligatures (fi fl ff ffi ffl)<br>
      - more fractions, or a full set of numeric numerators/denominators/superiors/inferiors<br>
      - small caps</p>
      <p>For the next step in language coverage, we do "Adobe CE" which includes Windows Eastern European, Baltic and Turkish codepages.</p>
      <p>See also <a href="http://www.adobe.com/type/browser/info/charsets.html" title="http://www.adobe.com/type/browser/info/charsets.html">http://www.adobe.com/type/browser/info/charsets.html</a></p>
      <p>It keeps on escalating after that, but you probably don't want to have 3000 glyphs per font.  :/</p>
      <p>Cheers,</p>
      <p>T</p>
