      <p>Great, you pretty much confirmed my assumptions. I was actually just having a look at my ligures when I read this and was going to make a list of which ones to include-- I've already got the fi and fl, and will add ff, ffi and ffl.</p>
      <p>I also think the small caps/additional numerator/denominators is a good idea.</p>
      <p>Thanks!</p>
      <p>BTW - I've always felt that since the MacOS/WinANSI union already flirts with greek letters so much, an entire majiscule/miniscule greek alphabet should be pretty standard these days in the average font. So many greek letters have so many current uses, especially when it comes to mathematics, programming and engineering, that you might as well go the extra step and round out the alphabet. I might come back for a round 2 with this font of mine and do that.</p>
      <p>Thanks again.</p>
