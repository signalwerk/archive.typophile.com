      <p>I would imagine the person who accepted the font EULA would be responsible for complying with its terms. You are accepting document files, locked for editing, temporarily storing them, and outputting them - you are essentially an output device - think of yourself as a Canon Bubblejet printer. Just as the EULA is not the BJC250C’s concern,  I don’t see how the font EULA could be your problem.  </p>
      <p>PS. Adobe and Microsoft both allow font embedding, with few restrictions. Microsoft’s most recent EULAs specifically call out a users rights to embed fonts in documents as defined by the OpenType spec. </p>
      <p>PPS. Warning: This here legal advice is provided by someone with no legal training on a sunny Friday afternoon in Seattle.</p>
