    <p>I’m sure this topic must have come up on here at one point, but I’m not finding anything by searching, so I appologize if this is a repeat topic.</p>
    <p>     I work for a commercial printer, and we would like to start accepting PDF documents from our clients and the general public and print them.  For example, a small dentist may want to print a letter or invoice for his/her clients.  The issue that I have run up against is the legality of printing fonts.  It appears that in many instances, font vendors/creators (Microsoft and Adobe included) may provide a font with the product that was sold (such as Word) but only allow that font to be used and printed on the machine the product was purchased for.  </p>
    <p>Some vendors state a font can be used in certain ways, but not for commercial printing, unless the commercial printer has a license.  In addition, some fonts have fields- such as fsType that specify whether or not a font is allowed/not allowed to be embedded, previewed and printed, or edited.  But then in many instances it seems contrary to the statement of checking with the vendor to verify if a font can be printed.  For example, from fonts.com EULA, it states:</p>
    <p>“14.  You may take a digitized copy of the Font Software used for a particular document, or Font Software embedded in an electronic document, to a commercial printer or service bureau for use by the printer or service in printing such document but only if the printer or service bureau represents to you that it has purchased or been granted a license to use that particular Font Software.”  </p>
    <p>     The fact is that we would not purchase any fonts/licenses for our servers, especially given the wide range of fonts, costs, etc and the number of servers these files could pass through before they are actually printed.  Furthermore, it seems that many font vendors/providers have similar EULAs so it could quickly become cost ineffective to try and obtain all possible fonts (or even try to contact the software vendors for each possible print job).</p>
    <p>     Does anyone know what would make it legal to print via a PDF document or if it is legal by embedding the fonts and what makes it legal?  How have companies like Fedex/Kinkos/Staples/Office Depot avoided huge lawsuits in this matter if it weren’t legal?  Are there previous legal cases to establish a basis from?</p>
    <p>     Personally, I couldn’t imagine why someone would purchase a font or product if they couldn’t take it to a commercial printer.  It seems to be a huge can of worms that I wish I hadn’t been stuck with.</p>
