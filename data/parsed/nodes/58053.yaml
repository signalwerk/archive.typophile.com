      <p>I think if it’s a locked PDF it isn’t an issue at all. Personally I don’t care much if it isn’t allowed. If outputting a PDF or embedding fonts in a PDF would be prohibited by most foundries (or even some), it would basically be impossible to get something printed these days, as most printers have a PDF-workflow.</p>
      <p>I can’t think of a specific example, but it’s very probable that I’ve embedded fonts in PDF’s when it wasn’t allowed in the EULA.</p>
      <p>And, as Tiffany already mentions, it’s usually a case of previewing and printing only anyway.</p>
