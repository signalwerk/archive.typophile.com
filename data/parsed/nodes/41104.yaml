      <p>Back to the original post Haley - I don't know who they polled but I question these results.</p>
      <p>Accordion is extremely popular in the Midwest (polka) and anywhere near the Mexican border.</p>
      <p>Bagpipe I can buy - it's very foreign to American ears - although - one of the coolest moments in my Halloween memories was when I came home from work and heard bagpipes wafting through the air. I thought someone was trying to scare the kids but it turns out that there was a lone piper standing on a hill about 1/4 mile from my house. That is the way bagpipes are supposed to be heard, like when they pipe at the castle in Edinburgh at sunset.</p>
      <p>Tuba - well - yes although I love it.</p>
      <p>Same with operatic soprano.</p>
      <p>Raps and cowboys? Rap and country music so far outsells rock these days that it isn't even close.</p>
      <p>Holidays? White Christmas is gigantic.</p>
      <p>So I think they should retitle their song "The Song of the People". :)</p>
      <p>No matter what they call it, I'm not about to listen to it.</p>
      <p>pbc</p>
