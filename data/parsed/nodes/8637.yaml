    html: <p>The maple leaf seems small for the size of the white outline. It chomps into the leaf like an insect would. That poor little stem is almost cut off.   <br> <br>Reducing the "eh" or enlarging the leaf (maybe rotating and only showing a portion of it) would eliminate the eaten leaf effect.  <br> <br>The  list at the bottom shouldn't start with a hyphen, and I'm not sure hyphens are a good choice for separators. If you do use them, they should only be between items and evenly spaced.</p>
