    html: <p>I agree with Darrel and Daniel's suggestions, but would also like to see you revise your typeface choices. Your logo face is between a print and a script, in that limbo with Comic Sans. Maybe try using your own handwriting or creating a few custom letters in Illustrator. On the other extreme, the body copy on the right just looks transcribed. Try exaggerating the sizes; you can read down to 7 or 8pt comfortably with quality printing. <br> <br>I'd like to see some iterations with more playful placement of the card's elements.</p>
