    html: <p>Hi Troy, <br> <br>Just a note on material type. Even though I started off with the intent of going with a plastic card, I eventually decided to go with a translucent paper. My main reasons for the switch were to facilitate a faster printing time, to reduce costs, and because I wasn't 100% comfortable with completely clear cards. <br> <br>My concern was that in a business card folder or a stack of cards, my card might 'disappear' when the the card behind it shows through. I was a little worried that my card would be too much like a chameleon, blending in with the background... <br> <br>Since your card has a large, colourful logo with a white border, this effect might be mitigated, but I can tell you that I've had tonnes of compliments with my translucent cards (I don't think I've suffered because of the switch, in any case.) <br> <br>Also, on the design of your card, I would agree with the comments suggesting sizing down the elements to increase the amount of white space. Also, you might try swapping the position of your name/title and your address. I think a more central location on the card would give your name more precidence over the other elements... <br> <br>Can't wait to see the redesign! <br> <br>-Mike</p>
