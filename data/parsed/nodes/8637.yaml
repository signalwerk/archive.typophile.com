  html: <p>Hello! <br> <br>I have a small business I do on the side which is graphic design and websites. I am in the process of creating a business card for myself. I would like to do it on clear plastic like Mike Haska did in a previous post. <br> <br>The blue area is going to be clear. This will allow the white border/stroke around the 'eh' to stand out and the white stripe at the bottom to also stand out. <br> <br>I am going to print the white stripe at the bottom on the back of the card to give it some depth. I would like to do the same the same for the white around 'eh' but am unsure if that would look ok since it would be on the back. <br> <br>I would be greatly appreciative any comments on my design - layout, design, fonts, etc. Say anything and it will be taken in consideration...  <br> <br>Thanks for the help in advance - Troy <br> <br> <br><img src="http://www.typophile.com/forums/messages/29/62922.jpg" alt="Business Card"></p>
