    html: <p> Hello... this isn't nearly enough but, <br> <br>Didot is one of my favorites... Orginally 1700s by Fermin Didot...  <br> <br>Garamond was designed by Claude Garamond in the 1600s (I think, I think)... <br> <br>Doesn't Harper's Bazaar use Didot, too? </p>
