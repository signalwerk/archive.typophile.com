  html: <p> Hi everyone. It's a pleasure to start my study here with you. my name is Guilherme and I'm from Brazil. I'm doing my monograph about this two fonts, which are used at VOGUE. Yes the fashion magazine. Can anyone tell me of the history of both, their designers, anything? I'll make a compare with both and with the magazine to realise if this two fonts are used in a correct way. <br>I hope that you understant what a need. <br>Thanks <br>God bless you all <br>Guilherme </p>
