    html: <p>Jonathan Hoefler did an ambitious revival of the Didot types for <i>Harper's Bazaar</i>. He also published an excellent specimen for HTF Didot which provides a good deal of historical information about the neoclassical style. You might try contacting Jonathan at <a href="http://www.typography.com" target="_blank"> Hoefler Type Foundry</a> and see if he still has any copies of his <i>Muse no. 1</i> Didot specimen available. <br> <br>-- Kent.</p>
