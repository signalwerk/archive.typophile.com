    html: |-
      <p>A Cyrillic font that follows Trajan's forms slavishly is not really an analog to Trajan, because it cannot say the same thing in that "voice" to Russians. Fonts don't convey their atmosphere so superficially; you need to look deeper - figure out which Cyrillic font says to Russians what Trajan says to Westerners.</p>
      <p>hhp</p>
