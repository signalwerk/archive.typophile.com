      <p>@hrant<br>
      Those are some mighty fine threads there. The question about Trajanic Cyrillics is one of perspective:<br>
      a) Should a designer draw it as the Romans would have drawn it had they had Cyrillic? or<br>
      b) Draw it according to what modern expectations or standards say it should look like? or<br>
      c) Make it match the rest of the glyphs, tradition or expectations be damned?</p>
