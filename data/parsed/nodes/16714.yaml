      <p>Regard to the Regular, the horizontal bar of 'A' looks too low to me, 'C' 'G' little bit too wide, I`d drag the right points of the leg of 'R' some units to the right (nice 'k'). I would avoid 'T' 'W' oblique part, same for bottom right 'Z', '7' and lc '2'. The descender od 'q' could be little bit longer if you cut it that way, or match 'p'/'q' - same for 'b'/'d'. The looping for '8' seems interrupted, '5' '7' too thin in the horizontal parts. '$' is wrong, '€' is wrong, vertical bar of '¢' too thin. 'C,R' in '®,©' need to be bolder and your design.</p>
      <p>Regards,<br>
      AS</p>
