  - id: 113502
    user: 1085
    date: 2006-03-20T12:12:00
    date_raw: 20 Mar 2006 — 12:12pm
    votes: null
    html: |-
      <p>Yes, sort of. When you are in the store, fonts viewed in the list have character set features displayed next to their names. Here an example of Adobe's Kepler to show you what I mean:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/FEX-Kepler-Feature-Icons.png"></div><p></p>
      <p>Kepler Std Light Italic Caption has the following OT Features<br>
      1. An Adobe ISO 2 character set<br>
      2. Ligatures<br>
      3. Euro sign<br>
      4. Small Caps<br>
      5. Oldstyle Figures<br>
      6. Fractions<br>
      7. Ordinals<br>
      8. Swashes<br>
      9. Alternates</p>
      <p>If you double click on the font's name, you can click on "characters" and look at glyphs by Unicode range. In the Private Use Range, you'll see (if you scroll) that the font even includes ornaments inside it.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/FEX-Private Use Area Glyph Table.png"></div><p></p>
      <p>Your fonts (i.e., when you are looking at fonts inside your Library and not inside the store) will not have have character set icons, of course, but you can still look through the fonts character sets and see if there are extra glyphs.</p>
      <p>You will not if your font has Contextual Alternates that work almost automatically (like Zapfino Extra or Bickham Script Pro) unless the foundry has included such info inside the font's description field. If this is the case, however, then you can the font in question's description, or do a search or create a Smart Set, etc.</p>
