    <p>Been trying to give this font a name for a while...</p>
    <p>A classic 70’s ITC style looking font. A bit like Serif Gothic with more of a twist.<br>
    Its a record cover from Ai records and has subsequently been treated with a pattern-like effect hence the image quality of the jpeg.</p>
    <p>Thanks in advance for looking.</p>
