      <p>Diversity is great, provided it demonstrates a consistent design vocabulary, or something like that.</p>
      <p>Sometimes a portfolio should be about showing the full breadth and depth of your abilities, but more often it is to present a sufficiently reliable vision that a potential customer can point to it and say "I want something like that".</p>
