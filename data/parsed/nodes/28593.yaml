  html: |-
    <p>Greetings,</p>
    <p>Wondering if anyone has any suggestions for possible typeface choices for a book about the human heart?</p>
    <p>It’s a small book (size &amp; length) broken down into four sections, that deal with both the rational and irrational sides of the heart. I’m dealing with history, anatomical structure, emotion and symbolism, so I want an inviting typeface that’s appropriate for both rational and irrational musings about the heart. Obviously some connection with the human heart is desirable.</p>
    <p>I’ve been looking at using a sans-serif for the body to give it a more contemporary feeling. It’s not going to be long chunks of copy at once, so I think I can get away with not using a serif for the body. I’ve considered something like Vista Sans or Absara Sans for their contemporary feel and humanist approaches, but I’m second guessing myself now.</p>
    <p>I’m hoping someone can offer some alternate suggestions to get me on track.</p>
    <p>Thanks in advance for any replies.</p>
    <p>Nick</p>
    <p>[edit: I failed to mention that this is meant to be more of a design project than a reference source. I’m somewhat going for style over substance, with a heavy visual treatment. The importance of text and visuals is split 50/50. Having said that, all comments on traditional book design are more than welcome.]</p>
