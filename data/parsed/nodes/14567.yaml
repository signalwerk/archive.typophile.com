    html: |-
      <p>I looked into the docs. Its modifing an “adobe opentype developer kit” like kerning file. All the classes have to pre defined in it. For me it was not very usefull. But the second plugin “ApplyOpenType” was it, since it can activate every feature.</p>
      <p>— from the docs —<br>
      This plug-in is not intended to create the kerning data for an OpenType font but can be used to greatly accelerate and facilitate the fine-tuning of kerning data.</p>
      <p>Note that EditOTFMetrics can only open feature files that contain kerning data, not complete feature files. This kerning data file must contain all the kern class definitions and positioning statements. It can contain no other feature file expressions.<br>
      —</p>
      <p>“specially when wanting to see how kerning looks with OT features applied” </p>
      <p>The kerning is active in InDesign anyway. Of course your special &amp; altnerative glyphs have to be in a kerning class or their own kernings.</p>
      <p>Since I made all my opentypes with this adobe tool, I write all my kernings by hand with an text editor. If you have your standard glyph database you can pre define your kerning classes and most things of the feature code.</p>
      <p>BTW. Hopefully Mr. Phinney will say something about the next release of the Adobe OpenType Dev Kit and these plugins.</p>
      <p>—<a href="http://www.astype.de" target="_blank">astype.de</a>—</p>
