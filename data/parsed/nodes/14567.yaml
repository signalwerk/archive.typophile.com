  html: <p>has anyone used this plugin for InDesign? Is there a reason it hasn’t been updated so as to work with InD CS(2)? It seems like it’d be handy, especially when wanting to see how <a href="wiki/kern" class="wiki">kerning</a> looks with <a href="wiki/OpenType" class="wiki">OT</a> features applied. Or is there another way to do this? Any advice is appreciated.</p>
  html_clean: <p>has anyone used this plugin for InDesign? Is there a reason it hasn’t been updated so as to work with InD CS(2)? It seems like it’d be handy, especially when wanting to see how <a href="wiki/kern" class="wiki link-lost">kerning</a> looks with <a href="wiki/OpenType" class="wiki link-lost">OT</a> features applied. Or is there another way to do this? Any advice is appreciated.</p>
