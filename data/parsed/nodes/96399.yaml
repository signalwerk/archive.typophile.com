      <p>Thank you. That 'narrow'ed it down. It looks more like an ITC Garamond Bold Condensed, further condensed by an additional 85% or so.  There are still some very  minor differences, such as the curvature of the B's top  and the extreme skinniness of the right single quote.</p>
      <p>I guess I never looked far enough down the list when I passed the image to WhatFontIs. </p>
      <p>Thanks again.</p>
