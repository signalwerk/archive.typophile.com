    <p>Disney's newly remodeled California Adventure theme park is publishing a 'local newspaper'. Can someone identify the headline font that reads "Bustlin' Buena Vista St!"  It may be a new unique Disney font, just as the newspaper's nameplate obviously is a unique design.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/BuenaVistaBugleSample_6433.jpg"></div><p></p>
    <p> - HerbVB</p>
