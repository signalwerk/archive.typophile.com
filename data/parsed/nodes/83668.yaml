  html: |-
    <p>I am about ready to pull my hair out!!!</p>
    <p>I have a true type font on my Mac that I absolutely need to use on my PC for some engraving (have to match something in a catalog). I have been trying for two days to copy this font over but without any luck. The font file description even says it's a Windows True Type Font. But, every time I move the font to my PC the file size comes to be 0Kb....no matter HOW I DO IT...but the file size on my Mac starts out around 78Kb.</p>
    <p>I have tried the following with no success:<br>
    -emailed the font<br>
    -used DropBox to transfer the font<br>
    -compressed the font into a .zip file<br>
    -compressed the font using StuffIt into a .sitx file<br>
    -copied font onto a thumb drive to transfer</p>
    <p>I tried searching on the internet for suggestions but everything I read is either outdated, deals with different font formats then what I am trying to copy, or is something I have already tried.</p>
    <p>WHAT AM I DOING WRONG?!!!</p>
    <p>ANY help would be greatly appreciated!</p>
    <p>-Jon</p>
