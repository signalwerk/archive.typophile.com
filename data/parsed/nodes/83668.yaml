    html: <p>You are putting it into the windows/fonts folder, yeah? Because from what I remember, font files on windows pc's (.ttf/.otf whatever) are tiny, meaningless files if you put them elsewhere, until you drag them into the fonts folder and windows reads and installs them there and they become useable. That's probably an obvious comment, but you never know, windows can be weird at times.</p>
