    html: |-
      <p>Another alternative would be my <a class="freelinking external" href="http://justanotherfoundry.com/Mashine" rel="nofollow">Mashine</a>. </p>
      <p>Most of the letter shapes are very similar, or at least there are corresponding alternate characters included. It is slightly more extended, though. This is the result of different approaches of how to deal with the 45 degrees diagonals in the M and N: They naturally lead to a rather wide M and N, so I adjusted the overall width to match, whereas in the above example, the M and N have a rather quirky solution, and W and V had to be "chopped off" but that allows the whole font to have a more conventinal overall width.</p>
