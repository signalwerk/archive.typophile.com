  html: |-
    <p>LeFrançois is a typeface in OpenType format based on 3 series of capitals.<br>
    It seems to be classical but some glyphs show that it's not so conventional.<br>
    It's seems to be a typical French type, that's why its name is LeFrançois (with the accent please !)<br>
    With a particular work on kerning (about 5000 !) and ligatures, you'll be able to compose words as logotypes thanks to capitals and small caps.<br>
    It will be soon available at <a href="http://www.editions205.fr" title="http://www.editions205.fr">http://www.editions205.fr</a><br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/LeFrancois12_5391.gif"></div><div class="imageWrap"><img src="http://typophile.com/files/LeFrancois22_5237.gif"></div><div class="imageWrap"><img src="http://typophile.com/files/LeFrancois32_4008.gif"></div><div class="imageWrap"><img src="http://typophile.com/files/LeFrancois42_4530.gif"></div><div class="imageWrap"><img src="http://typophile.com/files/LeFrancois52_6632.gif"></div><div class="imageWrap"><img src="http://typophile.com/files/LeFrancois62_4750.gif"></div><p></p>
