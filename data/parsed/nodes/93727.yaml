      <blockquote><p>So to see if it's worth $40, you give it away for nothing, then if people find a use for it, what then? You ask them for the $40 to keep the font, and they say "Oh, ok, sure. Here you go."</p></blockquote>
      <p>duhhh! :)</p>
      <p>My point is this - developing a fully fledged typeface family takes a major investment of workload (time &amp; skills, and both have a monetary value). It's often said that developing a face can take, on average, 2 years. I think Gerrard Unger allways uses that average. It's a good one. So that means a number of things, such as, 1) you should get paid properly for your labour, 2) You don't want to work on a face for months/years only to find that not enough real users have a use for it, 3) If you are serious about investing so much time in the design of a face, then also invest some time in unglamorous stuff like 'real world' user testing. Much better than investing all your skill &amp; resources into a finished product only to discover it's a dodo.<br>
      Now... free software can be a tool par excellance for testing and innovating, as you develop a product, and before you launch a commercial version into a competitive market. Large foundries do not need to think like this because the volume of fonts they put to market means they only need a moderate % of stock to succeed, in order to profit *and* subsidise the % that is not profitable alone. Small foundries or independent designers cannot allways afford to go that route; they have tiny subsidies to play with, if the small guys spend too much time developing too many duds they soon go hungry.</p>
