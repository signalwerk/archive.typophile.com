      <p>Hrant,</p>
      <p>The exception doesn't disprove the rule. Jos Buivenga designed an attractive workhorse of a family, and the Dell seal of approval provided enormous cachet. However, the typeface under consideration doesn’t have the same kind of universal applicability: it is exquisitely suited for special occasions, and will therefore have a limited appeal, so the same dynamics that made the Museo family a success will not be in play.</p>
      <p>Giving stuff away may help get your name around, but there’s no such thing as a free lunch. I decided to discontinue giving fonts away on my website after the practice ended up costing me over $800 one year. AT the time, I was paying for metered bandwidth, which would have covered the traffic on my site, but a lot of external sites were hot-linking back to my site, and I paid for them to do so…which proves that no good deed goes unpunished…</p>
