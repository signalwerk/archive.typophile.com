      <p>Oh crap, when I made the thread it gave me an error so I left and forgot about it. Here's the features: <a href="http://f.cl.ly/items/2o0h172l2o471E2S3U1L/HazelnutPro%20Features.pdf" title="http://f.cl.ly/items/2o0h172l2o471E2S3U1L/HazelnutPro%20Features.pdf">http://f.cl.ly/items/2o0h172l2o471E2S3U1L/HazelnutPro%20Features.pdf</a></p>
      <p>It's "pro" (@hrant) because I needed second word to show off small caps and to differentiate it from possible featureless version. Cyrillic is included in the both.</p>
      <p>So it seems the biggest question now is the featureless version and not the $10 range.</p>
      <p>It's not worth charging $1, because download difference between that and $0 is drastic. Revenue - not so much. One thing's for sure – Cyrillic speakers would take the free version. Because for them there's less gain from paying. Redundant small caps and less ligatures/alternates. Also $40 is much more for them than Americans.</p>
      <p>Uppercase and lowercase amounts to about 1/3 of full version. But it's not worth to charge ~$10, is it?</p>
