      <p>Eimantas,</p>
      <p>The 3 keys are 'availability', 'use-ability', and 'cost' (and these are all pegged to 'aesthetics').<br>
      'Cost' - best to just stick with 'get as much $'s as possible'. To do that though you need to get 'availability' and 'use-ability' working for you first. And you will only find out if a font is considered 'useable' if you make it 'available'. It's very much a cat-chasing-it's-tail scenario. I can make 2 valuable (i think) observations about the font you are trying to sell; (1) It's not a design that will start to earn it's living in the highest ranks of type design. (2) If the font was as 'freely available as possible' you would find out how 'useable' it is, aka, is it a font that enough designers want to use? At the moment the best route to guage a font's 'use-ability' is to get it hosted on something like the Google Webfonts server - and get it in front of millions of potential users, who can simply decide to use it, or not. You can (hopefully) create a large user base. Once you have a user base established, you can then more realistically answer the question 'is $40 a reasonable price?' .</p>
