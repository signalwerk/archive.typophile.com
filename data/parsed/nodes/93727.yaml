    html: |-
      <p>"I remember doing work for U&amp;lc, converting their workflow from traditional photo-type to desktop composition. Their per issue typography budget for photo-type was $35,000."</p>
      <p>Wow. That amazes me. We are all pikers these days.</p>
      <p>I really like discounted families -- but for me this is most valuable for "workhorse" rather than display families. Granted, something like Bodoni Egyptian can also make a great display typeface.</p>
      <p>My opinion:<br>
      There's not much difference between $30 and $40. To me it fits in the same range of "a little more than cheap."</p>
      <p>You may find this tacky, but I think your real choice is between $29 and $39.</p>
      <p>And I think you should go with $39 and spend the expected extra revenues on excellent marketing materials that show situations in which this typeface really sings. And also shows how it does paired up with other fonts. For example Idlewild from H&amp;FJ: without their support materials that illustrate the different character the type can achieve, one might have a very one dimensional view of that design. </p>
      <p>These are just my opinions of course, but I do buy fonts across a range of prices from $1 to $1,000.</p>
      <p>PS: I love how Typophile thinks Bodoni is spelled wrong.</p>
