      <p>People don't respect free things.  They hear the word free and in their minds that means its not worth anything. They might grab a copy, sure, but they won't respect it. They're not gonna run and tell all their friends about the free things they got, they're going to brag about the thing they had to save up for months to afford.  In order to create value in a customers mind you have to charge them something.</p>
      <p>Currently I'm trying to figure out where the line is drawn between undervalued and overvalued.  My guess is somewhere in the $9.99 to $19.99 range.</p>
      <p>Also, believe it or not, the lower you price your goods, the more problems you'll have with your customers.  On the face of it it seems ridiculous, what right does someone have to complain about something they bought for a dollar?  Now the guy who bought something for a thousand dollars, he has the right to complain and ask for favors a bit, right?  But that's just not the way it works.  The cheap customers will bleed you dry, while the big spenders will hardly ask for anything.</p>
