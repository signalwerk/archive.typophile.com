      <p><em>When I first started trying to design typefaces (not that I've been at it for so very long) I resisted copying and pasting anything. I mean it doesn't really go with the "skilled artist credo" does it? It seems lazy at best and downright uncreative at worst.</em></p>
      <p>Yes Ryan, and anything that can cut down the time involved in creating a typeface is surely a good thing unless you like wasting time. Copying and pasting elements to use as a base for something else is an essential part of the workflow.</p>
