    html: <p>When I first started trying to design typefaces (not that I've been at it for so very long)  I resisted copying and pasting anything.  I mean it doesn't really go with the "skilled artist credo" does it?  It seems lazy at best and downright uncreative at worst.  But I came to find out that "making everything the same that can be made the same" is really the way to go in type design.  Too much eccentricity, to many differences, can really make a typeface awful.</p>
