      <p>Copy and paste things, but then look at them and identify what might need to be changed. Refer to your sketches for helpful differences that may have come by instinct when drawing.</p>
      <p>Let's take the b and p on your blog for an example. You might start by vectorizing the p. The bowl is not vertically symmetrical, nor should it be. The first thing you should conclude from this is that the b isn't going to be made by flipping the whole p. Instead, leave the bowl where it is, chop off the descender, and create the ascender. Are you done? Maybe. But maybe you've preserved some of the pointiness I see at the top of the bowl, which relates to the tops of the m and n shapes. Is that appropriate for the b, whose stem does not start in the same place? Look at your b sketch, you may want to round the top of the bowl more to match that sketch. What else is different about your b sketch? It's a lot heavier in the lower right. Is that a mistake, or is that something that actually helps the b read better, even if you didn't know you knew it? Even though I'm suggesting the latter, it comes down to you to decide for yourself whether it is or not.</p>
      <p>And after changing one shape to look like another, you might be thinking, "Well, I should have just traced the two separately, then." But you've deliberately chosen the ways they are different, and avoided as much work that would be needed instead to adjust them so that they are the same in the ways you want them to be the same.</p>
