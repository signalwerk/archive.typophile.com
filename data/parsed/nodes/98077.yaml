    <p>Hi all,</p>
    <p>I'm in the process of creating my first font and was wondering if you (more experienced) guys could answer me a quick question: how much cut and paste is ok? What I mean is this: can I simply re-use my b for p (and q), or n from h, or r from n and so on. (I documented some of this in a blog post <a class="freelinking external" href="http://www.doppel-n.com/2012/11/13/update/" rel="nofollow">a blog post</a>, if you are interested.) Should design every letter from the ground up or can I use this kind of shortcut?</p>
    <p>I'm not sure if this kind of copy and pasting is messing up the rhythm of the font or if it is actually standard practice. </p>
    <p>Thanks, HP</p>
