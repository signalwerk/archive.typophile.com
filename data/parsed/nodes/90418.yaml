    html: |-
      <p>The question is (for example in that setting*), does the<br>
      designer want the different sizes to convey -as much as<br>
      possible- the same feeling? Because -when they're from<br>
      the same font- they can't, since all details are rendered<br>
      very differently. And there's also a technical dimension:<br>
      the "g" seems to work OK large, but when it's small the<br>
      bottom loop is clotting.</p>
      <p>* The larger size helps, thanks,<br>
      but the detail is still quite low.</p>
      <p>There's no need to get upset - in fact it's a great<br>
      opportunity to make -and sell- a small-size version!</p>
      <p>hhp</p>
