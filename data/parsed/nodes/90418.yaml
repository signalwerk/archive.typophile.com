    html: |-
      <p>@sim - Thanks for the reference!<br>
      One major problem was the disparity in characters in different sizes.<br>
      Each size was manufactured separately, sometimes with a very large difference in the proportions, and I needed to find a common solution which allowed us to use the font in both large and small sizes.<br>
      The second big problem was the "dot gain" and the poor quality of fingerprint.<br>
      In 1913 the letters were made of soft metal, and they are deformed into small details when using ((((<br>
      I will turn my attention to the problems mentioned by you.</p>
