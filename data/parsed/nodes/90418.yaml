      <p>In principle I agree with you that the division of the specifications (Caption/Text/Display etc.) are better than one universal font for all sizes.<br>
      But in this project, I was not set this mission.<br>
      Therefore it was important try to make possibility for this revival usage in a small (not too small) sizes.</p>
      <p>"great opportunity to make -and sell- a small-size version" - may be later, when I be have a big studio and a lot of people working for me )))))</p>
