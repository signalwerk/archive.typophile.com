    html: <p>Color profiles and the ICC have really been a subject of much dispute ever since the notion of a “streamlined workflow” came about. I work at a large print shop as a pre-press operator, and I prepare files for our offset presses, both being Komori Lithrone 40 models, one six color, and the other eight. All of our equipment is no calibrated, lol. Do not ask me why, but it just is not. It seems that even when things are calibrated correctly, human factors take over, and it all has to do with what the customer wants. Regardless of wether the monitors are calibrated to the press, or the proofing systems, if at the time of press check, the customer is not happy, it will be adjusted on press, or worse yet, re-platted. Most all the files that we get, go through numerous phases of retouching, proofing, and re-proofing. Nothing is ever right, until the client says it is, no matter if the print matches whats on the screen.</p>
