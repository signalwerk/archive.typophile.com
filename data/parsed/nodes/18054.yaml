    html: |-
      <p>I could be wrong but I’m not sure if there’s such a thing as calibrating your monitor for WEB design other than ensuring your monitor is displaying the broadest range of colours by correctly setting brightness/contrast and gamma levels.</p>
      <p>This can be done with the Display Calibrator Assistant (OS X) or the software enclosed with your monitor. As for the preset ICC profiles, I’ve never had much luck with them.</p>
      <p>Another thing to consider is the fact PC and Macs display on-screen colours differently by default. Mac’s use a brightness gamma of 1.8 while PC’s are usually darker at 2.0 or 2.2. Keep this in mind as the colour that appears on your monitor will not appear the same on all monitors. </p>
      <p>For web design, use sRGB colour space! You know that already. :)</p>
      <p>However I work predominantly in print so I use <a href="http://www.colorvision.com/profis/profis_view.jsp?id=101">Spyder</a> to ensure my monitor colours represent Pantone colours as accurately as possible. </p>
      <p>Hope this helps.</p>
    html_clean: |-
