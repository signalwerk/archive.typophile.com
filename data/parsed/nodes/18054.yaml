    html: |-
      <p>Ok. By using the Spyder to create a monitor specific profile, I can cause all my apps to display the images using the custom profile. Note, this isn’t converting the image. I have a third party RIP that also has good profiles so I’m able to A.) fix color casts in photography and B.) give a color correct proof from my own system.</p>
      <p>This allows me to get good results with marginal quality digital photos that come from different sources, and screen correct them so they match. By giving accurate color proofs myself I can show a client what they should expect, and keep the approval process on press more streamlined.</p>
      <p>More detail?</p>
      <p>Clearly on high-end work I let the press do seps from transparency, but on the low-end I can still keep some degree of control and get good results.</p>
      <p>Another non-Spyder option.<br>
      <a href="http://www.gretagmacbeth.com/regionchooser?trgturl=http%3A//www.gretagmacbeth.com/index.htm">http://www.gretagmacbeth.com/regionchooser?trgturl=http%3A//www.gretagmacbeth.com/index.htm</a>?</p>
