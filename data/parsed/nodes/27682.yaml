  html: |-
    <p>It is with great pleasure to introduce to you Font Bros Typography Supply Company - <a href="http://www.fontbros.com" title="http://www.fontbros.com">http://www.fontbros.com</a></p>
    <p>Over 2 years in the making, Font Bros brings the best in display typography to one spot! Our high quality handpicked collection contains the work of many talented independent font designers from around the globe. Using our patented Selectronic, customers can easily find exactly what they're looking for in no time flat!</p>
    <p>We are pleased to launch with fonts from: Font Diner, Astigmatic One Eye, ByAndreas, Mark Simonson Studio, Alphabet Soup, Fonthead Design, Wilton Type, CBdO, Sideshow, Blue Vinyl, Font-O-Ville, Outside-The-Line, Sparkytype, and making its triumphant return to the font world, Fontalicious exclusively at Font Bros.</p>
    <p>Check it out at: <a href="http://www.fontbros.com" title="http://www.fontbros.com">http://www.fontbros.com</a></p>
