    <p>This is my first post... sorry to start off by just asking questions and looking for Font IDs, but apparently, that's how I roll. :)</p>
    <p>I am trying to find two different typefaces. </p>
    <p>The first would be the typeface used in the "district five" logo. I am trying to find the typeface used for the "american advertising association" and word "district". I believe they are the same.</p>
    <p>The second is the Rapha logo. I'm thinking it might actually just be handmade, like the Titleist logo (titleist.com) was... but thought I'd ask.</p>
    <p>Any help you might give would be greatly appreciated.</p>
    <p>Thanks in advance,</p>
    <p>Flickster</p>
