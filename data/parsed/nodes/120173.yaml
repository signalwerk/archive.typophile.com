      <p>Fairly heavy condensed thick and thin lettering with distinctive terminals, and a clean casual but not sloppy flavor.<br>
      Not a lot of digital substitutes.<br>
      Part way there:<br>
       Valjean <a href="http://www.myfonts.com/fonts/solotype/valjean/" title="http://www.myfonts.com/fonts/solotype/valjean/">http://www.myfonts.com/fonts/solotype/valjean/</a><br>
      Emerge BF [An old design called Admiral]<br>
      <a href="http://www.myfonts.com/fonts/bomparte/emerge/" title="http://www.myfonts.com/fonts/bomparte/emerge/">http://www.myfonts.com/fonts/bomparte/emerge/</a><br>
      PAG Club<br>
      <a href="http://www.myfonts.com/fonts/prop-a-ganda/pag-club/" title="http://www.myfonts.com/fonts/prop-a-ganda/pag-club/">http://www.myfonts.com/fonts/prop-a-ganda/pag-club/</a><br>
