      <p>Might be interesting to try and identify the person who did the poster lettering in 1940.<br>
      _VÅRUTSTÄLLNINGEN I NATIONALMUSEUM KONST KONSTANTVERK_ seems to be Swedish for _SPRING EXHIBITION IN THE NATIONAL MUSEUM CONSTANT ART WORKS_ A place to start might be the museum's website <a href="http://www.nationalmuseum.se/" title="http://www.nationalmuseum.se/">http://www.nationalmuseum.se/</a><br>
      Don</p>
