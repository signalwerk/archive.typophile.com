    <p>I'm completing the font I've been working on, and I want to determine which nationalities will be able to use the font according to the characters represented in the font. Users in most of the European countries will have access to the characters they would need if they use the font. </p>
    <p>However, I discovered that the Swiss have four languages, but only the least used (about .5% of the population) uses the Romansh alphabet. My question, if anyone here knows the answer, is... </p>
    <p>Are there diacritics, or digraphs exclusive to the Romansh alphabet that do not appear in other encoding formats? </p>
    <p>For example, I have added digraphs such as Dž (which is Polish I believe) to my font, but I can find no information that tells me there are unique digraphs or characters to the Romansh language. </p>
    <p>Windows Standard (Code Page 1252) alphabet includes characters for the following languages:<br>
    Albanian, Breton, Catalan, Danish, Dutch, English, Faroese, Finnish, French, Gaelic, German, Icelandic, Irish, Italian, Norwegian, Portuguese, Spanish and Swedish</p>
    <p>I can not find a character code format (is that what it's called) for the Swiss Language of Romansh. </p>
    <p>Can anyone help? I would like to be able to say that the font is compatible with the Swiss Languages, but without knowing for sure, I am reluctant.</p>
    <p>Thanks,</p>
    <p>Rob</p>
