      <p>As long as we are talking about written languages in Switzerland, we could also consider the dialects actually used in daily life by the German speakers of Switzerland, which are Alemannic German dialects collectively termed Swiss German. Though they are considered German dialects, they differ so much from Standard German that German speakers from other countries will find them impossible to understand unless they speak an Alemannic dialect themselves.</p>
      <p>The vast majority of German literature in Switzerland is in Standard German, but Swiss German has also been written down through the ages. The <a class="freelinking external" href="http://en.wikipedia.org/wiki/Swiss_illustrated_chronicles">Swiss Chronicles</a> of the 15th and 16th centuries and Swiss Reformation leader Huldrych Zwingli's translation of the Bible were in Swiss German dialects. Martin Luther's variety of German subsequently took over as the standard literary dialect in the German speaking world, but even today you will sometimes see Swiss German written down, e.g. for song lyrics. You can also take a look at the <a class="freelinking external" href="http://als.wikipedia.org/wiki/Houptsyte">High Alemannic Wikipedia</a>.</p>
      <p>There is no official system for writing down Swiss German, which means that people will only use the letters and diacritics that are accessible from the keyboards common in Switzerland. That said, it appears that an attempt at a standardized orthography was developed by Eugen Dieth (I just found out about it now; it's the first time I've heard any of this). His <em>Schwyzertütschi Dialäktschrift</em> (1938) originally recommended the use of letters such as ʃ, ǜ, and ö̀, and a subscript n to indicate nasalization. A 1986 revision of the system replaced ʃ with sch and the subscript n with the the tilde as in ãã and ũ. There is a <a class="freelinking external" href="http://als.wikipedia.org/wiki/Dieth-Schreibung">Wikipedia article</a> about this written in Swiss German with the revised Dieth orthography.</p>
      <p>Frankly, I doubt it is common for Swiss German to be written following this orthography. Most Swiss German speakers are probably not familiar with it. But it might be a good idea anyway to include support for ǜ and ö̀ at least for fonts targeting the Swiss (and make sure you have the grave and tilde accents with the common vowels).</p>
