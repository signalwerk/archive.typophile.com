      <p>Oh boy. This kind of discussion is bound to generate a lot of heat and lead nowhere because no one agrees on the definitions while the dialect vs language distinction is heavily politicized. Human languages didn't develop to produce easily classifiable, discrete units. Even ‘mutual intelligibility’ is a very slippery criterion. For what it's worth, Cantonese and Southern Min are often called ‘dialects’ just because that is the traditional translation of the Chinese term <em>fangyan</em> (‘regional speech’), which doesn't correspond neatly to the usual English definitions of ‘dialect’.</p>
      <p>Here we need only concern ourselves with how the different speech varieties are <em>written</em> using different orthographies, not whether to label them ‘languages’ or ‘dialects’.</p>
