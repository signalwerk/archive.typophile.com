      <p>Neither <cite>The World’s Writing Systems</cite> nor <a href="http://www.ethnologue.com/show_language.asp?code=roh" title="roh">Ethnologue</a> tells me anything. I would not expect highly unusual characters. </p>
      <p>One can feel dirty doing this, but the <a href="http://en.wikipedia.org/wiki/Romansh_language">Wikipedia entry</a> on Romansch shows no accented letters at all. You could be more thorough by just downloading the entire <a href="http://rm.wikipedia.org/wiki/Pagina_principala" title="rm.wikipedia.org">Romansch Wikipedia</a> and sorting all the characters (though this will be polluted by foreign-language entries).</p>
      <p>The pretty amazing <a href="http://www.liarumantscha.ch/data/media/pdf/facts_figures/facts_figures_english.pdf" title="PDF">“Romansch: Facts &amp; Figures”&nbsp;(PDF)</a> can tell you a lot about this and other European minority languages.</p>
      <p>Also, ask the often unsympathetic Michael Everson.</p>
