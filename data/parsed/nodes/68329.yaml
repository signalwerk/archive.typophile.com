      <p><cite>Is Romansch similar to a dialect of another language? I don't speak French, but is not Cajun considered almost a separate language from French?</cite></p>
      <p>Interesting question. Romansch is quite closely related to Ladin, which is spoken by about 30,000 speakers in Northern Italy (Romansh itself has a comparable number of speakers).</p>
      <p>Linguists will tell you that Ladin, like Romansch, is a language in its own right, and will place the two (along with a number of other languages spoken in Italy) in a subdivision of the Romance languages that includes French and Catalan but not Italian. However, all of the speakers of Ladin are in Italy, and it is ultimately related to Italian, as are all Romance languages. So in popular consciousness Ladin will be incorrectly considered an Italian dialect.</p>
      <p>In contrast, Romansch was granted the status of an official language of Switzerland, presumably so the Swiss could have their own distinct official language even if only 0.5% of the population spoke it. So everyone thinks of it as a language separate from Italian, which is also one of the Swiss official languages.</p>
      <p>Not surprisingly, ‘dialect’ classification does not correspond well to political borders . For example, there are some ‘German dialects’ which are actually languages that are more closely related to Dutch than to Standard German.</p>
      <p>Cajun French is still considered a French dialect. It is not unusual for dialects of the same language to be so different as to be mutually unintelligible, but that doesn't automatically lead to them being considered separate languages. There are difficulties with this criterion; there are plenty of instances where dialect A is intelligible with dialect B and dialect B with dialect C, but dialect A is not intelligible with dialect C.</p>
      <p>So a dialect acquiring the status of a separate language is sometimes quite arbitrary. Afrikaans is now considered a separate language, but it used to be considered a Dutch dialect.</p>
      <p>Classifying languages has been the domain of linguists for a long time, well before Microsoft came into existence. :)</p>
      <p>For Romansch the classification goes (according to Wikipedia):<br>
      Indo-European, Italic, Romance, Italo-Western Romance, Western Romance, Gallo-Iberian, Gallo-Romance, Gallo-Rhaetian, Rhaetian, Romansch</p>
      <p>For comparison, Ladin is a Rhaetian language, French and Catalan are Gallo-Romance languages (but not Gallo-Rhaetian), Spanish and Portuguese are Gallo-Iberian languages (but not Gallo-Romance), and Italian is an Italo-Western Romance language (but not Western Romance).</p>
