      <p>The alphabet chart in <em>Mia affonza. Fibla sursilvana</em>, a Romansch primer published by the Administraziun cantunala da mieds d’instrucziun in Cuera [Chur] doesn’t show any diacritics or digraphs. Quite the contrary, the spelling does without k, w and y.<br>
      Note however that this primer is in Sursilvan, which is just one dialect within the Romansh family. The book was published in 1965, before the Romansh language was standardized.<br>
