      <p>What they probably mean colloquially by "High German" is Standard German, and this is going to be slightly different between the German-speaking countries, just like Standard English is going to have some slight differences in spelling and punctuation between different English-speaking countries.</p>
      <p>Confusingly, when linguists refer to "High German", they probably mean a broad group of Germanic languages; the "high" refers to these languages being spoken mostly in the upland areas of Central and Southern Germany, Switzerland, and Austria, as opposed to "Low German" or "Low Saxon" which is spoken in the low coastal regions. Standard German is High German in this broad sense, but doubly confusingly, so is Swiss German.</p>
