      <p>It may be that "a language is a dialect with an army and a navy".</p>
      <p>I do not accept the converse, and therefore conclude that Southern Min and Cantonese are dialects of Chinese. Since they are not mutually intelligible with Mandarin, from a linguistic point of view, they are separate languages, although related.</p>
      <p>However, Spanish and Portuguese are mutually intelligible, although it is possible, with careful choice of vocabulary or grammatical forms, to compose Portuguese sentences which are not comprehensible to a Spanish speaker. While many would defend Cantonese and Mandarin as two different languages, and refuse to accept that "a dialect is a language without an army and a navy", few would deny the statement in its original form and attempt to claim that Portuguese is a dialect of Spanish.</p>
