      <p><cite> Confusingly, when linguists refer to "High German", they probably mean a broad group of Germanic languages; the "high" refers to these languages being spoken mostly in the upland areas of Central and Southern Germany, Switzerland, and Austria, as opposed to "Low German" or "Low Saxon" which is spoken in the low coastal regions. Standard German is High German in this broad sense, but doubly confusingly, so is Swiss German. </cite></p>
      <p>This is a good illustration of the Army-and-Navy concept.</p>
      <p>The dialects in Germany referred to as 'Low German' are (from a phylogenetic standpoint) more closely related to Dutch and English than they are to the 'High German' dialects, which are in turn more closely related to Yiddish than they are to the Low German dialects. Yet people commonly consider 'Low German' and 'High German' as dialects of a language which excludes both Dutch and Yiddish simply because they are spoken within (though not restricted to) a single country.</p>
      <p>From a purely linguistic standpoint, the distinction between 'language' and 'dialect' is fairly meaningless. Arguments about this type of thing can become rather vehement between peoples and politicians, particularly in regions where new national boundries are being established, but aren't of much concern to linguists since the answers are entirely arbitary (the existence of the debates *is* of interest, but not because the questions being debated are actually of interest).</p>
      <p>André</p>
