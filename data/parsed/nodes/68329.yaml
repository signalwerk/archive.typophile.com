      <p>Wow – I'm no linguist, but I've been speaking Swiss German all my life and this is the first time I've heard about Dieth's system (or about a u-dieresis-grave or o-dieresis-grave used for Swiss German, and not the tilde either). So from a «user's» perspective I can say no, it's not commonly used. Maybe in specialized circles, that I wouldn't know.</p>
      <p>It is rather uncommon for Swiss German to be written down. Of course the examples you cite, Brian, do exist; but we largely think of Swiss German as a spoken language, and most Swiss-German speakers I know (including myself) will not be able to <em>read</em> the language very well except out loud – certainly partly due to lack of familiarity/practice and partly due to the lack of a common orthography. Some people write emails or text messages in Swiss German; but writing in Swiss German per se has a strong «oral» flavor: It tends to feel like something that wasn't originally intended to be written down but told orally, something more spontaneous, less formal, and of course, more localized. </p>
      <p>It's not like Swiss German is taught at schools, it's what people just speak, out in the street. (School language in the German-speaking areas of Switzerland is High German.) Also, Swiss German is also far from being a standardized language. It's sort of a conglomerate of sometimes vastly different dialects – I personally speak Basel German and can have serious problems understanding the «mountain people» e.g. from the Valais (in the South-West) or Graubünden (in the East). That, to me, makes the idea of a standardized orthography for Swiss German (or all Alemannic dialects) somewhat dubitable to begin with. I can read that Wikipedia, but it doesn't «feel» like «my» language, if that makes any sense.</p>
      <p>So with this background, from the perspective of a speaker of Swiss German, I strongly believe that any attempt at an orthography for Swiss German should not depend on any diacritics or special characters not commonly available, because those would just never be used anyway. Perhaps more importantly, I can't recall seeing any special characters used in written Swiss German in «real life», or myself missing any particular characters from the fonts I use in a specifically Swiss context; as long as they include diacritics for German, French, and Italian, plus maybe floating/combining acutes and graves to be on the safe side, it should totally be fine. I wouldn't really see a reason to include the special characters that Dieth proposed in any fonts I make.</p>
