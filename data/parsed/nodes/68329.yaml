      <p>Thanks for that perspective, Nina. Yes, it should really be stressed that Swiss German is rarely written down except in specialist contexts where you want to convey the form that is actually spoken. Sort of like no one writes in the Yorkshire dialect of English, except for documentary purposes or maybe to add local colour in a novel. As I said, the Dieth orthography is completely new to me as well, I only came across in doing some quick research for this thread (not that I am all that familiar with Swiss German; I only lived in the French-speaking part of Switzerland when I was young).</p>
      <p>So any usage of the Dieth orthography will probably be in highly specialized, academic contexts; ordinary Swiss German speakers, on the rare occasions where they might decide to record something in Swiss German, would not use any of these rare letters, and in any case would record their own specific dialect of Swiss German and not any standardized form.</p>
