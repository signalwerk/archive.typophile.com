    html: |-
      <p>I think <a href="http://www.typotheque.com/fonts/greta_grande" rel="nofollow">Greta Grande</a>, by Peter Biľak and Nikola Djurek, would be a wonderful candidate to stencilize to make something with a similar feel.  Although I like it the way it comes too.</p>
      <p>I looked in the Solotype Catalog to see if there was a version of this Bogler design, but nothing even close. I notice two different styles of S in the images posted (45462's S has no serifs, but 45468's does).</p>
      <p>I realize 'Bauhaus' in this instance refers to the design movement and studio, if that's the right term, but in terms of typography this isn't quite what I generally think of. Usually Bauhaus-style is simplified, geometric, rounded, and sans-serif. If I just saw this typeface, I would say 'Art Deco', and of course, they were overlapping time periods.</p>
      <p>- Mike Yanega</p>
