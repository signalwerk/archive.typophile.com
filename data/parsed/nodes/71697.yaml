    html: |-
      <p>This is a wonderful find - it really shows the geometry of the era; how bauhaus thinking was a huge leap forward from 19th century modern types.</p>
      <p>In my research, I found a lot of 19th century moderns influencing types like this - including Renner's Futura Black.</p>
      <p>My <a href="http://new.myfonts.com/fonts/steve-mehallo/jeanne-moderno/" target="_blank" rel="nofollow">Jeanne Moderno</a> fonts are based on ideas from the same era - but without the stencil, and a few more pre-bauhaus humanist elements thrown in.</p>
      <p>s.</p>
