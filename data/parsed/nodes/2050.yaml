    html: <p>I'm pathetic. I've never noticed the distortion in the "Beyond" of "Bed, Bath &amp; Beyond". Sad, but true. I think I must have put it in my "Huh? Whatever..." file the first time I saw it, then never really looked at it again. Simon, the BB&amp;B stores are pretty ubiquitous here in the United States of Generica. Every strip-mall has one, and I'm sure some of the larger malls have 2 or 3. <br> <br>As a mark, I think the alva logo is ok. The problem is, with it being almost-but-not-quite-legible, what do you do with it? The Walkman "W" wouldn't say "Walkman" unless it had the word "Walkman" next to it most of the time; are you going to put the word "AIWA" (in helvetica light) next to the alva mark each time? Won't that look repetitively redundant? And will it highlight the fact that the mark is missing a couple strokes?</p>
