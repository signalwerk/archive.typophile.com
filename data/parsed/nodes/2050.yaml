    html: "<p>Smashing Pumpkins, I like the analogy. (Ofcourse, it's even worse in the UK because it doesn't conjure an image of teenage Halloween vandalism but one of a genteel village fete gardening competition: \"Those pumpkins are smashing Mr. Williams...\"). Maybe someone should post an image of a pumpkin lantern with the aiwa mouth, just to fold everything together again. <br> <br>Seriously though... <br> <br>BJ. How can you assess whether the logo is poorly drawn if you don't know the intention behind the drawing? Are you implying that the designer didn't realise that the second \"a\" was heavier than the first one? The supposedly problematic features of the logo to my mind lend intrigue and, I'll say it again, vibrancy to the design.</p>"
