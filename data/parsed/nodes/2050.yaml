    html: <p>Simon, the difference of opinion is refreshing. I'm glad someone else sees it differently. I would hate for this place to become static itself, where everybody agrees out of fear or with the hopes of fitting in. <br> <br>I think it's easy for designers to get that "not created here syndrome" where nothing they didn't design themselves is cool. I'm always trying to question myself that way; to look at something with fresh eyes. <br> <br>That said, bad design ought to be pointed out and learned from. The opposite of "not created here syndrom" is the "emperor's new clothes syndrom," where the thing must be good since so-and-so did it or since it uses such-and-such technique.</p>
