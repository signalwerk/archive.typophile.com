  - id: 16222
    user: 1014
    date: 2003-11-14T02:43:00
    date_raw: 14 Nov 2003 — 2:43am
    votes: null
    html: <p>Still awake here on the left coast. <br> <br>I think we have a DOO, a difference of opinion... <br> <br>on one side, we have doomed statis, yuck, poorly drawn, and silly. <br> <br>on the other side, we have vibrancy, intrigue, etc. <br> <br>there is no right answer, nothing that can be proven, <br>just opinions that differ. <br> <br>that's good, makes us all think and I find myself <br>learning more. <br> <br>I'll acknowledge that a logo doesn't need to be well-drawn to <br>be effective...but after noodling around in Illustrator, the <br>logo looks much better with a third piece that better matches <br>the first two pieces in weight. <br> <br>I think the weight of the third piece is a mistake, but I can accept the possibility <br>that someone thought it was a good idea. <br> <br>as far as intriguing/problematic logos, I am <br>reminded of this US chain... <br> <br><img src="http://www.typophile.com/forums/messages/4100/20459.gif" alt=""> <br> <br> <br>&gt;&gt; How can you assess whether the logo is poorly drawn <br>if you don't know the intention behind the drawing? <br> <br>If we were to adhere to this notion, then we couldn't <br>judge anything without knowing *what were they thinking*? <br> <br>Is the UPS logo an abomination? Let's ask the firm that did it what its <br> intentions were before we give our critique. <br> <br>Is Mrs. Eaves an effective text face or a loose bicycle? <br>Let's ask Zuzana what her intentions were. <br> <br>Does that make sense to anybody? <br> <br>*** <br> <br>Is the Bed, Bath and Beyond logo poorly done? <br> <br>Did the designer purposely enlarge the OND? <br> <br>I do like the Smashing Pumpkins and admire <br>Billy Corgan's gifts// <br> <br>bj</p>
