      <p>Brush 455 was originally Palette, Martin Wilkie for Berthold 1951, later digitized by Berthold as Palette BQ <a href="http://www.myfonts.com/fonts/berthold/palette-bq/" title="http://www.myfonts.com/fonts/berthold/palette-bq/">http://www.myfonts.com/fonts/berthold/palette-bq/</a> I have not checked, but I expect that the Bitstrean digital was done independently without using anything digital from Berthold.<br>
      Don</p>
