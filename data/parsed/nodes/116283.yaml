      <p>Good call Fivos. BTW I have always appreciated the effort Bitstream put into producing well engineered fonts. Berthold seems to emphasized fidelity to the original metal versions and generally avoided "improvements" consisting of increased regularity.  Slightly different objectives. Both foundries produce superior quality fonts.<br>
      Don</p>
