  html: <p>From London- I am guessing. The text dates it at 1592. I think it is in stone. It might be wood. It is a gold rubbing that I have in my house. This image has been enhanced to help the possible identification. Good luck. I think there are some intersting issues with this specimen.  <br>   <br><img src="http://www.typophile.com/forums/messages/83/6531.gif" alt=""></p>
