    html: <p>Hmm... I was only giving you a suggestion. This is obviously hand drawn letterforms. Do you just want something close? <br> <br><a href="http://www.typography.com/catalog/historicals/index.html" target="_blank"> Historical Allsorts?</a> <br><a href="http://www.myfonts.com/fonts/storm/serapion/" target="_blank"> Serapion?</a> <br><a href="http://www.myfonts.com/fonts/urw/caslon-antique/" target="_blank"> Caslon Antique?</a> <br> <br>The 'W' isn't correct, but <a href="http://www.myfonts.com/fonts/ihof/telegdi/" target="_blank"> this</a> is still interesting. <br> <br>What are you trying for?? Exact match or mood? <br></p>
