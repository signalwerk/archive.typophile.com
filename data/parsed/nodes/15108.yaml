    html: |-
      <p>Bad idea to use FEX with another font manager active. Strange things happen… But they also happened after I disabled/removed FontAgentPro. </p>
      <p>I got the impression that FEX and Konfabulator don' t like each other, or maybe it's an interface font issue.</p>
      <p>No fun troubleshooting that, so I've gone back to FAP.</p>
      <p>BTW There are some usercomments re FEX that indicate that previews don't function if more that 3500 fonts are in FEX's database.<br>
      And I think that FEX's missing fonts warnings in Illustrator with its automatic activation of the FEX main screen is bad interface. It threw me, completely. But then, maybe I should have RTFM…</p>
