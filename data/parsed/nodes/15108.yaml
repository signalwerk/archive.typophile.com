  - id: 87461
    user: 5971
    date: 2005-09-15T15:50:00
    date_raw: 15 Sep 2005 — 3:50pm
    votes: null
    html: |-
      <p>The installer detects any other font manager and gives you the option to disable it. If you decided not to disable Suitcase when installing FE expect to have a lot of problems. It is not FE's fault. Any two font managers running at the same time on a system will crash, because there will be two apps trying to do the same thing.</p>
      <p>I removed Suitcase X1 from my system and installed FontExplorer X, and I am happy with it. It is faster, with more options and more control, and does the job better.</p>
      <p>Remember that it is still a beta version, so it will have a lot of bugs.</p>
