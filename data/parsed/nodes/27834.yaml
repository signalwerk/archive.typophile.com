    html: |-
      <p>I'm a resident of Springfield. It's an old industrial town and has a huge amount of leftover signage and what not from that time frame. A good slice of a common midwest industrial town. The history in the book is pulled from Wikepedia and has a lot of interesting tidbits. My favorite is that the first official jail was guarded by a black bear.</p>
      <p>Seattle is my next book. Should be cool.</p>
      <p>I also want to do one on old sheet music typographic illustrations. Some nice stuff there.</p>
      <p>--ah</p>
