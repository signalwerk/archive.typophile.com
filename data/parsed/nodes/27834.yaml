    <p></p><div class="imageWrap"><img src="http://typophile.com/files/display_thumbnail_6654.php.jpg"></div><p></p>
    <p>I just published the first of many books to come on the topic of type in our environment. We often overlook some great examples of typography as we go about our daily lives. FOUND focuses in on those subtle examples as well as dramatic ones, such as signs and graffiti. For the first edition of FOUND I have focused in on Springfield, OH and all of the forgotten type that it holds. Next up Seattle, WA.</p>
    <p>Preview and pick up your copy at <a href="http://www.lulu.com/content/379191" title="http://www.lulu.com/content/379191">http://www.lulu.com/content/379191</a>.</p>
    <p>Thanks</p>
    <p>-- Andy</p>
