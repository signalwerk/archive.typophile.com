      <p>Jongseong, people with colour deficiency have an area of confusable colours on the standard CIE colourspace. Within this confusion zone, colour-deficient people (especially the rare ones with one good and one colourblind eye) report seeing some colour other than the ones colour-normal people see. These are the so-called substitute colours.</p>
      <p>Hence, yes, it is of course true that protans and deutans can still see red and can still see green. It’s just that there are many shades of red, green, beige, dull yellow, etc. that may be difficult to distinguish, either in an artificial naming exercise (“What colour is this?”) or just in day-to-day life (your red tie is a bit much with your black shirt).</p>
      <p>—<br>
      Joe Clark<br>
      <a href="http://joeclark.org/" title="http://joeclark.org/">http://joeclark.org/</a></p>
