    <p>Greg Hitchcock wrote <a href="http://blogs.msdn.com/e7/archive/2009/06/23/engineering-changes-to-cleartype-in-windows-7.aspx" title="Engineering Changes to ClearType in Windows 7" rel="nofollow">a rather lengthy piece</a> (so difficult to read onscreen, especially with such lousy CSS) on ClearType in Windows 7. It told me a few new things, like the fact that print-preview screens would tend to use a different method of antialiasing. You’ll be able to turn more things off in Windows 7.</p>
    <p>This is not the thing that interests me. What interests me is the reported results of “an informal and small-scale” survey at a community centre outside the Microsoft compound. Most people preferred ClearType to an identical screen with no antialiasing (“bi-level” in the confusing Microsoft jargon).</p>
    <p>Now, isn’t this like handing people two hardcover books, one typeset in Times (“New Roman”) and the other in Cooper Black, and asking them which one they prefer? I recall another experiment that made similar clearly nonsensical comparisons. Isn’t a more honest comparison between ClearType and what Microsoft calls “font smoothing/greyscale”?</p>
    <p>Additionally, the piece admits that a substantial minority of people want ClearType turned off at all times. You can do that more easily in Win7. But Microsoft here blows another chance to pursue the likely link between colour deficiency (“colour blindness”) and hating ClearType. MS knows all about it, but they haven’t studied it yet. (Have they? They’ve got two paragraphs quite close together in the blog post that mention ClearType hatred and colour blindness, but 2 plus 2 continues not to equal 4 over in Redmond.)</p>
    <p>As for why I think colour deficiency and anti-ClearType sentiment go hand in hand: MS has told me that it tends to be oldschool computer programmers who hate ClearType. They’ve got a lot of those in-house at Microsoft. Red-green colour deficiency chiefly affects males. Most programmers are male. So there are multiple selection biases at work that seem to suggest Microsoft has a large contingent of colourblind computer-programmer dudes on staff who cannot stand ClearType. There are probably good reasons for that; I suspect they are seeing much more antialiasing because red and green pixels have similar replacement colours. “Much more antialiasing” is another way of saying “too-blurry text.”</p>
