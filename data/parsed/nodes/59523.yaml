      <p>I don't have color-blindness. And I haven't seen ClearType on Windows, but my impression of the screen-grabs in the article Joe references is that the ClearType effect distorts letter forms in an uneven manner. This is especially noticeable if one views one's screen just close enough to bring the pixel grid of pure white into focus.<br>
      Might not the anti-ClearType sentiment discussed be a similar aesthetic judgement?</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/clear1_4918.png"></div><br>
      Above, Verdana, set in InDesign on an iMac.<br>
      Below, screen grab of ClearType.<br>
      Note how ClearType adds a little hook-like "serif" to "e", and creates excessive white space between "e" and "a", sacrificing smooth spacing for sharpness.<br>
      Also, there appears to be a little bright "notch" at the outside top left corner of "C".<p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Calibri_3501.png"></div><br>
      Screen grab of ClearType.<br>
      Note how the vertical stem widths vary drastically, an unsettling effect, to which less sharpness but more evenness of stroke width would be preferable.Is this really the way it's supposed to look?<br>
      It is an axiom of ClearType that precise spacing of differently rendered vertical stems (by sub-pixel positioning) is better than irregular spacing of similarly rendered stems--but what if this premise is wrong? <p></p>
      <p>As some letter forms are inherently sharper in pixels than others, so the ideal should be to design letters and rendering technology with that in mind.<br>
      In comparison, arguably the most readable of text faces in print, Bembo, has letters designed with varying degrees of sharpness. When reading, there is no mistaking the sharp triangularity of the serifs at the top of its ascenders, but at the same time, the exact form of the terminal at the top left of "a" is impossible to determine unless closely examined. It seems to me that the terminal of the Bembo "a" is designed to be deliberately vague and unsharp, the better to combine with such different preceding shapes as the ear of "r" or the serif of "y".</p>
      <p>So, the way that sharpness varies in screen display should reinforce typographic logic, not be arbitrary as is the case with that notch at the corner of "C".</p>
