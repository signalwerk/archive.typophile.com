      <p>That's correct. The general idea is that *correct* grey scales can only be displayed using three pixel parts (forming one "whole" pixel), but if it's known in advance in which order the physical RGB sub-pixels are ordered, one can use that to smooth the outline. The color fringes occur because adding more sub-pixels to the left and right (i.e., those of "the other 2 colors") would widen the subpixel, as Nicks image shows.</p>
      <p>The very best explanation, with loads of examples, is on <a class="freelinking external" href="http://www.grc.com/ctwhat.htm" rel="nofollow">http://www.grc.com/ctwhat.htm</a>.</p>
