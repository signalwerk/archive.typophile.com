  - id: 356422
    user: 2969
    date: 2009-07-15T06:33:00
    date_raw: 15 Jul 2009 — 6:33am
    votes: null
    html: |-
      <p>&gt;...way more colour fringing than I ever see in ClearType on my own system.</p>
      <p>Get bigger dots, Join the multitudes! ;)</p>
      <p>And Speaking of Dots, I was curious in skimming the article sited for this thread, at the illustrations. The samples marked as '10point' looked odd, and I also got a wisp of odd motive in the showing of 11point for another font. </p>
      <p>As the article says though, the graphics may not look the same size on your screen, and as has been pointed out, this rendering may not look the same as the users' rendering of the same font in their versions of Windows. </p>
      <p>I count 13 pixels tall and given one more for clearance we have an em of 14 x 7.2 (number of 10 pt fonts per inch) = 100.8 dpi. So what it could say, to be as informative to the widest audience as it wishes to be authoritative, is that this 10 point is shown at a higher-than-average resolution or, alternatively that it is '12point', to the widest swath of the ClearType audience. The best thing overall for a 96 dpi audience, perhaps.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/'scuzecrudegrap_5157.gif"></div><br>
      <em>(top is setting sizes on Mac, bottom is sample from article)</em><p></p>
      <p>(this of course's piled on top of the fact that a screen font's rounded pixel size is  never a whole-numbered point size, unless the resolution per inch is a multiple of 72, which only John has, as far as I know)</p>
      <p>It all could take us to a discussion of 'size' we already had. (and I wish we had meta-Thread mongers in this forum of the quality of the meta-Font-ID mongers we have:-) But the point is, if one is to represent values in points alone, the disturbingly de-educational is not only possible, but likely.</p>
      <p>Overarching this minor issue, and as we all should know in general, is that judging individual sizes of type for excellence in screen font performance (and in particular for the one-size-fits-some use of type on the web), is not entirely dissimilar from judging automotive excellence by a car's performance on one kind of road at one speed. And judging ClearType against b&amp;w fonts is like judging a suburban off-road vehicle against a 5th century apple cart, when a Hummer is standing by, looking for a race...</p>
      <p>Cheers!<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/'scuzecrudegrap_5157.gif"></div><p></p>
