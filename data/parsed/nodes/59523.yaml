      <p>Hey Joe, There was a section in the original draft of that post covering new research on people who dislike ClearType, but it (and other sections) got cut to make the post a little shorter. Greg does point to other blog posts that talk about more rigorous, academic studies.</p>
      <p>The section that got cut talks about research that suggests that people who dislike ClearType are more likely to both have <em>greater than average color sensitivity</em> and poorer than average visual acuity. I suspect that ClearType should be a very good experience for colorblind users, though a rigorous study has not been conducted on that topic. ClearType leverages the fact that we are most visually sensitive in the luminance channel, less visually sensitive in the red-green channel, and least sensitive in the yellow-blue channel. ClearType tries to minimize the error in the luminance channel, while accepting more in the other two. With the two most common forms of colorblindness, it’s not possible to detect error in the red-green channel. It is these kinds of color artifacts that people with good color sensitivity can report that colorblind users will have a harder time detecting.</p>
      <p>In the <em>future research</em> section, Greg specifically calls out that we have plans of improving the ClearType rendering for different visual system characteristics including colorblindness. Knowing that a reader is red cone deficient or green cone deficient, we can improve the luminance contrast of the text with undetectable color error.</p>
