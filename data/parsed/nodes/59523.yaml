      <p>&gt;No one is choosing between ClearType and other sub-pixel rendering algorithms, so there is little interest in investigating this.</p>
      <p>All but one of our clients choosing between CT and Standard (sub-pixel rendering algorithms both!), chose Standard. I suggest there is little interest in investigating this for entirely other reasons than you suggest and have proved that since we started this discussion in 2004. </p>
      <p>The 'minority' of CT haters, (now 17%) has risen from 4% Kevlar marginalized it to in 2004. My experience has found the number to be double what MS says now, or around 35%. Of our users switching from bitmaps, 5% to 10% cannot even look at CT text without becoming physically upset. They say "Ahhhhhhhhhhhhhhhh, Thank You!" when they switch to Standard rendering. :)</p>
      <p>&gt;I suspect that ClearType should be a very good experience for colorblind users</p>
      <p>Since CT scaling and rendering was actually designed by a colorblind developer, I would tend to think it is <em>only</em> good for color blind users.</p>
      <p>&gt;So, the way that sharpness varies in screen display should reinforce typographic logic...</p>
      <p>Right Nick, but with the TT instructions being mostly ignored by CT in the critical x dimension, the typographic logic TT instructions contain is being ignored as well. And that is what's at the heart of all user's complaints, whether they know it, or not. </p>
      <p>Cheers!</p>
