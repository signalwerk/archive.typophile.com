      <p>Presumably the reason that MS prefers to compare aliased letters to ClearType is that at the sizes in question, for TrueType under GDI, the fonts typically turn off standard anti-aliasing anyway. So the "smoothed" (grey-scale anti-aliased) fonts are aliased at those size ranges anyway.</p>
      <p>Cheers,</p>
      <p>T</p>
