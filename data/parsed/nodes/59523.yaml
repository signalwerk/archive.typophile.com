      <p>I'll have to think about this one. I have red-green colour deficiency (deuteranomaly, the most common form), and it has never occurred to me that colour perception could be a factor in how various forms of type antialiasing.</p>
      <p>Even now, I cannot see why colour deficiency would be a drawback for appreciating ClearType. Isn't the principle of subpixel rendering supposed to enhance the virtual resolution, while colour fringes are the unwelcome side effects? What does it matter that I would not be able to distinguish between the red and green fringes very well? Wouldn't it conceivably even have the opposite affect of lessening the 'noise' of the colour fringes, thereby enhancing the effectiveness of ClearType?</p>
      <p>I admit that I don't have a good understanding of ClearType, so I might be missing something obvious...</p>
