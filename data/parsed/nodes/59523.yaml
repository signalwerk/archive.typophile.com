      <p>Joe, you’re worrying about mapping a color blind reader’s perception of color onto a non-colorblind reader’s perception of color. I don’t think a red subpixel and green subpixel are going to look beige or two shades of beige.</p>
      <p>Most colorblind people are lacking either the M-cones (green) or the L-cones (red), and instead have twice the number of the other. These two cones are actually very similar to one another - their response pattern is nearly identical, only slightly offset from one another. Both cone types will respond to any light between 450nm and 650nm. Light from roughly 450nm-550nm will have a slightly higher response from the M-cones, and light from 550-650nm will have a slightly higher response from the L cones. If you’re missing one cone type you can still see light across the entire green-yellow-red range, it’s just harder to tell them apart. In the visual channels (a stage after the cone responses) light from both the red and green subpixels will be seen as brightness (white) in the luminance visual channel and yellow in the yellow/blue channel, but there is no red/green channel. This means that the detection of the contrast between the white of the background and the black of the text is fine, and there is less sensitivity to the color artifacts. </p>
      <p>It’s almost a philosophical question about what color a red and green subpixel will appear, but it will be brighter than beige.</p>
      <p>I am unfamiliar with Joel Pokorny, but other experts in color vision and in optometry agree with my statements above. And informally, I haven’t heard of any colorblind people complaining about ClearType. The most vehement ClearType haters I’ve met do not have color blindness, and usually have very good color sensitivity.</p>
