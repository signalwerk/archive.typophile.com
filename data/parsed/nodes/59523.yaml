      <p>I understand what my esteemed colleague is saying.</p>
      <p>But.</p>
      <p>If we’re talking about preferences and not performance (the sections I was objecting to dealt with preferences), a red subpixel and a green subpixel are going to look beige (let’s say, and probably two shades of beige) to someone with protanopia or deuteranopia (strong or weak).</p>
      <p>The effect is to have two beige subpixels, not a red and a green one. It is my hypothesis that this makes characters look too blurry for this group precisely because the perceptual advantage of one kind of subpixel plus another kind is overwhelmed by a mass of undifferentiable subpixels. I believe this remains exactly the opposite hypothesis from the one you have.</p>
      <p>Elderly people with tritanopia (the rare yellow–blue or yellow–green colour deficiency) would exhibit this phenomenon the least according to both our hypotheses, assuming yellow–blue had the lowest error.</p>
      <p>Now, the interesting thing would be to test real-world performance, because, as we know, people sometimes complain about type they turn out to read quite well.</p>
      <p>As I have explained to my various esteemed colleagues down in Redmond, hire Joel Pokorny to investigate this and you will arrive at definitive answers.</p>
      <p>—<br>
      Joe Clark<br>
      <a href="http://joeclark.org/" title="http://joeclark.org/">http://joeclark.org/</a></p>
