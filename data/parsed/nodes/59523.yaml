      <p><em>It is my hypothesis that this makes characters look too blurry</em></p>
      <p>That may be true, but how much blurryness is too much?<br>
      It's my hypothesis (for several reasons) that sharpness is overrated.<br>
      So I would agree with your advice to, "...test real-world performance, because, as we know, people sometimes complain about type they turn out to read quite well."<br>
      Surely, the best way to do that would be to pit ClearType against Quartz?<br>
      But I doubt Kevin is in a position to undertake such research--what if Quartz turned out to trounce ClearType?</p>
      <p>Actually, I don't think that's likely, because of the "other things being equal" factor.<br>
      After reading <a href="http://www.macobserver.com/columns/devilsadvocate/2003/20030523.shtml" rel="nofollow">this</a> comparison, I came to the conclusion that like much in typography, results are probably document (and device) specific.<br>
      That is to say, it may be possible to determine that ClearType outperforms Quartz in rendering Verdana at a particular size, but for a different typeface at a different size, the result could be reversed.</p>
