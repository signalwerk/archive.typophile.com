      <p>If I understand the objection to my hypothesis correctly, coloured subpixels are so small that almost nobody, including protans and deutans, perceives the colour.</p>
      <p>I could go either way on this. The fringing and blurriness of subpixel rendering is invisible to some people and visible and distracting to others. The question here is: Which of those categories do colourblind people fit into? Then the next question is: Do they have it worse than, the same as, or better than colour-normals? “Having it worse”&nbsp;can be defined in many ways, as by testing performance or asking their preferences. </p>
      <p>Although I know Microsoft prefers to compare aliased or “bi-level”&nbsp;letters against ClearType so that ClearType always wins (instead of testing other smoothing methods against ClearType), I will not unanxiously await publication of genuine research involving colour-deficient subjects. I think Kevlar is perhaps overaccustomed to having his predictions borne out by the research his company funds, but he should be prepared for a surprise. It could, you know, actually happen.</p>
      <p>—<br>
      Joe Clark<br>
      <a href="http://joeclark.org/" title="http://joeclark.org/">http://joeclark.org/</a></p>
