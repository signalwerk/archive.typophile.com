      <p>&gt; The original article suggested MS was willing to work on the problem of smoothed fonts for colour-deficient people</p>
      <p>Joe, I am heavily involved in a project where we are trying to develop rendering that is personalized for each person’s sight. Doing this involves modeling how vision works and optimizing for different capabilities. Once we can make text that we think is optimized for colorblind readers, I will certainly be testing this with colorblind readers. Above I’m arguing that 1) the people that strongly dislike ClearType are rarely if ever colorblind, and 2) the way to optimize rendering for colorblind readers is to allow more error in the red/green visual channel in order to reduce the error in the more important luminance channel.</p>
