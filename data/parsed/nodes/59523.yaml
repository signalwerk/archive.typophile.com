      <p>I realize it's a common misunderstanding, but most people with red-green colour blindness don't see red and green as the same colour.</p>
      <p>It may be impossible to make people with normal colour vision fully understand what I see, but I see red as red and green as green. It's just that they are harder to distinguish. The difference between red and green is just not as marked as that between the difference I perceive between blue and yellow.</p>
      <p>Imagine you are in a very dark room. You can still tell apart the colours of objects, but plainly not as well as during the day. For me, that's what telling apart red and green is like.</p>
      <p>For small specks of colour, it becomes really difficult to tell apart reddish shades and greenish shades. So on the subpixel level, I see how I would be less bothered by the extraneous colour information than people who are more sensitive to colour differences, although I can't imagine the difference would be huge.</p>
      <p>It may be interesting to see how the amount of colour fringing in type rendering affects user preference. This would of course compare different antialiasing methods with each other. As I understand it, there are trade-offs between colour fringing and resolution, so one may have to devise ways to control for these factors.</p>
