    html: <p>Nick, there are several apparent knockoffs of ClearType including Apple’s Quartz and Adobe’s CoolType. There is so much research comparing ClearType rendering to black &amp; white rendering because it was a big deal to change the default rendering for millions of Windows users. Everyone wanted to make the right choice. No one is choosing between ClearType and other sub-pixel rendering algorithms, so there is little interest in investigating this.</p>
