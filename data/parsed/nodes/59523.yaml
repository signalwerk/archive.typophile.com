      <p>Nick: for the sake of clarity, note that the 'in InDesign on an iMac' rendering you show in your screenshot is not Apple Quartz; it is Adobe's InDesign rendering, which differs not only from the Apple system rendering but also from Adobe's Photoshop rendering and Adobe's Acrobat rendering (the latter employs CoolType, which is Adobe's subpixel rendering for LCD screens).</p>
      <p>The variety of rendering engines and models in use today is large. And now we're beginning to see greater diversity of screen display models too, after a long period of relative stability around the RGB LCD devices for the past ten-to-fifteen years. I spent some of yesterday looking at a bewildering variety of display models, sizes and resolutions, and the design of these devices is being driven by a variety of factors, such as power consumption and battery life -- i.e. it is not all about attaining higher physical resolution --: diagonal pixels; chevron-shaped pixels; RGBW (white) pixels; organic fluorescent systems; 'eInk' systems; and more.</p>
      <p>The resolution of small device screens -- notably telephones -- is going up considerably. The resolution of computer monitors is not (and having looked into the attrition rates in high-res display manufacture, I'm not as down on the monitor makers as I used to be). Subpixel rendering is primarily a technology for increasing apparent resolution (at least in one direction), and as such I see it mainly as a technology for what we might consider medium-resolution screen. It produces too much fuzz at lower resolutions (say, less than 110ppi) and it becomes steadily less necessary as resolutions increase upwards. There is a resolution at which I think good greyscale antialiasing becomes the best option, a resolution at which you don't need to use subpixel rendering any more because the full pixel is sufficient to render both shapes and positioning well. I'm not sure where that resolution is. 200ppi? 300ppi? It is going to depend on the reader, just as the resolution at which subpixel rendering becomes preferable to b/w rendering varies according to differing colour sensitivity and visual acuity ... and distance from the screen.</p>
      <p>That last factor -- distance from the screen -- is hugely important. To save my back and shoulder I switched to a 30" monitor a few months ago. The size allows me to sit further back, even when doing detailed work on font outlines. And of course sitting further from the screen increases the perceived resolution. So even though my 30" monitor has a considerably lower physical resolution than my old 17" 145ppi laptop screen, my eyes are on average about 10 inches further away than they used to be, so the perceived resolution is increased.</p>
      <p>I like ClearType, but then I've been using either medium-resolution screens or achieving medium perceived resolution through distance for some time. That is, I'm operating in the range of resolutions in which increasing apparent resolution in the x-direction through use of subpixels has benefit. I have high visual acuity but only medium colour sensitivity (yes, I went and got tested because I wanted to understand my response to ClearType); that's a good combination for ClearType, because I'm not bothered by the colour artefacts. Periodically, I turn off ClearType in order to remind myself that I prefer it: at the resolutions and distance-from-screen at which I work, the b/w rendering of text is spindly and the letter shapes are crude (which is what I get for having high visual acuity).</p>
      <p>Now, this is all highly personal. And that's the point. I should be able to tailor my reading experience to what works best for me, with the full expectation that it might not be what works best for you, either in terms of the hardware in front of you or the hardware in your head.<br>
      ___</p>
      <p>The only other thing I'll mention, vis a vis ClearType, is that it isn't a static technology so when making comparisons it can be important to identify the particular version or implementation of ClearType you are looking at or talking about. Shipped versions, that I know of, are the original MS Reader implementation, Windows XP, Windows Vista, and WPF/DWrite. I'm not sure how the Windows 7 implementation might differ from the Vista version.</p>
      <p>The most interesting, I think, is the WPF/DWrite version, which employs ClearType subpixel rendering and colour filtering in the x-direction and (5-level?) greyscale antialiasing in the y-direction.</p>
      <p>Here's an image to add to your comparison of Verdana renderings.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/verctwpf_4638.gif"></div><p></p>
      <p>At this size, you're not seeing the y-direction greyscale that you would at larger sizes, but you are seeing the significant difference between these two versions of ClearType. Interestingly, in light of your comments about sharpness, the WPF version is less sharp (and hence has notably lower stroke density in some letters). Here's a close-up:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/verctwpf2_5134.gif"></div><p></p>
      <p>You wrote: <em>It is an axiom of ClearType that precise spacing of differently rendered vertical stems (by sub-pixel positioning) is better than irregular spacing of similarly rendered stems...</em></p>
      <p>This is not an axiom of ClearType per se: the majority of shipping ClearType implementations do not use subpixel positioning. The WPF implementation does.</p>
