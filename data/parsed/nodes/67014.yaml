  html: |-
    <p>I'm gathering research for a typeface I'm currently developing based on circles (just want to make sure it's not too close to anything that already exists) — can anyone suggest some typefaces that are based on a circle? </p>
    <p>Obviously there are faces like Avant Garde that are inspired by the perfect geometry of a circle, but can anyone think of more literal examples? A good friend of mine, Rick Banks, has digitised his own homage to Hoffman/Bayer in F37 Form (attached) that is as close as I can find.</p>
    <p>Any help gratefully received...<br>
    Thanks<br>
    M</p>
