      <p>Thanks hrant, just looking through now.</p>
      <p>I admit, it's a challenge (especially with the character v) — I'm treating it purely as a headline font, just as you wouldn't set body copy in Crouwel's New Alphabet, you wouldn't with this!</p>
      <p>The next task will be to find someone to digitise the final design —&nbsp;but that's probably for another forum!</p>
      <p>M</p>
