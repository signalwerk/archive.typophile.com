    <p>Following Asvetic’s advice in an other forum (<a href="https://web.archive.org/web/20080709011157/http://typophile.com/node/34024" title="http://typophile.com/node/34024">http://typophile.com/node/34024</a>), this thread is mostly directed at David Bailey although -obviously- anyone is free to comment. Lately I’ve become very interested in the work of John Langdon &amp; I’ve been trying to make an ambigram myself  to add to my portfolio as well. With little succes so far, so if  anyone can give links, advice, tips,... on how to get started it would be much appreciated. Just for the record, I do know the easiest way to get started is to study other ambigrams &amp; start off your own by writing a copy of your desired word flipped 180° to see what forms you’d be working with. But there are more ambigrams than just the single 180° words. Any usefull information or nice links are welcome.</p>
