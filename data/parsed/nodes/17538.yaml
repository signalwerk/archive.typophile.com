    html: |-
      <p>The nice thing is that beziers are useful for any kind of art, and they’re also ideal for drawing letters.... Add the functions of a type drawing program and you’ve started to design type. If you’ve spent a lot of time drawing or writing letters then you have a head start. Lots of type designers work on shapes in Illustrator and then move them to FOG or FL. I tend to leave Illustrator for times when I just want a single piece of art. </p>
      <p>I just remembered a useful technique you might like: draw a little circle with the circle tool in illustrator, the exact width of your typical outline, stem width, or other repeated feature. Use it as a caliper or gauge for lines you want the same width. It works no matter what angle the lines are, since it’s a circle. </p>
      <p>It’s cloudy in San Francisco as well.</p>
