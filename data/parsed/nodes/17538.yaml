      <p>...excellent tip. I’ve always approached letters from a hand drawn point of view, but sometimes I forget that there are geometric rules that govern the flow of a piece. Looking at my favourite outlines again with this in mind I find obvious relationships between the size of stem widths, flicks and flares and so on, and although I’ve unconsciously rendered these as I’ve drawn, they definately define the fluidity of the piece in the end.</p>
      <p>I guess drawing with a constant reference such as a fixed number of circular guides, or at least tweeking my hand drawn stuff with these tools will hopefully improve the overall flow drastically.</p>
      <p>Thanks again. It’s now dark, and cold.</p>
