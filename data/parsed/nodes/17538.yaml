      <p>Actually that thread might mislead you, depending on what you want to do. </p>
      <p>If you’re not looking to produce working a working <a href="/wiki/font" class="wiki">font</a>, but rather just creating “digital lettering”, there’s no real need to spend $500 on Fontlab. Although its tools might be more adapted to typeface design, it seems to me your work stands between text and illustration, so Illustrator should do fine, in fact it gives more possibilities with color, etc. </p>
      <p>As to how to do it in Illustrator, you should type the text, convert it to outlines and then mess with it. If you don’t already, learn how to draw using bezier curves.</p>
      <p>That’s how I do it, and I figure most people use the same technique for the type battle stuff.</p>
