      <p>Peter,</p>
      <p>Given that you are doing hand work, and may or may not end up making type, consider this: Illustrator and the like have autotracing features. Try scanning your finished artwork at huge resolution and autotracing it. From that you can see how much accuracy the autotrace will give (adjust the preferences), and then from there make small adjustments to the outlines by tweaking. That way you will have real projects to learn the bezier tools with. If you want to move away from autotracing in the future, you can do that organically. There might be pieces you scan and then draw bezier outlines over by hand, like if the art is very regular or simple and sleek.  Meanwhile you can get more of your lettering in digital format so you can color it, move it around, etc. etc. </p>
      <p>One way beziers might be useful to you is if you draw them with the pencil tool in illustrator. It makes the outline for you, which you can then touch up. Using the stroke feature with such outlines, then “outline storke” could take you places. </p>
      <p>Your work blends lettering, painting, decoration, and is very lively and energetic. if you learn to draw with beziers, I hope you will keep the energy and freshness your hand-lettering and sketches have. Nice work!</p>
