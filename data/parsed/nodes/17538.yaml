    <p>Hello gang...Looking forward to getting my feet wet here.</p>
    <p>It’s a sunny morning in East London and finding this site is almost magiK, the font manipulated threads are great.</p>
    <p>I’m dabling in the world of ’type’n’logos’, slowly moving from hand drawn predominantley graff letterforms into the world graphic type. I NEED TO KNOW what software you kind peoples use to edit and mess with the alphabet. I’ve essentially been scanning in my hand-styles and tweeking them in Photoshop, but it’s a long and messy process. </p>
    <p>Would you kindly illuminate my foggy brainstem please, I’ve had a look at some of the design threads and confused myself immediately?</p>
    <p>I’m not interested in creating entire font sets, merely creating letters shapes accurately.</p>
    <p>I’m guessing Illustrator may do the trick partially?</p>
    <p>Many thanks</p>
    <p>P</p>
