      <p><a class="freelinking external" href="http://www.identifont.com/similar?J3V" rel="nofollow">Similars listed at Identifont</a>. There's also <a class="freelinking external" href="http://www.foundrytypes.co.uk/the-foundry-typefaces/sans/params/foundry-gridnik" rel="nofollow">Gridnik</a> but 250£...<br>
      Some more, may be more affordable: <a class="freelinking external" href="http://www.myfonts.com/fonts/scannerlicker/gerusa" rel="nofollow">Gerusa</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/northernblock/scriber" rel="nofollow">Scriber</a>, <a class="freelinking external" href="http://www.fontshop.com/fonts/downloads/fontsmith/fs_sinclair_family_ot" rel="nofollow">Sinclair</a><br>
