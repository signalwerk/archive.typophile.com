      <p>Thank you, erwindenissen. In my example the font does not contain any letters beyond "K", so there are no "L" or "M", but I get what you mean and will take care not to forget that.</p>
      <p>As for "correct metrics", my font does not have regular letter shapes, so I cannot set, for example, the right side bearing to be the same for "n", "h" and "m". For better understanding, think of a symbol font where each glyph contains a unique form. Or hieroglyphs, where each glyph contains a different shape. I gave latin letters in my example only because you have them on your system, and I did not want to include images of my font.</p>
