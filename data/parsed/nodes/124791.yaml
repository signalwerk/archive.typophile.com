      <p>I don't have an answer to your question, but in general reducing the number of kerning pairs by changing the left and/or right side bearings is not a good idea.</p>
      <p>If your metrics are correct, don't change them. If they are not good, then correct them before starting with your kerning.</p>
      <p>Also be aware in your example all other characters that are likely to pair with A should now include the additional 10 units as well, so:<br>
      A +10<br>
      L +10<br>
      M +10<br>
      etc</p>
