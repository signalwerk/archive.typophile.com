    html: <p>Maybe three lowercase dotless i's, to sort of suggest small caps, although that might look like one w. Could you use a less elaborate I from a similar typeface? Some script faces have small caps that you might be able to use, although I don't know of any off the top of my head with the same copperplate cursive look. Is 3rd out of the question?</p>
