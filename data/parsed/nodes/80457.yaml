    <p>Hi folks,</p>
    <p>I'm currently setting type for address labels with the Lily Wang typeface. The name is as follows:</p>
    <p>Robert A. Elling III</p>
    <p>Now, since these are for wedding invites I want to know what's the most proper way and/or best way to do this. Specifically, the tile of 'the third'. So, I'm not fond of the idea of three I swash capitals but here are the other options:</p>
    <p>iii<br>
    the third<br>
    Iii</p>
    <p>I'm not sure how to approach this; so, if anyone has any ideas, your help is much appreciated!!!</p>
    <p>c</p>
