    html: "<p>&gt; I am a far sight better with a pencil and bezier program <br> <br>The good news is that -contrary to what the chirographers will insist- the important thing is to control the boundary between Black and White - which is best done with outlines. When you focus on the relationship between the two edges of the Black instead (GN's \"moving front\"), good notan becomes demoted. You can't have both. <br> <br>&gt; constructed type <br> <br>The modularity you describe is actually not a requisite of synthetic type. Not only that, I would even say that such modularity is a sister to a central tenet of chirography, where the modules arise from the motions the hand favors. This is what I meant by the [unwitting] brotherhood between Noordzij and Crouwel, and how they're both hopelessly superficial. BTW, the punchcutters used modularity too (through the use of counterpunches). <br> <br>Modularity is its own thing (that needs to be controlled). <br> <br>&gt; you must learn how to fix the problems <br> <br>And it's the same for chirography! Think of the \"z\" for example. Or optical compensation (something the GN school never addresses). <br> <br>&gt; people have forgotten how to write <br> <br>They've also forgotten how to forge their own horseshoes. So what? <br>As long as they're leaning new things*, it's all good. <br> <br>* Which I actually agree they're not doing enough, but that's tangential. <br> <br>&gt; Virtually every letter shows the effect of the pen. <br> <br>I wouldn't argue that type has generally reflected the pen (and it continues to do so). Some people even point out that the famous Romain du Roi -which was supposed to be the first synthetic type- was in fact chirographic (at least to some extent). History is not the point, the future is. What does type <i>need</i> to be? <br> <br>&gt; don't forget your pencil. <br> <br>Certainly, but only because the pencil is very different than the broadnib pen: the former creates outlines, the latter merely Black. I use a pencil myself, but only because computer software simpy isn't good enough yet - or you could say I'm not good enough to use it to good effect, since some of the most accomplished designers (like Carter) work directly on the computer. That's totally different than chirography. <br> <br>hhp <br></p>"
