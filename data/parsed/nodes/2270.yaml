    html: "<p>This is not a book, nor authoritative wisdom, but... <br> <br>I find myself saying the same thing very often over in the critique section. So here is my list of some of the top mistakes beginners make. (re: Beginners. I designed my first font less than two years ago, so I'm no expert, but I have spent a rediculous amount of time learning about and drawing letters since then. You will find the learning curve is steep.) <br> <br>Structural Problems: <br>1. m != n != r != u  (does not not equal) <br>2. Stoke modulation problems. I recommend looking at Bodoni. Trace over it with a chisel tipped pen. Notice where it is thick and where it is thin. <br>3. <a href=\"http://www.typophile.com/forums/messages/29/21083.html?1069882058\">The Trapazoid Effect</a> (scroll down to diagrams) <br>4. Width problems. The best advice I know is to look at a lot of type. <br> <br>Optical Problems: <br>5. The mathematical center != the optical center (it's too low!) Trust your eyes not your ruler. <br>6. Two lines of equal thickness one vertical, one horizontal. For them to look the same, the horizontal one will need to be thinned a little bit. <br>7. <a href=\"http://www.typophile.com/forums/messages/29/21083.html?1069882058\">The X Ordeal</a> (scroll down to diagrams) <br> <br>Rather than a book take a class from somebody really good. Surely there must be something happening in london? (Help people, please!). The only resource I know of is Reading. Do they offer weekend workshops? <br> <br>Finally, hang around typophile. Post your work in the critique section! Dont be afraid, thats why its there. Email people privately too. Most everyone is eager to lend a hand. The people at typophile have been so helpful to me as I learn my way around the alphabet. <br> <br>The water is warm. Enjoy! <br>Randy</p>"
