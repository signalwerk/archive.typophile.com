  html: <p>Hi there, first posting here, can anyone suggest a book that will teach me the anatomy of letterforms and type design. I'm a graphic designer of about 10 years standing but have never designed my own face. I did Fine Art at college rather than Graphics and a friend was telling me that on his graphics course they redrew Gill Sans and learnt the intricasies of each letter shape, that's the level of detail I'd like. I'm looking for something very hands on, telling me why different letters are particular widths, relationships between shapes etc. not anything theoretical, historical or overview. <br> <br>Any suggestions? Many thanks.</p>
