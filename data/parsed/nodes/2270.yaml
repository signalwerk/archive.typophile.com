nd I haven't ever heard that is makes a <br>&gt; radical difference in the rate you can read with comprehension. <br> <br>Where have you looked? <br> <br>&gt; 5% <br> <br>I think we can do 15% pretty easily. <br>But even 5% is worth it, when you consider the aggregate savings. <br> <br>And that's not counting improvement via dynamic and non-linear techniques. <br>My hunch is that in an ideal setup 50% is not unrealistic. <br> <br>&gt; There is something beautiful and magical in letters <br> <br>As long we don't think they're Holy - thus stunting progress. <br> <br>hhp <br></p>
