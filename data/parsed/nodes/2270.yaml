    html: <p>&gt;1) What exactly is the basis for this opinion?  <br> <br>Well, I am considering first that people had a very long time with the alphabet and calligraphy to try to make letter forms easily readable. And after all the end test is the person reading, which hasn't changed. And some of the scribes were, very, very good.  <br> <br>The second thing is that I don't see much change in readibility over thousands of years. If you look at a page of the Torah scroll, which has looked the same for probably 2,500 years or so - since they switch to the pen drawn Aramaic script - it is pretty much just as readable as anything today.  <br> <br>The third thing is that changes from the early model of Garamond haven't improved readability, but if anything reduced it. One change with the 'modern' styles of Bodoni etc. which are less readable in text. Another change has been the sans serifs that proliferated in the 20th century; again not a gain but a loss in text.  <br> <br>A fourth thing is that you have different alphabets, and Chinese characters and I haven't ever heard that is makes a radical difference in the rate you can read with comprehension. <br> <br>The basic thing with all of these written language systems is that they are systems of lines in closed or open forms with branches. The brain seems to get used to dealing with one, and is very, very good at decoding.  <br> <br>All this makes me think we are near some limit on what the brain can do, and the problem isn't shaping the alphabet a little differently. <br> <br>What I think we can do is understand better what makes for comfortable reading, and for reading with less strain. Also at the limits perhaps some innovations can really help. These are such things as very small type, signs at night, low res. screens, etc.  <br> <br>I am interested in improving readibility, but all these things make me think we are talking about small improvments. <br> <br>&gt;2) What is "greatly"?  <br> <br>Well, I would be very surprised if you could increase reading speed with the same comprehension by more than 5% by any improvments in type design.  <br> <br>Any improvement is great, and there are also aesthetic considerations, which are very important as well.  <br> <br>There is something beautiful and magical in letters. I just don't think there are any revolutions to come in letters, as there surely will be in science, for example.  <br> <br>All this is explaining a hunch. I don't claim to have any iron-clad proofs.  </p>
