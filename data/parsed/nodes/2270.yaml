  - id: 18128
    user: 1250
    date: 2003-12-04T21:27:00
    date_raw: 4 Dec 2003 — 9:27pm
    votes: null
    html: "<p>Chirographic type is type that is somehow influenced (usually by structure, but sometimes also of finish - think Ex Ponto) by the arm/hand/broadnib_pen system. <br> <br>I don't know of any resource (online or otherwise) that explains the opposition between chirographic and synthetic type. Peter Bilak's Fedra specimen has some stuff. There are resources that elaborate on chirography, but they generally avoid an analytical treatment of the functionality of typography (with good reason). When you pin down a chirographer, he ends up invoking WRBWWRM as an escape clause for functionality. Which is hilarious because chirographers disdain the Emigre/PoMo school. <br> <br>Is the distinction significant? Is <i>type</i> significant? To most of the world, not a bit, so certainly chirography shmirography isn't going to affect the world very much. But we do have to focus on the context of this way in which we've chosen to spend our time, and if we mean to help type progress (instead of vegetate, or even regress), then the distinction is central. <br> <br>Which way of type design is \"easier\"? That's a very rich question. It depends on what kind of person you are. If you feel that control over you own creative process is the primary concern, then chirography is very attractive: it lays downs easy rules that you can follow cheerfully. But if you a) are worried more about the readability at the user's end, and b) are willing to realize that total control is illusional anyway, then chirography is nothing but an artificial limitation. <br> <br>In synthetic type, the rules you need to build (in order to make \"good design\" easier) start form elsewhere. So I would say that chirographic type is easier if you master its rules, while synthetic type is easier if you just don't bother so much with rules (PoMo). In that pairing the former is certainly better. But chirographic type is never very hard, while synthetic type can be surreally hard (by accounting for the true nature of reading), and that's the \"real stuff\" as far as I'm concerned. <br> <br>-- <br> <br>Let me try to give a concrete example: <br>In chirography, the bowls of the \"b/d/p/q\" generally have to be the same way (not identical, I mean structured the same way). In synthetic type, they don't - and this creates a problem: what <i>do</i> they need to be? How to avoid arbitrary results? The answer is: <br>1) Don't have such a phobia of arbitrariness - the control you have is proportional to the control you relinquish. This can be psychologically very hard. <br>2) Work backwards from the process of reading. This is technically very hard. <br> <br>You can see why chirography is so popular: it strokes your ego, and it reduces your analytical load. You can be a free, happy artist, in your own little world of rules. Selfish. <br> <br>hhp <br></p>"
