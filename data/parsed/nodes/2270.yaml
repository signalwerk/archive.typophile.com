    html: "<p>Any cheap felt tip is fine. Use what you have. <br> <br>I continue to point to <a href=\"http://www.typophile.com/forums/messages/4100/modern_caps-7240-18160.pdf\">this resource</a> which shows the modern cap proportions based on the H and E. Also, drawn in a black bodoni for the purposes mentioned. Other tasty tidbits on the chart: decending R foot, cleavage on the R and B, the X ordeal, how to do the thick diagonal on an N, how to do the apex on an A, V+V vs W. Enjoy. <br> <br>As far as the bodoni tracing, maybe don't even trace it. Try to recreate the letters in the chart above using the broad pen. Do the thicks in one thick stroke, the thins in one thin stroke. Dont worry about pretty letters. These won't win any contest, but at least they are *correct* <br> <br>Randy</p>"
    html_clean: "<p>Any cheap felt tip is fine. Use what you have. <br> <br>I continue to point to <a href=\"http://www.typophile.com/forums/messages/4100/modern_caps-7240-18160.pdf\">this resource</a> which shows the modern cap proportions based on the H and E. Also, drawn in a black bodoni for the purposes mentioned. Other tasty tidbits on the chart: decending R foot, cleavage on the R and B, the X ordeal, how to do the thick diagonal on an N, how to do the apex on an A, V+V vs W. Enjoy. <br> <br>As far as the bodoni tracing, maybe don't even trace it. Try to recreate the letters in the chart above using the broad pen. Do the thicks in one thick stroke, the thins in one thin stroke. Dont worry about pretty letters. These won't win any contest, but at least they are *correct* <br> <br>Randy</p>"
