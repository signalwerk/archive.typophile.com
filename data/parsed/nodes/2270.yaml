is actually reflects on the difference between display versus text type, between deliberation versus immersion - that whole network of parallels. <br> <br>&gt;  text faces can only vary about 5% and still be readable and good. <br> <br>What exactly is this benchmark, from which we need to measure? <br>This doesn't work. <br> <br>&gt;  probably all successful text faces, are somewhere in the middle range.  <br> <br>It is tempting to see sliding scale (because it gives you control), but it's an illusion. <br>And what exactly is \"successful\"? <br> <br>BTW, \"synthetic\" is a much better term than \"constructed\", because the latter implies ruler &amp; compass stuff and/or making type by putting pieces together, neither of which is required (or even encouraged) in synthetic type. <br> <br>hhp <br></p>"
