    html: "<p>&gt; chirographic type is a dying art, mainly limited to display at this point. <br> <br>I think you're overestimating the degree to which type has \"matured\" in this way. <br> <br>BTW, just so we're clear: I'm not some cold robot - I value \"humanism\" very much, it's just that since the conveyance of the hand in type <i>is</i> in the end a losing battle, it simply distracts us from the things we <i>can</i> do regain some of the humanity we've been losing since the so-called Englightenment. And I love expressing myself - it's just instead of tangible shapes made by hand, I'm turned on by expressing my thoughts - often in the form of glyphs. When I make a glyph like the \"d\" in my Patria, I'm expressing something to some extent very personal, even though I didn't use the arm/hand/pen system. And I even enjoy using my hands, although I admit I don't do that sort of thing often enough - I think most of the West doesn't. <br> <br>And is this amazing individual somehow acultural? <br><a href=\"http://news.bbc.co.uk/2/hi/south_asia/3253168.stm\" target=\"_blank\">http://news.bbc.co.uk/2/hi/south_asia/3253168.stm</a> <br> <br>-- <br> <br>BTW, about the \"M\": there are some textish fonts with have the outside stems thick and the inside diagonals thin. How can we know that's less readable? <br> <br>-- <br> <br>&gt; poppycock <br> <br>? <br>There's a whole book about it: Saenger's \"Space between words\". <br> <br>I don't know about Hebrew, but Latin was in fact devoid of word spaces before those Irish monks invented it, <i>improving</i> the act of reading immenselty. Why is it so uncomfortable realizing that the level of quality in typography generally improves over time? Do you think it sprung out of some Supreme Being fully formed and perfect? <br> <br>&gt; the big change was from reading aloud <br> <br>Which was precisely enabled by the invention of the word space! <br>Without it reading silently is much slower than reading aloud. <br> <br>&gt; Written language has been fundamental to the growth of civilization. <br> <br>But contrary to what Noordzij would have us believe, its absense does not preclude civilization. In fact I would point out that the most uncivilized behavior seems to come from people who have been literate the longest! <br> <br>&gt; Can you name one change in typography in the past 500 <br>&gt; years that actually sped up reading with comprehension? <br> <br>Nope. The time is ripe! Maybe we can invent something as huge as the word space? <br> <br>The idea of dynamic and non-linear type isn't anything fancy. One idea is to display text on a screen in one spot and refresh the display intelligently. This would remove saccades from the act of reading, thus greatly increasingly comfort. Huge. Keep an open mind, that's the only way to progress. <br> <br>How do you think we advanced from using scrolls to using books? <br> <br>hhp <br></p>"
