      <blockquote><p> sayeth <b>Randy Jones</b>: <br>On a seperate note: It is still important to trace over Bodoni with a chisel nibbed pen.</p></blockquote>
      <p>Firstly, by 'chisel nibbed' you mean something more or less like <a href="http://www.gellyroll.com/products/pens/pigmacallipen/callipen.html">this</a>, no? If so, for purposes of the current discussion  does it differ significantly from, say, a good broad-nibbed fountain pen or the flat tips used with the quill-style pen holders I remember from art classes? <br> <br>If not, then according to the <a href="http://www.typeworkshop.com/index.php?id1=type-basics&amp;id2=&amp;id3=&amp;id4=&amp;id5=&amp;idpic=04#pictloader"> Underware workshop</a> linked from this thread, Bodoni is the result of varying pressure with a sharp-tipped pen, rather than varying orientation with a flat-tipped pen. Or am I missing something? <br> <br><br>
      </p><blockquote> continued <b>Randy</b>: <br>I would also encourage you Setmajer, even if you dive headlong in to a bezier program, don't forget your pencil. You can mess with handles for hours trying for something a pencil would give you in 5 minutes.</blockquote><p></p>
      <p>I agree, of course. I've been working on several things as I have time (logotypes for my own use, nothing of any great interest) and have actually abandoned the computer altogether until I am quite certain what it is I want. Illustrator's pencil tool + a WACOM can be a lovely thing, but I find even that is no substitute for meatspace drawing. <br> <br>I would quibble just a touch regarding speed: hand drawing is no doubt faster for someone with even modest hand skills, but mine are so poor as to make even a rough sketch of a single letterform an hour-long project. :-(  <br> <br></p>
