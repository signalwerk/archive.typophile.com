    html: "<p>Can you provide a close-up view of that scroll? Preferably with some transliteration of a snippet of it. <br>I have a feeling the spaces might be something besides <i>word</i> spaces, but I'm just guessing. <br> <br>Anyway, even if I agree that \"invention\" might not be the best word (kinda like Gutenberg didn't invent jack :-), I can't know if the Irish monks were working from a precendent or not, but I have no reason to doubt Saenger as to the origins of the word space in Latin (and I can't think of any good reasons you should either), and in the context of this discussion it doesn't really matter who did it first: the point is that reading in Latin went through an upheaval between the time words spaces were not used (as we know they were not for over a thousand years), and the time they were (whenever that was, but apparently in the early Middle Ages). <br> <br>Most to the point, there's no reason to doubt that other such <br>leaps in functionality are possible, especially now that we can: <br>1) understand reading much better than before; <br>2) display text dynamically; <br>3) customize the typography to the user; <br>4) track eye movements realtime. <br> <br>hhp <br></p>"
