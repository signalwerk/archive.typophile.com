    html: "<p>&gt;I don't know about Hebrew <br> <br>Now you do know about word spaces in Hebrew, as least as old as this Dead Sea Scroll: <br> <br><a href=\"http://www.loc.gov/exhibits/scrolls/images/psalm-b.jpg\" target=\"_blank\">http://www.loc.gov/exhibits/scrolls/images/psalm-b.jpg</a>  <br> <br>The Irish may have introduced word spaces to Latin, but frankly I am skeptical. In any case it is ridiculous to to call an 'invention' what Hebrew had been doing likely for a thousand years, and which the monks had reason to be well aware of. <br> <br>Hrant, my mind is open on the improvements. I am skeptical, but I am happy that you are taking on the challenge. </p>"
