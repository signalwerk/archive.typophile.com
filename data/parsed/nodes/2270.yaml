      <blockquote><p>informed <b>Randy Jones</b>: <br>The point of the excercise with Bodoni is not to the pen or even the results you produce. The point is to really look at bodoni. To really see where the thick parts are, where are the thin parts. How does it transition between the two.</p></blockquote>
      <p>Ahh. Back when I was studying visual communications at NIU (cheap but decent; most profs also taught at the School of the Art Institute and Illinois Tech) they had us tracing a number of faces, including Bodoni. They did not specify a tool, though, and most of us used pencil for comps and Sakura fine point pens for 'finals'. More recently, I've been drawing them over from the old specimen book as my tracing paper seems to have gotten lost on the road from Chicago to NYC to Bonn, and as I'm moving back to Chicago I've not got the Euros to replace it (I'm a web developer by trade, so this is all hobbyist stuff for me). <br><br>
      </p><blockquote>continued <b>Randy</b>: <br>But yes that pen would work I'd use something even more chiseled. One that would give you a razor thin thin, and a really thick thick. maybe 1 to 5 ratio</blockquote><p></p>
      <p> Do you know of a brand offhand? As I said I'm strapped now, but I'm keeping a list of supplies/books/software to purchase as soon as I'm gainfully employed again. <br> <br><br>
      </p><blockquote>posited <b>Hrant H Papazian</b>: <br>Maybe a felt pen can go "backwards" whereas a fountain pen can't? If so, that's a huge difference.</blockquote><p></p>
      <p> True, and a good broad-tipped fountain pen will, as I understand it, increase or decrease line width relative to pressure like a sharp-tipped pen. Still, it seems to me if one is learning the mechanics of the strokes one could just not go backwards. My concern was that there might be characteristics intrinsinc to the tool, rather than techniques one can refrain from using, which make it pointless to try to 'simulate' the tool with something second-best. Naturally, I understand that second-best is, well, second-best. But better second-best than not at all, no? <br><br>
      </p><blockquote>furthered <b>Hrant</b>: <br>BTW, in the chirographic workspace there are three "dimensions": translation (movement), expansion (pressure), and rotation.</blockquote><p></p>
      <p><i>nod</i> I picked that up from <a href="http://www.letterror.com/noordzij/index.html">Gerrit Noordzij</a>, mentioned earlier in this thread (I do at least <i>try</i> to pay attention, however thick I may seem :-). But I see translation and rotation as two sides of the same coin: both rely on the orientation of a flat- or chisel-tipped pen relative to stroke direction. Expansion operates independently of the orientation of the pen, and in fact does not rely on the pen having a flat or chisel tip at all. Rather, what seems to be important is that the tip tapers at the end so that increased pressure brings more of the tip in contact with the paper. Is that right? <br> <br></p>
