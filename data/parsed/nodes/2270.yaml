    html: <p>&gt;the Irish scribes introduced the word space in the middle ages, thereby enabling immersive reading for the first time.  <br> <br>I read this in Noordzij, but it seems to me to be poppycock. Is there anyone else who says this? The dead sea scrolls have word spacing, and they are more than 500 years earlier. And as there were Christian Hebraists, so the Irish clerics would have know about this. Do we have any roman letter manuscripts from earlier? Is there any reason to think that the Romans never word spaced in manuscript (as opposed to stone inscriptions)? How about cuneiform - was there ever word spacing?  <br> <br>I think the big change was from reading aloud - which was normal because there would be many students or worshipers to one manuscript - to silent reading, which I believe came some time in the middle ages.  <br> <br>&gt;Well, it certainly can't make a huge difference for most of the world's population.  <br>Nothing related to type can. <br> <br>Written language has been fundamental to the growth of civilization. You can't have law without it, for example. And universal education, the foundation of economic growth can't take place without it.   <br> <br> <br>&gt;improvement via dynamic and non-linear techniques. My hunch is that in an ideal setup 50% is not unrealistic.  <br> <br>What do you mean by 'dynamic and non-linear techniques'? Why to you think such dramatic improvement is possible? Can you name one change in typography in the past 500 years that actually sped up reading with comprehension? <br> <br>I hope you're right, but I just don't see it. <br> </p>
