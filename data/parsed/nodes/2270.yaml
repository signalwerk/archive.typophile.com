    html: <p>&gt; people had a very long time with the alphabet and <br>&gt; calligraphy to try to make letter forms easily readable. <br> <br>1) They were essentially concerned with <i>writing</i>, not reading. Remember that the lc letters evolved from the UC through subconscious writing facilitation.* <br>2) They didn't know how we read (Javal made the first breakthrough, very recently), so how could they properly address it? <br> <br>In fact the only pro-readability (more accurately pro-legibility) feature of the alphabet is the force of conscious "heterogenization" to alleviate blatant problems resulting from writing facilitation. For example, in cultures where the numeral "1" is written with a prominent "beak", the numeral "7" is given a horizontal bar to differentiate it. <br> <br>* See "Canons of Alphabetic Change" in The Alphabet and the Brain, p. 133. <br> <br>&gt; the end test is the person reading, which hasn't changed. <br> <br>The reader hasn't physically changed, but that's moot here. And the act of reading is in constant change, sometimes cataclysmic change, like when the Irish scribes introduced the word space in the middle ages, thereby enabling immersive reading for the first time. But more often it's subtle, like when people started reading less books on pedestals and more newspapers on trains. <br> <br>&gt; the Torah scroll ... is pretty much just as readable as anything today <br> <br>The Hebrew script is actually known to be extremely slow to evolve. But Latin has changed a lot, not least since Gutenberg. <br> <br>&gt; changes from the early model of Garamond haven't improved readability, but if anything reduced it. <br> <br>Different time periods have different amounts of respect for typographic quality. Sure, the 19th century mostly sucked, but what about Unger's fonts for example? It doesn't sound right for you to say there's no more room for improvement. That's never been true about anything in life. <br> <br>&gt; Chinese characters and I haven't ever heard that is makes a <br>&gt; radical difference in the rate you can read with comprehension. <br> <br>Where have you looked? <br> <br>&gt; 5% <br> <br>I think we can do 15% pretty easily. <br>But even 5% is worth it, when you consider the aggregate savings. <br> <br>And that's not counting improvement via dynamic and non-linear techniques. <br>My hunch is that in an ideal setup 50% is not unrealistic. <br> <br>&gt; There is something beautiful and magical in letters <br> <br>As long we don't think they're Holy - thus stunting progress. <br> <br>hhp <br></p>
