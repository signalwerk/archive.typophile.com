    html: <p>Wow. Thanks Hrant. <br> <br>If I understand you correctly, your preference for synthetic types is based on a rejection of what you perceive to be arbitrary rules derived from the characteristics of now-outmoded (in the context of lengthy, mass-produced texts) technologies in favor of new rules derived solely from the function of the type.  <br> <br>Is that a reasonable summary? If so, what about limitations imposed by current technology? Are they to be dealt with on a type-by-type basis depending on the intended use of a given design? Or, insofar as most all designs nowadays are executed with beziers drawn on a computer, are there more general rules for legibility/readability that are a necessary consequence of that process? As well, are other old technologies still exerting undue influence on type design (punchcutting, hot metal, phototypesetting, etc.)? <br> <br></p>
