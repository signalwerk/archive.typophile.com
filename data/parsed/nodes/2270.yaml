  - id: 18132
    user: 1250
    date: 2003-12-05T09:58:00
    date_raw: 5 Dec 2003 — 9:58am
    votes: null
    html: "<p>&gt; a rejection of what you perceive to be arbitrary rules derived from <br>&gt; the characteristics of now-outmoded (in the context of lengthy, <br>&gt; mass-produced texts) technologies in favor of new rules <br>&gt; derived solely from the function of the type.  <br> <br>Couldn't have said it better myself! <br>And really, it was \"outmoded\" the second Gutenberg did his thing. <br> <br>As for technology, in any form it always exerts \"undue influence\" - it forces deviations from the [perceived] ideal. But that's life, so we have to work with it (like by using TT hinting to make outline fonts look nice onscreen). However, one thing that we have to mind is potential cultural damage where it does more harm than good, such as the desecration of Arabic during its application to Linotype. <br> <br>-- <br> <br>Smeijers and GN are ideologically very close (in the context of the whole)*. In a broader sense even Crouwel and GN are pretty close: they both apply superficial visual construction rules to something that must be derived from vision/perception/cognition instead. <br> <br>* GN doesn't say type has always been totally influelnced by the pen in every way, he just says it <i>should</i> be, in most ways. To me Smeijers essentially says the same thing. And neither of them make room for conscious improvement of communication. <br> <br>And I'm not \"militantly\" opposed to chirography (have you ever met a militant?). I'm willing to let people choose their own way in life (even if it's a waste of potential), and I'm even on good personal terms with some strongly chirographic type designers (as long they're not so insecure as to shun me for my typographic views). Not many of them though, because artistes can't handle criticism very well. <br> <br>&gt; the result tends to look unbalanced <br> <br>To whom? Type designers (and users) who have been conditioned to see things in a certain way, sure. What do we really know about what <i>readers</i> need? This actually reflects on the difference between display versus text type, between deliberation versus immersion - that whole network of parallels. <br> <br>&gt;  text faces can only vary about 5% and still be readable and good. <br> <br>What exactly is this benchmark, from which we need to measure? <br>This doesn't work. <br> <br>&gt;  probably all successful text faces, are somewhere in the middle range.  <br> <br>It is tempting to see sliding scale (because it gives you control), but it's an illusion. <br>And what exactly is \"successful\"? <br> <br>BTW, \"synthetic\" is a much better term than \"constructed\", because the latter implies ruler &amp; compass stuff and/or making type by putting pieces together, neither of which is required (or even encouraged) in synthetic type. <br> <br>hhp <br></p>"
