    html: <p>Edwin, just be aware of the difference between making "calligraphic" (more properly called "chirographic") type (like Zapf or Majoor*) versus making "synthetic" (Bilak's term) type (like Carter or Licko). You might end up favoring the former, but I'd recommend the latter. Anyway, it's never to early to realize the distinction - probably the first thing a type designer should learn, in fact. <br> <br>hhp <br></p>
