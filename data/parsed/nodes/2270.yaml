  - id: 18130
    user: 1551
    date: 2003-12-05T07:36:00
    date_raw: 5 Dec 2003 — 7:36am
    votes: null
    html: "<p>How much should the pen influence digital letter forms in text type? <br> <br><i>Letterletter</i> by Gerrit Noordzij is on the side of strong pen influence. <i>Counterpunch</i> by Fred Smeijers argues that though the starting point was calligraphy, even old style serifs are to a significant extent constructed, not pen drawn. Hrant, as you see, is militantly opposed to the influence of the pen.  <br> <br>To me, and I am much less knowledgeable than any of the above three, Smeijers' view rings true. On one hand, it is very hard to draw a good looking two story a or g that doesn't show the influence of the pen. And when you do an upper case M, if you don't let your weights be influenced by the broad-nibbed pen, the result tends to look unbalanced. On the other hand, Smeijers makes the case effectively that the look of Garamond and even Jenson are decisively influenced by construction of the punch, not the pen. <br> <br>Also an important point is what Eric Spiekerman said: that text faces can only vary about 5% and still be readable and good. To me this means that you can be too pen influenced or get too far from the pen. <br> <br>So to me the dichotomy that Hrant is setting up is misleading. It is rather that there is a sliding scale between pen-written and mechanical, and most successful faces, and probably all successful text faces, are somewhere in the middle range.  <br> <br>In display faces you can get away with very pen drawn scripts or very mechanical sans.    </p>"
