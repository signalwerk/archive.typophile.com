tten language has been fundamental to the growth of civilization. <br> <br>But contrary to what Noordzij would have us believe, its absense does not preclude civilization. In fact I would point out that the most uncivilized behavior seems to come from people who have been literate the longest! <br> <br>&gt; Can you name one change in typography in the past 500 <br>&gt; years that actually sped up reading with comprehension? <br> <br>Nope. The time is ripe! Maybe we can invent something as huge as the word space? <br> <br>The idea of dynamic and non-linear type isn't anything fancy. One idea is to display text on a screen in one spot and refresh the display intelligently. This would remove saccades from the act of reading, thus greatly increasingly comfort. Huge. Keep an open mind, that's the only way to progress. <br> <br>How do you think we advanced from using scrolls to using books? <br> <br>hhp <br></p>"
