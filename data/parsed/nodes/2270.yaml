    html: <p>Yes, I agree, 'synthetic' is better. <br> <br>My basic difference here with you, I think, is that I don't think it is likely that we will ever greatly improve on the readability of a well designed and set and printed page of Garamond or Baskerville. While I think the readibility stuff is very interesting and an important direction for improvement, I don't think it in the end is going to make a huge difference. <br> <br>But I could be wrong, and would be happy to be proven so. </p>
