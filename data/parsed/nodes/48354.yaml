      <p><a href="https://web.archive.org/web/20081122073252/http://typography.com/ask/recentTopic.php?rtID=86" title="http://typography.com/ask/recentTopic.php?rtID=86">http://typography.com/ask/recentTopic.php?rtID=86</a></p>
      <p>H&amp;FJ have a handy chart if you scroll down. As you can see, Adobe CS and Quark are pretty much it, at least for advanced features. If your friend wanted to use Word, they could cheat by going to insert&gt;character, and finding each SC or whatever glyph they wanted, and inserting them one by one. Unless their poetry is Icelandic saga length, this might be a usable workaround.</p>
