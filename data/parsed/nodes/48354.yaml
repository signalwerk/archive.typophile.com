  html: |-
    <p>Does anyone know of any free word processing/layout software that has support for Opentype features like true small caps and ligatures?</p>
    <p>I have a friend who is trying to layout their poems but doesn’t have InDesign or Quark.  Both Word and sWriter have fake small caps and those just won’t do!</p>
    <p>Thanks for yr help.</p>
    <div class="forum-topic-navigation clear-block"><a href="/web/20081122073252/http://www.typophile.com/node/49425" class="topic-previous" title="Go to previous forum topic">‹ Trying to identify this font</a> <a href="/web/20081122073252/http://www.typophile.com/node/49394" class="topic-next" title="Go to next forum topic">Cyrillic descender forms ›</a></div>
