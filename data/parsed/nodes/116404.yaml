      <p>I'm not sure how helpful a response this is, but given that wedding invitations often use script fonts (of course they don't have to!), it might be worth trying one of the scripts from Sudtipos? Adios Script Pro isn't too formal and is fairly delicate:<br>
      <a href="http://www.myfonts.com/fonts/sudtipos/adios-script-pro/" title="http://www.myfonts.com/fonts/sudtipos/adios-script-pro/">http://www.myfonts.com/fonts/sudtipos/adios-script-pro/</a> ?</p>
      <p>Or going a non-traditional route, the same designer made a geometric, Inlove<br>
      <a href="http://www.myfonts.com/fonts/sudtipos/inlove/" title="http://www.myfonts.com/fonts/sudtipos/inlove/">http://www.myfonts.com/fonts/sudtipos/inlove/</a> .</p>
