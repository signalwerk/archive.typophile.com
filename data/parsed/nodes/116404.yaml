    <p>I've been tasked with designing wedding invitations by a friend.  Her only request is that I use the typeface"Marzo" for headers.<br>
    <a href="http://www.myfonts.com/fonts/sudtipos/marzo/" title="http://www.myfonts.com/fonts/sudtipos/marzo/">http://www.myfonts.com/fonts/sudtipos/marzo/</a></p>
    <p>I'm not in love with this face, but I'm trying very hard to make it work. I find myself struggling with finding a suitable font that pairs well with this .  Any suggestions?</p>
