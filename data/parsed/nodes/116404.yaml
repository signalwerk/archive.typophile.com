      <p>Following up on the script idea, perhaps a light/thin monoline typeface, e.g. my Handsome Pro:<br><a href="http://www.myfonts.com/fonts/shinn/handsome/">http://www.myfonts.com/fonts/shinn/handsome/</a></p>
      <p>Failing that, any light sans serif with a circular /o and even width would work, e.g. Proxima Nova Soft.</p>
