    html: <p>Hard to say with so few letters and in such a condition but taking in consideration /C and /S terminals angle looks rather parallel to baseline would confirm your hunch for Helvetica/Helvetica Neue (the 2 versions are different). <a href="http://www.myfonts.com/fonts/linotype/neue-haas-grotesk" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Neue Haas Grotesk</a> would work as long as many other Helvetica clones/digitizations/reinterpretations like URW++ <a href="http://www.myfonts.com/fonts/urw/nimbus-sans" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Nimbus Sans</a>, Paratype <a href="http://www.myfonts.com/fonts/paratype/pragmatica" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Pragmatica</a>, Scangraphic <a href="http://www.myfonts.com/fonts/efscangraphic/europa-grotesk-no-2-sh" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Europa Grotesk</a>, Bitstream <a href="http://www.myfonts.com/fonts/bitstream/swiss-721" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Swiss 721</a>...</p>
