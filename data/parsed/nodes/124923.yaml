    html: |-
      <p>That was the problem I was running into.  I can find the same C, with the narrow opening, but every font that has it uses a B that is offset top and bottom.  The fonts with a symmetrical B have a C with a wider and non-horizontal closing.  It's driving me up the wall!</p>
      <p>Right now I have a composite of Helvetica Neue LT Standard for the AC and S... but I have to use Helvetica Standard for the B.  It's the closest I have gotten to the original font.</p>
