      <p>I think this is where I went wrong. Never had the problem before of characters getting cut off when I imported a font file, but I've been playing around with encodings (just to see what characters were included) and seem to have stuck my font inside one... I think it is sorted out now. At least, the Cyrillic is showing up again.</p>
