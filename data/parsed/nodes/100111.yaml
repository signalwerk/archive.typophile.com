    html: |-
      <p>It also depends on how extensive you want to get with your Cyrillic and Greek support.</p>
      <p>Basic Greek, or polytonic?</p>
      <p>Basic Cyrillic, or extended Cyrillic?</p>
      <p>Heck, one could ask the same thing about your Latin coverage. If you are going to also be doing Greek and Cyrillic, I would think you would *at least* do Adobe Latin 3 (includes Windows Eastern European, Baltic and Turkish codepages). But you can go even further if you like.</p>
      <p>A couple of references:<br>
      <a href="http://blogs.adobe.com/typblography/2006/08/defining_an_ext.html" title="http://blogs.adobe.com/typblography/2006/08/defining_an_ext.html">http://blogs.adobe.com/typblography/2006/08/defining_an_ext.html</a><br>
      <a href="http://blogs.adobe.com/typblography/2008/08/extended_latin.html" title="http://blogs.adobe.com/typblography/2008/08/extended_latin.html">http://blogs.adobe.com/typblography/2008/08/extended_latin.html</a></p>
      <p>Cheers,</p>
      <p>T</p>
