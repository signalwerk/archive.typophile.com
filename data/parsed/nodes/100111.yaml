    html: |-
      <p>Well, I'm not worried about coverage. I have the glyphs I want to include, but they do not show up in the .otf font that I am generating. This is a pretty simple font (all caps) that I am extending (from my own design) as a first step in learning about Cyrillic and Greek alphabets.</p>
      <p>I feel right now that what I want to do is set encoding to ISO 8859-1 Latin1 + ISO 8859-5 Cyrillic. I know that doesn't work. But is there a default unicode encoding I can set the font to that will let me support the multiple character sets?</p>
      <p>My goal is a font that will work in Illustrator/InDesign.</p>
