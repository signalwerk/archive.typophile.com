    html: |-
      <p>You don't need to do anything but assigning the correct Unicode values to your characters.</p>
      <p>InDesign, Illustrator, and all other type related software worth its salt are oblivious of any of the encodings you mention. The reason is that these "encodings" are meant as a Unicode-to-8 bit table translation. What will happen when you select one of them, is that FontLab will re-order your <em>Unicode</em> characters into the encoding specified, delete the rest (?) and export only the characters in that specific encoding.</p>
      <p>Is it required to select an encoding in FontLab? If so, choose something sounding like "Unicode (BMP)".</p>
    html_clean: |-
