    html: <p>&gt;OpenType GPOS positioning in MS Word.  <br>Very interesting. Can you give me more information about Hebrew? <br> <br>I knew that as of Windows 2000 you could use Hebrew MS Word, whereas before you had to have the special Hebrew Windows. I didn't mention this above as I believe Hebrew Word would be more expensive, and more than what Kyle needed.  <br> <br>I have been using DavkaWriter, but was looking for a better typeface than offered there. One does, I believe, need a Hebrew word processor, because of the right to left text, and expecially for the nikudot. Even Israelis regard putting in the nikudot as incredible hassle. Without a Hebrew word processor, I would think that it would be a nightmare. (Teamim are a double nightmare, but there is only one book for which they are needed, the Chumash - the Torah and Haftarah with the vowel and chanting symbols - and of course the text is already available digitally set.) <br> <br>I am doing a modern commentary (in English) on a classic Jewish text that I can get on CD rom, and I am also designing and setting the book (to be published by a commercial house). Davkawriter, which I am now using, has their propriatary system, not compatible with others, but I believe the Israeli CD roms with my text will work wherever Hebrew Word works. I suspect Dagesh also has their own system. Will your new typeface, and regular fonts from Israel paste with nidudot correctly into Word?  <br> <br>I am also buying InDesign for the project. I noticed that there is also an InDesign ME (middle east) for Hebrew and Arabic. Will everything work OK for me pasting the Hebrew that goes into Word into regular Indesign, or do I need InDesign ME? Do I need an open type font, or will regular PS or TT fonts also work on pasting the nekudot properly? <br> <br></p>
