    html: <p>Regular InDesign does not support any right-to-left text, nor does it support <span class="caps">GPOS</span> mark positioning. Only the <span class="caps">ME</span> version will do these things. <br><br>If you paste Hebrew text into regular InDesign, it gets reversed, left-to-right. Text is always stored in logical order, not display order, so an application needs to be able to apply <span class="caps">RTL</span> directionality in order to correctly display the&nbsp;text.</p>
    html_clean: <p>Regular InDesign does not support any right-to-left text, nor does it support <span class="caps">GPOS</span> mark positioning. Only the <span class="caps">ME</span> version will do these things. <br><br>If you paste Hebrew text into regular InDesign, it gets reversed, left-to-right. Text is always stored in logical order, not display order, so an application needs to be able to apply <span class="caps">RTL</span> directionality in order to correctly display the&nbsp;text.</p>
