    html: <p>I’ve just ﬁnished the <span class="caps">SBL</span> Hebrew (it should be released in the next couple of weeks; it will be available for free download, and I’ll announce it in the appropriate forum). Next up is the <span class="caps">SBL</span> Greek, due out later this summer, and then early next year a tri-script version with Latin added. <br><br>Interestingly, I think, each script will have a diﬀerent, appropriate ductus, but the weight and detailing will harmonise. Proportionally, the height of the majority of the Hebrew letters corresponds to the Latin smallcaps. The Latin is a kind of Dutch oldstyle, and the Greek is related to the Clio Greek that I presented at <span class="caps">AT</span>ypI in Rome — and hence to the Granjon St Augustin Greek —, although that will be the italic and there will also be an upright version inﬂuenced by the later Dutch Greeks. Fun&nbsp;project.</p>
