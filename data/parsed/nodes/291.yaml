    html: <p>You don't need a special 'Hebrew Word'. You can install Hebrew keyboard drivers in any version of Windows 2000 or XP, and just start typing in any recent version of Office. You can also do quite a lot just with Wordpad. The only thing you would be lacking would be Hebrew dictionary support. MS have an Office 'Proofing Tools' pack that includes Hebrew dictionary, sorting algorithm, as well as a whole pile of pretty good OT fonts from Gutmann in Israel. <br> <br>I have not used DakvaWriter. Is it Unicode? The really nice thing about the MS approach is that it is all Unicode, so the text is interchangeable with other applications and across platforms. <br> <br>If you want to do Hebrew typesetting, you need the ME version of InDesign. The regular version will not do right-to-left text, and it will not do GPOS mark positioning. [The current InDesign ME will support <i>nikud</i> positioning, but only clumsily handles <i>teamin</i>; I am corresponding with Winsoft, the makers of IDME, about this and hope to have it improved.] <br> <br>Regarding fonts, you really need OpenType if you want marks to be positioned really accurately. However, IDME has pretty decent algorithms for mark placement, so does a reasonably good job at 'blind positioning'.</p>
    html_clean: <p>You don't need a special 'Hebrew Word'. You can install Hebrew keyboard drivers in any version of Windows 2000 or XP, and just start typing in any recent version of Office. You can also do quite a lot just with Wordpad. The only thing you would be lacking would be Hebrew dictionary support. MS have an Office 'Proofing Tools' pack that includes Hebrew dictionary, sorting algorithm, as well as a whole pile of pretty good OT fonts from Gutmann in Israel. <br> <br>I have not used DakvaWriter. Is it Unicode? The really nice thing about the MS approach is that it is all Unicode, so the text is interchangeable with other applications and across platforms. <br> <br>If you want to do Hebrew typesetting, you need the ME version of InDesign. The regular version will not do right-to-left text, and it will not do GPOS mark positioning. [The current InDesign ME will support <i>nikud</i> positioning, but only clumsily handles <i>teamin</i>; I am corresponding with Winsoft, the makers of IDME, about this and hope to have it improved.] <br> <br>Regarding fonts, you really need OpenType if you want marks to be positioned really accurately. However, IDME has pretty decent algorithms for mark placement, so does a reasonably good job at 'blind positioning'.</p>
