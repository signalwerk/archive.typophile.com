    html: <p>Do you mean the script of the Barcelona Haggadah? I looked at several different Sephardic manuscript examples when I began drawing the type, and it is quite likely that reproductions from the Barcelona Haggadah were among them, since it is so famous. Of particular importance to the SBL Hebrew design was another Haggadah in the British Library (Ms. OR. 1404). A page of this is reproduced in Ismar David's _The Hebrew Letter_, if you're interested. I also looked for a long time at the Soncino types, although SBL Hebrew is much smoother and closer to the manuscript style.</p>
