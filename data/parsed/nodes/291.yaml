    html: |-
      <p>I can see that the letter Lamed extends above the top line by more than accents on capital letters - not even supported by all Latin fonts - do, so that argues for the scholarly tradition. After all, with hot metal, as opposed to TrueType, if you want leading, you put in leads; the tradition has been to fill the type body as much as possible, although slight compromises were accepted when lining type was brought in.</p>
      <p>Cyrillic is so similar to Latin, even having lowercase cognates as well as uppercase, that it would seem to make sense for the same typeface to have the same x-height in both scripts, even if the tendency had been for Cyrillic typefaces to tend to a larger x-height.</p>
      <p>Of course, an <em>opposite</em> approach would be to indeed use a larger x-height for Cyrillic, and use the glyphs from Latin <strong>small capitals</strong> for <em>their</em> cognates among Cyrillic lower case. I'm sure, though, that this would be regarded as even worse, and by a considerable margin.</p>
      <p>As for Greek, it doesn't <em>have</em> lower-case cognates (unless severely Latinized), just upper-case ones.</p>
      <p>@John Hudson:<br><cite>In fact, as you know from our previous discussion on Typographica, I prefer to treat Greek as a Middle Eastern script :-)</cite></p>
      <p>Are you <em>sure</em> you're not in the script reform business?</p>
      <p>Of course, it certainly is true that Greek has Phoenician roots, but then why not take Latin back to its Etruscan roots while you're at it?</p>
      <p>As we've seen in the other thread on Greek typography, my attitude to Greek is that it missed the Carolingian boat, and so its upper-case looks like it belongs to the same great tradition as Latin and Cyrillic, and its lower-case is jarringly alien. But I also feel that trying to Latinize Greek is the wrong approach, and instead basically one has to leave it to the Greeks themselves to harmonize their upper-case and lower-case into a unified whole. Which may take centuries.</p>
      <p>Not that there's anything wrong, in the interim,  with designing typefaces which take new and original approaches to such an integration. Eventually, some features from some of those attempts may stand the test of time, and contribute to the ultimate resolution.</p>
