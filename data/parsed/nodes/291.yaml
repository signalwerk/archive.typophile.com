    date: 2003-06-09T11:13:00
    date_raw: 9 Jun 2003 — 11:13am
    votes: null
    html: <p>Yes, the smallcaps are taller than the lowercase x-height. I tend to make my smallcaps quite a bit taller than my x-height, presuming the height of the caps allows, because I so often end up designing Cyrillic alongside my Latin. Cyrillic smallcaps <i>need</i> to be noticeably taller than the lowercase x-height, because so many of the forms are easily mistaken for lowercase letters. <br> <br>Cyrillic x-height = Latin x-height unless I'm making an Old Church Slavonic font. Like it or not -- and I know you don't like it --, the post-Petrine civil type is modelled on Latin proportions, and I'm not in the script reform business.</p>
    html_clean: <p>Yes, the smallcaps are taller than the lowercase x-height. I tend to make my smallcaps quite a bit taller than my x-height, presuming the height of the caps allows, because I so often end up designing Cyrillic alongside my Latin. Cyrillic smallcaps <i>need</i> to be noticeably taller than the lowercase x-height, because so many of the forms are easily mistaken for lowercase letters. <br> <br>Cyrillic x-height = Latin x-height unless I'm making an Old Church Slavonic font. Like it or not -- and I know you don't like it --, the post-Petrine civil type is modelled on Latin proportions, and I'm not in the script reform business.</p>
