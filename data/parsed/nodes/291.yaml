    votes: 0
    html: <p>Well, you’re going to hate this, but like most type designers working with Latin and Cyrillic I use the same glyphs for cognates in both scripts, e.g. a e o p c y x.  <br><br>Hebrew contains no Latin <span class="amp">&amp;</span> Cyrillic cognates. Also, there is an established tradition in scholarly typography — the target of the <span class="caps">SBL</span> fonts — that Hebrew letters are taller than the Latin x-height but shorter than the caps. This has been the norm for a few hundred years. Interestingly, in Israel, the developing norm for mixed modern Hebrew and Latin text is for the Hebrew to match the x-height of the Latin. <br><br>At the moment, there are no plans to extend the <span class="caps">SBL</span> fonts for Cyrillic, although it might happen one day. Syriac and Ethiopic are more likely to be added ﬁrst, due to the nature of the texts under&nbsp;study.</p>
