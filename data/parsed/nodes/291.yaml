    html: <p>You don’t need a special ‘Hebrew Word’. You can install Hebrew keyboard drivers in any version of Windows 2000 or <span class="caps">XP</span>, and just start typing in any recent version of Oﬃce. You can also do quite a lot just with Wordpad. The only thing you would be lacking would be Hebrew dictionary support. <span class="caps">MS</span> have an Oﬃce ‘Prooﬁng Tools’ pack that includes Hebrew dictionary, sorting algorithm, as well as a whole pile of pretty good <span class="caps">OT</span> fonts from Gutmann in Israel. <br><br>I have not used DakvaWriter. Is it Unicode? The really nice thing about the <span class="caps">MS</span> approach is that it is all Unicode, so the text is interchangeable with other applications and across platforms. <br><br>If you want to do Hebrew typesetting, you need the <span class="caps">ME</span> version of InDesign. The regular version will not do right-to-left text, and it will not do <span class="caps">GPOS</span> mark positioning. [The current InDesign <span class="caps">ME</span> will support <i>nikud</i> positioning, but only clumsily handles <i>teamin</i>; I am corresponding with Winsoft, the makers of <span class="caps">IDME</span>, about this and hope to have it improved.] <br><br>Regarding fonts, you really need OpenType if you want marks to be positioned really accurately. However, <span class="caps">IDME</span> has pretty decent algorithms for mark placement, so does a reasonably good job at ‘blind&nbsp;positioning’.</p>
    html_clean: <p>You don’t need a special ‘Hebrew Word’. You can install Hebrew keyboard drivers in any version of Windows 2000 or <span class="caps">XP</span>, and just start typing in any recent version of Oﬃce. You can also do quite a lot just with Wordpad. The only thing you would be lacking would be Hebrew dictionary support. <span class="caps">MS</span> have an Oﬃce ‘Prooﬁng Tools’ pack that includes Hebrew dictionary, sorting algorithm, as well as a whole pile of pretty good <span class="caps">OT</span> fonts from Gutmann in Israel. <br><br>I have not used DakvaWriter. Is it Unicode? The really nice thing about the <span class="caps">MS</span> approach is that it is all Unicode, so the text is interchangeable with other applications and across platforms. <br><br>If you want to do Hebrew typesetting, you need the <span class="caps">ME</span> version of InDesign. The regular version will not do right-to-left text, and it will not do <span class="caps">GPOS</span> mark positioning. [The current InDesign <span class="caps">ME</span> will support <i>nikud</i> positioning, but only clumsily handles <i>teamin</i>; I am corresponding with Winsoft, the makers of <span class="caps">IDME</span>, about this and hope to have it improved.] <br><br>Regarding fonts, you really need OpenType if you want marks to be positioned really accurately. However, <span class="caps">IDME</span> has pretty decent algorithms for mark placement, so does a reasonably good job at ‘blind&nbsp;positioning’.</p>
