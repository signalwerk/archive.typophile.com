    html: '<p>&gt; I use the same glyphs for cognates in both scripts <br><br>Well, yes, I dislike that very much — it violates linguistic realities. But really, even a preference for such cognates doesn’t have to preclude making the vertical proportions diﬀerent. You might say it’s too much trouble scaling up the Latin cognates to a larger x-height, since you’d have to then make them lighter too; but with a little bit of technique it could be a breeze — here’s what I’m thinking: <br><br>If you have a weight axis in your font (and one with a light extreme [suﬃciently] beyond what you’re actually releasing in the Latin), what you could do is simply scale up those cognates for Cyrillic use, but use a slightly lighter weight to match the Latins. <br><br>&gt; the developing norm for mixed modern Hebrew and Latin <br>&gt; text is for the Hebrew to match the x-height of the Latin. <br><br>Yes, I’ve noticed — and it sucks. <br>I wonder why there’s been such a regression. I have to suspect an unhealthy infatuation with the West. <br><br>— <br><br>I guess what you’re saying is that you’re simply following established norms, in each script. Norms are important, but functionality itself even more so, no? I mean, if the contemporary Hebrew method were to become the norm, would you then start following it, even though you knew it skewed the apparent sizes? And if you admit that vertical proportions do aﬀect functionality (something the old Hebrew designers realized*), then why not push Cyrillic towards that too? Do you fear you’ll be blacklisted by the Russian font maﬁa or something?&nbsp;;-) Users don’t even consciously realize what’s going on, so they’d never complain; but under the surface they’d certainly beneﬁt from better functionality. <br><br>* <br>Here’s an example of smart Latin/Hebrew proportions/color_matching, from an old Lino metal catalog: <br><img src="http://www.typophile.com/forums/messages/30/11553.gif" alt="linohebr.gif"><br>(Thanks again, Gerald.) <br><br>hhp <br></p>'
