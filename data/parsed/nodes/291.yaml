    html: <p>&gt;If you paste Hebrew text into regular InDesign, it gets reversed, left-to-right. Text is always stored in logical order, not display order, so an application needs to be able to apply RTL directionality in order to correctly display the text. <br> <br>John, I downloaded the trial version of InDesign, and tested pastes from the English-Hebrew word processor Davkawriter. It has dual export mechanisms - one to Hebrew programs and one to English programs. The export to English programs goes into regular InDesign fine - in fact better than into PageMaker. It makes each line a paragraph, and I guess reverses the order of storage. (It also has a twin sets of Hebrew fonts for pastes into Hebrew and English programs.) So I can get by with regular InDesign at this point. I'm not sure, but I suspect that the reason people in the U.S. are still using Davkawriter and Dagesh, rather than Word with XP and a Hebrew keyboard installed is because of these kinds of functionalities.   </p>
