    html: <p>The most popular English-Hebrew word processors are Davkawriter and Dagesh. You can get Davkawriter at <a href="http://www.davka.com" target="_blank">www.davka.com</a> and Dagesh at <a href="http://www.jewishsoftware.com" target="_blank">www.jewishsoftware.com</a> . You can get additional fonts also at these sites. By doing a search you can also ﬁnd free fonts.  <br><br>The main diﬃculty with putting a Hebrew word into an English text is doing the vowels (nekudot), which are little dots under and over the letters. Only the special word processors can handle this. Israelis rarely use the&nbsp;nekudot.</p>
