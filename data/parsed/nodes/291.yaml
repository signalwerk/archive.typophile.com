    html: <p>Regular InDesign does not support any right-to-left text, nor does it support GPOS mark positioning. Only the ME version will do these things. <br> <br>If you paste Hebrew text into regular InDesign, it gets reversed, left-to-right. Text is always stored in logical order, not display order, so an application needs to be able to apply RTL directionality in order to correctly display the text.</p>
    html_clean: <p>Regular InDesign does not support any right-to-left text, nor does it support GPOS mark positioning. Only the ME version will do these things. <br> <br>If you paste Hebrew text into regular InDesign, it gets reversed, left-to-right. Text is always stored in logical order, not display order, so an application needs to be able to apply RTL directionality in order to correctly display the text.</p>
