    html: <p>&gt;to do Hebrew typesetting, you need the <span class="caps">ME</span> version of InDesign. <br><br>I am wondering whether pasting from Word (on Windows <span class="caps">XP</span>) into regular InDesign will work as far as nekudot, or whether I have to have InDesign <span class="caps">ME</span> to position the nekudot correctly. I don’t need to compose in InDesign, but I do need to include nekudot as my book is for Americans, and most who know some Hebrew need the vowels. Do you know about this? <br><br>Right now I am pasting Hebrew from Davkawriter into PageMaker. Each line becomes a paragraph, and I force justify all of them, except the last line of the paragraph right justiﬁed. This works. Davka actually in the past year or so also got Guttmann fonts, so perhaps switching is not going to help me that much, for my purposes. But there was a font on one of Luc Devroye’s links — ‘Poeta’ — that I thought might work better with my design. Your design is nice — I gather it is designed to harmonize with matching Greek and Roman fonts — a feat! <br><br>Dagesh and Davka writer are legacies of the time when regular Windows couldn’t handle Hebrew. I believe they use little-used slots (is that the right word?) in the ascii table for the nekudot, and then somehow have programming to position them correctly.  <br><br>However, I haven’t heard about people in the <span class="caps">US</span> Jewish community who use these programs switching to just using Windows <span class="caps">XP</span> and Word. This could be because the dedicated English-Hebrew programs are designed to switch back and forth between languages easily, paste into Word etc. Also they have an on-screen Hebrew keyboard you can click with a mouse, so you don’t need to know the Hebrew keyboard. Or maybe people just don’t know about the new Windows options.  <br><br></p>
