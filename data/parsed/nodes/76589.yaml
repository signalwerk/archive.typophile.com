      <p>Thanks Kristian! Codepages indeed were the problem, now it exports the glyphs properly. It's rather weird though because it was exporting them normally before and I didn't change anything there inbetween... Now none of the codepages were actually enabled.</p>
      <p>Shame about not being able to type the characters directly, but I guess I can live without that.</p>
      <p>Anyway, thanks for the answers!</p>
