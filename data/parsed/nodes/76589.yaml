      <p>Mīļo Kārli,<br>
      In the metrics window you have to type /lcommaaccent/kcommaaccent/emacron and so on, or you can drag them to metrics window from the main font window where all the glyphs are on display. Besides making kerning classes helps<br>
      _K: K' Kcommaaccent</p>
