    <p>Hello Typophile community! Sorry for making my first post here a cry for help, but here goes:<br>
    I am a student studying typography and pretty much just starting with Fontlab. Besides having all the usual English characters I am also adding Latvian ones as it is my native language.<br>
    All was normal and all the glyphs worked, but then at one point I noticed that when wanting to preview for example ā it showed the correct character in the window where I type what I want to see, however in the preview window my font had defaulted back to a. The same happened with ēīņķļņ etc.<br>
    If i now generate the font, these characters are not included.<br>
    I tried to open a preinstalled font that has all these glyphs but the same thing happens - it just doesnt show them and defaults back to the basic characters.<br>
    Does anyone have any idea why this could be happening?<br>
    Thanks in advance.</p>
  html_clean: |-
    <p>Hello Typophile community! Sorry for making my first post here a cry for help, but here goes:<br>
