  html: |-
    <p>Is it possible to change the way the preview window in FontLab renders the font I'm working on? </p>
    <p>I'm working on a screen font, and when I test it within the application I'm making it for it renders really sharp, stems are sharp 1 px lines. In the FontLab preview the render is much smoother, pretty much every line is very fuzzy. </p>
    <p>So I'm thinking, maybe I can change how fontlab renders the font, to more accurately emulate how it's displayed in different rendering engines?</p>
    <p>Thanks,<br>
    Svenni</p>
