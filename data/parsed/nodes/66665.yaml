    html: |-
      <p>Svenni, </p>
      <p>the Preview panel and the Metrics Window use the FreeType renderer with its own autohinting. This is not customizable. </p>
      <p>If you activate the TrueType or the Type 1 hinting tool, you will be able to preview fonts using the system renderers (TrueType or Type 1), and you can even select some different renderers (this is different for Mac and Windows versions of FontLab Studio).</p>
