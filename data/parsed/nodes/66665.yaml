    html: |-
      <p>On the Mac version, you only get a choice of renderers when you are using the Type 1 hinting tool:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/t1hintingtoolmac_3642.png"></div><p></p>
      <p>The pop-up showing the choices is hiding in the tiny icon in the top-right corner of the preview pane.</p>
      <p>With the TrueType hinting tool, only a black and white preview (presumably using the FreeType renderer) is available, so no pop-up with other choices.</p>
