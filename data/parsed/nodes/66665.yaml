    html: |-
      <p>In the old thread, it was the rendering mode options that didn't work. That was fixed in 5.0. </p>
      <p>To get the panel, you just open a glyph window and click on these two buttons:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/t1hintingpreviewpanel_5498.png"></div><p></p>
      <p>If you don't see the panel, perhaps it's off-screen somewhere. That can happen if you were running FL with a different monitor set up previously.</p>
