      <p>I found these in one of my books ("Initials and Decorative Alphabets," Erhardt D. Stiebner and Dieter Urban, Blandford Press, 1985). It's an English translation of the German "Initialen und Bildbuchstaben," 1983.</p>
      <p>It appears on page 172, and is described as "After Renaissance original, Silvestre, 19th cn." The image it accompanies is the same as shown in your sample "Typography.jpg," but reversed (white on black) as in your "Sample.jpg." </p>
      <p>More information about Silvestre here (as well as a cropped sample of this alphabet):<br>
      <a href="http://www.johncoulthart.com/feuilleton/2011/09/07/joseph-balthazar-silvestres-alphabet-album/" title="http://www.johncoulthart.com/feuilleton/2011/09/07/joseph-balthazar-silvestres-alphabet-album/">http://www.johncoulthart.com/feuilleton/2011/09/07/joseph-balthazar-silv...</a></p>
