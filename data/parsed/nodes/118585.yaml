    html: |-
      <div class="comment-spam-body"><p>Hi Mike, a harp is as good a guess as any.<br>
      All we know about this alphabet is that it's an Italian lapidary alphabet from the 15th century.<br>
      From the shading, the circles appear to be spheres on strings, ropes or pipes.<br>
      Why spheres? Musical, astrological, astronomical, heraldic, cannon balls?<br>
      Is this supposed to represent armor laced together, plumbing, something architectural?<br>
      A lapidary alphabet was intended to be engraved. This might have been used on something metal, a platter, a bronze door etc. Religious, scientific, military?<br>
      Last guess: knobs on a pipe organ.<br>
      A true mystery alphabet.<br>
      Don</p>
      </div>
