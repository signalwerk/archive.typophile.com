      <p>Good find Kevin.<br>
      The original has a fascinating amount of nuanced detail. Here is a slightly enhanced copy<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/SilvestreAlphabetAlbum91_5809.jpg"></div><br>
      BTW the black and white rendition posted for ID is a good quality adaptation and catches a substantial part of the detailing.<br>
      It would be a real challenge to capture this in a digital font. There would have to be some drastic simplification of the engraved sphere like circles to make them work for the upper case and they might not even be feasible for the lower case.<br>
      Don<p></p>
