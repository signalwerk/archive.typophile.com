    <p></p><div class="imageWrap"><img src="http://typophile.com/files/DOODLE_3514.jpg"></div><p></p>
    <p>I have been experimenting with doing a doodle type style for a poster, and although it is not yet decided if it will go ahead yet, I still think its an awesome effect. Attached to this post are a number of examples I found on places like flickr and google and one great advert as well. When experimenting, I found they key is to be patient and have a little faith. It takes a while to take shape. Any thoughts on my effort shown above are appreciate. Not quite finished yet tho.<br>
    hope you guys think these are as cool as I do.</p>
