  html: |-
    <p>Debelly is catchy fat typeface, with lovely geometric shapes. Inspired with contrast strokes, with square joins, Debelly gives an impression of retro style combined with contemporary trends. It is designed specially for packaging, posters, logotypes or headlines. Contains 375 glyphs.</p>
