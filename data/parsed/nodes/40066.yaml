    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 13.Dec.2007 5.51pm </div>
      <p>It’s that time of year, and this year it’s easier than ever to send<br>
     an entry to the Type Directors Club Type Design Competition (TDC2).</p>
    <p> Along with having a stellar jury — Lance Hidy, Larry Oppenberg,<br>
     Sara Soskolne, Gerard Unger,  with Matthew Carter as Chair, this year<br>
     TDC has inaugurated a system of PDF uploads for type design samples.</p>
    <p> Designers or submitters may either send printed samples by mail or<br>
     send 11x17 US Tabloid formatted PDFs via secure server uploads. PDF<br>
     entries will be printed out by the TDC prior to the judging.<br>
     The server can be also used to register entries and print labels for<br>
     mailed or shipped entries.</p>
    <p> Full Call guidelines and procedures for the TDC2 2008 Type Design<br>
     Competition are at:<br>
    <a href="http://www.tdc.org/calls/tdc22008/index.html" title="http://www.tdc.org/calls/tdc22008/index.html">http://www.tdc.org/calls/tdc22008/index.html</a></p>
    <p>As well, the online registration facility is available to entrants to<br>
    TDC54 Typography, the TDC’s annual competition for excellence in<br>
    typography, though the upload function is not available. The TDC54<br>
    Call guidelines and procedures are at:<br>
    <a href="http://www.tdc.org/calls/tdc542008/index.html" title="http://www.tdc.org/calls/tdc542008/index.html">http://www.tdc.org/calls/tdc542008/index.html</a></p>
    <p> Winning works in TDC2 2008 Type Design and in TDC54 Typography will<br>
     be exhibited in six traveling shows and published in Typography 29,<br>
     The Annual of The Type Directors Club, a hardbound, all-color<br>
     competition annual designed by Philippe Apeloig.</p>
    <p> Deadlines for the competitions are<br>
     TDC2 2008 ::  Friday 14 December 2007<br>
     TDC54 :: Friday 4 January 2008</p>
