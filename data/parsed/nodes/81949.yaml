      <p>It's very possible that this was hand-drawn. Without any duplicate letters, or being able to recognize specific letters, there's no way to be sure this is even a font. Did they use this lettering for anything besides the logo? If not, your odds of this being a font go down even further.</p>
      <p>- Mike Yanega</p>
