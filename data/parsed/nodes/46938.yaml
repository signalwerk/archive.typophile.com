  html: <p>I’ve always been a fan of tattoo art. Not the spring break, “o my god, I’m so wasted” tattoo art, but the finely tuned, detailed stuff. When looking at it from a design perspective, you may one to check out a guy named Sailor Jerry. Jerry was the original, old school tattooer. Although simple, a lot of his stuff is interesting..</p><div class="imageWrap"><img src="/files/flash_2_4980.jpg"></div><div class="imageWrap"><img src="/files/th_art7_4636.jpg"></div><div class="imageWrap"><img src="/files/th_Image2-1_3934.jpg"></div><p></p>
