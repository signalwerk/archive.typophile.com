    html: <p>A user can use the glyph palette in Illustrator (CS and later) and InDesign to see which glyphs are accessed from each specific feature. <br> <br>I don't know of any other currently-available end-user-friendly utility for doing this, although I'm sure it would be welcomed by end users. <br> <br>However, I also suggest checking back in a couple of weeks. <br> <br>T</p>
