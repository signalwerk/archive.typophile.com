    html: <p>I list and briefly explain the OT features in the manual that comes with my font for classicists, Biblical scholars, and medievalists. <br> <br>I also have prepared two documents, one in Indesign and one in Mellel, that can be downloaded from my web site.  The test files contain samples of regular text to which users can apply the relevant features and see the results, and there are specific instructions for how to apply each feature. <br> <br>David Perry</p>
