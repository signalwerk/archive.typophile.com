  html: '<p>Greetings.  Those of you who produce OpenType fonts: how do you inform users about the available glyph substitutions? <br> <br>Is there a utility that will list and illustrate the substitutions that occur when the user chooses "contextual alternates," "stylistic alternates," etc.? <br> <br>-- Eric</p>'
