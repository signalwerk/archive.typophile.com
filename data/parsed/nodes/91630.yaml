    html: |-
      <p>There is an <em>operator</em> called "rand" in the CFF specifications -- but I doubt it is supported by all (or some) type engines.</p>
      <p>I can't imagine anyway how that would work in an interactive way, such as when typing in text. Would you see the glyphs on screen squirm and wiggle as you are typing? How about system redrawing -- zooming in and out would also cause your glyphs to change!</p>
      <p>I suppose the same goes for attempting to support the OTF feature "rand", as it may display these same side effects.</p>
