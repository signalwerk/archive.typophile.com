    html: |-
      <p>Both the Microsoft Typography and Adobe Opentype web pages contain official specifications as well as extensive listings of all currently defined features. Most of them come down to "this feature should be implemented as a Single Lookup, and that as a Contextual one" -- not much of <em>programming</em> required.</p>
      <p>Combining the few available commands can make things <em>interesting</em>; take, for example, Tal Leming's <a href="http://talleming.com/2009/10/01/fraction-fever-2/" rel="nofollow">Fraction Fever 2</a>. There are also a couple of threads in the Build section that discuss writing out arbitrary numbers in Roman form.</p>
      <p>Anything particular you are looking for?</p>
