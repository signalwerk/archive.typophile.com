      <p>Nope. It's Balinese script, an evolution of the "original Hindu alphabet" that you mentioned. The Sanskrit that we all know was brought to Indonesia at approximately 75 AD and eventually evolved to a more localized variant, the Palawa. This was the official alphabet of Indonesia's many Hindu kingdoms.</p>
      <p>However, not until the reign of Purnawarman (at approximately 4th century AD), did we have an official record of Hindu as a state religion in Java. Bali, for its comparatively small size, got its Hindu influence much earlier and was able to maintain Hindu's tradition to this day, even alongside Buddhism and then Islam.</p>
      <p>The evolution from Palawa to its local variants -- like Balinese or Javanese script -- then, is a gradual one. Currently, we have an official record of the translation of the <em>Mahabarata</em> from Palawa into Javanese script on the reign of Dharmawangsa (1000 AD). Thus, most historians believe that Palawa's many variants must've been used extensively much earlier than that, at approximately 600 AD.</p>
      <p>I'd be happy to get more facts into this topic if you're interested. I'm not from Bali, but I'm a native of East Java, so the island is just a 45-minute plane ride away (which is kind of nice, if you ask me :)</p>
