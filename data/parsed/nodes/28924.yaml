      <p>A Javanese Typophiler - yay! :-)  Thanks for the mini lesson.</p>
      <p>One thing on that Omniglot page is confusing:<br>
      "The Balinese alphabet ... is mainly used for religious works. Generally a version of the Latin alphabet known as Tulisan Bali is used instead... Although Tulisan Bali is a required subject in Balinese primary schools, most people promptly forget it afterwards."<br>
      This seems to imply that Balinese are functionally illiterate!</p>
      <p>So what do Balinese generally write in, and what's the real story with use of Latin?<br>
      And when did Tulisan Bali come about, and who sanctioned/promoted it?</p>
      <p>hhp</p>
