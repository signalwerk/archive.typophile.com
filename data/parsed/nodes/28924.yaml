      <p>'Tulisan' in Bahasa Indonesia literally means 'writing'. I don't know if there are two variants of the Balinese scripts (one for religious works, one for casual uses). But what I do know is that, much like in Java, kids are required to study and be able to write traditionally. I used to be able to write in Javanese script fluently, back in elementary school.</p>
      <p>However, the standard language of choice remains Bahasa Indonesia, an Indo-Malayan language -- written in Latin alphabets -- that was a derivative of Sumatran, and which writing system was introduced during the Dutch colonization (1600's AD).</p>
      <p>In the name of unity (and to overthrow the many oppressors of the country), the language was used as one of the tool of national pride. So it only made sense that the practicality of using a traditional script in 'real-world' situation soon became trivial. The regional variety of Bahasa, then, is what most people ended up speaking, especially because 'latinizing' and then assimilating the script into the mother language is quite easy.</p>
      <p>In short, everyone writes in regular alphabet and speaks in Bahasa Indonesia in formal situations (and in informal ones, a fusion of Bahasa and localspeak). But for the sake of tradition (which is a good thing, really), regional scripts and traditional language continued to be taught in school.</p>
      <p>And believe me, that's only a small part of the story (now that you got me going :)</p>
