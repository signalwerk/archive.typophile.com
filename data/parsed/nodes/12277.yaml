      <p>Yuri, FontLab Gang . . .</p>
      <p>First, I just got my Typophile account reset again and upon reading the news of your licensing of Fontographer code I was delighted and puzzled at the same time.</p>
      <p>First, I'm certainly looking forward to an updated Fontographer that sits on X comfortably and renders aliased with the same functionality. In fact this application update alone may once and for all allow me to cut all ties with the Classic OS.</p>
      <p>Now, that said since you've got the source code in your hot hands, I am puzzled to what level you intend to update/enhance Fontographer. Would a completely updated FOG make FontLab obsolete or will you simply offer a 'reduced' feature set compared to the capabilities of FontLab?</p>
      <p>Like I said, I'm delighted but I don't understand the future differences of these two applications? I can do MOST of my fontmaking work still in FOG minus clean hinting and really nice font generation which I use FLAB for. So once you update those things in FOG, why would I need FLAB?</p>
      <p>Stuart :D</p>
