    <p>Fontlab Ltd., 136 E 8th St., Port Angeles WA 98362, USA</p>
    <p>FONTOGRAPHER HAS A NEW HOME AT FONTLAB LTD.</p>
    <p>Fontlab Ltd. Licenses Legendary Font Editor,<br>
    Plans to Continue Development</p>
    <p>For Immediate Release<br>
    Monday, May 9, 2005<br>
    Contact: Ted Harrison<br>
    Fontlab Ltd.<br>
    Tel: +1 (509) 272-3260<br>
    <a href="mailto:contact@fontlab.com">contact@fontlab.com</a></p>
    <p>Port Angeles, WA, USA, May 9, 2005: Fontlab Ltd. is pleased to announce the licensing from Macromedia Inc. of the Fontographer product line. “Fontographer is a respected name in the field of digital typography,” said Ted Harrison, president of Fontlab Ltd. “We are proud to add this legendary font editor to our lineup of products.” As of today, Fontlab will continue to sell the current version of Fontographer while beginning work on fixing bugs and preparing a new version - expected to be released early next year.</p>
    <p>“With nearly two decades of presence on the market, Fontographer has gained a reputation as an easy-to-use and reliable tool for creating digital fonts, and continues to boast a strong and dedicated user community among desktop publishers, graphic designers and typographers. We feel that Fontographer will find a secure and comfortable home at Fontlab Ltd. Our team is committed to continuing the development of a brand-new version of the product,” said Harrison.<br>
    Harrison continues, “With our TypeTool product we have a font editor for beginners, hobbyists and students. FontLab Studio and AsiaFont Studio are our high-end products with a certain degree of technical complexity, aimed at professional type designers. With Fontographer, we now have a tool that fills the gap between those products - a font editor for graphic designers and desktop publishers, powerful enough for real-world typography but without all the bells and whistles of our high-end products.”</p>
    <p>Fontlab Ltd. will offer upgrade paths from TypeTool 2 to Fontographer 4.1 (US$249) and from Fontographer 4.1 to FontLab Studio (US$299) and to AsiaFont Studio (prices to be announced.)</p>
    <p>Fontlab will assume support for Fontographer version 4.1+ from Macromedia and will retain the services of Fontographer guru Jim Gallagher, who has nurtured Fontographer for the last ten years, and who will advise the Fontlab development team in their task of updating Fontographer.</p>
    <p>About Fontlab Ltd.</p>
    <p>Fontlab Ltd. is the world’s leading developer of digital typography solutions. Their full line of products is dedicated to solving typographic issues ranging from the simple to the most complex. These products include: AsiaFont Studio™, BitFonter™, FontLab Studio™, ScanFont™, TypeTool™, TransType™, FontFlasher™, FONmaker™, SigMaker™ CompoCompiler™ and Photofont. More information on all Fontlab products can be seen at <a href="http://www.fontlab.com" title="www.fontlab.com">www.fontlab.com</a>.<br>
    					###</p>
