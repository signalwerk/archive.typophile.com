  - id: 69312
    user: 1202
    date: 2003-04-22T17:03:00
    date_raw: 22.Apr.2003 5.03pm
    votes: null
    html: "<p>A very nice concept, and I particularly like the photograph juxtaposed with the logo. Gorgeous. <br> <br>My observation: the strength of the arc seems to be in conflict with the rather weaker typeface. I think the problem lies not in the choice of type (which I think is quite a nice typeface in and of itself) but how the arc is constructed. To me, the arc says \"Avant Garde\" (the typeface). Martin's 3D extrusion might not be what you have in mind, but it does have the thick-thin transition that echos the type rather nicely. The type right now is very organic, while the arc is mechanical, you see? <br> <br>Charter is a nice typeface. Not as elegant as Visage, but I think it does have the sturdyness that you might need for a logo. The thins of Visage are quite thin, and you might run into problems when you have to use it at small sizes. If you decide to go with Visage, Yyou might need to have two or more optical versions for use at different sizes... Visage has more character though...</p>"
    html_clean: "<p>A very nice concept, and I particularly like the photograph juxtaposed with the logo. Gorgeous. <br> <br>My observation: the strength of the arc seems to be in conflict with the rather weaker typeface. I think the problem lies not in the choice of type (which I think is quite a nice typeface in and of itself) but how the arc is constructed. To me, the arc says \"Avant Garde\" (the typeface). Martin's 3D extrusion might not be what you have in mind, but it does have the thick-thin transition that echos the type rather nicely. The type right now is very organic, while the arc is mechanical, you see? <br> <br>Charter is a nice typeface. Not as elegant as Visage, but I think it does have the sturdyness that you might need for a logo. The thins of Visage are quite thin, and you might run into problems when you have to use it at small sizes. If you decide to go with Visage, Yyou might need to have two or more optical versions for use at different sizes... Visage has more character though...</p>"
