    <p>Blue Edge is a System Engineering new company based in portugal. It develops several sea exploring related machines like probes, and other robotic orientated systems like mini submarines to explore the sea and coast (among others non related to water).   <br>  <br>CONCEPT.  <br>They wanted a logo that reflected the water/sea, but most important the EDGE, as for the frontier between the sea|shore or the frontier Ocean|Sky. After several ideas I choosed the idea of representing the Sunrise cutted by the ocean (sky/sun/ocean prontier). Something like the photo below.  <br>  <br>&lt;img src="http://www.musicdrops.com/blue.jpg"&gt; <br>  <br>THE LOGO.  <br>I came out with this simple logo that I think captures the ocean vibe (given by the colors) and enought edge/tech feeling. The type used is from the Agfa Monotype Foundry called VISAGE LIGHT. The g reminded me someone "twirling" on the surface of the water and personally I think it reminds me a lot the ocean vibe.  <br>  <br>&lt;img src="http://www.musicdrops.com/bluet.gif"&gt; <br>  <br>FEEDBACK  <br>I need to hear the experts <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> The company desc below is on the same font and there will be a portuguese version where the type will be smaller (more words: Sistemas de Engenharia)but the logo to use mainly is the one without the description (top right). Thanks in advance!  <br>  <br>____________ hum.... img html not working?</p>
