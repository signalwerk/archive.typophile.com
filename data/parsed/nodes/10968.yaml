    html: "<p>I don't know... the arch seems to be too wide for me. It looks like it is stretched. The idea however of using an arch is a good one: very simple and recognizable. The color is also OK: modern, yet serious enough. <br>And about the type: nice that you made the effort of pick a type that isn't overused. However it feels to be a bit too light. Perhaps the normal style would be better. <br>There is one thing I don't like with Agfa Visage: the italics. So I hope you won't be using the Oblique...</p>"
