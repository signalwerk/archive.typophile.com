    <p>One thing has been buzzing in my head, since I read an opinion in <a class="freelinking external" href="http://typophile.com/node/54221#comments" rel="nofollow">my previous log entry</a> about some glyphs of a font I'm developing.</p>
    <p>The sharp-smart designer <strong><a class="freelinking external" href="http://typophile.com/user/13487" rel="nofollow">Nina</a></strong> commented: <em>‘[...] the “n” even seems narrow compared to the “m” and the “u”, the “m” looking like it’s about 2 units short of being a perfect duplication of the “n”, and the “u” almost exactly equal in width to the “n”. Is that intentional?'</em></p>
    <p>My first answer and her bright reply <a class="freelinking external" href="http://typophile.com/node/54221#comments" rel="nofollow">are in the blog</a>, but it made me think about the “hum” question (it involved the “h”, too) in the “n” case, that is: how similar are these glyphs in their components compared to the “n”.</p>
    <p>Well. I started to search for the way that different serif designs face the problem, and I noticed that criteria are quite uneven, but it is worth to attend to each one. </p>
    <p>After all, it is not matter of size (though some says “size matters”) but of the overall look, and one must watch the typeface as a whole, regarding of its singular details.</p>
    <p>The odd results of my experiment are showed below:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/The_n_case_4364.gif"></div><p></p>
    <p>PS: Fonts used for testing purposes were Baskerville, Big Caslon, Book Antiqua, Calisto, Caslon Pro, Century, Century Schoolbook, Cochin, Garamond Pro, Hoefler, Lucida Bright, Minion, Palatino and Times New. The small arrows point the shifts (meaning red: wider and green: narrower).</p>
