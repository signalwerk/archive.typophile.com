  html: "<p>  <br>Fontworks Newsletter // March 2003  <br> <br>- HOT OFF THE PRESS: NEW FONTWORKS PRINTED SPECIMENS AVAILABLE  <br>We've just taken delivery of our brand new reference booklets for LUCASFONTS, Luc(as) de Groot's eclectic foundry, and LINOTYPE LIBRARY showcasing the work of Alessio Leonardi, Franko Luin, and an overview of the company's CD products including the pioneering Platinum Collections (Frutiger Next, Syntax, Univers etc). Designed, as ever, to fit inside your FONTBOX, our legendary storage tool. Contact <a href=\"mailto:sales@type.co.uk\">sales@type.co.uk</a> if you'd like to buy one stuffed full of booklets, posters, flyers and exclusives from the likes of Alias, Club 21, ShinnType, Font Bureau, G-Type, Acme &amp; Identikal. More info about Fontbox at:  <br><a href=\"http://https://www.fontworks2.type.co.uk/cgi-bin/fontworks2/fwks/solutions/fontbox\" target=\"_blank\">https://www.fontworks2.type.co.uk/cgi-bin/fontworks2/fwks/solutions/fontbox</a>  <br> <br>- SENSATIONAL LINOTYPE LIBRARY SALE#1: SINGLE WEIGHTS NOW AN AMAZING </p>"
