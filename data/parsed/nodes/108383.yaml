      <p>The Clarendon Condensed is very close. If I had more typography skills, I might be able to morph it into what I want. You will notice that the curves in the serifs on the letter A are quite graceful... almost swooping... and that the right side gets wider at the top instead of narrower as in Clarendon which makes the triangular cutout smaller.  This letter W has similar qualities I mentioned about the A... the gracefulness.</p><div class="imageWrap"><img src="http://typophile.com/files/W_5627.jpg"></div><br>
      Reading your earlier comments about the font on the letter, I see that I have so much to learn. I appreciate your taking the time to educate me and I welcome any further comments you wish to make.<p></p>
