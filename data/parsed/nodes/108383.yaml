    html: |-
      <p>Engraved letterhead. No matches that I can see.<br>
      Letters in DE PASSEMENTE/ARIUS/OR seem to be a bolded version of the letters in VILLEURSANNE.<br>
      Note the generally boxy shapes of the letters and the broad serifs at the apex of A and the base of V. This was a design feature in several late 1890s typefaces<br>
      I hesitate to recommend any digital substitute. But there is some remote similarity in Cushing Two by David Bergsland <a href="http://www.myfonts.com/fonts/bergsland/cushing-two/" title="http://www.myfonts.com/fonts/bergsland/cushing-two/">http://www.myfonts.com/fonts/bergsland/cushing-two/</a><br>
      This is derived from an ATF typeface designed in 1897 by J. Stearns Cushing.  The bulging bowl on the P, and the extended drop on the lhs of M in PASSEMENTE, and  the extended leg on the R IN VILLEURSANNE and OR do not match the feel of the rest of the letters and seem to be titling flourishes. Note that the leg in the R of ARIUS is ends in a serifed flat terminal. The flourished letters are perhaps in the style of Solo's Webster [as found by Ryuk]. Webster is one of three very similar typefaces, the others are Lafayette and Washington, cut by Gustave F. Schroeder for Central in the 1890s.<br>
      Nor did I find an exact match for the initial letters M and C. But you would be part way there with P22 Kilkenny <a href="http://www.myfonts.com/fonts/ihof/p22-kilkenny/" title="http://www.myfonts.com/fonts/ihof/p22-kilkenny/">http://www.myfonts.com/fonts/ihof/p22-kilkenny/</a> based on Hermann Ihlenberg's Nymphic, patented  May 21, 1889, and sold by MS&amp;J and later by ATF.<br>
      Don</p>
