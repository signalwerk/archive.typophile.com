    <p>The final cut of Reader will only be sold 50 times (each ZIP file is numbered) – once they are gone, they are gone! </p>
    <p>Reader black comes with a full latin character set, uppercase only! An ultra thick black cut with bevelled edges for use at larger point sizes. Perfect for that headline!</p>
    <p>Check it out at <a href="http://www.colophon-foundry.org" title="http://www.colophon-foundry.org">http://www.colophon-foundry.org</a></p>
