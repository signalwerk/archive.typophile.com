    <p>I’m rather green when it comes to using vector software. </p>
    <p>I’ve been using exporting my Freehand files instead of saving them, because I run into compatability issues between computers when I ’save as’. However, I cannot export over another file, instead I have to create a new file name each time. I’ve been doing this for months, but there has got to be a better way. What am I doing wrong?</p>
    <p>(I could use Illustraor, and save as a ’.ai’ file, but I’m not comfortable designing with Illustrator, particularly fonts)</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/34558" class="topic-previous" title="Go to previous forum topic">‹ MAJOR Bug with kerning in FontLab 5.0.3</a> <a href="/node/16288" class="topic-next" title="Go to next forum topic">where to begin creating ARABIC font? any suggestions? ›</a></div>
