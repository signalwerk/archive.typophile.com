      <p>Exporting to what?</p>
      <p>Freehand is a great piece of software. Alas, it’s dead. Adobe is no longer going to be releasing any updates for it. Still, it’s usable software, but just a heads up on that.</p>
      <p>If you are making fonts, then you don’t really need to export at all. Just cut-and-paste.</p>
