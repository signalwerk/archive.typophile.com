  html: |-
    <p>Does anyone know how to set some parameters that restrict a font to specific sizes? In my case, I need the character to be no smaller than 12pt and no bigger than 72pt. I would like the character to change to another character for sizes smaller than 12pt or bigger than 72pt.</p>
    <p>Is this sort of thing possible in FontLab 5 with the OpenType programming panel?</p>
    <p>Thanks!</p>
