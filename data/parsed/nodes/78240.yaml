    html: |-
      <p>Also, realistically, such a restriction would be impractical. Let's say you set a line of text at 71pt using your font, and then you zoom in the page by 200%. What should happen? The declared font size will still be 71pt, but the displayed size will be 142pt. Should the font not render? Disappear? Be substituted by another font? </p>
      <p>Practically speaking, there are no real measurement units which you could use to set these kinds of limits. Imagine a font being used on a website. The web page can be rendered onto a tiny smartphone screen and onto a huge screen, with different zoom levels, different relations between CSS pixels and point sizes, and real pixels. The fact is that fonts, and layouts, these days are *scalable* — completely scalable. Introducing limits to the scalability would be somewhat artificial and would essentially not work well in many cases. </p>
      <p>A.</p>
