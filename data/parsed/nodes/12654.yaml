      <p>Thanks for talking to your friend, Nathan. It would be great if this query turns up anything. But black flies? Who told you that? They're called "mosquitoes," but they are in fact the size of dogs ...</p>
      <p>Nick, thanks for the tip about Zab. I can't find much about her online except that she is a graphic designer and an ATypI member. Does she have a studio here?</p>
      <p>Andrew, are you moving indefintely, or just for awhile? It is actually not bad here in the summer, but <strong>watch out</strong> for the winters! I actually live in Osborne Village now but will be moving closer to the University of Winnipeg mid summer, mainly because of the cold. (20 minute walks are nice in summer, but not in -30 windchills). Send me an email when you're going to be moving. It'll be nice to know someone else into type here in town.</p>
