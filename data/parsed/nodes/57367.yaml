    html: |-
      <p>I’d say it’s especially nice to use small caps in blocks of text where there are a lot of abbreviations or acronyms. Ubiquitous full caps make the text very difficult to read. </p>
      <p>I have to use lots of acronyms in blocks of text and actually full caps look too clunky and I find small caps a bit pretentious. So I tend to use full caps but reduced a point size and bumped up from regular to medium to get the weight right. I think Bringhurst had the same idea. </p>
      <p>It depends on how much you need abbreviations and how they look on the page I think.</p>
