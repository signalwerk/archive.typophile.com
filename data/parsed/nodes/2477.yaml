    html: "<p>The sample posted by Peru is of a typeface I have long sought.  <br> <br>It has been used in Sanrio's Little Twin Stars character logo: <br><img src=\"http://www.typophile.com/forums/messages/83/22776.jpg\" alt=\"\"> <br><img src=\"http://www.typophile.com/forums/messages/83/22777.gif\" alt=\"\"> <br>(Sorry, these were the best examples I could find online.) <br> <br>I have also seen it on the occasional old t-shirt. And it still exists today in Oakland, CA on the sign for Dave's Market on Park near-ish to MacArthur. <br> <br>I would LOVE to know what this typeface is, if it's available digitally, or if I can make a digital version.</p>"
