    html: |-
      <p>Tintin, </p>
      <p>I agree with the previous comments, especially about the icon not being centered. Visually I think it needs to be either dead on or purposely off center.</p>
      <p>I don’t understand the name either... time time?  A logo should immediately convey what the product is it’s selling or promoting. Adding a clock is so literal and I think only serves to describe the name, not the profile of the company. It takes on the air of a watch repair company instead of a job placement agency... which I think is what the website appears to indicate. Perhaps a “time card” concept would be appropriate? Or if they really like the clock perhaps use the two words as arms of a clock?  Don’t give up yet, you’ve got a great start.  </p>
      <p>d</p>
