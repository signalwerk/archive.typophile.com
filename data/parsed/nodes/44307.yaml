      <p>Tintin,</p>
      <p>First off I think the logos look good but I do have a few suggestions.</p>
      <p>The first logo looks a bit more playful and less upscale than the latter. I don’t know the client like you so it may work for them. It feels like it’s trying to look balanced on either side but it feels like there’s a bit more optical space on the left.</p>
      <p>The second logo has a more corporate feel like either the clock is too heavy or the type is too light. I like what you did for the hands on the clock but they may not really mesh with the serif.</p>
      <p>Great work so far.</p>
