    <p>Hi,</p>
    <p>My client is a job agency named “TimeZeit”, a hybrid of the English “time” and its German equivalent “zeit”. </p>
    <p>The two founders want a solution that appeals to corporate clients but looks fashionable and stylish as well.</p>
    <p>The first draft of their new website can be accessed <a class="freelinking-external" href="http://timezeit.designbits.de">here</a>.</p>
    <p>And this is the first two logo drafts I came up with:</p>
    <p></p><div class="imageWrap"><img src="/files/logo_uhr_1_6467.png"></div><p></p>
    <p></p><div class="imageWrap"><img src="/files/logo_uhr_2_6644.png"></div><p></p>
    <p>Please let me know which solution you think is better and how it might be improved. Thanks!!</p>
