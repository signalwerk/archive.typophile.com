    html: <p>I do not understand how tight leading could speed reading of a fast-paced novel. If leading is either too tight or too loose it slows reading. Tightly leaded prose which causes doubling and reading effort will not make a "page-turner". Poetry whose lines are widely separated will be hard to read as poetry, since the sense often flows across lines (poetry readers rarely "contemplate individual lines", at least this poetry reader doesn't). I suppose there might be something to be said for it with some lyric verse, but not as a general rule. <br> <br>I would say that approach (1) is the only sensible approach. I suppose one can conceive circumstances where one deliberately wanted to produce unreadability, but they surely must be rare. It is probably much closer to the mark to say that there may be circumstances (e.g. reference works) where readability has to be sacrificed for compactness and leading may be adjusted accordingly.</p>
