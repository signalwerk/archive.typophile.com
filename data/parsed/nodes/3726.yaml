    html: <p>Certain typefaces need more leading than others to be legible. The measure of a line is also a factor. It's a judgment, rather than a rule book call. We've never had it so good as today when our computers allow us to set paragraphs until we get it right. Years ago those first proofs often came as somewhat of a surprise.</p>
