    html: <p>Yeah, see that's what I thought, but two things bother me about that approach. <br> <br>Firstly, given that a letter is to a sentence, as a sentence is to a paragraph etc, and that one type face may be more appropriate than another for content (you wouldn't set a book on the Bauhaus in Bembo for example). Doesn't it follow that setting type in one manner may be more appropriate than another for certain content. <br> <br>Secondly, would that not make it reasonable to develop a set of rules for leading. For example, verdana, set at 12pt needs 2pt leading at 45 characters per line, plus 1pt for every ten characters above 45 per line. And if that's reasonable why wouldn't leading be an inherent part of a type face like kerning? <br> <br>cheers.</p>
