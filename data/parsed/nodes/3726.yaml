  html: "<p>Hi, <br> <br>I'm slightly confused on how to apply leading. It seems to me that there are two basic approaches. Unfortunatly, they don't seem to be compatible: <br> <br>Approach 1 <br>Readability is everything. A good starting point is 120% of the type size, which should be increased or decreased according to line length, and type characteristics such as descenders/ascenders. <br> <br>Approach 2: <br>Leading is inherent to the manner in which a reader interprets the content. A fast paced novel should have tight leading, speeding the rythym of content. A book of poetry should have generous leading, slowing the rythym and enabling contemplation of individual lines. <br> <br>So here's my questions: <br> <br>1) I know there's not always a right approach, but is there one that's wrong more often than not? <br> <br>2) Any other approaches? <br> <br>cheers. </p>"
  html_clean: "<p>Hi, <br> <br>I'm slightly confused on how to apply leading. It seems to me that there are two basic approaches. Unfortunatly, they don't seem to be compatible: <br> <br>Approach 1 <br>Readability is everything. A good starting point is 120% of the type size, which should be increased or decreased according to line length, and type characteristics such as descenders/ascenders. <br> <br>Approach 2: <br>Leading is inherent to the manner in which a reader interprets the content. A fast paced novel should have tight leading, speeding the rythym of content. A book of poetry should have generous leading, slowing the rythym and enabling contemplation of individual lines. <br> <br>So here's my questions: <br> <br>1) I know there's not always a right approach, but is there one that's wrong more often than not? <br> <br>2) Any other approaches? <br> <br>cheers. </p>"
