    html: <p>My feeling is that leading and word spacing are somehow related, more so than leading and type size.  <br> <br>As the space between words grows, I always feel that I want more space between the lines. As lines get tighter, so, it seems to me, should the leading.  <br> <br>I suppose this makes sense. If I have very tight lines with a large leading, then the lines would start to look like railroad tracks, or bars across the page. If my lines were very loose, with tight leading, well then there would be terrible rivers.</p>
