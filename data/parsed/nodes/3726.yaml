    html: <p>There is a new magazine Design Inside (Something like that). I find it unreadable the line measures are across the lenght of the page and the pull quotes are set with minus leading making acenders and decenders crash into one another. I only mention this because in the mid to late 60's and early 70s it was fashionable to kern type to unreadable tightness and use little or no leading. The opposite trend has been going on now for a while. The point being, as with fashion and color, kerning and leading will change.</p>
