    html: <p>&gt; right or wrong. this brings up a good point. there are certain &gt; guidelines and classically, or even better, historically proven &gt; "rules" that designers use as the foundation for building something &gt; that works. this being said, no one is going to break down your door &gt; and haul you in for questioning if you don't follow said rules, but i &gt; think it's also important to know what rules you're breaking. &gt; personally i love to see educated designers challenging the standards &gt; of our trade if it's working for them. there are a million things out &gt; there that i wouldn't necessarily think of, or even want to do, but &gt; that really do work and allow for an interesting, if not valid &gt; solution. with leading, i think legibility is important in some &gt; situations, but i've also seen circumstances where the content &gt; allowed, almost demanded, decreased legibility. when a feeling or &gt; personality created by an exaggeration in leading (one way or another) &gt; adds an important layer to the content. for me, the only real rule is &gt; to respect the content and my solutions have always been found there.</p>
