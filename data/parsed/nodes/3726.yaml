    html: "<p>I think one probably could establish guidelines for particular fonts for particular usages ... but I wouldn't necessarily let the font designer do it because (a) of the point Hrant makes, (b) because I'm not sure even a talented font designer would necessarily get it right, and (c) because circumstances vary so much. <br> <br>I don't actually agree that a letter is to a sentence as a sentence is to a paragraph etc. One reads words, not letters. And one reads groups of words, not sentences (and certaintly not paragraphs). They are quite different units, and the relationship of each unit to the next is actually different. <br> <br>For me at least in many instances \"feel\" is low on the list. Of course we can all come up with inappropriate matches of type to subject-matter, and given the multiplicity of usable text faces, they can and should be avoided. But, when you think about it, why not set a book about Bauhaus in Bembo, if you think Bembo is a good readable typeface? It's not, after all, wholly inappropriate for those in the know (a piece of industrial-age type design from the early- mid-20th century which functioned excellently in its time). Which could not be said of a book set in Futura. The idea that a book design should somehow 'enact\" its subject-matter seems to me to be crude. One need not set Virgil in rustic capitals printed on parchment with no word spaces. One should not. One need not set Dickens in some ghastly modern with enormous gaps between the words. Books about things are not to be confused with the things they are about. <br> <br>For (most) readers books are things to be read. In so far as they are things, they are properly the subject of designers, and good book design which makes them the best things they can be is wonderful. But unless they function as things to be read, all the design in the world will not save them. That is what is so ghastly about some of, say Bruce Rogers', book designs: too much emphasis on the thing (the antique type, the fleurons, the bindings etc), not enough on the function. As a reader give me a nicely typeset penguin paperback any day over some handsome quarto volume artily tricked out.</p>"
