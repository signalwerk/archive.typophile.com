    html: "<p>I think there are three forces acting on optimal leading: economy, readability, and atmosphere. <br> <br>Economy simply wants leading to be minimal. Readability wants leading to be enough to avoid: errant line returns*, and errant fixations to subsequent lines (especially when the type is loose and needs bigger word spaces). However readability also doesn't like very large leading because that increases page jumps/flips. As for atmosphere, it's subjective, and has to do with how airy you want to page to feel (but also the nature of the type - like a Bodoni likes more leading). <br> <br>* This depends on line-length, as you say. As for \"type characteristics such as descenders/ascenders\", this is huge, and doesn't get nearly enough airtime. When comparing two fonts for economy for example, people are usually smart enough to vary the point size to match their apparent sizes, but they make the leading identical. You have to worry about <i>apparent leading</i> too. <br> <br>Pulling atmosphere out of the equation for argument's sake: optimal leading should be as little as possible without affecting readability (unless there's some strange force majeur having to do with economy). BTW, this is also the reason why a real text font has descenders notably shorter than its ascenders. <br> <br>&gt; develop a set of rules for leading. .... why wouldn't <br>&gt; leading be an inherent part of a type face like kerning? <br> <br>That's an interesting proposition, but I think it belongs outside of a font because type designers don't (and shouldn't) have too much control over how their fonts are <i>used</i>. <br> <br>hhp <br></p>"
