    html: |-
      <p>Given the fact that the sign is a neon light construction, it's not so easy to find an actual digital font corresponding to the original design. The "NFL" looks probably custom/deformed and the "N" of "MAN" looks 180 degrees rotated.</p>
      <p>You can try to approximate it by modifying a similar font e.g. <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Dafont-2&amp;ffam=RitaSmith%20-%20Medium&amp;fid=d9f36fa6574f32caa1e350215e437f87&amp;fsize=60&amp;text=THE%20NFL%20MAN&amp;fit=1" rel="nofollow">Rita Smith (Medium)</a></strong> by Claude Pelletier</p>
