      <p>Firstly understand the difference between legibility and readability - the best short text on this - IMHO - is the section in Walter Tracy’s ‘Letters of Credit’.  Some of the confusion over these topics by those who should have known better, can be better understood now as a result of the research of William Berkson &amp; Peter Enneson in ‘Readability: discovery and disputation’ - the retrieval of the reputation and research of Matthew Luckiesh (1883-1967) - in Typography Papers · 9.</p>
      <p>Edward Tufte’s classic ‘The Visual Display of Quantitative Information’ is a highly refined introduction to and exemplar of the presentation of non-text information and an appeal to eliminate unnecessary visual ‘noise’.</p>
      <p>Balance and selection are rarely given enough emphasis - images can easily overwhelm and undermine text, especially if they have their own extensive captions - the main text matter in many highly illustrated books are seldom ever read properly &amp; people who have browsed the images will swear that they’ve read the book! Keep to the text grid unless you are prepared to abandon it for a dramatically different page structure (eg. full bleed) in an inset.</p>
      <p>Tschichold’s ‘On the Correlation of Text to Page Area’ is the seminal text not only to understand the historic role of the grid, but demonstrates the common heritage and geometric logic of the ergonomics and perceptual balance of the double page spread both in its classic form but also as a congruent basis of asymetric layout on a page proportioned grid. Tschichold’s classic book grid also generates a 9x9 proportional modernist page grid matrix - see below for construction - the crucial element is the resulting rectangle top left of the recto text area - an exact 1/9 x 1/9 page proportion grid unit. And it works for any page proportions giving you margins, text area and layout. Key to the scriptorum!</p>
      <p>Preserving sizes &amp; stroke widths from the main text is a good aim, but a switch to a sans typeface with the flexibility of for example Univers for diagrams and labelling is a well established tradition. If you switch fonts in bodies of text - take the trouble to exactly match x-heights - something that almost cannot be done in letterpress but is almost trivial with digital fonts.</p>
      <p>The Monotype Recorder on ‘The Setting of Mathematics’ by Arthur Phillips (1956) is a one of a kind reference, if you should ever need it.  Some of the University Presses and their typographers have recognisable House Styles and Rules for dealing with tabular material and it’s worth collecting your own annotated examples - I’m a great believer in design by exception - follow good models as carefully as you can - correcting clear errors and only inventing new treatments when confronted with genuinely new materials not previously incorporated in the series style.</p>
      <p>See the ‘Book Design: Text Format Models’ by Stanley Rice (Dec 1978) when designing your style architecture.</p>
      <p>You’re asking good questions - borrow from past giants but always imagine personas for your readers and the circumstances of their reading - go deep and enjoy.</p><div class="imageWrap"><img src="http://typophile.com/files/TschicholdGrid_3784.jpg"></div><p></p>
