    html: |-
      <p>The treatment of captions is critical, as it provides a working bridge. between body text and images, that informs page layout.</p>
      <p>A lot depends on how much information, and in how many categories, is contained in the captions.</p>
      <p>Bear in mind that many, if not most people, barely glance at pictures before reading captions.</p>
      <p>IMO, nothing is more annoying in a book than captions which are not right beside the images to which they refer, or not organized in a way that is consistent.</p>
      <p>I would suggest bookstore/library perusing of books similar in content to yours, identifying those with caption design which communicates promptly and efﬁciently to you, analyzing why, and adopting a similar strategy.</p>
