      <p>Thank you, this all makes sense :)</p>
      <p>With respect to images without captions but which are referred to by the text, I wonder about their placement on the page or spread. It seems to help when the images’ dimensions align with, say, a 9x9 grid layout of the page but I am reluctant to flow text around images. I have always somehow disliked how this scatters text.</p>
      <p>There are some hints in <a class="freelinking external" href="http://www.amazon.com/Designing-Books-Practice-Jost-Hochuli/dp/0907259235" rel="nofollow">Designing Books</a> which helps.</p>
      <p><strong>Tim:</strong> Thank you so much for all the tips, I found a few excerpts from <a class="freelinking external" href="http://www.amazon.com/The-Form-Book-Morality-Typography/dp/0881791164" rel="nofollow">The Form of the Book</a>. The other references I've added to my list :)</p>
      <p><strong>Nick:</strong> That's a good idea, I'll spend a day at the local library and poke around :)</p>
