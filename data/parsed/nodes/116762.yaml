    html: "<p>I know this was a long time ago - but I just wanted to endorse Nick’s suggestion of going to look for good models - I am a huge advocate of design by exception - find a really good model for similar material and use its elements that work best - spend your precious creative time crafting the elements that are uniquely required by your new content that aren’t already provide in your model ... check out the bible - Stanley Rice - Book Design: Text Format Models from the early pioneer days of style-sheets - I’ve suggested before that someone could make a killing and/or earn a PhD by doing a modern digital equivalent - just say you heard it here first ...</p>"
