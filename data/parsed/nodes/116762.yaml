    <p>I've been reading through several books on book design (<a class="freelinking external" href="http://typographica.org/typography-books/the-elements-of-typographic-style-4th-edition/" rel="nofollow">Elements of Typographic Style</a>, <a class="freelinking external" href="http://www.thinkingwithtype.com/" rel="nofollow">Thinking with Type</a>, <a class="freelinking external" href="http://www.amazon.com/Points-Spacing-Arrangement-Classic-Typography/dp/0881791199" rel="nofollow">Finer Points of Spacing and Arrangement of Type</a> , <a class="freelinking external" href="http://yalepress.yale.edu/yupbooks/book.asp?isbn=9780300075700" rel="nofollow">On Book Design</a>, <a class="freelinking external" href="http://www.amazon.com/Designing-Books-Practice-Jost-Hochuli/dp/0907259235" rel="nofollow">Designing Books</a>, <a class="freelinking external" href="http://ilovetypography.com/2012/05/02/type-matters-book-review/" rel="nofollow">Type Matters</a> and some more...) to learn what makes a book legible and readable and "nice", and what doesn't.</p>
    <p>While all these reads were interesting and a huge learning opportunity (for a newbie in this field) I did miss elaborations on images and image placement, tables, and their respective subtitles.</p>
    <p>What are the general guidelines and recommendations with respect to size and placement of images and tables? How to flow text around them (if at all, I feel reluctant to do that) and where might I want to avoid them altogether?</p>
    <p>Any pointers, hints, and reading suggestions are welcome :-) Thanks!</p>
