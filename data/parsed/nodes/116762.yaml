    <p>While all these reads were interesting and a huge learning opportunity (for a newbie in this field) I did miss elaborations on images and image placement, tables, and their respective subtitles.</p>
    <p>What are the general guidelines and recommendations with respect to size and placement of images and tables? How to flow text around them (if at all, I feel reluctant to do that) and where might I want to avoid them altogether?</p>
    <p>Any pointers, hints, and reading suggestions are welcome :-) Thanks!</p>
