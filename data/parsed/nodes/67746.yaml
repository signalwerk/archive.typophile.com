    html: <p>the closest I've come to is Trebuchet.  I thought it might be Fruitger, but that font has flats on the tops of the "M", and the above doesn't.  And the "R" in Futura is different so that's out too.  The "E" on Trebuchet though has even length top &amp; bottom horizontal lines, where as the "E" above has a slightly longer bottom line than the top one.  Uggh, help!  Thanks!</p>
