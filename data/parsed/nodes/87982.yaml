    date: 2011-12-05T02:57:00
    date_raw: 5 Dec 2011 — 2:57am
    votes: null
    html: |-
      <p>Igor's code should actually look like this (the <code> include_dflt </code> statements being optional but included below for clarity):</p>
      <pre>feature ss01 {   # Numero substitution
        script dflt;
          sub N degree by numero; # default script behavior
        script latn;
              sub N degree by numero; # default latin behavior
            language FRA include_dflt ; # French
            language ITA include_dflt ; # Italian
            language DEU include_dflt ; # German
            language ESP exclude_dflt ; # Spanish
              sub N ordmasculine by numero;
            language POR exclude_dflt  ; # Portuguese
              sub N ordmasculine by numero;
      } ss01;
      </pre><p>
      In response to Synthview's question about languages not listed above, what happens will depend on which script the language belongs to and whether the language has been registered using a <code> languagesystem </code> statement.</p>
      <p>For languages which belong to a script which has not been registered, the substitution following <code> script dflt </code> will be applied.</p>
      <p>For languages belonging to the latin script which have not been registered, the substitution following <code> script latn </code> will be applied (which in this case is identical to the one above).</p>
      <p>For languages or scripts which have been registered but which have not been included above, nothing will happen.</p>
      <p>André</p>
