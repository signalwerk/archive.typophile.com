    html: |-
      <p>Jan,</p>
      <p>I had the same question some time ago regarding the development of my own font. A small research did show the problem needs different solution according to the language/keyboard in use.</p>
      <p>N+° makes sense where keyboards offer an easy access to degree sign, but does not help if the keyboard does not brings this key. The same about N+º as ordmasculine is not present in many keyboard layouts. And N+o+[ ] cannot be used in any language where the word "no" is present.</p>
      <p>The solution I built was a stylistic set with Numero substitutions based on the language in use.</p>
      <p><strong>1</strong> Spanish, Portuguese, Catalan, Galego: N+º as ordmasculine is available on these keyboards.</p>
      <p><strong>2</strong> Latin American Spanish, French, Canadian French, Italian, German, Dutch, Polish, Romanian: N+° as the degree sign is the one available.</p>
      <p>As an universal shortcut, I also added the substitution \+N+o = Numero, but I'm unsure if this is the best option. And I still need to verify the keyboard used for Provençal (Occitan), which I supposed is the default French.</p>
    html_clean: |-
