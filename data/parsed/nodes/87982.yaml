    html: |-
      <p>You don't need to use locl feature. Inside any OT feature you can define the script and/or language scope for the substitution. Like this:</p>
      <pre>feature ss01 {   # Numero substitution
        language FRA ; # French
        language ITA ; # Italian
        language DEU ; # German
        script DFLT;   # Default
          sub N degree by numero;
        language ESP ; # Spanish
        language POR ; # Portuguese
        script DFLT;   # Default
          sub N ordmasculine by numero;
      } ss01;
      </pre>
