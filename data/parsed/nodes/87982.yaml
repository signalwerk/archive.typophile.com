    <p>Dear typophiles,</p>
    <p>I’m asking myself which substitution is the best to obtain the № symbol. I’d use a stylistic set for it.<br>
    I was thinking about these ways :</p>
    <p>1. sub N o space by numero;  &lt; o sign</p>
    <p>2. sub N ° by numero;  &lt; degree sign</p>
    <p>3. sub N º by numero;  &lt; ordmasculine sign</p>
    <p>4. sub N ° space by numero;  &lt; degree sign</p>
    <p>5. sub N º space by numero; &lt; ordmasculine sign</p>
    <p>I’m more oriented to 2 and/or 3, and you?<br>
    Thanks,<br>
    Jan</p>
