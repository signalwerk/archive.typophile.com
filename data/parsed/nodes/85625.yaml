    html: |-
      <p>Jens is correct. You cannot dump <em>glyphs</em> into a text file because a glyph means exactly nothing. It's the code points that count, because these form the link between the ASCII (or Unicode) character code you want to display and the actual piece of graphic (the glyph) that's going to be drawn. It's extremely important to understand these concepts correctly before you are going to pull off some low-level trick as you are attempting.</p>
      <p>(This bypasses any Opentype niceties, but then again it should. Opentype features have nothing to do with codepoints -- well, at least nothing you could 'dump into a txt file'.)</p>
      <p>There are Windows APIs -- you don't tell, which is a mortal sin, but I presume you <em>are</em> talking about a Windows program here -- that can return font information, but I cannot remember if I really ever bothered to get down with those. My own experimental program is firmly based on my grasp of the file format of Truetype and Opentype font files, so I can locate and extract the all-important <code>cmap</code> entry and work it out from there.</p>
