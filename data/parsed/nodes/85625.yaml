      <p>I see the request is from mainland China, where the preferred encoding is neither UTF-8 nor UTF-16 but <a href="http://en.wikipedia.org/wiki/Guobiao_code">GB 18030</a> and where the "niceties" of unicode may not be the main concern.</p>
      <p>If you install ttx and apply <code>ttx -i -t cmap filename.extension</code> to your font file, giving the file <code>filename.ttx</code>, then the following Python code should give the desired text (on a single line) in <code>filename.txt</code>. Modifying the code to cut into lines, if needed, should be straightforward.</p>
      <p>from xml.dom.minidom import *<br>
      import sys, re</p>
      <p>f=open(sys.argv[1])<br>
      r1=re.compile(r'(.+)\.ttx$', re.IGNORECASE)<br>
      foutname=r1.match(sys.argv[1]).group(1)+".txt"<br>
      fout=open(foutname,'w')</p>
      <p>doc=parse(f)</p>
      <p>encdng='gb18030'</p>
      <p>str=''<br>
      cmaps=doc.getElementsByTagName('cmap_format_12')<br>
      if not cmaps:<br>
        cmaps=doc.getElementsByTagName('cmap_format_4')<br>
      maps=cmaps[0].getElementsByTagName('map')<br>
      for map in maps:<br>
        code=int(map.getAttribute('code'),16)<br>
        if code &gt; 0x20:<br>
          str=str+unichr(code)<br>
      fout.write("%s\n" % (str.encode(encdng)))<br>
      fout.close</p>
      <p>Of course, 'gb18030' could be replaced by 'utf-8' or 'utf-16' or some other encoding. If you copy the lines above, save to some file, say <code>dmpcmap.py</code> and then execute</p>
      <p>python dmpcmap.py filename.ttx</p>
      <p>you get the text in <code>filename.txt</code></p>
      <p>This was tested on a Mac with <code>python26 @2.6.7_1+ucs4</code> on the font ST Heiti</p>
      <p>Michel</p>
      <p>PS The code does not check the platform because on my Mac, there are fonts without a cmap for Windows and I wanted to get an output file. Also, the code is slow on large files.</p>
