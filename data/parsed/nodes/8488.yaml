      <p><cite>I think it is those who have achieved graff-greatness that deserve a font.</cite></p>
      <p>I kind of agree with the priniciple of this, though I think too much hero-worship is bad for any subculture that is about coming up from nowhere and making a name for yourself.  However I do get what you mean about the innovators and originators deserving credit more than anyone else. Personally I'm more interested in the regional variations in letter styles that evolved pre-internet, and they were rarely (never?) invented by a single writer. Anyhow, we are confusing real-world graffiti credibility with producing a typeface here, the two are different.</p>
      <p>Why do I think that top league writers won't be the ones to create a useful graffiti-style typeface? Well for a start, graffiti is not calligraphy. Graffiti is about freeforming using a set of letters. It prides itself on variation, funk, flow and flair, whereas calligraphy is generally much more restrained and repetitive, making it much easier to formalise into type. I would be pretty surprised if a top league graffiti writer can really crack the graffiti-type thing as generally they aren't as restrained or disciplined as calligraphers.</p>
      <p>Food for thought (just to confuse things):</p>
      <p>P22's typeface based on Cézannes handwriting (for example) is interesting as a comparison. We all realise that P22 aren't in the same league as Paul Cézanne as artists, but likewise Cézanne himself couldn't do what P22 have done, even though he is the undisputed master of his own handwriting style! in 2008 Honda decides to use this typeface to sell their cars to arty types. Cézanne fans around the world gasp in horror, but the use of the typeface doesn't detract from the brilliance of his art.</p>
      <p>PS: I personally wouldn't suggest creating a font based on a single writers style, but I hope you get my point.</p>
