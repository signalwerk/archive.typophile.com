      <p>I've got to agree with hrant; an OpenType version of this might prove more worthwhile if you are attempting to give this style any credibility. Graf writing is beautiful in that each letter is distinct. The letterforms in static fonts are unchanging. In a graffiti tag the two T's in "letterform" would appear as a ligature, whereas in a static font, they would both appear exactly the same. Think about how you can incorporate ligatures into your idea. Again, look into OpenType.</p>
      <p>One other thing: your forms are very clean, obviously edited in Illustrator. How can you soften them to give them a more textural appearance—as graffiti lettering would be?</p>
      <p>have fun.</p>
