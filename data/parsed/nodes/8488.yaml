      <p>Sorry but this thread just keeps running through my mind. I know this is a very old thread &amp; no one has posted to it in years but I just want to set some things straight in the interest of those who may read it in the future.</p>
      <p>This thread starts in 2005. By then there were well over 100 graffiti style fonts circulating around the world. My foundry was already on our 3rd large scale cdrom collection &amp; getting thousands of visitors to our sites every day.  By this time several other popular font sites had added categories for graffiti and a number of very real, known &amp; credible graffiti artists as well as several highly skilled &amp; well known font developers had been involved in the creation of graffiti style typefaces. The oldest digital typefaces created by "real" graff writers are from the late nineties. I myself first published in 1999.</p>
      <p>Other posts in this thread are circa 2007 &amp; while all touching on real issues seem to ignore the reality that such art &amp; science as described had already been well explored by then. Open type graffiti fonts had long existed already and successful compromises between organic graffiti lettering &amp; mechanical type had long since been achieved in full view, in the open market &amp; with considerable popularity. </p>
      <p>By 2009 people were posting in this thread about the very real issue that a mechanical fonts just cant do what writers do by hand. This is mostly true but also very obvious. Graffiti takes many forms some of which are very mechanical &amp; can very successfully translate into type… others not so much. In any case, very talented &amp; highly skilled people had worked hard on this issue for over a decade at this point &amp; in some cases very successfully.</p>
      <p>Generally speaking, a graffiti font is used like a headline font. In most cases it's used in an even more prominent, specialized &amp; customized manner than even a headline font. In other words graffiti fonts are not used usually used to set type. They are used to emulate graffiti.</p>
      <p>No disrespect to anyone who participated in this very intelligent discussion but at each stage of this thread the debate is several years behind the reality. Not all fonts are free. Not all fonts are popular. Obviously very few graffiti style fonts had been used by the people who wrote all this. The internet is a strange place &amp; who knows what will end up telling the tale in the end. Just in case this article is part of that tale I just had to inject some facts.</p>
    html_clean: |-
