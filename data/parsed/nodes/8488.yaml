      <p>Wes,</p>
      <p>Thanks for weighing in. You've got immersive and deep experience with graffiti styles and a real connection to graffiti and its graphic potential. </p>
      <p>I tend to think no graffiti font will look any good without OpenType. I think of graffiti as a form of performance calligraphy, done quickly. It's all about gesture. Type takes all the gesture out of letterforms by making them tame, so they can all work in any combination.  In graffiti, there are so many endings, dots, finishing marks, swashes, etc. It's almost like Arabic in its complexity. I think someone really tuned to graff styles should develop the substitution rules and ligature options for a graffiti font.</p>
      <p>And then that graffiti artist should get credit for their work!</p>
