      <p>Hello everyone!</p>
      <p>Lots of interesting opinions &amp; comments here. It's hard to agree or disagree with any of them entirely. I have been a graffiti artist since about 1991. That's about 24 years at this point. I also happen to be the founder of the (I must say) ORIGINAL &amp; official Graffiti Fonts® type foundry which started somewhat unofficially in 1999 and was in full active commerce, enjoying trademark &amp; copyright protection by about 2003-2004. I have personally created more graffiti style typefaces than the rest of the collective world. I have spent most of my adult life &amp; most of my money to develop &amp; protect the relative purity of graffiti art as it makes it's debut into the world of type. </p>
      <p>Graffiti lettering defies typographic concepts &amp; mechanics by it's very nature, no matter the advanced capabilities of opentype or the prowess of the font developer.</p>
      <p>When I first set upon this mission there was literally no such thing as a graffiti style font. It is debatable wether or not I was the first to create one. In any case I am personally acquainted with the few other people who unleashed the other "first" graffiti style fonts &amp; its a close call and is a VERY small pool to swim in.</p>
      <p>I pondered the artistic, ethical, cultural &amp; commercial implications of this exercise very deeply as I created my first fonts. I grew up deeply immersed in Hip-Hop culture &amp; was blessed &amp; lucky to stumble into the ground floor of other aspects, not just the font thing. I take it very seriously. To me Hip-Hop is like Kung Fu. To others it may me nothing more than a gimmick. </p>
      <p>It IS offensive when someone from outside the culture seeks to profit from it. It IS inappropriate for one to co-opt the culture or craft of another for personal gain... but this is expected &amp; can not be helped. When a non-writer or novice writer attempts to create a graffiti style font the result is obvious. This would seem to be a self-solving problem but unfortunately it is not.</p>
      <p>Since the general audience can not be expected to understand the intricacies of a complex artform like graffiti what happens is that these bastardized styles begin to shape peoples impression of graffiti lettering as if it were nothing but a bunch of unsophisticated scribbling which is unfortunately what most people think already. As a writer I do not turn the styles of other writers into typefaces I stick to my own styles &amp; those of writers who seek us out wanting to contribute. </p>
      <p>It is hard enough to defend our intellectual property from the likes of Google without having the waters further muddied.</p>
