      <p>A very interesting thread indeed!! Lots of very valid points being made here.</p>
      <p>pu.ej.23.'s comment about scanning your own lettering is one of the most valid I think. I've been almost obsessed by creating a graffiti typeface for a while now (and I'm currently trying).</p>
      <p>The main problem is the fact that by nature, a tag is dynamic, each letter creating tension with those around it. The flow of the tag also relies heavily on the way it interacts with it's substrate/surroundings.</p>
      <p>For these reasons, creating a genuine authentic tag style "typeface" is nigh on impossible.</p>
      <p>And unless the typographer who chooses you use the face is willing to do some serious kerning and baseline shifting, the end result will always look contrived, naive and just plain wack.</p>
      <p>This is all coming from a graffiti writer's point of view.</p>
      <p>Anyway! Having said all that, here are some of the letters I’ve been drawing. As you will see they are stylized and irregular in shape, so would never really work as a traditional typeface. </p>
      <p>But do a bit of tweaking, and you have yourself a fresh lookin’ tag.</p>
      <p><img src="/sites/default/files/old-images/sample_4562.jpg"></p>
