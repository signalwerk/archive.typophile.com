      <p>Do you have any examples of other letter styles that have been formalised into a typeface? Wouldn't a lot of brush script fonts fall into that category?<br><a href="http://www.houseind.com/include/getimage.php?id=1877">http://www.houseind.com/include/getimage.php?id=1877</a></p>
      <p>For me, the closest examples I can find are comic style lettering. They often rely on overlapping and maintain the dynamism even though they are formalised.</p>
      <p><a href="http://www.blambot.com/font_deathrattle.shtml">http://www.blambot.com/font_deathrattle.shtml</a><br><a href="http://www.blambot.com/font_badaboom.shtml">http://www.blambot.com/font_badaboom.shtml</a><br><a href="http://www.blambot.com/font_blamblam.shtml">http://www.blambot.com/font_blamblam.shtml</a><br><a href="http://www.blambot.com/font_entrails.shtml">http://www.blambot.com/font_entrails.shtml</a></p>
