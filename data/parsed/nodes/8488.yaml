      <p><a href="http://www.blambot.com/font_deathrattle.shtml" class="link-external">http://www.blambot.com/font_deathrattle.shtml</a><br><a href="http://www.blambot.com/font_badaboom.shtml" class="link-external">http://www.blambot.com/font_badaboom.shtml</a><br><a href="http://www.blambot.com/font_blamblam.shtml" class="link-external">http://www.blambot.com/font_blamblam.shtml</a><br><a href="http://www.blambot.com/font_entrails.shtml" class="link-external">http://www.blambot.com/font_entrails.shtml</a></p>
      <p>OpenType would be nice but there's no way the final typeface sales could pay for the development of the extra glyphs.</p>
