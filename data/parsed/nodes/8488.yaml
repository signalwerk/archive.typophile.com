    html: |-
      <p>&gt;I didn’t see where he said he wasn’t part of that culture.</p>
      <p>I think that Muffin was pointing out how this person hasn't reached the level of contributing to the graff scene. There are many "graff writers" but rarely do you find "good style writers." Picking up a marker is one thing, mastering it is a whole other thing. I think it is those who have achieved graff-greatness that deserve a font. All too often, I see <em>bad</em> graff wanna be lettering on designs from clothes to coporate campaigns that try to be "hip" or "urban" watering down the public perseption and taking jobs away from the people who should be doing this type of design. Then we have companies like Scion who are using the pros to do graff inspired designs.</p>
      <p>Style writers and long term practitioners risk alot to put their letters on the walls, including arrest and confrentation with peers...not to mention the harsh critiques from fellow writers. </p>
      <p>There is a certain feel to "Field tested" graff styles that cannot be emulated by non-style writers. </p>
      <p>Looking at these glyphs again, I can see a few things I wouldnt personally do "on the job." This is coming from a US West coast perspective and may differ in the mecca:</p>
      <p>•handstyles are rendered very quickly. With this in mind, I would not lift the pen when doing a letter. This limitation causes certain commonalities to the overall letterforms. Some of these in the above alphabet have wabbly lines that are shunned upon over here (shows you were scared when you wrote your name). and there are like 3 strokes in the "K" not to mention other letters.</p>
      <p>• The dot on the "i" is just not cool, 3rd sample is a little better</p>
      <p>• The mini serif does not really go with this. Nor does the larger one in the 3rd sample</p>
      <p>•The "T, G, B, R and U" really need some help.</p>
      <p>•The color of this alphabet does not work. Although graff does not have formal training, letter color is a sign of a solid handstyle.</p>
      <p>•OT will not help this. The font should be solid without help, and OT should assist in adding variety in its display usage.</p>
      <p>...a tad bit of an anal critique, but its difficult to describe it without. Nothing personal</p>
