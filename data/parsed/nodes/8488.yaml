      <p><cite>"The letters are fairly ametur. Seems like there is too much movement in your attempts to show the contrast of a chisel tip."</cite></p>
      <p>Getting the letter 'jigsaw' to work is initially more important than the individual letters. The whole typeface is more important than any individual glyph, so any letter that doesn't 'lock' properly with the other letters needs to be redrawn. This overlapping of characters is something fundamental to making a handstyle typeface work, something that makes graffiti type different to any other handwriting lettering styles (I think? Any examples welcome!). Drawing final characters without solving this problem would be a waste of time.</p>
      <p><cite>"As a practitioner, I feel that 99% of the “graff” typefaces are a disrespect to the culture and something has to change…"</cite></p>
      <p>It seems to me that the development graffiti type is stuck. Those designed by credible writers aren't necessarily good typefaces (<a href="http://www.handselecta.com/fonts.html">http://www.handselecta.com/fonts.html</a>) and for me sit in the same category as some of the FUSE releases (cool, inspiring, experimental but not very useful). So far we have graff fonts that are as good at emulating graffiti as Tekton is at emulating handwriting. It will take someone with a background in typography to finally crack it, rather than simply compiling a set of letters from Seen, T-Kid or any other credible writer. Any real breakthroughs aren't likely to come from anyone credible artists, because initially it's more about problem solving than style.</p>
