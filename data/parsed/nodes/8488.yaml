      <p>Holy thread revival!</p>
      <p><cite>"The letters are little off, they look………….wack. that N is….ewww! They need to be cleaner stokes because now they are just too rigid and not clean. I’m sorry but I must discourage all of this……graffiti font. Graffiti is part of hip-hop culture, and by doing this you are using another persons culture for gain and/or profit. It is wrong for the world to look at graffiti as illegal but yet corporations can use it in advertisements and their actual appeal (Comedy Central) and make money. It is flat out wrong."</cite></p>
      <p>Yeah the letters are actually more like placeholders if you like. The main problem is getting the letters to fit together in a way that looks natural, so on the W for example, the left and right strokes are the most important elements to get working, the 'Innards' of the letter are open to being redrawn at a later date in order to match the rest of the letters. All these letters were drawn in Illustrator using a tablet. Not the ideal way to draw them but the fastest way to put together a 'skeleton' character set that can be quickly duplicated and tested against other letter forms.</p>
      <p>I don't think a typeface like this, if it were ever put into production, could ever be described as being produced "for gain and/or profit". The amount of work involved in doing this properly and the amount of income it would make me would most likely make this a 'not-for-profit-enterprise' if you get my drift. I'd say the chances of me becoming hugely rich from doing this are slim to say the least, in fact it would be much more likely to leave me eating toast based meals for the rest of my life. For your average ad agency looking to tack on a bit of street cred to a youth brand, currently stuck with the option of paying a willing artist to get involved or using one of those nasty free graffiti fonts, it would give them another option: spend $39.00 USD for instant cool. This is where the danger lies, as this is where its open to being abused by McStarCola™ and Co. and their agencies. The truth is though that graffiti as an artform is regularly r-ped for profit by large companies. I admit I'm not keen on being an accomplice to that, but there are some pretty acceptable graffiti fonts out there these days, at least to joe average.</p>
      <p><a href="http://www.graffitifonts.net/fonts.htm">http://www.graffitifonts.net/fonts.htm</a><br><a href="http://www.handselecta.com/fonts.html">http://www.handselecta.com/fonts.html</a></p>
      <p>I think we can safely give up on ever producing a graffiti font that writers will like.</p>
      <p>Regardless of these issues, its the challenge of formalising a handstyle that interests me, as to me, it seems a lot trickier than formalising any other style of handwriting styles. Graffiti fonts have come on a lot in the last few years, but as you know there are many different handstyles out there, so theres room for a few more and still room for improvement.</p>
