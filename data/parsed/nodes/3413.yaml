    html: "<p>Etienne Robial, a major player in TV graphics in France  <br><a href=\"http://www.galerie-anatome.com/expos/expos_passe/robial.html\" target=\"_blank\">http://www.galerie-anatome.com/expos/expos_passe/robial.html</a> <br><a href=\"http://www.graphisme-echirolles.com/memoire/1993/MG93SP_GRIL2.html\" target=\"_blank\">http://www.graphisme-echirolles.com/memoire/1993/MG93SP_GRIL2.html</a> <br><a href=\"http://www.irepp.com/musee/expo/entre/e02.htm\" target=\"_blank\">http://www.irepp.com/musee/expo/entre/e02.htm</a> <br>always used old woodtype samples to set logos and when can't find right letters, use computers fonts but move them a bit, change size a bit each by each to create overal distortion. That way the overall image is \"better\". <br> <br>Same idea is behind is CANAL + logo in italic to avoid strange alignements: <a href=\"http://www.canalplus.fr/\" target=\"_blank\">http://www.canalplus.fr/</a> <br>They use a special futura in Italic always for same reasons, only figures and maths signs are roman. <br></p>"
    html_clean: "<p>Etienne Robial, a major player in TV graphics in France  <br><a href=\"http://www.galerie-anatome.com/expos/expos_passe/robial.html\" target=\"_blank\" class=\"link-external\">http://www.galerie-anatome.com/expos/expos_passe/robial.html</a> <br><a href=\"http://www.graphisme-echirolles.com/memoire/1993/MG93SP_GRIL2.html\" target=\"_blank\" class=\"link-external\">http://www.graphisme-echirolles.com/memoire/1993/MG93SP_GRIL2.html</a> <br><a href=\"http://www.irepp.com/musee/expo/entre/e02.htm\" target=\"_blank\" class=\"link-external\">http://www.irepp.com/musee/expo/entre/e02.htm</a> <br>always used old woodtype samples to set logos and when can't find right letters, use computers fonts but move them a bit, change size a bit each by each to create overal distortion. That way the overall image is \"better\". <br> <br>Same idea is behind is CANAL + logo in italic to avoid strange alignements: <a href=\"http://www.canalplus.fr/\" target=\"_blank\" class=\"link-external\">http://www.canalplus.fr/</a> <br>They use a special futura in Italic always for same reasons, only figures and maths signs are roman. <br></p>"
