  - id: 26421
    user: 869
    date: 2004-03-04T05:02:00
    date_raw: 4 Mar 2004 — 5:02am
    votes: null
    html: "<p>A friendly soft sans for TV use? <br> <br><a href=\"http://www.letterror.com/foundry/critter/index.html\" target=\"_blank\">http://www.letterror.com/foundry/critter/index.html</a> <br> <br>Try that little (LTR) Critter. <br> <br>I do graphics for telly for a living, so here's what I've learnt: <br> <br>1: Avoid fonts with thin horizontal lines - they will flicker like crazy on a television screen due to interlacing. <br> <br>2: Pick fonts with a large x-height - that will allow you to experiment with smaller sizes but remain readable. <br> <br>3: (Assuming a nominal resolution of 72pt) Dont use a font smaller than 18pt ever ever, and try and keep to above 21pt as much as possible. <br> <br>4: Dont use finely seriffed fonts - the serifs will break down on screen unless they're set massive. Slab or wedge serifs are cool though - experiment. <br> <br>5: For static screens, gaussian blur the end screen by \"0.3\" in Photoshop: this will help with flickering. <br> <br>6: Be careful of red type, especially if its highly saturated. View your designs on a television or a broadcast monitor to be sure. <br> <br>7: This is where people may disagree with me: Be wary of chunky fonts at smaller sizes, they can appear to fill in a little, much like print on newspaper. <br></p>"
    html_clean: "<p>A friendly soft sans for TV use? <br> <br><a href=\"http://www.letterror.com/foundry/critter/index.html\" target=\"_blank\" class=\"link-external\">http://www.letterror.com/foundry/critter/index.html</a> <br> <br>Try that little (LTR) Critter. <br> <br>I do graphics for telly for a living, so here's what I've learnt: <br> <br>1: Avoid fonts with thin horizontal lines - they will flicker like crazy on a television screen due to interlacing. <br> <br>2: Pick fonts with a large x-height - that will allow you to experiment with smaller sizes but remain readable. <br> <br>3: (Assuming a nominal resolution of 72pt) Dont use a font smaller than 18pt ever ever, and try and keep to above 21pt as much as possible. <br> <br>4: Dont use finely seriffed fonts - the serifs will break down on screen unless they're set massive. Slab or wedge serifs are cool though - experiment. <br> <br>5: For static screens, gaussian blur the end screen by \"0.3\" in Photoshop: this will help with flickering. <br> <br>6: Be careful of red type, especially if its highly saturated. View your designs on a television or a broadcast monitor to be sure. <br> <br>7: This is where people may disagree with me: Be wary of chunky fonts at smaller sizes, they can appear to fill in a little, much like print on newspaper. <br></p>"
