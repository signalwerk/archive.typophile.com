  html: <p>Hi <br> <br>I'm looking for some new suggestions for a clear, legible and flexible typeface for a television channel, mainly to be used in TV and online medium. <br> <br>The font should reflect/support the channel's identity, which is personal, friendly and fresh, and somewhat hip/cool/ipod too. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>I have found some great fonts (see list), but I'm sure there are many more which I've never heard of! <br> <br>FF Max (a bit wide) <br><a href="http://www.myfonts.com/fonts/fontfont/max/" target="_blank">http://www.myfonts.com/fonts/fontfont/max/</a> <br> <br>Section <br><a href="http://lux.thirstype.com/fonts/section/" target="_blank">http://lux.thirstype.com/fonts/section/</a> <br> <br>Apex Sans <br><a href="http://www.thirstype.com/font_apexsans.html" target="_blank">http://www.thirstype.com/font_apexsans.html</a> <br> <br>Simian <br><a href="http://houseind.com/house.php?kit=SIMIAN-FO&amp;sub=lettersetter" target="_blank">http://houseind.com/house.php?kit=SIMIAN-FO&amp;sub=lettersetter</a> <br> <br>Cachet <br><a href="http://www.myfonts.com/fonts/agfa/cachet/" target="_blank">http://www.myfonts.com/fonts/agfa/cachet/</a> <br> <br>Zemestro <br><a href="http://www.fonts.com/findfonts/detail.asp?nCo=AFMT&amp;pid=406028" target="_blank">http://www.fonts.com/findfonts/detail.asp?nCo=AFMT&amp;pid=406028</a> <br> <br>FF Signa <br><a href="http://www.identifont.com/show?3TM" target="_blank">http://www.identifont.com/show?3TM</a> <br> <br>Fonts above are excellent, but I'd be interested to hear if there are some other fonts that work great in small and very small sizes on a tv screen. <br> <br>Best regards, <br>MKK <br> <br> <br> <br> <br> <br> <br> <br></p>
