    html: <p>I think there has been discussion on these boards about how type renders on television; do a search and you probably will find stuff helpful.  <br> <br>I would also compare <a href="http://www.processtypefoundry.com/typefaces/locator/index.html" target="_blank"> Locator</a>. With its wide and stylish upper case it might work well for small sizes. The lower case of Clearview would probably work better though, at small sizes. <br> <br>I don't know if Amplitude's traps would help render on TV, but you might check this out.  <br> <br>I am partial to Christian Schwartz's work - Simian text and Amplitude because it mangages to look stylish without being weird. Locator is there too. (The display of both Simian and Locator are too odd in my opinion for regular use.) <br> <br>CNN's US nightly news (10 eastern) uses Meta successfully, and the News Hour on PBS has used Optima for years and it looks very classy. I guess is a lot in how the type will be used, and the mood you want to convey. </p>
