      <p>... for a certain value of "appropriate".</p>
      <p>Perhaps it would be better to say that this particular use of Comic Sans is merely Papyrus bad instead of Comic Sans bad. That would more accurately express my view of that web page from a typographical standpoint, and thus avoid appearing to take a shocking and outrageous position that might be construed as trolling.</p>
