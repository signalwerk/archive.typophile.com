    html: |-
      <p>I've seen Comic Sans on digital screens with time and temperature here too. The boxes may be turnkey ones on which they're not allowed to install other software or even other fonts.</p>
      <p>As for Susan Lucci's website: by using a standard Windows typeface, her site is accessible in standard browsers without fancy plug-ins. And, in fact, from the limited set of typefaces available, I can even argue that she made an <em>appropriate</em> use of Comic Sans - as an informal face to give the effect of hand lettering on a blackboard.</p>
      <p>It's not often Comic Sans is used appropriately - and there would have been better faces to use if she had used a technology for her site that gave her more typographic control - but I'd say this is one of the few cases where this was pulled off.</p>
