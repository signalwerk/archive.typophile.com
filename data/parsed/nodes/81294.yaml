      <p>I died a little when I saw this.</p>
      <p>This reminds me of a time a few weeks ago when I was driving by the refineries, and they used Comic Sans as their typeface for the digital screen outside their gates that tells the time, date, weather/temperature and other assorted messages.  </p>
      <p>The greater irony here is that this company is worth billions and probably have a group of "experts" in charge of advertising... Shame.</p>
