      <p>@ markduk: Can you explain the meaning behind the words "39° north?" Regardless if it's a letter (n,N) or word (north, North), why were these words chosen? For example, "That's where their office is located."</p>
      <p>Regarding the underscore, if the clients are fashion, TV, PR and ad agencies, then I would consider the underscore to be inappropriate as it is an obvious digital reference and speaks more to software and high tech.</p>
      <p>The custom "t" in (n)North is a nice touch should you choose to stay with the full word.</p>
