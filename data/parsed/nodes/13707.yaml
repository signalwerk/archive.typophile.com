    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Johann Gutenberg</strong></p>
    <p>A man of mystery. Sadly, very little is known about him. His real name was probably <strong>Johannes Gensfleisch zur Laden</strong>, but he most likely went by a series of nicknames, such as "Henchen" or "Elle". "Gutenberg" was the name of one of his family's houses within the city of <a href="/wiki/Mainz" class="freelinking" rel="nofollow">Mainz</a>, <a href="/wiki/Germany" class="freelinking" rel="nofollow">Germany</a>.</p>
    <p>Born into an aristocratic family, Gutenberg was not an aristocrat himself (his father married a commoner). It is not known when Gutenberg was born. Around <a href="/wiki/1900" class="freelinking" rel="nofollow">1900</a>, the city of Mainz decreed his birthdate to have fallen in June <a href="/wiki/1400" class="freelinking" rel="nofollow">1400</a>, allowing them to throw a big summer party in his honor. Gutenberg died in <a href="/wiki/1468" class="freelinking" rel="nofollow">1468</a> in Eltville, up the Rhein from Mainz.</p>
    <p>As a young man, Gutenberg left Mainz for Strasbourg, in present-day <a href="/wiki/France" class="freelinking" rel="nofollow">France</a>. Sometime before <a href="/wiki/1450" class="freelinking" rel="nofollow">1450</a>, he moved back home. Gutenberg  worked as a goldsmith and became skilled in the casting of finite amounts of metal. Either in Strasbourg or Mainz, between ca. <a href="/wiki/1440" class="freelinking" rel="nofollow">1440</a> and <a href="/wiki/1450" class="freelinking" rel="nofollow">1450</a>, Gutenberg invented the idea of printing with movable <a href="/wiki/type" class="freelinking" rel="nofollow">type</a> in the west. He invented a way to cast individual letters cheaply, and also a means to <a href="/wiki/printing" class="freelinking" rel="nofollow">print</a> them (an probably the <a href="/wiki/ink" class="freelinking" rel="nofollow">ink</a> used, too!).</p>
    <p>His first printed work was a Latin grammar. Later, he borrowed money to begin work on the first of a series of Bibles, the B42 (or 42-line Bible). He also printed indulgences, and a sort of proto-encyclopedia.</p>
    <p>These major works were printed in Mainz, even if printing was not "invented" there. Gutenberg also had a studio in <a href="/wiki/Frankfurt" class="freelinking" rel="nofollow">Frankfurt</a> during his busiest years, were he farmed out some of the production work.</p>
    <p>Around the year <a href="/wiki/2000" class="freelinking" rel="nofollow">2000</a>, Gutenberg was voted "Man of the Millenium" by an international panel of scientists.</p>
    <p>There is a comprehensive <a href="/wiki/Gutenberg%20Museum" class="freelinking" rel="nofollow">Gutenberg Museum</a> in Mainz, which has three original Gutenberg Bibles in its collection.</p>
    <p><strong>Discussion:</strong><br>
    <a href="http://typophile.com/node/29902" rel="nofollow">Gutenberg! The Musical!</a></p>
