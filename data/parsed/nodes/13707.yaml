    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/17745" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Designers</a>&nbsp;: Johann&nbsp;Gutenberg</strong></p>
    <p>A man of mystery. Sadly, very little is known about him. His real name was probably <strong>Johannes Gensfleisch zur Laden</strong>, but he most likely went by a series of nicknames, such as “Henchen” or “Elle”. “Gutenberg” was the name of one of his family’s houses within the city of <a href="/node/20912" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Mainz</a>, <a href="/node/19574" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Germany</a>.</p>
    <p>Born into an aristocratic family, Gutenberg was not an aristocrat himself (his father married a commoner). It is not known when Gutenberg was born. Around <a href="/node/add/wiki?edit%5Btitle%5D=1900" title="Create node &quot;1900&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">1900</a>, the city of Mainz decreed his birthdate to have fallen in June <a href="/node/add/wiki?edit%5Btitle%5D=1400" title="Create node &quot;1400&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">1400</a>, allowing them to throw a big summer party in his honor. Gutenberg died in <a href="/node/add/wiki?edit%5Btitle%5D=1468" title="Create node &quot;1468&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">1468</a> in Eltville, up the Rhein from&nbsp;Mainz.</p>
    <p>As a young man, Gutenberg left Mainz for Strasbourg, in present-day <a href="/node/19576" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">France</a>. Sometime before <a href="/node/add/wiki?edit%5Btitle%5D=1450" title="Create node &quot;1450&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">1450</a>, he moved back home. Gutenberg  worked as a goldsmith and became skilled in the casting of finite amounts of metal. Either in Strasbourg or Mainz, between ca. <a href="/node/add/wiki?edit%5Btitle%5D=1440" title="Create node &quot;1440&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">1440</a> and <a href="/node/add/wiki?edit%5Btitle%5D=1450" title="Create node &quot;1450&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">1450</a>, Gutenberg invented the idea of printing with movable <a href="/node/add/wiki?edit%5Btitle%5D=type" title="Create node &quot;type&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">type</a> in the west. He invented a way to cast individual letters cheaply, and also a means to <a href="/node/add/wiki?edit%5Btitle%5D=printing" title="Create node &quot;printing&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">print</a> them (an probably the <a href="/node/add/wiki?edit%5Btitle%5D=ink" title="Create node &quot;ink&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">ink</a> used,&nbsp;too!).</p>
    <p>His first printed work was a Latin grammar. Later, he borrowed money to begin work on the first of a series of Bibles, the <span class="caps">B42</span> (or 42-line Bible). He also printed indulgences, and a sort of&nbsp;proto-encyclopedia.</p>
    <p>These major works were printed in Mainz, even if printing was not “invented” there. Gutenberg also had a studio in <a href="/node/add/wiki?edit%5Btitle%5D=Frankfurt" title="Create node &quot;Frankfurt&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Frankfurt</a> during his busiest years, were he farmed out some of the production&nbsp;work.</p>
    <p>Around the year <a href="/node/add/wiki?edit%5Btitle%5D=2000" title="Create node &quot;2000&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">2000</a>, Gutenberg was voted “Man of the Millenium” by an international panel of&nbsp;scientists.</p>
    <p>There is a comprehensive <a href="/node/13013" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Gutenberg Museum</a> in Mainz, which has three original Gutenberg Bibles in its&nbsp;collection.</p>
    <p><strong>Discussion:</strong><br><a href="http://typophile.com/node/29902">Gutenberg! The&nbsp;Musical!</a></p>
