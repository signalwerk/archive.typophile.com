  html: <p>Can someone enlighten me please, why is Dcroat glyph always on "00D0" unicode index nr. and not "0110" like unicode standard defines it...(<a href="http://www.unicode.org/charts/PDF/U0180.pdf" target="_blank">http://www.unicode.org/charts/PDF/U0180.pdf</a>)</p>
