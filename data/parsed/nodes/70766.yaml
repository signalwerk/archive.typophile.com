    <p>Hi Everyone,</p>
    <p>I've been going a little crazy trying to work-out what this typeface is...</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/hart_4765.jpg"></div><br>
    It's the David Hart &amp; Co. logo type found on <a href="http://www.davidhartnyc.com" title="www.davidhartnyc.com">www.davidhartnyc.com</a><p></p>
    <p>At first glimpse i thought it was a Bondoni Condensed variant but apparently not. If anyone is able to shine some light on the matter, it would be appreciated. Thank you.</p>
    <p>from Chris.</p>
