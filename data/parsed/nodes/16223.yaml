    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Steve Matteson</strong></p>
    <p>Currently working for <a href="/wiki/Ascender%20Corp." class="freelinking" rel="nofollow">Ascender Corp.</a> in Elk Grove Village, Illinois, Steve formerly was at Monotype where he worked on the Windows core fonts. He is a graduate of Rochester Institute of Technology, having studied typography and printing. Among the many typefaces he has designed are Truedell, a Goudy revival, Goudy Ornate, Andalé, and Microsoft's company font Segoe.</p>
    <p>Related link: <a href="http://www.ascendercorp.com/stevepage.html" title="http://www.ascendercorp.com/stevepage.html">http://www.ascendercorp.com/stevepage.html</a></p>
