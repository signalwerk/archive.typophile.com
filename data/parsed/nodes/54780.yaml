  - id: 331645
    user: 32152
    date: 2009-02-25T20:27:00
    date_raw: 25 Feb 2009 — 8:27pm
    votes: null
    html: |-
      <p>I wouldn't recommand changing the font metrics because it would make your tex code less portable. You can define a simple command like:</p>
      <p>\def\fz{\symbol{383}\kern-0.14emz}</p>
      <p>I suggest using \f instead because command names are restricted to basic ASCII. Using \symbol{383} also makes the command usable in different encodings or language.</p>
      <p>Hope this help</p>
