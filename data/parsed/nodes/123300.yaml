    html: |-
      <div class="comment-spam-body"><p>Good find Josev.<br>
      Neuva was available in a multiple master format in the 1990s but is now sold only as individual fonts. However, there are a large number of weights and several widths <a href="http://www.fonts.com/font/adobe/nueva#product_top" title="http://www.fonts.com/font/adobe/nueva#product_top">http://www.fonts.com/font/adobe/nueva#product_top</a><br>
      Neueva includes true italics but they do not fit the logo.<br>
      Here is Nueva Regular sloped 11 degrees </p><div class="imageWrap"><img src="http://typophile.com/files/NuevaSloped11deg60pct_5948.jpg"></div><br>
      Compare to the italic <div class="imageWrap"><img src="http://typophile.com/files/NuevaItalic60pct_5257.jpg"></div><br>
      Don<p></p>
      </div>
