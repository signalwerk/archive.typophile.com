    html: |-
      <p>Unfortunately, it's their own corporate typeface called <a class="freelinking external" href="http://www.urwpp.de/cgi-bin1/dalcgi/source/schnellsuche_e.htd?searchchar=telegrotesk" rel="nofollow">TeleGrotesk</a> and made by <a class="freelinking external" href="http://www.urw.de/english/fonts/identitype/telekom.html" rel="nofollow">URW++</a>. If you're working officially for them, they should provide you a complete package... If not, try switching with <a class="freelinking external" href="http://www.myfonts.com/fonts/urw/grotesk" rel="nofollow">URW++ Grotesk</a> Narrow, far from perfect (main big difference is the single storey /<a class="freelinking external" href="http://www.myfonts.com/fonts/urw/grotesk/urw-grotesk-t-regular-narrow/glyphs.html#glyphs/473308/66" rel="nofollow">a</a>) but could do the job.<br>
      Other alternative: <a href="/wiki/https%3A/%252Fwww.klim.co.nz/retail-fonts/founders-grotesk-condensed" class="freelinking" rel="nofollow">Founders Grotesk Condensed</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/mti/grotesque-display-mt" rel="nofollow">Grotesque Display MTI</a></p>
