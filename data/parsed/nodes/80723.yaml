    <p>hi folks,</p>
    <p>I'm doing a poster for a school project and we had to use minimal typefaces (Herbert Bayer’s Universalschrift,  New Alphabet by Wim Crouwel...Minimum...etc)</p>
    <p>What typeface, preferably a sans would work nicely with Di Sciullo's Minimum typeface.</p>
    <p>Anny suggestions are more than welcome!</p>
