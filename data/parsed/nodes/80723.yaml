    html: |-
      <p>Something by <a href="http://new.myfonts.com/foundry/Test_Pilot_Collective/" rel="nofollow">Test Pilot Collective</a>.</p>
      <p>You're in the zone of radical experiments of the 1990s.<br>
      It's often termed "deconstruction", but there was also a lot of very modular, orthogonal, vector-drawn work, reinventing the alphabet. New media, new typography.</p>
      <p>Of the faces acquired by MoMA, Template Gothic and Dead History may be considered deconstructive, but a glaring omission was  Licko and Vanderlans' Oblong (1988), the mother of all bitmap-informed neo-constructivist faces.</p>
      <p>Look at contemporary issues of Emigre magazine to see an appropriate layout style for such types. "The Cult of the Ugly" as Steven Heller called it.</p>
