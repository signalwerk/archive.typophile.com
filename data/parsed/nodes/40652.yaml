    <p>Its been a good few years since I posted here.  I was dabbling my toes into the typeface pool by editing the Myriad letterforms for a personal logo and typeface.</p>
    <p>Well I have recently decided to make a new logo with a custom drawn typeface, this time without using an existing font as a basis.</p>
    <p>I originally just designed the letters m d t a, and then went on to make the other letters for the words design and media and thats where it stood, until I decided to do the remaining letters for fun, and then numerals and basic punctuation followed.</p>
    <p>Now half a year later, I have started redrawing the letters and making a more complete version.  I have done the most work with the bold letterforms as that is what the logo is made from.  I have done lowercase, uppercase, smallcaps, 2 forms of numerals, and some simple punctuation.</p>
    <p>I have also started work on a regular version of the typeface, and I have only done the lowercase, and some uppercase with that one.</p>
    <p>So far these are just lettershapes in Corel Draw, I would like to form it into a font with fontlab at some point, but I am not comfortable with fontlab's drawing tools, as I usually use corel draw, and feel that the vector shapes seem more solid and maliable, but I guess I will have to change if I want a working font from it.</p>
    <p>Anyway, I am talking too much, so take a look at the PDFs and please offer me some comments and criticism on how to improve it, while I am at this early stage, oh also, I have some alternative characters made which I would like to include in the font also, and a whole selection of Q designs.  Most of the lettershapes are based around the o design, which is a slightly squared off geometric circle.</p>
