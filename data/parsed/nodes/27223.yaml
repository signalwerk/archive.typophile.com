  html: <p>Some interesting information and photos of a Canadian company that purchased the old Lanston type library and the Lanston Monotype punch cutting and matrix manufacturing department from San Francisco. <br>This is also where Sumner Stone had his original ITC Stone Serif cut.  <br><a href="http://lanstontype.com/GiampaTour.html/" target="_top">Go to the Lanston Type Library</a>  <br>This is a great link to the page showing the masterful use of typographical fleurons. <br><a href="http://www.lanstontype.com/ATF.html/" target="_top">Fleuron page</a></p>
