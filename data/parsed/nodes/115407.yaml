      <p>Hi John, I believe you are correct.<br>
      Here is Leipzig Fraktur Bold by Peter Wiegel, made heavier by applying a 10 point parallel line.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/LipzigPlus10Parallel_5537.jpg"></div><br>
      The top part shows an individual letter. The original bold is in black. The expanded stroke in red.<br>
      The bottom part shows the preview results for the phrase. This looks identical to your image except for some rough spots which can easily be edited.<br>
      Don<p></p>
