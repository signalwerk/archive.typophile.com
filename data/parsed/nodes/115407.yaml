    html: |-
      <p>I note from <a href="http://typophile.com/node/115135" title="http://typophile.com/node/115135">http://typophile.com/node/115135</a> that you are familiar with the big collection of Fraktur by Gerhard Helzel<br>
      <a href="http://www.fraktur.biz/" title="http://www.fraktur.biz/">http://www.fraktur.biz/</a><br>
      I expect that you may be familiar with most or all of the foundries on the following short list -- I have not checked them for this particular design:<br>
      Alter Littera<br>
      <a href="http://www.alterlittera.com/" title="http://www.alterlittera.com/">http://www.alterlittera.com/</a><br>
      Delbanco Frakturschriften<br>
      <a href="http://www.delbanco-frakturschriften.de/" title="http://www.delbanco-frakturschriften.de/">http://www.delbanco-frakturschriften.de/</a><br>
      Ralph Unger at RMU<br>
      <a href="http://www.dtp-studio-unger.de/" title="http://www.dtp-studio-unger.de/">http://www.dtp-studio-unger.de/</a> and, with others, at Profonts<br>
      <a href="http://www.profonts.de/shop/index.php" title="http://www.profonts.de/shop/index.php">http://www.profonts.de/shop/index.php</a><br>
      as well as the standard Fraktur offerings from the major foundries, which can be readily fond by using the "fraktur" tag at Myfonts.<br>
      Luc Devroye's page on Blackletter fonts<br>
      <a href="http://luc.devroye.org/fraktur.html" title="http://luc.devroye.org/fraktur.html">http://luc.devroye.org/fraktur.html</a><br>
      is an outstanding source for possible matches.<br>
      Perhaps it is recent from one of the smaller European foundries?<br>
      If all of this fails, you could always ask the designer/producer of the EP.<br>
      Don</p>
