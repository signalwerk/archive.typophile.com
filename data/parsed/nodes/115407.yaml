      <p>Thanks! I’m familiar with all of those sites but had frankly forgotten about Alter Littera.</p>
      <p>I’m now pretty sure this is the extra bold weight of Leipzig Fraktur by Peter Wiegel. There appear to be some “expand stroke” artifacts in that weight.</p>
      <p><a href="http://www.peter-wiegel.de/Leipzig.html" title="http://www.peter-wiegel.de/Leipzig.html">http://www.peter-wiegel.de/Leipzig.html</a></p>
      <p>—J</p>
