    html: <p>Get inspired by some typeface and start improving upon it by sketching on paper, scan them up, make evctors with any vector program you are comfortable with, graduate to Fontographer/ FontLab and map them onto the characerset one by one, generate fonts, test them, finetune them, generate again, fine tune again,...until you are happy with the results!</p>
