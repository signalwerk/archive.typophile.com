      <p>@Hrant: <em>Start by doubting.</em></p>
      <p>I started this way.</p>
      <p><em>Doubt the grid, doubt the pen. Type is no different than most other fields: 90% of it is crap. Actually, 90% is exceedingly kind.</em></p>
      <p>I doubted both the grid and the pen, and found they are both exceedingly useful in the end. Doubting these two things is equally exceedingly useful too. Don't be too keen to throw out the old things, and don't be too keen to retain them either.</p>
      <p><em>If you’re a true designer, and not merely an artist,</em> </p>
      <p>I am a true designer, but I'm a true artist as well in the sense that I try to renew the tradition I belong to by creating original works. Stop bashing artists because <strong>there is an art to design</strong>. Type design involves both strong design skills and an agenda devoted to design, and type design involves artistry. Get over the art part and stop referring to it. It's starting to get boring and you're starting to sound like a parody of yourself Hrant. No really.</p>
      <p>Art is neccessary, and this is coming from a guy who is very big on design.</p>
      <p><em>think about what users need, not what you feel like creating.</em></p>
      <p>I did both, and will keep doing both.</p>
      <p><em>But note that what users say they need isn’t necessarily true.</em></p>
      <p>Users are mislead by market trends and the persuasive powers of peerage.</p>
      <p>j a m e s</p>
