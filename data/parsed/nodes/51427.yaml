      <p>Start by doubting. Doubt the grid, doubt the pen. Type is no different than most other fields: 90% of it is crap. Actually, 90% is exceedingly kind.</p>
      <p>If you're a true designer, and not merely an artist, think about what users need, not what you feel like creating. But note that what users <em>say</em> they need isn't necessarily true. And this is exactly the sort of dark complexity that type is all about. And why so few people can actually make things worth keeping. Good luck.</p>
      <p>hhp</p>
