      <p>I know it is not cool in this day and time but... start with the Ugar tablet forms and work your way through the calligraphic genesis of our alphabet, all the while familiarizing yourself with contemporary font generation software. A solid historic(al?) understanding will provide you with the capability to create informed contemporary adaptations.</p>
      <p>P.s. Briem is one of the most informed people I know about the history of form and language.</p>
      <p>Michael</p>
