      <p>Nice advice everybody - I second Jordan's advice re: The Briem site.</p>
      <p>Depending on how serious you are you could apply to the University or Reading's Typedesign MA program or the program at KABK. </p>
      <p>On a simpler level think about what the purpose of the typeface is. Advice re: type design can change depending on several factors the more important one of which is probably the purpose of the font.</p>
      <p>My advice is don't look for rules. Instead look for complex relationships of factors and tendencies.</p>
