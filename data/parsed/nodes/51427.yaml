    html: |-
      <p>I think it's very helpful when you are starting out (once you have started sketching) is to print out 2 pages of the same full alphabets. This way you can hold them up to the light (or light board) and see proportions and relations. So for example how a "u" and an "s" fit together. or how wide an "M" is compared to an "H". Stuff like that. It's almost enlightening the first time you do it. :) Pick a font that you are sort of going for. So say baskerville for a nice old style typeface, or helvetica if you want to go all swiss designy like.</p>
      <p>courtney</p>
    html_clean: |-
