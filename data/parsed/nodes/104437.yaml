    html: |-
      <div class="comment-spam-body"><p><a href="http://www.myfonts.com/fonts/linotype/snell-roundhand-script/" rel="nofollow">Snell Roundhand Script</a> or <a href="http://www.myfonts.com/fonts/adobe/snell-roundhand/" rel="nofollow">Snell Roundhand</a> or <a href="http://www.myfonts.com/fonts/tilde/roundhand/" rel="nofollow">Roundhand</a></p>
      <p>Adobe blurb:<br>
      Snell Roundhand was created by Matthew Carter for Linotype in 1966. The design is based on the handwriting of Charles Snell, an English writing master who wrote The Pen-man’s Treasury Open’d in 1694.<br>
      Linotype blurb:<br>
      Late in the seventeenth century, the English writing master, Charles Snell, decried all flourishes in the Puritan tradition and stood for a plain and efficient form of roundhand. The large x-height of these unadorned forms suited the purpose of the English roundhand, the standard commercial hand of the developing economic revolution, the typewriter face of its day. The overhangs on these letters were too large to cast in metal, blocking evolution to typography. Flourishes on the more elaborate forms could be adapted to fill body space, reducing or eliminating overhangs, allowing flourished scripts to appear in type. In 1966 Matthew Carter translated Snell’s script for photocomposition, later adding two more weights. With its large x-height and severely graceful texture, Snell, impossible in metal, appears as the most typographic of photocomposition scripts.</p>
      <p>Take your pick.<br>
      Don</p>
      </div>
