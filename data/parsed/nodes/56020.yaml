    <p>I'm going to be doing a BASIC typography presentation to my class (10th grade), and even though I don't really know everything about it, I think I have a pretty good grasp of type. I'm going to be doing a very basic presentation (&lt;15 mins) and I'm just wondering if I've covered all the basics. It's a powerpoint in PDF form.<br>
    (Friendly) Critiques welcome.<br>
    Thanks in advance!</p>
