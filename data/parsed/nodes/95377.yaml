      <p>I think many people used Typophile as a "social quick-fix" (designers -especially type designers- often end up being lonely) but often got drawn into deeper discussions now and again. Now that Twitter and such make superficial socializing so easy (the 140-character limit is a powerfully sad reflection on contemporary social interaction) places like Typophile weaken.</p>
      <p>Something like Typophile is a bit like marriage: things change, and people change - but to me at least loyalty is very important. I don't always enjoy being here, but that's not the point for me. Some people aren't meant for marriage, but they shouldn't hate people who are; and they should expect "spouses" to defend each other... in public.  :-)</p>
      <p>hhp</p>
