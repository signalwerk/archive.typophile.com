      <p>Truthfully, I always hated the senseless sniping and personal attacks.  If you want that, watch so-called "Reality" TV. I don't miss that and never will.  However, I don't blame any of the participants in these exchanges for the current vegetative state of Typophile. People all have failings so that sort of thing was akin to family squabbles.<br>
      I do very much miss the sense of community we once had here, and the fun. Typophile was the leading reason I began to be a typeface designer. I got to meet people from all over the World through this site.<br>
      I do hope that the entire history of Typophile posts can be collected into a CD and offered at a reasonable some to all past participants.  That way, we can do our own searches and find whatever interests us most and take the burden off of the Punchcut guys.  They have a business to run and make no money from this venture. I would very much like to thank them for the ride from 2004 until today.  They may even write a book :-)</p>
