    <p>Dear Typophile,</p>
    <p>When checking the forums in recent times, I can't help feeling a little sad that Typophile is not anymore what it was when I first found it, several years ago. I came in with an interest in typography, but a lack of knowledge. Typophile has been a gateway to me to find my way and expand my knowledge, and to highten my awareness of typography in every sense of the way. I came to typophile in the high days of the Pirate Bay, and all fonts where all but a torrent away. Through Typophile I have learned to see the value of type and type design, and I decided to build a legal collection of typefaces from scratch. This has been a joy most of the time, with some lucky bargains, and some mistakes. Typophile has been helpful here, I hope others on a simular position as my own still find typophile as useful as I found it then.</p>
    <p>I guess things don't last forever, and Typophile seems to have lost the dynamic it had some time ago. Que sera sera. The internet and "social" media moves fast, and perhaps there are better ways to discuss type than typophile nowadays... I don't know, as I have not been looking so much. Typophile is and was Typophile, I don't need any other type forum, it has served it's purpose for me, so a thank you to all contributors past and present, who have made me a little type wiser. I will not be gone, and I won't be deleting my posts (what's done is done) but I just want to say thanks when there are still some of you around that helped me on my way.</p>
    <p>THANKS!</p>
