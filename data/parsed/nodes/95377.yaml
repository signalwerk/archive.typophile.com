      <p>Yeah, Chris, in the process of one which Typophilers might find interesting.</p>
      <p>For the past thirty years there's been a kind of "stealth" translation going on of about 12,000 pages of records from the Dutch East India Company dating from the days when it ran New Amsterdam - also known as the  island of Manhattan.<br>
      I'm reading a book based on that research called The Island At The Center Of The World. A great story - at least for a native New Yorker like me who graduated from a high school named after New Amsterdam's most famous boss, Petrus Stuyvesant, without ever really knowing all that much about him or the very beginnings of Manhattan; the beginnings of America, really. So little history was available until recently.<br>
      Unlike other settlements, it turns out New Yawk was a melting pot from day one.<br>
      (Of course, history is written by the victors, and as far as the Brits were concerned, Manhattan didn't rate any note until it became New York and not New Amsterdam. But in fact, the city's DNA was set during Dutch rule and was vastly different from the English settlements of the period in Virginia and Massachusetts. Blacks (both slave and free), Jews, Germans, Dutch, English, Spanish - you name the background - they all lived side by side in that miniscule community. Something like eighteen languages were spoken among just a few hundred initial inhabitants. And if you included the languages of the Native American populations nearby, you would probably have to double that number.)<br>
      My understanding, according to the book, is that the Dutch language of the 1600s is vastly different from modern Dutch, hence the struggle to translate. It's been the life's work of one guy: a Dr. George Gehring. I'm going to try and get my hands on some pics to see what the script looks like.  Supposedly it's a real hodgepodge of glyphs, but if any Typophilers are  familiar with Dutch as it was then written in, say, 1625, might be able to fill us in.</p>
      <p>As far as the post which started this thread is concerned, the reports of Typophile's death are greatly exaggerated. I hope it continues on.  There is an ebb and flow to everything.  What is old becomes new again.</p>
