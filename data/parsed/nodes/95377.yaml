      <p>I've been a member since 2003, checking up on new posts most days but very seldom posting. Maybe people like me should have participated/should be participating more. I'd never dream of contributing to this sort of thread normally. Most of the time I'm interested in details/ historical design etc.</p>
      <p>Like the others, I too would like to thank the Typophile community. This thread feels a bit like a wake,  but I hope that Typophile will continue to thrive. It's true that the traffic has palpably gone down, and perhaps more worryingly the most knowledgeable ones are not as evident. The professional count has also gone down too I reckon, tho make of that what you will. Most of all, it's not quite so much of a 'learning place' as it used to, although there's still lots of enthusiasm and discovery.</p>
      <p>I've learned a huge amount from the site and have grown and watched others grow. Typophile is part of the 'furniture of my mind'. I must say of all the typophile regulars I feel I have learnt most from John Hudson. Wow. You could make a book out of the things that that guy has posted here. Thanks to him and to all.</p>
      <p>Geraint</p>
