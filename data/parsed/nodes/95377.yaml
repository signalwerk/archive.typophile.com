      <p>I think the undesirable degree of sensitivity to criticism comes from the "artiste" strain that all creative people inherently have. It's just that for too many of us self-expression seems to become more of an objective than an enabler, so any criticism that aims to improve the functionality of the result is instead taken as a personal attack on the creative self. To me the world doesn't need our self-expression nearly as much as it needs our servitude, and the opinions of fellow designers -especially the negative ones- can only help. Questions... mistakes... doubt... that's where the gold is in terms of cultural progress.</p>
      <p>Concerning the economy angle, to me it has long seemed an interesting paradox. The most prominent example I've witnessed that makes me doubt the "bad economy = less type design" formula is that before the collapse of the Argentinian economy (and the strong regional ripple effect) at the turn of the millennium South America was nowhere on the map in terms of type design, but <em>right in the thick of it</em> they started producing amazing work, winning TDC awards, the works. Equally telling is that there's much more quality <em>free</em> type than there has ever been; if people were so busy paying bills that wouldn't be happening.</p>
      <p>But maybe what <em>is</em> happening is that people who do [try to] make a living by relying heavily on type design (there are more of them than you might think) are sick of providing free help to people who release good free fonts, reducing their own income potential.</p>
      <p>hhp</p>
