      <p>As I said, there was a different dynamic, at least that is how I experienced it. It was more lively (more contributors, more discussion) than it is now, with many contributors that had been very active in the past leaving. I don't know why exactly this has happened, perhaps these communities have a certain lifespan, and as typophile did not change a lot (technically) over the years I guess the needs of the users were not met anymore, so they changed ship or left (just my speculation). I guess it also has to do with the fact that at the beginning there was loads of archives for me to plough through, which I can't be bothered with anymore (also because of the awful search engine, but anyway...). </p>
      <p>I am not a type creator myself, I am a designer using type, and do some handlettering, so perhaps Typophile still is very fruitful for others, concerning technical matters, I can't say. </p>
      <p>I guess it just seemed different then, somehow... :/</p>
