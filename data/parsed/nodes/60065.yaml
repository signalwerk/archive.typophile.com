    html: |-
      <p>Of course, and probably this font is not meant to be used for the kind of work who would need a <em>§</em> sign.</p>
      <p>I am just saying that it implies an additional bit of care. You can write <em>ti§er</em> and actually get <em>tiger</em>. Fine. But, if at some moment you decide to substitute the font, you will get plain <em>ti§er</em>. No problem if it’s just a word, but if it is a paragraph, or some words here and there, you may not notice the change until too late.</p>
      <p>So I’d rather go for an alternate font called NCD Octangle Alt or something that includes this double story <em>g</em> in the <em>g</em> slot. Or OT stylistic alternates (a related problem <a class="freelinking external" href="http://www.typophile.com/node/61530" rel="nofollow">here,</a> though).</p>
