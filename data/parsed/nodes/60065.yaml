    <p>I need your help.</p>
    <p>I’m designing a NEW FONT called NCD Octangle.<br>
    I've tried to make it readable and usable at most sizes whilst still retaining an edge.<br>
    It also comes in several weights. This is the lightest weight.</p>
    <p>Q1. Which g &amp; y do you think works best 1,2,3,4 or 5?<br>
    Q2. Which one do you prefer 1,2,3,4 or 5?</p>
    <p>What you must have in mind that it must work at a small size.</p>
    <p>Thanks in advance for any comments.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Picture-11_6182.jpg"></div><p></p>
