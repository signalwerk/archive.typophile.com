  html: |-
    <p>Help all,</p>
    <p>I am working on a logo and I am looking to a font similar to elderkin bold.<br>
    Elderkin has been discontinued. It looks like Helvetica Bold Condensed but it has slightly rounded corners.<br>
    This gives it a punched leather/ woodcut feel.</p>
    <p>It was used on the cover of the Annual of Type Directors Club 26.</p>
    <p>Any fonts that are similar would be great. I have a tight deadline and would prefer to not have to recreate something.</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/tdc26annual_0.jpg" width="320" height="430" alt="">
