      <p>As said above, Nijhof &amp; Lee once had it, but the store has moved to the ‘Bijzondere Collecties’, during which most of the stock has been sold off.</p>
      <p>I believe it will be extremely tricky to get a copy of it, I know some of them are around, but all are in personal collections. And don't expect the TROS (The TV station which originally published it) to do a repress.</p>
      <p>Guess you'll have to lucky to run into one.</p>
