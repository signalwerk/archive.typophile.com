  html: |-
    <p>Hi,</p>
    <p>i am looking for a cleaner alternative to American Typewriter light. </p>
    <p>As you can see in the attached graphic file, the original lettershapes (left) have a slight organic feel to them - small bumbs and a degree of unevenness, but i am after a font that has all the characteristics of the American Typewriter light except that it is ’straightend’ (right example in the attached graphic).</p>
    <p>Thankful for any ideas,</p>
    <p>Seb</p>
