  html: <p>My question is about linked webfonts, (not the web-safe installed fonts like Georgia &amp; Verdana). Is it possible to print using them from a browser? I heard Firefox was going to implement this, but have not seen it work yet. Was that functionality intended for naked font linking only (.otf &amp; .ttf but not .woff) or a rumor wholly unfounded?</p>
