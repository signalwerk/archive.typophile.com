      <p>We find that support for printing web fonts varies quite a lot by browser and platform. If I recall correctly, it works in MSIE, Firefox/Linux and Firefox/Windows, Safari/Mac, Chrome/Linux, and Chrome/Windows. It does not work in Firefox/Mac or Chrome/Windows. There's a <a href="http://code.google.com/p/chromium/issues/detail?id=42499" rel="nofollow">bug</a> open on the last one.</p>
      <p>Others have <a href="http://support.mozilla.com/tiki-view_forum_thread.php?locale=en-US&amp;comments_parentId=497167&amp;forumId=1" rel="nofollow">reported inconsistent results</a>.</p>
      <p>I suspect that another issue that people may be running into is web font providers who strip out the post table from fonts. Among other tools, font-optimizer does this. The chance of fonts printing correctly seems to be much lower when this table is missing. For this reason, the Google Font API preserves this table.</p>
