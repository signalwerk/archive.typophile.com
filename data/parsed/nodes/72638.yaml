      <p>&gt;Was that functionality intended for naked font linking only (.otf &amp; .ttf but not .woff) or a rumor wholly unfounded?</p>
      <p>By the time the user asks the computer to print a web page that links to WOFF fonts, the WOFF fonts have already been converted and enumerated to the system as OT fonts. So this should not be a problem associated with WOFF.</p>
      <p>I think the rumor that will not go away is that the user or web designer can make their browser window or web site, respectively, not match the page size of the user's printer quite easily.</p>
      <p>Cheers!</p>
