  html: |-
    <p>This isn't truly typography-related, but i figure there might be people here interested in this sort of thing anyway.. I just wanted to mention that i was recently able to get ahold of the reprinted and seemingly not-so-easy-to-get-ahold-of <a href="http://youworkforthem.com/product.php?sku=P0125" rel="nofollow">Saul Bass and Associates book</a> (originally from 1979). i found it online at a specialized bookstore in Holland called <a href="http://www.nijhoflee.nl/bookstore/" rel="nofollow">Nijhof &amp; Lee</a> and it costs for €36 + shipping, which wasn't too bad. it's certainly no definitive book on all things Saul Bass, but given the slim-to-none existence of Saul Bass books in general, it's worth having if you're a fan like myself.</p>
    <p>(the first link has some samples from the book)</p>
