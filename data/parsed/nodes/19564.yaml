      <p>The Bass on Titles DVD is available on Amazon in the UK and you can rent it as well as buy.</p>
      <p><a href="http://www.amazon.co.uk/exec/obidos/ASIN/B0006OR0XU/qid=1149268537/sr=8-1/ref=sr_8_xs_ap_i1_xgl/203-5278134-7216740" title="http://www.amazon.co.uk/exec/obidos/ASIN/B0006OR0XU/qid=1149268537/sr=8-1/ref=sr_8_xs_ap_i1_xgl/203-5278134-7216740">http://www.amazon.co.uk/exec/obidos/ASIN/B0006OR0XU/qid=1149268537/sr=8-...</a></p>
      <p>I think the reviewer on Amazon it sums it up in terms of price/duration/quality/aspect ratio issues (prepare for a lot of fiddling with the zoom button); I'm pretty sure it wasn't remastered. I'd just come back from the Design Museum show and didn't notice the production date on the DVD so mistakenly assumed it was the same comprehensive showreel I'd just seen there, so was rather disapointed! Luckily I'd only hired it.</p>
