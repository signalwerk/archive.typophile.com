    <p>Please take pity on this poor Mac guy. I want to do a good job testing on Windows. What configurations are needed to do a good job? I am guessing that I need certain OS’ ( Vista+Xp no?) &amp; certain apps ( Indesign, Quark Word no? ) to test in. What do you think? Obviously intended use plays a role too - screen fonts vs. those for print etc. For now I am thinking specifically of print. Extra points for:</p>
    <p>- testing models that may fall short of the ideal while still doing solid job!<br>
    - dealing with anything new &amp; relevant resulting from the Vista OS<br>
    - Windows centric type utlities</p>
