    html: <p>I've made some changes - final ligature and "u". I didn't want to decrease the space between words too much, since I wanted to keep in some "drama". In my eyes the first thing you notice is Eurydica in rather romantic script. Placing Fatum (Fate) a bit on the side I wanted to create some kind of chill. <br> <br><img src="http://www.typophile.com/forums/messages/29/33559.jpg" alt="second version"></p>
