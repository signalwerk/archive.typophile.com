    html: <p>In my opinion Eurydicae is not working. The E is heavy and of a completely different nature than the rest. The d is throwing off the rythm. I think it will want to be right leaning, perhaps with a loop that curls around and crosses itself moving back toward the E. <br> <br>See if you can find lettering to work from. Or a better drawn font. BJ has rightly pointed out some issues with this one. <br>Something like this? <br><a href="http://www.kimera.com.mx/mac/tipogalerialagarto.html" target="_blank">http://www.kimera.com.mx/mac/tipogalerialagarto.html</a> <br>Maybe Bickham Script <br> <br>R</p>
