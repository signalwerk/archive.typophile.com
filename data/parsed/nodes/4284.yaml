  html: <p>This is something I was playing with for some time.  <br>Fatum Eurydicae (Eurydica's Destiny)is a name for arty-farty cafe+giftshop, elite yet a bit kitchy. I was trying to achieve some kind of baroque feeling. <br>I was fooling around with some of my favorite typefaces - Garamond, English and Bull. Your opinion, please. <br> <br><img src="http://www.typophile.com/forums/messages/29/33458.jpg" alt="example"></p>
