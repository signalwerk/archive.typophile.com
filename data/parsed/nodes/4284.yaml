    date: 2004-04-19T01:24:00
    votes: null
    html: "<p>Hylas, I think the execution here could be improved by  <br>some customization. <br> <br>fatum: the left arm of the u/v has a notch that heightens <br>the confusion as to what the letter is supposed to be. <br> <br>E: the script E seems too much like <br>a stock E out of a generic Copperplate face <br>... you could redraw this with some <br>different flourishes to make it yours. <br>A redraw would also allow you the opportunity <br>to fit the u with the E. As is, they seem much <br>too far apart. <br> <br>ae: the bowl of the e appears too small. <br> <br>d: the looped ascender looks like it was cut <br>and pasted on. Could be the .gif. The specific <br>angle doesn't seem to work, imo. <br> <br>Some flourishes might give this more of a Baroque flair. <br>There is always \"flourish opportunity\" <br>in ascenders or descenders. <br> <br>hope I'm not too harsh, but honest feedback <br>is why you brung it, I think. <br> <br><img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br>bj</p>"
