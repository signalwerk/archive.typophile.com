    html: <p>It's Latin, so the closes pronounciation would be like in Italian {E like in b<b>E</b>d, U like in b<b>OO</b>t, R like in <b>R</b>ed, y like in happ<b>Y</b>, d like in <b>D</b>ay, i like in sh<b>EE</b>p, c like ch in <b>CH</b>eer, ae like e in b<b>E</b>ed} Or you can pronounce it like in Central Europe, with Tz instedad of Ch, or like K instead of Ch. Every spelling is equaly incorrect, since Latin is a dead language. Since I'm not working in English-speaking country, nobody will read it like EV'RY DICE (so nobody would think it is a casino <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> )</p>
