    date: 2004-04-15T13:42:00
    votes: null
    html: <p>I don't mind the placement of Fatum offset to the left; actually, I think it looks pretty good in that general vicinity. The changes you've made certanly improve readability. Is there another lc Y you could use to avoid/minimize that hole between 'r' and 'y'? <br> <br>I think this marque is great for printed materials, but you might have some translation issues when going to clothing or vinyls for a window. The size difference between Fatum and Eurydice would make the former very small on an embroidered shirt or apron, and the 'grunge' face might not be easy to cut out of vinyl. <br> <br>Good progress.</p>
