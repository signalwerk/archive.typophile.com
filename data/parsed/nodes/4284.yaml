    html: <p>It seems a rather long name for a cafe/bookstor etc. It would be simpler to brand if it was called "FATVM". <br> <br>But then again, I am always leaning towards less is more (looks at name), and us antipodes usually cannot read past a few syllables. <br> <br>FATVM sounds so rich and simple. That second one would make me feel like I was reading a Latin Novel... All I want is coffee! <br> <br>mwah </p>
