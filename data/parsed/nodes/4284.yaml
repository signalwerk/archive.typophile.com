    html: "<p>@ DP:  <br>Thank you for your opinion.  <br>I think I got historical association exactly where I wanted. The thing is, I didn't want it to look Roman (or Grecian), I wanted it to look early Baroque, Classical in Louis XIV kind of way. Fatum Eurydicae sounds to me like a title of H. Purcell's play, or some of his conteporaties.  <br>Think about it like that movie Gladiator - although it takes place in ancient Rome, theme, characters, costumes etc. are Baroque, not Antique.</p>"
