    date: 2004-04-16T20:46:00
    votes: null
    html: <p>1.  I don't think the Garamond is working here.  The italics just don't look consistent enough to be used at display sizes. <br> <br>2.  I Think you need to consider the historical implications of your typefaces.  The average member of the populace won't know that Garamond is a Renassaince face, but the subconscious association is probably there nonetheless.  If you're doing something with historical meaning, why not consider a face from that period? <br> <br>If you're stuck on the sans/serif combination, you might try a lapidary like Sophia or Lithos with a display Roman like Trajan.</p>
