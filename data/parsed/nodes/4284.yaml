    html: <p>1. I'm not the owner and don't have the liberty to change the name. <br>2. It's not a Starbuck's - people go there to look posh, not to drink coffee (or to read books). It's a place where you dress yourself as if you're going to Ascot race, drink some lousy coffee and buy some over-priced books. <br>3. Fatum (Destiny)is too general. The name Eurydica's Fate is chosen as a sort of a warning, meaning DON'T LOOK BACK!  <br></p>
