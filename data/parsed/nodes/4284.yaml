    html: <p>I like the name and the direction you're going with combining a script and a text face. What sort of identity will this be for? Just a window sign? Or napkins, menus, gift bags, etc? <br> <br>I think if you're going to use the Latinized spelling of FATVM, then you should use an "obvious" Roman stonecut font, like <a href="http://www.typography.com/catalog/requiem/index.html">Requiem</a> or similar. You might want to spell 'Eurydice' in the modern fashion to avoid people seeing Every Dice. <br> <br>Also, I think the 'ae' ligature looks a bit much like an 'oe'.</p>
