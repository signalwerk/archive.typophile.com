    html: <p>I agree with BJ, if you're going for a Baroque feel, you should work in some custom flourishes on the curved ascender of the D and perhaps the descender on the Y. Perhaps even "tail" the E portion of the ae lig. <br> <br>Actually, you could connect your flourish on the Y to the end of the uppercase E for a nice complete look.</p>
