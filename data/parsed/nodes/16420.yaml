      <p>It's not the typeface you choose, but what you do with it.<br>
      For instance, the Apple OS comes with a lot of fonts (Hiragino Gothic etc.) that are primarily non-Latin; however, many of them have Latin characters also. Usually a bit naff (as opposed to hype), but in "beating them into shape", as it were, i.e. making them work in a typographic setting by adjusting tracking, leading, kerning, etc., who knows what interesting developments may emerge?</p>
