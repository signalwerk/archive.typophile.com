    <p>Hi everyone.</p>
    <p>As you are more and more becoming my family,<br>
    i thought i'd ask you for advice...</p>
    <p>I am doing this school prject,<br>
    where designing a corporate identity program<br>
    for a fitness center and fitness program,...<br>
    which it's name unfortunatly I can not tell... : (</p>
    <p>To make a long story short, my logo is mostly done i am happy with it,<br>
    and the name for the logo-type, after strong thought, is set in Avant Garde lowercase...( i personally dislike its "s")<br>
    but because I lack of any other good fresh examples, for a geometric sans serif, and of using futura... I'm not sure. ; /</p>
    <p>- Other geometric sans serifs?</p>
    <p>Even If I consider leaving the logotype set in lowercase avant garde, or other geometric sans,<br>
    I still need to find a good strong corporate font that would work well for most usage,<br>
    this is probably stationary at body copy sizes, display and even big headlines.<br>
    I feel it has to be a dynamic, versatile, fresh and hype,<br>
    (I know someone is going to blame me for this last word),<br>
    more femenine oriented than for example HTF Knockout which i was considering,...</p>
    <p>Hope this does not sound like nonsense<br>
    Any suggestions are very welcomed as I belive<br>
    this can help me learn more and help my project.<br>
    I will certanly be glad to lisecence for my personal use the chosen font...<br>
    (most likely in OpenType format)</p>
    <p>Thanks. once more.</p>
    <p>Giovanni</p>
