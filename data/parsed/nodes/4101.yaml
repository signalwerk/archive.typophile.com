    html: '<p>Louis, <br>Variations of Bodoni seem to be well-loved by industrial designers (for example  <br>the logos of companies like ClassiCon and Artemide). You will also  <br>find Bodoni used in many logos in the fashion and cosmetic industries, such  <br>as Elizabeth Arden, some of the product lines for Guerlain, Giorgio Armani,  <br>and the CK logo for Calvin Klein. While many of these logos are custom drawn,  <br>( "R" in Armani), often these companies use Bodoni as a text or title face in  <br>their promotional materials. Going back farther in time: as Paul mentioned, <br>there were also many wonderful examples of Bodoni used by IBM. Karl Gerstner  <br>designed a beautiful volume in 1984 called the "IBM Bodoni manual". <br> <br>Fabi</p>'
    html_clean: '<p>Louis, <br>Variations of Bodoni seem to be well-loved by industrial designers (for example  <br>the logos of companies like ClassiCon and Artemide). You will also  <br>find Bodoni used in many logos in the fashion and cosmetic industries, such  <br>as Elizabeth Arden, some of the product lines for Guerlain, Giorgio Armani,  <br>and the CK logo for Calvin Klein. While many of these logos are custom drawn,  <br>( "R" in Armani), often these companies use Bodoni as a text or title face in  <br>their promotional materials. Going back farther in time: as Paul mentioned, <br>there were also many wonderful examples of Bodoni used by IBM. Karl Gerstner  <br>designed a beautiful volume in 1984 called the "IBM Bodoni manual". <br> <br>Fabi</p>'
