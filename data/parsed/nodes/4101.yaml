  html: <p>We are currently making a book about typography in one of my classes. I was assigned to do 3 spreads on the font Bodoni. I'm good for all the historical aspects of the font, what I'm missing is mostly some uses for the font in our comtemporary society. I know a lot of magazines and products use it but I don't know which in particular. If some of you are aware of which company (magazine, label, product, newspaper,etc.) uses this font, I would really appreciate it if you could help me out. <br> <br>Thanks  <br> <br></p>
  html_clean: <p>We are currently making a book about typography in one of my classes. I was assigned to do 3 spreads on the font Bodoni. I'm good for all the historical aspects of the font, what I'm missing is mostly some uses for the font in our comtemporary society. I know a lot of magazines and products use it but I don't know which in particular. If some of you are aware of which company (magazine, label, product, newspaper,etc.) uses this font, I would really appreciate it if you could help me out. <br> <br>Thanks  <br> <br></p>
