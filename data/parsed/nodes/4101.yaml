    html: <p>Harper's Bazaar has always as I remember used Didot. I had a love for this magazine once upon a time. But since Liz Tilberis (editor in chief) passed away it has gone to the crapper. (However I was warming to what Ms. Betts was doing before Glenda Bailey took over.) It was Fabian Baron's brilliance (creative director, demigod of design) and photographer's such as Stephen Meisel, Patrick Demarchelier, Arthur Elgort, Herb Ritts and Peter Lindbergh who did wonders and set them on a path of beauty. Too bad it is not longer like that. The photography is still beautiful, but the magazine seems thin and totally lacking, anti-substantial. <br> <br>Anyway, look into the work of Fabian Baron. He's the maestro of Didot as far as I am concerned (especially his work for Italian Vogue in the early 90s). And before Fabian there was Alexey Brodovitch (Bazaar) and Cipe Pineles (Charm).</p>
    html_clean: <p>Harper's Bazaar has always as I remember used Didot. I had a love for this magazine once upon a time. But since Liz Tilberis (editor in chief) passed away it has gone to the crapper. (However I was warming to what Ms. Betts was doing before Glenda Bailey took over.) It was Fabian Baron's brilliance (creative director, demigod of design) and photographer's such as Stephen Meisel, Patrick Demarchelier, Arthur Elgort, Herb Ritts and Peter Lindbergh who did wonders and set them on a path of beauty. Too bad it is not longer like that. The photography is still beautiful, but the magazine seems thin and totally lacking, anti-substantial. <br> <br>Anyway, look into the work of Fabian Baron. He's the maestro of Didot as far as I am concerned (especially his work for Italian Vogue in the early 90s). And before Fabian there was Alexey Brodovitch (Bazaar) and Cipe Pineles (Charm).</p>
