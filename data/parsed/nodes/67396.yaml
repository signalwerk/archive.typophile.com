    <p>Hello,</p>
    <p>I'm doing book covers for a school project that's part of the D&amp;AD. We have five titles to  choose from and this my first version for 'The History of Mr Polly'. No back or spine designed yet, will post more tomorrow.</p>
    <p>This is supposed to show that Mr Polly is blind because he doesn't know what he want with his life and the fire symbolizes when he sets fire to his own shop so that he can escape from his miserable life.</p>
    <p>Any feedback is much appreciated.<br>
    Peter</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/polly2_5984.jpg"></div><p></p>
