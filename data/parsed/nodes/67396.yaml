      <p>Nice poster, a little scary some of them :)</p>
      <p>These are the three finished book covers. We already had our final crit, tutor liked them except for the fact that I used some stock images, which didn't go over so well. Apparently we are supposed to stick to all originial work as much as possible. It's not forbidden to use stock images but I prob should've photographed things like the blindfol and the suit myself. Dosen't really matter anyway, I'll prob do the two other covers for Kipps and Tono Bungay in the same style and add everything to my portfolio because it looks very nice :)</p>
      <p>Still if anyone has any feedback feel free to share because I will work on these some more so I can add them to my portfolio.</p>
      <p>r<br>
      peter</p>
