      <p>G'day </p>
      <p>The smallest size of using the logo is about 45mm x 30mm. Here is an example set in this measurements and two black and white version.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/typophile_2_5070.jpg"></div><p></p>
      <p>The first one here has been reduced to the max as you recommend november. I like it and it's easy to read. It still has the flair of the first idea. I know it's a complicated logo, but when I just want to do something simple, I would use a suitable Font and type the words DER VOGELHÄNDLER. This is not what I had in mind and so I stick to the idea I had in the first place.</p>
      <p>The second is the same as before. I understand why you think the double crossbar on the «H» should stay henry. It helps to underline the beginning of the word «HÄNDLER». The OG ligature is a nice touch to symbolize the romantic side of that operetta. Have I sad that, I think the Icon itself gives me the romantic side. I'm not shure if I'll use the ligature.</p>
      <p>I have a presentation tomorrow. Cross the fingers that they're not goin to change the whole thing. </p>
      <p>Cheers!</p>
