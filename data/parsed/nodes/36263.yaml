      <p>I agree with Quincunx that the foot of the "R" could be better -- maybe a simpler curve?</p>
      <p>Also the density of the logo is uneven -- the left part looks empty, making it out of balance. Generally that could be a good thing, but in this case it just looks "light headed" to me. I'd suggest either trying to move "DER" over the "O" or -- more drastically -- push "VOG" together so they cross each other, like the "DE" in that book cover.</p>
