      <p>A lot of things are going on right in the middle of the logo:<br>
      1) LH ligature<br>
      2) L with double horizontal stroke<br>
      3) H with double horizontal stroke<br>
      4) two dots offset from the A<br>
      5) "DER" meets "VOGELHA¨NDLER"</p>
      <p>Though I like the double horizontal strokes, they add to the 'business' of the area.</p>
      <p>Could you lose one of them?<br>
      I don't think they 'mean' or resemble anything - ie they are mere decoration ... but - I get the idea, due to the fact that there are two of these letters, and because they are next to each other, that they resemble something. (But they don't, do they?)</p>
