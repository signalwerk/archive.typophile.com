      <p>OK, I don't quite understand why you changed the text blocks all from ragged to block, but it doesn't look so bad.</p>
      <p>However, the typographic quotes you use are definitely wrong -- in German the typographic quotes have to point inwards, not outwards. Actually I also don't see any reason why the line should be in quote at all -- it isn't a quote from anyone or anywhere.</p>
      <p>Since the date is written in full, "2008" shouldn't be abbreviated to "08".</p>
      <p>And in contrary to what I've written before, the last line containing the phone number should be: "[...] Telefon: 062 8730844". Apparently, the relevant DIN standard has been updated a few years ago, which I've been unaware of until now:</p>
      <p><a href="http://de.wikipedia.org/wiki/Rufnummer#Schreibweise_in_Deutschland_und_.C3.96sterreich" title="http://de.wikipedia.org/wiki/Rufnummer#Schreibweise_in_Deutschland_und_.C3.96sterreich">http://de.wikipedia.org/wiki/Rufnummer#Schreibweise_in_Deutschland_und_....</a></p>
      <p>But in any case, the colon after "Telefon" is mandatory as otherwise the sentence would be grammatically incorrect.</p>
