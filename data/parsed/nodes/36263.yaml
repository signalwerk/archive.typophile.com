    html: |-
      <p>I think it has become too complicated ... </p>
      <p>Look at the last example:</p>
      <p>Attention grabber #1:<br>
      The art deco (?) typeface in itself</p>
      <p>Attention grabber #2:<br>
      The OG ligature</p>
      <p>Attention grabber #3:<br>
      The G drops below the baseline</p>
      <p>Attention grabber #4:<br>
      The LH ligature</p>
      <p>Attention grabber #5:<br>
      The double crosbar H</p>
      <p>Attention grabber #6:<br>
      The offset umlaut dots</p>
      <p>Attention grabber #7:<br>
      The LE ligature</p>
      <p>Attention grabber #8:<br>
      The R drops below the baseline</p>
      <p>This is far too much ... the legibility suffers from it.</p>
      <p>I think you should try two things:<br>
      Raise the G up to the baseline, and loose the 'double crossbar idea' (should it resemble the bird cage? I don't think it works).</p>
      <p>I think that this logotype is going to be printet rather small from time to time, so you will need to make it easier to read.</p>
