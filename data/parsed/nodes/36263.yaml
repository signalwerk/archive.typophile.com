    <p>I'm working on a Logo for a theater group. They will perform<br>
    «Der Vogelhändler» (The Bird Seller) by Carl Zeller.</p>
    <p>Here is a link about the story:<br>
    <a href="http://en.wikipedia.org/wiki/Der_Vogelh%C3%A4ndler" title="http://en.wikipedia.org/wiki/Der_Vogelh%C3%A4ndler">http://en.wikipedia.org/wiki/Der_Vogelh%C3%A4ndler</a></p>
    <p>I thought to use some letters from book covers of Emilio Salgari.<br>
    The covers have been made during the late 19th century. This operetta was performed in this period the first time and this gives me an opportunity for an hommage. It might be a small connection, but i will give it a try.   </p>
    <p>The logo will be used for an advertising campaign (ads, brochure, posters, etc.). So it has to work in different sizes. The following logo is still in a rough stage, but the idea has been accepted by the client.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/vogelhaendler_5610.jpg"></div><p></p>
    <p>I would appriciate if you could give me some feedback about the readability and interpretation of the letters. Any general thoughts are also welcomed.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/figlio_crosso_3883.jpg"></div><p></p>
    <p>This is one example, you can find more here:<br>
    <a href="http://images.google.com/images?svnum=10&amp;um=1&amp;hl=en&amp;rls=com.microsoft%3Aen-us%3AIE-SearchBox&amp;rlz=1I7GGLG&amp;q=salgari" title="http://images.google.com/images?svnum=10&amp;um=1&amp;hl=en&amp;rls=com.microsoft%3Aen-us%3AIE-SearchBox&amp;rlz=1I7GGLG&amp;q=salgari">http://images.google.com/images?svnum=10&amp;um=1&amp;hl=en&amp;rls=com.microsoft%3A...</a></p>
