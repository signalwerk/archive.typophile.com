      <p>A few remarks on the text:</p>
      <p>1. Usually it should say "Eine Operette von Carl Zeller";<br>
      2. There's absolutely no reason for swash capitals in "Vorstellung [...]" -- I wouldn't even use them in "Operette [...]";<br>
      3. Don't use semibold for "Tickets &amp; Infos";<br>
      4. Better yet, drop italic entirely for "Vorstellung [...]" and "Tickets [...]" -- the text is small enough to read, italic just makes it evern harder;<br>
      5. "ab 4. September 2007 Telefon [...]" isn't a sentence -- better change it to "ab 4. September per Telefon [...]" ("2007" should be obvious);<br>
      6. You might want to adhere to the standard German telephon number format, which would be "(062) 8 73 08 44" whereas the spaces in between should all be thin spaces (1/4 en, or just "Thin Space" in InDesign).</p>
