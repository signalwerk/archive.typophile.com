      <p>I agree with Alaskan that an asymmetrical layout is definitely worth exploring -- although I disagree with his suggestion that the birds need to "stand out more".</p>
      <p>The proportions in his quick example does appear completely unusable. In case you don't know, Alaskan, the print size of the poster is actually irrelevant regarding readability. In any paged layout, all elements should be readable from a distance that's equal to the diagonal length of the page. The proportions in your example would clearly fail that test.</p>
      <p>BTW, I totally fail to see how an asymmetrical layout is "more traditional". If anything, it's the opposite.</p>
