      <p>The version of Word I have allows you to switch on "all ligatures", but not the standard ligatures only. That's an outdated version, though; it might be better in newer versions.</p>
      <p>Pages does ligatures automatically, and it allows access to Apple's typography panel, which is great... but I find it maddening for other reasons. For instance, its hyphenation function sucks, and it doesn't recognize soft hyphens.</p>
      <p>Use LaTeX, maybe...?</p>
