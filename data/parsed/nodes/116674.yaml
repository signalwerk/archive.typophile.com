    date_raw: 19 May 2014 — 5:17pm
    votes: null
    html: |-
      <p>To me, the main reason for wanting an open-source font would be to be able to use it on a web site.</p>
      <p>There are fonts that are not free, but still very inexpensive, for printing things on a laser printer. Some word processing programs provided a large selection of fonts as one way to compete with Microsoft Word.</p>
      <p>I don't know offhand of a free Garamond. There are open-source imitations of Palatino for use with Linux for example - such as TeX Gyre Pagella.</p>
      <p>If you look through Google Web Fonts, you should find a few old style ones. Unfortunately, one of the nicest, Goudy Bookletter 1911, has a coding problem that prevents it working properly with some older Windows programs, such as WordPad.</p>
      <p>Another free old style font is Day Roman.</p>
