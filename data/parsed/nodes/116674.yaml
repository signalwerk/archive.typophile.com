      <p>I apologize for misunderstanding your reference to the use of a free trial; usually, a "free trial" means something is available for a limited period or under a restrictive license, and so it sounded as though you had a limited-time version of a font, and made a permanent copy.</p>
      <p>I should have known better than to imagine that such DRM for fonts exists, however.</p>
      <p>And I did forget that you could put the ligatures in manually with the companion Day Roman - Expert font.</p>
