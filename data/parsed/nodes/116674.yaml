      <p>Sometimes people have a good reason to require a free font, but editing an anthology on Word doesn't seem like one. Also, some good commercial fonts cost less than one month of cellphone service, fancy shoes, etc. Just because free fonts exist doesn't create a requirement to never spend any money on fonts. Especially since you seem to be sensitive to typography, and you can't be exceptional with fonts that anybody can acquire with zero commitment.</p>
