  html: <p>I want to use a font with old-style proportions, old-style numerals, ff, ffi &amp; ffl ligatures as well as fi and fl, and italics. I am editing an anthology of short stories on Microsoft Word, so suggestions should come in the form of either links to TrueType or OpenType free downloads, or versions of fonts on Word that you know possess all these features. So far, the only font that really fits the bill is Georgia, but I don't like its heavy proportions; they are less elegant than old style fonts.</p>
