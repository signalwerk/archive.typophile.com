    html: "<p><i>Here's one good reason: It makes it easier to do the math.  <br> <br>72 has a lot of numbers which can be divided into it evenly: 2, 3, 4, 6, 8, 9, 12, 18, 24, and 36. Notice anything interesting about those numbers? Most of them are standard type sizes. It made it easy to figure out how many  <br>lines fit into an inch with standard type sizes. Even better, many of the standard sizes divide evenly into one another by a factor of 2 or 3. Some standard type sizes are odd (10,  <br>11, 14, 30, 60) or only come out even every 2 inches (48), but not as many as there would be if a different number  <br>had been chosen.  <br> <br>Try doing the same thing with 50, 75, or 100. With 50 you get 2, 5, 10, and 25. 75 gets you 3, 5, 15, and 25. 100 gets you 2, 5, 10, 20, 25, and 50.</i> <br> <br> <br>Well Mark certainly gets the pt. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\">  <br> <br>Chris, you sound like a Luddite. Like one of those old hot metal guys flogging a dead horse. � What's with this? I am not sure if you are attacking the monitor firms or defending them? <br> <br><i>Monitors weren't designed for typographers and designers. I doubt anyone even conceived that people would be doing publishing on computers when the first one was made.</i> <br> <br>It's time for the monitor manufacturers to wake up and \"Smell the Pixels\". The days of the <i>Three Stooges</i> are long gone with the hoola hoop and Roy Rogers comic books. <i>Speaking of money for old rope.</i>  The Howdy Doody Show is over. <br> <br>Well maybe not! <br> <br>I mean, hasn't Sony heard of Desktop Publishing? So who is going to tell them. <br> <br>Us, we are the customers. <br> <br><i>Plus you could say that human ergonomics (especially vision) favour the horizontal.  <br>Hence my website. :-)</i> <br> <br>The jury is still out. Novel yes, yes. Hope you don't mind I Canadianized your spelling of favour. It's not my fault. <br> <br>plain*clothes: <i