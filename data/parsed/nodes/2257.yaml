    html: <p>&gt; that was a switch that made screen-res bitmaps in general print better <br> <br>You must be talking about the technique where the printer driver would render the letters at twice the chosen point size, and print them at double the screen's resolution, yielding double (quadruple?) fidelity at the same physical size. But the font needed to have the double-size bitmap available in the OS. The olden days indeed. <br> <br>-- <br> <br>Chris, 72 isn't arbitrary, it's 12 x 6, and 12 has been a cornerstone number since ancient times. The king of Thailand (Rama IX) had his 60th (12 x 5) birthday a couple of years ago, an it was a big deal. Even I had to show up (that's a joke). <br> <br>hhp <br></p>
