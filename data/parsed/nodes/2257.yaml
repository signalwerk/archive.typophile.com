  html: <p>Does anyone know what's so special about 72 dots per inch on the Web? Does it have anything to do with 12 points per pica, six picas per inch? Or is it a myth?  <br> <br>A colleague claims that Web graphics must be saved at 72 DPI. But in my experience, only pixels matter, unless you want more work for yourself. I've tried it with several browsers on Mac and Windows... but 300x200 pixels is 300x200 pixels at 2 dpi and 2000 dpi. <br> <br>Thanks, <br>Ben</p>
  html_clean: <p>Does anyone know what's so special about 72 dots per inch on the Web? Does it have anything to do with 12 points per pica, six picas per inch? Or is it a myth?  <br> <br>A colleague claims that Web graphics must be saved at 72 DPI. But in my experience, only pixels matter, unless you want more work for yourself. I've tried it with several browsers on Mac and Windows... but 300x200 pixels is 300x200 pixels at 2 dpi and 2000 dpi. <br> <br>Thanks, <br>Ben</p>
