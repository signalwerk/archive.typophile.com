    html: <p>The orignal macs were 72 ppi (pixels per inch). The original laserwriters were 144 dpi. Twice that of the screen. It was built that way since the mac was a 'graphics' computer from the onset. <br> <br>However, as other's have stated, it's been a long time since a monitor was actually 72ppi. However, screen resolution certainly has not increased exponentially as much as HD space and Processor speeds have. We're still stuck with monitors that are under 150 ppi for the most part.</p>
