    html: <p>Ben's right. It's meaningless. On the Web, everything* is pixels, and images are either displayed automatically at their full resolution, or at a specified resolution in pixels. The DPI is irrelevant. <br> <br>T <br> <br>* Everything meaning all bitmap graphics displayed in native Web formats such as JPEG and GIF. There are of course vector and proprietary formats as well. <br></p>
