    html: <p>No one is going to talk about the connection to traditional typography? <br> <br>Where did 72 dots in an inch originate anyway?  72 seems like a very arbitrary number, and for it to have carried over into the digital age is simply because of tradition. <br> <br>And because you could be sure that on your 72 dpi screen you were seeing type in your layout as it "should" look when printed...but still. <br> <br>Why didn't traditional printers/typographers use a more round number?  say 50, 100, or even 75 dots to the inch?</p>
