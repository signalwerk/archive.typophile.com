    html: "<p>Here's one good reason: It makes it easier to do the math.  <br> <br>72 has a lot of numbers which can be divided into it evenly:  <br>2, 3, 4, 6, 8, 9, 12, 18, 24, and 36. Notice anything  <br>interesting about those numbers? Most of them are  <br>standard type sizes. It made it easy to figure out how many  <br>lines fit into an inch with standard type sizes. Even better,  <br>many of the standard sizes divide evenly into one another  <br>by a factor of 2 or 3. Some standard type sizes are odd (10,  <br>11, 14, 30, 60) or only come out even every 2 inches (48),  <br>but not as many as there would be if a different number  <br>had been chosen. <br> <br>Try doing the same thing with 50, 75, or 100. With 50 you  <br>get 2, 5, 10, and 25. 75 gets you 3, 5, 15, and 25. 100 gets  <br>you 2, 5, 10, 20, 25, and 50.  <br> <br>Since we use computers to do all our math now, convenient  <br>numbers like 72 are little more than historical habits, but  <br>it's not hard to see why they were chosen in the metal type  <br>days.</p>"
    html_clean: "<p>Here's one good reason: It makes it easier to do the math.  <br> <br>72 has a lot of numbers which can be divided into it evenly:  <br>2, 3, 4, 6, 8, 9, 12, 18, 24, and 36. Notice anything  <br>interesting about those numbers? Most of them are  <br>standard type sizes. It made it easy to figure out how many  <br>lines fit into an inch with standard type sizes. Even better,  <br>many of the standard sizes divide evenly into one another  <br>by a factor of 2 or 3. Some standard type sizes are odd (10,  <br>11, 14, 30, 60) or only come out even every 2 inches (48),  <br>but not as many as there would be if a different number  <br>had been chosen. <br> <br>Try doing the same thing with 50, 75, or 100. With 50 you  <br>get 2, 5, 10, and 25. 75 gets you 3, 5, 15, and 25. 100 gets  <br>you 2, 5, 10, 20, 25, and 50.  <br> <br>Since we use computers to do all our math now, convenient  <br>numbers like 72 are little more than historical habits, but  <br>it's not hard to see why they were chosen in the metal type  <br>days.</p>"
