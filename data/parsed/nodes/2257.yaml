    html: <p>Thanks for the feedback, all.  <br> <br>I held a ruler to my Mac display and got about 105-110dpi. Toning it down to 1024x768, I got it to 90-95dpi. Nothing came close to 72. Oddly, my 15" Windows monitor at 800x600 was about 70-75dpi; at 1024x768 it was about 90-95. I imagine my classroom's projector would yield a larger dpi, since it stretches 800x600 pixels four feet wide. <br> <br>But in all cases, the same 100 square pixel graphic remained 100 square pixels. Next time someone asks, maybe I'll underscore the pixel dimensions -- but ask for 1 dpi just to see how they react. <br> <br>But does 72dpi have anything to do with 72 points in an inch, as in 12 points to a pica?</p>
