    html: <p><i>Almost every monitor's resolution is 72 DPI.</i> <br> <br>Wrong. Almost every <i>Mac</i> monitor is 72 dpi, but what's that? Less that 5% of the market? Most Wintel monitors have had a real resolution of 96 dpi for years now, and most new flat screens are 122 dpi or higher. Mine is 133 dpi; my business partner's is 145 dpi; some of my clients have IBM 200 dpi screens. Only Apple are still largely stuck at 72 dpi.</p>
