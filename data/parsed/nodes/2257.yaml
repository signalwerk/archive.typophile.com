    html: "<p>Actually, the assertion that mac screens are 72dpi is also not <i>quite</i> correct either. The operating system renders type at a nominal resolution of 72dpi, but how its actually displayed on a particular monitor is up to the monitor's size and pixel resolution.  <br> <br>Its an easy thing to prove too - just set your monitor's resolution to a different one than it is currently working at and the actual resolution of it in DPI will change, but the nominal resolution that the OS is drawing graphics at will remain at 72dpi on a mac or 96dpi (or whatever) on a Windows box. <br> <br>DPI is, as fellow hairyface Thomas said, irrelevant. <br> <br>PS: I work in television and I spend at least 2 hours a week explaining screen resolution to people who think they can take a DVD menu stripped of its navigation and shove it on a poster 5 foot high. </p>"
