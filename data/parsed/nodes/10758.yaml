    html: "<p>the website for skam records: <a href=\"http://www.skam.co.uk\" target=\"_blank\">http://www.skam.co.uk</a> uses some automated-voice audio to complement its navigation. personally i think this site is real neat (although far from intuitive, especially since they added that thing that looks like dried figs(?)). the fact that it's in flash does a few things, 1) make it inaccessible to those with disabilities (and in fact there's some \"braille\" graphics on there that are just silly for a blind person to whom they're useless) 2) allows the designer to implement interesting layered audio on a web at tiny file sizes, the handy thing (you may know already) with flash/audio being you can make even a tiny invisble swf and stick it somewhere on your page, and flash compresses and exports .wav files as mp3 which is very cool. the site also has other environmental audio (which does not turn on and off) which imo is gentle and restrained, as well as more ok than some seeing as it's a music label site.  <br> <br>also, germane but not exactly related to your questions is this article i just found on \"voice font\" technology: <a href=\"http://www.creativepro.com/story/feature/14214.html\" target=\"_blank\">http://www.creativepro.com/story/feature/14214.html</a>; since css 2 allows us to make aural styles (<a href=\"http://www.w3.org/TR/REC-CSS2/aural.html\" target=\"_blank\">http://www.w3.org/TR/REC-CSS2/aural.html</a>) for those using speech synthesizers i guess these are being called aural or voice \"fonts\" ... interesting.  <br> <br>hope this was remotely useful.</p>"
