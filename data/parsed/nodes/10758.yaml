  html: <p>This is only tangentially related to visual design, but  <br>you're the best audience I know... <br> <br>Working on a project incorporating contextual audio help. <br> <br>A) What sites use audio for navigation assistance or as a  <br>guide through complex processes? <br> <br>B) What sites do a good job with audio for entertainment as  <br>part of a broader site experience? <br> <br>Thanks.</p>
