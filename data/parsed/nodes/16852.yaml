    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Organizations" class="freelinking" rel="nofollow">Organizations</a> : Society of Typographic Arts</strong></p>
    <p>The Society of Typographic Arts (STA) is a Chicago based design organization originally started in 1927. It was the Chicago branch of the AIGA until it left that organization to become the STA. The STA sponsored an annual competition, the 100 show as well as several publications. They were also one of the organizations that founded ICOGRADA and hosted the 1978 conference. In 1989 the organization broadened its focus to include other areas of design and became the now defunct American Center for Design (ACD).</p>
    <p>In 1990 some former members of the STA restarted the organization as the New STA with a primary focus on local and regional design issues. It holds an annual design conference and has sponsored a series of informal presentations by designers ,and events having to do with Chicago's design history. For the seventy-fifth anniversary three simultaneous exhibits were held: "Fifty Years of Graphic Design in Chicago 1927-1977," "Fifty Years of Chicago Graphic Design (1941-1991)," and "Seventy-Five Years of Graphic Design in Chicago." Images from those exhibits were later incorporated into an online archive.</p>
    <p>Website: <a href="http://sta.3st.com/main.php" title="http://sta.3st.com/main.php">http://sta.3st.com/main.php</a></p>
    <p>Chicago Design Archive website: <a href="http://www.chicagodesignarchive.org" title="http://www.chicagodesignarchive.org">http://www.chicagodesignarchive.org</a></p>
    <p>Books published by the STA:</p>
    <p>The Book of Oz Cooper, 1949<br>
    Trademarks USA, 1964<br>
    Fifty Years of Graphic Design in Chicago, 1977<br>
    Herman Zapf and His Design Philosophy, 1987</p>
