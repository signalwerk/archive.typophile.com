    <p>I need help finding the typeface in the brochure. I know the bottom faces are Adobe Garamond. The script looks like Bickham, but it is not. The "best of louisville" I have seen in Qudoba ads, but I am not sure what it is. The "stay in the heart of it" looks Trade gothic.</p>
    <p>Thanks!</p>
