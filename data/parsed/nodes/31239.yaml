      <p><cite>It has been years since I visited the Corcoran. What is it like as a design school? Can’t they help you get internships?</cite></p>
      <p>Overall the Corcoran is pretty impressive. I could nitpick about things that I don’t like, but compared to some horror stories I’ve heard about other schools, I’m amazed at the quality of education that I get for the money. Classes are tiny—most studio classes never have more ten students and lectures rarely get past twelve. The quality of instruction is generally exceptional and the majority of the professors are local design leaders and incredibly enthusiastic. If you’re familiar with Bauhaus curriculum you’ll know how the program works; it’s all rooted in what Johan Severtson set up when he ran the program, and he was trained at Yale when the great modernists were teaching there. If you want to stop by some time let me know and I’ll put you in contact with the head of the design department.</p>
      <p>Anyway, the Corcoran does have an internship program, but it’s not perfect. I don’t need the credits to graduate, so it’s not necessary for me to jump through the hoops of college bureaucracy when it’s probably easier for me to just find something on my own. </p>
      <p><cite>Most of the people I know who design type are self-taught. Some lucky few go to Reading.</cite></p>
      <p>I’ve pretty much got the impression that learning type in school is a graduate level thing. Fortunately there are some great law and design jobs in San Francisco/Palo Alto, so after I’m done at the Corcoran I think that I’ll try to get in to the design program at Stanford to study type there. Or at least I will if they’ll let me in with my crappy 3.7 GPA...</p>
