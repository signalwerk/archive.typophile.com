      <p>You should give Ralph Smith at Phil’s Fonts/GarageFonts a call. I used to work there, and we had several design interns. Phil’s Photo, which preceded the digital foundry/distributorship, was one of the best phototype houses in the country. There really was a Phil back in the day, but Ralph took over the business after working there for many years. Ralph gracefully made the transition to digital as an early adopter.</p>
      <p>I’m not saying you’d be drawing type all day (or all that much), but you would learn a great deal about the type business from all different angles. Ralph is also a big supporter of independent designers and foundries, and he knows a lot about type. Internships with type businesses are rare, so it’s worth exploring since you’re in the area.</p>
