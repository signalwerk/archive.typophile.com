    <p>I’m starting to hunt for summer internships, and I have two questions. First, are there designers or design firms in or around Washington, DC that do a lot of type design and might need interns?</p>
    <p>Second, and this is the tough part, my school has NO type design or lettering classes. Custom lettering is actually frowned on by some instructors. So as I update my portfolio, I’ll end up with a mishmash of video, web, flash, and print pieces, none of which will include much, if any, custom lettering. My work load at school is pretty heavy, so my experiments with type design are often limited to playing with calligraphy here and there, and I’m starting on some letter designs, but I don’t expect to have a single finished font before summer. Should I even be looking for a type design internship with my tiny amount of related experience, or should I stick with a more general design firm, keep learning type design on the side, and try to land a type design internship after I graduate next year?</p>
