    <p>And by interesting, I mean really clean :p And by clean, I mean I have no idea what the proper jargon to use would be.</p>
    <p>I’m meaning something in the vein of an Avant Garde Gothic, a Century Gothic, a Futura, and Avenir.</p>
    <p>However, not one of these fonts. I’ve used them in the past a large number of times, and am trying to find something new to brand a company. Something more ’compact’ vertically. </p>
    <p>Just throw out  your favorites, so I can check them out. I’m not sure exactly what I’m looking for, but i’ll know it when i see it. Damn, I sound as bad as a client!</p>
