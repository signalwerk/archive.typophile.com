      <p>Thanks for chiming in, Fred. </p>
      <p>Hrant: I hypothesize that extreme details (which in some cases might be the contrast axis) would benefit from being toned down as the size gets smaller, but I am not concluding – just asking questions: For example, why are diacritical marks often drawn symmetrical, even if the alphabet is not?</p>
