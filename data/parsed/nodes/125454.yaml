    html: |-
      <p>I think that a less steep axis in the o-like top part of the lc- g is a common thing to do, so its axis is less slanted than the matching lc-o. It is not a law of course. But my feel is that it must be done quite often in faces with contrast. The reason might have to do a lot with balancing the optical axis of the whole letter g.<br>
      I might have seen faces with a less steep axis, but in a haste won't recall any.<br>
      Best,<br>
      Fred</p>
