  html: <p>I’ve noticed that some type designers draw the head of their binocular ‘g’ with a less steep contrast axis than their ‘o’. Fred Smeijers <em>Quadraat</em> is an example. This made me wonder if it is a size-related optical adjustment, or something one does to better balance the complex shape of the letter. In the case of Quadraat, it might just be a byproduct of compressing the ‘o’ vertically, but it would surpise me if a master like Smeijers didn’t do this on purpose. Conceptually, a more regularized design for smaller sizes does make a lot of sense to me. Are there examples of small-size masters that do this?</p>
  html_clean: <p>I’ve noticed that some type designers draw the head of their binocular ‘g’ with a less steep contrast axis than their ‘o’. Fred Smeijers <em>Quadraat</em> is an example. This made me wonder if it is a size-related optical adjustment, or something one does to better balance the complex shape of the letter. In the case of Quadraat, it might just be a byproduct of compressing the ‘o’ vertically, but it would surpise me if a master like Smeijers didn’t do this on purpose. Conceptually, a more regularized design for smaller sizes does make a lot of sense to me. Are there examples of small-size masters that do this?</p>
