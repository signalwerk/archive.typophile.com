    html: <p>Thank you so much for writing, Fred. As I wrote, I was not sure of the origins of this in Quadraat. I have noticed it in many other types too. In my own feeble attempts at drawing a serif typeface, I’ve shaped the head of ‘g’ independently because I find the presence of the flag and the connection to the loop requires it. But then came this idea, that maybe it also needs to be slightly more upright because it is smaller. Like how the diacritical marks are generally given a much more symmetrical contrast (actually, I sometimes think they have more of a reverse-contrast, but that is another discussion). Have you seen any types that employ a less steep axis for smaller sizes?</p>
