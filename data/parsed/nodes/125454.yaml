    html: |-
      <p>Hi Frode,<br>
      The  top part of lowercase g of Quadraat has not much in common with the lowercase o.<br>
      It is made deliberately like this: the aim was to have the enclosed top-counter as big as possible. So, you have to enlarge it to the left and to the right. You can not go down because that would influence the balance of the lowercase g in a negative way immediately. Back then I had learned this from the work of Pierre Haultin.<br>
      Hope this helps,<br>
      Fred</p>
