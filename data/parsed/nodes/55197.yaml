      <p>First, it's a very cool concept, and I think the diner/neon feel is perfect for this concept. Nice work so far!</p>
      <p>Second, I think there's a weight problem. The width of the e-fork is much broader than the other letters. Have you tried drawing the D and the N with more overall width to unify the letters more? I think doing that may help the e-fork feel less cluttered or "tacked on" (and, bonus, it will give you more room to enlarge DOWNTOWN so it's more legible when scaled down.) </p>
      <p>This may also enable you to comfortably reduce the stroke weight of DIN to match the e-fork, too. I'd also smooth the inner joint of the fork handle to match the rest of your curved corners.</p>
      <p>AK</p>
