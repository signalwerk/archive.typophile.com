      <p>One thing to consider here is that Verdana and company wrapped outlines around intended <em>1-bit</em> (b&amp;w) rendering, and they required a lot of small size-specific glyph-wise tweaks (delta hints). When your intent is grayscale, and to avoid those tweaks, you end up with having to make size-specific outlines...</p>
      <p>BTW, also notable here is Elementar:<br>
      <a href="http://www.typotheque.com/fonts/elementar" title="http://www.typotheque.com/fonts/elementar">http://www.typotheque.com/fonts/elementar</a></p>
      <p>hhp</p>
