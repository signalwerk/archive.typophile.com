    <p>I'm a web designer, not a type designer. But recent experiments with @font-face embedding and in drawing some glyphs myself (i.e., torturing letterforms in Photoshop and Illustrator) have put me in mind of this question:</p>
    <p>Have you ever started designing a typeface based on how it will render on-screen at particular sizes?</p>
    <p>For example, imaging the following spec: "At 16px, the x-height shall be 8px, the cap height shall be 11px, the ascender height shall be 12px (from the baseline), and the descenders shall descend 4 px. At 14px, those same numbers shall be 7px, 10px, 11px, and 3px respectively. At display sizes, it shall look like an English Old Style or a Trump Mediaeval, with the following mildly quirky details..."</p>
    <p>Does such a workflow make sense? Is it bass-ackwards? If you've done something like this, has it led to fruitful results?</p>
