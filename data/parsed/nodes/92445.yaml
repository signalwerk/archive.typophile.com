    html: |-
      <p>I'd like to see the Franky stuff.</p>
      <p>So, this workflow <em>has</em> been used: [A] make bitmap/greyscale glyphs at target sizes; [B] draw TrueType outlines that you think should result in those bitmaps at those sizes; [C] hint them so that the output is reasonably faithful to the outlines at all/most sizes; [D] compare the rendering at the target sizes to the original bitmaps and iteratively adjust, tweak, adjust, tweak, adjust.</p>
      <p>Ta daa, Verdana and Georgia.</p>
      <p>If fussy details are part of what gives display-size faces their beauty, and and absence of distracting details is part of what gives body-text faces their readability, then one task would be to put details into the outlines that are designed to be lost as the face is scaled down. </p>
      <p>And of course, one would want to use proportions that are appropriate/beautiful for print work and successful/readable at small sizes on-screen. Compromise? Perhaps. Fatal? I suspect that depends on the designer. Not a task for the likes of me, certainly.</p>
      <p>The only other thing I'd like to know is, what other typefaces have been designed with a workflow like this (especially any commercially-successful typefaces)? Or perhaps: have any of your type designs started with an idea of the outlines you'd like, then considered the bitmap rendering on-screen at one or more target sizes, and then proceeded [A] thru [D] from there? (Or, do you know of any?)</p>
