    <p>Hi, here's a experiment series i made in blackletter, first the are two styles Africana and Europea, the difference between them is the position of a 90º angle. There is also small caps based upon some attemps in the letterings i see in the streets ( i'm from Mexico, and we use lots of blackletter for anything)ended looking like lettering of heavy metal logos.</p>
    <p>There's a more detailed preview in behance, but the version attached here is more updated<br>
