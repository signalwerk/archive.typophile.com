      <p>I don't think I've ever seen such a static blackletter.<br>
      Though it grows on me, the more I look at it.</p>
      <p>My main complaint would be the non-letter glyphs. No calligraphic origin remains, those characters look (%, &amp; etc.) like they were laid down with electrical tape, not a pen.</p>
