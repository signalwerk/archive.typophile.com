    html: <p>Thanks Bob -- I think! The only worry I have about my Bulfinch project is that it's too sentimental, so now I don't know whether the sassy second g would mollify or clash with it. Structurally it's more closely related to the other letters, especially, say, the c. But of all the lowercase letters, it draws the most attention to itself and might make the face appear too look-at-me. Still deciding! ~Barbara</p>
