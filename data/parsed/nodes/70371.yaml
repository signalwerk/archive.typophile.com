  html: |-
    <p>Hello Typophiles. I am a hobby printer who works mostly with metal type. I'm hoping you can offer some helpful comments on the use of the two lowercase g's that came with a font of Bulfinch Oldstyle. This face was designed in 1903 by William Martin Johnson for use in the <em>Ladies' Home Journal</em>. Although I think it was used mostly for heads, it was cast in sizes all the way down to 6 points. I'm using 18-point Bulfinch to set a short text block, and I'm not sure whether to use only one of the g's (and if so which one), or whether to use both (and if so how to determine which to use where). Thanks for your comments!</p>
    <p>Barbara</p><div class="imageWrap"><img src="http://typophile.com/files/Bulfinch_4971.jpg"></div><p></p>
