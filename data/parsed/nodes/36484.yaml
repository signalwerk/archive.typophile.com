      <p>This thread seems to have been resurrected from the graveyard, but I thought I'd throw in a tip for the original poster.</p>
      <p>After Effects is what you need to learn. I set out to learn how to make "kinetic" type videos about a year and a half ago, and managed to make a few I was happy with (for the most part). </p>
      <p>Lynda.com has pretty good courses for this. But some of the best online training out there (which happens to be FREE) can be found at video copilot. Start here: <a href="http://www.videocopilot.net/basic/" title="http://www.videocopilot.net/basic/">http://www.videocopilot.net/basic/</a></p>
      <p>Here is another tutorial which helped me a lot with timing: <a href="http://www.crookedgremlins.com/09/01/2008/kinetic-typography-tutorial/" title="http://www.crookedgremlins.com/09/01/2008/kinetic-typography-tutorial/">http://www.crookedgremlins.com/09/01/2008/kinetic-typography-tutorial/</a></p>
