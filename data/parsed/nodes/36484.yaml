      <p>If you enjoy programming it’s probably worth a shot, otherwise you might end up sinking a lot of time into figuring things out. It’s worth noting that their code is from 2002 and doesn’t come with much in the way of compilation instructions, so unless you enjoying fighting to build a binary, it’s gonna be nasty. </p>
