    html: |-
      <p>Illustrator doesn’t animate. I think Adobe was looking at bringing SVG animation into Illustrator when their Flash imitator tanked, but that stuff never really went anywhere.</p>
      <p>Using 3D apps to do your animation can work well, but they won’t be nearly as easy to learn as After Effects. In terms of application design, After Effects is just like Photoshop with keyframe animation and a scripting system tacked on, which makes is extremely easy to learn, at least if you’re already familiar with Photoshop. 3D apps tend to be much more complex. Previous versions of Flash have never been able to export working movies, just SWF files, so unless this changed in CS3 Flash isn’t the best choice. And because of the way Flash handles in-between frames, it can also be a PITA to do serious animation in because it requires extra steps for no good reason other than the original programmers were absolutely horrible application/UI designers.</p>
