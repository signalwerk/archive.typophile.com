      <p>As far as I can see, all the movies in that playlist on that site, are made with Adobe After Effects. Some of the simpler ones might be done with some other app, but the majority is pure AE. Which isn't even so difficult by the way, if you have experience with timeline- and keyframe-based apps, you should be able to make a couple of animations in a day or two. Not as perfect as the Pulp Fiction animation of course, but still pretty decent. I have made a couple of kinetic-type movies, done in a week or so, without any experience with the program. (I did know Premiere and Flash, so then AE is not too difficult). If you don't have experience with such apps, then it will take more time to learn.</p>
      <p>I will see if I can upload my movs somewhere, but they're about 150mb, and I don't want to compress it too badly.</p>
