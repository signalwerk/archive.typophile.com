  html: |-
    <p>I'm using Proxima Nova on a project and don't get me wrong, it's a great font. That is, however, until you need to use bold and at sizes of 15px or less (whether I'm using regular with bold styling or Proxima Nova Bold). </p>
    <p>Any suggestions for a font that looks good in bold at small sizes which would work alongside Proxima Nova?</p>
    <p>Thanks!</p>
