    html: <p>If you can convince H&amp;FJ to let you use Gotham before they release their webfont service, I suspect that’s a better option. Can you show a screenshot of what looks bad, btw? Otherwise, take a look at the <a href="http://www.webtype.com/catalog/?wssmall=829" rel="nofollow">Webtype fonts under the “small” tab</a>. They have some geometric sans serifs.</p>
