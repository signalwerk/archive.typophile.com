    html: |-
      <p>I don't know where you're seeing any serifs. The zip file that downloads from the  link I posted (click on "Download T1")  contains three versions of the font, each with .pfb, .pfm, and unnecessary .afm and .ifm files.</p>
      <p>The image is from that font as I downloaded it.</p>
      <p>There is no "AE" in your sample. There is an E and and A, which were tied together graphically as a custom creation done with the rest of the logo creation process (which might have included a customized proprietary font).</p>
      <p>Machine is one of many similar base fonts. There is no published version of Machine with an outline; Here is the text with such an outline artificially added.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/SeaDevilsMachine_4346.jpg"></div><br>
      In fact, I wouldn't be surprised if Steffmann used Machine as a base from which to create his College fonts.<p></p>
      <p>- Herb</p>
