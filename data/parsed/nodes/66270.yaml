    html: |-
      <p>It appears that there is no omacron; but you can easily compose one:<br>
      In the glyph palette, you'll see there is a "combining macron" (see below); if you type a normal "o" and then insert this combining macron from the glyph palette, it will sit/slide on top of the "o"; you might just have to kern it a little to adjust its placement.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/macron_6124.gif"></div><p></p>
