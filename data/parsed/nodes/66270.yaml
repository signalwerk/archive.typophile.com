  html: |-
    <p>Help! I'm out of my mind trying to figure out the best way to make an "ō" macron in helvetica neue in InDesign. It appears there is none. Suggestions? </p>
    <p>I've turned on US Extended...Maori...but InDesign just wont recognize the character.</p>
