  html: |-
    <p>Are you attending SXSW Interactive this year? Want to meet up with others who have a passion for typography? </p>
    <p>Join me at the SXSW Font Meetup this Friday. </p>
    <p>Details:</p>
    <p>Friday, March 7th<br>
    3:30-4:30 p.m.<br>
    Long Center, 701 W Riverside Dr</p>
    <p><a class="freelinking external" href="http://schedule.sxsw.com/2014/events/event_IAP995319" rel="nofollow">http://schedule.sxsw.com/2014/events/event_IAP995319</a></p>
    <p>If you'll be in Austin, but don't have a SXSW badge, this event is free and open to the public, so swing on by!</p>
    <p>Hope to see you there!</p>
    <p>Jim Kidwell<br>
    Extensis</p>
