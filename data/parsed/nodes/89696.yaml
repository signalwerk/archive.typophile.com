  html: |-
    <p>At last! my foundry G-Type has a web presence. It's only taken 13 years!</p>
    <p><a href="http://www.g-type.com/" rel="nofollow">You can see it here.</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Beautiful_5619.gif"></div><p></p>
    <p>I have updated/extended/improved many fonts to OpenType. Not only that, but all G-Type fonts have a 25% discount for the whole of February.<br>
    The new site, created by Leeds-based agency Creode, is a full e-commerce affair boasting highly advanced test drive &amp; sampling tools to fully explore each family’s OpenType features and glyph set. Visitors will also be able to browse my custom font and logo portfolio, plus view and comment on new typefaces in development via the interactive blog.</p>
