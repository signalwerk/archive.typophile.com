    html: |-
      <p>I can't help with AFDKO on Windows. I am on Macs.</p>
      <p>On the other hand, if you have problems with FontForge, here is some replacement code for <code>listcharnames</code> written in Lua for LuaTeX. That avoids  having to install the Fontforge python module but I think LuaTeX uses some Fontforge code anyway. If you have tex live installed, this should run.</p>
      <pre>--- cut here
      #!/usr/bin/env luatex --luaonly

      local f = fontloader.open(arg[1])
      local startcode=tonumber(arg[2])
      local endcode = tonumber(arg[3])
      local listcodes={}
      local i = 0
      while (i &lt; f.glyphmax) do
        local g = f.glyphs[i]
        if g then
          if ((g.unicode &gt;= startcode) and (g.unicode &lt;= endcode)) then
            listcodes[g.unicode] = g.name
          end
        end
        i = i + 1
      end
      local keys={}
      for n in pairs(listcodes) do table.insert(keys,n) end
      table.sort(keys)
      local names={}
      for i,n in ipairs(keys) do table.insert(names,listcodes[n]) end
      print(table.concat(names,","))
      fontloader.close(f)
      ---
      </pre><p>Here is a trace of execution on my mac: the hex interval needs to by written with 0x...</p>
      <pre>% listcharnames texgyrecursor-bold.otf 0x050 0x060
      P,Q,R,S,T,U,V,W,X,Y,Z,bracketleft,backslash,bracketright,asciicircum,underscore,grave
      % 
      </pre><p>On windows, unless you are running cygwin, my scripts would not work as is and the previous call would become</p>
      <pre>luatex  --luaonly listcharnames texgyrecursor-bold.otf 0x050 0x060
      </pre><p>
      That gives as output the list to be used with <code>tx -g</code></p>
      <p>I dont' find that Lua code very elegant compared to the Python script but I am not experienced enough in Lua to improve.</p>
      <p>Incidently, should it not be possible to generate the desired chart directly with LuaTeX or LuaLaTeX?</p>
      <p>Michel</p>
