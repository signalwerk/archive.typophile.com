    html: |-
      <p>Almost by accident I came across a wonderful utility for Windows -- by the Unicode Consortium itself! - that handles the task of generating Unicode code-point charts: UniBook:</p>
      <p><a href="http://www.unicode.org/unibook/" title="http://www.unicode.org/unibook/">http://www.unicode.org/unibook/</a></p>
      <p><a href="http://unicode.org/unibook/help/unibook.htm" title="http://unicode.org/unibook/help/unibook.htm">http://unicode.org/unibook/help/unibook.htm</a></p>
      <p>It creates charts using the same template as the standard unicode charts, choose your font, and has lots of options and features, including printing to pdf if you have a pdf printer or Adobe Acrobat installed. Still exploring its possibilities.</p>
      <p>Surprised this one isn't better known. Thank you all for your responses, and especially Karl Strange for all of his help!</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Unibook_0600_6321.jpg"></div><p></p>
