    html: |-
      <p>The AFDKO command <code>tx</code> gives you charts and if you use the <code>-g</code> option with a list of characters, you can get the chart for those glyphs. However <code>tx</code> does not appear to accept a unicode range. On the Mac or on Linux you can however easily generate the list of character names if you have the FontForge python class installed. Here is a script that does that. Let us call it <code>listcharnames</code></p>
      <pre>---- cut line
      #!/usr/bin/env python

      import fontforge,sys
      fnt=fontforge.open(sys.argv[1],1)

      start = int(sys.argv[2],16)
      end=int(sys.argv[3],16)

      unilist=[g.unicode for g in fnt.glyphs() \
          if ((g.unicode &lt;= end) and (g.unicode &gt;= start))]
      unilist.sort()
      print ','.join(fnt[u].glyphname for u in unilist)
      ---
      </pre><p>Then you can also give yourself the command <code>mkchart</code></p>
      <pre>--- cut line
      #!/bin/sh
      tx -pdf -g `listcharnames $1 $2 $3` $1
      ---
      </pre><p>and to get your chart say for Arno Pro for the hex values between 0x0060 and 0xFFFF, you need only type<br>
      <code><br>
      mkchart ArnoPro-Regular.otf 0060 FFFF &gt; ~/sheet.pdf<br>
      </code><br>
      and you get your sheet (to get it on the desktop on the mac, you rather redirect to <code>~/Desktop/sheet.pdf</code>)</p>
      <p>Here the sheet I get with<br>
      <code><br>
      mkchart ArnoPro-Regular.otf 0060 00AF &gt; ~/sheet.pdf<br>
      </code><br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/ArnoSheet_5282.png"></div><p></p>
