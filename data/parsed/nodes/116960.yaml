    <p>Dear typophiles,</p>
    <p>Does there exist any available application or tool for generating a pdf (or jpg or png or...) unicode code chart? For example, input a range (say, start=0600,stop=06FF) and a font name: Then the resultant pdf gives you a unicode code chart covering that range (as supported by the named font), with the code point as caption per each cell... </p>
    <p>Anything like that available? Perhaps an online utility? Seems like a common enough task that a utility may be floating out there somewhere...</p>
    <p>Thanks in advance!</p>
