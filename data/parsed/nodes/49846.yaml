      <p>Kirsten you'll never believe this, the original concept proposed by a different design company was done in papyrus!</p>
      <p>Whilst on the cultural issue here's something quite interesting:<br>
      If you live in the comfort of the first world you'd probably tend to think of Africa as "yay, animals and tribal people" (so you'd tend to use fonts like the Jurassic Park font (I think that's what they used in the new Madagascar movie logo). But when you actually live here you'll discover people are always trying to live more like they do in the first world. That's the intention but many designers here are not capable of knowing how to treat that. When a brief says "logo should be african" the first thing everyone here does is download a map of Africa from internet and there's your logo! I can't tell you how boring it gets. What I am trying to do for this client is invoke the image of Africa through the colours, and I suppose also the eye symbol, but really we want it to be a mark that looks like it will stand up in the first world too. Think of organisations like oxfam who are international, but some branches are African. Now think, what sort of identity would they have for these branches? African enough to look African, but still pretty European. I think that's what I'm trying to achieve here.</p>
      <p>I will try going through all my fonts ;) If I get stuck on helvetica I'll kill you!</p>
