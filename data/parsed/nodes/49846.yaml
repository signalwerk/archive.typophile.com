    <p>I usually approach this forum with a design that I like and then I put it out there for people to confirm I'm on the right track... which I never am! So this time I want to do things differently, I want to talk to the forum right from the conceptual stage so that my mind is open.</p>
    <p>Wellsense is a company that is being set up in Africa and it is currently two women who are medical doctors. They are academic and hands-on.</p>
    <p>The idea is that they are setting up a company which offers consultancy, be it to medical research institutes or to clinics and hospitals.</p>
    <p>They said they wanted the identity to be unmistakably African and they mentioned red earth tones. They also did me a huge service in fishing out some Egyptian symbols which mean things like wisdom, medicine, enlightenment, etc. All the stuff they believe they stand for.</p>
    <p>I am brain storming and using pen and paper only (I used to dive straight into Illustrator).</p>
    <p>I don't want to put images up straight away because this limits creativity so I just wanted to explain what I have so far and then see if anyone is kind enough to throw in other suggestions.</p>
    <p>So far what I have is the word wellsense with no space between well and sense, all lower case, although maybe WellSense might work too. I then have picked an Egyptian symbol which means "wise medicine man" apparently! It's quite neat, it looks a little like the old Umbro logo. It is a diamond &lt;&gt; shape with another diamond shape inside and then a small dot inside that, so it's like an eye, but angular. I wanted to have that in the background and slightly above the text. So you'd have this diamond &lt;&gt; shape and then infront you'd have wellsense written in something like the facebook logo font, or the <a class="freelinking external" href="http://blog.eachday.com/2007/8/1/bubble-logo-insanity" rel="nofollow">eachday logo</a> font, (it's sans serif and rounded, but sort of square at the same time, I like it. OR the other option is something murcurius which is quite interesting. It sometimes looks like it belongs on a cosmetics label but somehow it might work for wellsense. The text or background can be earthy tones, like I was thinking a reddy brown, then an ochre colour somewhere for contrast and then maybe throw in some bright blue somewhere, be it in the logo or elsewhere like as a motif that is present in their brochures, website, business cards, etc.</p>
    <p>A question I have is, you know how certain fonts have certain histories and applications, for instance Times is a newspaper font, verdana is a nasty screen font, arial is from the same family as helvetica but created for Microsoft, etc. (I hope I have my history correct there!) anyway, what I'm saying is can anyone tell me what murcurius was created for, or fonts like it? The reason I ask is lets say it's common knowledge to some people that it was created for branding an ice cream company, then it's hardly suitable for a health consultancy. </p>
    <p>Sorry for the essay but can anyone help me out be adding to this discussion, I really want to give this client something good. It should be professional looking but still engaging and maybe even quite daring. They will be operating in the same town as a Wellcome Trust partner and so we don't want something that looks professional but dry like <a href="/wiki/www.wellcome.ac.uk" class="freelinking" rel="nofollow">Wellcome Trust's Helvetica</a> logo.</p>
