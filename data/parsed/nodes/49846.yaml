      <p>Ratbaggy, thanks for the comments. I liked your suggestion of going back to all lower case. I got a few people to read your rationale there and they all went "ahh yeah". I also liked the idea of making it look "drawn in sand", I tried a couple of photoshop effects and couldn't get even close to how I imagined it. One hesitation is I want the logo to be as versatile as possible (website, letter head, signboards, etc) so complex effect won't work, unless they're somehow successfully work with the limitations. </p>
      <p>Anyway here's the latest:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/logo-1_5050.5.gif"></div><p></p>
      <p>I just want to point out a few things so you can see the process:<br>
      - I have made it all lower case now<br>
      - I have used ITC Legacy sans ultra which i found to have some of the same appeal as le monde sans<br>
      - I stretched the font to 125% of its natural height<br>
      - but then cropped the ll so they weren't too high<br>
      - I then shaved them off at an angle and introduced a curve on the top left corner to mirror the s and e of the original font.<br>
      - the logo in the background has been redrawn slightly, I guess I like the homemade look rather than a precise geometric shape<br>
      - I think the "serifs" of the s shape match the angular logo in the background<br>
      - the text at the bottom is set in Vectora (I guess any professional looking face would be appropriate down there, but just need to find something that matches well)</p>
      <p>Bendy, I'm afraid the books on a bookshelf and palm tree didn't narrow things down an awful lot, BUT good news on the restaurant front... the marlin on the wall, there are two restaurants in Watamu like that. They're neighbours actually, both facing the beach. One is at the Hemingways Hotel (posh place) and the other is at Ocean Sports Hotel (where you go barefoot into the bar and restaurant) - that's the one we hang out at more. How well do you remember you trip? How old were you?</p>
