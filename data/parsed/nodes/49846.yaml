      <p>Quick reply before packing my rucksack for India!</p>
      <p>The ls work ok, but now the second one stands out being too tall i think. Perhaps bring the second one down somewhere in between the height it was and the height it is? Or shorten both down a bit? Or starting the second l at the same height as the right tip of the first one? Play around with moving those nodes, see what looks most comfortable.</p>
      <p>I also prefer the colour in the first version. It looks more purposeful. As Lex says, you can always try reversing the colourways. Or increase the saturation to make it redder.</p>
      <p>I think the third version reminds me of fudge and the second is too yellowy.</p>
