      <p>Interesting posts here ;)<br>
      I think Papyrus would need to be used exceptionally carefully to avoid looking stereotypical.<br>
      In my day job I market our training services worldwide but with a focus on Africa and Asia, including in the health sector. I've also travelled a fair amount in East Africa.<br>
      Without going into too much detail, I'd be inclined to think the principles of relevant design stand whatever context; also people's aspirations the world over are ultimately the same, and their psychologies are more similar than I'd imagined. If you look at INGO websites such as ActionAid, Oxfam, WaterAid etc you will see that most of their country office websites are branded pretty much the same way to confer international standards on their work around the world. That does not detract from their local context, which appears in the details specific to each webpage.<br>
      I'd agree with Kirsten that clarity and meaning are vital here. There is also the added criterion that your clients have asked for something 'unmistakeably African', which I think the Egyptian eye and the terracotta suggests. (Bear in mind that Egypt is not generally considered culturally part of Africa!)<br>
      You might try changing that terracotta into the blue you originally suggested, as blue is easier on the eye, more restful. It might also help you get around the contradictory criterion of 'not looking stereotyped', and suggest the blue of Lake Victoria or of the sky! But I do very much like the red you have. It depends whether you think the eye icon is enough to suggest African or whether the colour and the font need to do that too.<br>
      The curvy font suggests warmth, professionalism, calmness and femininity, which is I guess good for the client.<br>
      I think you could probably find a better-suited font. It's not bad what you have but there are some lovely humanist sans fonts out there. I might look at Fago, Le Monde Sans, Maiandra for example, just to see how the word form appears in different fonts.<br>
      Just some suggestions...you might not have budget to buy fonts!</p>
