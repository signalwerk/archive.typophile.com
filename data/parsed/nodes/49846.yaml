      <p>It may be worth a try to use Papyrus. It's been over used but it just may make sense in this application. It's a lighter font and has a hand crafted feel to it. </p>
      <p>Set the words in every font you have, you may discover a pairing you wouldn't normally consider. In my mind's eye I'm leaning towards a thin perhaps condensed font. A sans would probably be most associated with medicine but I think a serif could be interesting. Play a bit more. The heavier fonts that you've selected may work fine if you set them quite a bit smaller to provide the contrast. </p>
      <p>I'm hesitant to make font suggestions because I don't know what the cultural associations are with different typefaces in that area of the world. You may need to do some research.</p>
