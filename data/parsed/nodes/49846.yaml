      <p>I'm not wild for either font choice. The stroke weight of the letters and the stroke weight of the eye drawing are essentially the same. There's no real contrast. Also if you are going to run the two words together you need to differentiate them by color (like on the circle sample) or by one in all caps, or by using different weights, or different fonts. The two right side versions read as wellsense not well sense.</p>
      <p>The logo is going to be used to help market the service of these two women to medical facilities yes? Sort of a B-to-B of doctors rather than trying to appeal to the average joe/jane. Then you might want to take a clean, crisp approach to the type rather than trying to capture a local African flavor. I'm sure there are several typefaces that would be a happy melding of the two but off the top of my head I can't make any suggestions.</p>
