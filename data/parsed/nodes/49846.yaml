      <p>Thanks so much for that post Bendy. It's really awesome to hear from outsiders who know a lot about Africa. I actually live in Kenya, but roaming the streets of Mombasa is a sure way to get completely uninspired when it comes to professional... um, anything!</p>
      <p>Kirsten, you were right about the target market, I asked the client to break it down and here's what I got.<br>
      Our market as anticipated:<br>
      -      Locals/ laymen 0 %<br>
      -      Community groups 2%<br>
      -      locally based NGOs (not necessarily health professionals) – 5 %<br>
      -      local Kenyan institutions – 15%<br>
      -      internationally minded development &amp; health related groups – donors, international NGO’s, academic institutions – 78%</p>
      <p>Bendy, budget is an issue (when is it not) but I happen to own a copy of Maiandra, I don't have Fago or Le Monde Sans, I wish we could try before you buy. I did that with Klavika in one of my early posts (I just set the words wellsense on fontshop or something and then downloaded the gif). But the font costs $300!</p>
      <p>I am going to try out your suggestion of using blue. In actual fact I put together a basic sample for a brochure and I used pale blue on the inside pages to break up the teracota. Looks good. I'll attach it to this post as a PDF (please don't judge the actual typesetting and whatnot, it's just a sample I put together in 10 minutes to test colours)</p>
      <p>Also here's the latest version of THIS concept based largely on ideas I got while reading Kirsten's latest post. Kirsten won't be killed because I found Univers to have the same professional clinical look as Helvetica but slightly different, namely the a looks quite different. I've also played with the ll in Well and I made the W and S of WellSense about 95% of their true size so that it looks like a mark rather than plain boring text.</p>
