      <p>Hi all, I had a meeting with the clients today. One comment is that the red brown background colour looks too dark, like dark chocolate. They said that the colours are exactly what they asked for but now wondering if they can see something a bit more orange. I'm finding it really hard because I'm working on a laptop so during the day with lots of ambient light the red brown becomes grey brown and then at night the colours come alive. So it's really hard to show the client. I did tell them that when we print I'll take them to the printer to play with the Pantone chart, but not sure of the proper way forward.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/logo-1_4456.6.gif"></div><p></p>
      <p>Thanks for all the comments, I found squooshingTM was pretty funny, I read the official definition. I am very aware of concepts like faux formatting and am careful not to be silly with stretching fonts, etc, however in this particular case I feel that my squooshed version only becomes obvious if you compare it to the original, but also ITC Legacy sans is quite a squat font when you look at its lowercase characters and I feel that stretching vertically injected a bit of logo life into it (ok a bit of a compromise, but I think it works well enough?).</p>
      <p>Bendy, do you like the continuous shear along the tops of the Ls? Thanks for the idea. Sounds very much like you were at Ocean Sports Hotel. I'm actually Zimbabwean but we've been coming to Kenya on holidays for years and my uncle and aunt own a scuba school based at Ocean Sports so have been going there for many years. How funny!</p>
      <p>Kirsten, the reason I asked about the sports job you did is recently we met folk in Uganda who have a soccer program for under priviledged kids (including ex-child soldiers) and they've done very well. They tour the world and win every junior soccer tournament they enter. Prince Charles has even visited them. They have lovely brochures and website obviously produced outside Africa.</p>
    html_clean: |-
      <p>Hi all, I had a meeting with the clients today. One comment is that the red brown background colour looks too dark, like dark chocolate. They said that the colours are exactly what they asked for but now wondering if they can see something a bit more orange. I'm finding it really hard because I'm working on a laptop so during the day with lots of ambient light the red brown becomes grey brown and then at night the colours come alive. So it's really hard to show the client. I did tell them that when we print I'll take them to the printer to play with the Pantone chart, but not sure of the proper way forward.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/logo-1_4456.6.gif"></div><p></p>
      <p>Thanks for all the comments, I found squooshingTM was pretty funny, I read the official definition. I am very aware of concepts like faux formatting and am careful not to be silly with stretching fonts, etc, however in this particular case I feel that my squooshed version only becomes obvious if you compare it to the original, but also ITC Legacy sans is quite a squat font when you look at its lowercase characters and I feel that stretching vertically injected a bit of logo life into it (ok a bit of a compromise, but I think it works well enough?).</p>
      <p>Bendy, do you like the continuous shear along the tops of the Ls? Thanks for the idea. Sounds very much like you were at Ocean Sports Hotel. I'm actually Zimbabwean but we've been coming to Kenya on holidays for years and my uncle and aunt own a scuba school based at Ocean Sports so have been going there for many years. How funny!</p>
      <p>Kirsten, the reason I asked about the sports job you did is recently we met folk in Uganda who have a soccer program for under priviledged kids (including ex-child soldiers) and they've done very well. They tour the world and win every junior soccer tournament they enter. Prince Charles has even visited them. They have lovely brochures and website obviously produced outside Africa.</p>
