      <p>In the third image from your most recent post, there's not enough contrast between "wellsense" and the background image, so they start to blur together.</p>
      <p>I prefer the cream/terracotta/chocolate combination because there's greater hue variation between the three elements. If you're going to go with the orange/tan background, try making the text slightly pink to incorporate another hue.</p>
      <p>What about incorporating a cooler accent colour into the scheme? I don't mean into the logo itself, but maybe for secondary headings in the body text, or something along those lines.</p>
      <p> - Lex</p>
      <p>P.S. You could always reverse the first image (i.e. chocolate letters on a cream background).</p>
