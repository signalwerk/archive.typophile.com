      <p>Hi there!</p>
      <p>Get FontForge (<a href="http://fontforge.org/" title="http://fontforge.org/">http://fontforge.org/</a>). It's open-source and it does-it-all.</p>
      <p>About the "font technology that contain tiny bits of raster images", it's called Hinting. :)</p>
