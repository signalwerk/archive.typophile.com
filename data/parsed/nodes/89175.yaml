    <p>EDITION LIDU is pleased to announce the launch of NEW WEBSITE and an ONLINE SHOP. The official website and online shop <a href="http://www.editionlidu.com" title="www.editionlidu.com">www.editionlidu.com</a> was designed to present the EDITION LIDU, quality art and design books production, authors and featured events to a global audience.</p>
    <p>EDITION LIDU is an international publisher focusing on quality ART &amp; DESIGN BOOKS, original CHILDREN’S BOOKS and NEW MEDIA PROJECTS.<br>
    The edition encourages both established and young artists, writers, illustrators and graphic designers to create truly beautiful, intelligent books which open minds and represent the cultural nourishment.<br>
    The official website presents a unique collection of art and design books in English, French and other world languages. EDITION LIDU also offers original prints, T-shirts and other creative products which can be directly purchased online through the menu BOOKS &amp; ITEMS.</p>
    <p>You can find books, original postcards and other products by EDITION LIDU in selected art museums, design stores and bookstores.<br>
    EDITION LIDU regularly participates in art and design exhibitions and literature festivals all over the world and organizes Calls for Entries for original bookworks, illustrations, new media projects and other topics.<br>
    EDITION LIDU also cooperates with art and design collectives or publishers who contribute to innovative thinking in book culture and art in general.</p>
    <p>For up-to-date events and new products check out regularly www.editionlidu.com</p><div class="imageWrap"><img src="http://typophile.com/files/EDITIONLIDU_4484.jpg"></div><p></p>
