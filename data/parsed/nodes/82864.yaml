      <p>I admit to being fanatical about some things. In this context about corporations that go too far in usurping the gullibility of consumers, while making "we're the good guys" a central part of their image - that's a bit much! Of course any corporation tries to make money, and cannot be totally honest, but different companies have different business ethos, and to me some of them are simply too far from common decency to be tolerated, no matter how shiny and friendly their products are. Really, being fanatically pro a corporation is much worse than being anti. It's not like I'm fanatical about MS, Google, or any of the handful of corporations that I think are doing some good, socially responsible work.</p>
      <p>BTW, the way I see Apple now is exactly how I used to see MS in the 90s. On the other hand, even back then MS used to care about type, while Apple hasn't cared for many years now - and frankly I don't grasp how this sad reality can be glossed over by people on a forum that's fanatical about type.</p>
