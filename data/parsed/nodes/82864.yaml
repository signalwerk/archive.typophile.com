    <p></p><div class="imageWrap"><img src="/files/ff-vs-cufon_4394.png"></div><p></p>
    <p>If it were not for the pinch zooming on iOS devices, it would've been Cufon all the way.</p>
    <p>--</p>
    <p>If you sell font licenses for the web usage, please <em>please</em> make them Cufon friendly. No self-respecting pirate will ever care to convert obscured Javascript outlines back into mangled OTFs, when it is far easier to find the originals on torrent sites. But having a Cufon option <em>will</em> make the fonts far more attractive and useful to the web designers.</p>
    <p>If you are set on a service business model with recurrent charges, consider offering Cufon .js the same way you currently offer @font-face files. In the end this is not about paying less or more, it is about having a website look the same on all platforms. Something that is currently <em>impossible</em> to do with just the @font-face.</p>
