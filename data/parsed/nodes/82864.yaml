      <p>My main interest in web fonts would be to allow me to use an open-source face, so as to avoid issues, which would allow me to present a web page in a popular type style not available as a standard font.</p>
      <p>Using @font-face, except for the fact that one needs to do it differently for different browsers, is probably better.</p>
      <p>Anyways, I experimented with it. TeX Gyre Schola worked perfectly. Goudy Bookletter 1911, however, crashed it. That face has some coding issues, and points are missing at extrema according to FontForge, so the fault likely lies in the font and not Cufon.</p>
