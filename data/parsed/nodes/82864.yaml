      <p>&gt; <em>No Cufon is not a kind of Flash Replacement and I didn't mean to suggest that it was.</em></p>
      <p>Oh. I missed <em>not</em> in your question, my bad. The main problem with SiFR is the Flash dependency, especially considering the proliferation of FlashBlock and similar plugins.</p>
      <p>--</p>
      <p>I am mulling over writing a replacement rendering engine for Cufon that would outsource the rasterization to the web server. In other words when it would come to actually drawing text on the canvas, it would instead talk to a web server, have it draw that text into a .png instead and then fetch and display the resulting image. Basically a form of <a href="https://web.archive.org/web/20150123214741/http://facelift.mawhorter.net/" rel="nofollow">FLIR</a> that works as a drop-in replacement for Cufon.</p>
      <p>If I am to take the idea a bit further, this could actually be wrapped in a service run by the foundries themselves. And under the very same recurrent billing model used for @font-face licensing.</p>
      <p>--</p>
      <p>@Darrel - I should've said "looking good across all platforms" rather than "the same". Not achievable with @font-face in larger sizes at the moment as I'm sure you know.</p>
