    html: |-
      <p>... the good news (from my perspective) is that Linden Hill, from the same source, works.</p>
      <p>Of course, Cufon has serious limitations. CSS has to be used for leading - that isn't really a limitation, except that CSS is slightly more awkward to use with it. But the big limitation is that you can't have it substitute multiple fonts, giving each font certain tags - although there's a workaround involving a fancy JavaScript utility that turns various scripts on and off.</p>
      <p>The fact that the technique it uses means that people have to "view source" to copy text off the page... that will annoy people, and start some on their first step to becoming hackers. For some content, of course, it's largely irrelevant.</p>
      <p>Of course, for an open-source font, embedding is not required, and so @font-face probably is the right way to go for most purposes.</p>
