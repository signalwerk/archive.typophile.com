      <p>Ok. About the regular version. the changes on letters are better. But. "S" is a bit too wide on the top curve. It's smaller when it comes to the height (compared to the bottom half) but still too wide.</p>
      <p>"K" much better. "P" should maybe be somewhere in between the original and this last version.</p>
      <p>"3" is better, but the top half goes too much to the right. "8" has to be corrected on the bottom curve because it has a bump.</p>
      <p>"4" and "9" are still too narrow. Try to narrow the "R" and "5" a bit.</p>
      <p>Regarding the bold version... It's not completely the same family. You joined many lines together that are separate in the regular weight. And some additional comments: "2" is too heavy on the top half (curve goes too down), "4", "7" and "9" are way too narrow in this weight,</p>
    html_clean: |-
