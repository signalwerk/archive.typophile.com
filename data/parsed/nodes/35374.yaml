    <p>My name is Luís Martins, I'm from Portugal and I study communication design. I've recently started trying to design a typeface. In my current college they don't push us to do typeface design so I've started to learn the basics by myself.<br>
    This is my first go and I would like some C&amp;C from all of you. I've ordered already some books to learn more about it.<br>
    I'm quite glad to join this community.</p>
    <p>Cheers</p>
