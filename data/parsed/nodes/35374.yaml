      <p>"8": bottom bowl is not round on the right side.</p>
      <p>Maybe widen the "7" too... I'm still not too sure about "0" (zero)... Is it too wide or not. I know it's similar to "O" but... Maybe it should be a bit narrower. Try and see for yourself.</p>
      <p>And I suggest you start working with texts because you'll see the differences and contrast problems more quickly.</p>
      <p>And there are also some curve problems (not smooth curves) with some of your letters... There seems to be something going on with the top line (before it goes into a curve) with "P", "R" and "5" (middle line)</p>
      <p>Top arms of "E" and "F" are not horizontal. They are going a bit downwards.</p>
      <p>Minor minor changes.</p>
      <p>Let's see what others will say.</p>
