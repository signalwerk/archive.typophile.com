    html: |-
      <p>"S" is too horizontal in the middle. I'd make it slightly downward-angled. It also looks too vertically mirrored/symmetric. Top of S is normally always a bit smaller depending on the typeface.</p>
      <p>W and K should be a bit wider, B, J and P a bit narrower.</p>
      <p>Apply the same top/bottom principle as with the "S" to the "3" and "8". "9" and "4" should be wider.</p>
