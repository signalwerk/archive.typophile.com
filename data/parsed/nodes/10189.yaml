  html: <p>We are using InDesign on 4 computers on a network.  If Computer 1 opens the ﬁle it says the font for Arial <span class="caps">OTF</span> is missing… if Computer 2 opens it, it’s ﬁne… I have 2 computers that use the same Arial font and 2 that don’t… I’ve went to my font folder in <span class="caps">WINNT</span> and erased all the fonts and reinstalled the same fonts on all 4 computers but…still the same problem… <span class="caps">HELP</span>…</p>
