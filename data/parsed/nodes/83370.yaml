      <p>As long as we're "out there" . . .</p>
      <p>Typography and booze remind me of <a class="freelinking external" href="http://typophile.com/node/62789" rel="nofollow">this thread</a>, and of the following anecdote I posted therein:</p>
      <p>Matthew Carter tells the story of a time he was flying from the UK to the US and stopped in the duty free shop at Heathrow. He spied a bottle of Scotch whose label was printed using one of his types, so he bought it. As he exited the shop, a woman holding a clipboard asked him to take a market-research survey. When she asked him why he chose that particular brand of Scotch, he answered, "Because I designed the type on the label," and watched as the researcher puzzled over her questionnaire for a check box that corresponded to that answer.</p>
