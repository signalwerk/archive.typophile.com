  html: |-
    <p>So I just started this a few weeks ago and wanted to see what the professionals of Typophile had to say about it. right now I just have a thin version, but I want it to potentially have around 5 weights and a condensed (the condensed I have on the example is not refined by any means). Also, I have not started adjusting kerning yet just because I want to finish the design of it, then go back and work out the metrics and spacings. </p>
    <p>Any critique or commentary is greatly appreciated. Thanks in advance</p>
