    <p>All of this talk about the new Office fonts has me wondering, if I have Office Pro 2003 on my PC, does the license allow me to put it's fonts on my Mac? My feeling says NO, but my want for Font Bureau typefaces on my Mac says YES.</p>
    <p>Someone please say yes?</p>
