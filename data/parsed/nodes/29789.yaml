      <p>Here are the applicable sections of the Office Pro 2003 EULA. Sections 13 and 14 mean that I would have to remove the software entirely from my PC and install it entirely on my Mac. BUT! Section 1.1(B) clearly must apply to my laptop, regardless of OS. What other kind of portable device is there that can install the software? Only a laptop.</p>
      <p>So I can have my cake and eat it too! Californian FB and High Tower Text will fit in nicely with my other fonts on my Powerbook :)</p>
      <p>1. <strong>GRANT OF LICENSE</strong>. Microsoft grants you the following rights provided that you comply with all terms and conditions of this EULA: </p>
      <p>1.1 Installation and use. You may:<br>
       (a) install and use a copy of the Software on one personal computer or other device; and<br>
       <strong>(b) install an additional copy of the Software on a second, portable device for the exclusive use of the primary user of the first copy of the Software.</strong> </p>
      <p>1.5 License Grant for Media Elements. The Software may include certain photographs, clip art, shapes, animations, sounds, music and video clips that are identified in the Software for your use (together "Media Elements"). You may copy and modify the Media Elements, and license, display and distribute them, along with your modifications as part of your software products and services, including your web sites, but you are not licensed to do any of the following:<br>
       • You may not sell, license or distribute copies of the Media Elements by themselves or as part of any collection, product or service if the primary value of the product or service is in the Media Elements.<br>
       • You may not grant customers of your product or service any rights to license or distribute the Media Elements.<br>
       • You may not license or distribute any of the Media Elements that include representations of identifiable individuals, governments, logos, initials, emblems, trademarks, or entities for any commercial purposes or to express or imply any endorsement or association with any product, service, entity, or activity.<br>
       • You may not create obscene or scandalous works, as defined by federal law at the time the work is created, using the Media Elements. </p>
      <p>13. SEPARATION OF COMPONENTS. The Software is licensed as a single product. Its component parts may not be separated for use on more than one device. </p>
      <p>14. SOFTWARE TRANSFER. Internal. You may transfer your copy of the Software to a different device. After the transfer, you must completely remove the Software from the former device.</p>
