    <p>Hi,</p>
    <p>I want to buy first editions of these nineteenth century catalogs,<br>
     to scan them to have the best quality to vectorize ornaments and add them to my Vectorian Pack <a href="http://www.vectorian.net" title="http://www.vectorian.net">http://www.vectorian.net</a></p>
    <p>- Gravure et Fonderie Charles Derriey - Specimen Album - 1862<br>
    - American Type foundry catalog - 1897 or 1912<br>
    - George bruce's Son &amp; Co - 1882</p>
    <p>Do you know where I can buy it online?<br>
    Or do you know any specialized bookshop that I can contact?</p>
    <p>So far, I've just found Abebooks.com for buying first editions.</p>
    <p>Thanks,<br>
    Vincent</p>
