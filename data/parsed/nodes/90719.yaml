    html: |-
      <p>The French foundry I can't comment on; never seen it offered.</p>
      <p>The ATF 1897 or 1912 -- watch eBay. The older ones come up about once every 12-18 months.</p>
      <p>George Bruce's Son &amp; Co., 1882 -- not much chance of seeing that except rarely, usually at auction. Then you should be prepared to pay a hefty price for it.</p>
      <p>Check Oak Knoll Books and The Veatches Arts of the Book; they usually have some specimen books for sale. You can find them through Google since they're both well known firms.</p>
      <p>You might also approach a known specimen book collector to ask if they have duplicates.</p>
