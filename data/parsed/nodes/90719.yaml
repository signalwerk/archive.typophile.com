      <p>Thanks a lot for your help!</p>
      <p>Majus, you're right: ebay is the best place, and I found a a ATF 1912 at 215$, not bad.<br>
      Look forward to catch a 1897 :-)</p>
      <p>George bruce is untouchable, saw one at 17000$ !<br>
      (and I guess that the french market was smaller than the american one, it should be so rare...)</p>
      <p>The Veatches Arts of the Book is a excellent Book shop: found a Barnhart &amp; Spindler at 150$ (year 1900).</p>
      <p>OldNick, your offer is super nice, thanks a lot :-)<br>
      As I got already the ATF 1912, no need to send it to me.<br>
      By the way, delive rin France is not that expensive, 50$ in priority box with USPS.</p>
      <p>Thanks!<br>
      Vincent</p>
