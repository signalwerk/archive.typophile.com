    html: "<p>I have a copy of the 1912 ATF catalog, numbered A3247, in better-than-average shape for a one-hundred-year-old book. One caveat: mailing it to France could in itself cost a tidy sum, since the book weighs over 5 kilos. Reasonable offers will be entertained, if you're interested.</p>"
