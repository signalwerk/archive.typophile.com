    <p>Hello All,</p>
    <p>I have purchased a fount of the Temple script metal typeface (for my amateurish attempts at letterpress) and am wondering if this exists in a digital version? I have looked through Mike Yanega's script guide but I confess I got lost in the bewildering array of formal script typefaces there.</p>
    <p>Attached is a sample from the Riscatype catalogue. Many thanks in advance!</p>
