      <p>Digital fonts are software products and the copyright laws that apply to software applies to fonts.  Generally  speaking concepts cannot be copyrighted but coding can.  The U.S. Copyright Act provides a set of exclusive legal rights to the owner (or “author”) of a copyrightable work (which includes software and thus fonts):  the right to reproduce the copyrighted works;  the right to prepare “derivative works”; and the right to distribute (sell, license, etc.). This set of “exclusive” rights includes the right to block others from doing the same thing.<br>
      In the case of fonts made using font-making software, your design, when published, will constitute unique code which has been generated by your exclusive design and it is this unique code that is copyrighted even though you did not directly write the code line by line.  It is a manifestation of your concept - and is thus subject to copyright.<br>
      The name - if unique - is a trademark issue.</p>
