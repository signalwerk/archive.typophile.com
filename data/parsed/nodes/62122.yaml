      <p>This seems like more of a trademark issue, as the Lanham (Trademark) Act is what provides for certain kinds of relief against cybersquatting. Check out <a class="freelinking-external" href="http://www.bitlaw.com/source/15usc/1125.html">§ 1125(d) [43(d)</a>].</p>
      <p>If your client really wants that domain name, and feels the sum of money being asked is unfair, he or she should find a lawyer. </p>
      <p>Disclaimer: I’m not a lawyer and this shouldn’t be construed as legal advice.</p>
