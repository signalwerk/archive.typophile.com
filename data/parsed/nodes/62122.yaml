      <p><cite>...the fact that they _were_ willing to sell it<br>
      to you indicates that they are indeed squatters.</cite></p>
      <p>It might work toward a showing of bad faith. This is from the Lanham Act, and is in reference to the factors that can be considered to determine whether a defendant acted in bad faith, § 1125(d) [43(d)](1)(b)(VI):</p>
      <p><cite>(VI) the person’s offer to transfer, sell, or otherwise assign the domain name to the mark owner or any third party for financial gain without having used, or having an intent to use, the domain name in the bona fide offering of any goods or services, or the person’s prior conduct indicating a pattern of such conduct;</cite></p>
      <p>But it all comes back to registration, use, and distinctiveness.*</p>
      <p>*I’m not a lawyer.</p>
