    <p>So a week or two ago I posted a logo for critique. I hadn’t yet registered the domain name and put up a business card design that contained the proposed domain.</p>
    <p><a href="http://typophile.com/node/60849" title="http://typophile.com/node/60849">http://typophile.com/node/60849</a></p>
    <p>My client was supposed to register the domain last week and didn’t. This morning I ran across this:</p>
    <p><a href="http://stoneandwoodconcepts.com/" title="http://stoneandwoodconcepts.com/">http://stoneandwoodconcepts.com/</a></p>
    <p>I’ve contacted the company, who does actually operate doing countertops in another geographic area, and they’re willing to sell the domain “as a reasonable price that covers their costs”. I also informed him they’re in violation of copyright law and he seemed to think it was something that their designer came up with (dates on this are easily provable).</p>
    <p>If you do a google search for “granite countertop logo” my original thread comes up as the last result on the first page. You can put the pieces together to see what happened.</p>
    <p>Moral of the story: watch your backs guys, and apparently trust no one.</p>
