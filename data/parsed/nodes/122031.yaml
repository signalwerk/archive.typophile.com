    html: |-
      <p>Martin:</p>
      <p>Thank you for your thoughtful reply.</p>
      <p>The client is a top tier business school and Polaris is the identity typeface. If you were to look at our collateral, you may find much of it leans conservative, but by and large, we have the necessary scaffolding to select a typeface that doesn't fall in the realm of "business conservative."</p>
      <p>Copernicus remains on the table because it is Polaris's sister, but also, because the typeface is presently being used in one of our running print publications. The actual "official" secondary font is Hoefler, but it has fallen into disuse and many of us find it drab. A serif such as Hoefler does not convey the visual style of where the school is now, in 2014/15.</p>
      <p>So with that said, perhaps another way to look at this is: what are similar typefaces to Copernicus, that pair well with Polaris, and are friendly yet not overly experimental or expressive? I believe your Skolar suggestion is right on the mark, while Alegreya (though I love it so) is too calligraphic.</p>
