    <div class="node-spam-content"><p>Hello everyone,</p>
    <p>I'm looking for a type family to pair with Galaxie Polaris, for web use. We'll be using this one in the body copy throughout the site. The client is a university, in case that adds any desired context.</p>
    <p>Galaxie Copernicus is presently on the table, but I'm not sure of what else. Any suggestions? Thank you.</p>
    </div>
