    html: |-
      <div class="comment-spam-body"><p>Certainly Galaxie Copernicus could work. It seems though that the "issue" is that too many typefaces could pair up with Galaxie Polaris. I worked for a company before that once paired Frutiger Light for the body text with Trinité for headings. I haven't seen what they did with these typefaces myself, but to my mind they were probably a very good pair, even though at first glance it seems an unlikely choice as they have nothing at all in common, except perhaps for their quality. I can imagine if you use a light weight of Galaxie Polaris it could pair up with a lot of bold serif typefaces.</p>
      <p>I suppose in order to make proper suggestions we ought to know more about the project. What do you want to convey? I can imagine something that contrasts well with Galaxie Polaris could work well. Something like Alegreya perhaps. However, that may just be too calligraphic. Skolar may be an excellent choice. Also because it was designed for academic publications. But maybe you require something more elegant?</p>
      <p>I haven't looked at web fonts though, but perhaps these suggestions could send you in the right direction to find a suitable typeface yourself.</p>
      </div>
