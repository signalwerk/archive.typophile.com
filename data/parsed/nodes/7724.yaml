  html: "<p>'brand' could be a modified / customized '<a href=\"http://www.myfonts.com/fonts/linotype/itc-bauhaus/\" target=\"_blank\">Bauhaus</a>' / '<a href=\"http://www.myfonts.com/fonts/letraset/pump/\" target=\"_blank\">Pump</a>' / '<a href=\"http://www.myfonts.com/fonts/bitstream/blippo/\" target=\"_blank\">Blippo</a>'.: <br><i>&gt; <a href=\"http://www.myfonts.com/fonts/linotype/itc-bauhaus/bold/testdrive.html?s=brand&amp;p=72\" target=\"_blank\">www.myfonts.com/fonts/linotype/itc-bauhaus/bold/testdrive.html?s=brand&amp;p=72</a> <br>&gt; <a href=\"http://www.myfonts.com/fonts/letraset/pump/regular/testdrive.html?s=brand&amp;p=72\" target=\"_blank\">www.myfonts.com/fonts/letraset/pump/regular/testdrive.html?s=brand&amp;p=72</a> <br>&gt; <a href=\"http://www.myfonts.com/fonts/bitstream/blippo/black/testdrive.html?s=brand&amp;p=72\" target=\"_blank\">www.myfonts.com/fonts/bitstream/blippo/black/testdrive.html?s=brand&amp;p=72</a> <br>( Or, a 'trendy' remake, of course.. <img src=\"http://www.typophile.com/forums/clipart/bigsmile.gif\" border=\"0\"> )</i></p>"
