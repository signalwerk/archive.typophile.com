    html: <p>Brand looks alot like <a href="http://houseind.com/house.php?kit=CHALET-FO&amp;sub=lettersetter" target="_blank"> Chalet Tokyo</a>, but I'm pretty sure it's modified Bauhaus like Dav(id) said... <br> <br>You might also try <a href="http://www.myfonts.com/fonts/victory/bayer-sans/bayer-sans/testdrive.html?s=brand&amp;p=72" target="_blank">Bayer Sans</a>, maybe <a href="http://www.myfonts.com/fonts/sudtipos/tierra/" target="_blank">Tierra</a>, or, as a stretch, a stroked <a href="http://www.myfonts.com/fonts/remoteinc/sp-isis/regular/testdrive.html?s=brand&amp;p=72" target="_blank">SP Isis</a> with some slight modification?  I guess I got carried away with this one! <br> <br>Deadboy looks like a stylized <a href="http://www.myfonts.com/fonts/urw/fette-fraktur/d/testdrive.html?s=Deadboy&amp;p=72" target="_blank"> Fette Fraktur</a>, and a good-looking one to me.  Should be a custom job. <br> <br>As for the Rain Forest one, I came up empty.  It looks like someone mocked it up using circles and lines instead of an existing typeface, but I could be wrong.</p>
    html_clean: <p>Brand looks alot like <a href="http://houseind.com/house.php?kit=CHALET-FO&amp;sub=lettersetter" target="_blank"> Chalet Tokyo</a>, but I'm pretty sure it's modified Bauhaus like Dav(id) said... <br> <br>You might also try <a href="http://www.myfonts.com/fonts/victory/bayer-sans/bayer-sans/testdrive.html?s=brand&amp;p=72" target="_blank">Bayer Sans</a>, maybe <a href="http://www.myfonts.com/fonts/sudtipos/tierra/" target="_blank">Tierra</a>, or, as a stretch, a stroked <a href="http://www.myfonts.com/fonts/remoteinc/sp-isis/regular/testdrive.html?s=brand&amp;p=72" target="_blank">SP Isis</a> with some slight modification?  I guess I got carried away with this one! <br> <br>Deadboy looks like a stylized <a href="http://www.myfonts.com/fonts/urw/fette-fraktur/d/testdrive.html?s=Deadboy&amp;p=72" target="_blank"> Fette Fraktur</a>, and a good-looking one to me.  Should be a custom job. <br> <br>As for the Rain Forest one, I came up empty.  It looks like someone mocked it up using circles and lines instead of an existing typeface, but I could be wrong.</p>
