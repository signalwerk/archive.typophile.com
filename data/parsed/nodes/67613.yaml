      <p>Ooooh, this is something I'm fascinated about too.</p>
      <p>To my eyes, they're not all that different. The obvious differences to me are in the ㅅ and ㅊ jamo - the join at the top is different, and the Dotum shows much more pronounced modulation of the brushstroke. I'm also, of course, drawn to the microserifs, which I've always loved in Japanese Gothic fonts, and I borrowed for Inconsolata.</p>
      <p>In some of the Arial glyphs, I can see why the designers departed from Dotum. In 쳇, the ㅅ seems to have more negative space above it, separating it from the vowel ㅔ (but in 쥐 it's the other way around - Dotum has a good air gap, and Unicode looks smashed - and also, the way the ㅊ and ㅔ fit together more snugly in the Dotum, almost like an interlock, something we see more explicitly in the Malgun sample above). In the Dotum, they almost seem to crash into each other. Also, the ㄹ looks more centered in its space in the Arial - in the Dotum, its center of gravity seems to be leaning to the left. Finally, in 바, the ㅂ fills its space more fully in Arial, and seems somewhat small and isolated in Dotum. It's impossible for me to judge whether these are cases of authenticity being homogenized, or whether Dotum is quirky, or what.</p>
      <p>@ginger: it sounds like a lot of fun to hang out and absorb the culture and language. Enjoy!</p>
