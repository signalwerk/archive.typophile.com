      <p>Thanks for all your comments! This has been really illuminating. Outside perspectives are invaluable in helping one see what one would never have noticed as an insider.</p>
      <p>In the Korean design community, Arial Unicode's hangul is considered such an obvious failure that no one bothers to explain why exactly it fails. Even non-designers can tell something's wrong. When I did a web search about Arial Unicode's hangul, I came across several instances of people trying to find out why the hangul font was being displayed all ugly on a web page or a web application, the answer being that for some reason (e.g. style sheets), the hangul was being set in Arial Unicode. In fairness, apart from the design itself, the bad hinting certainly doesn't help Arial Unicode, making it really hard to read in smaller sizes.</p>
      <p>So when I saw here on Typophile people recommending Arial Unicode as a suitable font for displaying hangul, I was initially taken aback. It's like finding people recommending Comic Sans as a suitable Latin text font in a Korean typography forum. But upon reflection, I realized that the flaws of Arial Unicode's hangul may not be all that obvious to those who don't read hangul. I tried to imagine what Arial Unicode's hangul would look like from the perspective of a non-native, which led to some really interesting observations. This gave me the idea to ask some actual non-natives for their opinions.</p>
      <p>It would of course have been better as an experiment if I just asked people to compare the examples without voicing my own opinion first, but I had already stated it in this thread...</p>
      <p>Kent is spot on about the weight balance issues of Arial Unicode. Hangul syllables can exhibit pronounced differences of stroke density, so it is really important to shave the weight off the strokes in the denser parts to keep things even. Those only used to designing Latin typefaces may be more prone to overlooking this need, but then, I expect more skilled type designers to get this right even if they don't read hangul.</p>
      <p>I also agree with Michael's observation that Dotum pays more attention to allowing more equal space around the strokes. This should also make sense for non-native but skilled type designers.</p>
      <p>A less obvious thing to get right is getting the visual alignment of hangul. Latin letters rest on a baseline, but hangul letters (when set horizontally) are visually centred vertically on an imaginary horizontal line that is slightly above the geometric centre in text typefaces. In Arial Unicode, the 쳇 has a high centre of gravity due to the compressed top components, while 바 has a much lower centre of gravity. There's nothing intrinsically wrong with the balance of either letter, but they simply don't work together as they are not aligned.</p>
      <p>As Raph observes, the ㅂ in 바 fills its space more fully in Arial Unicode. The problem is that the space-filling is not matched by the other letters. I happen to think that such extreme space-filling is rather ugly for hangul, but it is acceptable if is applied consistently across the whole design; Gulim, another Windows system font, is a good example, as are the types of serif typefaces used for newspapers. Arial Unicode's 쥐, 쳇, and 퀴 are too gappy down low to match the space-filling of 다 and 바.</p>
      <p>The next point is rather subtle, and I would never have been able to articulate this without your responses having forced me to reflect on it. Simply put, not all strokes are equal when it comes to judging the harmony of form.</p>
      <p>Raph said in the Dotum sample, that the ㄹ seems to be leaning to the left. I would never have guessed at such an observation! The final (bottom-most) stroke of the ㄹ may extend an arbitrary amount and even touch the vowel jamo to the right, as in the 람 in the sample of my own design shown earlier. The part of the stroke which extends beyond the main body of the ㄹ is considered just an auxiliary stroke, so hangul readers won't see this as making the ㄹ lean to the left no matter how long it is, just as the extender of the 'h' isn't seen as making the letter sag downward.</p>
      <p>John said some of the spacing in Dotum seemed more problematic than in Arial Unicode in that some components visually associate more with other syllables. This problem, though, is a non-issue for native readers. Syllabic grouping in hangul is extremely regular in that the vowel jamo can only come to the right or below the initial consonant jamo. Readers of hangul don't need to rely on each letter (i.e. each syllabic block) being set apart from the rest because they already form cohesive visual blocks. Indeed, experiments indicate that hangul needs to be set quite a bit tighter than for the default spacing for fonts like Dotum and Batang for optimal readability. You can see in the samples above that newer typefaces designs have tighter spacing by default. (The older fonts are spaced looser for historical reasons involving full-width and half-width forms that aren't worth going into here.)</p>
      <p>Now, in hangul text which is spaced optimally for readability, you would see instances where jamo belonging to separate syllables appearing closer to each other than to jamo that they are actually associated with. In the combination 이이 for example, the second ㅇ may be closer to the ㅣ of the preceding syllable than with the ㅣ of its own syllable. This is practically invisible for native readers of Korean; the association of the jamo into the correct syllabic unit is so automatic that you never notice this. I only noticed this when I forced myself to look at hangul from a non-native's perspective.</p>
      <p>What bothers me greatly about Arial Unicode is the width differences between 다 and 바 on the one hand and 쥐 and 퀴 on the other. The former pair is is much narrower than the latter. In letters with a simple vertical vowel jamo like ㅏ and ㅣ, the vertical stroke defines the right boundary of the width of the letter that one is trying to equalize. Compare the distance between the left-most point of 바 and 퀴 to the vertical stroke of the vowel jamo in the two fonts. The small horizontal appendage of ㅏ doesn't play that great a part in determining the overall visual width of the letter. But I can see how for non-native readers, this may not be the case. The designers of Arial Unicode probably tried to equalize the widths of 다 and 바 with 쥐 and 퀴 but gave an inordinate amount of consideration to this small stroke.</p>
      <p>Figuring out what strokes matter in determining the overall balance of structure is no trivial task, and I suspect one needs a high level of familiarity with the script in order to get this right.</p>
      <p>In fact, this thread has helped me see that there are so many things that go into the design of hangul typefaces that Korean designers take for granted but are not obvious at all to non-natives.</p>
