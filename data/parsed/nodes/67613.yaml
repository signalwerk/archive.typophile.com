      <p>I'm just curious whether Arial Unicode's hangul looks so ugly to me just because I am accustomed to the normative forms and proportions of hangul as a native reader.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/arialdotumcomp_4779.gif"></div><p></p>
      <p>I made a quick sample so people could compare Arial Unicode (above) to Dotum (below), which is representative of the genre Arial Unicode hangul is presumably aspiring to. With its exaggerated elongated consonants and wide proportions, Dotum is itself a really dated design, sort of like early grotesques for Latin sans serifs. But despite its idiosyncrasies, it was clearly designed by someone who knew what he was doing (namely the hugely influential Choe Jeongho).</p>
      <p>I will refrain from pointing out what I think is wrong with this sample of Arial Unicode. I want to hear the opinions of those who don't read Korean. Does the Arial Unicode indeed look worse than Dotum to you? Can you articulate why? I've always been curious about the extent to which people can judge typefaces in writing systems they cannot read.</p>
