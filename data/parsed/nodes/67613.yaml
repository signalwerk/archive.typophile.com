    <p></p><div class="imageWrap"><img src="http://typophile.com/files/forever-onward_4985.png"></div><p></p>
    <p>Hey hey typophiles,</p>
    <p>So this is my story; I'm hopefully moving to Korea in August to become one of those horrible foreign English teachers over there. A big part of the attraction is learning Korean and subsequently how to use the Hangul alphabet, proper like. One of the things I REALLY want to achieve is to have designed a Korean/Hangul Typeface by the time I get back, could be one year, could be never... Lots of time to play with. Plus I think it would be really useful with the process of learning the language and becoming (very) familiar with the letter/word-forms.</p>
    <p>Now obviously the modernist or 'sans serif' style hangul typefaces are on the whole more unattractive than mouldy genitals, unless you get past that thought and begin to appreciate the utalitarian functionality of the language, Arial Unicode is a fine example of just how offensive to the eye hangul gets. Yet the traditional/classical approaches are on the whole really quite pretty in my humble opinion. So i'm thinking somewhere in the middle, something like a western humanist typeface, just hangul characters instead obviously. Above is my first attempt, built out of a small number of shapes (with quite strict layout rules) to refer to the modernist hangul, yet using a lot more of the flair of the classical style hangul. I think it has potential, yet it's a very quick attempt, I'm not happy with where it's going and will probably scrap it and start again properly.</p>
    <p>So long story short, I'm a bit of a fanny. All I really wanted to ask is can anybody point me in the direction of some good english language resources on designing hangul type, or even just some nice examples of Korean typefaces?</p>
    <p>Thanks muchly.</p>
