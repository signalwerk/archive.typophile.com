      <p>Interesting! For now, I'll just say that the joins in the ㅅ, ㅈ, and ㅊ jamo are a matter of stylistic preference, and both Dotum- and Arial-Unicode-style solutions are found in hangul sans serif faces. Some recent faces including Nanum Gothic also mimic the serif faces in making ㅈ look like ㄱ plus a stroke.</p>
      <p>The microserifs of course are also a matter of aesthetic preference. So those differences are not what I had in mind.</p>
      <p>I'll refrain from saying more, because I'd like to hear more comments from non-Koreans about this.</p>
