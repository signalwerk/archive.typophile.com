      <p>Is 영원히 이후 meant to be a translation of "ever onwards"? It is a nonsensical combination in Korean.</p>
      <p>Arial Unicode's hangul is offensive, period. I have stated this repeatedly on these forums. The letters shown in the sample aren't even the worst offenders. Please, please do not think of it as representative of hangul typeface design. I do not know about the provenance of the design, but considering the amount of criticism the design of the non-Latin components of Arial Unicode receives, I would guess that non-native eyes having no feel for the traditional forms and proportions were involved.</p>
      <p>That said, I don't know where your judgement as a non-native comes from, so here I provide a sample of a number of hangul typefaces. Each of these are serviceable hangul typefaces, and some of them even beautiful. I used the same letters as in your sample, nonsensical as they may be. ;)</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/hangulsample_6095.gif"></div><p></p>
      <p>Dotum and Batang are old designs based on the work of Choe Jeongho (1916-1988). Batang seems to be a version of Hanyang Systems' Sinmyeongjo slightly modified for Microsoft.</p>
      <p>Munchebu Batang was designed in the early 1990s with Choe Jeongsun, another hugely influential type designer, as the principal designer.</p>
      <p>Malgun Gothic, Nanum Gothic, and Nanum Myeongjo are contemporary designs and reflect the current trends in Hangul type design.</p>
      <p>I am not quite sure what you mean when you say modernist and classical hangul, but I'll assume you are referring to sans serif and serif forms. The earliest hangul types from the 15th century were sans serif, and the serif forms developed organically as hangul was written with a brush.</p>
      <p>In your attempt, the serifs on the vertical strokes of 원, 히, and 이 are extremely pronounced and incorrectly angled, so much so that they can be mistaken as different letters (허 and 어 in the latter two cases). The proportions are somewhat all over the place. The upper part of 영 has drifted way upperwards, while the ㅎ in 히 seems plopped downwards even in comparison with 이. Hangul doesn't have a baseline, but uses a visual centre line which can be tricky. This visual centre line is slightly above the geometric centre line, and in contemporary designs it tends to be higher. You should also consider the spaces between the strokes (the "whites", except that in your reversed sample they are the "blacks") and harmonize them; the middle gap in 영 is extreme.</p>
      <p>I don't mean to discourage you, but realistically, you shouldn't expect to produce anything more than a funky display face and pray that it is readable. Just look at as many hangul designs as possible (preferably those designed by actual Koreans, not Arial Unicode) and get a feel form the forms, and it should be a good learning experience. I unfortunately don't know of any material in English relating to the design of hangul typefaces, and even the scant material available in Korean tends to be really general ones about optical correction and the like. The best way to learn is by looking at as many successful typefaces as possible, and maybe try out traditional Korean calligraphy to help you understand the classical forms shaped by the brush.</p>
      <p>I also dabble in hangul type design from time to time. Here's a taste of what I'm working on at the moment:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/haneuldaramjwi_4012.gif"></div><p></p>
