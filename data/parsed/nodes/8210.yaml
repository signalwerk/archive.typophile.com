  html: <p>Hello, <br> <br>Apologies if this topic has been answered before.  I was wondering about using fonts in something to be published as a commerical project. <br> <br>From what I've gathered, it's alright to use fonts that came with a piece of legitimate software in derivative works without any further requirements.  Thus, it'd be safe to use a computer which has no internet-downloaded fonts for such projects. <br> <br>Is this correct?  Is there any problem with using a font, breaking the letters into outlines, and adjusting them for a logo or book cover graphic?  What would this mean under the EULA? <br> <br>Thanks.</p>
  html_clean: <p>Hello, <br> <br>Apologies if this topic has been answered before.  I was wondering about using fonts in something to be published as a commerical project. <br> <br>From what I've gathered, it's alright to use fonts that came with a piece of legitimate software in derivative works without any further requirements.  Thus, it'd be safe to use a computer which has no internet-downloaded fonts for such projects. <br> <br>Is this correct?  Is there any problem with using a font, breaking the letters into outlines, and adjusting them for a logo or book cover graphic?  What would this mean under the EULA? <br> <br>Thanks.</p>
comments:
  - id: 147099
    user: 108
    date: 2004-12-17T08:46:00
    date_raw: 17 Dec 2004 — 8:46am
    votes: null
    html: <p>You shouldn't have any problems with the ways in which you wish to use the font software. The stickiest problem most people run into is embedding in PDFs to be re-sold (dowloadable books) or some other form of reselling the font software itself.  <br> <br>You might be interested in a <a href="http://fontlab.wikidev.net/The_Case_for_a_User-Friendly_EULA" target="_blank">chart</a> which was created by Nathan Matteson and myself in regards to comparing a handful of type foundry's EULAs. <br> <br>In general the <a href="http://fontlab.wikidev.net/Main_Page" target="_blank">FontLab Wiki</a> has a lot of interesting information and I would encourage more non-type designers to read it.</p>
