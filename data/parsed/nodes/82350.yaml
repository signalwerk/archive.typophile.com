    html: |-
      <p>Thanks!</p>
      <p>I think I've seen that in use quit a bit throughout the fashion industry. The mention of Ultralight (and now I'm also thinking it's Thin cousin too) might just be another way I'm going to go with my designs for some old skool bling knuckle jewelry.</p>
      <p>My Helvetica knuckle jewelry designs originally I had gem stone fill set inside the letter shapes of 75 Bold or Std Black, but now I'll also do one with gem stones going around Ultralight/Light or even 33Thin letter shapes.</p>
      <p>Helvetica knuckle jewelry coming soonish like.</p>
      <p>Thanks again :)</p>
