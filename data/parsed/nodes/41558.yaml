      <p>I did my first font as an undergraduate thesis project. I still am happy with the overall concept I had, but if I were ever to bring it to market, there would be thousands of extra hours I’d put into it. I’d say I grossly underestimated what was involved in creating a font, and I’d imagine that’s a common realization for most designers.</p>
      <p>Check out <a href="http://www.typeworkshop.com/index.php?id1=type-basics" title="http://www.typeworkshop.com/index.php?id1=type-basics">http://www.typeworkshop.com/index.php?id1=type-basics</a> for some general guidelines</p>
      <p>The best thing to do is open up FontLab and look at how some fonts you love are built. The first thing I realized when doing this is 1) most of the bezier points are at 90 degrees or 180 degrees, and 2) the best fonts are not slaves to the sketch you scan in, nor do they slavishly try to adhere to any geometric or mathematical rules.</p>
