      <p>But as a first font? I’m sure you could have one in the works for two to ten years, but it’s like anything. You need to see tangible results of your effort, and two years stretches the credibility of any first-time endeavor.</p>
      <p>Most of the people I know started out making less-than-perfect fonts because they were made relatively quickly, but they got bitten by the bug and their patience and quality control standards rise with every subsequent typeface. </p>
      <p>I’d say that for myself, I might very well stretch out the bezier perfection stage, because I’m a perfectionist when it comes to that sort of thing. (Of course, that’s exactly what is needed in a type designer, and is precisely the reason why Slimbach will spend a decade on his fonts.)</p>
