      <p>Good question. I’m afraid of even starting, since Thomas Phinney came to my class and scared the bejesus out of everyone by telling them how long Robert Slimbach would work on a font. Ouch.</p>
      <p>So here are my guesses, based on what I would plan on doing, 1-2 hours a day to start:</p>
      <p>There’s obviously the need to know the interface and workings of the design app. Maybe a week or less of fooling around with tutorials?</p>
      <p>Then the design stage on paper or rough digital, with pre-production planning, thumbnails and roughs. Maybe 1-2 weeks? Maybe have the basics of the entire U&amp;lc/numerals within 3?</p>
      <p>Then the outlines begin, and if my Adobe Illustrator classes have taught me anything, good beziers only come with time and experience. For me, I’d say that this would be the bulk of the work. 2-3 months? Any longer than that, and I quit. This is supposed to be my first font, not my last.</p>
      <p>Last, spacing and kerning, which I know should be done roughly during the previous stage, but finalized and perfected here, alongside testing and revising. Maybe a month?</p>
      <p>So, what’s that add up to? I’m willing to invest about 5 months to get a good, solid font that covers all the basics and doesn’t suck. I’m sure I could whip out some autotraced “grunge” font in about a week, but who’d want to?</p>
      <p>Anyone think I’m totally off base with my assumptions?</p>
    html_clean: |-
