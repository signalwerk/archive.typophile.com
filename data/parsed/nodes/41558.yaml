    <p>If you had to guess, how long would you expect it to take for a newbie to design an alphanumeric font, u&amp;lc? Imagine that this hypothetical person is...</p>
    <p>... very good with computers generally, but only moderately experienced in vector drawing and not at all in font design apps<br>
    ... pretty well versed in typographic history and closely familiar with a wide range of existing types</p>
    <p>How many hours/week, for how many weeks or months would you estimate it to take? What other variables might need to be taken into consideration in estimating the person-hours required?</p>
