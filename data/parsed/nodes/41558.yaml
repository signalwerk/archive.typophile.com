      <p>It depends on your level of preparation, your comfort level with the tools at hand, and your goals for the design. If you’re limiting yourself to basic western Latin character sets (union of Windows Latin, MacRoman, Latin-1 and Latin-0 encodings), five months might be a bit long of an estimate, but not unrealistic. </p>
      <p>I turned out my <a class="freelinking-external" href="http://www.1001fonts.com/font_details.html?font_id=2206">first font</a> in about a week, but <a class="freelinking-external" href="http://typophile.com/node/41105">the one I’m working on currently</a> has been in progress off and on for 5 years or more.</p>
