      <p>Simon has it: first fonts aren’t usually fit for release. While you’re learning a process with so many weird variables, don’t work under the expectation of a final product. If you happen to take on something manageable and within your capabilities, it MIGHT end up worth releasing, but that’s not something you can determine until you get halfway into it.   </p>
      <p>Possibly a better question: how long until a good font? </p>
      <p>Since there are thousands of different approaches, and thousands of possible styles, there can be no standard, even if you gave the same challenge/assignment to 100 people of equivalent experience and skill. Some fonts are autotraced (and not necessarily garbage), and some are carefully hand-drawn, one glyph at a time. Revivals, digitized lettering, adapted handwriting, large type systems, roman and italics, etc. etc. are different kinds of design challeng</p>
