    <p>My way to generate an Arabic font.<br>
    1.	I had an Arabic font which included ALL Arabic glyphs from Unicode 4.1 and ready to generate it to produce TTF file to add Volt project.<br>
    2.	I made an encoding file (.enc) which included all of my glyphs.<br>
    3.	Sorted it depending on this .enc. (I arranged them depending on my encoding file.<br>
    4.	Pressed on Codepages<br>
    5.	Generated the font.<br>
    6.	Go to Ms Volt to complete OpenType project.</p>
    <p>My questions are:<br>
    I know that there are 4 ways to do generation in FontLab:<br>
    1. By arranging font depending on Names mode (By pressing on Names mode button then generating)<br>
    2. By arranging font depending on Unicode range (By pressing on Unicode range button then generating).<br>
    3. By arranging font depending on Codepage (By pressing on Codepage button then generating).<br>
    4. By arranging font depending on Index mode (By pressing on Index mode then generating).</p>
    <p>- Could you please tell me the difference between 4 ways and when we use them?<br>
    - Is my way correct or not? (I know  that we can use any of four ways because Volt doesn’t consider the arrangement but looks on font glyphs names themselves, but I would like to know the correct way which was used by the professional typographic designers)<br>
    - What is the best way to produce ttf file?</p>
    <p>Looking for your soon response.</p>
    <p>Thanks.</p>
    <p>Please send a copy of your reply to <a href="mailto:h_afash@yahoo.com">h_afash@yahoo.com</a></p>
