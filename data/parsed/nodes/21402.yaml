    html: |-
      <p>What you desribe are internal representations of the glyph set in FontLab. That is, the names, codepage, Unicode range or index options control how the glyph set is displayed in the FontLab font window. When making a TTF or OTF font, it doesn't matter which view you are in when you export the font.</p>
      <p>In FontLab options, you should check that the setting is <strong>not</strong> to re-order glyphs when outputting the font. In this case, the generated font will have the same glyph order as shown in index mode (which will be the same as in names mode if you have sorted by .enc).</p>
      <p>VOLT works by both glyph names and order. You'll notice, for example, that groups in postioning lookups are listed by glyph order.</p>
      <p>PS. I recommend upgrading to FontLab Studio 5.0</p>
