  html: <p>I have an old novel by Dostoyevsky - The Insulted and Humiliated - printed by Foreign Languages Publishing House, Moscow. No date of publication is given. The impress of the letters is such that they can be felt with one's hand on the page - like braille? - and the type often shows through from the reverse side of the page. Thin vertical bars occasionally appear between characters. It's an otherwise handsome, and dare I say lavish, volume. I'd like to know (a) what typeface this is, and (b) has anyone attempted to simulate these printing effects in a digital medium?</p>
  html_clean: <p>I have an old novel by Dostoyevsky - The Insulted and Humiliated - printed by Foreign Languages Publishing House, Moscow. No date of publication is given. The impress of the letters is such that they can be felt with one's hand on the page - like braille? - and the type often shows through from the reverse side of the page. Thin vertical bars occasionally appear between characters. It's an otherwise handsome, and dare I say lavish, volume. I'd like to know (a) what typeface this is, and (b) has anyone attempted to simulate these printing effects in a digital medium?</p>
