    html: |-
      <p>Yes, Literaturnaya looks to be the one ... I had a feeling Paratype might hold the answer. From their website: </p>
      <p>Designed at NII OGIZ type design bureau circa 1940. Based on Latinskaya of the Berthold foundry (St.-Petersburg, 1901), Cyrillic version of Lateinische of H.Berthold (Berlin, 1899). The digital version was developed at ParaType (ParaGraph) in 1996 by Lyubov Kuznetsova. The favorite text typeface of Soviet typography.</p>
      <p>Thanks for the I.D.</p>
