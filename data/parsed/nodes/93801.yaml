    html: |-
      <p>Wasn't able to identify a match for this gothic condensed woodtype. The closest I've found is <a class="freelinking external" href="http://www.myfonts.com/fonts/redrooster/gothic-rr/bold-condensed/" rel="nofollow">RR Gothic Condensed Bold</a> (or <a class="freelinking external" href="http://www.myfonts.com/fonts/redrooster/railroad-gothic-rr/" rel="nofollow">Railroad Gothic</a>), quite the same insconsistency in letters with a very close /A and /G (spur with oblique bottom left part) but not distressed like your sample. There's also <a class="freelinking external" href="http://www.myfonts.com/fonts/fontfont/ff-kipp/" rel="nofollow">FF Kipp</a>, distressed but the overall design is far less similar.<br>
      More similars, some distressed, some not: <a class="freelinking external" href="http://www.myfonts.com/fonts/aerotype/thunderhouse/" rel="nofollow">Thunderhouse</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/ephemera/toronto-gothic/" rel="nofollow">Toronto Gothic</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/madtype/bulletin/" rel="nofollow">Bulletin</a></p>
