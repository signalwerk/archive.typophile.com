    <p>Just checked out the new trailer for the upcoming Tarantino film "Django Unchained" and loved the font used for some of the titles.</p>
    <p>I've attached an example and you can also see the font at the 1:48-2:00 mark of the trailer here:</p>
    <p><a href="http://www.youtube.com/watch?v=eUdM9vrCbow&amp;feature=youtu.be">http://www.youtube.com/watch?v=eUdM9vrCbow&amp;feature=youtu.be</a></p>
    <p>Any help would be appreciated! </p>
    <p>Thanks.</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/Django.Font_.png" width="1280" height="720" alt="">
