      <p>Wasn't able to identify a match for this gothic condensed woodtype. The closest I've found is <a href="http://www.myfonts.com/fonts/redrooster/gothic-rr/bold-condensed/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">RR Gothic Condensed Bold</a> (or <a href="http://www.myfonts.com/fonts/redrooster/railroad-gothic-rr/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Railroad Gothic</a>), quite the same insconsistency in letters with a very close /A and /G (spur with oblique bottom left part) but not distressed like your sample. There's also <a href="http://www.myfonts.com/fonts/fontfont/ff-kipp/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">FF Kipp</a>, distressed but the overall design is far less similar.<br>
      More similars, some distressed, some not: <a href="http://www.myfonts.com/fonts/aerotype/thunderhouse/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Thunderhouse</a>, <a href="http://www.myfonts.com/fonts/ephemera/toronto-gothic/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Toronto Gothic</a>, <a href="http://www.myfonts.com/fonts/madtype/bulletin/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Bulletin</a></p>
