    <p>I've spent a good deal of time on this site over the past few months, focused mostly on helping people identify typefaces on the Font ID forum and on broadening my own knowledge of the current type landscape.</p>
    <p>While I understand that non-designers may wrongfully assume that logotypes are born, fully-formed, from a typeface, I seem to be encountering a growing number design students and young designers who assume the same.</p>
    <p>I did not go to art school, and I've only guest-lectured to design students a handful of times over the past twenty-five years. So my question to those of you who do interact with students more often—either as full-time faculty or as frequent guest lecturers—is this:</p>
    <p>Do you think that today's design students are being taught to actually create, or has the explosion and abundance of online resources resulted in a climate where they simply find a "cool" typeface and use it literally or virtually unaltered?</p>
    <p>Your thoughts would be appreciated....</p>
