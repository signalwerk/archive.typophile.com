      <p>Agree with Nick's comment. </p>
      <p>Before desktop publishing most design school taught how to draw fonts, which you needed at least for mockup purposes. Less emphasis on it these days.</p>
      <p>I think there's more emphasis on the graphic symbol. Clients sometimes view a purely typographic logo as a lazy solution —&nbsp;"I'm paying you $$$ for 10 minutes work to set the name in a font?". Of course a typographic solution is perfect in many situations, but it can be a hard sell to less sophisticated clients.</p>
