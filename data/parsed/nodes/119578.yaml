      <p>Nick, thanks for your response.</p>
      <p>I'm trained as a painter and printmaker, so I've always drawn and hand-lettered. Add to that the fact that desktop computers really didn't begin to take over design until I was halfway through college, and you've got someone who straddles the divide between analog and digital.</p>
      <p>If you start with the computer and are never encouraged to use any other tools, I think it limits your creativity.</p>
