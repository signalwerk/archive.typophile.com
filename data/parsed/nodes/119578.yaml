      <p>I gave a talk to some 3rd year graphic design students about type and logo design. They had virtually no knowledge about anything type-related, and I wondered to myself what exactly it was they were learning, as type is the cornerstone of graphic design. After the talk I set them an exercise to draw a word to see what sort of designs they could produce. The results were truly appalling: not one of them showed even the slightest competence in handling a pencil, looking like it was the first time they'd ever used one. A group of ten year olds could have done better. I showed them some of my stuff,<br>
      <a href="http://www.g-type.com/portfolio" title="http://www.g-type.com/portfolio">http://www.g-type.com/portfolio</a><br>
      And they were asking what fonts I'd used, or what the designs were based upon. They couldn't really grasp that I was capable of creating designs from scratch. I was shocked by the experience, and saddened to think that none of them have any chance of getting a job when they leave.</p>
