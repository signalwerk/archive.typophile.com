      <p>In my experience teaching, students do cover typography as a basic, but it is early on in their course, and there is so much other stuff—web, interactive, animation, etc.—that it doesn’t hold the position it once did.</p>
      <p>Also, the nature of typography has changed.<br>
      It used to be about choosing a typeface and how it is spaced, but that is not so important in dynamic-content media that doesn’t “set” type, and in applications that involve timelines.</p>
