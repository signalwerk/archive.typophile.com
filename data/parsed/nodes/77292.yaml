      <p>Use TheMix (part of Thesis) for both heads and text.</p>
      <p>At display size, the subtlety of its drawing and sharp and tasty curves will complement your work, while at text size the open, office-y tone of the lower case is suitably spacious. </p>
      <p>It also has a dual personality, like your main building.</p>
