      <p>Axis is doing great work on balancing aesthetic and functional needs for CJK-Latin typesetting. See their TP Mincho: <a href="http://www.typeproject.com/font/tpmincho/en/" title="http://www.typeproject.com/font/tpmincho/en/">http://www.typeproject.com/font/tpmincho/en/</a></p>
      <p>Yes, I admit that lowest threshold point sizes for CJK and Latin are not the same. Yet while (I assume) most people would agree that we should keep text legible before making it beautiful. While TP Mincho’s “a wide range of contrast levels” could be easily seen as pure PR done to sell an ordinary idea of “a wide range of interpolation,” it has at least provided a possible way to make things beautiful (having a higher contrast ratio for Latin, overshooting all the Japanese characters, reducing unnecessary strokes, not adhering to a strict Latin tradition, &amp;c.)</p>
