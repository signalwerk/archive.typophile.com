    html: |-
      <p>I think it’s the other way around: Chinese text should be smaller than Latin text, especially when in print using traditional serif faces. This is because CJK ideographs’ essential visual area fills the entire em block (when we CJK people read, we read the whole thing – basically the contour or the mock shape), while Latin’s essential visual area is concentrated around the x-height. Another reason (Mr. David Berlow says,) is that same amount of Latin text has a lower grayness density than CJK text, similarly because CJK text fills the whole em block. </p>
      <p>This means that when you have, say, a Mincho cross-typeset with a Garalde or a Venetian, the Mincho always looks bigger and should be compensated by a smaller point size. But again it’s dependent on what typefaces you choose to combine. Those with a higher x-height may need less compensation.</p>
      <p>The best solution is to make one truly harmonious typeface so that when one language is set at a certain size, the other language is already adjusted. The existing CJK ones are mostly mere combinations of two typefaces without changing them (i.e. a Mincho adhered to a Caslon, or a Gothic adhered to a Frutiger). Then the question comes: what kind of guidance should we follow, if “CJK size equals Latin’s x-height” is too crude?</p>
