    html: |-
      <p>@Grub Street:<br>
      That's an interesting perspective. It is true that the x-height of Latin represents the part of the character that is always present, and so in some sense it is comparable to the full height of a Chinese character.</p>
      <p>But one only has to distinguish between 52 glyphs in the Latin alphabet - and so there's a lot less detail and information in a letter than in a character.</p>
      <p>So, while I might agree that in a combined setting, for visual harmony, one might have Chinese characters at the height of, say, small capitals, if they were fully legible at that height, the fact that independently Latin text tends to be legible even at 8 points (in a typeface designed for good legibility) while CJK text needs at least 12 doesn't change either.</p>
      <p>So the needs of legibility and those of esthetics seem to be in direct opposition here.</p>
      <p>@jasonc:<br>
      If one is designing a Chinese font, presumably it's going to be used primarily to print Chinese text. The Latin characters should be at a size that will not cause disruption to that text when an occasional name or phrase in a Latin-alphabet language is interposed. At least that's the goal existing practice is aimed at, and it seems reasonable to me.</p>
      <p>English-language books about the Chinese language will sometimes happily disfigure a paragraph set in 10-point type with Chinese characters at 24 points or thereabouts; that's because a maximum level of legibility for readers with little if any familiarity with Chinese is their goal. That is an extreme of typographic practice for a particular situation, and is not the optimum for regular work either.</p>
