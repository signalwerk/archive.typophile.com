      <p>Hi Satori,</p>
      <p>nice font! I think the {m} could be a bit narrower, it's very light at the moment.</p>
      <p>I know your problem; Glyphs is by far my favorite font editor, but it has some shortcomings in path-expansion functionality. I've gone as far as exporting my open-path font from Glyphs to FontForge, manually re-opening all the paths, using the Expand Stroke function, and exporting the shapes back to Glyphs.</p>
