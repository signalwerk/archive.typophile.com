    html: |-
      <p>Hello Satori<br>
      I am truly sorry that it took me so long to get back at your thread. I never used glyphs before, but i have seen a picture of how to make font-weights in typography class so i was looking all over the internet to find that same picture. No luck. – then i decided to make one of my own. Basically i wanted to point out how you can create several thicknesses without braking the capital height or the baseline or having the x-height jumping around too much.</p>
      <p>i hope that helps (to me it was a great help to see how other people solved that problem):</p>
      <p><a href="http://typophile.com/files/Weights_of_Interstate_5204.png" target="_blank" rel="nofollow"><img width="300" src="http://typophile.com/files/Weights_of_Interstate_5204.png" alt="font-weights"></a></p>
