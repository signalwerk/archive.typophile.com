      <p>Hello,</p>
      <p><code><br>
      glyph = fl.glyph.mask<br>
      glyph.Shift(Point(-1000,0))<br>
      fl.glyph.mask = glyph<br>
      fl.UpdateGlyph(fl.iglyph)<br>
      </code></p>
      <p>Best<br>
      Eigi</p>
