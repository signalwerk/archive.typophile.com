    <h2><a href="/node/36815" title="ATypI 2007 Brighton | Typophile Tribe Gathering">ATypI 2007 Brighton | Typophile Tribe Gathering</a></h2>   <p>As I announced in the <a href="http://typophile.com/node/36064">“OK. TypeCon’s over for now. Who’s going to ATypI?”</a> thread, I (we?) will be organizing a Typophile Meet’n’Greet in Brighton. This as a reaction to the recurring complaints after every conference that fellow Typophiles didn’t get the chance to meet, often because they even didn’t know they were there.</p>
    <p>I propose that the gathering takes place on Friday night after the ATypI Auction which starts at 18h45.  I don’t know yet where we’ll have it, especially since I haven’t got a clue how many will want to join us. Maybe it would be an idea to have some registration. What does everyone think?</p>
