    <p>Hi all,</p>
    <p>I’m to write a script to use with RoboFab that will work like the fontlab function “Copy to composites” from the preview window when a glyph is used in other composites.</p>
    <p></p><div class="imageWrap"><img src="/web/20081007163918im_/http://www.typophile.com/files/Picture-1_3595.gif"></div><p></p>
    <p>This fiunction works fine but I was trying to produce something that would update all the metrics in composites in on go without having to go through each glyph.</p>
    <p>I thought something like this might work,<br>
    <code><br>
    #---------------------------<br>
    #UPDATE COMPONENT METRICS<br>
    #---------------------------<br>
    from robofab.world import CurrentFont<br>
    f = CurrentFont()</code></p><code>
    <p>f['Itilde'].leftMargin = f['I'].leftMargin<br>
    f['Imacron'].leftMargin = f['I'].leftMargin<br>
    f['Ibreve'].leftMargin = f['I'].leftMargin<br>
    f['Iacute'].leftMargin = f['I'].leftMargin<br>
    f['Icircumflex'].leftMargin = f['I'].leftMargin<br>
    f['Idieresis'].leftMargin = f['I'].leftMargin<br>
    f['Igrave'].leftMargin = f['I'].leftMargin<br>
    f['Idotaccent'].leftMargin = f['I'].leftMargin<br>
    f['Itilde'].rightMargin = f['I'].rightMargin<br>
    f['Imacron'].rightMargin = f['I'].rightMargin<br>
    f['Ibreve'].rightMargin = f['I'].rightMargin<br>
    f['Iacute'].rightMargin = f['I'].rightMargin<br>
    f['Icircumflex'].rightMargin = f['I'].rightMargin<br>
    f['Idieresis'].rightMargin = f['I'].rightMargin<br>
    f['Igrave'].rightMargin = f['I'].rightMargin<br>
    f['Idotaccent'].rightMargin = f['I'].rightMargin</p>
    <p>f.update()</p>
    </code><p><code></code></p>
    <p>This produces sidebearings including the added accents in the case of the Itilde, Imacron etc. </p>
