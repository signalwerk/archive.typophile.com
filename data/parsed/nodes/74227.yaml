    html: |-
      <p>I'm not keen on the hummingbird, but if you use it I think it should be stylised in the same way as the flower u. However, and this might just be because I'm a gardener, but the flower looks like a tulip. Not something likely to be visited by a hummingbird.</p>
      <p>A problem I have with the hummingbird and flower idea is that it is taking the "nectar" part of the name too literally. This is a juice company. Nectar and juice are not the same thing although nectar is a well known metaphor for a sweet drink. Hence Nantucket Nectars, nectar of the gods, etc. Unless this company happens to be using flower nectars I'd try a direction that says juice &amp; fruit rather than flowers and pollinators.</p>
