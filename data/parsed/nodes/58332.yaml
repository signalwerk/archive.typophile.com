     <br>
    .<p></p>
    <p>I realize its just text and it doesn't necessarily convey "basketball".<br>
    If I can think of a clever way to incorporate something basketbally<br>
    I will, otherwise It's not that important</p>
    <p>(As noted in my previous thread, the font here started as <a class="freelinking external" href="http://www.veer.com/products/typedetail.aspx?image=UMT0000133" rel="nofollow">Fuel</a>.<br>
    I'm in love with the idiosyncratic letter forms.)</p>
