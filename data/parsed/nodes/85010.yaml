    <p>I'm looking for the typeface that's used for the taschen logo<br>
    It's sans serif but it has slight human touch to it the horizontal lines are slightly thinner then the vertical lines<br>
    but it's nice and subtle. It could be customised, but maybe someone can help me out.<br>
    Thanks in advance.</p>
    <p>RJ</p>
