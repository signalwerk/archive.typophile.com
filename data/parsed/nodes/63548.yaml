  html: |-
    <p>Like  Greater Albion, kernest.com has an ambition to restore visual character and astetic design principles to the world.  Kernest.com offers a range of fonts for live on-line use on your web pages, offering the chance to go beyond ubiqitous standbies such as Arial, Times and Verdana.</p>
    <p>Greater Albion has taken the step into Web Typography through a partnership with kernest.com.  We have made a range of our typefaces available for live web use through kernest’s service at an annual subscription of $9.  You can view our page on Kernest <a class="freelinking external" href="http://greater-albion-typefounders.kernest.com/fonts " rel="nofollow"> here</a>.</p>
    <p>Intiall we've made twelve faces available.  More will follow later:</p>
    <p>- Absinette<br>
    - Bamberforth<br>
    - Bonning<br>
    - Bonningtom<br>
    - Braxia<br>
    - Bromwich<br>
    - Cherritt<br>
    - Chipping<br>
    - Clementhorpe<br>
    - Paveline<br>
    - Sabio<br>
    - Vertrina</p>
