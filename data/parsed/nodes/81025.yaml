      <p>I imagine you'll find unlimited examples both supporting and refuting your claims, which is a sign that your claims are too broadly stated.</p>
      <p>It would be more educational to advance a thesis about where, in a particular design discipline, the line between appropriate and inappropriate copying should be drawn.</p>
      <p>Also, the issue of copying (as an activity) is distinct from copyright (as a legal construct) —&nbsp;be wary of merging them.</p>
