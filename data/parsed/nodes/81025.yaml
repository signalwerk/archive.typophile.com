    <p>I have read several forum posts on the subject of copying, all generally focusing on the negative aspects of it. But isn't learning through copying of great value? Isn't the appropriation of old design to create new an important part of cultural evolution? Surely it's how the understanding gained from copying is then used that issues of copyright can arise.</p>
    <p>I have been invited to run a workshop at my old university and want to base it on the use of copying as a learning tool. Can anyone suggest examples of appropriation being effectively used? Or any further reading on the positive aspects of copying? </p>
    <p>I have so far read <a href="http://typophile.com/node/33080" title="http://typophile.com/node/33080">http://typophile.com/node/33080</a> and <a href="http://typophile.com/node/28536" title="http://typophile.com/node/28536">http://typophile.com/node/28536</a></p>
