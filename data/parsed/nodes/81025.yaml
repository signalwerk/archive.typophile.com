      <p><em>Isn't the appropriation of old design to create new an important part of cultural evolution?</em></p>
      <p>Your choice of the term "appropriation" is telling, because it's more likely to be used to describe activities such as plagiarism or outright theft. "Re-purposing" or "reviving" might be better choices, because this is what font revivalists do; we do not "appropriate" old designs. We lovingly re-craft them to new media, and almost universally pay homage to the original creators. The process is not so much cultural evolution as it is cultural archaeology:  re-introducing historical  cultural trends into the mainstream, in order to enrich our typographic vocabulary.</p>
    html_clean: |-
