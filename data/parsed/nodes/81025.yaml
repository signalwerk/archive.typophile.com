      <p>Thanks very much for all your comments. The workshop is a lot clearer in my mind now. </p>
      <p>'Reverse engineering' seems far more appropriate a term than 'copying'. I by no means want to encourage copy-culture - I just want to instill some basic principles and get students thinking about the structure behind design. Reverse engineering is something I have found very useful to further my knowledge - I don't think it is always the case of 'monkey see, monkey do'. I also feel it's something that - when used as learning tool and not as template - should be viewed in a positive light and not considered taboo. Having graduated from the same course several years ago I am very aware that some people completed the course without learning hardly any basic principles. It's a great course for encouraging creative thought but I think it could really benefit by being underpinned with a slightly old fashioned exercise.</p>
