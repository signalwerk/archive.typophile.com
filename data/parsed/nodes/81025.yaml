      <p>First, the students need to be informed of the ramifications of <a href="http://infolit.library.dal.ca/tutorials/AcademicIntegrity/" rel="nofollow"><strong>plagiarism</strong></a> (and copyright as I read what has been posted in the time it took me to compose this).</p>
      <p>I was once given an assignment to design a piece emulating the style of a specific designer of our choice. When presenting our work to the studio, we were required to give a brief biography of the designer and examples of their work to back up our solution. In doing so we learned some history, cultural context, politics &amp;c. as well as search and presentation skills. All important aspects of the assignment. A simple “change the font” solution would obviously not deserve a mark. Think <a href="http://www.blanka.co.uk/supersize?product=821" rel="nofollow">Müller-Brockmann’s Der Film</a> set in Garamond. Keep in mind this was only a single project in a four year program. Anyone who continued to practice this way would simply be removed from the program, or fail due to their own ineptitude.</p>
      <p>As long as the class/project is framed in such a way as “this is an exercise in developing search skills, learning about the history of design(ers), the cultural context that influenced their work, the history of design and presentation skills” I think you’re OK. But churning out a group of students who simply scour fffound is doing them a disservice.</p>
      <p>I often use the analogy of MDs taking advantage of constantly updated drug databases that contain information about the medicines side effects and their interactions in an effort to remove human error but if all they did was base their decisions upon previous research the practice of medicine would not advance due to a lack of original thought. I dub this dilemma as “search versus solve.”</p>
      <p>Ultimately, I believe teaching students how to think for themselves is a no-brainer (pun intended).</p>
