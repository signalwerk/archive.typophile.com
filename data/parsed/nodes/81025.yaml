      <p>Thank you very much for your comments, they've been of great help. </p>
      <p>Starting from the top and working down:</p>
      <p>Matthew<br>
      The focus of the workshop will be editorial design. I agree it's important to distinguish the issue of copying from copyright - perhaps half the workshop will be on copying, half on copyright.</p>
      <p>Thomas<br>
      I mean copying to mean very much your first example - to digitise an existing font from print samples - although in my instance it will more likely be to digitise a layout.</p>
      <p>There's nothing educational in downloading font files from a server.</p>
      <p>Nick<br>
      Thank you for bring my attention to my choice of terms. 'Appropriation' is not the right word for the message I wish to convey - 'reinterpreting' is perhaps closer. This extract from Susan Blackmore's book feels relevant to my thoughts: </p>
      <p><cite>“The advent of imitation was, I suggest, the turning point in hominid evolution... All evolutionary processes depend on an accurate copying mechanism, and that mechanism tends to evolve towards higher and higher fidelity. Imitation may not have started as very accurate at all, but it was still the essential copying process without which cultural evolution could never have taken off. Only once human imitation was sufficiently accurate (and we do not yet know exactly how accurate that is) could memetic evolution begin. Once it began, increasing creativity was inevitable.</cite></p>
      <p><cite>Blackmore, Susan ‘Memes minds and imagination’ In Imaginative Minds (Proceedings of the British Academy 2008) Ed by Ilona Roth. Oxford University Press</cite></p>
      <p>Christopher (and Frank)<br>
      I think we're running along the same lines! The exercise is not about cutting and pasting; it will be about deconstructing a piece of work to understand the process involved in creating it. On the whole the course is highly self-directed and free thinking which I feel could benefit from a one-off, old fashioned workshop.</p>
