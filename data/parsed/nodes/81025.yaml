      <p><a href="http://web.byui.edu/LearningAndTeaching/post/2009/06/Watch-One2c-Do-One2c-Teach-One.aspx" rel="nofollow">Watch One, Do One, Teach One</a>.</p>
      <p>Food for though (pun intended): “If you give a man a fish you feed him for a day. If you teach a man to fish you feed him for a lifetime.”</p>
      <p>~ Chinese proverb</p>
      <p>Each year I conduct a small series of lectures, workshops and poster sessions designed to teach undergraduate science students principles of good design to help them design better conference posters. Every year it is obvious when a student has simply used someone from the department’s template and re-populated it with their own content, compared to someone who made an effort to come up with original thought and solutions based upon what they had learned from class. This is even more obvious when you ask them to rationalize and defend their design decisions. Someone upsetting and I certainly see part of this as a personal failure as I am a firm believer in the principle, something my father (a doctor who taught, lectured, supervised &amp;c students for decades) always used to say, “‘tis a poor teacher who does not produce a student who is better then they.”</p>
