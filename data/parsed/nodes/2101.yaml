    html: <p>Vinnie,  <br> <br>Apart from the obvious legal and ethical reasons, why shouldn't Apple jump on the bandwagon? If Peter Lofting were part of the Ban Comic Sans brigade (I don't recall a sticker on the back of his Mini) then producing this font would be a bit two faced, but as you say Apple has been a huge supporter of Comic Sans for many years, so why not do a similar font?  <br> <br>Comic Sans is hugely popular, and is used in mainstream advertising on a large scale. I don't doubt for one second that many of these commercial uses of Comic Sans are generated on the Mac. <br> <br>As for the hinting quality, as I understand it hinting is not a priority for Apple - subpixel antialiasing all the way on screen, and the pros using the font for the next big ad' campaign are used to working with un-hinted fonts. <br> <br>It may not be a case of 'think different' but it's certainly fulfilling a need for Apple's core market - professional graphic designers. <br> <br>Cheers, Si <br> <br></p>
