  - id: 16606
    user: 2651
    date: 2003-11-20T10:42:00
    date_raw: 20 Nov 2003 — 10:42am
    votes: null
    html: "<p>As the founder of the ban comic sans campaign I'm probably as familiar with Comic Sans as just about anyone save Vincent himself. As a self-proclaimed Comic Sans expert, allow me to offer this amateur criticism of the Comic Sans wanna-be, Chalkboard: <br> <br>The poseur font lacks the angular components which offset the vertical stress of the main strokes in the lowercase characters such as m,n, and h. The overall effect of angular vs. square lending Comic Sans much of its spontaneous and \"fun\" quality is missing. Hinting aside, Chalkboard is a second-rate imposter face. <br> <br>Seeing them side by side makes me loathe Comic Sans a little less. <br>As Apple fonts go, this is worse than Sand. <br> <br>-d</p>"
    html_clean: "<p>As the founder of the ban comic sans campaign I'm probably as familiar with Comic Sans as just about anyone save Vincent himself. As a self-proclaimed Comic Sans expert, allow me to offer this amateur criticism of the Comic Sans wanna-be, Chalkboard: <br> <br>The poseur font lacks the angular components which offset the vertical stress of the main strokes in the lowercase characters such as m,n, and h. The overall effect of angular vs. square lending Comic Sans much of its spontaneous and \"fun\" quality is missing. Hinting aside, Chalkboard is a second-rate imposter face. <br> <br>Seeing them side by side makes me loathe Comic Sans a little less. <br>As Apple fonts go, this is worse than Sand. <br> <br>-d</p>"
  - id: 16607
    user: 1316
    date: 2003-11-22T09:53:00
    date_raw: 22 Nov 2003 — 9:53am
    votes: null
    html: "<p>Unethical, but as a lettering fonts for comics I think it should work better than Comic Sans. <br>I understand all the bundle story et al, and I protested against the attack on you Vincent, but I always hated (hear me, Hrant, hated) Comic Sans outside its onscreen usage, so I really need to know: do you *really* like Comic Sans, Vincent? I mean its letters, its forms, not its overall functionality as a system font which is very good. <br>I've broken my head over that so many Times and not found an answer. How you, the designer of my beloved Trebuchet, could have *drawn* the letters of Comic Sans? <br> <br>Please forgive me, I think it's my obsessive care about comics and good lettering (even if today's computer and not hand lettering). <br>Chalkboard: its unethical, it's unhinted, OsX antialiasing sucks (it makes even Georgia look ugly), but people using Comic Sans IN PRINT everywhere (I have just noticed a Hair Salon with their logo set on it, tremble) will hardly notice the difference. <br>And you may hate me for this, but if forced to choose just among two digital fonts in a post-atomic world where you need to do comic book lettering with a computer... <br>I would choose Chalkboard, I fear...</p>"
