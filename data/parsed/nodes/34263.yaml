    html: <p>It's a lovely idea - but I am not loving this execution. I don't think it does justice to either that latin alphabet or the arabic. I am sorry if this sounds harsh. I don't mean it to be. My suggestion is to look at the two traditions for longer and try again when you see them both more deeply.</p>
