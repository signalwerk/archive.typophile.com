    <p>Hello Everyone,</p>
    <p>I have recently created a font for my typography class. This is the first attempt to design a font. Your feedback and critique will be mostly appreciated.</p>
    <p>About the font:</p>
    <p>I named it Reemenesque, which is a hybrid of my name and the word “Arabesque”, an intricate design style that incorporates geometrical, flowery patterns.</p>
    <p>The font is actually a hybrid of the Arabic alphabet and the English alphabet. Which has a very calligraphic style  to it. The weight of the strokes are varied and there are two types of serif-like elements (inspired from Arabic font serifs) which decorate the font. One which is sharp and pointy, usually used on straight stokes. The other is a more decorative which is usually applied to the more curved areas of the font.</p>
