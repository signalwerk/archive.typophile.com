    html: |-
      <p>The idea is great, and some of the features are very promising, but yes this will need a great deal of change to end up "good", especially if your intent is producing a polished headline font, as opposed to an artsy "grunge" font.</p>
      <p>The "X" and the "R" seems like the two glyphs of yours that are most worth looking at for guidance/evolution: the former because it's very close to a workable end-result; the latter because it contains (as it generally does actually) a large number of components that can be used in the font as a whole.</p>
      <p>It seems like you're basing this on the Kufi style - which is a great idea. In that light, the main thing I would recommend is making the whole design much more rigid, much more horizontal. In that way, I can visualize this becoming a quite valuable contribution to type.</p>
      <p>Good luck, and please show us your progress!</p>
      <p>hhp</p>
