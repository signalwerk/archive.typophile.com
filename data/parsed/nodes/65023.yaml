      <p>Wow. Disappointing. With all the 'hullabaloo' about this verdana stuff, I sided with Ikea. Sure, verdana is not a great type for print, but it works, right? Besides, its risky and taboo.. cutting edge! And while it grates some people the wrong way...  "watch the needle!" I said. "This change will help Ikea's bottom line!"</p>
      <p>Now they veer from the game plan.</p>
      <p>I feel betrayed. I think I'll sit on the floor today in protest.</p>
      <p><a href="http://www.evanmade.com" target="_blank" rel="nofollow">evan</a></p>
