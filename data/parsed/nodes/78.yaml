    date: 2003-05-09T11:31:00
    date_raw: 9.May.2003 11.31am
    votes: null
    html: "<p>Language is always a little fuzzy - some words especially. But humans use language because it's useful! The word \"neutral\" for example does mean different things to different people, but certainly more people would agree that Minion is more neutral than Lexicon for example - it's a useful distinction. <br> <br>Although nothing exists in a pure state, to me there are two opposing forces here, based on design intention: on one side we have self-expression, doing it because \"it's cool\" etc., and this is typified by the Emigre school; on the other hand we have the more populist desire to serve <i>other</i> people, more typical of European design. And this is a cultural difference that pervades everything, not just design. <br> <br>As examples I might give Suburban and Fedra-Serif. But sometimes the two poles appear in strange places. Seria for example has a serious Roman but a frivolous Italic. <br> <br>hhp <br></p>"
    html_clean: "<p>Language is always a little fuzzy - some words especially. But humans use language because it's useful! The word \"neutral\" for example does mean different things to different people, but certainly more people would agree that Minion is more neutral than Lexicon for example - it's a useful distinction. <br> <br>Although nothing exists in a pure state, to me there are two opposing forces here, based on design intention: on one side we have self-expression, doing it because \"it's cool\" etc., and this is typified by the Emigre school; on the other hand we have the more populist desire to serve <i>other</i> people, more typical of European design. And this is a cultural difference that pervades everything, not just design. <br> <br>As examples I might give Suburban and Fedra-Serif. But sometimes the two poles appear in strange places. Seria for example has a serious Roman but a frivolous Italic. <br> <br>hhp <br></p>"
