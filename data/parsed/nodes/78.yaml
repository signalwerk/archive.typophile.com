    html: <p>Prensa figured in the redesign of <i>Inc.</i> magazine back in October 2001. Cyrus showed me samples at TypeCon that summer. I don't recall if he said he designed it specifically for them or not. I suspect that the sketches for the design started as a personal exploration, but then <i>Inc.</i> commissioned the completion and licensed exclusivity for the past year and a half. But that's pure speculation on my part. <br> <br>-- Kent. <br></p>
