    html: <p>&gt; there is a "trend" <br> <br>There very much is, yes. And it's broader than just resurrecting Dwiggins's angularity. I call it the "fauve" style, and one of its strongest constituents is the recent -or recently revived- Eastern European school of type design. <br> <br>It seems to be somewhat of a reaction to the clean-cut Dutch style that has dominated the "serious" font scene in the past decade or two (as opposed to the "frivolous" scene coming from NoCal). Some would call it Baroque. But essentially it seems to tap into the less controlled, the warm fuzzy side of shapes. <br> <br>&gt; It's beautiful. <br> <br>Which however is exactly the problem with using it for news - as you can see from that particular (and actual) setting. To me a certain neutral, maybe even austere atmosphere is the main requirement for news setting - especially titling, especially in this Age of War. <br> <br>hhp <br></p>
    html_clean: <p>&gt; there is a "trend" <br> <br>There very much is, yes. And it's broader than just resurrecting Dwiggins's angularity. I call it the "fauve" style, and one of its strongest constituents is the recent -or recently revived- Eastern European school of type design. <br> <br>It seems to be somewhat of a reaction to the clean-cut Dutch style that has dominated the "serious" font scene in the past decade or two (as opposed to the "frivolous" scene coming from NoCal). Some would call it Baroque. But essentially it seems to tap into the less controlled, the warm fuzzy side of shapes. <br> <br>&gt; It's beautiful. <br> <br>Which however is exactly the problem with using it for news - as you can see from that particular (and actual) setting. To me a certain neutral, maybe even austere atmosphere is the main requirement for news setting - especially titling, especially in this Age of War. <br> <br>hhp <br></p>
