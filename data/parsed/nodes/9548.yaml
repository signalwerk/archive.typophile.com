    html: "<p>David, <br>speed difference. Forgot to address that issue. YES! Freehand 11 works in real-time, unlike 10, which had some kind of 7-second delay, like radio. <br> <br>So, yes. And I'm running it on a 500Mhz G4 - yes, I know, it's prehistoric - with 768MB RAM, OS X 10.2.4. <br> <br>Recap: Speed = yes. <br> <br>As for FontLab's drawing tools... I like them. Once you get used to the way that selected nodes and highlighted nodes act differently, and remember that the Control key reveals a million fun commands... <br> <br>Best, <br>c</p>"
