  html: <p>Has anyone yet had a chance to use the new Freehand MX on MacOS X yet? I am finding that Freehand 10 on a 500mhz g3 processor a little slow (despite having a garden shedfull of RAM), sufficiently so to be using FontLab's own outline editing tools instead. Is MX faster?</p>
