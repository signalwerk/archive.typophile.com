    date: 2003-03-07T23:27:00
    votes: null
    html: <p>&gt; [Hi, HD. Actually FreeHand MX and 10 are produced without too much worry about printed production, since Macromedia is worried mostly by the use of FreeHand for web graphics. So, beside the lack of Opentype support, the application is quite solid but still have got quite big problems in dealing with complex documents for print, using various typefaces, and different encodings. This is a thing they probably have no interest in, but along with the lack of driver upgrades for many printers, undermines the use you could have made of Freehand under OsX. And I'm really sorry about that. I was designing simple logos in MX a few days ago and the program quitted unexpectedly some 20-30 times during the morning. Macromedia never provided a bug fix for version 10.0 and this speaks a lot about their policy. Sad.]</p>
