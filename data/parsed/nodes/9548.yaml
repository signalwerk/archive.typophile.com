    html: "<p>FreeHand 10 works best under Os9 (paradoxical, isn't it) and as you both pointed out it's messy under X. <br> <br>FreeHand MX seems to have been pretty rewritten, it's less buggy and works at lightspeed (and I do mean lightspeed). <br>I'm using it under Jaguar (10.2.3) with a double-processor new G4 and 512Mb of RAM. <br> <br>Save often, because it easily quits without notice (maybe a bug fix is on the way). <br> <br>For the extrema points problem you'll need a short trip to Fontographer (you may use it under OsX installing the non-FPU version). <br>Then re-open the face in FontLab. <br>Perhaps FontLab's FontAudit function will underline the need of extrema points but you'll have to insert them semi-manually (with FontAudit bookmarks, that's all). <br> <br>As for FreeHand: it's my favorite frogram. I started using version 2.02 in 1989 and I can tell you the real solid and good versions (if you need to use an old Mac) are: <br> <br>1) Aldus FreeHand 3.1 <br>2) Macromedia FreeHand 5.5 <br>3) Macromedia FreeHand 8 <br>4) Mcromedia FreeHand MX 11 (bug fixes appreciated). <br> <br>Worst, crappy versions: <br>1) Aldus FreeHand 4 (the Worst!!!) <br>2) Macromedia FreeHand 7 (Sucks Big Time!) <br>3) Macromedia FreeHand 10 (mostly under X) <br>At home I still have FreeHand 5.5 and 8. <br> <br>At work I have all versions upgraded from v3.1 to v10. We'll soon buy MX upgrade as it's available in Italian. <br> <br>BTW many OsX programs have printing problems due to the lack of printers' drivers. Not a lack of the programs, but just to let you know.</p>"
