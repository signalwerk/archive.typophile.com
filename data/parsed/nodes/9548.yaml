    html: "<p>David, <br>FreeHand 10 is, quite frankly, crap. And this is coming from someone who has been using the software for 13-odd years. Back when it was still Aldus FreeHand. I have kept up to date with the software, and use it quite a bit. The 10 version was the furthest step back I have ever seen in a software program. <br> <br>But, joy and gladness, FreeHand 11 is a dream. It does just what it should in ways that are smarter than previous versions of the software. I've been using it extensively in the psat two days for - what else? - drawing letters, so have not had a chace to set type in it, or place any images or anything, but one thing I can tell you is this: Exported Generic EPS files import into FontLab 4.5.2 like a dream come true. <br> <br>So. FreeHand 11 = thumb's up from me. <br> <br>I will be curious to see everyone else's feelings. <br> <br>Best, <br>c</p>"
