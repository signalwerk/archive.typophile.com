    html: <p>Thanks for all your effort, ladies and gentlemen. <br>  <br>I swear I'm not happy to always come up with stuff that has no really easy solution... In fact, I need some advice according this "BAWAG" mystery as it is required to create some new lettering (words completely different from "BAWAG" of course) with a very familiar (if not possible the same) type as is used in the word "BAWAG". <br> <br>What would YOU use?... ;-) <br> <br>Thanks again and have a nice day. <br> <br>Peter Hajdin</p>
