    html: <p>I think Ignacio's candidate from the Jaspert book may not be available in digital form, so my choice of one font that is closest overall would be Berthold's <a href="http://www.philsfonts.com/detail.html?sku=BQ90142003P1" target="_blank"> Bernhard Gothic</a>. That would be the pricey option at $99 for 2 weights. <br> <br>URW also has the font in a variety of weights which you can buy individually. See <a href="http://www.myfonts.com/fonts/urw/bernhard-gothic/urw-t-heavy/charmap.html" target="_blank"> sample at MyFonts.com</a> for $19.95 each weight.</p>
