    html: <p>I hate this sort of answer, but sometimes the best you can do is figure out how you might re-create the sample. In this case, I can't see one font that has all these features, but Metro (Linotype) has the right B &amp; W, Futura has the right G, and BernhardGothic/PL Bernhardt (Agfa) has the right A (in the Medium weight at least). (Bernhard even has the right G). You could also tweak the bar of the Metro A, if you had to. <br> <br>It's an ugly solution, but I think it might work.</p>
