  html: <p>Creativepro, a site with articles I usually like, has posted a pdf of an article from Before and After magazine.  <br> <br><a href="http://www.creativepro.com/story/feature/20870.html" target="_blank">http://www.creativepro.com/story/feature/20870.html</a> <br> <br>I'm surprised by my own reaction. I find the entire article absurd and even a bit offensive. I especially like how they put selecting a typeface" in the same category as "turn on your computer".  <br> <br>I don't think the process described is anywhere near the kind of process logo designers use. What do you think?</p>
  html_clean: <p>Creativepro, a site with articles I usually like, has posted a pdf of an article from Before and After magazine.  <br> <br><a href="http://www.creativepro.com/story/feature/20870.html" target="_blank" class="link-external">http://www.creativepro.com/story/feature/20870.html</a> <br> <br>I'm surprised by my own reaction. I find the entire article absurd and even a bit offensive. I especially like how they put selecting a typeface" in the same category as "turn on your computer".  <br> <br>I don't think the process described is anywhere near the kind of process logo designers use. What do you think?</p>
