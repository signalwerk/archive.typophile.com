    html: "<p>Mark: Indeed not, it looks awful, but the article completely fails to address the reasons why. You could follow the instructions and still come up with the bad logo. <br> <br>Pick a typeface. - Aachen is the first one on the list. <br>Do random stuff with it. - \"Loosely spaced type feels panoramic, like the powerful, horizon-spanning vistas of the movies.\" <br>Choose a \"space\" to put it in. - Yep, there it is, a rectangle with round corners. <br>Choose where in the space it goes. - \"Modern, buoyant, light; type at or near the top suggests growth.\" <br>Align the subhead with something. - Yay, we're done! <br> <br>Sometimes, writing for the novice can mean failing to teach the novice anything.</p>"
