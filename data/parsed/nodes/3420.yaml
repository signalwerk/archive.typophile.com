    html: <p>I have to step in to defend Before &amp; After.  <br> <br>Yes, it's aimed at beginners and generalists (like the marketing person who has to write and lay out the company newsletter, and then update the company web site). But the basic principles it teaches, like the value of contrast, finding points of alignment, etc., are sound.  <br> <br>(You need only look at some of the logo work in Typophile's critique forums to find designers who ought to revisit the basics.) <br> <br>The printed version of B&amp;A is scrupulous about identifying the typefaces used in its examples, lauding their beauty, and generally encouraging sensitivity to type. This is a good thing, in my view. <br> <br></p>
    html_clean: <p>I have to step in to defend Before &amp; After.  <br> <br>Yes, it's aimed at beginners and generalists (like the marketing person who has to write and lay out the company newsletter, and then update the company web site). But the basic principles it teaches, like the value of contrast, finding points of alignment, etc., are sound.  <br> <br>(You need only look at some of the logo work in Typophile's critique forums to find designers who ought to revisit the basics.) <br> <br>The printed version of B&amp;A is scrupulous about identifying the typefaces used in its examples, lauding their beauty, and generally encouraging sensitivity to type. This is a good thing, in my view. <br> <br></p>
