      <p>This is an edited version of <a href="http://en.wikipedia.org/wiki/Fette_Fraktur" rel="nofollow">Fette Fraktur</a>, i.e.  a "heavy" weight version of the Fraktur style of blackletter typefaces. A German punchcutter,  Johann Christian Bauer, designed it in 1850. Digital versions are available from various foundries. Your image differs from the usual version of Fette Fraktur<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/FetteFrakturInUse1_4733.jpg"></div><br>
      mainly in the substitution of a Latinized S, clipping the tails on I and Y, clipping the back-flip on O, and rounding the comb-over effect on the bowl of R.<br>
      I would be interested to learn if anyone knows whether this edit has been released as a font.<br>
      Don<p></p>
