      <p>Check out <a href="http://www.fontshop.com/fontlist/families/tstar/?affid=99346" rel="nofollow">T-Star Mono Round</a>, <a href="http://lineto.com/The+Fonts/Font+Categories/Text+Fonts/Courier+Sans/" rel="nofollow">Courier Sans</a>, <a href="http://lineto.com/The+Fonts/Font+Categories/Typewriter+Fonts/Superstudio/" rel="nofollow">Superstudio</a>, <a href="http://lineto.com/The+Fonts/Font+Categories/Typewriter+Fonts/Regular/" rel="nofollow">Regular</a>, <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_magda_clean_ot/?affid=99346" rel="nofollow">FF Magda</a>.</p>
