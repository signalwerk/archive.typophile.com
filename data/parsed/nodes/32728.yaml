    <p>Hello everyone, I have posted iterations of this design a few times, and I am a bit of a crossroads.</p>
    <p>This is a rounded sans-serif, which there are of course many these days. I'm trying to differentiate it from the others by adding a humanist swelling of the rounded terminals. This also more directly communicates the 'routing' effect that the design is inspired by.</p>
    <p>I'm curious to hear what people think, does it add or detract from the design?</p>
    <p>I don't know that it will make a big difference when printed at 7 pt, but my thought is that it will add to the overall character of the font.</p>
    <p>At the same time, I still like things about the earlier version better. (I haven't spent as much time on the newer one, so some of the characters are a little too dark, other may still need some redrawings)</p>
    <p>Kudos to anyone else who is on here at 9:30 on a Saturday night!</p>
    <p>Jeremy</p>
