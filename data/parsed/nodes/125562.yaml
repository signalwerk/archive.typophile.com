    <p>Hi all. It's good to be back.</p>
    <p>I design and typeset a multilingual literary journal in 20+ languages. We use Skolar for latin, Greek, Cyrillic, and Devanagari. For our other scripts (Hebrew, Arabic, Chinese, Japanese, Bengali), we have survived thus far on a mix of various free fonts, not all of which are a good match for the Skolar. As funding is starting to come through for new typefaces, I am improving the quality of typesetting one script at a time — and Hebrew is next on my list. I'm looking for a good Hebrew face for running text that has something of Skolar's low contrast and contemporary feel. Below are some of the faces on my current shortlist. While I like some of them quite a lot, I don't think any of them is quite the right match. What else should be on my list?</p>
    <p><a href="http://www.hebrewtypography.com/sample-page/%D7%A8%D7%A5-%D7%A8%D7%92%D7%99%D7%9C/">http://www.hebrewtypography.com/sample-page/%D7%A8%D7%A5-%D7%A8%D7%92%D7...</a><br><a href="https://www.myfonts.com/fonts/masterfont/narkisim/">https://www.myfonts.com/fonts/masterfont/narkisim/</a><br><a href="https://www.myfonts.com/fonts/masterfont/tzoba-mf/">https://www.myfonts.com/fonts/masterfont/tzoba-mf/</a><br><a href="https://www.myfonts.com/fonts/masterfont/yeadim-mf/">https://www.myfonts.com/fonts/masterfont/yeadim-mf/</a><br><a href="https://www.myfonts.com/fonts/masterfont/emuna-mf/">https://www.myfonts.com/fonts/masterfont/emuna-mf/</a><br><a href="https://alefalefalef.co.il/font/synopsis/">https://alefalefalef.co.il/font/synopsis/</a></p>
    <p>Thank you,<br>
    Josh</p>
