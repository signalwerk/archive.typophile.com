      <p>Yes. Linotype had old Ikarus data for the caps of the medium weight, normal width font. I cleaned this up and used it. The rest of the letters that I drew for the Medium were designed to optically match these, so of course they are lighter than the caps themselves. </p>
      <p>The other five fonts in the family were designed this one. So, the Medium cap glyphs are more or less "historic," and everything else is bult to harmonize around them. So I guess we agree! The caps had to maintain their weight. If the non-cap glyphs were any darker, they'd be too happy.</p>
      <p>In an ideal face, designed for legibility, one would start with the lowercase letters, and then draw the capital letters.</p>
