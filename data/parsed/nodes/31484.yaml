      <p>Dan, in that other thread you say that the caps look "right" when they're darker. Concerning this, I have a theory that larger things look aesthetically more appealing when darker. Or lighter, depending on your taste*... The point is they look boring at the "normal" weight, if you know what I mean.</p>
      <p>* Which seems to be the case more often if you're a baby-boomer.</p>
      <p>In the case of Morris Sans I was actually suspecting that the original weight in Bank Gothic determined the weight in the new fonts (but the lc would look too dark if it matched that weight). And maybe it's this familiarity with the original that makes the darker weight look "right".</p>
      <p>hhp</p>
