    <p>Check this out at:</p>
    <p><a href="http://www.typeoff.de/?p=135" title="http://www.typeoff.de/?p=135">http://www.typeoff.de/?p=135</a></p>
    <p>"Morris Sans released</p>
    <p>Morris Sans, two of the weights<br>
    Designed by Dan Reynolds for Linotype GmbH.</p>
    <p>From the Linotype website: Morris Sans™ is a newly revised and extended version of a small geometric family of typefaces originally produced by Morris Fuller Benton in 1930 for ATF. His initial design consisted of an alphabet of squared capital letters with a unique twist that characterized its appearance: corners with rounded exteriors and right-angle interiors. The types were intended for use in the fine print found on business cards, banking or financial forms, and contracts. But over the ensuing decades, this design became a popular element in all sorts of design environments, and several foundries revived the typeface in digital form. Since digital fonts are bicameral, with slots for both upper and lowercase letters, new cuts of the type opted filled the lowercase slots with small caps."</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Danno-Morris_6317.png"></div><p></p>
