    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Museums" class="freelinking" rel="nofollow">Museums</a> : The Museum of Printing History</strong></p>
    <p>The Museum of Printing History narrates the story of written communication and the ways in which the technologies of printing have transformed everyones lives. Galleries trace significant developments from ancient Mesopotamian clay tablets, to the Chinese invention of movable type, to Johann Gutenberg's printing press. American history is dramatized through newspaper accounts of major events from the American Revolution to the Civil War; Texas history is told through the life of the state's first printer, with a press he owned and a display of the documents and newspapers he printed. The Hearst Newspaper Gallery demonstrates the emergence of modern printing, and our exhibit of historic newspapers documents pivotal moments in recent history.</p>
    <p>The Museum features artifacts such as:<br>
    Mesopotamian Cylinder Seals<br>
    Ancient Papyrus Fragments<br>
    Asian Movable Type &amp; early Asian Printing<br>
    Illuminated Manuscripts<br>
    1450 Gutenberg Press Replica<br>
    Old Master Etchings &amp; Engravings<br>
    Ben Franklin’s “Pennsylvania Gazette”<br>
    Letterpress &amp; Type Collection<br>
    Antique Bookbinding Equipment</p>
    <p>The Museum features four working galleries with vintage equipment. The crafts of stone lithography, letterpress printing, papermaking, and bookbinding are demonstrated by resident artists.</p>
    <p>The Museum also presents rotating exhibitions highlighting fine art prints, rare books, and artifacts. Educational programs include lectures, and special events.</p>
    <p>Museum of Printing History is located in Houston, Texas.</p>
    <p><a href="http://www.printingmuseum.org" title="www.printingmuseum.org">www.printingmuseum.org</a></p>
