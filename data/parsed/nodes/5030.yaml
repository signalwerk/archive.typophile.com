  html: <p>Good day all - <br> <br>Hopefully someone will be able to help me out with a little problem. I'm wanting to create a bulleted list and keep the indented margin of the text that follow the bullet. I've fiddled a really cak-handed solution using the tab ruler but I'm convinced there must be an easier away. Any help would be just grand ;) </p>
