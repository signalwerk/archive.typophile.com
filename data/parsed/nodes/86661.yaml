    <p>Hello,</p>
    <p>I'm in the middle of a font design project in fontographer and the glyphs were made in illustrator, and now I'm having some problem after I designed 200 glyphs now.</p>
    <p>I've created some ligatures, that I could not find in any places on the internet, like "tt" or "ll" or "Ft" (with capital F).</p>
    <p>Does anyone knows what their unicode is? Or does they even exist?<br>
    If not, then how can I implement them into my font? Is there unicodes, which are empty for this kind of porpose?</p>
    <p>Thanks for the advices!</p>
