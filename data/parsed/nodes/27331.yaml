    html: |-
      <p>Tiff,<br>
      You may be right about the "a", I will try it.</p>
      <p>In terms of the open strokes, I tried them before with more closure and they just look appologetic.  I think a harline weight needs a dominant negative space and the opened glyphs seem to help that for me. See my post above on the i for the i and j as well.</p>
      <p>Regarding the B, I have a real dilemma with the top bowl meeting the bottom bowl.  If the bowls are more equal, there is a hot spot at the join.  I fought more with that spot than anyting else on the font. With a harline, a one unit move is about 10% shift and quite noticable. I am wondering if I should move up to 2000 UPM on this font?</p>
      <p>ChrisL</p>
