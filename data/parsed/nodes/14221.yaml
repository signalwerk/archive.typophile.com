  html: |-
    <p>I am wondering about the font I’ve attached an image of here. Although I’ve looked through my selection of fonts and also scanned the fonts via the Bowfin site, I’ve not identified the name of this one and would love to know about it. I did ask Mike (with Bowfin) but he was unable to ID it and suggested I come here. So, I hand this over to you kind folks for any assistance possible. Wish I had a better image, but hopefully someone will recognize the loop to the “L” along with the dotted and circled “i”</p>
    <p>Thank you in advance — Suzanne</p>
