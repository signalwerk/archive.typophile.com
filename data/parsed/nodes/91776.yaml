  html: |-
    <p>I'd like to start building a simple, solid family, with 3 weights + italics. </p>
    <p>The problem is I 'm usually stuck on my first font — the moment I start adding anchors for diacritics, I decide to rework a letter here or there. And then I have to redo kerning pairs. There's such a heckload of phases that I'm not sure if I'm doing it right.</p>
    <p>I know everyone has their own way of doing things but what's "normal"?<br>
    What order do these phases usually come in your workflow? </p>
    <ol>
    <li>Basic Characters, Numerals</li>
    <li>Punctuation, Symbols, ligatures</li>
    <li>Alternate characters/Opentype features</li>
    <li>Drawing extreme bold weights</li>
    <li>Drawing Italics</li>
    <li>Autogenerating Diacritics</li>
    <li>Kerning pairs</li>
    <li>Hinting (? haven't even attempted yet) </li>
    <li>Interpolation of middle weights</li>
    </ol>
