    html: |-
      <p>The first thing you have to do? Resign yourself to the fact that (good) type design is highly iterative! And it's worth going very slow at the concept stage, making sure things like "n" and "o" are just right.</p>
      <p>That said, when you consider that nothing can be perfect, there comes a point where you don't want to keep going back to change things, and you can start going very fast.</p>
      <p>Kerning: Don't actually do any until your spacing is optimal; optimal spacing however <em>does</em> take into account that kerning is there to help.</p>
      <p>BTW, four weights are more than 4/3 better than three weights.  :-)</p>
      <p>hhp</p>
