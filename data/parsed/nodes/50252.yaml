  html: |-
    <p>I have hit an issue I have never had before with InDesign CS3. I have imported a Word document and am setting it now. The client had set up his own styles in Word which I asked InDesign to ignore. However, I am still hitting this problem; <strong>when I select a list and delete his bullets InDesign places a space at the start of the line</strong>. This in essence means when I apply my bullets style the alignment is off.</p>
    <p>Has anyone any idea? If you need any more info to diagnose let me know. Thanks in advance.</p>
    <p>[edited] I have also just realised that it is doing it when I copy and paste a selection - for instance I was selecting two numbers only, no space before or after, and when pasted InDesign was inserting a space before. It is doing it across all documents and is obviously not document specific.</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/50205" class="topic-previous" title="Go to previous forum topic">‹ What would you classify as 'fun' design particularly in visual communication?</a> <a href="/node/49008" class="topic-next" title="Go to next forum topic">Logotype Critic ›</a></div>
