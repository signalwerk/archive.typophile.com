    <p>Hi,</p>
    <p>First I want to say hello. This is my first post here and I have to admit that I'm actually not at all a pro when it comes to typography, but I have a question where I think input from typophiles would really help me make a design decision.</p>
    <p>I am currently developing an iOS toy app. Now, near the end I've let a couple of friends test it and one of my friends' feedback was that he absolutely hated the font I used for my captions. I was using Cochin-BoldItalic until now and personally liked it, But since his feedback was so harsh I'm now unsure about it. A graphics artist friend of mine suggested using a font without serifs, so now I'm thinking about using HelveticaNeue-Light or its italic version. That's also the font I use for normal text.</p>
    <p>I've attached an image comparing the three fonts in their typical use cases (in game, selection and about screen). Which one would a typophile prefer? Or maybe I should use a completely different font? I'm trying to limit myself to fonts listed on <a href="http://iosfonts.com/" title="http://iosfonts.com/">http://iosfonts.com/</a> because they come built in with the devices (The site is only viewable on a Mac). </p>
    <p>I know that taste is really subjective, but maybe my original choice really was very bad from a typography point of view? (Personally I am now tending towards HelveticaNeue-LightItalic.)</p>
    <p>Thanks for your input,<br>
    Gottfried</p>
