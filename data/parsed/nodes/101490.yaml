      <p>Helvetica works much better in print than on screen IMO.  It has small apertures which can hamper legibility at small sizes unless you're using a very good quality renderer and/or a high resolution screen.</p>
      <p>Out of that list, I dunno... Avenir or Gill Sans might work.</p>
