      <p>Thanks for all the comments.</p>
      <p>@hrant: You're right, I try to make an emotive app. It's hard to describe, I want it to be like a mixture between a toy and a gem. Something to carry around and be soothing. So I try to make it as polished as possible. It should feel like a nice crafted piece of wooden furniture (if you know what I mean). I've got an early teaser trailer here: <a href="http://deltaorange.com/gallery/pocket-nature/" title="http://deltaorange.com/gallery/pocket-nature/">http://deltaorange.com/gallery/pocket-nature/</a>. But I made that after only 2 weeks into development, so now it's a lot more advanced. There are fish in the water and you can summon a unicorn, spawn flowers, etc.</p>
      <p>The goal to have it feel like a nice piece of handicraft is also the reason, why font choice seems so important to me. I am using icons now in app from this guy: <a href="http://adamwhitcroft.com/" title="http://adamwhitcroft.com/">http://adamwhitcroft.com/</a> And his page also made me aware how font choice can make a very simple web design shine.</p>
      <p>@Joshua: Yes, I liked Cochin for exactly those reasons in the beginning, because it felt polished, old fashioned and not as over the top as Zapfino.</p>
      <p>Maybe I should do the same as Adam Whitcroft and do serif-font for the text and sans-serif for the captions? This seems to be a quite common choice. Is the reasoning that serifs make a font more readable?</p>
      <p>Screen resolution is not a problem since the majority of iOS devices is going to be about 300dpi sooner or later.</p>
