      <p>If I understand the attached image with choices correctly, you are asking for a font for a title bar, in which case you should seriously consider not just the aesthetics of the in-app experience, but the overall consistency with native iOS look and feel. Case in point - the light Helvetica in the size that you have in screenshots make the UI look like Metro from the Windows Phone.</p>
      <p>Consistency of the <em>device</em> experience is FAR more important than a fancy-shmancy evocative feel of a half a dozen letters that stick out like a sort thumb, because they are set in exotic ultra-light cursive or what have you. </p>
      <p>In other words - Helvetica, and in a standard iDevice size. Not because glyph shapes are awesome, but because they make your <em>iOS</em> app look better on the <em>iOS</em>.</p>
