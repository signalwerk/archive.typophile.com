      <p>Actually, this one's been put on the shelf for a while... I've been working on a lot of other stuff lately, but I'm unable to post anything since Typophile upgraded (that's what you get for still working with OS 9.1 in this century ;-p ). I'm collecting everything on a USB-stick &amp; as soon as I get the chance I'll post my new things here on Typophile. Maybe by then, I'll have picked up on this one as well. If so, I'll make sure to keep your comments in mind.<br>
      I still need to post some new progress of my work in 2 different threads &amp; I've been busy with quite a big project lately which I'm very pleased with &amp; to which I have gotten great responses from friends &amp; family, so I'm very anxious to hear what you guys think about it. I still need to get some "paperwork" done concearning a copyright issue as well, but that's a whole different thread again. I'm really starting to slack on some projects, but there are just not enough hours in a day for me ;-) And I propably lose interest in things to quickly when they're replaced with new ideas. I have an enormous amount of "half starts" &amp; "sketched ideas" &amp; a lot of them will probably never get executed. Does this sound familiar to anyone?</p>
