      <p>Firstly are you going to admit that you actually own a Keane CD!!</p>
      <p>OK, there was a lot in the UK design press a about a year ago regarding this cover design, so google Creative Review, Grafik magazine maybe? Design was by Big Active. Illustrator Sanna Annukka. </p>
