    <p>I am working on a dingbat font with a lot of details. With the recommended value of 1000 UPM I get really poor results. With a value of 2000 UPM the quality is at least acceptable. Both FontLab and FontQA give me errors because of the differing values.</p>
    <p>So I wonder: What problems could I run into if I use an UPM value of 2000 in an CFF OpenType font?</p>
    <p>Ralf</p>
