      <p>ChrisL: powers of two used to be important for early TrueType rasterizers, back when integer math was considerably faster than floating point. They have never been relevant for Type1 rasterizers. It might still be worth worrying about if you're designing TT outlines for handheld devices, but modern CPU's process floats just as fast, or faster, than integers.</p>
      <p>Incidentally, it's possible to do fractions in Type1 (and OT CFF), so the units per em is not really a hard limit the way it is in TT. FontForge can do fractions (it's turned off by default), and I wouldn't be surprised if other tools could too. A font with 1000 and fractions will have fewer potential compatibility problems than one with a nonstandard em size. Fonts with nonstandard units are valid, but the problems come when you do glyph substitution and replacement across multiple fonts, and when buggy applications get confused by the metrics. But for this application, it doesn't sound like any of these problems are particularly worth worrying about. You need lots of units to represent your detail, so go for it.</p>
