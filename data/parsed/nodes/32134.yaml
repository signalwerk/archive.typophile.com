      <p>As far as we were ever able to determine at Adobe, the "power of 2" thing stems from optimizing scaling operations for Motorola 68000-series CPUs, which could use binary bit-shifting for multiplication.</p>
      <p>We attempted to test this, and were unable to discover any measurable performance differences in rasterization for slight differences in em-square values on Intel or PowerPC hardware, across a variety of sizes.</p>
      <p>But it's still a Microsoft requirement today. It's possible that some tools or environments have dependencies on a 2048 em for TT outlines. It's also possible that some tools or environments have dependencies on a 1000-unit em for Type 1 or CFF outlines.</p>
      <p>For example, InDesign CS1 and earlier assume a 1000-unit em (for Type 1 and CFF) when determining cursor and selection size, which can cause a cosmetic problem. One can imagine more serious problems, but I haven't seen any (yet).</p>
      <p>Regards,</p>
      <p>T</p>
