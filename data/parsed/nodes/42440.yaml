    <p>Hi, I'm looking to see if anybody knows this font:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/badideascan_3720.png"></div><p></p>
    <p>It's used as an article header (see bottom 'does it come in black') and as quote highlights (see top 'we do an x-factor...')</p>
    <p>I can't be sure if they are exactly the same font as the quote example uppercase letters seem to have more ornate stems/tails etc than that of the article example which is a continuous trend throughout the magazine.</p>
    <p>Any help, even if it similar fonts, or fonts this may be based upon greatly appreciated.</p>
