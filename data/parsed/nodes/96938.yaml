      <p>Well, the Bembo EULA makes no mention of end products, only the software, and it is hard to imagine they intend to say that a document one prints with that font can only be read within the company. For further certainty,  you could buy Bembo from Adobe. They say:<br>
      "14.7.1 You may use the font software with the Software on Computers as described in Section 2 and output the font software to any output device(s) connected to such Computer(s)." They certainly place no restrictions on how you use the printed product.</p>
      <p>Red Rooster, however, states:<br>
      "A Special Font License is also required for...commercial merchandising and goods for sale, (such as clothing apparel and accessories), physical goods, unique branding situations, and any and all other unique or new applications or future technologies."</p>
      <p>Given that Red Rooster asked about revenue from your client, I think it's safe to say they intend their EULA to be restrictive.</p>
