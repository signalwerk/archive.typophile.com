      <p>«Internal Business Use» means, as far as I know, that you don’t provide access to the fonts to any other party. If you design a product label and deliver the printed labels to your client, the fonts themselves are only used internally by you, so you should be OK with this licence.</p>
      <p>I think with the Red Rooster licence you would also be in the clear because it permits «Examples of non-commercial, not-for-profit permitted usage include PDF documents supplied to Service Bureaus, printers» which would be what you do.</p>
