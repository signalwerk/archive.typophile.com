    <p>Hello,</p>
    <p>I am relatively new to working with fonts and licenses, and have come here in the hope somebody can clear things up for me.</p>
    <p>I work as a freelance illustrator, and have been asked to design some labels for a small cosmetic company - which includes sourcing fonts, something I have not done before. I have found 2 fonts my client wishes to use on the the labels of their products. I have read through the EULA's of both fonts, which for your info are:</p>
    <p><a href="http://www.myfonts.com/fonts/adobe/bembo/buy.html" title="http://www.myfonts.com/fonts/adobe/bembo/buy.html">http://www.myfonts.com/fonts/adobe/bembo/buy.html</a></p>
    <p><a href="http://www.myfonts.com/fonts/redrooster/packard-new-style/buy.html" title="http://www.myfonts.com/fonts/redrooster/packard-new-style/buy.html">http://www.myfonts.com/fonts/redrooster/packard-new-style/buy.html</a></p>
    <p>I have contacted both foundries already. </p>
    <p>Bembo creators are yet to get back to me.</p>
    <p>Packard creators phoned up and quizzed me on what the 3 year projected income of the client I'm designing the label for was - something as a freelance illustrator I am not, and do not want to get involved with. I said I'd get back to them. </p>
    <p>I told a fellow designer friend of mine about this, and they said I'm over thinking things and buying a Standard End User License will be fine when using the fonts on the labels of the clients products.</p>
    <p>However I'm unsure; I have read through both of their EULA's, and I see mentions of commercial goods needing 'Special Font Licenses'. Would this include the fonts being used on the labels of the goods? </p>
    <p>The fonts will be used solely on the product labels, and I am planning on supplying the design in a PDF to the printer, which, as I have read for both fonts, is within the terms of a Standard End User License.</p>
    <p>I'm hoping there is a simple answer to my query, and I am just making it more complicated than it needs to be.</p>
    <p>Thanks in advance for any replies</p>
    <p>Annabel</p>
