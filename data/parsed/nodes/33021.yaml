    date_raw: 20 Apr 2007 — 4:16am
    votes: null
    html: |-
      <p>Just some things that look out of character. I would definitely:<br>
      Round the top left _or_ square the bottom left of the C.<br>
      Give the D a top-left stem (as on B, P, R).<br>
      Remove the upturn from the bottom right of the E.<br>
      Rethink the G completely.</p>
      <p>Beyond that, the general squareness seems harsher on the tall capitals than on the lowercase, but as I flip back and forth between them it occurs to me that we can't really judge how well they go together without seeing them set together.</p>
    html_clean: |-
