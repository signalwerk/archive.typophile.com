    <p>Hello folks, <br>I've looked through the archives and no-one seems to have asked this question yet. I am trying to identify the typeface used by the Glen Street Theatre company here in Sydney, Australia. It is used throughout their website here... <br> <br><a href="http://www.glenstreet.com.au/gst2/index.htm" target="_blank">http://www.glenstreet.com.au/gst2/index.htm</a> <br> <br>Thanks &amp; regards <br>PAUL <br>Some samples as well... <br><img src="http://www.typophile.com/forums/messages/83/26159.gif" alt="GST1"> <br><img src="http://www.typophile.com/forums/messages/83/26160.gif" alt="GST2"> <br><img src="http://www.typophile.com/forums/messages/83/26161.gif" alt="GST3"></p>
