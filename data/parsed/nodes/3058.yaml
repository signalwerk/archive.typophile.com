    date_raw: 10.Feb.2004 4.49pm
    votes: null
    html: <p>OK - I've done it again. This is a specially commissioned typeface and not one that is commercially available. I have just had an email from the designer and it was done especially for the Glen Street Theatre re-branding campaign a couple of years ago. The designer is Mark Gowing <a href="http://www.markgowing.com/" target="_blank">http://www.markgowing.com/</a> Sorry for putting anyone to any trouble. The typeface has no name and may become commercially available in a couple of years.</p>
