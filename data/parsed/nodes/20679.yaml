    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 14.Jun.2006 12.52pm </div>
      <p>—</p>
    <p>    VERLAG: A new sans serif in 30 styles<br>
        <a href="http://www.typography.com/" title="http://www.typography.com/">http://www.typography.com/</a></p>
    <p>    Out of the six typefaces originally designed for the Guggenheim<br>
        Museum comes Verlag, a new sans serif in thirty styles.<br>
        Provided in a range of weights and widths — including those<br>
        hard-to-find compressed italics — Verlag brings a welcome<br>
        eloquence to the can-do sensibility of pre-war Modernism. Three<br>
        widths, each in five weights with matching italics, and now<br>
        available in both PostScript and OpenType.</p>
    <p>Special Offer!</p>
    <p>    Save $100 when you order the complete Verlag range<br>
        of 30 styles!</p>
    <p>Verlag</p>
    <p>    <a href="http://www.typography.com/catalog/verlag" title="http://www.typography.com/catalog/verlag">http://www.typography.com/catalog/verlag</a></p>
    <p>Verlag Condensed</p>
    <p>    <a href="http://www.typography.com/catalog/verlagcondensed" title="http://www.typography.com/catalog/verlagcondensed">http://www.typography.com/catalog/verlagcondensed</a></p>
    <p>Verlag Compressed</p>
    <p>    <a href="http://www.typography.com/catalog/verlagcompressed" title="http://www.typography.com/catalog/verlagcompressed">http://www.typography.com/catalog/verlagcompressed</a></p>
    <p>Language Support</p>
    <p>    The first font to benefit from H&amp;FJ’s Language Research<br>
        Program, OpenType editions of Verlag have support for our new<br>
        Latin-X character set — helping designers reach an additional<br>
        200,000,000 readers worldwide.</p>
    <p>    <a href="http://www.typography.com/language" title="http://www.typography.com/language">http://www.typography.com/language</a></p>
