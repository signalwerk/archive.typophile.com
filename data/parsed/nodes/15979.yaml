      <p>Héctor,</p>
      <p>Many years ago I developed an identity system for one of the city hospitals in Salem, Massachusetts (so old I no longer have a sample). I decided to use a stylized graphic of a flying dove since in the city's official seal there is a dove with olive branch.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Salem_Seal.gif"></div><br>
      Several years after this, I noticed the new logo developed for Dove Soap as well as several other logos using graphics very similar to mine.<br>
      <div class="imageWrap"><img src="http://typophile.com/files/dovesoap.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/dove2.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/dove3.jpg"></div><br>
      My point is this: there are many things, flora or fauna in the real world that have significant symbolic meanings. Birds, dove, hawk, lion, snake, rose, clouds, fire, eyes, hands, and so on. Your use of a flame, torch, fire, etc. is bound to be similar to other identity systems whether you were inspired directly by them or not, and IMHO your treatment of the flame does not come close enough for the two logos to be confused. <p></p>
      <p>Personally, I would stick with the direction on the graphic you are taking. You may only want to consider a variation on the typeface that would be less similar theirs.</p>
