      <p>Hi View, welcome to the forums! : )</p>
      <p>The typeface your after is <a href="http://Chunkfeeder" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Chunkfeeder</a>..?</p>
      <p>The sample you have supllied would have a much smaller pixel ratio and so would slightly blur the characters, and as a result, 'soften' the appearance, as with your sample. Chunkfeeder is a variant of an OCR typeface, a monospaced, used with such HUD's and displays, VHS for example. Chunkfeeder is a versatile family of 6 fonts - 3 different weights, each with an italic.</p>
      <p>Best of luck with your project.<br>
      __<br>
      Rez</p>
