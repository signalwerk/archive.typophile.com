      <p>The VCR menu sample isn't fixed-width either, Mark. Note how each <cite>I</cite> fails to line up, for example.</p>
      <p>Nevertheless, Raster Gothic isn't a close match. Both Screener and Chunkfeeder are much more similar to the VCR menu sample. (And for what it's worth, Screener isn't fixed-width either.)</p>
