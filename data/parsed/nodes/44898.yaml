  html: |-
    <p>Hi all </p>
    <p>This is my first post so thanks in advance. Im designing a promotion for the course I teach on part time ’Interactive Design’ at the University of Lincoln. (We’re promoting a show which is uses obsolete handheld tv’s to showcase student work.) I love this visual for the familiarity and distinct/unique look it can provide- I want to develop the chromakey blue and the aesthetic of this typeface but for the life of me I cant identify it. I think it might be freeware as its so universal for interface design. </p>
    <p>Any ideas would be very welcome</p>
    <p>Take it easy. Cheers </p>
