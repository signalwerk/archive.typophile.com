      <p>Thank you for the input! I just needed to hear that people are working on both platforms and getting the same results. I always thought/knew that this was the case and I needed to hear this. I am telling you I can look at 25 assigments on a crit wall and pick every single project created on a PC because of the type quality.</p>
      <p>I will check MS Word on the PC to see if kerning defaults to on or off. Thanks for this tip. </p>
      <p>I think it is going to be difficult to get to the heart of the problem in my Intro To Type class since people are using any programs they own to fulfill their assignments on the PC. I suspect Word is being commonly used and Excel or Powerpoint are not. I explain that Word is just for creating documents and not for design but I have many MS students who are game designers or web designers that are taking the class to learn about type but are not willing to commit to purchasing Adobe design programs. </p>
      <p>My students do not have access to a computer lab so all work is done off campus on personal computers and is output on all types of printers. I don’t have control over the fonts they use and I cannot require them to purchase fonts or programs like InDesign. </p>
      <p><strong>However,</strong> this semester I am teaching a print design class in which they are required to use InDesign so that will be one common denominator for both platforms. I suspect many students are using MS fonts as they work at MS or they are using fonts that are preloaded with the computer. I will have some identical design projects created using both platforms and that will be interesting to compare, BUT they will still be using their own fonts as I cannot distribute fonts for their use. I understand the equation for success (Adobe and proper quality fonts) but I also need to give them as much as possible to succeed with what they are working with. A compromise, for sure.</p>
      <p>I need to see if Adobe offers any free Open Type fonts for use. This would eliminate the second variable for the Print Design class. Then it will be interesting to see the quality of the projects and the type.</p>
      <p>Thanks -<br>
      irene</p>
