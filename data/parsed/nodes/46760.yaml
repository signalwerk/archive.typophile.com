      <p>It’s hard to know what the issues are without knowing anything other than you saying it is terrible or poor quality. There’s nothing about PCs that creates inherently bad type, particularly when you’re using an Adobe application which (and Tom will correct me if I’m wrong) doesn’t even use the built-in type engine on either the Mac or the PC. Type set in InDesign should look exactly the same regardless of which platform you’re running the program on. The only difference could be the fonts themselves, the skill of the students, or something in the printers or print drivers that causes lower-quality output than you expect (which may be a situation specific to the computer lab setups on your campus — I certainly don’t see any difference in type quality on my laser or inkjet printers between my Mac and PC).</p>
      <p>Maybe you should have students with bad type send you a PDF or the file itself so that you can see what’s happening and correct them.</p>
