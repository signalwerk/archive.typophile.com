    html: <p>If they are using design software (inDesign, Illustrator), it shouldn’t matter what platform they’re on — the kerning should be the same on each platform. If they’re using Microsoft software (on either platform), it’s a crapshoot. Some MS software doesn’t recognize kerning and some has it turned off by default. You can go into the MS help system to see how to turn on kerning (I’d imagine it could be different from one program to the next).</p>
