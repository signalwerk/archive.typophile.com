      <p>It sounds like the bad typesetting is coming from students using MS Word or Publisher or something even worse from Microsoft. I use both Macs and PCs, and with apps like Pagemaker, Quark and InDesign results are identical from Mac and PC.</p>
      <p>There is a way of getting MS Word to space things properly—install Acrobat (not the reader, the full editor proggy) and Acrobat Distlller, then print Word .DOCs with Acrobat as the virtual printer. Results are much better than the same .DOC printed natively.</p>
      <p>j a m e s</p>
