    <p>I teach typography to students that work and output from personal computers at home and at their jobs. My students using a Mac have high quality type output and students using a PC have really poor output. I need some guidance and advice regarding how I might steer students using a PC towards getting better results. I use a Mac since forever and <strong> never </strong> touch a PC.</p>
    <p>Students post work on the critique wall and every single time I can spot who is using a PC. The work has <strong>terrible</strong> letter spacing and word spacing. One specific group of students attend a community college and they are using everything from MS Word to InDesign and everything in between. I have students who work for Microsoft as well as students from design studios so I am assuming they have access to decent fonts. Even pitiful fonts like Arial look even worse when set on the PC. </p>
    <p>What is it about the PC that is producing such poor quality type? The flaws are more evident in the larger point sizes and seem to be more camouflaged in body copy, but close inspection shows the body copy is also really poor quality. Larger point sizes look like individual words instead of cohesive headlines with tension between each word. The letter spacing appears to be picket fenced again with no tension. People are producing balanced and aesthetically pleasing type on the PC, right?</p>
    <p>Are there some settings that can be changed on the PC and/or within each program to help with these issues? Are there default settings that can be turned off or changed in InDesign to help? In MS Word? </p>
    <p>I cannot go through another semester with these students producing such poor type on the PC. Since these students will be using PCs to create work beyond school I feel a responsibility to guide them towards creating visually acceptable type on the PC. I am more than happy to put some time in on a PC to work out these issues so I can direct my students.</p>
    <p>Thanks -<br>
    irene</p>
    <p>(Sorry no avatar/picture for my postings here yet. As soon as I get off deadline...)</p>
