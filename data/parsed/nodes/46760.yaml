      <p>Hey Irene - the quality of a font has nothing to do with the platform. Indesign is - HAS to be - absolutely identical in terms of word/letterspacing on both systems. We’re producing material on both systems and constantly work on Windows and OSX and the design is not affected in the very least. </p>
      <p>MS Word, Powerpoint and such, of course are NOT Designtools and shouldn’t be treated as such. They are office software and pretty good for that - writing a letter, a postdoctoral thesisor maybe doing a bit of calculating in Excel - but they’re absolutely not up to real design work. They can be, anything can be used for design... but they are very very limited and you have to work not with, but against the software. </p>
      <p>But other than that it makes no difference whatsoever. Our studio has been working with Windows for the past 15 years or so - and it doesn’t matter at all. We’re only just now switching back to Apple because it seems that Vista - and Windows 7, which has been teased a short while ago - isn’t doing for us what it’s supposed to and OS X is better suited for our needs. XP, however, was a rather solid operational system.</p>
