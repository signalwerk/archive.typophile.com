      <p>In this intro-to-type class we do almost everything by hand. There are 2 assignments where 1/2 the assignment is done on the computer - The kerning exercise is done by hand and then created on the computer to introduce computer kerning skills. The grid exercise is done by hand and then I bridge with the computer to set a headline and example of the body copy. Given the makeup of these students, I would have a mutiny if computers did not come into the class structure, even in an intro class. These are tech people in a class taught 10 miles from the main Microsoft campus and 2 miles from Expedia. If I can get any of these people to kern their type, improve their visual aesthetics and make educated type choices then I have done my job with this group. If they continue on with me for additional classes then they must use InDesign.</p>
      <p>Believe me, my type and design classes at design schools are much easier than this school. I am just trying to work within the PC world and give them tools and knowledge that work and that produce good typography.</p>
      <p>InkScape and Gimp, I will introduce these. Should be interesting.</p>
