    <p>I was very depressed today to get an email from the Type Directors Club informing me that Martin Solomon had passed away:</p>
    <p><a href="http://www.tdc.org/news/2006solomon.html" rel="nofollow">Martin Solomon</a></p>
    <p>We are very sorry to inform you that Martin Solomon passed away Wednesday, March 7th. He was at home when he suffered a heart attack. Martin was a very dear friend, member of the Type Directors Club as well as a TDC Medal recipient. He will be missed.</p>
    <p>If you would like to attend Martin's service, it will be held this Friday, March 10 at 2:15 p.m.:</p>
    <p>Gutterman's Funeral Home<br>
    175 North Long Beach Road<br>
    Rockville Centre, NY 11570<br>
    T : 516-764-9400</p>
    <p>A Memorial Service is scheduled for Wednesday evening, 10 May 2006 in the FIT Amphitheater.</p>
    <p>I've also wote up <a href="http://williamsburg-nerd.blogspot.com/2006/03/obituary-martin-solomon.html" rel="nofollow">some quick memories on my blog...</a></p>
