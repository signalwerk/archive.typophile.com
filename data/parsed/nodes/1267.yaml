    html: <p>Mike <br> <br>The use of the full stop was the convention for titling up until the end of the nineteenth century.  <br> <br>I don't know when the convention was abandoned entirely (as common practice) or when the first instance of abandonment began. <br> <br>The rationale behind it is fairly commonsensical. Most titling was in sentence form. It may have taken a bit of a conceptual leap to have abondoned the convention. <br> <br>Gerald <br> <br></p>
