    html: "<p>An aside, hopefully related enough: <br> <br>Advertising copywriting and creative direction has been making use of the full stop fairly regularly since the late 1960s. <br> <br>Probably as an outgrowth of interest in the poster as advertising, in ten decades or so, preceeding. <br> <br>The school of thought that supports it looks at a typical marketing environment (even a magazine ad) as a 'billboard', of sorts. Or, as a 'bumper sticker'. <br> <br>In either case, it is incumbent on the writer + art director to communicate rapidly. <br> <br>Some look at the style as the most rapid form available. The period seems to some to add 'immediacy' or 'urgency' to the message. <br> <br>It's quite easy to find oneself in a battle royal with a copywriter who despises periods at the end of incomplete sentences used as headlines or subheads. <br> <br>I actually have always favored the full stop approach, because it does add visual interest and immediacy, when handled properly. <br> <br>I, too, enjoy those very old grave markers. Quite a lot of the work both in the lettering and the surrounding stonework, is breathtaking. <br> <br>Joe <br> <br></p>"
