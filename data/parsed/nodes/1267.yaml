    html: "<p>The current style sheet of the <i><b>Newry Democrat</b></i> imposes full stops at the end of all titles and captions. A friend of mine worked for them for a few years and to this day has a mania for putting full stops all over the place in everything he writes. <br> <br>Their online version doesn't reflect this, though: <br> <br><a href=\"http://www.newrydemocrat.com/\" target=\"_blank\">http://www.newrydemocrat.com/</a> <br> <br>Matha</p>"
