  html: <p>OK - anyone ever see old text - like on a head stone - and there is a full stop/period after single words or fragments? <br> <br>Like "Father." <br> <br>Also, I noticed it on the masthead of the Wall Street Journal. <br> <br>"The Wall Street Journal." <br> <br>Does anyone know why the period was used this way? Was there a logic behind it? Was it just a convention? <br> <br>Am I just imagining things?</p>
