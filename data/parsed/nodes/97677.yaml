    <p>Hey guys,<br>
    I want to know if using too many bezier points is a bad thing. Is there a set number of bezier points that a user should not exceed? Using more beziers obviously gives you more control but i want to know if there are any trade-offs?<br>
    Thanks</p>
  html_clean: |-
    <p>Hey guys,<br>
