      <p>I remember reading that comment. I wonder if he was talking about RoboFont? </p>
      <p>RoboFont TT curve editing works a bit differently than in FontLab. Essentially, when you draw a curve, say by making two end points, it looks kind of like you're working with a PS curve with two separate handles. The difference is that there is a phantom point that lies on the curve at a tangent with a straight line connecting the two off-curve (handle) points. In effect, what looks like a single curve segment with two control points is actually two curve segments with an implied on-curve point in the middle (a "smooth" point, in FontLab terms). </p>
      <p>I don't see any way to work with individual curve segments (two on-curve points at the ends and one off-curve point between them). This seems more restrictive than FontLab's approach, although less confounding if you're used to PS curves. Maybe that's the whole point.</p>
