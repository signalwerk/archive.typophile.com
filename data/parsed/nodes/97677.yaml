      <p>"I want to know if using too many bezier points is a bad thing."</p>
      <p>I think so.</p>
      <p>"Is there a set number of bezier points that a user should not exceed?"</p>
      <p>There are technical per glyph limitations based on the number of flattened segments in the final output, but I hope you don't mean that. Normally, for cubic beziers,  having an oncurve point every 90 degrees of curve is best, with two off curve points in between. There are a lot of shapes that need an additional oncurve point, and these need to be carefully managed. There are few if any that need two oncurves in 90 of curve, so having the right number is pretty easy. </p>
      <p>"Using more beziers obviously gives you more control..."</p>
      <p>Show me.</p>
