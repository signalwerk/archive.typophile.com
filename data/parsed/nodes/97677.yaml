    html: |-
      <p>Actually in a way using more points gives you <em>less</em> control, but of course it allows you to make more complex shapes. Another advantage to fewer points is smaller font files.</p>
      <p>There's no actual number to shoot for of course (except technical maximums, which are however very high) but use as few as you can <em>as long as you're not -visibly- compromising the shape simply to have fewer points</em>. An exception: you need points at extrema and inflection points for technical reasons. Also, once in a blue moon it might make sense to sacrifice the shape:sometimes for point economy, sometimes because there's not enough resolution anyway (especially if you have to stick to an Em of 1000, especially if you're making an Italic).</p>
      <p>Another thing to consider is BCPs: I myself am often tempted to omit a BCP on one side of a curve if the shape looks good enough, but for technical reasons such "half-dead" curves are bad news.</p>
      <p>hhp</p>
