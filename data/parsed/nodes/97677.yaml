      <p>Two things to avoid a "lumpy" conversion from PS to TT:<br>
      - No "half-dead" curves (which makes me sad because half-dead curves: take up less memory; and are easier to manipulate, usually yielding an entirely satisfactory curve, I mean when the dead-side adjacent curve is a line). Just to be clear: these are curves where only one node has a handle. Quick tip: in FontLab Alt-Shift-click on the curve and it will auto-add and balance the handles; except you often have to tweak the result.<br>
      - Have a node at inflection points.* You can tell there should be one when the handles on a curve are on opposite sides. The inflection node doesn't have to be placed perfectly, but: to be sure it really is an inflection node made sure its handles are on opposite sides; and if you get it just right it should not change the shape of the curve at all (grid coarseness notwithstanding).</p>
      <p>* BTW why hasn't this been automated yet? It's pretty plain math.</p>
      <p>hhp</p>
