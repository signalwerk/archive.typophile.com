      <blockquote><p>Does anybody prefer working with TrueType curves?</p></blockquote>
      <p>Ray Larabie favored TT curves at one time (certainly when he wrote <a class="freelinking external" href="http://web.archive.org/web/20031003001526/http://www.larabiefonts.com/tutorial/tutorial1.html" rel="nofollow">this old FontLab tutorial</a>). Using a grid seems to make working with them less of a hassle, since FL doesn't support "smooth" points in TT mode. See also: Karsten Luecke's <a class="freelinking external" href="http://kltf.de/kltf_otproduction.shtml#pyscripts" rel="nofollow">Align TT Nodes script</a>.</p>
      <blockquote><p>should I change all the curves to TrueType before generating a TT font?</p></blockquote>
      <p>Obviously the curves will be converted automatically (otherwise you wouldn't get a TT font), but it can be beneficial to manually convert and change the direction, then possibly optimize the TT outlines. Adam Twardoch's <a class="freelinking external" href="http://docs.google.com/document/preview?id=1llTpJsbt2ENbWvMgkGAa90EVfFnTP3Womha3IEumy24&amp;pli=1#heading=h.75ccd552fead" rel="nofollow">Autohinting Guide</a> has some tips on conversion/optimization which could also be useful for unhinted fonts.</p>
