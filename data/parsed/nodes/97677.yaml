    html: |-
      <p>Well, properly speaking, points are points—that is, one specific location within a predefined grid. PostScript renders letterforms by proceeding in an orderly fashion from point to point, along the path delineated an each point's description. However, since the word “point” has at least two different meanings in typographic parlance, it seems to me that “node” is a better choice of names, because a node is a node, and not also 1/72 (more or less) of an inch.</p>
      <p>And, “handles” is a perfectly functional description of how you wrangle a Bezier curve…</p>
