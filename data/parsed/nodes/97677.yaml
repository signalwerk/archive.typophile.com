      <p>2048 is far preferable, since it’s the TrueType spec. When I’m ready to generate an OTF font, I make a duplicate file and rescale it to 2048. Since the scaling is not an exact multiple of the original, and since FontLab sometimes makes imprudent decisions on where to locate points on the grid ( a nnisance if the font has joining elements of any kind), I recheck the outlines, the metrics and the kerning before generating the TTF version.</p>
