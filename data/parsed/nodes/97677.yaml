      <p>I think there's some confusion here…</p>
      <p>The screen grab that Typogruffer is asking about shows a TrueType bézier curve, which are defined by two on-curve points (at the start and end of the curve) and one off-curve point. The off-curve point is usually depicted in the UI as connected to both the start and end points. Sometimes it may appear that there are more than one off-curve point between two on-curve points. This is because on-curve points may be omitted if they fall on a straight line between two off-curve points in order to save a few bytes of data. In the screen grab, the red circled area contains one of these omitted (implied) on-curve points.</p>
      <p>PostScript bézier curves use two off-curve points, which in the UI are usually depicted as "handles", one connected to the start point and one connected to the end point.</p>
      <p>Extrema points can be located by looking for the minimum and maximum x and y values along a curved path. On a circular path, these would be at the 12, 3, 6, and 9 clock positions. The extrema points are needed in order to define horizontal and vertical stems for hinting.</p>
