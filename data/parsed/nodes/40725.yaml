    <p>I’m working on a newsletter for a band in New Mexico, and we thought it would be interesting to use the <a class="freelinking-external" href="http://www.iginomarini.com/fell.html">Fell types</a> for everything, at the authentic sizes specified by Igino.</p>
    <p>The largest size he has is the De Walpergen Three Line Pica, at 41pts, with a nice range of sizes smaller than that.</p>
    <p>What I would like to find for the nameplate of the “authentic” newsletter is a blackletter that the Oxford University Press would have had from the same era. I had read somewhere that De Walpergen had come from Germany and had cut some blackletter for the press, but it didn’t specify what that might be.</p>
    <p>According to James Moseley’s blog at <a class="freelinking-external" href="http://typefoundry.blogspot.com/2006/01/materials-of-typefounding.html">typefoundry.blogspot.com</a>:<br>
    <cite>the establishment of the press and its typefoundry is due chiefly to John Fell (1625–86), Dean of Christ Church and Bishop of Oxford, for whom matrices were bought in Holland in 1670–72 and who established a resident punchcutter in Oxford (Peter de Walpergen). In addition to Walpergen’s punches and matrices, the earlier materials in the collection include matrices for types by Robert Granjon, Pierre Haultin and (possibly) Claude Garamont.</cite></p>
    <p>So I suppose it is reasonable to assume that they had in their collection a blackletter from any of the above sources, be it from Holland or from Granjon &amp;c. </p>
    <p>Does anyone know of a cut that is available that might fit the description? Also, it might be a bit much to ask, if you know of any “worn” blackletters that might match the Fell types?</p>
    <p>Thanks</p>
