      <p>I’ve been looking through the Steffman stuff. Blackletter, it seems, is what he’s contributed. I suppose there’s not much demand for authentic revivals of blackletter types that died out of common usage a long time ago.</p>
      <p>The English Textura font they have is authentic enough for my purposes, ink spread and all, but not at the right display size.</p>
      <p>I’m being stubborn, but ideally, I’d like to find a blackletter ranging from 50 to 72 pt. Did they even make textura that size? I know they did later, hence the nameplates of newspapers, but would that have been available at the same time as the Fell’s?</p>
