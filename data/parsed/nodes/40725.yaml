      <p>Dan </p>
      <p>The Hoefler Fell were not corrected. They are computer tracings of letterpress printed specimens. Ink spread and all. You might be better off going to</p>
      <p><a href="http://www.moorstation.org/typoasis/typoasis1.htm" title="http://www.moorstation.org/typoasis/typoasis1.htm">http://www.moorstation.org/typoasis/typoasis1.htm</a></p>
      <p>and see what is available from the free font movement folks. Not often the best but sometimes, in regard to historical interests, quite concerned and useful. The foundries aren’t always the answer. They have to make a buck. The free font folks obstensibly do it for love.</p>
      <p>Gerald</p>
