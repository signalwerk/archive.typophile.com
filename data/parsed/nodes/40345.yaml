  html: |-
    <p>Term used by type designers and <a href="/node/13722" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">calligraphers</a> to describe the area where a stroke splits or branches off from a <a href="/node/add/wiki?edit%5Btitle%5D=stem" title="Create node &quot;stem&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">stem</a>. The prime example of branching occurs on the lower case <strong>h</strong>, and in most <a href="/node/16843" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">typeface</a> designs is repeated, often with variation on <strong>n m u</strong>.</p>
    <p><strong>Etymology:</strong> “branching” is most likely borrowed from biology, and is analogous to the split form of branches on the trunk or stem of a&nbsp;plant.</p>
    <p>Some <a href="/node/12023" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">typographers</a> and <a href="/node/15002" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">type designers</a> prefer the term <strong>join</strong> or <strong>joint</strong>.</p>
