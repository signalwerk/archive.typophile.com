  html: |-
    <p>Term used by type designers and <a href="/wiki/calligraphy" class="freelinking" rel="nofollow">calligraphers</a> to describe the area where a stroke splits or branches off from a <a href="/wiki/stem" class="freelinking" rel="nofollow">stem</a>. The prime example of branching occurs on the lower case <strong>h</strong>, and in most <a href="/wiki/typeface" class="freelinking" rel="nofollow">typeface</a> designs is repeated, often with variation on <strong>n m u</strong>.</p>
    <p><strong>Etymology:</strong> "branching" is most likely borrowed from biology, and is analogous to the split form of branches on the trunk or stem of a plant.</p>
    <p>Some <a href="/wiki/typographer" class="freelinking" rel="nofollow">typographers</a> and <a href="/wiki/type%20designer" class="freelinking" rel="nofollow">type designers</a> prefer the term <strong>join</strong> or <strong>joint</strong>.</p>
