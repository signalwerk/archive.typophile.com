    <p>The name Moreske, Maureske, Morisca, Morisco comes from Spanish “Mauritanian”.<br>
    This ornament is based on the greenery motive with strongly stylized stems and leaves fancifully interlacing.<br>
    Such ornaments were widely used in the 16th century in various  decorations from architecture to household goods, and book covers in particular.<br>
    The font contains high quality vector graphics with elaborate attention to details.<br>
    This collection consists of friezes (borders) and closed compositions in the shape of circles, squares, rectangles and triangles that can be organized into repeats (patterns).<br>
    Morseke 2D can be easily used not only in a traditional approach, but also in grunge stylistics enriching your compositions. </p>
