    html: |-
      <p>During the 20th century some of the larger type foundries, typesetters, and printing companies produced typographic style guides, which occasionally addressed the layout of book pages.</p>
      <p>For instance, the 1923 <em>Linotype Manual of Typography</em> shows various types in actual size page layouts.<br>
      So too does <em>Book Types from Clowes</em> (a British printer), 1935.<br>
      And <em>The Western Type Book</em> (Western Printing Services, Bristol, UK [West England]), 1960.</p>
      <p>All these were hard-bound type specimen books of 200+ pages.</p>
      <p>That practice is gone, for economic reasons related to technological change.</p>
      <p>Today, the standard is represented by Robert Bringhurst's <em>The Elements of Typographic Style</em>.</p>
      <p>Positioning his work in a similar manner to that of the style guides for editors (e.g. Strunk and White), Bringhurst covers many aspects of typography, including the page layout of books.</p>
