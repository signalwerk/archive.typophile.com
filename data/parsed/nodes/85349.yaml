    html: |-
      <p>I suspect the quote should be "the suitability of type design to the subject of a book is <strong>no</strong> less important than the nature of <strong>its</strong> text"; and it is true that, for example, the use of William Morris' Golden type - or something very similar, such as Jenson Oldstyle - in a book on higher mathematics would be as jarring as an excessively informal writing style.</p>
      <p>Hobo, Papyrus, President or even Freehand as a text face would, of course, be even worse. And yet, the American Mathematical Society, in commissioning a typeface for the printing of mathematics, ended up with the unconventional AMS Euler, with a calligraphic effect.</p>
      <p>However, egregious errors in the former are even less common than egregious errors in the latter. A typeface such as Palatino, for example, would seem to do well in either a textbook or a novel.</p>
