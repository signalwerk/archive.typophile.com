      <p>Part of the problem is to use faces that were indicative of the decade but have fallen out of style, thereby invoking an era.</p>
      <p>Geoff's suggestions are good for the seventies.<br>
      Though <a href="http://www.itcfonts.com/fonts/detail.aspx?PID=358709" target="new" rel="nofollow">Bottleneck</a> was released in 1972, it is strictly sixties in style.</p>
      <p>For the fifties you can use anyone of several <a href="http://www.myfonts.com/search?advanced=1&amp;params%5Bsearchtype%5D=normal&amp;search%5Btext%5D=frisky&amp;params%5Bboolean%5D=and" target="new" rel="nofollow">Frisky Style</a> typefaces.</p>
