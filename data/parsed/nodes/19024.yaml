      <p>For the 2000s I'd suggest fonts like Foundry Gridnik, Din and its many imitators, basically any of the new grotesks.</p>
      <p>For the 70s in addition to the groovier fonts suggested above, I'd add fonts like <a href="http://www.myfonts.com/fonts/linotype/itc-bauhaus/">Bauhaus</a> or <a href="http://www.myfonts.com/fonts/urw/broadway/">Broadway</a> or <a href="http://www.houseind.com/index.php?page=showfont&amp;id=4&amp;subpage=viewfonts">Chalet</a> (even tho it was created much later).</p>
