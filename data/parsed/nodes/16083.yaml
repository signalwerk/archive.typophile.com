    <p>Hi,<br>
    i'm a journalist and i'm going to work in a french panafrican satyrical magazine. As i'm going to be involved in the editing, i'm wanting to give suggestions about typography. As it is now, it's poor, and hasn't any relation to Africa — times for text, and standart uninteresting fonts for titling.<br>
    So i'm interested about any fonts related to Africa all of you know. By this, i mean two things:<br>
    — fonts by african designers, or people with african roots, even without an "African look"<br>
    — fonts inspired by Africa, with somewhat of an Africa feeling. Here's the African look.</p>
    <p>I have looked on google and not find much interesting things, and on here, which drove me to Building lettres but as for now, the site is empty.</p>
    <p>Thanks for any help.</p>
