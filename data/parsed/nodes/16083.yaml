      <p>&gt; Egyptian</p>
      <p>That style really says nothing about Egypt. And anyway<br>
      Egypt is arguably the least African country in Africa!  :-/</p>
      <p>I might instead look to the fauve, "naturalist" style of<br>
      type coming out of South America the past few years,<br>
      and Eastern Europe the past few decades.</p>
      <p>--</p>
      <p>But really, it will be quite hard to find a typeface that evokes Africa in both a subtle enough way to really work for text, and a strong enough way to actually matter. I have a feeling you need a custom font - second time tonight I'm recommending that!  :-/</p>
      <p>hhp</p>
