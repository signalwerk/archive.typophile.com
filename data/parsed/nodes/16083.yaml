      <p>&gt; the language is french only.</p>
      <p>That gives me an idea. Maybe use a font that conveys what Africa <cite>used</cite> to be about: colonialism. Not anything to celebrate, certainly, but a central part of its reality nonetheless. So I might suggest a face typical of mid-to-late-19th-century France, like a Latine or an Elzevir: those styles can have a nice, bittersweet air of nostalgia for a time when imperialism was motivated by sort of a romantic chauvinism ("we need to force them become like us, for their own good") more than by the mere crass, brutal materialism of today.</p>
      <p>See this:<br>
      <a href="http://typophile.com/node/7596" title="http://typophile.com/node/7596">http://typophile.com/node/7596</a></p>
      <p>hhp</p>
