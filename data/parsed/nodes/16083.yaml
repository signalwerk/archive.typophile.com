      <p>Building Letters, you could try contacting Jim Richardson, who organized it, and used to be a frequent Typophiler. </p>
      <p>I designed the Worldwide typeface in 1999, for the Worldwoman project, which has mainly used it for AfricaWoman. <a href="http://www.africawoman.net" title="http://www.africawoman.net">http://www.africawoman.net</a><br>
      The face is also used by several South African papers, such as the Sowetan, and Sunday Times (both Jo'burg) and Weekend Post (Port Elizabeth).</p>
      <p>So although it's a Century adaptation by someone who's never been to Africa, it has a bit of provenance.</p>
