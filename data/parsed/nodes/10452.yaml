  html: "<p> Type design seems to usually be a solitary venture (I can understand why... :-), but not always, and I wonder how teams of type designers tend to function when working on a single design. Most of the few cases where numerous designers have worked on a single font have been grunge/experimental projects (like that MetaDesign thing - I forget the name now), but I think the scenario where a small (and strongly structured - necessarily?) team works on a text face is most interesting. <br> <br>For obvious reasons, the following would be a great case-study at Typophile: <br> <br>Miller was worked on by Matthew Carter, Tobias Frere-Jones and Cyrus Highsmith. Could we possibly get some insight into the dynamics, like who did what part of the whole task, what logistical issues arose, etc.? I'm betting it could be very educational. <br> <br>hhp </p>"
  html_clean: "<p> Type design seems to usually be a solitary venture (I can understand why... :-), but not always, and I wonder how teams of type designers tend to function when working on a single design. Most of the few cases where numerous designers have worked on a single font have been grunge/experimental projects (like that MetaDesign thing - I forget the name now), but I think the scenario where a small (and strongly structured - necessarily?) team works on a text face is most interesting. <br> <br>For obvious reasons, the following would be a great case-study at Typophile: <br> <br>Miller was worked on by Matthew Carter, Tobias Frere-Jones and Cyrus Highsmith. Could we possibly get some insight into the dynamics, like who did what part of the whole task, what logistical issues arose, etc.? I'm betting it could be very educational. <br> <br>hhp </p>"
