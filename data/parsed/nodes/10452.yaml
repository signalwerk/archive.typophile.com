    html: <p> May I suggest Erik S. as the mentor of the project? If he is still reading at typophile and would be interessted in such a role. He might even have the contacts to promote the final typeface as a gift and inspiration in the typographic "community".  <br> <br>It would be great if the font in progress was online and free for download for every participants. We could each have a password that allowed us to download the latest developments ,and work on the face individually. Then each and everyone could post to a dedicated thread their improvements and ideas. That way we all could contribute as much we can. <br> <br>Maybe a sponsor would be interessted in supporting the typeface? That way the mentor of the project could have a few dedicated hours set of to managing it. <br> <br>Sbo </p>
