    html: "<p> &gt; we haven't been able to turn type design into the same sort of scalable business as, say, website design, but I think that's the nature of the beast. <br> <br>I think in part, yes, type design is not very scalable. But if Rubens could do it with Fine Art, there must be some scalability in something that's  at least as much a Craft as it is Art (I would in fact argue that there's a lot less Art in type design than many might like to imagine - but that's another topic). <br> <br>So in imitation of Rubens maybe the only real way is to have one guy on top, with a bunch of \"apprentices\" pushing beziers, setting kerning, etc., and periodically going back to the head honcho for approval. The end results might not be as sublime as the sole work of the master, but at least it sees the light of day a few times faster. <br> <br>(BTW, coming back to this thread's origin: was that in effect the process with Miller?) <br> <br>hhp </p>"
