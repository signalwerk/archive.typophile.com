    html: "<p>David: <br>I don't see charging any money for this (unless it's for a charity, like maybe: <a href=\"http://www.ifrc.org/\" target=\"_top\">http://www.ifrc.org/</a>) One reason is the nightmare of distributing the proceeds if: <br> <br>BJ: <br>I think splitting it by character could only result in a grunge font. Maybe we should do it by \"task\" instead, like: lc, UC, numerals, spacing, hinting, trapping, etc. We could subdivide each task, for example one person could be in charge of the serifs. <br> <br>I know this makes things more nebulous (for example, you can't *really* split up spacing from glyph design, at least not completely), but with some open-minded cooperation and effective, intelligent structuring and communication it could make the result much more compelling than some freak show. <br> <br>One thing we would all have to agree on before we commit would be overall character of the design. <br> <br>BTW, for the Single Authority I mentioned, I nominate... Jonathan Hoefler!  :-) <br> <br>hhp</p>"
