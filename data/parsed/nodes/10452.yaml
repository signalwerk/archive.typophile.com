    html: "<p> To me, the most interesting thing is trying to create a nice font that's usable for display and short text, with as many people as logistically possible. Here's a rough proposal: <br> <br>1. Appoint an Overall Authority: this person will have final say in everything, without necessarily participating in the design, or even explicitly offering his/her opinion. The three qualities this person must have in abundance are: an understanding of type design; fairness; a willingness to allow -even motivate- people to make something he personally might not like. <br> <br>2. Decide the general nature of the typeface. Is it a grotesque sans, a joined script, a Garalde, what? Once this is decided, some people will want to participate in the design, and others won't. <br> <br>3. Make a list of tasks that a type designer does, with as many subdivisions as we have participants. <br> <br>4. Define the Pert-chart, which is basically the sequential dependence of the various tasks (eg: Kerning comes after Spacing). Also define how the various tasks are related (eg: the rough spacing is done by the person doing [some of] the letterforms, but the final spacing is done afterwards by somebody else; or that the person doing the Kerning has to spend some \"quality time\" with the guy who did the Spacing). <br> <br>5. Assign each sub-task to an individual, make sure everybody's communicating with who he/she needs to communicate with, and manage the project to completion. <br> <br>6. Become filthy rich through record sales never before seen in the font world...  ;-) <br> <br>hhp </p>"
