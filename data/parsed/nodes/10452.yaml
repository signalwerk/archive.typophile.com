    html: "<p> Raining on your parade: <br>I can't imagine this working very well. I don't think there have been many precedents for type design by committee/collaboration of more than two people. <br>Having said that though, it might be fun for some of the participants and instructive for the organisers, and there's no harm done. So go for it! <br>My suggestion on how to start would be this: <br>Don't start from absolutely square one. Participants should throw into the hat unfinished/barely started projects that have been shelved for one reason or another. Upload samples like in the Critique Discussion area and discuss the merits of each prospect and go from there. I for one have a handful of designs with potential that I will never ever finish, and I dare say a lot of people here have good projects that they might not develop. I think this would be a far better way to get the project going than to debate sans grotesque versus serif display/whatever.  <br> <br>Oh, and choose something fairly easy to start off with, otherwise there will never be a second Typophile multi-collaborative font. </p>"
