    html: "<p> Here's yet another idea: <br> <br>Round one: <br>All participants submit five to ten characters  <br>of their own idea. <br> <br>Round two: <br>The \"editor\" picks out the idea that seems  <br>to best fit for collaborative work, or possibly <br>merges two or more. <br> <br>Round three: <br>Participants start working on characters, <br>everyone does each letter he/she wants,  <br>nothing more, nothing less.  <br> <br>Round four: <br>The editor picks out the characters that suit  <br>the idea best (maybe even two or three versions  <br>of each character if that works) and sends  <br>those out. <br> <br>Round five: <br>Participants can submit \"remixes\" of the chosen <br>characters or add characters noone chose to do  <br>in the first round. <br> <br>Following rounds would have all the kerning  <br>and hinting and such, how that process works  <br>I don't really know as I've never finished  <br>a typeface beyond fixing it up for personal use,  <br>but this way I feel everyone has a say on  <br>everything, but the outcome still looks good. </p>"
