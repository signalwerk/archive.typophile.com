  html: "<p>ok, here's my question of the day: <br>which is better-- <br>1) to design diacritics that allow oacute and o with kreska to be represented by the same glyph. bascially in this scenario one would need to design fairly steep accents (acute and grave), correct? How acceptable are these steeper accents in other languages that use diacritics? <br>2) to use the OpenType locl feature to make this replacement. I've heard that no apps currently support language sensitive replacements so this may not be very well implemented at the present. <br>So which would be the preferred method to resolve this problem? <br>Also, has unicode recognized the difference between the acute accent and the kreska? <br>Any light you could shed would be appreciated... thnx.</p>"
  html_clean: "<p>ok, here's my question of the day: <br>which is better-- <br>1) to design diacritics that allow oacute and o with kreska to be represented by the same glyph. bascially in this scenario one would need to design fairly steep accents (acute and grave), correct? How acceptable are these steeper accents in other languages that use diacritics? <br>2) to use the OpenType locl feature to make this replacement. I've heard that no apps currently support language sensitive replacements so this may not be very well implemented at the present. <br>So which would be the preferred method to resolve this problem? <br>Also, has unicode recognized the difference between the acute accent and the kreska? <br>Any light you could shed would be appreciated... thnx.</p>"
