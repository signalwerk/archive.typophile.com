    html: "<p>In my experience, most language users are happy with a fairly steep acute accent, which will serve as a kreska. The exception is actually the preference for quite flat accents in Czech and Slovak, so if anything these are the languages that I would address using the <i>locl</i> feature. <br> <br>Unicode does not distinguish between the kreska and the acute accent: they are the same character.</p>"
