    html: |-
      <p>I'm not sure if font editors support that format, so I suggest you save/export the AutoCAD file as Encapsulated PostScript file (.eps) as that format is supported by several font editors. <a class="freelinking external" href="http://www.high-logic.com/font-editor/fontcreator.html" rel="nofollow">FontCreator</a> is one of them.</p>
      <p>This article might help:<br>
      <a class="freelinking external" href="http://forum.high-logic.com/viewtopic.php?f=4&amp;t=2846" rel="nofollow">From Vector (e.g. an Adobe Illustrator image) to Font</a></p>
