      <p>I'm not sure if font editors support that format, so I suggest you save/export the AutoCAD file as Encapsulated PostScript file (.eps) as that format is supported by several font editors. <a href="http://www.high-logic.com/font-editor/fontcreator.html" title="Click to visit an external URL." class="freelink freelink-external freelink-external">FontCreator</a> is one of them.</p>
