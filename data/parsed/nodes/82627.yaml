    html: <p>Yes, by a look into the code. The CSS reveals that Reader’s Digest doesn’t use a webfont servive, but rather hosts the fonts itself. They link to raw OpenType fonts (several styles of Poynter OS, as well as Freight Sans and Micro), using @font-face, without any obfuscation whatsoever. I doubt this is in accordance with the EULAs. I will point the respective foundries to this thread.</p>
