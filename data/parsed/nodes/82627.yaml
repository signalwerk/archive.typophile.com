  html: |-
    <p>this is bugging me</p>
    <p>is there an easy way to find out where the fonts on this site are being served from? the body text on<br>
    <a href="http://www.rd.com/health/sleep-your-way-to-better-heart-health/" title="http://www.rd.com/health/sleep-your-way-to-better-heart-health/">http://www.rd.com/health/sleep-your-way-to-better-heart-health/</a></p>
    <p>is reported by the 'what font' tool as PoynterOSTextTwoL, which I thought might come from WebType, but it doesnt seem to. the hinting is weird, see the bottom of the lowercase p decender. </p>
    <p>any help appreciated.</p>
