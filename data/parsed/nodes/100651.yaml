      <p>I would say italicize Greek as one would French etc.<br>
      Many letters of the Greek alphabet look like Latin letters although they do not correspond.<br>
      So remove the possibility that nu will be read as /v, or rho as /p, and so on.<br>
      Also, scholars will appreciate that this degree of contrast between upright and slanted forms is old-school (when the default Greek fonts had a slanted lower case).<br>
      Furthermore, this would give Greek the same <em>typographic</em> treatment as French etc., so would be consistent in an English document that quoted both French and Greek extracts.</p>
      <p>And especially for that last reason, I would say italicize Cyrillic also.</p>
