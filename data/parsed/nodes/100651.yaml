  html: |-
    <p>Should occasional Cyrillic or Greek be italicized in an otherwise Latin-script text? The usual practice for English text is to italicize Latin-script words in non-English languages, <em>comme ça</em>. Hebrew, Arabic, Coptic, Gothic, Devanagari, and the like are never italicized to my knowledge, partly because there is no real italic in those languages, and partly because the writing systems are different enough that they don’t need to be otherwise distinguished from the body text. But what about Greek and Cyrillic? In the old days of metal type I guess people just used whatever they had for those scripts, but in the modern era of Unicode and digital type it’s typical to have typefaces with harmonized Greek, Cyrillic, and Latin. Are they different enough to not need to be set off from the body, or should they be italicized?</p>
    <p>I note that italics can problematic for Cyrillic which has distinctively different letterforms in its italic incarnations. How many people who can read Cyrillic will actually recognize an italicized yat?</p>
