      <p>As much as i agree with Nick’s opinion i don’t see the necessity to italicize a different script. The reason why it is better to italicize different languages within the Latin alphabet, is to indicate clearly to the reader that there is a loan word or citation from a different language following. A different script is enough visible change.<br>
      If, however one had to set several words in different languages and scripts within the same text, i would italicize also the other scripts.</p>
