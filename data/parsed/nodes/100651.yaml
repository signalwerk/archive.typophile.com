      <p>Here’s a short example from some of my text.</p>
      <blockquote><p>
      Similar in meaning to Hebrew אָמֵן <em>ʔāmēn</em> and hence Greek ἀμήν <em>amḗn</em> and Russian ами́нь <em>amínʼ</em> (the Russian reflecting shift of Greek η <em>ē</em> to <em>i</em>), though not actually used in translations of religious materials.
      </p></blockquote>
      <p>Here’s another longer example with only Cyrillic.</p>
      <blockquote><p>
      The scientific names all come from Russian, and were originally given by Johann Julius Walbaum during his time in the Russian Far East. The name <em>O. tshawytscha</em> is from Russian чавы́ча /tɕaˈvɨtɕa/ which is itself from Itelʼmen <em>čevičev</em>. <em>O. nerka</em> is in Russian не́рка /ˈnʲerka/, but in Siberian dialects ня́рка /ˈnʲarka/, and which appears to be from Proto-Samoyedic <em>*nʸʌrkə</em>, compare Nganasan <em>nʸorə</em>. <em>O. kisutch</em> is Russian ки́жуч /ˈkʲiʐutɕ/ but in Siberian dialects ки́зуч /ˈkʲizutɕ/, coming from Itelʼmen <em>kizuez</em>; the dialectal form is the source of the scientific name. <em>O. keta</em> is particularly interesting: in Russian it is ке́та /ˈkʲeta/ but this is again not native; rather, the source is probably Evenki <em>keːta</em> ‘<em>O. keta</em>’ or perhaps Even <em>qæta</em> ‘dead salmon after spawning’ (unrelatedly, Tlingit also has <em>xein</em> /xeːn/ ‘spawned-out salmon’ &lt; Pre-Tlingit <em>*xaʰyn</em>, cognate with Eyak <em>xaːnih</em>; also cf. PA <em>*xʸaːn</em> ‘old age’, cognate with Tlingit <em>shaan</em> /ʃaːn/ ‘old, elderly’ &lt; Pre-Tlingit <em>*šaʰn</em>) both of which are themselves probably from Chukchi-Koryak, e.g. Chukchi <em>qetaqet</em> ‘<em>O. keta</em>’. The Russian for O. gorbuscha is simply горбу́ша /gorˈbuʂa/ derived from горб /gorb/ ‘hump’ and describing the pronounced hump that develops on the backs of males during spawning.
      </p></blockquote>
      <p>Of course this looks unpleasant here because Georgia doesn’t have all the appropriate characters and browsers substitute various fonts badly.</p>
