    html: <p>Given that your text involves systematic use of Latin italics for phonetic notation, I would say do not italicise the Greek and Cyrillic. Where you have a sequence like this 'Russian ами́нь <em>amín</em>', I'd say it is more important to distinguish the Russian words from the italicised Latin pronunciation than to further visually distinguish the Cyrillic from the Latin.</p>
