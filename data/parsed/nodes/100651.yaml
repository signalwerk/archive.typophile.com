    html: "<p>James, I think both criteria are plausible. But in linguistic texts, you handle several groups of information: the contemporary form of a word, variations through time, its ancient form and pronunciation, loan originals, non-Latin roots and so on. From a practical point of view, I would use regular Greek and Cyrillic as the general rule and reserve their italic styles to specific groups (as pronunciation or an ancient form). Hence, you have one more option to distinguish things.</p>"
