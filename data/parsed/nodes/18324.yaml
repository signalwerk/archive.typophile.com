      <p>The font is called Everyday and it comes in bold and regular varieties. As you guessed earlier, it's a custom font for the Everyday Rachael Ray magazine. In fact, the "Everyday" part of the masthead that you see on the cover is in fact EveryDay Bold.</p>
      <p>Hope this helps.</p>
