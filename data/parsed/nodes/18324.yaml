      <p>Wow, Cerilene, you're coming up with some good ones. If I had collected this I think it would be in <a href="http://bowfinprintworks.com/Script06Pg1.html" rel="nofollow">Part 6 of the Script Font ID Guide</a> (Sign lettering scripts).</p>
      <p>It reminds me of a few things, but they have the two-storey 'a' (Birdlegs, Havergal and Tweed, to mention three). The 'a' is more like 'Squire', but there are too many other differences. Sassoon is also a bit similar (sorry for not putting in links -- these are all available from large vendors).</p>
      <p>- Mike Yanega</p>
