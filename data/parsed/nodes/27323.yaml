    html: |-
      <p>Minion Pro--it was re-drawn and is better than Minion--is a champion of usability among text faces. In a previous discussion of Minion, Jean François Porchez pointed out that Slimbach intended it as a replacement for Times New Roman--it being an extremely compact, economical type. It also has a huge range of styles and weights and four optical sizes, making it wonderfully adaptable to different projects. </p>
      <p>It has many, many vitues. However, to my eyes it has two shortcomings. First, it is a bit too compact and tightly spaced for ideal readability. Second, there is something about the roman that lacks liveliness and charm. Times New Roman remains better in that respect.</p>
