      <p>Minion is popping up in quite a few places. Right now I'm watching it being used in some of the end titles on the movie "Shrek II" on HBO West.</p>
      <p>Although Minion Pro is redrawn better, I still have some practical use for the previous Multiple Master version in sign making.</p>
      <p>Neon filled channel letters are very popular for signage these days. But any letter with a serif is a big pain to make unless the letter can be set very large. If the letters are less than 2' tall I try to avoid serif styles completely. A good 2" of clearance is required for the neon tubes, housings, etc. Many book faces at 24" will have narrow portions far under that 2" minimum. The optical size and weight axis sliders with MinionMM could yield a slab serif letter more practical to make at modest sizes. And by "modest" I mean 2' tall.</p>
      <p>I hate it with a passion when customers want a channel letter sign with serif type in sizes like 12". I have to keep the fabricators in our big shop from wringing my neck.</p>
