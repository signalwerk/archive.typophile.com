      <p>&gt;Times is a better choice…ummm- your kidding right?</p>
      <p>I didn't say Times was a better choice, I said that it has more liveliness and charm. It has been way overused, but still is excellent if used properly--eg. not in long measure on letter sized paper. I am reluctant to use it at all because of over use, but it's still a great typeface. </p>
      <p>As I said, Minion is a champion of usability and adaptability. It really beats out other type faces in many situations, and deserves the good things said about it in this thread. But something about it is just unloveable, as other comments indicate. I don't feel this way about other Slimbach faces, such as Adobe Garamond, which is fabulous--though not as adaptable as Minion.</p>
