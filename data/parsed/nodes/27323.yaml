    <p>Does <a href="/node/27343" title="" class="freelink freelink-nodetitle freelink-internal" rel="nofollow">Minion</a> (Pro or whatever) typeface have any shortcomings or faults as a type for text in books or articles? I guess that would be in the range of 9 to 11 points. Or is it perfect?</p>
