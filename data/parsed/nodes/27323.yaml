      <p>As a bit of cross thread action from the Typographic Heresy thread I will go as far as to say when it comes to reading I feel annoyed when ligatures are not used in books, and more often than not find myself smiling when you find someone who actually does!</p>
      <p>Also I commend those who list the font(s) they used in the book and a brief history of it or the font designer.</p>
