      <p><code>Who needs thrill from a book face, the book designer or the reader?</code></p>
      <p>That's a good point. In my [limited] experience, we typographers and type fanatics sometimes make a lot of fuss about things that really don't affect the vast majority of readers (or should I say "users"?), even unconsciously. Of course a better way to ascertain that would be so set the same page in, say, Minion and Bembo, and conduct a usability test.</p>
      <p>I personally am not very fond of Times New Roman, but have read books as large and dense as <a href="http://www.oup.com/uk/catalogue/?ci=9780195079937" target="_blank" rel="nofollow"><em>The world's writing systems</em></a> without being bored or apparently having my comprehension hindered -- or my appreciation diminished -- by the text set in TNR. That's not to say that a typographer's careful selection of a typeface is a futile effort, but sometimes the microscopic nuances we fret about may not make such a big difference to the end user. (Notice I said "may"!)</p>
      <p>Sure, the nuances I mentioned may be a typographer's <em>raison d'être</em>, but as Zapf puts it, "typographic design is sometimes misconstrued as a form of private self-expression for designers".</p>
      <p>Back to Minion, I personally find it an excellent, extremely versatile typeface that does extraordinarily well the job of "disappearing" so that the text can take centre stage.</p>
    html_clean: |-
