      <p>Paul Stanley commented on Minion a while ago, and I'll never forget this brilliant little bit of typovangelism:</p>
      <p>"I don't want anyone to think that I disparage Minion; I can see its virtues, but I cannot love them. I guess it's a matter of taste. Minion seems to me slightly mannered, perhaps too polished, its elegance too studied. When it comes to tea, it spreads its napkin carefully, drops no crumbs, eats its cake with a fork and holds its cup ever-so-daintily. It avoids talking about sex, religion or politics. It leaves when it should and writes its thank-you note that evening. One's mother says, "When are you having that nice Minion over, such a charming boy." I prefer something a little rougher, quirkier, more dangerous.</p>
      <p>And because it's such a pleasant guest, one does see it around a lot. Better, no doubt and by far, than some of the others one sees all the time. But unlikely to thrill."</p>
      <p>My suggestion, if I may make one in such learned company here on typophile? Go for Sabon Next (a real beauty), or Bembo Book (as in the new digitization); perhaps Dante, or if you don't mind the lack of variety, Dolly by Underware. The possibilities are legion. I'd even be so bold as to suggest Luminance by Mac Rhino. If you're looking for something a bit more modern, try Josh Dardens' Freight (serif) family.</p>
      <p>As far as Aldus goes, it is a lovely, elegant face. The current digitzation is very usable.</p>
