    html: |-
      <p>You can click on the segment between the two points and hit ’delete.’ </p>
      <p>This leaves the points in tact, while removing the connecting segment. The result is an open contour.</p>
      <p>To do this you have to set the preference: Glyph Window &lt; Advanced &lt; Edit/Delete command breaks contour</p>
      <p>Hope that’s helpful!</p>
      <p>j</p><div class="imageWrap"><img src="/web/20080904214243im_/http://www.typophile.com/files/pref_6390.png"></div><p></p>
