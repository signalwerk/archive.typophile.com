    <p>Hello,</p>
    <p>In the the last days I'm working in a new design. The inspiration is in the aesthetics of machines an in the geometric typefaces used in CAD softwares. In the project I tried a friendly-eye approach through proportions, spacing (no manospaced) and optic adjustments in the weight of the lines.</p>
    <p><a href="http://www.rafaelneder.com/discord/" title="http://www.rafaelneder.com/discord/">http://www.rafaelneder.com/discord/</a></p>
    <p>Please tell me what you guys think</p>
