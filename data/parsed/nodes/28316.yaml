      <p>Hi Emiliano,</p>
      <p>well all the letters have the same baseline and only /t and /l have have an optical adjustment because of the end of the strokes.</p>
      <p>I agree with you about the metrics of /f /l and /t in the whole picture they are to wide, but to me the /r problem stills on the drawing. The arm are to big and the negative space blow up.</p>
