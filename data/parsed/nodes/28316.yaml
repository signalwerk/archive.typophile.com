      <p>Oh thanks. </p>
      <p>Talking with <a href="http://www.focodesign.art.br/bytype" target="_blank" rel="nofollow">Fabio Haag</a> in a brazilian discussion list we both agree with some proportions changes. </p>
      <p>The proportions of letters /B/P/R/S/V/Z should be softly extended</p>
      <p>In the other hand the group /O/C/D/G/Q/ should be softly condensed </p>
      <p>The /M is to wide. To fix I need to work in the junction of the vertical and diagonal strokes. And futher apply on /N</p>
      <p>The the crossbar on the numbers 5/6/9 must go down (something like /8 or /H</p>
