      <p>Could you post a new pdf of what you have now?<br>
      What i was saying about the baseline is that when a letter like your 'i' 'h' and 'r' that begins with a vertical stroke and no support at the base, it tends, when rendered, to look smaller and bolder when compared to a complex form ghyph like 's' or 'a'. With a little hinting you can solve this problem.</p>
      <p>Emiliano Amadei</p>
