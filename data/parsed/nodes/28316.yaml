      <p>I don't know if is just me, but the letters don't seem to have the same baseline. I know that the 't' and the 'l' don't, but i the word 'behind' i have a odd feeling. My guess is that the bottom of 'b' 'e' and 'd' are hinted and the h' 'i' and 'n' aren't. The metrics of 'f' and 'r' leave a big white area and the metrics of 't' and 'l' are too small. A good example is the word 'software'.<br>
      Another thing, your diacritics seem a little out of place, like the Â, Ô, Û, and the ~ looks to wide for the lowercase letters.</p>
      <p>Emiliano Amadei</p>
