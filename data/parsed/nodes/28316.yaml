      <p>After <a href="http://www.typophile.com/node/28316" rel="nofollow">a long period of development</a> finally I released Discord. Inspired in the machine aesthetics and in the human conflict with them, Discord is a flexible family of sixteen fonts designed to be used in a wide range of work. Ready for multilingual support and with advanced OpenType features such as Small Caps and Old Style Numbers.</p>
