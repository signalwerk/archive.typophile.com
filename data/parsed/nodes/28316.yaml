      <p>Hello, after a long pause I`m back. In the past weeks I fix some drawings on several glyphs and change some proportions. </p>
      <p>To the family I'm planning some ligatures and alternates but this is my first OpenType adventure and I'm having a lot of pain in the generation of the font files but i will fix it soon. Please check: </p>
