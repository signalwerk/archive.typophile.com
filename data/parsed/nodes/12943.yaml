    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12369" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">“How To” Section</a>&nbsp;: Programming OpenType&nbsp;Features</strong></p>
    <p><strong>Preface</strong><br><a href="/node/12420" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">OpenType</a> is a powerful new font format that gives users a much broader range of typographic and linguistic control than has previously been available with a single digital font. More and more type <a href="/wiki/foundries" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Foundries</a> offer OpenType (<span class="caps">OT</span>) fonts these days and one can expect the average user to become more aware of the benefits of <span class="caps">OT</span> fonts as more applications take advantage of their capabilites in the&nbsp;future.</p>
    <p><strong>Getting Started</strong><br>
    Once you’ve decided you want to develop <span class="caps">OT</span> fonts, you must decide what software you want to use to accomplish this task. Your choices&nbsp;include:
    </p><ul><li><strong>FontLab’s OpenType Tools</strong> OpenType programming tools built into the popular font creation software <a href="/node/12240" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">FontLab</a>.</li>
    <li><strong>Microsoft’s Visual OpenType Layout Tool</strong> (<a href="/node/12755" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal"><span class="caps">VOLT</span></a>) A free tool available to add OpenType layout tables to TrueType&nbsp;fonts.</li>
    <li><strong>Adobe Font Development Kit for OpenType</strong> (<a href="/node/20078" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal"><span class="caps">AFDKO</span></a>) A set of opensourse tools available to add OpenType layout tables to PostScript&nbsp;fonts.</li>
    </ul><p>Each of these methods has its own set of advantages and drawbacks, for example: FontLab makes it easy to preview <span class="caps">OT</span> features, but it does not yet support complicated lookups such as one-to-many replacements. Adobe’s <span class="caps">FDK</span> and Microsoft’s <span class="caps">VOLT</span> may give access to more advanced features but do so at the expense of ease of use. Additionally these programs can only export one <a href="/node/12946" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Flavor</a> of <span class="caps">OT</span> font (PostScript and TrueType respectively). The next few sections will be dedicated to the basics of using each of these&nbsp;methods.</p>
    <p><strong>Some pointers for learning the “OpenType&nbsp;language”</strong></p>
    <ul><li>Your starter may be <a href="http://www.fontlab.net/Typographic-Resources/Font-Typography-Books/Learn-FontLab-Fast/">Leslie Cabarga’s “Learn FontLab Fast”</a> book.</li>
    <li>Secondly, there is a chapter <a href="http://www.fontlab.net/font-editor/fontlab-studio/download-fontlab-studio/">FontLab Studio manual</a>.</li>
    <li>John Hudson’s article <a href="http://www.microsoft.com/typography/Glyph%20Processing/intro.mspx">Windows Glyphs Processing</a> provides a good overview of the OpenType&nbsp;technology.</li>
    <li><a href="http://www.typotheque.com/fonts/opentype_feature_support/">Typotheque</a> provides a useful reference of Layout features used by different&nbsp;applications.</li>
    <li>The <a href="http://www.microsoft.com/typography/otspec/ttoreg.htm">OpenType tag registry</a> provides an overview of all registered OpenType Layout&nbsp;features.</li>
    <li>Microsoft provides an overview of the system support for OpenType Layout features <a href="http://www.microsoft.com/typography/OpenType%20Dev/standard/intro.mspx">for Latin, Cyrillic, Greek and other “standard” writing systems</a>.</li>
    <li><a href="http://kltf.de/kltf_otproduction.htm">Karsten Luecke</a> collected his various useful OpenType production&nbsp;notes.</li>
    <li>Adobe published the <a href="http://del.icio.us/adamtwar/opentypedev/"><span class="caps">AFDKO</span> source code for the Bickham Script Pro and Minion Pro</a> OpenType fonts they&nbsp;published.</li>
    <li>Adobe’s <a href="http://blogs.adobe.com/typblography/atypi2006/slye_lisbon-05.pdf">Christopher Slye</a> and <a href="http://blogs.adobe.com/typblography/atypi2006/atypi_Adventures_in_class_kerning.pdf">Miguel Sousa</a> published useful&nbsp;slides.</li>
    <li>There are numerous <a href="http://www.google.com/search?q=site%3Atypophile.com+feature+sub">threads on Typophile</a> that discuss specific quesions and&nbsp;issues.</li>
    <li>Finally, the <a href="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html"><span class="caps">AFDKO</span> feature file syntax</a> is the ultimate reference for the&nbsp;language.</li>
    <li>The <a href="http://www.microsoft.com/typography/otspec/">OpenType font format specification</a> is an important&nbsp;reference.</li>
    </ul><p><strong>General Practices</strong><br>
    The following advice is applicable no matter which method you choose to add <span class="caps">OT</span> features to your font. When planning which features to incorporate into your OpenType font, it’s good to keep in mind what features are currently supported, because although dozens of features have been defined in the <a href="http://www.microsoft.com/typography/otspec/featurelist.htm">OpenType layout tag registry</a>, only a handful are currently supported by currently available applications. For example, although the “rand” feature has been defined to randomize characters from a set of alternate glyphs, there are currently no programs that offer support for this feature. Including an unsupported feature may give the font extended functionality in the future, but at the present time font users would have no way to access such a feature. For an up-to-date listing of which features are supported by what software, see <a href="/node/14084" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typotheque</a>’s <a href="http://www.typotheque.com/fonts/opentype_feature_support/">OpenType Feature Support in Applications</a> page.</p>
    <p><strong>FontLab</strong><br>
    FontLab incorporates Adobe’s feature definition code for OpenType programing within its font editor. FontLab’s <a href="http://www.font.to/downloads/FL46WinDoc.pdf">user’s manual</a> gives a crash course on how to write lookups using this syntax. For a more detailed overview, see <a href="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html">Adobe’s OpenType Feature File Specification</a>. Once you’ve read through this, it’s a good idea to look at some feature files by some professional foundries. Adobe has made a couple of <span class="caps">OT</span> feature files available so that OpenType developers can see how to build complete sets of <span class="caps">OT</span> features. Currently, Adobe has released the feature files for <a href="http://www.adobeforums.com/cgi-bin/webx?50@893.Qb7beqhqCtw.2@.3bb58628">Minion Pro</a> and for <a href="http://www.typophile.com/node/8602">Bickham Script Pro</a>. FontLab also offers a Free Font Pro with an extended character set and opentype layout tags that developers can open up and experiment with to get a feel for how different features work. Most <span class="caps">OT</span> features for the English language are made up of simple subtitutions (<span class="caps">GSUB</span> lookups). These types of lookups are simple to write. Using only simple substitution rules, one can sucessfully build simple features for <a href="/node/12055" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">ligatures</a>, <a href="/node/13897" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Text Figures</a> (oldstyle figures), stylistic alternates,&nbsp;&amp;c.</p>
    <p><strong>Discussion:</strong><br><a href="http://typophile.com/node/32455">OpenType smallcaps in a separate font?</a><br><a href="http://typophile.com/node/32420">Proper Implementation of numr and dnom OpenType features</a><br><a href="http://typophile.com/node/32399">Stylistic Alternatives - InDesign?</a><br><a href="http://dev.typophile.com/node/34108">OpenType feature access to unusual characters</a><br><a href="http://typophile.com/node/39375">OpenType Resources (Link Collection)</a><br><a href="http://typophile.com/node/42009">OpenType&nbsp;programming</a></p>
    <p><strong>Additional Articles:</strong><br><a href="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html">Adobe - OpenType Feature File Specification</a><br><a href="http://www.microsoft.com/typography/otspec/recom.htm">Recommendations for OpenType&nbsp;Fonts</a></p>
