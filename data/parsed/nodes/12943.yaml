    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/How-To" class="freelinking" rel="nofollow">"How To" Section</a> : Programming OpenType Features</strong></p>
    <p><strong>Preface</strong><br>
    <a href="/wiki/OpenType" class="freelinking" rel="nofollow">OpenType</a> is a powerful new font format that gives users a much broader range of typographic and linguistic control than has previously been available with a single digital font. More and more type <a href="/wiki/foundries" class="freelinking" rel="nofollow">foundries</a> offer OpenType (OT) fonts these days and one can expect the average user to become more aware of the benefits of OT fonts as more applications take advantage of their capabilites in the future.</p>
    <p><strong>Getting Started</strong><br>
    Once you've decided you want to develop OT fonts, you must decide what software you want to use to accomplish this task. Your choices include:
    </p><ul>
    <li><strong>FontLab's OpenType Tools</strong> OpenType programming tools built into the popular font creation software <a href="/wiki/FontLab" class="freelinking" rel="nofollow">FontLab</a>.</li>
    <li><strong>Microsoft's Visual OpenType Layout Tool</strong> (<a href="/wiki/VOLT" class="freelinking" rel="nofollow">VOLT</a>) A free tool available to add OpenType layout tables to TrueType fonts.</li>
    <li><strong>Adobe Font Development Kit for OpenType</strong> (<a href="/wiki/AFDKO" class="freelinking" rel="nofollow">AFDKO</a>) A set of opensourse tools available to add OpenType layout tables to PostScript fonts.</li>
    </ul>
    <p></p><p>Each of these methods has its own set of advantages and drawbacks, for example: FontLab makes it easy to preview OT features, but it does not yet support complicated lookups such as one-to-many replacements. Adobe's FDK and Microsoft's VOLT may give access to more advanced features but do so at the expense of ease of use. Additionally these programs can only export one <a href="/wiki/flavor" class="freelinking" rel="nofollow">flavor</a> of OT font (PostScript and TrueType respectively). The next few sections will be dedicated to the basics of using each of these methods.</p>
    <p><strong>Some pointers for learning the “OpenType language”</strong></p>
    <ul>
    <li>Your starter may be <a href="http://www.fontlab.net/Typographic-Resources/Font-Typography-Books/Learn-FontLab-Fast/" rel="nofollow">Leslie Cabarga’s “Learn FontLab Fast”</a> book.</li>
    <li>Secondly, there is a chapter <a href="http://www.fontlab.net/font-editor/fontlab-studio/download-fontlab-studio/" rel="nofollow">FontLab Studio manual</a>.</li>
    <li>John Hudson’s article <a href="http://www.microsoft.com/typography/Glyph%20Processing/intro.mspx" rel="nofollow">Windows Glyphs Processing</a> provides a good overview of the OpenType technology.</li>
    <li><a href="http://www.typotheque.com/fonts/opentype_feature_support/" rel="nofollow">Typotheque</a> provides a useful reference of Layout features used by different applications.</li>
    <li>The <a href="http://www.microsoft.com/typography/otspec/ttoreg.htm" rel="nofollow">OpenType tag registry</a> provides an overview of all registered OpenType Layout features.</li>
    <li>Microsoft provides an overview of the system support for OpenType Layout features <a href="http://www.microsoft.com/typography/OpenType%20Dev/standard/intro.mspx" rel="nofollow">for Latin, Cyrillic, Greek and other “standard” writing systems</a>.</li>
    <li><a href="http://kltf.de/kltf_otproduction.htm" rel="nofollow">Karsten Luecke</a> collected his various useful OpenType production notes.</li>
    <li>Adobe published the <a href="http://del.icio.us/adamtwar/opentypedev/" rel="nofollow">AFDKO source code for the Bickham Script Pro and Minion Pro</a> OpenType fonts they published.</li>
    <li>Adobe’s <a href="http://blogs.adobe.com/typblography/atypi2006/slye_lisbon-05.pdf" rel="nofollow">Christopher Slye</a> and <a href="http://blogs.adobe.com/typblography/atypi2006/atypi_Adventures_in_class_kerning.pdf" rel="nofollow">Miguel Sousa</a> published useful slides.</li>
    <li>There are numerous <a href="http://www.google.com/search?q=site%3Atypophile.com+feature+sub" rel="nofollow">threads on Typophile</a> that discuss specific quesions and issues.</li>
    <li>Finally, the <a href="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html" rel="nofollow">AFDKO feature file syntax</a> is the ultimate reference for the language.</li>
    <li>The <a href="http://www.microsoft.com/typography/otspec/" rel="nofollow">OpenType font format specification</a> is an important reference.</li>
    </ul>
    <p><strong>General Practices</strong><br>
    The following advice is applicable no matter which method you choose to add OT features to your font. When planning which features to incorporate into your OpenType font, it's good to keep in mind what features are currently supported, because although dozens of features have been defined in the <a href="http://www.microsoft.com/typography/otspec/featurelist.htm" rel="nofollow">OpenType layout tag registry</a>, only a handful are currently supported by currently available applications. For example, although the "rand" feature has been defined to randomize characters from a set of alternate glyphs, there are currently no programs that offer support for this feature. Including an unsupported feature may give the font extended functionality in the future, but at the present time font users would have no way to access such a feature. For an up-to-date listing of which features are supported by what software, see <a href="/wiki/Typotheque" class="freelinking" rel="nofollow">Typotheque</a>'s <a href="http://www.typotheque.com/fonts/opentype_feature_support/" rel="nofollow">OpenType Feature Support in Applications</a> page.</p>
    <p><strong>FontLab</strong><br>
    FontLab incorporates Adobe's feature definition code for OpenType programing within its font editor. FontLab's <a href="http://www.font.to/downloads/FL46WinDoc.pdf" rel="nofollow">user's manual</a> gives a crash course on how to write lookups using this syntax. For a more detailed overview, see <a href="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html" rel="nofollow">Adobe's OpenType Feature File Specification</a>. Once you've read through this, it's a good idea to look at some feature files by some professional foundries. Adobe has made a couple of OT feature files available so that OpenType developers can see how to build complete sets of OT features. Currently, Adobe has released the feature files for <a href="http://www.adobeforums.com/cgi-bin/webx?50@893.Qb7beqhqCtw.2@.3bb58628" rel="nofollow">Minion Pro</a> and for <a href="http://www.typophile.com/node/8602" rel="nofollow">Bickham Script Pro</a>. FontLab also offers a Free Font Pro with an extended character set and opentype layout tags that developers can open up and experiment with to get a feel for how different features work. Most OT features for the English language are made up of simple subtitutions (GSUB lookups). These types of lookups are simple to write. Using only simple substitution rules, one can sucessfully build simple features for <a href="/wiki/ligature" class="freelinking" rel="nofollow">ligatures</a>, <a href="/wiki/text%20figures" class="freelinking" rel="nofollow">text figures</a> (oldstyle figures), stylistic alternates, &amp;c.</p>
    <p><strong>Discussion:</strong><br>
    <a href="http://typophile.com/node/32455" rel="nofollow">OpenType smallcaps in a separate font?</a><br>
    <a href="http://typophile.com/node/32420" rel="nofollow">Proper Implementation of numr and dnom OpenType features</a><br>
    <a href="http://typophile.com/node/32399" rel="nofollow">Stylistic Alternatives - InDesign?</a><br>
    <a href="http://dev.typophile.com/node/34108" rel="nofollow">OpenType feature access to unusual characters</a><br>
    <a href="http://typophile.com/node/39375" rel="nofollow">OpenType Resources (Link Collection)</a><br>
    <a href="http://typophile.com/node/42009" rel="nofollow">OpenType programming</a></p>
    <p><strong>Additional Articles:</strong><br>
    <a href="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html" rel="nofollow">Adobe - OpenType Feature File Specification</a><br>
    <a href="http://www.microsoft.com/typography/otspec/recom.htm" rel="nofollow">Recommendations for OpenType Fonts</a></p>
