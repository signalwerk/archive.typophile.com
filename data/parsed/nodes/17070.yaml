      <p>I've also been chasing this down and somehow it feels somewhere between Bodoni SH(SB?) and Bauer Bodoni by Elsner &amp; Flake. Very close, but neither exactly match... unless there is a display version.<br>
      The lower case "f" of the sample is narrower and tapers towards the top more "gracefully" than the others. Or is that just the optical foreshortening caused by the curl of the magazine's spine?</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/sample_lc.png"></div>supplied sample<p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/bodoni_SH.png"></div>Bodoni SH (Scangraphic)<p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/bodoni_SB.png"></div>Bodoni SB (Scangraphic)<p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Bauer_EF.png"></div>Bauer Bodoni, Elsner &amp; Flake<p></p>
      <p>I even looked at Vignelli's custom Bodoni... and it's not it either.<br>
      Patty, Stephen... any other suggestions where to look?</p>
