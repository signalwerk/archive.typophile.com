    <p>We are working on a project in the area of "Avenue de Champagne". Currently we are scouting for more information about the area and people who have influenced the local typography there and in France at the beginning of 20th century. </p>
    <p>Here are some examples of the type style we are interested to know more about:<br>
    <a href="http://thingstodo.viator.com/champagne/files/2013/05/Avenue-de-Champagne.jpg" title="http://thingstodo.viator.com/champagne/files/2013/05/Avenue-de-Champagne.jpg">http://thingstodo.viator.com/champagne/files/2013/05/Avenue-de-Champagne...</a><br>
    <a href="http://decantertours.com/wp-content/uploads/2010/08/champagne-man-in-berret-300x198.jpg" title="http://decantertours.com/wp-content/uploads/2010/08/champagne-man-in-berret-300x198.jpg">http://decantertours.com/wp-content/uploads/2010/08/champagne-man-in-ber...</a><br>
    Or is this common signage type in some areas of France?</p>
    <p>Insight, books, designers and why not even fonts appreciated.<br>
    (Reading has provided us with some history already but now we are looking for this specific style)</p>
    <p>Thank you.</p>
