    html: <p> How could there be too many mono-weight sans'? We just need to get outside of our traditional view of letter-shapes. Mono-weight is where it all started, and continues to push the fundamental forms of our limited writing system. I say go for it. I like the wacky smashed circle shapes of the C and G. </p>
