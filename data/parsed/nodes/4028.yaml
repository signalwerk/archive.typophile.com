    html: "<p> Damn Dave. <br> <br>Well, I saw this before the Serif version so I <br>come without the influence of its brother. This <br>said, I think it's wonderful in the same woody  <br>way Atlantis is. The stress is excellent - don't  <br>go monostroke with it. <br> <br>Your letters may have a place on my  <br>storefront sign anytime. <br> <br>Stephen <br> <br>Note: I have no such shop - but I plan to open  <br>one \"Coles General Store\" solely for the  <br>opportunity to showcase your fine work. </p>"
