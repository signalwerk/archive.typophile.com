  html: <p>This is the sans serif version of Architrave, showing in the "Serif" forum. As an experiment, I clipped the serifs and most of the bracketing off to see if I could develop a suitable sans-serif companion font. The result is a modulated-stroke sans. I'm still entertaining the idea of producing a monostroke version as well. <br> <br>David Thometz <br> <br><img src="http://www.typophile.com/forums/messages/29/324.jpg" alt="architravesans.jpg"></p>
