      <p>Most of these types of logos aren't being submitted by graphic designers. They're mostly hobbyists/kids/etc. Nothing wrong with that, but you get what you pay for. And they earn what they're worth, I guess. </p>
      <p>Cheap logo systems seem to benefit one party: the party hosting the logo system and taking the cut. Rarely does a customer get something worth what they paid and rarely does the designer get paid what they are worth.</p>
