    html: |-
      <p><cite>Logo contest/crowdsource/mill sites really aren’t a way to make an actual profit.</cite></p>
      <p>Sure they are. Once you’ve entered a dozen logo design contests you don’t really have to design anything, you just keep tweaking and resubmitting permutations of the same old ideas. If you pirate all your fonts, software, and stock art the costs are even lower. And if you’re a working designer you can start by selling old comps or buy comps from other designers. And the same people who do these logos are also cranking out template-based web sites that pay much more than the logo contests. Sure this stuff doesn’t pay much, but it probably adds a nice chunk of income to small-town designers or designers living in the third world.</p>
    html_clean: |-
