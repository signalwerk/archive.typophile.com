      <p>There's nothing new here.</p>
      <p>Back in the day, as they say, Joe, of Joe's Towing would walk into a print shop and order some business cards. The printer, being a good business man would try and up-sell Joe by offering a "logo". Joe would say, Uh... The printer, being sharp, would quickly haul out the 'big book' before Joe had the chance to say no, and open it to the Tow-truck section. There would be a couple dozen pictures that fit the theme "towing company". Joe would pick one and the printer would set "JOE'S TOWING" in Cooper Black next to it. </p>
      <p>90% of businesses just don't care - Never did and never will care about anything but the price when it comes to marketing themselves. They'd never see the point in shelling out for a font, and if they end up using one illegally, it's no loss really, because their alternative to stealing a font would not be paying for it.</p>
      <p>Self medicating isn't new either :o)</p>
      <p>-=®=-</p>
