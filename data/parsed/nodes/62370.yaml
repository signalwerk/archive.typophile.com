    html: |-
      <p>The biggest downside to this is twofold, in regards to type. At $5 per logo selected, you can't afford to license type. So your logos will:</p>
      <p>A) Use software package fonts<br>
      B) Use pirated fonts</p>
      <p>There's no way anyone's wasting time to draw custom type for these projects, so it'll be about what's trendy or overwhelmingly acceptable (Bank Gothic, Papyrus, and Trajan, here we come). And there's no way anyone's going to be able to police these, so I predict that the majority of logos using non-package fonts will be using pirated ones.</p>
      <p>But in the end, it's about the clients. If they want cheap, they will get it. Let them. There will always be those willing to pay for quality and they will reap the benefits.</p>
