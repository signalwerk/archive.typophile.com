    html: |-
      <p><cite>At $5 per logo selected…</cite></p>
      <p>That’s $5 before the logo is actually sold. Once someone purchases the logo the designer gets royalties based on the price, which iPhoto claims will run 100 –&nbsp;750 credits, so that’s somewhere around $80 –&nbsp;$700. </p>
      <p><cite>There’s no way anyone’s wasting time to draw custom type for these projects…</cite></p>
      <p>I don’t think anyone is drawing custom type for at least ninety percent of the logos in use today. I could spend an hour walking around Manhattan and spot hundreds of wordmarks made together from unaltered type.</p>
      <p><cite>Except that’s not designing, that’s doodling.</cite></p>
      <p>And nobody designs logos by doodling up a bunch of shapes that are tangentially related to what the client does? Logo design doesn’t need to be lofty, it just needs to be technically competent. These are logos—not art.</p>
      <p><cite>You want random pretty stuff in your portfolio?</cite></p>
      <p>Any portfolio page of logos is going to look random to someone who doesn’t know the clients. As long as they look good it’s not going to matter—it’s not like a prospective employer is going to ask for a detailed explanation of a every concept when they’re hiring someone to do production work.</p>
