      <p>I think this will form a community of people (istock logo workers) with a much higher incidence of font piracy than any other people working in the field outside of istock volunteerism (by which I mean designers that don't contribute to istock). Contracts will likely place responsibility on the art worker/volunteer for font licensing and guarantees of originality.</p>
      <p>The logos themselves are largely meaningless. For example, a client came to us for a dance company logo precisely because she did not want swooshy starfish-like cutouts of humanoid dancers, with perhaps a little star. If I search dance on the future iStock logo site, what do you think I'll find? Photography was similar -- stock is unacceptable. However, I had to put up a little free time. Still, these are the people you want to work for.</p>
