    html: <p>I was just thinking about the math and I realized just how great the logo-contest business is for a young designer. Spend thirty days making one design a day, each on based on an existing logo to save time, and choose a different business area for each design. Make sure each logo is carefully structured on named layers in Illustrator for easy re-use. In the next thirty days, make three distinguishable variations of each logo. Now you have ninety designs to recycle across the various logo contest sites. Now wake up every morning and submit five logo designs in fifteen minutes, and maybe win two or three design contests each week. In the meanwhile you’re sharpening your production skills and you’ve got an entire page of logo designs for the portfolio. Not such a bad way to go—especially in a tough job market!</p>
