    <p>I noticed these two books on the same new releases table at Borders, and was surprised that they had been published almost simultaneously -- using the same stock photo on their jackets. <br> <br>"Loop Group" by Larry McMurtry <br><a href="http://images.amazon.com/images/P/0743250796.01._SCLZZZZZZZ_.jpg" target="_blank">http://images.amazon.com/images/P/0743250796.01._SCLZZZZZZZ_.jpg</a> <br> <br>"Bra: A Thousand Years Of Style, Support &amp; Seduction" by Stephanie Pedersen <br><a href="http://images.amazon.com/images/P/071532067X.01._SCLZZZZZZZ_.jpg" target="_blank">http://images.amazon.com/images/P/071532067X.01._SCLZZZZZZZ_.jpg</a> <br> <br>My friend Dave at Getty confirmed that this is one of theirs, "Image # 200018296-001, from our 'Taxi' collection." <br> <br>Are we supposed to be titillated? <br> <br>M.</p>
