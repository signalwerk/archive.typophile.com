  html: |-
    <p>This is how it works:</p>
    <ul>
    <li>A couple of words are published in the Type ID Pop Quiz, possibly -- but not necessarily -- providing a hint.</li>
    <li>Try to identify the typeface. To win, you need to <strong>e-mail me both the correct name and weight. Do not reply in the thread itself to allow other enthusiasts to participate.</strong>
    </li><li>Show off your knowledge by casually mentioning additional trivia, like who designed it, when and by whom was it (first) published, and other cool stuff to impress your fellow Typophiles with.</li>
    <li>Every week a new challenge will be posted.</li>
    </ul>
    <p>In case of any disputes, I will act as judge, jury and avenging angel of wrath.</p>
    <p>If you think this is too easy, maybe try the <a href="http://typophile.com/node/31363" rel="nofollow">Intermediary Level Type ID Pop Quiz</a> or <a href="http://typophile.com/node/31364" rel="nofollow">Expert Level Type ID Pop Quiz</a>.</p>
    <p>Good luck everyone, and have fun. ;^)</p>
    <p><em>With respectful thanks to the originator of this utterly useless but highly entertaining waste of time, the often imitated but never duplicated Cheshire Dave.</em></p>
