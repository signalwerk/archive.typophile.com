      <p>As usual, Stephen Lording's answer was very complete:</p>
      <p>&gt; <em> It's Trebuchet, designed in 1996 for <a href="/wiki/Microsoft" class="freelinking" rel="nofollow">Microsoft</a> by Typophile's own <a href="/wiki/Vincent%20Connare" class="freelinking" rel="nofollow">Vincent Connare</a>. Designed for easy screen readability, it comes bundled with Windows and is apparently the default font for title bars in Windows XP. (Not being a Windows person I'm unable to verify this bit of trivia.)</em></p>
      <p><a href="http://www.microsoft.com/typography/web/fonts/trebuche/default.htm" rel="nofollow">Connare says</a> that the name came out of a discussion he was having with some colleagues about trebuchets. As a trebuchet launches missiles, he thought it would be "a great name for a font that launches words across the Internet."</p>
      <p>Thnaks to everyone for participating. New challenge coming up. ;^)</p>
