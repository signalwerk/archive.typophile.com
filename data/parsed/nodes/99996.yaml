    html: |-
      <p>This looks like a proprietary dot-matrix printer font, which means it's stored in the printer's ROM and it could be specially designed for a specific printer model. This make it rather improbable to find a modern vector font to exactly match your sample.</p>
      <p>You can try though something similar as <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Berthold&amp;ffam=Akzidenz-Grotesk%20Condensed%20BQ%20-%20Light&amp;fstyle=&amp;fsize=60&amp;fid=b863d77d16d773f4a02f1fb75dcde3ac&amp;wrap=2&amp;text=27%2F081017%3A43" rel="nofollow">Akzidenz Grotesk Condensed BQ (Light)</a></strong> or do a general search for <strong><a class="freelinking external" href="http://www.myfonts.com/search/matrix/fonts/" rel="nofollow">"Dor Matrix" style</a></strong> fonts.</p>
