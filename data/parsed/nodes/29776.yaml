    <p><b>Typophiles for Peace</b><br><br>
    When the War on Terror was in its early stages in 2003, the Typophile community responded by creating a digital quilt to express their viewpoints. Participants were encouraged to submit a 100 x 100 tile and a link to a site of their choice.<br><br>
    Unfortunately, the messages herein are just as relevant today as they were three years ago. If you'd like to add tiles to this growing work, submit them as Comments [requires login] and we'll harvest them into the quilt as we go.<br><br></p>
