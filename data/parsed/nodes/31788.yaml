      <p>OK T Bones, sorry for this little diversion. Here's some more suggestions:</p>
      <p><a href="http://www.fontshop.com/showfont.cfm?fid=FB.106472.0.0" rel="nofollow">Dispatch</a> and <a href="http://www.fontshop.com/showfont.cfm?fid=GF.118888.0.0" rel="nofollow">Freight Micro</a> are very nice, somewhat more angular alternatives.</p>
      <p><a href="http://www.fontshop.com/showfont.cfm?fid=M.230.0.0" rel="nofollow">Monotype Ionic</a>, when used big, has a similar appearance to Clarendon Light, but with slightly more stress (looks more handmade).</p>
      <p>And I've always liked the generous width of <a href="http://www.fontshop.com/showfont.cfm?fid=UR.110085.0.0" rel="nofollow">Volta</a>.</p>
