      <p>Hi,</p>
      <p>I think it does not look too bad, but the scope is still a bit limited. You show off mostly logos, but a logo is mostly only part of an identity, so show how it is used in the context, where possible.<br>
      The Boy Scouts of America Mid-America Council seems to be a good client, so try to show more of the work you did for them, like posters, brochure covers but also content pages showing detailed typography. You could also show some sketches to highlight the thinking behind the work.</p>
      <p>Try to really make your Portfolio stand out, select only the best works, and the works that best highlight the skills you have. I don't really understand some of the choices you made, and why some stuff is in your online portfolio but not in the PDF, and vice versa. IMHO I would ditch the Nebraska posters, as I do not think it is very inspired, quite generic. If you want to use this portfolio to get hired in a good firm, it should really make you stand out, and be original.</p>
      <p>just my 50 ¢...</p>
