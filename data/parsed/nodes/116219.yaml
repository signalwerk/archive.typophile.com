    html: |-
      <p>I would add a very thin border to the Nebraska and Nationalites ones to define the edge. (Although the Nebraska one seems to have it already in the PDF version.)  </p>
      <p>I agree with the comment about showing collateral pieces (a good mockup is fine), and also that a good black &amp; white version is needed for every logo, but if you show a b&amp;w version too I'd make it small (electronic media in full color is rapidly replacing print). That would also show the logo works in a small size.</p>
      <p>But I don't think the 3 or 4 color idea is as important as it used to be (unless it just looks better that way). The client gets free color in electronic media, and in print media can use 4-color process if the budget allows or one color in budget jobs.</p>
