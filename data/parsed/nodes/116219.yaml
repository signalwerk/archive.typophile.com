      <p>I'm all for college education, but I'm not sure that a master's degree is all that important in graphic design unless you plan to teach. But a bachelor's degree can be helpful as some design firms like to hire designers who have them, plus obviously good education and training is a good thing.</p>
      <p>Also a student needs to think carefully about whether they are more comfortable in the fine arts  or in graphic design. Some overlap but they are very different professions.</p>
