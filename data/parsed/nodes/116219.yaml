  - id: 577620
    user: 7409
    date: 2014-05-05T04:13:00
    date_raw: 5 May 2014 — 4:13am
    votes: null
    html: <p>You both make good points and an associates degree is a good place to start - my point is that may not be the job you want to have for the rest of your career. And what you say about only needing a Masters if you want to teach may be good advice today but not in ten years. Maybe a BFA in Design and an MBA might be a good combo (or Marketing, Communications, or Advertising). No one path is good for everyone and I know good designers who have no degrees and are successful, just do not close off options early in your working life. A good college education does not just make you "book smart" it teaches you to think and to see beyond what you know. If you are only learning computer programs and techniques in your courses realize you do need more than just that to become a true "creative."</p>
