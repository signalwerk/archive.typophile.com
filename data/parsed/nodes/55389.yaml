      <p>This is a very good effort for a sophomore. Definitely better than what I had. Things to work on:<br>
      • Reconsider the way you use space with the logo/menu/clickable images. Right now these three items are not integrated, and do not integrate with the presentations below. Consider how it will work once you expand to sixteen pieces, or with an odd number of pieces.<br>
      •&nbsp;Keep your photography style consistent. Do not photograph your work against a dark color unless you have to do it to get a shot.<br>
      • Don’t use Flash for the image zooms. It’s unnecessary, irritating, and feels disconnected from the rest of the site.<br>
      • Make the image zooms work. Do not put links in a web site just because you’ll make them work later.<br>
      • Use bigger images and set up slideshows instead of having a collection of little postage-stamp images. Do not use Flash for this.<br>
      • Target this site at higher resolutions—not many designers are reviewing portfolios at 800x600.<br>
      • Your resume needs proofreading. Personally, I wouldn’t put my GPA on a resume unless it gets above a 3.0.</p>
