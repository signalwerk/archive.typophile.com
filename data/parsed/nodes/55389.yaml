      <p>Not bad for a sophomore. While currently not being bad, I'd recommend continuing to develop an eye for color theory and typography. This mostly comes from simple practice and a closer attention to how others work with it.</p>
      <p>The layout of the site isn't the most exciting thing I've seen. It gets the job done.</p>
      <p>When loading the Times essay, I couldn't close the lightbox. This would be VERY annoying to a prospective employer.</p>
      <p>The line length on the blog is too long.</p>
      <p>The work as a whole is OK, but nothing all that interesting. The most interesting was a color study.</p>
