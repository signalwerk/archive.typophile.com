      <p><cite>In comparing Pages to InDesign, I am interested in knowing if the algorithms for typesetting would be nearly indentical (at least, for my purposes.) For example, is tracking in either program equally sophisticated?</cite></p>
      <p>AFAIK, Pages doesn't have any equivalent to InDesign's paragraph composer, so the algorithms for typesetting differ greatly in terms of line break choices.</p>
