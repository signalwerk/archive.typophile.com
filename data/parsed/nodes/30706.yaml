    <p>Does anyone have experience using Pages for layout?  I only need to work in small relatively simple documents, poems that are 1-3 pages.  </p>
    <p>In comparing Pages to InDesign, I am interested in knowing if the algorithms for typesetting would be nearly indentical (at least, for my purposes.)  For example, is tracking in either program equally sophisticated?  </p>
    <p>I gather InDesign's optical spacing would be one major difference between the two programs.  Are there any other differences I should know about?</p>
    <p>thanks &amp; cheers to all!</p>
