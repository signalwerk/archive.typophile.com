      <p>InDesign is a more complete solution if you are going to hire a commercial printer to publish your documents. </p>
      <p>Pages supports most of the things you might want to do in a page layout program, but it is missing certain things. For instance, I don't think it supports bleeds. You could work around this by using a larger page size and setting up your "real" page inside that, complete with crop marks and bleeds, but it would mean extra work.</p>
      <p>Pages supports many of the typographic controls that InDesign does, but it's less robust and some things are somewhat hidden. For instance, to use OpenType features, you have to choose Format &gt; Font &gt; Show Fonts... and then choose Typography... from the tiny pop-up menu with the gear on it in the lower part of the Font panel.</p>
      <p>InDesign has complete "pre-flighting" features, can work with spot colors, has more sophisticated typographic controls, etc., etc. It's designed for professionals working with commercial printers and can handle practically anything you can think of. Pages can do a lot, but it's definitely more limited. That's not to say it wouldn't work for you, it just depends on what you need to do.</p>
      <p>Finally, if you do use Pages, I would recommend exporting to PDF and send the PDF to the printer. I very much doubt that a commercial printer or service bureau will accept Pages documents.</p>
