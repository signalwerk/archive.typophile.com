  html: |-
    <p>Curious if anyone has read this new book, "Type Navigator" by Jan Middendorp. I loved his history of design in Den Haag ("HA,"), and of course the amazing "Dutch Type" book from 010 publishers.</p>
    <p> <a class="freelinking external" href="http://usshop.gestalten.com/books/new/type-navigator.html" rel="nofollow">Here's some more info</a>. </p>
    <p>Also, what's up with that CDROM? 100 typefaces? Are those just visual references or am I smelling some kinda deal here...(shameless, I know).</p>
