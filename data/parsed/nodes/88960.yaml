    html: |-
      <p>Participants were asked to provide fonts and information for the specimen pages.<br>
      Having fonts on the CD was optional, with participants choosing which.<br>
      (Disclaimer: Shinntype is included in the book, but we declined to put fonts on the CD; I don’t recall why.)</p>
      <p>This kind of arrangement is similar to <em>Indie Fonts</em>, although in that publication participants also created editorial pages (custom for an introductory page, and adapting a template for specimen pages), whereas in <em>Type Navigator</em> the design is entirely by the publisher.</p>
      <p>Jan Middendorp’s previous “foundry compilation” book, <em>Creative Characters</em>, has no bonus font CD.</p>
