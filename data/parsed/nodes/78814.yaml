    <p>Hello,<br>
    I may be the last one to have seen this piece on Vimeo, but I did a quick search here and found no mention of it. I think this is a stunning example of how animated typography can make poetry "speak" far more eloquently than it does by itself, either as a "typeset" missive or purely as spoken word performance. You can see the Video here: <a href="http://vimeo.com/3829682" title="http://vimeo.com/3829682">http://vimeo.com/3829682</a> and my commentary at Alphabet Roadtrip here:<br>
    <a href="http://alphabetroadtrip.typepad.com/alphabetroadtrip/2011/02/taylor-mali-ronnie-bruce-making-the-spoken-word-visible-like-totally.html.html" title="http://alphabetroadtrip.typepad.com/alphabetroadtrip/2011/02/taylor-mali-ronnie-bruce-making-the-spoken-word-visible-like-totally.html.html">http://alphabetroadtrip.typepad.com/alphabetroadtrip/2011/02/taylor-mali...</a><br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/RonnieBruceTypography_6397.jpg"></div><p></p>
