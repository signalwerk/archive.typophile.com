    <p>looking for digital versions of these two typefaces. not looking for something close, unless it’s an exact replica. </p>
    <p>We have original type samples from c1924</p>
    <p>anyone have any ideas of where i can find these digitally to buy? </p>
    <p>found the “new” distributors of the old Ludwig &amp; Mayer here (scroll down to ludwig)</p>
