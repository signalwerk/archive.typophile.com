      <p>The Cool Kid: Neutraface is a nice option, but so are a lot of other House Fonts. </p>
      <p>The Gay Type: United from House Industries. See, Fox sports uses it, and trust me (I'm queer as a three-dollar bill) football is overflowing with gay guys, so use United.</p>
      <p>The Miss World Face: The new Luxury family from House wins again. If you can't get that one, just use Mrs. Eaves</p>
      <p>The World's Strongest: Akzidenz-Grotesk super wins here. </p>
      <p>The Slag of all typefaces: Arial. </p>
      <p>As for Helvetica... man, you're a design student. Use cool fonts now so that when you get stuck using Helvetica later you haven't already gotten sick of seeing it. Hell, unless you can do it at 200 picas or bigger, just don't use Helvetica at all.</p>
