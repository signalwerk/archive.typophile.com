      <p>Din is the kid who's editor of the yearbook, valedictorian, star of the school play, and everybody tries to be just like him.</p>
      <p>Comic sans is the kid who thinks he's funny but people are laughing at him, not with him.</p>
      <p>Times Roman is the kid who does all the grunt work to please the teacher. You can't get rid of him.</p>
      <p>Arial is the kid your mom makes you invite to your birthday party because you invited the rest of your class but nobody talks to him - he sits in the corner picking his nose and licking the frosting off the bottoms of the candles</p>
      <p>Eclat is popular (at least on this site) as are the House Industries kids</p>
      <p>Gotham - everybody likes gotham, nice to the dweebs as well as the cool kids</p>
      <p>Papyrus is the faux intellectual nobody listens to when he raises his hand in class</p>
      <p>Mrs. Eaves is lovely and mysterious but kind of hard to get along with</p>
      <p>Myriad is really really boring but gets good grades. Hangs out with Verdana</p>
      <p>Avant Garde seems boring at first but has his own sense of style</p>
      <p>Dax tries too hard to be cool</p>
      <p>Gill isn't as interesting as he seems</p>
      <p>Matrix is the kid who was cool a few years ago and thinks he still is... but the joke's on him</p>
