    <p>Hello everybody,</p>
    <p>Well I'm new here, and I'm about to start a kind of poster project about type and the characteristics of it, I was thinking of having a school of type, where for instance, Helvetica would be the cool kid and Comic Sans would be the kid nobody liked.</p>
    <p>Thats the basic idea, but what I was looking for, is what you guys think about typefaces and the reputation that suceeds them.  A few questions...</p>
    <p>Is there a gay typeface?<br>
    Is there a typeface that would win Miss World?<br>
    Maybe the worlds strongest man?<br>
    What is the slag of all typefaces?</p>
    <p>I would really appreciate your comments, as I am aware that you are all much more experienced than me in this field...</p>
    <p>Thanks guys,</p>
    <p>Tom<br>
    Graphic Design student</p>
