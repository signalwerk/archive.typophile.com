  html: |-
    <p>Hello<br>
    This is a photo segment of Herb Lubalin's type mural for the CBS building that was created in the late 1960s/early 1970s.<br>
    I assume this was hand-drawn at the time, and it was definitely pre-digital, I'm just wondering if anyone has ideas for something similar to this compressed sans. The closest I could come was Helvetica Ultra Compressed, but it's not as compressed and it feels too open.<br>
    Any ideas would be greatly appreciated!<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/bouillabaisse_type_2_4094.jpg"></div><p></p>
