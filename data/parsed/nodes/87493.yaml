  html: |-
    <p>I have this small Python script that, for some reason, won't seem to terminate. The 2nd file that it's writing does not complete unless I click the "Reset macro system" button on the macro palette.</p>
    <p>Any ideas?</p>
    <p>Thanks,<br>
    Ken</p>
    <p><code>BearLeft = fl.glyph.GetBoundingRect().x<br>
    BearRight = fl.glyph.width - fl.glyph.GetBoundingRect().ur.x<br>
    if BearLeft &gt;= 0 and BearRight &gt;= 0:<br>
    <em>print "This glyph does not have a negative bearing."<br>
    else:<br>
    <em>finame=str("C:\Program Files\FontLab\Studio5\Macros\Bearings Fix Old Left.txt")<br>
    <em>TheFile = open(finame, "w")<br>
    <em>TheFile.write(str(BearLeft))<br>
    <em>TheFile.close<br>
    <em>finame=str("C:\Program Files\FontLab\Studio5\Macros\Bearings Fix Old Right.txt")<br>
    <em>TheFile = open(finame, "w")<br>
    <em>TheFile.write(str(BearRight))<br>
    <em>TheFile.close</em></em></em></em></em></em></em></em></em></code></p>
