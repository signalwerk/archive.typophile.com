      <p>Hi Diogo,</p>
      <p>I would guess that is not a font, as such, but is a logotype created specifically for the brand. Although having stated that, it does look as if it could have started life as Futura Medium Condensed and has subsequently been hacked around, especially the cap "S" which has a rather Art Deco styling.</p>
      <p>Hope this helps.</p>
      <p>If not you could always contact the manufacturer of the product for assistance! They have an even better example of the logo, which you could download and redraw, here:</p>
