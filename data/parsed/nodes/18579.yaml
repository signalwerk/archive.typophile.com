    html: |-
      <p><em>why so absolute?</em></p>
      <p>If an organization has a code of ethics, the members should abide by it.<br>
      But it's not like professional organizations want to outlaw the behaviour for non-members.<br>
      They will point out how it's in the interests of design-buyers to avoid commissioning spec work, because they truly believe that's better for design in general, as well as for professionals.</p>
      <p>I'm on the side of not seing people exploited, irrespective of talent.<br>
      I'm suspicious of "public good" projects that ask for volunteer work, such as preparing briefs for illustrators, with pefect typography, because the person asking usually has some kind of grant paying them for their work.</p>
      <p>I checked out this Caravan Project web site, and there's nothing about "who we are", which sets off the bullshit detector alarm bells. Betcha Big Oil ain't paying to tow the caravan from A to B. Also, I think copyright is a good way to protect intellectual property, so creatives don't end up working for nothing -- so I ain't got no kind words for the we-want-your-best-for-nothing "no copyright" crew.</p>
      <p>I don't enter competitions these days, because, especially in type design, it's a lot of work and expense preparing specimens, and those who organize the competitions (and print the literature and awards books) get paid for their work; the winners get publicity, funded by the losers.</p>
