    html: <p>I don't think the way to get people interested in art is to keep making conceptual art, as I assume you are, Freddeuk, from all the stuff about art as communication, the virtue of provocation, and bad art as the product of "unfinished or weak concepts". The problems with conceptual art are that most visual artists are bears of very little brain, so their insights are worthless; that the people don't want to spend their weekends going to see the embodied big ideas of idiots; and that visual art, <em>contra</em> every exhibition catalogue produced in the last forty years, cannot "explore" "issues" because it doesn't have the structured semantic opportunities that language has. If you want to end the low-grade elitism of galleries now, direct your bile at conceptual art. Race-gender-class prejudice is hardly a dominant force in the art-world, for God's sake! Attributing all ills to that kind of elitism seems a bit odd after the long purge of elitism has has created this sea of gurk, in which people as obviously incompetent as you expect to be taken seriously as theorists.</p>
