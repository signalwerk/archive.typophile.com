    <p>THE CARAVAN PROJECT<br>
    Read manifesto on homepage.</p>
    <p>-----------------------------------------<br>
    Today we launch a brief for typographers<br>
    all over the world. The brief is:<br>
    "Communicate with an illustrator".<br>
    We need the best typographers in the<br>
    world to design a brief for the best<br>
    illustrators in the world. Since the<br>
    brief has to not only inform but also<br>
    inspire illustrators we will settle<br>
    for nothing less than perfect typography.</p>
    <p>More info about the project:<br>
    <a href="http://www.thecaravanproject.com" rel="nofollow">www.thecaravanproject.com</a></p>
