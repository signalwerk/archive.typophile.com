      <p>Different things work for different people. Sure, sometimes people do spec work out of weakness, but not always. Pretending it's Evil and it should be verboten is a good tactic if you're an established professional in an affluent society who is mostly interested in making more money (by trying to discourage spec work on the part of others). To be fair though, some people discourage spec work because they -incorrectly- assume it's pure bad for everybody. Humans aren't so simple.</p>
      <p>hhp</p>
