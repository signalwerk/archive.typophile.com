    html: |-
      <p><em>making more money</em></p>
      <p>Well yes, that's one way to distinguish professionals from amateurs.</p>
      <p>Of course there is self interest involved, but it's cynical to assume it's the only motivation; as you say, humans aren't so simple. The people who organize their professions are volunteers whose bottom line would have been much better if they hadn't spent so much time volunteering. But they do it to raise the status of the profession in general, and part of that is increasing the value of that kind of work in the marketplace, for everyone who does it, not just the professional elite who made the grade and pay their dues. By having a code of ethics that prohibits members from doing spec work, professsional organizations may in fact hamper members from getting work that goes to those prepared to compete with spec.</p>
      <p>If professions don't organize, they will be populated by contract workers without benefits -- Bush's "entrepreneurs" -- who will be exploited by a capitalist marketplace dominated by powerful corporations. Graphic design freelancers are such entrepreneurs.</p>
      <p>I'm surprised you would favour capitalism over the worker, Hrant.</p>
