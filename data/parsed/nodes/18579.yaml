      <p>Nick Shinn--&gt;<br>
      The only thing we can tell you<br>
      is the truth. TCP is a non-profit<br>
      project. Your view of volunteerwork<br>
      is very dark and I think its sad since<br>
      probably many designers agree with you<br>
      after failed specworks and such.</p>
      <p>Who we are? We are three graphic designers<br>
      from Sweden. We are all freelancers. What more<br>
      info do you want about us? Do you want us to<br>
      put pictures of ourselfs on the page? Then we<br>
      would def be accused of voyerism and we don't<br>
      want that since we dont want individual attention.</p>
      <p>We will not pay anyone for doing design<br>
      that we view on our webpage or show at<br>
      an exhibition BUT we want TCP to be an<br>
      online and rolling gallery that shows and<br>
      bring together all parts of the designculture.</p>
      <p>We will not sell other peoples work and<br>
      we will not take any profit from other<br>
      peoples work. We think galleries, be it<br>
      online or rolling, should never charge<br>
      designers or people for using it.</p>
      <p>TCP might get attention due to other peoples<br>
      work but isnt that a good thing? To get more<br>
      people involved in ethical and moral issues<br>
      surrounding our culture and design today.</p>
      <p>TCP is a rolling gallery free for anyone<br>
      to use or view. It is supposed to bring<br>
      art, design &amp; culture together and back<br>
      to the people, not manipulate or fool<br>
      designers to do free work.</p>
      <p>We can only be honest about this and it's<br>
      up to you to believe in our ideas or not.<br>
      We just hope that if you dont want or dont<br>
      have time to get involved just visit the<br>
      website now and then to see how the project<br>
      on bringing culture together is going and maybe<br>
      you will see that it's for the good of the<br>
      designers and the people and not for commercial<br>
      matters.</p>
      <p>Np-copyright logo was created since we think<br>
      everything in our culture today is appropriations<br>
      and interpretentions from other peoples work.<br>
      We agree with your view that the copyright symbol<br>
      is good in its way of protecting creatives but we<br>
      also think that those who only copy other peoples<br>
      design and call it theirs isnt real designers and<br>
      probably won't gain from it in the end.</p>
