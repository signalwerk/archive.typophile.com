      <p>Fred, I apologize for doubting your motives.<br>
      Anarcho-syndicalism, go for it.</p>
      <p>My dark view of volunteer work is based on a lot of experience with non-profit groups -- so often the money goes to bureaucrats, and the interests of the organization become compromised by those of the sponsor, in order to keep the organization running. Meanwhile, volunteers are used to do the grunt work. The worst-case scenario is when a non-profit activist group that's been around a while needs to fund a project, but can't pay themselves for the work, however, others may be hired to work on the project. And of course tradesmen, services and materials are also paid for.</p>
      <p><em>Do you want us to put pictures of ourselfs on the page?</em></p>
      <p>Maybe, but I think as designers you should be able to find some way to discreetly provide reassuring background information and context.</p>
      <p><em>We can only be honest about this and it’s up to you to believe in our ideas or not.</em></p>
      <p>That's naive. You really can't expect people to take anything on trust. How is a potential contributor to know whether you intend to publish a book reproducing the typographic briefs, or the illustrations? Good intentions are not enough, people's attitudes can change. What if one of your partners has a change of heart and decides to make some money off the TCP material? </p>
      <p><em> the best typographers ... natural selection</em></p>
      <p>How can you mix elitism with "art for all?"</p>
