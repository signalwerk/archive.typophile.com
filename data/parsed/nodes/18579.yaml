      <p>I think that since we never have had any interest<br>
      in profit in The Caravan Project we didnt question<br>
      how other people would see it. Now I start to see<br>
      why people missunderstand our whole message.</p>
      <p>1. TCP is not a company or sponsored by a company.<br>
      The Caravan Project is a rolling gallery that will<br>
      give local artists and designers the chance to show their<br>
      work without having to go through the posh and pretentious<br>
      galleries.</p>
      <p>2. The whole idea with the brief was not to get alot of<br>
      spec work. We simply wanted others to be as passionate as<br>
      us about our project and instead of just showing our own<br>
      work and copyright everything we did we wanted to show as<br>
      many talented designers as possible and also try to make<br>
      people think about copyright since it nowdays is missused<br>
      in many ways through interpretentions almost identical to<br>
      the originals.</p>
      <p>3. We on TCP wanted to contribute to swedens most cultural<br>
      and alternative music festival. We didnt want anyone to<br>
      specwork for us. We simply wanted as many motivated creatives<br>
      as possible to join in, be it illustrators, typographers, artists<br>
      or musicians, and in the end try to get the ones involved attention<br>
      through an exhibition in Swedens capital Stockholm.</p>
      <p>4. To answer both Nick and Chris about elitism and art for the people I would like to clarify the manifesto since it obviously is missunderstood as it is today.</p>
      <p>"A gallery should never forbid an artist to show his/her work"<br>
      No discrimination shall be allowed be it racial, genderbased, ethical, class etc..</p>
      <p>"Unfinished and weak concepts should not be exhibited"<br>
      Just because it isnt pretentious and posh it doesnt have to be a unprofessional and less qualitybased gallery.</p>
      <p>"Provoking art should never be disallowed as long as the artist can explain why he/she wants to create it"<br>
      Art and design that are provoking should never be rejected just because it is provoking. The artist or designer must always have<br>
      the freedom to provoke. But the artist/designer must have a meaning as for why he/she wants to create the provocation.</p>
      <p>"There must always be a general interest in art and design. Today the public tend to avoid the galleries that from the beginning was made for them"<br>
      What about it? Who can argue against that most galleries today have a strange athmosphere where people are not quite themselves and dont dare to ask or debate the works on the big white walls.</p>
