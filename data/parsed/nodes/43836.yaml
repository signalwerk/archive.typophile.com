    <p>I saw this newspaper while in Berlin a while ago and thought the layout was very appealing and unconventional. It’s distributed on a weekly basis, and the content is mainly politics (from a left wing perspective as far as I could understand). There’s one typeface that is used throughout the newspaper, both in display and text, and at first glance I thought it was <a class="freelinking-external" href="https://web.archive.org/web/20080907160715/http://www.underware.nl/site2/index.php?id1=dolly&amp;id2=roman">Dolly</a>. But it’s less fluffy and has more serif in it.</p>
    <p>Thanks,<br>
    Malte</p>
