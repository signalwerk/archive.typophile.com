  html: |-
    <p>Hi,</p>
    <p>So I run the site <a href="http://thebudgetgraph.com/index.php" title="http://thebudgetgraph.com/index.php">http://thebudgetgraph.com/index.php</a> where every year I create a huge graphic guide to the federal budget.  You can see it here, </p>
    <p><a href="http://thebudgetgraph.com/view/" title="http://thebudgetgraph.com/view/">http://thebudgetgraph.com/view/</a></p>
    <p>as you can see there is a lot of type, infact its the limiting factor interms of how much data i can put into the project.  Well this year I have a larger data set so I will need smaller more compact type.  Before I was using Helvetica Neue medium condensed at mostly 10point and 12point for headers.  But this isn't cutting it this time.</p>
    <p>So im looking for suggestions for a new font.  It needs to be condensed more than anything since the length of each line is what limits the design and data.  But it also has to be readable and breathable.  It also has to be sans serif.</p>
    <p>I was considering Gil Sans MT Condensed at 11point but any other suggestions would be great.</p>
    <p>Thanks</p>
  html_clean: |-
