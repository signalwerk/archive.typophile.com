      <p>Ok, after running a few test prints I am going to run with Frutiger Condensed at 8pt.  Thanks for the suggest carlos.  It seems very open which is good when there is so much data and text hitting the viewer in the face.  at 8pt it still maintains good clarity and contrast.  Bell Centennial and trade gothic seemed a bit too emaciated at 8pt when its white on black.</p>
      <p>Amplitude condensed regular 9pt was also a contender as it will save me an extra 2mm on average. I might switch if I need those milimeters.  Myriad Condensed at 10pt I might use aswell as it saves as much space as Frutiger with a little extra height.  Anyone know how Myriad differs from Myriad Pro?</p>
