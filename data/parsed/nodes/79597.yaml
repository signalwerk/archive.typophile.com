    html: |-
      <p>My effort was to try to make the font like the original. I've used it for a business card, and I must to say is that it worked just fine.</p>
      <p>The Canada Type is a very good font, but:<br>
      - The capital B is too different from the original (too wide and too optical corrected).<br>
      - The capital G has the orizontal bar too high.<br>
      - The capital J is invented.<br>
      - The capital L is too wide.<br>
      - The capital P is different (the bowl has a totally different shape).<br>
      - The capital R is absolutely wrong (too wide and the leg is too angled).<br>
      Strange enough, they made a very good work with the lowercases (strange cut at the base of the lowercase J, and strange lowercases H, M and N, but I think they get the spirit of the other letters), but numbers are totally invented.</p>
      <p>PS: I've published the font in the October of 2010, the Canada Type is of the August 25, 2011 (according to what is written on MyFonts).</p>
