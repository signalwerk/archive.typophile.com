    html: |-
      <p>None of the versions is actually faithful to the original, but given the difficulty non-italian designers must have had to acquire specimen material, I agree Durotype’s version is acceptable (but pretty "invented" in the heavier weights). Plus, all these do not take into account the point sizes: Semplicità was not super-accurately crafted as Simoncini faces would have been, but the small sizes in lead were adequately designed, and spaced.</p>
      <p>@oldnick: I assure you Semplicità is not merely an average "workhorse": as you’d see with printed material at hand it has a quite unique personality, and in Italy it has been a very important typeface.</p>
      <p>I have been working on a proper digital version of it, as I mentioned to Patrick Griffin last year, but it takes ages. It is a very important typeface for me, and I can’t stand those versions, although I appreciate the rough attempt done by Flanker (which should have been the first: I dreamed of a digital version since I started my interest, in the late 1980s).</p>
