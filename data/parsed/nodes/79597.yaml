      <p>Hrant, you have found propbably one of the Achilles' heel of the font. The "s" is wrong (but I like it, is so vintage). The "dreadfulness", as you said, is due to my stubbornness in keeping constant the size of the strokes (yes I like the grotesk fonts).</p>
      <p>The "a" was very close to the original, at last the original from the source that I have (Manuela Rattin, Matteo Ricci, "Questione di carattere. La tipografia in Italia dal 1861 agli anni settanta"), but I can try to improve it. Sincerely I hoped that to judge a font it was necessary, at least, its superficial knowledge.</p>
      <p>Since I am really overworked I probably would not be able to finish the font for a couple of months... If someone of you can provide some good source, it will very appreciated!</p>
