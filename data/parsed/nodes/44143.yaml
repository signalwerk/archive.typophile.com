    html: |-
      <p>The subject line of this thread is unhelpfully vague. If I’m totally blind, do I need a special typeface? If I’m missing a toe?</p>
      <p>In any event, I have read all the claims about typefaces allegedly more compatible with dyslexia and learning disability and they’re all nonsense, as are the fonts themselves. There are a number of very high thresholds to overcome here:</p>
      <ul>
      <li>Typeface must be recognizable as an actual professionally-designed typeface. We may now know what that means, but given the finished font, we know when it <em>didn’t</em> happen.
      </li>
      <li>
      Typeface must work better than rationally-chosen existing fonts in user testing. This tends to be completely screwed up (Cf. Tiresias) and is hard to measure in any case (where “hard” simply means “expensive and involved”).
      </li>
      <li>Entire project must conquer the hurdle that nobody but the commissioning organization is ever, at any time, going to use the resulting typeface. What are LD readers gonna do then?
      </li>
      </ul>
      <p>—<br>
      Joe Clark<br>
      <a href="http://joeclark.org/" title="http://joeclark.org/">http://joeclark.org/</a></p>
