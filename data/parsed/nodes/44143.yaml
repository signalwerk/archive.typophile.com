    html: |-
      <p><em> nobody but the commissioning organization is ever, at any time, going to use the resulting typeface. </em></p>
      <p>Let's see what the font looks like before assuming that.</p>
      <p>However, for a name with mass appeal, Mencap might not be as good as something involving the word "schoolbook", which has a pretty good reputation in type circles. So the organization would have to supress some of its branding in having a typeface named after itself, and accept that there would be some resistance against using a face named Mencap in general publishing not specifically targeting those with disabilities, and choose a disingenuous name instead. But that may not be an issue in light of the role played by the UK government and that country's overbearing bureaucracy, which could result in a growing demand for faces such as this, in the public sphere.</p>
