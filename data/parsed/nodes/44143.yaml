    <p>On Microsoft’s typography section at <a href="http://www.microsoft.com/typography/links/news.aspx?NID=6133" title="http://www.microsoft.com/typography/links/news.aspx?NID=6133">http://www.microsoft.com/typography/links/news.aspx?NID=6133</a><br>
    There is a discussion posted yesterday about the new Jason Smith (Fontsmith) font FS Mencap. Perhaps it is prematurely posted as there does not seem to include any visuals of the font and only contains information about it. As I find the actual visuals equally stimulating as the research behind the design I went searching for such with no luck. I tried Fontsmith.com, and Mencap.org with even less results than what was posted on the Microsoft site. If anyone has links to sites (with the glyphs/visuals) or were working on the project that would be greatly appreciated.<br>
    I would like to learn more about similar fonts designed for people with learning disabilites such as dyslexia, etc... I heard of a font called Read and have read a bit about it a while back, as well as Clearview. Is there any other designs with as much research behind them that anyone knows, and links to such articles?</p>
    <p>Ole</p>
