    html: |-
      <p>As Nick says, it is good that there is a top-notch designer involved in this. My concern from the description is that they seemed to have asked group with disabilities their opinions rather than testing how well they read different fonts. </p>
      <p>I find that often people will say that a particular font is readable because it looks simple, like Helvetica, or because it looks good big in titles. But those qualities might not actually be more readable in text--it might be the opposite. The only way to know is not to ask people's opinions, but to actually comparatively test their reading speed and comprehension with different fonts.</p>
