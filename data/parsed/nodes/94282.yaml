      <p>I asked Ray on Twitter:<br>
      "Sorry, I don't recognize that font. Trivia: I worked as a game tester on the PSX version of that game."</p>
      <p>Your suggestions look very close, indeed, but still no match. Very curious for what font it really is. Probably a freebie or something from a unknown library.</p>
      <p>I was planning to search for and ask the original frontend designer, but it appears he committed suicide in 2007. Very tragic. :(</p>
