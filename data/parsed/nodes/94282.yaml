      <p>Thanks for your reply.<br>
      Indeed looks a bit like Handel Gothic, but it should be a separate font. Especially the numbers are different.<br>
      They actually use "EuroTechnic" instead of Eurostile, so maybe we need to search in foreign libraries.</p>
      <p>More on EuroTechnic:<br>
      <a href="http://fontpark.net/en/font/euro-technic-extended-bold/" title="http://fontpark.net/en/font/euro-technic-extended-bold/">http://fontpark.net/en/font/euro-technic-extended-bold/</a><br>
      "Copyright (c) 1992 Image Club Graphics, Inc."</p>
      <p>Maybe someone else know the exact name of the other font?</p>
      <p>Cheers,<br>
      Martijn</p>
