    <p>After all those years, I'm still wondering what the font used in the GTA2 menu is.<br>
    He is a couple of screens:</p>
    <p><img src="http://i56.tinypic.com/24vig6x.jpg"></p>
    <p><img src="http://i55.tinypic.com/2wd972a.jpg"></p>
    <p><img src="http://i52.tinypic.com/1191p1k.jpg"></p>
    <p><img src="http://i52.tinypic.com/qrn40p.jpg"></p>
    <p>Please note I mean the not-Eurostyle-one and that I have a Dutch modification installed.</p>
    <p>Who can give me the final answer?<br>
    Thanks in advance!</p>
    <p>Cheers,<br>
    Martijn</p>
