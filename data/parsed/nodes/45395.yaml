      <p>I don’t think it will be easy to do this without some programming, or a repetitive motion injury-inducing amount of mouse clicking.</p>
      <p>You basically need to loop through the entries in the cmap and produce a string corresponding to each character code, appending to an output string. It seems like it should be possible to do something like this in FontLab using Python. As I am fairly non-Pythonic I cannot offer any specific advice (I achieve the same thing using tools written in another programming language instead), but I can suggest this non-language-specific pseudo-code:<br>
      <code><br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;for each characterCode in fontUnicodeArray:<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;set myString to myString + unichr(characterCode)<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;next</code></p><code>
      </code><p><code>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;print myString<br>
      </code></p>
      <p>“unichr” is a function that converts a number (i.e. character code value) into a Unicode string. I believe Python has a something like that ;-)  Maybe you or someone else can fill in the other bits in proper Python (and FontLab) form and get what you’re after...</p>
