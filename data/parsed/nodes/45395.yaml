      <p>I’m not sure if this is what you’re asking, but in illustrator and indesign, you just have to open the glyphs pallette by going to TYPE&gt;GLYPHS.</p>
      <p>You can click each one to get it’s unicode, or double-click it to put it into a selected text field.</p>
      <p>Also, Apple’s TextEdit has a similar window EDIT&gt;SPECIAL CHARACTERS (cmnd+opt+t). This will actually give you a lot more information than illustrator or indesign do.</p>
      <p>I’m sure there’s a way to do it in word, but I never use it.</p>
