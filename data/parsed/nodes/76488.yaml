  html: |-
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Picture-3_5063.jpg"></div><br>
    If it weren't for the G's spur [and its date of production], I'd identify this as Gotham.<p></p>
    <p>The opening titles were done by Stephen Frankfurt. There are at least two weights of the type in question used. It's quite close to a tightly kerned Akzidenz Grotesk Bold, but feels a bit shorter. Could it be a lesser-known version of a famous typeface, say, Ludlow's Record Gothic? Could it be small caps? Were small caps ever offered with Franklin/News/Trade Gothic?</p>
    <p><a href="http://www.youtube.com/watch?v=5GNJvBtrUrg" rel="nofollow">The opening titles on YouTube</a>, I link to this one with an alternate soundtrack because of the ones I've found, this one distorts the picture's dimensions the least.</p>
    <p><a href="http://casaforte.blogspot.com/2010/09/stephen-frankfurt.html" rel="nofollow"></a></p><div class="imageWrap"><a href="http://casaforte.blogspot.com/2010/09/stephen-frankfurt.html" rel="nofollow"><img src="http://typophile.com/files/mockingbird_contact_4731.jpg"></a></div><p></p>
