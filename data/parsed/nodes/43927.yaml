      <p>Hahnemuhle has a couple of dual sided papers that might be nice. The Natural Art Duo is .15mil and Photo Duo is .18mil. They come in sizes up to 17x22 inches and may come in rolls. You can check out <a href="http://www.itsupplies.com" title="www.itsupplies.com">www.itsupplies.com</a> or <a href="http://www.atlex.com" title="www.atlex.com">www.atlex.com</a>. You could also check with <a href="http://www.shadesofpaper.com" title="www.shadesofpaper.com">www.shadesofpaper.com</a>. Any of those vendors are helpful.</p>
      <p>I don’t really know if these would be too heavy or not but they are nice papers. Epson’s enhanced matte dual-sided papers are nice too and don’t seem overly heavy. I don’t know about the sizes but it should come on a roll.</p>
      <p>Sharon</p>
