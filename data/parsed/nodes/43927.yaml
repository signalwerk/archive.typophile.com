    <p>Hi, I’m a student working on putting a bunch of portfolio books together for the end of the semester. I have to print all my work with my Epson R1400, and I have been having trouble finding good paper to print on. The main problems I run into are that the paper is not double-sided, it is not made for an inkjet printer, or the paper is too thick for pages in a book. I printed one of my books on Ilford Galerie Smooth Matte Multi-Use Dual Sided Inkjet Paper... but I can’t seem to find the paper any larger than 8.5 x 11, which was fine when I was perfect binding, but now it is too small.</p>
    <p>So... Does anyone know of any good inkjet paper to print images on for a book?<br>
    Any help would be wonderful. Thanks!</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/44035" class="topic-previous" title="Go to previous forum topic">‹ Linotype FontExplorer for Windows... When?</a> <a href="/node/44036" class="topic-next" title="Go to next forum topic">Calligraphic fonts - recommendations ›</a></div>
