      <p><cite>James, I wonder if Staple’s matte paper is made by Epson? It wouldn’t surprise me.</cite></p>
      <p>I doubt it. It’s got a different feel than Epson paper.</p>
      <p><cite>…but I know a few folks who have used the Staples printer ink in their Epson and who thought the black was fine, but the colours left something to be desired.</cite></p>
      <p>I did a lot of reading before I loaded up my R1800, and it seems to be one of those things that varies wildly by model. The newer Epson photo printers are much pickier than the old ones. </p>
      <p>Kodak is betting on a business model that involves selling inkjet printers at a profit and the ink at low prices. Unfortunately the quality is not up to professional work, and none of the printers handle paper larger than US Letter/A4. </p>
      <p>Anyway, my new Epson is already starting to streak, although that might just be because I loaded a few sheets backward and need to open the heads back up. But next time around I’m going with a Canon.</p>
