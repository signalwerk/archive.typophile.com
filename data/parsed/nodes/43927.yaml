      <p>I do a lot of my bookbinding work using cut-down sheets of Strathmore Aquarius II (it comes in 22 x 30 sheets with side deckles) and it runs through just fine on my Epson SPR300, even though it’s supposedly “not recommended.”</p>
      <p>You might want to find a god art supply store that has packages of paper samples (Talas, for example, since it’s in Manhattan), buy one, and try running as much as you can (and like) through.</p>
