  html: <p>Hi, I searched through the posts on the forum but couldn’t really ﬁnd what I needed. I’m doing research in my graphic design ethics class for my assignment which is to ﬁnd out what would happen if someone was to use a licensed font on a poster without paying, but instead borrowing that font from someone else who bought it. I need to ﬁnd out if that would be breaking any laws, what kind of copyright protection is available for the font,  and if you were reported to <span class="caps">RCMP</span> by someone, what could happen to you and the client you made the poster for? <br><br>Searching the internet I haven’t found much info, and most of it is American. I know in the States for example that font can only be patented and not copyrighted, though font programs can be copyrighted, even though the fonts that you view with it are not, which seems to mean that you could get away legally with using a font you don’t own? <br><br>Anyways, it would be nice if someone could please point me towards some info regarding this, especially how it pertains to&nbsp;Canada.</p>
  html_clean: <p>Hi, I searched through the posts on the forum but couldn’t really ﬁnd what I needed. I’m doing research in my graphic design ethics class for my assignment which is to ﬁnd out what would happen if someone was to use a licensed font on a poster without paying, but instead borrowing that font from someone else who bought it. I need to ﬁnd out if that would be breaking any laws, what kind of copyright protection is available for the font,  and if you were reported to <span class="caps">RCMP</span> by someone, what could happen to you and the client you made the poster for? <br><br>Searching the internet I haven’t found much info, and most of it is American. I know in the States for example that font can only be patented and not copyrighted, though font programs can be copyrighted, even though the fonts that you view with it are not, which seems to mean that you could get away legally with using a font you don’t own? <br><br>Anyways, it would be nice if someone could please point me towards some info regarding this, especially how it pertains to&nbsp;Canada.</p>
