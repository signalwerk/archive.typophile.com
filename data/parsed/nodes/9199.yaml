    html: <p>In the USA, the font software, which is the font file that was "borrowed" in your example, is protected by copyright. <br> <br>The design may be protected by design patent. This protects the abstract shapes. <br> <br>The name may be protected by trademark. <br> <br>I found plenty of interesting links by Googling "RCMP copyright enforcement" (without the quotes). It seems that copyright infringement can be a federal criminal offense in Canada. <br> <br>Regards, <br> <br>T</p>
