    html: <p>In Canada, a typeface <i>design,</i> as distinct from the copyrighted font software, falls under the Industrial Design Act, which provides for a shorter period of protection than copyright, and may be considered akin to patent protection in the USA. I'm not sure, however, whether the filing requirements are comparable.</p>
