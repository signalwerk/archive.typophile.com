    html: <p>Any font licensed is only licensed to be used at the address for which it was originally licensed. It would be illegal to use the font, even if only borrowing it. The only loophole would be if the given foundry from which you licensed the typeface has transferability built into their <span class="caps">EULA</span>. In that case the person whom originally licensed the type would need to contact the foundry and transfer all rights of use to the new address and that person would have to remove the typeface from their location. <br><br>John, please go the <span class="caps">RELEASE</span> area. There are several discussions on <span class="caps">EULA</span>s (End User License&nbsp;Agreements).</p>
    html_clean: <p>Any font licensed is only licensed to be used at the address for which it was originally licensed. It would be illegal to use the font, even if only borrowing it. The only loophole would be if the given foundry from which you licensed the typeface has transferability built into their <span class="caps">EULA</span>. In that case the person whom originally licensed the type would need to contact the foundry and transfer all rights of use to the new address and that person would have to remove the typeface from their location. <br><br>John, please go the <span class="caps">RELEASE</span> area. There are several discussions on <span class="caps">EULA</span>s (End User License&nbsp;Agreements).</p>
