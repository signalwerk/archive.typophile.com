    html: <p>In Canada, a typeface <i>design,</i> as distinct from the copyrighted font software, falls under the Industrial Design Act, which provides for a shorter period of protection than copyright, and may be considered akin to patent protection in the <span class="caps">USA</span>. I’m not sure, however, whether the ﬁling requirements are&nbsp;comparable.</p>
