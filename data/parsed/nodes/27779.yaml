    <p>Dear Typophiles,</p>
    <p>Below is an attempt at making a cursive greek in venetian style, to be used together with Jensonesque romans. It is mostly a period piece, so there will be a whole bunch of alternate characters and ligatures.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/BucentoroGreek-45_6283.png"></div>&nbsp;<p></p>
    <p>I would appreciate your critique and comments (especially if you can read Greek).</p>
    <p>Sept 20, 2006: version 0.21, first test of polytonic (no kerning yet).<br>
    April 14, 2007: version 0.56, connected polytonic with common ligatures.</p>
