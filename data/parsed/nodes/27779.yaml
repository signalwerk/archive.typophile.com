      <p>Beautiful! Dense and expressive, but clear in the same way Jenson is. The low contrast, on a more vertical axis, is a very strong element. </p>
      <p>I'm sorry, I'm not a native, or even new reader of Greek. But I'm very interested as a type designer to be informed about other scripts. </p>
      <p>This design seems a natural candidate for OpenType substitution wizardry. The ligatures, which I realize are historical, could be achieved in other ways, and the connections made even more true to the writing style the type is derived from. In other words, you could keep everything that's fluid and genuine about it, and even add more cursive connections wherever they are appropriate, with the benefits of OpenType. Sergei, would you be interested in some material on OpenType connecting scripts? I am not a salesman.  ; )</p>
