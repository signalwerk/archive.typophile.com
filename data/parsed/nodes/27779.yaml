    html: |-
      <p>Thanks for the comments, Nick. This is a multi-year project covering latin,  greek, and cyrillic and I am learning a lot about type design in the process. Roman part is in its first iteration and for now I use it mostly as color reference for the greek. Making a historical greek is very educational and I expect to gain some freedom to experiment with the roman later.</p>
      <p>Greek minuscules are based on certain mid-16th century manuscripts I like and a lot of features including low lambda, low theta, and short eta come from there, as do all the ligatures - everything comes from the same time and a very close circle of scribes. I plan to implement all meaningful ligatures with proper breathing and accents (I have about 300 in my collection). They will be available via the 'dlig' feature with "legible" ones sitting under the regular 'liga'.</p>
      <p>When this massive historical exercise is finished, I plan to make a separate simplified version for modern typography where familiarity is much more important than historical authenticity. And yes, archaic cyrillic is in the plans too.</p>
      <p>As for Jenson, I am not a big fan of its uppercase, so I'll probably rework it into something more 'venetian', based on historical calligraphic models - something closer to the greek/latin small caps in this version.</p>
