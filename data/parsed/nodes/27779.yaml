      <p>John, Hrant:</p>
      <p><cite>How’s your knowledge of Greek accentuation rules? It is possible to trim the potential ligature set somewhat by filtering out accent combinations that will not occur in text.</cite></p>
      <p>I learned all I could from the available literature, then compiled a large corpus of classical texts and calculated the frequency data for sequences of 1-4 letters. The third, and probably the most important  source is manuscripts - my prototypes show a consistent set of ligature rules. Basically, the scribe picks one of the recognizeable letter shapes to continue the ongoing circular motion of the pen, with significant counterclockwise bias. I ended up implementing these rules via 'calt' mechanism, so there is no combinatorial explosion.</p>
    html_clean: |-
