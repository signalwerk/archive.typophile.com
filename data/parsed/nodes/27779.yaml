    html: |-
      <p>This is a fascinating project, and the tension between bounce, "kappa" height, slant angle and contrast is very nicely balanced. I'm impressed with the way many of the characters "ligature" together, especially double gamma.</p>
      <p>However, I think that your roman is a little "flat" in comparison -- if you could "bounce" the baseline alignment of the roman (and Cyrillic...) a little, considering that the mean line (top of the x-height) already has some bounce, then I think you will have a better roman and greater harmony between the scripts. Bear in mind that we are used to seeing strict "Jensons" this past century, but during the Incunabula everything was a little wonky. Besides, we already have a lot of very proper Jensons, even some slightly weatherbeaten ones like Adobe Jenson, so perhaps the useful design space is beyond the end of the present spectrum -- inspired by your greek script, as it were.</p>
      <p>The character forms of the basic setting are surprisingly orthodox (given the unusual quality of the ligatures), with the exception of the "dropped" lambda, which could be a sore thumb in a plain, contemporary setting of the face. I also feel that the eta is a bit stunted, for too obvious a reason. I like the fancy Omega; the Psi seems a bit tight, perhaps an alternate form with lower arms might be good.</p>
      <p>The ligatures are a whole nother issue! -- the authenticity of which can be debated from many angles. Whatever, it will be a massive job to implement them in OpenType with full accents and breathing. I can see them finding commercial use, as well as scholarly.</p>
      <p>Speaking of authenticity, I have always liked Jenson's M with the "extra" serifs.</p>
      <p>Will you be doing archaic cyrillic characters also?</p>
