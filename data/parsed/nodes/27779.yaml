      <p><em>I plan to implement all meaningful ligatures with proper breathing and accents (I have about 300 in my collection). They will be available via the ‘dlig’ feature with “legible” ones sitting under the regular ‘liga’.</em></p>
      <p>How's your knowledge of Greek accentuation rules? It is possible to trim the potential ligature set somewhat by filtering out accent combinations that will not occur in text. This is particularly useful for ligatures that span more than one syllable, because one can usually determine which accents might be applied to which vowels and which will not.</p>
