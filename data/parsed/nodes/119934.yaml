    html: |-
      <p>This is <strong>Aristotle Punk</strong> by Andrew Hart [2009-2013, free for personal use]<br>
      Kevin is right, it's a modified Avant Garde and it actually says so and credits Herb Lubalin in the copyright.</p>
      <p>Your sample is probably created using an older version [2009] and the text set is "sUccess is a cHOice":  <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Dafont-1%20%2F%20%28Freemium%29&amp;ffam=Aristotle%20Punk%20-%20Regular&amp;fid=35b61ca8f8a1fcd8e4315c36eb05c527&amp;fsize=60&amp;text=sUccess%20is%20a%20cHOice&amp;wrap=2" rel="nofollow">Aristotle Punk (2009)</a></strong><br>
      The current version, which you can download from Dafont.com, is a bit different and you may need to flip the /C to match your sample: <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Dafont-1%20%2F%20%28Freemium%29&amp;ffam=Aristotle%20Punk%20-%20Regular&amp;fid=482e3623172e6f35d95356ada3027405&amp;fsize=60&amp;text=sUCCess%20is%20a%20CHoICe&amp;wrap=2" rel="nofollow">Aristotle Punk (2013)</a></strong></p>
