  html: |-
    <p>VTF is a free &amp; open source foundry producing open source &amp; free typefaces.</p>
    <p>More than 30 typefaces are already available!</p>
    <p><img src="/sites/default/files/old-images/vtf_banner_3803.gif"></p>
    <p><a href="http://www.vtf.fadebiaye.com">http://www.vtf.fadebiaye.com</a></p>
    <p><img src="/sites/default/files/old-images/coqnegre_preview_5734.png"></p>
    <p>Typeface above: coqnegre perspective, a futurist fraktur typeface</p>
    <p><img src="/sites/default/files/old-images/babbage_preview_5029.png"></p>
    <p>Typeface above: babbage, a fancy futurist typeface</p>
    <p><img src="/sites/default/files/old-images/pompidou_spec_6038.png"></p>
    <p>Typeface above: pompidou, a serif futurist typeface</p>
    <p>Enjoy!</p>
