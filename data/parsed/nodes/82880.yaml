      <p>Frode, your top sample ("Greyscale (FF, Win Vista)") doesn't seem to contain any gray at all.</p>
      <p>It's funny to see that, despite the <em>overall</em> "color" is different, Cleartype and Quartz totally agree on sub-pixel colors. An extreme closeup shows virtually the same sub-pixel alignment, it's just the intensity that's different.</p>
      <p>Isn't there a configuration panel for Cleartype? What sort of influence does that have, other than "On/Off"?</p>
