    votes: null
    html: "<p>I always need a double take on your comments, db. I guess we all do. I’m on the neverending road of hintless outlines, and I think — as a general concept — I’m starting to figure out which direction to take. My compromises are far from most other web font compromises, for one I firmly believe one outline does not fit them all. I’m looking at a range of sizes and a range of rendering methods and it’s all ugly for sure. As for the weight: Is that all I have to play with on the Mac? Heavier equals blurrier?</p>"
