    html: |-
      <p>It sure looks Demi all by itself out there.</p>
      <p>Web fonts for text, viewed for discussion at a single size, even with a billion different renderings, is like judging a long life by a single day.</p>
      <p>However, if the question of sanity in rendering is raised, let me say this— If one plucks a series of sizes of a type like you show  and employ them at 9, 16, 30, and 57 px, i.e. as it might be employed, but putting these selected waterfalls of sizes together in comparison, everything you try except quartz is going to look ugly, do hear me? U g leee. Antialised, CT GDI, ugleee and CT DW, the best for last, will look pale and wan. Changing from one render style to another, except to change from one small size to all larger sizes aliased, is also ugly. Different fonts rendering differently at the same size is also ugly. Having Greyscale hinted in x y and d the impossible to turn on in Windows  looks like the print, and quartz looks like bad print.</p>
      <p>And I'm saying to look at a range of sizes because this example is so narrow and 1/2 tight it can't be just for text. But if it is, then the aliased and CT versions should include the little serif terminals of c, e, s, and a, who are just starting to poke their little info giving heads out in the quartz rendering. If you are representing the face with it's smallest important essense intact, I'd try to follow Hrant on this.</p>
      <p>If not, if you're into the less is more of all CT as the basis for web typography, then you, and the gang  just have less stylistic choice of what will work as a web font on Windows, and more font development work after the outline design, on fonts that will work small to large on Windows.  Perhaps in the land of the insane, the less insane should read the tea leaves?</p>
      <p>Hrant,<br>
      Greg H's white paper on MS CT of Oct.08, linked to from around here somewhere, explains that one cannot hint for CT to achieve parametric scaling. Only alignment preservation is really possible on the client side of a Windows machine with CT on.</p>
