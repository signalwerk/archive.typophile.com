  html: <p>I have a one glyph with long list of exception kerning values and another glyph that is a key glyph in my class kerning setup. I'd like to copy all glyph's (exception) kerning values to that key glyph. Multiple weights with this same problem, so there's quite a bit of work to do manually. Any ideas? Maybe Python scripts, texteditors or even Excel could do some find/replace magic?</p>
  html_clean: <p>I have a one glyph with long list of exception kerning values and another glyph that is a key glyph in my class kerning setup. I'd like to copy all glyph's (exception) kerning values to that key glyph. Multiple weights with this same problem, so there's quite a bit of work to do manually. Any ideas? Maybe Python scripts, texteditors or even Excel could do some find/replace magic?</p>
