    html: <p>Copy left/right kerning is one of FontLab's 'Paste Special' functions. It isn't 100% reliable, and the results need to be checked carefully, but should work in the situation you describe. In Windows FontLab, select the first glyph, Ctrl+C, select the second glyph, Alt+Ctrl+V opens the Paste Special dialogue.</p>
