    <p>Hi, I have a client based out in Los Feliz, Los Angeles, and they will be the ones proofing the files, so I am here looking for printer recs out there.</p>
    <p>Does anyone based in LA have any good recs, ideally in this part of town (or any part of town, as long as you think they are great...especially for stationery systems and folded brochures...)</p>
    <p>Thanks!<br>
    Jean</p>
