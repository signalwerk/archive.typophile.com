    <p>So, I know that "piracy is not a function of typophile" but this one is kind of a special case, so I'm not sure what else to do. If you make type, one of your fonts its probably up on this site.</p>
    <p>[URL removed] is accepting donations for pirated fonts. Its Turkish, like most of the "best" font pirates out there.</p>
    <p>Most of the time, I send a DCMA, but since this site is accepting money, it's a bit different. Fortunately, there is no honor among thieves: it doesn't seem that this guy's strategy of posting fonts for profit is working out all that well.</p>
    <p>Any suggestions on how to proceed? I doubt this guy is going to care about a DCMA notice.</p>
    <p>JDooley</p>
