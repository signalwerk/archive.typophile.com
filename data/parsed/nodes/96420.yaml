      <p>I am somewhat confusticated: do the “original” fonts support Turkish or not? If so, then a knock-off is a knock-off; if not, then there is at least a presenting cause for the piracy. Not that pirates need a good rationalization, but…</p>
      <p>I must admit that I overlooked the Turkish character set for many years, until Hasbro Toys commissioned a special version of Boyz R Gross NF, which included Turkish and Greek. Needless to say, the Turkish characters were a breeze, compared to my first foray into Greek characters. Fortunately for me, the good folks at Hasbro were patient: my first Greek alphabet was simply too narrow—who knew?—and they supplied me with the words which needed kerning pairs. Anyhow, it all worked out: I got an impromptu kid Seal of Approval the other day at Wal-mart.</p>
      <p>Hrant, waddaya gonna do with the  Turks? They have been around for a long time—http://en.wikipedia.org/wiki/Turanians—and their sphere of influence is growing progressively smaller. When the Ottomans captured Constantinople in 1492 (sound familiar?), they broke the two-millennium hold of the Greeks on the Hellespont, and shaped world history—for better or for worse—for almost five hundred years after. World War I put paid to most of the divine-right monarchies, and the thoroughly screwed up British political subdivisions of the Ottoman Empire has been having negative effects on geopolitics for almost a hundred years. An independent Kurdistan—the sooner, the better—will leave Turkey with very little of their former turf, which will be a tough nut for the Turks to swallow.</p>
      <p>Sorry: I tend to digress...all my fonts support Turkish now, so I think I may be okay.</p>
