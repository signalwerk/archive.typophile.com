    html: |-
      <p>Simon: funny.</p>
      <p>Jeremy, the strategy of not supporting (or better: charging extra for) languages where piracy is rampant is interesting, and not without merit. Speaking of Latin-using languages, most of them don't have unique letters/diacritics (making the idea unworkable -or at least more intractable- for those) but Turkish does have some unique characters.</p>
      <p>It's interesting to consider why there's a high degree of [font] piracy among Turks (assuming that's actually true) and the role that Atatürk inadvertently played in the lives of designers of Latin type!</p>
      <p>I confess that being Armenian I have long thought of doing something "special" with respect to Turkish support in fonts... But I would need to make sure it comes across as a political statement, not an ethnic bias. On the flip-side, I have to think it's actually politically advantageous for an Armenian to produce fonts that are used a lot (paid or not) by Turks* so it might be better for an Armenian to make sure his fonts support Turkish very well... Dunno.</p>
      <p>* In the same way that I was more than happy to give a talk at ISType.<br>
      <a href="http://www.istype.com/?p=776" title="http://www.istype.com/?p=776">http://www.istype.com/?p=776</a></p>
      <p>hhp</p>
