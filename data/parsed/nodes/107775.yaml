      <p>Perhaps you might consider splitting your request into several separate ones.<br>
      So lets look at the first image.<br>
      This was probably all done by hand as a "wood engraving." In this system the fonts are actually carved lettering.<br>
      But they are based on designs that were familiar to the engraver.<br>
      From top to bottom here some similar typefaces from the era that have been digitized.<br>
      DOUGLASS MOORE'S<br>
      Thorowgood<br>
      <a href="http://www.myfonts.com/fonts/woodentypefonts/thorowgood/" title="http://www.myfonts.com/fonts/woodentypefonts/thorowgood/">http://www.myfonts.com/fonts/woodentypefonts/thorowgood/</a><br>
      UPHOLSTERY, PAPER HANGING<br>
      Notification JNL<br>
      <a href="http://www.myfonts.com/fonts/jnlevine/notification/" title="http://www.myfonts.com/fonts/jnlevine/notification/">http://www.myfonts.com/fonts/jnlevine/notification/</a><br>
      WINDOW SHADE &amp;<br>
      MLB Tuscan:<br>
      <a href="http://www.dafont.com/mlb-tuscan.font?fpp=100&amp;text=WINDOWSHADE%26" title="http://www.dafont.com/mlb-tuscan.font?fpp=100&amp;text=WINDOWSHADE%26">http://www.dafont.com/mlb-tuscan.font?fpp=100&amp;text=WINDOWSHADE%26</a><br>
      CARPET STORE<br>
      Typesetter JNL<br>
      <a href="http://www.myfonts.com/fonts/jnlevine/typesetter/" title="http://www.myfonts.com/fonts/jnlevine/typesetter/">http://www.myfonts.com/fonts/jnlevine/typesetter/</a><br>
      7thStNo538<br>
      H&amp;FJ Numbers, Indicia<br>
      <a href="http://www.typography.com/fonts/numbers/styles/" title="http://www.typography.com/fonts/numbers/styles/">http://www.typography.com/fonts/numbers/styles/</a><br>
      etc., etc.<br>
      Don</p>
