    <p>Hi,</p>
    <p>Can you please assist me with identifying current fonts that closely resemble those used in these figural cameos from the mid to late 1800s? I'm really just trying to identify a short list of fonts are similar to those that were typically used during that time for these pieces that were made from engraved brass metal dies.</p>
    <p>If you can also please provide information on where I can find these brass flourishes, curves, ribbons etc. that would be very helpful as well.</p>
    <p>For those interested, the collection that includes these beautiful pieces is located here:</p>
    <p><a href="http://www.sheaff-ephemera.com/list/figural-cameos/" title="http://www.sheaff-ephemera.com/list/figural-cameos/">http://www.sheaff-ephemera.com/list/figural-cameos/</a></p>
    <p>I'm looking through the type specimens in the following location but thought I'd ask for assistance here as well.</p>
    <p><a href="http://opentype.info/blog/2008/02/18/type-specimen/" title="http://opentype.info/blog/2008/02/18/type-specimen/">http://opentype.info/blog/2008/02/18/type-specimen/</a></p>
    <p>Thanks so much for any help with this.</p>
    <p>Joshua</p>
