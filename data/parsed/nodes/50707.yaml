    html: <p>The hook on the j is a bit too short and abrupt for my tastes, but that's what they are. Very good looking and solid overall. It strongly resembles Lubalin Graph, as any geometric slab-serif is likely to, but I think you noticed that too and included features to differentiate this. Am I right?</p>
