    <p>hi there<br>
    I'm currently working on a catalogue for a client of ours.<br>
    The used font family is tobias frere-jones' gotham.<br>
    It all works fine until i have to create tables with<br>
    numbers. None of them seem to line up (as in full-stop<br>
    and the numbers). Is there a special version of gotham<br>
    to fix this problem, or does anyone know of a good<br>
    workaround? Is it possible for me to change the spacing<br>
    in the font itself?</p>
    <p>Thanks a lot<br>
    Jörg</p>
