      <p>That is exactly the information I was trying to give you.</p>
      <p>Take bulleted lists for example. Whether or not to indent the bullet depends on the other list structures.  In general, you can indent the list proper the same amount you would indent an extract, and hang the bullets back. Or you can indent the bullets to the same point as an extract, with a further indent to the list proper.</p>
      <p>As to spacing between items in the list: If the items in the list are short, no extra space is needed between them. The bullet will identify a new item. If the items are long (i.e., long paragraphs), then extra space between each item may help. space above &amp; below the list is another matter; just as with extracts.</p>
      <p>BTW, if the list items are short (short paragraphs), I would probably set them ragged right. If they were long, and most of the other material were justified, I'd set them justified.</p>
      <p>I would never use a full line space extra -- unless you'd used that above &amp; below an extract, and with 14-points of lead, I wouldn't do that.</p>
      <p>Large bullets are usually considered in poor taste in bookwork, though I suppose they are the cat's pajamas in ad work. The old standby was a 2-point bullet, which would be close to a "periodcentered." Another way is to not use a bullet at all, but an en-dash. Less obtrusive. What is considered important is the list proper, not the signaling device. A large bullet is too "important" visually.</p>
      <p>If all this is beginning to sound like "it depends on the content and the rest of the book," Then I've made the point I was trying to make.</p>
      <p>Jut out of curiosity, why would you use full caps for two letters, but small caps for three. If you say "The US and the USSR," would you full-cap the US and small cap the UUSR? I sure wouldn't. People might suspect a political meaning, which would (likely) be inadvertent.</p>
      <p>Etcetera</p>
