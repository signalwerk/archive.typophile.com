    <p>Before I start asking questions, I do plan on purchasing a book to learn the ins and outs of typesetting. But in the meantime any help would be appreciated.</p>
    <p>When using small caps for abbreviations I've heard you you only apply small caps to abbr. with three or more letters. Is this correct? also do you apply small caps to numbers within the text i.e. 60%, 2008-2009, 2008 VA etc...</p>
    <p>As a general rule how far do you indent bullet points? Does the rule apply for each level?</p>
    <p>How much space do you leave between bullet points? Assuming you have type at 10/14 would each bullet point have a full line between them or about half. (Right now I have half a line of space between bullets on the first level and no space on the second.)</p>
    <p>I've seen where people small cap the first few words at the beginning of a chapter, or section; is this pretty standard practice?</p>
    <p>Is there a way to set up an action like in photoshop to change selected text from capital letters to lowercase and then to small caps?</p>
    <p>Any other links or wisdom you can send my way is also welcome. I know these questions are pretty type 101 but I've always worked online and have started to move into some print work and would like to do it right.</p>
    <p>Thanks</p>
