      <p>In general, I'd say the answer to all your styling questions is no. Buried in that is the notion that there are no rules. With book composition, some of these items would be covered by a publisher's house style, some by the designer. Still, in many ways design and composition are a continuum; it is hard to say *exactly* where one leaves off and the next begins. </p>
      <p>But I'm a book typesetter, and you may be speaking of another form of "print work." With "print work," much is a matter of convention, not rules. In my area (book work), the old convention is to present material to a reader in a form that is both familiar and comfortable -- sometimes known as The Crystal Goblet -- except for very rare exceptions, such as with <cite>The Telephone Book.</cite></p>
      <p><a href="http://www.amazon.com/Telephone-Book-Technology-Schizophrenia-Electric/dp/0803289383" title="http://www.amazon.com/Telephone-Book-Technology-Schizophrenia-Electric/dp/0803289383">http://www.amazon.com/Telephone-Book-Technology-Schizophrenia-Electric/d...</a></p>
      <p>As to changing the case (caps/lower case) and small caps automatically, that would depend on the layout program. If you are using Adobe's InDesign (paralleling Adobe Photoshop), the answer is yes.</p>
