      <p>It seems to me that you are interested in the nuances of traditional typography.<br>
      In that case, your best bet is to work in a page layout application, namely Quark XPress or InDesign, with OpenType fonts that have typographic features (small caps, alternate figure styles, etc). Then you will be able to access the actions you describe in the OpenType palette of these applications. Illustrator and Photoshop don't have quite so much typographic scope.</p>
      <p>As a type manual, Bringhurst's <em>Elements</em> is the "bible".</p>
      <p>Your question about small cap figures (numbers) is an interesting one, that depends on context.<br>
      If you are mixing upper and lower case text with small caps, then old-style figures are probably best.<br>
      That's why it makes sense to check the fonts you intend to use beforehand, to see whether they have oldstyle figures.</p>
