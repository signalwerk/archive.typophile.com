    <p>The experimental Eskapade fraktur by Alisa Nowak, received two additions to the family. This time, Alisa created two fonts of the old-style nature adapting a humanist structure with condensed proportions. Both, the roman and italic have strong links to the Fraktur providing for a balanced harmony in mixed text-settings. Please contact us for details, if you wish to upgrade to the full Eskapade family.</p>
    <p><strong>more information:</strong> <a class="freelinking external" href="http://www.type-together.com/Eskapade" rel="nofollow">http://www.type-together.com/Eskapade</a></p>
