      <p>I don't agree totally with the type sizes recommended. If your resume is short, increase the type size. It will look bigger, and thus longer. I also want the interviewer to read everything, so would go with a minimum of 12 point body type so that they will read the whole thing. Anything smaller, IMO, will make them toss it if your qualifications are iffy. The larger type almost forces them to read it.</p>
      <p>I totally agree with Hoefler Text and Georgia, which Joe recommended. They are both great looking fonts, as well as being modern and easy to read.</p>
      <p>I prefer sanserif fonts for headlines. It is just the way I was brought up in the art field. I started in newspapers and always preferred the the sanserif to the serif fonts for headlines. It is cleaner and stands out from the body type, IMO. But that is not necessarily the rule, as many newspapers today use serifed faces for their headlines. Use what you like in that case. It really depends upon what you want to relate, and to whom you are relating it to. Both work well under different circumstances.</p>
