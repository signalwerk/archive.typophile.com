      <p>Do you have a Mac or PC? Are you interested in purchasing a font or using one you own (have a license for)?</p>
      <p>If you have a Mac, it ships with Hoefler Text (I think it still does anyway), which is excellent. If you have a PC only, I'd recommend using Georgia instead of Times. Georgia italics are particularly nice. Also, Garamond is better (fresher) than Times.</p>
      <p>For a sans, use Helvetica, and avoid Verdana. </p>
      <p>Instead of the default 12 point that Word will give you, you'll get a more refined look with 10.5 or 11 point text. </p>
      <p>Good luck in your job search.</p>
