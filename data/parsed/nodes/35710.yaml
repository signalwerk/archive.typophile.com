    <p>To Whom It May Concern:</p>
    <p>I am applying to a commercial real estate certificate program and I am picking fonts for my resume, which I must submit. I'm new to thinking about what fonts to use; in the past, I've stuck to either Garamond or Times New Roman.</p>
    <p>Some notes:<br>
    -The resume fits on one page.<br>
    -I want to convey freshness and stability.<br>
    -Most of the the experience on the resume relates to mapping, databases, and real estate.<br>
    -I was playing around with Helvetica for headings, and Times New Roman for other text. It looked OK, but not great.</p>
    <p>I welcome suggestions. Also, I'd love links to well-designed resumes.</p>
    <p>Thank you for your time and consideration.</p>
    <p>Respect,</p>
    <p>Michael</p>
