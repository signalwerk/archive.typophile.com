      <p>Helvetica and Times wouldn't be my first choice (I'd rather see Helvetica and Garamond, if you have Garamond), but you're on the right track keepng it simple with two conservative fonts, a serif for the text and a sans for the titles. In the past I've preferred to use just a serif font, utilizing italic and/or larger sizes for  headings. Layout is important too: use white space to your advantage to set off different section and to keep it all looking open and inviting. Make your text large enough to be easily read (10 points or so, depending on the typeface), but not overly large.</p>
      <p>I've laid out my own resumes in the past using a two-column format: a left column, about third of the width between my outer margins, has my name and address at the top, and major headings (experience, education) beow, with the text of the sections occupying the right two thirds. This keeps the length of text lines to around four inches, which is easier to read than text spanning maybe six inches on 8.5 x 11 stock.</p>
