    <p>Maybe it's just me (in which case, ignore this thread), but some of the subforums, particularly in the critique section, are not updating to show the newest posts. The sans serif forum, for example, is showing the newest post is 5 days old despite the fact that there are newer posts in there.</p>
    <p>Is this just me or is everyone seeing the same thing?</p>
