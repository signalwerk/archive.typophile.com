    html: <p>It was originally developed on film for Photolettering and was available as Letraset dry-transfer for ages. The only digital version of Baby Teeth that I'm aware of is <a href="http://www.paratype.com/pstore/default.asp?search=Bebit&amp;amp;restyles=yes">Bebit</a> from ParaType. Interestingly enough, Bebit includes Cyrillic letterforms as well.</p>
