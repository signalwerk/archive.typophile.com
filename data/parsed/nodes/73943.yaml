      <p>For one of my earliest typography assignments from Ken Hiebert, we were all given the same galley proof with all the text for a mail-order book store. The text was all set in one font in one size and strung together in a continuous stream. The assignment was to design a sensible and easy to use order form, using only space and positioning as a means. We had 3 hours to design and paste it up.<br>
      I learned more in that three hours about using type than at any other time in my life.</p>
