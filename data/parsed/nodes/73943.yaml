      <p>Dez, I had the same impulse as Raymond. <a href="http://typophile.com/node/73943#comment-428758" rel="nofollow">Your comment</a> is a keeper.</p>
      <p>James, I did things two different ways. There were assignments where I assigned the typeface because the practice of setting type was more important than picking the typeface. And there were assignments where I'd leave it open to them. But I did have a conversation with the students that always discussed what the system fonts are there for and when and why they might be used. I am sure I had some snarky things to say as to why we'd never use them in print, but at the end of the day I was trying to show the students that the system fonts, while not strictly verboten, were not appropriate in their work.</p>
