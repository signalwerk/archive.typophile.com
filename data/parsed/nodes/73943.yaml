      <p>Dear James,</p>
      <p>I am of the belief that typography professional should be able, or at least try, to make the best use of <em>any</em> typeface, overused or underused. Even if I don’t like it. This is what I teach… I see no point in blacklisting typefaces, Arial, or Papyrus, or Comic Sans, or Souvenir, or whatever. This restriction may send the students a wrong message: that typography is about using pretty fonts. Which it isn’t. It’s like Vignelli said, ‘In other words, it’s not the type but what you do with it that counts’.</p>
