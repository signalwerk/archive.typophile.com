      <p>The goal here is to get students to think critically about the type they chose? I wonder if it would be more instructive work it in reverse and charge a $100 material fee for purchase of no more than 2 fonts. They would need to use those fonts, and only those fonts for the semester (or quarter). Would be eye-opening and probably painful for some! (you might have a vetted list). What does it mean to own a font? What is good value? How to wring the most from your type? Alternatively, you could have them select one text face and one display face from the library to use for the semester.</p>
