  html: |-
    <p>This semester I decided to add a banned fonts list to the syllabus for my typography class. I did this not because I don’t want to see certain fonts, but because I feel that some students get hung up on simple office and academic document styles because it’s all they know, and I hope that taking away the fonts they associate with such work will push them creatively without discouraging critiques. I’ve tried to just ban a few common fonts without going after (relatively) less commonly used system fonts like Futura, Palatino, and Hoefler Text. And my students all have access to lab computers with excellent font collections. Am I missing anything in this list?</p>
    <p>Arial<br>
    Century Gothic<br>
    Georgia<br>
    Helvetica<br>
    Impact<br>
    Papyrus<br>
    Times New Roman<br>
    Trebuchet<br>
    Verdana</p>
