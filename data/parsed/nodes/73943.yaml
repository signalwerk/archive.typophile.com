      <p>It certainly is true that an assignment where the typeface is chosen is a useful exercise. But I don't think that has relevance to whether or not a banned font list is a good idea.</p>
      <p>Presumably, many different types of exercise belong in a typography course. Some that address working with elements other than choice of typeface. Some that address working with a very limited choice of typeface - in which case, in real-world situations, it might well be that the only fonts available would form a list very similar to the banned font list here.</p>
      <p>But some exercises might well involve an open-ended choice of typeface. In that case, banning the most well-known typefaces to encourage the students to more fully explore the alternatives available seems an entirely reasonable thing to do.</p>
      <p>Since this is an introductory course, though, some of the students may not be familiar with too many different typefaces; operating systems don't come with a simple command that says "create a specimen sheet of all the fonts installed on the system". (One older word processor puts the entry in the drop-down menu for each face in that face, but that can clearly cause problems with symbol fonts.) So I could imagine some students simply experiencing difficulty in finding a suitable face for an assignment because they don't know where to look.</p>
      <p>So I hope their textbooks or other course materials give them an idea of what a number of different faces look like, so they have a reference point to start from.</p>
