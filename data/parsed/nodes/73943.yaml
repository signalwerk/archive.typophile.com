    html: <p>The point of the assignment was that all typography problems come with constraints--they often seem unreasonable to a design student. After they graduate and work a few years, they find that real-world client constraints can be even more stifling. What you learn is that constraints open up a micro world which you never would have noticed if you had all avenues open to you.  I learned to LOVE constraints. It was much easier if space, time, and architecture were limited--even if it WAS more challenging.</p>
