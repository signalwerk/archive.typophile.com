    <p>Here is another topic I hope to expand in the <a href="http://typophile.com/forum/16" target="new">Typographic Edumacators</a> topic area after additional research and illustrations.</p>
    <p>I’ve been searching through many of the topic threads concerning type specimens, both online and in print. Typically, users are looking for a way of making visual comparisons between type styles in order to select or match typefaces for a particular project. Online representations are generally adequate enough for most decisions, but completely inadequate for close scrutiny required in order to make highly sophisticated typographic comparisons.</p>
    <p>There are many distinctions that can be made by close inspection of printed specimens (including magnified scrutiny using a printer’s lupe — wow, an antique item nowadays).  For this thread, I am focusing on only one of several aspects that may be useful for educating graphic design students about typography.</p>
    <p><strong>Type Scaling — Display vs. Text design within the same family.</strong><br>
    Younger designers may be familiar with typefaces, but few are aware of the many subtle design adjustments made to hot metal typefaces in developing a range of point sizes to span small to mid-sized text, 18 pt — 48 pt ranges, to larger display sizes. Is this significant anymore, perhaps no. But scaling issues encountered when using a single digital font never even enters the minds of younger designers today.</p>
    <p>I have just put together a very quick illustration which in time will be expanded with sharper scans, more samples and better source files. For now, I invite you just to examine the concept.</p>
    <p><a href="http://www.acmedigital.net/JianSabu/gill_specimen.htm" target="new">Eric Gill’s <em>The Four Gospels</em> comparitive sample.</a></p>
    <p>All I’ve done so far is pulled a sample jpg from <a href="http://wally.rit.edu/cary/cc_db/20th_century/7.html" target="new">RIT’s Gary Collection</a>. The first four levels of point sizes are tagged and the bottom samples show characters from the respective line. The jpg sample was then scaled up detailing the cap W and N. Obviously the best way to make a visual comparison is to make a high res scan of the actual printed piece then scale to match x-heights. But the idea is character widths and subtleties of stroke, serifs, etc., have been modified by Gill for each point size in order to be more harmonious to the form. Better illustrations to follow.</p>
