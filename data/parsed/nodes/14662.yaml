      <p>BTW — one of the reasons why I selected Eric Gill’s <em>The Four Gospels</em> is because there is a wealth of information on his work with <a href="http://desktoppub.about.com/gi/dynamic/offsite.htm?zi=1/XJ&amp;sdn=desktoppub&amp;zu=http%3A%2F%2Fwww.itcfonts.com%2Fulc%2Farticle.asp%3FnCo%3DAFMT%26sec%3Dulc%26amp%3Bissue%3Darticles%26art%3Dericgill" target="new">The Golden Cockerel Press</a>, his initial trials and questions about designing typefaces, issues about scaling mathemetically and photographically, and the revival of the Golden Cockerel typefaces by the International Typeface Corporation. All of this makes for a very interesting story (at least for me) in the hopes that students might learn about the deeper mysteries of typography.</p>
      <p>Other issues related to examination of printed type specimens include:</p>
      <ul>
      <li>High-res output vs. screen resolution</li>
      <li>Better sense of “type color” of text blocks</li>
      <li>Details for making decisions between one vendor’s version vs. another</li>
      <li>Subtleties of letterform lost in small point size samples</li>
      <li>and any other ideas you care to contribute</li>
      </ul>
      <p>——————————————————————-<br>
      Yes, I’m old, but I’m back in style!</p>
