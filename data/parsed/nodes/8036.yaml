    votes: null
    html: "<p>Sean <br> <br>This is a site where you can check on which foundries are casting various faces: <br> <br><a href=\"http://members.aol.com/aapa96/foundry.html\" target=\"_blank\">http://members.aol.com/aapa96/foundry.html</a> <br> <br>Bixler is only casting British Monotype and is not shown. Doesn't mean he doesn't have it. Berliner, last I heard, is no longer casting. <br> <br>Poliphilus and Blado were great letterpress faces.  Probably suck in digital version. <br> <br>Some interesting popular perceptions about the Poliphilus that aren't exactly so. Hmmm, I'm starting to sound like Giampa the Great. Am I now the only Gerald? <br> <br>Bembo Italic won't match in the way you hope. There is quite a bit of written documentation on the two faces.</p>"
    html_clean: "<p>Sean <br> <br>This is a site where you can check on which foundries are casting various faces: <br> <br><a href=\"http://members.aol.com/aapa96/foundry.html\" target=\"_blank\">http://members.aol.com/aapa96/foundry.html</a> <br> <br>Bixler is only casting British Monotype and is not shown. Doesn't mean he doesn't have it. Berliner, last I heard, is no longer casting. <br> <br>Poliphilus and Blado were great letterpress faces.  Probably suck in digital version. <br> <br>Some interesting popular perceptions about the Poliphilus that aren't exactly so. Hmmm, I'm starting to sound like Giampa the Great. Am I now the only Gerald? <br> <br>Bembo Italic won't match in the way you hope. There is quite a bit of written documentation on the two faces.</p>"
