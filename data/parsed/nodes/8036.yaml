    html: <p>Thanks for the info Gerald. I will take a look around that link.  <br> <br>I have have tried to contact Bixler but have got no reply back. <br> <br>For now, I can' find Blado in 16pt. and I have discovered, on my own, that Bembo italic will not match just as you said. So sad.  <br> <br>After taking a close look at both faces, in letterpress form, it is my opinion that Poliphilus is superior to Bembo. I've always been fond of Bembo too. But now, there is a new kid in town. <br> <br>The search continues... &lt;i&gt;Blado, where are you?&lt;/i&gt;</p>
