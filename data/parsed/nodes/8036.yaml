  html: <p>I am looking for an italic for Poliphilus. But I can't find Blado. We are talking metal type here - 16pt. Does any one know who might have it?  <br> <br>Or what about using Bembo italic? Good idea or bad? <br> <br>What other italics have you used with Poliphilus? <br> <br>Thanks, <br>Sean</p>
