      <p>I have a number of kinetic sites, experimental sites and I have a couple of examples of type animations that I like to use to inspire students. I'm not sure if they would be of interest to you, but here they are nonetheless:</p>
      <p>Super fun tool to create art with type:<br>
      <a href="http://robotype.net/herramienta.php" title="http://robotype.net/herramienta.php">http://robotype.net/herramienta.php</a></p>
      <p>Drawing with type - I love this site!<br>
      <a href="http://www.storyabout.net/typedrawing/" title="http://www.storyabout.net/typedrawing/">http://www.storyabout.net/typedrawing/</a></p>
      <p>Playing with type - exploring type:<br>
      <a href="http://www.storynest.com/Nest_Lab/1Level/e38.htm" title="http://www.storynest.com/Nest_Lab/1Level/e38.htm">http://www.storynest.com/Nest_Lab/1Level/e38.htm</a></p>
      <p>Expressive/interactive type:<br>
      <a href="http://www.leogeo.com/" title="http://www.leogeo.com/">http://www.leogeo.com/</a></p>
      <p>Fun site:<br>
      <a href="http://david-lu.net/v5/demos/letter3/" title="http://david-lu.net/v5/demos/letter3/">http://david-lu.net/v5/demos/letter3/</a></p>
      <p>Text Worm:<br>
      <a href="http://www.chronotext.org/2004/text_wire_2.htm" title="http://www.chronotext.org/2004/text_wire_2.htm">http://www.chronotext.org/2004/text_wire_2.htm</a></p>
      <p>For all seasons - amazing type:<br>
      <a href="http://www.hahakid.net/forallseasons/forallseasons.html" title="http://www.hahakid.net/forallseasons/forallseasons.html">http://www.hahakid.net/forallseasons/forallseasons.html</a></p>
      <p>Music and animated type combine to make typefaces/imagery<br>
      <a href="http://www.ni9e.com/typo_illus.php" title="http://www.ni9e.com/typo_illus.php">http://www.ni9e.com/typo_illus.php</a></p>
      <p>Kinetic Typography coupled with sound (Fight Club and Sky, etc.) at:<br>
      <a href="http://www.cs.cmu.edu/~johnny/kt/" title="http://www.cs.cmu.edu/~johnny/kt/">http://www.cs.cmu.edu/~johnny/kt/</a></p>
      <p>This is an interesting site, although sometimes frustrating:<br>
      <a href="http://www.typorganism.com/" title="http://www.typorganism.com/">http://www.typorganism.com/</a></p>
      <p>Type animation (specifically "Not My Type IV")<br>
      <a href="http://www.abc.net.au/arts/strange/" title="http://www.abc.net.au/arts/strange/">http://www.abc.net.au/arts/strange/</a></p>
      <p>Beck's Black Tambourine Video couples type and his music: great inspiration for students<br>
      <a href="http://www.stereogum.com/archives/001222.html" title="http://www.stereogum.com/archives/001222.html">http://www.stereogum.com/archives/001222.html</a></p>
