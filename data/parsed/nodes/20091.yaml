  html: |-
    <p>I am currently working on a graphic design education project investigating educational and instructional materials, particularly those known as reusable learning objects, such as Flash movies, interactive or otherwise. I am seeking examples of animated typographic pieces, these could be interactive, artistic and/or educational. As an example of the type of items that I'm seeking, there are some basic interactive animations included under the 'anatomy' section of this site: <a href="http://www.rsub.com/typographic/" title="http://www.rsub.com/typographic/">http://www.rsub.com/typographic/</a> and an artistic piece here: <a href="http://www.arabictypography.com/flash.html" title="http://www.arabictypography.com/flash.html">http://www.arabictypography.com/flash.html</a> (to view click one of the lighter moving squares)</p>
    <p>If anyone knows of other such sites and would like to share, I'd be grateful. Thanks.</p>
