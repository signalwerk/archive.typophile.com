      <p>Here is my little contribution, T bones. Two or three years ago, I had to create some content for an online course about typography for beginners. All the stuff is currently on an open and distance learning platform and is only avalaible for registered trainees (and everything is in french). But tell me if you are interested and I will send you a login and a password.</p>
      <p>You can also have a look at two files posted on my own website. The <a href="http://www.pixels-et-papier.be/pages/Mep.html" rel="nofollow">first one</a> is an attempt to explain the basic principles of page layout to non-designers. It is based on the books of Robin Williams and made in Flash. It is also only in french.</p>
      <p>The second one is <a href="http://www.pixels-et-papier.be/pages/FontExpert.html" rel="nofollow"> a small application</a> dedicated to fonts exploration. This one is in french and  english. Comments and critics about the content (and about my mistakes in english) are welcome.</p>
