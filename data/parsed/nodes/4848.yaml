    html: <p>Hi, I'm back again with another revision to this masthead. It's negative space around the ball not a white line, so when the masthead is on top of the art, the art will show through. The colors will be dependant upon the cover photo/illus., but in looking over past issues, these were colors that were frequently used. I steered away from putting a seam on the tennis ball for two reasons 1. Tennis magazine used a seamed tennis ball as the dot over the "i" for about 25 years prior to their recent logo redesign. and 2. The more litteral ball depiction (with seam) looks odd when the ball is in a color other than yellow. <img src="http://www.typophile.com/forums/messages/29/37958.jpg" alt="masthead with dot e"> <br>"US" looks a little tight to me and "NI" a little loose. Do you agree? Or should I tighten TENNIS to match US? And does anyone feel the perfect circle doesn't jive with the imperfect soft Garage font? I tried using period from the font as the ball but it looks like a mis-shapen blob to me.</p>
