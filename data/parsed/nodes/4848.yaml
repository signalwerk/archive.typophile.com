    html: <p>First, thank you all for your ideas and comments. After spending quite a bit of time in Border's magazine section I realized I was trying to do too much with this. Simplified the sans serif and slab versions. Did keep one version with the reversed N. I felt it illustrates the head-to-head competion of tennis. However (and especially because it is an N) I doubt I'll end up using it because it will be too similar to the Nine Inch Nails symbol.  <br> <br>The forum seemed split between the slab and the sans so I'll probably show both to the client. Funny I was favoring the slab, but now I like the sans with no space between the US and Tennis or the all blue with yellow dot version. Keep it simple.  <br> <br><img src="http://www.typophile.com/forums/messages/29/36678.jpg" alt="masthead version 6"></p>
    html_clean: <p>First, thank you all for your ideas and comments. After spending quite a bit of time in Border's magazine section I realized I was trying to do too much with this. Simplified the sans serif and slab versions. Did keep one version with the reversed N. I felt it illustrates the head-to-head competion of tennis. However (and especially because it is an N) I doubt I'll end up using it because it will be too similar to the Nine Inch Nails symbol.  <br> <br>The forum seemed split between the slab and the sans so I'll probably show both to the client. Funny I was favoring the slab, but now I like the sans with no space between the US and Tennis or the all blue with yellow dot version. Keep it simple.  <br> <br><img src="http://www.typophile.com/forums/messages/29/36678.jpg" alt="masthead version 6"></p>
  - id: 35386
    user: 3472
    date: 2004-05-24T14:22:00
    date_raw: 24 May 2004 — 2:22pm
    votes: null
    html: <p>I like the third from the top and the 5th from the top. However, the yellow ball is begging for its seams back.(not the photographic version, but a simple graphic rendering would probably do. The addition of the seems would also imply motion which would be a good bonus.) <br> <br>Have You tried an all Green Version?  <br> <br>Honestly, by having a specific set of colors you are potentially limiting your graphic pallette down the road.  <br> <br>What happens when you have a beautiful photograph that has a blue(or Red)background? You might feel the need to change the colors of your logotype.  <br> <br>I was always told that a logo should be able to work in black and white 1st, and color 2nd. <br> <br>You might want to try some versions with solid colors throughout. <br> <br>ps.Forth from the top feels Swedish.</p>
