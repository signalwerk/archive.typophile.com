  html: <p>Hi all. I could use some help - I've been working on the redesign of a sports magazine, along with the redesign the title is changing as well. Here are a few masthead designs. The client initially wanted to empahsize the word "Tennis" and downplay "US", now they want to see more of a balance between the words. Red and Blue will probably be the main color palette, however it may change from issue to issue depending upon the cover art. With that in mind the flag "E" versions might not work in a different color combo. Please, your thoughts on which of these is working. Am I turning it into too much of a logo? One big concern is it should not look similar to Tennis Magazine. see bottom attachment. One final note the magazine only goes to subscribers, it's not for sale on newsstands. <br> <br><img src="http://www.typophile.com/forums/messages/29/36351.jpg" alt="masthead 1"> <br><img src="http://www.typophile.com/forums/messages/29/36352.jpg" alt="masthead 2"> <br><img src="http://www.typophile.com/forums/messages/29/36353.jpg" alt="masthead 3"> <br><img src="http://www.typophile.com/forums/messages/29/36354.jpg" alt="masthead 4"> <br> <br><img src="http://www.typophile.com/forums/messages/29/36355.jpg" alt="tennis magazine logo"></p>
