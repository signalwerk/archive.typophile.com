    html: "<p>Good observation by George. Can't state if it's hand-drawn or not though. It is true /i dots position is different but your sample is also in bad condition. Just a thought now. I don't understand what would be the goal behind hand-drawing it from side, making repeating /i identical and finally, adding a \"hand-drawn\" touch by moving only 1 /i dot... Doesn't make sense to me... Anyway, here are some alternatives, close to your sample: <a class=\"freelinking external\" href=\"http://www.jawarts.com/CornerStore.html\" rel=\"nofollow\">Corner Store JT</a>, <a class=\"freelinking external\" href=\"http://www.houseind.com/fonts/signpainter\" rel=\"nofollow\">House Script HI</a>, <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/filmotype/lasalle\" rel=\"nofollow\">LaSalle FT</a>, <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/yes-please/delicious-pro\" rel=\"nofollow\">Delicious AY</a>, <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/bluevinyl/fancier-script\" rel=\"nofollow\">Fancier Script BV</a>, <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/typeart/dream-lover\" rel=\"nofollow\">Dream Lover</a>, <a class=\"freelinking external\" href=\"http://www.identifont.com/show?OPA\" rel=\"nofollow\">Anaheim JT</a>, many <a class=\"freelinking external\" href=\"http://www.aringtypeface.com\" rel=\"nofollow\">scripts by Aring Typefaces Måns Grebäck</a></p>"
