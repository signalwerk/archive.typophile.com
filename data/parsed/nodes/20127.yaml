  html: |-
    <p>I am thinking of replace a Myriad font with Lisboa OSF on a website.<br>
    How do you think Lisboa's performance would be on a website?</p>
    <p>Is it even worth it? Will the attention to a more flavorful font be noticeable??</p>
    <p>Interested in any opinions. :-)</p>
    <p>Also, I've noticed that at small sizes, the Uppercase "R" is shorter than other letters... why is this so?</p>
