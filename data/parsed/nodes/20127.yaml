    html: |-
      <p>Well, I'm not sure exactly what you're saying about which. I do realize the "M" is wide in every size/weight, but in a bitmap font it's not always possible to make symmetrical letters an ideal width, especially if you want to keep certainly corners sharp (one pixel). Also in bitmap fonts you have to mind the relationships of the various sizes, and you have to "snap" the glyphs in larger sizes to the wider possibility so you leave yourself enough room in the smaller sizes. You'll notice how some letters (like the "T") have quite different proportions across the sizes.</p>
      <p>The sacrifices in a bitmap font can be strenuous and befuddling.<br>
      Look at the "v" in 16 PPEM Georgia!</p>
      <p>hhp</p>
