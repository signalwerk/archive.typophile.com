  html: |-
    <p>I'm looking into typefaces which have crossbars which overlap the rest of the letter, as seen in this example.<br>
    Is there a name for this particular feature?<br>
    Is there a period in history where this feature was seen a lot, and what (if any) was the reason behind it?<br>
    Is there any sort of reference to be found in ancient scripts / glyphs?</p>
    <p>Any help much appreciated.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/photo_6536.jpg"></div><p></p>
