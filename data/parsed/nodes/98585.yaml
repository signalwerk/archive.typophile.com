    html: |-
      <p>The presence of the L-with-stroke there is interesting: this is probably a setting from Eastern Europe - and it's as if they wanted to justify/amplify the presence of the stroke on the "L" by repeating the motif elsewhere.</p>
      <p>hhp</p>
