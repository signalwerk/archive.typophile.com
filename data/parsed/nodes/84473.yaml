  - id: 475084
    user: 44740
    date: 2011-08-23T15:28:00
    date_raw: 23 Aug 2011 — 3:28pm
    votes: null
    html: |-
      <p>Hi.  I didn't try a smaller loop on top, because it never occurred to me that the S was ambiguous.  I thought I, T, J, L and Z would be more likely candidates for problem readings, but I think context solves most problems (as it does in most scrip fonts, where if you look at certain uppercase characters individually you go "what's that then?")<br>
      I'm considering making a Pro version, with way more swashes and alternates, all selectable by the user rather than automatic contextual substitutions.  I'de probably also add alternates for all caps settings for acronyms.  As of now, it's selling much better than I expected, so I wouldn't want to quickly release an advanced version, for fear it would appear as something of a cash in.  I'm going to wait and see how it gets used, and if I feel a Pro version would be a useful addition, I'll make one.  I guess the decider will be when I see someone's modified it themselves to solve a certain problem and I think it looks bad!  I am forced to use Monotype Corsiva quite regularly in the day job, and the amount of times I'm asked to change the ampersand for something that 'looks less like a J' is pretty ridiculous.  I'm all for users using fonts as they see fit, but if a line is crossed I'll find it hard to not march right in and tell them they're doing it wrong!</p>
