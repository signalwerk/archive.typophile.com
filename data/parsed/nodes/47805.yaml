      <p>I agree that what amount to spellchecking should not be applied at the Uniscribe level, and never miss an opportunity to tell Microsoft this. However...</p>
      <p>In the case of the different kinds of dammatan, fathatan and kasratan in Quranic typesetting, these have been proposed for distinct encoding in Unicode and are likely to be approved.</p>
