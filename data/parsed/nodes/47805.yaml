    <p>Respected Sir,<br>
    I am developing a Quranic Font. Here in the Quranic Script there are two shapes of Dammatan, two of Fathatan and two of kasratan. But in unicode there are only one position for these shapes.<br>
    I need two shapes for fathatan, dammatan and kasratan.<br>
    I try to achieve the second option, I make three shapes for them and put them in seperate glyph.<br>
    I tried to achieve this glyph or shape using ccmp feature, NOT WORKED, I tried to use this by mkmk, NOT WORKED, I tried through Cursive attachment, NOT WORKED, I tried some more logics but failed.<br>
    Some Aeraab's (diacritics) are working on each other but I need when I press fatha fatha it replaces my required glyph.</p>
    <p>Can I achieve this. I am trying to do this in MS Word now.</p>
    <p>Thanks in advance.</p>
