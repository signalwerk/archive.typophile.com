      <p>It seems Uniscribe(Microsoft OpenType Engine) has some restrictions which disallow some invalid combinations (ref:<a class="freelinking external" href="http://www.microsoft.com/typography/otfntdev/arabicot/other.htm" rel="nofollow">http://www.microsoft.com/typography/otfntdev/arabicot/other.htm</a>). </p>
      <p>I will request experts to please discuss whether these type of checks (Grammar or Spell) should be made at Uniscribe level? My personal opinion it should not. </p>
      <p>--<br>
      Best Regards,<br>
      Atif Gulzar</p>
