    <p>Designed by <a href="/wiki/William%20Addison%20Dwiggins" class="freelinking" rel="nofollow">William Addison Dwiggins</a> for <a href="/wiki/Megenthaler%20Linotype" class="freelinking" rel="nofollow">Megenthaler Linotype</a> under the direction of <a href="/wiki/C.%20H.%20Griffith" class="freelinking" rel="nofollow">C. H. Griffith</a> starting 2/2/37 through 10/25/48. Also known as Experimental 78.</p>
    <p>Revived by Linotype in 1983 under the name <a href="http://www.linotype.com/1272/newcaledonia-family.html" rel="nofollow">New Caledonia</a>.</p>
