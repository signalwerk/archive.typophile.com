    html: <p>I think  a stronger/longer spur on the Q would be good. The Joins are get messy like at the top of the A, The base of the W, Top of the M. The letters can look cleaner if you tweak them. I like your J too but I would like the top to be slighty less long. It would be funkier that way. I think the 4 is weak. I think it needs to be tweaked or redone. I think a stronger bend in the left top curve would do it.</p>
