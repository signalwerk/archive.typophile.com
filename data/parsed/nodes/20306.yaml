      <p>Great font. This is probably a dumb question but is it monospaced?</p>
      <p>To me the L and F have some strange spacial weirdness happening which is making them look less balanced than the other letters. The A and the V seem slightly off too, maybe rounding the inside top intersection like the O would work or maybe having the diagonals begin lower on the V and higher on the A? </p>
      <p>The 4 (maybe because of the diagonal) looks too wide. Also the bold at sign looks a little crowded. </p>
      <p>The J is really great.</p>
    html_clean: |-
