      <p>Charles, </p>
      <p>&gt; "Forget the effing master of marketing, always wear black, mac. Real people use Windows."</p>
      <p>Unlike any other company that offers font editing tools, we've always developed for both Mac OS X and Windows. This is on one hand a bit of complication (since the development takes longer and the applications may not look and feel so completely slick and fancy as some competing products), on the other hand it allows more users to run the tools. </p>
      <p>Macs are somewhat popular in Western Europe and the U.S., but in the rest of the world, they're hardly relevant. We want to make products that allow people to make fonts not just for the Western languages, but also for all the other scripts that exist in the world. </p>
      <p>So we have, and will continue to release products for both Mac OS X and Windows. </p>
      <p>Best,<br>
      Adam</p>
