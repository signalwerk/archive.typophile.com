      <p>Charles, </p>
      <p>InDesign has gone a long way now, but the point is the comparison between PageMaker and InDesign. InDesign did bring native PDF support, full vector-based drawing, Unicode, OpenType, plug-in extensibility and an overall "modern" approach to page layout. PageMaker was an old product, based on a very old core. </p>
      <p>I'm not trying to compare the future FontLab product to InDesign directly :) I'm trying to make the parallel that the difference between FontLab Studio as you know it now (and which version *6* will still be based on) and the future product (let's call it FLS 7 for now) will be just as serious as the difference between PageMaker and InDesign (which both came from the former Aldus and later Adobe development). </p>
      <p>Just as Aldus and later Adobe kept on developing PageMaker while having started a completely new product (InDesign) from scratch, we are working on a similar cycle. We're adding features, maturity and stability to FLS 5.x to make FLS 6. It won't be a revolution but will be an evolution -- of a product which is now (in total) some 15 years old. </p>
      <p>At the same time, we're reinventing the font editor completely, from scratch, based on a very modern and flexible architecture. </p>
      <p>The bottom line is: we're working hard, and we're fortunate to have the largest team of developers that we've ever had, and they're some some very fine people! :) I'm excited. </p>
      <p>Best,<br>
      Adam</p>
