      <p>I do not notice any difference in loading time between UFO and VFB files on my 3 year old Mac.</p>
      <p>The only time I notice quickly is when there is a software or bug issue that prevents me from working well and efficiently.  Whatever FontLab does to make Victoria dance needs to be rock solid above all.  I much prefer rock solid to glitzy and cute features.  The main feature that needs attention is search and replace.</p>
      <p>I have licensed and support the further development of the 3 major players, FontLab, Robofont, and Glyphs and hope they all prosper and have a lovely synergistic competition among themselves. Competition is vital.  We can never trust putting all of our eggs in one basket again.  I have seen this in Quark, Adobe, FontLab, Apple, and Microsoft.  When a product becomes the default standard, developers get complacent and the user gets screwed.  May healthy competition thrive and keep all parties active and honest.</p>
