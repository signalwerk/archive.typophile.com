      <p>Pablo, </p>
      <p>&gt; If you are already working on FL7, why waste your time and energy on FL6?</p>
      <p>As I explained it earlier, it's kind of similar of Aldus and later Adobe working concurrently on PageMaker and InDesign. </p>
      <p>Developing an application from scratch takes a long time. FontLab Studio as we know it today is a very feature-rich application with an established user interface and usage patters by the users. Many people are used to it, they're very proficient in the tool but have been asking for more than just UFO. In our minds, we quite well know what FontLab Studio 6 will be like, and we're essentially implementing what already has been planned. We'll "call it a day" once we've given our devoted users *what they want*. </p>
      <p>What I'm referring to as "FontLab Studio 7" is a different matter. It may well break with many of the old habits and make users introduce new ones. We're working on it, but it's nowhere near completion. Some parts of its functionality haven't been even started, while others are already quite well-implemented. It's certain, however, that users will need to re-learn. Some people may perhaps hate it in the end. It's very likely that the product won't be called "FontLab Studio 7" at all (again, as with PageMaker, where InDesign 1.0 and PageMaker 6.5 and later InDesign 2.0 and PageMaker 7.0 were different products). </p>
      <p>It will take quite some time for the new product to cover all kinds of functionalities that people will need. For some years to come, FontLab Studio (5.x now and 6.0 later this year) will be the *only* product on the market which will offer that particular functionality. In other words, FontLab Studio as we know it now is now a mature product, like a person in their 40s. The fully new product is in its early teen years. At some point, it'll be in its early 20s but will still not be free of faults. There will be people who'll jump onto the new kid on the block but there will be others who'll prefer to stick with the old product. </p>
      <p>You can also see it this way: FontLab Studio as we know it now is so extensive that -- when it comes to the "wealth" of features -- it practically has no match on the market. But there is Glyphs and RoboFont, which are more sophisticated and smoother as a design tool, while on the other hand they don't offer (and probably never will) offer certain other aspects -- like for example manual TrueType hinting. </p>
      <p>The new product will initially be more in the same realm as Glyphs or RoboFab, I suppose. Only with time, it (or perhaps a separate tool) may also cover other parts which are currently unique to FLS. </p>
      <p>With UFO, fortunately, we can have interoperability between all these products. </p>
      <p>With any product, there is a certain development cycle. You have it with fonts as well: </p>
      <p>Imagine FontLab Studio 6 as a typeface which already had earlier versions released, but you're now adding Greek and some OpenType glyphs. It already has 90% of the intended character set, which is kerned and hinted, but now you're working on some additional glyphs, reviewing existing spacing, kerning and hinting, fixing some problems with them, and writing some additional code for OpenType Layout features. </p>
      <p>Then imagine our new product (which I referred to as "FLS7" but this may very well change) as a typeface where you have most of the basic alphabet and quite a few special glyphs already drawn, but you still are deciding on the shape of the serifs, and maybe you'll redraw some of the glyphs completely, and perhaps you'll re-space it fully once again, and there are no composite glyphs or math glyphs or any kerning or hinting done yet. </p>
      <p>You certainly wouldn't say "just drop the first one completely and focus all your energy on the second one", would you? </p>
      <p>Best,<br>
      Adam</p>
