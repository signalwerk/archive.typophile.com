    <p>Adam,</p>
    <p>We got a notice that the large discount to purchase the Fontographer upgrade would expire in a few days, at the end of the month. Now, the only thing I would use Fontographer over FontLab for is it's *change weight* feature (as opposed to FL's *bold*). If I do only that in Fontographer, I'll (1) spend an extra $100, and (2) have a cumbersome workflow. </p>
    <p>It is rumored that when FL Studio 6 comes out, the "bold" will work much better, akin to Fontographer's "change weight." Does anyone at FontLab have a projection when version 6 will come out? </p>
    <p>(Jeez, from your web page, you are partly the marketing manager. Usually I don't ask a marketing manager if I can save some money by not buying one of their products, but in FontLab's case, I figure you guys have our interests at heart.)</p>
