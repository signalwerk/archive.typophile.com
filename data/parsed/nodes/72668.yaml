    html: |-
      <p>Dear all,</p>
      <p>About a year ago, I wrote: "the biggest problem was indeed, the rooting of the Mac version in Mac OS 9, Carbon, and PowerPC. Moving the old code to XCode and Intel turned out to be a huge task and lots of wasted energy. So we concentrated on rewriting the core from scratch, eliminating lots of silly stuff from the past, improving the speed and stability a lot." </p>
      <p>As you can see now -- primarily because of Apple's decision to drop PPC support from Mac OS X 10.7 Lion -- we had to change things once again. </p>
      <p>As it was obvious that the complete rewrite would not be ready before Lion is released, we decided to do what we had dreaded to do for so long. In the last 15 months or so, we did indeed port the Metroworks/PowerPC-based Mac code to XCode/Intel-based Mac code and upgraded all text controls to Unicode (so typing Cyrillic or Greek characters is possible directly in the Preview panel or the Metrics Window's text box), upgraded the Python integration. Especially the first step was a truly major operation -- about 24 man-months of full-time work! </p>
      <p>As I said, the lack of compatibility and support of the older development platforms on the Apple side was the primary reason why the FontLab Studio for Mac development was on hold in 2007-2010. </p>
      <p>Moving from PPC to Intel in our case was really a great challenge, but fortunately, it's done now. And -- hell! -- we decided to swallow the cost of those 24 man-months ourselves and released FLS 5.1 as a free update for all 5.0 users. While FLS 5.1.1 is not yet perfect, it's MUCH more than just a simple update to 5.0.4. Really a lot was changed to make FLS 5.1.1 run 2.5 times faster than 5.0.4. But most of those changes were done "under the hood". </p>
      <p>Anyhow -- the work of the last 15 months has laid a good foundation for FontLab Studio 6 development on the Mac. And after all, in FLS 5.1.1, we have also included some features that were originally planned for FontLab Studio 6: we have integrated Adobe FDK for OpenType version 2.5 and the native Microsoft rasterizers for TrueType hinting preview, included the Clean Up Paths algorithm from Fontographer (in FLS 5.1's Actions panel) as an alternative to Optimize, and done some additional improvements under the hood. </p>
      <p>We realize that for some users it's not much, but that's primarily because we never really planned to release FLS 5.1. All this work was supposed to go into FLS 6.0, along with "real new features" but because of Lion, we needed to shift things around, give all priority to the necessary architectural changes first (so that 5.1 could be released), and do the nice creative things later. </p>
      <p>There are more features that we're working on, and also more bugfixes. Some are already "ready" i.e. implemented in a development build for Windows, and currently we are merging the changes that two teams had done independently (the Windows team and the Mac team). Others have been developed while we worked on Fontographer 5.0 and 5.1 (a huge lot, actually), and we're now able to "move" them into FontLab Studio. We are also prioritizing the features that still need to be developed, and working on their implementation. </p>
      <p>I'd like to add that for years, FontLab and later FontLab Studio were developed by just two people (one on Mac, one on Windows). We now have a team of seven people working on FontLab Studio 6, and they're making good progress. </p>
      <p>We also have a separate team working on a complete rewrite of the code, but that project -- while it's hugely exciting and, dare I say, quite revolutionary -- will still take time to gain shape.  </p>
      <p>Overall, I can say that in the last 12 months, I've seen the most intense development progress at Fontlab Ltd. since I joined the company in 2004. </p>
      <p>So basically, the bottom line is: FontLab Studio 6 will be built on the mature, solid foundation of the current FLS 5.1 codebase. It won't be a revolution, but will be an evolution. It's being worked on as we speak. It will suffer from some limitations of the FLS 5.x codebase (e.g. integer coordinates only), and will not include a huge number of revolutionary changes, but our goal is: some good new features and a lot of stability improvements. I still cannot give you any specific times at this point simply because -- as I said -- we're currently doing the major improvement in the code, and it's difficult to estimate when we'll have something which will be ready-to-ship. But we'll start seeding pre-release versions to groups of testers within the next few months. </p>
      <p>At the same time, we're working on a product that will be a completely new thing. From what I've seen: if FontLab Studio 5 was PageMaker 6, then FontLab Studio 6 will be PageMaker 7, and "the completely new thing" will be InDesign. </p>
      <p>You'll be hearing from us. Before the end of the world, I'm sure of it! </p>
      <p>Happy 2012 for you all! </p>
      <p>Best,<br>
      Adam</p>
    html_clean: |-
      <p>Dear all,</p>
