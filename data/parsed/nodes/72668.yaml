      <p>Nick, </p>
      <p>Microsoft Font Validator has not been updated in a long time. The OS/2 table version 4 and the gasp table version 1 have been added to the OpenType standard after the release of Font Validator, so the complaints related to OS/2 and gasp are all a false alarm. The tables are correct. </p>
      <p>As for the "W0020—Tables are not in optimal order: table 'glyf' precedes table 'loca'" warning, it's by no means critical but we'll look into it. </p>
      <p>Thanks,<br>
      Adam</p>
