      <p>We’ve been releasing the things first which were ready first. </p>
      <p>TransType 4 was primarily made so that we could test the fully rewritten and modernized import/export infrastructure (OTF, TTF, EOT, WOFF, SVG, VFB, UFO and all the other formats, including conversions between them). We basically wanted the “gear” done and stable — before releasing a follow-up to FontLab Studio. We figured, it’s more important to have a tool with limited functionality which generates good fonts than to have a tool with full functionality that generates bad fonts. </p>
      <p>FontLab Pad was done because it was very easy — it’s essentially the Preview panel of TransType. In the same vein, we wanted to have a tool for ourselves — a testing app for the color fonts in all the relevant formats (sbix, COLR, SVG). </p>
      <p>We’re heavily under way on glyph editing right now. The lack of my activity here on Typophile and other forums actually indicates that we’re working hard. </p>
      <p>We’ll start publishing pre-release versions of our new font editor in the next months. </p>
      <p>You’ll love it, and you’ll be blown away :) </p>
      <p>A.</p>
