    html: |-
      <p>Every time I see Adam, which is usually at least once a year, I ask for a progress report. The good news is that there is always progress, and some of it is very cool. The bad news, from my perspective, is that updating to FontLab 6 might require as much of a re-investment in Python scripting as switching to RoboFont or Glyphs.</p>
      <p>This is mostly guesswork, but I think FontLab are a little wrong-footed by the recent advent of competition in the primary glyph tool category from RoboFont and Glyphs, just as they were previously wrong-footed by the initial poor implementation of the Mac version of FontLab Studio, which contributed to the development of that competition. It took a lot of effort from what I understand to be a reduced team to remake a stable version of FLS for Mac, and that is part of the reason why 'Victoria' -- the new code architecture for FontLab 6 -- has been delayed. Remember, FontLab has always been primarily a Windows tool and only secondarily ported to Mac. I was reflecting recently that it was about 20 years ago that I saw an ad in a desktop publishing magazine and bought my first license for FontLab 2.5. It was good, and successive (Windows) versions of FontLab have remained good. Current trends favour more openly scriptable object structures, which is a good thing, but it terms of core functionality FLS remains better than any other tool I have tried, and even with its current scripting model fits nicely into my sfnt-centric workflow. I also remain impressed by the size and performance of the VFB source format, even for large fonts of the kinds I regularly build, compared to UFO, which contains less information in much larger files and takes ages to load even in dedicated UFO tools. While I can understand why people are keen for a version of FontLab that natively handles UFO files, I'd like to see the VFB format open-sourced and supported in UFO tools.</p>
