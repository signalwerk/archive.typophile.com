    html: |-
      <p>Nick, with regard to the table order warning, this is a test that Microsoft put into Font Validator based on performance testing that they did in the 1990s. If the tables are in a particular order, Windows can do some things faster. If you're concerned about this, you can run the FastFont command line tool from MS on your fonts, which will put the tables in the 'optimal' order.</p>
      <p>Adam, I don't know if the preferred table order is published anywhere, but you presumably run FastFont on a font and then look what the resulting table order is. If your new tools would write that order by default, it would save us a post-productions step.</p>
