    html: |-
      <p>Dunwich Type: No, we've provided some funding for RoboFab development, but not for Glyphs. </p>
      <p>Charles: It's not like that. Georg approached us quite some time ago, giving us suggestions for further development of our product. He started developing Glyphs as a proof of concept that his ideas had merit. We've been in informal contact for a few years, and a few months ago (at the ATypI Dublin conference, in fact), we've come to a mutual agreement that it's best for both sides if Georg is working for us, and helps us improve the products. By the way, the story is quite similar to how I came to work for FontLab. I've corresponded with the developers for a few years and shared my ideas with them, and at some point they decided to invite me to their team. There is certainly no conspiracy behind all this :) </p>
      <p>The past few months of development also showed us that we need to rewrite some major parts of our 13-years-old code from scratch. Some limitations of it (such as the integer coordinates, limitation to +-32,000 in coordinate space, hardwired Multiple Master support) limited us largely as for what we could do. But the biggest problem was indeed, the rooting of the Mac version in Mac OS 9, Carbon, and PowerPC. Moving the old code to XCode and Intel turned out to be a huge task and lots of wasted energy. So we concentrated on rewriting the core from scratch, eliminating lots of silly stuff from the past, improving the speed and stability a lot. A huge part of it is already done, but we were not able to finalize the application by the end of the last calendar year. </p>
      <p>I realize that it's disappointing for many of our customers, but please be assured that we *are* working at our full capacity on the project. It's just a hugely complex application and we do have very limited resources (in short: we're a small company). </p>
      <p>I'll keep you posted on new developments, of course. </p>
      <p>Best regards,<br>
      Adam</p>
