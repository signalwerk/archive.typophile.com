      All our recent applications, from OTM to LeMo have been made using Qt, and sooner or later we will have a new font editor also.<br>
      &nbsp;<br>
      (At the moment I am thinking of an iOS version of [the new edition of] LeMo [which will be for free again, of course].)<br>
