    html: |-
      <p>Tourdeforce, </p>
      <p>Most applications made for Windows are 32-bit. Also many Mac OS X applications are 32-bit (although the OS is natively 64 bit since 10.6). For example, Google Chrome, Mozilla Firefox, Skype, Adobe InDesign CS5, Adobe Illustrator CS5 and many many others. They all work fine on a 64-bit system. As far as I could tell, FontLab Studio 5.1 (Mac) and 5.0.4 (Win) work well there as well. </p>
      <p>The only slight complication is when you heavily use Python and C-compiled modules. Some C-compiled modules made for Python may be 64-bit only (though it's still a rarity). Or at the very least you need to be aware of that -- so for example, on Windows 7 64-bit, you need to install the 32-bit version of Python 2.4 rather than the 64-bit version. </p>
      <p>Best,<br>
      Adam</p>
