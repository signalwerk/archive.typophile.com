      <p>tourdeforce, </p>
      <p>font development isn't particularly RAM-hungry. The 4 GB limit is far more than enough. Native 64-bit is mostly needed for large images or video editing where you're really dealing with huge amounts of data. Yet developing a native 64-bit version is costly, because you can't just switch to it -- you still need a 32-bit version of code. We're already making a Mac and a Windows version, and adding the 32+64 bit pair to each those would mean double the binaries. Then, there's the PPC + Intel on the Mac etc. When developing applications, they need to be tested in a variety of environments. We already have several versions of Windows and Mac OS X on which we need to test. </p>
      <p>Let's say we release the Windows version of the app only as 32-bit native. Then we need to test that code on Windows 7 32-bit and Windows 7 64-bit. </p>
      <p>But if we release the Windows version of the app as both 32-bit and 64-bit, we'd need to test the 32-bit code on Windows 7 32-bit and Windows 7 64-bit, and the 64-bit code on Windows 7 64-bit. And then also comes Windows XP and Vista, and the Mac OS X versions etc. </p>
      <p>So it'd just add more combinations that would need to be thoroughly tested, which would only delay the release of the products even further. So we think it's not worth the effort. </p>
      <p>I hope you understand the above reasoning. </p>
      <p>Best,<br>
      Adam</p>
