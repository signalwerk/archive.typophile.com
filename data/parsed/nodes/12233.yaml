    <p><strong> <a href="/node/add/wiki?edit%5Btitle%5D=Indicies" title="Create node &quot;Indicies&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indicies</a>&nbsp;: <a href="/wiki/foundries" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Foundries</a>&nbsp;: Heidelberger Druckmaschinen <span class="caps">AG</span></strong></p>
    <p>German manufacturer of printing presses and printing supplies. The largest producers of printing presses in the&nbsp;world.</p>
    <p>During the 1990s, this company purchased a failing competitor, Linotype-Hell <span class="caps">AG</span>. Part of that company was reorganized as <a href="/node/12172" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Linotype Library</a> GmbH. In November 2005, Linotype Library GmbH changed its name to the stortend <a href="/node/13697" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Linotype</a> GmbH.</p>
    <p>In 2006, Heidelberger Druckmaschinen sold Linotype GmbH to <a href="/node/12126" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Monotype Imaging Inc.</a>.</p>
