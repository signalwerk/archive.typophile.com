    <p>Hi, everybody. </p>
    <p>I’m branching off into freelance design and wanted to create a mark that was simple and vibrant. I think I succeeded with the graphical portion of my idea, but less so with the self-made typeface. Feel free to tell me otherwise on either account.</p>
    <p>This is my first typeface and it was positioned to me by a friend that the font had too little in common with the mark. I, though not as knowledgeable as the other fellow, thought that I was going for a juxtaposition of elements in an effort to make them stand out. A secondary concern was that the font should look at home next to its web-friend Verdana.</p>
    <p>Frenden Design is the primary logo here. The others are two side projects that I thought might be fun to keep in the same family, looks-wise. The three pronged design helped with that to an extent.</p>
    <p>A few of the letterforms on my home-brew font are too similar and would be hard to read at small sizes. I intend on fixing that if things are working at all. If they aren’t working out so well together, why bother?</p>
    <p>The only conceptual comment regarding the logo that I have is, my name is Ray and the logo sort of has the feel of rays of sunlight.</p>
    <p>Thanks in advance for feedback left; sorry if I over explained. I have that tendency.</p>
