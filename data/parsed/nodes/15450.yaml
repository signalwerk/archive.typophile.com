    <p>Hi everyone! Since there were great responses from the last topic I made, I’ve decided to make another! </p>
    <p>For my assignment, I have to create an A2 size broad sheet (Kinda like a poster). I’ve done alot of experimental things to the body of text that’s about 5000 words i.e. cut them out, overlapped etc. I’ve broken alot of the rules!! </p>
    <p>Basically, how I’ve arranged and designed the text looks dynamic and eye catching, but illegible at the same time. I just want to know what’s essential to make something legible to read i.e. a good kerning size, leading etc, while still keeping the same shape/look. Readability is crucial to this sheet, so any information such as how text should be arranged or what typeface is too small for reading would be extremely useful.  </p>
    <p>Also, if anyone can recommend a futuristic looking, technical typeface for the heading would be great! The topic for the broad sheet is about pre-terrorism (like pre-crime from the movie Minority Report). </p>
    <p>Thanks for your time! I hope to hear alot of great responses again!! =) </p>
    <p>Vincent.</p>
