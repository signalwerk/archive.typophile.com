    <p>Hi everyone, </p>
    <p>I'm looking for this font, used by Karssonwilker, Inc. on John Hollenbeck's Claudia Quintet's most recent albums.<br>
    The capital Q is very distinctive, as you can see here :</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/jh1_0_5812.jpg"></div><p></p>
    <p>I've been looking around quite a while but found nothing that matches</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/jh10_0_3836.jpg"></div><p></p>
    <p>Also apparently the numerals used in the tracklist are a monospace variation, as the "1" on the following image appears to miss the slant</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/jh7_0_6015.jpg"></div><p></p>
    <p>Thanks a lot folks!</p>
