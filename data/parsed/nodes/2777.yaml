    html: "<p>Tom,  <br>The way California wraps around itself with the swash letters strongly says \"art work\" not font. In addition to Ignacio's suggestions Letterhead fonts has two fonts that come with a variety of underlining swashes: <br><a href=\"http://www.letterheadfonts.com/styles/script.shtml\" target=\"_blank\">Pilsner and Ephemera</a>. With the right graphics tools you could make some pretty fancy lettering with those.</p>"
