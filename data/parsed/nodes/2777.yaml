    html: <p>The California Soul, imo, is a straight scan from a <br>vintage California tourist-type tee or postcard. <br> <br>It features a mix of italic and script forms. <br> <br>The 'Soul' looks tacked on House Industries, I think <br>from the Vegas set... <br> <br>Similar fonts can be found by checking out myfonts.com <br>and typing keyword 70s. <br> <br>Just three off the top, Lazybones, Candice, and Octopuss.</p>
