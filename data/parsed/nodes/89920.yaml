      <p>you can find it under the names:<br>
      <strong>GatsbyFLF</strong> by Richard A. Ware (1986-92)<br>
      <strong>GatsbyFLF</strong> by Casady &amp; Greene (2004)<br>
      <strong>GetburgDB</strong> by Christine Mauerkirchner und Rainer Grunert<br>
      but I don't know if any of them is the original design.</p>
      <p>You can find it also under other names by well known font-forgery companies,<br>
      which I prefer to not mention.</p>
