      <p>Panoptica doesn’t have as many fonts as Trivia, but it equals the number of styles (seven), with a different plan:</p>
      <p>Oldstyle (Regular &amp; Italic)<br>
      Egyptian/Slab<br>
      Script<br>
      Octagonal<br>
      Doesburg<br>
      Pixel<br>
      Sans (Regular, Medium and Bold)</p>
