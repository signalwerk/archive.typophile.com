      <p>One of the best-known superfamilies is of course Luc(as) de Groot’s <cite>Thesis,</cite> currently including the following members:</p>
      <p>– <a href="http://www.lucasfonts.com/fonts/thesans/thesans/" rel="nofollow">TheSans</a> (<a href="http://www.lucasfonts.com/fonts/thesans/thesans-hair/" rel="nofollow">Hair</a>/<a href="http://www.lucasfonts.com/fonts/thesans/thesans-condensed/" rel="nofollow">Condensed</a>)<br>
      – <a href="http://www.lucasfonts.com/fonts/thesansmono/thesansmono/" rel="nofollow">TheSansMono</a> (<a href="http://www.lucasfonts.com/fonts/thesansmono/thesansmono-semicondensed/" rel="nofollow">SemiCondensed</a>/<a href="http://www.lucasfonts.com/fonts/thesansmono/thesansmono-condensed/" rel="nofollow">Condensed</a>/<a href="http://www.lucasfonts.com/fonts/thesansmono/thesans-typewriter/" rel="nofollow">Typewriter</a>)<br>
      – <a href="http://www.lucasfonts.com/fonts/thesansarabic/thesansarabic/overview/" rel="nofollow">TheSansArabic</a><br>
      – <a href="http://www.lucasfonts.com/fonts/themix/themix/" rel="nofollow">TheMix</a> (<a href="http://www.lucasfonts.com/fonts/themix/themix-condensed/" rel="nofollow">Condensed</a>)<br>
      – <a href="http://www.lucasfonts.com/fonts/themixmono/themixmono/" rel="nofollow">TheMixMono</a><br>
      – <a href="http://www.lucasfonts.com/fonts/themixarabic/themixarabic/overview/" rel="nofollow">TheMixArabic</a><br>
      – <a href="http://www.lucasfonts.com/fonts/theserif/theserif/" rel="nofollow">TheSerif</a><br>
      – <a href="http://www.lucasfonts.com/fonts/theantiqua/theantiquab/" rel="nofollow">TheAntiquaB</a>/<a href="http://www.lucasfonts.com/fonts/theantiqua/theantiqua-sun/" rel="nofollow">TheAntiquaSun</a></p>
      <p>There’s a lot of potential for expansion, obviously. Can’t wait to see the release of TheAntiquaSun Mono SemiCondensed Hair.</p>
