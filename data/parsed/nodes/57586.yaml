    html: |-
      <p><a href="http://www.letterheadfonts.com/fonts/newenglish.shtml" rel="nofollow">New English</a> at Lettherhead looks interesting, Paul, but it's a little more condensed that I was hoping to start with. LHF's <a href="http://www.letterheadfonts.com/fonts/hindlewood.shtml" rel="nofollow">Hindlewood</a> and <a href="http://www.letterheadfonts.com/fonts/divine.shtml" rel="nofollow">Divine</a> are also cool. Good for my shopping list but not this project. </p>
      <p>Stephen, Engraver's Olde English Bold will work well! I will still be forced to squish it a little, but since I'm redrawing it and reducing the contrast a little (thin lines are too thin to cut from mother of pearl without breaking), hopefully it won't look squished when I'm done. </p>
      <p>Shame I can't use the Storm Moyenage. It's exactly the legibility that precludes it from this project. Another one for the shopping list.</p>
      <p>Thanks for the help, everyone. I will post pics when the project is done, and if I'm allowed by the client, I'll post some of the design before we cut the letters.</p>
