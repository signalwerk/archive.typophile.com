  html: |-
    <p>I'm working on a guitar inlay that has 10 large letters across the fingerboard. The client wants a blackletter similar to Letraset's "Old English" but what they provided as their concept sketch is squooshed down to fit the shape of the fingerboard. </p>
    <p>Lots of the blackletter fonts naturally have a more condensed look to them, are there any that are more extended in their native form? I'd like to get them the look they are after, but without some horrible scaling. Any leads?</p>
  html_clean: |-
