      <p>Chirs, the logo is for a consumer product (a notebook). Sorry for being vague, but I've signed a NDA.</p>
      <p>VAG rounded for marketing collateral. </p>
      <p>...Now thinking of cutting Vag Rounded to make the logo.</p>
      <p>By the way, thanks Nick for the Softmachine suggestion. I really like it!  And all the other typefaces you have created. Great work.</p>
      <p>For this situation Softmachine is too playful.</p>
      <p>I need suggestions for other, more serious, and more corporate typefaces that would work with Vag Rounded.</p>
      <p>And I need suggestions for a Mac - PC default typeface to work with Vag Rounded. Perhaps this default typeface could be that more corporate typeface..</p>
      <p>Much thanks for your assistance thus far.</p>
      <p>Look forward to hearing what you guys think.</p>
