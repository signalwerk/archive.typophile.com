      <p>I think caps with small caps are classy if done correctly. As already expressed, if a word is set in a caps/small caps situation, it must be properly spaced. Also let's not forget about font choice. Using a font intended for long passages of text for display is a big no-no! For example using Hoefler Text in display setting when really you should be using the Hoefler Titling. (Yes there are caveats to this... and yes there are ways to make Hoefler Text look good for Titling but generally speaking its not advisable... its for TEXT!!!) Filosofia, pictured above, is a member of a choice group type designs where text/book faces scale well all the way to headline/display. When I go font 'shopping' I try to look for fonts that have this characteristic or they have 'optical' set like Adobe does.</p>
      <p>All my best,</p>
      <p>Mike Diaz</p>
    html_clean: |-
