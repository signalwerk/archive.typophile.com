      <p>&gt; Small caps are optimized for use at text size.</p>
      <p>Not necessarily. For example, in every Adobe Original typeface with small caps, the small caps are designed for use at the same size as the caps. In many of those cases, that may specifically be subhead or display size.</p>
      <p>Personally, I think the caps-with-small-caps is most likely to look ungainly when the small-cap-height is relatively low, as in the example at the beginning of this thread. I am not against it in principle, myself.</p>
      <p>Cheers,</p>
      <p>T</p>
