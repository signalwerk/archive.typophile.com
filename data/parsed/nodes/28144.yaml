      <p><em>Small caps are optimized for use at text size.</em></p>
      <p>OK. Let me have another go at that: what I meant to say is that small caps are optimized for use <em>in </em>text, with lower case.</p>
      <p>It's true that display size small caps are available, but as can be seen in this example, the small caps are beefed up to hold their own against the lower case, with the result that they are slightly too heavy, and too wide, to fully harmonize with the capitals. This is not a criticism of Robert Slimbach's elegant design and draftsmanship, but the recognition of what is perhaps an impossible situation -- to design a small cap that perfectly matches both cap and lower case. But perhaps it is more feasible with certain type genres than others.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/MinSC_6458.jpg"></div><p></p>
