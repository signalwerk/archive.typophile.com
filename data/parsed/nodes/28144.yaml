    <p></p><div class="imageWrap"><img src="http://typophile.com/files/TYPE1_3420.png"></div><p></p>
    <p>I'm relating to the definition of type crime made by Ellen Lutpon in Thinking with type book.<br>
    I've seen lately some work with small caps used in the title form and I believe it to be a type crime, but I haven't found a solid explanation, and therefore I hope to have some contributions on the subject. I'm not assuming a radical position, I believe it is possible to use it in very specific occasions, but with serif fonts titling texts, or even with names and identity it looks like it makes no sense, and I can't find a convention that backs this sort of usage. Was it possible to do in the old days of lead typesetting? Or it is just one of those features that everyone uses only because it is possible to do?</p>
  html_clean: |-
