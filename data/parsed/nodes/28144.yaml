    html: |-
      <p>Here are some differing strategies for "Caps with Small Caps" titling.<br>
      I don't think any of them are ideal for this typeface.<br>
      In the designated small cap font the small cap is, as I said earlier, too wide.<br>
      You get better matched letter proportions by "faking" the display small cap with a downsized "normal" cap, but the stem widths don't quite match.<br>
      My preference for the best match is the Regular with SemiBold, although it might be a bit heavy overall.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/EEees_5827.jpg"></div><p></p>
      <p>To demonstrate that the situation is not a fault of any particular typefaces, but rather the outcome of the general habit of creating small caps primarily in relation to lower case, I've created an alternate small cap for Goudy, matched to the capital.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Eees_5219.jpg"></div><p></p>
      <p>There may be other genres of type where the caps and small caps are better matched, and some typefaces where the small cap is matched to the cap rather than the lower case, but it is my opinion that in general, old style faces are configured like Minion and Goudy, making the use of caps/small caps in titling problematic, and requiring quite discriminating typography.</p>
