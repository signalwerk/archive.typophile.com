      <p>James Felici in his 'Complete Manual of Typography' says that the combo of caps and small caps is often used for chapter headings. He does not censure them at all, but only has a few cautions: to take care about adequate spacing, to evenly space the transition from the full to small caps, and to avoid hyphens in titles.</p>
      <p>Some small caps look better than others of course. I was intrigued to hear Matthew Carter mention at the TypeCon critique session that he thinks that the small caps are the 'best part of every font.'</p>
