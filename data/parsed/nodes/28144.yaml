      <p>Small caps are optimized for use at text size.<br>
      So the effect might be a bit klunky at title size.</p>
      <p>Often they are more horizontally extended than capitals, which might be apparent at title size, and look odd.</p>
      <p>I think the best use of small caps for titling is to get the effect of optical scaling, one line of all caps followed by another of small caps.</p>
      <p>Being a purist, I have never liked the mixture of caps with small caps in the same word. It just seems strange, I mean, there's no lower case with small lower case style. </p>
      <p>I don't know why CwSC looks odd, but it may be to do with the awkward fit between the two, especially involving the T. if you look at the words "Type Crime" above, the TY fit is actually quite nice compared to CwSC in many faces, but the way they reach out to each other seems mannered. This is not a criticism of this particular face, but the alphabet.</p>
