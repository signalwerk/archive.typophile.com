    <p>I teach a History of Visual Communication and Design class at a community college. I have struck out finding any decent videos or dvds pertaining to design. I have found Duchamp, Mondrian, man Ray vids but I am looking for more relevant 20th C designers and design movements. I would love to find anything on Constructivism, de Stijl, Bauhaus, Modernism, Swiss school. Anybody have anything you could point me to?</p>
