      <p>Hillman Curtis has produced some excellent short films/videos on various designers called, appropriately enough, The Designer Series. I don’t know if they are available on DVD or not though. It would be nice if they were. I really enjoyed watching all of them, and they include some very well known designers - Sagmeister, Carson, Pentagram (Scher, Beirut), etc. You can watch them at:<br>
      <a href="http://www.hillmancurtis.com/hc_web/film_video.shtml" title="http://www.hillmancurtis.com/hc_web/film_video.shtml">http://www.hillmancurtis.com/hc_web/film_video.shtml</a></p>
