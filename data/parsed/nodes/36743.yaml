      <p>I think you need to visit some of the stroke connections, especially in the upper case, in spots where there is a lot of mass concentrated: M, N, K, R. W, lowercase k. You may need to taper some strokes as these junctions, or have them connect differently.</p>
      <p>Echoing James' comment, the upper case isn't as consistent as the lower. The A and the M especially don't match the rest.</p>
      <p>I would like to see some sample text set in your font.</p>
