    html: |-
      <p>Regarding the A and M: although your A has a lower-than-normal bar which matches the font, it doesn't have the quirks that make the other letters interesting. Perhaps the top should be narrower and angled. Likewise, the M looks too "normal" when there is opportunity here to give it more personality, such as angles at the top of the stems. The V as well could use that treatment, as most of the other letters where that can be done have it.</p>
      <p>Personally, I like the G; if you extend the upper terminal, perhaps still keep it a bit to the left of what would be "normal".</p>
      <p>On the lowercase e, you might move the lower terminal a bit to the left; currently it looks like you're not sure if it should align with the top. Make it definitely align, or obviously not. I think the latter would suit the font.</p>
