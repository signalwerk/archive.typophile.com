      <p>There’s a lot of really great stuff going on here, but I would like to see a specimen with some words set. The lowercase alphabet seems more grounded than the uppercase, which almost seems to be leaning and wobbling, although I think some of that is due to the letterspacing.</p>
      <p>To nitpick: G looks like it’s tipping to the left, and I’m confused by the terminals of U angling to the reverse of everything else. The same goes for the terminal of the upper horizontal in E and F slanting differently.</p>
