    <p>This is my first post, and also the first typeface that I have designed (other than several partial alphabets in school). I have completed the upper and lower cases, and am working on drawing the numbers. At this point I feel like I could use some crit.</p>
    <p>The letters are all traced using type tool with auto metrics and auto kerning applied, and generated as open type ps. I am not sure about some of the character widths, and also could use some suggestions as to how the language of the upper case should translate to the lower case (for example if an upper case letter has an angled terminal, should the lower case as well? As is the case with the X). If it is helpful I can set a block of text with the face, and post it later.</p>
    <p>I look forward to your critique.<br>
    Thanks in advance</p>
    <p>andy</p>
