    html: |-
      <p>Those charts are indeed great to get an idea of how the characters are expected to look like. For the other information the charts contain, I find the file <a href="http://www.unicode.org/Public/UNIDATA/NamesList.txt" rel="nofollow">NamesList.txt</a> much more useful. For instance, to get the relevant characters for Vietnamese, just search for "Vietnamese" in <a href="http://www.unicode.org/Public/UNIDATA/NamesList.txt" rel="nofollow">NamesList.txt</a>.</p>
      <p>Better still, with just basic knowledge of Python, unicodedata (see ref on <a href="http://docs.python.org/2/library/unicodedata.html" title="http://docs.python.org/2/library/unicodedata.html">http://docs.python.org/2/library/unicodedata.html</a>) gives you a fast access to what I find relevant information in <a href="http://www.unicode.org/Public/UNIDATA/" title="http://www.unicode.org/Public/UNIDATA/">http://www.unicode.org/Public/UNIDATA/</a></p>
      <p>I don't know how much that can be useful for font design but here is for instance a script that finds the NFD canonical decomposition of characters in a range specified by two hex numbers and prints all the component characters; no need to search the files on the unicode site:</p>
      <pre>---- file decomp ---- cut here
      #!/usr/bin/env python

      import unicodedata, sys
      ud=unicodedata

      if len(sys.argv) &lt; 2:
        print """Usage: %s starthex endhex
              Example: %s 1EA0 1EF1 """ %(sys.argv[0],sys.argv[0])
        exit()

      start=int(sys.argv[1],16)
      end=int(sys.argv[2],16)

      def uhexandname(h):
        try:
          nam=ud.name(unichr(h))
        except:
          nam=''
        return "u%04X  %s" % (h, nam)

      schars=set([])
      for h in range(start,end+1):
        schars |= {ord(c) for c in ud.normalize('NFD',unichr(h))}

      lchars=list(schars); lchars.sort()
      for c in lchars:
        print uhexandname(c)
      ---- cut here ---
      </pre><p>Here is a trace of execution, showing all components of character in the range 1EA0 -- 1EF1 (included):</p>
      <pre>611 % decomp 1EA0 1EF1
      u0041  LATIN CAPITAL LETTER A
      u0045  LATIN CAPITAL LETTER E
      u0049  LATIN CAPITAL LETTER I
      u004F  LATIN CAPITAL LETTER O
      u0055  LATIN CAPITAL LETTER U
      u0061  LATIN SMALL LETTER A
      u0065  LATIN SMALL LETTER E
      u0069  LATIN SMALL LETTER I
      u006F  LATIN SMALL LETTER O
      u0075  LATIN SMALL LETTER U
      u0300  COMBINING GRAVE ACCENT
      u0301  COMBINING ACUTE ACCENT
      u0302  COMBINING CIRCUMFLEX ACCENT
      u0303  COMBINING TILDE
      u0306  COMBINING BREVE
      u0309  COMBINING HOOK ABOVE
      u031B  COMBINING HORN
      u0323  COMBINING DOT BELOW
      </pre><p>That was tested with python2.7.2.</p>
