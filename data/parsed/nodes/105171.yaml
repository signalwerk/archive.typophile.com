    <p>Hi all,<br>
    I'm newbie so maybe this question is quite silly to you.</p>
    <p>I'm designing a new font for my personal purpose. I've just finish basic latin characters and now moving to Vietnamese characters (or someting like: Western Europe, Central Europe...). How could I link to these all ones because the software just shows basic letters on keyboard. (I'm using Fontlab)<br>
    I had an idea to search their unicode code (on Wikipedia)  for each but it took a lot of times to do so.</p>
    <p>Thanks for your answer.</p>
    <p>Duong.</p>
