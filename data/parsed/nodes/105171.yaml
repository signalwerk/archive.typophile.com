      <p>You can get the pane for that codepage by clicking "page mode" at the bottom and then choose as follows:</p>
      <p>If you want to add the Vietnamese characters in the Latin extensions, you choose another pane. You select "Ranges mode" and then "1E00 Latin Extended Additional". The characters that concern you are from 1EA0 to 1EF1.</p>
      <p>The pictures are scaled. If you find them too small, open them in a new window or new tab.</p>
