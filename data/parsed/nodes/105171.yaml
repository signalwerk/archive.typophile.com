      <p>The following letters appear in the <a href="http://en.wikipedia.org/wiki/Vietnamese_alphabet#Tone_marks">Wikipedia table</a>. They do not figure in the Fontlab win_1258.enc file (at least those hex values do not appear in the comments).</p>
      <p>00C3     LATIN CAPITAL LETTER A WITH TILDE<br>
      00CC     LATIN CAPITAL LETTER I WITH GRAVE<br>
      00D2     LATIN CAPITAL LETTER O WITH GRAVE<br>
      00D5     LATIN CAPITAL LETTER O WITH TILDE<br>
      00DD     LATIN CAPITAL LETTER Y WITH ACUTE<br>
      00E3     LATIN SMALL LETTER A WITH TILDE<br>
      00EC     LATIN SMALL LETTER I WITH GRAVE<br>
      00F2     LATIN SMALL LETTER O WITH GRAVE<br>
      00F5     LATIN SMALL LETTER O WITH TILDE<br>
      00FD     LATIN SMALL LETTER Y WITH ACUTE<br>
      0128     LATIN CAPITAL LETTER I WITH TILDE<br>
      0129     LATIN SMALL LETTER I WITH TILDE<br>
      0168     LATIN CAPITAL LETTER U WITH TILDE<br>
      0169     LATIN SMALL LETTER U WITH TILDE</p>
      <p>Are they also required? Is there no clear and reliable list?</p>
