    html: |-
      <p>Those charts are indeed great to get an idea of how the characters are expected to look like. For the other information the charts contain, I find the file <a href="http://www.unicode.org/Public/UNIDATA/NamesList.txt">NamesList.txt</a> much more useful. For instance, to get the relevant characters for Vietnamese, just search for "Vietnamese" in <a href="http://www.unicode.org/Public/UNIDATA/NamesList.txt">NamesList.txt</a>.</p>
      <p>Better still, with just basic knowledge of Python, unicodedata (see ref on <a href="http://docs.python.org/2/library/unicodedata.html">http://docs.python.org/2/library/unicodedata.html</a>) gives you a fast access to what I find relevant information in <a href="http://www.unicode.org/Public/UNIDATA/">http://www.unicode.org/Public/UNIDATA/</a></p>
      <p>I don't know how much that can be useful for font design but here is for instance a script that finds the NFD canonical decomposition of characters in a range specified by two hex numbers and prints all the component characters; no need to search the files on the unicode site:</p>
      <p>---- file decomp ---- cut here<br>
      #!/usr/bin/env python</p>
      <p>import unicodedata, sys<br>
      ud=unicodedata</p>
      <p>if len(sys.argv) &lt; 2:<br>
        print """Usage: %s starthex endhex<br>
              Example: %s 1EA0 1EF1 """ %(sys.argv[0],sys.argv[0])<br>
        exit()</p>
      <p>start=int(sys.argv[1],16)<br>
      end=int(sys.argv[2],16)</p>
      <p>def uhexandname(h):<br>
        try:<br>
          nam=ud.name(unichr(h))<br>
        except:<br>
          nam=''<br>
        return "u%04X  %s" % (h, nam)</p>
      <p>schars=set([])<br>
      for h in range(start,end+1):<br>
        schars |= {ord(c) for c in ud.normalize('NFD',unichr(h))}</p>
      <p>lchars=list(schars); lchars.sort()<br>
      for c in lchars:<br>
        print uhexandname(c)<br>
      ---- cut here ---</p>
      <p>Here is a trace of execution, showing all components of character in the range 1EA0 -- 1EF1 (included):</p>
      <p>611 % decomp 1EA0 1EF1<br>
      u0041  LATIN CAPITAL LETTER A<br>
      u0045  LATIN CAPITAL LETTER E<br>
      u0049  LATIN CAPITAL LETTER I<br>
      u004F  LATIN CAPITAL LETTER O<br>
      u0055  LATIN CAPITAL LETTER U<br>
      u0061  LATIN SMALL LETTER A<br>
      u0065  LATIN SMALL LETTER E<br>
      u0069  LATIN SMALL LETTER I<br>
      u006F  LATIN SMALL LETTER O<br>
      u0075  LATIN SMALL LETTER U<br>
      u0300  COMBINING GRAVE ACCENT<br>
      u0301  COMBINING ACUTE ACCENT<br>
      u0302  COMBINING CIRCUMFLEX ACCENT<br>
      u0303  COMBINING TILDE<br>
      u0306  COMBINING BREVE<br>
      u0309  COMBINING HOOK ABOVE<br>
      u031B  COMBINING HORN<br>
      u0323  COMBINING DOT BELOW</p>
      <p>That was tested with python2.7.2.</p>
