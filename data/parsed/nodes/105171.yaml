         0301 COMBINING ACUTE ACCENT<br>
         0103 LATIN SMALL LETTER A WITH BREVE<br>
         0323 COMBINING DOT BELOW</p>
      <p>(from a dump of the utf8 text file). Now, if I copy those characters with option C in vi and paste them with option V (either in vi or textedit), the letters that are pasted are </p>
      <p>   1EB1 LATIN SMALL LETTER A WITH BREVE AND GRAVE<br>
         1EB3 LATIN SMALL LETTER A WITH BREVE AND HOOK ABOVE<br>
         1EB5 LATIN SMALL LETTER A WITH BREVE AND TILDE<br>
         1EAF LATIN SMALL LETTER A WITH BREVE AND ACUTE<br>
         1EB7 LATIN SMALL LETTER A WITH BREVE AND DOT BELOW</p>
      <p>During the copy-paste the string is recoded. That is a behaviour I did not expect. Is that something that is documented and, if so, where? </p>
      <p>(In fact, this text was written in textedit, and pasted with Chrome in the typophile edit window  and the recoding also appears to have occurred on the first line but this may come this time from some Unicode normalization rule for data interchange. Nevertheless, with the link <a href="http://typophile.com/files/clavierviet.html">/files/clavierviet.html</a>, no recoding seems to occur)</p>
      <p>(Added: If I view <a href="http://typophile.com/files/clavierviet.html">/files/clavierviet.html</a> with Safari, copy the string and paste it, the combining diacritics are kept as with Chrome. If I do the same with Firefox, the recoding occurs, independently of the font used for viewing, even with a font with no ccmp table. Note that I am now on OS X 10.6.8 with Firefox 21.0)</p>
