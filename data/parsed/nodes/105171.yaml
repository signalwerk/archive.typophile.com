      <p>They are indeed in the table of the wiki <a href="http://en.wikipedia.org/wiki/Vietnamese_alphabet#Tone_marks">http://en.wikipedia.org/wiki/Vietnamese_alphabet#Tone_marks</a>, which shows that searching Vietnamese in Nameslist.txt is not enough. I presume that with such a complete list, you make a .enc file for Fontlab so as to see all the glyphs you need in one shot (plus at least the variants you need for the composed diacritics). Just curious, I don't use Fontlab.</p>
      <p>If I do that with FontForge for Source Sans Pro, here is a possible view of the capitals (the script generating the encoding grouped the "base glyphs" together, "base glyph" being here the first character of the canonical decomposition.<br><img src="/sites/default/files/old-images/SSProWhite_5801.png"><br>
      (I never had so much trouble inserting an image...)</p>
      <p>When I use the same encoding with FontLab (with the glyph names taken from Source Sans Pro), some characters look missing and are not placed where expected (Abreve is placed somewhere else and the corresponding uni character looks missing for instance).</p>
