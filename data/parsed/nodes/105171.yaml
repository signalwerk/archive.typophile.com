    html: |-
      <p>I would suggest you create the combined accents as individual combining glyphs. You'll have to scale and redraw the different elements of say a circumflexacute that it will be easier to place and hint. I recommend building separate accent combos for the lowercase and uppercase (and small caps).</p>
      <p>Once all of the glyphs are built as components, just copy and paste from one font to the next.</p>
      <p>Also, this site should be on your short list:</p>
      <p><a href="http://www.unicode.org/charts/">http://www.unicode.org/charts/</a></p>
