      <p>I downloaded the small <a href="https://code.google.com/p/hunspell-spellcheck-vi/downloads/detail?name=vi_spellchecker_OOo3.oxt">Hunspell Vietnamese spellchecker</a> and looked at the characters used. Aside from the 1EA0 to 1EF9 range and the standard unaccented latin letters, it uses the following small letters</p>
      <p>00E0 00E1 00E2 00E3 00E8 00E9 00EA 00EC 00ED<br>
      00F2 00F3 00F4 00F5 00F9 00FA 00FD 0103 0111<br>
      0129 0169 01A1 01B0 </p>
      <p>The corresponding capitals should also be needed</p>
      <p>00C0 00C1 00C2 00C3 00C8 00C9 00CA 00CC 00CD<br>
      00D2 00D3 00D4 00D5 00D9 00DA 00DD 0102 0110<br>
      0128 0168 01A0 01AF </p>
      <p>That implies that the small letters that are in my list of the post <a href="http://typophile.com/node/105171#comment-562024">http://typophile.com/node/105171#comment-562024</a> (thus neither in Windows 1258 nor in the 1EA0-1EF9 range) figure all in that small dictionary of only 6631 entries.</p>
