      <p>FontLab is just a tool - the real "honing" happens in your head. And what you've described is already plenty to keep most anybody busy for a decade or more! :-)  But I'd say the next qualitatively difficult step is to move from a single weight to a <em>system</em>. The way weights and italics need to relate can get complex (and there's no consensus on how to do it).</p>
