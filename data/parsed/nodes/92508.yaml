  html: |-
    <p>Allow me to oversimplify. Basic type design is glyphs, designing the spaces they occupy, and the spaces of their combinations. In addition to honing those crafts digitally in FontLab, must I know anything else to release a professionally crafted, single-weight typeface? or can I go to File/Generate Font and move on? </p>
    <p>I'm trying to figure out what's next on my learning curve and it seems there are a ton of tools tackling problems that I don't even care to understand— and maybe I should care. Any guidance would be appreciated, thanks.</p>
