      <p>&gt;can I go to File/Generate Font and move on? </p>
      <p>You need to test (ie use) the fonts in the ways you expect your customers to use them, on different apps and platforms, and different output devices. If you skip this step you're doomed to provide ongoing ad-hoc support as customers will hit issues you should have identified in testing.</p>
