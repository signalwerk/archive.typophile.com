      <p><strong>Sergey:</strong><em> Frankly, I do not see a big problem with ‘z’, who would mix it in a formula anyway. And I do not see a problem with nu/v either. </em></p>
      <p>This is a really odd comment, as <em>xyz</em> are just about the most-used italic letters in mathematics. The <em>z</em> is used constantly in complex analysis and in any applied field dealing with 3D space. As for 'nu'/<em>v</em>, physics and engineering can often throw them together.</p>
      <p>As for the problems they cause, just this week I typed a document with a lot of <em>z</em>'s and didn't catch the missed italics until I printed it out, since I couldn't easily distinguish z and <em>z</em> on-screen. And I still remember some time ago reading a physics text, not typeset by the author, that used same-looking 'nu' and <em>v</em> in the same equation!</p>
      <p>Don't discount problems the <em>Q</em> either. It is used with great frequency in logic and geometry, often with subscripts.</p>
