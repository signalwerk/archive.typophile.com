      <p>@raph I would kill to see a page scan from the Euler book.</p>
      <p>@Wendell another reference point in math typesetting is Knuth's own <em>The Art of Computer Programming</em> that was first set in a version of "Modern" (ATF?)  Somewhere, Knuth tells us that the tribulations of typesetting early editions drove him to build what became TeX and METAFONT. As a result we have at least three iterations of the work to compare: The traditional version (which I think is beautiful); the first digital edition of some volumes which was built with a markedly more primitive, early version of the software and fonts; and the "modern" TeX and CMR that was introduced in the <em>TeXbook</em> and <em>METAFONTbook</em> (themselves showcases of math).</p>
      <p>This is of interest, in my opinion, because Knuth, as a working mathematician, values excellence in mathematical setting and makes high demands of it; and in developing his digital typography tools he paid close attention to its conventions and details. Optical scaling in CMR was one example, decades in advance of mainstream (PostScript) digital type...</p>
      <p>And wasn't his <em>Concrete Mathematics</em> set in a different math family entirely? AMSfonts? I forget. (It's 1am)</p>
