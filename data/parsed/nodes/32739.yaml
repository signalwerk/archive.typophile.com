      <p>sergeym: Thanks for responding. I do appreciate that you're trying to make math typesetting as good as possible, and that you're studying the TeX precedents.</p>
      <p>Regarding the parens in the binomial construct, I think this picture makes it clear. I used this TeX:</p>
      <p><code><br>
      (a+b)^n = \sum_{k=0}^n \binom n k a^k b^{n-k}<br></code></p>
      <p><img src="/sites/default/files/old-images/math_3984.png"></p>
      <p>I used Apple Preview to make the screencap. Results will vary with other viewers. Overall, the Cambria is bolder than the CMR, which fixes one of the biggest problems with the latter; TeX often looks spindly and insubstantial, especially on the screen.</p>
      <p>Obviously you are using variant forms of the parens, and they look good. But, to my eyes, the curly braces aren't anywhere nearly curly enough, and seem to be made largely from straight sections. This is an aesthetic choice, of course, and perhaps the mostly-straight approach is more consistent with the design of Cambria.</p>
      <p>I took another close look at the optical scaling of the superscripts in that example and, if there is optical scaling, it is too subtle for me to see by eye. In CMR, of course, the scaling is immediately clear to the eye, largely because of the width changes. If these are, in fact, separate super/sub-script glyphs as opposed to mathematically scaled instances of the primary size, then I think quite a bit more should have been done to make them harmonize better optically.</p>
      <p>Maxwell looks great, and if the math capabilities of the new Word open up a market for high quality math typefaces, that will be a service to the word. The subscripts there <em>are</em> optically scaled, and very nicely (compare the "a" under the summa to the one in the body). The greeks, especially, have a tremendous amount of life. And I'm sure Hrant will love the "g".</p>
      <p>Of the fonts shown by Küster, the Minion is to my eyes by far the best. I can see why he's choosing that as the basis for his work. In my thesis work, I'm spending a lot of time with a <a href="http://math.dartmouth.edu/~euler/pages/E065.html">book by Euler</a> from a quarter-millennium ago, and am very much enjoying the typography. It's set in the standard Garalde typical of the era, which looks fine to me. I think this whole thing about moderns is convention rather than serving a true functional purpose. I'm also a big fan of the historical math books I have set in Monotype Old Style No. 2, and, again, that's one of the reasons I chose (the similar) Century Catalogue for revival.</p>
