      <p>Raph wrote:<br><cite>But that’s not the only problem. The stretchable curly braces are very blah (see this paper for a more sophisticated approach). </cite></p>
      <p>Can you do that for every font and glyph? We are working in OpenType font environment, where even multiple masters fonts are not in the standard anymore. I am not even talking about METAFONT. </p>
      <p>Of course, if you can do arbitrary sizes for glyphs as good as pre-designed ones you can do better layout. You can do even better if you draw every parents for a given formula. Even if we are not completely flexible, we provide open format where, unlike in TeX, font designer can provide as many growing forms as he think are necessary for their design. Cambria Math has 8 forms for parents, for example.</p>
      <p><cite>The large parens on page 5 are not quite large enough. It’s not bad, but it’s not a huge improvement over TeX quality.</cite></p>
      <p>I thin this is a standard use of TeX's 95% rule (if I remember this number correctly) for choosing size for parents. This is just an accident with existing forms that they have parents that cover full size of first expression and cover only part of higher one. You cannot cover all possible formulas. You design you font to cover most commonly used.</p>
      <p><cite>  One of the major factors is the lack of optical scaling - I think a case can be made that a properly scaled family is far more important for math than in just about any other context, because of the use of different sizes in close proximity.</cite></p>
      <p>I am not sure what you mean, at least in relation to math typography. We offer mechanism for optical sizes for smaller sizes in math, e.g. in superscript, although they are all reside in a single font. There are pros of having single font, e.g. set of constants is not spread between typefaces or flexibility in having only some variants for particular size. But nothing in font format prevents other layout engines (or future versions of MS's engine) to use separate fonts for each of sizes.</p>
