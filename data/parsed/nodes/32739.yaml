      <p>On a general note, we are at first iteration of our math layout system. Of course, there are thing to improve, in both layout engine and Cambria Math font. We learned a lot about math and math fonts at the same time as we moved forward. We are creating platform that provide both good layout and will enable font designers to create great fonts. We see that TeX achieves too many things through hardcoded values and tweaks, frequently tied to Computer Modern family, which font designers and typesetters should take into account. Our (very ambitious) goal for first version was to have math layout quality to be same or better than TeX automatically, without user need for manual tweaking.</p>
      <p><cite> That didn’t last long. I am struck by the sloppiness of the design. For example, the lower-case roman alphabet looks like a mixture of two or three different typefaces. </cite></p>
      <p>I guess this is a matter of taste. Like with Murray, it took some time for me to get used to Cambria both as a body and math font. It is quite different from what I usually used before. Now, I like it and even use Cambria Bold with PDFs on my Sony reader. </p>
      <p><cite>First, unlike writing in a natural language, glyphs can be adjoined arbitrarily. </cite><br><cite> So the font must be designed such that no glyph intrudes into the columnar space of its neighbor or leaves gaping holes.A quick test is to diplay “QJqygf” in roman and italics. Also try the lower-case with sub/super-scripts.</cite></p>
      <p>Conditions for font design you set are very hard to meet at the same time, especially for slanted math font. You admit that even existing LaTeX fonts do not meet your requirements, after so many years passed.</p>
      <p>I agree spacing does not look very good, but this letter combination is not common. On the other hand, letters should not be set as tight as in normal text. They are separate entities in math, not single word. We do not do normal kerning in math and rely on font to have natural spacing to look better. There are other cases when we have to avoid clashes between glyphs, frequently from different fonts/sizes. This can’t be done by font itself, and we concentrated on these issues.</p>
      <p><cite>Second, again unlike natural language, one often cannot identify a glyph just from context. So every glyph must be immediately and uniquely recognizable. Common problems are with the roman-lc vs. italic-lc “z” and with the Greek-ltalic-lc “nu” vs. the italic-lc “v”.</cite></p>
      <p>Frankly, I do not see a big problem with 'z', who would mix it in a formula anyway. And I do not see a problem with nu/v either. We spent time ensuring there is no confusion between these particular pair of letters.</p>
      <p>Thanks,<br>
      Sergey</p>
