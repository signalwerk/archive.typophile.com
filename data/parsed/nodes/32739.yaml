      <p>The appropriate style for a maths type is an interesting topic, and because of the complexity of the design and production of maths fonts there will probably only ever be a small number of options. Ross started designing Maxwell while he was still working on the math table for the Cambria Math font, in part as a relief from the technical nitty-gritty of that work.</p>
      <p>I have my own ideas about possible designs for maths types. We've inherited a largely 19th century set of typographic conventions for maths and sciences, which have been extended in subsequent decades but not significantly altered. Yet there is a body of mathematical publishing that predates these conventions, and while some of the notation of that period is now obsolete, the style of types involved are a possible source for new directions in the design of digital maths types. In the days of metal type, there was a natural conservatism in the typesetting of mathematics, in which fonts of type might be extended by the cutting and casting of new symbols, but in which the idea of introducing whole new styles of maths types would be prohibitively expensive. I see no reason why we can't be a bit more adventurous in the design of new types for digital maths settings. Johannes Küster is basing his maths font on Adobe Minion, which may be the most refreshing thing anyone has ever done with Minion. :)</p>
