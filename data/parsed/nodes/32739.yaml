      <p>Raph, there are indeed two optical sizes for most common superscripted characters in Cambria Math. Jelle Bosma drew a set of superior glyphs as part of the initial Cambria development; I scaled these up to the size required for the math layout handler, and then interpolated another size, which Ross then adjusted (the final relationships are not linear, as you can see in the illustration below).</p>
      <p>I think this is one of the areas in which designing a font for intensive on screen use led to different decisions than would be the case if one were making a font for use predominantly in print. For a print typeface, I might be inclined to make a greater weight change in the optical sizes, but on the coarse pixel grid this can easily lead to the smaller sizes looking too dark relative to the base forms.</p>
      <p><img src="/sites/default/files/old-images/CambMathOpt_6527.gif"></p>
