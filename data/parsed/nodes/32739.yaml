      <p><strong>John:</strong><em> Ross started designing Maxwell while he was still working on the math table for the Cambria Math font.</em></p>
      <p>I took a look at <em>Maxwell</em> and it is quite attractive, but I wonder what your target market would be. Scientific publishing is extremely conservative. Times Roman has been almost the sole font of choice since the 1960's and with STIX coming out, that will probably continue indefinitely. I could imagine <em>Maxwell</em> being used in semi-literary writing, such as a <a href="http://www.amazon.com/Man-Who-Changed-Everything-Maxwell/dp/0470861711/ref=sr_1_1/104-3734276-9775113?ie=UTF8&amp;s=books&amp;qid=1175816776&amp;sr=1-1">biography of Maxwell</a>, but not a technical publication. Have you wandered over to a bunch of physicists and asked?</p>
      <p><em>I see no reason why we can’t be a bit more adventurous in the design of new types for digital maths settings.</em></p>
      <p>I've just finished re-reading Gill's <em>An Essay on Typography</em> in which he holds that the fewer faces on the page, the better. He certainly hasn't been the only designer to thing so. On the math side, notable authors like Paul Halmos have insisted that an essential part of good math writing is resisting the urge to overpopulate your notational menagerie.</p>
      <p>Over the past twenty years, some typographically-naive mathematicians have used the power of LaTeX to ignore this advice with wild abandon. Maybe things would get better if typographers used their artistic influence to try to rein them in, not encourage them. :-)</p>
