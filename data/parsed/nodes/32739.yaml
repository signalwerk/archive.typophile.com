      <p><cite>Murray Sargent makes a good point. If Cambria+Math is designed to look right only when used in Office 2007, users of other systems like OpenOffice, LaTeX, QuarkXpress, and 3B2 need to be aware of it. </cite></p>
      <p>Cambria Math is intended to look good in Windows environment and on paper. But this is said only about glyph design and hinting, so there is nothing specific to math layout. This is just particual glyph rendering technology, not math layout engine. You can look at Murray's paper, to see how formulas formatted by Word look in Acrobat Reader.</p>
      <p>Math layout tables format is open and other apps can work on support for it. Office2007 was just the first app implemented it. I hope you do not count this as a Microsoft fault. We made format open and generic enough to be used in different layout algorithms. XeTeX, as I understand, is looking into MATH table support in TeX. </p>
      <p>Thanks,<br>
      Sergey</p>
