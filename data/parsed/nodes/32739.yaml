      <p><em>Does Tiro have any current offerings for end user licensing?</em></p>
      <p>Currently we don't have any retail licensing, only some fonts that are freely available under license from our customers (e.g. the SBL scholarly fonts, the Inuktitut fonts for the government in Nunavut). Our old retail fonts were withdrawn from circulation a few years ago, partly out of our own dissatisfaction with them and partly because we did not have time to make OT versions and didn't want to offer ongoing support for Type 1.</p>
      <p>So for the time being we're just working on custom fonts, and this keeps us pretty busy.</p>
