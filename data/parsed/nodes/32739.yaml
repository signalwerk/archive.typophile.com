      <p><strong>Simon:</strong><em>I was interested in references to fonts that took this into account. To me I suspect you can’t do good math with a text font...</em></p>
      <p>I think you are absolutely right. The requirements for a math and a text font are diametrically opposed; text letters need to blend and equation letters need to stand distinctly.</p>
      <p>Nevertheless, the lack of dedicated math fonts forces us to make do. So what do we have to take into consideration to make the best compromise? Thinking just about italic lower-case:</p>
      <li>Every italic letter must be clearly identifiable as such.</li>
      <li>No letter should cross into its neighbor's space.</li>
      <li>To distinguish from 'nu', <em>v</em> must be rounded and <em>w</em> must match <em>v</em>.
      </li><li>To avoid mistaken identity, <em>v</em> can't look like 'nu' normally does. It also must be distinct from roman-bold-lc <strong>v</strong>.
      </li><li>The tail of <em>g</em> should be open and <em>y</em> should match.</li>
      <li>Since it is often used as small super/subscript, <em>k</em> should be open.</li>
      <li>To leave room for super/subscripts on both sides, flourishes should be kept minimal.</li>
      <p>To illustrate how hard it is to meet all these conditions, here is a sample of some common fonts.</p>
      <p><img src="/sites/default/files/old-images/latins_4514.jpg"></p>
