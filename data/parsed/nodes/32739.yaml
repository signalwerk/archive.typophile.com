      <p>Mmm. I'm glad to see that the Century family makes Wendell's list of faces meeting the criteria for good math work. That's basically why I picked Century Catalogue to work on.</p>
      <p>I happen to be very interested in math faces, but it's not clear that my work situation is going to allow me much, if any, time to actively develop them. We'll know in a couple of months.</p>
      <p>In any case, I also found the "linear" paper to be somewhat disappointing. One of the major factors is the lack of optical scaling - I think a case can be made that a properly scaled family is far more important for math than in just about any other context, because of the use of different sizes in close proximity.</p>
      <p>But that's not the only problem. The stretchable curly braces are very blah (see <a href="http://tex.loria.fr/typographie/inria-1972.ps.gz">this paper</a> for a more sophisticated approach). The large parens on page 5 are not quite large enough. It's not <em>bad,</em> but it's not a huge improvement over TeX quality.</p>
