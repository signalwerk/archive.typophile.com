      <p><strong>Raph:</strong><em> I’m also a big fan of the historical math books I have set in Monotype Old Style No. 2, and, again, that’s one of the reasons I chose (the similar) Century Catalogue for revival.</em></p>
      <p>I, also, search out older math books for their typography. Tracy, in his <em>Letters of Credit: A View of Type Design</em> recommends keeping examples of books published from 1930 to 1960 because that was the high-point of typographic quality, the furthest advance of technical ability before the decline caused by automation.</p>
      <p>For math books, I would modify the recommendation to the frame of about 1920-1939. In the 20s and 30s, it is clear that the production of a math book was considered Art. But with WWII, economy became the prime consideration. Even after things got better in the 1950s, while math books show much more skill than they would in the 1970s, it is clear that often the primary objective was to get as much as possible on a page.</p>
      <p>For insight into attitudes of the day, take a look at Chaundy's <em>The Printing of Mathematics</em>. This was the styleguide for Oxford University Press, which along with Cambridge produced some of the best printing. What is interesting is the constant attention they give to economy of work and space, things that don't seem to have been as important in prewar days.</p>
      <p>Following the output from 1920 to 1939, there is a significant improvement in technical ability. So if you are hunting for good exemplars, I would advise concentrating on the 1930s. I rarely find anything from before 1910 that impresses me. If you have suggestions I'd like to hear them.</p>
