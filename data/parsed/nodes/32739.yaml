      <p>John: Thanks, that link is great. Johannes Küster identifies a lot of points that need consideration.</p>
      <p>Simon: On the chance that you were not just being peevish, what sort of references would you find helpful to support my assertion that poorly spaced and/or indistinguishable glyphs cause aggravation?</p>
      <p>Murray Sargent makes a good point. If Cambria+Math is designed to look right only when used in Office 2007, users of other systems like OpenOffice, LaTeX, QuarkXpress, and 3B2 need to be aware of it.</p>
      <p>There is another issue with math that doesn't get much if any discussion, and that is what font to use for the text body. If you look at handbooks on typesetting math, it appears that the issue of body text is too trivial a problem to require mention. But consider this, the typical reading rate for professional-level math is about one or two hours per page. Reading twenty pages at a sitting would be unusual. Most likely would be less than six. Surely this case requires some special attention to typeface choice.</p>
      <p>When reading, the mathematician goes back and forth between printed page and scratchpad. The type should aid quickly finding one's place again but not become tedious with prolonged staring and rereading.</p>
      <p>My impression has been that a large x-height is bad for math text, as it is meant to cause the eye to slide quickly down a line of text and gives too little distinction to individual words. The opposite, like Perpetua, is not comfortable in prolonged staring. Striking forms, as when the type designer decides to personalize the "W" or "Q" become very irritating.</p>
      <p>Another major consideration is the use of italics. It is the standard practice in math to set the most important paragraphs, the "Theorems", in all italics. So you need an italic face that is not only good for setting whole paragraphs, but will support even more intensive scrutiny than the roman. I think very few faces have such a suitable italic.</p>
