      <p>&gt; We see that TeX achieves too many things through hardcoded values and tweaks, frequently tied to Computer Modern family, which font designers and typesetters should take into account</p>
      <p>I agree that TeX is a bear, but you really don't need to depend on the CM font family. The Lucida math set mirrors the characters from CM, with the benefits of the more professional design. As for non-Math fonts, they are easy to load into TeX, if you have the afm files to provide the metrics.</p>
      <p>I think the reason most TeX setting looks like TeX setting is that the schools and scholars that use it won't pay for decent fonts. That doesn't seem to be a problem for you. (Of course, that doesn't eliminate the problem of TeX requiring so much hand holding.)</p>
