      <p>I agree with Sergey that upright z and italic z are never a problem, because they are never used together (unlike italic z and upright bold z, which do appear together).  Similarly, a rounded v is a good solution to the conflict with nu, even though a rounded v is almost indistinguishable from an upsilon.  However, no one uses v and upsilon together, whereas v and nu frequently appear together.  Just as with text, the design for distinguishability should follow from the usage.</p>
      <p>Wendell: <cite>The tail of g should be open and y should match.</cite></p>
      <p>I have frequently seen this said, but I've never heard a justification for it.  It seems the y in Cambria Math works quite well.</p>
      <p>Wendell: <cite>Over the past twenty years, some typographically-naive mathematicians have used the power of LaTeX to ignore this advice with wild abandon.</cite></p>
