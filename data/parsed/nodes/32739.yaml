      <p>Some comments from Murray Sargent...</p>
      <p>From: Murray Sargent<br>
      Sent: Sunday, April 01, 2007 3:33 PM<br>
      To: Simon Daniels<br>
      Cc: Geraldine Wade<br>
      Subject: RE: Criticism of Cambria Math</p>
      <p>A math display program uses different italic characters (the math alphabetic in the range U+1D400..U+1D7FF) from the ones Wendell refers to and the Cambria-Math math italic lc “nu” is quite distinct from the math italic lc v. Furthermore, math spacing in Word 2007 is controlled according to glyph ink, italic correction, and cut-ins, so overlaps don’t occur and a significant amount of spacing tweaks that TeX delegates to the user are performed automatically. More about math spacing is given in my <a href="http://blogs.msdn.com/murrays/archive/2006/09/13/752206.aspx">post</a>. The only possibly valid criticism given in Wendell’s comment on Cambria Math is about the look of the typeface. This look was chosen to allow significantly better on-screen display than other typefaces such as Times Roman. Initially I didn’t like the typeface as much as Times Roman, but I like it now and the font is pure magic when it comes to math typesetting thanks to its myriad glyph variants. To see Cambria Math in action, check out the <a href="http://www.unicode.org/notes/tn28/UTN28-PlainTextMath-v2.pdf">math linear format paper</a>.</p>
      <p>Thanks<br>
      Murray</p>
