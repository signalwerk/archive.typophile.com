      <p>Patty,  I'm curious about your Macy's font question, because the only script use I've seen is simply the 'way to shop' phrase. Have you seen this script used with more variety of words and letters? (I couldn't find anything else on the web page link you gave).</p>
      <p>As for your question about how OpenType handles contextual substitutions, the answer seems to be in certain tables that are part of the font files. (This conclusion was inferred from some Google searches using words like 'OpenType, glyphs, contextual and tables). Here is a <a href="http://www.microsoft.com/typography/otspec/otff.htm" target="new" rel="nofollow">Microsoft tutorial on the subject of OpenType files</a> that is probably way more than you wanted, but it talks about the various tables that are used, including ones controlling glyph substitution. These are what the designers must 'program' in order to define when certain glyphs are used. See <a href="http://www.talleming.com/pages/work/programming/openType/edInterlock/" target="new" rel="nofollow">this article about the programming of the 1400 glyphs in House's Ed Interlock</a> as an example of what must be done as part of the design of a complex OpenType font</p>
      <p>- Mike Yanega</p>
