      <p>It is used like crazy in their print ads, which were totally unavoidable last month in the Times. Some of the characters match up, some don't, there are individualized ligatures and stuff. It may have been customized from someone's handwriting but since it was used for so many different words/phrases it must have been made into a font. </p>
      <p>That Microsoft article is greek to me, but I had read about Ed Interlock before, and seen enough about Open Type to think this might be how they got that script to work.</p>
      <p>Re Amy's comment, yes, I've noticed the same thing a lot lately, in Chase banks for example. It's the font equivalent of that soothing voice in the customer service phone trees: Your call is important to us...</p>
