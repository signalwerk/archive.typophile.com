      <p>I searched through the 24 pages of <a href="http://bowfinprintworks.com/Script11Pg1.html" target="new" rel="nofollow">Script Font ID Guide, Part 11 (Everyday handprinted scripts)</a> and could not find an exact match. Two fonts: Irv (pg 4) and Dlnfont (pg 10) were fairly similar, but that was the best I could find.</p>
      <p>This topic is in our FAQ, I think, and basically it says that these kinds of fonts are too easy and cheap to make, so that examples you see (especially for commercial uses) are very likely custom fonts. Your best bet is to find one with a similar feel, and use that, because you may never find the exact font you saw.</p>
      <p>- Mike Yanega</p>
