    html: |-
      <p>Some of Manfred Klein’s Blackletter fonts for FontFont have loops on the ascenders, but that is an unusual feature. I think your sample looks hand-lettered, however. Manfred has generously made most of his fonts available for free at <a href="http://www.moorstation.org/typoasis/designers/klein/index.htm">TypOasis</a>, and he has helped with some of the <a>Blackletter revival</a> fonts on that site too, but I don’t think this is among them.</p>
      <p>- Mike Yanega</p>
