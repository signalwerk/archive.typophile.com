    html: |-
      <blockquote><p>Linotype, I know, was using it by 1978 or 1980. I saw it used there in their letter drawing office, and they got me to use it in the planning of my TF Bryn Mawr series.<br>
      I never asked them, but might Linotype have started using it via Mr. Frutiger or Mr. Zapf?</p></blockquote>
      <p>If so, Linotype must have had it through Stempel (Frankfurt, Germany) because they did the drawings for most of the Linotype faces in Europe, including those by Zapf and Frutiger.</p>
      <p>In Germany, the use of the word Hamburg for comparative use is at least as old as Wetzig’s „Handbuch der Schriftarten“ Albrecht Seemann Verlag, Leipzig, 1926.<br>
      <a href="https://www.flickr.com/photos/nicksherman/13958527292/" title="https://www.flickr.com/photos/nicksherman/13958527292/">https://www.flickr.com/photos/nicksherman/13958527292/</a></p>
