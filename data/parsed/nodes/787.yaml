    html: <p>(re "Madam, I'm Adam.") <br> <br>What a great book, by the way. Hilarious. <br> <br> <br>(re Hamburgefonts, etc.) <br> <br> <br>Linotype, I know, was using it by 1978 or 1980. I saw it used there in their letter drawing office, and they got me to use it in the planning of my TF Bryn Mawr series. <br> <br>I never asked them, but might Linotype have started using it via Mr. Frutiger or Mr. Zapf? <br> <br>Ruari McLean's excellent 1980 'The Thames and Hudson Manual of Typography' shows just the phrase 'Hamburg' being used in some Monotype Plantin showings on p. 78. <br> <br>That might have helped spur its popular use along. <br> <br>The idea with 'Hamburgefonts' and 'HAMBURGEFONTS' (as I first saw it used at Linotype and about the same time, printed in the pages of ITC's wonderful old 'U&amp;lc' printed publication), and later 'Hamburgefonstiv' and 'HAMBURGEFONSTIV' (as it was later first expanded on in print, elsewhere) was that if you started defining a new typeface concept with those letters, that by the time you were through, you'd have all tested all the shapes and intercharacter relationships (providing sidebearings) for what you'd need to define pretty much throughout the rest of the font. <br> <br>ITC started showing it in their publication 'U&amp;lc' in ads announcing to budding designers how to submit new typeface ideas to them. Basically, they (as I recall) just wanted to first see 'Hamburgefonts' and 'HAMBURGEFONTS'. <br> <br>I agree that it likely came from Linotype or perhaps the old URW (while they were digitizing ITC typefaces on contract). Linotype was using URW's (Dr. Karow's) IKARUS minicomputer-based (not desktop yet) digitizing system then.  <br> <br>Or, perhaps from the old iteration of H. Berthold AG (based in Berlin).  <br> <br>H. Berthold AG's positively exquisite 'E2, Berthold Fototypes, Body Types, Volume 1' (February 1980), on p. LXVIII, uses 'Hamburgefons'. (Actually the whole line was displayed as 'H  Hxkp</p>
