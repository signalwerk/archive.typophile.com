    html: "<p>&gt; Posted by Jay Fraser on Friday, August 01, 2003 - 8:26 am: &gt; &gt; Where did it come from? What does it mean? Is there something better? &gt; &gt; I tried googling the sucker, w/ no joy. A search here in Typophile &gt; produced nothing. But even FontLab has it as a default selection... &gt; &gt; I ask because I was planning on using it in a demonstration, &amp; I'm &gt; sure the question will come up. &gt; &gt; Thx. <br> <br>If you're asking where the word Hamburgevons came from, it's not a real word. Historically, those letterforms exhibit the principle characteristics of a given typeface. So it's a quick way to get an idea of what the entire font looks like. Sometimes seen as Hamburgefons, you can also set a pailndrome sentence, such as \"Frowzy things plumb vex'd Jack Quadrat!\". <br> <br>Tony</p>"
    html_clean: "<p>&gt; Posted by Jay Fraser on Friday, August 01, 2003 - 8:26 am: &gt; &gt; Where did it come from? What does it mean? Is there something better? &gt; &gt; I tried googling the sucker, w/ no joy. A search here in Typophile &gt; produced nothing. But even FontLab has it as a default selection... &gt; &gt; I ask because I was planning on using it in a demonstration, &amp; I'm &gt; sure the question will come up. &gt; &gt; Thx. <br> <br>If you're asking where the word Hamburgevons came from, it's not a real word. Historically, those letterforms exhibit the principle characteristics of a given typeface. So it's a quick way to get an idea of what the entire font looks like. Sometimes seen as Hamburgefons, you can also set a pailndrome sentence, such as \"Frowzy things plumb vex'd Jack Quadrat!\". <br> <br>Tony</p>"
