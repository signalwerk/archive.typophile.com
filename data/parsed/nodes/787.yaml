    html: "<p>Actually, I started with \"Hamburgevons\", but then switched to \"Hamburgefonts\" because I'm not particularly fond of the \"v\". I like the concept of \"...one word that displays all the major strokes in a typeface,\" but who invented it?  <br> <br>I know what's going to happen: I'm going to be standing up in front of a bunch of suits and someone will say: \"what's a 'Hamburgefont'?\" I'd like to have something better (more snazzy) to say than \"just a nonsense word.\" <br> <br>Thanks! <br></p>"
