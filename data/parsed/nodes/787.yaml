    html: "<p>Tony--A nitpick here: A palindrome is something that reads the same backwards as forward (e.g., \"Madam, I'm Adam.\"). What you have there is a <i>pangram,</i> a sentence (usually) which contains all the letters of the alphabet.</p>"
    html_clean: "<p>Tony--A nitpick here: A palindrome is something that reads the same backwards as forward (e.g., \"Madam, I'm Adam.\"). What you have there is a <i>pangram,</i> a sentence (usually) which contains all the letters of the alphabet.</p>"
