      <p>I have a couple of the old Agfa versions stashed away somewhere, and I think I showed it to a few students as an "antique."</p>
      <p>&gt; <em>Also, I recall that the old compuGraphic company (later Agfa, and now AgfaMonotype) used to similarly tell submitting designers to use another keyword. I believe theirs was instead 'Champion' and 'CHAMPION'.<br>
      </em></p>
      <p>This (was) is very true, Joe.<br>
      When I first landed at CG, I did see "CHAMPIONED - championed" and "CHAMPIONS - champions" as variations as well.</p>
      <p>Since ITC started sending all of their source specimens (film font days) and used "Hamburgerfons" the Type Dept. at CG started using it more for comparitive purposes.</p>
