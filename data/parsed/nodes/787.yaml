    html: "<p>If you want to try your hand at writing pangrams, try this: <a href=\"http://www.ms-studio.com/Animation/pangrammerhelper.html\">Pangrammer Helper</a>. It's a little Flash application I designed partly to promote an upcoming font release. It's not officially on my site yet and isn't quite finished, but it works as is and is fun to play with.  <br> <br>If you use Safari, the cut-'n'-paste feature does not work from the edit menu or with the keyboard short cuts. You must control-click over the editing field and use the contextual pop-up menu. This appears to be a bug in Safari related to Flash content. <br> <br>Also, the server my site resides on seems a little flaky this morning. If you have trouble getting to it, wait a few minutes and try again. I'm looking into it.</p>"
