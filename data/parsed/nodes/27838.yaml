      <p>Depends on your intended use. For a more rustic look, I would definitely go for Tiro's; for clean-cut, Adobe Garamond Pro Titling.</p>
      <p>Monotype Garamond is not of his design but of Granjon's. It works superbly in larger sizes, though; in fact, its one of those faces that can sparkle in both texts and titles.</p>
      <p>But I agree, its italic is yummy.</p>
