    html: <p>Stefan Hattenbach has produced some very nice PDF specimens for many of his faces found at his <a href="http://www.macrhino.com/">Mac Rhino Foundry</a> site. Because of the Flash-based site, you have to dig around the navigation a bit to locate and download them. <br> <br>The PDFs produced by <a href="http://www.underware.nl/site2/index.php3?id1=fonts">Underware</a> are always a treat - but the recent <a href="http://www.underware.nl/download/auto/pdf/stick-out-your-thumb.pdf">Stick Out Your Thumb</a> piece for their Auto family is absolutely priceless.</p>
