    html: "<p>What does one put in a spec book? <br> <br>At the one extreme, it's more specification than specimen, and that's the strtategy I followed here, 26 pages showing permutations of tracking at different sizes for all the Bodoni Egyptian family members, text  block settings with different leading at a range of sizes, as well as full character complements of each font. (My inspiration was the old Alphatype CRT system spec sheets, c.1980, which I found to be most useful back in tha day.) But it's so much work, I've only ever finished this kind of specimen for one of my faces: <br><a href=\"http://www.shinntype.com/Assets/Bodoni_GIFS/Bod.pdf\" target=\"_blank\">http://www.shinntype.com/Assets/Bodoni_GIFS/Bod.pdf</a> <br> <br>Erik van Blokland automated the whole procedure, of course, when he was producing the type sample part of Druk magazine (in print only, sorry Noah). <br> <br>For my full collection specimen, I attempted to combine everything on one page for each typeface: <br> <br><a href=\"http://www.shinntype.com/Assets/ShinnType.pdf\" target=\"_blank\">http://www.shinntype.com/Assets/ShinnType.pdf</a> <br> <br>*** <br> <br>Absolutely awesome: <br> <br><a href=\"http://www.pismolijna.cz/pdf/StormTypeLibrary.pdf\" target=\"_blank\">http://www.pismolijna.cz/pdf/StormTypeLibrary.pdf</a> <br> <br>(but not much color...)</p>"
    html_clean: "<p>What does one put in a spec book? <br> <br>At the one extreme, it's more specification than specimen, and that's the strtategy I followed here, 26 pages showing permutations of tracking at different sizes for all the Bodoni Egyptian family members, text  block settings with different leading at a range of sizes, as well as full character complements of each font. (My inspiration was the old Alphatype CRT system spec sheets, c.1980, which I found to be most useful back in tha day.) But it's so much work, I've only ever finished this kind of specimen for one of my faces: <br><a href=\"http://www.shinntype.com/Assets/Bodoni_GIFS/Bod.pdf\" target=\"_blank\" class=\"link-external\">http://www.shinntype.com/Assets/Bodoni_GIFS/Bod.pdf</a> <br> <br>Erik van Blokland automated the whole procedure, of course, when he was producing the type sample part of Druk magazine (in print only, sorry Noah). <br> <br>For my full collection specimen, I attempted to combine everything on one page for each typeface: <br> <br><a href=\"http://www.shinntype.com/Assets/ShinnType.pdf\" target=\"_blank\" class=\"link-external\">http://www.shinntype.com/Assets/ShinnType.pdf</a> <br> <br>*** <br> <br>Absolutely awesome: <br> <br><a href=\"http://www.pismolijna.cz/pdf/StormTypeLibrary.pdf\" target=\"_blank\" class=\"link-external\">http://www.pismolijna.cz/pdf/StormTypeLibrary.pdf</a> <br> <br>(but not much color...)</p>"
