    html: "<p>Thanks much for that information Mark. What a very strange combination of styles. <br> <br>Lookie what I just came across: SoftUnion's <a href=\"http://www.paratype.com/pstore/fonts/Troover.htm\" target=\"_blank\"> Troover</a>. Tucked away in the extended characters lie my calligraphic g and y, albeit at a lesser weight. I assume that the rotation of the o, O, q and Q was, indeed, a Fontbank gimmick. <br> <br>Also, a listing at <a href=\"http://www.atomictype.co.uk/castle_page.html\" target=\"_blank\"> AtomicType</a> pointed me to <a href=\"http://www.castletype.com/\" target=\"_blank\"> Castle Type</a>, where Trooper Roman Bold at first seems to not be present. It is, it turns out, listed in the <a href=\"http://www.castletype.com/catalog/CastleType_catalog.pdf\" target=\"_blank\"> PDF catalog</a> as Trooper Roman and at pretty much the same weight as the SSi font. I wonder if Jason Castle made that early enough to have been ripped off by Fontbank ... I think I'll write and ask him. <br> <br>Thanks again. <br><br></p>"
