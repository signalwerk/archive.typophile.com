  html: "<p>I'm doing a project filling in the blanks in identifying the original typefaces for SSi's clones. <br> <br>There is an SSi font for which I've located a match in Fontbank's Talon Bold. I'm finding, however, that almost all of the Fontbank fonts are modified (butchered would, in many cases, be the proper term) commercial fonts. Finding the original tyepface, when not <a href=\"http://jeff.cs.mcgill.ca/~luc/pro1555.txt\" target=\"_blank\"> already known</a>, has not, in most cases, been too difficult. <br> <br>The image below is of the SSi version of this font: <br> <br><img src=\"http://www.typophile.com/forums/messages/83/36248.gif\" alt=\"\"> <br>I've found a typeface in the Solotype Catalog that might be the original, but the character sampling is brief. I cannot find a digital version by its original name. It's called Trooper Roman Bold Extended. From the small sample provided, the A, B, E, e, i, l, n, s, t and w are exact matches or extremely close. The R's right leg extends further to the right. Actually, the s and the fact that the Broadway-like w are present is what grabbed my attention. <br> <br>So ... do any of you (Mark, Mike Y)have a better sample image of the Trooper family in your old catalogs? If so, might it be a predecessor? Keep in mind that some glyphs will surely vary </p>"
  html_clean: "<p>I'm doing a project filling in the blanks in identifying the original typefaces for SSi's clones. <br> <br>There is an SSi font for which I've located a match in Fontbank's Talon Bold. I'm finding, however, that almost all of the Fontbank fonts are modified (butchered would, in many cases, be the proper term) commercial fonts. Finding the original tyepface, when not <a href=\"http://jeff.cs.mcgill.ca/~luc/pro1555.txt\" target=\"_blank\" class=\"link-external\"> already known</a>, has not, in most cases, been too difficult. <br> <br>The image below is of the SSi version of this font: <br> <br><img src=\"http://www.typophile.com/forums/messages/83/36248.gif\" alt=\"\"> <br>I've found a typeface in the Solotype Catalog that might be the original, but the character sampling is brief. I cannot find a digital version by its original name. It's called Trooper Roman Bold Extended. From the small sample provided, the A, B, E, e, i, l, n, s, t and w are exact matches or extremely close. The R's right leg extends further to the right. Actually, the s and the fact that the Broadway-like w are present is what grabbed my attention. <br> <br>So ... do any of you (Mark, Mike Y)have a better sample image of the Trooper family in your old catalogs? If so, might it be a predecessor? Keep in mind that some glyphs will surely vary </p>"
