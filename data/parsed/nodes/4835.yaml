    html: <p>It's some version of Trooper, though not one of the originals. I believe there were only two weights, light and roman with italics. This is a bolder weight than either. There is a Trooper Roman Black in the Phil's Photo catalog, but there are differences in the characters. Trooper was very popular for a little while, so much so that some other film font outfits released there own versions with extra weights and styles. This doesn't quite match any that I've found. The hairlines are a bit too thin, for one thing. But, it's not far off either. The original (and the knock-offs) had several alternate characters. Most of the characters in your sample are the normal ones, some are alternates (o, O, and Q). <br> <br>Also, Dave Trooper was the designer. The font was originated by VGC.</p>
