      <p>Linotype’s EULA states: </p>
      <p>1.5:<br>
      “Embedding of the Font Software into electronic documents or Internet pages is only permitted under the absolute assurance that the recipient cannot use the Font Software to edit or create a new document (read-only). It must be ensured that the Font Software cannot be fully or partially extracted from said documents.”</p>
      <p>and 1.6:<br>
      “The licensee may electronically distribute Font Software embedded in a document <em>for Personal or Internal Business Use</em> only when the Font Software embedded in such document is in a static graphic image (for example, a “gif”) or an embedded electronic document, and is distributed in a secure format that permits only the viewing and printing (and not the editing, altering, enhancing, or modifying) of such static graphic image or embedded document.<br>
      The licensee may not embed Font Software in a Commercial Product without a separate written license from Linotype GmbH, and the licensee may not embed Font Software in an electronic document or data file for any reason other than his own Personal or Internal Business Use.”</p>
      <p>I don’t get the italics.</p>
