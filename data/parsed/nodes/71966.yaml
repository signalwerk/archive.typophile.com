    <p>Hey guys,</p>
    <p>I've just been scanning through the licenses for several fonts I own, specifically the Helvetica Neue &amp; Trade Gothic families. Admittedly, I get easily confused by reading legal-speak, but it almost sounds as though the license doesn't allow me to use the font commercially - i.e. in design work that I am paid for... <em>surely</em> this isn't the case...</p>
    <p>This bit in particular is confusing:</p>
    <p><em><strong>"Personal or Internal Business Use"</strong> shall mean Use of the Font Software for your customary personal or internal business purposes and shall not mean any distribution whatsoever of the Font Software or any component or Derivative Work thereof... </em></p>
    <p><em>...You are hereby granted a non-exclusive, non-assignable, non-transferable (except as expressly permitted herein) license to access the Font Software (i) only in a Licensed Unit, (ii) <strong>only for your Personal or Internal Business Use</strong>, and...</em></p>
    <p>Any ideas what this actually means in the real world? I <em>can</em> still use these fonts for paid design work, right?</p>
    <p>Thanks so much,<br>
    Dee</p>
