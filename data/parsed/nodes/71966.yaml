    html: |-
      <p>You do not own the fonts. You own a license to use the "Font Software" for Personal and Internal Business Use</p>
      <p>The EULA is referring to the "Font Software". So if use the "Font Software" to create documents or designs where the "Font Software" stays under the internal control of the number of workstations it was licensed for, you have no problem using the "Font Software" for paid design work. If you use the "Font Software" in a product, such as an e-book or in some other situation where the embedding of the "Font Software" becomes part of a "Commercial Product", then you have a problem.</p>
