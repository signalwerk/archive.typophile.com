      <p>Nick, like I said, I don't think the problem is anyone here being PC. To me it's more a question of what level one chooses to communicate on. This is heavy-handedly overt in a way we already see more than enough of every day, and that I think fails to connect to the kind of sexiness and magic that working in-depth with type has. Yes, of course there are voluptuous curves in type. But it's deeper than that.<br>
      There's so much culture, so much depth in type; precision and sophistication and sensitivity. So much in type is about perception and about insinuation; so much of it is about the <em>un</em>spoken, the <em>in</em>visible. THAT to me is where type and eroticism connect.* And sorry, but this brochure has the precision, sophistication, sensitivity, and, yes, sexiness of a sledge hammer.<br>
      It's not about being prude; it's about missing the magic. That of type and that of sex. Maybe that's just me, and maybe I am really just not the target audience.</p>
      <p>(* I'm wondering if that might be a male/female rift right there?)</p>
