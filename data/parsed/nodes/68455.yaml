  html: |-
    <p>In a bid to attract new members The Type Directors Club in New York have produced a Veer sponsored booklet entitled "How to Make Love to Your Type." </p>
    <p>Design is by Brazilian master designer Roberto De Vicq De Cumptich. It's a bit of fun, but is all a bit rude from the 'female' front cover - (not quite a Brazilian, ;^), to the male back cover, so if you're a bit prudish or easily shocked don't open the pdf.</p>
    <p>I'm very proud that Roberto chose Houschka Pro as the text face using style set 2, and I must admit it looks pretty damn sexy!</p>
    <p>Enjoy!</p>
