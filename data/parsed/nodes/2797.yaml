    html: "<p> Actually I'm using PAINT SHOP PRO, but I generally say I'm using Photoshop because it works very similar.  I just got Photoshop a few weeks ago (version 6, not the latest), so maybe I'm missing this Unicode font ability, but I can't even see the font title in the list of available fonts.   <br> <br>  As far as viewing the characters, I can't see any of the Chinese fonts I installed with ANY application- not my font viewer applications, not Word, PSP, nothing.  I DO have Photoshop installed for some special functions, but even with that app when I try browsing fonts I can't see the font names of the new ones I have installed, because Windows doesn't know what to make of the non-english font characters.  So far the suggestions I've gotten are: <br> <br>  ~Do a \"Windows Update\" and download Japanese and Chinese language packs <br> <br>  ~Change my Region settings to Chinese. <br> <br>  I'm nervous about both these solutions however, as I don't want to inadvertantly change my core display properties to Chinese, thereby making my PC unusable.  Am I making any sense here? </p>"
