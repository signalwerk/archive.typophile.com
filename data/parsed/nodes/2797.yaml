    html: "<p> Spine titles: <br>It's actually a difference between European and American practice. <br> <br>BTW, Chinese is written in both vertical and horizontal, although the latter is more prominent now. I don't think Japanese is written vertically, at least not in the mainstream. Another interesting vertical language in Mongolian, which used to be written in Cyrillic, but recently switched back to their original script, which looks somewhat similar to Arabic, interestingly enough. <br> <br>hhp </p>"
