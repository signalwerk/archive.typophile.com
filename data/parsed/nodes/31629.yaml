    <p>Hello Typophiles,</p>
    <p>This is a display typeface I did while attending the Icograda International Design Workshop for Students held at IDC, Mumbai. The workshop theme was "Design Local". It was not complete but now I really want to move further on this. Your feedback would be really helpful.</p>
    <p>Inspiration: A Window from the ticket counter at Mumbai Railway Station.<br>
    \<br><img src="/sites/default/files/old-images/Inspiration_4952.jpg"><br>
    \<br><img src="/sites/default/files/old-images/Untitled-1 copy_5877.jpg"></p>
