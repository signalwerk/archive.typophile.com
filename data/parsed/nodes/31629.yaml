    html: |-
      <p>I like this very much.  Some things I would change:</p>
      <p>The E looks too much like Greek capital Sigma (Σ).  I would try matching the middle horizontals in the E and F with the horizontal in the H instead.  Similarly, I would make the left-hand vertical of the K match the left-hand vertical of the H.</p>
      <p>I also think the bottom of the U is very unsettling.  Why can't it look like the bottom of the O? </p>
      <p>-m</p>
