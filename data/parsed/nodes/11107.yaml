  html: <p>Double Drat! <br> <br>An uncomplete set of letters that I created. The inspiration is turn-of-the-century (mostly from France) posters, specifically those of Charles Loupot. Realizing the recent release of Mostra, I wanted to at least get these noticed and seen. They were created several months ago and owe nothing to Mostra, but everything to Loupot. (That is not to say that I do not appreciate Mostra.) One thing I do like about these letters is their imperfection. Feeling more hand-drawn as opposed to done on the computer using a grid and strict guidelines.  <br> <br><img src="http://www.typophile.com/forums/messages/29/981.gif" alt="loupot.gif"> <br><img src="http://www.typophile.com/forums/messages/29/982.gif" alt="alter01.gif">  <br><img src="http://www.typophile.com/forums/messages/29/983.gif" alt="alter02.gif">  <br><img src="http://www.typophile.com/forums/messages/29/984.gif" alt="alter03.gif"></p>
