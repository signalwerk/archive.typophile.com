    html: |-
      <p>In the situation where you are printing a logo onto a coloured background the logo will knockout the background colour, in order to avoid a white line showing when the plates are out of alignment, it is normal practise to add a hairline stroke to the outside of the logo with the overprint box checked. Because the stroke will scale up and eventually become noticeable a large, medium and small logo are normally required, added to this the kerning (think about closing up any graphic elements too) would usually be tighter for an exhibition graphic than a business card.<br>
      As for sizes I would supply them so that for a simple logo the smallest it should ever be used is, for example, 20mm I would create the logo in Illustrator at 25mm with a 0.2pt overprinting stroke for use in most stationery applications, a medium one of say 80mm with a 0.2pt overprinting stroke and a large one of say 150mm, these sizes are merely guesses and depend on the ultimate usage and printing processes. Other things to bear in mind might be to provide a monocolour logo for use with spot UV, foil blocking or embossing and one for reversing out based on your three previous sizes although without the overprint. You may also provide an instruction to the user that the small one may not be used less than 100% or larger than 200%, when the medium one takes over at 50%.<br>
      Apart from web use always use a vector based file as the overprint cannot be transferred to a photoshop file.<br>
      Web use might need a slightly more open version and a larger minimum size.<br>
      As for checking them the only real way is to print it using the process the logo is designed for, get a friendly printer to tag it onto the side of a live job.<br>
      Tim</p>
