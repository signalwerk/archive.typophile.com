    <p>Hi,</p>
    <p>I'm after some straight forward advice on what I need to look out for when producing finished art for a logo.</p>
    <p>I know that a logo will usually be supplied in various colour spaces (say Spot PMS and 4-colour process).  Logo's are usually supplied at different sizes like tiny, regular, and super large.  I'm guessing this is because special attention needs to be given to whitespace and kerning, particularly at smaller sizes.</p>
    <p>Is that it though, or are there other things I should be looking for?<br>
    I imagine that these different sizings are best tested on a laser printer and not just on screen?<br>
    Is there any standard dimensions or ball-park figures that designers will typically use for the different sizings?</p>
    <p>Thanks,<br>
    Jonny Schneider</p>
