      <p>Jesse, I don't think giving the client vector files is a risky business. They can squeeze everything anyway ;)</p>
      <p>As for the logo - you might be aware of dot gain and its influence on white space, limited colour palette when applying the logo with graphic marking film. Consider monochromatic version of the logo, vertical/horizontal version (when reproducing on pen or vertical flag), inverse version (when reproducing on bright/dark materials). Consider CMYK, RGB, Pantone (and maybe RAL/NCS etc.) colour specifications.</p>
      <p>It's a good idea to look into some Corporate Identity Manuals.</p>
      <p>_______<br>
      AL<br>
      <a href="http://www.lenart.pl" rel="nofollow">lenart.pl</a></p>
