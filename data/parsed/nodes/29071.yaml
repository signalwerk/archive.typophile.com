      <p>Dot gain will be an important consideration for this at small sizes, since it will be most often reproduced for newsprint, with significant dot gain, somewhere around 30% for this publication.  This means I'll need to give generous kerning at small sizes right?</p>
      <p>Reversed out versions were always on the cards, good suggestion for a monocolour though.  With all these logos, I think a table of files and definitions will also be in order.</p>
