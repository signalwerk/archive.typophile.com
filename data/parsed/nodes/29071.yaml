      <p>&gt;It can be useful for your master logo to be 100mm across, then it’s easier to scale to percentage values.</p>
      <p>While that is useful I normally provide logos at the minimum intended size with an invisible box to indicate the exclusion area. While prepress should deal with trapping, clients are inclined to go with cheapest options where finished quality is not always the prime mover.</p>
      <p>Tim</p>
