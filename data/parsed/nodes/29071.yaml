      <p>Does anyone still bother providing different sized logos? I've not seen any for a while. Isn't the trapping problem better dealt with at production or prepress rather than at the design stage?</p>
      <p>It can be useful for your master logo to be 100mm across, then it's easier to scale to percentage values.</p>
      <p>No-one ever seems to supply RGB vector artwork, very handy for screen/MS Office based work.</p>
