      <p>hmm, you might want to look up style guides companies post about their logos. They regulate the size they can be shown, the colours, the varations, etc. You can probably find a lot of pdf's by googling for them.</p>
      <p>What the client gets depends on what they pay for and what you percieve is worth the price. For instance you might not want to give the client vector editable files so they try to change it themselves. Other clients might ask you to put it in word so they can edit it themselves or some other rediculous request. Also if you give them the vector files then you give them more control over reproduction of your artwork, which depending on your agreement (or lack there of) could determine what end files they get.</p>
      <p>I think mainly it depends on the logo design and there is probably no really established standards for this. If for instance the logo usually includes the tagline, then when reproduced for smaller usage the tagline should be ommited if it becomes unreadable.</p>
