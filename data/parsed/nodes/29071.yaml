      <p>Yep, I'm not looking for dimensions to the millimetre, i'm curious about roughly what sort of intervals I should be looking at.  Like say, 20x20mm, 50x50mm, 150x150mm, 500x500mm?</p>
      <p>It's a very simple logo. Symetrical vector shapes for the mark, simple text in Klavika for the words.</p>
      <p>It will be used for a lot of applications.  www, highspeed web offset, standard offset litho, substrate banners for exhibitions etc.</p>
      <p>I'm just curious, because so many times I get logo artwork from clients as giant .TIF files, when its intended application is a tiny thumbnail for web - and it gets pretty tricky make that sort of thing work.</p>
