    html: <p>No matter how thorough you think you are being, the client will always appear later saying they lost the disk with all of the files and could you please re-create. So, I recommend covering the basics and letting them work with those. Pad the bill just enough to cover any future tweaks or let them know they can always come back to you for work later. Hopefully you've created an inviting situation and they will return to you for other work anyway.</p>
