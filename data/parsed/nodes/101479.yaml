  html: |-
    <p>Hello,</p>
    <p>This is my first post on here!</p>
    <p>I wondered if you knew of a typeface that represented these sort of values of a person:</p>
    <p>honest, approachable, reliable, the original 'Mc'coy', and homely</p>
    <p>I wondered if a serif typeface said 'stern' too much, so maybe a Sans Serif is more appropriate</p>
    <p>By 'Original' I mean someone that has been about for years but is still among the best but maybe needing to be more modern</p>
  html_clean: |-
