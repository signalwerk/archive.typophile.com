      <p>I checked the Walden New Yorker font in detail, and I think the Walden version is a very slightly modified version of the early Rakowski font. The two Q's have identical shapes, but the Walden version uses more points. Since neither matched the original Q, this strikes me as more than odd.</p>
      <p>In any case, neither of them was used for the Faith Ford card. I updated the <a href="http://bowfinprintworks.com/FaithFordType.html" target="new" rel="nofollow">page I posted</a> to show a sample scanned from the McGrew book of Irvin as it existed in metal type form.</p>
      <p>- Mike Yanega</p>
