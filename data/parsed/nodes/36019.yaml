      <p><em> “I can totally understand why discussions of font rasterization would cause...” </em><br>
      ... most people to stop working on font quality. :)</p>
      <p><strong>Screen fonts:</strong><br>
      The Mac uses all of the hints some of the time.<br>
      Windows uses some of the hints all of the time.<br>
      Adobe uses none, ever.<br>
      The reason for this minor discrepancy is that each one has landed on <em> the perfect solution</em>.<br>
      All the concerned type designer has to cross this platform divide is an outline, a baseline, and a prayer.</p>
      <p>Cheers!</p>
