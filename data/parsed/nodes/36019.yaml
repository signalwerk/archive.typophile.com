      <p>With the exception of Flash’s Saffron rasterizer, AFAIK all Adobe’s rasterizers make heavy use of hint information. (If the CoolType rasterizer ignored hints, Nick would not have gotten dramatic changes from simply adjusting the hinting.)</p>
      <p>The CoolType rasterizer used by InDesign, Illustrator, Photoshop and Acrobat/Reader has several configurable modes of anti-aliasing. For example, only Acrobat and InDesign story editor (and InCopy) support enhanced rendering for LCD screens.</p>
      <p>I believe John is right that CoolType ignores TrueType delta hints - I think it ignores both X and Y deltas, but I’m pretty sure it ignores X deltas. Mind you, this might be true only when doing LCD rendering... I don’t pay close attention to the non-LCD stuff.</p>
      <p>Regards,</p>
      <p>T</p>
