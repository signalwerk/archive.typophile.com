      <p>Yes thanks. I had been following the related links. This has some great ideas, including mashing the weight to fit an individual’s need and <em>iiiiiiiiiiiiii</em>...can’t remember what else ;)</p>
      <p>But it still asks (and presumably is trying to answer) the question: <strong>“Can’t we have hinting at low resolutions, and accuracy at high resolutions, too? “</strong>. . . In addition:<strong> “while Microsoft uses their aggressive hinting there will be no higher than 100 DPI resolutions, period”</strong></p>
