      <p>&gt; <em>But as I said, the downside is that the overall effect is a bit clunky bitmappy, and the proportions are wack, so it’s a tradeoff.</em></p>
      <p>It’s a tradeoff indeed. It’s the result of the grid-fitting process. The hints act as guides to the rasterizer, telling it how the outlines can be adjusted/distorted so that more pixels can be completely turned off (i.e. made black), and thus making the resulting raster-letterforms appear crisp.<br>
      Not allowing grid-fitting will result in blurrier letter-images.</p>
      <p>This is an interesting observation as well: <a href="http://www.typophile.com/node/31448#comment-185584" title="http://www.typophile.com/node/31448#comment-185584">http://www.typophile.com/node/31448#comment-185584</a></p>
