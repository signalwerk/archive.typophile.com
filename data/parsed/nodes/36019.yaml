      <p>Short answer: It depends. Mostly the difference is related to differences in the hinting (which goes with the outlines) rather than the outline format alone.</p>
      <p>Not much difference in Flash, nor in Mac OS X’s native rendering. More difference with most other renderers. With both CoolType’s LCD-enhanced rendering, and WPF ClearType rendering, with properly-hinted fonts, I don’t know that you’ll consider either outline type significantly “better” - they’re just different.</p>
      <p>Cheers,</p>
      <p>T</p>
