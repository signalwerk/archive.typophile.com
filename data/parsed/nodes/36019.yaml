      <p>I think I’ve got it figured out. I needed to play around with the standard stem width values a bit more.<br>
      Usually I don’t put this much hinting in fonts, leaving things a bit soft but with more accurate letter shapes, but that didn’t seem to work for this kind of Didone typeface. So now it’s sharp and black (InDesign at centre, Illustrator right), although the proportions aren’t as true as the Apple rendering (TextEdit, left). It’s hard to say which is better, especially as their relative effectiveness varies with size, but in general I prefer the less bitmappy look of the Apple — although there are probably a few more tricks I could do in nuancing the hinting.<br>
      </p><div class="imageWrap"><img src="/files/Hinty_3815.jpg"></div><p></p>
