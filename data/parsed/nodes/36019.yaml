    html: |-
      <p>Also, I believe that the Apple rasterizer completely ignores hints. I think it does some smart supersampling, i.e. rasterizes the glyphs at, say, 2x the actual size and then applies its very efficient antialiasing to scale the glyphs down. It seems that this is why you don’t see any changes when you change the stem values. </p>
      <p>The Apple rasterizer has a tendency to draw type “more readable”, i.e. very often, simply “bolder”. This is obvious with Apple’s goal at hand: the best screen readability possible. On the other hand, Adobe’s goals are different, at least in InDesign and Acrobat: to simulate the print appearance as good as possible. This is why type may be drawn lighter (with accurate hinting) because the Adobe rastierizer tries to balance two aims: on one hand, make the type readable on screen, on the other hand, show the fonts in an appropriate relation to bitmaps, outline drawings etc. that appear in the project. </p>
      <p>Please note that if you open a PDF in Apple’s Preview, it usually gives you good on-screen reading experience but it does not accurately reflect the actual relations between the type weight and the other elements of the publication. So if you used Preview’s appearance as a preview for what you’ll get in print, you may end up being bitterly disappointed. </p>
      <p>A.</p>
