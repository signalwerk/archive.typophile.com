      <p><em>it’s a tradeoff</em></p>
      <p>So a design space is opened up, because different kinds of typeface call for different kinds of hinting.<br>
      But I don’t think users pay a lot of attention to the on-screen hinting of fonts — other than to big-up Georgia and Verdana — in general one forms one’s opinions of what a typeface looks like based on observing how it behaves in offset print, or by looking at its lettershapes onscreen at very large magnification.</p>
