      <p><strong>“No more horizontal pixel grid! Really! From now on the horizontal grid is 1/256 of a pixel!”</strong><br>
      What’s more, optical scaling was never required in the first place, you silly font freaks, a single digital outline font, can do all that’s required for everybody’s needs everywhere. Any smart guy with 256 options should be able to make “great looking type”, really! (he’s got the algorithm). </p>
