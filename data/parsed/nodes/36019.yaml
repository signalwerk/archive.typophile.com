      <p>That’s right Chris, you have to make sure that the fine strokes register as a standard stem width; that sharpens them up — otherwise they are rendered as a blur which all but disappears.</p>
      <p>But as I said, the downside is that the overall effect is a bit clunky bitmappy, and the proportions are wack, so it’s a tradeoff. But really, it’s a bit much to expect to a Didone to render nicely on screen.</p>
      <p>It seems that typographers such as Stefan may prefer something which is indistinct, rather than something which is sharp but inconsistent. </p>
      <p>However, in Adobe’s defence, I must say that now that I’ve figured out a rendering for this font on CS for the Mac, I don’t have to worry how it will look in CS on a PC, and these hinting settings should be OK for Word as well. </p>
      <p>Stefan, what is the font used in your sample? If it’s not an Adobe font, some of the onus for its performance may fall on the foundry that produced it.</p>
      <p>With regards to Didone types, Apple’s system font Didot renders weakly in both the OS apps (eg Textedit) and CS apps — it seems that there is no hinting, the assumption being that the system will take care of everything.</p>
