  html: "<p>Hrant (from the critique of Seriatim Gestalt):  <br> <br>&gt; Which reminds me of an experiment I've <br>&gt; been considering: making a font (probably <br>&gt; out of Times) that substitutes other letters <br>&gt; for the real ones, with some minimal <br>&gt; manipulation. Like taking an \"e\", rotating it <br>&gt; 180, and adding a small curling stroke to <br>&gt; the bottom-right: one messed-up \"a\"!  <br> <br>I think it was David Carson who did something like that with Times Roman. <br> <br>Here's a version of that idea using Seriatim. The ground rules: Characters had to be used as they are, with no manipulations other than rotating, shifting or flipping. Characters could not be used to represent themselves (I followed this one pretty well, with the exception of the upper-case \"U\", which I flipped horizontally, and the at \"@\", which I flipped vertically). I allowed this rule to lapse for most of the nonalphabetics and nonnumerics. <br> <br>David <br> <br><img src=\"http://www.typophile.com/forums/clipart/your_image.gif\" alt=\"SeriatimSubstitution.jpg\"> <br><img src=\"http://www.typophile.com/forums/clipart/your_image.gif\" alt=\"SeriatimSubstitutKernSample.jpg\"></p>"
  html_clean: "<p>Hrant (from the critique of Seriatim Gestalt):  <br> <br>&gt; Which reminds me of an experiment I've <br>&gt; been considering: making a font (probably <br>&gt; out of Times) that substitutes other letters <br>&gt; for the real ones, with some minimal <br>&gt; manipulation. Like taking an \"e\", rotating it <br>&gt; 180, and adding a small curling stroke to <br>&gt; the bottom-right: one messed-up \"a\"!  <br> <br>I think it was David Carson who did something like that with Times Roman. <br> <br>Here's a version of that idea using Seriatim. The ground rules: Characters had to be used as they are, with no manipulations other than rotating, shifting or flipping. Characters could not be used to represent themselves (I followed this one pretty well, with the exception of the upper-case \"U\", which I flipped horizontally, and the at \"@\", which I flipped vertically). I allowed this rule to lapse for most of the nonalphabetics and nonnumerics. <br> <br>David <br> <br><img src=\"http://www.typophile.com/forums/clipart/your_image.gif\" alt=\"SeriatimSubstitution.jpg\"> <br><img src=\"http://www.typophile.com/forums/clipart/your_image.gif\" alt=\"SeriatimSubstitutKernSample.jpg\"></p>"
