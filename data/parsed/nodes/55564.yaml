    <p>Hi Typophilian Mates</p>
    <p>I just done a new fontface design.. called "Serifada" based on concept of Chilean Hitory.. following some aesthetics and synesthetic asociations. Although this can be clasified  like display that hard serif and broken shapes help to make a better readable text. I don't an expert but I done some test and run so well on small sizes.</p>
    <p>I hope get your opinions and critiques</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Serifada_1st-WIP-show_3725.png"></div><p></p>
    <p>regards..!!<br>
    =)<br>
    Pedro [PeGGO]</p>
    <p>NOTE: The old name "Politica" belong to Ale Paul font, an now my design name has been changed by "Politic"</p>
