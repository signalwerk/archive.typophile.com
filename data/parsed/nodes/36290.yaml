    <p>Hi all, </p>
    <p>First of all thank you for the useful information all of you have given to me on this website. I am a photographer / slash / designer, and i am currently working on a project where i will be needing a Greek font for. I have searched on all the huge fontshops to buy a greek font that looks like it could be used for Tattoo lettering, but i can't really find anything but the standard fonts... :/<br>
    I really hope that someone can redirect me to some typefaces that support Greek language as well.</p>
    <p>kind regards,<br>
    jolijn</p>
