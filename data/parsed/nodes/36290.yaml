      <p><a href="http://www.oakknoll.com/detail.php?d_booknr=78258">Here</a> is the kind of alphabet I meant.</p>
      <p>I suppose the feature won't be for Greek users only? And that perhaps you're looking for a tattoo-like font that supports all kinds of alphabets, including accented Latin, Cyrillic and Greek? That won't be easy indeed… But if you only need Greek chars, probably you could write them down, trace them and add them into the font. In this case perfectly even spacing and kerning isn't needed, I guess, and neither are well shaped outlines. Some distortion might fit a tattoo font anyway.</p>
      <p>Did you go through <a href="http://cg.scs.carleton.ca/~luc/greek.html">Luc Devroye's exhaustive index page</a>?</p>
