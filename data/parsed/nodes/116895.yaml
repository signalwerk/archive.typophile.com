      <p>Thanks Bob. I did find it in my fonts. I must have seen it long ago and forgotten about it. But seeing it on the book cover impressed me as to its suitability as a running text sans with a good combination of legibility, even color and interesting but not overly distracting letterforms. I would probably limit its text use to no more than 50 or so words.<br>
      Don</p>
