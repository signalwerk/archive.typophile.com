    <p>We've launched v2 of the TypeTrust web site.</p>
    <p><a href="http://typetrust.com" title="http://typetrust.com">http://typetrust.com</a></p>
    <p>We've had a functional beta online since April, but we wanted to hold off on widespread promotion until we were really happy with the web presence.  (A little CSS goes a long way.)  We're working on some additional features like RSS and referral tracking, and we're still plugging away with the content.  More specimens and downloadable PDFs are in the works, so bookmark us or create an account to receive announcements.</p>
    <p>Some new fonts are up.  <a href="http://www.typetrust.com/fonts/designer.php?did=Nw==" rel="nofollow">Chris Dickinson</a> has given us two brand new exclusive humanist sans families: <a href="http://www.typetrust.com/fonts/font.php?id=MjI1" rel="nofollow">Alber</a> and <a href="http://www.typetrust.com/fonts/font.php?id=MjM0" rel="nofollow">Depot</a>.  We've got more from <a href="http://www.typetrust.com/fonts/designer.php?did=Mw==" rel="nofollow">Dino dos Santos</a> (DSType).  I've regenerated his new OTFs to group by family -- a vital convenience in my opinion.  <a href="http://www.typetrust.com/fonts/designer.php?did=OA==" rel="nofollow">Ryoichi Tsunekawa</a> (Flat-It) has joined and has a lineup of exclusives on the way.  <a href="http://www.typetrust.com/fonts/designer.php?did=Mg==" rel="nofollow">Neil</a> teamed up with <a href="http://www.typetrust.com/fonts/designer.php?did=NA==" rel="nofollow">Anuthin Wongsunkakon</a> to put the finishing touches on <a href="http://www.typetrust.com/fonts/font.php?id=Mjgz" rel="nofollow">PennStation</a>... an intricate LED style headline.  Neil has also been quite busy.  Several of his OTF rereleases are now available.</p>
    <p>Feedback is much appreciated.  Let us know what features you'd like to see and whether you stumble over any quirks that need fixing.  Just shoot us your 2 cents through our contact form.  Thanks!</p>
