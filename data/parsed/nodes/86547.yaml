  html: |-
    <p>The caron on a /dcaron/, /lcaron/ and /tcaron/ shouldn't really look like an apostrophe, should it? Supposing my /commaaccent/ looks like a /comma/, is it fair game for my alternative caron to look more like an straight stroke, angled from 1 o'clock down to 7 o'clock? Look forward to your thoughts, especially if you're Czech.</p>
    <p>N</p>
