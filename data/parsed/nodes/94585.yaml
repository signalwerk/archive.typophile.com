    html: |-
      <blockquote><p>It is Myanmar MN...</p></blockquote>
      <p>... Or Oriya (and many others)... It actually describes <a class="freelinking external" href="http://www.monotypeimaging.com/productsservices/wt_info.aspx?type=burmese" rel="nofollow">a Non-Latin script used to write Burmese language in the Myanmar region</a>, so definitely nothing to do with your sample... Except for its Latin-Part but I couldn't find anything on the Latin-part based-on font... I've found 2 similars for your sample though: <a class="freelinking external" href="http://www.myfonts.com/fonts/profonts/euro-sans-pro/" rel="nofollow">Euro Sans</a> and <a class="freelinking external" href="http://www.myfonts.com/fonts/castletype/carisma/" rel="nofollow">Carisma</a></p>
