    <p>Hi all, I’m about to start teaching typography again and one of the things i’ve never been able to find a simple resource for is something that explains, or preferrably shows the process of photo typesetting. I try to explain it to my students, how we used to have fonts on strips of film (and later, small cards) like negatives, and how these were mounted on drums, and the drums spun around really fast as light shot through the negatives for each letterform, exposing it at the correct size onto photographic paper.</p>
    <p>Well, naturally, it’s bewildering, and I’ve long wished that there were a little movie, much like the numerous little movies there are out there showing metal type setting, lead casting, etc.</p>
    <p>Does anyone know of something like this on the web, or ... ???</p>
