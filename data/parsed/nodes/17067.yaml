      <p>FWIW, Marian, you might try contacting the Museum of Printing in North Andover, <a href="https://web.archive.org/web/20080908101553/http://www.museumofprinting.org/" title="www.museumofprinting.org">www.museumofprinting.org</a>, to see if there are any period films from the original manufacturers (that could be converted). I’m guessing they might still exist. Frank Romano wrote a good capsule history of phototypesetting from the North American perspective in Printing History, the APHA journal, Number 46 (Volume 23, No. 2) 2003, as an eyewitness.</p>
      <p>If you haven’t come across it already, download this article by Andrew Boag, on Monotype’s photosetting equipment, written for the Printing History Society, the graphics will help. <a href="https://web.archive.org/web/20080908101553/http://www.letterpress.ch/APINET/IMMPDF/MONOPHOTO/PHS_journal.pdf" title="www.letterpress.ch/APINET/IMMPDF/MONOPHOTO/PHS_journal.pdf">www.letterpress.ch/APINET/IMMPDF/MONOPHOTO/PHS_journal.pdf</a></p>
