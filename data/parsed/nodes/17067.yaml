      <p><em>preparing for a career as a digital drone.</em></p>
      <p>For those who can remember...<br>
      <strong>JANUARY 23, 1884</strong><br>
      </p><div class="imageWrap"><img src="/web/20080908101553im_/http://typophile.com/files/Apple1984ad.jpg"></div><p></p>
      <p>Apple Computer, Inc. introduces the world’s first user-friendly, Macintosh personal computer. Its dramatic, Orwellian,1984-inspired Super Bowl TV ad introduces the product as a world smashing alternative to Big Brother’s grip on workers in dull grey drone attire... APPLE — PLEASE SAVE US!</p>
      <p></p><div class="imageWrap"><img src="/web/20080908101553im_/http://typophile.com/files/Apple84hammer.jpg"></div><p></p>
      <p>Maybe the attire has changed... but the drones live on.</p>
      <p>FYI —<br>
      </p><div class="imageWrap"><img src="/web/20080908101553im_/http://typophile.com/files/lisa300.jpg"></div><br>
      Before there was the Macintosh, there was the Apple Lisa as the first desktop publishing front end. I worked on the Lisa for about a year at Compugraphic before the Cg’s top management decided the hippies at Apple were crazy and that we would not support them in font development. The rest is history... and so is Cg.<p></p>
