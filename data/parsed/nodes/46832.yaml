    <p>Sample from <a class="freelinking external" href="http://www.cecinewyork.com" rel="nofollow">Ceci New York</a>:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/melissa_jay_6_5563.jpg"></div><p></p>
    <p>Trying to identify the fancy 'M' in the middle. It looks a lot like <a class="freelinking external" href="http://www.myfonts.com/fonts/intellecta/surrey/" rel="nofollow">Surrey</a>, except that the actual letter doesn't look the same. I've browsed through the family on myfonts and can't find the style pictured, and I've seen work using the same font on another designer's site so I'm convinced it's a typeface. Perhaps there's another style of this one that I'm missing? I've googled and haven't found anything.</p>
    <p>Thanks for any help :)</p>
