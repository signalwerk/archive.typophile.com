    <p>Hi everyone,</p>
    <p>I'm looking for a similar font which was used in the Beefeater Gin logo (the one used in the word "Beafeater"). According to the company, a custom designed font was used. So I'm really just looking for a font which looks a similar as possible.</p>
    <p>Any hints would be highly appreciated!</p>
    <p>Best regards</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/font-id/Beefeater_London_Dry_Gin.png" width="2000" height="700" alt="">
