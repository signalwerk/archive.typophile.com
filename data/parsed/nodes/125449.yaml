      <p>The font Deadhead from TwicoLabs can get the letter shapes reasonably well.<br><a href="http://twicolabs.com/deadhead-free-font/">http://twicolabs.com/deadhead-free-font/</a><br>
      It is not a layered font--and I don't know if the font Beefeater commissioned is, either. So you may want to hit fontsquirrel and other sites looking specifically for layered fonts that may get you yet closer. At least if the multi-part, different color is important.</p>
      <p>Mike</p>
