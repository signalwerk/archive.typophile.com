ings I am using in VOLT are: <br>language=default <br>script=mand <br>If I change the language defaut to, say us, or English, will that help? <br>If I change the scrip to a recognized one, will that change anything? <br> <br>It would be great if you could find some time to help me with that, I am totally lost, and I hope there is enough information on what I a m trying to do, if not let me know.</p>"
