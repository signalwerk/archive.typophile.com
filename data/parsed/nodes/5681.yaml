  html: "<p>Hi! I am trying ti create a font (using VOLT, but if anyone knows another tool, and how I could go through this, it would be appreciated too!) which uses contextual substitution. However, it does not seem to be working. <br>Would you give me some advise to complete this work? <br> <br>What I am trying to do is: <br> <br>say you have families 1,2,3,4 <br> <br>fam1=&gt;b, k, n, w, plus a special character (consonantic group) sh <br> <br>fam2=&gt;d, m, v, r + dj (left to right) <br> <br>fam3=&gt;f, l, s, z + tsh (left to right) <br> <br>fam4=&gt;g, p, t, y j <br> <br>########################## <br>This is where my problem starts: <br> <br>now l and r have 2 forms:  <br> <br>-&gt;one as a first letter in the syllab <br>-&gt;one as a mark when folllowing another consonant <br> <br>-&gt;m/n have two forms and become a mark when preceding a consonant. <br> <br>-&gt; vowels (I forgot to say it before: y is considered a consonant) have 6 forms which are the followings <br> <br>fam1 + a=&gt;a_1 <br>fam2 + a=&gt;a_2 <br>fam3 + a=&gt;a_3 <br>fam4 + a=&gt;a_4 <br>any vowel in forms stand-alone; 1 and 3 + a=&gt; a_5 <br> <br>any vowel in forms 2 and 4 + a=&gt; a_6 <br> <br>and there is a form as a stand-alone letter (the above applies to each vowel), which is the same as when following a vowel in form 5 or 6 <br> <br>How do I specify this to Volt? As I said before, if anyone knows how to do this with another tool, it would gratly help too! <br> <br>I have tried using th add feature, then add substitution , then type in the letters it should apply to, but when trying to compile it, it doesn't work at all. <br>I am not using a standart script (I made-up one) maybe this is the source of the problem?  <br>What if I change it to latn1, our arabic? <br>The script is \"Mandombe\", it is not supported by Unicode yet, (well I couldn't find it listed in the unicode list, however, all characters are supported, but spread accross several scripts). <br> <br>The language settings I am using in VOLT are: <br>language=default <br>script=mand <br>If I change the language defaut to, say us, or English, will that help? <br>If I change the scrip to a recognized one, will that change anything? <br> <br>It would be great if you could find some time to help me with that, I am totally lost, and I hope there is enough information on what I a m trying to do, if not let me know.</p>"
