      <p><cite>I don’t understand what’s so sick and disgusting about this, unless you fear that it will one day replace ALL writing.</cite></p>
      <p>I'm sure it never will, but LEET, as well as SMS texting, has started to influence communication outside of the gaming community. Dropping common grammar and punctuation is an early precurser to this kind of writing. Remember MissGiggles getting vehemently abused for that? </p>
      <p>I'm opposed to it on a formal level, I suppose. Our educational systems have already gone backrupt since I was in primary school, and probably much before that. People understand best what they see or use most, and vice-versa.</p>
