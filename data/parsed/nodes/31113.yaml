      <p>I suppose that there's always a side of someone who feels like he's not part of the group and might be missing out. I'm not a gamer, and yet I see that there is a whole world right there with it's own language, culture and social structures. You don't know what you don't know.</p>
      <p>So I'll concede a few points:<br>
      1) I wish I could 1337 with fluidity and grace, just to annoy people like me. I often don't like people like me, so annoying them with something that annoys me appeals to me.</p>
      <p>2) Diversity in all its forms is great. Except for things I don't understand. Then it is evil and must be destroyed.~ </p>
      <p>3) Languages evolve because of a general ignorance of the "rules" as set down institutionally. War is Peace. Freedom is Slavery. Ignorance is Strength.</p>
