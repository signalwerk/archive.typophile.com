    html: <p>Kerning is more of an art than a science. While I would say the ’oc’ pair in the Metrics sample is too loose, there are many pairs in the Optical sample that are too tight, and the ’ry’ is too loose. Remember also that text fonts are kerned for text sizes (check the samples at 11pt) and Optical spacing is best left for headlines and used with care.</p>
