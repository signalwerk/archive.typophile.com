    <p>hey all,</p>
    <p>my work finally got FF Meta sans/serif and i love it.</p>
    <p>one thing that is bothering me though is the kerning.</p>
    <p>i have a title that is set at 50pt in the bold variant, but for some reason the metrics setting make the spacing look weird to me. setting it to optics seems better.</p>
    <p>is this normal?</p>
    <p>is this an indesign or meta thing?</p>
    <p>any ideas?</p>
    <p>thanks!</p>
