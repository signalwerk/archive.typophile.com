    html: |-
      <p>Not only is kerning more an art than a science, opinions differ, with few completely “right” or “wrong” answers. With really bad kerning, you might get 98 out of 100 people to agree it is bad.</p>
      <p>As Stephen Coles pointed out, text fonts are kerned at text sizes. Moreover, foundry kerning has to assume any mix of letters. WA has to be kerned for a following “L” or a following “V”; only one value permitted in the font.</p>
      <p>The rule at our shop (composition) is that display type must always be hand kerned. No font-based kerning can cover the all the sizes, the variations in letters used, the variations in the number of words in the title. These are all at play.</p>
