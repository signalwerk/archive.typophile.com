    html: |-
      <p>I would loosen all pairs of Integrity EXCEPT the first one… In other words: use ‘In’ as the starting point. </p>
      <p>IMO the best way to kern a word is to [1] find the difficult pair(s) that’s kind of unfixable and then [2] work from that starting point and do the others…</p>
      <p>(Some thing with Flower: there is a big whole between F and l. Kern that a mite and then adjust the other pairings to emulate this.)</p>
