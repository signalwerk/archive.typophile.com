    <p>Hi!<br>
    I'm a fontaholic from Finland and new here. Since I haven't gotten an answer for months after posting in WhatTheFont forums I thought it might be best to put my request here!<br>
    The only info I have foung is that it might be a Letragraphic(what's that?) font from the 70's.<br>
    It was used by Deep Purple as a band logo around 1974 as well as on some albums and tourbooks. The sample is from the album Made in Europe.<br>
    Haven't really seen this any other place.<br>
    Thankful for any help.</p>
    <p><img src="/sites/default/files/old-images/dpfont_5907.jpg"></p>
