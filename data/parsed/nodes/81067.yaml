    <p>Hi All,</p>
    <p>I am reworking my companies logo and would love some feedback. </p>
    <p>Inspired by the Gralab logo from the 70's, I am trying to create an aesthetic that can make my logo memorable, fun and classic.</p>
    <p>I'm fairly happy with the logo at this stage, but I'm not sure the uppercase 'G' is really working and would love an opinion /advice on any of the other letters. </p>
    <p>Thanks in advance.</p>
    <p>Nick</p>
