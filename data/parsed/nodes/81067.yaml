      <p>Aren't you supposed to use ® instead of ©?</p>
      <p>Decrease the size of the © or have fun with it by creating a lowercase <em>i</em> or an exclamation point.</p>
      <p>The apex of the <em>A</em> looks thicker than everything else to me.</p>
