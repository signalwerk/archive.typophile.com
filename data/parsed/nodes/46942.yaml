    <p>i'm designing a web banner with a headline currently set in gotham. my client likes the font, but would like to see something slightly more condensed. unfortunately, he felt that gotham condensed was too condensed for this application. can anyone recommend a somewhat condensed display face that i could try instead?</p>
    <p>thanks</p>
