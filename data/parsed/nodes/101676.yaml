      <p>I think "coffee" is probably a font (something like Imago, although not the "e") but "GAGGIA" seems to be a one-off rendering... by somebody who doesn't know how letters work. It's made of pure geometry (look at the bad curve-to-line transitions, and the overly small aperture of the "A"); the good news is that makes it easy to reproduce.</p>
      <p>hhp</p>
