      <p>As to the chicken-and-egg question of card sizes, since today's 3 1/2" by 2" size was one of the Victorian alternatives, the first place I would look for an explanation would be at the standard sizes of paper stock.</p>
      <p>Thus, the standard 8 1/2" by 11" page size derives from (American) Demy Quarto/4to.</p>
      <p>But someone already noted that it derives from an American size of paper stock instead of a British one, so I'm puzzled.</p>
      <p>As to the credit card, the ISO/IEC standard gives it as 85.6 by 53.98 millimetres, which is close to 3.37 by 2 1/8 inches.</p>
