      <p>As to the original dimensions of the card, I can't tell you that.<br>
      However, if you look at the length and height of it, (84mm x 54mm) you will notice that the proportion of length to width is 1.59, which is incredibly close to the Golden Ratio (1.61803399).</p>
      <p>And the corners of credit and bank cards are rounded so they are less likely to bend or get stuck in an ATM.</p>
