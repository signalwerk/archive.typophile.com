    html: <p>It is, indeed the business card format... back in the 1950's, when Bank of America in San Francisco, began to notice that merchants were essentially acting as banks when the merchants managed substantial "lay away" payment programs, and in an effort to compete against this, BoA initially gave "chits", literally typed with hand written signature pieces of paper, to their more trusted clients so they could go to to specific merchants for "credit purchases"... then it was just a matter of experimentation to formalize and standardize these "chits" into familiar and convenient "cards" that would be easy for anyone to carry around.</p>
