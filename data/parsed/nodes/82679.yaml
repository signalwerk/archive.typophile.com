    html: <p>The shape of business cards in the U.S. was dictated, in part, by the typical dimensions of card stock offered by American paper suppliers, 22"×28". You can get 88 2"×3½" cards out of a standard sheet, if there are no bleeds--which, typically, there weren't when cards were printed on a letterpress.</p>
