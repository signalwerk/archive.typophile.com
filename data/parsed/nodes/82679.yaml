      <p>My guess is that the standard credit card size was based on size of business cards, which derived from the size of Victorian calling cards. There's an interesting article about calling cards at <a href="http://www.paperpenalia.com/cards.html" title="http://www.paperpenalia.com/cards.html">http://www.paperpenalia.com/cards.html</a></p>
      <p>"By Victorian days, a tightly structured hierarchy of card size...was used...The largest cards, measuring 3 3/8" x 2 1/2", were reserved for married couples. A man could choose a card of either 3 3/8" x 1.5" or 3.5" x 2" dimensions. Sizes then ranged down to that for a married woman, a single woman, an unarried daughter still living at home, and a child, who had the smallest card at 2.25" x 1 3/8"..."</p>
      <p>&gt; The shape of business cards in the U.S. was dictated,<br>
      &gt; in part, by the typical dimensions of card stock...</p>
      <p>Interesting, but if there is a connection between card size and paper size, I wonder if the connection might be the reverse — that stock was made to that size because it worked well when printing the most popular card size.</p>
    html_clean: |-
