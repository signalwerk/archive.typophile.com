      <p>I see there was a misprint in my source for the size of the credit card. It should have been 85.60 by 53.98 mm, which is 3 3/8" by 2 1/8".</p>
      <p>The Charg-a-Plate was 2 1/2" by 1 1/4", the <a class="freelinking external" href="http://en.wikipedia.org/wiki/Credit_card" rel="nofollow">same Wikipedia article</a> notes.</p>
      <p>A business card, in the U.S. at least, is slightly smaller, at 3 1/2" by 2".</p>
      <p>There is no traditional paper size that is either 8" by 14" or 14" by 16". There's 8" by 10" and 8 1/2" by 14". And there's Large Post at 16 1/2" by 21" if one wants to go duodecimo... or, rather, 48mo.</p>
      <p>However, the credit card's size <strong>is</strong> neatly related to Foolscap, at 17" by 13 1/2"; 17" is 2 1/8" times eight, and 13 1/2" is 3 3/8" times four.</p>
