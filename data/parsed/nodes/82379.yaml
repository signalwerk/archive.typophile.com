      <p>I'm assuming you realize that the severe squooshing makes the numerals in the draft very uncomfortable - that's at least as bad as the bad node in the "6".</p>
      <p>I'm sure people can suggest good fonts* with narrow numerals and the diagonal-style "6" and "9", and I can see that budget is an issue, but to me this is crying out for custom numerals! Something that will make people think "port". Please feel free to contact me if you'd like to discuss pricing for such custom work: hpapazian at gmail dot com</p>
      <p>* I might suggest you try Tarzana Narrow.</p>
      <p>Also, I have to think that Times-Bold (for the large code in the middle) is sort of pedestrian in this context, especially since you're resorting to the classiness of Greek letters. What would be ideal is to make the font both more expressive and harmonious with the large two-digit background numbers.</p>
      <p>Lastly, although I do see the clever circular ring of text all around the placemats, it might be useful to make the central large code also readable from more than one viewpoint; maybe have three (two would be less balanced) copies of the code pointing in 120 degree steps.</p>
      <p>hhp</p>
