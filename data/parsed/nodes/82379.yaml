      <p>• Pairs of digits (63, 66, 70, 77), properly kerned, which I can control, must approximately fill an A4 page less 30pt margins, a space in a ratio close to 111:76. More exactly, if you care, ( (2^-1.75)*72/0.0254 - 2*30 ) / ( (2^-2.25)*72/0.0254 - 2*30 ) to 1.</p>
      <p>• Lining, sitting on baseline, matching heights.</p>
      <p>• Upright: non-italic, non-oblique.</p>
      <p>• Diagonal 6.</p>
      <p>• Not fussy. That probably means sans-serif, but small serifs might be OK. It also means not odd or mal-proportioned, in any of the various senses in which a font can be so.</p>
      <p>• Bowl height about half total height.</p>
      <p>• With counters.</p>
      <p>Contact details at <a href="http://www.jdawiseman.com/author.html" rel="nofollow">www.jdawiseman.com/author.html</a>.</p>
