      <p>Thank you for the prompt reply. Lots to say.</p>
      <p>• “squooshing”! I admit to using slightly different font sizes for different digits, to make them the same height, but for each digit the x and y sizes are the same. Squoosh-free!</p>
      <p>• My limited experience of these matters suggests that there is likely to be great conflict between “budget is an issue” and “custom”.</p>
      <p>• I took a screen-shot of a <a href="http://www.emigre.com/fontpage.php?PTarNR.html" rel="nofollow">web example of Tarzana Narrow Regular</a>, and moved things. A tightly spaced “66” was square. But A4 less my default margins has a ratio about 111:76, far from square. Or are you suggesting that I do some “squooshing”?</p>
      <p>• “Times-Bold … is … pedestrian”. Well, yes. But it does have two-and-a-half advantages.<br>
      1. It has matching lower-case Greek letters.<br>
      2. It is free.<br>
      2½. I won’t offend any Port drinkers, who are, by nature, conservative creatures.</p>
      <p>• There is no need to “make the central large code also readable from more than one viewpoint”. I sit in front of my own glasses. Everybody else sits in front of their own, which are arranged identically. (E.g., <a href="http://www.theportforum.com/viewtopic.php?t=4348&amp;start=8" rel="nofollow">pictures taken at a recent tasting</a> in which everybody had two 8½″×14″ US Legal pages, and <a href="http://www.theportforum.com/viewtopic.php?t=4978&amp;start=10" rel="nofollow">another</a> in which everybody had five sheets of A4.)</p>
