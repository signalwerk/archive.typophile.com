      <p>The font with the PostScript name UniversalisADFStd-BoldCond is generally good, but insufficiently tall. So I have added to <a href="http://www.jdawiseman.com/placemat.html" rel="nofollow">my PostScript program</a> two extra parameters:<br>
      <code>% y/x scaling, bigger being taller, smaller being fatter<br>
      /BackgroundTextsSquooshMin 0.5 def<br>
      /BackgroundTextsSquooshMax 2.0 def</code><br>
      and added code to use them.</p>
      <p>The program then chooses a squoosh of 1.72775, that allowing the 0 and 3 to touch top and bottom, and the ‘66’ to fill the width. The result is, again, at <a href="http://www.jdawiseman.com/port/20111011.pdf" rel="nofollow">www.jdawiseman.com/port/20111011.pdf</a>.</p>
      <p>Is it perfect? No. Is it good enough? I think so.</p>
      <p>Thank you all for help and suggestions.</p>
