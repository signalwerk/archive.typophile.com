      <p>Message sent to Nick — thank you for the link.</p>
      <p>Perhaps others could suggest possible requirements that I might have forgotten.</p>
      <p>• Digits should have level bottoms (on baseline) and tops. But a pointy top, ^, has a lot less visual weight at the top than a horizontal line (e.g., ‘7’) or a smooth curve (e.g., ‘0’ or ‘8’). So no pointy tops please.</p>
