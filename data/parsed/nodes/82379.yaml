      <p>Kerning. When there are only two characters, they can each breathe plenty on three sides. So the fourth can be kerned very tightly. But if typesetting a paragraph of Lorem ipsum dolor sit amet (or the linked example’s cyrillic equivalent), then adjacent characters must be clearly separate but not separated. Different quantity ⇒ different kerning rules. </p>
      <p>Likewise, perception of the relative widths of vertical and horizontal strokes varies with context. Bulk text must be treated as sacrosanct. Headline text is a little more decorative, and a little less prone to exhaustion through quantity, so there is a little more freedom to play. For example, at the larger size and smaller quantity serifs are less useful. And if setting just two characters on a whole page, things are different again. </p>
      <p>Next, read a page of a book. You probably held the book perpendicular to the line of sight. </p>
      <p>With two A4 pages on a dining table, portrait, one ‘above’ the other, the further page is at about 45° from my line of sight, and I’m 6′1½″. For me that is a foreshortening of a factor of about 1.4, and for shorter people the factor will be larger. There is enough wiggle-room  to tolerate the squooshing, even for a type pedant.</p>
    html_clean: |-
