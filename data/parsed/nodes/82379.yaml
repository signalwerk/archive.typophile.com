    <p><strong>Introduction</strong><br>
    At port tastings we always use placemats, to label glasses, and for the other paperwork that helps run a confusion-free tasting.</p>
    <p>Behold the <a href="http://www.jdawiseman.com/port/20111011.pdf" rel="nofollow">draft placemats for a tasting on 11th October</a>. Observe the background digits, “66” on the second page, currently set in FusiThinNormal, and outlined by my <a href="http://www.jdawiseman.com/papers/placemat/placemat.html" rel="nofollow">PostScript code</a> (with <code>clip</code> … <code>stroke</code>).</p>
    <p><strong>Good features</strong><br>
    • Tall, such that two adjacent digits have a bounding box in the ratio of A4 less 30pt margins.<br>
    • Sans-serif, so not fussy in this background role.<br>
    •&nbsp;The neck of the six climbs diagonally, rather than the cluttered look of a vertical then curve.</p>
    <p><strong>Bad features</strong><br>
    • Near the bottom of the inside curve of the 6, a control point is wrong.</p>
    <p><strong>Request</strong><br>
    Can any readers suggest a better tall sans-serif font with good digits?</p>
    <p>I am willing to pay a modest fee for a typeface, though obviously prefer free. However, the typeface must be accessible from PostScript, and must be embeddable within PDF.</p>
