    html: |-
      <div class="comment-spam-body"><p>There are similar fonts, commonly labeled as demi or semi serif.<br>
      To make them the designer snips off various serifs, and voila! a new font.<br>
      This one may be a custom snip job. The crossbar on A has joined various serifs in the trashcan.<br>
      Compare the snipped version on the lhs with the one on the rhs, which is probably the source font.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/snip_5615.jpg"></div><br>
      Don<p></p>
      </div>
