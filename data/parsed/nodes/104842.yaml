      <p>There are similar fonts, commonly labeled as demi or semi serif.<br>
      To make them the designer snips off various serifs, and voila! a new font.<br>
      This one may be a custom snip job. The crossbar on A has joined various serifs in the trashcan.<br>
      Compare the snipped version on the lhs with the one on the rhs, which is probably the source font.<br><img src="/sites/default/files/old-images/snip_5615.jpg"><br>
      Don</p>
