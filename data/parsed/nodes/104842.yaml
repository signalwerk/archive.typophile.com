    <p>Hello everyone,</p>
    <p>I just found this job on Deviant Art and i loved the font used in the title, mainly the roman A, modern, withou the bar... does anyone know similar fonts? not so modern, sofisticated and at the same time with roman traces...</p>
    <p>Thank you very much</p>
