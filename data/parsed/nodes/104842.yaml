    html: |-
      <p>Works for me as a match.<br>
      BTW the contours of Gara looked very familiar.<br>
      I checked and confirmed an exact match with Adobe Garamond LT, regular, except for the snipped parts.<br>
      To confirm, check an unmodified letter such as g, or 5, in Fontshop.<br>
      I suspect that Adobe would see Gara as an infringement. The embedding permissions for Adobe Garamond are "Only printing and previewing of the document is allowed (read-only)."<br>
      Don</p>
