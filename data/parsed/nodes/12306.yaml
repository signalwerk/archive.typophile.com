    <p>You have been requesting a comparative review of Mercury and Farnham in Bald Condensed, and I am happy to announce I will be able to offer twice the fun. <a href="http://www.typography.com/" target="new" rel="nofollow">Hoefler &amp; Frere-Jones</a>' <a href="http://www.typography.com/catalog/mercurydisplay/index.html" target="new" rel="nofollow">Mercury</a> will be compared not only to <a href="http://www.fontbureau.com/people/ChristianSchwartz" target="new" rel="nofollow">Christian Schwartz</a>'s <a href="http://www.fontbureau.com/fonts/Farnham" target="new" rel="nofollow">Farnham</a>, but to <a href="http://www.fontbureau.com/people/MatthewCarter" target="new" rel="nofollow">Matthew Carter</a>'s Fenway -- the type family he designed as a replacement for Times Roman in Sports Illustrated -- and <a href="http://www.dutchtypelibrary.nl/Kaiser.html" target="new" rel="nofollow">Erhard Kaiser's</a> <a href="http://www.dutchtypelibrary.nl/FleischmannDRegular.html" target="new" rel="nofollow">DTL Fleischmann</a> as well. Funny thing is that DTL Fleischmann -- which is the odd one out as it is the most faithful (and quirky) digitisation -- unexpectedly has a new competitor in <a href="http://www.secretonix.pt/ftf/index.html" target="new" rel="nofollow">Mário Feliciano</a>'s as of yet unreleased Eudald. This is a Didone which is based on the work of Eudald Pradell, a Spanish imitator of Fleischmann. So five typefaces in total will contend for the coveted title of <em>Most Totally Awesome Fleischmann Digitisation™</em>.</p>
    <p>Oh, one more thing: I would like to stress that I have no academic background whatsoever, so don't expect any roaring theories nor historical contexts. I review type from a gut feeling and using common sense. So if I get it wrong, please feel free to laugh at my expense. Like, really hard.</p>
