  html: |-
    <p>... as the title suggests, I’m on the search for a italic/oblique that matches FF’s Super Grotesk close enough to look akin. </p>
    <p>FB’s ’Nobel’ is on the plate and looks almost just right - if it wasn’t for the difference in weight. ’Nobel book’ is too light to fit, ’Nobel Regular’ feels almost bold.</p>
    <p>Does anyone know similar typefaces that might come close?</p>
    <p>(top to bottom: SG-faux, Nobel-Book, Nobel-Reg)</p>
