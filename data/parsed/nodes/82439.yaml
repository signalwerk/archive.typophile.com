      <p>In the mid to late 1980s there was a lot of typesetting done by graphic designers who would print type using a laserprinter and then paste it up using wax or Spraymount. I still have fond memories of my nose hairs being glued together with Spraymount residue. There was also a growing amount of digital type available for desktop typesetting.</p>
      <p>By 1992 Quark was the boss and there were plenty more digital fonts being put to use just like those in your sample. From the way the descender of the type awkwardly intersects the ruled line, to the wide letter spacing, to the horizontal compression, to the fonts used, to the boxy composition, everything in that sample looks more like laserprinting from Quark than typesetting from a type house. I can't see a professional photo-typesetter setting U/C and L/C Copperplate the way it's done in that top line. That kind of typography was flourishing in Quark though. In 1992 that work would have been done in Quark, then laserprinted and sent to an offset printer to have them shoot film and run on press.</p>
