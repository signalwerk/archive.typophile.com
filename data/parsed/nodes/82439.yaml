    html: <p>By 1992, desktop publishing had net yet completely replaced typesetting from dedicated phototypesetting machines. I was still setting type on a Compugraphic 8400 system, although less and less so. You might want to see if you can track down copies of Compugraphic, Varityper and Itek/Quadritek type catalogs of the time.</p>
