    html: <p>I can confirm that neither Sylfaen nor Constantia were available in any form prior to 1998 and 2003, respectively, and were not publicly released until February 2000 (Windows 2000) and November 2006 (Windows Vista and Office 2007). Neither design is based on pre-existing types, so any document featuring these designs that purports to be from before these dates is either fraudulent or erroneously dated.</p>
