      <p>This is the information contained in the font files of Sylfaen and Constantia - As hrant has pointed out Bookman goes back way before into photo setting and before.</p>
      <p> Sylfaen was designed for Microsoft in 1998 by John Hudson and W. Ross Mills of Tiro Typeworks, and Geraldine Wade of Monotype Typography. Sylfaen is a Welsh word meaning "foundation"; an apt name since the font stemmed from research into the typographic requirements of many different scripts and languages.<br>
      This version of Sylfaen supports the WGL4.0 character set, for Pan-European language coverage. In addition to Latin, Greek and Cyrillic letterforms, the font contains the characters necessary for support of the Armenian and Georgian languages.</p>
      <p>Constantia is either a registered trademark or a trademark of Microsoft Corporation in the United States and/or other countries. Typeface and data © 2003 Microsoft Corporation.  All Rights Reserved.</p>
      <p>Bookman was issued digitally by Adobe with a copyright date of 1990</p>
