      <p>The question doesn't make sense.<br>
      There is no such thing as "offset lithography typesetters".</p>
      <p>**</p>
      <p><em>In 1992 that work would have been done in Quark, then laserprinted and sent to an offset printer to have them shoot film and run on press.</em></p>
      <p>I was fully digital by then, with film output (Linotronic) from Quark or Illustrator files.<br>
      Direct to plate happened a little later.</p>
