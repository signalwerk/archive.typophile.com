      <p>Here is what Adobe says about it: <a href="http://www.adobe.com/type/topics/opticalsize.html" title="http://www.adobe.com/type/topics/opticalsize.html">http://www.adobe.com/type/topics/opticalsize.html</a> For each font, they provide more precise values. </p>
      <p>For instance for <a href="http://store1.adobe.com/cfusion/store/html/index.cfm?store=OLS-US&amp;event=displayFontPackage&amp;code=1415" rel="nofollow"><strong>Utopia</strong></a>  they write: <cite>Utopia Std family contains faces designed for the following optical sizes: Caption: design size 8.0 points, for use from 6.0 to 8.9 points; Body Text: design size 11.0 points, for use from 8.9 to 13.0 points; Subhead: design size 18.0 points, for use from 13.0 to 20.0 points; Display: design size 72.0 points, for use from 20.0 to 72.0 points</cite></p>
      <p>For <a href="http://store1.adobe.com/cfusion/store/html/index.cfm?store=OLS-US&amp;event=displayFontPackage&amp;code=1740" rel="nofollow"><strong>Arno Pro</strong></a> they say: <cite>Arno Pro family contains faces designed for the following optical sizes: Caption: design size 8.0 points, for use from 5.9 to 8.5 points; SmText: design size 10.0 points, for use from 8.5 to 10.9 points; Body Text: design size 12.0 points, for use from 10.9 to 14.0 points; Subhead: design size 18.0 points, for use from 14.0 to 21.5 points; Display: design size 36.0 points, for use from 21.5 to 72.0 points</cite>.</p>
