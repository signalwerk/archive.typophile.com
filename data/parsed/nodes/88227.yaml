    html: |-
      <p>In general, 'caption' is a design variation created to draw attention to text under a picture or image component in a layout.</p>
      <p>Many times the italic is just too visually different from the roman text (too cursive) so a special font is developed, with a slight angle and some cursive elements, overall, that distinguish the copy from the roman and draw the eyes attention to it. To put it another way, it looks more like a sloped roman font as opposed to a true cursive italic.</p>
      <p>A clever idea. I used it when I developed the new digital version of Fairfield for Linotype-Hell.</p>
      <p>See link:</p>
      <p><a href="http://www.fonts.com/aboutfonts/articles/situationaltypography/captions+part+2.htm" title="http://www.fonts.com/aboutfonts/articles/situationaltypography/captions+part+2.htm">http://www.fonts.com/aboutfonts/articles/situationaltypography/captions+...</a></p>
      <p>Certainly, not a new idea... Matthew Carter used it, I believe, for a typeface he did for National Geographic.</p>
      <p>Anyway...</p>
      <p>And, for 'Display' you could tighten up the spacing between letters for a large display headline. But ideally, you should use a display font specifically created for this purpose. It incorporates, not just tighter inter-letter spacing but slightly lighter stems, hairlines, narrower body proportions, etc. to adjust the color overall to work better with the same font used for body text below it.</p>
      <p>Like the display fonts I developed for Electra. called 'Electra Display'... see link.</p>
      <p><a href="http://www.linotype.com/363/electra-schriftfamilie.html?gclid=CJSlnPu7-qwCFcbd4AodYyp-Tg" title="http://www.linotype.com/363/electra-schriftfamilie.html?gclid=CJSlnPu7-qwCFcbd4AodYyp-Tg">http://www.linotype.com/363/electra-schriftfamilie.html?gclid=CJSlnPu7-q...</a></p>
      <p>I hope this helps.</p>
