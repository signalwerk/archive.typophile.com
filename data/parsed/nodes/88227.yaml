    html: |-
      <p>As I understand it, they are hints towards the size or use they were designed for.</p>
      <p>Foo Caption will likely be tuned for sizes smaller than Foo Text; Foo Subtitle for larger text (say, subheadings) and Foo Display for larger still.</p>
      <p>I think it was Nick Shinn that stated in an older thread that a good typographer could mix and match 'em with abandon to make the text look good. This of course implies that plonkers like me had best stay with the recipe lest we reinvent Tendo Akane's cooking.</p>
