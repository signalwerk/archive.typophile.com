  html: |-
    <p>Is there a short and proper name for font families that contain corresponding Sans and Serif (and sometimes other) designs?</p>
    <p>examples:<br>
    Thesis: TheSans, TheSerif &amp; TheMix<br>
    ITC Stone: Sans, Serif, Informal, Humanist<br>
    Agfa Rotis: Sans, SemiSans, SemiSerif, Serif<br>
    FF Scala: Sans &amp; Serif<br>
    etc...</p>
    <p>I think I've heard them called "meta-families" - but this could easily be confused with FF Meta...<br>
    "Mega families"?<br>
    "Multi families"?<br>
    Suggestions?</p>
    <p>Jacob</p>
