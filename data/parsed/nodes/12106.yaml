    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Foundries" class="freelinking" rel="nofollow">Foundries</a> : P22 Type Foundry</strong></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/images_5256.jpeg"></div><p></p>
    <p>P22 type foundry creates computer typefaces inspired  by Art, History, and sometimes science. P22 is renowned for its work with museums and foundations to ensure the development of accurate historical typefaces that are fully relevant for today's computer user.</p>
    <p>In addition to its in-house font design, P22 now licenses several new type designs from around the world with <a href="/wiki/IHOF" class="freelinking" rel="nofollow">International House of Fonts</a>. P22 grew further with the addition of the <a href="/wiki/Sherwood%20Type%20Collection" class="freelinking" rel="nofollow">Sherwood Type Collection</a>. In late 2004, P22 aquired <a href="/wiki/Lanston%20Type%20Co." class="freelinking" rel="nofollow">Lanston Type Co.</a> And in early 2006 P22 launched the <a href="/wiki/Rimmer%20Type%20Foundry" class="freelinking" rel="nofollow">Rimmer Type Foundry</a>. </p>
    <p>P22 has been involved in a number of other projects including publishing the <a href="/wiki/Indie%20Fonts" class="freelinking" rel="nofollow">Indie Fonts</a> series of books through its <a href="/wiki/P-Type%20Publications" class="freelinking" rel="nofollow">P-Type Publications</a>  division. Finally, we're sure you agree that no type foundry is complete without its own record label, Atom Smash Records.</p>
    <p>Websites:<br>
    <a href="http://www.p22.com" rel="nofollow">P22 type foundry</a><br>
    <a href="http://www.p22.com/ihof/" rel="nofollow">International House of Fonts</a><br>
    <a href="http://www.p22.com/sherwoodtype/fonts.html" rel="nofollow">Sherwood Type Collection</a><br>
    <a href="http://www.p22.com/lanston/" rel="nofollow">Lanston Type Company</a><br>
    <a href="http://www.p22.com/rtf/" rel="nofollow">Rimmer Type Foundry</a><br>
    <a href="http://www.p22.com/indiefonts/" rel="nofollow">P-Type Publications</a><br>
    <a href="http://www.p22.com/records/" rel="nofollow">Atom Smash Records</a></p>
