    <p>Hello, can anybody help with identifying the 'font' used in this logo? I'm redrawing it for a client as part of a refresh/rebrand but I'd like to figure out what the starting point is.</p>
    <p>It seems to be pretty Garamond-esque but there are a couple of things throwing it out... Most notably the 'K' and perhaps the 'R'.</p>
    <p>Thanks in advance for any help you can give me :)</p>
