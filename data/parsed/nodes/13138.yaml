      <p>It seems odd to me that because the words exist we assume there is something behind them.</p>
      <p>That we create without having first worked out a lingual support structure to validate our impulse would be original?  To create after having worked through the problem in internal dialogue is creative?</p>
      <p>I tend to respond to art strongly when I can’t get on top of it through language. This has to do with my personal mental dexterity or lack of. I wouldn't fool myself into believing that my perception has any validity in relation to the object.</p>
      <p>If I hear someone call this or that execution creative or original, this tells me something about the person making the projection, but not much about the object.</p>
      <p>I think Tim is pointing in the right direction when he uses the word process.</p>
