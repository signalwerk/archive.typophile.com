      <p>"That thing that hath been, it is that which shall be; and that which is done is that which shall be done; and there is no new thing under the sun." Eccles. 1:9</p>
      <p>everything is composed of things that already exist. the genius is in how you combine the already exisiting things into something that feels new and fresh and exciting. that's what you did for panoptica, nick. the latin alphabet isn't new. monowidth fonts aren't new. unicase fonts aren't new. the seven genres you chose to apply to these designs aren't new. but when you put them all together you have something that is original and definately creative.</p>
      <p>case in point: i love <a href="/wiki/Storm%20Type%20Foundry" class="freelinking" rel="nofollow">Storm</a>'s work because everything he does has a little bit of his flavor in it. even his revivals are vibrant to me because of this.</p>
