      <p>For me, the problem is that creativity and originality are not something you can consciously attempt to do.  I think you just "do" whatever it is you do (physics, type design, whatever) and if you become immersed in the problem you are attempting to solve in a naive way passing no judgment on your thoughts, that you allow the opportunity for creativity or originality. That does not mean you will succeed, it just means you made success a possibility rather than an impossibility. The worst thing a person can do is set creativity or originality as a goal, even as a priority.  It is better to free yourself from the burden of judgment and allow your thoughts to interact. While you are working, just work.  Allow others to pass judgment later after you are done.  There are plenty around who would rather pass judgment on your work that do work of their own.  If you design something and get value out of the experience of doing it then it does not matter what others may say about it.  This is not the same as sales or business.  You can do mundane stuff that sells well but is not fulfilling to you. You do have to pay the bills after all. Push the envelope to fuel yourself when you can though.  Even though Nick's Panoptica is not a big money maker for him, I will bet he is still glad he designed it.</p>
      <p>ChrisL</p>
