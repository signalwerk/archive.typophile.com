      <p><strong>ORIGINAL</strong><br>
      <em>"You must unlearn all that you have learned."</em><br>
      -- Yoda</p>
      <p><strong>CREATIVE</strong><br>
      <em>"When I'm working on a problem, I never think about beauty. I think only how to solve the problem. But when I have finished, if the solution is not beautiful, I know it is wrong.</em>"<br>
      -- R. Buckminster Fuller</p>
      <p>If we as a community hope to contribute through original and creative solutions, we should use this topic to expand our concept of glyphs and visual language. Communicating visually through glyphs should be the core issue, and not, "How can we make these OLD letters look NEW?". </p>
      <p>Visual language is now ephemeral, like smoke signals or sky writing. It's there, then it's not. If there was ever a time for innovation, creativity and originality in displaying language visually, it's now. And I don't mean producing fonts for digital devices, I mean giving new meaning to glyphs or creating new ones. </p>
      <p>#, * and @ are now part of our daily language, and they were given new meaning by engineers. At one point in the development of writing, "et" became or morphed into "&amp;", and it was a scribe or calligrapher who initiated it, thus giving meaning to a new glyph.</p>
      <p>My point to you all is if we are to be original and creative, we better start moving up the food chain and become part of the decision making team. Otherwise type designers and typographers will still have to clean up the crap produced by others.</p>
      <p>------------------------------------<br>
      Yes, I'm old, but I'll be BAAHK!</p>
