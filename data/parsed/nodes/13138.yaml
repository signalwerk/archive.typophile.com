      <p>Eben -- joking aside, I have for several decades pondered originality and creativity and take it very seriously.</p>
      <p>To me it is not understanding the meaning, that means I am on the outside, an observer.<br>
      For me it is to understand the process, that means I am on the inside, a contributor to the greater whole.</p>
      <p>Therefore, as a process:
      </p><ul>
      <li>To be original is to forget everything you know down to the last cell.</li>
      <p>This is how Bucky Fuller and Albert Einstein gave us what was never known before.</p>
      <li>To be creative is to assimilate, regurgitate, reassimilate, then reassemble.<br>
      This is how Bethoven and Matisse contributed to the collective whole.</li>
      </ul>
      <p></p><p>----------------------------<br>
      Yes, I'm old, but I'm back in style!</p>
