      Shinkichi Takahashi - Triumph of the Sparrow<br>
      A dadaist turned zen monk whose poetry is impenetrable, yet full of meaning.<br>
      Tuvan throat singing<br>
      The sound of harmonics emanating from nomads on the steppes of Asia.</p>
      <p>Now that I'm making a list I feel like an idiot but I could go on and on…</p>
      <p>Original and Creative - are these not ideals that we aspire to? Like love - something that is never completely realized due to the frailty of our constitutions but a dream to send us into the good night. There are concepts that are never achieved on a pure level that are still important to humans as guideposts. I believe that these two words fit into that category.<br>
      peace</p>
