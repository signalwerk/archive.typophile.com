      <p>I finally watched "What the Bleep do We Know" over the weekend, and the movie included a story about Columbus arriving in the New World. The story claimed that the natives couldn't see Columbus' ships; the ships were so far outside the life-experience of the natives they were simply unable to accept them, therefore their brains refused to process the visual input.</p>
      <p>Whether this story is true or not, we've all seen pictures of people in Indonesia staring at the tsunami in disbelief, unable to react because they didn't have a reference for a 10-meter wave hitting the beach without warning on a beautiful day.</p>
      <p>I think a more mild version of this phenomenon happens all the time: if something is too different, a vast majority of people will simply block it out and move on, without consious thought (Douglas Adams made fun of this phenomenon with his "SEP"-invisibility field: make something look impossible, then surround it with a "Someone Else's Problem" field, and people will completely ignore it.)</p>
      <p>As designers, we are constrained by this tendency in people. If we design something too radically different from what has gone before, our clients will reject the design (and rightly so, because the target audience won't accept it, either). So the design has to be mostly ... used, I guess is a good term ... but just a little original so people will notice it.</p>
      <p>(Yes, I am talking about design for commission. Design for the sake of design is art, and a totally different issue.)</p>
      <p>The good news about used design is that people know what it means. If we move from visual to verbal, imagine what would happen if we all started creating "original" words.</p>
      <p>Have a Phlendal Day!</p>
      <p>Jay</p>
      <p>(now I have to go google "phlendal" and make sure it doesn't exist.)</p>
      <p>(Come to think of it, "google" is an interesting example. It was a corruption of "googol", but now means something completly different. Was that originality? Or creative?)</p>
