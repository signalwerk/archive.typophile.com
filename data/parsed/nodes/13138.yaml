      <p>I don't find much call for originality or creativity in typography these days. That's probably the norm, and the new typography of the digital era, pre-Millennium, the exception.</p>
      <p>My more innovative faces don't sell as well as the conservative ones. The"new alphabet" typeface Panoptica is a case in point. This is an original and creative design-- a monowidth unicase alphabet, drawn from scratch, in seven typeface genres -- that enables typographers to do new kinds of typographic layout.</p>
      <p>But as Eben says, is it useful? Apparently not, people seem to be more interested in smooth retro styling. Fonts is a fashion business, as Phil Martin says.  </p>
      <p>We call those who rework other people's typefaces "designers". But there's nothing creative or original in that, so surely it can't be design?</p>
      <p>Norbert's use of the term "thief" is, sadly, typical of the post-modern era, and the way that "recontextualizing" has so much more cred than starting from scratch, with the assumption that all art is theft, but that's OK, because originality isn't possible, or is irrelevant.</p>
      <p>Parker's description of the dynamic model of creativity is the classic explanation by Arthur Koestler, in Act of Creation.</p>
