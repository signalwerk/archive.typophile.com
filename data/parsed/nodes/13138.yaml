      <p>&gt;it took two minutes plus 16 years</p>
      <p>The designer was Paula Scher, keynote speaker at this year's TypeCon.</p>
      <p>The "2 minutes" anecdote is, I regret to inform you, neither creative nor original, and derives from the Ruskin-Whistler libel case of 1878.</p>
      <p>&gt;nothing new under the sun</p>
      <p>There is. It's called an emergent phenomenon.<br>
      <a href="http://en.wikipedia.org/wiki/Emergence" title="http://en.wikipedia.org/wiki/Emergence">http://en.wikipedia.org/wiki/Emergence</a></p>
      <p>Sergej, here's what they mean to me:</p>
      <p>• original - constructed from principle, not imitation or copied forms.<br>
      • creative - emergent </p>
      <p>In design, there is a clear distinction between copying (drawing) something by hand and eye, which makes an original work, and tracing or cut-and-paste, which does not, although it may be creative.</p>
