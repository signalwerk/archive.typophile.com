      <p>I like the new direction this thread is taking - now there is talk about what is important to us instead of the sheer reductionism of the initial post.</p>
      <p>The only reason I gave Norbert any shit before about his witty remarks ( they were witty ) is that I felt that there was a hint of what Nick is talking about in his remarks about “recontextualizing”. I felt like there was a sense in his quotes that all effort towards originality were folly. I see now that that wasn't quite what he meant but that was what I was reacting to. Sure, there is plenty of folly in what we do, but we have to get used to that &amp; keep going anyway.</p>
      <p>Re-reading Nick's post, (Thanks Nick! Sweet post again ) Despite enjoying his ideas in gerenral, I found myself I feeling ambivalent about his complaint re: the current fashion in typeface design. As soon as Nick's Panoptica fonts become fashionable he'll have no reason to lament. And if his ideas, in the form of that font family, are going to gain cultural currency it seems like it would happen as a result of the whim of fashion first &amp; then maybe general acceptance later. </p>
      <p>This is a process that is a wonderful if quite fickle mistress. Sorry about the gender inapproprate anology... Still, this process widens our culture. </p>
      <p>And it is here because of a capitalistic, and often ignorant or naive urge towards novelty. I don't really think it could work any other way. Not if a broad range of type is something you value. Emigre's original early 90's fonts might well not rate too highly if they released their stuff now. Our jaded eyes would move on - fair or no. And I do think it wouyld be unfair. I think we were lucky to have them show up when they did. But fashion/timing/luck has alot to do with their now iconic status.</p>
      <p>On the other hand having a grounding in the art, science &amp; craft of an artistic discipline is what gives art it's depth. I don't think this part is not responsive to capitalism - it requires a comitment from the artist which makes no capitalistic sense whatsoever. </p>
      <p>And I think we need both.</p>
      <p>As far as the debate between Nick &amp; Chris about how Creativity &amp; Originality are to be realized I think it's different for different people. Also, IF it happens to a person at all, the personal experience - and therefore they way they describe it - will be diffrent for diffrerent people too. And it will be much more likeley to happen to somebody who is steeped in the discipline for some time. Then if they choose to say 'the education got in my way' or ' I am buiding on the achievements of my forebearers' or ' I am original' or 'look what I made- neat huh?' will not matter. The work will speak for itself .</p>
      <p>About Parker's commets about the 2 minute design: It puts me in mind of a story I read in Eye magazine years ago about a desiner who was musing about what to do with a client who they had advised to keep the logo they had. After all, he had saved them alot of money,time and kept brand continuity!</p>
    html_clean: |-
