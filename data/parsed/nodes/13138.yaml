      <p>Well, you can create without being original, but can you be original without creating? </p>
      <p>But really, is anything original?  Aren't we, as artistic humans, merely making new combinations of the things we are exposed to with our limited senses?  Was the first airplane original, or was it just a creation of things which already existed (a bird image, wood, an engine.)  </p>
      <p>For that matter, do we create, or do we combine?  Isn't every new "creation" just a new way of combining things that already exist?  Isn't glass just silica combined in a different way?  How about a true creation... a child?  Is a child an original creation, or just a copy of existing DNA, combined in a new way?</p>
      <p>Is life in an original concept, or was it just stolen from somewhere else?</p>
