  - id: 439467
    user: 3135
    date: 2010-11-12T12:38:00
    date_raw: 12 Nov 2010 — 12:38pm
    votes: null
    html: |-
      <p>Most of this is syntax errors in classes.  Sometimes, a glyph may exist in more than the allowed number of classes [one left and one right or else only one both] Be sure you use the inch or straight up ascii apostrophe instead of the curly typographic variety in your classes.<br>
      Also, look for final semicolon and any other duplication which stops FL in its tracks.</p>
