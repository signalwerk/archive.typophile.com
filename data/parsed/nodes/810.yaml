  html: "<p> I've had a few people ask me about Fontzone articles recently, and how they go about contributing, and more importantly getting paid. :-) <br> <br>In each quarter 25% of subscriptions are allocated to contributors. This sum is then divided amongst them according to the length of the article and the number of hits it receives, briefly that means something like: <br> <br>a 300 word article with 10 hits gets the same royalty payment as a 3,000 word article with 1 hit <br> <br>It's a bit more complicated than that, and we'd usually split longer articles into several segments, but that's essentially the model. <br> <br>We're interested in publishing new articles, old articles, pre-published articles... anything that's of interest to the typographic community. <br> <br>We are also of course interested in news articles, and the same payment terms apply. <br> <br>For news tips we give a 50% writing credit and consequently pay 50% of the fees described above. <br> <br>We don't have a system in place for contributors of event infomation - ie there's no payment for this. <br> <br>Also, there's no payment for tips that go on the WebFeed - which is free for use of subscribers and non-subscribers. <br> <br>If you want to know more, just ask. </p>"
