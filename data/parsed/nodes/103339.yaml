      <p>On top the scan from the original book from 1891. The scan below is taken from the 1970 Berthold publication.</p>
      <p>This is the coat of arms of the papermakers. The ox that you see is based on the watermark that was found in a lot of Gutenbergs 42-line bibles (he used different paperstocks because one papermill could not the 'huge' amount of paper he needed for his bibles). The paper with the ox watermark came from an Italian papermill in Caselle, Piedmont (see the picture below).</p>
