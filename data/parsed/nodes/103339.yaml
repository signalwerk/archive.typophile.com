      <p>Dear Té, the book from Ströhl is an Austrian book ...<br>
      Heraldry was ‘invented’ for the battlefield to make sure you kill the right opponent and not one of your own. I think they nowadays say that someone is killed by friendly fire. In the Middle Ages they already thought about that problem. So inevitably Heraldry only was made in countries that in the Middle Ages battled against each other with armies and knights. The painting of these banners was done by predecessors of us (graphic designers). It was done just like we make a logo nowadays. So it is not so strange that their coat of arms (that of the painters) was also dedicated to the graphic designers by Berthold in their facsimile.<br>
      But I can serve you with another book of Ströhl that is even more famous than the book I showed before. The old nobility in Japan had/has also coats of arms and they are as we see them now more modern than the European ones because they make much more use of pictograms and signs. The book is called ‘Japanisches Wappenbuch – Nihon Moncho’ (Japanese Roll of Arms), Ströhl published it in 1906.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/NihonMoncho_S_4834.jpg"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/In_NihonMoncho_S_4795.jpg"></div><p></p>
