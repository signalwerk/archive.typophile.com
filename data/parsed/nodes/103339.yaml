      <p>@James — of course a graphic designer would rarely design a coat of arms, as heraldry is its own discipline, and a highly specialized one at that—but why does that make it ironic? Would bookbinders design a coat of arms? How about <a href="http://nuclearsecrecy.com/blog/2013/01/22/more-nuclear-symbolism/" rel="nofollow">UK nuclear scientists</a>? Having a coat of arms has nothing to do with whether or not you would ever design your own. An achievement of arms, as it is technically termed (including escutcheon, crest and mantling), is also not a graphic, but a symbolic system, which would be reiterated in various forms on everything from stone to engravings to apparel to printed formats.</p>
      <p>@polka — fascinating find! Interesting indeed that in this instance the arms seem to be a sort of guild mark rather than the traditional family purpose.</p>
