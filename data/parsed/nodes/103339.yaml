      <p>I like a good discussion so I don't mind. I think a little different about our heritage and want to preserve it and try to let it be noticed, also and especially by design students. A lot of designers are collectors and so am I. We build upon the shoulders of those who came before us and it is not only what is made but also the discussions between designers that should be noticed.<br>
      But on the other hand. You talk about new stuff made today. What new stuff? I only see styling and almost no design. I think I am also guilty to live in that mainstream. Great thoughts like Bauhaus, DaDa, Swiss Style and so on are not brought to this computer age. I wish I had a brilliant idea to bring typography to the next level ...</p>
      <p>Someone who got on that road in asking himself ‘why should I do this the same as everyone did’ is Pierre di Scuillo.<br>
      Look on <a href="http://www.quiresiste.com/projet.php?id_projet=14&amp;lang=fr&amp;id_gabarit=0" title="http://www.quiresiste.com/projet.php?id_projet=14&amp;lang=fr&amp;id_gabarit=0">http://www.quiresiste.com/projet.php?id_projet=14&amp;lang=fr&amp;id_gabarit=0</a> and you will see that he is really trying to invent new characters that connect more to the spoken language. It is a shame that his commercial typefaces are not as spectacular, but this is what I mean. Not rejecting anything and trying to move forward on what we have.</p>
      <p>By the way, I don't live in the past and I don't think that my interest in nice old stuff implicates that. It is one of the things I do in graphic design ...</p>
