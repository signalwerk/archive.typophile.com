      <p>James, as far as I know designers always are looking for inspiration and mostly they are collectors of numerous stuff. You can say that from Paul Smith for sure (he is one of the worlds biggest collectors of everything he likes). Coming back on the thread about the Calypso from Excoffon I explained how he got to this 3D design of that typeface. I did not mention there that I think that his inspriation also came from the old so-called cartouches that you can see for example in the picture below. This cartouches tried to create also a 3D presentation, just like the coats of arms from Ströhl in the Berthold publication. As you can see in the first specimen of Calypso from 1958 in the book about Excoffon he used also a modernized form of the cartouches on the front of his specimen of Calypso. Maybe he tried to give also a clue how he got the idea for creating this font. The cartouches on the background are from Joh. Vredeman de Vriese (Recueil de Cartouches inventées par Joh. Vredeman de Vriese, published in Brussels, Belgium, G.A. van Trigt, Éditeur, according to the seller it should be dated around 1875).</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Cartouche1_Calypso_S_4965.jpg"></div><p></p>
      <p>Maybe I should link this also to the Calypso thread but I don't know how ...</p>
