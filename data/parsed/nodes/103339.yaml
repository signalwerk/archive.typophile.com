    <p>Last year I was looking for type specimen and related publications of foundries on the internet. I found this nice booklet that was published Christmas 1970 by H. Berthold AG as a present to their customers. It is called ‘Die Wappen der Buchgewerbe’ (Coats of Arms of the Book Trade) and was published in a series of facsimile publications from ‘Schätze aus der Berthold-Bibliothek’ (Treasures from the Berthold-Library). On the cover Englische Schreibschrift set on the Diatype Photocomposer and Akzidenz Grotesk Mager as handset metal type. On the cover also the first known printers' mark from Fust and Schöffer in the Mainz Psalter, printed in 1457. ‘Die Wappen der Buchgewerbe’ was first published in 1891 by the Austrian heraldic painter Hugo Gerard Ströhl and contained nine colored plates with coats of arms.</p>
    <p>On the second picture a spread with one of the seven coats of arms that are shown in the Berthold booklet. This is the coat of arms of the painters, one of the oldest coats of arms. Times where changing and in in the seventies graphic designers began to play a bigger role in book production. So Berthold dedicated this coat of arms also to the graphic designers.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Cover_Berthold_S_5018.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Berthold_Wappen_S_6045.jpg"></div><p></p>
