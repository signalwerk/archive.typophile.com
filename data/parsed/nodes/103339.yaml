    html: |-
      <p>Thomas, I mentioned Dürer and Gutenberg as inventors of printing in the context of Ströhl’s book I am showing. I am in particular referring to the cover illustration and to one of the first pages in this book (that are not numbered). Here it says: ‘ ... dießer beiden ersten Größen auf graphischem Gebiete.’ translated as ‘ ... this two first great people in the graphical world’. They both were seen as inventors in the printing world from the viewpoint of Ströhl and many Germans because Gutenberg made knowledge available to more people than only the elite that could pay for handwritten books. He did that through the invention of his movable type in the western world. What Dürer did was sometimes considered even more important. There was no photography, paintings and other storytelling pictures were mostly available as one original. A lot of people could not read and Dürers drawings that were printed in huge quantities gave the masses visual access to great storytelling drawings. Dürer opened a new world to the people living in that time and we should not confuse it with how we live now with all information that searches us instead of we searching for news and knowledge. Even in the time of Ströhl the printing of pictures was not as easy as it is now and maybe that is why especially in the German speaking part of Europe the work of Dürer had so much importance.</p>
      <p>I for myself describe Gutenberg in my publications always considered to be the inventor of movable metal type in the western world. He is of course not thé inventor of printing because that was done already whit the same presses as you can see in the miniature of Gutenbergs press below. </p>
      <p>If you also want to cover the wood block prints in China, Japan and even the Korean movable metal type that was used in the Jikji in 1377, the discussion goes far beyond what I was trying to tell. But you are right to say that a longer sentence and more explanation would have been better in the text that I placed with the cover of the book from Ströhl. His book deals of course with the coats of arms of the book trade and in that concept of making and selling books his statement is understandable. Dürers role was not a mechanical invention but an communication invention to tell stories and educate people through his drawings.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Gutenberg_Press_S_6357.jpg"></div><br>
      In the box in front of the press the metal type layout or wooden block was laid. With a tampon the surface of the type or wooden block was inked and a sheet of paper was laid on it. The lid of the box was closed and the closed box was pushed under the wooden spindle. The wooden spindle was turned down and pressed upon the lid of the box creating an even pressure on the paper sheet. The wooden spindle was turned up again, the box was pushed back, the lid opened and the printed sheet of paper taken out. With all this actions only one sheet was printed!<p></p>
