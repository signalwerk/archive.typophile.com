      <p>We bought the book from Ströhl with the original coats of arms because we wanted to see if the pictures were better in that publication than in the Berthold one. And they are! No destroying of details because no screening was used at that time. You can see in the details below that the scan above (from the original) has much richer detail than the scan below. Both scanned on Epson V750 Pro. Because the contrast is higher, the result from unsharp masking,  the picture below seems sharp but when you look at the details everything is a bit blurry. There is also a difference in color. The picture on top is more accurate. The Berthold publication had brighter colors. Bit nurdy this post, don't you think? </p>
