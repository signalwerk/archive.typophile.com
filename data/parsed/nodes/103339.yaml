      <p>Hrant, just as you mention heraldry is one of the parts of history in design were we can find inspiration to design new stuff. Every form in a coat of arms has his meaning and therefore it can be of great value when you design a logo, along a lot of other driteria of course. Simply rejecting it is as easy as designing a new car without wheels and engine. Of course we can try that also but looking to the past helps us just because of the fact that other clever minds have thought also about it. You can build upon that knowledge. I think that the Unilever logo can also be seen as a 'talking' coat of arms that comes nearest to the logo's, colors or arms groups where identified with hundredths of years ago. The meaning was the same and maybe we will get a more sofisticated way of making logo's. Nowadays you see even 'logofactories' where you can buy for small money a logo and you only have to paste your name in it. Heraldry developed into a graphic language and I don't use it often but there can always be a moment when you are drawing the next swoosh-like logo for a sports company to reflect and get inspiration.<br>
      By the way, did Excoffon did or did not make the first 'swoosh' for Air France?</p>
