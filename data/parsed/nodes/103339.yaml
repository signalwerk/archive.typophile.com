      <p>Festina Lente (‘more haste, less speed’ or ‘make haste slowly’) is a adage that comes from the classical Greek world. Aldus Manutius, in whose printing shop the common language was Greek, translated this adage into his printers' mark and used it for the first time in a edition of Dante in 1502. The anchor stands emblematic for slow and the dolphin for speed. It is believed that Manutius got inspired for his printers' mark through a Roman silver coin that was given to him by Cardinal Bembo and that had this sign on the reverse side. And so we have reached the typographical link of the typeface now known as Bembo. It is still one of the most used typefaces as you will know. So much that some type designers hate it almost as much as Comic Sans.<br>
      The adage Festina Lente was used als in the work of famous writers like Erasmus, Shakespeare and Goethe. The meaning of it is that everything has to be done with the proper balance between urgency and diligence.<br>
      Just as with the coats of arms of Ströhl a lot of ‘logo's’ of the past have emblemetic connections with history.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Aldus_Mark_6524.jpg"></div><p></p>
