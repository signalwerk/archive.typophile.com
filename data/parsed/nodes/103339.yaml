      <p>Coats of arms and symbolism can also be used in a different way. It is not the one or the other. Getting the coats of arms of the book trade back from the past was for me an example of the graphic language we developed and from which we can still learn.<br>
      Some years ago, before I got interested in the coats of arms I used for our publication, we made a logo for a school that wanted to provide a more protected environment after the more loosely educational concepts that we had in The Netherlands for a couple of decades. The graphic language of a more heraldic logo gave a more disciplined character to the school. It is not made according heraldic rules but gives a modern interpretation of it. You can like it or not but in providing a succesfull solution for a look and feel it fitted well and gave expression to the concept of the school. </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/MavoRGB_def_5112.jpg"></div><p></p>
