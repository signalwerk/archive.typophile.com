      <p>polka, being stuck in the past as it seems you are, I can well understand you not noticing design theory and design practices have evolved. If you find that mining the past is a good life then that's great. For me, on the other hand, I like to see life (in whatever form it takes) evolve and keep evolving.  Of today's design theories (such as Superflat to name but one of the more current) graphic designers, artists, composers etc., have evolved. Not all of course, only the ones that matter.</p>
      <p>I don't reject anything. It is not a matter of taste for me. It is simply a matter of design evolution in practices and in theory. I hate to break it to you polka, but there are actual schools and movements of design/art/music etc.. developing/evolving this very minute. </p>
      <p>Do you really think Calypso typeface could have been thought of and created 500 years ago? In fact forget about the technical means to product the letter shapes. The very nature of Calypso would of been impossible to conceive. Why is that? </p>
      <p>Sorry, I don't have a favorite typeface.</p>
