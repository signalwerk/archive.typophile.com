      <p>&gt; I think they nowadays say that someone is killed by friendly fire.</p>
      <p>The term "friendly fire" dates back about a hundred years, but I heard a general say that it's been a problem in almost every battle in history. </p>
      <p>Some friendly fire accidents are not due to mistaken identity but simply missing the target, such as arrows that get blown off course by the wind, or shells that fall short and land on friendly troops.</p>
      <p>But sometimes it is due to mistaken identity. In some cases poor visibility is a factor, such as when fighting at night or when the battlefield is covered with gunsmoke or fog. But having distinctive clothing and equipment can certainly reduce some of the friendly fire accidents.</p>
