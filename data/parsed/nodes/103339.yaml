      <p>Old-fashened or not, we liked the heraldry of Ströhl. Our cartouche cards were gone after selling 1,000 Dutch Letter Fountains and we wanted another set as give away with the book. So we made a new set of 4 cards with the ‘logo’s’ of the papermakers, the painters (and graphic designers), the type founders and the book printers. Again on Chromolux Pearl to get that little mysterious shift of color. Below you can see the result of the one from the type founders (front and back). We used Akzidenz Grotesk because it was introduced in 1898. But of course before that introduction there was the Steinschrift and the Royal Grotesk from Theinhardt, the one that is said of to be the prototype for the AG when Berthold took over Theinhardt. The work of Ströhl in 1891 was typical nineteenth century and the AG became the most important sans serif of the twentieth century. Simply because it was the mother of all the lookalikes that came after it. So a perfect fit and a lovely contrast ...<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/03VK_Cards_founders_S_6376.jpg"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/03AK_Cards_founders_S_6314.jpg"></div><p></p>
