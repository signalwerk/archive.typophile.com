      <p>But still we had the feeling that we did not had the right material. As you know in 1970 they screened the printed images. By scanning and descreening them the picture is blurred and sharpened and the result is lack of detail. So we went on searching for the original book from 1891 because we thought that the rare full color printing was done without a screen. Here the original book we found eventually. On the cover on the left the coat of arms from Dürer and on the right the one from Gutenberg (Henne Gensfleisch). They both were seen as inventors of printing. Dürer because he printed his drawings (cut in woodblocks) in large quantities and Gutenberg for his printing with metal type.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Strohl_CoverS_4103.jpg"></div><p></p>
