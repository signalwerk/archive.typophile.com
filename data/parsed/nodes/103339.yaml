      <p>Today we received our new and geeky publication of ‘The coats of Arms of the Book Trade’, our own interpretation of the publication of Ströhl from 1891.</p>
      <p>You can look at the YouTube video on <a href="http://www.youtube.com/watch?v=xGpusk2EeKs" title="http://www.youtube.com/watch?v=xGpusk2EeKs">http://www.youtube.com/watch?v=xGpusk2EeKs</a> to check it out.</p>
      <p>We assembled a very limited edition of 250, numbered and signed by me, the author and designer (joep Pohlen). It was quite an organisation to make it. The Cairn Board paperstock was ordered in England, engraved brass plates with a line version of the Gutenberg and Dürer coats of arms took care of the foil printing in two colors, the die-cut was done for the cover, the booklet was singer-sewn and the 6 cards, printed on Chromolux Pearl were put in the pocket. A belly band made from Japanese Washi Yuzen paper, printed in silkscreen by hand with a geometric pattern was laid around the book. After that it was packed in silkpaper and bound with Finnish paper cord (that can be washed up to 40 °C???). Most of this had to be done by hand (my sister Tedje Pohlen took care of the singer sewing, and still is sewing ...).</p>
      <p>Look also on <a href="http://www.fontana.nl/uk_wappens.html" title="http://www.fontana.nl/uk_wappens.html">http://www.fontana.nl/uk_wappens.html</a> for more info or look also on flickr for more pictures: <a href="http://www.flickr.com/photos/96974638@N06/" title="http://www.flickr.com/photos/96974638@N06/">http://www.flickr.com/photos/96974638@N06/</a> (we will add some more detailed pictures as soon as we have managed to do so).</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Folder1_S_4496.jpg"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Folder2_S_4265.jpg"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Folder3_S_5275.jpg"></div><p></p>
