      <p>Give this image to 'WhatTheFont' at 'MyFonts.com' and you'll get a couple close matches.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/MadMen_5758.jpg"></div><p></p>
      <p>AT Triumvirate Condensed Black<br>
      Trade Gothic Bold</p>
      <p>A guess would be something similar to <a href="http://www.identifont.com/find?font=Trade+Gothic+next+heavy+condensed&amp;q=Go" rel="nofollow">Trade Gothic Next Heavy Condensed</a></p>
      <p>In a pinch you could use 'Helvetica Black Condensed'.</p>
