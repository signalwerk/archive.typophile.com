      <p>Hi “Parangon,”</p>
      <p>So, the nice thing about the Adobe EULA is that, unless something has changed since I last checked, it allows modifications for internal use.</p>
      <p>A similarly nice thing from your POV about the Adobe type design process is, most of the typefaces with varying weights were designed using an axis-based approach like Multiple Master or Variations. So the odds are extremely high that you could glue together the light and the regular weights of Adobe Jenson in an axis-based space, and interpolate and get something perfectly usable, because that's pretty much how they were designed in the first place! Maybe a few glyphs would need to be fixed, is all (as Adobe does an auto-clean-up after interpolation, which could damage the interpolability of some glyphs).</p>
      <p>You could even do a custom optical size at the same time, to match your most common point size of body text in your book(s).</p>
      <p>My normal approach would be to create the two axes and find the ideal instance, and export that as a stand-alone font, and then try it. Get a different instance if your tests show you need more or less weight, etc. I have done this a fair number of times in the past. Of course, as CEO of FontLab and former product manager for fonts at Adobe, I am pretty familiar with all the moving parts in this equation, so I know what glitches to look out for.</p>
