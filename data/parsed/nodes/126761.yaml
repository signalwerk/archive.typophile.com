    html: <p>I'm a freelance book designer/layout artist of over 26 years' and 100 books' experience. NEVER fuck around with a typeface's weight yourself. It's prob'ly not okay with the EULA. But it's also not the type designer's vision. Design your own face if you have a better idea. That said, I know what you mean about some typefaces making for a darker page than you'd like. But that's a design issue that you, as the book and page designer are supposed to be able to dope out. I work it out with generous leading, which I tend to favor anyway. I would look at 11/16. If that's way beyond what you've ever used and seems crazy, try 15.5 pt or 15 pt leading. I think I've actually used Adobe Jenson Regular as body text on a book within the last coupla years to good effect. But, again, the generous leading made it work. The Light over the course of 200 or more pages strts to look insubstantial, I think. Of course, this is only my experience and my taste.</p>
