      <p>Hi Parangon, I'm curious whether you're rendering these judgements of the typeface's character by looking at it on a screen or printing it on paper —&nbsp;often a typeface will feel more aggressive or more elegant when it's ink on paper, rather than pixels on a screen. This goes for the type of ink and type of paper, too; cheaper paper creates more ink spread, while in a laser print the ink sort of sits on top of the page.</p>
      <p>I bet it's possible (probable, in fact) that the Tatti Renaissance Library books you admire so much use an out-of-the-box weight of Jenson, but that the particular paper and ink being used make it appear different than it does in whatever medium you're currently looking at it.</p>
      <p>EDIT: Nevermind, just read the design info, which says the books use a custom typeface based on Jenson (not Adobe Jenson, mind you, but rather the historical model of Jenson itself) — curious that it doesn't name the type designer.</p>
