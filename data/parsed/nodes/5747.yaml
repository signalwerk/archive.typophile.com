    html: "<p>David,  <br> <br>Assuming you're running OS X this means that <br> <br>~/Library/Documentation/Help/Help Center <br>(where ~ is your Home directory) <br>is missing. <br> <br>Or if you're launching Help from a specific application it means that that application's help files are missing. Applications Helps files are stored either in the Application bundle itself (not likely to be deleted unless you delete the application) or in  /Library/Documentation/ <br> <br>It's the end of the day so I won't be able to go further than this. I'll check back this weekend. <br> <br>I can't seem to make mine come back either (i tested by moving it to the desktop) Maybe copy the file of another user? <br> <br>Clicking the Home button in Help should take you to the main Help page (it may take a few moments. And go there each time after unless launched from a specific application. <br> <br>If you are running OS 9 it means: <br> <br>1. Make sure the Apple Guide extension is installed in the Extensions folder, or is turned on in the Extensions Manager control panel. <br>2. Make sure the computer has enough memory to load the Apple Guide extension. Even if the Apple Guide extension is installed it may not load if there is not enough memory installed in the computer. This may be the case if you start up the computer from a CD-ROM disc with virtual memory turned off.</p>"
    html_clean: "<p>David,  <br> <br>Assuming you're running OS X this means that <br> <br>~/Library/Documentation/Help/Help Center <br>(where ~ is your Home directory) <br>is missing. <br> <br>Or if you're launching Help from a specific application it means that that application's help files are missing. Applications Helps files are stored either in the Application bundle itself (not likely to be deleted unless you delete the application) or in  /Library/Documentation/ <br> <br>It's the end of the day so I won't be able to go further than this. I'll check back this weekend. <br> <br>I can't seem to make mine come back either (i tested by moving it to the desktop) Maybe copy the file of another user? <br> <br>Clicking the Home button in Help should take you to the main Help page (it may take a few moments. And go there each time after unless launched from a specific application. <br> <br>If you are running OS 9 it means: <br> <br>1. Make sure the Apple Guide extension is installed in the Extensions folder, or is turned on in the Extensions Manager control panel. <br>2. Make sure the computer has enough memory to load the Apple Guide extension. Even if the Apple Guide extension is installed it may not load if there is not enough memory installed in the computer. This may be the case if you start up the computer from a CD-ROM disc with virtual memory turned off.</p>"
