  html: <p>Hi, <br>I hope someone can help, my powerbook G4 has done this before and ive no idea how i fixed it the first time but Mac Help when I open it is just blank, if i try do a search nothing happens. Has anyone ever experienced this and has anyone any idea how i can fix it before im left with a clean install as my only option.  <br> <br>thanks for any help, <br> <br>david.</p>
