  html: <p>Hi everybody, <br> <br>Here's something I made a few years ago, all in one night, just to see if I could do it.  Looks like some of the lines grew rounded caps when I converted this to a .swf, but you get the basic idea. <br> <br>I was thinking of trying out a sort of rounded hexagon theme for the lowercase letters, to make it more like blackletter. <br> <br>You can see it at <a href="http://www.oogby.com/oberto.swf" target="_blank">http://www.oogby.com/oberto.swf</a> <br> <br>Thanks, <br> <br>Brian <br> <br></p>
