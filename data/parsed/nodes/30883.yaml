    html: |-
      <p>It looks to be a useful alternative to a face like Handel Gothic. Some of the upper case glyphs almost look slightly Art Deco-ish (A,B,R especially).<br>
      Other observations/criticisms: Inconsistency in the counters of "a" and "g" compared to the rest of the set (i.e, they only have sharp corners), whereas the others tend to partially follow the outside contour (such as d, n and p). Watch the angle of glyphs like 7 and 4 since they do stand out from their lack of curves. They could be a bit steeper.<br>
      Overall, a good start though :)</p>
      <p>David</p>
