    <p>This font started off as a few glyphs for a logo design. I thought it was interesting enough to flesh out the rest of the design in my spare time... but now I am to the point of pouring it into FontLab and starting the lighter and bolder weights. </p>
    <p>And I am beginning to wonder if it is worth all that work. I like a few of the glyphs a lot (like the "g"). But I am worried that this sort of simplified "machined" style has been done to death... </p>
    <p>Do you think Laconic is worth pursuing? Feel free to hit me hard. That will either convince me to turn my back on the font or finish it up out of pure stubbornness.</p>
