    html: "<p>Be stubborn, Robby, if that's what it takes, but by all means pursue this project to whatever you believe is its logical end. With regard to pangs of \"done to death\" reluctance and such, the simplest answer may be, \"So what?\" Once finished, your take on this \"style\" (if indeed style it is) could well bridge a gap among similar but unequal niches, and could well be the typeface that designers point to and say, \"There — now <em>that's</em> the ticket!\" In short, my humbly proffered advice is: carry on ... and please bring us back some updates as your project progresses.</p>"
