    html: |-
      <p>While I voted Mac, I do use a Fujitsu Stylistic quite a bit, ’cause I got _very_ tired of having to haul around a graphics tablet to use with my ThinkPad ages ago, and am not willing to do that w/ my wife’s PowerBook.</p>
      <p>Interface and usage-wise, Mac OS X has some nice advantages (Services, Sidebar, Miller-column filebrowser) which I miss when using my Stylistic, but the enhanced portability and ease of drawing make up for it. I really wish that Apple would make a pen computer so that one wouldn’t have to resort to third-party hacks like the Axion ModBook.</p>
      <p>If the question comes down to doing actual “design”, then the big winner would be graph paper and a #2 pencil or my fountain pens (I usually carry either a Sheaffer Agio w/ 0.8mm italic nib ground for me by the nib meister of <a href="http://www.pendemonium.com" title="www.pendemonium.com">www.pendemonium.com</a> or an Esterbrook LJ w/ a 9312 medium italic nib) —- it’s production which gets done on the computer, though I have done roughs and tight comps on pen computers ranging from my Newton MessagePad through an NCR-3125 up to my Stylistic (I usually use ArtRage for that, though sometimes I’ll use FutureWave’s SmartSketch).</p>
      <p>William</p>
