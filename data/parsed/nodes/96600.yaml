      <p>Arnold Pannartz and Konrad Sweinheim, who introduced typography to Italy.<br>
      Mainz, the birthplace of printing, where they worked, had become a war zone in 1462, causing a diaspora of printers. Three years later they published the ﬁrst printed book in Italy. Who knows what hardships they faced during those three years?<br>
      Quite apart from getting their gear across the Alps (or rebuilding it from scratch), they had to change the look of type to suit their new clientelle.<br>
      While Gutenberg had been a technical pioneer, he mimicked the scribes.<br>
      Sweynheim &amp; Pannartz made the ﬁrst humanist/Roman typefaces, not just copying the local writing style in Italy, but creating a new hybrid form for the new medium that, reﬁned by Jenson shortly afterwards, became the model we use to this day.<br>
      Here are S&amp;P’s types of 1465 and 1467, showing the change they made.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/SandP_4803.png"></div><p></p>
