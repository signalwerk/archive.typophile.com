      <p>No one took more gorgeously played out risks than Novarese.<br>
      No one spoke with more authenticity than Morris Fuller Benton.<br>
      No one had a bigger hand in the feel of today's world than Excoffon<br>
      Hubert Jocham's sans' will be like what Shakespeare was to English,<br>
      or perhaps more aptly, what Martin Luther was to German.</p>
