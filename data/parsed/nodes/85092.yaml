    <p>Well, I have lurked on these forums for quite awhile, researching the fonts that I need and admiring the knowledge of so many. Since I need some expert help, I decided to </p>
    <p>I am a particular fan of John Baskerville's font. I prefer the original Baskerville font over other variants, such as Fry's Baskerville and Mrs. Eaves. There is something about the Q glyph, for me, that is just beautiful.</p>
    <p>I also have absolutely no qualms about paying for a modern re-creation of Baskerville. There are tons of options out there, though I am particularly fond of ITC New Baskerville Cyrillic (though it is a bit thin...it's still very good). I haven't dropped the $ for New Baskerville FS (by the FontSite foundry)...but it looks to be a very well done version of the original Baskerville.</p>
    <p>I am working on a role playing game ruleset that I intend to publish for free digital download. I want to maintain minor control over the layout and typography of published works that utilize this ruleset (since the rules will be open and I encourage writers to create their own adventures that are compatible with the ruleset). Since it is my desire that published works follow a standardized template, I need a set of fonts that can be distributed openly. I have found several which can be used for headings and such, however, the font that I would like to use for the main text is Baskerville.</p>
    <p>I have searched high and low, and I cannot find a version of the Baskerville font that is free (aside from OpenBaskerville...which isn't complete).</p>
    <p>So, I am looking for an alternative to Baskerville that is can be distributed and use with little to no restrictions.</p>
    <p>I have already looked at Gentium, which I really like, but it's not Baskerville ;) I have also looked at Day Roman...but I didn't find an italic version of it. I have also found SerifBeta (by the Betatype foundry...i.e. Christian Robertson's fonts). I really like SerifBeta, however it is still in "beta" format and I am not sure it will be free when Christian finishes it.</p>
    <p>The font must be a Serif font, it must also have an italic version (not oblique). I would also prefer to have a bold (with corresponding italic), but it isn't a requirement. It also must be free for commercial use. </p>
    <p>So, font experts, what are my options?</p>
    <p>Thanks in advance for your recommendations!!!</p>
