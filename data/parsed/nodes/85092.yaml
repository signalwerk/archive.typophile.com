    html: |-
      <p>It looks like I was able to fix the problem.</p>
      <p>I opened each font in Fontforge, then I opened the OS/2 attributes (Element -&gt; Font Info -&gt; OS/2). Under the "Metrics" Tab for each font, I enabled the check box titled "Really use Typo metrics", which is an additional bit that MS looks for. Under the "Panose" Tab, I changed various parameters to be more in line with the <a class="freelinking external" href="http://books.google.com/books?id=qrElYgVLDwYC&amp;printsec=frontcover#v=onepage&amp;q&amp;f=false" rel="nofollow">information I discovered in Yannis Haralambous and P. Scott Horne's book, Fonts &amp; Encodings</a>.</p>
      <p>Once this was done, I simply re-generated the fonts and then installed them. I also incremented the version number to 1.021 (because it took me several tries to get it right...and I wanted to make sure Windows was showing the latest version).</p>
      <p><a class="freelinking external" href="http://sns.jeffandeden.com/Baskervald1.021.zip" rel="nofollow">Here's a link to the fixed files.</a></p>
      <p>I have emailed a copy of what I have done to the original author (we have been exchanging emails). FontForge didn't like the DSIG tables encountered in the original OTF files, and some information/data may have been removed. Hirwen will probably generate his own fixed version of the font (which I would prefer anyway).</p>
    html_clean: |-
