    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 10.Jan.2006 1.25pm </div>
      <p>————————————————————-<br>
    Happy New Year!</p>
    <p>The Process Type Foundry is pleased to announce the release of Bryant 2, Bryant Pro, Bryant Condensed and Bryant Compressed.</p>
    <p>What started out as a simple tune-up of Bryant (released in 2002)  blossomed/exploded into a full scale re-drawing and expansion. Four  weights with alternates turned into four weights with alternates,  alternate-alternates, italics, small caps, multiple numeral styles,  extended language support and two completely new widths: Condensed  and Compressed. In addition to the expansion, each glyph of Bryant  was redrawn to improve what needed improving while retaining its key  qualities: a san serif with open, geometric forms and rounded tips.</p>
    <p>Try out any of the new Bryants with our Test Typer or view the PDF  Specimens:</p>
    <p>Bryant 2 and Pro<br>
    <a href="http://www.processtypefoundry.com/typefaces/bryant2/" title="http://www.processtypefoundry.com/typefaces/bryant2/">http://www.processtypefoundry.com/typefaces/bryant2/</a></p>
    <p>Bryant Condensed<br>
    <a href="http://www.processtypefoundry.com/typefaces/bryantcon/" title="http://www.processtypefoundry.com/typefaces/bryantcon/">http://www.processtypefoundry.com/typefaces/bryantcon/</a></p>
    <p>Bryant Compressed<br>
    <a href="http://www.processtypefoundry.com/typefaces/bryantcom/" title="http://www.processtypefoundry.com/typefaces/bryantcom/">http://www.processtypefoundry.com/typefaces/bryantcom/</a></p>
    <p>————————————————————-<br>
    Upgrading From Bryant to Bryant 2<br>
    ————————————————————-<br>
    If you previously purchased Bryant through us and would like to  purchase the new Bryant (now called Bryant 2 or Pro), there are  several options for upgrading at significantly reduced prices:</p>
    <p>1.) Purchase the same weight or style configuration for a small  upgrade price.</p>
    <p>2.) Or, purchase additional weights or styles in conjunction with the  upgrade of the original purchase.</p>
    <p>For a full explanation of upgrade options and pricing visit:<br>
    <a href="http://www.processtypefoundry.com/typefaces/bryant2/upgrade.html" title="http://www.processtypefoundry.com/typefaces/bryant2/upgrade.html">http://www.processtypefoundry.com/typefaces/bryant2/upgrade.html</a></p>
    <p>————————————————————-<br>
    Maple - Now 20% off!<br>
    ————————————————————-</p>
    <p>Maple, released the first half of 2005, was recently named by  Typographic as one of their favorite fonts of the year (http:// typographi.com/001045.php).</p>
    <p>To celebrate, we’re offering Maple at a 20% discount for one month.  If you’re in the mood for an irregular grotesque taking inspiration  from 19th and early 20th centuries models, this is your month.</p>
    <p>More about Maple:<br>
    <a href="http://www.processtypefoundry.com/typefaces/maple/index.html" title="http://www.processtypefoundry.com/typefaces/maple/index.html">http://www.processtypefoundry.com/typefaces/maple/index.html</a></p>
    <p>Warmest Regards,</p>
    <p>Eric, Nicole and Charlie<br>
    Process Type Foundry<br>
    <a href="http://www.processtypefoundry.com" title="http://www.processtypefoundry.com">http://www.processtypefoundry.com</a></p>
