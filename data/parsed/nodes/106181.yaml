    html: |-
      <p>I don't know perl but here are some relevant remarks. According to perldoc, <code>readpipe</code> collects the standard output (which is  <code>stdout</code>) whereas FontForge warning messages are written to <code>stderr</code>. If you call <code>psname.pl</code> the following script</p>
      <pre>my $font = $ARGV[0] ;
      my $psfontname = 
         readpipe("/opt/local/bin/fontforge -script psname.pe " 
                     . $font) ;
      print  $psfontname  ;
      </pre><p>then the call</p>
      <pre>perl psname.pl ArnoPro-Regular.otf &gt; savename
      </pre><p>sends only the postscript name into the file <code>savename</code>. If you want to see only the standard output and no warning message, you can type</p>
      <pre>perl psname.pl ArnoPro-Regular.otf 2&gt;/dev/null
      </pre><p>You could also redirect <code>stderr</code> inside the perl script</p>
      <pre>my $font = $ARGV[0] ;
      my $psfontname = 
         readpipe("/opt/local/bin/fontforge -script psname.pe " 
                     . $font . 
                     " 2&gt;/dev/null") ;
      print  $psfontname  ;
      </pre><p>where <code>2&gt;/dev/null</code> redirects <code>stderr</code> to <code>/dev/null</code>.</p>
      <p>Instead of sending the messages to the garbage can, you could append them to a log file with <code>2&gt;&gt;file.log</code>.</p>
