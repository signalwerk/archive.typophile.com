  html: |-
    <p>I am using Perl (readpipe) to grab the fontname value from a font via Fontforge. For example:</p>
    <p><code>my $psfontname = readpipe("/usr/local/bin/fontforge -script /webfont/getfontname.pe font.ttf");</code></p>
    <p>The problem is, Fontforge always outputs all the warnings when it loads a font, so I end up with a multiline output of values I do not want. Anyone know how to disable Fontforge doing that on file open? I am using is via command line only. </p>
    <p>Example warnings:<br>
    <code>Warning: Mac and Windows entries in the 'name' table differ for the<br>
    Family string in the language English (US)</code></p>
