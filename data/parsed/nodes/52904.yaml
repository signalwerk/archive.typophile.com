    <p>I know there have been a few posts about type for wedding materials, such as invitations, but I'm looking for suggestions for type for a wedding certificate.</p>
    <p>Some examples are here (these are just examples for the purpose of this post):</p>
    <p><a href="http://www.documentsanddesigns.com/galleries/DIRECTORY_Quaker_Wedding_Certificates_Page_1.htm" rel="nofollow">http://www.documentsanddesigns.com/galleries/DIRECTORY_Quaker_Wedding_Certificates_Page_1.htm</a></p>
    <p>There's a couple of constraints: script is to be avoided, and sans type is preferred (although serif is ok). Relatively low cost or free type is a plus. </p>
    <p>Note that the certificates usually include multiple types, usually one for the body and another for the names or initial lettering.</p>
