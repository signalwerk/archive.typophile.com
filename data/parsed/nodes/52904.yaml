    html: |-
      <p>Well, definitely formal. Modern as well, although classical stylistic elements aren't all bad. </p>
      <p>I'm looking to create a clean, sort of minimalist design that is formal without being too stiff or aloof, if that makes any sense.  </p>
      <p>Ideally, the text itself would form the focus of the design, which places a premium on the type. </p>
      <p>Not too bold--more restrained or modest, although that could vary a bit.</p>
