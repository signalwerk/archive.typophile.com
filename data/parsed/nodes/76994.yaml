    <p>I love the way figure "2" curves in <a class="freelinking external" href="http://www.fontshop.com/fonts/singles/fontfont/ff_typestar_ot_black/" rel="nofollow">Typestar</a>:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/012-typestar_5545.png"></div><p></p>
    <p>Now I'm curious about what other typefaces have a similar "2".<br>
    I came up with OCR-B and Conduit.</p>
    <p>Can someone think of some more?<br>
    Thanks!<br>
    /Mårten</p>
