  html: |-
    <p>Hi guys:</p>
    <p>I just noticed something really annoying. Open any non-adobe application- like Text Edit or Pages. Type some text with numbers set in Didot regular. Highlight it. Press command-T for the font panel then open the typography panel.</p>
    <p>The typography panel showns some options including OSF figures but when you click on the buttom to make that happpen- NOTHING!</p>
    <p>I thought maybe my Didot font became corrupt so I went to an Apple store to verify the OSF figures working, but then on these NEW machines they also did not work.</p>
    <p>I checked FontBook and the Special Character utilites. I see the OSF figures there but... they don't work or I'm not allowed to access them. </p>
    <p>I ask somebody at the help desk... the guys says that's probably an Apple corporate decision!!! </p>
    <p>Very Annoying indeed! Its like buying a car with a radio installed that does not play the AM band even though the hardware is there.</p>
    <p>I don't own any Adobe apps... just curious can you guys access the OSF figures in InDesign?</p>
    <p>All my best,</p>
    <p>Mikey</p>
