    html: |-
      <p>I suspect the Didot font (Didot.dfont) uses <a href="http://en.wikipedia.org/wiki/Apple_Advanced_Typography" rel="nofollow">AAT</a> tables and not OpenType tables, that's why OsF are not accessible in InDesign.</p>
      <p>But I agree this doesn't explain why the font doesn't work correctly in TextEdit. It ought to.<br>
      Small caps work, so I'd say the font has a bug.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/didot_macosx_4759.png"></div><p></p>
