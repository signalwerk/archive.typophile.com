    html: |-
      <p>If you were on an old-fashion typewriter (manual or electric) and you needed to type a 1-M dash for your manuscript -- you did not have an M-dash to use. So it became common practice for the typist to use two hyphens to show the extreme pause.</p>
      <p>However, when this same document made it the "professional" typeshop, it was automatically changed to the 1-M dash it was meant to be.</p>
      <p>Hope that clears things up a bit.</p>
      <p>Also, don't forget one line under a word or sentence was for emphasis - the typewriter could do that fine...but they didn't have the italic counterpart that the "professional" used.</p>
      <p>There are lots of instances from typewriter to typesetting we can go through just like this.</p>
