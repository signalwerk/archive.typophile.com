    date: 2007-01-09T08:18:00
    date_raw: 9 Jan 2007 — 8:18am
    votes: null
    html: <p>To be fair, the em and en dashes are typographic luxuries, and not everybody is aware that they have more characters available to them than what is immediately aparrent on the keyboard. A double hyphen is acceptable when all you have is a typewriter, and somewhat forgivable when using a monospace font as one often does for email, but an em dash should be substituted when it becomes available.</p>
