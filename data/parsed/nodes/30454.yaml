      <p>&gt; the HTML for an en (&amp;ndash) or em (&amp;mdash) dash</p>
      <p>Just a point for reference. Both the entities mentioned above need a semicolon at the end. An entity without the semicolon works in IE, and perhaps in other browsers, but is incorrect and may not work correctly in all cases. An entity is defined as starting with the ampersand and ending with a semicolon.</p>
    html_clean: |-
