      <p>I'm seeing "Vintage Hat Shop", or a slightly odd arrangement of a bikini top &amp; bottom!</p>
      <p>I prefer the second version type, but you might need to rethink the red &amp; white. I'm presuming the name is B Love, and I think that works better with the b in red, however it gets a bit lost from a distance. Also, if others designers are going to be using the logo, for example on a poster with a few different artist's logos, they aren't necessarily going to be able to use two colours it so it will end up as blove.</p>
