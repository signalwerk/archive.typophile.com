    <p></p><div class="imageWrap"><img src="/files/IdentityCrisis-Photo_5930.JPG"></div><p></p>
    <p><a href="http://www.amazon.com/dp/1581809395?tag=jefffisherlog-20&amp;camp=14573&amp;creative=327641&amp;linkCode=as1&amp;creativeASIN=1581809395&amp;adid=1X9H84B8WX0VFEQ5C9MW&amp;">Identity Crisis! 50 Redesigns That Transformed Stale Identities Into Successful Brands</a>, the new book from Jeff Fisher, the Engineer of Creative Identity for the Portland-based design firm Jeff Fisher LogoMotives, has been released by publisher HOW Books, an imprint of F+W Publications, Inc.  The book is currently available from all major online booksellers and will soon be on bookstore shelves internationally.</p>
    <p>Identity Crisis! takes a fresh look at 50 before and after case studies, from designers and firms from around the world, by exploring the process of redesigning existing identities to help businesses refine their image, communicate with customers, and find success.  Designers seeking inspiration - and any business considering a graphic makeover - will be presented an inside look at the challenges of redesigning identities and visual examples of creative and strategic thinking in achieving the desired results.</p>
    <p>Jack Anderson, of the Seattle firm Hornall Anderson Design Works wrote the foreward for Identity Crisis!  “Words of Wisdom,” throughout the book, were provided by Sean Adams/AdamsMorika, Inc, Bob Domenz/Avenue, Tony Spaeth/Identityworks, Debbie Millman/Sterling Brands, Jack Yan/Jack Yan &amp; Associates, design educator and author Robin Landa, Robynne Raye/Modern Dog Design Co., Mark E. Sackett/Reflectur, and the author.</p>
    <p>Case studies presented in the volume include projects from the following firms: 3 Dogz Creative Inc. (Toronto, ONT, Canada), Advertising By Design (Clermont, FL USA), angryporcupine*design (Park City, UT USA), Avenue (Chicago, IL USA), b-design (San Diego, CA USA), biz-R (Totnes, Devon, UK), Brainforest, Inc. (Chicago, IL USA), Breathewords (Caldas da Rainha, Portugal), CC Graphic Design (Salt Lake City, UT USA), Common Sense Design (New Hamburg, ONT Canada), Connacher Design (Stamford, CT USA), Finamore Design (Brooklyn, NY USA), Fullblast, Inc. (Portland, OR USA), Glitschka Studios (Salem, OR USA), Graphicwise, Inc. (Irvine, CA USA), Hornall Anderson Design Works (Seattle, WA USA), and Identityworks (Rye, NY USA).</p>
    <p>Other firms represented include: Jeff Fisher LogoMotives (Portland, OR USA), John Silver Design Bothell, WA (USA), MasonBaronet (Dallas, TX USA), Mayhem Studios (Los Angeles, CA USA), Modern Dog Design Co. (Seattle, WA USA), MyBrand (Lisbon, Portugal), nHarmony, Inc. (Muncie, IN USA), Octavo Designs (Frederick, MD USA), Paragon Integrated Marketing Communications (Salmiya, Kuwait), RDQ - Rdqlus Design Quantum (Omaha, NE USA), Round2 Communications - R2i (Baltimore, MD USA), Sayles Graphic Design (Des Moines, IA USA), Shapiro Design Associates Inc. (Irvington, NY USA), Shine Advertising Co. (Madison, WI USA), Sockeye Creative (Portland, OR USA), Studio GT&amp;P (Foligno, PG Italy), Subplot Design Inc. (Vancouver, BC Canada), and Willoughby Design Group (Kansas City, MO USA)</p>
    <p>Title: Identity Crisis! 50 Redesigns That Transformed Stale Identities Into Successful Brands<br>
    Hardbound: 216 pages<br>
    Publisher: HOW Books, an imprint of F+W Publications<br>
    Release: September 2007<br>
    ISBN: 1581809395<br>
    Price: $35.00</p>
    <p>For more information, visit the <a href="http://www.identitycrisisbook.blogspot.com">Identity Crisis! blog</a>. A downloadable PDF file of some teaser spreads is also available from the publisher at <a href="http://www.howdesign.com/blog/Identity+Crisis.aspx">HOW Blog</a>.</p>
    <p>Jeff Fisher has received nearly 575 regional, national and international graphic design awards for his logo and corporate identity efforts. His work is featured in <a href="http://jefffisherlogomotives.blogspot.com/2007/09/jeff-fisher-logomotives-in-published.html">nearly 100 books</a> on the design of logos, the business of graphic design, design education, and small business marketing. In addition, Fisher also writes for CreativeLatitude.com, HOW Magazine and other design resources; and speaks about the design profession to high school classes, college students, and at international design industry events.</p>
    <p>Fisher is a member of the HOW Magazine Editorial Advisory Board, the HOW Design Conference Advisory Council and the UCDA Designer Magazine Editorial Advisory Board. His first book, <a href="http://www.amazon.com/Savvy-Designers-Guide-Success-Tactics/dp/1581804806/ref=sr_1_1/102-7407722-0738518?ie=UTF8&amp;s=books&amp;qid=1190654690&amp;sr=1-1">The Savvy Designer’s Guide to Success</a>, was released by HOW Design Books in late 2004.</p>
    <p>(* If I don’t “toot!” my own horn, no one else will.)</p>
