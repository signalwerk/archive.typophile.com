      <p><em>...my Dcaron or Aogonek much better than typical variation and i think it is useful.</em></p>
      <p>They are incorrect.</p>
      <p>The comparison with scedilla is not valid.</p>
      <p>It might be possible to compare the dcaron to the scedilla situation, but only with regards to a choice between the "apostrophe" form of the accent and the "acute" form. Using the v-shaped caron centred above the letter is not an option.</p>
