      <p>Nice!<br>
      I like the way you have expanded the family styles, but in a single weight and scaling.<br>
      The charming letter proportions strike a nice balance between slick contemporary type (e.g. tail on l) and slightly vernacular retro lettering.</p>
      <p>The ogonek should probably be connected, and definitely to the right stroke of the "a", not centred. And the slash on l-slash angled.</p>
