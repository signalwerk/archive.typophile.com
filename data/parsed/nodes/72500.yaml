    <p></p><div class="imageWrap"><img src="http://typophile.com/files/001_5822.png"></div><div class="imageWrap"><img src="http://typophile.com/files/002_6302.png"></div><div class="imageWrap"><img src="http://typophile.com/files/003_5528.png"></div><br>
    There are 6 billion people live in the world and thousands of different languages! We are not ready for all of them yet but we are happy to announce Public Gothic Typeface Family is now available in 42 new languages!<br>
    The updated Family is available at <a class="freelinking external" href="http://www.antreposhop.com/product/public-gothic-font-family" rel="nofollow">AntrepoShop.com</a> and We are strongly recommending to all of our users to use Public Gothic Family Update R 1.01. We are giving this update to all our licensed owners for free and have already sent an email for this update to all of our licensed users. But If you are a licensed owner and have not received anything from us, please contact our sales department! <p></p>
    <p><strong>What's included?</strong></p>
    <ul>
    <li>New lowercase letters! <a class="freelinking external" href="http://www.antreposhop.com/product/public-gothic-little" rel="nofollow">(optional)</a></li>
    <li>New Vintage and Federal style with unique character structure.</li>
    <li>Full latin-based characters completed.</li>
    <li>Central and Eastern European language support.</li>
    <li>New figures, currency &amp; related forms.</li>
    <li> Improved structure for some glyph.</li>
    <li>Better kerning!</li>
    </ul>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/004_5182.png"></div><div class="imageWrap"><img src="http://typophile.com/files/005_6455.png"></div><div class="imageWrap"><img src="http://typophile.com/files/006_4654.png"></div><div class="imageWrap"><img src="http://typophile.com/files/007_4394.png"></div><div class="imageWrap"><img src="http://typophile.com/files/008_6348.png"></div><div class="imageWrap"><img src="http://typophile.com/files/009_4890.png"></div><div class="imageWrap"><img src="http://typophile.com/files/010_3683.png"></div><p></p>
    <p><strong>Full Character Maps</strong></p>
    <ul>
    <li> <a class="freelinking external" href="http://www.antrepo4.com/Square.htm" rel="nofollow">Public Gothic Square Full Character Map</a></li>
    <li> <a class="freelinking external" href="http://www.antrepo4.com/Little.htm" rel="nofollow">Public Gothic Little Full Character Map </a></li>
    <li> <a class="freelinking external" href="http://www.antrepo4.com/circular.htm" rel="nofollow">Public Gothic Circular Full Character Map</a></li>
    </ul>
    <p><strong>What is next?</strong></p>
    <ul>
    <li>Cyrillic and Greek characters</li>
    <li>Compressed variations</li>
    <li>Thinner variations</li>
    </ul>
    <p><strong>Additional Information</strong><br>
    Free beta version of Public Gothic Typeface has been downloaded more then 100.000 times! 319 Glyphs in this updated version. (it was 109 in the first version) </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/New_4027.png"></div><p></p>
