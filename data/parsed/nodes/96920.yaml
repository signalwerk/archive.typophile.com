      <p>That's called blackletter - specifically the textura style. There are a large number of fonts in that style, the classiest/fanciest of which might be this:<br>
      <a href="http://www.myfonts.com/fonts/linotype/wilhelm-klingspor-gotisch/" title="http://www.myfonts.com/fonts/linotype/wilhelm-klingspor-gotisch/">http://www.myfonts.com/fonts/linotype/wilhelm-klingspor-gotisch/</a></p>
      <p>One word of warning: any font with such intricate details requires a very good tattoo artist otherwise the results will be a permanent blemish on your existence!  :-)</p>
      <p>See also this:<br>
      <a href="http://www.flickr.com/photos/zara/480154570" title="http://www.flickr.com/photos/zara/480154570">http://www.flickr.com/photos/zara/480154570</a></p>
      <p>hhp</p>
