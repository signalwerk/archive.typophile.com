    html: |-
      <p>People regularly post on Typophile.com, attaching samples of letterforms they'd like to use for a tattoo, and asking for help with the name of the font. I don't quite understand the question.</p>
      <p>I don't have any tattoos, but if I wanted one, I would find a tattoo artist who was an expert at lettering, and then I'd show him/her the sample and say "Please match this style of lettering." The tattoo artist isn't going to stick my butt in an inkjet printer, so why would he/she need to know the name of the font?</p>
