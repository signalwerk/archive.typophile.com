  html: <p>I work as a technical writer at a security firm. One of the documents our firm uses in all government contracts is called PVT Procedures. This document contains test procedures that our installation technicians use during equipment testing events. Whoever designed said document was more familiar with the equipment concerned than they were with principles of typography and document formatting. I am now redesigning the PVT Procedures layout and so seek directive input from you all regarding what I've done so far. I've attempted to attach sample before and after images. Hopefully you will be able to tell which is which. Note that I'm limited to working with MS Word on all documents.<br><img src="/sites/default/files/old-images/PVT v1_5341.png"><br><img src="/sites/default/files/old-images/PVT v2_4630.png"></p>
  html_clean: <p>I work as a technical writer at a security firm. One of the documents our firm uses in all government contracts is called PVT Procedures. This document contains test procedures that our installation technicians use during equipment testing events. Whoever designed said document was more familiar with the equipment concerned than they were with principles of typography and document formatting. I am now redesigning the PVT Procedures layout and so seek directive input from you all regarding what I've done so far. I've attempted to attach sample before and after images. Hopefully you will be able to tell which is which. Note that I'm limited to working with MS Word on all documents.<br><img src="/sites/default/files/old-images/PVT v1_5341.png"><br><img src="/sites/default/files/old-images/PVT v2_4630.png"></p>
