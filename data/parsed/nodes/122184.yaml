      <p>5.1 Card Reader Tamper Test<br>
      These things go together, so put them together. Eliminate the unexplainable space. If these two things are together, the reader's eye will be drawn to Card Reader Test, which is what you want. Putting Card Reader Test in the event column serves no purpose.</p>
      <p>I would consider putting Event and Expected Results beneath 5.1 Car reader Tamper Test. The Event and Expected Results are part of the Tamper Test, not floating above it. Then you could put Event even with the event column just as Expected Result is (already) even with the expected result column. Then rename Event with something more clear, like Tester's Actions.</p>
      <p>Real time communications.....<br>
      What does this mean? Shouting? Each person has a cell phone? What?</p>
      <p>Miscellaneous hand tools.....<br>
      So the first writer had no clue either. Can you reference something here?</p>
      <p>In the Expected Results Column, The system should not allow...<br>
      What does this mean? What is actually supposed to happen?</p>
      <p>Something that jumps out at me overall is the stilted, third person style. Most instruction is now written in an informal second person style. For instance: "Real time communication with the operator should be established." Now writer's would tend to say: "You must be able to talk to the operator during the test, such as with a phone line..."  Maybe that's beyond the scope of this project.</p>
      <p>All of this is just my opinion.</p>
