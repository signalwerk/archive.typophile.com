    html: |-
      <p>I would do something similar as well.</p>
      <p>5.1 Card Reader Tamper Test</p>
      <p>    Actions        Expected results<br>
      -----------------------------------<br>
          Action 1       Result 1</p>
      <p>    Action 2       Result 2</p>
      <p>As long as the installation techs know and understand the jargon, second v third person is hardly vital.</p>
      <p>By the way, what is supposed to happen in the first case is that the system must not/never ignore the tamper switch tripping. To ‘mask’ something is to cause it to be ignored.</p>
      <p>Real-time communications… Whatever it takes, man. Shouting may do at one site, but the next may well require a mobile phone or a walkie/talkie. Some things just can not be nailed fast. Same with the handtools. They depend on the hardware the switch is fixed to the case with.</p>
      <p>Aside: I would change the Initial Conditions from “should” to “must” as the test requires tech and op to be in contact, right?</p>
