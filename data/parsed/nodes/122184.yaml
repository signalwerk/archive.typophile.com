    html: <p>I'd designed "event" and "expected results" as floating headings to try to streamline. Because there are often several test sections (5.1, 5.2...) within a test, one floating heading can take the place of four or five fixed headings. I'll move the headings in with the test sections, though, and see how the two formats compare. Thanks to J. for pointing out that inexplicable space, and Te, you're right about "not allow mask" vs. "ignore," and "should" vs. "must."</p>
