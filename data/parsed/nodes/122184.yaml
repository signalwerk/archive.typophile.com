      <p>As a science guy, the first draft looks depressingly like one of my undergraduate lab reports. I don't have an education in design, but I would consider introducing some hierarchy by using two contrasting fonts. Headings in a big thick sans and body text in a plain serif will emphasise the text's structure. Definitely agree with you that eliminating the columns at the top would be nice. </p>
      <p>Here's my redraft, using your text more or less (though I agree second person would be better). The spacing of the document is a bit erratic - you could tighten it up.<br><img src="/sites/default/files/old-images/Test Number 5_4844.png"><br>
      With Actions/Expected results, you have a problem: do you put it under or over the first test heading? I put it under, you expect to find it under the heading. Then for future test sets I didn't bother putting it in again, since you know what the columns mean after that.</p>
      <p>You could also put the test instructions in sans-serif to make them stand out, which might help. But I felt that made the document a bit blocky and awkward, as the linespacing of the test instruction and test result won't match. </p>
      <p>For fonts, I've used Twentieth Century MT and Garamond, both fonts included with Office, since a chunky geometric sans and a plain serif make a good contrast, I think. Twentieth Century is called Tw Cen for some stupid reason by Microsoft. As Microsoft's Garamond is a bit lame, I actually used the much nicer <a href="http://www.georgduffner.at/ebgaramond/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">EB Garamond</a>, which you can get for free. (Obviously there are many premium fonts nicer than either of those, but I thought I'd go with ones I'm sure you have already.)</p>
