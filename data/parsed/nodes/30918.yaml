    <p>Fellow Typophiles,</p>
    <p>I was commissioned to design a new logotype for a fancy, chique restaurant in The Netherlands. The main design is an RC monogram (for Restaurant Claudius), but the client wanted a really detailed design to sandblast (is that right?) on the window, and for big prints like the banners they have in front of their restaurant.</p>
    <p>Check the attachments for my design. I'm quite pleased with the decorative logo, I'm not too sure about the type treatment though. It's set in Perpetua Titling MT.</p>
    <p>Any thoughts and comments?</p>
