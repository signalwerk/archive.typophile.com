      <p>The project is pretty much complete, the logo is anyway. The client was happy with Perpetua, and wouldn't fork over the $150 for Garda. Right now I'm working on the menus, business cards and stationary, and I'm in talks with a sandblaster to see what can be done with the front window.</p>
      <p>Also, I've been having meetings with a silversmith to produce custom cutlery and an embroidery factory to get custom napkins.</p>
