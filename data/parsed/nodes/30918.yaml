    html: |-
      <p>Looking at the dates this project is probably long ago finished, but I want to add a technical note.:</p>
      <p>For safety reasons I would suggest against sandblasting directly into exterior window glass, as it will weaken the glass and make it more prone to breakage. This method is better suited to small decorative pieces set in frames, or as part of a soldered glass arrangement as with stained glass. You can hang such framed pieces inside behind the exterior windows, and mount them in other locations as room dividers and such.</p>
      <p>If it must go directly on an exterior window, there are vinyl products that simulate the sandblasted effect quite well, barring close tactile inspection.</p>
