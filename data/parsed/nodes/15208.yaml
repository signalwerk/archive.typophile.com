    html: |-
      <p>Romulus is one of the most beautiful types ever designed. Its slanted Roman, in place of italic, is not a success though. DTL doesn’t seem to have plans to do van Krimpen’s Chanceleresca Bastarda, the great script companion to Romulus.  </p>
      <p>In spite of their great beauty, van Krimpen’s faces always seem to have suffered from some flaw that prevented their wide use. </p>
      <p>Perhaps DTL will make a usable version. I hope so. But I don’t believe it has been released. It has been promised for many years; now it looks like they do have a lot of it completed, but I have no idea when they will release it. </p>
      <p>For a type that breathes Van Krimpen’s spirit, but does it with it seems more usefulness than Van Krimpen himself, it seems, see the magnificant (and unbelievably expensive) <a href="http://www.teff.nl/fonts/trinite/trinite.html">Trinite</a>.</p>
