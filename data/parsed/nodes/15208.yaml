    html: |-
      <p>Jan Middendorp’s book “dutch type” discusses and shows Trinite.<br>
      Mathieu Lommen/John Lane’s biography of Bram de Does shows extensive text set in Trinite, as I recall. And discusses it at length. Both books should be available through the Dutch book seller Nijhof &amp; Lee, which has a web site, and elsewhere that I forget.<br>
      I worked at Autologic in the early ’80s when it’s Swiss subsidiary Bobst Graphic released Trinite for photosetting. The promotional booklet is a treasure. The cover is shown on pg 160 of Middendorp’s book. I’m so happy I have these books and the booklet!<br>
      Based on what I’ve read in the above books, I think Trinite had significant use in the Netherlands in the ’80s.<br>
      I’d buy and use it in a minute if it was affordable!<br>
      Brian</p>
