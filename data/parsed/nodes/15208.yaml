      <p>We considered using Documenta for the ATypI Vancouver materials in 2003, but decided against it after some tests. It reads well but is quite dull. In the end we decided to use Matthew Carter’s Fenway instead.</p>
      <p>Of the DTL fonts, I am quite partial to Michael Harvey’s Unico. My friend Brian Morgan introduced it for the redesign of <em>The Walrus</em> magazine, and it works very well, even on the relatively glossy paper.</p>
