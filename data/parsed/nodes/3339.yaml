  html: "<p>We're tinkering under the hood, in yet another attempt to kill the Server 500 messages. If you're seeing this error today while posting, please let us know: <a href=\"mailto:forums-support@typophile.com\">forums-support@typophile.com</a>. (Alternately, if you normally see 500s and are not anymore, also let us know. ) <br> <br>We've tried unsuccessfully in the past to correct this problem. I have high hopes this time. Success or not, we're absolutely committed to correcting this error, even if it means reinstalling the board from scratch. <br> <br>Those of you who use email notification will notice a slightly different template; we've reverted to an older version without our mods with the goal of troubleshooting the problem. You can still find the link to the thread at the bottom of the email. We'll add the link back to the top once we've isolated the bug. <br> <br>Thanks! <br> <br>jared</p>"
