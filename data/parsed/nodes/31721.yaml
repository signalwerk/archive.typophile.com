    html: |-
      <p>I have another explanation. I just looked in the booklet for a more than 12-year old ClickArt collection of fonts, and there is one called ’Gaston’, which looks exactly like your sample — upright ’s’ and tilted ’e’ and all. It was apparently a common practice to revamp one or two characters when ’borrowing’ an existing design, and that seems to be the case here. Often these old fonts have a way of floating around on the web too.</p>
      <p>- Mike Yanega</p>
