      <p>I don’t see a ’g’ in your sample. Am I missing something? The ’s’ is an alternate character in the font. The ’e’ looks like it might have been made from rotating and clipping the ’e’ from the font. (Or based on the ’c’ with some editing.)</p>
      <p>- Mike Yanega</p>
