    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Typefaces" class="freelinking" rel="nofollow">Typefaces</a> : FF Daxline</strong></p>
    <p><a href="/wiki/Hans%20Reichel" class="freelinking" rel="nofollow">Hans Reichel</a>, 2005</p>
    <p>Contrary to <a href="/wiki/FF%20Dax" class="freelinking" rel="nofollow">FF Dax</a>, FF Daxline has optically equal weights -- thus being a real grotesque face without abandoning the character of Dax. The aim with this variation was to balance the contrast so that it works well in long texts with small point sizes. Daxline is much wider than Dax, and the capitals are larger. There is even a lighter version than Light: Thin.</p>
    <p><strong>External Links</strong><br>
    <a href="http://www.fontshop.com/search/?q=FF%20Daxline" rel="nofollow">FF Daxline at FontShop</a></p>
