      <p>As Theunis said, there's only a handful of fractions encoded in Unicode. If you need to exchange information reliably (i.e. without using PUAs) and also want the fractions to be encoded in the text as a single character, you're limited to that set.</p>
      <p>However, you can get somewhat decent arbitrary fractions (e.g. 13/16, 15/16) by using superscript and subscript characters — the ones in the <a class="freelinking external" href="http://www.unicode.org/charts/PDF/U2070.pdf" rel="nofollow">2070–209F range</a> plus the 1, 2 and 3 superior in the <a class="freelinking external" href="http://www.unicode.org/charts/PDF/U0080.pdf" rel="nofollow">0080–00FF range</a> — separated by the fraction character (U+2044).</p>
      <p>So, something like this: ¹³⁄₁₆  ⁶⁶⁄₇₈</p>
      <p>It's far from perfect since the glyphs used are the superiors and inferiors, instead of the numerators and denominators.</p>
