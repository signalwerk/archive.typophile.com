      <p>That method worked great for us in the printed version of the catalog. But now we're exporting text from the print version to be used in an online catalog. If we build the fraction from the open type menu, it reverts back to numeral slash numeral after we export it from Indesign as xml. Then the website developers apply some CSS styling to make it look like the original diagonal fraction. But it doesn't look as good.</p>
      <p>When we export one of the few common glyph fractions, it's exported as a single unit and doesn't get exported as a numeral slash numeral. It looks good as is, and the web site developers don't need to apply any special CSS formatting. So I was hoping to find extended glyph packages for fractions, or learn how to make a fraction using the open type menu, and then convert it to a form that would not come apart during export.</p>
