      <p>Hmmm ... Are you using your own font on the web site? If not, there is no point in creating more fractions -- they would only appear on your screen, using your own (adjusted) font.</p>
      <p>In addition, there are not than many preset Unicode code points for vulgar fractions: <a href="http://unicode-search.net/unicode-namesearch.pl?term=fraction" rel="nofollow">a list of code points containing 'fraction'</a>. So you would need to add your characters into the PUA segment -- and if so, you cannot use <em>any other</em> font than your own.</p>
