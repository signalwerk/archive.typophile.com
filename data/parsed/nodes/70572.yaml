      <p>You wouldn't need two fonts.<br>
      You could build an OpenType font that, when the "fraction" feature is applied, changes the figures into the characters Miguel mentions, e.g.</p>
      <p>sub one' slash figure by onesuperior;</p>
      <p>etc.</p>
      <p>Normally it's not a good idea for feature code to change one character to another, but in this "print first then web" workflow, it should work seamlessly.</p>
