      <p><cite>I need to do some reading to catch-up with your replies; I've never heard about unicode points and poa segments.</cite></p>
      <p>Ah -- a baseline of knowledge  to work from! I'll be gentle, then.</p>
      <p>Unicode is the (or, maybe just a) way of defining which characters are defined by which code. It all started with ASCII (and before that, EBDIC, but I haven't seen that used for, oh, 25 years?): the code for an "A" is 65, for a "B" is 66, and so on, for the regular alphabet as well as numbers. Unicode attempts to expand that to be able to encode (arguably) every written code system, and for that it needs lots of codes. "Code point" is the name computer geeks give to, uhm, a certain code at a certain point, as in "The code point for lowercase alpha is hex 3b1".</p>
      <p><cite>We are not using our own font on web site. We asked them to use Verdana. [..] Are you saying I could build 15/16 in Open Type so that it would match the glyph single character fractions? And that it would export intact as the single character glyphs do?</cite></p>
      <p>I think I understand why some of our answers leave you bewildered. <strong>Opentype</strong> is not a web-format. It's a font file format, and designed to provide definitions for a font in its own file. Therefore, if you ask your users to use Verdana, all you can use on your web page is Verdana. You cannot 'add' Opentype features -- other than adding them to the <em>font file</em> named "Verdana.ttf" and putting that on your web site for download. (And that'd <em>not</em> be a good solution, because firstly, it would be illegal, and secondly, people would need to download and install the font before looking at your web site.) (I'll skip Web font solutions for now, as I don't know squat about those.)</p>
    html_clean: |-
