    html: |-
      <p>Tim: You could have a full set of numerators and denominators accessible with Opentype (type “1234/5678”, select the text and choose “fraction” in the OT menu). That would work fine in Indesign but not on the web. The problem is lacking cross browser support for OT features and no Unicode definition for the glyphs you need to build arbitrary fractions. </p>
      <p>My proposal is to draw one or two fonts with numerators/denominators instead of the regular figures in the same style as Verdana, and just change the fonts using CSS. The code on your website would look something like this,</p>
      <p><code>&lt;span class="numr"&gt;1234/&lt;/span&gt;&lt;span class="dnom"&gt;5678&lt;/span&gt;</code></p>
      <p>and automatically convert 1234/5678 to a fraction.</p>
