      <p>Hey Joe,</p>
      <p>I recently had to re-make a logo/type for a friend's small business that used this sort of arrangement. The sign I was working from clearly had it wrong: looks like caps for the guts are really big caps stretched vertically for the ends. Fixing this was obviously simple: just use caps on the ends with the same sized small caps inside, and NO stretching. I know I'm not adding much here, but just wanted to share a recent example of <a href="http://www.greenboathouse.com/dewinetz/foxgloves_sign.jpg" rel="nofollow">this sort of thing</a>.</p>
