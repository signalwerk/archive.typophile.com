      <p>I think burried within all of our comments is a chief reason why many current designers lack sensitivity on typographic balance.</p>
      <p>Many of us might recall the great debates about typography that ensued in the '90s during the transition from high-end proprietary digital typesetters to open-ended PostScript imagesetters.</p>
      <p>Up until that point, whenever you required type, you generally marked up the copy and sent it to a type house. Getting typeset copy and composed headlines was not cheap! Therefore, any designer that didn't comprehend type spec-ing (sp?) caused unnecessary expense and needless delays.</p>
      <p>Also, many professional typesetters would tweak photo headlines and galley type output in spite of poor markup (especially if it was a good client). The sins of the graphic designers were often corrected by typographers.</p>
      <p>Once the front-end PostScript devices were put into the hands of graphic designers and copy writers, the need for professional typographers and typesetters went the way of the town blacksmith.</p>
      <p>We often argued that most graphic designers had broader training and that typography was highly specialized. But as frequently happens, tight budgets prevail.</p>
      <p>One of the main reasons why I left the type industry and moved on to multimedia and Internet publishing was that the market was dwindling for dinosaurs such as myself.</p>
      <p>I'm happy to see that many members of Typophile strive to maintain the craft and art of typography.</p>
      <p>------------------------------------<br>
      Yes, I'm old, but I'm back in style!</p>
