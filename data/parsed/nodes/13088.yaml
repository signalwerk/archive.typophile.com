      <p>I recall an incunabula title page as well as a few map engravings that had symetrical cap/small cap treatments which means the design convention dates back centuries.</p>
      <p>I agree with Tiffany that "modern" use might have been inspired by <a href="http://www.acmedigital.net/jiansabu/images/orangequeen.jpg" rel="nofollow">curved lettering</a> commonly used by artists and engravers during the 1800-1900s.</p>
      <p>Early lithography also gave lettering artists freedom. You can see it in this <a href="http://www.acmedigital.net/jiansabu/images/circus1.jpg" rel="nofollow">circus poster</a> and <a href="http://www.acmedigital.net/jiansabu/images/index.jpg" rel="nofollow">fruit crate label</a>.  (BTW- take a look at the pointing hand on the fruit crate label.)</p>
      <p>The problem nowadays is that so many designers are blind to weight and balance in letter forms... they just see words.</p>
      <p>------------------------------------<br>
      Yes, I'm old, but I'm back in style!</p>
