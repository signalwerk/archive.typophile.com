    <p>Alright. You've all seen them. Maybe some of you are responsible for creating them... They're those centered, symmetrical logos with a cap on the front and an equal size cap on the end. They're almost as ubiquitous as they are tasteless. (See the attached example of a bad one I threw together for reference.)</p>
    <p>My question is:<br>
    Is there a good historical example in some text book that people are deriving these bad logos from? Or is there some design hack textbook that details this as a "can't fail" logotype?</p>
