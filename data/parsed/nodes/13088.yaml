      <p>I have always had a problem with AtypI looking like ATYPL (atypical?) The lowercase "i" seems to help clear that up well.</p>
      <p>I recall seeing the "bookend caps" (as we called it in the '50s) associated with nautical fare for some reason.  I remember seeing antique books in New England sea towns with more than the usual amount of cap fore-and-afting--Also, painted on the names of sailing ships. Actually, the lettering on ships was often quite good since it was hand painted and there was no use of Arial or MS Office Times :-)</p>
      <p>ChrisL</p>
