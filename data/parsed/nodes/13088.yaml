      <p>*laugh* -that is good.</p>
      <p>i admire the novice outlook on 'fonts'. it's like most people with little or no background in typography/design try to emulate a feeling or a mood through the faces they choose. whether they actually know it or not, i like approach. as expected, when you use times new roman in conjunction with arial i'm not sure what caliber of crap you'll get but to somebody, it might hit the spot in their mind. and there's what the power of computers can do. put typographic intelligence and legitimacy to bed for a long time.</p>
      <p>as of late, alot of people i've been working with on projects (clients) have come to me because they said my type was different. it got me wondering if they like things i do because it just looks like something you cant do in word and they know it, or if it's actually because it's good? i'm not a good judge of my own work and i sorta think neither are a lot of clients i work with, but it's just worth noting that these days, type that looks so far out of the norm and unsafe is what attracts people's attention. people being those who are mostly unfamiliar with the nuances of good type usage. this is somewhat hard to explain i think</p>
      <p>w|m</p>
