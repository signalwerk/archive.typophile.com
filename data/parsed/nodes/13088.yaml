      <p>I don't think it is wrong, Norbert, I think when the designer doesn't take care to re-draw the letters to fit the shape and to fit the weight of the other characters is when the designs really scream "WRONG"!</p>
      <p>I have to disagree with you. The Peter Pocs poster is an example where a little more care should have been taken. I really don't even think the trick was necessary for the design. I'd argue that the poor type treatment distracts from what could have potentially been a very strong poster. The enlarged S and A also cause the top line to be read, initially, as SOFFENBACHA.</p>
      <p>It looks to me as if Seymour Chwast drew those letters. Still, the P and T are a little too heavy.</p>
      <p>The Sanchez piece works because the letters share the same width. Don't they?</p>
