      <p>After looking at a lot of blackletter typefaces while hunting for this, I am coming to the feeling that this is hand-drawn. The letterforms seem inconsistent, and over-simplified. The 'a' seems particularly out of place to me, considering the other letters. I think a broad pen-tip leads you to letters like this, probably guided by looking at some typefaces, but this doesn't seem like an attempt to recreate any particular typeface.</p>
      <p>I vote for hand-lettered. With no other letters to confirm this is a font, it will be hard to prove otherwise.</p>
      <p>- Mike Yanega</p>
