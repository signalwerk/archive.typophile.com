    html: <p>Look at <a href="http://www.myfonts.com/search?PREFS_SET%5BRenderSize%5D=36&amp;PREFS_SET%5BRenderString%5D=Millcreek&amp;search%5Btext%5D=Italian+Old+Style" target="_blank">Numbers 1, 2 and 5 on this page</a> (Italian Old Style, Jenson and Veronese). The 'k' needs serif clipping and a new dot on the 'i' (along with the previously mentioned filtering) and you might make a close approximation.</p>
