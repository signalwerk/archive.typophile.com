    html: |-
      <p>Try adding U+2F00 (named uni2F00). Also make sure you have the correct Unicode ranges enabled in the font. Word is also probably expecting the font to be monospaced if you have used the usual Unicode ranges for these glyphs. </p>
      <p>Malcolm</p>
