  html: |-
    <p>Hi,</p>
    <p>I've come into a problem whilst trying to compile a font which contains some Japanese characters.<br>
    I have a basic Latin character set (MacOS Roman encoding), but with some additional unicode characters such as uni6782, uni571F – these total around 20 different characters.</p>
    <p>The font compiles fine from Fontlab, and the characters are accessible in (All on Mac OSX 10.8)  TextEdit, Adobe InDesign CS3-&gt;CS6, as well as OpenOffice. However, when I try and type these characters (via a japanese keyboard layout) or paste them in, the font reverts to a default system font which contains the characters.</p>
    <p>Is there a certain Japanese name I need to apply for Microsoft Office (Word 14.2.0) Mac?<br>
    Any help would be greatly appreciated.</p>
    <p>Thanks,<br>
    Terry</p>
