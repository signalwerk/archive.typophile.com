    html: |-
      <p>Wow, thanks for opening my eyes to the full work of Sudtipos and Alejandro Paul. And thanks for the correction on Doyald Young. But the closest I found to what I want is Altast Greeting, which was in the Bowfin Printworks index HVB linked to:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/temp_3793.png"></div><p></p>
      <p>There are issues with it: It's a free TTF and not all the connectors connect properly, but it has basic, classic shapes, a high x-height and wide counters. I had to add some weight to it so the connectors weren't too thin, but that's easy to do. It's not entirely timeless, in that you can tell it comes from a previous era, but it doesn't feel terribly out-of-place today. It could use a little work.</p>
      <p>Still, I'm surprised I can't find something like this from a major typographer. Someone could create sort of the Gotham of scripts in that it's so basic, unadorned, classic, timeless, versatile and well-crafted that it's just the standard script that everyone should have a copy of.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/temp_3784.png"></div><p></p>
