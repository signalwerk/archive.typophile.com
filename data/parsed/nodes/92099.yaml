  html: |-
    <p>I'm looking for a simple, highly legible workhorse of a script that can be used in display contexts (logos, signage, embroidery, etc.) as well as in small sizes (business cards, footers). Classic, relatively unadorned shapes with no hairline strokes, maybe even with bold strokes (but not a casual or brush script), plus large x-heights and wide-open loops and counters. The Cadillac logo is in the right direction:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/logo-cadillac[1]_4970.jpg"></div><p></p>
    <p>Any ideas?</p>
  html_clean: |-
