    date: 2012-04-16T07:29:00
    date_raw: 16 Apr 2012 — 7:29am
    votes: null
    html: |-
      <p>Regular in the sense of similar and repetitive forms. One needs some differentiation between glyphs to recognize them — hopefully instantly. Example: two lowercase u’s could be mistaken for a w and a dotless i, etcetera. </p>
      <p>A logo breeds familiarity due to repetition (advertising, fleetmarking) and gets its own persona in time. You may have seen experiments where certain words or texts were rendered in the style of famous wordmarks, where recognition trumps legibility, eg:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/enjoy-coke-cocaine-andigear_5473.jpeg"></div><p></p>
