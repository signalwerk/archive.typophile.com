    html: <p>The various scripty fonts for sports uniforms would seem to satisfy your criteria, but I don't think that's really what you're looking for. They're all mean to be embroidered and read at a distance,  and are very klutzy. Because of their broad strokes and large counters, they reduce very well. See such as Nick Curtis' TeamSpirit,  Letterhead's Pilsner, Jawfonts' Fenway Park, etc.</p>
