  html: <p>I’m creating a large Unicode font (1600+ glyphs, although many are composites) with FontLab 4.5.2 under Win <span class="caps">XP</span>.  The font functions ﬁne with Notepad, OpenOﬃce Writer, and InDesign 2, and also with TextEdit and Character Palettte under Mac <span class="caps">OS</span> X.  With Word <span class="caps">XP</span> and Character Map, a good number of the characters (the last 200 or so I’ve added, I’d guess) are just ignored.  That is, they do not appear in Word’s Insert/Symbol, nor in Character Map.  If I type the hex value for one of these aﬀected characters in Word, followed by Alt-X, I get a blank box.  This has gone on through a few revisions now and I need to get it ﬁxed.  I’d suspect a bad cmap, or that some Unicode values were set incorrectly, but then how does it work on certain apps?  I would appreciate any suggestions very much. <br><br>David</p>
