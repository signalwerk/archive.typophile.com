      <p>To get the ball rolling and not knowing exactly what they're going for (modern/clean, funky/interesting, etc.), I'll throw a few out there.</p>
      <p><a class="freelinking external" href="http://new.myfonts.com/fonts/tipotype/quiroga-serif/" rel="nofollow">Quiroga serif</a> might be an interesting companion serif</p>
      <p><a class="freelinking external" href="http://www.typography.com/fonts/font_overview.php?productLineID=100036" rel="nofollow">Vitesse</a> is a strong, modern slab</p>
      <p><a class="freelinking external" href="http://vllg.com/Thirstype/Apex_New#panel=poster" rel="nofollow">Apex Sans</a> is a sans with interesting roundness to it that might work</p>
      <p>And then there's always Futura that pairs well with the name</p>
      <p>-<br>
