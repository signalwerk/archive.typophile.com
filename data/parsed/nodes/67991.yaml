    <p>Greetings all. First time poster. I've trying to find a pairing face for a custom wordmark that I've done for a mixed martial arts company (yuck, I know). The wordmark is comparable to something like the ford logo. I can't seem to think of anything that really works well enough for me to present.</p>
    <p>Suggestions? </p>
    <p>Thanks.</p>
