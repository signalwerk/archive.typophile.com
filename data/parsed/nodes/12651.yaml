  html: <p>As a typographer working in the field for less than a year I still have difficulty catching all the areas of kerning. I see there are allot of experts on this forum and any advise,rules you follow, experience would be greatly appreciated. I'm working mainly with letterheads, brochures and invites. An example...I recently designed a letterhead using Palentino and found I needed to kern spaces between the customers name which was set in 12pt and between a few letters. I assumed, before I was made aware by my manager, that fonts like Times, Palentino, Garamond in smaller point sizes didn't need much kerning..but I see I'm missing the idea. I usually kern type for design effects or when designing a logo. Many Thanks to all the Type Experts, I appreciate any TIPS!!!!</p>
