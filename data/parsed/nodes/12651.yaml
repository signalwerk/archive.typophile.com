      <p>A useful way of viewing your type is to print it on a laser printer at the intended final size and view it upsidedown, fooling your eyes into looking at the blacks and whites rather than reading the letters. You can also squint at the document/screen to blur the type and the spaces become more obvious.<br>
      Tim</p>
