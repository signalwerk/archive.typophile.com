      <p>I'm not really a designer so beware but ...</p>
      <p>(1) Above all, look. Adjusting the space between letters is a matter of eye. You are aiming for something that <em>looks</em> even. The human eye is a wonderfully acute instrument. Look at type around you and see what looks good and what looks bad.</p>
      <p>(2) I'm not sure if you really mean just kerning, or if you also mean "tracking" or letterspacing (especially in your reference to spaces in the customer's name). The conventional wisdom here is that lines in all caps or small caps often benefit from a little space, but that lowercase generally doesn't. Don't overdo it, though: you don't want to turn words into letters on a conveyer belt. And try to end up with something that looks even not only within a line but between lines of text on the same page: that means don't track one line a lot, and the next a little, and the last hugely.</p>
      <p>(3) With text-size type set without extra tracking, start from the assumption that the kerning built into the font will be OK. (Use f- ligatures where you have them.) Only adjust if you really need to. If you use InDesign, feel free to try out the optical spacing, and see if that solves your problem. Like a good doctor, reserve surgery for the serious cases. I'd be very chary of kerning "between a few letters" at text sizes.</p>
      <p>(4) If you are letterspacing it's more likely that you will need to make optical adjustments, aiming for an even line. The general aim is to try to produce even spacing between the letters. The problem letters tend to be those where, left unkerned you get large gaps. Consider the words LATTE and SLALOM. You can immediately see some of the problem areas: LA, AT, TT, LO naturally tend to have more space between them, because of the way the strokes fall than TE, SL, OM or AL. So you will probably want to compensate for that by putting a little more space between the close combinations.</p>
      <p>(5) Beware of overdoing it though. It's easy to get carried away, especially with combinations that seem like they could "fit" together (AV, VA, LT, AW, WA) and fit them too tight. Then you will get problem cases which you can't do that to, and lose the even-ness. Imagine you were trying to kern VAVOOM: the temptation to close up VAVO is great, but it may lead you into trouble with OOM. (Some fonts have special sorts like an OO ligature where the Os overlap for precisely this reason.)</p>
      <p>(6) The problems will be different in different fonts: if M has straight sides it behaves differently from an M that has a slant to its legs, ditto with W. Some Rs have long tails, some have short ones. The hardest words are always those which combine "naturally" tight combinations (HI) with naturally loose ones (RA, TA, LA). Practice with potentially troublesome words and phrases (THE LATIN HILLY POTATO RAVINE).</p>
      <p>(7) With small type, be especially cautious. Metal type had almost no kerning as such, but it still looked good. In small sizes combinations like Vo and Va often don't need kerning, and as many efforts at spacing are destroyed by over- as by under-kerning. I'd generally set this as it comes out of the box. It's only when you think the type is really going to be "looked at" rather than read that you need to go by hand.</p>
      <p>(8) In every case, the adjustments you are making are likely to be much too fine to make on screen. You have to print it out, on the best printer you have, and then look at it, decide what adjustments you need to make, and do it again. They human eye can detect tiny adjustments (1/2pt or so), which is really amazing.</p>
      <p>(9) Dowding's "Finer Points on the Spacing of Type" is a useful book on this sort of typographical detail. Many books on typographical subjects also include illustrations of title pages and so forth set by people like Tschichold and Smoller: sometimes with examples of proofs where they were adjusting the spacing (add 1/2 pt here etc). Looking at these is very informative.</p>
