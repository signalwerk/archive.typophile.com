      <p>I don’t know where the cutoff for “master” might be, but I think the successful design of multiple scripts (especially including those for which one lacks nativity) is certainly an exceptionally good indicator of merit in a type designer.* It’s a superb test of one’s powers of abstraction and ability to go deeper than the mere rote articulation of canned formal relationships. For example, that “3” shape in Frutiger’s Devanagari is a clear sign that there’s something seriously wrong; as Peter Lofting has remarked about that font: “You cannot chop up the curly bits.”</p>
      <p>* Which is why I think Granjon was far superior to Garamont.</p>
      <p>hhp</p>
