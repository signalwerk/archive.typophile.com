    html: "<p>Adrian Frutiger has demonstrated great understanding, but never made a great book face. On the other hand, Gill had no extraordinary understanding of text type but made Joanna. One designer who knew what he was doing and also managed to create at least one inspired book face was Dwiggins, whose Electra synthesizes so many of the tendencies in 20thC type design: Updike’s and Morison’s love of the best transitional printing, chirographic humanism, the modernist search for a type for the age and the newly general recognition of the uses of irregularity.</p>"
