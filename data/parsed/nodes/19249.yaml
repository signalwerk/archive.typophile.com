      <p>“One” doesn’t give a good picture, because different were strong in different ways. A top five to ten will be better. Also for late 20th century—the digital age, we are probably too close to it to judge reasonably. One era is 1890-1985, from the Benton pantographic punch cutter. </p>
      <p>Morris Fuller Benton has to be among that top list, because he more than anyone created the type business for that period, and was one of the best craftsmen. So too Goudy and Zapf, creators of the most original, excellent typefaces. My late Uncle Ben Lieberman used to categorize these as ‘personal’ designers, because they put a strong individual personality into their work. Benton represents the opposite style, of being a craftsman subservient to the design. Frutiger also has to be on the list because of doing the most influential new design, his Frutiger sans. I don’t know who exactly did a lot of those faces from Monotype and Linotype, so their drawing offices would have to be also on the list. Tschichold I think would have to be on the list also not so much because of Sabon, but because of being the most influential thinker on how to use type—both in his modernist and traditionalist phases. Hence he influenced also how people thought about type design. </p>
      <p>Obviously Matthew Carter—the contemporary designer most like Benton in his wide range and flawless craftsmanship—is going to be on everyone’s list for the latter part of the century, but I would just leave out anyone younger than Zapf and Frutiger, as their contributions are too recent for perspective. </p>
      <p>I also adore Dwiggins’ faces, but I don’t think he was so influential. He is more influential now, I think, than ever.</p>
