      <p>I am exploring all possibilities. One of the most cliche' choice could have been picking a handwritten font to show personal, and connected human moments. Another one would have been to use hourglass, eye etc for logo than a logotype.<br>
      This is I believe the harder and the less obvious path. Hence looking at it. While I would want it to be iconic and distinct enough to be noted in the viewers mind. Something similar to how facebook's font is just a bit distinct and not casual/surprisingly distinct.<br>
      Any suggestions?</p>
