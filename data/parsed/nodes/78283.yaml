  html: |-
    <p>Hi All,<br>
    I am trying to create the branding of a social network "Momment" that allows us to share our moments with people we chose to. While the idea revolves around using the two "m" to show fusion, connectivity and bond, I am at a dead end choosing a typeface. </p>
    <p>I would ideally want the typeface to be warm, human, emotional, honest, sincere, personal, interaction. Based on these, I feel a humanist font might suit perfectly. The conversations you have with your friends will be very personal and warm but people not in the group of conversation will not be seeing your conversation with friends of other group. So there needs to be that feeling too.</p>
    <p>I would want the brand to reflect gravity and feel iconic yet have these above feelings.<br>
    Would love to know of some fonts which have above qualities and fit well within the idea that I am going ahead with.</p>
    <p>I know this might not be the best place for it, but this project is ver close to me so had to ask. I am essentially a UI Designer and not the best when it comes to typography.</p>
    <p>Please help if you can.</p><div class="imageWrap"><img src="http://typophile.com/files/mommment_3954.png"></div><p></p>
