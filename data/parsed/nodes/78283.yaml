      <p>When I saw the title of your post, I thought of a typeface suitable to captioning photographs of people's "moments in life", perhaps for an advertising campaign. Thus, I thought of a semibold script face. <a class="freelinking external" href="http://new.myfonts.com/fonts/typesenses/aphrodite-pro/" rel="nofollow">Aphrodite</a> is something like what came to my mind.</p>
      <p>Clearly, that's not what you would want - and, it seems that the typeface used in your image is one suitable to your purpose.</p>
      <p><a class="freelinking external" href="http://new.myfonts.com/fonts/jan-fromm/camingo-dos/" rel="nofollow">Camingo Dos</a>, as a random example, would be an alternative to Gill Sans for your purpose. Another one would be <a class="freelinking external" href="http://new.myfonts.com/fonts/berthold/barmeno-bq/" rel="nofollow">Barmeno</a>, which would avoid using Peignot Bold, which would be cliched at this time.</p>
      <p>These, though, are just random examples.</p>
