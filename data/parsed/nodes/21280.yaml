  html: |-
    <p>It's music festival time, and festivals mean lots of ads in the papers. In my native country, Norway, these music festival ads have been dominated by an overuse of Rosewood Fill the last few years. Looking at a paper with five or six ads for various festivals, one could get the impression that they were all made by the same designer, but I doubt that is the case. Is this a trend, laziness, everyone trying to copy other people's designs or what? And what is the situation like in other countries whereas music related ads is concerned? Is there more variety?</p>
    <p>Frankly I'm getting fed up with Rosewood Fill. It's a shame. The typeface is rather sweet.</p>
