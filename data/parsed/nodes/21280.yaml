      <p>I notice that hardly anyone uses the Chromatic woodtypes as intended: 2 layers.</p>
      <p>I put the final outlines together for the Chromatic Woodtype set. The spacing and kerning for Rosewood was done to make the ornamented version look right. When Adobe released the Chromatic Woodtypes, they thought that probably someone would try to use one of the fill fonts alone, but that they would see how bad the proportions, weights and spacing looked without the ornamented layer, and use something else. </p>
      <p>You never know what will be done with a typeface once it's released.</p>
    html_clean: |-
