    votes: null
    html: <p>OK, the PDF works now. <br> <br>Not surprisingly, this is a face that cannot be evaluated in the normal fashion - otherwise one would blindly conclude "it's ugly" and leave it at that. The relevance of such a design is tied to the existence of the "dark half" of reading, the half where a reader doesn't notice the details of the font, but is affected by it nonetheless. <br> <br>Evaluating such a font requires a very strong understanding of readability, and the deeper mechanisms of reading, for example to what extent familiarity matters, and what details readers notice. I don't know anybody who can do this. But I can try to share some of my own hazy insight. <br> <br>- I think the "a" needs its lower-right spur. <br>- And the "g" needs its ear. <br>- The "k" needs staggered arms, maybe one of them bowed. <br>- The "v"/"w"/"y" are too static as a group. <br>- I'd make the "J" descending. <br>- The "@" is too chirographic. <br>- I'd flatten the UC acutes/graves. <br>- The BP is off. <br>- That "L" in the Pilcrow is bril! <br>- I don't think the Differential should lean. <br>- The Florin should lean though. <br> <br>BTW, looking at the vertical proportions and color, it looks like a face that would work best at larger text sizes, like around 12 point. But for that the spacing is slightly loose. <br> <br>Whatever you do though, don't expect virtually anybody to understand what this is about - the Modernist age is not good at tolerating such extrapolation - it's just something you'll have to believe in, and apply in the best way you can. <br> <br>-- <br> <br>&gt; If that were not so, what would we strive for? <br> <br>I feel the same way. But some people like to celebrate more than strive. I guess they have more fun though. <br> <br>&gt; some of the letterform structures you used <br>&gt; in your GIF look very Middle Eastern <br> <br>It's possible - although probably based more on my own [circumstantial] background than some actual "old-world" merit... <br> <br>hhp <br></p>
