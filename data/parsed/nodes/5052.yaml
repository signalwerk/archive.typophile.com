    date_raw: 2 Oct 2004 — 5:56pm
    date: 2004-10-02T17:56:00
    votes: null
    html: <p>Wow! I quite like the direction this is going, but a few things bother me.  <br> <br>1) The difference in dots for i and j, while I appreciate it, doesn't work for me.  <br> <br>2) The roman feels slightly as if it's leaning left, especially at smaller sizes. <br> <br>3) And speaking of left, the italic K needs to bulk up on its left side. <br> <br>4) The italic p looks too `pinched' to me; maybe bring the join down just a hair. <br> <br>Overall, though, I could see using this for a couple of projects I have. Keep up the good work!</p>
