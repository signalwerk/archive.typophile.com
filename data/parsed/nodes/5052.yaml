    html: "<p>Hey Chris, you're talking alphabet reform! A pet project of mine since '98. Using \"conflicts\" in the Latin alphabet*, I arrived at the following structures: <a href=\"http://www.themicrofoundry.com/other/maslucida.gif\" target=\"_blank\">http://www.themicrofoundry.com/other/maslucida.gif</a> <br>It's not a font, of course - just <i>structures</i>, and explaining everything is a pretty long story - like the fact that they represent an \"ideal\"** and a given actual font can \"tame\" the structures as needed - perhaps arriving at somewhere close to Leporello. <br> <br>* <a href=\"http://www.themicrofoundry.com/other/m&amp;s.gif\" target=\"_blank\">http://www.themicrofoundry.com/other/m&amp;s.gif</a> <br> <br>** Actually, they need tweaking. Again.  :-/ <br> <br>You could read my essay in this book if you're interested in learning more: <br><a href=\"http://www.gunnarswanson.com/GDandR/GDandR_Book.html\" target=\"_blank\">http://www.gunnarswanson.com/GDandR/GDandR_Book.html</a> <br> <br>Of course to some people it's the highest form of Blasphemy to suggest that their alphabet is anything short of divinely perfect - and they can hold a covert grudge against you for all Eternity, devoting a big chunk of their lives to striking down anything else you might ever say about anything at all, using any maneuver, any awkward angle of attack - such is the nature of true Devotion, I guess... <br> <br>-- <br> <br>BTW, I couldn't load the PDF either. <br> <br>hhp <br></p>"
