      <p>Here is yet another tinkering.  Besides many small adjustments throughout, I have mostly abandoned the 2-version concept since the difference between Plain and Cloaked was so small it made no sense to keep both.  I went back to just "Regular" and made the entry strokes more normal and predictable at least for now. <br>I also added, just for fun, a few dingbats that were in keeping with the libretto of the opera. I added a mask, swords (pointing left and right and dueling) and even a "Leporello folder" <br>I also changed the Pilcrow to resemble a sword broken in two (even though Hrant liked the earlier one. <br>I still have no kerning but am working on the diacritics now and flirting with an italic. <br>Hrant-I never liked the stepped "k", it always lookedlike a broken chair to me. I tried the ear on the "g" and the "a" but it looked silly and out of place with the rest. <br>Please have a look at the PDF and let me know what you all think. <br> <br>ChrisL <br></p>
