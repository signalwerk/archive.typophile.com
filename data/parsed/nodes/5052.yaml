    date: 2004-06-09T17:14:00
    votes: null
    html: '<p>Please, look at Victor Gaultneys essey: "Problems of diacritic design for Latin script text faces".  <br><a href="http://www.sil.org/~gaultney/ProbsOfDiacDesignLowRes.pdf" target="_blank">www.sil.org/~gaultney/ProbsOfDiacDesignLowRes.pdf</a>. <br> <br>Look at acute in Gentium and Linotype Palatino. Palatino has acute about 27 degree, Gentium has acute about 35 degree. This is correct for Polish language.  <br> <br>aogonek and eogonek looks good now (may be very good). <br> <br>Look at <a href="http://fonty.pl/pliki/eurofonty.pdf" target="_blank">http://fonty.pl/pliki/eurofonty.pdf</a> <br>Most of Polish diacritics are correct in this example. (But not all of them) <br> <br>When ogonek is merged with lowercase a in order to create aogonek, should be placed near the right boundary of "a" and sometimes can exceed it. <br>Ogonek in eogonek should not exceed "e". Yours is OK. <br> <br> <br> <br></p>'
