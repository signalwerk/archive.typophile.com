  - id: 36653
    user_id: 1250
    user_name: hrant
    user_path: null
    date_raw: 17 Jul 2004 — 1:21pm
    date: 2004-07-17T13:21:00
    votes: null
    html: "<p>Chris, you're not speaking to yourself - on my end I was saving the best for last. <br> <br>Few people can appreciate what you're doing - it's way out there - it requires a dedication to the dark depths of reading - something very rarely promoted. <br> <br>Know that most type designers who see this will think it's garbage (and most of them won't have the balls to tell you). Some people will think it's \"cute\". My advice is this: filter feedback based on context: learn to ignore certain specific kinds of advice from people who might be great conventional font designers but have no real idea of the dark currents sweeping to and fro in the recesses of the human brain. Or: Don't ask a poodle trainer to handle an anaconda. <br> <br>-- <br> <br>It's a good time to back up. <br> <br>What I think you should go for (and you might already be doing this) is a font that creates a texture (at reading point sizes) the layman won't reject, but diverge the forms as much as possible nonetheless. I think you're actually being slightly conservative! But it will make for a great test case. You will have to publish a booklet (not related to typography) that uses it, and ask laymen (NOT other designers) what they think - and ask them in the most indirect -even devious- ways - to see what's really going on. <br> <br>Some specifics: <br>-Why are the caps and numerals so conventional? <br>-I'd make the eye of the \"e\" smaller. <br>-I'd make the \"s\" narrower and the \"y\" wider. <br>-I think your accents are generally smallish. <br>-Try making the blank space a hair bigger. <br> <br>-- <br> <br>&gt; There is a balance between repetition and <br>&gt; variation in any pattern to make it work <br>&gt; aesthetically. <br> <br>But there's a critical difference here between display and text, between deliberative and immersive reading. The threshold of harmony/discord depends on how deep into the subconscious you're aiming. <br> <br>What is seen as discord by our finicky -and subjective- conscious aesthetic appreciation is used by the subconscious to read more efficiently. <br> <br>&gt; the infernal 'Doublemint' jingle. <br> <br>Tellingly in fact, a study has shown the more obnoxious a jingle the more memorable it is! What we think we like isn't necessarily what we really like. <br> <br>&gt; I never liked the stepped \"k\" <br> <br>But it's less of an \"x\". <br> <br>hhp <br></p>"
  - id: 36654
    user_id: 3135
    user_name: dezcom
    user_path: null
    date_raw: 18 Jul 2004 — 5:53pm
    date: 2004-07-18T17:53:00
    votes: null
    html: <p>Hrant, <br>Thanks for your input.  I needed your push to tilt me back to heresy and away from dogma :-)   <br>I was never one who liked to adhere to fixed absolutes.   <br> <br>&gt;&gt;-Why are the caps and numerals so conventional?  <br> <br>Because I figured caps rarely appear in text and didn't seem to be an issue--However, I have some ideas for the caps too and will try them out. <br> <br>&gt;-I'd make the eye of the "e" smaller.  <br> <br>I just did, it is better now. You will see when I post the next PDF. <br> <br>&gt;-I'd make the "s" narrower and the "y" wider.  <br> <br>I see your point with the "s" but I will have to be careful not to make it too dark; tinkering is 90% of this work.  <br>The "y" has always bothered me, maybe it is something as simple as the width.  I kept thinking I needed to curve the right fork back. <br> <br>&gt;-I think your accents are generally smallish.  <br> <br>I just enlarged them. (god, I sound like those awful SPAM emails) <br> <br>&gt;-Try making the blank space a hair bigger. . . . <br> <br>I have this dilemma with the word space.  It seems to need more, as you say, at text sizes but a bit less when used larger.  I guess I should trust the user to track the larger sizes tighter. <br> <br>&gt;But it's less of an "x". &lt;&lt; <br> <br>Yes it is but I am working on a somewhat different solution involving curves but not stepped.  I will post it when it is more resolved. <br> <br>I have been trying to push a solution (probably too quickly) just to have something for TypeGallery so I went conservative.  After I step back for a couple of weeks, I will have a more distant vision and be able "see" better.  Right now I am too close to the forest.  All of my less-than-typical attempts at this point look completely normal to me.  I don't see anything at all radical in what I have done.  Perhaps it comes of being too immersed. <br> <br>I hope you will review my next PDF as well, I need someone to keep me off the straight and narrow :-) <br> <br>ChrisL</p>
  - id: 36655
    user_id: 1551
    user_name: William Berkson
    user_path: null
    date_raw: 18 Jul 2004 — 6:13pm
    date: 2004-07-18T18:13:00
    votes: null
    html: <p>Chris, <br> <br>Yes I'm a neighbor not so far away. I do think your narrowing the o helped a lot. I don't quite know how to react to the typeface as it stands. It has polish, and a much more lively texture than most san serifs, which is all to the good. But to me it also looks excentric to a point that is a bit distracting.  <br> <br>It may be that Hrants view is right that the way to go is just all the way with the concept, and just make it as good looking as possible with its varied shape, or maybe even more varied shapes.  <br> <br>Emigre has done a lot of to me excentric stuff that has found a place in the type world, so maybe that is a model.   <br> <br></p>
  - id: 36656
    user_id: 1250
    user_name: hrant
    user_path: null
    date_raw: 18 Jul 2004 — 6:38pm
    date: 2004-07-18T18:38:00
    votes: null
    html: "<p>Actually I think this (or at least what I'm talking about) is a world apart from the Emigre school, because the \"eccentricity\" is not [purely] for aesthetic effect - it's not a form of artistic expression. In fact more than eccentricity you could call it \"realism\": referring to the reality that laymen don't care about formal aesthetics the way [most] type designers do - they're essentially concerned with accessing the <i>content</i> instead. Crazy laymen. <br> <br>hhp <br></p>"
