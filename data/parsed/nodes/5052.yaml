      <p></p></center><p></p>
      <!--/attachment--><!--/attachment-->
  - id: 36649
    user_id: 1551
    user_name: William Berkson
    user_path: null
    date_raw: 8 Jul 2004 — 6:55am
    date: 2004-07-08T06:55:00
    votes: null
    html: <p>I'm just working on my first typeface, so be forewarned you are not getting the voice of experience here. <br> <br>The thing I like most about this now are your serifs at the top of the ascenders.  <br> <br>My suspicion is that if the n, h, and o were slightly narrower it would make for a better rhythm in the text. <br> <br>I wonder whether it would be better with the l with the serif on the ascender. The bl combination is a little jarring in the text. Having the d with no serif is more 'natural' looking as the serif on the d in a serif face is sometimes different than all the other ascenders.  <br> <br>The bottom serif on the l - should the terminal be more similar to the ascender serifs?  <br> <br>The i serif. I think this needs to relate more to the ascender serif also - maybe just being shorter would work. Now, with the serif bending down, it think it should overshoot like the o; it looks short now. Also you could consider putting a stem on the r. As the Underware fellows explain <a href="http://www.typeworkshop.com/index.php?id1=type-basics&amp;id2=&amp;id3=&amp;id4=&amp;id5=&amp;idpic=17#pictloader" target="_blank">here</a> the r usually has more of a notch than the m,n. And that helps keep the rn from looking like an m. If you are going to have as serif on the i you might consider doing something on the j and r also. <br> <br>I don't know what can work here, but I do think that the serifs on the ascenders are a success, and working the face to make it harmonize and work best with these is the way to go.   </p>
  - id: 36650
    user_id: 3135
    user_name: dezcom
    user_path: null
    date_raw: 10 Jul 2004 — 8:32am
    date: 2004-07-10T08:32:00
    votes: null
    html: |-
      <p>I am posting another updated PDF with adjusted metrics (started more kerning) and fixed the f ligs so that their joins do not look so heavy.  I also narrowed the o, O, c, C, G, Q, and D. <br> <br>William, I see you are a neighboring northern Virginian. <br>Thanks for taking the time to look at my font. Now I don't feel as much like I am talking to myself here online :-) <br>&gt;The bottom serif on the l - should the terminal be more similar to the ascender serifs?&lt; <br>I was going by my old caligraphy days where an entrance stroke from a flat pen had a different character than it did at pen lift but that is just a minor historical rationalization.  The truth is, I like it that way.  It is a mix of caligraphy and character reognition fonts of late where the "l, I, 1" are differentiated.  It just feels right to my eyes.  I have tried it your way and several others and have gone back to this. <br>The "i" does overshoot but not quite as much as the "o" because it is MUCH flatter. <br> <br>ChrisL <br></p>
