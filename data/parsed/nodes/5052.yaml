    html: <p>Interesting, but some glyphs needs work. <br>Lc &amp; uc "s" is too weak, lc "j" is a little bit too heavy. You should shift ogonek to the right on "Aogonek" and "aogonek". Lc "k" is too wide for me. All alternative acutes (Polish kreska) on sacute, cacute, nacute, oacute and zacute have too much stepper slope, and now should go to the left. It is nice that you did an alt.acute but for me the first one, is enough for Polish language too. All accents above (not dots) are to weak (light) for me. </p>
