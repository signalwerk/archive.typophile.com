    html: |-
      <p>&gt;And I think you have gone too far in the variety direction. But if you figure a way to pull back - there are a lot of ways to do it because you have so much variation &lt; <br> <br>I think I have "pulled back" enough this time. <br> <br>I fixed the ligs so that they were not too heavy like my previous post.  I have putzed with the sidebearings more and am ready to do more work on kerning now.  I finished the complete character set and added text in Italian, Polish, Czech, and German. I read Victor Gaultneys essay: "Problems of diacritic design for Latin script text faces" (thanks Robert) and Adam Twordoch's article as well so I hope I got it right this time.   <br> <br>I have attached a 2-page pdf file which I hope will get some comments (he says, speaking but to himself). The character set and language texts are on page 2. <br> <br>ChrisL <br></p>
      <!--attachment: Leporello7-7-04b-40128.pdf*mime_pdf.gif*application/pdf*82.2*Leporello7%2d7%2d04b*Leporello7%2d7%2d04b%2epdf --><!--attachment: Leporello7-7-04b-40128.pdf*mime_pdf.gif*application/pdf*82.2*Leporello7%2d7%2d04b*Leporello7%2d7%2d04b%2epdf --><p></p><center><br>
      <table border="1">
      <tbody><tr>
      <td><img src="http://www.typophile.com/forums/icons/mime_pdf.gif" align="left" alt="application/pdf">Leporello7-7-04b<br><a href="http://www.typophile.com/forums/messages/29/Leporello7-7-04b-40128.pdf" target="_blank"><b>Leporello7-7-04b.pdf</b></a> (82.2 k)</td>
      </tr>
