    html: <p>I get an error message when I try to start up your PDF. 'Acrobat cannot decript this document'. Can you check it? <br> <br>The more I look the more intriguing this is. Overall, I think the 'inconsistencies' work harmoniously together-though I want to see that PDF!  <br> <br>I wonder whether the h or k or both need the b treatment for the sake of the harmony of the font. Even though they don't have a 'reflection' they could, and it might look more harmonious. The ldq would still have a visual 'reason' not to have the bend.  <br> <br>The only character I don't think works is the g, because unlike the rest it looks odd to me and the oddness doesn't go away. A single story g might still keep to your design rules for this font and work better. </p>
