    date: 2004-06-25T07:54:00
    votes: null
    html: <p>I think the narrower letters and the change in the serif on the b are both good improvements.  <br> <br>Now I see your idea of great variation in the letters in your 'cloaked' version. It think it is too much.  <br> <br>There is a balance between repetition and variation in any pattern to make it work aesthetically. I have heard, I forget where, that in music it is about 50-50. If the melody doesn't have some kind of repetition it doesn't come together as a melody, but just is a series of notes. Thus you have the typical establishment of the theme in four bars, the next four bars with variation of the theme, the third four a different variation, and return to the theme.  <br> <br>In other words with too much variation a melody just doesn't come together as a 'gestalt' that the mind can wrap itself around. On the other hand, if there is too much repetition it becomes boring and annoying, like the infernal 'Doublemint' jingle. <br> <br>I think that this kind of patterning principle also holds for readability. And I think you have gone too far in the variety direction. But if you figure a way to pull back - there are a lot of ways to do it because you have so much variation - you could end up with something that is balanced and innovative.  <br> <br>By the way, the narrowed top of the g works now for me, where it didn't before. But I think the connecting loop to the bottom is off somehow now.         </p>
