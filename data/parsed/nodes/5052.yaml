      <p>I am attaching another PDF witth the changes I have made so far.  This time I have only included a limited character set. <br>I have slightly condensed the font and made numerous tinkerings. <br>There is also a couple of words in other weights.  I actually started the face as a medium weight. Even though medium is the least usefull weight, it gives me clues about all other weights. I then did a bold and a black before starting the regular. I did not show the bolder weights before because they would not work well as a text face.  I still have much work to do on them all but would like your collective feedback on what I have so far. <br> <br>Thanks, <br> <br>Chris <br></p>
