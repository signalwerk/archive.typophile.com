    html: <p>Hmmm. The text in the PDF for me doesn't solve the harmony problem well enough. It may be the width of the letters is the problem rather than the forms, though. I suspect that you need to narrow the stemless letters - doesn't Dax do this? And also the a seems too wide to me. The flag at the top of the b sticks out too much; its seems visually higher than the straight ascenders - would shortening it make it more harmonious?  <br> <br>You have quite a challenge getting even rhythm into your unconventional forms, but if you succeed you will have something unique. I don't think it's there yet. </p>
