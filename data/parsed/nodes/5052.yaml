    html: |-
      <p>In an attempt to show my overall plan, I am posting 2 more PDFs.  The first is a showing of lc alphabet and brief line of text in 2 styles and 4 weights. The first showing is "Leporello Plain" which has no entry strokes. The second is what I call "Leporello Cloaked."  It is the same one I have been posting.  I intend a third variation "Leporello Masqued" which will be a half serif version (I have yet to start this version). The other showings are very rough weight variations and obviously need much work.  These are: Medium, Bold, and Black. <br> <br>The second PDF shows a synopsis of the opera Don Giovanni used as text.  It explains the opera as well as my reasoning for the naming; Plain for Leporello as himself, a servant; cloaked for Leporello partially disguised; and Masqued for him as his master. <br> <br>The left column of text is in "Plain" and the right column is n "Cloaked." <br> <br>ChrisL</p>
