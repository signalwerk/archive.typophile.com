    <p>...and that's it. Very unhip, very infra dig, I know, but a client needs a font for monograms that sets three letters in a diamond shape. I don't need a special format for an embroidery machine, just a regular ol' typeface. They're hard to find!<br>
    My fallback is a typeface family called Ark Monogram, but that sets letters in an oval...</p>
