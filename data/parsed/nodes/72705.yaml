  html: |-
    <p>ID geniuses, got a question for your gigantic brains.</p>
    <p>This may or may not be an easy one...</p>
    <p>I doing a lot of production work now and I'd like to create a Find/Change or a GREP search that will allow me to change multiple dates at once.</p>
    <p>the format changes from file to file and usually follows these 4 formats and its also possible that all 4 formats could be used in one document.</p>
    <p><em>XX/XX/XX</em> (8 characters)</p>
    <p><em>XX/XX/10</em> (8 characters)</p>
    <p><em>XX/XX/2010</em> (10 characters)</p>
    <p><em>9/26/10</em> - wrong date in-place. (6 – 8 characters depending on the month)</p>
    <p>Instead of having 4 different searches, is it possible to do one search that look for any/all of these text formats and change them at once?</p>
    <p>Thanks!</p>
