    html: |-
      <p>Well of course, as soon as I post this, I get a response from another site.</p>
      <p>Of course GREP comes to the rescue. Enter this in your search field:</p>
      <p><strong> \b((XX|\d{1,2})/){2}(XX|\d{2,4})\b </strong></p>
      <p>and it'll find any of your examples. Wot Doth This All Mean?</p>
      <p>\b     a Word break -- there must not be a word character +before+ this entire expression. This means it'll ignore "XXX/XX/XX".<br>
      (     repeat group -- see below<br>
      ( XX | \d{1,2} )     Either "XX" (exactly) or "a digit, 1 or 2". This means it'll ignore "XXX/XX/XX" (three exes), pick up "1/2/3" (one digit), ignore "123/123/123" (three digits)<br>
      /     A slash. Nothing special, except ...<br>
      )     .. since this is the end of the repeat group ...<br>
      {2}     ... we want twice the sequence "XX/" (or "digit/"), to match "XX/XX/" and every possible combo with digits as well.<br>
      (     oh yet another group. That's because ...<br>
      XX     .. this literal text ...<br>
      |     ... OR ... (hold on, I'm gettin' there)<br>
      \d{2,4}     .. two to four digits should be matched ..<br>
      )     .. in this entire group.<br>
      \b     Phew! A Word break to prevent it matching "12/34/5678*9*"</p>
