    <p>Hey, everyone, I just assembled my fonts, some previously released on DeviantArt, some never before seen, on to their own website here: <a href="http://www.exclamachine.com" title="http://www.exclamachine.com">http://www.exclamachine.com</a></p>
    <p>There are 9 original fonts now, from handwriting-style to ornate to weird and I'll be adding more this summer and fall, along with refinements to the site and more extras.</p>
