    html: <p>It looks like the Heroic foundry has not included numeric values for fonts weights in the font specs, with the result that the application sorts them alphabetically, roman first, then italic.</p>
    html_clean: <p>It looks like the Heroic foundry has not included numeric values for fonts weights in the font specs, with the result that the application sorts them alphabetically, roman first, then italic.</p>
