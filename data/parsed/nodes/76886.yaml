  html: |-
    <p>I purchased Heroic Condensed the other day, and installed it with Suitcase Fusion 3.  For some reason, when I go to use the font in InDesign, Illustrator or Photoshop, the weights are listed like this:</p>
    <p>Black<br>
    Black Oblique<br>
    Bold<br>
    Bold Oblique<br>
    Book<br>
    Heavy<br>
    Heavy Oblique<br>
    Light<br>
    Medium<br>
    Regular Oblique<br>
    Thin<br>
    Book Oblique<br>
    Light Oblique<br>
    Medium Oblique<br>
    Thin Oblique<br>
    Regular</p>
    <p>And that's just confusing.  How can I get them to display from Thin to Black Oblique?  Or at the very least, keep the weights next to their obliques, or list the weights alphabetically.</p>
    <p>Thanks!</p>
