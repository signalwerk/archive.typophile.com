    <p>The RIT Journal of Diversity and Plurality in Design (Multi) is an online peer-reviewed, open access journal housed at Rochester Institute of Technology.</p>
    <p>Multi is the first multidisciplinary journal dedicated to all that affects design and its attendant and related disciplines.<br>
    Multi provides a venue though which truly forward-looking, practical matters pertinent to design can be discussed and shared amongst design professionals with colleagues from those academic disciplines influenced and affected by advances in design and design technology.</p>
