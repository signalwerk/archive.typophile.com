      <p>I know of three:</p>
      <p>1. At Typecon01, Don from <a href="http://www.synfonts.com" rel="nofollow">SynFonts</a> demoed a Flash-based built to order package that I believe P22 used for their <a href="http://p22.com/ihof/typecaster/caster.html" rel="nofollow">IHOF site</a>. Perhaps it's still available and would probably be the cheapest solution, though not the most elegant because it uses Flash (which wrecks havoc on character shapes, particularly curves).</p>
      <p>2. Letterror built the <a href="http://houseind.com/index.php?page=showfont&amp;id=531&amp;subpage=lettersetter" rel="nofollow">LetterSetter</a> for House Industries (and someone else?).</p>
      <p>3. <a href="http://vllg.com/Kontour/Odile/mudTyper+Weights/" rel="nofollow">Village's mudTyper</a> was developed by Takashi Okamoto of <a href="http://www.mudcorporation.com/projects/programming/" rel="nofollow">MudCorp</a>. It's the best of these three, in my opinion, as it sticks to PNGs and still renders instantly.</p>
    html_clean: |-
