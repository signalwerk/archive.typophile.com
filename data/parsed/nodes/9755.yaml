    votes: null
    html: <p>When looking around, I read somewhere that Herman Zapf based Melior on the super ellipse. Very probably so. <br>(Piet Hein was a direct ascendant of the 16th century Dutch naval "hero" Piet Hein. There is a famous young Dutch furniture designer, Piet Hein Eek, whose parents must have a nice sense of humour).</p>
