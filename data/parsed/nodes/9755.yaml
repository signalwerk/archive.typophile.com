    html: <p>Very easy to recreate, once you have a "super ellipse" done -- eg the shape formulated by Danish scientist Piet Hein and used by Danish furniture makers to make a table that "is not round nor square" and makes everyone seated around equally important (there being no head of the table, I guess). <br>And what furniture makers can do, type designers can too... <br>Just my 2 cts - and a bit off topic, haha.</p>
