  - id: 62205
    user: null
    date: null
    date_raw: null
    votes: null
    html: "<p>Armchair Modern appears to use the basics of the super ellipse. Nice.  <br>There is something wholesome about this shape. Being the son of a carpenter I value the fact that is the maximum of roundness one can obtain with the minimum of waste (talking about shaping a table top, you know).  <br>I remember once reading about a trick one could use to draw this shape properly by using pencil, string and a couple of nails -- but can't remember the particulars of that... <br> <br>There is a lot of info on this on the Net, eg: <br><a href=\"http://www.explainthat.info/su/super-ellipse.html\" target=\"_blank\">http://www.explainthat.info/su/super-ellipse.html</a> <br>The bit about the negotiation table for the Paris peace talks is especially illuminating. Seems that Piet Hein did not INVENT it, but REDISCOVERED ist.</p>"
    html_clean: "<p>Armchair Modern appears to use the basics of the super ellipse. Nice.  <br>There is something wholesome about this shape. Being the son of a carpenter I value the fact that is the maximum of roundness one can obtain with the minimum of waste (talking about shaping a table top, you know).  <br>I remember once reading about a trick one could use to draw this shape properly by using pencil, string and a couple of nails -- but can't remember the particulars of that... <br> <br>There is a lot of info on this on the Net, eg: <br><a href=\"http://www.explainthat.info/su/super-ellipse.html\" target=\"_blank\" class=\"link-external\">http://www.explainthat.info/su/super-ellipse.html</a> <br>The bit about the negotiation table for the Paris peace talks is especially illuminating. Seems that Piet Hein did not INVENT it, but REDISCOVERED ist.</p>"
