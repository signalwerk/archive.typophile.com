      <p>@raph <cite>. TeX pretty much holds down the “text” end of the spectrum</cite></p>
      <p>But Baez article above was written in LaTeX (based on TeX) and his graphics are .eps (the source is available from <a href="http://arxiv.org/abs/q-alg/9705009">this link</a> when you click on “other formats”); and the LaTeX package graphics allows importing pdf files, png files, etc in pdflatex. Finally, if you look on <a href="http://arxiv.org/">arXiv</a>, and in particular <a href="http://xxx.lanl.gov/list/quant-ph/recent">quant-ph</a>, you can see from the source files  that many papers written in LaTeX come with figures in external .eps files. We are thus not limited to the “text” end of the spectrum, we are free to decide what suits us best.</p>
