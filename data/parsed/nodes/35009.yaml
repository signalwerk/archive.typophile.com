      <p>There are sixteen more arrows in the range <a href="http://unicode.org/charts/PDF/U27F0.pdf">27F0-27FF</a>.</p>
      <p>I am into mathematical typesetting, but am unsure how I feel about arrows. Especially for the longer and wacky ones, they feel more like graphics than glyphs, or, to be more precisely, occupy the hinterland, neither exactly one nor the other. Certainly for things like commutativity diagrams, I’d much rather see them synthesized based on the geometry of the diagram rather than just pulled out of a font file like so much digitized 18th century metal. I think <a href="http://tex.loria.fr/typographie/inria-1972.ps.gz">these guys</a> had the right idea. (also see <a>Dynamic optical scaling and variable-sized characters</a>).</p>
      <p>For non-mathematical work, I think others have pointed out fonts designed for wayfinding. There was one that was proprietary for a museum for a while, then released more broadly a couple years or so back, but I can’t remember which one it was. Whitney doesn’t seem like it has arrows, but I remember arrows from the specimens. Ah well.</p>
