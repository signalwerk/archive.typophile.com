    html: <p>Arrows are used extensively in mathematical typesetting. Generally boring, thin arrows that balance with other math symbols. You need left, right, up and down, and angled would be nice too. An extension that will attach to the left and rights is good (the em dash will do if it fits) because sometimes you need to place a formula over (and under?) an arrow, and thus need to grow it.</p>
