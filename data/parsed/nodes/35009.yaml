      <p>In case anyone is interested, I put together an OTF of most of the TeX math symbols, reencoded as Unicode: <a href="http://levien.com/type/ghr10.otf">ghr10.otf</a>. I’m not sure I got everything 100% right, but I do believe that all of the arrows are in there. The math symbols in the TeX font library are scattered all over the place, with the most common symbols in the Computer Modern text fonts, a great many symbols in the CM Math range, and a bunch more in the AMS extensions.</p>
      <p>Incidentally, ghr10 is for the Roman (upright) versions of glyphs. There’s a separate <a href="http://levien.com/type/ghmi10.otf">ghmi10.otf</a> for the Math Italic range, and that’s where the lowercase Greek lives. TeX, of course, doesn’t have italic arrows, so I’m only posting this second file here for the thread’s broader purpose of discussing math glyphs.</p>
