      <p>I did major in maths, and I’m a type enthusiast, but I frankly don’t know that much about mathematical typesetting. So from a user perspective, I will try to share my impressions of which arrow symbols are actually used in mathematics, though with an algebraist bias. I don’t have that many maths books with me right now as I keep them at work, so I might be missing a few.</p>
      <p>Most mathematical typesetting I’ve seen require no more than the basic single arrow (’→’ shows up everywhere including maps and limits) and double arrows (’⇒’ denotes logical implication). Also fairly common are the arrows with bars at one end (’↦’ is used to denote that an element is mapped to something). Don’t forget, all these will have corresponding slashed versions (i.e. ’↛’) to denote negation.</p>
      <p>In lectures, I’ve seen a double-headed arrow (’↠’) used for surjection and an arrow with a tail (’↣’) used for injection. I’ve seen very few typeset examples of those, though.</p>
      <p>In handwriting, arrows are sometimes used like diacritical marks to denote that the letters symbolize vectors (’⃗’ over a dotless ’i’, for example). In typesetting, however, vectors are indicated by using bold letters, i.e. <strong>i</strong>.</p>
      <p>I really love Kris’s arrows designed to harmonize with the text. But for mathematical typesetting, simple geometric arrows generally suffice. I think a dingbat font with arrows in different weights and styles designed to be combined with a large range of typefaces would be enough to do the job.</p>
