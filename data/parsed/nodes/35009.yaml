      <p>Kris</p>
      <p>Yep, all that is used in math. But that does not mean that it is all you would need to set math. Mathematicians are notorious for trying to come up with new symbols and such. But those are the basics that will cover the majority of math setting.</p>
      <p>When a researcher comes up with a new formula, he/she often wants a special character to represent a certain important variable. First used are Greek characters ... you will be familiar with the large Sigma used for summation, and pi used for that number.</p>
      <p>They also will use script characters (l is common to avoid confusion with 1, although a good designer should have chosen fonts where there is no confusion), Hebrew characters, Fracktur characters, and the outlined characters shown.</p>
      <p>The symbols are variations of basic symbols. For instance, the less than or equal to sign can have one or two lines under it, or one or two curved lines, each meaning different things to different mathematicians. I'd tell you what they mean, but I can't. I just typeset the stuff (back then). I didn't understand it.</p>
