      <p>Given David’s comments it sounds like the primary reason to include arrows ( to the extent that there is one ) would be to support specific math functions... All other uses are essentially clip art* related rather than typographic in nature. I can imagine that an arrow which matches the chosen font might be good to have as well but I suspect that custom arrows will be used more in part because the arrows in a font are harder to access  ( I guess you could create a font in the Opentype set called ’symbols’....) but mostly because I think graphic designers will usually want something impossible to anticipate. In any event it probably isn’t going to pay to sweat this very often even if you are just supporting Math use.</p>
      <p>* This probably sounds more dismissive &amp; pejorative than I intended...</p>
      <p>James, Shu, Paul - What arrows would you want to match within a type face? I am guessing 12, 3, 6 &amp; 9 o’clock and the points in between. Anything else? </p>
      <p>Tim, nice find.</p>
      <p>Don, would you expand on your comments?</p>
