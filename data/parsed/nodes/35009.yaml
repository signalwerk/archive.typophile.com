      <p>@russelim:<em>Generally speaking, an arrow or other symbol should be easier to work with in a design as a piece of vector art.</em></p>
      <p>That rather depends on the tool you’re using. Arrow diagrams occupy a nether region which is neither pure text layout as in book paragraphs nor pure graphic design like drawing a portrait in Illustrator. In this way, they are somewhat similar to tables, just a little different graphically. You <em>can</em> with some pain fake tables using paragraphs and tabs (that’s basically what the tab function is for, historically at least), and you can also make tables in Illustrator, but both approaches involve serious compromises. The serious problem with treating it as pure graphics is that it becomes very difficult to do simple operations like adding a row or column, or even changing the size of one already existing.</p>
      <p>Since the problem is so thorny, there are several different approaches. TeX pretty much holds down the “text” end of the spectrum, using a complex ASCII markup that is actually a relatively powerful programming language. Since the user base of TeX tends to be computer scientists, mathematicians, physicists, and statisticians, this actually works out pretty well.</p>
      <p>But I definitely agree, if you’re a graphic designer without deep semantic knowledge of what the diagram means, and the ability to code that in the typesetting system’s programming language, then you are better off pretending it’s pure graphics, and just sacrifice some of the fluidity in being able to edit and adapt it.</p>
      <p>I say tables and arrow diagrams fairly interchangeably here. There are important differences between the two, but the structure of the problem is similar, and, in the case of the chemistry diagram posted by John above, it’s clear from the grid alignment that the tool used to create the diagram was in fact some form of table.</p>
    html_clean: |-
