      <p>I recently used arrows in a image-heavy document to point to illustrations (rather than ‘above left’, ‘above’ etc.) I needed them to work with Meta Plus Book and wanted something a little bolder than the body copy at about em height and to the 8 major points of the compass – in the end I used Wingdings, each arrow with slight positive and negative baseline shift, but would have preferred something a little lighter, they were mainly adjacent to non-aligning numerals but were in the main flow of the text so had to integrate with upper and lower case characters as well. I seem to remember Foundry Gridnik had some useful arrows.</p>
      <p>Tim</p>
