      <p>&gt; I think these guys had the right idea<br>
      Thanks for the link, and I agree with you about those long arrows  in diagrams (be they mathematical or not).</p>
      <p>As for the arrows in the range 2190—21FF, and on a more practical basis, if an undergrad student of mine decides to write a mathematics homework using a basic text editor, he will certainly need the characters 2192 (for functions), 21D2 (for “implies”), 21D4 (for “if and only if”); character 21CF (for “does not imply”) and 21CE (for “is not equivalent to”) would be useful, as well as 21A6 (“maps to” as in “x maps to y”). Less importantly, characters 21A0 (“maps onto” or “maps surjectively” or “epimorphism”) and 21AA (“maps 1—1 into” or “maps injectively” or “monomorphism”) might serve. Off course that student would also need other mathematical symbols that are not arrows. If that student uses Word, there is an equation editor where all the basic characters can be selected.</p>
      <p>More in line with Raph’s comment, if I use the amsart (American Mathematical Society) LaTeX package for articles, when I want a “if and only if”, I type \iff and what comes out is a nice thing made out of two glyphs that look like one: a double left arrow and a double right arrow glued together.</p>
