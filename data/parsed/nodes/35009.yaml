      <p>James, your example makes me think that for the 8 single directions it might be nice to offer the arrow in a circle as a discretionary alt.</p>
      <p>The thing about arrows is that in general they are pretty easy to make in the sense that unlike a b to d ( or n to m even) where you really do have to think a bit more a left arrow really is just a reverse of the right. Fancy Arrows with 3 shafts, flat or v shaped backs, or double heads &amp; so on are something else again as are arrows in a monospace. </p>
      <p>Also, Hunting around for the arrows not covered by Don's link to Math Arrows  I found these:</p>
      <p>U+21DE   ⇞   upwards arrow with double stroke So 1.1<br>
      aka page up</p>
      <p>U+21DF   ⇟   downwards arrow with double stroke So 1.1<br>
      aka page down</p>
      <p>U+21EA   ⇪   upwards white arrow from bar So 1.1<br>
      aka caps lock</p>
      <p>U+21EB   ⇫   upwards white arrow on pedestal So 3.0<br>
      aka level 2 lock</p>
      <p>U+21EC   ⇬   upwards white arrow on pedestal with horizontal bar So 3.0<br>
      aka caps lock</p>
      <p>U+21ED   ⇭   upwards white arrow on pedestal with vertical bar So 3.0<br>
      aka numerics lock</p>
      <p>U+21EE   ⇮   upwards white double arrow So 3.0<br>
      aka level 3 select</p>
      <p>U+21EF   ⇯   upwards white double arrow on pedestal So 3.0<br>
      aka level 3 lock</p>
      <p>U+21F0  ⇰ rightwards white arrow from wall So ON<br>
      aka group lock</p>
      <p>U+21F1  ⇱ north west arrow to corner So ON<br>
      aka home</p>
      <p>U+21F2  ⇲ south east arrow to corner So ON<br>
      aka end</p>
      <p>U+21F3  ⇳ up down white arrow So ON<br>
      aka scrolling</p>
      <p>U+232B   ⌫   erase to the left So ON 1.1<br>
      aka delete to the left key</p>
      <p>U+2326   ⌦   erase to the right So ON 1.1<br>
      aka delete to the right key</p>
      <p>U+23CE   ⏎   return symbol So ON 3.2<br>
      * may be shown with either hollow or filled glyph<br>
      ref U+21B5   ↵   downwards arrow with corner leftwards (Arrows)</p>
      <p>U+23CF   ⏏   eject symbol So ON 4.0<br>
      * UI symbol to eject media</p>
