    <p>Another obscure typographic corner: <a href="/wiki/Arrow" class="wiki-create">Arrows</a>!</p>
    <p>I am putting a new round of revisions into Software Developer and I am taking Kent Lew’s advice and adding some arrows to it.</p>
    <p>Any advice? </p>
    <p>Have you used arrows in your work before? </p>
    <p>Apart from signs at airports I can’t recall seeing their use. Do chemists’ use them? Electricians?</p>
    <p>Certainly I see how they can be designed within a family style etc but what about their placement in the glyph? For instance: Other than the other arrows what glyphs should they work well with? A lower case o? Or the Numerals? Or Parentheses? Actually I see it could vary from arrow to arrow. The round ones vs the straight. The spilt vs. the whole...</p>
    <p>Thanks!</p>
  html_clean: |-
    <p>Another obscure typographic corner: <a href="/wiki/Arrow" class="wiki-create link-lost">Arrows</a>!</p>
    <p>I am putting a new round of revisions into Software Developer and I am taking Kent Lew’s advice and adding some arrows to it.</p>
    <p>Any advice? </p>
    <p>Have you used arrows in your work before? </p>
    <p>Apart from signs at airports I can’t recall seeing their use. Do chemists’ use them? Electricians?</p>
    <p>Certainly I see how they can be designed within a family style etc but what about their placement in the glyph? For instance: Other than the other arrows what glyphs should they work well with? A lower case o? Or the Numerals? Or Parentheses? Actually I see it could vary from arrow to arrow. The round ones vs the straight. The spilt vs. the whole...</p>
    <p>Thanks!</p>
