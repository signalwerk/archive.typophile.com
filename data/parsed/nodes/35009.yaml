      <p>For my take on the font vs. graphic debate, you need to know that at the time TeX was being developed 1980 it was very difficult and expensive to get graphics into a page. In book production in that time of galleys of phototype, it was nearly impossible, without huge cost.</p>
      <p>Thus TeX was built to allow any characters to be built into fonts, and Knuth even invented a program for creating fonts called Metafont.</p>
      <p>As Russel says, today graphics are a completely viable alternative. In fact, when I include math in my equations today in web-based courses, I use graphics, due to the inconsistent handling of math by different browsers. A gif will always show up. (I do feel bad that my pages are less accessible to the handicapped, as the alt tags only say “math formula”).</p>
