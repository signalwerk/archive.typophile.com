      <p><em>it would be nice to have complementary set of arrows with fonts for use in wayfinding signage,</em></p>
      <p>It would be nice to have a lot of things in fonts. I have recently been persuaded to include several historic Cyrillic characters in a retail font, why, I don’t know, as there are probably 2 or 3 people in the world who might use such a thing, and they are not font buyers (I don’t expect those who persuaded me to include the characters to buy the fonts either) —however, it is entertaining for a type designer to investigate such novelties, and we are “completists” by nature.</p>
      <p>The WGL4 which includes arrows and boxes does so, I believe, because it covers four Unicode groupings, one of which includes arrows and boxes, for no particular reason, other than they might as well be grouped somewhere.</p>
      <p>What is the correlation between what is useful to font buyers and what is in fonts?<br>
      This has been cocked up digitally from day one, as you can tell just by looking at your keyboard.</p>
      <p>These days, wayfinding systems don’t use serif fonts, conventional wisdom being that these are less legible and therefore unsuitable, so Kris, why bother? Why not add something equally useless, such as a unicase or Bold Italic Small Caps?</p>
      <p>If your typeface really is designed for a specific use, then some special characters which address that usage can act as a “gimmick” to draw attention to that and position the typeface in the marketplace/collective conscious. Otherwise, they are a distraction and a dilution, and may even be counter-productive by suggesting inappropriate usage. </p>
      <p>The astrological symbols in Josh Darden’s Corundum were spot on, a genuine novelty in a font (quaint ct and st ligs have been done), but appropriate to the genre. So they serve a purpose, even if those who buy the font don’t use them.</p>
