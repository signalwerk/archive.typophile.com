      <p>stephen heller's graphic timeline book may come up to the 60s.</p>
      <p>you might want to take a look at the whole decade from a historic point of view as this country changed exponentially from about 1963 on.</p>
      <p>you might contact house industries, they purchased the photo lettering library which developed through the sixties then exploded in the 70s (i think) so they might know some interesting stuff.</p>
