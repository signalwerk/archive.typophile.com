    <p>Hi,</p>
    <p>We have to make books in InDesign, and the content we receive would be in XML Format and also an RTF file is given with same content, what we do currently is copy and paste the text in InDesign document and start formatting te content accordingly. But we are having huge volumes like more than 6000 pages and similarly we are having 8-12 vilumes, i want to know if we can get the styles directly in InDesign and start working on  them.</p>
    <p>For eg: we have the below content</p>
    <p>1(1)   [Short title and commencement]</p>
    <p>Here there should be a para created and the number should be bold. I'm really unable to understand how to do it. please help me with this. And also our vendors need the IDML file along with the PDF. please let me know how i can do this.<br>
    Also please suggest me some good tutorials regarding this.</p>
    <p>Thanks.</p>
