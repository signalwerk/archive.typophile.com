      <p>Yes, but it is all custom work. You need to discover the <strong>structure panel</strong> within InDesign, and the delights of scripting. Maybe hiring a consultant would save you so many hours that in the long run, you'd save a lot money...maybe not. </p>
      <p>And no, I'm not offering services, I speak rather as one who has taken advantage of them. Our conversion time for manuscripts dropped dramatically after my business partner did this kind of work.</p>
