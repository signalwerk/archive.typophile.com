    html: |-
      <p>What I know of Greek fonts first comes from the TeX documentation and I understood that the word "apla"  was used to refer to that type of Didot font with rolling stress. Here is a link <a href="http://www.tex.ac.uk/tex-archive/help/greek/greek.faq">http://www.tex.ac.uk/tex-archive/help/greek/greek.faq</a> and what is said about it</p>
      <blockquote><p>
      Levy made his Greek fonts after the Didot design, a typeface which was originally created two centuries ago by the famous Didot printers in Paris and which is still used extensively by Greek printers today. Among Greek<br>
      printers, this Didot typeface is known as "apla" (plain), but often outsiders call it incorrectly "Greek roman".
      </p></blockquote>
      <p>A version of Monotype Greek 90 is called Ἁπλᾶ by Haralambous' Atelier Fluxus Virus <a href="http://www.polytoniko.org/fonts.php?newlang=en#AFV">http://www.polytoniko.org/fonts.php?newlang=en#AFV</a> where Ἁπλᾶ might just mean "regular". So maybe I misinterpreted the documentation though Haralambous in a paper entitled "From Unicode to Typography, a Case Study: the Greek Script", has a  subsection 1.7.1 on the apla style where he includes the italic and the bold.</p>
    html_clean: |-
