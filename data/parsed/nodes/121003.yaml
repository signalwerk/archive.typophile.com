    <p>Dear Typophiles,<br>
    I would like to know the name of the font or whether a font family very similar to that I attached exists. I need a font family with polytonic greek. I found this font in same Einaudi books, such as Bruno Snell, La cultura greca (2005).</p>
    <p>IMPORTANT: Adobe fonts (like Arno, Minion, Garamond Premier), Times New Roman, Palatino, Baskerville are excluded.</p>
    <p>Please help me.</p>
