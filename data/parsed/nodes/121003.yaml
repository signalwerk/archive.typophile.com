      <p>Just to give an exemple of 'older' Adelphi greek font (from Giorgio Colli, la Ragione Errabonda, printed in 1982 still with metal glyphs - you can see some vertical traces between the letters):<br><img src="/sites/default/files/old-images/Font greco Adelphi_4218.jpg"><br>
      Interesting the effect of Baskerville and 'greek' combined in the same text, as in Einaudi Snell.<br>
      Some difference in the choosen form of 'rho', but indeed the same font.</p>
