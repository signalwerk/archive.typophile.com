    html: |-
      <p>Dear TEODF,<br>
      I don't know which font this actually is. But I can add that absolutely the same one has been used by Adelphi publisher for some 'older' books, as e.g.  La ragione errabonda by Giorgio Colli, up to about 1995. Afterwards, this publishing house used the more ordinary -and, I would add, more ugly- greek series of MS Times New Roman (!).<br>
      I know that when wanting something, one wants EXACTLY that; but at least I may suggest something appearing to be inspired by similar approach :<img src="/sites/default/files/old-images/sblgreeksample_4947.jpg"> provided  by the <a href="http://www.sbl-site.org/educational/BiblicalFonts_SBLGreek.aspx" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Society of Biblical Literature</a>.<br>
      It has the same 'broken' ends, some 'archaicity' in the ductus, but it differs for the light slant to the right and more explicitly in some features, as the theta design.<br>
      The hunting goes on</p>
