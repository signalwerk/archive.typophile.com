      <p>These numbers are  monoline with ball terminals, a letterform found on some manual typewiters. The closest fonts that I have found are <a href="http://www.myfonts.com/fonts/mvbfonts/mvb-fantabular-sans/" rel="nofollow">MVB Fantabular Sans </a> designed by Akemi Aoi, and <a href="http://www.myfonts.com/fonts/nicksfonts/esfera-nf/" rel="nofollow">Esfera NF</a> designed by Nick Curtis based on Beton.<br>
      Don</p>
