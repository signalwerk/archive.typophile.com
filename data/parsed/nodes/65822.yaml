    html: |-
      <p>Shango has a number of alternate glyphs, but I didn't see a matching U. I was going to suggest Gill Facia, which has an Alt U that has no stem, but the two sides are not the same weight, and the N doesn't have a full serif. Maybe Renko is right, but the U was fabricated by mirroring the left side of the U.</p>
      <p>- Mike Yanega</p>
