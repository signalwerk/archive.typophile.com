      <p>I think the Q is not a font. The serif is unusual in that the U is not contrasted. Golden Cockerel Initials is like this, but the C and E don't match. I seem to recall that some Gill serifs may have had this sort of U, but I need to look more.</p>
      <p>- Mike Yanega</p>
