      <p>Ah, so you like big business. You're going to love the new Monotype conglomeration.</p>
      <p>There is so much nonsense in the article you cite, I'll make just one of many possible comments:</p>
      <p>Yup, Bitstream "copied" Linotype fonts. Probably because most of the top talent in the drawing room at Linotype U.S. (mainly the artistic guys, not the corporate) left to form Bitstream. (Aside: I believe that David Berlow left Linotype to start FontBureau without a stint at Bitstream. And while not designers, I wouldn't call either Cherie Cone or Mike Parker "corporate.")</p>
      <p>Since (1) corporate strategy at Linotype, at the time a subsidiary of Allied Chemical, was simply to rake in profits (which included doing the bare minimum to the old fonts to sell them in the new digital world), and (2) since you cannot patent a type design, (3) Bitstream did the work. </p>
      <p>It was pretty generally felt at the time that the Bitstream PostScript fonts were far better than the Linotype, but not as complete -- At that time, Bitstream rarely offered old-style numbers, small caps, etc.</p>
      <p>Yeah, I was there in the 1980s, and a locked-in Linotype customer. Before PostScript, high-end Linotype fonts were locked to a particular typesetting machine. "Particular" here means not only brand, but individual machine. If you bought a new machine,  you bought the fonts all over again, albeit with a discount. BTW, a maintenance agreement for the $20,000+ machine was about 1/5 the purchase price. In other words, you bought it all over again every 5 years, even if nothing went wrong. </p>
      <p>Of course, you didn't have to have a maintenance agreement. But parts carried quite a markup, and could be hard to get except from the parent company. And if you weren't on contract, time went for $100/hour as I remember, &amp; started when the technician left for the airport... I believe you picked up the plane ticket...and technician availability was such that maintenance agreement customers came first... In other words, most everyone bought a maintenance agreement after the first breakdown.</p>
      <p>Linotype, Monotype, etc. were not about "artistic integrity..." What in this world is?</p>
      <p>BTW, did you know that when Sumner Stone opened the Stone Type Foundry, he had to license the "Stone" family from ITC in order to be able to sell it with the "Stone" name?</p>
