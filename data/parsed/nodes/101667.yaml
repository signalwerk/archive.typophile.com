      <p>First of all, I didn't call you unethical. Why are you making a personal attack? And don't pretend you're ignoring me when you're addressing things I write.</p>
      <p>I can't assume that somebody who released a font under the Apache license (especially as recently as Roboto) was unaware of other options, specifically ones that forbid resale. What I can assume is they were thinking what I've been thinking (which I've explained on Typophile but you seem to be conveniently ignoring): the Apache license brings in people (like me) who otherwise would have trouble justifying lending their efforts to -further- improving typographic social justice. I do it enough already! Do you think I can house and feed four kids just by selling Armenian fonts? Not having to make a usable Latin font for an Armenian+Latin system saves so much time, it's not even funny. Please, Charles, just try making a text font! And you'll see what I mean.</p>
      <p>And guess what I would do if somebody who released an Apache font regrets it and asks me not to make money from it? What about you? If the designer of a libre font you rely on wants to switch it to proprietary and asks you to buy it or stop using it (even though he would have no legal or practical basis) what would you do?</p>
      <p>But enough about me. Do you think Bitstream was wrong to apologize?</p>
      <p>BTW I started designing type (if only bitmap fonts) in 1982, but frankly didn't start "mingling" until the late 90s. However I've read/talked about previous eras with many people. Many of those people lost respect for Bitstream; some of those regained it when they apologized.</p>
      <p>hhp</p>
