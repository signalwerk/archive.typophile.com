      <p>Ethics:</p>
      <blockquote><p>No, no, just the stuff I can add Armenian to and sell. As far as I can tell only the Apache license (does the version matter?) would allow that.</p></blockquote>
      <p><a href="https://web.archive.org/web/20150123121009/http://typophile.com/node/99972" title="http://typophile.com/node/99972">http://typophile.com/node/99972</a></p>
      <p>Legal, sure. Can't see how it's ethical. Probably I'm missing something in my understanding of ethical principles. I can't understand a lot,  like with the far right in the U.S., who want to go back to the good old days and favor life-saving medial practices (now that we've gone beyond the relatively cheap blood-letting) only for those who can afford them, or the far left, who will help their neighbor only if it can be done through some anonymous program that limits total liability. No doubt a defect in me that Hrant will expound on, and I will ignore.</p>
      <p>* * *</p>
      <p>As for type in the 1980s, how many of you know how it was sold? Who designers worked for? How much work was needed aside from the "design"? That was the climate that gave rise to Bitstream. Also, a bit earlier, to Compugraphic, A-M, etc.  </p>
      <p>BTW, "Compugraphic" was also the format recommended by Bringhurst's publishers, Hartley &amp; Marks, for storing all text data, until Quark came along. At that point, they recommended storing all data in Quark. And that made such great sense to everyone -- those of us who said "wait a minute" were shouted down. Our company stuck with ASCII, &amp; guess whose files are most easily convertible today? Times and technologies do seem to matter.</p>
