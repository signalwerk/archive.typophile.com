      <p>None of that makes it ethical to plagiarize. Which is exactly why some years ago Bitstream delivered a heartfelt public apology at an ATypI conference (Leipzig?) and announced they would no longer stoop so low. I fondly remember being one of the first audience members to applaud them, and to this day I remain impressed and proud.</p>
      <p>Damage has been done, but to me at least the case is closed.</p>
      <p>hhp</p>
