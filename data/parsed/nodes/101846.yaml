      <blockquote><p>I know nothing about French copyright law, but the book appears to be over 70 years old, which would make it public domain material in the U.S.</p></blockquote>
      <p>No longer true, unfortunately, due to Mickey Mouse. (Insert usual disclaimer that you really need to ask a lawyer, not us.) The copyright term in France is life of author plus 70 years (this probably counts as a corporate work by D&amp;P, so it has probably been public domain in France after 2007), but the peculiarities of (1) how the US applies copyright law to foreign works and (2) the Mickey Mouse extensions to copyright term in the US mean that because it was published after 1926, it won't be public domain in the United States before 2032:<br>
      <a class="freelinking external" href="http://copyright.cornell.edu/resources/publicdomain.cfm" rel="nofollow">http://copyright.cornell.edu/resources/publicdomain.cfm</a></p>
