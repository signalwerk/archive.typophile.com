      <p><em>I was wondering if anyone had any information on the copyright of this document? I'm attaching what I think to be the colophon, and title page. After running it through Google Translate it seems to not contain the information, as an American, I usually think of defining a copyright.</em></p>
      <p>Linotype would own the rights to the Deberny &amp; Peignot library, which means now that ultimately Monotype does; I would get in touch with them. The page you scanned isn't the copyright page (if there is one); it's just the traditional note at the end of French books about where and when it was printed. </p>
