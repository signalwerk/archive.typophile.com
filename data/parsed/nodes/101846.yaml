    <p>At my local public library they have a pretty extensive collection on printing.</p>
    <p><a href="http://www.provlib.org/spc-updikeephemera" title="http://www.provlib.org/spc-updikeephemera">http://www.provlib.org/spc-updikeephemera</a></p>
    <p>I've been looking for something to digitize and distribute online to promote the collection and that would also just be cool for people to have/have access to. I came across a specimen book for Peignot that was printed in an edition of 50, one for this collection specifically. I was wondering if anyone had any information on the copyright of this document? I'm attaching what I think to be the colophon, and title page. After running it through Google Translate it seems to not contain the information, as an American, I usually think of defining a copyright.</p>
    <p>Is it legal for me to scan this document and put it online? Does anyone know who I could contact to get permission or find out?</p>
    <p>Also, is this something people would be interested in seeing? As Peignot is available as a digital font it seems like this might not be as compelling as some of the other stuff in their collection. However, it does seem kind of unique because of the low print run, and it's really nice to see in person (which I know is sort of contradictory to digitizing it, but maybe it would compel people to visit). Is there anything else people could recommend looking for in that collection that may be of more interest to people? There's some 20th century stuff, but I think the bulk of the collection is 19th and 18th century –&nbsp;which may be more uncommon?  The collection is pretty extensive, and I'm not too familiar with typographic history, especially stuff that hasn't been digitized. Any advice on the matter and how to approach the collection is greatly appreciated. </p>
    <p>Thanks.</p>
