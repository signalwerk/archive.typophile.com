    html: <p>Yes, each case is weighed against four factors, one of which is “quantity or percentage of the original copyrighted work”, but that is only one quarter of the balancing test. It’s true that the law is quite fuzzy on Fair Use and there are many examples of two similar cases that have fallen on either side of the fence in court rulings, so of course it’s best to first ask permission of the copyright holder. But I think the exception could apply to this project.</p>
