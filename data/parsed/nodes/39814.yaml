      <p>&gt;Quite recently Avant Garde was completely redrawn... then the obliques were just slanted. </p>
      <p>This was discussed here (I think) and on <a href="http://typographica.org/001029.php" rel="nofollow">typographica</a>. I think it would be wrong to say it was "completely redrawn". I think it would be better to say that it was reworked and extended. ITC made the decision to maintain backward compatibility with the existing version of the font and that drew criticism with some people seeing the effort as a somewhat wasted opportunity.</p>
