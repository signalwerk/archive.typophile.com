    <p>I've been researching obliques in preparation for the execution of the style in my own typefaces, and have found that Futura's oblique is literally nothing more than a 9 degree slant applied to the corresponding non-oblique weight. Now, while obliques are certainly simpler than true italics, they're still supposed to be more than just mechanical slanting. I might expect this from a cheaper face, but in the case of a designer-favorite like Futura, I was rather surprised.</p>
    <p>Is this more common than I apparently think? Futura's Oblique pays no attention to the changes that need be made to stroke width, diagonals and curves.</p>
    <p>BTW - For the experiment, I created two text boxes in Illustrator. Both were filled with A-Z, a-z and 0-9. One was in set in Futura Light, the other was in Light Oblique. I then converted them both to outlines and sheared the first text box (Futura Light) by 9 degrees. I then overlaid the two textboxes to find that EVERY glyph lines up EXACTLY.</p>
    <p>Strange stuff.</p>
