      <p>This is quite common with sans serifs. Adrian Frutiger used to use it with his typefaces—I'm told—because back in the day when type foundry drawing offices still employed 100s of letter drawers, it would save the company so much time and money.</p>
      <p>But if you look at Univers and Frutiger, as well as many other typefaces (like Helvetica, too) you will see that this is the case. Note that for new designs, this comes up way less. Good new families are expected to have true Italics. It seems to just be want the people want nowadays.</p>
