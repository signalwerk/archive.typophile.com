      <p>I agree on the aesthetic, I feel like the client really wants some sort of a mark go to with a typographic treatment, however. I do like the general feel of the type on these later ones, however, you think there's a way to integrate a mark into that? I think the craftsmenship/quality idea is on the right track, but I'm having a hard time visually representing that.</p>
      <p>When talking with the client, they were key to emphasize that they weren't the cheapest option out there, but they were quality and did things right the first time (as the contractor business here in Houston, post-hurricane, is filled with a lot of fly-by-night operations). A tagline might work, but their business is primarily in the countertop part of the job and not the cabinets/carpentry aspect.</p>
