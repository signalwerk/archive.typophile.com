      <p>To me, these are a little too modular- and techno-looking to represent "high quality". I'd go in a different direction.</p>
      <p>If I were creating a brand for a company with such a generic name, I'd have some fun with a (non-typographic) mark, and use very simple typography. But if they requested a monogram, then...</p>
      <p>Try playing with type that defies expectations. Granite is heavy and rigid, so maybe go with a thin, rounded sans. I don't know... just a suggestion. Let's hear what the others have to say.</p>
      <p> - Lex</p>
