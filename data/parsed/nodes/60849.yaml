    <p>Hi all, I'm working on a mark for a contractor that installs high quality custom kitchen and bathroom counters, Stone &amp; Wood Concepts. They lean towards a look that incorporates a monogram so I've been playing with these ideas based loosely on the "counter" idea with S &amp; W, I like the concept but none of these seem to be quite working. Any thoughts/ideas to possibly tweak these or take it a different direction? Thanks.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/sw_sketches01_5206.jpg"></div><p></p>
  html_clean: |-
    <p>Hi all, I'm working on a mark for a contractor that installs high quality custom kitchen and bathroom counters, Stone &amp; Wood Concepts. They lean towards a look that incorporates a monogram so I've been playing with these ideas based loosely on the "counter" idea with S &amp; W, I like the concept but none of these seem to be quite working. Any thoughts/ideas to possibly tweak these or take it a different direction? Thanks.</p>
