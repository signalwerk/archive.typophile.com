  html: |-
    <p>Hello all,</p>
    <p>We’ve just redesigned (or more accurately - had redesigned) our magazine and the dude has chosen freight micro as our serif font, which is nice. I quite like it, its a bit all over the shop in a nice way. But when it is display size all these little bits of mess look most scruffy and awkard. I can just about get away with using it all caps, but I don’t like being constrained this way. </p>
    <p>Could anyone kindly suggest some similar yet more suitable slabs for headlines so I may offer it to my bosses as a replacement?</p>
    <p>It would be most appreciated.</p>
    <p>Cheers,</p>
    <p>G T</p>
