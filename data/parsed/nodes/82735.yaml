    html: |-
      <p><cite>Put the small caps in the lc positions of a seperate font.</cite></p>
      <p>It's not heretical. I just don't think it pays off in efficiency. Yes, it's easier to space and kern the small caps when they're in the LC positions. But then you have a second font with a lot of duplicate characters in it. For instance, if you change the shapes or spacing of the caps in the original font, you have to migrate those changes to the small cap font. But you can't copy the kerning from the original font directly, because the UC-&gt;LC kerning means something different in the SC font … the complications escalate from there.</p>
      <p>As for the risks &amp; rewards of using terminal commands, I imagine most type designers could learn the basics of grep filtering and perl substitutions in a few hours. Since it will save weeks of your time in the long run, why wouldn't you?</p>
    html_clean: |-
