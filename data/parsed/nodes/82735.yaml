    html: |-
      <p>One more stupid terminal trick: if you also want to make a mathematical adjustment to the small-cap kern values before you import, add the following:</p>
      <p><code>| perl -pe 's/^(.*?)([-\d]+)(.*)$//;$val=$2;$val=$val*0.6;print $1.$val.$3'</code></p>
      <p>The part that says <code>$val=$val*0.6</code> is what converts the kern value. You can change this to whatever transformation you like — add 100 would be <code>$val=$val+100</code>, 50% would be <code>$val=$val*0.5</code>, etc.</p>
      <p>The code above will adjust the kern values by 60%. As above, you can append <code>| pbcopy</code> to the command to put it on the clipboard automatically. So putting it all together:</p>
      <p><code>cat file.afm | grep KPX | grep ' [A-Z] ' | perl -pe 's/KPX //'<br>
      | perl -pe 's/([A-Z]) /$1\.smcp /g'<br>
      | perl -pe 's/^(.*?)([-\d]+)(.*)$//;$val=$2;$val=$val*0.6;print $1.$val.$3' | pbcopy</code></p>
      <p>Using this command, you can remap all your cap kerning to small caps, and rescale the values, in one step.</p>
