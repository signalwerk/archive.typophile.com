    html: |-
      <p>John, </p>
      <p>if you put the small caps in a separate font, there would be no regular lowercase in that font either. </p>
      <p>If you put small caps into a separate font that only implements "c2sc", I see the benefits as follows:<br>
      1. The small caps will be accessible in all applications, no matter whether they implement OpenType Layout or not, and whether or not they have a UI for enabling OpenType Layout features. They will even work in Microsoft Office 2010 which does implement OpenType Layout and has UI for enabling OpenType Layout features but that UI excludes OpenType small caps (i.e. small caps in Word 2010 are still made by reducing uppercase letters).<br>
      2. The small caps will be visible to users when they are doing normal font selection from the font menu, so they'll be able to see what they'll get before they pick the font.<br>
      3. The users will actually be able to see at all that the font family has small caps. If you put small caps into the same font as lowercase, there is no way to see which font on a user's system actually has them, because no single UI exists to my knowledge for selecting a font that has certain layout features.<br>
      4. When used as a webfont, a font with small caps in a separate font will be much smaller than a combined font, and the small caps will be more accessible: every browser allows font selection, but very few support applying user-controlled OpenType Layout features.<br>
      5. In all existing font development tools, including refurbished classics such as Fontographer, it's much easier to space and kern small caps if they're encoded as lowercase.<br>
      6. Every automatic hinting process will perform better if the small caps are in a separate font, because there are fewer stem thicknesses and less chances to mix up alignment zones when small caps and actual lowercase are in separate fonts.<br>
      7. Font vendors can sell the small cap font separately, and the users can buy it separately. Instead of having one cheaper font without small caps and one more expensive with them, there are just two fonts. So a user who bought the font with lowercase and later gets the small caps font does not have to change existing documents (switch from "Std" to "Pro" everywhere). </p>
      <p>Even if 1, 2, 3, 5 and 6 were not true (i.e. better UIs existed etc.), there would still be no clear disadvantage of having small caps in a separate font over integrating them. Or can you think of a serious benefit for having integrated small caps vs. separating them? </p>
      <p>I obviously see the benefit of using OpenType Layout features in general, especially if one feature affects a reasonably small number of glyphs which heavily interact with the rest of the glyphs in the font (through kerning, mark positioning, ligaturing etc.). So most kinds of OpenType Layout features do make sense. </p>
      <p>But small caps in OpenType Layout don't make sense: </p>
      <p>1. When "smcp" is activated, small caps usually replace a huge number of encoded glyphs (letters, often also punctuation, marks etc.) -- so the font vendor ends up nearly doubling the size of the font even for the users who won't use the small caps ever. Which is especially important with webfonts.<br>
      2. Of course it does make sense to include uppercase glyphs in the small caps font, so yes, there will be some doubling in size either way. But while uppercase is often kerned with lowercase, and uppercase is often kerned with small caps, there are hardly any cases where lowercase would be kerned with small caps (and I don't just mean kerning, also other kinds of glyph interaction) -- which is an evidence that lowercase and small caps do not necessarily belong into one and the same font.<br>
      3. Small caps often end up being in a separate glyph run from lowercase or other characters anyway, because often users apply different formatting to them within the same line (e.g. different tracking, or slightly different size). </p>
      <p>So, what do you think?</p>
      <p>A.</p>
