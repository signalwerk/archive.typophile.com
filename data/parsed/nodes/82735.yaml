    html: |-
      <p>1.</p>
      <p>To remap kerning from caps to small caps, you can also use a terminal command. First, export the afm file with your kerning. Open the terminal window and do this:</p>
      <p><code>cat file.afm | grep KPX | grep ' [A-Z] ' | perl -pe 's/KPX //' | perl -pe 's/([A-Z])&nbsp;/$1\.smcp /g'</code></p>
      <p>Now you can copy the new kern pairs out of the terminal window and into the "Add Kerning Pairs" box in Fontlab.</p>
      <p>Here's how this works:</p>
      <p><code>cat file.afm</code></p>
      <p>This prints your whole file to the terminal window. (On the Mac, you can drag the file from the Finder to the terminal window and it will fill in the whole path &amp; file name for you.)</p>
      <p><code>cat file.afm | grep KPX</code></p>
      <p>This filters the afm for the kern pairs. </p>
      <p><code>cat file.afm | grep KPX | grep ' [A-Z] ' </code></p>
      <p>This filters the afm for kern pairs that involve the letters A-Z.</p>
      <p><code>cat file.afm | grep KPX |  grep ' [A-Z] ' | perl -pe 's/KPX //' </code></p>
      <p>This deletes the KPX at the beginning of each line.</p>
      <p><code>cat file.afm | grep KPX | grep ' [A-Z] ' | perl -pe 's/KPX //' | perl -pe 's/([A-Z])&nbsp;/$1\.smcp /g'</code></p>
      <p>This changes the single letters A-Z to A.smcp-Z.smcp. (You can change the 'smcp' to whatever your suffix is.)</p>
      <p>2. </p>
      <p>To generate test strings, you can use a similar approach. Make a text file with the test strings IN ALL CAPS.</p>
      <p><code>cat strings.txt  | perl -pe 's/([A-Z])/\/$1\.smcp /g'</code></p>
      <p>Copy the result into the Fontlab metrics window. (Again, you can change 'smcp' to whatever your suffix is.)</p>
      <p>You can also do this without a separate file:</p>
      <p><code>echo "MY TEXT"  | perl -pe 's/([A-Z])/\/$1\.smcp /g'</code></p>
      <p>This produces:</p>
      <p><code>/M.smcp /Y.smcp&nbsp;&nbsp;/T.smcp /E.smcp /X.smcp /T.smcp </code></p>
      <p>3.</p>
      <p>On the Mac, you can append <code>| pbcopy</code> to move the result to the clipboard automatically, which saves some mousing around the terminal window, e.g.:</p>
      <p><code>cat strings.txt  | perl -pe 's/([A-Z])/\/$1\.smcp /g' | pbcopy</code></p>
      <p><code>echo "MY TEXT"  | perl -pe 's/([A-Z])/\/$1\.smcp /g' | pbcopy</code></p>
      <p>4. </p>
      <p>Be warned that you can only paste a limited amount of text into the Fontlab metrics window. So if not all your sample strings are showing up after you paste, break them into smaller pieces.</p>
