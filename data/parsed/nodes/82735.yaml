    html: |-
      <p>Andreas: <em>Well, then you’ll have to re-type it.</em></p>
      <p>It isn't simply that you have to retype the text: you have to <em>change</em> the text.</p>
      <p>The most common use of smallcaps in the texts I work with is for organisational and other abbreviations. If the text has UN and USA, I really don't want to be changing it to un and usa just to access smallcaps. Remember, digital text gets repurposed for lots of different media, and changing text to affect display is a really bad idea.</p>
