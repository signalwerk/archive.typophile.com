  html: |-
    <p>Hi fellow typophiles!</p>
    <p>Im doing a new font that has small caps inside the regular version. I've also programmed the file with the "smcp" property and works just fine in OpenType.</p>
    <p>My problem is that I want to edit the spacing between the small caps letters in the metrics window, but i dont want to put "/H.SMCP /E.SMCP /L.SMCP /L.SMCP /O.SMCP", I just want to put "HELLO" and edit the spaces between the letters.</p>
    <p><strong>Is there an easy way to space the small caps in the metrics window?</strong></p>
