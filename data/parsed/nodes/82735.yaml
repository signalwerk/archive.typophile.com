      <p>Adam, good arguments, but...</p>
      <p><em>2. Of course it does make sense to include uppercase glyphs in the small caps font, so yes, there will be some doubling in size either way.</em></p>
      <p>Incorporating smallcaps into the same font = approx 1.5 times the number of glyphs (if using subroutines, this is true even if following Adobe's approach of duplicating smallcaps). Placing the smallcaps into a separate font = 2 times the number of everything, not just glyphs but also all the other font tables.</p>
      <p>I think the issue then becomes where you want your efficiencies and where you want to take your hits. As you say, for webfonts there may often be efficiencies in not including smallcaps in a font, but this is in general the argument for subsetting and is not smallcap specific. A lot of my clients are concerned with different kinds of delivery footprint and, believe it or not, hard drive footprint. [Did I tell you that significant parts of VOLT had to be rewritten to get the Gabriola font down to a size that would be accepted for Win7?]</p>
      <p>As you know, I'm also opposed in principle to font makers doing things that let software developers off the hook for supporting layout features.</p>
