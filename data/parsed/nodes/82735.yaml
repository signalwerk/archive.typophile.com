      <p>Yes, the last method is currently the only workable: </p>
      <p>1. Compile the features in the OpenType panel.<br>
      2. Open the Preview panel.<br>
      3. Switch to the OpenType Features tab of the panel.<br>
      4. Type in any string you want in the top text box.<br>
      5. Apply the features you want (e.g. "smcp").<br>
      6. From the bottom read-only text box, copy the output string.<br>
      7. Paste the string into the Metrics Window text box. </p>
      <p>We intend to improve that particular aspect in the upcoming release of FontLab Studio.</p>
