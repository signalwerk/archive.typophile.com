      <p>Whoops, one small fix — forgot to convert the new kern value to an integer.</p>
      <p>So instead of this:</p>
      <p><code>print $1.$val.$3'</code></p>
      <p>Use this: </p>
      <p><code>print $1.int($val).$3'</code></p>
      <p>And the revised code is this:</p>
      <p><code>cat file.afm | grep KPX | grep ' [A-Z] ' | perl -pe 's/KPX //'<br>
      | perl -pe 's/([A-Z]) /$1\.smcp /g'<br>
      | perl -pe 's/^(.*?)([-\d]+)(.*)$//;$val=$2;$val=$val*0.6;print $1.int($val).$3' | pbcopy</code></p>
