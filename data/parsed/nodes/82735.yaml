      <p>John, </p>
      <p>I think the entire notion of font format development is quite interesting because it keeps following a sinusoid where things are being disassembled, then assembled, then disassembled, then assembled etc. </p>
      <p>We started off with Type 1, where one font existed in several files (.pfb, .afm, .inf, .pfm -- and analogical on Mac), then we moved to TrueType where everything was in one file. But because of the codepages, things had to be split into several fonts, and then OpenType united them into one file. But now with webfonts, we're splitting them (not only because of webfonts -- also because of mixing various writing systems), but at the same time, we're working on "virtual unification" through composite fonts and the CSS font stack. </p>
      <p>IMO, according to Occam's razor, the "BASE" table and the "smcp" feature are "worse" solutions. I tend to think that these days, splitting font files physically at the boundary of what would become glyph runs when typesetting would make sense most. But for that, we do need a composite font mechanism. Actually, to a large extent, I feel that we already have one such mechanism: CSS. A CSS file can register a font family in the browser that points to various font resources for various styles and character ranges. </p>
      <p>I believe more and more, and at some point, when we'll be talking about installing fonts in applications, a CSS file will be what we'll be "installing". It should replace Composite Font Representation, SING and all the other stuff. Perhaps CSS should be extended to incorporate some aspects of what is in CFS -- but don't you think that CSS is possibly a better solution than CFS, SING etc.?</p>
      <p>Best,<br>
      Adam</p>
