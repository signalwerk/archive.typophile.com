      <p>John, </p>
      <p>1. Put small cap glyphs into lowercase positions of a separate font.<br>
      2. Add a "c2sc" OpenType Layout feature that replaces uppercase glyphs with the lowercase glyphs. </p>
      <p>Look at Adobe's Trajan Pro or Sava Pro. That's exactly how it is done there :) </p>
      <p>More on small caps in a separate font at <a href="http://typophile.com/node/32455" title="http://typophile.com/node/32455">http://typophile.com/node/32455</a> :)</p>
      <p>Best,<br>
      Adam</p>
