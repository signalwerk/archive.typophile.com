      <p>I do very little typing to kern my small caps (or any set of glyphs) by just using find/replace. <em> (I use BBEdit 'cuz it's fast and easy to use for just this sort of thing.)</em></p>
      <p>For instance, I take the whole of the small caps text from the kerning window: </p>
      <p>/a.smcp/b.smcp/c.smcp/d.smcp/e.smcp/ ...and so forth</p>
      <p>and do a find a replace of the / with, for instance, /Y/ so I get:</p>
      <p>/Y/a.smcp/Y/b.smcp/Y/c.smcp/Y/d.smcp/Y/e.smcp/Y/</p>
      <p>And just copy/paste that new line of text back in. I have all 26 small cap glyphs ready to be kerned with Y.  It works perfectly for any instance—punctuation, anything against anything. With kerning classes everything just falls into place right away; and because it pairs one with whatever set you like, you can kern both sides, one right after the other:</p>
      <p>/f/a/f/b/f/c/f/d/f/e</p>
      <p>f with the whole lowercase. Or period with all lower:</p>
      <p>/period/a/period/b/period/c/period/d/period/e/period/</p>
      <p>...and then all upper, then all small caps. Works great for parenthesis and other random parts that need to be next to one side or both of any set of glyphs, with very little typing so the focus is on the kerning, not the typing of the pairs to be kerned. I can kern large sets quickly because of how fast the permutations can be built. Bonus: because it is a long line of glyphs I get a better sense of the color of the overall text as I go so parts that are wrong stick out, and parts that are fixed fade back.</p>
