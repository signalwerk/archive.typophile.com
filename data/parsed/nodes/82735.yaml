    html: |-
      <p>Another option:</p>
      <ol>
      <li>Make a COPY of your original file.</li>
      <li>EITHER copy and paste your SMCP letters into their corresponding normal cap positions; OR scale the normal caps to the same size as SMCPs and adjust metrics accordingly.</li>
      <li>KERN as usual, then EXPORT METRICS.</li>
      </ol>
      <p>Then, open the .afm file in a simple Text Editor, and...<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/smcp_4703.png"></div><p></p>
      <p>Finally, OPEN your ORIGINAL file and IMPORT METRICS. choosing "Add imported kerning data to the current font" and SAVE.</p>
      <p>Yeah, a lot of steps, but should take less than fifteen minutes from start to finish.</p>
