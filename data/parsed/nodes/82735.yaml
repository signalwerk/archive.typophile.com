    html: |-
      <p>Adam: <em>I tend to think that these days, splitting font files physically at the boundary of what would become glyph runs when typesetting would make sense most.</em></p>
      <p>In my experience, most presumptions about what will constitutes glyph runs run into real world problems, of greater or lesser severity. Microsoft presumed that a change in text direction would break a glyph run, and as a result we can't apply necessary contextual substitutions relative to Arabic date signs across intervening numerals. Failure to roll common European punctuation characters into glyph runs with non-Latin scripts that now use these characters means that we can't kern to them. And so on. So I'm wary about dividing fonts along glyph boundary lines, because those lines are not well defined.</p>
      <p><em>...don't you think that CSS is possibly a better solution than CFS, SING etc.?</em></p>
      <p>Possibly, yes. More generally, and a subject for another discussion, I think there are good arguments to be made for pursuing font technology developments under W3C.</p>
