    <p>I am looking for a serif font, unfortunately I only have a rather low-res sample picture (attached)</p>
    <p>What I have figured out so far is that the bold text is "Block Berthold", but I can't figure out that serif font used in the other parts. There appear to be different styles of the same font used in the picture.</p>
    <p>Any help would be greatly appreciated!</p>
    <p>Thank you in advance!</p>
