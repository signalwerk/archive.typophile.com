      <p><em>I can’t think of a case where “ss01”-“ss20” could be hacked. These features are intended to be “non-semantic”...</em></p>
      <p>So hacking a stylistic set feature would involve using one to impose a semantic distinction, but that is true of pretty much any GSUB feature. The kind of example that comes to mind is using s stylistic feature to substitute a semantically meaningful variant that is not a true variant of the underlying character code. For example, in some Greek typesetting certain letters might be printed upsidedown, and this is semantically meaningful because it indicates a distinct pronunciation, and these forms really should have their own Unicode codepoints and be encoded in the text string. But because they are not (yet) in Unicode, some intrepid font developer might decide to treat them as stylistic variants of the regular letters. I would consider this to be a hack.</p>
