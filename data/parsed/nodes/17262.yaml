    <p>So, deriving from the topic here - <a href="http://typophile.com/node/16879" title="http://typophile.com/node/16879">http://typophile.com/node/16879</a> - what is the general feeling on using stylistic sets to accomplish some of what presently can’t be done with existing OpenType features (but some “crazy” people might want to do anyways) ? Lets say I want to make supersuperiors or a petite lowercase or special size and aligment just for end/footnotes, special form for captioning images, etc? The immediate problem from the user POV is that the same set from two different foundries or even fonts need not mean the same thing and there is no sensible way to memorize what which does. If the feature is used before registration, there is no real guarantee that it would be registered or registered with the same name thus creating a fairly dangerous minefield. </p>
    <p>Or should one always propose and register[1] a new OpenType feature for it and then wait with releasing? Never mind that as no app would support[2] it at the very least until a new version is out (even if then) so users couldn’t use it? Or is there a good middle ground? </p>
    <p>[1] However that is done, and if there will really be an ISO standard, I can imagine it will be the standard “please come back with a truckful of documentation in time for the standards next revision in 5 years”?</p>
    <p>[2] OK, so so far even support for stylistic sets is rather thin</p>
