      <p>I think the Stylistic Sets features would be entirely appropriate for something like ’a petite lowercase’. This is exactly the sort of thing the features were designed for.</p>
      <p>I think using them for something like specially tailored superiors for e.g. footnotes as opposed to ordinals, would also be appropriate and not at all a hack, so long as you implement the features so that the stylistic set feature is used in conjunction with the superiors feature. So you wouldn’t use e.g. ’ss01’ to map regular numerals to your special superior numerals, you would use it to map the superior numerals resulting from the ’sups’ feature to those special, stylistic forms. This is entirely legitimate, because what you are doing is applying stylistic variants of superior letters.</p>
      <p>Cross-font compatibility is always going to be a problem for anything involving stylistic substitutions, and there is no way around this. Ideally, applications should have the option to automatically turn off stylistic set layout tags when you switch fonts out of a particular family.</p>
