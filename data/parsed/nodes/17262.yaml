      <p>I can’t think of a case where “ss01”-“ss20” could be hacked. These features are intended to be “non-semantic” i.e. they do not impose a particular functionality of the glyphs. You can essentially put any variants you want to them. On several occasions, I have made them work together with other features, e.g. smcp or onum. </p>
      <p>Adam</p>
