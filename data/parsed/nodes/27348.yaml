      <p>did it again…</p>
      <p>Jason:</p>
      <p>“working at these sizes, (below 12pt) the rasterizer, OS, and formats [] become critical”</p>
      <p>All the rest is sane, just be a bit careful using “pt”, because e.g. “12 pt” can contain anywhere from ((LESSTHAN))12 pixels per em to 32 or more per em depending on OS and display device. Since that makes it possible for a 9 pt to be 20 pixels, or more, and 9 being a smaller size than 12, we always have to think in pixels, not points, like, I believe a gasp table.</p>
