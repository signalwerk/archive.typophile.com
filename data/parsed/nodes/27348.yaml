    <p>I’m having a feature developed for a web project that involves rendering type from 6 different typefaces at a pt size of 9-10px. We’re having problems with the quality at such a small size—gets very jagged. Anything below 12pt gets pretty screwy. We are basically generating a preview image on the fly from the font files. It works similar to the the preview feature here, however we’re not selling fonts: <a href="http://www.fontshop.com/">http://www.fontshop.com/</a></p>
    <p>Does anyone out there have experience with something like this? We’re using ‘glib’ and I believe everything runs through PHP or related programming. We have everything working great, it’s just that rendering the smaller pt sizes is giving us fits. My developer thinks it has something to do with anti-aliasing.</p>
    <p>Thanks,<br>
    William</p>
