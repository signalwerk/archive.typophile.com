    html: |-
      <p>Once we’re working at these sizes, (below 12pt) the rasterizer, OS, and formats used become critical. You’re working on a project for the web, so presumably the end user can use any modern OS and browser. What’s of concern is how you are rendering the image. Are you using TrueType OTF or CSS/OTF? What rasterizer are you using? A Win, OSX, or something custom? </p>
      <p>Another comment: regarding your comment, “..gets very jagged.”<br>
      A hand-hinted TTF/OTF on a Win system, would have the gasp table set to show B+W rendering at sizes below 12pt. This is because Anti-aliasing at these sizes tends to cause more problems than it solves. So the characters are rendered B+W (like a bitmap) so that it remains legible. This does result in a stair step affect, but it’s a compromise that needs to be made, if you’re hinting these small sizes.</p>
      <p>Another note, although there are more than a couple of dozen hand-hinted quality TTF/OTF fonts, the stylistic differences at these sizes all but disappear, as David mentioned,. The truth is, there just aren’t enough pixels to go around. This means that the differences between Arial, Helvetica, and even Frutiger or Optima, all disappear at these small sizes, when you have to make a legible glyph, and have no room for stylistic differences.</p>
      <p>Jason C</p>
