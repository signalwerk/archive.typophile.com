      <p>Walbaum is great for text setting. It has been used for such in Germany for over 150 years. Stateside, WIRED magazine uses (used?) a customized version of it, made by Matthew Carter.</p>
      <p>Maybe you can lighten up the text by adding more leading? Or you could try another Walbaum digitization, like <a href="http://www.linotype.com/1594/walbaum-family.html">Linotype’s</a> or <a href="http://www.myfonts.com/fonts/agfa/walbaum-mt/">Monotype’s</a> (Monotype’s certainly looks light—from the preview—to me; maybe it’d work?).</p>
