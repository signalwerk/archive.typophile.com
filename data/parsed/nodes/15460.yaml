    <p>I am redesigning a fashion magazine where the display faces are Didone/Moderne. For a while I was considering Melior as a body face but it’s simply too limited (not Open Type, not enough weights, OSF etc.) I fell in love with Storm’s Walbaum Text but as I’m setting it, the color starts to appear very dark, almost inelegant, on the page. I’m worried about going so counter-trend as most consumer mags are light. Can anyone think of a similar face with lighter color?</p>
