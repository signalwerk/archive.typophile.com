      <p>I was redesigning a magazine a few years ago, and I worked up some prototypes using several different text and display faces. When I showed them to the client, he said he didn’t want to discuss them with me for a few days, but instead would take the boards with him and get back to me. I asked why he didn’t want to at least give me some preliminary thoughts, and he said, “I want to take them to my mother and have her read through them. She’s 70. If she can’t read it, it’s no good to me.”<br>
      I’ll never forget that response, because it was so honest and so practical.<br>
      Walbaum has been used for a hundred years (I suppose it’s closer to 200), and it’s a beautiful face. But I’d work up some dummies with something more legible, such as Perpetua (with a good amount of leading) or even Palatino, just to compare. I don’t know. You said you were looking for suggestions.</p>
