    html: |-
      <p>Showing them would require me to still have them. I tend to discard glyph variations once I settle on what I decide is the final. Sometimes they live on in another design, but a cascade of 12 or 15 variations of a lowercase g tend to either be discarded, or filed away never to be found. Just as well, the closed bowl g I would draw today as an alternate would most likely be  very different than the one I drew 2 or 3 years ago.<br>
      I know that some designers tend to save everything, but I’m usually pretty liberal with the delete key.</p>
