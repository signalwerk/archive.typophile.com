    html: |-
      <p>The original design of Alfon began with a closed loop g. But it migrated to its present form. (through many alternates) Changing that character does change the entire feel of the face, so I’d rather not go there. If you absolutely feel Alfon works for your project, drop me a line about a custom version, but first I’d try it “as is”. It really works well as magazine text.</p>
      <p>Having spent the first 12 or so years of my career in magazines, I keep the needs of magazine AD’s in my head whenever I design a type family.</p>
      <p>James</p>
