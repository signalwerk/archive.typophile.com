      <p>If by "tughra" you mean: طغری then there is no font for this kind of calligraphy, "tughra" is just a writing style which calligraphers used for decorative purposes, and is way much complicated to make a font based on it.<br>
      There are some examples on this wiki page:<br>
      <a href="http://ar.wikipedia.org/wiki/%D8%B7%D8%BA%D8%B1%D8%A7%D8%A1" title="http://ar.wikipedia.org/wiki/%D8%B7%D8%BA%D8%B1%D8%A7%D8%A1">http://ar.wikipedia.org/wiki/%D8%B7%D8%BA%D8%B1%D8%A7%D8%A1</a></p>
