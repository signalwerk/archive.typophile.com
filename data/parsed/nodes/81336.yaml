      <p>Hello. The top font is typical of the old letter-press hand set Arabic fonts of the early and mid 20th century. It is calligraphic and elegant and has a lot of ligatures but technically it was not perfect as you can see from the gaps between the connected letters and rather poorly matched letter endings. The second one appears to be a simplified typewriter font. </p>
      <p>There are many modern computer fonts that can approximate either font - Windows' Simplified Arabic font for example is not too different from the typewriter font. Fonts.com has a Boutrous thuluth font that has a nice old-fashioned calligraphic look.  For more control on the appearance of  such old-style fonts you have to use  software such as Adobe's InDesign Middle East edition from Winsoft, and for even more sophisticated text handling of calligraphic Arabic you can get the Tasmeem plug-in for InDesign also from Winsoft but they are not cheap. There are many more such fonts and a few new systems for setting Arabic, but I cannot immediately recall their names.</p>
      <p>I am not sure what you mean by tughra font but I assume you mean calligraphic Arabic fonts.</p>
