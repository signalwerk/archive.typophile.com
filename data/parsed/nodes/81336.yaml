      <p>I saw the link and it seems that the font you were referring is out there, but I don't know any reseller, and also this font contains glyphs which are digitalized design of actual calligraphy peaces, You can't write anything in "tughra" by that font.<br>
      for second question I suggest you myfonts.com and linotype.com, you can search "arabic" and troll through the results, I can't recognize your fonts but I guess for the first one "lotus" could be a replacement, and for second picture it seems that the font is printed by typewriter because it has a monospace kinda letters (if I'm wrong correct me), and if so it's pretty hard to find a close match (almost impossible), but you can use "courier new" which contains arabic glyphs by default in windows and also is monospace.</p>
      <p>cheers, Bahman</p>
