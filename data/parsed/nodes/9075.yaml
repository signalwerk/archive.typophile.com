    date: 2003-02-13T02:42:00
    votes: null
    html: <p>It could be because you altered the ampersand, which means you have converted it to an outline, while the rest are not. <br> <br>Try converting all the fonts to outlines, if you want a more consistent look and see if it works. <br> <br>Otherwise you might need to alter the thickness manually.(?) <br> <br>Just a suggestion.</p>
  - id: 59144
    user_id: 1382
    user_name: silly
    user_path: null
    date_raw: 13 Feb 2003 — 5:01am
    date: 2003-02-13T05:01:00
    votes: null
    html: <p>Karen, <br>Thats exactly what I did. The ampersand was converted to an outline so I could manipulate it. But like I said, it only shows bolder in my jpeg and the factory wants vector art and it looks good in illustrator so I guess i'm ok. <br> <br>Jill</p>
