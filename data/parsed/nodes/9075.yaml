    date: 2003-02-10T21:36:00
    votes: null
    html: "<p>Other options: <a href=\"http://www.philsfonts.com/detail.html?sku=AG61204307M1\" target=\"_blank\">English Sackers Script</a> and <a href=\"http://www.philsfonts.com/detail.html?sku=AG61214501M1\" target=\"_blank\">Citidel Script</a>,  <br><a href=\"http://www.philsfonts.com/detail.html?sku=BQ90071002M1\" target=\"_blank\"> Englische Schreibschrift</a>, <a href=\"http://www.philsfonts.com/detail.html?sku=BT00059301M1\" target=\"_blank\">English 111 Adagio</a>. <br> <br>Would be interesting to know the origin of the logo, Jill. <br>If it's an older design that may explain the lack of a  <br>digital font to match. Whether it's old or not, I'll bet you  <br>won't find an ampersand exactly like that one. My  <br>guess is that it was altered so the trailing stroke didn't  <br>hit the \"Company\".</p>"
