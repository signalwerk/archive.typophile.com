    html: <p><img src="http://www.typophile.com/forums/messages/83/6543.jpg" alt=""> <br> <br>Ok, the customer did not want to purchase fonts so I had to work with what I have. She said to get as close as possible. I used Shelley Andante Script for the "W" in William and the "r" in Blair. I then used Palace Script for the rest of the text and altered the ampersand to look as close to the original. This is how it turned out.</p>
