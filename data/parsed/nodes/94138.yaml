    <p>I suspect I might only receive help for the main body text here. The numbers to the right were moving scores. I am not sure if they were even a font. The numbers to the left (in the second picture only) were static but might be the same font as the main body. If I can find out what all three are then I will be so delighted!</p>
    <p><a href="http://goodeveningeurope.com/fonts/1959score.png" title="http://goodeveningeurope.com/fonts/1959score.png">http://goodeveningeurope.com/fonts/1959score.png</a></p>
    <p><a href="http://goodeveningeurope.com/fonts/1959score2.png" title="http://goodeveningeurope.com/fonts/1959score2.png">http://goodeveningeurope.com/fonts/1959score2.png</a></p>
    <p>These examples are from the year 1959, a show in France. I am not sure if that helps.</p>
    <p>Thanks very much in advance for your help. If you need some more samples of this font do let me know.</p>
    <p>Is the font available online? Can I read about it and its designer anywhere?</p>
