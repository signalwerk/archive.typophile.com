    html: |-
      <p>The typeface appears to be a condensed version of Aldus (designed by Hermann Zapf, 1954), a very close cousin, or a hand-drawn variation of a similar Venetian-inspired typeface.</p>
      <p>The lack of a serif on the crossbars of the F and E, as well as the configuration of the serifs on the S, G, and C, appear to be a good match.</p>
