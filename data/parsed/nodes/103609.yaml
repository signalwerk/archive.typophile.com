      <p>I associate ë and ï with French (which I learned at school) and ü with German (which I didn’t, but nonetheless occasionally encountered)—associations which date back to before I made fonts. </p>
      <p>That seems straightforward, as ë and ï are quite common in French, and used in loan words to English such as Noël and naïve (and Citroën), whereas ü is rare in French, but common in German, and especially so in loan words to English such as führer (and Mötley Crüe).</p>
