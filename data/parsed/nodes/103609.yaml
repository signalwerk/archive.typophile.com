      <p>For some bizarre reason, an o-double acute seemed to be translated into o-tilde when I was typing it in. Maybe if I had posted it, it would have displayed correctly.</p>
      <p>As for Swedish-language education being compulsory in Finland, I can see that many people would campaign against devoting a significant fraction of the school year to learning a language of purely local interest. In Continental Europe, of course, second language learning does loom large; but I would have thought that if another language besides English were taught, the next choice would be French or German.</p>
      <p>Learning a language is an enormous investment in time and effort, so I see no reason to apologize for the fact that such choices will be made on the basis of raw economic and political power rather than other criteria.</p>
