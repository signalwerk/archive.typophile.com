      <p>If we're limiting ourselves to diacritics, the macron makes me think of modern representations of Classical Latin and Greek or in romanizations of languages like Japanese, and only then Latvian. Similarly, the breve makes me think first of the McCune-Reischauer romanization of Korean rather than Romanian or Vietnamese. So often I associate diacritics with cases where they would not have been used in the native orthography (Classical Latin originally would not have used macrons or breves).</p>
      <p>Even within a single language, diacritic use can be associated with particular variants, as in the issue of polytonic vs monotonic orthography in Greek. The former is associated with Katharevousa and the latter with Dimotiki, though not exclusively.</p>
      <p>For me, diacritics are too small a unit to be associated with particular languages. Once you have a base letter, you can go further. Others here have associated the ring with Swedish based on å (though that would also work for Norwegian or Danish), but once you put the ring on a u to get ů, it screams Czech. Even without diacritics, digraphs and trigraphs and n-grams of increasing lengths are much more closely associated with particular languages. For example, wh is English, gy is Hungarian, tsch is German, and so forth.</p>
