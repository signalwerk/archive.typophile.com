      <p>Hoping/intending to separate the diacritics from base letters, I would say that to me the circumflex is most strongly French, while the umlaut (diaeresis) is most strongly German. But that might have to do with an ignorance of smaller European languages during my youth. BTW I remember Asterix's "La Grande Traversée" where they ran into Danes, who were basically speaking French but with O/o replaced by Ø/ø! Even their dog -a Great Dane, duh- barked "Wøøøf".  :-)</p>
      <p>I guess we'd need to do a large-scale survey (perhaps in the form of a game).</p>
      <p>hhp</p>
