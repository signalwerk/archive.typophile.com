  html: |-
    <p>From the ‘tips’:<br>
    <cite>Link to content with [[some text]], where "some text" is the title of existing content or the title of a new piece of content to create. You can also link text to a different title by using [[link to this title|show this text]]. Link to outside URLs with [[http://www.example.com|some text]], or even [[http://www.example.com]].</cite></p>
    <p>When a link is inserted by using this square brackets syntax <strong>and</strong> it is not preceded by any other character, the conversion doesn’t take place. See <a href="http://typophile.com/node/68388#comment-401281" rel="nofollow">Andreas’ comment</a>.</p>
