    <p>I am working on a massive project—a 100 foot by 24 foot wall hanging that will be printed in smaller sections. I’ll be working with the printer from the start to avoid borking the project, but I want some advice from anyone else who has done this.  I know that I can’t do something like this without specialized software, so would it make sense to develop the sections as individual Illustrator or Indesign files and create a large Indesign document (to scale, anyway) for the entire wall and place the files into that to put the whole thing together for comps? Or should I just do one scale piece and then break it up when I print? Also, are there any good books on graphics at this sort of scale?</p>
