    html: |-
      <p>There are several other font editors out there. Some are not advanced enough for professional type designers, which seems to be the main audience here.</p>
      <p>Here are a few others you might want to include:<br>
      DTL Font Tools - <a href="http://www.fontmaster.nl">http://www.fontmaster.nl</a><br>
      FontCreator - <a href="http://www.high-logic.com/font-editor/fontcreator.html">http://www.high-logic.com/font-editor/fontcreator.html</a><br>
      FontForge - <a href="http://fontforge.github.io">http://fontforge.github.io</a><br>
      Fontographer - <a href="http://www.fontlab.com/font-editor/fontographer/">http://www.fontlab.com/font-editor/fontographer/</a><br>
      Type - <a href="http://www.cr8software.net">http://www.cr8software.net</a></p>
      <p>I think most font designers use more than one font editor, along with other font related utilities. Also be aware not all editors are available on all platforms. Glyphs is only available for Mac while FontCreator runs on Windows.</p>
      <p>Note: I'm the main developer of FontCreator, so I can't tell you which font editor I prefer ;-)</p>
