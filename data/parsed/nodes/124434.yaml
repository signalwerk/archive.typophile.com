    <p>Hey TypeNerds!</p>
    <p>I'm about to do a study (BA project) on the identities of font editor software! And i need your help!</p>
    <p>I'm would like to hear which software for fontdesign is your number one choice? Fontlab, Glyphs, other? (and maybe why?)<br>
    Does the company behind the software, and its appearence on the market matter to you?</p>
    <p>Greetings from Denmark, and thank you so much for you time!</p>
