      <p>I know the sarcasm wasn’t directed at me, but for the record: Monokrom are not offering cheap fonts that resemble other, more popular, fonts. Our goods are fairly priced original designs. We do have a system for application licensing that offers less friction for the customer than a lot of our competitors’ systems do. The license are also moderately* priced for small projects. This makes a lot of sense to us in a world where apps are sold for a dollar on iTunes.</p>
      <p>* Priced slightly lower than a single user desktop license.</p>
