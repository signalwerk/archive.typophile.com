      <p>If you're looking for a (near) facsimile, <a href="http://www.gust.org.pl/projects/e-foundry/tex-gyre/adventor/index_html" rel="nofollow">TeX Gyre Adventor</a> or its predecessor, URW++ Gothic L (included in <a href="http://downloads.ghostscript.com/public/fonts/" rel="nofollow">this package,</a>), are both open source.</p>
