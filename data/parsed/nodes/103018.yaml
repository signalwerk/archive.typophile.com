  html: |-
    <p>Hi There,<br>
    I'm looking for an alternative to <a href="http://www.myfonts.com/fonts/adobe/itc-avant-garde-gothic/book/" rel="nofollow">Avant Garde Gothic Book</a> to be used on an app. The license is $2000-4000 for the server/app usages which is too steep for us. I've tried whatthefont and a few other places but don't seem to be able to find anything close.</p>
    <p>Could anyone suggest some alternatives which are less expensive or free? </p>
    <p>Thanks very much indeed!</p>
    <p>A</p>
  html_clean: |-
    <p>Hi There,<br>
    I'm looking for an alternative to <a href="http://www.myfonts.com/fonts/adobe/itc-avant-garde-gothic/book/" rel="nofollow" class="link-external">Avant Garde Gothic Book</a> to be used on an app. The license is $2000-4000 for the server/app usages which is too steep for us. I've tried whatthefont and a few other places but don't seem to be able to find anything close.</p>
    <p>Could anyone suggest some alternatives which are less expensive or free? </p>
    <p>Thanks very much indeed!</p>
    <p>A</p>
