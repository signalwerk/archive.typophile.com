      <p>Watching somebody get happy not having to pay for a font is unnerving to type designers, but I don't think Alex himself deserves a caustic reaction. We can't expect him to protect typeface design by turning down a good deal. I think all we can/should do is warn him to watch his back when using free fonts (while admitting that some of them are sometimes adequate, if rarely ideal).</p>
      <p>hhp</p>
