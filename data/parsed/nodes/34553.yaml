      <p>&gt;I have lived all my life with eights having an upper part that looks smaller than the lower part...</p>
      <p>In general whenever a character is divide in two, it looks more 'right' when the top is smaller than the bottom. Partly, there is the visual illusion Briem notes where eg the bar of the H (or the O slash) has to be higher than the center to make the top and bottom look equal. But more than this I think we react as if the letter is an object with weight, and things are more physically stable when the top looks smaller, not equal. Whatever the reason this holds with many horizontally divided characters, such as the B, S etc. Visual equality is what you may want in an H or O slash, but often not in an E and 8, etc. In almost every character, the mathematically simplest shape and proportion looks awkward or ungainly.</p>
