      <p>I echo what Christian said. </p>
      <p>Additionally you might want to know that many things that are totally okay in illustrator in terms of point placement, Bezier angles, etc are not going to be so okay in a font. That is because the engine that interprets illustrator files is much more complex than the many &amp; various engines that interpret font files. Disregarding this reality can cause weird bugs, printing errors or even no printing. Fontlab is more 'constrained' to help you keep your font from being a menace. ;-)</p>
      <p>If you are going to just make one font you can look up Adam Twardoch's tutorial/explanation about how to make your letterforms go from Illustrator files into Fontlab and skip some of the learning curve. You will probably want to run some Fontlab scripts/routines on your outlines though. Like 'place points at extrema' &amp; Maybe 'simplify' &amp; so on. That will help.</p>
      <p>However, if you want to make say... 5 fonts or more I suggest you embrace the learning curve and go 'all Fontlab'.</p>
      <p>The other thing is yo might want to post some samples on Typophile for technical critique. Or other kinds if you want that too.</p>
