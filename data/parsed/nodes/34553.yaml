    html: <p>With regard to the mathematical vs optical, the O and o slash actually are good examples. Note that they in effect have two of the 'x' style illusions in them of the kind that Briem mentions. As Mark Jamra notes <a href="http://typeculture.com/academic_resource/articles_essays/pdfs/tc_article_6.pdf" rel="nofollow">here</a>, to make it look 'right' you may want to rotate the middle line relative to the others. In this case what 'centers' can only be done by eye, particularly if your O and o are not vertically symmetrical.</p>
