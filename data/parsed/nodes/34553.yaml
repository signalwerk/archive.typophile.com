      <p>Rachel,</p>
      <p>It sounds  as if you are new to type design. Once you are in the mindset to make a typeface (as opposed to simply drawing a bunch of outlines), more and more of FontLab will make sense. I repeat what I've said here many times before: You find FL difficult because you're used to Illustrator. But Illustrator can't make a font. FL can do everything. The simple solution is to commit; go through the learning curve with FontLab and discover the many many advantages to having all your type design tools in one place. Once you've got experience with both, you discover that niether is "better" or easier to use; it's just a dead end to keep drawing letters in Illustrator when you have to move them to FL to make a font anyway. Aligning, spacing, kerning, are all operations so basic to type design, and yet you can't do them in Illustrator. Don't believe that the same operation won't be as simple in FL; it's just that you're comfortable in Illustrator right now. In a week of intensive use you can get comfortable with FontLab. </p>
      <p>Making an accented character is typically a more methodical process. Accents are useful for more than one accented character: make an accent and then use it in composites for a whole bunch of accented letters (agrave egrave igrave ograve ugrave etc.). You don't ever have to decompose them, and it's a time-saver to have the accent by itself, available as an ingredient to make more accented characters from. Composites allow you to make changes to the accent or to the base character that are propagated in the composite character. If you use your current method you would re-do a lot of work.</p>
