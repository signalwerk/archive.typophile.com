      <p>&gt; with [...] mathematical precision</p>
      <p>My background is in mathematics, so I will jump in. If the counter is perfectly circular then there is a center. If not, the counter has a "center of gravity" i.e. a point such that if you cut the counter in straight line through it, both parts have the same area, the same "amount of white". If you select a few points on the boundary of the counter and get their center of gravity, it won't be that of the counter. Moreover, even if you have a program that gives you with mathematical precision the center of gravity of the counter, as soon as you draw a thick line through it, the two white pieces in general stop having the same area, i.e. the same amount of white and I understand (please correct me if I am wrong) that what is important is that the amount of white under and below the slash be the same. Moreover, other issues due to the <a href="http://www.michaelbach.de/ot/ang_poggendorff/index.html" rel="nofollow">Poggendorff optical illusion</a> need to be taken into account. So the question is not a simple mathematical problem. If we forget about the necessity to correct the optical illusion, then we would need a program able to calculate the area above and under the (thick) slash; is there such a thing on the market?</p>
