      <p>I have worked with artists who use many to quite a few bezier points, so I know what many of you might be suffering through. I would love to give lessons on the minimalization of the bezier-drawn letter. It is so easy once learned.</p>
      <p>Having said that, how well would a letter with the minimum number of beziers transfer to Fontlabs? I am interested in creating some of my own ideas.</p>
