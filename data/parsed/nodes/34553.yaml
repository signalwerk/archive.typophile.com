      <p>I'm so very used to (guess what?) CorelDraw I always draw vectors in it. Its quite easy to import into FontLab if you follow these steps:<br>
      1. Measure your type in Corel appropriately (to FL's 1000 units)<br>
      2. Draw all your glyphs<br>
      3. Export each glyph into EPS<br>
      4. Open FL<br>
      5. Edit font properties - all guides should be easy if you measured glyphs in Corel appropriately.<br>
      6. start importing glyphs. Vectors should be perfectly preserved if your scale was 1:1<br>
      7. Do the font stuff like kerning etc.</p>
      <p>It's the fastest way for me because I've been using CorelDraw extensively since version 3.</p>
