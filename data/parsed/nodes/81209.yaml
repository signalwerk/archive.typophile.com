    html: |-
      <p>Depends on the situation, but in general I wouldn't do it for every project in your portfolio, but if you wanted to show your thinking process for a few of your projects I think that would be fine. </p>
      <p>Just keep in mind in that interviewers are usually busy people and you want to quickly show them your best work, rather than a lot of ideas that didn't pan out.</p>
