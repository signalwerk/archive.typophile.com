    html: <p>It really depends on the interview. Some people only want to see pristine finished work. Some people assume that young designers don't just pull pristine finished work out of thin air and want to know how it came to be and who else helped. Do some research on the interviewers, make a process book, take a sketchbook, and be prepared to show what you think will work best.</p>
