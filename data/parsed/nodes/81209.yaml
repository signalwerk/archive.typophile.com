  html: |-
    <p>Hello!<br>
    When preparing for a job interview, does one should or need to present drafts and previous design ideas (that were no longer used in the final draft) for the projects in the portfolio?</p>
  html_clean: |-
    <p>Hello!<br>
    When preparing for a job interview, does one should or need to present drafts and previous design ideas (that were no longer used in the final draft) for the projects in the portfolio?</p>
