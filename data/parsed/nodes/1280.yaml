    html: <p>BTW, Janet, it seems counter-intuitive but it might be better to use a slightly <i>extended</i> face at a smaller point size instead of a narrower face at your chosen point size. This is something to try especially if the atmosphere of elegance that narrowness conveys doesn't fit the subject - so it depends on that context. <br> <br>I'm still trying to figure this stuff out (since the people who really know what's going on, like the experts at FontBureau, won't talk freely about such "trade secrets") but it's starting to seem to me that when you match the economy (surface area usage) of a narrower font versus a wider font at a smaller size, the latter maintains a greater apparent size - something readers generally appreciate. <br> <br>Also note that the more linebreaks in the copy, the less narrowness will help you (versus wide&amp;small), because the horizontal savings you're accumulating over each line of a paragraph gets negated for every linebreak where you haven't saved an entire line thanks to the savings. Did I explain that OK? <br> <br>-- <br> <br>Thanks Kyle! Note that Patria's <i>italic</i> however starts becoming insufficiently differentiable from its roman "master" in the role of emphasis when condensed, because its slight slant starts becoming invisible. The good news is that the face has four closely gradated weights, so you can substitute the Light (or maybe even the Demi) italic in a body of regular if it's blending in too much (I'm talking about when it's condensed). BTW, Patria's close weights also enable acceptable fake smallcaps - this I learned from Kyle!  :-) <br> <br>hhp <br></p>
