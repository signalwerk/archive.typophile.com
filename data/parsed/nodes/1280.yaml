    html: <p>If you're looking for something that is actually condensed, just not a squished as the two you mention, then you might consider Minion Condensed or Kepler Condensed. They're not quite as narrow and work passably in text. Stone Print is also a decent option. You might also look at Concorde Nova. <br> <br>I find that Minion (regular, not condensed) runs a little on the narrow side, but probably not enough for you all by itself. It's too bad that you can't get the Multiple Master any more, because then you could make up just the right custom width -- something right in between. <i>*sigh*</i> <br> <br>Good luck. <br> <br>-- Kent.</p>
