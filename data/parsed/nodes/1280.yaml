  html: <p>I am looking for a serif type face that is slightly condensed or half condensed. <br> <br>Up to now I have been using ITC Garamond Condensed or Times New Roman Condensed. I feel the readability is jeopardized with these condensed faces when a certain amount of copy is required.  <br>I know that I can use regular book text copy and drop a point and use tracking to achieve a copy fit but would rather  use a slightly condensed serif text face if there is one available.  <br> <br>I have searched around but have not turned up any suitable face. <br> <br>The copy is usually for marketing brochures and I try to get the client to cut copy but there are times I just have to go with what is supplied.  <br> <br>Thanks for any suggestions.</p>
  html_clean: <p>I am looking for a serif type face that is slightly condensed or half condensed. <br> <br>Up to now I have been using ITC Garamond Condensed or Times New Roman Condensed. I feel the readability is jeopardized with these condensed faces when a certain amount of copy is required.  <br>I know that I can use regular book text copy and drop a point and use tracking to achieve a copy fit but would rather  use a slightly condensed serif text face if there is one available.  <br> <br>I have searched around but have not turned up any suitable face. <br> <br>The copy is usually for marketing brochures and I try to get the client to cut copy but there are times I just have to go with what is supplied.  <br> <br>Thanks for any suggestions.</p>
