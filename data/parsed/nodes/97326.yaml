  html: |-
    <p>I was wondering if there are any searches for font appearance that use exclusion or allow you to select multiple characteristics<br>
    lets say I want to find all fonts with open 4's and has 7's with a strike through and I don't care if they are san-serf or serf<br>
    but I also want to look for stencil fonts with double story E's.</p>
    <p>I would have to do separate searches. I'm kinda upset because instead of selecting for multiple characteristics I want in a font<br>
    I'm selecting one and eliminating all others.</p>
    <p>Are there any better tools out there besides identifont?</p>
