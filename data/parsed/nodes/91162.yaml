      <p>Helvetica for body copy? Helvetica is structured in a very monotonous way, making it hard to distinguish the individual characters and character-groups that make up words. Helvetica for body text is an absolute mis-use of it. Pick a humanistic sans if you need to go with a sans. Garamond has an absolutely different flavor than Helvetica, which tells me you do not know what tone the text should communicate. So for which tone do you want to go, what is the environment of the text?</p>
