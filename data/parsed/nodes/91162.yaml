    html: <p>I once read a great book on legibility which got burnt in a fire last november... but what I can remember is that reading, as a perception process, is led by the mind's never ending search for sense in the stimulations it gets. So in theory we could easily read any kind of text (in a broad not latin type centric sense) that has enough differentiation features to hold meaning... but then we also have to take into account eye comfort, familiarity and practicity which is why as time passes we become more and morep picky about what's readable. The more we refine visual comfort, visual and sintactic familiarity and practice, the more we will find different visual styles of text unsuited for speedy, effective and comfortable read.</p>
