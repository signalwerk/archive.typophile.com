      <p><em> “…what people were used to reading” …turns the craft into a mere art.</em></p>
      <p>I look at it another way.<br>
      Chick Corea expressed it on the liner notes of his <em>Piano Improvisations Vol. 1</em> album in 1971: “This music was created out of the desire to communicate and share the dream of a better life with people everywhere.”<br>
      One side of the album is quite lyrical and charming, dreamy in a conventional way. But the other side has a fair bit of experimental plinking and plunking. </p>
      <p>On the one hand, you could say the album was an artist expressing his own interests, but as the man said, he was sharing a dream, and it’s certainly inspired me.</p>
      <p>Type design isn’t music, but I don’t see why, in lieu of being merely functional, it can’t also have the quality of being able to bring delight through its formal beauty, and stimulate the intellect through the idiomatic play of design—and to do so subtly, with taste.</p>
      <p><img src="http://f.cl.ly/items/0X3b3c0F3o33063t2g2n/CoreaPianoImprov1.jpg"></p>
    html_clean: |-
