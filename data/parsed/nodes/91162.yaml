      <p>Kievit and Caspari and  work very good for long copy, even for a book, they are somehow close to garamond in proportions, structure and maybe even color. Quadraat Sans has a better color and better modulation. These three faces also have good italics.</p>
      <p>The thing with sans serifs is that most designers are used to set them a bit tight by means of negative tracking and in the case of body copy you need them to set them normally and with more leading that if you were setting a serif face because the visual cohesion of the line is weaker due to the lack of serifs.</p>
      <p>Also light sans faces are no good for long body copy and disastrous in books, you need the lines to have good color.</p>
