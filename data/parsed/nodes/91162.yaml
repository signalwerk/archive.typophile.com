      people will usually only reply when you say something they<br>
      don't agree with; if you cajole people they probably won't teach<br>
      you anything. As I once stated: "Blind speculation is the key to<br>
      efficient data mining." :-)  But you need titanium skin to go along.</p>
      <p>Just wanted to start off by saying that.</p>
      <p>--</p>
      <p>Yes, Helvetica is LOL for text. In fact for me the only way it<br>
      ever works is very light and very large. And no, it's not the<br>
      default sans for the web, because Windows (you know, 95%<br>
      of systems out there) doesn't even have it. Arial fills in for<br>
      Helvetica, and it's close (it's less un-texty) but anyway on-<br>
      screen things change so much compared to print that it's a<br>
      moot point.</p>
      <p>All things being equal, assuming there's no stylistic clash the<br>
      one sans that I believe in (in terms of textiness) is Legato. See<br>
