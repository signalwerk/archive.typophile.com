      <p>Familiarity is s complex thing. You can recognize<br>
      a letterform even if you've never seen it before.<br>
      And you can often recognize distorted or abstract<br>
      letterforms, although it might -tellingly- take more<br>
      than a fraction of a second. The main question in<br>
      my mind concerns immersive reading: how does<br>
      exposure to a specific style of letter affect its high-<br>
      speed decipherment? Although I don't know the<br>
      answer to that, I can confidently believe that the<br>
      inherent qualities of letterforms are not irrelevant,<br>
      that they contribute to how smoothly/quickly this<br>
      familiarity can be gained; I'm also confident that a<br>
      typestyle can have inherent flaws that place upper<br>
      limits on how comfortably it can be read no matter<br>
      how much you're exposed to it.</p>
