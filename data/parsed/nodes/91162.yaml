    html: "<p>That Gill Sans looks great. Probably a bit bigger point size than the standard book text however.  I agree with donsata, i really dont have any problem reading bold or black in running texts.  In fact I think the whole thing is kind of an old wives tale.  I was reading in \"Just My Type\" how people studying legibility based on what people could actually read (gasp, you mean not just a theory?!) found out it really had nothing to do with what was \"more legible\" based on the standard thinking: x height, large counters, etc...; but rather on what people were used to reading.  That is, what fonts were closest to the ones they see everywhere everyday.  I think that's pretty valid.  Think about the blackletter fonts used by the Germans for so long.  It takes me a great deal of effort to decode those forms sometimes, but the Germans, who saw them everyday, had no such troubles.</p>"
    html_clean: "<p>That Gill Sans looks great. Probably a bit bigger point size than the standard book text however.  I agree with donsata, i really dont have any problem reading bold or black in running texts.  In fact I think the whole thing is kind of an old wives tale.  I was reading in \"Just My Type\" how people studying legibility based on what people could actually read (gasp, you mean not just a theory?!) found out it really had nothing to do with what was \"more legible\" based on the standard thinking: x height, large counters, etc...; but rather on what people were used to reading.  That is, what fonts were closest to the ones they see everywhere everyday.  I think that's pretty valid.  Think about the blackletter fonts used by the Germans for so long.  It takes me a great deal of effort to decode those forms sometimes, but the Germans, who saw them everyday, had no such troubles.</p>"
