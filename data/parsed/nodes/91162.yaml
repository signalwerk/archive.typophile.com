    html: |-
      <p>Best way -- at least, to see what's current -- would be to go to a book store &amp; browse. If you want to see books with a sans as body type, stay with art and travel books, at least in the States.</p>
      <p>Yes, I'm saying we don't use sans serif for text much in the U.S. I believe Europe is a different story. But unless you're aiming at a European audience, or the author is willing to put up with diminished sales so that you can show 'em, by God, you would most likely be better off with a serif typeface.</p>
      <p>Having said that, we've used TheSans successfully in art books, usually semi-light, or regular if the setting size is small. Also Scala sans and Quadraat sans. </p>
      <p>We do set one (sort of) academic journal in Helvetica, <cite>boundary 2</cite>.  A number of people have tried to get them to change the typeface for the journal over the years; they won't. I guess if I worked it over some more I could make it a little more attractive. That's on my list, down near the bottom.</p>
      <p>* * *</p>
      <p>BTW, how does your Garamond work out for war stories?  I was appalled to see <cite>The Pacific</cite> set in Adobe Jenson. World War II as bought to you by the Italian Renaissance. Maybe one style doesn't fit all?</p>
