      <p>From <a href="http://designnavigator.daimlerchrysler.com/index.php?id=120&amp;lang=en" rel="nofollow">the website's typography page</a>:<br>
      <cite>"Should Corporate S not be available, the typefaces Arial or Times may be used. This particularly applies if the use of Corporate S is not recommended, e.g., in the case of data transfer with external partners."</cite></p>
      <p>Combined with:<br>
      <cite>External partners can order Corporate ASE from the manufacturer URW++ in Hamburg in exchange for a corresponding license fee</cite></p>
      <p>Hmmm, this is what more than likely happened I'm afraid. I imagine they subcontract the gearbox manufacturing. The keyword in the last quote is <em>can</em> I suppose... :(</p>
