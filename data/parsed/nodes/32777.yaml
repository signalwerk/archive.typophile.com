    <p>Maybe someone can appreciate my disgust when I got into a 2006 CLS (attached) the other day, to find Arial on the gearknob.  I found the same usage on the E500.  Both of these cars are top of the line luxury cars.</p>
    <p>I'm not a fan of Arial, but I'm even less tolerant when it is used instead of a typeface that formed part of an original design.  I feel so strongly that I sent letters explaining my concern to various Mercedes-Benz/Daimler-Chrysler offices and I haven't had a response yet.  Do you think they care?</p>
    <p>Look at the comparison, correct Merc typeface left, right is A (as seen in these models.)</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/merc5_5361.gif"></div><p></p>
