    html: |-
      <p>You can't help but wonder how this kind of thing could happen...<br>
      Working as a desktop publisher, I've seen my share of wrong type usage &amp; in 6 years I've only had one (!) housestyle instruction list sent along with the logo (this was for a big bank in Belgium that even has 2 different logo's; one to use if it ends up getting smaller than 2cm wide (if I remember correctly) &amp; another to use otherwise). The instruction list for correct usage of the logo was over 3 pages, but even having used this logo practically daily, I've only seen it once. Another horrible example is -also from a (big) bank- who sent along an advertisement we had to remake with the wrong type. I was very tempted to correct this, but after adressing my boss, I still had to use the wrong logo. It was a pretty obvious wrong logo as well... In case of a bank that is often run on "independent" terms, I can somewhat understand how this kind of thing could happen, but as for your Mercedes example, I just don't see hòw it could've happened. It's an unforgivable mistake! Get a BMW just in spite ;-)</p>
