  html: |-
    <p>It’s proudly announced that The Visual Arts e-magazine, Visualizer Magazine, has started to receive the products that will be sent by you talented artworkers.</p>
    <p>The e-magazine (V.M.) that’s prepared in English and Turkish, will be delivered only by Internet as free and based on “flash” and “.pdf”. The content of VM will be formed every issue on a different “Theme” and category pages like “News, Interview, Portfolio, Tutorial, Metronome, Bookends, VM’odel, Social Responsibility”.</p>
    <p>First theme of the first issue has been specified as “The Beginning of the End”. You can find the details out on following sentences.</p>
    <p>Best regards...</p>
    <p>DETAILS</p>
    <p>* PORTFOLIO: The pages that products except the “theme” will be introduced and artworkers will be introduced.<br>
    (e-mail subject title: "Portfolio")</p>
    <p>* TUTORIAL: The pages that intermediate and advanced lessons about visual design software like Adobe Photoshop will be published.<br>
    (e-mail subject title: "Tutorial")</p>
    <p>* METRONOME: Album advertisements and concert announcements for Heavy and Extreme Metal Music bands. Please share your announcements that you want to see on our e-magazine.<br>
    (e-mail subject title: "Metronome")</p>
    <p>* VM’ODEL: We’d like to see you on the pages of our e-magazine. Models or girls which want to be a model can send their pictures and CV.<br>
    (e-mail subject title: "VM’odel")</p>
    <p>RULES</p>
    <p>* TYPES: Graphic Design Works, Illustrations, Paintings, Photographs &amp; Fine Art Prints</p>
    <p>* SIZES : For portraits images 483x672 px, for landscape images 966x672 px</p>
    <p>* FORMATS: Jpg or Swf</p>
    <p>* CV: Real Name, Age, City, Country, Web Site &amp; Email</p>
    <p>* SUBMIT TO: <a href="mailto:vm@visualizermagazine.com">vm@visualizermagazine.com</a><br>
    (email subject title: Theme)</p>
    <p>* DEADLINE: December 19th, 2009</p>
    <p>WE WANT YOU TO KNOW;</p>
    <p>* The products that you send will be published on visualizermagazine.com and its official blog.</p>
    <p>* Products won’t be published without personal informations ( Real name, age, city, country, web &amp; mail).</p>
    <p>* All responsibilities about the contents of the products belong to art worker.</p>
    <p>* When you contact us for general reasons, please use the “General” title as subject title.</p>
    <p><a href="http://www.visualizermagazine.com" title="www.visualizermagazine.com">www.visualizermagazine.com</a><br>
    visualizermagazine.deviantart.com</p>
