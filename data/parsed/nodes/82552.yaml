      <p>Thanks, that’s really helpful. I should have realised that that was the style; it’s the lack of ornamentation which threw me.</p>
      <p>I think Koloman Moser’s lettering is most similar to the sample and is probably what interests me the most. It’s somewhat less extrovert than Klimt’s (e.g. the bars on the A are horizontal rather than at a 45-degree angle) which appeals to me.</p>
