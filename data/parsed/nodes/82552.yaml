      <p>Thanks for the further comments. I’m not sure how well a straight digitalisation of this would work, since it’s charm seems to be in the irregularity of the letters.</p>
      <p>I also like how the treatment of the accents changes depending on the size. Compare the ü in “Für Grosses Orchestra” to the ü and ä in “Für 4 Hände” in the lower right text-block. Or the C in the large “C F Kahnt” with the smaller one in “Copyright” on the line below.</p>
