    date_raw: 29 May 2011 — 4:28am
    votes: null
    html: <p>This was a very common lettering style at the beginning of the 20th century in Germany and Austria and numerous typefaces in this vein got issued from 1904 onwards, e.g. Negrita by Genzsch &amp; Heyse. You’ll find this and lots of other examples in Taschen’s “A Visual History of Typefaces and Graphic Styles” from page 74 onwards.</p>
