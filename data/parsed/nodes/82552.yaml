    date_raw: 28 May 2011 — 11:21am
    votes: null
    html: <p>This looks vaguely similar to a monolinear style of writing developed by Austrian calligraphy Rudolph von Larisch. He was influential in the early twentieth century century. I don't know if von Larisch ever did anything in the mode of Jugendstil, but it seems possible that artists who studied von Larisch's technique might have translated it into this kind of Jugendstil lettering.</p>
