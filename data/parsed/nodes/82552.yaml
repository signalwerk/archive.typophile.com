  html: |-
    <p>I come across a couple of title pages for some of Mahler’s Symphonies, which were published by Kahnt in Leipzig in the early 20th Century. They have the following quite attractive hand-lettering and I wanted to see if I could fine some more examples, but am not quite sure the best way to search for them.</p>
    <p>Has anyone else come across a lot of lettering like this or does anyone know what this style might be called (or if anyone has digitalised them)?</p>
    <p><img src="https://www.schubertiademusic.com/img/catalog-4/93/Mahler%206th%20title288.jpg"> (<a href="https://www.schubertiademusic.com/img/catalog-4/93/Mahler%206th%20title288.jpg" title="https://www.schubertiademusic.com/img/catalog-4/93/Mahler%206th%20title288.jpg">https://www.schubertiademusic.com/img/catalog-4/93/Mahler%206th%20title2...</a>)</p>
    <p>Many thanks,</p>
    <p>Jacob</p>
