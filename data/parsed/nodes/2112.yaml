    html: "<p><i>One reads best what one *wants* to read most.</i> <br>Instruction manuals get read when the thing won't work. (Of course, it helps if it isn�t set in notCaslon) <br> <br>Right, back to the rn vs. m discussion. Here is a sampling from one of my recent projects, intended for long text settings:  <br> <br><img src=\"http://www.typophile.com/forums/messages/30/20809.gif\" alt=\"\"> <br> <br>I�m curious to hear feedback about this kind of <b>r</b>. I chose it because I thought it solved many of the discussed problems at one go:* <br> <br>1. The low join helps with color. <br>2. The horizontal terminal pushes the text along, allows for a narrow <br>letter and helps distinguish the <b>rn</b> combo from the <b>m</b>. <br>3. Wide foot serif adds balance and helps color. <br> <br>Addmittedly, serifs give you more options to solve the r issue. At any rate, also note the Jenson influenced stair-step <b>m</b>. I hadn't thought of it, but that might also aid in distinguishing the two. That Jenson sure had his act together. <br> <br>*I also chose it after revisiting <a href=\"http://www.typeworkshop.com/index.php?id1=type-basics&amp;id2=&amp;id3=&amp;id4=&amp;id5=&amp;idpic=17#pictloader\">this resource</a>. Nick, they seem to feel quite the contrary to your solution. <br> <br>This is thought provoking. Thanks. <br> <br>Randy</p>"
