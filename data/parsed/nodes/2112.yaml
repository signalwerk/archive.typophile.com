    html: <p>What we really need is type that knows when it's being read, and by whom, and can respond accordingly. If the lights are out, it will even talk to you. <br> <br>We're a little bit along the way with the preferences users apply to web pages (as well as Text Zoom). <br> <br>LettError's Twin font, with the selection of glyph alternates being database-driven, is another step forward. <br> <br>Even without a dynamic interface, there are options, and could be more. Shania's latest album was recorded in Country, Pop, and Dance (europe only) mixes, color-coded. Many books come in large-print options. Harry Potter came with alternate adult and child covers, but the guts were the same. On-demand publishing should be able to offer readers a choice of settings. "Would you like that in Bembo or Times, or, for the really adventurous, perhaps a sans serif?" <br> <br> <br> <br> <br> <br> <br> <br></p>
