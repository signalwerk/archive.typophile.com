    html: <p><i>But in actual reading, a difference of half of a stem (not to mention the less relevant lower half) gets very easily lost, especially when it's in the x-height region.</i> <br> <br>Prove it. <br> <br>It seems to me that determining an optimal norm for the shape of a lowercase r is one of those rare things that could actually be relibaly informed by empirical study. Most reading studies try to determine too much, but if one focused solely on problems of word recognition involving different forms of the letter r, one might actually be able to draw a useful conclusion.</p>
