    html: <p>&gt;  why is most highway signage sanserif <br> <br>Part of it is cultural, but there's also the difference between legibility and readability, in terms of the reader having time to decipher a short word in the fovea (by compiling the letters, which have to be highly decipherable in adverse conditions of weather and lighting) versus immersive reading. Sans forms are more decipherable during deliberation. And note for example that highway signage is loosely spaced, while that's anathema in a book. <br> <br>BTW, one practical consideration for setting text on a fire extinguisher is that it's on a narrow cylinder, so you want a narrow font (unless you set the text along the length, which might however momentality confuse people), since you don't please having to twist the thing back-and-forth to read lines. <br> <br>hhp <br></p>
