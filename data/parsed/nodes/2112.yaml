    html: <p><img src="http://www.typophile.com/forums/messages/30/20743.gif" alt="modem"> <br> <br>The big eared, wider "r" doesn't get confused with "n" -- see top examples. <br> <br>However, it does introduce a big negative space in combinations such as r-t and r-v. So if you put it into a typeface, then other characters also have to be given extra negative space, so it doesn't stand out too much. That's what I did in Preface, with the wide, open-sided "a" and "t," and "i" with serif. <br> <br>A consequence of more open-sided characters is that the space between words becomes less distinct, which may or may not be a problem.</p>
    html_clean: <p><img src="http://www.typophile.com/forums/messages/30/20743.gif" alt="modem"> <br> <br>The big eared, wider "r" doesn't get confused with "n" -- see top examples. <br> <br>However, it does introduce a big negative space in combinations such as r-t and r-v. So if you put it into a typeface, then other characters also have to be given extra negative space, so it doesn't stand out too much. That's what I did in Preface, with the wide, open-sided "a" and "t," and "i" with serif. <br> <br>A consequence of more open-sided characters is that the space between words becomes less distinct, which may or may not be a problem.</p>
