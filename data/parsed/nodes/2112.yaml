    html: "<p>Hey, stop believing the WRBWWRM hogwash! <br> <br>But the divergence mechanism you describe would indeed be very effective, although computationally very heavy: you wouldn't just replace \"rn\" combos with something that looks less like an \"m\"* (you could do that just with OpenType), you'd need some serious code: first build a \"conflict network\" for the entire lexicon of a language (using \"confusion values\" assigned to different letter sequences), and then pairwise-diverge all boumas beyond a certain threshold. <br> <br>* Like maybe use an original-Cheltenham-style ascending \"r\". <br> <br>hhp <br></p>"
