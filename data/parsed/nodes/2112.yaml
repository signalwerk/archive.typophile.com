    html: <p>Hey, stop blaming the font! <br>What would be of more use for legibility would be a "shizzolator" that rewrote text to avoid visually ambiguous/difficult words.   <br> <br>For instance, Clearview has the commonplace "modern/modem" problem with the "r-n" combination. A "legibilizer" would replace words containing "r-n" with alternates, eg "contemporary" or "up-to-date" for "modern". It would also vary the length of adjacent words, and prefer words with extenders over those that don't. That would be bouma-bastic, Hrant, eh? <br> <br> <br> <br> <br> <br></p>
    html_clean: <p>Hey, stop blaming the font! <br>What would be of more use for legibility would be a "shizzolator" that rewrote text to avoid visually ambiguous/difficult words.   <br> <br>For instance, Clearview has the commonplace "modern/modem" problem with the "r-n" combination. A "legibilizer" would replace words containing "r-n" with alternates, eg "contemporary" or "up-to-date" for "modern". It would also vary the length of adjacent words, and prefer words with extenders over those that don't. That would be bouma-bastic, Hrant, eh? <br> <br> <br> <br> <br> <br></p>
