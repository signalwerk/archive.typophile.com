    html: <p>Hi Sveinbj�rn, <br> <br><i>it seems like i kind of missed my own party</i> <br>:-) Yeah, there�s this nasty habit around here of taking someones question and having a long stream of consiousness discussion without input from the original poster. Please forgive us. <br> <br>I should think focusing your attention on the instructive illustrations is priority number one. Secondly, the type (if any) should very, very short and perhaps at a larger point size 12 +. Since this is a school project, and funds are limited you might use something as ordinary as Myriad. Legible, with nice open counters. Likely you have it. <br> <br>Everyone wants to claim legibility to market their fonts. While there are some fonts that are in fact easier to read than others, if you find yourself in need of a fire extinguisher, chances are you grab the thing, aim, squeeze the handle, realize you need to take out the pin, pull the pin, and start shooting foam wildly. Chances are low, but you might take time to look at the little pictures, but you probably wouldn't read the written instructions. <br> <br>Myriad. Gill. Meta. Frutiger. These will work and are likely available. <br> <br>Randy</p>
