    html: "<p>&gt; a more pronounced, longer ear that curls down <br> <br>The danger there of course is that you're moving closer to an \"n\". <br>The x-height region of the Latin alphabet is already over-used and closed in on itself. <br> <br>Plus you're making the \"r\" wider (see #1 below). <br> <br>&gt; a wider \"r\", so that the space between the three vertical stems in \"rn\" is uneven <br> <br>And there you have three issues: <br>1) Word width is a key determinant of bouma resolution, and having divergence in letter widths (as in narrow \"r\" versus wide \"n\") helps a lot. <br>2) You could just use a kerning pair to achieve a similar (if lower quality) effect. <br>3) The gap at the lower-right of the \"r\" (especially in a sans design) might get too close to a word space. <br> <br>The great thing about an ascending \"r\" is that the space between the x-line and the ascender height is very poorly used in the Latin alphabet, and having a modestly rising beak on the \"r\" would diverge boumas wonderfully. In the same way, it would be great of the \"e\" had a modest descender. <br> <br>hhp <br></p>"
    html_clean: "<p>&gt; a more pronounced, longer ear that curls down <br> <br>The danger there of course is that you're moving closer to an \"n\". <br>The x-height region of the Latin alphabet is already over-used and closed in on itself. <br> <br>Plus you're making the \"r\" wider (see #1 below). <br> <br>&gt; a wider \"r\", so that the space between the three vertical stems in \"rn\" is uneven <br> <br>And there you have three issues: <br>1) Word width is a key determinant of bouma resolution, and having divergence in letter widths (as in narrow \"r\" versus wide \"n\") helps a lot. <br>2) You could just use a kerning pair to achieve a similar (if lower quality) effect. <br>3) The gap at the lower-right of the \"r\" (especially in a sans design) might get too close to a word space. <br> <br>The great thing about an ascending \"r\" is that the space between the x-line and the ascender height is very poorly used in the Latin alphabet, and having a modestly rising beak on the \"r\" would diverge boumas wonderfully. In the same way, it would be great of the \"e\" had a modest descender. <br> <br>hhp <br></p>"
