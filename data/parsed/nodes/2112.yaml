    html: "<p>I for one think you're on the right track. <br> <br>&gt; the way a type design can improve readability is aiding the eye navigation <br>&gt; trough the text by facilitating the discrimination of the shapes (bouma?) of <br>&gt; the key elements for its decypheration based on the syntax and morphology <br>&gt; of the language. <br> <br>Yes, but at the type design level (as opposed to writing custom software to dynamically optimize live text or something), you still have to address the individual letterforms. What you can do is map the entire lexicon of Spanish and find the sequences of letters that tend to get confused most, and diverge their constituent letters in key ways. This is not an easy task. For one thing, it requires grammatical sensitivity to work really well. <br> <br>BTW, don't focus on Javal's specifics too much: he was a stellar pioneer, but for that reason it was too early for him to be very exact about the details of readability. <br> <br>-- <br> <br>BTW, one can't doubt that Clearview works very well for the intended purpose: highway signage. But to me \"readability\" refers most to long passages of text (like a book), and just the fact that Clearview is a sans would make it not extremely readable, even though I think it's a highly <i>legible</i>, handsome design. <br> <br>hhp <br></p>"
