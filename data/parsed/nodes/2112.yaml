    html: <p>&gt; why is most highway signage sanserif  <br> <br>The simpler and more realistic answer to this question is that, at least in the US, highway signage comes down from both sign painting and an engineering template lettering. Sans Serif glyphs are easier to paint, and to render via a template.. In the case of Standard Highway Alphabet Series B,C,D,E, Emod, these were derived from what is essentially Leroy lettering, with some of the round terminals squared off. <br> <br>ClearviewHwy is a sans because it would have been impossible to get highway engineers to consider a serif, hell, it was almost impossible to get them to consider ClearviewHwy at all.</p>
    html_clean: <p>&gt; why is most highway signage sanserif  <br> <br>The simpler and more realistic answer to this question is that, at least in the US, highway signage comes down from both sign painting and an engineering template lettering. Sans Serif glyphs are easier to paint, and to render via a template.. In the case of Standard Highway Alphabet Series B,C,D,E, Emod, these were derived from what is essentially Leroy lettering, with some of the round terminals squared off. <br> <br>ClearviewHwy is a sans because it would have been impossible to get highway engineers to consider a serif, hell, it was almost impossible to get them to consider ClearviewHwy at all.</p>
