    html: <p>I don't suspect that in your circumstances legibility would have too much to do with choice of typeface.   <br> <br>Legibility only becomes an issue in extremely adverse reading conditions, such as highway signage, very small packaging information, or bad printing conditions such as newsprint.  <br> <br>Otherwise, it's like saying which plays a clearer tune, the piano or the guitar? </p>
