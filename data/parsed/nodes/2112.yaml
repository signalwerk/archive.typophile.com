    html: <p>This is turning interesting, James why do you  <br>consider Clearview as very readable? <br> <br>I have retarded the writing of my thesis project  <br>because of some academic issues. I am planning to  <br>do it about Spanish Linguistics for Type Design  <br>Improvement, mainly on the readability area for  <br>long texts.  <br> <br>I have been doing some light reading on related  <br>areas and would like to confirm my understanding  <br>of the topic (raised mainly in suppositions) and  <br>ask for some guidance. <br> <br>Ok, as far as I understand and parting from the  <br>Javal fndings* reading efficiency is related  <br>mainly to the hability of the reader to predict  <br>the sense of the text as this determines where  <br>are the eyes going to be fixated on the next  <br>saccades for the sake of revealing information  <br>for comprehension. This implies a knowledge of  <br>the language, of it�s use and lots of practice  <br>because reades who can predict the best need  <br>less saccades and effort to read a text. <br> <br>So I�m guessing that the way a type design can  <br>improve readability is aiding the eye navigation  <br>trough the text by facilitating the  <br>discrimination of the shapes (bouma?) of the key  <br>elements for its decypheration based on the  <br>syntax and morphology of the language. Maybe too  <br>by facilitating fixations in key areas (if there  <br>is a way to achieve this). All of this having to  <br>do with the frequency and relevance of letter  <br>combinations in syntactic units. <br> <br>There are many intervening factors in this  <br>process, some very relevant such as the redaction  <br>influence on the text decypherability, the  <br>reader�s experience and intentions toward the  <br>text and the deepness of the reading. <br> <br>Now, I have read (and verifyed) that the layout  <br>design and type setting mostly improves  <br>readability more than the type itself. Still good  <br>type is needed because better types can profit  <br>the text more by the way they are used. <br>____________________________ <br> <br>I intend to seek type use and design criterias  <br>for spanish appart from the kerning pairs and  <br>accentuation based on the supposition that the  <br>relation between a languaje notation, structure  <br>an morphology can be used to improve readability. <br> <br>So do I have some clues or are totally lost? <br>Is this feasible or is languaje not so  <br>influential? <br> <br> <br>*  <br>http://www.readingonline.org/research/eyemove.html</p>
