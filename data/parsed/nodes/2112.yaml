    html: "<p>&gt; Prove it. <br> <br>Pay me to.  :-) <br> <br>&gt; determining an optimal norm for the shape of a lowercase r is one of those <br>&gt; rare things that could actually be relibaly informed by empirical study. <br> <br>Indeed. Although the danger is that the more focused a study the more it relies on assumptions in order to extrapolate to the big picture. Field research that's broad is harder to extract practical usefulness from, but it gives bigger clues. I guess it's a matter of gradually improving focus, in terms of what level of specificity we really need most at the moment. <br> <br>Anyway, more importantly: <br>Lacking empirical proof, we shouldn't just wring our hands and pray to dark gods. We should use what we <i>do</i> know, for example that the lower right half of an \"r\" seen in the middle of a word in the parafovea is nearly irrelevant, come on. <br> <br>hhp <br></p>"
