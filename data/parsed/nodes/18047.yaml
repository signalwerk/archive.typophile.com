      <p>The US needs kerning a bit tighter, the first de also needs tightening (although that line is all a bit too small and loose). The USI don't have the same characteristics as the NA you might try to work in some of those characteristics. You could rotate the film icon so that the strip is parallel to the righthand vertical of the A and bring it down to align with the text block, it seems disconnected to me.<br>
      Tim</p>
