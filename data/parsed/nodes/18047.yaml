      <p>I really don't like the S or I, but the U, N and A are advances although the area where the serif joins the U is a bit dark. The icon still seems disconnected to me, maybe it could provide the inspiration for the S and that would tie it in, you could also look at making the space between the core of the radioactive symbol and the "arms" similar to the weight of the type stroke. The alignment of the de idéias might be better aligning the upright of the d to the I although at small sizes it might be too small.<br>
      Tim</p>
