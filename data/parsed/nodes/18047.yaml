    html: <p>Well I actually like the angle and movement of the old logo, but I like a simpler, more graphic approach. The 3-D thing doesn't work for me. I think the way you have shown the film, on the new logo, looks awkward. Keep working on it, and explore some options, I don't think it's done.</p>
