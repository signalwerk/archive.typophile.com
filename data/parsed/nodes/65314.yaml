    <p>Haven't found a clear answer on this.</p>
    <p>I recently launched a portfolio, and at the bottom, I put "All work copyright 2009."</p>
    <p>With the new year coming up, do I just change it to 2010, or do I say 2009-2010?</p>
  html_clean: |-
    <p>Haven't found a clear answer on this.</p>
    <p>I recently launched a portfolio, and at the bottom, I put "All work copyright 2009."</p>
    <p>With the new year coming up, do I just change it to 2010, or do I say 2009-2010?</p>
