    html: |-
      <p>I've seen some websites that use the second option, i.e., 2009-2010, to indicate that not all of the work was created in 2010.</p>
      <p>[I can think of a similar situation: when old music albums are reissued with bonus tracks and/or remastering, the copyright reflects the original year the album was released, plus the year of the reissue (not all record companies do this, though). For example: "© 1975, 2009, X Records." This, to me, is the best way to go about it, as it lets you know the original release date, and that you are looking at a reissue.]</p>
