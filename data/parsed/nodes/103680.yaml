  html: |-
    <p>I'm looking for high-resolution scans from pages of Arrighi's <em>La Operina</em>, which is a classic manual for calligraphy and for the 'chancery italic' approach to pre-printing-press typography. I'm aware of an on line resource of "the" work, but the resolution is too low.</p>
    <p>The work doesn't have to be authentic and I'll consider examples of modern interpretations. I have a copy of <em>Three Classics of Italian Calligraphy</em> but it doesn't show enough detail.</p>
    <p>Any help appreciated.</p>
