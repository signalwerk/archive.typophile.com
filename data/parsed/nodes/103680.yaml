    html: |-
      <p>If the P22 font won't work for you, there are scans available. They are only 72dpi but the pages are very large. For study or for making a font (redrawn) I would think they are adequate. </p>
      <p>There are two versions available:<br>
      This file is the original scans, with the pages in a horizontal format, uncropped.<br>
      laoperinadiludou00arri_orig_jp2.tar</p>
      <p>This file has the pages rotated and cropped, final page size about 26x41.<br>
      laoperinadiludou00arri_jp2.zip</p>
      <p>Both files are available here:<br>
      <a href="https://ia801704.us.archive.org/27/items/laoperinadiludou00arri/" title="https://ia801704.us.archive.org/27/items/laoperinadiludou00arri/">https://ia801704.us.archive.org/27/items/laoperinadiludou00arri/</a></p>
