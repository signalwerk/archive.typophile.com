      <p>I'm Caroline Hadilaksono, one of the founders of The League of Moveable Type, the designer of Junction. I'm glad somebody realize that we are giving away a typeface that we designed ourselves on our site. </p>
      <p>I've read that many here dislike the concept of open-source fonts because to you it's a movement started by a bunch of self-righteous people demanding type designers to give away their hard-earned skills and hand-crafted fonts for free; that there are a lot of people out there who do not appreciate the labor and skills that it takes to design a good typeface; and that there are a lot of people out there who want to take advantage and jump on the whole open-source bandwagon to advance their own agenda and well, get stuff for free.</p>
      <p>I can't speak for other advocates of the open-source type movement, but as co-founder of The League, I can tell you that this is not at all our intentions. As a designer, I understand what it's like to feel unappreciated, and to have people look at what you do and think that it's a sort of luxury that they're not willing to pay money for. </p>
      <p>Somebody earlier wrote "From a distance type design can look like a menial task that requires motivation and not much else... Most people who start dabbling in type design end up thinking we’re a bunch of loonies to even bother." With all due respect, but you couldn't be more wrong. I don't think type designers are a bunch of loonies, to the contrary, I completely respect and admire what they do. Having the experience of designing a typeface, I can understand the challenges and hard work that goes into it. It requires a lot of time, patience, an insane attention to detail and a great awareness to subtleties, I have never considered it as a menial task.</p>
      <p>We're not asking type designers to give up their means of living and it is not our intentions to devalue typography or type designers in any way. So what are we saying? Are we asking type designers to donate their fonts for free? Well, if you look at the bottom line, then yes, essentially that is what we are asking. But to me, the issue runs a little deeper than that. </p>
      <p>What we're advocating is a change in the way people look at business. What would happen if people run their business the way they treat their family and friends? Maybe sometimes, it's not about the money. And maybe once in a while we do do a good deed. </p>
      <p>It's funny, we've been talking a lot about fonts and typography, but in a way, it's almost not about the fonts or typography or design. It's about people helping people. </p>
      <p>What kind of statement does it make for someone to give away something as valuable as a beautifully crafted typeface to not only help raise the design standards of the web (and print), but also create a place where people can share their creations, knowledge, and expertise with their peers and the world. Does that make me a self-righteous twat? Maybe. Does that make me naive? Sure. But this is the kind of world I want to live in, and I want to do what I can to help make it that way, this is why we started The League of Moveable Type.</p>
