      <p>&gt; Does that make me naive?</p>
      <p>Yes, I think it does. As a type-designer you've chosen to give away a font you've created, and that's fine - hundreds of type-designers (and not just beginners and amateurs) have decided to do that in the past. </p>
      <p>However, you’re calling on other type designers to do the same. This is where things start to go down-hill. My experience has been that type designers don’t like being preached to. A good cases study might be Ellen Lupton’s call at ATypI Lisbon. Of those who have given things away a good number of those have lived to regret doing so. Others are generally opposed to it. Whereas others see giving stuff away as a great marketing tool.  </p>
      <p>Hitching your wagon to @font-face was also a bad move. Most type foundries oppose it, and many type designers are really scared of it, and don’t want to have anything to do with it. </p>
      <p>Another mistake is the Open Source connection. Although many type designers give away fonts for free, they stop short of allowing others to commercially exploit their work, or produce derivatives. The OS requirement doesn’t seem necessary for @font-face. </p>
      <p>Final nail in the coffin in my opinion is to tie Open Source and @Font-Face together. The possibility that @Font-Face related mechanisms might offer minimal font protection and a business model for font producers is threatened by the Open Source folks who see font protection as “evil DRM” and believe all fonts should be free. Check out the W3C Style mailing list archive for examples. </p>
      <p>I think talking to other practicing type designers and some additional research may have turned up these problems prior to launching your site.</p>
      <p>Just my two cents - hope this criticism is taken as constructive.</p>
