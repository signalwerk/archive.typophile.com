      <p>&gt;I think there’s a big misunderstanding here. We’re not asking you for anything.</p>
      <p>As I wrote the one line summary "Pair of graphic designers ask type designers to give away fonts..." I should probably point to what led to this misunderstanding... </p>
      <p><em>"There are people who design typefaces for a living, and we want them to make money off of something that they do well. This revolution is not a movement against type foundries and type designers; it's quite the opposite. The kind of revolution we want is a change in the way people think about doing business. <strong>We want type foundries and typographers to start thinking,</strong></em></p>
      <p>"Maybe there's nothing wrong with giving things away sometimes."</p>
      <p>It's not always about the money, sometimes it's also about making a contribution to the society, in this case, the design community. Giving one typeface away for free will most likely only boost sales, and it's a good deed. We want more people to look at it like that: like they have a responsibility to do something good for their peers. We're not asking type designers and type foundries to sacrifice profit, <strong>we're asking them to contribute to a greater cause</strong>, to create a community where we not only have a high design standard for print and web alike, but also a community where we're able to share our creations, knowledge, and expertise with our peers and the world."</p>
      <p>So sorry if I got the wrong end of the stick. To me it comes across as both "preachy" and "asking".</p>
