      <p>The attitude becomes apparent when reading a blog post on Adobe’s site about web fonts:</p>
      <p>We will be updating our licensing FAQ to make it clear that our existing font license terms allow EOT usage, and do not allow linking to original fonts placed on web servers.</p>
      <p>I stumble upon this as an end user who wants to get type faces to work. This only tells me I’m allowed to do something that’s not there yet, and that something which is there already is not allowed. Nowhere I read when this EOT thing will be there, and what I should do in the meantime.</p>
      <p>2. This is the one that’s mostly ignored, but which is even harder to change overnight.</p>
      <p>Correct me if I’m wrong, but I think foundries and designers are still mainly designing and marketing fonts meant for print use. So even if I could use a font in the way I wanted, it wouldn’t look good as it was never hinted as well as the screen fonts bundled with my OS. </p>
      <p>Adobe’s push of Opentype for me is similar as the music industry rallying behind Super Audio CD. A new medium is coming up, which you envision as threatening to your business, so you make your old medium (which was already pretty sophisticated in itself) even more sophisticated and desirable.</p>
      <p>This doesn’t work because quality or sophistication in itself can’t influence a large social development like the switch from paper to screen.</p>
      <p>An example. I completely love Adobe’s Caslon, Garamond and Jenson face. They are, in a way, the pinnacle of type design for DTP. In the context of a new technology they reinterpret a visual and an industrial heritage in a way that is very much their own.</p>
      <p>What I don’t get, is why I haven’t seen efforts like this for the screen, other than the ones that come with my operating system. Why doesn’t Adobe make a Caslon Web, a Garamond Web and a Jenson Web?</p>
      <p>A small character set, a small amount of typographic choice but a large amount of typographic sophistication, one weight only, with it’s curves and kerning optimized for the screen, and sublime hinting.</p>
      <p>If anyone can do this, Adobe can. Why could this not be an economically viable outset?<br>
      IMHO it’s at least a viable outset aesthetically. I recently discovered Bitstream Charter, by Matthew Carter, which I am able to use as @font-face. It’s curves are very spartan, because of the requirements of early PostScript printers. But because Carter is a brilliant designer he makes the face work, not in spite of, but because of the limitations. It becomes it’s strength: it manages to reduce a serif face to it’s bare essence, as opposed to smothering it in mannerist putti.</p>
      <p>The same goes for Georgia. The screen handles curves differently, I’ll use different curves that still look great. The screen doesn’t allow me to choose between normal and old style numerals, I prefer the latter, I’ll only give it Old style numerals. That’s great.</p>
      <p>The great fonts we have are here because companies like Microsoft commisioned them. Lucas de Groot’s font for Vista are a stellar achievement. But they also clearly highlight the failure of font foundries to venture into this terrain</p>
      <p>So that’s the problem in a nut shell. It’s not like we need five thousand typefaces. Five or six good ones would be enough. But we have only have one widely available, and that’s Georgia. So there we have our transitional serif. But I want to use a neutral sans on the screen, a geometrical sans, a humanist sans, a modern serif and an old-style serif.</p>
      <p>This has been a gaping hole ignored by the market for a long time. Of course there’s probably lots of reasons for that, but one of them seems to have been all the concerns about piracy, which IMHO has been a waste of energy and resources that could have been better spent in formulating new business models more suited to today.</p>
      <p>But seeing the current attitude towards fonts on the web from the foundries, I don’t see it happening overnight. That has people like me jumping on the open source band wagon as well, which Sil, you might find selfish. It is. But my needs aren’t met by the type foundries now, otherwise I would not have bothered.</p>
      <p>As their predecessors failed to adapt to new technologies, to me it looks like the big foundries of the 90ies are bound to become small again. They’re not keeping pace with the rest of the technological world, which is moving on-line and massively adapting open source technologies (adapting is the key word here-companies do so because of economical advantages, not because of ideology.).</p>
      <p>I find it somewhat unsettling, for example, to read Emigre’s licensing requirements. Firstly, because it’s a document that only consists only of statements that inform me that no I can’t use what I want to buy in whatever way I see fit, which by itself is enough to make me uncomfortable. I can’t even embed a font in a PDF without paying more for it. But what unsettles me most, is that it reads as the report of an organization desperately trying to cling on to strategies that once worked, but now are being ignored the rest of the world.</p>
      <p>Eric</p>
