    html: |-
      <p>Hello all,</p>
      <p>This is my first time posting in a discussion on the web. Apparently I’m not so good at it yet, because I read the comments and then started writing a comment myself but it became an essay.. And then of course I had to start rewriting it as other comments came in...</p>
      <p>So I apologize for the length. Maybe I could reedit this and submit this as copy for a site related to these topics?</p>
      <p>I actually also wrote a manifesto last week, but I won’t be going into that here. I would like to not frame this in terms of ‘gift to humanity’ and so on, but in terms of economics. Not because I don’t think in terms as the former, but because I think making money and giving a gift to humanity are able to happily coincide. To keep in the humanist tradition here, Aldus Manutius had high hopes for saving Classical culture, and at the at same time wanted to make a buck with his printing office—or at least he had to in order to be able to continue saving culture! </p>
      <p>edt: That’s what James says, I think.</p>
      <p>Anyway, what this boils down to, here’s another self-centered twit jumping on the open source band wagon, albeit with a different rhetoric: as a European I tend to be (too) well aware of my own dubious motives and those of others, so I’m underdeveloped in the lets be nice to each other school of thought.</p>
      <p>But I still think there are some valid points to make, and I would firstly like to clarify what I think are two miscommunications that are happening between the both sides of the debate, and then describe what I think are real problems in the business of selling typefaces.</p>
      <p><strong>1 Where the typophiles are definitely right: people asking for free fonts don’t understand the economic position of a type designer</strong></p>
      <p><cite>But when sanctimonious academics, graphic designers, and open-source proponents can’t bring anything to the table but idealistic manifestos about—cue weepy violin solo—a “gift to humanity” or “making a contribution to the society” they’re insulting type designers without proposing a realistic solution to the problem that they insist exists.</cite></p>
      <p>That’s a very apt description of the situation I think. The problem is: the gift to humanity camp is reasoning from it’s own economic perspective, they are not aware that a type designer works differently. </p>
      <p>1. Open Source is a business model. You benefit by giving stuff away for free because it gives you recognition, this recognition in itself enables lots of things just as money does, and ultimately enables you to get a job that does earn money, as a consultant, a teacher, etc. Your manifesto, James, actually describes the ultimate situation this scenario aims for quite well.</p>
      <p>2. This wasn’t invented by open source, its’s how a gift giving economy works in general. See Hans Abbing applying this model to artists. And of course the place where this is most evidently the primary business model is in academics, where you do your best to spread your ideas and show off that you’re smart. In fact, the Open Source movement was born in this milieu, which shows why it is how it is, and how it can produce great things: because smart people are willing to work hard for it. It works the same with artists or any other economic model that is based on prestige.</p>
      <p>3. Where the misunderstanding starts is when people reason from there own socioeconomic situation judging other professionals. Because type design is quite clearly a different thing: you get paid to do a lot of hard work with a very concrete result.<br>
      Which means there is a much more concrete relation between what you produce and what you sell. As an academic, you don’t make money by selling the PhD thesis you worked on for three years, but because of the job it gets you. As a type designer, you do make money with the typeface you worked on, and there is far less economic proxy for it as academics and artists have with teaching etc.</p>
      <p>So asking type designers to give away fonts is like asking them to give up their primary source of income. Which is not a nice or moral thing to do. And which understandingly irritates you over here.</p>
      <p>So people should stop asking you to give away free fonts. I hope I can play some sort of a roll in this by making your situation more clear to to others.</p>
      <p>That mean you should never give things away. What one of your members did in the other thread, giving away glyphs for a type face he would probably never finish—that makes much more sense. You contribute something that has no direct economic value to yourself, but helps others a lot. The same could be said for, for example, helping out with the hinting or kerning of a popular open source font.</p>
      <p><strong>2 External factors contributing to the debate getting as heated as it does</strong></p>
      <p><cite><br>
      Dan: In my opinion, “how to make letters look good, and how to make typography better” is: enable anyone to learn how to do these things, and to do them for a living. Proprietary software and proprietary fonts can’t do this; they depend on secrecy. I’ve invested a lot of time and money in building the infrastructure for this to happen; plenty of others have too. It hasn’t happened yet, but it is happening, slowly. That’s fine; we are not in a hurry.<br>
      </cite></p>
      <p>And here I completely agree with Dave.<br>
      But this also has to do with a cultural misunderstanding, I think.<br>
      My education was in the sphere of academics and of autonomous arts, and I was completely baffled at first by the type designer’s attitude towards the public sphere.</p>
      <p>The hostility towards the amateur fonts etc. This thread at typographica still makes me angry, because the reaction to @fonts is ‘now the internet will be ugly’.<br>
      <a class="freelinking external" href="http://typographica.org/001112.php" rel="nofollow">"Embedded Web Fonts Return. Uh-oh."</a></p>
      <p>I figured ‘but these guys love letters, why are they saying these letters are nasty, but they are not allowing their letters to be used on the internet, and they’re also not telling people how to make them nice?’</p>
      <p>But that’s also very much an academic’s perspective. Who is someone who spends his time telling people how to do stuff, next to doing stuff. A type designer probably has less time for that.</p>
      <p>Now what made this debate particulary nasty (are there any discussion groups where flickr enthousiasts and pro photographers are bickering? not that I know of), is that type designers do find a lot of pleasure in discussing their trade together. Whether it’s organizing conferences, writing books or hosting a site like this.</p>
      <p>Now in the world of Open Source this sort of communication also exists, but it has a different role: it’s also the main channel for battling out the ideological differences between all the programming religions.</p>
      <p>But since this is the internet, the activity of both subcultures becomes very visible, and both subcultures are free to judge the activity of the others and will probably do so, because it makes no sense within their own frame of reference.</p>
      <p>Which I think is what Dan says:<br>
      <cite>I think that it is a case of priorities. I am a type designer, and I care about *one thing* more than anything else. And that is letters, and drawing them. I don’t really care about licensing debates. I find all the manifestos and the rhetoric rather dull.</cite></p>
      <p>That concludes the part where I consider my self sort of neutral. Here comes the part where I think font foundries have been behaving rather strange for the past fifteen years, </p>
      <p><strong>3 The problem is real, not perceived.</strong></p>
      <p>But it’s not about free fonts.<br>
      It’s about fonts for the screen in general, and fonts for the web in particular.</p>
      <p>The reason it has come up now, is because the open source movement is the first vocal and influential movement in which brings together users of typefaces. Not only using them in designing and publishing, but anyone who who reads letters on the screen.</p>
      <p>That the ‘free as in freedom’ aspect is important now, is because it is important to the Open Source Community. But it’s not as important to everyone else. People care about choice, and about convenience. People were more than happy to buy songs on iTunes even when it was both DRM and bad quality, because iTunes offers an added level of convenience and choice both to pirating and a regular music store.</p>
      <p>But here’s the deal: for the past ten years, if you wanted to use a typeface on your personal website or in your emails, there hasn’t ever been a convenient solution to do so, ever. Image replacement, sIFR, whatever: people don’t want to do that because they don’t see why it should be harder to use a font you pay for, than it is to use a font that comes with your system.</p>
      <p>I think amateurs and enthousiasts would buy much more fonts if they had a convenient way to use them online.</p>
      <p>What’s actually more worrying, is if people who are knowledgeable about type and use it in their professional practice are not buying typefaces.</p>
      <p>That would be me for example: I’m a visual artist who uses a lot of text in his work.<br>
      A) I love type.It’s the perfect blend between technology and culture.<br>
      Ever since finding out more about type faces and typography I have been amazed at the ways in which it has enriched the way I could express myself.<br>
      B) I’m an artist, and I love buying great tools. The ratio between the amount of money I earn, and the amount of money I’m willing to spend on tools that fit me is not very smart.<br>
      Me, and everybody else for which these two propositions hold true (and that’s a lot of people IMHO) should theoretically be the people most willing to pay for a good typeface.</p>
      <p>However:<br>
      C) I don’t buy typefaces. Because I can’t use them.</p>
      <p>I use type on my computer. 99% of the time I publish something containing type, it’s digital. When I draw I draw my own letters; when I publish something in print I work with a printer or a designer who own typefaces.</p>
      <p>Why can’t I use them?</p>
      <p>1. </p>
      <p>I’m not allowed to. This is of course the one that all the fuzz is about.</p>
      <p>In the changing landscape the requirements for for example a font change, because the thing that the licences try and prohibit is the thing that characterises these new developments: redistribution. This is not just affecting type foundries. Everybody has to struggle with this. You have to have an online presence, because that’s how people find you. At the same time, anything you put online is fundamentally out of your control. </p>
      <p>But as a user I feel foundries are not struggling with this problem, they’re just ignoring it and hoping it will go away.</p>
      <p>In doing so, they’re ignoring the needs of their users. I want to use fonts that I buy on my website without having to burden my workflow and my web traffic with sIFR or image replacement.</p>
      <p>Something like EOT is fine for me, but it’s not here.</p>
      <p>The attitude becomes apparent when reading a blog post on Adobe’s site about web fonts:</p>
      <p>We will be updating our licensing FAQ to make it clear that our existing font license terms allow EOT usage, and do not allow linking to original fonts placed on web servers.</p>
      <p>I stumble upon this as an end user who wants to get type faces to work. This only tells me I’m allowed to do something that’s not there yet, and that something which is there already is not allowed. Nowhere I read when this EOT thing will be there, and what I should do in the meantime.</p>
      <p>2. This is the one that’s mostly ignored, but which is even harder to change overnight.</p>
      <p>Correct me if I’m wrong, but I think foundries and designers are still mainly designing and marketing fonts meant for print use. So even if I could use a font in the way I wanted, it wouldn’t look good as it was never hinted as well as the screen fonts bundled with my OS. </p>
      <p>Adobe’s push of Opentype for me is similar as the music industry rallying behind Super Audio CD. A new medium is coming up, which you envision as threatening to your business, so you make your old medium (which was already pretty sophisticated in itself) even more sophisticated and desirable.</p>
      <p>This doesn’t work because quality or sophistication in itself can’t influence a large social development like the switch from paper to screen.</p>
      <p>An example. I completely love Adobe’s Caslon, Garamond and Jenson face. They are, in a way, the pinnacle of type design for DTP. In the context of a new technology they reinterpret a visual and an industrial heritage in a way that is very much their own.</p>
      <p>What I don’t get, is why I haven’t seen efforts like this for the screen, other than the ones that come with my operating system. Why doesn’t Adobe make a Caslon Web, a Garamond Web and a Jenson Web?</p>
      <p>A small character set, a small amount of typographic choice but a large amount of typographic sophistication, one weight only, with it’s curves and kerning optimized for the screen, and sublime hinting.</p>
      <p>If anyone can do this, Adobe can. Why could this not be an economically viable outset?<br>
      IMHO it’s at least a viable outset aesthetically. I recently discovered Bitstream Charter, by Matthew Carter, which I am able to use as @font-face. It’s curves are very spartan, because of the requirements of early PostScript printers. But because Carter is a brilliant designer he makes the face work, not in spite of, but because of the limitations. It becomes it’s strength: it manages to reduce a serif face to it’s bare essence, as opposed to smothering it in mannerist putti.</p>
      <p>The same goes for Georgia. The screen handles curves differently, I’ll use different curves that still look great. The screen doesn’t allow me to choose between normal and old style numerals, I prefer the latter, I’ll only give it Old style numerals. That’s great.</p>
      <p>The great fonts we have are here because companies like Microsoft commisioned them. Lucas de Groot’s font for Vista are a stellar achievement. But they also clearly highlight the failure of font foundries to venture into this terrain</p>
      <p>So that’s the problem in a nut shell. It’s not like we need five thousand typefaces. Five or six good ones would be enough. But we have only have one widely available, and that’s Georgia. So there we have our transitional serif. But I want to use a neutral sans on the screen, a geometrical sans, a humanist sans, a modern serif and an old-style serif.</p>
      <p>This has been a gaping hole ignored by the market for a long time. Of course there’s probably lots of reasons for that, but one of them seems to have been all the concerns about piracy, which IMHO has been a waste of energy and resources that could have been better spent in formulating new business models more suited to today.</p>
      <p>But seeing the current attitude towards fonts on the web from the foundries, I don’t see it happening overnight. That has people like me jumping on the open source band wagon as well, which Sil, you might find selfish. It is. But my needs aren’t met by the type foundries now, otherwise I would not have bothered.</p>
      <p>As their predecessors failed to adapt to new technologies, to me it looks like the big foundries of the 90ies are bound to become small again. They’re not keeping pace with the rest of the technological world, which is moving on-line and massively adapting open source technologies (adapting is the key word here-companies do so because of economical advantages, not because of ideology.).</p>
      <p>I find it somewhat unsettling, for example, to read Emigre’s licensing requirements. Firstly, because it’s a document that only consists only of statements that inform me that no I can’t use what I want to buy in whatever way I see fit, which by itself is enough to make me uncomfortable. I can’t even embed a font in a PDF without paying more for it. But what unsettles me most, is that it reads as the report of an organization desperately trying to cling on to strategies that once worked, but now are being ignored the rest of the world.</p>
      <p>Eric</p>
