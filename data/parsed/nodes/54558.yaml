      <p>Caroline, I for one have no intention of becoming a ragged-trousered philanthropist.</p>
      <p>Your argument is bullshit, as defined by Harry G. Frankfurt: pleasantry, neither true nor false.<br>
      No doubt the world would be a better place if everybody was nice and shared more; unfortunately, some animals are more equal than others.</p>
      <p>Look in the mirror and redistribute your own source of livelihood, rather than someone else's.</p>
      <p>**</p>
      <p>As several have commented, the culture of "free font entitlement" has been largely created by Adobe, Apple, and Microsoft, corporations which do not rely on font sales for their income, and bundle free fonts to help sell their big money-makers. It's unrealistic for users to also expect foundries which rely solely on font sales to give away the store--although as Hrant has noted and Jos demonstrated, freemiums can be an effective marketing technique.</p>
      <p>**</p>
      <p>I also don't think it's a good idea to muddle business and philanthropy. As Thomas Watson once said, "I'm all for charity, but first business must make a profit." (Or words to that effect.) There are better causes I can contribute to than giving fonts to people who already have plenty of them.</p>
