      <p>Re. bundling. I can’t disagree that bundling and the Web fonts have contributed to the culture of free font entitlement, although I don’t think they’re completely to blame. But in reality, if the font industry is truly built on selling the same fonts to the same people every few years, then Adobe, Microsoft and Apple are the undisputed masters of that game. The devils greatest trick… was making people think they get the fonts for free.</p>
