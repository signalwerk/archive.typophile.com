      <p><cite>If we can have superb free software, why can’t we have high quality free type?</cite></p>
      <p>As I already pointed out in a previous thread, the reason we have good free software if because businesses and governments have spent a hell of a lot of money developing good free software. The reason Firefox is free isn’t because a thousand nerds are hacking away in Mom’s basement; it’s because Google pays the Mozilla foundation for Google searches run through the Firefox search tool.</p>
      <p>We can have good free fonts if someone is willing to pay the font designers. That’s how some of the high-quality open-source fonts on the market came to be. But when sanctimonious academics, graphic designers, and open-source proponents can’t bring anything to the table but idealistic manifestos about—cue weepy violin solo—a “gift to humanity” or “making a contribution to the society” they’re insulting type designers without proposing a realistic solution to the problem that they insist exists.</p>
