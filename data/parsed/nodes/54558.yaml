      <p><cite>What would happen if people run their business the way they treat their family and friends?</cite></p>
      <p>I’ve read enough Ann Landers to know that people who make a habit of giving goods and services away to family and friends usually get screwed. Running a business that way is suicidal. </p>
      <p><cite>Maybe sometimes, it’s not about the money. And maybe once in a while we do do a good deed.</cite></p>
      <p>And therein lies the pernicious part of your argument: the notions that wanting compensation for one’s labors is just about the money and that creating a society where creative output is given away is a good deed. If I sell a well-designed and properly functioning typeface the recipient is receiving something of equal value to the money he pays me. Why is that any less good than simply throw my work to the winds and feeding the notion that people have some entitlement to the means of digital production? </p>
      <p>Money is not some unholy sigil of a cult of greed, it’s a simple token that represent the work the buyer is exchanging for my fonts. Swapping these goods and services is what makes civilizations work—a society that operates otherwise literally begins to meet the definition of primitive.</p>
