      <p>Is anyone else interested in producing a free font manifesto from a type designer’s perspective? I’m thinking of a hybrid of First Things First, Free Font Manifesto, and totalitarianism. Something like this:</p>
      <p>Part I<br>
      Most designers design a stuff nobody needs, packaging for stuff nobody needs, and advertising for stuff nobody needs. You’re all a bunch of parasites. So you’re far less entitled to your work then we are—after all, the designers who actually contribute to civilization (and pay for type without whinging) need typefaces more than they need advertisements for DVDs packaged in three-layers of non-recyclable materials.</p>
      <p>Part II<br>
      But you need fonts for Facebook apps that market stuff nobody needs and can’t make the client pay because they promised substantial savings over a print campaign by a big agency. Nobody wants a bunch of unemployed designers running around high on spray-glue fumes vandalizing public transit with OBEY GIANT stickers (aren’t you the rebel!), so to keep you in line you’ll get free fonts.</p>
      <p>Part III<br>
      Font designers can’t give designers the fonts they need to stay off the streets unless we have food and shelter. So to subsidize our work we need to following:<br>
      •Free housing: And good free housing in neighborhoods with coffee shops and bookstores, you can’t just stick us in Stuy-town or Kansas.<br>
      •Free education: That means our student loans get paid off and we get free tuition/room and board at Reading or The KABK.<br>
      •Free groceries: We can’t think clearly on empty-stomachs so twice-weekly deliveries of grass-fed-bison, free-range-chicken, and wild pork must be arranged.<br>
      •Etc., etc.</p>
      <p>Part IV<br>
      Because everyone clearly has a social responsibility to make this work, all designers will be taxed at five-percent of gross revenues to provide for the font designers. In exchange, you get free fonts. Anyone who fails to cough up the five-percent will be imprisoned for an arbitrary period of time. Repeat offenders will be shot.</p>
