      <p>Hi everyone. I'm Micah, and I'm the other founder.</p>
      <p>All due respect, after <a href="http://typophile.com/node/53444" rel="nofollow">the thread</a> from the other day, I expected this sort of negative attention here, and it's okay.</p>
      <p>I think there's a big misunderstanding here. We're not asking you for anything.</p>
      <p>This is not a generic call to type designers everywhere to give up their business models and follow us into the Communist heaven in the sky. Not that I wouldn't love it, but that's not what this is. We're reaching out to typographers who already agree with our perspectives on business and good deeds, who understand the benefits of giving a typeface away, and who want to help. We're contacting them, and letting them contact us, and everyone else can take it for what it is. I do hope that everyone here <em>can</em> take it for what it is, and not assign intentions that don't exist.</p>
      <p>The end product of that is something that will allow amateurs and professionals alike to experiment with using and making high quality fonts without being restricted by licensing and legalities. We politely disagree that mixing philanthropy and business is a bad idea, and in fact, that's exactly what we're trying to do.</p>
      <p>--<br>
      Micah Rich<br>
      <a href="http://www.weareagoodcompany.com" title="http://www.weareagoodcompany.com">http://www.weareagoodcompany.com</a></p>
