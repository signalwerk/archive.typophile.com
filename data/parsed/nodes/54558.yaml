      <p>There are a lot of people out there who seem to be very interested in free fonts. Free in either sense of the word. Funnily enough, most of these people are font users and/or people active in the free software movement in some way or another. But how many of these new initiatives are founded by type designers?</p>
      <p>I think that it is a case of priorities. I am a type designer, and I care about *one thing* more than anything else. And that is letters, and drawing them. I don't really care about licensing debates. I find all the manifestos and the rhetoric rather dull.</p>
      <p>Every week now, it seems, more people start asking for "free" font projects. But what would be even cooler would be for some of these people, or really all of these people, to start just drawing type. Do it yourself. Or maybe with each other. Maybe you will create great results. Maybe you won't. But I am not interested in the rhetoric. The more important battles to be fought are how to make letters look good, and how to make typography better. These have very little to do with what software you use or what restrictions you do or do not place on your work. Too much energy in the wrong direction, as far as I am concerned.</p>
