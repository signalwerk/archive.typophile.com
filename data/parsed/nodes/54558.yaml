      <p>Dave, proprietary software and fonts are not keeping you or me from learning about typeface design or letters, and they never have. I don't see how they are keeping anyone else in the dark, either. How did we start learning at Reading? By learning how to look at letters. In books. On any printed things. And by drawing them with pencils. Anyone can do this. There is no software involved. In fact, I'll wager that looking at letters in print, REALLY looking at letters, teaches way more about typeface design than looking under the hood of a font file ever will. </p>
      <p>If you want to make a difference, why not start by drawing more letters. You're working on a typeface now, right? Make it good, and talk about your process with other people. That will teach more people more things than whatever software you care to use in the process.</p>
