  html: |-
    <p>What's the font manager of choice for graphic designers working with windows 7? I used to use suitcase 11. Meanwhile suitcase fusion 3 is out, but on the extensis forum I also read of problems with windows 7. Deactivating doesn't always work, messes up the build in Windows Font Manager, temporary fonts are still placed as (ghost) fonts in the windows/fonts folder etc.</p>
    <p>But anyway, besides Suitcase, which font managers can be considered as standard or a good alternative?</p>
