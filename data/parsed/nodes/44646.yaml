      <p>2 sans families in the same genre do work nicely for a wide range of sizes and settings: <a class="freelinking external" href="http://www.typography.com/fonts/font_styles.php?productLineID=100009&amp;cpuCount=1" rel="nofollow">Verlag</a> and <a class="freelinking external" href="http://www.houseind.com/index.php?page=showfont&amp;id=615&amp;subpage=neutra_no2_view_fonts" rel="nofollow">Neutra #2.</a> I just saw a magazine with Verlag everywhere, and really liked the feel of the caps in heads. Then too, the small sizes for captions and callouts were very appealing too. </p>
      <p>I haven't played with or seen as much Neutraface (especially the new #2 with higher crossbars), but I suspect it feels a little more mechanical and geometric. The bowls in Verlag tend to be narrower and less circular. Overall it's a very warm impression for a geometric design, maybe more deco than geometric.</p>
