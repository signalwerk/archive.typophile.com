      <p><cite>My idea is that by getting the correct type from the get-go will set the tone for the rest of the magazine.</cite></p>
      <p>Shouldn’t the tone determine the type, and not the other way around?</p>
      <p><cite>Would I be on the wrong path to use the same family for heads and body?</cite></p>
      <p>Nope. As long as a typeface has the fonts you need to create the right contrasts, you’ll be fine. You can add new display types later–for pull quotes, etc—as budget allows to keep things fresh. </p>
      <p>Since you’re already considering H&amp;FJ look at Whitney. It’s very gorgeous and very capable; the specimens just don’t do it justice. I believe Flaunt has been using it as their text face for a while now. <a href="http://www.josbuivenga.demon.nl/index.html" rel="nofollow">Also, take a look at Jos Buivenga’s free/inexpensive typefaces.</a> I’m doing a magazine with only his stuff right now and it looks great! Museo is only $30 for five weights that scale well and can create incredible contrast.</p>
