      <p>John S.,</p>
      <p>I would think that being located in New York would make it obvious to you that magazine publishing is a high-turnover, fashion-driven area of design. Are you actually suggesting that a new design for a lifestyle/entertainment magazine (not a series of books) use Stone Serif? Way to embalm a design. Cute and stylish are actually front and center in magazine design, however upsetting this may be for you. </p>
      <p>"Never, but never, consider sans for body copy: nobody wants to read that much of any sans"</p>
      <p>This is like your repeated squawking about font pricing; it's intended to create the perception that everyone wants what you want. Iif you would be bothered to look around, you will discover that many, many magazines (again, not books) use all kinds of sans faces at all sizes, including for editorial material. The categorical rejection of sans designs reveals your conservatism, something that has little place in magazine design. </p>
      <p>In a word: speak for yourself. </p>
      <p>Jay,</p>
      <p>I'm not sure why you fixate on the highest prices, for the complete superfamilies. It's quite possible to develop varied, rich layouts for magazines with a modest family. The Verlag and Neutra families I linked to are $200 or $250, not $400 and $500. Do you need every single style, width and weight? Examine how you would use the type, and then make a corresponding purchase. For $500 you could get 3 wonderful, versatile families that would serve you for years. I don't find that the condensed variants are nearly as useful as the regular widths. Also, Neutra has text and Display variants, and you could just use the Text variants for everything; a sans like that scales well. More savings.</p>
      <p>Also take a look at packages and families from Storm; he has made collections you might find useful, and there are superfamilies that might work for you: Anselm and Amor; both have serif and sans variants. Look at them by categories for font pairing ideas.</p>
