    <p>I expect to be working on a magazine design very soon. I also expect the budget to be small and the timeframe to be tight. I am considering various typefaces for editorial, heads, sub-heads, features etc. I really like Neutraface by House Industries, the $500 pricetag is a little high but it is comprehensive and has the right mix of contemporary and classic to it.<br>
    I also really like Gotham by H&amp;FJ and it's a little more affordable at $400 complete.</p>
    <p>The magazine is a local entertainment and lifestyle publication. My idea is that by getting the correct type from the get-go will set the tone for the rest of the magazine.</p>
    <p>I have no ideas for the body type as of yet.</p>
    <p>Any help or pointers would be great.</p>
    <p>Jay</p>
