    html: <p>Whether you should use sans or serif for body copy just depends on how text-intensive your publication is. In the case of art mags with short articles well broken by white space and images, sans works perfectly well, but it should be the more interesting ones with aggressive personalities, like DTL Prokyon, Annivers, or Linotype Giacomo. Most magazines do not offer such an environment, however; needless to say, it's not about conservative vs progressive, a meaningless distinction in design today; it's about what is suitable *and* is interesting.</p>
