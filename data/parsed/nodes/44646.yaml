      <p>Use a strong serif for body copy and a well-matched sans for heads, subheads, sidebars, headlines, etc. Never, but never, consider sans for body copy: nobody wants to read that much of any sans.</p>
      <p>The biggest and crispest serif face for 9pt is Stone Serif, and you can use either Stone Sans (designed to go with it) or Linotype Syntax for the sans. All can be used with oldstyle figures (Stone Serif and Sans have to be ordered from ITC not Adobe if you want the OSFs; Linotype's version of Syntax comes with OSFs.)</p>
      <p>10pt Linotype Sabon paired with Linotype Syntax, both with OSFs, also works beautifully.</p>
      <p>Don't try to get cute and stylish with the body copy, except to use oldstyle figures instead of liner figures. Use your headline choice of sans for your big style statement.</p>
