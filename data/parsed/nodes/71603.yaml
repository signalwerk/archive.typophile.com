    <p>I have been designing on macs since college and most of my design career.<br>
    I have recently started at a firm that uses both mac and pc for design and production. The worst thing about this is that they haven't heard of font management. I have used Font Explorer for mac without fail for all of my other jobs and having tried Extensis with bug after bug and crash after crash I was wondering if there were any experts or just experienced typophiles out there that have used anything better or more reliable than Extensis for the pc! If only there was a FontExplorer for pc!</p>
