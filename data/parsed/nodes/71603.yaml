    html: |-
      <p>I use two together with no problems so far (on my Windows 7 64-bit and 32-bit PCs) - </p>
      <p>Extensis Suitcase Fusion 2 </p>
      <p>for general font management - the plugins for InDesign and Illustrator work well and are especially useful for when you open up a file from a third party - as the file&nbsp;loads you will get a 'missing fonts' alert for any fonts required by the file but not installed on your system, &amp; </p>
      <p>Printer's Apprentice, </p>
      <p>which is superior for viewing/comparing fonts and is tops for printing out catalogues and/or sample sheets - by far the most customizable and useful utility for those tasks that I've come across (and I've trialled loads of font managers for Windows).</p>
      <p>BTW Suitcase Fusion 2 (v13.2.0.37) is the most stable offering from Extensis yet. It hasn't crashed once on me.</p>
      <p>-Typo46</p>
