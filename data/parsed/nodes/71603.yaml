      <p>Suitcase Fusion 2 is at least as stable on Mac as on Windows.</p>
      <p>Suitcase 11 was pretty flaky. Suitcase Fusion 1 (which was Mac only) was considerably better. Suitcase Fusion 2 is better still, and has feature parity across Mac and WIndows.</p>
      <p>Disclaimer: I'm the product manager for this stuff at Extensis.  :)</p>
      <p>Cheers,</p>
      <p>T</p>
