    <p>I’m going on 24 hours of no sleep and I don’t even have any more Diet-Pepsi to drink - so please bear with me if I don’t make much sense.</p>
    <p>I have a new website under development - through a contract company that I found on eLance (based out of the UK and India) - and we’ve just completed the ’framework’ or phase one.  Now I have to provide detailed content, graphic images, color choices as well as a logo and a type face choices.</p>
    <p>The business is a (niche real estate/referral service) and I want the website to give potential clients (seller’s and agents - basically) the sense that they’ve come to the right place - that the company is capable of handling their problems - nationwide and that we are in some way - different (unique) in a way that makes us their obvious choice.</p>
    <p>I know that’s a lot to ask for a type face - but I thought I’d throw it our here to the community anyhow.</p>
    <p>I’ve attached an example of the ’template’ we are going to use as a basis and tweak until satisfied.</p>
    <p>There will be various content on the home pages, including Articles, Announcements, Images, etc, as well as Larger Single Word Typefaces which may be located on top of a graphic image, which may be used as a link (one for each prospect type)inviting agents and sellers into their own special sub-sites.  </p>
    <p>Should the content inside the frames (articles, about us, etc) have a different typeface then the links and menu items and other verbiage around the edges of the site - like here in Typohile?</p>
    <p>Should the typeface be consistent across all subsites - even if one prospect does not have access to another prospects ’registered’ subsite?</p>
    <p>Regarding the Logo - There are 3 Short Words of almost equal length XXXX XXXXX XXXXX - but the last two words are codependent <!--
