  html: |-
    <p>Been doing a bit of research on Univers and its different adaptations, found out on wikipedia that:</p>
    <p><em>Ordnance Survey also adapted Univers for use on their maps (added tails on the lowercase l and t, and other small changes to help distinguish the type from the map details) of which they own all rights to.<em></em></em></p>
    <p>I found this very interesting but couldn't find any image / examples of that typeface. Has Ordnance Survey stopped using it? Anyone got pictures of that typeface?</p>
    <p>Many thanks in advance.</p>
