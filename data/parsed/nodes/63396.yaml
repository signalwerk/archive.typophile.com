    <p>Greater Albion has just released the Cherritt Family of twenty faces on <a class="freelinking external" href="http://new.myfonts.com/fonts/gatf/cherritt/ " rel="nofollow"> Myfonts.com</a>.  Cherritt is the ‘go anywhere’ family-as the selection of images below shows, it can be equally at home captioning a sepia tinted vintage photograph, on the cover of a children’s adventure book, a retro-futuristic design or a travel poster.  Our sample images below give some small idea of this great scope.</p>
    <p>We think of Cherritt as a ‘bullnosed’ serif face, because of its rounded off serifs. What that phrase may not convey is the friendly, approachable nature of this large family of faces.</p>
    <p>The design was originally inspired by traditional draftsmens’ hand-drawn serif lettering, but has been given a precise geometric flavor that suits it for work owing its inspiration to any era, from Victorian times through to the modern. </p>
    <p>They are ideal for headings and poster work, but also for setting small volumes of text. Four weights are included in the family, as well as wide, expanded and condensed forms, true small capitals and openface forms.</p>
    <p>All family members embody extensive OpenType features.</p>
    <p>You can try out Cherritt for yourself on Myfonts.com or see a bigger range of sample images at high resolution and specimens on our <a class="freelinking external" href="http://gatf.wordpress.com " rel="nofollow"> blog</a>.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Cherritt_Gallery1_5197.png"></div><p></p>
