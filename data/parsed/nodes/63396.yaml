      <p>You're doing great work, although you wouldn't know it from the lack of enthusiasm shown by members here. And I like your typeset pieces. </p>
      <p>My only criticism of your work in general is that sometimes a font  - or a variant of a font - can look a little like it has been automatically "bolded" - for want of the correct terminology - or extended or condensed and this leads to letters that can look bland.</p>
