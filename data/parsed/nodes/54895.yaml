    <div class="info">Submitted by <a href="/user/10234" title="View user profile.">patrick.s</a> : 17.Feb.2009 1.41am </div>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/slanted_8_call_6458.jpg"></div><p></p>
    <p>Call for entries </p>
    <p>Slanted magazine #8 with the topic "2d3d" will center on a step-up of dimensions – from linearity to space and everything intermediate.</p>
    <p>Basically we are interested in type &amp; space in two different forms:</p>
    <p>- On the one hand simulating a third dimension although everything still happens in the 2-dimensional, plain space (f.e. »Umbra« by Robert Hunter Middleton, 1932).</p>
    <p>- On the other hand typography and graphics in the world around us in form of installations, applications, architecture, sculptures and so on.</p>
    <p>We are looking for projects from students and professionals who want to suggest something interesting matching to our topic, like to write something about it and so on. The projects needn't to be necessarily (typo-)graphic – we are always interested in other parts of design.</p>
    <p>Additionally we present student- and diploma-projects in our section Studienarbeiten/Typostories which needn't essentially suit to the topic of the issue – contributions welcome!</p>
    <p>Please send your suggestions in form of visual material (please prepare screen-pdf) and a short describtion to magazine(at)slanted.de up to and including Sunday, 5th of April 2009. After that date we will spot the received material – then you will be informed per e-mail.</p>
    <p>We are looking forward to your contributions!</p>
    <p>PS: The topics for slanted magazine #9 &amp; #10 are fixed already:<br>
    #9 / principle stencil<br>
    #10 / black letter!<br>
    Call for entries follows ...</p>
    <p><a href="http://www.slanted.de" title="www.slanted.de">www.slanted.de</a><br>
    magazine(at)slanted.de</p>
