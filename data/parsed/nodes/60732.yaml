      <p>After seeing those screenshots I would say it's not the matter of "coolness" or "nice design" but more of legibility! Black background? Damn.</p>
      <p>And as for "offering services"... I'm young, unexperienced and all, I'm aware of that but the one thing I've learnt so far is that when a client does not want a change, there's no way to convince him to make a change. In most cases every comment that is even slightly negative you make about his/her website/logo/whatever is treated like a personal attack. (I'm not saying that's always the case, of course)</p>
      <p>- Filip Łysyszyn</p>
