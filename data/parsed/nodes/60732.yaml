    <p>I know this sounds like a stupid question, but I would like to hear your opinion about something that happened to me.<br>
    I am a graduating designer, and I was looking for some people to offer my services to.<br>
    I came across the company website of a family's friend company, and I found it ugly and disturbing.<br>
    Here you can see some screenshots of the website and the logo. I blurred some parts to make them not recognizable, but I think you can get the overall feeling.</p>
    <p>Logo: <a href="http://img198.imageshack.us/img198/8654/picture3copy.jpg" title="http://img198.imageshack.us/img198/8654/picture3copy.jpg">http://img198.imageshack.us/img198/8654/picture3copy.jpg</a><br>
    Homepage: <a href="http://img257.imageshack.us/img257/3013/picture2copy.jpg" title="http://img257.imageshack.us/img257/3013/picture2copy.jpg">http://img257.imageshack.us/img257/3013/picture2copy.jpg</a></p>
    <p>Last week we met this friend at a dinner, and I kindly offered him the chance to have him redesigning / modernizing his website and logo.<br>
    Shortly, He said stuff like "the logo must rest the same" and "I dont need a fancy website - everything the clients need is online".<br>
    He claimed that in his product area, he's the leader, and that, again, a "cool" website would make no difference in the number of clients that would contact him, because, with it being an industrial product which is sold to other industries and NOT to customers in supermarkets, they don't need to impress people with advertising or marketing strategies, they just need to say what they're offering, and since they offer "the best" stuff, it's fine for them this way.</p>
    <p>I answered that there's no function without good shape and that bad/ugly communication (in this case that website) can be more harmful that no communication at all.<br>
    And that a website with a decent color palette and correct and coherent html / css language doesn't have to be "cool" or "fancy" in a negative way but could just be an improvement to this situation.</p>
    <p>Enough said, he was not interested.</p>
    <p>So, what would you have said to him?<br>
    Have you ever offered your services to clients from the factories world?<br>
    What was their and yours reaction?</p>
