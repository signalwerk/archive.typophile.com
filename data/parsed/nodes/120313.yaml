    html: |-
      <p>Your sample is a bit low-res for an accurate match. It closely resembles Optima:<br>
      <a href="http://www.fontshop.com/fonts/downloads/linotype/optima_pro_bold/ot_ps/specimen/tester/" title="http://www.fontshop.com/fonts/downloads/linotype/optima_pro_bold/ot_ps/specimen/tester/">http://www.fontshop.com/fonts/downloads/linotype/optima_pro_bold/ot_ps/s...</a></p>
      <p>But I haven't been able to find an Optima-like typeface with a left-facing serif at the apex of the A.</p>
      <p>These two fonts (which are basically identical) by Steve Jackaman also come close:<br>
      <a href="http://www.fontshop.com/fonts/downloads/creative_alliance/castle_book/pc_tt/specimen/tester/" title="http://www.fontshop.com/fonts/downloads/creative_alliance/castle_book/pc_tt/specimen/tester/">http://www.fontshop.com/fonts/downloads/creative_alliance/castle_book/pc...</a><br>
      <a href="http://www.myfonts.com/fonts/redrooster/salzburg-rr/" title="http://www.myfonts.com/fonts/redrooster/salzburg-rr/">http://www.myfonts.com/fonts/redrooster/salzburg-rr/</a></p>
      <p>Same for this font, which came bundled with Windows 7:<br>
      <a href="http://www.whatfontis.com/IrisUPC-Bold.font?text=DATACOM" title="http://www.whatfontis.com/IrisUPC-Bold.font?text=DATACOM">http://www.whatfontis.com/IrisUPC-Bold.font?text=DATACOM</a></p>
      <p>Also close:<br>
      <a href="http://www.myfonts.com/fonts/softmaker/columbia-serial/" title="http://www.myfonts.com/fonts/softmaker/columbia-serial/">http://www.myfonts.com/fonts/softmaker/columbia-serial/</a></p>
