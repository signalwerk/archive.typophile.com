    votes: null
    html: "<p>I've used it once or twice for heads. I knew I was on shaky ground, but I try to be open-minded about fonts. Almost every last one of them has it's moment of perfect utility. I once saw someone make perfect use of Courier in a credit card ad. So I doubt it's written in stone: Thou Shalt Not Use Verdana Except on the Internets. The nice thing about working with it is that you'll know instantly if it belongs in your printed design or not. Usually not. <br> <br>But every now &amp; then...</p>"
