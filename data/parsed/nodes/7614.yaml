  html: <p>I like Verdana on the screen. It's a great face. But is Verdana really acceptable in print?</p>
  html_clean: <p>I like Verdana on the screen. It's a great face. But is Verdana really acceptable in print?</p>
comments:
  - id: 51707
    user: 1250
    date: null
    date_raw: null
    votes: null
    html: <p>Good question, although "acceptable" is very ambiguous and variable of course. Many people don't like Verdana's outlines. I think it was a "progressive" choice in the late 90s, but maybe now either has no flavor or the wrong flavor. But as always, it depends! <br> <br>hhp</p>
    html_clean: <p>Good question, although "acceptable" is very ambiguous and variable of course. Many people don't like Verdana's outlines. I think it was a "progressive" choice in the late 90s, but maybe now either has no flavor or the wrong flavor. But as always, it depends! <br> <br>hhp</p>
  - id: 51708
    user: 1996
    date: null
    date_raw: null
    votes: null
    html: <p>I have yet to see Verdana used well off line.  <br> <br>It is too wide for a "regular" sans-serif. (By "regular" meaning that it is not an extended version). So it wastes a lot of space. Characters like a, e, j, I, J look very odd when printed. Some of the nuances that translate so well on screen become, well, nuisances. <br> <br>Unlike its serifed sibling, Georgia, Verdana should stick to HTML.</p>
