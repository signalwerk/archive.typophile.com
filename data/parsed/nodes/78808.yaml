    html: |-
      <p>I had already decomposed and merged contours. I'm not seeing any duplicate paths on the ones that show up bad. I hadn't reset to TT curves and direction because I thought that when you generated it as a Windows TrueType/OpenType font that conversion was automatically made. Anyway… I went ahead and tried that and still had the same problem. On the Ç I had a change. On that particular character I had copied from the old PS version. Then this time around I went back and put in the new C and cedilla (with cleaned up outlines). The Ç was better, but not right. The cedilla seemed to show as a heavy spot on the curve rather than hanging below. It was merged and showed no bad points in Font Audit.</p>
      <p>I'm wondering if scaling the font up to 2048 from the 1000 would help. Also… is it best to remove hinting, autohint, or maybe leave only horizontal hints since the verticals have nothing to align to?</p>
