    <p>I've been reworking some old proprietary PS fonts for someone who needed the character sets filled out and will be using in Flash as well as other apps. The first one came out fine. Then I worked on one that is a formal script. All seemed well until I had a peek at it for the first time in Illustrator. OUCH! In the glyph palette (see below) you'll notice that some letters are extremely distorted. </p>
    <p>I thought maybe it might be some kind of hinting error. I don't know how to hint ttf fonts so I tried removing hinting, autohinting, etc. No matter what I seem to do I get the same results. Not sure why C is fine but Ç is not. When I type it looks fine until I zoom out a ways. Then I get the same distortions as the glyph palette. I tried the old PS version in Illustrator with no problems. Any ideas how to resolve this?<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Glyph_palette_4354.gif"></div><p></p>
