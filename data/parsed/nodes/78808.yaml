    html: |-
      <p>Fixed it. The font was very old with many updates, but still had diacritics mapped incorrectly, no extremes on curves, etc. After fixing all that and pasting in a new font window using the paste special command to avoid carrying any unnecessary legacy data I managed to get it working. Also followed Mr. Shinn's notes.:-)</p>
      <p>Thanks guys.</p>
