    html: <p>Occasionally, I have encountered some kind of voodoo in a .vfb file that defies any fix I can throw at it. In such instances, I have generated a PS Type 1 font, then opened the generated font in FontLab, and the problems have gone away. This process may not solve your problems, but it's worth a shot...</p>
