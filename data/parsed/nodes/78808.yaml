    html: |-
      <p>Decompose<br>
      Merge Contours<br>
      Make sure all PostScript curves have a "handle" at both ends<br>
      Convert Curves to TrueType<br>
      Set TT direction<br>
      Check for duplicate paths (double click on path segments/count number of points visible and compare with number listed).</p>
