    date: 2011-02-06T14:45:00
    date_raw: 6 Feb 2011 — 2:45pm
    votes: null
    html: <p>I'm wondering if I just copy everything into a new font window including kerning data and see if that might do it. The first font that I reworked I did this way and had no problems. This one I just opened in FL and reworked directly. The font was a very old proprietary PS font and had some weird things to start with. Like… whoever put together composite characters just used any random dicritic slot. So there was a tilde in the circumflex cell and they used dotaccent in place of dieresis. I might see if that helps fix it.</p>
