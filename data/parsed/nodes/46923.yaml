      <p>Can you be a bit more specific than 'using for web'?</p>
      <p>HTML text can be styled via CSS declaring any typeface you want. The catch is that for it to render in said font, the end-user has to have it installed on their machine. This limits you to the standard Windows, OSX, Linux, and MS Office fonts for the most part.</p>
      <p>Headlines and such can be set as images, using any font you want to create them.</p>
      <p>sIFR is a flash technique to embed fonts into a flash file to render text on screen. It's used on this site for the thread titles. It's typically used mainly for headlines.</p>
      <p>And then there is web font embedding, which some browsers now support, though there are contentious issues in regards to which FONTS support it in terms of the EULA.</p>
      <p>Beyond that, be true to the brand, and be cognizant of readability and accessibility issues.</p>
