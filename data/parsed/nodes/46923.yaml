      <p>Speaking of 'strap line'...how old is that term? In all my years, I hadn't heard of that term until the past year or so. Is it particularly Brittish?</p>
      <p>Back on-topic...</p>
      <p>There are fonts optimized specifically for the screen...most of the Microsoft Office Type fits that (Verdana, Georgia, Tahoma, and the newer ones in '07 like Calibri)</p>
      <p>However, the benefit is really only noticeable at text sizes and when rendered natively by the browser/OS.</p>
      <p>If you want to use ScalaSans, that's going to have to be an image anyways, so go for it.</p>
