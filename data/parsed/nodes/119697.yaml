    html: |-
      <p>Most glyphs are identical, BUT....</p>
      <p>Lucida Sans has a regular, bold, italic and bold italic available. Lucida Grande only has regular and bold, and Lucida Sans Unicode has only regular.</p>
      <p>Both Lucida Grande and Lucida Sans Unicode have larger character coverage (both languages and symbols) than Lucida Sans.</p>
      <p>For all the characters they have in common, Lucida Sans and Lucida Sans Unicode have identical designs. Lucida Grande has just a very few differences, notably:</p>
      <ul>
      <li>"1" has a baseline serif</li>
      <li>hyphen is longer</li>
      <li>"@" is larger and more upright</li>
      </ul>
