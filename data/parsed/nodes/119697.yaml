    <p>Hi Everyone. I'm a bit confused with Lucida Sans.<br>
    Recently I picked that font for a client, and I am not sure of the difference between Lucida Sans, Lucida Grande and Lucida Sans Unicode in a function sort of way.<br>
    Is it necessary that I tell my client to use one font if he uses a PC (Sans Unicode) or a mac (Grande)?<br>
    Thanks!</p>
  html_clean: |-
    <p>Hi Everyone. I'm a bit confused with Lucida Sans.<br>
    Recently I picked that font for a client, and I am not sure of the difference between Lucida Sans, Lucida Grande and Lucida Sans Unicode in a function sort of way.<br>
