    html: <p>George, be sure to visit <a href="http://www.nijhoflee.nl/" rel="nofollow">Nijhof &amp; Lee</a>. They generally have the best selection of typography and design related books. Be sure to ask to see the used and antiquarian stock, which they keep upstairs.</p>
