  html: |-
    <p>Going to be in Amsterdam on business in a few weeks and I'm interested in any typographic book dealers, libraries with typographic resources, and stores with a good selection of bow ties and / or socks. Do you have bow ties in Europe? I don't recall seeing any except in England now that I think about it. Typographic bow ties would be nice, but I'm not holding my breath. I've got a few typographic socks and definitely want more.</p>
    <p>I'm interested in type specimens, especially any san serif stuff. Any pointers to libraries would be appreciated. </p>
    <p>George<br>
    I was sad because I had no shoes, until I met a man who had no Bodoni.</p>
