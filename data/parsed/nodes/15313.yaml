    <p>Hi!</p>
    <p>Im working on a distressed font based on<br>
    characters from an ancient tombstone for my diploma.</p>
    <p>Does anyone have tips on how to implement<br>
    conextually glyph substitution for long s?</p>
    <p>Id like to have it done automatically but there are<br>
    just too many exceptions to the rules and im quite<br>
    new to opentype programming, so maybe i’d just<br>
    stick with including it as a special character which<br>
    can be accessed via glyph pallette?</p>
    <p>what do you think?</p>
    <p>thanks a lot, this forum has already been extremely useful!<br>
    hannes.</p>
