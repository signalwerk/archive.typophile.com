      <p>Sorry yes, I forgot to mention that ID doesn’t support hist ...<br>
      As Chester said, mirroring unsupported features (ornm is<br>
      another one) in an ssXX helps.</p>
      <p>If it shall work in old ID (non-CS) 2 or other apps too,<br>
      you need to use one of the standard features indeed.<br>
      ID CS2 is the only application so far which supports ssXX<br>
      features.<br>
      Which one, depends —<br>
      maybe not liga as you type might have ligatures,<br>
      maybe not dlig as your type might have abbreviations,<br>
      &amp;c<br>
      — titling is really a good choice!</p>
      <p>Karsten</p>
