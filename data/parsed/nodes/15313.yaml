      <p>You could do contextual alternates, but that is ON by default, so you have to want the feature to be ON unless you specifically turn it OFF. What you should do (in any event) is duplicate that hist feature and have the second version as “ss01”: you’ll be able to turn the feature ON using InDesign, which supports Stylistic Sets. If you also want to use the feature in Illustrator, you might consider making it a “titl”: Titling Alternates.</p>
      <p>It’s annoying that Adobe released a generation of products together as Creative Suite 2, but that they all have different type handling. I hope that they get their act together in the next version and all play nice and adopt the InDesign model.</p>
      <p>FYI, I have posted screengrabs of CS2’s OpenType “interfaces” here:<br>
      <a href="http://vllg.com/files/cs2/" title="http://vllg.com/files/cs2/">http://vllg.com/files/cs2/</a></p>
