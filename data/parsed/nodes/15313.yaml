      <p>Chester’s advice is good.<br>
      Or do it the other way round —</p>
      <p>Glyph names: “s” remains the round/end s and “longs” is the long s.<br>
      Define a class containing all lowercase (ligatures included), say @LC_for_longs. </p>
      <p>Make a “hist” feature with a contextual substitution:<br>
      sub s’ @LC_for_longs by longs;</p>
      <p>This means: Long s replaces normal s only if another lowercase follows. Not so if any other letter (uppercase, punctuation &amp; spaces included) follows. Same result as with Chester’s sample, but it’s easier to collect lowercase than all possible exceptions (like quotation marks &amp;c).<br>
      Moreover, you can also use the font without long s. E.g. if the app doesn’t support any features.</p>
      <p>Works well for English which has very simple long s rules: always except at the end of a word.<br>
      For German, you create a paragraph style with this feature switched on, and create a character style with this feature switched off. Then go through your text manually to apply the character style to normal s’s that should be round/end s ...</p>
      <p>Karsten</p>
