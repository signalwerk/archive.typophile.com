    html: |-
      <p>Should be a pretty simple OT feature:<br>
      Make “tall s” the s in your font. (Mapped to lowercase s.)<br>
      Create a new glyph using the “regular s” and call it “s.alt”.<br>
      Create a class with space, all punctuation, and “s”.<br>
      Whenever “s” is followed by your class, use “s.alt”.</p>
