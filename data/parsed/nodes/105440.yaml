    html: <p>Looks custom to me and /s looks even weird among the others. If I have to recreate it and even if it sounds "crazy", I'd probably start from <a class="freelinking external" href="http://www.myfonts.com/fonts/urw/eurostile" rel="nofollow">Eurostile</a> (mainly beacause of this /s) redrawing almost all letters from /o. An effortless solution would be to start from <a class="freelinking external" href="http://fontfabric.com/age-free-font" rel="nofollow">Age</a> and borrow /s from Eurostile.</p>
