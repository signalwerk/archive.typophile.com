    <p>Hi, people</p>
    <p>I am developing a new revival from Bulletin typewriter font, called NeoBulletin. The font is ready, I think, but the greek alphabet is a mistery to me, yet. I appreciate suggestions to fix the errors in the greek set. Follow the sample.</p>
    <p>antecipate thanks for the support of the greek designers comunity</p>
