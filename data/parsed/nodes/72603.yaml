    html: <p>It is similar to <a href="http://www.fontshop.com/fonts/singles/elsnerflake/romana_demi_ot/?&amp;sample_text=Zumbro&amp;sample_size=120&amp;acs_pt=32&amp;update=0" rel="nofollow">Romana</a>, but I am unable to find the precise weight used in the logo. Apart from the fact that the letters in your sample might have undergone some squooshing, they look as if they had been wider from the start, the stroke contrast appears to be less pronounced than in the version I linked to and the serifs are more sturdy.</p>
