      <p>Another factor to consider in good Hebrew type design is legibility.</p>
      <p>Once I was invited by Linotype of Germany to its type division in Hauppauge, Long Island, far from NYC. That office was filled with talented Jewish people then and some great non-Jewish type craftsmen. Linotype Germany flew out a type division vice president just for the meetingThey wanted me to join their ranks, which I politely refused.</p>
      <p>The German was extremely cordial to me for some reason, me the bearded Chassidic Jew. He rose when I came in. He didn't sit until I sat. And when I left, he jumped up to fetch my coat and help to place it on me.</p>
      <p>Then, he bawled like a little baby. He said: "I was a small boy when the Nazis came to power in Germany. Before that, I had a job at a Berlin kosher bakery. Every Friday, I delivered sweet good-tasting baked goods," said the German, "on my bicycle, from the bakery to many Jewish family's homes for the Jewish Sabbath. At each house, the mother invited me in and pinched my cheek." </p>
      <p>"You must be hungry," she said. She brought a glass of milk, and openned one of the bakery's boxes, and gave me a pastry. I ate it happily like any child. This happened over and over again, at each Jewish house I went to. It never happened at the Christian houses.</p>
      <p>Then, he shook violently, like he was having a short epileptic seizure.</p>
      <p>"Then, the Nazis came to power," exclaimed the German, "and it all ended. The kind Jewish people were taken to the Concentration Camps and killed in the Gas Chambers..." He cried again, and I left.</p>
      <p>At the meeting, he showed larged charts of the Times-Roman typeface in various sizes, enlarged to a single large poster size. The results were amazing. Each letter looked different from another.</p>
      <p>The m was different in the 9 point version, different in the 12 point version, and different again in the 18 point version. So was the w...</p>
      <p>He sadly said: "We have lost this now with scalable fonts, like PostScript and TrueType.</p>
      <p>I am reviving it again in OpenType with a variable width factor in an OpenType extension.</p>
      <p>How does this affect Hebrew?</p>
      <p>I studied Linotype's version of FrankReuhl. I asked one customer to give me huge blown-up samples of the FrankReuhl typeface at 9, 12, and 18 point sizes. He looked at me like I was mad.</p>
      <p>Every type expert is a bit mad.  :)</p>
      <p>Yes, the shin has variable widths and designs at different sizes. The aleph looked designed differeltly for each size. And so on.</p>
