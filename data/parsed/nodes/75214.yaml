      <p>Let's look at some examples.</p>
      <p>The great Israel type design, Henri Friedlander, creator of the popular Hadasa design (named after the famous art and print school which was employed), taught me rarely known 'secrets' of good Hebrew type design.</p>
      <p>For example, he advised the vov should always 'lean' over towards the left, to facilitate eye movement.</p>
      <p>Also, we see that the ancient designer of the gimmel 'lifts' the right side of the lower left 'leg' off the ground, leaving a small space, assisting again eye movement.</p>
      <p>This technique is repeated in some versions of FrankReuhl's aleph. The lower leg of the left side of the aleph, the 'shoe' if you will, is slightly lifted off the ground for the same reason.</p>
      <p>Color balance is the distribution of filled in areas of the letter forms in relationship to the white or empty spaces.</p>
      <p>For example, the hei and the chet is obviously differentiated by the openning at the top of the left vertical stroke which reaches up towards the left side of the top horizontal stroke.</p>
      <p>But do notice that on the daleth, which appear similar to many versions of the hei and chet, has a thicker right vertical stroke. This compensates for the additional white space or vacuum in the daleth, compared to the hei or chet.</p>
      <p>Similarly, the width of the chet is slightly larger than the width of the hei again to compensate in good color balance for vacuum or empty space in the top left corner of the hei.</p>
      <p>What other nuances do you find in Hebrew letter forms?</p>
