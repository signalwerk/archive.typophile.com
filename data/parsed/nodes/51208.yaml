      <p>Registering a vendor ID isn't exactly difficult, and might help your customers locate you at some point in the future. </p>
      <p><a href="http://www.microsoft.com/typography/links/vendorlist.aspx">http://www.microsoft.com/typography/links/vendorlist.aspx</a> </p>
      <p>I'd suggest not using the tool default as that seems a bit amateur. If you don't want to register an ID I'd suggest leaving it blank.</p>
