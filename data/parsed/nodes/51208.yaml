  html: |-
    <p>Hi,<br>
    What do most people do when filling in the 'TrueType Vendor Code' field in the 'Basic Font Identification' setting of FontLab.</p>
    <p>Should a one-man foundry register with Microsoft or Apple?<br>
    (Love to here comments and views from the normal Joe and the Microsoft guys on this)</p>
    <p>Or do you, as the manual says,<br><em>"...identify yourself without registering you may enter a lowercase four-letter vendor code."</em></p>
    <p>Is there a blank default setting, or are you bound to put something....like Pyrus?</p>
    <p>Thanks in advance<br>
    Drj</p>
