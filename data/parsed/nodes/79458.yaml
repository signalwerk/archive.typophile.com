    <p>I found a font that I like on website Foreign Affairs. They use it for the title of books:</p>
    <p><a href="http://www.foreignaffairs.com/articles/67523/richard-mcgregor/the-party-the-secret-world-of-chinas-communist-rulers" title="http://www.foreignaffairs.com/articles/67523/richard-mcgregor/the-party-the-secret-world-of-chinas-communist-rulers">http://www.foreignaffairs.com/articles/67523/richard-mcgregor/the-party-...</a></p>
    <p>I don't know if something's wrong with my Firfox, but it won't show the true font. It shows the font I'm looking after in Chrome and IE8. If you don't have the issue, great.</p>
    <p>image: <a class="freelinking external" href="http://img30.imageshack.us/img30/940/fontsample.jpg" rel="nofollow">http://img30.imageshack.us/img30/940/fontsample.jpg</a></p>
    <p>I looked the page source and couldn't find the answer. I thought it is the Lucida Grande, but showed up it isn't. I sent the image to "WhatTheFont?" detecting site, but didn't get the exact answer. Hope I get my answer here. Note that the letter "a" is unique.</p>
    <p>Thanks in advance,<br>
    G.</p>
