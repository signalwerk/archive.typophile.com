    html: |-
      <p>Not the ITC version, the original: <a href="http://myfonts.us/td-cgFcd9">Kabel Black</a>.</p>
      <p>Coincidentally, over the weekend I listened to a podcast interview with the guy who designed this logo, Peter Kleinman. In it he reveals that he was in the preliminary stages of thinking about the logo, just playing around with some Kabel type that he cut out. He thought the concept was dumb because it was so literal. The publisher happened to walk in, pulled it off his drawing table, and returned a short while later to say it was approved.</p>
      <p>If anyone's interested in listening, <a href="http://www.radioexiles.com/index.php?option=com_content&amp;view=article&amp;id=614:bookmarks-mark-chats-with-pete-kleinman-from-national-lampoon&amp;catid=72&amp;Itemid=172">here's a link</a>. (Warning: possibly NSFW)</p>
