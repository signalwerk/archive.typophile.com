  html: |-
    <p>Hello people, just a bit of fun and extremely useful for my dissertation research!</p>
    <p>can anyone find a font or a single character from a font that would represent a human being? does a typeface or a single character represent yourself and your emotions?  </p>
    <p>An example: The font Baskerville, the letter g in lowercase: Fragile, gentle, delicate, soft, lightweight, fashionable, fun.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/baskerville_5744.jpg"></div><p></p>
    <p>Businesses and companies choose a font that represents themselves and what they do, why cant a font represent us!!!</p>
    <p>Look Forward to your response</p>
