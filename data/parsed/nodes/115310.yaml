      <p>There is a font that seems to match your sample (if you expand it a bit) and you can find it under the following names:<br>
      <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Font-Bureau&amp;ffam=New%20York%20-%20Regular&amp;fid=a861edf9bbc78d0102107f6ff619472d&amp;fsize=60&amp;text=QRCA&amp;fit=1" rel="nofollow">New York</a></strong>:  (c) 1990-97 Apple Computer Inc.  1990-97 Type Solutions Inc.  1990-97 The Font Bureau Inc.<br>
      <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Font-Bureau&amp;ffam=SI%20New%20-%20Regular&amp;fid=eaa52210817d4955de38753fd31bb64e&amp;fsize=60&amp;text=QRCA&amp;fit=1" rel="nofollow">SI New</a></strong>: (c) 1990-91 Apple Computer Inc.   1990-91 Type Solutions Inc.   1990-91 The Font Bureau Inc.</p>
      <p>The funny thing is I can't find a legitimate source for the above fonts and there is another font in myfonts.com under the name "New York" which corresponds to the initial bitmap font designed for Apple by Susan Kare, which is obviously a different (sans serif) font:<br>
      <a href="http://www.myfonts.com/fonts/apple/new-york/" title="http://www.myfonts.com/fonts/apple/new-york/">http://www.myfonts.com/fonts/apple/new-york/</a></p>
      <p>Any ideas?</p>
