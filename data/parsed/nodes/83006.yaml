    <p>Hi all,</p>
    <p>I put this poster together as part of a class on Type Classification Systems last year but only got round to putting it online recently. It had some positive buzz on Tumblr so I thought I'd run it by the professionals and see what they thought ;)</p>
    <p>Bear in mind, it's based on a simplified system and just 3 months of being taught the fundamentals of Typography in my second language.</p>
    <p>I've put it up for sale on Mysoti but I'm thinking I might fork out for a run of decent A2 digital prints myself and put them up for sale if people are interested.</p>
    <p>Thanks.</p>
    <p>(High res: <a href="http://www.halftonesandheadphones.com/files/images/tube/tube_large.png" title="http://www.halftonesandheadphones.com/files/images/tube/tube_large.png">http://www.halftonesandheadphones.com/files/images/tube/tube_large.png</a>)</p>
