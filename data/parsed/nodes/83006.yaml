    html: |-
      <p>@Geofferino: If you haven’t already come across this, I recommend reading some Edward Tufte — <a href="http://www.edwardtufte.com/tufte/books_vdqi" title="http://www.edwardtufte.com/tufte/books_vdqi">http://www.edwardtufte.com/tufte/books_vdqi</a></p>
      <p>You may also enjoy:</p>
      <p>Ehses, H. (1976). <em>Design Papers 1. Semiotic Foundations of Typography</em>. NSCAD University. Halifax, Nova Scotia, Canada.</p>
      <p>Ehses, H., Lupton, E. (1988). <em>Design papers 5. Rhetorical handbook: an illustrated manual for graphic designers</em>. NSCAD University. Halifax, Nova Scotia, Canada.</p>
      <p>Ehses, H. (2008). <em>Design papers 6: Design on a rhetorical footing</em>. NSCAD University, Halifax, Nova Scotia, Canada.</p>
      <p>Ehses has a background in rhetoric and semiotics. He is a strong participant in the field of <a href="http://en.wikipedia.org/wiki/Visual_rhetoric" rel="nofollow">visual rhetoric</a> and uses the rhetorical process as a foundation for design process.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/process_6119.jpg"></div><p></p>
      <p>———</p>
      <p>He also uses several communication models from the field of semiotics to help graphic designers understand the communication process, such as Shannon (1948).</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/shannon_5825.jpg"></div><p></p>
      <p>His recommended reading regarding semiotics:</p>
      <p>Fiske, J. (1982). <em>Introduction to communication studies</em>. Guernsey Press Co Ltd, Great Britain.</p>
