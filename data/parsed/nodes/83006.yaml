    html: |-
      <p>Good idea—requiring you to consider the intersection of categories, and come to the conclusion that certain faces, eg Broadway, are representative of more than one.</p>
      <p>Sure, it's a cliché to appropriate an infographic metaphorically—and the correspondence between form and content will be forced and not entirely logical—but that may lead to discoveries (see Broadway, above).</p>
      <p>AFAIK, although the Tube map has been repurposed before, nobody has yet swiped it for type classification, so there is some originality involved. At least it's not the periodic table.</p>
      <p>While I would have liked to have seen more "St Pancras" multi-intersections, and a Circle Line, I think you did a good job of making the design work both conceptually, and in the execution of the map.</p>
      <p>As a product, I'm not sure it's particularly functional unless one knows what the faces look like. Isn't there some way to show the faces without disrupting the modernist minimalism too much?</p>
      <p>And I certainly won't be buying a print, although I might commission you to produce a Shinntype version :-)</p>
      <p>Yes, that would be the 21st century meta-design trick—create a program that spits out a map for whatever group of keyworded-by-category faces are entered. (The MyFonts tag cloud does that, although "free" isn't much of a phenotype.)</p>
