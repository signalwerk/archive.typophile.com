      <p>Actually, their Electra, called "Electric," was done by Jim Parkinson none too recently. <a href="http://www.adobe.com/products/adobemag/archive/pdfs/9609lskt.pdf" rel="nofollow">According to this interesting Adobe PDF</a>, it was designed prior to 1996. Looks like he also did a custom version of Metro for them, but that doesn't seem used for much of anything anymore.</p>
      <p>Adam, your paper has a really great modularity, with a lot of different elements to catch the readers eye -- very nice! But you could really use some white space for breathing room; the gutters between columns are very tight if not nonexistent, and you should put some between the different elements as well. Try building it into the template; it will make the newspaper a whole lot more attractive. Even if you don't implement a baseline grid as Nathaniel said (which is a great idea that worked well for me in the past), think of the white space as pacing your page -- you need the proper amount to give your readers a place to grab onto the next element or they'll be moving around so quickly they won't have anywhere to stop. As with many things, Bringhurst is good for understanding this, too.</p>
      <p>And while we're on the semi-relevant best-designed newspaper in the U.S., my favorites include the Houston Chronicle, Kansas City Star, and the Virginian-Pilot, with the WSJ, Fort Worth Star-Telegram, and Baltimore Sun as runners-up.</p>
      <p>EDIT: And I second Chaparral, though it might be a little light-hearted for news. If you do have any money you can finagle out of your school's newspaper budget, I would strongly recommend buying some new type (which of course people around here can help you out with) -- the perfect typeface(s) can go a long way toward establishing a strong identity, even if future generations are not as committed to design excellence as you are.</p>
      <p>EDIT 2: And, Mikey, they're not just Font Bureau specimens; there are a lot of Hoefler &amp; Frere-Jones types in them, too ;-)</p>
