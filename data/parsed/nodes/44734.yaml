      <p>Your layout is fine.<br>
      The design has punch and immediacy, which is so important in a paper.<br>
      And you've managed that with a considerable level of editorial complexity.<br>
      It would be a huge mistake to fancy it up by adding white space and non-news types such as Chaparral...which I can see you've just done, and already it's starting to look like a wishy-washy corporate newsletter.<br>
      In the context of newspapers, rules are much better than white space for demarcating content.<br>
      In general, it's a good idea to do the opposite of what graphic designers and typographers recommend for newspapers --unless they actually have experience in designing one.</p>
