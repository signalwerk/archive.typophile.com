    <p>This is my first Typophile post--please excuse any blatant ignorance</p>
    <p>I do the layout for a high school newspaper.  It is tabloid sized, five-columns, justified, 2" wide each (1.92" text-useable when you include margins) and I'm having some trouble figuring out just what size to make the text typeface.  I've had to drastically updated it every issue as my design skills improved: I've gone from 9.8 pt Liberation Serif to 9.1 pt Georgia to *something* Utopia, hopefully, for the upcoming issue.</p>
    <p>I've had .15 pt condensing but I'm thinking of swtiching to .1 condensing with 9.4 pt. Utopia.  Leading has always been 10.2.  Here's the question: is that a good size?  It's a high school, so too small and I don't think anyone will read it, but too big and huge spaces start to appear in the text.  I'm not a fan of hyphens, but I've let Publisher do its .25" hyphenation.</p>
    <p>I've googled 'Utopia font sizes' but have come up with nothing--I can't find what size type works for other newspapers.</p>
    <p>If you have any general size rules-of-thumb, I would appreciate it so much.  Thanks in advance</p>
