      <p>Adam - If you can, run out to your local bookstore and buy a copy of "The Elements of Typographic Style" by Robert Bringhurst. I think it's only about $15 or so, and you will find it an invaluable companion in your design education. It's one of the very, very few books that literally no designer in any field should be without -- I reread it every few years from cover to cover.</p>
      <p>In general, 9-10 pts will be just fine for a newspaper use. The biggest question is how long you want your lines of text to be, how you use your columns, and what leading you want to use. It certainly isn't going to make much difference whether you use (for example) 9.2 or 9.4 except as it relates to the leading.</p>
      <p>Do you know about leading grids? I'm guessing with a leading of 10.2 you're not using one, and for newspapers and magazines it is one of the really fundamental tools you want to use to create the basic design, along with the number of columns. A leading grid makes everything else easier, I remember stumbling across them in a design book when I was in high school (also working on the newspaper :D ) and having a real combination "duh"/"eureka" moment. I'd imagine Google will turn up tons of stuff on "leading grid" that you can follow (as would searches for newspaper layout, newspaper design) but come back and ask if you need clarification.</p>
      <p>Just to throw out an example, if you're using a 5-column layout on a tabloid page, I might use 9.5 Utopia with 12pt leading. Then using a leading grid, we can say we want our headlines to have 24pt leading, so maybe 17-22pts in size. You can set captions at 9/11 in a lighter or heavier or italicized face. You can do subheads at 16/24 or even 11/12 or 12/12 depending on how tests for readability and choices you make about style work out. Essentially, start with your body copy, figure out what combination of leading and columns make it work for your goals, and then design everything else based on the body copy. You might wind up using 4 columns of text, or break it up into sub-columns so that you can introduce asymmetry without throwing off alignment. So if you designed the page around 7 columns, you would have 3 columns of text, each of which spanned 2 columns, and a column of white space on the outside of the page where photos can hang, captions can go, things like that. Designing with grids that way adds visual interest without making things arbitrary, but don't feel obligated to try out everything at once :D</p>
      <p>Nathaniel</p>
