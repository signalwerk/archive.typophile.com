      <p>From my own (limited) experience (I'm only on a college newspaper, now), I believe that most papers set their type between 8 and 9 pts with approximately 1 pt leading (with hyphenation, a necessity), as you seem to be doing. But it all depends on the particularities of your newspaper -- the column width, page width, use of images, etc. You're definitely right that you don't want to scare off readers with too small type, but do consider that high schoolers do have good eyes, so a smaller point size may not be awful.</p>
      <p>I will say that when I redesigned my high school newspaper, I had just read <a href="/wiki/Elements%20of%20Typographic%20Style" class="freelinking" rel="nofollow">Bringhurst</a> and decided to use his recommendation of 9 pts with 11 pts leading (using <a href="http://typography.com/fonts/font_overview.php?productLineID=100017" rel="nofollow">Mercury Text Grade 2</a>). Only later did I realize that I had given the type twice as much leading as was customary, making the typography more like a book's. But, in fact, it worked out quite well, as I found that the airiness of the leading allowed me to set pages with remarkably few images without seeming intimidating. I'm not necessarily advocating this for your paper, but experimenting to find the optimal size, leading, etc. for your publication might be the way to go.</p>
      <p>Almost forgot: You can see lots of professional examples at the <a href="http://www.newseum.org/todaysfrontpages/main.asp" rel="nofollow">Newseum</a>. No point sizes listed, but you can get a feel for them.</p>
