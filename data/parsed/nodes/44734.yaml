      <p>I think you'll be hard-pressed to find a newspaper with text as large as 10 pt. Most are in the 9 pt range, as someone already mentioned. It also depends upon the face. Some types designed specifically for newspaper text are actually targeted to be used closer to 8.75 pt, but look more like 10 pt. </p>
      <p>With the typical narrow newspaper columns, you have to make a choice between hyphenation and atrocious spacing. Actually, you almost always get some bad spacing in such columns; you just do the best you can with overall H&amp;Js to minimize it. As a result, generally speaking, newspapers use pretty much the most liberal hyphenation settings of any print medium -- unlimited hyphens in a row, two characters before <em>and</em> after, hyphenated capitalized words and names, etc. Many things that ordinarily wouldn't be tolerated in book typography, for instance. It pretty much comes with the territory.</p>
      <p>If you've got the full pro version of Acrobat, you can spelunk in those Newseum PDFs and get information about the actual text specs of many papers.</p>
      <p>-- K.</p>
