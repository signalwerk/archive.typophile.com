      <p>Yes -- and between your columns, where you really need it. But you're right that it can be a tricky business. To echo Nathaniel again, if you set up a baseline grid (though I don't know if you can in Publisher; in InDesign it's pretty easy) you can just use that to define all your white space issues. So a headline may be one, two, three, or four leads from the text, and so on.</p>
      <p>Actually, in the Newspaper Designer's Handbook by Tim Harrower (which I actually recommend just as much as Bringhurst for you; it's incredible for explaining news design from the ground up), there is one page on spacing. He writes, as an example: "Headlines: Above: allow 18 pts. between logos or unrelated stories and top of the headline. Below: Allow 6 points between descenders and text/photos below. Roundups and briefs: When compiling packages of briefs that use small headlines (12- or 14-pt.), use tighter spacing: 1 pica of space above the headline and 6 pts. below." Maybe this will give you an idea of how spacing might work.</p>
      <p>EDIT: Your idea of looking at other newspapers may in the end be the best way. You may want to look for ones that have a similar layout to yours and examine their use of white space, both within and without articles, horizontally and vertically.</p>
