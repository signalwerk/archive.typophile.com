      <p>While it's possible to use any face, it's usually a good idea to pick something with short descenders for a newspaper. Corbel, for instance, would be nasty in "Grade eights..." with the descender of g and ascender of l bumping.</p>
      <p><em>I thought Myriad was far too bland</em><br>
      Unless you're picking a specific display face, e.g. Meta Headline, it's probably better to go with a generic sans, and take the blandness off it by nuancing tracking, leading, and horizontal scaling to suit your layout.</p>
      <p>If you're experimenting with controlling white space Adam, how about tightening up the tracking on the (Myriad) heads a bit?<br>
      That would "drive" out" the white space into the surrounding area.</p>
      <p><em>At the least, I think you should make it consistent</em></p>
      <p>Right.</p>
