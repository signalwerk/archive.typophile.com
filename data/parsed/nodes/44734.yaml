      <p>Dear Adam,<br>
      I'm sure you are busy, so this suggestion is one that will save you an enormous amount of time.  The size of a tabloid page is approximately 11 x 15.  Using Microsoft Word, set up a custom size of 11 x 15 (or whatever size you need).  Be sure the drawing toolbar is available.  From the drawing toolbar choose the text box tool, and draw a box the size of the page, less margins and headers or footers. Then paste your copy in the box in one column.  Change your type size to 9.5 or 10 point. By using the format paragraph command, set your leading to anything you wish.  Then select all the type; goto the format menu and select columns.  Choose the number of columns that you wish; set it for flush left,right or justified; choose the space between columns; add a line between columns (or not) and your page will be finished.  You may have a problem fitting the copy to the page size.  In that case you have no choice but to change the leading; change the point size of your type; use fillers to take up the space if you don't want to change the point size or the leading. I suggest you use ten point century with the leading at 11, for readability.  If you don't use fillers (cartoons; public service announcements etc.)you either have to change point size and leading as necessary or edit your copy to fit the space you have available.  If you have any questions my email is <a href="mailto:hz@thelitigator.org">hz@thelitigator.org</a>.<br>
      Herb</p>
