      <p>My reason for bringing up the OED bit was not to disagree with you at all, but – on the contrary – to give evidence as to why I agreed with the <cite>spur</cite> part of your vote for <cite>bilateral spur</cite>… while (much like these typographic flourishes) spurs are usually sharp and pointy things, the term can be interpreted more broadly than <cite>thorn</cite>, if need be, to include non-pointy things.</p>
      <p>I also agree that fancy is fun; indeed, the quest for a fancy name for these things is the inspiration for this thread :)</p>
      <p>So… <strong><cite>lateral spur</cite></strong>?</p>
