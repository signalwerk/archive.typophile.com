      <p>My guess as to what is happening on MyFonts is that foundries are spotting the <cite>tuscan</cite> keyword on other wood types and adopting it for their own fonts without knowing what it is really, other than a "Wild Western" thing. Generally though, the keyword application on MyFonts seems more or less to the point: <a class="freelinking external" href="http://www.myfonts.com/browse/keyword/tuscan/" rel="nofollow">http://www.myfonts.com/browse/keyword/tuscan/</a></p>
      <p>One other interesting example which I spotted in Rob Roy Kelly's book was <a class="freelinking external" href="http://www.myfonts.com/fonts/woodentypefonts/gothic-tuscan-round/" rel="nofollow">Gothic Tuscan Round</a>. Following this naming, the pointy side-brackets <em>do</em> make for a tuscan (or at least a Gothic Tuscan); but for my own purposes, I'm not sure I'm about to adopt that logic wholeheartedly just yet.</p>
      <p>To further confuse matters, there is a whole other class of tuscans which are less bifurcated than they are just concave:<br>
      <a class="freelinking external" href="http://www.myfonts.com/fonts/woodentypefonts/gothic-tuscan/" rel="nofollow">Gothic Tuscan</a><br>
      <a class="freelinking external" href="http://www.myfonts.com/fonts/woodentypefonts/antique-tuscan/" rel="nofollow">Antique Tuscan</a><br>
      <a class="freelinking external" href="http://www.myfonts.com/fonts/ihof/p22-tuscan-expanded/" rel="nofollow">Tuscan Expanded</a><br>
      <a class="freelinking external" href="http://www.myfonts.com/fonts/woodentypefonts/concave-tuscan-x/" rel="nofollow">Concave Tuscan</a></p>
      <p>But I'm getting off topic a bit here. Of course any related discussion is welcome, but I'm mostly interested hearing if people think the presence of these spur… er… <em>thorns</em>… are enough to endow a face with the classification of <cite>Tuscan</cite>.</p>
