      <p><em>Thorn is slightly limiting, as it implies sharpness.</em></p>
      <p>Isn't "spur" meant to be just as sharp a thing as a "thorn"? Spurs were traditionally those pointy star-shaped thingies people dug into the sides of horses for some get up and go-go. Spur and thorn are both sharp pointy things.</p>
      <p>Okay, so "bulge" is undesirable becaws these things can be soft and rounded, or sharp and pointy. How about these:</p>
      <p>Interlocation spur<br>
      Interposition spur<br>
      Lateral thorn<br>
      Lateral spur<br>
      Bilateral spur<br>
      Broadside thorn</p>
      <p>I vote for Bilateral spur.</p>
      <p>j a m e s</p>
