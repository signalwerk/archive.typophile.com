      <p>I think <em>thorn</em> is is the best term for that feature too.</p>
      <p>The strict definition of "tuscan" is a type with split or bifurcated stems, for example:<br>
      <a href="http://www.myfonts.com/fonts/sentinel/de-louisville/" title="http://www.myfonts.com/fonts/sentinel/de-louisville/">http://www.myfonts.com/fonts/sentinel/de-louisville/</a><br>
      <a href="http://www.myfonts.com/fonts/spiecegraphics/frisco-antique-display-sg/" title="http://www.myfonts.com/fonts/spiecegraphics/frisco-antique-display-sg/">http://www.myfonts.com/fonts/spiecegraphics/frisco-antique-display-sg/</a></p>
      <p>Myfonts appear to have revised their definition of "tuscan" not too long ago. It used to be assigned as a key word to wood type and Victorian faces with bands of vertical stressing but ordinary stems (not split), for example:<br>
      <a href="http://www.myfonts.com/fonts/fontmesa/cowboy-western/" title="http://www.myfonts.com/fonts/fontmesa/cowboy-western/">http://www.myfonts.com/fonts/fontmesa/cowboy-western/</a><br>
      <a href="http://www.myfonts.com/fonts/fontmesa/go-west/" title="http://www.myfonts.com/fonts/fontmesa/go-west/">http://www.myfonts.com/fonts/fontmesa/go-west/</a><br>
      <a href="http://www.myfonts.com/fonts/fontmesa/cowboy-rodeo/" title="http://www.myfonts.com/fonts/fontmesa/cowboy-rodeo/">http://www.myfonts.com/fonts/fontmesa/cowboy-rodeo/</a><br>
      <a href="http://www.myfonts.com/fonts/nicksfonts/spaghetti-western-wbw/" title="http://www.myfonts.com/fonts/nicksfonts/spaghetti-western-wbw/">http://www.myfonts.com/fonts/nicksfonts/spaghetti-western-wbw/</a><br>
      <a href="http://www.myfonts.com/fonts/nicksfonts/ouachita-way-wbw/" title="http://www.myfonts.com/fonts/nicksfonts/ouachita-way-wbw/">http://www.myfonts.com/fonts/nicksfonts/ouachita-way-wbw/</a><br>
      <a href="http://www.myfonts.com/fonts/nicksfonts/rio-grande-wbw/" title="http://www.myfonts.com/fonts/nicksfonts/rio-grande-wbw/">http://www.myfonts.com/fonts/nicksfonts/rio-grande-wbw/</a></p>
      <p>Types with the thorn feature and/or bands of vertical stressing are correctly named wood types, or classified as Victorian:<br>
      <a href="http://www.myfonts.com/fonts/fontmesa/go-west/" title="http://www.myfonts.com/fonts/fontmesa/go-west/">http://www.myfonts.com/fonts/fontmesa/go-west/</a></p>
      <p><a href="http://www.myfonts.com/fonts/solotype/opera-house/" title="http://www.myfonts.com/fonts/solotype/opera-house/">http://www.myfonts.com/fonts/solotype/opera-house/</a><br>
      is a true tuscan due to its split stems and genreally bifurcated outline.</p>
      <p>j a m e s</p>
