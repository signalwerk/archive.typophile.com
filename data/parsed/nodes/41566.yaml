    <p>You know those pointy spurs or brackets that are usually seen on the sides of old Tuscan faces (see <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/thunderbird/" rel="nofollow">Thunderbird</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/fontmesa/miss-scarlett/" rel="nofollow">Miss Scarlett</a>, <a class="freelinking external" href="http://farm3.static.flickr.com/2322/2232235718_998837c9a1_o.gif" rel="nofollow">etc</a>)? … Is there a technical term for those? I've looked through Rob Roy Kelly's book, but didn't find anything there.</p>
    <p>Also, do side-brackets a Tuscan make? Or does there need to be at least some kind of stroke bifurcation or splaying? For instance, where do these land?:</p>
    <ul>
    <li><a class="freelinking external" href="http://www.myfonts.com/fonts/woodentypefonts/number-515/" rel="nofollow">Hamilton's 515</a></li>
    <li><a class="freelinking external" href="http://www.myfonts.com/fonts/fontmesa/cowboy-western/" rel="nofollow">Cowboy Western</a></li>
    <li><a class="freelinking external" href="http://www.myfonts.com/fonts/cubanica/sombra/" rel="nofollow">Sombra</a></li>
    </ul>
    <p>Am I wasting my time trying to nail down concrete terminology for 19th-century ornamental typographic phenomena?</p>
