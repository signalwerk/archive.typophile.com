      <p><em>Other than the spur you’re referencing, spur can also mean a thing that projects or branches off from a main body [OED]</em></p>
      <p>Is that a secondary meaning or principle meaning? Balance it against the meaning people typically associate with spur. The SOED reckons the first and principle meaning of spur is "A device for pricking the side of a horse in order to make it urge forward, consisting of a small or spiked wheel attached to the rider's heel. SOED also lists spur as a verb, its principle meaning "To prick (a horse, etc)..."</p>
      <p>Fancy is fun.</p>
      <p>Don't turn it into a peeing contest.</p>
      <p>j a m e s</p>
