      <p>Rob Roy Kelly states in <cite><a class="freelinking external" href="http://www.amazon.com/American-wood-type-1828-1900-evolution/dp/B0006BUMMO/" rel="nofollow">American Wood Type</a></cite>:<br>
      <cite>Nicolette Gray surmises that these fishtail serifs originated with the Greeks and that their use became common in Rome during the third century… Some of the Tuscan's best interpretations were accomplished by Italian illuminators and engravers during the sixteenth and seventeenth centuries.</cite></p>
      <p>He also shows an example of a stone inscription (originally pointed out by Stanley Morisson in his article <cite>Decorated Letters</cite> from <cite>Fleuron VI</cite>)  by Furius Dionysios Filocalus of Rome, made circa 380 AD, which <cite>shows a pronounced Tuscan treatment of serifs</cite>.</p>
