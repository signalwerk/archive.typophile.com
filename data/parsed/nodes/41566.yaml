      <p>Thanks for the reference to the other thread Florian. Only on Typophile could I be not the only person wondering what the name for this things is!</p>
      <p>I tend to like <cite>spur</cite> or <cite>thorn</cite> because they can exist independently from the concept of <cite>Tuscan</cite> if need be.</p>
      <p><cite>Thorn</cite> is slightly limiting, as it implies sharpness. Similarly, the <cite>bulge</cite> suggested in that previous thread is limiting because it implies, well, bulginess (wow, my spell check let that word pass).</p>
      <p>It is too bad that <cite>spur</cite> is already in use for another typo-term (not that there aren't a million typo-homographs already) … maybe I'll add a <cite>side-</cite> prefix to it and call it a day: <strong><cite>side-spur</cite></strong></p>
      <p>I mean after all, it is vaguely similar, formally, to the other kind of spur, right? The main difference is that it happens on the side of the letter.</p>
