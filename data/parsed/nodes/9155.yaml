    html: <p>after seeing how the ﬁrst uppercase set forced me into an italic font rather than a script font, i decided to see what a non-italic version would look like. <br><br>i’m still trying to capture an elegant script uppercase set, but it’s slow going. <br><br>in the mean time, here’s a few variations of katie so far. <br><br>kevin and gustavo, thanks for your help. i’ve noted your desire to see a baseline l. i haven’t been able to make one i like yet, because it looks like it’s leaning awkwardly without the long tail to balance it. <br><br>i’ll put something up soon. <br><br>it’s a pleasure to have your feedback stephen. thanks again for your time everyone. <br><br><img src="http://www.typophile.com/forums/messages/29/65093.gif" alt=""></p>
