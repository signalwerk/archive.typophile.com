  html: <p>like many pixel font junkies, i’m continually inspired by miguel hernandez. his fundamental typeface has been one of my favorites for years, and i have always wanted to try my hand at a character set that featured those fabulous peaks throughout the lowercase set. <br><br>so, i ﬁnally committed an evening to doing something about it, and katie is the result. <br><br>now, i know nothing of script typefaces. in fact, i have very little traditional type heritage knowledge. i just like creating the pixel letterforms. usually, not a problem. <br><br>now, it’s a big problem, because i have <span class="caps">NO</span> idea where to start with the upper case. <br><br>i’m thinking the uppers will be very subdued compared to the lowers. <br><br>can anyone point me in a direction to follow? <br><br>also, i’m having trouble with the second half of the lc character set. they lean, where the rest are upright. i’m not sure there’s much i can do about it though. <br><br>is the second version too “scripty”&nbsp;? <br><br><img src="http://www.typophile.com/forums/messages/29/64968.gif" alt=""></p>
