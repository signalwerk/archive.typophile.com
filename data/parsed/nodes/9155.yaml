    html: <p>well, the upper case set is functioning at least. i really don’t know how much more i can tweak it, but i’ll keep trying. <br><br>i thought i might create a script uppercase, but that was a disaster. so i went with the more conservaative approach; essentially turning the font into an upright italics. <br><br>sort of. <br><br>the vertical nature of the set as a whole is rather hard for me to capture with the uppers while simultaneously giving them any sort of curvature. everything ends up looking angular. <br><br>any critical eyeballing is most welcome. <br><br><img src="http://www.typophile.com/forums/messages/29/65006.gif" alt=""></p>
