    date: 2005-02-18T13:16:00
    votes: null
    html: "<p>thanks tiffany, for your continued attention. <br> <br>i've got three other styles of scripts i'm working on, but this was the one i was the most excited about. <br> <br>in the end, it has suffered from the same problems all my other attempts have: letters leaning the wrong way, or \"interpretive\" characters conflicting stylistically with \"literal\" characters. <br> <br>i haven't been able to create a set that flows naturally. yet. <br> <br>i'm open to any advice! <br> <br> <br><img src=\"http://www.typophile.com/forums/messages/29/65561.gif\" alt=\"\"></p>"
