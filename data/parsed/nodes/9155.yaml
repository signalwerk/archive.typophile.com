    html: <p>getting crazy with the cheese-wiz here. <br><br>many of these characters are either a) place ﬁllers until i can ﬁgure out better solutions, b) satisfactory solutions for a script set, but not necessarily <span class="caps">THIS</span> script set, or c) i don’t know. i haven’t ﬁgured out c yet. <br><br>scripts are very complex! <br><br>isn’t it better if all the characters’ ascenders and descenders arc the same way? <br><br>i’ve done what i can to research existing sets on the web, but each one is so unique, it really doesn’t do me much good as far as extrapolating a basic set of rules to follow. <br><br>all i know is that these scripts aren’t working yet. i’ll keep tinkering. <br><br><img src="http://www.typophile.com/forums/messages/29/65166.gif" alt=""></p>
