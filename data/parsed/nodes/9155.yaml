    html: <p>katie is very elegant, tyler — i like it. <br><br>i agree with kevin that the long ‘l’ is distracting. <br><br>i think the uppercase ﬁts well to the lowercase. maybe you could try to make the stem of the ‘Y’ vertical? <br><br>you can also try to extend it to bigger sizes (15, 17, 19…) — it will get even lighter and softer. <br><br>i can imagine this font in a composition with a big capital, ornamented borders (something like your icon)… <br><br>have fun, <br>-&nbsp;g.</p>
