    html: <p>trying to marry the characters better. especially between the second half of the set and the first. <br> <br>since i can't think of a way to stand the second half upright, i've tried to tilt the first half toward the second. <br> <br>flows a bit better this way, and besides, the a, b, c, d, e, g, o, p, and q all are made of the same bowl now. <br> <br><img src="http://www.typophile.com/forums/messages/29/64985.gif" alt=""></p>
  - id: 59520
    user_id: 2139
    user_name: tyleryoung
    user_path: null
    date_raw: 9 Feb 2005 — 1:23am
    date: 2005-02-09T01:23:00
    votes: null
    html: <p>well, the upper case set is functioning at least. i really don't know how much more i can tweak it, but i'll keep trying. <br> <br>i thought i might create a script uppercase, but that was a disaster. so i went with the more conservaative approach; essentially turning the font into an upright italics. <br> <br>sort of. <br> <br>the vertical nature of the set as a whole is rather hard for me to capture with the uppers while simultaneously giving them any sort of curvature. everything ends up looking angular. <br> <br>any critical eyeballing is most welcome. <br> <br><img src="http://www.typophile.com/forums/messages/29/65006.gif" alt=""></p>
  - id: 59521
    user_id: 2462
    user_name: cerulean
    user_path: null
    date_raw: 9 Feb 2005 — 10:42am
    date: 2005-02-09T10:42:00
    votes: null
    html: <p>I think you may find it wise to eliminate the descender of the "l". It reads like a "long s" to me.</p>
  - id: 59522
    user_id: 1295
    user_name: Gustavo Ferreira
    user_path: null
    date_raw: 9 Feb 2005 — 3:44pm
    date: 2005-02-09T15:44:00
    votes: null
    html: <p>katie is very elegant, tyler - i like it. <br> <br>i agree with kevin that the long 'l' is distracting. <br> <br>i think the uppercase fits well to the lowercase. maybe you could try to make the stem of the 'Y' vertical? <br> <br>you can also try to extend it to bigger sizes (15, 17, 19...) - it will get even lighter and softer. <br> <br>i can imagine this font in a composition with a big capital, ornamented borders (something like your icon)... <br> <br>have fun, <br>- g.</p>
  - id: 59523
    user_id: 2139
    user_name: tyleryoung
    user_path: null
    date_raw: 9 Feb 2005 — 5:27pm
    date: 2005-02-09T17:27:00
    votes: null
    html: <p>after seeing how the first uppercase set forced me into an italic font rather than a script font, i decided to see what a non-italic version would look like. <br> <br>i'm still trying to capture an elegant script uppercase set, but it's slow going. <br> <br>in the mean time, here's a few variations of katie so far. <br> <br>kevin and gustavo, thanks for your help. i've noted your desire to see a baseline l. i haven't been able to make one i like yet, because it looks like it's leaning awkwardly without the long tail to balance it. <br> <br>i'll put something up soon. <br> <br>it's a pleasure to have your feedback stephen. thanks again for your time everyone. <br> <br><img src="http://www.typophile.com/forums/messages/29/65093.gif" alt=""></p>
  - id: 59524
    user_id: 2139
    user_name: tyleryoung
    user_path: null
    date_raw: 10 Feb 2005 — 5:54pm
    date: 2005-02-10T17:54:00
    votes: null
    html: <p>getting crazy with the cheese-wiz here. <br> <br>many of these characters are either a) place fillers until i can figure out better solutions, b) satisfactory solutions for a script set, but not necessarily THIS script set, or c) i don't know. i haven't figured out c yet. <br> <br>scripts are very complex! <br> <br>isn't it better if all the characters' ascenders and descenders arc the same way? <br> <br>i've done what i can to research existing sets on the web, but each one is so unique, it really doesn't do me much good as far as extrapolating a basic set of rules to follow. <br> <br>all i know is that these scripts aren't working yet. i'll keep tinkering. <br> <br><img src="http://www.typophile.com/forums/messages/29/65166.gif" alt=""></p>
