      <p>Speaking for me, I am not too familiar with 'boutique foundries' and I tend to search MyFonts or the better organized freebie sites. WIRED doesn't have a colophon for their magazine where they tell what typefaces are used in the publication? Usually it's on the page with the names of Editors and Art Directors. Another idea would be to ask the Art Director, since that is usually who chooses the type.</p>
      <p>- Mike Yanega</p>
