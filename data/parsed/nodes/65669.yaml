      <p>The most similar font I could find was a freebie called <a class="freelinking external" href="http://www.dafont.com/clone-wars.font?nb_ppp=50&amp;text=PLAYLIST347">Clone Wars</a>. Techno fonts would be relatively easy to create or customize (which is why there are so many of them), and it's possible Wired commissioned such a font for their magazine.</p>
