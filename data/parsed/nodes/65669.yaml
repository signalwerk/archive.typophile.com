    date: 2010-01-06T16:27:00
    date_raw: 6.Jan.2010 4.27pm
    votes: null
    html: <p>Thanks for the help, Mike. While it is possible it's custom, it's unlikely given that all their recent custom type such as Vitesse was commissioned by Hoefler and Frere Jones.  When they don't use custom type they almost exclusively use H&amp;FJ  faces such as the use of Exchange, Tunsten, among others. I've already heard from H&amp;FJ that this type is not theirs. When they do use outside type, it's usually boutique foundries which is why this forum is a great placed to get that identified. My thought is that this is a boutique font. I just wish not knowing didn't bother me so much especially since it's in my face every month.</p>
