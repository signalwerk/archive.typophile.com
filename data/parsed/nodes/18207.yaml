    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Typefaces" class="freelinking" rel="nofollow">Typefaces</a> : Good Libre Fonts</strong></p>
    <p>This wiki page collects fonts which meet two criteria:</p>
    <p>1. They are free, in the "libre" rather than "gratis" sense of the word. In the free software world, this distinction is often phrased as "free as in speech" as opposed to "free as in beer." The fonts on this page are all released under licenses compatile with the <a href="http://www.debian.org/social_contract" rel="nofollow">Debian Free Software Guidelines</a>, which is the usual metric in the free software world. The <a href="http://www.opensource.org/docs/definition.php" rel="nofollow">Open Source Definition</a> is similar, and in the vast majority of cases will cover exactly the same licenses.</p>
    <p>Compatible licenses include GPL, OFL, and public domain. Incompatible licenses include most of the Creative Commons licenses (see <a href="http://people.debian.org/~evan/ccsummary.html" rel="nofollow">here</a> for a summary), AFPL, and all "free for noncommercial use" licenses. Perhaps someone will feel moved to create a <a href="/wiki/Good%20Gratis%20Fonts" class="freelinking" rel="nofollow">Good Gratis Fonts</a> page.</p>
    <p>2. They are pretty good, by the consensus of the <a href="/wiki/typophile" class="freelinking" rel="nofollow">typophile</a> community. There are a lot of really terrible free fonts out there, but relatively few good ones. This is the page for those.</p>
    <p><strong>URW Collection</strong></p>
    <p>Some time in the mid-90's (todo: get exact date), Artifex Software, the maintainers and commercial licensors of Ghostscript, funded the donation to the GPL world of the <a href="/wiki/URW" class="freelinking" rel="nofollow">URW</a> font set compatible with the standard PostScript 35. These fonts include: Nimbus Roman No. 9 (clone of <a href="/wiki/Times%20Roman" class="freelinking" rel="nofollow">Times Roman</a>), Nimbus Sans (clone of <a href="/wiki/Helvetica" class="freelinking" rel="nofollow">Helvetica</a>), Nimbus Mono (clone of <a href="/wiki/Courier" class="freelinking" rel="nofollow">Courier</a>), Century Schoolbook L (clone of <a href="/wiki/New%20Century%20Schoolbook" class="freelinking" rel="nofollow">New Century Schoolbook</a>), URW Bookman L (clone of <a href="/wiki/Bookman" class="freelinking" rel="nofollow">Bookman</a>), Palladio (clone of <a href="/wiki/Palatino" class="freelinking" rel="nofollow">Palatino</a>), URW Chancery L (clone of <a href="/wiki/Zapf%20Chancery" class="freelinking" rel="nofollow">Zapf Chancery</a>), Standard Symbols L (clone of <a href="/wiki/Symbol" class="freelinking" rel="nofollow">Symbol</a>), and Dingbats (clone of <a href="/wiki/Zapf%20Dingbats" class="freelinking" rel="nofollow">Zapf Dingbats</a>).</p>
    <p>These fonts are included in all Linux distributions, and also form the basis for a number of extension and internationalization projects, including <a href="http://www.nongnu.org/freefont/" rel="nofollow">freefont</a> and Valek Filippov's <a href="ftp://ftp.gnome.ru/fonts/urw/release/" rel="nofollow">cyrillic releases</a>.</p>
    <p><strong><a href="/wiki/Gentium" class="freelinking" rel="nofollow">Gentium</a></strong></p>
    <p>The <a href="http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;item_id=Gentium" rel="nofollow">Gentium</a> font, designed by Victor Gaultney under the auspices of SIL, is now released under the new OFL font license.</p>
    <p><strong>Doulos SIL</strong><br>
    The <a href="http://scripts.sil.org/DoulosSILfont" rel="nofollow">Doulos SIL</a> font, similar to SIL Doulos, originally an IPA font by SIL International, is now released under the new OFL font license. Wide coverage of Latin and Cyrillic.</p>
    <p><strong>Charis SIL</strong><br>
    The <a href="http://scripts.sil.org/CharisSILfont" rel="nofollow">Charis SIL</a> font, similar to Bitsream Charter by Matthew Carter, released under OFL by SIL International is the creator of the font. Wide coverage of Latin and Cyrillic.</p>
    <p><strong>JUnicode</strong></p>
    <p><a href="http://junicode.sourceforge.net/" rel="nofollow">JUnicode</a> is another font with a very strong emphasis on Unicode coverage and internationalization. It has essentially complete coverage of the Latin ranges in Unicode, and is thus suitable for Old English, IPA, and other such scripts.</p>
    <p><strong>Vera</strong></p>
    <p>Bitstream and Gnome have released the <a href="" rel="nofollow">Vera</a> font family (based on Proxima, and with fairly good TrueType hinting) under an open license. There are a number of derivatives, including <a href="http://tavmjong.free.fr/FONTS/" rel="nofollow">Arev</a> and <a href="http://dejavu.sourceforge.net/wiki/index.php/Main_Page" rel="nofollow">DejaVu</a>.</p>
    <p><strong>DejaVu</strong><br>
    The <a href="http://dejavu.sourceforge.net/wiki/index.php/Main_Page" rel="nofollow">DejaVu</a> fonts are public domain additions to the Bitstream Vera fonts. Wide coverage of Latin, Greek and Cyrillic.</p>
    <p><strong>Charter</strong></p>
    <p>Bitstream Charter, by <a href="/wiki/Matthew%20Carter" class="freelinking" rel="nofollow">Matthew Carter</a>, is freely available from <a href="http://www.tug.org/tex-archive/fonts/charter/" rel="nofollow">TUG</a> and other sources.</p>
    <p><strong>Adobe Utopia</strong></p>
    <p>See the note below.</p>
    <p><strong>Droid fonts</strong><br>
    As used on the Android platform, are licensed under Apache License 2.0. Made by Ascender. </p>
    <p><strong>Honorable mention</strong></p>
    <p>The <a href="/wiki/Computer%20Modern" class="freelinking" rel="nofollow">Computer Modern</a> fonts distributed with TeX are just below the level of quality intended for this page, but have a number of interesting properties and are in fairly wide use for math typesetting. The main font in the family is essentially a clone of Monotype Modern No. 8. Interestingly, these fonts were among the very earliest digital fonts to implement <a href="/wiki/Optical%20Scaling" class="freelinking" rel="nofollow">Optical Scaling</a>.</p>
    <p><strong>See also</strong></p>
    <dl>
    <dt><a class="freelinking external" href="http://www.geocities.com/hartke01/" rel="nofollow">Free Font Resources for Free Open Source Operating Systems</a></dt>
    <dd>by Stephen G. Hartke</dd>
    <dt><a class="freelinking external" href="http://www.tug.org/fonts/" rel="nofollow">Fonts and TeX</a></dt>
    <dd>by the TeX Users Group</dd>
    <dt><a class="freelinking external" href="http://www.openfontlibrary.org/wiki/Existing_Free_Fonts" rel="nofollow">Existing Free Fonts</a></dt>
    <dd>on the wiki of the Open Font Library</dd>
    </dl>
    <p><strong>The Utopia license</strong></p>
    <p>Luxi, IBM Courier, and Adobe Utopia are widely included in Linux distributions, but the Debian people feel the licenses are not clearly within the DFSG. Utopia was recently re-released by Adobe to the TeX Users Group with a <a class="freelinking external" href="http://tug.org/fonts/utopia/LICENSE-utopia.txt" rel="nofollow">clarified license</a>. The license itself grants TUG the right to freely distribute and modify the font, as well as the right to sublicense the font to other parties. TUG has issued a blanket statement sublicensing the font to any interested parties. It appears that the question regarding the freeness of Utopia has been resolved. <a class="freelinking external" href="http://ospublish.constantvzw.org/type/an-update-on-the-status-of-utopia" rel="nofollow">This post</a> on Open Source Publishing also comes this conclusion, and includes additional clarifications by Adobe.</p>
    <p><strong>Todo</strong></p>
    <p>What about Igino Marini's <a href="http://www.iginomarini.com/fell.html" rel="nofollow">Fell fonts</a>? The quality is good, the license is not DFSG compatible in various ways: <a href="http://www.iginomarini.com/download.html" title="http://www.iginomarini.com/download.html">http://www.iginomarini.com/download.html</a></p>
