    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12270" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typefaces</a>&nbsp;: Good Libre&nbsp;Fonts</strong></p>
    <p>This wiki page collects fonts which meet two&nbsp;criteria:</p>
    <p>1. They are free, in the “libre” rather than “gratis” sense of the word. In the free software world, this distinction is often phrased as “free as in speech” as opposed to “free as in beer.” The fonts on this page are all released under licenses compatile with the <a href="http://www.debian.org/social_contract">Debian Free Software Guidelines</a>, which is the usual metric in the free software world. The <a href="http://www.opensource.org/docs/definition.php">Open Source Definition</a> is similar, and in the vast majority of cases will cover exactly the same&nbsp;licenses.</p>
    <p>Compatible licenses include <span class="caps">GPL</span>, <span class="caps">OFL</span>, and public domain. Incompatible licenses include most of the Creative Commons licenses (see <a href="http://people.debian.org/~evan/ccsummary.html">here</a> for a summary), <span class="caps">AFPL</span>, and all “free for noncommercial use” licenses. Perhaps someone will feel moved to create a <a href="/node/add/wiki?edit%5Btitle%5D=Good%20Gratis%20Fonts" title="Create node &quot;Good Gratis Fonts&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Good Gratis Fonts</a> page.</p>
    <p>2. They are pretty good, by the consensus of the <a href="/node/12022" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typophile</a> community. There are a lot of really terrible free fonts out there, but relatively few good ones. This is the page for&nbsp;those.</p>
    <p><strong><span class="caps">URW</span>&nbsp;Collection</strong></p>
    <p>Some time in the mid-90’s (todo: get exact date), Artifex Software, the maintainers and commercial licensors of Ghostscript, funded the donation to the <span class="caps">GPL</span> world of the <a href="/node/14085" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal"><span class="caps">URW</span></a> font set compatible with the standard PostScript 35. These fonts include: Nimbus Roman No. 9 (clone of <a href="/node/add/wiki?edit%5Btitle%5D=Times%20Roman" title="Create node &quot;Times Roman&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Times Roman</a>), Nimbus Sans (clone of <a href="/node/13514" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Helvetica</a>), Nimbus Mono (clone of <a href="/node/add/wiki?edit%5Btitle%5D=Courier" title="Create node &quot;Courier&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Courier</a>), Century Schoolbook L (clone of <a href="/node/add/wiki?edit%5Btitle%5D=New%20Century%20Schoolbook" title="Create node &quot;New Century Schoolbook&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">New Century Schoolbook</a>), <span class="caps">URW</span> Bookman L (clone of <a href="/node/29639" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Bookman</a>), Palladio (clone of <a href="/node/16864" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Palatino</a>), <span class="caps">URW</span> Chancery L (clone of <a href="/node/add/wiki?edit%5Btitle%5D=Zapf%20Chancery" title="Create node &quot;Zapf Chancery&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Zapf Chancery</a>), Standard Symbols L (clone of <a href="/node/add/wiki?edit%5Btitle%5D=Symbol" title="Create node &quot;Symbol&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Symbol</a>), and Dingbats (clone of <a href="/node/add/wiki?edit%5Btitle%5D=Zapf%20Dingbats" title="Create node &quot;Zapf Dingbats&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Zapf Dingbats</a>).</p>
    <p>These fonts are included in all Linux distributions, and also form the basis for a number of extension and internationalization projects, including <a href="http://www.nongnu.org/freefont/">freefont</a> and Valek Filippov’s <a href="ftp://ftp.gnome.ru/fonts/urw/release/">cyrillic releases</a>.</p>
    <p><strong><a href="/node/28592" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Gentium</a></strong></p>
    <p>The <a href="http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;item_id=Gentium">Gentium</a> font, designed by Victor Gaultney under the auspices of <span class="caps">SIL</span>, is now released under the new <span class="caps">OFL</span> font&nbsp;license.</p>
    <p><strong>Doulos <span class="caps">SIL</span></strong><br>
    The <a href="http://scripts.sil.org/DoulosSILfont">Doulos <span class="caps">SIL</span></a> font, similar to <span class="caps">SIL</span> Doulos, originally an <span class="caps">IPA</span> font by <span class="caps">SIL</span> International, is now released under the new <span class="caps">OFL</span> font license. Wide coverage of Latin and&nbsp;Cyrillic.</p>
    <p><strong>Charis <span class="caps">SIL</span></strong><br>
    The <a href="http://scripts.sil.org/CharisSILfont">Charis <span class="caps">SIL</span></a> font, similar to Bitsream Charter by Matthew Carter, released under <span class="caps">OFL</span> by <span class="caps">SIL</span> International is the creator of the font. Wide coverage of Latin and&nbsp;Cyrillic.</p>
    <p><strong><span class="caps">JU</span>nicode</strong></p>
    <p><a href="http://junicode.sourceforge.net/"><span class="caps">JU</span>nicode</a> is another font with a very strong emphasis on Unicode coverage and internationalization. It has essentially complete coverage of the Latin ranges in Unicode, and is thus suitable for Old English, <span class="caps">IPA</span>, and other such&nbsp;scripts.</p>
    <p><strong>Vera</strong></p>
    <p>Bitstream and Gnome have released the <a href="">Vera</a> font family (based on Proxima, and with fairly good TrueType hinting) under an open license. There are a number of derivatives, including <a href="http://tavmjong.free.fr/FONTS/">Arev</a> and <a href="http://dejavu.sourceforge.net/wiki/index.php/Main_Page">DejaVu</a>.</p>
    <p><strong>DejaVu</strong><br>
    The <a href="http://dejavu.sourceforge.net/wiki/index.php/Main_Page">DejaVu</a> fonts are public domain additions to the Bitstream Vera fonts. Wide coverage of Latin, Greek and&nbsp;Cyrillic.</p>
    <p><strong>Charter</strong></p>
    <p>Bitstream Charter, by <a href="/node/13520" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Matthew Carter</a>, is freely available from <a href="http://www.tug.org/tex-archive/fonts/charter/"><span class="caps">TUG</span></a> and other&nbsp;sources.</p>
    <p><strong>Adobe&nbsp;Utopia</strong></p>
    <p>See the note&nbsp;below.</p>
    <p><strong>Droid fonts</strong><br>
    As used on the Android platform, are licensed under Apache License 2.0. Made by&nbsp;Ascender. </p>
    <p><strong>Honorable&nbsp;mention</strong></p>
    <p>The <a href="/node/add/wiki?edit%5Btitle%5D=Computer%20Modern" title="Create node &quot;Computer Modern&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Computer Modern</a> fonts distributed with TeX are just below the level of quality intended for this page, but have a number of interesting properties and are in fairly wide use for math typesetting. The main font in the family is essentially a clone of Monotype Modern No. 8. Interestingly, these fonts were among the very earliest digital fonts to implement <a href="/node/13895" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Optical Scaling</a>.</p>
    <p><strong>See&nbsp;also</strong></p>
    <dl><dt><a href="http://www.geocities.com/hartke01/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Free Font Resources for Free Open Source Operating&nbsp;Systems</a></dt>
    <dd>by Stephen G.&nbsp;Hartke</dd>
    <dt><a href="http://www.tug.org/fonts/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Fonts and&nbsp;TeX</a></dt>
    <dd>by the TeX Users&nbsp;Group</dd>
    <dt><a href="http://www.openfontlibrary.org/wiki/Existing_Free_Fonts" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Existing Free&nbsp;Fonts</a></dt>
    <dd>on the wiki of the Open Font&nbsp;Library</dd>
    </dl><p><strong>The Utopia&nbsp;license</strong></p>
    <p>Luxi, <span class="caps">IBM</span> Courier, and Adobe Utopia are widely included in Linux distributions, but the Debian people feel the licenses are not clearly within the <span class="caps">DFSG</span>. Utopia was recently re-released by Adobe to the TeX Users Group with a <a href="http://tug.org/fonts/utopia/LICENSE-utopia.txt" title="Click to visit an external URL." class="freelink freelink-external freelink-external">clarified license</a>. The license itself grants <span class="caps">TUG</span> the right to freely distribute and modify the font, as well as the right to sublicense the font to other parties. <span class="caps">TUG</span> has issued a blanket statement sublicensing the font to any interested parties. It appears that the question regarding the freeness of Utopia has been resolved. <a href="http://ospublish.constantvzw.org/type/an-update-on-the-status-of-utopia" title="Click to visit an external URL." class="freelink freelink-external freelink-external">This post</a> on Open Source Publishing also comes this conclusion, and includes additional clarifications by&nbsp;Adobe.</p>
    <p><strong>Todo</strong></p>
    <p>What about Igino Marini’s <a href="http://www.iginomarini.com/fell.html">Fell fonts</a>? The quality is good, the license is not <span class="caps">DFSG</span> compatible in various ways: <a href="http://www.iginomarini.com/download.html">http://www.iginomarini.com/download.html</a></p>
