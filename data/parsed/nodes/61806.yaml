  html: |-
    <p>There has to be some designers who also happen to be (American) football fans out there somewhere…</p>
    <p>As part of the redesign/update of the NFL logo before the start of the last season,  the league also implemented (I think) the same typeface in all of their branding for sub-logos, website, etc. etc…</p>
    <p>I believe it's a proprietary font, but does anyone out there know this one? Also, sorry if this is a repeat question on the forum.</p>
    <p>Thanks!</p>
