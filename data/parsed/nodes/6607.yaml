    html: <p>What about Trinite? <br> <br>All characters without ascenders or descenders (capitals, and numberals for example ) are identical across all 4 versions. This makes it possible to switch effortlessly from Roman Wide 1 to Roman Wide 2 or Roman Wide 3 without reflowing the text. Also, the 'regular' fonts (Roman Wide, Roman Condensed and Italic) have the same width as the corresponding medium variants (Medium Wide, Medium Condensed and Medium Italic) thus making it possible to switch from regular to medium weight without the problem of reflow. <br> <br><a href="http://www.teff.nl/fonts/trinite/trinite.html" target="_blank">http://www.teff.nl/fonts/trinite/trinite.html</a></p>
