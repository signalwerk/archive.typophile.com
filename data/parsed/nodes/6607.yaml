    html: <p>The example that bugs me the most is <a href="http://www.myfonts.com/fonts/linotype/sabon/?PREFS_SET%5BRenderSize%5D=36&amp;PREFS_SET%5BRenderString%5D=The+quick+brown+fox">Sabon</a>, which as I understand was designed around the quirks of both Monotype and Linotype systems. All in all, Tschichold did an amazing job with the constraints he was working with, but there are definitely widths that seem off to me. I'm sure that I'm not the only one that finds the italic 'o' to be too wide, and others have observed the same of the roman 'a'.</p>
