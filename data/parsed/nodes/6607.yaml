    html: <p>originaly i wondered how useful such a scheme would be. it seemed to me that this kind of thing would compromise either the design of the bold weight or the spacing of the lighter weight. but maybe one could strike a happy balance? I'm trying to think what are some instances one would be so concerned about spacing as to make this kind of spacing scheme desireable? sure it might be nifty, but is it really necessary in any particular instances?</p>
