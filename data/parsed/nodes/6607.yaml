    html: <p>I agree with Hrant that this can be used within a certain degree. In my case with Delicato I only used regular, medium and bold. If you're using typefaces like this for huge masses of text, you can easily change weight, without having the textflow to change (or rather character of the print, regular could represent modern sharp print and bold could be equal to older techniques when lead was used).</p>
