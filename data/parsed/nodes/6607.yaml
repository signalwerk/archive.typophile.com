    html: <p>&gt; I'd wonder why do it at all. <br> <br>Well, for one thing, if you derive multiple weights from a single source weight, you can just leave the widths alone (as long as you derive accordingly). So in a way not changing the weights is easier! Coupled with the fact that uniwidth <i>can</i> be useful sometimes (like if you prefer to mark emphasis through weight change instead of italics*, and would like to maintain linebreaks**) it makes sense - as long as you realize that there's a threshold beyond which the compromise to the integrity of the design (in terms of its characteristic width/narrowness) is too much. That's why Trinite (and Patria) only apply it to the Regular and Medium/Demi weights. <br> <br>* Like in TYPO magazine. <br> <br>** Another place uniwidth is relevant is animation. <br> <br>BTW, Raph, there was once an interesting Typophile discussion about Sabon's constraints. <br> <br>hhp</p>
