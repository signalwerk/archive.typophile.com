    votes: null
    html: <p>It's very rarely "necessary." <br> <br>In a normal monospaced design, of course, one would expect the bold face to be the same width as the regular. <br> <br>I seem to recall old typesetting systems that duplexed the italic with the upright, so that the italic had to be the same widths. But my admittedly foggy recollection of this does not include matching bold to regular weight. <br> <br>It can doubtless be done well or badly, relatively speaking, but mostly I'd wonder why do it at all. <br> <br>Cheers, <br> <br>T</p>
    html_clean: <p>It's very rarely "necessary." <br> <br>In a normal monospaced design, of course, one would expect the bold face to be the same width as the regular. <br> <br>I seem to recall old typesetting systems that duplexed the italic with the upright, so that the italic had to be the same widths. But my admittedly foggy recollection of this does not include matching bold to regular weight. <br> <br>It can doubtless be done well or badly, relatively speaking, but mostly I'd wonder why do it at all. <br> <br>Cheers, <br> <br>T</p>
