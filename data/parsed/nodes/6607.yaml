    html: <p>so is this kind of thing fairly common then? is using this kind of uniwidth spacing scheme viable from a roman weight to a bold weight? or is the scope more limited? i'm sure it depends on the design... i would think this kind of uniwidth scheme would work better for a sans than for a serif, or does it matter? What elements of design would allow this kind of spacing to work? what design elements would keep it from working? is there any literature on such models that i should be reading? i'd like to know these things!</p>
