  html: <p>i can't remember where now, but i saw a font the other day that had the same width for several different weights of a font. i'm wondering when is this useful? is this adviseable under "normal" conditions?</p>
  html_clean: <p>i can't remember where now, but i saw a font the other day that had the same width for several different weights of a font. i'm wondering when is this useful? is this adviseable under "normal" conditions?</p>
comments:
  - id: 46327
    user: null
    date: null
    date_raw: null
    votes: null
    html: "<p>I call that \"uniwidth\". One of the MRF fonts (Delicato?) does this. Another example is the graded fonts at Font Bureau (although that's meant for compensating for gain, not for marking visible weight differences). And then there's the Hoefler display font series - Proteus Project. But probably the most prominent example is the Compatil system by Linotype - an amazing effort. BTW, my own Patria does it too, but only for the Regular and Demi weights, not the Light and Bold. <br> <br>I think it is -or at least can be- highly useful. The only problem is that beyond a certain weight range you have to start sacrificing the width/narrowness appearance of the whole to maintain the widths: the lights start looking wide and the darks narrow. <br> <br>hhp</p>"
    html_clean: "<p>I call that \"uniwidth\". One of the MRF fonts (Delicato?) does this. Another example is the graded fonts at Font Bureau (although that's meant for compensating for gain, not for marking visible weight differences). And then there's the Hoefler display font series - Proteus Project. But probably the most prominent example is the Compatil system by Linotype - an amazing effort. BTW, my own Patria does it too, but only for the Regular and Demi weights, not the Light and Bold. <br> <br>I think it is -or at least can be- highly useful. The only problem is that beyond a certain weight range you have to start sacrificing the width/narrowness appearance of the whole to maintain the widths: the lights start looking wide and the darks narrow. <br> <br>hhp</p>"
