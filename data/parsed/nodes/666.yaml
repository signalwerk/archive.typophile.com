    html: <p>Yeah, there could be a number of improvements to Justin's great script, including Unicode (or at least Upper-ASCII support), but also the ability to load the sample text and save out the results. Let's motivate him!  :-) <br> <br>&gt; useful for people want to compare the relative <br>&gt; space efficiency of different fonts <br> <br>That's a nice trick! You can also do this by having a straight string of the 26 letters where each is scaled horizontally by its [relative] frequency. <br> <br>hhp <br></p>
