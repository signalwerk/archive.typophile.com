  html: '<p>For those interested, my good friend Justin Bakse has just released a handy application named Ligature Counter. In short, you can paste text into the application and get results for both letter frequency and letter combo frequency. Very nice for analyzing text, thinking about frequent letterforms or working out some new ligatures. The application is free and web based. <br>Take it for a spin here: <br><a href="http://www.volcanokit.com/volcanokit2/ligCounter/" target="_blank">http://www.volcanokit.com/volcanokit2/ligCounter/</a> <br> <br> <br>Many thanks to Justin for making this for me (and then making it free for everyone) and Hrant for planting the initial idea in my head for such a thing. <br> <br>Best, <br>Eric O.</p>'
  html_clean: '<p>For those interested, my good friend Justin Bakse has just released a handy application named Ligature Counter. In short, you can paste text into the application and get results for both letter frequency and letter combo frequency. Very nice for analyzing text, thinking about frequent letterforms or working out some new ligatures. The application is free and web based. <br>Take it for a spin here: <br><a href="http://www.volcanokit.com/volcanokit2/ligCounter/" target="_blank" class="link-external">http://www.volcanokit.com/volcanokit2/ligCounter/</a> <br> <br> <br>Many thanks to Justin for making this for me (and then making it free for everyone) and Hrant for planting the initial idea in my head for such a thing. <br> <br>Best, <br>Eric O.</p>'
