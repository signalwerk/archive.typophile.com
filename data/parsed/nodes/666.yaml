    html: <p>This is a very handy little thing. Thank you. Is there any chance of modifying it to analyse Unicode text? I have extensive corpi of ancient Greek and Biblical Hebrew, and would love to develop some frequency data. <br> <br>Here's something derived from the current implementation that might be useful for people want to compare the relative space efficiency of different fonts. The string of letters below represents the frequency of each in English as sampled from a text of 34,643 words (most of the books of Genesis, Exodus and Numbers in the New International Version (UK spelling)). I also sampled from shorter versions of the text to confirm that the frequency was similar or identical in texts of any significant length (10,000+ words). The benefit of comparing fonts using this string, rather than simply comparing alphabet length, should be obvious. <br> <br>Below the string are the relative letter frequencies (actual number of occurences in the sampled text divided by 100 and rounded to the nearest whole number (except q, which is rounded up to 1 from .3)). Remove line breaks for best results after pasting into your app of choice. <br> <br>aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa <br>aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa <br>aaaaaaaaaaaaaaaaaaaaabbbbbbbbbbbbbbbbbbbbbcccccccc <br>ccccccccccccccccdddddddddddddddddddddddddddddddddd <br>ddddddddddddddddddddddddddddddddddeeeeeeeeeeeeeeee <br>eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee <br>eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee <br>eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee <br>eeeeeeeeeeeeeeeeeeeeffffffffffffffffffffffffffffff <br>fffffffgggggggggggggggggggggggggggghhhhhhhhhhhhhhh <br>hhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhh <br>hhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhiiiiiiiiiiiiii <br>iiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiii <br>iiiiiiiiiiiiiiiiiiiiiiijjkkkkkkkkkklllllllllllllll <br>lllllllllllllllllllllllllllllllllllllllllllllmmmmm <br>mmmmm