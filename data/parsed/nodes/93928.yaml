  html: |-
    <p>In medieval text there seems to be a frequent use of red and blue lettering. Does anyone recreating medieval texts (or imitating them in advertising, book cover design, etc.) have a standard Pantone color that best represents these? Absolute precision isn't necessary; I'm just trying to invoke the (admittedly large and diverse) era through the color of the text.</p>
    <p>(By the way, there is a <a class="freelinking external" href="http://www.amazon.com/PANTONE-SMART-19-3933X-Swatch-Medieval/dp/B004O7C1B6" rel="nofollow">Pantone "medieval blue"</a> but it is darker than the typical blue used in medieval texts, which is more like <a class="freelinking external" href="http://www.cmrs.ucla.edu/links/plate_links.html" rel="nofollow">this</a>.)</p>
