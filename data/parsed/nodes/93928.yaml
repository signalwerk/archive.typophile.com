    html: |-
      <p>Are you printing on non-white background to simulate age? The ink color will be affected if its printed on colored stock. Same thing if a background color is printed on white paper and then colored text overprints it (unless the background color is knocked out under the type). </p>
      <p>A good print shop should be willing to do an ink drawdown (test) for you by applying the PMS ink to a swatch of the actual stock. Based on the results they can tweak the ink color a bit, if necessary, before printing begins.</p>
