    html: |-
      <p>I recognize these designs by their original names. Slightly manipulating Times Roman, Optima, Icone, Franklin Gothic, Sabon, Tekton, does not make them new or original. Many of the designs are identical to the originals they're derived from. Your client base, and any designers who might want to join you, are going to be limited by that. </p>
      <p>There is a wide, wide difference between what is strictly legal, and what is ethical.</p>
