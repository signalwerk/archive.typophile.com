    <p><a href="http://www.dtptypes.co.uk" title="http://www.dtptypes.co.uk">http://www.dtptypes.co.uk</a></p>
    <p>New UK based Font-Commerce site.</p>
    <p>If there are any UK or European based font designers/developers who are interested in a new revenue stream - email <a href="mailto:mail@dtptypes.co.uk">mail@dtptypes.co.uk</a> for further information.</p>
    <p>This site is OpenType only.</p>
