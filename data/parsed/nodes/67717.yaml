    <p>hi there - </p>
    <p>i'm working on a project for my type class, and my professor mentioned that my typographic choices reflected the aesthetic of the victorian revival that took place in design from the 1950s to the 1970s. he suggested that i do some research on victorian revival typography, but my random googling hasn't really led me anywhere. does anyone have any suggestions about where to look or what typefaces might be relevant?</p>
    <p>thanks!</p>
