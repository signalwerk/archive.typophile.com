      <p>To see if there really was a "Victorian revival", look at magazines from the mid-century era, and from the previous half-century (to see if the style ever went away), and from the Victorian era (to see what the Victorian style is for yourself).</p>
      <p>My suspicion is that the so-called "Victorian" style was more prominent in mass media in the first half of the 20th century than modernism. I also find it hard to believe that an era which lasted 64 years only had one style.</p>
      <p>In most cities there is at least one shop with a fanatic who trades paper ephemera, i.e. comic books, postcards, magazines, prints, movie posters, etc. There are also multi-dealer events annually, and these dealers also exhibit at flea-markets in general. it's always best to study source material first hand, not just read about it in books or online.</p>
      <p>Interestingly, "Victorian" typefaces, especially the grotesque style (e.g. Helvetica) featured prominently in mid-century modernism: in this 1960 brochure for a Danish furniture company, the types are a Clarendon and Monotype Grotesque (1923). However, while these genres of type are 19th century, they are not exact revivals, but updates--note the single-storey "g" in both.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Illums_4305.jpg"></div><p></p>
