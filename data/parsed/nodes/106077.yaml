    html: |-
      <p>"I know I need to register for copyright, ISBN, and library of congress #."</p>
      <p>Three completely different things.</p>
      <p>1. You don't need to "register" for copyright. The book is copyrighted by law as soon as it is written.</p>
      <p>2. ISBN: Yes, you can apply for this through the Library of Congress. If the book will be sold in stores, you'll want a barcode to go with it.</p>
      <p>3. Library of Congress #. The LOC does not grant CIP data to self-published books.</p>
    html_clean: |-
