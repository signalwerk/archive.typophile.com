    html: |-
      <div class="comment-spam-body"><p>Yes, what Joshua said, but with a minor correction on ISBNs. The Library of Congress doesn't sell them; in the United States they are sold by Bowker (isbn.org). For self-publishing, it is also possible to buy them from a reseller; this can be much cheaper since the reseller can buy a large block of numbers at a low per-unit price and sell the numbers in it more cheaply than buying a single ISBN from Bowker. The disadvantage is that in that case your ISBN won't have a meaningful publisher prefix, and some distributors don't accept such ISBNs. So I'd say, if the author wants to do the sales and distribution, a reseller ISBN is fine; if stores or Amazon will be involved, get one directly from Bowker.</p>
      </div>
