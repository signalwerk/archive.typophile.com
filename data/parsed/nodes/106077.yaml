    html: |-
      <p>It has been several days, but I forgot to add that one reason my wife got into production -- and packaging -- is the pay is often better. Like so many designer, my wife found she (they, now) make as much or more off composition as design, and the number of people who can *package* a book -- take a manuscript that still needs editorial work and take it through print/bind -- is relatively small.</p>
      <p>This has led her studio to do a fair number of architectural books, often by smaller, historic cities in the North Carolina, usually published by the city or county. There is a lot of hand-holding, but it is paid for. </p>
      <p>I suppose just to balance that impression, I should mention they also do a number of art books for Yale University Press. It is easier to have a business if you have a mix of services.</p>
      <p>Something to consider. &amp; here's another one I know of</p>
      <p><a href="http://www.kachergisbookdesign.com/" title="http://www.kachergisbookdesign.com/">http://www.kachergisbookdesign.com/</a></p>
