  html: |-
    <p>I have a client seeking to publish an art book about an artists' life and to feature his paintings. He is asking me to do the design work, but I've never design a book to be published before. I know I need to register for copyright, ISBN, and library of congress #. Does anybody have experience in doing so and have suggestions on what publisher to look into. A Step by step guide is welcome.</p>
    <p>Thanks,<br>
    Thao</p>
