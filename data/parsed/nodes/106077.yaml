      <p><cite>I've designed several self-published books for clients and have never been asked to do those things.</cite></p>
      <p>I've had to. It depends how the author does the self-publishing. With places like CreateSpace you can get a package that includes the ISBN, and no further effort is required. But if the author wants a more independent process, then if there is to be an ISBN, either the author or the designer (assuming there is one) has to get it. And if the author has never published before, as is not uncommon, the designer is more likely to have some idea of the process.</p>
