    <p>Hi everyone!</p>
    <p>I'm designing an Apple skin for the M3 Nintendo DS-card, and I need to know what font Apple uses for buttons in Mac OSX. I don't know whether it's the same font as used in title-bars etc. in Mac OSX, but I just need the one from the buttons ;).</p>
    <p>In case someone's reading this thread and doesn't have a Mac, here's a screenshot: <a href="http://www.robinkanters.nl/macosx-buttons.png" title="http://www.robinkanters.nl/macosx-buttons.png">http://www.robinkanters.nl/macosx-buttons.png</a></p>
    <p>Thanks in advance!<br>
    Robin Kanters</p>
