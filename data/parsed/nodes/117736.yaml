      <p>This design has been independently digitized as Holly Script by the Font Company, 1992 <a href="http://www.identifont.com/find?font=Holly+Script&amp;q=Go" title="http://www.identifont.com/find?font=Holly+Script&amp;q=Go">http://www.identifont.com/find?font=Holly+Script&amp;q=Go</a> and URW <a href="http://www.myfonts.com/fonts/urw/holly-script/" title="http://www.myfonts.com/fonts/urw/holly-script/">http://www.myfonts.com/fonts/urw/holly-script/</a> and by Nick Curtis as Quigley Wiggly, a free font. Comparing the details of the P in your image with these fonts<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/CompareP_6092.jpg"></div> you can see that Quigley Wiggly was used to make it. Unfortunately, this was not one of Nick's best, and in this case you get what you pay for, Holly Script fits together better and is more carefully finished.<br>
      Don<p></p>
