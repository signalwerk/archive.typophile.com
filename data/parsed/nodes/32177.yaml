      <p>In my opinion the top version gives me the impression of children’s schoolbook material. I could see this on Scholastics mailers and the such. I’m not sure what Whitfield publishes mostly. </p>
      <p>The second has a more modern feel, but only slightly. I’d reduce the size of PUBLICATIONS slightly to have a reverse pyramid feel and should give better balance to the twin books. The spacing is fine. The books don’t look centered (visually you might have to move them to the right more.) Is that Bliss Pro? What’s the serif?</p>
