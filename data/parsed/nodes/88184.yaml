  html: |-
    <p>Is anyone out there keeping a list of soon-to-be-released-for-sale fonts that were originally made on commission for proprietary use?</p>
    <p>I know that clients often demand a black-out period of some years in their contracts with type designers in order to protect the exclusivity of the typefaces they pay to have created.</p>
    <p>Just wondering if anyone's keeping their eyes out for the release dates of any proprietary favorites....</p>
