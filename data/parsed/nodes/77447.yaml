  html: |-
    <p>I just wanted to ask, if the Bitstream license allows to use Charter Pro as webfont. But then I saw, that I meanwhile <a href="http://new.myfonts.com/fonts/bitstream/charter-bt-pro/roman/buy.html" rel="nofollow">can license it as webfont</a>. This is so great. It is better legible than Georgia in my opinion. The hinting is excellent. I am really happy now.</p>
    <p>But can someone tell me, if the regular version and the webfont version is the same? Or is only the license different?</p>
    <p>Any arguments against using it as webfont?</p>
    <p>And I would like to split it in a regular and a small cap version. But this does not seem to be allowed.</p>
    <p>Okay, I could also license the standard version, but the small cap font does not contain capitals. And the hinting of the standard version is different from the pro version. It is ridiculous. I am willing to spend money. I am willing to invest work in making the webfont usable with regard to Unicode. But I am not allowed to decompile/modify it. And in case of Charter it is especially ridiculous, because the old Type 1 version is for free.</p>
