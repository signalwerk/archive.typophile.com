      <p>Well, Charis OpenType, derived from the Type-1 Charter fonts, has an OpenSource license, is free, and can be modified. It is also very good, I've used it for bookwork after adding old-style figures, kerning, and a bit of other work. You might give it a try, as long as you can do some work yourself.</p>
      <p>I'll allow I don't know about the hinting.</p>
