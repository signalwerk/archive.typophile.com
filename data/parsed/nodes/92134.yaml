    html: |-
      <p>Retro isn’t crazy and non-conformist, it’s safe and unimaginative.<br>
      That applies to type design, poster design, and copywriting.<br>
      This kind of wordy inspirational poster is a fashionable trope.<br>
      I have nothing against careful and precise typography, and retro can occasionally push the envelope, but in this case the message and the medium contradict one another.</p>
