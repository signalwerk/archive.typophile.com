    html: |-
      <p>Forbes magazine has an interesting article by Rob Siltanen. He was the creative director at TBWA/Chiat/Day and was deeply involved in the "think different" ad, and he was says that much of the folklore about the ad is wrong.</p>
      <p>Steve Jobs didn't come up with the concept. and in fact he initially rejected it. He told the agency "“This is great … but I can’t do this. People already think I’m an egotist, and putting the Apple logo up there with all these geniuses will get me skewered by the press.” </p>
      <p>However Steve changed his mind about the ad and become involved in the fine-tuning of the concept.</p>
      <p><a href="http://www.forbes.com/sites/onmarketing/2011/12/14/the-real-story-behind-apples-think-different-campaign/" title="http://www.forbes.com/sites/onmarketing/2011/12/14/the-real-story-behind-apples-think-different-campaign/">http://www.forbes.com/sites/onmarketing/2011/12/14/the-real-story-behind...</a></p>
      <p>And Ken Segal has a short article about the voiceover in the commercial. The agency auditioned a number of actors and Richard Dryfuss was eventually chosen, but believe it or not Steve Jobs asked them to audition comedian Phyllis Diller. She seemed an unlikely choice, but Steve knew her because she'd done voiceover work for Pixar. </p>
      <p><a href="http://kensegall.com/blog/2012/04/steve-jobs-crazy-idea-for-the-crazy-ones/" title="http://kensegall.com/blog/2012/04/steve-jobs-crazy-idea-for-the-crazy-ones/">http://kensegall.com/blog/2012/04/steve-jobs-crazy-idea-for-the-crazy-ones/</a></p>
