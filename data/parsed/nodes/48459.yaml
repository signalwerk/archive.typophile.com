    <p>Hello all!</p>
    <p>I am new to the forums, although I have been reading posts for awhile now. I was helping a friend with a design project and some of their imagery reminded me of the font used on the Smashing Pumpkins album "Mellon Collie and the Infinite Sadness." I've seen this font listed as PS Bluegum Forest as well as Burton's Nightmare. I remember loving the font at the time, and then slowly getting sick of it as I saw it used and overused.</p>
    <p>However, looking at it again, I still feel like it is an interesting design and was curious to know more about it. Does anyone know about the origins/background of this font?</p>
    <p>Thanks!</p>
    <p>-M</p>
