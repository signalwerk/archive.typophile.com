      <p>It seems the 'source' of inspiration for both 'fonts' would have been '<a href="http://www.p22.com/products/victorian.html" target="_blank" rel="nofollow">P22 Victorian Swash</a>'.</p>
      <p><em>P22 type foundry presents a font set created in conjunction with the Albright-Knox Art Gallery's exhibition of Victorian-era French artist James Tissot. The fonts developed for the P22 Victorian set are based on historic typefaces dating from the late 19th century. Victorian Gothic was based on a type style called 'Atlanta', a simple, expanded width, quirky, yet elegant face similar to 'Copperplate'. Victorian Swash was inspired by the willowy, delicate face 'Columbian', which has also been known in recent years as 'Glorietta'. The P22 version includes 'snap-on' flourishes based on the original 'Columbian' ornamental embellishment designs. Victorian Ornaments, features over 150 decorative embellishments.</em></p>
      <p>Dav</p>
