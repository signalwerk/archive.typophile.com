      <p>Formal education isn't useless, but it is a two-edged sword. I think people can pick up some basics from the "swirling background" and make highly fruitful initial explorations, and <em>then</em> get some formal education to tie things down. People who start off formally either take decades to become liberated, or never know what they're missing and simply fortify the establishment.</p>
      <p>hhp</p>
