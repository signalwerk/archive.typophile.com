      <p>"Formal education isn’t useless, but it is a two-edged sword."</p>
      <p>I agree Hrant. I am self taught, for better or worse. I learned from traditionalists like Zapf, Poppl and Schneider by looking at their work. I took off from there. I exploited their anomalies as well as their stalwart forms. One has to march to their own drummer and I think that is what sets people apart. Discovery is inherent in a mischievous mind : )</p>
      <p>Michael</p>
