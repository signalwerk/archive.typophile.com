      <p>Sorry if I was a bit snappy; I look at stuff all the time too. I just like to see people try first and look later: it makes for much more creative output. And this peeve extends to formal education: when you teach somebody something, you're perpetuating the past and curtailing discovery.</p>
      <p>hhp</p>
