      <p>Christmas is an awfulness that compares favorably with the great London plague and fire of 1665–66. No one escapes the feelings of mortal dejection, inadequacy, frustration, loneliness, guilt and pity. No one escapes feeling used by society, by religion, by friends and relatives, by the utterly artificial responsibilities of extending false greetings, sending banal cards, reciprocating unsolicited gifts, going to dull parties, putting up with acquaintances and family one avoids all the rest of the year ... in short, of being brutalized by a “holiday” that has lost virtually all of its original meanings and has become a merchandising ploy for color tv set manufacturers and ravagers of the woodlands.<br>
      	 —Harlan Ellison, <em>Los Angeles Free Press,</em> 12/28/72</p>
