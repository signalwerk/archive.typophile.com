      <p>you've hit them both on the head!</p>
      <p>i took some detailed pictures of the hayward poster on my phone, and have just compared them to akkurat bold - there is a slight difference in the weight (which i think has been achieved by adding an outline to the text) but they are definitely the same typeface.</p>
      <p>thank you so much for your help!</p>
      <p>hank</p>
