  html: |-
    <p>i came across a poster on the tube (london underground) about a year ago for an exhibition at the hayward gallery and was struck by the typeface used.</p>
    <p><a href="http://storage.canalblog.com/26/82/119589/41008435.jpg" title="http://storage.canalblog.com/26/82/119589/41008435.jpg">http://storage.canalblog.com/26/82/119589/41008435.jpg</a></p>
    <p>earlier today i found a similar typeface used within a young designers portfolio and it re-awakened my curiosity.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/revolver_type_5419.jpg"></div><p></p>
    <p>on review, they are two different typefaces - though it is not easy to see on the example i have found online, the hayward gallery face has and angled terminal on the top of the lowercase t, where as the revolver face has a horizontal terminal. </p>
    <p>help identifying either one would be very appreciated.</p>
