    <p>Dear Typophile members,</p>
    <p>Can anybody help with the following query please?</p>
    <p>Have there been any studies concerning typography in the environment?  Particularly environments for local communities, such as parks,  regeneration areas, street signs etc.</p>
    <p>Your help would be gratefully appreciated.</p>
    <p>Kind Regards,</p>
    <p>Chris</p>
