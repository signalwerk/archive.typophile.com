      <p>There were interesting presentations about that topic at the ATypI in Brighton a few weeks ago. See: <a href="http://atypi.org/05_Brighton/20_main_program" title="http://atypi.org/05_Brighton/20_main_program">http://atypi.org/05_Brighton/20_main_program</a></p>
      <p>I can’t remember who said it, but I’ve found it very convincing: most interesting in respect to bringing liveliness into your design are, first of all, the real people living there, followed by historical and cultural background information and of course there are some licensing requirements to be taken into account.</p>
      <p>For Peter Saville take some time to watch the little film about the interview talked about here: <a href="http://www.typophile.com/node/37612" title="http://www.typophile.com/node/37612">http://www.typophile.com/node/37612</a> </p>
      <p>And there are some pdfs picturing “traffic signs to tourist attractions in England” e.g. here: <a href="http://www.standardsforhighways.co.uk/dmrb/vol8/section2.htm" title="http://www.standardsforhighways.co.uk/dmrb/vol8/section2.htm">http://www.standardsforhighways.co.uk/dmrb/vol8/section2.htm</a></p>
