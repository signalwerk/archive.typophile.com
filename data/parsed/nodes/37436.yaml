      <p>I’m still struggling to find information/debate regarding designing for regional identity. For example Peter Saville’s recent Manchester work. I would also like to be able to look at comparative developments in Leeds, Norfolk, South Yorkshire, Brittany, The Basque, North Rhein Westfalia  etc.</p>
      <p>I’m probably using the wrong search terms. Any help would be gratefully appreciated. </p>
      <p>If there have been no such comparative studies I may undertake an investigation myself. Please let me know you thoughts on this idea.</p>
