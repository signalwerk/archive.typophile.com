      <p>I also noticed that Linotype are very activily using google ads. Just type fonts in google and they are always there, and several font sites that feature adwords also have linotype ads, and apprently not only the legal nice ones...</p>
      <p>I noticed that you could even try typing Linotype or another foundry in the search box and get a list of fonts, as the search also recognises copyright strings in the fonts.</p>
      <p>I'm glad they are responsive to your requests Nick, but it should really be the other way around. What bother me is the feeling of legitimacy that is created. This might trick unknowing designers into using them. But I guess that any (free)font site that has no info about itself, it's organisation structure etc. should be suspect. But I guess this kind of thing is very hard to crack down in the world of internet.</p>
