    <p>Whilst googling I stubled upon two sites, eaglefonts and fontslog that offer truetype and opentype fonts respectively. And I noticed they offer a lot of original, certainly not free, typefaces. It seems to be a decent website, not spammed over. But no information about copyrights or anything. They only offer this BS line, with obviously no substance whatsoever: </p>
    <p>"All fonts on the FontsLog site remain copyright of their respective owners. All fonts can be found elsewhere on the Internet, either as individual fonts or as complete font sets and are believed to be in the public domain. If you find any font on FontsLog for which you are the copyright holder, under the conditions of the Digital Millennium Copyright Act you may submit a Take-down Request by clicking the red flag  beside the font name on the font's detailed view page. We will endeavour to investigate your request and take the appropriate action ASAP."</p>
    <p>They obviously stretch the definition of public domain until it includes just about anything. You are all warned. As for copyright owners and foundries: shouldn't action be taken to close this down?</p>
    <p>PS Sorry moderators I don't intend to post links for people to download obviously but I do feel the need to inform about these sites. Please correct me if I'm wrong</p>
