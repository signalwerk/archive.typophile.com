      <p>I've contacted this outfit a couple of times and he has politely and promptly removed my fonts, and left a link to my site.</p>
      <p>For instance:<br>
      <a href="http://www.fontslog.com/handsomepro-classic-otf-5613.htm" title="http://www.fontslog.com/handsomepro-classic-otf-5613.htm">http://www.fontslog.com/handsomepro-classic-otf-5613.htm</a></p>
      <p>Nonetheless, I do think the statement that "All fonts found at FontsLog.com were collected from other public domains and were believed to be free for download..." is disingenuous.</p>
      <p>Putting the onus on the publisher to correct copyright infractions is a lazy way to do business for what is clearly a commercial font, as Shinntype has been publishing commercial-only fonts for 10 years, and there is an "all rights reserved" copyright notice in the font info.</p>
      <p>What this business should do to be entirely reputable is open up every font it re-distributes, in FontLab or whatever, and inspect the copyright info.</p>
