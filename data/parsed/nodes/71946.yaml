      <p>Both sites are the same entity operating under different names. The sites have the same basic look and feel, both obviously created by the same entity.</p>
      <p>If you click on the Opentype link on eaglefonts it will take you to fontslog. If you are on fontslog and click on the Truetype link it will take you to eaglefonts.</p>
      <p>They are both hosted at ThePlanet in Houston, TX but are hiding behind a Private Registration organization in the Netherlands.</p>
