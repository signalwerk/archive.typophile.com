    html: <p>It sucks that so many font sites throw away the licence agreements. Pursuing these assclowns causes more harm than good. If I'm spending time getting hundreds of free font sites to include my EULA, I'm not making new fonts. Screw it. The only time I bother is if a site is offering a significant number of my commercial fonts for free and telling visitors that they're freeware. Usually they take them down if I ask politely. If they don't leave contact info, I just shut their sites down.</p>
