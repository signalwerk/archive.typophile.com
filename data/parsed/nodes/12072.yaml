    <p>I'm working on my first typeface. It's inspired by the city of Copenhagen and it should be used for titles or posters. Any critique welcome. </p>
    <p>Lowercase ‘m’ is emphasized, because it doesn’t look very well for me (any suggestions?) — fixed already.</p>
    <p>Thanks,</p>
    <p>David</p>
    <p>— updates</p>
    <p>More examples attached on typophile.com</p>
    <p>You can find even more examples at <a href="http://codan.davi.cz">http://codan.davi.cz</a></p>
