      <p>I like your efforts very much, in my opinion this design has clearly some potential.</p>
      <p>If I'm being nitpicky, I find some minor issues in following<br>
      characters (I'm by no means any expert, so don't take me too seriously. And these are just opinions)</p>
      <p>M looks too wide, the upper white space is too big<br>
      G lacks something, it looks too much like C<br>
      k looks just a little bit too weak/tiny<br>
      w has some weird qualities<br>
      s is tilting backward (very little)<br>
      a is tilting forward (very little)</p>
      <p>I like the overall feel still very much, I would certainly like to see this developing to a full family of different weigths.</p>
      <p>(I would also like to hear from other people if you agree/disagree with my opinions, I'm still very new at this:) )</p>
