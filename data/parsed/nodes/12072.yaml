      <p>Hello David</p>
      <p>I think it looks extremely nice. And you got the 'ø' perfectly right in the true spirit of danish designers such as Thorvald Bindesbøll, Knud V. Engelhardt &amp; Gunnar Biilmann Petersen. (You need an Æ though)<br>
      A suggestion would be for you to draw some nice uncommon ligatures such as 'AV', 'MV', 'ME', 'ND' and so on. That would really hit the spot when designing titles or posters. And it would fit the tradition well.</p>
      <p>Concerning the 'm', have you considered bringing in the right leg a little bit. Not much... just a little so that optically the whitespace within the 'm' looks even? This is a thing a danish typeface designer (<a href="http://www.sogren.dk/">Poul Søgren</a>)once told me look out for when drawing the lowercase 'm'. :)<br>
      Other than that, I think the 'm' looks fine.</p>
      <p>By the way did you know that <a href="http://www.codan.dk">Codan</a> is a danish ensurance company. (You probably did) </p>
      <p>Good luck </p>
      <p>Magnus</p>
