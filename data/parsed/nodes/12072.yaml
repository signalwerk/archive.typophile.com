      <p>I'd say the similarity between codan and metron is smaller than the similarity between gotham and metron. Metron has a large x-height, relatively round shapes. Codan has a small x height, a much more robust appearance, a more mono-line look and much more square shapes. There are two very different metrons out there btw, but I assume we're talking about the 'Storm Type library' one.</p>
      <p>I just saw this is a thread from 2005, so this will probably never become a full-grown typeface anyway.</p>
