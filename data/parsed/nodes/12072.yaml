    html: |-
      <p>Hi, David </p>
      <p>I think it looks nice. You can always work on the kerning when you have all the characters ready.</p>
      <p>Recently I have been looking through some danish typedesign. (Yes, it actually seems that there is a distinct danish way of drawing letterforms.) And I still think you have a lot of Knud V Engelhardt's and Gunnar Biilmann Petersen's trademarks in your typeface. The way the A is drawn with the big flat top and the way the Ø is drawn as well. And that goes for most of your letters but the C and G doesn't seem to follow the tradition. The terminals should end vertically and not horizontally like now. And the G would not have the horizontal crossbar as it does now but only the vertical. I hope this weird babling makes any sense to you. Of course my words are just guidelines to the way of drawing like the classic danish typedesigners and you should not necessary listen to me but just go ahead and do it your own way.</p>
      <p>I think the lowercase s is too thin on the middle where it should probably be the thickest. But it is tilting nicely now as is the lc a.</p>
      <p>The first one of your two lowercase y's is the best in my opinion. :)</p>
      <p>I think it is looking nice. </p>
      <p>--</p>
      <p>Here's a link to a pdf about ligatures (it's in Danish). And I think you can find--on the first page--an example of the kind of G I was trying to sketch out for you. (In the lower right corner are some logotypes by knud v engelhardt and gunnar biilmann pertersen)</p>
      <p><a href="http://www.grafisk-litteratur.dk/">www.grafisk-litteratur.dk/</a> download/btm/10%20Ligatur/btm10b.pdf</p>
      <p>Regards</p>
      <p>Magnus</p>
    html_clean: |-
