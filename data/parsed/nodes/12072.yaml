      <p>Thank you very much for the sources, Magnus. I'm quite busy last days, because I'm finishing my thesis and school as well. So, I have some latency...<br>
      The kerning is really awful. I know. :( Actually, it seems, that uppercase looks much better than lowercase (not only kerning). I don't know why exactly.<br>
      C + G (weird babling :) I see. I was thinking very much about it, but it works much better now. A, R, V, etc. have sloped endings, but C, S, G would have horizontal endings. It is kind of inconsisteny for me. It was done in a "danish" way in a first version of Codan (I call it <em>Codan 1</em>). You can see it at exhibition posters (it was for school exhibition of course) at <a href="http://codan.davi.cz">http://codan.davi.cz</a>. (I'll place them now).</p>
