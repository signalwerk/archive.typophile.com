  html: |-
    <p>I lost the latest revisions of a font I was working on due to a faulty flash drive. Luckily, I had generated an .otf file of the most recent version. Do I lose anything when I open up the .otf file in Fontlab and save it as a .vfb?</p>
    <p>thanks!</p>
    <p>Jonathan</p>
