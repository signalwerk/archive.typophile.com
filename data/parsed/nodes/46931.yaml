      <p>The signature script is nice. However, the R seems a little out of place. Alone, the R doesn't resemble an R, you might want to play with the curve from the top of the R to the bottom of the leg as it extends under the u. </p>
      <p>For the tag... I'm assuming you're using Copperplate Gothic, which is a nice choice. I'd move the tag below the signature, centered and shrink the size to almost half the width of the signature. The space between the signature and the tag should be equal to about 1.5 the tag's size. (So, if the tag was 12 points, the space between the tag and the signature would be 18 points.) Centering it, will also give the signature a nice balancing point. </p>
      <p>The color seems very light. If you were to convert that to grey scale, it would probably be equal to 10-15% black, that's too light. Consider bumping up the saturation.</p>
      <p>It has a nice look to it, it's really at the tweak stage. I'd be interested to see your other iterations before they picked this one.</p>
