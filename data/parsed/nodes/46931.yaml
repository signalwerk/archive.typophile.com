    <p>I've gone through dozens of concepts and after presentation this is the one that came out on top for the client -- almost unanimously.</p>
    <p>The client is a high end caterer that mostly caters high-end weddings held in private and public mansions. They wanted to upgrade their identity to reflect the perfect, polished, and remarkable events they cater. They have a lot of name recognition in their geographic area and are also very proud of the personal attention that each event gets from their staff.</p>
    <p>I'm happy with the main "Russell Morin" type -- I slightly modified a very beautiful typeface and added some elements of the owners signature into it. Though, if you have comments on that, I'd love to hear them (I'm certainly not a type expert). I'm having the most trouble with the treatment/typeface/size of the "fine catering" tagline. I just can't get it to seem to work in a sophisticated enough fashion. Please help me out!</p>
    <p>Thanks a million!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/RM_logo_6140.jpg"></div><p></p>
  html_clean: |-
