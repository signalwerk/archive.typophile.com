    html: |-
      <p>While the R might be a bit too strong I believe the effort holds together reasonably well. We tend to overwork - logos especially - when it really is not overtly called for. Call it graphic narcissism. That said, a few tweaks and IMHO I think you are there. (I am basing my comments on the original).</p>
      <p>Consider tinting the signature just a bit - it comes off too aggressively. I am not in favor of darkening the FINE DINING much. It is more elegant with no more than perhaps a 10 -15% increase. In addition, you might either drop it a bit to let the eye air it out or, as another designer suggested run a rule and drop it centered. As for the rule it should be a hairline or just a bit heavier adding to the classy effect you seek.</p>
      <p>Rich Shadrin</p>
