      And … a very wide face looks strange, if it's spaced out that much.</p>
      <p>I would give Versa Condensed SC a second try, hehe. Why – it looks elegant/distinctive, and you can space out this way condensed styles much better, and a "line-feeling" you can add with the use of SC. </p>
      <p>Yes i agree, the tagline should smaller in size. For a useful logo system, you should design different versions of the logo for different sizes, etc. If the client pays for it …<br>
      Just my 2 cents.</p>
