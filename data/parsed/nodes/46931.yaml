      <p>I like the R a great deal; it's masculine. I agree that the tag could be darker, but I actually like it aligned right. It balances the curve of the script lettering, and if it's centered, the script may look lopsided. </p>
      <p>Overall, it's very nice work. I worked many years in five diamond catering, and it's refreshing to see a brand without an ornate crest or bow tie. I think the extra touch of sophistication you're looking for may be found in the media - 100% cotton paper and embossed letterpress printing.</p>
      <p>Eileen</p>
