      <p>My two cents' worth. Have only scanned the comments, so forgive me if I've repeated anything.</p>
      <p>The 'R' and the 'M' look like they come from different 'hands'. The dot on the 'i' is too long for my liking –&nbsp;looks messy. The join between the second 's' and the 'e' needs to be smoothened out (feels mechanical). Russell and Morin seem to have a different rhythm going on (the Russell seems less consistent, the Morin has a steady rythem). I know this is a hybrid between Cezanne and a real signature, but it needs a little more refinement to feel like it came from 'one' hand. On the other hand, I liked the first design and its colours. The rectangle to me says 'table' or 'fine linen'. And, though I like Topaz, in this case I prefer the Copperplate –&nbsp;has a little more character and because it is a wide font, acts as a nice support/line (so no line). But, I'd modify the 'G' and agree with Asvetic's suggestion re: space between name and the tag.</p>
