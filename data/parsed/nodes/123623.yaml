    <p>Hi there!</p>
    <p>I usually export 2 formats: OTF without hinting, and TTF for web (with TTFAutohint).<br>
    A client asked me if I could send the OTF , with the TTF hinting for web.</p>
    <p>Is that possible? </p>
    <p>When I open the TTF file created with TTFAutohint in FontLab I don't see any hinting insructions... so I can't copy them to the OTF file... but it still works perfect for the web... </p>
    <p>Thank you guys.</p>
