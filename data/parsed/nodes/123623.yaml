    html: |-
      <p>No, for several reasons.</p>
      <p>First, I don't think "most" printers use PostScript natively. There is a thick layer of driver software between the font file and the printer.</p>
      <p>Second: font formats may be changed by the OS, by user-end software, or by printer drivers to suit the destination device.</p>
      <p>Third: native support for TrueType fonts has actually been added to PostScript, years ago :P</p>
      <p>For everyday practical purposes there really is no difference between TrueType and PostScript flavour fonts -- especially when both are wrapped inside an OTF. A designer may have a preference (me, I can't wrap my head around quadratic curves) and some older tools such as MS Volt work on a TTF format only -- but even that can be worked around.</p>
