      <p>Adobe added native support for TrueType fonts to PostScript Level 2 back in the early 90s, more than 20 years ago. Even ten-year-old sources are wrong to warn against TrueType, for the most part.</p>
      <p>It is Adobe's official position (which I used to spout on behalf of Adobe) that they support TrueType fonts and TrueType flavored OpenType equally with their PostScript-outline counterparts. That position is well founded in reality.</p>
      <p>There is a bias in the graphic arts against TrueType, but 99% of the time it has very little to do with reality.</p>
      <p>There are a very few devices and workflows, usually very old, where TrueType fonts are not supported. There are actually many more situations where PostScript or .otf fonts don’t work.</p>
