      <p><cite>How does TTF work in Office?</cite></p>
      <p>Usually better! It’s the PS-OTs which regularly cause trouble outside of the DTP apps, e.g. font embedding in office apps, not printing or wrong glyph scaling in recent versions of Mac OS X.<br>
      TTF is still the standard format for companies such as Apple and Microsoft and it’s much better tested in software of these companies than PS-OTs.</p>
