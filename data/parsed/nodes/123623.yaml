    html: |-
      <blockquote><p>... OTF (also known as CFF for Compact Font Format) uses PostScript cubic Bézier curves.</p></blockquote>
      <p>Ouch. The OpenType format is actually a <em>unification</em> of Microsoft/Apple's TrueType, and Adobe's Type 1 (CFF) format. The file header indicates what sort of outlines the font contains - it can be either one.</p>
      <p>With that in mind, "OTF without hinting, and TTF for web" makes no sense without specifying what kind of OTF it is.</p>
