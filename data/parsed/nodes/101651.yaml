      <p>Oh, you mean like Unger's Capitolum and LettError's Twin? :-)  Note BTW that Capitolum now has a great life. Any "losing" font from this competition could too.</p>
      <p>You explain yourself well, but I just don't buy that official party line (and I don't think you should equate "the profession" with all its members). I maintain that only the big boys (and those dreaming of being among them one day) really suffer from the existence of spec work. And the big boys determine what position AIGA etc. take.</p>
