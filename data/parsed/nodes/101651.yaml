      <p>Some are missing the bigger picture here:</p>
      <p>We've merely accepted and adopted the doctrine that anything that adds to the Gross Domestic Product of the marketplace is a good thing. But since automation has replaced human labor in the agriculture, mining, and manufacturing sectors, human labor has shifted toward services. Services now accounts for 72% of the global output. But exactly how effective is the output? Harvard Business Review published a paper, as an example, that showed US markets spending US$ 50 billion in "change management consulting" services... and that a full 70% of those services failed in their original objectives.</p>
      <p>The reason services often fail in their objectives is that we live (and produce/consume) believing that "quantity" is the key of success. Quantity of apples. Quantity of cars.</p>
      <p>But, in services... "quality", not quantity is the key to success. Problem is, we don't know how to do "quality"... we are still stuck in Marx's theory of "labor value"... </p>
      <p>And BTW, very little of today's US intellectual property originates from "funded R&amp;D"... Stanford University, as an example receives no federal funding of consequence. The bulk of its funding comes from commercialized intellectual property (such as 2% of all IBM Global Services revenues). I wrote the business plan and contract.</p>
      <p>And, if I remember correctly, the Dutch retailer Designstoel24 a few months ago, ran a facebook campaign to redesign their logo:<br>
      <a href="http://www.facebook.com/Designerchairs24" title="http://www.facebook.com/Designerchairs24">http://www.facebook.com/Designerchairs24</a></p>
      <p>And here is an example of crowd-sourced creativity:<br>
      <a href="http://99designs.com/" title="http://99designs.com/">http://99designs.com/</a></p>
      <p>So, how to compete with the future? Or, do you hold on tight to orthodoxy for as long as you can?</p>
