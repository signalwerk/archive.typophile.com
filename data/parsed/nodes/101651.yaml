      <p>&gt; the shortcut to success threatens the pool of<br>
      &gt; desperate but talented beginners </p>
      <p>An unemployed beginner wouldn't turn down a job at a design firm so he could continue entering spec contests. You can't make a living working spec; most of time you'll lose and get nothing, and contests with big payoffs are rare.</p>
      <p>Professionals oppose spec work for a number of reasons, but I think the fundamental one is that if it isn't opposed it may someday become a common practice even with everyday jobs. Doing an occasional spec job in your spare time is one thing, but trying to work that way for a living isn't practical since you won't get paid for most of the hours you work.</p>
