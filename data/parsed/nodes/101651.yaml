    html: |-
      <p><em>It's pathetic to see a capital city beg for entry fees.</em></p>
      <p>Note that this competition is not being organised or even endorsed by any government entity: it is an initiative of the University of Canberra. This means, of course, that not only is it spec work that you have to pay to have considered by the judges, there is no guarantee that the winning selection will ever be used in any official capacity as the typeface of the city, although the university will assume 'an exclusive, royalty-free and irrevocable license in perpetuity' for the so-called winner.</p>
      <p>Hrant, the design <em>profession</em> opposes spec work because it undermines the profession as a whole when people work for nothing. It creates an environment in which customers and clients expect and then demand free work. It encourages the structuring of what should be fairly paid creative labour as 'competitions', which are simply a way for corporations and other institutions to avoid paying proper fees to designers (and in some cases actually collect fees from them!)</p>
      <p>Your attempts to draw parallels with sporting competitions do not work, because generally speaking athletes are not being asked to invest in training, practice, equipment, etc. in order to participate in competitions: they are doing these things for the sake of participation in their chosen sports and the competitions exist to provide a showcase. If the athletes are professionals, they are paid for their participation, not for winning (although in some sports there are bonuses for winners); if they are amateurs then they are not paid whether they win or not.</p>
      <p>A better parallel would be this: ten people pay a fee to be allowed to work in a restaurant kitchen, they all work a nine hour shift, and then the chef decides which one of them will be paid. That should sound ridiculous, but something like it probably happens -- perhaps advertised as a 'competitive internship' --, because businesses are constantly trying to organise the labour market in a way that suits them rather than suits workers. To which I say ORGANISE! ...and if that means that professional design associations, like other forms of guild or union, prevent their members from engaging in spec work, that's a fair restriction to make for the good of the profession.</p>
    html_clean: |-
