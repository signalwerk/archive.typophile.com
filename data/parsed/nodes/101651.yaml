      <p>Kudos to them for being responsive and reasonable. If they indeed got enough such complaints, I wonder if that means many people who are supposedly against "spec work" will now secretly enter...  :-)</p>
      <p>Now if they can only be convinced to give back the entry fees in some generous way (see below); it's probably too late, but it would have been better to lower the award amount and do that.</p>
      <p>--</p>
      <p>I remain unconvinced that "spec work" reduces overall earnings, especially in type design. Here's why:<br>
      - A typeface, being a tool and not an end-product, is eminently re-purposable.<br>
      - In this case the winner gets ~$10K for three years of exclusivity, which isn't bad for many people. Not every type designer lives in the West...<br>
      - Many organizations can't justify the sorts of budgets* that large studios demand (because they have a lot of expenses, like a clothing store in Beverly Hills versus one that sells the same stuff in Downey) but they can afford ~$10K. Imagine every city about the size of Canberra or larger paying for a typeface (that can be resold after a few years) - that's a lot of money coming into the field (it just doesn't end up in the pockets of the big studios). Remember, most people still think all fonts are supposed to be free...</p>
      <p>* I remember how people were outraged that British Airways paid $100K for their custom typeface.</p>
      <p>This anti-spec talk reminds me of the classical delusion that font piracy has a large impact on income. There is no evidence, only protectionist paranoia, promulgated by the big players.</p>
      <p>Also, I've been thinking about the entry fee, and there's actually a good reason not to make entry free: they would be swamped. HOWEVER there was a better way to handle it, so they don't look like cheapskates: pass along all the entry fees to the winner (or distribute it among honorable mentions) or donate it to SoTA, ATypI or a local typographic non-profit.</p>
      <p>hhp</p>
