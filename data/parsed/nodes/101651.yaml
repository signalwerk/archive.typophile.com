      <p>I think an organization can indeed get good results from spec work (hey, good results aren't even guaranteed when you hire a big studio, plus you've spent a ton more money) as long as they have qualified people choosing the winner. This is admittedly usually lacking.</p>
      <p>Let me ask -again- what do people think of the Oak Knoll logo? They paid $500 <em>store credit</em> for it. It's peanuts, but it's better than not being able to afford Landor.</p>
      <p>Also, again, when it comes to type design attempting a spec bid isn't very wasteful at all; unless it's a very unusual project the results are usually entirely re-usable. Plus remember, in this case it's only for three years.</p>
      <p>hhp</p>
