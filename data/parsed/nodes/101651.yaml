      <p>FYI, as part of the technical research I am doing for a new book on economics, I'm tracking "spec work" as it applies to several fields... in 2012, alone, an average of 4,695 graphic-design (which includes logo design) spec RFPs were issued per week throughout 7 countries of western Europe... and this is an increase of 425% from 2011. Median average compensation per transaction: 950 Euros. Dozens of web sites are emerging to exploit this growing trend...</p>
      <p>If a car manufacturer solicits ideas for new energy saving technology, do they pay all the various companies, universities, or individuals who attempt to develop new technology, but were not ultimately chosen by the car manufacturer?</p>
      <p>Why should anyone get paid for anything that ultimately is not used... whether the anything is technology, or logos or fonts? </p>
      <p>Even the advertising industry is evolving toward results-based compensation.</p>
