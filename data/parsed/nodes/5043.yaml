    html: '<p>Greetings everyone! <br><br>Well, this is my ﬁrst post here… Always liked typography, but just started learning to build fonts this last month… I’m primarily self trained so I’m deﬁnitely a rookie here and hope to learn alot. I usually work in <span class="caps">CG</span>/Pixel illustration. Anyways, enough with the introduction. Here’s my ﬁrst work for critique, and my second font ever:  <br><br><img src="http://www.typophile.com/forums/messages/29/37341.gif" alt="Pixie Talon Sample"><br><br>I hope you’re not all tired of extremely small pixel fonts <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> Critique away,&nbsp;please… </p>'
