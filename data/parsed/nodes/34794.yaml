    html: |-
      <p>With fontforge, I get an alternate glyph that references to unicode 27A2. I don't know if that can help.</p>
      <p>[added]</p>
      <p>According to the <a href="http://www.ctan.org/tex-archive/fonts/minionpro/README" rel="nofollow">README</a> file of the <a href="http://tug.ctan.org/cgi-bin/ctanPackageInformation.py?id=minionpro" rel="nofollow">MinionPro package for LaTeX</a>, there are three versions of MinionPro: version 001.000 coming with 'Adobe Type Classics for Learning', version 001.001 included in the 'Adobe Font Folio Opentype Edition CD' and version 002.000 included in Acrobat Reader installations and currently for sale. Those versions are different enough to require three different encoding files for the LaTeX installation. The version I looked at is 002.000.</p>
