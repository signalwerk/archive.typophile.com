      <p>According to the German Wikipedia article the czech / slavic name Růžička is pronounced something like roo-zitsh-ka.</p>
      <p>http://de.wikipedia.org/wiki/Růžička</p>
      <p>I don’t know if this is accurate (and in case it is, if this was also the way R. R. pronounced it or if he changed it to make it more memorizable / more obvious to pronounce in an English speaking environment).</p>
