    html: <p>I once referred to Ruzicka in a presentation using a slightly slavic pronunciation (the best I could manage without being too obvious about it). Afterward, Matthew Carter pulled me aside and quietly informed me that everyone at Linotype just called him Roo-zee-ka.</p>
