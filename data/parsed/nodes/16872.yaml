    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : William Caslon IV</strong></p>
    <p>William Caslon IV is best known as the designer of the first sans serif typeface, though sans serif lettering had existed for some time. He was the great grandson of the original <a href="/wiki/William%20Caslon" class="freelinking" rel="nofollow">William Caslon</a>, son of <a href="/wiki/William%20Caslon%20III" class="freelinking" rel="nofollow">William Caslon III</a> who had purchased the <a href="/wiki/Joseph%20Jackson" class="freelinking" rel="nofollow">Joseph Jackson</a> foundry in 1792 creating a second Caslon foundry. William IV took over the business in 1807 and was evidently very creative. He invented two part matrices for casting large letters and a method of casting wedge shaped letters for cylinder printing.</p>
    <p>In 1816 William IV issued a specimen book that showed a single line of upper case sans serif letters labeled "2 Line English Egyptian" or about 28 points in size. Though Egyptian has come to refer to slab serif types only, it originally referred to all monotone or monoline stroke types. It is not known why he cut the sans, whether it was cut for a client or as an experiment, but there was no interest in it and several years would pass before more sans serif types appeared.</p>
    <p>In 1819 William IV sold the foundry to Blake, Garnett &amp; Co., which was formed specifically to purchase the company. They moved the company from London to Sheffield, England where it flourished and eventually became the Stephenson Blake foundry. William IV concentrated on developing a coal-gas system for lighting.</p>
