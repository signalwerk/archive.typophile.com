    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/17745" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Designers</a>&nbsp;: William Caslon <span class="caps">IV</span></strong></p>
    <p>William Caslon <span class="caps">IV</span> is best known as the designer of the first sans serif typeface, though sans serif lettering had existed for some time. He was the great grandson of the original <a href="/node/add/wiki?edit%5Btitle%5D=William%20Caslon" title="Create node &quot;William Caslon&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">William Caslon</a>, son of <a href="/node/add/wiki?edit%5Btitle%5D=William%20Caslon%20III" title="Create node &quot;William Caslon III&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">William Caslon <span class="caps">III</span></a> who had purchased the <a href="/node/add/wiki?edit%5Btitle%5D=Joseph%20Jackson" title="Create node &quot;Joseph Jackson&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Joseph Jackson</a> foundry in 1792 creating a second Caslon foundry. William <span class="caps">IV</span> took over the business in 1807 and was evidently very creative. He invented two part matrices for casting large letters and a method of casting wedge shaped letters for cylinder&nbsp;printing.</p>
    <p>In 1816 William <span class="caps">IV</span> issued a specimen book that showed a single line of upper case sans serif letters labeled “2 Line English Egyptian” or about 28 points in size. Though Egyptian has come to refer to slab serif types only, it originally referred to all monotone or monoline stroke types. It is not known why he cut the sans, whether it was cut for a client or as an experiment, but there was no interest in it and several years would pass before more sans serif types&nbsp;appeared.</p>
    <p>In 1819 William <span class="caps">IV</span> sold the foundry to Blake, Garnett <span class="amp">&amp;</span> Co., which was formed specifically to purchase the company. They moved the company from London to Sheffield, England where it flourished and eventually became the Stephenson Blake foundry. William <span class="caps">IV</span> concentrated on developing a coal-gas system for&nbsp;lighting.</p>
