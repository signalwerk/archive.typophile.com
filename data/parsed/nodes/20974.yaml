    votes: null
    html: |-
      <p>Without a specimen, a typeface is essentially an idea. Type for print performs differently in different environments, and it’s nearly impossible to know how well it performs, without printed examples. In our digital world, nobody wants to spend money on printed specimens. So to choose a font for a book or magazine, you have to view them onscreen at a large size, and then somehow infer how the fonts will look when printed much smaller on paper. That’s an unreasonable leap to ask people to make, when they’re going to spend money and commit their project to a certain typeface. </p>
      <p>Some foundries offer PDF specimens, you could collect them and print them out, put them in a binder. But that’s limited by your own output quality.&lt;<!--
