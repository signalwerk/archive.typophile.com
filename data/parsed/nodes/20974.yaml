    <p>I am starting a Collection of Type Faces that I like and am wondering what the rest of you do to accomplish this/ inspire you. Basically I just save bitmap images of type that i like from letter-setters by “typeName_foundry”. Then If I find a use for that font I can go back and get it from the Foundry pretty easily.</p>
    <p>Do you organize different typefaces into folders? Do you type words in that relate to the usefullness of the typeface, or type in random words, etc? Any general advice on setting up a library like this?</p>
