      <p><em>Is there a copyright issue if you commission a font based on an existing font family, for example, Courier, in the above example?</em><br>
      “Based on” is very relative. If you’re thinking about modifying some letters, I’d talk to the foundry or type designer in question. On the other hand, creating something brand new <em>in the same vein</em> as a previous design is what type designers do all day. I wouldn’t worry about that.</p>
      <p>If you want people to write with it, a distressed face might be a bad choice.</p>
