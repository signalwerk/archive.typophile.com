    html: "<p>To get estimates, you’ll probably need to contact foundries directly. You’ll also need some more details: technical level, timeframe, character set, weights, styles, level of exclusivity etc. OEM licensens are often priced as a percentage of the end product retail price. An exclusive design might mean a higher one time fee upfront, but on the other hand no running expenses. You could also deviate in style within the same widths and metrics as Courier, giving your product X a unique voice.</p>"
