    <p>Example: A program called Final Draft for writing screenplays includes a custom font called Courier Final Draft. It resembles the old typewriters that were used for writing screenplays back in the day. </p>
    <p>What's a reasonable price for commissioning a font like that? Is there a copyright issue if you commission a font based on an existing font family, for example, Courier, in the above example? Thanks in advance.</p>
