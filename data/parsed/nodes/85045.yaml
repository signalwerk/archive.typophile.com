    html: <p>Courier is a public domain design, but expect to pay between $350 and $24,250 per weight for a custom (designed from scratch) distressed typewriter font. Price will be dependent on designer, their research, character set and number of iterations. Price does not include hinting, or expenses (such as purchasing old typewriters or trips to the International Typewriter Museum in Oakland, CA.)</p>
