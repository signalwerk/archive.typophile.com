    html: |-
      <p>&gt;With all those distressed type-writer fonts out there, why wouldn't you license an existing one?</p>
      <p>When screenplays were written with typewriters (roughly similar to 12pt Courier font) in "Hollywood" format, each page of play was roughly equivalent to 1 minute of action, which is why Courier (or Courier Final Draft) is still the default font for writing screenplays in this format. I think FreeMono would be a pretty good free alternative, but at some point we might want to commission a font called Courier X for product X that competes with Final Draft to match the competition. I'm just wandering how much that would cost?</p>
    html_clean: |-
