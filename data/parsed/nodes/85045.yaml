      <p>David, height of the caps are not that different, between Courier New and Courier Screenwriter, but if you do the same exercise for the lower case, it is a lot different, as well as noticeably darker. I think the difference anyone will notice when they are side by side. </p>
      <p>Your example of Courier Final Draft looks darker in the screen capture in FontLab, but for some reason not in your sample. I don't have your "Courier" with no other identity on my machine, so I can't check the lower case of that or the Final Draft one.  </p>
      <p>The point of my giving the numbers is that the set width is almost identical, but the lower case looks a lot bigger and darker. So it is OK as far as the 1 page per minute rule. But it looks a lot different on the page, and I think the darker and bigger look of Courier Screenwriter is better for use in a screenplay. </p>
      <p>My understanding is that Pat2 has a new screenwriting program and wants to have his own proprietary version of Courier for it, rather than buying one from a competitor. So it can't be too different and meet the needs, but it can be a little different, and better in small ways, and certainly as good as the versions in Final Draft or Movie Magic Screenwriter.</p>
