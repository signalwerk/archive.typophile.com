      <p>David, I know he can't change Courier noticeably. But being more robust can be done without changing how it sets or page count. Since it's monospaced, it's not exactly rocket science to get it to space *exactly* the same: just set all the characters to the same number as Courier. I'm not saying it's a feat of creativity, but it might look a little nicer and still be Courier. </p>
      <p>Just checking: I see that with my copy of Movie Magic's Screenwriter program there came a special "screenwriter" version of Courier, which is substantially heavier than New Courier, and with higher x-height, and almost the same monospace width—1233 instead of 1227 (they are both true type fonts.)</p>
      <p>So it seems that my original suggestion was exactly on target. Movie Magic's Screenwriter and Final Draft, which are the two most widely used programs for screen play writing I would guess have done similar things in producing their own versions of Courier. I could do the same for Pat2, who started this thread. </p>
      <p>And yes, I've written a screen play. Just ask me about it :)</p>
