      <p>I have that same Autechre CD. It is nice. I tend to notice that a lot of electronica has simplistic covers like that though. Basic color, small or no text.</p>
      <p>After the Beatles and Metallica, is there room for another plain colored album with nothing on it? Thinking about it, Pink Floyd's Wish You Were Here was hidden by a brown paper slip case on top of the artwork with the burning man. Some people to this day don't know what the cover looks like. THAT's mysterious.</p>
    html_clean: |-
