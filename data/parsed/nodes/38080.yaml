  html: |-
    <p>So my friend has a joke band called Ded Bundee, and he asked me to do an album cover for him. He has the aim of making his band appear mysterious and enigmatic, although the songs are less that than silly songs about robots. And they wear fake mullets.</p>
    <p>So anyway, here are two ideas I came up with. Let me know what you think. Do they appear mysterious and enigmatic enough. And how would YOU make something appear so?<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/ded-bundee-web_4601.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/ded-bundee-2-web_4429.jpg"></div><p></p>
