    html: <p>Plantin Schoolbook (actually most Schoolbook of any font variants) have a one story 'a' and 'g'. Plantin Schoolbook was sort of brought to attention by Wallpaper Magazine, btw. Both Capsa by Dino dos Santos and Galaxie Copernicus by Kris Sowersby (both based on Plantin) also do. Many Neo Grotesques have a one story 'g' and a two story 'a', amongst others Helvetica.</p>
