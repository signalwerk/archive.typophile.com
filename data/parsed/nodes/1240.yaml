    html: "<p>Measure the vertical proportions: the x, capitals, ascenders and descenders height in relation to the eye (space between ascenders an descenders k - p ) and the capitals. (use Hkpl) <br> <br>Measure the contrast (relation between the thickest and thinnest parts. Also measure the uppercase and lower case alphabet length. <br></p>"
