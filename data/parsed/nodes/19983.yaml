    html: |-
      <p>The UPM size in the OpenType/TrueType specification is limited to 65,535. That is a limitation of the format. However, point coordinates in FontLab Studio are also limited to 65,635, which is a limitation of our application. Therefore, it’s impractical to work even at a UPM size of anything close to 65,535. However, I pretty much feel that a UPM size of 10,000 should be OK for you. If not, try 20,000 or 30,000. </p>
      <p>A.</p>
