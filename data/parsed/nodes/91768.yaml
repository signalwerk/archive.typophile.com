    <p>I'm a beginner in Typography (Inkscape and FontForge on Win7x32).  </p>
    <p>I try to explain my answer with an example:<br>
    <strong>I like to use the existing OFL font family "PT Sans"</strong> with different styles/weights and also Condensed/Extended variants <strong>for charts and drawings in a project</strong>. But this font-family (like any other good text font) <strong>misses some Unicode symbol chars</strong> (from Unicode-Block Dingbats, Miscellaneous Symbols, etc.) that I need.<br>
    Windows seems to automatically use sometimes weird fallback chars, coming from the installed fonts with extended Unicode support (Segoe UI Symbol, Arial Unicode MS, DejaVu Sans, etc.). Office/Word (Uniscribe?), MS IE (first Uniscribe, now DirectWrite), Firefox (first Uniscribe, now DirectWrite), Chrome (Uniscribe) seem to have sometimes different implementations of this "<strong>font fallback mechanism</strong>". I was unable to find enough information to understand this OS and software behaviour. I'm especially interested if it is possible to edit this mechanism, for example to prescribe the usage of the preferred Unicode font. This would be generally interesting also by using fonts like Linux Liberation/Biolinum. Here some links:<br>
    <a href="/wiki/https%3A/%252Fen.wikipedia.org/wiki/Fallback_font" class="freelinking" rel="nofollow">Wikipedia: Fallback font</a><br>
    <a href="/wiki/https%3A/%252Fen.wikipedia.org/wiki/Uniscribe" class="freelinking" rel="nofollow">Wikipedia: Uniscribe</a><br>
    <a class="freelinking external" href="http://msdn.microsoft.com/en-us/library/windows/desktop/dd374105%28v=vs.85%29.aspx" rel="nofollow">MS Win UI Dev: Using Font Fallback</a><br>
    <a class="freelinking external" href="http://msdn.microsoft.com/en-us/library/windows/desktop/dd317788(v=vs.85).aspx" rel="nofollow">MS DirectWrite</a><br>
    <a class="freelinking external" href="http://blog.mozilla.com/nattokirai/2009/10/05/making-font-initialization-lazier/" rel="nofollow">Mozilla: Making font initialization lazier</a><br>
    <a class="freelinking external" href="http://maxradi.us/documents/uniscribe/" rel="nofollow">Brett Wilson (Google Chrome Dev) / Uniscribe: The Missing Documentation &amp; Examples</a></p>
    <p>I think I have two options:<br>
    A) use the PT Sans fonts and modify/extend them with the risk to have to integrate future releases and to make errors as a beginner<br>
    B) create a new font with the PT Sans metrics and only the desired Unicode symbols. But the technical background and the fluid usage in texting/graphical software is not clear to me (without the need to change font family for certain characters in the text). </p>
    <p><strong>Is there more information about the Font fallback mechanism with rare Unicode characters in Windows, especially whether this behavior can be influenced?</strong> </p>
    <p>I hope my question is clear enough and someone here can extend my knowledge about this complex behaviour. Thank you.</p>
