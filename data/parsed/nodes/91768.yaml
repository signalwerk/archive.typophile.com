    html: |-
      <p>I'm not quite sure what you're looking for here.  All browsers implement the same basic algorithm for fallback within fonts in a given fontlist.  If you specify <code>font-family: FontA, FontB, sans-serif;</code>, then all browsers will first test FontA for a given character, then FontB, etc.  If <strong>system</strong> fallback occurs (i.e. none of the fonts in your specified fontlist contain a glyph for a given character), then the behavior will vary across browsers.  Chrome used a hard-coded fallback list, IE uses an OS-level fallback routine and Firefox uses a hybrid approach.  But if your goal is to always see a given set of symbols, make a font containing those symbols and include it in your font list.  In that case, fallback will be consistent across browsers.</p>
      <p>John Daggett<br>
      Mozilla Japan</p>
