    html: <p>This face originated right here in the U.S. of A. -- it looks like Goudy's Pabst Oldstyle Italic.  <br>You can get a very reasonably priced digital version from Vintage Type (<a href="http://www.vintagetype.com" target="_blank">http://www.vintagetype.com</a>),  <br>although I doubt it has all the central European characters. Also, the captial "A" is slightly different  <br>(the crest serif slants left in this sample but slants right in the VT version).</p>
