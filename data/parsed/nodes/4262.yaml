    html: <p>I flipped all the way through the serifed type families in the Jaspert "Encyclopaedia of Type Faces" and didn't spot this face. There were a number of Czech type designers, such as Menhardt, Ruzicka, Kapr and Preissig, but nothing showed a style as distinctive as this. <br> <br>This raises an issue that has bugged me for a long time. At least in the U.S., other than Jaspert's excellent book, there is very little that shows European typefaces that have not become digital fonts. We see a fair amount about English type, predictably, but almost nothing about Continental European metal typefaces. <br> <br>Does anyone know of any good references for that subject? Odds are they won't be in English, but type speaks for itself. This may be a question for Luc Devroye.</p>
    html_clean: <p>I flipped all the way through the serifed type families in the Jaspert "Encyclopaedia of Type Faces" and didn't spot this face. There were a number of Czech type designers, such as Menhardt, Ruzicka, Kapr and Preissig, but nothing showed a style as distinctive as this. <br> <br>This raises an issue that has bugged me for a long time. At least in the U.S., other than Jaspert's excellent book, there is very little that shows European typefaces that have not become digital fonts. We see a fair amount about English type, predictably, but almost nothing about Continental European metal typefaces. <br> <br>Does anyone know of any good references for that subject? Odds are they won't be in English, but type speaks for itself. This may be a question for Luc Devroye.</p>
