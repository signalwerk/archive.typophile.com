    html: <p> <br> <br> I try to collect printer specimens of old Czech printers. It is a good source of information about type. Sure, there are many not digitalized typefaces. But these specimens are rarely to be find in the antique book stores. And if I find one, it is very expensive. But this typeface isn't listed in my specimens. <br> <br>You can try <a href="http://www.symposionbooks.com" target="_blank">http://www.symposionbooks.com</a>, they offer several type specimens of Czech printers. The store could send you the book abroad.</p>
