    <p>Greater Albion Typefounders have just published two free typeface offers on our <a class="freelinking external" href="http://gatf.wordpress.com " rel="nofollow"> blog</a>.  </p>
    <p>These offers are for fully licensed commercial typefaces-not our designer's old freeware releases (as popular as those have proven. One offer is for a copy of Crewekerne Regular in your choice of Truetype or Opentype formats.  The other offer is for a fully licensed copy of any single face of your choice from our releases to date.</p>
    <p>Read all about the two offers <a class="freelinking external" href="http://gatf.wordpress.com " rel="nofollow"> here</a>.</p>
