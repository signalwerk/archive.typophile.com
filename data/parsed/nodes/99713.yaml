    <p>I'm working on a paper discussing book design, and I'm having trouble finding the name of the font used on this cover:</p>
    <p><a href="http://www.writersdigestshop.com/catalog/product/gallery/id/73779/image/41167/" title="http://www.writersdigestshop.com/catalog/product/gallery/id/73779/image/41167/">http://www.writersdigestshop.com/catalog/product/gallery/id/73779/image/...</a></p>
    <p>It's repeated in the inner material for chapter headings as well, only it's slightly different. The font is essentially the same, only the capital A doesn't have a serif on top, whereas there is clearly a serif on the capital A on the book's front title. Is that a different font, or simply a variation of the same font?</p>
    <p>If you click on the "Look Inside" link on Amazon.com, you'll see what I mean.</p>
    <p><a href="http://www.amazon.com/Writing-21st-Century-Fiction-Storytelling/dp/1599634007" title="http://www.amazon.com/Writing-21st-Century-Fiction-Storytelling/dp/1599634007">http://www.amazon.com/Writing-21st-Century-Fiction-Storytelling/dp/15996...</a></p>
    <p>Thank you for your help!</p>
    <p>Best,<br>
    Steve</p>
