    html: |-
      <p><cite> how hard is to achive that ? </cite></p>
      <p>I suppose that depends on insight &amp; talent. ;-) </p>
      <p>The thing ( i think ) that is happening in the example I like is that the calligrapher is placing the forms next to each other in such a way that they balance nicely. You can create a special spacing of two glyphs in a font by kerning. Doing that in some cases will get you nearer to that goal. Of course, ideally speaking you would get the basic spacing values and shapes as close to ideal to begin with - and then kern. Afterwards you may find that you have to redesign some shapes as a result of your looking at spacing &amp; kerning as well. Do you how to kern yet?</p>
      <p>The other thing that is happening is that the caligrapher is making subtle changes to the shapes of the glyphs themselves in their context to make them fit even more nicely together. You could do this in an opentype font via scripting. But I recommend doing the basic stuff first! Then in a year or two you might come back &amp; make a 'pro' version with 'contextual altrenates'.</p>
      <p>However, the first step is to get some flow into naomi again. Not very much but just a little. Then the flow will have to be made to feel unified. It may be tricky. But I think it's worthwhile. :-) Then spacing. Then kerning.</p>
