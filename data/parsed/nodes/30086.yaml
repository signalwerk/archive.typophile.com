      <p>I just bump on this site by accident when looking for developments on Ethiopic font typefaces. My biggest frustration is the readability of Ethiopic characters on a computer screen. Your first picture looks very interesting to me – very readable on computer screens. I don’t believe we have to stick to the 19 century typefaces in the 21st century. Does anyone know if there are developments on this issue? The new Microsoft Nyala typeface, which will come with Vista, is an improvement but according to me not that good enough.</p>
      <p>Thanks,<br>
      Aya</p>
