    html: <p>These calligraphic examples sure show big spacing! And while there is more variety in heights shown in these examples than we see in Naomi, there seems to be less than in Nyala. Interesting! The thing I noticed the most however was that the in largest example of calligraphic writting, the one with altrenating red and black lines of text - the glyphs really set up nicely with each other. They also feel lively, not just because of the oblique angel but because of the motion of the shapes. And the excellent way they relate to each other. I sure like that. I think that integrating some of the variation in thickness we talked about will help bring some of that into Naomi. I would like Naomi take some of that in. Not lots, but a little. But are you interested in that feeling at all?</p>
