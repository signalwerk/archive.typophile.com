    <p>Thanks for helping on this especially Eben . I would like you and everybody to see this samples so that where I am  coming from and where I am going .<br>
    I am trying to do modern looking font and yet I don’t want to abandon the traditional beauty .<br>
    In other words I want to exploit all the modern design Standards and the traditional quality .<br>
    Unlike Ethiopic  fonts out their my font will be very close to Latin sans.<br>
    Eben I agree when you say there is a lot of room for improvement . Your point is well taken Clotting at the joint, good elegant flow most of all to make it<br>
    Useable in usable at smaller pt sizes.<br>
    I am posting this images so that everybody can see different Ethiopian writing system. </p>
    <p>The first image is a poster I made not too long ago using the font I am working on .the last two images are the one I like most .</p>
    <p>Thanks everybody ! </p>
    <p>Aleme</p>
