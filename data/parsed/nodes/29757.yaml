    <p>I've finally released the free (as in beer) version of !Disc Inferno, despite Luc crediting me for it months ago. This features the first 200 of the 1300 glyphs or so, meaning no international scripts, swatches or other such goodies. I've incorporated the feed back from mentioning this previously, but now you can look at a fuller map, or download and play with it.</p>
    <p>Particularly, I'm interested in people's impressions on the relationship of x-height to overall size. However, I look forwards to your thoughts and comments in general, as I work on to release the very expanded version in 1Q07. </p>
    <p>DL available @:<br>
    <a href="http://www.abstractfonts.com/font/11970?text=Quick%20Brown%20Fox" rel="nofollow">http://www.abstractfonts.com/font/11970?text=Quick%20Brown%20Fox</a><br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/dididididi_4964.jpg"></div><p></p>
