    date: 2006-11-29T18:10:00
    date_raw: 29 Nov 2006 — 6:10pm
    votes: null
    html: |-
      <p>I don't know about getting rid of the diagonals, the only letters that don't have to have them are V/W. The X and the D needed them for legibility. And then I felt a couple more helped them get on with the more angular shapes.</p>
      <p>I suspect that your assessment on the outer curves is right. I blurred some text and it helped. I haven't experimented with the inter-letter spacing, yet. If it works, I can't yet imagine why (not that I won't try it anyhow).</p>
      <p>The thick strip on the left is harder to read for some reason. Shorter mid-W is a winner.</p>
      <p>I think uncial letters would complicate the font too much, if I am imagining them correctly. Might try that last. :) </p>
