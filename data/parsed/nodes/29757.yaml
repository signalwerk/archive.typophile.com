      <p>I'll try posting this again.</p>
      <p>Inspirations include not only 70's era del ray pulp sci fi paperback covers, and B-movie boxes, but those corny 1980's "computer age" fonts, and Marilyn Manson's Mechanical Animals. Intended uses could be for sci-fi posters, retro geek-chic material, or just for where one wants to inject a funky in-yo-face look. </p>
      <p>The original hand-lettering this was built from was actually created just before Mechanical Animals was released, but the album's spirit matched well, and a recent listening helped inspire the overall look.  Also, I did make a point of looking closely at my own bookshelf to make sure !Disc Inferno brought a far more modern look than a 30 year revival would have.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/mm sampler copy_3742.jpg"></div><p></p>
