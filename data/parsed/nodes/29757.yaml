    html: <p>I bet even a small increase in interletter spacing would pay. What if you got rid of the diagonals? They seem arbitrairy ( except in the case of the Cap N) and are probably not helping the face to read. Instead, I think probably distract. You could add them to glyphs where you expect them like with the K. Or eliminate them altogether. What happens if you make the heavy area swith sides &amp; be on the left? What if you drop the middle of the W? What if all the forms were based on lower case? There is more variety of form there. What if some of the shapes were based on unical?</p>
