      <p>Hmmm, I suppose I wouldn't be posting it here after release if I wasn't dissatisfied in some way, would I? I think it is this:</p>
      <p>I enjoy not only the connotation, but I also enjoy the details, when I look at an entire word. However, any more than one word, and the legibility seems to drop. A lot. Why, if we read by word shape? Should the leading or the size of the space be altered? Is there a way to get a flow between words that is as fun as that between letters?</p>
      <p>I guess what I am looking for is a critique of metrics, not glyphs.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/hownowbrowncow_6389.jpg"></div><p></p>
      <p><a href="http://www.chozcunningham.com" rel="nofollow">Choz Cunningham</a><br>
      <a href="http://www.exclamchine.com" rel="nofollow">!Exclamachine Type Foundry</a><br>
      <a href="http://www.exclamachine.com/snark" rel="nofollow">The Snark</a></p>
