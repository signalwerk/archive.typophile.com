      <p>What riccard0 said. So far, only IE 10 and Firefox 4+ support some OpenType features. You can read more about the possibilities of the future here:<br>
      <a href="http://nicewebtype.com/notes/2012/01/13/ie10-supports-opentype-features-via-css/" title="http://nicewebtype.com/notes/2012/01/13/ie10-supports-opentype-features-via-css/">http://nicewebtype.com/notes/2012/01/13/ie10-supports-opentype-features-...</a><br>
      The article has also a link to demo pages by Font Bureau, Monotype, and FontFont:<br>
      <a href="http://ie.microsoft.com/testdrive/Graphics/opentype/Default.html" title="http://ie.microsoft.com/testdrive/Graphics/opentype/Default.html">http://ie.microsoft.com/testdrive/Graphics/opentype/Default.html</a></p>
