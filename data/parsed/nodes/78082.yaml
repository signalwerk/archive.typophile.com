      <p><cite>A little more Zorro</cite></p>
      <p>Nice definition! I made dozens of atempts to improve this, without success. It seems I'm more skilled to be Sargeant García than Zorro, but I'll try again. ;-)</p>
      <p>This Z with swash tail is used for Africanist phonetics. It's also in Shona, a language from Zimbabwe, Zambia and Botswana, with about 11+ million speakers. The character was used between years 1932 and 1955, but was dropped because no typewriter could produce it.</p>
      <p>Inclusion on Unicode was proposed in 2004 and 2007, mainly aiming historic and phonetic compatibility, but its presence on new fonts permits a re-introduction on in-use writting system.</p>
      <p>Unicode point is 2C7F, from block Latin Extended-C.</p>
