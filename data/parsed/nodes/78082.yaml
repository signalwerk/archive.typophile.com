      <p>Ben and Riccardo, thank you very much. Both ideas are welcome.</p>
      <p>I did a try using different hook shape. Another change is small increment in first stem thickness, to compensate its tall gain with hook. This sample also shows alternate Engs for some African languages:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/eng06_5548.gif"></div><p></p>
      <p><em>Eng, alternate eng and N-left-hook.</em></p>
      <p>I did not use any ball-like terminal in this font. So, this second hook may fit better the general design, what is more evident in IPA characters:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/eng04_3727.gif"></div><p></p>
      <p><em>Characters with hook from IPA block.</em></p>
      <p>To bring together information about various uncommon characters is a very good initiative. But following the wiki article created by Riccardo, I cannot find the <em>Characters</em> subsection in the <em>How-tos</em> section. I just find <em>Characters</em> link through <em>Design international characters</em> subsection. Maybe a small correction is needed there.</p>
      <p>Another thread I begun about this kind of characters is <a class="freelinking external" href="http://typophile.com/node/73886" rel="nofollow">here</a>.</p>
      <p>As we're talking about uncommon characters, here ase some really tricky to me:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/unusual_5958.gif"></div><p></p>
      <p><em>More unusal characters.</em></p>
      <p>Quatrillo with comma is maybe the greater sin I made until now as I choose to melt the comma and base character to avoid confusion with comma itself. G with central stroke is not in Unicode and is used only in Kadiweu language, a native amerindian from Southwest Brazil. The others are in Unicode, but its design was not so easy to me.</p>
