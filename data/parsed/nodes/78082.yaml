  - id: 448326
    user: 32723
    date: 2011-01-20T18:39:00
    date_raw: 20 Jan 2011 — 6:39pm
    votes: null
    html: |-
      <p><cite>I track your glyphic considerations with much sympathy</cite></p>
      <p>It's really fine to hear that from the man behind such a masterpiece like Andron!</p>
      <p><cite>How do you climb onto the 6.400 glyphs mark?</cite></p>
      <p>The way I wrote was somewhat misleading. The project is not so rich as a font like yours. Actually, it's far from this. Latin is the only script supported, besides phonetics (IPA, APA and some unnofficial).</p>
      <p>The total of glyphs became so huge because this font has uppercase, lowercase, small caps, petite caps and swashes. There are alternates for |Q|W|a|b|g|q|y|, what multiply the number of glyphs (just lowercase a, with two alternates, produces 120+ glyphs).</p>
      <p>Besides the letters themselves, there are glyphs which varies with uppercase and small caps: combining diacritics (all), punctuation (partial), maths symbols (partial) and currency symbols (partial). Numbers also elevate the account, with ten sets: default, uppercase, oldstyle, small caps and petite caps, each one in proportional and tabular variants.</p>
      <p>I also added enclosed A-z and numbers, a set of arrows and more mathematical symbols than usual. All this caused the project to go so far. BTW, you don't need to be disturbed because I probably will drop the swashes set from this version. It's so much work for a lone life (how to draw a swash for B-with-hook or Tresillo?). For release 2.0, if I reach age 117, it would include complete swashes and Cyrillic.</p>
      <p>I'll send you a private message regarding the other topics.</p>
