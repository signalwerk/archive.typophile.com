      <p>Igor, this is completely speaking with no familiarity with the languages concerned, but it seems logical to me to keep the hook distinct from the Eng shape. To be sure you'd have to know whether the function of a hook is the same on an N as on another letter...difficult as this letter seems to be used for different languages. Even in IPA it seems the hook has different functions (implosive and ejective). However, I'd imagine the Eng has less to do with an N than does an N-hook, so I'd keep the shapes different.</p>
      <p>Maybe we could put together a full list of all the questions you've asked about unusual letters, with their conclusions and illustrations, as a reference for other designers?</p>
