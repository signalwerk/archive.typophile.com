  html: |-
    <p>Characters Font Foundry has made an own <strong>RSS feed</strong> available for anyone who wants to be informed.<br>
    A lot of things will change this year and a lot of fonts will be released. Very soon 10 of my fonts will be sold through <a href="http://www.veer.com" rel="nofollow">Veer</a>. The complete Nordic Narrow family will be available in the next weeks at <a href="http://www.fountain.nu" rel="nofollow">Fountain</a>.</p>
    <p>Here's the feed address to subscribe to:<br>
    <a href="http://www.characters.nl/rss/rss.xml" title="http://www.characters.nl/rss/rss.xml">http://www.characters.nl/rss/rss.xml</a></p>
    <p>With this feed I will keep you informed on new releases, interesting newsfacts, updates and much more.</p>
    <p>Best regards,<br>
    ®ené</p>
