  html: <p><img src="http://www.typophile.com/forums/messages/30/38215.png" alt="some wingdings characters"> <br> <br>Can anybody tell me what are those Wingdings characters? What do they mean/represent? <br> <br>I've seen them one in print (just the first one) and once in the interface of a database software (first and second). </p>
