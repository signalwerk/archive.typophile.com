    <p>Hello,</p>
    <p>I've been working on a typeface family inspired by different cuts of Kis types. It's no revival, but I thought I give credit where credit's due.<br>
    Right now I'm doing some research into Kis' connections with Sweden (I've found correspondence that shows he sold type 1686/1687 to Swedish printers).<br>
    There are a few articles in Swedish that refers to parts of his autobiography, thus far I've found two misspellings (one is repeated in subsequent articles) and no correct version. I did find the book though, and if there is anyone who knows the correct translation of the title it would be very appreciated. It's not for a paper, I just want all details to be correct.<br>
    And also important, does anyone know of any translations of this book?</p>
    <p>The title is (unless it continues, check the link):</p>
    <p><strong>Maga személyének, életének és különös cselekedeteinek mentsége</strong></p>
    <p>And since I can't seem to insert images I'll write the links to the pictures:<br>
    inside<br>
    <a href="http://www.sk-szeged.hu/kiallitas/totfalusi/apologia.html" title="http://www.sk-szeged.hu/kiallitas/totfalusi/apologia.html">http://www.sk-szeged.hu/kiallitas/totfalusi/apologia.html</a></p>
    <p>cover, reprint:<br>
    <a href="http://www.antikva.hu/borito/1-54786-949.jpg" title="http://www.antikva.hu/borito/1-54786-949.jpg">http://www.antikva.hu/borito/1-54786-949.jpg</a></p>
    <p>Kind regards,<br>
    Fredrik</p>
