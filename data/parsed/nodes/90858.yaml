      <p>Not Spanish, but Argentine (same language): Ramiro Espinoza.<br>
      He has some interesting types: <a href="http://www.re-type.com/" title="www.re-type.com/">www.re-type.com/</a></p>
      <p>I think that if you choose an unexpected type and treat it in a special way that thoroughly integrates with your overall design concept, then it assumes a significant connection with the content in the mind of the viewer, over-riding any preconceptions they may have (or, more likely, an informed graphic designer may have). For instance, this Afro-Uncial:<br>
