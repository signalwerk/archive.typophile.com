      <p>You're right about Dolphin - it's a clone of... Delphin.  :-/<br>
      <a href="http://www.myfonts.com/search/delphin/fonts/" title="http://www.myfonts.com/search/delphin/fonts/">http://www.myfonts.com/search/delphin/fonts/</a></p>
      <p>The main thing BTW is to figure out how much text<br>
      you need the font to carry; generally speaking the<br>
      more expressive the font the more tiring it is in<br>
      terms of reading for extended periods. Delphin for<br>
      example is not really a text font.</p>
      <p>Feliciano: to me his work is more... continental.<br>
      Eudald for example is a revival of fonts from an<br>
      old German/Dutch type designer, Fleischmann.</p>
      <p>Rayuela is a good choice, and quite "texty".</p>
      <p>Avoid Nueva - it's more like a caricature.</p>
      <p>Kimera: amazing work I've long admired, but<br>
      I agree that his fonts are too expressive here.</p>
      <p>Check here too: <a href="http://latinotype.com/" title="http://latinotype.com/">http://latinotype.com/</a><br>
      But there are many more high-quality "Latino"<br>
      foundries out there now. BTW, it all started with<br>
      the economic recession in Argentina in '99...</p>
      <p>hhp</p>
