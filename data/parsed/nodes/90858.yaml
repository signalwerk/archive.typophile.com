      <p>It's interesting to me that Monotype classifies Delphin as celtic. Seeing it more properly kerned and with a few different characters (s, l, i, R,...), I can see why.</p>
      <p>I typically like to employ something a little quirky, or introduce some quirks, for the titling and large display type. I agree with you about the rest though; more sedate is better. If possible, I'd like the font to do double-duty--have a display and a text weight--but am comfortable pairing up a couple fonts.</p>
      <p>Thanks for the pointer to LatinoType.</p>
