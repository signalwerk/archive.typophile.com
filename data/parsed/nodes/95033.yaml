    <p>To save money I am going to be creating &amp; printing my own wedding stationary suite with Save the Dates, invites, programs, thank you cards, etc. I've fallen in love with the font below and I am struggling to find two or so others that pair well with it.</p>
    <p><a href="http://www.myfonts.com/fonts/sudtipos/lady-rene/" title="http://www.myfonts.com/fonts/sudtipos/lady-rene/">http://www.myfonts.com/fonts/sudtipos/lady-rene/</a></p>
    <p>I'd appreciate any help in creating a consistent, beautiful, and legible design. (Lots of old people attending!)</p>
    <p>Thank you, thank you!</p>
