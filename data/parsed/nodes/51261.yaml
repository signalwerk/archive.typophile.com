      <p><a href="/wiki/Avenir" class="freelinking" rel="nofollow">Avenir</a> – <a href="/wiki/Adrian%20Frutiger" class="freelinking" rel="nofollow">Frutiger</a>’s <a href="/wiki/Futura" class="freelinking" rel="nofollow">Futura</a> – would be an obvious answer, no?<br>
      <a href="http://typophile.com/node/27007" rel="nofollow">Avenir Next</a> comes with old-style figures.</p>
      <p>Have a look at <a href="/wiki/Thomas%20Phinney" class="freelinking" rel="nofollow">Thomas Phinney</a>’s <a href="http://www.adobe.com/type/browser/landing/hypatia/hypatia.html" rel="nofollow">Hypatia Sans</a>: 6 weights from Extralight to Black (though no Italics <a href="http://www.typophile.com/node/41338" rel="nofollow">yet</a>), and all kind of figures you can imagine. Once you found your way throught the various OpenType Stylistic Subsets, Hypatia Sans will turn out to be a very <a href="http://typophile.com/node/33619" rel="nofollow">versatile system</a>.</p>
      <p>F</p>
