  html: |-
    <p>Hi all,</p>
    <p>I'm looking for a geometricish sans that has display qualities similar to Futura, but has text qualities like Frutiger. Preferably available in a family with a range of weights from Light to Black, and presence of hanging figures.</p>
    <p>Any suggestions? :)</p>
    <p>Best,<br>
    Artur</p>
