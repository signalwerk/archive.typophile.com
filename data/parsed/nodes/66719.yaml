    html: <p>The partial derivative symbol shouldn't look like an eth without a crossbar. Its extender should be more bent and fill out the space more, and may well have a ball-like terminal. It should be italic in design, that is to say cursive and slightly inclined, because it is only used for mathematics. It is a letter-like symbol, not a letter. Therefore the design is very different from eth, which is a full-fledged letter and should harmonize with other letters of the Latin alphabet.</p>
    html_clean: <p>The partial derivative symbol shouldn't look like an eth without a crossbar. Its extender should be more bent and fill out the space more, and may well have a ball-like terminal. It should be italic in design, that is to say cursive and slightly inclined, because it is only used for mathematics. It is a letter-like symbol, not a letter. Therefore the design is very different from eth, which is a full-fledged letter and should harmonize with other letters of the Latin alphabet.</p>
