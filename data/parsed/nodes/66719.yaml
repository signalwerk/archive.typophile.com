    <p>I've gotten in the habit of using the partialdiff (u2202) glyph as a base for eth. I'm concerned that this may be a bad practice.<br>
    In most fonts I've seen, partialdiff is in the form of a an italic or script delta, whether the font is italic or not. Is this necessary in a font that is not intended for setting math?</p>
