      <p>I downloaded from <a href="http://github.com/wspr/unicode-math" title="http://github.com/wspr/unicode-math">http://github.com/wspr/unicode-math</a> Will Robertson's experimental LaTeX package, called unicode-math, intended to be an implementation of unicode maths for LaTeX using XeTeX (and later LuaTeX) typesetting engines.</p>
      <p>On page 10 of his unicode-math.pdf document (dated 2009/11/01) he writes, concerning the partial differential U+2202 and the math italic partial differential U+1D715:</p>
      <dl>
      <dd>
      At time of writing, both the Cambria Math and STIX fonts display these two glyphs in the same italic style, but this is hopefully a bug that will be corrected in the future — the ‘plain’ partial differential should really have an upright shape.<br>
      </dd>
      </dl>
      <p>If we take into account that the package will offer the following <code>math-style</code> options,<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/mathstyle_6727.jpg"></div><br>
      that makes sense.<p></p>
      <p>Michel</p>
