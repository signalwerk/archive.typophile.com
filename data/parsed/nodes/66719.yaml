      <p>Here are all the partial differential glyphs provided by the <a href="http://tug.ctan.org/cgi-bin/ctanPackageInformation.py?id=fourier" rel="nofollow"><strong>LaTeX Fourier mathematical font</strong></a> (based on Utopia) which comes with the <a href="http://www.tug.org/mactex/2009/" rel="nofollow"><strong>MacTeX-2009</strong></a> distribution.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/varpartialdiff_4535.jpg"></div><br>
      The left square corresponds to the basic character (regular and bold, upright and italic), the right square to a variant, which is close to having that common ball-like terminal that Brian mentioned above. The first line are the glyphs we get when calling fourier with the <code>upright</code> option, else the glyphs we obtain are those in the second line (slanted).<p></p>
      <p>That character is used for partial derivatives, where a slightly slanted version is indeed quite common. It is also used for a boundary operator in differential geometry, for which I personally prefer an upright version.</p>
      <p>Michel.</p>
