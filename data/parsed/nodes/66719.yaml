    html: |-
      <p>When Adobe converted their type library to OpenType, they filled all the alphabetic fonts out to Adobe Western 2, which is a slight superset of WinANSI and MacRoman. For Adobe Originals where the added characters were at all relevant given the design, they got all the glyphs custom made. For non Adobe Originals, and Adobe Originals for which such glyphs were not very relevant (e.g. Rosewood), they had most glyphs automatically synthesized from a generic MM font.</p>
      <p>Cheers,</p>
      <p>T</p>
