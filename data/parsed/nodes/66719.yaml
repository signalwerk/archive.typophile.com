      <p>One thing is clear: everyone I know that typesets mathematics does it with LaTeX. Even papers on economics that I have found on the web and that use mathematics were written in LaTeX. Martin Osborne, that used a partial on his web site on economics (of which there is a grab above) has even written a package for LaTeX. Have a look at <a href="http://www.economics.utoronto.ca/osborne/" rel="nofollow">his web page</a>. </p>
      <p>In fact I am using pdflatex, because that gives me access to Type1 fonts (which was an improvement over previous metafont fonts). What do you think will happen when Opentype fonts become easily available to LaTeX users?  That is what XeLaTeX and LuaTeX will provide. Will Robertson is the person working on the math packages for XeLaTeX. When those packages become functional, users like me will expect to get the functionality that they announce. </p>
      <p>I think Michel Bovani did it correctly for the Fourier font (grabs above). Here is again a citation from Robertson:</p>
      <p><cite>Table 7: The various forms of the partial differential. Note that in the fonts used<br>
      to display these glyphs, the first upright partial is incorrectly shown in an italic<br>
      style.</cite></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/partial_4734.jpg"></div><p></p>
      <p>Michel</p>
      <p>PS I have books with partial diff glyphs that vary a lot in the last 60 years. I may post a few pictures if that can be useful (and when I have time).</p>
