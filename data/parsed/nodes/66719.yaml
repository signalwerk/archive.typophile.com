      <p>Nick, you're probably not serious, but one should never ever put one's foundry logo or a dingbat in a slot reserved for a specific character. The partial derivative symbol is a fairly common technical symbol and should be expected to crop up often inline in general textbooks, for example, which would not normally be set in a specialist maths font and could benefit from using symbols that harmonize well with the main text.</p>
      <p>Michel, thanks for that contribution. I didn't know about the different styles of the partial symbol being encoded as separate characters in Unicode or the upright symbols being preferred in French mathematical typesetting. I will retract my earlier claim that a partial symbol <em>needs to be italic.</em></p>
      <p>I should point out that this does not mean necessarily that one should put an upright partial symbol in one's roman and an italic in one's italic in the same slot. No one is going to use upright and italic partial symbols in the same text. Rather, if you're designing all those variants, you should treat them as separate characters and use the assigned Unicode slots.</p>
      <p>As for Michel's question about what should be filling the blank in that picture, I think that U2202 is the natural answer if we think of "roman regular" as being the default character. The form of U2202 itself may be italic and identical to U1D715, or upright according to stylistic preference. The other characters are there as stylistic variants, which tells me Unicode thinks of the upright form as the default, but it does not matter in the least if we choose italic as the default form and not provide an upright form at all, because no one is ever going to need the full stylistic palette of partial symbols for the same text.</p>
