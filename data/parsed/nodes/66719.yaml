      <p>Because of its availability in less extensive fonts, I’ve seen partialdiff used as a phonetic symbol. Its use for this purpose depends on it being similar to other Latin letters in the font, so in this narrow case it should have the same center angle as other letters.</p>
      <p>For the curious, I’ve seen it used as a replacement for schwa /ə/, as an interdental affricate /tθ/ or /dð/, and surprisingly as a voiced interdental fricative which is usually represented with just edh /ð/.</p>
