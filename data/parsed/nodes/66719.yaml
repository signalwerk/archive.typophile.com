      <p>Thanks Michel, I had forgotten about the use as a boundary operator (it's been a while). I don't know that I would prefer an upright version for that use, but I see how one might want to distinguish between different uses of the symbol. Another consideration may be that the symbol generally appears right next to italic letters (e.g. ∂<em>S</em>) and having an upright look recalls the similar use of upright letters as operators (e.g. bd<em>S</em>). But then as you mentioned with the French tradition, I guess different typographic traditions may have different preferences for upright and italic generally for mathematical typesetting.</p>
      <p>James, thank you for mentionning the use in phonetic notation. Given how people have always tried to create phonetic symbols from what was available, this isn't surprising. In fact, I have noticed the partial derivative symbol being used for the schwa before, and probably for the eth also. This in my mind is as disgraceful as using a German Eszett for the beta. But using the partial derivative symbol for the dental affricate has a certain logic to it.</p>
