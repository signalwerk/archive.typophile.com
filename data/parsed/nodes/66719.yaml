      <p><cite>"I'm making a correct eth without a crossbar and putting it in the partialdiff space, then referencing that to the eth space and adding the crossbar."</cite><br>
      Dunno, I've seen that done before, and I must say it annoys me.* Yes, both these characters may seem pretty obscure, plus they're both a bit twiddly to make, so I understand the temptation. But to me this is one to resist; think about it – these characters come from completely different cultural backgrounds, from completely different contexts, they also <em>appear</em> in different contexts combined with different other glyphs, and last but not least they <em>mean</em> completely different things – now why should they share the same genes? Because they might look a bit similar on a surface level? :-\</p>
