      2202    PARTIAL DIFFERENTIAL<br>
      1D715   MATHEMATICAL ITALIC PARTIAL DIFFERENTIAL<br>
      1D6DB   MATHEMATICAL BOLD PARTIAL DIFFERENTIAL<br>
      1D74F   MATHEMATICAL BOLD ITALIC PARTIAL DIFFERENTIAL<br>
      1D789   MATHEMATICAL SANS-SERIF BOLD PARTIAL DIFFERENTIAL<br>
      1D7C3   MATHEMATICAL SANS-SERIF BOLD ITALIC PARTIAL DIFFERENTIAL<br>
      <code></code></code></p>
      <p>Now, here is a grab of the five last characters above taken from the chart "Mathematical Alphanumeric Symbols" to be found at the url <a href="http://www.unicode.org/charts/" title="http://www.unicode.org/charts/">http://www.unicode.org/charts/</a>.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/partial_5321.jpg"></div><p></p>
      <p>What should be filling the blank?</p>
      <p>Michel</p>
