      <p><em>Maybe you could find inspiration from another reputable foundry, Adobe.</em></p>
      <p>I follow the FSI practice of custom designing the glyphs to the font, not automatic synthesis--which is really the old "odd sorts" practice of providing little used characters from a different font. Long ago, for instance, Italic fonts didn't even have their own capitals or figures, these being borrowed from the roman. </p>
      <p>I first did custom math operators for Fontesque, although I thought it unlikely that it would ever be used for setting calculus.</p>
      <p>The principle of covering every possible eventuality is, IMO, a best practice for font producers, because it is more productive to assume that anything is possible than to spend time trying to figure out what isn't.</p>
    html_clean: |-
