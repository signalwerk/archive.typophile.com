      <p>I don't have a current collection of Pro-grade fonts right now; thank you for your time in pointing these out.</p>
      <p>So, from all this, I conclude that partial derivative sign at U+2202 should be an upright form, and legacy fonts with an italic form in this position are wrong.<br>
      The partial derivative sign resembles a reversed six, but it is neither a reversed six nor an eth without a crossbar. The arm from the right should be overarching to the left and may end in a heavy terminal.</p>
      <p>Thank you all for enlightening my ignorance.</p>
