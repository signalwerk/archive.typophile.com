      <p>Here is a little question that may be relevant or not.</p>
      <p>If we look at the unicode file <a href="http://www.unicode.org/Public/UNIDATA/NamesList.txt" title="http://www.unicode.org/Public/UNIDATA/NamesList.txt">http://www.unicode.org/Public/UNIDATA/NamesList.txt</a>, we can see that it contains the following characters (search for the word "partial"):<br>
