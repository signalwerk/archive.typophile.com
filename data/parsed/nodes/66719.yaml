      <p><cite>I guess different typographic traditions may have different preferences for upright and italic generally for mathematical typesetting.</cite></p>
      <p>In this paper entitled  "Typesetting mathematics for science and technology according to ISO 31/XI" (<a href="http://www.tug.org/TUGboat/Articles/tb18-1/tb54becc.pdf" rel="nofollow">pdf</a>), it is said: <cite>The main and possibly the only difference between "mathematical" vs. "physical" mathematics lies in the use of upright and sloping letters. Scientists and technologists (should) use upright letters much more often than mathematicians.</cite> I knew that some prefer to write d<em>x</em> (with an upright d) instead of <em>dx</em> for the differential, but I did not know where it came from. </p>
      <p>Here is a grab of Hamilton equations taken from Nakahara "<a href="http://www.amazon.com/Geometry-Topology-Physics-Graduate-Student/dp/0750306068" rel="nofollow">Geometry, Topology and Physics</a>" where the partial sign does not look very slanted in spite (or because) of the use of nearby italic letters.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/hamilton_3690.jpg"></div><br>
      Interesting.<p></p>
      <p>Michel</p>
