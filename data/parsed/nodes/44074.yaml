    <p>We are starting to see a significant number of bibliography entries of the form<br>
    </p><div class="imageWrap"><img src="/web/20080821131631im_/http://www.typophile.com/files/less_6002.gif"></div><br>
    You could argue that the “less” and “greater” characters really don’t belong, but when editorial says they do, that’s that; you set them. In most fonts, the less &amp; greater glyphs may work OK with numbers, but look awful in text. It is easy enough to make up an alternative pair that work with such text.<p></p>
    <p>BUT:</p>
    <p>As best I can tell, there are no greater or less characters in the Mathematical Operators portion of Unicode (2200-22FF), or in the supplement (2A00-2AFF) — or anywhere else. All we have are U+003C and U+003E, so that rules out using the ASCII greater and less for text, and another pair for math.</p>
    <p>Nor can I think of a contextual substitution that is foolproof. You could switch them to less.alt and greater.alt when preceded by or followed by an alpha character or punctuation, but there are cases where alphas are a part of an expression that should take the mathematical form.</p>
    <p>My current notion is to put them in a stylistic set, but that means the typesetter will have to remember to switch it on for such citations, and that too has its perils.</p>
    <p>Anybody have a better solution?</p>
