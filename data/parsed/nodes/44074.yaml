      <p>These are angle brackets, now for mathematics — there is a text angle bracket now encoded in the 3XXX range. As such, they have to pair with parentheses, square brackets, curly braces, etc. — in both text and math.<br>
      I condidered them, but don’t think they are right, esp. as they have another, “proper” usage.</p>
      <p>If there were mathematical greater &amp; less codepoints, we could use the ASCII greater &amp; less for text constructions, but I don’t think there are. Switching to an .alt seems the best solution to me (if ther is no math greater/less); the question is whether or not someone can think of a way of coding it to make it automatic.</p>
      <p>But thanks . . .</p>
