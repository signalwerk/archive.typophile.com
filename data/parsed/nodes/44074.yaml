      <p>Yes, I have used the left &amp; right single guillemet a few times. They don’t always look good — the Minion looks OK — and of course, syntactically they are wrong. As long as I have to manually search &amp; replace a manuscript, I might as well draw up what is needed. As you know, the .alt will drop out, leaving the “greater” &amp; “less”, which seems to be the actual character.</p>
      <p>The right answer, I think, is that these are not a part of the URL, but are in fact delimiters. What is needed is a better editorial solution. But that’s usually considered too deep a matter for a compositor . . .</p>
      <p>BTW, your (their?) /slash /slash needs kerning, as does g/slash ;-)</p>
      <p>Edit: If anyone cares, I can post what I came up with when I get into work tomorrow, it is switched by a stylistic set, though, and that’s not ideal . . .</p>
