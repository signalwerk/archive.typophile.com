      <p>I have started to look at the 'book of kells' where the first experiance with the 'image' connects you and the 'written ' word reveals itself.<br>
      They had the notion that when you wrote a word down you killed it, as the word only lives in your imagination. Their typographic work expresses the need to let the letter live when it is on the page so  illuminated the letter decoratively, in comparison with contempoary manifestations of type where type is used as image the type again has the notion of being alive having a personality and generates emotion with its audience.</p>
      <p>The Islamic lettering is also of interest to me as a New Zealand/ European and know no other language other than english I read Islamic type as image and find the use of pos/neg space and the arrangement of letters beautiful. </p>
      <p>                  "It relates to the total organisation of language<br>
                         and writing in the form of image"</p>
