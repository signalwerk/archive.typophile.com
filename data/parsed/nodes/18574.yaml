      <p>There are so many interesting directions you could take. Many of the above suggestions are worth exploring, but I guess for a project topic you need to pick just one main direction and go with it.</p>
      <p>As a conceptual matter, there is no necessary distinction between "text" and "image." Text, as has been pointed out above with some great examples, IS image, in the sense that text is visual (well, unless read aloud?). If that seems like a trivial point, consider that there is no *visual* criterion by which we could distinguish "writing" from "not writing" whenever we encounter any highly decorative use of an unfamiliar script-- decorative inscriptions in Arabic are a perfect example. We might see it and NOT KNOW it's any kind of "writing" at all. Same for a  lot of graffiti-- it often takes a while to see that within the dynamic and playful clusters of strokes, there may be something as simple as a tagger's name and/or some identifying information.</p>
      <p>I think this point at which a differece in *degree* (extreme but comprehensible stylization) becomes a difference in *kind* (we actually CANNOT TELL until it's explained to us) is a very interesting point, b/c it's both a cultural and a cognitive matter of whether we "get" what we're seeing or not.</p>
      <p>It's also worth adding that the functional vs. artistic dichotomy is itself a relatively modern, Western notion. Where any kind of inscribed marking ("writing" or otherwise) serves a *ritualistic* function, it is kind of BOTH functional AND artistic AND more. You see that already in many nonwestern inscriptions and in Western but not-so-modern stuff like illuminated manuscripts. Doing script as "glory to [pick your god]" can't be broken down so easily into those functional vs. artistic categories-- the ART is what helps the writing serve the FUNCTION of propogating, glorifying, etc., one's belief system.</p>
      <p>- Jay</p>
