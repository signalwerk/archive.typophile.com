    <p>I am new using this forum, so take it easy tiger.<br>
    I am currently trying to pursue a topic for my major that looks at the idea of the threshold/ boundary/ cross over point in which type as a word and type as an image. I started to look at contempoary manifestations of typography as form but started to ask myself where the hell I am going with this. Do I cut it down to exploring  when 'words become images?'. My intrest lyes with the borderline when words 'as written functional form' cross over to becoming form/ images which represent the word with so much more meaning and emotion. Does this have any intrest or am i travelling the road of no return?</p>
