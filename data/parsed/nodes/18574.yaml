      <p>Laura-- I agree with you, as my note above suggests (I think). I am interested in this very same set of questions. My sense is that it's probably not a good idea to search for a specific, lone criterion that distinguishes the two, but rather to focus on what features of what "marking systems" (my own way of putting it) are good at doing what kind of thing. Phonemic alphabetics, e.g., do a fairly decent job (with varying success) at presenting a graphic clue about sound. The IPA does it better, though. Pictures can make an impression, but they can't lay out an <em>explicit</em> cluster of premises, claims, conditional statements, etc., quite as well as text (alphabetic or not-- Chinese, e.g., is written and read "serially" but isn't alphabetic). </p>
      <p>The only way I've been able to make a distinction between "text" and "nontext" is not too different from yours-- it has something to do with what is made explicit and what isn't, what is meant to convey points A, B, and C to any given audience, and what can convey points X, Y, and C to a specific audience provided they have the right contextual knowledge. </p>
      <p>Lest this sound like a bunch of jibber-jabber, consider the photo below:</p>
      <p>Some would say that it may make quite an impact but can't really articulate an <em>argument</em> the way a text could. On that line of thinking, a picture is NOT really worth a thousand words. But if we say that such a picture conjures up all kinds of claims, evidence, reasoning, conclusions, etc., provided one has the contextual knowledge to bring to one's viewing of it, then a picture may be worth a whole lot MORE than a thousand words.</p>
      <p>Now, this makes things a lot easier for those wondering whether type is an image or not, or what criteria there are for separating them. The examples above are nice-- they show all kinds of funky ways "letters" can be given pictorial embellishments. But if you want to talk about can even, say, a simple Times New Roman "A" be seen as an IMAGE, well, the answer is YES obviously. Then, if we want to say, but can it make an "argument," again, the answer is YES, but ONLY if we see it in some context that gives us an "A" in the form of some kind of argument (A-list, a grade of "A", The A-Team, etc.). The triangular, upward-pointing "shape" helps, of course, but the letter being in the first position of the conventional Latin alphabet does, too.</p>
      <p>Anyway, this is cool stuff you're interested in. ANd not simple. I won't pretent what I'm saying answers it all. Just some speculations.</p>
      <p>- J</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/blackpower.jpg"></div><p></p>
