      <p>There are many directions you can take with this as suggested above.<br>
      Since letterforms are glyphs, whether expressed as characters of a typeface, handlettered, manipulated, gestured/calligraphic or even graffiti.</p>
      <p>IMHO, the more difficult road to take would be to research expressions of "word art" that actually uses existing typefaces (with only minor modifications). Herb Lubalin was a master at this form -<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/scarab.jpg"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/Mother2.png"></div><p></p>
      <p>More expansive expressions can be found when typography is actually graphic design. Paul brought up the Swiss posters...<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Basil_revue.jpg"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/blackwhite.jpg"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/1984-9.jpg"></div><p></p>
      <p>Calligraphy/graffiti is the easiest area to explore since with skill, letterforms actually do become "art".</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/graffiti-1.gif"></div><div class="imageWrap"><img src="http://typophile.com/files/kalli22.png"></div><p></p>
