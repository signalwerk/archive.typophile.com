    html: |-
      <p>All words are images, in the sense that we recognize, integrate and process words <strong>ideographically</strong>, that is, as an entirety, rather than as a sum of its parts. In this sense, words written with the roman alphabet (or any other alphabet) are no different from Chinese, which is purely ideographic. Virtually all conscious activity relies on <strong>pattern recognition</strong>, and words, taken individually, are discrete patterns (with discrete bouma, I am told).</p>
      <p>However, alphabetic languages have an advantage over ideographic languages when one encounters <strong>unfamiliar</strong> words; in these instances--depending on how regular the rules of pronunciation are in the language in question--you at least have some idea of what the word <strong>sounds</strong> like, even if you can't determine what it means. That is, unless the language is English, e.g., bough, cough, dough, through, tough.</p>
      <p>In Arabic calligraphy, words become design (not images, which are forbidden); in a good deal of logotype design, words become pictures (brands); somewhere on this website, there's a link to Bembo's zoo, where letters become critters. Pictograms become letters, letters form words, words form ideograms, ideograms become pictograms -- it's a marvelous circular process.</p>
