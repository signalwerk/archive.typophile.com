      <p>(in haste)</p>
      <p>Eben, the question is phrased misleadingly. The typefaces were intended to imitate handwriting, and typesetters were expected to make use of ligatures (and contractions and abbreviations built on a single sort) to achieve the appropriate texture. The same applies to the grec-du-roi. There is ample record of other (i.e. not Aldus, or Paulus M, or Estienne) using typefaces cut in the same style with fewer ligatures, and the texture in most cases breaks down (See, for example, small-format Wetstein books, 1700 onwards). In other words, most single-letter sorts were not intended to pair with other single-letter ones, if the writing model suggested a ligature and one was provided. </p>
