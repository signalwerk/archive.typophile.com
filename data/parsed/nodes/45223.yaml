  html: |-
    <p>I don’t expect anyone to know this, but if you have an idea abbout or know someone who might... when you look at the many many ’contextual/ligatured’ sorts ( in decreasing complexity over time ) used for Greek by Aldus, is it your impression that the ligatures and alt sorts are there only to emulate the style of writing they were aimed at ( perhaps similar to metal type that emulated copperplate connected script) or do you think they also improved fit? Not reading it or knowing the forms anywhere near well enough - it is impossible for me to guess. </p>
    <p>Toughie no?</p>
    <p>Also, for extra points: An example!</p>
