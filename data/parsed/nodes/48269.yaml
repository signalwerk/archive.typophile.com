    <p>Hello all, I’m helping some artists out with a project and need to match some typefaces from a bunch of different books of sheet music. I’ve managed to find most of them, but am stuck on these four. I’ve tried What The Font, but haven’t had any luck. Sorry about the poor image quality here—all I have is some hand-held digital photos to work from.</p>
    <p>If you can offer any suggestions I would very much appreciate it. Even if it’s not an exact match, that’s fine. Something close to the original, or its spirit is better than nothing. Thanks in advance!</p>
