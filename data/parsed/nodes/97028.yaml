      <p>In both those example I was merely showing what has been* and in the second example what <em>should</em> be - always useful for putting the sad reality in context. And for the record, Mana took a lot more than a few hours, not just because of the time needed to make those glyphs by hand (noting that it takes much longer to come up with ideal bitmaps than some might think**) but also because software was written to automatically convert the bitmaps to a TT font so it can actually be used (because this process was performed on much more than just Mana). BTW, I still use Mana in Photoshop to annotate hi-res images, like when I'm paid to critique fonts; it looks better than anything else, ever, period. Not a single crappy gray pixel anywhere in sight, in contrast to these gray miasmas being hailed as Progress.</p>
      <p>* With good ol' Georgia still better than RE. Damn shame the fruit went bad.</p>
      <p>** </p><div class="imageWrap"><img src="http://typophile.com/files/g13_6408.gif"></div><p></p>
      <p>As for shelf life: the relevance of CT was/is subpixel addressing, which will remain quite relevant for a while, especially for Italics.</p>
      <p>--</p>
      <p>We can give up on quality, individually or collectively, but this individual won't applaud the mud we're being fed.  And am I alone? No:<br>
