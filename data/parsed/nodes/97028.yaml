      <blockquote><p>After all, the default setting for XP is greyscale/binary and Reading Edge looks horrible under those circumstances. The same goes for most of the others.</p></blockquote>
      <p>I think it's true, but the number of people who use the default setting one way or another (new OS, IE updates etc) is decreasing and shortly will no longer be a concern. The quality of webfonts will, even when XP will disappear. </p>
      <p>I still live in an XP world, 12 hours a day at office. In the years I've worked with a lot of people who never switched on ClearType until someone had told them Clear Type existed; who genuinely don't care what they're reading as far as they understand what's written; who don't realize that the font they have been reading for months suddenly changes. But nowdays, in the era of the "webfont revolution", when they came across website sporting poor quality web typography, you can hear them scream. ClearType or not. You simply can't understand what's written. </p>
      <p>So I was wondering if there are real alternatives to Georgia (still looks amazing on screen) and Arial (don't, but it's familiar to users) wich don't cut out XPers from reading until XP disappear. I found a number of very well done webfonts which do look good even under XP, like hran said. Asked if there are others and how you would combine them. I see there's so much more under the surface... </p>
      <p>Anyway, here's some screenshots of serifs in small size under XP (first image is the original, second Georgia. Then the webfonts). </p>
      <p>They all look very good to me.</p><div class="imageWrap"><img src="http://typophile.com/files/xp-original_3570.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/xp-georgia_4334.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/xp-webfont-benton_6075.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/xp-webfont-milo_5036.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/xp-webfont-quadraat_4126.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/xp-webfont-spinoza_4449.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/xp-webfont-tundra_3665.jpg"></div><p></p>
