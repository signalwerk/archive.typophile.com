      <p>If your website is frequently read on windows computers or will use a type size under 16px, you have to carefully look at the rendering of the fonts, otherwise long text will not be very pleasant to read. Georgia is still a good free option, so is Droid Serif (I might be the only typographer who likes it though). </p>
      <p>From the paid pool of web serifs for body copy, I like <a class="freelinking external" href="http://www.fontbureau.com/ReadingEdge/" rel="nofollow">Benton Modern RE and Ibis RE</a> best. They cost $40 per style per year but you can go a long way with just one or two of them. And they can also be tested for free or try an existing site with their <a class="freelinking external" href="http://www.webtype.com/tools/swapper/" rel="nofollow">swapper tool</a>. Both combine well with FF Bau or Dagny, which I both like very much too.</p>
