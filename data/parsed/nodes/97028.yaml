      <p>@Indra: Thanks for your comment. The rendering of the fonts, especially with XP, was actually my concern: about the font size, I will not go under 16px, everything under is very hard to read for average user (me). And yes, Georgia is still a good option. Just wondering if there's something wich can really compete, and I found that it's possible: fonts like Fedra, Tisa, Adelle, Chaparral, Ernestine looks surprisingly good even with Xp (at 14-16px). And so perform the FF serif I mentioned, wich I found better suit for my needs (questionable, but still my needs).<br>
      I understood the Reading Edge webfonts are amongst the best you can find in this moment, they look stunning, I tested them and the quality is surprising. But they are too expensive for me right now (let's say $40 x 4 styles, normal and bold, it's 160/year: for that price I could buy once and forever 4 licenses for web from other services).<br>
      By the way, I discovered Bau reading your post on Fonts in Use about True Type of the Bauhaus, and since then it was my first choice. So, again, thank you. </p>
