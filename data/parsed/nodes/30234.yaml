    html: |-
      <p>Yes, I have that NovelFont collection and that is 'Marsdale' = 'Caesar' (QBF). I think all of these names are aliases, but my notes don't include any 'real' name for the typeface. The NovelFonts seem to have vanished from circulation, but most were either in Opti or Brendel collections, usually with 'alias' names.</p>
      <p>- Mike Yanega</p>
