      <p>Just confirming: same with me.<br>
      ‘Rare’ does not trigger DLIG, and also deactivates LIGA (when ‘Standard’&nbsp;is checked).<br>
      FEX 1.2.3 on OSX 10.5.5</p>
      <p>There is an <a href="http://www.fontexplorerx-board.com">unofficial discussion board for FEX</a>. But it seems this issue hasn’t been covered there yet, plus the board suffers from serious spam attacks, at the moment.</p>
