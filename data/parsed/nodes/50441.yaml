    <p>Hello all,</p>
    <p>I am encountering some problems in FontExplorer after upgrading my mac from Tiger to Leopard (10.5.5).<br>
    I am not able to properly preview ’rare’ ligatures any longer.</p>
    <p>So to clarify, when I check ’Common’ I see for example the standard ’fi’ ligature, but activating ’Rare’ removes the ’fi’ ligature and additionally doesn’t show me any of the more advanced ligatures as it used to.</p>
    <p>Any ideas as to why this might be happening?</p>
    <p>Thanks in advance,</p>
    <p>Seb</p>
