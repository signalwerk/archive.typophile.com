    <p>Hi guys,</p>
    <p>New here. </p>
    <p>I'm trying to pair Brandon Grotesque (Brandon Text actually) with a nice serif like Copernicus, Merriweather, Sina, Georgia. You get it, right ? Pretty easy at this point.</p>
    <p>My issue is to match sizes of the fonts because Brandon Text is a high ascender font. All the serif I try to pair with have a larger x-height than Brandon.</p>
    <p>Basically, in a perfect world, I should be able to have both fonts on the same line with a similar Ascender height. I know Garamond works well, but I look for a font with a contemporary feeling.</p>
    <p>Any ideas ?</p>
    <p>Thanks in advance guys.</p>
    <p><img src="/sites/default/files/old-images/Screen Shot 2015-04-27 at 5_4773.29.20 PM.png"></p>
