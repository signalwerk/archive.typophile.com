  html: <p>This font is my first foray into type design in quite a while; due to work, I haven't had the chance to do much in Fontographer, but recently I decided to dust off some old ideas and see where I could take them. <br> <br>Theoria [working title] is a bitmap face that I have been developing for use at 8px. It is my take on economic use of pixels, combining the use of gaps in bitmap shapes to add to the clarity with 1px ascenders.  <br> <br>And yes, in case you are wondering, i am quite mad. 1px. <br> <br>Feedback, comments, anything's welcome.  <br> <br><img src="http://www.typophile.com/forums/messages/29/1468.gif" alt="Theoria1"></p>
  html_clean: <p>This font is my first foray into type design in quite a while; due to work, I haven't had the chance to do much in Fontographer, but recently I decided to dust off some old ideas and see where I could take them. <br> <br>Theoria [working title] is a bitmap face that I have been developing for use at 8px. It is my take on economic use of pixels, combining the use of gaps in bitmap shapes to add to the clarity with 1px ascenders.  <br> <br>And yes, in case you are wondering, i am quite mad. 1px. <br> <br>Feedback, comments, anything's welcome.  <br> <br><img src="http://www.typophile.com/forums/messages/29/1468.gif" alt="Theoria1"></p>
