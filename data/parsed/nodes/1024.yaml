    html: <p> &gt; use of gaps in bitmap shapes to add to the clarity <br> <br>Masterful ingenuity. <br>Most people realize that whitespace is more valuable than it seems, but very very few people manage to actually use it to such great practical effect. <br> <br>And the application with the accents is *so* nice that I would recommend making a "progressive" outline font to go with it. Don't be surprised if it becomes a big hit with display designers; it can even be seen as giving a new cultural validity to accented writing systems. And do it fast - this is an idea that *will* be stolen, very quickly - I can feel it. <br> <br>hhp </p>
