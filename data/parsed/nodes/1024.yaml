    html: <p> I reworked some of the characters, finalized the base character sets and drew the additional international latin chars today.. I thought having only 1px to 'cheat' with [above the top of the ascenders] was a problem, so imagine the fun i had from drawing accents on caps. <br> <br>all in all the set looks pretty useful, but I'm looking for texts that'll let me sample the various international chars. <br> <br>So, like pangrams, but more international-oriented. <br> <br>Anyone? </p>
