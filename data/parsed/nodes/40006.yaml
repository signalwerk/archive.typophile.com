      <p>I started a green marketing company in 1988, and tried to make a go of it for a couple of years.<br>
      I worked out a philosophy and practice that addressed the issue of creativity.<br>
      As every ad should be, in essence, an environmental audit--reasoning why the product is justified or an improvement--there is no place for stretched benefits, i.e. claims and promises which have nothing to do with the product's environmental impact.<br>
      For instance, a celebrity endorsement or a suggestion that a car will give the consumer sex appeal or social status.<br>
      That challenged a lot of the notions of creativity which exist in advertising, making it quite restricted.<br>
      As well as "non-creative" ads, it was also hard to get clients to buy into the idea that, for instance, smaller ads were better. Creatives, of course, like big ads with white space.</p>
      <p>I came to the conclusion that the traditional business qualities advertisers look for in an agency are the be-all and end-all: price, quality (includes creativity), and service, and called it a day in 1990, by which time the green buzz of the late '80s was fading and digitization was capturing everyone's imagination. No doubt I could have kept at it longer if I'd been a better salesman.</p>
      <p>There are a small number of green and pro bono agencies, and they will remain a small number. Some environmentally-favorable practices occur in the industry, notably to do with materials used, but that doesn't address the central issue of consumption-stimulation, and the role played by "creativity" in hyping it.</p>
      <p>There is only so much that business can do, because its bottom line is the bottom line.<br>
      It's up to governments to regulate consumption--in the aggregate, citizens and corporations have too much self-interest to make much of a difference individually, despite the best efforts of a green minority.</p>
