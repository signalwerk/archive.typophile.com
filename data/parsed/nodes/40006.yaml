      <p>Adbusters and First Things First 2000 don’t directly link. First things first is an essay by designers who believe that designers could be doing better things with their talents and abilities than marketing products—products which are, in the view of the authors, unnecessary. There might be a connection to Adbusters by way of inspiration.</p>
      <p>Adbusters is an attempt at mocking branding and marketing, in which advertisements and the mainstream media are parodied with recreations of their advertisements and ephemera, usually by altering the wording of an ad campaign. The people behind it refer to their activity as culture jamming, although as I already pointed out in another thread, most people pay no attention, so it’s not so much affecting culture as a dialogue between holier-than-thou hipsters. It has been pointed out that Adbusters itself is a heavily branded, overpriced magazine just like those it often mocks, and that the same can be said for the unbranded products sometimes sold within its pages or by its creators. </p>
      <p>Your best bet for understanding the anti-consumerist movement is to go down to the library and start sifting through old issues of Adbusters, or find a local group that engages in this stuff and talk to them. Reading up on Jonathan Barnbrook would be very worthwhile.</p>
