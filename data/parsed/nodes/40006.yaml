      <p>&gt; Adbusters itself is a heavily branded, overpriced magazine</p>
      <p>The magazine is only overpriced if you compare it to those that carry advertising, which generally provides many times the income that circulation does. Since Adbusters carries no ads, the cover price is naturally going to be at least double what an ad-rich publication will (and remember that an 80 page issue without ads has the same editorial space as a 200 pages magazine that carries ads.</p>
      <p>(And no, I am not a holier-than-thou hipster. I have bought exactly 1 copy of the magazine in the last five years.)</p>
