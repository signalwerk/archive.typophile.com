      <p>Thanks, Si.</p>
      <p>When you talk about rebooting, do you really mean restart the system? or restart an application? or log off/log on? Sure seems like you should not have to restart the system just because you replaced a font. I would think there should be some way around that, but maybe not.</p>
      <p>So a checklist when testing new versions of a font might be....</p>
      <p>1) Delete the font from the Windows Fonts folder.<br>
      2) Delete all application/Adobe font cache files.<br>
      3) Install the new version of the font in the Fonts folder.<br>
      4) Test the font. Log off and log back in, if necessary.<br>
      5) test the font. Restart, if necessary.</p>
      <p>Regards,<br>
      tim</p>
