      <p>&gt; Have you logged out and logged in after deleting fonts<br>
      &gt; from Windows’ fonts folder?<br>
      &gt; I was told Windows’ own font cache is deleted only then.</p>
      <p>To some extent it's true. If you use Windows Explorer to delete the fonts from the Windows fonts folder, Windows will automatically remove the "font cache" entries (i.e. the respective entries from the registry that hold the list of installed fonts). If you use a different method and just delete the files using, say, command line or some other application, or a script, then Windows will not automatically uninstall the font. </p>
      <p>Unfortunately, there are cases where even logging off and on does not help. I hope that Linotype Font Explorer for Windows (when it's released) will include such a feature. </p>
      <p>Regards,<br>
      Adam</p>
