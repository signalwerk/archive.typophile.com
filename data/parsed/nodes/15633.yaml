    <p>I feel like this must have been covered before, but I have not been able to find anything that goes far enough.</p>
    <p>I am developing an OpenType version of one of my earlier fonts, using FontLab Studio 5 on Windows XP with Adobe Illustrator CS and InDesign CS for checking features and such. his is my second OpenType font, though the first one was developed using FontLab 4.5.</p>
    <p>I added all my extra glyphs, set up the classes and worked up a few basic features. I used the Preview in Studio, and everything worked fine. I generated the font -- PS-flavored OpenType. Install it. Started Illustrator CS, set some text in the font, tried the features (basic ligatures and fractions only). Everything worked. Exited Illustrator.</p>
    <p>Back in Studio then, I added several more features for small caps, oldstyle figures, stylistic alternates, etc. Features worked fine in Preview, so I generated the font again. Deleted the font from Windows fonts and installed the new one. Started up Illustrator and found no new features. Exited Illustrator and searched my hard drive for all the Adobe font cache files: "adobefnt*.lst", then deleted them all. Started up Illustrator again and still no new features.</p>
    <p>So, what do I need to do beyond deleting those Adobe font cache files? What am I missing? I really need to get this project wrapped up. Any suggestions appreciated.</p>
