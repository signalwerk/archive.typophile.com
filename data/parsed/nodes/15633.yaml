    html: |-
      <p>I've asked around. Deleting a font via the Windows fonts folder is the safest and cleanest option - if the font is in use Windows will tell you and not let you delete the font. However...</p>
      <p>1. Some apps may keep their own caches of font information which not be flushed when the font is deleted. </p>
      <p>2. Some table offsets may be cached by the system -  this is only a problem if the font is replaced with a different version of the same font. That's why good apps force a reboot when a font is upgraded. </p>
      <p>3. Some apps that delete fonts (possibly some font managers) don't delete fonts properly, or don't report to the user that the font is locked, or don't force a reboot when the font is replaced - all these scenarios can cause problems. </p>
      <p>Cheers, Si</p>
