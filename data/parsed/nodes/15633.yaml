    html: |-
      <p>I mean reboot, AKA restart. I don't think logging off is good enough on XP. Unfortunately there's no way around it, although problems rarely occur, when they do it's a bad experience for the user. For testing your own fonts I don’t think you need to worry but you do if you're building a font installer that needs to upgrade (or downgrade) an installed font. </p>
      <p>Here's a note from the engineer...</p>
      <p><cite>The first time I saw this, the font Tahoma was replaced and was in use by Microsoft Mail. About ½ hour after the font was updated, suddenly all the lower case characters using that font would not display. </cite>  </p>
      <p>The way we avoid this when testing is to give each instance of a font a unique production name eg "Tahoma bld 112" so we can test without worrying about this, and also compare versions installed on the same machine.</p>
