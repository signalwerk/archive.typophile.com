      <p>Hello Alexander</p>
      <p>The key points to think about after you've fine-tuned your artwork are:-</p>
      <p>1. Card thickness/colour/texture - Colorplan 540gsm is arguably the best option with a choice of 50 shades <a href="http://gfsmith.com/paper/colorplan" title="http://gfsmith.com/paper/colorplan">http://gfsmith.com/paper/colorplan</a></p>
      <p>2. Print process - letterpress or hot foil printing adds so much character to any professional  minimalist or contemporary business card  <a href="http://www.deeplyimpressed.co.uk/" title="http://www.deeplyimpressed.co.uk/">http://www.deeplyimpressed.co.uk/</a></p>
      <p>- David</p>
      <p><a href="http://www.ultimatebusinesscards.co.uk/" title="http://www.ultimatebusinesscards.co.uk/">http://www.ultimatebusinesscards.co.uk/</a></p>
