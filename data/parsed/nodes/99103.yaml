      <p>I do kind of see what you mean.  The humanist font (which is <a href="http://typophile.com/node/98769" rel="nofollow">Mythology</a>, by the way) is still used for the subtitles in the new design - I do want to keep it somewhere in there.  Using it for everything doesn't seem quite right, though, hence the title change to Bulmer.  </p>
