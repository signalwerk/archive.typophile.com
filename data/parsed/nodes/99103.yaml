      <p>From reading "Design for Non-Designers", I recall that all-centered alignment often feels boring.  I'm getting exactly that impression here — the flush-left alignment in your first two images strikes me as more interesting and more confident than your last design. In particular, the list of three items with nothing but spaces in between feels loose and haphazard. I suspect this is why your previous design seemed "monotonous" to you.</p>
      <p>I also found the humanist serif font in your previous designs a nicer choice than the portly modern you use now.</p>
      <p>Oh, and lose the drop shadow. IMHO, shadows should only be used to increase contrast (e.g. for light writing on dark background). Here, it just makes the text look less crisp.</p>
    html_clean: |-
