    html: |-
      <p>I think the New E it is much better. I have an idea bout it though; what if you let the bottom stroke of the E start farther out ( in the middle) and take on that small bulb shape that is on the light stroke now. Then the light stroke might be more like the ones on the arms of the T. I think that would let you keep the idea but let the E read as an E just a little faster/better.</p>
      <p>Do you mind if I post a graphic suggestion for the E? Maybe it's a terrible idea...</p>
      <p>Also I second what Tiff said about alternatives either coded in to be automatic or just available like swashes. I say this because some pairs are great together like the TA and SU. But TY, and as Tiff pointed out the EX are less so. The potential beauty of this will be greatly enhanced by a lovely consistent fit - using inconsistent forms if needed.</p>
  - id: 259051
    user: 12433
    date: 2008-02-15T04:32:00
    date_raw: 15 Feb 2008 — 4:32am
    votes: null
    html: |-
      <p>Eben, I don't quite see what you mean. Do you mean making the same termination as the one on the L's bottom stroke?<br>
      If you want post it, I would like to see you suggestion. That could work, but I think maybe it will be difficult to coordinate it with the curved strokes (if that is your idea) without making it too complex. but I agree  that the E isn't the most legible.</p>
      <p>Paul &amp; Tiffany, I already see this font as a unicase, there are already lower cases mixed with upper cases. But I don't want to have descenders or ascenders. I want to keep everything above the baseline and under the caps height. But I could have more lower case alternatives, for intance for the H, A, D.</p>
      <p>The ligatures for some pairs are deffenetly nedded, I have to work on them:)</p>
