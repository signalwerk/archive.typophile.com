      <p>I'm just curious why this is headed as a Blackletter font. Having come from more of a calligraphy background as opposed to Typography, I immediately thought of the style as Versals, though they are often seen Historically with Blackletter as headings. I noticed that uncials are often categorized with blackletters as well. Is this just a type thing. I know the word Gothic in both type and lettering has several different meanings.<br>
      Stephen Rapp</p>
