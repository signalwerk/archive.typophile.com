    <p>I recently found an arabic font online for free (scheherezade), but some glyphs were not mapped (and so they didn't appear in the character map in Windows and I wasn't able to use them).</p>
    <p>To fix this, I opened up FontLab and spent countless hours mapping each glyph to the appropriate unicode.</p>
    <p>I recreated the font, but now when I install it and try to open the character map, it crashes.</p>
    <p>So does every other program when I try to use my new font.</p>
    <p>How can I even BEGIN to figure out what is wrong?</p>
    <p>Jamal</p>
    <p>PS - I no longer have fontlab, but I can provide anyone willing to help with the font files (.ttf, .vfb, .bak)</p>
