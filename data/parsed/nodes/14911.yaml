    <p>I spotted this announcement on the Boston Society of Architects web site:</p>
    <p><strong>ReBrand 100</strong></p>
    <p>ReBrand 100&nbsp;is seeking entries for this second annual award competition.&nbsp;&nbsp;<br>
    ReBrand 100 is the first global awards competition established to recognize the world’s most effective rebrands: the repositioning, revitalizing, or redesign of existing brand assets to meet strategic goals. Architects, interior designers, product designers, marketing strategists, graphic designers, advertising agencies, branding consultancies, and others whose work is key to defining a brand’s look, feel and function are invited to enter.</p>
    <p>Entry deadline for the 2006 ReBrand 100 is September 28, 2005. The late entry deadline, with late fee is October 5, 2005.&nbsp;&nbsp; To enter, to view past winners from 11 countries and over 45 industries, profiles of other sponsors, partners and the international jury panel, please visit <a href="http://www.rebrand.com"><strong>www.rebrand.com</strong></a>&nbsp;or call 401-277-4877.</p>
