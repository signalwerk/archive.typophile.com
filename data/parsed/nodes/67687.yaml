    html: |-
      <p>Christian Schwartz' <a href="http://commercialtype.com/typefaces/graphik" rel="nofollow">Graphik</a> has just been released by Commercial Type, which draws a bit from Neuzeit Grot, Paul Renner's Plak and other of the 'lesser' Grotesks (read more about it on his <a href="http://christianschwartz.com/graphik.shtml" rel="nofollow">personal homepage</a>).</p>
      <p>It cleans up with some of the quirks of NG, which is refreshing, but might not always be what you're looking for... it's a cool typeface, very versatile, and <a href="http://carvalho-bernau.com" rel="nofollow">we</a> have used it in a number of projects, always to very good effect, but we've also used Neuzeit a couple of times, because it is rougher, less polished.</p>
      <p>Full disclosure: I am affiliated with CT through collaboration in various ways. </p>
      <p>Hope this helps<br>
      Kai Bernau</p>
