      <p></p><div class="imageWrap"><img src="/web/20080830040258im_/http://www.typophile.com/files/cooperheavy_4864.jpg"></div><br>
      The Goudy type in question would be Goudy Heavyface. Goudy recalls in his “Half Century of Type Design” that this type of heavy black face held little appeal to him but that Harvey Best of Lanston Monotype was “obsessed” with releasing one...most likely to compete with Cooper Black. As far as forgery, theft or inspired mimicry, you decide, here they are for comparison.<p></p>
