      <p>I agree that they are significantly different. </p>
      <p>To me Goudy Heavyface is not as good a typeface, even though it very well executed--maybe better than Cooper Black. The problem is that it is neither here nor there. It has the fat and soft look, but without the distinctive charm of Cooper Black. What is great about Cooper black is those endearing bulbous serifs and terminals--while still the face still has a strong spine, unlike Hobo or Souvenir. So yes, Goudy Heavyface could be used in more categories, but who wants to? You probably have better alternatives. But if you want something bold but cute, which is in demand in advertising, then there you have Cooper Black smiling at you. It has won the popularity contest with Goudy Heavyface and I think you can see why. </p>
      <p>Chris, I disagree with you that Goudy is 'more crisp', as it is still quite soft. For a charming fat face that is more clean and crisp, we are awaiting the heavy weight of your "Froggy," which you have shown in the Critique threads. Now that will give Cooper Black some real competition!</p>
