    <p>Fellow Typophiles,</p>
    <p>I've read an interesting story about good ol' Goudy. Making research about the unfortunate and talented Oz Cooper, I've learned that his teacher and mentor in type design was Frederic Goudy, and a few years after they parted their ways, when Cooper Black became a huge success, most of the competiting foundries made copies of this type, and of these replicas was made by... Frederic Goudy himself. Oz Cooper was quite bitter, tried unsuccessfully to protect his design, and finally died from cancer in 1940 at age 61.</p>
    <p>does anyone know more about this? I'd like to learn.</p>
    <p>dr</p>
  html_clean: |-
