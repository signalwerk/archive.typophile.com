      <p>FWG is yelling from beyond the veil:</p>
      <p>"The old fellows stole all our best ideas!"</p>
      <p>Once a typeface from foundry A took off, suddenly foundry B, C and D wanted one "just like it". No mystery that Goudy was asked to mimic other popular faces. What I think is interesting is the kind of solution Goudy came up with; it satisfied the brief but clearly shows his individual style. Another face in this category is Kompakt, a very bold roman by H Zapf. It also looks similar on a superficial level, but has all kinds of personal style in it. That's fascinating.</p>
