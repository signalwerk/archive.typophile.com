      <p>David R, You said you read this story but didn't say where. Could you provide a source (online or printed)? I've been curious about the story since hearing it in the Cheshire Dave film which I agree is very funny and very clever.</p>
      <p>However, the narrator's claim in the Cheshire Dave film never seemed right for the simple fact that the specific Goudy type (was it Pabst?) mentioned doesn't look at all like Cooper Black to my eye. It might be another. The lettering style is imitated all the time during the period. And guys, let's remember, plagiarism was rampant at the time (look at ATF and Koch, or Continental Type Foundry's [FWG's foundry type distributor in the 1930s] attempt to sue ATF in the 1920s) and designers (including Goudy) didn't get rich off their commercial designs. They made their money on private designs and book/advertising design.</p>
      <p>I doubt the story made it into print in their day. Most of the nasty comments about Goudy found their way into private letters or unpublished talk. Rudolf Ruzicka's <cite>Speaking Reminiscently</cite> (Grolier Club, 1986)(<a href="http://worldcat.org/oclc/13803244" title="Click to visit an external URL." class="freelink freelink-external freelink-external">cite</a>) mentions his own break with FWG over a portrait--it was Goudy's egotism that irritated RR. (The unedited tapes are held by the Club but FWG warrants only two short mentions.) Morison and Updike wrote snidely about G in their private correspondence (but then they also were a bit snide about Bruce Rogers too). If you don't have <cite>The Book of Oz Cooper</cite> (STA, 1949) (<a href="http://worldcat.org/oclc/41547813" title="Click to visit an external URL." class="freelink freelink-external freelink-external">cite</a>), you should look at it. I think RH Middleton also has a Cooper book (<a href="http://worldcat.org/oclc/34637591" title="Click to visit an external URL." class="freelink freelink-external freelink-external">cite</a>). Not much published on him outside the Chicago area. You might check with current Chicago-area AIGA members and such. A number of old-timers knew Middletown and had heard stories from them, but not being in Chicago, I've never tried to get the stories.</p>
      <p>-Paul</p>
