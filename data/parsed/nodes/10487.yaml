    html: <p>No luck in the "Dutch Type' book, although it somewhat resembled a typeface designed by Jan Tholenaar for large-print books called 'GLB-16'. This was used between 1973 and 1974 for printing about 50 books for sight-impaired readers. It was one of the first Dutch digital typefaces.</p>
