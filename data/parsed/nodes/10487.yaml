    html: <p>Winston - <br> <br>If you look on the lower right of page 80 you'll <br>notice a caption for the covers in cyan.  <br>It says "Composer set in Classified News, enlarged" <br> <br>If you jump back to page 22 you'll see mention <br>of Karl setting his work with an IBM composer <br>and then enlarging the result. Also on page <br>18 there is a specimen of the face shown in a  <br>few sizes with some rather raucous text settings. <br> <br>I love it. Clunky, loose and strangely charming.</p>
