      <p>Dustin, Akira is a generous and kind man who isn’t likely to intentionally ignore anyone. He does travel frequently, and may be away from the office right now. I know that some of his colleagues are away, so he may be at the same event.</p>
      <p>You can call the Linotype offices - the phone number is on their website: <a href="http://www.linotype.com/53/contactdetails.html" title="http://www.linotype.com/53/contactdetails.html">http://www.linotype.com/53/contactdetails.html</a></p>
      <p>They have normal business hours in their time zone, so keep that in mind when you call. You should be able to find out Akira’s availability when you call.</p>
      <p>Good luck with everything.</p>
