      <p>Grandjean (Romain du Roi) was digitised by Franck Jalleau in 1995-1997 for the Imprimerie Nationale. Don't know if it's available to buy.</p>
      <p>I would love to see, among other things, a digitisation of Touraine by Cassandre (Deberny &amp; Peignot, 1947) or its lookalike Chambord by Excoffon (Olive, 1945-1951). Both can be seen in Jaspert, Berry &amp; Johnson's Encycl. of Typefaces. Nicely post-deco and not quite as bizarre and dogmatic as Peignot.</p>
      <p>Very much looking forward to the digitisation of <a href="http://www.myfonts.com/WhatTheFont/forum/viewthread.php?threadid=37115" rel="nofollow">Ronaldson</a> (MS&amp;J, 1884), soon to be completed by Rebecca Alaccari (Canadatype). Not really what you would call a classic, but there's nothing quite like it around anymore, and surprisingly comfortable as a textface despite unclassical letterforms.</p>
