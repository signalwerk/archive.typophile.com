      <p>Georg — There is no problem with publishing specimens. After all, fonts are meant to be used in printing or other publishing projects, right? What others intend to do with those publications is something different, for that matter. For a digital revival, legally one would have to acquire the proper rights from the present owners, I guess, if the designs and/or names are not in the public domain already. How is Dipl.-Ing. Menzel managing the rights issue? <a href="http://www.romana-hamburg.de/fraktur1.htm" title="http://www.romana-hamburg.de/fraktur1.htm">http://www.romana-hamburg.de/fraktur1.htm</a></p>
      <p>I suggest you take contact with the Bund für deutsche Schrift und Sprache. They published an interesting book with specimens of 114 German types, most of it Fraktur: Wolfgang Hendlmeier (ed.), <cite>Kunstwerke der Schrift.</cite> Gedichte und Sinnsprüche im Kleide schöner Druckschriften aus sechs Jahrhunderten, Bayreuth: Bund für deutsche Schrift und Sprache, 1994.</p>
      <p>Reviving typefaces of typographic interest, is imho always ethically right. If the designer is still alive, it makes no sense to "revive" a typeface of his; plagiarising his design would be robbery. If he's passed away, I think his children should benefit from their father's labour, to a certain extent. But if some clever boys managed to get hold of someone else's intellectual property, making money out of it by acting as monopolists, denying mankind access to its cultural heritage, ignoring these mercantile stolen "rights" is not only ethically correct, it's a moral obligation.</p>
  - id: 158988
