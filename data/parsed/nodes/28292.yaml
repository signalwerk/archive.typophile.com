      <p>Well,<br>
      first of all: Good Morning. Its 8:03 am in Germany and this is not my time.<br>
      I'll think about your arguments, you brought logical ones.<br>
      What I do is not only to collect fonts.<br>
      My place here is like a heater: I buy old german typesetting departments (there are still dozends of it all over Germany from family printing companies, which are existing since more than two or three generations).<br>
      I clean and check the types and I print new ones with a full sort of alphabet, digits and - what is it in english "Punkturen" (all special signs). After printing I offer the type in my Online-Shop and give it back to printers again. Because I want it to be used in real life, not only sleeping in my cabinets. There is a small community of, let's say, 200 up to 300 printers from Germany, Italy, England and from the US, which buy and use my types.<br>
      For 2007 I am planning a printing project - so I scan all my alphabets. May be you'll see it as senseful for your own projects to use one of my scans. Let me know.<br>
      I want to look for some advices from some experienced typesetters here in Germany to make my own decision.</p>
      <p>Regards,<br>
      Georg<br>
      PS: Please do not use those fonts between 1933 and 1945 - there are other fonts which even better characterize Germany. </p>
      <p><a href="http://www.bleisetzer.de" class="link" rel="nofollow">Preußisches Bleisatz-Magazin</a><br>
      <a href="http://www.bleisetzer.de/img/ichbineinpreusse.mp3" class="link" rel="nofollow">"Ich bin ein Preuße, kennt Ihr meine Farben?"</a></p>
