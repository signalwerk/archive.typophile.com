      <p>Other types on the wish list to be revived? Er, the Doves Type? (1900, T.J. Cobden Sanderson, Emery Walker, Edward Prince, Doves Press) or have we had this old chestnut already? Monotype Condensa? (designer unknown? date unknown?) The full family of Erbar Grotesk, not just the condensed version. Every time I look through an older specimen books I see stuff that I'm pretty sure has not yet been revived, but everytime I go online I get the opposite feeling!</p>
      <p>Or, coming back to De Roos, the Hollandse Mediaeval (1912, Sjoerd H. De Roos, Lettergieterij Amsterdam/Intertype) with its decorated initials...</p>
