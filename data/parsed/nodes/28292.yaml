      <p>Actually, Hrant, digitising the Bignon design would be fascinating for more than one reason. Grandjean had to change it because the details were more or less unfeasible in metal type, of course, whereas a digital version could be absolutely true. But at text size we would also see how well it works optically as it is. And probably have to agree with some of Grandjean's changes. First problems in sight: the skinny lowercase g and y.</p>
      <p>I must admit I never did really like the Romain du Roi for its symmetrically-seriffed ascenders. How can you get any flow into a text interspersed with Corinthian pillars?</p>
