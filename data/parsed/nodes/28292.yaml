    html: |-
      <p>Georg, "genial" was too strong a term - sorry. I was rushed - normally I use that term very rarely - but instead of editing it and making your post confusing I've just asterisked it.</p>
      <p>That said:<br>
      1) Nobody's perfect, and the more type you make the more likely you'll end up with a lemon or two.<br>
      2) Making money sometimes or even often (some would even say usually) does not preclude being intelligent, insightful or culturally responsible.</p>
      <p>Looking specifically at your two samples*, I would say:<br>
      1) Elegant-Grotesk is cute[r], but not really significant. And I can see plently of issues of craft in its forms.<br>
      2) National might have been overly nationalistic and/or mainstream when it was made, but right here right now it's more useful and interesting than Elegant-Grotesk.<br>
      3) If you feel that either of those (and specifically Elegant-Grotesk)  are more interesting and more worthy of revival than the Höhnisch sample I posted above, then we really are looking for very different things in type design.</p>
      <p>* And assuming you meant to say "be aware", not "beware" above.</p>
      <p>&gt; There is no problem with publishing specimens.</p>
      <p>Actually IIRC, P M Noordzij once told me (I have the email somewhere) that merely scanning a type sample and sending it to a friend is illegal in the Netherlands, much less "publishing" it. Of course, each country is different, but be careful of blanket statements.</p>
      <p>&gt; mercantile stolen “rights”</p>
      <p>Here again I think you're being unfair.</p>
      <p>hhp</p>
