      <p>&gt; Doyald Young’s article about Van Krimpen</p>
      <p>Werzat?</p>
      <p>&gt; Grandjean had to change it because the details<br>
      &gt; were more or less unfeasible in metal type</p>
      <p>True, but I also think it was as much a stylistic imposition on his part. He shouldn't have done it. It's not like the world had a dearth of conventional italics.</p>
      <p>&gt; symmetrically-seriffed ascenders</p>
      <p>I remember JFP also objecting to that, to the point of ridicule. But I see the positive in it: not only does it express a grand style ahead of its time (note how liked Democratica became centuries later) but I think they actually help readability (by reinforcing extenders). Which is not to say I think the RdR is highly readable overall.</p>
      <p>&gt; it’s not all too clear who the present owner is.</p>
      <p>If a good effort at research validates this ambiguity, then I personally see the free third-party revival of the design as contingent only upon the informal blessing of De Roos's heir (unless he's unreasonable to the point of misanthropy, in which case I would ignore him). As a point of courtesy protocol however I would inform competing potential revivers of the decision.</p>
      <p>hhp</p>
