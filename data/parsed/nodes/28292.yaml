      <p>I should have been more precise. Why do you use fonts? Right, to set type. Should that mean, with those fonts of which you legally purchased the user's license, you're supposed to set running text only (for which, of course, you or your client has the proper copyrights)? Are you not allowed to set <cite>and</cite> publish alphabets and such? Of course you are. Probably someone did this before, though, and he might have done so in a particular inventively new composition, of which he, the type specimen designer, is the rightful owner. You cannot simply steel his work and copy it right along. But is P.M. Noordzij or whoever now going to tell whether "The quick brown fox" or "Quousq; tandem" has been set already in, say, 10/12, in that particular font, so that nobody else can do that any longer without copyright infringements? Honestly, that's mere nonsense!</p>
      <p>I suppose Georg and every other type collector that desires to give the world a glance at his collection, has to set those specimens all over again, instead of scanning those which are available already. Poor, poor world.</p>
