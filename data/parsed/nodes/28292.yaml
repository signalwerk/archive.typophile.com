      <p>Lieber Ludwig,<br>
      ich bin froh, daß Sie besser deutsch verstehen und schreiben als ich englisch.</p>
      <p>Ich kenne den Autor des Beitrages im PDF. Er ist ein guter Bleisatz-Freund und ein guter Kunde von mir. Wir haben fast täglich Kontakt über ein deutsches Typographen-Forum. Aus diesem Grund kenne ich auch seine Einstellung zu diesem Thema.</p>
      <p>Ihr genanntes Beispiel zeigt eindeutig, daß Hitler die Fraktur ablehnt. Eben weil er sich stattdessen im Beispiel für die Futura entscheidet. Aber das bedeutet doch nicht, daß die Futura seine Lieblingsschrift ist.</p>
      <p>If you ask me which font I like more:<br>
      Univers or Folio-Grotesk (I don't like both) I'ld say: Folio.<br>
