      <p>Lieber Georg — Haben Sie den Artikel gelesen? Ich nehme an Sie verstehen ja besser Deutsch als ich. Bitte keine Schlauheiten, besonders wenn Sie sich nicht mal die Mühe nehmen zu prüfen entweder was Sie verkündigen richtig sei.</p>
      <p>&gt; There is not one sentence in the article about Paul Renner.</p>
      <p><cite>Daß Hitler die gebrochenen Schriften nicht mochte, zeigt Luidl an einem Beispiel: ein Wettbewerb für einen Urkunden-Entwurf. <strong>Hitler entscheidet sich für die Futura</strong>, eine serifenlose, moderne Schrift. Luidl führt dazu nichts weiter aus, dabei ist diese Geschichte hochinteressant und unterstreicht Hitlers modernen Geschmack. Die Futura war 1928 unter den Händen <strong>Paul Renner</strong>s entstanden mit dem etwas absurden Anspruch, die Schrift dieser Zeit zu sein. […] Hitlers Leute, so Luidl, nannten <strong>Renner</strong> einen Kulturbolschewisten, machten da also keinen Unterschied, weil sie eigentlich der Fraktur anhingen. Hitler selbst differenzierte gewiß unbewußt zwischen <strong>Renner</strong> und Bauhaus, <strong>wenn er die Futura anderen Schriften vorzog</strong> und gegen das Bauhaus wetterte</cite></p>
      <p>SS. 2–3</p>
