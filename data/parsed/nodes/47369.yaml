    <p>Hi all,</p>
    <p>I'm trying to know, what diacritics are frequently used in the small caps accented characters. Can i use the same of the lowercase or the uppercase? Or is it usually necessary to draw specific small caps diacritics?</p>
    <p>Also, what glyph name/unicode value, refers to uppercase diacritics? I've opened some pro otf fonts and it looks like the name changes from font to font, but isn't the unicode value need to be universal?</p>
    <p>Regards</p>
