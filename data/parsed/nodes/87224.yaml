    html: |-
      <p>I wouldn't use the term 'fancy' to characterize Centaur. 'Fancy' connotes, at least for me, ornament or excess. There's great attention to form in Centaur - which happens to be old-style form -, as there is also in Optima, Frutiger, Futura, Gill Sans, Hans Eduard Meier's faces, etc., etc. The design of Centaur is in its way, spare - it has a sufficiency, not a superfluity.</p>
      <p>You might call Brioso fancy, though, or at least busy (in comparison, Centaur is stately). Ditto for Arno.</p>
    html_clean: |-
