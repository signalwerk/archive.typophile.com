    <p>What's the fanciest &amp; most elegant serif font you know of? I know this is kind of a subjective question, I'd just like your opinion. I'd also like it as an idea for one of my own fonts.<br>
    Right now I use Minion, Calluna, or Fontin for writing papers, but I wouldn't call them the fanciest fonts I know of. So far I think the fanciest one I've seen is Espinosa Nova.</p>
    <p>Thanks,<br>
    truth14ful</p>
