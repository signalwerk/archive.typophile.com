    html: |-
      <p>Interesting, as fancy could mean in a way "done in an elaborate way", or as well "having a flair of luxury".<br>
      For the first category the typeface would need to be rich in details, for the second it needs to have a certain feel to it. So of the sake of discussion I think you need to clarify <em>your</em> definition of fancy. </p>
      <p>While for example Jenson does have a lot of details, for some of a general public Bodoni in bold and all caps might read "fancy", as we know it from the Vogue cover. </p>
      <p>To answer with my personal feel, I consider Cycles, by Sumner Stone, as fancy. Following that are Andron, Arno, Williams Caslon,  Dante and Sabon. Interesting enough, they are old old style fonts, but I guess that is my thing. However I am not in a type/graphic profession.</p>
