    <p>I am working on a project about the typeface Garamond.  It's history, different, versions, and uses today.  I was wondering if any one has good examples of products, companies, or anything else that used any version of Garamond both contemporary and all the way back through history to its orgin with Claude Garamond/Jean Jannon.  Specific examples of Adobe Garamond in use today would be really helpful as well.</p>
    <p>Also any good books/sites people know about for information about Claude Garamond or any versions of Garamond would be awesome.  Thanks for the help.</p>
