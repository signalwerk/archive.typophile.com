      <p>ITC Garamond was really hot for identities in the 1990s, you can find plenty of old images of Apple stuff that used it in old design annuals. </p>
      <p>OSHA uses Sabon in it’s identity. I know this because the people behind that awful identity did a book about their identity programs, and made a big point out of switching OSHA from ITC Garamond to Sabon. It’s sort of good for a laugh, I guess.</p>
