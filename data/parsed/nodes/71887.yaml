      <p>Glad you appreciate the critique, Jean Paul.<br>
      You're right, the "non-grid" layout and nicely spaced and placed typography will position the poster well against competing media.<br>
      Style, executed with taste, can be very effective.<br>
      And there is something celebratory about the "explosive" layout, like a confetti canon (at a sports event--why don't they do that at arts awards!).<br>
      Nonetheless, I still think that if you could find an image or concept that was on track (there's always champagne), it would give a stronger purpose to the piece, and if not, perhaps drop the image or make it totally abstract, pure style.</p>
