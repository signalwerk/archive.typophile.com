      <p>The design stands out, but in the way a madman does. Nick is right about the lack of purpose, and that lack of purpose becomes a real problem when you have poorly ragged, all caps, letterspaced type set solid and then below it Zapfino is radiating out into space. Without a driving idea it has nothing to makes me want to read it, byut some of the typographic gimmickry really makes me want to look away.</p>
      <p><cite>As for the messy layout, would the overal design benefit from more background structure (like gradients, shading and lines) or would it make just more messy?</cite></p>
      <p>Anything you add will be more mess. Turn the volume down first.</p>
      <p><cite>To stand out of these atrocities to the human eye, I am looking for something 'je ne sais quoi' (that being a problem in itself), something 'different'.</cite></p>
      <p>You’re trying to achieve this by creating your own sort of atrocity on the other end of the spectrum. Try looking for ground closer to the middle.</p>
