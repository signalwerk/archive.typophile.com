    <p>This is a poster (A3 landscape) design for a local platform which encourages culture and arts. Every two years they award two foundations, associations, persons or companies for their contribution in local arts and culture.<br>
    The brief was to design a poster which needs to stand out amongst other posters in pubs, council buildings et cetera.</p>
    <p>Any critique anyone?</p>
