      <p>Despite the messy layout, which is the cliché for "art", this seems off target.<br>
      Unless sports are considered cultural, or the prize really is the trophy, the image -- raising a trophy -- is wrong, as it signifies sport, not art.<br>
      It doesn't relate to the text, having nothing to do with voting, as sports are determined by scores, not votes.</p>
      <p>Sure, it's a metaphor, but it's not been fleshed out, nor handled with any wit.<br>
      In fact, it looks like you're apologizing for the metaphor, by making it blurry, hoping viewers won't notice it's wrong.</p>
      <p>Further to the unstructured layout, this is a lazy and decorative way to say "art", in lieu of a strong idea rendered simply and directly.</p>
