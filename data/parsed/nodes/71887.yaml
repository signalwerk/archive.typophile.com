    html: '<p>I have to agree with James and Nick. I think that this is too messy, and there is too much going on, with too little contrast and hierarchy. Remember this is a poster, not a booklet. Trz to limit the text to the essential, and make a clear hierarchy of importance. This must not neccesarily become a gridded poster, but try to make the poster feel more logical, less incidental. About the colour scheme: to my eyes it feels too... stuffy somehow, not very fresh, and I think in low contrast environments it might not stand out as much as you might want. See the grey version attached to understand what I mean. Also try to tune down the type, there is too much going on and it does not help communicate. The headline is a bit too quirky to my taste, with letters jumping up and down from the baseline in order to make them stick... It all reminds me a bit of emigré, in an anarchistic kind of way, but not quite there yet in terms of quality. I"ll give you one thing though: it does not look ordinary.</p><div class="imageWrap"><img src="http://typophile.com/files/grey_6616.png"></div><p></p>'
