    html: |-
      <p>CFF rendering on Windows is generally pathetic if applications are relying on the system for rendering. If you were to use Adobe's Creative Suite applications, I'm sure you would not be seeing the same issues. Also, if the final electronic copy will be in PDF format, it is doubtful that you will face the rendering problems you are seeing in OpenOffice (depending on what reader application you are using and how it handles CFF rendering).</p>
      <p>For full disclosure I am an Adobe employee. However, I have tried to objectively characterize the problem as I see it (even if 'pathetic' might seem too emotive).</p>
