    <p>I've decided upon the classic Minion Pro for my PhD thesis (human geography / cultural studies).</p>
    <p>However, it seems that Minion Pro is a pain to read on screen at 11pt<br>
    (I'm writing the thesis using OpenOffice, but it's the same in MS Word or Acrobat Professional and even the windows font preview)<br>
    Alignments and spacings are really off (the dots on the i appear between the letters, the first arc of the m is half the width of the second and the r huddles up against the next character, and so on...)</p>
    <p>I can, of course, use a different font for writing (I'm currently using DejaVu for screen readability) but I'm required to submit both a paper and electronic copy of the thesis. (And I imagine my examiners may be reading the electronic version)</p>
    <p>Is my experience of Minion Pro &amp; screen reading a common problem, or is something wrong with my screen / font setup?</p>
    <p>If it is a common problem, is there a decent screen-readable Minion version available? Or any suggestions for a similar font which is readable on-screen?</p>
    <p>(I'm loathe to use completely different typefaces for both versions of the thesis, because of the extra editing that will inevitably entail...)</p>
