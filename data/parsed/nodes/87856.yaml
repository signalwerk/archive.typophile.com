    html: |-
      <p>My thesis will also turn up in Minion, eventually. The rendering of Adobe fonts in Windows is generally terrible; it's not just you. It seems more unusual, though, that it's also happening in Adobe Reader. You're not, perhaps, using Microsoft's PDF exporter for Word, are you? It will export the page as an image rather than type, with generally disastrous results.</p>
      <p>LaTeX still seems to be the cool software for writing a thesis, but I really think that it's simply too complicated for most people. For better typography, then, my plan is to write the thing in Word and import the files into InDesign for final submission. Perhaps this is overkill, but I'm somewhat addicted to real small caps.</p>
