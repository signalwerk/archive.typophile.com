  html: "<p>Typophiles,  <br> <br>We are proud to announce the reopening of the Typophile Forums. Thanks to some generous contributors, we have upgraded the board, and now you can enjoy dozens of new features in a frameless environment! Thanks for bearing with us while we worked to get the new code in place.  <br> <br>A few of the new features include: <br> <br>_ Enhanced Email Capabilities : Now you can read *and* post to the board remotely. Talk typography from the comfort of your Inbox, without ever having to visit the board! <br> <br>_ New Architecture : We've reorganized the Forums architecture, and you'll find more focused discussions to support you throughout the typeface design/development cycle. <br> <br>_ New Forums : Whether it be Bitmaps, Blondes, or Boise Typographers, carve out your own niche in the Typophile Community by starting and moderating your own sub-community in our new Special Interest Groups.  <br> <br>_ Members Forums : Exclusive forums for Typophile contributors! <br> <br>_ Enhanced User Profiles : Send and receive private messages from other board users! Add a personalized 60 x 60 icon next to your posts. <br> <br>_ Build Critique : If you thought the Typophile Critique was good, now you can download live font betas, posted by your peers. This secure environment will help those of you who are ready to take your work to the next level.  <br> <br>_ Automated Password Recovery : If it's been a while since you've joined us, now you can easily get back into the swing of things. <br> <br>As we celebrate our third year, we are now host to hundreds of thousands of regular visitors, and millions of hits a month. If you've enjoyed Typophile over the last couple of years, here's your chance to give a little back. Support Typophile by signing up for a membership, and we'll unlock the doors to exclusive areas of the Forums and give you some cool Thank You gifts, including the 2003 Typophile Tee! Your contributions will help us cover our bandwidth bills and enhance the site with better features and collaborative tools. <br> <br>For a complete breakdown on Typophile Memberships, please see: <br><a href=\"http://www.typophile.com/needs/your/support/\" target=\"_blank\">http://www.typophile.com/needs/your/support/</a> <br> <br>We'll look forward to seeing you in the Forums! <br> <br>Jared and Joe <br>Typophile</p>"
