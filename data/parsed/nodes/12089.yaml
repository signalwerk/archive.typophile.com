    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a>: <a href="/wiki/Foundries" class="freelinking" rel="nofollow">Foundries</a>: Image Club</strong></p>
    <p>Image Club Graphics was founded in Calgary, Alberta, Canada in 1985 by <a href="/wiki/Greg%20Kolodziejzyk" class="freelinking" rel="nofollow">Greg Kolodziejzyk</a>, and used direct marketing to sell fonts, clip art, and photos for desktop publishing.</p>
    <p>In 1991, Image Club developed their own <a href="/wiki/PostScript" class="freelinking" rel="nofollow">PostScript</a> to <a href="/wiki/TrueType" class="freelinking" rel="nofollow">TrueType</a> conversion utility called <a href="/wiki/Evolution" class="freelinking" rel="nofollow">Evolution</a> and used it to move their entire library to the new font format.</p>
    <p>In 1994 the company was aquired by Aldus Corporation, which in turn merged later that year into Adobe Systems of California.</p>
    <p>In 1998 Adobe rebranded Image Club as <a href="/wiki/Adobe%20Studios" class="freelinking" rel="nofollow">Adobe Studios</a>, which subsequently became the independant <a href="/wiki/EyeWire" class="freelinking" rel="nofollow">EyeWire</a> after a management buyout. In 1999, EyeWire was acquired by Getty Images and later absorbed into the realm of the mothership. Finally in 2003 the Image Club library along with the EyeWire domain name was acquired by Fonts.com, who are now the exclusive distributors for the fonts. The Image Club clip art collection, as well as the remaining vestiges of the EyeWire stock imagery line, is still owned and distributed by Getty Images through various third party resellers.</p>
    <p><a href="/wiki/Grant%20Hutchinson" class="freelinking" rel="nofollow">Grant Hutchinson</a> was one of many designers who created original typeface designs for the Image Club library. Others included <a href="/wiki/Patricia%20Lillie" class="freelinking" rel="nofollow">Patricia Lillie</a>, <a href="/wiki/Jean%20McAllister" class="freelinking" rel="nofollow">Jean McAllister</a>, <a href="/wiki/Laurie%20McCanna" class="freelinking" rel="nofollow">Laurie McCanna</a>, <a href="/wiki/Cathy%20Larson" class="freelinking" rel="nofollow">Cathy Larson</a>, <a href="/wiki/Ty%20Semaka" class="freelinking" rel="nofollow">Ty Semaka</a>, <a href="/wiki/Calvin%20Glenn" class="freelinking" rel="nofollow">Calvin Glenn</a>, <a href="/wiki/Dean%20Stanton" class="freelinking" rel="nofollow">Dean Stanton</a>, <a href="/wiki/Noel%20Rubin" class="freelinking" rel="nofollow">Noel Rubin</a>, <a href="/wiki/Michael%20Allard" class="freelinking" rel="nofollow">Michael Allard</a>, and <a href="/wiki/Lorne%20Maclean" class="freelinking" rel="nofollow">Lorne Maclean</a>.</p>
    <p>Comment: <cite>"I lived through all these changes... wish Image Club would still be around."</cite></p>
    <p>Grant replies: <cite>"It was a wild ride, to be sure. Image Club lives on... in my basement, on my hard drives, and at <a href="http://www.imageclub.org/" rel="nofollow">this site</a> - which will eventually become a historical document of the company and the people who worked there."</cite></p>
