    <p>Hi,</p>
    <p>Apologies if this question has been asked before, I tried searching but could not seem to find any relevant threads...</p>
    <p>I'm not sure if this is necessarily a hinting question or not, but I did not know how else to describe it...</p>
    <p>I have created a typeface in fontlab and exported it as a ttf without any hinting as I just wanted to use the font at large sizes in print. However, when I have been using the font in Illustrator and InDesign there is a very fine line from the font being legible on screen to it previewing strangely (see pic).<br>
    At first i thought it was just because I hadn't hinted the font, but then I noticed that in fontbook I can view it at quite a small size.</p>
    <p>I was wondering if there might be some simple way to fix this when exporting in fontlab,<br>
    I tried autohinting but this did not seem to make a difference. I have created other fonts without hinting them that have worked fine, so was just a little curious as to why it was happening this time.</p>
    <p>Again, sorry if this question has been asked a thousand times, if it has and someone could direct me to another thread I would greatly appreciate your help. </p>
    <p>Cheers,<br>
    Adam</p><div class="imageWrap"><img src="http://typophile.com/files/screenpreview_6157.gif"></div><p></p>
