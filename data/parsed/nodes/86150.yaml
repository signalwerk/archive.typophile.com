      <p>Adam, there are several kinds of font caches. Maybe you have only cleared the system and user related ones. To clear the Adobe fontcaches use the app I recommended (Onyx) or follow the instructions in this doc under item 10:</p>
      <p><a href="http://kb2.adobe.com/cps/327/327791.html" title="http://kb2.adobe.com/cps/327/327791.html">http://kb2.adobe.com/cps/327/327791.html</a></p>
