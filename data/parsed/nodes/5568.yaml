  html: "<p>I've been helping to beta test a new free font manager with some unique features - such as saving and restoring \"snapshots\" of your font folder, managing fonts, and \"defrenzying\" your fonts folder back to Windows defaults for when you need maximim speed and performance from your computer. <br> <br>This is not a commercial program and no money is being, or will be made, from it. <br> <br>If you'd like to check it out, you can find it at: <br> <br><a href=\"http://www.fontfrenzy.org\" target=\"_blank\">http://www.fontfrenzy.org</a> <br> <br>We'd greatly appreciate any feedback. <br> <br>--mjf</p>"
