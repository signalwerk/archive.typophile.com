    html: |-
      <p>The other one is Rotis Semi Serif Black Schoolbook with the alternate Venetian ‘e’.</p>
      <p>No, seriously: this looks rather like an unbalanced homebrew mix of a number of different typefaces. Some characters/terminals suggest it might have started out with Rotis in mind once, cf. its <a href="https://web.archive.org/web/20120505163019/http://www.fontshop.com/fonts/singles/creative_alliance/rotis_semi_serif_by_adobe_std_65_bold/&amp;sample_text=Consolidatemydebt.co.uk" rel="nofollow">Semi Serif Bold</a> (there is no Rotis Black, and of course no ‘Schoolbook’ style with single-storey ‘a’ either).</p>
      <p>For a lusty semi-serif, have a look at <a href="https://web.archive.org/web/20120505163019/http://www.stormtype.com/typefaces-fonts-shop/typefaces-45-areplos-text-pro-bold" rel="nofollow">Areplos</a> by <a href="/web/20120505163019/http://typophile.com/wiki/Jan%20Solpera" class="freelinking" rel="nofollow">Jan Solpera</a>.</p>
    html_clean: |-
      <p>The other one is Rotis Semi Serif Black Schoolbook with the alternate Venetian ‘e’.</p>
      <p>No, seriously: this looks rather like an unbalanced homebrew mix of a number of different typefaces. Some characters/terminals suggest it might have started out with Rotis in mind once, cf. its <a href="https://web.archive.org/web/20120505163019/http://www.fontshop.com/fonts/singles/creative_alliance/rotis_semi_serif_by_adobe_std_65_bold/&amp;sample_text=Consolidatemydebt.co.uk" rel="nofollow" class="link-external">Semi Serif Bold</a> (there is no Rotis Black, and of course no ‘Schoolbook’ style with single-storey ‘a’ either).</p>
