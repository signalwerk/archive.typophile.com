    html: <p>... unless the font didn’t consist of cubic bezier curves in the first place. TrueType outlines (quadratic bezier curves) are converted to cubic beziers, which Illustrator isn’t particularly good at. So expanding TrueType fonts will insert additional points on the curves.</p>
