    html: <p><cite>Læsebillede</cite> literally means <cite>reading image</cite> , here in the meaning <cite>reading metaphor</cite>. As far as I can see (from it's other uses), <cite>læsebillede</cite> refers to a specific reading situation or context (including the reading material), so it could be translated to <cite>readability</cite> (as opposed to legibility).</p>
