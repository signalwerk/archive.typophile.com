    <p>Sorry for the off-topic post.  I think the term has something to do with typography, but I can't be sure as I don't understand it :)</p>
    <p>It appears in this sentence about bad dictionary layout:</p>
    <p><em>Vores egen erfaring er, at der findes ordbøger af høj kvalitet, som har et så uroligt <strong>læsebillede</strong> og en så lille skrift, at brugen er vanskeliggjort.</em></p>
    <p>which comes from this paper: <a href="http://netordbogen.asb.dk/Lit/Hermes/H04_02.pdf" title="http://netordbogen.asb.dk/Lit/Hermes/H04_02.pdf">http://netordbogen.asb.dk/Lit/Hermes/H04_02.pdf</a></p>
    <p>I can see that it comes from "read" and "picture" but beyond that I can't make heads or tails of it.  If anyone could explain what it means, I'd be much obliged.</p>
