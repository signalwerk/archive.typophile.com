    <p>Greater Albion Typefounbders has just launched <a class="freelinking external" href="http://new.myfonts.com/fonts/gatf/birmingham-new-street/ " rel="nofollow"> Birmingham New Street</a> on Myfonts.com.</p>
    <p>Birmingham New Street is the latest updated development of a typeface family inspired by the hand lettered title on a 19th century railway map. The map, prepared by the London and North Western Railway was headed "Birmingham and environs". New Street, meanwhile is the great 19th century commercial road linking the city centre of Birmingham with the train station of the same name.  So, in a spirit of 19th century enterprise, we present "Birmingham New Street", a fun family of three display faces, laden with open type features and late Victorian charm, ideal for posters, book covers and any other high flown design you might have in mind.</p>
