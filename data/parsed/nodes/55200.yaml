  html: |-
    <p>Greater Albion Typefounders have just released four new faces on <a class="freelinking external" href="http://new.myfonts.com/foundry/gatf/" rel="nofollow">Myfonts.com</a>.  These are:</p>
    <li>Sabinard, a distinctive modern Swash face;
    </li><li>Coronard, A hybrid face with Blackletter astetics but Roman forms;
    </li><li>Easter Fleurons, just as the name says, ornmaments for Easter; and
    </li><li>Chapter Initials, Simple and Elegant initial caps, designed to compliment our Vertirna family.
    <p>Pop over to <a class="freelinking external" href="http://new.myfonts.com/foundry/gatf/" rel="nofollow">Myfonts.com</a> and have a look.  All feedback gratefully received.</p>
    </li>
