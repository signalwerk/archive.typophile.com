    html: |-
      <p>I think you can fix this by defining several lookup tables in the calt feature and specifying the useExtension keyword in each of the lookups.<br>
      Something like this:</p>
      <p><code><br>
      feature calt { # Alternates<br>
        lookup calt_1 useExtension {<br>
      	  ...<br>
        } calt_1;<br>
        lookup calt_2 useExtension {<br>
      	  ...<br>
        } calt_2;<br>
        lookup calt_3 useExtension {<br>
      	  ...<br>
        } calt_3;<br>
      } calt;<br>
      </code></p>
      <p>Johnych</p>
