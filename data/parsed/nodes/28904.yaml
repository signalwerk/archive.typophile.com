      <p>I've become far more aware of waging integrated and innovative brand campaigns after just a couple of months of working at a large ad agency.</p>
      <p>Finding effective creative, clever, humorous and enlightening ways of promoting products, services and brands to the mass public or target audiences seem more prevalent than ever before.</p>
      <p>The "above-the-board" approaches I'm basically fine with. It's these newer alternate/stealth methods that I fine intrusive, offensive and sometimes downright underhanded!</p>
