  html: <p>So, what do you guys thing of making fonts based on a centerline, as opposed to a baseline? <br> <br><a href="http://briem.ismennt.is/2/2.3.2a/2.3.2.04.grid.htm" target="_top">http://briem.ismennt.is/2/2.3.2a/2.3.2.04.grid.htm</a> <br> <br>For a decorative joined script like Mistral it might be more obvious to do so, but I actually think there's a lot of other potential in using a centerline. The Ancient Greeks for one used the centerline method - and here it's interesting to note that Carter's Skia has some "centered-ness" to it. <br> <br>hhp</p>
  html_clean: <p>So, what do you guys thing of making fonts based on a centerline, as opposed to a baseline? <br> <br><a href="http://briem.ismennt.is/2/2.3.2a/2.3.2.04.grid.htm" target="_top" class="link-external">http://briem.ismennt.is/2/2.3.2a/2.3.2.04.grid.htm</a> <br> <br>For a decorative joined script like Mistral it might be more obvious to do so, but I actually think there's a lot of other potential in using a centerline. The Ancient Greeks for one used the centerline method - and here it's interesting to note that Carter's Skia has some "centered-ness" to it. <br> <br>hhp</p>
