    html: <p> There are some basic ideas that I apply to adjusting the distance from the baseline in relation to the entire typeface. <br> <br>In the old days, I used to move all the characters together in one long string and select all and align vertically. Where I found an oddball, I'd just move it up or down. <br> <br>As I played more with this technique, I'd move all the characters together in one long string and manually position them up or down to see which shapes filled the counters of other shapes well. <br> <br>The next evolution was discovering which letters seemed to affect the "bounce" but showed up consistently enough in the typeface as I set copy with it. To no surprise, it was the vowels. <br> <br>Once I had a good understanding how to adjust the bounce of the font, I began working through each glyph in the typeface to exaggerate the bounce even further by making some letters taller, some smaller, raise the stems on some, lower the stems on others, and repositioning each glyph to further exaggerate the face while creating a consistent flow and color with the counters. <br> <br>At some point, by studying more animated styles, it became second nature to start my initial glyph drawings with a bounce in mind. The left and right sides were often looked at closely to see how they may interact with the rest of the face and often readjusted several times throughout the construction of the face. <br> <br>Stuart :D </p>
