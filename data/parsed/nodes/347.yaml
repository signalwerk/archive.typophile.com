    html: <p>Hey Hrant, <br> <br>I've designed many a font that are aligned on a centerline but bumped down to where they should sit on a baseline to set well. <br> <br>For playful display faces, considered animated or bouncing on a baseline. Each character is designed to play off the counter of the the next one. I think Randumhouse by House really is the king of this technique. <br> <br>For as nice as you can make a display face on a besline, by altering the baseline position, it is able to bring another level to the font. A certain planned randumness. This technique works especially well for script or connecting faces but works for serif or sans serif versions. <br> <br>There is a site called <a href="http://www.pixeldecor.com/" target="_top">Pixel Decor</a> that uses my Pink Flamingo typeface. This will offer some example of a serifed face looks in centerline use. My <a href="http://www.fontdiner.com/fdtdfont04.gif" target="_top">Spaceman font</a> does the same but the letters are cleaner. <br> <br>Stuart :D</p>
