  html: "<p>Colleagues,  <br> <br>I just successfully used British Library's secure electronic delivery document service to get a copy of Maxim Zhukov's article \"The peculiarities of Cyrillic letterforms\". The article came in secure PDF format per e-mail, 5 days after I ordered it. It cost me approx. 20 USD altogether, which included a copyright fee. The quality of the scan isn't amazing but is adequate. And the speed really was impressive!  <br> <br>Excellent service indeed! It's:  <br><a href=\"http://www.bl.uk/services/document/sed.html\" target=\"_blank\">http://www.bl.uk/services/document/sed.html</a> <br> <br>Regards,  <br>Adam</p>"
