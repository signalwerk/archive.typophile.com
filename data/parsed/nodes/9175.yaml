    html: <p>I doubt any single cent. But if Typography Papers issue 1 were ever reprinted, I doubt Maxim would get additional renumeration.  <br> <br>Actually, it ended up being a bit more than $20. Precisely speaking, it was 15 GBP. That included a 5 GBP "copyright fee" and a 10 GBP handling fee. I don't know what the British Library does with the 5 GBP copyright fee but my guess is that it goes to the collective copyright organizations.  <br> <br>Anyway, since this electronic document delivery mechanism is offered by the British Library, I presume that it's legal and OK with the copyright. If anybody doesn't like the UK copyright system, he's free to submit a petition to the British parliament <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0">  <br> <br>But I doubt it would ever be changed. The libraries in most European countries allow copying of articles and even entire books -- but it's usually a paid and not very cheap service. In German copyright law, sharing single copies with people I know is also legal (an equivalent of the "fair use").  <br> <br>No matter how loud an author may cry -- if something is published, the author does not have absolute and complete control over all copies of his work. Continental copyright provides very strong protection but also provides a balance between the consumer's and the author's rights. The service of the British Library seems to fit into this balance. It's comparatively expensive (a few pages per BL delivery costs as much as the entire copy of the publication in print) but for out-of-print publications such as the Typography Papers issue 1, services like that are often the only way to get a copy.  <br> <br>Adam</p>
