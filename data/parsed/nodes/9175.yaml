    date: null
    date_raw: null
    votes: null
    html: <p>As I have said in the other thread on Maxim's article, TP1 was typeset in 95 on a conventional film-based workflow. To produce PDF deliverables from ten-year old source files is not trivial. We are a small Department and all [overworked] staff have substantial commitments, so this is not the highest priority. I am sure there may be ways to resource and manage such a project, but I can't see anybody's agenda lightening significantly in the next couple of years. I agree wholeheartedly it would be beneficial to a good number of people, and I would like nothing more than contributors to make some money out of their IP, but I just don't see it happening anytime soon for the early TP content. <br> <br>I'f it's any consolation, later issues have been produced on a CTP-based PDF workflow.</p>
    html_clean: <p>As I have said in the other thread on Maxim's article, TP1 was typeset in 95 on a conventional film-based workflow. To produce PDF deliverables from ten-year old source files is not trivial. We are a small Department and all [overworked] staff have substantial commitments, so this is not the highest priority. I am sure there may be ways to resource and manage such a project, but I can't see anybody's agenda lightening significantly in the next couple of years. I agree wholeheartedly it would be beneficial to a good number of people, and I would like nothing more than contributors to make some money out of their IP, but I just don't see it happening anytime soon for the early TP content. <br> <br>I'f it's any consolation, later issues have been produced on a CTP-based PDF workflow.</p>
