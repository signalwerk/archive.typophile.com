    html: "<p>What about brute-forcing it with hi-res scanning? Plus there's always OCR. And you could still make a PDF, and even put it on CD* and sell it. And if you're short of manpower to do that, you could outsource the job (maybe even including [one-off] replication and delivery), and give a cut of the sales as payment, maybe with a small upfront payment too and/or a free perpetual subscription, hopefully including back issues... (Yes, this <i>is</i> all a big, fat hint. :-) <br> <br>* BTW, I recently got a nice gift: a CD of the book \"Front Page\" (a collection of LA Times front pages spanning 1881-2003), which is basically a 262Mb PDF of scans, but it also includes [the visible part of] one article from each cover as a actual text. All with a simple VB interface - nicely done. <br> <br>hhp</p>"
