    html: |-
      <p>Yes Mercury Script is close.<br>
      The same designer Emil Karl Bertell recently released a similar font, _Carpenter Script_ <a href="http://www.myfonts.com/fonts/fenotype/the-carpenter/" title="http://www.myfonts.com/fonts/fenotype/the-carpenter/">http://www.myfonts.com/fonts/fenotype/the-carpenter/</a> that could be used to duplicate the letters. Note that _Carpenter Script_ has: 1.  An alternate _I_ that is almost identical to the sample. 2. An alternate _k_ with an upper loop similar to the sample. 3. An alternate _f_ that is almost identical to the sample. 4. An alternate _a_ that is is almost identical to the sample. 5. An alternate _t_ with the cross stroke extended backwards. Slope the phrase less than 5 degrees right and _Carpenter Script_ looks like a match, with almost no editing required.<br>
      Don</p>
