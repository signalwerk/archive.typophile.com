      <p>This resembles Sudtipos <a class="freelinking external" href="http://www.myfonts.com/fonts/sudtipos/buffet-script/?refby=bowfin" rel="nofollow">Buffet</a>, which is based on the work of Alf Becker. I could not find another similar Becker interpretation, but this font has many alternates and might be similar enough if the matching font does not turn up.</p>
      <p>- Mike Yanega</p>
