      <p><a class="freelinking external" href="http://www.moorstation.org/typoasis/designers/steffmann/index.htm" rel="nofollow">Dieter Steffmann</a> is one person who has revived many of these vintage ornamental typefaces. Sometimes he changes their names, and his page doesn't display them in an overview. Dan Solo of Solotype has also revived many in digital form in recent years, but not sure about this particular typeface. A somewhat similar type is <a class="freelinking external" href="http://www.moorstation.org/typoasis/designers/rakowski/dr5/davy_f5.htm" rel="nofollow">Showboat</a>, which is an alias name I'd guess.</p>
      <p>- Mike Yanega</p>
