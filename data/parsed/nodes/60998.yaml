    <p>Hi all. I suppose this is the correct place to place this question....but I was trying to find:</p>
    <p>a) what type is Extra Ornamental No. 2 by House of Lime based off?? I'm looking for a the face without the degradation/ flourishes...just the plain letterforms.<br>
    b) any similar faces that have the same feel??</p>
    <p>Thanks for any suggestions + comments!</p>
    <p>L</p>
    <p><a href="http://www.houseoflime.com/fonts/extraornamental.htm" title="http://www.houseoflime.com/fonts/extraornamental.htm">http://www.houseoflime.com/fonts/extraornamental.htm</a></p>
