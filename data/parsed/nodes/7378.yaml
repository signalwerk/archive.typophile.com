    html: <p>I would say it is more or less in the Caslon vein, but idiosyncratically executed by the artist. The R is the most unusual departure. I can only think of a few typefaces with an R like this (<a href="http://www.myfonts.com/fonts/linotype/itc-bodoni-twelve/bodoni-twelve-itc-bold/testdrive.html?s=APPLE%a0COMPUTER&amp;p=48" target="_blank">ITC Bodoni</a>, for instance). The C is also a bit exaggerated.</p>
