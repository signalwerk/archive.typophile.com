  - id: 69466
    user: 804
    date: 2002-04-12T08:50:00
    date_raw: 12 April 2002 - 8:50am
    votes: null
    html: <p> Try opening up the majority of the freeware fonts in fontographer and you will ﬁnd less than 75 characters, incomplete designs, variations in stroke, obvious low quality auto tracing used every where, extra useless points, multiple elements that should have been knocked out and were not, lack of good interpolation, inconsistant weights, Obliques were true italics would have been preferred, poor hinting, software kerning at best if any and wonder how these fonts would actually pass pre-press on any commercial job. I have worked in environments where these types of fonts were prohibited for use, because they end up costing loss of revenue as jobs get out-put on ﬁlm with currupted elements. You generally get what you pay&nbsp;for. </p>
