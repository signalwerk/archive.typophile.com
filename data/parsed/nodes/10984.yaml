    date: 2002-04-12T06:50:00
    votes: null
    html: <p> Try opening up the majority of the freeware fonts in fontographer and you will find less than 75 characters, incomplete designs, variations in stroke, obvious low quality auto tracing used every where, extra useless points, multiple elements that should have been knocked out and were not, lack of good interpolation, inconsistant weights, Obliques were true italics would have been preferred, poor hinting, software kerning at best if any and wonder how these fonts would actually pass pre-press on any commercial job. I have worked in environments where these types of fonts were prohibited for use, because they end up costing loss of revenue as jobs get out-put on film with currupted elements. You generally get what you pay for. </p>
