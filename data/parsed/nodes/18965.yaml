  html: |-
    <p>Tracy's <em>Letters of credit</em>, last page, brings up Francis Meynell's <strong>Nonesuch Plantin</strong> typeface; a short and superficial research shows it was a proprietary font for the Nonesuch press. The only book that seems to sport this exclusive little font seems to be <em>The History of Herodotus of Halicarnassus</em> from 1935 that fetches three-digit prices with book feti -- erm, collectors.</p>
    <p>Does anyone happen to have this book or any other that might use Nonesuch Plantin or a reproduction of some sort? A photo of a specimen or a xerox of a page of that book? I am too curious in which way it differs from the good ole Monotype Plantin 110.</p>
    <p>Anyone?</p>
    <p>Thanks<br>
    Kai</p>
