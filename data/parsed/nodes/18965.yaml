      <p>I just checked, and Monotype did indeed -eventually- have<br>
      a long-extender version of Plantin. I found a sample (but<br>
      not a very good one) in Harold Berliner's compilation of<br>
      classic Monotype text faces, but I'm sure it's possible to<br>
      find a much better sample without much difficulty.</p>
      <p>Anyway, if it matters/helps, the "long" Plantin<br>
      seems to have its extenders about 50% longer/deeper.</p>
      <p>hhp</p>
