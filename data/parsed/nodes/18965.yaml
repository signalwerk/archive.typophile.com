      <p>Kai, the Clark Library over here has that book*. But: it's closed until October; you can't check anything out; and they don't allow scans... But you could probably pull off some digital photography. Plannig a SoCal trip?  :-)</p>
      <p>* BTW, UCLA has that title published in 1958 and 1962; and interestingly enough the translator was Harry Carter! Dunno if those are any use to you.</p>
      <p>BTW, didn't Monotype end up making a long-extender Plantin (too)?<br>
      I know I've seen it somewhere. Unless it was in Tracy...  :-/</p>
