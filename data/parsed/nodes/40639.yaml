    <p>I came across this terrific game on another forum I frequent. Here's the procedure as given <a class="freelinking external" href="http://forums.xkcd.com/viewtopic.php?f=14&amp;t=16834&amp;start=0" rel="nofollow">there</a>:</p>
    <p>1 - Go to wikipedia. Hit "random".<br>
    <a class="freelinking external" href="http://en.wikipedia.org/wiki/Special:Random" rel="nofollow">http://en.wikipedia.org/wiki/Special:Random</a><br>
    The first random wikipedia article you get is the name of your band.</p>
    <p>2 - Go to Random quotations:<br>
    <a class="freelinking external" href="http://www.quotationspage.com/random.php3" rel="nofollow">http://www.quotationspage.com/random.php3</a><br>
    The last four or five words of the very last quote of the page is the title of your first album.</p>
    <p>3 - Go to flickr and click on "explore the last seven days"<br>
    <a class="freelinking external" href="http://www.flickr.com/explore/interesting/7days/" rel="nofollow">http://www.flickr.com/explore/interesting/7days/</a><br>
    Third picture, no matter what it is ((SFW of course)), will be your album cover.</p>
    <p>4 - Use photoshop or similar to mix it all up. Host it and bring it here.</p>
    <p>I bet you all can come up with some spectacular ones. Here are a few that I've already done:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Untitled_4571.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/New Freedom_6079.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/WRONG_3637.png"></div><p></p>
