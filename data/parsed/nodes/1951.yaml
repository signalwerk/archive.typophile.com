    html: "<p><i>John, how the hell can you stand looking at 1600x1200 on a 15 inch screen?!</i> <br> <br>It's the native resolution of the device. It's fine for most things, because most of the applications I use have scaleable menus, etc. The palettes in InDesign are a bit tiny because they don't scale, but it does mean that my actual work space is nice and big. Windows itself lets me set global preferences for icon and UI font sizes, and most apps use these. <br> <br>The only thing that really bugs me are website designers who specify type in fixed pixel sizes: a failure to understand the nature of the medium for which one is designing. CSS was specifically designed so that entire websites could made dynamically scaleable, but how many web designers do this? <br> <br>ClearType also helps things a lot, even the new tiny type in the Typophile forums.</p>"
    html_clean: "<p><i>John, how the hell can you stand looking at 1600x1200 on a 15 inch screen?!</i> <br> <br>It's the native resolution of the device. It's fine for most things, because most of the applications I use have scaleable menus, etc. The palettes in InDesign are a bit tiny because they don't scale, but it does mean that my actual work space is nice and big. Windows itself lets me set global preferences for icon and UI font sizes, and most apps use these. <br> <br>The only thing that really bugs me are website designers who specify type in fixed pixel sizes: a failure to understand the nature of the medium for which one is designing. CSS was specifically designed so that entire websites could made dynamically scaleable, but how many web designers do this? <br> <br>ClearType also helps things a lot, even the new tiny type in the Typophile forums.</p>"
