    html: <p>7.1 has Multifinder (in a co-operative multitasking kind of way). The original Multifinder was actually a System 6 feature that sprang out of Andy Hertzfled's <a href="http://homepage.mac.com/senorwences/servant_page/servant_introduction.html">Switcher</a> hack. I use the 170 for word processing (BBEdit Lite) and some simple database work (ClarisWorks 4). Up until 1998, it was also the computer I took on the road during EyeWire business trips. It still has Eudora Lite, Fetch, and Mosaic loaded, for all those old skool remote dialup internet sessions. It boots fast and just keeps working. Not bad for <a href="http://www.apple-history.com/noframes/body.php?page=gallery&amp;model=170">a 12 year old laptop</a>.</p>
