    html: <p>Main computer is a PowerBook G4 17", OS 10.3, 1Gb RAM, 60Gb disk. It's got most of my CD collection stuffed onto it. I've been very surprised how little I mind its big pixels, and realize how little pressure there must be - on hardware vendors to improve resolution, and on software makers to make scalable interfaces - when photos and video looks this good, and subpixel text works so well here at 100dpi. <br> <br>Somehow I managed to avoid upgrading my old computer (Pentium II 400 MHz) for too long, but fortunately something unmissable (above) came along. Also have an old 300MHz PowerBook G3, and use of an iBook 500 - on which I might install Panther. <br> <br>And everyone should get wireless if at all possible. It's liberating to be able to listen to the Today programme while making the coffee, even when I'm living on US time and must miss the real thing. <br> <br>Next computer will probably be a cheap Linux &amp; Windows box to use as a networked video recorder.</p>
