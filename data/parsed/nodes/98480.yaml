  html: |-
    <p>Moving from Windows to Mac.<br>
    I have a fairly large font library (adobe font folio, URW collections, Berthold collections, Linotype OT Libraries, OurType, Insigne, DSType, etc...). In Windows, I used FontExpert, which read from the corresponding folders for each library. I activated specific fonts as needed.<br>
    But OS X seems to place fonts in various folders... I think I understand the design of that.<br>
    On MBpro, using FontExplorer Pro, which I have organized the various Mac, office mac, and adobe fonts into 'required' and 'other' sets. Cut activated fonts from 744 to 280.</p>
    <p>Now, ready to bring over my personal font library... and wanted to ask what the best strategy is for this.</p>
    <p>1. Do I create individual 'folders' for each library (adobe, linotype, urw, etc), and then from the amassed library, create 'sets' (serif, sans-serifs, etc.) for the typefaces/fonts that I use the most ?</p>
    <p>2. Which folder should I keep my font library (I keep backups on an external drive and in the cloud) ?</p>
    <p>Would appreciate any guidance...</p>
    <p>Thanks</p>
