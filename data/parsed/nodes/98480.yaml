    html: |-
      <p>Everyone is different in their organizing needs. Do it however works best for you.</p>
      <p>I organize mine alphabetically, with subfolders for families. I use Suitcase and have three permanent sets I use: Basics, which is the Base 35 Printer Fonts, Pi fonts and fonts I use every day; Temporary, which are job-specific; and System, which is all System fonts. That makes it really easy to keep a clean installation of fonts.</p>
