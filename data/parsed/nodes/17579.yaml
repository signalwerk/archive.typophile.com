    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 27.Jan.2006 8.54am </div>
      <p>\\</p>
    <p>Four weeks to go</p>
    <p>	There are just four weeks to go until One Friday,<br>
    	24 February 2006. If you haven’t already booked,<br>
    	then now is the time to do so as the schedule for<br>
    	the event is full.</p>
    <p>Final speaker</p>
    <p>	Andy Altmann of Why Not Associates is the final speaker<br>
    	at the conference (Andy’s session will replace the<br>
    	previously scheduled panel session). Why Not is a small,<br>
    	energetic consultancy with almost two decades of<br>
    	experience to back it - clients include Nike, First<br>
    	Direct, Virgin Records and the BBC. The company’s work<br>
    	has featured in two volumes: Why Not Associates (?)<br>
    	(1998, Booth Clibborn Editions) and Why Not Associates (?2)<br>
    	(2004, Thames &amp; Hudson), it has also featured in<br>
    	exhibitions and press articles world wide.</p>
    <p>Full line-up</p>
    <p>	The full list of speakers for the event is as follows:</p>
    <p>	Andy Altmann - Why Not Associates<br>
    	Jonathan Barnbrook - Barnbrook/Virus<br>
    	Rian Hughes - Device<br>
    	Morag Myerscough - Studio Myerscough/Her House<br>
    	Geoff Nicol - Navyblue<br>
    	Erik Spiekermann - United Designers</p>
    <p>Conference information</p>
    <p>	For more information about the conference visit the<br>
    	conference web site at:</p>
    <p>		<a href="http://www.onefriday.co.uk" title="http://www.onefriday.co.uk">http://www.onefriday.co.uk</a></p>
    <p>Online registration</p>
    <p>	To register for One Friday online, visit the secure<br>
    	booking site:</p>
    <p>		<a href="http://secure.indx.co.uk/onefriday/shop/" title="http://secure.indx.co.uk/onefriday/shop/">http://secure.indx.co.uk/onefriday/shop/</a></p>
    <p>\\</p>
