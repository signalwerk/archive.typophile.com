    html: <p>Right. Raisonné looks very close. Rosario Florio, in charge of <a class="freelinking external" href="http://www.rosarioflorio.ch/1695846/Tanz-im-Park-2011" rel="nofollow">this design</a>, and <a class="freelinking external" href="http://larissakasper.ch/" rel="nofollow">Larissa Kasper</a> are well known to <a class="freelinking external" href="http://www.septemberindustry.co.uk/rosario-florio-larissa-kasper/" rel="nofollow">customize existing typefaces</a> and create this kind of work. May be you could try to ask directly to one of them.</p>
