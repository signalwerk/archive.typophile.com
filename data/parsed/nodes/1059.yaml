    html: <p>Also according to Bringhurst hanging numerals are meant to go with lower case (or small caps). They don't work with your all caps face, as you mentioned - probably for this reason.  <br> <br>If you made small caps to go with your caps, which might be nice if you want to use this in other contexts, or to sell it commercially, then the hanging figures should be proportioned in size and weight to the small caps. <br> <br>Incidentally, in your small showing the E is not as closely spaced to the ligature TH; it should be closer, I think.     </p>
