    html: <p>Looking at the business card the word spacing seems to work with this font I would not close it much tighter. The RN in Horne seems a bit tight and have you looked at lowering the middle horizontal stress of the E and on the second E in Elizabeth you could lengthen the bottom horizontal to tighten the space to the TH lig. On the reverse the Us seem a bit high and the Ss could break the baseline a bit further, on the point of word spacing I think the address line should break so that you read Street and not Saint. This thread makes for interesting reading.</p>
