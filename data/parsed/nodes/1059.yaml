  - id: 8144
    user: 618
    date: 2003-10-13T13:00:00
    date_raw: 13 Oct 2003 — 1:00pm
    votes: null
    html: "<p>Some thoughts: <br> <br>1) I don't really care for the TH lig. It reads ok, but seems like added trickery for trickery's sake. Considering you already have lots of character pumped into your deco letters, plus two lovely swash letters. Do you need the ligature? I think no. <br> <br>2) Try opening up the space in the R just a hair. <br> <br>3) Your curves &amp; stems look a little mechanical for flowing deco type. <br>a. Apex of the A <br>b. Horiz/Vert transition on the B <br>c. What if the stems had a waist? (optima-ized) <br> <br>4) Try the N with flat corners instead of the sharp ones. (more in character with the other letters) <br> <br>5) This is a matter of taste, but I'd either go back to a optical monoline, or increase the contrast in your thins. (You may not need to if you add a waist to the stems). <br> <br>Finally, I prefer the top E solution. Don't let them compete with your lovely swashes. <br> <br>All that to say, this is really nice. Bursting with potential. Congratulations! <br> <br>Randy</p>"
    html_clean: "<p>Some thoughts: <br> <br>1) I don't really care for the TH lig. It reads ok, but seems like added trickery for trickery's sake. Considering you already have lots of character pumped into your deco letters, plus two lovely swash letters. Do you need the ligature? I think no. <br> <br>2) Try opening up the space in the R just a hair. <br> <br>3) Your curves &amp; stems look a little mechanical for flowing deco type. <br>a. Apex of the A <br>b. Horiz/Vert transition on the B <br>c. What if the stems had a waist? (optima-ized) <br> <br>4) Try the N with flat corners instead of the sharp ones. (more in character with the other letters) <br> <br>5) This is a matter of taste, but I'd either go back to a optical monoline, or increase the contrast in your thins. (You may not need to if you add a waist to the stems). <br> <br>Finally, I prefer the top E solution. Don't let them compete with your lovely swashes. <br> <br>All that to say, this is really nice. Bursting with potential. Congratulations! <br> <br>Randy</p>"
