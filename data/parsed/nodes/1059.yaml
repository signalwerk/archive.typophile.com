  html: <p>This is a redesign for my Mother's shop, Elizabeth  <br>Horne. Their current design is cringe worthy, using  <br>(gasp) Brush Script for the logotype, y'know the one that  <br>comes stock standard on pc's. I reckon I owe it to her to  <br>do a redesign. I am deliberately using Art Deco as a  <br>starting point, because there is a huge amount of Deco  <br>influence in the town, and the shop was established in  <br>the mid -30's. She sells quality women's clothes, and I  <br>want the logotype to reflect both the Deco heritage and  <br>the elegance of her and the clothes.   <br> <br> <br><img src="http://www.typophile.com/forums/messages/29/14845.jpg" alt=""></p>
