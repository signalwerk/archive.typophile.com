  html: |-
    <p>I'm writing an article on the development of graphic design the last 20 years for my magazine: the idea is to give a picture of the evolution of graphic design since early days of desk top publishing.</p>
    <p>Type is of course a vital part of this. The digital font scene in 1987 was small, the number of fonts in a normal computer was microscopical, at least compared to today.</p>
    <p>My main interests are the development of type technology, and the trends. On the tech side, Open Type has been the latest big leap; among the trendiest fonts during the last two decades are (maybe) Template Gothic and Interstate.</p>
    <p>Tips, ideas and thoughts on these subjects are very welcome and helpful!</p>
