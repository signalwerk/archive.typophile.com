      <p>I don’t really see how Opentype could be considered the latest big technical leap; high-quality anti-aliasing has made digital type far more legible than it used to be. IMHO that’s much more important than OpenType, which has really just made typesetting easier.</p>
      <p>And if you’re going to cover the trendiest fonts of the last two decades, don’t forget Meta!</p>
