    html: |-
      <p>Thanks Fivos for the ID.<br>
      Mike Yanega scanned Tasmin from one of the Dover books with alphabets of old metal fonts collected by Dan X. Solo and used it for the showing of Tasmin in his Bauhaus Font ID Guide <a href="http://bowfinprintworks.com/BauhausFaces6.html" title="http://bowfinprintworks.com/BauhausFaces6.html">http://bowfinprintworks.com/BauhausFaces6.html</a>. Here is an excerpt showing the Uppercase.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/TasminBoldDetail_3953.jpg"></div><br>
      Note the two forms of S.<br>
      Here is the WSI Tango version: The S matches your image.<br>
      <div class="imageWrap"><img src="http://typophile.com/files/TangoWSI_6001.jpg"></div><br>
      Here is a different digitization, Tasmin International by David L. Crosby Typeface © Awareness Center 2007.<br>
      <div class="imageWrap"><img src="http://typophile.com/files/TasminInternational_5938.jpg"></div><br>
      It uses the other S.<br>
      As far as I know there are no other digitizations of Tasmin.<br>
      WSI was a gang of font pirates, but this may have been one they did themselves.<br>
      I know nothing about David L. Crosby.<br>
      As I have no information on the legitimacy of either font, I have not provided links.<br>
      Don<p></p>
