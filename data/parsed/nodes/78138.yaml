      <p>Looking at that other thread, and then doing an image search, the raised c is common, but it exists in different forms; aligned with the top, or not quite reaching the top, and with one line, two lines, or two dots, or nothing, under it.</p>
      <p>My understanding, though, contrary to some things said in that thread, is that "Mc" and "Mac" are two quite distinct prefixes. Yes, in the dim and misty remote ages of ancient time, they came from a common origin, but today it's no more correct to say that "Mc" is in error, and should be changed to "Mac" than to try and tell the people named Peter, Pierre, Pedro and Pyotr that they should all spell their names the same way (presumably as Petros).</p>
