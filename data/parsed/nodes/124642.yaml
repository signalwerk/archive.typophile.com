    <p>Looking at <a href="http://luc.devroye.org/palatino2.html" title="Click to visit an external URL." class="freelink freelink-external freelink-external link-external">this</a> article, "The original Palatino," I do like its liveliness and warmth. It seems to have been captured best by <a href="http://www.bertholdtypes.com/" title="Click to visit an external URL." class="freelink freelink-external freelink-external link-external">Berthold</a>'s digitization (see <a href="http://www.sanskritweb.net/fontdocs/pala92.pdf" title="Click to visit an external URL." class="freelink freelink-external freelink-external link-external">this PDF</a> which has the font somewhat incomplete embedded) but that digitization is no longer available. There is the <a href="http://www.linotype.com/57056/palatinolinotype-family.html" title="Click to visit an external URL." class="freelink freelink-external freelink-external link-external">Linotype</a> version, and the <a href="http://www.gust.org.pl/projects/e-foundry/tex-gyre/pagella" title="Click to visit an external URL." class="freelink freelink-external freelink-external link-external">TeX Gyre Pagella</a> version, and <a href="https://www.myfonts.com/fonts/urw/palladio/" title="Click to visit an external secure URL." class="freelink freelink-external_ssl freelink-external link-external">URW Palladio</a>. Which else? And which is closest to Zapf’s original?</p>
