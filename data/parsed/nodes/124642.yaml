      <p>Oh wow that Berthold one is beautiful! Look at those numerals!</p>
      <p>Palatino Nova may very well be the least authentic digitization, if you're looking for something that closely resembles the metal type.</p>
      <p>Has anyone digitized Palatino with the "European" (serifless) descender variants?</p>
