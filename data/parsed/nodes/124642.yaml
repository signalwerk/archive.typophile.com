      <p>The <a class="freelinking external" href="http://www.linotype.com/615716/Palatinonova-family.html" rel="nofollow">Palatino Nova</a> seems as clean and unlively as their other Palatino. It just doesn't seem to have the attention to detail that Berthold's has.</p>
      <p>It makes me wonder: could one take Berthold's digitization and continue working on it? Legally, I mean?</p>
