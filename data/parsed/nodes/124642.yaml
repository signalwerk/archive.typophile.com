    <p>Looking at <a class="freelinking external link-external" href="http://luc.devroye.org/palatino2.html" rel="nofollow">this</a> article, "The original Palatino," I do like its liveliness and warmth. It seems to have been captured best by <a class="freelinking external link-external" href="http://www.bertholdtypes.com/" rel="nofollow">Berthold</a>'s digitization (see <a class="freelinking external link-external" href="http://www.sanskritweb.net/fontdocs/pala92.pdf" rel="nofollow">this PDF</a> which has the font somewhat incomplete embedded) but that digitization is no longer available. There is the <a class="freelinking external link-external" href="http://www.linotype.com/57056/palatinolinotype-family.html" rel="nofollow">Linotype</a> version, and the <a class="freelinking external link-external" href="http://www.gust.org.pl/projects/e-foundry/tex-gyre/pagella" rel="nofollow">TeX Gyre Pagella</a> version, and <a href="https://www.myfonts.com/fonts/urw/palladio/" class="freelinking link-external" rel="nofollow">URW Palladio</a>. Which else? And which is closest to Zapf’s original?</p>
