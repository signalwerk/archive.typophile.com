      <p>The <a href="http://www.linotype.com/615716/Palatinonova-family.html" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Palatino Nova</a> seems as clean and unlively as their other Palatino. It just doesn't seem to have the attention to detail that Berthold's has.</p>
