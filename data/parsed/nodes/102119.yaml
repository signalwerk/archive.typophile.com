      <p>Matthieu — </p>
      <p>Three of the best published overviews of the lesser-known type designs of Dwiggins are:</p>
      <p><cite>Postscripts on Dwiggins</cite>, Volume Two (Typophile Chap Book  No. 36), edited by Paul&nbsp;A.&nbsp;Bennett [New York: The Typophiles, 1960],</p>
      <p><cite>Letters of Credit</cite> by Walter Tracy [Boston: David R. Godine, 1986], and </p>
      <p><cite>American Proprietary Typefaces</cite>, edited by David Pankow [American Printing History Association, 1998].</p>
      <p>I believe the first two are out of print, and all may be difficult for you to find in France. But I thought I’d let you know, so at least you know what to look for.</p>
