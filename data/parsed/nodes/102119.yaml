      <p>The <cite>Postscripts on Dwiggins</cite> are two chapbooks published together a few years after Dwiggins’s death, as a tribute. They comprise several articles and remembrances from a number of his friends and colleagues on various aspects of his life and work. </p>
      <p>Volume One includes articles by Paul Hollister, Alfred A. Knopf, Mabel H. Dwiggins (WAD’s widow), Carl Purington Rollins, Philip Hofer, and Helen Macy. There are also photographs of Dwiggins and selected reproductions of his graphic work.</p>
      <p>Volume Two includes articles by John Goss, Chester C. Lane, Margaret B. Evans, Watson M. Gordon, Dorothy Abbe, George Salter, Rudolph Ruzicka, and Paul A. Bennett. There is a selective checklist of his book design work.</p>
      <p>And — of most interest to this group — the summary of his work with Mergenthaler Linotype and examples of [most of] the produced typefaces are found in Volume Two.</p>
      <p>Available copies of these books are often pricey. But the two volumes sometimes appear for sale separately, which is why I specifically singled out the second volume for this list, given the OP’s expressed interest.</p>
