      <p>Thanks so much for the input.</p>
      <p>Would indeed be great to get input from the person doing the sandblasting of this stone.  Alas, they are "computer-button pressers", and seem to understand little more than that.  sigh...  When I tried to speak with them, I had to explain what "kerning" meant, what "stroke contrast" was, what a "sans serif" versus "serif" typeface was, etc, etc.  They simply punch the stone's message into their computer, position the granite stone, and hit a button.  Were it not for the case that the stone is effectively already paid for (with this existing funeral home), I'd obviously find someone else to do the work.</p>
      <p>Thanks again for your comments --- I want to digest further your thoughts on typeface selection.</p>
