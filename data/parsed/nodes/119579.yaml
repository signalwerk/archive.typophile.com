      <p>Hi.  I rarely post here because I' a signpainter and calligrapher so I don't work with much text, mostly work with display fonts and hand lettering, including wood sign carving.  But I have designed a couple of gravestones and the folks who sand blasted them liked my designs because I have seen enough blasting of several materials to "feel" how it's done.  When blasting granite, which is a very very hard stone, you don't want the masking stencil to be worn down or the interior pieces (the bowls, etc.) to be blown away.  So don't go any smaller than you have seen done successfully elsewhere and just try to think of how to make it reasonably easy for the person who wields the nozzle. (Actually having to execute much of my work makes me a better designer.  What worked for Gill, works for me.)</p>
      <p>Goudy extra bold looks great, is traditional and blasts very easily.  One local gravestone company even uses a slightly modified Goudy extra bold for their work.  They didn't divulge the exact modifications but I'll look closer next time.</p>
      <p>Generally speaking, I think Goudy would look great used with a Hebrew font.<br>
      Just keep in mind the lettering can be a bit "busy" looking because of highlights and shadows.<br>
      I hope the funeral home will tell you if any aspect of your design will be excessively difficult to produce.  Maybe you'd like to post your design here on this forum.</p>
