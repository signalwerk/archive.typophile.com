      <p>Whoever is going to sandblast the lettering should be consulted regarding the technical requirements, but I think you're right to steer clear of display weights—too much contrast, which isn't optimal for the process.</p>
      <p>Jenson, Kepler, Minion, Golden Cockerel (roman though, not titling), and Iowan are all good choices. Nice to see some uncommon names here, and all are sturdy faces.</p>
      <p>Goudy and Centaur have too much contrast for my taste, and Albertus is a bit too expected for this application. But those are just my personal opinions.</p>
