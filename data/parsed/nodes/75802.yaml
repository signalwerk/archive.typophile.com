    html: |-
      <p>It's from De Note Dop ("The Nutshell"), a local market trader in nuts and dried fruits. This is just part of their logo. Oddly enough they also use VAG Bold in their logo.<br>
      Robert translated "gewoon beter" as "normal better", but I'd translate it as "just better", which still doesn't make any sense.</p>
