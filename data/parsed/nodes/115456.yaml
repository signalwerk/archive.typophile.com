      <p>Cool project.</p>
      <p>First of all: don't use all-caps for titling; choose a good text font, and a good harmonious display font for larger sizes.</p>
      <p>BTW you don't have to stick to "system fonts" – luckily there are a number of good free fonts out there these days (although do be careful of the lion's share of bad ones). One great place to look is Typographica's annual round-up of favorites... although actually few of those are free. The last two years:<br>
      <a href="http://typographica.org/features/our-favorite-typefaces-of-2012/" title="http://typographica.org/features/our-favorite-typefaces-of-2012/">http://typographica.org/features/our-favorite-typefaces-of-2012/</a><br>
      <a href="http://typographica.org/features/our-favorite-typefaces-of-2013/" title="http://typographica.org/features/our-favorite-typefaces-of-2013/">http://typographica.org/features/our-favorite-typefaces-of-2013/</a></p>
      <p>Colors: we're a monochrome crowd around here :-) but hopefully you'll get some good suggestions.</p>
      <p>hhp</p>
