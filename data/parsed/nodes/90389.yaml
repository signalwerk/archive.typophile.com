    <p>I remember reading about two years ago a short (maybe 15-page) scholarly account of the interactions of Baskerville and Benjamin Franklin. I'd found it as a PDF, and it had inset pictures and illustrations. </p>
    <p>I'm pretty sure it was this, but I'm not positive:<br>
    <a class="freelinking external" href="http://www.search.revolutionaryplayers.org.uk/engine/resource/exhibition/standard/default.asp?resource=4626" rel="nofollow">http://www.search.revolutionaryplayers.org.uk/engine/resource/exhibition/standard/default.asp?resource=4626</a></p>
    <p>At any rate, I was hoping to find it as a PDF (need to show it to someone), but I can't find any online. Does anyone have any idea what I'm talking about? Thanks.</p>
