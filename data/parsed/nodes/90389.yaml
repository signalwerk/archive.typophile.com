      <p>I don't know the online availability, but the original source for the letter in which Franklin writes Baskerville about his prank is:</p>
      <p>John Nichols, <em>Literary Anecdotes of the Eighteenth Century</em> (London: Nichols &amp; Son and Bentley, 1812), 3: 454-55.</p>
      <p>I quote it in my article 'Readability and Revival: The Case of Caslon,' in last summer's edition of <em>Printing History</em>.</p>
