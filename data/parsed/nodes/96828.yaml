  html: |-
    <p>I tried looking this up on Identifont limited letters with no luck. Also looked through several pages of Myfonts suggestions under "brush" and "sign" and even "cartoon". I've come up empty. Anyone recognize this one?</p>
    <p>I haven't found anything with a squared-off edge to the loop on the nine.</p>
    <p>Similar but not close enough:</p>
    <p>Bruno JB Std<br>
    Freehand 575<br>
    Sign Painted House Script<br>
    Sante Fe bold</p>
    <p>I would really like to get it spot on since I'm updated old art.</p>
    <p>Thanks,</p>
    <p>Kristin</p>
