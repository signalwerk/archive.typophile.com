      <p>This must be <strong>Quicksilver</strong> by Dean Morris (Letraset, 1976)<br>
      This font was also supplied with some old versions of Corel Draw as "Quicksilver" or "Quantum".<br>
      You can find an interesting text about this typeface -by the designer Dean Morris- here:<br>
      <a href="http://www.myfonts.com/WhatTheFont/forum/case/22838/#msg206794" title="http://www.myfonts.com/WhatTheFont/forum/case/22838/#msg206794">http://www.myfonts.com/WhatTheFont/forum/case/22838/#msg206794</a></p>
