      <p>You could use the Type Navigator on fontshop.com: <a href="http://typenav.fontshop.com/main.asp">http://typenav.fontshop.com/main.asp</a>. Just click on the attributes you think would apply to Helvetica and see what choices come up. Only from the FontFont library, but that may still be too many.</p>
      <p>Check out FF Plus and FF Zwo, both more in the humanist (i.e. Frutiger) vain, but thus more useful and less overused.</p>
      <p><cite>Not one person (other than you) is saying “Oh my god they are using Helvetica Neue”</cite><br>
      That, with respect, is not the point. If that were relevant, there would only be half a dozen typefaces, one for each distinct category. We’re talking about supporting a brand here. Type is visible language, and if that company has its own style, appearance, language, surely that also needs to be expressed visually. Especially as they may well have competition. What you remember about a company or product is never a precise recollection of facts (“they use Pantone 205 and Neue Helvetica…”), but a much more succint recollection. just like we remember a person. Every detail adds up, and in order to control your appearance, you need to look at every aspect. Watzlawik’s First Axiom is:</p>
      <p>You cannot not communicate.</p>
