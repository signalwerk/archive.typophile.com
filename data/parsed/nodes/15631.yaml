      <p>I must say that Neue Helvetica does seem to work well with their site and appropriately feels very, well… Swiss.</p>
      <p>Are you proposing another sans to work in conjunction with their existing logo in Neue Helvetica? If so, there could be loss of continuity that helps in the visual balance they now have.</p>
      <p>Changing the typefaces to something very similar to Helvetica doesn’t make much sense to me either, if the only reason is to be “different.”<br>
      Because there is a strong Swiss style to their identity, I could only advise to “keep it in the country” so to speak.</p>
      <p>IMHO, one of Adrian Frutiger’s type styles might work yet retain the look of “Swiss design”.</p>
      <p>Here are three families that are NOT look-alikes of Helvetica, and range from different to very different than Helvetica:</p>
      <p><a href="http://www.myfonts.com/fonts/linotype/avenir/95-black/testdrive.html?s=usgang.ch&amp;p=48" target="new">Avenir</a>, <a href="http://www.myfonts.com/fonts/linotype/frutiger/65-bold/testdrive.html?s=usgang.ch&amp;p=48" target="new">Frutiger</a> and <a href="http://www.myfonts.com/fonts/linotype/vectora/lh-75-bold/testdrive.html?s=usgang.ch&amp;p=48" target="new">Vectora</a>.</p>
      <p>You will definitely need a type family with a range of weights, but if you want the web site text face to be consistent with the “new look” then there are very limited possibilities due to the small range of imbedded browser fonts. All of these issues are to be considered.</p>
      <p>You will probably need to create several test renditions of ads and catalogue pages to even convince yourself that it works.</p>
