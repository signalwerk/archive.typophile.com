  html: |-
    <p>hello</p>
    <p>my brother is one of the founders of a company (e-business, its a page that displays photos from parties, has a calendar of the ones coming, etc..). their url is <a href="http://www.usgang.ch" target="_blank">usgang.ch</a>. its pretty big already.</p>
    <p>they recently changed their logotype from impact (…) to helvetica neue. well, they wanted something very “normal”. and i think it works for them, its ok. the agency chose helvetica, i wouldnt have, but hey.. in the end its not my own business.</p>
    <p>but for all their ads &amp; stuff, they now also use helvetica neue.. and i think thats just not good for their image. so i want to propose them (for free, he’s my brother after all) some other fonts. ehm, i dont mean i will deliver the fonts to them, i’ll just make a short presentation about other possibilities :)</p>
    <p><strong>so: im looking for MODERN, but still corporate sans serif faces. they shouldnt be too far away from helvetica (i.e. not dax). could you list some possible alternatives? THANKS!</strong></p>
