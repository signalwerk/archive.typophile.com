      <p>I was very suprised to see Erik in Typophile, but at the same time, a designer is always a person, a creative and curious person ;)<br>
      I have to agree with your comment, but specially with the aspect of the complexity of setting type. One single face has so many forms in his own family that you can´t always explore the capabilities within a family. It reminds me of a computer software: you can say you work well with a program, but it’s always relative, from 30% to 90% of it’s capabilities. How can it be measured? Anyway, I have never drawn a typeface so far, but the offsprings of typography alone make me busy. The way history, art and communication touch each other through type and typography gives me matter enough to get lost and in love.<br>
      I admire your work. I work hard to learn new things about this, almost like an obsession. People who talk about “fonts” can only se the surface of this fantastic world, and it’s hard for me to talk to someone who understands…<br>
      Romantic speech? Perhaps. I just think typography has everything to do with human. Don’t you?</p>
