  html: "<p>I caught a glimpse of this really wierd airline logo at CDG the other day. Check it out on the tails: <br> <br><a href=\"http://www.atlanta.is/default.asp?sType=Images&amp;sAction=Gallery-View\" target=\"_top\">http://www.atlanta.is/default.asp?sType=Images&amp;sAction=Gallery-View</a> <br> <br>I guess it's partly explained by the fact that it seems to be an Icelandic company - you know, viking helmet... One cool thing is that the logo is skewed to fit the tail depending on which side it's on. But what the hell is that dot?! <br> <br>hhp</p>"
