      <p>I GAVE A MAN!  The scripts we have suggested so far lack the tone of the anguished and explosive cry for help of this lettering. Note the sharp corners.  As a substitute I would use BiffBamBoom by Comicraft <a href="http://www.myfonts.com/fonts/comicraft/biff-bam-boom/">http://www.myfonts.com/fonts/comicraft/biff-bam-boom/</a> The lettering is very successful because it expresses the vigor shown in BiffBamBoom within the frame work of a less staccato treatment of the tops and bottoms of letters. A good project for a font maker.<br>
      Somewha similar idea with Piekos FX  <a href="http://www.myfonts.com/fonts/blambot/piekos-fx-bb/">http://www.myfonts.com/fonts/blambot/piekos-fx-bb/</a><br>
      Don</p>
