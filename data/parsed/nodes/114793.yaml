      <p>More generally, some interesting resources by Walden Fonts Co.: <a href="http://American Poster Fonts of the World War II" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://American Poster Fonts of the World War II</a></p>
      <p>First poster<br>
      I'M COUNTING ON YOU/DON'T DISCUSS: <a href="http://www.myfonts.com/fonts/jnlevine/eckhardt-freehand" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Eckhart Freehand JNL</a>, <a href="http://www.myfonts.com/search/balloon" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Balloon</a>, <a href="http://www.myfonts.com/search/flash" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Flash</a>, <a href="http://www.myfonts.com/search/challenge" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Challenge</a>, <a href="http://www.myfonts.com/fonts/comicraft/totally-awesome" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Totally Awesome</a>, <a href="http://Nelda" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Nelda</a><br>
      TROOP MOVEMENTS - SHIP SAILINGS - WAR EQUIPMENT: probably go with <a href="http://www.myfonts.com/fonts/linotype/helvetica" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Helvetica</a> Condensed Black; from Walden Fonts, <a href="http://Eldon" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Eldon</a>;</p>
      <p>Second poster<br>
      I GAVE A MAN!: <a href="http://www.myfonts.com/fonts/hubertjocham/tasty" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Tasty</a> and again <a href="http://www.myfonts.com/search/flash" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Flash</a>, <a href="http://www.myfonts.com/search/challenge" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Challenge</a> and <a href="http://Nelda" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Nelda</a><br>
      Will you give at least (10%) of your pay in War Bonds?: easiest way would probably <a href="http://www.myfonts.com/search/futura" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Futura</a>; from WF, <a href="http://Payson" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Payson</a> and <a href="http://Odon" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Odon</a>; <a href="http://www.myfonts.com/fonts/marksimonson/mostra-nuova" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Mostra Nuova</a> might work also pretty well coming even closer for digits;</p>
