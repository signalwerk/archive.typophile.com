      <p>More generally, some interesting resources by Walden Fonts Co.: <a class="freelinking external" href="http://www.waldenfont.com/product.asp?productid=16" rel="nofollow">American Poster Fonts of the World War II</a></p>
      <p>First poster<br>
      I'M COUNTING ON YOU/DON'T DISCUSS: <a class="freelinking external" href="http://www.myfonts.com/fonts/jnlevine/eckhardt-freehand" rel="nofollow">Eckhart Freehand JNL</a>, <a class="freelinking external" href="http://www.myfonts.com/search/balloon" rel="nofollow">Balloon</a>, <a class="freelinking external" href="http://www.myfonts.com/search/flash" rel="nofollow">Flash</a>, <a class="freelinking external" href="http://www.myfonts.com/search/challenge" rel="nofollow">Challenge</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/comicraft/totally-awesome" rel="nofollow">Totally Awesome</a>, <a class="freelinking external" href="http://www.waldenfont.com/product.asp?productid=16" rel="nofollow">Nelda</a><br>
      TROOP MOVEMENTS - SHIP SAILINGS - WAR EQUIPMENT: probably go with <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/helvetica" rel="nofollow">Helvetica</a> Condensed Black; from Walden Fonts, <a class="freelinking external" href="http://www.waldenfont.com/product.asp?productid=16" rel="nofollow">Eldon</a>;</p>
      <p>Second poster<br>
      I GAVE A MAN!: <a class="freelinking external" href="http://www.myfonts.com/fonts/hubertjocham/tasty" rel="nofollow">Tasty</a> and again <a class="freelinking external" href="http://www.myfonts.com/search/flash" rel="nofollow">Flash</a>, <a class="freelinking external" href="http://www.myfonts.com/search/challenge" rel="nofollow">Challenge</a> and <a class="freelinking external" href="http://www.waldenfont.com/product.asp?productid=16" rel="nofollow">Nelda</a><br>
      Will you give at least (10%) of your pay in War Bonds?: easiest way would probably <a class="freelinking external" href="http://www.myfonts.com/search/futura" rel="nofollow">Futura</a>; from WF, <a class="freelinking external" href="http://www.waldenfont.com/product.asp?productid=16" rel="nofollow">Payson</a> and <a class="freelinking external" href="http://www.waldenfont.com/product.asp?productid=16" rel="nofollow">Odon</a>; <a class="freelinking external" href="http://www.myfonts.com/fonts/marksimonson/mostra-nuova" rel="nofollow">Mostra Nuova</a> might work also pretty well coming even closer for digits;</p>
