    html: "<p>Emilie, I did something similar to that for a Uni project. Except in my case all I had to work off was the TO: address on the envelope. However, the idiosyncracies in the handwriting intrigued me... I will post in the critiques section sooner or later, so we'll see what kind of legal issues this brings up then. <br> <br>P.S. This letter was not personal, and was sent from a company in New Zealand, so it's simply called Kiwi Casual, but I'm not final on that name.</p>"
