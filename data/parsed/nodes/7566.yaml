    html: <p>Emilie, first thing I would do is contact the historical society in question. Explain exactly what your intentions are, and make clear that you want to make a commercial font for sale. This is very important, especially because you'd like to use the person's name as well. Definitely keep a paper trail of all correspondence.  <br> <br>One other thing about doing it together with the historical society is that they may be willing and able to provide some form of promotion/exposure for your endeavour. <br> <br>BTW, how did you obtain the copies? If they are available to the public, there's a chance they may be in the public domain (i.e. copyright-free). <br> <br>I designed a typeface based on a person's handwriting, after we signed a contract to split the proceeds from the sale. Now that font is going to be released by Bitstream (hopefully, this summer).</p>
