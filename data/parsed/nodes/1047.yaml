  html: <p> I'm having a great deal of difficulty pasting characters created in Illustrator into this version of Fontographer. No matter what I try they always become background images, not editable shapes. Does anyone know what's going on here, or if ther is anything I can do to fix this? Thanks for your suggestions. </p>
