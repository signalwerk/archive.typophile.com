    html: <p> Paul- <br>When Richard says he's importing characters <br>in FOG after pasting he's doing just that -  <br>pasting. You can do the same FOG 3.5. <br>I would say keep 3.5. I have all 3 (FOG 3.5, 4.1 <br>and FontLab 3) and still really like the  <br>bare bones nature of 3.5. <br> <br>The pasting problem is Illustrator. <br>I'm guessing you are using 9 or above <br>which creates the problem you describe. <br>After 8, Adobe changed the structure <br>of the clipboard thus making pasting <br>into certain programs difficult. <br>Use 8 or below. I think 7 might even <br>have some problems. </p>
    html_clean: <p> Paul- <br>When Richard says he's importing characters <br>in FOG after pasting he's doing just that -  <br>pasting. You can do the same FOG 3.5. <br>I would say keep 3.5. I have all 3 (FOG 3.5, 4.1 <br>and FontLab 3) and still really like the  <br>bare bones nature of 3.5. <br> <br>The pasting problem is Illustrator. <br>I'm guessing you are using 9 or above <br>which creates the problem you describe. <br>After 8, Adobe changed the structure <br>of the clipboard thus making pasting <br>into certain programs difficult. <br>Use 8 or below. I think 7 might even <br>have some problems. </p>
