  html: |-
    <p>this page contains a short artist statement to be included in the back of a photography monograph.</p>
    <p></p><div class="imageWrap"><img src="/web/20081120080513im_/http://www.typophile.com/files/lucy_fur110a.jpg"></div><p></p>
    <p>i am curious about a couple of things:</p>
    <p>- is the placement and size of the drop-cap acceptable?<br>
    - does the phrase that is set in small caps, false-ilalics work? i am using adobe garamond and i skewed it 13 degrees. it didn’t look quite right to me with small caps roman preceding the rest of the italic text. do you think this is ok or should i set it in italics like the rest of the text?<br>
    - the text block is 4.2 inches. do you think that is too wide? </p>
    <p>the page dimensions are 10x10 inches and the type is 11/14</p>
    <p>any advice and recommendations are greatly appreciated</p>
    <p>thanks,</p>
    <p>gregg</p>
