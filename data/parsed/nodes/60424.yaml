    html: |-
      <p>Please write this by hand. Your writing will feel better in both content (edit, edit, edit) and form.</p>
      <p>Poetry should always be hand written. It may be transposed later into digital to be mass-produced, but the creation should be personal.</p>
      <p>At the risk of offending almost everyone here (not much risk unless you're new), there is not much that is passionate about fonts except the conception and r&amp;d of such fonts. Once they are put on paper by a font "user" they might be great design, many other wonderful things, but passionate and intimate is not the first thing that comes to mind.</p>
      <p>Let the tirades begin.</p>
      <p>pbc</p>
