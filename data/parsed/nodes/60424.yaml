      <p>Might be nice for anyone with a disability that precludes the possibility of using their own handwriting. "If I <em>could</em> handwrite this, it would look like <em>this</em>..."</p>
      <p>Otherwise, what Paul and Nick said.</p>
      <p>If it's just "I'm a bit ashamed of my handwriting, it's kinda sloppy", then practice. So am I; mine's appalling. Perhaps print some tests of whichever of these fonts you like, find a good pen, and try copying them. Exact slavish reproduction won't be the point, but getting a feel for well-shaped lettering will be. Think of the patience to spend a lot of time on it as one facet of the passion you want it to express...</p>
      <p>[Yikes, that sounded cheesy. You know what I mean...]<br>
      _______________________________________________<br>
      Ever since I chose to block pop-ups, my toaster's stopped working.</p>
