    html: |-
      <p><cite>So how does this sign work in the daytime?</cite></p>
      <p>I’d figure this would look much the same on a south-facing (in the northern hemisphere) wall at high noon, and skew throughout the day at other times, throwing the separate shadow elements out of alignment to make it undecipherable less than an hour out either way.</p>
      <p>Otherwise it would look like semi-random bits of wire sticking out of the wall.</p>
