      <p>When faced with this sort of text, I don't often think of finding a sans that echoes the serif face. That way lies far too many sample pages. &amp; as has been noted, Galliard may be a tricky serif to find a sans for. Galliard is Galliard, and there isn't anything quite like it among sans faces for books. </p>
      <p>Rather, I think about how much I want the two faces to blend or contrast. &amp; I think about the overall color on the page. I may need to make small adjustments to the size of the sans, and to fiddle with the H&amp;Js to get there. &amp; I use design factors such as indents, space between the elements, etc to help get that color and contrast/blend.</p>
      <p>When I get myself moved away from the notion of "companion" faces [and there seems to be some kind of inevitability that makes book designers look for those often elusive faces], then I find the realm of choices becomes much wider.</p>
      <p>All that said, I just looked at the shelf and realized I had not used Galliard for a book text in over 7 years. &amp; I'm pretty sure I never paired a sans with it.</p>
      <p>Good luck; do keep us posted.</p>
      <p>powers</p>
