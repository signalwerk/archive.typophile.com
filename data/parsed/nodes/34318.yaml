    <p>I think I will end up just moving on to another serif typeface, but before I do I am kind of curious, so I'll throw this out there.</p>
    <p>I am designing a book of interviews (collected interviews with big-time theorist). I'd wanted to use C+C Galliard but don't want to set the interviewer's questions in Galliard itals for (maybe) obvious reasons. So I started thinking about a companion sans face for the questions, which can run a little long. I'm stumped. Does Galliard simply resist this kind of pairing? I think so but wonder what I might be missing. The closest I've come is Helv Neue. But of course the slant &amp; set of the two itals are so different.</p>
    <p>I thought about just choosing a serif with a nice companion sans such as Quadraat, Scala, or Stone. Scala is out--too cute. Quadraat Sans is too calligraphic looking to me, espec. at larger display sizes. Stone &amp; Stone Sans are a little too informal, with a bit too high x-height.</p>
    <p>Still playing around with my sample pages for a while, but thought I'd ask. A very simple sans that sets nicely at text size, to contrast but harmonize with the elegance &amp; hooks of Galliard. Crazy?</p>
