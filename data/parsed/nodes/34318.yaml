      <p>I had a similar reaction to Minion, but it was in comparison to Times Roman, which if you were a photocomp shop, was the use-everywhere font -- except perhaps for those love poems. I still like Times when it is rendered well, esp. the long-descender Times. And I still like Minion.</p>
      <p>The "boring" label comes, I think, from designers, not readers. As was pointed out to me rather forcefully last week, I am out of date. What makes for good design now is what other (contemporary) designers think of the work. The token lip service to Warde is gone. Perhaps that is a good thing, but is not in me to abandon what I spent 30 years learning and doing.</p>
