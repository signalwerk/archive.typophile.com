      <p>There was a period some years back —when Minion was new—during which we heard comments along the lines of "Minion is the new Bembo" or something like that. This was a tribute to all those attributes that made Bembo [I'm talking about the metal Bembo I was trained on] so suitable for such a variety of texts. At Stinehour Press and other hot-metal shops I worked at we used Bembo for the whole gamut of work: from Homer to Marxism to sappy self-published love poems and all in between. We had other faces—we used Bulmer and Bell a lot—but most of the work was in Bembo. At one point another printer &amp; I began to call it "boring, boring, beautiful Bembo."</p>
      <p>That claim made on Minion's behalf may not be holding up these days as we have seen the rise of some more fully articulated type familes, and as our expectations of what a font can yield have changed.</p>
      <p>I use "trusty Minion" very little these days, but I am always comforted to remember it is there as a reliable fallback.</p>
      <p>powers</p>
