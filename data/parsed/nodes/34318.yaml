      <p>Oh I love Galliard italic (I think it's got my favorite ampersand ever), but used the way it should be--in running roman text, for emphasis, etc. A block of, say, 15 lines of 9.8/14 x 25p Galliard is just too intense for book reading. Oh and of course by "should be" I do not mean to say it can't be used for display.</p>
      <p>I like Syntax but it has a very slight fussy air to it, with that lowercase G, and it's a tad narrow, but I will play with it &amp; see.</p>
      <p>Stone Sans I tried &amp; rejected along with Stone Serif--it looked a little informal. The others I don't have but will look at.</p>
      <p>The questions will either be set in the serif's italic face (if I give up Galliard &amp; go with something with a less distinctive italic), or a roman sans.</p>
      <p>I really appreciate both of your replies. Thanks. I will let you know what I end up with--later today I hope!</p>
