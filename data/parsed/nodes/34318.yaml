      <p>Charles, thanks for reminding me of that alternate "g." But that alone will not solve my problem, which is that the overall hooky-ness, to use a highly technical term, of the itals is just too thorny for this setting. This is a bunch of smart Marxists theorists interviewing the El Supremo Marxist theorist, so something altogether more straightforwatd than Galliard itals is needed. As for a sans, Will, you are right, I HAVE made too many sample pages, but I am actually fairly open to odd combinations that might not be typographically, historically, or categorically "correct." I was just searching for that elusive rightness, and Galliard being what it is (itself, as you noted), I didn't find it. So I am going with my trusty Minion, with Minion itals for the questions, and I'm actually pleased because it looks nice at a very large size on my title page too. Sorry to disappoint the 2 or 3 people who were holding their breath in suspense... Sometimes the right solution is to move on.</p>
      <p>PS Amplitude is another new one for me. Thanks Hrant.</p>
