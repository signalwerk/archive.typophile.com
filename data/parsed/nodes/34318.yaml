      <p>It probably isn't just the "g" in Galliard italic, but if that is it, there is an alternate, quite nice &amp; normal italic "g" with the C&amp;C fonts.</p>
      <p>As I see it, the problem with finding a companion sans for Galliard lies in the roman itself. To me, what separates it from, say, the Garamonds, is its sparkle, which comes about from the relationship of the fine to thicker strokes. I don't know of any sans which complements this -- which isn't to say there isn't one out there. You might look through the AAUP show books -- Richard Eckersley used Galliard as his primary font for 10 years or so. That I don't remember any sans he paired it with speaks only to my memory.</p>
