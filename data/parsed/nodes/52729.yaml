    html: |-
      <p>I agree with Graham on the comment above - none of these things are necessarily implied by the logo. Hand-made jewellery is a very general term - I know a fair few people from university who make and sell jewellery in this way. This logo would suit some of them very well, and others not at all.</p>
      <p>It's difficult to give anything more than vague feedback on the logo without knowing a bit more about the type of jewellery the client makes. One thing I would say is that I don't really feel that the type is a good match for the mark. It's a little bit po-faced compared to the cute, fun feel of the logo. I think a nice characterful sans is definitely the right choice, but I'm pretty sure this isn't the right one! I find the diagonal negative space caused by the left aligned text a little jarring as well, but that might just be me. Does it read oddly if 'le petit' is on the same line?</p>
      <p>Anyway, a good start and a likeable mark. Good stuff :)</p>
      <p>Take care,</p>
      <p>Andi</p>
      <p>[<a href="http://www.semibad.com" rel="nofollow">semibad</a>]</p>
