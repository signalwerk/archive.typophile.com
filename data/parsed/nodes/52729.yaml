      <p>I like the bird icon, reminds me a lot of 60's, 70's illustrations! So i think the 30's, 40`s style of your typeface does not fit well.</p>
      <p>I would try another style for keeping that flavour:<br>
      How about <a href="http://www.fontshop.com/fonts/singles/house_industries/chalet_paris_1960/" rel="nofollow">Chalet paris nineteen sixty</a>, lowercase, negative tracking<br>
      or the same face/weight, all caps, with relatively tight setting.</p>
      <p>Or if you want full contrast between the icon and type:<br>
      How about a script?</p>
