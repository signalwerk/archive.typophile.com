      <p>I’m not a professional designer but I have some suggestions.</p>
      <p>The “Canada’s trusted source...” part is way too tiny.  Also even if you make it larger that amount of text would look better in a cleaner, easier to read font.  You might even want to come up with a more concise tagline if you truly intend to make it part of the logo.</p>
      <p>I really like the Flag/Leaf concept.<br>
      Here’s my attempt at making it more flag-like:<br>
      </p><div class="imageWrap"><img src="/files/flag_6630.gif"></div><p></p>
      <p>The main typeface (Serpentine) looks dated so you might want to experiment with one that gives a more modern appearance...</p>
      <p>Here’s two that might work better...</p>
      <p>——————-House Gothic————————————Stainless——————-</p>
      <p></p><div class="imageWrap"><img src="/files/golf_4595.gif"></div><p></p>
