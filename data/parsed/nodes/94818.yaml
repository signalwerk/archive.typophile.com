      <p>Cut a punch<br>
      Temper a punch<br>
      Punch a matrix<br>
      Cast a {type, letter, figure, line}<br>
      {Pour, Break} a mo(u)ld<br>
      Ink a {plate, roller}<br>
      Test a {typeface, layout, design, style}<br>
      {Render, Rasterize} a {font, typeface, image}<br>
      Engrave a {score, piece} (music)<br>
      Float a {figure, graphic, image, chart, table}<br>
      Pull a quote<br>
      (Im)press a {page, sheet}<br>
      {Bold, Italicize} a {letter, number, glyph, word, phrase}<br>
      Letterspace a {word, phrase}<br>
      Indent a {line, paragraph}<br>
      Hang a {paragraph, {comma, hyphen, quote, ...}}<br>
      Scale a {image, chart, graphic, figure}<br>
      Align a {column, table, paragraph, block}<br>
      Justify a {paragraph, block, text}<br>
      Break a {word, line, paragraph}<br>
      Hyphenate a {word, phrase}<br>
      {Split, Break} a table (across pages)<br>
      {Condense, Expand} a {font, letter, word, phrase, line, paragraph, text}<br>
      Squeeze a {column, paragraph, block}<br>
      Wrap a {line, paragraph}<br>
      Pitch a {design, layout, typeface} (not really restricted to typography)<br>
      Greek a {line, paragraph, text}<br>
      Quad a {space, line, gap}<br>
      {Choke, Jam, Hose} a printer<br>
      Hint a {font, outline}<br>
      (Auto-)Trace a {font, outline, image}<br>
      Expand a path<br>
      Antialias a {font, image, curve, line}<br>
      Fill a counter<br>
      Number a page<br>
      Lead a {paragraph, text}<br>
      Feather a {block, page} (increase leading to fill a text block)<br>
      Switch a {font, typeface, ink} (actually applies to anything interchangeable)<br>
      Rescue a {widow, orphan}<br>
      Stack a diacritic<br>
      Run down a line (fill out a line with nonsense in linecasting systems, usually ETAOIN SHRDLU)<br>
      Open a press<br>
      {File, Log} a bug report</p>
      <p>Oddities and obscurities:<br>
      Lipsum a {paragraph, text} (from ‘lorem ipsum dolor sit amet’)<br>
      Kashida a {word, line}<br>
      Swash a {stem, serif, letter}<br>
      Foliate a {page, leaf}<br>
      Found a typeface (rare)<br>
      Spot a colo(u)r (use a spot colo(u)r instead of regular CMYK)<br>
      {Choke, Spread} a trap (different methods of compensating for colo(u)r misregistration)<br>
      Control a point (rare)<br>
      Scrape a palimpsest</p>
      <p>Funnier ones:<br>
      Steal a sheep<br>
      {Endure, Cajole, Mollify, Please, Berate, Ignore, (Im)press} a client<br>
      Burn a bridge<br>
      {Endure, Sleep through} a presentation<br>
      Tolerate an {apprentice, devil}<br>
      Decipher a {TrueType hint, script}<br>
      Comprehend a design<br>
      Ignore a critic<br>
      Sacrifice a {chicken, ideal, moral}<br>
      French a curve<br>
      Reticulate a spline<br>
      NURBS a Bézier<br>
      Etaoin a Shrdlu<br>
      Titivillate a {scribe, calligrapher}<br>
      Bedevil a printer</p>
      <p>There are lots more but I’m running out of ideas at the moment.</p>
