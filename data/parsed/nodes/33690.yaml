      <p>New Fav is Hypatia from Adobe. Nearly nothing gives the flavor and poise of this new/old fashioned design. </p>
      <p>Chianti from Bitstream has very pleasing modeling, almost a woodcut or handcut punch look. Lots of flavor and some unusual swash and ligature forms, along with small caps etc. </p>
      <p>I second Apex New. Forget the original Apex. This is how it should be. </p>
      <p>Sebastian by Storm. Very unusual, modeled like Chianti but more baroque. </p>
      <p><a href="https://web.archive.org/web/20150123174807/http://www.textaxis.com/" rel="nofollow">Suite by Inigo Jerez Quintana.</a> Needs to be seen and used more. For that matter all his types are interesting, and there are several sans at the textasis site.</p>
