      <p>I like, amongst others, in no particular order:</p>
      <p>- Klavika - Nice modern squarish sans<br>
      - Legato - Good for both text and larger use, very large family<br>
      - Fedra Sans - Especially nice when combined with Fedra Serif.<br>
      - Locator - No special reason.<br>
      - Engel - More friendly then Klavika.<br>
      - Sansa (+ Soft) - Just pure genius, imo. ;)<br>
      - Fresco Sans - Works well for body text (and then there's the serif that goes with it.)<br>
      - Quadraat Sans  - Same as Fresco Sans.</p>
      <p>Not specifically typefaces I bought, but these came to mind right now. There are more that I like of course, but it's too late now to type more. :)</p>
