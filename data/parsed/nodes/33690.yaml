      <p>You know me, I'm a theory guy. So although I reserve the right to change my mind after seeing a font in actual use, I do feel comfortable supporting (but never "worshiping") a font based solely on an idea that I consider good. That said, I have indeed seen Legato in use, although only at pretty large sizes*. I also have a PDF of a spread from a book that uses Legato, but like Stephen I admit that might not be good enough. The thing with Legato is, like you say, it's "boring" (superficially) so there can't really be anything fatally wrong with it, so judging it based on ideology seems safer.</p>
