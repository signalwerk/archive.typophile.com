      <p>Well you stole a couple of mine (Bryant and Galaxy Polaris), but here are some more recent favorites:</p>
      <p><strong><a href="https://web.archive.org/web/20150123174807/http://www.fontshop.com/search/?q=amplitude" rel="nofollow">Amplitude</a></strong> by <a href="/web/20150123174807/http://typophile.com/wiki/Christian%20Schwartz" class="freelinking" rel="nofollow">Christian Schwartz</a><br>
      After three years, it's still my favorite workhorse. Amplitude looks right in almost any setting — clean and readable at text sizes, vibrant and powerful in headlines. With an inktrapless version and italics on the way, soon you'll be able to use Amplitude for anything.</p>
      <p><strong><a href="https://web.archive.org/web/20150123174807/http://www.fontshop.com/fonts/downloads/fontfont/ff_strada_text/" rel="nofollow">FF Strada</a> and <a href="https://web.archive.org/web/20150123174807/http://www.fontshop.com/fonts/downloads/fontfont/ff_strada_condensed/" rel="nofollow">FF Strada Condensed</a></strong> by <a href="/web/20150123174807/http://typophile.com/wiki/Albert%20Pinggera" class="freelinking" rel="nofollow">Albert Pinggera</a><br>
      Its warm curves can make it friendly if it needs to be, but you can use it to set serious text too. Wonderfully readable at small sizes, unique detail when large. One of few contemporary typefaces drawn by an Italian.</p>
      <p><strong><a href="https://web.archive.org/web/20150123174807/http://www.fontshop.com/fonts/downloads/arstype/maquette/" rel="nofollow">Maquette</a></strong> by <a href="/web/20150123174807/http://typophile.com/wiki/Angus%20Shamal" class="freelinking" rel="nofollow">Angus Shamal</a><br>
      A new large x-heighted alternative in the grotesque style of <a href="/web/20150123174807/http://typophile.com/wiki/Gotham" class="freelinking" rel="nofollow">Gotham</a> and <a href="https://web.archive.org/web/20150123174807/http://www.fontshop.com/search/?q=Proxima%20Nova" rel="nofollow">Proxima Nova</a>.</p>
