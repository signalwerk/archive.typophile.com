      <p>Here are the sans-serif fonts I purchased this year:<br>
      TheSans Office<br>
      Parisine Plus</p>
      <p>I wanted fonts that were readable and legible, where the italic had different letterforms than the roman, had R/I/B/BI varients, and that didn't look like everything else.</p>
      <p>I got TheSans Office because it had what I wanted at a price I could afford. (Why do so many foundries only sell their fonts in humongous bundles at outrageous prices? Is it to keep non-pros like me from buying them?)</p>
      <p>I went with Parisine Plus instead of Parisine because I wanted something a little more lively -- fun or quirky, if you will -- without being too eccentric.</p>
      <p>I'm happy with my purchases, and I'm glad no one has yet cited them on this thread, because they <em>will</em> look like everything else if everybody uses them.</p>
