    <p>Hello,<br>
    Interesting in knowing what are your current favorites for contemporary (humanist, geometric, or gothic) san-serif typefaces might be.  Usage could be anything, but primarily wondering what faces you've purchased in the last 3 or so years that you like and why.</p>
    <p>Here's mine:</p>
    <p>• Bryant Pro: Nice contemporary friendly face. Very clean on and off screen</p>
    <p>• Galaxy Polaris: Great workhorse for the studio, but a little limited. Basically our helvetica.</p>
    <p>• Stratum: Good ultra modern font, that straddles a nice line between ultra-tech but not overly so.</p>
    <p>Feel free to broaden the criteria for selection.  </p>
    <p>Cheers,<br>
    Peter.</p>
