    votes: null
    html: <p>Be consistent; use '2004' or '04', but not both. List your freelance clients; if I was using this CV to judge you, I'd be more interested in those than in the short placements. <br>'We designed adverts for printing' doesn't really cut it to be honest...why else would you design them? <br>Who says 'one 17 AD' are 'reputable'? - don't put subjectivity like this into a CV. <br>Sorry if this seems a bit critical, but what you write in a CV (I write as someone who has to read them for recruitment) is more important than whether you're using DIN or not.</p>
    html_clean: <p>Be consistent; use '2004' or '04', but not both. List your freelance clients; if I was using this CV to judge you, I'd be more interested in those than in the short placements. <br>'We designed adverts for printing' doesn't really cut it to be honest...why else would you design them? <br>Who says 'one 17 AD' are 'reputable'? - don't put subjectivity like this into a CV. <br>Sorry if this seems a bit critical, but what you write in a CV (I write as someone who has to read them for recruitment) is more important than whether you're using DIN or not.</p>
