    html: <p>Actually, I shouldn’t have disparaged the font in my original post... there’s nothing “wrong” with it, it’s quite nice in a quirky kind of way, but it is COMPLETELY NOT appropriate for the product that it will be used to promote (either in a logo or packaging). Unfortunately, the client has a “thing” for the cupcakes, and this is their logo, so I am forced to offer this up as an option and try to talk her out of it.</p>
