    <p>Anybody care to take a stab at this? I’m looking for the font used for “Sprinkles” - I know it may be hand lettered, but it seems clean enough to be a font. I was handed this by a client who likes this, all I can see is “Giddyup”, but hey, it’s her money. Ed Script is a much better face IMHO, but I’d like to show her this as an option if it exists.</p>
