    html: |-
      <p>Sadly not. You know how when you make a new style, many of the attributes have a blank default value? Well if you set them to anything, then there doesn't appear to be anyway to unset them.</p>
      <p>So, say you have a paragraph style in which you've set a font size of 14 pt., and you want to apply that style to a bunch of paragraphs of varying font sizes, but you've decided that you really don't want "14 pt." to be a part of the style after all.</p>
