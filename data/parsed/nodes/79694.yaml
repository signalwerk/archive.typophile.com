    html: |-
      <blockquote><p>Actually, you can't set attributes like size, leading, tracking, etc. to nothing in paragraph styles.</p></blockquote>
      <p>That sounds correct to me. What you <em>can</em> do is create a new paragraph style and not explicitly set (new) values for these parameters. They then will automatically be inherited from the style it is based on. If there is no designated base style, the values of the default [Basic Paragraph] style will be used.</p>
      <p>For Patrick’s problem: You can use the option <a href="http://help.adobe.com/en_US/InDesign/6.0/WS60910FA3-2BD7-449d-9904-05CFA551665Da.html#WS15F28658-9D80-4fca-AB52-754957BDD2C4a" rel="nofollow">Reset To Base</a> (in the style options). It will reset <em>all</em> parameters to those specified in the base style. You can’t reset the parameters one by one.</p>
