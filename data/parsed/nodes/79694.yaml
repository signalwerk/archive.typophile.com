  html: <p>Does anyone know how, once you've set something in an InDesign character/paragraph/object style, how to return it to a blank value, as in "I don't care"?</p>
comments:
  - id: 454451
    user_id: 1215
    user_name: kentlew
    user_path: null
    date_raw: 4 Mar 2011 — 10:29am
    date: 2011-03-04T10:29:00
    votes: null
    html: |-
      <p>In the fly-out menu associated with the Paragraph Styles palette, there is a command for Break Link to Style. This will divorce the active paragraph(s) from any paragraph stylesheets. </p>
      <p>Alternately, the pulldown menu in the Control bar gives you direct access to the [No Paragraph Style] “style.”</p>
      <p>There are similar commands with the Character Styles and Object Styles palettes for character and object stylesheets (or you can just apply [None]).</p>
      <p>Is that what you’re looking for?</p>
