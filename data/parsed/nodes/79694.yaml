    html: |-
      <p>&gt;  you want to apply that style to a bunch of<br>
      &gt; paragraphs of varying font sizes, but you've<br>
      &gt; decided that you really don't want "14 pt."</p>
      <p>The whole point of paragraph styles is to apply absolutely identical styles (including point size) to multiple paragraphs. Any variances need to be applied as manual overrides or via character style sheets.</p>
      <p>If you want to vary point sizes in different paragraphs but keep them otherwise identical, one solution would be to create one base style and then create other "based on" styles that only vary in point size.</p>
