    user_name: Theunis de Jong
    user_path: null
    date_raw: 5 Mar 2011 — 4:06am
    date: 2011-03-05T04:06:00
    votes: null
    html: <p>It's not the copying that's the problem, it's the pasting. Use "Paste Without Formatting" in InDesign, or first paste the text in a program that <em>definitely</em> doesn't support formatting (Notepad, for example), then copy it out of that again.</p>
