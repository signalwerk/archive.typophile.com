      <p>Exactly, Jabez. I will work pro bono too.</p>
      <p>They are nice people, no more than a private committee, doing things for free like organising small fairs with local vegetables producers and photographers, lobbying the local authorities for the establishment of a county museum, inventing things to do in the countryside with kids and parents as an alternative to the malls of the nearby big city. I do not even think they are a registered NGO. Actually, I'd bet they are not.</p>
      <p>The newspaper will hardly work to raise funds, Si. As they are really a "bunch of hippies" – I use the term in an affectionate, warm way – their main goal is to spread the word: more a newsletter in a newspaper shape than a newspaper in itself, as in Italy you need a registered journalist as editor and a tribunal authorization to publish any single thing. So much for the freedom of press and expression.<br>
      However, their events that I attended to were completely free: I suspect they haven't even had the idea to ask for money. Anyone was bringing own food and beverages et voilà, kids were playing, people singing or staring at the photographs on the medieval walls of the villages, picking small cubes of chees offered by local farmers. Yes, the more I talk about them, the more I like them – naiveté comprised.</p>
      <p>Old Nick, I work with Quark XPress 7.</p>
      <p>Nina, yours is truly a great idea. I will pass onto them.</p>
      <p>So far, thanks to each of you for the time spent.</p>
