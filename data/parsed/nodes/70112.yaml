      <p>There are some good Open Source typefaces you could have a look at: Gentium, Linux Libertine, Liberation. Bundled fonts are certainly a good place to start as well.</p>
      <p>I personally like <a class="freelinking external" href="http://new.myfonts.com/foundry/Canada_Type/" rel="nofollow">Canada Type</a>, an independent foundry which sells nice and original fonts for a reasonable price. You could also have a look at some fonts by <a class="freelinking external" href="http://www.stonetypefoundry.com/stonetypefoundry.html" rel="nofollow">Stone Type Foundry</a>, especially Silica, StonePrint or ITC Stone.</p>
      <p>Some other good quality freefonts are PT Sans, Aller and League Gothic (all available at fontsquirrel.com)</p>
      <p>Hope this helps</p>
