    <p>Good morning everyone.</p>
    <p>I'm going to design a 12 pages newspaper – compact, 24*34cm, 9.4"*13" – for a not for profit organization. The association is devoted to the promotion of its territory: from conscious tourism to the preservation and valorisation of their local artistic and environmental heritage.</p>
    <p>Being an organization funded by its own members, I have been asked to use only free or cheap typefaces.</p>
    <p>I think I need a good sans serif, with a regular and condensed family, and a serif for body text. I'd like to have some personality on the pages, starting from typography, but I understand their budget issues.</p>
    <p>Have you got any idea to spare with me? Thank you very much.</p>
