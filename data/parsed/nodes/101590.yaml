    html: |-
      <p>If you both agreed to the price in advance, there's no need to charge less if it goes faster than expected. Just as you wouldn't charge them more if it took longer than expected.</p>
      <p>If you're hoping to get more work from them in the future, charging them slightly less than they expected might be good public relations, as hrant said, but that's your call.</p>
