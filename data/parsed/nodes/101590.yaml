      <p>I can think of two reasons to bill less than the client agreed to pay: if it helps you sleep better (which is a very personal thing, not worth asking for advice on); and if it's likely to impress the client so much they'll give you repeat business.</p>
      <p>I once made $750/hr (for only two hours though) but didn't feel guilty because the client was a particularly lowly corporation... In contrast, I only charged $400 to make Arasan (which took me ~3 man-weeks) because it was for an Armenian charity. Like I said: it's a very personal thing.</p>
      <p>hhp</p>
