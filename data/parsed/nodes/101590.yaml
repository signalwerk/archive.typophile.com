      <p>If you agreed to a price then stick to your agreement. </p>
      <p>It cuts both ways, sometimes you win and sometimes you lose. But once you start changing your agreements your authority will begin to wobble (if that's the correct word). For instance the next time they will question your accounts.</p>
      <p>n.</p>
