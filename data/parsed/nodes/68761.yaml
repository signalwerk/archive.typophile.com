      <p><em>See the editions by Prof. Dotan (Adi,1973) and Prof. Breuer -- there's a clear distinction between atnah hafukh and yerah ben yomo.</em></p>
      <p>Yes, but the way in which Unicode has chosen to encode atnah hafukh is problematic, because this is a character disunification, i.e. both atnah hafukh was previously presumed to be encoded as the same character as yerah ben yomo; now, it is encoded distinctly, but with the necessary caveat that existing documents will not make this distinction. However, because it is the form of yerah ben yomo that changes between when the distinction is not made and when it is made -- the atnah hafukh is the typical form when no distinction is made --, there is an inevitable incompatibility between existing documents and new fonts. Simply put, an existing document using U+05A2 for both atnah hafukh and yerah ben yomo will display with the wrong glyph in a font that supports this character distinction with appropriate glyphs for atnah hafukh and yerah ben yomo. There's no easy way around this, which is why the current build of the SBL Hebrew font still does not make a visual distinction between these two characters: the atnah hafukh glyph is used for both. I'm willing to change this, but have been waiting to see what feedback there is from users.</p>
      <p><em>I don't understand why we waited so long; every decade they add couple glyphs</em></p>
      <p>Frankly, I think the Israeli standards body must bear a lot of blame for the problems in Unicode encoding of Hebrew. They appear to have had almost no interest at all in anything except the encoding of modern standard Hebrew, and gave only cursory and unsystematic attention to Biblical text. These are the people who encoded the Biblical upper punctum extraordinarium but not the lower one, on the grounds that the latter was very rare. Even if a character is used only once, it is still a character.</p>
      <p>Regarding the text that ends up in the Unicode Standard, e.g. "some users in recent decades have begun to reintroduce this distinction", this generally reflects whatever was said in the proposal(s) for the new characters. In the case of vowel and accent distinctions, e.g. qamats qatan vs qamats gadol or atnah hafukh vs yerah ben yomo, these were not as uncontroversial as one might have expected, hence 'some users', acknowledging that at least some members of the Unicode Hebrew community argued that these disunifications were unnecessary and would break existing practices.</p>
