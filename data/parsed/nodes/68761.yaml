    html: |-
      <p>Whether the blame goes to the Israeli standards, or the Unicode Consortium, or both of them  -- the problem still remains. Your description --  "There's no easy way around this...the atnah hafukh glyph is used for both" --  is basically the 'by-product' that could have  been avoided a long time ago. </p>
      <p>Established editors and scholars such as Prof. Dotan, Prof. Breuer and Prof. Yeivin  cared about that distinction. When the information is reachable I don't think we should wait a long time to add one glyph or two. </p>
      <p>I don't  know whether or not these  different proposals  are  hot topics of debate, but not everything should be based on 'popular' demand, or 'popular' agreement. For example, I've been working for a l-o-n-g time on the Babylonian vocalization &amp; masorah.  There's no doubt that the average user  &amp; publisher would not need that, but the academic world  would need that.  But if adding one dot or two is based on the rare factor, then I think that the Babylonian vocalization would be added when the Messiah is here.</p>
      <p>BTW,  to paraphrase Prof. Yeivin, this distinction serves as an indicator of the accuracy of the bible's editor.</p>
