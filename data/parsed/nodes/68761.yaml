      <p>David: <em>I've been working for a l-o-n-g time on the Babylonian vocalization &amp; masorah</em></p>
      <p>Great, do you want to put a formal encoding proposal together for this? I can help put it together in appropriate form for submission to Unicode and ISO 10646, and can also get the Canadian JTC1 SC2 standards body to add their name to it for greater weight.</p>
      <p>Characters are added to Unicode when people document them and submit proposals. If no one is doing this work, then it doesn't happen. The Israeli standards body shows no interest at all in anything beyond standard modern Hebrew and Tiberian vocalisation, so waiting for them to do anything is pointless. The recent additions have all been as a result of individual submissions.</p>
      <p>[I have been in contact with one other person interested in encoding Babylonian vowel marks, but didn't receive a full and systematic list from her suitable for a proposal.]</p>
