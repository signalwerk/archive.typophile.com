      <p>... also other things :) but since you  mentioned it.</p>
      <p>The name Atnah Hafukh was given by Prof. Yeivin.  He said that the distinction between  atnah hafukh and yerah ben yomo 'serves as an indicator of the accuracy and purity of the tradition of the accentuation in a manuscript.'</p>
      <p>See the editions by Prof. Dotan (Adi,1973) and Prof. Breuer  --  there's a clear distinction between  atnah hafukh and yerah ben yomo.</p>
      <p>I don't understand why we waited so long; every decade they add couple glyphs  :)<br>
      Now this is funny:<br>
      Unicode, page 237: "but some users in recent decades have begun to reintroduce this distinction"<br>
      'some users'?! what they mean by 'some users'?</p>
      <p>BTW, there's a draft by the SII (2/2010) without this distinction! (I emailed them, so let's wait and see what is the answer)</p>
