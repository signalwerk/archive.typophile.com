      <p>Toronto Subway is *a version* of the indigenous TTC typeface. The TTC believes it has its own outline-font version. I have a few reservations about Toronto Subway; we may need a few more iterations before we arrive at a really accurate outline-font version, particularly given the fact that there is no model for the lower case.</p>
      <p>—<br>
      Joe Clark<br>
      <a href="http://joeclark.org/" title="http://joeclark.org/">http://joeclark.org/</a></p>
