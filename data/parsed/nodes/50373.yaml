    <p>Hello everyone.</p>
    <p>I got this doubt in InDesign concerning table of content styles. I've created a paragraph style for all entries and I've created a TOC style as well. Everything is working correctly except for some entries that are in ALL CAPS (because they are in all caps in the catalog as well). </p>
    <p>Now, is there anywhere in any style (TOC styles or paragraph styles) where I can set the case to "Sentence case"? Like I do now manually by going to Type - Change Case - Sentence Case.</p>
    <p>The only options I see there for case are Normal, All Caps, Small Caps and OpenType All Small Caps. I really want to set the TOC to Sentece Case. But how?</p>
    <p>Thanks in advance.<br>
    Pedro Peixoto</p>
