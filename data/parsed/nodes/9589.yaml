    html: "<p>Every time I see the phrase \"good web typography\", I feel a painful surge of despair. I don't think a good book on \"excellent web typography\" exists, largely because I don't think it's possible. That said, there's an interesting article on readability on the web in the most recent issue of <a href=\"http://www.magtypo.cz\">TYPO</a> magazine, #13.</p>"
