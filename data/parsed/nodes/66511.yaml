      <p>Thanks for looking.</p>
      <p>I made a huge mistake.  Those are brackets, not parentheses.  I can't believe I did that, and with that knowledge, I figured out that the bracket font is <a href="http://bayfonts.com/atilla-normal-p-170.html" rel="nofollow">Atilla</a>, while the "t" font is Arial, as you said.</p>
      <p>I'm kicking myself hard about the bracket/parentheses thing.  Thanks again for your help.</p>
      <p>-rockerest</p>
