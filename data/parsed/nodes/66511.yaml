  html: |-
    <p>Hello all!</p>
    <p>So I lost a font, and now I want to recreate the image I created with it, and I can't find it.</p>
    <p>I built a basic "logo" using some font that is remarkably similar to "Grotesque" and used it on a website.  Now that I want to use it again, BOTH remote .PSD files are corrupt AND my local .PSD is corrupt, so I can't access the file to determine what font it is.</p>
    <p>I have over 1500 fonts and I've spent about 2 hours looking through them and nothing fits.</p>
    <p>I've attached the ONLY sample text I have for it.  I know it's minimal, but maybe someone knows what it is.</p>
    <p>Thanks in advance.</p>
    <p>-rockerest</p>
    <p>EDIT:<br>
    Notice the vertical bars on the parentheses.  I have not yet seen a font that has both these vertical bars (versus continuous curves) and the inward facing stroke ends on the parentheses (versus upwards or diagonal stroke ends).</p>
