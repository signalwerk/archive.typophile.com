      <p>&gt; Old Nick<br>
      Please allow me to bring a little French-speaking perspective in the debate about the word "Realist".<br>
      In his classification, Maximilien Vox gave the name "RÉALES" to the category of typefaces which seemed to aknownledge the influence of the "Romain du Roi" (end of the seventeenth century) — which corresponds broadly to the "Transitional" word used in English-speaking countries. The word "Réales" itself doesn't exist in French (it is another of Vox's infamous neologisms) but etymologically alludes to "royalty", indeed.<br>
      I'm not sure you can equate it with "Realist" without causing some ambiguities : for example, as it was already mentioned, Bringhurst uses this very term for nineteenth-century typefaces (Clarendon, etc.) in reference to the Realist painters (Gustave Courbet et al.) of the same era.</p>
