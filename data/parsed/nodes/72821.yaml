      <p><em>@Celeste</em></p>
      <p>I am aware that the word <em>réales</em> doesn't exist in French; however, the word <em>real</em> (with the e pronounced as an e acute in French) does exist in Spanish, and it is translated as "royal." I agree that Vox-aTYPI's adoption of the term only seems to cause confusion, especially when the picture is muddled with historical reference to Realist painting, which is entirely beside the point.</p>
      <p>I have been operating under the apparently mistaken assumption that the kind of Type Classification we were discussing was structural: while the first Transitionals may have been designed during a specific period of time, it is still possible today for someone to design a typeface that is essentially Transitional in structure. If one mucks up the classifications by adding point-in-time as definitive of style, then what are we to call a Transitional typeface designed today? Postmodern Semi-Scotchy? What do you call this monstrosity, which made its appearance within the Realist period?</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/realist_3629.png"></div><p></p>
