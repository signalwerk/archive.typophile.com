      <p>The Modern (Didone), the Scotch Roman, and the Scotch Modern are quite distinct genres of type, connected by an evolutionary causality -- although the Scotch Roman is, ironically, a step backwards in some respects.</p>
      <p>I have described their relationship on page 5 of the <a href="http://www.shinntype.com/Figgins_Scotch.pdf" rel="nofollow"> Modern Suite PDF specimen</a>.</p>
      <p>The Scotch Roman is transitional, but between the Modern and Scotch Modern, not between the oldstyle and the modern, which is all about Baskerville.</p>
