      <p>@Old Nick<br>
      The fact is, I never really was a fan of Vox's classification, which mixes structural facts and intellectual pretensions (IMHO). I've always been more at ease explaining the evolutions of type design to my students in relation to art history, which sometimes clarifies a few points : I can't, for example, put Fournier (in essence a rococo stylist) and Baskerville (an early neo-classicist) in the same "Réales" bag (without even mentioning the fact that the name itself overemphasizes the historical importance and the influence of the whole "Romain du Roi" affair).<br>
      I agree with you that historical categories are only points of departure (the very moment a particular style first appeared) and that it's still possible today to design typefaces which could eventually be labelled "rococo" (MVB Sirenne), "neo-classical" (FF Danubia), or whatever.</p>
