    html: |-
      <p>I always thought Transitional was not preferred by type purists. Robert Bringhurst writes:</p>
      <p><cite>Several systems are in use for classifying typefaces. Some of them use fabricated terms such as 'geralde' and 'didone'. Others rely on familiar but vague labels such as 'old style', 'modern' and 'transitional.' All these systems work to a certain extend, but all leave much to be desired. They are neither good science nor good history.</cite></p>
      <p>I agree with Robert. Over 100 years, what we now call 'modern' could be 'old' or 'transitional'. These names are temporary.</p>
      <p>Century is very readable on screen and sometimes style is an important factor. It also depends on other things like size, line height and line width.</p>
    html_clean: |-
