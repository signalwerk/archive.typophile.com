    html: |-
      <p>Thank you for your reaction. Yes, Georgia is the best serif for screen and very popular too. I know it is designed for screen usage. The problem is that it is not that popular on Linux systems and I want to give a subtle alternative for if you want to pair it for example with Century Gothic or other geometric or realist fonts available on most computers. Century Schoolbook is also very readable on screen.</p>
      <p>Transitional is too broad for me for creating font stacks that communicate a specific era.<br>
      The information I found until now point in the direction that Georgia is a realist serif font, but nobody writes it plainly.</p>
