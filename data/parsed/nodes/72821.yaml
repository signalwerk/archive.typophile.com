    <p>hi Everyone,</p>
    <p>I created several web-font stacks based on different styles: neo-grotesk (realist sans-serif); geometric; humanist body; humanist display; renaissance; neoclassic; baroque; romantic; and monospace. I am still puzzling with Georgia.</p>
    <p>Georgia is a wonderful web-font for display and book, but I cannot classify it perfectly. Do you believe it is a realist serif, baroque typeface, or...?</p>
    <p>Also, do you think Century Schoolbook is a good Georgia-alternative for web-body or/and display?<br>
    Is Century Schoolbook not somewhat different in style?</p>
    <p>Thank you for you reactions.</p>
    <p>Greetings,<br>
    Bart</p>
