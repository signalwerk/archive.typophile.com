      <p>Like I mentioned on Flickr, I *love* your first graphic. </p>
      <p>Your second graphic feels to close to the Latin alphabet for me, though (not that I can read Hebrew…). It looks like "qio", with the dot on the i falling over. Normally, I don't  think that I would "read" English (or whatever) into Hebrew, but since you are using such an iconic Latin design, it is too hard to avoid.</p>
