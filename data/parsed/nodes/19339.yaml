  html: |-
    <p>hello.<br>
    my name is yaron and im a second year visual communications student from israel.</p>
    <p>i wanted to share a project i did for our illustration class.</p>
    <p>i created an illustration book (called "Red Fur") inspired by illuminated medieval books and later printed german books. i needed to make a logo that matches the theme, so i developed some "hebrew blackletter" letters using a font that i love called -  "willhelm klingspor gotisch".</p>
    <p>the title says "Parva (fur) Aduma (red)"</p>
    <p>you can view the illustrations and some initials i designed in this set:<br>
    <a href="http://www.flickr.com/photos/yaronimus/sets/72057594064500349/" title="http://www.flickr.com/photos/yaronimus/sets/72057594064500349/">http://www.flickr.com/photos/yaronimus/sets/72057594064500349/</a></p>
    <p>i'll post some initials soon.</p>
