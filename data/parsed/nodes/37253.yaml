      <p>I also think <a href="http://www.fontshop.com/fonts/downloads/paratype/itc_charter_ot/">ITC Charter</a> or <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_clifford/">FF Clifford</a> would work well with Griffith, depending on how traditional you want the look.</p>
