    <p>Any helpful designers want to chime in with a nice text face which would go well with Font Bureau’s Griffith Gothic? Samples here:<br>
    <a href="http://www.fontbureau.com/fonts/GriffithGothic" title="http://www.fontbureau.com/fonts/GriffithGothic">http://www.fontbureau.com/fonts/GriffithGothic</a></p>
    <p>This is a history book “for dummies”, on the history of Israel, with a slightly more sophisticated bent than the actual “for dummies” book series. The application might carry over onto a companion website.</p>
    <p>Thanks for your input</p>
    <p>/\/\<br>
    Meir Deutsch</p>
