      <p><cite>Isnt it contrast, as opposed to a lack thereof that draws eyeballs in design today, and most of this century?</cite></p>
      <p>Yes. And contrast isn’t the only change; the density of information within publication is increasing and notions about so-called classical designs with huge margins and the modernist hangup on tracts of whitespace are dying off. Ellen Lupton brings this up in the second edition of <em>Thinking With Type</em>; which, along with her book <em>Graphic Design: The New Basics</em>, provides a nice example of how a great deal of information can be packed into a relatively small book and still be a nice read. </p>
      <p>This seems connected to the constant change in the function of the book. Those huge margins are no longer needed in world where people rarely use them to take notes; a publication with carefully considered even color on every page is not relevant in a world where few people will sit down to savor such an experience.</p>
