    <p>So there is this video circulating from the Build conference where Typekit's Mr. Brown gives an absolutely heroic rational for not just picking font sizes with a dartboard app and its well worth watching and listening closely to, although I'm in a loud car on Amtrak now with Leon Russel's "I'll put a spell on you" blasting me along to a date with the brick maps of NYC. </p>
    <p>Back in Tim's presentation, he shows one of Aldus' pages and points out how the type and illustrations match in intensity, by design. Well, I know they do, and the page Tim shows, shows this more than many of the pages of the same book. Is this truely a design choice, or is this a production issue?</p>
    <p>e.g.  I know, for sure, from my own era of letterpress and lithography, that big contrast between the largest and smallest areas of black is a serious inking issue that brings either a failure of blackness of large areas, an over-inking of the type, or addition cost from separate runs for each part.</p>
    <p>This is after all why we love Figgins, n sleep with his book under the pillow. Anybody got any idears in this area? Is there a thread on this here?</p>
