      <p>@Dunwich Type:<br>
      <cite>Those huge margins are no longer needed in world where people rarely use them to take notes; a publication with carefully considered even color on every page is not relevant in a world where few people will sit down to savor such an experience.</cite></p>
      <p>And, too, uneven color doesn't cause printing problems for offset lithography, the way it did for traditional letterpress.</p>
      <p>Incidentally, I think the reason Cheltenham is so generally excoriated these days doesn't have anything to do with its overall characteristics, but rather that the shape of certain elements in the letters - the rounded bowls in them come to mind - gives the face a quaint and out-of-date appearance.</p>
      <p>Also, it combines elements of an oldstyle type with other design elements that were up-to-date when the face was designed; this kind of mixture is usually associated with faces that date badly, while faces that truly represent their era consistently live on (Garamond, Bodoni, Clarendon, Franklin Gothic, Futura). Although I think that Times Roman will be an exception to this generalization, as the problem depends on <em>what</em> is combined, and <em>how</em>.</p>
