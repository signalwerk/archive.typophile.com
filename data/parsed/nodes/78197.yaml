      <p>Here is an excerpt from a history I'm writing.<br>
      It discusses the popularity of Cheltenham in the 1900s.</p>
      <blockquote><p>A major concern was integrating the graphic quality of image, decoration and type. Linework was often the answer. “There is too, that quality in the engraved or drawn line which harmonizes with the varied linear quality of type and dominates the old bookmaking,” wrote Charles E. Dawson in the 1909 Penrose Annual, and it was for this reason that photo-engraved line drawings continued the traditional magazine illustration medium of hand-engraved linework for three decades into the 20th Century, during the era of historicist typography. However, the mechanical halftone screen, invented in the 1880s, was also widely used for illustrations and photographs, requiring a quite different harmony with type. For the halftone establishes a graphic area flat upon the page—as indeed do those other magazine design elements, blocks of colour and areas of mechanical tone—and Cheltenham, with its low stroke contrast, and lack of hairlines, tapered serifs or thinned joints, exhibits a NON-varied linear quality which plays to those layout elements. With its almost monoline construction and slab serifs, it has much the effect of the later modernist geometric slab serif types such as Stymie and Rockwell; with its simple linearity it is a pop-art version of what a serifed type looks like. It does not consist of part area, part line, as types with a pronounced contrast of thick and thin strokes and varied detailing do—suggesting depth and complexity—but may be considered as all-monoline or, at larger sizes and bolder weights, all area, so that it lies flat upon the page, and herein lies its modernity and suitability for use with halftones; either separate, or knocked out. </p></blockquote>
