    html: |-
      <p>Hi Behnam,</p>
      <p>It wasn't hurt, but rather surprised that this Indian company copied our wording verbatim. Apparently this is  case of a different sense of creativiy and self-respect.</p>
      <p>We developed an admiration for and deep interest in Middle Eastern script culture - and try to contribute something useful. We never saw it coming that this would put us in the position of literally or metaphorically having to "kill or feed" people who do not respect other than their own property rights. It makes me want to return to the days that I was only interested in dead languages.</p>
      <p>As for the different regional variants of nastaliq, it is an interesting challenge to identify and parametrize the features that distinguish Persian, Ottoman and Urdu nastaliq on the level of script grammar, i.e., competence. The chunky forms, odd proportions and deranged alignment of what led to the likes of Noori Nastaliq and in turn its derivatives, I consider a less relevant dimension, something on the level of execution or performance. From feedback on our own work, I get the strong impression that Urdu users can appreciate the equivalent of a Persian level of performance as long as the competence behind it meets their conventions.</p>
      <p>Regarding Decotype ACE, there is no need to speak of "other" font formats: for our technology the font format is irrelevant. Today it uses regular OpenType fonts, so any thing on font level, including anti-aliasing falls into that domain. The key difference is ACE as the lay-out engine. It takes the form of an API. Once this is built in, our script output can be made to interact seamlessly with any other engines or scripts. As for justification, that's again in the host engine's domain. The proof of concept is of course Tasmeem, which is capable of handling a lot more languages and scripts than the regular version of IDME. You can download and test it yourself.</p>
      <p>I agree with you that there is a need to make our technology widely affordable. We understand the urgency and are actively working on a solution . It's unfortunate that the present situation leads to copying and hacking, but in the end of the day it is a compliment.</p>
      <p>Thomas Milo<br>
      DecoType<br>
      <a href="http://www.decotype.com" title="www.decotype.com">www.decotype.com</a></p>
