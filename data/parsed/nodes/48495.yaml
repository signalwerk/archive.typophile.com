      1. incorrect to apply Spacing/Shaping parameters to line(s) of text.<br>
      2. impractical (time-consuming + tedious) to adjust word by word.</cite></p>
      <p>The post to which you refer is a nice reminder that you have not understood Milo's replies back then. As he pointed out there, ACE/Tasmeem <em>do not</em> follow the usual spacing + kerning method, it uses a different method for defining spaces between letters and words.</p>
      <p>ACE is literally the embodiment of the recognition that "Arabic is a dynamic script" so possibly you tell Milo old news. And ACE's above-mentioned different approach to spacing, by the way, is just logical consequence of this recognition.<br>
      <em>ad 1</em> -- This may be true in the context of usual spacing + kerning method. But as said, ACE uses another method. Hence, a mere debater's point.<br>
      <em>ad 2:</em> -- <a href="http://typophile.com/node/48495#comment-331016" rel="nofollow">Your example</a> above indicates that with MirEmad, words are composed by pulling every individual piece to its proper place manually. Now this is what I would call "impractical (time-consuming + tedious)". ACE/Tasmeem does all of this automatically, so you <em>can</em> do manual adjustments if you feel like it but you <em>do not need to</em>.</p>
      <p>You are argueing against your own misunderstandings and ascribe to ACE the problems that MirEmad seems to have. I have a hard time to make sense of this.</p>
