    html: |-
      <p>I have some <a class="freelinking external" href="http://en.wikipedia.org/wiki/Uniscribe" rel="nofollow">good news</a> for the originator of this thread.</p>
      <p>His font is not the first piece of software to modify Windows, and replace its existing copy of the file usp10.dll with another version. <em>Microsoft Office</em> does the same thing, according to the Wikipedia article I linked to.</p>
      <p>A third-party update to support Malayalam is also noted.</p>
      <p>A virus is a piece of software that copies itself to other computers, and so that term, at least, does not apply here. There could be legal implications, and there could be a danger of making other software not work right (if I already installed the custom version of the DLL that lets me work with Malayalam, that would certainly break, but I imagine that this is an unlikely scenario).</p>
      <p>Note that some software that uses alternate versions of a DLL installs with that DLL in the software's own directory, so possibly putting the DLL in the directory of the (executable of) the word processor to be used with the font would be a better alternative - I don't know offhand under what conditions one can substitute a DLL in this way, but I do know that many software packages that come with their own versions of DLLs (a version from Microsoft being the particular update the software requires - many DLLs are redistributable) do such a thing.</p>
  - id: 447228
    user_id: 50554
    user_name: quadibloc
    user_path: null
    user_image: /files/pictures/picture-50554.jpg
    date_raw: 12 Jan 2011 — 5:03pm
    date: 2011-01-12T17:03:00
    votes: null
    html: |-
      <p><a class="freelinking external" href="http://en.wikipedia.org/wiki/DLL_hell" rel="nofollow">Here</a> is an article on the basic technical issue that is faced here; at one point, this was a major problem with Windows, back in the days of Windows 3.1, when DLLs were normally always shared among all applications.</p>
      <p>Customizing usp10.dll, however, does seem to be a common practice for those wishing to work with exotic scripts; it is noted that one needs to download a special version to work with Khmer in some of my search results.</p>
      <p>This is what comes of designing Unicode so that it is not tied to glyphs - and expecting the most sophisticated software support for the languages which are much less widely used than Arabic, languages like Khmer, Malayalam, Thai, and Burmese.</p>
      <p>Microsoft releases the internals of usp10.dll to developers under an NDA, but it isn't updating it itself to widen its language support. It's a pity that Microsoft probably wouldn't be amenable to a project to write, using no Microsoft code, an OpenUSP, that not only included the features you use for Arabic, but the extra features many other world languages require - and which Microsoft itself does not have the resources to support.</p>
      <p>It would be somewhat ironic for part of Windows to be based on open-source software - although nothing new, as it does, as the world learned some time back, use chunks of BSD Unix.</p>
