      <p>To put it in the context, this is how things are in Iran. No resident in Iran has ever purchased a legal software in his life! Hacking illegally obtained softwares and adjusting them to Persian use is 'le monnaie courant'. There is some protection for internal products in internal market but that's about it. Open Source environment users naturally have a more legitimacy.<br>
      In fairness, I should note that this is a systemic problem creating a large cultural deficiency in terms of respect of copyright laws. But I do know of individuals who fully understand how harmful it was for developing Persian support in applications and even tried to purchase legal products, although they are very hard to come-by and many times more expensive. But this is an exercise in futility.<br>
