    html: |-
      <p>Saad, Aziz,</p>
      <p>I had a quick glance at this product. In short, Aziz's claim that this is straightforward OpenType with no need for additional technology is not correct. </p>
      <p>1. Applications<br>
      The Maryamsoft dowload contains an installer that sets up an application directory with executables and fonts. This is proprietary technology.</p>
      <p>2. System DLLs<br>
      In the Windows System directory Maryamsoft replaces the essential 397Kb usp10.dll, the OpenType layout engine, with a 500Kb modified version. This replacement usp10.dll no longer calls the original Microsoft GDI32.dll, the Graphical Device Interface, but instead a newly installed proprietary GDX32.dll. As a result, Microsoft Windows is turned into proprietary technology.</p>
      <p>3. Fonts<br>
      The fonts have no OpenType layout tables, but instead use non-standard tables. This could be considered proprietary technology.<br>
      The underlying artwork is impressive and authentic, but the outlines as such appear not not to be the work of professional type designers.<br>
      As for the font structure, the glyphs are a mixture of letter parts, complete letters and ligatures.</p>
      <p>4. Unicode compliance<br>
      The concept uses assigned and reserved Unicode character code points for markup as a kind of proprietary technology. As a result these alien Unicode characters interfere with the text structure and data interchange. Moreover, font changes becomes impossible with such texts.<br>
      According to the CMAP, language coverage is limited to Arabic and Persian. And, BTW, the OS/2 table is empty. </p>
      <p>5. Uninstalling<br>
      The package contains an unstaller utility. It restores the original usp10.dll. However, on all the paths leading to MS Office applications it leaves a trail of copies of the proprietary 500Kb usp10.dll. As a result, there is no de facto uninstallation for MS Office, since these applications will keep encountering the proprietary layout engines before reaching the real one. It requires a manual removal. The replacement graphical device manager, GDX32.dll also needs to be removed manually.</p>
      <p>More to be discovered later. Now off for dinner. After all, there is no such a thing as a free lunch.</p>
      <p>Thomas Milo<br>
      DecoType<br>
      <a href="http://www.decotype.com" title="www.decotype.com">www.decotype.com</a></p>
