      <p>CS3 comes with a nice font bundle, but it only includes 4 faces of Garamond Premier Pro: regular, italic, semibold and semibold italic. No Adobe Jenson Pro. 11 faces of Minion.</p>
      <p>We'll have the full list up shortly.</p>
      <p>T</p>
