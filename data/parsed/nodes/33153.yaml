      <p>Achtung! No Jenson Pro? That's what I was afraid of when I started the Arno Pro thread! What is the reasoning behind dropping one of the best typefaces in Adobe's catalog from the bundle? Sure, Arno is great, but at the expense of Jenson? I dunno if I like that. </p>
