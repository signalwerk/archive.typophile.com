    <p>Hi everyone,</p>
    <p>Considering my update options here, I'm eager to know this: Will I get Adobe Garamond Premier (with the Opticals), Adobe Jenson, and Minion with Creative Suite 3 Standard? How about Creative Suite 2.3 Standard/Premium?</p>
    <p>I did see the recent threads about <a href="http://typophile.com/node/33096" rel="nofollow">Arno Pro</a> and <a href="http://typophile.com/node/33092" rel="nofollow">Hypatia Sans</a> (but I want the Slimbach classics!).</p>
    <p>Olli</p>
