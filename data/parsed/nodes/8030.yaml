  html: <p>I was suprised this wasn't mentioned anywhere I could find when I searched the archives... <br> <br><a href="http://processing.org/exhibition/004/index_link.html">Alphabot</a> by Nikita Pashenkov at MIT. Click anywhere inside the applet (near the Alphabot itself), then type any letter(s) on the keyboard. Drag the mouse to rotate alphabots. <br> <br><a href="http://acg.media.mit.edu/people/nik/projects_n.cgi?alphabot&amp;intro">Find out more</a> here which also has movies including a protoype model of the robot.</p>
  html_clean: <p>I was suprised this wasn't mentioned anywhere I could find when I searched the archives... <br> <br><a href="http://processing.org/exhibition/004/index_link.html" class="link-external">Alphabot</a> by Nikita Pashenkov at MIT. Click anywhere inside the applet (near the Alphabot itself), then type any letter(s) on the keyboard. Drag the mouse to rotate alphabots. <br> <br><a href="http://acg.media.mit.edu/people/nik/projects_n.cgi?alphabot&amp;intro" class="link-external">Find out more</a> here which also has movies including a protoype model of the robot.</p>
