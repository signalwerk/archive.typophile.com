    <p>Hi All,</p>
    <p>I have grown extremely fond of this style and want to use it for some identity work. </p>
    <p>As I understand it, M.G.B. Patrician was designed by a man named Don Munson and originally used as transfer letters in 1982. However, it does not appear to have been made into a digital font by the owner of the rights (if anyone still owns it).</p>
    <p>As of today, at least four publicly-available fonts were created based on M.G.B. Patrician: Mazama, Verve, Protea, and Aegina.</p>
    <p>As there does not seem to be a commercial font based on this old typeface that I can use, could I legally use one of these fonts for an identity piece?</p>
    <p>Thank you in advance for your replies, and don't worry, I don't expect any of you to be lawyers per say :)</p>
