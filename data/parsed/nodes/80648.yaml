    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/17745" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Designers</a>&nbsp;: Female Type&nbsp;Designers</strong></p>
    <p>This is a list of women who have practiced—or are currently practicing—as a type designer: full-time, part-time, or only sometime. Listed alphabetically by last&nbsp;name.</p>
    <p>* = Full-time professional type designer (self-employed or employed at a foundry)<br>
    ℗ = Published + number of typefaces available by retail or custom fonts credited with her name<br>
    ✝ = Deceased<br>
    No mark indicates an occasional, free-lance, or part-time type designer, or someone who is considerably involved in the production of fonts of any&nbsp;kind</p>
