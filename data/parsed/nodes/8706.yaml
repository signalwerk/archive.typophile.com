    votes: null
    html: "<p><i>I think it was because they didn't read.</i> <br> <br>Ouch, Hrant, I'd rather you put a smiley next to that -gratuitous- remark. But then again I'd expect nothing less from our grumpy old uncle. ;p <br> <br>I did read. All of it. I have the original run of Ray Gun, and am very interested in <i>all</i> kinds of music, alternative and mainstream (hence my \"5 artists\" remark earlier on), so I <i>was</i> motivated and interested. Carson's designs were perfectly suited for his target audience of angry alterno kids who were bored with Corporateling Stone Magazine. No-one can argue they didn't deserve their own forum. And some of the things he did were genius on a conceptual level. I mean: \"Article continued on cover\"? The Brian Ferry interview set in Zapf Dingbats? The doubled Cocteau Twins spread? What an eye openers! This made you <i>think</i>, and best of all it went on and on. And to top it all most of it was simply gorgeous! <br> <br>It's maybe because I'm a kid of the Nineties and I'm less aware of notorious predecessors of Brody and Carson, but what the heck. These guys taught me one of the most valuable lessons in graphic design: don't copy, but <b>analyze</b> how one comes to a particular end result and try to integrate the <b>thought process</b> in your work, not the style.</p>"
    html_clean: "<p><i>I think it was because they didn't read.</i> <br> <br>Ouch, Hrant, I'd rather you put a smiley next to that -gratuitous- remark. But then again I'd expect nothing less from our grumpy old uncle. ;p <br> <br>I did read. All of it. I have the original run of Ray Gun, and am very interested in <i>all</i> kinds of music, alternative and mainstream (hence my \"5 artists\" remark earlier on), so I <i>was</i> motivated and interested. Carson's designs were perfectly suited for his target audience of angry alterno kids who were bored with Corporateling Stone Magazine. No-one can argue they didn't deserve their own forum. And some of the things he did were genius on a conceptual level. I mean: \"Article continued on cover\"? The Brian Ferry interview set in Zapf Dingbats? The doubled Cocteau Twins spread? What an eye openers! This made you <i>think</i>, and best of all it went on and on. And to top it all most of it was simply gorgeous! <br> <br>It's maybe because I'm a kid of the Nineties and I'm less aware of notorious predecessors of Brody and Carson, but what the heck. These guys taught me one of the most valuable lessons in graphic design: don't copy, but <b>analyze</b> how one comes to a particular end result and try to integrate the <b>thought process</b> in your work, not the style.</p>"
