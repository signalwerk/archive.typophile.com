    html: <p>1 Helvetica Neue <br>2 Bell Centennial <br>3 Tyfa <br>4 Frutiger <br>5 Serif/Text face, would have to think about that one for a bit.  <br> <br>Guess that would be it, hard one but think Bodoni, Helvetica, Times Roman, Century and Futura would be great to work with if I had to for the rest of my life.  <br> <br>Massimo is very "black and white" and it is easy to see how he can say this. He pulls it off very well and gotta give him full respect on his work to date. I think people today use too many fonts or maybe they don't spend time nuff with one font to get used to its form. </p>
