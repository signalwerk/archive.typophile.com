    html: "<p>Dave, you nailed it on the head there, and I do share your very strong feeling that the content ought to heavily influence the design <i>(cut and paste makes me type faster ;) )</i>. The work of David Carson amongst others made me realize that the first thing you need to do when starting a design is to analyze the cultural and other demographics of your target audience (whenever possible). The main reason why he got away with those difficult to read lay-outs is because his target audience was motivated. They didn't mind to put in the extra effort to decipher his pages because it just looked so friggin' good and they were interested in the content. I like to see that as \"tribal design\", where a certain style with its specific codes, symbols etc. is recognized by its target audience as being \"authentic\". <i>(I fear this might not be entirely clear but my English is failing me here).</i> <br> <br>As how I try to imply this way of working: for example the design with 7 or 8 typefaces to a page I was talking about in the <a href=\"http://www.typophile.com/forums/messages/4100/5163.html?1044487157\"> Matchmaking...</a> thread was for an informative magazine aimed at parents with teenage kids, but it was implied in the brief that the magazine should be attractive and inviting to the teenagers as well so they would pick it up too. So my reader demographic was split into two definite chunks of teens and thirty-somethings. This made me approach the typography and colour scheme in a totally different way than the magazine for human resources managers that was entirely set in FF Info and FF Meta. <br> <br>These are the kind of challenges that make this graphic design thing <i>so</i> interesting. And I must say I can get sooo bored by these highbrow hotshot designers who persist in setting everything in Neue Helvetica 55 9/12. The quote I really like about Schmelvetica is \"When in doubt, set in Helvetica. You're never right, but at least you're never wrong.\" <br> <br>Oh, and before y'all start yelling at me: I <i>do</i> occasionally use Helvetica. All I need is a very, very good reason and a watertight rationale. <br> <br>P.S. Isaac I thought I noticed a hint of sarcasm in your first post. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> And frankly, no, I didn't expect that funny bit about Comic Sans. LOL</p>"
