    date_raw: 6 Feb 2003 — 7:15am
    votes: null
    html: "<p>It occurred to me that Keith asked <i>why</i>. So: <br> <br>Gill Sans - the typeface that first make me want to enquire further into typography. To be precise, the uppercase G. People say its overused. Never. Misused, perhaps. ;) <br> <br>Perpetua's proportions work so well with Gill Sans, and to my mind is a wonderful marriage. The italics are compact and beautiful.  <br> <br>Verdana looks great on screen, both aliased and antialiased, and its all down to its spacing. If you must read on screen, there is no finer read than 11pt verdana on a 72dpi screen. <br> <br>Sabon (and Sabon Next) are wonderfully legible and utterly handsome. The ligatures, swashes and alternatives add a depth and richness that many others fail to provide. <br> <br>As for Helvetica Neue - everyone needs a workhorse for information graphics ;) <br> <br>Sorry for not answering correctly first time round.</p>"
    html_clean: "<p>It occurred to me that Keith asked <i>why</i>. So: <br> <br>Gill Sans - the typeface that first make me want to enquire further into typography. To be precise, the uppercase G. People say its overused. Never. Misused, perhaps. ;) <br> <br>Perpetua's proportions work so well with Gill Sans, and to my mind is a wonderful marriage. The italics are compact and beautiful.  <br> <br>Verdana looks great on screen, both aliased and antialiased, and its all down to its spacing. If you must read on screen, there is no finer read than 11pt verdana on a 72dpi screen. <br> <br>Sabon (and Sabon Next) are wonderfully legible and utterly handsome. The ligatures, swashes and alternatives add a depth and richness that many others fail to provide. <br> <br>As for Helvetica Neue - everyone needs a workhorse for information graphics ;) <br> <br>Sorry for not answering correctly first time round.</p>"
