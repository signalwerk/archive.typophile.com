    html: <p>1. Perpetua (Because I love his Florentine R) <br>2. ITC Bodoni (6, 12, 72) - Because I support Massimo Vignelli's school of thought. <br>3. Anisette (entire family including Anisette Petite) - Because of it's simplicity and it's ability to be both masculine and feminine. <br>4. Neutraface - Because it is arrogantly clean. <br>5. Eldorado - Because it is Dwiggins. <br> <br>But, this is next to impossible to judge. Because I could easily add Futura Serie BQ, Gill Sans, Helvetica Neue, Ariston, Gerstner Original, Berthold Garamont Amsterdam, Parisine ... and on and on and on and on ... <br> <br>Although I do agree that having a top 5 list is next to impossible. Unless you happen to work as an in-house designer for a company that has a style sheet already set in place. (I seem to recall only have a few faces to choose from at MSLO.) However, I'm very old-school and proud of it. I happen to appreciate very much the staunchly pristine work done by Massimo Vignelli (and those from the so-called New York School). But then again, I'm also one of those people that thinks it is necessary to learn the rules so that when you do break them you understand why. I guess I'm boring. <br> <br>What about foundries. This is a dream. What if we had our pick of type libraries. Which would you pick?</p>
