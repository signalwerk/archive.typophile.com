    html: "<p><i>Nice post, Yves. Question about Proforma: whenever I use it  <br>I find it's too spindly and sharp. Do you use heavier weights  <br>for text? I'd actually like to see it run through a letterpress.</i> <br> <br>Stephen, I didn't forget you, I just couldn't get to it yet. Sorryabouthat :/ <br> <br>I only recognized how good a general workhorse Proforma was when I saw the Medium weight being used as body copy face in Eye magazine. I used to use the Book, but you're right about it being a bit sharp, though personally it never bothered me. I like crispness in my body copy, and the fact that the characters have so many straight lines in them make Proforma a very interesting design. <br>And you can do lovely things with the Extra Light at large sizes... yummy. <br></p>"
