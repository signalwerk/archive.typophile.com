    html: "<p>BTW John and Isaac, don't let me be misunderstood: I recognize there are brilliant designers who could do with only one. I totally admire the understated and \"pure\" typography practised by some. It's not that I'm trying to promote \"use as many fonts as possible and then add some more\" here, I'm just reacting against one of those \"Vignelli cringe quotes\". <br> <br>Keith, I think they're just scared witless of saying something that goes against one of the Great American Icons over at AIGA's. They really need to lighten up and stop taking themselves too seriously. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br>Orwell warned us for this, but would we listen? <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"></p>"
