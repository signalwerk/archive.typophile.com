ng.\" <br> <br>Oh, and before y'all start yelling at me: I <i>do</i> occasionally use Helvetica. All I need is a very, very good reason and a watertight rationale. <br> <br>P.S. Isaac I thought I noticed a hint of sarcasm in your first post. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> And frankly, no, I didn't expect that funny bit about Comic Sans. LOL</p>"
