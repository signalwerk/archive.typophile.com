    html: "<p>Tracy makes a good analogy between fonts and kitchen tools (they're not gadgets, dammit!), at least in my life. So let's see: <br> <br>My good nonstick skillet is Futura. <br>My pretty-good nonstick skillet is Akzidenz Grotesk. <br>My big cast-iron skillet is Jim Parkinson's Modesto. My little one is Cooper Black. <br>My best knife is Adobe Garamond. <br>My jelly-roll pans are all versions of Helvetica: the lovely two Calphalons are Neue;  the Chicago Metallic is the extended Adobe set; the overrated Williams-Sonoma, which I use only at last resort, is Arial. <br>My Cuisinart is Gill Sans. <br>My cutting board is Rosewood. <br>I have too many spatulas to count. <br></p>"
