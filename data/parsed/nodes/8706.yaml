    html: <p>As likely the only person here who has the same birthday as Massimo, I feel entitled to say I think the whole notion of limiting oneself to five typefaces is utter nonsense. I am constantly amazed that more designers don't share my very strong feeling that the content ought to heavily influence the design. Now, it may be that Massimo simply doesn't take projects that don't scream out for one of his fraternal quintuplets, but then, that would be pretty lazy. <br> <br>I go through phases wherein I'm more inclined to try a particular couple of faces first (or, like playing too much with a new toy, I overuse cool new fonts I've just bought), but lordy -- to restrict oneself like that just boggles my mind. <br> <br>And finally, I will say that I appreciate John Hudson's comment about letterpress publishers. I can understand that a letterpress craftsperson could focus solely on one face, trying for all time to perfect the use of such face. Still, that is a radically different sort of design than what I and Massimo, my fellow birthday-boy, practice. <br> <br>Now, a list of top-five <i>foundries</i>, on the other hand...</p>
