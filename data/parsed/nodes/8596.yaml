  html: "<p>============================================================ <br>LinoLetter 01/05 - Two contest-winning fonts and one retro  <br>                   classic       <br>============================================================ <br>An online version, illustrated with images of this month�s  <br>featured typefaces, is available on the Linotype website via  <br>the following link: <br>- <a href=\"http://www.linotype.com/8-38-8-18005/issue2005-01.html\" target=\"_blank\">http://www.linotype.com/8-38-8-18005/issue2005-01.html</a> <br> <br>! Linotype wishes all readers a Happy New Year ! <br> <br>INTRODUCTION: <br>News Alert! We have a new program highlight for the upcoming  <br>TypoTechnica conference to bring to your attention: Quark  <br>will present the first public demo of the unreleased  <br>QuarkXPress 7! Come to TypoTechnica and experience this  <br>veteran application's new typographic features live. More  <br>information below ...  <br> <br>In order to ease your plunge into a new creative year, we  <br>rummaged through our library for a pair of great fonts to  <br>recommend, and pulled out two of the winners from our last  <br>International Type Design Contest: Hildegard and Samba.  <br>Hildegard is a contemporary sans serif text face in the  <br>Dutch style. Its cool assuredness in text stands in stark  <br>contrast to the liveliness of its fellow contest-winner  <br>Samba. A new interpretation of Brazilian Art Deco graphics  <br>and lettering, Samba offers a warm, loud feeling  <br>unobtainable in most other typeface designs. Aside from  <br>newer designs like these, we enjoy reintroducing you each  <br>month to our old favorites as well. You may recall that we  <br>featured the types of Lucien Bernhard in our August issue;  <br>this month, we are pleased to present another classic face  <br>from our type archives: Serpentine, a forward-thinking  <br>design from 1972. This retro design has become one of our  <br>decade�s most popular display fonts. To close out this  <br>month�s LinoLetter, we�d like to bring your attention to a  <br>new design guide that we�ve published on our site, an article  <br>entitled \"Pleasures of Design.\" <br> <br>Have fonts of fun! <br> <br> <br>------------------------------------------------------------ <br> <br>IN THIS ISSUE:  <br> <br>1.  Hildegard: Dutch design direct to your desktop <br> <br>2.  TypoTechnica 2005: Experience a live demo of  <br>    QuarkXPress 7's planned typographic features <br>  <br>3.  Samba: Brazilian type with an Art Deco spirit <br> <br>4.  Serpentine: A retro classic and contemporary favorite <br> <br>5.  Learn about type: Our \"Pleasures of Design\" feature  <br>    article <br> <br>____________________________________________________________ <br> <br>1.  Hildegard: Dutch design direct to your desktop <br>____________________________________________________________  <br> <br>Hildegard is a new sans serif text face in the Dutch style.  <br>Upon close inspection, one will discover a world of subtle  <br>angle variation within the letters� structure, loosely  <br>inspired the stroke movements used in calligraphy. The  <br>spaces between these built-up strokes create visible ink  <br>traps at many joints, which play a functional role in aiding  <br>legibility in smaller text sizes, in addition to their  <br>aesthetic role. <br> <br>The Hildegard family of typefaces may be used in sizes  <br>ranging from small text through large displays. Designed by  <br>Jan Sonntag, a German student in the Netherlands, Hildegard  <br>finished second place in the text face category of the 2003  <br>International Type Design Contest, which was sponsored by  <br>Linotype. The Hildegard family includes the following four  <br>font styles: Regular, Italic, Bold, and Bold Italic. <br> <br>Check out Hildegard here: <br>- <a href=\"http://www.linotype.com/6-23-6-17049/hildegard.html\" target=\"_blank\">http://www.linotype.com/6-23-6-17049/hildegard.html</a> <br> <br> <br>____________________________________________________________ <br> <br>2.  TypoTechnica 2005: Experience a live demo of  <br>    QuarkXPress 7's planned typographic features <br>____________________________________________________________ <br> <br>Reserve your chance to experience all the latest in font  <br>technology development, including the first public demo of  <br>the planned typographic features for QuarkXPress 7 at the  <br>TypoTechnica 2005 in London (UK). <br> <br>From February 17-19, type designers and font developers from  <br>around the world will be making their way to London (UK) for  <br>the wide variety of forums, sessions, and workshops. The  <br>conference is also an excellent opportunity to visit the  <br>renowned St Bride Printing Library, and to meet with other  <br>type-minded people. Register today! <br> <br>Click here to see the conference schedule and registration  <br>info: <br>- <a href=\"http://www.linotype.com/8-2358-8/typotechnica2005.html\" target=\"_blank\">http://www.linotype.com/8-2358-8/typotechnica2005.html</a> <br> <br> <br>____________________________________________________________ <br> <br>3.  Samba: Brazilian type with an Art Deco spirit <br>____________________________________________________________ <br> <br>The Samba type was inspired by the lettering art of  <br>J. Carlos, a Brazilian illustrator active during the early  <br>20th century. The sibling duo of the brothers Tony and  <br>Caio de Marco, two contemporary Brazilian graphic designers,  <br>transformed Carlos� work into a series of fonts. They  <br>especially recommend that you try Samba for use in logos,  <br>flyers, posters, and even tattoos! <br> <br>Their family, which includes three separate fonts, offers  <br>the user a chance to mix three complementary styles of  <br>lettering into one coherent design. While Samba Regular�s  <br>characters are made up of mono-line letters, Samba Bold  <br>offers much more thick/thin contrast. Samba Expert�s lavish  <br>swash endings were inspired by Brazilian metal work. Samba  <br>finished third place in the display face category of the  <br>2003 International Type Design Contest, which was sponsored  <br>by Linotype. <br> <br>Take a deeper look into the Samba family: <br>- <a href=\"http://www.linotype.com/7-2244-7/samba.html\" target=\"_blank\">http://www.linotype.com/7-2244-7/samba.html</a> <br> <br> <br>____________________________________________________________ <br> <br>4.  Serpentine: A retro classic and contemporary favorite <br>____________________________________________________________ <br> <br>Dick Jensen (USA) designed Serpentine for the Visual  <br>Graphics Corporation in 1972. Its dynamic and wide  <br>design�identifiable via the letters� small, pointy serifs - <br>is available in six different font styles. Although the  <br>underlying strokes of the three weights are similar, each  <br>member of the Serpentine family has its own individual  <br>personalities. Serpentine Light lends itself well to text  <br>for onscreen displays, for instance, while the numbers from  <br>typeface�s heavier weights are seen around the world on  <br>athletic jerseys. Additionally, the oblique styles convey a  <br>streamlined sense of speed, furthermore lending Serpentine  <br>well to sports applications (especially the faster  <br>varieties).  <br> <br>Because of its retro pedigree, Serpentine has become more  <br>popular than ever during the last few years. The typeface may  <br>be found all over the world in display usage applications  <br>such as logo design, magazine headlines, and party flyers. <br> <br>Sample images of the fonts, as well as more information, are  <br>available here: <br>- <a href=\"http://www.linotype.com/7-2352-7/serpentine.html\" target=\"_blank\">http://www.linotype.com/7-2352-7/serpentine.html</a> <br> <br> <br> <br>____________________________________________________________ <br> <br>5.  Learn about type: Our \"Pleasures of Design\" feature  <br>    article <br>____________________________________________________________ <br> <br>In the Linotype Font Lounge, typographic themes are  <br>highlighted and explained in depth. This feature article  <br>asks what is necessary for creating good print design, and  <br>offers some helpful guidelines along the way. <br> <br>\"Whenever you make or arrange a physical object in a  <br>particular way, you are 'designing' it; whether you are  <br>deciding the length of a bracket to support a bookshelf, or  <br>arranging a vase of flowers, you are practicing design. If  <br>the shelf falls down, or the flowers look a mess, you  <br>clearly haven�t been designing very well - you need to refer  <br>to some established principles to help you get it right.\" <br> <br>Why does design matter? Learn more: <br>- <a href=\"http://www.linotype.com/7-2331-7-17704/whydesignmatters.html\" target=\"_blank\">http://www.linotype.com/7-2331-7-17704/whydesignmatters.html</a> <br>  <br> <br> <br>------------------------------------------------------------ <br> <br>Don�t Forget! <br> <br>Linotype.com offers a wide variety of possibilities that may  <br>help you find the right typeface or font package, as well as  <br>the chance to try the fonts out and make a purchase. Our two  <br>hints for this month: fist, try using our FontIdentifier to  <br>identify typefaces whose name you don�t know. Second, pay a  <br>visit to our Font-Packs page, and view all Linotype Font  <br>Compilations at once!  <br> <br>Font Identifier <br>Answer a few simple questions and the artificial  <br>intelligence of the FontIdentifier will help you find your  <br>font. <br>- <a href=\"http://www.linotype.com/fontidentifier.html\" target=\"_blank\">http://www.linotype.com/fontidentifier.html</a> <br> <br>Font Packs <br>All the fonts you need: Libraries, Compilations, Platinum  <br>Fonts and Font Families as CDs or Download Packs. Save  <br>yourself time and money!  <br>- <a href=\"http://www.linotype.com/5-2164-5/fontpacks.html\" target=\"_blank\">http://www.linotype.com/5-2164-5/fontpacks.html</a> <br> <br> <br>************************************************************ <br> <br>We hope you found this issue of LinoLetter informative and  <br>useful. We would highly appreciate your feedback at  <br><a href=\"mailto:info@linotype.com\">info@linotype.com</a> <br> <br>The next issue of this newsletter will be published and  <br>dropped in your mailbox at the beginning of February. <br> <br>Your Linotype Library Online Team <br> <br> <br>------------------------------------------------------------ <br>Publisher: <br>Linotype Library GmbH <br>Du-Pont-Stra�e 1 <br>61352 Bad Homburg / Germany <br> <br>Website: <a href=\"http://www.linotype.com\" target=\"_blank\">www.linotype.com</a> <br>Contact: <a href=\"mailto:info@linotype.com\">info@linotype.com</a> <br>Phone +49 6172 484-418 <br>Fax   +49 6172 484-429   <br>------------------------------------------------------------ <br>(c) 2005  Linotype Library GmbH</p>"
