  html: "<p>I recently tweaked a 16-member family of fonts for my employer (Mac OS 9 environment). I used Style Merge to make four related families, like so: <br> <br>Family 1: Font/FontBold/FontItalic/FontBoldItalic <br>Family 2: FontCondensed/FontBoldCondensed/FontItalicCondensed/FontBoldItalicCondensed <br>etc. <br> <br>A problem with this was that the font menu in QuarkXPress 4.1 only showed the four main members of the families. The other twelve faces were not directly accessible. <br> <br>I got around this by distributing the additional 12 bitmaps along with the family suitcases. So you could directly select FontBoldCondensed, or you could select FontCondensed and click the Bold button, and either way it worked. <br> <br>A few months later, the head of the IT department saw this, and was unhappy with having two instances of each bitmap font (one inside the family suitcase, and one on its own), although we have not had any problems traceable to this setup. I have been asked to get rid of the additional bitmaps. <br> <br>I don't want to lose the flexibility of direct font selection-- suddenly, everyone in the company will think they're missing twelve fonts. I also don't want to lose the flexibility of merged families-- suddenly, I'll have to go through every layout repeatedly to make sure no one is using the bold or italic buttons. <br> <br>So here are some questions: <br> <br>1) I saw in its manual that TypeTool has built-in font family merging. Would a family merged via TypeTool list all its members in the font menu? <br> <br>2) Does my workaround of using the merged families and the individual bitmaps actually cause any problems, as the IT head suggests? <br> <br>3) If so, why, and if not, why not? <br> <br>4) Does anyone besides me even use Style Merge anymore? <br> <br>Thanks in advance for any light y'all may shine on this. <br> <br>Eric</p>"
  html_clean: "<p>I recently tweaked a 16-member family of fonts for my employer (Mac OS 9 environment). I used Style Merge to make four related families, like so: <br> <br>Family 1: Font/FontBold/FontItalic/FontBoldItalic <br>Family 2: FontCondensed/FontBoldCondensed/FontItalicCondensed/FontBoldItalicCondensed <br>etc. <br> <br>A problem with this was that the font menu in QuarkXPress 4.1 only showed the four main members of the families. The other twelve faces were not directly accessible. <br> <br>I got around this by distributing the additional 12 bitmaps along with the family suitcases. So you could directly select FontBoldCondensed, or you could select FontCondensed and click the Bold button, and either way it worked. <br> <br>A few months later, the head of the IT department saw this, and was unhappy with having two instances of each bitmap font (one inside the family suitcase, and one on its own), although we have not had any problems traceable to this setup. I have been asked to get rid of the additional bitmaps. <br> <br>I don't want to lose the flexibility of direct font selection-- suddenly, everyone in the company will think they're missing twelve fonts. I also don't want to lose the flexibility of merged families-- suddenly, I'll have to go through every layout repeatedly to make sure no one is using the bold or italic buttons. <br> <br>So here are some questions: <br> <br>1) I saw in its manual that TypeTool has built-in font family merging. Would a family merged via TypeTool list all its members in the font menu? <br> <br>2) Does my workaround of using the merged families and the individual bitmaps actually cause any problems, as the IT head suggests? <br> <br>3) If so, why, and if not, why not? <br> <br>4) Does anyone besides me even use Style Merge anymore? <br> <br>Thanks in advance for any light y'all may shine on this. <br> <br>Eric</p>"
