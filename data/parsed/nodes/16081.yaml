    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Ernst F. Detterer</strong></p>
    <p>Ernst Detterer, 1888-1947</p>
    <p>Ernst Detterer was a calligrapher and type designer who worked in Chicago. In 1921 he founded the Printing Arts Dept. at the School of the Art Institute in Chicago which included printing, typesetting and design as part of the curriculum. This was the first school in the Chicago area to offer an alternative to apprenticeship practice in printing training. Among his first students was <a href="/wiki/Robert%20Hunter%20Middleton" class="freelinking" rel="nofollow">Robert Hunter Middleton</a> with whom Detterer designed the Eusebius typefaces based on the 1470 Roman type of <a href="/wiki/Nicolas%20Jenson" class="freelinking" rel="nofollow">Nicolas Jenson</a> for <a href="/wiki/Ludlow%20Typograph" class="freelinking" rel="nofollow">Ludlow Typograph</a>. He later became the Custodian of the Wing Collection of Printing and Typography at the Newberry Library in Chicago. When the Society of Typographic Arts formed in 1927 Detterer was the first secretary of the organization.</p>
    <p>He was considered a follower of Edward Johnston and researched early inscriptional and manuscript lettering. </p>
    <p>He was born in 1888 in Lake Mills, Wisconsin, and died in 1947 at age 59 in Evanston, Illinois.</p>
