    html: |-
      <p>Hi Sam. In the K the arm should be thin and the leg should be thick, not the other way around. That would be the logical outcome of using a broadnip pen to draw the letterforms – think calligraphy.</p>
      <p>There is a very good website about typedesign by Briem here: <a href="http://briem.ismennt.is/2/2.3.1a/2.3.1.01.notes.htm" title="http://briem.ismennt.is/2/2.3.1a/2.3.1.01.notes.htm">http://briem.ismennt.is/2/2.3.1a/2.3.1.01.notes.htm</a></p>
      <p>and a good guide on handwriting/calligraphy here: <a href="http://briem.ismennt.is/4/4.1.1a/4.1.1.1.quick.htm" title="http://briem.ismennt.is/4/4.1.1a/4.1.1.1.quick.htm">http://briem.ismennt.is/4/4.1.1a/4.1.1.1.quick.htm</a></p>
      <p>Hope it helps...</p>
