    html: |-
      <p>Hi Sam, as a first attempt your Meridian is very promising. I do think you might want to have a look at the upper-right corners of letters such as BCDEGOPQR, to me the curve looks too steep. Same thing with the upper-left corners of HIJKLMNUVWXY.</p>
      <p>Also, I know it’s hard to come up with font names but if you intend to put out Meridian on the retail market I think you’d be better off renaming it to something else to avoid confusion with Adrian Frutiger’s own <a href="http://www.myfonts.com/fonts/linotype/meridien/" rel="nofollow">Meridien</a>. </p>
      <p>(BTW: I’ve been in Liverpool for a couple of days last month, nice city!)</p>
