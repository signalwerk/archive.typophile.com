    <p>Hi!</p>
    <p>This is my first post on this Forum and more importantly my first ever attempt at designing a font.</p>
    <p>I've only been working in Illustrator at this point because I don't have any Font software yet (Are there any advantages to working in a specialist font application at this early stage of the design process?).</p>
    <p>I would appreciate it if you would be willing to have a look at my attached document and give me some critique. I'd also like to know if there are any similar fonts to this already - if there are then I don't really want to waste anybody's time.</p>
    <p>I'm hoping to use the font for Logos and possibly some document headings.</p>
    <p>Looking forward to your critique so that I can improve this.</p>
    <p>Thanks in advance!</p>
    <p>Sam</p>
