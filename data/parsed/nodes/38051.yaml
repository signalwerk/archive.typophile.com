      <p>Hi Sam<br>
      You should think about the pen-metaphor used in the construction of the characters. Take for instance K and compare it to the other charaters - it's upside down. In general you should be more consequent with the stem- and stroke widths. Compare eg. M with V. The S is really out of character with the rest, and I think it's because you try to force the squarish concept. Other characters that suffer somewhat from this are BCG.</p>
