    html: |-
      <p>&gt;I’ve only been working in Illustrator at this point because I don’t have any Font software yet (Are there any advantages to working in a specialist font application at this early stage of the design process?).</p>
      <p>I'm not a pro of drawing letters, lots of typophile members are great one, but at my point of view, That depends on your objective. If it is to draw a complete typeface family I' strongly suggest to use a drawing typeface software, you'll take advantage of it's special feature. If  it's to draw some letter for a logo, without any objective of getting a typeface you could continue with Illustrator. I've made the switch from Illustrator to Fontlab, two years ago and I never regret my choice. I continue to work with Illustrator for some specific needs in illustration, but for the typeface I work on, my typeface drawing software is really suit for. For instance, with FL, you'll be able to fix the kerning, the spacing or hinting, some action that Illustrator can not do. Hoping that will help you. Good luck.</p>
