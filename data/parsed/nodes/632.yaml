    html: "<p>I really do not want to avoid the stars completely. One of the reasons is that the agency's main office will be situated in the cinema centre and I would like to make a association to (movie)stars. But I have to agree with Alex about the blured stars when they are too small. So I tried to replace some of the most delicate by dots.  <br> <br>I am presenting four more versions now. I was thinking about making windows on the flying saucer. First I thought that legs won't be necessary then, but now I am thinking about canceling the windows idea. <br> <br>Some questions: <br>Christoph &gt; What purpose could shadow below the stars have? <br> <br>Andrew &gt; What does teleporters look like? <br> <br>Thanx for your comments. <br> <br> <br> <br> <br> <br><img src=\"http://www.typophile.com/forums/messages/29/13024.gif\" alt=\"UFO_logo_version2\"></p>"
