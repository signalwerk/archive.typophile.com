    html: <p>Thanks Andrew for that teleporters. Now I see what you've meant. And, yes, of course there is too much alien abduction suggestion in it. My intention was to make a funny logo with a smell of sci-fi films of the fifties and sixties. This X Files feature might scare most of the possible turists. But I like your drawings so much and I appreciate how much of your thoughts my project deserved. But of course I accept yours and Chris's suggestion about all-dot-logo. I made my own (very similar to your suggestion) version. And I changed the lower leg a bit (the legs seemed too similar, I think). <br> <br>Chris, it is really good you've spoted that UFC. It seems nobody elese (incl. me) did. It really made me think, so, as you can see, I changed the position of that blank space in the upper circle/roof/... Hehe, I really wouln't like to disappoint those who would expect the Ultimate Fighting Championship... About grey colour - I am worried about your screen since there was no grey colour in my posts (or do you maybe own a monochrome display). <br> <br>Thanks Tanya, at least one, who likes the legless version, but everyone (inc. my client) say that it looks like a car wheel. So I have to cancel it, even it maybe could look good. <br> <br> <br> <br> <br><img src="http://www.typophile.com/forums/messages/29/13071.gif" alt="ufo_v3"></p>
