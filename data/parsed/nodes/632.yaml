    html: <p>I like the idea of rotaing the mark in space, as it were; it feels much more other-worldly hovering like that. <br> <br>Integrating the type into the mark is (almost) always a bad idea. It immedaitely limits the versatility of the logo in terms of scale. I.E. the"travel agency" type becomes illegible when the logo is reduced even to a reasonable size. Also, reversing the type out of the beam is a bit contrived, no? <br> <br>I'd suggest letting "UFO" just be on its own - it's much more confident representation of an enigmatic name. If you want to include the descriptor, let it live somewhere else (the bottom or side of a letterhead, tha back of a card or t-shirt, the wall of the office, the title bar of a web browser, etc.)  <br> <br>Just some thoughts. <br> <br><img src="http://www.typophile.com/forums/messages/29/13321.gif" alt="UFO"> <br> <br></p>
