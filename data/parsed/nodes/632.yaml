    html: <p>I was referring to old sci-fi films. Star Trek comes to mind,as the crew beams to and from planets. It ocurred to me that the landing gear on your saucer looked a lot like a projection that a flying saucer might use to beam someone onto the vessel.  <br> <br> There is of course the issue of alien abduction, <br>and do you really want to associate that with a travel agency? <br> <br>The logo and stars in full b/w looks better. granted the swoosh ties in well with travel. <br> <br> I'd just like to see the stars become as simplistic as possible. I feel the amount of shapes in the swoosh compete for attention with the main mark.  <br> <br>here are a few quickie's of what i meant, but probably you'll just want to refine your current <br>direction. <br> <br><img src="http://www.typophile.com/forums/messages/29/13032.gif" alt=""><img src="http://www.typophile.com/forums/messages/29/13033.gif" alt=""></p>
