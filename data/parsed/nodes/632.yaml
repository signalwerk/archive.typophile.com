    html: <p>I keep seeing hood / roof / top / Apex??? of the saucer as a lowercase c... is anyone else having that problem??? so as far as that goes, (reading UFC) I think I like the top of the saucer should be either closed complely ( no breaking space) or rotated so that it doesnt appear as a c....  <br>Afterall, someone looking for the Ultimate Fighting Championship would be pretty disappointed when they found out it was a travel agency.. <br>As far as the stars go, I dont think they  really fit with the rest of the design, sorta look like an afterthought.... I get the whole movie star thing since you explained it, but that may be a bit too cryptic for someone just looking for a travel agency.... maybe if you replaced them all with the planet dots????? and moved the swoosh form up a little higher so they are symmetric to the diagonal axis of the pod..... <br> <br>I honestly think it would be okay without the stars though..... are they going to want any sort of text below the logo on signage??? <br> <br>Also I liked the initial grey that you used better than the solid black....its reminds me of the moon, or maybe the sleek polished metal you imagine spaceships to be made of</p>
