    <p>Hi all,</p>
    <p>Im looking for a geometric sans that I believe I've seen somewhere once.  The lowercase a was distinctive in that it had a straight crossbar above the counter, and no curl at the bottom right.</p>
    <p>I've edited the a of Akkurat to give you a better idea, and it does come very close to what I once saw.</p>
    <p>thanks for the help!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/a_3959.jpg"></div><p></p>
