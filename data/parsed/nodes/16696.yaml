    html: |-
      <p>I guess em2 solutions, the vendor of GlyphGate, is better at software development than it is at marketing. It’s a beautiful technology. It comes with an optional browser plugin. When the user installs it, he can get arbitrary designed-specified fonts (as “embedded fonts”) on any browser: Opera, Firefox, Safari, IE. Without the plugin, IE/Win users get embedded fonts while users of other browsers get either plain text set in a standard fonts or text rendered into bitmaps — all depending on how the designer sets up his own GlyphGate configuration. </p>
      <p>It even supports hyphenation on the web if the browser principally supports it. E.g. you can set it up the way that IE/Win users get hyphenated full-justified text while users of other browsers get left-aligned unhyphenated text. </p>
      <p>It’s just so much better than anything that the script kiddies with their funny Flash applets have ever come up. </p>
      <p>A.</p>
