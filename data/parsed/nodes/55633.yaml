    <p>In continuation of <a class="freelinking external" href="http://typophile.com/node/54931" rel="nofollow">this</a> and <a class="freelinking external" href="http://typophile.com/node/55032" rel="nofollow">this</a> threads - I'd very much like to hear any thoughts or impressions on these two versions of the mark. </p>
    <p>It is for a logo <em>and</em> an application icon for a file backup software called Bvckup. The mark is based on the V and it is meant to resemble flipped over A as well as incorporate a form of an arrow indicating a motion (of either stashing the files or recovering them).</p>
    <p>Thoughts ? Good/bad/blah/interesting/unremarkable/etc ?</p>
    <p>Thanks</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/bvckup-2-b_5257.png"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/bvckup_4998.png"></div><p></p>
