    html: |-
      <p>Ha, a "V1". Interesting, never saw it before you mentioned it. In the Serif thread someone said a "fishing hook", which was spot on, but also didn't occur to me at all before that.</p>
      <p>For the second version I hoped that since the arrow is enclosed, it would refer to "stashing" of the data. Also the downward motion should associate with affixing or bolting something down, which in turn refers to the permanency, reliability and such. Not sure if the mark evokes any of these associations at all though...</p>
      <p>In any case, I thought I'd post the full set. I personally like 2a, 1a, 3b and 1d, in this order. </p>
      <p>The triangle based versions (esp. 1D) is a rendering of the "shield" concept, but again not sure if that's evident.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/jc-marks_4169.png"></div><p></p>
    html_clean: |-
