  html: |-
    <p><code>[FATAL]  cmap{plat=3,script=1,lang=0}: multiple glyphs uni2126 Omega mapped to code &lt;2126&gt;<br>
    ERROR: There was a problem while compiling OpenType font. Final .otf font is not saved. Please, check OpenType features definition for errors</code></p>
    <p>Once more I am confronted with an error in FontLab, which I don’t entirely understand. Especially the help suggestion is entirely useless. I understand the issue is caused by “multiple glyphs” with the unicode 2126, but how do I find, identify and eliminate the duplicate entry if it isn’t showing up in the glyphs list? How do I know which is the right associated character, which is the original and which the duplicate?</p>
    <p>I love some features of FontLab, but its approach and mysterious ways are really frustrating sometimes. It shows that this software is quite old, compared to modern applications. Glyphs, a relatively new app, shows promise, but I can’t justify to dash out another $329. Designing fonts is a passion of mine and I understand virtually no one can live from it (except maybe H&amp;FJ and a few others)…</p>
    <p>If you know a solution to my second FontLab error I cannot fix alone, please let me know.</p>
