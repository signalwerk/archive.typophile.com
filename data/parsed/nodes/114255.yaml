    html: |-
      <p>In FontLab, go to windows &gt; panels &gt; classes. Anything there? If there is, even though you don't use it now, Font Lab expects it and will give you an error message. You can't just whisper your intentions in it's ear, you know. (Well you can, but your success rate is going to be <cite>really</cite> low...)</p>
      <p>You'll have to tidy up your classes. Easiest way, as I said in the build forum, is to set things so the classes are a part of the features, write off the features to a simple text file, and check that everything there is still valid. Next, clear both the classes and features in the FontLab file, then read the features back in, and compile.</p>
      <p>Or tidy things up in the FontLab (file) itself.</p>
