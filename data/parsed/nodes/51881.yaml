    <p>My Quark officially bit the dust yesterday so I am finally jumping ship.</p>
    <p>I have been using InDesign (ID) for &lt;24h.</p>
    <p>From my experience in the old days, I understand that when creating a typeface in a piece of software like Fontographer, you could pre-determine kerning pairs.</p>
    <p>In ID, when I look at the kerning options, there are three choices:</p>
    <p>1. Optical<br>
    2. Metrics<br>
    3. None</p>
    <p>I understand that optical takes advantage of an algorythm in ID which attempts to counterbalance the negative space between glyphs based upon the typeface itself. Serif’s and all.</p>
    <p>It is very important that I recreate materials using the type designers original kerning pairs, not ID’s interpretation of what it considers “good” kerning to be, and not all kerning pair set to zero.</p>
    <p>Repeat, I need the text to be set using the original type designers kerning pairs.</p>
    <p>Do I do this by using “metrics” or “none?”</p>
    <p>Adobe technical support was unable to answer this question.</p>
    <p>Thank you.</p>
