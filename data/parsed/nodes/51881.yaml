      <p><cite>Adobe technical support was unable to answer this question.</cite></p>
      <p>I am stunned. <a class="freelinking-external" href="http://livedocs.adobe.com/en_US/InDesign/5.0/help.html?content=WSa285fff53dea4f8617383751001ea8cb3f-6e0a.html">The online help</a> explains it quite obviously, and under the help item “Kerning and tracking” as well!</p>
      <p>In short, <strong>Optical</strong> uses ID’s build in system, and — reportedly — works best with large type. It kinda gets slow for running text, but according to people in the know, it adds too much space.</p>
      <p><strong>None</strong> puts no extra space inbetween characters (or takes it out), so, essentially, all that’s left is the space that’s in the letter boxes itself. Kind of what you’re seeing in your browser.</p>
      <p><strong>Metrics</strong> “uses kern pairs, which are included with most fonts” (yeah, that’s what the help sez!), and this is what you obviously want: just what the designer decided, no more no less.</p>
      <p>For Quark there was this plugin (oh yeah, sorry: ’XTension’) that allowed you to create custom kern tables for fonts, but sadly, ID lacks this and nobody who can write plugins cares enough to write one.</p>
    html_clean: |-
