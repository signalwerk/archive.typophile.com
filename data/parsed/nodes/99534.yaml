    date: 2013-01-10T00:37:00
    date_raw: 10 Jan 2013 — 12:37am
    votes: null
    html: <p>I suspect the "502" is a typo, perhaps for "302". This is a bibliographic statement of the length of the book, not a page reference to specific information. As I understand the sentence by Ponot that interests you, he is simply saying that Fertel did not provide any classification of types because he restricted his discussion solely to the style of type created by Jenson (i.e., old style Roman).</p>
  - id: 537298
    user: 21768
    date: 2013-01-10T01:35:00
    date_raw: 10 Jan 2013 — 1:35am
    votes: null
    html: <p>Okay. That is certainly simple enough. I suppose I expected that there would be a passage where Fertel would have referred to the Roman form directly in some manner - not in terms of classification, or some commercial name, but in some other antiquated parlance...</p>
  - id: 537302
    user: 12518
    date: 2013-01-10T02:56:00
    date_raw: 10 Jan 2013 — 2:56am
    votes: null
    html: <p>Depends what you're looking for. On a quick skim through the first chapter of Fertel, which appears to be the main section devoted to the particulars of type, he discusses sizes of type, arrangement of type cases, and copyfitting, as well as the use of various specialized kinds of type like Greek letters, quads, drop caps, italics, and ornaments, but I didn't see anything about letterforms as such.</p>
