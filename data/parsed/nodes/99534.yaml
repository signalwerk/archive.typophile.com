  html: |-
    <p>Briefly, I'm doing some lite research working with a number of documents I can't actually read...<br>
    Don't let the name fool you, I'm no francophone; and while I can't actually read any of these Czech, French, Italian and German articles I come across, Google has been helping me suss them out with some degree of reliability.</p>
    <p>What I'm really looking for is further information about the first footnote of <a class="freelinking external" href="http://www.persee.fr/web/revues/home/prescript/article/colan_0336-1500_1989_num_81_1_1115" rel="nofollow">this article by René Ponot</a>:</p>
    <p><em>1. Martin-Dominique Fertel, La Science pratique de L'imprimerie (The Practical Science of Printing), Saint-Omer, 1723, 502 p. Index.</em></p>
    <p>I've found multiple printings of <a class="freelinking external" href="http://polib.univ-lille3.fr/?q=fr/B590092101_000000002.597" rel="nofollow">Fertel's work online</a>, and despite page numbers suggesting otherwise, they all seem to appropriately terminate around page 350 or so... I thought the footnote might have been transposed in some way, but I can't seem to find the information I'm looking for.</p>
    <p>As I've Google'd-out the translation from Ponot article, I'm under the impression that there is some specific typographic advice regarding Jenson types... and I wonder what it is... on this missing/transposed "502 p."?</p>
    <p>{The need for classification has not been required since the invention of typography, as the number of types was once insignificant. In the first treatise of known printing (1723), Fertel 1  provides advice reserved to one type of character, established three centuries earlier by Nicolas Jenson...}</p>
    <p>Any help with this appreciated, please... I must know.</p>
    <p>For extra credit, I'm looking for a copy of Novarese's 'Alfa-beta' - in Toronto that I could purchase/borrow or otherwise acquire a few<em>legible</em> photographs of.</p>
    <p>best always.</p>
