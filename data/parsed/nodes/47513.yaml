      <p>"what would be a reasonable licensing fee if it were a more front-facing use?"</p>
      <p>We can not give you a specific number that will mean anything. I could say $10 and it would be as valid as suggesting $10000.</p>
      <p>What, specifically, are the products they are going to use the font on? How are they using the font on them? Is it 600 units total for ever more? How much are they selling each unit for? How big is the company that wants to use it? Who are they selling to? What does your current font license state in terms of using it for products? Have they made an offer? Do they want exclusivity? These are all questions (and there are more) that would need to be addressed before any real numbers could be given that would be of any use.</p>
