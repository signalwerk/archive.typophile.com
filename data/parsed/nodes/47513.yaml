      <p>There isn't a standard, and there isn't one answer. I hope you finally have absorbed that. Don't get too testy about jokes; they aren't going to stop. Notice that not all of the jokes are at your expense. We like to have fun. </p>
      <p>If you place no value on the font, you might just reply with "Oh gosh it's freeware, thanks for thinking of me but just go ahead and use it". Or, if you want it to take on a new life as a retail product, revise it with more glyphs and better kerning, or other weights, or other added value, and launch that as a pay product with an explicit license. And the license/pricing for that is also completely up to you. Even after asking all the questions mentioned above, there are decisions only you can make.</p>
