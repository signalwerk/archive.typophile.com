    html: <p>I've actually been in this situation. I've released a few fonts as freeware several years ago, and every once in a while I'll get an inquiry of one sort or another regarding this sort of use. I didn't include a detailed EULA, but rather a simple read me file suggesting that they were free for commercial and personal use. I did include a recommendation, but not a requirement, that if the fonts are used in a commercial project that I should be sent a copy of the finished product, which I have received from time to time. Not much, mind you. I got a Hungarian video game, a badge made by a Finnish language teacher in Russia, a French Jazz CD, and a ghastly church newsletter. Only once did I get a payment, which I think was insisted upon by the legal department on their end, for a token sum of $80 for embedding in another video game which I've never heard about since. At least I got the check. If I'd really been thinking about it at the time I could have easily charged them more, but yeah, I had already declared it a free product, so they weren't obligated to offer me anything, at least that's how I felt at the time.</p>
