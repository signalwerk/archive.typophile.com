    html: |-
      <p>How are they going to use it on the "products"? If it is going to add a lot of value to that product then you should charge a reasonable licensing fee. You could calculate that as a price per unit, or a price for use on up to a certain amount of units. Or, you could charge them a yearly fee to license the font software.</p>
      <p>Unfortunately by initially releasing the work as freeware, you have put yourself in a difficult position to now attach any real value to the work.</p>
