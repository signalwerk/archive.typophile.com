    <p>After my talk in for ATypI this past October on the Jim Rimmer film project, several people came up to me and asked what they could do to help me finish the film.</p>
    <p>I have decided to set up this somewhat unusual fund raising method to help with the finishing of the film. It is asking for donations but those donations are basically pre-ording things that could be bought in the future anyway.</p>
    <p><a href="http://kck.st/aTulSg" title="http://kck.st/aTulSg">http://kck.st/aTulSg</a></p>
    <p>Thank you for your consideration</p>
