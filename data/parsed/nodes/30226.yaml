      <p>A common application of such fonts is for stroke based font formats, still popular for EA languages where file size savings are important. </p>
      <p>In addition such formats were used in the old days for pen plotter printing devices. Similar technology is used today in engraving and lazer etching devices. </p>
      <p>Another obsolete use of this type of font was in coin-op arcade games such as Asteroids (the first game to use Atari's "Quadra-Scan" vector-refresh technology) and Tempest. </p>
      <p>Assuming you're producing some outlines for this type of work you might want to ask the people you're working for which tools they'd recommend.</p>
