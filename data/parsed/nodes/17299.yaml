    <p>I missed Paul Hunt’s August post on this problem and stumbled upon it myself. I submitted an entry for Barnhart Brothers &amp; Spindler a while back and could still get to it doing a search, but none of the links to it worked. Evidently the ampersand is the problem and causes the name to truncate oddly. The fix is as follows:</p>
    <p>barnhart_brothers_and_spindler|Barnhart Brothers &amp; Spindler</p>
    <p><a href="/web/20081013184638/http://typophile.com/wiki/barnhart_brothers_and_spindler" class="wiki-create">Barnhart Brothers &amp; Spindler</a></p>
