      <p>In Futura the uppercase "A" is wider, the circular part of the lowercase "a", "d" and "p" has much greater contact with the vertical stroke than in this typeface, and the dot of the lowercase "i" is higher than the top of the lower case "t". There are lots of similar typefaces out there that seem to be variations of this simple, geometric construction, of which this seems to be one of the purest and to me most elegant. The recent Stylor JNL and the common Century Gothic are two that share many traits. You are correct that the spacing between letters is probably just an artifact of the typesetting. In my sample the lowercase "p" and "e" are actually touching in the letterhead.<br>
       Ray</p>
