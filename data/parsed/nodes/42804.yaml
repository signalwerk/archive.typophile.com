  html: |-
    <p>This typeface was used for a letterhead by a local (Massachusetts) printer in the early 1970's. It was said to have been similar to a typeface seen in Avant Garde magazine. The printer is still in business but the current personnel do not know the source. I suspect it is a phototype typeface that has not been digitized. I have not been able to search PLINC catalogs yet and have not found it on the various online sources or in the few standard references that I have been able to check. What is very distinctive about this typeface beyond the delicate, condensed spacing is the narrow uppercase "A" with relatively high crossbar, the narrow, straight lowercase "t", the absence of a spur on the lowercase "u" and how the circular parts of the lower case "p". "a" and "d" just barely touch the vertical parts of these letters. We have an additional sample of this typeface with a few more letters not shown in the image given here. If anyone has a name or source for this typeface, we would be much obliged. Otherwise we will attempt to recreate a digital version with some font software that we have.<br>
     Thanks much,<br>
     Ray</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/MysteryFont_4292.jpg"></div><p></p>
