    date_raw: 27 Jan 2009 — 9:52pm
    votes: null
    html: "<p>Note: 'pause between parts of a sentence'. It isn't a very good definition, but it at least gets the notion that what a comma indicates is the structure of the sentence not a pause per se. When we talk, we punctuate structure with pauses, so commas in writing and pauses in speaking serve parallel purposes. The sequence of words 'yes we can' may be uttered as either a single clause or as two clauses: 'yes we can' or 'yes, we can'. How we read those two versions differs, as does how we would say them, both in terms of pause and emphasis. I watched again Obama's election night speech on YouTube, and it seemed clear to me that he was saying 'Yes we can', not 'Yes, we can'.</p>"
    html_clean: "<p>Note: 'pause between parts of a sentence'. It isn't a very good definition, but it at least gets the notion that what a comma indicates is the structure of the sentence not a pause per se. When we talk, we punctuate structure with pauses, so commas in writing and pauses in speaking serve parallel purposes. The sequence of words 'yes we can' may be uttered as either a single clause or as two clauses: 'yes we can' or 'yes, we can'. How we read those two versions differs, as does how we would say them, both in terms of pause and emphasis. I watched again Obama's election night speech on YouTube, and it seemed clear to me that he was saying 'Yes we can', not 'Yes, we can'.</p>"
