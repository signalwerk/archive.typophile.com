    <p>In the spirit of the incoming administration, Plural Design is inviting fellow designers to participate in the YES WE KERN tee contest.</p>
    <p><strong>///  DESIGN THE "YES WE KERN" TEE</strong><br>
    Design a tee using the statement: YES WE KERN</p>
    <p><strong>///  HOW TO SUBMIT AN ENTRY</strong></p>
    <ol>
    <li>Download the <a href="http://pluralplural.com/tee/YesWeKern_Tee-Template.eps" target="_blank" rel="nofollow">Tee Template</a></li>
    <li> Design your tee.</li>
    <li>Suggest a shirt color from the list of American Apparel. Colors are included in the file.</li>
    <li>Keep number of inks to a maximum of 4.</li>
    <li>Turn all your fonts to outlines.</li>
    <li>Convert to vector EPS</li>
    <li>Name your file: YesWeKern_FirstName_LastName.eps</li>
    <li>Compress the Illustrator EPS file with Zip or Stuffit.</li>
    <li>Email the file to <a href="mailto:hello@pluralplural.com" rel="nofollow">hello@pluralplural.com</a> on or before <strong>Friday, February 20th 2009</strong></li>
    </ol>
    <p><strong><br>
    ///  CONTEST TERMS</strong></p>
    <p>By participating you pledge that your work is of your own design and further, that fonts, images or other rights-protected material used in your design are licensed for such use by you or the organization you represent.</p>
    <p><strong>Judging  /// </strong>This is going to be a democratic contest. Entries will be posted on the Plural blog and judged by the visitors of the blog. Voting will start on Monday February 23rd 2009</p>
    <p><strong>Copyright Retention  /// </strong>Participants (those who submit entries to Plural) grant Plural permission to use the artwork/design for promotional use, including a t-shirt, as Plural see fit, for applications including but not limited to apparel. Any mentions of products or promotional items will be accompanied by proper credit to the designer (in online product listings, etc). Participants retain copyrights and Plural agrees not to sell or transfer usage rights. (This means, Plural don't require exclusive rights, just unlimited usage.)</p>
    <p><strong>Prizes  ///</strong> The winner will receive 2 tees of the winning design in his or her choice of sizes [S,M,L,XL]. The finished design will be appropriately credited with the winning designer's name or company name.</p>
    <p><a href="http://pluralplural.com/blog/wp-content/uploads/2009/01/yeswekern.jpg" rel="nofollow"><img class="alignnone size-full wp-image-358" title="YesWeKern" src="http://pluralplural.com/blog/wp-content/uploads/2009/01/yeswekern.jpg" alt="" width="325" height="400"></a></p>
    <p><a href="http://pluralplural.com/blog/wp-content/uploads/2009/01/yeswekern.png" rel="nofollow"><br>
    </a></p>
