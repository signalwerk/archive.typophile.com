    html: |-
      <p>Commas aside, here is the deal: we (Plural) talked extensively about what else to offer the winning entry, or what to do with the proceeds of sales. We thought about giving the proceeds to a charity, to promote design, or to share it with the winner.</p>
      <p>We just did not come to a conclusion. And we don't have any money. So if you have suggestions of what to do, if the shirt actually sells, we would love to hear from you. Leave your comment here or on the Plural site. And we will make an update with where the money from the sales will go.</p>
      <p>We can also leave that up to the winner to decide.<br>
      If the shirt sells: money goes to<br>
      a) his pocket<br>
      b) someone else's pocket</p>
      <p>We don't want to rip any one off, we just don't have any thing else to give. Other than bragging rights, and a cool shirt.</p>
      <p>Hope to see some of these tees in the contest, they are awesome.</p>
      <p>Now, according to Bergie, I am a bastard that rips off designers. And, since I am a designer myself, I should try self-respect, sometime, to stop ripping myself off.</p>
      <p>– Renata</p>
    html_clean: |-
      <p>Commas aside, here is the deal: we (Plural) talked extensively about what else to offer the winning entry, or what to do with the proceeds of sales. We thought about giving the proceeds to a charity, to promote design, or to share it with the winner.</p>
      <p>We just did not come to a conclusion. And we don't have any money. So if you have suggestions of what to do, if the shirt actually sells, we would love to hear from you. Leave your comment here or on the Plural site. And we will make an update with where the money from the sales will go.</p>
      <p>We can also leave that up to the winner to decide.<br>
      If the shirt sells: money goes to<br>
      a) his pocket<br>
      b) someone else's pocket</p>
      <p>We don't want to rip any one off, we just don't have any thing else to give. Other than bragging rights, and a cool shirt.</p>
      <p>Hope to see some of these tees in the contest, they are awesome.</p>
      <p>Now, according to Bergie, I am a bastard that rips off designers. And, since I am a designer myself, I should try self-respect, sometime, to stop ripping myself off.</p>
      <p>– Renata</p>
