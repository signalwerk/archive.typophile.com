      <p>I feel  your original concept has a lot of possibilities, and your "view 2" is the one I like best, although the very slight difference in angle of the strokes in view 2 (caused by perspective) bothers me as it's so slight that it almost looks like a rendering error. I know its deliberate, but try making them truly parallel and see if that helps.</p>
      <p>I wouldn't make the strokes any thinner than they are in view 2, as when they become thinner (like in view 1) they start resembling a weird pitchfork.</p>
      <p>You might find this article on logo trends helpful as it shows several examples (in the "Hexahedron" section) of 3D shapes rendered with translucent elements, similar to what you're doing:</p>
      <p><a href="http://www.logolounge.com/logotrends/" title="http://www.logolounge.com/logotrends/">http://www.logolounge.com/logotrends/</a></p>
