      <p>I think awsamosa's submission to the forum is simple. The examples you gave, however, in my opinion, the way I see things, are not really simple; just dismissive of any thought, lazy. When I look at those I just think the designers, whoever they are, were only giving in to a trend, and one which, as is common with trends, is so diluted that might have lost its meaning and strength. I'm familiar with MVRDV and their work and have thought about their logo before and “criticized” it to friends precisely because of this, because I think the logo doesn't do them justice at all; the other ones I wasn't familiar with, but still, only one of them wasn't following that same pattern, and I considered that one still not unique enough to be remarkable.<br>
      I don't see any real thought put into those, and I see some thought put into awsamosa's mark. That's how I was disagreeing with what you said. I wasn't criticizing you, I was just trying to show awsamosa another way of looking at what was on the table. This isn't about you…<br>
      I'm sorry if I didn't make myself clear and if I in any way came off as offensive towards your opinion and ideas.</p>
      <p>That being said, I'd like to emphasize that I was once asked to design a logo/mark for an architect friend and I think awsamosa's idea isn't exactly new and wonderfully original (I thought about something along those lines, too, but with far less success), but I do think it does easily beat grotesques in all caps. (BTW, that project of mine is still unfinished business precisely because of the challenge this can be and also because it really wasn't that urgent.)</p>
