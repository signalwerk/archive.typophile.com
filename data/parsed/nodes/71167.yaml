    html: |-
      <p>Yeah, I love the idea, but I'm usually partial to that kind of idea so there's that. But it seems to me that it has to be further developed. Somehow, something's missing; I see it as not yet strong enough.</p>
      <p>I also don't think blkkkkk's examples are great… in fact, I think they're all pretty weak when compared with something like what you're showing, in terms of concept and of graphic strength and interest. But again, and as aluminum said, I'm “bored” with this constant use of industrial-like grotesques in all caps. It screams nothing. It's like shouting silently or with nothing to say. It's just lifeless. It kind of plays along with a sense of nihilism which is common in this day and age – and which I thoroughly understand but usually try to fight –, like it's saying “life has no meaning and nothing really matters; I'll scream, but I won't ignore that”. But that might be what you're looking for and it does have its uses, of course. </p>
      <p>So I'd somehow play around with your idea a bit more. Maybe try to make it something like the second alternative but strengthen the notion of it being a volume, which might not be readily seen the way it is now.</p>
      <p>But, if you're aware of the possible shortcomings of what you've got there, such as the one I said and the fact that the letters might not be immediately perceived, and that's what you were going for, then I think you could probably stick with that second one and leave it at that. Then maybe you could make some use of the first one in developing the mark to make it stronger and wider-ranging in some application, but I think the second could be a final stand-alone mark. Just remember that if you're going to add text to that then you'll probably need to use some thin type that doesn't overpower the mark.</p>
