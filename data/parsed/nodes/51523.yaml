      <p>Saad, many thanks for your detailed and authoritative explanation.</p>
      <p>After a short research I did a few days ago I understood Naskh (as a typeface) is on the same plane as our most classically proportioned Latin seriffed faces (i.e. the original Garamond, Jenson etc.),<br>
      so I guess Tomas Milo's Naskh 2007 is the last word in first class classical typography… :=)<br>
      And this is extremely interesting. Historically there seem to be no apparent reason for which scripts get connected, apart from the need of writing faster.<br>
      Capitalis Rustica and Uncials originated around the 4th-5th century AD out of the need of having an alphabet for common writing tasks. At the same time Latin letters had another development as they were used for side-notes to the inscriptions, and very quick writing, with pointed pen or stylus on papyrus or wax. But then, after many variations and an incredible richness of connected scripts, Latin affirmed itself as an unconnected alphabet in print (this may largely be connected to the practical aspect of this, as Karsten pointed out in another thread).</p>
      <p>What you say about whether Naskh or Kufi came first is super-interesting, since our calligraphic forms evolved necessarily from inscriptions.<br>
      Do you know if this early Kufic style/Hijazi Jazm was used in inscriptions and relevant writings, both in pre-islamic Arabia and in important applications, literary or religious. Was that mostly an exposed writing (like in stone inscriptions) or used on vellum and other support for literary puroposes? I see from your reply to Milo there are very few resources about this material, do you know where I could find something?</p>
      <p>Many thanks for taking your time for replying. I see it's incredibly complex, and I don't know if I'll be able to get to the roots of Arabic, but I love the alphabet.</p>
