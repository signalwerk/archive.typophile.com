      <p></p><div class="imageWrap"><img src="http://typophile.com/files/mail_final_ayn_6442.gif"></div><br>
      .<p></p>
      <p>Hi Tom</p>
      <p>'Ayn in Jazm, as evidenced by stone inscriptions, was clearly an Aramaic Nabataen 'Ayn. Due to very few pre-Islamic inscriptions available, there is no sample of how final 'Ayn appeared centuries before Islam, but we have sample of middle and initial 'Ayn which were clearly Nabataen like. 'Ayn in Musnad was a small circle.   </p>
      <p>Unlike early Quraic Kufi, the so-called Ma'il ( ) style used for Quran in Hijaz show final Ayn is also a Nabataen shap.  See final Ayn above in the boxed word سريع from (Surat al-Nur, Ayah 40). Compare to final 'Ayn of typical Early Kufi. This 'Ayn and other analysis of Ma'il convinced me that the so-called "lonely and obscured" unexplained Hijazi Kufi Mai'l style found in modern days belongs actually to the first half century after Islam, not 150 years later, as it is told now in textbooks. In a way, Ma'il is the missing link between Jazm and Early Kufi, it was probably the first attempt to distinguish Jazm for Quraan from typical Jazm, that was abandoned in favor of early Kufi.</p>
      <p>In my modern typographic Jazm, I have selected Ma'il style final 'Ayn for my Jazm font and early Kufi final 'Ayn in my Jazm Quran font (see initial post image).</p>
      <p>-Saad</p>
