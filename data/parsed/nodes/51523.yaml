      <p>For reference regarding Naskh and Kufi, a good place to look is paleography though of a slightly later date. Early handwritten notes on papyrus (early 8th century) were very similar to the manuscripts written on parchment.</p>
      <p>A great book to read is:<br>
      Khan, Geoffrey<br>
      Bills, Letters and Deeds: Arabic Papyri of the 7th to the 11th centuries<br>
      Part of The Nasser D. Khalili Collection of Islamic Art<br>
      Oxford; Nour foundation, 1993</p>
      <p>He writes: "The script current in documents of the 3rd and 4th centuries AH can be distinguished by...two traits: One was a formal development in which the shapes of the letters became more rounded, even in examples executed with the greatest care, it can therefore be classed as a change in script competence. The second, which may be seen as marking a general decline in script performance, was the increased frequency with which cursive tendencies occurred. These may be identified as follows:<br>
      1- The transformation of angles into curves.<br>
      2- The transformation of curves into straight strokes.<br>
      3- The elimination of the necessity to remove the pen from the surface of the papyrus.<br>
      4- The reduction of the distance covered by the pen.<br>
      At least one of these factors played a part in the formation of cursive letter forms.”</p>
      <p>Khan also provides visual analysis to back up his arguments (p.40-42)</p>
      <p>And again he writes: “In general, it can be said that the script of the papyrus documents written in the first 2 centuries of the Islamic era bear a certain resemblance to the contemporary monumental styles found in inscriptions, on coins, and in Quoranic manuscripts, especially those in the hijazi script1.”</p>
      <p>Adolf Grohmann, reknown expert on the topic, sais,” In the first half of the IInd century of the Higra the script begins already to change into more roundish characters... S. de Sacy and after him E. Sachua as well as R. Lepsius qualified the script as Naskhi which is, of course, not quite right, but might be justified as a sort of auxiliary characterisation for this more flexible script.”</p>
      <p>Grohmann, Adolf<br>
      From the World of Arabic Papyri. Cairo; Royal Society of Historical Studies, 1952</p>
      <p>This is part of the research I did at Reading into Early Kufi. I hope this helps.</p>
