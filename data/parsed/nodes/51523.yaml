    Dear all<p></p>
    <p>I would like to share with you my latest font family, Jazm.  The old Arabic Jazm script was the remarkable ancestor of modern Arabic script which was probably derived from old Arabic Musnad and influenced heavily by the Aramaic Nabataean script widely used in North Arabia.</p>
    <p>My font, Jazm, is a modern typographic vision of the Jazm script, not a replication of it, designed along the principles of my Mutamathil style.  It has three members, Normal, Bold, and Black.  A fourth member is Jazm Quraan, which is a slightly modified version of Jazm Black.  Based on my research article about the history of the Arabic script, which will be published very soon, I have concluded that Early Kufi or Quranic Kufi is nothing more than a heavily bolded version of the Jazm style used in Hijaz, which was specifically utilized to distinguish the glorious Quraan passages from normal texts, a practice used by all other religious books of the area then.  That includes the so-called Ma’il style, which I believe was used much earlier than it is claimed now.  As for the use of Kufi to name the old style, this was probably done much later in Baghdad. My conclusions are based on examination of hundreds of old manuscripts and stone inscriptions. </p>
    <p>Notice how the Jazm script was a true “simplified” Arabic style utilized long centuries before Linotype!  Clear and remarkable horizontality, minimal shapes per letter, and as it was the case with Nabataen, connectivity seems to be very basic. Shapes are mainly connected as is, with minimum transformation.  On the other hand the heavy Jazm used for Quraan later, included ligatures and more alternative shapes.  The rules for Yaa’ alone are so fascinating! Also notice changes for Ayn and Qaf. Here is a PDF link:</p>
    <p><a href="http://arabetics.com/public/Arabic_Jazm.pdf" title="http://arabetics.com/public/Arabic_Jazm.pdf">http://arabetics.com/public/Arabic_Jazm.pdf</a></p>
    <p>-Saad</p>
    <p><a href="http://arabetics.com" title="http://arabetics.com">http://arabetics.com</a></p>
