      <p>Hello Claudio</p>
      <p>&gt;&gt;Could you tell me which forms are perceived as more classical and, laterally, more authoritative, in the Arabic?</p>
      <p>Naskh and Kufi, are the two main historical original classical old Arabic styles. Both are modernized and utilized today, but Naskh is by far the most popular. Almost 90% of all historical calligarphic styles were derived from Naskh.  However, fourteen centuries later, Arabic historians are still debating whether Naskh or Kufi came first. Many believe they were originated independently, probably in two different geographical locations.  I think Naskh was directly derived from early Kufi, which I am refering to here as "Hijazi" Jazm, the name pre-Islamic northern Arabs used for their Arabic script to distinguish it from "Musnad", the Arabic script that was widely used in the peninsula, but was later replaced by Jazm after Islam. </p>
      <p>Several forms of the earliest Jazm and early Kufi scripts are not utilized today in the daily script usage.   </p>
      <p>-Saad</p>
