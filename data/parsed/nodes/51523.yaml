      <p>Hi Claudio</p>
      <p>&gt;&gt;Historically there seem to be no apparent reason for which scripts get connected, apart from the need of writing faster.</p>
      <p>precisely! The need for "writing faster" was also the main reason for the invention of typography.  As Goudy put it: “the demand for more speed than the scribes could provide made some means of more rapid production necessary.” </p>
      <p>&gt;&gt;Do you know if this early Kufic style/Hijazi Jazm was used in inscriptions and relevant writings, both in pre-islamic Arabia and in important applications, literary or religious.</p>
      <p>Unfortunately, so far, only 7 pre-Islamic inscriptions are discovered. All are stone inscriptions. This is why I think we need to examine early Islamic inscriptions more closely, in addition to early Islamic historian works rather than relying solely on these stone inscriptions (all in Nabataen territories).  Early Kufi paper and leather inscriptions are all after Islam.</p>
      <p>-Saad</p>
