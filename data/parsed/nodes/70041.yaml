      <p>Hey I FINALLY found out what font it is. Apparently it's a custom font by Paris-based M/M.  I figured it out when I saw the same font again in French Vogue, they use it for subject heads in their magazine.  Seeing as how NEXT uses it also, I'm guessing it's not an exclusive font. But I have no idea if they're licensing it out at their website because it's pretty confusing. If any of you find out let me know.</p>
      <p>Thanks for all the help.</p>
