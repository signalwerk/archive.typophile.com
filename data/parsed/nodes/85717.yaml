  html: |-
    <p>We will be glade to meet our colleagues, Typographers/Type Designers/Printing Experts in Bibliotheca Alexandrina's Fourth International Symposium for History of Printing and Publishing in the Languages and Countries of the Middle East, Alexandria, Egypt.</p>
    <p>Five Aratypo group members are scheduled in the program with their technical contributions in Arabic Typography; four other members will be alson present to share their newly developed projects.</p>
    <p>Tag Al-Ser Hassan\Al-Mamoun Ahmed<br>
    New Horizons for Arabic Printing Fonts: Resurrection of the Aesthetic Heritage of Arabic Calligraphy in Designing the Letters</p>
    <p>Mohamed Hassan<br>
    The Printed Manuscript Book: A Study of the Philosophies of Printed Texts from a Manuscript Origin in Egypt in the 19th Century</p>
    <p>Nehad Nadam<br>
    Digital Arabic Fonts: Beginnings and Evolution</p>
    <p>Badr Oraby<br>
    Problems of Computing the Qur’anic Text and Visions of the Solution</p>
    <p>You are the most welcome!</p>
    <p>PS. During the symposium, we will daily share the most important information, keep tuned!</p>
    <p>Download program: <a href="http://www.bibalex.org/CalligraphyCenter/PrintingSymposium/attachments/staticpages/program%20english.pdf">http://www.bibalex.org/CalligraphyCenter/PrintingSymposium/attachments/s...</a></p>
