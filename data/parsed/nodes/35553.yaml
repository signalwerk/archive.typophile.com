    html: |-
      <p>I agree...it's like a hodgepodge of several fonts. The crossbar on the "e" doesn't connect on the left (like Banjoman) and the "g" has a number 8 appearance (sort of like Al Koch Antiqua and Locarno - only connected). Long ascenders (like Bernadette and University Roman) and a large bowl on the "a"(exaggerated, resembling Kabel).</p>
      <p>Attached is a larger sample. Thanks for your help.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Type-2_3961.gif"></div><p></p>
