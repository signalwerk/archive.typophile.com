    <p>First, I'll apologize for the quality of these images.</p>
    <p>I'm looking for the type face used in Bentley Motors brand. It's close to <a class="freelinking external" href="http://www.myfonts.com/fonts/fontbureau/interstate/" rel="nofollow">Interstate</a> or <a class="freelinking external" href="http://www.myfonts.com/fonts/dunwich/armitage/" rel="nofollow">Armitage</a> but I don't think it is either.</p>
    <p>Note the "O" is almost a circle, the middle prong on the "E" is shorter, the stand on the "R" looks to have a slight curve, and the "B" is not symmetrical as the top appears smaller.</p>
    <p>If anyone can take a stab at this I would be grateful.</p>
    <p>Regards,<br>
    Ben</p>
