      <p>'Almost the same' can be a happy coincidence.. or even an intended coincidence.<br>
      But it's not enough to 'sell the feature' because it will still cause document re-flow.</p>
      <p>'Exactly the same' to avoid re-flow, on the other hand, will require having (licensed?) access to the original metrics/kerning. Although metrics-compatible fonts seems to be a pretty usual practice for compatibility reasons, as discussed here: <a href="http://typophile.com/node/90341" title="http://typophile.com/node/90341">http://typophile.com/node/90341</a></p>
