      <p>@hrant, Thanks for pointing out nuances I hadn't quite picked up.  </p>
      <p>To clarify where my mentality comes from, one of my long-standing pet peeves is people who thoughtlessly use the default fonts (mostly Times and Arial) for everything without even thinking.  I don't deal with graphic designers or marketers, but rather with everyday professionals who need to knock together a document or presentation.  I try to encourage and educate people like that to make more intelligent &amp; professional-looking use of fonts.  So in a way, I'm actually in the habit of seeing it in peoples' best interests to tell them where they can find legitimate, quality fonts when there's no budget for purchases.  Libertine and various other open source fonts are common recommendations of mine.  (I'm currently rewriting a product user manual; one of my very first alterations was to change it from all Times New Roman to Libertine and Utopia, which are certainly more readable at the size they're using.)</p>
      <p>I must say that coming to Typophile has exposed me to some interesting alternate perspectives.</p>
