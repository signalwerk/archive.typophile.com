      <p>Alex, those are very good questions.</p>
      <p>I don't recommend tricking people*, and I don't blindly advocate something simply because it benefits a certain group of people. I try to consider things case-by-case. In this case, when I read "My client insists on Futura" but a free alternative is sought, there's clearly a lack of proper valuation of type. Either the client should pay for the font they so badly want (which is actually the norm) or the designer has to absorb the cost. What seems to be happening instead is the designer hoping to con the client so nobody has to pay for the real thing. But yes, we do constantly have to demonstrate why quality costs money**. That comes with the territory.</p>
      <p>* When a regular Joe asks me how to simply type in Armenian on their computer, I don't try to sell them a font; I point them to Arasan (warning them that it's not Unicode) or this: <a href="http://www.tinyurl.com/unicodearmenian" title="http://www.tinyurl.com/unicodearmenian">http://www.tinyurl.com/unicodearmenian</a></p>
      <p>** As I said recently: when it doesn't, watch your back...</p>
      <p>hhp</p>
