      <p>I take your point, but should we conspire to hide information that is out there?  </p>
      <p>If there is a free solution that might suit the requester, and we know this but conceal the fact in order to motivate them to pay money for an equivalent solution, where does that put us ethically?  And if the requester paid money (perhaps to one of "us") for a solution, and then discovered that (by their initial criteria, at least) it hadn't been necessary, and that we'd deliberately kept that knowledge back, what would (s)he think of us then?</p>
      <p>Is it not better to earn our* pay by pointing out why our work is <em>better</em> than the free stuff?  Or, possibly, why the free stuff is morally inferior (if it is)?</p>
      <p>Not sure I know the answer to these questions, but I figure they're worth asking.</p>
      <p>(* "our" is used rhetorically here)</p>
