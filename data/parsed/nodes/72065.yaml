      <p>Richard0: That is a pity about Elderkin... interesting that the designer just decided he no longer wanted it on the market.</p>
      <p>Atwe: Garage Gothic is a nice alternative. Not as versatile as Knockout (with its many widths and weights), but good to have nonetheless.</p>
      <p>Still the mystery remains though... where can this rounded Knockout be found? </p>
      <p>Is it likely that the designers at Elephant magazine have modified it themselves? or would they more likely have commissioned H&amp;FJ to do the modifications?</p>
