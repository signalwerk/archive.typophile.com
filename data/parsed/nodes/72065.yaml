    <p>I do apologise if this is considered a duplicate.</p>
    <p>I posted a reply to <a class="freelinking external" href="http://typophile.com/node/62266" rel="nofollow">this thread</a>, but that thread is already marked as solved and I'd imagine unlikely to get attention (again, if this is not grounds for a new thread, I apologise).</p>
    <p>My question is in regards to the variety of Knockout used in <a class="freelinking external" href="http://www.elephantmag.com/magazine/allissues" rel="nofollow">Elephant Magazine</a>. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/farrow_5825.png"></div><p></p>
    <p>It appears to be a rounded version. Does anyone know if this is available somewhere?</p>
    <p>If not, any suggestions for an another strong (rounded) condensed headline typeface?</p>
