      <p>Miss Tiffany:</p>
      <p>&gt; <cite>But having my personal information embedded into a font is another issue</cite></p>
      <p>German laws do not allow sellers to secretly affix private data (name, address, email, bank etc.) to the commodity you purchase. It is likely that the same holds true for the USA. Here an example:</p>
      <p>Let's assume, you marry, and your betrothed buys wedding rings at a jeweller's shop. In the wedding night, you happen to look inside the ring and discover that the first and last name of your betrothed, his postal address and his email, his bank address and his credit card number and other private data had been engraved in small print in Neue Helvetica Ultra Light Condensed into the inside of the wedding ring by the jeweller, secretly without your prior written permission, would you think that this is illegal in the United States? If this is so, then the Linotype practice of clandestine embedding your private data into each Linotype font purchased at the Linotype Website is illegal too.</p>
      <p>Would the legal situation in the United States be different, if you visited <a href="http://www.linotype.com" title="www.linotype.com">www.linotype.com</a>, and if Linotype, prior to your purchase, disclosed to you that it embeds all your private data (name, address, email, telephone, bank, etc.) into each font you purchase, and if Linotype requested you to click on an "Accept" button stating that by purchasing Linotype fonts you accept to forgo all your privacy rights?</p>
      <p>Incidentally, I have a new website <a href="http://www.chillingeffects.de" title="www.chillingeffects.de">www.chillingeffects.de</a> dealing with bizarre legal chilling effects, but this site is in German language only.</p>
