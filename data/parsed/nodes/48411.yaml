      <p>Wow, I wouldn't even consider placing private information about the purchaser in the font they buy from me. The information that I place in the font is general. It's a serial number (which only I can track) along with the date/time of the purchase. I starting doing this back in 2004 when I first starting selling my fonts to the general public. The very first font I sold for public use... it immediately got shared with 10's of thousands of people in a font sharing group. This was after the person making the purchase assured me in a letter that she would not do such an unethical thing.</p>
      <p>In answer to Cristobal's question: : How difficult is to put such a code into a font? Is it possible to open it in Fontlab, rename the font and delete the code?</p>
      <p>The practice of embedding the serial numbers in purchases will likely come to an end for me because it's a tedious task. My system isn't automated at all. So I manually go into a specific character of the font they are buying and import the serial number from an Illustrator file. It's time consuming. Since I don't sell that many fonts from my own website, I've been able to keep up with it. </p>
      <p>However, I just recently purchased FontLab (I've been using Fontographer for many years) and plan to convert most of my fonts to OTF forrmat. Once I make those formats available, I will likely end the practice of embedding serial numbers. Perhaps I'll find another way that will help me track who the people are that are sharing my work illegally.  (I'm open to suggestions).</p>
      <p>Rob Leuschke</p>
