    html: |-
      <p>After reading many messages about font piracy and type marketing, I believe a good strategy is:</p>
      <p><strong>1.</strong> to offer one weight/style for free, as Ex Ljbris does. It must be an useful one, so avoid extreme weights.</p>
      <p><strong>2.</strong> to make available various password-protected PDF samples and also interesting images on galleries (in distributors sites or services like Flickr).</p>
      <p><strong>3.</strong> to upload incomplete/extract-like fonts to servers like RapidShare. The same what music industry is doing, uploading themselves low-quality or damaged MP3.</p>
      <p><strong>4.</strong> to notify these servers everytime a genuine font is found for download – yours or from other designers.</p>
      <p>This will not avoid font piracy, of course. But may help.</p>
    html_clean: |-
