      <p>From other threads it seems that the larger foundries will go after companies, especially large companies that violate copyright. But they don't bother with hobbiests or small business, and there is little that a single designer, without big bucks for lawyers, can to.  </p>
      <p>It does seem that a reminder to a company that font piracy is against the law will very often get them to comply, as they are afraid of lawsuits. </p>
      <p>So I think although there is a lot of piracy, it is a not a hopeless situation.</p>
