    <p>I was thinking about designing a typeface and it got me thinking. How do you protect against piracy? With stock images, they can place code within the picture and scan everywhere until they get a hit. I imagine this would be much harder to encode in a typeface. </p>
    <p>Also what about print, once it's out there, unless someone recognizes a face in a product, researches who designed it and then searches all past invoices or goes to each reseller and asks them to search for the offending company (which seems you would waste more time than it's worth) it would be near impossible to find stolen fonts.</p>
    <p>Am I missing something or is it really just a lot of faith in the end user?</p>
