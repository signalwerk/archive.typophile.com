      <p>Having been a victim to a whole lot of piracy, I have to admit it's like chasing rabbits. You can drive yourself crazy going after the offenders. The larger web sites are worth going after, as it lets other offenders know you are vigilant. I found one web site that showed how many fonts had been downloaded. I calculated it, and it came to over $750,000.00 that I lost in potential sales. I contacted them and offered to settle for 10% if they chose not to remove my work. They removed it within a couple of hours.</p>
      <p>I have embedded code in each font I have sold and so I know who the original purchaser is if it gets shared or posted on a piracy web site. I have caught several people in the act, and confronted them... this too helps to at least let people know you are serious about protecting your work.</p>
