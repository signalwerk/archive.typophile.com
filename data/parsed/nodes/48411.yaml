      <p><cite>How do you protect against piracy?</cite></p>
      <p>One can’t protect against it. It’s far too common—IIRC an study put it at 50% of American designers used pirate fonts at least sometimes—to prevent. Once a few people have bought a font it inevitably ends up getting posted online by an end-user. Watermarks can be embedded in fonts, but unless a designer has the time and money to sue the original purchaser for letting the font get out, there’s no point. And if watermarks were used by more than the one foundry that currently does, someone would just write a tool to strip them from fonts. </p>
      <p><cite>Am I missing something or is it really just a lot of faith in the end user?</cite></p>
      <p>Something like that. I see it as a willingness to just focus on the paying customers and not get hung up on the pirates.</p>
