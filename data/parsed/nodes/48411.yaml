      <p>&gt; And the LINO-table in OTF? Does it personalize fonts?</p>
      <p>If you want to avoid phishing via Linotype fonts, do the following:</p>
      <p>1. Best advice: Do not buy Linotype fonts.</p>
      <p>2. Second-best advice: Do the following:</p>
      <p>a) Import the Linotype OTF font into Fontlab with</p>
      <p>- Import Hinting option switched off and<br>
      - Import OTF tables option switched off.</p>
      <p>b) Generate a plain PS Type 1 font in .PFA format.</p>
      <p>c) Remove %% lines from .PFA file with a text editor.</p>
      <p>d) Import the .PFA font into Fontlab and rehint it.</p>
      <p>e) Resave it as .PFB file or as .OTF or as .TTF file.</p>
      <p>Such a cleaned Linotype font will not contain your private data.</p>
    html_clean: |-
