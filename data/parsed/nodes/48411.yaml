      <p>As a little note on how cruel the reality can be, my <a class="freelinking external" href="http://autodidakt.se/index.php?page=exemplar" rel="nofollow">Exemplar Pro</a> got "ripped" from a PDF, only a couple of days after it had been released. Since my PDF was downloaded hundreds of times during the first days, I guess someone saw the opportunity and grabbed it.</p>
      <p>After that I made outlines of the font in the complete character set showings, to prevent more piracy. It doesnt look as good on screen that way, but it is a good compromise to outline the complete sets. I should have done it from the start only. The rest was only subsets of the font.</p>
      <p>It was a forum on the internet, someone asked for the font and someone ripped it, simple as that! I made an account on this perticular forum and found out that this person had "ripped" and/or shared almost all of the new fonts that was recently released by the major foundries.</p>
      <p>I downloaded my own font – now as a PDF-extract since I wanted to see how it worked. Something that is both good and bad with PDF extracting of fonts "pirate-style" is that the kerning cant be extracted, so my font was autokerned (without classes and looked terrible) and the hinting was very bad on the "ripped" fonts. Also the OT-features were not complete as it was recovered in some way. It's easy to spot the copy, in other words.</p>
      <p>Something that however made me a little less sad, was that the person at least left my copyright string in the font.</p>
      <p>Even though this felt terrible in many ways, I have the same passion for type, so it will definately not stop me from doing more typefaces. Good people pay for fonts, and it is for them I design :)</p>
