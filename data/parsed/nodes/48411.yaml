      <p>@typerror: <em>By the way, proprietary does not protect fonts. Employees take them home and then lend them to their friends. I have seen this too.</em></p>
      <p>Sure. Certainly. That does happen. But when a fontmaker gets a commission job, makes the specified font(s) and gets paid, a substantial sum of money is acquired and retained by the fontmaker. Unlike retail fonts, piracy of proprietary fonts doesn't affect or reduce the revenue earned by designers/makers of those fonts.</p>
      <p>The UK videogames industry loves me and have given me four separate comission jobs. They paid me a tidy sum of money each and every time, and if any of their employees upload any of the proprietary fonts I made for them—that's their problem, not mine. The tidy sum of money they paid me to make those proprietary fonts remains my property and is unaffected by any piracy those fonts may be subjected to.</p>
      <p>j a m e s</p>
