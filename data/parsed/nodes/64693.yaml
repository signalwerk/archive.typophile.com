    <p>As you may have noticed from the critique section, we are digitizing Alf Becker's 268th demonstration lettering Modern Spencerian Script, from <em>Signs of the Times</em> magazine from May of 1954. </p>
    <p><a class="freelinking external" href="http://typophile.com/node/64373" rel="nofollow">Alf Becker's lower case</a></p>
    <p>As a demonstration of the script for artists, it was great. For digitizing, it has been - difficult. The lower case f is a prime example. The forward down stroke is almost completely inconsistent with the rest of the lettering.  This was okay for brush work because everything was adjusted on the fly by the artist. But, for creating a consistantly usable letter it is difficult...</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Alfs_5952.jpg"></div><p></p>
    <p>This is what we came up with as our baseline f and fits all characters, esp bhijklt.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/baseline_6143.jpg"></div><p></p>
    <p>This one is an alternate for acdegmnopqrsuvwxyz has a shorten crossbar.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/altf1_3563.jpg"></div><p></p>
    <p>Another alternate overlapping ligatures of bhijk </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/altf2_5603.jpg"></div><p></p>
    <p>Finally, actual ligatures...</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/lig1_3746.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/lig2_4947.jpg"></div><p></p>
    <p>We are also considering another, scripty lower case for purists. I think that might cover all of the bases. Did I miss anything? This is just for the lower case f. How many ligatures are normal, or rational, for a script.</p>
    <p>~~~~~~~~~~~~~</p>
    <p><a class="freelinking external" href="http://www.thefontry.com" rel="nofollow"><em>...from the Fontry </em></a></p>
