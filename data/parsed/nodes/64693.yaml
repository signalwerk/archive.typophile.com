      <p>I like the fact that it's not descending.</p>
      <p>The "fb" and "fh" are the only uncomfortable ones. Maybe try making the beak of the "f" flatter and longer, and making the ascenders of "b"/"h" shorter, to fit underneath.</p>
      <p>And in the second "ff" I'd make the first "f" shorter.</p>
      <p>hhp</p>
