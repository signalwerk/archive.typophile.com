    html: <p>Is the name a play on 'the pampered chef'?  I get the idea of the heart, but I don't know that it connects.  I think of restaurants in terms of my experience there, not the motivation of the staff.  The heart says to me that it is a romantic destination, great for Valentine's day.  What do you want people to expect before they come?  Who is the audience?  What is the best thing about eating there?  The answers to those questions should guide your brainstorming and ideation.</p>
