    html: |-
      <p>While abstract logos can work sometimes, it might be better if the graphic related more directly to the subject. </p>
      <p>And keep in mind that clients sometimes change tag lines. If the tag line becomes 2 words or 4 words next year, your connection to the 3 strands is lost. I would hesitate to design a logo around the tag line.</p>
      <p>Also the slant of "tutored" and "chef" are slightly different; I'd suggest that they both have the same angle. (Or if you want them to be different, make the difference more pronounced so it looks deliberate.)</p>
