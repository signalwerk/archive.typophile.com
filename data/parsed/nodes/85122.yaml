      <p>&gt; I was trying to go for an abstract mustache</p>
      <p>Okay, now I see it.</p>
      <p>But is a fancy moustache something that people associate with student chefs, or with their tutors?  Maybe others would feel differently, but to me it just doesn't seem like the most appropriate graphic reference. </p>
      <p>Maybe something like a chef's hat might communicate the idea better. Chef's hats sometimes have the restaurant name printed on them, so maybe you could make a logo consisting of the hat with the name on it. Or maybe 2 overlapping chef's hats, one larger than the other, to give the idea of a teacher and a student chef. Not sure if these are good ideas or not, they're just some thoughts off the top of my head.</p>
