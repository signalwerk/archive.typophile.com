      <p>"Chef" ought to be the focal point of the logo, but currently it's overpowered by the decorative ornament, and its position at the end of the line puts it in the least prominent position. </p>
      <p>I'd suggest trying variations where "chef" is larger and on a line of it's own. Might try making "the" a lot less prominent, too.</p>
      <p>The heart shape is clever, but I"m not quite sure how it fits in with the concept of "tutored".</p>
