      <p>At first, I was going to point out all the technical problems (kerning, scale etc.) with your latest version, but I see from your profile that you're a student. I'll give you the best advice I received while I was a student: A logo is complete when there's nothing left to take away, and the message is still clearly in tact. </p>
      <p>In other words, adding more stuff <strong>very rarely</strong> helps. </p>
      <p>Refine your graphics to speak to your audience. What you've presented so far shows me that you're unclear on what you want to say to this audience. Remember -- you're using graphics to convey an invitation to dinner guests. Take some time to explore restaurant logos, and while you're looking, ask yourself what the logo is saying to you about the restaurant it represents. How is each logo achieving its message? Texture? Shape? Color? Simplicity? Style?</p>
      <p>That's a much better place to develop your concept than trying to abstractly illustrate buzz words. Once your concept is refined, then start sketching.</p>
