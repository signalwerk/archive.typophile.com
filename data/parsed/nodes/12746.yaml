    votes: null
    html: |-
      <p>Thanks for all the comments and encouragement.</p>
      <p>The counter of the 'g' being too big has been a source of trouble. In the first cut, I copied the bowl of 'd' onto the 'g'. On a test print at 12 pt, the big counters were very noticeable. Also, the bottom counter was too small. I then lifted the base of the bowl above the baseline by 24 units, relative to an xheight of 484 and overshoot of 12. This appeared to fix both problems. This is the current version. If I need more correction (which I think I do), should I lift the base of the bowl further, or narrow the 'g' and keep the current lift?</p>
      <p>I agree about the tail of the 'Q'. I will try different types: a straight diagonal line as a rectangle (suggested above), a curve joined at the base, a curve crossing the base, etc.</p>
      <p>I will do a pdf sample shortly.</p>
