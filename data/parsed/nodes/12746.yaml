    html: "<p>Glyn - I am a graphic designer, not a type designer, so my comments will be limited. 1) Technical merits/flaws: I think it has a very even \"color\" and nothing particularly stands out to me as looking odd, although a .pdf sample would be good in order to see the characters more closely. 2) Style &amp; Fitness for Purpose: Of course this depends on the type of business. Seems to be a nice blend of humanist and grotesque sans styles. It varies enough from many other sans-serif types to be unique without calling too much attention to itself. 3) Originality: I think you've done an excellent job here, maybe not breaking new ground, but if you're new to type design give yourself a break - this is a very impressive first attempt.</p>"
