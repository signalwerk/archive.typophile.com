    <p>I would particularly appreciate comments on the following points:</p>
    <dl><dt><strong>Technical merits/flaws</strong></dt>
    <dd>As I have no training in type design, I have no doubt made some beginner's mistakes.</dd>
    <dt><strong>Style and fitness for purpose</strong></dt>
    <dd>Is this style suitable for business and technical documents? Does it look reasonably up to date? I have concentrated on solving technical problems in the design, rather than trying to convey a message.</dd>
    <dt><strong>Originality</strong></dt>
    <dd>I am probably re-inventing the wheel here.</dd>
    </dl>
