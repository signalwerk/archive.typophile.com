  html: |-
    <p>Hi all,</p>
    <p>I'm trying to do some edits to my company's website. The website was designed in flash (ActionScript2), but has external .txt files that plug into it. I've noticed that certain characters like single and double left/right quotes and apostrophes are causing havoc in these .txt files.</p>
    <p>I noticed that some of the files use codes for characters such as:<br>
    ‚Äô=apostrophe/single right quote<br>
    ‚Äù=Smart Quotes (or maybe just right quotes)</p>
    <p>I can't seem to find what kind of scripting language this is, and couldn't seem to find it in the wiki. What is this language? where can I find a chart of character codes?</p>
    <p>TIA</p>
    <p>Andy</p>
