    html: "<p>FYI: <br> <br>I downloaded the font at the link above and opened it in FontLab. It contains the following in the copyright field: <br> <br>URW Software, Copyright 1994 by URW <br> <br>Note that this font is also for sale on MyFonts for $19.95: <br> <br><a href=\"http://www.myfonts.com/fonts/urw/serpentine/\" target=\"_blank\">http://www.myfonts.com/fonts/urw/serpentine/</a> <br> <br>Whether these are the same URW font or not is hard to say, but it appears to be so. A Type 1 version of this font I own has the same copyright information. How it came to made available for free on HighFonts.com is also hard to say, but I would be surprised if it has URW's blessing. URW is known for bundling their fonts very cheaply (e.g., with FreeHand, clip art collections, etc.), but I have never known them to give them away gratis. <br> <br>Just saying.</p>"
