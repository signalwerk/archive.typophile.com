    html: <p>The name of the forum is the "Type Identification Board". Jinile has already identified his font, he just doesn't want to pay for it. That's not the same thing as someone who's looking for a free Circus font (for example) in which case he'd be getting lots of suggestions.  <br> <br>There may well be a freeware font with a similar feel to Serpentine, but I agree it's not the responsibility of this forum to encourage that. I suggest Jinile do the legwork himself. Go to Google, type in Free Fonts and you get tons of sites.</p>
