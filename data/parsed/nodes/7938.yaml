    html: <p><i>'Serpentine' is not a free font.. If there is a free font out there thats identical to 'Serpentine', its not a legal one.</i> <br> <br>Correct me if I'm wrong. I downloaded a Serpentine along time ago, and it was free, and I verified it. I could be wrong, but here, again, from a different site, I've found 1 weight of SerpentineDBol listed as a free font along with 20 other COMMERCIAL Serpentine variations. <br> <br><a href="http://www.highfonts.com/fontsearch.asp?ord=Serpentine&amp;f=0" target="_blank">http://www.highfonts.com/fontsearch.asp?ord=Serpentine&amp;f=0</a> <br> <br>Never say never. <br> <br><i>And linking to copies of commercial typefaces is not what Typophile should be about..</i> <br> <br>Thank you for clarifying then, since you obviously misread. No one asked for a pirate of the font to begin with. That's my point. Your sermon is misdirected. I don't think that it's a crime of nature to use a truly free version of Serpentine, if it is in fact free. It may be that "someone needs to make a living", but whoever decided that this version of Serpentine was going to be free seems not to mind.</p>
