      <p>As I continue to think about it, this tendency for people to want to contract the two words is because we (or at least those of us who primarily  speak English) don't think of the term as two separate words, but more as one cohesive concept. When we (or at least when I) say "sans serif", I am not necessarily thinking of the direct translation of "without serif". The "sans" part, despite it's origin, is not a modifier of the "serif" part; they are just one concept to me.</p>
      <p>This is also why most people just say "sans" so often, and then so many people understand it. In French, it makes no sense.<br>
      Words like "tomorrow", "whatsoever", etc (even "et cetera" is acceptable as "etcetera"), are other examples of similar terms which were melded together conceptually and eventually also in their spelling. It seems like hyphenated versions come first before the terms eventually just melt into one solid word.</p>
      <p>I'm just trying to think of similar terms which were melted into a solid word, and dropped a letter in the process due to repetition.</p>
