      <p>Some contributors to this thread think that the compound word "sans serif" was French, but this is not correct.</p>
      <p>While, of course, the word "sans" (= without) alone was and still is a French word, neither the word "serif" alone nor the combined compound word "sans serif" (and its variant spelling "sanserif") were used in French in the past.</p>
      <p>For example, Philippe Schuwer's "Dictionnaire de l'édition" (Paris 1977) translates the English expression "Sans serif / Sanserif" into the French expression "Sans empattement (e.g. caractère sans empattement)." (And the class of sans serif type faces is called "les linéales" in French.)</p>
      <p>As mentioned above by Mr. Geertsma from The Netherlands, the Dutch use the word "schreef", and the Germans use the word "Schraffe", and it is assumed (though not fully proved) by etymologists that "serif" is a word of Germanic (i.e. NOT of Romanic) origin, cognate with Dutch "schreef" and German "Schraffe".</p>
      <p>The French formerly did not use "sans serif", but used "sans empattement". But nowadays, on French Internet font websites, the French also use the English expression "sans serif".)</p>
    html_clean: |-
