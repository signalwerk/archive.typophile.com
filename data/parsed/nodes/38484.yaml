    <p>Here's a trivial but interesting semantic survey question:<br>
    Usually just writing "sans" is enough to get the idea across of a serif-less typeface, but when using the "-serif" suffix, do you prefer:</p>
    <ol>
    <li>"sans serif" (as it is in the Oxford English Dictionary)</li>
    <li>"sans-serif" (as it is on Wikipedia)</li>
    <li>"sanserif" (as spelled by Robert Bringhurst)</li>
    <li>something else?</li>
    </ol>
