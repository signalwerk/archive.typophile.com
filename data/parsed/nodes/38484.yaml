      <p>Just to widen things a little, this passage is directly lifted from <em>Who Shot the Serif?</em> on <a class="freelinking external" href="http://www.ilovetypography.com" rel="nofollow">I Love Typography</a>.</p>
      <p><em>So why the word “serif”? Well, it’s commonly held that the origin of the humble serif can be traced back to ancient Rome. Before an Inscription was carved into stone the letters were first painted on. Anyone who has tried painting letters will know that one is left with slightly wider sections at the ends of the brush-strokes. The stone carvers would then faithfully carve out the letters including the flares at the end of the strokes — thus was born the serif.</em></p>
      <p>However, it looks as though no-one knows much about the etymology of the word “serif”; some say that it comes from the Dutch schreef, meaning “wrote”, while other sources say the term “sanserif” actually pre-dates serif, so that sanserif on its own simply meant without serif (though that begs the question, where did the word sanserif originate?).</p>
