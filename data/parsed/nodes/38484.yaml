      <p>I'm probably in the same boat as Paul on this one... "sans serif" is the traditional way to do it, but "sanserif" actually makes more sense to me from a modern semantic standpoint.</p>
      <p>I also agree with James that the entire term is a bit of a misnomer if translated literally. I don't know if I'm progressive enough to abandon it altogether though. It seems more likely that the English form of the term – if it hasn't done so already – will take on a new meaning which is related but different to its direct translation (more accepting of quasi-serifs and such). This kind of evolution is nothing new (eg: in French, "cuisine" = "kitchen", "matinée" = "morning", etc).</p>
      <p>Maybe it <em>is</em> time to embrace the contraction.</p>
