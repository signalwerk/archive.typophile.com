      <p>Well, I just happened to find these very interesting paragraphs today on the  Typefoundry blog:</p>
      <p>I said above that ‘sanserif’ was a mistake on the part of the OED. The headword ‘Sanserif’ in the original dictionary was quoted from a Figgins type specimen dated 1830, the only known copy of which just happened to be in the library at the University Press in Oxford, the printer of the dictionary. But when I checked the name in the specimen (which is now in the Bodleian library) I found it was SANS-SERIF. In the dictionary the quotation from the Figgins specimen has ‘San-’ and ‘Serif’ at the end and beginning of two successive lines, the ‘s’ of ‘Sans’ having been lost. When they wrote the headword the editors perhaps read the hyphen as a word-break and deleted it.</p>
      <p>So the term ‘sanserif’ should not have existed. Except that, curiously, it did. The OED has a few later quotations showing this spelling, long before the ‘S’ volume of the dictionary was published. And by using it myself I suppose I have added a bit of legitimacy.</p>
      <p>You can find the complete post here:</p>
      <p>06 January, 2007<br>
      The Nymph and the Grot, an update<br>
      <a href="http://typefoundry.blogspot.com/2007_01_01_archive.html" title="http://typefoundry.blogspot.com/2007_01_01_archive.html">http://typefoundry.blogspot.com/2007_01_01_archive.html</a></p>
      <p>Bera</p>
