    html: <p>In 1832, the London type firm Thorowgood referred its sans serif types as "Grotesque" (according to J. Tshchichold's <cite>Asymmetric Typography</cite>, copyright 1935). Tschichold says that by grotesque Thorowgood implied "extraordinary." However, today's Oxford dictionary gives only the expected definition of <a class="freelinking external" href="http://www.askoxford.com/concise_oed/grotesque?view=uk" rel="nofollow">grotesque</a>. As a type-loving fellow, I like to remember that someone once considered sans serif types to be grotesque. And grotesque is a much more interesting term than sans serif. Therefore, I spell sans serif g-r-o-t-e-s-q-u-e.</p>
