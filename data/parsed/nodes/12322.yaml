    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Kevin Kegler</strong></p>
    <p>Kevin Kegler is a Professor of Graphic Design at <a href="/wiki/Daemen%20College" class="freelinking" rel="nofollow">Daemen College</a> in Amherst, New York. As well, he is a practicing designer and sculptor. Type design has evolved as a natural progression from his broad based approach to visual communication. Kegler has been the principal designer at First Hand Learning, Inc, a company he cofounded, and currently is the owner/director/principal at worknotwork in Buffalo, NY.</p>
    <p>Typefaces by Kevin Kegler: <a href="http://www.p22.com/ihof/aglio.html" rel="nofollow">Aglio</a></p>
