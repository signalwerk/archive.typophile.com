  html: |-
    <p>Hi Guys,</p>
    <p>I appreciate that there are a lot of wise heads here and people who know the Font industry's online presence backwards, so I'd love to know the hierarchical state of third party Font sellers.</p>
    <p>For instance, as I regularly get the MyFonts newsletter I was wondering whether MyFonts has a direct competitor? Are they the biggest? Is there someone bigger? Or someone on the horizon taking ground?</p>
    <p>Who has the greatest piece of the pie when selling other designers Fonts?<br>
    Who's below them?</p>
    <p>Cheers In Advance for any knowledge.</p>
    <p>Drj</p>
