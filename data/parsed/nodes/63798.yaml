    <p>Seems like we must be doing something right out here in the boonies. Accolades for the press have been received from all over, and we're particularly proud of the kind words of the fellow type lovers and bibliophiles among our clientele.</p>
    <p>While we strive for modesty, we also recognize that economic survival requires a bit of banging on one's own drum from time to time. So in gratitude for the generosity of our clients and colleagues, we thought we'd share some of these...</p>
    <p><em>"Peter runs the old press for contemporary clients. Beautiful work, a pleasure to work with."</em><br>
    Erik Van Blokland - Letterror, The Hague, The Netherlands</p>
    <p><em>"Peter is an expert letterpress printer who does faultless, crisp, elegant work."</em><br>
    Mark Batty - Mark Batty Publishers, New York</p>
    <p><em>"I met Peter via Association Typographique Internationale, years ago.  I was already very impressed by his skills in various areas, from calligraphy to typeface design. As printer, Peter, with the great background gained over the years and natural skills in graphic arts, produced very high quality printing, but with this touch that only rare persons have, because of their knowledge. I recommend him!"</em><br>
    Jean Francois Porchez - Porchez Typefoundry, Paris</p>
    <p><em>"I give my highest recommendation to Peter Fraterdeus, (Slow Print Studio), for this reason; he has a clear understanding of what matters in printing beautiful work. He understands that what matters is everything! It is refreshing to see someone who has the passion to treat every detail as an opportunity to show how much he cares."</em><br>
    Gregory Corrigan - Technical Director, Hamilton Wood Type &amp; Printing Museum</p>
    <p>More (if you can stand it ;-) at <a class="freelinking external" href="http://slowprint.com/praise" rel="nofollow">slowprint.com</a></p>
