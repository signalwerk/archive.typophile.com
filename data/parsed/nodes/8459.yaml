    date_raw: 4.Jan.2005 12.32pm
    votes: null
    html: <p>FontLab decompiles the actual OpenType Layout tables in the font, but cannot always recompile them because of limitations in the decompiling/recompiling process. Subtables are not recognised during decompiling, for instance, or the font contains OTL lookup types that the Adobe FDK code in FontLab cannot compile.</p>
