    html: <p>FontLab 4.6 is great for developing new OpenType fonts but if you're trying to modify somebody else's OpenTypes, you will likely hit the problems that you describe.  <br> <br>Also, there is no universal solution for that. Not all OpenType Layout features can be expressed in the Adobe FDK for OpenType source code that FontLab internally uses.  <br> <br>One of the new features of FontLab Studio 5 will be  the ability to leave OpenType Layout tables in </p>
