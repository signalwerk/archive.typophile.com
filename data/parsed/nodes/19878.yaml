    html: |-
      <p>My handwriting downright sucks! It is unreadable to anyone but me.  Once upon a time I was a decent caligrapher though.  It didn't rub off on my handwriting which continues to deteriorate as I age.  A few years ago I took a stab at doing a typeface based on my handwriting. In order to make it readable I had to make many changes.  It read reasonably well after much revision but I would not use it as a writing model for school kids by any means.</p>
      <p>ChrisL</p>
