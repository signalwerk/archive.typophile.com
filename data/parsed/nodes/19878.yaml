    date: 2006-05-11T11:50:00
    votes: null
    html: |-
      <p>Because handwriting today is not for public use.  Everything we do for others we type, therefore, there is no need for neatness.  The further I went through school and work, the faster I had to write taking notes or whatever.  Speed kills. The other end of it is that perhaps type design, in some way, makes up for this difficiency--kinda like the Napoleon complex.</p>
      <p>ChrisL</p>
