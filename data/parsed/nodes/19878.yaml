    html: |-
      <p>If my handwriting were ever digitized it would have to be Open Type because there is very little rhyme or reason to which letters I connect up. Sort of a roman/cursive hybrid. Just trying to be different I guess... but it was always important to me that my handwriting be both good and distinctive because my mom's is. Altho mine looks nothing like hers.</p>
