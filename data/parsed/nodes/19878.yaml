    date: 2006-05-12T09:42:00
    votes: null
    html: |-
      <p>Guys, it's no use writing a sample for this thread - it has to be done spontaneously.</p>
      <p>Further to this: a while ago it hit me that to make typography feel like handwriting, it's not enough to make things irregular, it's not even enough to make things contextual; you need to reproduce the most basic element of handwriting: mistakes! Bad spelling, crossed-out stuff, messy linebreaks, the works. It probably can't even be done by a font. Except maybe by Amy!</p>
      <p>&gt; a compliment to most type designers.</p>
      <p>Or you could instead say that it's simply a result of<br>
      "the alphabet is based on handwriting" being false.</p>
      <p>hhp</p>
