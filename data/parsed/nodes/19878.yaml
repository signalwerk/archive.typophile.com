      <p><em>the magic of opentype</em></p>
      <p>The thing is, OpenType scripts have concentrated on capturing the beauty of formal calligraphy.<br>
      If the same amount of genius that went into Zapfino Extra Pro or Caflisch Pro were to be put into mimicing "ordinary" writing, then we'd see some different results. A few people have done "first generation" attempts, such as myself and Christian (Dear Sarah), but there are subsequent generations of OT scripts to come that will be truly scary in their ability to fool the Turing Testees.</p>
