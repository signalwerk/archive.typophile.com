    date_raw: 12 May 2006 — 5:56am
    date: 2006-05-12T05:56:00
    votes: null
    html: <p>My handwriting is horrendous is most situations where speed is required. I'm also a lefty, which contributes. I've taken to writing in small caps to keep my letterforms distinct. If I don't, my handwriting would become like my mother's which is one step away from looking like seismographic charting. However, if I can slow myself slightly and write on a surface like a notepad, my writing quickly shapes up.</p>
