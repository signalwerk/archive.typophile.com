      <p><em>Bad spelling, crossed-out stuff, messy linebreaks, the works. It probably can’t even be done by a font. Except maybe by Amy! </em></p>
      <p>ah yes, my next project. ;)</p>
      <p>despite the magic of opentype, i'd argue that handwriting fonts simply can't do what handwriting does...basically, handwriting fonts are simulacrum of handwriting. </p>
      <p>if we look to graphology, the best way to get a sample of someone's handwriting is to take it from something previously written, to really capture the unconscious forms that occur when we're taken off guard.</p>
