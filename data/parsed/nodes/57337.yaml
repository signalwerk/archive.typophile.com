    <p>There’s this British band called Travis that uses this interesting sans-serif font. The “A” &amp; “V” tend to bend into one another. And the “T”/”H” interact interestingly as well. I’m not sure if they’re just using an italicized version or not, but I’d really like to identify what font it is that they use. Here’s a few links to google images:</p>
    <p><a href="http://www.galeon.com/allmusic/caratulas/t/Travis-The_Invisible_Band-Frontal.jpg" title="http://www.galeon.com/allmusic/caratulas/t/Travis-The_Invisible_Band-Frontal.jpg">http://www.galeon.com/allmusic/caratulas/t/Travis-The_Invisible_Band-Fro...</a><br>
    <a href="http://images.coveralia.com/audio/t/Travis-The_Man_Who-Frontal.jpg" title="http://images.coveralia.com/audio/t/Travis-The_Man_Who-Frontal.jpg">http://images.coveralia.com/audio/t/Travis-The_Man_Who-Frontal.jpg</a></p>
    <p>I’d really appreciate the help identifying the font.</p>
    <p>Thanks!</p>
