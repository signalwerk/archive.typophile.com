    html: |-
      <p>This is quite nice (including the great web interface).<br>
      I do keep reading "meatballs" however.  :-)</p>
      <p>Although this is already quite accomplished<br>
      (PDF export too?!) I do have two suggestions:<br>
      1) Allow the customization of the skeletons. For one thing this would lead to support of non-Latin scripts.<br>
      2) Have a mode where all the letters in a string can be connected, with the same style of rendering; either by having a simple line going through the text, or maybe something more complex, like some letters with the tops connected and others with the bottoms. I think that bring the "circuit" look full circle, and allow for some wonderful texture generation (like those DNA "imprints" or something).</p>
      <p>hhp</p>
