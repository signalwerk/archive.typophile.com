  html: |-
    <p>Hello!</p>
    <p>I've designed and developed elien in Processing. Its glyphs are generated by metaballs. A varying number of balls random sizes is overlain on a letter skeleton. The interactive application generating elien allows you to input text and alter different parameters – scale, spacing, density, contrast, levels and dissolve. This approach yields unlimited variations of styles and weights. You<br>
    may export the generated graphics in PDF Format.</p>
    <p>A demo version is available here:<br>
    <a href="http://elien.tatssachen.de/launch" rel="nofollow">http://elien.tatssachen.de/launch</a></p>
    <p>More infos about how elien works can be found here:<br>
    <a href="http://elien.tatssachen.de" rel="nofollow">http://elien.tatssachen.de</a></p>
