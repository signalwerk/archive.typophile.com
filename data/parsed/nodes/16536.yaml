  html: |-
    <p>I've been looking for a good directory of typefaces, categorized by Type Historical (or at least Art Historical) period, e.g. (Baroque, Neoclassical, etc). There are so many directories, guides and books, but all of them seem to be categorized by style (Blackletter, Serif, etc), not period. I have seen small historical guides, such as the four-pager in Bringhurst's EOT, but none as comprehensive as I'd like. Has an authoritative historical directory managed to elude me?</p>
    <p>Even better, perhaps there's a list of <cite>all</cite> the authoritative type manuals and guides? I checked the Typowiki, but the book listing definitely leaves much to be desired at this point.</p>
