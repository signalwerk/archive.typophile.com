      <p>You could combine Lewis Blackwell's "20th Century Type Remix" with D.B. Updike's "Printing Types" (although he's a bit light on the 19th century).<br>
      But really, this sounds like a Wiki project: a database of typeface info which could be sorted by font name, designer, foundry, country, or year. Or even type category.</p>
