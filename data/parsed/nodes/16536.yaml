      <p><em>An Atlas of Typefaces</em> by James Sutton and Alan Bartram is good if you can find it. It is a survey of current (as of the 1980s) typefaces presented historically, with historical examples.</p>
      <p><em>Art of the Printed Book</em> is pretty good, but is not about typefaces per se.</p>
