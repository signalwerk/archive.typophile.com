    html: <p>A database like that would be truly amazing. My design team is always brining me work with bizarre pairings, such as a 20th Century Modernist headline with Baroque text. Not that such anachronisms are necessarily <cite>wrong</cite>, but I encourage everyone to think of type in a historical context which, IMHO, creates a "setting" just as an novelist wouldn't put a wristwatch on a fictional Renaissance philosopher.</p>
