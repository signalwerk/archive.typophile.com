      <p>Hard to say on such a small sample... I risk <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/sabon/" rel="nofollow">Sabon</a>, using some Old Styles Figures for numerals, mainly because of the four upper terminals /W and even if there's some <a class="freelinking external" href="http://www.myfonts.com/search/garamond" rel="nofollow">Garamond</a> which look close.</p>
      <p>Edit: if they're actually using the same typeface on their <a class="freelinking external" href="http://artandcommerceproduction.com/" rel="nofollow">website</a>, this could well be <a class="freelinking external" href="http://www.myfonts.com/fonts/adobe/garamond/" rel="nofollow">Garamond Pro</a> (or <a class="freelinking external" href="http://www.myfonts.com/fonts/adobe/garamond-premier/" rel="nofollow">Garamond Premier</a>)</p>
