      <p>There’s a little too much going on in every single one of your logos IMHO. If I had to choose one, I’d go for the horizontal lettermark under “Original Logo TM 2007”, because it’s the only one I can read. The others are barely readable to me. If you add colour, this effect will become even more disturbing.</p>
