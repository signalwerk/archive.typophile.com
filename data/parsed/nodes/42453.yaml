      <p>I had the same impression as picard102 regarding odd fonts. </p>
      <p>If the word “basic” is a root of the name, work with that. Make things more basic...simpler. I’d work from the first pair. The rest aren’t doing anything for me. </p>
      <p>I’d suggest a less stylized face for “one” in the wordmark and maybe give it a little more room. The symbol version would be more solid with out the “one” element entirely.</p>
