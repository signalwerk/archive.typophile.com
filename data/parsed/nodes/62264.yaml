      <p></p><div class="imageWrap"><img src="/files/gothamavenir_5719.gif"></div><p></p>
      <p>I would never describe Gotham as a knock-off, but the similarities between Gotham and Avenir are undeniable. I think of them as two strong typefaces aiming at near targets, from different angles, that happen to resolve with similar solutions. But the two behave quite differently in use. And many would consider Gotham superior to Avenir (a debate for another time). </p>
      <p>If we’re examining visual similarity, it’s one thing, but if we’re examining the designer’s intent, that’s another. With sans serif typefaces, I often find the similarities stronger than the differences. Most of the differences don’t really come out between similar faces until you start typesetting and designing layouts with them, testing their unique capabilities and tolerances. There’s an endless stream of Frutiger-like sans typefaces out there, but I’m not sure they could/should all be considered Frutiger knock-offs.</p>
