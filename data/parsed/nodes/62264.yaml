      <p>@Clauses: We will have to agree to disagree on that. Segoe is hardly startlingly original, and is in the same general design space as Frutiger, but it isn’t like they started with Frutiger and tweaked it. (If you don’t mean it literally, don’t say it, btw: there are actual living people responsible for this stuff, and you are accusing them of things, whether you realize it or not.)</p>
      <p>Same for Myriad, which is sometimes similarly accused. What’s particularly interesting is that Segoe and Myriad are more dramatically different from each other: they differ from Frutiger in opposite directions from each other. Myriad softer, more humanist, with more angled stroke endings, Segoe harsher with more strictly vertical and horizontal stroke endings, with Frutiger in the middle. The Segoe approach to stroke endings is arguably best for text sizes on screen... I wish I could use it on my iPhone!</p>
      <p>Cheers,</p>
      <p>T</p>
