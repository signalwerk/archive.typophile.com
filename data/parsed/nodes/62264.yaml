    html: |-
      <p>There are hundreds if not thousands.</p>
      <p>But the line is not very clear between “knock-off” and other forms of “similar,” and things can get weird and complicated.</p>
      <p>For example, 20th Century was a knockoff of Futura, but was redrawn to match the widths (and look?) of ITC Avant Garde and the result was renamed Century Gothic.</p>
      <p>Monotype Corsiva was drawn from the beginning to match the widths of ITC Zapf Chancery, yet the letterforms are sufficiently distinct that I don’t think of it as an imitation or knock-off.</p>
      <p>Book Antiqua is a straight-up knock-off of Palatino, but well done, and the same companies (Microsoft &amp; Monotype) also now have the original....</p>
      <p>Corel used to have hundreds of knock-off fonts under “similar” names. They changed to licensing from the Bitstream and URW libraries for all but a few. Bitstream has lots of designs that were originally unlicensed but well-executed, but often involving the original type designers, just not the original foundries... and then they got an arrangement with Linotype as well.</p>
      <p>That’s not a comprehensive list, and then there are cases which are more disputed.... It’s a pretty wacky world out there.</p>
      <p>Cheers,</p>
      <p>T</p>
