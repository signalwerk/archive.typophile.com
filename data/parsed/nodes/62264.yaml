      <p>Si, can you expand on your Myriad vs. Frutiger statement? I consider them to be different enough that they’re not interchangeable, but I don’t use either regularly.</p>
      <p>Expanding on this topic, I find that my favorites from H&amp;F-J tend to be reinventions/re-examinations/revivals of prior typefaces or styles. Sentinel is a good example of this. I love Clarendon, but from what I’ve seen, Sentinel looks even better. Better meaning that it takes what’s great about Clarendon and expands on it, while adding a fresh character to it that makes it immediately appealing. Gotham is also a great example of this. It’s so familiar in every way, but it still stands out.</p>
