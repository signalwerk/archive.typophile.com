  html: <p><img src="http://www.typophile.com/forums/messages/83/28037.gif" alt=""> <br> <br>Having come to identifying (I hope that correctly?) this font as being <a href="http://www.myfonts.com/fonts/letraset/bordeaux-roman/" target="_blank"> Bordeaux Roman</a>, a doubt has came up, as this text sample is from 1986, yet at MyFonts it is referred that this typeface has been designed in 1987, which has me wondering whether I may be mistaken with my IDing of the font actually?...</p>
  html_clean: <p><img src="http://www.typophile.com/forums/messages/83/28037.gif" alt=""> <br> <br>Having come to identifying (I hope that correctly?) this font as being <a href="http://www.myfonts.com/fonts/letraset/bordeaux-roman/" target="_blank" class="link-external"> Bordeaux Roman</a>, a doubt has came up, as this text sample is from 1986, yet at MyFonts it is referred that this typeface has been designed in 1987, which has me wondering whether I may be mistaken with my IDing of the font actually?...</p>
