  html: |-
    <p>I'm a bit surprised that I haven't seen a post around here about it yet (unless I've missed it), but according to Mark Porter <a href="http://www.markporter.com/notebook/?p=65" rel="nofollow">Guardian Egyptian is now available for licensing</a>.</p>
    <p>Nothing's changed on <a href="http://christianschwartz.com" rel="nofollow">Christian Schwartz's</a> site (nor on <a href="http://moderntypography.com" rel="nofollow">Paul Barnes'</a>), but I assume updates will be forthcoming. I also assume that although Porter only says "Guardian Egyptian," the entire suite (Sans, Text, Agate, etc.) will be available. But you know what they say about "to assume" ...</p>
