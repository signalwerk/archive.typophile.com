      <p>Thanks everyone for replying, especially Kristians for the interesting technical insight.</p>
      <p>Lately I've become extremely fascinated with Soviet era propaganda prints, but some extremely fascinating designs are only available either as low-res scans or rather expensive collector items, so I'm trying to vectorize as many as I can to make my own prints. A far cry from the splendor of the originals, but they make for some really cool posters.</p>
