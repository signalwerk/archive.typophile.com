      <p>Dear Musical box.<br>
      I'm afraid you'll have to vectorize the type as well. Since I presume the original poster has been made in seventies or early eighties it was first drawn on paper, then copied to cardboard and painted in gouache. I can see clearly that the artist of this poster has done exactly so type included. Cyrillic samples were very scarce and few so usually letters were drawn by hand just more or less to please the eye.</p>
