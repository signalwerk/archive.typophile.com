    html: |-
      <p>The poster in the link no. It was printed by the offset machine. Probably the publishing house "Plakat" in Moscow where all the official propaganda posters were printed.</p>
      <p>The standard way the posters were made in late seventies, early eighties - take a sheet of paper 60x90 cm and draw everything ready with a pencil. Then cover it with a sheet of thin paper to transfer it, copy with a pencil.<br>
      Then take a cardboard 60x90 cm and pain it with a white latex wall paint (sieve it through a nylon stocking before) using a porolon roller.<br>
      Paint the background. If white - just apply another coat of wall paint, if light colour add gouache to the wall paint, if dark - add a few drops of PVA glue to gouache to make it more durable. If you want to paint gradient like in this poster you paint half of the cardboard white, another half blue and take your roller and roll and roll and roll till you have achieved the desired.<br>
      Smear the background of the transfer paper with a soft pencil, cover your painted cardboard with it and trace with a H3 pencil. On a dark gouache background don't smear the tracing paper, the pencil impression will be enough.<br>
      The lettering was done with a drawing pen for straight lines, then finished with a brush and corrected with a very fine brush with the background paint.</p>
