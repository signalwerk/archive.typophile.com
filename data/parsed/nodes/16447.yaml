    html: |-
      <p>I think you could try using only the Rotis family for your book, it has something to do with Math too. The text which is now inside the ‘I’ in the cover looks like in a “refugee” place, you can consider a tiny line of text under the square compostion; regarding this, as I can see you did for the ‘C’, the same thing needs to be applied on “B, S’ because of their round shapes, so it is enough you move the ‘E’ to the left a little bit. I like the cube apostrophe. The opening page also needs work, maybe you want “By Mary Bellis” to be on the right, for sure your book should start on page 3, the one you or the software called page 4 on your spread.</p>
      <p>Regards,<br>
      AS</p>
