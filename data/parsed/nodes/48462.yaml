  html: |-
    <p>Does anyone experience this:<br>
    fonts go missing in Flash (CS3) even though they are properly installed and turn up fine in other programs?<br>
    Eg: A huge family of fonts like Helvetica Neue, would have one or two weights go missing when I'm using Flash.</p>
    <p>It happens in MS Word too.</p>
    <p>I can't tell you how annoying it is. I'm on OSX 10.5.4 and all my software are original.</p>
    <p>Can anyone shed some light on this, esp how to fix or work around it?<br>
    I've tried disabling some fonts, but it does not help.</p>
