    <p>Hi there, </p>
    <p>I am generating a 'non style-linked' font family and for that reason I am not using the checkboxs 'Font is Italic', etc.<br>
    Following advice given in this forum, I set a value in the 'Italic Angle' field (Font Info &gt; Metric and Dimensions) because in that way styles are better listed in applications like InDesign.<br>
    The problem is that when I test the generated OT font in Font Validator, it seems to find an inconsistency in Italic styles:</p>
    <p>'The italicAngle is nonzero, but the head.macStyle italic bit is no set'.<br>
    The error is marked red in the report.</p>
    <p>Is it really something to fix or I should ignore it?</p>
    <p>Thanks in advance.</p>
