    html: |-
      <p>In the AFDKO package there's a file named MSFontValidatorIssues.htm that lists some of the issues you might run into when testing OpenType-CFF fonts in MS Font Validator. And one of the things listed indeed sounds like the problem you're having. Here's the quote from that file:</p>
      <p><cite>A font which is not an italic style of another face in the same family can nevertheless have large italic angle. Examples are script fonts and italic designs which are the only font in the family. In this case the Adobe Type Department prefers to enter the real italic angle in the post table italicAngle field. This way, the insertion bar is correctly slanted in most programs. However, this will cause the following messages:</cite></p>
      <p><code>E1316 The macStyle italic bit is clear, but the post table italic angle is nonzero</code></p>
      <p><code>E2308 The italicAngle is nonzero, but the head.macStyle italic bit is not set</code><br>
      </p>
