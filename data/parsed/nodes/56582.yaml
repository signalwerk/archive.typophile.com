      <p>For some reason, my brain says Dalliance. But that’s probably not what you’re looking for… too weird?<br>
      Cora strikes me as <em>extremely</em> clean-cut and “cool”, considering the topic at hand.</p>
      <p>How about something from PSY/OPS? Their fonts might mostly specify as “just a little bit weird”. I think I’d try <a href="http://www.psyops.com/html/spec_eidetm.html">Eidetic Modern</a> where the White sometimes creeps in on the black – like a past life creeps in on the present, or the “invisible” on the “visible” etc. Ha, you got a rationalization too! :o)</p>
