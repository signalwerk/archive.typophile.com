    <p>Hi,</p>
    <p>I’m working on series of book covers that deal with prophecies, past lives, life after death, psychic stuff, mediums etc. I need to choose the right cover headline typeface.</p>
    <p>I don’t want anything too scary looking but something that matches these delicate themes so I’m thinking it should probably be some humanist, sans-serif type since it deals women are main target here. I guess it might also be a type that’s slightly unusual (the way it’s cut or something) since these topics are unusual in itself aswell...</p>
    <p>I tried Cora for Headlines...and it looks better than any other I tried but I know it’s not the one so It would help to hear your suggestions.</p>
    <p>Keywords for choosing this type would be: unusual, not everyday, serious, delicate, women(?)...</p>
