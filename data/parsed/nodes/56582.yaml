      <p><em>“Can it be used for the main headline on the cover since I don’t think it’s display type??”</em><br>
      As far as I understand things, text fonts can be used large: if it looks good,* do it. (Hardcore text fonts will likely look a bit strange at large sizes, but sometimes that effect is desired.) It’s just that display fonts can’t be used for text.<br>
      * I’d try via the type tester before buying.</p>
