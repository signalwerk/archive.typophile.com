    html: |-
      <p>You can approximate this probably custom lettering with <a class="freelinking external" href="http://new.myfonts.com/fonts/linotype/stymie/" rel="nofollow">Stymie</a>. The Black weight is closest except for the y. Oddly, the Black y is different from the other weights. I think if you added stroke to the Bold weight you would be able to fake it. The M is also a bit different, crotch-wise, but you could edit it or ignore the difference.</p>
      <p>- Mike Yanega</p>
