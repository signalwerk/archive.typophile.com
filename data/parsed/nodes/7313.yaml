    html: "<p>I don't think it was designed by an especially competent type <br>designer, but rather a graphic artist with an interesting idea. <br>Among many problems: <br>- the second peak of the 'm' is shorter than the first <br>- the 'R' tail is too light <br> <br>If you like the ball terminals, have a look at <a href=\"http://www.veer.com/partner/link.aspx?i=1048&amp;c=4&amp;p=products/typedetail.aspx?image=ALT0000117\" target=\"_blank\">Perla</a>, which <i>is</i>  <br>made by a competent type designer.</p>"
