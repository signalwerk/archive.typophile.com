    html: <p>This doesn't look like anything I know, Jillian. There are not  <br>so many digital fonts using Bradbury Thompson's <a href="http://www.pbtweb.com/alpha26/alpha.htm" target="_blank"> Alphabet 26</a>  <br>unicase system. Lanston Type's <a href="http://www.lanstontype.com/Bodoni26.html" target="_blank"> Bodoni 26</a> stays true to the  <br>original, while Zuzana Licko's Bodoni interpretation <a href="http://www.emigre.com/dp/getfontpage.php?PFilU.html" target="_blank"> Filosofia</a>  <br>is more off.</p>
