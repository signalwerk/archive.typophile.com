    <p>I came up with a new concoction which is a cross between Arabic Letterism and Generative Art.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/galsmall_5245.jpg"></div><p></p>
    <p>Arabic Letterism has been around in the Arab countries for more than three decades now. The works of one its most notable artist, Nja Mahdaoui, have inspired me very much when I saw them, and one of my first abstract art works in 1984 was a Letterism piece in which I tried to copy Mahdaoui's style.</p>
    <p>Now, after many years of computer programming, computer coding runs hot in my blood. I therefore thought of experimenting in applying Generative Art technology to Arabic Letterism. This was also an opportunity for me to try the programming extension that comes with the Adobe Creative Suite. Using Illustrator CS5, JavaScript, and color schemes downloaded from <a class="freelinking external" href="http://kuler.adobe.com" rel="nofollow">Kuler</a>, I happily present to you what I have called “Generative Arabic Letterism”.</p>
    <p>The blog that explains more (in English this time) could be accessed <a class="freelinking external" href="http://generativeletterism.wordpress.com" rel="nofollow">from here</a>.</p>
