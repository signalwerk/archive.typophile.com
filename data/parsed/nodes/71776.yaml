    votes: null
    html: |-
      <p>First I made a regular (to see if the proposed font was viable).</p>
      <p>Then I made a bold (I figured a regular needs a bold complement).</p>
      <p>Then I made a MM and extrapolated to get a heavy master then made necessary adjustments to the heavy master.</p>
      <p>Then I made a MM between the regular and the heavy and extrapolated to get a thin master then made the necessary adjustments to the thin master.</p>
      <p>I then made a MM between the thin and the heavy and interpolated to see if the regular was anything like my first regular. I was pleasantly surprised to find it was better!</p>
      <p>Not sure why I did it like this but it worked for me.</p>
      <p>For another font, I started of with a hairline and then went right up to the other end of the weight spectrum to get instant masters but was far less satisfied with what lay in between :(</p>
      <p>Of course some will insist on more than two extreme masters on the weight axis and you can see why when you start getting very heavy and very thin.</p>
