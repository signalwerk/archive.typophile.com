    <p>I'm curious about type designers workflow in regards to complete type families that range from the extremes of Hairline/Thin to ExtraBold/Black, including italics.</p>
    <p>The reason I ask is that I understand it comes down to individual preferences, but I'm wondering if there is a standard that carries over through everyones process.</p>
    <p>I'm most comfortable starting with a 'Regular' weight and then moving towards either light or bold extremes and with FontLab Studios limitations using Multiple Masters it seems it would be best to develop either extreme first then generate instances in between.</p>
    <p>I also understand that external tools such as Superpolator can help develop styles beyond the limitations of developing weights with FontLab Studio alone.</p>
    <p>Regardless of what tools are being used, is it best to develop either extreme first Thin/Black and generate instances in between, or is it just personal preference? What is the most efficient workflow when developing full typeface families?</p>
    <p>If you have a chance to briefly comment on your process it would be appreciated.</p>
