    html: |-
      <p>Thanks for the feedback.</p>
      <p>I figure it varies depending on the style of typeface and I can see how it would be easier to work extremes in a monoline face.</p>
      <p>I think I'm going to stick with the original vision for the particular type in the Regular weight… from there develop a Bold… then generate instances to open up the design space and towards the end generate any extremes such as Hairline or ExtraBlack.</p>
      <p>For myself it's highly unlikely for a text face that I would ever start designing with either extreme as there seems to be more room to design and finesse a particular design with something that lies in the Regular weight range. </p>
      <p>Of course it depends on the initial vision for a design as some display types are inspired and created from the start as really light or heavy weight.</p>
      <p>I think I was just looking to see if anyone would state that they have an absolute process for developing more complete type families that they never stray from, but the more I think about it the process must vary greatly between designers for one, and for two between the particular style of type that is being designed.</p>
