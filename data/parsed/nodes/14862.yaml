    html: |-
      <p>The UPS typeface is indeed a reverse engineered FF Dax with an FF Meta-style lowercase ‘g’. The fact that we denounce this case of intellectual property theft makes us liable for prosecution. What a botched-up world, innit? The thieves go free, and the ones who just talk about it get busted.</p>
      <p>Bert, although they are by the same type designer — <a href="wiki/Hans Reichel" class="wiki-create">Hans Reichel</a> — <a href="http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;font_categories=1&amp;font_categories_search=font_name_search&amp;searchstr=sari" target="new">FF Sari</a>’s counterpart is <a href="http://www.philsfonts.com/showing.html?sku=BQ900420X1P1&amp;start=1" target="new">Barmeno</a>, not <a href="http://www.fontshop.com/?fuseaction=catalog.fontpackage&amp;searchby=manufacturer&amp;displayfontid=FF.10269.0.0" target="new">FF Dax</a>.</p>
    html_clean: |-
