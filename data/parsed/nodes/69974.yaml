    html: |-
      <p>That would depend on which languages/scripts you intend to support.</p>
      <p>If a font supports Azerbaijani in the Latin alphabet, it should include 018F and 0259. If it supports Azerbaijani in the Cyrillic alphabet it should include 04D8 and 04D9. If it supports both scripts, it should include all four. If the font doesn't otherwise contain cyrillic glyphs, including 04D8 and 04D9 would be rather pointless.</p>
      <p>The information is all available from <a href="http://www.unicode.org/charts/" rel="nofollow">the Unicode Consortium</a>.</p>
      <p>André</p>
