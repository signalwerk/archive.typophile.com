      <p>There are two problems:</p>
      <ol>
      <li>You can't paste any characters beyond the Mac Roman codepage into FontLab Studio’s Metrics Window on Mac.</li>
      <li>You're using the Cyrillic Schwa codepoints, but on the website they probably use the Latin Schwa characters which should be called and encoded as /uni018F (UC) and /uni0259 (LC).</li>
      </ol>
      <p>Hope this helps,<br>
      Jens</p>
