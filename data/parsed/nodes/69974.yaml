      <p>I wouldn't think in terms of unicode blocks, but rather of *languages*. After all, the set of languages included in any given unicode block is rather arbitrary and there's no real reason to allow that to dictate your language support choices. If your client is (indirectly) Azerbaijani, you'd want to ensure you include the latin and/or cyrillic characters necessary to meet their needs. That certainly doesn't include all the characters in latin extended B or IPA extensions. Schwa (018F/0259) is the only character in these blocks needed to support Azerbaijani, and since the web page you show above is clearly in the Latin script, you'd definitely want to include this.</p>
      <p>A cyrillic keyboard would only be appropriate for Azerbaijani written in cyrillic (which the client would likely want as well) -- in which case you'd need to to include the standard cyrillic characters along with schwa (04D8/04D9), Ғ (0492/0493), Ј (0408/0458), Ҝ (049C/049D), Ө (04E8/04E9), Ү (04AE/04EF), Һ (04BA/04BB), Ҹ (04B8/04B9).</p>
      <p>André</p>
