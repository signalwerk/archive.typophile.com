    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Azer_4376.gif"></div><p></p>
    <p>A client of mine has noticed that there are two characters not displaying correctly when setting text in Azerbaijani.</p>
    <p>If you look at the pic you can see the text that I copied from a website in blue at the top. The text is then pasted into the metrics window. The two missing glyphs are at the beginning of the text: /uni04D8 and /afii10846. The glyphs are replaced by question marks in my typeface, but also in any open installed font like Arno Pro or Helvetica World.</p>
    <p>These characters are in the Windows Cyrillic Asian codepage, but which available codepage supports that character set?</p>
    <p>Basically - how can I get it to work properly?</p>
    <p>Thanks for any replies.</p>
  html_clean: |-
