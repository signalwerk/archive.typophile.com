      <p>Ed, have you considered using a heavier weight for the D? I think the A just needs more to knock out of. You're right that it's not working, but I think it may simply not be working *yet*. Also, I strongly recommend not flanking the mark with type. It's too noisy and disruptive to the flow. Also, I think the mark needs room to read, as it is trying to use angular relationships to create an implied formal relationship.</p>
      <p>Don't give up!</p>
