      <p>Just a thought to share.  Have you considered alternate names?  Simplification is sometimes a great way to create impact and a clever name.  I would consider using just your initial “A” and the word “Design” in a classic font like Helvetica or Bodoni.  Maybe the A in red and Design in Black or Grey.  It could be a nice play on your name and a statement of precisely what you do ...  A Design.  </p>
      <p>James Tocco<br>
      Designer, Detroit, Michigan USA</p>
