    date_raw: 18 Jul 2009 — 1:39pm
    votes: null
    html: <p>Yep, A is kind of hard to see, and without seeing it the mark looks kind of busy, because of the element count. Secondly, the mark has too much whitespace; basically the positive parts are way too thin and neg/pos balance is not there. Also, the concept is interesting, the bent pencil looks quite a bit unconventional and geometrically forced. Lastly, placing the mark between the words is not working for me personally. All in all, the mark has a lot of promise, but needs more tinkering with.</p>
