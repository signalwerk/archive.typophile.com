    <p>Some of you may have seen my post a while back about a logo for my freelance work. I was going to use the name "Red Door Design" until it came to my attention that there are a handful of existing agencies with the same name. </p>
    <p>So I decided to use my last name instead — "Aranda Design" — and developed a logo. Interested to hear anything that anyone has to say.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Picture4_3430.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/Picture5_5564.jpg"></div><p></p>
