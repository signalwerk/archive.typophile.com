      <p>Thanks for the feedback. You guys are echoing exactly some of the things I was thinking myself. I just needed to see if I was over-thinking. </p>
      <p>Yes, the A is bolder than the D. That was the only way I could make all three “levels” work. I think if I ditch the curves at the ends of the D, the A should be more apparent. I rather like the typeface, but I see what you mean about the A's not being similar enough. The letters in the mark are based on Gill Sans. Maybe I should try that for the type.</p>
