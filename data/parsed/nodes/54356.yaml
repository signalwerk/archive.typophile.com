  html: |-
    <p>GameChangers is an online competition powered through Ashoka’s Changemakers and Nike whose goal is to discover innovative projects aimed at “changing the game” for women across the globe. </p>
    <p>We are looking to beat the odds, level the playing field and improve the lives of women through the power of sport and fitness. Our competitors will form a community where they will interact with each other, a judging panel, and the wider Changemakers network to expand their knowledge and improve their game. It’s a competition and a community in one aimed at creating opportunities for women to win.</p>
    <p>Visit <a href="http://sportforchange.changemakers.net/" title="http://sportforchange.changemakers.net/">http://sportforchange.changemakers.net/</a></p>
