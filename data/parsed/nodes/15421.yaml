    html: |-
      <p>yeah it could have been pushed further, but I kind of like it because you don't get that "it's a period font" on first glance, but it makes you take a second look and think "hmm, somthings NQR". Kind of unsettling and subtle (unlike the movie). Although they could've done something better with the placement of the writer/director's names, annoying mix of modern and old, pick one look and go with it I say.</p>
      <p>Peter Carey's new covers? interesting I think, reminds me of something I can't quite put my finger on</p>
