      <p>"In other, and slightly related news, what do we think of the typeface for Nick Cave’s new movie ‘proposition’?"</p>
      <p>Very appropriate, though could have been pushed further,&nbsp;<br>
      something along the lines of Jenny Grigg's beautiful covers for&nbsp;<br>
      Peter Carey's books would have been nice.<br>
      eg:<br>
      <a href="http://www.uqp.uq.edu.au/book_details.php?id=0702232564" title="http://www.uqp.uq.edu.au/book_details.php?id=0702232564">http://www.uqp.uq.edu.au/book_details.php?id=0702232564</a></p>
      <p>Also the kerning is too loose (dare I say bad!)<br>
      <a href="http://www.sonypictures.com.au/movies/theproposition/index.html" title="http://www.sonypictures.com.au/movies/theproposition/index.html">http://www.sonypictures.com.au/movies/theproposition/index.html</a></p>
