      <p>I would say it's the contrast of the black and white that's also is part of the problem... make background colour grey or another softer tint.<br>
      The 'tight' spaces will always create a visual problem, when the contrast is so high. I'd say the problem is a bit like this illustration... the eye will find it...</p><div class="imageWrap"><img src="http://typophile.com/files/232px-hermann-grid-illusion_3481.svg-tm.jpg"></div><p></p>
