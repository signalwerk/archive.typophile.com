      <p><cite>For example, seems like you’ve setup a standard stem with the value 57. When the autohint macro finds outlines where the stems are not exactly that value, it flags a near miss.</cite></p>
      <p>Yes, and I also noticed that this doesn‘t have to mean that there is actually someting that need to be corrected.</p>
      <p>In this example, the Autohinter is telling me that it’s a near miss between 665 and 700. This is the place where i want my outline to bend a little bit - and that makes it different from the standard stem width. It’s a inner shape of a capital D, that is supposed to be there. The autohinter is giving me the exact position where this occurs – the curve begins at 35 and then eventually goes up to 34.</p>
      <p>And in this case 34 is a standard stem width.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/autohint_dee_4065.png"></div><p></p>
