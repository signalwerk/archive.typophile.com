    <p>Hi all,<br>
    When using the auto hint macro is it normal to get along list of corrections in the output window.</p>
    <p>Are these corrections the macro has made, or are these corrections I need to make. I ask because if I run the macro again on the same font I still get the list of corrections, so I’m sort of thinking the corrections haven’t been made.<br>
