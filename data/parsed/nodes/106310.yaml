  html: |-
    <p>I have identified a good number of the fonts on sight, and was wondering if you guys recognise any of the remaining ones before I start searching in earnest.</p>
    <p>I think I should know the Inline serif face for The First Post, yet I am drawing a blank. The stencil face for The Cross Hands looks like it’s based on Bodoni, but it’s not any of the Bodoni Stencils I know. The Bodoni for The King’s Head has this little protrusion on the “G” that throws me off.</p>
    <p>Thanks for the assistance!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/worlds_end_typography_6594.jpg"></div><p></p>
