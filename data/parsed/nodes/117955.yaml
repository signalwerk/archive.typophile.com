      <p>I love these old postcards - especially the lettering handiwork. I'd like to recommend Gert Wiescher's <a href="http://www.myfonts.com/fonts/wiescherdesign/cacao/" target="_blank" rel="nofollow">Cacao</a>.</p>
      <p>Edit: Cacao appears in the Solotype Catalog as Kingsland (Gloriosky), pg. 102.</p>
