    html: '<p>I read, "Pit ttFortz". My confusion is caused by the following: <br> <br>1 The "c" curling up, rather than down makes it seem like a swashy arm to the "tt". <br> <br>2 Because of the LC/UC type, the "H" reads as "tt", or because of its positioning it reads as an UC "H" starting another word. <br> <br>3 The "r-k" reads as "rtz", especially as the positioning relates to the dropping "tt" in Pitch. <br> <br>I imagine the rightbound degradation of the letters that Loren referred to can be dealt with if there are any graphics to be associated with the type. <br> <br>PS: Thanks for the assistance on my So Cal Waves logo.</p>'
