  html: |-
    <p>Hello. I've been a longtime lurker. This is my first post.</p>
    <p>I'm designing a type-based mural and am looking for a Devanagari display font to use in creating digital mockups. The font should be contemporary with a heavy, sign-painted look, but without large differences between the thicks and thins (see sample below). This Devanagari font will be paired with a hand-lettered slab serif I'm working on. </p>
    <p>Recommendations of foundries with emphasis on Devanagari fonts would be tremendously helpful. </p>
    <p>I'm surprised how difficult this has been to find, but I may be limited by only being able to search in English. I've found mostly free fonts of questionable quality or fonts that mimic Devanagari with stylized roman characters (bah!).</p>
    <p>Thanks in advance for any help.</p>
    <p>Best wishes,<br>
    .Mike</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/hindi_graffiti_by_EmilyDanger-crop_4998.jpg"></div>(photo credit: <a class="freelinking external" href="http://emilydanger.deviantart.com/art/hindi-graffiti-167296707?q=gallery%3AEmilyDanger%2F9227052&amp;qo=19" rel="nofollow">EmilyDanger at deviantART</a>)<p></p>
