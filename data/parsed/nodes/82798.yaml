      <p>A friend pointed me to this link, which I had missed on all prior searches somehow. Joe Pemberton's blog has an entry titled, <a class="freelinking external" href="http://typophile.com/node/61686" rel="nofollow">“Indian Type Foundry (ITF) Launches”</a>, referencing the launch of <a class="freelinking external" href="http://www.indiantypefoundry.com" rel="nofollow">Indian Type Foundry</a>.</p>
      <p>About halfway down in the comments, Dan Reynolds gives a very helpful rundown of the state of Indic scripts. </p>
      <p>Kohinoor Devanagari may work for me, but I'd still like to find a few more brushier options. Any suggestions are still welcome. If I find others, I'll post them here.</p>
