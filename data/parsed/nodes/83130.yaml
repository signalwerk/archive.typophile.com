    html: |-
      <p>I did some looking for this when it was first posted, and normally triangular serifs says "Latin", but I found nothing that seemed close to this.</p>
      <p>Do you have any more samples showing other letters?</p>
      <p>Frankly, the serifs seem like they might have been added on, including the serifs on the 'a', 'g' and 'r'. It looks like identical triangles may have been added to re-shape the letters. If this is possibly how these letters were modified, then finding the underlying font would mean trying to identify it from the counters, and general letter shapes, ignoring the serifs.</p>
      <p>I think that is beyond my skill, but it looks like a display face was used, considering the 'e' and the counter of the 'd'. I think I would look at heavy weight Bodoni's. The small upper g counter supports Bodoni, I think.</p>
      <p>- Mike Yanega</p>
