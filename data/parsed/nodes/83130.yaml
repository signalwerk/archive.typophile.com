      <p>I think you're right Mike, I just put the sample through WhatFontIs and News 706 came up, which is based on Aurora (for some reason that isn't available anymore), and the next closest was Corona. The counters and widths are pretty spot on for Corona!</p>
      <p>I don't have any more samples, it is from the book "Art &amp; Agenda" by Gestalten.</p>
