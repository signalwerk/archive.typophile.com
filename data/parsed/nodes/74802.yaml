    <p>Hey gang. I'm on the coordinating committee for this and I thought some of you might find it of interest</p>
    <p><cite>Design Week / LA is an annual celebration of design that inspires and brings together Los Angeles' abundant and vital design communities by promoting a wider awareness of design through initiatives and programming that highlight the richness and diversity of design activities happening throughout the communities of LA. This year's Design Week / LA will be taking place October 9 - October 17.</cite></p>
    <p><a class="freelinking external" href="http://designweekla.org/" rel="nofollow">http://designweekla.org/</a><br>
    <a class="freelinking external" href="http://twitter.com/DesignWeekLA" rel="nofollow">DWkLA on Twitter</a><br>
    <a class="freelinking external" href="http://www.facebook.com/pages/DesignWeekLA/121595634559184?v=info&amp;ref=ts" rel="nofollow">DWkLA on Facebook</a></p>
    <p>If you're organizing or promoting a design-related event during Design Week, we'd love to feature it on the site. Please visit our "Add an Event" page to submit your event info:</p>
    <p><a class="freelinking external" href="http://designweekla.org/add-event/" rel="nofollow">http://designweekla.org/add-event/</a></p>
    <p>Or, if you're in the LA area and want to organize an event but need support, this would be a great time to check out AIGA Los Angeles' new micro-programming initiative (and you don't need to be an AIGA member to take advantage):</p>
    <p><a class="freelinking external" href="http://aigalosangeles.org/features/2010/07/micro-programming-faqs.php" rel="nofollow">http://aigalosangeles.org/features/2010/07/micro-programming-faqs.php</a></p>
    <p>Hope to see some of you out and about!</p>
    <p>--<br>
    Spencer Cross<br>
