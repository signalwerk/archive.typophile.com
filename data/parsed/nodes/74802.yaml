      <p>Oooh, also, forgot to mention that one of our Supporting Partners is Pasadena Museum of California Art and, as part of Design Week, they're offering FREE admission to the museum for the California Design Biennial from Oct. 9th to Oct. 17th. You just have to download and print out a pass from the Design Week site:</p>
      <p><a class="freelinking external" href="http://designweekla.org/2010/09/california-design-biennial-2010-actionreaction/" rel="nofollow">http://designweekla.org/2010/09/california-design-biennial-2010-actionreaction/</a></p>
      <p>Cheers!</p>
