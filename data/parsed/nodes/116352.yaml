      <p>Just about the only thing Google has to say about the "spurred R" is right here on typophile in this thread and in this one; <a href="http://typophile.com/node/97883" title="http://typophile.com/node/97883">http://typophile.com/node/97883</a></p>
      <p>Going out on a limb, it seems like just a one of a a number ways of stylizing a classic Roman R, as on a well known column erected to commemorate the subjugation of the pesky Dacians by  Imperator Caesar Nerva Traianus Divi Nervae filius Augustus.<br>
      <img src="http://conversationagent.typepad.com/photos/uncategorized/2008/05/09/trajans_column.jpg"></p>
      <p>--<br>
      Russell McGorman</p>
