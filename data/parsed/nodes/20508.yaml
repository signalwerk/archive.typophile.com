    <p><a href="/wiki/Cyrillic" class="freelinking" rel="nofollow">Cyrillic</a> glyphs have names just like any other script. If I create a <a href="/wiki/Greek" class="freelinking" rel="nofollow">Greek</a> font, alpha is the name of the first letter, not a code. I am not a Russian speaker and have a hard time going back and forth between the glyph  name, unicode number, what the glyph looks like, and the so-called glyph name afii_thing. Is there a reason why they can't just use the real glyph names just as they do in Latin and Greek? I feel like I need a Rossettastone to tell me what I am looking at.</p>
    <p>ChrisL<br>
    --Frustrated neophyte Cyrillic Script attempter :-{</p>
