    html: <p>As a matter of fact, a large number of cyrillic glyphs have historical long names, following greek tradition. These are widely used by linguists and known to educated speakers of slavonic languages. The same names are used for Glagolythic alphabet, which is different from cyrillic in glyph shapes only. Details can be found on Wikipedia <a href="http://en.wikipedia.org/wiki/Glagolitic_alphabet" title="http://en.wikipedia.org/wiki/Glagolitic_alphabet">http://en.wikipedia.org/wiki/Glagolitic_alphabet</a>. I believe these names work better as glyph names because there are less conflicts with greek (Fita =/= Theta) and latin (On =/= O, Uk =/= U).</p>
