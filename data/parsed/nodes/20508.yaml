      <p>Well, that gets more complicated.</p>
      <p>IF the driver is set to send the TT font as TrueType to the PostScript device, then nothing can go wrong, and incorrect or even completely absent glyph names should not cause a problem. This is because the entire TT font, including the cmap table, gets put in the PostScript print stream.</p>
      <p>If the driver is set to do something else, well, it depends on what that something else is....</p>
      <p>Note that my knowledge of this particular print scenario with TT to PS devices is quite a few years old. It may be that all modern drivers behave one way or another and I don't know about it. I don't have a PS printer set up right now to mess around with this; it could vary by driver/platform/moon-phase. </p>
      <p>Well, okay, probably not by phase of the moon.  :)</p>
