    html: |-
      <p>The only real reason is that in some corner cases with OpenType CFF fonts, encoding must be inferred from glyph names alone. Mostly this occurs when the font is printed to a PostScript file, and then that file is turned into a PDF. If the glyph names are not recognized by the PDF creator, the PDF will look correct, and print fine, but the underlying text will either not be present, or be incorrect.</p>
      <p>afii names are not the only option, however. You can use uniXXXX names instead.</p>
      <p>Or you can decide that this is an unlikely or irrelevant corner case and ignore the issue.</p>
