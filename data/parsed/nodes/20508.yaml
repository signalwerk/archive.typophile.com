      <p>It's implicit in many of the comments, files and links, but I didn't see anybody come out and say it. So, for other readers who are not as familiar with this stuff:</p>
      <p>You can of course use whatever glyph names you like for your own internal (production) usage. But when generating the final font, the afii names from the Adobe Glyph List For New Fonts are preferable so that they will be recognized by potential consumers of the font.</p>
      <p>Cheers,</p>
      <p>T</p>
