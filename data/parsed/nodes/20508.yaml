    html: |-
      <p>It’s not the PDF creator, but the workflow. Simply:</p>
      <p>Use an OTF font.<br>
      Print a PS file to disk instead of to a device.<br>
      De-activate the fonts<br>
      Make sure that your PDF creating software doesn’t know where the fonts are.<br>
      Create your PDF.<br>
      Open the PDF and see that everything looks right. However, copy-paste, search and so forth don’t work worth beans.</p>
      <p>You can use Acrobat Distiller or anything else. It doesn’t matter at that point. I am not even convinced there is any need to test this—it is a pretty well-known and longstanding issue. It’s the main reason anybody cares about glyph names in the final, produced font. If you have a PS OpenType font (.otf), use completely non-standard names, and the original font is unavailable to the PDF creator, this <em>will</em> happen.</p>
      <p>That said, obviously it is a corner case, for most purposes. So you may choose to ignore it, your call.</p>
