      <p>Hello</p>
      <p>This is my first comment on typophile.<br>
      i am now finishing my MD at type &amp; media kabk the hague.</p>
      <p>I am working on Arabic typefaces and I have the same problem that is mentioned conserning the naming of the glyphs. It could be very annoying while in the stage of designing your font to keep using the affixxx naming.<br>
