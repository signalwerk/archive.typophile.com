      <p>Chris, </p>
      <p>I second John's explanation. A simple example: in Russian, afii10068 (U+0433) is pronounced "g" (like in "good") but in Ukrainian, this letter is used to write a dark "h" sound (something like in "hat") while "g" is written using afii10098 (U+0491). There are other situations like that. A similar issue can be made between the Hebrew and the Arabic script. The Hebrew letters are practically used to write only one language so one could theoretically use "descriptive" transliterated names for the Hebrew glyphs, especially that the Hebrew letters have actual names (e.g. "aleph"). But the Arabic script is used to write many different languages of the world and the heavily diacritic structure of the script makes descriptive names at least illogical -- you end up with names like "dotless beh", which make little sense because you're mixing visual and phonetical elements. </p>
      <p>A.</p>
    html_clean: |-
