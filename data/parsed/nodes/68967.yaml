  html: |-
    <p>Hello all,</p>
    <p>I'm very pleased to say that I have produced a new art print.</p>
    <p>The print is called 'Blazing' and is available exclusively from Pictures on Walls.<br>
    POW is a big gallery selling the work of some extremely talented and established artists including Banksy and Antony Micallef, so I think it's a very positive development. </p>
    <p>It's an ambigram, which means you can read it both ways up. Details here:</p>
    <p><a href="http://www.seblester.co.uk" title="www.seblester.co.uk">www.seblester.co.uk</a><br>
    <a href="http://www.picturesonwalls.com" title="www.picturesonwalls.com">www.picturesonwalls.com</a></p>
