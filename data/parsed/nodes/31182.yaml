    html: |-
      <p>I like it a lot. I doesn't shove the book reference in your face as much. And I like your old check-out ticket - I think we were the last generation of students to have those. I think it blends the contemporary black-and-white with the old-school very well.</p>
      <p>My only concerns are:<br>
      The T in the headline because it's so decorative, I found it kind of distracting against the other characters that you used.<br>
      And some of the "stamped" characters are hard to read because they are too light (presumably because they don't have enough ink on them).</p>
      <p>But other than that, I like it a lot.</p>
      <p>-Scott</p>
