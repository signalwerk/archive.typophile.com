    <p>I'm currently a pre undergraduate design student and would be very grateful if you could give me some feedback on one of my designs. I was asked to design a poster advertising the St Bride library.</p><div class="imageWrap"><img src="http://typophile.com/files/Picture-1_5712.gif"></div><p></p>
