    <p>Hello Everyone!</p>
    <p>The <a href="www.indiantypefoundry.com" rel="nofollow">Indian Type Foundry</a> is proud to present <a href="http://www.indiantypefoundry.com/news/kohinoor-super-type-family/" rel="nofollow">Kohinoor</a>, a new super type family supporting Latin, Devanagari and Tamil, three of the most commonly used writing scripts of India. </p>
    <p><a href="http://www.indiantypefoundry.com/fonts/" rel="nofollow">Kohinoor</a> is an elegant low contrast typeface suitable for both body and display text. It comes in 5 upright styles, and where available also with corresponding Italics. As all ITF fonts, Kohinoor is a Unicode-compliant font and has full support for the conjuncts and ligatures. </p>
    <p>Kohinoor's Bengali, Gujarati and Gurmukhi versions will be available in 2011. </p>
    <p>Thank you!</p>
    <p>------------------------------------<br>
    Satya Rajpurohit<br>
    The Indian Type Foundry<br>
    ------------------------------------</p>
    <p>And yes, we have a brand new website as well:<br>
    <a href="http://www.indiantypefoundry.com" rel="nofollow">www.indiantypefoundry.com</a></p>
