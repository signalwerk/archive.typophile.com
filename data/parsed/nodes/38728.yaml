      <p><em>Ricardo Cordoba, how do I use this? I mean, I suppose I have to print it, but with which settings?</em></p>
      <p>Hi. I'm sorry, maybe I should have explained that a bit. That kind of scale is usually printed on clear acetate, so that you can place it on top of the book page (or other printed piece) and compare the book's type with the letters printed on the scale, until you find the closest match.</p>
      <p>You can still find these scales at good art supply stores -- I've seen them at <a href="http://www.aifriedman.com/" rel="nofollow">A.I. Friedman</a>. (In the old days, you could get them from your friendly neighborhood typesetting office.)</p>
