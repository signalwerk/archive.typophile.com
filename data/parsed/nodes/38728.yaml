    html: |-
      <p>The scale that Ricardo linked to is a precise measuring device, there is very little chance you could print it out accurately enough to be useable, software and printer would combine to foil you. The idea is that you can measure the cap (with the E) or x-height (with the x), however since typefaces vary in the amount of body they use it is not precise for all typefaces so once you have the approximate point size you can recreate the settings for measure and leading (which the scale will measure accurately) and finesse your point size by trial and error. You can also do that for free (although it takes time), to do this you need to precisely identify the typeface in both cases.</p>
      <p>Tim</p>
