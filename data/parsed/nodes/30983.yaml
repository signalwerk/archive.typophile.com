    html: |-
      <p>Mark, I completely agree that digital versions of display cuts would be great to see, though I fear the only ones who could truly appreciate them are <em>typophiles</em>.</p>
      <p>In the Pre-PostScript past, designer often just specified type by type name and not by cut. It was frequently left to the type houses/type directors to refine the specifications. The majority of designers today know even less about optical scaling.</p>
      <p>We've seen in many posts that designers find it difficult nowadays to justify the purchase of a single quality font, let alone a family. It's hard to imagine that there would be much of a market for display cuts since only a few can see the difference.</p>
      <p>The great visual services typesetting shops provided to the advertising, graphic arts and broadcast industries are now lost. I think the only place you see such refinement is in individual custom type work and by lettering artist (such as yourself) for titles and logos.<br>
      May you live long and prosper!</p>
