    html: |-
      <p>A quick thanks for everybody's contribution, and special thanks to Mark and Chris' great explanations of the history and 'developments' made in the transition to digital type, both particularly fascinating.  </p>
      <p>It is odd that despite having some knowledge about text and display cuts, I didn't at all connect or extend this knowledge to Helvetica. I guess, sadly (like many others I suspect), that I'm a casualty of the digital revolution. Despite the sad situation caused by the transition to digital technology, it is great to find a place where this knowledge is still alive and discussed passionately (and long may it go on). It is a very encouraging forum. </p>
      <p>I must say however that you would think someone would duly honour 'one the most important 20th Century typefaces' by actually releasing what would be the complete family. I completely agree that it would be great to see more display cuts made available, as it seems a particularly odd situation for the industry to be in, although I don't really understand industry - but it doesn't seem to be in its own interest (whatever that is). </p>
      <p>Funny enough Helvetica never was a favorite of mine, and I deep down I was hoping this sample was some forgotten alternative I could use instead as it immediatly felt better on the eye. It perhaps doesn't come across in the image, but it is nicer...</p>
      <p>I would be a bit lost if I discovered Herbert Spencer was using knock offs all along!</p>
      <p>Cheers all,</p>
