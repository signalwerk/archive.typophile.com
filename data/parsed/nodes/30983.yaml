    html: |-
      <p>The digital versions of Helvetica nearly all come from machine composition companies (mainly Linotype). Machine composition was primarily used for text. Thus, the digital versions of Helvetica are mostly based on designs meant for text setting. </p>
      <p>Today, these same fonts are used for text <em>and</em> display. But digital Helvetica, used at display size, does not match the traditional display cuts, as you can see by this book title, because it is not the same design. It is a text design being used at a display size. I imagine most designers assume that Helvetica is Helvetica, until they come across something like this.</p>
      <p>It would be great to see the display cuts of common typefaces digitized so designers could use them again. Most of them were left behind when digital type took over and the old type houses closed shop.</p>
