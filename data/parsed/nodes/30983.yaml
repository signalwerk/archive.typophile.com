    html: |-
      <p>Display cuts were not specified out of habit. If you ordered 48 pt metal type repro, you had to get a display cut. The time between Helvetica's arrival in the late 50s (a bit later in the U.S.) and the dominance of photo type was very quick with digital soon thereafter. Heads done on photo typositor were made from display cut drawings usually but that is not to say everyone did it that way. A lot of phototype headings were reworked by hand as well. Mostly, hand work was normal then and everyone was quite used to it. Today it is all digitally futzed with instead.</p>
      <p>ChrisL</p>
