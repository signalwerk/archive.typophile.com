      <p>Tiffany, since you ask...</p>
      <p>I don't like to publicise the exact terms of Thirstype's &amp; Village's student licensing, but it is quite favourable to the student. We mostly ask that students respect the type, don't share it with their colleagues, and a few other stipulations, all pretty easy to meet. (The other foundries distributed by Village have their own feelings about this; I only speak for the two foundries I can speak for.)</p>
      <p>As for strip-searching students... oldnick, you are a dirty old man ;-) Don't forget to look on their iPods and Flashdrives too... There really is no way to guarantee that students won't steal typefaces and other software. In my mind, the most important thing is that they legally license the typefaces once they use them out in the real world.</p>
      <p>There have been efforts made in the past to protect font files from piracy, none of which has really been successful. The one which comes to mind is the hidden Mac OS 9 extensions which "enabled" a generation of Hoefler Type Foundry (before Mr Frere-Jones' arrival) types. It was impossible to send files to service bureaux, as they also needed the hidden extension. And this was in the says before PDF print workflows, when 99% of design layout was RIPped from QuarkXPress. HTF released updated and unprotected files to their clients to replace the protected files.</p>
      <p>I would be very curious to hear the story from Mr Hoefler directly; I think that it was an important and useful experiment, and many of of were watching with great interest.</p>
