      <p>Here's the full text, for when the link stops working. (They always do.)</p>
      <p>----------</p>
      <p>I am a design professor at a state university that is unable to adequately fund our graphics program and thus to provide the fonts we need to teach typography. My colleagues and I have stocked the lab computers with fonts we purchased as professional designers, fonts licensed only for our use on a single computer, not multiple machines in a classroom. Are our actions justifiable in the name of education?<br>
         - Anonymous, Connecticut </p>
      <p>   Your motives are good; your methods are not. It is regrettable that this important resource is so expensive, but that does not justify the conduct you describe.<br>
         There are alternatives that might help you get the fonts you need. As I'm sure you know, much software is available at a more modest educational rate or even as shareware. Some schools impose a small materials charge on students in lab classes. What's more, there is much debate about what is permissible as fair use. It is doubtful that this doctrine allows installing multiple copies of an entire font, but that is something for an intellectual property lawyer to sort out. Unfortunately, if these options prove useless, you are still ethically barred from semi-swiping these fonts.<br>
          Update: The design professor tried each of these strategies, with no success. He plans to delete all but legitimately licensed fonts and hopes that students seize the opportunity to be creative. </p>
      <p>----------</p>
      <p>I take umbrage at this part of Mr Cohen's reply: "...but that is something for an intellectual property lawyer to sort out."</p>
      <p>Actually, it's something for the professor, the students, and the foundries to sort out. But Mr Cohen was correct when he said that "much software is available at a more modest educational rate or even as shareware."</p>
      <p>Professor X in CT, and any other prof in the same situation should contact the foundries whose work c/he finds interesting and potentially useful to her/his students; some will donate fonts, or offer discounts on multiple-use for educational purposes. We need to instill in students a respect for type, and teach then that possession is NOT 9/10ths of the law when it comes to software.</p>
