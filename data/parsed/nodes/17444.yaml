      <p>I really like this idea as well.</p>
      <p>Most school's do use a licensed font management app, so the key would be to have the management app as part of the deal. Less hassle for them. The instructions for use are included. More and more school's require laptops, why not also include fonts?</p>
      <p>Most school's -- and I'm basing this off of my past experience -- by now have an IT team in place. Any computer on campus has the same software. The labs are specific for their use. Obviously the average engineering program is different than the industrial design, for instance. I would guess that the IT department at most school's is site wide. Random thinking, but anything organized, packaged and designed to assist people would be an added bonus. I'd guess if the numbers were right and the correct people approached this could be a wonderful thing.</p>
