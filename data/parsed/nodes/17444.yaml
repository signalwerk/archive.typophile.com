      <p>Here’s my idea… </p>
      <p>Realizing that design students are the future customers of their work a consortium of leading, respected font makers has put together the “Educational Font Program” font rental service for college design departments worldwide. For a low annual fee subscribers get access to hundreds of high quality fonts for student and faculty use. A tiered program to fit any budget, fonts are provided in managed sets, including “classic text faces”, “Best of the Bauhaus”, and the ever popular “Typophile Picks of 2003”. </p>
      <p>Each font set includes best sellers from foundries like X, Y and Z. These are the full complete retail OpenType versions of the fonts in question, the only difference being that they include a unique serial number encoded within each font file and font name linking the font to an educational establishment. For example “Gill Sans” would become “Gill Sans Ed4567”,  where 4567 is a unique identifier associated with the school. </p>
      <p>The fonts are managed by a custom version of “N”, the leading font management utility. The utility includes advanced font auditing technology to help ensure that all fonts installed on the school’s workstations are legally licensed. Using the tool administrators set parameters to allow or restrict additional font installation or purge unlicensed fonts. </p>
      <p>In addition subscribers also receive access to printed and online material describing the art and science of font design and development, and for a small additional fee a real living breathing type designer will visit the school and give a lively presentation on type design to the staff and students.</p>
