    html: |-
      <p>"it’s more impressive to have a well typed CV than something interactive."</p>
      <p>'something interactive' is fine, but don't make that your resume. The resume is a practical piece of design. It has a specific function. Good design has to be applicable design. </p>
      <p>Now, a truly different CV (like f&amp;c mentions) CAN work wonders. The catch is that you REALLY have to pull it off well. And that's hard. There's a spectrum:</p>
      <p>A-----------------------------------------------------Z</p>
      <p>A = practical, well layed out, one page, type-only resume.</p>
      <p>Z = some crazy intelligent avante garde interactive CV.</p>
      <p>A &amp; Z are both great. Anything in between, though, can fail miserably. ;o)</p>
