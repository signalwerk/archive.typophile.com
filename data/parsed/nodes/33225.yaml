    html: "<p>for my first CV my Dad (a teacher) said just do a normal CV in word – I ignored that advice and did a rip-off of the London underground map as I was looking for work experience with an information design company. My work experience lasted about 7 years and was the job from heaven. And why did they look at my CV? because it was two things: different and relevant. It's a comment I hear over and over from Creative Directors I chat to that they are looking for an indication that someone has a passion for what they do. Their time is limited so at least give them a reason to look at what you send!</p>"
