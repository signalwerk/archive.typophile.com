  html: <p>What makes a typographic CV interesting? How would it be typographically correct to impress an employer to take me on for a work placement? Does it concern the typeface I use? The type size? The way I would emphasise certain type for i.e headings etc. How else can I make it typographically interesting? Do you think using type to make up images would be exciting? What other ways could I do it? Thanks.</p>
