      <p>Keep in mind that your CV will be seen by others in addition to the Creative Director or other persons in the creative department. This thing has to look good to folks in the HR department also. The CD's recommendation will carry the most weight, but you don't want to baffle others who have to look at it. They just want that solid information, well presented, that most everybody here seems to emphasize.</p>
