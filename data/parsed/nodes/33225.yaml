    html: |-
      <p>You hadn't said what type of place you're applying to. Like if you were applying for a position in a graphic design department in a large non-graphic company, the person judging your resume would not be graphically aware.</p>
      <p>Anyway, in this case I think you have a little bit of room for impressing, but not much, and you have to tread pretty carefully: too little is better than too much (assuming you have a good chance at getting the job based solely on the content of the resume). In terms of the font, I would choose something very under-used but understated and highly readable. Not Times, but not Mrs Eaves either.</p>
      <p>hhp</p>
