      <p>I'm making a huge assumption here that the CV in question is for undergraduate placement, or a first placement after graduation (rather than as a mature student).</p>
      <p>If this is so, Chris's point regarding content is particularly important. Good employers will spot good candidates and will be bombarded with these things in the next few weeks/months and will look for any reason to cut the pile down to size. In the end it's what you say that's important, not how you say it. </p>
      <p>If nothing else, put it up for crit on this site – it's a rewarding experience :os</p>
