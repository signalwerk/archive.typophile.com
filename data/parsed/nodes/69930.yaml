    <p>I am running OS X Snow Leopard and now again I a pronlem with certain fonts rendering properly. The characters are displaying as a glyph not found symbol.</p>
    <p>The attached file is an example that occured when testing @font-face implementation in Chrome, weirdly Safari was fine. I have also had the same issue in OpenOffice, TextEdit, PowerPoint and at other random time.</p>
    <p><img src="http://typophile.com/files/Screen shot 2010-04-28 at 15.58.03.png<br />
    "></p>
    <p>Anyone got any ideas?</p>
