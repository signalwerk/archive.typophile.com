    votes: null
    html: |-
      <p>It is a known Chrome bug, it happens with other font managers (not only FontExplorer) AND it is unlikely to be fixed anytime soon.</p>
      <p>One has three options: </p>
      <p>A] stop using the font manager software. </p>
      <p>B] Keep all fonts in the OSX designated font folders (which isn't a very good option in the case of font managers such as FontExplorer)</p>
      <p>C] Forget about using Chrome.</p>
      <p>Personally, I opted for option C (Safari is still the king of speed on the mac platform, and to my eyes, is the best WebKit browser for the platform anyway)</p>
