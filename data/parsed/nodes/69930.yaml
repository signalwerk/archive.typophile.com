  - id: 424931
    user: 13908
    date: 2010-08-14T09:55:00
    date_raw: 14 Aug 2010 — 9:55am
    votes: null
    html: |-
      <p>A workaround:</p>
      <p>Copy the text that's showing up as boxes with 'A' in them, paste it into textedit.<br>
      Select a word and Command-T to open the fonts panel and see what font it is.<br>
      Now go to whatever third-party font manager you have installed, and disable ALL variants of the font there.<br>
      Quit the font manager, and now open Fontbook.<br>
      You should see the font in there, grayed out. Enable it.<br>
      Restart Chrome, and that font will appear just fine.<br>
      You'll have to do this for each font, unfortunately. It's a pain, but Chrome's so much faster and better that I don't really mind...</p>
