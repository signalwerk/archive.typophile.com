    html: <p>I'm not a Mac expert, I've never even left a mobile phone in a pub, but my guess is that there's something suspect about the particular fonts that is causing OS X to on occasions reject them. Perhaps the recent font related security patches are finding something about the fonts that they don't like, perhaps at specific sizes - hence them working in some places and not others. What fonts are causing the issue?</p>
