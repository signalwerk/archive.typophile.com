      <p>The logo itself feels very youthful and free to me and is still credible in a corporate sense. I might try scaling “Child” down a bit to create a bit more contrast between it and “Ocean” to see what happens. </p>
      <p>Also I am not sure why there’s so much black being shown with the name of the logo- a name like that begs for color (if that’s a production concern or budget limitation then I would reverse black/white on the logo and card). </p>
      <p>Nice work.</p>
