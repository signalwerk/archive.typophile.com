    <p>Hello everyone,</p>
    <p>I’d like to hear some comments about an brand I have been working on.</p>
    <p>Here is some info about the client, the type of business and the work done so far.</p>
    <p>The brand is new. It is founded by a few young designers that want to have their own label.<br>
    The name was given by the clients.<br>
    They are not going to make “haute couture”, but they are not SEARS eather... They are aiming for a young audience, with relatively high visual culture, that is also willing to pay for the craftsmanship they (Ocean child) provide.<br>
    They wanted something that was both young, smooth and free, but a bit corporate and official too...</p>
    <p>Well, I’d be glad to answer any questions and to read some comments.<br>
    Thanks in advance for your time :)</p>
