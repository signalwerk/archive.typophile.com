      <p>Thank you both for your comments! :)</p>
      <p>timd, would you suggest a different global approach to the logo? Any examples may be..?<br>
      You are right about the business card, I believe I will have to kill some of the space between the logo and the info in order to forecast a longer namer...</p>
      <p>mjpatrick, I was actually thinking of doing the “child” with a very black type, that would fill up the whole circle of each letter. So we’d get something like a “circular-punch-out” in a way :)<br>
      Color has not been discussed yet, however we have agreed that we’ll be looking at complex colors (pastel, colors you can find in nature’s ecosystems etc)...<br>
      I will post any changes and fixes made!</p>
