    html: <p>There was a time, during the late 1990s, when the Periodic Table of Elements metaphor was being used (and abused) by every other graphic designer. Maybe the trend got its start with <a href="http://www.amazon.co.uk/Spend-Everywhere-Everyone-Always-Forever/dp/1861542798" rel="nofollow">that Damien Hirst monograph</a> (designed by <a href="http://www.designmuseum.org/design/jonathan-barnbrook" rel="nofollow">Jonathan Barnbrook</a>, by the way). Seeing it resurface after ten years or so put a smile on my face, quite frankly. Sure, somebody who doesn't know much about typography (or high school science!) <em>might</em> take this at face value, but the makers clearly state that they have simply taken other people's popularity rankings into account. They even have the links listed at the bottom of the table! And the subtitle reads "Popular, Influential, &amp; Notorious"! I think that constitutes fair warning. :-)</p>
