    html: |-
      <p>From the caption on Behance: <cite> &gt; Unfortunately, the typefaces could not be sorted exactly numerically on the table while at the same time keeping them in groups of families and classes.  It had to be one or the other.  Of course it COULD have been done but I would have had to seriously sacrifice aesthetics of the overall design (i.e. it wouldn't have come out looking AT ALL like a traditional periodic table.) </cite></p>
      <p>This explains precisely why it can only bear a superficial resemblance to Mendeleev's ground-breaking work -- "We couldn't really attempt to do what the Periodic Table of Elements actually does, because then it wouldn't <em>look</em> like the periodic table, and what would be the point of that?"</p>
      <p>I agree with John's assessment. I also understand why Stéphane, as an educator, might be frustrated and irritated by what it pretends to be.</p>
