    html: <p>This ‘periodic table’ isn't one of the stupidest things I've ever seen -- I've seen a <em>lot</em> of stupid things! -- but I think Stéphane's critique of it is entirely accurate. I'd also suggest that it is symptomatic of a problematic kind of graphic design that apes the appearance of information design without actually understanding the conceptual basis of that design. This is just a list of popular typefaces arranged in boxes to look something like the periodic table of elements; there is nothing in the kind of information that it presents that either recommends this arrangement or benefits from it.</p>
