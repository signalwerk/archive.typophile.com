    html: |-
      <p>OK, let’s get into it, then.<br>
      First of all, Mendeleiev's Periodic Table of the Elements is one of the greatest achievements of modern science, structured by an inner logic which, at the time of its conception, not only allowed to organize the chemical elements ALREADY known but also those YET to be discovered (radioactive substances, for instance). Here it is used as a mere "cool-looking graphic scheme" with no inner logic whatsoever. Lazy, shoddy stuff.<br>
      Now to the "Typophile" part : in my opinion, making this kind of selection without referencing a specific context (academic, professional, publishing, etc.) is utterly useless — but THIS ONE is really, really, flawed : why include Robert Slimbach's AdobeGaramond AND Franco Luin's Garamond Classico, for instance ? Isn't one digital "real" Garamond (i.e. not based on a Jannon model) enough ? Why Griffo Classico and not Monotype Poliphilus ? Why Monotype Bembo AND Bitstream Aldine (which are more or less the same typeface) ? What's "Realist" about Baskerville ? And WHICH Baskerville, by the way ? Monotype ? ITC ? Storm ? Isn't Old English more "Popular, Influential and Notorious" than Manuscript-Gotisch ? Where's Fournier ? Where's Monotype Centaur ? Where are Bell and Bulmer ? Which Kis ? Linotype Kis Classico, Monotype Ehrhardt or Janson Text ? I could go on like this for hours, but would it be worth it ?<br>
      This thing LOOKS LIKE it has been THOUGHT OUT when it has merely been COMPILED — it is thus an insult to its model (Mendeleiev's work) AND to its subject (typographic culture).</p>
