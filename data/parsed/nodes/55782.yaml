      <p>So many?</p>
      <p>I think if someone were to suggest that some fixed and limited set of specific typefaces were all that were necessary for all design by everyone and everywhere, that would be both foolish and also easily demonstrated to be false. But I think there is nothing wrong with a designer determining to work with a limited set of his own choosing that is useful for the kind of design he or she practices. Frankly, I can imagine working with only one or two typefaces, and the only reasons I would be likely to change them over time would be either my own desire for variety or the appearance of a new typeface that seemed more useful.</p>
