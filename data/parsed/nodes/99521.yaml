    <p><a href="http://www.myfonts.com/fonts/brassfonts/styptic/" title="http://www.myfonts.com/fonts/brassfonts/styptic/">http://www.myfonts.com/fonts/brassfonts/styptic/</a></p>
    <p>This intrigues me because the text is readable, but the glyphs don't show lettershapes... they hint at the tops of the lettershapes.</p>
    <p>I wondered what the type designers here would think of such a design. Personally, I'm supposing it's quite original and a little groundbreaking, but y'all know more than I do.</p>
    <p>What do you think?</p>
