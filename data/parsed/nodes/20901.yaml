    <p>Hello.</p>
    <p>I am a student in art school studying graphic design. Typography is by far the subject which peaks my interest the most. The textbook I read for school was Robert Bringhurst’s Elements of Typographic Style, which was wonderful. I must have read the entire book in the first few weeks of the semester.</p>
    <p>I am looking at ordering either Emil Ruder’s Typographie or Muller-Brockman’s Grid Systems in Graphic Design.</p>
    <p>So, I wanted to ask working designers which book they would recommend a design student read first. Also, are there any other recommended books?</p>
    <p>Thank’s for your advice!</p>
