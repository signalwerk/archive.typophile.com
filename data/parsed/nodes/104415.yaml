    <p>I'm working on a custom script as a logotype and would like to have you feedback - I have two versions with differing "L"s:<br>
    <img src="http://i.imgur.com/kb6qyrI.png"></p>
    <p>So, A or B? I feel pretty good with the "Hus" but I think that the "tle" still needs some working out. Additionally I'm aware of some of the Illustrator stroke issues with some jankiness that I'll attend to once I get the letter forms finalized.</p>
    <p>Let me know if you see any other problem areas or have suggestions to improve it.<br>
    Thanks!</p>
