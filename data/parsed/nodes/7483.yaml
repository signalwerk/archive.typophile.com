    html: "<p>Dear Adam; <br> <br>Yes, perhaps that is illegal. But surely there would have been an impasse here: if it were discontinued how could one buy it? For someone who has it and after selling would keep a copy? <br> <br>And what about, for instance, the old Berthold fonts? Berthold, as far as I know, went bankrupt. If I wish to have a Berthold font is it illegal to someone to give it to me? Perhaps it is, but how could one get it in such a case? <br> <br>I understand the need to pay for fonts. I purchased a lot of them. I won't just pilfer them. But in the case I presented, I believe I am doing nothing ethically (as distinct from legally) wrong. <br> <br>This, of course, is open to debate, but I follow ethics, not blind law. Law is meant to further ethics, but it is not ethics. When law is blatantly wrong (as in the case of Berthold fonts, should it decree that I am not at liberty to copy it) I am quite willing to break it, as I am doing no harm to anyone.  <br> <br>Dear Thomas: <br> <br>No, I think he really needs the Akzidenz-Grotesk as a bases to make foreign alphabets. Anyway, I don't exactly know, or am not sure I am at liberty to say, but it seems to me to be a worthy cause.  <br> <br>Let me assure you that by stating what I believe is right I mean no disrespect from those who think otherwise; everyone is entitled to his/her opinion.  <br> <br>Thanks for the answers, <br> <br>Rodrigo de S</p>"
