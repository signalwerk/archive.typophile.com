    html: "<p>There are three players in the font market: consumers, resellers, and the people who actually make the fonts. And each of these is intent on furthering its own interests in opposition to the interests of the others. I make no apologies for defending the interests of the people who make fonts. This doesn't have to be an acrimonious struggle, and I'm very happy to talk about a reasonable balance in the pricing and licensing of fonts to end users (much more happy than I am to explain to a reseller that I'm not interested in the 20% royalties he wants to pay me in order to profit from my work). But I do object to consumers who think they have a right to my fonts, and can take them on whatever terms suit them, regardless of whether those terms suit me.</p>"
