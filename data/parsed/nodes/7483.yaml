    html: <p><i>Of course I admit there are sometimes good reasons for the "non-mod" clause. It's just very rare, and the language of such clauses even more rarely corresponds to reality, to treating fellow humans decently.</i> <br> <br>Well, that seems a basic function of typical legalese. I went to some length to write the old Tiro EULA in plain English and to stress the ways in which respecting the EULA protected the user's investment, which is among other things an investment in the value of something that not everyone else has. <br> <br><i>Because a few months ago when I claimed that only MS had such a clause, Simon pointed out that in fact most houses had it (at that point).</i> <br> <br>I don't recall Si saying that most font houses have this clause. In any case, I don't think it has ever been the case. Many font houses follow Adobe's lead, which has always been to allow modification. <br> <br>What I do recall Si saying, which is also the point I have made whenever the MS EULA comes up, is that,  excepting the rather special and generous case of the web fonts, MS <i>do not have a EULA for fonts</i>. Fonts distributed by MS are covered by the EULAs of the software packages with which they are bundled. The no-mod clause applied to fonts is simply that of the prohibition on decompiling or reverse engineering of the operating system, word processor, or what-have-you software. Microsoft, until now at least, have not singled out fonts in their software EULAs. <br> <br>I think it is important to distinguish between fonts that are licensed directly in a retail market, and fonts that are bundled with software. I think the no-mod clause makes a lot of sense in the latter case, whether fonts are singled out in the EULA or not. MS is not a 'font house' in the sense that even Adobe is, let alone Agfa Monotype, Linotype, Emigre, House Industries, Hoefler &amp; Frere-Jones, etc.</p>
