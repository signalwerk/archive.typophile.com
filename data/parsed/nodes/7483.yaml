    html: <p><i>Anything else would be both illegal and immoral, because you would be getting something that you didn't rightfully pay for.</i> <br>  <br>Getting what, bytes? I think it's absurd to take such a strict viewpoint on an unpurchasable typeface. <br> <br>My opinion is that being so tight-assed <i>encourages</i> piracy. Being cool encourages compliance. <br> <br>I know "font collectors" -- at least one of which is a regular here, and I'm not talking about me -- who seek out multiple &amp;/or obsolescent variants of fonts for their collection. Say, Myriad MM -- they have no intention of ever using said font, they just want it. If they were to use a font in their collection for commercial work, they would immediately purchase a license. <br> <br>That, in my opinion, is completely harmless -- and in fact <i>promotes</i> licensing in a try-before-you-buy sort of way. Trying to suppress that sort of activity is pointless and self-defeating. As the music industry has discovered, it is absolutely impossible to stop without liberalizing their business model or launching a few thousand lawsuits. <br> <br>I know this is rehashing old arguments, but this discussion highlights what I think are some of the more unreasonable aspects of the EULA structure. <br> <br>Being overly strict just drive people to Kazaa and Limewire, where they can download the Font Folio (or whatever) any time they want.</p>
