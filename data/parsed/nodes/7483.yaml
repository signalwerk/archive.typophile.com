    html: <p>It seemed to me that last year as I emailed the various foundries to varify the information which Nathan and I had gathered changes were occuring. This was last year (October-January). I like to think that some changes came about because of my little essay. But mostly I'm just happy that the conversation was happening. Designers should not be afraid to voice their concerns with EULAs. But, at the same time designers need to respect the EULAs.</p>
