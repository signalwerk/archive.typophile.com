    html: <p>Further, if you buy ITC Bodoni from Myfonts, you are given the Linotype license you refer to, and it allows read-only embedding AND design mods, while Stone Type's EULA does not allow modifications! <br> <br>I should note that ITC's site includes smallcaps in the albeit higher price, while the other vendors do not, so that's a trade off one has to make against their EULA. <br> <br>Still, I think the End User might be justified in feeling a little cheated if he purchased form Stone or Linotype. The limitations of the EULA aren't exactly featured when browsing for type, and one could easily slip up and buy from the wrong place.</p>
