    html: <p>He'd have to buy it from somebody who is willing to give up their copy. (For him to sell it but keep a copy is a particularly unwelcome form of piracy.) This is not much different from buying a car or a set of dishes that is no longer being made, except that breaking the law is easier with digital goods. <br> <br>The Berthold version is still available. You can find the current incarnation of Berthold at <a href="http://www.bertholdtypes.com" target="_blank">http://www.bertholdtypes.com</a> <br> <br>As for using the font as a basis for making new fonts, unfortunately most licenses prohibit modifying the font that has been licensed. I gather Linotype's is in that category. So even if it were still available from Linotype, your friend couldn't do what he wants with it. <br> <br>I'm not a lawyer of course, but these things seem like pretty clear violations of license agreements and copyright laws in most of the world. People are entitled to whatever opinions they want, but as far as I know legal systems do not generally recognize having a different opinion as a basis for breaking the law or violating a contract. <br> <br>Regards, <br> <br>T</p>
