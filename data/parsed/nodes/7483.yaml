    html: "<p>Rodrigo,  <br> <br>your informations are not accurate. Linotype's version of Akzidenz Grotesk is not discontinued, it's renamed. Linotype's version of Akzidenz Grotesk is now called Basic Commercial: <a href=\"http://www.linotype.com/114/basiccommercial-family.html\" target=\"_blank\">http://www.linotype.com/114/basiccommercial-family.html</a>  <br> <br>The fact that the font under the particular name and in a particular version is discontinued does not authorize anybody to share it. It is still copyrighted. Bitstream's versions of ITC fonts are no longer on sale, and yet the unauthorized distribution of them is certainly illegal.  <br> <br>Regards,  <br>Adam</p>"
