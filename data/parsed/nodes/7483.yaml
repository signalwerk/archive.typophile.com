    html: <p>Isn't it true that, when we pay for a font, technically we're not "buying" we're "licensing" -- and therein lies an interesting difference. I can draw a picture of Spider Man, but I couldn't sell prints without purchasing a license. Having the picture of Spidey is okay. Trying to make money with it is not okay. <br> <br>So then, why couldn't Rodrigo's friend have a copy of the font as long as he didn't use it for commercial use? <br> <br>I see no moral reason why this should not be the case.</p>
