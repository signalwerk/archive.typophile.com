  html: "<p>Dear all: <br> <br>I don't want to start a quarrel here, but I'd like to have Akzidenz-Grotesque by LINOTYPE. This is a discontinued font. <br> <br>I'm trying to get if on behalf of a friend who is doing a marvelous job in creating non Western fonts for academic work. <br> <br>Here is what he wrote to me: <br> <br>............ <br>As far as the Akzidenz-Grotesk is concerned, I need only ONE example of ANY font alled \"Akzidenz-Grotesk\" and contained in any disk or CD from **Linotype**. The important point is: <br>The file must be from **Linotype**, not from Berthold etc. <br>This means, if someone has ANY older Linotype Library Gold CD on which the Akzidenz-Grotesk is contained, then I would need ONE example, preferable the Roman style of Akzidenz-Grotesk. <br>Since Font Explorer 1.5 Gold Edition = Linotype Library Gold CD the Akzidenz-Grotesk was no longer sold by Linotype, so that it must be a Linotype font collection older than year 2000. <br>............... <br> <br>Since it is a discontinued font, I think there is no problem in his getting it. If someone can send such a copy it would be appreciated.  <br> <br>I don't think this is breaking whatever law there is, but then I'm not a lawyer. I mean to offend no one's feelings on this hot matter. But just bear in mind that the person on behalf of which I'm asking this is doing extremely important academic work: providing fonts for working with old and very important texts.  <br> <br>I hope I will not be missinterpreted.  <br> <br>Rodrigo de S</p>"
