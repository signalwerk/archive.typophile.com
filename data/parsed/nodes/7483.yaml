    html: "<p><i>I think it's absurd to take such a strict viewpoint on an unpurchasable typeface.</i> <br> <br>As Dan and others have noted, Akzidenz-Grotesk is not an unpurchasable typeface. <br> <br>The Tiro Typeworks' Type 1 retail fonts -- 1530 Garamond, Manticore, Aeneas, Academia -- <i>are</i> unpurchasable typefaces, so may make a useful example in discussion. We have withdrawn these fonts from the market and have no immediate plans to rerelease them in any format, so they will remain unpurchasable for some time, perhaps forever. Does this mean that people who have licenses for these fonts can share the fonts with other people in contravention of the original license agreement? No, it does not. The sale of the fonts has been discontinued, not the terms of existing license agreements. These fonts are the intellectual property of the designers, who have a moral and legal right to determine how, when and <i>whether</i> they are distributed. The fonts have been withdrawn from distribution for a reason: we don't want to sell them any more because we don't want them to be more widely used than they already are. If withdrawing them from distribution meant that anyone could freely pass them around, what would be the frigging point of withdrawing them? I take a very strict view on these unpurchasable typefaces.</p>"
