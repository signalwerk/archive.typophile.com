    html: <p>Rodrigo, I'm sorry to say that would you are asking for would be a EULA violation. Linotype Akzidenz Grotesk, as Adam pointed out, was never discontinued. The font files were just renamed. <br> <br>Someone who has purchased a Gold CD from Linotype may not sell, or give individual font files to anyone else for any reason that is not delineated in their EULA (so, anything other than co-workers or service bureaus, etc.). That would be a EULA violation.  <br> <br>One the other hand, If someone had bought the old Akzidenz or new Basic Commercial as an "individual font file" from our web shop, they could transfer that license to you or to your friend, but they could not just give you the font. They would have to delete their own copy then as well. Anything else would be both illegal and immoral, because you would be getting something that you didn't rightfully pay for. <br> <br>Linotype Akzidenz Grotesk and Basic Commercial will remain licensed products of Linotype's parent company Heidelberger Druckmaschinen AG as long as Linotype and/or their parent company exist as coprporate entities. <br> <br>Berthold Types in Chicago holds itself to be the legal successor company of H. Berthold AG. So, if you acquire an old Berthold font illegally, the new Berthold Types could still be justified in pursuing you as far as I know, because you WOULD be violating a EULA condition of their's, even if don't believe it! <br> <br>Rodrigo, I would encourage you, or your friend, to just buy a copy of Basic Commercial from Linotype! A single weight just costs $22. Surely that isn't too much to pay for such a renowned design. <br><a href="http://www.linotype.com/114/basiccommercial-family.html" target="_blank">http://www.linotype.com/114/basiccommercial-family.html</a> <br> <br>That your friend only want to use the font for private or academic pursuits is unfortunately not a factor in purchasing decisions. You need to purchase a license for a font in order to use it on your computer, not just to create commercial work for clients. <br> <br>I work at Linotype, and would be happy to answer any more licensing questions that you might have. You can contact me at any time offline, if you'd like.</p>
