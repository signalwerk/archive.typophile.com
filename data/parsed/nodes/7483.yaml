    html: "<p>Simon: <br>And yet, for Linotype a big NO if you buy from their site, unless you get permission and pay extra: <br> <br>see <a href=\"http://www.linotype.com/1710/licenseagreement-folder.html#1\" target=\"_blank\">http://www.linotype.com/1710/licenseagreement-folder.html#1</a> <br>clause 1.7, 2.4, 3,2 <br> <br>I've found similar discrepancies with other fonts. If you buy ITC Bodoni from ITC you can't embed it without a special license, but Stone Type's EULA makes no mention of embedding. Buy MVB Celestia and you can't embed, buy Adobe's Celestia and you can, as long as you don't allow editing. <br> <br>Caveat emptor for sure.</p>"
    html_clean: "<p>Simon: <br>And yet, for Linotype a big NO if you buy from their site, unless you get permission and pay extra: <br> <br>see <a href=\"http://www.linotype.com/1710/licenseagreement-folder.html#1\" target=\"_blank\" class=\"link-external\">http://www.linotype.com/1710/licenseagreement-folder.html#1</a> <br>clause 1.7, 2.4, 3,2 <br> <br>I've found similar discrepancies with other fonts. If you buy ITC Bodoni from ITC you can't embed it without a special license, but Stone Type's EULA makes no mention of embedding. Buy MVB Celestia and you can't embed, buy Adobe's Celestia and you can, as long as you don't allow editing. <br> <br>Caveat emptor for sure.</p>"
