    <p>First of all Happy Newyear.</p>
    <p>I have a question, do U have/know if there is a font like Titillium, with the nordic/skandinavian æøå / ÆØÅ</p>
    <p>Its the letters UPPERCASE<br>
    Latin capital letter AE = Latin capital ligature AE Æ Æ Æ Æ Æ Æ<br>
    Latin capital letter O with stroke = Latin capital letter O slash Ø Ø Ø Ø Ø Ø<br>
    Latin capital letter A with ring above = Latin capital letter A ring Å Å Å Å Å Å </p>
    <p>Its the letters DOWNCASE<br>
    Latin small letter ae = Latin small ligature ae æ æ æ æ æ æ<br>
    Latin small letter o with stroke = Latin small letter o slash ø ø ø ø ø ø<br>
    Latin small letter a with ring above = Latin small letter a ring å å å å å å </p>
    <p>that i need, it dont need to be free, but it need to have a look like Titillium and have ÆØÅ/æøå</p>
