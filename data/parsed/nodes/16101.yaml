    <div class="info">Submitted by <a href="/user/7006" title="View user profile.">paul d hunt</a> : 7.Nov.2005 7.57am </div>
      <p>*+*+*+*+*+*+*+*+*+<br>
    Seasons Greetings!</p>
    <p>Just in time for holiday design projects, the Lanston<br>
    Christmas Ornaments collection has a definite nostalgic<br>
    and elegant feel for classic Christmas and Winter<br>
    iconography. The set contains 5 fonts, including LTC<br>
    Christmas Ornaments and LTC Holly Leaves. Both are<br>
    designed to allow the user to create their own two-color<br>
    design combinations. An indispensable set for the<br>
    Christmas season, they are perfect for custom card<br>
    creation or any other winter holiday graphics.</p>
    <p>The set is available at 25% off until December 1st 2005 <a href="http://www.p22.com/lanston/products/christmas.html" title="http://www.p22.com/lanston/products/christmas.html">http://www.p22.com/lanston/products/christmas.html</a></p>
    <p>*+*+*+*+*+*+*+*+*+*+*+*+*+*+*+*+*+*+*<br>
    Yule like this</p>
    <p>In the spirit of the holiday themed fonts, we are also<br>
    offering the just released “Yule” set at 25% off as well.<br>
    ($29.96 until Dec 1st 2005) <a href="http://www.p22.com/ihof/yuleset.html" title="http://www.p22.com/ihof/yuleset.html">http://www.p22.com/ihof/yuleset.html</a><br>
    (single Yule fonts are regular price)</p>
    <p>*+*+*+*+*+*+*+*+*+*+*+*+*+*+*+*+*+*+*<br>
    You’ll love this</p>
    <p>Our holiday classic, the P22 snowflake font. It’s Free! <a href="http://www.p22.com/free/snow.html" title="http://www.p22.com/free/snow.html">http://www.p22.com/free/snow.html</a></p>
    <p>*+*+*+*+*+*+*+*+*+*+*+*+*+*+*+*+*+*+*<br>
    New Catalog</p>
    <p>We also have just received our 24 page 2006 type specimen<br>
    booklets. Free for the asking... just fill out your<br>
    mailing information here: <a href="http://www.p22.com/products/2006catalog.html" title="http://www.p22.com/products/2006catalog.html">http://www.p22.com/products/2006catalog.html</a></p>
    <p>*+*+*+*+*+*+*+*+*+*+*+*+*+*+*+*+*+*+*</p>
    <p>Happy Holidays.<br>
    P22</p>
