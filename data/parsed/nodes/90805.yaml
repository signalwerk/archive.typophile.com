    <p>UNIVERSAL filmstudios have launched a remake of their <a class="freelinking external" href="http://www.youtube.com/watch?v=bNJW113tbKk&amp;feature=player_embedded" rel="nofollow">iconic movie intro logotype</a>.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/universal_6500.jpg"></div><p></p>
    <p>I find it pretty juicy. </p>
    <p>But now to type.</p>
    <p>The main line looks like a Gill Sans / Akzidenz mixture, while the subhead is Futura. It does not look like a deliberate combination choice.</p>
    <p>The spacing of the main line is nothing but a complete mess.</p>
    <p>The S in UNIVERSAL is too small.</p>
    <p>The gap between 100th and Anni… is extraorbital.</p>
    <p>– A splendid animation, great music, high ambitions. Only type was neglectable.<br>
    I wonder.</p>
