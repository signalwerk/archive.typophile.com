    html: <p>Changing from Web to Print. Yippie, the tide is turning. I always found webcoding boring as hell and am SO happy to have a partner who is ace at doing Flash/ActionScript stuff, so I can concentrate on working on PAPER. I'm getting old, must be why I LOVE the web but dislike progging. Maybe I'm just too intuitive and impulsive for that, all my codes were always buggy as hell :-).  <br>If you have any questions, I'm sure folks here can help you out. As typography is still more a print thingie, many here will know how to get a decent PDF done and grid and layout IS typography, so... it is even ontopic :-)</p>
