    html: <p>Currently, I find myself printing out a bunch of drafts on my inkjet just to check type sizing, etc.  Type looks so different when printed vs when it's one screen.  The size and weight always throw me. <br> <br>I need to get confident about selection there. <br> <br>HD, you mentioned PDF.  Is that the prefered way to hand off to a printer.  Not sure about Quark, but InDesign has a nice packaging feaure that lets you export all the images, settings, fonts, etc.  Very handy. <br> <br>Also, my existing issue has to do with margins.  I'm doing a brochure piece that has a contemporary design style (you know, a 1/4" white margin that frames moody background photos).  Anyway, it appears fine in InDesign, but when I print, my margins seem off?  Looks like I have everything set correctly.  Can I post the file here for someone to take a look? <br> <br>If so, what format?  PDF or the actual InDesign file?</p>
