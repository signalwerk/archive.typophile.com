    votes: null
    html: |-
      <p>Create all of your documents at 120% of their original size. For example, if the specs tell you to create something at legal size (8 1/2 x 11"), create it at 10.2 x 13.2".<br>
      Then use your font at 12pt (which is what the Properties will show). When printing to the intended page size, select "Scale to Fit" in the printing dialog. Of course you must be printing to the intended paper size.</p>
      <p>If you say, "well, won't they notice the page size is larger?", I can ask the same thing about using a smaller font size than requested.</p>
      <p>(Without <em>clearly</em> cheating like this, about the only real option I can think of is scale down an otherwise perfectly good Helvetica with a good font editor that will not screw up any of the size related font measurements and features, as there are spacing or kerning.)</p>
    html_clean: |-
