    date_raw: 21 Mar 2012 — 1:03pm
    votes: null
    html: <p>It's complicated, but basically I work for an insurance company with a Compliance Department, and they have an arbitrary regulation that says all body copy needs to be in 12pt. That is way too huge and creates gaudy, ugly design for the marketing materials. The way they check this is to open up my PDF in Acrobat and check the Properties. If I can have the Properties read 12pt (when in reality the font is 10pt) that is the goal. These people know nothing of typography and I'm sick of their stupid regulations deciding my designs.</p>
