    html: |-
      <p>Are you absolutely sure that the font size is NOT a legislated requirement from the state or federal government? If it is, trying to evade it by twiddling the font is the kind of thing that could get your employer in serious legal trouble, and you fired.</p>
      <p>I recently consulted for one of the ten largest companies in the US on essentially this exact same issue. Somebody somewhere along the way screwed up—possibly because they decided they were above some silly “arbitrary regulation”—and they are now facing litigation about the type allegedly not being big enough in a standardized letter they send out.</p>
      <p>I also was once consulted by the San Diego DA's office on a similar case. It was marketing materials, but there was indeed a legal requirement around point size. Unfortunately the malefactors came up with a very clever way to deke out the requirement, which I won't repeat here (though I will probably cover it in my talk at Typo SF). But suffice it to say I told the DA's office they were out of luck.</p>
      <p>In other words, be very careful.</p>
      <p>Cheers,</p>
      <p>T</p>
