  html: <p>Does anybody know a way (likely through a font creator or editor program) where I can trick the font into thinking it's a different point size? Basically, I am working with Helvetica Neue, and it happens to be a very large font. I want the pull down menu in whatever program I'm using to display a 12pt as 10pt, for example. Even though it's truly a 12pt font, it is reading out as a 10pt font. Is there any way to reset the point size designations in a font so that it displays different designated point size numbers?</p>
  html_clean: <p>Does anybody know a way (likely through a font creator or editor program) where I can trick the font into thinking it's a different point size? Basically, I am working with Helvetica Neue, and it happens to be a very large font. I want the pull down menu in whatever program I'm using to display a 12pt as 10pt, for example. Even though it's truly a 12pt font, it is reading out as a 10pt font. Is there any way to reset the point size designations in a font so that it displays different designated point size numbers?</p>
