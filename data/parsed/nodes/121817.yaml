      <p>This is completely awesome and completely genuine. The designer works at <a href="http://www.siamtype.com/font.html" rel="nofollow">Siam Type</a> and they were selling t-shirts with this design. (There's also no way anyone would make a mockery of this subject in Thailand.)</p>
      <p>Though this recycled-Latin chic is really common on Thai versions of Hollywood movie posters, I find it really fascinating that they'd choose to use not a single Thai letter for such a national occasion. Clearly all these glyphs are Latin characters reappropriated (with one modification, the V is stretched asymetrically to form ง.) I just love the unapologetic way the parenthesis and comma are used for the vowel mark ิ and tail of ญ respectively, it's just so naive and cheeky, and bizarre! I need to think some more about this.</p>
