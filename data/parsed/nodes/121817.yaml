      <p>&gt;The people seeing it, the people affected, don't care much about such origins. Mostly they feel that "Latin is better than Thai".</p>
      <p>I don't think so. The Thai script is especially adaptable and as we saw this week in the Flickr group <a href="http://www.flickr.com/groups/cross-script-letterforms/pool/" rel="nofollow">Cross-script letterforms</a>, it can withstand not only Latinisation, but Hangeulisation, Sinification, Japaneseification, Bengalification and Devanagarisation. Thai popular culture loves imitation, it's not really a question of foreign things being better, rather that there are things outside of Thailand that Thais want to appropriate and offer their own unique take on. It's more a question of pick'n'mix than pushing things in any one direction. That makes it often very indiscriminate and muddled, superficial and nonsensical, but also very fast-moving, vibrant, non-judging and fun.</p>
      <p>I like the comparison with Morison and wonder about how he would have approached Thai. We'll never know of course, but looking at the way he brutalised Greek I have some ideas. His approach seems to have been very sober and practical, using a repertoire of Latin-ish shapes to compensate for a lack of understanding of Greek letterforms. I don't think he would have had the guts or the imagination to go anywhere near this far. Yes, this recycled/repurposed Latin Thai is reckless, but I find it somehow delightful in its complete abandonment of Thai shapes. In a way, they demonstrate such familiarity with Thai letterforms that they can be done away with, abstracted so far that they're not there at all: their presence must be inferred from the Latin letters that stand in their place. To me, the way this is executed is something only a Thai designer could have come up with, which paradoxically makes the whole thing quintessentially Thai.</p>
