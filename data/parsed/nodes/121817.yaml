      <p>I can certainly appreciate the benefits of joyful imitation; it's something that has made Western cultures richer, hence stronger. I do fear however that imitation can be used to [mis]guide discontent. Right now for instance there's a vacuum of governance in Thailand, and people in power can use visual language to push the country in a political direction that suits them, to the detriment of culture. This includes co-opting well-intended imitation to eventually make even Thai text fonts copy the forms of Latin with little regard to what they actually need to be doing, culturally, functionally.</p>
      <p>Basically to me any design effort comes with responsibility, beyond the personal joy it brings. Back when I myself used to make Latinized Armenian fonts, I was so happy with and proud of my "formal gymnastics" of moving shapes around; but then I realized that was a very superficial approach and opened my eyes to the damage I was doing, without however reverting to the conservatism of blindly reviving tradition. That said, it's certainly a tough balancing act, which I will never completely master.</p>
      <p>hhp</p>
