      <p>As I noted in another thread, I'm beginning to get an understanding of what is going on. Chanik Aramian apparently came up with the earliest influential Latinized Armenian face, and it looks as though he did so because the traditional faces seemed to need a breath of fresh air.</p>
      <p>From what I've learned earlier about conditions in the diaspora as against the homeland, it looks, though, like there's going to be little demand for better Armenian typefaces. The homeland doesn't see anything amiss with heavily Latinized faces - they're what they're used to.</p>
      <p>(Although the phonetics of Western Armenian, unlike Eastern Armenian, are such that it doesn't <em>need</em> all the letters of the Armenian alphabet - Latin would be adequate for <em>that</em> version of the language - at least there is no danger of that happening. The influence of the church, a naturally conservative institution, contributes heavily to the survival of the Armenian language at all in the diaspora.)</p>
      <p>Some of the diaspora prefers the traditional faces without change, and some of it apparently doesn't mind the Latinized versions. Without demand in the community, expecting Monotype or Microsoft or Google to see that anything's wrong is difficult.</p>
      <p>Still, typefaces that attempt to meet your goals may sneak in to Google's font collection, and <em>maybe</em> they'll even get noticed.</p>
