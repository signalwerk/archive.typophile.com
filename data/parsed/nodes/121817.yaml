      <p>Given that this is display typography, yes, different rules apply. If this sort of faux-Latin Thai were used for text typography, even if the people of Siam were able to read it, I doubt it would fly.</p>
      <p>The Indic scripts, although very diverse visually, approach isomorphism in structure - most of them can be used to write Sanskrit, although they may include additional letters for that purpose not used in writing the languages to which they belong.</p>
      <p>One could imagine, therefore, that eventually one single script might replace the existing scripts used from Tibet to Thailand, from Sri Lanka to Laos. I don't think that's particularly likely, as a common script won't do much to surmount the language barriers in that region, and in today's age of digital fonts and laser printers, it's not as if supporting different scripts is an intolerable economic burden somewhere.</p>
