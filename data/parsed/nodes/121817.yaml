      <p>Not understanding the Thai language, I can only guess at the legibility of that poster. I doubt that it's saying that Latin is "better", but it might be saying that Latin is more dignified, more suited to contexts where refinement, elegance, and prestige are needed.</p>
      <p>The economic power of the Latin alphabet nations mean that a lot of typefaces have been around for it for a long time. And the model for capital leters in Latin serif faces... is the Trajan column, erected to proclaim an emperor's achievements. So our script is well-adapted to announcements on behalf of royalty.</p>
      <p>When I see some of the Indic scripts, I tend to associate them with the hand-painted signs of small businesses; colorful, and following a standard writing model.</p>
      <p>If one tries to style a script to say something else, the Latin script provides a lot of ready-made models. A post here, I think by Hrant, showed a link to how this sort of thing can be done the right way -</p>
      <p><a class="freelinking external" href="http://blog.daltonmaag.com/arabic-latin-logo-matchmaking-workshop/" rel="nofollow">http://blog.daltonmaag.com/arabic-latin-logo-matchmaking-workshop/</a></p>
