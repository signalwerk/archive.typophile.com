    <p>"Normandie" is a new Art Deco / industrial sans font I've designed, named after the 1930's French ocean liner SS Normandie. I currently have nine weights done, though next I'm planning on adding a set of italics as well as perhaps a condensed variant.</p>
    <p>Since Normandie is really only designed to work at display sizes, I've also designed a "companion", called "Normandie Text". I've toned down some of the more eccentric pieces of the original Normandie design, enlarged the x-height, slightly condensed the uppercase and altered the forms slightly to make it less "geometric". The hope is that this will read well at text sizes while still acting as a "little brother" to Normandie.</p>
    <p>Let me know what you think!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/normandie_6145.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/normandie_text_4411.jpg"></div><p></p>
