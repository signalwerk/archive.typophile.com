      <p>Any thoughts on either of these? I'd love to get some feedback on the design. I'm starting to think about reworking the design slightly -- the original intent was to do a blend of French Art Deco and American Industrial, though I think the American aspect of the design comes through a lot more than the French (as much as I love Gotham I am a little uncomfortable about how similar the caps is in some cases).</p>
      <p>Does anyone know of some good resources (online or otherwise) for looking at French art deco typography?</p>
