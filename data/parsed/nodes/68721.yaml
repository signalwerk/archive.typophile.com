      <p>Thank you both! I've made a few (minor) changes to the letterforms and it seems to be working a bit better...I'll post a new version of both in a week or so.</p>
      <p>I will definitely look into the naming...I certainly don't want to invite confusion (my other font up on these boards, "Roster", was originally "Roster Gothic" until I discovered Mark Simonson's "Raster Gothic"). I really wanted to name this font after the ship (I'm a devoted ocean liner nerd) but I'll run through some other possible names, too. Perhaps "Pugnet" after the ship's first captain, or "Villar" after Henri Villar, the Normandie's purser who was very popular with passengers.</p>
      <p>Anyways, I'll hopefully post a new version soon with some fixes. If anybody else has recommendations let me know!</p>
