      <p><cite>named after the 1930's French ocean liner SS Normandie</cite></p>
      <p>Which has briefly be seen here (<a href="http://www.typophile.com/node/60626" title="http://www.typophile.com/node/60626">http://www.typophile.com/node/60626</a>) ;-)</p>
      <p>I like it overall, and, while I understand your concerns about the similarities with Gotham (and Neutra), I think it retains a distinct charme.</p>
      <p>But, for better judging it, I think you should give some sample of text other than "The quick brown fox" (that's for Normandie sans-text).</p>
      <p>As for the text version, I think the caps are still a little too wide compared to the lower case. Also, x and maybe r and s too are a bit wide, while o seems narrow. Poor e seems suffering a bit of overbite ;-)</p>
