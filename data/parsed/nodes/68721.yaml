      <p>Your display/UC looks really great for me. It has a charm of XIX century founts. Here is Konsul produced ca. 1870:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/konsul_5043.png"></div><br>
      BTW "Normandes" - group of very heavy classicistic Roman types.<br>
      "Normande"  - typeface made by Haas Giesserei, Munchenstein in 1873<br>
      "Normandia" - typeface designed by Aldo Novarese and Alessandro Butti for Nebiolo, Torino, 1946-49<br>
      I think it is not fortunate to name Your work similar. Not to mention misleading and impolite to old masters. (the last is a matter for another discussion and my opinion only)<p></p>
