    html: |-
      <p>Thanks Thomas!</p>
      <p>In regard to the original question, and the response from Charles Ellertson, if you buy from MyFonts, my understanding is that you are bound by each foundries own EULA, not an overriding MyFonts EULA, so you could buy the Adobe versions of the fonts if you felt the EULA was better. </p>
      <p>You could also equally buy them from FontShop or Fonts.com direct (not sure if Minion Pro is sold there).</p>
      <p>One question about Minion Pro, if you have InDesign, it is one of the bundled fonts, so you should already have it. Or do you need the license for a client's use?</p>
      <p>What version of InDesign are you using?</p>
