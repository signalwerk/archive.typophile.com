    html: |-
      <p>Better to buy from Adobe. If there are any differences in the licenses, the Adobe license will be in your favor. At this late date, it won't help you with modification (for that, the purchase had to be before August 8, 2011), but might with font embedding in certain kinds of digital documents. Best to check.</p>
      <p>See</p>
      <p><a href="http://www.adobe.com/products/type/font-licensing/additional-license-rights.html" title="http://www.adobe.com/products/type/font-licensing/additional-license-rights.html">http://www.adobe.com/products/type/font-licensing/additional-license-rig...</a></p>
      <p>At this point, the licenses may be the same. But if they're not, be assured the Monotype conglomeration will get you for every nickel thy can. Except it won't be nickels... And they also now own several distribution channels, including MyFonts. Adobe is rather more generous.</p>
