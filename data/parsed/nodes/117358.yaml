      <p>Sye: twice, no.</p>
      <p>First, it doesn't matter whether you are on Windows or on Mac -- the set of free (and, might I add, <em>very good</em>) fonts is the same.</p>
      <p>But, second, only Minion Pro is in that list. Zapf Dingbats comes, IIRC, with Acrobat Pro (but if you have a recent Arial Unicode MS, you don't need it), and Avenir and Antique Olive need to be purchased separately.</p>
