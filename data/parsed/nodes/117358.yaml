    html: <p>In my opinion Avenir Next is much better than Avenir. It has optically corrected italics, not just the slanted ones (a disease many sans serifs from the early years of PostScript fonts suffer from). Also the quality of the curves of Avenir Next comes much closer to the original digital Linotype version from the pre-PostScript era.</p>
