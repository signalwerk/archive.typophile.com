    html: <p>Thanks for the response. I haven't had time to work on it again since posting but I agree about the N's width and the S being too closed. The G was kind of an experiment. It just came out in the process and I thought I'd see how others felt. The "hard to read" factor will be part of the type being discovered amongst tree roots made of analog audio cables. When it's all said and done, I'll repost and see how it goes. Thanks!</p>
