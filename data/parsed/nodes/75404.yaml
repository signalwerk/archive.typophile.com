    html: |-
      <p>For most typefaces a Desired setting for the Word Space of 100% is way too wide… I mostly use a Desired setting in the order of 85–95%, with a Minimum set around 10% below that and a Maximum of around 10% over the Desired setting.</p>
      <p>I concur with Freibergers opnion that glyph scaling can be noticable and use only a 1% divergence there. There ARE some typefaces that can withstand a more robust scaling (eg Caecilia, which I often use scaled to 92%), but I use that in a global fashion, not on a per line basis.</p>
      <p>Letter Spacing has too much of an impact on the ‘colour’ of your typeblocks and reeks of cheap and nasty US-newspaper design (and a reminder that the Standard Settings of both InDesign and QuarkXPress have been hardcoded by US-engineers who haven been exposed too much to bad typography). A strict no-no in my book!</p>
