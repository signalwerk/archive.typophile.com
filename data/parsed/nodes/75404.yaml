    html: |-
      <p>I think three factors must be considered: kind of font, column width and language. Of course, tests and eye-checking is mandatory. For books set in serif fonts and using Portuguese I adopt:</p>
      <p>Word Spacing: 90 | 100 | 125<br>
      Letter Spacing: -3 | 0 | 3<br>
      Glyph Scaling: 100 | 100 | 100</p>
      <p>This will produce more even spaces but increases hyphenation. As in Romance languages hyphenation is not an issue so annoying as in English (due to more regular syllabic construction), I prefer to priorize space distribution.</p>
      <p>As a reference, Bringhurst advocates glyph scaling of –3% to +3% in <em>Elements of Typographic Style</em>.</p>
