    html: |-
      <p>Word spacing from 80% to 133% is much more apparent and may be more distracting than a mere 2% distortion of letters.</p>
      <p>At 10pt type, 2% is a mere 0,07mm which I seriously doubt anybody can notice with their barenaked eye. Especially when type isn't geometric. 2% can easily be visually distorted as a factor of other parallaxes. So a perfectly 100% type can look more distorted due to rivers of space than 2% distorted with better fitting.</p>
      <p>Just my 2 cents.</p>
      <p>But it's true: God is in the detail when it comes to typography.</p>
