    html: |-
      <p>I think glyph scaling is a least resource as it causes glyph distortion –a very small one, but still a distortion. I use it just when other settings are not enough.</p>
      <p>Almost all readers will never notice a 2 or 3% scaling. But I do and it's always possible other people notice it too. So I try to avoid any possible distortion in glyphs.</p>
      <p>Of course, mine is a quite conservative approach.</p>
