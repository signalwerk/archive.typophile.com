    <p>Dear Members and friends!<br>
    During the last year I'm writing a research on Hebrew type faces designed by the most prominent designer - Zvi Narkiss.<br>
    The research will contain spectacular visual materials which are part of the impressive archive Narkiss created. This archive is also the basis of my research.<br>
    This project is extreamly important and undoubtedly significant to students of typography, lecturers and design professionals. Also to the general public viewing the Hebrew language and typography manifested so beautifully in Hebrew type faces developed in course of the 20th century and today.<br>
    Once it's finalized, the research which will be published as book in Hebrew and in English. It  will contain a broad range of images, shown for the first time, particularly interesting thanks to it's relevance in historical, cultural, social, technological and design contexts .</p>
    <p>A month and a half ago I uploaded to "Headsart" (Mass funding site) the research i'm writing, in order to raise the budget for launching and publishing the project.</p>
    <p>Attached is a link to the project:<br>
    <a href="http://www.headstart.co.il/project.aspx?id=8657" title="http://www.headstart.co.il/project.aspx?id=8657">http://www.headstart.co.il/project.aspx?id=8657</a></p>
    <p>If you wish to take part in this unique project, and help make it happen, you are warmly invited to join!<br>
    Please find attached the link to my project. Thank you all very much!</p>
    <p>Thank you very much!<br>
    Yehuda Hofshi<br>
    Tel Aviv</p>
