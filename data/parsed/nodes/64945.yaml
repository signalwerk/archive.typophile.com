    <p>Hey Typophiles.</p>
    <p>I am having a little trouble with creating this typeface for a company...<br>
    It is supposed to be paired with a mark, so i am trying to keep it subtle, while still having some features on it. </p>
    <p>The typeface is a heavily customised Eurostile LT</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Typeface_5484.jpg"></div><p></p>
    <p>I would love to hear your views on it. And some opinions on how this could be improved.</p>
    <p>I am especially doubting on the e,c and w...</p>
    <p>Thanks for your help.</p>
