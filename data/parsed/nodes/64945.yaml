    html: |-
      <p>If this type is not going to be used for setting arbitrary text, then #5, but with /e/s lower stroke extended further to the right (i.e take the width from #1 and the shape from #5). #5 looks the best when the above image scaled down to 30%.</p>
      <p>If it <em>is</em> going to be used more widely that just for the logo, then I think wider /r/ is a better option.</p>
      <p>Though now the shape of /c/ is inconsistent with that of /p/, which is something that is pretty evident on a scaled down version.</p>
