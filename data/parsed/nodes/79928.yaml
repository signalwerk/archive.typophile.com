    html: |-
      <p>OpenType class kerning isn't supported very well by Office applications in general. But usually kerning is turned off by default in Office applications, so it’s quite unlikely anyone will notice. I'd just leave it as it is.</p>
      <p>Another option would be to expand the class kerning and write a »plain« kern table into the font. But expanding the class kerning may result in a lot of kern pairs, and the limit that can be used is somewhere over 10000, and you lose all the advantages of kerning classes.</p>
