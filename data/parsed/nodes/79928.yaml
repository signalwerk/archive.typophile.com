    html: |-
      <p>As OTF fonts do not normally contain a "kern" table, only GPOS kerning, the Adobe font driver in Windows (part of Windows GDI) and ATM on Mac OS 9 expands the GPOS kerning into a flat table and subsets it for Latin-1. Applications that do not process OpenType Layout features use that kerning. </p>
      <p>It's very likely that on Linux, FreeType works similarly. </p>
      <p>OpenOffice does not, AFAIK, process OpenType Layout features in fonts. </p>
      <p>As Jens points out, one way to work around the problem is to generate both GPOS kerning and the old-style plain "kern" table kerning (this is controlled in Preferences / Generating OpenType &amp; TrueType / Kerning). The maximum number of "kern" table kerning pairs is 10920, and this is the maximum limit you should enter in "Limit total number..." there. </p>
      <p><em>Technical background: Each pair in the "kern" table takes 6 bytes, there is a 14-byte header, and the maximum size of a subtable is 64K bytes, so (65536-14)/6 gives you 10920. Most font engines only support a "kern" table with one subtable, so there's the limit.</em></p>
      <p>This might help, provided that the font driver actually looks for the "kern" table in OTF fonts, which may or may not be true, depending on the operating system you're using OpenOffice in. </p>
      <p>Best,<br>
      Adam</p>
