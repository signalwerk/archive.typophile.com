  html: <p>This may be something I should ultimately just let go of and hope nobody notices the result, but I'm noticing that when I generate an OTF from FontLab, and test it in OpenOffice, kerning is only applied to the glyphs in Latin-1. Though they are in the same class, Á kerns but Ā doesn't. Is this a limitation I should just expect, or is it an aspect of how I've generated my font that I can correct somehow?</p>
