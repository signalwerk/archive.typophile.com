      <p></p><div class="imageWrap"><img src="http://typophile.com/files/parisineofficeptf_02.gif"></div><br>
    <a class="freelinking external" href="http://www.typofonderie.com/alphabets/view/ParisineOfficePTF" rel="nofollow">Parisine Office PTF</a> is a double typeface: Set serious and crazy texts with the same typeface depending the OpenType features applied. From €210 for 8 cpus users.<p></p>
    <p><a class="freelinking external" href="http://www.typofonderie.com/alphabets/view/ParisineOfficePTF" rel="nofollow">Parisine Office PTF page</a><br>
    <a class="freelinking external" href="http://www.typofonderie.com//alphabets/order/ParisineOfficePTF" rel="nofollow">Parisine Office PTF prices and purchase</a><br>
    <a class="freelinking external" href="http://www.typofonderie.com//alphabets/samples/samples_parisineofficeptf" rel="nofollow">Parisine Office PTF big size samples page</a><br>
    <a class="freelinking external" href="http://www.typofonderie.com//icono/alphabets/pdf/ParisineOfficePTF_pdf.pdf" rel="nofollow">Parisine Office PTF pdf specimen</a></p>
    <p>This new variation “PTF” is an extension of the tailored Parisine Office made for RATP. It include many more valuables features who will improve dramatically the user experience. The new Parisine Office PTF with its smaller xheight will perform better on text setting and editorial projects. The design of the italic lowercases is more cursive than in Parisine PTF.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Poptf_2.png"></div><p></p>
