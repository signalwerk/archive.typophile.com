  html: |-
    <p>Hi there. I’m converting an OpenType Indic‐script font to AAT, which uses mark‐to‐base and mark‐to‐mark positioning (I think) and I was wondering if there was an easy way to use these positing data when generating AAT tables? I’m rather a novice at this so any help along these lines would be appreciated.</p>
    <p>Thanks,<br>
    – Nicholas.</p>
