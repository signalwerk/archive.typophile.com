    <p>Hi there!</p>
    <p>I'm sure, this had been asked a lot of times before : )</p>
    <p>It's about the pricing for a corporate headline font ( three styles, three weights ) for a european TV channel.</p>
    <p>So, how much can I call?  I have to submit an »exclusive« and a »not exclusive« offer. Is there a big difference, anyways?</p>
    <p>What do you think? Please help me with some figures.</p>
    <p>Thanks in advance,</p>
    <p>Jui</p>
