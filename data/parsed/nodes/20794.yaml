    <p>The case for .zipped fonts attached to Web pages is made here by the W3C’s Hakon Wium Lie. </p>
    <p><a href="https://web.archive.org/web/20080821144758/http://news.zdnet.com/2100-3513_22-6085484.html" title="http://news.zdnet.com/2100-3513_22-6085484.html">http://news.zdnet.com/2100-3513_22-6085484.html</a> </p>
    <p>Apparently it’s Microsoft, not type designers that will suffer if the plan to support .zipped up fonts attached to Web pages is adopted by browser makers. Not sure I follow the logic, but oh well. </p>
    <p>Cheers, Si</p>
    <p>See also the previous thread.</p>
