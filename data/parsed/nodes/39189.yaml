    html: |-
      <p>In 1, the way the R cradles the O serves your theme best, but repeating it with the sharp-cornered E in "care" fails; it draws attention away from the RO, which if allowed to stand alone as the focus of the logo would evoke quite well what Satya is on about. Perhaps you could even make the O somewhat larger to make it more clear.</p>
      <p>Of the the designs given, I think you can eliminate 2, in which the swash wanders toward then away from the tagline, 3, in which it wanders away before coming back, and 4, in which it just leads away from the whole thing. These all have an undertone of inattention, which you certainly don't want. 5 is the most aesthetically pleasing in that regard, as it leads directly to the tagline just as you would hope the attendant would run straight to the baby when it needs something.</p>
