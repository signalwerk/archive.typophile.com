  html: |-
    <p>This logotype is for a service that you can get for the first few months of bringing your new baby home. They will help out by watching your baby throughout the night so you can sleep - or come do your laundry, run your errends so you can spend time with your baby...<br>
    Also considering "Welcome Home" as the tag line instead of "Welcome Baby"</p>
    <p>Feedback on these different versions would be most appreciated.</p><div class="imageWrap"><img src="http://typophile.com/files/PromiseCare_A_4119.gif"></div><p></p>
