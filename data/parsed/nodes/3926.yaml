  - id: 29298
    user: 577
    date: 2002-09-03T08:08:00
    date_raw: 3 Sep 2002 — 8:08am
    votes: null
    html: <p><img src="http://www.typophile.com/forums/messages/4100/2526.gif" alt="Avaya"> <br>There seem to be several people taking credit for this identity. Both <a href="http://www.tbd-sf.com/" target="_blank"> TBD</a> and <a href="http://felixsockwell.com/" target="_blank"> Felix Sockwell</a> list it on their sites. While Felix credits Joel Templin (The T in TBD) as creative director, TBD doesn't acknowledge Felix at all, though I know they frequently work together, so I am confused as to who did what and for whom. <br> <br>As for the original vs. the "client ruined" design, I prefer the latter. The first is totally impractical when it comes to  application. While neither of them are stunning, the final version is credible, unique and surprisingly memorable. <br> <br>What I find more objectionable is that a designer would post a disclaimer on his site lambasting his client. Every project is a collaborative effort, and often the results are less than we feel we could have achieved if left to our own devices. But the fact of the matter is that design is a service industry, not an artistic autocracy. Our clients are an essential part of the equation, and bad-mouthing them discredits design as a profession.</p>
    html_clean: <p><img src="http://www.typophile.com/forums/messages/4100/2526.gif" alt="Avaya"> <br>There seem to be several people taking credit for this identity. Both <a href="http://www.tbd-sf.com/" target="_blank" class="link-external"> TBD</a> and <a href="http://felixsockwell.com/" target="_blank" class="link-external"> Felix Sockwell</a> list it on their sites. While Felix credits Joel Templin (The T in TBD) as creative director, TBD doesn't acknowledge Felix at all, though I know they frequently work together, so I am confused as to who did what and for whom. <br> <br>As for the original vs. the "client ruined" design, I prefer the latter. The first is totally impractical when it comes to  application. While neither of them are stunning, the final version is credible, unique and surprisingly memorable. <br> <br>What I find more objectionable is that a designer would post a disclaimer on his site lambasting his client. Every project is a collaborative effort, and often the results are less than we feel we could have achieved if left to our own devices. But the fact of the matter is that design is a service industry, not an artistic autocracy. Our clients are an essential part of the equation, and bad-mouthing them discredits design as a profession.</p>
