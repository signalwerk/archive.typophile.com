    html: "<p>&gt; I can't help wonder if perhaps the designer wanted it to be first a logotype and second a clever hidden arrow. <br> <br>Well, I'd guess so too, but I think the arrow is too hidden, my point being that the designer was maybe appealing more to himself/other_designers than \"users\"; making the arrow more obvious (like by gently highlighting the negative space in some way) would have drawn jeers from other designers (the shame, the ridicule!), but would have ellicited \"that's kinda neat\"s from users. Which is more important? <br> <br>Here's an example of an ingenious negative-space trick that doesn't need any help: <a href=\"http://www.bigten.org/\" target=\"_top\">http://www.bigten.org/</a> <br>(Note: The Big Ten Conference is actually 11 teams now.) <br> <br>&gt; I was sad when they redesigned it. <br> <br>The whole redesign looks wannabe to me: going in the wrong direction, backwards to what used to be cool 5 years ago or something. At least they kept the sublime Proforma. <br> <br>hhp</p>"
