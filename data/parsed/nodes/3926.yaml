    html: <p>We had a discussion about FedEx recently (maybe in Typo-L).  <br> <br>Take a look at the 'elf' trademark. The 'f' is pretty quirky, the 'e' is too big. I wouldn't call this good typography. But I would regard the *mark* (the image) very good, unique and catchy. <br> <br><a href="http://www.elf.fr/indexus.html" target="_top">http://www.elf.fr/indexus.html</a> <br> <br> <br>So what is the conclusion? Maybe that typographic excellence isn't everything when creating corporate identity.</p>
