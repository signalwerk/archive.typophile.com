    html: <p> What? They've changed from the original logotype? I always thought that was a classic; it could well have been designed in the thirties by some rogue Bauhaus ne'er do well.  <br>And personally, I like their approach to fast food compared to the burger chains. Their ingredients may be factory-farmed but the experience of walking into a Subway you never visited before is a bit more like a roll of the dice than the totally predictable experience at any given McDonalds etc. The care or lack thereof that the Subway "sandwich artists" give to your sub is something to behold. It's an intensive interaction the like of which you don't even get at a sit-down $12 entrée restaurant.  <br>I hope the logo debacle isn't some sort of indication that an unwelcome change is in the offing. <br> <br>And let's not forget that their interior decor features late 19th/early 20th century newspaper reproductions covering the walls. - full of nice examples of the use of Cheltenham, amongst other types. There must have been some sort of typophile involved in their early retail design team. It would be nice to know the story behind this. </p>
