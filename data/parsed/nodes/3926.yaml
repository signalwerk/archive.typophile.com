    html: "<p> Joe // <br> <br>The Big 10 used to have 10 teams. In the 90s, because they wanted more revenue, they added Penn State, a football powerhouse coached by Joe Paterno. That's probably when they changed their logo. <br> <br>But there's another conference that's probably the cause of your confusion: The Big 12. There used to be something called the Southwest Conference. They took 10 teams from that conference, added two more - that's the Big 12. <br> <br>Why they have two Minnesota logos on their web site, I have no idea. <br> <br>If they add another team, then they can just update the negative space I guess, a little more difficult with a '2' than a '1'. <br> <br>bj </p>"
