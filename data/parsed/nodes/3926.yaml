    html: "<p>&gt; FedEx <br> <br>The lesson for me is: don't be so subtle that only other designers notice the effect... <br> <br>The \"reverse\" arrow between \"E\" and \"x\": <br><a href=\"http://www.fedex.com/\" target=\"_top\">http://www.fedex.com/</a> <br> <br>&gt; Maybe that typographic excellence isn't everything when creating corporate identity. <br> <br>Very interesting and astute observation. <br> <br>Another one that bugs me (or actually \"bugged\", since they recently changed it - except it's still bad, just in a different way) is the old Eye magazine logo: what the hell was that rediculously heavy, uncompensated \"y\"?! (Sorry, no sample handy.) <br> <br>hhp</p>"
