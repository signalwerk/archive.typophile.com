  html: <p>This site was announced during this year's Grammy Award's Show. Does the type world need something similar? There are a few sites that have similar information, but from my first browse through "What's The Download" it seems that maybe a more forceful stance could be taken. One initial idea, off the top of my head, would be a site to which all foundries could link. A site that would cover everything, explain everything. <br> <br>Very interesting.</p>
  html_clean: <p>This site was announced during this year's Grammy Award's Show. Does the type world need something similar? There are a few sites that have similar information, but from my first browse through "What's The Download" it seems that maybe a more forceful stance could be taken. One initial idea, off the top of my head, would be a site to which all foundries could link. A site that would cover everything, explain everything. <br> <br>Very interesting.</p>
