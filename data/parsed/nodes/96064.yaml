    html: |-
      <p>Whenever a logotype consists of a string of multiple words, all the same size, style and color, it runs the danger of looking a little dull. Is there some way to have more of a focal point? </p>
      <p>The dot/dots over the "i" are maybe a step in that direction, but they are pretty subtle and I don't think that "studio" is the word that should be emphasized anyway. And the word "of" is the least important word and perhaps should be made less prominent.</p>
      <p>Riccard0's suggestion might be a good approach too.</p>
