      <p>Thank you luma I appreciate your comments. And I'm going back to the drawing board. And after I asked the question, I went, duh, stupid question. I do it all the time. I do logo design, but for some reason I'm having mind block and doing stupid things on my personal logo. That's why I posted it here just to get this type of feed back. I'm forgetting all the rules of design it seems because it's personal and I'm panicking trying to get something put together and not finding what I want and like which is something clean, unique, simple, yet elegant. I've been doing non-profit/volunteer work for ages and now that I'm setting up something where I'm getting paid, everything I know is going out the window.</p>
      <p>So thank you. I needed to hear the comments so I'd get my head back in the game where it needs to be and stop forcing it to work. I've been working on it in-between photo edits &amp; other design work and so I'm behind which adds to the pressure. So, I'm just going to take my time and do it right and start all over for the bazillionth time :).</p>
      <p>Thanks again!</p>
