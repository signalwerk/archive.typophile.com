    votes: null
    html: |-
      <p>You have posted an image with a transparent background it seems. For me the background appears black on one system and white on another - of course giving a totally different look.</p>
      <p>I think the above comments are right on. Drop the subtitle, it shouldn't be part of the logo. Then let studio be secondary in hierarchy. The details of the lettering need some help too. The /u sticks out as strangely shaped compared to the strict geometry of the rest. The overly tall /f, /f, and /d are not working for me. They are too exaggerated and lack a refined balance that I would value in design and photography work. The watermark in the background is just cluttering things, and not adding anything. Maybe either go back to sketching and ideation if you have a solid brief, or consider consulting with a branding expert (i.e. hire a logo designer). The film strip is just too obvious for photography. Good luck!</p>
    html_clean: |-
