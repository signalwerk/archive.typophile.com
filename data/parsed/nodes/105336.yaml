    html: <p>SFDir or UFO sources in Mercurial or Git, using Github, Bitbucket or Gitorious, are all pretty much the same... I expect most projects to use UFO on Github in the near future, and I'm contributing to the <a href="https://github.com/xen/fontbakery/" title="https://github.com/xen/fontbakery/">https://github.com/xen/fontbakery/</a> project to make such projects like Travis-CL :)</p>
