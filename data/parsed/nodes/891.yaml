    html: "<p>&gt;&gt;Steve, why would Charlie Croker be turning in his grave?  <br> <br>In 1969 Michael Caine starred in a stylish comic crime film called The Italian Job - the character he played was called Charlie Croker - and delivered some celebrated one-liners such as: <br>\"You're only supposed to blow the bloody doors off!\" <br>and <br>\"Yes, I used a machine gun\"  <br>(Obviously these only make any sense if you watch the movie, but maybe they'll make you curious enough to seek it out). <br>The film is also notable for its curious ending - during filming, it was decided that the original ending didn't leave enough room for a sequel, so a new ending was invented and filmed. <br>The ending was written by the producer because there wasn't enough money to pay the writer any more, and the director hated it so much he made his assistant film the closing scenes. <br>Wierdly, the ending is one of the things most people really remember about the film, and the sequel was never made anyway. <br>The trailer for the 2003 'remake' of the Italian Job promises nothing in the way of a good film in itself, let alone a suitable tribute to something that the British cinema-going public hold dear. <br> <br><a href=\"http://www.imdb.com/Title?0064505\" target=\"_blank\">The (original) Italian Job</a> <br> <br>Steve</p>"
