  html: <p>I’m in the midst of a project that requires the use of multiple web fonts and I’m growing concerned about the accumulated file size. I don’t need all the fonts at the same time (various sub sections use various fonts), but with Typekit I see no other option than loading all at once. Is there a good workaround for this?</p>
