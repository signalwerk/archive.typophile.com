      <p>I would start with <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=ITC.100315.0.3&amp;attributes.sampleSize=48&amp;sampleText=Repco&amp;sampleSize=48" target="_blank">Compacta</a>, oblique it, and add some little triangles as serifs. This would probably get you close enough for birthday joke purposes.</p>
      <p> - Lex</p>
