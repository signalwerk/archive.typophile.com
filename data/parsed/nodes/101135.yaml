      <blockquote><p>You think they're both custom jobs then?</p></blockquote>
      <p>I can't state they're both custom job. My knowledge is far from being encyclopedic or academic. I've never learned type design and its history. My suggestions are mainly based on visual memory and online resources (digital).</p>
      <blockquote><p>The second image with the upward slanting serifs has totally stumped me. Does the attached clearer image cast any light on it at all?</p></blockquote>
      <p>No, because, even if they're close, they don't look the same to me.<br>
