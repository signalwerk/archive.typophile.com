      <p>from:  <a href="http://new.myfonts.com/person/Zvi_Narkiss/" title="http://new.myfonts.com/person/Zvi_Narkiss/">http://new.myfonts.com/person/Zvi_Narkiss/</a></p>
      <p>Since 1950, freelance designer of books, posters, bank notes, postage stamps, etc. Designed 16 Hebrew typeface families, manufactured in all typesetting technologies available in Israel, including exclusive typefaces for two newly revised Bible editions.</p>
      <p>Served as academic consultant to the graphic design course of the Technion, Israel’s Institute of Technology, and as lecturer in Graphic Design and Typography. Served as member of the academic promotion committee at Bezalel, Israel’s major academy of Art and Design, and as a member of the national advisory committee to the Bank of Israel, for the design of new banknotes and coins.</p>
      <p>“The first and foremost value for Zvi Narkiss is integrity — artistic honesty in design — and he feels that here he has achieved it.” — writes Misha Beletsky in an essay about Narkiss’ work. The essay is included in the book “Language Culture Type” published 2002 by ATypI and Graphis.</p>
      <p>From: Israel<br>
      What he does: Type Design, Graphic Design, Book Design</p>
      <p>ATypI: Language, Culture, Type, edited by John D. Berry<br>
      Bank of Israel: One Hundred New Sheqalim, designed by Zvi Narkiss</p>
