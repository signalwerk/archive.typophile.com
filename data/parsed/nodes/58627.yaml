    html: |-
      <p>The autohint command-line tools will generate flex hints unless you specifically supress it with the '-nf' option. </p>
      <p>Note: it generates flex hints everywhere where they are legal. This is way too many. This does no harm, but is surprising when you look closely at the font. I will eventually fix this, but since autohint has been doing this since 1986, the priority is low.</p>
      <p>- Read</p>
