      <p>Rachel, the switch or option is entered on the command line before the arguments:</p>
      <p>autohint -nb myfont.otf</p>
      <p>I cannot make the script run without it, although it has metrics and standard stems defined. The font I am working on has no overhangs though, so ‘blue zone’ is not defined (it's zero). Perhaps that's the culprit. Anyway, the result is very good even with the -nb switch.</p>
