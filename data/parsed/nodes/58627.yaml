  - id: 350040
    user: 1844
    date: 2009-06-02T17:40:00
    date_raw: 2.Jun.2009 5.40pm
    votes: null
    html: |-
      <p>No, the default is to run the tool with no switches.</p>
      <p>The autohint tool requires the font to have stem widths and alignment zones (AKA blue values). These enable the tool to do a good "automatic hinting job". Use the font editor to set these parameters.</p>
      <p>If you try to ran a font without stem widths and alignment zones through the autohint, the tool will simply complain and quit. The -nb switch will prevent the tool from quitting, but the hinting result will obviously be not as good.</p>
