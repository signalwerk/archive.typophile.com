    <p>I am trying to use the autohint script from the Adobe FDK (OSX). It seems to work better than the FL5 built in script and I really like the checking feedback about the outlines — however, I am not a nerd anymore (too old), so here are two really dumb questions:</p>
    <p>1. I cannot find a way to enter the metrics and standard stems info into the script. Does it come from the font itself?<br>
    2. I also installed the FL5 scripts in the macros directory. Is the AutoHint.py that the same script with same functionality?</p>
