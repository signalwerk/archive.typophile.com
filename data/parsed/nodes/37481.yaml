      <p>It's not meant to make sense. It's a joke about the generic nature of Helvetica's design and ithe font's sheer ubiquity.</p>
      <p><em>You need to spend exactly the time required, nothing more, nothing less, no?</em></p>
      <p>If you don't understand what Ray means now, maybe you will one day.</p>
      <p>I just finished making an Arial clone and matching bold for a large U.K. videogames company, and I only after I had worked on it long enuff did it really look like Arial, I can tell you. Helvetica can be made with little thought or effort in about sixteen hours.</p>
      <p>Eben --- typeface design does not make sense. If you think that it does then quite possibly you are taking type design too seriously. Type design as handed down to us by the 16th century Venetians is only <em>meant</em> to make sense, but the rules and conventions are rather illogical and convoluted.</p>
      <p>j a m e s</p>
