  html: |-
    <p>It's grotesk!</p>
    <p>Five hours isn't enough time to measure anything or work out the spacing properly. I worked by eye, nothing was measured. Helvetica is pretty easy to draw. Ellipses and sticks. Make the inside ellipse very small, then once you've made a simple l and v it's over. You'll be blatting bugs before breakfast.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/bugset_3573.gif"></div><p></p>
    <p>Bug Blatter only looks good with tight spacing to match the interior spaces. I like how c and C come out. z is knackered. There's a lot of cheating going on with stroke width and counter position.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/bug1_5981.gif"></div><p></p>
    <p>Ray Larabie's type design axiom: "If you work on a font long enough it will turn into Helvetica"</p>
    <p>I'm sure somebody has already done this, going by this magazine cover:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/life_apollo_9_6586.jpg"></div><p></p>
    <p>I didn't fake that. Honestly, It's real. Can anyone identify the font used?</p>
    <p>I'm too busy with other stuff to draw any more of Bug Blatter. :^) that's good in a way.</p>
    <p>No plans to market it or proposition Linotype/Monotype about adding it to Helvetica, but what do people think?</p>
    <p>* Would you use it, and what for?<br>
    * I figure it would be okay for paperback covers, t-shirts, signage, logos and some kinds of magazine design. It would make good laser-cut perspex letters, 2 inches thick, say.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/moonsuit_5653.png"></div><p></p>
    <p>This looks much better with negative tracking:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/jpcrow_3510.jpg"></div><p></p>
    <p>All comments welcome!</p>
    <p>j a m e s</p>
