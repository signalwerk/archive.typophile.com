    html: |-
      <p>Making a superheavy Helvetica is like painting a fat Jesus.</p>
      <p>A: You're altering a revered icon<br>
      B: It's so darned cute<br>
      C: ???<br>
      D: Profit!</p>
      <p>Just like the painting mentioned in the first line, you should yank the Beziers to make it a bit more superelliptical. This will fill in the negative space in the "corners" of the round letters. It's that mega-ultra-friggin-bold paradox we discussed back in the days when I Kayoed* something. All that bold-meat has to come from somewhere. The other thing you can do is start cranking the x-height more. So, if you scale the lowercase up a smidge and reduce the weight on the stems or whatever-the-hell-else you feel like reducing, you'll have a pleasingly plump version of a famously dull Swiss font.</p>
      <p>*kayo is an extreme-mega-ultra-black where the priorities are weight gain and maintaining the silhouette of the svelties.</p>
