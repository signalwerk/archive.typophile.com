      <p>My <a class="freelinking external" href="http://justanotherfoundry.com/Facit/index.htm" rel="nofollow">Facit</a> has these:</p>
      <p>&lt;-  ←<br>
      -&gt;  →<br>
      &lt;-&gt;  ↔<br>
      &lt;_  ↑<br>
      _&gt;  ↓<br>
      &lt;_&gt;  ↕<br>
      z&gt;  ↯<br>
      :)  ☺<br>
      :(  ☹</p>
      <p>They're implemented as discretionary ligatures.</p>
