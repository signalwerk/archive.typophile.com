    html: |-
      <p>Thanks Stephen. You are so fast ... even in the middle of the night. No chance for me to announce my PDF myself ;-)<br>
      But I like to translate some of my German notes. All fonts are for Mac OS X and Windows, except Tannenberg (Windows Type 1 only). More than 95 % of the fonts carry the famous long s. The fonts seem to work well. I had a crash (Mac, InDesign CS 2, FontExpolrer X) when loading all 150 fonts and my PDF was nearly finished, but who the hell is working with 150 blackletter fonts simultaneously? Some of the fonts (10 - 15 %) are not embeddable. That makes my file huge, because I converted most of the showings to path. The PDF is 3.9 MB. Have fun ...</p>
