    <p>hermann schmidt mainz released a new book about blackletters called "fraktur mon amour" (german/english)<br>
    I recieved my copy yesterday and ist very nice. it includes 300 blackletters and a cd-rom with 130 freefonts.</p>
    <p><a href="http://www.typografie.de/verlagsverzeichnis/typografie/696-7.html" title="http://www.typografie.de/verlagsverzeichnis/typografie/696-7.html">http://www.typografie.de/verlagsverzeichnis/typografie/696-7.html</a></p>
