    html: |-
      <p>Overall, very nice. I like the bottom one. Here are a few suggestions.</p>
      <p>1-The bottom curve of the 'C' isn't as smooth as it could be. If this is drawn in Illustrator view the word in outline view and put one anchor at the top of the 'C' where you see a flat portion on the line and another one on the flat portion on the bottom of the 'C'. Remove any other anchors and pull the line out and adjust the handles to get a nice smooth shape. The curve should look smoother coming down the backside of the 'C'. Do the same for the inside.</p>
      <p>2-the line coming up from the 'C to the 'r' is nice.</p>
      <p>3- add a bit of weight to the heavy down-stroke of the 'r' to better match the weight of the other letters.</p>
      <p>4-I think the word would flow nicer if you continued the upstroke from the 'r' right into the loop of the 'f'. This might mean the loop of the 'f' will be smaller. You'll have to try it to see if you like it or if it will work at all. Also, in general, watch your weights of the joining lines, they should all be the same weight.</p>
      <p>5-the down-stroke of the 'f ' is nice. The loop at the bottom going into the 't' could be a bit smoother. It seems to take an awkward turn coming out of the 'f'. </p>
      <p>6-the 't' looks good. Maybe shorten the right side of the crossbar of the 't' so it isn't coming so close to the 'y'.</p>
      <p>7-make the joining line from the 't' to the 'y' enter the 'y' a bit smoother rather than sticking into the 'y'</p>
      <p>8-the bottom loop on the 'y' is nice but maybe close the loop up a bit so the exit on the right side is nicer.</p>
      <p>Hope this helps and I hope my suggestions makes sense. Nice work!</p>
