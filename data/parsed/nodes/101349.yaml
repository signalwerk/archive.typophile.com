    <p>My venture TypographyShop is reprinting our <a class="freelinking external" href="http://bit.ly/pW4mgu" rel="nofollow">"Letterpress"</a>  tee, which has been a minor hit in the lead community. The current design is on the woman in the image below.</p>
    <p>A purist pointed out however, that the copy block should be upside down, as it's done when type is hand set. Do you feel we should offer that as an option as in the mock up on the male below? </p>
    <p>Thanks in advance for your opinions.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/letterpress-upside-down-alt_4885.jpg"></div><p></p>
