    html: <p>We do have a quota to meet at the Nikko. Guaranteeing hotel rooms (lots of them) + the catering for attendees at the hotel (not cheap) + the support of our generous sponsors (they are the best) + donations of time and services by our incredible speakers and volunteers (they rock the hardest) + the NEA grant for special projects (they dig type, too!) = low conference registration and workshop fees + peace, love, and happiness. <br> <br>We strive to offer TypeCon attendees an affordable, high-quality hotel in a safe and cool location each year. This is a tall order, considering the huge amount of meeting space we need for TypeCon and the low cost of the conference. <br> <br>By staying at the Nikko, you are supporting SOTA and TypeCon and helping to keep the conference affordable. And you can be sure that we have checked out the hotel thoroughly, and that it's a good place! And if someone can't swing the Nikko solo, we help with finding roommates. <br> <br>Plus, if you stay at the conference hotel, you get to take the SOTA shuttle to the workshops and Alphabet Farm instead of finding your own way. Not to mention easier access to the muffins in the morning if all you have to do is take the elevator downstairs...</p>
