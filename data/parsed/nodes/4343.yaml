  - id: 32160
    user: 1133
    date: 2004-07-17T15:43:00
    date_raw: 17 Jul 2004 — 3:43pm
    votes: null
    html: "<p>[ Hrant,  <br> <br>I don't think Tom ever blamed the Saudis for something. ] <br> <br>Other than that, I must say that a few months ago, in Poland, we had a discussion along the lines: how come that Poland is supporting the U.S. war in Iraq and the Americans still require visas for Polish citizens? I found and still find this sort of argumentation ridiculous (bringing it down to a \"deal\"), but that was reality in our Polish media.  <br> <br>I also actually do realize and acknowledge that a country such as the U.S. may want to set up any sorts of rules, including taking people's fingerprints and requiring every applicant to apply for a visa in person.  <br> <br>However, what I don't understand and what annoys me is that if one blows up bureaucratic procedures to the extent as it is now with the U.S. visas, one should create bureaucratic capacities to accomodate for the procedures.  <br> <br>Just like 4 years ago, German citizens going for a trip longer than 3 months, students, workers and non-old-E.U. foreigners are required to apply for a visa. However, 4 years ago, only very few people were asked for a personal interview and most visas were issued per post. A year ago, a large number of the applicants were required to appear in person, but people who already had previous visas that recently expired, and a large number of other cases were still allowed to apply per post. Now, everybody is required to appear for a personal interview.  <br> <br>However, the capacity of the U.S. embassy in Berlin remains the same. Therefore, everything takes much more time now than it used to before. There is no option for expedited processing (even with an additional fee), there is no \"backup\" option or a hotline for special cases.  <br> <br>With the effective necessity of making an appointment 6 weeks in advance (July 12--August 26, that's really 6 weeks!), plus some more advance for the case something goes wrong, and some additional advance for the actual visa application processing (they say 10 working days), you end up having to plan every trip 3 months in advance. This effectively eliminates a large number of business travels or spontaneous touristic trips.  <br> <br>While I have to apply for a visa since I'm Polish, note that even \"old E.U.\" citizens aren't quite safe. They don't need a visa upfront, but in the past few months the German news reported of several cases when business people, classical orchestra musicians and even some known German actors were refused entry to the U.S. _at the destination airport_. This means that they after the long and exhausting flight from Europe to the U.S. they had to buy an immediate return ticket and take the next available machine to fly back to Europe. I think I don't need to say more.  <br> <br>Germany is known for their bureaucracy. This is true -- there's a lot of it where I live now. But these guys here at least know how to run a bureaucratic machine...  <br> <br>Oh, no need to mention that the U.S. embassy intends to keep my visa application fee of 86 EUR (roughly $100) that I had to pay upfront, despite the fact that my application wasn't actually even received. A yet another way to fund government spending. ;)  <br> <br>Best,  <br>Adam <br></p>"
