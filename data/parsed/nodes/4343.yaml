    html: <p>It is incredibly disappointing what has happened to Adam. He's a very important part of the community, and we will all miss him at TypeCon. Many of us faxed urgent letters to the US consulate in Berlin in an attempt to plead Adam's case, but to no avail. The consulate faxed a letter back to me stating sternly that they could not discuss anyone's application. I hadn't asked for information from them, just offered support for Adam's request for the appointment that he was already entitled to but for some technical screwup. <br> <br>They also said they are terribly busy with vacation visa requests and all that. Naturally, a speaker traveling to an international conference funded in part by a US government arts agency doesn't take priority over someone's summer holiday! <br> <br>On the other hand, several speakers from Brazil and other countries outside the US received visas within a few days of receiving our letters of invitation. Why does it have to be so hard for our friends in other nations??? <br> <br>TypeCon attendees are predominantly North American because of geography and economics. But our conference is quite inexpensive, and with the weak dollar lately, it is certainly more affordable to travel here from Europe, SA, etc. <br> <br>More international attendees come each year, and we certainly hope to continue that growth. We will continue to do all we can to bring more people from outside the US. I hope that things with our govmt and especially state dept will get better in the future, so we don't have disasters like Adam has experienced. <br> <br>As for the market at the 'con, yes, most of the sellers will take credit cards, and they are again a friendly bunch. Lots of type and design books (new and antique), movie marquee letters, typewriter key jewelry, psychedelic posters... and for those of you wondering, Jan Middendorp has brought quite a few copies of his fabulolus "Dutch Type," which has sold out of many bookstores in the US.</p>
