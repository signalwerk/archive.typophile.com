    html: "<p>As a result of the \"Homeland Security\" program, all foreigners from outside of the \"old E.U.\" countries must apply for a visitor's visa when coming to the U.S. Since I'm Polish living in Germany, I must apply for the visa at the U.S. embassy in Berlin. In order to get a visa, each applicant is supposed to call a contract call center (1.86 EUR/minute!) to make an appointment at the embassy. Every applicant needs to apear in person for an interview, so the appointment is necessary.  <br> <br>Due to high workload, the call center tells you to make the appointment way in advance, so about four weeks ago, I made an appointment for the next possible time -- which turned out to be last Monday. Last Monday at 9:30 A.M., I appeared in front of the embassy in Berlin but to my great surprise I learned that \"I wasn't on the list.\" The security guards asked me out (politely) and told me to... call the call center. The friendly operator at the call center told me that \"my appointment wasn't in the computer\", and that he could not help me. There was no way to speak to a visa officer, superior or whoever else, except from the call center guy (who just operates the system and takes the appointments) and the security guard (who didn't know anything except that I wasn't on the list).  <br> <br>So, the call center guy suggested that I could make another appointment. The next available appointment was... August 26th! Yes, but that's a month _after_ TypeCon, I told him. Well, \"Sorry, I can't help you.\" \"Is there anybody else I can call?\" \"Sorry.\" \"And you don't know why my appointment isn't in your computer.\" \"No, sorry.\"  <br> <br>He actually sounded like he was sorry, I talked to him for some 15 or 20 minutes altogether. At 1.86 EUR/minute.  <br> <br>After having heard that my next appointment was to be August 26th, I decided to make some noise. I sent a couple of faxes to the U.S. embassy fax number (normally reserved as \"American Citizes Services\" only). I described the entire situation, pointed out that there must have been a mistake, that I'm a speaker at the conference etc. etc. In addition, a few good people, including SoTA Executive Director Tamye Riggs, SoTA Chairman Richard Kegler, my colleague Ted Harrison from Fontlab Ltd., and quite a few other friends from font companies (big and small) have sent supportive faxes to the embassy, pointing out how \"important\" I was to have at the conference etc. Thank you guys for that support!!!  <br> <br>After the overwhelming number of faxes, the U.S. embassy in Berlin apparently felt obliged to contact me per e-mail and give me a reply. So on Wednesday, I got this warm and friendly reply:  <br> <br>\"Dear Mr. Twardoch:  <br>Thank you for your faxes.  Due to the summer travel season, our visa waiting room is currently booked through mid-August at the maximum capacity allowed by our Embassy security officer.  There are no earlier appointments available at this time.  Please call our contract call center at 0190-85-00-55 and book the next available appointment. <br>Sincerely,  <br>Visa Unit\"  <br> <br>That's very sincere indeed.  <br> <br>For those interested: I could have theoretically made the appointment three months ago or so, not 4 weeks ago. This way, I would probably have gotten a second chance for an appointment before TypeCon. Unfortunately, my old passport just expired. I had applied for a new passport already last year (2003) but did not receive it until two weeks ago. In Poland, we now have to wait 6 months or so for the new passport being printed. We have a new passport design and now, everything, including your photo and name etc. is being offset-printed with some fancy hi-tech ink, in Warsaw. So your entire passport actually is being \"manufactured\" for you. A fascinating process for print lovers, no doubt, but not really as fascinating when you have to wait for a half a year to get the thing. When you apply for a U.S. visa, your passport must be valid for another 6 months, so I had to wait for my new passport and only could apply after I got it. Also after I got my passport, I had to get my German residence permit renewed at the appropriate German office. So altogether, last Monday was actually as early as I could get, and since it didn't work out for some mysterious reason, I didn't get my second chance except August 26th. Great.  <br> <br>This taught me a few things: (1) I should apply for a new passport at least a year before my current passport's expiration date. (2) I should apply for a U.S. visa three months before planning to go there. (3) With the current U.S. visa policy, TypeCon conferences won't be able to attract many international visitors if the conferences are be held in the U.S. (4) I actually learned a few more things but I won't announce them publicly ;)  <br> <br>I really wish I were allowed to go to TypeCon. I had made all travel arrangements etc. Fortunately, I was able to cancel my flight with a penalty that wasn't excessive. But that's not so important.  <br> <br>I really wanted to go to TypeCon because I think it will be a great conference. I was truly looking forward to it, and I really envy those of you who will be there. I wish you a lot of fun. Make sure that you enjoy that conference, especially that you _are_ able to participate!  <br> <br>For all those who signed up for the FontLab workshop: Ted Harrison will be at TypeCon, and we are working on a solution that will enable me to join you over the Net.  <br> <br>Best greetings,  <br>Adam  <br></p>"
