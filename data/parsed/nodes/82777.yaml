  html: |-
    <p>Once again, the <a class="freelinking external" href="http://www.typesociety.org/" rel="nofollow">Society of Typographic Aficionados</a> will be holding a silent auction during TypeCon to raise funds for their educational activities. If you have any typographic trinkets, knickknacks, bibelots, ornaments, baubles, objet d’art, collector’s items, rarities, curiosities, oddities, kickshaws, or tchotchkes that you’re willing to part with … donate them to this year’s silent auction. Share your exceptional taste with other type fiends, clear space on your shelves so you can buy new collectable, and above all … help support a great cause.</p>
    <p>Since SOTA is a 501(c)(3) non-profit organization, your donations are tax-deductible, as well.</p>
    <p>Please email <a class="freelinking external" href="mailto:auction@typesociety.org?subject=My%20Typographic%20Treasure" rel="nofollow">auction@typesociety.org</a> with the following info:</p>
    <ol>
    <li>Item name and description</li>
    <li>Writer/publisher/designer/etc.</li>
    <li>Estimated value</li>
    <li>An exciting blurb or personal anecdote about the item</li>
    <li>Photo (optional)</li>
    </ol>
    <p>If you are attending TypeCon, you may bring your donation with you and drop it off at the registration table at the hotel. If you won’t be attending TypeCon, but would like to donate items, please <a class="freelinking external" href="mailto:auction@typesociety.org?subject=SOTA%20Silent%20Auction%20Question" rel="nofollow">send us an email</a> to receive the official scoop on shipping and such.</p>
    <p>Thank you in advance for your support!</p>
