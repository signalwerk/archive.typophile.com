    html: <p>If your chosing Tokoyo and your trying to get across the feel of a city then I would check out the japanese language, look at anime styles, the culture, food - everything and then take the elements you think are most important.  <br>Respect and money are considered very important so choosing a font that  represents that is paramount to getting across the right idea, instead of relying on imagery (you did say you have to use the least amount) have you not thought about creating imagery from the body of text you have to create?  <br> <br>To be honest you have to go away and sit down and really flesh out all of your ideas, little or big what ever, consider medium, what you want to communicate and how you expect to arrive at your outcome.</p>
    html_clean: <p>If your chosing Tokoyo and your trying to get across the feel of a city then I would check out the japanese language, look at anime styles, the culture, food - everything and then take the elements you think are most important.  <br>Respect and money are considered very important so choosing a font that  represents that is paramount to getting across the right idea, instead of relying on imagery (you did say you have to use the least amount) have you not thought about creating imagery from the body of text you have to create?  <br> <br>To be honest you have to go away and sit down and really flesh out all of your ideas, little or big what ever, consider medium, what you want to communicate and how you expect to arrive at your outcome.</p>
