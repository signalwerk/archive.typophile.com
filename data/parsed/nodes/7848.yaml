    html: <p>Ok basically here is an outline of the brief... <br> <br>Its called cityscape <br> <br>Basically using more typographical methods, i have to bestly show a city of my choice through typography. <br> <br>An exmaple of someones work was they choice i think it was venice and they have illustations of buildings very classy in a landscape format and for the water that flows through venice (i think it is there), they used words 500minimum and blended them into there own cityscape. <br> <br>I am trying to explain best i possibly can. The image can be anything i choose but it has to convey 'the city' to a viewer, having typography as the main medium. <br> <br>So far for ideas i am struggling alot, however i have come up with designers republic style images that have type flowing into them, yet this is more 'design' than 'idea'</p>
