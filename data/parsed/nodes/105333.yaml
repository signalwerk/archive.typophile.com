    html: <p>I think another pair of interesting avenues are the existence of scripts and typography in invented cultures as well, like Klingon, hobbit, and etc. quite a bit, and then the cultures where we have little or nothing left of their cultures except their scripts in composition, like Mayan, Hittite, Harappan, or my favorite, Voynichian.</p>
