    html: |-
      <p>I’d suggest that you first look for a proper definition of typography.<br>
      When typography is writing with predefined / prefabricated letters* and take the definition of culture as suggested before, then the following questions may come in mind:</p>
      <p>1. How does culture interact with creating typefaces?<br>
      2. How does culture interact with the relationship between script and typefaces?<br>
      3. How does culture interact with script?<br>
      4. How does culture interact with the way typefaces are used (typography)?<br>
      Also, you’d probably have to think about which cultures / scripts you want to include in your paper and in how far historic / technical developments should play a role.</p>
      <p>All very interesting, but maybe you’ll have to focus a bit and tell us what you came up with. When you are looking for a debate on how to define topography, you might find something here: <a href="http://typophile.com/node/2812" title="http://typophile.com/node/2812">http://typophile.com/node/2812</a></p>
      <p>*definition by Gerrit Noordzij</p>
