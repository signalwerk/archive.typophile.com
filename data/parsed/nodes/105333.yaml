      <p>Sonica: ‘<em>How typography and culture are related? do cultural inﬂuence typography?</em>’</p>
      <p>For the completeness of your paper it might be important to come up with a proper definition of typography, as Albert Jan suggests. Noordzij’s one is often referred to nowadays, especially by his former students, and it was preceded by similar ones by for instance the Frenchman Loys Le Roi, who deﬁned typography in the oldest known (very concise) publication on printing (type), which dates from 1576 (in 1594 it was published in London in an English translation): ‘<em>[…] the manner to write by imprinting […]</em>’, and by Walter J. Ong, who stated in ‘Comment: Voice, Print, and Culture’, <em>Visible Language</em>, Volume IV, Number 1, (1970) pp.77–83 (p.80): ‘<em>Alphabetic type commits the word to space even more than writing does. Writing makes words by creating marks on surfaces. Alphabetic prints makes words out of pre-existing things–types, which are stored around like nails or bricks in boxes–and made up into forms as bricks are made into houses.</em>’</p>
      <p>In his <em>Manuel Typographique</em> the eighteenth-century punchcutter and theoretician Pierre Simon Fournier placed typography in a wider context by stating that it consists of ‘<em>[…] three parts, each distinct and indispensable, namely, punchcutting, founding and printing. The practice of the different branches produces artists of three different kind, the ﬁrst the punchcutters, the second founders, and the third printers, but only who combines a knowledge of all three branches is ﬁt to be styled a typographer</em>’. </p>
      <p>Based on my <a href="http://lettermodel.org" rel="nofollow">research</a> personally I would describe typography as <em>grid ﬁtting of formalized letters</em>; the grid being deﬁned by the natural rhythm of the applied type.</p>
      <p>However, for answering your question I think basically it’s enough that we agree on talking about the same thing, and as such the term ‘typography’ is sufﬁcient for me. I concur with Johan that typography and culture are inextricably connected with each other, and subsequently interact. </p>
      <p>For my talk at Leiden University on the progress of my research in 2009, I invited Ji Youn Kang, a graduated master student from the Royal Conservatoire in The Hague for a talk on the differences between Western and Korean traditional music. She explained (beautifully sung) the actual lack in Korean traditional music of what is considered to be harmony in Western music. Subsequently I made a comparison of what is considered harmony in Hangul and formal representations of the Latin script. Some brief related info can be found <a href="http://www.lettermodel.org/wordpress/?p=796" rel="nofollow">here</a>. </p>
      <p>For me the current Vietnamese writing system is a nice example of the fact that scripts can be simply replaced by ones from a different culture if required or demanded. A French decree was enough in this case. And the younger (South) Koreans are so much inﬂuenced by the Western music culture that they don’t understand anymore the traditional Korean music.</p>
      <p>FEB</p>
