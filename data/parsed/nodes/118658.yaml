    <p>Hi, I am new to making fonts and would like some help to a few questions I have. Helping me clearing these up would be much appreciated. :)</p>
    <p>The image below show what is supposed to be a sci-fi all caps font.<br>
    <img src="http://i57.tinypic.com/2zny90m.png"></p>
    <p>1) How do I set the EM/point size for the entire font? </p>
    <p>I worry that by making one glyph taller or lower than the others, that it will override any default or even preset value. I am concerned that if I can't keep the point size consistent, that the edges then will become fuzzy on accident as the plines are shifted.</p>
    <p>2) How can I make sure that the glyphs end up looking the best at they possibly can, without them looking inconsistent?</p>
    <p>For example, with left side looking fuzzy on an all caps "i" character, but with right side looking sharp?</p>
    <p>3) What are the basic requirement for finishing a font with FontForge, if only having completed drawing up all the glyphs?</p>
    <p>I worry that by omitting something in the settings I accidentally have the font look bad, or even cause issues with usability.<br>
    For example, if typing text with my font in an image editor, when typing non-caps, the image editor switches fonts. Therefore I put some x glyph into those lower case letters in FontForge, to avoid having my image editing software switch fonts as I accidentally type stuff in non caps.</p>
