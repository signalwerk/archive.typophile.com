      <p>Well, hm, I am stumped and I need some help. </p>
      <p>Apparently, my font does not have any issues with there lacking a point at 'extrema', however I can't get hinting to work.</p>
      <p>The basic concept of 'hinting' is fairly clear to me, and after looking at wikipedia's webpage for hinting, it is clear to me that I want the same effect as seen in the image on the upper right side in that article:<br>
      <a href="https://en.wikipedia.org/wiki/Font_hinting" title="https://en.wikipedia.org/wiki/Font_hinting">https://en.wikipedia.org/wiki/Font_hinting</a></p>
      <p>In FontForge however, I am unable to intuitively get an idea of how the hinting tools are suppsosed to work and I have not seen anything on the internet that explain it. </p>
      <p>Despite fiddling with the hinting options and viewing the font anew in an image editing software, I see no change at all. Apparently I must be doing something wrong, but I have no idea what.</p>
      <p>I really would want this to work, otherwise I would be left to correcting a font to look crisp, for every font size I want to use later on, using 'grid fit'. I could deal with maybe two files, but if I wanted a 100 px or 110 px sized font, then I would have to go back and create a new set of the font, which I'd rather avoid.</p>
      <p>Edit: Btw, this is the documentation for hinting, in case anyone wanted to have a look: <a href="http://fontforge.org/hinting.html" title="http://fontforge.org/hinting.html">http://fontforge.org/hinting.html</a></p>
      <p>* Goes to check to see if the image editing software has an issue with font hinting.</p>
