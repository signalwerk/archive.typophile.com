      <p>You don’t have to make the font with a 4096 UPM size. It’s really a bas idea as some software could have problem. Most of fonts are at 1000 pt in UPM size. It doesn’t affect how crisp is your typeface, all is in vector anyway.<br>
      For your question 2, the crispiness of the font depends on how you drew glyphs. It will be needed that you don’t have more points than needed and that you have point at extrema. The way the font look on screen at a size could be tweak adding hints to the font (it’s called hinting) to make sure the vector drawing translate well at a specific size on a pixel grid (the screen). But it’s a really time consuming task as it is needed for each size and it’s only used on Windows as Mac and Linux just don’t bother with hints and use other methods to render type. You won’t have to do that for your font.<br>
      You should look at the book <a href="http://designwithfontforge.com" rel="nofollow">designwithfontforge.com</a> and for question 3 look at the <a href="http://designwithfontforge.com/en-US/Making_Sure_Your_Font_Works_Validation.html" rel="nofollow">Making_Sure_Your_Font_Works page</a>.</p>
