    html: |-
      <blockquote><p>1) How do I set the EM/point size for the entire font?</p></blockquote>
      <p>You don't set the point size, nor the em size while developing a font: the DTP software that uses the font. You set the UPM grid and that's all. Have a look here: <a href="http://learn.scannerlicker.net/2014/07/31/so-how-much-is-an-em/" title="http://learn.scannerlicker.net/2014/07/31/so-how-much-is-an-em/">http://learn.scannerlicker.net/2014/07/31/so-how-much-is-an-em/</a></p>
      <blockquote><p>2) How can I make sure that the glyphs end up looking the best at they possibly can, without them looking inconsistent?</p></blockquote>
      <p>The problem you just posed is a rasterization/hinting problem. For rasterization problems, read this: <a href="http://learn.scannerlicker.net/2014/04/16/bezier-curves-and-type-design-a-tutorial/" title="http://learn.scannerlicker.net/2014/04/16/bezier-curves-and-type-design-a-tutorial/">http://learn.scannerlicker.net/2014/04/16/bezier-curves-and-type-design-...</a></p>
      <p>For hinting problems, you have things like the ADFKO autohint tool (<a href="http://www.adobe.com/devnet/opentype/afdko.html" title="http://www.adobe.com/devnet/opentype/afdko.html">http://www.adobe.com/devnet/opentype/afdko.html</a>), or you can learn manual hinting.</p>
      <blockquote><p>3) What are the basic requirement for finishing a font with FontForge, if only having completed drawing up all the glyphs?</p></blockquote>
      <p>Dinobib got it right with the validation. I'd suggesting staring a lot, proofing a lot.</p>
      <blockquote><p>4) Would the font end up looking more crisp if I made the EM/pointsize large?</p></blockquote>
      <p>No.</p>
      <p>You seem to have some design problems with the font, also, like horizontal and vertical lines being the same width, weird curve joints (like B and 8) that can make these to indistinguishable.</p>
      <p>Hope I helped!</p>
