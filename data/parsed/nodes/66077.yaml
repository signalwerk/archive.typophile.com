    <p>Someone sent me the piece she had designed in Word, which you see reproduced below (smaller than the original 8.5 X 11). She asked me for a better photo. I said: I think I better do the whole thing. She quickly agreed to that.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/cl-obit-original_5733.jpg"></div><p></p>
    <p>It's all in Arial except for the odd brush-like title font. </p>
    <p>Here is my redesigned piece:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/cl-memorial-6i_5076.jpg"></div><p></p>
    <p>The display font is "Serena," which I bought a while ago, but never had the occasion to use. It seems to work. What do you think? </p>
    <p>I decided on colors to harmonize with the photo: green and brown. </p>
    <p>I struggled with the text font. It has to display well both onscreen and print, cause this is being sent out as an e-invitation to the wake/memorial.</p>
    <p>Of the sans text fonts, none had the dignified, elegant look I wanted, even Optima.</p>
    <p>Of the serif text fonts, of course I wanted something more elegant than Times or Georgia. I tried ACaslon, AGaramond, AJenson - none looked very clear onscreen. The slab serif fonts were more clear, but did not harmonize with Serena at all. I ended up using Warnock Pro. This comes with Adobe products, but I've never used it before. To my surprise it was clear onscreen (at full doc size), maybe because of the strong wedge-like serifs. </p>
    <p>I revised the copy as well.</p>
    <p>Feedback please?</p>
