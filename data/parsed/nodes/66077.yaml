      <p>James, that is beautiful and classic, especially for something to appear in a publication, but it looks...hm, overly formal for someone like Cherisse.</p>
      <p>Her best friend came over and looked at the two designs I printed, the one with Serena and the traditional one with Caslon [revised as Tomi suggested], and said "They're both lovely, but Cherisse would like this one [the first]." It's very subjective, isn't it?</p>
      <p>It's to be viewed onscreen by her hundreds of friends and acquaintances, not printed in a newspaper, so I think it'll be fine that it's not so traditional. </p>
      <p>I did use suggestions from you all for improving the spacing though, and it does look better proportioned.</p>
