  html: |-
    <p>I've been wondering lately about whether its ok to use capitalization on a typeface that is all caps already (i.e. Copperplate Gothic) I was pretty sure that it was something not to do but I see it everywhere (including the business I'm designing for) and it's making me think, is everyone setting it incorrectly?</p>
    <p>I prefer to not but I would like to back my decision with facts. Most of these all cap typefaces have an upper and lowercase but the strokes look thicker making me think it's incorrect. </p>
    <p>Is this just a preference or is there a typographic rule?</p>
    <p>- Matt</p>
