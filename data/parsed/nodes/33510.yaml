      <p>[quote]This is custom lettering, not type.[/quote]<br>
      I beg to differ, it may be a modified version of the fonts<br>
      identified but it was still a font before being LASER CARVED into<br>
      the stone. I have tocuhed the sign, myself, and it was not hand<br>
      carved, hence it had to be done by a computer, and thus digital fonts HAD to be used.</p>
      <p>This is closed because I used Californian as it was extremely close, so, close that you can’t tell unless it’s blown up so large...<br>
      I redid the logo in Illustrator and it looks great.</p>
