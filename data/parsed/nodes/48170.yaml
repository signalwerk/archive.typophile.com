    html: "<p>Thanks for the great link! The article helped somewhat, but I think <em>Basic Character Spacing in Type Design</em> by Mark Jamra is what got it for me: \"The spaces between the letters should have the same optical volume as the spaces within them.\" I've been looking too closely at spatial relationships within letters that I've overlooked the relationship between letters. It's a simple quote that made me go \"duh!\" but thank you for your help :)</p>"
