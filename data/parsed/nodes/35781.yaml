      <p>The e above vowels is the regular design of an Umlaut in blackletter. It doesn't just look like an e, it is an e that moved from behind the vowel on top of it. »Boese« became »Böse«. Two strokes or dots above the vowel are younger shapes that replaced the e over time.</p>
      <p>But unfortunately digitized blackletter typefaces often don't use the original shape. Try Alte Schwabacher or Breitkopf-Fraktur.</p>
      <p>Ralf</p>
