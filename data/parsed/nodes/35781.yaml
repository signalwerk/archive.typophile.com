    <p>I just posted this in 'Blackletter', but maybe someone in 'Type-ID' knows more about this... I'm not sure ...</p>
    <p>Via Google books I saw a book, printed in some kind of Blackletter (Ueber Deutsche Runen, Wilhelm Carl Grimm, Göttingen, 1821). The shape of the umlaut caught my eye, but I paid no further attention. Today I visited someone who had a piece of furniture with type on it. This cupboard is made in 1855 and the type used seemed familiar. Indeed, it featured the same kind of e-shaped umlaut on top of the 'a'.<br>
    What font is it?<br>
    Arjen<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/umlaut-e_4533.jpg"></div><p></p>
