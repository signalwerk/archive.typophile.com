    <p>Hi Folks,</p>
    <p>This was from an ID question I was stumped on. The typeface is a serif that reminds me of ITC Usherwood, but is different in a number of ways. It resembles some of Les Usherwood's other fonts too, but it isn't anything I think I have seen before. It is used for navigation and titling on the site for <a href="http://www.15cpw.com/">15 Central Park West</a>. It shows up on the covers of their Brochures, and inside some of them as well. It was from a brochure that I took the attached screenshot. </p>
    <p>Anyone recognize it?</p>
    <p>Thanks,<br>
    - Mike<img src="/sites/default/files/old-images/Park15CPW_3933.gif"></p>
  html_clean: |-
