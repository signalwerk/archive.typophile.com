    html: |-
      <p>This font is starting to keep me awake. (It's not even 4 AM here.) The small full serif on the A seems like one of the most distinctive, and nagging, features of this font. It resembles old 19th century typefaces, but I've been through all of Jaspert's book, and McGrew's, and the Rookledge Typefinder. I even looked through all Goudy's works. The only thing remotely close to the A is Administer/Minister, and that's about the only part that resembles this sample.</p>
      <p>The only thing that I can find about 'Opera' on the web is that it's a Norwegian Browser that Microsoft was trying to buy.</p>
      <p>I'm going to try to go back to sleep. I hope someone can ID this thing, because I can't believe this Real Estate developer would have a custom font designed.</p>
      <p>- Mike Yanega</p>
