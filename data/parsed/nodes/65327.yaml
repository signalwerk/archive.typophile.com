    <p>hi all,</p>
    <p>I wanted share with you a project I've put quite a bit of effort into, especially lately. I've got my furniture design studio, The Office for Lost Objects™, featured on Kickstarter.com, a crowdfunding site for creatives.</p>
    <p>As part of the Kickstarter initiative, I commissioned some artwork which resulted in a limited edition series of four posters. They're archival quality Giclee prints (20"x30") on heavyweight 100% cotton Somerset Velvet (images below). They're available now, along with a few other items, only through Kickstarter.</p>
    <p><a class="freelinking external" href="http://tiny.cc/olo">The Office for Lost Ojbects™ x Kickstarter</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/OLO_Candy_01_TP_6628.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/OLO_Candy_02_TP_6487.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/OLO_Candy_03_TP_4285.jpg"></div><p></p>
    <p>I hope you will take a look, and consider supporting me. </p>
    <p>thanks!<br>
    Jarrod</p>
