      <p>Hi Nick</p>
      <p>I see you're in the UK. Places to look for old back issues of Typographica would be the archives of <a href="http://www.reading.ac.uk/typography/" rel="nofollow">The Department of Typography &amp; Graphic Communication</a> and of course, <a href="http://stbride.org/" rel="nofollow">St. Bride Library</a>. Both in London rather than Manchester.</p>
