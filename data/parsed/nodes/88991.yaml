      <p>Hey cheers for replying.</p>
      <p>It's basically a visual essay by Robert Brownjohn using photographs of found type e.g signs, lettering etc.</p>
      <p>It was published in Issue 4 of Typographica (new series):</p>
      <p>Typographica 4, 1961 (78 pages). Contents: Mile-a-minute typography?; Road signs in Holland; Street level (by Robert Brownjohn; The Civic Trust and lettering: a visit to Epping.</p>
      <p>I found one small image, but was looking for the article in full.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/typographica-spread-5_6696.jpg"></div><p></p>
      <p>Any help would be greatly appreciated!</p>
      <p>Nick</p>
