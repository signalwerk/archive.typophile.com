      <p>I think a big part of the problem is that you (plural) haven't made something like Modena from scratch. When you do, and you realize the <em>ridiculous</em> amount of time -both acquiring the skill and then actually making the thing- required, you would take to heart that virtually nobody can come out of thin air, make something like Cuprum, and then give it away. So you would become more attuned to plagiarism, and not recommend such fonts.</p>
      <p>My impression is that you (plural) simply enjoy IDing fonts, and you don't want to let anything impede your pleasure. Not even the health of the people and the place that make your IDing possible. As Dick's own profile says: "There is a very blurred line between hobby and mental illness."</p>
