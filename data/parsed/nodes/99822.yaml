      <p>I support all the points that Hrant made above, besides the fact that it was done from the outlines, which in any case is immaterial to the issue. I have my own moral code, I cannot expect others to live by it. </p>
      <p>In 1991 I released Democratica, which was a cut and paste design, and never felt comfortable about that.<br>
      So when, in 1992 I had thought that it would be a good idea to extend the character set, add more weights and gently update DIN-Mittelschrift and make good money, I couldn't 'lower' myself to do it - I didn't want to rip off the original designer. It hasn't stopped others, and I accept that it is OK for them. </p>
      <p>I have since based work on the outlines of other designers, time saving was necessary for the client and it was done under license.</p>
