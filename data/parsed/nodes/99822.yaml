    user_id: 1250
    user_name: hrant
    user_path: null
    user_image: /files/pictures/picture-1250.gif
    date_raw: 19 Jan 2013 — 10:13am
    date: 2013-01-19T10:13:00
    votes: null
    html: |-
      <p>Here's the genesis of the "once" above:<br>
      - I found the numbers for scaling the "n" from Cuprum to the proportions of the "n" from Modena* by using the bounding rectangle (minus the top overshoot). For the benefit of anybody who hasn't used a font editor much: the horizontal scaling can be achieved with a quick global scaling; the vertical is even easier, requiring only a shift in the proportions of the Em.<br>
      - I used the <em>same numbers</em> to scale all four glyphs.<br>
      - I then placed each Cuprum glyph on top of the corresponding one from Modena, applying a transparency.</p>
      <p>* From the PDF here: <a href="http://typophile.com/node/45498" title="http://typophile.com/node/45498">http://typophile.com/node/45498</a></p>
      <p>There really is <em>way</em> too much similarity.</p>
      <p>Also, I would ask where the date of 2006 came from if Modena is from 2008 - and BTW the Dafont release date is towards the end of 2008...</p>
      <p>So the most probable scenario is that you did do a good deal of work yourself, but you also did start from Modena's outlines*. Maybe to some people, like Jan (and possibly even Miles!) this moves far enough away from plagiarism and close enough to "inspiration" that it's OK. But when you factor in the effort and expertise required to get to Modena <em>first,</em> to me that's a convenient escapism.</p>
      <p>* Which you might have gotten not from the font but from a PDF... like the one on Typophile!</p>
      <p>Also, frankly it really doesn't matter if you directly used the outlines from Modena. Even if you trace a scan/printout, <em>even if you just look at it and try to make a <strong>direct variant</strong>*,</em> that's still closer to plagiarism than inspiration in my book. And I think most designers of <em>original</em> fonts -the stuff that promotes cultural progress as opposed to merely making/saving money- agree with that stance.</p>
      <p>* BTW that's how I made my first outline font, Tasagan (although that was actually in a pretty generic classical Armenian genre). But at least now I admit it, and no longer distribute it.</p>
      <p>But most of all, like I said, I'm concerned with the bigger picture (not merely Cuprum) and the deplorable total lack of <em>any</em> desire to protect the very things that give so much pleasure to the type ID crowd.</p>
      <p>hhp</p>
