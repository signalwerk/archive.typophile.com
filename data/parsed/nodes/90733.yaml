    <p>I've fallen in love with Excellent from Lineto but I'd like to use it for a website project as well as print. Can anyone suggest something that looks similar, that I could use as a webfont?</p>
    <p>There's something about it which is in equal parts typewriter, console, but still looks modern and clear.</p>
