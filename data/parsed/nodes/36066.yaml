    <p>Hi all,</p>
    <p>I've looked through the FL manual but can't find anything mentioning a autotrace feature, but I was sure that FL had one, am I wrong</p>
    <p>I bought a copy of FL's Scan font but I've never been able to get it work. I click the ScanFont icon then click the install button and then accept the license agreement, but then I always get an error window saying - "Installation interrupted - can't create destination folders' tree". I tried contacting FL about this matter but never got a proper response. I'm using a Mac OSX 10.3.9.</p>
    <p>If anyone could help with the Scan font problem then I wouldn't need a autotrace in FL and that would be great.</p>
    <p>Rr.</p>
