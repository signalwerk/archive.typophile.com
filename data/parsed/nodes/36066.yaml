    html: |-
      <p>You may find BitFonter 3 (which is a sort of ScanFont on steroids) giving the best results when it comes to autotracing. I agree that the tracing in FontLab Studio may be suboptimal. One trick is to convert your image to black-and-white and try different pixel sizes. In FontLab Studio, more does not always mean better. The autotracing of an image that is 800 pixels high may give you better results than of one that is 3000 pixels high. </p>
      <p>Adam</p>
