    html: |-
      <p>I'm using FontLab 5.0.4 on XP. I got it to work by pasting an image from Photoshop directly into FontLab Studio. It showed up as a gray background image. Then I used Tools &gt; Background &gt; Trace. The results were less than spectacular.</p>
      <p>Under Tools &gt; Options &gt; Trace Options I made some adjustments and got much better results as far as following the contour. Unfortunately, there were way too many points, and the cleanup was too time consuming.</p>
      <p>I didn't spend much time on it, so there is probably a way to tweak it to get even better results, but drawing it manually seems like the best way to ensure a quality result.</p>
