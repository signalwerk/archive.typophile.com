    html: <p>In Fontlab, paste the bitmap that you want to trace into the glyph, it will become that glyphs background. Then use Tools &gt; Background &gt; Trace Pixels or Tools &gt; Background &gt; Trace. You can even add the Background menu to your toolbar and make this a quick button click.</p>
