      <p>This is the info of the Futura Buchschrift (Book) from its time. Saying the type was optimised for body text only, but due to the fine harmonic design it was further developed for the whole range of type sizes. - So to me its no difference in understanding of the term Book. Like many type designs of this time the Mager/Leichte/Light version was the "native" Regular style.</p>
      <p>Futura Buchschrift, 1932<br>
      Die Futura Buchschrift, deren Strichstärke zwischen dem mageren und dem halbfetten Schnitt der Futura die Mitte hält, war ursprünglich vor allem für den glatten Satz bestimmt, doch erwiesen sich die Formverhältnisse gerade dieser Garnitur als so harmonisch, daß sie in allen Graden geschnitten wurde.</p>
      <p>--<a href="http://www.astype.de" target="_blank" rel="nofollow">astype.de</a>--</p>
