    html: |-
      <p>Pablo: <em>I [...] plan to rename the Regular to Medium [...]</em></p>
      <p>The sequence of font weights like the following on <a href="http://en.wikipedia.org/wiki/Font" rel="nofollow">Wikipedia</a> obviously seem to be influenced by the way some applications list them:</p>
      <p>[...]<br>
      Light<br>
      Book<br>
      Normal / regular / roman / plain<br>
      Medium<br>
      Demi-bold / semi-bold<br>
      [...]</p>
      <p>Personally I have my doubts about this sequence. The ‘Book’ weight should come <em>after</em> the ‘Regular’ weight in my opinion, like the ‘Regular’ of Monotype’s <a href="http://www.fonts.com/findfonts/detail.htm?productid=664568" rel="nofollow">Bembo Book</a> is an emboldened version of Monotype’s <a href="http://www.fonts.com/findfonts/detail.htm?productid=165060" rel="nofollow">Bembo</a>’s ‘Regular’ weight.</p>
      <p>Especially when the transition took place from (hot) metal to photo composing there was a shift in weight, and this effect was even more emphasized by the (sometimes [too] rapid) conversion to digital type. Also the fact that single masters were used for the production of text and display sizes made matters worse. What is considered to be ‘Regular’ in our time is a gradation lighter than what was used as ‘Regular’ in the times of foundry- and hot-metal type. The ‘Book’ weight offers the option to add a slightly heavier weight for relatively small point sizes, hence its name.</p>
      <p>So, I would never replace the ‘Regular’ weight by ‘Medium’ (which is in my opinion a synonym for ‘Semi-bold’, i.e. in between ‘Regular’ and ‘Bold’), and for the DTL Library I use therefore:</p>
      <p>[...]<br>
      Light (300)<br>
      Regular (400)<br>
      Book (500)<br>
      Medium (600)<br>
      Bold (700)<br>
      [...]</p>
      <p>FEB</p>
