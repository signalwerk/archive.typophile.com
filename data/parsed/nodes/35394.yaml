    <p>What's the best way to avoid an application conflict between the Book and Regular weight of a typeface family?</p>
    <p>If there is a problem caused by an application going by the weight number -- and they are both designated as 400 -- rather than the weight name, is the solution to give the Book weight a numerical value of 350?</p>
    <p>(The problem is that I already have a Light [300] and a Regular [400] weight, and a further weight in between is to be added, which would seem to indicate Book as a name.)</p>
