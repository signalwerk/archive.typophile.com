      <p>Andreas -- <cite>Like many type designs of this time the Mager/Leichte/Light version was the 'native' Regular style.</cite></p>
      <p>Funnily, Renner himself used the Halbfett rather than the Mager before the Buch [book] was available (in 'Kulturbolschewismus?').</p>
      <p>The original weights of Futura were Mager [thin], Halbfett [semifat], Fett [fat]. These weights and weight names seem to have been common in Germany and used in other sanserifs too (Erbar, Elegant Grotesk, Super Grotesk).<br>
      Futura Buch(schrift) [book] was added inbetween Mager and Halbfett. (Similarly, a Normal was added to Erbar.) Maybe it is safe to say that the Buch is neither a thinner nor a fatter version of any regular because there <cite>was no</cite> such Regular before, rather, the Buch <cite>is</cite> the missing Regular.</p>
      <p>(German) weight names then and now differ, and it's not possible to translate them directly.* It seems that these new sanserifs required rethinking of weights -- weight names, number of weights, relation of weights -- which was not an issue in earlier serif types.</p>
      <p>* Interestingly, Syntax's weights are called Mager and Halbfett, and a specimen (1968?) translates Mager as Regular, and Halbfett as Bold.</p>
      <p>But this isn't much related to Nick's original question any more ...</p>
      <p>[Yes, 'Grad' is size.]</p>
