      <p>@growland: Is that particular stylesheet in any way connected with another one, eg changed and renamed, or a ’based on’ one? Is the strange behaviour persistent with a new stylesheet using the same font and style? Do you have OT ánd PS varieties of the same font installed on the machine and did you clear the font caches after changing the stylesheets to the OT-font?<br>
