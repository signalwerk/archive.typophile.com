    html: <p>erg8t, this is a very specific question regarding the substitution of an OpenType version of a font for deprecated PostScript version. In this case, it is assumed that the user knows which fonts are active. I’m a big fan of 3rd party font managers, but this is a case where basic testing of the font installed the system is appropriate. It may be the case that not all versions of Adobe’s PostScript fonts map perfectly to the OpenType versions. Thomas Phinney probably has the best information available though...</p>
