    html: <p>We have cleared the font caches and made sure the user did not have the Type1. Since our files move from user to user if a user opened up a file on a machine with type 1 Helvetica the next user would get the font missing message even though the font isn’t used. It could be Stone Sans or Frutiger...it doesn’t matter. We have learned that if it says”medium” it is related to that error. It seems to have only become an issue with CS2.</p>
