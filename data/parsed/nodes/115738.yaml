    html: |-
      <p>Another technique for printing white type is to use foil stamping with a white foil. I've seen it used on brochure covers and business cards, and a cool thing is you can use black paper stock, so even the paper's edge is black. The business card below (not mine) uses 2 colors of foil — black and silver (but it could as easily been white).</p>
      <p>But the technique is expensive and not used too often.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/card_6053.jpg"></div><p></p>
