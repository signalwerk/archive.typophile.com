    html: |-
      <p>In printed materials, type that is "reversed out" (white type on black) tends to close up and look thinner, especially in small sizes, so using a slightly bolder weight might be a good idea. </p>
      <p>Reversed type is okay for headlines or short sections of text, but I wouldn't want to read long passages that way.</p>
