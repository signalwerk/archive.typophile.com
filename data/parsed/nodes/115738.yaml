    html: |-
      <p>Viewed on a computer monitor is indeed different. </p>
      <p>In conventional printing on paper, you'd normally create white type by printing a solid area of black ink that's knocked out where the letters appear, but as the ink is absorbed into the paper (especially on uncoated paper stock) the ink can spread a little into the white spaces making the type look thinner. On a monitor you don't have that problem.</p>
