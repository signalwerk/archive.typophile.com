    html: |-
      <p>Web/film people have all sorts of nicknames for it. I like 'glowtype' myself.</p>
      <p>On screen white type is produced using all available colours, black is produced by switching all colours off... So much like you see a glow when you look directly at a light bulb or the sun (I don't advise this) relative to a dark background... Your white type will produce a slight barely noticeable halo of light making it glow - giving the appearance of bolder stronger text or a larger more punchy image.</p>
      <p>The effect is completely reversed on printed material (as mentioned above) where the darker ink will bleed into the lighter ink or white area. For fine text it literally only has to be a tenth of a mm before it becomes noticeable to the naked eye. It can be made worse by auto trapping used in prepress software. A good prepress operator should warn you if you're going to have this issue and recommend ways around it...</p>
