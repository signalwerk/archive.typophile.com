  html: |-
    <p>Hello,<br>
    I'm just curious if there's a common explanation for something I've noticed with some letters I'm working on.<br>
    When I type out a group of my letters they seem to look much better and stronger when I view them as white text on a black background instead of black text on a white background.<br>
    Is there a reason for this? Does it mean I need to make my letters slightly bolder (because white letters on black generally appear heavier than when viewed as black on white).<br>
    Just wondering if anyone had some general insights.<br>
    Thank you.</p>
