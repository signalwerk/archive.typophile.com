  html: |-
    <p>Hello All,</p>
    <p>This is my first post on Typophile and I must congratulate all of you for a great looking community.</p>
    <p>I am currently working on a project for a organization for the benefit of children and their health.</p>
    <p>I am looking for a typeface in order to use in their new identity/wordmark. I was hoping someone here could recommend a specific typeface and maybe I can convince them to purchase it for the client.</p>
    <p>I was thinking something along a friendly typeface something like : The Sans<br>
    I was considering using something rounded but I do not want to loose the companies serious appeal.</p>
    <p>All help is aprecaited.</p>
    <p>Thanks</p>
    <p>Lukas</p>
