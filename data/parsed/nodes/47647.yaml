    html: |-
      <p>&gt; What would you say was the best savvy business decision in order to make this a successful?</p>
      <p>I'd need to see some of your type before I could give you a useful recommendation. Also, how much time are you willing to spend on marketing, customer support, and financial tasks? Are you willing to sacrifice a portion of your sales to be relieved of some of that work?</p>
      <p>&gt; So I was wondering what kind of promotion and marketing occurs</p>
      <p>Examples: web marketing (a useful website, web ads, SEO, backlinks), print marketing (magazine ads, catalogs, reference material, mailers), PR, build a customer database, create convincing type samples and copy, get active in the type community, develop relationships with designers and agencies.</p>
