      <p><strong>[EDIT - For an updated and expanded version of this post, please see <a href="http://typographica.org/001157.php" rel="nofollow">Typographica</a>]</strong></p>
      <p>Hi Alex. It's funny you should ask, because we just discussed this in a panel at <a href="/wiki/TypeCon" class="freelinking" rel="nofollow">TypeCon</a> on Saturday. I didn't get to say a lot of what I wanted to say in that session, so I'll let it all spill out here. I welcome any rebuttals or filling of holes. Disclaimer: the information below comes from 10 years of experience examining the retail font industry and is intended to be unbiased, but my perspective is inevitably shaped by four years as an employee of FontShop.</p>
      <p>It's important to understand the difference between a <a href="/wiki/Foundries" class="freelinking" rel="nofollow">foundry</a> (AKA vendor or publisher) and a <a href="/wiki/font%20retailers" class="freelinking" rel="nofollow">reseller</a> (AKA distributor or retailer). If you are a font maker, here are your options for getting that font to the public and making some money:</p>
      <p><strong>1. Signing with a Foundry</strong><br>
      A foundry can be considered a product manufacturer such as <a href="/wiki/Monotype" class="freelinking" rel="nofollow">Monotype</a>, <a href="/wiki/P22" class="freelinking" rel="nofollow">P22</a>, or <a href="/wiki/FontFont" class="freelinking" rel="nofollow">FontFont</a>. Foundries can be distributed through multiple channels, such as their own web shop and the shops of their resellers. When you submit a typeface to a foundry for release it is usually an exclusive deal. They will maintain the right to sell the font according to their contract. Royalties range from 20%-50% but there is also an important distinction: most foundries pay a percentage of the wholesale price of the font. So as the font goes further down the distribution chain, the designer is getting less of the retail price. Other foundries, like FontFont, give a percentage of the suggested retail price. So no matter where the font is sold, the designer gets the same cut.</p>
      <dl>
      <dt>Advantages:</dt>
      <dd>The foundry will handle all customer support (big!), marketing, and reseller contract relationships. Some offer technical and design assistance to complete font production. Spend less time on business, more on drawing and designing fonts.</dd>
      <dt>Disadvantages: </dt>
      <dd>Less control of where your font is sold. Earn less from each sale.</dd>
      </dl>
      <p><strong>2. Signing with a Reseller</strong><br>
      A reseller offers fonts from multiple foundries. Examples are <a href="/wiki/Fonts.com" class="freelinking" rel="nofollow">Fonts.com</a>, <a href="/wiki/MyFonts" class="freelinking" rel="nofollow">MyFonts</a>, <a href="/wiki/Veer" class="freelinking" rel="nofollow">Veer</a>, and <a href="/wiki/FontShop" class="freelinking" rel="nofollow">FontShop</a>. Resellers usually sign contracts with a foundry/publisher (in your case, Thinkdust) and offer all the fonts in that foundry's library. Resellers usually give the foundry between 50-65% of the retail price of the font. Each reseller has a different clientele and produces different types and quantities of marketing. I could go into the major differences later if you like. Some independent foundries (like <a href="/wiki/Shinntype" class="freelinking" rel="nofollow">Shinntype</a> and <a href="/wiki/Mark%20Simonson" class="freelinking" rel="nofollow">Mark Simonson</a>) find best results by offering their fonts through many different resellers while others go for a more exclusive strategy (like <a href="/wiki/Porchez%20Typofonderie" class="freelinking" rel="nofollow">Porchez Typofonderie</a> at FontShop, <a href="/wiki/Jukebox" class="freelinking" rel="nofollow">Jukebox</a> at <a href="/wiki/Veer" class="freelinking" rel="nofollow">Veer</a>). In the latter case, the reseller will often give a foundry more promotion exchange for being an exclusive retailer.</p>
      <dl>
      <dt>Advantages: </dt>
      <dd>Reach far more customers and different markets. Maintain some control of brand, pricing, and the ability to sign with multiple resellers.</dd>
      <dt>Disadvantages: </dt>
      <dd>Must be somewhat business savvy. Earn less from each sale.</dd>
      </dl>
      <p><strong>3. Going it Alone</strong><br>
      Building a foundry and selling them exclusively on your own web shop gives you 100% of sales, of course. Exclusivity has its benefits, as <a href="/wiki/Hoefler%20%2526%20Frere-Jones" class="freelinking" rel="nofollow">Hoefler &amp; Frere-Jones</a> and <a href="/wiki/Lineto" class="freelinking" rel="nofollow">Lineto</a> will attest.  It can give your brand a certain boost in value. But unless you are already well known, it can be a lot of very hard work to get customers to your shopfront, while lesser fonts are benefitting from broader exposure and marketing.</p>
      <dl>
      <dt>Advantages: </dt>
      <dd>Full control of brand and pricing. Get 100% of sales.
      </dd><dt>Disadvantages: </dt>
      <dd>Labor intensive. Must be business savvy. Less time for making fonts. Potential for major overhead. Responsible for customer support (major resource draw).</dd>
      </dl>
      <p>So the first decision to be made with each of your typefaces is whether you want to go the foundry or reseller route. </p>
      <p>If you decide to submit to a foundry, <em>the question of royalty rate is only one of many.</em> Which foundry would be the best fit for the typeface design? What foundries do you respect? Where are they sold and how are they marketed? What production assistance do they offer? How many fonts are already in their library?</p>
      <p>If you choose to build your own foundry, decide whether you want to sell the fonts exclusively on your own, or through one or more resellers. Again, which resellers do you respect? Who is their clientele and what do they offer in the form of marketing and other tools and services to draw customers? How many foundries are already in their shop?</p>
      <p>P.S. Dafont.com is simply a free font archive. Any commercial fonts listed on their site link to fonts.com and the publisher of Dafont.com gets an affiliate commission. The site is not a foundry or reseller in any way.</p>
