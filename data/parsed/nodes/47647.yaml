      <p>Hi Stephen,</p>
      <p>Thanks for your help. The reason I ask, is that I am currently at the start of setting up an online type foundry with Paris company Hello Hikimori. The company is going to be called 'Hypefortype.com) and I'm just researching into the field in detail. I realise marketing and driving traffic is a difficult thing on a very large scale, so would you have any recommendations here. We're going to have two different sections of type. One is corporate which hopefully will be snapped up by agencies, and the other is creative. What would you say was the best savvy business decision in order to make this a successful?</p>
      <p>I have a friend in London who is friends with Identikal, a pair of designers who have been extremely successful from type design apparently. So I was wondering what kind of promotion and marketing occurs, and whether it's best to submit to resellers also?</p>
      <p>Would appreciate any comments from anyone, and thanks for your help above Stephen,<br>
      Alex.</p>
