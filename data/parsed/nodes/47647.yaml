    <p>HI Guys,</p>
    <p>I've been trying to research into dafont.com and fonts.com with regards to commission, but I haven't been successful. I know dafont markets fonts on the back-end of having advertising sponsors, but do they offer a paid commission to the type designers submissions or is it all purely for free? Also, which would you say are the top 6 - 7 foundries to start building your collections within, I'm already with myfonts.com, and have a lot of new more developed faces to put out into the market,</p>
    <p>Thanks for your help,<br>
    Alex.</p>
