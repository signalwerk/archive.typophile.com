    <p>Hi, im new to all of this so apologies for any stupid comments or blatently obvious questions i may come out with.</p>
    <p>Anyway, to the point, im looking to get a tattoo in a few days, and am looking for a few fonts, or fonts similar to the ones im looking at.</p>
    <p>The first of which is this piece, created by Mister Cartoon:</p><div class="imageWrap"><img src="http://typophile.com/files/cartoonw_6339_6034.jpg"></div><br>
    The font in which the cities are written in would be ideal, i know its custom work, but if anybody could point me in the direction of a similar font, that would be brilliant.<p></p>
    <p>I am a big fan of Mister cartoons work, and the lettering in most of his tattoos is what im looking for. Any help towards finding the right font for my tattoo would be brilliant.</p>
    <p>Thanks, Rob</p>
