      <p>The post was from 2004, I was fresh out of university and I wanted to do a thesis on the topic of type design for spanish under the assumption that there could be specific language characteristics such as letter pair frequency that could be used for practical benefits.</p>
      <p>Well, the topic was too much. It ended just in a simple sketch of thesis.</p>
      <p>I remember I concluded that the details could be irrelevant for readability improvement but that there were enough aesthetic opportunities in the design of diacritics, punctuation marks and ligatures.</p>
