    html: <p>Right. Those aesthetic opportunities are what I'm interested in. But I do think legibility can be improved slightly by taking a look at letter pairs that actually happen. At least, in that one can solve problems of collisions, which could be distracting. In a way that too is aesthetic. But readability is at least a little bit aesthetic.</p>
