      <p>Héctor: You cut off mid-sentence, what were you trying to say?*</p>
      <p>Anyway, I've been thinking about this lately, I'm glad the link came up for this old thread.† Working on <a href="http://typophile.com/node/91381" rel="nofollow">Alpine</a>, I thought it would be useful to make some dummy text. <a href="http://www.adhesiontext.com/" rel="nofollow">Adhesion Text</a> works well enough for this,  but 1: I'd like to be able to generate dummy text offline, and 2: I was thinking about some other ways of actually generating the text.</p>
      <p>A good start is to make pairs of all letters in a list, but it's a little unrealistic. Many of the combinations will probably never happen. Linux usually comes with dictionary files for spell checking‡. I could make a script to catch each combination.</p>
      <p>In line with this thread, with a little modification the same script could count the occurrences. The data could be used in the same way as the information in your pdf. A count of pairs in a dictionary wouldn't really tell you about actually usage—the same script could also count the pairs in books from several periods, and work for other languages.</p>
      <p>Is there any more information on this? I've tried googling but wasn't <a href="https://en.wikipedia.org/wiki/Letter_frequency" rel="nofollow">able</a> <a href="http://diacritics.typo.cz/index.php?id=85" rel="nofollow">to</a> <a href="http://www.typophile.com/node/31506" rel="nofollow">find</a> <a href="http://typophile.com/node/10879" rel="nofollow">much</a>. Most of it relates directly to kerning, although it is slightly related. pp 204-205 of the Elements of Typographic Style displays part of what appears to be a very excellent test file. I wonder if the rest is available.</p>
      <p>* Of course, I'm asking 8 years late.<br>
      † Is it bad to revive an old thread?<br>
      ‡ they are slightly inadequate for spelling in that many words are missing, for instance those with prefixes or suffixes added</p>
