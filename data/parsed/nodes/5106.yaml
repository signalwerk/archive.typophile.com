      <p>To me there's nothing better than reviving an old thread. Recently we revived one that was about 10 years old!</p>
      <p>The Brown corpus must be available online. It's a bit long-in-tooth, but it's very large, so it still gets respect. That said I for one would love to hear of alternatives, especially for non-Latin scripts.</p>
      <p>About Héctor's post: during one of Typophile's past system-transitions something went wrong, possibly having to do with how upper-ASCII(?) characters are handled, and some posts just get truncated. I don't know whether the text data is actually gone, or it's there but isn't being rendered.</p>
      <p>hhp</p>
