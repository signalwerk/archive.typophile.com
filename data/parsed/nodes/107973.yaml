    html: |-
      <p>As far as I can determine the first use of this cover was in the Bodley Head first edition in 1976. This suggests lettering or  a photo lettering font, probably not digitized.<br>
      Friedrich Poppl (1923-1982) had a background in calligraphy and designed a font for Bethold in 1982, sold as Laudatio, which is similar. It is plausible that the Bodley Head drew on some earlier work by Poppl, either directly or via a photo lettering company.<br>
      I tried to duplicate the title by tinkering with Laudatio BQ Medium, but compression [70%] yields only:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/PopplLaudatioCondMed70pct_4869.jpg"></div><br>
      which is rather different, particularly the lowercase -- not square enough, x-height too low etc. For ease of reference I have included the lowercase y which has some similarity to the Y in the cover letters.<br>
      Don<p></p>
