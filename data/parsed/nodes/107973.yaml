      <p>Very similar, but I don't think it can be a version of Laudatio as I don't think it was around in 1976 when this version was originally published. Could easily be wrong though.</p>
      <p>I've been trying to figure it out for a while now and I can't tell if it's an existing or custom typeface. There are some very small differences between some of the characters but that could be down to flaws in the photosetting process as they are very small...</p>
