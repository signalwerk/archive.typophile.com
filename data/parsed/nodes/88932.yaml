    html: <p>Depending on the specific EULA (End User License Agreement), most foundries don’t charge additional fees for font usage on products they design and sell at all. Though in such cases often a MUL (multi-user license) is necessary, since more than 5 designers (also depending on the specific EULA) use the fonts in large companies, this usage itself is usually covered by the basic license. Speaking for <a href="https://www.fontfont.com/fonts?filter_by_use=1&amp;sortorder=size&amp;sv=positive&amp;sample=Rag&amp;ss=medium" rel="nofollow">FontFont</a>, it’s definitely covered.</p>
