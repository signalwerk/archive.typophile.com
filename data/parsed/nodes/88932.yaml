    html: <p>So strange that P22 can keep going with that. “Yes you can license the fonts, but this and this and that and this and that and this and this is not allowed”. There’s no good way to know how much a license will cost beforehand. Why not reveal the factors <em>and the formula</em> that affects the price tag?</p>
