    html: <p>I think the P22 restrictions are somewhat unusual (as I recall House Industries has some similar rules), but checking the EULA for each font you intend to use in this way is probably the best plan. As Nick mentions, digital products, along with rubber stamps, and in some cases using dingbats as primary design elements are things to watch.</p>
