  html: |-
    <p>Hello,</p>
    <p>I currently purchase font licensing for a major U.S. corporation to use on packaging, in-store signage and advertising. I have been approached by our Product Design and Development team about licensing for font usage on products they design and sell. </p>
    <p>I have not investigated this in the past and wonder if anyone has some expertise and/or documentation I can look it to provide advice to me and the team.I do know that P22 required Starbucks to purchase additional licenses to cover usage of their fonts on products.</p>
    <p>Any advice or help is appreciated!</p>
    <p>Thanks,</p>
    <p>Kristin</p>
