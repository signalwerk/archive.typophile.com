  html: |-
    <p>Hoping to get a crit on this reproduction decal I made. The actual size will be 35mm x 10mm, so in any case, it'll be so small some details can be over looked. I am worried about the U's in VAU-VUE, however.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/JDecal1_reduced_5727.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/decalJermaine_5479.jpg"></div><p></p>
    <p>Of course, if someone could direct me to an official site, I'd be happy to send my coworker over there instead.</p>
    <p>EDIT: I am told it's suppose to read as "TRU-VUE". I'll be making those corrections.</p>
