    html: "<p><i>&gt; i'm going to be \"rude\" - why this typeface...unique?  <br>since i don't want to \"nag\" people for small things...</i> <br> <br>Actually David, personally I have stopped judging*  <br>typefaces on aesthetic merits. When appreciating a  <br>design you can only go as far as to the point where  <br>personal taste comes into play. \"De gustibus et  <br>coloribus non disputandum\" etc. What's looking good  <br>in your eyes may look horrible to someone else. <br>Do I sound like an old fart? Yes I do thank you. And <br><a href=\"http://www.typophile.com/forums/messages/30/11138.html#POST20145\" target=\"_blank\"> I'm repeating myself</a>. That's Alzheimer kicking in. <br> <br><i>*I may dislike a certain typeface and voice that dislike,  <br>but I won't question someone else liking it. Case in  <br>point: I quite like this particular face for its inventive  <br>use of straight lines and its high contrast in a sans  <br>serif design, and am intrigued where it could come from.</i></p>"
