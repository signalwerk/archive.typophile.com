    html: "<p>Yes, we had this one before, from the same poster indeed,  <br>and nope, we -quite regrettably- never succeeded in IDing  <br>it. The condensed caps on the left are <a href=\"http://www.myfonts.com/fonts/linotype/univers/39-thin-ultra-condensed/charmap.html\" target=\"_blank\"> Univers 39 Thin Ultra Condensed</a>*, <br>but I think we we're looking for the right hand type. <br> <br>* A recurring theme in movie posters and websites: <br>Condensed credits on movie posters are usually set in <br>Univers Ultra Condensed, and if you see some classic  <br>looking all caps face, it probably is <a href=\"http://www.myfonts.com/fonts/linotype/trajan/\" target=\"_blank\"> Trajan</a>.</p>"
    html_clean: "<p>Yes, we had this one before, from the same poster indeed,  <br>and nope, we -quite regrettably- never succeeded in IDing  <br>it. The condensed caps on the left are <a href=\"http://www.myfonts.com/fonts/linotype/univers/39-thin-ultra-condensed/charmap.html\" target=\"_blank\" class=\"link-external\"> Univers 39 Thin Ultra Condensed</a>*, <br>but I think we we're looking for the right hand type. <br> <br>* A recurring theme in movie posters and websites: <br>Condensed credits on movie posters are usually set in <br>Univers Ultra Condensed, and if you see some classic  <br>looking all caps face, it probably is <a href=\"http://www.myfonts.com/fonts/linotype/trajan/\" target=\"_blank\" class=\"link-external\"> Trajan</a>.</p>"
