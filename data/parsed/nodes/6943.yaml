  html: "<p>Am I the only one in the land about to go mad over Fonts Behaving Badly? I use Font Reserve, and strive to manage my (assuredly too large) font collection by running fonts through Font Doctor before adding them. Yet often the fonts go bad and I get \"Internal Runtime Error\" messages. I'm trying to reload from the original font CDs, yet still this happens. Once good, obedient fonts are now seemingly useless. In the past couple of months I've spent literally dozens of hours trying to solve this. I find Font Reserve to be slow and inefficient to work with. Fellow Mac/Pantherites: what are you using for Font Mangement Utility? Any tips on how to get this all to run more smoothly?</p>"
  html_clean: "<p>Am I the only one in the land about to go mad over Fonts Behaving Badly? I use Font Reserve, and strive to manage my (assuredly too large) font collection by running fonts through Font Doctor before adding them. Yet often the fonts go bad and I get \"Internal Runtime Error\" messages. I'm trying to reload from the original font CDs, yet still this happens. Once good, obedient fonts are now seemingly useless. In the past couple of months I've spent literally dozens of hours trying to solve this. I find Font Reserve to be slow and inefficient to work with. Fellow Mac/Pantherites: what are you using for Font Mangement Utility? Any tips on how to get this all to run more smoothly?</p>"
