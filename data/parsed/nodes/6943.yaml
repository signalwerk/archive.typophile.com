    html: <p>I tried the solution listed above (creating an alias of the Adobe:Fonts folder). I copied in a folder of 4 open type fonts, and then opened InDesign CS, but it couldn't see them. I then rebooted the machine, but it still couldn't see them. I opened them with Apple's FontBook, and they worked. I could see the fonts in the Library:Application Support:Adobe:Fonts folder. Is there a step I missed?</p>
