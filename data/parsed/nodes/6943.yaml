    html: "<p>After fighting with Font Reserve for a few months, our publishing company switched to a manual font management system. <br> <br>Because our main apps are all from Adobe (InD, PS, AI), we activate fonts by putting them in the Library : Application Support : Adobe : Fonts folder. <br> <br>We created an alias of this folder, named \"Active Fonts,\" and put it on the desktop to make adding and deleting fonts more convenient. Since OSX recognizes fonts within subfolders, we group all of the fonts required for a project into a single folder, and then add or remove it from the Active Fonts alias.  <br> <br>Using the Library : Application Support : Adobe : Fonts folder ensures that the fonts are available in our design apps, while not choking programs like Word and Entourage that don't like dealing with large numbers of open fonts. <br> <br>(Another step that made life easier was eliminating the use of Multiple Master fonts, and replacing them with their OpenType equivalents.)</p>"
