      <p><em>I would like to be able to put many design sizes inside the same font, along with some kind of specification about when to use which.<br>
      Could this somehow be added to the .webfonts proposal?</em></p>
      <p>No, but it could be added to the composite font format standard, which is being developed. There is support from at least some participants for using this format for different size-specific fonts within a single composite font.</p>
