    html: |-
      <p>The instructions and glyphs are actually mixed into a single table, which is one of the first things the next format should address. If we ever get around to it, some will probably want to eliminate the instructions altogether, and others will want to eliminate the glyphs altogether. :-.</p>
      <p>Cheers!</p>
