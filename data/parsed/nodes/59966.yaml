  html: <p>Am I correct in believing that CFF OpenType fonts can only contain Postscript hints? Or does the OpenType spec allow TrueType hints in a font with Postscript outlines?</p>
  html_clean: <p>Am I correct in believing that CFF OpenType fonts can only contain Postscript hints? Or does the OpenType spec allow TrueType hints in a font with Postscript outlines?</p>
