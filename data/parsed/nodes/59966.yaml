    date: 2009-07-14T19:47:00
    date_raw: 14.Jul.2009 7.47pm
    votes: null
    html: <p>Your initial belief is correct. The TT and PS hints are closely linked to the outline formats, so there is no way to apply TT hints to a PS outline.</p>
    html_clean: <p>Your initial belief is correct. The TT and PS hints are closely linked to the outline formats, so there is no way to apply TT hints to a PS outline.</p>
