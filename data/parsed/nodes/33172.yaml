    <p>Hi all.</p>
    <p>Was wondering if all you typophiles out there could help me:</p>
    <p>A client has approved this font for their logo i.e Emigre's 'Ottomat' font (<a href="http://redesign.emigre.com/EFfeature.php?di=113" title="http://redesign.emigre.com/EFfeature.php?di=113">http://redesign.emigre.com/EFfeature.php?di=113</a>)<br>
    for their logo....however for some other sub brands we find that the font is not working.</p>
    <p>Would any of you out there know of fonts similar or close to this font? regardless of whether it is free or a proffesional foundry.</p>
    <p>Main thing is the font is a a pretty plain san serif...but with the whimsical expception of the rounded and odd edges point is some of the alphabets ascenders and ends. It is slightly playful but just right to be considered 'edgy'</p>
    <p>The other crux: The standalone 'P' of the font..which looks nice is enclosed within a shape for a logotype for the same company..so it is important that the font have a unique and characteristic p...with something a bit playful like this one.</p>
    <p>Any help would be greatly appreciated.</p>
    <p>Robby<br>
    INDIA</p>
