  html: |-
    <p>I am trying to ID the font used for the title/logo on this website: <a href="http://www.glendoradentalcenter.com/" title="http://www.glendoradentalcenter.com/">http://www.glendoradentalcenter.com/</a></p>
    <p>It is horizontally scaled to the point of unreadability, but is otherwise quite close to Book Antiqua, but with slightly rounded serifs and a higher x-height (as indicated by the cross bar in the capital E). I've seen this font before but can't recall it's name.</p>
    <p>Thanks.</p>
