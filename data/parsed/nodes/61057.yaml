    <p>At Greater Albion we’re still putting the finishing touches to our next major release, ‘Crewekerne’-in the meantime we’ve been having some fun trying it out in ‘real-world’ applications.</p>
    <p>Crewekerne offers a charmingly hand drawn Roman family in the best traditions of the ‘Arts and Crafts’ movement of the early 20th century.  Why not have a look in at our <a class="freelinking external" href="http://gatf.wordpress.com " rel="nofollow"> blog</a> and see Crewekerne at work.  We hope to release in the next week or so.</p>
