    <p>Are Esperanto readers fussy about the placement of the circumflex on the Ĵcircumflex (0134)?</p>
    <p>I think I'm <em>supposed</em> to center of the width of the letter like so. . .</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/1_4968.PNG"></div><p></p>
    <p>. . .as opposed to centering on the stem like an Icircumflex.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/2_3605.PNG"></div><p></p>
    <p>I prefer to place it wherever the hell I damn well please.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/3_3515.PNG"></div><p></p>
    <p>Do I risk infuriating billions and billions of Esperanto readers with my brazen circumflex placement?</p>
