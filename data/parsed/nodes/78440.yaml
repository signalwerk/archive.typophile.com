    html: <p>That may be, but it seems odd to me. What about a face where the J drops below the baseline and hooks to the left under the adjacent letter? If you center it over the entire J, then it will be centered over the space between the letters. Would you also prefer to see the dot on the lowercase j more to the left, centered on the width of the letter? It seems to me to be more consistent to treat the circumflex (or any other accent) as you would the dot, centering it over the stem. I also checked and the vast majority of fonts installed on my computer have it centered over the stem, only a handful don't.</p>
