    html: |-
      <p>I am not an Esperanto enthusiast, but I would tend to think that the intent was to harmonize with existing European typographic practice, rather than for Esperanto to be radically different.</p>
      <p>Centering over the stem would, as noted in this thread, be mandatory for typefaces like Caslon or Baskerville, where the bowl of the capital J is a kern. I strongly suspect that it is the usual practice in other typefaces as well.</p>
      <p>Although, what would I know? I thought that Esperanto used the caron, not the circumflex. But, checking, it is the circumflex that it uses. Ah: and Czech uses a caron on the J; - no, it doesn't, I had interpreted the Wikipedia article wrongly... it is used in some phonetic transcription schemes and in the Wahki language - it centers the caron over the stem on the lowercase J, as Esperanto does with the circumflex, but some fonts, at least, put the caron inside the capital letter J for Czech.</p>
      <p>At least there's a basis for comparison, if Esperanto texts aren't easy to find.</p>
