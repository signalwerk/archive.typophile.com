    html: <p>I know some Esperanto and while this does not bother me, I think it would be wiser to put the Ĵcircumflex more to the left. Keeping it on center could confuse people after all. It would be kind of like taking the tilde in Spanish and making it off-center. People will know which letter it is but it would look strange.</p>
