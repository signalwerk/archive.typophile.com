    <p>Additional Exhibits in Buffalo during TypeCon at partner event sites</p>
    <p><strong>Hallwalls</strong> (site of Tuesday’s Pecha Kucha Event)<br>
    June 7 - July 18, 2008<br>
    <strong>Critical Art Ensemble / Institute for Applied Autonomy: SEIZED</strong><br>
    Following the four year long ordeal of CAE founding member and University at Buffalo Art Professor Steve Kurtz—accused by the Justice Department of "bio-terrorism" and later indicted on charges of mail fraud for procuring harmless bacterial cultures for use in an educational art project—SEIZED presents the artworks behind this case which has attracted worldwide attention and propelled an international arts community to rally to Kurtz's support and on behalf of freedom of expression.<br>
    <a href="http://www.hallwalls.org/visual_shows/2008/show_seized.html" title="http://www.hallwalls.org/visual_shows/2008/show_seized.html">http://www.hallwalls.org/visual_shows/2008/show_seized.html</a></p>
    <p><strong>Karpeles Manuscript Musuem</strong> (site of Wednesday’s Sefan Sagmeister talk)<br>
    May 1, 2008 – September 1, 2008<br>
    <strong>Star Trek Drawings</strong><br>
    Star Trek is one of the most successful TV series of all time.  The production of the TV program requires the efforts of artists to model every aspect of the story and all the devises used. It is these artists sketches and drawings that we present in our exhibit "Star Trek". Drawings include designs for "The Bridge", "The Engines", "Deck Plans", "Corridors", "Medical Instruments". "Phaser Guns", "Holodecks", "Alien Ships" , and much more.</p>
    <p><strong>UB Art Gallery at the Center for the Arts</strong> (site of Thursday’s NLXL event)<br>
    July 1 through July 25, 2008<br>
    <strong>NLXL a design studio for visual communication and interaction</strong><br>
    NLXL experiments with the possibilities of combining visual and interactive elements within single design solutions. Content, form and technique are carefully considered in each and every solution. NLXL designs logos, corporate and visual identities, web sites and web-identities, event styles, forms, posters, animations, books, content management systems, digital presentations and other digital applications. The exhibition will feature graphic posters and an interactive, multimedia installation.<br>
    <a href="http://ubartgalleries.buffalo.edu/pages/UBArtGallery/cfacurrent.shtml" title="http://ubartgalleries.buffalo.edu/pages/UBArtGallery/cfacurrent.shtml">http://ubartgalleries.buffalo.edu/pages/UBArtGallery/cfacurrent.shtml</a></p>
    <p><strong>Albright-Knox Art Gallery </strong>(site of Friday’s Eric Spiekermann talk)<br>
    <strong>Op Art Revisited<br>
    Selections from the Albright-Knox Art Gallery</strong><br>
    July 18 – October 26, 2008<br>
    Op art, also know as “Optical art,” refers to the work of a group of abstract painters in the early 1960s who—under the direction of artists Richard Anuszkiewicz, Bridget Riley, Julian Stanczak, and Victor Vasarely—utilized parallel lines, concentric circles, and electric colors to create works that give the visual effect of afterimages and illusion of movement. </p>
    <p>(all events open to the general public)</p>
