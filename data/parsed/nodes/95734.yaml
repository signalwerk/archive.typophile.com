    <p>After having the same article tweeted, facebooked, emailed, posted, mentioned to me, and a few days trying to piece together a messy collection of hyperlinks and pages, I prepared the following article review. And as far as bullshit goes, a good scientist can’t say that. It was just a hook. In order to support or refute the claims of this study you would need access to the same materials and data. Have at it Nick. I know how much you love the role of science in the practice of typography ;)</p>
    <p><strong>In one sentence</strong><br>
    A short passage set in the typeface Baskerville was found to be more believable than the same passage set in five other typefaces.</p>
    <p><strong>APA citation</strong><br>
    E. Morris. (2012, August 08) Hear, all ye people; Hearken, o Earth (part one) [Web log post]. Retrieved from <a href="http://opinionator.blogs.nytimes.com/2012/08/08/hear-all-ye-people-hearken-o-earth/" title="http://opinionator.blogs.nytimes.com/2012/08/08/hear-all-ye-people-hearken-o-earth/">http://opinionator.blogs.nytimes.com/2012/08/08/hear-all-ye-people-heark...</a></p>
    <p><strong>What did they change?</strong><br>
    Typeface</p>
    <p><strong>What typefaces did they use?</strong><br>
    Baskerville<br>
    Computer Modern<br>
    Comic Sans<br>
    Trebuchet<br>
    Helvetica<br>
    Georgia</p>
    <p><strong>What did they measure?</strong><br>
    Reader’s agreement or disagreement with a statement about a passage.<br>
    Reader’s confidence with their agreement or disagreement.</p>
    <p><strong>Who did they test?</strong><br>
    Readers of The New York Times blog: The Opinion Pages<br>
    ~10,000 people clicked on the article.<br>
    ~50,000 people took the quiz.<br>
    45,524 data sets were used for statistical analysis.<br>
    No demographic data was reported.</p>
    <p><strong>Experimental design</strong><br>
    Unknown. It is not reported if subjects took the test more than once — “If you have taken it before, please take it again.” (Morris, 2012). As such, a repeated-measures mixed-subjects design is most likely.</p>
    <p><strong>Why did they do this?</strong><br>
    To determine if typeface influences the believability of a passage of text.</p>
    <p><strong>What did they do?</strong><br>
    Subjects read a 368 word blog post on The New Your Times blog, The Opinion Pages. Within the post was an 80 word passage about an asteroid’s near collision with Earth. Through use of a computer program, the passage within the post was presented in one of six different typefaces: Baskerville, Computer Modern, Comic Sans, Trebuchet, Helvetica, and Georgia. At the end of the post readers were asked two questions; One, if they agreed or disagreed with a claim in the passage “…we live in an era of unprecedented safety…” and a second, asking how strongly they agreed or disagreed with the claim.</p>
    <p><strong>What did they find?</strong><br>
    Subjects found the passage set in the typeface Baskerville to be more believable than compared to the other five other typefaces.</p>
    <p><strong>What does this mean?</strong><br>
    If the simple act of taking the time to choose an appropriate typeface has the potential to influence readers’ perception of your credibility, perhaps it would behoove you to case the joint before you B &amp; E.</p>
    <p><strong>Observations</strong><br>
    Despite the number of datasets analyzed, given that the test was administered online, it is not possible to determine how many individual actually actually took the test. Especially given Morris’ (2012) request in the original post “If you have taken it before, please take it again.”</p>
    <p>The passage itself is also very short at 80 words. This  and there is the possible confound of an interaction between typeface and content. For example, if Comic Sans could be the winner if the passage was about clowns.</p>
    <p>In addition to this, objective measures of human performance such as time to read, and comprehension accuracy, were not reported, making it difficult to determine the validity of subjects’ responses.</p>
    <p>Of special note, data analyst David Dunning of the Department of Psychology of Cornell University admirably acknowledged several potential criticisms of this study in his statement “You are collecting these data in an uncontrolled environment (who knows, for example just how each person’s computer is rendering each font, how large the font is, is it on an iPad or iPhone, laptop or desktop), are their kids breaking furniture in the background, etc. So to see any difference is impressive.” By this he means that in an uncontrolled environment, the fact that everyone is using a different device, has a different education, speaks a different language &amp;c could potentially nullify the effects of changing the typeface. In this case, it did not. And Dunning’s (2012) lay-person description of statistical analysis is one of the best plain-language examples I have ever seen. I look forward to reading follow-up studies.</p>
    <p>You wouldn’t happen to have an extra $30,000.00 of grant money kicking around would you?</p>
    <p>————</p>
    <p><strong>Further reading</strong><br>
    Brumberger, E. (2004). The rhetoric of typography: Effects on reading time, reading comprehension and perception of ethos. <em>Technical Communication 51</em>(1), 13–24.</p>
    <p>————</p>
    <p>You can find the same review on my website at <a href="http://readthetype.com/baskervillebullshit/" title="http://readthetype.com/baskervillebullshit/">http://readthetype.com/baskervillebullshit/</a></p>
