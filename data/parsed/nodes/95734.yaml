    votes: null
    html: |-
      <p>"?..do you mean the fact that the population was not controlled?"</p>
      <p>Not exactly. I mean I'd rather know nothing about the subjects than not to know the researchers have screwed up something fundamental typographically.</p>
      <p>I would share your concerns for the surroundings and the portion, but that there is nothing about this test that claims it's about visually insulated long-passage immersive reading, is there? </p>
      <p>But I think the most important thing about the study is as follows... About 25 years ago, Adobe tried to strip the postscript-using world of its free font choice. They had a couple 100 fonts and, via licensing, threats and technology, were claiming control of the type one format. This failed of course, everybody got to have any fonts they wanted and publishing bloomed, wherever postscript went.</p>
      <p>Then about 20 years ago, the web came along and stripped the web using world of its free choice in live fonts, forcing anyone who wanted a typographic personality to do it via graphics, and all but eliminating typographic choice in reading sizes, unless bad versions of Helvetica, Times Roman and Courier, at low resolution, was the publisher's "thing."</p>
      <p>Only 8 years ago did the healing begin on this with the move towards @fonface. Meanwhile a whole generation of developers (will get to "that generation" of readers in a second), grew up reading a small selection of fonts used for all purposes, and when this generation got to do their technology thing for reading devices, these devices dint have many fonts... Or not as many as the wide spectrum of fonts authors and publishers used in the printed books they were selling to readers...</p>
      <p>So, after all that, for 50 k people pf that generation to say no thanks, I want my Baskerville?</p>
