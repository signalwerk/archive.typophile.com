      <p>“<em>I’d much rather have doubts about the subjects, than anyone else involved in such a study</em>.”</p>
      <p>By this do you mean the fact that the population was not controlled?  </p>
      <p>While I agree, it’s an uncontrolled population, this does give the study a higher degree of external or ecological validity. And as far as typography + psychology studies go, 50,000 Ss is <strong>huge</strong> in my books. Good or bad, it’s certainly noteworthy. </p>
      <p>Personally, I find the length of the passage (80 words) and the number, and nature of the questions, — 2 questions, 1 yes/no, 1 three point Likert scale — to be of greatest concern. Combine that with the design noise around the test portion, and it gets even messier. Below you see the full post (shown at 50% of what I saw it as on <em>my</em> machine) with a red line around test portion (the part where they change the font. The rest remained unchanged). IMO, that’s a pretty damn small portion.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/bar_full_s_3817.jpg"></div><p></p>
