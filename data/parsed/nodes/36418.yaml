  html: <p>so. . . i'm working on some explanatory exhibit signage for an area that is rather dimly lit. each panel will only have a few sentences at most and so far i'm looking at sans serif typefaces that will be at least 36 pt - any suggestions on something that could possibly work reversed out or is it ridiculous to even consider light text on a dark background under not awesome lighting?</p>
