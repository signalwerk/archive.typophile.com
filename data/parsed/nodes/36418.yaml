      <p>Clearview Hwy has the benefit of having a series of weights designed to be used in reverse. <a class="freelinking external" href="http://clearviewhwy.com/TypefaceDisplay/index.php" rel="nofollow">see here</a></p>
      <p>You also might need to add a thin hairline around the letters, to compensate for the visual effect of the stem weights creeping in. </p>
      <p>Of course the most important thing is to make a test sample(s) and try it in the actual space, or as close an approximation as you can find.</p>
      <p>Jason C</p>
