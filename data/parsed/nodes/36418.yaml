      <p><a class="freelinking external" href="http://www.usdoj.gov/crt/ada/adahom1.htm" rel="nofollow">ADA site here</a><br>
      However as I understand the ADA law, the requirements apply to signs identifying permanent spaces in buildings. I'm guessing that the signs in question would be supplying information about an exhibit, for instance identifying an artwork's title and artist. In a circumstance like that, the informational sign is not required to adhere to the ADA standard, although the sign identifying the name of the exhibit room (as well as Men's room, etc), would be required to comply.</p>
      <p>As James mentions, even if the law doesn't require these signs to comply, the spec is still a useful guideline for any signs to ensure your signs can be read by a broad section of the population.</p>
      <p>Jason C</p>
