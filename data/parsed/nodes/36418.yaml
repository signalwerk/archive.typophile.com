    html: |-
      <p>In dim lighting it may be prudent to use dark letters on light backgrounds. What is confusingly referred to as Negative Contrast. The light background of the panel, especially if they are lighter than the wall color, may help readability.</p>
      <p>As to size, I believe ADA guidelines specify 1 inch of cap height for every 50 ft of viewing distance.(I know this is what FHWA has built their spec on). Also remember not to go too bold. A maximum stem weight of 1:5 stroke width to height ratio is the boldest you should go. (also the boldest allowed in the ADA spec)</p>
      <p>That 1 inch cap height spec refers to all caps settings. IF you use mixed case you should go larger.</p>
      <p>James</p>
