    html: <p>I’m sure you could make it work if you use typefaces designed for signage systems. FFInfo, Frutiger, Clearview, and plenty of other fonts could work just fine. You might also think about printing on some kind of reflective paper, or maybe even getting a sign shop to help you out with these if you have the budget.</p>
