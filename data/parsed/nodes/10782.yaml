HE HISTORY OF TYPOGRAPHY. (MONDAY-FRIDAY, 28 JULY - 1 AUGUST). A survey of European and American typographic history from 1450 to the present, but concentrating on the period 1480-1950. Topics will include: the development of Roman and italic; from Old Style to Transitional to Modern (Italian, French, Dutch, and English developments); display types; the coming of machine composition and the historic revivals; typeface nomenclature; and techniques for dating pre-1885 hand-set typefaces and for naming post-1885 machine-set typefaces. In laboratory sessions, students will have a chance to set type by hand, proof, and print. Instructor: Stanley Nelson. <br> <br>STANLEY NELSON has been a specialist for many years in the Graphic Arts Collection of the National Museum of American History, Smithsonian Institution, and he has given many demonstrations and lectured widely on various aspects of typographic history. He is both author and presenter in the 1985 Book Arts Press videotape, From Punch to Printing Type: The Art and Craft of Hand Punchcutting and Typecasting.</p>'
