    html: <p>I don't know about macs, but on Linux once having initial build environment set up (which comes down to <code>apt-get install build-essential</code> and <code>apt-get build-dep fontforge</code> for Debian/Ubuntu), building and installing it from source is straight forward. I always build from CVS myself and don't wait for releases, which means early exposure to bugs but that is fine for me.</p>
