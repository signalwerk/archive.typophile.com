    html: <p>It is unfortunate that George has declined to update the pre-compiled builds of FontForge for almost a year now, but I understand how difficult it is to maintain. It doesn't help that each version of MacOS X makes such significant changes to X11 and Python. That being said, I have yet to figure out how to properly compile the program from source. There have been many feature enhancements since the last build, and I haven't been able to take advantage of them.</p>
