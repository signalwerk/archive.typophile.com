    html: <p>The instructions above for building FontForge from source, so it will not magically solve your issues. As for the <code>apt</code> error, it seems you don't have source repositories enabled (these repositories contains source code of the binary packages), you can enable them from the <a href="/wiki/https%3A/%252Fhelp.ubuntu.com/community/Repositories/Ubuntu%2523Ubuntu%2520Software%2520Tab" class="freelinking" rel="nofollow">Software Sources</a> tool.</p>
