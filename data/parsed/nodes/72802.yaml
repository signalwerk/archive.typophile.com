    <p>Hi all,<br>
    I just downloaded FontForge again (FontForge_macunivX.5-20090923.pkg.zip on the FontForge website). I'm running Mac OS 10.6.4 on a MacBook Pro Intel Core 2 Duo.</p>
    <p>FontForge seems to be VERY unstable... not the way I remember it. Whenever I press the Delete key, it quits. And the same thing happens with the Shift key and any Arrow key. I haven't tried any more keys but I assume that others will cause it to quit as well.</p>
    <p>Has anyone else had this problem or know of how to fix it? </p>
    <p>Many thanks<br>
    Cale</p>
