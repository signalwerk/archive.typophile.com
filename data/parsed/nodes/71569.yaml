    <p>Hi all, thanks in advance for any help.</p>
    <p>I'm working with a client that doesn't know the font they used in their own logo, so I've been tasked with tracking it down. It looks like they've tweaked the base font a bit to come up with this logo, but I think this is still a font at its core. </p>
    <p>I swear I've seen something a lot like this before, but all my attempts are striking out. Any ideas on identifying this (or even anything really similar) would be immensely helpful.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/font_recognition_6234.gif"></div><p></p>
    <p>Thanks,<br>
    Jordan</p>
