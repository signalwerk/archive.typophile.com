    <p>Hi</p>
    <p>Trying to identify the typeface in this logo. I need to recreate it for my client as a vector file. It was probably created late 80's early 90's in Australia. The closest I got was Hobo. I have used Indentifont and WhatTheFont to no avail.</p>
    <p>Can anyone help?</p>
