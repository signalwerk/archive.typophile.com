    html: |-
      <p>I think this was an old Letrasetfont called Herkules, based on an old Art Nouveau era typeface called Hercules. I think Dieter Steffmann at typOasis (Designer section) has a <a href="http://www.moorstation.org/typoasis/designers/steffmann/samples/h/herkules.htm" target="new" rel="nofollow">digital version</a> of it.</p>
      <p>- Mike Yanega</p>
