    <p>I saw this 'high contrast serif' font in a new glossy magazine.<br>
    After searching and searching (Bodoni's - Didoni - Annlie - Ambroise - Freight Big,...)<br>
    I gave up and turn myself to the experts!</p>
    <p>So if anyone has an idea what the name of this font might be,<br>
    I'm all ears! </p>
    <p>Thanks, A+</p>
