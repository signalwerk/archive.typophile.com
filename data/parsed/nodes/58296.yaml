      <p>It’s our quarterly alumni magazine. Usually around 64-72 pages; 75%-25% editorial/ad ratio; circulation about 180,000.</p>
      <p>Thanks Michael :) We’ve considered doing it in house, although I don’t think I would have the time necessary to spend on the redesign that it deserves. Plus, it’s always beneficial to have the perspective of someone from the outside. Third... I’m definitely no Pentagram!</p>
