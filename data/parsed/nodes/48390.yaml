      <p>Thanks for the replies Si.</p>
      <p>This software is aimed at professional users who should be pretty familiar with computers, so I guess most of them may have got used to reading text set in european fonts? I googled for some random Arabic website and went through their css files, turns out there aren't much difference in the choice of web fonts. Anyway I think you are right about avoiding Simplified Arabic.</p>
      <p>The software doesn't actually have a UI font, but lots of little images with text on them. It's a pain to edit them, really.</p>
