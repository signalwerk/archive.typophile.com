  html: |-
    <p>Hello,</p>
    <p>I'm working on an Arabic version of an English software, and I'm really confused as to what font to use as the default font for software interface.<br>
    Since this software will use the default system font (btw what's the default system font for Arabic Windows?) for input fields and dropdown lists and etc., I want to make sure the UI font doesn't look too different from the default system font. The UI font will be used at sizes between 14px to 30px. Also for English I was using Milo as the UI font.<br>
    I know similar questions have been brought up in the past, but I wasn't able to find an answer after reading all those posts.</p>
    <p>Right now I'm looking at Tahoma, but still undecided yet. I have also tried simplified arabic, but <a class="freelinking external" href="http://maricastudio.net/temp/2.png" rel="nofollow">the result</a> isn't very good (actually I think it looks terrible) to my eyes. But again I know nothing about Arabic, so forgive me if I sound ignorant.</p>
    <p>Marica</p>
