      <p>Windows uses Microsoft Sans Serif. Office uses Tahoma. </p>
      <p>Tahoma has the benefit of a true bold, scales better too. MicroSS only really works well at 8pt. </p>
      <p>Avoid Simplified Arabic. Might want to look at Arial and TNR. </p>
      <p>Preference amongst native readers is somewhat mixed, and depends on the language for some extent.   </p>
      <p>There are some good third party UI fonts. Might want to consider talking to Mamoun Sakkal, Monotype, Ascender or Bitstream. </p>
      <p>Cheers, Si</p>
