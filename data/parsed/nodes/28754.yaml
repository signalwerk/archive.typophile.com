      <p>Another good history book is Texts on Type, by Heller &amp; Meggs.<br>
      It comprises short articles by various luminaries, written throughout the 20th century, so it gets the reader close to original critical material, without having to do the research.<br>
      But it's only a paperback, and you can probably get it for $5 on the Net -- old books are so cheap now, the drag is paying for delivery, and waiting for it.</p>
