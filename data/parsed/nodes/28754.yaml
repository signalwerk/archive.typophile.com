    <p>Hello all,</p>
    <p>The executive director of my college wants to gift me some books in the return of the graphics work i did for the Admissions session this year. He asked me what kind of books i would like to buy. obviously i will ask for the typography books and I can order any three books of my choice. ( No price restrictions )</p>
    <p>Which are the three must have books for a typography student_?</p>
    <p>Thnaks!</p>
    <p>Satya_</p>
