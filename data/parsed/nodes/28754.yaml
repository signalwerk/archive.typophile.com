      <p>There is a newer Rookledge, published by Laurence King in the UK, but mostly with the same content. Although the reference methodology is still great, it doesn't necessarily help identify digital typefaces, or any font produced after about 1983.</p>
      <p>I would recommend <a href="http://www.amazon.com/Type-Typography-Phil-Baines/dp/0823055280/sr=8-1/qid=1160907395/ref=pd_bbs_sr_1/002-1701602-4475220?ie=UTF8" rel="nofollow">Baines and Haslam's Type and Typography</a> as a general primer.</p>
      <p>Neil Macmillan's <a href="http://www.amazon.com/-Z-Type-Designers-Neil-Macmillan/dp/0300111517/sr=1-2/qid=1160907559/ref=sr_1_2/002-1701602-4475220?ie=UTF8&amp;s=books" rel="nofollow">An A-Z of Type Designers</a> is also pretty interesting.</p>
      <p>Then, of course, there is also <a href="http://www.logofontandlettering.com/" rel="nofollow">The Logo Font and Lettering Bible by Leslie Carbarga</a> which you should at least check out...</p>
