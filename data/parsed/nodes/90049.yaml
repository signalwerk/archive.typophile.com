      <p>I disagree with a few of these.</p>
      <p>I don't think links need to be underlined; a second color is sufficient.</p>
      <p>I also almost never see a need to differentiate visited links. I don't do this when I design sites and it annoys me when other designers do. Except in rare situations, like long lists of nondescriptive links, I don't think there's any need for this.</p>
      <p>I <em>always</em> want links to open in new windows, at least links to external sites and documents. I am now in the habit of right-clicking on links so I can choose "open in new window." I want to be able to keep reading the page I'm on before taking a look at where I'm going.</p>
