    <p>This has been a long time coming. It’s old, but much of it still applies, and I am truly amazed at how people are still making the same mistakes we made a decade ago. Taken from <a href="http://www.useit.com/alertbox/designmistakes.html" rel="nofollow">Jakob Nielsen’s Alertbox, October 3, 2005: Top Ten Web Design Mistakes of 2005</a>.</p>
    <p>————<br>
    2. Non-Standard Links  Following are the five main guidelines for links:</p>
    <p>• Make obvious what’s clickable: for text links, use colored, underlined text (and don't underline non-link text).  </p>
    <p>• Differentiate visited and unvisited links.</p>
    <p>• Explain what users will find at the other end of the link, and include some of the key information-carrying terms in the anchor text itself to enhance scannability and search engine optimization (SEO). <strong>Don’t use “click here” or other non-descriptive link text</strong>.</p>
    <p>• Avoid JavaScript or other fancy techniques that break standard interaction techniques for dealing with links.</p>
    <p>In particular, don’t open pages in new windows (except for PDF files and such). Links are the Web's number one interaction element. Violating common expectations for how links work is a sure way to confuse and delay users, and might prevent them from being able to use your site.<br>
    ————</p>
    <p>For example, instead of linking “I just came across an interesting Kickstarter project. For more information, <a href="http://www.kickstarter.com/projects/2094022925/gremolata-and-cancellaresca-milanese" rel="nofollow">click here</a>” (which provides the user with no information as to where they are going to end up without additionally reading the words around the ambiguous word “here,” try:</p>
    <p>I was doing a bit of reading, and I came across <a href="http://www.kickstarter.com/projects/2094022925/gremolata-and-cancellaresca-milanese" rel="nofollow">an interesting Kickstarter project: Gremolata &amp; Cancellaresca Milanese</a>. A graphic design project in new York, NY, by Russell Maret.</p>
    <p>“<em>Those who cannot remember the past are condemned to repeat it</em>.”<br>
    ~ <a href="http://www.gutenberg.org/files/15000/15000-h/15000-h.htm" rel="nofollow">George Santayana. The Life of Reason</a>.</p>
