    html: |-
      <p>I agree with Joshua Langman and don't think the web is made for absolute rules of right and wrong. I still use a "click here" from time to time depending on the situation. I have a great client that's a rural telephone company that has customers just now experiencing email and web for the first time. While it may be understood that everyone knows how web links work, and that "click here" isn't necessary, that can be an erroneous assumption. The rules of right and wrong depend on the situation and the audience. That overt call to action is needed for that audience.</p>
      <p>I'm reminded of how when CSS came out and it was declared that tables were never to be used any more. I then got several Excel spreadsheets that had to be put on the web. It took me awhile to get the "no tables" thing out of my head and realize in this situation tables ruled.</p>
