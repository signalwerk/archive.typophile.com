      <p>I like the idea of the folding (and cut) card, because it plays well with the overall theme, but agree with James about the inconsistency of the 3D letters in black&amp;white (and about removing http, etc.).<br>
      It’s not clear how the card would look when it’s folded, and I think you could play more with it, maybe making the inside area coloured, so that the card will look mostly white when folded, then a big brightly coloured square would appear when it’s opened.<br>
      To clear things up, other than what James already suggested, I think you should get rid of the “build” in 3D (the coloured squares at the bottom already give the same message), then place the four slogans more loosely, and without the grey squares (instead, you could make them play with the coloured ones).<br>
      Also, you don’t need to repeat the logo (especially because, when small, the “Play-Skool” become unreadable).<br>
      Speaking of the logo, I’m not sure why “Play-S” is in bold and “kool” isn’t, and the orange and red squares could be seen as flying away from the “P” rather than building it.</p>
