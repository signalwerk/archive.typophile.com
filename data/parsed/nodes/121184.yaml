      <p>What's the purpose of having it fold? You end up with 4 panels instead of 2, and some of the info is hidden when the card is folded.</p>
      <p>Most business cards have all the vital info on one side, but yours has important info on both sides, which could be a problem if the card is attached to something (hung on a refrigerator, taped to a card in a Rolodex, etc).</p>
      <p>You might consider deleting "http://"  in several places. Printed URLs are usually shortened these days (apple.com, amazon.com, etc).</p>
