      <p>Don't any of you have an issue with all major software from one company? I do. Competition is good. If you hate QuarkXpress, so be it, but you should hope that they make a great product to keep Adobe honest. Seriously, do you think Illustrator is going to be updated in any significant way, since Freehand is pretty much dead? If you think so, you don't see the market as it really is. What we need is a  third layout program that would bring massive innovation to the market. Imagine 3 companies combating for top dog? Free sidegrades, 2 million fonts (OOPS), upgrades as we breathe!</p>
      <p>I think Indesign does some nice things, but really when push comes to shove, you can do most anything in creative ways with either program. I love QuarkXpress, have been using it for nearly 18 years. I use Indesign/Illustrator at work(PC), but at home I use Quark/Freehand(Mac) and get more done at home.<br>
      The biggest fault of Indesign is the poorly thought out box scenario, it is too cumbersome to me. I like the Export to PDF, it is better than Quark there.<br>
      Also Adobe really won't tell us how large a user base they have, but I have worked in Digital print, Label and offset in the last 8 years and can tell you ID has very small market share, and I see much more Pagemaker files than ID files. Only Corel Draw has fewer users!:)</p>
      <p>Quark has one huge advantage, it is 13 years older than ID, we had 7 years of learning v3.3xx and more pages have been made in it than any other program. </p>
      <p>I think most people don't like the company and push against its venerable program. To be honest, I do not think much of Adobe or Quark, but I think it is good that they are both out there.</p>
      <p>Sincerely,<br>
      Rodrigue Planck</p>
      <p>The Truth shall set you free</p>
