      <p>As a recent graduate - my school decided to change from Quark to InDesign while I was in my second year (2004) of a four-year graphic design program. I had grown up using Quark in high school (basic newsletter stuff), at my co-op placement and in my first two years of university. I loved Quark - but was able to make the switch to Indesign without any problems.</p>
      <p>As a student - I couldn't afford to purchase Quark. I didn't know <em>one</em> student who had a legal version of the program. Once the Adobe Creative Suit came along... you could purchase all the programs you needed (Indesign, Photoshop, Illustrator) for around $800 CND. Compare this to Quark - something like $1,300? (I may be off - but it was more). On top of that - you <em>only</em> got Quark - you still needed to get Photoshop and illustrator.</p>
      <p>So, my entire class (and each class following) has made the switch to Indesign.</p>
      <p>Since I have graduated, I have worked at 3 different employers who use Quark. I am happy to do my work in Quark, but do all of my personal stuff in ID. The magazine I work for now is thinking of making the switch - since the costs and benefits of the Adobe CS outweigh the "loyalty" people have with Quark. Other major magazine publishers in Canada have already made the switch - including (if I’m not mistaken) Rogers, who publishes <em>Maclean’s Magazine.</em></p>
      <p>Yes, it's good to have competition. Yes, Quark <em>did</em> a good job. Yes, a majority of well-experienced designers still use it. Yes, printers still love it (but do any of them refuse PDFs? ). <em>Yes</em>, it will be around for a while longer... but unless something amazing comes along soon - I expect that Adobe CS will take over the market as soon as everyone still using OS9 (and are living off that Quark 4 license they purchased when it was new) decides that it's time to welcome themselves to 2006.</p>
      <p>The next generation of designers is on their way... and Quark missed the boat.</p>
