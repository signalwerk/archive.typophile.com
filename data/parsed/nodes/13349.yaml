      <p>I work in digital prepress, preparing people's files for printing. I would say 80% of the designer files coming in are still Quark Xpress. The rest are a mix of InDesign, CorelDraw, Word, Powerpoint, etc. InDesign is increasing slowly but steadily.</p>
      <p>I'm a long time Quark user who has to do various formatting projects. Starting to get to like Indesign now. Still feels a bit clunky and overloaded with not really needed features compared to Quark (sort of the same feeling comparing Corel Draw to Illustrator). I think Quark is the winner hands down for simplicity of the interface, and you can get very decent pdfs straight from quark. </p>
      <p>They are both good software.</p>
