      <p>None of the following should be taken as an official Adobe position, just my personal musings.  :)</p>
      <p>"Seriously, do you think Illustrator is going to be updated in any significant way, since Freehand is pretty much dead?"</p>
      <p>Sure. Can you say "Photoshop"? Seriously, even if one granted the assumption that Adobe has no competitors in the drawing program market, that just means that we'd have to compete with our previous versions to keep on getting upgrade revenue.</p>
      <p>That being said, I agree that competition is good and healthy.</p>
      <p>"Adobe really won’t tell us how large a user base they have, but I have worked in Digital print, Label and offset in the last 8 years and can tell you ID has very small market share, and I see much more Pagemaker files than ID files. Only Corel Draw has fewer users!:)"</p>
      <p>Well, certainly InDesign didn't have a lot of users eight years ago.  :)</p>
      <p>My understanding is that today the majority of both magazines and newspapers in both the UK and Australia are produced with InDesign. The lists in the USA are getting pretty impressive, but I haven't heard anybody try to tote up the totals lately.</p>
      <p>"Quark has one huge advantage, it is 13 years older than ID...."</p>
      <p>Quark certainly has a large installed base, and a long history. But trying to do radical change on an existing ancient piece of software is very difficult indeed - age is not your friend here. There are strong reasons, which would apply to most any program, that the Aldus-and-later-Adobe folks started working on a new codebase (which eventually became InDesign) instead of continuing to extend PageMaker indefinitely. It will be interesting to see how successful QXP 7 is in terms of stability and bugginess. Good luck to them and their users.</p>
      <p>Regards,</p>
      <p>T</p>
