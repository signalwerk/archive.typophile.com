      <p>It seems to be unianimous already...but I firmly agree with all previous statements. I use Quark XPress daily at work, but only use InDesign at home. It works so much better, its a lot more intuitive...and so far it has never crashed on me. Here at my office everyone I work with has had Quark problems. It constantly crashes and is very buggy. Its not unusual for me to have to close the program and restart it because it isn't rendering properly.</p>
      <p>BTW, Quark files can be opened in InDesign. InDesign also has more "undos". Quark didn't even start having "undo" until 6 came out. Quark also seems paranoid about software theft requiring a seperate installation and password for every individual workstation.</p>
      <p>Why not just switch to the company that uses all the programs you use in page layout programs anyway? You can place native Adobe files in InDesign. I also don't work for Adobe. :)</p>
