    html: <p>It reminds me of <a href="http://www.fontpoint.com/freefont/koshgarian-light.htm">Koshgarian</a> but thicker. <br> <br>I got this font on a 5 1/4" diskette with a few others on my first Win 3.1 system back in 1993 or so. As far as I can remember, the booklet that came with the font package said it was based on the design for the Pepsi logo (maybe designed by the same person?). <br> <br>I cannot verify whether or not this font is a rip-off of a real font or not (I seem to remember that the diskette also included fonts called "Futuri" and "Cabel"). <br> <br> - Lex</p>
    html_clean: <p>It reminds me of <a href="http://www.fontpoint.com/freefont/koshgarian-light.htm" class="link-external">Koshgarian</a> but thicker. <br> <br>I got this font on a 5 1/4" diskette with a few others on my first Win 3.1 system back in 1993 or so. As far as I can remember, the booklet that came with the font package said it was based on the design for the Pepsi logo (maybe designed by the same person?). <br> <br>I cannot verify whether or not this font is a rip-off of a real font or not (I seem to remember that the diskette also included fonts called "Futuri" and "Cabel"). <br> <br> - Lex</p>
