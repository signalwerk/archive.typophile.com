    <p>In <a class="freelinking-external" href="http://typophile.com/node/42586">this thread</a> Carl mentions that “<cite>Auto looks a little like Chaparral Sans</cite>.”</p>
    <p>That has me wondering, what other combinations of typefaces have you seen that seem to match, but probably never would have made the connection?</p>
    <p>For me, it’s the uncanny match of Univers and Utopia. When set at corresponding type sizes, they seem to be like brothers to me. (You think Slimbach had that in mind?)</p>
