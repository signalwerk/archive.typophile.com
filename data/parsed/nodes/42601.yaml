      <p>This isn’t surprising or odd, but given how both families were set up with display and text variants already, it’s interesting: Kepler works as a display companion amazingly well with Utopia. If Kepler in text is too florid for you, use Utopia.</p>
      <p>I actually think Veronika Burian’s Karmina works better as a companion to Meta than Meta Serif. Is that blasphemy?  ;)</p>
