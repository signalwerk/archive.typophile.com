    html: <p>Hah! Funny you should say that. I was just testing <a href="http://www.fontshop.com/fonts/downloads/typetogether/karmina_bundle/">Karmina on FontShop.com</a> this week and noticed some similarities to Meta Serif. They certainly have a similar structure. Karmina doesn’t pair better with Meta if you really use them side by side in a layout, but I share your love for it. I set the text of <a href="/wiki/Interrobang" class="wiki">Interrobang</a> 5 in Karmina and found it a pleasure to use.</p>
