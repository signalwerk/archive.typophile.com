      <p><em>does anybody has ANY idea where i can get a set of those? or places where i could search? or even just if there was a special name for them?</em></p>
      <p>As I wrote earlier, they were rubber stamps or made from a composite material, sold under various trade names. One company in Germany was called Neoprint by Gröner GmbH. They made sets in Plakadur and rubber, but i haven't seen them used since the 1980s. They're not made anymore, but – like everything else – probably available on eBay et al.</p>
