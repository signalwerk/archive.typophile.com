      <p>i found the following spread in an undated bauer specimen book. ("Hauptprobe: unsere Schriftgiesserei- und Messing-Erzeugnisse: Fabriken in Stuttgart, Berlin SW, Wien, St. Petersburg und Moskau / Bauer &amp; Co., Stuttgart"). at the bottom left it reads "To highlight passages you can use Accidenz-Grotesk on the right side (Page 353). Both typefaces have "the same line"". yes, they say "have the same line".</p>
      <p>the cover of the book is Bauer only (a great embossement), but inside there is the H. Berthold AG note on the bottom of every page. whats the ca. date of this? the library couldnt date it.</p>
