      <p><cite>can we have a close-up please?</cite></p>
      <p>This is another interesting thing. They used to have trendy Art Nouveau/Jugend versions of the grotesks. Switch those characters and the typeface turns into "Botha". Sample from the next spread:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Botha.png"></div><p></p>
      <p>Schelter &amp; Giesecke went further with "Columbus":<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Columbus.png"></div><p></p>
      <p>Those Swiss boys must have shaken their heads.</p>
      <p><cite>Standard</cite></p>
      <p>My Standard "specimen no 539 A" reads "made in Germany by Berthold type foundry... Imported and distributed by Amsterdam continental types and graphic equipment inc." I Can't find the year of printing, which is a common problem with type specimens. I believe its from the fifties.</p>
      <p>Timo</p>
