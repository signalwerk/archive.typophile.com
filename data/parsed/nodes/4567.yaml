    html: <p>In my opinion, we could talk about two diﬀerent approaches to the grotesque, one developed mainly in the <span class="caps">UK</span> and <span class="caps">USA</span>, and the other in Germany, that follow diﬀerent lines. <br><br>As I see it, the ﬁrst develops in the <span class="caps">UK</span> from the Caslon breakthrough, and represents the modulated, less geometrical approach, that has in Franklin Gothic its paradigm. The tipology of this line remains ﬁxed through time. Thus Trade Gothic (1948) and News Gothic (1908) belong to the same formal category.  <br><br>The German grotesques of the <span class="caps">XIX</span> century, like Akzidenz Grotesk, tend to geometry and monoline anatomy, and a more systematic development of the range of weights. I think this ascetic approach ﬁtted more the rationalist modern spirit of the <span class="caps">XX</span> century typographic avant-gardes. Thus, this grotesque tipology evolved  in time into neogrotesque (Helvetica, 1957), by absorbing the inﬂuences of the technical and aesthetical  proposals of those avant-gardes. <br><br>Of course, this comparison has nothing to do with a value judgement, in terms of one being “better” than the other in any&nbsp;way.</p>
