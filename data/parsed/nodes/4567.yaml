      Nach der Übernahme der Haas'schen Schriftgießerei durch die D.Stempel AG, Frankfurt am Main wurde die Schrift dort unter dem Namen Helvetica ins Programm genommen und gleichzeitig im Jahr 1961 um die vielen anderen Schnitte erweitert und zwar parallel in Frankfurt am Main und in Münchenstein, Schweiz.<br></cite></p>
