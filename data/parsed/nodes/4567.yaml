    html: |-
      <p><em>Gerstner program was released by Berthold for Diatype, I guess in 1957 after Univers, Before Helvetica... </em><br>
      It certainly wasn't. Diatype was still being developed then. The first usable machines came onto the market in 1961. Gerstner Programm was designed in 1967.</p>
      <p><em>Where these stamps came from? Berthold? Linotype?</em><br>
      These are obviously rubber stamps, set into a composing stick-type-of-device after the individual letters had been stamped onto the ink pad. The whole stick with the rubber letters inside it was then turned around and pressed onto paper or any other material. The sample says "Lettering for windows, displays, exhibitions, shops". </p>
      <p>There was another material, called Plakadur, Plakat being the German word for poster. It was a wood/plastic composite that Berthold made its larger "wood" type from. They had a beautiful, fairly light cut of Akzidenz Grotesk Medium which was used for showcard printing machines. They were produced by a small company and sold to department stores for printing large labels, showcards, price cards. Essentially, you placed the type into the bed of the machine, inked it, put the paper on top of the type and ran a pressure roller over it, like a small proofing press. Apart from AG Medium, the had other Berthold faces, e.g. Herold, Block Condensed and Fanfare (by Louis Oppenheim, the Lo-Schrift – now LoType – designer).</p>
    html_clean: |-
