    html: '<p>&gt;the Caslon sans of the 1820s, so praised for its early appearance, has no real relevance. <br><br>Huh? The guy invents a major genre and it’s irrelevant?! The sans is present in the specimen books of <span class="caps">UK</span> typefounders (I’m not familiar with other countries, but I would imagine the same situation) from the 1830s, and in steady use, especially advertising, subsequently. <br><br>Caslon’s sans had a very geometric quality — circular Os and straight-legged R etc. Figgins sans’s of the 1830s show an indecision between geometric and grotesque qualities, with versions at diﬀerent sizes leaning one way or the other. <br><br>Those earliest sans were Bold and Caps only, and appear to have been used mainly for contrast, in text work. The most popular early sans was probably the Bold Condensed style, used in a range of sizes, particularly in commercial jobbing. Regular weight sans faces were used in the 1840s. <br><br>I suspect that the introduction of lower case to the sans genre pushed it in a grotesque direction, as the world was not ready for a geometric lower case at that time (the 3rd quarter of the 19thC), when the radical tone of the early century had become more conservative. <br><br><span class="caps">AG</span> is well-known for the logic of its systematic family, and it is tempting to equate this modernist idea with the sans genre — however, almost no-one used sans faces for text in 1900. In fact it was the massively popular Cheltenham that lead the way in being a face with a large family that you could set an entire job in: heads, decks, subheads, and&nbsp;text.</p>'
    html_clean: '<p>&gt;the Caslon sans of the 1820s, so praised for its early appearance, has no real relevance. <br><br>Huh? The guy invents a major genre and it’s irrelevant?! The sans is present in the specimen books of <span class="caps">UK</span> typefounders (I’m not familiar with other countries, but I would imagine the same situation) from the 1830s, and in steady use, especially advertising, subsequently. <br><br>Caslon’s sans had a very geometric quality — circular Os and straight-legged R etc. Figgins sans’s of the 1830s show an indecision between geometric and grotesque qualities, with versions at diﬀerent sizes leaning one way or the other. <br><br>Those earliest sans were Bold and Caps only, and appear to have been used mainly for contrast, in text work. The most popular early sans was probably the Bold Condensed style, used in a range of sizes, particularly in commercial jobbing. Regular weight sans faces were used in the 1840s. <br><br>I suspect that the introduction of lower case to the sans genre pushed it in a grotesque direction, as the world was not ready for a geometric lower case at that time (the 3rd quarter of the 19thC), when the radical tone of the early century had become more conservative. <br><br><span class="caps">AG</span> is well-known for the logic of its systematic family, and it is tempting to equate this modernist idea with the sans genre — however, almost no-one used sans faces for text in 1900. In fact it was the massively popular Cheltenham that lead the way in being a face with a large family that you could set an entire job in: heads, decks, subheads, and&nbsp;text.</p>'
