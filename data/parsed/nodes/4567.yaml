    html: '<p>Royal Grotesk was made for sientiﬁc publications as text/body typeface round about 1880 by Ferd. Theinhardt Schriftgiesserei Berlin. <br><br>source: <a href="http://www.typolexikon.de/t/theinhardt-ferdinand.html" target="_blank">http://www.typolexikon.de/t/theinhardt-ferdinand.html</a> <br><br><img src="http://www.typophile.com/forums/messages/30/35003.gif" alt="Royal Grotesk hand setting version"><br><img src="http://www.typophile.com/forums/messages/30/35004.gif" alt="Royal Grotesk Monotype version"><br><br>Scan sources: specimen book from Haag Drugulin, Leipzig — edition 1936.  <br><span class="caps">BTW</span>. Haag Drugulin was well known for its collection of old, original type material. <br></p>'
