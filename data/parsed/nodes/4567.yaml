  html: <p>I am interested in the roots of Akzidenz Grotesk, a truly seminal typeface for the development of sanserif, considered anonymous by various sources. <br><br>According to typolexicon.de, the “Royal Grotesk”, by German typographer Ferdinand Theinhardt is its direct precursor. Do you know any publication or website where I could ﬁnd a specimen of this typeface?  <br><br>In broader terms, talking about the context in which it appeared, Robert Bringhurst in “The Elements of Typographic Style” relates it to the Realist movement in art. Do you know of any other source in which this is further discussed?  <br><br>Thanks a lot <br></p>
  html_clean: <p>I am interested in the roots of Akzidenz Grotesk, a truly seminal typeface for the development of sanserif, considered anonymous by various sources. <br><br>According to typolexicon.de, the “Royal Grotesk”, by German typographer Ferdinand Theinhardt is its direct precursor. Do you know any publication or website where I could ﬁnd a specimen of this typeface?  <br><br>In broader terms, talking about the context in which it appeared, Robert Bringhurst in “The Elements of Typographic Style” relates it to the Realist movement in art. Do you know of any other source in which this is further discussed?  <br><br>Thanks a lot <br></p>
