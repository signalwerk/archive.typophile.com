    html: <p>I had the pleasure of meeting and studying with Wolfgang Weingart in the mid 80s. He told me about discovering a few old, dusty, forgotten job cases of <span class="caps">AG</span> in the bowels of the type shop in Basel. He described how he had “awakened them from sleep” and began a long partnership with the fonts. You can see examples of his work with the quite extraordinary (and to my mind best) version of <span class="caps">AG</span> in his book “Weingart:&nbsp;Typgraphy</p>
