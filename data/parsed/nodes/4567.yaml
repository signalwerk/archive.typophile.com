    html: <p>Xurxo <br><br>One slight problem with the Caslon “breakthrough.” The type was shown on a specimen only as an information marker and not a face that was oﬀered for sale. It is thought by some historians to be a dead link. There are other earlier examples but they were seemingly only found in stone cutting. <br><br>More likely there was some form of interplay of inﬂuence between styles oﬀered from diﬀerent countries.  <br><br>For instance. The Americans who developed decorative wood type based it on British metal type imports which were in turn derived from French decorated typefaces and then Dutch, at about the turn of the century and very early 1900s. The popularity of American wood type in turn resulted in metal type foundries churning out a lot of similar decorated styles. <br><br>Sometimes the string of inﬂuence is just not a straight line. <br><br>Gerald</p>
