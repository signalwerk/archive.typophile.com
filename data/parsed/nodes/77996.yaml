    <p>Hello, I'm designing a catalog dedicated to artists, the so-called School of Paris<br>
    (A group of French and non-French artists working in Paris in the first half of the 20th century). I want to use as a basic sans serif font. But the classic French “national” sans, that I know - Antique Olive, created later and I have doubts about the propriety of its use. On the other hand confuses me too “German” origin of the majority of old sans-serif fonts.</p>
