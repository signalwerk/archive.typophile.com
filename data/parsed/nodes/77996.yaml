    html: |-
      <p>Colleagues, thank you for your comments. It was very helpful to me.<br>
      Apparently French typography was partly outside the context of European modernism.<br>
      Clarify. My book is relevant to the theme of "livre d'artiste" (from Bonnard to Buffet), which focuses on bibliophilic tradition of the 19th century, as well as English and German "private press" of the early 20th century.<br>
      In contrast, I would like to give a real historical background of this era (the revolutionary unrest in Europe and two world wars!).<br>
      I understand the idea of Nick Shinn.<br>
      Many thanks to Maxim Zhukov. Your links and pictures to help me in finding a solution.<br>
      Now. I am inspired by the work of 30-50's, which made for museums Max Bill for the Kunsthalle Basel (and other) and Willem Sandberg for Stedelijk Museum. They were contemporaries and friends many French artists. And they've done a lot of printed works for the exhibitions of these artists.</p>
      <p>P.S.<br>
      I apologize for my English. I rarely write in this language</p>
