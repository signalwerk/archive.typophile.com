    <p>Hi All!</p>
    <p>Haven't dived into making your own fonts yet? Want to learn to make fonts with FontLab in a casual, fun atmosphere? Then, come join us for GRPH 152 Digital Font Creation in the Graphic Communications Department at CCSF.</p>
    <p>NITTY-GRITTY CLASS INFO</p>
    <p>GRPH 152 Digital Font Creation<br>
    8 Monday Evenings: 1/29, 2/12, 2/26, 3/12, 3/26, 4/9, 4/23, 5/7<br>
    CCSF Ocean Campus, Visual Arts room 105, 6-10pm<br>
    Prereq: GRPH 25 Intro to Mac Graphics, or equivalent<br>
    Instructor: Amy Conger, <a href="mailto:aconger@ccsf.edu">aconger@ccsf.edu</a><br>
    CRN: 38026, 1 unit</p>
    <p>OVERVIEW</p>
    <p>This is an intro class to making fonts in Fontlab Studio 5 for Macintosh, in practice and in context. </p>
    <p>Whether you want to make a ton of fonts or you just want to get more intimate with the ones that exist, you'll find we cover a lot of interesting topics like these:<br>
    * Altering existing fonts in Fontlab<br>
    * Drawing letterforms in Fontlab<br>
    * Importing letterforms from raster and vector drawings<br>
    * Automating accented characters in Fontlab<br>
    * Building Kerning pairs into a font<br>
    * Avoiding common font snafus<br>
    * Pixel Fonts<br>
    * A quick survey of the history of type design tech<br>
    * Font files and management<br>
    * The state of the industry, inc. licensing and sales<br>
    * Specimens and critique</p>
    <p>You will come away with a font of your own design and some basic skills in FontLab Studio 5 and ScanFont.</p>
    <p>TEXTBOOKS</p>
    <p>The required textbook is "Learn FontLab Fast" by Leslie Cabarga. It is available here: <a href="http://www.logofontandlettering.com/" title="http://www.logofontandlettering.com/">http://www.logofontandlettering.com/</a></p>
    <p>The optional textbook is "Designing Type" by Karen Cheng (ISBN 0300111509), available online.</p>
    <p>You may also want to have a copy of the FontLab and ScanFont manuals. Those are available as PDFs respectively here: <a href="http://www.font.to/downloads/FLS5MacManual.zip" title="http://www.font.to/downloads/FLS5MacManual.zip">http://www.font.to/downloads/FLS5MacManual.zip</a><br>
    and here: <a href="http://www.pyrus.com/downloads/SF4MacDoc.pdf" title="http://www.pyrus.com/downloads/SF4MacDoc.pdf">http://www.pyrus.com/downloads/SF4MacDoc.pdf</a><br>
    And you can also optionally purchase a printed version through me in class. (It should run around $20)</p>
    <p>REGISTERING</p>
    <p>- Everyone with a little Mac skill is welcome!</p>
    <p>- The class will be available for web and in-classregistration.</p>
    <p>- If you do not have the pre-req, add the class then email me.</p>
    <p>- You may also add the class on the first day (provided you are enrolled in the college).</p>
    <p>- If you are not enrolled in the college, please go register in the credit division:<br>
      <a href="http://www.ccsf.edu/Offices/Matriculation/step1.htm" title="http://www.ccsf.edu/Offices/Matriculation/step1.htm">http://www.ccsf.edu/Offices/Matriculation/step1.htm</a></p>
    <p>- The class itself is $26; registration fees are about another $20.</p>
    <p>GRADING &amp; ATTENDANCE</p>
    <p>- This class is available for Credit/No Credit grading if you are not applying this class toward a degree or certificate.</p>
    <p>- If you cannot attend in person, you may join the independent study group that I will support from a distance. Please talk to me if you are interested.</p>
    <p>THANKS!</p>
    <p>I look forward to seeing you all in class! Please write with questions.</p>
    <p>Amy Conger<br>
    Instructor<br>
    Graphic Communications<br>
    City College of San Francisco<br>
    415-452-5229<br>
    <a href="mailto:aconger@ccsf.edu">aconger@ccsf.edu</a></p>
    <p>...my free font site: <a href="http://www.abecedarienne.com" title="http://www.abecedarienne.com">http://www.abecedarienne.com</a></p>
