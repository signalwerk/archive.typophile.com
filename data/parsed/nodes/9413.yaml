  html: <p>Hi, <br> <br>I've been looking for this font the past few days.  The closest I've gotten is Rockwell, Memphis, Lubalin Graph, and that one Geometric font, but they're not exact matches.  Observe the double-story lc a, the lc y, and many of the other glyphs have a "softer" feel to them than the "square" slabs I listed. <br> <br>Thanks for the help! <br> <br><img src="http://www.typophile.com/forums/messages/83/66021.gif" alt="slab serif"></p>
