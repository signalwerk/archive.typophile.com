    <p>Can anyone tell me what font is used for the Woodbridge logo (the part of this label that says "Woodbridge")?</p>
    <p>I'm also wondering what font is used for "Robert Mondavi" and "Chardonnay" (I think they are in the same font).</p>
    <p>Also, any suggestions for something similar if the fonts are customized.</p>
    <p>Thanks!<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/woodbridge_5544.jpg"></div><p></p>
