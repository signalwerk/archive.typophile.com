      <p>The characters you added might be affecting either the vertical bounds or the hinting. If it's the former, try making the leading in Photoshop constant (although there are more robust -but trickier- fixes that can be done within FontLab); if it's the latter make sure you're not doing some auto-hinting before export (or just turn the hinting off).</p>
      <p>hhp</p>
