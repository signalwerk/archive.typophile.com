    html: <p>If you are making a font and testing its quality in Photoshop, you're doing the wrong thing. Photoshop was never intended to be used for typesetting. Use a page layout program such as InDesign or an illustration program such as Illustrator to test your fonts; they don't rasterize the type.</p>
