      <p>@jum: note that the window you are showing us is your preferences for opening ttf fonts, not generating them. In order to turn off autohinting when generating a font, go down a few options to "Generating OpenType &amp; TrueType",<br>
      to the subcategory "TrueType/OpenType TT", and uncheck the export hinted  TrueType fonts" box.</p>
      <p>Sorry if this is restating something you've already figured out.</p>
      <p>Jason C</p>
