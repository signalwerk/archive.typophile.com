    <p>Hi there, </p>
    <p>I’ve experience a quite fuzzy thing: Exporting a font two times from <em>FontLab</em>, no known changes in the output settings.<br>
    The 1. font is the red text below, the 2. is the white text.<br>
    The only thing that was changed in between the 2. font-exports was the numbers (<strong>0 – 9</strong>) and the punctuation (<strong>,.;!?“”</strong>…) not displayed here. </p>
    <p>It appears to be that now the Bitmaps are not the same anymore (especially the horizontal stems in <strong>a, e, s</strong> and <strong>h</strong> in the attached 300% example).<br>
    <em>Anti-aliasing method</em> is set to <em>sharp</em> in <em>Photoshop</em>, but this it seems has nothing to do with the different jittering in the result. </p>
    <p>Any help or hint is highly appreciated!</p>
