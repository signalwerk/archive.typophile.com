    <p>Hi,</p>
    <p>I am looking for a design forum about “client management”. I read too many forums about formal aspect of design and how things should look. It’s often a good read, like many of the topics about typography on this forum. But being right or let’s say —educated— about design doesn’t mean that you can sell your “educated design” to your clients. I often find myself struggling to explain to my clients why I think their brochure should be designed one way instead of another.<br>
    Any suggestion?</p>
    <p>Cheers </p>
    <p>Seb</p>
