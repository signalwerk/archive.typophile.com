    html: <p>I guess it depends on what you consider "pro." A pro law firm? No. Design? Why not? Certain professions have more leeway. Whether or not it looks like pro design is rather subjective. I like the big red area, one of the reasons being that it reduces the amount of usable space on the page, making correspondence shorter (hopefully) and more efficient (hopefully) as well as making the copy look less deserted on the page. I also prefer business cards to be one sided, but that may be due to me being a simpleton.</p>
