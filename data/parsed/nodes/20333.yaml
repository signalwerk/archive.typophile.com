    <p>Hi,<br>
    This is my first time here.<br>
    I have just jumped ship to a tabloid format newspaper that uses serif typefaces for its headlines (Centennial).<br>
    I have only used san serif fonts for headlines in the past.<br>
    Are there any tips or tricks that I need to know when putting together page designs with serif headlines, or is it simply a case that the standard rules used for headlines (san serif or otherwise) will continue to serve me just as well?<br>
    Cheers all in advance for your help.</p>
