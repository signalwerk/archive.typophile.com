    <p>I have designed a business card for myself and I would like some feedback. It is still in the sketch phase (everything could be changed). I like the typeface on the front and back. It has been made on a letterpress. The paper is not good to print on. Maybe it looks a bit old fashion, but I think it is suitable for a letterpress printer</p>
    <p>I am not sure if the ’CANUS’ should be more in the middle or more near the toward the upper-side of the card?</p>
    <p>Do you have difficulty understanding the  e-mail and web-site address?</p>
    <p>I knowthat in the first line on the back-side the ’SS’ spacing in PRESS need to be changed and the ’l’ directly after the ’PRESS’ is not a good idea.</p>
    <p>Thanks, Terence</p>
