      <p>If, on the front of the card, you have only the word CANUS printed in caps, why not only capitalize CANUS in the first 2 lines across the back? That way you would avoid both the gap between the 2 currently capitalized words (which is drawing too much attention) and the issue with the Sl combination.</p>
      <p>I’m assuming you’re aware of the spacing issue after the (0) in the phone number.</p>
