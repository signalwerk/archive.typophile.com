    <p>Writing for the majority on the US Supreme Court, Justice David H. Souter said "We hold that one who distributes a device with the object of promoting its use to infringe copyright, as shown by the clear expression or other affirmative steps taken to foster infringement, is liable for the resulting acts of infringement by third parties."</p>
    <p>Consider, then, this proposition: "We hold that one who distributes a device with the object of promoting its use to take human life, as shown by the clear expression or other affirmative steps taken to foster such takings, is liable for the resulting acts of life-taking by third parties."</p>
    <p>Are gun manufacturers any less liable for what purchasers of guns do with their products than file-sharing services are for what their users do with their services? Or have we reached the point where, finally, we can openly admit that our society values song copyrights more than it values human lives?  Discuss...</p>
  html_clean: |-
