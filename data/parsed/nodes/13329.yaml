      <p>Joe,</p>
      <p>Please: this is <em>not</em> a Second-Amendment issue. The original proposal never suggested taking guns away from people: it simply asked if gunmakers ought not be held to the same standards of accountability as software makers, <em>if their products are misused</em>. And, no, gunmakers don't promote their products as killing machines – their lawyers would never let them. But if you visit any number of gun review sites (which I did out of curiosity), there are a boatload of folks out there who will gladly tell you just how effective this model or that model is in blowing someone away.</p>
      <p>And, in the unlikely event that gunmakers <em>were</em> ever to be held accountable for the lives their products took or ruined, such liability would be probably handled as a civil matter, so the gunmakers would do what the tobacco companies have done – pay big fines, then raise their prices to make their consumers pick up the costs. Then, it wouldn't be only outlaws who had guns: it would be only rich guys who had guns.</p>
      <p>Finally, let's put the Second Amendment in perspective. The American Revolution was an <em>armed rebellion</em> against what a significant-enough majority of colonists considered to be tyrannical rule. Thus, the framers of the Bill of Rights wanted to ensure that citizens would not be deprived of the ability of unseating any future tyranny, should the need arise. But do you seriously think for one minute that, in today's world, if a sufficiently widespread movement sprung up to unseat the US government by force of arms, that the Second Amendment wouldn't be the <em>first</em> Constitutional right to be suspended? Food for thought...</p>
