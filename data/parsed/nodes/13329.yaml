      <p>Joe,  I suppose the article goes to prove that, for all the benefits of our too-much-information age, there are downsides as well. Two things in Bram Cohen's favor: his story certainly has all the earmarks of <em>plausible deniability</em>, and context really <em>is </em>important.</p>
      <p>And, Tiff, I agree that a service provider who has been told that the service is being abused ought to take steps to end the abuse, and ought to be held accountable if they don't. Unfortunately, service providers generally get paid for providing their service, so they have an economic disincentive to drive customers off. Business is business, and I am afraid that the way you can induce a company to change the way they do business is to convince them that it will be more costly for them to continue their present course than to change it, and that's not always (or ever) easily accomplished.</p>
