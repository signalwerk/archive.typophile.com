      <p>Yeah, and everybody stop using GIFs. CompuServe is going to come after you. All of you!</p>
      <p>The funniest thing, to me, is how much old-school minds (in the entertainment industry) try to twist and contort everything around them to avoid the winds of change, instead of grabbing on to the tail of this ship that's riding the jet stream and profiting in a different way (like preventing their CDs from being copied to iPods). Young media companies/execs who aren't afraid of changing their business model will eventually stomp all over the old behemoths, if the behemoths don't start to integrate change.</p>
      <p>Whatever. Eventually it'll either A) change as a means of survival or B) become so draconian as to be ridiculous and then change anyway for pretty much the same reasons. The cat's out of the bag. To paraphrase something I once heard: trying to take something off of the internet is like trying take pee out of a pool.</p>
      <p>As for the gun thing, to sue the manufacturers you'd have to show that they intend for the weapon to be used illegally, and since wounding and killing isn't illegal, just murder and assault, you'd be hard pressed to make a case. It's got little to nothing to do with "personal responsibility" (a term that sounds great until you put it into practice, kind of like "corporate accountability"). It's about intent. You'd have to come up with internal documents akin to those used in the cases against the tobacco industry.</p>
