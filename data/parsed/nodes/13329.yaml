      <p><em>f the record companies truly believe in copyrights and licensing, why is it I have to pay $20 for a CD that I already have vinyl of? Shouldn’t the CD price be just a few bucks just to upgrade the media?</em></p>
      <p>record companies thought vinyl would essentially die out with the advent of the cd, and so re-released artists' entire back catalogues on cd to make some more money and revive flagging sales.</p>
      <p>the opposite seems to be happening now - vinyl is becoming trendy again, with picture disks, limited edition 7" (or 9" if you're 9inch nails) and back-catalogue items sitting on most large chain stores. and over here in the uk, it's often cheaper to buy the cd than the vinyl. for instance, at hmv one can purchase the cd of british sea power's "open season" fo 8.99, or the vinyl for 12.99.</p>
