      <p><em>That is why I think ISPs should be held responsible once informed of the illegal activity.</em></p>
      <p>The problem is what is 'illegal' is being vaguley defined much of the time in the realm of digital copyright issues. Most ISPs will, indeed, shut down any illegal going-ons. But, at the same time, they do have a right, and expectation, IMHO, to provide a level of privacy for their customers as well. Also, when the RIAA is out their making incredibly outrageous lawsuits, I can see why larger ISPs would be less inclined to take them seriously.</p>
