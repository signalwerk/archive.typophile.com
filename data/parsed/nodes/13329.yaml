      <p>Joe, it's interesting that you bring up the example of the woman and McDonald's, as it's one of the most common 'personal responsibility' horror storiest that gets trotted out on a regular basis, partially because it was trimmed down to its pop-culture news version in retelling and its use for political rhetoric.</p>
      <p>The <a href="https://web.archive.org/web/20150124161557/http://www.centerjd.org/free/mythbusters-free/MB_mcdonalds.htm" rel="nofollow">facts of the case can be found here</a>. She received 3rd degree burns over 16% of her body, burns which required "hospitalization for eight days, whirlpool treatment for debridement of her wounds, skin grafting, scarring, and disability for more than two years". McDonald's also admitted that "its coffee is 'not fit for consumption' when sold because it causes severe scalds if spilled or drunk".</p>
      <p>The case rested on the idea that A) McDonald's knew that it was selling a dangerously hot liquid that was far beyond the temperature required to be considered 'hot' to people who were driving B) made no move to warn them in spite of other consumers getting burned, and C) had no plans to change the sitution for the benefit of the public's safety. She wanted to settle for $20K, but McDonald's refused, and she ended up with a sum that was a far smaller % than the false $3 Million often repeated by tellers of the story.</p>
      <p>While one may still not agree with the ruling, the facts shed light on why this case was actually treated seriously by the court.</p>
