      <p>Futuristic fonts: ones that don't need hinting, because all media resolution will be so fine.<br>
      Ones that are financed by micro-payment.<br>
      Ones that are interactive with the reader.<br>
      Ones that are interactive with the environment.<br>
      Ones that support colour and tone.<br>
      Ones that are animated.</p>
      <p>Mostly this futurism is new technology, not much about the look.<br>
      But new technologies enable new looks.</p>
