    <p>Hi all,</p>
    <p>I've always been a big fan of the futuristic nasa/terminator styled type of fonts, with probably my all time favorite being WTF New Strike, which has become more main stream of late and I am now looking to find some new high end, high quality typefaces in this kind of style.</p>
    <p>Anything that gives a futuristic / technology feel.</p>
    <p>Unfortunately New Strike was created and held at <a href="https://web.archive.org/web/20150123064436/http://www.twice2.ch/news2.htm" title="http://www.twice2.ch/news2.htm">http://www.twice2.ch/news2.htm</a><br>
    but they no longer promote the fonts they created.</p>
    <p>Something similar to it is <a href="https://web.archive.org/web/20150123064436/http://www.dafont.com/font.php?file=sevil_alias_esra_li" title="http://www.dafont.com/font.php?file=sevil_alias_esra_li">http://www.dafont.com/font.php?file=sevil_alias_esra_li</a></p>
    <p>But obviously being a free font it doesn't quite have the quality finish that New Strike has.</p>
    <p>Any help would be great</p>
