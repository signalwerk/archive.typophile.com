      <p>Oh, right… I forgot I should've searched it beforehand. Sorry. Thanks, Nick!</p>
      <p>What's said on that other thread echoes what I already thought and concluded – that going for rough, wood-type-like stuff or even just roughly painted display letters is what's more usual, that it's a fact that there isn't a definite overall graphic identity in regards to roman type or even type in general, etc. –, but I was still looking for some opinions and ideas on this. For instance, I really don't know why, but to me Chaparral kind of suggests Africa, in a strange way, even though the name is spanish (the word actually also exists in portuguese) and the text accompanying the typeface suggests it's somehow inspired in an american landscape. I was looking/hoping for suggestions such as this one.</p>
