      <p>Hello Ruben,</p>
      <p>I think I get what your saying but at first glance and first read it looks like you may be stepping in a bit of a "minefield" since the topic of race and type and even steering the intended audience towards certain racial stereotypes by using certain typefaces can be a sticky and at time heated topic. See <a class="freelinking external" href="http://www.studio-gs.com/neuland.html" rel="nofollow">here</a> for some more info on what I am talking about.</p>
      <p>But to answer your questions:</p>
      <p>I'm thinking everyone might steer you towards any derivation of Koch's Neuland and then tell you about Twombly's Lithos, which in certain contexts can get the job done. They were not intentionally made to represent Africa or even the millions in the African Diaspora but these fonts have been firmly cemented in the minds of art directors and consumers alike as the ultimate in African typography. But this is almost like always using Costello's Papyrus to represent anything Egyptian. Aside from those options you may be able to find other stereotypical "African" fonts <a href="/wiki/www.design-africa.com" class="freelinking" rel="nofollow">here</a>. Though as a Ghanian-American designer, I don't really like fonts like the ones on the site I have led you to, I have to understand and recognize that they exist and address the fact that the "African" voice needs to be more developed in the type world.</p>
      <p>As for your question about successful/renowned African type designers...there are some but  not as many as there should be. Let's see:  Anton and Merle Scholtz from Scholtz fonts in Durban, South Africa, Andrew van der Merwe of Cape Town, Christine Voigts of Namibian/German descent, Saki Mafundikwa of the ZIVA Institute of Zimbabwe to name a few. Oh and I also forgot <a class="freelinking external" href="http://type.akofa.com" rel="nofollow">myself</a>...although I'm not world renowned yet I still am of African descent and make typefaces.</p>
      <p>@NickShinn - What's happenin' Nick!</p>
