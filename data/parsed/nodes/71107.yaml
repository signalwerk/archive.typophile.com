    <p>[Don't know if this should be posted here, but here goes.]</p>
    <p>I'm aware this might sound like an ignorant question, but work with me, here: are there any typefaces out there that look mozambican or are somewhat inspired by Mozambique? Maybe that doesn't actually exist; what about just generally african?<br>
    I mean something along the lines of: if you want your design to look english, you can go with Gill, maybe Caslon, Bulmer, Baskerville; if you want french, Didot, maybe something like some Auriol; german, fraktur blackletters or Bauhaus inspired stuff or something along those lines; italian, Bodoni or maybe Centaur. You know, I'm looking for the stereotypical typographic choices. Stereotypes might be bad and wrong, but they do have their uses. (In fact, I'd appreciate if you shared some more stereotypical type choices like those ones, I always find these interesting.)</p>
    <p>Again, I'm aware of what I'm saying here; I'm aware that Africa is a very culturally rich continent and that african countries are definitely not all the same and that having one typeface somehow “represent” an entire continent might be offensive and just plain wrong, let alone when we use typefaces to represent just one country, but still.</p>
    <p>Anyway, besides that, I'd like to know if there are any successful/renowned african type designers. I'd love to get to know typefaces coming from an entirely different culture and background with different influences, like that. Once more, I'd also appreciate and enjoy anything along those lines but coming from other continents (which will obviously also mean other alphabets and even other writing systems), but my focus here, right now, is Africa and, more specifically, Mozambique, and the roman alphabet.</p>
