      <p>Thank you very much, sasabonsam!</p>
      <p>I'm aware of all that, but I was looking to go beyond that and get to the point without being stuck on that. I'm not even thinking about race or anything, I really just wanted to know how I could evoke a certain country or continent in a subtle way. No one really needs to get it or to understand it; I'm sure most people don't get that some designers are evoking England with Gill Sans in their quietly designed tea package. It's just a matter of, on the one hand, having something to hold on to while choosing the typeface, and on the other, maybe somehow suggesting the atmosphere of the continent.</p>
