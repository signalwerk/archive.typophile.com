      <p>First off it's important to note that proper empirical testing of typeface performance remains elusive. So we don't really Know too much. But that doesn't relieve us of the need/benefits of <em>thinking</em>, and acting on our conclusions.</p>
      <p>Contrast: Do you mean a difference between thick and thin parts of letterforms? If so, it's treated (by designers who think straight :-) as its own thing, so others factors don't have to affect it, at least not one-directionally - it's more a matter of the various attributes being in balance.</p>
      <p>Flaring: I'm assuming you mean where the ends of "strokes" get thicker. Although serifs are agreed by most people as helping readability, and flares could be seen as "pseudo-serifs", I suspect most people incorporate flaring as a purely stylistic element, not a functional one.</p>
      <p>hhp</p>
