      <p>I have poor contrast sensitivity and read using a bold font, one with thick strokes, e.g., Arial Black.<br>
      Fonts with serifs tend to have thin strokes connecting the verticals and my eyes don't see them, leaving a forest of tree trunks with no branches, so I stick to fonts with uniform strokes as being of higher contrast throughout. </p>
      <p>On the other hand, when displaying copy in white on black, I use a font with thin strokes, the copy standing out and my eyes not being blinded by the blaze of white in a b/w display.</p>
