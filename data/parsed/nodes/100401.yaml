  html: <p>It seems to me that it's hard to find a sans-serif typeface that has anything other than identical or nearly-identical stroke weights throughout. I'm looking for something much more like a Didone, or at least a Garalde, in terms of stroke weight, but a sans-serif. Has anybody got any recommendations? Thanks!</p>
