    html: <p>These are great suggestions, but nothing's working for me yet. I need to match Adobe Jenson Pro alongside some ornamentation. So many of these have an Art Deco slant that will pull too much focus. The sans-serif part of this design is more of a subheader to the main title, which is in Jenson. Anyway, please keep ideas coming! Thanks! :-)</p>
