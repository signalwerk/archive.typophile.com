  date_raw: 8 Aug 2003 — 6:13pm
  votes: null
  html: <p>This typeface just grew out of some doodles I made on my scorepad while playing a card game called "kaiser". In my notebook, I've designed the whole thing, uppercase and lowercase, plus much of the cyrillic alphabet, which has been an interesting experience. Below is all I've had time to digitize so far.  <br> <br>So what is it? It's a bit of Bodoni, a bit of Dalliance, a bit of uncial, a bit of cursive, and some more geometric curves mixed in. I've tried to give the uppercase letters a strong capline and strong vertical strokes, while playing loose with the bottom and descenders. <br> <br>The S has been giving me some grief; I'm not quite sure what to do with it. Anyway, I welcome comments, and will hopefully have more coming soon. <br> <br><img src="http://www.typophile.com/forums/messages/29/13982.gif" alt="Kaiser"> <br> <br>Paul</p>
  html_clean: <p>This typeface just grew out of some doodles I made on my scorepad while playing a card game called "kaiser". In my notebook, I've designed the whole thing, uppercase and lowercase, plus much of the cyrillic alphabet, which has been an interesting experience. Below is all I've had time to digitize so far.  <br> <br>So what is it? It's a bit of Bodoni, a bit of Dalliance, a bit of uncial, a bit of cursive, and some more geometric curves mixed in. I've tried to give the uppercase letters a strong capline and strong vertical strokes, while playing loose with the bottom and descenders. <br> <br>The S has been giving me some grief; I'm not quite sure what to do with it. Anyway, I welcome comments, and will hopefully have more coming soon. <br> <br><img src="http://www.typophile.com/forums/messages/29/13982.gif" alt="Kaiser"> <br> <br>Paul</p>
