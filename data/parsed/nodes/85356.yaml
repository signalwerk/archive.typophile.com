      <p>Hm. Yeah, right now the wordspace is stripped out of input strings. There IS however a wordspace (nonbreaking space, actually) included in the "punctuation" set (between the endash and the underscore); would that do?</p>
      <p>Edit: An advantage of using a delimited list (be it by wordspace, or comma – I personally find wordspace more intuitive) is that it's possible to input multi-character entries, for instance HTML entities such as (drum roll) <em>&amp; nbsp ;</em> (in one word) for a nonbreaking space. :-)</p>
