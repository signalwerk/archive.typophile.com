    <p>Hello Typophiles,<br>
    I took a bit of time over the weekend to expand a couple of PHP scripts I made for my own development into a little online tool that might be useful to some:</p>
    <p><a href="http://ninastoessinger.com/stringmaker/" rel="nofollow">Stringmaker</a> is a simple online tool which can be used to quickly generate test strings of the following patterns:<br>
    nnnannn<br>
    nnnaxnnn<br>
    nnnaxannn<br>
    … which can be useful for spacing and kerning. The idea is to let the tool generate basic strings which can then be copy-pasted to InDesign or something and formatted as needed to test type designs in progress.</p>
    <p>For the variables "a" and "x" above you can choose between lowercase, uppercase, numerals, punctuation, or alternately input custom (wordspace-delimited) lists of characters. Like maybe "f"s and i-diacritics, or even non-Latin characters. There is a live pattern preview that should let you see what you're doing (requires JavaScript).</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/stringmaker-shot_6359.gif"></div><p></p>
    <p>I'm hoping that some of you find this useful, and if you think there's any fixes that would make it more so please let me know. I'm happy for feedback – it's all still very beta, and I'm really not all that much of a developer, so if something's broken please let me know.</p>
    <p>Cheers,<br>
    Nina</p>
