      <p>Kyle,<br>
      are you looking for written style manuals (guidelines) used by publications or more specifically format guidlines for magazine production? Many style guides focus on standards of writing instead of production. Here are a few:</p>
      <p><a href="http://www.economist.com/research/StyleGuide/" target="new" rel="nofollow">The Economist journalist style guide</a></p>
      <p><a href="http://www.bcbsnc.com/inside/style-guide/" target="new" rel="nofollow">Blue Cross Blue Shield of North Carolina Corporate Style Guide</a></p>
      <p>Links to <a href="http://tc.eserver.org/dir/Style-Guides&amp;skip=0" target="new" rel="nofollow">various sites using style guides</a> or information on starting a style guide.</p>
      <p>-------------------------------------------------<br>
      Yes, I'm old, but I'm back in style guides!</p>
