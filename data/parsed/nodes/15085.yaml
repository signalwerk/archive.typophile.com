    html: <p>I would imagine that most magazines would not make these guides public (somebody was paid a lot of $ to develop them). I don't know if you're designing a magazine, if so, go down to your local bookstore and purchase an armful of magazines and study the layouts, grids, etc. I am not suggesting plagarism, or copying, but studying and learning. There are also a number of good books out there on grids, and grid systems, but none that I know of that deal exclusively with magazines.</p>
