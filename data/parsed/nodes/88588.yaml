      <p>Kudos on the Galliard ID!</p>
      <p>As for the "USA" part, yes, the S threw me, especially the angle and length of the lower serif. I couldn't find a Garamond that contained it, and the ones that were close didn't contain that A.</p>
      <p>But of course that's because it's Galliard, too. The stamp has only one face. Galliard in metal looks a little different than the modern digital Galliard, especially because of the slight ink bleed and impression of real type, but if you take that into account the proportions of the S match, as does the peak of the A.</p>
      <p>I had thought it was maybe Plantin for most of it and some kind of Garamond for the "USA", but thanks to your correction I can see now that it's all Galliard.</p>
