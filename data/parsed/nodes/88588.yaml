    <p>So my friend and I have been working on identifying the typeface used on this lovely stamp, but I'm wondering whether "USA" is actually a different typeface from the rest of the stamp. I have my theories, but I thought I'd turn it into grist for the typophile mill.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Frilled-Dogwinkle-Stamp-1985-22-cents_3890.jpg"></div><p></p>
    <p>What do you think? One font or two, and which one(s)?</p>
