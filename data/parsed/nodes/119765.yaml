    html: |-
      <p>Bespoke lettering? Note in particular the reverse emphasis in _A_ which makes it harmonize better with the _V_ next to it.<br>
      Similar idea to Sweet Titling No. 22 <a href="http://www.myfonts.com/fonts/sweet/titling-no-22/" title="http://www.myfonts.com/fonts/sweet/titling-no-22/">http://www.myfonts.com/fonts/sweet/titling-no-22/</a> which has fewer lines. Also note a sans version with a similar number of lines in Atlas <a href="http://www.identifont.com/show?OCE" title="http://www.identifont.com/show?OCE">http://www.identifont.com/show?OCE</a><br>
      Don</p>
