      <p><cite>To me it is on the edge of irrelevant.</cite></p>
      <p>Given how strong the content in the New Yorker tends to be, I don’t see why the design being irrelevant is a problem. I feel like the primary motivation behind endless magazine redesigns is the Ray Gun effect: it doesn’t matter how stupid, wrong, or just plain bad the writing is, if you make a magazine look cool enough, someone will still buy it. </p>
      <p>Then again, sales of The Economist rose dramatically following Herr Spiekermann’s redesign, so maybe a redesign would get more people to read The New Yorker, and that’s only a bad thing if you’re a neoconservative. But the rise in sales of The Economist also occurred after 9/11, a time when the mainstream media really went down the toilet and people were really looking hard for a legitimate newsmagazine to replace Time, Newsweek, US News and World Report, and all the other magazines that went down the toilet in the last half-decade.</p>
      <p>But I digress.</p>
