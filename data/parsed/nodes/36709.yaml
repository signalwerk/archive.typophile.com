      <p>&gt;But that type ... it is too dated and looks more like a pastiche than a pedigree.</p>
      <p>There are two types here: the quirky art deco New Yorker display face, and Adobe Caslon--perhaps slightly reworked. </p>
      <p>The New Yorker has used both some version of Caslon and that display face since the beginning, and I don't imagine they are going to want to change that. The display face is a bit awkward, but gives a strong identity, and makes the magazine less ponderous. To get the same effect you'd need something good but a bit playful, and I don't know if it would end up better. </p>
      <p>Adobe Caslon is a fine typeface, but I don't think it fully captures readability and warmth of the metal Caslons. I've set out to do a better job of capturing those qualities, and before too long I hope the New Yorker has a superior alternative for its body text. Then you all can convince them that they need it :)</p>
