      <p>I think magazine design in general is very sensitive to trends that appear and disappear in very short periods of time (Fontblog brought the latest of these to my attention <a href="http://www.creativereview.co.uk/crblog/the-new-ugly/" title="http://www.creativereview.co.uk/crblog/the-new-ugly/">http://www.creativereview.co.uk/crblog/the-new-ugly/</a>). This is why magazines like the aforementioned Ray Gun become icons of an era, but look awfully dated for it... I guess that the style of The New Yorker works exactly because it has hardly changed over the decades. It's style may have been called Art Deco once, but now it has just become synonimous with The New Yorker &gt; It has become 'The New Yorker' style! I personally think it would be an unwise choice to make any radical changes to the design. This one calls for evolution rather than evolution, and besides that: I kinda like it for its awkwardness, its typeface and its illustrations... :&gt;) </p>
      <p>cheerio Queneau</p>
