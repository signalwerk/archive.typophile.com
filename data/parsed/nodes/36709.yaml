      <p><cite>...it seems so wrong for a magazine about a happening metropolitan center of culture.</cite></p>
      <p>But The New Yorker is not a happening magazine. It is, in many ways, old, stodgy, and self-important. There’s something about that solid old design that lends a great seriousness that few other magazines have, hearkening back to the days before celebrity magazine covers, when people actually read long magazine articles. Like the yellow edges of National Geographic covers, The New Yorker’s design reminds one of the magazine’s great heritage, and that they can still be considered a very legitimate source of information. I think that, in a time when some magazines redesign themselves almost every issue, it’s important to have a rock like The New Yorker around.</p>
