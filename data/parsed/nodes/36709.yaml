      <p><em>...in a time when some magazines redesign themselves almost every issue, it’s important to have a rock like The New Yorker around.</em></p>
      <p>Yep, that's what I meant about the mag being synonymous with New York itself. Still, I think the masthead is so well-established and recognized it could withstand a very restrained updating---just enough of a tweak to make it more contemporary and bring it into the present moment.</p>
      <p>You'd want to go about it very, very carefully. I'm thinking no changes to the type outlines at all, but possibly ink color and the manner in which the masthead is applied. Seeing it in black ink on their website it looks inextricably rooted in the early 20th century, yet the printed edition often uses white ink for the masthead.</p>
      <p>j a m e s</p>
