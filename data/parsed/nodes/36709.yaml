      <p>Raph, I don't think the Sabon works that well, though it works better than Adobe Caslon at that size would. (I don't have their proprietary Caslon to test of course.) My own small text size--based on Caslon's own Long Primer--works better to my eyes in setting the listings. </p>
      <p>The basic problem is that the ascenders and caps of Sabon are too tall to set solid well at 8 pt; when it is set solid at 8 pt, as the listings seem to be, the inter-line space gets messy. This is particularly because the listings are full of proper names--artists, venues, etc.--so there are many more caps than in ordinary text. </p>
      <p>As to why it was done, I don't have old pre-photo type copies, but I suspect (from memory) that they were done in Linotype Caslon Old Face. This had optical sizes--by point size--but I don't think the massive job of converting this family to photo type was ever undertaken. (The other likely suspect is Lanston Monotype's Caslon.) I don't know the photo era Caslons, but just guessing I would think that the New Yorker went through those years with one size of Caslon, and then digitized it. Mine will be the first, I think, to do optical sizes in a long while, though it will take a while to finish them if I keep posting to Typophile!</p>
    html_clean: |-
      <p>Raph, I don't think the Sabon works that well, though it works better than Adobe Caslon at that size would. (I don't have their proprietary Caslon to test of course.) My own small text size--based on Caslon's own Long Primer--works better to my eyes in setting the listings. </p>
      <p>The basic problem is that the ascenders and caps of Sabon are too tall to set solid well at 8 pt; when it is set solid at 8 pt, as the listings seem to be, the inter-line space gets messy. This is particularly because the listings are full of proper names--artists, venues, etc.--so there are many more caps than in ordinary text. </p>
      <p>As to why it was done, I don't have old pre-photo type copies, but I suspect (from memory) that they were done in Linotype Caslon Old Face. This had optical sizes--by point size--but I don't think the massive job of converting this family to photo type was ever undertaken. (The other likely suspect is Lanston Monotype's Caslon.) I don't know the photo era Caslons, but just guessing I would think that the New Yorker went through those years with one size of Caslon, and then digitized it. Mine will be the first, I think, to do optical sizes in a long while, though it will take a while to finish them if I keep posting to Typophile!</p>
