    <p>Is it just me or is the New Yorker magazine dying for a re-design? I understand the relevance of the type from a historical perspective, but man, it seems so wrong for a magazine about a happening metropolitan center of culture.</p>
    <p><a href="http://www.newyorker.com" title="http://www.newyorker.com">http://www.newyorker.com</a></p>
    <p>Anyone else have an opinion?</p>
