      <p>Showing my age, I have read the New Yorker for over half of its life span. It has significant identifying characteristics. Important among them is that type predominates in its design. In my opinion, it does so in the manner of the modernist aesthetic of transparency -- "The Crystal Goblet." I don't agree with the forementioned essay, but I do respect its consistent implementation over time. So, for me, The New Yorker dosen't look dated. It looks like the New Yorker.</p>
      <p>There have been many changes to the magazine over time. The introduction of a table of contents shocked me when it appeared during my high-school years. I was gratified to later learn that the TOC was added for the convenience of the magazines researchers, not its readers. In the 90's, change happened much more quickly. The arrival of Tina Brown brought introduction of photographs and of color, which, by the way, antedated the New York Times. Much more offensive, but essential to the survival of the magazine, was the first appearance of a special advertising section on the Bahamas circa 1992. I was annoyed enough to go the sophmoric expedient of removing the staples, mailing the offending section back to 45th street, and inclosing a note that said, "There seems to be some mistake. I found these pages in our magazine and thought you might want to know."</p>
      <p>Compared to Coca-Cola, The New Yorker has avoided commodification. However, its advertising department recently has begun trading on its identity as an institution. The most offensive aspect of the current magazine is its acceptance of advertisements that masquarade as New Yorker style drawings. Given that change I suspect that any redesign modifying the magazine's singular image would be antithetical to owners vision of the magazine's identity as saleable property.</p>
      <p>Holy Moholy Nagy, I've just talked myself into a redesign.</p>
