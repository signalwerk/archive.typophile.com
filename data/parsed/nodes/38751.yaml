    html: |-
      <p>I was bored of the most existing modern serif fonts. Most are a too clean and smooth. I just wanted to make a font that looks like done with hot type. With some mistakes in it, pulpy strokeendings and with an inconstant baseline. </p>
      <p>Most modern serif fonts like Bodoni and Didot looks a little bit too royal for my taste. Especially on the lowercase letters I tried to achieve a more friendly/naturally design.</p>
    html_clean: |-
