    html: |-
      <p>"rough modern serif" is really an oxymoron, since the point of modern typefaces is to be as clean, smooth and straightforward as possible.</p>
      <p>with that said, I think you've got an interesting idea, but it needs to be pushed further, I think your intention is getting lost and the mistakes really do just look like mistakes. you can keep the idea of "modernism" alive in your typeface if you do focus on clarity, making it clear to the viewer that you're intentionally breaking rules and stretching the limitations on other "royal" fonts.</p>
      <p>happy typeface-making!</p>
      <p>Niki</p>
