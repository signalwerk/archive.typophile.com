      <p>The SunDogs typeface seems a bit too techno. Soft rounded curves don’t say ’tough’ to me.</p>
      <p>Now <a href="http://new.myfonts.com/fonts/fontbureau/ironmonger/?testdrive=dock%3Dfalse%26size%3D66%26w%3D720%26src%3Dcustom%26text%3DTough%2520mother%26fg%3D000000%26bg%3Dffffff%26goodies%3Dfit%252Cot.liga%26seed%3D29">Ironmonger</a> is a symbol of toughness.</p>
      <p>Another would be <a href="http://new.myfonts.com/fonts/outras/force/?testdrive=dock%3Dfalse%26size%3D66%26w%3D720%26src%3Dcustom%26text%3DTough%2520mother%26fg%3D000000%26bg%3Dffffff%26goodies%3Dfit%252Cot.liga%26seed%3D20">Force</a></p>
      <p>If you don’t like the slab serifs you could try <a href="http://new.myfonts.com/fonts/typodermic/tank/?testdrive=dock%3Dfalse%26size%3D66%26w%3D720%26src%3Dcustom%26text%3DTough%2520mother%26fg%3D000000%26bg%3Dffffff%26goodies%3Dfit%252Cot.liga%26seed%3D23">Tank</a></p>
      <p>Search “construction” and “military” at MyFonts.com for a pile of options.</p>
