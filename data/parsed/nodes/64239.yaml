      <p><em>Soft rounded curves don’t say ’tough’ to me.</em></p>
      <p>Maybe I’m substituting one cliché for another, but I wonder.<br>
      How physical is construction these days?<br>
      Digging holes with a backhoe is sedentary work.<br>
      Power tools for everything.<br>
      It’s the dance moves that keep David Hodo (Village People) so trim :-)</p>
