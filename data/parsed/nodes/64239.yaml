  html: <p>Searching for a thick, bold and square font for a construction co that works with young people on major recreational projects.  I quite like this <a href="http://www.sundogtours.com/" title="http://www.sundogtours.com/">http://www.sundogtours.com/</a> to impart a cool yet strong feel.</p>
