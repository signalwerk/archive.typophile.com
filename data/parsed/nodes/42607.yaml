      <p>Not sure I follow. Are you setting up tables and then aligning them to the baseline grid? Or are you trying to set the baseline grid?</p>
      <p>If it’s to set the baseline grid, go to: Edit&gt;Preferences&gt;Grids. You’ll have inputs for where you want to Start/Offset the baseline grid and if it’s Relative to the Top of Page or the Top Margin, then you’ll get to set the Incrementation (you can input 12pts or whatever your leading is.) Honestly, I’m not sure what View Threshold is, but I have mine set for 100%. Turn Baseline Grids on View&gt;Grids &amp; Guides&gt;Show Baseline Grid</p>
