    <p>Hi I am relatively new to design and am looking at setting up a layout. I can get my baselines to sit on a top and bottom margin by calculation and leading. But then When I go to create guides in indesign and set the number of rows (NOT columns) to 8 the and I need a gap of 12pt (4.223) between the fields. The baseline and the gaps between the fields do not line up.</p>
    <p>I am aware that you need to calculate this properly to get it right but is there a tried and tested way of calculating this to get it right.Cam anyone help?</p>
    <p>Many Thanks</p>
    <p>James</p>
