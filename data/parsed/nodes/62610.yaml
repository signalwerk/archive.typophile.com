      <p>About a year ago there was a lot of discussion about the Typophile blogs of the graphic design students at Loyola New Orleans. One of the teachers was giving credit of some kind for posting images of New Orleans signs to Typophile blogs. </p>
      <p>Do a Typophile search for New Orleans signs and you'll find a trove of images of signs and lettering of all types from the NOLA area.</p>
