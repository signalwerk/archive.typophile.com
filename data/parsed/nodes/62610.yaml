      <p>If you haven't done it already, I'd say search for images of New Orleans signage (on Google for example) and see what inspires you. My first thought is fonts of the 1920s, seeing as N.O. if famously the home of Jazz and the 1920's being 'the jazz age' I'd say that's a good a starting point as any. For vintage fonts in general, you should really try <a href="http://www.letterheadfonts.com" title="www.letterheadfonts.com">www.letterheadfonts.com</a>. They also have a series of galleries, which may inspire you.<br>
      If you see a font in your search and want to know what it is, then come back with an image of it and I'm sure we can identify it (famous last words).</p>
      <p>JH</p>
