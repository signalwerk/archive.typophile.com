    <p>I'm working on a CD cover for a guy who does New Orleans-style music, as well as some Cajun and Zydeco stuff. I'd like to set his name in a typeface that says "New Orleans!" but I really have no ideas. Something a bit french-looking could work.</p>
    <p>It doesn't have to be serif or script (but I doubt there are any sans that would fit the bill) -- it just has to be appropriate to the city.</p>
    <p>thanks!</p>
