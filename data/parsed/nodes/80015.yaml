      <p>Looking at the pixels this gets me at 12 pt and 96 DPI (16 ppem), I find that this makes it very easy to hint.</p>
      <p><img src="http://www.beatstamm.com/Temp/AriallcmQuantizedOutline12pt96dpiBW.png"></p>
      <p>Essentially no hinting required. However, if I’d rather have 11 pt at 120 DPI (18 ppem), this gets me back to square one.</p>
      <p><img src="http://www.beatstamm.com/Temp/AriallcmQuantizedOutline11pt120dpiBW.png"></p>
      <p>Back to hinting.</p>
      <p>As mentioned before, if I were to use an integer multiple of 12 pt, say 24 pt at 96 DPI (32 ppem), the quantized outline would be again very easy to hint.</p>
      <p><img src="http://www.beatstamm.com/Temp/AriallcmQuantizedOutline24pt96dpiBW.png"></p>
      <p>I could repeat the above exercise with a lc ‘n,’ but even allowing for a different character width, this would get me substantially the same results.</p>
      <p>The point is that the character shapes on the golf ball type element of the Selectric typewriter are analog (even if the advance widths have been quantized to just a few), the ribbon that’s struck by the type element is analog, and the paper that holds the imprint of the ribbon is analog. No raster tragedies, no hinting required.</p>
      <p>Conversely, the screen is digital. Even the outlines that have been quantized as above get re-quantized (rasterized, or sampled), causing raster tragedies and requiring hinting.</p>
      <p>I could repeat the above exercise with any kind of anti-aliasing, with substantially the same results on the abstraction level of samples instead of pixels. But as illustrated in <a class="freelinking external" href="http://www.beatstamm.com/typography/RTRCh3.htm#Sec0" rel="nofollow">§3.0</a>, the raster tragedies don’t go away, they’re merely less obvious to see.</p>
