      <p>Have you read the <a href="http://www.microsoft.com/typography/otspec/gasp.htm" rel="nofollow">current gasp table spec</a>, Rich? You'll see in the example settings given that the same set of values is differently interpreted depending on the smoothing model used.</p>
      <p>Best practice for the gasp table is <em>always</em> font specific. This is the whole reason for there being a gasp table: one set of gridfitting/smoothing settings does not work appropriately well for all fonts, with stroke weight being a key factor in determining the best options.</p>
      <p>_____</p>
      <p>I was thinking a couple of days ago that the gasp table spec could be usefully extended to enable the font developer to specify whether and at what sizes subpixel positioning should be permitted in DWrite or other environments that use that technology. I'm working on some fonts that, at specific ppem sizes, are designed for advance widths to round to full pixel boundaries, with the intent that the outline edges maintain the same relationship to the pixel boundaries, ensuring consistent and appropriate stroke density. The trouble is that when these fonts appear in the same line of text as other fonts, the sub-pixel rounding of those other fonts throws off the positions of my outlines on the line, defeating the whole purpose. It would be great if I could use the gasp table to enforce rounding to full-pixel boundaries at these key sizes.</p>
    html_clean: |-
      <p>Have you read the <a href="http://www.microsoft.com/typography/otspec/gasp.htm" rel="nofollow">current gasp table spec</a>, Rich? You'll see in the example settings given that the same set of values is differently interpreted depending on the smoothing model used.</p>
