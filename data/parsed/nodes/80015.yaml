      <p>Quoting David: “I don' think the rasterizer is supposed to interpret anything at that size, it should obey the instructions. And the instructions in your example should be building a tidy O, shorter and narrower, or taller and wider, depending on the adjoining sizes. But that wasn't the point.”</p>
      <p>The part of the rasterizer that executes TrueType instructions is called “interpreter,” hence in this context “to interpret” means “to execute” (or, to use your words, “to obey”) the instructions. I gather this terminology may cause confusion, but that’s what’s used conventionally and actually. I’ll try to remember to use “to execute” henceforth.</p>
      <p>But, returning to the point I am making in <a class="freelinking external" href="http://www.beatstamm.com/typography/RTRCh3.htm#Sec30" rel="nofollow">§3.3.0</a>: The fallacy of the “you don’t need x-direction ‘hints’ in ClearType!” approach is that it causes seemingly unpredictable spacing issues. The following example, taken from <a class="freelinking external" href="http://www.beatstamm.com/typography/RTRCh3.htm#Sec30" rel="nofollow">§3.3.0</a>, rendered in ClearType, contains <em>no instructions in x-direction whatsoever,</em> hence there are no instructions for the rasterizer to execute, to obey, to disobey, or to “misinterpret.” Yet the spacing is off—off enough that even I can see it:</p>
      <p><img src="http://www.beatstamm.com/temp/ArialUCO12pt96DPICTwithoutX.png"></p>
      <p>However, <em>with instructions in x-direction</em> I can tackle the proportions, take the advance width as a “budget,” and allocate left and right side-bearing spaces in accordance with the design.</p>
      <p><img src="http://www.beatstamm.com/temp/ArialUCO12pt96DPICTwithX.png"></p>
      <p>I’m sure there are other strategies to allocate side-bearings and black-body-width, given the advance width (which I prioritized) and the proportions of the ‘O,’ and I’m open to suggestions, but the above is what I get following the aforementioned strategy. Notice that all strokes are rounded to the nearest 1/6 of a pixel, CVTs are used for all strokes and heights, but there are no deltas involved in the process.</p>
