      <p>This seems ironic or ignorant how Mike laments “a good bit of blur” in David’s example, because it has a little bit of gray on top of solid black bars, and then turns around to show us an example that has some of the worst displayable contrast and blur on the stems.</p>
      <p>First line of Mike’s example, first ‘R’ left stem: </p>
      <p><img src="http://www.beatstamm.com/Temp/FranklinGothic9pt96dpiDuggan.png"></p>
      <p>According to the W3C’s Web Content Accessibility Guidelines (<a class="freelinking external" href="http://www.w3.org/TR/2008/REC-WCAG20-20081211/" rel="nofollow">WCAG 2.0, §1.4.6</a>), on a scale of 1 to 21, with 1 being worst (gray on gray [sic]), and 21 being best (black on white), the combination of “royal blue” against “buttercup” yields a <strong><em>CONTRAST RATIO OF 1.33:1</em></strong>, which is marginally better than what you’d get for middle gray on middle gray.</p>
      <p>By contrast, for the same type size (9 pt at 96 DPI) in David’s example, top bar of the first ‘E’</p>
      <p><img src="http://www.beatstamm.com/Temp/FranklinGothic9pt96dpiBerlow.png"></p>
      <p>for the combination of “black” against “gainsboro” the W3C metric yields a <strong><em>CONTRAST RATIO OF 15.31:1</em></strong>.</p>
      <p>For reference, the WCAG 2.0 recommend a <strong><em>MINIMUM CONTRAST RATIO OF 7:1</em></strong> for type sizes below 18 pt and AAA Rating.</p>
      <p>I’d encourage everyone to draw their own conclusions. Mine are presented in <a class="freelinking external" href="http://www.beatstamm.com/typography/RTRCh6.htm#Sec1" rel="nofollow">§6.1</a> (end of <a class="freelinking external" href="http://www.beatstamm.com/typography/RTRCh6.htm#Sec11" rel="nofollow">§6.1.1</a> to beginning of <a class="freelinking external" href="http://www.beatstamm.com/typography/RTRCh6.htm#Sec13" rel="nofollow">§6.1.3</a>). In Mike’s example, there is simply more “color fringe” than “black core.”</p>
