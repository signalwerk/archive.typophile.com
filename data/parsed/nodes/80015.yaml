      <p>@John: I was struggling with the terminology given the relative generality of the word “contrast.” At the time, separating <em>rendering contrast</em> from <em>design contrast</em> is the best this engineer could come up with. But if <em>stroke density</em> is more common and less problematic than rendering contrast, I’ll be happy to revise the text.</p>
