      <p>There is indeed a lot more to it than CVTs and Links: Getting an intuitive understanding of the sampling process (“filling in the pixels”), realizing that the theory says this shouldn’t work (“wrong side of the <em>Nyquist Limit</em>”), seeing how type designers can craft rather legible bitmaps regardless of the theory (sharing an office with <em>Hans Ed. Meier</em> got me plenty of visual instruction), and finally bridging the gap between theory and practice by using a combination of typographic rules, math/geometry/logic, and software engineering.</p>
      <p>When I developed the font-scaler for my PhD project, attempting to bridge said gap, I thought of font-scaling as <em><a class="freelinking external" href="http://cajun.cs.nott.ac.uk/compsci/epo/papers/volume6/issue3/stamma.pdf" rel="nofollow">Dynamic Regularization of Intelligent Outline Fonts</a></em>, that is, the concept of constraining a single set of outlines to become progressively more regular as point size and device resolution decrease. Since then I have adapted this concept for use with anti-aliasing methods and for optimizing stroke rendering contrast (<a class="freelinking external" href="http://www.beatstamm.com/typography/RTRCh3.htm#Sec12" rel="nofollow">§3.1.2</a>) and bi-level pixel patterns (<a class="freelinking external" href="http://www.beatstamm.com/typography/RTRCh6.htm#Sec33" rel="nofollow">§6.3.3</a>). Importantly, I had to implement this concept in an obscure programming/assembly language called TrueType—not always an easy feat.</p>
      <p>Unfortunately I am not aware of a textbook specifically on TrueType coding. By the time I first got exposed to coding in TrueType, I didn’t seem to need one. I needed the TT specs for sure, initially learned by example, and later sometimes by stepping through the rasterizer’s source code with the help of a debugger—an atrocious way to learn. Let me find out why the sample font “Myfont42.source.ttf” no longer comes with VTT (I don’t have it, either).</p>
    html_clean: |-
