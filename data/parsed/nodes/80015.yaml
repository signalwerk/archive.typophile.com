      <p>Beat, I'm not sure that it is fair to cite the WCAG recommendations re. contrast with regard to one vertical stroke that, as the same englargement shows, is atypical. This is not to say that the rendering of that stroke is not a problem -- I'm not happy about it at all --, only that the WCAG recommendations surely refer to overall text contrast.</p>
      <p>What interests me about David's illustration is that it manages to both have higher stroke density and yet to look fuzzier than Mike's. I presume we have Quartz to thank for this, and that Apple manage to make even quantised designs fuzz out even when they don't grey out. I'd like to see the same size range comparison as rendered in GDI and DWrite ClearType.</p>
      <p>The other thing that interests me about David's illustration is what happens in this medial size (14ppem, yes?)...<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/frankymed_4575.png"></div><br>
      ...and to a lesser extent in the next size up, before all the horizontal weights snap back to neat proportions at 16ppem. Is this an example of the gradual degradation as one moves away from the optimally quantised size, to which I referred earlier?<p></p>
