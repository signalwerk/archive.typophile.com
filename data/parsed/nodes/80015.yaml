      <p>David: <em>when was Type 1 hinting ever really useful for bi level rendering in the resolution spectrum of text?</em></p>
      <p>I didn't say anything about Type 1 hinting: I was talking about FontLab's <em>TrueType</em> hinting tools. [Those tools do try to treat aspects of PostScript and TrueType hinting as analogous processes and to leverage PS font and glyph level hints as a basis for TT hinting, but they expose and enable bi-level pixel-popping behaviour. My point was that they don't do much more than that, and do not expose TrueType as a programming language.]<br>
      ___</p>
      <p>David, we're not going to do Beat's article justice if we drag the discussion into our disagreements on other topics, e.g. the scalability of the iPad approach to typography.</p>
