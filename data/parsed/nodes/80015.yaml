      <p>I prefer not to speculate what someone may or may not learn from examples addressing bi-level rendering only. Learning methods are about as individual as people are individual: What works for me may not work for somebody else, and vice-versa. If nothing else, Vincent’s sample font illustrates how the control program (CVT + prep), the font program, and the glyph programs work together (and I doubt there is nothing else to be learned).</p>
      <p>Learning methods aside, David’s description of “hinting” reminds me of what was referred to me as “light-weight hinting” or “substantially y-direction only hinting.” The fallacy with this approach is that it causes seemingly unpredictable spacing issues, as discussed in <a class="freelinking external" href="http://www.beatstamm.com/typography/RTRCh3.htm#Sec30" rel="nofollow">§3.3.0</a> (end of paragraph, ‘O’ rendered in ClearType with “y-direction only hinting”) and <a class="freelinking external" href="http://www.beatstamm.com/typography/RTRCh4.htm#Sec21" rel="nofollow">§4.2.1</a> (end of paragraph, ‘lellellel’ rendered in ClearType). Likewise, absent or inadequate x-direction “hinting” can cause substantially equal stems to render with seemingly unequal sample counts, as illustrated in <a class="freelinking external" href="http://www.beatstamm.com/typography/RTRCh5.htm#Sec1" rel="nofollow">§5.1</a> (‘m’ rendered in ClearType with a darker middle stem).</p>
      <p>Moreover, perpetuating the “you don’t need x-direction ‘hints’ in ClearType!” mantra can only help to never get the “hinting” to match the LCD sub-pixel structure, with all the consequences discussed and illustrated in <a class="freelinking external" href="http://www.beatstamm.com/typography/RTRCh5.htm#Sec6" rel="nofollow">§5.6</a>. Whether it is text that is written vertically, or whether you rotate your screen/tablet from “landscape” to “portrait,” what was the x-direction now becomes the y-direction, and vice-versa. Sadly, Windows doesn’t handle ±90° rotation correctly because there are no fonts that are “hinted” to match the LCD sub-pixel structure—or the fonts are not hinted to match the LCD sub-pixel structure because Windows doesn’t handle ±90° rotation correctly.</p>
      <p>Last but not least, I don’t see how “hinting” for gray-scaling is another dimension, as David put it. The stems are the same, the crossbars are the same, and so is the design contrast between horizontals and verticals or uppercase and lowercase. The only difference between gray-scaling (<a class="freelinking external" href="http://www.beatstamm.com/typography/RTRCh2.htm#Sec1" rel="nofollow">§2.1</a>) and y-anti-aliased ClearType (<a class="freelinking external" href="http://www.beatstamm.com/typography/RTRCh2.htm#Sec3" rel="nofollow">§2.3</a>) is a different set of oversampling rates, which can be addressed in the pre-program, and potentially a different method to “sharpen” strokes.</p>
