      <p>Beat Stamm: First of all, thank you very much for making the revised Raster Tragedy website. I can honestly say it blew my mind, specially <a class="freelinking external" href="http://www.beatstamm.com/typography/RTRCh6.htm#Sec31" rel="nofollow">§6.3.1</a> &amp; <a class="freelinking external" href="http://www.beatstamm.com/typography/RTRCh6.htm#Sec33" rel="nofollow">§6.3.3</a>. Since I've just started learning how to instruct TT fonts, it made me realize there's so much more to it than CVTs and Links. I certainly want to learn how to code in TT language(although I don't think I will learn fast enough for it to be useful for my thesis [nearby deadline]).</p>
      <p>I agree with you about how introducing more fonts won't overcome the scalability and spacing issues, but there are other reasons for why I'm making optical sizes (although maybe I should call them something else). While they are designed to work at different sizes and hierarchies, they are also stylistic variants with æsthetically different contours for an Editorial Design context. And well, for my actual experience in making fonts for the screen, it certainly helps to have a specific range of sizes to concentrate when designing and "hinting" each font (I hope I can update them later to fix any scalability problems). </p>
      <p>I would like to ask if you have any recommendations for someone who wants to learn how to code TT instructions. I've downloaded the TT spec files and searched for other written material concerning TT, and I'm in the process of reading them. I've been exploring and manipulating the tables in some fonts in FontForge (Constantia, Georgia, etc. [VTT 4.4 didn't come with the example fonts]) to understand how each part works. I don't know if this is the best way to learn but it's the only one I can think of in this case. I would appreciate any recommendations you have. </p>
      <p>_____________</p>
      <p>Again, thank you very much for your time and for sharing your knowledge.</p>
      <p>Cheers,</p>
      <p>José Miguel Solé</p>
