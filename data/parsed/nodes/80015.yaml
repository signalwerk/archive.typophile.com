      <p>dberlow: I understand. It just made some sense when I made the connection between that post and the information in the revisited Raster Tragedy site concerning Advance Widths, at least in general. I do think quantizing to a discrete group of values could certainly help me (maybe not with the same values that you describe in the old post). Of course I think of it as a guideline.</p>
      <p>John Hudson: Scalability is certainly a problem that makes me uneasy when looking at the preliminary results with a fast hinting pass in FontLab. The only thing that gives me some comforting is that the project I'm working on (my graduate thesis) contemplates optical sizes, so I can concentrate mainly on a limited range of sizes for each optical size group. </p>
      <p>I do think that in any font with optical sizes, each group of optical sizes (e.g., Captions, Text, Display, etc.) should work independently in the whole size range. That may be easy for print but for the screen I think it's only an ideal that may not be 100% possible (of course it depends on the characteristics of each optical size).</p>
      <p>______ </p>
      <p>I thank you both for your answers. It's always a pleasure to read your discussions.</p>
