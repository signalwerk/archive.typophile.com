      <p>Beat&gt; The fallacy with this [y-only hinting] approach is that it causes seemingly unpredictable spacing issues, </p>
      <p>weird. The fallacy of y only hinting is that it causes spacing issues? No Beat, the policy of not interpreting x hints in low resolutions and at small sizes causes spacing issues. y-only-hinting is the only rational typographic reaction to CT, not an evangelized solution to the tragedy.</p>
      <p>Beat&gt;Quantizing outlines doesn’t make any sense at all except to demonstrate,</p>
      <p>Terms: <em>Typeface Design</em> is, (beyond the drawing of compatible but dissimilar shapes), assigning dissimilar values to similar letter features to compensate for the optical effects caused by feature location, and by the combination of features within a glyph.</p>
      <p>This "Dequantizing" is a big part of type design; the O is taller than the H because of feature location, the cross strokes of the B are lighter than the H's because of feature combination.</p>
      <p><em>Typographic Quantizing</em>, generally is grouping dissimilar values of letter features to an identical value for some reason, either in spite of the optical effects, or in anticipation of the effects of output. </p>
      <p><em>Absolute Quantizing</em> means the letters are systematically fit to <strong>a grid</strong>, to compensate for the effects of low resolution at a particular pixel per em size.</p>
      <p><em>Relative Quantizing</em> means to group some features relative to each other, and to an output range of pixels, but not to a grid location or pixel value, maybe because the optical effects of the dequantized features are not going to work for the output.</p>
      <p>Now from a Y point of view: there are big alignments one almost never quantizes, like the difference between upper and lowercase;) Each of these alignments has a daughter overshoot/undershoot. And each of these has daughters too! for shapes that need more or less shoot than the O e.g.</p>
      <p>Well thank Ptah for Y instructions in Windows and heavy rendering on the Mac, but still, having the grand-daughter alignments of the H in a text face for the web means more hinting for no user benefit. Relatively quantized, the problem goes away. </p>
      <p>I have proceeded and demonstrated that quantizing in <em>X direction</em> letter design makes lots of happy screen fonts too. Again, this is not my choice — I wanted a world where all fonts could work because all hints could work. Apple said absolutely not and fixed it with rendering. MS said "We'll see", and we have seen a lot. </p>
      <p>And John, just noticed his vertical thin stems are disappearing in the ClearType collection, 6 years after I told him he could not design a font for screen text and print display without x instructions.</p>
