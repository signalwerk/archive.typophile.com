    <p>Beat Stamm has published an <a href="http://www.rastertragedy.com" rel="nofollow">updated and greatly expanded version</a> of his important 1997 article ‘The Raster Tragedy at Low-Resolutions’, which explained the reasons why hinting was needed, as a corrective to raster rounding problems in coarse grids. The original article, excerpted from a presentation that Beat gave at the 1997 OpenType Jamboree and <a href="http://www.microsoft.com/typography/tools/trtalr.aspx" rel="nofollow">still available on the Microsoft Typography website</a>, dealt with the then predominant b/w rendering of text type sizes. The new version of the article ‘covers anti-aliasing including sub-pixel rendering, opportunities made possible by anti-aliasing, challenges in the rasterizer and elsewhere, and a discussion of "hinting" in the context of these opportunities and challenges.’</p>
    <p><a href="http://www.rastertragedy.com" title="www.rastertragedy.com">www.rastertragedy.com</a></p>
