      <p>Quoting Mike: “how do you come to that conclusion?”</p>
      <p>Simple: Below 200 DPI the stems get too thin for their black core to dominate the color fringes, and fractional pixel positioning (sub-pixel positioning) thwarts any intentions to optimize what little stem width is left for rendering contrast (cf <a class="freelinking external" href="http://www.beatstamm.com/typography/RTRCh3.htm#Sec32" rel="nofollow">§6.3.2</a>).</p>
