      <p>Quantizing outlines doesn’t make any sense at all <em>except</em> to demonstrate, as David put it, “to show what would happen in Quartz or Windows if TT hints were all interpreted and to debunk the continued showing of Verdana at 11 ppm as evidence of CT quality, not as a general guide to tragedy avoidance.”</p>
      <p>I don’t know what the confusion is, but there is a difference between quantizing the beats in music (1-dimensional rounding in time), and quantizing the outlines of fonts (2-dimensional sampling, potentially followed by down-sampling with a suitable anti-aliasing filter which, in case of a box filter, could be understood as averaging).</p>
      <p>To be sure, I have experimented with MIDI recording software, and I did get my piano phrases quantized—but certainly not to my beat. Conceptually, a thusly quantized MIDI file is still scalable in time, that is, you can play it back faster or slower. Just change the number of beats per minute. By contrast, a quantized set of outlines will demonstrate what David wanted to show at exactly one ppem size. At any other size, the screen will “re-quantize” it (ignoring potentially demonstrable effects at integer multiples of the one ppem size).</p>
