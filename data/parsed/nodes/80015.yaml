      <p>Beat Stamm: This is just a parenthesis. Some music software (like Ableton Live or Reason) allows you to add swing. In Reason you can simply add swing with a switch and not mess with the quantized notation. In Live you can add any sort of syncopation pattern (they call it Beat by the way ;) and can even control the intensity of each note (useful for a jazz ride cymbal pattern, for example) but if you want to have it "stay", it hardcodes it to the notation, modifying your original notes and (many times) destroying the quantization.</p>
