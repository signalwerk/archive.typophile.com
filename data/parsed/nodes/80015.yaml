      <p>David: <em>But, quantizing a type design non-absolutely, is, in my experience, not size specific.</em></p>
      <p>I'd be interested to see how you make decisions with regard to quantising.</p>
      <p>As I said, recently I've been working on fonts that have a prioritised ppem size, so I quantise for that size and then work outwards, watching the relationships of verticals and horizontals gradually degrade until, at some larger size, they coincidentally coalesce again.</p>
      <p>I've also tried the trickier thing, which is to try to position a design within a field of sizes. The decisions to be made in this case are complicated, and I've not determined even if there are rules of thumb that can be generalised across different types. Of course, it doesn't help that none of these projects involve the same writing systems.<br>
      _____</p>
      <p>Re-reading that old thread -- when did I find the time to produce all those screenshots! --, I thought of another thing that has changed since 2006. In that thread I was referring to 'contrast' in the sense of figure-ground contrast -- what Beat refers to, as in my first quote from his text above, as ‘rendering contrast’ --, but since then, to avoid confusion with contrast of stroke thicknesses, I've adopted the term 'stroke density' to refer to that desirable quality of text, epitomised in good quality printing, wherein the solid (blackness) of a stroke is not affected by the thickness of the stroke. My preference for (ASPAA) ClearType over other antialiasing mechanisms has always been based on the fact that it does a better job of preserving stroke density (as illustrated in numerous places in that old thread). As Beat observes, some of this advantage is lost in HSPAA ClearType, when subpixel positioning degrades stroke density in verticals (y-direction AA can degrade stroke density in horizontals, too, but should be controllable with the gasp table).</p>
      <p>Which brings me to what I'm most looking for in hinting these days (beyond obvious things like y-direction alignment control): strategies to maintain a minimum stroke density, to keep the not-actually-black strokes as close to black as possible at normal reading distances.</p>
