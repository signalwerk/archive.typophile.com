      <p>I've been learning from the Typophile Forums for a while now but I've never commented on any post. </p>
      <p>Reading the revisited Raster Tragedy website (I'm on chapter 5) has been enlightening. In particular the section about “Natural” Advance Widths. I'm currently working on a text font for screen in Fontlab, and although Fonlab's hinting tools have been useful for fast prototyping, I've been hitting a wall with character spacing at certain sizes. </p>
      <p>I know Mr. Stamm writes: <cite>"There is no easy “fix” to overcome the shortcomings of “natural” advance widths. It can be done, but it requires some serious efforts in terms of coding in TrueType!"</cite> but I was thinking David Berlow's description of quantizing values during the outline design process and font spacing (<a class="freelinking external" href="http://typophile.com/node/18685" rel="nofollow">this post</a>) could be a solution to this rounding problem, or at least help in minimizing it.</p>
      <p>Of course I've only started learning about font hinting and TrueType Instructions so I don't understand everything or probably missed something.</p>
      <p>The website certainly made want to learn more about the TrueType language and the manual instruction process, and also made me realize that for the final version of the font I should use VTT and not rely on the easy way (FontLab hinting tools).</p>
      <p>Anyway, this seemed like a good post for my first comment.</p>
      <p>Cheers,</p>
      <p>José Miguel Solé B.</p>
