      <p>I'm about halfway through a close reading of the document, looking with particular care now at the section on subpixel spacing (<a href="http://www.beatstamm.com/typography/RTRCh3.htm#Sec32" rel="nofollow">§3.3.2</a>), which with yesterday's relatively quiet release of IE9 has suddenly ceased to be a pending issue. The first thing I noticed when setting up my IE9 homepage to match my Firefox 3.6 page is that the thin verticals of M and N (approx. 14pt Constantia, 96dpi) are becoming pale smudges. As Beat notes:</p>
      <blockquote><p>The main drawback of fractional advance widths and fractional pixel positioning is the loss of stroke rendering contrast at sufficiently small type sizes and device resolutions (<a hre="http://www.beatstamm.com/typography/RTRCh3.htm#Sec13" rel="nofollow">cf 3.1.3</a>). As we have just seen, it thwarts any intentions to carefully position strokes to “optimize” stroke rendering contrast. Informally put, at text sizes on 96 or even 120 DPI screens, text is simply rendered with more “fringe” than “core.”</p></blockquote>
      <p>_____</p>
      <p>So far, the fundamental observation is this, from <a href="http://www.beatstamm.com/typography/RTRCh1.htm#Sec2" rel="nofollow">§1.2</a> (Beat's emphasis):</p>
      <blockquote><p>Even more math, equations, parenthesis—really!—why does this matter? It matters because it shows how rounding or sampling makes font rendering non-linear. Once it is non-linear, it is no longer scalable. The two concepts linearity and scalability are equivalent here.</p>
      <p><strong>The startling conclusion is that rounding or sampling makes the allegedly scalable font format non-scalable!</strong></p></blockquote>
