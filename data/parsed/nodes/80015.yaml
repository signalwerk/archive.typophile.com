      <p>On why the ancient and obsolete efficiency measures of the Windows TT rasteriser will never be ‘fixed’ to enable greater precision (<a href="http://www.beatstamm.com/typography/RTRCh4.htm#Sec03" rel="nofollow">§4.0.3</a>):</p>
      <blockquote><p>Think of it this way. With the existing rasterizer, a particular character may render in a particular way at a particular ppem size. The author of the constraints (or “hints”) may see no fault with the rendered pixel pattern. But he or she may be oblivious to the fact that it took the rasterizer a seemingly serendipitous chain of tiny rounding errors to produce this particular result.</p>
      <p>Now, if <em>any single one</em> of these rounding errors is “improved,” the outcome may change easily, as we have just seen. And since the font looked “good” before, chances are that it will look “worse” afterwards. We simply have to learn how to deal with the available precision—it’s hardly ever going to be exact, anyway.</p></blockquote>
