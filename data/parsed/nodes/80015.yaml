      <p>There are two aspects to this problem.</p>
      <p>As illustrated in <a class="freelinking external" href="http://www.beatstamm.com/typography/RTRCh3.htm#Sec32" rel="nofollow">§3.3.2</a>, fractional advance widths and fractional pixel positioning “thwarts any intentions to carefully position strokes to ‘optimize’ stroke rendering contrast.” In other words, even if I prefer the “navy core” over the “maroon core,” because I may think it yields a higher contrast, I don’t get to choose this <em>and</em> choose sub-pixel positioning.</p>
      <p>The other aspect is the minimum distance. As mentioned in <a class="freelinking external" href="http://www.beatstamm.com/typography/RTRCh4.htm#Sec13" rel="nofollow">§4.1.3</a>, “To minimize distortions caused by aggressive bi-level constraints, it was eventually decided that ClearType rendering should reduce the minimum distance criterion to one half of the value specified by the author of the constraints.” This wasn’t my decision, but IIRC decided by majority vote.</p>
      <p>There is a simple and a practical way to overrule this “divide-by-two” minimum distance. Both effectively require doubling the minimum distance. The simple way to try out if this works for you is something like this:</p>
      <p>XLink(parent, child, cvt, &gt;=2)</p>
      <p>In the long run this would be very impractical and “hard-wired” for ClearType. Hence, once you’re certain that this is worth your while, I’d try to conditionally set the minimum distance, something like this:</p>
      <p>ASM["<br>
      IF[] “ClearType and in x-direction”<br>
      &nbsp;&nbsp;&nbsp;&nbsp;SMD[], 128 /* 2 pixel */<br>
      ELSE[]<br>
      &nbsp;&nbsp;&nbsp;&nbsp;SMD[], 64 /* 1 pixel */<br>
      EIF[]<br>
      "]</p>
