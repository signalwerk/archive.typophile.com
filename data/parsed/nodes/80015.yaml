      <p>I think extreme or ideal definitions can be very useful, in that they oblige one to consider how something might or should work or be used, rather than proceeding on the basis of how it has worked or how it has been used. Beat makes a distinction between hinting and 'pixel-popping', and even when one acknowledges a practical continuum between these things in ‘getting the job done’, the distinction remains a useful one. What I take away from Beat's Chapter 6 is that we need to think about TrueType more as a programming language, which will make it possible to move closer on the continuum to Beat's definition of hinting, and away from using this potentially very powerful tool as a ‘technophiliac disguise for “pixel-popping”’.</p>
      <p>Hence my comment about FontLab's TrueType hinting capabilities, which pretty much do function as a pixel-popping interface, and which hence have become increasingly less useful as we move away from bi-level rendering. We're now at a place where enthusiastic amateurs are finding that FL (auto)hinting can apparently improve the appearance of some glyphs in some fonts at some sizes in some environments -- heck, maybe even most glyphs in most fonts at most sizes in most environments --, but they're doing so ‘oblivious to the fact that it took the rasterizer a seemingly serendipitous chain of tiny rounding errors to produce this particular result’. In other words, they're hinting from particular outlines to particular results, rather than generalising hinting as a programming strategy that will provide the most flexible set of nested instructions and functions, such that varying raster output devices, rendering methods and user preferences are able to take most advantage of that hinting.</p>
      <p>This, of course, presumes another point that Beat makes: hinting is (should be) all about acting, not reacting. If this is the case -- or becomes the case -- then hinting goes from being the cladding on a building that makes it look nice to being something like a foundation, something that new rendering methods and options for end users can reliably build on top of, and without resorting to the kind of ‘band-aids’ Beat was forced to enact in the Windows rasteriser to get existing fonts not to explode in ClearType.</p>
