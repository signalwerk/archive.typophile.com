      <p>@John: I was struggling with the terminology given the relative generality of the word “contrast.” At the time, separating <em>rendering contrast</em> from <em>design contrast</em> is the best this engineer could come up with. But if <em>stroke density</em> is more common and less problematic than rendering contrast, I’ll be happy to revise the text.</p>
      <p>Also, separating figure-ground-contrast from stroke density makes sense, certainly at large enough ppem sizes where we don’t get all sorts of symptoms mixed up. In technical terms it reminds me of the difference between the alpha channel and the text/background color pair blended by the alpha channel. I’ll need some time when back from vacation to give this some deeper thought.</p>
      <p>Giving up stroke density for verisimilitude is not my preference, either, particularly when I have to <em>read</em> text, as opposed to looking at a print preview. But people’s preferences vary, which is why I suggested to make hinting more adaptive and allow end-users to select their preferences in a control panel that goes way beyond the ClearType control panel. That is, if future rasterizers execute any instructions at all.</p>
