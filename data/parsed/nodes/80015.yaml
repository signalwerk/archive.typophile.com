      <p>For the sake of pedantry :) </p>
      <p>Digital music software does quantize to the beat - the timeline of music being divided into 'beats to the bar', e.g 16 beats to the bar. Quantizing in music takes the position of each note in the timeline and rounds it's position to the nearest beat.</p>
