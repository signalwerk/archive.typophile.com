      <p>Thanks for the link to that old thread José. Was it really 2006?</p>
      <p>Some things have changed since then. At the time, talk at MS was about subpixel positioning and y-direction AA in ClearType becoming widely used in Windows Vista. That didn't happen, although those features were present in the massively underexposed Windows Presentation Format. Instead, those features become widely used two days ago with the release of IE9.</p>
      <p>The other thing that changed is that I'm no longer using a 145ppi screen. I'm back to 96ppi but a much larger monitor and sitting further away. :)</p>
      <p>I think the intervening years have proven David right about quantising outline design and spacing, although with the ever more pressing caveat that this is a size specific solution, which makes me nervous given the widespead use of text zoom on touchscreen devices. Customers want scalable fonts, and I don't think we really have a good mechanism to deliver them while also getting the kind of quality of text on screen that we want, users deserve and customers might just be willing to pay for if only it also scales. Recently, I've been working on UI fonts, and the nice thing about the project is that there's a limited range of ppem sizes in which the customer is interested (in part because they're presuming a particular resolution), so I could quantise the design and spacing to work optimally at the most common of these sizes. But UI fonts are exceptional in that they tend to be used at static sizes. I still think it makes sense to decide on a target size for a design for screen, and to quantise accordingly, but as the text is scaled that design and spacing may appear freakish. I'll also point out that a project in which a customer is only interested in two ppem sizes is only half as nice as a project in which they are only interested in one ppem size.</p>
