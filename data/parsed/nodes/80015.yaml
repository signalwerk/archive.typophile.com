      <p>This has been in my head for a while now, so i'd be interested to have cold water poured on it :)<br>
      The idea of 'quantising' values in a font design in order to aid rasterisation reminds me of the faces Frutiger did for IBM's Selectric computer/typewriter. There was a hardware constraint, so the designer worked with the constraint to better the output. in the case of the Selectric there was the constraint of fixed widths to characters, yet a wish for a more 'typographic' fitting of the characters. So Frutiger came up with a set of 6 char widths (including their fixed sidebearings) that he resolved by 'quantising' his fonts (he never called it 'quantising' !) But he took eg, Univers, and quantised the face down to only 6 character widths, with each character fitting into 1 of those 6. </p>
      <p>My question into this is , could a similar approach aid screen rendering of a font in any way ? Could a similar approach help in hinting of a font?</p>
