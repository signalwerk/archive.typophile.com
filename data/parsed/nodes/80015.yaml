      <p>&gt;We're happy to provide it to any VTT licensee who wants it.</p>
      <p>I didn't have this when I went to do some hinting in VTT last summer, so I wrote and commented one on latin caps for some developers. What I also found in the most up-to-date version of VTT MS could supply, was that the excellent built-in tutorial, written I assume in the late 90's for aliased hinting, is considerably more complex than what's needed to add high quality CT-hinting to fonts for Windows use today. </p>
      <p>That tutorial could be compressed down to alignments, overlaps, relative shifts or moves and light CVT management, as I proved to me in a series of font hintings. I suspect any template font from the "aliased age" might cause more confusion than help unless it too is compressed to what actually works in Windows for most users.</p>
      <p>Then, if people want to go on to hinting for Windows Grey Scale/Freetype, that's a another dimension, but also quite different from aliased age hinting.</p>
