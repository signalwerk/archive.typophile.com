      <p>JM Solé wrote " was thinking David Berlow's description of quantizing values during the outline design process and font spacing <a class="freelinking external" href="http://typophile.com/node/18685 " rel="nofollow"> (this post)</a> "</p>
      <p>'That' post (CT Design Guide) talks a lot on 'Quantising'. Quantising being a technical practise of 'averaging out', used a lot in digital music production, to 'fit' musical notes onto the (beat) grid. It does make a lot of sense when dealing with fonts for screen to adopt such strategies of quantising (in David Berlow's post) to better fit stems, bowl edges, terminals etc to the digital pixel grid. This minimises the need for 'lots' of hinting instructions. With DirectWrite, where the need for comprehensive hinting instructions has been lessened it still makes sense to fit the grid as much as possible, for crisper rendering and minimising those weird blips at small sizes. It even makes for crisper rendering on Quartz.</p>
      <p>re; gasp tables&amp; truetype fonts - with DirectWrite coming online now, version 1 tables are essential for optimum rendering on Windows IExplorer 9 and Firefox 4. A version 1 gasp table is backward compatible with the pre- &amp; GDI cleartype (i.e. a version 1 table will still do ye olde antialias &amp; gridfit if it needs to), but a version 0 gasp table is not forward compatible; i.e. it wont bring out the best of DirectWrite font rendering. </p>
      <p>ps Fontlab still can't generate version 1 tables! Fontforge generates version 1 tables, or you can use TTX to hack one. erm... or use VTT :o</p>
