      <p>All of <a href="http://www.beatstamm.com/typography/RTRCh6.htm" rel="nofollow">Chapter 6</a> should be required reading, and then required re-reading.</p>
      <p>Unfortunately, one of the things it makes clear is that you can't, after all, hint TrueType in FontLab, at least not in accordance with Beat's definition of hinting:</p>
      <blockquote><p>“Hinting” designates the act of constraining the scaling of outline fonts to yield sets of samples that best represent the type designer’s intent at any point size, on any raster output device, having any device resolution, using any rendering method, in any software context, and for any end-user.</p></blockquote>
