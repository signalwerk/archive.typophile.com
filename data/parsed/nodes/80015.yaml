      <p>I enjoy splitting hair :-)</p>
      <p>As far as I remember, I had to tell the software to quantize e.g. to the nearest quaver (eighth note), and this took the swing right out of the phrase. Yet I learned in jazz theory classes that out of two consecutive quavers, the first one is longer than the second one, but that the two still add up to a crotchet (quarter note). Coming from classical music, I would have notated it in triplets, using a tie across the first two out of three, but that didn’t seem to be an option. When I told the software to quantize to the nearest hemidemisemiquaver (sixty-fourth note), the midi timing got a lot closer to swing, but the notation became unreadable.</p>
      <p>And yes, like I wrote, the quantized outline would have demonstrable effects at integer multiples of the ppem size, hence a set of outlines quantized to 12pt at 96dpi = 16ppem would work at 32, 48, 64, 80, 96, … ppem but likely not at 15ppem or 17ppem or similar (besides the missed opportunities to do a better job at 96ppem with rendering stroke design contrast, under- and overshoots, serifs, etc).</p>
