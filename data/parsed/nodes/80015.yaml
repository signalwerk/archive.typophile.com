    html: <p>Scalability is one of my main concerns, as well, taking priority over web fonts (font embedding) and fractional pixel positioning (sub-pixel positioning). Introducing more fonts on its own doesn't overcome the scalability and spacing issues discussed in <a class="freelinking external" href="http://www.beatstamm.com/typography/RTRCh4.htm#Sec21" rel="nofollow">§4.2.1</a>. Likewise, introducing fractional pixel positioning on its own doesn't overcome the scalability issues discussed in <a class="freelinking external" href="http://www.beatstamm.com/typography/RTRCh6.htm#Sec23" rel="nofollow">§6.2.3</a> (compare columns "Vista SP1 fractional widths" and "fractional ppem sizes &amp; widths"). To improve scalability, fonts <em>must</em> allow fractional ppem sizes and therefore abandon deltas, as illustrated in <a class="freelinking external" href="http://www.beatstamm.com/typography/RTRCh3.htm#Sec33" rel="nofollow">§3.3.3</a> (cf illustrations of figure '6').</p>
