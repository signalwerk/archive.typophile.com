    html: <p>Names for diacritics or 'glyphs' were taken from PostScript or Unicode descriptions and are not character codes or technical names just descriptions. Many human readable names such as PostScript are not 'correct' see the French quotes which are a 'guillemet' in French and 'guillemot' in PostScript, or a Duck. <br> <br>I've given pointers in the overview for the Unicode and PostScript 'glyph' code or names.  <br> <br>Names can be tricky, at Microsoft the word 'character' is never used to mean 'glyph' it means 'character code' and not 'letter' or 'glyph'. You type a 'character' you get a 'glyph'. <br> <br>Names are not always universal, see the ntilde, it's not considered correct.</p>
