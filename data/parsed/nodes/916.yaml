    html: <p>I think the birds were named since they have duck like feets... as the guillemets are sometimes called. <br>  <br>'These quotation marks commonly called 'French quotes' or 'duck's feet' are said to have been named after a French typecutter Guillaume (William) Le B�. Guillemets is the French word for quotation marks. The similarly named Guillemot is a narrow billed, sea auk with duck like feet found in cold northern regions of the world.' <br> <br>that's what I wrote in the MS Char spec. vinnie <br> <br></p>
