    date_raw: null
    votes: null
    html: "<p>They are generally pretty reliable, especially when dealing with general rules such as whether mathematical operators should be slanted in italic fonts. <br> <br>Most of the information about diacritics is okay, but there are some omissions and imprecisions. For example: <br> <br>When discussing under comma accents and cedillas, the MS design standards say that 'An under comma is an acceptable alternative to a connecting cedilla for the following characters...', and goes on to list C/c cedilla and the misnames Unicode characters K/k L/l N/n and R/r with cedilla. This gives the wrong impression. The choice of whether a cedilla connects to C/c is a design option, and is also culturally important as the MS design standard notes. However, the correct form for the other letters is not optional: these should all be the under comma accent form <i>not</i> the cedilla. <br> <br>Note that there are no languages currently using T/t with cedilla, so a single T/t with under comma glyph can be double mapped for both the T/t weith cedilla and with under comma Unicode characters. <br> <br>In the section on the caron accent, the MS design standards correctly note that the Slovak D/d and T/t with caron take different forms in upper- and lowercase. The uppercase form takes the typical, inverted circumflex form, but the lowercase takes the apostrophe form. However, the MS design standard omits the L/l with caron, also used in Slovak, in which both upper- and lowercase take the apostrophe form.</p>"
    html_clean: "<p>They are generally pretty reliable, especially when dealing with general rules such as whether mathematical operators should be slanted in italic fonts. <br> <br>Most of the information about diacritics is okay, but there are some omissions and imprecisions. For example: <br> <br>When discussing under comma accents and cedillas, the MS design standards say that 'An under comma is an acceptable alternative to a connecting cedilla for the following characters...', and goes on to list C/c cedilla and the misnames Unicode characters K/k L/l N/n and R/r with cedilla. This gives the wrong impression. The choice of whether a cedilla connects to C/c is a design option, and is also culturally important as the MS design standard notes. However, the correct form for the other letters is not optional: these should all be the under comma accent form <i>not</i> the cedilla. <br> <br>Note that there are no languages currently using T/t with cedilla, so a single T/t with under comma glyph can be double mapped for both the T/t weith cedilla and with under comma Unicode characters. <br> <br>In the section on the caron accent, the MS design standards correctly note that the Slovak D/d and T/t with caron take different forms in upper- and lowercase. The uppercase form takes the typical, inverted circumflex form, but the lowercase takes the apostrophe form. However, the MS design standard omits the L/l with caron, also used in Slovak, in which both upper- and lowercase take the apostrophe form.</p>"
