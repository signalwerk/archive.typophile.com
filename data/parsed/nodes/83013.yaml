  html: |-
    <p>Dear you,</p>
    <p>I know, this as a first post would be asking for trouble but I will gladly take the flak if this would result in a funded kickstarter project. I would be bummed out if this project doesn't get funded because I would like to use the sh*t out of that font. So my selfishness is in a way a shameless selfpromotion.</p>
    <p>Anyways, Mark Caneso from <a href="http://cargocollective.com/pstype" rel="nofollow">p.s. type</a> is looking for backers to expand his Quatro typeface from 3 fonts to a full 16 fonts - 4 weights (with matching italics in each style) type family. In my opinion an interesting solution for financing a typeface.</p>
    <p>More info about this project is over here at <a href="http://www.kickstarter.com/projects/1436223656/quatro-typeface-a-16-font-opentype-family" rel="nofollow">kickstarter</a>.</p>
    <p>It would be awesome if more people could back this up.</p>
    <p>Cheers,</p>
    <p>Eike</p>
