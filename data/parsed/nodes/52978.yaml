    <p>Hello people,<br>
    to those whom i am not acquainted or to those who are not acquainted to me, i am a designer from Israel, and a perpetual student, although i have finished my 4 years of visual communications studies.</p>
    <p>i am looking for a Latin (that is English) font, that looks like a hebrew-language font called "blender", designed by the talented Michal Sahar from Israel.</p>
    <p>type sample attached:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/27-12-2008 10-56-05_4297.jpg"></div><p></p>
    <p>I'm looking for something that is similar, and may be modern, funky, cool (which in this context means interesting sans serif which is very similar and geometric).</p>
    <p>thanks very much, and marry christmas.<br>
    :)</p>
    <p>**(further fonts and works of Michal Sahar, or "Hagilda" type foundry, can be found here:)<br>
    <a href="http://www.hagilda.com/" title="http://www.hagilda.com/">http://www.hagilda.com/</a><br>
    <a href="http://www.michalsahar.com/" title="http://www.michalsahar.com/">http://www.michalsahar.com/</a></p>
