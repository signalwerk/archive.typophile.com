    <p>May 4, 2010<br>
    I'm proud to announce the released of Harfang, my most recent typeface family. This second typeface — ITC Migration Sans was the first one —,  was created with the invaluable advice of Xavier Dupré, Chris Lozos and of course Rod Cavazos (PSY/OPS Type Foundry). </p>
    <p>My goal for Harfang was to create a serif typeface that would be easy to read at text sizes, while having a strong personality at larger sizes. The initial design had a purely rounded style, but with each development pass I introduced some angularity. The final result is a typeface that is easy to read in long texts, advertising copy, annual reports and the like; but one that also provides a crisp and stylish appeal in more prominent display settings. I chose the name Harfang (Harfang des neiges — Snowy Owl or Great White Owl) because after my first typeface, Migration, I wanted something with a thematic relation. On a more personal level, Harfang is the avian emblem of Québec and recalls the long winters and the breathtaking white landscapes of the place I call home, Abitibi.</p>
    <p>Finally, many thanks to my wife Constance and my daughter Jade. —André Simard</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/HARFANG_specEN_4173.jpg"></div><p></p>
