      <p><em>I've yet to even open up the hood and fix my spacing and sidebearing issues.</em></p>
      <p>It’s not about spacing per se, more about counter space, spacing, and the relative weight of letters.<br>
      The point I was trying to make, although perhaps not very well, is that the relationship between these and the way it informs letter shape decisions can be analyzed with the help of awkward (e.g. shitty) words, and different spacing strategies—most obviously “manual” and automated kerning. Here are three typefaces with /S unfolded to varying degrees, compared in this manner:<br>
