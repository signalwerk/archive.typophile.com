    <p>I’m doing an article on the engineering department of my local university. What is a good display face that communicates “engineering?” I’ve seen one that was outlined, visible rules for baseline, xheight, etc, and visible circles used to determine the geometry of the typeface. Now I can’t find it and my searches on the font websites is coming up short. Any ides?</p>
    <p>Thanks,<br>
    Scott</p>
