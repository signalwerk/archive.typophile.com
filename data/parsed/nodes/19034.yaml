      <p>Do you have invisibles turned on? cmd-opt-I turns them on and off in Illustrator on a Mac. </p>
      <p>Sometimes, when I open a file before the fonts are open some of the characters switch to other characters. I've found that I have to restart Illustrator to remedy it.</p>
