      <p>It brings to mind <a href="http://www.fonts.com/font/monotype/mccollough/regular" target="_blank" rel="nofollow">McCollough</a> for me, Don.</p>
      <p>Designed about 1898 by Gustav F Schroeder for ATF and - according to <a href="http://www.klingspor-museum.de/KlingsporKuenstler/Schriftdesigner/Schroeder/GustavFSchroeder.pdf" target="_blank" rel="nofollow">this Klingspor Museum PDF</a> - originally spelled McCullagh.</p>
