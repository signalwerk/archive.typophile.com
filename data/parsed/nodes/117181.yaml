    <p>What is the name of this font?  (then I need to search it out!  I'm a font newbie, but know how to install! ;))</p>
    <p>We're not concerned w/ the shading/sketching pattern but what the letters look like.  We want to paint it on a sign and the letters will just be a solid color.</p>
