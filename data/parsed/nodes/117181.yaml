    html: |-
      <div class="comment-spam-body"><p>Yes Mike, that's the name I was trying to recall. The letters are almost identical. If I wanted clean outlines to paint a sign I would use McCollough. If I wanted a rough look I would use Return to Sender.<br>
      Don</p>
