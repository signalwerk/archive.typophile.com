    date: 2014-06-11T09:17:00
    date_raw: 11 Jun 2014 — 9:17am
    votes: null
    html: |-
      <p>Matamoros NF is based on a similar but different font -- note for example the lazy s counters in _O_ and _Q_, similar to Inland Foundry's _Inland_ -- from circa 1900 called Jason Wood by Dan X. Solo and sold by him in digital form with one of the Dover Books. Used for the title of the Solotype catalog.<br>
      I don't know the designer, original name or foundry.<br>
      Don</p>
