    html: <p>thanks Simon, yep Optima is very close, but there are subtle differences, for example the upper and lowercase w in the regular weight and the single storey a in the italic. Perhaps this is an earlier non digitised cut of Otima? I have read of Matthew Carters "Optima Classified" but am unable to find a sample.</p>
