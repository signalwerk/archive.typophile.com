    <p>The results of stemhist is very different in AFDKO version 25_21898 and AFDKO version 20_26. In the new version stemhist does not check most of the glyphs. I am using the option "-all". I darkly remember, that there was a change, but I cannot remember, where I have read about it. Actually it looks more than a bug than a bug fix.</p>
    <p>This is, what the actual version of stemhist reports for the horizontal stems – as you can see, it does not recognize the basis alphabet:</p>
    <p>25	80	['Acircumflex', 'Acircumflex.smcp', 'Ecircumflex', 'Ecircumflex.smcp', 'Icircumflex', 'Icircumflex.smcp', 'Ocircumflex', 'Ocircumflex.smcp', 'Scaron', 'Scaron.smcp', 'Ucircumflex', 'Ucircumflex.smcp', 'Zcaron', 'Zcaron.smcp', 'acircumflex', 'caron', 'caron.caps', 'circumflex', 'circumflex.caps', 'ecircumflex', 'icircumflex', 'ocircumflex', 'scaron', 'ucircumflex', 'zcaron']</p>
