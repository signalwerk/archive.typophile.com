    html: |-
      <p><strong>Except from</strong> the problem described above, there is at least one bug in the FLS macro StemAndAlignHist.py:</p>
      <p>Not</p>
      <p><code>haveAC = setFDKToolsPath("autohintexe")</code></p>
      <p>but</p>
      <p><code>if os.name == "nt":<br>
      	haveAC = setFDKToolsPath("autohintexe.exe")<br>
      else:<br>
      	haveAC = setFDKToolsPath("autohintexe")</code></p>
      <p>Otherwise it may run (but not work correctly – because of the problem, that I have reported in the first message) on Mac, but not on PC.</p>
      <p><strong>By the way, the board software is unbelievable poor! It even does not recognize the tabs in front of "haveAC", although they belong to the code! This is really nerving!</strong></p>
      <p>And there are more bugs in the outline macros of the AFDKO, namely in "Proof in CharPlot style", "Proof in HintPlot style" and "Proof in FontPlot style".</p>
      <p>There I got those errors on Windows:</p>
      <p>Starting proof of font TestFont-Regular. Start time: Tue Nov 02 17:09:04 2010.<br>
      Traceback (most recent call last):<br>
        File "", line 113, in ?<br>
        File "", line 95, in run<br>
        File "C:\FLStudio\macros\system\modules\ProofPDFFL.py", line 76, in proofFont<br>
          pdfFont = txPDFFont(flFont, params)<br>
