      <p>Ah, I remember those days. I’m actually graduating college this coming semester. As for looking for schools, it’s not as easy to say “if you want to be a great designer...go here” that’s sort of on you. Although, here are a few schools that tend to have good reputations.</p>
      <p>Tyler School of Art<br>
      (Paula Scher went there and possibly still teaches there? not sure)</p>
      <p>Kansas City Institute of Art<br>
      (Some famous people roll through there quite often, so it gets a good name)</p>
      <p>Maryland Institute College of Art<br>
      (Mostly fine arts, but has a really good design program and a great reputation)</p>
      <p>If you happen to make it out of the states, I recommend the Basel School of Design in Switzerland. Wolfgang Weingart still teaches there as far as I am aware...and if you get in a class with him, I’m sure you won’t regret it.</p>
      <p>Personally, I’d stay away from the art institutes or any school you see advertising you can become a designer in less than 2 years...they have bad reps and unless your portfolio is AMAZING after graduating, you risk being laughed at. This also stands for the Bradley Academy, which only gives you a 2 year degree anyway. (Even though I had one teacher from there at my school and he was amazing typographer)</p>
      <p>In the end though pick a place where you feel like you fit in. You have to spend YEARS there, so mine as well have fun! I don’t want to act like I KNOW what I’m talking about, I’ve never went to any of these schools. I’m just basing my opinion on the schools I have heard over and over since I started college. Good LUCK!</p>
