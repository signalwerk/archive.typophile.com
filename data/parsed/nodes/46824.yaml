    <p>Hey I am about to become a senior in high school and i am looking for digital art schools to apply to. I am from UT and i keep a decent GPA and etc. my passion is for photoshop and vector design so i am having problems in choosing what school to goto to become a graphic designer hopefully at an amazing design studio. I am looking for any school anywhere i dont plan to stay in state by any means for the tech schools here are just barely par. If anyone has anything about some amazing school please tell i am very determined and want to go some where that i am able to learn as much as possible. costs dont matter though like everyone else i’d prefer an amazing school for an amazing price but if i am forced to take out a student loan or two i am willing.</p>
