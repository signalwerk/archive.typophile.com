    html: |-
      <p>There is not necessarily a correlation between lettering in a stamp and a font. Especially in the pre-digital era, stamps were made without digital fonts (of course), and only needed a set of dies/molds to be made.</p>
      <p>How 'old' is this textbook, just out of curiosity?</p>
      <p>- Mike Yanega</p>
