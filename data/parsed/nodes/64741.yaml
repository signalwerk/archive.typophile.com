    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : José Scaglione</strong></p>
    <p>Received a MA in Typeface Design, from the <a href="/wiki/University%20of%20Reading" class="freelinking" rel="nofollow">University of Reading</a> in 2004. Founded <a href="/wiki/TypeTogether" class="freelinking" rel="nofollow">TypeTogether</a> with <a href="/wiki/Veronika%20Burian" class="freelinking" rel="nofollow">Veronika Burian</a> in 2006. Board member of the Association Typographique Internationale since 2007. Lecturer at the University of Rosario (UNR) and the University of Buenos Aires (UBA). He is the Chairman of Letter.2, the 2nd. type design competition organized by ATypI.</p>
