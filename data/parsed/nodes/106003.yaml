    html: |-
      <p>Helvetica "Oblique" was a shortcut to save the poor LaserWriter's precious memory. Examining how that worked introduced me to the inner workings of Font Matrixes, though, so it wasn't all for nothing.</p>
      <p>Remind me again: was Helvetica Narrow also a fake font? Searching for that data, a bit of a surprise popped up: This (self-declared "old") page: <a href="http://support.apple.com/kb/TA40127?viewlocale=en_US" title="http://support.apple.com/kb/TA40127?viewlocale=en_US">http://support.apple.com/kb/TA40127?viewlocale=en_US</a> states</p>
      <blockquote><p>The LaserWriter does not use true fonts for Bold, Italic, and so on. Instead it does some algorithmic calculation to create the these fonts from the plain typeface.</p></blockquote>
      <p>Surely that's a bit of an exaggeration?</p>
