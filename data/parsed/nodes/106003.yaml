  - id: 564133
    user: 14436
    date: 2013-09-04T08:18:00
    date_raw: 4 Sep 2013 — 8:18am
    votes: null
    html: |-
      <blockquote><p>Remind me again: was Helvetica Narrow also a fake font?</p></blockquote>
      <p>Yes, it was just a horizontally scaled version. Condensed italic was scaled and slanted</p>
      <blockquote><p>The LaserWriter does not use true fonts for Bold, Italic, and so on. Instead it does some algorithmic calculation to create the these fonts from the plain typeface.</p></blockquote>
      <blockquote><p>Surely that's a bit of an exaggeration?</p></blockquote>
      <p>No. The notes on the LaserWriter describe what the first generation did under Apple’s QuickDraw using bitmapped fonts. The later LaserWriter Plus version, had 13 scalable Adobe PS Type1 outline fonts on board: 4 Helvetica, 4 Times, 4 Courier and 1 Symbol. The next generation, LaserWriter II NT and NTX, had the aforementioned 35 Adobe PS Type1 outline fonts on board and other PS Type1 fonts would be downloaded to the printer. The 35 Adobe PS Type1 fonts had true bold weights for all the fonts, slanted italics for the sans serif fonts (Helvetica, Helvetica Condensed (squooshed from Helvetica) and ITC Avant Garde) and Courier. They had true bolds and italics for the serif fonts (Times, Palatino, ITC Bookman, New Century Schoolbook) and a true italic for ITC Zapf Chancery, plus Symbol and Dingbats makes 35. The slanted and squooshed fonts made it possible to put as much fonts as possible on the memory chips of those days.<br>
      In those days they were known as the ‘LaserWriter 35’. Everyone in the type industry was busy cloning them im some way or another.<br>
      Considering the first LaserWriter being a non-PostScript device, my description and the ‘L’ are a bit confusing. The URW ‘L’ fonts do not emulate the Apple LaserWriter fonts, they emulate the Adobe/Linotype PS Type1 outline fonts that were made to run as from the Apple LaserWriter Plus</p>
      <p>As far as I know, the present versions of the URW ‘L’ fonts perform very well on websites, but from an aesthetic point of view one must consider that especially the proportions and metrics of Helvetica still suffer from memory restrictions of the Apple LaserWriters.</p>
