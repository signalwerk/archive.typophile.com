    html: |-
      <p>the original version of Helvetica</p>
      <p>Pleae note that the L in URW Nimbus Sans L stands for Laserwriter. It was me who introduced the L in the URW font names to distinguish the URW LaserWriter clone fonts from other versions of fonts with the same name. So URW Nimbus Sans L is not ‘the original version of Helvetica’ it is a clone of Helvetica which tries to match the PostScript version made by Adobe by the time first Apple LaserWriters were enabled to handle downloadable or pre-installed scalable PostScript Type1 outline fonts. Adobe has been improving these fonts several times and URW has tried to track them throughout the years.</p>
      <p>On its turn, the Adobe version of Helvetica has not much to do with the original versions of Helvetica made by Haas, Stempel or Linotype. The italics of the Adobe version started their life as electronically slanted versions of the roman and not much fundamental has changed ever since.</p>
