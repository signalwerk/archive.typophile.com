    html: <p>TeX Gyre Heros or FreeSans could be an option — these are both based on URW Nimbus Sans L, a freely-licensed version of Helvetica released under the GPL. These fonts, however, are based on the original version of Helvetica rather than Helvetica Neue, and only come in regular, italic, bold and bold italic.</p>
