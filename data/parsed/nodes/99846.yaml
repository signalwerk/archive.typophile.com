    html: "<p>Your illustration confirms my point: college essays aren't manuscripts, and professors or high school teachers aren't editors. They ignore typos and wording, but leave comments like \"this contradicts what you said about X two paragraphs above\", \"great example, you could elaborate on Y more\" or \"interesting point, this could be linked to the concepts discussed in class about article Z\". The one-inch-margins-double-spaced mantra is counter-productive to that; for all intents and purposes, students really are directly publishing their work to the one-man audience that is their professor.</p>"
