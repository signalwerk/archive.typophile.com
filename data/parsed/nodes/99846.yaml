      <p>Best. Avoidance behaviour. Ever. </p>
      <p>Worry about the <strong>content</strong> of the paper, not the font. Follow the guidelines to facilitate marking for the TA. If you had to pick one detail, argue against single sided as it wastes paper. I have chosen to accept an F instead and won. You can also reduce the margins to save some paper. 99% of the time it’s a grad student TA requesting your “this*” guidelines, simply following old departmental regulations, and they could care less. Provided, as you said, it’s not 8-point Comic Sans. Just ask them and show them an example. If they resist, at least you tried. If spending time on the design is not going to influence this, don’t waste your time. Get a head start writing your next paper instead. Think of the most efficient allocation of your’s, <em>and</em> the marker’s resources — primarily time — and let that guide your design decision making process. And always be mindful of <a href="http://en.wikipedia.org/wiki/Diminishing_returns" rel="nofollow">the law of diminishing returns</a>.</p>
      <p>*Please use descriptive hyperlinks to assist visually impared readers using text-to-speech software.</p>
