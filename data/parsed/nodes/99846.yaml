    <p>This might seem like a weird question, but as a university student I regularly get assignments in which, instead of a simple word count, requirements à la "5 pages, double-spaced" are stipulated by the professor. Sometimes a point size is given, sometimes a margin width, but that is actually unusual (rendering the commandment toothless as a length limit, of course).</p>
    <p>I understand that they're just trying to avoid having to read assignments in 8-point Comic Sans, but I'd much rather submit something like <a class="freelinking external" href="http://www.typographyforlawyers.com/pdf/tfl_sample_memo_after.pdf" rel="nofollow">this</a> than <a class="freelinking external" href="http://www.typographyforlawyers.com/pdf/tfl_sample_memo_before.pdf" rel="nofollow">this</a> for obvious reasons.</p>
    <p>Since I'm not a document designer myself, does anyone have suggestions on how to best deal with the above "5 pages, double-spaced" assignment? (I have one coming up.) Links to successful layouts, suggestions for fonts (I assume larger x-heights work better?), suggestions for the treatment of subheadings, lists, blockquotes etc.</p>
    <p>(Some will say I shouldn't bother and just conform, but I'm genuinely interested in how designers usually work with weird constraints.)</p>
    <p>Thanks everyone!</p>
