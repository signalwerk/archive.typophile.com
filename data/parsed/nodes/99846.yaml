      <p><em>The form cannot be divorced from the content.</em></p>
      <p>If you mean that all texts are instantiated and, hence, have form, that's a fair if tautological statement. But it doesn't imply anything about the particular form of any particular content, which may indeed have an entirely arbitrary relationship such as that required by any standardised document format. For example, Hollywood screenplays are expected to conform to standardised formatting, and this doesn't vary whether the film in question is a romantic comedy or a sci-fi thriller. It is a standardised format that has little to recommend it to any typographer, but it is functionally useful for the people who have to work with the script: it provides ample space for annotation, and by requiring all screenplays to follow the same standard it enables accurate predictions about timing and length. Likewise, the double-spacing of pre-publication copy and academic essays is functionally useful to the people have to work with that copy. These days, this might not be very evident in the context of college essays, but that is because most teachers are overworked and don't have time to provide detailed copy feedback, and at the undergrad level most students are not involved in seminar situations that require them to give such feedback to their peers. Now, one might argue that the formatting requirements of college essays should change to reflect the current realities of academic life, but isn't that just a different kind of dumbing down: making documents look nicer typographically to compensate for the fact that no one is engaging with them at a text-critical level?</p>
