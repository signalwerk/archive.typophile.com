      <p>Johnathan,  would that were true (maybe). I'm a book typesetter. Now that the vast majority of editors work on the author's computer files,  we see a lot of varying formats with manuscripts -- from the old double-spaced Courier (or Pica) to slam-it-tight Times. That is, 1200 characters per page to over 2800.</p>
      <p>Far as I'm concerned, the most important thing is to use Unicode. Let's skip the little drawings and instructions that say "make it look like this ---", and the invented codes, when the proper character is available in Unicode.</p>
      <p>For texts in the humanities, the best typeface has been either Charis or Gentium. Gentium has a few more characters, Charis has bolds. There are Scholarly Journals (esp. those in areas that have romanized scripts) that require Gentium for article submission, as the correct Unicode character can usually be found within. Of course, I prefer Charis, as I've said before, we have a version that has been used for books selected for AAUP book show (which is a juried show). But that does require font modification for that level of quality...</p>
      <p>Here's a thought: I downloaded &amp; took a look at John Hudson's The Brill, and for manuscript preparation, it should be great. I think it a beautiful typeface, but as a commercial typesetter, I'll only get the opportunity to use it (1) if I again become an author, or (2) wind up setting another book for Brill. For that reason, I've not looked too closely at the character compliment, but likely it's broader than Gentium (John?)</p>
      <p><a href="http://www.brill.com/author-gateway/brill-fonts" title="http://www.brill.com/author-gateway/brill-fonts">http://www.brill.com/author-gateway/brill-fonts</a></p>
      <p>In any case, <strong>read the license thoroughly,</strong> but I believe it's OK with Brill to use the fonts in the context of thesis/manuscript preparation.</p>
      <p>* * *</p>
      <p>To the original poster: David pegged it. Word or Open Office defaults. Open Office is free, BTW. And if you want it to be typeset, use InDesign, or learn TeX. Word doesn't cut it.</p>
