    html: "<p>Sebastian, the typography of the romantic period tended to favour large leading. I believe this was done to compensate for the verticality of the Didot, Bodoni and related type styles, which benefit from looser leading to make the individual lines of text easier to follow contra to the vertical emphasis of the letters. While I don't think this logic can be reversed to suggest that such types counter the looseness of the leading in any functionally significant way, they are at least forms that are aesthetically at home with large interlinear spacing. Take a look at Robert Slimbach's Kepler type: it is stylistically within this tradition, but is not so extreme in its treatment of stroke modulation as most digital versions of Didot, Bodoni, etc.</p>"
