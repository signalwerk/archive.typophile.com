      <p>Not to pick on you unmercifully -- he said, picking on you unmercifully, but</p>
      <p><cite>but I'd much rather submit something like this than this for obvious reasons.</cite></p>
      <p>Your preference is pretty flawed, from my perspective. The initial paragraph suggest three points, and you enumerate them, 1, 2, 3. But in the text, instead of using numbers, you use alphabetical characters (A, B, C). Why?</p>
      <p>You've chosen to set justified. But in the first paragraph, you've got four line-ending hyphens in a row. Usually not allowed. In the third paragraph, you've also got improper hyphenation (ma-lice, s/b mal-ice). If you're not going to set justified copy correctly, set it ragged, without hyphenation. Perfectly acceptable in a manuscript.</p>
      <p>Why boldface for the headings -- if they are headings? Boldface breaks up the text. Very useful in travel books, where reading is not continuous. A reader can be expected to read first to find a hotel. After they have perused &amp; finally booked their hotel,  the might want to look at all the restaurants. When satiated, they might want to concentrate on night life.</p>
      <p>But if reading is continuous, the blank line above and the identifier A (or 1) is sufficient. Boldface is for a reason, and that reason is never to borrow authority. The authority comes from the writing.</p>
      <p>Graphically, you're sort of going flush left, which is fine. But it's "sort of" due to the way you've done that first headblock. If you want the gutter in that element to have even space, OK, but set "From" flush left. In any case, the gutter is too wide.</p>
      <p>Personally, I don't like such deep paragraph indents, but you can argue that. In the monospaced manuscripts on 8.5 x 11 paper, five characters was common.  Typeset is usually either an em space (about two characters), or a pica (usually about an em + an en). The deeper your paragraph indent, the more trouble you're going to have getting even spacing on that first line (unarguable),  and the large space causes the reader to slow down (again unarguable). Why do you want them to slow down? The last, at least, is arguable. I'd say if you've done a good job writing, they shouldn't need to slow down.</p>
      <p>Etc.</p>
      <p>Combining good form with good thinking isn't easy, and probably isn't required for a term paper. But if, as John suggests, this is preparation for writing professional articles, you'll be a lot happier with the editor's markup if you learn early. And you may wind up doing a better job of presenting your text than the eventual designer does. Sad, but all too often true.</p>
      <p>In any case, good luck with it.</p>
