      <p>I have a different take on this dilemma, and in fact I don't think it's a dilemma at all.</p>
      <p>I am a book designer. I am also a college student, and when I write academic papers, I type them in Word, 1 inch margins, Times New Roman, double spaced. Because this is the accepted <em>manuscript</em> format. There are things that should be "designed" — like published papers — and things that essentially should not — like manuscripts of papers. In fact, designers typically hate it when authors try to "format" or "design" their manuscripts: that's not their job.</p>
      <p>I think it's great that you want to make your assignments as attractive and readable as possible, but you're really confusing two different things — manuscript guidelines for <em>typists</em> and typesetting as executed by <em>typographers</em>.</p>
      <p>Designing within constraints is always a good exercise, but this particular constraint is one that you will never encounter in the realm of designing published work. In fact, part of the whole point of the constraint is to <em>prevent</em> authors from trying to design their manuscripts and interfering with their uniformity.</p>
      <p>Sure, you pose an interesting question: what sorts of typefaces work best with large amounts of leading? But I really would stay away from trying too hard to design academic papers. I fully expect many people on Typophile to disagree.</p>
