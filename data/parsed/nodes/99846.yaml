      <p>How does one edit one’s own writing?</p>
      <p>The advantage of double-spacing is that one can see both “before” and “after” adjacent to each other, which provides perspective.</p>
      <p>And it may be that, upon reﬂection, the original text one crossed out is better than the revision, hence the editing mark for “stet” (let it stand).</p>
      <p>These days, if one edits directly in a word processing application, on screen, this facility vanishes (although one might have previous versions of a document saved for comparison).</p>
      <p>When I’m doing serious writing (as opposed to this frivolous Typophile stuff), I always typeset it double spaced (in one of my fonts), print it out, and edit/rewrite on that, between the lines.</p>
      <p>On the other hand, I suspect the proliﬁc Boz had productivity in mind when he limited the space between lines, giving himself less space to dally:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/A-page-from-the-manuscrip-007_5449.jpg"></div><p></p>
