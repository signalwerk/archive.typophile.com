    html: <p>Charles, I've not done a close comparison of character coverage between the Brill types and the most recent version of Gentium, but yes, I think the Brill types cover some stuff not in Gentium, but vice versa is also the case (Gentium covers extended Cyrillic, whereas the Brill types only support Slavic languages (reflecting Brill's publishing needs)). Also, the Brill family includes Bold and Bold Italic fonts, which are not present for Gentium. The Brill non-commercial license does indeed permit thesis/manuscript preparation.</p>
