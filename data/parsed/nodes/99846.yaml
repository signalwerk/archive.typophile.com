      <p>There can be a variety of reasons why your professor gives those constraints, such as to avoid weirdly formatted papers, or to allow room for the professor's comments, or to make it easier to compare the lengths of reports by different students.</p>
      <p>&gt; I'm genuinely interested in how designers<br>
      &gt; usually work with weird constraints</p>
      <p>I talk to the client and ask the reason for the constraints. Sometimes the constraints turn out to be reasonable after I learn the reasons for them, but if they still don't I try to convince the client that changing them is a good idea. </p>
      <p>If the client has constraints I consider unreasonable and won't budge after a discussion, sometimes I'll prepare 2 layouts, one using the client's constraints, and one without, and hopefully they'll see that my way is better. </p>
      <p>In your situation, I'd make a sample page 2 ways — using their design and using yours — and then have a private conversation with your professor, show them both designs and politely ask if yours is acceptable. Worst they can do is say no.</p>
