      <p>Sorry, I was more interested in the tangent!</p>
      <p>To answer your question: “Book” faces are generally considered best for wide columns and open leading. That’s because they usually have small x-heights and ergo long extenders. The long extenders mitigate the dreary effect of a plain page of text (nothing like the Butterick examples) seeming to be a stack of gray bars.</p>
      <p>Traditional examples are Garamond, Perpetua and Bembo. If these seem too quaint and/or humanistic, perhaps Sabon (not Sabon Next), which is quite neutral in effect for a Garalde, especially with its Italic having the same character count as the Roman.</p>
      <p>For a didone, Bodoni Book or my Scotch Modern.</p>
      <p>For a sans, Avenir.</p>
      <p>For a slab, Serifa or my Bodoni Egyptian.</p>
      <p>All these have ample extenders.<br>
      Avenir would be my ﬁrst choice.</p>
