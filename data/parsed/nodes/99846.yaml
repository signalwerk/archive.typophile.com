      <p><em>They ignore typos and wording</em></p>
      <p>Yes, but they didn't use to, and that is the context in which the format requirements developed. As I said previously, an argument can be made that formatting should change to reflect current realities, but I think understanding the context of those realities is important. In the case of college-level papers, it is worth bearing in mind that while the majority of students at any given time are undergraduates, almost everything about academic practice is geared to graduate students and faculty, and hence formatting requirements tend to follow those of journal and book publishing submission requirements, since that is what graduate students and faculty are working towards.</p>
