      <p>Sebastian - you are not submitting camera-ready material for publication, but, in effect, the contents of a manuscript. From the professor's point of view, having all submissions in a consistent format eliminates all conscious and sub-conscious positives and negatives related to "how it looks" and leaves only the important part, which in this case is the content.</p>
      <p>Requiring double-spaced submissions is very common, including legal briefs in many jurisdictions as well as submission of magazine articles. </p>
