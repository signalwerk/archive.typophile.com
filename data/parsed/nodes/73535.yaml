    html: |-
      <p>This is really funky, lowercase is especially charming. </p>
      <p>Q has just poked me in the eye — its tail.<br>
      Ss is falling backwards a bit.<br>
      u may benefit from a couple of units narrowing.<br>
      Ear of g is singing a different tune (angle of terminal).<br>
      Word space looks a bit narrow.<br>
      R may be too narrow. Bowl could be larger.<br>
      Counter of A could have a higher apex to avoid dark spot.<br>
      Crossbar of F is usually a notch lower than on E.<br>
      Contrast on stems of U could balance more.<br>
      Head of t looks dark.<br>
      Acute accents need better positioning. a needs further left, u further right.</p>
      <p>Is this a bold/semibold weight?</p>
