    html: |-
      <p>David, this is great stuff! You obviously have great talent for type design, my compliments (as one amateur to another).</p>
      <p>A few remarks:<br>
      /m/ looks a little too wide<br>
      /S/ and /s/ look a little too wide and tilted to the left<br>
      upper bowl of /S/ and /s/ could be narrower (looks upsidedown)<br>
      /N/ could use more contrast (make verticals narrower and diagonal fatter)</p>
      <p>You say this is for headlines so I understand is quite bold, but I'd really like to see a regular version! Can't wait for the numerals either!</p>
      <p>Keep going!</p>
