    html: |-
      <p>This is really really charming. I like the slight assymetry to the counters and the caps are very strong. A few little things:<br>
      The /a/ counter seems a little squarish when compared to the /q/ and /d/.<br>
      The /z/ is heavier than the other lowercase letters, maybe thin the diagonal?<br>
      There seems to be some inconsistency in your corners, some are rounded like the bottom most corners of the /c/ and /e/ and whereas most end in points.<br>
      I agree with Jean Paul that the /s/ and /S/ are top heavy and lean to the left.</p>
      <p>Despite that nitpicking, it's a very good design and I'm interested in seeing how it develops.</p>
      <p>jrl</p>
