    <p>Hey guys,</p>
    <p>I`m developing a font for an education magazine for my final university project. This is my first time making a font, so I would be very happy if you could give me some feedback. It`s a sans serif for headlines, and still with no name (taking suggestions). The kerning and metrics aren`t done yet. I recommend the PDF for better view.</p>
