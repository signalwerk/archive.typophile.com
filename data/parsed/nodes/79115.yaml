  date: 2011-02-15T15:28:00
  date_raw: 15 February 2011 - 3:28pm
  votes: 0
  html: |-
    <p>In the beginning was the Word. Then Chuck added other letters, numbers and signs.</p>
    <p>Some letters are so afraid of Chuck Norris that they form ligatures.</p>
    <p>FontLab never crashes for Chuck Norris.</p>
    <p>Chuck Norris can tell whether the font is Arial or Helvetica – blindfolded.</p>
    <p>Chuck Norris can literally draw a space glyph.</p>
    <p>Chuck Norris knows where the circle begins.</p>
    <p>Chuck Norris doesn’t have to make spacing and kerning, glyphs do that themselves.</p>
    <p>Chuck Norris can use zoom tool in FontLab up to the point where you can see specific atoms.</p>
    <p>It’s better not to see typefaces as good or bad; there is just a list of permitted fonts allowed to be (ab)used. List made by you know who.</p>
    <p>Chuck Norris doesn’t like children. That’s why Comic Sans is on that list.</p>
    <p>Chuck Norris once started designing a typeface when he was drunk. That night the “w” was born.</p>
    <p><em>Feel free to add other facts or image material.</em></p>
