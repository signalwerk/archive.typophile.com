      <p>"you can still perform tracking on the comma and endash, right?"<br>
      Right<br>
      "@numbers=[zero one two three four five six seven eight nine];<br>
      Where would you put this line of code?"<br>
      If you want to use this Class in another functions, declare it outside any features (globally). If it is to use only once - inside the feature.<br>
      [named lookups behave differently - declared globally or locally are always available]<br>
      "Do I need to define all number sets in "@numbers=[]"?"<br>
      All 10 digits are defined already.<br>
      Thanks DTY, excellent thread.</p>
      <p>"2x2=4<br>
      2 x 2 = 4"<br>
      feature ss02 {<br>
      sub @numbers x' @numbers by multiply;<br>
      sub @numbers space x' space @numbers by multiply;<br>
      } ss02;</p>
