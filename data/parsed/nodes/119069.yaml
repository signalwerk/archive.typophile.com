      <div class="comment-spam-body"><blockquote><p>What about spell check for those who can't or refuse to spell correctly? Years ago you might have said this is the editor's job but an automatic solution is much more practical and elegant and I think you would have admitted to that then.</p></blockquote>
      <p>The more usable spell checkers highlight the word as you're typing to provide an immediate indication that a change was made and to give the author the option of changing it back. The author also has the option of turning off the spell checker or adding custom spellings.</p>
      <p>If someone could come up with a way to do much the same thing with the same kind of user control and sophistication on the kinds of problems that you're referring to, that would be great. For example, if I could chose to have my text checked and/or corrected against the Associated Press Stylebook or the Chicago Manual of Style I'd be all for it. Unfortunately, OpenType scripting (or whatever it might be called) isn't really robust or extensive enough for something this complex.</p>
      <p>Anyway, many of these kinds of issues really are just matters of style — they're not necessarily right or wrong. Also, many are contextual in the sense that they might not always be appropriate. For example, substituting an en dash for a hyphen between two numbers would be great if the en dash is meant to indicate the missing numerical range. On the other hand, an en dash would be inappropriate between, say, the numerals in a telephone number. Likewise, 633 - 244 might be part of an equation or it might be a sequence in a serial number. Similarly, the sequence of a comma and an end quote mark is typically reversed in British and American style.</p>
      <p>I'm intrigued by what you have in mind, but you'd need to be very judicious in the implementation and aware of the limitations. You wouldn't want to inadvertently cause a bigger problem than you solved.</p>
      </div>
