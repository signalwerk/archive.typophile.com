      <blockquote><p>They're all scripting languages, whether it's Python, OpenType, CSS, Javascript etc.</p></blockquote>
      <p>In a very broad sense, OpenType features could be seen as a form of scripting language as they define a set of rules for the interpreter to follow, but what is usually called a scripting language has many more characteristics than that and basically no one in this industry refers to OpenType features as such. It’s also why no one calls CSS a scripting language, but rather a style description language.</p>
