      <p>1. What font editor are you using?<br>
      2. What application(s) are you testing your font in?<br>
      3. Have you read this: <a class="freelinking external" href="http://partners.adobe.com/public/developer/opentype/afdko/topic_feature_file_syntax.html " rel="nofollow"> Adobe Feature File Syntax information</a></p>
      <p>Scripting should not be necessary. Substitution allows for more than one-to-one, but you have to write it correctly and more importantly the app you intend to use the font in must support it. Check the Adobe Developer site linked in #3 above and read up on the syntax. I think it will save you a lot of time and frustration.</p>
