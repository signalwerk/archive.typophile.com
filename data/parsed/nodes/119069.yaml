      <p>What would one call writing OT features though?</p>
      <p>As for the punctuation fixes... I personally feel that to the extent that we can exert control over the typography we should do so. The graphic design course I'm following is completely lacking on typographic education and when I look at the typography on the streets I see errors all the time so apparently some solution is necessary. By the time we will graduate I'm convinced more than 90% still won't know the difference between a hyphen and an en-dash and still won't understand that the letter /x is not a multiply symbol. If the editors aren't preventing these errors, then who else should do it? I think an OT feature accessible by a stylistic set is a nice solution.</p>
      <blockquote><p>but I question whether the type designer should fill the role of a copy editor any more than the layout application should do so.</p></blockquote>
      <p>What about spell check for those who can't or refuse to spell correctly? Years ago you might have said this is the editor's job but an automatic solution is much more practical and elegant and I think you would have admitted to that then. To be honest I don't think the solution should be in the typeface but right now no one else is solving the problem, except for editors doing manual work but apparently many design agencies have no such editors.</p>
