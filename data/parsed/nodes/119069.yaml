      <blockquote><p>I'm tired of people over-hyphens so I wanted to script a fix for that, so in the standard ligatures I put the following code: sub comma hyphen by comma_endash;</p>
      <p>This replaces the comma followed by a hyphen with a ligature glyph where I have a comma followed by a line which is in between the hyphen and the en dash in length, which is more appropriate for denoting prices ($50,–).</p>
      <p>Now I want to do the same fix for "x" after numbers, so every time an /x is typed after a number it's automatically replaced by a multiply symbol.</p></blockquote>
      <p>It's one thing to replace a sequence of letters with a ligature, but I question whether the type designer should fill the role of a copy editor any more than the layout application should do so. A type designer's role, I think, should be to create a well-designed font, not to ensure that the end user adheres to a preferred punctuation style.</p>
