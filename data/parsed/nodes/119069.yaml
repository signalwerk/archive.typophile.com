      <p><cite>Regardless of whether writing OT features is considered scripting, it can be considered programming or coding.</cite></p>
      <p>I use the term 'Feature Coding' or 'OpenType Coding'.</p>
      <p>While the term 'programming' is frequently encountered, I personally think it is a bad idea to use this term in reference to OT coding because it ultimately can lead to all sorts of misconceptions about what you're actually doing when you code features. The language used by AFDKO (and, by extension, FontLab), describes static data tables. Thinking of it as a programming language can mislead people into thinking that they are creating algorithms rather than describing data, which will sometimes result in confusion over how a particular feature will actually behave.</p>
      <p>André</p>
