    html: |-
      <p>"sub [f f]' question by f_f.alt;"<br>
      I believe this line works like this:<br>
      IF \f \?  or \f \? is met THEN  \f  is substituted by \f_f.alt<br>
      [nota bene: second \f !]<br>
      so output is: \f \f_f.alt \question<br>
      You probably want:<br>
      sub f' f' question by f_f.alt<br>
      (see OpenType Feature File Specification, 5.f.i. Specifying a Chain Sub rule and marking sub-runs, Example 4. <a class="freelinking external" href="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html#5.f.i" rel="nofollow">Link</a>)</p>
    html_clean: |-
      <p>"sub [f f]' question by f_f.alt;"<br>
