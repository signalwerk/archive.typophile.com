      <p>It's generally a bad idea for a font to change the actual character codes instead of just changing glyph variation, even if this is done in an attempt to fix sloppy typesetting. Sometimes people really do intend the characters that they type. For example, consider an algebraic expression y = 3x + 15 </p>
      <p>There was a discussion of this some years ago here, with many useful comments on the problem: <a class="freelinking external" href="http://typophile.com/node/34108" rel="nofollow">http://typophile.com/node/34108</a></p>
