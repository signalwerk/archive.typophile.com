      <p>This is the newest Feature File Specification:<br>
      <a href="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html" title="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html">http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html</a><br>
      I think that type of automation is no good idea, unless you want to make your font unusable. In my example I used Stylistic Set, so user must chose this behaviour intentionally.<br>
      Anyway:<br>
      "sub comma hyphen by comma_endash;"<br>
      better<br>
      sub comma hyphen' by endash;<br>
      "replace 1 followed by x by a '1×'"<br>
      sub @numbers x' by multiply;<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Kerning_6721.jpg"></div><p></p>
      <p>full .fea file:<br>
      languagesystem DFLT dflt;<br>
      languagesystem latn dflt;<br>
      @numbers=[zero one two three four five six seven eight nine];</p>
      <p>feature ss01 {<br>
      sub @numbers x' by multiply;<br>
      sub comma hyphen' by endash;<br>
      } ss01;</p>
