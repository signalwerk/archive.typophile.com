      <p>One example of a similar mechanism not doing what it is supposed to do: When you type ' (U+0027), MS Word AutoCorrect will try to guess if this is supposed to be a single opening quotation mark (after a space) or a single closing quotation mark (after any character other than a space). Apostrophes are treated like closing quotation marks, but that’s not a problem—in English. In German, single closing quotation marks and apostrophes are not represented by the same character ’ (U+2019). Rather, apostrophes are ’ (U+2019), as in English, whereas single closing quotation marks are ‘ (U+2018). But AutoCorrect can’t tell. You could try to come up with a better substitution rule (based on the character that follows). As long as that doesn’t happen, each and every German-language document created in MS Word with AutoCorrect switched on will have the single closing quotation marks wrong.</p>
      <p>I would also advise against trying to improve the microtypography of a text through OpenType features, for two reasons: First, Murphy’s Law. Second, this kind of replacements will screw up the encoding of the text. It will lead to glyphs being replaced by other glyphs that don’t belong to the underlying character. This would also have the undesirable effect that, when you replace your typeface by another, all typographical ‘improvements’ will be lost. If you want to promote rule adherence on the microtypographical level, write a script for InDesign that performs replacements (like the ones you have in mind) on the character level. Many typesetters have created such scripts for themselves, but if you come up with something that’s cleverer and more comprehensive, there would certainly be a market for that.</p>
