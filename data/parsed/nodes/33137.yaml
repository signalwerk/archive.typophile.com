      <p>&gt; Where can I get my hands on this sort of thing, besides the usual suspects? </p>
      <p>19th Century Slabs:<br>
      <a href="http://fontbureau.com/fonts/Giza">Giza</a><br>
      <a href="http://www.fontshop.com/fonts/downloads/linotype/clarendon_std_ot_virtual/">Clarendon</a><br>
      <a href="http://www.fontshop.com/fonts/downloads/elsner_flake/egyptian/">Egyptian</a> (E+F)<br>
      <a href="/wiki/Aldo%252BNovarese" class="wiki-create">Aldo Novarese</a>’s 1950s interpretation: <a href="http://www.fontshop.com/search/?q=Egizio">Egizio</a> and followers <a href="http://www.fontshop.com/fonts/downloads/creative_alliance/egiziano_black/">Egiziano</a>, <a href="http://www.fontshop.com/search/?q=Belizio">Belizio</a><br>
      <a href="http://www.fontshop.com/fonts/downloads/elsner_flake/volta/&amp;sample_text=DICKSON%E2%80%99S&amp;sample_size=36">Volta</a> - another wide slab from the ’50s, and probably the closest to your sample.</p>
      <p>19th Century Sans:<br>
      <a href="http://www.fontshop.com/fonts/downloads/process/maple_ot/">Maple</a><br>
      <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_hydra/">FF Hydra</a>, <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_hydra_text/">FF Hydra Text</a><br>
      <a href="http://www.fontshop.com/fonts/downloads/scangraphic/venus_sb/">Venus</a><br>
      <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_bau/">FF Bau</a>, <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_bau_italic/">FF Bau Italic</a><br>
      <a href="http://www.fontshop.com/fonts/downloads/linotype/basic_commercial_ot_virtual/">Basic Commercial</a><br>
      <a href="http://fontbureau.com/fonts/Rhode">Rhode</a></p>
