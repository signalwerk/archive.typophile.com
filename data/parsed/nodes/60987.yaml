      <p>I don't think users should be encouraged to apply stylistic sets in a piecemeal manner.<br>
      IMO stylistic sets are to be used globally, e.g. in style sheets applied to paragraphs.<br>
      The "calt" feature is most certainly global, on by default.</p>
      <p>If you provide a variety of stylistic sets which have different looks (e.g. degrees of complexity), then the user can try them out on a piece of text and see which looks best. They may even be applied cumulatively.</p>
      <p>If users are really dissatisfied with the options available, then they can cherry-pick from the glyph palette, with no features applied.</p>
