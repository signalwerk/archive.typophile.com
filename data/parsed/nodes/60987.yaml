    html: |-
      <p>Apparently no one has any thoughts on this matter.</p>
      <p>I've come up with a tentative solution which involves a set of 'clean-up' substitutions at the end of each of the relevant features, i.e.</p>
      <p>sub @hasnorightjoin @hasleftjoin' by @hasnoleftjoin;<br>
      sub @hasrightjoin ' @hasnoleftjoin by @hasnorightjoin;</p>
      <p>This seems unaesthetic to me though since it involves changes of the form X -&gt; Y -&gt; X and it also increases the size of the font's tables.</p>
      <p>So as a follow-up question, should boundry issues of this sort be the font's responsibility or the application's responsibility?</p>
      <p>On the one hand, I did a quick check of several OT fonts with contextual alternates, and I couldn't see anything in their GSUB code which looked like it was there to deal with boundary issue (though admittedly I find it more difficult to follow other people's decompiled tables then to follow my own where I am familiar with the classes involved), suggesting that other designers may not be worried about this issue.</p>
      <p>On the other hand, InDesign (CS3) clearly passes the context to the font when applying the calt feature even if that context doesn't have calt active for it.</p>
      <p>Is there an 'official' position on this issue? </p>
      <p>André</p>
