      <p>I agree with you regarding how stylistic sets should be used. It isn't my intention that users should apply the features to partial words, but I've become bogged down in the possibility that they <em> might </em>. So perhaps a better way of phrasing my question would be: "how much effort should one employ in dealing gracefully with strange things the user might do?"</p>
      <p>BTW in my earlier post I was fixating on features which created joining variants of characters, but of course final or initial variants are also possible, so it cannot be left up to the the application to simply ignore context which doesn't have the feature selected. Any attempts to deal gracefully with contextual features applied to partial words would have to be dealt with by the font rather than the application. But is it worth the effort?</p>
      <p>André</p>
