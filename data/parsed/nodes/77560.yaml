    <p>Hi.</p>
    <p>This is the font I am trying to identify:</p>
    <p><img>http://d.imagehost.org/0340/Untitled-1_20.jpg</p>
    <p>I havent been able to find anyone who can identify. I used the whatthefont generators etc but they never got the font right. On the site where I found the font it is called "GG-Regular", but when I search this font it doesnt come up, so I think this is just what they decided to call it.</p>
    <p>Any ideas?</p>
    <p>James</p>
