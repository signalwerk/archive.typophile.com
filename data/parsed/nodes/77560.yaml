      <p>Apparently "GG-Regular" isn't the name of a typeface, but rather the name of a style within a typeface:</p>
      <p><a class="freelinking external" href="http://www.fontshop.com/fonts/downloads/neufville/fontana_nd_gg_regular_expert_set/" rel="nofollow">http://www.fontshop.com/fonts/downloads/neufville/fontana_nd_gg_regular_expert_set/</a></p>
      <p>Your image,</p>
      <p><a class="freelinking external" href="http://d.imagehost.org/0340/Untitled-1_20.jpg" rel="nofollow">http://d.imagehost.org/0340/Untitled-1_20.jpg</a></p>
      <p>reminds me of DIN, although it seems more squarish. It's even more squarish than Uni Sans...</p>
      <p><a class="freelinking external" href="http://new.myfonts.com/fonts/emtype/geogrotesque/" rel="nofollow">Geogrotesque</a> seems to come close.</p>
