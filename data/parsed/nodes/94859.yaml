    html: |-
      <blockquote><p>Currently, 6 computers would need constant access to the font library (5 Macs and 1 PC). This number may increase in the future but not drastically.</p></blockquote>
      <p>Both the Extensis (UTS/UTC) and Linotype/Monotype (FontExplorer X Pro) tools would allow you to do this and with significantly more computers. I have seen successful implementations of both tools with hundreds of clients per server.</p>
      <blockquote><p>The designers would need the ability to search and preview all the fonts in our library. Does font server allow to do that without importing everything (hundreds) first to the client?</p></blockquote>
      <p>In order to preview the fonts you also need to download them to the client computer. Usually you only perform one download per client and so the process of previewing fonts is not slowed down by constant network traffic. By way of example, if you have 10,000 fonts you would perform one download per client, which might take 20 minutes depending on the network transfer speeds, server location, etc... but then you should find that each client can preview and organise that font data seamlessly. You would then only encounter new network traffic when new fonts were added to the server. The mechanisms for downloading and previewing are different for each product but I am not clear on the technicalities.</p>
      <blockquote><p>Ability to check if a font contains specific features and glyphs.</p></blockquote>
      <p>FontExplorer has a sophisticated tool built in that allows users to look at metadata, characters, Unicode values and optical and metric kerning. UTS/UTC uses the native character palette tools to display this information, at least in the Mac environment.</p>
      <blockquote><p>Auto activate fonts in Adobe CS (5, 5.5)</p></blockquote>
      <p>Both tools currently support auto-activation for these versions of Adobe CS.</p>
      <blockquote><p>Ideally, we'd like to be able to perform search based on keywords (like you do at any online font store) and choose/activate the right typeface based on preview.</p></blockquote>
      <p>The functionality associated with this is currently more sophisticated in the Extensis product.</p>
