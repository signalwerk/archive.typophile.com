      <blockquote><p>Why would such inconvenience be needed?</p></blockquote>
      <p>I think it has to do with the mechanism for displaying the type requiring a local instance of it in order for the rendering to occur. Otherwise the rendering is being done across the server connection, which would cause a considerable amount of server traffic. These two tools approach this differently and I cannot speak definitively for either one, it is possible that the UTS tool allows server browsing without a download occurring.</p>
      <p>One of the upsides of the download approach is that users can then work offline from the server until they require any new additions, particularly useful for laptop users.</p>
