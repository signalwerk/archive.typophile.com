      <blockquote><p>what is the advantage of the (more expensive) font server?</p></blockquote>
      <p>With a large client distribution base the advantage is having a single repository of fonts that everyone refers to. This gives you the ability to configure that repository based on the requirements of specific users, which is particularly useful when you start to look at larger user numbers and need to adhere to smaller license figures, e.g., you may have some fonts licensed for only 10 users and so need to restrict access to those fonts.</p>
      <p>Both tools also provide a fallback mechanism through the server option which allows you to continue working in the event that something should happen to the primary server. Each tool delivers this fallback in a different way but ultimately to the same end.</p>
