    html: |-
      <p>UTS deals with this problem by downloading the font, yes. This is a physical and logical requirement for client-side rendering, and allows easy changing of sample text content, size, etc. Fonts downloaded by UTS solely for preview purposes are NOT made easily accessible on the client machine, however. Whether they are cached or not depends on the replication mode the user is set to (on demand, on demand local cache, or "all").</p>
      <p>Do you have a network admin type person to set up the system, and help with occasional network-related issues? Although it is not rocket science, some familiarity with technical network/server tech is required for setup of either UTS or FEXS.</p>
