    <p>Hello,<br>
    My company wants to sort out font management issues and, after looking at different options, we're considering buying software from either Extensis or Linotype.<br>
    But the bigger question than which software maker to go with, however, is <em>should we buy several client licenses or a server license</em>? We couldn't fully understand the exact way font server works, so any explanations (<em>as you'd talk to a child</em>) are welcome.</p>
    <ol>Could you recommend the right choice based on the below?
    <li>Currently, 6 computers would need constant access to the font library (5 Macs and 1 PC). This number may increase in the future but not drastically.</li>
    <li>The designers would need the ability to search and preview <em>all</em> the fonts in our library. Does font server allow to do that without importing everything (hundreds) first to the client?</li>
    <li>Ability to check if a font contains specific features and glyphs.</li>
    <li>Auto activate fonts in Adobe CS (5, 5.5)</li>
    </ol>
    <p>The second point is very important to us as we have hundreds of fonts, so the discoverability is crucial. Ideally, we'd like to be able to perform search based on keywords (like you do at any online font store) and choose/activate the right typeface based on preview.</p>
    <p>Also, what are your preferences for storing fonts on a server/hard drive? Do you put all the fonts to one folder? Do you sort them according to style, foundry, format etc? Would you use Mac or PC for a font server (our general file server is Windows PC)?</p>
    <p>If you could point us in the right direction, that would be great. Thanks!</p>
