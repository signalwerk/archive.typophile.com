      <p>It maybe a little cliched but i generally like it and think it's very appropriate, though it does look a bit too child-like at the moment.</p>
      <p>I would...</p>
      <p>get rid of the blocks<br>
      have the 3 letters in the 3 colours<br>
      make the 3 colours a bit less primary<br>
      have the 3 letters just touching<br>
      make the ends of the strokes only 50% rounded<br>
      make the arrowhead not quite so rounded<br>
      lower the curve of the U and enlarge the arc of the G a little so they look as big as the X</p>
      <p>I don't know exactly what it will look like if you do all that. Quite possibly worse :)</p>
