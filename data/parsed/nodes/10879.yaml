    html: "<p>What do you two think of Emil Ruder's spacing test in <i>Typographie</i>? On the left are words which are difficult to set due to awkward spacing issues. On the right are your control letters, that is, letters that generally don't cause trouble. According to Ruder, if your spacing is right, the overall color of left vs. right should be equal. If the spacing is too tight, the left would appear too light and the right too dark. <br> <br>The words are as follows: <br> <br>Left: <br></p><table><tbody><tr><td>vertrag</td><td>crainte</td><td>screw </td></tr><tr><td>verwalter</td><td>croyant</td><td>science </td></tr><tr><td>verzicht</td><td>fratricide</td><td>sketchy </td></tr><tr><td>vorrede</td><td>frivolité</td><td>story </td></tr><tr><td>yankee</td><td>instruction</td><td>take </td></tr><tr><td>zwetschge</td><td>lyre</td><td>treaty </td></tr><tr><td>zypresse</td><td>navette</td><td>tricycle </td></tr><tr><td>fraktur</td><td>nocturne</td><td>typograph </td></tr><tr><td>kraft</td><td>pervertir</td><td>vanity </td></tr><tr><td>raffeln</td><td>presto</td><td>victory </td></tr><tr><td>reaktion</td><td>prévoyant</td><td>vivacity </td></tr><tr><td>rekord</td><td>priorité</td><td>wayward </td></tr><tr><td>revolte</td><td>proscrire</td><td>efficiency </td></tr><tr><td>tritt</td><td>raviver</td><td>without </td></tr><tr><td>trotzkopf</td><td>tactilité</td><td>through </td></tr><tr><td>tyrann</td><td>arrêt</td><td>known</td></tr></tbody></table> <br> <br>Right: <br><table><tbody><tr><td>bibel</td><td>malhabile</td><td>modo </td></tr><tr><td>biegen</td><td>peuple</td><td>punibile </td></tr><tr><td>blind</td><td>qualifier</td><td>quindi </td></tr><tr><td>damals</td><td>quelle</td><td>dinamica </td></tr><tr><td>china</td><td>quelque</td><td>analiso </td></tr><tr><td>schaden</td><td>salomon</td><td>macchina </td></tr><tr><td>schein</td><td>sellier</td><td>secondo </td></tr><tr><td>lager</td><td>sommier</td><td>singolo </td></tr><tr><td>legion</td><td>unique</td><td>possibile </td></tr><tr><td>mime</td><td>unanime</td><td>unico </td></tr><tr><td>mohn</td><td>usuel</td><td>legge </td></tr><tr><td>nagel</td><td>abonner</td><td>unione </td></tr><tr><td>puder</td><td>agir</td><td>punizione </td></tr><tr><td>quälen</td><td>aiglon</td><td>dunque </td></tr><tr><td>huldigen</td><td>allégir</td><td>quando </td></tr><tr><td>geduld</td><td>alliance</td><td>uomini</td></tr></tbody></table><p></p>"
