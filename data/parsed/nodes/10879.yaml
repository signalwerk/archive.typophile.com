    html: <p> Not to mention "oqo"... <br> <br>An exhaustive cryptic ream of control strings is one (admittedly useful) thing, a short memorable phrase for quick evaluation (especially of somebody else's work) is another. <br> <br>So, is there a compact, non-contrived phrase (or two) where each letter is between both a pair of flats and a pair of rounds? That would be a superb metagram indeed, but I won't hold my breath. <br> <br>hhp </p>
