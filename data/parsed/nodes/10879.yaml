  html: "<p> In evaluating a font, it would be nice to have a good test phrase. <br> <br>Pangrams (like \"The quick brown fox ...\") are nice, but they tend to sacrifice too much for compactness; a somewhat more elaborate sample text would make evaluation much richer. <br> <br>So I started thinking about what constitutes a good test phrase, and here are the factors which I think need to be balanced against each other: <br> <br>1. It should be short. <br> <br>2. It should show each letter in the middle of other letters. This is to facilitate evaluation of spacing, noting that by \"propagating\" the evaluation chances are much better for arriving at a firm conclusion. For example, in the word \"major\", if the \"aj\" is loose, you could look at other words that have an \"a*\" (and so on) to figure out where the problem is. It's not water-tight, but it helps. <br> <br>3. The letters should occur alphabetically (for easy location). <br> <br>4. It shouldn't necessarily have a self-contained coherent meaning, but it should be a \"normal\" English sentence: using words that occur frequently, and no kinky Egyptian sex, please. But some awkwardness is probably inevitable. <br> <br>5. It should contain some extras like: punctuation, quotes, apostrophe*, hyphen, and some special-case words like \"the\", \"I\" and \"a\" (the latter two especially helpful in evaluating an italic). <br> <br>6. It should be easy to memorize. <br> <br>* The most frequent words containing an apostrophe are: \"don't\", \"it's\", \"I'm\", \"that's\", \"I'll\", \"couldn't\", \"can't\", \"you're\". And I think \"I'll\" provides the biggest spacing challenge. <br> <br>In trying to maximize the \"normalness\" of the phrase, I talked to my good friend, Linguistics, and compiled the list of the most common [English] words containing each letter (as a middle letter): <br> <br>a: that <br>b: about <br>c: which <br>d: made <br>e: they <br>f: after <br>g: through <br>h: the <br>i: with <br>j: major <br>k: like <br>l: all <br>m: some <br>n: and <br>o: for <br>p: people <br>q: require <br>r: are <br>s: these <br>t: with <br>u: but <br>v: have <br>w: two <br>x: next <br>y: system <br>z: size <br> <br>Since the more common letters occur in many words, I managed to reduce this list down to 16 words. <br>(BTW, this is where I decided that it should be two sentences - that and wanting to put in more puctuation.) *However*, in the case of frequent letters, this list was more of a hindrance than a help, and it was more effective to just think of common words myself; but for the less frequent letters, it helped a lot. <br> <br>So, after a good amount of wrestling, here's what I've ended up with: <br> <br>- <br>Incredibly, he makes a major life-change! For example: </p>"
