    html: <p> &gt; "Making the Alphabet Dance" <br> <br>I ran into that gem of book last year, and suspect that the author has no idea how useful it is to type designers! <br> <br>&gt; the next challenge is to sneak in figures and punctuation and so on, which is a worthwhile effort. <br> <br>Yes, it's just difficult to draw the line between something that's memorizable (and not "memorable" as I wrote above) versus something comprehensive - not that any text can be perfectly so. <br> <br>Good luck with your "Philosopher's Stone" efforts, it's a very worthy thing. <br> <br>hhp </p>
