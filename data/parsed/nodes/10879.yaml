    html: "<p> &gt; Emil Ruder's spacing test <br> <br>I didn't know about it! It seems pretty cool, especially since it uses many languages. BTW, what's the language in the first column of \"Right\", Swedish? I think Spanish would be more useful (and an English in each better than a French). <br> <br>Jared, could you possibly provide a plain-text version? Copy-pasting that is bringing forth a mess. <br> <br>BTW, two things I worry about: <br>1. How to arrange the parts/words to get a good view of the color? <br>2. In evaluating color across the two sets of words, texture might interfere, noting that the \"Left\" set naturally has a lot of diagonals, descenders, etc.* Add to that the different textures that different languages have (like the accents in French), and it gets a bit muddy. I think maybe sticking to one language (at least at a time) might be safer. <br> <br>* I had to work through an especially thorny incarnation of this issue when trying to balance Patria and Nour. I squinted so much, I think I got crow's feet as a result... <br> <br>Also: It seems to me that the \"tight =&gt; left lighter\" rule might apply a lot more to metal fonts: since digital fonts can easily have gobs of kerning, this isn't necessarily true. What might be a good idea is to disable kerning when doing this test, and in addition look at the number of kerning pairs the font has: if the non-kerned color is bad, *and* the fonts has an unusually large number of pairs, then the basic spacing could be improved. (Come to think of it, this kerning issue applies just as much to the metagram idea too.) <br> <br>Lastly, InDesign's \"optical spacing\" feature might be an enjoyable wrench to throw in this mix. <br> <br>hhp </p>"
