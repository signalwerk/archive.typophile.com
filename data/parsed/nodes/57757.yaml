  html: |-
    <p>Hi<br>
    I'm wondering if there's such a thing as a non-breaking period/full stop. My e-mail address is <a href="mailto:firstname.surname@company.com">firstname.surname@company.com</a> and it looks really ugly over a line break because I end up with my first name at the end of one line and my surname at the start of the next line.<br>
    Is there a non-breaking period or some other way to get InDesign to keep the whole thing together?<br>
    Thanks :)</p>
