      <p>Well, there is something to be said for releasing bug fixes as they are noticed, rather than to hold off releasing an update for months or years while there is a known flaw in the current release, then charge for a full upgrade price for what amounts to making the thing you bought work as originally advertised plus a token new feature. </p>
      <p>Not to say that's necessarily the case with any of the above programs, but I have experienced the latter treatment from some vendors. </p>
      <p>I prefer the approach that releases (as) frequent (as necessary) updates with a built-in notification mechanism in the application. Of course it's nice when they get it totally right the first time, but that just doesn't happen in the world of software development anymore (and was rare when it did).</p>
