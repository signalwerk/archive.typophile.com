      <p><cite>Releasing a lot of bug fixes in a short time means that one’s quality control is soemwhat lacking &amp; the programming sloppy.</cite></p>
      <p>I must respectfully disagree.</p>
      <p>In the absence of specific evidence to the contrary, I'd assume the same number of bugs are getting fixed per year, regardless of number of updates. Any program of really large size such as a serious font management application has hundreds, maybe even thousands of "known issues." In and of itself, the difference between an update every three years and three updates a year tells you nothing in particular about sloppy programming or quality control.</p>
      <p>Personally, I'd prefer more frequent updates, but I really consider it a personal preference rather than anything else. </p>
      <p>Cheers,</p>
      <p>T</p>
