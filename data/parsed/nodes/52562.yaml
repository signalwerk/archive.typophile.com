      <p><cite>OTOH: Releasing a lot of bug fixes in a short time means that one’s quality control is soemwhat lacking &amp; the programming sloppy.</cite></p>
      <p>This is true; known issues should be eliminated before release whenever possible. However, when problematic issues do make it into a release, they should be addressed as quickly as possible.</p>
      <p>I look back to the last year a certain small yet significant developer was around as a graphics software company. They had many products which were incomparable with their feature sets, but released on a schedule determined more by marketing concerns than whether the software was really ready. Some had so many bugs as to be barely workable. But, rather than releasing an immediate patch to address these issues, they let them go for extended periods of time until put forth as an omnibus upgrade. All in the interest of <em>looking like</em> their quality control wasn't as sloppy as it was.</p>
      <p>Then, for some reason they decided the would become an "internet company" and sold off all their graphics software properties to other companies (in some cases back to the original developers they licensed them from). I haven't heard from this company since.</p>
