    <p>Hello,</p>
    <p>I've done some research but not sure if I'm choosing the right aesthetic choice. Being a student Graphic Artist for some time now, yet I still have much to learn.</p>
    <p>My question, I'm designing a film-magazine cover, contents, and several spreads for my portfolio to graduate from school this year. Moreover, I have selected Mr. Olson's Klavika typeface for call-outs, headlines etc, but I;m not sure what serif face I use for body copy that will compliment Klavika. As of this moment I'm using Caslon 240 I believe.</p>
    <p>Are there any suggestions that I may consider?</p>
    <p>Best,<br>
    Aaron</p>
