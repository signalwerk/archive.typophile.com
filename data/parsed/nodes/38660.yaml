    <div class="info">Submitted by <a href="/user/7006" title="View user profile.">paul d hunt</a> : 31.Oct.2007 12.20pm </div>
      <p><a rel="nofollow" target="_blank" href="http://www.helveticafilm.com/"><img src="http://www.helveticafilm.com/images/newsletter.header.gif" border="0"></a><br>
    <br><br><br><br>
    1. DVD release date changed<br>
    2. New York run extended (this is the final week, really!)<br>
    3. Screenings this week in Estonia, England, Denmark, Belgium, Georgia, more<br>
    <br><br><br>
    <img src="http://www.helveticafilm.com/images/swedishlovehate.jpg" border="0" vspace="0"><br>
    <em>Souvenirs from Monday's event in Stockholm</em></p>
    <p><br><br><br>
    <strong>DVD RELEASE DATE CHANGED TO 11/20</strong><br>
    Due to some unavoidable manufacturing delays, the release date of the retail DVD of <em>Helvetica</em> has been pushed back two weeks to November 20th. The DVD will not be available in stores worldwide until that date. If you've pre-ordered the DVD from our site (or the limited-edition box set) your copy will be shipped one week prior to the new date. Institutional DVD orders are not affected. Our apologies on this, sorry for any inconvenience.<br>
    <br><br><br><br>
    <strong>NEW YORK RUN EXTENDED... BUT THIS IS IT!</strong><br>
    <br><br><br>
    <em>Helvetica</em> has been extended for an 8th week at the <a rel="nofollow" target="_blank" href="http://www.ifccenter.com">IFC Center</a> in Greenwich Village. But we've been assured this will be the last week... we have to give those other films a chance, after all. So if any of you New Yorkers have been procrastinating, <a rel="nofollow" target="_blank" href="http://www.ifccenter.com">this is it</a>. Presented, of course, by  our friends at <a rel="nofollow" target="_blank" href="http://www.plexifilm.com">Plexifilm</a>, <a rel="nofollow" target="_blank" href="http://www.veer.com">Veer</a>, and <a rel="nofollow" target="_blank" href="http://www.apublicspace.org">A Public Space</a>.<br>
    <br><br><br><br>
    <strong>SCREENINGS THIS WEEK IN ESTONIA, ENGLAND, DENMARK, BELGIUM, GEORGIA...</strong><br>
    <br><br><br>
    October 31 &amp; November 1<br>
    <a rel="nofollow" target="_blank" href="http://www.ekm.ee/kumu.php">Kumu</a>, Tallinn, Estonia<br>
    Part of the Swiss Design Festival. Q&amp;A with Gary Hustwit after the October 31st show.<br>
    <br><br><br>
    November 2 - 15<br><a rel="nofollow" target="_blank" href="http://www.ica.org.uk">Institute of Contemporary  Arts</a>, London, England<br><br>
    An encore run at the ICA!<br><br></p>
    <p>November 7 - 11<br><a rel="nofollow" target="_blank" href="https://sheffdocfest.com/">Sheffield Doc/Fest</a>, Sheffield, England<br><br></p>
    <p>November 8<br><a rel="nofollow" target="_blank" href="http://www.aiga-atl.org/">AIGA Atlanta Screening</a>, Atlanta GA, USA<br> Woodruff Arts Center. Q&amp;A with Gary Hustwit and Matthew Carter<br><br></p>
    <p>November 8 &amp; 9<br><a rel="nofollow" target="_blank" href="http://www.muhka.be/toont_film_kalender.php">MuKHA</a>, Antwerp, Belgium<br> <br></p>
    <p>November 9 - 15<br><a rel="nofollow" target="_blank" href="http://www.athenscine.com">Athens Arthaus Cine</a>, Athens GA, USA<br><br></p>
    <p>November 9 - 18<br><a rel="nofollow" target="_blank" href="http://www.cphdox.dk/d1/fa.lasso?e=1">CPH:DOX Festival</a>, Copenhagen, Denmark<br>
    <br><br><br><br>
    Cheers!</p>
