      <p>I'd say that visually this is better than the alternative (introducing a big white space to the right under the top of kaf. Optically, the margins are better aligned by allowing parts of some letters to intrude on the margins than by allowing white space to intrude into the text.</p>
      <p>If you do want to affect this by kerning, you can do so contextually by increasing the right side spacing of the kaf glyph EXCEPT when preceded by any other glyph (including the wordspace glyph). Note, however, that this will also affect the kaf when it occurs at the beginning of any text run, e.g. change of font, change of direction.</p>
