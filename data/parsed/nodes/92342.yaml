      <p>I claim no special expertise, but this looks like an instance where you should invoke the <strong>init</strong>—initial forms—feature, since line breaks and paragraph starts are part of the document structure code and not of the font itself.</p>
      <p>Additionally, you might want to consider a contextual alternate, too, for instances where the kaf appears after a space.</p>
