    <p>I am facing a problem in my Arabic font,  please help me if there is any solution. The problem is shown in the image below. When the kaf comes in the beginning of a line or in the start of a paragraph than the slanted stroke of kaf appears a little outward towards right side as compared to other characters. As appearing in the middle line of the image in red colour, the kaf stroke is crossing the right side boundary. </p>
    <p>Yes, I have made the kaf slanted stroke outside the glyph right metrics similar to the image but I want any possible solution for it like kerning or alternate glyph. Is it possible to apply kerning to a specific letter or use alternate shape for it whenever that letter falls in the beginning of a line or paragraph, not in all situations.  </p>
    <p>Thanks.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Untitled-1_5829.jpg"></div><p></p>
