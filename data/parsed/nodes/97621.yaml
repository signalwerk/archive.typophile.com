    <p></p><div class="imageWrap"><img src="http://typophile.com/files/2012-10-28_00012text3_5530.png"></div><br>
    This is a compilation of glyphs used on signs related to the Hyperion Corporation in the game Borderlands 2.<br>
    These are slanted oddly due to perspective of the viewer in the reference photos, and because many of the signs use slanted text that changes slant across each line. Differing sizes of text are because I left all text at the resolution they appeared in the references.<br>
    The signs only use capitals, and the period is a square. Most of the font is pretty unremarkable, but hopefully the G is distinctive enough to be recognized.<p></p>
    <p>The attached file is the unmodified image that these were crudely ripped from.</p>
