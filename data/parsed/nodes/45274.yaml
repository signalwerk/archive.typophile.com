  html: |-
    <p>Hello typophiles,</p>
    <p></p><div class="imageWrap"><img src="/web/20080907171356im_/http://typophile.com/files/numbers1_6672.jpg"></div><p></p>
    <p>I need your help in identifying each of these numbers. They are all architectural numbers and inscriptions found in Melbourne, Australia and are the source for my Honours project.</p>
    <p>I’m no expert in this, but I’m guessing that they’re all custom? (The ’83’ looks like an elongated, condensed Bodoni, though). I need to know if any of these has been revived or if there’s any similar font out there.</p>
    <p>Any help will be much appreciated. Thanks.</p>
    <p>cheers<br>
    Christa</p>
    <p>p.s. Another thread regarding my project: <a href="https://web.archive.org/web/20080907171356/http://typophile.com/node/45275" title="http://typophile.com/node/45275">http://typophile.com/node/45275</a></p>
