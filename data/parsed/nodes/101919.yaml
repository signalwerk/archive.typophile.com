      <p>@crossgrove: Why not post the pillow photo for all to see? And I agree with anti-swag. Kitcher things are always useful. Keep price point in mind. I looked into hackets and found some up to $300 with leather sleeves and custom embroidery. Even if we could Kickstarter the initial run, we’d still have to buy them. I don’t think I can afford a $300 jacket right now, but I’ll keep looking.</p>
      <p>A small stool would be handy. I agree with scarf and kitchen. A cookbook where we all pick our favourite recipe (that you are capable of preparing) and design the page? Might be an opportunity for members who are also type designers to allow others to use their fonts for this purpose.</p>
      <p>Utilitarian, something we all need and use, food, hopefully a clever type correlation, capable of recieving custom treatment such as a silk-screen or embroidery, not landfill, not too expensive…</p>
      <p>Can anyone else think or other pragmatics?</p>
      <p>I find listing them to be helpful in idea generation (for me at least).</p>
      <p>Fountain pen<br>
      Business card holder<br>
      Bookmark (nice and cheep)</p>
      <p>(and of course after a month or so we'll have to make a decision and actually do it.)</p>
