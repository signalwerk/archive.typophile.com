  html: |-
    <p>Thoughts for Typophile merchandise? Pitch in if you like. Just a fun idea sparked from another thread. You never know, we may end up with cool matching jackets. Like a bad-ass gang, only with fonts instead of ghetto-weapons (mine is “length of chain.”)</p>
    <p>So far, someone has mentioned “letter sweater.”</p>
    <p>Following that logic, I would opt for <a href="http://www.jacketsinside.com/varsity-jackets-for-men/red-white-classic-varsity-jacket-for-men.html" rel="nofollow">varsity jackets</a> (we can deal with embroidery later).</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Typophile_jacket_5968.jpg"></div><br>
    <em>Figure 1</em>: A potential (unembroidered) red and white Typophile varsity jacket.<p></p>
    <p>And I’m not joking. Kickstarter could <strong>easily</strong> help produce an initial run.</p>
