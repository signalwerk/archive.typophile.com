      <p>Competition in design and typography software is healthy and vital to consumers who need it to be well supported, updated with features we need, and reasonably priced for our typically meager means.  I am sorry to see Macromedia absorbed and hope a new player has the guts to join the fray.<br>
      I used and championed Quark since version one (complete with parent/child boxes) and for years hoped they would pick up on the customer service thing.  They refused and hence will die.  I feel it is too late for anything with the Quark brand to succeed.  Someone else will have to buy it, change the name and do it right to succeed in the Adobe only world.  I do not fault Adobe, they have done a good job and should be applauded.  I just feel that the lack of competition will take its toll and end up with less happy customers than now.</p>
      <p>ChrisL</p>
