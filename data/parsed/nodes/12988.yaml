      <p>Hmmm;<br>
      I hope Adobe does not go the same way as QuarK.<br>
      I’ve downloaded a couple of CS2 tryout apps (golive &amp; illy) today, and I was very, very disappointed. </p>
      <p>/Rant mode on/</p>
      <p>Golive is outdated IMHO, and tries to look like a pro web-authoring app but still is a kind of bloated wysiwyg web-editor. From a professional CSS-webdesigner point of view, it seems useless.<br>
      NVU is freeware and still in progress, but does a far better job. </p>
      <p>Illustrator seemed more like an 11.5 update than a 12. Agreed, the trace-tool is cool, and the control-palette is a fine idea, but there are still features missing.  And the UI consistency between the CS apps is not much better either. Somebody has to tell those guys that UI goes beyond the fact that every palette has the same “ugly rounded cornered tab”. </p>
      <p>I couldn’t see Indesign CS2 yet, but it seems the updates there are more substancial. </p>
      <p>Guess I’ll keep my money ;-)</p>
      <p>/Rant Mode Off/</p>
