      <p>Ahhh, that’s lovely. I was getting confused between the actual box colour and whether that had a fill and what trap settings were applied. Didn’t realise that I could then select the text  and the attributes could then be re-set to accomodate. I could kick myself.</p>
      <p>As I said, I have much more experience with Quark and really must start to seriously use ID so I can get around things like this. That preference with the always overprint black kind of threw me. What was happening was the overprint black box was ticked so no matter what I set the attributes to, I could never get the black text to knock out….</p>
      <p>Also I have to spend more time on the Trap Styles as well. In Quark there is the single trapping dialog. You select the item, be it text, picture, filled box etc and simply select the trapping amount, overprint, knockout for each item. That’s my next task for gaining more experience in ID.</p>
      <p>Thanks again Tina</p>
