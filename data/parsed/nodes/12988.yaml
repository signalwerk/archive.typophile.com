    html: |-
      <p>The company I work for (I work in Reprographics) has just updated to Quark 6.5. The first and foremost reason is that they have literally thousands of existing Quark documents that are continuously being twaeked and reprinted. We experimented with opening the Quark docs in InDesign but too much changed on import to make it economical. Because we have a pure pdf workflow we were able to look at other options for what app to use. Quark was still the easiest transition for us and our work flow.</p>
      <p>Having said that, I am disappointed with the performance of 6.5. Having upgraded from v5 (and hence working in Classic) I was expecting the OS X native version to fly. It doesn’t. It is however still a good layout and typesetting app which is what it is supposed to be.</p>
      <p>When dabbling with InDesign I find I cannot control the trapping as well as I can in Quark. For example InDesign has a preference for overprinting black and it is either ticked or not ticked. In Quark you control the trapping for each item in the Trapping palette which is exactly what I want to do. As a reprographic operater I want total contol over things like trapping settings. InDesign feels like half a design app and half a page layout app whereas I see Quark as a big cooking pot where you put all of your elements, lay them out and get them ready for the printers. I should really use InDesign a lot more for pure page layout and reprographics to give it a fair chance.</p>
      <p>Quark really need to get their act together though. Speed, stability and little niggling bugs all need to be weeded out. Half arsed attempts at putting features in that Photoshop will do, and has done much much better for a good few years now, is not what Quark needs. Similarly, Adobe need to address what the app (InDesign) IS. They ship the CS Suite with Illustartor, Photoshop and Acrobat. Is processing power, speed and fluidity being wasted on features in one app that are far superior in another app in the same suite?</p>
      <p>Quark may have left it too late. V7 needs to overcome a lot of hurdles, mainly to persuade people that have moved away from the app that they do actually care and listen to the people that buy and use the software and that the users of the app, and what it is used for, are the most important factors in its survival and not how many useless features can be packed in.</p>
