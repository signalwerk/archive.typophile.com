    html: |-
      <p>I’m of two minds about all this. On the one hand I really like the fact that InDesign is replacing Quark. I always hated XPress with a fervor and every time I have to touch it again I remember why… it’s one of the most anti-intuitive tools ever. I work with InDesign and hardly touch anything else anymore, it’s simply the best layout software available right now. So yeah, bye Quark, good riddance. </p>
      <p>On the other hand, you don’t monopolize without a reason. You monopolize to cash in. We will see that a monolithic Adobe will do less and cost more, the creativity will go from developing software into how to squeeze as much money as you can out of your customers. This doesn’t HAVE to happen (Photoshop already is the singular pro-tool for editing print images, yet they still deliver new features with every version), but I’m sure it will tend towards that scenario. </p>
      <p>InDesign came out of the need to have something BETTER than Pagemaker to compete with Quark. Without the competition, there will be a lack of stimulus to come up with something «better». And we will all lose because of that. </p>
      <p>In the long run, I reckon, small companies will make up for that, and OpenSource software might pop up doing a fine job of keeping the market on its toes, but you never know… there might not be an OpenOffice-pendant for Indesign. And Gimp, so far, is no Photoshop either. </p>
      <p>So yeah, while a part of me is more than happy to see Quark go to its well-deserved rest at the elephant graveyard, another part of me is very very frightened about Adobe becoming the kings and queens of all they survey.  </p>
      <p>HD Schellnack</p>
