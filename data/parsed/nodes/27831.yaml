      <p>I don’t know which is the first post, but from Lex’s comment I am assuming logo3 is the original and in terms of the monogram the most successful in terms of reading kf. It does need some refining, if you moved the f slightly to the right to take advantage of the more horizontal section of the k to make the f’s crossbar which would also remove the nick from the red box. The bauhaus style is not really sympathetic to the logo and seems a bit of an afterthought, as Lex suggests you could try a script or you could go for a very simple thin sans (very fashion industry), Univers or Eurostile kind of feel maybe. I think your mark would look good as an emboss on that deep red. Is the bling version intended to be a die-cut which would be tricky even with laser but could look good too?<br>
      Tim</p>
