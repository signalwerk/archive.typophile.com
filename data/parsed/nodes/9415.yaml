  html: <p>Hallo,  <br>a customer asked to typeset his book of poems, which contains also some introductory text (several pages). What couple do you suggest?  <br>I know he likes bold sanserif text for the titles.  <br>The poems are long hendecasyllabic verses, Dantean tercet style, so no 'text in a sea of white' effect. <br> <br>thank you very much <br>m.</p>
