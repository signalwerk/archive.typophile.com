      <p>Most of what you've listed are stylistic variants, and are not assigned official Unicode points. Adobe has used Unicode PUA ranges in the past for some stylistic variants, but has reportedly deprecated this practice.</p>
      <p>There are some documented agreements on character assignments in the Private Use Area, notably <a class="freelinking external" href="http://mufi.info/" rel="nofollow">Medieval Unicode Font Initiative</a> and <a class="freelinking external" href="http://www.evertype.com/standards/csur/" rel="nofollow">ConScript Unicode Registry</a>. There may be others but I am not familiar with them. You may find some of the glyphs you want to encode have points within those ranges, and you can avoid thos ranges if there isn't a clear fit. The PUA is a big space.</p>
