    <p>I am about to assign a bunch (approx. 500) of Private Use UNICODE to the following which do not have official UNICODES and are not yet [to my knowledge] covered by Adobe Glyph List:</p>
    <p>Nut fractions<br>
    Annotation Superiors<br>
    Superior Punctuation<br>
    Small Cap Numbers<br>
    Small Caps Punctuation<br>
    Tabulated Numbers<br>
    Titling Capitals (x140ish)<br>
    Titling Lowercase (x140ish)<br>
    Titling Numbers<br>
    Reversed Encapsulated Sansserif Capitals<br>
    and perhaps a few other ornaments (not dingbats) etc.</p>
    <p>Q. Are there any established Code-blocks for the listed glyphs above *agreed* between foundries? </p>
    <p>I am posting here before approaching anyone individually. My next step is to check the future of the Adobe Glyph List but first I want to gauge  the reaction to having so many apparently missing UNICODES.</p>
    <p>If it seems reasonable, perhaps I may make a formal proposal to UNICODE Consortium. It feels better for me to push for some kind of universal acceptance of principle and/or get a better understanding of peoples feeling towards this before I go ahead and assign my one Private Use UNICODES to my own fonts regardless.</p>
    <p>I am conscious that if the above Glyphs can have UNICODES shared amongst the Community this will make fonts sharing the UNICODE compatible and easily interchangeable.</p>
    <p>/michael</p>
