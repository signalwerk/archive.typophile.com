      <p>In the Adobe Fonts the unicode value assigned to small caps or swash capitals for example is not the same in all the fonts.<br>
      It seems like such glyphs are left for Open Type features to handle, but then what's the point in assigning unicodes? Is it good practice that every glyph has a unicode value?</p>
      <p>I'm sorry if my questions are slightly off subject but I didn't want to start a new thread with a very similar subject.</p>
