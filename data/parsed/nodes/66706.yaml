    html: <p>My general advice is not to use Private Use Area codepoints for variants of standard encoded glyphs. The PUA should be used only when you have some idiosyncratic symbol that is neither a standard encoded character nor a variant form of such a character. An obvious example would be a corporate logo in a font. The only time I use PUA characters is for decorative, ornament glyphs.</p>
