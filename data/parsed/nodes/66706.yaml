    html: |-
      <p><cite>Some common applications have been reported to not display a glyph if it does not have a Unicode number. This is bad practice on the software publisher's part.</cite></p>
      <p>Supporting Unicode is different than supporting OpenType. A program that did not support Unicode these days would be the equivalent of a program not "supporting" ASCII in days past. I suppose you could think of the PUA of Unicode being equivalent to high-order ASCII.</p>
      <p>The point of a Private Use Area is that it has no defined use. Asking for an agreement of typographic niceties shows a certain insensitivity to the purpose of Unicode. Consider documents that pass from one use to another, one font to another. That is job of Unicode.</p>
      <p>It is a little point, but I abhor fonts with titling caps built into the font. I deal with large amounts of running text (books). Titling glyphs are almost always used for display, and with most work, display usually involves a separate font. If titling glyphs are built into a font, and an application program such as InDesign can't handle the switch to them easily, through a paragraph style, they are not as useful as they would be in a separate font.</p>
      <p>As is so often the case, people who use type often have different ideas than people who design type.</p>
