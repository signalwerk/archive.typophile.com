      <p>Some common applications have been reported to not display a glyph if it does not have a Unicode number. This is bad practice on the software publisher's part. Does anyone remember with which programs this is the case, or with those where it has been resolved, with what version?</p>
      <p>OpenType features ought to be sufficient to handle such stylistic variants.</p>
