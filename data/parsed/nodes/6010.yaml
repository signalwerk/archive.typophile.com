    date_raw: 12 Aug 2004 — 11:50am
    votes: null
    html: "<p>Nice quick improvements! <br>- I'd make the tail connector (the thick diagonal stroke) on the \"g\" slightly heavier on the bottom-right than the top-left. Look at Binney &amp; Ronaldson #2 (AKA Oxford, AKA Monticello) for a really good model for that structure of \"g\". Or Patria's for a more pronounced difference between the two ends. <br>- I think the gaps in \"B\", \"P\" and \"R\" need to be bigger. <br>- The counters of the \"N\" are imbalanced. <br>- I prefer the top numerals, although that lower \"5\" is killer. <br>- The blank space is a perfect size now. <br> <br>hhp <br></p>"
    html_clean: "<p>Nice quick improvements! <br>- I'd make the tail connector (the thick diagonal stroke) on the \"g\" slightly heavier on the bottom-right than the top-left. Look at Binney &amp; Ronaldson #2 (AKA Oxford, AKA Monticello) for a really good model for that structure of \"g\". Or Patria's for a more pronounced difference between the two ends. <br>- I think the gaps in \"B\", \"P\" and \"R\" need to be bigger. <br>- The counters of the \"N\" are imbalanced. <br>- I prefer the top numerals, although that lower \"5\" is killer. <br>- The blank space is a perfect size now. <br> <br>hhp <br></p>"
