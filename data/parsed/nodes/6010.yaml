    html: "<p>Pretty nice! A useful design for titling - could work great in a newspaper. <br> <br>- The \"f\" could be less shy. <br>- The \"g\" is too calligraphic; and I'd make its ear Goudy-style. <br>- Both the lc and -especially- the UC \"k\"/\"K\" are unhappy. <br>- The \"r\" is too sharp. <br>- The \"L\" seems too narrow. <br>- Nice \"Q\". I might disconnect the far left of the cross-stroke from the left body curve. <br>- The ascending \"4\" isn't working. The numerals are great overall though. <br>- The acute, grave and tilde seem a hair too strong. <br>- I'd flatten the UC accents. <br>- I might make the exclamation and question marks stronger. <br>- The curly braces could be more interesting. <br> <br>Spacing: I think your overall letterspacing is good, but the word space too small. <br> <br>hhp <br></p>"
    html_clean: "<p>Pretty nice! A useful design for titling - could work great in a newspaper. <br> <br>- The \"f\" could be less shy. <br>- The \"g\" is too calligraphic; and I'd make its ear Goudy-style. <br>- Both the lc and -especially- the UC \"k\"/\"K\" are unhappy. <br>- The \"r\" is too sharp. <br>- The \"L\" seems too narrow. <br>- Nice \"Q\". I might disconnect the far left of the cross-stroke from the left body curve. <br>- The ascending \"4\" isn't working. The numerals are great overall though. <br>- The acute, grave and tilde seem a hair too strong. <br>- I'd flatten the UC accents. <br>- I might make the exclamation and question marks stronger. <br>- The curly braces could be more interesting. <br> <br>Spacing: I think your overall letterspacing is good, but the word space too small. <br> <br>hhp <br></p>"
