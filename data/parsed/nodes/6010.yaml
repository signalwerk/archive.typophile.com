    html: "<p>Hi, <br>I had a quick glance: <br> <br>- 'a': the left vertical extremepoint on the bowl should be lower. <br>- 'c' and 'e': although I like their form, I get the impression that they tend to fall to the left. Maybe a little more wheight in the lower left part. <br>- 'o': the rightside is perfect, the leftside isnt as good. I would have a look at this. <br>-'s' and 'S': The middlepart should be a little higher. Although I like the imbalance which occurs between both white innerforms, I think this doesnt fit with the rest of the characters. <br>-'A': right stem should be lighter. <br>-'B': bowls should be fatter. <br>-'D': Bowl should be lighter. <br>-'5' (top): horizontal streak should be longer. <br>- Eurosign: why did you make a sign which is conform the 'official' rules ? Be creative. For example you made a slanted serif, which is the only one in the whole font. <br>- I like your lower five as well. Why didnt you use a similar form for your questionmark ? <br> <br>This a very nice typeface ! <br> <br>regards, <br>--Jacques</p>"
    html_clean: "<p>Hi, <br>I had a quick glance: <br> <br>- 'a': the left vertical extremepoint on the bowl should be lower. <br>- 'c' and 'e': although I like their form, I get the impression that they tend to fall to the left. Maybe a little more wheight in the lower left part. <br>- 'o': the rightside is perfect, the leftside isnt as good. I would have a look at this. <br>-'s' and 'S': The middlepart should be a little higher. Although I like the imbalance which occurs between both white innerforms, I think this doesnt fit with the rest of the characters. <br>-'A': right stem should be lighter. <br>-'B': bowls should be fatter. <br>-'D': Bowl should be lighter. <br>-'5' (top): horizontal streak should be longer. <br>- Eurosign: why did you make a sign which is conform the 'official' rules ? Be creative. For example you made a slanted serif, which is the only one in the whole font. <br>- I like your lower five as well. Why didnt you use a similar form for your questionmark ? <br> <br>This a very nice typeface ! <br> <br>regards, <br>--Jacques</p>"
