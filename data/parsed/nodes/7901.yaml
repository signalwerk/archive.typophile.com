    html: <p>I'm pretty sure that the latest version of Illustrator that will work for copying and pasting with Fontographer is Illustrator 8. Later versions (9, 10, CS) don't, regardless of the clipboard preference setting. I never used the EPS import feature, but it appears to be the same story.</p>
