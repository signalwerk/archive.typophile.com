    html: <p>hi. i'm having the same problem... can't paste from illus.cs to fontographer. i've tryed saving in older .eps formats, tried option copy with aicb. when importing i get a "syntax error" and the copy/paste thing just gives me a useless greyed out blob. i remember this working before, presumably on an older version of illus. i tried importing those files just for kicks and it worked. so what gives? anyone that's done this successfully, please lend a word or two...</p>
