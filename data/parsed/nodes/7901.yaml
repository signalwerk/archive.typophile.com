    html: <p>On Mac OSX? No, there isn't, at least that I am aware of. Leslie Carbarga wrote in his <i>Logo, Font &amp; Lettering Bible</i> that it couldn't be done anymore, too. <br> <br>Save your images as an old, old Illustrator EPR (3.0/3.2), and then import that EPS into FOG. Remember to include bounding boxes to keep sizes consistent!</p>
    html_clean: <p>On Mac OSX? No, there isn't, at least that I am aware of. Leslie Carbarga wrote in his <i>Logo, Font &amp; Lettering Bible</i> that it couldn't be done anymore, too. <br> <br>Save your images as an old, old Illustrator EPR (3.0/3.2), and then import that EPS into FOG. Remember to include bounding boxes to keep sizes consistent!</p>
