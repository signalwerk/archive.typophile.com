    html: "<p>Copying and pasting from Illustrator CS works fine with FontLab 4.6 and MacOSX. If it's not working, you need to check the preferences in Illustrator CS.  <br> <br>Select \"Illustrator CS &gt; Preferences &gt; File Handling &amp; Clipboard...\" . Make sure \"AICB (no transparency support)\" and \"Perserve Paths\" are enabled. Now it should work as it did before for you. (Note: AICB is disabled by default when you first install Illustrator CS.)</p>"
    html_clean: "<p>Copying and pasting from Illustrator CS works fine with FontLab 4.6 and MacOSX. If it's not working, you need to check the preferences in Illustrator CS.  <br> <br>Select \"Illustrator CS &gt; Preferences &gt; File Handling &amp; Clipboard...\" . Make sure \"AICB (no transparency support)\" and \"Perserve Paths\" are enabled. Now it should work as it did before for you. (Note: AICB is disabled by default when you first install Illustrator CS.)</p>"
