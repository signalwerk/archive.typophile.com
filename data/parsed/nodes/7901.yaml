    html: <p>Saw this post just now. <br>The problem with Macromedia's Fontographer is thay it's so old it can only import .eps files that are level 1. Since all the latest versions of Illustrator only convert to level 2 or 3, you need a workaround. <br> <br>Copy your path from Illustrator to Photoshop and export as Illustrator path. This Photoshop export is apparently Level 1 because I can import these .eps files without a problem. <br> <br>Hopefully this works for you.</p>
    html_clean: <p>Saw this post just now. <br>The problem with Macromedia's Fontographer is thay it's so old it can only import .eps files that are level 1. Since all the latest versions of Illustrator only convert to level 2 or 3, you need a workaround. <br> <br>Copy your path from Illustrator to Photoshop and export as Illustrator path. This Photoshop export is apparently Level 1 because I can import these .eps files without a problem. <br> <br>Hopefully this works for you.</p>
