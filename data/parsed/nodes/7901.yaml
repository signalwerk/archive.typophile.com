  html: <p>Is there a way to be able to cut and paist vector letters from Illustrator Cs into fontographer. <br> <br>I use to be able to do this with illustrator 9.  I don't have illustrator 9 anymore since i gave it way a long time ago.. <br> <br>thanks</p>
