      <p>Very engaging thread. I note that some assumptions about handset type may be incorrect however. </p>
      <p>There are many stellar examples of composition and spacing from the past, right from the beginning, Schoeffer's work on the Gutenberg Bible is an amazing tour de force. </p>
      <p>The transition from Latin based text is largely responsible for the abandonment of ligatures and abbreviations. I worked with a special Latin version of Carter's Miller Text, that included all the characters and ligatures that would have been used in the Aldine work, and it was like being in composition heaven.</p>
      <p>Though many historical examples of commercial printing are quite bad, particularly in the 19th century, and that may be the perceived norm, one does need to remember that there were no compositional strategies in place until Tschichold's standardization of typesetting practices. </p>
      <p>Metal foundry type in the second quarter of the 20th century (and into the 1960s), especially that produced by the more renown European foundries, was extremely well thought out in the settings. And many foundry fonts did come with alternative kerned capitals, such as a W that did fit tight to the following lowercase letter. Or an A and V that could be adjusted.</p>
      <p>Kerning was practiced for some long time. Moxon, in 1683, describes a device for shaving letters to fit. Many high-end contemporary letterpress shops routinely kern their type with mortisers and/or glider saws.</p>
      <p>Gerald</p>
