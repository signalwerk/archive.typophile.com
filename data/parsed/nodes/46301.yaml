    html: |-
      <p>Not everybody who plays the guitar can play the guitar.</p>
      <p>For the beginner it may be unbelievable how someone has achieved good spacing. It takes considerable time and a lot of attempts and mistakes to get an idea of how to do it, and maybe master it. Still this is more or less "intuitive", unconscious: being good in doing something is not the same as understanding what one does. The next step is to analyze what the master does and formulate a method. In so far, being creative and creating a machine that does what a creative does is not completely unrelated. And of course once a task is automated, this raises the question, was this task creative at all?</p>
      <p>From a practical point of view, I do not see why someone should spend days on a task which can as well <em>and with virtually same results</em> be performed by a machine. Would there be a loss if spacing were done by a machine rather by a human being? I cannot tell you a single typeface of which I could say that <em>its spacing</em> exhibits its designer's <em>creativity</em>. Rather, some typefaces work, some don't. (In terms of spacing.) The question is not: is spacing/kerning art or technique? but rather: is the applied method ok? It is there that different type designers may have different preferences -- provided that they would ever transform what they merely do into a clear conception!</p>
      <p>And we should always keep in mind that Gutenberg's one-letter-per-block, one-block-next-to-another paradigm of typography (which implies that the space between two letters is defined by the remaining side bearings) was more or less a necessary evil of this very physical approach to letters/type. Letters <em>an sich</em> do not know side bearings nor kerning, they only know the space inbetween. The real scandal is that digital typography never even dared free itself from merely imitating the one-letter-per-block paradigm. Despite the fact that the digital domain knows no physical constrains. The work of Mr Marini and others could finally free it from outdated paradigms. (Why output sidebearing and kerning tables at all?) Again, what is to be discussed are method and result, but not man vs machine ...</p>
