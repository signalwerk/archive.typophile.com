      <p>What William and James are saying makes good sense to to me generally. But I think the ultimate kern/side bearings assist would either </p>
      <p>•&nbsp;offer the designer a series of combinations to be spaced and then take those responses and create the side bearings and kerns needed to achieve the specified optical result. I recall somebody wrote a really lovely request for fontlab that described something like this.  </p>
      <p>or </p>
      <p>• Examine the letterforms in being drawn a quasi-optical manner and suggest common pairs and a possible spacing given variables like optical size which the designer would then override on a case by case basis. Again letting the designer design, and sorting out the most efficient ( least kerns and least extreme kerns) code based on those design decisions. </p>
      <p>Karsten wrote: <cite>...by their nature, paradigm, principles, ideas, conceptions are not tangible objects that I could “prove” by simply pointing at them. </cite> And he is of course correct. "Prove"  is the wrong word. </p>
      <p>But instead maybe I can say something like "make a case for". I think if you are going to use words like absolute then you have to build a strong case at least. Also, I may not be getting the thrust of your argument. Were you saying that a Gutenberg paradigm was one that leads "logically" and "absolutely" (I might say inevitably), to simpler shapes?  If that is right, then that's a pretty strong statement worthy of some examination and critique, and needing, in turn, support and reasoning before it could be accepted.</p>
      <p>BTW From what I can tell ( which is less than I would like) Gutenberg's special sorts existed more to allow perfect spacing of the line than as optically driven variants for the fit of letters except when they modeled a ligature which may or may not have existed for better fit.</p>
