      <p>Eben, what's that "Kindersley system" you mention?</p>
      <p>Why I'm sceptical about Igino's service is not so much because of some kind of dismission of automation <em>per se</em>, much more its the secrecy igino makes about the actual method employed which makes me wary. In the case of cars, e.g. I approve of ABS, because -- while I don't have the exact paramters of the IC-chips and the exact parameters of the functions employed or the exact differential equations set up, there is publicly available information about how it works, its basic principles in details, even which equations are to be solved by the system. So I can counter-check and trust my confidence into it. I couldn't do that in the case of iKern.<br>
      Come on! I even know the basic principles behind nuclear power! I don't care about the actual measure how much they insert the graphite bars to slow ("moderate") the reaction, whether its 1cm or 10cm, I'm sure they know how much they have to (they don't want to die after all either), but I know what they do in principle. And for knowing that there is still no threat that I will construct a nuclear power plant myself and pose a business competitor.</p>
      <p>While I said I do not dismiss automation, as division of labour and employing new tools, as well as automation is the way to become more efficient, it's the way of progress (though note that the German word for progress: Fortschritt etymologically does not mean a change toward better, not even forward, as the latin word suggests, but rather only <em>away</em> from the <em>status quo</em>... good to keep in mind); however, there <em>is</em> a common understanding that automation <em>always</em> goes hand in hand with lower quality without exception. Or why else is always "hand-crafted" seen as a label of quality? Automation is viewn <em>completely</em> without drawbacks or loss of quality only, if it makes something possible that was unachievable before, not however, if it makes something just more effective or efficient, faster to deliver.</p>
      <p>Szabolcs</p>
