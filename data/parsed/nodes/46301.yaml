      <p>Hello Eben, indeed I mean logical consequence, and as such it is absolute. The Gutenberg principle means one-letter-per-block placed next to each other, and has some implications of economy, e.g.:<br>
      -- as few blocks as possible&nbsp;&nbsp;<em>[ligatures to be shaved off with Ockham's razor]</em>,<br>
      -- avoid kerning where possible&nbsp;&nbsp;<em>[because spacing of letters is, in this principle, defined by left and right side bearings; nicely expressed by Erik Spiekermann]</em>,<br>
      -- space <em>all</em> letters by about the same amount&nbsp;&nbsp;<em>[since each letter/block only has one left and one right side (bearing); an effect of this is that uppercase letters usually are spaced too narrow, with A L T V W Y causing gaps, can be seen in about any font at hand]</em>.<br>
      During one of the next conferences, have a chat about Arabic and ligatures with Thomas Milo.&nbsp;&nbsp;:)</p>
