      <p>Probably because you can't plug in just any ole typeface and expect it to magically work. </p>
      <p>The Gutenberg paradigm is brilliant and how can one not love the line ligatures were shaved off with Occam's razor but I think this may be a case of the cart before the horse.</p>
      <p>The common liturgical hand of Gutenberg's period WAS mathematically simple. The textura has three basic strokes. Letterform fitting to the mechanical bounding block with such a typeface is, relatively, an easy process to work out. In fact, this simplicity is considered, in some circles, the rationale that allowed for mechanical writing to have developed. </p>
      <p>With the evolution to roman based faces during the period of Incunabula, the process became much more complex as the letterforms were more complex, and the mathematics of fitting were more complex. </p>
      <p>The transition from Latin to the vernacular likely plays a greater role in the disappearance of the multiplicity of sorts (ligatures, abbreviations) than a movement toward mechanical simplicity.</p>
      <p>That the printing process was early on considered mechanical writing lends credence to Eben's "the idea that printed books must have taken on their own validity outside of the context of the written book over time and that once that context was established that the power of economic need would dictate a move to simpler and faster methods." Finding the phase where the mechanical emulated the mechanical isn't all that historically precise but it would be at this point rather than earlier development where the concerns here become more valid. The period of Incunabula is separated out uniquely in printing history for a number of very good reasons, it is an arbitrary distinction, but it helps to look at the development of printing as having a birthing stage, larvae, that is unique from all that follows. When the pupae emerged full grown is where these considerations are best developed, not prior.</p>
