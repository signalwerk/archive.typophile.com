      <p>To put an even finer point on it, many discussions have arisen here about the role of "white space", which is exactly what Inigo's program is concerned with. Evading the crucial lessons of spacing sounds initially like a terrible loss in a field where visual discernment has always been crucial. However, this program is not the first attempt to automate the process of spacing and kerning. Though the focus was different, the h-z algorithm Zapf helped develop was intended to produce ideal spacing and kerning of text blocks without direct human manipulation. Though the spacing of a typeface is ideally done by a careful, perceptive human, the presence of a human designer does not guarantee ideal spacing. We've all wished for modules to help us through boring and repetitive tasks in type design, and our software and workflows reflect this. Type design is as much technology as it is art.</p>
      <p>I also think Inigo has learned some very interesting things in his experience with the Fell types, things we ought not brush off. Many of us have not had the experience of dealing with highly un-systematic types, though we all appreciate variations and irregularities. The fact is that it is easier than ever for typefaces to be sterile, modular, regular and coldly rhythmic. Cut-and-paste has become a Modus Operandi for too many. I would be very interested to know what the algorithms in iKern are doing and what variables they consider. It might be instructive; might help us remember what to look for.</p>
