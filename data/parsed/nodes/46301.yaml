      <p>As a further addition to my previous post. You are assuming the existence of spacing material. Metal pieces used between words or letters. There is no proof of this in very early printed material. We simply do not know. It is assumed in some circles that B42 had none. Which means letterform "blocks" likely included the spacing. Hey, movable type.</p>
      <p>If you are looking for standardization upon which to base you model (which I don't disagree with—just your terminology/historical placements), you have to look not at early Incunabula but rather with the Aldine, which is where the mechanization of letterforms clearly turns on its head and, agreeing with Eben, the influence of the organically prescribed letterform wanes.</p>
      <p>Gerald</p>
