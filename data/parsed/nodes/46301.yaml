      <p>John, I was too quick to use the word kerning. Yes I do mean spacing not kerning. You make some great points especially Re: using type at multiple sizes and the impact that has on the spacing that will be appropriate. And most of all the potential unreliability of the spacing you set out as a designer. And so I agree that it is probably wise to consider it as 'helping hand' in some sense. Also what you are saying certainly does add to the notion that a robust design, one that takes spacing degradation with less trouble, is very desirable, which is in a separate point. </p>
      <p>Still, don't you design as Noordzij says "the white of the word" along with the black even if that white is in some cases going to be more provisional than you might like? Or do you design first and space afterwards? </p>
      <p>It seems like people are increasing interested in having type's use specified and that designers are increasingly designing for specific contexts and this seems desirable. It seems to me too that if you are designing a complex family with versions for narrow pt size ranges like Arno pro the helping hand of spacing can be seen as somewhat less soft suggestion even if still is a "helping hand".</p>
      <p>I would like to hear more about the distinction you are setting up between Kindersley’s ideas and Typography vs. Type design. I see that the two are different things but they seem a bit like a venn diagram to me with type design's question of spacing overlapping with the practice of spacing in Typography. But maybe I am missing something. Am I?</p>
