      <p><cite>I think it is a mistake to say that kerning is ’a core aspect of type design’; rather, spacing is a core aspect of typography.</cite> </p>
      <p>In my experience with iKern I would say:<br>
      spacing and kerning are just two faces of the same medal. I state so because, in my application, autospacing and autokerning are done by the same algorhythm (and same routine) sharing the same data and, as a consequence, I note that the statistical distribution of all the kerning values is a gaussian bell centered on the zero and with very low variance. Translated means that only a few (averagely 10,15%) of the all possible couples turns out to have a kerning whose absolute value is above a certain low threshold (default 3 points for 1000 UPM, 5 points for 2048 UPM. Can be choosen by user anyway). I also see this as direct application of the “first spacing, then kerning” adagio. </p>
      <p><cite>The second point is that spacing is really an aspect of typography, which was more generally recognised in typesetting prior to the desktop publishing revolution, and is reflected in manuals of that period. [...]. As such, this font spacing should be seen as a kind of helping hand, and not as a replacement for typographic control, whether applied by an experienced typesetter or automated in some more or less sophisticated way relative to type size.</cite></p>
      <p>Really true. I think the limitatations are in the font format and in the applications. Apart from choosing a size and tracking accordingly, what else can a typographer do? I think the possible “operative” parameters are far more. Examples:<br>
      Commenting Nick I talked about a minimum distance between glyphs iKern forces under certain conditions. First: this minimum distance can now be choosen by me or the designer but should have to be choosen by the final user. Second: if I vary the tracking the kerning should consequently change. But I can do it only with the iKern internal traking for the unique istance I produce. In applications kerning remains constant and I loose any possibility of control.<br>
      Another parameter iKern uses is “kerning strength”. I noted that text setting require a looser kerning than a display one. So generally I choose the looser direction because “it's better too loose than too tight”. And I have to choose because I can give away only one istance.<br>
      By design iKern let you choose one of the infinite possible spacings. But in having to choose between the theorical best and a “manufacturable” one you have to choose the second because, in the end, a digital font is a product that must work in most cases as possible.<br>
      Now I've moved most iKern parameters in a “post-processing” phase so I can tweak with them without recalculating everything. So I would say that, in my opinion, the iKern viewer and postprocessing panels are, together, the tool that now permits the wider range of typographical control on a type. Obviously using the iKern file format.<br>
      In the long run this is the direction I see for iKern. With the today service I'm only trying to make this concept acceptable.</p>
