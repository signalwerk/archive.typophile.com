      <p>My first question to Igino was if I could license iKern, but because that wasn't possible, I decided to have a go with Anivers to see how iKern could stand out, because I did see the app perform very good on the Fell Types (apart from the discussion on *how* this should be done). Igino did some tests based on an earlier release of Anivers and was able to capture the look and feel of that release with spacing beautifully and consistently translated to all glyphs (family wide). </p>
      <p>Everything should be under control by the designer, I'll be the first to agree with that, but while I didn't push the buttons and let my laptop crunch the calculations for two hours, I never had the feeling I wasn't in control. The same goes for the whole kerning process. I did request for an early (spacing) test run on the other styles and weight so I could change certain glyphs if needed.</p>
      <p>I regard the whole process and collaboration with Igino as a joy and that is why I asked him if I could mention this, because I thought this time saver could benefit more typophiles.</p>
      <p>To see a result of this project you can download Anivers Regular *<a class="freelinking external" href="http://www.myfonts.com/fonts/exljbris/anivers/" rel="nofollow">here</a>* for free @ MyFonts.com.</p>
