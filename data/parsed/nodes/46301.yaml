    <p>To all the typophiles. I would like to let you know that a new extended version of the Fell Types is available from my site <a href="http://www.iginomarini.com" title="www.iginomarini.com">www.iginomarini.com</a>. The fonts have new metrics data reflecting the progress of my iKern tool.<br>
    Now iKern has its own site at <a href="http://www.ikern.com" title="www.ikern.com">www.ikern.com</a>.<br>
    Thanks to Jos Buivenga who forced me to do it because he said he wanted to talk about the positive experience of reworking his Anivers family and I didn't want to show a dead link anymore. </p>
    <p>Regards</p>
    <p>Igino Marini</p>
