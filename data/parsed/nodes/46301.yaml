      <p>To Eben:</p>
      <p><cite>Similarly, if iKern is based on fitting certain kinds of forms and has assumptions built into it about what letterforms are probably like ( the story) rather than having a way of sensing them directly, like the Kindersley system did, then it is not going to be a very robust kerning tool</cite></p>
      <p>Unfortunately I still don’t quite understand the mechanism of iKern. </p>
      <p>To Terminaldesign:</p>
      <p><cite>I don’t know about the rest of you, but I view the spacing and kerning of a font to be part of the design. Muling over the spacing gives me an insight into how it all fits, and more importantly where it does not fit. Countless times I have redrawn glyphs because of some spacing issue. So I don’t understand the approach of drawing the glyphs and then applying the spacing. </cite></p>
      <p>I've never received a font without a working spacing (why can't it be refined?).</p>
      <p>To Jongseong:</p>
      <p><cite>I’m really curious about the points Eben raised though about how much iKern relies on assumptions about letterforms. Has it been used to space and kern non-Latin fonts, for example? </cite><br>
      Ikern has no assumption about letterforms. Any geometric shape can be handled (look at the V and A of the Italic Fell Types and how they're handled elsewhere). </p>
      <p>To Nick:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/ExampleAni_4749.jpg"></div><p></p>
      <p>In the image above you can see the word LAWT a) without kerning; b) with the output iKern produces before cutting the values under a certain threshold (in this case 3 so the kerning between LA will disappear); 3)the actual version.</p>
      <p>Both L and T are detected by iKern as letter where the “space” around the outlines is important for the “identity” of the letter. I use the term “bodiliness”. Internally is a property referred to the left or the right side of a glyph and is a value between 0 (no bodiliness) and 1 (maximum bodiliness). L and T usually have 1. O usually has 0. These values are calculated by iKern. After all calculations, during a post processing phase, there are some further actions on the kerning values depending on the bodiliness values of the glyphs involved. I won't go into details but there is, among others, an action to set a minimun distance between the glyphs proportional to the maximum bodiliness values. In the case of Anivers this distance was 36 points (it can be manually tweaked if one wants. I always let the default value). If you measure, in the unkerned condition, the minimum distance between the LA is 34 points. The measure between WT is 31 points. That's why the LA kerning becomes (36-34) = 2 and the WT kerning becomes (36 – 31) = 5. As I said before in a post-post processing phase the kerning values under a certain threshold are cur away (the value is choosen by the designer).</p>
