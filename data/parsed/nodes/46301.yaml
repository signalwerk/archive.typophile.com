      <p>Nick: He says on his page</p>
      <p><cite>"First of all: Love. Love for beauty of this typefaces I'm still not tired to look at. I begun to learn how to build a typeface just after having seen them because I just wanted to use them. And after having digitized them I begun to think about a way to space them (it was so difficult): the seminal thoughts about iKern, the autospacing and autokerning tool I've developed since 2002. I can certainly say that without the Fell Types iKern wouldn't exist: Their typographic “errors” (variable serifs from letter to letter, even inside the same letter, inconsistent heights and slant angles, different weights and many other amenities and lovely strangeties) have pushed me to a deep generalization of the mathemathical model avoiding shortcuts and suggesting paths I wouldn't thought otherwise.</cite></p>
      <p><cite>For this reason I decided to license the fonts for free. I've received enough. And more: designing typefaces is not my job and, in the end, I didn't design the Fell Types. Peter de Walpergen, Claude Garamond, Robert Granjon did."</cite></p>
      <p>That said: I would like to hear more about why if he has more to say. Also, you could voice your critique of the idea.</p>
