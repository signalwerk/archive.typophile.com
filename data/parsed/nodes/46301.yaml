      <p>Eben: <em>But again, if you believe that kerning is not a chore to be dispensed with but a core aspect of type design it is still hard to think of iKern as something to bring into an ideal process.</em></p>
      <p>I think it is a mistake to say that kerning is 'a core aspect of type design'; rather, <em>spacing</em> is a core aspect of <em>typography.</em> There are two important points made in that statement. </p>
      <p>The first is that kerning is a particular mechanism of spacing, and one which presumes other mechanisms, such as sidebearings. Further, it is a mechanism that presumes that spacing is something that is achieved in two (or potentially more) additive passes: default spacing and then adjustment of specific sequences. Or, to use Einstein's terminology, general spacing and special spacing. Since it is a mechanism, I don't think you can say it is a core aspect of type design; it is, rather, an important step within a particular kind of font manufacture. This becomes obvious when you consider that exactly the same spacing could result from a different mechanism.</p>
      <p>The second point is that spacing is really an aspect of typography, which was more generally recognised in typesetting prior to the desktop publishing revolution, and is reflected in manuals of that period. [By the way, Eben, Kindersley's spacing experiments need to be viewed in the context of typography (and sign making, his initial inspiration), not type design or font manufacture. In many respects, Kindersley's work -- about which very little solid material is available; I have copies of all the published stuff -- is closer to the kind of thing that Karsten is talking about that conventional font spacing.] The conventional model of general and special spacing via sidebearings and kerning data is, at best, appropriate for a particular size of set type (ignoring other factors that may recommend adjustments to such spacing). As such, this font spacing should be seen as a kind of helping hand, and not as a replacement for typographic control, whether applied by an experienced typesetter or automated in some more or less sophisticated way relative to type size.</p>
