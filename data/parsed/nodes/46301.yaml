      <p>To William:</p>
      <p>&gt; Certainly, one should proof and adjust.</p>
      <p>To Nick:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ExampleFell_6325.jpg"></div><p></p>
      <p>Without kerning I would obtain the third line in the example. Honestly I dislike it and that's why I kerned the font.<br>
      You pointed out that the fitting of the “We” couple in Western is too tight. Probably. And I explain why. The first parameter iKern uses is “width”. It's defined for four cases: small vs small (s/s), Capital vs Small (C/s), Capital vs Capital (C/C) and Not Letter. At the time I compiled the Fell Types I was theoretically convincted that a “C/s couple” should have the same width of a “s/s couple”. And I set the input accordingly. Today I've changed my mind and I think that a good starting point for a “C/s width” could be the average of the “s/s width” and the “C/C width” (like I did in the examples in my site). But I say more: I can understand that in the present case with Capitals and smalls so different in weight could be accettable to set "C/s width" = "C/C width2 to let the Capitals more detached (like they where in the metal era). The first line in the example is from the font as is now. The second line follows the last indication. I've made this lesson to show, in practice, that:<br>
      iKern uses (needs) the human factor;<br>
      the effort of definition is minimum: there is the possibility to make global choices that are inherited through the font (it's class kerning at the maximum extent);<br>
      a feedback can be part (essential) of the workflow. For this please follow the thread where Jos Buivenga describes a little our mutual positive experience working on Anivers. <a href="http://www.typophile.com/node/46268" title="http://www.typophile.com/node/46268">http://www.typophile.com/node/46268</a></p>
