      <p>k.l. -- <cite>The real scandal is that digital typography never even dared free itself from merely imitating the one-letter-per-block paradigm.</cite></p>
      <p>Bert Vanderveen -- <cite>Hm, Gutenberg did use around 150 special ligatures (multiple letter combinations!) to emulate te contemporary look of manuscripts. So there goes your argument, k.l.</cite></p>
      <p>Very good. Actually your example <em>supports</em> my argument:<br>
      Ligatures were nothing but a workaround to deal with what I consider the core idea and limitation of the Gutenberg paradigm: that each letter is regarded as a unit, cast on its own block. (For illustration, contrast this with writing which by its very nature is ligated and "fluid" as regards black as well as white -- there are no ligatures because <em>everything</em> is potentially ligated.)<br>
      What Gutenberg did was trying to emulate the image of writing, so himself he wasn't aware of what I call Gutenberg paradigm. That Gutenberg's numerous ligatures and abbreviations were finally abandoned from the case however is just a logical consequence, and clarified what this paradigm is about. In so far, from a strict Gutenberg paradigm point of view, ligatures are a reminiscence to writing, a very artificial one, alien to this paradigm.</p>
      <p>I am sorry that I was and am not able to make my point more clear. For me it is evident but I admit it took years to arrive there. (And from there, current font technologies are just a subset of what they could be.) As long as you think of type design as filling your preferred font editor's glyph slots with nice outlines, some of them representing single letters, some of them ligatures, some of them diacritic letters, etc, and as long as this works well for you, there is no need to try or adopt an alternative paradigm.</p>
      <p>But this now is really off the topic which was iKern and the Fell type.</p>
      <p>Karsten Luecke, KLTF</p>
