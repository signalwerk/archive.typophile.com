      <p>Hello Nick, I think your question is good: Should a revival pay tribute to the technology for which it was originally designed, and thus mimick flaws or pecularities resulting from this technology? But this question belongs to one realm (revival ethics), and the question which asks if iKern does a good job belongs to quite a different one (spacing models). It would be odd to criticise iKern because it was applied to the wrong kind of typeface. </p>
      <p>I feel reminded of a previous discussions about the goods and bads of DecoType/WinSoft's InDesign plug-in Tasmeem, a layout engine for typesetting Arabic which uses a special font format. Thomas Milo usually presents its capabilities with help of a high-end typeface of a special style. (By the analysis of this style he arrived at the technology, but in the end the technology is suited for any other style too.) To my amusement or regret (depends on my mood) this provoked some critics to blame him for propagating this particular style which they consider outdated -- and disregard the layout engine because of the style of the typeface used for presentations! A layout engine of course is "mere" technology and is ignorant of anything like designers' sentiments.<br>
      Same is true for iKern. If you object to a Fell being kerned at all, then I had preferred if there were no "automated" in "applying <em>automated</em> spacing to pre-designed types".&nbsp;&nbsp;;-)</p>
