      <p>Yes, the Venn overlap.<br>
      Spacing is an intelligence that can be handled in different places.<br>
      It can be put in the layout application (InDesign Optical), or in the font (Metrics), or it can be manually applied by the typographer.</p>
      <p>It should also be understood that such intelligence is discretionary.<br>
      To illustrate, consider this example.<br>
      First, this is how it sets default. There are negative sidebearings on v and y, which implement the idea that the white space between letters should be evened out.<br>
      However, there are at least two conflicting principles in spacing, the two main ones being "controlling area" versus "controlling proximity". Here, in the v_y combination, it seems to me that space has been overly privileged against proximity. I realize that this is my aesthetic, today. In the past, I would have been OK with the overlap. But not today. So:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/heavy_3520.png"></div><br>
      1. Default.<br>
      2. With added kerning to provide separation, the way I like it.<br>
      3. But if this is built into the font or application, it doesn't work when tracking is tightened for a display setting.<br>
      4. So, according to the "tight but not touching" aesthetic, yet further spacing has to be added, between e_a and v_y.<p></p>
      <p>So even with a sans serif font, it may be necessary for the type designer to provide optical size variants, and even then, the layout application may be able to offer different "flavours" of kerning. And even then, the typographer may be able to say, screw that, I'm going to exercise my responsibility, turn on manual overide, and blow up the f****** Death Star.</p>
