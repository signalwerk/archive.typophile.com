      <p>The optical size issue definitely adds a layer of complexity to the issue, as several have written here. </p>
      <p>Slimbach has argued that with larger optical sizes spacing of round to round  letters is often are best changed differently from straight to straight letters. If this is correct, tracking won't do the trick for the best spacing at larger optical sizes. There is also the issue of adjusting kerns for more than one character, as Nick notes. This can get very complicated, but there's also the question of when it ceases to make any real difference.  </p>
      <p>I gather what Igino is arguing for is that his program should be built into type setting programs for the best result. And perhaps having more variables under control of the type setter as well? That is intriguing and makes sense to me. In a way Adobe's "optical spacing" is maybe something like that, but of more limited use than what Igino envisages.</p>
