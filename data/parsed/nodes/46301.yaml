      <p>Eben -- <cite>this kind of statement strikes me as maybe too absolute</cite><br>
      Karsten -- <cite>indeed I mean logical consequence, and as such it is absolute.</cite><br>
      Eben -- <cite>I think if you are going to use words like absolute then you have to build a strong case at least.</cite></p>
      <p>But Eben, it wasn't me who introduced this term! I admit it was my fault to not having ignored it, or at least putting quotes around it to indicate it's not mine.</p>
      <p><cite>Were you saying that a Gutenberg paradigm was one that leads "logically" and "absolutely" (I might say inevitably), to simpler shapes?</cite></p>
      <p>I did not say it "leads ... to <em>simpler shapes</em>" -- didn't speak of simpler shapes at all (this discussion is about spacing), rather said that the paradigm as such <em>implies</em> a certain aspect of economy (but then, it was another fault to respond to the ligatures theme which is secondary in a discussion about spacing).<br>
      I did not say it "<em>leads 'logically' or 'absolutely' ... to</em> simpler shapes" --  and wouldn't because of an aversion against Hegelian thinking, rather I tend towards a Kantian/Peircean understanding of "logic": <em>If</em> you think of it this way, <em>then</em> you automatically <em>imply</em> that. The "if-then-imply" is what qualifies as "logical".</p>
