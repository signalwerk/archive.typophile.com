      <p>Yes, it is critically important to design glyphs in context to space well. But once they space well there is still kerning to do. At the very least, letters like WVTY in many combinations benefit from kerning, as well as punctuation. And adjustment of many others will result in more even color, no matter how well designed they are. </p>
      <p>But I agree with Igino that the ideal kerning is so extensive, delicate, and boring that a good program is likely to save you from blunders. Certainly, one should proof and adjust. But hopefully the program would have enough variables that are adjustable that you could also some batch adjustments, as well as individual ones. </p>
      <p>I believe Karsten mentioned somewhere that Lucas de Groot did kerning of triples somehow, which is actually a benefit also, but the whole thing gets quickly out of hand. I know Lucas also has lists of kerning pairs for every language, to reduce the burden. </p>
      <p>Any tool that helps reduce the drudgery of this, and make it accurate, I would certainly praise.</p>
