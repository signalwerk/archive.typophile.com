      <p>When Carl wrote "<cite>To put an even finer point on it, many discussions have arisen here about the role of “white space”, which is exactly what Inigo’s program is concerned with. Evading the crucial lessons of spacing sounds initially like a terrible loss in a field where visual discernment has always been crucial. </cite>" I think he hit the nail on the head as he often does. </p>
      <p>This is the question that a user of Igino's sytem has to consider. My interpretation of what he has said so far is something like "you can use my system to skip ahead and make refinements afterwards if they are neeeded". This is a tempting idea. But again, if you believe that kerning is not a chore to be dispensed with but a core aspect of type design it is still hard to think of iKern as something to bring into an ideal process. On the other hand, not all typefaces or process' need to be ideal I will admit! Nevertheless, the question remains.</p>
      <p>Ockham’s razor seems like an odd tool to consider in concert with Gutenburg model of printing which had so very many special versions of letters and so very many ligatures! But this question of fitness of a reference aside, the thing that strikes me is that while your idea may be sound in some respects - that a robust design capable of fitting well with a minimum of fuss has deep utility, ( correct? ); the idea that this is the logical absolute and inevitable model we must consider is something that I ( of course ) am pretty skeptical of. I can sort of see the idea that the Gutenberg process might have an inbuilt tendency towards simplicity over time. That idea is a I think far from being either proved or disproved. In it's favor would be the idea that printed books must have taken on their own validity outside of the context of the written book over time and that once that context was established that the power of economic need would dictate a move to simpler and faster methods.</p>
      <p>Part of the reason I object is that I think this idea is what Americans would call "monday morning quarterbacking", meaning coming up with explanations and justifications after the fact. It's quality of being "Ex post facto" might lead you to the word "absolute" in the sense that this model does indeed dominate at the moment. But will that status last? Does it have to? Is it actually best? I am not at all sure about any of these things. </p>
      <p>When I read Morrison on type design and on Incanumbula and especially on Jenson I get that same feeling. Like I am not reading an incisive theory that explains something in a deep manner but rather that an explanation or story that has the lone virtue of fitting the existing data is being conjured up. Get a bit more data and that story could be tipped over...</p>
      <p>Reading Van Krimpen give me again, the same feeling.</p>
      <p>Similarly, if iKern is based on fitting certain kinds of forms and has assumptions built into it about what letterforms are probably like ( the story) rather than having a way of sensing them directly, like the Kindersley system did, then it is not going to be a very robust kerning tool. </p>
      <p>Unfortunately I still don't quite understand the mechanism of iKern.</p>
      <p>Maybe I will eat my words. But that's how it looks to me now.</p>
