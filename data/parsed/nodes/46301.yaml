      <p>To Nick:</p>
      <p><cite> Surely the bodiliness value that’s relevant to L_A and T_W is for the negative area immediately adjacent to the horizontal stems, and with that stem height—not for the glyph as a whole. </cite></p>
      <p>I haven't said how "my" bodiliness is calculated and how its treatment is. As I already said, I can't go into details so I'm trying to express myself in the easier way possible. The fact that, as default, I've put the minimum distance as minimum as possible is functional, in my opinion, to preserve, as much as possible, the rhythm. For the same reason the AV kerning is set as wide as possible. LA and WT have a lot of "air"? Let's minimize it; AW has little "air"? Let's maximize it.<br>
      Anyway it's not important. I'm glad of your comment. What have you done? You have isolated a problem having in mind a solution, thanks to your experience. Imagine now to try to formulate the problem and the solution in mathematical terms, finding general concepts to put into a type oriented framework. Imagine doing this many many times until you feel the framework is grown and is "robust" enough (in this case only you could know!). This way you could give iKern the right to existence!<br>
      [Before you reply: I don't think you don't give it. I appreciate your positions because are honest.]</p>
      <p>I'm not trying to convince anybody to change religion. And, listen well, I'm not just promoting myself as a service owner. All I want is that people begin to consider some degree of automation not being so bad even in terms of quality. And I want that people know that there is the chance to adopt a different and productive workflow.<br>
      The way? Try, use your eyes and judge yourself if it's worth.</p>
