      <p>Igino, you may be able to refine the tool, and make it more responsive to the discretion of the user, but you haven't addressed my fundamental critique of applying automated spacing to pre-designed types, especially those that are historic.</p>
      <p>The shape of letter forms is intricately related to the media for which they are designed, and its quality of spacing.<br>
      In fact, the shape of the letters and the space between them are part of the same gestalt, notan, or whatever you call it, at any point in time. The design process is not a unidirectional "(1) glyph, (2) sidebearings, (3) kerning".</p>
      <p>Therefore, to apply 21st century spacing to facsimile 17th century type forms is inappropriate.<br>
      Of course, the unspaced Fell italic all-cap setting looks wrong, but it would have looked wrong back in the day, too, and would have been generously letterspaced then, and with discretion, wouldn't it?</p>
