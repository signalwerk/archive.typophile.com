      <p>Nick, I've understood your point of view but it's a bit too radical to me. Let's suppose I had the possibility to copy the original spacing from the original punches and realized a font this way. I would have been in error even in this case because it would turned out to be a digital font to be laser printed or inkjet printed without the feeling of the real spreading ink, the pressure, the right paper, the words, the reader ... Maybe I extend too much but I should think you think that the idea of a facsimile is unaccetable at first. Anyway I made them to use them myself and not for a culural operation. That why I think I'm freed from the boundaries of fitting. And for what I know they've been effectively used by others in modern contexts too. I  sometimes use the ornaments in my professional documents.</p>
