      <p>To William:</p>
      <p>&gt; Is IKern a program you sell? </p>
      <p>Not anymore.</p>
      <p>&gt;How does it compare with KernMaster from DTL?</p>
      <p>I don't know. Never had the chance to try it! Anyway iKern does autospacing and autokerning at the same time allowing a straight and productive workflow from the design to the font. About the quality I'm confident the output is, at least, adequate. But everyone can judge it by himself. The autokerning stuff rely sometimes upon informations extracted during the autospacing phase. That's why I tend to consider the “only autokerning” a nonsense and I've abandoned three years ago an “only autokerning” iKern version .</p>
      <p>To Kris:</p>
      <p>&gt; How does it compare to kerning by a human?</p>
      <p>&gt;&gt; I’ve come to the conclusion that spacing and kerning are<br>
      &gt;&gt; absolutely not a matter of Art. They’re just a Tecnique.</p>
      <p>&gt; You could say that about anything! Like playing the<br>
      &gt; guitar, acting, cooking, painting…</p>
      <p>How, I'm very glad you give me the real occasion to say many things. First of all I've to say that for years I have surgically examinated supposedly professional fonts. My conclusion is that only few humans actually are able ro really kern (and space). I'd have to come to the conclusion that a tool like iKern should have suited the needs of the rest of the World. But I've been told that the font industry survive even selling fonts without kerning (and the customers don't even notice!). That said for six years I've tried to analyse the essence of this job and I think that what the few humans do is, in very short terms:<br>
      fully understand the underlying rules of fitting;<br>
      have the capacity, the strength, the time and the will to apply in a coherent and complete manner these rules through all the fonts.<br>
      I tend to consider this second part of the action more as food for computer. That's why I always heard from anyone involved that kerning and spacing is not, at least, funny. It's normal. We hate repetitive tasks. We tend to be distracted. We like open air. We like many other things.<br>
      I tend to consider the “full understanding of the rules of fitting” a common quality in many people and not the exclusive gift of a religious caste. And this is the real core question. I don't know at which level the full understanding is. Certainly not in a formal, I would say conscious, level. Otherwise a real usable fitting theory would explicity exist today and we wouldn't here to discuss. What I'm saying talking about iKern is that I think to have found a mathematical model that describes those “underlying rules of fitting”. Am I right? Am I wrong? I'm confident to be right when I'm satisfated with the output iKern produces. I'm not confident when I see something I dislike. But I'm there to make it better. Consider I've sometimes re-elaborated the model just to change a kerning value of two points (I admit it. I'm a geek). But first of all I am confident when other people tell me the output is good, sometimes very good, for some enthusiast perfect. And, as the font industry man would say, I'm confident when I find people willing to pay for this service.<br>
      To finally answer I would say that there is no difference between what a human does and what iKern does. But to use myself a metaphor: I'm able to walk. I like it. But I'm often use a car. And a GPS too. And more: the model is not strict. Since autospacing has to be done the whole rhythm has to be reconstructed. And the man (me) says how.</p>
      <p>Let's now discuss the “Tecnique” side. I'm actually a good guitar player. I had the fortune to have parents that forced me to study music. The piano seemed to me too much demanding so I fell back on the guitar (girls like guitarists. You know). But I don't consider myself a real guitarist. Because I don't have the music in my heart. I can only mimic. I think that spacing and kerning is like playing  the notes written in the outlines. Nothing else. No composition here. Just execution.<br>
      I'm a decent cook too. But I don't think that nutrition would require Ferran Adrià. My “cuisine” mot is: a cook only needs gram scales (possibly digital).</p>
