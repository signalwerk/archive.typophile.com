      <p><em>What do you think needs adjusting?</em></p>
      <p>Well, if it were my face, I might put more space between the L and A, but then again, I might not.<br>
      I don't believe in absolutes, and that includes any "underlying rule of fitting".</p>
      <p>I once rekerned Palatino (in Quark XPress) for a series of publications I designed in 1991. I wouldn't say my spacing was better than the default, but it was something I decided would work for my design, which involved condensing the face around 90% horizontally (the horror!) I've dug up one of those pieces--text at 10pt-- and scanned it, and reset it with the default spacing for comparison:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/YouCan_5207.jpg"></div><p></p>
