      <p>What I meant is, why smooth out the spacing with 21st century techniques, but leave other characteristics of the typeface in their original form?</p>
      <p>The typeface was originally designed to <em>not</em> be kerned.<br>
      ~<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Fell_6586.jpg"></div><br>
      For instance, compare (what I assume to be) the original spacing, above, with the new spacing, below.<p></p>
      <p>Isn't the shape of the W, with its angle of slant greater than the norm of the typeface, designed to address the spacing criteria of the available technology? By kerning after the W and T, a cramped effect is created, at odds with the letterforms.</p>
