      <p>I have looked at the Linotype drawings at the Museum of printing now. And what I found was that 98% of the time what looks a little like variation is in fact differences in inking, pressure &amp; so on. So Bill, you were bang on in general as I think we all knew you were.</p>
      <p>However! I did find some nice examples of honest to goodness for sure, no doubt, contextual alteration. Part of what ’s fun with the drawings is seeing the original line erased. </p>
      <p>Mind you - there might be more - but I only had a day. I wouldn’t expect to see very many more if there are any at all. What I wish I had time to do is to compare across pt sizes. This might not be possible in some cases because the special logotypes were not always available in all pt sizes. It is even possible that thye only exist in the point size in which I found them.</p>
      <p>So, here is what I found. </p>
      <p>Janson 8pt. The far right serif of the W is wider on the Wa logotype than on the W. </p>
      <p>Baskerville. 10pt - rf vs sf - the rf combo forces the crossbar to be shorter on the left side ( next to the r ). The sf logotype uses a consistant s &amp; the basic special f found it in the logotypes. </p>
      <p>Caslon italic 10pt - fs vs fr ( also ffr &amp; ffs)  - the fr combo requires a shorter bar again but this time on the right of the f not the left.</p>
      <p>Garamond no.3 10pt. fa vs fy ( also ffy) - slightly shorter bar on the fy similar to the example above. ’fa’ has a normal crossbar.</p>
      <p>As I said in my blog; Larry Oppenberg’s help in understanding the organization of the papers and how to efficiently use the resource was invaluable. Thank you Larry! And of course Gardner’s giving me the chance to do the research was likewise. Thanks Gardner!</p>
