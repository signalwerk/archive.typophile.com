    html: "<p>Eben, just to clarify: since Linotype matrices do not allow kerning, to get not only fi, fl etc., but also fa, fo, fe, fu, with a traditional Caslon full f, they would have to do logotypes for these that would fit on a single matrix. These were done for Caslon Old Face, probably to compete with Monotype for book work. I don’t know how often they were actually used, but they are in the old specimen book I have. I kind of doubt that this was done much for other Linotype faces, but you could ask Larry Oppenberg.</p>"
