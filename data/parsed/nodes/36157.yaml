    html: <p>I don’t know about metal Linotype’s other faces—a large specimen book would give you a pretty good answer. I suspect that in the new faces designed for Linotype there would have been less motivation to do f ligatures, because there was no need to give the feeling of an old classic, which was the goal with Caslon. My impression is that for new stuff they tried to design to the limitations of the Lino machine, and tried to make a virtue of the limitations—the necessity of short tops on the f’s, the need for wide italics.</p>
