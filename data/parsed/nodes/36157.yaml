      <p>Eben —</p>
      <p>You should have grabbed Mike Parker while he was at TypeCon. He probably could have given you insight into the Linotype ligatures/logotypes. (Though you might have gotten a lot more tangents than you bargained for.)</p>
      <p>A more practical contact for you might be Larry Oppenberg. He’s head of Galápagos Design, and on the board of the Printing History Museum (which is in North Andover, not Boston, btw), and worked in the drawing office at Mergenthaler Linotype toward the end. You can still find drawings in the museum with Larry’s name on them, I think.</p>
      <p>IIRC, these logotypes were only made for a handful of fonts, and you would have had to insert them manually, since there wasn’t a place for them in the magazine. </p>
      <p>I’m not sure I’m understanding your first questions about the shapes. As far as which combinations, I’d be willing to bet that this would have been decided on a font-by-font basis. And the decision would likely have fallen to the head of typographic development — which would have been C.H. Griffith (until 1949), then Jackson Burke (until sometime in the 60s), then Mike Parker (until the early 80s).</p>
      <p>For the ligatures, obviously there will be separate drawings. The telling thing would be whether there were separate drawings for the logotypes or whether there were just alternate spacing specs and directions for cutting the logotype matrices from the constituent parts.</p>
      <p>I hope to be making a research trip to the museum within the next few months. If I still remember this question then, I’ll try to see if I can dig up any more concrete information for you.</p>
      <p>— K.</p>
