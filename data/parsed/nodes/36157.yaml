    <p>I have been looking at a book of Linotype type samples that Jim Rimmer Gave me. ( Thanks Jim!) </p>
    <p>It has a section it it explaining &amp; extolling the virtues of the f ’logotypes’ they made available in some fonts: ff fi ffl ffy ffs ffe and so on. There are also Diagonal and other difficult letters combinations in Italic such as TA FA VA WA; &amp; Va Pa Wa Yo etc.  </p>
    <p>Questions:</p>
    <p>If I wanted to study this further it seems like the type Museum in Boston would be the best place - do you agree?</p>
    <p>Have any of you spent time looking at these things? Obviously their main point is to allow for kerning in the most difficult combinations - but have you ever noticed anything else? In addition to the 2nd f getting anew height/shape, in some cases I think I see subtle shifts in shape in the new letters - mostly it’s the crossbar of the f getting shorter in some cases. </p>
    <p>Who might remember what the decision making process was like &amp; what combinations may have been considered and ultimately rejected?</p>
    <p>Thanks!</p>
