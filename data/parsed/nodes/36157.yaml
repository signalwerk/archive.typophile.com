      <p>These glyphs were called typographic refinements. The punches in combination (double hit) were used in order to make one matrix.<br>
      Both Linotype and Intertype manufactured these matrices. Because there were no overhangs allowed in linecastng machines special “true cut” matrices were made but the tracking was not esthetically pleasing. Of course Monotype composition never had these problems.<br>
      Yes, it is true that most of the type families that contained the typographic refinements were for book composition. Ludlow display mats were also punched with overlapping characters.</p>
