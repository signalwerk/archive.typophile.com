      <p>Eben —</p>
      <p>I believe, as Bill says, that the full logotype treatment was typically done with faces that were targeted for bookwork. Further, the extensive f ligatures/logotypes would have been applied primarily to faces that were adaptations of older or competing typefaces, where the overhanging f was an integral part of the design (and a customer’s expectations).</p>
      <p>For original designs, you usually find that the f has been crafted to disguise the Linotype’s mechanical limitations, and so, extensive f-combo logotypes were not necessary to achieve the proper effect.</p>
      <p>— K.</p>
