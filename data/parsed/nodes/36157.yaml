      <p>Linotype’s 1923 Caslon Old Face did have a whole series of f ligatures, at least in some sizes. And I’m sure the drawings are there in the Museum of Printing. The idea was, I think, that people could use these ligatures for book work and get the effect of the original hand set type. </p>
      <p>Larry Oppenberg was wonderfully helpful to me as well; he’s invaluable for helping you interpret the measured drawings. If anybody would know about whether there were general rules concerning the formation of ligatures, it’s probably Larry, who remembers the practices there at Merganthaler Lino. Matthew Carter and David Berlow also worked there drawing type back in the day, and several of Larry Oppenberg’s colleagues at Galapagos Design.</p>
