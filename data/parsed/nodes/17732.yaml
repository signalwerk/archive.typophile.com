      <p>The typeface was designed about two years ago by Ludovic Balland (studio: the Remingtons, Basel, Switzerland). He named it »Stanley« in honor of Stanley Morison.<br>
      He also used it in a series of bookjackets for »Das Magazin Schweizer Bibliothek« which can be seen <a href="http://www.schweizer-bibliothek.ch/reihe.html" rel="nofollow">here.</a></p>
