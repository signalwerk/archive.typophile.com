    html: |-
      <p>I didn't mean to imply this was an actual Majoor typeface, this looks very much like somebody tweaked/decomposed and put whatever together again, a "deconstructivist" thingy. The lc_s completely falls out of the overall seriffed appearance, the whole thing has a very hybrid feel to it, as if it was put together from different fonts, etc. I don't think this is a released typeface, but I might be proven wrong in a minute :-)<br>
      But again, some parts, as mentioned above, remind me of Majoors approach to the respective shapes/chracterforms or parts of…</p>
