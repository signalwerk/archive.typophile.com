    html: "<p>Oystein: <br> <br>Well, I wouldn't do it that way. Are you also copyediting the book, or just laying it out? <br> <br>If you can change the verbage, I would phrase it thus: <br> <br>\"It's not that hard to notice,\" he continues. \"Just look at what you're wearing.\" <br> <br>(Bearing in mind that Norwegian may be different than English when it comes to parsing sentences.)</p>"
