      <p>I’d look into screen printing too...you could print the pages as a signature (ie, multiple pages on one large sheet) then trim and bind.</p>
      <p>That said, the cost for both screen printing and letterpress is typically the set-up. So, both aren’t really designed for runs of 3 or so.</p>
      <p>One last option...back in the day (a decade+ ago in art school) one could by little sheets of custom color. They looked like foils. You’d place it on top of your laserprinted paper and apply heat to it, the heat would fuse the color to the toner in the paper. It was a way to emulate spot colors and foil embossing.</p>
      <p>that might work if your use of color is in small amounts.</p>
