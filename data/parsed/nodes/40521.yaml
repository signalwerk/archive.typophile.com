    html: |-
      <p>Silkscreening is the same as screen printing. Basically large sheets of fine screen fabric stretched over a frame. Using photo emulsion you can burn and block out patterns into the screen which then, using a squeegee, you push ink through the empty spaces to make a print. It’s fairly easy to do yourself, but you need a super intense light to expose the emulsion. I found a video of someone printing his already prepared screen. </p>
      <p><a href="http://youtube.com/watch?v=qCZe9BWxCu0" title="http://youtube.com/watch?v=qCZe9BWxCu0">http://youtube.com/watch?v=qCZe9BWxCu0</a></p>
      <p>I’m not sure if regular printing houses do this, but there are probably studios in your town that will. Also you could hit up art schools and find a printmaking student to do it for you. This is how a lot of hand-printed t-shirts are made as well. I’ve used this technique for type in books before and it works really well. And like I said the ink comes in all sorts of colours like flouresents and glow in the dark. You can also print white.</p>
      <p>Look up “silkscreen book” on flickr for tons of images of small run books other people have done.</p>
