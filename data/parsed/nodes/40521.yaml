    html: |-
      <p>To clarify why I think letterpress is ideal for runs of 3 (as opposed to offset)...most commercial printers are not going to want to print a run of 3. There are lots of letterpress printers who would be happy to print a run of 3.</p>
      <p>Another very modern option is the digital press that many small business printers have these days. I think the limitation here, however, is that spot inks are not possible. I could be wrong, but I’m pretty sure you’re limited to the 4-color process with the digital printing technology.</p>
