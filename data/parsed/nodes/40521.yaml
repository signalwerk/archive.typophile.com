      <p>Depending upon how much time and money you have, letterpress might be a good solution, especially limited runs like 3 copies.</p>
      <p>If you’d like to explore this option, these three are friends of mine:</p>
      <p><a class="freelinking-external" href="http://www.exquisiteletterpress.com/">Peter Fraterdeus</a></p>
      <p><a class="freelinking-external" href="http://www.boxcarpress.com/">Harold Kyle</a></p>
      <p><a class="freelinking-external" href="http://www.kennedyandsonsfineprinters.com/">Amos Kennedy</a></p>
      <p>I’m pretty sure all will take on custom jobs like the one you’re talking about. You can do your set up on the puter and have polymer plates made for printing, with the ink color(s) of your choice. Pretty sure there are no limitations. The only setback here is that it’s going to be pretty expensive, I think.</p>
