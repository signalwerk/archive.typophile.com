    <p>I’m creating a book for some friends of mine. I’ll only produce two or three books, so offset printing is not even an issue. Anyhow: I’m luvvin this neat fluorescent red colour I came across and really want to use it for this project. What are my options?</p>
    <p>I searched the net for clever solutions, but couldn’t find anything (except a printer cartridge called “Canon Bc-29F” with fluorescent ink – but no further description on what results it gives). </p>
    <p>Cheers.</p>
