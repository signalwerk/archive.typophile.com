    <p>Hi Everyone. </p>
    <p>I'm new here. My name is Carla and I serve as the Publicity Directory for my student theatre group. I'm currently art-directing a fellow student to come up with a poster for the show City of Angels (a 1940s musical about a novelist who is writing a screenplay. Half of the show is in black and white, and half is in color, done with set and lights.)</p>
    <p>That said, we're looking for an font or typeface that will imitate the look and feel of the font used on the Dick Tracy comic books, as the art for the poster is in that style. </p>
    <p>I've attached the image below... could anyone help me to identify a font that would work? We can probably spend up to $50 to purchase a font if necessary. </p>
    <p>I've already done quite a bit of searching for comic book fonts, but I was hoping the experts here might be able to narrow down my search a little. </p>
    <p>Thanks in advance!</p>
    <p>ETA: I've added a second image which is the one that I'm basing the poster on most. (Grould1947.jpg)</p>
