    <p>Hi all</p>
    <p>I am designing a display typeface in Fontlab. It has substitute ligatures for pretty much every letter combination (like A_A, A_B, A_C...etc). I want to put them all as discretionary ligatures. The code at the moment looks like this:</p>
    <p>feature dlig {<br>
    	sub A A by A_A;<br>
    	sub A B by A_B;<br>
     	sub A C by A_C;<br>
    	sub A D by A_D;<br>
    	sub A E by A_E;<br>
    	sub A F by A_F;<br>
    	sub A G by A_G;<br>
    	sub A H by A_H;<br>
    	sub A I by A_I;<br>
    	sub A J by A_J;<br>
    	sub A K by A_K;<br>
    	sub A L by A_L;<br>
    	sub A M by A_M;<br>
    	sub A N by A_N;<br>
    	sub A O by A_O;<br>
    	sub A P by A_P;<br>
    	sub A R by A_R;<br>
    	sub A S by A_S;<br>
    	sub A T E by A_T_I;<br>
    	sub A T I by A_T_E;<br>
    	sub A T by A_T;<br>
    	sub A U by A_U;<br>
    	sub A V by A_V;<br>
    	sub A W by A_W;<br>
    	sub A X by A_X;<br>
    	sub A Y by A_Y;<br>
    	sub A Z by A_Z;</p>
    <p>.......(and will eventually go all the way to Z_Z)....	</p>
    <p>} dlig;</p>
    <p>I am afraid it may end up being huge and perhaps make the font slow, although it is a display font so most probably it won't be used for huge chunks of text. </p>
    <p>Is there any other way to do it? I am not good at scripting and I've searched around but I couldn't find if there is another way to use classes to do it.</p>
    <p>Any help will be greatly appreciated.</p>
    <p>Thanks!</p>
