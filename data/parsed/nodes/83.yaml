    html: <p>Pritchard is more Brody/80s style, whereas this  <br>sample has early 90s written all over it.  <br>Especially the 'S' with its angled flat top and  <br>bottom strokes and those typical 'M' and 'E'/'C'  <br>shapes. An important trait of this face is that  <br>all the characters are basically rectangles, and  <br>almost all of the action happens within those  <br>squarish shapes. <br> <br>I think Chesh was onto something. Somehow it  <br>reminds me of early T-26 stuff too.</p>
