    html: "<p>Cheshire - That sounds amazingly familiar. The programmer in our office is a LA Kings fan. He can't stand basketball, or any other sport for that matter. Except maybe foosball. <br> <br>Does Margo Chase do a lot of sports logos, or does she just do a lot of logos in general? I'm sticking with my interpretation - that it is a combination of letters from at least the two fonts mentioned above: pritchard and narrowband (and maybe another one for the R's, but I think that is just a modified R from narrowband.)</p>"
