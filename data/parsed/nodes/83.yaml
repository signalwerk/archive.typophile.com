    html: "<p>Let's see if we can nail this down: <br><img src=\"http://www.typophile.com/forums/messages/83/10786.jpg\" alt=\"\"><img src=\"http://www.typophile.com/forums/messages/83/10787.png\" alt=\"\"><img src=\"http://www.typophile.com/forums/messages/83/10788.gif\" alt=\"\"> <br>S - Narrowband <br>A - Pritchard <br>C - Narrowband <br>R - ? <br>M - Narrowband? (hard to tell from the eyewire sample) <br>E - Narrowband <br>N - ? <br>T - Narrowband <br>O - Narrowband <br> <br>This isn't the Frankenstein of fonts - it's the frankenstein of name marks. <br> <br>Tiffany, thanks for the Pritchard I.D. Last time I saw that font was when working on BYU campus and SLCM. The only font name I could remember was Parisienne. Wrong 'P' font. You just saved me from having a complete breakdown.</p>"
