  - id: 207
    user: 1112
    date: 2003-05-15T12:21:00
    date_raw: 15.May.2003 12.21pm
    votes: null
    html: "<p>I don't know that she's done any sports logos. She's done quite a bit of design for music, television, and film. She has, or at least used to have, a very recognizable goth style (as opposed to how typophiles regard the term \"gothic\"). The notable clients I remember off the top of my head were Cher, the early-90s \"Dracula,\" and the television \"Buffy the Vampire Slayer.\" <br> <br>Here's an example from her website that shows the kind of work I associate with her (at least early-90s) style: <br> <br><img src=\"http://www.typophile.com/forums/messages/83/10826.gif\" alt=\"Margo Chase\"> <br> <br>You can see here exactly why I thought it might have been her. Keep in mind, though, that she's had a number of staffers over the years. Early in my career, I worked side by side for a day sketching logos with someone who had worked in her studio, and his work was extremely similar to hers (he favored extremely goth-looking monograms, as she did). So it's altogether likely that whoever designed the logo may have once worked for her, as I don't think she did it, or I'd think she'd have put it on her site.</p>"
    html_clean: "<p>I don't know that she's done any sports logos. She's done quite a bit of design for music, television, and film. She has, or at least used to have, a very recognizable goth style (as opposed to how typophiles regard the term \"gothic\"). The notable clients I remember off the top of my head were Cher, the early-90s \"Dracula,\" and the television \"Buffy the Vampire Slayer.\" <br> <br>Here's an example from her website that shows the kind of work I associate with her (at least early-90s) style: <br> <br><img src=\"http://www.typophile.com/forums/messages/83/10826.gif\" alt=\"Margo Chase\"> <br> <br>You can see here exactly why I thought it might have been her. Keep in mind, though, that she's had a number of staffers over the years. Early in my career, I worked side by side for a day sketching logos with someone who had worked in her studio, and his work was extremely similar to hers (he favored extremely goth-looking monograms, as she did). So it's altogether likely that whoever designed the logo may have once worked for her, as I don't think she did it, or I'd think she'd have put it on her site.</p>"
