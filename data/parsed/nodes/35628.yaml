  html: |-
    <p>This is a logo design for a speech/writing contest at a university. The contest is for undergrads. The idea is to put a youthful/energetic face on a concept that might seem boring. The target media is print and the smallest size will be letterhead.</p>
    <p>The client liked this font. </p>
    <p>I don't care if you think this looks like mindless trash from a 1990's clipart collection. :) I just want to know how the kerning looks on the main "voices" text.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/voices2-first_4988.png"></div><p></p>
    <p>I'm trying to get better at manual kerning...</p>
    <p>Thanks.</p>
