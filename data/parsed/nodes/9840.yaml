    html: <p>Hi James. BJ has a good point, who are you trying to reach. folks in technology who needs branding and annual reports, club owners who need flyers, galleries, ? <br>Well lets move on and assume you know what market it is for. What about the mark as a visual element. <br>I suggest you balance it more. Top logo is best in my opinion, but it needs more balance. If you are familiar with kerning and spacing, it is important that things look balanced. This can only partailly be done by measuring distance. Think of this in terms of volume and not only distance. The side of the G looks like it lines up with the edge of the M if you were to draw a straight line, however since the G has curves and is not straight like the M there needs to be adjustments made. You have made this more difficult be boxing all elements in a grey box. Well I have made a mock-up to get you started in the right direction. <br> <br><img src="http://www.typophile.com/forums/messages/29/67705.jpg" alt="MG"></p>
