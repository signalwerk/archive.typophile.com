    html: <p>"Mode" means "fashion" in Danish, and I think it is the same for French language. As you are not a fashion designer perhaps it is a bit confusing. If you like to use something that sounds like "Mode", and is similar in meaning, perhaps consider shortening it to "Mod".  <br>You are not trying to reach any specific market- I understand your point that you would just like to get work and it is not important if it is from corporate clients, a .com, a restaurant, ? Still consider that certain places have more or less of certain demographics. Consider how many senior citizens, immigrants, white, black, educated, blue collar, white collar, small business, chains, etc...... and if you like to work for everyone, well target to largest demographic in your area. <br>btw. I am not sure why it was suggested you change dot from red to another color. I do not see a problem with it being red.</p>
