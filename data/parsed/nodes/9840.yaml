    html: <p>Brian. Point taken (in your counter-critique). Perhaps the size is part of the problem and not just the color-not sure. <br>Darrel has a good point about using the word "graphics". It has association to desktop publishing vs. "design" or "graphic design" which brings to mind a more skilled and qualified professional sounding person. Then again perhaps if James does not want the more difficult clients that demand more processes and comps to please, perhaps the word "graphics" is ideal. As James mentioned he did not want to target specific industries- ironically the process of elimination (by choosing to use wording such as "graphics" vs. "design") has already begun. Just to clarify- I do not think there is anything wrong with desktop publishing- client expectation is lower, so it the pay, but the volume make up for it.</p>
