    <p>Another summer has come, and I appear to have landed another not-so-hot internship. There’s been no new work at this firm for a month (for almost all the staff, not just me), and given how low the pay is, I would be better off just doing temp work or freelancing. The only reason I have not left already is that the firm has a semi-prestigious reputation and might look good on a resume.</p>
    <p>I am, however, concerned about what future employers will think about my record with internship work. I can’t get a good reference from my last internship because I quit when they really started taking advantage of me and it was not an amicable split. I also got no portfolio stuff from that job, because only two pieces I worked on were printed and they both looked like crap due to arguments between the marketing executives and the business executives over how things should look. If I quit this job I will probably have no good reference and again have nothing to show for it in my portfolio. </p>
    <p>As employers, how harshly would you judge a new designer who had done two internships, neither of which worked out?</p>
