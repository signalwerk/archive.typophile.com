      <p>Are you concerned that future employers will think negatively of what you wrote about past employers in public forums?</p>
      <p>What are you using to gauge the success of an internship? If you're getting good real-world experience then it's a success. If you get hired that's just a bonus. Many interns come and go without getting hired and it's not seen as a "failure". It is true that the stellar interns do get hired.</p>
