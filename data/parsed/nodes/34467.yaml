      <p>My concern or uncertainty if you wanted me to hire you would be the quality of your attitude.</p>
      <p>For example, you say they were taking advantage of you in the first internship. But what reasonable steps did you take to resolve the situation before quitting? I would guess if one tried to resolve the situation professionally, one could at least achieve an amicable split if it came to that.</p>
      <p>For another example, you say the firm you are at has had no new work. The firm's designers - including you - should be turning their attention toward winning new business - via good design. Congratulations, now you are learning about strategy, marketing, copywriting, networking... Welcome to the the real world of a designer.</p>
      <p>jarrod</p>
