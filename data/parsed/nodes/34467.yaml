      <p>Well for starters you don't tell future employers that it didn't work out.</p>
      <p>I quit my first internship too with no ill effects on my future career. You'll still have the internships on your resume. If you're that miserable and bored, then quit and really focus on trying to find portfolio pieces. I don't think anybody expects you to come out of an internship with portfolio pieces anyway. The references... if your teachers give you good refs and you can get one perhaps from someone you temp with or freelance for, you should be fine.</p>
      <p>But... and this is a big but... consider what your expectations are and have been from these internships. This could be important going forward. Nothing annoys an employer more than a fresh-faced design school graduate who expects to waltz in and be handed plum work. You have to start at the bottom, work hard, do the work you're given to do with enthusiasm and initiative, and hope that someone recognizes your individuality and discipline and gives you more interesting projects to do. It doesn't happen overnight and you have to make sure your attitude is commensurate with your position.</p>
      <p>My first job was operating a photostat camera for $7/hour. I worked all day alone in the dark with smelly chemicals, and the only perk was that the designers would come into my "office" after 6 and cut lines on the stat camera glass. They shared it with me since it was, after all, my office (it was a darkroom - you had to knock before entering - which helped them conceal their activity). After a few months the art director took me under his wing and started letting me help him and he liked me, I got to skip the mechanical stage and start laying out books within a year. I think it was a combo of luck (he took an interest in me) and perhaps talent/enthusiasm (he saw something he liked).</p>
