      <p>Hrant: <em>I actually believe that saccade-free reading is not only achievable, but also highly desirable.</em></p>
      <p>Hmm. A saccade is a zero-input eye movement between fixations. The shorter the saccades and the longer the fixations, the slower the reading. The longer the saccades and the shorter the fixations the faster the reading. The upper limit of reading speed has always been comprehension: the longer the saccades and the shorter the fixations, the greater the chance of comprehension error and the more regressive saccades necessary to correct false readings. Even at these highest, most error prone speeds, though, the mechanism of reading remains the same: fixation and saccade. Not only do I not see grounds to consider 'saccade-free reading' achievable, I can't even imagine what it would be like. If you're getting rid of saccades, that implies you are also getting rid of fixations, since the two are part of a single mechanism. So what is left? What is the mechanism of 'saccade-free reading'? How does it work?</p>
