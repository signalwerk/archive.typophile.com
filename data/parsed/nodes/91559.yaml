      <p>I give you my opinion as a reader, as I am not working in this industry. I find a too “reductionistic” font bland in a way that the letter or words actually “blur” more. It is harder for me to read. On the other hand a font which is skillfully crafted but too fancy might seem inappropriate for the context, but was never hard to read for me. As far as I know we do not identify single letters after each other but word shapes or syllable shapes and so I think adding more character to the individual letters will help to distinct syllables and words from each other, and will not distract. This is because (afaik) we do not pay too much attention to the individual letter, but to groups of letters.<br>
      This is based on my reading experience with serif fonts. With sans I find this question harder to answer. Do humanistic models have more diversity of letter shapes compared to geometric sans faces? Or do they follow different principles?</p>
