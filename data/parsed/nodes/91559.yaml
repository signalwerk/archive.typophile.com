      <p>I would think the answer to the issue raised in the initial post is "obvious".</p>
      <p>The differences between individual letters that people expect to find in order to distinguish them need to be readily visible. This is why, for example, learning to read Hebrew would be more difficult than learning to read Armenian - some letters have very tiny differences.</p>
      <p>But any irrelevant differences are distracting. If the descenders are of different lengths on a p and a q, since descender length isn't one of the expected distinctions between the two letters, this difference will only be a distraction.</p>
