      <p>To me it makes sense because reading is parallel:<br>
      the bouma is fighting to be recognized as fast as<br>
      the individual letters; without help it will usually<br>
      lose, and since reading a bouma saves time/effort,<br>
      this slows down reading. The good news is that<br>
      legibility is so easy to ensure that we have a lot<br>
      more room to play than we might think.</p>
      <p>hhp</p>
