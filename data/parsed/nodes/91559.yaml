      <p>John,  your question about legibility raises the question of what 'legibility' means. Luckiesh wanted to avoid the term because he thought is was too unclear. Tinker used it to refer basically to reading speed. Lieberman defines it (following some work in the '60s) as ease of distinguishing individual letters. That could be tested by minimum time threshold for recognition of letters with accuracy to a specified level. Or you might mean something tested by a contrast threshold. There is also the question of what distance you can recognize a character. These might not all be the same. </p>
      <p>Then speed of individual letter recognition and word recognition might be not totally go together, because of issue of coherence and spacing and rhythm in the font. And comfort in reading lengthy text is yet again a different question. </p>
      <p>Above I wrote about differentiation of letters, rather than legibility, but I suspect that also legibility of individual letters affects readability up to a threshold, and then other factors dominate.</p>
