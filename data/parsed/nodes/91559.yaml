      <p>Has there ever been any research or even discussion on what is "readable enough for a given task".  One end of a continuum might be a phone book number and another might be "War and Peace".  We could place things like brochures, ads, posters, etc.., wherever they may fall.<br>
      My point in this is that I assume there are points where the optimum for one task differs from another.  There is a place where the form of the typeface may aid communication of the message of the text yet reduce continual reading.  There may be a place where the form of the text has so little communication of content (beyond just as a letterform) as to be a non-factor.<br>
      When designing a typeface for a given target use, it might be valuable to know where these breaks occur.</p>
