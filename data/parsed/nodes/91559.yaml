      <p>Bill, I don't think there is a strictly linear relationship between letter recognition and word recognition, but I do think they are mutually supporting, not in opposition, and improve or degrade more or less in parallel. Linguistic context gives word recognition an advantage that enables some letters to be more easily recognised in words than in isolation, but  I don't see any basis to assume that such letters result in better word recognition than more individually legible ones would.</p>
      <p>I do think, however, that individual letter recognisability probably gives diminishing returns to word recognition, which is why reading speeds seem only marginally affected across a significant range of typeface designs and styles. In other words, endlessly refining individual letter recognisability will obtain smaller and smaller gains in reading speed and accuracy. But the point is that they do seem to continue to move in the same direction, albeit at increasingly disproportionate rates. There doesn't seem to be a point at which improving individual letter recognisability <em>degrades</em> word recognisability.</p>
