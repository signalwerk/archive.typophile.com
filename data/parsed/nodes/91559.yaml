      <p>Perhaps I don’t understand the question, “<em>What is the mechanism of 'saccade-free reading'? How does it work?</em>”</p>
      <p>You put on eye tracking equipment, look at a dot, present words in an RSVP fashion, and ask the subject questions about what they just read. Look at the eye-tracker data, their eyes haven’t moved, and presto, saccade-free reading. It’s just one long fixation. It’s clearly possible to attend to a single location without eye movements, I watch people in a lab do this all day. If their eyes move, the trial ends, and they try again. Are we on the same page?</p>
      <p>Regarding “<em>I would posit that the minimum duration a word needs to be exposed to be read with near-total accuracy is roughly proportional to some compound of its frequency and bouma distinctiveness.</em>” It is my understanding that frequency and semantics play the primary roles in determining duration. Again, I’d have to do a little more digging to find references to support this, but I know there’s a lot out there on just that.</p>
