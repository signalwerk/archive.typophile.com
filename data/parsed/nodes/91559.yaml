      <p>Again, I agree with John that I believe that word recognition will generally follow letter recognition. Easy to recognize letters will lead to easy to recognize words.</p>
      <p>But in the interest adding meat to those that disagree, Arnold Wilkins has an interesting line of research where he demonstrates that fonts with very high periodicity (e.g. the picket fence) lead to slower reading speeds. He has also demonstrated that modifying the letter shapes to reduce the picket fence effect increases reading speed. He didn’t look at letter recognition for his modified letter forms, but I assume that would perform poorer on a letter recognition test.</p>
      <p>Wilkins, A., et.al. (2007). Stripes within words affect reading. Perception, 36, 1788-1803.<br>
      <a href="http://www.essex.ac.uk/psychology/overlays/2007-177.pdf" title="http://www.essex.ac.uk/psychology/overlays/2007-177.pdf">http://www.essex.ac.uk/psychology/overlays/2007-177.pdf</a></p>
