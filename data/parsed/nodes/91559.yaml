      <p>I think it is about achieving a balance. The letters of a writing system should be ‘of one stock’, e.g. shaped out of some common ground pattern /model in order to form a unit. But the single parts need to be sufficiently different on the other hand, to make them distinguishable enough and avoid confusion. Both issues will distract the reader’s eye from comfortable recognition: too much similarity, and too much diversity.</p>
      <p>I once found the thorough study of Bembo quite enlightening about those questions.</p>
