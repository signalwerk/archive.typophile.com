      <p>@Kevin: “<em>Can anyone point to empirical evidence that making letters less individually recognizable ever results in improved word recognition?</em>”</p>
      <p>Not to my knowledge, but after a quick scan, I came across these two which I thought I’d throw out there for discussion (The second authour of the first paper caught my eye — pun intended).</p>
      <p>————</p>
      <p>Bouwhuis, D. &amp; Bouma, H. (1977). Visual word recognition of three-letter words as derived from the recognition of the<br>
      constituent letters<em>. Perception &amp; Psychophysics, 25 (1)</em>, 12–22.</p>
      <p>Abstract:<br>
      Word recognition is one of the basic processes involved in reading. In this connection, a model for word recognition is proposed consisting of a perceptual and a decision stage. It is supposed that, in the perceptual stage, the formation of possible words proceeds by separate identification of each of the letters of the stimulus word in their positions. Letter perception is taken to be conditional on position because of interaction effects from neighboring letters. These effects are dependent on both position in the word and retinal eccentricity, which are of particular relevance in reading. The letter-based approach rests on the strong relationship between the results from single-letter recognition in meaningless strings and in real words. Next, in the decision step, the many alternatives generated in the perceptual stage are matched with a vocabulary of real words. It is supposed that the final choice from among the remaining words is made in accordance with the constant ratio rule; frequency effects are not separately incorporated in the model. All predictions of the model are generated by means of data from earlier experiments. Despite being not optimally suited for this purpose, the predictions compare favorably with responses in word-recognition experiments.</p>
      <p>————</p>
      <p>Legge, G. E., Mansfield, J. S. &amp; Chung, S. T. L. (2001). Psychophysics of reading XX. Linking letter recognition to reading speed in central and peripheral vision. <em>Vision Research, 41</em>, 725–743.</p>
      <p>Abstract:<br>
      Our goal is to link spatial and temporal properties of letter recognition to reading speed for text viewed centrally or in peripheral vision. We propose that the size of the visual span — the number of letters recognizable in a glance — imposes a fundamental limit on reading speed, and that shrinkage of the visual span in peripheral vision accounts for slower peripheral reading. In Experiment 1, we estimated the size of the visual span in the lower visual field by measuring RSVP (rapid serial visual presentation) reading times as a function of word length. The size of the visual span decreased from at least 10 letters in central vision to 1.7 letters at 15° eccentricity, in good agreement with the corresponding reduction of reading speed measured by Chung and coworkers (Chung, S. T. L., Mansfield, J. S., &amp; Legge, G. E. (1998). Psychophysics of reading. XVIII. The effect of print size on reading speed in normal peripheral vision. Vision Research, 38, 2949–2962). In Exp. 2, we measured letter recognition for trigrams (random strings of three letters) as a function of their position on horizontal lines passing through fixation (central vision) or displaced downward into the lower visual field (5, 10 and 20°). We also varied trigram presentation time. We used these data to construct visual-span profiles of letter accuracy versus letter position. These profiles were used as input to a parameter-free model whose output was RSVP reading speed. A version of this model containing a simple lexical-matching rule accounted for RSVP reading speed in central vision. Failure of this version of the model in peripheral vision indicated that people rely more on lexical inference to support peripheral reading. We conclude that spatiotemporal characteristics of the visual span limit RSVP reading speed in central vision, and that shrinkage of the visual span results in slower reading in peripheral vision.</p>
      <p>————</p>
      <p>I think a simple series of RSVP word recognition tasks using trigrams and different fonts for individual letters would be a step towards answering this question. </p>
      <p>#ifyoureagradstudentijustgaveyouyourthesis</p>
