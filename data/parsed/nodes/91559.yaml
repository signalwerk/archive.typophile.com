      <p>Rubin, G. S. &amp; Turano, K. (1992). Reading without saccadic eye movements. <em>Vision Research, 32(5)</em>, 895–902.</p>
      <p>Abstract:<br>
      To assess the limitation on reading speed imposed by saccadic eye movements, we measured reading speed in 13 normally-sighted observers using two modes of text presentations: PAGE text which presents an entire passage conventionally in static, paragraph format, and rapid serial visual presentation (RSVP) which presents text sequentially, one word at a time at the same location in the visual field. In Expt 1, subjects read PAGE and RSVP text orally across a wide range of letter sizes (2X to 32X single-letter acuity) and reading speed was computed from the number of correct words read per minute. Reading speeds were consistently faster for RSVP compared to PAGE text at all letter sizes tested. The average speeds for text of an intermediate letter size (8X acuity) were 1171 words/min for RSVP and 303 words/min for PAGE text. In Expt 2 subjects read PAGE and RSVP text silently and a multiple-choice comprehension test was administered after each passage. All subjects continued to read RSVP text faster, and 6 subjects read at the maximum testable rate (1652 words/min) with at least 75% correct on the comprehension tests. Experiment 3 assessed the minimum word exposure time required for decoding text using RSVP to minimize potential delays due to saccadic eye movement control. Successive words were presented for a fixed duration (word duration) with a blank interval (ISI) between words. The minimum word duration required for accurate oral reading averaged 69.4 msec and was not reduced by increasing ISI. We interpret these results as an indication that the programming and execution of saccadic eye movements impose an upper limit on conventional reading speed.</p>
      <p>————</p>
      <p>In a growing market of small screen mobile devices I suspect that more research will be done in this area. Now if there were only some way to ease and expedite the grant application process’ and ethics protocols…</p>
