    html: <p>Kevin, to clarify, when I referred to 'making letters less individually recognisable', I meant making their design less individually recognisable, not altering their setting. It makes sense that individual letters are quicker to recognise without crowding but that words composed of those letters are quicker to recognise when the letters are closer together and the words clearly spaced. But that is about the setting of the letters, not their individual recognisability. What I am suggesting  is that letters that are difficult to recognise individually will make words similarly difficult to recognise, and words that are easy to recognise individually will make words easy to recognise. What I'm enquiring about is counter evidence to this, i.e. letters that are slower to recognise individually producing faster word recognition. Hrant's legibility/readability opposition hypothesis seems to suggest this possibility, even that is should be the case.</p>
