    <p>I participated in FaceBook discussions about the differences in the details of letters (drops, terminals etc.)<br>
    It was two opinions:</p>
    <p>1. Legibility should base on the ability to small differences between characters. The more equal the more difficult to read.</p>
    <p>2. Even the smallest differences in the details "separates" letter from the word, draws attention to it and thus slowing reading.</p>
    <p>Legibility - helps or hinders readability?</p>
    <p>In both views there is a grain of truth... I'm confused...<br>
    Help me understand, please feel free to express your opinion.</p>
