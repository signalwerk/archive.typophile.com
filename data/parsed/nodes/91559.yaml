      <p>John, the confusion between the lower case l and upper case I in many fonts is an example of where legibility problems of letters don't seem to affect readability of words. I would expect that with additional ambiguous letters you would have more problems. </p>
      <p>Peter Enneson's theory is that the way letters are designed the normal tightness of letters make them less recognizable individually, but the sub-letter units, arranged in a regular rhythm are more recognizable as a whole word pattern. If he's right, that it may explain why letters that are confusable in isolation don't pose problems within words. I've seen this with fancy script caps also—no problem reading in context, but out of it you don't know what it is. The sum of the readability of the word is not the same as the sum of the legibility of the individual letters. </p>
      <p>It might be that more differentiation would make an isolated letter easier to distinguish, but it may be harder to read in the crowded situation of words. For example some blackletter with a lot of hairlines, or some script fonts. </p>
      <p>I haven't thought this through yet, but it's an interesting question, particularly as a possible way to test Peter's theory.</p>
