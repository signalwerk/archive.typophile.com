      <p>John: Can anyone point to empirical evidence that making letters less individually recognizable ever results in improved word recognition?</p>
      <p>As has been hinted at, there is empirical evidence that individual letters are recognized more accurately in time and distance threshold tasks when there is a more space between letters, but that reading speed is faster when there is less space between letters (but more between words).</p>
      <p>In most cases I believe that faster and more accurate letter recognition will lead to faster and more accurate word recognition.</p>
