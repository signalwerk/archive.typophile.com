    html: "<p>Bill, what I asked was whether there was any evidence that making letters less legible ever results in <em>improved</em> word recognition, i.e. made it <em>better</em> than when the letters were more legible. Yes, there are some difficult to recognise or ambiguous letter forms that, in the context of words, do not pose the same level of difficulty as in isolation, presumably because of linguistic context clues. But this is not the same thing at all as suggesting that less legible letters might improve word recognition, which seems to be the implication of Hrant's opposition of legibility and readability, or the converse: that optimising letters for individual recognisability might actually hamper readability.</p>"
