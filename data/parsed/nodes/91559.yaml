      <p>It's always nice to see a discussion where the opposition<br>
      of legibility and readability is discussed. It seems like a<br>
      paradox, but I've believed in the difference between the<br>
      two for a while now. In terms of visualizing how they<br>
      relate, I find it useful to refer to geometry: imagine two<br>
      vectors at a right angle, so separated by 90 degrees. So<br>
      they're both pointing towards the same "quadrant" but<br>
      they also oppose each other to an important extent,<br>
      and the balance one needs to find depends on how far<br>
      one wants to push into immersive reading; the further<br>
      you push into it the more letters need to contribute to<br>
      divergent boumas, as opposed to merely being divergent<br>
      on their own.</p>
      <p>So for example sans letterforms are easier to identify,<br>
      but serif forms "talk to each other" better, essentially<br>
      becoming less themselves. And if you look at Legato<br>
      for example, the whites of the letters talk to each other<br>
      instead of with their own blacks, creating what I see<br>
      as much stronger bouma bonding.</p>
      <p>It's also important to realize that it's quite trivial to ensure<br>
      legibility: people can read almost any letterform if given<br>
      enough time. And this is where the expressive dimension<br>
      of type (think of display type) nicely comes in. This doesn't<br>
      mean text fonts can't be expressive, it's that they express<br>
      themselves more at the level of overall texture.</p>
      <p>BTW, here's something light I once put together:<br>
      <a href="http://www.themicrofoundry.com/ss_read1.html" title="http://www.themicrofoundry.com/ss_read1.html">http://www.themicrofoundry.com/ss_read1.html</a><br>
      For a much deeper treatment you could read<br>
      my article in issue #13 of Typo magazine.</p>
      <p>hhp</p>
