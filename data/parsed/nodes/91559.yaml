      <p>Bill: <em>Then speed of individual letter recognition and word recognition might be not totally go together, because of issue of coherence and spacing and rhythm in the font.</em></p>
      <p>Oh, absolutely good recognisability of individual letters cannot compensate for bad typography. But as I said, typography presumes a lot of stuff that naturally bring letter recognition and word recognition into alignment: spatial frequency and stylistic harmony (coherence) and, of course, spacing and -- duck, Hrant -- ryhthm. The latter so much presumed that I didn't even mention them.</p>
      <p>Yes, if you isolate and any of these normal features of text typography -- if you change font weights suddenly in the middle of a word, or mix serif and sans serif letters in a word, or track out the spacing so that the letters don't knit together, or vary the spacing or widths of individual letters so as to break up the rhythm -- then word recognition will fail long before individual letter recognition fails. But then we're not talking about typography any more.</p>
