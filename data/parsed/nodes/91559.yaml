      <p>Sorry, I forgot to address an important aspect of the question:<br>
      How much divergence is too much? To me this answer is simpler<br>
      than one might think: the divergence is too much when the reader's<br>
      eye jumps too far ahead (to a subsequent line) because it's distracted<br>
      by an unusual texture (which often happens when a "pushy" glyph is<br>
      doubled - often the binocular "g", especially the closed-bottom form).</p>
      <p>hhp</p>
