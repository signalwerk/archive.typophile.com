      <p>@hrant:<br>
      <cite>I actually believe that saccade-free reading is not only<br>
      achievable, but also highly desirable.</cite></p>
      <p>This comment might be more controversial than it deserves to be, on the basis of the fact that saccade-free <em>seeing</em> is not possible. If you stare at one point fixedly enough to suppress saccades, within seconds your visual field will narrow to a small point.</p>
      <p>However, while <em>eye movement</em> is an essential component of vision, <em>and hence of reading</em>,  and, on top of that, the saccade is typically a largely <em>involuntary</em> motion... you're still not nearly as wrong as all this makes you sound.</p>
      <p>Because, of course, when reading, one doesn't stare at a single word, with one's eyes wandering back and forth along that word, the way one watches a movie or TV screen, or even admires a painting or sculpture.</p>
      <p>One's gaze is in constant motion, but even with occasional saccades, in general, over the majority of words, one's gaze <em>will</em> pass unidirectionally, if one is reading at a good speed. Only if one is reading very slowly will a saccade be likely to take place during the reading of the majority of the words, or, say, even the majority of the words longer than three letters.</p>
      <p>Thus, despite the universality of the saccade, the time scale of that phenomenon needs to be kept in mind. Normal, healthy reading of extended texts (i.e. where the reader is not moving his lips) <em>is</em> mostly saccade-free, and proper typography will facilitate that.</p>
      <p>@Christopher Dean:<br>
      <cite>You put on eye tracking equipment, look at a dot, present words in an RSVP fashion, and ask the subject questions about what they just read. Look at the eye-tracker data, their eyes haven’t moved, and presto, saccade-free reading. It’s just one long fixation.</cite></p>
      <p>Possibly I misunderstood Hrant's comment, if in order to engage in the saccade-free reading of a book, it is necessary to somehow have its pages presented to me as one word at a time flashed on a screen.</p>
      <p>But in checking, I see I misunderstood the word "saccade", and was mistakenly restricting it to involuntary movements of which we are generally not consciously aware which allow us to look at a wider visual field than our fovea can handle.</p>
      <p>Those shouldn't normally be part of reading, but the voluntary movement of the eye from one word or part of a word to the next also counts as a saccade - and, indeed, some words are long enough not to be contained in the fovea if presented in a legible size.</p>
      <p>One <em>could</em> still see the whole shape of a word and recognize it without having applied acute foveal vision to every letter of the word, but I think it would take a dedicated speed-reading enthusiast to be able to employ such a technique to advantage.</p>
