      <p>Based on my own work and on the work I rediscovered of Matthew Luckiesh, I think that differentiation is important up to a threshold, but beyond that other factors become more important. For example, serifs help by differentiating the extremes of letters, which seem according to research to be more salient in recognizing letters. But beyond a threshold further differentiation of letters becomes 'noise', and doesn't help and can be distracting.  Above the threshold of adequate differentiation of individual letters, more important are issues of weight and rhythm of the characters and of the spacing. </p>
      <p><a class="freelinking external" href="http://ilovetypography.com/2010/11/02/reviving-caslon-part-2-readability-affability-authority/" rel="nofollow">Here is an account of my own explorations.</a> </p>
      <p>And <a href="/wiki/typophile.com/node/83684" class="freelinking" rel="nofollow">here is a discussion of Luckiesh's work.</a></p>
