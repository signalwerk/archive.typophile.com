      <p>I haven’t quickly found a reference showing that letters are more accurately recognized in time and distance threshold tasks with more space between them. I suspect that Bouwhuis &amp; Bouma first showed this and that Pelli has shown this in his crowding studies. I am confident that Sheedy’s lab has done this with a distance threshold task, but I haven’t found a publication of this finding, and I have replicated this in a unpublished time threshold study. I’ll be talking about that study at the upcoming Digital Reading conference.</p>
      <p>Rayner’s lab has published some of the findings showing that reading speed is faster with Consolas and Georgia when letter space is decreased and word space is increased.</p>
      <p>Rayner, K., Slattery, T.J., Bélanger, N. (2010). Eye movements, the perceptual span,  and reading speed. Psychonomic Bulletin &amp; Review, 17 (6), 834-839.</p>
      <p>Abstract:<br>
      The perceptual span or region of effective vision during eye fixations in reading was examined as a function of reading speed (fast readers were compared with slow readers), font characteristics (fixed width vs. proportional width), and intraword spacing (normal or reduced). The main findings were that fast readers (reading at about 330 wpm) had a larger perceptual span than did slow readers (reading about 200 wpm) and that the span was not affected by whether or not the text was fixed width or proportional width. In addition, there were interesting font and intraword spacing effects that have important implications for the optimal use of space in a line of text.</p>
