      <p>Can anyone point to empirical evidence that making letters less individually recognisable ever results in improved word recognition? Or vice versa? Or that making either letters or words less recognisable ever decreases reading fatigue? [Word recognition and comfort over time seem to me the cornerstones of any measurable notion of readability.]</p>
      <p>I don't think there is an opposition between legibility and readability <em>if</em> one assumes spatial frequency and stylistic harmony, which is a general assumption of type design and typography: we don't make or use 'ransom note' typefaces for reading, we make and use types which operate within single spatial frequency channels and that share stylistic features that allow the necessarily individuated forms of letters to be grouped without individual letters standing out. In order for legibility to be even independent of readability -- never mind 'in opposition' --, one first needs to throw out the spatial frequency and stylistic harmony, hence disrupting word recognition. In other words you need to throw out typography.</p>
      <p>Hrant: <em>So for example sans letterforms are easier to identify, but serif forms "talk to each other" better, essentially becoming less themselves. And if you look at Legato for example, the whites of the letters talk to each other instead of with their own blacks, creating what I see as much stronger bouma bonding.</em></p>
      <p>Less themselves? That would imply that the letters that 'talk to each other better' -- and I agree that this is one of the virtues of Legato -- are less individually recognisable than letters that talk less well to each other and are, by your logic, more themselves. This makes absolutely no sense to me whatsoever. There is no opposition, there is no zero sum game in which working well to form recognisable words -- or 'stronger bouma bonding' if you insist -- requires the individual letters to be less legible. There is no reason at all why better recognisability of individual letters and better recognisability of words do not go hand-in-hand.</p>
