      <p>&gt;the experiment that he said shows improved reading with tighter spacing.</p>
      <p>Kevin may (or may not) be alluding to <a class="freelinking external" href="http://www.springerlink.com/content/l305450683505715/" rel="nofollow">this paper,</a> which found that the word superiority effect disappears with very widely spaced letters. I predicted that this should happen on Peter Enneson's theory. Peter then did a literature search and found this paper, which had already demonstrated this. Kevin was kind enough to repeat some of the experiments, with variations, but his conditions didn't have the same precision as the early ones, done with a tachistoscope and printed matter, rather than on a computer, whose screen refresh is on the order of the times involved in flashing the words. And the results were not very clear. Peter's view is that to get more informative results we need a good control on what is called the SOA (stimulus onset asynchrony). But it's probably too much to try to get into this here.</p>
