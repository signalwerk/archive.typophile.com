  html: |-
    <p>Type 3.0 OpenType font editor has recently been released.</p>
    <p>Major new features include:<br>
    - OpenType layout features (eg simple to add ligatures - make sure the correctly named glyphs are present, then tick the 'standard ligatures' box).<br>
    - User-defined Actions that can be run over ranges of glyphs to perform transformations etc.<br>
    - User-defined composite glyph creation (an example file is included that will generate the Greek Extented unicode block).</p>
    <p><a class="freelinking external" href="http://www.cr8software.net/type.html" rel="nofollow">http://www.cr8software.net/type.html</a></p>
    <p>For Windows 7, XP, 2000 &amp; 98 (ps there are no plans for a Mac version).</p>
    <p>Allan Murray</p>
