    votes: null
    html: |-
      <p>Exclusivity can be one of the conditions of a special End User License Agreement. A client (in this case, usually a corporation that commissioned a custom typeface for their own branding use) may wish to acquire the exclusive right to use your font, thus denying your right to sell it to anyone else, either in perpetuity, or for a specified limited time, or conditional on other circumstances; in exchange for a substantial additional fee. Exclusivity can multiply the sale price of a font license many times above your usual retail price, since it would have to compensate you for all projected sales if you were able to sell it normally.</p>
      <p>But that's more a question for the Release forum.</p>
