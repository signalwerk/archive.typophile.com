    html: <p>Don't start with “abcde”. You're just playing with variations on one simple form of letter and not really pushing into a typeface. Move on to H,O,h, and o. Then move on to test words like SHOPS and hoggles. After that work on HANGLOVES/handgloves to fill out your basic forms. Once you finish that it's time to flesh out the alphabet.</p>
