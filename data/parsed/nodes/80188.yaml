      <p>@nhood : for fonts, licencing means defining area of uses for your typeface ; unless you target branding market, your licence should be as permissive as possible, because then your typeface is meant to convoy information and as you know information is everywhere, in print, in website, withing e-books, and people need typeface which allow embedding and great freedom of use (except of use, claiming the design as their own, and sell the typeface at your expense).<br>
      most typefaces are under restrictive licences for paranoid and/or outdated conception of what a typeface is supposed to be.<br>
      But with open source, Google Fonts &amp; allii shouting around, type industry is shifting around. As a challenger, your advantage is be proactive relative to this aspect.<br>
      See linked file below (licencing policy compared across +40 type foundries, sorry, it's in French) :<br>
      <a href="http://www.fadebiaye.com/type/comparatif_licences.pdf" title="http://www.fadebiaye.com/type/comparatif_licences.pdf">http://www.fadebiaye.com/type/comparatif_licences.pdf</a></p>
