    html: |-
      <p>hi nhood, it's quite simple in fact. </p>
      <p>1. is it for branding or for text ? both is making things trickier</p>
      <p>2. if for branding, control-freak copyright and at best, sell it as an exclusive corporate typeface</p>
      <p>3. if for text, prepaid copyleft ; set a souscription and then release it under OFL licence ; do not run after piracy, it's a waste of time and money ; be sure to determine how much you want to earn, be paid and then release the tiger!</p>
      <p>More information on the OFL licence here:<br>
      <a href="http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;id=OFL" title="http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;id=OFL">http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;id=OFL</a></p>
