      <p>I have the opposite problem when I’m in Spain, everything thinks my last name is Stephen, most people have three names, one first name and two last names.</p>
      <p>I say go without the hyphen, and whenever there’s a situation of doubt, write the name in all caps.</p>
      <p>Lindsay DURANGO BEESON</p>
      <p>A good typophile will of course make that small caps, and a true one will make that real small caps instead of scaled-down caps. ;-)  But in all seriousness, I’ve found that works, as it’s generally the accepted practice, especially for those who come from cultures where the last name comes first, e.g., KIM Jong-Il instead of Jong-Il Kim or Kim John-Il to emphasis that Kim is the family name.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
