    <p>My fiance and I are doing something that I think is pretty cool: He’s Beeson and I’m Durango, and after we’re married in October, we’ll *both* be Durango-Beeson.</p>
    <p>And that’s where I bring a question to the typophiles.</p>
    <p>Personally, I have something against the hyphen. Not always. And often, I love what it can do. But in this context I really just *don’t* like it.</p>
    <p>It’s been pointed out to us, though, that not hyphenating our name might confuse some people. “Is Durango your middle name?” Would it be ignored altogether?</p>
    <p>Lindsay Durango Beeson<br>
    Patrick Durango Beeson</p>
    <p>I feel like there’s a simple elegance to it.</p>
    <p>But I’d like to ask you typophiles: is the hyphen interceding where it absolutely must intercede? Or do you think that, in the world today, people could simply come to understand that Durango Beeson is meant as a surname?</p>
    <p>Many thanks for your time,<br>
    Lindsay Durango (Beeson!)</p>
