    <p>&nbsp;<br>
    <strong>Beauty, Legibility and Versatility Combine as Key Attributes in Akira Kobayashi's Newest Design</strong></p>
    <p>Monotype Imaging Holdings Inc., a leading global provider of text imaging solutions, has launched the <a class="freelinking external" href="http://www.fonts.com/akko/" rel="nofollow"> 24-font Akko™ typeface suite</a> by Akira Kobayashi, type director at the company's Germany-based subsidiary, Linotype GmbH. The newest member of the Linotype® collection, Akko is the first original typeface by Kobayashi in several years. </p>
    <p>"Akira's new design is well worth the wait," said Allan Haley, director of words and letters at Monotype Imaging. "Akko is meticulously crafted and blends beauty, legibility and versatility, a perfect combination for a broad range of applications, from small-sized text on mobile displays to billboard-sized ads that make a clear and distinctive statement." </p>
    <p>The Akko suite consists of two typeface families, Akko and Akko Rounded. Kobayashi set out with a singular objective during the design process that ultimately resulted in the two families. "I wanted to create a sans serif typeface with rounded corners," he said. "Then I began to see a more 'industrial' design, with the straightforward feel of the DIN Next™ typeface but also with curved strokes and 'soft' proportions." Akko is robust and structured, according to Kobayashi, while Akko Rounded is softer and friendly. </p>
    <p>Akko, which takes its name from the first two letters of Kobayashi's first and last names, represents a departure from Kobayashi's collaborative work with legendary designers Hermann Zapf and Adrian Frutiger. For the past few years, he's worked with both to modernize and reissue some of the most widely used and internationally celebrated designs, including reinterpretations of Zapf's Optima® and Palatino® typefaces, and Frutiger's Avenir® and Frutiger® designs. </p>
    <p>The Akko and Akko Rounded families each contain six fonts that range from thin to black, all with complementary italics. Both families are available as OpenType® Pro fonts, which support the ability to automatically insert small caps, ligatures, alternate characters and other typographic treatments. Pro fonts offer an extended character set that supports most Central European and many Eastern European languages. </p>
    <p><strong>Availability</strong></p>
    <p>Akko fonts can be viewed, purchased and downloaded from <a href="http://www.fonts.com" title="www.fonts.com">www.fonts.com</a>, <a href="http://www.linotype.com" title="www.linotype.com">www.linotype.com</a> and <a href="http://www.itcfonts.com" title="www.itcfonts.com">www.itcfonts.com</a>. The Akko fonts are also available for website design to commercial subscribers of Fonts.com Web Fonts. </p>
    <p>Customers may contact Monotype Imaging in the U.S. toll-free at 800-424-8973, or in Europe at (+44 0)1737 765959, or 001781 970-6020, option 2. Linotype may be reached at +49 (0) 6172 484-418. Customers from other parts of the world may dial 001 781 970-6020 (U.S.). </p>
    <p><strong>About the Linotype typeface library</strong></p>
    <p>Established more than a century ago, Linotype is a Monotype Imaging brand that represents exceptional quality typefaces for brand managers, designers, publishers, IT administrators and product developers. Influenced by its German and Swiss roots, the Linotype collection is home to some of the most widely used and celebrated typefaces in the world, including the renowned Helvetica®, Frutiger and Univers® families. Typefaces continue to be released on an ongoing basis into the Linotype collection from some of the world's most talented and accomplished type designers. </p>
    <p><strong>About Monotype Imaging</strong></p>
    <p>Monotype Imaging combines technology with design to help the world communicate. Based in Woburn, Mass. with offices in the U.S., Europe and Asia, Monotype Imaging brings text imaging and graphical user interface capabilities to consumer electronics devices such as laser printers, copiers, mobile phones, navigation devices, digital cameras, e-book readers, digital televisions, set-top boxes and consumer appliances. The company also provides printer drivers and color imaging solutions to printer manufacturers and OEMs (original equipment manufacturers). Monotype Imaging technologies are combined with access to more than 14,000 typefaces from the Monotype®, Linotype® and ITC® typeface libraries — home to some of the world's most widely used designs, including the Times New Roman®, Helvetica and ITC Franklin Gothic™ typefaces. Fonts are licensed to creative, business and Web professionals through e-commerce portals, direct and indirect sales and custom design services. Monotype Imaging offers industry-standard font solutions that support all of the world's major languages. Information about Monotype Imaging can be found at <a href="http://www.monotypeimaging.com" title="www.monotypeimaging.com">www.monotypeimaging.com</a>. </p>
    <p>Monotype is a trademark of Monotype Imaging Inc. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. Times New Roman is a trademark of The Monotype Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain other jurisdictions. ITC is a trademark of International Typeface Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. ITC Franklin Gothic is a trademark of International Typeface Corp. and may be registered in certain jurisdictions. Linotype is a trademark of Linotype GmbH registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. Helvetica, Frutiger, Univers, Optima and Palatino are trademarks of Linotype Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions in the name of Linotype Corp. or its licensee Linotype GmbH. Avenir is a trademark of Linotype GmbH registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. Akko and DIN Next are trademarks of Linotype GmbH and may be registered in certain jurisdictions. OpenType is either a registered trademark or trademark of Microsoft Corp. in the U.S. and/or other countries. All other trademarks are the property of their respective owners. © 2011 Monotype Imaging Holdings Inc. All rights reserved.</p>
