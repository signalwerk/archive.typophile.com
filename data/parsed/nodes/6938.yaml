  html: <p>Hi, I just found this website a few days ago and joined. I am working on my first typeface and would appreciate any feedback you can offer. The top version was inspired by linoleum cutting, but I decided to do a solid version as well in case the "cut" version was too much. Do you think I need a solid version? <img src="http://www.typophile.com/forums/messages/29/50190.jpg" alt="Linocut Typeface"></p>
