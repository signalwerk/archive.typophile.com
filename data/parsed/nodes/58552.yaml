  html: |-
    <p>Does anyone know the font used in national geographic body text and headers and footers?  Got to do an assignment to design a double page spread.  </p>
    <p>Looks like Times new roman or similar for body text but the footer doesn't look right?  The number 9 don't drop below the baseline in the same way. when I use that font.  </p>
    <p>Anyone got any suggestions?<br>
    Thanks</p>
