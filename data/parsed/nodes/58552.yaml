      <p>I had started a list of magazine fonts and I had <a class="freelinking external" href="http://new.myfonts.com/fonts/adobe/minion/" rel="nofollow">Adobe Minion</a> as the National Geographic body text. I also had noted that they used Galliard for some titles, and DIN and Univers for some headlines and captions.</p>
      <p>- Mike Yanega</p>
