    html: |-
      <p>From a recent newsletter of <a href="http://www.codestyle.org/index.shtml" title="http://www.codestyle.org/index.shtml">http://www.codestyle.org/index.shtml</a><br>
      Windows: 87.46%<br>
      Mac: 91.26%</p>
      <p>But i would be careful, because there is no "standard system font" which can replace "Arial Narrow", your css-layout could … explode</p>
      <p><code>font-family:"Arial Narrow", Arial, Helvetica, sans-serif;</code><br>
      That means if Arial Narrow is not installed on the system, it will be replaced be the wider Arial or Helvetica and so on.</p>
      <p>There is a possibility to work with sIFR (google it), a Flash/Javascript "solution", but the more dynamic it gets, the more difficult it gets too. You can see sIFR in use here on typophile – the headlines are dynamically rendered in the "featured face". </p>
      <p>I would ask me, is it worth the money i have to pay for a proper technical solution. Or isn't it better to avoid "Arial Narrow" with another design concept.</p>
      <p>Good luck</p>
