  html: |-
    <p>This isn't exactly a type ID, but I'm trying to get some info on Arial Narrow. We're trying to use it on a website as an alternative to Univers Light Condensed. </p>
    <p>Does anyone know how available it is? Is it a standard on most computers and browsers? Any information would help.</p>
    <p>Thanks!</p>
