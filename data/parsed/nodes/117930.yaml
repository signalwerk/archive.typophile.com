    html: |-
      <p>It  is clearly written in the Microsoft link <a href="http://www.microsoft.com/typography/property/fpedit.htm">http://www.microsoft.com/typography/property/fpedit.htm</a> </p>
      <blockquote><p>
      <strong>Embedding</strong> - embedding permissions may be made more restrictive.
      </p></blockquote>
      <p>An update would not help you unless they changed their mind about that. </p>
      <p>By the way SIL is also using line commands. They have a command <code>hackos2</code> in their impressive list  <a href="http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;id=fontutils">FontUtils</a> of font utilities (that I have never tried).</p>
