  html: |-
    <p>I created a font years ago (OTF) before the embedding restriction became an issue. How can i remove any embedding restrictions without re-creating the font in FontLab (too many VOLT hours involved). Just to change the flag!<br>
    An old MS tool (Font properties editor) won't help since it doesn't allow to completely remove the restriction to "Installable", only to increase the restriction. Any idea?</p>
