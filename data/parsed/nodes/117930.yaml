      <p>With regard to embed.exe I would verify with Font Validator, that the checksum is correctly computed. As far as I remember, there is a tool, that does not compute the checksum correctly. I think, it was embed.exe.</p>
      <p><cite>I try to find a way to avoid using command line. It is strange MS didn't update their tool since 1997...<br>
      There are many fonts waiting to change that flag (all are my fonts) .</cite></p>
      <p>You can easily do it with TTX, a batch file and the search and replace function of UltraEdit. TTX correctly computes the checksum.</p>
