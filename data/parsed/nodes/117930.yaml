    html: |-
      <p>Here are three methods</p>
      <ol><li>Use the fonttools as described in the url <a href="http://www.typophile.com/node/102671">http://www.typophile.com/node/102671</a>
      </li>
      <li>Use ttx. First execute <code>ttx -t OS/2 fontname.ttf</code> (or otf); that  produces a small file named <code>fontname.ttx</code> containing only the <code>OS/2</code> table; you then replace with a text editor the value given at the line <code>&lt;fsType value="00000000 00001000"/&gt;</code> (the value you get is probably different) by the value you want; you then finally  execute the command <code>ttx -m fontname.ttf fontname.ttx</code> to get your new font.
      </li>
      <li> Buy DTL OTMaster to edit the OS/2 table; we are told the font is left otherwise untouched. If it is not, you tell us.
      </li>
      </ol>
