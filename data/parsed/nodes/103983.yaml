    <p>I've enjoyed the posts on this site a lot but never posted. I thought it was time to post a question to the users here. I'm having some trouble finding the font I have in my mind.</p>
    <p>I'm designing a game with a retro feel in the genre of Evel Knievel.  Trying to plan out a couple cool fonts to use. One for title's more bold and one for small block text.  I thought this was a smart community to ask for some input. ;)</p>
    <p>So far I've got Canadice, Funkydori, and Benuiat charisma.</p>
    <p>I appreciate any help or direction.</p>
    <p>Cheers</p>
