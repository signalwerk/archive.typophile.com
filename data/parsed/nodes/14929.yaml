      <p>Here is the note in InDesign:<br>
      "Like other graphic-arts software from Adobe and other companies, InDesign uses PostScript points, which don't correspond exactly to traditional printer points. There are 72.27 traditional printer points in an inch, as opposed to 72 PostScript points."</p>
      <p>So an em square as defined in the font would print at 12 PostScript points, when you tell the software to print at 12 points. I think this is the same for true type and open type fonts. </p>
      <p>InDesign allows you to measure also in 'Ciceros'. If I understand it rightly--which I may not--this is made up of 12 Didot points, which are slightly larger than either traditional or PostScript points. The Didot points were used on the continent, as opposed to the US and England, which is the "traditional printers point" referred to in the quote from Adobe.</p>
