      <p>I have often wondered about this Mac 72 dpi assumption. This seems awfully coarse by modern monitor standards.</p>
      <p>My 19" CRT monitor is set at 1600 x 1200 resolution, giving me 114 dpi. This is using X11 on Linux, by the way. One reason for my using high screen resolution is to make moderate-sized type look cleaner, especially with Postscript rather than TrueType fonts. As far as I can tell, most applications on Linux attempt to render fonts on screen at the true mechanical size, rather than assuming something like 72 or 96 dpi. This means that, when I up the screen resolution, type remains at the same mechanical size, while being rendered at higher pixel size, so giving me a more readable display. For example, 12 point renders as 12 ppem at 72 dpi, and 19 ppem at 114 dpi.</p>
      <p>How does the Mac go about this business? If I increase the resolution as above, does the text stay at the same pixel size, and shrink in mechanical size? I would not have thought so, but, not being a Mac user, I do not know.</p>
      <p>On the point size, print size, and screen size question, I have found that word processors may not be trustworthy in this respect. This came about from making test prints in Kword of a font I was developing. It appears that, in order to get the print to match the display, Kword was letterspacing the text, so the spacing changes I was making in the font were being swamped out by onscreen rounding effects. This was using ragged right formatting, by the way. I do not know if the actual glyph sizes were also being modified. By contrast, Scribus (a desktop publishing app for Linux) did not compromise the print as far as I could tell.</p>
