  html: <p>A <a href="http://typophile.com/node/14822" rel="nofollow">discussion</a> about pixel fonts has made me realize I don't know how font sizes are actually being decided. Suppose I'm working with MS Word and the font size is set to 12 points, does it mean that the em square is being mapped to a 12x12 points square? Furthermore, what kind of points -- pica or PS -- are these? I know the difference is almost neglectable, but I'm curious.</p>
