    html: |-
      <p>Screen font sizes are measured in ppem, pixels per em. One ppem is equal 1 pt at the screen density of 72 dpi. In other words, with a screen density of 72 dpi, the ppem size and the point size are equal. In Mac OS, the screen density usually equals 72 dpi in typical applications, so a 12 points size will produce a 12 ppem screen font rendering, that is, the em square (usually 1000 font units) will be rendered upon 12 pixels. If your caps are 700 units high then the caps will be rendered onto 8.4 pixels, probably rounded down to 8 pixels. If you make a pixelfont, pick the size that does not need to be rounded. </p>
      <p>But this is only true for the screen density of 72 dpi. On Windows as well as in the most web browsers on a Mac, the screen density typically defaults to 96 dpi. The ppem size of 12 will correspond to a point size of 12*72/96 = 9 pt. Conversely, the point size of 12 pt will render 12*96/72 = 16 ppem. </p>
      <p>So in short, under the default settings, if you select 12 point type in Word for Mac, you will get a rendition of the 12 ppem screen size but in Word for Windows you will get a rendition of the 16 ppem screen size. </p>
      <p>In addition to that, on modern Windows computers, usually notebooks, the default screen density may have been modified to 120 dpi (the "large fonts" setting). On such a computer, 12 pt will render a 20 ppem screen size. And of course, the user can modify the setting even further. </p>
      <p>A.</p>
