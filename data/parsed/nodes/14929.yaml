      <p>Oribendor, </p>
      <p>when you print, the em square is mapped to whatever the dpi resolution ("density") is. If you print 12 point type at 600 dpi, then your em square will be mapped to 12*600/72 = 100 pixels (or toner dots). Of course, since printer manufacturers often use differently sized toner or ink dots (a la RET technlogy by HP), that mapping is not so exact. Some printers also have different dpi resolutions in the vertical and horizontal directions. </p>
      <p>Hrant, </p>
      <p>my new Dell notebook (Dell Inspiron XPS Gen 2) arrived Windows with factory settings of 120 dpi. I've also heard of a recent HP model with  such setting. I don't have any elaborate data though. </p>
      <p>A.</p>
