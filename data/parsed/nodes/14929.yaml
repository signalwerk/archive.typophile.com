      <p>the 72dpi resolution on the macintosh is the dpi that the operating system uses when rasterizing fonts. </p>
      <p>This has nothing to do with your computer monitor's resolution. So a 12 point character on a Macintosh will be the same pixel pattern no matter what you set your screen resolution to. The higher your screen resolution the smaller the character will look.</p>
      <p>This is the same on Windows the 96 or 120 dpi settings (or the custom ones that are now available) is the resoluiton that the Windows rasterizer calculates the glyphs shape.</p>
