  html: |-
    <p>Hi everyone... I have been having some trouble identifying the fonts on this retro Yankees ticket stub. Most of the black text is Alternate Gothic No. 2 (my best guess, correct me if I am wrong). However, I can't seem to find a good match for the red text ("58", "AUG. 9", and "1955"). I think "TUESDAY" is Alt Gothic No. 2 as well... but again I could be wrong. I would really appreciate some help figuring out what font is being used.</p>
    <p>Thanks!</p>
    <p>Darryl</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/ticket_0.jpg" width="253" height="442" alt="">
