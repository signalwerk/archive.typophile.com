    <p>I am George Williams, the author of <a href="http://fontforge.sf.net/" rel="nofollow">fontforge.</a><br>
    I like to <a href="http://georgeruns.wordpress.com/" rel="nofollow">run.</a><br>
    I used to spend a lot of time helping other people study <a href="http://icte.bio.sunysb.edu/rano.biodiv/index.html" rel="nofollow">Lemurs in Madagascar,</a> primarily the ringtailed lemur (Lemur catta) and the greater bamboo lemur (Hapalemur simus).</p>
