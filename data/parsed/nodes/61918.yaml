    html: <p>You should disable the Fontlab auto hinting. Fontlab’s auto hinting is not very good, and can distort outlines when printing on laser printers. Just learn how to set up your blue value and stem weights and hint your fonts with the auto hinter that Adobe so graciously provides us in the AFDKO. It’s easy, only takes a few minutes, makes the fonts look pretty good, and they can even be converted to TrueType hinting with a Fontlab action.</p>
