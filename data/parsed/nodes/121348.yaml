    <p>Ahoy!</p>
    <p>I'd like to introduce you my new type foundry, Harbor Type, and my first commercial release, Graviola.</p>
    <p>Enjoy 70% off until December 15th.</p>
    <p>Get it directly from us at <a class="freelinking external" href="http://www.harbortype.com/graviola/" rel="nofollow">http://www.harbortype.com/graviola/</a><br>
