    <p>Like an idiot, I never wrote down the font names for the images used in this site (I didn’t create it, I just maintain it). Now on my new computer, I’m editing and getting the “font not available” message—but I have no idea what either of these fonts is. I do know that the title font (“Sampling”) has an Alien effect on it. Anyone know what either font is, or both?</p>
    <p>Thanks,<br>
    Stevie</p><div class="imageWrap"><img src="/web/20080706173748im_/http://www.typophile.com/files/home2_6036.jpg"></div><p></p>
