    html: <p>Thanks for replying Therese. And I need add no salt to your reply. Judging by the font you posted, you know more about font design than you let on. I really liked your design and look forward to seeing more of it as you go along, so keep us posted. I usually don't respond when all I can say is "Wow, that's cool." I hope to keep learning and someday get to the point I feel confident to dish out advice. <br> <br>I made the fixes you suggested. I hope the "XY" problem was a spacing issue.(I was only about half way done with kerning when I posted the PDF. Oops.) Let me know.  <br>Thanks, <br>Jeff <br> <br><img src="http://www.typophile.com/forums/messages/29/50645.jpg" alt="QR XY fixes"></p>
