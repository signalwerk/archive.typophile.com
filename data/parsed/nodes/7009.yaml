    html: <p>Looking at the PDF, the uppercase 'M', 'N', 'V' and 'W', and the lowercase 'v' and 'w', doesnt seem to match / work with the other, rounder, more organic letter forms.. I think the 'cutted', angular ends of 'v', 'w', 'V' and 'W' dont really help, either.. ( Maybe try one, alternate version, without these modifications.. ) <br> <br>A good start, and a nice 'first one', nonetheless.. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
