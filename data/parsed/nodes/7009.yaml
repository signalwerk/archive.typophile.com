    date: 2004-10-05T10:39:00
    date_raw: 5 Oct 2004 — 10:39am
    votes: null
    html: <p>Hi. I don't know much at all about designing typefaces. I posted my first attempt last week. So take my posting with a huge grain of salt.  <br> <br>There are some details I love. The way the descender of the upper case q meets the base of the capital r is very nice. But they are different widths. I wonder how it would look if the width were the same. Also, the upper stroke of the upper case x next the the upper stroke of the upper case y looks awkward. Maybe its just that they are so close together. But since they are, the angle of the x looks a little awkward. <br> <br>Its a REALLY nice typeface.</p>
