    html: "<p>Eka, sorry for the delay. <br> <br>I think there's a lot -too much- going on in this very pretty face, even for display use - even though I think the basic design could even be made into a text face. <br> <br>You have case-mixing, funky half-serifs and unorthodox structures all rolled into one. One thing you can do is leverage that and go to an extreme (which probably appeals to your obvious playfulness), but Grunge is dying, so unless you're doing this mostly for your own pleasure, don't go there. If you want many other people to use the font, I'd advise toning things down, but maybe providing many alternates. <br> <br>So, what to keep and what to dump? I think a good conceptual model for you is Democratica*: it's structurally unorthodox, but manages to seem both authentic as well as *natural*. I think the secret is the finish: it has the superficial appearance of a normal font - so I think you need full serifs everywhere on Djohar, but you should use funky structures to make it unique; this might include UC forms, but don't use them gratuitously - only for a reason. Like your lc \"c\" is right on, but I'm not sure about the \"e\". <br> <br>* <a href=\"http://www.emigre.com/EF.php?fid=89\" target=\"_top\">http://www.emigre.com/EF.php?fid=89</a> <br> <br>Some specifics in the lc: <br>\"a\": narrower <br>\"g\": funkier <br>\"h\": wonderful <br>\"y\": too scripty <br> <br>The caps present an interesting problem: since they're used a lot less (about 5% of text), you have a lot more freedom, so you might want to make those structures especially funky - but make sure they'll still work harmoniously in all-caps setting - it won't be easy. Specifically, I think your UC \"M\" is super, but as sexy as that \"S\" is, it's too much here. Overall, your caps need a lot more work than the lc. <br> <br>Other glyphs: your \"?\" is delicious; the \"&amp;\" could be much stranger. <br> <br>One last thing: your contours are wobbly, but I'm not sure that's a bad thing here. <br> <br>hhp</p>"
