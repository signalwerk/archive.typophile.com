    html: "<p> Hello Aka, nice work and nice type face. <br>I would like to make some reflection about some points. <br> <br>1) Your symbol ($) it fells like a sans serif apparence, I think that must be follow the same felling of the rest of your letters (serif). <br> <br>2) Why you use a capital letter on lowercase (e)? you didn't repeat the same idea on other part, and probably fells like stange I think. <br> <br>3) I think your leg on l/c letter (h) is very interesting but why you don't apply on (m,n,u)? <br> <br>4) Take a look on your capitals about the serifs, for the exemple: the letter (H) don't have any serif, or like (X) all parts of the letter have serifs. You must uniformaty all parts to don't fell strange when combine together. <br> <br>5) I don't know if is a good idea you put only a serif on [], probably will make some confusion I think. <br> <br>So I don't have more coments to tell for now and I would like to read more sugestions from the others ( I'll wait for Hrant too) to make clear better my sugestions. See you soon and tell me what you think about all this sugestions. Sorry about my inglish and if you didn't understand any part of my text, tell me. <br> <br>Regards to you and to all typophile friends / Ricardo </p>"
