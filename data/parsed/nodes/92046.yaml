    html: <p>I too favour a heavier look to text, but there is a particular aesthetic to typography of lighter faces that can be very pleasing if it is done well. Ideally, the paper should be creamy, not too white, and the linespacing carefully balanced to the internal whites of the lines of text. Digital Elektra printed offset is a good example of a light type that, with careful handling, can be both very attractive on the page and very readable.</p>
