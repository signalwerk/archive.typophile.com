    html: |-
      <p>Dear typophiles:</p>
      <p>All your comments regarding typefaces I contributed to design are always welcome. I’d like to explain some of our decisions.</p>
      <p>The main purpose of Gandhi is to be useful for a non professional user. That’s the reason behind the big x-height, the weight lighter than usual, the families consisting of four members, and so on.</p>
      <p>Some years ago, when developing Fondo, I did some tests about what “common readers”* in Mexico actually like when it comes to typefaces. One of my conclusions was that people do like lighter weights (in Mexico City, at least). I must confess that it was a bit disappointing because I do prefer darker weights (you can see Espinosa Nova or Fondo for that) but this experience told me that many people love pages composed with Berkeley Oldstyle Book rather than with, say, Adobe Jenson. (Please notice: it was not a comprehension or speed test, it was only about what the people looks appealing to read). So for this Gandhi project we decided to follow that trend.</p>
      <p>* In this context, “common readers” refers to people who bought a book published by Fondo de Cultura Económica at some bookstores located in Mexico City.</p>
      <p>Since it wasn’t our main goal, we didn’t run any offset tests before releasing Gandhi, but we printed a lot on inkjet and laser printers, and I’d say the result was pretty good in both cases.</p>
      <p><cite> &gt; The sans follows the serif a little too slavishly.</cite></p>
      <p>That’s probably true, but I’d say it is not an error, but something done in purpose. We decided that a typeface for a bookstore chain should have some “serifness” on it, so it can be better related with books.</p>
      <p><cite> &gt; It appears that the roman and italic are equal in width for the sans, but not for the serif.</cite></p>
      <p>True, the width in Sans Regular and Sans Italic are very similar (not identical), but that doesn’t happen in the serif. That’s what we thought was better for each design. Not quite consistent, I am afraid.</p>
      <p><cite> &gt; Remember that the more printing a person/place does the more likely it will be on a laser and not an inkjet.</cite></p>
      <p>Hrant: many people use inkjet printers for text purposes. It probably doesn’t make sense at all, but that’s the way it is. I guess it is because they can print in color when needed, even if it is not the best option for text. They can just live with that, as long as they can decipher the characters.</p>
