    <p>Gandhi, the biggest bookstore chain in Mexico is giving away a full type family named Gandhi. The web page states that the typeface will ease Mexican's reading by: having big body size, being light and thus achieving ideal weight when printed under less than ideal conditions by ink spread (the page cites inkjet printing), unadorned and undistracting, designed for body copy but friendly when used big.</p>
    <p>Gandhi has been known for one of the longest and more memorable ad campaigns in Mexico: <a href="http://gandhi.com.mx/index.cfm/Publicidad" title="http://gandhi.com.mx/index.cfm/Publicidad">http://gandhi.com.mx/index.cfm/Publicidad</a> and this typeface seems to be part of the advertising strategy, "To make you read" (Mexico has a real low reading rate.).</p>
    <p>It was designed by Cristobal Henestrosa (Espinosa, Fondo) , Raúl Plancarte (Tauran, Kukulkan), David Kimura (TDC 2009) and Gabriela Varela . The family will be featured in the 5th Tipos Latinos biennale.</p>
    <p>You can download the type familiy here:<br>
    <a href="http://www.tipografiagandhi.com/" title="http://www.tipografiagandhi.com/">http://www.tipografiagandhi.com/</a></p>
    <p>What do you think of it?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Gandhi_5436.png"></div><p></p>
