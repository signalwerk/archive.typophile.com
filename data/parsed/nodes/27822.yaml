      <p>Right on Patty. Ellington is one of my favorite fonts, as is the sans companion font - <a href="http://www.myfonts.com/fonts/linotype/strayhorn-mt/" rel="nofollow">Strayhorn</a>. The designer, Michael Harvey is a jazz fan -- Billy Strayhorn was Duke Ellington's friend, and arranger on many of his famous pieces.There is also the display face <a href="http://www.myfonts.com/fonts/agfa/braff/" rel="nofollow">Braff</a>, named for Ruby Braff, a top cornet &amp; trumpet player who had recorded with Ellington, among many others.</p>
      <p>End of typographical jazz lecture. :)</p>
      <p>- Mike Yanega</p>
