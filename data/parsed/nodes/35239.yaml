    date_raw: 18 Jul 2007 — 1:58pm
    votes: null
    html: |-
      <p>I think of museum fonts in terms of "microsignage". That is, the small labels and placards that accompany exhibits, along with the larger, text heavy posters explaining the exhibits. This is related to, but not the same as, the fonts on the wayfinding signs that direct you through and between exhibits, but those could be included in the superset of museum fonts as well.</p>
      <p>I can't help but keep thinking of how to redesign the signs in the Rosicrucian Egyptian Museum in San Jose. they have some labels on their exhibits that haven't been changed since they were typed in the '60s (like, on a typewriter, man).</p>
      <p>(not much of an answer, more of a comment)</p>
