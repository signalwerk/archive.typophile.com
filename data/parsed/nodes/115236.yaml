    <p>Hi everyone,</p>
    <p>I am currently trying to finish a wine label but the client insists on this script font Vivante DTC which I frankly don't like at all. I need your advice. Could You please suggest a nice script font or a serif font with nice italics which goes well with the illustration? Thank you very much for your suggestions.</p>
