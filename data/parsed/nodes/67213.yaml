      <p>These don't look handwritten to me - they look scanned with an edge detect filter added. Do you have the original scan? Cyan on White is not very readable. I tried to darken it but all I got was this:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/a0f34bb582677c65d721a91eb780862e_5047.41453.jpeg"></div><p></p>
      <p>"NUMBER 1" is Artistamp from <a href="http://www.haroldsfonts.com/rubberstamp.html" target="_blank" rel="nofollow">Harold's Fonts</a></p>
      <p>2011 looks like it's a grunge version of an existing font (the '1's have the same distress).</p>
      <p> - Lex</p>
