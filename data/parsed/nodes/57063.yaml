      <p>@DB: Back around 1998-1999, Adobe added euros to only those type families that had family members bundled in PostScript printers. Other families in the Adobe Type Library only got euros added as part of their conversion to OpenType, an effort which had started around the same time. So that affected maybe 1/4 of the Adobe Type Library, as a rough swag.</p>
      <p>There might even be Adobe Type 1 fonts that were last rebuilt as long ago as 1985 or '86, but I couldn't swear to that. Certainly 1987 or thereabouts, though.</p>
