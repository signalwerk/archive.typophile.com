    html: |-
      <p>Things could be narrowed down a lot if these new digital revivals of centuries old originals are left out of the argument. Otherwise a font created in 2009 but using an original font from the 12th century could be the oldest ever font, which I think is silly. I would rather look for fonts that have a long continuous history in typography. In this way you probably end up with fonts like Garamond, Caslon, Jenson etc. It is deceptive though that there are many fonts named Garamond, often with significant differences between them. In this case I think the name rather refers to a style of typefaces, rather than one single typeface/font. Garamont (!) cut several typefaces in his day, so deciding which one is the real one is probably impossible (as several of todays Garamonds even go back to the work of others than Claude Garamont's, for instance the work of Granjon). Another element to take into account is that there have been several changes in typography, like in the role of italics, boldtype and even in the adding of new characters. If one tries to find the font that is in use as it was designed until this day you probably end up at a later date (Caslon might be close in this case).<br>
      A hard nut to crack if you really want the definite answer. It could be the work of years of typography history research... :)</p>
      <p>A note on chinese type: Though the chinese invented movable type before Gutenberg did, the complexity and the sheer amount of characters in chinese made it hard to use, and most of the books in chinese have actually been made from woodcut texts of entire pages, rather than using movable type. It wasn't until the twentieth century that this really has changed.</p>
      <p>cheerio Queneau</p>
    html_clean: |-
      <p>Things could be narrowed down a lot if these new digital revivals of centuries old originals are left out of the argument. Otherwise a font created in 2009 but using an original font from the 12th century could be the oldest ever font, which I think is silly. I would rather look for fonts that have a long continuous history in typography. In this way you probably end up with fonts like Garamond, Caslon, Jenson etc. It is deceptive though that there are many fonts named Garamond, often with significant differences between them. In this case I think the name rather refers to a style of typefaces, rather than one single typeface/font. Garamont (!) cut several typefaces in his day, so deciding which one is the real one is probably impossible (as several of todays Garamonds even go back to the work of others than Claude Garamont's, for instance the work of Granjon). Another element to take into account is that there have been several changes in typography, like in the role of italics, boldtype and even in the adding of new characters. If one tries to find the font that is in use as it was designed until this day you probably end up at a later date (Caslon might be close in this case).<br>
      A hard nut to crack if you really want the definite answer. It could be the work of years of typography history research... :)</p>
      <p>A note on chinese type: Though the chinese invented movable type before Gutenberg did, the complexity and the sheer amount of characters in chinese made it hard to use, and most of the books in chinese have actually been made from woodcut texts of entire pages, rather than using movable type. It wasn't until the twentieth century that this really has changed.</p>
      <p>cheerio Queneau</p>
