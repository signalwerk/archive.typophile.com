    html: |-
      <p>You're going to have to define "font" very specifically. If you mean specific typefaces starting from the advent of cold metal type, then Gutenberg still gets credit, because you can still find that typeface available (digitally, of course), quality not-withstanding.</p>
      <p>If you mean still being used from the original foundry cold metal font, then I think that maybe Caslon is the one of the oldest. I'm not an expert by any means though.</p>
      <p>I wouldn't know the very first "font", as in hot metal though, which would actually be interesting to know.</p>
      <p>Go to the library, find A Short History of the Printed Word by Warren Chappell, and you'll find exactly what you're looking for.</p>
