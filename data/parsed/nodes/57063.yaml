    <p>I was wondering; what is the oldest font, which is now still alive. <code class="freelink freelink-error freelink-Array freelink-error-Array">[Bad link]</code> is the oldest one I could find (from 1496). <code class="freelink freelink-error freelink-Array freelink-error-Array">[Bad link]</code> is also very old (designed between about 1470 and 1600), but I don't know if it is the oldest one of all. Any ideas?</p>
