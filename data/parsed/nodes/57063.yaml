    html: <p>Wow, I didn't realize that the fact that woodblock printing involves carving an entire page out of a woodblock would be an unfamiliar concept to Westerners. But it makes sense. Once you had the breakthrough of moveable type for linear alphabets like Latin, there is no real need to go back to recreating whole pages from woodcuts except for illustrations. In Korea, woodblock printing was still in use alongside moveable type until the 19th century, because the lack of a printing press made moveable type cumbersome enough for woodblock printing to be a viable alternative.</p>
