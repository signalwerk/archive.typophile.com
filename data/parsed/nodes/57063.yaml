    html: |-
      <p>This is a difficult question to answer, because the typeface called bodoni is not neccesarily designed by Gianbattista Bodoni. Rather it is based on the work of Bodoni, with characteristics the typefaces he cut. Garamond is an even more complex story... I second Dan that it would be a good idea to read Warren Chappell's book, which is nice to read and gives you lots of insight into the history of type. The oldest 'font' is probably Gutenburg's fraktur used for his 42 line bible, but isn't used much now anymore, because fraktur gave way relatively quickly to roman typefaces (except in Germany). Venetian typecutters were very important in the development of these roman typefaces, which are still eminently readable and are the basis of popular fonts like Bembo. I think the fonts based on this period are probably among the oldest still in use.</p>
      <p>cheerio Queneau</p>
