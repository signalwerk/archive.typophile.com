    html: |-
      <p>As many of you noted, there are several ways this question can be interpreted.</p>
      <p>If we allow for Bembo and Garamond, but disqualify Trajan and examples such as Jonathan Perez and Laurent Bourcellier's <a href="https://web.archive.org/web/20150428170244/http://www.typographies.fr/index.php?page=fontes&amp;s=Hi%E9roglyphes" rel="nofollow">Hiéroglyphes</a>, then a sensible set of criteria might be as follows:</p>
      <p>1. The font must be still in use, in a digital format (the prevalent format today), not collecting dust in a museum somewhere. This disqualifies the re-cut B-42 Blackletter type that Kegler mentioned, because it doesn't come as a font that can be used on a computer.</p>
      <p>2. The original design must be a 'font' as well, that is, a system for mechanical reproduction of writing that incorporates at least some basic analysis of the graphemes that make up writing so that they can be used to set a wide range of texts. Hand lettering does not count. Cylinder seals and woodblock printing, capable as they are of reproducing writing mechanically, can only reproduce the specific texts they are designed for and cannot be used to set other texts, so they don't count either. I don't think there is anything we can really call fonts before the invention of moveable type.</p>
      <p>3. The current digital incarnation must be a faithful revival of the original design, enough to be widely accepted as an adaptation into a different format of the same design rather than a design loosely inspired by the original. Much of this is up for debate; it helps when as in the case of Bembo or Garamond, they are marketed as digital versions of the original designs.</p>
      <p>There was an essay in the 2005 <em>Geulkkol</em> annual published by the Korea Font Development Center about a revival of the hangul (Korean alphabet) wood type used for <em>Dongguk Jeong-un</em> ('Dictionary of Proper Sino-Korean Pronunciation'), published in 1447. I left the annual back in my old apartment in Seoul, so I couldn't tell you what came of it.</p>
      <p>I do know that Sandoll, a Korean foundry, are selling a revival of the hangul metal type used for <em>Worin Cheon-gang Jigok</em> ('Songs of the Moon Shining on a Thousand Rivers'), also dating from 1447.</p>
      <p>These are not straightforward revivals. They have been adapted for horizontal writing, and there is no support for archaic letters while syllables needed for modern Korean but not found in the original documents had to be filled in. In particular, the <em>Dongguk Jeong-un</em> revival adds a post-modern twist by simply leaving the space for the syllable-final consonant blank instead of stretching out the other letters to fill the square (the <em>Dongguk Jeong-un</em> orthography always marks the zero syllable-final consonant with 'ㅇ', so a syllable composed without a syllable-final consonant doesn't appear in the original).</p>
      <p>Still, I would submit that according to the criteria outlined above, they would be fonts still available in the digital age with some of the oldest dates of creation, preceding the Gutenberg Bible (but not some of Gutenberg's earlier efforts). I don't know about any revivals of the oldest Chinese-character fonts, but maybe others can fill us in.</p>
