      <p>The Graphic Artists Guild (<a href="https://www.graphicartistsguild.org/" title="https://www.graphicartistsguild.org/">https://www.graphicartistsguild.org/</a>) publishes The Graphic Artists Guild Handbook: Pricing &amp; Ethical Guidelines, which includes a standard contract for Lettering and Typeface Design. You can order it through their website, or find it in any well-stocked bookstore.</p>
      <p>Also, the website has a checklist for writing your own contract, under the resources link.</p>
