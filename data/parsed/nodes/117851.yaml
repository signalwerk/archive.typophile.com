  html: |-
    <p>dear all,</p>
    <p>are there any templates for contracts for type design commissions?</p>
    <p>a new client has commisioned me to create a custom type family for them, and asked me to submit a contract for their review, since the matter is rather specialized and they have no similar documents they could use.</p>
    <p>so, i’ve been wondering: are there any standard type design contract forms available covering commissioned work, that can be downloaded and customized?<br>
    i’m happy to pay a reasonable fee if required.</p>
    <p>if available, i’m specifically looking for inclusion of wording or clauses regulating:<br>
    – client company has complete usage rights in print and digital media as long as company exists in its present form, but no rights to resell, while:<br>
    – designer retains all rights to resell typeface to other companies or via retail.</p>
    <p>thanks much in advance for any information!<br>
    joachim</p>
