    html: <p>It could be a manually compressed &amp; modified <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Linotype%20%2F%20%28Commercial%29&amp;ffam=Chesterfield%20LT%20Std%20-%20Regular&amp;fid=6e4840255689a284e700a8564f079625&amp;fsize=60&amp;text=FOUNDATION&amp;fit=1" rel="nofollow">Chesterfield</a></strong> (main differences being |T| &amp; |F|)</p>
