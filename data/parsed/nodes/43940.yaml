  html: |-
    <p>The Ruble symbol design presently being promoted by several parties in the design trade hasn’t yet passed muster with Unicode, neither having been accepted by an official institution, nor having become demonstrably widespread in vernacular usage (aszszelp).</p>
    <p>Could a code number have been assigned, even if there is not yet an officially sanctioned glyph form?</p>
