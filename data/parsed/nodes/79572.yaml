  html: |-
    <p>Not sure if this is appropriate (yell at me if you want), but thought I'd try. There are obviously several styles in this image and since it was silkscreened back in 1960, there are probably no exact font matches available but I was just hoping to get close. My intention is to recreate the image in Illustrator and have a vinyl graphics printer reproduce it. If I need to make a separate post for each font, then I will do so at your request. The following is a list of texts from the image, each is a different type. Any recommendations as to the closest available computer font is appreciated. This is a one-time project for me so I don't want to pay a lot for the fonts (close and free is better than an exact match for $20). </p>
    <p><a class="freelinking external" href="http://www.pinrepair.com/bowl/ccmsix1.jpg" rel="nofollow">Image</a></p>
    <p>Starting from the top left:</p>
    <p>1. Chicago Coin's    Bowler<br>
    2. SIX GAME<br>
    3. with new    scoring<br>
    4. ALL STRIKE<br>
    5. (1st PLAYER number)   1st, 2nd, 3rd, 4th ...<br>
    6. (1st PLAYER letters)  PLAYER<br>
    7. ALL STRIKE, HANDICAP, REGULATION ...<br>
    8. GAME SELECTED<br>
    9. FRAMES 1 2 3 4 ....</p>
    <p>Thanks</p><div class="imageWrap"><img src="http://typophile.com/files/ccmsix1_6703.jpg"></div><p></p>
