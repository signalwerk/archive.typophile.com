    <p>Greetings,</p>
    <p><a href="http://www.adobe.com/devnet/opentype/afdko/eula.html" title="http://www.adobe.com/devnet/opentype/afdko/eula.html">http://www.adobe.com/devnet/opentype/afdko/eula.html</a><br>
    <a href="http://download.macromedia.com/pub/developer/opentype/FDK-25-WIN.zip" title="http://download.macromedia.com/pub/developer/opentype/FDK-25-WIN.zip">http://download.macromedia.com/pub/developer/opentype/FDK-25-WIN.zip</a></p>
    <p>I tried this today and it seems broken. The paths in FinishInstallWindows.cmd seem incorrect (I get errors). Even when I manually enter the correct paths, set the PATH etc., and re-login, the tools give python errors. </p>
    <p>Switching to Fontlab macro style: There is no  FDK/Tools/FontLab directory in the FDK tree, and there is no  installFontLabMacros.py anywhere in the zip.</p>
    <p>Does anyone know what the problem is? Did I get an incorrect zip somehow?</p>
    <p> BTW, I have Python 2.7.1 installed previously on my system (so I can already I run the occasional FontLab script)</p>
    <p>Thanks in advance for any help!</p>
