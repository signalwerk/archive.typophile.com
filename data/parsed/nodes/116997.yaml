      <p><cite>Did I get an incorrect zip somehow?</cite></p>
      <p>No. Have a look at "http://forum.fontlab.com/index.php?topic=9060.0".</p>
      <p>Unfortunately Adobe provides the latest version only. I would like to have build 62690, but I cannot download it anymore. This is very annoying, because you have no access to a build, that works,  and it makes it more difficult to precisely report bugs. Adobe should keep all versions, that are listed in the release notes, on the servers.</p>
