    <p>We have just released a digital version of Rustikalis in OpenType, a very popular filmstrip font design from the 1970's.</p>
    <p><a href="http://www.dtptypes.com/OTStandards/Rustikalis.htm" title="http://www.dtptypes.com/OTStandards/Rustikalis.htm">http://www.dtptypes.com/OTStandards/Rustikalis.htm</a></p>
    <p>p.s. If anyone knows some of the history of this design, I would be very interested.</p>
    <p>malcolm</p>
