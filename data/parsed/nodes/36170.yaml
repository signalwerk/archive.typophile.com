      <p>I took a look at the website to see what was offered. I came away with some questions. All the fonts look familiar. Some have different names, like PenTipDT (Tekton), but others have similar names like GoudyOldStyleDT.</p>
      <p>I hadn't realized you could just add something like "DT" to the end of a familiar font name and call it your own. Has a licensing fee been paid to do this?</p>
