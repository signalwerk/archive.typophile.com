    <p>Please, please kill this if there's already a thread that answers my questions....</p>
    <p>When can Windows users quit caring about ClearType and anti-aliasing?</p>
    <p><a href="http://en.wikipedia.org/wiki/List_of_displays_by_pixel_density" title="http://en.wikipedia.org/wiki/List_of_displays_by_pixel_density">http://en.wikipedia.org/wiki/List_of_displays_by_pixel_density</a><br>
    A 13" MacBook Pro has a resolution of 89 ppcm  or 227 ppi. My iPhone 4s, which is starting to seem old, has a ppi of 128 ppcm/326ppi. This is no longer 'bleeding edge' technology...millions of people have these devices. </p>
    <p><a href="http://blogs.msdn.com/b/b8/archive/2012/03/21/scaling-to-different-screens.aspx" title="http://blogs.msdn.com/b/b8/archive/2012/03/21/scaling-to-different-screens.aspx">http://blogs.msdn.com/b/b8/archive/2012/03/21/scaling-to-different-scree...</a></p>
    <p>This answers some of my questions. However, I'm wondering if there are any typophiles who are using, say, a Windows 8 desktop with a high-pixel-density display. I'm having trouble Googling what options are actually available. </p>
    <p>What I think I want is an external display that I can connect to a reasonably current PC and get 200+ ppi with Windows 8. Is this possible?</p>
    <p>I don't care if its of physically smaller, I just don't want to be able to see text pixel edges on my PC anymore. Its 2013.</p>
