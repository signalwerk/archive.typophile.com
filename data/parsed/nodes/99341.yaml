      <p>&gt;How does sub-pixel grayscale work? Isn't the definition of a sub-pixel imply that it'll be color (RG or B?)</p>
      <p>Not subpixel rendering (ClearType), but sub-pixel <em>positioning</em>, which means that unlike GDI (where glyphs are drawn on whole pixel boundaries) a glyph can start on fractions of a pixel.</p>
