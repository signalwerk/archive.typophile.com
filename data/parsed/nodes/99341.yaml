      <p>We have Windows 8 running on a couple of retina Mac Books and it seems to be working without major issues. </p>
      <p>Some details on the Windows 8 approach to scaling and high-DPI is posted here... <a href="http://blogs.msdn.com/b/b8/archive/2012/03/21/scaling-to-different-screens.aspx" title="http://blogs.msdn.com/b/b8/archive/2012/03/21/scaling-to-different-screens.aspx">http://blogs.msdn.com/b/b8/archive/2012/03/21/scaling-to-different-scree...</a> </p>
      <p>With respect to ClearType, the new Windows 8 UI and apps use sub-pixel positioned grayscale (basically sub-pixel positioned ClearType with the color removed). The old UI, and desktop apps use ClearType as before, and new apps can opt in to ClearType if they want to. </p>
      <p>Cheers, Si</p>
