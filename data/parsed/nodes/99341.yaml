      <p><em>To my original question; this seems like a business situation and not one of technological limitations.</em></p>
      <p>As has been discussed here and elsewhere many times before, there are good reasons why we're seeing increases in screen resolution in smaller devices and not in larger monitors. The more device pixels in a screen, the higher the likelihood that one of them will fail; the attrition rate for high resolution monitors has been too high to entice manufacturers. IBM was making 200 ppi screens for a while, but the pricing was high, and they were mostly marketed for medical imaging uses. Apple is just now pushing the size of high resolution screens with their 13" MacBook Pro retina laptops and, just announced, 15" refurbished models. These are the largest screens of anything like that resolution that I am aware of, and I'll be surprised if even Apple can push it much further. There comes a point when the cost of all the failed screens that have to be trashed makes it economically unviable. Unless someone develops manufacturing processes that very significantly reduce the attrition rate, high resolution screens are going to mostly exist in the smaller devices.</p>
      <p>By the way, I was quite serious about getting a larger monitor and sitting further back. I have a 30" Dell screen.</p>
