      <p>CEO Tim Cook has said that Apple will update the Mac Pro (their tower model aimed at pros) in 2013. My guess is that they'll offer a standalone retina display as an option (the display is sold separately). </p>
      <p>The Mac Pro is their most expensive model and they don't sell huge numbers of them, so the low yield and higher cost of the retina display wouldn't be such a problem.</p>
      <p>But for their consumer desktop, the iMac, I don't think they're in any hurry to give it a retina display. Like you said, it would be expensive and the rejection rate is too high at this point.</p>
