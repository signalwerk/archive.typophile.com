      <p>It's not a commercial font, just something I've been working on. The 2, 3 and 4 all crash Multi-Ad when I make an EPS, although they seem to work in Illustrator CS2 just fine. Creator is usually a pretty reliable program, hence why we use it in our workflow. I see nothing wrong with any of these glyphs in fontlab, for instance, the 4 below.</p>
