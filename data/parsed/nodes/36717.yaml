    html: "<p>The arrows in your screenshot suggest that your Postscript outlines are going in the wrong direction. (Quick fix in FLS5: Contour menu &gt; Paths &gt; Set PS Direction.) Also check the outlines with the FontAudit tool if you haven't already.</p>"
