  html: <p>I don't know what to call it, but we often use a singular form of a word and it has an implied plural meaning. In this case, the phrase "as it appears in publication". You could say "publications", much like you could say "substances abuse" or "customers' satisfaction". Is there a term for this that I can use to mine info?</p>
