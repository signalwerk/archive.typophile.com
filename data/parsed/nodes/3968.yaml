    html: <p>Thanks! <br> <br>the MEXICO 68 logotype was definately an inspiration, except I went with 2 stripes instead of 3. TURBO's letter forms are based off of all of the geometric, avant garde style faces out there, ie House's CHALET TOKYO. Below are some of the lc "e" alts that are already finished. Also, you can see alternate "b" &amp; "d",  the same letterforms that makes up "q" &amp; "p" . <br> <br><img src="http://www.typophile.com/forums/messages/29/333.gif" alt="alt sample"></p>
