    html: <p>Aaron, <br> <br>It's lovely. Reminds me of the following... <br> <br>1 - <a href="http://www.myfonts.com/Testdrive?p=96&amp;s=alpha&amp;id=62582&amp;submit=display" target="_top">http://www.myfonts.com/Testdrive?p=96&amp;s=alpha&amp;id=62582&amp;submit=display</a> <br> <br>2 - Mecanorma's Dubbeldik (only sample I find is in FontShop's FontBook) <br> <br>...but is differs beautifully from both. (Only the 'k'  <br>bothers me, but I can't propose a better solution, so <br>I'm a worthless heap.) I've long seen promise in the  <br>multiline bauhaus forms and you've brought that  <br>potential to reality. This can definitely be a seller.  <br>What vending options have you considered? <br> <br>Stephen <br> <br>Dave T. - nice to see you here!</p>
