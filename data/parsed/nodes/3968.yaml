    html: "<p> Ah -- the lc \"k\" bothers me a bit too, and I think I just realized why: its x-height differs from that of the other letters. Same is true with the lc \"h\", to a lesser degree. It doesn't bother me as much with the lc \"i\", though. Still, that's a relatively easy fix. Overall, the font is a good one. <br> <br>I think I personally prefer the non-tilted alternate lc \"e\" to the tilted one, too. <br> <br>I look forward to seeing your complete set. <br> <br>David Thometz <br> <br>Stephen - Hey! Thanks! <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":)\"> Drop me a line sometime. </p>"
