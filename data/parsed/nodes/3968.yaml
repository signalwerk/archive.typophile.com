  html: <p>I have seen a few logotypes that resemble this font, but I haven't been able to find an actual face that is too similar. (if you know of one, tell me) This is my first font and I've only been working on it for a few weeks now.. Already I have many alternates for a lot of the letters, and it's tough deciding which ones will go in the final product. (especially the "e" and "a") So far there is only a lower case, but I plan to have a full character set plus an alternate or "expert" face when I finish.  <br> <br><img src="http://www.typophile.com/forums/messages/29/322.gif" alt="TURBO Sample"></p>
