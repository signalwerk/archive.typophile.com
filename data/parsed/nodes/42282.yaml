    <p>My Editor explains to me (in response to my suggestion that Freight Micro is not designed to be used so big, as it looks a bit weird and lumpy and maybe we should consider looking for something else) that 'It may look wrong from a type person point of you, but the readers aren't going to notice are they? I don't think it looks bad. It's all about opinions, everyone has got an opinion' </p>
    <p>Do I respond;</p>
    <p>a)Incredulously.<br>
    'You're kidding me. You seriously can't see how strange and lumpy that looks.' </p>
    <p>b)Carefully.<br>
    'I know they may not notice it and write a letter in complaining, but they will subconsciously react.'</p>
    <p>c)Insultingly.<br>
    'You don't know what the hell you're talking about. What makes you think you know about these things? Do I tell you how to edit?!!'</p>
    <p>d)Melodramatically.<br>
    'I quit. You don't value my opinion. You don't deserve me'</p>
    <p>e)Other.<br>
    '___________'</p>
    <p>(ps. If I come across as arrogant I don't reckon my skills THAT much, I just find it a little frustrating that they don't really listen to me)</p>
    <p>Please advise, </p>
    <p>Thanks<br>
    G T</p>
