      <p>e. Then why the f**k did you hire a graphic designer if none of this matters!?</p>
      <p>In all honesty, my response to this sort of reaction is typically something along the lines of:</p>
      <p>"To someone trained to catch these things, it's a glaring error. (this is good because it implies that other professionals will judge the publication) To the reader, it will not be a glaring error, but doing it the right way will feel better to their eyes and invite their attention. Typesetting is not about making a few big decisions, it's about making many tiny decisions that are then repeated hundreds or thousands of times, and that's why I nitpick. If I didn't, I wouldn't be a very good designer and the the production value of the work would decline. (Then, I summarize with something snappy they can repeat to other people to sound good when defending their decision to let me do my job.) It's the difference between a steak at a diner and a steak at a fine restaurant. They're both cow on a plate, but the attention to the details collectively makes the difference."</p>
      <p>Good luck.</p>
