      <p>Thanks everyone. </p>
      <p>Just to clarify, I haven't got a problem with us using freight micro for body copy. It works wonderfully for this, but I'm just not sure about using it for display.</p>
      <p>I'm probably gonna find a few examples to demonstrate how they would be better. One of the problems is that my editor bypassed myself and my art director in getting the redesign of our magazine farmed out to some guy. We didn't see any of it until it was all OK'd by everyone who had to OK it. I think that my editor thinks we may be objecting to the font out of bitterness (which is probably partly responsible) but also we just don't think it works. I also think that he has taken it as a personal affront because in a way its his design, or at least he commissioned it.</p>
      <p>Another problem lies in the fact that both he and the deputy editor reckon their design knowledge quite a lot. I do respect his opinion, and often he makes excellent suggestions, but it is sometimes hard to get him to see what I see as sense. </p>
      <p>Oh well, I will tread cautiously…</p>
      <p>Thanks again. I'll keep yar updated</p>
      <p>G</p>
