      <p>I.E., Freight Micro</p>
      <p>E)Consider that he might be correct, and educate both yourself and your editor on your findings. It is almost always easier or faster to <em>show</em> somebody why something does or does not work rather than insist on arguing. In a good design, the results are obvious. Who knows, maybe he's right? Or maybe he just hasn't seen what you're talking about with his own eyes.</p>
      <p>Besides, some professional art directors intentionally choose to use the micro size types like Freight Micro and Bell Centennial, just because they <em>are</em> slightly unusual, and thus, eye catching.</p>
