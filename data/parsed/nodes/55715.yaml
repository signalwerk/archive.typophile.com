    html: <p>Ask your librarian if the school has access to the <em>Design and Applied Arts Index</em>, a database that covers many art and design magazines that are not covered in most library databases. The DAAI made my research much easier in school and it is growing at very rapid pace. If your school doesn’t offer it, find a library that does and request (through the head of the design department) that the school get access to this database ASAP.</p>
