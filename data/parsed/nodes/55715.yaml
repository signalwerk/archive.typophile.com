      <p>I was just saying it because students these days tend to quickly jump to the internet and only the internet. I'm a student myself, and I use the internet mainly as a means to start a search for information, and after that extend this search into books and magazines (and newspapers). We are actually <em>required</em> to use books, and we usually have to quote parts from the books we use so the teacher verify it if he wants.</p>
      <p>Although, of course, the internet can be really good to find information about things that are happening at this very moment.</p>
