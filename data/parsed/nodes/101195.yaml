  html: |-
    <p>The <a href="http://www.typesociety.org/" rel="nofollow">Society of Typographic Aficionados</a> (SOTA) is still accepting programming proposals for its fifteenth annual conference. TypeCon2013 will take place August 21st – 25th in the City of Roses — Portland, Oregon.</p>
    <p>We are currently accepting proposals for contemporary and historical presentations and panel discussions, focused hands-on workshops in both the digital and non-digital realms, and a variety of programming for the <a href="http://www.typecon.com/archives/2428" rel="nofollow">Type &amp; Design Education Forum</a> and other special events.</p>
    <p>Topics for presentations at TypeCon cover a broad range of interests, including: typography; type design; font production; graphic design; new media; printing history; calligraphy and hand lettering; the book arts; advertising; type in motion; literacy; type sales and marketing; legal issues; type and design education; and other related areas.</p>
    <p>Submission deadline: <strong>Friday, March 15th, 2013</strong></p>
    <p>Please refer to the <a href="http://www.typecon.com/archives/2603" rel="nofollow">program details and submission criteria</a> for more information.</p>
