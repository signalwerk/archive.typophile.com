      <p>A couple of thoughts. </p>
      <p>I have a complete run of “AR” here, from 1954 until 1992. My father was an architect, with a modest country practice, designing primarily houses but some public and commercial buildings as well. He was strongly influenced by Frank Lloyd Wright. He practised from 1950 until 2002. Over the years, he subscribed to the typical American mags such as “Progressive Architecture,” “Architectural Forum,” “AIA Journal,” and so forth. He also took “abitare” and “domus.” (And “I. F. Stone’s Weekly” if any of you are ancient enough to remember that!) </p>
      <p>But of all those, the only ones he kept were copies of the “Architectural Review.” I think this says a lot about the content of the magazines in addition to their design.</p>
      <p>When I have some spare time I’ll look to see if 1954 is early enough for the change in design to be discussed during the run of magazines I have here, and shall certainly report back to you if that is the case. Their layouts (and even the ads) seem so much livelier than the oh-so-corporate looking American mags.</p>
      <p>Bruce</p>
