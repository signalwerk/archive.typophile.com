      <p>Thank you so much for the thoughts Bruce (and welcome to Typophile, what took you so long!?). As far as AR is concerned the post-war editions are indeed very interesting as artefacts. Due to paper racioning they were made with different kind of papers, especially special editions such as “Outrage” (1955) and “Counter-attack against Subtopia”. They are rare and difficult to find nowadays. I bought Outrage on ebay, it was a bit expensive but worth every penny.<br>
      What I should do is compare AR layout, format and typography with that of the periodicals you mention (I should have done this probably ages ago, so thanks for the inspiration). The AR was an international magazine but above all it was English and I guess that, through H. de C. Hastings, it did reflect England’s Picturesque tradition. Anyway mine are speculations but I’d be glad to hear more when you have time. Thanks again.</p>
