      <p>Thanks! I was sure a charitable soul would send a sign of life sooner or later! I think it’s such an interesting topic and going through the 50s editions of the AR was literally mind blowing. The layout is really interesting, all cluttered and with an antiquarian feel and I’m sure all this says a lot about the AR’s (or England for this matter) place in the Modern Movement. </p>
      <p>Anyway, no: nothing on Google, in fact my research is way beyond the google phase! I’ve found this information in a biography of Gordon Cullen written by David Gosling. Cullen was art director at the AR for many years and he really was “the guy with the twinkle in his eye” (as Gosling put it) so I’d love to find out more about his interest in typography (and its Townscape theories obviously but that is easier to find).</p>
      <p>That’s it. But thanks anyway Chris, for a moment I thought I had been grounded or something! Phew!</p>
