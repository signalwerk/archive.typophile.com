    <p>I’m writing an essay on the British magazine The Architectural Review (more precisely on architect Gordon Cullen and writer Ian Nairn). Apparentely during the post-war period the large format of the Architectural review did not present a decisive development in graphic design and layout, confining itself to the safe Times tipography until Gordon Cullen introduced for the first time (October 1947 issue) the use of Clarendon Bold, which became a fashionable typeface in many architectural practices at the time. The architectural Review was apparentely well-known for its innovation in lay-out and format with the contribution of Gordon Cullen, who had a great interest in typography.<br>
    I was wondering if anyone can tell me more about it or has come across any text on Architectural Review and its use of typography and layout, especially in the post-war period.<br>
    Many thanks for any link, opinion or anecdote.</p>
