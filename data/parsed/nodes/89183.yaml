  html: |-
    <p>Can anyone identify the typeface used on this DVD cover for Lolita? I'm working on a project about a 1950s sexy, wreckless, fast, slutty, smeary red lipstick, hard drinking, hard smoking, voluptuous woman. Yes, she's fabulous. I'm looking for the right typeface for her name. This Lolita face would work -- any other ideas?</p>
