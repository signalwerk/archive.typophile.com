    html: |-
      <p>But it also has features (like the gently modulated tops of the arch-stem joins) that very few -legitimate- free fonts enjoy. In fact the "c" (and to a lesser extent the "o") is the only really malformed glyph. The "s" -a very difficult letter to make well- is tellingly clean, it's just horizontally stretched.</p>
      <p>So my guess is it's either a one-off logo based on a mainstream font, or yet another plagiarized/butchered free font.</p>
      <p>hhp</p>
