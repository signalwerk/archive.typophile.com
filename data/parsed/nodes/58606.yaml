      <p>the new logos are pretty complex and have an air of being older than the originals (not necessarily a good thing)</p>
      <p>my suggestion is to steer away from the literal key reference - or at the very least have EITHER the word or the icon not both, nor combined into one mark.</p>
      <p>perhaps the skylines from the cities could make up the key teeth, or maybe the key mark is a generic (and simple) icon that will work well across most/any collateral.</p>
      <p>I really reckon the whole key thing is naff. Maybe take a different spin on a key ... think maps, think map keys/legends, simplification of directions etc.</p>
      <p>ideas anyway.</p>
      <p>—————<br>
      <strong>Paul Ducco</strong><br>
      <a href="http://www.solid-creative.com">Graphic Designer</a> - Melbourne</p>
