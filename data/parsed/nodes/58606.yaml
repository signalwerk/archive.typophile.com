    html: |-
      <p>It’s not working.</p>
      <p>When the first iteration isn’t working forget about visual effects and colours all together, because they just tend to distract you from the actual development process. You used three different fonts in just one logo. Needless to say they don’t complement each other.</p>
      <p>I would concentrate on something simple. What is Savannah like? Try to incorporate that in your logo. Don’t use too many fonts. And don’t use colours at the beginning.<br>
      ___________<br>
      <em>Robert Koritnik</em></p>
