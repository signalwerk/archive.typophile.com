    html: |-
      <p>Well in your logo, “Key to” doesn’t look like the primary part. Check logos, that have primary part and dynamic secondary part. So. I suggest you first design your “Key to” part, then you’ll work on incorporating other parts.</p>
      <p>By simple I mean, no colours, one or MAYBE two fonts at most (in the whole logo, not in “Key to”), no visual effects etc. KISS principle.</p>
      <p>Your logos so far were “Savannah”. KeyTo was just something that was added to it.</p>
      <p>And when you’ll concentrate on the KeyTo part, don’t think of it as a key. Think of what the key represents? What it does. Get associations, that will lead you to some great clever solution. And think of the purpose of these kites/services...<br>
      ___________<br>
      <em>Robert Koritnik</em></p>
