    <p>Good Evening Artists!</p>
    <p>I am seeking assistance on a logo redesign for our biggest in-house project: <a class="freelinking-external" href="http://keytosavannah.com">http://keytosavannah.com</a></p>
    <p>Key to Savannah is basically a tourism website that brings helpful tools and information to both tourists and locals of Savannah, GA.</p>
    <p>Closely behind Key To Savannah, came Key To Tybee. Tybee Island is Savannah’s beach, so we launched <a class="freelinking-external" href="http://keytotybee.com">http://keytotybee.com</a>.</p>
    <p>Our current logo isn’t translating well across all of our media. On our nametags, you can’t even read the words “KEY TO” and everyone asks if we are from Savannah, so it is time for a change.</p>
    <p>Here are the logos as they are now.</p>
    <p></p><div class="imageWrap"><img src="/files/logo-1_6741.gif"></div><p></p>
    <p></p><div class="imageWrap"><img src="/files/logo-2_5835.gif"></div><p></p>
    <p>So my first attempt at redesign turned out visually pleasing, but they didn’t really communicate much relating the mark, or the brand. I removed the key and the sticker and ended up with just a fancy looking title:</p>
    <p></p><div class="imageWrap"><img src="/files/logo2-1_4997.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="/files/logo2-2_3971.jpg"></div><p></p>
    <p>So, back to the drawing board I went, and following the advice of some fellow artists, I started with the key, and THEN to the typography, so here is where I’m at:</p>
    <p></p><div class="imageWrap"><img src="/files/keytosavannah-logo_4551.gif"></div><p></p>
    <p></p><div class="imageWrap"><img src="/files/keytotybee-logo_5561.gif"></div><p></p>
    <p>Currently, I am working on some kerning and proportions with these, but I wanted to get them up so I could benefit from as much feedback as possible. Please let me know if you like them, and what would make them better. We plan on releasing many “key to” sites in the future so this one has got to stick. This is my last chance to change it this one time. I feel that the site’s popularity is about to take hold, so the time is now!!</p>
    <p>Thank you SO much!<br>
    All the best,<br>
    awesome.omen</p>
