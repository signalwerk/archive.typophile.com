    html: |-
      <div class="comment-spam-body"><p>Otto, these tickets are a fairly common format, and I've seen them used in other countries (Luxembourg, Germany, Belgium, etc.). The only differential is the logo of the operator in the top-left. The printers are thermal, so its black print only. If you want to find out more, I suggest you ask nicely at the train station if they can tell you the name and model of the printer, and who makes it, you should be able to get more information on their capabilities (or lack of).</p>
      <p>As a lot of rail operators are moving to e-tickets, you might want to consider a redesign for those instead as you would (potentially) have more flexibility (color, format, etc.).</p>
      </div>
