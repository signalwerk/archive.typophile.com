    <p>Hi to all!</p>
    <p>I'm a young graphic designer who has to graduate in september and for my graduation project I want to restyle and redesign the tickets of the italian railways (you can see the actual tickets here: <a href="http://www.blinkerart.net/wp-content/uploads/2012/06/grafica-biglietto-trenitalia.jpg" title="http://www.blinkerart.net/wp-content/uploads/2012/06/grafica-biglietto-trenitalia.jpg">http://www.blinkerart.net/wp-content/uploads/2012/06/grafica-biglietto-t...</a> )</p>
    <p>I need help to find a great font that can be used on a train ticket and that can express "italianism" by his shape.</p>
    <p>This is the only font that I could find: <a href="http://www.campivisivi.net/titillium/maps" title="http://www.campivisivi.net/titillium/maps">http://www.campivisivi.net/titillium/maps</a></p>
    <p>what about it? A made in italy font designed for maps</p>
