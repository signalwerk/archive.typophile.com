    html: <p>Have you researched how they are printed? Tickets consist largely of type that is variable (destination, time, etc) and are probably printed on specialized equipment that may have limited font options. You may need to "italianize" the tickets via color and design rather than font choice (except for pre-printed portions of the ticket).</p>
