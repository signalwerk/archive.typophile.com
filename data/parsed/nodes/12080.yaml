    <p><strong> <a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Conferences" class="freelinking" rel="nofollow">Conferences</a> : Typotage Leipzig</strong></p>
    <p>Since 1994 this traditional event will be held around June/July in Leipzig, Germany at the Museum für Druckkunst.</p>
    <p>In 2007 it will be held on the 16. and 17. of June under the banner »Made in Europe«.</p>
    <p><a href="http://www.typotage.de" title="http://www.typotage.de">http://www.typotage.de</a> -<br>
