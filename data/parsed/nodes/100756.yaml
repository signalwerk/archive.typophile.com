      <p>Is this done with the usual "liga" ligature?</p>
      <p>What happens with the same software with common ligatures such as "fi"? Perhaps the software you are trying on simply don't understand how ligatues are supposed to work. "Visual Studio", for example, is a plain text code editor.</p>
