  html: |-
    <p>Dear all,</p>
    <p>i've done a new font with font forge in which a ligature happens -&gt; e.g. "12" is substituted with  "3".<br>
    When i test the font in Adobe indesign anything works fine, if you enter "12" you get "3" -  as expected.</p>
    <p>But when i try it in visual studio, word pad or word 2002 it get a blank space after the substituted glyph -&gt; "3 ".<br>
    It seems to me, that windows always occpuies the space which was instantly in used by the entered origin glyphs 1 and 2.</p>
    <p>Perhaps anyone can give me a hint, what i have to configure to fix this behaviour. </p>
    <p>HINT: the glyphs are of course done without brackets -&gt; "3" means 3. I used brackets to make clear, that i get<br>
    a space after the 3 -&gt; "3 "  ;-)</p>
    <p>hope for a hint</p>
    <p>Oliwan</p>
    <p>...may the source be with you</p>
