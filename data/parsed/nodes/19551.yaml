    html: |-
      <p>Thanks — after some further sleuthing I’m convinced this is a proprietary font. The fact it has no foundry or copyright listed in the header of the one font I have makes me believe it is not a commercial font, and I’m just going to abandon my quest to purchase it. Using TypeTool, I compared some of the glyph nodes against my own copies of Gill Sans, and they pretty much match. Somehow this font got out of private hands and made it to me. I will replace the font in the materials I produce for this client with Gill Sans, mixing it with Monotype’s Gill Sans SC &amp; OSF for the old style figures. To bad — it’s a nice font...</p>
      <p>Thanks for your help, folks...<br>
      Ed</p>
