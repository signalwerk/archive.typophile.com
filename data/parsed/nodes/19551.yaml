    <p>Hi folks,<br>
    I need to match a font on a job and all I know is the font name — it’s called Guild. I managed to get one font from the original artist after they couldn’t tell me where I could purchase, and indeed there is no foundry listed in the font info. This font is similar to Gill Sans, however there are some nice differences in the lower case glyphs, such as p, l, g, and note the oldstyle numerals. Boy! I want this font! Anyone know where I can buy it?<br>
    Thanks for your help —<br>
    Ed</p>
    <p>Doh! Can’t figure out that inserting/attaching thing — not working. So, here’s a link:</p>
    <p><a href="http://www.tundrastudios.com/guild_sample.jpg" title="http://www.tundrastudios.com/guild_sample.jpg">http://www.tundrastudios.com/guild_sample.jpg</a></p>
