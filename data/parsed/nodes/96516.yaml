    html: |-
      <p>Okay, so I understand the reasoning now, but I don't find it compelling. Those 'other spaces over there' seems to me to have nothing to do with what is happening on the left margin, which is nothing out of the ordinary for normal reading. So why introduce something that is out of the ordinary? As for the ragged right producing visual noise on the page, I agree, and I think the deep indent on the left only increases that visual noise: it certainly seems to in the 1976 Olympics page spreads to which Maxim linked. I think one of the reasons why adding space between paragraphs and not indenting them became a popular solution for ragged right text is precisely because making a consistent left margin anchors the text better and reduces the noise. And, of course, Eric Gill's solution for ragged right setting in his essay on typography was to get rid of the paragraph breaks altogether and use a pilcrow instead. Again, I think this was to maintain a consistent left margin contra the variable rag.</p>
      <p>Making the left margin more ragged than usual because the right margin is ragged seems exactly what one should not be doing.</p>
    html_clean: |-
      <p>Okay, so I understand the reasoning now, but I don't find it compelling. Those 'other spaces over there' seems to me to have nothing to do with what is happening on the left margin, which is nothing out of the ordinary for normal reading. So why introduce something that is out of the ordinary? As for the ragged right producing visual noise on the page, I agree, and I think the deep indent on the left only increases that visual noise: it certainly seems to in the 1976 Olympics page spreads to which Maxim linked. I think one of the reasons why adding space between paragraphs and not indenting them became a popular solution for ragged right text is precisely because making a consistent left margin anchors the text better and reduces the noise. And, of course, Eric Gill's solution for ragged right setting in his essay on typography was to get rid of the paragraph breaks altogether and use a pilcrow instead. Again, I think this was to maintain a consistent left margin contra the variable rag.</p>
      <p>Making the left margin more ragged than usual because the right margin is ragged seems exactly what one should not be doing.</p>
