      <p>I usually set the indent to equal the leading value, as this generally gives a good proportion that works for both narrow and wide column settings and adapts quite well even for very wide linespacing.</p>
      <p>The other method is that suggested by Claus, creating an optical square, but this results in a deeper indent than I usually like, and the squareness ends up being variable depending whether the line below starts with ascender letters of all x-height.</p>
