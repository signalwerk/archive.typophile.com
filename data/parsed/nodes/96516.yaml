    html: <p>I'm still trying to understand <em>what</em> about the ragged right makes a deep indent on the left seem necessary to you. So far as I see it, there is no connection between the two, and the indent retains its primary importance in relationship to the <em>left</em> margin. The eye, reaching the end of the line, jumps to the beginning of the next line, which is to say to the left margin. Hence, the indent that is merely a visual indicator of a structural division of the text should be as deep as necessary to be unambiguous <em>and no deeper.</em> Unmooring the first line of a paragraph from the left margin with a deep indent means the reader has to go looking for it, instead of simply jumping to the left margin as usual. The overall visual affects of deep indents (and wide linespacing) on a page have dramatic visual impact, but they have nothing to do with the mechanics of reading, so don't serve the text or the reader.</p>
