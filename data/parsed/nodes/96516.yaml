      <p>The publishing convention for paper books is that the first line of a chapter, or a section after a line-break, is NOT indented.</p>
      <p>Indents are to separate paragraphs, and since there is no paragraph before the first (by definition), no indent is needed.</p>
      <p>I hope this is not to far off-topic, but all the examples shown have first paragraph indents.  It <em>may</em> be a matter of preference; not indenting the first ¶ is mine. But whatever your preference, consistency matters.</p>
