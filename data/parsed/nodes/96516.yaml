    html: <p>Carolina, as a standard rule, I set the indent measure as the same of the em dash of the typeface I'm using in the paragraph. I have exeperienced that, for example, in a Garalde set at 11 points, this measure turns out to be - approximately - at 3,5 mm or 4 mm. If it appears to be too big, I decrease it a little (from 4 to 3,5 mm.; the first line indent shouldn't be too big). This way, it usually works fine for me. I'm not totally sure, but I think I read this "em dash method" somewhere in a Jan Tschichold's essay.</p>
