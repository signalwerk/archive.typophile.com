      <p>Now that you mention, I do see some Textur in it. One of the reasons I never finished this concept is because I never felt it good enough. Looks kind of bland to me, not that bad, but lacking personality. I think there are much better blocky geometric stuff out there. Maybe adding some high doses of Rudolf Koch will give it more energy. Back to the quill for me.</p>
      <p>Thanks a lot Hrant for the input.</p>
