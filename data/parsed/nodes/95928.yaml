      <p>If I clearly remember, this is an exclusive typeface made by Terminal Design for Vogue and called "Vogue Avant-Garde". It mixes <a class="freelinking external" href="http://www.myfonts.com/fonts/itc/avant-garde-gothic/" rel="nofollow">Avant-Garde</a> and influences from (light weights of) <a class="freelinking external" href="http://www.myfonts.com/search/futura" rel="nofollow">Futura</a> (pointy /A, /N, /W...). <a class="freelinking external" href="http://www.myfonts.com/fonts/ortizlopez/olround-gothic/" rel="nofollow">OL Round Gothic</a> is close too (as Century Gothic you've already found).<br>
      I like <a class="freelinking external" href="http://commercialtype.com/typefaces/graphik" rel="nofollow">Graphik</a> and <a class="freelinking external" href="http://commercialtype.com/typefaces/platform" rel="nofollow">Platform</a> even if I assume they can't be considered as similars.</p>
