    html: |-
      <p>If I clearly remember, this is an exclusive typeface made by Terminal Design for Vogue and called "Vogue Avant-Garde". It mixes <a href="http://www.myfonts.com/fonts/itc/avant-garde-gothic/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Avant-Garde</a> and influences from (light weights of) <a href="http://www.myfonts.com/search/futura" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Futura</a> (pointy /A, /N, /W...). <a href="http://www.myfonts.com/fonts/ortizlopez/olround-gothic/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">OL Round Gothic</a> is close too (as Century Gothic you've already found).<br>
      I like <a href="http://commercialtype.com/typefaces/graphik" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Graphik</a> and <a href="http://commercialtype.com/typefaces/platform" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Platform</a> even if I assume they can't be considered as similars.</p>
