    html: <p>It seems to me that technology could probably help here, not so much by creating fonts with letters that remain recognizable when altered, but by altering the entire display to compensate for the common problems faced by dyslexic readers. 3D acceleration could dynamically distort the screen in a way that compensates for a reading disability. Users could even dynamically alter their distortion method on the fly, and save profiles for a methodology that works best for them.</p>
