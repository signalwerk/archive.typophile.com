      <p><em>How many alternates can we have to each character in the alphabet in Open type and what limits it to this number? </em></p>
      <p>The format allows tens of thousands of glyphs in a font, so there are potentially more than enough for every character of the alphabet.</p>
      <p>However, the choice of stylistic sets occurs as a typesetting choice — it’s not in the document “reader” available to the end user.<br>
      Therefore, a practical system would have a variety of different fonts, for different kinds of dyslexia, which the reader could choose from in the Preferences menu of, for instance, Safari. So this would work better in a dynamic online environment, rather than with PDF documents.</p>
      <p>But, if end users download a text file into a program such as Word, then they can set and print it in *their* optimal font.</p>
      <p><em>Could a typeface be preference based with individual settings for each user or is the best way to go about this creating a programme which renders each character in the alphabet based on a set of questions for the user? </em></p>
      <p>The foundry could provide a series of fonts geared to different kinds of dyslexia.</p>
      <p>But doesn’t this situation exist already?<br>
      Aren’t there a kazillion fonts available, and can’t readers simply choose the one that works best for them?<br>
      Why do advocates try to start from scratch rather than analyzing and exploring the typefaces that already exist?<br>
      Why not do research that categorizes different forms of dyslexia, and find the typefaces that works best for each?<br>
      And only then attempt to refine those “best practice” solutions.</p>
