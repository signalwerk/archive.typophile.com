      <p>Granted some fonts are more difficult to read. Because any visual difficulties are in fine detail the size of the font can be more important. Most dyslexics really have no visual problems as far as reading print. Most problems are in fact word processing problems unrelated to vision.</p>
      <p>I sell See Right Dyslexia Glasses that are able to remove all visual distortions that make reading diffficult for visual dyslexics. More info at dyslexiaglasses.com.</p>
      <p>When doing my research I found that the majority of dyslexics will respond that they see a page of print in a clear, stable, focused and uniform manner. </p>
      <p>The idea that there are problems that are common to all dyslexics doesn’t seem to fit the current data. Reading is a complex process that needs to have many different factors all work properly. Failure of any factor can result in reading difficulties that can be classified as dyslexia. Visual problems are only one factor in dyslexia and affects a minority of dyslexics.</p>
      <p>A major problem for dyslexics is trying to determine what will help them read better when almost all treatments claim to help all dyslexics. I limit my claim so that it is always true. I claim that for the dyslexic that can describe a visual problem that makes reading difficult the See Right Dyslexia Glasses will remove that problem.</p>
      <p>The reason some visual dyslexics are not identified until the third grade is that is when the print size is reduced.<br>
      Dyslexics who find they do not have problems reading billboards are more likely to be visual dyslexics. Dyslexics that have their normal reading problems reading billboards are more likely to have language processing problems.</p>
