    <p>Several designers have tried in the past, myself being one of them; to create a typeface which would aid people with dyslexia (see for instance <a href="https://web.archive.org/web/20080907153004/http://www.readregular.com/" title="www.readregular.com">www.readregular.com</a> ). However no one typeface has been able to address the problems. Why? Because Dyslexia is a term for a number of different reading disabilities and combinations of these. There are thousands.</p>
    <p>My questions are many:<br>
    (knowing too little of the possibilities of Open type and what the next step in evolution is)<br>
    How many alternates can we have to each character in the alphabet in Open type and what limits it to this number? How can we get beyond this? Could a typeface be preference based with individual settings for each user or is the best way to go about this creating a programme which renders each character in the alphabet based on a set of questions for the user? (Programs rendering type without the skilled eye of a type designer is a terrible thought but I’m here just trying to find possible ways to combat the problem - then after we’ve found a solution that actually works we can work on the aesthetics,-)</p>
    <p>Any ideas you guys?</p>
