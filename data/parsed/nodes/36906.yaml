      <p>Endre,<br>
      I’m just curious: Can you give an example how a letter should be designed for two different types of reading disabilities?<br>
      I always like to believe that legibility/readability affects everybody the same. I find it hard to believe, that a special typeface for dyslexics is helpful, when every other typeface they see in their environment is designed differently. But I have no experience in this field whatsoever.</p>
