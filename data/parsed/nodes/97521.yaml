    html: <p>The space character is not like other characters in fonts. It's a special case in that its width is potentially variable (as in fully justified text). You can put a path in it, but it won't necessarily display an image when it is used. In many apps, only the advance width of the space character is used. In those cases, there is no workaround except to use a different character in place of the space.</p>
