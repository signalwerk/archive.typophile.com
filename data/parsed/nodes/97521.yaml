  html: |-
    <p>Hi guys,</p>
    <p>I've recently done a broadcast styling that uses a simple coloured block behind the tv program titles. I've converted the used font glyphs to rectangles so it can be used as an extra text layer (with the same text entered, just in another color) behind the 'real' title, that way it's foolproof for the broadcast mechanics :)</p>
    <p>Now onto my problem.. When we use the font in After effects all rectangle blocks show up except the one that's supposed to replace the space, it remains a regular space. The spaces however work fine and show up as the rectangle blocks in non-motion programs like PS or ILL.</p>
    <p>Any idea why this is happening or how to solve it? </p>
    <p>thanks a lot in advance!</p>
