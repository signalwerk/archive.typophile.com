      <p>So you have three separate entities going on here, is that correct? The O/T, the two line block of text, and the PC?</p>
      <p>Well, the problem here is that you have three separate entities going on here. And remarkably it studders, lol. </p>
      <p>Visually speaking, there is no flow to your 'construction'. Instead it seems you are telling the same story - twice! Once via the O/T &amp; PC and again via the two line text block. And, if that's not confusing - or entertaining enough - you have used two different forms of letter shapes - serif &amp; sans serif!!  And of those two the PC visually - in a very awkward fashion - relates to the + sign of the O/T and the vertical separation line between the law firm's principal (or is it principle?)  names!! And and, you have repeated to use two separate colours!! Which relate fully worded text to two off balance letters. And resd those two elements - text line 1st and then off balance letters 2nd.</p>
      <p>You've said the same thing twice (in several different forms), and then forced it all together. </p>
      <p>And if all that is not confusing enough - visual hierarchy - reads the two line block of text 1st,  the (my) eye travels right to left and sees the O/T 2nd, then the eye goes back over the two line block of text 3rd, onto the extreme right to visually pick up the PC 4th. </p>
      <p>Is that how others here visually see this this 'constructoin'? </p>
      <p>At least you didn't use any clip art.</p>
      <p>One thing I forgot to mention is the - again to me - the visual connection of the orange(?) fully worded text line beginning with the letter A and the off balance letter T. In my crazy graphic designer's brain it reads to TATTERONEYS - which could be a very profitable side business of law considering the recent articles written of  tattoo copyright (who really owns your tattoo design) and the Nokia vibrating phone signal tattoo patten pending.</p>
      <p>Or, just TATTERONEY'S, urban dictionary attorneys with tattoos? </p>
      <p>:)</p>
