    date_raw: 30 Mar 2012 — 8:27pm
    votes: null
    html: <p>Our practice is limited to employment, immigration, and personal injury. One of my earlier drafts listed those practice areas below the name of the firm, in place of the "Attorneys &amp; Counselors at Law". The O and T are our initials, but can also represent "over time", as in employment wage &amp; hour law (but that wasn't my primary intent). The cross is a "plus" symbol, used in place of an ampersand, but also represents a simplified chess board. Strategy plays a significant portion in the practice of law, especially in employment litigation, so I was hoping to allude to that subtly. I experimented with including white or dark boxes around the O and T, or around the free squares, but that looked weird so I left it.</p>
    html_clean: <p>Our practice is limited to employment, immigration, and personal injury. One of my earlier drafts listed those practice areas below the name of the firm, in place of the "Attorneys &amp; Counselors at Law". The O and T are our initials, but can also represent "over time", as in employment wage &amp; hour law (but that wasn't my primary intent). The cross is a "plus" symbol, used in place of an ampersand, but also represents a simplified chess board. Strategy plays a significant portion in the practice of law, especially in employment litigation, so I was hoping to allude to that subtly. I experimented with including white or dark boxes around the O and T, or around the free squares, but that looked weird so I left it.</p>
