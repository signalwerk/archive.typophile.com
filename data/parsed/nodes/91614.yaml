    html: |-
      <p>Not bad for a non-designer! Normally I -and others here- advise<br>
      that people in your position hire a designer* but in this case (noting<br>
      that law firm logos arguably benefit from being conservative, which<br>
      means it's easier to do an acceptable job) you might get away with it.<br>
      Except maybe in the final polish -for things like proper spacing of the<br>
      letterforms (and shapes in general)- where you might still require a<br>
      professional to wrap it up. Also note that a logo does not an identity<br>
      make: unless you don't mind being somewhat generic with things<br>
      like your letterhead and physical signage, you'll need a professional<br>
      to render those elements properly.</p>
      <p>* <a href="http://typophile.com/node/91610" title="http://typophile.com/node/91610">http://typophile.com/node/91610</a></p>
      <p>One specific change I might recommend trying is to make the letter-<br>
      forms in the "O"-Plus-"T" a geometric sans-serif, instead of Warnock.<br>
      That would reinforce the nice "strategy game" angle, as well as make<br>
      the logo more reproducible (those small serifs in the "T" can easily get<br>
      lost in adverse reproduction condition). In fact you're already using a<br>
      sans ("PC") and could nicely tie it all together that way.</p>
      <p>hhp</p>
