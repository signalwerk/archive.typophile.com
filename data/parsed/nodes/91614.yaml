      <p>The O/T symbol is very small. I know you're trying to be subtle, but if you're going to have an iconic symbol that represents the company, make it big enough to be clearly seen and remembered, otherwise why have it at all?</p>
      <p>Regarding the "PC",  offhand I can't remember seeing other logos with it. Seems like something more suited to a tag line or footnote, unless there is a legal requirement to use it in that manner.</p>
