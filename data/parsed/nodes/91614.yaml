      <p>&gt; a logo does not an identity make... things like your letterhead and physical signage</p>
      <p>Not only your letterhead, business cards, envelopes and signage, but also your business forms, website, print &amp; web advertising (perhaps even direct mail), etc.  I agree with hrant that it's not a bad start for a non-designer, but you should consider the advantages of having a design professional to assist you.</p>
      <p>&gt; About the "PC", there is a legal requirement to say the form of the business entity</p>
      <p>OK. My main concern is that it might be confusing to potential clients who don't understand it or think it is referring to PC computers or whatever. You might consider showing it to some folks in the same demographics as your customer base and see if the abbreviation causes any confusion.</p>
