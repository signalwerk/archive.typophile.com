    html: <p>Hi, <br>When I interview people, I see nothing wrong with unfinished work in a portfolio. If nothing else it shows that you're active. Refer to it as work in progress though, as 'unfinished' could give the wrong impression that you started the work, but couldn't be arsed to finish it. <br> <br>BTW I don't know the people at P22, but when I've dealt with them, they seem laid back enough not to be anal about things like this. <br> <br>As for the fonts, I like the first one a lot - maybe the lc a looks a little out of place.</p>
