  html: |-
    <p>Hello.</p>
    <p>I'm fairly experienced in Illustrator, but there's a technique that I can't seam to figure out.</p>
    <p>Here the designers used some circles as guides. Very sharp and snapping the guide.</p>
    <p><img>https://d13yacurqjgara.cloudfront.net/users/368240/screenshots/1784157/bravura-bratus_1x.jpg</p>
    <p>My Problem:<br>
    I know how to make an object into a guide, but how do I get my objects curves to be as clean as the guides. I can do it by eye, but it's never exactly on point.</p>
    <p>Does this technique have a name I can google or can somebody send me some tutorials.</p>
    <p>Thank you.<br>
