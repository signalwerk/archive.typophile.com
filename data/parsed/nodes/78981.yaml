    <p>Hello.</p>
    <p>I have a company that builds/manages web software as well as providing design services to a small number of clients. For quite a while we've looked at changing our logo to a simple wordmark. However; finding a perfect font that "just looks right" for our company name has proved elusive. We're great at designing stuff for other people but our own seems to be an achilies heel. To be honest, it's now driving me crazy lol.</p>
    <p>People on here are extremely knowledgable about fonts (more so than me) so I thought I'd reach out for some help. If you suggest a font and we decide to use it, I will send you $200 (or £125 / €150) via PayPal.</p>
    <p>Brief:<br>
    ---------------------------<br>
    i)   The name of the company is Aylis<br>
    ii)  Letters can be upper/lower (Aylis AYLIS aylis)<br>
    iii) Wordmark only (no icon).<br>
    iv)  No restrictions on style.</p>
    <p>Rules:<br>
    ---------------------------<br>
    i)   No limit on suggestions but be sensible; don't spam every font you can think of.<br>
    ii)  No 'close date' (if/when a font is chosen, it will be announced on here and the winner will get paid).</p>
    <p>iii) <strong>ALL suggestions must be a link to a page or an embeded image that depicts our name using the font. Posts that say things like "Check out FontX" will be ignored.</strong></p>
    <p>You might only be a suggestion away from a nice bit of spending money (plus I really need some help lol). Get suggesting!</p>
    <p>Cheers<br>
    Dave</p>
