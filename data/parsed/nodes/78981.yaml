      <p>Hear hear.</p>
      <p>That being said, €150 just for <cite>suggesting a typeface</cite>? Sounds fair enough to me. I might give it a shot. I'm sure, as Gerhard suggested, that many designers are doing whole identities for less. In fact, by saying what he said, I think he kind of undercut the whole argument…<br>
      Also, many young designers will often do stuff for free just to get some work under the belt, so getting paid for suggesting a typeface? Not too bad. Some of us feel like, at this point, we have to take whatever we can get.<br>
      Yes, ethics. But let us not forget what we're working for, in the end: not ethics; money. Doctors and lawyers and accountants too. And while <cite>I</cite> don't really much care for money and don't want it, <cite>most people</cite> (he said, unnecessarily ironically) who can get me the stuff I really want and need <cite>do</cite>. So when I decide I no longer want anything (because in reality that's what I need), I'll stop bothering. Until then…</p>
      <p>davefish, might you give us some more information about the company and/or perhaps where you're trying to go (with your logo)?</p>
      <p>So yes, I understand this argument I've seen many times and agree with it; but this is also a kind of bullying, because this argument makes people who would otherwise do this feel guilty for doing stuff for money. And you all do it. It doesn't matter how involved you are or how creative or how ethical or how serious; doing stuff for money is doing stuff for money. It's all bad. It's all selling out. We're not talking about killing someone, we're talking about suggesting a typeface. People who do not participate in contests – for whatever reason – are equal to people who do.</p>
