      <p>I posted it before and I’ll post it again:</p>
      <p>This is called “working on speculation” (spec) and is considered by many to be highly irresponsible, unprofessional and even disrespectful to the practice. It takes advantage of young designers trying to enter the field and devalues what we do as professionals. If you want a quality product, find the right person for the job and pay them their fee. As you would a doctor or lawyer.</p>
      <p>For more reading on spec-work and design ethics:</p>
      <p><a href="http://www.no-spec.com/design-organisations-their-stance/gdc/" title="http://www.no-spec.com/design-organisations-their-stance/gdc/">http://www.no-spec.com/design-organisations-their-stance/gdc/</a><br>
      <a href="http://www.aiga.org/content.cfm/position-spec-work" title="http://www.aiga.org/content.cfm/position-spec-work">http://www.aiga.org/content.cfm/position-spec-work</a><br>
      <a href="http://www.designertoday.com/Articles/4533/Spec.Work.and.Creative.Profes" title="http://www.designertoday.com/Articles/4533/Spec.Work.and.Creative.Profes">http://www.designertoday.com/Articles/4533/Spec.Work.and.Creative.Profes</a>...</p>
      <p>And many professional design association such as The Association of Registered Graphic Designers of Ontario, American Institute of Graphic Arts and the Graphic Designers of Canada will have job posting boards and resources to help you find the right client for the job.</p>
      <p>For someone who has been a member of Typophile for over six years I would expect you to be aware of this.</p>
