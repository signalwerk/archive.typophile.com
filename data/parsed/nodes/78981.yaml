    html: |-
      <p>From the AIGA: “…<em>speculative work—that is, work done prior to engagement with a client in anticipation of being paid…</em>”</p>
      <p>And quoting davefish: “<em>If you suggest a font and we decide to use it, I will send you $200 (or £125 / €150) via PayPal.</em>”</p>
      <p>This is an <strong>exact</strong> example of spec work. It takes education, knowledge, experience, skill and time to select an appropriate typeface for a context. To do so in anticipation of being paid is the very definition of speculative work. We are being asked to design a “<em>iii) Wordmark only (no icon)”</em> in hopes of getting paid. I’m amazed there is even a conversation about this.</p>
