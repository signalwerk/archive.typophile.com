      <p>&gt; With this money you could hire a designer to do a<br>
      &gt; proper visual identity system for your company</p>
      <p>Most professional designers I know charge in the range of $75 - $150 an hour, and a complete identity system costs thousands. $200 wouldn't even cover the time spent making phone calls and emails.</p>
      <p>Start with a long meeting with the client to discuss their company and what they're trying to communicate. Spend time doing research (for example you need to know what their competitors use). Come up with concepts. Have a 2nd meeting with the client. Continue this thru several rounds until a final logo is chosen. Make the final art. Design the letterhead, envelope and card, and after approval make final art. Get estimates from printers. Meet with the printer, then later review the printer's proofs, and then maybe do a press check when the stationery is being printed. Design the signature line for corporate emails, and maybe design some common forms (fax, etc). Design and prepare a corporate identity manual (a big job in itself). And so forth. It's a LOT of work.</p>
