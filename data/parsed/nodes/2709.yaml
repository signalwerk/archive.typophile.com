  html: <p>I am working on designing a logo for a new youth hockey league. I've "test-driven" about 2500 fonts today and none of them feel quite right. The request is to make it feel very contemporary or very classic. Here a couple of logos that they gave me to review <br> <br><img src="http://www.typophile.com/forums/messages/4100/24110.jpg" alt="blues">         <img src="http://www.typophile.com/forums/messages/4100/24111.gif" alt="wolves"> <br>these are the more modern ones <br> <br><img src="http://www.typophile.com/forums/messages/4100/24112.jpg" alt="bombers">       <img src="http://www.typophile.com/forums/messages/4100/24113.jpg" alt="cubs"> <br>these 2 are more retro style <br> <br>Most youth hockey logos are really bad. Keep in mind that the type must be readable on a jersey as well as a small pin. The name of the team is the <br> <br><img src="http://www.typophile.com/forums/messages/4100/24114.png" alt="capitals">  <br> <br>(one of the fonts I'm considering). My brain is getting fried. Does anyone have any fonts they would like to offer up as possible ideas? Any input would be greatly appreciated!</p>
  html_clean: <p>I am working on designing a logo for a new youth hockey league. I've "test-driven" about 2500 fonts today and none of them feel quite right. The request is to make it feel very contemporary or very classic. Here a couple of logos that they gave me to review <br> <br><img src="http://www.typophile.com/forums/messages/4100/24110.jpg" alt="blues">         <img src="http://www.typophile.com/forums/messages/4100/24111.gif" alt="wolves"> <br>these are the more modern ones <br> <br><img src="http://www.typophile.com/forums/messages/4100/24112.jpg" alt="bombers">       <img src="http://www.typophile.com/forums/messages/4100/24113.jpg" alt="cubs"> <br>these 2 are more retro style <br> <br>Most youth hockey logos are really bad. Keep in mind that the type must be readable on a jersey as well as a small pin. The name of the team is the <br> <br><img src="http://www.typophile.com/forums/messages/4100/24114.png" alt="capitals">  <br> <br>(one of the fonts I'm considering). My brain is getting fried. Does anyone have any fonts they would like to offer up as possible ideas? Any input would be greatly appreciated!</p>
