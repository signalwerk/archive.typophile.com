    html: <p>Thanks for your input. The Capitals are from Indianapolis (it used to be a professional league here in the 40s). I know the logos look like baseball, but they are youth hockey logos and are modern versions of old hockey logos. I have plenty of great artwork, I just can't find the fonts that really fit with the "look" they're trying to achieve. The Capitals had 2 logos (one is shown below-they didn't put the name of the team on their jersey just the picture) and the other one was just a big C with the player's number in it. All the current youth travel league teams are named after former professional Indianapolis hockey teams. They thought about just using the Washington Capitals logo, but decided they wanted something unique. I am also trying to incorporate the an updated version (just bits and pieces of it) of our states flag's torch (which I will also show below). The look they want is modern with a possible nostalgic feel, cool but classic. They want to project an image that they represent up-to-date hockey teaching backed by the history of Indianapolis hockey. I do appreciate all input. Thanks! <br> <br><img src="http://www.typophile.com/forums/messages/4100/24160.jpg" alt="logos"> <br> <br></p>
    html_clean: <p>Thanks for your input. The Capitals are from Indianapolis (it used to be a professional league here in the 40s). I know the logos look like baseball, but they are youth hockey logos and are modern versions of old hockey logos. I have plenty of great artwork, I just can't find the fonts that really fit with the "look" they're trying to achieve. The Capitals had 2 logos (one is shown below-they didn't put the name of the team on their jersey just the picture) and the other one was just a big C with the player's number in it. All the current youth travel league teams are named after former professional Indianapolis hockey teams. They thought about just using the Washington Capitals logo, but decided they wanted something unique. I am also trying to incorporate the an updated version (just bits and pieces of it) of our states flag's torch (which I will also show below). The look they want is modern with a possible nostalgic feel, cool but classic. They want to project an image that they represent up-to-date hockey teaching backed by the history of Indianapolis hockey. I do appreciate all input. Thanks! <br> <br><img src="http://www.typophile.com/forums/messages/4100/24160.jpg" alt="logos"> <br> <br></p>
