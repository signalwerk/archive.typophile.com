    <p>Hey guys, I’m in the finishing stages of a font, and am having some trouble with Robofab UFO stuff.</p>
    <p>I am able to export and import fonts to UFO format, using the macro panel in Fontlab.</p>
    <p>But I want to be able to just export the glyphs that I have changed, instead of doing the time-consuming complete import/export over and over.</p>
    <p>I get this weird message everytime. I have reinstalled Robofab and Python, and the problem persists.</p>
    <p>Anyone know the workaround for this?</p>
    <p>Many thanks!</p>
