      <p>&gt; I guess you instill respect for digital media when you can download a song of itunes for a dollar. </p>
      <p>Downloading a song for a dollar is not a problem. The problem is that most music is downloaded free. I asked my college class of 30 students on Tuesday if anyone had ever downloaded and paid for a song. They acted like I was crazy. To them songs are free and only crazy people would pay for them.</p>
      <p>All iTunes does is allow those people who don't want to steal music a chance to do so.</p>
