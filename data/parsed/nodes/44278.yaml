    <p>I was for one reason or other lead to a message board for the band Muse, wherein the discussion was someone asking for the font Muse uses for their logotype, which is frutiger:</p>
    <p><a href="http://board.muse.mu/showthread.php?t=2591" title="http://board.muse.mu/showthread.php?t=2591">http://board.muse.mu/showthread.php?t=2591</a></p>
    <p>The conversation quickly turns to people requesting / offering to share the font files with others. This prompted me to sign up for the message board just so I could post a little comment (at the end) about font awareness. I was rather disturbed by such a blatant violation (especially by the second to last poster who seems to have posted it Frutiger for download). Has anyone come across stuff like this before? It would seem to me that it's like trying to bail the titanic out with a teaspoon. If so, what measures do you usually take?</p>
    <p>Anyway,  none of these people will be likely to read (or care about) my comment because the thread is from a while ago.</p>
