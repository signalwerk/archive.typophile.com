      <p>I wasn't really saying that Itunes is a problem. Itunes is my sole source of music purchases. Logically, a thirteen dollar with thirteen tracks comes out to about that. I was more or less saying (albeit unclearly) that if the maximum you would ever pay for a song was a dollar, it's hard to see a teenager willing to pay even $20 for one weight. I mean to say, that they probably have no indication of the work that goes into a typeface, or it's net worth (i mean OBVIOUSLY a single song by My Chemical Romance is worth more than a "stupid" font).</p>
      <p>Please read that sentence with a sarcastic tone.</p>
      <p>The node recently created about Letterhead Fonts indirectly leads to this instance, which is a much worse violation than I seem to have found:<br>
      <a href="http://www.gfxworld.org/fonts/new_fonts_5.html" title="http://www.gfxworld.org/fonts/new_fonts_5.html">http://www.gfxworld.org/fonts/new_fonts_5.html</a></p>
      <p>I guess the summation of this thread is: They're kids, and what harm can they really do? There are bigger fish to fry. Okay, I agree, but i think it's still death by 1,000 cuts to some degree.</p>
