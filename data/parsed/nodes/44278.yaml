      <p>I agree it's not the worst case scenario, and i know we can't go around finding all the cases of this, but it's just a real annoyance. Just seeing each instance of even asking for a single font from a typeface, you just tally in your head: there's $29, there's another $29.</p>
      <p>I guess you instill respect for digital media when you can download a song of itunes for a dollar. To the uninformed, it's not so far fetched to not understand type costs a lot more. I guess the number of replies to this thread suggests that nobody here is all that surprised.</p>
