  html: |-
    <p>A few years ago I designed a typeface called <a href="http://www.dafont.com/half-cut-gothic.font" rel="nofollow">Half Cut Gothic</a> and made it available for free at <a href="http://www.dafont.com/half-cut-gothic.font" rel="nofollow">Dafont</a> and <a href="http://www.fontspace.com/elling-lien/half-cut-gothic" rel="nofollow">FontSpace</a>, but now a marketing firm here in Canada has contacted me regarding "ownership purchase". Considering it has been available for free for so long, how is it possible to change that? If copyright-wise this is even possible, how much do you think would be a fair price? ...Anything else I should be wary of?</p>
    <p>They don't seem too concerned about the freeware part. Quote: </p>
    <blockquote><p>"Since we have already used the font in some of our pieces, we'd like to continue using it, rather than creating a new font. We are ok knowing that people may have purchased the font already - but would be curious to know moving forward if we could purchase the ownership for the font."</p></blockquote>
