  - id: 521991
    user: 1250
    date: 2012-09-12T08:55:00
    date_raw: 12 Sep 2012 — 8:55am
    votes: null
    html: |-
      <p>1) Pull it off the channels you have control over.<br>
      2) Warn them that third parties might still be <em>distributing</em> it, not just using it (which even happens to non-free fonts); and if they mind, they would have to be the ones trying to get them to stop, not you.<br>
      3) The price should depend on a host of things, some difficult to nail down. Looking at the font, but not knowing anything about your customer, shooting from the hip I would say $3000 (leaving room for negotiation).</p>
      <p>If you're the type to worry that an eventual lawsuit might threaten your assets, do talk to a lawyer. But to me this case doesn't seem tricky enough to waste the money. And remember, you have to keep the lawyer happy too...</p>
      <p>hhp</p>
