    <p><strong></strong></p><div class="imageWrap"><strong><img src="http://typophile.com/files/skolar_4563.jpg"></strong></div><br>
    The successful typefamily Skolar by David Březina, has been extended to a pan-European character set. This version supports around 90 languages that use the Latin, Cyrillic, or Greek scripts, featuring over 2400 glyphs. The Cyrillic was awarded a Special Diploma at the international type design competition Modern Cyrillic 2009 and won the first prize in the Cyrillic text type category at Granshan 2009. As a bonus, Skolar PE can correctly place any accent from the font above or below all Latin letters, a useful feature for many linguistic applications.<p></p>
    <p>read more <a href="http://www.type-together.com/Skolar" title="http://www.type-together.com/Skolar">http://www.type-together.com/Skolar</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/skolar-cyrillic_2_5986.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/Skolar_8_4958.jpg"></div><p></p>
