    <p>Hello,</p>
    <p>I’m new to the type id board, and was wondering if anyone knew what fonts these are. Both are from XLR8R Magazine (one is their logo &amp; the other is a font used for headings throughout the magazine). I’ve got a feeling the logo is a custom font, but any help would be much appreciated. </p>
    <p>Thanks</p>
