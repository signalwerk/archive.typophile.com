      <p>I find that my love for type translates into me finding myself reading about type more often. Not just skimming forums or looking at annuals, but reading about the history of type, the lives of type designers...the "zeitgeist" i suppose.<br>
      It takes months, years, but eventually you'll find that the choice of typefaces will stem as much from intuition as from careful research. I'm not trying to make a blanket statement here; this says nothing about printing/media/cost restrictions, etc.<br>
      In a way its about personal taste, too. If you like Goudy or Gill, and its appropriate...why not?</p>
