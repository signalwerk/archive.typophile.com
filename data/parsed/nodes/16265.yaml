      <p>I'm with Paul, anyone relatively new to typography and eager to learn needs to have a copy of Bringhurst's <em>Elements...</em> I often say about that book that I wish I'd never read it, so that I could read it again for the first time. It single-handedly exploded my interest in typography. And once you're done with that book, simply hit the bibliography at the back as a guide to other books to take a look at.</p>
      <p>The thing with Brighurst is that he does a very good job of outlining what to look for in a font; not just if you "like" it, but what a good font needs to have in its arsenal.</p>
      <p>I have a small handful of fonts that I rely on for body copy, and each was selected first and foremost on what it has in its toolbox. To me it starts with OpenType. If I'm going to invest in a body font, I want something with an extensive glyph palette, well drawn diacritics, full Greek and Cyrillic support, small caps, all 4 number sets, a healthy selection of ligatures, all the basic math symbols, true fractions, superiors, inferiors, maybe some useful ornaments, etc. To investigate this stuff, you'll need to dig up full type specimens of the font (usually a PDF that has the entire glyph palette as well as some sample settings at various sizes, etc.). My point is it doesn't do you any good to choose a font you "like" only to discover it's missing a pile of glyphs you need. Better to compile a list of fonts that have what you need, then use that list to determine which will best serve the book you're setting.</p>
      <p>Perhaps the hardest part about choosing a body font is getting out of the way. Not "What font should I set the book in?", but "What font does the book want to be set in?" And to answer that question you need to know something about the history of type and typography (Bringhurst) and something about the book you're setting (read it).</p>
