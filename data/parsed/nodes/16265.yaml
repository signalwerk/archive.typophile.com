    date_raw: 17 Nov 2005 — 6:05am
    votes: null
    html: <p>I look a lot at type specimen sheets. If they're not available take a few typefaces and set some body copy and print it out, different point sizes, line lengths, leading, etc. Often a typeface looks good in a certain situation, buy may not work for your particular project. Also, one thing I'm bad about, is relying on my screen. Bad idea. You really do need to have a high-res laser printer to get an accurate idea of how the type will look on a finished piece. Also, get familiar with a handful of typefaces for body copy, and stick with them for a while. You can always be more creative with your headings, subheads and other graphics, but body copy is for reading. There's nothing worse than a bad font for body copy (well maybe some things are worse...)</p>
