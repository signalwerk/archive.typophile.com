      <p>My solution to not knowing how to choose: typeset everything: directions, lists, letters, notes, signs, stories, cards, etc. Use faces you know of, but aren't familiar with, particularly the text faces. Use all of the type you have as much as you can.</p>
      <p>Seeing fonts in use, particularly when there's no pressure will help you familiarize yourself with the quirks and kinks of fonts which may all 'look the same' in the font specimen books or FontExplorer. It's helped me get a general sense of what to expect from different historical classes and cuts without the stress of messing up a client job.</p>
