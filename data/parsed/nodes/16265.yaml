      <p>That Before and After thing has come up before on Typophile, and was roundly and justifiably hacked to shreds.</p>
      <p>***</p>
      <p>Bringhurst's first point: "Typography exisits to honor content".<br>
      Reading the text, parallels will emerge between what the writer is saying, and similar thoughts that have been expressed by typographers and type designers in their medium.<br>
      In advertising, there is often strategy provided for the art director concerning tone and manner, which will suggest particular typographic treatments.<br>
      And of course, you can always swipe what's hot (and put a personal spin on it).</p>
