      <p>Well, a full word space before colon/semicolon might<br>
      be French habit. But a little space before them (and<br>
      before exclamation &amp; question as well as some other<br>
      punctuation marks) was common in Germany, GB, USA<br>
      (I have no actual proofs for other countries) too!</p>
      <p>If this was forgotten because it troubled the average<br>
      typewriter and text editor, typographers should<br>
      know better. </p>
      <p>I have some samples, some of them not that old, in<br>
      <a href="http://www.kltf.de/downloads/SpacingIssues-kltf.pdf" title="www.kltf.de/downloads/SpacingIssues-kltf.pdf">www.kltf.de/downloads/SpacingIssues-kltf.pdf</a></p>
      <p>My assumption is that while especially in GB and<br>
      USA (and Germany) the spaces were abandoned<br>
      entirely, in France they were exaggerated -- which<br>
      were the two possibilities which technology allowed.<br>
      It may be an interesting subject for a more careful<br>
      study.</p>
      <p>Karsten</p>
