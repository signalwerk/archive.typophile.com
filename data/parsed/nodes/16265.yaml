      <p>"I have the Tschichold biography, and just checked the ‘Penguin Composition Rules’, p. 80."</p>
      <p>Yes. What Tschichold was against was too much space following a full stop.  ;-)</p>
      <p>"... I see early examples with spaces before the period and comma also. The commas, colons and semicolens seem equally spaced on either side. Some also have the periods equally spaced, and others with greater than a word space before sentences."</p>
      <p>I have the Fedra booklet before me right now and see that Peter Bilak's typefaces do exactly this -- i.e. space , ; . : generously. And it looks pretty good, especially in the serif. The spaced period and comma are less obtrusive than I would have imagined.</p>
      <p>"Just thought of another way to do this. A period followed by two spaces would be contextually substituted by a period followed by a word space plus a hair space, or such."</p>
      <p>(You could create an alternate space and substitute by this if space is preceded by a period. As feature, either calt, or if this is reserved for other things, one of the a Stylistic Set features.)</p>
      <p>In the long run however, these spacing issues should be dealt with on application level, not font level. Spacing is part of the typographer's job, and only on the level of the application he could easily create some settings which will apply to every font in use.</p>
