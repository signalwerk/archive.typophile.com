      <p>Not bad, Bruce, but there are a few things we'd do differently today:</p>
      <p>1. No double spacing before capitals<br>
      2. Kern Y-e<br>
      3. No space before colon and semi-colon<br>
      4. Final period could hang a bit -- to balance the hanging serif on the initial.</p>
      <p>Letterpress Centaur was a good choice for a fine edition of a classic (particularly if you had designed it yourself), with big text size, a wide measure, and plenty of leading -- it makes it look like the typeface has expansive extenders, rather than a tiny x-height.</p>
