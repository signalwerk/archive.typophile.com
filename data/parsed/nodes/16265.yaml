    html: |-
      <p>I'd also be interested to know more about the history of the spacing of punctuation, if anyone out there can enlighten me. </p>
      <p>Looking at the samples in Harry Carter's 'A View of Early Typography', I  see early examples with spaces before the period and comma also. The commas, colons and semicolens seem equally spaced on either side. Some also have the periods equally spaced, and others with greater than a word space before sentences. </p>
      <p>I have the book that revived Caslon, Mrs. Willoughby's Diary, and it affects earlies styles. It has hair or thin spaces before the colon and semicolon, but not the comma and period. It has greater than a word space before sentences. </p>
      <p>For me the question of whether to have a hair space before the colon and semicolon is just a matter of convention--I don't see a big advantage in it. </p>
      <p>But I find the extra space before sentences (but not a double space, as in typewriter styles) kind of nice as a marker for the sentences and putting a little air in the text block. Am I nuts to think of making the period with extra space to the right, so that sentences will have more space after them? Then for initials like K.D. Lang I could maybe have some contextual substitution of a cap followed by a period that would have less space.</p>
      <p>Does this make any sense to you all? Or just a bad idea?   </p>
      <p>edit: Just thought of another way to do this. A period followed by two spaces would be contextually substituted by a period followed by a word space plus a hair space, or such. Will this work? It would give people an option of the greater inter-sentence space, without imposing it.</p>
