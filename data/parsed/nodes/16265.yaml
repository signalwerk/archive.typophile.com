      <p>Thanks for the correction.</p>
      <p>But surely it is still plausible to see <em>Penguin Composition Rules</em> as an important step – even the most important step – on the road to the spacing we see today?<br>
      I can only find one pre-Tschichold penguin in my bookcase: the 1940 printing of <em>Romeo and Juliet</em>. In that, there's a full word space before every colon and question mark, and an entire <em>em</em> after a question mark. Using a thin space before and a word space after is very restrained indeed, by comparison.</p>
