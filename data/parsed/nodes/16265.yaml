      <p>&gt;&nbsp;<em>I’d also be interested to know more about the history of the spacing of punctuation</em></p>
      <p>I don't know much about this, but I believe that (in Britain) the post-war move towards using less space around punctuation marks was strongly influenced by Jan Tchischold during his reign at Penguin. He imposed company-wide printing standards that mandated what is nowadays the usual punctuation spacing, supplanting the printers' house styles (which typically added space around colons, and extra space between sentences).</p>
      <p>I think I learnt this from Ruari McLean's book <em>Jan Tschichold: A Life in Typography</em>.<br>
      (<a href="http://www.penguincollectorssociety.org/pubs.htm#typo" rel="nofollow">This book</a> also looks potentially relevant, but I haven't read it.)</p>
