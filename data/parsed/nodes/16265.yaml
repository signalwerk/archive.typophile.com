    <p>I understand that this is an art in itself, but as a budding/young designer in love with type I would like to understand this rather important subject. I comprehend styles of type and what serif/sans/script evoke but how does one go about choosing a type face for body copy? My curiosity makes me want to try new faces but I'm not sure where to go. I have access to a studio font library at school of about 1000 faces so I will be able to experiment without having to buy them just for this purpose.</p>
    <p>What I'm looking for is your opinions/experience in this subject matter. Maybe this is too broad of a question, but I think it's worth a shot asking anyways! I'm just looking to expand my knowledge and this is the best place I could think of to ask this.</p>
    <p>-Dave</p>
