      <p>Try and match the text to the type. I was looking at a book my wife worked on, designed by a well known book designer. The text was about Anselm Kiefer. The art deals with several mystical systems including the Sefer Hechaloth, alchemy, etc. Keifer uses lead in his works, and references alchemy often. The designer chose Fournier, a digital face based on the types of Pierre Simon Fournier. Fournier, as it turns out, was also an alchemist.</p>
      <p>The best approach is to read the text, and find good type that has some synergy with the text. I often find by approaching a book design this way, I become convinced that there is only one face to set the text in. With this decision made, the page and text block geometry will flow based on the needs of the type.</p>
