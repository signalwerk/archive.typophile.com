      <p>From a strictly personal view, and it's nothing I've ever taught about, I am a strong proponent/believer in "looking, seeing and experimenting."</p>
      <p>It's one thing to start as a novice designer and trying to arrive at a balance of conventional text with heads. To some degree there is a lot of latitude before you start going over the deep end. Following sound advice will keep you and your work safe, since after all, most of us needed to earn a living right off the bat.</p>
      <p>While you are still in school or starting out at your first design job, never lose an opportunity to look closely at anything that catches your eye. Stop and examine what might be unique, different, engaging or even plain stupid about the piece. It may seem like nothing at first, but after a while your eye will start discerning things at play that seemed invisible before.</p>
      <p>Look at old stuff, new stuff, books printed with metal type, books and magazines printed during the 60s to mid 80s which most likely would have been set on phototypesetting equipment.</p>
      <p>Start carrying around a lupe (or small magnifier) and don't be afraid to put your nose literally on the page. Hold stuff at arms length upside down and squint to break text down into blocks of gray. Eventually you'll start "seeing" type at many levels; as texture, its color, fluidness and rhythm or a staccato and fragmented look. </p>
      <p>Combinations of characters in a word or line might seem too heavy or too light or the overall block of text though evenly spaced may seem too weak or too strong in juxtaposition to the rest of the design. By training your eye and improving your typographic awareness, you can begin to make type determinations for yourself. You will "feel it" if the page looks off or if the tone of the type contradicts the tone of the content.</p>
      <p>Once you can make these determinations for yourself, you can (if you want) truly start experimenting, because now if something doesn't work, you have a better sense of what to do. It's like being a composer or a chef, because great typography is more soul than science.</p>
