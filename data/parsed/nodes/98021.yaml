      <p>Michel,<br>
      thanks for that excellent find. I remember I encountered that sort of characters once, anywhere … would have to dig very deeply to unearth it.</p>
      <p>An interesting set of characters.<br>
      The <strong>Sursolidum</strong> char. applies just the ordinary <strong>ß</strong> (00DF).<br>
      Apart from that, the rest is true original abbreviational characters which are not yet encoded (*one exception); because it is no wonder why they are not materialized in any available font so far.<br>
      Dragma – * is a graphic modificant of lowercase <strong>d</strong>, very much like the usual glyphs which have been used for d[enarius], Pfennig (20B0). Strong candidate for unification.<br>
      Radix – is basically a ‘<strong>r</strong> rotunda’ (A75B) with a swashy cross-mark attached to its leg, similar to the ‘rum’ abbreviation (A75D).<br>
      In the same manner a blackletter <strong>z</strong>  and a <strong>c</strong> have been modified to stand in as characters for ‘Zensus’ and ‘Cubus’; the rest of the listing is just combinations.</p>
      <p><cite>Summa summarum:</cite> what we have here is definitely a proof for three characters still to be encoded (Radix, Zensus, Cubus).</p>
