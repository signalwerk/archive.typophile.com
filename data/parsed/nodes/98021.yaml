    html: <p>Michel, 1D59F is but a reflection of the ordinary Fraktur z. The closing or even crossing of the loop is not a mandatory feature here. – Compare the special Zensus-sign to the average z in the word …dezens, there you have the difference (which, in this case, is meaningful).</p>
