      <p>&gt;I’m not sure what you mean about the contrast of the M being reversed.</p>
      <p>Sorry, not very accurate language. I meant that the left diagonal needs to be heavier than the right one for optical balance, and it looked the other way round. I think you've cracked it anyway now. It's all looking really neat :)</p>
      <p>I wonder if you might make the strokes of A slightly slightly narrower near the apex. I'm guessing the eye expects the base to be slightly weightier to not look top heavy. It'd just be a matter of a couple of units probably and I'd open the counter's top to make a tiny trap there to achieve that I think. The crossbar might withstand moving down a tiddly fraction but I'm being very picky now!</p>
      <p>Right side of P may need to be slightly wider. Compare it next to O and the stroke looks thinner. R possibly too.</p>
      <p>D may be slightly wide but my eyes are starting to play tricks from looking at this so minutely. Anyway I think the widths are fixed by the circles you need.</p>
      <p>If you want to take this further, set some text and it'll be easier to see any inconsistencies, but it is looking pretty well made as it is.</p>
      <p>:)</p>
