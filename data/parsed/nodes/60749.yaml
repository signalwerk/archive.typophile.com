    html: |-
      <p>Thanks! I'll look into these over the weekend.</p>
      <p>Yes, the I is intentionally wide. These letters all go within circles, and it seemed like the I needed to be a little wider than normal to fill up the circle a little more. (I didn't post how these look inside the circles because I wanted the comments to focus on the shape of the letters).</p>
      <p>Some of the other width issues (like the narrow M and W) also have to do with these letters going inside of circles. I wanted to give them a little room within the circle. If I ever use these letters as the basis for a normal typeface, I'll definitely need to address those issues. Once I get these letters cleaned up more, I'll post a version showing them within their circles.</p>
      <p>I did trim down the 7, but I'm thinking that the 7 in the PDF file I posted is not the trimmed down one. I'll look into that.</p>
      <p>Good catch on the Q. I thought I had used my most recent O as the basis for the Q, but I didn't.</p>
      <p>I'm glad the S didn't ring any alarms. That's my least favorite character to draw.</p>
      <p>I'm not sure what you mean about the contrast of the M being reversed.</p>
      <p>Jonathan</p>
