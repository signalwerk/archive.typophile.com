    html: |-
      <p>Ok, please take comments with a dose of salt...I'm also a beginner.<br>
      A needs a hair less weight on the left diagonal for optical balance with the right side.<br>
      B and C are great. D I think looks heavier on the right than on the left.<br>
      E may be a notch too wide.<br>
      G: I think the bottom corner should move down a bit and I'd think about a longer crossbar.<br>
      The serifs on I look a bit wide, perhaps that was intentional?<br>
      K: the top arm looks heavier than the bottom...thin it slightly?<br>
      The contrast on M looks reversed and it's quite narrow overall.<br>
      N normally has a slightly heavier join at the top than at the bottom to keep the weight optically centred.<br>
      O and P are lovely.<br>
      Q looks narrow (is it the same as O?) and needs more counterspace. The bar needs to move right too, I think.<br>
      The leg of R starts a bit too close to the stem and the counterspace underneath it seems oppressed by the counterspace to its right.<br>
      S is pretty nice, but may be slightly wide?<br>
      V and Y might have the same trouble as A. The right diagonal should be slightly thinner (just a few units)<br>
      W: see M.<br>
      Did you take some weight off 7? It still looks heavy.<br>
      I'm not sure about the taper on the hat of 1...the terminals everywhere else are the same width as the strokes.<br>
      Overall this is looking very neat. Nice. :)</p>
