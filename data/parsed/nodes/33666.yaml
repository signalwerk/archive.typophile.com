  html: |-
    <p>Hey everyone, this is my first post, hope you could help me with this...</p>
    <p>Just wondering what this typeface used for the DESIGN MUSEUM's identity is. I thought it could be some form of Din (because of the straight leg of the R) but the S is nothing like any Din, it has much more of an extreme curve. </p>
    <p><a href="http://www.designmuseum.org/exhibitions">http://www.designmuseum.org/exhibitions</a></p>
    <p>sorry my terminology is terrible</p>
    <p>any suggestions for typefaces of this sort would be a big help too. I'm currently working on typographically illustrating Nineteen Eighty-Four by George Orwell for my project at uni. Im looking for a very clinical looking font that has impact and authority on a page that can also represent the uniformity of life. I'm thinking maybe something mono-linear.</p>
    <p>I would love to be able to afford Akkurat, but i am only a student.</p>
