    html: |-
      <p>Hi Angel. For the numerals, I agree with tying the numerals use with Latin.<br>
      But if you include lowercase oldstyle numerals, people will end up using those. So, I think it would be better to have the cap-height ones, or none at all. Or you may consider keeping also the oldstyle ones, but unreferenced by Opentype, so it will be less likely people will (ab)use them. :)</p>
      <p>About the monotonal weight treatment, it‘s fine but I think there are less limitations than we think in current technology for buildings' lettering.<br>
      I was mostly suggesting giving a different inclination in how the strokes terminate, if you don’t like the idea of slight modulations.</p>
      <p>Also, I think the [D] is a little too wide, and the [R] leg could benefit from being very slightly shortened, so it would not extend excessively below the baseline. Overall, it is very nice.<br>
      Besides, we already have monolinear interpretations of the Latin classical "Trajan" model, with Mario Feliciano’s Garda, and (especially) Stefano Temporin's Brixia: <a href="http://www.progetto-italic.org/?p=111" title="http://www.progetto-italic.org/?p=111">http://www.progetto-italic.org/?p=111</a> (unreleased)</p>
      <p>My critique was just suggesting things I think could be improvement, but are minor details.</p>
