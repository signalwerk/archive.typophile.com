    <p>Hello,</p>
    <p>I've released a couple of fonts for the first time, and I'd love to hear to your comments. Both fonts can be downloaded for free in my web page. Both of them are display fonts, letters with no modulation, thought as a font for architectural signs.</p>
    <p>This one, Museum, is based upon the lettering in the Trajan's Column inscription.</p>
    <p><a href="http://www.angelsanchez.eu/index.php/project/museum_font" title="http://www.angelsanchez.eu/index.php/project/museum_font">http://www.angelsanchez.eu/index.php/project/museum_font</a></p>
