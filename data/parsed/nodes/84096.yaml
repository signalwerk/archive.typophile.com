      <p>Piccic, my inttention was making a typeface for buildings lettering. This signs are usually produced through folded plates, so the width of the path was necessarilly uniform. About numerals, I think it would be nice if people used the roman numbers of this font. I finally decided to include this arabic numbers, but I wanted to emphasize the ancient style. Anyway, I'm conscious it's not the best for capital letters, so I'll consider your suggestion.</p>
      <p>Nick, I didn't know this Toronto subway typeface. It remembers me Neutraface, and I also have some plans of making a 50's modern style typeface.</p>
      <p>Thank you, JeorgGustafs.</p>
    html_clean: |-
