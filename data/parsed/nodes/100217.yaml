    html: |-
      <p>Looks like Helvetica Neue Condensed in the attached .png file.</p>
      <p>There's a mix of Helvetica/Arial (upper menus and smaller text) and Meta (scrolling graphics) on the website. Actually, FF DIN has been used in the headings on the lower part of the site. And look at that, there's some Frutiger Condensed, and more, used in the scrolling graphics as well!</p>
      <p>It's a bit all over the shop really.</p>
