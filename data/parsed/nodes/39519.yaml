      <p>When i was an apprentice in the mid to late nineties, i was lucky enough to have been taught handsetting and letterpress as well, although the digital age was in full swing alreday back then. I still think that letterpress does have a high educational value, as it is the great way to understand how type works, no matter what medium you’ll use in your career later.<br>
      I have a 12pt Futura Eszett which was a present from a teacher back then, as well as some Linotype matrices, can’t remember what typeface though. One day there were buckets full of these in our school as they were going to be thrown away, so i grabbed a handful. I also have one of those devices you hold in your hand while handsetting, i don’t know the english term (anyone?), in german it’s called a „Winkelhaken“.<br>
      It’s not much of nostalgia for me, it’s more about being aware of the roots of what one does every day. And before anyone chimes in, i have a hammer and a few chisels somewhere too, forged especially hard for use on granite.</p>
