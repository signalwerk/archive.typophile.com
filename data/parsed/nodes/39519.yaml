      <p>“So, yes, my answer is emotional, and I do believe that emotions play a great deal in what you love to do as a craft.”</p>
      <p>Well said! There’s no arguing with those sentiments. </p>
      <p>In spite of never having the great good fortune seeing anything as inspirational as the original drawings of Gill Sans (where do they sit?) I can identify with most of what you say. </p>
      <p>My only reason for intervening was because I felt we sometimes tend to be rather backward-looking when it comes to these things. Not being a web designer, I still do not really miss the tactile element in my work, but I agree with you that an earlier era of printing/typography offered kinds of satisfaction that were qualitatively different (not necessarily better) from what we get today.</p>
      <p>You’ll surely agree that typography like any craft can retain it’s robustness only if it redefines itself continually. And in that sense to call metal-type the real thing is to somewhat discount all the work that has happened post-letterpress.... the works of a Frutiger, or a Spekermann can’t be any less the real thing just because the dominant reproduction process of our time is not letterpress</p>
      <p>Again, as I said, I’m not arguing with what you say. Just another, not even very original, point of view :)</p>
