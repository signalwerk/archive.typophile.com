      <p>“I’m wondering, how many of you fine typographers would feel really happy to hold in their hands a complete metal set of your latest digital type in 24 pts?”</p>
      <p>Well, I’m not what you would call a fine typographer. Will Powers, Kent Lew yes. I’m a type designer, hoping to be good at that. Middling typographer (very old-fashioned). </p>
      <p>I have been fascinated with the idea of hand-cutting punches for a typeface and having it produced. It certainly isn’t a practical idea, as it would take so much time and effort, but I appreciate the tactile attraction of the materials. I remember the way I felt when I first got a proof of my type off a laser printer (electric!), and I imagine I’d feel the same seeing my types chugging out of a Monotype caster. </p>
      <p>Part of my fascination is seeing the 3 types that Rudolf Koch cut by hand for machine production; they really have something marvelous in them; there’s something ineffable when type is cut at the same size it’s cast. Each size has to be different, so they are more like versions; interpretations, like with Caslon. </p>
      <p>I own a small press but it needs a part, and I have zero metal type. No room for that yet.</p>
    html_clean: |-
