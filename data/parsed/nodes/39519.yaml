      <p>David, thanks for starting this thread. Got me to thinking about some long-forgotten typesetting “experience” I have. But first, to answer your  question, sadly, I have no metal types.</p>
      <p>Back in the late 1960s, as a high school freshman, in New York, I had to take a sampling of “shop” classes, once of which was printing. For one-quarter of the school year we set real, metal type and printed stuff. Although I remember the awful wooden footstool I made in the quarter-semester woodshop (I later chose tech electronics as the shop class for the  three years that followed), for the life of me I haven’t a clue to anything specific we printed.</p>
      <p>I wish to God I’d appreciated it more—or, in fact, that I had chosen printing instead of electronics, which, it turned out, I really wasn’t interested in. Truth is, at the time, my plan was to be a novelist. So printing might have somehow made more sense and gotten me where I wound up a lot sooner.</p>
