      <p>From what I’ve read so far, it still seems some of us are feeling kinda nostalgic when thinking about this era, when you could touch type. I used to give typo lessons, and I remember how it felt to leave my house in the morning with types in my pocket. I mean, to most of the young typographers today, this sentence is surreal: “types in my pocket”. Take a look at the limited edition Helvetica DVD: the most precious artefact in there, wrapped in a beautiful bag, just like diamonds in a james bond movie, is ONE letter from some Helvetica set... It became a luxurious curiosity. </p>
      <p>Though, again, I want to make sure I’m not misunderstood: I love, admire and respect the latest typographer’s job. I have no doubt that Erik Spiekermann and Adrian Frutiger also did the “real thing”. I j ust... Well, you get my point.</p>
      <p>I’d love to get some letters from the greatest types, I’m wandering around ebay or flea markets from time to time until I get the chance to do so at an affordable price. I’d be proud to own a little bit of Bodoni, Helvetica, Akzidenz, Baskerville...</p>
      <p>Writingdesigning: you can see some of Gill Sans’ original sketches at St Bride Printing Library, in London (yes in England - what a surprise)... If you have the opportunity, don’t miss it.</p>
      <p>dr</p>
