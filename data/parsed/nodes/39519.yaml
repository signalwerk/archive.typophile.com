      <p>I do have a couple of loose characters lying around, but that’s not really interesting to be honest. I do like whole cases with type though. At my school the letterpress workshop has quite a lot of cases of metal type; different faces in different sizes. </p>
      <p>- Akzidenz Grotesk (Mager/Normaal/Smal/Breed in 6—48 pts.)<br>
      - Nobel Regular/Light (10 pts.)<br>
      - Grotesque called ’Annonce’ (Bold, 12—60 pts.)<br>
      - Bodoni (Normal/Italic/Bold 10—36 pts.)<br>
      - A Garamond (it looks a bit like the one ITC based its garamond on, sort of ugly) (Roman/Italic/Semibold 6—36 pts. There are also swash initials and caps present for most sizes.)<br>
      - Helvetica (Light/Normal/Semibold/Cursive) Helvetica Extended (Light/Normal/Semibold in about 7—72 pts.)<br>
      - Volta (Regular/Semibold/Bold/ 10—36 pts.)<br>
      - A didot-like face called Arsis (20—48 pts.)<br>
      - a wide serif called Promotor (16—36pts.)<br>
      - Something that resembles (or is) Mistral (not much sizes),<br>
      - Gill Sans Bold or Black unfortunately only in 36pts.</p>
      <p>Some intermediate pointsizes (in between like 10—36) might not be there, I’m not sure exactly.</p>
      <p>Also Helvetica in wood in different sizes, measured in augustijn (or cicero), from relatively small to huge. Both Normal and Condensed. And one or two more woodtypes of which I don’t know the name.</p>
