      <p>Cannot resist this thread.</p>
      <p>Although I haven’t looked at it in years, I have a little Kelsey press and a few fonts of 8 to 12-point type, mostly Futura, maybe some Bodoni, couple of others.</p>
      <p>In pre-DTP days (and up to the time that PageMaker learned how to hyphenate), I used the Kelsey mostly to set cutlines and photo credits for pasting up on mechanicals, usually shortly before the boards had to go to the printer. (Always forgot to order that small type when the job was being set.) </p>
      <p>I also have a large type storage rack made of oak (an inch thick, maybe more) with 36 or 48 California type trays (guessing: two columns of them, anyway). It stands about four feet high and has a slanted top on one side for reading proofs, and space on the other for setting type. It has been disassembled, but is in good shape. Not all the trays are good, though.</p>
      <p>I had been fascinated with type ever since I was a kid, so when I saw it, I bought the Kelsey and mastered the setting of small bits of type. Got some of the type from Kelsey in Meriden, CT (probably from Monotype output) and others by mail order from Quaker [something] in Pennsylvania.</p>
      <p>Have to agree with Will Powers, though — I have always been more interested in setting type and seeing at it in words on the page than as bits of metal. I’m afraid I found hand-setting frustrating. Give me InDesign (or even good old PageMaker), and I’m happy.</p>
      <p>—Kathleen</p>
