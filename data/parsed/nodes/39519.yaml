      <p>I’ve got a lot of California job cases full of Monotype and foundry type in a cold Minnesota garage. Anybody want it? Come see it and make me an offer. Mice love the little sections of the job case; they nestle into little nests there and soon the case fills up with mouse shit [can we say “shit” here?]. </p>
      <p>We hauled this stuff from California 20 years ago as we ended our long careers as letterpress printers. Why we still have this stuff is beyond me. I suppose it is some emotional tie to our fabulous younger days printing &amp; publishing poetry and much else and rambling around San Francisco with the vibrant community of others the same age doing the same thing [and also hanging with our revered elders]. The garage has to be re-built, and I suppose this will all go to the scrap yard soon. Most of the typoe has mouldered some through wet summers and cold winters. I sure hope that font of Fry’s Ornamented I bought from Stephenson Blake about 17 years ago is not out there. I have not seen it in years, though. Why did I buy it?</p>
      <p>There’s nothing special to me about metal type. I’m a typographer because I’m interested in the way type looks on the page, not in how it got there. Letterpress is different than offset, not better. Metal type to me is no more real than the type I am setting right now and that you may soon read on your screen. Offset is so darn good today, and so many text types are so well made: we are in a golden age of typography. </p>
      <p>But as I look to the possibility of retiring from daily work in a few years, I think about getting a platen press and a Ludlow machine and doing some letterpress again. But I hope I never print letterpress from computer-generated type. To me the craft connection of setting type, locking it up, making ready the press, printing the sheets, and then distributing the type is the very essence of the work. I am happy to say I have developed a very different, but very strong level of craft connection as I work at a computer.</p>
      <p>powers</p>
