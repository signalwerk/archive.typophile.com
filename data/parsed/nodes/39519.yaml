      <p>I’m lucky enough to have access to the Pierson/Davenport Book Arts Center at Yale. I just finished my apprentice course there, but we have (literally) tons of metal type, with a whole new stash just arrived from another (maybe defunct) press. I was truly in awe the first time I saw it. I haven’t had a chance to explore the “Type Library” room much — yet — but I did get to use some terrific Palatino Swash, which I’d never seen before.</p>
      <p>I myself only have three letters of Packard that I rescued from being thrown out when someone pied a bunch of type. Pied, for anyone who hasn’t spent time in a print shop (like me until three months ago), means that the type was jumbled; the printer decided it wasn’t worth resorting it all.</p>
      <p>If anyone’s in New Haven in the future, I do recommend seeing if you can stop in for a bit — we have seven presses, if I remember correctly, platen, hand, and Vandercook. It’s really an ideal stomping ground for someone into this stuff.</p>
