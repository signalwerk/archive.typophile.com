      <p>I just got into letterpress recently. Some type came with the press, a very complete set of 8pt ATF Copperplate; a 10pt Typewriter monospaced font; some awful 12 or 14pt advertising font that I haven’t bothered to ID; and a few characters of what I think I’ve identified as ATF Flash in about 16pt. Since then, I’ve purchased some new and used type on eBay, including Century Schoolbook Italic, and some Garamond figures to go along with—ah yes; nothing. eBay’s a mixed bag, and I don’t recommend it unless your patience spans years and you are willing to occasionally be disappointed, but then again I’m talking to a roomfull of type designers.<br>
      The best thing to do for letterpress hobbyists is to make friends who have all the stuff and don’t mind you dropping in and helping yourself. Relationships like these with schools or individuals are great and somewhat easy to develop.</p>
