      <p>I have a full set of Garamond CAPS + numbers + a composing stick. They are the only remnants of the hot-metal Linotype shop my father owned in NYC. Cleaned the Linotype machines, tripped the Vandercook, set typositor, ran jobs and slugs around the city to other trade shops during summers.</p>
