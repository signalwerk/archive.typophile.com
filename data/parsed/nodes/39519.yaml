      <p>i have recently bought arabic and latin metal type.<br>
      it was from an old printing press in the mountains of lebanon.</p>
      <p>i have now 9 arabic fonts and 6 latin fonts.<br>
      what is amazing is that the arabic mattress is two as big as the latin one.</p>
      <p>in the Latin i have Helvetica Italic in 48 pt<br>
      and i have one serif type names Romine and another Sans named Europe.<br>
      for each i have 12 pt and 18pt</p>
      <p>in the arabic. i have one arabic Naskh typeface in 8pt, 12pt, 24pt Regular and Bold.</p>
      <p>i also got one Composing Stick.</p>
      <p>for the Latin a made a closet for them based on the traditional closet shape for the drawers...<br>
      and the arabic i am still thinking what is the best way to store or display them. or if i need to use them.</p>
      <p>i am thinking of a metallic shelves system to put the arabic huge mattresses in since the wood will not be strong enough the hold them</p>
      <p>i am now in the process of cleaning them from dust, so this is taking me hell of a time.<br>
      whenever i have some time off or need to take a brake from work, i clean some letters.</p>
      <p>my next step is to get the printing press, but this will take more time for me to put aside the price for it...</p>
      <p>and then maybe open a small press for educational use where my students can come a typeset type. and also i can use i to make some prints with it...</p>
