      <p>I have one piece of type, a capital E that was a souvenir from a session at the Rare Book School in Charlottesville. It was hand-cast in front of me by Stan Nelson. In fact, it was still quite hot to the touch when it came into my hands. It still has the wedge-shaped metal chunk corresponding to the funnel-tube through which the molten typemetal was poured.</p>
      <p>I love it. It’s getting kind of beat up now, though, and the printing face is black from felt-tip marker from my “proofing” experiments.</p>
