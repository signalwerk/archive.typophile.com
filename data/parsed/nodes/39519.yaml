      <p>Actually, I do enjoy hand setting type, but the purpose of that exercise is to arrive at something, not just lull in some nostalgic zen pleasure-trip whatever (what the hell is that when you have to get the work out?), and that can be accomplished with just as much care on the computer. The computer isn’t just for speed and convenience. It offers far more flexibility and options. . . far more than were possible with metal type. It’s just that most folks won’t take the time, and hand setting metal type forces you to do just that. That craft practice is actually transferable. If you are willing.</p>
      <p>But it was a no brainer switching from metal to digital type for letterpress printing. Operating costs drop dramatically and one can actually achieve the same results if not remarkably better; and actually make a living at it instead of being constantly in debt.</p>
      <p>New metal type was, and is, quite, quite, more expensive than digital type and when you are sick of it you can’t just delete it or ignore it, it is there, in a cabinet taking up six-square feet of room space, that you are paying rent on.</p>
      <p>Gerald</p>
