      <p>Well sorry but for me, a metal type IS the real thing, as well as the drafts and drawings from the typographer. I once saw the original drawings of Gill Sans, and It was unforgettable - I felt that I was in front of Gill Sans for the first time. I do respect today’s typographers work which is sometimes entirely virtual, of course, but I am very much attached to the feeling, the touch, the smell. </p>
      <p>I’ve been designing websites for 6 years, making litterally hundreds, and one day I woke up and I realized that all I did was putting virtual 0s and 1s in the correct order, that when the computer power is turned off, there is nothing left from all these years of hard working. Digital is great, but I feel like we lost something on the way. </p>
      <p>I’m wondering, how many of you fine typographers would feel really happy to hold in their hands a complete metal set of your latest digital type in 24 pts? </p>
      <p>So, yes, my answer is emotional, and I do believe that emotions play a great deal in what you love to do as a craft.</p>
      <p>dr</p>
