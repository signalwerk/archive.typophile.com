      <p>Well, I guess this is the right discussion to announce your chance to get metall type character sets...</p>
      <p>First of all my answer:<br>
      Yes, I have some lead types. Approx. 30 empty cabinets, 12 tons of lead letters, several wood letter fonts. All together 378 articles at the moment :-)</p>
      <p><a href="http://www.bleisetzer.de/cms/front_content.php?idcat=36" title="http://www.bleisetzer.de/cms/front_content.php?idcat=36">http://www.bleisetzer.de/cms/front_content.php?idcat=36</a></p>
      <p>Now the announcement:<br>
      Starting next Sunday on 9th of December at 8:30 pm (german time), I’ll offer 37 full character sets of lead letters like the following ones on Ebay Germany:</p>
      <p></p><div class="imageWrap"><img src="/files/1_6500.jpg"></div><br>
      <div class="imageWrap"><img src="/files/2_5180.jpg"></div><p></p>
      <p>All auctions will end after one week on Sunday, 16th of December, at 8:30 pa (german time).</p>
      <p>The reason for my announcement.<br>
      I am a dealer for german lead letter articles.<br>
      And I need money.<br>
      But(!): In this case the incoming money is not for me. Every Cent will be paid to an organisation for parents of cancer children in Duesseldorf/Germany:<br>
      <a href="http://www.kinderkrebsklinik.de/" title="http://www.kinderkrebsklinik.de/">http://www.kinderkrebsklinik.de/</a></p>
      <p>Why I do this?<br>
      Well, life is taking and giving. I took, and now its time to give. I organize these kind of auctions since three years in December, after I got into close contact to these parents. I cannot explain it in english, sorry. But I have to do it. I see it as a duty.</p>
      <p>Now the rules:<br>
      Who’s interested to place a bid (auctions will start at Euro 9.90) should send me his/her Ebay name, so I can allow him/her to place bids. And he/she should take care to have an access to my Ebay account at Ebay Germany:<br>
      <a href="http://search.ebay.de/_W0QQfgtpZ1QQfrppZ200QQsassZbleisetzer" title="http://search.ebay.de/_W0QQfgtpZ1QQfrppZ200QQsassZbleisetzer">http://search.ebay.de/_W0QQfgtpZ1QQfrppZ200QQsassZbleisetzer</a></p>
      <p>Mh? If this posting is a commercial ad?<br>
      No, its just a social engagement, a charity project, alright?</p>
      <p>By the way... my opinion is, that every professional working in the pre-press industry should own some lead letters. How will you know where you go if you do not know where you are coming from?</p>
      <p>Georg</p>
