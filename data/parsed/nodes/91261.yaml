    <p>Hello everyone, this is my first post with typophile and I'm excited to be a part of the community.</p>
    <p>I've been asked to lead a redesign of a tabloid my company publishes weekly. The goal of the redesign is to celebrate the weekly's fifth year by helping it "grow up" a bit by applying a modern, mature design that still appeals to our 25-35 yr old demographic. I've been asked to have the design reflect the look of a magazine more than a newspaper, and so far I've decided that Acta Display will be our serif headline font (most likely predominantly in its Black weight). </p>
    <p>I was wondering if anyone might recommend a sans serif font that would pair nicely with Acta Display. So far we've looked at Neutraface No. 2 and Gotham, but we want to have a few more to choose from before we finalize the font. I'm specifically looking for a font that has some condensed options as well, but that's not absolutely necessary.</p>
    <p>Any suggestions would be amazing, thank you for your help!</p>
    <p>The link to Acta Display: <a href="http://dstype.com/typeface/acta-display" title="http://dstype.com/typeface/acta-display">http://dstype.com/typeface/acta-display</a></p>
