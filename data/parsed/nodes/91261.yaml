      <p>Not sure I can help you too much -- if it were me, I'd use Charis for the text -- is open source, and free. Charis will mix with Acto display better that either Minion or H&amp;FJ IMHO. It is not condensed, but is heavy enough that you can set it at a bit smaller size. It's the font I go to when I have to get a 3,000 character book page (hard to do with a 6x9 trim), for either the social sciences or contemporary information with a hint of formality, etc.</p>
      <p>"Chairs," BTW, is the open source version of Matthew Carter's "Charter." There is very little difference in the design. </p>
      <p>And take a good look at Lato (also open source and free) for the sans. Perhaps not as good for your purposes as Nick's types.</p>
      <p>However, both of these fonts need work to be first rate. I have reworked the Charis, and in principle would be happy to give it to you. It now has old-style numbers and formal small caps, fractions, true superiors -- all the things one needs for bookwork. And fairly good kerning.</p>
      <p>I haven't done as much with Lato yet, old style numbers for the regular &amp; italic, and small caps. No kerning beyond the release font yet.</p>
      <p>But we're talking "what ifs" before you even look. Lato is an original design, that does mix well with Charis.</p>
      <p><a href="http://www.latofonts.com/" title="http://www.latofonts.com/">http://www.latofonts.com/</a></p>
      <p>And another site from our own Typophile, though the italics have been improve from what's shown here -- some of the criticisms addressed:</p>
      <p><a href="http://typophile.com/node/77283" title="http://typophile.com/node/77283">http://typophile.com/node/77283</a></p>
