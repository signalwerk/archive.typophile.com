    html: |-
      <p>Yes, Charter was done by Matthew at Bitstream; Bitstream made the fonts public domain, but iiRC, they may not be called "Charter."</p>
      <p>As to the library, I'm just teasing you. I'm not sure the book would be worth whatever they're going to charge. Just like a lot of fonts...  As far as libraries go, my wife &amp; I give money to a couple libraries here. They're good things. </p>
      <p>I do get exasperated at font publishers who, after I've paid them for their work, try to prevent me from doing mine. You're not one who proscribes modification for one's own use, are you? Forcing someone to do the modifications in InDesign for each use rather than once with FontLab? That's one reason I like Open Source fonts.</p>
      <p>But I don't really have a penchant for free fonts, I've just gotten older, and gotten tired of beating my head against the wall. So many people -- including most of my customers at academic presses -- claim they don't have the budget to buy fonts.</p>
      <p>I have somewhat successfully pushed a few for-pay fonts, Sumner Stone's Cycles in the repro days, Christobal Henestrosa's Espinova Nova, and I'm going to give a try with Ross Mill's Huronia.</p>
      <p>I usually have to offer someone a free design to let me "try" the fonts; then sometimes the publisher's designers wind up liking them enough to buy them for other work -- if they can get it in the budget. Which means any other typesetter they use has to buy them too; maybe the the printer (depending on the license)  -- each press I can convince results in 2-3- more sales.</p>
      <p>Huronia is going to be hard. Not because the fonts aren't good, but the package is just expensive in terms of total dollars committed.</p>
      <p>I've said it before, but what I'd really like to see is a pretty cheap "use" fee coupled with a cheap initial purchase fee. Something like $10 to buy the font, and $5.00 more each time the font is used. That would seem cheap to the presses for bookwork. For the font designer, if a typical font is used for 5 books, they would get $35, about what they get now for an outright purchase, IF they can make the sale. Or whatever the money works out to in this inflated economy. But if you set it much higher, no one will take the risk. And the font customer should have the option to purchase unlimited use, on par with today's pricing -- for magazines, journals, newspapers...</p>
      <p>Well, no one wants to hear this.</p>
