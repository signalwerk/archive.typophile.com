    html: '<p> About the "functionality" bit: You might consider letter pairs/sequences which are frequent, not just ligation-candidates based on looks/structure. <br> <br>The 30 most frequent letter pairs in English are: <br>th he an in er re es on ea ti <br>at st en nd or to nt ed is ar <br>ou te of it ha se et al ri ng <br> <br>The 20 in German: <br>en er ch de ge ei ei in ne nd <br>be el te un st di no ue se au <br> <br>etc. <br> <br>hhp </p>'
