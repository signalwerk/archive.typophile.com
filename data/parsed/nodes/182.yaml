    html: <p>Peter and Hrant, those character  <br>combinations are a valuable bit of information.  <br>Thanks. <br> <br>Mrs Eaves and Classica seem to take two  <br>different approaches. Mrs Eaves tends to  <br>connect characters while Classica likes to  <br>share strokes... (I'm speaking in broad  <br>generalities). Does the sharing of strokes  <br>help or hinder readability? That lowercase "ir"  <br>combo seems like a stretch. <br> <br>Mrs Eaves <br><img src="http://www.typophile.com/forums/messages/4100/522.gif" alt="Mrs Eaves ligature"> <br> <br>Classica <br><img src="http://www.typophile.com/forums/messages/4100/523.gif" alt="Classica"> <br> <br> <br>//joe</p>
