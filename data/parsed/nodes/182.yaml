    html: "<p> Joe, Mrs Eaves has some great ligs, but don't make the same mistake of going overboard: avoid monstrosities like that italic \"py\" at all costs... <br> <br>Classica is a supreme example of how to do it, and I'd also mention Carter's Mantinia. <br> <br>BTW, when directed properly, the design/use of ligs can also improve functionality, not just aesthetics. <br> <br>hhp </p>"
