    html: '<p> There are some letter combinations that are more common in the swedish language, like: <br> <br>sk <br>sch <br>ch  <br>sj <br>fj <br>ck <br>tj <br>tt <br>gg <br>ll <br>nn <br>tt <br>pp <br>mm <br> <br>and probably more... <br> <br>also I would imagine in <br>finnish = kk <br>dutch = oo <br> <br> <br>Is there similar combinations in other languages <br>that never or seldom appear in "english/american" ligature sets? <br> <br>/peter </p>'
