    html: "<p> OK, what if we start with this?: <br> <br>The 100 most frequent words in English: <br> <br>the of and to a in that is was he for it with as his on be at by I this had not are but from or have an they which one you were her all she there would their we him been has when who will more no if out so said what up its about into than them can only other new some could time these two may then do first any my now such like our over man me even most made after also did many before must through back years where much your way well down <br> <br>Source: \"Computational analysis of present-day American English\", by Kucera and Francis, 1967. <br>Note: This is a \"standard text\" referred to by other linguistic analyses, like \"Word frequencies in British and American English\", Hofland and Johansson, 1982 - a very interesting comparative work. <br> <br>And here's my offer: <br>For a given week where anybody else adds something, I'll add something else the following Monday. And if we don't want to limit this to \"hard\" data, we can just let people submit anything (like Peter's [assumedly] informal list), as long as declaring the \"source\" is taken seriously. <br> <br>hhp </p>"
