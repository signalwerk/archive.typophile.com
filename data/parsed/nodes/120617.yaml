    <p>Hi everybody! Signature Type Foundry is happy to announce the release of several new typefaces: Aktion, Clara Sans<br>
    Clara Serif, Corridor, Fenomen Sans, Galaxy, Haven, Meridianus Sans, Meridianus Serif, Quodlibet Sans and Quodlibet Serif. We would be very pleased if you checked out our website: <a href="//www.signaturetype.cz" rel="nofollow">signaturetype.cz</a>.<br>
    All attached pictures are from our exhibition at 26th International Biennial of Graphic Design Brno 2014.</p>
    <p>Thanks!<br>
    Tomas Nedoma</p>
