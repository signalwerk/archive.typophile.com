    html: <p>My obsession with architecture has me associating sans serif more with architecture. A good architect deals with everything. They create the skeleton as well as the skin it supports. STRUCTURE BALANCE   <br>  <br>It could be me and it probably is, but I'm completely obsessed right now with  everything <a href="http://www.gingkopress.com/_cata/ima1/housc-i.htm" target="_blank"> severely modern</a>. (specifically image 3) All that can be found/read in <i>Dwell</i> magazine.   <br>  <br>However if your firm is not so rigid and/or experimental then you could choose a softer sans. Anisette Petite caps for instance.  <br>  <br>But, definitely not a book publishers face.</p>
