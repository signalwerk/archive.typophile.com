    html: <p>It's conservative, if that's the impression the client wants to project. It is closer to what I might expect from a law firm. <br> <br>Architecture is an interesting field to design for (I made some signage for an architect who had her office next to Tiro for several years). On the one hand, architects need to project competence and reliability -- to reassure people that their buildings will stand up --, which suggests a conservative treatment, but on the other hand they need to be seen as creative and innovative. <br> <br>What kind of architecture does this firm practice? If it is mainly domestic, the appropriate design might be quite different from that for a firm that specialises in offices or commercial properties. Do they favour particular construction techniques or materials? <br> <br>Whatever the answer to these questions, I suspect that Minion is a poor choice of typeface. I would look for something less common and with more presence. Minion is not a bad text typeface (although it is overused), but it has too little character for a logo. Andy Crewdson memorably called Minion 'the typeface without qualities'. <br> <br>Personally, I would be tempted to deconstruct the fleuron. You could render it as an outline, in pencil, as an architectural plan, perhaps including some guidelines or measurement lines. You could even get a bit cubist, and try to combined a plan and elliptical projection of the fleuron into a single image. Lots of possibilities.</p>
