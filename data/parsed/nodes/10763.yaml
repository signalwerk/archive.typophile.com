  html: "<p>I've been working on a logo for a friend's small architectural firm... only I haven't been doing much. All I've done is set their name in a typeface that I thought they'd like... is that common? I feel like I'm getting off really easy on this one, but, the examples of logos they showed me all looked like they'd been done the same way. Here it is : <br> <br><img src=\"http://www.typophile.com/forums/messages/29/7737.gif\" alt=\"\"> <br> <br>So, there you have it. Your thoughts/comments are welcome.</p>"
