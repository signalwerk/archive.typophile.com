      <p>I suspect the /S would look a lot better if its spine were diagonal rather than horizontal in the middle.</p>
      <p>There's a lot of variation between letter widths — /C strikes me as particularly wide, /N particularly narrow, for example. Could be intentional, though, for all I know.</p>
