    <p>Hi,</p>
    <p>I am a student that's rather new to this whole field of typography,<br>
    and is in the midst of doing a thin magazine/booklet.</p>
    <p>I adore Australia's Frankie magazine and the body type they use,<br>
    if I am not wrong it's EF DIN 1451 Mittel Alt?<br>
    <a href="http://www.fonts.com/findfonts/detail.htm?pid=403648" title="http://www.fonts.com/findfonts/detail.htm?pid=403648">http://www.fonts.com/findfonts/detail.htm?pid=403648</a>  </p>
    <p>I'm hoping to get some advice on similar typeface,<br>
    or something that is sans serif, rounded and looks friendly and not overly corporate.</p>
    <p>It will be very helpful if it is... free type or doesn't burn too much from my measly allowance. Please advise!</p>
