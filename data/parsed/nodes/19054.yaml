    html: <p>According to Adam Twardoch’s <a href="http://www.twardoch.com/download/polishhowto/kropka.html">diacritics howto</a>, I think it should be called “kropka”. I know that’s technically the name of the polish diacritic, but typographically it’s exactly the same as the dot on the i, so why not?</p>
