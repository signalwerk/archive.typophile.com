      <p>Although what Paul says sounds familiar, looks like OED agrees with Si (see 1b):</p>
      <p><strong>tittle, <em>n.</em></strong><br>
       <strong>1.</strong> A small stroke or point in writing or printing.    <strong>a.</strong> Orig. rendering L. <em>apex</em> ‘point, tip’, applied in classical L. to any minute point or part of a letter, also to the mark over a long vowel, as <em>á</em>, later also to a line indicating an abbreviation. More recently applied also to the Spanish <em>tilde</em> or circumflex over <em>ñ</em>, formerly to the cedilla under <em>ç</em>. By extension, any stroke or tick with a pen.<br>
        <strong>b.</strong> The dot over the letter <em>i</em>; a punctuation mark; a diacritic point over a letter; any one of the Hebrew and Arabic vowel-points and accents; also, a pip on dice.<br>
        <strong>†c.</strong> A name for the (usually) three dots, following the letters and contractions, in the alphabet on horn-books, where it is usually followed by <em>Est Amen</em>; so that <strong><em>tittle est Amen</em></strong> came to be used for ‘the end or conclusion’. <em>Obs.</em></p>
      <p>etc...</p>
      <p>________________________________<br>
      Ever since I chose to block pop-ups, my toaster’s stopped working.</p>
