    <p>Hello everybody, i'm a graphic designer and illustrator from Italy. It's my first post here, I hope this is the right section for this request...</p>
    <p>I'm looking for a font made like this, without any success.</p>
    <p>Obviously the flickering line is only due to my sketching, it should be precise and geometric instead, with monoweighted line, vertical proportions and straight vertical lines. Somewhere between DIN, Vitesse, Stratum, Isonorm and Geogrotesque... these at least are the most similar ones i found in these months. Lower case and different weights are welcome.<br>
    I could draw it by myself, but i would take too long for a decent result, so I ask if there are similar fonts, I think i saw it somewhere but can't find it now.</p>
    <p>Any advice?</p>
    <p>Thanks :)</p>
    <p>Gabriele</p>
