    <p>This inlay is a take on Woody Guthrie's "This Machine Kills Fascists." Here is the mother of pearl before we set it in the guitar:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/woody2_6579.jpg"></div><p></p>
    <p>More pictures and a story about the construction can be found on my <a href="http://www.alembic.com/info/fc_woody.html" rel="nofollow">website</a>. We used Storm's Solpera as the basis. Even though the single line engraving didn't exactly mimic his design, I quite think the character of the font was preserved.</p>
