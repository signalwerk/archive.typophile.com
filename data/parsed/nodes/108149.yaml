    <p>I take the pleasure to announce my latest releases, <a class="freelinking external" href="http://www.myfonts.com/fonts/andreas-stotzner/grund/" rel="nofollow">Grund</a>, another art deco exercise; and <a class="freelinking external" href="http://www.myfonts.com/fonts/andreas-stotzner/leipziger-ornamente/" rel="nofollow">Leipziger Ornamente</a>, which I adapted from architectural ornaments mostly.<br>
