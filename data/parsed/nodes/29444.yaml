    <p>Hi guys,</p>
    <p>a new typeface in process... Tex is a modular way to texture blackletters and pretends to be a display type. Until now, only have the lowercases, no kerns adjustments and  no sure about the "s” and “K” :-) ... </p>
    <p>Your comments are always welcome</p>
    <p>Cheers</p>
    <p>e.</p>
