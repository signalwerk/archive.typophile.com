    html: |-
      <p>Paul and Dan, Thaks for the support. </p>
      <p>Dan, yes you thought really make sense, this movements tends to make the type looks like a litle bit unstable in words with more than one letters "o", "e" and "c" and its not quite agree with the textura’s stability... </p>
      <p>Otherwise, I do not intend to make it totally squared and horizontal... a bit more stability it's will be welcome, but not the same as we have in the classical texturas. I think that's little dynamic movement could make it more accurate with the modern display proposes. But you are totally right Dan! Tanks for the advices. I'll keep it in the process.</p>
      <p>Until there, I made some modifications at the character "k" (look at the list above) what do you think guys?</p>
      <p>Tanks, guys and keep the coments</p>
      <p>e.</p>
