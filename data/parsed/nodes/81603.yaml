      <p>I did not get the website address from the first line at all. I assumed that it's a name of the company followed by some sort of "Inc." or "Corp." or "LLC" abbreviation.</p>
      <p>With regards to the kerning - it seems OK, perhaps TA is a smudge too loose if I were to nitpick.</p>
      <p>Leading-wise I think the lines need to be spaced further apart. This is evident from the smaller scale shot, it looks somewhat cluttered. Also, I'd push the right edge of the second line a bit to the left, because right now 'u' appears to be sticking beyond L due to all that empty space in latter.</p>
    html_clean: |-
      <p>I did not get the website address from the first line at all. I assumed that it's a name of the company followed by some sort of "Inc." or "Corp." or "LLC" abbreviation.</p>
      <p>With regards to the kerning - it seems OK, perhaps TA is a smudge too loose if I were to nitpick.</p>
      <p>Leading-wise I think the lines need to be spaced further apart. This is evident from the smaller scale shot, it looks somewhat cluttered. Also, I'd push the right edge of the second line a bit to the left, because right now 'u' appears to be sticking beyond L due to all that empty space in latter.</p>
