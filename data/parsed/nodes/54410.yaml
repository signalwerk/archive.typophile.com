  html: |-
    <p>After almost 4 years, I’ really pleased to annouce the release of the Migration Sans typeface. </p>
    <p>This project start in may 2005: <a href="http://typophile.com/node/12592" title="http://typophile.com/node/12592">http://typophile.com/node/12592</a> As it is my first typeface you will probably understand why I’m so excited. I did’nt know where the projet would go when I started it, but now it’s a real typeface and I want to tell my gratitude to all typophile members who gave me their comments or advices all along the process.</p>
    <p>Special thanks to Hrant, Chris, Mark and Nick on Typophile and also Xavier Dupré and Ian Party on Typographe.</p>
    <p>I also want to thanks Allan Haley and Jim Wasco from Monotype Imaging for their great support.</p>
    <p>You will find Migration at Monotype<br>
    <a href="http://www.fonts.com/findfonts/SearchPage.htm?kid=migration" title="http://www.fonts.com/findfonts/SearchPage.htm?kid=migration">http://www.fonts.com/findfonts/SearchPage.htm?kid=migration</a><br>
    <a href="http://www.itcfonts.com" title="http://www.itcfonts.com">http://www.itcfonts.com</a><br>
    <a href="http://www.itcfonts.com/Fonts/NewFonts/2009/MigrationSans.htm" title="http://www.itcfonts.com/Fonts/NewFonts/2009/MigrationSans.htm">http://www.itcfonts.com/Fonts/NewFonts/2009/MigrationSans.htm</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/MigrationSans_3868.gif"></div><p></p>
    <p>For those who would like to see more, I insert a character set.</p>
