    votes: null
    html: |-
      <p>_Eau Cologne_ and _Saigon-Hanoi_ are not the same design. Note for example the different _N_. For a striped font with the _N_ in _Eau Cologne_, you can use Archive Copperplate Head  </p><div class="imageWrap"><img src="http://typophile.com/files/ArchiveCopperplateHeadInUse_5607.gif"></div> <a href="http://www.myfonts.com/fonts/archivetype/archive-copperplate-head/" title="http://www.myfonts.com/fonts/archivetype/archive-copperplate-head/">http://www.myfonts.com/fonts/archivetype/archive-copperplate-head/</a> which is an accurate, but indifferent quality, digital rendition of Hermann Ihlenburg's Copperplate from the 19th century. Change the convex inner curve on the terminal serifs for _E_, _L_, _C_, and _G_ to a concave inner curve by blanking out the unwanted part, and you have a fair match to _Eau Cologne_ .<br>
      Don<p></p>
