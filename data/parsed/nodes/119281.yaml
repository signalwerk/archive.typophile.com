  - id: 587664
    user: 205259
    date: 2014-09-07T16:05:00
    date_raw: 7 Sep 2014 — 4:05pm
    votes: null
    html: |-
      <p>Kevin has done a good job rounding up what's available in digital format.<br>
      About the only part remaining is _DE_. You can match it with Filmotype Royal <a href="https://www.myfonts.com/fonts/filmotype/royal/" title="https://www.myfonts.com/fonts/filmotype/royal/">https://www.myfonts.com/fonts/filmotype/royal/</a><br>
      But you should know that the label is not composed of old time fonts as such. Rather it is hand lettering, probably by using lithography.<br>
      For good quality original historic fonts, at no charge you can go through the fonts at <a href="http://abfonts.freehostia.com/" title="http://abfonts.freehostia.com/">http://abfonts.freehostia.com/</a> go to the authors page. Check in particular Character, Claude Pelletier, Toto.</p>
      <p>Don</p>
