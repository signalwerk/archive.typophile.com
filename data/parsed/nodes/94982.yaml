    html: |-
      <p>Two days, a lot of cigarettes and coffee later... finally found a solution!</p>
      <p>@Fore:<br>
      Mac may ignore the hinting, but renders quality can still be controlled!<br>
      The fussiness/sharpness of the text, seems to be related to the Vertical Metrics, as Mekkablue suggested, and the vertical BBox.</p>
      <p>Playing around with the vertical metrics was the solution! Also, a little bit of blue values tweaking, as Mekkablue suggested in the TypeDrawers forum</p>
      <p>This is how awesome it looks now (compare to the image in the first post):<br>
      <img src="http://f.cl.ly/items/0U2z3t152F1b3z0r1b30/zoomed%20overshoots.png"></p>
      <p>It makes all the difference in text sizes.<br>
      <img src="http://f.cl.ly/items/3g213L202f1V423W2I03/sampletext.png"><br>
      Now it renders as good as the Webtype RE series, or the new H&amp;FJ SmartScreen new fonts.<br>
      And maybe even better at 10px (Keep in mind that I only fixed the vertical metrics, there are still room to tweak the horizontal metrics and stem widths).</p>
