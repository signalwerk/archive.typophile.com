    <p>I'm cant find a solution to this little problem:<br>
    <img src="http://f.cl.ly/items/353d3y230w0o0S2F3k14/Screen%20shot%202012-07-24%20at%2002.29.58.png"></p>
    <p>If you look closely, will see that at 14 and 16pts there seems to be grayscale pixels under the /n serifs. How can I remove it, so it looks like the ones at 15, 17 and 18pts? (Firefox/Mac)</p>
    <p>The blue lines are already in place, like this:<br>
    <img src="http://f.cl.ly/items/0m2x2E23243w0J1p3A1y/Screen%20shot%202012-07-24%20at%2002.43.46.png"><br>
    However, the problem remains.<br>
    I spend all day experimenting, hinting, un-hinting, tweaking blue values, looking at pixels, etc... and wasn't able to find a solution. Nothing seems to make any difference.</p>
    <p>The greyscale pixels below the /o are OK, but not the ones below the /n, /i, /l, etc...</p>
