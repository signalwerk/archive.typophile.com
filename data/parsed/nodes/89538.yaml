      <p>The italic subhead is a Century of some kind -- I looked at Century Schoolbook, Oldstyle, Expanded and ITC Century but didn't find an exact match, although all of them are reasonably close.</p>
      <p>Harrowsmith is American Typewriter Bold Condensed<br>
      <a href="http://new.myfonts.com/fonts/adobe/itc-american-typewriter/" title="http://new.myfonts.com/fonts/adobe/itc-american-typewriter/">http://new.myfonts.com/fonts/adobe/itc-american-typewriter/</a></p>
      <p>Modesto, from Jim Parkinson, will get you close to READER<br>
      <a href="http://typedesign.com/fonts/modfam.html" title="http://typedesign.com/fonts/modfam.html">http://typedesign.com/fonts/modfam.html</a></p>
