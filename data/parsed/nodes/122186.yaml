      <p>&gt; 13 people and all of them had the same<br>
      &gt; importance when choosing the logo</p>
      <p>It's much better when you have one decision maker. I've done a few design projects for committees and it's difficult because you can't please everyone. </p>
      <p>If you want a script look, I'd see if the font has an alternate letter E so they both don't look the same. Or have a skilled calligrapher create it. And I don't have any problem with T being the center of attention, but to me the G looks rather weak. </p>
      <p>Also when the logo is small, Nucleo De Artes will become very tiny. I'd either find a way to make it bigger, or prepare an alternate version for tiny sizes.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/logo_4908.jpg"></div><p></p>
