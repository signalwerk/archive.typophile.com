      <p>I'd love to know if there is an automated method, too. When I do a type treatment like this, I set each line to full justify and stop resizing when the line's spacing seems about right. Of course, this can produce slightly irregular spacing if you're not careful.</p>
      <p>Someone could probably write a script for InDesign to do this automatically, but I doubt there's one floating around out there. You can check the <a href="http://indesignsecrets.com/resources/plug-ins-and-scripts" rel="nofollow">InDesign Secrets</a> scripts page if you want to look for one.</p>
