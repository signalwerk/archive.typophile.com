      <p>1) You can convert-to-outlines then do real-time scaling.<br>
      2) There's this ancient Chinese trick. It's called math. :-&gt; Set the line at a large point size, measure its length (x), determine the desired line-length (y), then multiply the original point size by y/x.</p>
      <p>hhp</p>
