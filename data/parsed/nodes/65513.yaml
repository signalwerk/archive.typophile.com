    html: |-
      <p>Maths don't help with optical margin adjustment tho (and neither does InDesign, really).<br>
      If full justification makes optically bad L/R margins (especially when you have massive differences in point size), it can be a good idea to make the text box slightly too wide, <em>centering</em> the type, and finetuning the sizing. (Don't forget to put guidelines where the optical margin should be.)<br>
      And if you need to finetune the left margin, insert a thin space before the first character and kern against that.<br>
      Takes time! :)</p>
