    html: <p>&gt;Sometimes I feel like i'm talking to myself in here!&lt; <br>I have felt that way too at times when I posted a sans font for a crit but I soon realized that sometimes it takes people a while. <br> <br>The only problem you will have printing your font is that you have to be sure to allow enough leading so that you don't overlap other things.  Since this is a display font, that should be easy to accomplish.  Diacritics in text fonts on the capitals are often above type height and they print but more leading is often needed in CE languages where there are lots of diacritics. <br> <br>ChrisL</p>
    html_clean: <p>&gt;Sometimes I feel like i'm talking to myself in here!&lt; <br>I have felt that way too at times when I posted a sans font for a crit but I soon realized that sometimes it takes people a while. <br> <br>The only problem you will have printing your font is that you have to be sure to allow enough leading so that you don't overlap other things.  Since this is a display font, that should be easy to accomplish.  Diacritics in text fonts on the capitals are often above type height and they print but more leading is often needed in CE languages where there are lots of diacritics. <br> <br>ChrisL</p>
