    date: 2004-10-02T09:13:00
    date_raw: 2 Oct 2004 — 9:13am
    votes: null
    html: <p>I should add, I was making a very literal reading of your <br>question Paul. If you were to set your ascent/descent as <br>the lines show, one would then assume the cap height <br>is 1000 with the swash caps shooting over/under? <br>This would be bad.  <br> <br>When in doubt, be conservative with this stuff. I like <br>to keep my cap height between 666 and 714. Usually 666 <br>because it splits evenly and gives a nod to the beast, if <br>you know what I mean. Then you can set your ascent <br>at something like 750 and the descent at 250. This is <br>of course assuming you have a rather standard design.</p>
