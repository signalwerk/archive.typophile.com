    html: "<p>No, i meant ascent &amp; descent. These swash letters (Y &amp; R) are to be used sparingly and the rest of the letters you see in this example are the actual caps. The lowercase is morticed and the descenders and ascenders of the lc don't reach above/below the bounds i've set in the above illustration. Since the Swash caps are meant to be used sparingly (in one line settings), i thought that it would be silly to set the ascent/descent on these letters unless it would cause some cataclysmic problems like chopping off whatever lies above/below the boundaries that i've set in the above example. <br> <br>I guess that should have been the original question: if i set the ascent/descent as shown above will the regions outside this bounding area still print?</p>"
