    html: <p>I'm not sure what the red lines are. <br>I can assume they're the "normal" baseline and capheight, and I guess you're worried about going too far down/up with the bigger caps. Certainly with the descenders there shouldn't be a problem, and even with the ascenders you should be safe, although once you add the accents on the big caps you'll really be going way up. My guess is that <i>some</i> apps will truncate the tops at some point, but not the ones that really matter. <br> <br>Do some testing. <br> <br>hhp</p>
