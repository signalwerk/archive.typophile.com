    html: |-
      <p>I'd say "STRATOCASTER" is Futura, not Century Gothic. "MADE IN MEXICO" is too small for me to tell if it's Helvetica, Arial, or otherwise. Same with "SERIAL NUMBER".</p>
      <p>"MZ6" looks like Times New Roman.</p>
      <p>"162748" is very similar to PSY/OPS' Crash Numbering.</p>
      <p>"Fender" is obviously custom-drawn.</p>
      <p> - Lex</p>
