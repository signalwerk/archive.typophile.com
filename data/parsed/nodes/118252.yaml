      <p>This is one of the directions I am exploring:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Mera_3514.jpg"></div><p></p>
      <p>I'm using the crossbarless "A's" for both simplifying the logo and as subtle upward arrows. The client likes the double meaning in Mera, referring to the name of the owner but also close to the German word "mehr", meaning more. It's part of their brand to focus on unique yachts, making a difference, rather than simply aiming for the largest or most profitable projects. Yachts with more added-value (in terms of authenticity, identity) as a vision.</p>
      <p>The problem is that this still looks random to me. Both "A's" are close, yet part of different words. The "Y" seems lost, and so far doesn't align with the second "A".</p>
      <p>However, I think there is an opportunity in the sequence A-Y-A to get a consistent overall impression, while not compromising readability.</p>
      <p>What do you think? Throw the crossbarless story away, and move in another direction?</p>
