      <p>Keep in mind that a logo is important but is just one piece of the puzzle. It's the total look of your marketing that will create impressions with the public — your stationery, advertising, brochures, website, etc.</p>
      <p>&gt; what's trendy is trying to be timeless.</p>
      <p>Hrant maybe I'm misunderstanding you, but trendy and timeless are very different. </p>
      <p>Trendy is conforming to current fads &amp; styles; a look that's fashionable now but will look outdated soon. Trendy is used a lot in marketing, and sometimes in logos if the company is willing to update their logo periodically.</p>
      <p>Timeless is a look (generally very simple, for example the "Dior" logo) that's not trendy but will have style and be usable for many years.</p>
