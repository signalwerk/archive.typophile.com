      <p>Assuming you want to stick with the basic design you have, I'd suggest looking for a subtle way to make it more readable. Maybe make the M and Y a bit larger, or bolder, or a slight space between words, or one word in serif and one in sans, or whatever.</p>
      <p>Long logos like that are occasionally awkward when they must fit in a narrow space (a small web ad, for instance) because the the type becomes very small. Make a postage-stamp size print and see what happens.</p>
      <p>And asking us if it's readable isn't a real test since you tell us it contains "yachts". Show it to a bunch of people (individually) without any explanation at all and ask them to read it.</p>
