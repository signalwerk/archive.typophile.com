      <p>Interesting discussion... I agree the urge to be timeless can be considered trendy. Most of us would enjoy conceiving something that will last for generations. To me, though, timeless design (if unique) is a great quality. Something generic could maybe be timeless, but timeless isn't per se generic (in the sense of bland).<br>
      Timeless boils down to essence, stripping the design of whatever is pure ornament. Like Farnsworth House or a 250GTO.</p>
      <p>There's some subjectivity here. If you'd wear a tailored suit by Caraceni, some would say you look like a boring business guy. Others, who look past the ubiquitous grey or navy blue colour, and notice the quality of the cut and fabric, would bet you fly private. </p>
      <p>I agree, JamesM, that a great logo shouldn't necessarily express the product it represents. It should give it a stronger identity though. And, it's a fact, hrant, that some logos surf the success of the product. I find this very interesting. It's like wearing jeans, T-shirt and a 3-day stubble, like you don't care, but the world is hanging on your every word. Consider the logo of OMA (<a class="freelinking external" href="http://www.oma.eu/" rel="nofollow">http://www.oma.eu/</a>). These guys are a global architecture firm, building high-rise from NYC to Hong Kong. Their logo is "just" plain arial. I like that sense of understatement. Or Herzog &amp; de Meuron, they don't even bother about a logo!</p>
      <p>So, then, what are remarkable and timeless logos in your opinion?</p>
