      <p>Hi Jean Louis. In thread <a href="http://typophile.com/node/118544" title="http://typophile.com/node/118544">http://typophile.com/node/118544</a> you asked me to comment on this. I take it you mean the lettering overlapping the prow of a sailboat.<br>
