      <p>Jean Louis, in your other thread I wrote "I think if the crossbar is going to be removed it should be done for a valid reason, and not because the designer didn't have any better ideas." Looking at the version above, my impression is that you didn't have any better ideas. Ironic that you've tried to evoke the notion of "mehr" by <em>removing</em> elements. However, only the A has been modified; the rest are unchanged. Therefore, the modified A feels arbitrary. If you intend to simplify, you should probably simplify all the letters as much as possible. That might mean using a different typeface.</p>
      <p>The larger problem, I think, is that you're trying to substitute simplicity for a solid concept. You seem to be designing backward, holding up letterforms and asking "What does this make you think of?" Figure out what concept you want to communicate, be it "mehr" or "prow" or "mainsail" or whatever, and then design a logo that illustrates it.</p>
