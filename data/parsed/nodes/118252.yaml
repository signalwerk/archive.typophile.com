      <p>&gt; Most of us would enjoy conceiving something<br>
      &gt; that will last for generations. </p>
      <p>True, but most graphic design is ephemeral (has a short life). </p>
      <p>One of my college design professors used to show a waste basket and say that's where most of your work will end up because graphic designers create things to serve a particular purpose in a particular time.  </p>
      <p>Brochures are read and discarded. Logos are changed. Very different from a fine art painter who would be horrified if one of his paintings is thrown away.</p>
      <p>Of course there are graphic design items that are admired for many years, but a logo from the 1970s may be admired today but probably isn't still usable in its original form. Any logo you create today will be changed eventually. If you want your work to last generations, be an artist not a graphic designer.</p>
