      <p>@all: Thank you for your comments and suggestions! </p>
      <p>Reconsidering: If the concept was to communicate "sailing yachts" or "mainsail", then yes, the crossbarless "A" or delta could have been a solution. However, I must say Captain Howdy has a point: As of now, the "A's"still look random.</p>
      <p>While yachts are Mera's business, their identity isn't just about yachts (sail or motor). They believe "luxury" (if the word still has a meaning today), be it a car, a house or a yacht, should be authentic, unique and memorable. It should reflect individuality, instead of the "old-world" pompous status symbols. As James Goldstein once said: "People ask me all the time, "how big is your house"? As though that's the criterion for making it special." This is quite common in yachting as well, were people seem obsessed with the top10 largest yachts. The client, however, believes in substance above size. For them it's "Mera", instead of just "mega". They are very candid about this. </p>
      <p>So, the logo concept is: Authentic, contemporary, clean, (bold yet) subtle, innovative, effortless. I like the idea of using a font that can be used on the website and communication material as well, for more overall consistency. For that reason, I started exploring possibilities with Brandon-Gotham-Proxima. These are clean, open, welcoming, and still professional. Ideally I wouldn't customize the font too much, and let it "speak for itself". But let's be honest, unless you are a brand like, say, Bang &amp; Olufsen (uses Frutiger), where the name alone already triggers emotion, it's a quest to get to "that" font that says it all..</p>
