      <p>Much improved! I still think 'b' looks too wide next to the 'd', so you should try equalizing the apparent size of the two. With the new 'o', the 'd' is the one that looks rather narrow.</p>
      <p>By the weight distribution, I mean an overall plan for which strokes would be thicker than which strokes. In the final paragraph of <a href="http://typophile.com/files/ff%20-%20legato_about.pdf" rel="nofollow">this PDF about FF Legato</a>, different stroke weight distribution models for Univers, FF Balance, and FF Legato are compared, with an accompanying picture.</p>
