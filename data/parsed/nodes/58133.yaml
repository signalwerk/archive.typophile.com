    <p>Well I have been frequenting this site for quite some time now, and I figured that it was about time for me to attempt my own font. So here goes nothing... this is really my first attempt ever at designing a typeface and I'm sure that these characters are riddled with beginners' mistakes. I would appreciate any comments you can give: complements, criticism, and/or anything in between.</p>
    <p>Tentatively the name is "Abodwo", a word meaning 'peace' in Twi [assuming that my friend didn't lie to me]. It is still in the rudimentary stages of design and I have only posted the glyphs that I am somewhat-okay with.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/abodwo_6718.jpg"></div><p></p>
    <p>Currently I am especially unhappy with the <strong>e</strong> and the <strong>f</strong>, but if you see any others that just scream "FIX ME NOWWW!", let me know. I'll be working on this whenever I have a spare moment between my final examinations, so hopefully it won't take too long for me to make corrections... but no promises!</p>
