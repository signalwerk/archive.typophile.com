      <p>This has promise!</p>
      <p>In addition to what Craig pointed out...</p>
      <p>The bowl of the 'b' looks too wide towards the bottom.<br>
      The stroke weights need adjusting. The straight stems are maybe a touch too thin compared to the curved strokes of the bowls of 'a', 'd', etc. The 'g' looks too heavy. 'o' looks a bit light compared to the bowls. The middle stroke of 'e' could stand thinning.<br>
      Conventionally, between the inner diagonals of 'w', the right stroke should be heavier than the left.</p>
      <p>You might want to think about an overall plan of distributing weight on your strokes; letters like 's' suggest emphasizing the horizontals near the baseline and the x-height. Take a look at <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_balance_1/" rel="nofollow">FF Balance</a> to see what I mean.</p>
      <p>Keep up the good work!</p>
