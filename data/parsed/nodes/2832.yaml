      <p>The post resource version 3 doesn't have glyph names; I think I'll stick with ttx (I'm using the latest from CVS). <br> <br>There was one additional hurdle: Panther ignores the OpenType kerning information when AAT information is present. <br> <br>To fix this, I simply add a 'kern' table to the font which FontLab conveniently generates when it saves a PC TrueType font. <br> <br>1) In FontLab, save font as PC ttf AND CFF-otf <br> <br>2) Run magic script: <br></p>
      <pre> <br>#!/bin/sh <br>NAME=MyFont <br> <br>ttx -t kern $NAME.ttf <br>sed -e 's/ttFont sfntVersion=\"\x00\x01\x00\x00\"/ttFont sfntVersion=\"OTTO\"/'  &lt;$name.ttx&gt; $NAME.kern <br>rm $NAME.ttx <br> <br>mv $NAME.otf $NAME.otf.fl <br>ttx -m $NAME.otf.fl $NAME.kern <br>rm $NAME.kern <br> <br>echo "Adding 'morx'  table..." <br>ftxenhancer -m $NAME.mif $NAME.otf <br> <br>echo "*** BUILD COMPLETE ***" <br></pre><p> <br>3) Trash the PC ttf. <br> <br>Robert</p>
    html_clean: |-
