    html: "<p>FontLab (4.6, Mac) just did it, it didn't ask (I've only used the program for a couple of hours and I'm still somewhat mystified by its functionality). <br> <br>I use File-&gt;Generate Font-&gt;OpenType-CFF. The display next to the Options box says: \"Type 1 options: make PFM, make AFM; Unicode encoding; TT/OTF options: hinted (keep, autohint, visual); export Unicode; <br>I think that these options aren't relevant when writing OT/CFF. <br> <br>See picture for the FontLab OpenType preferences dialog. <br> <br>Robert <br> <br><img src=\"http://www.typophile.com/forums/messages/4101/24893.gif\" alt=\"OT preferences\"></p>"
    html_clean: "<p>FontLab (4.6, Mac) just did it, it didn't ask (I've only used the program for a couple of hours and I'm still somewhat mystified by its functionality). <br> <br>I use File-&gt;Generate Font-&gt;OpenType-CFF. The display next to the Options box says: \"Type 1 options: make PFM, make AFM; Unicode encoding; TT/OTF options: hinted (keep, autohint, visual); export Unicode; <br>I think that these options aren't relevant when writing OT/CFF. <br> <br>See picture for the FontLab OpenType preferences dialog. <br> <br>Robert <br> <br><img src=\"http://www.typophile.com/forums/messages/4101/24893.gif\" alt=\"OT preferences\"></p>"
