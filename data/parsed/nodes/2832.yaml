      <p>I've since found a very inconvenient answer to #1. But it works and it could be automated (anyone?). <br> <br>1) Use TTX 2.0b1 <a href="http://sourceforge.net/projects/fonttools/" target="_blank">http://sourceforge.net/projects/fonttools/</a> to dump the original OpenType font. The resulting .ttx file will have &lt;glyphorder&gt; at the top which maps GlyphIDs to names. Get the IDs for the glyphs that will be substituted. <br> <br>2) Create a "mif" file with the following contents (the list is the substitution list) <br></p>
      <pre> <br>Type          Noncontextual <br>Name          Character Alternates <br>Namecode      17 <br>Setting       No Alternates <br>Settingcode   0 <br>Default       yes <br>Orientation   HV <br>Forward       yes <br>Exclusive     yes <br> <br>Type          Noncontextual <br>Name          Character Alternates <br>Namecode      17 <br>Setting       Alternates <br>Settingcode   1 <br>Default       no <br>Orientation   HV <br>Forward       yes <br>Exclusive     yes <br> <br>        10      58 <br>        11      63 <br>        12      57 <br>        13      66 <br>        14      61 <br>        15      60 <br>        16      65 <br>        17      64 <br>        18      59 <br>        19      62 <br></pre><p> <br>Unfortunately, I haven't fgured out a way to use my fancy names ("zero.2") instead of the GlyphIDs which might change when messing around with the font too much in FontLab. <br> <br>3) Run ftxenhancer -m miffile myfont.otf <br>(Apple font tools, <a href="http://developer.apple.com/fonts/" target="_blank">http://developer.apple.com/fonts/</a>) <br> <br>The resulting CFF OpenType file will work in AAT aware applications as well as in OpenType applications.</p>
