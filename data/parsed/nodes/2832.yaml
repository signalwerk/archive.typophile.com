wing is the example from the Adobe web site. I removed the sizemenunames. <br>feature size { <br>parameters 100  # design size (decipoints) <br>3  # subfamily identifier <br>80  # range start (exclusive, decipoints) <br>139; # range end (inclusive, decipoints) <br>} size; <br> <br> <br>Thanks for your time! <br>Robert</p>"
