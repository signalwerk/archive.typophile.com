    html: |-
      <p>The obscure fellow typophile might not have meant one particular letter which all the others stemming from. I guess, he was rather talking about “when you see one letter you can reconstruct the whole alphabet”.<br>
      I’ve never tried myself but it might be some kind of typophile sportsmanship to spot just one (or five or seven …) letters af a typeface on any artefact – and go designing the whole alphabet.</p>
      <p>Could be a nice competitive exercise, actually.</p>
