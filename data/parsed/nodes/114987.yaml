    html: |-
      <p>Lettering. The only font I know of that comes anywhere close to the big drop swoosh S is Vulpa, which has it as an alternate italic  S. It also has an italic swash D as an alternate. Here they are together with the regular lower case </p><div class="imageWrap"><img src="http://typophile.com/files/VulpaItalicSwashRegLCreducedscale_4435.jpg"></div><br>
      The lower case is shown at 80% to approximate the label. You could get the effect by using a smaller point size for the lower case than for the capitals. <a href="http://www.myfonts.com/fonts/schizotype/vulpa/" title="http://www.myfonts.com/fonts/schizotype/vulpa/">http://www.myfonts.com/fonts/schizotype/vulpa/</a><br>
      Don<p></p>
