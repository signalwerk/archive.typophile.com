      <p>Here we go again. Another typophile thread grumbling about a logo redesign.</p>
      <p>The previous Me!bourne logo wasn't much of a logo, expressing barely a scintilla of a design idea. The split color treatment and the exclamation substituting the "l" were old hat at the time---today they're cliched and embarrassing. The "that's me!" part is plain corny. (wretch, gag etc) And the purple + white verges on a gothic theme that does not fit Melbourne at all.</p>
      <p>The new logo with its tangible idea beats the pants off the old one. The blue colors aren't neccessarily downbeat or subdued. Dark blue or the business suit navy would have been conservative and dull. </p>
      <p>The blues start with a light powder blue (sky blue) and go up to cyan (ocean color). Well, oceans are warm on bright sunny days aren't they? Not always, but they certainly <em>look</em> warm and inviting. The ocean in travel ads for an island paradise or luxury cabin cruise is always a happy inviting cyan/blue.</p>
      <p>Aside from the fanned-out pages, the multiple hues  are, I guess, meant to represent Melbourne's multi-faceted, multi-cultural, diverse nature. I have lived in Melbourne most of my life and its always been a blue kind of city to me. We're known for watery elements like our four-seasons-in-one-day weather and Port Philip Bay.</p>
      <p>Helvetica regular is a face of questionable aesthetic merit; feeble and spindly, graceless, sickly and awkward-looking. It looks like doggie eggs in text settings, according to Paul Rand. I'm trying to get the National Gallery of Victoria to stop using tightly-spaced Helvetica regular for its exhibition typography because its so hard to read, the leading so tight effort is required to avoid re-reading lines unintentionally.</p>
      <p>Helvetica bold however, is nowhere near as objectionable as the regular. Helv regular gives the bold a shoddy reputation it does not deserve. Helv bold is a common choice for designs where trendier and more stylized sans serifs draw too much attention to themselves. That is, Helv bold is very useful for certain kinds of work. In bold guise it loses much of its ugliness and becomes generic, making it useful. Its usefulness depends on the job; just because a designer uses Helvetica (bold or reg) doesn't neccessarily make it a bad choice, or make Helvetica bold an inherently bad font.</p>
      <p>Helv, in any weight, can be a bad choice when you have a D or B. Helv's D and B are ungainly by their excessive width, eg: the NBC TODAY show logo.</p>
      <p>Ho boye, lucky MELBOURNE doesn't have a D in it. I wouldn't like this logo if it had a big fat Helvetica D :^) But it does have a B and R. The designers got around that by condensing the glyphs in the middle, or possibly they used Helv bold condensed, or modified the standard bold, or designed custom glyphs for the middle letters, or the whole thing.</p>
      <p>Does the O look like a Helvetica O? Not really. More like Din. Hey it could be---look at those straight sides :^)</p>
      <p>Geoff, I did not find Helvetica mentioned anywhere in the source article. Not saying it isn't Helv, but I've got my doubts from looking at the O.</p>
      <p>Other than the B, there aren't enuff letters here to tie the glyphs unmistakably to Helvetica. It could easily be a nice URW++ grotesk. The R with the curled leg is a generic design dating back to Akzidenz Gotesk and the whole grotesk sans tradition. The other caps here could be generic or grotesk---there wouldn't be much difference from Helv bold.</p>
      <p><em>smooshed</em></p>
      <p>Que? The letters are perspectivized. Is there something wrong with that? It looks artfully done. At least they haven't been mercilessly squished or squooshed. It seems typophiles are against any kind of manipulation or distortion of letters---including treatments that serve extra-dimensional aspects of a logo design, even when artfully executed.</p>
      <p><em>In general I like the new one, but I don’t like the typography. Is it only me who thinks the “N” is too big (and the the right stem is too bold)? If one do something like that, you have to re-balance these details, which did not happen I guess.</em></p>
      <p>Technically the N <em>appears</em> oversized (may be an optical illusion). The right stem only looks too heavy because the left stem is lightened by the perspective distortion and overlapping color patch. But in practical use the guy in the street does not notice these things. You can have technically perfect typography and design if you want it, but how relevant and neccessary is that degree of perfection?</p>
      <p>Why does it have to be perfect? Why <em>can't</em> it be a little bit imperfect? Is imperfection, in an otherwise near-as-dagnammit perfect creation, really a bad thing? Doesn't the quirk make it more interesting?</p>
      <p>Art it is. Design it is. "information architecture" or computer programming it is not.</p>
      <p>The designers could have compensated for the optical illusions, but they didn't---it isn't important enuff, and even it were corrected most people would not know the difference.</p>
      <p>Like it matters.</p>
      <p>From the source page:</p>
      <p>"Designer Vince Frost, of Frost Design in Sydney, disagreed. "I just think this looks incredibly weak," he said. "For me it's really lacking in an idea. It doesn't feel modern or fresh and that's the kind of city Melbourne is."</p>
      <p>I think he's missing the subtlety of this design. There is a soild idea there, even if it is not as articulately expressed as it could have been.</p>
      <p>j a m e s</p>
