    html: "<p>Sarah, <br> <br>yesterday i was at a friend's house and saw the latest MacAddict (i think it is the August issue, #84). it has a tutorial on TypeTool, and at the end there is a sidebar about a *free* font editor you can get on the web. this program is called PfaEdit and it is open source (i think the article said it was UNIX-based, but i'm not sure)... according to MacAddict this program is very buggy and even the author of the program recommends saving often. the website includes a manual and many comments on installing, etc. this program lets you create new fonts or edit existing ones. i have not tried it myself, but if you are interested, here is the link: <br> <br><a href=\"http://pfaedit.sourceforge.net\" target=\"_blank\">http://pfaedit.sourceforge.net</a> <br> <br>good luck, <br>Ric <br></p>"
