    html: <p>Don't let the lack of font software stop you from using your  <br>fonts. <br> <br>If you want to use your type in a limited way - to set a  <br>headline or a logotype - you can treat your glyphs (each  <br>individual letter) like you would line-art or illustration. It  <br>just requires that you compose them as individual shapes,  <br>instead of using it like a font (with the type tools). But, like  <br>Chris said, you'll most-likely want Illustrator or Freehand if  <br>you go that route. <br> <br>Of course this is not an ideal long-term solution, but it will  <br>save you having to buy and learn font software. Unless of  <br>course, you're willing and ready to do that, then don't let  <br>me discourage you!</p>
    html_clean: <p>Don't let the lack of font software stop you from using your  <br>fonts. <br> <br>If you want to use your type in a limited way - to set a  <br>headline or a logotype - you can treat your glyphs (each  <br>individual letter) like you would line-art or illustration. It  <br>just requires that you compose them as individual shapes,  <br>instead of using it like a font (with the type tools). But, like  <br>Chris said, you'll most-likely want Illustrator or Freehand if  <br>you go that route. <br> <br>Of course this is not an ideal long-term solution, but it will  <br>save you having to buy and learn font software. Unless of  <br>course, you're willing and ready to do that, then don't let  <br>me discourage you!</p>
