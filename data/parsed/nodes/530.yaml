    html: <p>TypeTool is a good place to start as its cheap, good, and there is an upgrade path to the full FontLab for when you get more adventurous. You're also supporting an active developer community, unlike Macromedia's shameful treatment of Fontographer. <br> <br>Incidentally, if you are pondering stealing font software, do bear in mind the people who produce it. In the case of FontLab, its a few eager enthusiastic developers who want to create a great product for the type community and hopefully make a living from their efforts. In the case of Fontographer, its a bunch of idiotic short-sighted suits with a cash cow who they never feed. <br> <br>Give some money to the nice Russians, thats what I say.</p>
