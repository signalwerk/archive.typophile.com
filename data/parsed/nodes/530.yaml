    html: '<p>Sarah,  are you the student, BFA, visual communication....you asked about type design (a month ago ?)?   1. do you have a pen? pencil? paper?  2. do you have illustrator/freehand?   3. start to draw. then buy FontLab - ONLY leagal copy!!!!!!!!  4. try to obtain : "anatomy of a typeface" by Alexander Lawson.    ? "letters of credit" by Walter Tracy.    ? "creative lettering today" by Michael Harvey.  5. go to <a href="http://www.gillbell.com" target="_blank" rel="nofollow">www.gillbell.com</a> - great artist.  6. go to <a href="http://www.waterslettering.com" target="_blank" rel="nofollow">www.waterslettering.com</a>  - Julian Waters - THE MASTER of the fine art of lettering (englishman, of course <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> and there is Hermann Zapf, of course <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0">. by the way - Waters was his student ).</p>'
