    date: 2004-06-16T16:20:00
    votes: null
    html: '<p>Write the alphabet on a sheet of paper, scan it into your computer and save it as a .jpg or whatever you are comfortable with. Crop each seperate character and save it as A.jpg, a.jpg, etc. Go to: <br> <br><a href="http://www.high-logic.com/" target="_blank">http://www.high-logic.com/</a> <br> <br>Download their pdf or check out their online manual, download their Font Creator Program for a 30 day free trial. Open a "new font" and name it. Copy your letters one at a time and paste them into the appropriate edit windows. Look at the results in "Test Font." Start making corrections and adjustments. <br> <br>You will soon know if you want to continue on or not.</p>'
  - id: 136540
    user_id: 1160
    user_name: Joe Pemberton
    user_path: null
    user_image: /files/pictures/picture-1160.png
    date_raw: 8 Jul 2003 — 10:32am
    date: 2003-07-08T10:32:00
    votes: null
    html: <p>Don't let the lack of font software stop you from using your  <br>fonts. <br> <br>If you want to use your type in a limited way - to set a  <br>headline or a logotype - you can treat your glyphs (each  <br>individual letter) like you would line-art or illustration. It  <br>just requires that you compose them as individual shapes,  <br>instead of using it like a font (with the type tools). But, like  <br>Chris said, you'll most-likely want Illustrator or Freehand if  <br>you go that route. <br> <br>Of course this is not an ideal long-term solution, but it will  <br>save you having to buy and learn font software. Unless of  <br>course, you're willing and ready to do that, then don't let  <br>me discourage you!</p>
