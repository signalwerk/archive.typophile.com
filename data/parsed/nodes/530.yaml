    html: <p>Photoshop, Image Read, PSP, they're all bitmap programmes, they don't deal with vectors (which is what fonts are) except in a very limited fashion. <br> <br>If you don't want to spend the money on Fontlab or Fontographer, you can try FontTool from the people who make Fontlab.  It's a "light" version of Fontlab, perfect if you don't need to take advantage of all the high end features.  You can check it out at <a href="http://www.pyrus.com" target="_blank">www.pyrus.com</a>. <br> <br>If you know German, there is a free tool out there called Manutius.  <a href="http://www.typeforum.de/print.php?sid=126" target="_blank">http://www.typeforum.de/print.php?sid=126</a></p>
