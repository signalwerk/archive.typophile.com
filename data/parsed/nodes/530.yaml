  html: <p>Ijust recently got a new computer and the main programs I have is Photoshop 7, Image Ready, and Paint shop pro.  Anyways, I have been creating fonts that can be scanned into the computer.  I know I don't have the appropriate software, but is there anyway I can just work with what I have and not have to get Font lab or Fontographer?  Now, sure I would love those programs but there is no way I can afford that stuff now.  Maybe someone can give me some helpful advice as far as how can I create the fonts using the programs that I have if it is possible.  </p>
