    <p>Does anyone know of a resource that could be used to determine the popular fonts for books, particularly non-fictional books, in a particular region, for example a particular country, for particular dates? The typogeography of europe map is something like that, but I of course need a timeline on font popularity. </p>
    <p>If not how would you go about discovering this information?</p>
    <p>I am thinking particularly of historically popular fonts in Denmark.<br>
    I do not need a 100% accurate result...a result that tells me that a particular font was likely high in popularity at a given date would be adequate.</p>
    <p>Dates might be as far back as the 1750s to today.</p>
