      <p>In the English-speaking world, non-fiction typography, depending on what field one is looking at, has tended to be dull, at least at some levels.</p>
      <p>Today, almost everything is in Times Roman. Yesterday, science textbooks were overwhelmingly in Modern series 7 because of the availability of mathematical symbols from Monotype in that typeface. And if you go back to the 18th Century, Caslon was used for just about everything.</p>
      <p>Of course, if you go to non-fiction books for which a huge popular sale is anticipated, more will be invested in the typography. Times Roman is still quite likely, but you could get Baskerville, you could get Palatino... or you could even get Optima or Univers, particularly if the book is concerned with the arts rather than the sciences.</p>
      <p>Caledonia and Century Expanded are more likely to be found as alternatives to Times Roman for works of fiction, although they're used for non-fiction as well.</p>
      <p>But there isn't enough effort expended on a more diverse range of typefaces in huge swaths of the book publishing industry. Magazines, as vehicles for advertising, receive more attention in this regard.</p>
