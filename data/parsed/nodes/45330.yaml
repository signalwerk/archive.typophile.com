    html: |-
      <p>Not sure where the idea of "web equivalent" comes from. <a class="freelinking external" href="http://www.myfonts.com/fonts/processtype/locator/" rel="nofollow">Locator</a> is Locator, but if you want to know which widely available font is most similar, I would say Verdana, although the l is not curved, the C is more closed, and the G is a different style. </p>
      <p>- Mike Yanega</p>
