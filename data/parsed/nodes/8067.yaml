    html: "<p>\"dark-light passage\" <br>As I think, every christian holiday is related to that passage. <br> <br>The origin of course is Easter: <br>From the time of fear and despair after the death of Jesus Christ - indeed in real darkness on the night from Saturday to (Easter-)Sunday - to the light of resurrection first heard of in the morning and from there on beginning an increasing flow of hope and vision for future. <br>Jesus himself before has been a human light for people living in human, political and economic darkness. Jesus' death was like a fall back into darkness. <br> <br>But the other holidays reflect this same event and its passage in other terms: <br>Christmas: <br>The advent-time remembers the need of healing brokenness and badness of our world a) in former times (before christ) and b) in our times and that we await a second coming of Christ, finishing his work (as well as personal in and for us, as well as historical some time in the future).  <br>And Christmas celebrates his coming and starting to reveal Gods light to humans. So darkness-light-passage is appropriate as well.  <br>And the time was chosen (nobody never pretended to know Jesus was born in december), because it's the darkest time of the year regarding to day-night. <br>I like that, because I think it is important not to evade the bad things and (personal and political) brokenness but to take up with that, to be aware, and on the other side to get power by a good news of light. <br> <br>Pentecost: <br>It has fire as a symbol, and fire and light show the same. The disciples of Christ before were fearful and despaired, closed themselves in their rooms (dark), and then went out and spoke in the daylight. <br> <br>It is important for me to make it clear that with \"political darkness\" I don't mean minor ethical problems (who may marry whom - you can be of different positions in that point - it won't destroy the earth) but for example covering people with war (even in the best intention), landmines or giving all power to money and business. <br> <br>Now back to design: <br>I was wondering about what part of the design in your URL you referred to. Thank you for making it clear. <br>I didn't see the cross in the kosmopolitan, and was wondering if there's a local tradition of a fawn with red spots (blood?) instead of a lamb? ;-) <br> <br>Titus: Thank you for the picture. I like it.</p>"
