    html: "<p>John, <br>the book of Henry Adam sounds very interesting to me. Unfortunately I couldn't find it (not in amazon nor in abebooks). <br>If I remember right, Ecos \"Foucault's Pendulum\" is about the grail and medieval knowledge too, but this time the modern imaginations, phantasies and its dangers. And by the way: related to computers, too. <br> <br><i>As far as I know that is actually a Christian symbol more related to Easter. What do you think of this logo ? </i> <br>Allesandro, I didn't understand what you mean. Related to the penitential and merry time or to the logo (the fawn?) on kosmopolit? <br> <br>Allessandro and Dan, a very good piece of Eco. <br>I started in 1980 with machine code. Then used DOS and Windows and am - despite a strong wish for a Macintosh - continuing because all my good software (InDesign ...) is Windows-Software and I can't afford to buy all again for Mac.  <br>I always thought it was because of my lack of money for the admired but too expensive Macintoshs.  <br>But now I know better. As a lutheran protestant pastor grown up and living in a traditional but somehow liberal catholic country (bavaria and the liberalitas bavariae), it was my part, including the admiration for (and the good working together with) the (not so) 'other' side. <br> <br>In my german \"bustina...\" there is an annotation of Eco (written 1999, translated roughly): <br>\"This back-page column has been written six years ago. Meanwhile things changed. Multiple releases made Windows 95 and 98, together with Mac, to become tridentinic-catholic. The torch of protestantism passed on to Linux. But the difference remained.\"</p>"
