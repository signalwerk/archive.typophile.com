    date_raw: 11 Dec 2004 — 10:06pm
    votes: null
    html: <p>Not only did I not fall for it, but I thought it was downright manipulative (although not through a desire to put down Christianity*, more for the thrill of telling a story and the vanity of having people believe it). The whole book in fact seems manipulative, even the way the chapters are broken. I was feeling the author's [sleight of] hand the whole way through, and the main emotion this caused in me was pity for the general readership. Anyway, I read it because it was a birthday gift from a friend (who <i>had</i> fallen for it, probably because of anti-Christian zeal**) and I really need to read more fiction. <br> <br>* In fact in the end it becomes totally apologetic. Although worse still was the huge logical disconnect between the burning need to locate the Grail versus the outright nonchalance at having lost it. <br> <br>** Which I actually feel is not misplaced in its origins, but often is in its intent. <br> <br>All that said, my main point above was that I do suspect you harbor too much disdain for the book, and you keep that too restrained. But I could be wrong on either or both. <br> <br>hhp</p>
    html_clean: <p>Not only did I not fall for it, but I thought it was downright manipulative (although not through a desire to put down Christianity*, more for the thrill of telling a story and the vanity of having people believe it). The whole book in fact seems manipulative, even the way the chapters are broken. I was feeling the author's [sleight of] hand the whole way through, and the main emotion this caused in me was pity for the general readership. Anyway, I read it because it was a birthday gift from a friend (who <i>had</i> fallen for it, probably because of anti-Christian zeal**) and I really need to read more fiction. <br> <br>* In fact in the end it becomes totally apologetic. Although worse still was the huge logical disconnect between the burning need to locate the Grail versus the outright nonchalance at having lost it. <br> <br>** Which I actually feel is not misplaced in its origins, but often is in its intent. <br> <br>All that said, my main point above was that I do suspect you harbor too much disdain for the book, and you keep that too restrained. But I could be wrong on either or both. <br> <br>hhp</p>
  - id: 54223
    user: 1262
    date: 2004-12-11T23:21:00
    date_raw: 11 Dec 2004 — 11:21pm
    votes: null
    html: "<p>I have not read the book, and am not interested to do so. I read <i>Holy Blood, Holy Grail</i>, from which Brown apparently takes almost all his ideas, many years ago, and was so unimpressed by its lack of understanding of the mediaeval mind that I was not tempted to give any credence to its wacky theories. Brown's commericial cleverness is to package these stale ideas in a fast-paced novel. Anyone who has studied the mediaeval imagination knows that the grail quest legend is allegorical. <br> <br>I've spoken with a few people who read the book, most depressingly people who claim to be Christians but whose knowledge of their own religion is so poor that they can't tell what in the book is Brown's invention. Apparently Ron Howard is going to direct the movie, which I'm sure will be a fine addition to the long canon of Hollywood anti-Catholic bigotry. <br> <br>I did read a very good review of <i>The Da Vinci Code</i> in the Atlantic Monthly a few months ago, written by a professor of renaissance art history. Her biggest complaint about the book was not its anti-Catholicism, but the fact that people reading the book were encouraged to think they had learned something about Leondardo's painting. She did a very nice job providing an orthodox interpretation of all the features of <i>The Last Supper</i> that Brown takes as hidden clues to his big secret, showing how the painting closely conforms to the Gospel account of the last supper. As she wrote: the Gospels are the real Da Vinci code, the key to understanding his paintings.</p>"
