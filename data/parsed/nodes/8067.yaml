    html: "<p>I haven't read both books, but regarding to medieval mind, fiction, the grail and allegory I just read  <br>Umberto Ecos \"Baudolino\", which is a very nice book. And by the way, in the beginning there is a nice story  <br>behind script and palimpsests (is it the correct english word?). <br> <br>Being surrounded by dozens, no hundreds, of hanging plastic santas all around on the fassades of  <br>houses (even here in upper bavaria!) and millions of little blinking lights and the first \"Christstollen\"  <br>(christmas loaf) appearing in our local store on 29th of August(!),  <br>I really would prefer the old tradition of growing light (advent wreath) through the four advent-sundays,  <br>a quiet and penitential (or aware) time and a \"merry christmas\" as the summit of it on 24th of december. <br> <br>But apart from the early time for a \"merry christmas\": thank you for your card, Allesandro,  <br>I like it very much, because it shows darkness and light and includes \"penitential advent\" and \"merry christmas\" together. <br> <br>best wishes for a penitential (or aware) advent and a merry christmas (later) too. <br> <br>Michael  <br> <br>(interested by this thread by the design, the discussion about religious/theological positions and as a protestant)</p>"
