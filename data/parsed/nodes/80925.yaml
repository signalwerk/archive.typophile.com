  html: |-
    <p>Greater Albion have jusst released two new families through Fontspring and Myfonts:</p>
    <p>Corsham:<br>
    Corsham was inspired by traditional stonemason's engraved lettering designs.  Designed to be used alone, or in combination with our Corton family, ithas wonderfully lively air, with distinctive lively serifs and beautifully swashed downstrokes. Four faces are offered-regular bold and black weights as well as a condensed form.  All faces include a range of Opentype features, including ligatures and old-style numerals.  The Corsham faces merge 'olde-worlde' charm with fun character, yet remaining clear and legible for text use.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Corsham_t_5577.png"></div><p></p>
    <p>Metropole:<br>
    Metropole is an exercise in combing the curvaceous lines of the Art Nouveau with the solid character and simplicity of Art Deco.  The resulting three display faces combine the spirit of the 20s and of the thirties, creating lively fun display faces for headings, signage and banners.  These characterful faces with clear simple outlines are also ideal to lend a distinctive air to your web pages, or to create a distinctive 'house-style' for lettering.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Metropole_t_5393.png"></div><p></p>
