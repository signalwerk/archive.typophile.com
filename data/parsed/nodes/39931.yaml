    <p>I came across <a href="http://www.gannett.com/go/newswatch/2003/april/nw0425-1.htm">this</a> article while try to find some history and usage of the serifa font.  It says that for the El Paso Times Serifa is to be used for all section flags and for story labels.  </p>
    <p>What is a section flag and story label in a newspaper?</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/38292" class="topic-previous" title="Go to previous forum topic">‹ Type Designers Boycotting OS X!?</a> <a href="/node/39937" class="topic-next" title="Go to next forum topic">Indiana Jones and the Kerning of Doom ›</a></div>
  html_clean: |-
    <p>I came across <a href="http://www.gannett.com/go/newswatch/2003/april/nw0425-1.htm" class="link-external">this</a> article while try to find some history and usage of the serifa font.  It says that for the El Paso Times Serifa is to be used for all section flags and for story labels.  </p>
    <p>What is a section flag and story label in a newspaper?</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/38292/" class="topic-previous link-kept" title="Go to previous forum topic">‹ Type Designers Boycotting OS X!?</a> <a href="/node/39937" class="topic-next link-lost" title="Go to next forum topic">Indiana Jones and the Kerning of Doom ›</a></div>
