    html: |-
      <p>Using the El Paso Times as a guide, one example of the section flag is the “El Paso Times” on the front of the paper. Interior sections might be called “Sports,” “Features” or “Local.” The large type on those pages denoting the sections would also be section flags.</p>
      <p>Story labels probably vary from paper to paper, but (again) using the El Paso times as an example, they’re likely referring to something like the “SPECIAL POW REPORT” that appears on the front to the left. I’m sure they use labels like this for other special reports or spreads.</p>
      <p>- Lindsay (former newpaper editor/designer)</p>
