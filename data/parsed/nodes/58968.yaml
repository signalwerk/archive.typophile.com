    <p>Greater Albion has just released our latest new family of typefaces, Keynsia.</p>
    <p>The Keynsia family revives the spirit of the 1950s-in fact it’s our first venture into the design ethos of that decade. Its simple and elegant lines make for an eye-catching set of display faces.</p>
    <p>A range of different faces make up the family, all having an extensive character set. Keynsia is available on <a class="freelinking external" href="http://new.myfonts.com/fonts/gatf/keynsia/overview.html " rel="nofollow"> Myfonts.com</a> and we've put some examples of it in use on our <a class="freelinking external" href="http://gatf.wordpress.com " rel="nofollow"> blog</a>.  In the meantime, here's one specimen image:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Keynsia_Gallery1_Small_3895.png"></div><p></p>
