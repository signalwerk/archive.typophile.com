    <p>Tonight on BBC Four at 9o'clock, repeated at 01:15 and 02:45am</p>
    <p><a href="http://www.bbc.co.uk/bbcfour/listings/programme.shtml?day=today&amp;filename=20080414/20080414_2100_4544_13889_60&amp;service_id=4544" target="new" rel="nofollow">Stephen Fry and the Gutenberg Press</a></p>
    <p><a href="http://www.bbc.co.uk/bbcfour/medieval/gutenberg.shtml" target="new" rel="nofollow">Another (better) link</a><br>
    <cite><br>
    Showing as part of the Medieval season. Stephen Fry goes in search of the story behind the inventor of the printing press, Johann Gutenberg, travelling across Europe to find out how Gutenberg kept his development work secret, and how his approach started a cultural revolution. </cite></p>
    <p>In order to fully understand the man and his machine, Stephen assembles a team to help him build a copy of Gutenberg's printing press as well as learning how to make the paper and type so that they can print as Gutenberg once did.</p>
