      <p>As a designer, I need arrows very often, especially working on books. Not only the authors use arrows in their diagrams, charts or formulas, from time to time, I use them in captions to point to particular image etc. The presence of arrows is an important factor for me when selecting a font family for a new project.</p>
      <p>I prefer arrows to have proper Unicode indices to allow me to switch between fonts without losing them. I usually don't use OT features to enable the arrows, I prefer Glyph panel.</p>
