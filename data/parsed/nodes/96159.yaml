      <p>How useful are arrows really, as part of a typeface font?</p>
      <p>Perhaps for maths, but then the user would be working with a specialized math font.</p>
      <p>Do typographers actually set arrows in the same text box as running text?</p>
      <p>Dave, what are the most common uses of typographic arrows, that you are catering to by providing them in your font?</p>
      <p>As far as style goes, the vast majority of fonts could combine with two or three arrow styles, that are available as “sorts” in a pi-font. That font is the Symbols font, which is bundled with the Mac OS. That’s where I, as a typographer, would go to locate an arrow — it’s a small font, so the arrows are relatively easy to ﬁnd in the glyph palette.</p>
      <p>Left- and right-facing manicules are more likely to be used in text layouts.</p>
