    html: |-
      <p><cite>Do typographers actually set arrows in the same text box as running text?</cite></p>
      <p>Sure they do. I do that all the time.<br>
      And if its not in the text box, I might use it in accompanying info graphics in magazines, text books, annual reports or whatever. Using arrows that match the typeface will usually be a better choice than just throwing system font symbols in the mix.<br>
      But maybe that's also a chicken or the egg dilemma. If more regular text fonts had such arrows, people would expect these symbols more often and look for it. And offering easy input methods also helps. Glyph palettes are for finding special characters occasionally. If special characters are used frequently, they need to be typed.</p>
