      <p>By the way: OpenType replacements and official unicode values don't rule each other out. If you set the correct Unicode values people can use glyph palettes and copy and paste. But it doesn't hurt to offer additional replacement codes via OpenType. If the user actively turns on a stylistic set and uses such codes, he won't be confused, when he switches the font and something like {west} appears. </p>
