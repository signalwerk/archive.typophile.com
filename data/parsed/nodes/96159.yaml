    <p>Wondering whether there is a standard on the typed combinations that go to make arrows using discretionary ligatures. For the following arrows:<br><img src="/sites/default/files/old-images/arrows_3518.JPG"><br>
    I'm thinking the following combinations:<br>
    {&lt;-}<br>
    {^|}<br>
    {-&gt;}<br>
    {|v}<br>
    {&lt;-&gt;}<br>
    {^|v}<br>
    {&lt;^}<br>
    {^&gt;}<br>
    {v&gt;}<br>
    {&lt; v}</p>
    <p>The use of curly brackets to eliminate the possibility of the combinations being typed because the user wants that combo, rather than an arrow.</p>
    <p>(There's a space in the last one because it was treating it as some kind of html tag. That wouldn't be in the feature!)</p>
