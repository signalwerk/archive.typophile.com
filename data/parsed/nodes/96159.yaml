      <p>Ralf: <em>... I don't think every font use is meant to be »transferable«.</em></p>
      <p>Nor do I. Design-specific features are obviously suitable matter for discretionary glyph processing. But arrows are not design-specific features, they are standard characters and should be handled as such. If a font contained multiple styles of arrows, then there would be a glyph processing issue and the need for a decision about how best to access the variants, but the underlying encoding should still be the standard arrow characters.</p>
