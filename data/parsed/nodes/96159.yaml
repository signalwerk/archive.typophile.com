      <p>Bob H has it right: arrows should be encoded using the Unicode arrow character codepoints, and should not be treated as ligatures of other characters that happen to bear some resemblance to bits of arrows e.g. ^|. If you want to be able to enter such characters using mnemonic keyboard sequences, that's a keyboard issue, not a font issue.</p>
      <p>Hrant: <em>But keyboard shortcuts are not "transferable".</em></p>
      <p>And they don't need to be. What needs to be transferable is the encoded text. If you encode something as ^| then that is what it is encoded as: not an arrow, but an ascii circumflex and a bar sign. If you have a particular font that displays this sequence as an arrow, that isn't a transferable solution, because as soon as you display the text in a different font you will see ^| and not ↑. The arrow character ↑ is the only reliable interchange encoding for an upwards pointing arrow, which is why there is a standard.</p>
      <p>A general rule: do not using glyph display technologies to misrepresent underlying character encodings.</p>
