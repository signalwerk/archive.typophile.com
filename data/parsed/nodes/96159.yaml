    html: |-
      <p><em>I only worked briefly as an actual user of fonts, and never in any situations where I needed arrows.</em></p>
      <p>I worked for 25 years as a print designer, in advertising, marketing and editorial, and IIRC never once set an arrow, outside of a diagram. Manicules (Printer’s Fists), very occasionally.</p>
      <p>Riccardo, what uses of arrows have you come across?</p>
      <p><em>Has anyone here even seen a perthousand used anywhere?</em></p>
      <p>Matthew Carter used it in a conference talk on the relative statistical frequency of letters in newspaper text.</p>
      <p>(He reasoned that by narrowing the most frequent letters, one could create a more space-efﬁcient font, without having it look condensed.)</p>
      <p><em>Nick, If people use a specialised maths font for maths (which I expect they do) it doesn't follow that you include things like partial differential in your fonts, but you do.</em></p>
      <p>I do, because they are in the standard encoding.<br>
      (However, I omitted them in earlier “Mac only” PostScript-encoded fonts, which was standard practice.)<br>
      Arrows are only in WGL4, which is not an encoding generally supported by foundries.</p>
      <p>It amazes me that calculus symbols are in a basic encoding, but not multiply and minus!</p>
