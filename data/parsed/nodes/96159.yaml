    html: |-
      <p>Nick, I only worked briefly as an actual user of fonts, and never in any situations where I needed arrows. I imagine they would be useful in certain kinds of tables (share index 'TYPE ↑1.7%' - that kind of thing) and in these situations the arrows having the same width as tabular figures would be useful. Getting arrows from a different font seems to me like it would be more hassle than finding the arrows in the glyph palette for the same font. Arrows do seem to me to be far more useful than a lot of the other glyphs we have to make. Has anyone here even seen a perthousand used anywhere? Nick, If people use a specialised maths font for maths (which I expect they do) it doesn't follow that you include things like partial differential in your fonts, but you do. I think it's interesting that you would consider arrows an embellishment but not these other things, or are you just working to an encoding standard (Adobe?) that forces you to include them?</p>
      <p>Ralf, I have been convinced not to use any kind of substitutions for arrows, mainly because changing the font to a different one doesn't keep the arrow, but reverts to #left for example. I have decided the best way to deal with them is to put them in an ornaments feature, so they can be found easily in the glyph palette.</p>
