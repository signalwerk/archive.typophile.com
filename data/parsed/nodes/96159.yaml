    html: |-
      <p>I agree that such substitutions are really useful and I also agree it might not hurt if it wouldn't work different in every font. </p>
      <p>Typing such symbols is much more convenient than searching each arrow in a character palette. But I am not so sure a standard text font should have this in the ligature feature. It might be better placed in a stylistic set for users who have read the instructions and know how to use it. </p>
      <p>I wouldn't mind using English terms. If you use a Latin font in “regular” and “bold” you probably also understand “left” or “west”. Things like {^|v} are a bit cryptic. </p>
      <p>I am currently working on a wayfinding symbols font with lots of arrows and I use codes like:<br>
      #left<br>
      #right<br>
      #up<br>
      #down<br>
      #leftup<br>
      #leftdown<br>
      #rightup<br>
      #rightdown</p>
      <p>The reason for not using cardinal directions like east and west is that there are much more arrows such as “upwithhookleft” and “upwithtipright”, loosely based on the naming conventions in Unicode.</p>
