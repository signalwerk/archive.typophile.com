      <p>On the off chance anyone likes this idea, here's the code so you don't have to type it out yourself:<br>
      feature dlig {<br>
        sub braceleft less hyphen braceright by arrowleft;<br>
        sub braceleft asciicircum bar braceright by arrowup;<br>
        sub braceleft hyphen greater braceright by arrowright;<br>
        sub braceleft bar v braceright by arrowdown;<br>
        sub braceleft less hyphen greater braceright by arrowboth;<br>
        sub braceleft asciicircum bar v braceright by arrowupdn;<br>
        sub braceleft less asciicircum braceright by uni2196;<br>
        sub braceleft asciicircum greater braceright by uni2197;<br>
        sub braceleft v greater braceright by uni2198;<br>
        sub braceleft less v braceright by uni2199;<br>
      } dlig;</p>
