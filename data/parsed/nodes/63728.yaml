    <p>I've been trying to figure out some nice combos of Sans and Serif fonts. Some are known classics of course. Please let me know what you think, maybe you can come up some better matches. And perhaps you have some ideas for newer fonts? I'm curious!</p>
    <p>- Akzidenz Grotesk / New Baskerville<br>
    - Avenir / Didot<br>
    - Franklin Gothic / Century<br>
    - Frutiger / Melior<br>
    - Gill Sans / Perpetua / Joanna<br>
    - Optima / Palatino<br>
    - Syntax / Sabon<br>
    - Univers / Centennial<br>
    - Johnston / Golden Cockerel</p>
    <p>Jeffrey<br>
    <a class="freelinking external" href="http://www.infraordinaire.com/wordpress/">infraordinaire</a></p>
