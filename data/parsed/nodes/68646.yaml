  html: |-
    <p>I'm trying to determine the manufacturer of a font I've used in a particular project on behalf of a client. They would like to purchase a license and use the same exact font in designing materials in-house. Does anyone know how to track done such info on a font you've been using forever and have no idea where you purchased it?</p>
    <p>Thanks!</p>
