    html: |-
      <p><em>PS, Baskervilles original 1757 typeface was in reality an alteration by Baskerville of Caslon</em></p>
      <p>This is not the case. Caslon's letterforms, based on Dutch baroque models, and Baskerville's, based on the English roman style developed at the end of the 17th Century and beginning of the 18th by the writing masters John Seddon, John Ayres and George Shelley, follow completely different construction patterns and mimic the dynamics of different writing tools (broad nib and split nib, respectively).</p>
    html_clean: |-
