      <p>@hrant Sorry--I've been out of the game a while. I meant default metrics rather than kerning. Overall visual style of the journal is fairly conservative, and the biggest requirements are true SCs and superscripts. Economy isn't a huge deal, but Word doesn't offer great control over H&amp;J settings, so I guess that would cut in favor of something narrower. </p>
      <p>We're leaning toward Caslon and Baskerville mostly out of a (probably misplaced) historical allusion. The school I'm at was founded by Ben Franklin, so a Baskerville or something colonial-era would be kind of neat. The journal itself was founded in the 1860s, but I'd rather stay away from higher-contrast modern types. I figured Baskerville might be a good compromise where that's concerned.  </p>
      <p>@joshua In what way are Baskerville and Caslon opposites?</p>
      <p>@William Right now Williams Caslon is at the top of our shortlist for Caslons. Thanks for the suggestion!</p>
