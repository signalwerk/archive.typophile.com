      <p>Baskerville wanted to improve <em>upon</em> Caslon; I wouldn't see his work are derivative.</p>
      <p>Fountain's Baskerville1757 is actually quite nice I think, but to me mostly because of the unapologetic "g" which might in fact be not too authentic... In any case it's certainly much more authentic than the ITC version with its inflated x-height.</p>
      <p>* Avoid the free one, which is surely either a clone or just plain lousy.</p>
      <p>BTW, the "a" is indeed an interesting "singularity" in Baskerville. I find it ugly, and I assume that's why so many revivals try to change it, but to me if it doesn't express some of that original ugliness, it's not a Baskerville.</p>
      <p>hhp</p>
