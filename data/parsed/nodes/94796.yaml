    <p>We're looking to sub out the font in our academic legal journal, probably with a Caslon or Baskerville revival. </p>
    <p>Here's the main constraint: since we have to do all our typesetting in MS Word (don't ask--it can't be helped), we need something with immaculate kerning. Anything less, and our editors will end up spending hours fixing crashes. Right now we're using an old PS version of ITC New Baskerville. </p>
    <p>Thoughts?</p>
