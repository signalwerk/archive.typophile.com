      <p>Giving the right historical flavor is certainly very relevant. And a Baskerville would actually be quite justified, since Franklin happened to be a big fan of it! And, as nice as Williams Caslon is, Franklin actually specifically preferred Baskerville over Caslon... See the text immediately following the second illustration here:<br>
      <a href="http://ilovetypography.com/2008/01/17/type-terms-transitional-type/" title="http://ilovetypography.com/2008/01/17/type-terms-transitional-type/">http://ilovetypography.com/2008/01/17/type-terms-transitional-type/</a></p>
      <p>On other the other hand nobody could blame you for not being so historically literal; you could easily wade into conservative-but-not-Baskerville-or-Caslon territory, with something like FF Quadraat for example. It looks very old, but equally young at heart. Plus it has a very large number of components that cover a bewildering range of applications.<br>
      <a href="https://www.fontfont.com/designers/fred-smeijers" title="https://www.fontfont.com/designers/fred-smeijers">https://www.fontfont.com/designers/fred-smeijers</a></p>
      <p>hhp</p>
