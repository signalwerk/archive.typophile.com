      <p>Having spent a lot of time looking at actual Baskerville books, and even longer looking at the pen written models on which he based his types, I'm dissatisfied with all the digital revivals. I used Storm's display cut in the title slide for my ISType presentation, and I do think his italic is better than the Fountain one, but there's still some quality missing when one compares it to Baskerville's metal type.</p>
