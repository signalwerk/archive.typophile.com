  html: <p>Doggy Overnight Bag is to be a small kit that's placed in hotel rooms that are pet friendly. It will contains things such as a dog blanket, food &amp; water dishes, dog treats and other such stuff. <br> <br>They were presented with three different concepts and this is what they're going with. I have some tweaks in mind, but overall I'm pretty pleased with it. I would like help seeing the things I shouldn't be pleased with. I'm sure they're there.</p>
