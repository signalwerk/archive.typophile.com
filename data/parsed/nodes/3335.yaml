    html: <p>&gt;Be careful of choosing a font based on its name! <br>Huh? I'm guessing there is a correlation, but it's not obvious to me. Do tell. <br> <br>Hrant, for what reason does the size of the dog concern you? The illustration goes quite small with the dog still being discernable. I don't think he could sleep comfortably on that moon if he was very much bigger. I will try him as big as I can though (the client also wanted to see this) <br> <br>Ole, waggy-tailed g's? I don't believe I would know how to pull that off. What are <a href="http://www.myfonts.com/fonts/letraset/brighton/bold/testdrive.html?s=Doggy&amp;p=60"> these g's</a> doing? I was looking at that font(Brighton), but I don't think so. <br> <br>I like the sloped sides in Windsor but, maybe I'll have to reign them in some. <br> <br>Is there any reason why the stroke contrast differs between letters in this face. Compare the the capital and lowercase o's. <br> <br>Thanks again for your comments everybody.</p>
