    html: <p>Mitchell - The dog on the moon is very very good. <br>Going against the grain, I'd suggest maybe <br>looking into something a bit more playful for <br>the type. <br> <br>Here are a few more suggestions (couldn't clean link these for some reason.) <br> <br>Softie <br><a href="http://www.myfonts.com/fonts/tailspinstudio/softie/regular/testdrive.html?s=Doggie%2BOvernight%2BBag&amp;p=48" target="_blank">http://www.myfonts.com/fonts/tailspinstudio/softie/regular/testdrive.html?s=Doggie+Overnight+Bag&amp;p=48</a> <br> <br>Beachbuoy <br><a href="http://www.myfonts.com/fonts/joevanderbos/beachbuoy/medium/testdrive.html?s=Doggie%2BOvernight%2BBag&amp;p=48" target="_blank">http://www.myfonts.com/fonts/joevanderbos/beachbuoy/medium/testdrive.html?s=Doggie+Overnight+Bag&amp;p=48</a> <br> <br>Retrofit <br><a href="http://www.myfonts.com/fonts/joevanderbos/retrofit/light/testdrive.html?s=Doggie%2BOvernight%2BBag&amp;p=48" target="_blank">http://www.myfonts.com/fonts/joevanderbos/retrofit/light/testdrive.html?s=Doggie+Overnight+Bag&amp;p=48</a> <br> <br>Tarnation <br><a href="http://www.myfonts.com/fonts/sparkytype/tarnation/tarnation/testdrive.html?s=Doggie%2BOvernight%2BBag&amp;p=48" target="_blank">http://www.myfonts.com/fonts/sparkytype/tarnation/tarnation/testdrive.html?s=Doggie+Overnight+Bag&amp;p=48</a> <br> <br>Whichever direction you choose, try setting the word <br>in different cases and look for ways that you  <br>can customize the type. <br> <br>* You have four lowercase 'gs' in play. <br>* Look at how the letters fit together and play off each other. <br>* consider the counters. <br>* consider alternate letterforms not "in the font". <br> <br>good luck! <br> <br>bj <br></p>
