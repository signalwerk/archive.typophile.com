    html: "<p>I like the mark and the type on the second version but the letter spacing needs work. I think you need to take some space between the o and first g out in doggy and please don't crash the y into the g. In Overnight the t is floating and you can crash the ni combination a bit more. In Bag make the B a combination tighter.  <br>Question: could you have come up with a harder to space font? I remember this font from the 70s and it never set well. If you have time take a look at ITC Caslon 224 Extra Bold, it has character and the color of the letter spacing is much better and it has some of the feel you have here. <br>Did you do a verion of the mark with a black lab and a outline moon? I haven't seen a black moon lately.</p>"
