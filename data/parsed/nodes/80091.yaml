    <p>We are thrilled to announce that the highly regarded collection of fonts from <strong><code class="freelink freelink-error freelink-Array freelink-error-Array">[Bad link]</code></strong> is now available for purchase and download at AscenderFonts.com.</p>
    <p>As readers of Typophile may already know, the Sudtipos font collection features the work of four talented co-founders: Ale Paul, Ariel Garofalo, Diego Giaccone and Claudio Pousada. Sudtipos is most well known for its amazing variety of script typefaces, most of which contain extensive OpenType® typographic features.</p>
    <p>These wonderful fonts provide designers with a wonderful creative palette in which to create inspiring headlines, titles and more using OpenType features including ligatures, swashes and alternative characters. An OpenType-savvy program such as the Adobe® Creative Suite® and QuarkXPress® applications, or the newest versions of Microsoft® Word and Publisher software are required to access these features.</p>
