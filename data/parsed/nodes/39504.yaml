      <p>I have rejected typefaces (for book typesetting) because of the lowercase a, f, g, and y, as well as the uppercase G. But these were exceptional cases: normally I judge by overall consistency, eveness of colour, legibility, good kerning, and I don't mind if a particular glyph in isolation isn't maybe what I think is ideal. Since it does appear to so often, the l.c. "a" needs to be at least not badly designed. It's one of the trickier letters (I find) to get "right". I'm sure type designers spend extra time on the trickier glyphs to make sure they are right.</p>
      <p>In Canada we have a lowercase "zed" too, but it looks the same as the U.S. "zee."</p>
