      <p>I always start my typefaces by designing the lowercase 'a'. It's one of the most used glyphs in dozens of languages, and I believe it shows perfectly the character of any typeface. This doesn't mean that I disagree with Nick. What he wrote is true and I guess no one will deny it. I'm just saying that the 'a' is very important to any type design, in the sense that will allow the understanding of several other glyphs like 'n', 'm', 'u', 'h' and so on.</p>
      <p>I draw the 'a' all the time. My sketch books are full of them.</p>
      <p>A few months ago my daughter asked me why was I always drawing the 'a', she said that even with 8 years she already knew how tho write more letters than myself. Who is you teacher, she asked me. </p>
      <p>That's hard to ear ;^)</p>
