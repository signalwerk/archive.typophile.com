      <p>For a classy text font, assuming all the other characters are in synch, and extender lengths, metrics, spacing and so on are well sorted, <strong>a</strong> does tend "bear the most distinctive characteristics of the font". In that sense <strong>a</strong> does more to set the personality or tone of a font than any other single letter. One exception is all-caps settings where no part of the lower case is seen.</p>
