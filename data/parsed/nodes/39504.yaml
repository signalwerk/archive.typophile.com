      <p>Perhaps, really, the beauty is sometimes in the eye of the beholder: </p>
      <p>Just like different people are attracted to different things, visually, for various reasons, it could perhaps be said that each individual is first attracted, or instinctively notices, slightly different aspects of a typeface. This would come down to personality, taste, experience, character -- some love "curves", some love "long legs"!</p>
      <p>There might also be a difference between what we gather from looking at a typeface through a 'hunch' (a subconscious response, a first feeling, something that a single letterform might evoke) and a more logical, methodical analysis of it (further study of each individual letter and symbol together). </p>
      <p>Typography is life is typography.</p>
      <p>IK</p>
