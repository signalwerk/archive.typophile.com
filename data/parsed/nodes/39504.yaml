    html: <p>I must really be a moron because I find myself attracted to the curves in the lowercase "m," "n" and "h". And I also check out the lc "v". Then the lc "a" and "e". And the tail on the lowercase "t".While I find Mr. Shinn's observations a bit purist, certainly in the long run he is correct. However the world is inundated with people who buy CDs for a single song, a house for a single room, etc. What convinces the general public to buy a font, I believe, is the look of the individual letters because most of them aren't even aware of the word "kerning." In more commercial or esoteric situations, however, obviously what Mr. Shinn writes is almost the end all and be all.</p>
