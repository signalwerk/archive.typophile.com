      <p>Lowercase "a" *can be* the mark of a decent font, but it is by no means a measuring stick in any general sense. I emphasize "can be". It isn't always true. Plenty of "good" text fonts consisting of eye-pleasing letters that work well together as a team are equipped with an excellent lowercase "a". Plenty of other "not-so-good" text fonts consisting of letters that grate on the eye and work together poorly are also equipped with a good or excellent lowercase "a".</p>
      <p>In a well-designed font the lowercase "a" is often a useful starting point for assessing the overall style and character of the face (as Hector says), but it's only a starting point and never an absolute. "a" alone tells you nothing about integration in a typeface design.</p>
      <p><em>I would say Emigre’s inability to understand the concept of word spacing in their designs, is a bigger problem than designing a quirky “a”.</em></p>
      <p>You're talking word spacing or letter spacing? Please post some examples. Mazda use Emigre's Base series unmodified, with no spacing problems, to promote their cars. I've used Matrix and Filosophia for editorial advertising and never had any problems with word spacing or letter fit.</p>
      <p><em>Futura’s lower case ’a’ is pretty much a deal-breaker for me.</em></p>
      <p>That's a hard-core type user :^)</p>
      <p>j a m e s</p>
