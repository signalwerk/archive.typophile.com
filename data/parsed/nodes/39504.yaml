      <p><em>One aspect of a typeface’s quality is the consistency with which its feel is embodied by each glyph.</em></p>
      <p>I call it "integration". </p>
      <p><em>Success in this respect (i.e., homogeneousness) can’t be reflected by a single glyph, only failure can.</em></p>
      <p>Purely for the sake of debate---success at integration cannot be assessed by looking at one letter, even if the face is indeed well integrated. Failure of integration cannot be judged by looking at one letter either. Failure of integration can be established by looking at the whole font.</p>
      <p><em>In more commercial or esoteric situations, however, obviously what Mr. Shinn writes is almost the end all and be all.</em></p>
      <p>If you say so. Nick is very perceptive and lucid in his observations, but so too are many others. I think your impression is based on relative prominence. Nick is prominent but he's not the only person to write about type.</p>
      <p>j a m e s</p>
