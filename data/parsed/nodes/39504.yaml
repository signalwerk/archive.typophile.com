    <p>Does anyone think it makes sense to say that in most, or very many cases you can judge how good a typeface is designed looking specifically at the lowercase “a”? I can't express it more "scientifically" and it surely is an extreme statement, but anyway: do you find some amount of truth in it, or is it in your opinion just pure b.s.?<br>
    Related: does lowercase “a” say much more about the overall character of the typeface than the other glyphs?</p>
