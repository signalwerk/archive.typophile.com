    html: |-
      <p>Ranging figures would clash uncomfortably in some fractions, which I will not attempt to create using proper Unicode here. Anything with a descender up top and an ascender below is a problem, like (3|4|5|7|9) over (6|8).</p>
      <p>Nonnumeric characters can be used in fractions. g/6 would be tricky. Denominators using capitalized accented variables, like A bar or A hat (I’m using the spoken forms here), would be a problem.</p>
      <p>Fractions, like many other realms of typography, are superficially simple and too often are given simplistic miracle solutions that don’t cover all the bases.</p>
      <p>—<br>
      Joe Clark<br>
      <a href="http://joeclark.org/" title="http://joeclark.org/">http://joeclark.org/</a></p>
