    html: |-
      <p>It seems to me that looking for ranging numerals within fractions misses the point of ranging numerals, which is to harmonise visually with lowercase letters. Within a fraction, it makes far more sense for the numerals to harmonise with each other, since the vertical and horizontal arrangement of elements in a fraction are already distinct from that of lowercase letters.</p>
      <p>I can see a benefit to harmonising the form and detail of numerals within fractions to harmonise with those of ‘oldstyle’ text numerals, e.g. omitting the serifs at the bottom of the 4 and making the 0 match the proportions and stroke model of the oldstyle numeral, but I think it a mistake to make the forms ranging: you want the numerator group and denominator group to be distinct and balanced, to form cohesive numbers.</p>
    html_clean: |-
