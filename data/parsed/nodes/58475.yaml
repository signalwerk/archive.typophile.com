      <p>Nick wondered, at the very beginning:</p>
      <p>"Surely in this day and age foundries could bother to get some consistency happening."</p>
      <p>Which made me think of the poet-typesetter Walt Whitman, who wrote these [slightly amended] lines:</p>
      <p>"Do I contradict myself?<br>
      Very well then I contradict myself,<br>
      (I am large, I contain multitudes, as well as both lining and oldstyle figures.)"</p>
      <p>AND THEN, I just heard about this guy an hour ago on the TV: Henry Fountain Ashurst, one of Arizona's first senators, who was known as the "Dean of Inconsistency." Ashurst was proud of the title; and once remarked that </p>
      <p>"the clammy hand of consistency has never rested for long upon my shoulder." </p>
      <p>all that was apropos of nothing, I know. I actually have some thoughts about Nick's question, but they may have to wait until Tuesday when I get back to my desk and look at some stuff.</p>
      <p>powers</p>
