    <p>So, the default figures in the font are oldstyle--but when it comes to fractions, superior figures, etc., they're all lining!</p>
    <p>What's with that? it's like two hundred years ago, when they only had roman figures in italic fonts! Surely in this day and age foundries could bother to get some consistency happening. </p>
    <p>Just saying.</p>
