    html: |-
      <p>I consider oldstyle figures a solution to a problem. Like full capitals, lining figures ruin the color of the page by creating a blot of type that the eye is attracted to, causing the reader to jump back and forth between the blot and the words being read.</p>
      <p>While OS figs solve this problem, they do not contribute to the elimination of a blot of this type. </p>
      <p>Now, if you consider that OSF are only used because they are prettier, then it makes sense to use them in the fractions and superiors as well.</p>
    html_clean: |-
