      <p>The Selectric Composer did use a nine-unit system. But it's not quite as coarse as nine units to the em would imply. In order to manage with only nine units, and fit the characters on the Selectric element, what IBM did, basically, was to scale down the Monotype 18-unit system to an 11-unit system, and then compress the widest characters.</p>
      <p>That is, except for the 18 unit M and W, Selectric Composer widths are pretty close to 3/5ths of Monotype widths in units.</p>
      <p>Since in the Selectric Composer, one has a choice of three unit sizes, 1/72" (red), 1/84" (yellow), and 1/96" (blue), which span more than three point sizes, it's not really a 10 4/5 units to the em system, but it approximates that.</p>
