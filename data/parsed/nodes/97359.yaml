      <p>Once upon a time, a typeface designed specifically for a magazine had a single utilitarian purpose: to use less ink. The original Century is a marvelous solution and a durable design.</p>
      <p>The IBM Selectric Composer fonts were set up on a pretty coarse grid—six or nine units to the em, IIRC. Thus, type designs were sorely abused.</p>
      <p>In any event, some version of Century—Bitstream versions preferred, I believe—is now required for all paperwork submitted electronically to the United States Supreme Court.</p>
