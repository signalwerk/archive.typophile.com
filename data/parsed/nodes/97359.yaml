      <p>A minor clarification: ITC Century Light and Ultra were released in 1975 (announced in Vol. 2, No. 3 of U&amp;lc.), the rest of the ITC Century family (Book, Bold, plus the same four weights Condensed) was released in 1980 (announced in U&amp;lc. Vol. 7, No. 3).</p>
      <p>ATF had a Century Bold Extended.</p>
