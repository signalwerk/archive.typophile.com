    html: |-
      <p>I would be interested in seeing the grid you are working with.</p>
      <p>Sometimes grunge can be nice. What would make this better is if the grunge could be bound to something a little more organized. A strict grid might accomplis this. Or possibly some ’cleaner’ elements.</p>
      <p>Repeating the A in the grunge font is a bit too much of a good thing. It kills the impact of the type treatment for the name.</p>
      <p>Loose the silhouette, it accomplishes nothing — in fact it is actually confusing.</p>
      <p>Develop a (more visible) grid. Allow it to dictate your elements size and placement. Introduce, or change some of the elements to something more organized or ’clean.’ Be prepared to to have a solid explaination for the moniker ’design artisan.’</p>
      <p>Ohh, and welcome to Typophile. ;)</p>
