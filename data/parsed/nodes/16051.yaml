    <p>Introductions all around:<br>
    Hello, I’ve been a lurker once removed for a while, now. My spouse is a frequent poster, Chris Rugen, and I’m nosy, so I’ve given the site a look. I’ve been working on a business card for my new professional incarnation. </p>
    <p>Background:<br>
    I am currently an interior designer for IKEA.<br>
    I used to be a freelance set designer and scenic artist (plenty of lettering).<br>
    I am now taking classes in graphic and web design, so I can start forcing Chris to split his fees when I help him on a project. :)<br>
    I have a terminally crafty streak and I’m trying to play that up.</p>
    <p>I used the typefaces Nasty, CA Aires, European Pi, and CA After Midnight Sale Junk. Once I have better mastery of Illustrator, I have dreams of switching out the image of the stylized woman and tossing my own silhouette in there.</p>
    <p>Here it is:<br>
    </p><div class="imageWrap"><img src="/web/20080908005853im_/http://www.typophile.com/files/buscard_webOCT2005.jpg"></div><br>
    Comments and suggestions welcome.<p></p>
