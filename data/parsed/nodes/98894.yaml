  html: |-
    <p>I'm trying to write a simple python script that acts on the glyphs that the user has selected in the FontLab font window:</p>
    <p><img src="http://typophile.com/files/glyph-slots.png"></p>
    <p>I'm especially interested in the glyphs (or maybe more accurately "glyph slots") that are in the encoding but are un-filled.</p>
    <p>So far I've tried two things:</p>
    <p><code><br>
    # 1 - glyph slots<br>
    selectedSlots = fl.count_selected<br>
    print "Number of selected glyph slots:", selectedSlots<br>
    </code><br>
    <code><br>
    # 2 - selected glyph names<br>
    selectedNames = [ fl.font.glyphs[i].name for i in range(len(fl.font.glyphs)) if fl.Selected(i) ]<br>
    print "List of selected glyph names:", selectedNames<br>
    </code></p>
    <p>Script number 1 reports a count of the full user selection - all selected glyph slots - filled and un-filled - perfect! Script number 2 returns a list of glyphnames but only the selected glyphs that are filled - no good. Results of running 1 and 2:</p>
    <p><code><br>
    Number of selected glyph slots: 3<br>
    List of selected glyph names: ['eacute']<br>
    </code></p>
    <p>Can anyone suggest a technique that will list the glyphnames associated with all the selected glyph slots?</p>
    <p>cheers<br>
    - kannery</p>
