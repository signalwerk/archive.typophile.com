    html: |-
      <p>Thanks for your suggestion Michel, its an interesting script. But unfortunately your script would only work for me in a very rare special case: if the user happens to select a filled slot with an ID thats numerically lower than any unfilled selected slot AND, at the same time, the user also happens to select another filled slot with an ID thats numerically higher than any selected unfilled slot.</p>
      <p>Its just too narrow of a scenario, but your script does give some inspiration for crafty workarounds, so thanks.</p>
      <p>I guess what I'm after would be a magical method where you could probe for glyphnames like this:</p>
      <p><code><br>
      fl.font.encoding.Selected(glyphname)<br>
      </code></p>
      <p>Where it would return TRUE if the encoding slot was selected.</p>
      <p>cheers,<br>
      -k</p>
