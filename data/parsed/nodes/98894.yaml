    html: |-
      <p>FontLab can read the glyphnames associated with the slots, even if they are empty:</p>
      <p><code><br>
      # Generate a list of encoding glyph names<br>
      enc = fl.font.encoding<br>
      encodingNames = [ enc[i].name for i in range(len(enc)) ]<br>
      print "List of the encoding glyph names:", encodingNames<br>
      </code><br>
      <code><br>
      List of the encoding glyph names:<br>
      ['acute', 'aacute', 'eacute', 'iacute', 'oacute', 'uacute', 'yacute', 'cacute']<br>
      </code></p>
      <p>And even if the slots are empty, FontLab also knows how many slots are selected (see script #1 in my first post). So possibly there is a way for FontLab to associate glyphnames with selected slots -- empty or not.</p>
      <p>I hope. Is there a way?</p>
      <p>cheers<br>
      -k</p>
