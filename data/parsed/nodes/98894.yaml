    html: |-
      <p>I came up with a workaround:</p>
      <pre># Find all selected glyph slots

      f = fl.font
      s1 = [ g.name for g in f.glyphs if fl.Selected(g.index) ]
      slots = [ e.name for e in f.encoding if e.unicode &gt; -1 ]
      empties = [ n for n in slots if not f.has_key(n) ]

      # Create temporary blank glyphs in all empty glyph slots
      for n in empties:
      	g = Glyph()
      	g.name = n
      	f.glyphs.append(g)
      fl.UpdateFont()

      s2 = [ n for n in empties if fl.Selected(f[n].index) ]

      # Remove temporary blank glyphs
      for n in empties:
      	del(f.glyphs[f[n].index])
      fl.UpdateFont()

      allSelected = s1 + s2
      print "All selected slots:", allSelected

      </pre><p>
      Using the example from my first post, the user has selected one full glyph slot [eacute] and two empty glyph slots [uacute, yacute] :</p>
      <p><img src="http://typophile.com/files/glyph-slots.png"> </p>
      <p>Running the script in this state yields the result:</p>
      <pre>All selected slots: [eacute, uacute, yacute]
      </pre><p>
      A kludgy script, but it gets the job done. If anyone has a more elegant solution, please post ( Adam? Eigi? ).</p>
      <p>cheers,<br>
      -kannery</p>
