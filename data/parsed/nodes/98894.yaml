    html: |-
      <p>I don't use Fontlab (I use mainly FontForge); it seems to me you are trying to list names of characters that are not in the font. What you can do is determine the unicode range of those characters that are in the font and then print the names given by the encoding. If the first and last character are in the font then the following code seems to work on my demo version of Fontlab</p>
      <pre>def encodingNames():
        gl = fl.font.glyphs
        sIndices = [ g.unicode 
           for g in gl if fl.Selected(g.index) ]
        eNames = [ enc[i].name 
           for i in range(sIndices[0],sIndices[-1]+1) ]
        return eNames
      print "List of glyph names in the selected range:", encodingNames()
      </pre>
