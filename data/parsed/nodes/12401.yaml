      <p>I use VOLT simply because the Adobe FDK can’t do two things that I seem to need to do in almost every project: one-to-many substitutions and GPOS anchor positioning. That said, I tend to do a lot of my OTL work outside of VOLT in spreadsheets and VOLT source text files. The latter are certainly more complicated that the FDK syntax, but I’ve got used to editing them, and can work pretty quickly in this way.</p>
      <p>Paul, FontLab has a function that allows you to export OTL features as a VOLT project, but I have not tried this since any early version that didn’t work. It shouldn’t be too difficult to get right, though, and perhaps it has improved. I’ll be meeting Adam in a couple of weeks, and I suspect FL-&gt;VOLT workflows is one of the things we’ll discuss.</p>
