    html: |-
      <p>Paul, </p>
      <p>That’s a very good question indeed! :) </p>
      <p>What you’re trying to achieve is legitimate. Unfortunately, this is where the Adobe FEA syntax shows its weakness. In the OpenType binary tables, lookups are completely separated from features and are only mapped to features. Therefore, in the binary tables, you can easily intersperse lookups that map to different features. </p>
      <p>The Adobe FEA syntax attempts to make things simpler for the user, so in this syntax the lookups are defined inside of the feature definitions. But this actually makes interspersing of lookups very difficult to achieve. </p>
      <p>One possible, although not very elegant solution is to define all your named lookups in a separate, “fake” feature (called “xx01” for example) that would be placed at the beginning of the feature definitions. The order of the lookups in this lookup definition should reflect your desired order of the lookups in the final font. Then, in the clig and calt features, simply refer to the features by calling their names — in the correct order. </p>
      <p>Alternatively, use VOLT to build your lookups and features, or build your font and do some post-processing of the binary tables in TTX. </p>
      <p>Regards,<br>
      Adam</p>
