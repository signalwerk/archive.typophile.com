    html: |-
      <p>The calt feature expects one-to-one glyph mapping, so while you could probably get away with putting ligature (many-to-one) lookups in the calt feature it wouldn’t be 100% kosher — not as bad as cooking meat and dairy together, but not as careful as keeping separate sets of pots :)</p>
      <p>Can you perform liga substitutions for the ligatures and then apply calt substitutions to the results?</p>
