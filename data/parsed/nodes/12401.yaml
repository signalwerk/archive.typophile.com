    html: |-
      <p>John,</p>
      <p>I don’t see it that way. The Adobe FDK syntax is wonderful for automated, repeatitive, or systematic feature definitions. Combined with Python scripting, it’s possible to achieve a high degree of automation *and* complexity. For example, many parts of my Zapfino code was half-generated using dictionary-driven Python scripts. In VOLT, I would have drowned in the amount of point-and-clicks. VOLT, on the other hand, is much more suitable for individualized, highly custom projects with little repetition. </p>
      <p>Ideally, it would be nice to have a tool that can both :) </p>
      <p>Regards,<br>
      Adam</p>
