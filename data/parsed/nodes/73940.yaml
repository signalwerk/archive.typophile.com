  html: |-
    <p>An article (by me) about Hyphenation &amp; Justification in web browsers - H&amp;J on the web and in e-books, called <a href="http://www.alistapart.com/articles/the-look-that-says-book/" rel="nofollow">The Look That Says Book</a> published on AListApart today.<br>
    Please check out the article and the examples (intentionally rudimentary - very basic. Check them out in print preview mode, too.)<br>
    Especially grateful for comments - I'm looking very much to gauge the mood of design community on this.</p>
    <p>Thanks.</p>
    <p><a href="http://readableweb.com/the-look-that-says-book-on-alistapart/" rel="nofollow">Richard Fink</a></p>
