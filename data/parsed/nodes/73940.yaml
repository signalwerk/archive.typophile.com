      <p>It would have been nice if you'd built a better case for H&amp;J. Seems as if your primary argument is H&amp;J = "user expectations". </p>
      <p>Also would have been nice to call on browser makers to build hyphenation support into browsers so that page authors can avoid having to use the hacks you document. </p>
      <p>Cheers, Si</p>
