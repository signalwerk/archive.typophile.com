    <p>Hello guys!</p>
    <p>I've been desiging a Font in Hebrew, But I can't seem to find how to generate a Hebrew font in FontLab. </p>
    <p>Let's say I've got all I need already, and I have FontLab. How do I create a Font in Hebrew? is there a Code Page for Hebew? How do I "turn it on"? </p>
    <p>I'm very new in the typograhpy field, so every little detail is needed and will help me. </p>
    <p>Thanks.</p>
