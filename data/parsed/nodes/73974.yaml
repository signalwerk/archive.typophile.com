      <p><cite>it still lacks important accented characters </cite></p>
      <p>… which have a chance for getting encoded *only* if you manage to make a case that it is not possible to handle them via precomposed sequences.</p>
      <p><cite>…symbols for Cartography, Chemistry, Ecomony, Medicine, Work Safety and Ergonomy</cite></p>
      <p>In principle, you’re right. The question is, how to deal with it. Unicode/ISO offer a fair procedure to get along with such things. But the point is: who is going to do the work? Who is willing to fund the labour neccessary to write a proposal for 500 characters?<br>
      Ask M. Everson about his efforts to get Egyptian Hieroglyphs encoded. Ask a cartographer about the willingness of his colleagues to undertake encoding work of their own subject. – You will get very disapointed.<br>
      However sensible an ALIEN MONSTER (1F47E) as a character may be in *our eyes*, someone proposed it and made a case for its usage. Therefore it gets in. </p>
      <p>I hope being able to explain a bit more about the pending additions in the near future.</p>
