    html: |-
      <p>I do remember reading about how Burmese, being encoded by means of Unicode purism, is therefore very difficult to implement.</p>
      <p>Accented letters for French, German, and Italian are in Unicode even though they could be handled by precomposed sequences - and what about Korean? Instead, Unicode should be handling all languages equally - it should be as simple and convenient to process Tupi, Yoruba, and Burmese by computer as French or Korean.</p>
      <p>And assumptions about the technology in use shouldn't be made either - first code glyphs, then characters (i.e., for Arabic) - so that one can always print a desired set of glyphs, even if they don't follow the usual rules of the language. (Tables of initial, medial, and final forms, anyone?)</p>
    html_clean: |-
