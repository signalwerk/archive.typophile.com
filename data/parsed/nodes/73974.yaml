      <p>I'm somewhat suprised to see charts from Unicode 6.0 beta. Lots of new glyphs, especially emoticons and common signs. But it still lacks important accented characters used in marginal languages –as Yoruba and Tupi– and also symbols for Cartography, Chemistry, Ecomony, Medicine, Work Safety and Ergonomy. All these are far more important than some emoticons proposed.</p>
      <p>I understand Unicode is based on proposals. So the problem is not with the Unicode Comitee but with the organizations which handle these matters and must ask for additions.</p>
      <p><strong>Andreas</strong>: the signs you are previewing here are wonderful. Hope to see more very soon.</p>
