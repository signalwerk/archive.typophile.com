    html: <p>AFAIK, most "scarification" of Unicode principals was for political rather technical reasons, the whole idea of round-trip conversion (which is nonsense, if you ask me) was a pure political decision to convince national standardisation bodies that they can convert through and forth between Unicode and there existing national standards. Now that Unicode is past this stage and whoever does not play by Unicode rules is left behind, they can now (not exactly now, this have been going for a while now) force the original principals.</p>
