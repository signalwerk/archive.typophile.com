    html: |-
      <p>I think there's no doubt that if anyone on this list were to redesign Unicode from scratch, he'd make a better standard than the official one.  That's not the point, though -- the value of Unicode is that it's a standard that everyone in the world uses, whatever their country or their OS.  (And don't get me started about TRON.)</p>
      <p>There are good political reasons why Unicode turned out the way it has.  Originally, it was meant to be just the way you envision -- 16 bit wide, no precomposed characters, CJK entirely unfied.  In order to make Unicode compatible with the ISO 10646 charter, a few principles needed to be sacrified:</p>
      <ul><li> large numbers of precomposed characters ("accented letters"), for compatibility with legacy encodings;
      </li><li> de-unification of parts of CJK, S-commaaccent, etc.
      </li><li> presentation forms (Arabic, fi and fl, etc.).
      </li></ul><p>So could you design a better universal coding?  You bet.  But could you get all of the world to accept it without sacrificing at least some of your principles?</p>
      <p>--jch</p>
