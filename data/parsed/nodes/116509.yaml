      <p>It looks like some kind of Baskerville with old-style-figures.<br>
      The closest I can see is Baskerville 10/120 Pro (Bold/Italic) by Frantisek Storm [2005] - see the link bellow.<br>
      <a href="http://www.stormtype.com/family-baskerville-original-pro.html" title="http://www.stormtype.com/family-baskerville-original-pro.html">http://www.stormtype.com/family-baskerville-original-pro.html</a></p>
      <p>There was actually an older version of Baskerville Ten Pro by Storm which has this strange /1 on old-style-figures.</p>
