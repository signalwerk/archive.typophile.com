  html: <p></p><div class="imageWrap"><img src="http://typophile.com/files/met_font_6451.png"></div> This seems pretty close to Georgia Pro Black but there are subtle differences in the width of the characters and thickness of contours. Does anybody know exactly what this is, if it is in the Georgia super-family?<p></p>
