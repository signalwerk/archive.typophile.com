    <p>Get Triva, a new font that is - from what I was able to understand from a Google translation- underconstruction and incomplete.<br>
    It looks rather nice though... like Cocon but without the exaggerated personality.<br>
    FontShop has Trivia ready for download in most type formats (including OpenType) until August 2006. It includes some not-so-useful dings as well.</p>
    <p></p><div class="imageWrap"><img src="/files/image_3817.php3.jpg"></div><br>
    <div class="imageWrap"><img src="/files/image-1_4777.php3.jpg"></div><p></p>
    <p><a href="http://www.fontshop.de/trivia" title="www.fontshop.de/trivia">www.fontshop.de/trivia</a></p>
    <p>And you might like the US FontFont links too:</p>
    <p><a href="http://www.fontshop.com/freefonts/" title="http://www.fontshop.com/freefonts/">http://www.fontshop.com/freefonts/</a></p>
    <p><a href="http://www.fontfont.com/downloads.html" title="http://www.fontfont.com/downloads.html">http://www.fontfont.com/downloads.html</a></p>
    <p>Hope my fellow broke designers like this one,</p>
    <p>Mikey</p>
    <p>PS... sorry, only for non-commercial use guys :-(</p>
