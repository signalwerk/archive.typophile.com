  html: |-
    <p>Hey Guys,</p>
    <p>I am doing on a project helping low vision children, as they have difficulties in reading the current fonts. I've done researched and survey, I've found out that there are certain rules while selecting fonts for them for reading or when creating fonts for them. I need your critique and feedbacks in helping me to improve it better. </p>
    <p>The fonts are created with the following rules:<br>
    - round edges<br>
    - sans serif<br>
    - fixed width<br>
    - fixed height<br>
    - bold stroke</p>
    <p>I currently have 3 versions of the font and is working on the 4th version now.</p>
    <p>Thanks for you help, appreicated it.</p>
