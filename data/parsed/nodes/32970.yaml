    html: |-
      <p>Thank you everyone for your comments and advice.<br>
      The bottle is clear flint glass BTW.</p>
      <p><em>"If we say nice things about it, will you send over a six-pack? ;-)"</em></p>
      <p>Sorry Linda. It's a local beer for local people.<br>
      (a reference to brilliantly twisted British comedy <a href="http://en.wikipedia.org/wiki/League_of_gentlemen" target="_blank" rel="nofollow">League of Gentlemen</a>)</p>
      <p>For comparison here's how Fistral looked set in Hartwig Schrift before customising...</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/FistralHartwigSchriftx600_4976.jpg"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/FistralLabel01x600px_4027.jpg"></div><p></p>
      <p>Patty and Tim, mmmmm, yes, I'm also not sure if my Fi ligature is as elegant and legible as it could be, but I'm pretty happy with the final l.</p>
      <p>Does anyone else think the overall readability or the Fi ligature and the final l are problematic?</p>
      <p>I had been thinking along the lines of Asvetic's comments, in that I wanted the design to have some continental quirkiness. And then I covered my asѕ by having 'Fistral Premium' further down the label.</p>
      <p>Patty, a RAD surfer design was considered, but it needs to appeal to the Newquay high end bar, restaurant and hotel market too, not just the doods on the beach. But, yes, it would of made for a more fun design job.</p>
      <p>Thanks Tim. Astute and practical comments as usual. I think I agree with them all. I have been careful to allow for the bottle wraparound effect.</p>
      <p>The client is checking the blue for acceptability with the Official Bureau of Barcodes.</p>
      <p>The setting of the barcode is, unfortunately, out of my hands. Barcodes really screw up a design with limited space. It's about time technology advanced and they were replaced with some kind of micro digi dot. And a blue lazer.</p>
      <p><em>"Phase II, friendly &amp; romantic."</em></p>
      <p>Alessandro, I'm sorry, I'm not really sure what you mean, but I think I like the sound of it.</p>
