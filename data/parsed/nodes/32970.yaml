      <p>I share Patty’s concern on the readability of the logo, especially glimpsed in a chiller cabinet over a bar, pertinent to the readability is the amount of logo visible when the label is wrapped around the bottle, even though most of the target audience will know the name from the beach. On the label I might centre on the bullet between Newquay • Cornwall, regardless that that would uncentre the type either side; and increase the size of the scroll in proportion to the trident lozenge and insert a comma after strong on the front.</p>
      <p>For the volume I think you must show the e estimated symbol<br>
