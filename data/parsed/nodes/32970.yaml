    html: |-
      <p>I think it doesn't really matter which font is used for the numbers, as long as it's legible and fits in it's place. That's the part for the human eyes. But one musn't fiddle with the lines. If they are shortened, scaled or pasted inside, it has to be done so that the lines don't change in proportion to each other.<br>
      I've changed the font to Gill Sans in the past (as it was used in the package anyway) with no problems reported.<br>
      I use Barcode producer now, and it lets me change the number font, or it can be changed in Illustrator. The said application also warns me if the size of the code is too small.</p>
      <p>Good point about the colour, Patty. You don't want to be the favourite hate person of the cashiers, who have to type the code in every time.</p>
    html_clean: |-
