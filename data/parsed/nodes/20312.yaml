    <div class="info">Submitted by <a href="/user/7006" title="View user profile.">paul d hunt</a> : 30.May.2006 9.17am </div>
      <p>High-Logic FontCreator 5.5 Released</p>
    <p>In this newsletter:</p>
    <p>* FontCreator version 5.5 released<br>
    * Special offer: get FontCreator Professional Edition for $99 only<br>
    _______________________________________________</p>
    <p>We are pleased to announce the release of FontCreator 5.5 for Windows.</p>
    <p>HIGHLIGHTS:<br>
    FontCreator Version 5.5 contains many improvements and features. The new<br>
    drawing tools greatly simplify and speed up the design process. Other new<br>
    features include Align and Distribute operations, to ensure precise<br>
    positioning. The improvements to Panose Classification and the enhanced<br>
    Validation features enable you to improve the quality of your fonts. The<br>
    extended Complete Composites feature quickly adds diacritical marks to<br>
    incomplete glyphs. This powerful feature can complete over a thousand<br>
    characters within a few seconds.</p>
    <p>If you have not downloaded FontCreator 5.5 yet, get it from:<br>
    <a href="http://www.high-logic.com/download.html" title="http://www.high-logic.com/download.html">http://www.high-logic.com/download.html</a></p>
    <p>SPECIAL OFFER:<br>
    FontCreator version 5.5 is available in two editions. For a limited time the<br>
    Home Edition costs $65.00 and the Professional Edition costs $99.00, while<br>
    an upgrade from version 4 to the Professional Edition costs $59.00. People<br>
    who received a free registration code (back in January 2005) for version 5.0<br>
    can no longer use that, and have to upgrade from version 4 as well.</p>
    <p>For more detailed information about pricing, please visit:<br>
    <a href="http://www.high-logic.com/register.html" title="http://www.high-logic.com/register.html">http://www.high-logic.com/register.html</a></p>
    <p>Best regards,</p>
    <p>Erwin Denissen</p>
    <p>High-Logic Software<br>
    <a href="http://www.high-logic.com/" title="http://www.high-logic.com/">http://www.high-logic.com/</a></p>
