      <p>I use bees wax when casting type on the Thompson Caster. It makes a great mold lubricant and gives the type a pleasant smelling protective coating. It's not possible to melt beeswax candle into the mold of the other two (Monotype) casters, but the Thompson mold is very accessible, and a thin bees wax taper works well.</p>
      <p>Jim </p>
