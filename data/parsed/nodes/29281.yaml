      <p>Ben</p>
      <p>Lead can't rust, so I don't know what the coloration is in your pic. But it does look like you do have some oxidation going on there as well. This is bad. Lead oxide. White lead. This is what causes lead poisoning. Also a great ingrediant in ink—rich long lasting blacks (Gutenberg, and apparently he alone, used it). This corrosion is usually caused by a reaction of some sort combining humidity and acid. Dampness in the case (reaction with the wood lignum), salt water, urine (yes), cigarette ash (oddly enough, it eats holes in the lead), and probably others.</p>
      <p>You want to get rid of this. I don't know how effective lye is against this so much as it was used to clean ink from type in the old days. I usually recommend scrapping the type out as it is at this point hazardess.</p>
      <p>The type lice referral in the earlier post is actually the lye itself not the oxide. Long story (and printer's tale) but printer's devils (young boys) responsible for cleaning the type would sprinkle the lye into the case (as a prank). When the compositors would set the type the lye would cause them to sneeze.</p>
      <p>Gerald</p>
