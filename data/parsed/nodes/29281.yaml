      <p>Hrant</p>
      <p>I was referring to keeping the type in good shape for the long haul. You are right; if one tries to print immdiately after washing the type with kerosene or coal oil, the ink won't transfer from the roller to the type.</p>
      <p>If the type has been stored for some time the residue will have evaporated; there will be no trace of it and and type will ink again.</p>
      <p>Leaving the oily solvent on the type does prevent it from developing "type rust" (oxides) even after long periods.</p>
      <p>Jim </p>
