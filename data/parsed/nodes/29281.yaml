      <p>Lye does work but it's necessary to rinse the type thoroughly to remove all traces of the lye salts. If not the type will develop a white powdery bloom. I find it best after rinsing and rinsing, to then brush each letter with a tooth brush and something oily like kerosene or coal oil. This keeps the type from growing any more oxide.</p>
      <p>Jim</p>
