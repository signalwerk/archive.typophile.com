      <p>That "oxide" actually looks like rust, but lead does not rust. Perhaps the colouration was transferred from very wet metal galley.</p>
      <p>By the way, lye is not as readily available as one might think. It was until recently. Ask a local soapmaker, they have difficulty getting lye. The stuff sold in hardware stores usually are "now" substitute chemicals.</p>
      <p>Lead oxide should be viewed as electrolysis. This happens when metals of different nobilities are in direct contact. This activity can readily happen between type metal and metal gallies. </p>
      <p>Zinc is so low in nobility it is used as sacrificial metal to preserve the fastenings and propellers on boats. This is why metal galley cabinets should have zinc between the cabinet and the floor and inspected annually. If it turns white, which it will, replace it.</p>
      <p>That said I never suffered from lead oxide deterioration.</p>
