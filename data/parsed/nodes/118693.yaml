    <p>I’m having a Fontlab 5.1 issue some of your old hats will probably laugh about. It seems so silly, but I cannot figure this out. Since yesterday the glyphs of my font project, the outlines, have become unresponsive to clicking on them. I cannot select the outline, activate points, nothing. I can select layers, I can turn them off and on, visibility and all. I can select glyphs in the map. I can write in both, preview and the metrics window. Everything else works, except for selecting an outline in any layer (in mask it doesn’t work either).</p>
    <p>I looked for a secret lock I might have activated. The only lock in the bottom left corner of a glyphs window is for a different purpose. There doesn’t seem to be any feature that would prevent me from working with the outlines of glyphs, and yet I cannot touch my typeface again. What’s going on?</p>
