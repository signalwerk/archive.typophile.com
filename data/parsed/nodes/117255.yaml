      <p>Thank you Mike, I think you're probably correct! Adobe Caslon Pro was the first one I compared it too, but I decided against it because of the capital A if I recall correctly. However, looking at <a href="http://upload.wikimedia.org/wikipedia/commons/f/fe/Caslon-schriftmusterblatt.jpeg" rel="nofollow">this Caslon specimen</a> it looks very similar, and it seems Caslon would fit in well at the time and place it was printed.</p>
      <p>Thanks again!</p>
