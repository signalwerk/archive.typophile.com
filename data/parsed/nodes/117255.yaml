    <p>Hi! Long time lurker, first time poster, and now I need your help! This is the title page of "An Enquiry Concerning Human Understanding" from 1748 by the Scottish philosopher David Hume, but what font is it? </p><div class="imageWrap"><img src="http://typophile.com/files/66959_2_4740.jpg"></div><p></p>
