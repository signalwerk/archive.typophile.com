      <p>If you do have problems with any of the terms, post them and someone will be able to explain them clearer than I. </p>
      <p>Essentially I was saying –<br>
      Range left rather than justify (straight vertical margin on the left, uneven margin on the right);<br>
      if that doesn't work for you or you prefer justified try having the full stops (periods) and commas and parts of the hyphens go beyond the width of the column;<br>
      and introduce hyphenation into the copy to reduce the chances of wide spaces.</p>
      <p>Also the point you make about typograpically correct number of characters per line, these are only guidelines and while useful they are open to all kinds of (ab)use and interpretation.</p>
      <p>Hope I haven't confused you further:)<br>
      Tim</p>
