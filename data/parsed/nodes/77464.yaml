    html: |-
      <p>Thanks for the comments, guys.</p>
      <p>@Vladimir - "Oh I just realized the other word is 'software'!" - Bingo! This <em>Oh</em> is exactly what I am aiming for. This is what effectively defines the logo and makes it memorable. Rotating the logo is a nice idea, but IMO it will be overdoing it for a software company. Rotated version seems more fit for a clothing line manufacturer or similar.</p>
      <p>@Bendy - Totally valid point regarding the patience, Bendy. I do intend to address it by using the logo in the context that has the word "software" sitting somewhere next to the logo.</p>
      <p>@iamcorey - With regards to the typeface - the point of using HighTower was to make the logo more visually interesting and stress the <em>design</em> part. The <a href="http://typophile.com/node/56751" rel="nofollow">previous iteration</a> used Trade Gothic, but it was somewhat Blah looking to me. If you have any suggestions or ideas, I am all ears.</p>
      <p>@Matt/James - I would rather not make it easier to decipher. Using different weights, colors or hinting with kerning (as in <a href="http://typophile.com/node/56751" rel="nofollow">previous version</a>) seems to detract from the logo. It makes the logo visually more complex, but at the same time it also trivializes the concept. The grand idea is to make the logo memorable through making it unusual. To make the viewers "WTF", pause and think :) And my assumption is that present version does just that.</p>
    html_clean: |-
