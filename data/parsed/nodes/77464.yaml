      <p>That older version is a good starting point, but the all-caps, centered layout is a little dull, and I don't feel the heavy rules above and below add anything.</p>
      <p>The lowercase serif you've used on this page is more elegant &amp; visually interesting, so in those respects I think it's an improvement. But the readability problem we've discussed bothers me.</p>
      <p>Wish I had some brilliant idea to offer, but at the moment I'm drawing a blank. My only thought is that Yaletown and Software both have 8 characters, so maybe some kind of solution involving a grid might be worth exploring, like 3 rows of 8 boxes each, and grids vaguely make me think of the structure of programming. I know "Design" is only 7 characters, but maybe a workaround could be found using a dingbat character or solid box or whatever to make it 8, too.  This grid idea is just a top-of-my-head thought and it's probably a lousy idea; it's just a thought.</p>
