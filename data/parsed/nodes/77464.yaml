    <p>I just can't let go <a href="http://typophile.com/node/56751" rel="nofollow">that quirky idea</a> of mashing three words together and then splitting them into two lines.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ytsd-quirky-1_4524.png"></div><br>
    <code></code><p></p>
    <p>Just keep in mind that this is <em>not</em> meant to be instantly legible, it's an identity piece that is supposed to be memorable. It is to be primarily used for the stationery and business cards, so consider it in application. Say, letter-pressed:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ytsd-quirky-3_6134.png"></div><br>
    <code></code><p></p>
    <p>Or a bit more trivial version with lighter part being blind-pressed:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ytsd-quirky-2_4739.png"></div><br>
    <code></code><p></p>
    <p>What do you say? How is it as an <em>identity</em>?</p>
