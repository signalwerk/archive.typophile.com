    html: |-
      <p>As for Verdana and Tahoma, both are Matthew Carter designs. Tahoma's letters are narrower and it has tighter letter spacing. There is a still narrower version called Nina.<br>
      Verdana Pro from Ascender has a Black weight in addition to the Bold. Compare: </p><div class="imageWrap"><img src="http://typophile.com/files/VerdanaProBoldInUse_5302.gif"></div><div class="imageWrap"><img src="http://typophile.com/files/VerdanaProBlackInUse_3879.gif"></div> <a href="http://www.myfonts.com/fonts/ascender/verdana-pro/" title="http://www.myfonts.com/fonts/ascender/verdana-pro/">http://www.myfonts.com/fonts/ascender/verdana-pro/</a><br>
      If I was attempting to duplicate the _CORKTOWN_ sign I would create an intermediate weight of these two fonts.<br>
      --------<br>
      UPDATE:<br>
      However, IIRC, when white letters are placed on a dark background they appear thinner than when dark letters are placed on a dark background. It's worth converting Verdana Black to a white on dark version and comparing it to the _CORKTOWN_ sign.<br>
      Don<p></p>
