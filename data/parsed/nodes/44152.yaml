    <p>Howdy all,</p>
    <p>Very early thoughts on Soseus [soh-see-uhs], that is an online &amp; offline business marketing and consulting firm.  Soseus is a bastardization of "socius", which is Latin for "partner".</p>
    <p>They work mainly with medium-sized companies who are generally profitable but aren't very <em>interesting</em> (insurance, chemicals, etc), and make them so to other businesses and consumers (and a better bottom-line) -- by advising on all parts of the brand, everything from how the receptionists sound to the marketing collateral to rebuilding their website to be more functional towards what their customers want -- and end up being quite integrated with these firms along the way.</p>
    <p>I wanted to make a wordmark with a bit of corporate, a pinch of design-studio, and a personal touch... and kept coming back to something near <a href="http://michaeldoret.com/AlphabetSoup/metroscript.html" rel="nofollow">metroscript by Michael Doret</a>.  Any other thoughts?</p>
    <p>What is it you expect if you saw this logo on a business card at a tech conference... say CeBit or IEEE?</p>
    <p>All comments accepted and respected, of course!</p>
