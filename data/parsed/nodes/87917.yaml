      <p>Thank you for the link! there are some really good examples, I scanned the texts pretty fast ( but will go back to them, there are some references/names that I will be able to dig up further), yet I don't think I saw a 'name' given to this type of typography.</p>
      <p>I did find the term Artlang through wikipedia, describing for example the elvish language of JRR.Tolkien's universe as artlang, if anyone know of another way to call it..</p>
      <p>It seems like Luigi Serafini's Codex Seraphinianus is the closest thing from what I remember in the blog I mentioned, in his calligraphic, hand-drawn approach .</p>
