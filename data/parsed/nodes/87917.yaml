    <p>Hello,<br>
    Quite a while ago I used to read a blog whose owner/writer usually made block printing, his own book binding, wrote about typography and so on. One of the thing he mentioned (and did/showed) was fake alphabets, made up language that he would write and create.<br>
    It seemed like quite a lot of people did this kind of thing, and there was a name for it.<br>
    Having lost the link to the blog and google search having been unfruitful I was wondering if anyone here knew of the name ( for the act of creating a fake language/alphabet) and/or maybe a blog that would talk about such things.</p>
    <p>I am not looking for this particular blog, I assume there is more than one, the term/name however would be greatly appreciated, I do remember that the writer was a teacher at a university or art school, American or Canadian.</p>
