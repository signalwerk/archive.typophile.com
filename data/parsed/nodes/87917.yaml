      <p>Invented writing systems tend to be called <em>constructed scripts</em> (Sometimes abbreviated as "con-script", though not as often since "conscript" is a word), and they can be either be for a conlang or for existing languages. Some are little more than substitution ciphers, some are more complex.</p>
      <p><a href="http://en.wikipedia.org/wiki/Shavian_alphabet" rel="nofollow">Shavian</a>, for example, is a phonetic alphabet designed for English, intended seriously. Its glyphs so heavily rely on rotations and reflections that it is impractical for even the mildly dyslexic, but its celebrity origin gives it enough esteem that it has an official Unicode block.</p>
      <p><a href="http://www.omniglot.com/writing/alternative.htm" rel="nofollow">Omniglot.com</a> has compiled plenty of these to look at.</p>
