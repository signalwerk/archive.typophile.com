    html: <p>Yves, why is there a duplicate of all the files? Are there differences that I am not picking up? <br> <br>What font is used for the words, "vacature magazine"? <br> <br>I like everything except the picture used on the cover. The contents page may be a little unstructured, but the numbers really stand out so I would still be able to find what I want. <br> <br>So you used <a href="http://www.fontfont.com/shop/view_packages_area.ep?id=666">Info</a> and <a href="http://www.fontfont.com/shop/view_packages_area.ep?id=664">Info Display</a> as the display type and <a href="http://www.fontfont.com/shop/view_packages_area.ep?id=186">Meta</a> for body text? It took me a while to figure out the differences between the two.  (type plebian :-) When Meta is used at bodytext size, it look a lot like Info, doesn't it? But I like the end result. It is really quite clever. <br> <br>I understand what you said about keeping part of the old design. Some designers just want to change EVERYTHING and when they're done, you think, "Is this the same publication?" <br></p>
    html_clean: <p>Yves, why is there a duplicate of all the files? Are there differences that I am not picking up? <br> <br>What font is used for the words, "vacature magazine"? <br> <br>I like everything except the picture used on the cover. The contents page may be a little unstructured, but the numbers really stand out so I would still be able to find what I want. <br> <br>So you used <a href="http://www.fontfont.com/shop/view_packages_area.ep?id=666" class="link-external">Info</a> and <a href="http://www.fontfont.com/shop/view_packages_area.ep?id=664" class="link-external">Info Display</a> as the display type and <a href="http://www.fontfont.com/shop/view_packages_area.ep?id=186" class="link-external">Meta</a> for body text? It took me a while to figure out the differences between the two.  (type plebian :-) When Meta is used at bodytext size, it look a lot like Info, doesn't it? But I like the end result. It is really quite clever. <br> <br>I understand what you said about keeping part of the old design. Some designers just want to change EVERYTHING and when they're done, you think, "Is this the same publication?" <br></p>
  - id: 49673
    user: 110
    date: 2003-02-10T04:45:00
    date_raw: 10 Feb 2003 — 4:45am
    votes: null
    html: "<p><i>Yves, why is there a duplicate of all the files? Are there differences that I am not picking up?</i>  <br>  <br>No, that's me getting all confused when uploading the files. D'oh...  <br>  <br><i>What font is used for the words, \"vacature magazine\"?</i> <br> <br>Helvetica Black Italic. See, I <i>do</i> use Helvetica once in a blue moon. I was not completely brainwashed after my month at Spiekermann's. ;)  <br>  <br><i>So you used Info and Info Display as the display type and Meta for body text?</i>  <br>  <br>No, I also used FF InfoText at text sizes. I'll post a few more examples where they are used alongside each other. You'll see: it's tricky, but it works.  <br>  <br><i>When Meta is used at bodytext size, it look a lot like Info, doesn't it?</i>  <br>  <br>Well, yes, but there's a couple of details that make it work in combination with FF Meta but not with ITC Officina. Again, I'll post some extra examples.  <br>  <br><i>I understand what you said about keeping part of the old design.</i>  <br>  <br>Don't fix it when it ain't broke (although the original design was badly executed I must say). I take a humble approach in graphic design, adapting my \"style\" to the client's or project's needs. And then I go and brag about it on the message boards. =D</p>"
    html_clean: "<p><i>Yves, why is there a duplicate of all the files? Are there differences that I am not picking up?</i>  <br>  <br>No, that's me getting all confused when uploading the files. D'oh...  <br>  <br><i>What font is used for the words, \"vacature magazine\"?</i> <br> <br>Helvetica Black Italic. See, I <i>do</i> use Helvetica once in a blue moon. I was not completely brainwashed after my month at Spiekermann's. ;)  <br>  <br><i>So you used Info and Info Display as the display type and Meta for body text?</i>  <br>  <br>No, I also used FF InfoText at text sizes. I'll post a few more examples where they are used alongside each other. You'll see: it's tricky, but it works.  <br>  <br><i>When Meta is used at bodytext size, it look a lot like Info, doesn't it?</i>  <br>  <br>Well, yes, but there's a couple of details that make it work in combination with FF Meta but not with ITC Officina. Again, I'll post some extra examples.  <br>  <br><i>I understand what you said about keeping part of the old design.</i>  <br>  <br>Don't fix it when it ain't broke (although the original design was badly executed I must say). I take a humble approach in graphic design, adapting my \"style\" to the client's or project's needs. And then I go and brag about it on the message boards. =D</p>"
