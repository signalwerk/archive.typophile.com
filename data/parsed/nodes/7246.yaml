    html: "<p>I'm reading a lot of useful hints in the replies above (especially Paul's points 5 and 6), but I have to agree with Rodolfo. There are no hard and fast rules, not even the \"don't match up fonts that are very close\". For every rule summed up in this thread there are beautiful examples that contradict that rule. Just at the top of my head, check out \"The New Cranbrook Design Discourse\" (1991). It's one of the first books I purchased after joining FontShop, and it made me realize that the possibilities are endless. For example on some pages Bodoni changes abruptly into an Egyptian at a slightly smaller size so the colour almost doesn't change. The effect, although a bit jarring at first sight, is strangely beautiful and has a subtle tension to it. <br> <br>The big thing is that there are many more parameters than just the type design that influence: colour, size, spacing, setting... When designing stuff for FontShop, I had to combine sometimes unwieldy amounts of different typefaces in one design, and somehow there was always a way to make it work. It takes a lot of balancing and trial-and-error, but it's an extremely satisfying exercise and makes you look at type in a totally different way. <br> <br>Karen, one of my more succesful magazine (re)designs combined FF Info with FF Meta, very similar faces, both by Erik Spiekermann. Which proves contrast isn't always the way. Furthermore the \"always use a sans/serif combo\" makes me feel really uneasy: it reminds me of that infamous quote from some version of the QuarkXPress manual: \"Always use Helvetica for headlines and Times for text\" (authentic!). On the other hand I've also done magazines which have more than 7 or 8 very different faces on one page, and that works perfectly well too. Go figure. ;)</p>"
