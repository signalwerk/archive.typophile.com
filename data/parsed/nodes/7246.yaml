    html: "<p>Hrant: I see what you mean. That was an experiment in hierarchy that some people had problems with, maybe rightly so. I'm still not sure. But what did Oscar Wilde say? \"Experiment is what everyone call their mistakes.\" ;) <br> <br>Bembo looks <i>sooo</i> British to me (thanks to Why Not Associates), so I'd go for the obvious <a href=\"http://www.myfonts.com/fonts/agfa/gill-sans/\"> Gill Sans</a>, the sharp <a href=\"http://www.myfonts.com/fonts/bitstream/geometric-415/\"> Metro</a> (yeah I know that's an American by Dwiggins), or the simply delightful <a href=\"http://www.typography.net/\"> Bliss</a>.</p>"
    html_clean: "<p>Hrant: I see what you mean. That was an experiment in hierarchy that some people had problems with, maybe rightly so. I'm still not sure. But what did Oscar Wilde say? \"Experiment is what everyone call their mistakes.\" ;) <br> <br>Bembo looks <i>sooo</i> British to me (thanks to Why Not Associates), so I'd go for the obvious <a href=\"http://www.myfonts.com/fonts/agfa/gill-sans/\" class=\"link-external\"> Gill Sans</a>, the sharp <a href=\"http://www.myfonts.com/fonts/bitstream/geometric-415/\" class=\"link-external\"> Metro</a> (yeah I know that's an American by Dwiggins), or the simply delightful <a href=\"http://www.typography.net/\" class=\"link-external\"> Bliss</a>.</p>"
