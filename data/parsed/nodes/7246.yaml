    html: <p>Meta + Univers IMHO is a very bad match. They look too similar to have any contrast. I look for contrast when matching my fonts.  <br> <br>But I am often tempted to have more than two font families. In the end it often looks OK to me, but I have read so often that we should not use more than two typefaces in a publication. But the reason behind the rule is never stated. Many commercial publications definitely use more than two faces. <br> <br> <br></p>
