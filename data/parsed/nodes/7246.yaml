    html: "<p>I have been reading Bringhurst. He is eloquent and lucid, but I find he uses too many technical/typograhy terms(?). <br> <br>I always use a serif, sans serif combo, just that sometimes, it is not that clear cut. For example, would a serif font like Minion go with Fenice. Assuming the entire Minion family is used, for body and subheads, but Fenice is used at only 36pt and above. <br> <br>It would be really interesting to know the specific fonts you guys have married with what you consider good results. <br> <br>I'll post a pair to start: Franklin Gothic and Berkeley. <br>This was a combo used when my previous publication was redesigned. <br> <br>Gerald: Bringhurst suggested Univers and Meridien, both by Frutiger, but somehow they don't really work well together, or I haven't found a way to make them work. I am still trying to place my finger on why. Possibly I haven't found the right sizes to combine them at. <br> <br>The book cover is interesting because most people would not know that the fonts are different. They look similar enough to pass off as one font, so it doesn't really bother me. <br> <br>Would be interesting to know what the others think though.</p>"
