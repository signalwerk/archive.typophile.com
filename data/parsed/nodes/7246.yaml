    html: "<p>Hi Karen and Paul, sorry it took me so long to reply, but every time the fun starts around here it's bedtime where I live. :/ <br> <br>The quote from the QuarkXPress manual is from a slide Erik Spiekermann used in his FontShop presentations. My second favourite is his \"Thou shalt have no other typeface before me\" slide listing all the German companies that use Helvetica as their corporate ID type (see also his delightful \"Rhyme &amp; Reason: A Typographic Novel\" pages 100-101) <br> <br>The most interesting thing I learned when at FontShop was something Neville Brody said: \"Question every rule. Decide for yourself which ones are valid.\" That has been my main rationale ever since. <br>I don't consider myself a \"real\" graphic designer:  I approach typography more like an architect or a researcher/scientist. My designs are almost always utilitarian, none of the flashy stuff that gets published in graphic design mags or typography annuals. I'm willing to post some samples to illustrate what I mean, but don't get your hopes up too high. Give me a day or two, as I'll have to search through some back-up CD's. <br> <br>The Info and Meta problem was a typical case of setting myself a challenge (I do quite often make things hard on myself just for fun). I hope my English won't fail me in trying to explain this case. <br>I got handed an existing large format magazine which was pretty poorly designed. It used FF Meta as headline face and custom condensed Futura for text. <br>Instead of redesigning the whole thing and get it over with, I decided to try to find a valid solution using only design elements from the original lay-outs, just like a teacher would help a pupil without imposing his own creative vision. The only thing I dropped was Futura: I avoid overused typefaces unless I can find a watertight good reason use them. As I realized Meta is in fact overused too, I needed to find a way to keep it interesting. And this is a situation where I usually fall back on Neville's advice. I contradicted the rule \"try using typefaces that belong to the same time period or that were designed by the same designer\" with the rule \"never use two typefaces that are too similar\" by adding Info to the mix. The research and resulting design process was extremely gratifying, although the end result is, well, I'm certainly not gonna win any awards. ;) <br> <br>See if you agree once you've seen the samples and let me know what you think.</p>"
