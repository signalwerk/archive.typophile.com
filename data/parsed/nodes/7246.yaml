    html: <p>There are really no hard and fast rules... I think contrast is important, otherwise you might as well just use one typeface. But it is also not very interesting if the types have nothing to say to each other. <br> <br>It is very common to see neo-grotesques like Univers being paired with humanist sans like Meta these days. I guess designers tend to think humanist sans are slightly more legible than neo-grotesques? So they use the Univers for display and Meta for text. You see, that seems a bit redundant and only confuse the stylistic direction of the publication </p>
