    html: "<p><i>Rodolfo, how do you say \"chupa\" in Portug[u]ese?</i> <br> <br>If you mean \"it sucks\", \"chupa\" is a <i>literal</i> translation:  <br>it's a word with some meanings, including erotic ones, <br>but not the one you mean. ;)  <br> <br>I don't think so, Hrant. I think that the factors that <br>integrate those two typefaces (the general lightness,  <br>the positioning in the space) are stronger than the  <br>factors that pull them apart (most glaring for me is  <br>the difference in stress in the 'o').  <br> <br>A design like this could serve as a litmus test for  <br>type neophytes. It's like twins, that look identical  <br>at first but as you know them better you see  <br>they're totally different. <br> <br>--- <br> <br>Paul, the principles you enumerate are sound and useful. <br> <br>But I'd add that each design problem creates its own rules <br>and principles. And sometimes these contradict the tidy <br>formulae one would have followed. So, the best thing, I <br>think, even when one's not very experienced, is to have <br>principles like those in mind, but try to look at the problem <br>with fresh eyes, study it very well and 'let it speak'. <br> <br>regards</p>"
