    html: "<p>Pairing typefaces is a challenge I constantly hit in graphic design, which is one of the reasons I decided to learn more about typography.  It was something I didn't know nearly enough about. <br> <br>I'm still learning, but here are a few rules that seem to work: <br> <br>1. The obvious: pair a serif with a sans-serif when possible.  This is a pragmatic rule simply because you usually need a display face and a text face for design. <br> <br>2. Go for balance, not contrast.  At small point sizes, a bold, robust sans will balance your serif text blocks.  At large sizes, a light sans or humanist might balance your serif better.  Balance is possibly the most important rule of design. <br> <br>3. Match x-height as close as possible. <br> <br>4. Match the geometry as close as possible.  A gothic sans (straight-sided O's) might not be the best companion for an old-style serif (circular O's). <br> <br>5. Match the \"voice\" of all the fonts you choose to the project.  Certain fonts will never work for a telecom ID system.  Others will never work for a basketweaving brochure.  And so on. <br> <br>6. The more you know about the background of your fonts - geography, history, etc. - the better you'll be able to make natural choices. <br> <br>Again, I'm still somewhat new at this. <br> <br>Paul</p>"
    html_clean: "<p>Pairing typefaces is a challenge I constantly hit in graphic design, which is one of the reasons I decided to learn more about typography.  It was something I didn't know nearly enough about. <br> <br>I'm still learning, but here are a few rules that seem to work: <br> <br>1. The obvious: pair a serif with a sans-serif when possible.  This is a pragmatic rule simply because you usually need a display face and a text face for design. <br> <br>2. Go for balance, not contrast.  At small point sizes, a bold, robust sans will balance your serif text blocks.  At large sizes, a light sans or humanist might balance your serif better.  Balance is possibly the most important rule of design. <br> <br>3. Match x-height as close as possible. <br> <br>4. Match the geometry as close as possible.  A gothic sans (straight-sided O's) might not be the best companion for an old-style serif (circular O's). <br> <br>5. Match the \"voice\" of all the fonts you choose to the project.  Certain fonts will never work for a telecom ID system.  Others will never work for a basketweaving brochure.  And so on. <br> <br>6. The more you know about the background of your fonts - geography, history, etc. - the better you'll be able to make natural choices. <br> <br>Again, I'm still somewhat new at this. <br> <br>Paul</p>"
