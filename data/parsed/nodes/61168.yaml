    html: <p>I have found this to be relatively common, especially for publication design. Check out Font Bureau's <a href="http://fontbureau.com/help/testing" rel="nofollow">testing license</a> for an example. It is based on the licensee's honesty, but, after all, so are standard license agreements.</p>
