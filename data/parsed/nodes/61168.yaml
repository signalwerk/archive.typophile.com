  html: |-
    <p>Hi everyone,</p>
    <p>Wondering if anyone can offer me insight on this: </p>
    <p>I've been approached by a New York designer to supply my Halvorsen family free for a trial period, for the purposes of a pitch. That is, the designer wants to purchase but needs to design some roughs first for management approval, and requests access to the fonts in order to do so. The designer named another foundry (whom I have emailed for verification) which has previously supplied fonts in this way.</p>
    <p>This seems a dangerous practice to me. Even though I have no reason to doubt the honesty of the designer, I'm just wondering if anyone else has been approached in this way and if so, what other solutions are possible?</p>
    <p>Thanks, Wayne  | Australian Type Foundry</p>
