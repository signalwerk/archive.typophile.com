      <p>Lawrence K Lo has done some work with phonetics and historical liguistics on his site <a href="http://www.ancientscripts.com/index.html" target="new">AncientScripts.com</a>.</p>
      <p><a href="http://www.omniglot.com/" target="new">The Omniglot</a> site is worth digging through as it has many links and sub-links to experimental, con-script and syllabic systems, including <a href="http://www.omniglot.com/writing/phonogic.htm" target="new">The Phonogic Alphabet</a> a creation of Charles Smith. </p>
      <p>I know you mentioned no interest in IPA, but Luc Devroye’s site has many jump points on his <a href="http://jeff.cs.mcgill.ca/~luc/phonetic.html" target="new">Phonetics</a> page that might lead you towards new work as well.</p>
