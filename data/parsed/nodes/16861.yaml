  html: |-
    <p>Hello everyone,</p>
    <p>First of all I want to say I really love this site - been here for only a few days but I’m already hooked. :)</p>
    <p>I’m doing graphic design at KABK, The Hague; though I’m still in my first year (so everything is new and challenging) I’m sure type design will be one of my main interests. Certainly after running into Typophile.com...</p>
    <p>As I have a M.A. in linguistics (syntax) I’m quite focused on the relation between language theory and type design. That sounds vague, and maybe it is; I wonder if there are people who have incorporated both perspectives on type and language (internal structure and external design) into one coherent vision.</p>
    <p>More precisely spoken: does anyone know where I could find information about phonetic alphabets? I do not mean the regular versions of IPA but newly designed alphabets which provide a single symbol for every possible sound in spoken language.</p>
    <p>(mwah, does this tend to be a little formulaic?)</p>
    <p>Anyway, hoping for some helpful response...</p>
    <p>Ringo</p>
