  - id: 588558
    user: 8664
    date: 2014-09-17T10:31:00
    date_raw: 17 Sep 2014 — 10:31am
    votes: null
    html: |-
      <blockquote><p>Maybe the line languagesystem DFLT dflt; is not getting implemented even though the warning says it will work?</p></blockquote>
      <p>That's it.<br>
      FLS 5.1.x and later versions know about script DFLT. Old FLS 5.0.4 does not.<br>
      To address FLS 5.0.4's trouble with script DFLT, Adam Twardoch has made a <a href="http://typophile.com/node/29469#comment-168692" target="_blank" rel="nofollow">nice script</a>. You would add the line <em>languagesystem DFLT dflt;</em>, you'd generate a buggy TTF or OTF from FLS 5.0.4, and finally you would run the font through the script to fix the TTF or OTF. Unfortunately, the download link which Adam provided back then does not seem to work any more.</p>
