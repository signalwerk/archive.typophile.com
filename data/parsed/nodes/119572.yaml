    <p>We have a font we've been using for at least 3 years, developed in FontLab, generated as OTF, primarily for use in InDesign, gets updated from time to time.</p>
    <p>Somewhere along the line the class based kerning stopped working in InDesign. I know it WAS working because when we first completed the font (compiled form the client's multiple fonts) we needed to use  Karsten Luecke's fabulous "KLTF-MakeKernFeature" Python script to compile the kern feature.</p>
    <p>Unfortunately, thus far, I've been unable to determine when the problem began occurring. I only have old FontLab files as back up and NOT the old OTF files, will possibly try generating those to see what comes of it.</p>
    <p>So, while I investigate this further, entering panic mode, I thought I'd post asking what would cause this? That is, the class based kerning to not work in InDesign CS6.</p>
    <p>Thank you,<br>
    Ken</p>
