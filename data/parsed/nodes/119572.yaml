      <p>It is not a FontLab Studio issue nor an issue with my script.</p>
      <p>We solved it off the list, but since the issue (in a nutshell: features&nbsp;stopped working in a more recent version of InDesign) has come up a few times recently, it seems worth to remind of adding proper languagesystem statements when defining OTL features:</p>
      <p>Defining OTL features is only part one of the job, the other part consists in associating these features with scripts and languages – applications apply only those features that are associated with script and language that match those of a given text.<br>
      In AFDKO's OpenType feature file syntax, there are two ways to associate features with scripts and languages.<br>
      1) Stating <em>script [script name];</em>, stating <em>language [language name];</em>, followed by the substitution or positioning statements, right in the feature definition.<br>
      2) Enumerating all possible script/language combinations in languagesystem statements that precede the feature definitions. (In FLS, their proper place is in the OpenType Panel's bottom right field.) These statements look like this:<br>
      <em>languagesystem DFLT dflt;<br>
      languagesystem latn dflt;<br>
      languagesystem grek dflt;<br>
      languagesystem cyrl dflt;</em><br>
      Now, features whose definitions do not mention any script and language will be associated with script/language combinations as mentioned in these languagesystem statements.</p>
      <p>If languagesystem statements are missing, AFDKO will silently add one <em>but not all that may be required</em>. As an effect, you may end up generating mal-functioning fonts without even noticing. This is what happened here.</p>
      <p>For details, please see the <a href="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html#4.b" target="_blank" rel="nofollow">AFDKO's OpenType Feature File Specification</a>. Do not miss the <a href="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html#4.h" target="_blank" rel="nofollow">examples</a>.<br>
      A more readable version is in Tal Leming's <a href="http://opentypecookbook.com/rules.html" target="_blank" rel="nofollow">OpenType Cookbook</a> (search for the "Language Systems" section).</p>
      <p>Some more background can be found in the <a href="http://www.microsoft.com/typography/otspec/chapter2.htm" target="_blank" rel="nofollow">OpenType specification</a> (search for the "Table Organization" section).</p>
