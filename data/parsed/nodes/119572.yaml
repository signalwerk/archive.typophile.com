      <p>So, now I'm wondering about InDesign's "[No language]" setting.<br>
      I've now defined the following for the languages:<br>
      <code>languagesystem DFLT dflt;<br>
      languagesystem latn dflt;<br>
      languagesystem grek dflt;<br>
      languagesystem copt dflt;<br>
      languagesystem cyrl dflt;<br>
      languagesystem hebr dflt;<br>
      languagesystem math dflt;<br>
      languagesystem runr dflt;</code></p>
      <p>I would have thought that <code>languagesystem DFLT dflt;</code> would have taken care of this, but apparently not.</p>
      <p>It would be accidental if we had "[No language]" applied in InDesign and it seems crazy that InD will, potentially, ignore all features if "[No language]" is applied.</p>
      <p>Does anyone know if there is anything I can do in the font to avoid having InD ignore the features when "[No language]" is applied?</p>
      <p>Many thanks,<br>
      Ken</p>
      <p>EDIT: ACaslonPro goes not have the problem, going to investigate that.<br>
      Also, when I compile the font I'm getting the following warning from FontLab:<br>
      <code>[WARNING]  Use of DFLT tag has been deprecated. It will work, but please use 'dflt' instead. [C:/Users/kenkrugh.TEKNTYPE/Documents/FontLab/Studio5/fontlab.fea 90]</code>.<br>
      Maybe the line <code>languagesystem DFLT dflt;</code> is not getting implemented even though the warning says it will work?</p>
