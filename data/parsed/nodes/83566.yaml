  html: |-
    <p>Hi,</p>
    <p>Can someone name this?</p>
    <p>It's very close to Helvetica, but the uppercase G is similar to the one in Akzidenz Grotesk, the 'a' is a little different, and the Å is different in that the circle touches the rest of the letter.</p>
    <p>Here's a link: <a href="http://www.b14cms.dk/users/koes.dk/www/files/pdf/Walk_this_way_folder.jpg" title="http://www.b14cms.dk/users/koes.dk/www/files/pdf/Walk_this_way_folder.jpg">http://www.b14cms.dk/users/koes.dk/www/files/pdf/Walk_this_way_folder.jpg</a></p>
    <p>I can't find a specimen of Neue Hass grotesk to see if it has an alternative uppercase 'G' like this, but I don't think so.</p>
