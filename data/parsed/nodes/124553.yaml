    <p>Good morning, everyone. I’m new at this forum, although I’ve been reading it since a very long time. My name is Mauricio Villamayor, I'm designing a calligraphic typeface for my thesis and I have a problem in doing it. I hope if you can help me with this situation.</p>
    <p>Basically, the problem is with the ligatures. The typography has a lot of them, since the calligraphic characters are more complicated to bond harmonically. The ligatures work in all the combinations, except in the accented (acute accent) letters.<br>
    For example, a specific ligature exists for the combination “yo” (which works), but when I create the combination “yó”, it doesn’t work, indicating an error when I compile the ligaduras.</p>
    <p>This is the specific error that shows:<br>
    "[FATAL]  invalid token (text was "ó") [C:/Users/Maui/Documents/FontLab/Studio5/fontlab.fea 4]"</p>
    <p>Is it possible to create ligaduras with accented letters? Or am I doing something wrong?<br>
    Maybe an error in the language configuration of the font?<br>
    I searched a lot on the Internet about what could be the problem, but nobody seems to have a problem like mine (maybe because in English there are no accented letters).<br>
    I would be really thankful if you could help me, I never had to do ligaduras with accented letters and right now I’m in a hurry since this work is for my thesis.</p>
    <p>Thank you so much!</p>
