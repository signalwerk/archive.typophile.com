    html: <p>You need to use correct glyph names. The error implies that your Opentype code contains "ó" where it should say "oacute". Every glyph name must start with a letter and may only contain A-Z, a-z, numerals, underscore (for ligatures), and period (to suffix alternates). If you give a glyph a name that does not fit these criteria, it cannot be referenced in the code. So, for example, the yó ligature glyph should be named "y_oacute".</p>
