    html: <p>The original was Faktos by <a href="http://luc.devroye.org/fonts-30622.html" target="_blank" rel="nofollow">Cory Maylett</a>, 1991. It was a postscript font. Dieter Steffmann probably did the conversion to Truetype.</p>
