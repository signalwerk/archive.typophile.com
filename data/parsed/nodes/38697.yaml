      <p>I like the arcs as well. To me it could represent the big horizon farmers see. I think if you removed one set of drops, and then angled the others to the horizon, it might strengthen that look. </p>
      <p>Then I would look at playing with color/gray to change one of the outer dots, or a row of dots, to provide the idea of satellite's sending down information.</p>
      <p>Don't know if any of these would work, but I would play with them.</p>
