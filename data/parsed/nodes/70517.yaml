    html: <p>According to McGrew Rockwell was a 1931 reissue of Litho Antique from 1910 but he doesn’t have any information on the name. Given how opportunistic type vendors were in that era my guess is that ATF was just trying to cash in on Norman Rockwell’s popularity.</p>
