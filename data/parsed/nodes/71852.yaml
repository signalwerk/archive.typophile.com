      <p><cite>Recently had some articles of mine swiped from both my blog AND an online publication.</cite></p>
      <p>I’ve noticed this happens with everything I write for ILoveTypography. From what I can tell they’re mostly the work of design and CS students (often in India) who use it as filler content for their site design and CMS projects. Google somehow comes across them and because the content matches some popular site they temporarily jump up in the search rankings. After a little while they either drop to an irrelevant rank or the semester ends.</p>
