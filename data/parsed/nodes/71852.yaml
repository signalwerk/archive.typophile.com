      <p>It's still funny to see one of their "Competencies" is ... Web design! (Perhaps not so funny if you're the victim.)</p>
      <p>Tell everybody you know these guys stole your design. Post it on your web site, in blogs, on Twitter. If you come across a discussion of site theft, hop in and say "Yah, that happened with me too". Don't forget to add all names you come across -- whois returns one Jojo Garcia <a href="mailto:bpgjr@yahoo.com" rel="nofollow">bpgjr@yahoo.com</a> as their administrative contact.</p>
      <p>The purpose of this all? Well: if someone googles them by company name (or aforementioned Jojo Garcia), <em>your</em> comment on their 'competencies' will <em>also</em> come up. That ought to give possibly interested clients something to think about.</p>
