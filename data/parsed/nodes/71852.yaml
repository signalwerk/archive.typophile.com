    html: |-
      <p>Sending C&amp;D letters is pointless. You have to solve this from another end.</p>
      <p>Their website IP address is 174.132.225.245, which shows up as being under control of theplanet.com, which is a Texas-based company, which in turn is great news for you. All you need to do is send a free-form copyright violation notice to <a href="mailto:abuse@theplanet.com">abuse@theplanet.com</a> and they should be able to take care of taking the site down. This will not prevent Philippine clowns from moving the site elsewhere, but at least you can ensure they won't be hosting it in any civilized country. </p>
      <p>Additionally, if you really want to press them, send a complaint to <a href="http://www.domainspricedright.com" title="http://www.domainspricedright.com">http://www.domainspricedright.com</a>, which is the registrar of their domain name, and ask for the domain cancellation.</p>
