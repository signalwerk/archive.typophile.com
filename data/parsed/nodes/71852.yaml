    <p>Hi all,</p>
    <p>I've just discovered a web design company in the Philippines has entirely copied my personal portfolio website and are using it as their own. I created mine a few months ago and a little while ago, I noticed a particular IP address in Manila had been downloading all the pages. </p>
    <p>They've directly copied my code (even leaving in my analytics tracking code and my name in the image alt tags!) and used my graphics as well (icons, navigation, etc). They've also left in a photograph of my work in the slideshow on the front page. </p>
    <p>My website is <a href="http://www.coullon.com" title="http://www.coullon.com">http://www.coullon.com</a> and the one in question is <a href="http://www.wwmhosting.com/index.html" title="http://www.wwmhosting.com/index.html">http://www.wwmhosting.com/index.html</a></p>
    <p>As I've never encountered this before, I was wondering if anyone knows anything I could do about it?  </p>
    <p>Thanks!</p>
    <p>Claire</p>
    <p>Edit for screenshot: </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/wanbolsite_4038.jpg"></div><p></p>
