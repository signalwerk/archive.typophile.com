      <p>The bowl of /p and, to a lesser degree, /q, looks like it's leaning backwards.</p>
      <p>I'm not convinced of the flattish bottoms of /b /d.</p>
      <p>The /m and /w look somewhat asymmetric; I think the apex of the second arch in /m and first arch in /w might not be centered. Maybe even the two arches are of different widths?</p>
      <p>The /f and /t still strike me as too narrow.</p>
