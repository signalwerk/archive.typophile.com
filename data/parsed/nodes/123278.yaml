    <p>I started making alternates for Gidole and as someone also pointed out in that thread it looked more like a separate font.<br>
    So I made it into it's own font (borrowing some characters from Gidole) and would love some feedback.</p>
    <p>More screenshots over at: <a href="https://www.behance.net/gallery/23391815/Gidolinya-Free-Typeface" title="https://www.behance.net/gallery/23391815/Gidolinya-Free-Typeface">https://www.behance.net/gallery/23391815/Gidolinya-Free-Typeface</a></p>
