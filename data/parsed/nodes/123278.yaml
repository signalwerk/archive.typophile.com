    html: |-
      <p>Hi, thanks for the great feedback again </p>
      <p>I wasn't happy with p,q,d,b either but they are difficult to master because it should look somewhat symmetrical and effortless but still be balanced. It's especially difficult width g,p,q because I want to accentuate the corner were the stem is cut of but that causes them to lean a little bit so it's a matter of finding the right compromise.</p>
      <p>m+w were perfectly symmetrical (photoshop rendering isn't always 100% accurate) but now I've tried making the m asymmetrical (apex, not width).</p>
      <p>I've also made f+t a bit wider</p>
      <p><a href="http://typophile.com/files/gidolinya_6224.png" title="http://typophile.com/files/gidolinya_6224.png">http://typophile.com/files/gidolinya_6224.png</a></p>
