    html: <p>Joe's criticism (at least the one in his Print piece) was partly based on an admission by Gill himself (during an interview) that the whole process was a committee-decision type deal with deadline pressures and inadequate direction. <br> <br>To me that just means it could have been even better, since I think Tiresias is a useful design. <br> <br>hhp <br></p>
