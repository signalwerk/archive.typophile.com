  html: "<p>Anyone have any comments on Tiresias? It is a typeface designed for those with low vision, and comes in several flavors:  for printed matter, computer monitors, signage, etc. <br> <br>The designer is listed as Dr. John Gill, with help from Bitstream. A little more digging brought up the name Peter O'Donnell (Type Consultant). <br> <br>The site at <a href=\"http://www.tiresias.org/index.htm\" target=\"_blank\">http://www.tiresias.org/index.htm</a> has a bunch of interesting stuff. <br> <br>Jay Fraser</p>"
  html_clean: "<p>Anyone have any comments on Tiresias? It is a typeface designed for those with low vision, and comes in several flavors:  for printed matter, computer monitors, signage, etc. <br> <br>The designer is listed as Dr. John Gill, with help from Bitstream. A little more digging brought up the name Peter O'Donnell (Type Consultant). <br> <br>The site at <a href=\"http://www.tiresias.org/index.htm\" target=\"_blank\" class=\"link-external\">http://www.tiresias.org/index.htm</a> has a bunch of interesting stuff. <br> <br>Jay Fraser</p>"
