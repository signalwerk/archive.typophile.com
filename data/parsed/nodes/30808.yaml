    html: |-
      <p><em>these groundbreaking sans serif typefaces</em></p>
      <p>We've seen informal faces before. Sumner Stone has done a few.<br>
      We've seen underexposed/overexposed and "press gain" artefact faces effect before -- from Akira in Acanthus, for instance.</p>
      <p><em>a new level of subtlety</em></p>
      <p>We've had micro-detailed sans faces before. Cronos, for instance, approaches it from the typographic direction, whereas Highlander does so from the lettering direction. Both these are faces carried by Linotype. </p>
      <p>This is not about the typeface, but about the marketing and publicity.<br>
      It's Palatino that isn't, with dodgy hype.<br>
      For Zapf and Typophile, it could be tighter.</p>
