    <p>(From the January issue of <a href="/wiki/Linotype" class="freelinking" rel="nofollow">Linotype</a>'s <a href="http://www.linotype.com/38-21255/issue200701.html" rel="nofollow">LinoLetter</a>)</p>
    <p>For more than half a century, Prof. <a href="/wiki/Hermann%20Zapf" class="freelinking" rel="nofollow">Hermann Zapf</a> has been designing typefaces that have helped define how our world communicates. Now we are pleased to present his newest series of families, Palatino Sans and Palatino Sans Informal. An extension of the <a href="/wiki/Palatino" class="freelinking" rel="nofollow">Palatino</a> idea, which was first made manifest in 1950, these groundbreaking sans serif typefaces offer another interpretation of the sans serif genre. Whether set alone or used in combination with each other or the Palatino, Palatino Linotype, or Palatino nova typefaces, Prof. Zapf’s new font families bring a new level of subtlety to typography. In celebration of the release of these new families, customers who make any purchase at Linotype.com through February 28, 2007, will receive Palatino Sans Informal Light as a test font – absolutely free!</p>
    <p>More information about <a href="http://www.linotype.com/111707/palatinosans-family.html" rel="nofollow">Palatino Sans</a> and <a href="http://www.linotype.com/113189/palatinosansinformal-family.html" rel="nofollow">Palatino Sans Informal</a> can be found at – <a href="http://www.linotype.com/3201/palatinosans.html" title="http://www.linotype.com/3201/palatinosans.html">http://www.linotype.com/3201/palatinosans.html</a></p>
