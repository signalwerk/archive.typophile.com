      <p>I’ve noticed this a lot, and I’m not really sure why it happens.  I had assumed it was probably just the kind of thing you should expect from an automatic process like this.</p>
      <p>You may still want to split that point, though.  Notice that the lower handle is below the other handle on the right (and probably the point to which it belongs).  Adding a point somewhere in the middle should prevent this and allow you to retain basically the same curve.  I don’t have any idea if that will have any effect on the autobold, though.</p>
