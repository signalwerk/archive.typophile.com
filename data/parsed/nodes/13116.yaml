    <p>Basically, why does what is illustrated in the attachment happen sometimes? Making a new weight should be simplified by something that will expand an outline by a set number of units, not complicated. There’s still so much to do to create a true bold, cleaning up unasked for points is a time waster. I figure I’m doing something wrong or else it wouldn’t need to generate these points (and sometime seperate contours). See attached gif to make sense of this.<br>
    Thanks</p>
