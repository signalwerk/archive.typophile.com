    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Subsription_Extension_Aug2_typophile_4271.png"></div><p></p>
    <p>Download the extension for free and use from any Fonts.com subscription plan – including free plans</p>
    <p>Access to desktop fonts and Web fonts to boost creative freedom – yes! Through your favorite Adobe applications – yes! </p>
    <p>The Fonts.com Extension for Adobe Creative Cloud allows you to try, install and synchronize desktop fonts directly from within Adobe apps including Photoshop, Illustrator and InDesign. This extension also works with any <a class="freelinking external" href="http://www.fonts.com/web-fonts/plans-and-pricing " rel="nofollow"> Fonts.com Web Fonts subscription plans</a>, including free plans, making it free and easy to experiment with thousands of desktop fonts within your favorite design apps. </p>
    <p>“The Fonts.com Extension liberates designers to put type first, and makes working with fonts easy, fast and fun,” said Chris Roberts, vice president and general manager of Monotype’s e-commerce group. </p>
    <p>All the functionality of Monotype’s <a class="freelinking external" href="http://skyfonts.com/ " rel="nofollow"> SkyFonts</a> client for activating fonts is built into the extension. An unobtrusive window within the application allows subscribers to search for and activate fonts right in a document. Free plan subscribers can use the extension to initiate five minute trials of fonts while higher level subscribers can use the extension to install mockup fonts and desktop fonts included with their plans. </p>
    <p>To get started:</p>
    <p>1.	Sign up for a Fonts.com Web Fonts subscription for free: <a href="http://bit.ly/15HRnN4" title="http://bit.ly/15HRnN4">http://bit.ly/15HRnN4</a><br>
    2.	Download the Fonts.com Extension for Adobe Creative Cloud free: <a href="http://bit.ly/1enF4HB" title="http://bit.ly/1enF4HB">http://bit.ly/1enF4HB</a><br>
    3.	Download SkyFonts at no cost and install it on one of your devices – click here: <a href="http://bit.ly/16p32PP" title="http://bit.ly/16p32PP">http://bit.ly/16p32PP</a><br>
    4.	Read more on the Fonts.com blog: <a href="http://bit.ly/16uYJV7" title="http://bit.ly/16uYJV7">http://bit.ly/16uYJV7</a></p>
