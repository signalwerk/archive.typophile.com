    html: |-
      <p>Do you mean <a href="http://www.boldts.net/photos/TorFd.4.jpeg" target="_blank">like this</a>?</p>
      <p>If so, it’s <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=ITC.108267.0.3&amp;attributes.sampleSize=48&amp;sampleText=Fashion+District&amp;sampleSize=32&amp;attributes.paraSize=14&amp;paraSize=14" target="_blank">Korinna Bold</a> for the top and something like <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=FB.8029.0.2&amp;attributes.sampleSize=48&amp;sampleText=CLARENCE+SQ.&amp;sampleSize=48&amp;attributes.paraSize=14&amp;paraSize=14" target="_blank">Interstate Condensed</a> for the bottom.</p>
      <p> - Lex</p>
