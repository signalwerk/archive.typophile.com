    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : Keith Chi-hang Tam</strong></p>
    <p>Keith Tam was born and raised in Hong Kong and has lived in the UK and Canada. He is a communication designer who specializes in typography. He is a lecturer of Visual Communication at the School of Design, The <a href="/wiki/Hong%20Kong%20Polytechnic%20University" class="freelinking" rel="nofollow">Hong Kong Polytechnic University</a>, with a focus on typographic and publication design. Keith's design and research interests include book and editorial design, information design, typeface design, <a href="/wiki/calligraphy" class="freelinking" rel="nofollow">calligraphy</a> and lettering, visual identities and designing for multiple languages. He is the designer behind <a href="/wiki/Arrival" class="freelinking" rel="nofollow">Arrival</a>, a legible and humane sanserif typeface designed for directional signing, currently used by the campus wayfinding system of the <a href="/wiki/University%20of%20Reading" class="freelinking" rel="nofollow">University of Reading</a>, UK. He co-founded <a href="/wiki/Type%20Initiative" class="freelinking" rel="nofollow">Type Initiative</a> with Greek type designer <a href="/wiki/Michail%20Semoglou" class="freelinking" rel="nofollow">Michail Semoglou</a> in 2005, and their typefaces are on sale at the type co-op <a href="/wiki/Village" class="freelinking" rel="nofollow">Village</a>. Keith holds a B Des in Communication Design from the <a href="/wiki/Emily%20Carr%20Institute" class="freelinking" rel="nofollow">Emily Carr Institute</a> in <a href="/wiki/Vancouver" class="freelinking" rel="nofollow">Vancouver</a>, <a href="/wiki/Canada" class="freelinking" rel="nofollow">Canada</a> and an MA in Typeface Design from the Department of Typography &amp; Graphic Communication at the University of Reading, UK.</p>
    <p>He was also noticeably absent from <a href="/wiki/Typecon" class="freelinking" rel="nofollow">Typecon</a> 2005 which made many people angry, or at least sad.</p>
