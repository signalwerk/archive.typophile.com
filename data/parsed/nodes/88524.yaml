    html: |-
      <p>The appx version will typically not be any better than what Fontlab can come up with: awful! </p>
      <p>If you are up for some manual labour, I suggest you try your hands at KLTF's Transformer script. With it you lock any number of nodes, select the ones you want to move and the script takes care of the interpolation. You have to do it glyph by glyph, but it's very helpful to get the stem weight vs. notan weight right.</p>
