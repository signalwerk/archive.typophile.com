    votes: null
    html: "<p>Quick guide: Lock all left edges, move all right edges. This will help keep the black/white rythm balanced. I guess you can figure out the vertical direction yourself. It's more dependent on type style: e.g. you have to consider if you want to increase contrast or not, which in a grotesque might make sense, but not so much in a geometric face.</p>"
