  html: |-
    <p>Hello,<br>
    I'm looking for a script / program that can generate a Black version of Light, or vice versa.<br>
    The script should 'simply' generate an approximate version, so I have something concrete to work on.<br>
    I am well aware that it might become a problem - I have tried in Fontlab, but the result is not good, since the inner shapes of the letters quickly becomes too small.</p>
    <p>Thanks &amp; Merry Christmas to you all!</p>
