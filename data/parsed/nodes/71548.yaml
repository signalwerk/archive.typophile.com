      <p>Matthew — I checked a few references I have here and couldn’t find specific information about type metal for leads. The 1923 ATF catalogue offers 1-point leads in brass (presumably, you want 1-point leads a bit harder) and the rest in “metal,” without elaboration.</p>
      <p>You should try contacting Theo Rehak. He would undoubtedly know, or be able to give a very educated guess. <a href="http://nicksherman.com" rel="nofollow">Nick Sherman</a> might have contact information for Rehak. Nick’s helping a couple guys who are working with Theo to revitalize the Dale Guild Type Foundry (a true metal foundry, not just in name).</p>
