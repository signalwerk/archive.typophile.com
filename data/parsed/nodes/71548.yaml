      <p>Aluminum is 0.098 punds per cubic inch. </p>
      <p>For improved stability, rigidity, machining or extruding characteristics, resistance to corrosion or reduced cost, it will almost certainly be an alloy which may or may not have a noticeably different weight but for the volume of metal you have, the difference would be within a rounding error.</p>
