      <p>As far as my knowledge reaches, the composition of leading could vary as much as the composition of the sorts themselves. Making it pure lead would make it easier to cut, but it would also be easier to accidentally bend in the long strips, and it would be much heavier than if it were mixed.</p>
      <p>I'm sure it depended on the specific letterpress. Leading wouldn't really need any "harder" metals as it doesn't receive much eroding over time, so maybe many left out other metals as they were more costly.</p>
