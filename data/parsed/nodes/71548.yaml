      <p>Leading and other strip materials for letterpress are generally cast from an alloy that has a higher percentage of lead, so is cheaper to buy, usually about the same alloy as what was used for Linotype metal (since Linotype slugs were generally printed from once and then melted down to recast; they didn't need to be hard for repeated reuse). </p>
      <p>I have never seen 1 pt. brass leads - too expensive! It's very easy to tell the difference between 1 pt. and 2 pt. leads when you have them in hand. </p>
      <p>The 1 and 2 pt. leads will flex just because they are long and thin compared to lead type. A 6 pt. slug of the same length will not noticeably flex.</p>
