      <p>As far as I remember from my Art School days when we used loose type, the thinner ones were made of brass and quite delicate. </p>
      <p>Thicker ones of a kind of light metal (might have been an aluminum alloy) and the even thicker ones, including the material to lock up the composition were made of an ironlike metal where a lot of hollow interior shapes were used to lighten the weight of these elements.</p>
      <p>I have one of the medium (alu?) ones somewhere, but I guess having that tested for its composition is out of my reach…</p>
