      <p>I agree that Gotham is a classic in the making. I say "in the making" because I think we're still a tad too close to it for it to be a classic just yet. I think the design community's collective love and appreciation of H&amp;F-J is also contributing to Gotham's popularity (I am one of these appreciators, by the way). Its impression and structure is timeless, but it's not without its own unique characteristics. Gotham's widespread use will help it set into the concrete of visual cultural memory, making it feel familiar to even those who don't pay attention.</p>
      <p>But, as has been pointed out elsewhere, it is a nod and a wink away from Avenir, particularly in situations where the full character set is not in use, so time will be the true test of Gotham's staying power. My vote is that it will endure, but who can say what will and will not linger? That's for future generations to decide.</p>
