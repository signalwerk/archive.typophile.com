      <p>Another thread went into Avenir vs Gotham pretty thoroughly, and I agree that Avenir will prove the more lasting because its excellence is less obtrusive, more natural, nearly transparent. But I have nothing against Gotham: it just has a way of calling attention to itself that Avenir does not. </p>
