    html: <p>I hear your concerns. In my opinion, its already saturated. I think the difference with Eurostile (or Microgramma as I call it) is that it was more adaptable than Gotham. For example, Microgramma could be used on letterhead, but it could also be used for dishwashers, car batteries, and tennis shoes with distinction and prose. Gotham cant do that. On the plus side, Gotham is more "safe", and its harder to pick it apart, so a lot of designers want a more bullet-proof campaign, but in a sense, that also makes it less memorable, so its a trade off of sorts.</p>
