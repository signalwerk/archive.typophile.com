  date_raw: 29 Feb 2008 — 7:52am
  votes: null
  html: <p>You probably have to be in your 40s to answer this, but maybe not. Maybe younger and astute students of recent type history will have opinions. Will Gotham ten years from now seem like Eurostyle did in the '80s? Is it so popular and such a summation of the current times that in ten years it's going to seem dated and trite? Eurostyle was everywhere in the '70s and then in the '80s it quickly fell out of favor. Is the same fate waiting for Gotham? I'm off to a meeting where Gotham may be the best type choice. But I'm hesitant to consider it because this project will need to have legs for many years to come, and I'm thinking that Gotham is over the line of being overused the way Eurostyle was in the 1970s.</p>
  html_clean: <p>You probably have to be in your 40s to answer this, but maybe not. Maybe younger and astute students of recent type history will have opinions. Will Gotham ten years from now seem like Eurostyle did in the '80s? Is it so popular and such a summation of the current times that in ten years it's going to seem dated and trite? Eurostyle was everywhere in the '70s and then in the '80s it quickly fell out of favor. Is the same fate waiting for Gotham? I'm off to a meeting where Gotham may be the best type choice. But I'm hesitant to consider it because this project will need to have legs for many years to come, and I'm thinking that Gotham is over the line of being overused the way Eurostyle was in the 1970s.</p>
