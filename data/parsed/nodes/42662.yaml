    html: <p>I doubt Gotham will go the way of Eurostile because Gotham is much less noticeable than Eurostile. Eurostile is a wonky design that really stands out and screams for attention. Gotham was designed after years of research into vernacular letterforms that people are used to seeing; it’s popularity will eventually make it a vernacular typeface and/or ensure that plenty of derivative works pop up. I see the future of Gotham as being similar to FF Meta; designers will be a lot more reserved about using it, identity systems around it will get redone for the same reasons they always do, and it will remain out there but be a lot less everywhere.</p>
