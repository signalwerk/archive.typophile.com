      <p>David -- I don't particularly want the ClearType collection because I think those fonts are going to help me design better, although I think they're all beautifully done and wouldn't necessarily count out using them for design projects. It's just that, as most deisgners can attest to, clients invariably run Windows, as do a lot of office-type people you need to communicate with. When you're talking about sending a client a .pdf for review, fine, who cares what fonts they have. But having ClearType fonts would be great when there's PowerPoint presentations and Word .docs being edited by people who run Windows, but you still want it to look semi-presentable and don't want to use Arial. This would just be really useful for office communications between Mac and PC users. I don't see how any harm (at least for the general consumer and designers) could come out of Microsoft licensing their ClearType fonts to Apple.</p>
      <p>As far as square sans being the cockroaches and pigeons of type, you have a good argument. I love using them precisely for the reason you brought up -- I know they'll look good on screen and on paper. However, it doesn't matter how perfectly suitable these fonts are for various media, if people are forced to look at them long enough there's going to be a reactionary response, and everyone will start using condensed Bodoni or something for screen :)</p>
