      <p>You said it, Josh. Gotham can be easier to abuse given certain contexts, but it's a much easier font to work with in the genres implied. </p>
      <p>As far as font usage in ratio to neutrality, it should scale upwards, in that eurostile is far more discernable it should be far less used than Gotham. The same can be said when using Gotham and Avenir. The more identifiable a font is, the less it should be used overall. Although more applications in which a graphic designer is hired tend lend themselves to a certain style that we think of as being "metrosexual" etc.</p>
      <p>As a side note, I was in San Francisco this weekend and saw enough Futura and Eurostile to make me hurl, and any use of Gotham was a breath of fresh air. That being said, I do rather wish we could catch ourselves so as to not have the same thing happen with Gotham, as the OP was talking about.</p>
