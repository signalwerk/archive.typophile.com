      <p>For the subtitle, <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Linotype&amp;ffam=Helvetica%20Neue%20-%20Extended&amp;fid=a8e8547208de95c99548b51ccc383dbc&amp;fsize=36&amp;text=ONE%20OF%20THE%20ANHEUSER-BUSCH%20COMPA&amp;wrap=2" rel="nofollow">Helvetica Neue (Extended)</a></strong> could be a good substitute</p>
