    <p></p><div class="imageWrap"><img src="http://typophile.com/files/uppercut_specimen_500x360_3833.gif"></div><p></p>
    <p>Delve Fonts presents Uppercut Angle, by Joachim Müller-Lancé.<br>
    Available now at: <a href="http://www.delvefonts.com/uppercut.html" title="http://www.delvefonts.com/uppercut.html">http://www.delvefonts.com/uppercut.html</a> </p>
    <p>Joachim Müller-Lancé’s Uppercut is a rather sporting fellow, originally developed for the Krav Maga training center of San Francisco (Krav Maga is a simple and efficient self-defense system that has become equally popular in Hollywood and with law enforcement). Joachim has spent several years training, hitting things and people whenever he needs a break from kerning. Uppercut can be seen on the school’s t-shirts and other articles.</p>
    <p>The design idea sprang from pencil sketches for the center’s new identity. Uppercut’s shapes are not calligraphic or handwritten, more like lettering seen in comics or sports logos. Its brush movements are imaginary, not too literally brushy. During development, details were simplified and reduced until a bit of a cut-paper feel emerged, but more fluid like writing. The shapes are economical and efficient; simplicity makes the font versatile, holding up in small as well as big sizes.</p>
    <p>Uppercut is powerful, fast, confident, and dynamic. In the proportions, there is emphasis on a strong upper edge “keeping its guard up”, while several stems protrude downward, making it “light on its feet”.</p>
    <p>Uppercut is best used to pick up the pace, add snap, verve, and drive, on movie posters for action and adventure, product logos, food packaging, or an invitation to your next barbecue.</p>
