    <p>From the 1st of July till 21 September the latest edition (3.7) of <strong>DTL OTMaster</strong> will be offered with a 50% discount on the standard licensing price of €255.</p>
    <p>Version 3.7 contains a lot of new functionality. From the import/export of <em>Ideographic Variation Sequences</em> (IVS) to the editing of <em>feature parameters</em>, and from an <em>autohinter</em> for edited or newly added glyphs to support for COLR+CPAL tables. One can read about all details in Karsten Lücke’s wonderful <a href="http://www.fontmaster.nl/pdf/OTM_manual.zip" rel="nofollow">manual</a>.</p>
    <p>Some use OTM for font-spelunking, other use it for Open(Type)-heart surgery. Some use it for compiling OpenType Layout features (directly in the font, or exported for proprietary workﬂows) by applying the elegant automatic subsetting, while others use it for instance for mark (to mark) positioning. OTM is the ultimate Swiss (or actually German/Dutch) knife for CFF- and TTF-based OpenType, TrueType, and TTC (TrueType Collection) fonts.</p>
    <p>A complete listing of the functionality in OTM 3.7 can be found <a href="http://www.fonttools.org/downloads/OTMA/RM/Read_Me_lb.txt" rel="nofollow">here</a>. DTL OTMaster can be ordered directly with forenamed discount at  <a href="http://www.fontmaster.nl/Shops/FM_Shop/index1.html" rel="nofollow">DTL’s FontTools shop</a> or at FontLab Ltd.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/OTM_promo_3596.jpg"></div><p></p>
