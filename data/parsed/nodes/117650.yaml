    html: <p>I suppose this is a crude question to ask but what is DTL OTMaster useful for? I read that it's basically post-production software for fonts, but the descriptions remain very vague. What's the biggest upside of DTL OTMaster, and is it essential to be able to guarantee the quality of OT fonts?</p>
