      <p>I’m very pleased to inform you that the OTM summer promo is a huge success. Obviously 50% discount makes a major difference for all of those doubters. ;-)</p>
      <p>On Google’s font list currently there is a lively discussion on the development of Devanagari fonts and I was surprised to ﬁnd out that it was unknown to many that OTM generates a nice log ﬁle when compiling OT Layout features. This way errors and mistakes in the features can easily be traced. This is a excerpt from the discussion with an example that I generated with OTM 3.7:</p>
      <p><strong>--------------------------------------------------------------</strong></p>
      <p><em>Just had a short look at the features. The lookup 'PreBaseSubstitutionslookup2' contains duplicate substitutions:</em></p>
      <p> sub \isigndeva.tha \radeva_viramadeva  by \isign_ra_virama.tha;<br>
         sub \isigndeva.tha \radeva_viramadeva  by \isign_ra_virama.ja;</p>
      <p>    sub \isigndeva.tha \radeva_viramadeva \anusvaradeva  by \isign_ra_virama_anusvara.tha;<br>
          sub \isigndeva.tha \radeva_viramadeva \anusvaradeva  by \isign_ra_virama_anusvara.ja;</p>
      <p><em>If one of each is removed then there seem to be some more errors:</em></p>
      <p>HOT [ERROR] MarkToBase or MarkToMark error: A previous statment has already assigned the current mark class to another anchor point on the same glyph 'rvocalicdeva'. Skipping rule.  [/Users/blokland/Desktop/Devnagari/Lohit.fea 814]<br>
      HOT [ERROR] MarkToBase or MarkToMark error: A previous statment has already assigned the current mark class to another anchor point on the same glyph 'kadeva'. Skipping rule.  [/Users/blokland/Desktop/Devnagari/Lohit.fea 816]<br>
      HOT [ERROR] MarkToBase or MarkToMark error: A previous statment has already assigned the current mark class to another anchor point on the same glyph 'khadeva'. Skipping rule.  [/Users/blokland/Desktop/Devnagari/Lohit.fea 818]<br>
      HOT [ERROR] MarkToBase or MarkToMark error: A previous statment has already assigned the current mark class to another anchor point on the same glyph 'ngadeva'. Skipping rule.  [/Users/blokland/Desktop/Devnagari/Lohit.fea 820]<br>
      HOT [ERROR] MarkToBase or MarkToMark error: A previous statment has already assigned the current mark class to another anchor point on the same glyph 'chadeva'. Skipping rule.  [/Users/blokland/Desktop/Devnagari/Lohit.fea 822]<br>
      HOT [ERROR] MarkToBase or MarkToMark error: A previous statment has already assigned the current mark class to another anchor point on the same glyph 'ttadeva'. Skipping rule.  [/Users/blokland/Desktop/Devnagari/Lohit.fea 824]<br>
      HOT [ERROR] MarkToBase or MarkToMark error: A previous statment has already assigned the current mark class to another anchor point on the same glyph 'tthadeva'. Skipping rule.  [/Users/blokland/Desktop/Devnagari/Lohit.fea 826]<br>
      HOT [ERROR] MarkToBase or MarkToMark error: A previous statment has already assigned the current mark class to another anchor point on the same glyph 'ddadeva'. Skipping rule. </p>
      <p>[…]</p>
      <p><strong>Et cetera, et cetera.</strong></p>
      <p>[…]</p>
      <p>HOT [ERROR] lookup name "abvmAboveBaseMarklookup1" not defined [/Users/blokland/Desktop/Devnagari/Lohit.fea 1215]<br>
      HOT [ERROR] lookup name "abvmAboveBaseMarklookup2" not defined [/Users/blokland/Desktop/Devnagari/Lohit.fea 1216]<br>
      HOT [ERROR] lookup name "abvmAboveBaseMarklookup3" not defined [/Users/blokland/Desktop/Devnagari/Lohit.fea 1217]<br>
      HOT [ERROR] lookup name "abvmAboveBaseMarklookup1" not defined [/Users/blokland/Desktop/Devnagari/Lohit.fea 1224]<br>
      HOT [ERROR] lookup name "abvmAboveBaseMarklookup2" not defined [/Users/blokland/Desktop/Devnagari/Lohit.fea 1225]<br>
      HOT [ERROR] lookup name "abvmAboveBaseMarklookup3" not defined [/Users/blokland/Desktop/Devnagari/Lohit.fea 1226]<br>
      HOT [ERROR] lookup name "abvmAboveBaseMarklookup1" not defined [/Users/blokland/Desktop/Devnagari/Lohit.fea 1233]<br>
      HOT [ERROR] lookup name "abvmAboveBaseMarklookup2" not defined [/Users/blokland/Desktop/Devnagari/Lohit.fea 1234]</p>
      <p>[…]</p>
      <p><strong>Et cetera, et cetera.</strong></p>
      <p>[…]</p>
      <p>HOT [FATAL] aborting because of errors<br>
      [ERROR] Hatch Features, feature file "/Users/blokland/Desktop/Devnagari/Lohit.fea" failed with error code 1.</p>
      <p><strong>--------------------------------------------------------------</strong></p>
      <p>Another thing that came up in the discussion is the editing of the naming table. Also this can be exported in OTM and the text ﬁle can subsequently be easily edited (in batch, if applicable) and imported.</p>
