      <p>Do you only do 3d work? If not then i would actually say that you should think about your more extensive branding and marketing to carry that point across and keep your logo clean and simple. Also don't focus too heavily on the tool - focus on the idea. In the same way you don't need to show a wrench for a plumber you don't need to overemphasize 3D which is a tool to creating immersive and intuitive learning experiences. Go for the result. Leave your methodology to your materials.</p>
      <p>Having said that I like 1,2,6 and 8</p>
