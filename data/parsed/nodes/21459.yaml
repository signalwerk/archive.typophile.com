      <p>I like 8 on the design, but the illustration has me thinking box in yard, not necessarily pixel. Pixels are flat 2D. As far as the pixels building up the logo, it's not a bad direction, but it seems like something that has been used pretty often. think Xerox, or something similar. We had a motion graphics studio near my college back in the day, and their logo was a similar execution. </p>
      <p>And, the blue would be better suited emphasizing "Pixel" rather than "Yard," (like v.4) since pixel is more relative to what you all actually do.</p>
