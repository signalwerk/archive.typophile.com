    html: <p>Fredrik,  <br> <br> <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0">  <br> <br>Maybe it's like Herring. You have to get used to the "taste"! I watched that (spelling) Moscow. The Reindeer Lord? Quite the flick. I heard that wolf song by that famous Laplander. I owned a wolf, he got  old, walked away into the bush and died. The wolf song made me think Shylo came home. Dark as a coal mine these days. Do you get the Northern Lights where you are? <br> <br>You are close, we should meet one of these days. I am not really as mean and nasty as I pretend. It's just my role. I am supposed to be a bitter old grump. <br> <br>I never used comic sans or courier when I did subtitles. One face they used lots of at BBC was Lanston's Globe Gothic. It got lots of use. <br> <br>We have a Bruce Rogers face that was never completed. There was interest in having us complete it for a movie. I worked on lots movies, what a pain.</p>
