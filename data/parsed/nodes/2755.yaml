    html: <p>There you have it. We hung a sign asking the dead to lie down so we could distinguish them from the living. <br> <br>Alcoholic comatose workers would sometimes become victims of premature burials. We had to take the sign down. Lanston actually did have a  dead worker in its' office. Rather interesting story. Goudy happened to be at the plant and sent a memo to Sol Hess complaining about the smell. Apparently it was rather varnishy hot in Philadelphia. This was before the USA got bombed in Pearl Harbour. The fellow was an optical genius from Germany parked at Lanston (before my time, be kind now) when we were looking into photocomp. Remember brass was predictably going to be hard  to find. I would love to tell the rest of the story but you will have to read the book. <br> <br>But thanks for the tip Hrant. <br><a href="http://news.bbc.co.uk/2/hi/europe/3410547.stm" target="_blank">http://news.bbc.co.uk/2/hi/europe/3410547.stm</a> <br>I almost missed the end of the article. <br><i>Finnish citizens pay among the highest taxes in the world, but enjoy one of the best welfare systems.</i>  <br> <br>I knew I was doing something wrong. I have been missing out on the <i>enjoy.</i> <br> <br>So we should have this Northern Typographers thinga-ma-jig. Maybe we should start an new thread?? <br> <br>I had always welcomed <i>movie title typography.</i> We only did several but we set and printed many <i>dummy newspapers.</i>  I had to invent all manner of headlines and advertisements. One ad I wrote had a rather bold headline. <br> <br><b>Wet Nurse Needed</b> <br> <br>They shot the scene. I must report, <i>movie directors</i> have very good lungs. <br> <br>When I saw the movie I must admit my face was red as a beet. <br> <br>In any event I found the workings for the Bruce Rogers' face, I wonder if I should finish it. There are missing characters. A good job would be when you could not tell who did what. But the face is not without its' charms. It would make a great movie title face for the right movie. <br> <br> <br> <br> <br></p>
    html_clean: <p>There you have it. We hung a sign asking the dead to lie down so we could distinguish them from the living. <br> <br>Alcoholic comatose workers would sometimes become victims of premature burials. We had to take the sign down. Lanston actually did have a  dead worker in its' office. Rather interesting story. Goudy happened to be at the plant and sent a memo to Sol Hess complaining about the smell. Apparently it was rather varnishy hot in Philadelphia. This was before the USA got bombed in Pearl Harbour. The fellow was an optical genius from Germany parked at Lanston (before my time, be kind now) when we were looking into photocomp. Remember brass was predictably going to be hard  to find. I would love to tell the rest of the story but you will have to read the book. <br> <br>But thanks for the tip Hrant. <br><a href="http://news.bbc.co.uk/2/hi/europe/3410547.stm" target="_blank" class="link-external">http://news.bbc.co.uk/2/hi/europe/3410547.stm</a> <br>I almost missed the end of the article. <br><i>Finnish citizens pay among the highest taxes in the world, but enjoy one of the best welfare systems.</i>  <br> <br>I knew I was doing something wrong. I have been missing out on the <i>enjoy.</i> <br> <br>So we should have this Northern Typographers thinga-ma-jig. Maybe we should start an new thread?? <br> <br>I had always welcomed <i>movie title typography.</i> We only did several but we set and printed many <i>dummy newspapers.</i>  I had to invent all manner of headlines and advertisements. One ad I wrote had a rather bold headline. <br> <br><b>Wet Nurse Needed</b> <br> <br>They shot the scene. I must report, <i>movie directors</i> have very good lungs. <br> <br>When I saw the movie I must admit my face was red as a beet. <br> <br>In any event I found the workings for the Bruce Rogers' face, I wonder if I should finish it. There are missing characters. A good job would be when you could not tell who did what. But the face is not without its' charms. It would make a great movie title face for the right movie. <br> <br> <br> <br> <br></p>
