      <p>There is at least one EULA which I can think of which disallows including all of their font outlines into a single PDF. </p>
      <p>I think while this idea is interesting it is, alas, only one more solution. </p>
      <p>The people on warez sites can be quoted as discussing re-kerning fonts and looking for a specific glyph. They do re-build fonts from outlines just as they re-build from extracting fonts from crippled (sub-set) PDFs. (They share FontLab as much as fonts.) Further if they want the font badly enough, they pool together and buy a copy and then share that among themselves. If they have a fixation  nothing gets in their way. </p>
      <p>It is a valid way to do it, but it is, IMHO, more dangerous because more people would have access to the outlines. Afterall, some design doesn’t require paragraphs, just characters. Logos for one example.</p>
