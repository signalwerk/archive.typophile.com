      <p>I agree - if one used InDesign. This process is just as easy, however, once all the initial settings are employed; and perhaps more viable since Photoshop seems to be more prevalent than InDesign. The big question, however, is why more people don’t know or do either of these things. I would for my own edification, however, like to see a pdf created in the manner you describe. </p>
      <p>I don’t question its applicability in the least - only if the level of visual quality is equal in both scenarios, and/or if there are any backdoors, so to speak, to extract fonts from a pdf created in the manner you describe. Whatever the case, given the degree of pilfering out there, this is knowledge every typographer should have and employ when producing these samples, regardless of the method used. Apparently from what I’ve been told, there is a way for someone to obtain from the myfonts.com site the entire list of kerning pairs for the fonts sold there and if a sample pdf has an embedded font and not merely a subset, the result is far more usable than most here seem to think.</p>
