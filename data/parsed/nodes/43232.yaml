      <p>“But I think that, if you’re worried about people making crippled versions of your fonts by extracting data from PDFs, I’d say you’re better off reducing the number of characters used when composing the typeface sample, and then generate the PDF using subsetting embedding”</p>
      <p>If it first required me to carry a Volkswagen Beetle up a hill before I had the ability to produce unextractable pdfs, I wouldn’t be dumb enough to start scouting hills. However, when it requires pushing a few buttons almost the same number of times to create one or the other, I not only can produce a secure .pdf, there would be no need to reduce anything I wanted to present, including the number of characters. That’s my point, Miguel. </p>
      <p>Let’s for argument’s sake say neither of the above methods is foolproof. I’d still swear that either of them  makes extracting a font 10 times harder. And when you consider the disparity in visual quality is microscopic, you could create a pdf the same way you’ve always done it and instead of hitting Button X six times to produce a pdf with embedded fonts, you could hit button Y six times and produce a pdf just a nice looking but 10 times more difficult from which to strip fonts.</p>
      <p>“if you’re worried about people making crippled versions of your fonts”</p>
      <p>This is the least of my concerns. My only worry is about the people who don’t buy them. I could feel like these people are getting crippled, worthless versions of my font, but what I think of it doesn’t mean crap when those people couldn’t even point out what makes it crippled in the first place. At that moment it goes from being what you’ve identified as crying wolf straight to being a loss of $35 for the good guys, if that’s what my font cost.</p>
      <p>By the way, I’ve known for years that “crippled” fonts can be extracted from PDFs. However, I also know that a.) you still haven’t described how to extract a font once you’ve opened “my” .pdf in Illustrator and b.) these “crippled” can definitely be made to walk again by the automatic metrics and kerning functions in Font Lab in minutes ... even if it is with a small limp.</p>
      <p>I must say I am confused by your approach and reasoning. To me this is like hearing a bad-sounding noise in your engine. Yes, you could keep driving, save time, get there faster, and eventually grow to block out the noise. Thing is, that noise is not going to correct itself ... it will continue to get worse.</p>
