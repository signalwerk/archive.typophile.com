    html: |-
      <p>“Then why can H&amp;FJ and Enschede’s fonts be found on warez sites. AFAIK, these foundries don’t provide PDFs on their sites.”</p>
      <p>No, their fonts just appear in extractable PDFs from Newspapers and Magazines from India to Indiana. Additionally, these two foundries have much longer histories and far more experience ... and thus have had many typefaces out there in some fashion for a lot longer than Font Farm. I think Textaxis - which indisputably produces incredible work - also can be put in this category.</p>
      <p>“Maybe because Font Farm is not as know as other foundries...”</p>
      <p>Have you ever once taken the time to visit the font forums on any of these “warez” sites? Have you ever looked through some of the requests posted on usenet? More people are clamoring for fonts from Textaxis and Font Farm than any others out there. In fact, these requests have decreased over time because people are aware of the difficulty in ever obtaining fonts from these foundries. Unfortunately, some of the work on the Textaxis site was stripped from the flash pages there, and for a brief period, a few Font Farm typefaces were “posted.” However, the reproduction of all these fonts was so poor, they hardly resembled the original font.</p>
      <p>“Generalization with too many assumptions.”</p>
      <p>Well, Miguel, I will go ahead and tell you this, then: if you find no value in using alternate methods when producing font samples/books in pdf format, by all means continue along your present course. And that goes for pretty much everyone. I’m certainly not trying to introduce a new bill to Congress here, I’m simply describing what I’ve encountered in my experiences and shining a little light on the “real world” that some typographers seem to believe doesn’t exist.</p>
      <p>Secondly, what you identify as generalization with too many assumptions is in fact a direct statement made after actually witnessing it all. So I’m going to guess, Miguel, that when it comes to just about anything you either use or consume - or even enjoy - you’d turn your nose away from what to the best of your knowledge is a free, equal-quality, identical version of an item in favor of paying in some cases exorbidant prices for the “real thing.” To many, these extracts are just that - exactly the same. So what if they don’t understand kerning ... no one’s obliged to appreciate its benefits.</p>
      <p>“Just try opening your PDFs with Illustrator.”</p>
      <p>And then do what? Assuming you produced a pdf correctly using either of the two above methods and you open it in Illustrator, how would you then go about extracting the fonts? What I’ve described here is one potential method, and I believe a second also was provided.</p>
      <p>In case you have any further doubts of the seriousness of this, let me say here that in the future you are alll but assured of running into more and more PDF samples that look beautiful but under document properties in Acrobat have no fonts listed.</p>
      <p>This certainly wreaks of deja-vu, as I seem to remember several other occasions in which I’ve been called to the carpet by Miguel. To which I can only say, Miguel my original intent was to be of some kind of assistance to other typographers and relate to them what I’ve run into when going through the warez sites and usenet. </p>
      <p>For you to disparage my comments as assumption, from where I sit, would first require you to a.) have spent the kind of time I have researching these things and b.) KNOW in a factual sense I was “assuming.” I sincerely doubt that, so rather than accuse someone of making assumptions, perhaps you could refrain from making accusations that in fact are only YOUR assumptions. Forgive me, but it makes me dizzy to hear one essentially say “I’m assuming your making assumptions.”</p>
      <p>Like I said, however, by all means - go right ahead and continue embedding your fonts in those pdf samples if you elect to create them. Spread them around the Internet. I’m sure you do some beautiful work. While doing so, however, consider how you’d answer this question: How much more time and work would it be to protect fonts in pdfs, and if the answer is little to none, then tell me which pdf creation has the potential of resulting in more harm to you? Once this method of protection is routine knowledge and unassailable, what sensible person would even consider creating an extractable pdf? It’s blue pill-red pill stuff at its most pure and only someone ignorant would base the choice of what they take on the color of the pill rather than its content and potential benefit. </p>
      <p>I apologize for being long-winded here, but what was the epitome of a take-it-or-leave-it post and observation - especially one presented for the purpose of assistance - certainly doesn’t warrant such disparaging, cynical response.</p>
