      <p>You could just make a JPG and throw it in a PDF document…</p>
      <p>But really, the reason for keeping it vector is to be able to zoom into the finer points and it not be pixelated, which you lose in a raster conversion. Wether it’s outlined or an embedded font. Personally, I think outlining is a much faster and straightforward process, and if people are going to go through the pains of unlocking and extracting fonts, you bet they’d sooner turn to usenet or a torrent site to grab it. </p>
      <p>I don’t see unreleased fonts in PDF’s being a big market for someone to waste time on. For one they’re unfinished, and why waste time on an incomplete product when you can wait to get it in a few months. Considering the limited scope in which a test PDF would even be available to, I’d trust they weren’t trying to rip you off. Aside from here, friends, and a few other type designers I don’t see a test sample document really being out there to the general public, and one would hope that in that small group of people that font pirating from a PDF would not be an issue.</p>
