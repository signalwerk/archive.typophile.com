      <p>Look Christopher, I appreciate you coming here and share a procedure that you make sound as if is a no-brainer that will solve all our problems, when in fact it isn’t, IMO. The reason I’m dismissive is because I’ve seen one too many threads like yours, started by people that all of a sudden find out that it’s possible to extract (crippled) fonts from PDFs, SWFs, etc., and make alarm-sounding posts as if they were on a quest to save the World.</p>
      <p>If the procedure you described is the one that works best for you, great! But I think that, if you’re worried about people making crippled versions of your fonts by extracting data from PDFs, I’d say you’re better off reducing the number of characters used when composing the typeface sample, and then generate the PDF using subsetting embedding. This is what many foundries do.</p>
    html_clean: |-
      <p>Look Christopher, I appreciate you coming here and share a procedure that you make sound as if is a no-brainer that will solve all our problems, when in fact it isn’t, IMO. The reason I’m dismissive is because I’ve seen one too many threads like yours, started by people that all of a sudden find out that it’s possible to extract (crippled) fonts from PDFs, SWFs, etc., and make alarm-sounding posts as if they were on a quest to save the World.</p>
      <p>If the procedure you described is the one that works best for you, great! But I think that, if you’re worried about people making crippled versions of your fonts by extracting data from PDFs, I’d say you’re better off reducing the number of characters used when composing the typeface sample, and then generate the PDF using subsetting embedding. This is what many foundries do.</p>
