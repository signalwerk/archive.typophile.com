    <p>... opening adobe acrobat, choose “Edit” from the menu, and click on “Preferences.”</p>
    <p>Once there, click on “convert to PDF.” In the window directly to the right, click on “postscript/eps.” go down to the edit settings button and click it. when the window opens, go to “high quality” in the menu. click “edit.” go to fonts tab and uncheck “embed all fonts.” in this same window, click “save as.” enter a name. close acrobat.</p>
    <p>Then, create a font sample in photoshop. Once finished, change your default printer and print to pdf. When doing so, click on the “properties” tab and uncheck “Do not send fonts to Adobe PDF.” Then click on properties tab and in the menu labeled “Adobe PDF conversion settings,” click on the settings you just saved. Print. Open pdf file. You should see that your fonts maintain the same high visual quality as an embedded font but under the file properties menu choice and fonts tab, there will be no fonts listed - and thus no fonts to extract.</p>
    <p>Unfortunately the only money I’ll make off this is when my fonts aren’t pirated from the pdf samples I’m fixing to create. My gift to all of you.  .... Or a sign of my ignorance for not figuring this out sooner.</p>
