      <p>Absolutely no doubt about that last comment. Still, it does not apply to those fonts yet to be distributed or released. Including those being critiqued on this very site. I believe you’ll find that some of the greatest typefaces - which haven’t been distributed in an extractable pdf form - are nearly impossible to come by in any way other than purchase. </p>
      <p>There has been much debate over the functionality of extracted fonts, and most see it as no big deal because of a lack of kerning, etc. I’m convinced, however, that 75 percent of font purchasers either don’t know what kerning is, don’t care, or both. It’s a subtle yet definite epidemic and costing typographers exponentially more revenue than people here seem to think. A typographer with expert knowledge on the issue of kerning will more than likely believe a font is worthless without it and doesn’t see the danger. Most buyers, however, couldn’t define what kerning is much less insist on a font having impeccable kerning - or any at all for that matter.</p>
      <p>Not to mention if given the choice, in my opinion, between buying a beautifully kerned font for $35 or extracting an unkerned font for free, someone will be losing that much money probably 90 percent of the time. I doubt people who spend money on fonts then turn around and give it away to a bunch of people unwilling to pay for it.</p>
      <p>For example, I believe Font Farm has beautiful typefaces, including Kofi, etc., but few if any of their fonts are being circulated by pirates. Why? Check out the website. Download the pdfs. Google the font name, designer’s name, foundry’s name, etc., and look for some. Does this mean bigger profits for Font Farm? Who knows? But I am relatively certain this kind of unavailability in the long run convinces a would-be torrent downloader or pirate to break down and buy the font if they really love it. The semantics are arguable, but the frame of mind of potential buyers with some computer knowledge can’t be. He or she invariably will look first to see if it can be obtained for free, even spending months at a time doing so, before considering a purchase if they do at all.</p>
      <p>I’m no zealot or anything, but for Pete’s sake, when extracting can be made nearly extinct in a few basic steps like the two methods described above, it should be protocol.</p>
