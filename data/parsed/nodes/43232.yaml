    html: |-
      <p>Personally, I’m with James on this one: “Given that just about every font ever produced can be found online somewhere with a lot less effort than it takes to dig it out of a PDF, this is all sort of a moot point.”</p>
      <p>I’ll also support pretty much everything Miguel has already said.</p>
      <p>That aside, all the legerdemain being suggested here is not very interesting, except for limiting the charset showing and subsetting to use only the glyphs shown. Anything else will degrade the visual quality.</p>
      <p>If the font is still a font, it is still technically possible to extract it from the PDF.</p>
      <p>If the font is not a font but just outlines, it has suffered a significant loss of visual quality, especially (but not only) on screen. This might not be very noticeable for display fonts at really large sizes. It would be a display problem for text faces. But the outlines would *still* be theoretically extractable from the PDF by this hypothetical determined thief.</p>
      <p>Although the PDF can be protected via encryption, if you’re talking about evildoers who are willing to ignore licenses and break the law to extract fonts, they can easily break encryption too, unless the encryption blocks actually opening the PDF at all. (Note: there are more sophisticated PDF encryption schemes from Adobe than the basic one supported by Acrobat for PDF creation, but they are not the sort of thing I can imagine most type foudries getting into.)</p>
      <p>If the fonts have been turned into bitmaps, the loss of quality is much more severe. They may look fine if displayed at the exact zoom level the bitmaps were created at, but if somebody either zooms out until the text is small, or zooms in to see fine detail, serious visual problems will emerge.</p>
      <p>Cheers,</p>
      <p>T</p>
      <p>Thomas Phinney<br>
      Product Manager<br>
      Fonts &amp; Global Typography<br>
      Adobe Systems</p>
