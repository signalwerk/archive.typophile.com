    html: <p>Hola, triton? <br> <br>voy a escribirte en ingles para que todos entiendan.  <br> <br>Darrel is right, is very funny to find two similars organizations in such a small country like Chile, the both of you know each other?  <br> <br>i think that your dog has a very friendly face, even though you will have to correct the number of legs, you have a good base in it. <br> <br>About QUILTRO CHILENSIS i like the type you used, but it don't shows the "sudaca" spirit a QUILTRO has, i mean that this solution i can find it anywhere. Anyway, if you insist in using it be carefull with the E in CHILENSIS, it can be confuzed with an F. <br> <br>Maybe you can tell us more on how a QUILTRO will turn into a touristic atraction, i am very courious. <br> <br>nice job anyway <br> <br>CG <br> <br>PD. maybe you can find a typographic language in PAncho Galvez s Antillanca. <br><a href="http://www.tipografia.cl/proyectos/proyectos_llanquihue.htm" target="_blank">http://www.tipografia.cl/proyectos/proyectos_llanquihue.htm</a> <br></p>
