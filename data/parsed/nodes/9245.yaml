      <p>&gt;A metal sort however is a static thing, consicously designed. It’s a lifeless lump.</p>
      <p>But the process of letterpress printing introduces all kinds of unpredictable effects, due to things like varying wear of different pieces of type which represent the same letter, variance of inking, variance of pressure, and variance of paper stock. So how is one to know which is the "true" impression, any more than one is to know which photo captures the "true" personality of the sitter?</p>
      <p>&gt;No, in this case averaging is a tool, a useful one,</p>
