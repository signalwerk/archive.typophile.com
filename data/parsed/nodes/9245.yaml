      <p>This is an interesting bastard of a mix (the original, not Raph's methods…). Looking at the sample in the top post, I'm struck by three things.</p>
      <p>1. That lowercase g has a top that is so <a href="/wiki/Schwabacher" class="freelinking" rel="nofollow">Schwabacher</a>.</p>
      <p>2. But that L is almost a <a href="/wiki/Civilit%C3%A9" class="freelinking" rel="nofollow">Civilité</a></p>
      <p>3. The type seems to have no real rhythm of shapes or internal elements, the way that most "blackletters" do…</p>
      <p>The art nouveau era was symbolized by a number of attempt to reform blackletter by mixing it with itself or with foreign styles. To my knowledge, none of the attempts "worked"* </p>
      <p>Raph's find doesn't either, but it could always revived it anyway. (I don't know what a user could use it for… the typeface didn't successfully capture any contextual spirit in its own time, either.)</p>
      <p>Call me a <a href="/wiki/designer" class="freelinking" rel="nofollow">designer</a>, but I think that the exact (or as close to exact as possible) recreation of someone else's intent is totally boring. Put those outlines where YOU think they should go. It isn't really important where the typefounder put them, I think. This face is not that "good" anyway. If you approach it more from a "designists" point of you, you might actually improve upon the past, rather than just recreate it.**  </p>
      <p>* After the second world war, some designers—mostly in Germany—had figured out a way to make blackletter work again, and it was not any of the art nouveau methods. Their method was The Pen. Of course many art nouveau forms were formed by the pen, too, but not with "consistency." Those 1920s faces were more legible, even if Hrant doesn't like pen-based forms. </p>
      <p>**Not everything that existed in the past deserves to be revived, just because it happened to have been created once. In the end, you seem to be reviving this because you like it. But if people had "liked" this face, then it would already be with us in digital form. Show all of those nay-sayers what they were missing by finally making this design work! Its old forms will mostly likely make people think, "you know, maybe there was a reason that this had gone so long without having been revived…"</p>
      <p>__<br>
      <a href="http://www.typeoff.de" title="www.typeoff.de">www.typeoff.de</a></p>
