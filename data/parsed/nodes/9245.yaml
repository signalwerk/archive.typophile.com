      <p>Antiphrasis: it's certainly possible to do it in Photoshop (I used Gimp myself), but tedious to the extreme in quantity. Thus, I hacked up some code to segment, classify, and blend automatically. The particular run that resulted in this "s" image was taken from a half dozen pages, contained about 10,000 total glyph impressions, and took several hours of computer time to crank through. If motivated, I could probably make the tools an order of magnitude or two faster, but even so it's a huge improvement over doing it all by hand.</p>
      <p>Nick said, <em>there is a variance in letterpress type impressions of the same character in a sort.</em>. Yes, and that is simply not the case with standard digital type. (you could have a font with lots of alternates, perhaps even randomly selected, to simulate the flavor of letterpress, but that would be a whole other ball of wax).</p>
      <p>Hrant and I had some email exchanges about Baskerville* specimens a few months back, and I pointed out an "a" impression that looked quite garaldish (garaldean?). If I were doing a Baskerville revival, it would be tempting to use this particular impression as a model. However, it would be a lot harder to argue that this form should be considered historically significant. I do think that the averaging technique, could help unlock some of the secrets hidden in these seminal sources.</p>
      <p>*I had the pleasure of leafing through a Baskerville Aesop today, at Serendipity Books in Berkeley. Only $475 too!</p>
      <p>I had said <em>the true shape of the metal</em>, but want to take that back. The shape of the metal is but one truth, and arguably not the one closest to the intent of the type designer or printer. Metal type is designed for an environment in which there is always gain on the press; the fact that better quality presswork often meant less gain does not mean that the designer's intent would have been satisfied by a perfectly sharp and gainless reproduction of the metal shapes.</p>
      <p>What I would like to claim, instead, is that this averaging procedure produces an image that is very nearly as <em>clear</em> as a high-res capture of the shape of the metal. A straight-up average is going to be a bit blurred, largely because it's impossible to totally get rid of misregistration errors. But, that said, the very low noise of the result image lends itself well to sharpening (or, for an extremely sophisticated practitioner, deconvolution). I'm playing with this now, and the <a href="http://levien.com/type/myfonts/xgothic/s_sharp.png" rel="nofollow">initial results</a> are fascinating indeed. You can actually see the body of the metal being surrounded by the ink gain.</p>
      <p>So yes, I would stand behind the claim that this averaging technique is an <em>analytical</em> tool of unsurpassed power. Further, that these images are arguably better than either going to the metal or choosing individual impressions if one's goal is creating a faithful reproduction. Whether there's any artistic or design merit in doing so is another question altogether, and I'm heartened to see the debate over it.</p>
