      <p>You should be to see this fairly clearly in the <a href="http://levien.com/type/myfonts/xgothic/s_sharp.png" rel="nofollow">last image</a> I posted. In particular, at about 5 o'clock, at the thinnest part of the stroke, you should be able to see a dark-gray stripe nestled inside a blacker outline. I believe the dark-gray is actually a good image of the metal, while the outline is composed of ink spread. If so, hopefully I can unlock one of the last mysteries in my quest to understand ATF's optical scaling, to wit the relative contribution to thickening from the pantograph and the ink spread on printing. I'm looking forward to getting some time to refine my techniques so I can capture even clearer images - the ones I've posted here are still a bit murkier than I'd like, especially for visualizing these more subtle aspects.</p>
      <p>In any case, hopefully we can dispense with much of the flamewar on this thread, as I am indeed not making any particular claims to creativity. The main reasons I'm doing this font are to learn more, and to refine my tools. I feel good about the progress on those goals even if this font is never used for anything other than the nameplate on the front door of my new apartment.</p>
