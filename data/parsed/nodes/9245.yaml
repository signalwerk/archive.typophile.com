    html: <p>I think Christian gothic follows a singular, complex (though definable in simple terms) basic pattern, and it can be effectively discerned and described with the help of Gerrit Noordzij's type-descriptive protocols. An understanding--and faithful digitization--of Christian gothic might benefit as much--if not more--from viewing the letterforms through Noordzijian glasses as it will form mechanical averaging. The basic pattern might be less shakely a product of the historically retro(pro)jective imagination than a putative set of Fleishmannian ideas on readability.</p>
