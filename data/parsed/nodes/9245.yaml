      <p>&gt; one of these days I’ll actually learn to measure ancient sizes.</p>
      <p>1) I don't think there's a reliable way anyway. The talus (internal leading) can be anything, even negative, like if there's kerns at the bottom of the descenders of a script face - and it doesn't even have to be a script face: I remember seeing smaller sizes of some Baskerville with a "g" that extended below the Em! (Or maybe it was Palatino.)<br>
      2) Don't forget to account for Didot versus Postscript points.</p>
      <p>&gt; What would you suggest bastardizing it to?</p>
      <p>I'd just make the top of the "g" more integral, not so slapped on. But only if it's not a literal revival... in which case I might not stop at the "g".</p>
      <p>hhp</p>
