      <p>Nick: can I quote you in the marketing materials for the font? More seriously, I'm digitizing this because I think it makes an interesting statement, and given the resurgence in blackletter faces, I think it may well find niches in certain designs. I find it more readable than most blackletters, good enough for medium-length runs of text.</p>
      <p>hrant (re size): yes, the talus of this font is especially confusing because the cap "V" has an ascender that vastly exceeds the normal ascent, so much so that it could almost collide with the previous line's descender. Indeed, in one of the larger sizes (I think 16/18 but haven't measured it carefully) you get the feeling that the compositor adjusted the line breaks to avoid just such a collision.</p>
      <p>andigrl: actually, in the clip I posted, all the "s" glyphs happen to be final, so you're seeing only that form of teh letter. The other form is far more standard. I'll post three images of it here for your your amusement.</p>
      <p>First, a <a href="http://levien.com/type/myfonts/xgothic/s_raw.png" rel="nofollow">raw scan</a> (normalized for contrast) of one instance. This is a 2400 dpi scan, so it's about 467 ppem. The printing quality is fairly good for 100-year old letterpress, but of course you can see plenty of paper texture and a bit of uneven ink spread.</p>
      <p>Second, I <a href="http://levien.com/type/myfonts/xgothic/s_avg.png" rel="nofollow">averaged</a> together dozens of instances to form a composite image. I believe this image reveals very nearly the true shape of the metal. You can see a slight lightening of the interior of the letter on corners, indicating that some instances are chipped. This lightening always happens on fragile parts of letters, and the degree of lightening corresponds to the probability of damage. Similarly, the zone of ink spread is a light-gray blur emanating from the body of the letter.</p>
      <p>Last, my <a href="http://levien.com/type/myfonts/xgothic/s_font.png" rel="nofollow">digitization</a>. You can see that I followed the original shape quite literally, even to the point of different rounding radii for the different corners. I may want to replace some of these rounded corners with sharp ones, but I also don't want to change the character of the font too much. In particular, at large sizes I find a mixture of soft and sharp corners to be unappealing.</p>
