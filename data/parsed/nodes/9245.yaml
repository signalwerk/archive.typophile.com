      <p><em>Oldnick, I thought you rejected that sort of personal attack.</em></p>
      <p>William, my words were very carefully chosen and they were not an attack on Nick, only his definition of "creativity." I am not dissing the man, just challenging some of his mistaken notions, which is what lively discussions are supposed to be about.</p>
      <p>Unless one possesses the power to say "Let there be light" and light does indeed come into being where it did not exist before, <strong>nothing</strong> a human being does is creative. Rather, if a mere mortal "creates" something new and unique, it is merely an act of <strong>synthesis</strong>, building on what came before. And nowhere is this fact <strong>more</strong> true than in the area of typeface design. The basic rules of letterforms are fixed: the design of an A, no matter how unique, must suggest, unequivocally, an archetypal A to the viewer of same, or the design is utter worthless.</p>
      <p>Equally, unless one is prepared to state--also unequivocally--that any nuances one may devise for an alphabet have never, in the entire history of mankind, ever been conceived of before (which statement must, by necessity, proceed from Divine omniscience), then one cannot legitimately claim to be a "creator," when lesser mortals (here read, mere revivalists) are not.</p>
      <p>Finally, Nick: enough of the Hrant bashing. I believe that Hrant would be the first to admit that, at times in the past, he has gotten a little edgy and insulting, but...I believe that, within this particular forum, he has been restrained and has offered a lot of constructive criticism and helpful insight. You don't have to cut the guy any slack: just give him his due.</p>
