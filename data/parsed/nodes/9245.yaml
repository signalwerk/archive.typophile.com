      <p>&gt;This approach: art (expressing myself)...</p>
      <p>That's not what I had in mind. I'm talking about what I do, which is commercial type design, where the art and design involved are hand-eye-mind skills. This is what I'm opposing to a revival that leans heavily on automated techniques.</p>
      <p>I was thinking more of Petr von Blokland's statement "What can be automated will be automated, what cannot be automated is design." That defines the disputed territory. I don't like to see subtle design skills replaced by crude technology. It's all very well to tout averaging as a great new tool, but the averaging idea is not new. I believe Adobe Garamond for one, uses it. </p>
      <p>Automated averaging, used as a design platform, is a blunt and facile instrument. As an analytical tool, it really doesn't help the (re)designer understand the typeface in the way that looking at a variety of instances and drawing one's own composite does. </p>
      <p>&gt;Averaging isn’t necessarily blurry. </p>
      <p>Well, I said it wasn't sharp. Usually sharp is contrasted with blurry, but in the case of averaging type outlines, what one ends up with is not a blur, but a hard edged blob. It's not blurry, but it's not sharp, because it has soft corners. </p>
