      <p>In re-reading all this I have to admit I think that Nick is probably right about where the excitement is - in the value judgement.</p>
      <p>Hrant - do you say this based on what is posted here or with additional material. I looked for your reference - This is as far as I could get without interlibrary loan's help - </p>
      <p> "How  many  times  have  APHA  members  compared  two  typefaces, thought them similar (if not identical), and  felt at a loss to prove it? Such a problem was faced by  Kay Amert, Professor and Director of the Typography  Laboratory at the University of Iowa, when she examined  the types used by two French printers: Simon de Colines  and Robert Estienne. She perceived an eerie likeness  when before her lay two books: the former’s La Dissection  and the latter’s Georgics-like poem La Coltivatione. A bit  of a mystic, she cracked the problem in a dream in which  the gestalt of a single letter floated before her computer  screen; and, lo, superimposition became the answer. By  bit-mapping a particular letter from one page in vertical  lines and its equivalent from the other in horizontals,  she saw consonance where they created a cross-hatch  and  differences  where  single  lines  extended  beyond  the cross-hatchings. When she presented still another  comparison, some grew impatient to learn her views as  to why there should be such differences: punch modifications? re-cuttings? variations in inking? make-ready?  paper-dampening? But Professor Amert held that such  questions called for other seminars and that her purpose  was to recommend – to serious type-history scholars –  the computer as an aid in addressing problems which  have plagued them for centuries.  - - Greer Allen"</p>
