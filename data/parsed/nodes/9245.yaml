      <p>No, because a metal sort is not a person.</p>
      <p>If the point is to make a literal revival, and when you don't have access to the original metal (plus access to a way to actually print with it in an "intended" way) Raph's method is supremely useful*, sort of because it removes printing variance. This, even (in fact especially) if the printing at hand was done in a way that the original designer didn't want (not that all of them were sophisticated enough to worry about that) because the "average" form is still something more than nothing that you can work from, to interpret further.</p>
      <p>* It won't be long before it gets a lot more attention. Raph, send it to APHA for one.</p>
