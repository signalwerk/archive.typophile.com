      <p>&gt;then your vitriol against revivalism has certainly subsided,</p>
      <p>My politics:<br>
      Think globally, act locally -- that means local culture providing meaningful, profitable work for people everywhere, work which expresses the diversity of culture, engaged with today's issues. Typographic culture falls far short of that: the typefaces most people in the West use were designed long ago and/or far away, provided by trans-national corporations. There is a role for continuity with the past, but it's overdone.<br>
      I hope that's not vitriolic.</p>
      <p>&gt;what do you think about type designers whose oeuvre is 90% revivals?</p>
      <p>I'm not into finger-pointing at individuals, only at TNCs, which are like public institutions.<br>
      I've argued, on other Typophile threads, that revival is not type design, because it's taking credit for someone else's work. But it's not a black and white issue, there are many shades of originality.  </p>
      <p>I don't think I've eased up on my cause, after all I'm onto Raph's case here. But I have nothing against the guy, it's just a philosophical discussion. He made certain statements about "truth" which I contested, hence the debate -- no vitriol.</p>
