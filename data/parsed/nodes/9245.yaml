      <p>&gt;why don’t you go ahead and state a broader belief of yours: that revivalism is a cop-out?</p>
      <p>That's not my belief. My belief is, and has always been, that revivals have their place in contemporary typography. I have done many revivals, and am working on one at the moment, actually. </p>
