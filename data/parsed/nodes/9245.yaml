      <p>&gt;further, that these images are arguably better than either going to the metal or choosing individual impressions if one’s goal is creating a faithful reproduction. Whether there’s any artistic or design merit in doing so is another question altogether,</p>
      <p>This approach: scientific analysis accurate, art marginalized as a gloss.</p>
      <p>It's not possible to separate the art and technology so neatly. The question of what is faithful is a question of design belief.<br>
      For instance, there is a quality of sharpness which would be apparent in an individual impression, which the average is not faithful to.<br>
      The scientific assumption is that what can be accomplished with a bit of technology is better than what can't.</p>
      <p>&gt;"Anybody who intends to generate randomness by arithmetic means is, of course, in a state of sin.”</p>
      <p>I said unpredictable, not random. A database that constantly changes from day to day is unpredictable, because one cannot predict the future. The appearance of the Twin font, driven by the weather in Minneapolis, is something that von Neumann would have approved as being truly random.</p>
