    html: |-
      <p>&gt;Nick: can I quote you in the marketing materials for the font?</p>
      <p>Yes, for a small licensing fee.</p>
      <p>&gt;I averaged together dozens of instances to form a composite image. I believe this image reveals very nearly the true shape of the metal. </p>
      <p>That's like averaging all the portrait shots in a photo shoot and saying that the composite best captures the subject. An interesting modern art idea, intellectually intriguing but dull in practice. There are always one or two shots that stand out, capturing the presence of the subject, far more attractive than the others, or a composite of them can ever be. </p>
      <p>It's also like digitally remastering an old music recording by averaging transcriptions from vinyl. It would be better to work from the original masters, or snip the hiss and clicks. You can keep them as a featured artefact (Portishead, Founders Caslon), but averaging them just creates soft noise. </p>
      <p>With letterpress typography neither the type ("the true[?] shape of the metal") nor an average of impressions reveals the nature of the endeavor: there is an optimum printing. The question is, what is it? That's open to critical interpretation (how much bite, how much ink, etc.) What was the type founder's intent? What did he consider the best impression? Was there something that he was aiming for with the typeface that he was never able to achieve in letterpress, that may be possible digitally? I suspect he would have opted for more sharpness, rather than less.</p>
      <p>Repurposing a typeface by digitizing invlolves a critical attitude, a value judgement. The "averaging" method is one such judgement as to what is appropriate, but it is non-commital, a statement too fuzzy to be disproved. Not the same as the truth.</p>
      <p>Ultimately there is no truth, only design.</p>
