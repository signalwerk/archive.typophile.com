      <p>As Peter hints, revivalism is complex.</p>
      <p>I would ask: Who is the font for? Other type designers? Quite unlikely. What is for example THE Baskerville for the contemporary user? Is it JB's original? No way - virtually nobody has seen that. I would argue that it is more the impression that people have accumulated over time (a lot like what Nick wrote in another thread) from all the Baskervilles they've seen. So for example take the "a" in Monotype's Baskerville. I find it quite ugly; I would never make that on my own. And John Hudson has argued (on the ATypI list) that it's not necessarily the historic form. But really, it doesn't matter: it's what people know, and my commission is to provide something archetypical. So my revival will have that ugliness (just not exactly the same). To me, that's good design.</p>
