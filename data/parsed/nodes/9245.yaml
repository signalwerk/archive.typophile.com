      <p>&gt;No, because a metal sort is not a person.</p>
      <p>That's why I said "like", and also mentioned another analogy, old recordings.<br>
      No analogy is exact, or else it wouldn't be an analogy.</p>
      <p>The analogy is valid: there is a variance of instances in a photo portrait session, just as there is a variance in letterpress type impressions of the same character in a sort. The point is that in a session of "shots" or "instances" where the image is variable, there is always going to be an image capture that is truer than others, and hence also truer than an average. That's the way people see things.</p>
      <p>It is not a scientific truth, but a subjective truth: the discriminating eye of an art director chooses the "selects" for a magazine, and the discriminating eye of the type designer should likewise make its decision. That is the responsibility of design. Averaging is a cop-out.</p>
      <p>Having said that, I do find certain kinds of averaging fascinating, but in those cases there is some edge to the procedure, for instance the musical work of Brian Whitman, where he mines massive databases. The equivalent in typography would be a blackletter mix-font that averages every font keyworded "blackletter" at Myfonts.</p>
