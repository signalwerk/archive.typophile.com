      <p>Hrant:</p>
      <p>&gt;&gt; I have devised quite a few never-before conceived nuances.<br>
      &gt;1) You don’t know that.</p>
      <p>Yes I do. Admittedly I haven't seen every font ever made, but I feel reasonably sure that I would have come across certain things if they had been done previously. Such as an oldstyle italic monowidth unicase font, for instance. (A structural concept, but one requiring considerable nuancing to execute.)</p>
      <p>&gt;You seem a lot more careful now.</p>
      <p>Hopefully one learns from one's mistakes. Type designers can be extremely sensitive to even the most objectively couched analysis, which coming from a peer can seem a bit high and mighty.</p>
      <p>&gt;I was wondering about your “fancy”</p>
      <p>Just the idea that an e_n kern might be useful.</p>
      <p>&gt;structural divergence (the important, interesting stuff) does not preclude even color.</p>
      <p>Well, that's the big challenge, isn't it.</p>
      <p>Raph:</p>
      <p>&gt;sharp results, both in the sense of edge acuity and curvature at corners.</p>
      <p>I don't see that. In the original scan there are a number of sharp features, even at the low resolution. It may be uncertain as to which are parts of the design and which are artefacts (and averaging would differentiate), but nonetheless, there is a quality of sporadic sharpness (aka sparkle?) to the individual impression, which disappears in the average.</p>
      <p>Also, consider that the quality of different pieces of type will vary, both in mint condition and through varying wear. An average is less than top quality. In the same way, certain imprssions will be "sweeter" than others, due to slight variations in paper and inking. Again, the average dulls the best quality, and it is up to the discriminating eye to discern what is best. </p>
      <p>The e_r vs. e_n space: the absence of a lower left serif on the 'n" creates a baseline opening between the letters, so although the fit is slightly tighter, it allows contigual white space to interupt the x-height's evenness.</p>
      <p>&gt;So even if e_n still looks a bit gappy to you, that perception may go away completely at actual printed size.</p>
      <p>I've designed many text faces, and took that into account.</p>
      <p>&gt;my quest to understand ATF’s optical scaling</p>
      <p>Why don't you work with a face where you also have access to the metal type? Then you could compare that with the impression, rather than deduce it.</p>
      <p>&gt;hopefully we can dispense with much of the flamewar </p>
      <p>I apologize for inadverently flaming you, as a result of my ongoing headbutting with Hrant. What you're doing is fascinating, and creative, and throws a number of philosophical design issues into the spotlight.</p>
