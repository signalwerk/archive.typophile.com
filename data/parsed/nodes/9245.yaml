      <p><em>“Revival is not type design” is not a personal comment, it’s a statement of fact.</em></p>
      <p>Nick, I beg to differ. It's simply your opinion.</p>
      <p>First, revivalists are never given a complete Adobe character set. Foundry types almost universally <strong>never</strong> include daggers; section marks; braces; commercial ats; math operators; currency symbols other than those of the country in which the bodies were cast; or oe and ae dipthongs, eths, thorns or German double-esses. In order to include those characters in a font, they have to be <strong>designed</strong>.</p>
      <p>Second, <strong>most</strong> revivalists credit their sources, when they are known: no one is trying to hoodwink anyone here. As I have stated before, the whole idea behind revivalism is to make typographic resources available to a computerized world which heretofore existed only as metal type or handlettering on a page. You might not consider the process to be creative, but it is transformational, and it requires patience, judgment and an eye for design.</p>
