      <p>Whether it's a good idea to average an image seems like a really pleasantly complicated question. On the one hand you could be seeking an average because you want to find out what it is - just curious - or because you think that it is meaningful on an artistic level in an of itself. Maybe valid... Maybe.</p>
      <p>You also might want to use it as Hrant said, as the base to jump off from. That seems fairly viable to me. But my intuition is that if you are not careful a blurry image may lead to soft blurry thinking. Not that it has to be that way - but the averaging could be a way of letting a process be a substitute for looking &amp; thinking. A dubious &amp; weak substitute. It might well be a good tool - I can't say - I haven't tried it. But it does seem like it could be a kind of crutch you don't need getting in the way of the real job at hand.</p>
      <p>I think that is probably why Nick was suggesting that a new remix might be a better route. Making your own would require a more direct &amp; less automatic relationship with the shapes.</p>
      <p>Being really litteral in your revival might be best served by picking an specific imprint to use &amp; improve from ( plus some altrenates to think about ) gives you a more specific outline to develop reactions to - more specific aspects, more personality or character to like or dislike - and to make conscious decisions about.</p>
      <p>And picking a specific instance ( or several one at a time ) also brings you face to face with the issue of ink/imprint/paper VS screen raster &amp; laserprinting &amp; other modern printing/output. There have been many Threads here on Typophile that talk about the relationship. The book ' Counterpunch : making type in the sixteenth century, designing typefaces now ' by Fred Smeijers has a great section in which talks about the way that laserprinters and other modern printing differ from metal print and what he regards as the mistakes that were made when classic faces were digitized. If you are making a revival it seems like this issue aught maybe; to be issue #1. Do you aready know about these issues? Am I preaching to the choir?</p>
      <p>Hrant, What is APHA? </p>
      <p>I hope your project goes well. This face has a ton of personality &amp; verve. I think thats why I worry about averaging. It think that verve might be lost in the process.</p>
