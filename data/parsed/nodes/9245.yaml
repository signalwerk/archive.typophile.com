      <p>Thanks. I was hoping it was a more complete showing, but at having all the sizes is helpful. I see that what they have listed as a "14" is what I've measured as 16. Sigh, one of these days I'll actually learn to measure ancient sizes.</p>
      <p>So you’re doing a literal revival? Like you’re not going to improve that “g”?</p>
      <p>What I've drawn so far is quite literal, but I do plan on improving some of the glyphs. The cap "T", for example, reads too much like an "E". I'm not yet convinced I need to redo the "g", though. It's perfectly legible, and is a very distinctive feature of the font. It's also historically grounded, having the same shape as in Collard Mansion's 1484 Ovid Metamorphoses (arguably a more direct influence on this font than Gutenberg; in particular, the final letter variations are almost a direct match). [plate 22 in Morison and Day]</p>
      <p>What would you suggest bastardizing it to?</p>
