      <p>I'm going to gently disagree with Nick on a number of points.</p>
      <p>First, I believe my averaging technique <em>does</em> produce sharp results, both in the sense of edge acuity and curvature at corners. Keep in mind we're looking at a 14pt glyph here; on a typical 96dpi screen, that means we're looking at 25x magnification, or 50x for the last image I posted.</p>
      <p>Second, your e_r vs. e_n argument doesn't convince me that there's a color problem, for two reasons. For one, note that the left serif of the 'r' is shorter than the left serif of the 'n', so the stroke is closer in (the distance between the right tip of the 'e' and the left serif is pretty much the same). That, in turn, balances the perception of greater space due to the lack of a projecting lower left serif on the 'n'.</p>
      <p>Also, ideal spacing for a printed page may well not be ideal spacing for an enlargement viewed on screen. I've proposed before that as size increases, gaps become relatively more important, and distances between stems relatively less. So even if e_n still looks a bit gappy to you, that perception may go away completely at actual printed size.</p>
      <p>There are significant differences between the various sizes of this font, and these differences have a definite impact on color. I very deliberately chose the 14pt size, mostly because I liked its color best. One of the most important tasks facing a "digitizing interpreter" (or whatever term seems most appropriate) is to choose between the various sources available. There's an unhealthy tendency, I think, to seek out large sizes for their sharpness and robustness to printing variations. The averaging technique has the potential to change this balance, and more clearly reveal the cool stuff going on in the smaller sizes.</p>
      <p><cite>&gt; You can actually see the body of the metal being surrounded by the ink gain.</cite></p>
      <p>This is really interesting to me - could you elaborate?</p>
      <p>You should be to see this fairly clearly in the <a href="http://levien.com/type/myfonts/xgothic/s_sharp.png" rel="nofollow">last image</a> I posted. In particular, at about 5 o'clock, at the thinnest part of the stroke, you should be able to see a dark-gray stripe nestled inside a blacker outline. I believe the dark-gray is actually a good image of the metal, while the outline is composed of ink spread. If so, hopefully I can unlock one of the last mysteries in my quest to understand ATF's optical scaling, to wit the relative contribution to thickening from the pantograph and the ink spread on printing. I'm looking forward to getting some time to refine my techniques so I can capture even clearer images - the ones I've posted here are still a bit murkier than I'd like, especially for visualizing these more subtle aspects.</p>
      <p>In any case, hopefully we can dispense with much of the flamewar on this thread, as I am indeed not making any particular claims to creativity. The main reasons I'm doing this font are to learn more, and to refine my tools. I feel good about the progress on those goals even if this font is never used for anything other than the nameplate on the front door of my new apartment.</p>
