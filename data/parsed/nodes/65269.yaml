    html: |-
      <p>Old style or transitional with grotesque?<br>
      That's like harp with saxophone--interesting contrast but a little offbeat.<br>
      The classic combination for a late 19th century sans serif would be a <a href="http://www.shinntype.com/scotch.html" rel="nofollow">modern</a> face.<br>
      If by solid you mean chunky, then a Century or a Clarendon would be a good choice.</p>
