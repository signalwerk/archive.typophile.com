    <p>I don't know how well I will explain this but I will try.  Back in the day, we used Metal Letters that we would rub off onto our stencil and then handcut the letter from the rub off. The computer has made cutting letters much easier, but the one good thing about the Metal Letters is that as the type size increased, the serifs didn't scale, they were kept thin and this made for a nicer looking font. The computer fonts at large sizes all look heavy as they are simply scaling up the font.</p>
    <p>I thought I read somewere that OpenType now supports Alternate characters, so I was wondering if it would be possible to create an OpenType Font with Fontlab that would alternate the character set above certain sizes.  So 0 - 90 points would be one set of characters, and 90 - What Ever would be another.  Giving us a closer look to our old Metal Letters. (This substituation would accure maybe two or three time depending on the font.)</p>
    <p>Does that make sense?  Is it possible? I know I could create three different fonts and suggesst sizes, but I would rather have it all in one font and automated.</p>
    <p>Them old timers knew what they were doing and had good looking fonts, now if my computer was smart enough to do the same.</p>
    <p>Shelby</p>
