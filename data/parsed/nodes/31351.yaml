      <p>OpenType was originally going to support multiple master functionality as well, but it was yanked from the OpenType spec way back around early 1998, IIRC. Although conspiracy theorists may argue otherwise, the main reasons were that there was a big support cost for multiple master, and end users hadn't embraced MM functionality very enthusiastically. The guy who was engineering manager for the type department at the time (Dan Mills) thought that we would find it a lot easier to make OpenType successful if it didn't include MM.<br>
      I believe he was right about that, although I for one miss MM functionality.</p>
      <p>Although it didn't help that our partner in OpenType, Microsoft, was not particularly enthusiastic about MM, this was not the the core reason for Dan's decision.</p>
      <p><cite>So can anyone give an example of how with OpenType I can substitute a glyph for another glyph if the point size is &gt; then a given number?</cite></p>
      <p>To the best of my knowledge, it isn't possible.</p>
      <p>Theoretically you could get equivalent results by using elaborate TrueType delta hinting, but in practice it wouldn't work (too much work, and too many high-end rasterizers are ignoring delta hints these days anyway).</p>
      <p>Cheers,</p>
      <p>T</p>
