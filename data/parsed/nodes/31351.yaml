      <p>The official OpenType approach is to have separate fonts, but have optical size info in the fonts that can (in principle) automate the size-switching. The only problem is that except for some flavor of TeX, no application that I know of is taking advantage of this as yet.</p>
      <p>Regards,</p>
      <p>T</p>
