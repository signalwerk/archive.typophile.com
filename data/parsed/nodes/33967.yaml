      <p>Part of design is the aesthetic of it all, then the other part is functionality. Especially when working with publication design.</p>
      <p>For example. </p>
      <p>In "Meggs' History of Graphic Design" they take a very untraditional approach to their handle of the copy. It is very "creative" but there are several things I find wrong with it.</p>
      <p>1. The use of san-serif fonts for the body copy. This strains my eyes when all the letter forms are made up of the same stroke weight and I don't have serifs that take that guesswork out of which letterform is which. </p>
      <p>2. The columns run to close to the gutter, so to read the copy closest to the spine I have to flatten the pages out as far as they will go, reading the first chapter was almost impossible. </p>
      <p>3. There is no thumb-space. I can't hold the book and read it. The book MUST be set down. </p>
      <p>When this book was designed the functionality and the idea that somebody will actually sit down and read this book was completely ignored. Granted it LOOKS nice, but reading it is a chore. </p>
      <p>So in short, my design annoyance is neglect of the end user, the reader.</p>
