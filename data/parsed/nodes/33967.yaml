    <p>Principles of form and design by Wucius Wong 1993</p>
    <p>Is it so difficult to actually indicate which section/chapter we are in?<br>
    Some of the text refers to other chapters. If I want to go to that chapter I have to go to the contents page, find the chapter, but hold on, it is split into sections and chapters.<br>
    I have to check the section and then the chapter. Get the page number then go there.<br>
    Some of the illustrations are not labelled consistently. Fig. 58a could be on the next page, the figure numbers are sometimes right next to the gutter, bend the pages to clearly see what they are. I still can't believe that Josef Muller-Brockmann used the inner gutter margin to put his page numbers.</p>
    <p>Are there anymore design/navigation annoyances?</p>
