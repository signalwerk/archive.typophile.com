      <p>Visual Research: An Introduction to Research Methodologies in Graphic Design (AVA Academia)  by Ian Noble and Russell Bestley</p>
      <p>Over design - on most left hand pages (not on the initial chapter page or full bleed images pages) they have the page number and the page number of the next page. Is that a waste of ink or something? I am too stupid to work out that the next page is going to be 1 more than this page?<br>
      Then some of the text refers to chapter numbers. Guess what? The actual pages of the chapters only have the titles and not 'chapter 1' etc.</p>
      <p>The actual book is full of woolly theory and concrete examples. It is easy to read, it looks 'oversize', like someone pointed a zoom lense to the pages.<br>
      I have not actually found a really good/well designed navigation in a book.<br>
      Anyone suggest a really good navigation example?</p>
