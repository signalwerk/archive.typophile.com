      <p><em>Are there anymore design/navigation annoyances?</em></p>
      <p>For starters, and in no particular order:</p>
      <p>Bad/non-existent indexes/references/bibliographies</p>
      <p>Inconsistent running heads</p>
      <p>Bleeds that cover page numbers</p>
      <p>Pull quotes more than a page away from their inclusion in text/don't exist in text/too narrow/too wide/poor font/style choice</p>
      <p>Poor/inconsistent editing/spelling/punctuation/use and definition of acronyms</p>
      <p>Unreadable/inappropriate figures/tables/other graphic material</p>
      <p>Call-outs more than a page away/non-existing/wrongly labelled</p>
      <p>Inappropriate/inconsistent layouts and/or spacing and/or head designations</p>
      <p>I'm sure there's more....  :-(</p>
