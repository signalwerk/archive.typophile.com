    html: <p>Gotham is a very open typeface. Large, open counters and as well as large x-height in relation to the ascender and descender render it usable at text sizes. That said, however, too much of it at a too small point size, especially on a coated bright white paper, could send the reader into fits. It sparkles.</p>
