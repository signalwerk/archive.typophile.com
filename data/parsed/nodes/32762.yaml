    <p>Sorry if this is a redundant question on this forum.</p>
    <p>I'm looking for a nice serif <a href="/wiki/typeface%20pairing" class="freelinking" rel="nofollow">pairing</a> for <a href="/wiki/Gotham" class="freelinking" rel="nofollow">Gotham</a> - this would be for some info cards I'm laying out...</p>
