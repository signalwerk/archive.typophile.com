    html: <p>Nick, I think your work is very strong� particularly your collections and bound books. However, I'm not sure that the design of your site represents your content in a straightforward manner; while I commend the use of a typeface of your own design as navigation headings, I didn't 'get' the schema until I read your caption (I read the commas and periods as separators and the text as links initially). Perhaps some sort of user interaction such as a mouseover colour would be helpful.</p>
