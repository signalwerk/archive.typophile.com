  html: |-
    <p>Hello Everybody,</p>
    <p>I have designed this symbol for a client and am in need of a complimentary typeface to go along with it for the basis of the signature. I've been playing around with a lot of basic serif fonts (garamond, times, didot, etc). The idea is to get something professional looking to start out with and kind of use that as a template to make a unique logotype.</p>
    <p>the business is called "Dey's Write to Work" it is a business that helps people write resumés, cover letters and such in order to help them gain employment.</p>
    <p>any suggestions for a launching off point?</p>
