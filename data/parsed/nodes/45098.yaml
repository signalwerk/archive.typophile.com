      <p>I just found this thread (thanks to your Elien<br>
      one) so I don't know if it still matters, but:</p>
      <p>Most of the work of Mnatsakanyan and others (certainly the crushing majority of digital Armenian fonts) are indeed highly Latinized, especially in the lowercase. I myself have worked a lot in the direction of aesthetic and functional authenticity of Armenian, and one quick thing I can refer you to is this: <a href="http://themicrofoundry.com/ss_rome1.html" title="http://themicrofoundry.com/ss_rome1.html">http://themicrofoundry.com/ss_rome1.html</a></p>
      <p>If you'd like more please let me know.</p>
