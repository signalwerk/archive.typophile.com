    <p>Hello, </p>
    <p>I take a part in a project developing Armenian alphabet for existing latin/multilingaul font family in order to expand its multilingual set. So I’m interested in the proportions of Armenian letters, especially comparing with Latin ones. I’ve learned just a couple of basics about the smaller x-height of armenian typefaces for the better readability. It’s not enough for a quality authentic font. I’ve got a copy of  Mnatsakanyans “Haykakan Taratesakner” (1972), and another one from Gortsakalyan (1973). But the content of these books is considered to be “latinized”, doesn’t it? Could you recommend me any other literature about Armenian type design?  </p>
    <p>Thanks a lot,</p>
    <p>tat</p>
