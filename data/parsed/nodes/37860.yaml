      <p>I’m a type novice so I am regularly on the lookout for such books. </p>
      <p>I think the most valuable resources I have encountered so far are Counterpunch and Briem’s notes (both mentioned by Ricardo).</p>
      <p>In short, Counterpunch is great because it helped me fathom some type conventions. Briem’s notes offer an insight into optics and points out some pitfalls you may encounter.</p>
      <p>I own Designing Type but, with all due respect I don’t find it so useful. It’s more an analysis of existing type than the process or evolution of type design. Of course this is interesting in itself but in isolation seems a bit lacking.</p>
      <p>I think one of the best resources is actually this forum, so you are in the right place already!</p>
