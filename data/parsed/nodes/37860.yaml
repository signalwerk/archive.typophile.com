    <p>I’m looking for some good books about how to design type. There are plenty of beautiful, inspirative and even boring books on typography in general, but that’s not what I’m looking for. I really want to know about the basic priciples, for instance which letters to design first, what is the best way to design them, et cetera. </p>
    <p>The Dutch bookshop Nijhof &amp; Lee (<a href="http://www.nijhoflee.nl/design/typography/" title="http://www.nijhoflee.nl/design/typography/">http://www.nijhoflee.nl/design/typography/</a>), who has a great choice in books on typography, sells Designing Type by Karen Cheng. Have any of you read it and if so, has it helped you any further?</p>
    <p>I’m relatively new to Typophile, so chances are this discussion has a history...</p>
    <p>Kind regards,<br>
    Jean Paul</p>
