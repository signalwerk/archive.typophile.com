    html: <p>&gt; they have some familiarity and expectation of <br>&gt; what the words will say. "Sick Moves" is not <br>&gt; a general figure of speech. <br> <br>And "sick motels" is? <br>Graffiti-aware people also have some familiarity with the "coded" letters themselves, and/or the <i>ways</i> in which they might be encoded - you of all people should note that. <br> <br>&gt; they are willing to take the effort to decode the text, because they realize it's targeted at their demographic. <br> <br>Some people -like me- are willing to make the effort even if they know the message isn't for them. They might find that stimulating/fun. Like watching a movie in a language you don't know - I personally can't get enough of that. <br> <br>&gt; The cryptic quality of graffiti is perverse and elitist. <br> <br>? <br>I'd rather see it as playful, challenging. <br> <br>&gt; it's a little too easy to hide a lack of design skill behind cryptic forms. <br> <br>But good "encryption" is a design challenge of itself! And I don't think you can really innovate if you totally ignore legibility - it's in <i>twisting</i> it properly that there is creativity. <br> <br>That said, graffiti is not typography. Not because it's less developed, but because the letters are 100% contextual. And it's not calligraphy either, because ductus is not its essence. It's lettering. <br> <br>&gt; Why do you think its a crime to create graffiti. <br> <br>Because it costs the rich money? <br> <br>BTW, Daniel, you race bikes? Street luge is so much more interesting. And it's illegal too. <br> <br>&gt; They just convicted a 32 yr old graffiti artist <br> <br>Yeah, they convicted Nelson Mandela too once. <br> <br>-- <br> <br>Christian, it's nice to see you studying the past, but looking to the future. However, concentrate on lettering, not calligraphy. <br> <br>hhp <br></p>
