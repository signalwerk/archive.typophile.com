    html: <p>Does anyone have A History of Calligraphy by Albert Gaur? Pretty good for the most part. A lot of info on non Latin, Arabic and Asian forms of calligraphy. <br> <br>When looking at tags (albeit the least favorite form for non practioners) what most people who are not accustomed to reading graffiti miss is that each artist usually has very consitent forms from one tag to the next. Its the free play in scale and dimension that makes it hard to look at it in a similiar light as historic calligraphy, but when they are measured and rythmic on purpose, it creates a new thing, a hybrid of graffiti and calligraphy. My interest lies in the in between stage, regularizing calligraphy (or in this case, graffiti). <br> <br>Thats it for now. I'll be back later, with some examples of geographic styles.</p>
