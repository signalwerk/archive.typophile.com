    html: <p>Nick, <br> <br>I think it may just be a case of practice, outsider vs insider. Blackletter is damn near impossible for most people outside of our community to read, even I wouldn't want to read any substantial text in it, yet it's legibility is something that changes with a viewer who is accustomed to it. there are blackletters that are more legible and blackletters that are more ornate.  <br> <br>The word magazine in the extended sans simply adds a contrast. <br> <br>Legibility is obviously important, but sometimes not as important as other things though. Judging everything based upon legibility is a slippery slope. It can deny innovation. <br> <br>I agree with BJ, the outline version above may be better seved as an alternate version, focusing on the forms in black without the outline would be better serving. <br> <br>"Writing" is a very cool book, great concept. <br></p>
