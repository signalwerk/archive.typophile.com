    html: "<p>I've never tried graffiti. <br>It's gestural: for the arm, as calligraphy is for the wrist. <br>Even in simple tagging, graffiti is nowhere near as formalized as calligraphy, so it's very resistant to being type-formed.  <br> <br>It's also cryptic. I know of one situation a few years ago where the name of a rave was rendered in graffiti in a flyer, and few showed up, presumably because not many could figure out what the event was called. <br> <br>It's also illegal, so advertisers are by and large not going to want to be associated with it. However, that's a good reason why it could catch on, in this time of bad behavior. <br> <br></p>"
