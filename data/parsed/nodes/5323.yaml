  html: <p>last night i was sitting with my pal, talking about all kinda things and sketching together, and i said to him - 'isnt it wierd that typographers i know are apathic about graffiti? because me personaly, i think graffiti is a peak in typography and caligraphy's history. people all around the world are exploring letters in amazingly innovative ways, and its an artform of the masses.. so men and women of all ages, and all sorts of social backgrounds, are writing. i know that when i think of a typography utopia.. its something very much like whats going on in graffiti today. and even though sometimes graffiti is very diffrent from type, it remains an incredibly exciting thing - its a movement of more-or-less neo-typographers and calligraphy masters. if i was a type designer, i think it would make very happy to know that in my area kids are working hard to improve their letters. more so, to know that great calligraphers live and work in my lifetime'. <br>what do you guys think about graffiti? do you see it as something thats a part of the history of typography or calligraphy? do you write graffiti? </p>
