    html: "<p>Nick, I appreciate your skepticism, it helps to decvelop this conversation further. <br> <br>I think you raise some good points, first of all, your correct graffiti is not typography, not yet, at least in any quality form. It is absolutely a form of contemporary calligraphy however. A very established and probably much more practiced form than most traditional calligraphy styles today. And within this world of contemporary graffiti (which is less than 50 years old) different cities (in the states) established different styles. Most writers within a city will have a similiar style ie) my reference to blackletter earlier. This is what intrigues me, the developments of scripts that have geographical characteristics. <br> <br>As for point A) peoples familiarity and expectations: <br> <br>Most graffiti writers are primarily writing their nicknames (a nom de plume) which is usually a 4-6 letter word or acronym or just a rediculous group of letters that the artist thinks look good together. It's not always a pop cultural reference, which means that there is not always an in to deciphering it based on hip hop lingo. <br> <br>\"Conversely, it's easy to be innovative when you don't have to be legible -- and that devalues the quality of innovation.\" <br> <br>That is a very good point, however I think that there is room for an evolution in craft, and applying the rules developed for modernist typography is hardly fair to apply to art forms developing independent of that. There are certainly great things to take from the modernist or classicists but in this case I find that these traditions can be limiting, and the new forms worth pursuing . <br> <br>I have been looking to the development of type based upon calligraphy, to draw corelations. I have been reading Tracy, Chappel, and Bringhurst, and found a good book called Calligraphic Type Design in the Digital Age, which focus' on Zapf. If anyone has any suggestions of authors who look at the development of typography from a calligraphic standpoint, please share. I'd greatly appraciate it. <br> <br>C</p>"
