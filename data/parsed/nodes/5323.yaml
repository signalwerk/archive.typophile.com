    html: <p>perheps the most important distinction to make is that writers are artists and not designers. their biggest objective it self expression. like realism is for the visual artist, legibility is a tool for the writer. to get your name known, it is sometimes most rational to simply paint your name over some highway or factory building in big ••• fat letters (thats called a blockbuster). usauly though, there are more importent things then having everyone know you're around, and sometimes having a distinct style is more 'profitable' (in terms of getting your name known) to the writer.  <br> <br>alot of times writers do pieces which are abstract and complex. they dont do that because they are elitist or because they dont care about the structure of letters, but because they have a more important objectives then to be legible.  <br> <br><img src="http://www.typophile.com/forums/messages/30/38186.jpg" alt="Daim"> <br> <br>the funny thing, nick, is that ive met some writers who think alot like you. they belive that graffiti should be legible all the time. some of them think graffiti has rules, like typography styles have. <br>i think that once you make graffiti into a branch in typography it loses all its charm. <br> <br>&gt; Then I hope you're left-handed. ;-)  <br>&gt; Or do you already only have a right hand? That would explain the all-lc. ;-&gt;  <br>lol.. that would be a grand excuse! unfortunetly im just plain lazy :D <br>uhm, i'd give my remaining hand if everyone here would speak in my mother tongue.. <br> <br>what, nobody wants to battle? <br>what are you.. men or typographers..? <br> <br>&gt; Would you mind sharing where you saw that story or who the artist was who was arrested in NYC today?  <br>maybe he's reffering to COPE2...? <br> <br>christian, have you seem Os Gemeos' handstyle? <br><img src="http://www.typophile.com/forums/messages/30/38187.jpg" alt="Os Gemeos (&quot;The Twins&quot;)"> <br> <br>daniel, christian has done graffiti.. so when he says that graff aint about gangs nowadays, i think its safe to belive him. i have seen writers get violent, but it was just average urban bad-tempered people.  <br> <br>&gt; Have you guys checked out 'Writing' from Die Gestalten Verlag? <br>yeah, i own a copy. its an awesome book. highly recommended. the pictures are beautiful and the articles interesting. <br>the only downside is that they concentrated too much on german writers. <br> <br><img src="http://www.typophile.com/forums/messages/30/38188.jpg" alt="Akim"> <br></p>
