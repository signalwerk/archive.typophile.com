    html: "<p>Wow, I can't believe i missed this post ALL week long! <br> <br>I have been working on a type foundry/ book project for the past year. Working with artists documenting, converting and digitizing their handstyles into fonts. Currently we are working with:  <br>-ESPO (Philly, and NYC, mentioned and flicked above)  <br>-JOKER (Portland) <br>-SABE (NYC)  <br>-MESK (DC,Philly, NYC) <br>-MESH AOK (NYC) <br> <br>Similiarly to Itay K's notion that there are similiarities between graf and calligraphy, our premis is that their is a huge connection, particularly in the practice of and development of style. Outsiders rarely notice, but anyone who will take the time to look will notice that their is a cohesive style connected with regions and cities not unlike calligraphic style development. <br> <br>Southern California has always had an angular Cholo/Mexican style to their letterforms. Philly has tall prints where the letters overlap at a very aggessive script style, NYC has very bold and loud styles, particularly the throwup, which could be argued is an invention brought about as a result of trying to write in New York, where the streets are always busy, and it pays to cover the most real estate in the shortest ammount of time to paint it. <br> <br>You can check out the thesis at our website: <br><a href=\"http://handselecta.com/one.html\" target=\"_blank\">http://handselecta.com/one.html</a> <br> <br>Our sites a little outdated but we are hoping to have it updated with new info and online font sales sometime this fall.  <br> <br>Unfortunately I can't yet post samples of the fonts in progress but after they are approved and finished working through with their respective artists, I'll try to post some. And yes we are implementing OT (as soon as I figure it out. FL is a massive program to teach yourself, 2 years and I only utilize about 1% of what it can do). <br> <br>Itay K and any others interested in finding out more can email me.  <br> <br>Christian <br> <br>PS, Yes, I write graffiti (actually I retired, from it) And I also have a formal Design education as well. <br> <br> <br></p>"
    html_clean: "<p>Wow, I can't believe i missed this post ALL week long! <br> <br>I have been working on a type foundry/ book project for the past year. Working with artists documenting, converting and digitizing their handstyles into fonts. Currently we are working with:  <br>-ESPO (Philly, and NYC, mentioned and flicked above)  <br>-JOKER (Portland) <br>-SABE (NYC)  <br>-MESK (DC,Philly, NYC) <br>-MESH AOK (NYC) <br> <br>Similiarly to Itay K's notion that there are similiarities between graf and calligraphy, our premis is that their is a huge connection, particularly in the practice of and development of style. Outsiders rarely notice, but anyone who will take the time to look will notice that their is a cohesive style connected with regions and cities not unlike calligraphic style development. <br> <br>Southern California has always had an angular Cholo/Mexican style to their letterforms. Philly has tall prints where the letters overlap at a very aggessive script style, NYC has very bold and loud styles, particularly the throwup, which could be argued is an invention brought about as a result of trying to write in New York, where the streets are always busy, and it pays to cover the most real estate in the shortest ammount of time to paint it. <br> <br>You can check out the thesis at our website: <br><a href=\"http://handselecta.com/one.html\" target=\"_blank\" class=\"link-external\">http://handselecta.com/one.html</a> <br> <br>Our sites a little outdated but we are hoping to have it updated with new info and online font sales sometime this fall.  <br> <br>Unfortunately I can't yet post samples of the fonts in progress but after they are approved and finished working through with their respective artists, I'll try to post some. And yes we are implementing OT (as soon as I figure it out. FL is a massive program to teach yourself, 2 years and I only utilize about 1% of what it can do). <br> <br>Itay K and any others interested in finding out more can email me.  <br> <br>Christian <br> <br>PS, Yes, I write graffiti (actually I retired, from it) And I also have a formal Design education as well. <br> <br> <br></p>"
