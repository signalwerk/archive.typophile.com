    html: "<p>Hrant is on to something here. Below are pictures of 3 Philladelphia writers. Philly has a distintive indigenous style, that has remained since the 70's. Many writers from other cities hate this style (and the jury is out on its aesthetic value) but what is interesting is that there are certain self imposed rules that give cities cohesive styles, just like rustica is different from a humanist hand, philly is different from NYC. Obviously as technology has made the spreading of images easier, you find city styles intermingling, but there are still intrinisic characteristics of some hands that you can trace to geographic regions. <br> <br>Am I starting to repeat myself too much? <br> <br>Philly Styles: <br><img src=\"http://www.typophile.com/forums/messages/30/38197.jpg\" alt=\"Kadism\"> <br>KADISM <br> <br><img src=\"http://www.typophile.com/forums/messages/30/38198.jpg\" alt=\"SANK\"> <br>SANK <br> <br><img src=\"http://www.typophile.com/forums/messages/30/38199.jpg\" alt=\"Creep\"> <br>CREEP- They call this style\"Wicked\" with the loop links between letters <br> <br>Be patient if you find them incoherent, My point is that they are all within a set of rules or one style based upon their city. I know they are not the most legible. Most graffiti writers from other cities even have trouble with Philly hands. <br></p>"
