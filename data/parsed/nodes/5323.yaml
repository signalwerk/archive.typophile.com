    html: <p>I don't buy into the whole 'There are no rules in graffiti' thing, off course there are rules, they're just not written in books, they're written all over the city. Every movement, be it artistic or otherwise make rules that people have to follow in order to be part of that movement. <br> <br>Itay K, I'm baffled why no one else took your challenge or whatever it is. I'm in if it's about pushing the boundaries of what's what and what's something completely different. If it's about proving that type designers are crap at graffiti, I'm not in, because if it is, the decision about the quality of whatever comes out of this has already been made, and I'd be damned if I'd give in to that. <br></p>
