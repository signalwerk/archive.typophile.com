    html: <p>Have you guys checked out 'Writing' from Die Gestalten Verlag? <a href="http://www.die-gestalten.de/flash.php" target="_blank">http://www.die-gestalten.de/flash.php</a> <br>it's brilliant, it's about what they call urban calligraphy and has a beautiful flow from tag to throw-up (not as in 'vomit') to piece and beyond. <br> <br>I think that graffiti is too broad to be treated as one thing, there are tags, throw-ups, pieces, posters, stencils and wayyyy more stuff that's sort of hard to categorise simply as 'graffiti', ZAST and AKIM and loads of other people are doing some pretty cool 3D things, sort of like graffiti-sculpture. <br> <br>If you're into stencils, I have a few that you can download, print out, glue on to cardboard and cut out at my site, in the Type section, sorry about the self plug... <br> <br>The illegal factor of graf is a bit dodgy to me, I live in a house that is constantly bombed by crap 'artists'. (on top of that, I'm the guy responsible for cleaning the building.) On the other hand, I'd find my town more dull without graffiti. I also appreciate the fact that risk and urgency is part of the craft.</p>
