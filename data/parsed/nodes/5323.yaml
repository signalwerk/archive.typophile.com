    html: "<p>&gt;outsider vs insider <br> <br>I don't accept that this concept has anything to do with legibility. <br> <br>Certain groups of people (to whom graffiti speaks), are able to decode it because (a) they have some familiarity and expectation of what the words will say. \"Sick Moves\" is not a general figure of speech. <br>And (b), they are willing to take the effort to decode the text, because they realize it's targeted at their demographic. <br> <br>Consequently, I suspect that  if a blind scientific test were to be given, showing fresh graffiti to two groups of people (1) graffiti-philes and (2) graffiti-indifferent, with text that was well-known to both groups, that there would be no difference in \"legibility scores\".  <br> <br>The cryptic quality of graffiti is perverse and elitist. Graffiti artists don't want to share the meaning. <br>Which is fine, but it has nothing to do with learning how to read a style of typography. <br> <br>Perhaps a better comparison than Blackletter script would be Psychedelic rock posters. <br>BTW, Victor Moscoso will be at TypeCon -- is that cool or what?! <br> <br>There is a problem if graffiti is to be considered a legitimate typographic art form, rather than as graphic decoration: it's a little too easy to hide a lack of design skill behind cryptic forms. <br> <br>&gt;Judging everything based upon legibility is a slippery slope. It can deny innovation. <br> <br>Conversely, it's easy to be innovative when you don't have to be legible -- and that devalues the quality of innovation. <br> <br>Legibility is the \"sine qua non\" of typography -- which is why I can respect graffiti as graphics, but not as typography. <br> <br>Perhaps I am expecting too much, and it's impossible to create graffiti art that communicates broadly without selling out. <br> <br>However, it has been done -- Keith Haring was able to transcend the genre. </p>"
