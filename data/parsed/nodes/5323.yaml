    html: <p>nick, i found the diffrence between calligraphy and graffiti quite non-existing on several occasions. most of the time i find the two mixing into each other. if you write in someone's sketchbook, for example, thats both calligraphy and graffiti, its a point were the two meet and blend into each other. most of the time i just see my typographic experiments leaking and mixing with my graffiti sketchs, or vice-versa, until i cant tell which is which. its true that graffiti uses diffrent tool then calligraphy.. thus forcing you to use your whole arm. but even though the technique's an importent thing to learn its not the real issue. the really importent thing is how you write, how beautiful and original are your letters. <br> <br><img src="http://www.typophile.com/forums/messages/30/37573.gif" alt=""> <br> <br>bj, i havnt read that book. does it have pictures of ESPO's (aka Stephen Powers) work inside?  <br>he's considered by many a lousy writer because he only did blockbusters, no bombing or complex pieces. his work is plainly typographic in comparison to the general nyc graffiti trends and traditions.   <br> <br></p>
