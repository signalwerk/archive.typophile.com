    votes: null
    html: |-
      <p>Damn! </p>
      <p>Scriptor, thanks for that. I've spent many years writing feature definitions code, and hit this problem several times, and never realized this simple solution. </p>
      <p>I have always assumed that in AFDKO syntax, it's not possible to write: </p>
      <p><code>feature ss01 {<br>
        sub A by B;<br>
      } ss01;<br>
      feature liga {<br>
        sub B by C;<br>
      } liga;<br>
      feature ss01 {<br>
        sub C by D;<br>
      } ss01;</code></p>
      <p>But actually, your post made me realize that it is possible, and correct. The AFDKO compiler (in FontLab Studio) will issue a warning (feature already defined: ss01) but it'll still compile. </p>
      <p>What this code does is, when expressed in AFDKO 2.5 format, which is closer to what happens in the real font, it will produce three lookups: </p>
      <p><code>lookup L1 {<br>
        sub A by B;<br>
      } L1;<br>
      lookup L2 {<br>
        sub B by C;<br>
      } L2;<br>
      lookup L3 {<br>
        sub C by D;<br>
      } L3;</code></p>
      <p>and will map those lookups to two features: </p>
      <p><code>feature liga {<br>
        lookup L2;<br>
      } liga;<br>
      feature ss01 {<br>
        lookup L1;<br>
        lookup L3;<br>
      } ss01;</code></p>
      <p>Since in the font, the it is the order of lookups that defines the order of processing of the glyph stream, this will have the effect that if only "liga" is active, only the lookup L2 will be executed, if only "ss01" is active, the lookup L1, and then L3, will be executed, and if both features are active, then the lookups will be executed in the order L1, then L2, then L3. </p>
      <p>Brilliant. I never thought that this was actually possible to do in the AFDKO 1.6 syntax that FontLab Studio 5 is using. (In AFDKO 2.5, which is used by Fontographer 5 and DTL OTMaster, and will also be used by FontLab Studio 5.5, I assumed that this was only possible by placing the lookup definitions outside of the feature definitions. But I was wrong. The method shown above is also valid, and it works in AFDKO 1.6 already. Cool!)</p>
      <p>Best,<br>
      Adam</p>
