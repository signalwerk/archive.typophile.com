      <p>Basically, this finding also means that the syntax: </p>
      <p><code>feature ss01 {<br>
        lookup L1 {<br>
        sub A by B;<br>
        } L1;<br>
        lookup L2 {<br>
        sub B by C;<br>
        } L2;<br>
      } ss01;</code></p>
      <p>can be equivalently expressed as</p>
      <p><code>feature ss01 {<br>
        sub A by B;<br>
      } ss01;<br>
      feature ss01 {<br>
        sub B by C;<br>
      } ss01;</code></p>
      <p>Very interesting!</p>
