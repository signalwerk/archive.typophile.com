    html: <p>Thanks John. I feel less inelegant now. Can I get away with an extra liga feature bloc as well?</p>
    html_clean: <p>Thanks John. I feel less inelegant now. Can I get away with an extra liga feature bloc as well?</p>
  - id: 460668
    user: 1262
    date: 2011-04-17T19:34:00
    date_raw: 17 Apr 2011 — 7:34pm
    votes: null
    html: <p>You can have whatever arrangement of lookups achieves your purpose. You should try to be efficient, bearing in mind that the more lookups you have the greater the processing required during layout, but that doesn't always imply lumping all the lookups for one feature together; sometimes, staggering the lookups gains you efficiencies elsewhere.</p>
