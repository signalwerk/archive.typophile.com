    html: <p>My concern is about the two or three recompilations that might occur before it all comes up on an end user programme. How is one to know that a 'warning' such as you mention does not mean that a subsequent piece of programming might be too clever by half and decide to bring all the 'calt' coding together into one block so that all of it ends up upstream of the 'salt' feature anyway?</p>
