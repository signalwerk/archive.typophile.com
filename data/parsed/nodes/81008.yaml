    html: <p>There's nothing wrong with this, and I wouldn't assume it to be inelegant. The OpenType Layout model explicitly allows this, and in some cases it may be the most elegant solution to a layout challenge. I regularly make fonts with staggered lookups.</p>
    html_clean: <p>There's nothing wrong with this, and I wouldn't assume it to be inelegant. The OpenType Layout model explicitly allows this, and in some cases it may be the most elegant solution to a layout challenge. I regularly make fonts with staggered lookups.</p>
