  html: <p>I found myself having to use two different calt blocks, one upstream of a salt block and one downstream from the salt block. This is admittedly inelegant, but can it cause any real problems?</p>
  html_clean: <p>I found myself having to use two different calt blocks, one upstream of a salt block and one downstream from the salt block. This is admittedly inelegant, but can it cause any real problems?</p>
