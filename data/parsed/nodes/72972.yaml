    html: |-
      <p>My eye wants the /or/ in Pryor to be connected.<br>
      Where the swash off the /e/ gets thick, perhaps it comes to the fore too much (it shouldn't grab attention more than the letters in your name).<br>
      Text at bottom looks too tightly spaced? (Keep in mind letterpress will spread the strokes a bit.)<br>
      I think you could do without the dotted lines - maybe just keep the top horizontal one?</p>
