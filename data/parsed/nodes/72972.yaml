  html: |-
    <p>Hi Everyone,</p>
    <p>I've started doing freelance jobs with wedding/event planners and wanted to come up with a business card that speaks to my new clientele. The card will be letterpressed. It's  minimal but I was hoping the typography and tactile feeling of the letterpress would carry it through and give it a classic elegant look and feel.</p>
    <p>One last note: to get the deal on letterpressing this must be one color black and one sided.</p>
    <p>I really would love to know what you think, any opinions, criticism, anything at all!</p>
    <p>Thanks!<br>
    Stephanie</p>
