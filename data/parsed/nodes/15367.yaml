      <p>&gt; the term “word shape” is bad</p>
      <p>I think this is obvious too. As a descriptive term it's a kind of endless self refferential ride you can't get off of. 'Bouma' is better because like 'typographic color' it is abstract enough to take on definition &amp; clarity over time. Even if it is so vague on initail contact that it means nothing - like a new word for some novel kind of food on the menu - eventually we find out what the word means and sometimes the specificity is utterly worthwhile. Once Ramen, Tamale or Yqem may not have meant much to you chances are today you know what some of these things are - and I think you would not prefer to see them described as noodles, Fried stuffed pepper, or Dessert wine. Why? because they are inadequite descriptions. English is a great language in part because it takes on new words so readily. You can resist if you want but the tide of english is against you.</p>
      <p>Coming up with a term we all like for the relationship of asceder/descender sizes either together - or for my money seprately - or better still one for each &amp; then one for the combination for a total of three - is a fine &amp; worthwhile thing to do! I would guess that ready acceptance will be easier if the terms suggested are closer to common english like 'arm' &amp; 'bowl' &amp; less initially obscure like 'bouma'. But even if they are initially opaque, I say let's have them!</p>
      <p>I think that one of the reasons that easy desription may be hard &amp; an opaque sounding term inevitable is the relationship of the structures to our bodies. We mostly all have arms like on a 'T'. Foot the same way. We don't have asceder-like or descender-like shapes unless you count our heads or genitals or legs. These shapes are centered or occcur in pairs, and our recognition of them requires that the be centered or paired. Asceders &amp; descenders don't match well. </p>
      <p>Personally I don't hate the term depth, but I would preffer to retain it exclusively for offset impression where it fits absolutely.   </p>
      <p>The idea of ratios seems nice but it doesn't lend itself to the use that Hrant described. Where you could substitute one of three possible observations readily fot x-height in a sentance like this: "That font has a large 'x-height' ". That's the goal we should be shooting for: easy use.</p>
