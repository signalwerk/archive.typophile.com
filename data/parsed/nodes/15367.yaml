      <p>&gt; It’s not just a letter cluster. It’s the basic unit of reading, that gets “deciphered” in a certain way, based on semantic context, frequency and distinctiveness</p>
      <p>&gt; How is bouma clearer term than word shape?</p>
      <p>&gt;1) It’s shorter.<br>
      2) It doesn’t have the word “word” in it. A bouma is <strong>not necessarily a whole word</strong>. We don’t read whole words, nor do we read only individual letters - we read clusters of letters, which are sometimes whole words (when short, frequent and distinctive enough) and sometimes single letters (when/where the fovea provides total clarity). So it’s clearer because it’s [much] more accurate.</p>
      <p>&gt; Bouma expresses that the letter cluster forms a unity, or ‘bounded map’—as I like to say—, of visual particulars at a specific grain of vision</p>
      <p>&gt;While the paleographer's principle focus has been on the  classification of individual letter forms, the student of the history of reading in the medieval West is primarily concerned with the evolution  of the word shape, and the letter forms are important only to the degree  that they play a role in determining that shape. Thus, the adoption of  miniscule, that is, lowercase letters, as a book script is significant  for the historian of reading insofar as it contributed, in conjunction  with word separation, to giving <strong>each word</strong> a distinct image. Modern psychologists call this image the Bouma shape.</p>
      <p>Paul Saenger, Space Between Words. The Origins of Silent  Reading 18-19.</p>
      <p>Problems:</p>
      <p>1) - the question of which is the clearer term out of word shape/bouma is irrelevant if those terms are describing two different things (as hrant insists they are).</p>
      <p>2) - People's definitions of bouma are contradictory, and this coupled with the fact that the term itself is not self explanatory doesn't make "discussion easier/clearer".</p>
      <p>3) A concise and straightforward definition would help make clear the difference from 'word shape'. At the moment the most that can be gleaned from this thread is that bouma is concerned with groups of shapes that may or may not be whole words, it isn't the same as word shape, it includes "visual particulars", and semantics, frequency and distinctiveness are all involved somehow.</p>
      <p>How much clearer do you need?</p>
