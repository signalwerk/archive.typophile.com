      <p>"over-intellectuallized mumbo-jumbo"<br>
      "self-agrandizing rubbish [...]"<br>
      "for the sake of amusing a small clique of hrantophiles"</p>
      <p>I can only see this as a resistance to wanting to discuss the mechanics of perceptual processing in reading at an appropriate level of terminological care. In today's usage, 'word shape' refers either to 1) envelope structure or 2) the raw pattern of meutral, ascending and descending characters. As I tried to say in my Thessaloniki 2004 presentation, this is too crude a notion of word shape. There is a lot it leaves out. And it's ommissions are part of the reason the ascendancy of a parallel letter recognition model of word recognition could take hold. (I don't think such a model is fully up to the task of providing support for what type involved practitioners see as important in type design and typographic practice.) Other candidates, like 'total word form' or 'distinct word image' are as open as 'word shape' to 'inadequate formalizations'.</p>
      <p>Either we need an expanded notion of 'word shape', or a new term. For those of us who read Taylor and Taylor's <em>Psychology of Reading</em> and Peter Saenger's <em>Space Between Words</em>, 'bouma shape' provided an relevant candidate for a new term which could include the internal form of the word contained within the envelope and created by a word's unique pattern of positive and negative shapes at the level of stems and crossbars , angular components and counters. A denser notion of wordshape if you will.</p>
      <p>Perhaps you do not like the term 'bouma' or 'bouma shape' or you do not see it as a necessary <em>typographical</em> term. (If you think of it as 'a bounded map of visual particulars at the internal form, both black and white, level' the term becomes transparent to a meaning: bouma becomes a truncated form of 'bounded map', as well as a tribute to a pivotal psychologist of reading.) So I think, that in discussions of perceptual processing in reading it has a use, or at least that what it's introduction into the discussion tries to acheive is important.</p>
