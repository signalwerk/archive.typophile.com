      <p>Chris, what's UPM?</p>
      <p>I think it's fine to keep using the language of (long or short) extenders, but I also like the idea of having a simpler way to refer to vertical proportions.</p>
      <p>What about something like <em>nad ratios</em> (= <em>n:ad ratio</em> or <em>n:a:d ratio</em>, where <em>n</em> = the height from baseline of neutral characters; <em>a</em> = the height from baseline of characters with ascending components; <em>d</em> = the depth below baseline of characters with descending components)</p>
      <p>Bernard Modern has a steep n:ad ratio. Classical n:a:d ratios are proportionate. How do WAD's legibility series fonts come out?</p>
