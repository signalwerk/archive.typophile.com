      <p>James, in studies of perceptual processing in reading the question of  the perceptual unit is fundamental. This is acknowledged in every domain-relevant study. Why should a term which brings such discussion to a head be dismissed as over-intellectualized mumbo-jumbo.</p>
      <p>Is it that discussions of perceptual processing in reading don't interest you, or that you find them hard to sort your way through, or that you don't see the connection with what you do?</p>
      <p>I would think type-involved people would welcome and encourage exploration of perceptual processing in reading at the level at which they are pursue at in the psychological and cognitive scientific literature. I don't think I feel smarter, and it's not for everyone, but I do think sustained exploration-- with bouma-concept in hand--has given me a better understanding of why, among other things, strategic construction of letterforms, a well-motivated and consistent contrast scheme, and 'space-craft'--typographical obsessions all--matter.</p>
      <p>You proposed a more accessible term, but it doesn't cover the same ground.</p>
