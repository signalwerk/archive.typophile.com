      <p>You really think he had a problem just using "height" when he meant it?</p>
      <p>&gt; Better not to repurpose existing terminology.</p>
      <p>I agree. But his use of "depth" there is hardy common.<br>
      Also, using "short" and "long" to describe both ascenders and descenders I think is better than "tall/short" for the former and "deep/?" for the latter.</p>
      <p>&gt; having long or short extenders</p>
      <p>You know, that would indeed be ideal. But too many times I've read descriptions which treat the elements like extenders and x-height outside the critical context of the em square, sort of like it's still all physical - and I think that's an instinctive thing that's hard to overcome. Like this example:</p>
      <p>"<br>
      An aspect of Baskerville type that I intended to retain is that of overall openness and lightness. To achieve this while reducing contrast, I have given the lowercase characters a wider proportion. In order to avoid increasing the set-width, I reduced the x-height, relative to the cap height.<br>
      "<br>
      Sheesh.</p>
      <p>So maybe like my point #3 in defence of "bouma" above,<br>
      we need a clean break? Dunno - maybe not in this case.</p>
      <p>hhp</p>
