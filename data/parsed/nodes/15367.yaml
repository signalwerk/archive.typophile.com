      <p>It's not just a letter cluster. It's the basic unit of reading, that gets "deciphered" in a certain way, based on semantic context, frequency and distinctiveness. Using "letter cluster" is more confusing, because it's too vague, too open to personal interpretation, and has too much baggage. Also, the concept of bouma is relevant to writing systems that that don't even have letters (like Chinese). Like any useful term, it's shorthand and an abstraction. Do you call a car a "combustion engine driven civilian transport"?</p>
      <p>hhp</p>
