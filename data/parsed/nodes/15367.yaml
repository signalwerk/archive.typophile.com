      <p>An exceptional instance of such... expectedness :-) happened to me on the ATypI list a while back: replying to a post by John Hudson, Fiona Ross wrote [something like] "my view is apposite to John's". I read that as "opposite", which has the... opposite meaning to "apposite"! This, even though: it was in Courier, a highly deliberatively-read face; the difference was in the initial letter, the most distinctive part of a word/bouma; and I knew that Fiona generally <cite>agrees</cite> with John, and has very rarely disagreed with him in public. It took a couple of lines to realize something was fishy, and I had to start from the beginning.</p>
