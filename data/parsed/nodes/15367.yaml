      <p>I tend not to use the term bouma very often, but not because I think there is anything wrong with the term itself. I think Hrant usually begs the question when he uses it, because he assumes that it is phenomenologically central to the reading process, while I'm not willing to commit to that. My definition of bouma, or bouma shape, would be something like 'a subcategory of letter cluster recognised as a unit during reading', which is what I understand Hrant to be saying. So in terms of distinguishing this kind of letter cluster from other kinds of letter clusters -- distinguished, that is, by its supposed role in reading --, I think having a distinct term is useful.</p>
      <p>Exactly what the role of such letter clusters is in reading remains inconclusive.</p>
