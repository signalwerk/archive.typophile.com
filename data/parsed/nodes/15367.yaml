      <p>I am quite comfortable with John's way of addressing questions of description in the vertical plane of type. Characterizations like too deep or too shallow might be useful, but are indeed judgement calls and we need an axis of reference to make them understandable (and quantification to make then testable). That axis of reference can either be spelled out in longhand or implied (as John suggests) or it can be specified in a cryptic shorthand: n:a(x):d = 1:1:1 / n:a(b):d = 1:2:1 / n:a(b)+d = 1:3 / n:e(xb or n) = 1:1 (can you guess what 'x', 'e(xb or n)' and 'b' represent?) </p>
      <p>I doubt if one plain language term will do the job cleanly. But we could meningfully say an n:e(xb or n) ratio of 1:1 or thereabouts is too shallow or too steep or just right for easy readability at a conventional text size and no leading.</p>
      <p>So if we want quantification, and sometimes we do, we will have to talk ratios. Here in longhand and a different order are several of the options coded above, plus a bonus one inspired by John's post:<br>
      1) neutral : ascent (relative to the baseline) + descent (relative to the baseline)<br>
      2) neutral : ascent (relative to the x-height) : descent (relative to the baseline)<br>
      3) neutral : cap height : ascent (relative to the baseline)<br>
      4) neutral : extender extent (beyond baseline for descenders / beyond x-height for ascenders or relative to (but not including) the x-height of n) This one only works if the 'a' extent and 'd' extent are the same.<br>
      These seem to give the clearest picture of the height parameters of the font.</p>
