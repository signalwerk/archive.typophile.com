      <p>Hrant, when people talk about a typeface having long extenders, they usually mean 'relative to the x-height', and I don't think people do think of the latter as being fixed in size. Actually, the ascender height and descender depth are much more likely to be fixed in size, relative to the body (types cast small on the body, like Perpetua, are unusual). So this is why the observation that a typeface has a small x-height is actually more common than the observation that it has long extenders.</p>
      <p>There is another thing to take into account when describing a face as having long extenders, and that is cap height. When I think of long extenders, I think not only of a relatively small x-height, but of tall ascenders that extend well beyond the height of the caps.</p>
