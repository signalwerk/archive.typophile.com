      <p>&gt; “Depth: The degree of difference between a typeface’s x-height and its extenders.”</p>
      <p>More like the <cite>proportion</cite> between the various vertical measures.<br>
      Essentially between the x-height and the rest though, yes.</p>
      <p>&gt; My only trouble with using these terms is that “shallow” is related<br>
      &gt; to less and “deep” is related to more but a “shallow” typeface would<br>
      &gt; have a greater x-height.</p>
      <p>But it's not about the x-height, it's about the <cite>variation</cite>. Like how a gentle water wave is shallow.</p>
      <p>&gt; Do you mean depth as a font is extended or condensed (horizontal<br>
      &gt; depth) or do you mean Xheight is big or small?</p>
      <p>No, strictly vertical.</p>
      <p>&gt; I don’t mind a term which helps but I would hate<br>
      &gt; to see a term which would cause more confusion.</p>
      <p>Believe me, I don't like frilly, redundant terminology either. Maybe it was too much calling it "sorely needed", but it's still better than the clunky stuff we have now. As for potential confusion, I think there's less than with "color", and except for impression depth in letterpress, or maybe the "neck" of metal sorts (which are outside the context of our particular "2D" world) I can't think of what else it could be taken for.</p>
      <p>&gt; Is depth similar to color in that it’s a pretty obscure reference?</p>
      <p>That's an interesting terminological parallel, in that you sort of have to look beyond the obvious to understand them. Well, I'd say right now it's much more obscure than "color"! :-)  But if you mean it can't ever become non-obscure, I have to agree.</p>
      <p>&gt; If we want to give a ratio to be more precise</p>
      <p>I think quantification can often impede good discussion.</p>
      <p>--</p>
      <p>A good example of the usefulness of "depth" can be seen here:<br>
      <a href="http://typophile.com/node/15369" title="http://typophile.com/node/15369">http://typophile.com/node/15369</a> _<br>
      I would have had to write a whole long phrase instead.</p>
      <p>So you could say for example:<br>
      "Electra is too deep to be a good news face."</p>
      <p>And a type geek could critique Bernhard Modern* thus:<br>
      "<strong>Man</strong> that depth is huge and high."<br>
      :-)</p>
      <p>* <a href="http://www.myfonts.com/fonts/ef/bernhard-modern-b/reg/charmap.html" title="http://www.myfonts.com/fonts/ef/bernhard-modern-b/reg/charmap.html">http://www.myfonts.com/fonts/ef/bernhard-modern-b/reg/charmap.html</a></p>
      <p>hhp</p>
