      <p>&gt; How is bouma clearer term than word shape?</p>
      <p>1) It's shorter.<br>
      2) It doesn't have the word "word" in it. A bouma is not necessarily a whole word. We don't read whole words, nor do we read only individual letters - we read clusters of letters, which are sometimes whole words (when short, frequent and distinctive enough) and sometimes single letters (when/where the fovea provides total clarity). So it's clearer because it's [much] more accurate.<br>
      3) It avoids all the old (lost) baggage - it's a clean break from all the confusion, misinformation and "customization" to ones ideological preferences that circulates as valid theory. "Serifs are like train tracks." Riiight.</p>
      <p>And Fiji works for me too.</p>
      <p>hhp</p>
