      <p>Thanks Peter!</p>
      <p>This may be less succesful but here it goes. </p>
      <p>The key idea being worked up here has everything to do with <strong>relative</strong> difference in size of ascenders &amp; descenders to an x height. The differences are actually relative in two ways. </p>
      <p>One - obviously - relative to x height (or maybe some other chosen measure too?) </p>
      <p>Two - As defined by as we like to say 'our eye'. This is of course the relative perception of looking good, balanced, or whatever terrm we choose. I think this second kind is actually more juicy and more relavant.</p>
      <p>Because in both cases a relative/subjective nature is being invoked rather than a rational/measured/precise sense, I suggest we try out the term the term 'divergence'. We could also use the term dis/proportional for a all the font's relative sizes. Maybe we do already...</p>
      <p>Divergence in plain english means separation of one thing from the other - to 'diverge from a path' means to leave the path and choose another. It also means departure from a norm; or a deviation. It's this second sense that interests me. </p>
      <p>Looking back again, the focus of the terms 'deep' and 'shallow' is on depth - just the vertical. The idea being described is not really about the vertical but instead relative verticality or height - or I would argue that more precisely we are talking about a degree of vertical compared to a loose idea of what is 'normal' or perhaps typical. Some people are still alergic to 'normal'...</p>
      <p>So for example we could say 'I think these ascenders are divergent from the x height' - meaning they are biger or smaller than I expected given the x height. Or ' I think this font is divergent from it's own x height' meaning that the asceders &amp; descenders are too long or short. Or if the term is really accepted then we could just say 'this font is divergent'. </p>
      <p>If that's fine, then by my self imposed standards I aught to find a way of of indicating the degree of divergence &amp; maybe a way of indicating if it is descender or ascender or both. </p>
      <p>Using a term like Divergent implies that we should be able to say the opposite - that the font ascenders are proportionate to it's X height. Hmm That the font 'Conforms'?</p>
      <p>I do still like body references in type - they seem more traslatable &amp; intuitive - so for overly tall ascender maybe I could say it 'reaches' and for too short we could say it 'crouches'.</p>
      <p>whaddaya think?</p>
