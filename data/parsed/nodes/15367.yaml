      <p>&gt; the reason they see x-heights as relatively smaller or larger</p>
      <p>I guess I'm not sure they do. I think maybe they only -or generally- see an absolute difference, when two fonts with very different x-heights are put next to each other (and of course when a given font is set at very different point sizes). I think the relativism (or abstraction) which is the important thing for <cite>makers</cite> of type (as well as the more sophisticated users of type) gets "over-ruled" by the absolutism that I suspect laymen prefer - probably because that's what human nature prefers. Which is fine for them - but causes us communication problems.</p>
      <p>hhp</p>
