      <p>Dreyfus seems to be using depth in the same way that I would use height ('hardly more than tentative departures from the traditional relations of height and width'), which is why I don't think it is a good term for what you are talking about, which is length of extenders relative to x-height. Better not to repurpose existing terminology.</p>
      <p>I think what you want needs to include the notion of extent, because it is extent beyond the x-height that you are describing. And since this is both ascending and descending I don't think 'depth' makes any sense. Personally, I think I'll probably stick with describing typefaces as having long or short extenders. This seems to me both efficient and precise.</p>
    html_clean: |-
