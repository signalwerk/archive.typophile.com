    html: <p>Eben, I like your riff on terms a lot. And I like to shave myself with Occam's razor. But seriously (and at the risk of irking those who dislike terminological play or exploration), something like nad-ratio is no less descriptive and easy to use than x-height (when you know the code) than nad-ratio is more puzzling than x-height (when you don't, and encounter it for the first time). "This font is generous and proportionate in the horizontal plane, has large x-heights for it's assigned point sizes, but it has a pinched nad-ratio in the vertical plane, making it unsuitable for extended texts because the cue value of the extenders is compromised and frequently eclipsed but the salience of the counters." (I'm not saying nad-ratio is the term you're after, Hrant, but I do prefer it to depth or armature)</p>
