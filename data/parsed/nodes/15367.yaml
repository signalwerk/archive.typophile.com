      <p>I like the concept, Hrant, So let's hash out the usage and definition. </p>
      <p><cite>Depth: the degree of extenderness of a typeface</cite><br>
      I think that "extenderness" is a difficult word to define another term by. </p>
      <p>I propose: "Depth: The degree of difference between a typeface's x-height and its extenders." </p>
      <p>Then we can define "Deep: A large degree of difference between a typeface's x-height and its extenders" and "Shallow: A lesser degree of difference between a typeface's x-height and its extenders."</p>
      <p>My only trouble with using these terms is that "shallow" is related to less and "deep" is related to more but a "shallow" typeface would have a greater x-height. I do get the "deepness" of mrs eaves when I look at it, but when I call it "deep" it feels contradictory.</p>
      <p>So then I wonder if the term is necessary, considering that it kind of boils down to deep=lesser x-height and shallow=more and depth=relative x-height. Let's see more potential usage and then, if necessary, look for other potential analogies.</p>
