      <p>In England the continuing vogue of Caslon's types maintained the<br>
      traditional proportions, and the Great Primer and Pica Roman and*<br>
      Italic ... are hardly more than tentative departures from the<br>
      traditional relations of depth and width. It is an important fact,<br>
      however that his descenders (g, p, q, etc.) are shorter than Caslon's.<br>
      "</p>
