      <p>Hrant, your 1) 2) and 3) are dodges. Technical terms should strive for precision and and univocality of reference. Neither of these things are fully attainable. Precision is never absolute and univocality--meaning one and only one thin--is hard to sustain, because a theory is always a construction site. But that's no excuse for ambiguity and unsharpness.</p>
      <p>I think it's regretable that there isn't greater agreement between myself and Hrant on how to apply the term, given it's pedigree. A word is a concrete thing. A bouma is an abstraction. I would say our reading of familiar words is bouma-based, that is, based on processing them as perceptual units or wholes according to their internal figural compositon (their internal figural composition encompassing the black (stems, bowls, angular components) and the white (counters, between letter shapes, abscences of closure). The significance of this might become apparent if we consider that most theories of reading construct  fluent reading as involving some form of internal spelling or phonological computation from independantly identified parts (letters) at every fixational juncture.</p>
