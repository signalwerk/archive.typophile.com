      <p><em>It seems far-fetched that this a result of the relativism of the vertical proportions within the EM. It seems much more likely that this is due simply to the fact that Latin is very strongly x-height-centric, and that’s what people see and base expression on.</em></p>
      <p>But the reason they see x-heights as relatively smaller or larger is precisely because the ascender and descender are normally scaled to reach close to the extent of the UPM body height. This is the cause of the difference in x-height between on face and another at the same nominal point size. If we typically spec'd type size in terms of x-height, so that types would have the same x-height at the same nominal size, then I think people would be more inclined to talk about long or short extenders. But so long as we are sizing type by body height, which most often corresponds quite closely to the overall ascender+descender height, relative x-height will be the more obvious element of comparison.</p>
