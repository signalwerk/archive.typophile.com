      <p>The term "depth" is still the main issue for me. I think it would make more sense if we were to use terms like "reach" and "drop".  Ascenders reach and descenders drop. You could then compare Futura with say Helvetica and say Futura has more "reach" than Helvetica.  You could also say a cursive face had enough reach and drop to allow for flourishes. Screen friendly fonts like Georgia and Verdana have very little reach.  The obvious reflection of this is to say ample xheight.  This renders the same picture but changes the focus of description on the xheight rather than ascender/descenders.  For instance, if I wanted to say that Verdana did not have enough drop for a double bowls g, it would be more descriptive than to say Verdana had too much xheight for a double bowl g.</p>
      <p>ChrisL</p>
