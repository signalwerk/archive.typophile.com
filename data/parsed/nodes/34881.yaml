      <p>So you think writing English logographically <em>is possible</em>, and moreover it's unclear whether that would be better or worse than the current method. That's what I wanted to know. Based on what I know about the English language and logographic writing systems, I thought it was obvious that it is impossible to reflect the English language in a logographic way without resorting to all kinds of non-intuitive markers that only Chomskyites would grasp (but then it would cease to be logographic and become unlike any writing system). Because my own reasoning behind this conclusion seemed so natural and obvious to me, I thought it was clear for everyone else, too, but there I was wrong.</p>
      <p>So maybe you thought that Chinese could replace English as the lingua franca (plausible), and because of that influence other languages would start to be written in the Chinese script. That last part is the impossible leap for me.</p>
      <p>For me, the only scenario where the Chinese <em>script</em> becomes the lingua franca is where people largely stop writing in non-Chinese languages altogether, using only Chinese for written communication. This far surpasses what any language up to now has done, including English. That sort of scenario where most literature (and any sort of writing) is produced in a single language seems dark and bleak to me. Do you think this will actually happen?</p>
      <p>I believe in the Chinese ascendancy. More and more people will learn Chinese as a foreign language, as people are doing in droves in Korea. My father already speaks fluent Chinese, and I'm still learning. Soon the rest of the world will catch up. But please, believing that China will achieve the sort of cultural hegemony to drive out languages like English, Hindi, and Arabic from written use seems far-fetched. That's why I made that initial postscript comment about the "dark, bleak future" jocularly, thinking that you were being similarly mock alarmist with your Chinese-script-as-the-lingua-franca suggestion.</p>
      <p>So we were not on the same page after all, and I guess to you I came across as a reactionary against Chinese ascendancy. I don't think I've been accused of sounding like a White House press release before.</p>
