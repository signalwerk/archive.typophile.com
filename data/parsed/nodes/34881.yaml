      <p>The Chinese script and the Latin script for English are mere examples chosen for convenience. I would use other logographic systems as examples, but both Egyptian and Mayan hieroglyphs include phonetic elements.</p>
      <p>Let's take for simplicity's sake only those Egyptian hieroglyphs that function as logograms. Do you think you could write Armenian with them? No, you couldn't. Could you write Ancient Egyptian with the Armenian script? Yes, you could, once you worked out some kinks. Would you agree, or am I betraying stunted imagination and creativity?</p>
      <p>So my pointing out the limitations of the Chinese script for something it was never meant to be used for--writing languages other than Chinese--amounts to subjecting you to my supposed anti-Chinese upbringing? You're trying to make this look like a clash between those appealing to emotions, when I'm only trying to point out what I thought was a well-understood feature of the Chinese script.</p>
      <p>So I can only conclude that I have been taking my familiarity with the Chinese script for granted, and others may not understand the most basic feature of the script to the point of harbouring illusions about it being portable across languages the way phonetic scripts can. Have you studied Chinese? That would help immensely in understanding what I'm talking about.</p>
