      <p>Hrant: <cite>In fact AFAIK there are Chinese-derived systems for encoding non-Chinese languages out there already.</cite></p>
      <p>Do you have any examples? Unless you're talking about Vietnamese or even the Japanese hiragana and katakana scripts, which ultimately derive from the Chinese script, I would be really curious...</p>
      <p>I'm not really sure you've thought through the global tongue scenario, if you see nothing wrong with that. English may be considered the global tongue now, but Chinese would have to have a stranglehold on the global population at a level that far surpasses that for the Chinese script to be the global script as well. Since we're assuming that the Latin script to fall off its pedestal, the billions of current English, Portuguese, and Spanish speakers would have to stop writing their native languages and switch to Chinese. Or are you saying that they can somehow find a way to use the Chinese script to write their own vernacular tongues?</p>
      <p>The Chinese script has been dominant in East Asia for millennia; it is part of the cultures of Korea and Japan as well as China's. But it has proved restrictive to the use of vernacular languages in writing, which is why Korean and Japanese both developed their own scripts (in the former case, to the enormous protest of the literati who liked their monopoly on literacy). If there was any way the Chinese script could be used to write Korean or Japanese other than through impractical rebus-based systems, it would have been found sometime during the thousands of years of Chinese-script supremacy. When Chinese characters are used for writing Korean or Japanese, it is for writing Chinese loanwords, of which there are many. Extrapolating to languages that have had less contact with Chinese, I can't see how its speakers would start using the Chinese script other than by abandoning their vernacular tongues.</p>
      <p>All this just to spite the current dominance of the Latin script? The Chinese script as lingua franca has been tried in the East Asian sphere and found wanting. Apologies if the future talk sounds like regression rather than progress to me.</p>
