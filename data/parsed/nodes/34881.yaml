    <p>The "greek alphabet" exhibition has taken place with success during the seven days of the 3rd International Conference on Typography and Visual Communication in Thessaloniki between the 18th and the 23rd of June.</p>
    <p>Visit <a href="http://ea.backpacker.gr" rel="nofollow">http://ea.backpacker.gr</a> to see a small sample of each submission, photos from the exhibition venue and the two selected submissions.</p>
    <p>I would like to thank once more everyone who helped organize and run the event and everyone who participated.</p>
