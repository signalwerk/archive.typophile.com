      <p>&gt; The Chinese script is only workable for Sinitic languages.</p>
      <p>Just like I don't think literal Latinization is good, I wouldn't want to see Chinese have an explicit influence on any other script. But it does have under-appreciated and under-used merits that can serve as superb inspiration. One of them is that it's not an alphabet!</p>
      <p>&gt; If the Chinese script becomes the lingua franca, it can only mean<br>
      &gt; that the Chinese language itself has become the global tongue.</p>
      <p>Which it will be. And I see nothing wrong with that (as long as a lingua franca is inevitable). But more importantly, I don't agree with your blindered view. Humans are much more creative than that. In fact AFAIK there are Chinese-derived systems for encoding non-Chinese languages out there already.</p>
      <p>I have to start thinking that you have a personal thing against China.</p>
      <p>&gt; the problem the Chinese have with their<br>
      &gt; own script with the thousands of characters.</p>
      <p>Every system has problems. And quite clearly the "problem" with<br>
      Chinese isn't great enough to prevent them from taking over...</p>
      <p>&gt; preferring a future dominated by the Chinese<br>
      &gt; script to the status quo is hopelessly naïve.</p>
      <p>I believe in cycles. The current one is sick and dying.<br>
      As I've written before: one day we will have to get rid of China too.</p>
      <p>hhp</p>
