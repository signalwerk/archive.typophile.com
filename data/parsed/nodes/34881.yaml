      <p>So we go off topic...</p>
      <p>Remember we're talking about scripts, not languages. The Chinese script is only workable for Sinitic languages. At least the boring Latin script, being alphabetic, can readily serve a wide variety of languages. That is one reason for its wide-spread use long after Latin ceased to be spoken widely.</p>
      <p>Before the Korean alphabet was invented, being literate in Korea meant having to learn a whole different language, i.e. Classical Chinese. The literate elite were secure in their monopoly of knowledge and control of society due to the many years of schooling necessary to learn Classical Chinese. There is no way to readily adapt the Chinese ideographs to writing any other language. If the Chinese script becomes the lingua franca, it can only mean that the Chinese language itself has become the global tongue.</p>
      <p>At least with the current dominance of the Latin script, the individual languages are not threatened. On the contrary, we have examples like the Latinization campaigns in the Soviet Union that were aimed at improving the status of minority languages though the introduction of the Latin script to write them down.</p>
      <p>I am all for language and script diversity. A Latin-dominated landscape does not preclude language diversity, but a Chinese-script-dominated one does. That's why I call such a future dark and bleak. All this is not to mention the problem the Chinese have with their own script with the thousands of characters. I'm sorry, but preferring a future dominated by the Chinese script to the status quo is hopelessly naïve.</p>
