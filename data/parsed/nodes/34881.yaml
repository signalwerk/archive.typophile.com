      <p>Hrant: <cite>It’s not so simple. In fact, the unifying* spirit of Chinese (it deftly encodes the numerous languages of China) is exactly what an alphabet sucks at.</cite></p>
      <p>That's not so simple either, as it is a result of a standardized literary language and spoken languages developing in tandem, and one has to ignore a large degree of diglossia, but let's leave it at that. </p>
      <p>If making cognates recognizable is the goal, alphabets work just fine. Many European languages that use the Latin script use near-identical spellings for Greek and Latinate vocabulary, when the pronunciations are quite different. French in particular uses a lot of phantom letters in their spelling to reflect etymological origins (e.g. the <em>g</em> in 'doi<em>g</em>t', cognate to 'digit'). I'd be hard pressed to make out a single word when someone is speaking Danish, but I understand a fair bit of written Danish because of its closeness to Norwegian.</p>
      <p>But a true unifier would be something like bringing back Latin as the universal literary language in Europe, or Sanskrit in Northern India. Pretending that one can introduce a single unifying script for the different languages of Europe à la Chinese without enforcing a unifying language ignores the far greater diversity in grammatical structures and vocabulary between even the closely related Romance languages. Chinese was helped by strong central government starting with the First Emperor, who standardized writing across China; maybe European political unity can enforce a standardized pan-European literary language?</p>
      <p>Hrant: <cite>Alphabets are seriously over-rated, to mythical proportions; and to see a non-westerner fall for it is frankly quite sad.</cite></p>
      <p>I reiterate, different languages require different script solutions. I am not advocating alphabets as the one-size-fits-all solution. Many nationalistic Koreans talk about the supremacy of the Korean alphabet and even exporting it for writing other languages, so I'm wary of that view.</p>
      <p>But I think it's perfectly clear that the majority of the world's languages simply cannot be written with a manageable logographic system the way Chinese can be. Just how would one distinguish between the dozen different ways of describing 'yellow' in Korean, each with a different nuance, in such a system?</p>
      <p>노랗다, 노르께하다, 노르끄레하다, 노르무레하다, 노르스름하다, 노릇하다, 노릇노릇하다, 노르톡톡하다, 노리께하다, 노리끄레하다, 노리무레하다, 노릿하다, 노릿노릿하다, 노리톡톡하다, 누렇다, 누리께하다, 누르끄레하다, 누르무레하다, 누르스름하다, 누릇하다, 누릇누릇하다, 누르툭툭하다, 누르칙칙하다, 샛노랗다, 싯누렇다.</p>
      <p>I would rather not lose that diversity.</p>
