      <p>Hrant, are you remembering to distinguish between language and script? The dominance of the Latin script and English as a de facto lingua franca are two separate issues.</p>
      <p>I call the Latin script dominant not because it has the greatest number of users (the number of users of the Chinese script may already be greater, I don't know), but because it has been adopted by scores of different languages from different language families, including English. The influence of languages written in the Latin script, such as English, certainly played a great role, but the main thing was that the Latin script, being a phonetic system, proved supremely adaptable.</p>
      <p>Such adoptions of scripts are perhaps doomed to be less than optimal most of the time. Latin might not be the optimal solution for Vietnamese, nor the Indic-based Tibetan script (note: another phonetic script) for the Tibetan. But they still produced solutions that worked well enough to stick.</p>
      <p>But you won't see the languages switching allegiance to the Chinese script, even if there is all the motivation in the world to do so. <em>Chinese-style scripts cannot be used to naturally write anything other than a relatively small group of languages.</em> If there was any way at all that Korean and Japanese could be adequately written in Chinese, we would have figured it out sometime in the last couple of thousand years when we were firmly in the Chinese cultural sphere and absorbed everything Chinese. Fortunately, human creativity prevailed and we figured out writing systems that were actually capable of writing Korean and Japanese.</p>
      <p>Only a very small number of languages at one end of the morphological spectrum lend themselves to being written with logographic writing systems. Most languages cannot simply switch over to being written in Chinese. A latter-day Atatürk who orders his national language to switch to Chinese writing would most likely be unable to find any linguist capable of carrying out the command.</p>
      <p>I'm curious where you are getting your ideas about logographic writing systems if you think they can be readily applied to any language. There are certain advantages to using a logographic system, but written English already shares many of these advantages, being not purely phonetic but having many logographic features. Most languages are probably best served by scripts balancing phonetic and logographic features, and arguably written English has evolved to strike a close-to-optimal balance.</p>
