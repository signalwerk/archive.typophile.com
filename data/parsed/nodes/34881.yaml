      <p>Certainly Latin is the lingua franca of writing systems*, and it's useful to support it as much as possible. But the extent to which non-Latin fonts are made to "harmonize" with (more like "enslaved to") Latin is uncalled for, and in fact generally dysfunctional. When we think of "matching", let's not mean a full replication of formal features, like stroke terminals, vertical proportions, etc. Let's instead start from a lucid evaluation of how readers actually use multi-script documents, and try to see which letterform macro and micro features actually help foster a real, deep harmony, and which in fact consititute a formulaic, shallow, rote transplantation.</p>
      <p>* Until Chinese takes over...</p>
      <p>hhp</p>
