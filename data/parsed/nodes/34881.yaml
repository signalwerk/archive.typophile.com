      <p>So how can I make you understand that switching to the Chinese script is not an option for most languages because of an inherent mismatch between the morphologies of the languages and the nature of the script, not because of some cultural preference, politics, or emotions?</p>
      <p>The dominance of the Latin script, loosely speaking, is a historical accident, owing to the Roman Empire, ascendancy of Western Europe, and all that. Any reasonable phonetic-based script could have taken its place.</p>
      <p>But if we went into a counterfactual history where Chinese culture achieved supremacy the world over--if it were Chinese colonisers instead of Europeans entering Africa, Southeast Asia, and the New World in the last few centuries--the different languages of the world would still not have adopted the Chinese script. Instead, a diglossia would have developed where people would write in Chinese and speak in their vernacular tongues, or more likely the vernacular tongues would be supplanted by Chinese.</p>
      <p>At this point, I'm wondering if you are the one driven by your emotions and false hope to seeing a ready alternative to Latin in the Chinese script when there isn't one. The Chinese script is perfectly suitable for the Chinese language (or at least as much as the Latin is for English), but expecting it to work for languages that don't share the features of Chinese betrays an ignorance of how a logographic writing system works.</p>
