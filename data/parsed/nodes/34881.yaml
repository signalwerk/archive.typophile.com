      <p>Chữ nôm is a good example of the Chinese script adapted to a non-Chinese language, along with Zhuang logograms. Hiragana and katakana derive their forms from Chinese characters, but have passed into an entire different genre of writing system, the syllabary. No one considers them Chinese scripts any more than the Greek alphabet is considered a Semitic abjad.</p>
      <p>The difference is that Vietnamese and Zhuang, being analytic languages with largely monosyllabic morphemes like Chinese, are more suited to a logographic writing system than the agglutinative Japanese. (As an aside, I think the current practice of using a Latin-based writing system for Vietnamese is rather unwieldy.) Syllabic writing systems, as it turns out, are effective for writing Japanese. The Chinese script simply served as a reference point because that was the only 'true' writing they really knew about.</p>
      <p>Korean, on the other hand, has thousands of syllables in use and didn't find a workable solution until the featural alphabet Hangul was developed.</p>
      <p>The moral is that each language has different needs that require different script solutions, and a Chinese-style logographic system may very well be the most restrictive and least adaptable one out there, suitable only for a handful of languages in China and Southeast Asia. In fact, the reverence for tradition and resistance to innovation in the world of written Chinese probably contributed to its survival to this age when other logographic systems around the world have been rendered obsolete by phonetic writing.</p>
      <p>If anything, if I trust human creativity, I think the Chinese script will move further and further away from its logographic origins to reflect the changes in the Chinese language away from analytic features.</p>
