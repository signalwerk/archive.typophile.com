      <p>I would have loved to have been there. If anything it would have alleviated the Greek withdrawal symptoms; I've not seen printed Greek in forever, with most of my Greece-related stuff gathering dust at my parents' place in China...</p>
      <p>John, I can't find it now, but I remember seeing a sample of an early version of your SBL Greek somewhere, and it was really beautiful. I'm certainly looking forward to the release. You can probably find traces of some of its features in my own attempt at Greek, <a href="http://typophile.com/node/34520" rel="nofollow">Naxia</a>, still in its earliest stages. (The influence is clearer in the italic, though you'll have to take my word for it as it is not quite ready to be presented yet...)</p>
      <p>I too am disappointed in the shortage of entries by Greek designers, especially in the text face category. Still, I expect good things to come out of the infusion of new ideas by the latest generation of Greek type designers studying abroad. I also hope that it becomes easier to get formal training for type design in Greece so that budding type designers are not all forced to go abroad to learn their trade.</p>
      <p>Hrant: <cite>* Until Chinese takes over [as the lingua franca of writing systems]...</cite></p>
      <p>That would be a dark, bleak future, not least for type designers.</p>
