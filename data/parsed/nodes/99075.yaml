    <p>Hi everyone!<br>
    This is my first post on this forum, and i really really needed some advice.</p>
    <p>My client has a logo already designed using Perpetua (for the main logo type). I need a matching serif and sans serif font to use for the stationary and subsequent collaterals.... and i didn't really want to use Perpetua (i dont like it very much, its so stuffy and old). i know an obvious choice would be Gill sans, but i don't like that font very much either (something about the question mark annoys me)</p>
    <p>please help! i've been wracking my brains staring at my screen for hours.</p>
    <p>thanks in advance</p>
