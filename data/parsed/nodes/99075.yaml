      <p>Perpetua has enough life in it that could fuel the imitative type design you see nowadays for some 20 years.</p>
      <p>Besides this, you could use something similar to Gill Sans, or which has been influenced by Gill’s work.<br>
      Thompson’s Agenda might be an idea.</p>
