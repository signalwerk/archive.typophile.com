      <p>I usually don't recommend my own typefaces but in this case I would say you can try Prelo, since it was designed to work with Glosa. You can see them together in the french newspaper Le Figaro, they share the same x-height and the same OT features.</p>
      <p>Although I must say that National is a wonderful typeface and it would certainly work pretty well.</p>
      <p>Best,<br>
      Dino dos Santos<br>
      DSTYPE</p>
