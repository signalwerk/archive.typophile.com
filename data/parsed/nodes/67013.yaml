    <p>Hi All,</p>
    <p>I'm working in tandem with two in-house designers on a news magazine redesign. The new nameplate/logotype is a heavily customized amalgamation of <a class="freelinking external" href="http://typography.com/fonts/font_styles.php?productLineID=100008" rel="nofollow">Gotham Black</a> and Font Bureau's <a class="freelinking external" href="http://fontbureau.com/fonts/Anisette" rel="nofollow">Anisette Bold</a> (think very wide and bold). The serif we've chosen is <a class="freelinking external" href="http://dstype.com/index.php?id=57" rel="nofollow">Glosa Display</a> for big heads, and <a class="freelinking external" href="http://dstype.com/index.php?id=25" rel="nofollow">Glosa Text</a> for body copy. We're also using <a class="freelinking external" href="http://vllg.com/Schwartzco/Stag#panel=poster" rel="nofollow">Stag</a>, a contemporary slab, for headlines, decks, etc.</p>
    <p>My question is about a sans family. I recommended <a class="freelinking external" href="http://klim.co.nz/national_samples.php" rel="nofollow">National</a> by Klim Foundry since (to me) it pairs well with the above typefaces. The Art Director is not sold, and feels that it might be too feminine for a news magazine. I personally disagree, but one of the great things about National which is rare in a grotesque is that it has every imaginable figure style (old style, lining, tabular in both heights, etc.) as well as small caps. We'll be using these features in Glosa, so our sans fonts also need text figures and small caps. The Art Director likes Stag Sans, but it lacks all the above Opentype features except for fractions.</p>
    <p>Sorry for the long intro, but can anyone recommend a sans serif that pairs well with Glosa and Stag? One that is Opentype with old style figures and small caps? It would be even more icing on the cake if italic small caps were part of the package.</p>
    <p>I might still be able to sell them on National, but want to have other viable options.</p>
    <p>Advice much appreciated.</p>
