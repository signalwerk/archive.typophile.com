    <p>My question is about a sans family. I recommended <a class="freelinking external" href="http://klim.co.nz/national_samples.php" rel="nofollow">National</a> by Klim Foundry since (to me) it pairs well with the above typefaces. The Art Director is not sold, and feels that it might be too feminine for a news magazine. I personally disagree, but one of the great things about National which is rare in a grotesque is that it has every imaginable figure style (old style, lining, tabular in both heights, etc.) as well as small caps. We'll be using these features in Glosa, so our sans fonts also need text figures and small caps. The Art Director likes Stag Sans, but it lacks all the above Opentype features except for fractions.</p>
