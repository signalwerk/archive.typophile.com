      <p>Prelo is very nice indeed! Especially given the condensed, compressed, and slab versions. We might even consider replacing Stag with Prelo slab. National has become my own Helvetica, but I think I could work with Prelo too. I just shared it with the art director, so well see.</p>
      <p>Thanks Dino! :)</p>
