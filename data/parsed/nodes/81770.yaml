      <p>If someone with <a class="freelinking external" href="http://www.tug.org/mactex/" rel="nofollow">MacTeX</a> wants to try, here is the content of the input file I used: </p>
      <p><code>\documentclass{article}<br>
      \usepackage{fontspec}<br>
      \setmainfont[Script=Devanagari]{Siddhanta}<br>
      \begin{document}</code></p>
      <p><code>\noindent</code><br>
      अ॒ग्निमी॑ळे पु॒रोहि॑तं य॒ज्ञस्य॑ दे॒वमृ॒त्विज॑म् । \\<br>
       होता॑रं रत्न॒धात॑मम् ॥ \\<br>
       अ॒ग्निः पूर्वे॑भि॒रृषि॑भि॒रीड्यो॒ नूत॑नैरु॒त । \\<br>
       स दे॒वाँ एह व॑क्षति ॥ \\<br>
       अ॒ग्निना॑ र॒यिम॑श्नव॒त्पोष॑मे॒व दि॒वेदि॑वे । \\<br>
       य॒शसं॑ वी॒रव॑त्तमम् ॥ \\<br>
      <code>\end{document}</code></p>
      <p>You need to specify the script else that does not work properly. For other indic fonts and other scripts than Devanagari, see the fontspec documentation (<a class="freelinking external" href="http://mirrors.ctan.org/macros/latex/contrib/fontspec/fontspec.pdf" rel="nofollow">fontspec.pdf</a>, 2695&nbsp;K).</p>
      <p>(Copy the lines above, paste them in a  TeXShop edit window, save, and run XeLaTeX on them)</p>
