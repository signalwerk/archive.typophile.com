    html: <p>There are many indic fonts around but they are not interchangeable. The font "Devanagari MT" is a font with an AAT automaton and using it, Safari can display properly <a href="http://hi.wikipedia.org" title="http://hi.wikipedia.org">http://hi.wikipedia.org</a> for instance. That font can also be used with textedit and with pages. So far as I understand, it cannot be used with inDesign (correct me if I am wrong). To edit texts with inDesign, you need a properly designed opentype font, and it is my understanding that inDesign also still needs a plug in to use those opentype flavored fonts. The only tool I know that can use correctly both types of fonts is XeTeX. If there is more, I'd like someone to tell. There are also other editing softwares that use other encodings. The main difficulty with indic fonts is that characters in words need to be reordered (an r can end up as an upper diacritic on the next or second next letter, etc.) The software needs to be able to handle that. To choose the proper font, you need first to consider what software you are going to use.</p>
