      <p>Uli</p>
      <p>I was aware of the link you are giving me (and I used it to check that my outputs were not too bad). The advantage of a pdf file produced with xeLaTeX with an opentype font is that it is searchable with the Acrobat reader (you can use a Davanagari keyboard to type in the search window). Also, with the Acrobat reader, you can select some Sanskrit text in the pdf and paste it in TextEdit or into the LaTeX editing window. To me, that feels much more friendly than using itrans, ltrans or the like but I agree that with Velthuis fonts for example, a preprocessor and latex, it was possible to produce nice looking outputs; I tried that, years ago.</p>
      <p>Regards,</p>
      <p>Michel</p>
      <p>And, of course, you are no longer forced to work with a very limited number of glyphs.</p>
