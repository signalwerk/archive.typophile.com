    html: |-
      <p>Another way to check is to install <a class="freelinking external" href="http://developer.apple.com/fonts/download/" rel="nofollow">Apple Font Tools</a> and use the <code>ftxinstalledfonts -U</code> command that lists all installed fonts containing the unicode character given as a parameter. The letter DEVANAGARI LETTER A is 0x0905. Here is a trace on my system<br>
      <code><br>
      % ftxinstalledfonts -U 0x0905 -f | grep YES<br>
      111	65655	YES	Devanagari MT<br>
      112	65656	YES	Devanagari MT Bold<br>
      %<br>
      </code></p>
      <p>(with grep, I selected only the lines with YES as an answer). If you use <code>ftxinstalledfonts -U 0x0905 -f -l</code> you also get the full path of the font file. You can try yourself to see if you get more in India...</p>
      <p>EDIT The command will however also list all the fonts you installed yourself.</p>
