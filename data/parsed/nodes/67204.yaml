      <p>If you're not using the latest version of OSX or Adobe CS, maybe take a look at FontExplorer X, which was linotype's free font management tool before the release of the Pro version. </p>
      <p><a href="http://www.versiontracker.com/dyn/moreinfo/macosx/27903" title="http://www.versiontracker.com/dyn/moreinfo/macosx/27903">http://www.versiontracker.com/dyn/moreinfo/macosx/27903</a></p>
      <p>It's a great free app, and I find it easier to use that FontAgent Pro.</p>
