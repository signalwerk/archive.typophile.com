      <p>The nameplate above would be right-aligned. (I realize you couldn't have know that.)</p>
      <p>What the problem with using the same typeface though? Doesn't the Times do this? I don't want to stray too far from the old nameplate (keep the serifs).</p>
      <p>I feel there is a little disconnect also, but I'm partial to the italics.</p>
      <p>I tried a couple of versions with "The Valley Beautiful" on top, but I'm hesitant to make it look so traditional. I realize that is a risk though.</p>
      <p>All input is welcome. I've never designed a nameplate before, and I'm quickly realizing it's a bit different from a typical logo.</p>
      <p>Thanks.</p>
