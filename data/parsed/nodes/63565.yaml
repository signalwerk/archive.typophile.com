    <p>I'm working on a redesign of the newspaper I work for. I'd love some honest feedback and ideas.</p>
    <p>Also, I'm planning on using Utopia for the body type (also used in the nameplate) and Franklin Gothic for headlines and other things. Are these choices too cliche for Newspaper? Any other suggestions?</p>
