      <p>Hi Brett, </p>
      <p>I've always felt using the same font for a header or logo as for the body copy lessens the impact of the masthead or logo by reducing the contrast between the two, giving a homogenous, plain look.</p>
      <p>I realise it is early stages, but have you tried mocking up an entire page with the masthead in place?</p>
      <p>Nice job, good luck!</p>
