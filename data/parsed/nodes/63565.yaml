      <p>Regarding the nameplate, it seems to me that "The Valley Beautiful" don't connect well with "Beacon": italic and roman are clashing a bit and there isn't any apparent alignment.<br>
      I don't know if Utopia is too cliché, but I would avoid using the same typeface for nameplate and body text.</p>
