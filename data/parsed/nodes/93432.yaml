  - id: 511264
    user: 29994
    date: 2012-05-28T15:45:00
    date_raw: 28 May 2012 — 3:45pm
    votes: null
    html: |-
      <p>Inspect the "Panose Weight" property for each of your fonts. They need to be the same for "Light" and "LightItalic", "Bold" and "BoldItalic", and so on, and increase in value from lightest to heaviest.</p>
      <p>(Nitpick Mode: You might want to call those italics "Light Italic", "Bold Italic", and so on, according to convention. You also might want to re-think "Light" and "SemiLight"; the usual order from light to heavy is "Very Light", "Light", "Thin", "Book", "Medium", "Demi", "Bold", "Heavy", "Black", "Extra Black". Some software out there expects this naming convention, rather than counting on the Panose Weight.)</p>
