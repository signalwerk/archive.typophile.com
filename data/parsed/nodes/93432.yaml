    <p>Hello,</p>
    <p>I am designing a family of 5 weights. When I name the fonts they appears in a submenu in my menu fonts, in my application but not the way I want. I wish Light + Light italic were on the top of the menu and Bold + Bolditalic at the bottom. I guess I am doing something wrong in the font naming in Fontlab but I am stucked here and cannot find a way to resolve that. Any help would be welcome ;)</p><div class="imageWrap"><img src="http://typophile.com/files/menu_4797.jpg"></div><p></p>
