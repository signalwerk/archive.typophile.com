      <p>In case it helps and by way of contrast, the naming for Adobe's MyriadPro-Semibold.otf (version 1.006) is as follows:</p>
      <p>Family Name: Myriad Pro Light<br>
      Weight: Demibold (600) ["Font is bold" is ticked]<br>
      Width: Normal</p>
      <p>Style Name: Bold<br>
      PS Font Name: MyriadPro-Semibold<br>
      Full Name: Myriad Pro Semibold<br>
      Menu Name: Myriad Pro Light<br>
      FOND Name: Myriad Pro Light</p>
      <p>Additionally, the OpenType-specific font names:</p>
      <p>OT Family Name: Myriad Pro<br>
      OT Style Name: Semibold</p>
