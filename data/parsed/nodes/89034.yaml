    <p>I came across this lovely last night, a headline from a 1984 issue of National Geographic.  I've done some digging online and haven't found anything, and I'll go through my specimen books when I get home, but it would be great if this mystery could be solved sooner than that? I'm currently using Adso for a restaurant project, but I'd love to use this instead.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/scotland_6237.jpg"></div><p></p>
    <p>(There's a little distortion on the end of the word "Glory," I took a photo of the page and it wasn't completely flat)</p>
    <p>Thanks a ton!</p>
