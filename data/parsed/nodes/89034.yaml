      <p>I'm still looking for this one.. I suspect part of my searching trouble might be terminology. The shop I work at has sort of a house style, which mostly involves lots of boxy sans-serifs and custom scripts, so I'm afraid I'm less versed in the specifics of more traditional type.</p>
      <p>It was used as a headline in National Geographic from not too terribly long ago, it can't be that obscure... right? I hope?</p>
