    html: |-
      <p>Hum… I'm not sure what you meant, renkceurb. If you're talking about Narziss being a bit condensed-looking you might have to consider that that's only because it can afford to, since it's a display face. Something with similar structure but for smaller sizes usually has to be a bit more open. Not that I know exactly what I'm talking about. :P<br>
      But classics, what about Univers, Akzidenz Grotesk, or even, further away, Gill or Syntax? Maybe <a class="freelinking external" href="http://www.felicianotypefoundry.com/cms/fonts/flama?page=2" rel="nofollow">Flama</a> or <a class="freelinking external" href="http://www.fontshop.com/search/?&amp;q=bau&amp;x=0&amp;y=0&amp;sample_text=Hamburgefonstiv&amp;sample_size=48&amp;update=0" rel="nofollow">Bau</a>; the latter would be my favourite, I think. There's also <a class="freelinking external" href="http://new.myfonts.com/fonts/shinn/preface/" rel="nofollow">Preface</a>. I think all of those share something with Narziss…</p>
