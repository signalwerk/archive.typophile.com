    <p>Hi Typophiles!</p>
    <p>I have used the font Narziss (which I LOVE) by Hubert Jocham. He is great!</p>
    <p>I was wondering if anyone had any ideas on what would be a nice sans serif to use in conjunction? I would like a simple, classic looking one but i'm stuck...</p>
    <p>So I thought I'd ask the experts  : )</p>
    <p>Any suggestions would be much appreciated</p>
    <p><a href="http://www.hubertjocham.de/item.php/type/display/Narziss/" title="http://www.hubertjocham.de/item.php/type/display/Narziss/">http://www.hubertjocham.de/item.php/type/display/Narziss/</a></p>
