    html: |-
      <p>I asked my typesetting colleagues a very similar question about three months ago, and got the following reply concerning their current workflow from Word files to InDesign:</p>
      <p><em>For Journals which are set in InDesign, we were so far setting the equationas as fixed graphics and using them as images during composition. With this process the equations cannot be edited directly from InDesign. As a recent development, we are planning to export the equations directly from MathType Equation Editor and embeddin gthese within InDesign. Any corrections can be done from InDesign itself by double clicking that equation which opens up MathType Editor. This will be implemented shortly.</em></p>
      <p>...Now, I don't know whether that did happen (yet) ... it sounds like the Equation Editor file is an OLE object. Does InDesign support OLE? </p>
      <p>[edit] Adobe's "Help resource centre" seems to confirm that it doesn't... in which case I wonder how my colleagues were planning on implementing the above.? [end edit]<br>
      ___________________________________________________<br>
      Ever since I chose to block pop-ups, my toaster's stopped working.</p>
