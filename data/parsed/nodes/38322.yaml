      <p>Um, I think the poster meant how to do it w/o spending $400 to $600 on a separate math editor program.....</p>
      <p>If I recall, Math Type can be bought as a separate program, when you do, it gives you the option of exporting equations as EPS images. Then, you can simply place the equation as an EPS graphic in a page layout program like ID. I'm pretty sure it's less than $100 for those with educational discounts, though it was back with Word 6/Mac OS 8.5 when I did this.</p>
