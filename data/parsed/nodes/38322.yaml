    html: <p>The only problem with the pdf approach is that you lose maximum resolution compared to saving it as EPS, no? If you create the equation in Word via Equation Editor at the EXACT same point size you wish it to appear in ID, then you'd be OK with the pdf approach I guess. But if you ever needed to resize the graphic, you'd potentially have problems if ultimately printing to a high resolution device.</p>
