      <p>I've had a reply from my typesetting colleagues, who say "We have developed scripts to link MathType objects within InDesign file. Using this scripts we can edit / save the equations within InDesign" ... I get the impression they're not going to be more forthcoming than that, but it sounds like forking out for the full version of MathType (which, as Ryan says, isn't too expensive) will get you part of the way there. </p>
      <p>Don't forget if you go down the PDF route there are third-party freeware utilities for creating PDFs (if you're prepared to put up with nag screens) - I used PDF995 until my company stumped up for Acrobat - so you shouldn't have to wait for the upgrade to Word 2007 just for the MS plugin...</p>
      <p>________________________________________________________<br>
      Ever since I chose to block pop-ups, my toaster's stopped working.</p>
