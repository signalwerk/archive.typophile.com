      <p>Can't find a perfect match for this one. That could be customized. Actually, you even start with the same <a class="freelinking external" href="http://myfonts.us/td-f495bx" rel="nofollow">Avant-Garde ITC</a> used for the baseline 'NATURAL HEALTH' and customize it: /p made with /o adding a descender, removing vertical stem on /r, redrawing /t from /J.<br>
      Some more leads: <a class="freelinking external" href="http://www.myfonts.com/fonts/flat-it/all-round-gothic" rel="nofollow">All Round Gothic</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/device/egret" rel="nofollow">Egret</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/k-type/adequate" rel="nofollow">Adequate</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/k-type/circa" rel="nofollow">Circa</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/ef-typeshop/media" rel="nofollow">Media</a>, <a class="freelinking external" href="http://www.dafont.com/arista-2-0.font" rel="nofollow">Arista</a>, <a class="freelinking external" href="http://www.dafont.com/comfortaa.font" rel="nofollow">Comfortaa</a>, <a class="freelinking external" href="http://www.dafont.com/giro.font" rel="nofollow">Giro</a>, <a class="freelinking external" href="http://www.houseind.com/fonts/chalet" rel="nofollow">Chalet</a></p>
