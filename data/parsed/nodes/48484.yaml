    <p>Hi</p>
    <p>I have to write up my doctoral thesis eventually (when I run out of reasons to procrastinate) and it should look nice (never mind the content...).</p>
    <p>So I was having a look around and at the moment I have decided on Neutra Text Light for titling and headings and Jenson for the copy.</p>
    <p>My aim to use fonts that work well together, and ideally anyone who is reading the thesis (and is not a typophile) won't even notice my clever selection of font, only subconsciously acknowledging the easy legibility and harmony (and flow) of the text and headings. The headings should not overpower the following text.</p>
    <p>The copy will be in 12px with line spacing 1.25 to 1.75, headings around 30px, 21px, and 15px. There are no guidelines on what fonts to use.</p>
    <p>Do these fonts work well in these sizes on long documents in academic (management studies) context, based on your experience/ deep knowledge? Any suggestions for alternatives? Or should I stick with Arial and Times New Roman and get my hat?</p>
    <p>Thanks for your answers!</p>
    <p>Mike</p>
