      <p><cite>My subject is in strategic management, no maths or technical science, all qualitative social science theory :p</cite></p>
      <p>I suppose free advice is worth about what you spend on it, but I would not use Jenson for a dissertation on "strategic management," unless your final conclusion is that management is a fine art.</p>
      <p>From Myfonts.com <cite>Jenson arrived in Venice around 1467, printing and publishing there from 1470 to 1480. His types, based on the upright calligraphic styles of the time, are regarded as among the very best of the Renaissance, indeed of all time.</cite></p>
      <p>Pretty good summation. While Adobe Jenson has perhaps been regularized, it still calls to mind the Italian Renaissance, an unusual allusion for *management theory.* Minion is an obvious choice for text; if you want to be different, I'd look at Cycles (text) and Arepo (display) from the Stone Type foundry, or something in the same vein from any of the other designers.</p>
