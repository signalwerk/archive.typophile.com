    html: |-
      <p>No hrant, I'm not being dismissive at all. Sorry if it come out sounding like that.</p>
      <p>When you said that the /z was too dark, I honestly agreed. And also added that the /x was too light, and etcetera (meaning that there are also a lot of things to tweak or improve).<br>
      Things that I'm able to see "now", but wasn't able to see "back then". Things that I've learned to see in the time it has passed since the release. If I have to redraw this font again, of course there are a lot of things I will like to improve. I loved them at the time of release, but now I see lots of things that can be fine-tuned.  I have talked to a few colleagues about this feeling, and many share similar feelings with their own initial typefaces, since as time passes, you learn to see things different/better.</p>
      <p>Regarding the Palatino comparative: I see Quattrocento much more closer to Basilea, Friz Quadrata and Alexon (Monolines, low contrast). But if someone else sees it similar to Palatino (more calligraphic, showing the contrast and the strokes of the nib pen) then I'm happy. Palatino is a masterpiece.</p>
