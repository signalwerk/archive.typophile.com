      <p>Usually, when I ask MyFonts for similar faces, the results are not too good, but today at least a couple of the results actually had some resemblance to the target:</p>
      <p>Quadrat Serial<br>
      Septimus</p>
      <p>Albertus came to my mind; Identifont concurred, and added ITC Elan, presumably related to the first one noted above.</p>
      <p>Oh, and don't forget Flareserif 821 (an Albertus lookalike).</p>
      <p>Looking around among the recommended similar faces on Identifont, I came across one that wasn't really similar to Friz Quadrata, but was of interest because it was by our own Nick Shinn: Paradigm Pro.</p>
