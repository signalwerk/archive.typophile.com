      <p>Altaira, thanks for the advice! I know that skin is an entirely different animal, but I am hoping that a tattoo artist who knows what they are doing will be able to use my printed type as a starting point and adjust as necessary to make it work without losing the essence of the font in translation.</p>
      <p>I don’t think size will be an issue. The friend of mine who is getting the tatt already has some fairly large lyrics on his back, and I wouldn’t want to go much smaller than what is already there. Which brings up a point in how the new font will interact with his existing ink. I requested a photo of what it looks like now, and I fully expect that to influence my decision.</p>
