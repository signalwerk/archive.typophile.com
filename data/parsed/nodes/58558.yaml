    <p>I need opinions on a good timeless typeface for a few lines of poetry that will be tattooed on a friend. Since this will be permanent, I’m treating the responsibility of choosing the typeface rather seriously. Here are the lines:</p>
    <p>But fiction flaunts its grave deception,<br>
    Flies its flags of grand illusion,<br>
    Cast a glimpse of truth across my eyes,<br>
    Then blames me for not anticipating<br>
    What foreign ideas have danced across<br>
    My very being ever since page one ...</p>
    <p>I know this could go a number of ways in terms of mood and personality. I’m currently considering a few Blackletter style typefaces for a more traditional tattoo feel - namely a free font (I know, yikes!) called “Cloister” from DaFont.com. But I am also considering Minion Pro Semi-Bold and Trajan Pro Bold. I like Trajan for this, except that all caps is a horrible idea for something with the expressive, musical quality of poetry.</p>
    <p>I am probably looking for a serif font with a timeless appeal that has just enough “style” to make it stand out from the typical classic serif fonts. But I would love to hear any of your ideas or suggestions, regardless of whether they fit within these parameters.</p>
    <p>Thanks!<br>
    Ed</p>
