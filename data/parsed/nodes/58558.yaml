      <p>If I was you I’d try not to agonize over picking a digital typeface and laying out your sample on screen. I think a more fruitful approach would be to find a good tattooist who knows / specializes in lettering, explaining what kind of “feel” you’re after, and have them work from your ideas.<br>
      Skin is not paper is not the screen. And there are people who specialize in skin.</p>
      <p>And whatever you do: that’s a lot of text; be sure you don’t go too small with it, especially if you’re considering a somewhat detailed (such as a seriffed) face.</p>
