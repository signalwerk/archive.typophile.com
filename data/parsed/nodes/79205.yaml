      <p>Hey, great start!  A couple of suggestions:</p>
      <p>- The middle 'Q' doesn't really fit. I'd definitely choose the first or third, not sure which yet.<br>
      - I'd remove the slabs on the bottom of the 'W'<br>
      - Something about the 'J' looks off.  Maybe the curve needs to be smoother, or the bottom needs to extend more. </p>
      <p>Keep at it!</p>
