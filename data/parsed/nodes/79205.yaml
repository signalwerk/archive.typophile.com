    html: |-
      <p>I like the feel! (I've always been a sucker for slabs)</p>
      <p>- Given that the glyphs have a horizontal pull, the middle /Q/ seems like the best fit. Definitely not the third, with its vertical tail. If you go with the first one, though, I think the tail needs to be a bit thinner</p>
      <p>- I agree about the /W/ and /J/, though. Maybe if the /J/ were pulled in and had a vertical serif? /W/s are tough in bold slab serifs. They look bad with bottom serifs and look top heavy without them. Without is the way to go, though, I think...</p>
      <p>- /M/ looks uneven in weight. The diagonals are a bit too thick.</p>
      <p>- /S/ looks a bit light. Also, its top curve looks lumpy, and I think jacobsievers is right, it looks top heavy (almost like it's upside-down.</p>
      <p>- You might pull in the upper bowl of the /B/ just a tiny bit.</p>
