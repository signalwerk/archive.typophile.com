      <p>An interesting side point, Raph, is that <a href="http://www.typeworkshop.com/index.php?id1=type-basics&amp;id2=&amp;id3=&amp;id4=&amp;id5=&amp;idpic=03#pictloader" rel="nofollow">in the Underware 'Type Basics'</a> they explicitly compare good straight-to-curve outlines as a path like driving around a curve in a car. </p>
      <p>According to the <a href="http://en.wikipedia.org/wiki/Fresnel_integral" rel="nofollow">wikipedia article on Cornu spirals</a>, the Cornu spiral is actually used to lay railroad tracks going from straight to curve, because it is in one way the 'ideal' for this purpose. Apparently it is the only curve in which the rate of change in radius is constant. This means that there is a  continuous linear increase in the centrifugal force of the train laterally against the tracks. This linearity helps preserve the track, as well as jostle the passengers around less.</p>
      <p>Anyway I found it interesting that this analogy of moving around a bend is already discussed in type design, and relates to the Cornu spiral.</p>
