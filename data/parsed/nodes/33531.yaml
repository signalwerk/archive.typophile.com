      <p>@Tim Ahrens: <em>Finally, I have to admit that I do not find the curve of the s in your PDF harmonic at all, especially the three lightest versions.</em></p>
      <p>You're right, it kinda sucked. I was trying to do it with too few points, and too quickly. I spent a little more time on the example, doing a couple of printed rounds instead of entirely on screen, and I'm sure you'll agree that the results are more satisfactory. Sweet curves are, as William points out, no substitute for a careful eye and a willingness to refine the outlines until they're just right. But I do think sweet curves can help that process, and certainly make it more enjoyable.</p>
      <p>The new PDF is <a href="http://levien.com/spiro/s_interp2.pdf" rel="nofollow">here</a>, and this time I've included the filled versions in the image:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/s_interp2_4551.png"></div><p></p>
      <p>@sgh: <em>Assuming that “G3 continuity” means continuity of the derivative of the curvature, can this in general be obtained with cubic Bezier curves?</em></p>
      <p>You can bring the error (discontinuity) down as far as you like, by using more curves. The default in Spiro is actually G4 continuity, but I'm switching to G2 as the default because it's easier to control, and the extra continuity isn't really visible except under extreme scrutiny.</p>
      <p><em>MetaPost’s Hobby splines are sometimes discontinuous in curvature when I specify more about the curve (such as tangents, etc).</em></p>
      <p>Well, they're always discontinuous in curvature, just not by much. But yes, when using a two-parameter spline (such as Hobby's cubic primitive or an Euler spiral), specifying the tangent makes the curvature quite discontinuous.</p>
      <p>It would be interesting to experiment with G2 continuity with tangent constraints using a four-parameter spline. My guess is that it's possible, but it might not be easy to control, i.e. if the tangent is significantly different than the one that would be assigned automatically, it might cause ripples in neighboring segments. But it's hard to know for sure until it's implemented. I'm not sure if I'll have the chance to do that any time soon. Time to grow new rocket scientists!</p>
      <p>Integrating Spiro splines into MetaPost would make a huge amount of sense. The integration would have to be relicensed under the GPL, and of course somebody needs to do the work. But I think it would be excellent closure, because the Hobby splines are what started me down this path in the first place.</p>
