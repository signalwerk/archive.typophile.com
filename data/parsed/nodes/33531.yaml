    html: |-
      <p>Congratulations on your release, Raph!  Good luck with writing your dissertation---I look forward to reading the math behind these curves.</p>
      <p>You might also want to mention on your web page that ppedit compiles on Linux (and from looking at the Makefile, probably Windows, too).  For those who don't want to compile ppedit to try it themselves, let me describe the basics:</p>
      <p>Curves are drawn with curve, corner, and tangent points as normal, but there are only on-curve points---no off-curve points.  The shape of the interpolated spline can be changed by adding more points to the curve and then moving them.  Moving a point added to a Bezier curve is a pain, because then all of the off-curve control points have to be recalculated to make the curve smooth.  However, Raph's program recalculates the spline to be smooth as you move the point (this is made easier by using the Cornu spirals, from my understanding), so that you always have a smooth curve.  It's actually more intuitive than I thought it would be, but it still takes some getting used to.</p>
    html_clean: |-
