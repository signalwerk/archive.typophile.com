      <p>crossgrove: You make a very good point. Making good, quick digitizations isn't the only way to evaluate curve-drawing techniques.</p>
      <p>My subjective experience is that Spiro is extremely good for making fine edits. You can tweak points around without having to worry about technical details like extremal points, and, in general, the changes "make sense". I've done quite a bit of this with both my revivals and my original designs (Inconsolata and Cecco). The warm, fuzzy feeling that I get when drawing has done a lot to motivate me to go more deeply into the math behind the curves, so that I know at multiple levels that the curves are "right."</p>
      <p>At some point, you go beyond what can be quantified, and into the realm of what it <em>feels</em> like to use the tool. I'm hoping that enough people spend enough time playing with it that I can start to get more insight into that, in addition to my own personal experience.</p>
