      <p>Raph, I'm having a hard time mentally linking an outline description format and any particular set of shapes made with it. This idea seems very tenuous and hopeful. What do you think it will lead to that is of interest to type designers? I can imagine all kinds of outcomes of interest to mathematicians.....  </p>
      <p>"Users don’t care about Terry, and they shouldn’t."</p>
      <p>These two statements might also be a matter of opinion. We do tend to admire people who make things we love to see/use, and I suspect Terry is one of those. Ignoring esthetics is foolish. It's a meaningful ingredient of any design effort.</p>
      <p>Hrant, I fully agree that chirography, or fashion, or convention, or any other isolated factor is unhealthy to fixate on. But condemning them as causal of some sort of degradation, disintegration or arrest of progress seems also nearsighted. I'm interested in a balance of ideal function and esthetic appeal (physically as well as visually), and in all areas of design.  It is amusing sometimes to see a chair that looks painful and dangerous, which turns out to be rapturous to sit in, but you then have to trick people to sit in it the first time. And I don't see these ingredients/concerns as so opposed as you seem to. Yes, of course it's misleading to fixate on chirography, or "logic" or rules or ink traps, to the detriment of everything else. But I don't think Terry is at that point. We all converge in the type world from very different paths. Bitmaps for example. Or math.</p>
      <p>Central to this thread is how to get tools (like Raph's) into our hands so we can stop noticing or being influenced by them, which relates to Terry's comment. Raph might actually like to know how people prefer to work. Whatever method or technique people start out with, you have to agree it's the results that matter. </p>
      <p>Now I'm plagued by mental images of text type drawn with ink and brush.....  8D</p>
