      <p>@dimitre: No, there's no easy way to do this in Spiro. The underlying math can do it, no problem, but I deliberately simplified the UI so there wouldn't be huge numbers of point types representing the different constraints. Christoph Knoth at ATypI suggested adding one more point type, which would be an extremum point - it would function similar to the curve point, but force the tangent to be a multiple of 90 degrees.</p>
      <p>One way you _can_ do it is to set points 1 and 2 to be corner points, and put an additional point on the arc, but that doesn't guarantee continuity.</p>
      <p>@Hrant Spiro can represent exact circles. Beziers can't, so in the conversion to Bezier you get an approximation, but of course it can be a highly precise approximation.</p>
    html_clean: |-
