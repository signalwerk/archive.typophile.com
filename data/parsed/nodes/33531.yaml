      <p>@hrant: <cite>Metafont does support outlining and not just expanded strokes, but the only real reason to use Metafont is its parametric abilities, and (please correct me if I’m wrong) these only work with strokes.</cite></p>
      <p>MetaPost (essentially MetaFont for Postscript) supports outlines, and of course since everything is scriptable, parametric abilities are available to work with strokes. <a href="http://www.ctan.org/tex-archive/fonts/utilities/metatype1/" rel="nofollow">MetaType1</a> is a set of MetaPost macros that makes it easy to make a CFF-based font (Type1 or CFF-flavored OTF).  My font <a href="http://typophile.com/node/31970" rel="nofollow">Aurulent Sans</a> is being developed using MetaType1.  The use of a weight parameter can be seen when comparing the regular and bold weights.</p>
      <p><cite>What would be amazing is if somehow we could use parametrics with outlines; even more amazing would be a GUI for that!</cite></p>
      <p>The ability to script is much more powerful than just the parametrics, and GUIs aren't very good for representing scripts.  If you're just interested in the parametrics, then it might be possible to represent them graphically, but here the main problem is that the dimension of the parameter space is probably too high to represent visually in a meaningful form.</p>
