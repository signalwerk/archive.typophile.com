      <p>I would imagine that G1 continuity is always preserved when the angles of the control arms are consistent between the masters. This is, of course, always the case at extremal points, which is probably the main reason why they're such a big deal.</p>
      <p>It's when you get into more subtle variations, the kind that just can't be done with a single long Bezier segment, that it's harder to control the smoothness.</p>
      <p>Here's another interpolation example I whipped out quickly:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/s_interp_6237.png"></div><p></p>
      <p>As you can see, the curvatures of the fat S are quite different from those of the thin - the radius on the inside bowls is quite small. And all that was done with 17 on-curve and 4 corner points. I've also put up a <a href="http://levien.com/spiro/s_interp.pdf" rel="nofollow">PDF</a> for people who want a closer look.</p>
