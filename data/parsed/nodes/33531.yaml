      <p>Sorry about the delay in doing this, but I was traveling and then forgot about it.  I've posted a sample that shows varying x-height in Aurulent Sans in that font's <a href="http://typophile.com/node/31970" rel="nofollow">critique</a>.  The amount of time it took me was changing one line and hitting recompile.  The tricky part was figuring out how to install several different versions of the same font. :)</p>
      <p>The ability to change basic parameters globally over the entire font is quite nice, but it does require planning the scripts (somewhat) carefully.  For instance, I can't push the x-height much over 600, because then the script that generates the question mark barfs.  Of course, as Hrant pointed out, it's presumed that the parameters won't vary too much from the value in mind when the scripts are written.</p>
