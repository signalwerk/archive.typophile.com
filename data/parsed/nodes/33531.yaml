      <p>sgh:<cite>Could you please explain more about how to enforce G2 continuity for Bezier splines?</cite></p>
      <p>It basically works like that: </p>
      <p>Nodes that connect two Bezier curve elements are shifted towards the wider curve until the curvature on both sides of the node is equal. During this, the BCPs of both cureves are adjusted so that the shape stays as close as possible to the original: for non-s-shaped curves the BCPs are adjusted so that the area within the curve stays the same (taking into account that thin triangle created by the shifting of the node). For s-shaped curves, the BCPs are adjusted so that the curve stays as close as possible to the original, meaning the curve is split in two and both areas within the "half curves" stay the same as before.</p>
      <p>Alternatively, nodes that are not extrema can be rotated (towards the narrower side) until the curvature is equal on both sides. BCPs are adjusted as above. I feel this gives better results thatn shifting but it is obviously not possible for extremes.</p>
      <p>In addition, I am experimenting with G3 continuity, which obviously means that nodes are shifted perpendicular to their tangent until G3 continuity is given.</p>
      <p>Note that this is a system that <cite>processes existing shapes</cite> - it does not <cite>generate</cite> shapes. I think this approach is much more appropriate to the typical design process.</p>
