      <p>"Well, a digital gloss is still less bad than a chirographic gloss."</p>
      <p>Matter of opinion. I think you should consider this carefully. Since type is evolved from written language, it's a lot easier to use chirographic type than type made from geometric modules. When I say "digital gloss" it refers not only to the finish but the structure and the approach to letter- and type-building. Losing every element of chirography that has led to printed language (which is indeed very much a concern, look around) is much less preferable than losing technological constraints. When the tools have no influence, you can still make any kind of typeface, from radically reformist to traditional (or some combination thereof?...).</p>
