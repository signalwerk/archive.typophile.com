      <p>I discovered this thread when seeking information about one of the earliest computer-based type design tools.</p>
      <p>It was mentioned in a standard type design textbook, so I'm sure many here have seen it. A single Archimedian spiral was seen as sufficiently general that it was the only tool the system offered, playing the same role as Bezier curves in today's digital type formats.</p>
