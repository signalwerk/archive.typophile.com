      <p>Raph, that tool is very exiting, I think it solves some major problems with Bezier curves. I have a few comments and questions:</p>
      <p>1. As far as I can see, Spiro is essentially a tool that takes on-curve points as input and outputs Bezier curves. Could you explain the benefit of using spirals as an intermediate step? Wouldn't it be possible to find Bezier splines that run through the given points with G2 continuity? Doesn't the problem of G2 continuity still remain when two spirals are connected?</p>
      <p>2. It seems that the main differences to direct Bezier editing are:<br>
      a. built-in G2 continuity, which is great but G2 continuity can also be enforced automatically for Bezier splines (as I have shown in Lisbon last year)<br>
      b. no off-curve points, which is great<br>
      c. no need to specify tangents for on-curve points, which is great<br>
      d. no possibility to specify tangents for on-curve points, which is very odd</p>
      <p>I think for practical type design application it is very important to be able to specify tangents for your on-curve points, which Bezier splines allow but not Spiro. Would it be possible to add support for tangents? Then we would actually have the best of both worlds. Also, I think an option to specify tangents without the position of the on-curve points would be a very handy in everyday type design</p>
      <p>3. What about rounding errors? The restriction to 1000 units seems to be built into T1/CFF, isn't also the use of integer coordinates a requirement of Postscript fonts? Or is this just an FL-internal restriction? If not, looking at the (un-rounded) Postscript output is irrelevant - we need to see the final shape in fonts with coordinates rounded to integer numbers and 1000 UPM.</p>
      <p>4. You say that Multiple Master technology does not preserve G2 continuity. It is my experience, however (in hundreds of cases), that G2 continuity is in fact preserved when interpolating Bezier curves with MM. I don't know whether it could be proven that this is the case under certain conditions (or under which conditions, to be more exact).</p>
      <p>Thanks,<br>
      Tim</p>
