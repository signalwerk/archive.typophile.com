      <p>Bumping up this thread again :)</p>
      <p>Developement version of Inkscape supports Spiro as well now. It's implemented as a live path effect (that is, there is always a final bezier path in an SVG file) and can be applied to any bezier path or be drawn with a pen or pencil tool. It will be available in final Inkscape 0.47 release (due this autumn probably).</p>
