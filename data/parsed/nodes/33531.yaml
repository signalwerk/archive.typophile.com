      <p>"Any time you allow an algorithm to determine a curve for you, it will influence what the design looks like."</p>
      <p>I think this is an excellent point. It ought to be discussed more often generally. It's hard enough to get full control of Beziers, and unfortunately too many type designers can't separate their design choices from their digital construction choices. Many of Emigre's types, even the recent classic revivals or homages, have this 'digital' gloss.  </p>
      <p>I do indeed welcome an outline format that doesn't seem to favor grid-based alignment. I know very intimately why rasterization is a major concern in imaging type, but I do think, as Christian says, this kind of thing should not have the influence that it currently has on the design process. Unless a design is being made specifically for low-res use, I'd rather focus on truly ideal node placement and efficient, precise editing, rather than accommodating extrema. </p>
      <p>I will need to spend more time drawing with this tool in order to get used to the way the curves work and feel. Therefore, I need to have the tool built into, or accessible in, my current workflow (I don't have time to experiment in a separate environment). Raph, I would prefer to find this drawing environment as an option in FL, FOG, DTL FontMaster or other commercial product.</p>
