      <p>"And it seems to me that one of the things we ought to want to get a handle on is the logic of contrast in a co-ordinated glyph set."</p>
      <p>Peter, I would say not. The "logic" of almost anything in type design tends to be very occasional, inconsistent, and useless if followed too completely. From serif length to contrast to bowl shape to stress angle, these things tend to look bad and function badly when systematized too completely. Greek and Arabic types especially would not take well to this logical approach or analysis. </p>
      <p>"Users don’t need your comfort, you need theirs."</p>
      <p>Hrant, Terry said ink and brush. It doesn't sound like he's working on a dictionary typeface.</p>
