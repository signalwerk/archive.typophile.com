      <p><em>Users don’t care about Terry, and they shouldn’t.</em></p>
      <p>Talk about a massive overstatement! You've missed the point entirely. This isn't about any individual person. It's about making a useful tool for people to use. Nothing more. There's no such thing as a fool-proof, universally accepted method. In fact— FontLab and Illustrator handle Beziers very differently and because of that "users" prefer different methods. Some type designers use Illustrator and import into FontLab—some use FontLab only, and some still even use Fontographer. So your statement is a complete oversimplification. I often find the critical flaw in many of your opinions is that they're based too much on the idea of "absolutism." Life is not all black and white.</p>
      <p>Hrant, you're too smart of a guy to make outrageous statements like this. Your fixation on chirography is very apparent to most frequenters of Typophile I'm sure, so it's no surprise that you've twisted words to make your point. </p>
      <p>I find it amusing that this is the very thing I've seen you criticize William Berkson about time and time again— you're too literal. Try reading and understanding a person's intent before reacting. And if something is not stated clear enough for you...you can always ask a question. I would have been happy to explain myself more clearly. But I'm sure just reacting is a lot more fun.</p>
