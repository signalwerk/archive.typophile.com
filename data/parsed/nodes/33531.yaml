    html: |-
      <p>dberlow: <cite>How huge is that number of point types anyway?</cite></p>
      <p>There are essentially 4 types of Spiro points:</p>
      <ol>
      <li>corner points -- where the slopes and curvatures of the incoming and outgoing splines are unconstrained
      </li><li>G4 curve points -- continuous up to the fourth derivative
      </li><li>G2 curve points -- continuous up to the second derivative
      </li><li>constraint points -- used to connect a curved line to a straight one
      </li></ol>
      <p>More information can be found at <a class="freelinking external" href="http://libspiro.sourceforge.net/" rel="nofollow">libspiro</a>, the <a class="freelinking external" href="http://fontforge.sourceforge.net/editspiro.html" rel="nofollow">Fontforge documentation</a>, or Raph's <a class="freelinking external" href="http://www.levien.com/phd/phd.html" rel="nofollow">thesis</a> (see in particular page 121 {137 in pdf numbering}).</p>
    html_clean: |-
