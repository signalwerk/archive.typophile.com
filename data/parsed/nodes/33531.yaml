      <p>Raph,</p>
      <p>I've been re-reading your thesis (wonderful, by the way!) to see how an extremum point would work.  Following the table on page 121, I think the following might work for a point of fixed tangency:</p>
      <p>\theta_l=\theta_r=fixed constant<br>
      \kappa_l=\kappa_r<br>
      \kappa'_l=\kappa'_r</p>
      <p>These four conditions balance the four degrees of freedom a general Spiro segment has.  Do these seem like the right conditions?  I think it should be pretty straightforward to extend your solver to include this type of point.</p>
      <p>Best wishes,<br>
      Stephen</p>
