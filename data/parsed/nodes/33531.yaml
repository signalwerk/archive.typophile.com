      <p>This is all very interesting, but not very new.</p>
      <p>URW Ikarus, developed by Peter Karow, in 1973-74, used Hermite splines having the important property that all the control points lie on the outline itself.</p>
      <p>You had a few more points on curve but the control was great.</p>
      <p>But, today, designers prefer and have accepted the off-curve Bezier handles.</p>
      <p>However, Ikarus plug-ins where very powerful.</p>
      <p>For example, you could change "one" serif and have the program replace all the serifs throughout automatically.</p>
      <p>Another plug-in would slant or "italicize" the glyphs and optically adjust the distortions based on the amount of angle, and so forth.</p>
      <p>Very powerful plug-ins that made the type designers job simpler, saved time. But, in the end, the type designer had to fine-tune everything by eye.</p>
      <p>Automation can only go so far.</p>
      <p>It seems that everyone is looking for the "magic" tool. How can I draw an "S" really fast without too much difficulty.</p>
      <p>How can I get the tool to create a font for me relatively quickly, so I can make and market more fonts quicker.</p>
      <p>I'm sorry, but there are no shortcuts to good typography or good type design.</p>
      <p>I'm sure the tools will continue to make improvements with time. That is the nature of technology.</p>
      <p>But the ultimate tool is ones own knowledge, talent and craftsmanship that one brings to the table.</p>
      <p>Everything else is just a tool to help us explore the possibilities. Just a tool.</p>
