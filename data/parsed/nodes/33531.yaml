      <p>@sgh: no, the 0.01 x3 build doesn't load a background image at all. Sorry. It's obviously not <em>that</em> difficult a feature to add, because I do have it in the gtk1 version, but I just haven't gotten around to it, and I'm not sure when I will have time to do so. I was kinda hoping others would pitch in on the coding, but that hasn't happened (yet) either.</p>
      <p>@hrant: <em>narrower "S".</em> I know. But at some point we cross the line from "what the tool can do" to "how good is Raph at font design." I'm middling-good and hope to get better, but that's kind of off the main topic of this thread.</p>
      <p>Ultimately, I think it will take a number of people spending time with the tool and learning how to get good results before we can definitely answer the former question. People spend months, if not years, learning how to draw top-notch Beziers. I strongly suspect that the learning curve is easier for spirals. The big unanswered question is whether the results are better once you've climbed it.</p>
