    votes: null
    html: |-
      <p><cite>* Will it be possible to write interactive editing plugins in Python and have them work cross-platform?</cite></p>
      <p>It is possible even now. Spiro data may be stored in glyph dictionary (Python-accessible storage for arbitrary data). Python tool API allows to redefine mouse events and window paint function, but that is currently very limited.</p>
      <p>In future implemenation plugin API (both for Python and for general coding) will be greatly extended.</p>
      <p><cite><br>
      * To do the rasterizing, as you say, can my plugin generate a (crude) Bezier and hand it off to a FontLab-supplied API for the rest?</cite></p>
      <p>By rasterization I mean conversion to 8-bit grayscale bitmap. While conversion to Bezier is OK, it will be much faster if Spiro outline is converted to supersampled vector-only outline. Then it can be passed to system or Freetype rasterizer to get bitmap. </p>
      <p>What I mean is that in furure plugin architecture we will define minumal set of plugin functions that are required for it to be included into FLS as "layer editor". That will include on-screen outline rendering, conversion to Bezier outline, rasterization to grayscale bitmap, serialization (it should store data in its own format <strong>and</strong> Bezier format for compatibility reasons) and UI integration. This plugin architecture is currently in early stage of development, so many more details will emerge as we move forward.</p>
      <p><cite>* I assume that the plug-in also gets some kind of API for marshalling and unmarshalling the plugin-specific format into the FontLab database file. Is this correct? For what I need, JSON would be ideal, but other choices would also work.</cite></p>
      <p>Future database format will be very different to what we have now. It will allow to store glyph layers in any format that is required by any of plugins.</p>
      <p>.ik format: I think that computer power available at the time was an issue when Ikarus was developed. It is actually based on very simple math, which has many limitations. That is the reason why in sketch mode of FLS we are using some approximation of Ikarus curves with splines. That gives much more flexibility to outline (it can be solved with any position of points) while keeps it very close to .ik shape.</p>
