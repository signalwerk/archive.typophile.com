      <p>This is very interesting! I was always looking for a good way to have description of outlines without off-curve points and Sketch mode in FLS is an example of this approach. In that case we decided to make curve math compatible with Ikarus outlines (while based on different math) and that was not a best approach. Other methods that we were checking provided much smoother results but were not point-compatible with .ik files.</p>
      <p>What about Peter Karow's approach to construction of outlines using spirals? Is rougly the same idea? (It is on page 86 in English edition of his book.)</p>
      <p>Few words about our future approach to different editing methods: the biggest problem of current Fontlab tools is that all of them mix production with design. We plan to separate it and offer plugin architecture for editing content of glyphs. </p>
      <p>There will be only two minimal requirements: plugin must resterize (with smoothing of edges) and provide at least a conversion to and from Bezier outline.</p>
