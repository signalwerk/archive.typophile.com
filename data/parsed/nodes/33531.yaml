      <p>&gt;I feel this gives better results than shifting</p>
      <p>Like everybody now, I guess, I do this 'taking out the bumps' stuff by eye, rather than algorithm. </p>
      <p>I have usually found it easier to slide nodes (using the shift key in FontLab) than to change the angle of smoothly connected bezier handles. Changing the angles of handles seems to mess up the 'other' curve--the one you don't want to change--more than sliding the node. </p>
      <p>If you are free to move around the angle and length of one handle, because there is a sharp connection, and the other node is at an extremum. then it is easier. But then curve continuity across the node is also not an issue. </p>
      <p>Also, to sound a different note here, I think the issues of proportion, weight, contrast, and connections of all the parts of glyphs are more important to text faces than the exact curves, which are not so visible at text sizes. Though sweet curves are an important part of the story, they aren't the biggest part of the story.</p>
