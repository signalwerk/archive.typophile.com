      <p>@Graham_Taylor: <em>May I ask how you converted to beziers?</em></p>
      <p>This part of the code is very rough and unfinished. When you press Apple-S, it saves the file "plate" into the file system, into the current directory, not sure exactly where that is by default on a mac. (a quick test reveals that it seems to go into / , which is not friendly behavior). Similarly, when you press Apple-P, it saves a PostScript file to /tmp/foo.ps. I then use some command-line scripts (mostly written in Python) to optimize the Beziers, etc. These scripts ship in the spiro tarball, but not in the ppedit.dmg disk image.</p>
      <p>Dave Crossland (abattis) is planning on writing better documentation soon, which I think will be very helpful.</p>
