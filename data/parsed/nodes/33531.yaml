      <p>Didn't have time until now to test it. I learned to digitize type with Ikarus, so it's not completely unfamiliar. It seems to be flexible enough to allow the fine tuning I want, but right now, I'm so acclimated to beziers that I'd need more time to get used to the different behavior. I couldn't necessarily compare my drawing speed between Beziers and spirals because most of my actual design work is spent adjusting existing outlines. I don't do a lot of revivals, and I don't do big finished drawings anymore, so the speed at which I can digitize an outline isn't a big factor. Major editing happens after the first round of proofs. I can already slap an outline together in bezier format in record time. It's not finished no matter how much I fuss over it initially. </p>
      <p>Raph, I don't want to rain on your challenge, but this means I can't gauge quality or speed based on immediate digitization results; it's very iterative, and "accuracy" isn't my concern, rightness of design is, which is revealed with testing and use.</p>
