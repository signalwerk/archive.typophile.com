      <p><em>What does the “optim” setting do?</em></p>
      <p>It's a speed/optimization tradeoff. At zero, it's interactively fast but generates about three times as many Beziers as is needed. At three, it (currently) takes about a minute, but generates something like the absolute most optimized cubic Bezier representation possible for the curve. The main thing it's doing at level 3 is exhaustively searching all points along the curve to find the best points to break - at the lower levels, it just splits the curve in half whenever a single Bezier is not sufficient. There'll be more detail in my thesis, of course.</p>
      <p><em>But no need to bother with formal timekeeping - we can trust us.</em></p>
      <p>I think we can too, but I'd like to remove as many variables that could spoil the results as I can.</p>
