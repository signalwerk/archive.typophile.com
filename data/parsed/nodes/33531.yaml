      <p>@yuri: <em>What about Peter Karow’s approach to construction of outlines using spirals? Is rougly the same idea? (It is on page 86 in English edition of his book.)</em></p>
      <p>Only roughly. The spiral shown on page 87 isn't Karow's, it's from the Purdy-McIntosh system (I have a bunch of references if anybody's that interested). Basically, the results are good, but the way they have it set up it's very hard to edit: the user has to put in all the spiral parameters explicitly. In my approach, the computer solves a global system determining the spiral parameters, based on curvature continuity constraints at the on-curve points. Completely original to my approach is the "one-way" constraint, which gives you continuous curvature at straight-curve joins (and is more general - the "straight" section can have a slight bend to it, and it solves that too).</p>
      <p><em>We plan to separate it and offer plugin architecture for editing content of glyphs.<br>
      There will be only two minimal requirements: plugin must resterize (with smoothing of edges) and provide at least a conversion to and from Bezier outline.<br>
      </em></p>
      <p>A plugin is an entirely satisfactory approach all around. But let me understand more fully, by asking some questions:</p>
      <p>* Will it be possible to write interactive editing plugins in Python and have them work cross-platform?</p>
      <p>* To do the rasterizing, as you say, can my plugin generate a (crude) Bezier and hand it off to a FontLab-supplied API for the rest?</p>
      <p>* I assume that the plug-in also gets some kind of API for marshalling and unmarshalling the plugin-specific format into the FontLab database file. Is this correct? For what I need, JSON would be ideal, but other choices would also work.</p>
      <p>I agree that combining "design" and "production" has serious disadvantages. I have come to believe that the best approach is to generate high-fidelity "masters" using a design tool, ideally with parameterization, and then have a batch-mode converter to freeze those parameters, quantize to a specific Bezier grid (either cubic or quadratic, although at this point I only have optimized conversion to cubics done), and generate the font file.</p>
      <p>I also agree that it's possible to do quite a bit better than the .ik file format. It was pretty good for its time, but there's lots that I know now that just doesn't fit into the .ik approach. (Incidentally, the Ikarus spline is one I look at carefully in my chapter comparing two-parameter splines, along with the Hobby (Metafont) spline, Minimum Energy Curves, and, of course, Euler spirals).</p>
      <p>I haven't actually played with the Python capabilities in FL5 to see what's possible, only looked at the documentation. It might be possible to do a useful prototype.</p>
      <p>@sgh: no, the 0.01 x3 build doesn't load a background image at all. Sorry. It's obviously not <em>that</em> difficult a feature to add, because I do have it in the gtk1 version, but I just haven't gotten around to it, and I'm not sure when I will have time to do so. I was kinda hoping others would pitch in on the coding, but that hasn't happened (yet) either.</p>
      <p>@hrant: <em>narrower "S".</em> I know. But at some point we cross the line from "what the tool can do" to "how good is Raph at font design." I'm middling-good and hope to get better, but that's kind of off the main topic of this thread.</p>
      <p>Ultimately, I think it will take a number of people spending time with the tool and learning how to get good results before we can definitely answer the former question. People spend months, if not years, learning how to draw top-notch Beziers. I strongly suspect that the learning curve is easier for spirals. The big unanswered question is whether the results are better once you've climbed it.</p>
    html_clean: |-
