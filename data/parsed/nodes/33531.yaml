      <p>&gt; Why you’d want FontLab at all is a mystery to me</p>
      <p>Come on.</p>
      <p>&gt; regarding MetaFont, I figure the way it goes directly<br>
      &gt; from code to bitmaps is its biggest problem.</p>
      <p>It's not a problem if you see it for what it is: a combination of glyph descriptor and RIP. But a very real -and somewhat related- problem of Metafont is its foundation on the theory that letters should have skeletons. This is a naive, primitive and fatal fallacy, and one at the heart of chirography as well. It's the reason Computer Modern looks so crappy.</p>
      <p>hhp</p>
