      <p>@hrant: <cite>So has anybody designed a MetaPost outline font where the x-height is parametric?</cite></p>
      <p>x-height is a parameter in Aurulent Sans, and I imagine it is as well in other MetaType1-designed fonts, such as Antykwa Toruńska, Antykwa Półtawskiego, Kurier, and Iwona.</p>
      <p><cite>The question is (and this might be difficult to answer) was it worth the effort, compared to a “plain” interpolation setup in FontLab?</cite></p>
      <p>To me, scripting the outline of a glyph is MUCH easier than drawing it graphically.  I find it much easier to say "Put point A here.  Put point B here.  Put point C here. Put point D 1/3 of the way between B and C. Draw a smooth curve from A to D to E, etc".  That way I don't have to worry about whether the curve is smooth or not, where to put control points, etc.  (Well, that's a bit of lie, often I need to give MetaType1 a little bit more help, but not too often.)  And if the width changes, or the x-height changes, then the position of point A, etc is automatically recalculated when the scripts are run again.</p>
      <p><cite>The ability to script is much more powerful than just the parametrics</cite></p>
      <p><cite>But FontLab has the former, but not the latter,<br>
      so the valuable sort of power is in the latter.</cite></p>
      <p>I have never used FontLab, so I don't know its scripting language.  However, based on your comment, it sounds like it is not as powerful as MetaType1.  Can you do the type of outline construction I described above?  The parametric power comes from using the parameters in the construction.  Of course, it is also (somewhat) difficult to create construction scripts that capture parameters.  See this <a href="http://typophile.com/node/29008">discussion</a> and this <a href="http://typophile.com/node/29008">discussion</a> for thoughts on why a more parametric approach has not been more frequently used.</p>
