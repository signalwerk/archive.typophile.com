      <p>&gt;French Curve</p>
      <p>Looking at some internet sites, it seems that the most widely used French Curves are composed of sections of parabolas, hyperbolas, and elipses. These are all conic sections, can be described by quadratic equations, and hence can be drawn perfectly by quadratic bezier curves.  </p>
      <p>The Cornu spirals here are different. If I understand it rightly, sections between knots cannot be drawn accurately with either a *single* quadratic or cubic curve, though of course they can be approximated with multiple curves of either type.     </p>
      <p>I don't know if the Cornu spiral is on any French Curves.</p>
