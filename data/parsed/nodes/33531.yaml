      <p>Tim: thanks for your kind words, and even better, your good questions. Some of these questions require fairly deep answers, to which I would refer you to my thesis (I'll put the draft-in-progress online in the next day or two). But I'll try to at least scratch the surface here.</p>
      <p><em>Could you explain the benefit of using spirals as an intermediate step?</em></p>
      <p>Yes. G2 continuity is not the only smoothness property you care about, it's just really crisp and easy to measure. You also want to make sure that the curvature doesn't have any sharp peaks in it. But there is no agreement on what is <em>the</em> best way to quantify this. In my thesis, I refer to Potter Stewart's (meta)-definition of <a href="http://www.law.umkc.edu/faculty/projects/ftrials/bruce/bruceindecentspeech.htm" rel="nofollow">obscenity</a>, and then go on to propose the L∞ norm of the deviation of curvature as the most favored measure of curve smoothness. To all those naysayers out there who feel it should be the L2 norm, I say: fie unto you.</p>
      <p>If all you cared about was G2 continuity, Beziers do OK. Manning showed a G2 continuous cubic spline in 1973 (it was used, apparently, for shoe insole shapes). However, for very large turning angles between the on-curve points, his spline sometimes did not converge to a unique solution. Hobby's 1985 splne (used in Metafont, and thus how I got hooked on this stuff) was influenced by Manning's, but traded off exact G2 continuity (it uses a good approximation of curvature instead) for bulletproof stability of the solutions.</p>
      <p>But neither of these curves <em>look</em> pretty if you try to make, say, an S segment that turns 90 degrees one way and then the other - you get curvature peaks at about 15% and 85% of the arc length.</p>
      <p>So spirals deal with both problems: you never get a curvature peak except at the control point. Also, (and I'm still nailing this down), you can get very good stability. The specific divergence of Manning's spline is definitely avoided, but I don't know for sure whether the Euler spiral spline <em>always</em> converges, or just almost always.</p>
      <p><em>Wouldn’t it be possible to find Bezier splines that run through the given points with G2 continuity?</em></p>
      <p>Yes, Manning's is one such. But the results are quantifiably not as good. I'll have illustrations in my thesis, I promise.</p>
      <p><em>Doesn’t the problem of G2 continuity still remain when two spirals are connected?</em></p>
      <p>That's exactly what the goal of the spline solver is: find Euler spiral segments between all adjacent on-curve points so that curvature is continuous across them. Once you take that as the challenge, it's not <em>too</em> difficult to work out numerical techniques to take it on.</p>
      <p><em>Would it be possible to add support for tangents?</em></p>
      <p>Yes. In fact, I originally planned to do exactly that, but generally found that I didn't need it for my own work. If other people find they need it, it's doable. Inside the solver, the constraints are written as a big matrix, with parameters corresponding to tangent angle, curvature, and so on. It's a matter of UI plumbing to let people write more kinds of constraints, including tangents. I was very concerned about UI complexity, though.</p>
      <p><em>What about rounding errors? The restriction to 1000 units seems to be built into T1/CFF, isn’t also the use of integer coordinates a requirement of Postscript fonts?</em></p>
      <p>John spoke well to the 1000 unit issue. But the short answer is no, the div operator lets you do rational fractions, which means more or less unlimited accuracy. The only real downside is that the font file gets quite a bit bigger.</p>
      <p>That said, I also expect good results with rounded coordinates, because it chooses the minimal number of Beziers, and therefore long segments. Rounding becomes more visually noticeable as Beziers get shorter. (This is deep water that I expect to cover more deeply in my "converting to Beziers" chapter - in order to make sense of it, you have to adopt a different error metric than "max distance error". I argue for L2 norm of angle error as an error metric that more accurately models the perception of curve smoothness)</p>
      <p><em>It is my experience, however (in hundreds of cases), that G2 continuity is in fact preserved when interpolating Bezier curves with MM. I don’t know whether it could be proven that this is the case under certain conditions (or under which conditions, to be more exact).</em></p>
      <p>In the <em>general</em> case, it doesn't even preserve G1. An example is given in Figure 2-8 of Adobe's <a href="http://partners.adobe.com/public/developer/en/font/5091.Design_MM_Fonts.pdf" rel="nofollow">tech note 5091</a>. I can imagine that you learn quickly enough to stay away from those cases, but my point is that the onus is on the designer. With spirals, you do get the G2 continuity all the time, without having to worry about it.</p>
      <p>I would imagine that G1 continuity is always preserved when the angles of the control arms are consistent between the masters. This is, of course, always the case at extremal points, which is probably the main reason why they're such a big deal.</p>
      <p>It's when you get into more subtle variations, the kind that just can't be done with a single long Bezier segment, that it's harder to control the smoothness.</p>
      <p>Here's another interpolation example I whipped out quickly:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/s_interp_6237.png"></div><p></p>
      <p>As you can see, the curvatures of the fat S are quite different from those of the thin - the radius on the inside bowls is quite small. And all that was done with 17 on-curve and 4 corner points. I've also put up a <a href="http://levien.com/spiro/s_interp.pdf" rel="nofollow">PDF</a> for people who want a closer look.</p>
