      <p><cite>Yuri, a plugin architecture allowing for different curves in fontlab sounds fantastic. I would love to explore a nurbs based drawing environment, for example. It would solve the licensing issues for this technology too :)</cite></p>
      <p>That's why we plan to implement it. </p>
      <p>There are many possible ways to draw outline. I personally experimented with several types of splines, some "centerline" methods, Ikarus curves etc. Even in FLS you may find 5 different ways to build outline: 2 types of curved in "main" mode, Sketch mode (some type of spline, point-compatible with Ikarus outline), Primitives (which is "object" UI) and some strange method to use components as "blocks" to build outline with autojoin function (not really useful and never documented). </p>
      <p>Only "main" mode actually survived and is used to draw, all others are more or less "experimental".</p>
      <p>Oh, there are few more: in standard FLS distributive you may find 3 "Python tools" which are good examples of how this spiral-based technology may be integrated even into FLS5. </p>
      <p>Two tools are Line and Curve (latter shows some rudimentary auto-curvature control) and third is called Drops. It creates random-size circles if no tablet is connected. With pressure-sensitive tablet size of the circles depend on pressure.</p>
      <p>Actually it is very interesting challenge to integrate spiral-based editing tools into FLS using Python tool gateway :-)</p>
