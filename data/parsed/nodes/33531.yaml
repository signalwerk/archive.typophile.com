      <p>@abattis: <em>Python scripting got added to FontForge last week</em></p>
      <p>That's seriously cool news. I can still imagine that most professional type designers would rather use FontLab though.</p>
      <p>@hrant: <em>&gt; the dimension of the parameter space is probably too high to represent visually</em></p>
      <p>Computer Modern has something on the order of 60 parameters for things ranging from the obvious ascender/descender height to more subtle things like the parameters for the serifs. That's a very high dimensionality of the parameter space, even if the <em>amount</em> of the change is subtle.</p>
      <p>The key to making variation work for people who don't have advanced computer science degrees is to keep the number of dimensions down. Here's an outline of my ideas for that:</p>
      <p>1. For optical scaling, use stroke offset for the bulk of the effect, with a little optional squooshing.</p>
      <p>2. For things like ascender and descender lengths, allow points to be put on <em>frames</em> which can move independently of the main em. So, then, to lengthen descenders, pull the descender frame (global to the font) down.</p>
      <p>3. For everything else, do interpolation. My gut feeling is that 2-dimensional interpolation (the corners of a quadrilateral) is the most that is intuitive to work with, and, if you can keep it to one, that's even better.</p>
      <p>The number of active frames in any one glyph should be no more than three or so. The main thing interpolation is used for is weight (like the above image).</p>
      <p>Also note that one of the most important aspects of optical scaling is the spacing and kerning. That can probably be done using simple interpolation between a "big" and a "little" size.</p>
      <p>@rosaini: Thanks! Nice spirals in your avatar.</p>
