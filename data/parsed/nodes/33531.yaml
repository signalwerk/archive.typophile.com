      <p>There's another factor, beyond which is faster or more intuitive. Any time you allow an algorithm to determine a curve for you, it will influence what the design looks like. Bezier curves can describe almost any shape, if you add enough anchor/control points, but they become difficult to manage very quickly once you start adding points beyond the extremes.</p>
      <p>As a result most type designers don't add that many points resulting in predictable curves. What percentage of type these days use control points *only* at the extremes of the curves? A lot. How many designs born in the bezier age have slightly tapered stems? Not many. Why? Because it's harder to draw that way. Here the medium influences the message.</p>
      <p>From my short experience with these curves, it is much easier to manage additional knots, which means that lazy type designers like me will likely add more. The resulting designs will look at least different from the current batch if not more creative.</p>
      <p>If it doesn't go into FontLab, though, I'm unlikely to use it :( I might give FontForge another try if it goes in there, though, even though X11 on OS X is gross.</p>
