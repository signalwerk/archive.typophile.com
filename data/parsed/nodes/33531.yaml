      <p>@hrant: <em>An overlay of the spiral original over the converted bezier</em></p>
      <p><img src="/sites/default/files/old-images/fc-339-overlay_6327.png"></p>
      <p>The Bezier version is a 1px red stroke, and the spiral version is on top in black. You can see a teeny difference on the left hand of the top curve. If you tweak the "thresh" parameter, it'll add more Beziers to make the error go as small as you like. I picked the .01 number as the default for my work because the error is just below the threshold of what you can see when you look at the shapes side-by-side. Setting it to .001 adds nine beziers (for a total of 52), and the visual difference becomes undetectable even when zoomed. Btw, if you want to zoom in on the above comparison, I put up a <a href="http://levien.com/spiro/fc-339-overlay.pdf">PDF</a>.</p>
      <p>I tried overlaying the black-filled version over the original photo, but I couldn't get anything that seemed as clear as the first image above, partly because of the low contrast of the original. I have done the same thing with letters - maybe I should post some images from that?</p>
      <p><em>what term should we be using for this - cornus, spirals, or what?</em></p>
      <p>I kinda like "spirals". Cornu spirals are actually only one case. The most general case is a third order polynomial spiral, which I sometimes abbreviate "spiro". Incidentally, Cornu didn't invent the spiral bearing his name, Euler did, so they should really be called "Euler spirals".</p>
      <p><em>How much time would it take you to do it with beziers?</em></p>
      <p>Well, for me to do it wouldn't exactly be fair, because I want my tools to win. But I'd be very interested to learn how long it takes <em>you,</em> Hrant, and whether you're as satisfied with the technical quality.</p>
      <p>Actually, what I think I'd like to do is pose a real challenge. Maybe a neutral Typophile person (Tiff? Stephen?) could serve as moderator. It would go something like this: the moderator selects a high quality image of a predigital glyph, something like 1000px square, and posts it at a pre-arranged time. Then, people post followups to that thread containing their best shot, using the tools of their choice - Spiro, Illustrator, FontLab, QB's, CB's, IkarusMaster, whatever. Reports of drawing time can be verified by the post timestamp, and then the moderator would judge the quality.</p>
      <p>Sound like fun? I would write up the results in a section of my thesis, as part of the case I'm trying to make is that spirals are more intuitive, more productive, and more conducive to high-quality results. Going up against the best skills of Typophiles would be a real way to falsifiably test those claims.</p>
