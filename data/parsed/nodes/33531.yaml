      <p>Tim: <em>The restriction to 1000 units seems to be built into T1/CFF</em></p>
      <p>It is very strongly recommended for Type 1 fonts, i.e. things are expected to break if you use a UPM other than 1000. But it is not a requirement for CFF fonts. I've made CFF fonts with UPMs of 2048 and 4096, and they work fine. There were largely aesthetic problems in pre-CS2 versions of Adobe apps, which presumed a UPM of 1000 for calculating caret height, but that's fixed now and I have not seen other problems with using UPMs other than 1000.</p>
    html_clean: |-
