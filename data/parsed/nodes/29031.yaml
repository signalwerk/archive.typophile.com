    html: |-
      <p>Yep: Versa Sans Normal by Peter Verheul. An OurType(face).</p>
      <p>The G reminded me of Quadraat Sans but that wasnt it, so I followed my instinct to see and find out what other more recent faces were done bt Fred Smeijers and friends. Found it on the excellent OurType site.</p>
      <p>Versa was on the Our Favorite Fonts of 2004 list of Typographica: <a href="http://typographi.com/000969.php">http://typographi.com/000969.php</a></p>
      <p>Designer Peter Verheul has a nice site with an overview of his type designs and other work:<br>
      http://www.farhill.nl/01_typefaces/index.html<br>
      Farhill being a literal translation of his surname into english.</p>
