    <div class="info">Submitted by <a href="/user/7006" title="View user profile.">paul d hunt</a> : 18.Aug.2008 3.52pm </div>
      <p>Warm Summer Greetings!</p>
    <p>As we rush to cram in the last fun of Summer, we delight in some fresh new arrivals at Font Bros!</p>
    <p>Pink Broccoli - Our friends at Pink Broccoli have been very busy creating some hip mod style 1960s typefaces you’re sure to dig! Check ’em out at: <a href="http://www.fontbros.com/pink_broccoli_new.php" title="http://www.fontbros.com/pink_broccoli_new.php">http://www.fontbros.com/pink_broccoli_new.php</a></p>
    <p>Harold’s Fonts - Harold has expanded his ever popular collection of rubber stamp style fonts with the Charter Family you’re sure to love! - Check ’em out at: <a href="http://www.fontbros.com/harolds_new.php" title="http://www.fontbros.com/harolds_new.php">http://www.fontbros.com/harolds_new.php</a></p>
    <p>Fontalicious - We continue to bring back even more great Fontalicious classic fonts updated in OpenType! - Check ’em out at: <a href="http://www.fontbros.com/fontalicious_new.php" title="http://www.fontbros.com/fontalicious_new.php">http://www.fontbros.com/fontalicious_new.php</a></p>
    <p>Plenty of great new additions this month and a load more on the way! Check ’em out and tell your pals!</p>
    <p><a href="http://www.fontbros.com" title="http://www.fontbros.com">http://www.fontbros.com</a></p>
    <p>Warmly,<br>
    Mike &amp; Stuart<br>
    The Font Bros</p>
