  html: |-
    <p>Hello everyone,</p>
    <p>I am working on a cool information design project that relates the 1906 earthquake refugees to the current Katrina diaspora, in commemoration of the 100 year anniversary in SF. I am looking at many different typographic options, but am also considering using a face that was actually in use in the west during that time. Any help with this endeavor would be most appreciated, most of my work is contemporary, so I would love to hear some suggestions from those who are familiar with this era. </p>
    <p>I should also mention that this exhibition will be mounted in an actual earthquake refugee shack, several of which still exist here in the city, orginally designed by SF Park Superintendent John McLaren with the Dept. of Lands and Buildings of the San Francisco Relief Foundation, and the US Army. I want to avoid the obvious pitfalls that designers like Michael Schwab fall into (using Eagle for every project) since this effort predates any WPA project by 30 years. </p>
    <p>And finally, I am mostly searching for a display face, not for text. This exhibition will be on a city sidewalk, so it needs to be not only arresting but legible. </p>
    <p>Here is some more information if you are interested. This is the ugliest site but these are the folks who are paying for the exhibition. <a href="http://www.outsidelands.org/sw17.php" title="http://www.outsidelands.org/sw17.php">http://www.outsidelands.org/sw17.php</a></p>
    <p>Thanks.</p>
