      <p><cite>graphic/type design studios</cite><br>
      Arrange visits with Studio A, Design Army, and Grafik.</p>
      <p><cite>galeries</cite><br>
      Not much for type/design. But take advantage of the free art museums on the national mall. Drive (or take a train) to Baltimore and see the American visionary museum, the real gem of the area.</p>
      <p><cite>bookshops</cite><br>
      For a visitor there are no interesting bookstores left in the Washington area (especially if you’re used to good French bookstores). If you really love American politics you might want to try Kramer Books or Politics and Prose. Second Story Books at 22nd and P in NW Washington sometimes has good used books at prices far cheaper than most stores, and now that I have left town nobody is buying up all his design books.</p>
      <p><cite>foundries</cite><br>
      There are none.</p>
      <p>You can try connecting with the <a href="http://aigadc.org/">DC AIGA</a>. Business in DC slows almost to a halt between the middle of November and the middle of January, so this is a good time to connect with people, but make appointments in advance as many people will be on vacation.</p>
