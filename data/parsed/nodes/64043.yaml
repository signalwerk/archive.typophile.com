    <p>Hello,</p>
    <p>I am a french type and graphic designer recently arrived in Washington DC, and in few weeks, I will be allowed to work in the USA.<br>
    So, I am looking for any contact related to graphic/type design studios, galeries, bookshops, or foundries in DC area.<br>
    I need to know more about graphic design culture here so if anybody could help me, I would be pleased.</p>
    <p>I have already had a look on this topic:<br>
    <a href="http://typophile.com/node/31239" title="http://typophile.com/node/31239">http://typophile.com/node/31239</a></p>
    <p>Thanks in advance!</p>
