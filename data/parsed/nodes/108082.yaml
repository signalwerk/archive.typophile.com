  html: |-
    <p>For a traditional 3 initial monogram, is the following a proper structure?</p>
    <p>Left letter - first name initial<br>
    Right letter - middle name initial<br>
    Central letter - last name initial, usually larger than the left or right</p>
    <p>Does that sounds about right?</p>
