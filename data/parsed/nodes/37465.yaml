    html: <p>You may have heard the phrase “A camel is a horse designed by a committee.” Perhaps that sentiment can be applied to OpenType as well. Within the overall standard exists the work of a great number of engineers, ratified by businessmen. The fact that both TT and CFF outlines are supported is one area, but there are many others.</p>
