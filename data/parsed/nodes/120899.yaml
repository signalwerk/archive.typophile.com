      <p>Maybe it's an issue of not understanding the history of the notation? As a child, it took me ages to realise that the Swedish equivalent of this (75:–) was a shorthand for 75:00, and I'm guessing it's even more opaque now that the subdivisions of the krona no longer come in coins.</p>
      <p>Am I wrong to think it's sort of exciting, the different variants? Hand drawn shorthands are, after all, the source of a lot of interesting symbols, not least the amersand; I can well imagine the last variant turning into a ligature at some point, especially as subdivisions grow rarer with inflation.</p>
