      <p>Traditionally, an em dash (or two en dashes) was used to replace zeros in printed price lists:<br>
      10,— for 10,00<br>
      —,90 for&nbsp; 0,90<br>
      In metal fonts, (tabular) figures typically were half an em in width.</p>
      <p>Jürgen is right in that the modern (German) practice uses en dashes. Price notation styles are different from country to country, though. See also <a href="https://www.flickr.com/search/?tags=pricenotation&amp;sort=relevance&amp;user_id=52362783%40N00" rel="nofollow">these pictures</a>.</p>
