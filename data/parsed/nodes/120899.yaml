    <p>So, I keep seeing different price notations on posters at the metro stations and they often frustrate me. Now I just want to verify that there is logic behind my frustrations, in that I want to verify whether the other notations are simply incorrect or perhaps the rules to the notations differ per country, but I suppose all the same I shouldn't be seeing different notations in the same country. Here's an image to illustrate the different things I've seen:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Price notation_5993.jpg"></div><p></p>
    <p>The first notation frustrates me because a hyphen is used, the second frustrates me even more because the hyphen is spaced in such a way that from a distance it looks like a semicolon; the third is correct and the fourth frustrates me because I just don't understand why the dash needs to be spaced over the comma. I suppose it's not necessarily a rational objection but an emotional one.</p>
