    html: "<p> e: el rulo de la “e” debería resolverse de forma descendente, y no de la manera realizada. tal vez se pierda la “gracia” que has querido asignarle, pero no es correcta la forma actual de la letra “e”, no se uniﬁca con las demas, del sistema. <br>e: the roller of the “e” would have to be solved of descendent form, perhaps and of the made way the “grace” is not lost that you have wanted to assign to him, but is not correct the present form of the letter “and”, is not uniﬁed with others, of the system.  <br><br>w: está muy comprimida en su base. <br>w: its very compressed in your base. <br><br>L: ésta letra podria llevar en su base el mismo serif que se insinúa en la letra “a” .  <br>L: this letter could take in its base same serif that is insinuated in letter “a”.  <br><br>a: esta letra es una de las que mas identidad le otorga a “latina”, deberías pensar como transladar estas cualidades formales a las demás. sobre todo deberías prestarle atención al bastón horizontal de la misma. <br>a: this letter is one of which but identity “Latin” grants to him, you would have to think as to transfer these formal qualities to the others mainly you would have to pay attention to him to the horizontal cane of the same one. <br><br>saludos!&nbsp;;)&nbsp;sebas </p>"
