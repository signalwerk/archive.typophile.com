    html: <p>Ale - This is your finest and most mature work yet.  <br> <br>I'm impressed that you've managed to work decent-sized <br>accents into a face with a pretty large x-height, although it  <br>could be a problem at smaller sizes (hard to tell on-screen  <br>what 9 pt. would look like).  <br> <br>I also dig the alt characters, but I don't quite buy the 'e'  <br>for the roman yet. Needs more balance somehow.  <br> <br>The stroke contrast is nice. Overall, it's a clean sans with  <br>the organic feel of the pen. Very lovely.  <br> <br>I like the italic best - let's see more of it. <br> <br>P.S. Very sneaky with the  <br>propaganda-laced specimen  <br>text. I'm with you.</p>
