      <p>*takes out dunce hat and places on head while walking to the corner stool*  </p>
      <p>The tutorial I was following had </p>
      <p>feature rlig { # Required Ligatures<br>
      script arab; # Arabic<br>
      lookupflag IgnoreMarks, RightToLeft;<br>
      sub lam.isol alef.isol by lam_alef.isol;<br>
      ...<br>
      sub lam.fina alef.isol by lam_alef.fina;<br>
      ...<br>
      } rlig;</p>
      <p>Even though you mentioned it should be media it just slipped right by me.  Now I've got it working.  Now as to whether I got everything properly designed, that's another question haha.  BTW, I'm actually using FontForge, it's not too hard to convert the syntax.  For posting for a critique on an arabic font is the critique section better or the special interest group?</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
