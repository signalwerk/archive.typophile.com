    html: |-
      <p>Since the lam_alif ‘ligature’ is a required form, the lookup should be located in the Required Ligatures {rlig} feature.</p>
      <p>In Arabic OT shaping, positional form substitutions are applied first, so ligature input glyphs need to be appropriate positional forms:</p>
      <p>lam.init alif.fina -&gt; lam_alif<br>
      lam.medi alif.fina -&gt; lam_alif.fina</p>
      <p>If you've done the above and it doesn't work in your test app, then your test app doesn't support Arabic OpenType.</p>
