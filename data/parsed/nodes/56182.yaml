    <p>What is the optimal way to handle the lam_alef ligatures?</p>
    <p>No matter how I do it, the ligature doesn't show up, although all my Latin/Greek ligatures do.  If I type lam, then alef, they connect as if they were any other letters in the alphabet.  In FontForge everything shows up okay.</p>
    <p>I admit it may be my program to edit with (TextEdit) since I don't have InDesign ME, but the ligature substitution seems to work okay for other OTF fonts in TextEdit.  All other substitutions appear okay.</p>
