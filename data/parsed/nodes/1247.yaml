    html: "<p>&gt; Aliasing always works. <br> <br>Even for dynamic text? I guess like \"normal\" Flash font embedding, characters you <i>haven't</i> elected to embed simply don't show up if typed? <br> <br>&gt; It does not appear to support grayscale fonts <br> <br>How did you test this? Did you make some with BitFonter? Assuming you did: So these fonts worked directly in the OS, but not Flash? <br> <br>&gt; grayscale fonts ... can be used as before with the antialiased setting. <br> <br>But that's just stuff rendered from [de-hinted] outlines, right? <br> <br>Sorry for the grilling!  :-) <br> <br>hhp <br></p>"
