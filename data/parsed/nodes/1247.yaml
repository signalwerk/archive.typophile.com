    html: <p>As for Photoshop, I don't know what's going on there. The Mac grayscale bitmap I made only sort of works in Photoshop 7 in OS 9 (it comes out somewhat distorted) and not at all in OS X. As far as I know, Photoshop uses its own rendering engine for type, not the host OS's. Hey, if you really want the grayscale font in Photoshop, just set it in Word, do a screen capture, and paste it in. ;-) <br> <br>Grayscale bitmap fonts do offer some advantages, but support is a real mixed bag. I'm not planning to spend a lot of time on them myself.</p>
