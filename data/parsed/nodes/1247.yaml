    html: "<p>The upper ascii characters won't work in my demo because only the basic stuff is embedded. Just as before, you have a choice of which characters to include. For the demo I only included the basic A-Z, a-z, numbers and puncuation--about 95 characters. If I get a chance, I'll do another one with more characters included. <br> <br>About the remaining questions: <br>1. Aliasing always works. Apparently, Flash creates an internal bitmap font at the size requested, even if the source font has none. <br>2. It does not appear to support grayscale fonts :-( although they can be used as before with the antialiased setting. <br>3. As I said, I had some luck with fonts that only have bitmaps, but so far the results are inconsistent. <br> <br>I don't think it means the death of pixel fonts, but it does offer a larger range of solutions. See Craig Kroger's message near the end of the page I linked to above.</p>"
    html_clean: "<p>The upper ascii characters won't work in my demo because only the basic stuff is embedded. Just as before, you have a choice of which characters to include. For the demo I only included the basic A-Z, a-z, numbers and puncuation--about 95 characters. If I get a chance, I'll do another one with more characters included. <br> <br>About the remaining questions: <br>1. Aliasing always works. Apparently, Flash creates an internal bitmap font at the size requested, even if the source font has none. <br>2. It does not appear to support grayscale fonts :-( although they can be used as before with the antialiased setting. <br>3. As I said, I had some luck with fonts that only have bitmaps, but so far the results are inconsistent. <br> <br>I don't think it means the death of pixel fonts, but it does offer a larger range of solutions. See Craig Kroger's message near the end of the page I linked to above.</p>"
