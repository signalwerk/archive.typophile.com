    html: "<p>Okay, I tested it in FlashMX 2004 on OS X. Not surprisingly, since OS X doesn't support grayscale bitmap fonts, it didn't work. By that I mean the font does not display correctly at all, much less take advantage of the new aliasing feature.  <br> <br>(OS 9 <i>does</i> support grayscale bitmap fonts, but FlashMX 2004 doesn't run on OS 9. The grayscale bitmap font I tried <i>does</i> show up in FlashMX, but disappears when you close out the text box or the movie is published. No surprise there.)  <br> <br>If anyone out there is using the Windows version of FlashMX 2004, here's a Windows TTF grayscale font you can use to try it out: <br> <br><a href=\"http://www.ms-studio.com/FeltTipGray18.zip\" target=\"_blank\">http://www.ms-studio.com/FeltTipGray18.zip</a></p>"
