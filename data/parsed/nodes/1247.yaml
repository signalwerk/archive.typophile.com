    votes: null
    html: "<p><i>&gt; Aliasing always works.  <br>  <br>Even for dynamic text? I guess like \"normal\" Flash font embedding, characters you haven't elected to embed simply don't show up if typed? </i> <br> <br>Yes and yes. <br>  <br><i>&gt; It does not appear to support grayscale fonts  <br>  <br>How did you test this? Did you make some with BitFonter? Assuming you did: So these fonts worked directly in the OS, but not Flash?</i> <br> <br>I deduced this from the fact that the \"grayscale\" fonts being produced for use with Flash depend on its normal antialiasing in order to work. When you turn aliasing on, you are defeating this feature, therefore the trick won't work. I haven't actually tested this hypothesis or anything, which is why I included the words \"appear to\" in my statement. Still, I would be surprised if I am wrong about this.  <br> <br>I have not tried using grayscale bitmap fonts made in BitFonter. I don't know if those work with Flash, but I'm doubtful. In my demo, for example, the bitmap fonts only show up when aliasing is switched on. If you turn aliasing off, the bitmap fonts disappear. If there is an outline font, that's used. If not, the field goes blank. Flash simply ignores bitmap fonts unless aliasing is on, but that also forces the pixels to be only on or off. Also, from what I've read (see the link above again), it appears that Flash actually embeds bitmap objects rather than using the host OS's bitmap font facilities. Embedded outline fonts are handled similarly. They are not fonts so much as collections of outline objects like any other in the symbol library.  <br> <br>It might be worth a try, though. Just to be sure. <br> <br><i>&gt; grayscale fonts ... can be used as before with the antialiased setting.  <br>  <br>But that's just stuff rendered from [de-hinted] outlines, right?</i> <br> <br>Exactly. So you would still have the same problems if you try to use them for dynamic text as before.</p>"
    html_clean: "<p><i>&gt; Aliasing always works.  <br>  <br>Even for dynamic text? I guess like \"normal\" Flash font embedding, characters you haven't elected to embed simply don't show up if typed? </i> <br> <br>Yes and yes. <br>  <br><i>&gt; It does not appear to support grayscale fonts  <br>  <br>How did you test this? Did you make some with BitFonter? Assuming you did: So these fonts worked directly in the OS, but not Flash?</i> <br> <br>I deduced this from the fact that the \"grayscale\" fonts being produced for use with Flash depend on its normal antialiasing in order to work. When you turn aliasing on, you are defeating this feature, therefore the trick won't work. I haven't actually tested this hypothesis or anything, which is why I included the words \"appear to\" in my statement. Still, I would be surprised if I am wrong about this.  <br> <br>I have not tried using grayscale bitmap fonts made in BitFonter. I don't know if those work with Flash, but I'm doubtful. In my demo, for example, the bitmap fonts only show up when aliasing is switched on. If you turn aliasing off, the bitmap fonts disappear. If there is an outline font, that's used. If not, the field goes blank. Flash simply ignores bitmap fonts unless aliasing is on, but that also forces the pixels to be only on or off. Also, from what I've read (see the link above again), it appears that Flash actually embeds bitmap objects rather than using the host OS's bitmap font facilities. Embedded outline fonts are handled similarly. They are not fonts so much as collections of outline objects like any other in the symbol library.  <br> <br>It might be worth a try, though. Just to be sure. <br> <br><i>&gt; grayscale fonts ... can be used as before with the antialiased setting.  <br>  <br>But that's just stuff rendered from [de-hinted] outlines, right?</i> <br> <br>Exactly. So you would still have the same problems if you try to use them for dynamic text as before.</p>"
