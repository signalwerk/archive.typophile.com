    html: "<p>&gt; that also forces the pixels to be only on or off. <br> <br>How do you know, without testing it with embedded grayscale bitmaps? It's possible Flash simply uses whatever image-of-character the OS gives it, which could be a grayscale rendering. <br> <br>&gt; Flash actually embeds bitmap objects rather than using the host OS's bitmap font facilities. <br> <br>Yes, but it sounds like it's initially getting the bitmap renderings from the OS (the way Pyrus FONMaker works). <br>This, in order to avoid: <br>1) Reinventing all the -patented, mind you- rendering code; <br>2) Maintaining all the hinting/embedding in the font within the movie for eventual real-time rendering, which would make filesizes much bigger. <br> <br>I'm hopeful. <br> <br>hhp <br> <br></p>"
