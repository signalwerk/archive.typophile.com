  html: "<p>FlashMX 2004 was released yesterday. It has several new features that will be of interest to makers or users of \"pixel\" fonts, fonts designed to overcome Flash's text anti-aliasing.  <br> <br>The most obvious thing is that there is now a button to turn antialiasing <i>off</i> for selected text. <br> <br>After playing around with the Mac version last night and this morning, I have discovered the following: <br> <br>- Pixel fonts, such as those from Atomic Media, work just as well as before, if not better. <br> <br>- It is no longer necessary to set horizontal and verticle text box coordinates to whole numbers to prevent \"blurring.\" The same goes for centered or flush right text and tracking, which used to be no-no's. <br> <br>- Pixel fonts may be embeded for use in \"dynamic\" or \"input\" text boxes with no ill effect. Earlier versions of Flash had a bug which caused such fonts to blur somewhat. The work-around was to set the quality level for the movie to \"low,\" but this caused <i>everything</i> in the movie to be aliased--not usually the desired effect. <br> <br>- In certain cases (I'm still testing this), Flash will use bitmap fonts when they exist. For example, my Anonymous font is a TrueType font with bitmaps embedded for 8, 9, 10, and 11 ppm. When these sizes are used, and antialiasing is turned off, the embedded bitmaps are used. <br> <br>- Even more amazing, Flash now appears to support bitmap fonts which <i>don't</i> have corresponding outline fonts. Again, I'm still testing this. So far the results are encouraging, but inconsistent. <br> <br>- Although not bearing directly on pixel fonts, Macromedia seems to have fixed the bug which caused high-ascii character encoding to become scrambled when using PostScript fonts with Flash. <br> <br>All in all, it seems like the situation has improved drastically for people who want to use aliased text in Flash. It also appears that the situation has improved for font makers as well, giving us more flexibility in the way of format, and perhaps making some of the tricks that were necessary before obsolete. <br> <br>I will continue to try things out and report anything else I find. If anyone else has been doing the same, post your findings here.</p>"
