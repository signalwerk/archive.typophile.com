      <p><a>How does one increase/decrease the leading from a font inside FontLab?</a></p>
      <p>This has to do with you vertical metrics. Hopefully the wiki entry called <a href="/wiki/Vertical%20Metrics%20How-To" class="freelinking" rel="nofollow">Vertical Metrics How-To</a> can help you understand that a bit more. When I've exported invalid font files, it usually has to do with the fact that i haven't filled out all the naming information, but i suppose there are other problems that chould be the culprits. Have you tried running you font through Microsoft's <a href="/wiki/Font%20Validator" class="freelinking" rel="nofollow">Font Validator</a>?</p>
