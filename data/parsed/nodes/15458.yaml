    <p>Hello to all,</p>
    <p>I am currently designing a font, but I am stuck into a dilemma. Hopefully somebody can shed some light onto it.</p>
    <p>Everything has been done inside a PC. I generated the glyphs inside Corel Draw and then exported them to ttf. So far, so good. The file just needed some kerning and some proper layouting so all the glyphs lay on the correct Unicode squares inside FontLab.</p>
    <p>First, after a few -successful- exports of the file done in order to check the progress of the font, the resulting ttf file would not open: "not a valid file". OK, so I exported to .otf and things went fine. </p>
    <p>I am not yet finished, but why is it that the exported .otf file behaves so differently in the programmes I have tested it with?<br>
    . Inside InDesign (CS2) the leading looks too squashed down and it appears that the font is misplaced along the baseline (see image: the black lines show selected text, which should normally be covered all in black, not just a part of it). </p>
    <p>. Inside Corel Draw (12), the font looks just OK, but the space between words vanish completely, so I end up with some boustrophedon-like text. Even if I manually enter extra spaces, they won't show, as if the space glyph had 0-value sidebearings. (image)</p>
    <p>- Inside MS Word (XP), the font looks with decent leading, decent inter word spacing, although horribly displayed on screen (image).</p>
    <p>-When exported to PDF inside each programme, the ones from InDesign and Word look OK, but the one from Corel won't show the interword spaces still (see other images).</p>
    <p>All of the graphic samples are taken with default leading/kerning for each programme. Kerning &amp; leading processes are not yet finished in FontLab.</p>
    <p>So how can I correct all this? Why does it look like I have got three different fonts, depending on which software I use? Normally Word does a horrible task at displaying fonts, but InDesign &amp; Corel make a beautiful font rendering &amp; typesetting. I suppose the issue resides on how I am handling the font inside FontLab, but that's why I am asking for advice.</p>
    <p>................</p>
    <p>And a couple more questions:</p>
    <p>How does one increase/decrease the leading from a font inside FontLab?</p>
    <p>Any comments/suggestions on the overall look of the font? It is supposed to lightly convey a flair of Spain during the XVI Century, but with a fresher look to it. It will be used for the making of a book.</p>
    <p>I have got a dateline for this project, and I still have to export the italic version, so the hastier the answers, the better.</p>
    <p>Thanks a lot,<br>
    Mosh</p>
