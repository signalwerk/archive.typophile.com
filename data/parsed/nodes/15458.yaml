      <p>[Dan puts on his moderator's hat…]</p>
      <p>Hey Typophiles,</p>
      <p>Can we (respectfully, of course) prove Miles incorrect here? Let's try and give Viejo some advice…</p>
      <p>Viejo, I'm a novice at font design and production, and I have never, ever worked with Correll Draw, but I'll do my best here.</p>
      <p>I don't know what to suggest about inter-word spacing. I would try to set the space glyph right inside FontLab. Somehow, I don't trust Correll…</p>
      <p>The leading has something to do with the Em Square, and the length of your ascenders and descenders. A font does not have real "leading values," nor can that be set or reset in FontLab, other than by changing letter proportions inside of the Em-Square's grid.</p>
      <p>The reason that your font displays so poorly inside MS Word is most likely because it is not hinted, or it has been auto-hinted (and that auto-hinting wasn't adequate). In order to get your font to display nicely onscreen in MS-Word, it'll have be superbly hinted (mean TrueType Delta hinting, I guess). That is hard work that is not normally done on display faces (and your faces seems to be more in the display direction than strictly "text." I don't mean this in a negative way!)</p>
      <p>To get a Design crit, try posting PDFs of your design—with text settings—in the Critique forums. I'm going to make your thread title more direct, and bump it to the Typophile home page to see if you can get any better tips than mine!</p>
