      <p>I'll bet he's using Chrome.</p>
      <p>Me too, but I flip the runtime switch to get it to read TTF/OTF fonts just fine, which works pretty well.</p>
      <p>That being said, I've seen spotty behavior from TypeKit @font-face even in an environment where it ought to be pretty flawless: FireFox 3.5 (latest dot) on Windows XP. Not sure why, but there are plenty of subtleties in @font-face implementation, so I don't know that I should gripe too loudly when it doesn't work perfectly all the time, yet.</p>
      <p>Cheers,</p>
      <p>T</p>
