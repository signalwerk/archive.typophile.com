      <p>&gt; What’s the point of showing this list to a site visitor if it’s guaranteed that it will not show right ?</p>
      <p>Look — this @font-face thingy is not going to work at all on non-compliant browsers, or very well in user environs set to alias type. If one does not want to upgrade or poke ones preferences into line, one must read the bright red sign at the top. </p>
      <p>Not showing anything is anti-web, and showing a completely different page is probably useless. </p>
      <p>Cheers!</p>
