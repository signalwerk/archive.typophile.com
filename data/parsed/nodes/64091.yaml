    date_raw: 11 Nov 2009 — 11:30pm
    votes: null
    html: |-
      <p>But what is being displayed is content, i.e text, and what you are getting is the expected fallback behaviour for text display in a browser that does not support served fonts. It is only the fact that in this case the content is also intended to be a specimen of served fonts that makes it seem peculiar. What you are seeing is normal, expected and a pretty good demonstration of what your browser will do when it encounters served fonts in the wild (only in the wild, you won't get any warning that the text is not displayed as intended).</p>
      <p>Your car metaphor doesn't make sense to me. If the content of the text were being changed, then a parallel to a semantic distinction such as a left/right indicator would be appropriate, but the content is not being changed, it is only being displayed with a fallback font. The correct parallel would be an arm waved out the window in place of an indicator, with both the indicator and the arm indicating the same direction.</p>
