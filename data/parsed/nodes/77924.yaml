    html: "<p>I can't think of any off the top of my head, but you can try finding Type: A Visual History of Typefaces and Graphic Styles, Vol. 1 by Jan Tholenaar and Alston W. Purvis. They might have examples of a few. You might have to make your own after you check out that book.</p>"
