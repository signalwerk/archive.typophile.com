  html: |-
    <p>Hello,</p>
    <p>I am currently designing a poster for a play which is set in 1832 London (pre-victorian period). </p>
    <p>Does anyones know of any interesting and accessible typefaces I could use. I have already experimented some standards such as Baskerville, Garamond, Caslon and Plantin. I'm looking for more of an interesting typeface then the ones mentioned – more decorative and expressive if poss. </p>
    <p>Any ideas???</p>
    <p>Thanks, James</p>
