    <p>a historical query: I'm looking for the earliest creation of a 5 dot by 8 dot pixel font. i noticed <a class="freelinking external" href="http://www.kare.com/MakePortfolioPage.cgi?page=4" rel="nofollow">Susan Kare's beautiful fonts from 1984</a> but none of them are 8 pixels tall. again, i'm looking for pixel fonts, nothing curved or anti-aliased. attached is an image of what i'm looking for. any suggestions?</p>
