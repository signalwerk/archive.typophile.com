      <p>Hi l---l,</p>
      <p><cite>a historical query: I’m looking for the earliest creation of a 5 dot by 8 dot pixel font</cite></p>
      <p>Maybe there are examples that are <em>a lot</em> older … imagine cross-stitch embroidery or mosaic works?<br>
      There is a publication on ‘the assembled character’ – <a href="http://www.signographie.de/cms/front_content.php?idart=67" rel="nofollow">Das gefügte Zeichen</a> (SIGNA Nº 10) by Nina Stößinger. However, I can’t recall if it explicitly contains examples of a 5×8 units face; and it’s in German, of course. It might be a great read for you anyhow.<br>
      F</p>
