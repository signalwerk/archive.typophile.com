    html: |-
      <p>&gt; Space between letters is important too, no?</p>
      <p>Correct. But at that time 3 decades ago (starting in 1977 with Apple I), the dot matrix referred to the visible dot matrix only, because the text characters were generated by hardware, a so-called type 2513 character generator. The old Apple II manual says on page 96: "The seven rows in each character are scanned by VA, VB, and VC signals, and the output of the character generator is serialized into a stream of dots by a 74166 at location A3. This bit stream is routed to an exclusive-OR gate..." Am I to continue this Wozniak jargon?</p>
    html_clean: |-
