      <p>Hrant: No problem (please chuck out any moldy floppies!), and Arasan is *cool* (also quite interesting because on such a coarse grid, the smaller sizes especially seem to clear up a few structural questions I had about the Armenian alphabet). Thanks!<br>
      (Except your client is not offering the free download atm. :-| )</p>
      <p>Should I feel bad about hi-jacking this thread? It was dead before, right?</p>
