  html: |-
    <p>Due to typophile.com I found out how I can program an opentype feature for random contextual alternates. (If anybody is interested and didn´t find it yet: <a href="http://typophile.com/node/19625" title="http://typophile.com/node/19625">http://typophile.com/node/19625</a>)</p>
    <p>this is the code I found:</p>
    <p>feature salt {<br>
    lookup rotate {<br>
    sub @set_1 @set_1' by @set_2;<br>
    sub @set_2 @set_1' by @set_3;<br>
    sub @set_3 @set_1' by @set_4;<br>
    sub @set_4 @set_1' by @set_5;<br>
    sub @set_5 @set_1' by @set_1;<br>
    } rotate;<br>
    lookup rotate;<br>
    } salt;</p>
    <p>Yet, I wonder in which order I should put the charakter sets to make it work.<br>
    Do I have to do it like this: A, A.alt1, A.alt2, A.alt3, B, B.alt1, B.alt2, B.alt3<br>
    or rather A-Z, then A.alt1-Z.alt1 and so on?<br>
    Actually, the last example shows the way I did it, but it didn´t work exept that (logical enough) the liga feature I added before, doesn´t work anymore.</p>
    <p>Or is there a completely other way to arrange the glyphs?</p>
    <p>I ask this instead of just trying it because takes such a long time to re-arrange the glyphs. So, if anybody doesn´ t know the answer to my first question, but knows how to change the arrangement of glyphs fast,  I appreciate it, too.</p>
    <p>thanks a lot!</p>
