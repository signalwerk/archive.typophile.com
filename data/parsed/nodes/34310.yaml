    html: <p>A disproportionate amount of font problems I encounter end up being from vendors in the “abandonware” category. Vendors that are currently shipping fonts typically work to protect their reputation, as does any other software vendor. Foundries like Adobe can dedicate resources for testing. However, smaller designers sometimes must rely more on feedback from customers. My experience is that most foundries are very interested in resolving these sorts of issues quickly, because they don’t want to deal with similar complaints from multiple customers. If they can get a problem fixed early it won’t come up again. Sometimes with legacy fonts, these problems can be remedied by a simple rebuild in FontLab. Another issue is font vendors with large varied legacy libraries. I’ve noticed that fonts.com will sometimes sell parts of a PostScript font that contain suitcase references to the other parts of a family—technically orphans. This really a junky way to do things. They’re probably not focused on expanding their sales of PostScript fonts at the moment though. So, I guess as a generalization, ownership and a vendor’s pride in a quality product are probably the most important factors. I would contact them directly.</p>
