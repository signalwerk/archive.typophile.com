      <p>At the design agency where I am interning I was given the fonts I would need for working on projects for the particular client I am assigned to. However, I was given the entire family in about 10 seperate files. Some include only bold all caps and regular, some just book and book italic. Not to mention the font name is so long with the addition of the type style tacked on that I have to blindly click through them in InDesign, because all I can read is MetaPlusB (which could be “bold all caps”, “black”, “bold italic” or one of 4 others).</p>
      <p>Thank god they are changing their typeface after the re-arc.</p>
      <p>... _._. ... .. ... __.. ..._ ...</p>
