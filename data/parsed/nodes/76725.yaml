      <p>Thank you for answering me, jdagett. I'm experiencing a problem of kerning, not of rendering. Rendering &amp; kerning work wonderfully with, say, Constantia. Furthermore, the sample text you provided me with didn't include the relevant combination of characters (u+0423 CYRILLIC CAPITAL LETTER U and u+0431 CYRILLIC SMALL LETTER BE).<br>
      Anyhow, I'm glad to learn that at last we'll get a browser compliant with OpenType. At the Serbian Wikipedia we have long awaited for a solution that would make it possible to display the correct Serbian glyphs without resorting to non-standard proprietary fonts. Still, unfortunately support for Serbian glyphs is lacking in the world of free fonts, and MinionPro, one of the best candidates for usage in the Serbian Wikipedia, deceives us with such a gross flaw!!!</p>
