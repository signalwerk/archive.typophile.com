      <p>Version 2000 was the first version I tried and it its implementation of OpenType was particularly buggy and fickle. It did contain the Serbian glyphs but not in the expected position, therefore XeLaTex triggers didn't work so the glyphs at issue had to be accessed manually... a mess. Version 2004 ships with Acrobat Reader 9 and is way better but apparently still has kerning flaws. Does it constitute an offense if I ask you to mail me the 2010 version? Obviously only if the font can be freely distributed.<br>
      It is difficult for me to install a Windows program like CS5 because I actually use Ubuntu 10.10 and Wine (the compatibility layer) is a disaster as far as Creativity &amp; Office programs are concerned.<br>
      Anyway, thank you for having rescued me: now I know I just need an updated font.</p>
