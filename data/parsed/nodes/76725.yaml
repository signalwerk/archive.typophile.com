      <p>I was not aware Acrobat Reader ever provided Minion Pro. The 2.30 version was included in Fontfolio 11 (2007) and the 2.68 version came with Adobe CS5 (2010). Although it's commercially available, it will also be installed with any trial of Creative Suite 5. I found my old version 1.1 file, from 2000, and it does not includes uni0431.ital (version 2.68 has 443 more glyphs than version 1.1).</p>
      <p>If you plan to use it at web, the new technologies to embed fonts would allow your users to see the updated version – so the problem will not occur. If you need it for print, you can edit the font and fix the kerning (Adobe EULA permits it) or simply get an updated file.</p>
