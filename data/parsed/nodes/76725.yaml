    <p>First of all I didn't find a "New Users" forum so I just wanted to say hello everybody first.<br>
    Now, back to my question: I use Minion Pro with XeLaTex in order to get Serbian localized glyphs which otherwise neither OpenOffice Writer nor Microsoft Word would provide me with. But I get a tight kerning when the letters u+0423 CYRILLIC CAPITAL LETTER U and u+0431 CYRILLIC SMALL LETTER BE meet each other. Please notice that the tight kerning only happens with the localized Serbian glyph, while the standard (Russian) one doesn't show any kerning problem.<br>
    I attached a .pdf with the relevant example. Could you please suggest me a way to solve this annoying flaw in an otherwise wonderful font?<br>
    Thank you everybody.</p>
