      <p>Since it turned out the original logo is from 1985 it's probably a custom design to begin with, and even though Latin Wide might serve as a good starting point for making a custom design oneself, I'm really looking for a font that's much closer to the Day of the Dead logo as can be seen here <a href="http://www.impawards.com/1985/day_of_the_dead.html" title="http://www.impawards.com/1985/day_of_the_dead.html">http://www.impawards.com/1985/day_of_the_dead.html</a> or in the scan I posted.</p>
      <p>If I remember correctly the erosion is just a bad scan, the text was probably as clean as in the poster.</p>
      <p>I tried checking out Saracen on myfonts.com but there was no preview available, and the previews on typography.com were too small to tell how close to the target this one is, and the test drive function wouldn't let me enter any text of my own. Still, I got the feeling it might be closer to the target than Latin Wide.</p>
      <p>I guess what I'm really hoping for is a modern day font version based on the Day of the Dead logo. But thanks for taking the time, nevertheless.</p>
      <p>Cheers!</p>
      <p>m.</p>
