    html: |-
      <p>This movie is from 1985 and concluded Romero's Dead-trilogy.<br>
      He was however involved in the remake of "Night of the living dead" &amp; actually approached Tom Savini (who initially wanted to apply as a make-up artist for the original, but due to circumstances (I think army duty) didn't make it) personally for remaking his classic. In 2005 Romero made a fourth contribution to his trilogy (I am aware of the contradiction in my terminology BTW) called "Land of the dead".<br>
      If anyone should be interested ;-)<br>
      I've seen different fonts used throughout several posters &amp; covers for at least the "actual trilogy", but this was very common in those days. I've even seen promotion posters for "Alien" with an alien drawn on it that doesn't even resemble the one in the movie by a long shot. This was due to the fact that artists were often asked to do a poster without having seen anything or knowing anything about the movie except for the title.</p>
