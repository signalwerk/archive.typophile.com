  html: |-
    <p>I used this font for this *one word* in a logo long ago (possibly early-mid 2000s). I had the font in my system at the time, I did not alter it.<br>
    Note the irregularities in the "S", the not quite level bottom stroke on the "E" and of course the unusual "G".<br>
    Other font ID sources aren't tracking this. One came close with "Cordoba" but that's not it.</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/font-id/stagers300word%20copy_2.jpg" width="559" height="92" alt="">
