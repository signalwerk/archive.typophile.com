      <p><em>Joel</em><br>
      Absolutely there is a market for it. Lettering is custom. There has been a market for it for a very long time. Take a look at the work of <a href="http://jordan-metcalf.com/1865/468824/gallery/popular-mechanics-110th-edition" target="_blank" rel="nofollow">Jordan Metcalf'</a>, <a href="http://jessicahische.is/" target="_blank" rel="nofollow">Jessica Hische</a>, <a href="http://runawaylawyer.files.wordpress.com/2011/04/ge_logo_pos_blacknew.jpg" target="_blank" rel="nofollow">Doyald Young</a>, <a href="http://howdyjeff.com/#/Gallery/Letters/image_53535" target="_blank" rel="nofollow">Jeff Rogers</a> and <a href="http://www.danatanamachi.com/chalk/" target="_blank" rel="nofollow">Dana Tanamachi</a>. They've all done work for  companies such as General Electric (GE), McDonalds, New York Times, Tiffany, Tommy Hilfiger, Oprah, Popular Mechanics, etc. </p>
      <p>Lettering is a sub-category of graphic design which one can specialize in. I guess I would compare it to Journalism. You have Business, Fashion, Science, Art, etc.</p>
