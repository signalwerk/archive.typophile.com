      <p>The best way to sharpen leads is with sandpaper. Art supply stores used to stock a tool consisting of a flat bat-shaped piece of wood with a stack of bits of sandpaper on it that could be torn of piece by piece.</p>
      <p>The best about this method is that one could shape the lead in such a way that broad sweeps and sharp lines could be produced with one tool (if you get my drift).</p>
