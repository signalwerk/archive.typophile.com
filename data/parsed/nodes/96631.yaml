      <p>Of all things, I used to use mechanical pencils quite often, for incredibly detailed line drawings. In witness whereof, I had holders for leads ranging from 6H (cut the paper if you press too hard) to 6B (draw about a foot of line before needing resharpening). Amazingly, I pointed all of the leads with…a manual sharpener. I never felt that my work suffered, nor did the two juries who awarded me purchase prizes for my work.</p>
      <p>But that's just me…of all things…</p>
