    html: <p>I know this is an older post and you may have found a solution, but I too have sepnt countless hours looking for anything like the old Kroy pointers.  None exist that I can find.  I have 2 old ones...nursing them along as long as I can.  "Old Nick" must be the wisest man alive and shame on us for not seeing the world through his eyes...yeah that was sarcasm.  I am an architectural designer...been designing homes since 1977 and I still draw everything by hand.  Hate the cold world of CAD.... For those who recommend the .o5, .o7 mechanical pencils...for lettering and line weight nothing gets close to a sharpened lead.  If you can find the pointer portions and attach it to an electric eraser...that's the best I have found...but the drill idea ain't bad...some of those new real small battery powered units might just work.</p>
