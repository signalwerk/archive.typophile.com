    html: |-
      <p>re: So, why is a lead holder better than say a .5mm mechanical pencil,…</p>
      <p>It's one of those things that has to be experienced. One advantage is the ability to swap out leads of different hardness without fumbling around with fragile, hairlike leads or populating your draw full of bulky wood. They have a very different feel of weight than either wood or thin-lead mechanical pencils. There is also the nostalgia appeal. Just a few reasons off the top of my head.</p>
    html_clean: |-
