      <p>Wingdings.</p>
      <p>Actually, I just used Alegreya for a novel of a similar genre and thought it worked very well. A little more personality than the usual text faces, but it seemed to be the right kind of personality for a dark mystical race-against-death adventure. I had thought I was looking for something a bit constructed and artificial, and was actually surprised that something so calligraphic seemed the best fit.</p>
