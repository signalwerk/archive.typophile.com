  html: <p>So the latest blockbuster action-adventure-conspiracy-archaeology-history-religion-codes novel comes out.  And the typography is a little … well, bland.  If you want to make it look genuinely beautiful and pleasurable to read, but still in keeping with the genre, which typeface do you first reach for?</p>
