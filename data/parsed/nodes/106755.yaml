    html: |-
      <p>One of those horrible distressed typewriter faces from the grunge era of the ’90s. If it was hard to write, it should be hard to read.</p>
      <p>Seriously? Minion. As bland as possible, without being Times New Roman. There’s no saving blandity, you might as well embrace it.</p>
      <p>If you’re setting the special signed leatherbound edition, use Bembo. It feels old and classy yet very familiar, which is exactly what people want for a classed up version of literary drivel.</p>
