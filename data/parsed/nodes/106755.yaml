    html: |-
      <p>My first though would be to use comic sans. </p>
      <p>But then I realized that wouldn't be professional, so then I thought "I'd just turn down the job." But I realized we've set some marginally pornographic texts just because they were "scholarly," so that answer too would be unprofessional.</p>
      <p>Finally, I decided if I had to take on the job, I'd just assign it to someone junior to me, and let them have the nightmares.</p>
      <p>If I have to say it, my problem with Dan Brown is he just can't write. Actually an insult to comic sans; IIRC, some comic books were better written. Well, that's the best-seller market for you...</p>
