    html: |-
      <p>- I think Adobe applications (or at least InDesign) in the past had problems doing multiple substitutions. This may've changed since I looked at this.</p>
      <p>- Yes, it is possible to do multiple substitution with exception context in VOLT. There are no restrictions on EXCEPT contexts unless they should go before 'normal' ones.</p>
      <p>- VOLT can load and compile CFF fonts, but won't show any glyphs. People working on CFF fonts usually convert them to TTFs for VOLT work and when layout tables are ready just move them into final font as binaries.</p>
      <p>Thanks,<br>
      Sergey</p>
