      <p>No, it was Swiss 721 Medium. Now to be clear, there are no design differences worth mentioning—Swiss 721 is a Helvetica knockoff. But there <em>are</em> some slight differences in the advance widths, which make it impossible to get an exact match with Helvetica.</p>
