      <p>Florian emailed me less than an hour after I posted about this, so I am pretty sure he was first, yes.</p>
      <p>Good thing, too, because I already sent him his $200, so it would have been very unfortunate if I only realized now than Jan beat him! Congratulations to Jan on being first runner up. If he makes it to ATypI in Amsterdam I will gladly buy him a drink.</p>
      <p>I will be doing more thorough testing starting tonight, but so far it really does look like Swiss 721 Medium. At least, I have enough evidence to arrest and charge the suspect while I look for more, and I have paid Florian his reward. (Hmm, if I continue that analogy, I guess I should have waited for a conviction first.)</p>
      <p>I would love to talk more about the analysis and such, but as this is an active case and is expected to go to trial, I should wait until afterwards. Sorry!</p>
      <p>In this particular case, the font ID is only part of the puzzle, but it was the one that was giving me the most trouble. Given that I have two cases going right now, and they both have immediately looming deadlines, I couldn't afford to noodle on it further on my own. I am thrilled by the response! Thank you to everyone who contributed, not only Florian and Jan!</p>
