      <p>I can only confirm what Renko and Stephen said. I see nothing that could lead to another font than Helvetica. Squooshed surely but still Helvetica. To me, all differences and minor details are due to scanning process and original printing. That's also why I can't be 100% positive but still believe it is Helvetica.<br>
      Regarding PDF properties, can't explain why but don't think they should be taken in consideration. This is probably due to the OCR process used for scanning this document. When opening document under Ai, there's no text, only the scanned image.</p>
