      <p>(This system won’t permit nested blockquotes.)</p>
      <p>&gt; &gt; First, it’s important that the markup<br>
      &gt; &gt; languages of the web are spared from holding<br>
      &gt; &gt; all the typographic and presentational<br>
      &gt; &gt; information that we want to associate with<br>
      &gt; &gt; documents.<br>
      &gt;<br>
      &gt; I mean, the founding papas of the web didn’t<br>
      &gt; have the foresight to make all things<br>
      &gt; possible, so they started with no form, only<br>
      &gt; content. Now, where does one draw the line<br>
      &gt; between “some of the typographic and<br>
      &gt; presentational information” and “all of the<br>
      &gt; typographic and presentational information”?</p>
      <p>I keep being told to be extra-nice to David Berlow, because (I am also immediately thereafter told) he’s been “doing this forever” and none of the rest of us have. But his remark above is nonsense. It masquerades  as an expert’s posing an intractable question none of the peons had managed to think of before.</p>
      <p>HTML elements have explicit or implied semantics. The most useful distinction, which, contradictorily, is intrinsically presentational, is the classification of elements as either <a href="http://www.w3.org/TR/REC-CSS2/visuren.html#q5" rel="nofollow">block-level</a>; <a href="http://www.w3.org/TR/REC-CSS2/visuren.html#q7" rel="nofollow">inline</a>; or, for a rare subset of elements (<code>iframe</code>, <code>del</code>, <code>ins</code>), either. Block-level elements act like paragraphs (notionally, with a carriage return before and after) and inline elements fit inside lines.</p>
      <p>These categories are, however, overridable with CSS, as via <code>display: inline</code> and <code>display: block</code>. (That’s how standards-compliant Web pages style navbars – unordered lists, a block-level element – as nice little rows of words you can click.)</p>
      <p>Now, in principle every single element in HTML can be styled in other ways, and the other ways germane to this discussion involve font, size, leading, and foreground and background colour. Indention can be styled for some elements. A small number of elements are hard to style  (<code>abbr</code>/<code>acronym</code>, <code>q</code>, <code>button</code>, <code>fieldset</code>/<code>legend</code>), but those are due to browser bugs, not flaws in the spec.</p>
      <p>In short, then, dberlow, the answer to your question is as follows: The dividing line is <em>right where we’ve been telling you it is all along</em>, between HTML (structure) and CSS (presentation).</p>
      <p>Purely presentational elements (not a misprint) like <code>font</code> and <code>center</code> simply aren’t used in standards-compliant authoring. An additional grey area comes up with other purely presentational elements, namely <code>b</code>/<code>i</code>/<code>u</code>, whose application in the context of Web standards used to be debated quite a bit. Now people know that you can use those elements if you are, for example, transcribing a(n) historical text that uses bold, italics, or underline in a way that other elements, like <code>cite</code>, <code>em</code>, or <code>strong</code>, cannot capture. These borderline edge cases do not vitiate the explicit principle, at work every minute of the day on the Web and easily learned by Googling or reading any of a dozen books, that HTML marks up page structure and CSS specifies appearance. This is noncontroversial and it’s tiresome to have to beat this dead horse.</p>
      <p>—<br>
      Joe Clark<br>
      <a href="http://joeclark.org/" title="http://joeclark.org/">http://joeclark.org/</a></p>
