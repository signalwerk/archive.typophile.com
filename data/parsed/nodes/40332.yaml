      <p>Technologies usually don't go away completely, but their use tends to become more specialized as they are replaced. The paperless office is actually a good example. Sure we still use printers, and there is still paper around the office, but they are used very differently. Paper now tends to be very temporary. It is almost always a copy of something that already exists in digital form. It may be a handout for a meeting, or a note to be thrown away, but it's rare that people have binders and filing cabinets full of things they intend to keep. More often for that type of thing you hear "can you send me a digital copy?". What's more, that transition is far from over. Offices are still populated by "digital immigrants". The new generation of natives use the technologies very differently, and they certainly aren't printing out everything they read like the old folks.</p>
      <p>Another good example of this would be handwriting itself. Whereas handwriting used to be used for everything, it was replaced in large part by printing. It was replaced further by typewriters and morse code. Computers, personal printers and email further relegated it to a niche purpose. Texting and t9 have even replaced it for notes passed under the desk in junior high school. Now it's rare that we use handwriting to communicate with anyone but ourselves, rarely over distances, and almost never archivally. Sometimes it serves a nostalgic or ceremonial purpose, like for handwritten thank you notes.</p>
      <p>Interestingly, the same thing happens with words as they are replaced by new ones: the old words take on more specialized meanings.</p>
      <p>As for a date where printing will be gone from the face of the earth: probably never. As for a date where it started to fade, just look at the sales charts for paper newspapers, paperback books and annual report design, to name a few. Moving forward the act of stamping ink on paper will likely fill a niche purpose, at best for something useful or artistic, at worst for nostalgia alone. Unfortunately there will be typographic quality lost in the translation (ie that last 20%), especially at first.</p>
