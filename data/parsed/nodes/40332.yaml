      <p>&gt; <em>What is the name of a font family? Is it «Minion Pro Cond Capt», «Minon Pro», or both?</em></p>
      <p>It depends whom you ask. If it’s a Windows system, the font family will be «Minion Pro Cond Capt». That’s because a Windows-family can only have up to 4 fonts, so the “Minion Pro” family had to be broken into sub-families of up to 4 elements.<br>
      If you ask a Mac system, the font family will always be «Minion Pro», independently of how many elements the family is composed of.</p>
      <p>That’s why MSNameID1 ≠ MacNameID1, for font families with more than 4 elements*. In these cases, two more Microsoft platform name strings are added to the fonts, MSNameID16 and MSNameID17, so that you get,<br>
      MacNameID1 = MSNameID16<br>
      MacNameID2 = MSNameID17</p>
      <p>* MacNameID1 = MSNameID1 in one of the Windows sub-families</p>
