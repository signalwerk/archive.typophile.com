      <p>joeclark: <em>I would like to know how I prevent a word from being hyphenated in Prince, for example</em></p>
      <p>Here is one way. In your style sheet you have:</p>
      <p><code>.foo { hyphens: none }</code></p>
      <p>In you HTML/XML document you have:</p>
      <p><code>&lt;span class='foo'&gt;Thiswordisnothyphenated&lt;/span&gt;.</code></p>
      <p>You can read more about it in the proposed specification, and in the Prince documentation:</p>
      <p><a href="http://www.w3.org/TR/css3-gcpm/" title="http://www.w3.org/TR/css3-gcpm/">http://www.w3.org/TR/css3-gcpm/</a></p>
      <p><a href="http://www.princexml.com/doc/6.0/properties/" title="http://www.princexml.com/doc/6.0/properties/">http://www.princexml.com/doc/6.0/properties/</a></p>
