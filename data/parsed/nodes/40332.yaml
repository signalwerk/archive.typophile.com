      <p>Yeah, but you’re doing it wrong if you start with styled text in an unpublished format (like MS Word, Quark, or InDesign) <em>and then</em> try to output to HTML. Your result will be tag soup and will be unusable on any modern site.</p>
      <p>I have had more-than-satisfactory results with a workflow of valid HTML → MS Word → InDesign → tagged PDF. I start with and end up with published, accessible formats, and one of the intermediate formats lets me twiddle with typography and page layout to my heart’s content. (It bothers me that InDesign cannot simply inhale a valid [X]HTML file directly.)</p>
      <p>I feel I am reasonably informed on the topic and I am pretty sure that even Prince would not do what I want. Typesetting a single page that varies its number of columns is punishingly difficult in CSS yet readily achieved in InDesign, for example. Then there are the issues of ligature substitution, swash characters, and <em>real</em> H&amp;J. (Hyphenation is rather glossed over in the video; it’s viewed as being present or absent. I would like to know how I <em>prevent</em> a word from being hyphenated in Prince, for example.)</p>
      <p>Even if John is right, the baseline has been raised. For Prince to achieve 80% of InDesign is a much taller order than PageMaker’s achieving 80% of whatever came before it. (And if that was 80% of the crapola CompuGraphic photosetters I worked on, well, how hard was that?)</p>
      <p>—<br>
      Joe Clark<br>
      <a href="http://joeclark.org/" title="http://joeclark.org/">http://joeclark.org/</a></p>
