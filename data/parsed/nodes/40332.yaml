      <p>The CCI system used at the Seattle Times is exactly such a system. It was originally designed to aid the layout of time-intensive, text and ad heavy publications like phone books. It was and is not a typographically advanced system, no ligatures I'm afraid. It handles the bulk of the design work though, since ads constitute the bulk of a paper. </p>
      <p>For graphically intense pages without ads, like our Entertainment and Arts Page 1, we use InDesign and Illustrator because we need more control over that final 17.5%</p>
      <p>And don't even begin to talk about classified advertising, because my head will explode.</p>
      <p>Will CSS handle this? Perhaps a sophisticated enough CSS spec could handle the layout of a dimestore novel respectably, but something as complex as a multi-page newspaper needs to not only be well specified, but also brutally error-free and as steady as a rock.</p>
      <p>Which we all know web design/xhtml/css to NOT be. (See Exhibit A, Internet Explorer, any version.)</p>
