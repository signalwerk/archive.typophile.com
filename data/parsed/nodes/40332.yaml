      <p>I have not read this whole thread, but I'll throw this out there anyway. Web fonts are thriving in Korea at the moment. Cyworld, the popular Korean website that offered personal spaces on the web years before MySpace, is selling about 25,000 web fonts a day, which amounts to 10 billion won (about 10 milion US dollars) in sales per year.</p>
      <p>Users buy web fonts so they can personalize their "mini homepages", bulletin board and forum entries, and email messages on websites like Cyworld and other large network orportal sites. Web fonts are predominantly pixel fonts, and this has been a big part of their success in Korea. Because Korean fonts for print require hangul, with thousands of glyphs, they often require years of work and can be quite expensive. There is not much variety, either. But pixel fonts can be produced in a tiny fraction of the time, and thus hundreds of hangul web fonts have sprung up, produced by traditional type foundries as well as new outfits devoted to web fonts.</p>
      <p>I must confess I do not know much about this phenomenon, since my primary interest is in print typography. I've never bought a web font, and I'm not really interested in doing so.</p>
      <p>A few quick points... The Korean web environment is different from what you may be used to. Koreans are used to buying a lot of virtual items like personalized avatar elements and items needed for multi-user games. Also, many spend an inordinate amount of time on the large Korean websites that provide the web font services. Finally, none of these web fonts that I've seen are suitable for print, as the vast majority are pixel fonts, and even those that are not are heavily compromised for screen use.</p>
