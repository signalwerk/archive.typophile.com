    html: |-
      <p>David, </p>
      <p>but notice that the bulk of the web is switching from the idea of a thick server and thin clients over to distributed computing -- simply because the users' PCs have a massive computing power at their disposal, so they can deal with rasterization, scaling, resolution adjustments etc. -- while if you offload all those tasks to the servers, every content vendor will have to invest in massive server and bandwidth technology, and this technology will become usable for rich content vendors only. </p>
      <p>What you're proposing is similar to "soft ripping" in prepress times -- the computer would rasterize a document and send a finite bitmap down to the imagesetter, which would then slavishly render the dots. But the industry chose PostScript/PDF, where it would be the receiving devices that would have an intelligent driver that transforms a common interchange format (PostScript, later PDF) into the rasterized image, while the sending part would take care of generating that common code. </p>
      <p>The web works similarly now: the sending part (the server) formats the content into an interchange form (HTML+CSS+PNG/GIF/JPG+(soon)TTF) while the receiver (a browser) is an intelligent "driver" that converts this common language into the user space, taking into account things like the resolution and size of the display, the navigational device at hand and other preferences set down by the user. </p>
      <p>I think the best personalization/individualization can happen reasonably only at the user's end. </p>
      <p>A.</p>
