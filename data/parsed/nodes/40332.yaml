      <p>Thomas Phinney wrote: <em>The CSS recommendation needs to explicitly cite processes for *all* major font formats to say how one processes the information inherent in those fonts to get to a CSS “font-family” string.</em></p>
      <p>Perhaps.</p>
      <p>The interface between specs can sometimes be tricky as specs often are controlled by different people and organizations.</p>
      <p>An extra complexity in this case is that CSS implemementations do not, in general, deal with font files directly. Browsers typically use the APIs and font renderers provided by the operating system they are running on, they don't open the font files themselves. As such, it would be more relevant to make demands on the operating systems and the APIs they expose than on the CSS specification.</p>
