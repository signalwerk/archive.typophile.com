      <p>Am I wrong, or are there not plenty of newspapers and magazines still using their own custom developed page layout systems designed to coordinate out put with invoicing systems for ad space? Something Quark and Indesign didn't do before, and something I don't quite see CSS handling. The applications I know best are for making signs, and they can track inventory, billable hours, etc. and spit out an invoice when you are done. I imagine a newspaper publisher would expect nothing less. Does CSS do that and if it does, is it still a cascading style sheet? </p>
      <p>Also, I hear so many 80% / 20% rules lately... "80% of your problems are caused by 20% of your (whatever)", "80% of you profits come from 20% of your customers (or products, or ideas)", and so on... It just seems to me that if you are going to pick a number and say "up to this point is good and you don't really need the rest",  then, don't pick 80%. (82.5% is better. ;o) These rules almost always make it seem as though it's the 20% that you <em>really</em> want. </p>
      <p>-=®=-</p>
