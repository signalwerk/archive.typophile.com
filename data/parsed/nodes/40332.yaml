      <p>DanGayle: <em>I think one problem that you’ll run into when discussing web fonts is that your 5% “good enough for web use” free fonts is in most Typophile’s estimates, 4.9% too high.</em></p>
      <p>Right :-)</p>
      <p>Most web users, however, will be happy with the 4.9%. And many will be overjoyed by the remaining 95% as well. For use in headlines, in latin scripts, many of them are suitable. Ransom notes is another use case. I think it's wrong to focus on the quality of current fonts, though. It's like saying the web is a failure because you wouldn't want to read 99.9% of the pages that people publish.</p>
      <p>I believe high-quality fonts will be made legally available if browsers learn how to do web fonts. It may be open-source fonts, commercial limited-range fonts, commercial fonts restricted by the 'Referer' HTTP header, or through new business models that none of us have thought of. But it will happen.</p>
