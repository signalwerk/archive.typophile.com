    html: |-
      <p>"Why use CSS for typesetting? Back Asswards."</p>
      <p>Not at all. That's the very point of CSS. No different than style sheets in your DTP apps.</p>
      <p>"Amen. How much professional typography experience do these gentlemen actually have?"</p>
      <p>How much typographical experience do 90% of inDesign users have? ;o)</p>
      <p>"I don’t think it has much to do with the medium. InDesign will go away when a proper typesetting tool replaces it. CSS is not it."</p>
      <p>CSS isn't a typesetting tool in and of itself. It's style markup language. Consider it like printers marks on the margins of a proof. Given that a lot of content is now being natively stored in XHTML and XML and the like, CSS seems like a perfectly logical extension. Now, whether or not Prince is 'the tool' is certainly debatable, but I certainly see CSS as the future. Rather than XPress styles, InDesign styles, Word Styles, we'd have one standard: CSS. If anything, and if the moons align, we might see InDesign eventually just use CSS natively within the application. </p>
      <p>"I’m a bit bemused by folks putting down Adobe-promoted standards relating to typography."</p>
      <p>Nothing wrong with [insert big software corporation] promoted standards. It's when they are also solely owned by said entity that some of us tend to start rooting for the open standard instead.</p>
      <p>And yea, I can't think of any Type-centric standards that Adobe has created that have been anything BUT a boon to the industry. I, personally, just have qualms about the Adobe vs. Microsoft issues as we go forward in trying to agree on standardization of content storage in general. If you're in a business where part of your requirements is to pump content out to the public at-large, then open HTML begins looking like the best solution. As it is now, one-click exporting from print documents into an easy to publish HTML format is still a bit of a dream for most DTP apps (though, admittedly, a big part of that is simply lack of application user training/knowledge).</p>
      <p>As for calling these gentlemen out for a lack of type knowledge, I think that's valid...they are clearly more technology orientated and seem to be focused on a lot of university and scientific documentation (which is the origins of the web). But I don't think that invalidated their vision...if anything, it should be a call to arms to help them improve the product based on the needs of the professional typesetter/designer.</p>
      <p>"Still lingering or malingering does go on. Vinyl sales are up in a big way...."</p>
      <p>This is maybe for an entirely different thread, but I find that point very interesting. Why is that? Clearly, part of that is the fact that it's a tangible item. Perhaps that's the appeal of Prince for some? It turns the intangible screen of HTML into a tangible book?</p>
