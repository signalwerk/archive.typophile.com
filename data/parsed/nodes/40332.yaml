      <p>dberlow: <em>the founding papas of the web didn’t have the foresight to make all things possible, so they started with no form, only content. Now, where does one draw the line between ’some of the typographic and presentational information’ and ’all of the typographic and presentational information’</em></p>
      <p>I don't think web documents should hold any typographic or presentational information. Instead they should link to style sheets that can be reused and cached. The web is diverse and the final presentation should be made as close to the user as possible. There, more information about the user's environment is available, and the presentaion can be optimized on a per-user basis.</p>
      <p>dberlow: <em>The essence of this second thing, expressing beautiful typography, is not possible without the opposite of your first thing: at least the ’option’ of a typographic specification specific to the font needs of the user of a web site. It should be obvious that expressing beautiful typography, other than by image, requires knowledge of ’where’ the expression is to take place if the variations are as diverse as those found in the entire web audience. Is that not obvious?</em></p>
      <p>I'm not sure I understand your question. Does your 'where' refer to where in the document? Style sheets languages offer selectors with high enough specificity to address single elements (e.g., #foo in CSS). So, you can create highly customized presentation while maintaining the separation of content and presentation.</p>
