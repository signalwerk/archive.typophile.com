    user: 1844
    date: 2008-02-03T19:03:00
    date_raw: 3.Feb.2008 7.03pm
    votes: null
    html: |-
      <p>&gt; <em>I assume it gets «Minion Pro» from some other field in the same file, do you know which one?</em></p>
      <p>It's both Microsoft NameID 16, like John said, and Macintosh NameID 1. Ideally, fonts in a large family will have these two strings match each other. If they don't match, fc-list will output both. The general format seems to be,<br>
      <code>MacNameID1,MSNameID16,MSNameID1:style=MacNameID2,MSNameID17,MSNameID2</code></p>
      <p>There's definitely something going on behind the scenes, because fc-list doesn't output all the NameID strings, even if they are present in the font. For example, according to the format above, the font MinionPro-BoldCnItCapt.otf would have been IDed as,<br>
      <code>Minion Pro,Minion Pro,Minion Pro Cond Capt:style=Bold Cond Italic Caption,Bold Cond Italic Caption,Bold Italic</code><br>
      but what gets output is just,<br>
      <code>Minion Pro Cond Capt,Minion Pro:style=Bold Italic,Bold Cond Italic Caption</code></p>
      <p>And MinionPro-BoldIt.otf outputs as,<br>
      <code>Minion Pro:style=Bold Italic</code><br>
      but by the format above it would have been,<br>
      <code>Minion Pro,(font has no MSNameID16),Minion Pro:style=Bold Italic,(font has no MSNameID17),Bold Italic</code></p>
      <p>&gt; <em>Which font should be selected?</em></p>
      <p>Currently, the answer varies from browser to browser. I'd say that those properties define "Minion Pro Bold Italic Condensed". The problem with CSS is that it's build on the assumption that fonts in a family only vary by Weight, Width and Slope, which is true for most families but certainly not all. What about fonts that differ only by Optical Size? (Two fonts can have the same WWS, but one is designed to be used at large point sizes --Display--, and the other at small point sizes --Caption). And what about two fonts of the same family that only vary in design? (e.g. Shelley Allegro, Shelley Andante and Shelley Volante). CSS goes a step further than Windows, which differentiates fonts only by Weight (Regular, Bold) and Slope (Upright, Italic), but still falls short of what is necessary for describing a font by its properties.</p>
      <p>The thing is, CSS tries to address two different things with the same set of properties. On one hand, the properties have to be as specific as possible so that the desired font(s) get selected. To achieve that we'd only need two properties,<br>
      <code>nameOfFontFamily: "Minion Pro";<br>
      nameOfStyleInFontFamily: "Bold Italic Condensed Caption"</code></p>
      <p>But on the other hand, the font needs to be described by a set of general properties/characteristics so that, in case the desired font is not available, there's at least enough information to find a close match.</p>
      <p>So, the main challenge is probably deciding where one of the operations ends and the other starts, i.e. when should browsers stop trying to find the font that equals the specified properties, and start guessing which font would be the better match.</p>
      <p>Personally, I would like to be able to spec my font(s) in a typographic manner like I do in InDesign. That said, it would be great if CSS could provided two additional properties,<br>
      <code>font-typographicfamily: MacNameID1/MSNameID16<br>
      font-typographicstyle: MacNameID2/MSNameID17</code></p>
      <p>But I understand that is important to provide general properties to describe the font(s); this way browsers don't have to apply heuristics to two name strings in order to find if the font is Bold, Italic or Condensed. Is it possible to combine the two approaches? I think so.</p>
      <p>BTW, I experimented writing the CSS code for a few font families, based on my proposal from January 30th, and was quite surprised by the results I got in Firefox. About 85% of the fonts were selected and displayed correctly. One of the families, Kepler Std, was particularly interesting, since it has no less than 168 fonts!!<br>
      The results can be found at <a href="http://adhesiontext.com/typophile/CSSFontTest/" title="http://adhesiontext.com/typophile/CSSFontTest/">http://adhesiontext.com/typophile/CSSFontTest/</a></p>
      <p>I must say the results in Safari were very disappointing. This browser seems to prefer the PostScriptName (Mac&amp;MS NameID6), but even with such specific pointer to the font(s), it failed to correctly display many of them. Some of which it couldn't even find. Perhaps there's something broken in the font matching mechanism.</p>
