      <p>Howcome: <em>"First, it’s important that the markup languages of the web are spared from holding all the typographic and presentational information that we want to associate with documents."</em></p>
      <p>We've talked about this offline quite a bit, but, that's how all this started. I mean, the founding papas of the web didn't have the foresight to make all things possible, so they started with no form, only content. Now, where does one draw the line between 'some of the typographic and presentational information' and 'all of the typographic and presentational information'.</p>
      <p>Howcome II:<em>"Second, we need ways to express beautiful typography and design for web documents."</em></p>
      <p>The essence of this second thing, expressing beautiful typography, is not possible without the opposite of your first thing: at least the 'option' of a typographic specification specific to the font needs of the user of a web site.</p>
      <p>It should be obvious that expressing beautiful typography, other than by image, requires knowledge of 'where' the expression is to take place if the variations are as diverse as those found in the entire web audience. Is that not obvious?</p>
      <p>Cheers!</p>
