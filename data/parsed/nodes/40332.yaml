      <p>Thanks to all who have provided feedback in this forum. My tentative conclusion from our discussions is that referencing fonts in CSS is not «fundamentally broken», but that new variants in OpenType font warrants some new keywords on the 'font-variant' property. It also makes sense to split out individual properties along the lines of this proposal:</p>
