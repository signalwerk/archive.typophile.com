    html: |-
      <p>&gt; <em>Browsers typically use system APIs to learn about the available fonts.</em></p>
      <p>Yes, but it's not just a matter of getting a list of all the fonts available but rather getting an unique and clear pointer to a given font on that list. Yes, it's up to the systems to implement the APIs, but on the other hand it's up to CSS to clearly say what 'font-family' corresponds to. Is it NameID#1 or NameID#16? If NameID#1, then what should be done in case the family has more than 4 styles?</p>
      <p>As Thomas said, section 15.4.2 Full font name (<a href="http://www.w3.org/TR/1998/REC-CSS2-19980512/fonts.html#aname" title="http://www.w3.org/TR/1998/REC-CSS2-19980512/fonts.html#aname">http://www.w3.org/TR/1998/REC-CSS2-19980512/fonts.html#aname</a>) only scratches the surface on this matter. There needs to be a clearer guidance from CSS, otherwise 'Full font name' might mean the font's NameID#1 in one browser, and NameID#16 in another, for example.</p>
      <p>&gt; <em>So, it’s better to ask system vendors about this, or look to the OpenType specification for guidance.</em></p>
      <p>The OT spec gives absolutely no guidance on this matter. It only describes what each name string is. It doesn't say which names or how many names should be used to get an exact (cross-platform &amp; cross-browser) reference to a font. For example, some Adobe applications use NameID#6 in the documents they generate in order to have an unambiguous cross-platform reference to a font, while other apps use other NameIDs.</p>
      <p>&gt; <em>Yes, but most people don’t have them. In order to motivate browsers to add features, you must tempt them with lots of potential users. Remember that browsers vendors have hundreds of great ideas to choose from and only so few developers. They are unlikely to add features if only a small subset of users will notice.</em></p>
      <p>I know exactly what you mean as I have to deal with that fact in a regular basis. I wished InDesign had this and that but...</p>
      <p>But browser support is not the matter here. Did you give up on the idea of CSS v3 just because no browser was supporting it at the moment? My point is, there's nothing stopping the W3C to specify the keywords now. Or are you waiting for each browser to come up with their own solution and then blame them for not following the spec (that was written *after* the fact)?</p>
      <p>OpenType is here to stay, either you want it or not. The sooner CSS embraces it, the better for everyone. XAML already has <a href="http://msdn2.microsoft.com/en-us/library/ms745109.aspx" title="http://msdn2.microsoft.com/en-us/library/ms745109.aspx">http://msdn2.microsoft.com/en-us/library/ms745109.aspx</a> Now, shouldn't all those style attributes be implemented through CSS? I think so. Can CSS do it? You tell me...</p>
