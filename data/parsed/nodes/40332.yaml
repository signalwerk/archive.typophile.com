      <p>Google is barking up an interesting tree, but it's still the wrong one. What I would much rather see is a tool like InDesign that can actually output usable HTML/CSS! Why use CSS for typesetting? Back Asswards. </p>
      <p>Outputting a typeset PDF deserves a (one handed golf clap) applause. But getting a decent layout application that works flawlessly is a whole other thing. Writing CSS still requires a developer to sit down and write code. We've gone miles beyond hand-writing Post Script, but we're not there close with HTML/CSS editors. We're 10 years out from the time the original WYSIWYG editors came out (NetObjects, GoLive) and still no serious web developers worth their salt use (or admit to using) WYSIWYG tools because they introduce too much error and require hand-coding. (Modern browser suckage is as much to blame as the people behind Dreamweaver.)</p>
