      <p>Using filenames is not a good idea, because they are not necessarily static. If a font is something that is fairly frequently updated, e.g. a custom font for a publisher that is expanded with new glyphs to cover the typesetting needs of new books, then it isn’t unusual for the font file name to include some kind of version or build reference.</p>
      <p>As I understand the recent comments (thanks Thomas and Miguel for pointing out my misreading), the CSS notion of a font family is slightly larger than that of a Windows (non-WPF*) 4-font family, adding width to Windows’ weight and slope. The OpenType family concept is essentially open-ended.</p>
      <p>* On the subject of WPF, it seems to me that many of the issues we’re talking about here with regard to font selection have already been given a lot of thought by Mikhail Leonov and David Brown, and their white paper on the <a href="blogs.msdn.com/text/attachment/2249036.ashx">WPF font selection model</a> (PDF download link) might be worth re-reading about now. The WPF concept of family seems to be pretty much identical to that of CSS, including weight, width and slope properties.</p>
