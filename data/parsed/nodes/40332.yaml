    <p>A <a href="http://www.youtube.com/watch?v=vcXUrNSvjhU" rel="nofollow">YouTube video</a> of a presentation at Google by Håkon Lie and Michael Day has Lie declaring that InDesign users, particularly at newspapers, will soon be so passé  they will be more comparable to the old guys who moved “lead” type.</p>
    <p>The context is the ability of Prince, a software application, to output a “typeset” PDF from HTML+CSS. (Lie was coauthor of the original CSS spec.) While that claimed capacity was covered in an <a href="http://www.alistapart.com/articles/boom" title="Printing a book under CSS" rel="nofollow">article</a> I read, then and now my response is “<em>I’ll</em> be the judge of that.” The presenters’ insistence that HTML-CSS-Prince handles “most” requirements (more than 80%) will, I suspect, be antithetical to the real typographers who read this forum. I think we spend rather a lot of time on that other 20%.</p>
