      <p>&gt; This is good use case for Web fonts</p>
      <p>Surely it ought to be possible, for any font present on the user's system, to specify that font unambiguously.</p>
      <p>Howcome points us to section 15.4.2, the "Full font name."<br>
      The "discussion" cited starts to scratch the surface of the problem, but doesn't actually try to solve it, not does it fully expose the complexity of the problem.</p>
      <p>Even within a single platform, a given font can have multiple strings that have a legitimate claim to being the "full font name." Saying that the browsers should just defer to the OS is useless given that HTML and CSS are supposed to be cross-platform. I'm also of the understanding that most platforms can access multiple plausible strings for any given font.</p>
      <p>Cheers,</p>
      <p>T</p>
