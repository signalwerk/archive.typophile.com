      <p><cite>There is no requirement in CSS that browsers look inside the fonts</cite><br>
      Forgive me if I'm wrong, but broadly speaking aren't YOU the one suggesting the requirements? If the current requirements do not address a specific and isolated issue, why not address it?</p>
      <p>An added benefit of so doing would be a further standardization of naming conventions for Open Type fonts. If all of the foundries know that the CSS spec will call for NameID#6, then all of the foundries will then make darn sure that the NameID#6 string is fully mapped out.</p>
      <p>As the subject was originally about CSS specifying server-end fonts, the web designer/programmer will have access to the font files and access to all of the specific name ids associated with them. They could very easily find out exactly what the NameID#6 string is EXACTLY, then spec it up without worry.</p>
      <p>The cascade could call for a specified font via the standardized name id, then fall back to a standard web font if some freak occurrence prevents the specified font from downloading and activating on the user end.</p>
      <p>I like that idea, because I don't like having to string together an entire set of font properties that are already inherent in a font. Why call for Myriad Pro, but only the condensed version that happens to be an italic variant and only if it's the display weight instead of the file Myriad Pro Condensed Italic Display?</p>
      <p>For a Word user, it might make sense. But we as Typophiles understand that every variant is a font in and of itself, not a magically bolder and slantier version of "the" font.</p>
