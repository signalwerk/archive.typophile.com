      <p><em>That is, fontconfig reports two names: «Minion Pro» and «Minion Pro Cond Capt». I assume it gets «Minion Pro» from some other field in the same file, do you know which one?</em></p>
      <p>«Minion Pro Cond Capt» is the Font Family name (sfnt name table ID 1). This is the name of the 4-style family which would consist of </p>
      <p>- Minion Pro Cond Capt Regular<br>
      - Minion Pro Cond Capt Italic<br>
      - Minion Pro Cond Capt Bold<br>
      - Minion Pro Cond Capt Bold Italic</p>
      <p>«Minion Pro» is the OpenType Preferred Family name (name table ID 16) which allows applications to display a single, larger family composed of the 4-style families. The style linking between the members of the 4-style families remains the same, only the presentation to the user differs. The Preferred Family name is used in conjunction with the Preferred Subfamily name (ID 17).</p>
      <p>[I think the term 'subfamily' is potentially misleading; this is really synonymous with style and is particular to a single font within the family, not some kind of sub grouping.]</p>
      <p>It would be quite nice, I think, if CSS made it possible to specify either the Font Family (ID 1) plus Font Subfamily (ID 2, style) as in Miguel's example, or the Preferred Family (ID 16) plus Preferred Subfamily (ID 17). So the same font, Minion Pro Bold Cond(ensed) Italic Caption, could be spec'd as either</p>
      <p><code>font-family: "Minion Pro Cond Capt";<br>
      font-style: italic;</code></p>
      <p>or </p>
      <p><code>font-family: "Minion Pro";<br>
      font-style: "Cond Italic Caption";</code></p>
      <p>I don't know how feasible this is.</p>
      <p>I presume the secondary properties</p>
      <p><code>font-weight: 700;<br>
      font-stretch: condensed;</code></p>
      <p>are only necessary as a fallback mechanism, e.g. if a default serif face is used instead of the specified font, in order to try to match the weight and width?</p>
