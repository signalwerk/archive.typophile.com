    html: |-
      <p>«Which name strings in the font are the browsers supposed to use?»</p>
      <p>There is no requirement in CSS that browsers look inside the fonts, and noone has argued that they should have to do so. Browsers typically use system APIs to learn about the available fonts. So, it's better to ask system vendors about this, or look to the OpenType specification for guidance. It's outside the scope of the CSS specification.</p>
      <p>«why do Safari and Firefox display different fonts?»</p>
      <p>I don't know. What system are you using, which versions of the browsers? A good place to ask the question is in the www-style mailing list.</p>
      <p>«Fonts with OpenType layout features *ARE* available»</p>
      <p>Yes, but most people don't have them. In order to motivate browsers to add features, you must tempt them with lots of potential users. Remember that browsers vendors have hundreds of great ideas to choose from and only so few developers. They are unlikely to add features if only a small subset of users will notice.</p>
