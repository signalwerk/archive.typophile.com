      <p>I think the main thing I want to see Howcome respond to is why he's opposed to having EOT as an equal standard. I'm not opposed to the existing proposal, as I think it will solve some problems. But my survey of web designers showed pretty clearly that most of them want something that works (legally) with regular, commercial fonts.</p>
      <p>Aluminum writes: <cite>So, to go back to the issue of ’web fonts’, we probably are over-thinking the ’outlines’ issue. We probably don’t have to worry too much about the scrapbooking mom using some software crack to extract web based fonts for her 4 year old’s birthday party scrapbook. Or, perhaps we do need to worry, but not on the technology side...but rather on the consumer awareness side.</cite></p>
      <p>You're over-thinking the "outlines" issue because that's not the issue at all. Howcome is pushing for simply putting entire fonts on Web servers. If there are to be any protections at all, they are only present if a server admin puts them there. Otherwise, you've simply got the fonts out there.</p>
      <p>Now, other proposals, such as EOT, are still not massively secure either, but the general idea is that, as with PDF or other forms of embedding, it doesn't take massive security to keep the average person honest.</p>
      <p>Thomas Phinney wrote: <cite>I agree emphatically with Joe that referencing fonts in CSS is fundamentally broken.</cite></p>
      <p>Howcome replied: <cite>If something is «fundamentally broken» I assume you want to throw it away instead of trying to fix it. What would you replace it with?</cite></p>
      <p>Actually, I just want a CSS spec that makes it clear, given a font, how one gets the "font-family" property from that font. Now, given that this has been unspecified for so long, maybe we need a new tag to go with the unambiguous spec. But *something* would be good.</p>
      <p>Cheers,</p>
      <p>T</p>
