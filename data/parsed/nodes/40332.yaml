      <p>That's a bit misleading.</p>
      <p>OpenType and Type 1 are already public standards adopted by the ISO. EOT has heretofore been a proprietary and unpublished spec. In order to be broadly usable, EOT should be adopted and published by a standards body. But which one? As the whole point of EOT is to be a Web standard, the W3C is the obvious answer. I haven't seen anyone suggest that the W3C should endorse EOT *more* than any other format, just that the W3C be willing to be the holder of the EOT format.</p>
