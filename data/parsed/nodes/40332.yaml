      <p>Until the web starts to allow more finesse and control across browsers and platforms, it's hard to imagine one application that can handle both the precision required for print design and the flexibility required by the web.</p>
      <p>That said, I know nothing about css. But I do know that for a lot of designers, code is fairly anti-intuitive to work with. I have a background in print (hence Quark, InDesign) and can fumble my way through Dreamweaver because it's aimed at users like me who need to actually see something rather than just write code, but when it comes to html, I leave that to the programmers. </p>
      <p>Back in the day, typesetting was done by typesetters, design by designers. The Mac changed all that, now most designers I know do their own typesetting (for better or worse). If the software gets too far removed from the physical act of designing, you'll start to partition things off again. I work with web programmers when I need to get a site done, but I'm not going to want to hire out for my typesetting.</p>
