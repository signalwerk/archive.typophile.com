      <p>&gt; <em>Should the code above work? Should the code below work? Should they result in the same font?</em></p>
      <p>This code below works, at least in Firefox 2.0.0.11 Mac. You can see it at <a href="http://adhesiontext.com/typophile/CSSFontTest/Firefox/MinionPro/" title="http://adhesiontext.com/typophile/CSSFontTest/Firefox/MinionPro/">http://adhesiontext.com/typophile/CSSFontTest/Firefox/MinionPro/</a> It's the 5th font in the list.<br>
      <code><br>
      font-family: "Minion Pro Cond Capt";<br>
      font-style: italic;<br>
      font-weight: 400;<br>
      font-stretch: condensed;<br>
      </code></p>
      <p>&gt; <em>font-variant: caption; /* assuming we add the "caption" keyword */</em></p>
      <p>The optical size should not be seen as a variant in the same category as Small Caps or Ligatures. (Yes, there's the 'size' OpenType feature which is to be used for controlling the Optical size, but that feature has an unique format and it looks like it was shoehorned into the GPOS table)<br>
      I see the Optical size as a font property at the same level as the font's Weight, Width or Slope, and therefore it ought to have its own keyword, e.g.<br>
      <code>font-opticalsize: 6pt;</code></p>
      <p>The other thing to consider is that, historically, the optical size is an integer value between 6 and 72 (points). Therefore, the optical size shouldn't be defined as a finite set of names such as Caption, Subhead or Display. That was Adobe's approach, but there's no reason to do it that way, on the contrary. This system of names was good for educating the users --and even so, the terms are not interpreted the same way by all the users--, but it becomes problematic when new sizes need to be introduced.</p>
