      <p>This code:<br>
      <code><br>
      font-style: "Cond Italic Caption";<br>
      </code></p>
      <p>is not feasible in CSS. The 'font-style' property only accepts keyword values, one of: normal, italic, oblique. The property works interoperably across browsers and changes to it will be resisted.</p>
      <p>There is also a keyword-based property called 'font-stretch'. So, you would end up with something like<br>
      <code><br>
      font-family: "Minion Pro";<br>
      font-style: italic;<br>
      font-stretch: condensed;<br>
      font-variant: caption; /* assuming we add the "caption" keyword */<br>
      </code></p>
      <p>Should the code above work? Should the code below work? Should they result in the same font?<br>
      <code><br>
      font-family: "Minion Pro Cond Capt";<br>
      font-style: italic;<br>
      font-stretch: condensed;<br>
      font-variant: caption; /* assuming we add the "caption" keyword */<br>
      </code></p>
