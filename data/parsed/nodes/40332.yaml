      <p>Joe: <em>Or we could just conclude that CSS is incapable of character-level typography (and intercharacter).</em></p>
      <p>But so have been a heck of a lot of 'typesetting' technologies. Linotype non-kerning f, anyone?</p>
      <p>The trouble with something like your single-storey ɑ use case is that this kind of variant is very much font-specific and always has been, and even if one were to construct a general mechanism for 'storey variants', as Håkon imagines above, one is still going to be left with dozens of other kinds of design-specific variants that fall between the cracks of such a mechanism, that do not correspond to an anticipated variant class and specified property. In typography as in linguistics there are 'free variables', and these basically require the equivalent of that earliest of typesetting technologies: the case of individual sorts from which the typesetter can grab the appropriate form and insert it in the composing stick. Adobe's glyph palette is the most direct equivalent, but OpenType stylistic alternate layout features are only one level above this and not much easier to address in terms of cross-font behaviour and, hence, generalised mark-up.</p>
