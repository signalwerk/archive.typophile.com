      <p><em>«What about fonts on the user’s system? Do we need to hardcode the path to those as well, in order to get access all the fonts in the family?»</em></p>
      <p>CSS2 describes how to refer to locally installed fonts, e.g.:<br>
      <code><br>
      &nbsp;&nbsp;src: local("T-26 Typeka Mix"), url("http://site/magda-extra") format("type-1")<br>
      </code></p>
      <p>So, there’s no need for a path. But the spec doesn’t say how to get the font name. I think it’s fair to ask that the spec gives guidance on this, even if most implementations will go through system APIs to find the font. However, I’m unsure what the spec should say, given that there are several fields with different strings in them. If the font community (that’s you ;-) want guidance in the CSS spec, you need to agree on how to find the name of a font.</p>
