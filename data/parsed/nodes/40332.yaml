      <p>Joe Clark wrote: <em>If I want exactly one weight, style, and width of Thesis, what exact font-family syntax do I use to specify it for all non-braindead browsers?</em></p>
      <p>This is good use case for Web fonts, I believe. Here's some sample code that will tie a set of descriptors to one unique URL:<br>
      <code><br>
      @font-face {<br>
      &nbsp;&nbsp;src: url(<a href="http://www.example.com/thesis-smallcaps-whatever" title="http://www.example.com/thesis-smallcaps-whatever">http://www.example.com/thesis-smallcaps-whatever</a>);<br>
      &nbsp;&nbsp;font-family: "mythesis";<br>
      &nbsp;&nbsp;font-style: italic;<br>
      &nbsp;&nbsp;font-weight: 500;<br>
      &nbsp;&nbsp;font-variant: small-caps;<br>
      }<br>
      </code><br>
      And here is one way to refer to it from the shorthand 'font' property:<br>
      <code><br>
      h2 { font: 500 italic small-caps 16pt/18pt "mythesis" }<br>
      </code></p>
