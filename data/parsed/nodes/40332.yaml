      <p><cite>Håkon's proposal is a good start from a nonexpert. But it still doesn't let me choose TheSansB HT6 SemiBold with tabular ranging figures and alternate single-storey</cite></p>
      <p>Hi Mr Clark. Well, what could be better than directly referencing the font file, as suggested earlier by Mr Lie,</p>
      <p>&nbsp;&nbsp;&nbsp;@font-face {<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;src: url(<a href="http://www.example.com/thesis-smallcaps-whatever" title="http://www.example.com/thesis-smallcaps-whatever">http://www.example.com/thesis-smallcaps-whatever</a>);<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;# additional properties which in combination identify this font</p>
      <p>because: If you got a bunch of PST1 fonts which make stylistic alternate glyphs available in separate fonts (= styles), and if these separate fonts are identified by strings/abbreviations in the fonts' file name and menu names, and if the latter strings/abbreviation moreover are foundry-specific -- how please should CSS be able to identify the correct font by just looking for "two storey g" in any font variant?<br>
      Let's assume that CSS would support the 20 Stylistic Set features, it would not know more about them than their names: "Stylistic Set 1", "3", "6" etc. Neither applications nor CSS can know what each does. Alternate g is of that category. Unless there's a registered feature dedicated to one- or two-storey a's and g's, your example is a bit unrealistic. I think you expect more from CSS than even OT specs offer.&nbsp;&nbsp;;-)</p>
