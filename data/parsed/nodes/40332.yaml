      <p>As to the original post, I fail to see the scandal. Forget all the rhetorics (20% vs 80%, death of InDesign), just stick to what he actually presented.*<br>
      The presentation makes it clear that Mr Lie is not a typographer, see his selection of 'good' typefaces or the fact that he does not seem much interested in OpenType except for the fancier features. I do not even care since in the more fundamental issues he is pretty right: The HTML+CSS model is (or allows to be) quite strict in separating two independent domains which are, first, structured data, and second, (graphic or typographic) representation of these.</p>
      <p>I think that in the long run, typographers will need to think of design in a more structured and abstract way. Designing nice books or brochures manually and individually by placing frames on a virtual page and filling these with given texts or images, is one thing. It is another thing to 'design' design rules -- the actual design results from (automatically) merging data and design rules. This is nothing to be afraid of, it can help make the design process more efficient. And this does not necessarily result in a loss of quality: What did the most traditional book designers do? Define the design rules. See the beautiful sketches by Jan Tschichold or Max Caflisch.<br>
      With this in mind, I consider ther HTML+CSS approach as pretty interesting. Another example is <a href="http://www.docscape.de" target="_blank" rel="nofollow">DocScape</a> (cannot find an English version). This system allows to program very complex design rules, and one command will merge these with texts and images from any database and generate a PDF of an entire catalog or book. Its developers claim that this is much different from scripting layouts in InDesign or XPress in that these fill fixed template pages or frames with content while in their system the layout by default is supposed to be programmed such that it can deal with texts and images of various length or size, e.g. using two columns instead of three.<br>
      'Defining design' rather than 'designing' requires that designers or typographers are able to think of design abstractly.** And to make designers (myself included) feel comfortable with this it needs appropriate visually oriented tools. This is a particularly interesting question for which I have not seen solution. How would such a tool represent a layout, and allow designing it, if there is no 'content' yet? Would it be possible to create such a layout visually nevertheless -- and also <em>show</em> which parts of the layout are fixed and which parts remain variable? In short, how to represent virtual representation of data?<br>
      Nobody seems to have made an attempted to address this. Current solutions either force designers to fix text and image snippets on a digital page (PageMaker, XPress, InDesign), or require developers rather than designers (like LiveCycle, can anybody explain this to me in an afternoon?). There is nothing inbetween.</p>
      <p>*&nbsp;&nbsp;I think it was Mr Lie who made an interesting remark in the presentation: The actual typographic representation, which also includes things like hyphenation or optical margin alignment, is not up to CSS itself but to the browser or PDF generator.<br>
      **&nbsp;&nbsp;For this reason, web designers and developers may easier adapt than print designers. Also I am not surprised that all these technologies, PrinceXML, but also AIR and WPF emerged from the web &amp; UI design rather than the print world. My impression is that currently there are pretty exciting things under way, including the above-mentioned technologies. Many of these have the potential to change the way we think of design: By allowing to address document (or print) design, web design, UI design in the same 'language' they may help overcome the strict distinction of these three -- they have more in common than previous design tools (special tools for each of them) suggested. The <em>real</em> distinction is between data and their representation. The same data can be represented in a book or on the screen, or these data may be opend up for manipulation, then the form of representation turns out to be a UI.)</p>
      <p>As an aside, it is with more or less automatic design in mind that I think that fonts need to be spaced and kerned well enough that no or very little intervention by the typographer is required. And OpenType helps a lot with this.</p>
      <p>Karsten</p>
