      <p><em>What Adam is saying is that if someone is going to steal their font, that person is likely to have already done so. What the foundries are depending upon is the solitary, sometimes institutionalized, consciences of individuals and companies determined to do the right thing. (Or at least, the legal thing.)</em></p>
      <p>Yes, I understand how that works, and how easily you or anyone else who wants to can obtain my fonts for nothing. So I give unscrupulous users less reason to distribute my work illicitly by making some of my fonts downloadable from the authorized vendor (Myfonts) for zero cost, with the option to purchase a license if they want to use it on a paying job and believe in doing the right thing.</p>
      <p>In practice, only a dozen or so people each year purchase licences for the fonts I make available with an optional free license. Hundreds more download the free license version and I know (because I've seen the evidence) many of them use the fonts for profit. If I offered the same dual license/try before you buy deal for everything in my catalog, the revenue would not even cover operating costs---I would operate at a loss and probably give up releasing retail fonts.</p>
