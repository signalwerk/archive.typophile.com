      <p>"For instance, although not a design program, Microsoft Word now uses XML."</p>
      <p>As does InDesign, actually.</p>
      <p>Ultimately, it'd be nice to see a company like Adobe embrace a product like this and incorporate it into their own DTP apps. </p>
      <p>However, knowing MS and Adobe, they don't really like those open standards and prefer to keep to themselves. ;o)</p>
      <p>(To be fair, I think Adobe has been a bit better in this regard than MS has)</p>
      <p>"No programming required."</p>
      <p>Well, for the record, CSS as it is now isn't really programming. It's just learning a bit of syntax. Really no different than learning prepress terms, or how to bind a book, etc. Just another publishing medium.</p>
      <p>"I feel I am reasonably informed on the topic and I am pretty sure that even Prince would not do what I want. Typesetting a single page that varies its number of columns is punishingly difficult in CSS yet readily achieved in InDesign, for example."</p>
      <p>Joe, have you used Prince yet? I haven't, but if you do, I'd love your opinion. I agree that for a web browser, using CSS for varying columns is a huge PITA at the moment. Prince, however, seems to actually support CSS-3 fully, which DOES allow for columnar layouts. One example: <a href="http://developer.mozilla.org/en/docs/CSS3_Columns" title="http://developer.mozilla.org/en/docs/CSS3_Columns">http://developer.mozilla.org/en/docs/CSS3_Columns</a></p>
      <p>I agree, this is not a replacement for InDesign now. I am thrilled by the potential it has down the road, though.</p>
      <p>"I know best are for making signs, and they can track inventory, billable hours, etc. and spit out an invoice when you are done. I imagine a newspaper publisher would expect nothing less. Does CSS do that and if it does, is it still a cascading style sheet?"</p>
      <p>I have no answer for that (though would love to hear one). But, to add to the topic, it seems as if most successful papers are moving a lot of their ad revenue towards their online existence as advertiser depend less and less on the print medium for advertising. So this may very well become a nice addition to, rather than replacement of, current systems. It's been a decade since I've worked in a paper, though (which, at the time, was MS Word, cut and pasted into XPress [and then printed, cut, and waxed onto the keylines...those were the days...] and then cut and pasted into a primitive HTML editor where we published each article manually onto a static HTML site.)</p>
      <p>"Which we all know web design/xhtml/css to NOT be. (See Exhibit A, Internet Explorer, any version.)"</p>
      <p>Again, Prince isn't a web browser. It's a HTML/XML to PDF renderer. The appeal is that it does support a much fuller set of the CSS spec (especially for print) than any current web browser.</p>
      <p>"Sure, this is using proper CSS, but XML/SGML + stylesheets have been used for print for years."</p>
      <p>Excellent point. Doesn't Framemaker also use SGML or a subset thereof?</p>
      <p>I think the idea, though, is that everyone touches HTML/XML these days, if not a fuller SGML subset. So this product probably hits a few more of the pragmatic buzzwords out there.</p>
