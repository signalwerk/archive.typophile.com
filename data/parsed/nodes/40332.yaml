      <p>&gt; <em>My tentative conclusion from our discussions is that referencing fonts in CSS is not «fundamentally broken»</em></p>
      <p>When Thomas used the expression «fundamentally broken» I think what he had in mind was that with CSS it's easy to reference a font that is part of a small family (e.g. <code>font-family: Arial; font-style: italic;</code> will get you <em>Arial Italic</em>), but when the font family has more than the usual 4 styles (Regular, Italic, Bold, Bold Italic), like Minion Pro or Myriad Pro for example, then referencing a specific font is no longer easy. And it gets even more complicated when you try to find a solution that works for all the browsers. Here's an example:</p>
      <p>To reference <em>Minion Pro Bold Italic</em>, one would probably use the following code, right?<br>
      <code>font-family: 'Minion Pro';<br>
      font-weight: bold;<br>
      font-style: italic;<br>
      </code></p>
      <p>If yes, then why do Safari and Firefox display different fonts, like so?<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/css_1_6546.png"></div><p></p>
      <p>But things can get even more interesting. If one wants to reference <em>Minion Pro Medium Cond(ensed) Italic Display</em> this is the code you'll have to use for Safari,<br>
      <code>font-family: 'MinionPro-MediumCnItDisp';<br>
      font-style: italic;</code></p>
      <p>and this is the code you'll have to use for Firefox,<br>
      <code>font-family: 'Minion Pro Med Cond Disp';<br>
      font-style: italic;</code></p>
      <p>in order to get this:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/css_2_4815.png"></div><p></p>
      <p>If you don't agree that's broken, then why am I getting different results for the same code, and why do I have to use different code to get the same results? Sure, you can blame the browsers for not be doing the right thing, BUT <strong>what is the "right thing"?</strong> Which name strings in the font are the browsers supposed to use? Should they just pick-and-choose Name IDs (<a href="http://www.microsoft.com/typography/otspec/name.htm" title="http://www.microsoft.com/typography/otspec/name.htm">http://www.microsoft.com/typography/otspec/name.htm</a>) as desired, or should the CSS spec give a clear guidance?</p>
      <p>And in the example that tries to reference <em>Minion Pro Medium Cond(ensed) Italic Display</em> shouldn't the code be a lot more straight forward? Something like this, perhaps:<br>
      <code>font-family: 'Minion Pro';<br>
      font-style: 'Medium Cond Italic Display';</code></p>
      <p>&gt; <em>[...] new variants in OpenType font warrants some new keywords on the ’font-variant’ property [...] but the exact list of keywords can’t be determined quite yet; it will depend on availability of fonts</em></p>
      <p>If by 'fonts' you mean 'free fonts', then that last sentence will be closer to the truth...<br>
      Fonts with OpenType layout features *ARE* available, and the keywords *CAN* be determined. The keywords can be based on the features already registered (<a href="http://www.microsoft.com/typography/otspec/featurelist.htm" title="http://www.microsoft.com/typography/otspec/featurelist.htm">http://www.microsoft.com/typography/otspec/featurelist.htm</a>), and there are already hundreds of fonts that implement a lot of these features (e.g. Minion Pro, Myriad Pro, the ClearType collection, Palatino Linotype [in Win2000 and up], etc.). This thread has several examples of fonts with OT features: <a href="http://typophile.com/node/41231" title="http://typophile.com/node/41231">http://typophile.com/node/41231</a></p>
    html_clean: |-
      <p>&gt; <em>My tentative conclusion from our discussions is that referencing fonts in CSS is not «fundamentally broken»</em></p>
      <p>When Thomas used the expression «fundamentally broken» I think what he had in mind was that with CSS it's easy to reference a font that is part of a small family (e.g. <code>font-family: Arial; font-style: italic;</code> will get you <em>Arial Italic</em>), but when the font family has more than the usual 4 styles (Regular, Italic, Bold, Bold Italic), like Minion Pro or Myriad Pro for example, then referencing a specific font is no longer easy. And it gets even more complicated when you try to find a solution that works for all the browsers. Here's an example:</p>
      <p>To reference <em>Minion Pro Bold Italic</em>, one would probably use the following code, right?<br>
      <code>font-family: 'Minion Pro';<br>
      font-weight: bold;<br>
      font-style: italic;<br>
      </code></p>
      <p>If yes, then why do Safari and Firefox display different fonts, like so?<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/css_1_6546.png"></div><p></p>
      <p>But things can get even more interesting. If one wants to reference <em>Minion Pro Medium Cond(ensed) Italic Display</em> this is the code you'll have to use for Safari,<br>
      <code>font-family: 'MinionPro-MediumCnItDisp';<br>
      font-style: italic;</code></p>
      <p>and this is the code you'll have to use for Firefox,<br>
      <code>font-family: 'Minion Pro Med Cond Disp';<br>
      font-style: italic;</code></p>
      <p>in order to get this:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/css_2_4815.png"></div><p></p>
      <p>If you don't agree that's broken, then why am I getting different results for the same code, and why do I have to use different code to get the same results? Sure, you can blame the browsers for not be doing the right thing, BUT <strong>what is the "right thing"?</strong> Which name strings in the font are the browsers supposed to use? Should they just pick-and-choose Name IDs (<a href="http://www.microsoft.com/typography/otspec/name.htm" title="http://www.microsoft.com/typography/otspec/name.htm" class="link-external">http://www.microsoft.com/typography/otspec/name.htm</a>) as desired, or should the CSS spec give a clear guidance?</p>
      <p>And in the example that tries to reference <em>Minion Pro Medium Cond(ensed) Italic Display</em> shouldn't the code be a lot more straight forward? Something like this, perhaps:<br>
      <code>font-family: 'Minion Pro';<br>
      font-style: 'Medium Cond Italic Display';</code></p>
      <p>&gt; <em>[...] new variants in OpenType font warrants some new keywords on the ’font-variant’ property [...] but the exact list of keywords can’t be determined quite yet; it will depend on availability of fonts</em></p>
      <p>If by 'fonts' you mean 'free fonts', then that last sentence will be closer to the truth...<br>
      Fonts with OpenType layout features *ARE* available, and the keywords *CAN* be determined. The keywords can be based on the features already registered (<a href="http://www.microsoft.com/typography/otspec/featurelist.htm" title="http://www.microsoft.com/typography/otspec/featurelist.htm" class="link-external">http://www.microsoft.com/typography/otspec/featurelist.htm</a>), and there are already hundreds of fonts that implement a lot of these features (e.g. Minion Pro, Myriad Pro, the ClearType collection, Palatino Linotype [in Win2000 and up], etc.). This thread has several examples of fonts with OT features: <a href="/node/41231/" title="http://typophile.com/node/41231" class="link-kept">http://typophile.com/node/41231</a></p>
