    html: |-
      <p><em>(Yes, there’s the ’size’ OpenType feature which is to be used for controlling the Optical size, but that feature has an unique format and it looks like it was shoehorned into the GPOS table)</em></p>
      <p>David Lemon and I have chatted a couple of times about the possibility of deprecating the GPOS size feature, and replacing it with a dedicated 'size' table. I suppose extending the OS/2 table would be another option. I'll bring this up on the OT list, since spec updates are currently under discussion.</p>
      <p>I agree with your comments re. integer point sizes rather than names. However, one of the virtues of CSS is that it can produce dynamically scaleable layouts, so rather than having authors spec a particular optical size, I would much rather see browseres interpreting the CSS and then delivering an appropriate optical size of font, if available in the family, based on size, resolution and a 'size' feature or table entry. I suppose having explicit <code>font-opticalsize</code> syntax would be useful if one wanted to override the automatic size selection, but the first order of business should be to get the latter working properly.</p>
