      <p>What I think the non-coders are missing is that a lot of the design we are doing now IS XML-based, or approaching it. For instance, although not a design program, Microsoft Word now uses XML. </p>
      <p>XHTML and CSS is XML, so we shouldn't be too far off from having a design program that can automatically spit it out properly encoded text. No programming required.</p>
      <p>The issue is having a comprehensive enough CSS specification that covers more than the 80% of what we're talking about. IF, and it's a big if, we can get the specification to reach at least the level of sophistication of say, Pagemaker, that's a lot of design that can be accomplished.</p>
