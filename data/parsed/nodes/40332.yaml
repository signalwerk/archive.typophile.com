      <p><em>Yes, but most people don’t have [fonts with OpenType Layout features].</em></p>
      <p>Anyone with MS Windows Vista or Office 2007 has several font families with typical OTL features for Latin, Greek and Cyrillic text typography. I don't think the problem is lack of potential users in terms of numbers of people, but lack of users who understand the potential, and they are unlikely to grasp that potential until they see standardised style mark-up syntax to access the layout features, just as most people wouldn't have understood the potential of CSS without seeing it: you had to invent it and evangelise it.</p>
