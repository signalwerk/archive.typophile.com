    html: |-
      <p>Just to follow up on Miguel’s comments:</p>
      <p>The CSS model is that within a “family” fonts should differ only on weight, width and slope.</p>
      <p>The typographic reality is that within a “family” fonts differ on these metrics, on optical size, and additionally on arbitrary other variables indicated by arbitrary text strings in the name of the font style.</p>
      <p>Sure, the proportion of the world’s fonts that can’t be handed by adding optical size to weight, width and slope is less than 10%. But even 5% is a fair bit. And the omission of optical size makes it close to 10% of the fonts in Adobe’s type library that don’t fit the CSS model.</p>
      <p>Cheers,</p>
      <p>T</p>
