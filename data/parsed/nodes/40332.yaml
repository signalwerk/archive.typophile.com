      <p>I take it that none of us taking part in this discussion are legal professionals, and for that reason critiquing legal matters comes down to one peron's professional opinion versus that of the next.</p>
      <p>Arbo: <em>The fact that you and Adam both know how to obtain major commercial font products for free makes me wonder about your professionalism</em></p>
      <p>I did mean "wonder", not worry. It's fair to say I worry about people's morality, but that applies to the whole human race. Adam you defended your professional need to know the technical details of outline extraction, which is perfectly professional for your line of work, "And of course I have experimented with font extraction from PDF or Flash documents — how else would I be able to advise any of my clients (various font vendors large and small) on its viability." I wish to point out that I did not question that activity. I wondered aloud about the morality of a person in Dan's position knowing where to obtain illicit copies of major retail fonts. Apologies to Dan too. I was pondering the moral compromise inflicted on designers as an industry by the wonderous digital media revolution and all its foibles.</p>
