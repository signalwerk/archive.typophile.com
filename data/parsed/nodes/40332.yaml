      <p>The suggestion below would certainly make section <a href="http://www.w3.org/TR/CSS2/fonts.html#font-specification" rel="nofollow">15.2 Font specification</a> a lot more clear, IMO.</p>
      <p><code>font-family:</code> Microsoft platform string NameID 1, from 'name' table (<a href="http://www.microsoft.com/typography/otspec/name.htm" title="http://www.microsoft.com/typography/otspec/name.htm">http://www.microsoft.com/typography/otspec/name.htm</a>)</p>
      <p><code>font-style:</code> fsSelection, from 'OS/2' table (<a href="http://www.microsoft.com/typography/otspec/os2.htm#fss" title="http://www.microsoft.com/typography/otspec/os2.htm#fss">http://www.microsoft.com/typography/otspec/os2.htm#fss</a>)</p>
      <p><code>font-weight:</code> usWeightClass, from 'OS/2' table (<a href="http://www.microsoft.com/typography/otspec/os2.htm#wtc" title="http://www.microsoft.com/typography/otspec/os2.htm#wtc">http://www.microsoft.com/typography/otspec/os2.htm#wtc</a>)</p>
      <p><code>font-stretch:</code> usWidthClass, from 'OS/2' table (<a href="http://www.microsoft.com/typography/otspec/os2.htm#wdc" title="http://www.microsoft.com/typography/otspec/os2.htm#wdc">http://www.microsoft.com/typography/otspec/os2.htm#wdc</a>)</p>
      <p>So, for example, the font <em>Minion Pro Bold Cond(ensed) Italic Caption</em> could be described in CSS as:<br>
      <code>font-family:  "Minion Pro Cond Capt";<br>
      font-style:   italic;<br>
      font-weight:  700;<br>
      font-stretch: condensed;<br>
      </code></p>
      <p>This solution would work well for referencing fonts based on the <a href="http://developer.apple.com/textfonts/Tools/tooldir/TrueEdit/Documentation/TE/TE1sfnt.html" rel="nofollow">'sfnt' format</a>, which means all TrueType and OpenType (TT &amp; CFF flavors) fonts. To map the same set of properties to a Type 1 font, some heuristics would be required.</p>
