      <p>Dan <em>"...magazine or newspaper’s website using a proprietary Font Bureau salvaging of an obscure Benton typeface from the early 20th century."</em></p>
      <p>A little late with the idea, a little early with the style. ;</p>
      <p>Howcome: <em>"There, [close to the user], more information about the user’s environment is available, and the presentation can be optimized on a per-user basis."</em></p>
      <p>We are on the same track, Howcome, welcome.</p>
      <p>Howcome: <em>"I’m not sure I understand your question. Does your ’where’ refer to where in the document?"</em></p>
      <p>My 'where' Howcome is the user environment too. I understand you, Howcome, to be proposing that the name of the font be passed to the network (and little else), installed on the client's machine, and turned over to the OS (and nothing else). That proposal is not, in my opinion, complete to the task at hand and as the OS' continue to diverge in their treatment of 'the same type data', that solution becomes less complete over time. </p>
      <p>Besides being of concern to some type folk, your proposal implies that the consortium are not doing everything they can in this regard, nor are operating systems, browsers or foundries. Is this true!? But your proposal's scary to me because I can only 'lend' property in the form of a box of shapes, but not the intellectual property that makes that box of shapes into the words users expected and got, in print. </p>
      <p>Some say, I want to break it completely to fix it, but I don't. I want to expand the options from just letting the OS at it (ye olde single outline for the entire planet), to making the final font entirely via network (ye new bitmap for a single user), if required, with all the options in between available, if required (ye olde and new combination outline bitmap stoke font for the user with 4 screens on one desk). That's where we were pre-web and I think I can speak for 500 years when I say "We liked it, and it worked."</p>
      <p>It still works, as I've proved for numerous high-end screen font-craving clients, if I have all the answers I need, as opposed to lies, silence or being told I have pay for it. </p>
      <p>Cheers!</p>
