      <p>"That’s the day that I am happy, where I can spend my time on the visual end of design, rather than on wondering why the padding on this or that DIV is bumping this column over and breaking under IE."</p>
      <p>Alas, InDesign supporting valid XHTML and CSS won't fix the issues with a particular browser.</p>
      <p>The reason css isn't 'precise' is that it'd not designed to be. HTML + CSS is how one typically 'suggests' a visual presentation to the end user. It doesn't dictate it.</p>
      <p>The appeal of an app like Prince or a CSS-enabled InDesign is that it would allow you to dictate a layout for that one particular medium...in this case, a PDF. You'd still have valid CSS and HTML that may or may not render exactly as you want in any one particular web browser, but at least you'd have the full control over the PDF you are creating. The valid and portable and semantic HTML+CSS is then just a bonus that makes it easy to slap onto the web.</p>
