      <p><em>«So, the main challenge is probably deciding where one of the operations ends and the other starts, i.e. when should browsers stop trying to find the font that equals the specified properties, and start guessing which font would be the better match.»</em></p>
      <p>Font matching is described in some detail in CSS:</p>
      <p><a href="http://www.w3.org/TR/2007/CR-CSS21-20070719/fonts.html#algorithm" title="http://www.w3.org/TR/2007/CR-CSS21-20070719/fonts.html#algorithm" class="link-external">http://www.w3.org/TR/2007/CR-CSS21-20070719/fonts.html#algorithm</a></p>
      <p>As I see it, the problem is not in the algorithm itself, but in the input to the algorithm. What is the name of a font family? Is it «Minion Pro Cond Capt», «Minon Pro», or both?</p>
