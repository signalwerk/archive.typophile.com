      <p> <code>h1 { font-family: "mythesis" }</code></p>
      <p>If we are thinking within the context of server side fonts/Prince, I think this setup is ideal. We don’t have to be concerned about whether or not the target font is not on a user’s system, because we’re calling it from our own server. </p>
      <p>Obviously it doesn’t work if we’re trying to spec a font that isn’t on the end-user’s system, but that’s not what we’re dealing with here.</p>
