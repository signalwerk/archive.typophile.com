      <p>joeclark writes: <em>Håkon’s proposal is a good start from a nonexpert.</em></p>
      <p>I'd be happier without your compliments, Joe.</p>
      <p><em>But it still doesn’t let me choose TheSansB HT6 SemiBold with tabular ranging figures and alternate single-storey a.</em></p>
      <p>You can do all but the single-storey a. In general, CSS cannot apply styles to characters, only to elements. So, we need to find property values that can be applied to the whole element without causing unwanted side effects.</p>
      <p>I assume this code:<br>
      <code><br>
      p { font-variant-storey: single }<br>
      </code></p>
      <p>would be too general as it would apply to 'g' as well. Another option would be to introduce the functional notation which is used for some values:<br>
      <code><br>
      p { font-variant-storey: single(a) double(g) }<br>
      </code></p>
      <p>In order to justify the cost it would be to introduce, specify, implement and test this feature we need to learn more about multi-storey characters. How many characters come in multi-storey varieties? In cyrillic? Other scripts? How do fonts label these alternates? How consistent is the labelling? Do font APIs offer this information to applications? Across all platforms?</p>
