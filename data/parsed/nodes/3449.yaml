  html: <p>The idea that this typeface is based on the period of gestation and growth of a human baby. Each character has the ability to grow, but they all don't grow the same and equally; just like humans. They're all different.<img src="http://www.typophile.com/forums/messages/29/27896.jpg" alt=""></p>
