    html: <p>Hello, Heather.  <br> <br>Perhaps the first setting (least organic) should be more normalized. This might exaggerate the gestation process. For instance, you could start with simple (yet nothing round) shapes and they could be come more complicated (organic, curvy). My suggestion isn't so different from what you've done, I only suggest it because I wonder if there needs to be more contrast.</p>
