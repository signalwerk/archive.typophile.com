      <p>If you're still taking advice and critiques...</p>
      <p>I see two themes in the comments here that could lead you in strong directions:</p>
      <p>1) The type in both examples is retro, not contemporary. Avoid type that screams 'I am from X decade!' (Also, choose type that's either the same family, or has more contrast than your first example.)</p>
      <p>2) Explore the technology further. Both sound and fiber optics have threading/weaving curves. Your design could take so many vibrant and energetic directions based on that alone. The unique aspect is the packeted data. This, to me, suggests mindfully breaking the curves into segments, which could set your logo design apart from other wave-based logos. There's a lot of simple, modern potential here, particularly with elegant curves and figure-to-ground tricks using breaks in the curves.</p>
      <p>Let the type and the mark coalesce through your explorations. The visual potential here is probably strong enough to lead the type choice.</p>
