      <p>Thanks for the comments! I was not too pleased with the Fiberpack Audio typeface myself. It is actually just a modified Gill Sans, but it didn't quite turn out how I thought it would. The letterspacing is a client request. He showed me some examples of other designs he liked and pretty much all of them were letterspaced. But I would certainly be open to some ideas on how fill out the horizontal space of this businesscard without it.</p>
