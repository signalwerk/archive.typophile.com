      <p>I agree about getting away from the keyboard. Also, avoid the standard font list, if you can. It's not helping.</p>
      <p>The new designs are better, without a doubt. I'm not so sure about #6. It doesn't read as an 'F' to my eye and it might be too much hassle to make it work (but that's for you to judge). As for #5, it's definitely going in the right direction, but the fibers are very wispy and fragile looking. They look a bit cluttered, and at small sizes a logo like that will fall apart. The thick-to-thin as they curve is very nice, but make each thread a bit thicker and make the group more orderly. I'm not digging the Optima, either. I'd go with something more geometric and constructivist, actually (closer to what you used in the bar code business card). Or, a nice, clean contemporary serif font.</p>
