      <p>One of the best things about printing on a mid tone background is that black and reversed out type works well if you print it as a two colour job. To me your layouts look a little too much like the back of a credit card. Try an asymmetrical layout. The later logo using that bauhaus type is not a good choice for modern/clean.<br>
      From a type point of view in the telephone numbers consider raising the braces and the dash so that the numerals aren't bursting from the top and individually kern them the space around the 1s is too great whereas the at symbol in the e-mail address is large.<br>
      Tim</p>
