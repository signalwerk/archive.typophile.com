      <p>I would suggest stepping away from the computer right now. It seems like your client needs a logo first, a business card second. Do some research on their business, what fiber optics are, what the client's business goals are, competitor's logos, etc. Then get a pad of paper and sketch. It doesn't matter if you can't draw. Just get some ideas quickly on paper. You'll find that ideas will start to form out of each other. It may go slow at first, but if you keep trying you'll hit that magic point where things just flow. </p>
      <p>Aim higher than these fairly mundane examples you have shown. It seems like you are just opening the font menu and scrolling through your fonts, finding something that looks interesting and trying to force a concept to fit around that font. You need to come up with a solid concept first, that will make choosing your typeface much easier.</p>
      <p>Good luck.</p>
