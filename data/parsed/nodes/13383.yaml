    <p>My second matter of business (I couldn't wait to post again!):</p>
    <p>A Business card and logo design for a digital audio design firm called FiberPack Audio. As you can guess by the name they specialize in fiberoptic packetized transmission of digital audio, specifically multichannel as in broadcast stations and concert halls.</p>
    <p>They wanted something very cool and modern, with a simple layout, emphasizing the form as the design. Somewhat of a cross between an architecture firm and a modern art gallery design.</p>
    <p>I went for black text on a grey card to give that concrete wall feel.</p>
    <p>Let me know what you think:</p>
