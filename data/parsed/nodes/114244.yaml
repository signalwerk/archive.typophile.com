    html: |-
      <p>Well Fernando, all I can say at this stage is that you have a real collector's item. Unfortunately somebody "broke the sort" on this font and got rid of the letters piecemeal. The design is attractive and would make a good digital font, but it would be a great help if there were some more letters.<br>
      Same applies to the thick capitals in the middle row, which have some similarity to Binner <a href="http://www.myfonts.com/search/binner/fonts/" title="http://www.myfonts.com/search/binner/fonts/">http://www.myfonts.com/search/binner/fonts/</a><br>
      I take it you purchased the letters in South America. So they could be designs originating in the US, England or continental Europe, or even in South America for that matter.<br>
      If you find any more letters that seem to match either font It would be wonderful if you could share them with us.<br>
      Don</p>
