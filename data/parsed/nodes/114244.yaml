      <p>Hi Fernando, good news! I found the g with the open lower bottom bowl -- and the rest of the font too. It's a woodtype from Tubbs &amp; Co. cira 1900, that Dan X. Solo purchased in one of his type collecting expeditions and later digitized as Valjean <a href="http://www.myfonts.com/fonts/solotype/valjean/" title="http://www.myfonts.com/fonts/solotype/valjean/">http://www.myfonts.com/fonts/solotype/valjean/</a>.<br>
      Possibly the other type in the drawer is also from Tubbs &amp; Co.? I wonder if there is a Tubbs &amp; Co. specimen book anywhere?<br>
      Don</p>
