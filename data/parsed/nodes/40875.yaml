  - id: 251743
    user: 25732
    date: 2008-01-14T16:19:00
    date_raw: 14.Jan.2008 4.19pm
    votes: null
    html: <p>I really like the voice and legibility of Chronicle, but I’m finding that it shows kerning much more readily than, say, Minion might. I think other faces may have a bit more flexibility in that regard. Not that it’s a bad thing at all, just that it is something to bear in mind if you’re planning to use it extensively or if your layout has narrow columns; fitting copy is going to depend more on editing the language of the text than fudging with kerning and leading.</p>
