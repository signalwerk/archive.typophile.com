    html: '<p>@hrant: That’s a perfectly valid answer as it lets the asker know that you learned it through repeated exposure and memory. Not by asking the internet. I know you’re not a fan of <a href="http://en.wikipedia.org/wiki/Rote_learning">rote learning</a> but unless you have <a href="http://en.wikipedia.org/wiki/Eidetic_memory">eidetic memory</a>, that’s <em>exactly</em> how you learn how to ID typefaces. And by you, I mean you, and everyone else (savants aside).</p>'
