      <p>I think if you want to use a kind of generic “old poster” font, you could look at the Knockout series. These kinds of fonts were often used with Open Air concerts in the past.</p>
      <p><a href="http://www.typography.com/fonts/font_styles.php?productLineID=100013" title="http://www.typography.com/fonts/font_styles.php?productLineID=100013">http://www.typography.com/fonts/font_styles.php?productLineID=100013</a></p>
      <p>These will likely not fit with Electronica, but anything from classic rock to blues and jazz works quite well with this font. And there is a huge variety of cuts and widths available.</p>
