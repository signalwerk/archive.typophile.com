    <p>Any suggestions for a typeface or typeface pairing for an iOS app that will list events based on local music venues?</p>
    <p>I'm thinking something sans condensed for headings that relates to venue signage plus something for event details that'll hold up at small copy size. Open to any suggestions though.</p>
