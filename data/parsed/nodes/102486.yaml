    html: <p>Shamelesserly, ideal references to several American vernaculars, depending on the time period requested, for iOS apps, coming in recommended size masters, for text and UI, sizes at which type cannot get too vernacular, and heads, where anything goes, are available for trial and distribution and may be found via webtype.com, e.g. Other American and musical vernacular types are available for iOS from Typekit, Fontshop, Monotype &amp; many others followed by .com, I'm pretty sure.</p>
