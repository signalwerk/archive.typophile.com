    html: |-
      <p>thank you all for the suggestions thus far.</p>
      <p>I really like H&amp;FJ's Tungsten for heads (the condensed could be useful to prevent long names from wrapping) and was thinking it would pari reasonably well with Gotham.</p>
      <p>Then I looked at their license terms and seemingly they do not offer licenses for embedding fonts in mobile apps as of now. I sent an email asking about this but have received no response.</p>
      <p>Anyone know of a comparable (or near comparable) pairing to Tungsten and Gotham that WOULD be available to embed in an iOS app?</p>
