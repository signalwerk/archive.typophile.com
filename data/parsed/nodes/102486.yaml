      <p>Totally agree on your take, and nevertheless... I'm still asking the question.</p>
      <p>I am not looking for a typeface that says "Music!" as I agree that's not possible. I mentioned the app theme only for context. If anything.. I am thinking something that might reference the vernacular of america theater and concert hall marquees. The app with be featuring only american venues and at that on a city by city basis.</p>
      <p>If I had to answer my own request in generic terms.. I would say I am looking for a condensed sans or possibly slab and a complementary text face suitable for information copy in small text sizes.</p>
      <p>Hopefully that helps define my request a bit more. Are there any specific typeface suggestions that would satisfy the generic terms I outline above?</p>
