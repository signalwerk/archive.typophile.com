    html: |-
      <p>Music is such a broad topic. Are you talking about Open Air rock concerts or small neighborhood Jazz clubs? Arias in operas or chamber concerts in old church attics? Punk, trash, industrial or alternative Rock? Electronica? I haven't even touched the surface of the iceberg here. All these different music styles involve all kinds of typographic interpretations.</p>
      <p>Have a look at the new (current) David Bowie album, <em>The Next Day</em>. Would you characterize a dry sans serif as typical for his rock?</p>
      <p>Design using typefaces is really what you make of it, rather than a specific font associated with a broad type of expression like <em>music</em>. In other words: every font can work, if you make it work.</p>
