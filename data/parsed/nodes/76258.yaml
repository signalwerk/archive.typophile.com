      <p>If you have high quality analog artwork, then hand digitizing with something like an Aristo tablet and Ikarus makes sense. Drawing directly on-screen using Ikarus splines is a nightmare.</p>
      <p>Ikarus was the first font development program I worked with but I would never go back. IMO bezier curves are much easier to handle than Ikarus splines.</p>
