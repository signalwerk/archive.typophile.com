    <p>I think I have a question about Ikarus, but having a difficulty in expressing the question, I am putting the question in the form of a statement.</p>
    <p>One of my earliest posts to this forum was a complaint about certain characteristics of the True Type and Adobe Type 1 font formats, as well as digital font creation tools like FontMonger and Fontforge. I felt it would be helpful if one could specify the locations of points digitally after working them out on paper, and that it would be nice if one could choose conic sections instead of always only Bezier curves.</p>
    <p>Someone responded with the correct deduction that I am no professional type designer.</p>
    <p>But looking randomly at other sections of the site besides the forums, I saw something mentioned in the wiki which I researched further elsewhere.</p>
    <p>A program that started out using circles (but later added Bezier curves as an option) also had other interesting features. One could copy and paste pieces of a character, such as the serifs. One could mark "guard bands" that would not be squeezed as one adjusted the width of the character as a whole.</p>
    <p>This is, of course, Ikarus from URW; it sounds like something that has the features needed to make creating type on a computer a manageable task. Of course, it is no doubt expensive to license, but it appears to be worth the price, being used by the major typefoundries.</p>
    <p>Has it really been largely superseded by today's font design programs, or are its extra features not really that important... am I mistaken in thinking that the designers working for the companies that use this technology have an advantage?</p>
