      <p>Hi there,</p>
      <p>If you want to experiment with this sort of splines, you can download and install the free version of DTL´s FontMaster. Ikarus Master, the latest incarnation of Ikarus is part of the suite.</p>
      <p><a href="http://www.fonttools.org/" title="http://www.fonttools.org/">http://www.fonttools.org/</a></p>
      <p>The free version allow you to create and generate font with up to 256 characters. More than enough to play around and learn something about it. The workflow is rather different than in FontLab and Fontographer, so you will have to get accustomed to it (download the manual also).</p>
      <p>As an alternative, if you happen to have a FontLab license, you can use its "Sketch Mode" where PS splines are converted to an imitation of Ikarus splines. It is not as precise as Ikarus, but it worth trying if you like the enviroment...</p>
      <p>Cheers.</p>
      <p>Ramiro.</p>
