    <p>Hi Folks,</p>
    <p>Long time lurker first time poster. I have been tasked with rebranding a private bus company. The rebrand will include Identity, Bus Information (Timetables, Bus Flags, Information Posters, Corporate literature). </p>
    <p>Have been looking at Sans Serif Type all night (Looking at major bus public bus companies like TFL etc, Johnston, Din, Transit) but am looking for something relatively new with a least four different weights. Can anybody recommend a typeface that might fit my needs? Its a very exciting project to work on and I really want to get of to a good start by nailing the Typeface.</p>
    <p>I appreciate and am thankful for any advice give.</p>
    <p>P</p>
