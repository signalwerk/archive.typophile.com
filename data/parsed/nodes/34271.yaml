    html: <p>I bought a few lights, shot on white formica, and had pretty good results. You can also use white posterboard or foamboard to use as reflectors. You may be able to get away with reflectors if there’s enough natural light, but a few lights will make a big difference. Example below.</p><div class="imageWrap"><img src="/web/20081011053840im_/http://www.typophile.com/files/sample_4559.jpg"></div><p></p>
