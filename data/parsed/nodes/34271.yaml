    votes: null
    html: |-
      <p>On the cheap lighting solutions are much more available now that CFLs are becoming common. Look for Daylight rated bulbs like the <a href="https://web.archive.org/web/20081011053840/http://genet.gelighting.com/LightProducts/images/t03/0000003/r03080v29.jpg">GE Energy Smart CFL</a> bulbs. </p>
      <p>You can get a few of these, and some (2-3)utility spot lights (clamp style). </p>
      <p>If you have a tripod, set up a blank location on a wall in a darkened room with a piece of Black or White mat board. Attach your work to the mat board and then set up your tripod about 3-6 feet away. using 2-3 spotlights with your daylight CFLs, aim them so that they’re roughly 30-60 degrees to the artwork and on each side (this will eliminate any glare or shine). </p>
      <p>Do a search on Google for Copy Photography. I’m sure there’s other useful tips, like manual settings.</p>
