  html: |-
    <p>im struggling to photograph our graphic work for our website, i have no access to a studio or lighting so have been relying on natural light and a Nikon D50 and its just not looking very good. Anybody got any tips on pulling off a professional job with limited equipment, im prepared to invest in a couple of photographic lights if really necessary, but would interested in any cheap alternatives.</p>
    <p>Many thanks </p>
    <p>Ed</p>
