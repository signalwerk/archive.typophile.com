  html: |-
    <p>The font for the word "Energizer" looks like it's Helvetica LT Condensed Black but I have no idea what the other font is. I've asked for a better copy of their logo but they keep sending me tiny, useless images (not vectors).</p>
    <p>Any help would be greatly appreciated, thanks.</p>
