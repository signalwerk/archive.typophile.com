    html: |-
      <p>Thank you SO much!</p>
      <p>The Energizer is definitely some form of Helvetica. I was able to use LT Condensed Black Oblique with just a little tracking and kerning the sides of the "i." It matches almost perfectly. (Blue is my version over the black original).</p>
      <p>Thanks again!</p>
