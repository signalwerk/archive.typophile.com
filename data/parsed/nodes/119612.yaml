    html: |-
      <p>Perhaps an example can be found in plays by Harold Pinter ... the "Pinter pause"... he often provided stage direction in two different formats: 1. directing "silence" rather than pause ... 2. text [space] ... [space] text</p>
      <p>Southpark scripts use the direction of "silence"</p>
