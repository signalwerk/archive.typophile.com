  html: |-
    <p>Something like:<br>
    <em>"Why did the chicken cross the road? [...]<br>
    To get to the other side."</em></p>
    <p>A normal ellipsis doesn't seem to convey enough and emphasizing it (using brackets here) looks a bit much. And it's confusing, like the intent is to remove text.<br>
    Is there a more eloquent way to represent this?</p>
