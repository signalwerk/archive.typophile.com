    html: |-
      <p>An ellipsis can be used to signify several things and a pause is one of them. A long pause could be indicated by your choice of words. </p>
      <p>Don't think most fiction has lots of pauses in it, but if you're writing instructions (like how to tell a joke) you could just say "pause here".</p>
