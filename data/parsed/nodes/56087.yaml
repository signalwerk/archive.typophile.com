      <p>IMHO ḫaṭṭ ṭibāʿī [khatt tibaa`ii] خَطّْ طِبَاعِی (typographic script) is an accurate term for "typeface", since it describes the result, just like typeface does.</p>
      <p>The term bunṭ [bunt] بُنْطْ, on the other hand, is an accurate description of "font", since it refers to an aspect of typographic craftmanschip. "Font" is a corruption of the older "fount". the result of founding molten lead. Bunṭ بُنْطْ can hardly be Arabic or even Semitic (although the absense of an etymological dictionary of Arabic remains embarassing), as can be inferred by the absence of any other derivations of the BNT root within Arabic, as well as the complete absence of the BNT root anywhere else in Semitic languages. Rather, it appears to be the word "point", "punkt". "punto"  or even "punt" as a European term of size in typography.</p>
      <p>PS - this web site should support Unicode! My Arabic transcription appears to be clobbered by this font.</p>
      <p>Thomas Milo<br>
      DecoType<br><a href="http://www.decotype.com">www.decotype.com</a></p>
