      <p>The DT Naskh typeface licensed by Microsoft (1994) and Apple (1997) consisted of 5 fonts. The much more elaborate DTP (DecoType Professional) Naskh typeface launched in 1996 consisted of 31 fonts, DTP Naskh typeface in PageMaker (1997) consisted of 10 invisible fonts, controlled by an interface, the DecoTypeSetter control panel, the precursor of today's elaborate Tasmeem interface for ACE fonts.</p>
      <p>So much for the difference between a typeface and a font.</p>
      <p>Thomas Milo<br>
      DecoType<br><a href="http://www.decotype.com">www.decotype.com</a></p>
