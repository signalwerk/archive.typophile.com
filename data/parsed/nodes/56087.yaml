      <p>I am for either of خط طباعي or بنط </p>
      <p>I prefer بنط because I would like to use one word not two, and I can pluralize it easily. I agree with Tom's and Vladimir's explanations that بنط must have been derived from "point" as in point size.  But this should not matter as even in Latin the popular word "font" used today was only referring to a specific point size of a type before taking over in the terms type or typeface after computers, and therefore it is not an accurate term in its current usage. Arguments constantly flare about it and other terms.</p>
      <p>One can argue, if we can Arabize "point" for font, why not Arabize the word "font" itself. Using فونت or فونط would then be equally valid.  Here is what I would use to translate the terms:</p>
      <p>Font: خط طباعي or بنط</p>
      <p>Fonts: خطوط طباعية or ابناط</p>
      <p>Type: خط طباعي or بنط</p>
      <p>Typeface خط طباعي or بنط</p>
      <p>Types Style نمط الخط الطباعي or النمط الحرفي</p>
      <p>Font Family  عائلة الخط الطباعي or عائلة الابناط</p>
      <p>Type Family عائلة الخط الطباعي or عائلة الابناط</p>
      <p>-Saad</p>
