      <p>&gt;&gt;Font? or typeface?</p>
      <p>Letting formal definitions aside, the market today had *redefined* these terms following computers and the digital revolution when typefaces and fonts became products utilized daily by millions of average users too and not the limited community of typographers as they were before.</p>
      <p>Among typographers, font referred to a specific size family member of a typeface. Today "typeface" *is* being used interchangeably with "font" and I see no problem with that. The market has its independent force. Sometimes I feel we should accept reality and retire the term typeface to the typography history books, even though  I like "typeface" over "font family".  </p>
      <p>&gt;&gt;Is Typeface use to mean “Font Family”?</p>
      <p>Yes.  </p>
      <p>-Saad</p>
