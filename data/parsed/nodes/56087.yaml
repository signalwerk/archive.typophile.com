      <p>Hassan</p>
      <p>&gt;&gt;I am with Vladimir in “I recall the use of بنط to mean point size for example “12 بنط”</p>
      <p>The idea here is to first use as much native Arabic words, and second if we need to Arabize Latin words we should do that when there is no escape. I think Arabic has a good word for "point size", which is حجم . Why not using it instead? Those who originally used بنط for size did not need to just as the Gulf Arabs today use فليت instead of شريحة!!</p>
      <p>But since بنط is used any way and فونت is not Arabic anyway, I think بنط can be used OK. As for how to pronounce it, just add it to the many Arabic words that must remembered without diacritic vowels.</p>
      <p>ٍ<br>
      &gt;&gt;So, the could term of Font is “الحرف الطباعي”.</p>
      <p>You meat الخط الطباعي as الحرف الطباعي is not accurate or informative term.</p>
      <p>-Saad</p>
