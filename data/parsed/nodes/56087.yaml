    <p>There was a discussion recently on the Arabic word for "Font" these were suggested:<br>
    حرف مطبعي1<br>
    خط مطبعي2<br>
    حرف طباعي3<br>
     خط طباعي4<br>
    بنط5<br>
    I like No. 1 because حرف is an individual letter as an independent unit, while خط suggests a script. Which do you prefer?  What other technical terms related to typography have multiple Arabic names or are not yet properly defined? For example light, bold, condensed etc.  You are invited to discuss these matters here, or to post your lists of suggested Arabic typography terms.</p>
