    <p>This font was used in the creation of a logo and I'm not sure anybody knows what it is anymore. All graphics using it appear to be small / low res and image based now.</p>
    <p>I have found a number of fonts that look similar like 'Sneakers Pro Medium Oblique' however the 'Y' appears to be very unique especially with this font.</p>
