      <p>Here are some points about the Icelandic glyphs. I have written about this for regular fonts ( <a href="http://font.is/2007/03/letur-the-making-of-thorn-thorn-eth-eth/" title="http://font.is/2007/03/letur-the-making-of-thorn-thorn-eth-eth/">http://font.is/2007/03/letur-the-making-of-thorn-thorn-eth-eth/</a> )but not yet for script fonts.</p>
      <p>Eth. Should be based on the D. Same metrics should apply. The stroke usually is fine from the hyphen but sometimes it's better to watch the crossbar on the H.</p>
      <p>eth. This one is the hardest. Usually I base it on the o. In script fonts this can be tricky as the tail up needs some thickness that needs to be balanced against the stress on the other side of the o. No connection to next glyph, because when you are writing you interrupt the process when you to the stroke. Well, some delay making the stroke until the word is done but this connection looks really odd when the eth is the last character (which is very common).</p>
      <p>Thorn. Based on the P with the belly positioned in the middle or just above. Size of the belly may be a little bit bigger then the P one, but balance is what counts.</p>
      <p>thorn. Based on the p with the stem going as high as the descenders. In script fonts the belly can be either like the one on the p but I find it usually nicer to make it rounder, draw the stroke to the stem and then back into a connection. Taste applies.</p>
      <p>The other Icelandic glyphs are Yacute and yacute. Should use same metrics as Y and y.</p>
