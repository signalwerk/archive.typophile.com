      <p>Looking at the letters of Restraint, I'm getting a strong Copperplate vibe. But most fonts in that style don't have a lc. Except maybe this thing:<br>
      <a href="http://new.myfonts.com/fonts/fontry/copper-penny/" title="http://new.myfonts.com/fonts/fontry/copper-penny/">http://new.myfonts.com/fonts/fontry/copper-penny/</a></p>
      <p>Also consider:<br>
      <a href="http://new.myfonts.com/fonts/typetrust/diego/" title="http://new.myfonts.com/fonts/typetrust/diego/">http://new.myfonts.com/fonts/typetrust/diego/</a><br>
      <a href="http://new.myfonts.com/fonts/bitstream/itc-newtext/" title="http://new.myfonts.com/fonts/bitstream/itc-newtext/">http://new.myfonts.com/fonts/bitstream/itc-newtext/</a><br>
      <a href="http://new.myfonts.com/fonts/bitstream/itc-serif-gothic/" title="http://new.myfonts.com/fonts/bitstream/itc-serif-gothic/">http://new.myfonts.com/fonts/bitstream/itc-serif-gothic/</a><br>
      <a href="http://new.myfonts.com/fonts/parkinson/modesto/" title="http://new.myfonts.com/fonts/parkinson/modesto/">http://new.myfonts.com/fonts/parkinson/modesto/</a></p>
      <p>BTW, when choosing the two fonts, it would be nice if they looked like they belong together (although you might -possibly rightly- be counting on Restraint to act as a glue). This might be more important than making two independent good selections.</p>
      <p>hhp</p>
