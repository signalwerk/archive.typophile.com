    <p>I am looking for two typefaces to pair with <a class="freelinking external" href="http://www.tiro.com/Restraint/index.html" rel="nofollow">Restraint</a>. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/restraint_example_6362.jpg"></div><p></p>
    <p>First a font to match the mono-linear loopy feel of the ornamental stuff. Right now I am using <a class="freelinking external" href="http://new.myfonts.com/fonts/dstype/estilo-script/" rel="nofollow">Estilo Script</a> and I am more or less happy with that, but I am wondering if there are any better options out there. It could be either sans serif or script.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/estiloscript-example_4566.jpg"></div><p></p>
    <p>Second, a font that feels similar to the letters in Restraint. I am not looking for an exact match, just something similar in weight and structure. Spiky serifs would be nice too.</p>
    <p>Any ideas are appreciated.</p>
