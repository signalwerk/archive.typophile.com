    html: <p>No insult taken. It's just fun to pull your leg. Just so that you know, Copper Penny was designed for usage on signs. The weight and heavier serifs aren't destroyed during routing, sand blasting or vinyl applications. Most versions of Copperplate Gothic don't work very well for the sign industry because of weak serifs. This wouldn't be an issue except it is a very popular font for architectural signs.</p>
