    <p>Hi typohiles,</p>
    <p>I'm considering buying the full Minion Pro Opticals font package. However, looking at offerings form different foundries, prices seem to differ quite drastically, e.g., Adobe wants 350,00 € while FontShop only charges 233 €.</p>
    <p>So, what's the reason for such huge differences? Is it just competition or are there actual differences in the font quality/version/features? Or might it be due to different licensing conditions?</p>
    <p>I hope someone can shed some light on this, since I really would not like to spend such money on a lower quality font or something like that...</p>
    <p>Regards,<br>
    Hans</p>
