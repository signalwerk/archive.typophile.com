    html: |-
      <p>For whatever it's worth, it should be the same fonts in both cases. FontShop gets its Adobe fonts through Monotype, and Adobe has supplied Monotype with the latest versions. (There was some delay on Monotype's end in shipping them, but with any luck they are now.)<br>
      The only difference should be in the license. Adobe has one of the more permissive licenses in the business, allowing commercial use, embedding for e-books &amp; Flash, and modifications for private use - none of which are covered by Monotype's EULA. Neither EULA covers web font use.<br>
      Good luck!</p>
