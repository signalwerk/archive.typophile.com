    <p>It seems far more common that usual seeing non-profit organizations using proprietary typefaces in their brand manuals, and i really struggle seeing volunteers buying these typefaces for contributing with graphic design materials (such as posters, flyers, magazines, videos, etc.) using them.</p>
    <p>What is the most correct thing to do instead? To do a whole rebranding, replacing all proprietary typefaces with ofl/apache/cc-nc-sa/gpl licensed typefaces? look for the master drawings of the existing typefaces and make an experimental reinterpretation of them using ofl/apache/cc-nc-sa/gpl licensing? contacting the actual foundries and authors of these proprietary typeface asking for using and interventions on these typefaces? should volunteers completely ignore the organization's brand manual when relating to typefaces when proprietary?</p>
    <p>I'm curious about, not only for your opinions, as well about references citing or approaching situations like this. Thanks!</p>
