      <p>Another option is to have a kind of "typesetter" for putting out the final product. I'd argue that Gaussian distribution for "typesetting skill" will be the norm. Moreover,  with volunteers, that old, familiar bell-shaped curve will be rather farther along the "not quite so good" axis.</p>
      <p>So, for either complex or "branded" (?) material, the files should go to someone with skill, mirroring the author -&gt; editor -&gt; compositor chain found in the commercial world. Only the "compositor" needs the actual, for-money fonts. The compositor(s) can be  volunteer(s), of course, the point is only her (their) machine(s) need the high-dollar fonts.</p>
