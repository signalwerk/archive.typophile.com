      <p>I’d ask the organization if they can give you a license for the fonts in question. There are (even ‘proprietary’) licenses that allow this.</p>
      <p>Just because an organization doesn’t work for profit doesn’t mean they cannot spend any money on anything. Or are they using open-source offices/water/electricity as well? ;)</p>
      <p>I’d say if the organization requires usage of certain fonts but cannot supply their designers with them, they have been given bad advice by their branding agency.</p>
