    html: "<p>Keep in mind that many of Letterhead's fonts are contemporary American sign painter interpretations of Victorian style. They are very expressive, but not necessarily the most authentic source. I would look at books published during the era you're interested in for a more accurate representation of what was going on at the time. Like Jon said: time for a trip to the library!</p>"
