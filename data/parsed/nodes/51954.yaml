      <p>Letterhead Fonts always have AWESOME fonts! Thats the best site for buying unique fonts, at least that I know of...besides that I suggest you scour the internet for old book covers/posters/whatever from the Victorian era or hit the library. You can also search for type specimen books from that era.<br>
      Hope this helps.</p>
      <p>JonE.</p>
