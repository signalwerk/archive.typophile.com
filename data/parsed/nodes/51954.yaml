  html: |-
    <p>Hi there,</p>
    <p>I have been searching on the internet for examples or sets of victorian, edwardian, turn of the century i.e vintage fonts.  Does anyone here know where I could find some, I don't even mind if it is just examples of typeface or book covers (actually that would be interesting!) , I don't need to download it, have a set of typefaces to work with, I just need a source of examples/a few words as I can easily copy it by hand from the computer screen and make up the rest of the lettering.  Any ideas?</p>
