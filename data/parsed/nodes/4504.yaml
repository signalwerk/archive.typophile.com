    html: <p>This is not a font, it's lettering.  <br> <br>Notice how some of the characters (c, a, h, etc.) vary. Notice also how tight the spacing is, how some of the characters are tucked under others. This is from the days when metal type ruled. Hand lettering was a popular way to overcome its limitations and get unique headline treatments. <br> <br>The basic style is modeled on Caslon, but I don't think you will find any good matches among available fonts.</p>
