      <p>Thank you all for your responses/advice, I cannot express just how much this has helped - it is really appreciated. </p>
      <p>Thank you also for the typeface suggestions; as I already own a copy of Myriad Pro (Adobe), I've decided to use this typeface for the text body (or at least see how it goes).  After doing some quick tests/experiments, it looks quite good when exported as a PDF and it also seems to hold its shape/colour when using the zoom function in Acrobat (which was frustrating me greatly, when trying out many typefaces). </p>
      <p>/ / </p>
      <p>I'm currently studying an introductory course in Graphic Design and my current project is a 4 page magazine spread - which is to be submitted in PDF format. </p>
      <p>My spread is to be based on an Interview with an Artist (Killian Eng), I wanted to use the images as the highlight/main showcase of the spread - with only the use of two different typefaces for the text for contrast (sans + serif), along with the idea of keeping the text looking subtle and clean (if that makes sense)</p>
