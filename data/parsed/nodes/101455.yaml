      <p>cbkinetic... perhaps a way to translate what the above comments seem to suggest:</p>
      <p>1. Choosing a type is part technology, part communications art, and part ego...</p>
      <p>2. The technology part is basically first defining what specific medium in which you plan to communicate... type reacts very differently on paper (and various types of paper) versus screen (including pdf for viewing and/or pdf for printing). Depending on the type of paper, readability is a primary factor (certain types of paper soak up ink, whereas other types of paper might make certain typefaces toooo crisp and draw attention to the type). Choosing type for screen is also a challenge. Typically, Sans-serif are used for body text... but modern technology is beginning to blur this concept. </p>
      <p>Helvetica is not generally regarded as being a typeface suitable for long body text because it is a bit too dense... if you are looking for sans as a body text, then look more toward Fakt (OurType) (diverse, has several alternate characters that changes Fakt from grotesque to neo-grot {like helvetica, but much better}, to humanist), Walbaum Grotesque Book (Storm Type), Myriad Pro (Adobe), Greta Sans (Typotheque) (excellent for newspaper), FF Milo, and the like...</p>
      <p>3. Each one of the types mentioned above possesses a natural "voice" or "color"... you need to be clear about what voice the audience is wanting/needing to hear from you...</p>
      <p>4. Ego comes into the picture when you or the audience simply 'tire' of a certain typeface, and you want something in the same "voice" but a bit different or new...</p>
      <p>Don't let these old guys intimidate you... they were once young and wet behind the ears... the journey has to begin somewhere... keep us apprised of your progress...</p>
      <p>Cheers.</p>
