      <p>One of the things that seems hardest for people to get their heads around is that printed mater will look different, not only than from how it looks on the screen, but from what materials and techniques were used in printing.</p>
      <p>The way paper takes ink -- and ink itself -- varies.  Taking the second first, the dry ink (toner) from a laser printer is quite different than the "wet" ink from an offset press. This is more than just the color, more important is how the ink disperses.</p>
      <p>Paper too affects the ink absorption/dispersion. Even limiting oneself to the offset press, ink spreads more with an uncoated sheet than with a coated one.</p>
      <p>Understanding this, being able to select the right fonts for the materials &amp; processes used, is a matter of experience. I don't know any shortcuts aside from looking at what "goes in" and taking note of what "comes out. " </p>
      <p>* * *</p>
      <p>By the way: you didn't ask, but halftones too are affected by paper choice. The dynamic range of a halftone on an uncoated sheet is about 10:1 (arithmetic). A coated sheet will take that to 20:1 or 25:1, primarily in how black you can get, though whiteness too is a factor.  The dynamic range of your computer monitor depends on ambient light in the room and how much hits the screen, but 100:1 can be achieved.</p>
      <p>It follows that preparing halftones for printing requires knowing in advance how they will be printed. You'll make different choices in bringing out shadow detail depending on the black point of the ink on a particular paper. Take a loupe &amp; look at a "black" headline on a newspaper -- you'll be amazed at how much white you see, where there isn't suppose to be any.</p>
      <p>This can kind of be pre-planned, but the tools to get a good ICC profile are not cheap, and measuring "what comes back" requires making some of your own tools -- I know of no commercially available ones.</p>
      <p>Daunting, isn't it?</p>
