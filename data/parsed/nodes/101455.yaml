    <p>Hi, </p>
    <p>I've seemed to have gotten myself completely confused ..</p>
    <p>Using Indesign;<br>
    While practising/testing different Typefaces to use in a Magazine, I've been emulating different Magazine Layouts - to try and get a similar result etc.  (this is usually the best way for me to learn, I'm a beginner.) </p>
    <p>E.g. Juxtapoz Magazine - the body text ID is Helvetica Neue Light 45<br>
    (I think)</p>
    <p>Image of Magazine:<br>
     <a class="freelinking external" href="http://samanthagrego.files.wordpress.com/2011/05/j4.jpg" rel="nofollow">http://samanthagrego.files.wordpress.com/2011/05/j4.jpg</a></p>
    <p>When exporting a PDF - the font doesn't quite look the same/the result isn't what I was hoping for. </p>
    <p>Is this simply because the printed text will always look different to the PDF version ? </p>
    <p>Or am I completely missing something ?</p>
