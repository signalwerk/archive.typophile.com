    <p>Hey Guys,</p>
    <p>I was wondering if anyone could help me. I am looking into the use of Bevel fonts (see example image below) and I am struggling to find a history of the font - where it came about/why it came about/any decent foundries that specialise in Beveled fonts.</p>
    <p>If anyone knows anything about Bevel fonts i'd really appreciate it. </p>
    <p>Thanks,<br>
    Robyn</p>
