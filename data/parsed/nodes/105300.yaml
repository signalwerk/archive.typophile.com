      <p>Hi Robski. What have you found so far? You will find you have <strong>significantly</strong> greater success eliciting assistance if you can demonstrate what you have accomplished on your own. You may also wish to consider using your real name as your screen name. It used to be somewhat of a convention here, and it has been my experience that it results in being taken a little more “seriously.” It also makes addressing people by name easier and less confusing, but that’s a personal decision.</p>
      <p>Good luck, and may the fonts be with you™.</p>
