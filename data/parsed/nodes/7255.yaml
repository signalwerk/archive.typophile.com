    html: "<p>Hi Thomas, <br> <br>what Christopher meant was to take away something of the \"r\"'s nose. It might be in the grid, since the end of the stroke is on same height as the \"spine\" of \"s\" or the \"crossbar\" of the \"e\". But it is just irritating, like it would fall to the right and touch the ground with its nose. <br> <br>Improve your curves a bit, they're of track. Check out the typedesign tips from underware (<a href=\"http://www.typeworkshop.com\" target=\"_blank\">www.typeworkshop.com</a>). They have a section about curves (and driving cars, but they are far better at doing the first one) <br> <br>Having talked of the \"spine\" already: keep it a bit thicker.  <br> <br>For all those tips you just might have to crawl a bit through the archives. Those tips are raised every now and then and I'm sure there's an explanatory graphic (Randygraph?!). Maybe someone even has a direct link. <br> <br>Servus <br> <br>Dominik</p>"
