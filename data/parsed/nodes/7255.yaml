    html: "<p>Thomas, of the showing here 4 is the best: It looks like a single thing and is for the most part readable at a glance. As for the others: wrapping letterfroms or doing that kind of extreme interlocking of letters is a difficult challenge at the best of time but here it is made more difficult by the fact the medium for display is probably low resolution TV. <br> <br>I would keep the monoline construction, remove the tail from the r (in a different role with some alteration it could be a very unique feature though) and bring the spine or waistline of the s down more. I'd also try squaring the nose of the e to give it more the feel of the s and o. <br> <br>My personal preference would be to increase the weight, but the weight you have is (probably) okay. <br> <br>When I look at the word it seems to decrease in size from the s down to the o. Small variations in glyph height can compensate for this like try making the o the tiniest bit taller. <br> <br>Hope this helps. <br> <br>Also...Does 'sero' mean something or is it a call sign like radio stations have: S.E.R.O? Also it doesn't really speak of education, and if that is important to meeting the requirement then I don't think this would be sufficient. <br> <br>Jon</p>"
    html_clean: "<p>Thomas, of the showing here 4 is the best: It looks like a single thing and is for the most part readable at a glance. As for the others: wrapping letterfroms or doing that kind of extreme interlocking of letters is a difficult challenge at the best of time but here it is made more difficult by the fact the medium for display is probably low resolution TV. <br> <br>I would keep the monoline construction, remove the tail from the r (in a different role with some alteration it could be a very unique feature though) and bring the spine or waistline of the s down more. I'd also try squaring the nose of the e to give it more the feel of the s and o. <br> <br>My personal preference would be to increase the weight, but the weight you have is (probably) okay. <br> <br>When I look at the word it seems to decrease in size from the s down to the o. Small variations in glyph height can compensate for this like try making the o the tiniest bit taller. <br> <br>Hope this helps. <br> <br>Also...Does 'sero' mean something or is it a call sign like radio stations have: S.E.R.O? Also it doesn't really speak of education, and if that is important to meeting the requirement then I don't think this would be sufficient. <br> <br>Jon</p>"
