    html: <p>Hello, <br> <br>WOuld you consider truncating the "r" a little? try cutting it a short way along its horizontal line (I'm not so good with my anatomy, so bear with me) <br> <br>There is a large amount of negative space under the "r" that would then be closed up. <br> <br>Also, have you considered adding slight curves to the terminals (the ends) of the s? this might make it lead into the curved edges of the "e" a bit better. <br> <br>Hmm, that was my very first post outside of my own critique thread. <br> <br>- Chris</p>
