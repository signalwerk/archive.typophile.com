  html: <p>Hi typophiles, <br>currently I'm working on my diploma project, the design of an education (tv) channel called 'sero'. The overall look should be rather modern. <br>My background is motion graphics so i'm not too familiar with logotype design and still feel a bit unconfident...  <br> <br>Since there are sharp-eyed typophiles in here, i'd appreciate any critique or suggestions on the logo! <br>Thanks in advance for your help, <br>Thomas <br><img src="http://www.typophile.com/forums/messages/29/51666.jpg" alt="logotype variations"></p>
