      <p>Hi,<br>
      Nice! To my eyes, this would be better if you fitted the ornaments to the type, so that they dont cross each other in the corners of the text block (Top &amp; bottom of the B, L-swash). Also look at how the L-tops connects with the ornaments in slightly different ways.<br>
      Maybe redraw the ornaments so that they look more custom- and/or hand-made. Make them look like they really belong togheter, not like they just have been put together, if you see what I mean.<br>
      Good luck!<br>
      /Karin</p>
