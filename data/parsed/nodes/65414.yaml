  html: |-
    <p>I'm working on a logotype for a friend's etsy store. Her plan is to sell quaint/crafty items. She'll turn the logo into a rubber stamp, so she can stamp packing slips and such. This is the design I have so far, and <a class="freelinking external" href="http://www.etsy.com/shop/blovelee" rel="nofollow">this</a> is her etsy page so far.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/16750_555794481927_68600342_32635279_7030070_n_5879.jpg"></div><br>
    I'd like some feedback on the fitting-ness of this lettering, drawn on Illustrator from scratch. I was going for an etsy-ified antiquated feel, but patently 2000's since "BLoveLee" is a name that could not have existed pre-URLs.<p></p>
