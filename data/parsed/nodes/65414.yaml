      <p>one thing i see in the 'b' is the number 13 or 73, the openness of the b doesn't provide much of a strong 'first character impression'. </p>
      <p>additionally the way the L of lee is extended it looks like something's missing. i'd recommend shortening the l's 'swoop' to be tighter to the last e. i realize this is going to change the overall aspect of the letter but the composition is a little off.</p>
      <p>Since she's all about craftyness and delicate things, think ribbon ... how about a flowing, ribbon curl-style vector to define the B L and L and then the regular type for 'ove' and 'ee'</p>
