    date: 2009-12-17T04:19:00
    date_raw: 17 Dec 2009 — 4:19am
    votes: null
    html: <p>I'd be careful about putting those ornaments on a rubber stamp; at least consider making an adjusted, seriously coarser version of the logo for the stamp. From my experience, the thing with rubber stamps is that you can never control how much ink (and how much pressure) is applied… and even the wateriness of the ink tends to fluctuate based on climate/temperature/etc. And those tender ornaments won't tolerate bleeding too much.</p>
