  html: |-
    <p>Rookie question here. What is the value of glyphs like the Grave, Tilde, Acute, etc. when modern typesetting tools feature glyphs like Agrave, Atilde, and Aacute?</p>
    <p>I’ve read that designing the individual “accent” glyphs for the purpose of generating all relevant “accented” glyphs is a timesaving strategy inside Fontlab. But, aside from that, why bother designing the individual “accent” glyphs at all? Does anyone really use them anymore?</p>
    <p>Tyler</p>
