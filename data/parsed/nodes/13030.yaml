      <p>Because there might be some use to the accents themselves other than their use with letters, some mathematical, linguistic or other notation might use it. Sorry for not really answering your question, but I do hope better informed people will say something.</p>
      <p>Also, these accent glyphs are easily available from most keyboards ^`´~¨ and you don’t want to leave users wondering why it doesn’t work on your font but does on others…</p>
