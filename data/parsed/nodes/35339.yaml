      <p>From what I understand Castcraft/Opti is defunct. I know from my past days IDing fonts at alt.binaries.fonts that there were copies of Opti fonts being circulated, but the RIGHT way to go about it is to find out the true identity for the font and find a legal version. Almost nothing offered by Opti was original, and most are available from other sources by other names.</p>
      <p>- Mike Yanega</p>
