    <p>Hiya, long time no see.<br>
    I recently had a font identified for me at myfonts, and someone came to the conclusion that it would have to be Castcraft/OPTIFonts' Eton. Now, first of all, I've been doing some research on this OPTIFonts and people on forums like these doesn't hold them in such a high regard, eh? ;)</p>
    <p>Well, I'm with you. The website is just an outrage, because I can't reach their font catalogue and see if this Eton is the actual font I'm looking for. So now I turn to you guys &amp; gals. Here's the text sample:<br>
    <a href="http://wtf.myfonts.com/images/4b/4baaa9e85b5ddbeb9fedba44e12035d6.43347.jpeg" title="http://wtf.myfonts.com/images/4b/4baaa9e85b5ddbeb9fedba44e12035d6.43347.jpeg">http://wtf.myfonts.com/images/4b/4baaa9e85b5ddbeb9fedba44e12035d6.43347....</a><br>
    Before the OPTIFonts information someone mentioned it was originally issued by VGC (Visual Graphics Corporation, <a href="http://cg.scs.carleton.ca/~luc/vgc-typefaces.html" title="http://cg.scs.carleton.ca/~luc/vgc-typefaces.html">http://cg.scs.carleton.ca/~luc/vgc-typefaces.html</a>) as Wexford Medium and later on digitalized by the dreaded OPTIFonts, if this is to any help.</p>
    <p>Any ideas? If you need more samples, I can get a hold of them for you, but they'll be relatively small. Thanks in advance!</p>
