      <p>I can at least confirm the Wexford Medium ID for the original. There is a sample of it in the Phil's Photo 'Homage to the Alphabet' book of film types. There is a sample of the Extra Bold version, scanned from the same book, in my <a href="http://bowfinprintworks.com/BauhausFaces1.html" rel="nofollow">Bauhaus-Style Font ID Guide</a>, Part 1, on the left side, about the middle of the page.</p>
      <p>I have collected quite a bit of material about the Opti Fonts, including a list of fonts and their equivalents, but Opti Eton is not listed or shown in anything I have collected.</p>
      <p>- Mike Yanega</p>
