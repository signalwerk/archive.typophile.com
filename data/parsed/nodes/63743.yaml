      <p>How long will the text be?</p>
      <p>I'm thinking slab serif here: (depending on style) Cholla, Vista Slab, FF Unit Slab, Prelo Slab, Dispatch, Soho Etc.</p>
      <p>Perhaps more refined, something like Melior would work with it's square shoulders, or Charter with it's crisp details?</p>
      <p>Don't have Klavika to try these out on. Lemmeknow what you do.</p>
