    html: |-
      <p>Are these old Postscript fonts? My experience with bracketed names is that it indicates a style referenced in the suitcase, but for which there is no PS font found.</p>
      <p>In InDesign, you can get a style name in square brackets when you change font families and the style designation from the previous family does not have an equivalent in the new family. So, for instance, Minion-[RomanOsF].</p>
