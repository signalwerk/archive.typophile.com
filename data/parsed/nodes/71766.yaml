  html: |-
    <p>I'm helping tech support a coworkers OSX laptop.</p>
    <p>As a web developer, I've tended to prune my app's font lists down quite a bit over the years so likely don't run into the performance issues some do. </p>
    <p>She's recently installed a LOT of fonts (few hundred from the looks of it) and now her system is beach balling a lot. They were put into Adobe's own font folders (not OSX's system folder).</p>
    <p>My initial hunch is that that's just too many fonts to be loading into memory and that's what's slowing OSX down.</p>
    <p>But the other odd thing is that inside her apps (such as Illustrator) a lot of the fonts show up with &lt;brackets&gt; around the font name, so it might look like this:</p>
    <p>font name<br>
    font name<br>
    &lt;font name&gt;</p>
    <p>Anyone know what those brackets around a font name indicate? I assume maybe it's a damaged or missing font?</p>
