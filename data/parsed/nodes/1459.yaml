  html: '<p>ANNOUNCING: <br>Fairplex Font Release <br>Emigre (the Book) Back In Stock <br> <br>-------------------------------------------------------------- <br>Fairplex <br> <br>Designed by Zuzana Licko, Fairplex was inspired by features <br>found in models ranging from the San Francisco Giants logo <br>to Garamond. With tapered serifs that become more distinct <br>and decorative as size and weight increases, and an overall <br>low contrast, Fairplex is designed to function as both an <br>animated headline font and highly practical text face. <br> <br>Fairplex Narrow Book, Italic, Bold &amp; Bold Italic: $95 <br>Fairplex Narrow Medium, Italic, Black &amp; Black Italic: $95 <br>Fairplex Wide Book, Italic, Bold &amp; Bold Italic: $95 <br>Fairplex Wide Medium, Italic, Black &amp; Black Italic: $95 <br>Available in both Macintosh or Windows formats. <br> <br>See our site for more Fairplex info: <br><a href="http://www.emigre.com/Fairplex" target="_top">http://www.emigre.com/Fairplex</a> <br> <br>Set sample text in Fairplex: <br><a href="http://www.emigre.com/View_Fairplex" target="_top">http://www.emigre.com/View_Fairplex</a> <br> <br> <br>-------------------------------------------------------------- <br>Emigre (the Book): Graphic Design Into the Digital Realm <br> <br>The original Emigre book is back in stock. First published <br>in 1993, it is now in its 5th printing! <br>Edited and designed by Emigre. <br>96 Pages, 11 x 15 inches, softcover, over 300 illustrations, <br>with commentary from Rudy VanderLans and Zuzana Licko. <br>Essay by Mr. Keedy. <br>Regular edition: $24.95 <br> <br>See the cover image at: <br><a href="http://www.emigre.com/EB.php?id=91" target="_top">http://www.emigre.com/EB.php?id=91</a> <br> <br>The deluxe edition is signed by Zuzana Licko and Rudy VanderLans <br>and presented in a hand-made, cloth-covered slipcase. <br>Deluxe edition also includes The Emigre Music Sampler No.3 <br>compact disc.  <br>Deluxe edition: $50.00 <br>Only a few copies are left! <br> <br>See the cover image at: <br><a href="http://www.emigre.com/EB.php?id=92" target="_top">http://www.emigre.com/EB.php?id=92</a> <br> <br> <br>Emigre Inc <br>4475 D St <br>Sacramento CA 95819 <br>800-944-9021  <br>916-451-4344 <br>916-451-4351 fax</p>'
