    html: <p>Try Mohawk and their various product lines (Strathmore etc). They'll send you free swatches. Mokawk Superfine Ultrawhite (or whatever the brightest shade is called) is one possible candidate for "the absolute finest white" paper. Also try Monadnock, or, for a cheaper solution, Finch and Neena papers.</p>
