      <p>"Socialism" can mean a lot of things, but the safest general way to think about it is this: Socialism means the public or common ownership of the means of economic production, based on the assumption that private ownership of those means, no matter the intention of the owners, over time produces systematic and persistent inequalities in society.</p>
      <p>Not even Marx and Engels thought it meant I have the right to your personal property, or to steal your possessions, or to deprive you of the means of making a living. DeVroye's site and his links to pirated fonts have nothing to do with socialism, whatever else you might want to say about it (or him).</p>
