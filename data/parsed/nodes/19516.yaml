    html: |-
      <p>As a university professor here in the U.S., and an amateur follower of copyright issues, I have to say that I agree McGill is within its rights to shut down any site it hosts <em>within</em> the parameters it sets forth for operating a site on its servers. By using one's server space, email, etc., to provide anything that network administrators and any other relevant authorities at the university determine is unacceptable, one is essentially violating a contract. And hence, one has no right to complain.</p>
      <p>That said, any actions as drastic as shutting down a prof's site have to be conducted with something like due process; that's not only fair in the common-sense sense, but also usually a formal component of all such administrative processes. I.e., it's generally expected both culturally and officially.</p>
      <p><em>That</em> said, this case has absolutely <em>nothing</em> to do with "academic freedom." At least in the States, and as a coordinator of a large chunk of courses, I am constantly running into abuses of the term. Academic freedom is about the right to speak on <em>political</em> issues freely in and out of the classroom without fear of professional retribution. The historical context involves people being summarily <em>fired</em> for having the "wrong" political views (think of the "Red Scare" and the Cold War here in the U.S.). It doesn't mean "You can do whatever you want, and say whatever you want, and there won't be any consequences."</p>
      <p>There are certainly cases in the States in which people have been asked to leave in what <em>appears</em> to be violation of academic freedom. But often these very same people are saying things that fly in the face of other important values in higher education, such as (a) promoting sound and reasonable research rather than lies, (b) maintaining an open and free educational environment rather than damaging this environment, and/or (c) bringing disrepute upon the institution for any number of reasons (e.g., the revelation of a prior criminal record or other damaging material that was not openly revealed during the hiring process).</p>
      <p>Nevetheless, these are not black and white issues. So long live academic freedom and the debate about what it is. Not that this has much to do with typography...</p>
