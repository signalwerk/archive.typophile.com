    <p><a href="http://cgm.cs.mcgill.ca/~luc/" title="http://cgm.cs.mcgill.ca/~luc/">http://cgm.cs.mcgill.ca/~luc/</a></p>
    <p>"Luc Devroye's site is now closed. He is still alive and kicking, but on April 24, 2006, censorship and political correctness won against academic freedom. To the students who are counting on my course notes: sorry. To the researchers who are trying to download my work: sorry. To the conference participants of AofA 2006: sorry. To the readers of my daily social commentary: sorry. To the mathematical community: sorry. To the funding agencies of Canada who generously supported my work: sorry. We may be up again one day after purgatory."</p>
    <p>Mr. DeVroye's website was a great resource for anyone interested in type, and an invaluable one to those interested in font technologies. </p>
    <p>Just yesterday I was going to send Mr. DeVroye a message telling him how much I appreciate the time he has put into making such a large collection of useful information and links, but I felt a bit embarassed about sending it so I didn't. I wish I had, and now I'm going to ask him if he has backed up a copy of his pages about fonts.</p>
    <p>You can still reach parts of his website from Google's cache ( <a href="http://72.14.203.104/search?q=cache:_73aQEnCgjAJ:cgm.cs.mcgill.ca/~luc/fonts.html+luc+devroye&amp;hl=en&amp;ct=clnk&amp;cd=3&amp;client=safari" title="http://72.14.203.104/search?q=cache:_73aQEnCgjAJ:cgm.cs.mcgill.ca/~luc/fonts.html+luc+devroye&amp;hl=en&amp;ct=clnk&amp;cd=3&amp;client=safari">http://72.14.203.104/search?q=cache:_73aQEnCgjAJ:cgm.cs.mcgill.ca/~luc/f...</a> ).</p>
