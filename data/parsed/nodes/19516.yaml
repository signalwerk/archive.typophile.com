      <p>Uh, I actually don't give a damn what people put on their web sites. If some professor at McGill wants to reproduce copyrighted images of hot chicks squirming in front of a camera, I frankly don't care. Maybe if they were my daughter, that'd be another story. Then again, if my daughter ended up in a porno mag, well, we'd probably have to have a father-daughter discussion about that.</p>
      <p>Anyway, if I judge my peers, it's on the quality of their work. But if I'm working for an organization that pays me my paycheck, despite all of the checks and balances I expect to operate, and despite all of the freedom of thought and expression I'd expect to enjoy, if I put stuff up on the site that violated a pre-existing rule I've tacitly or explicitly agreed to about what's acceptable, then tough nuts for me.</p>
      <p>I could of course argue my case, and perhaps even take my university to court. But I couldn't summarily dismiss their right to act on their intepretation of the situation and applicable rules any more than I'd expect them to simply pull the plug on my site.</p>
      <p>But perhaps, because this is a flame-exchange, you were making a sneaky comment about the quality of my own site? In other words, if I expected to get tenure on the quality of my site (which you can access via my profile), and my site really sucked, then I'd better be careful before judging others on the basis of their sites? Now <em>that</em> would have been a clever jab. For you would have been insulted not only me, but also my hounds! <em>They</em> insisted I put their picture up there, even though it kinda ruins the balance of things.</p>
      <p>This still has nothing to do with academic freedom, though. And little to do with fonts, either.</p>
