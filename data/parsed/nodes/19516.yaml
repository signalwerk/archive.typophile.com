      <p>It wasn't bashing, just a remark. Perhaps naive. I'm not an intellectual (surprise), but isn't socialism a sort of one-for-all and all-for-one kind of thing at it roots? If you take that to a possible conclusion: So, I have as much right to your work as you do, in an abstract way. </p>
      <p>Oh well, my intentions weren't to stir another hornet's nest. Please forgive if I don't have a grasp of the concept. For a while I sort of bought into that kind of thing, but it definitely has issues, I can tell you that. </p>
      <p>One that comes to mind is rewarding the lazy and punishing the productive. How long until a sense of unfairness manifests itself? Maybe some large groups of people are far more altuistic than myself. I guess if it is successful I can't argue with it.</p>
