      <p>We have gun control, where you have to register rifles, and handguns are banned. It doesn't stop criminals from killing each other (and occasionally the innocent). But it does prevent a lot of "rage" deaths where people die because someone else got pissed off at them (here it results in a punch in the nose, much less deadly than a bullet).</p>
      <p>But really ... what does any of this have to do with typography?</p>
