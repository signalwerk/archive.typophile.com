      <p><cite>Terry wrote: "He also had an agenda to promote his “academic freedom” by actively promoting pirates and knock-off fonts and telling lies about type designers. Most of his information was correct and factual."</cite></p>
      <p>Hmm, I was with you right up to "most of his information was correct and factual." I once dissected a lengthy rant of his and pointed out that most of his assertions of fact were false, and many of the remainder were at least misleading.</p>
      <p>I'm completely supportive of Luc DeVroye's right to express his opinions on any topic he likes. And he's welcome to tell lies, as far as I'm concerned, although that might get him sued for libel some time. (Usually he's careful to quote other people, instead of asserting things directly himself - a clever tactic.)</p>
      <p>However, what I object to is his posting vast numbers of links to pirated fonts. I particularly object to his doing that on a University's web site. I find it ludicrous that he could promote theft for years, but he posted some pictures of naked women and they shut down the whole site?</p>
      <p>I think McGill owes type foundries an apology. I have no particular sympathy for DeVroye. He should have been reined in years ago.</p>
      <p>Regards,</p>
      <p>T</p>
