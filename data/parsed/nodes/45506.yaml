      <p>It's a historical thing. When the scotch roman style was coming into play, oldstyle figures were no longer in vogue. Most of the original scotch romans didn't have them (or had hybrid figures instead), so most revivals or interpretations of the genre tend not to have them either.</p>
      <p>It's not like there's a biblical law that says "thou shalt not put oldstyle figures in a scotch roman" or anything, it just wasn't common, historically.</p>
      <p>Regards,</p>
      <p>T</p>
