      <p>Tiffany's quite right: the original release of Caledonia in 1939 did not include oldstyle figures. The Linotype supplement from 1948 still does not offer any oldstyle figures for the text sizes of Caledonia. </p>
      <p>Oddly, however, it does show oldstyle figures as an alternate available for Caledonia Bold in sizes 16–36. The Bold was originally produced on commission for headlines in a NY tabloid newspaper called <cite>P M</cite>. So perhaps the OsFs were part of the commission.</p>
      <p>By 1962, in the tribute to WAD published by the original Typophiles, oldstyle figures appear in the showing for Caledonia. </p>
      <p>So, there were OsF in metal eventually, but not until well after the original release.</p>
      <p>-- K.</p>
