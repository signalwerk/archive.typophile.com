  html: |-
    <p>Why do most Scotch Roman typefaces not have old-style figures? I've noticed that Miller has semi-OSF characters, like a cross-breed with normal lining figures (most noticeable in 7 and 9); whereas Mercury and Chronicle from H&amp;FJ do not have OSF's. Freight, on the other hand, which strikes me as fairly Scotch in its design, DOES have them. Can anyone elucidate this for me? Is it a 19th-century thing? I want to use Mercury for an identity project which would involve not just a logo but a type system that can be used in-house for publications. I find it odd that such an extensive and well-drawn family doesn't have OSF.</p>
    <p>Also, if anyone can suggest a good Scotch Roman that DOES have OSF, that would be wonderful. Thank you!</p>
