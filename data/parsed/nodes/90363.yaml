    html: |-
      <p>My memory is a little fuzzy, but I did this on two font families back in November. Here is what I did (I think…):</p>
      <p>1. First, generate the TTFs from FontLab (with the VOLT info box checked in the FL preferences, and the flat kerning, too)</p>
      <p>2. Copy the kern2VOLT.exe file into the same folder as your TTF on Windows</p>
      <p>3. Open the TTF up in VOLT. VOLT will tell you that all OT data will be overwritten. This is OK, OK, of course. Rename all of the glyphs using the Glyph Names. Save the TTF.</p>
      <p>4. I will presume that your font is named something like MyFont-Regular.ttf</p>
      <p>5. Open up the command line. Type:<br>
      kern2VOLT.exe MyFont-Regular.ttf Kern.vtl</p>
      <p>6. This should generate a VOLT look-up file in the same folder as the .exe file and the TTF, called Kern (of course, it does not matter what you name the look-up … the name will be whatever you type before the .vtl extension in the command).</p>
      <p>7. In VOLT, you can import this look-up, and assign it to  features</p>
      <p>Maybe someone will come along and correct any discrepancies I have here. Perhaps my order of stuff in the command line is off … I'm pretty sure that it is the .exe, then the .ttf, and finally the .vtl, though. Good luck!</p>
