    html: |-
      <p>Dan's explanation is basically correct. kern2volt requires as input a TTF with a) an oldstyle kern table containing all the kerning you want to import into VOLT and b) glyph names imported in VOLT. So generate a TTF with a kern table from FontLab, open it in VOLT, import the glyph names from the post table, save from VOLT, run kern2volt from the command line.</p>
      <p>Note that kern2volt has an option for right-to-left kerning, but if your project involves both LTR and RTL kerning you will need separate TTF sources for each. If a font contains multiple scripts, you might also want a separate TTF for each, so that you get separate VOLT lookups for different scripts rather than one giant one.</p>
