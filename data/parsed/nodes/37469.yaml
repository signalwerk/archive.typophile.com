    html: |-
      <p>I will assume that all you need is a font you can install on your Mac with "Font Book". You won't need X-windows or fontforge's graphic interface. I will also assume you installed fontforge directly from <a href="http://sourceforge.net/project/showfiles.php?group_id=103338">sourceforge.net</a>. I will finally assume your shell is bash and that you don't know how to fix your Unix environment (I don't want to explain).</p>
      <p>Now, do this:  put all the <code>*.afm</code> and <code>*.pfb</code> (or <code>*.AMF</code> and <code>*.PFB</code>)  files of the fonts you want to convert in the same directory. In that same directory, you will put two executable files, one named <code>convert</code>, the other named <code>pfb2otf</code> and call <code>convert</code> on all your font files. Here is a trick to do all that: in a terminal window you <code>cd</code> to the directory containing your font files; once you are there (when the Unix command <code>ls</code> lists your font files), you just paste in the terminal window (in one shot) the 18 lines between the dotted lines:<br><code><br>
      -----------<br>
      cat &gt; convert &lt;&lt; 'EOF'<br>
      #!/bin/bash</code></p>
      <p>PATH=/usr/local/bin:$PATH<br>
      FONTFORGE_LANGUAGE=ff<br>
      export PATH FONTFORGE_LANGUAGE</p>
      <p>if (test -f $1); then ./pfb2otf $1; fi<br>
      EOF<br>
      cat &gt; pfb2otf &lt;&lt; 'EOF'<br>
      #!/usr/local/bin/fontforge<br>
      Open($1);<br>
      Reencode("unicode");<br>
      Generate($fontname+".otf");<br>
      Quit(0);<br>
      EOF<br>
      chmod 755 pfb2otf convert<br>
      for i in *.[pP][fF][bB]; do ./convert $i; done<br>
      -----------<br><br>
      If everything went ok, you should see<br><code><br>
      Copyright (c) 2000-2007 by George Williams.<br>
       Executable based on sources from 17:57 15-Sep-2007.<br></code><br>
      as many times as you have font files.  When the processing is over, you start "Font Book" click on "File &gt; Validate File..." and select the fonts you just generated (you can use Apple A to select them all). If the validation succeeds, your fonts should be ok to install. </p>
      <p>Michel<br>
      PS Edited after posting</p>
