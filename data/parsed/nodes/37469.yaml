    <p>I downloaded fontforge and x11 and am trying to convert the font using this system<br>
    the problem is when i choose the font it does not allow me to choose a output font type</p>
    <p>any suggestions on how i can do this.  (convert pc fonts to mac )</p>
    <p>Thanks</p>
    <p>c</p>
