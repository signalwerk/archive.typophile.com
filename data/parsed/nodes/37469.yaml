      <p>Ecouragement: the first method does really work and you get it done within mere minutes – if you are familiar with the Terminal and Sourceforge.</p>
      <p>I'm sure that application mentioned in the second post will be a smoother way for anyone who does not regard his Mac OS as essentially a shiny Unix derivate (which, of course, it is). Just ignore the helpful hacker's arrogance there.</p>
      <p>Er, yeah, thanks Michel. This helped me a lot. Really.</p>
