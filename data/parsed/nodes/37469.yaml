      <p>What is above should work on any Unix machine. For the Macintosh, I wrote a small application that does it by just double clicking and selecting the folder containing the fonts to convert. Look at the thread <a href="http://typophile.com/node/37659">http://typophile.com/node/37659</a></p>
      <p>Michel</p>
