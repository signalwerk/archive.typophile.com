    html: <p>And the G too. The serifs on G and S (not the surf / skate company) seem too blocky and awkward, like they belong on a lettermean's sweater. Is it just me? And the serifs are driving me crazy on the black weight. I can't figure out how to incorporate them. I don't know how you real type designers handle all of this stuff. <br> <br>P.S. For those who are curious, here's an image of the original from the book. <br> <br><img src="http://www.typophile.com/forums/messages/29/65593.jpg" alt="Original_272"></p>
