      <p>Some additional info on Erik Spiekermann's paraphrase of Goudy's quote --</p>
      <p>Source:<br>
      <strong>Stop Stealing Sheep</strong><br>
      &amp; find out how type works<br>
      <em>Erik Spiekermann &amp; E.M. Ginger</em><br>
      First printing: December 1992<br>
      Copyright © 1993 Adobe Systems</p>
      <p>On the first page of text, Erik added a sidebar to explain his use of Goudy's quote:</p>
      <p><em>In 1936, Frederic Goudy was in New York City to receive an award for excellence in type design. Upon accepting a certificate, he took one look at it and declared that "Anyone who would letterspace black letter would steal sheep."</em></p>
      <p>Eric goes on to mention:</p>
      <p><em>You might have noticed that our book cover reads "lower case," while here it reads "black letter" -- two very different things.</em></p>
      <p>He then added a small sample of CAPITALS, lower case and black letter (printed in black letter) to illustrate the difference to the uninformed reader.</p>
      <p>Eric continues:</p>
      <p><em>We're not sure how "black letter" got changed to "lower case," but we've always known it to be the latter; whichever way, it makes infinite sense.</em></p>
      <p>-------------------------------------<br>
      Yes, I'm old, but I don't shag sheep!</p>
