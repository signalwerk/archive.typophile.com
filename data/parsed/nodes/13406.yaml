      <p><em>I’m sure letterspaced blackletter is equally hideous, never tried it, thats a good thing right?</em></p>
      <p>The keynote speaker at the <a href="/wiki/ATypI" class="freelinking" rel="nofollow">ATypI</a> conference in Copenhagen referred to a lovely typographic metaphor in one of <a href="/wiki/S%C3%B8ren%20Kierkegaard" class="freelinking" rel="nofollow">Søren Kierkegaard</a>'s books. In the original, blackletter edition approved by the author, who took a keen interest in the typography of his books, the metaphor relates a feeling of existential alienation and disconnection to being l e t t e r s p a c e d. In a later edition, typeset in antiqua (roman) type, the typesetters interpreted the letterspaced blackletter as italics, as was normal in resetting in antiqua from blackletter originals, and then, since the metaphor was now lost, actually changed the text. So in this later edition the existential alienation was bizarrely likened to being <em>italicised</em>.</p>
    html_clean: |-
