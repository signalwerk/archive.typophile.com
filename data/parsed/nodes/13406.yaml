    html: <p>Massimo sounds like he was just lamenting the loss of revenue to others.  In his era (and mine) designers made most of their money on fairly mundane work that was simple to design and could easily be turned over to lesser-paid staff.  We used to call this grunt work. This freed up the top-dogs to spend more time on show pieces yet still collect on the grunt work done by their staff. It was a steady moneymaker with plenty of repeat business--as in "update this monthly catalog with new prices".  Yes, the computer turned this into a database publishing issue with automated regional versioning and distribution.  Yes, there also was a huge birth of hack designers now in the workforce who knew noting about design but plenty about software usage. So goes the world. We have always had competition to deal with. Some of it was only in price and not in quality.  If a client didn't give a damn about good design, he hired a hack and saved a few bucks. That is the way the world works, Massimo. Get over it already--it is 2011 now, not 1965. The NYC grip also faded with the internet.  You did not have to be a 5 minute cab ride to all the big clients to get their work any more. Sure, now you can get both crap design and good design from Manhattan to Malaysia.  Welcome to the global economy, we are all better off for it except a very few of the elite and late adopters perhaps.</p>
