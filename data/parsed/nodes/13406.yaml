      <p>“<em>There is no end to the maze of practices in typography, and this idea of printing as a conveyor is, at least in the minds of all the great typographers with whom I have had the privilege of talking, the one clue that can guide you through the maze. Without this essential</em> humility of mind<em>, I have seen ardent designers go more hopelessly wrong, make more ludicrous mistakes out of an excessive enthusiasm, than I could have thought possible</em>.”</p>
      <p>Warde, B. (1955).</p>
      <p>————</p>
      <p>“<em>Printing demands a</em> humility of mind<em>, for the lack of which many of the fine arts are even now floundering in self-conscious and maudlin experiments</em>.”</p>
      <p>Warde, B. (1955).</p>
