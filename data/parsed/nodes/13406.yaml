      <p>In Erik's book <em>Stop Stealing Sheep &amp; find out how type works</em>,<br>
      he admits to not knowing Goudy's <em>exact wording</em>, but that "it makes infinite sense" regardless of wording.</p>
      <p>So let's not take Erik's versions as historically accurate, just rhetorical.</p>
      <p>When Mr. Goudy made his statement, he obvioulsy knew it was a <em>faux pas</em> since apologized profusely by saying he <em>says that about everything!</em></p>
      <p>IMHO, the "blackletter" and "steal sheep" version seemed more likely since he was being presented an award (certificate with blackletter?) at a public forum.</p>
      <p>Also, IMHO, "shag sheep" seems to be more of Welsh origin, and Goudy was American born and bred, so if he did ever used the term "shag," he more than likely got it from his father who probably told young Frederic to <em>stop shagging sheep</em> ;)</p>
