      <p>I just noticed that, astoundingly, one of my favorite quotes is missing from this thread. Another quote from the same person is present, and a quote from a different individual expressing a similar idea is present... but this famous quote is not:</p>
      <p><cite>Imagine that you have before you a flagon of wine. You may choose your own favourite vintage for this imaginary demonstration, so that it be a deep shimmering crimson in colour. You have two goblets before you. One is of solid gold, wrought in the most exquisite patterns. The other is of crystal-clear glass, thin as a bubble, and as transparent. Pour and drink; and according to your choice of goblet, I shall know whether or not you are a connoisseur of wine. For if you have no feelings about wine one way or the other, you will want the sensation of drinking the stuff out of a vessel that may have cost thousands of pounds; but if you are a member of that vanishing tribe, the amateurs of fine vintages, you will choose the crystal, because everything about it is calculated to reveal rather than hide the beautiful thing which it was meant to contain.</cite></p>
      <p><cite>Bear with me in this long-winded and fragrant metaphor; for you will find that almost all the virtues of the perfect wine-glass have a parallel in typography.</cite></p>
      <p>Beatrice Warde</p>
      <p>Actually, looking at her essay, I see why: it doesn't contain a single short quote giving its point, although somewhere else I had seen a quote from her doing so.</p>
      <p>Ah, wait: this will do (and, in fact, <em>was</em> what I was looking for but initially missed) -</p>
      <p><cite>Type well used is invisible as type, just as the perfect talking voice is the unnoticed vehicle for the transmission of words, ideas.</cite></p>
      <p>One could also say that her metaphor is out of date. Crystal is glass which calls attention to itself because it has had lead oxide added to it to increase its refractive index, causing it to sparkle. Lead can leach out into the wine, sweetening it. (And, for that matter, one of the virtues of gold is that it is highly resistant to chemical attack, unlike many other metals, so it is not unsuitable to hold wine. Wine <em>is</em> meant to be tasted, not looked at.)</p>
      <p>So the ideal wine goblet would perhaps be of something more resistant, such as borosilicate glass.</p>
      <p>@Chris Dean:<br>
      At least Josef Müller-Brockmann will never fall (or, rather, sadly, had never fallen) into the hubristic mistake once famously made by one of the Beatles.</p>
      <p>But I will take note of the opinion that our salvation is to be found in the Swiss grid system.</p>
