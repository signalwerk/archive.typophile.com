      <p>Originally published in U&amp;lc.</p>
      <p>"I think it's rather difficult to create a new typeface design, or for that matter, to create a new anything that's in everyday use. A new piece of music would parallel the creation of a new typeface. For example, the notes of music don't change, and the letters of the alphabet don't change, either. It's a matter of how they're put together. The most important feature must be that its newness has a reflection all its own and fits into the pattern of today's generation of graphic designers. The new creation must have something in its character that makes the potential user sit up and take notice. These typographic traits could create a popular demand but we must also consider that this popularity may only be a temporary. Personally, I don't think there's anything wrong with that. I know we all feel our designs will last forever, but some things like music don't last either. It's like 'here today and forgotten tomorrow.' Anyway, you and I can be sure of one thing: the number of typefaces will surely increase." —Ed. Benguiat</p>
