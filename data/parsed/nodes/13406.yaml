      <p>I am surprised that a direct recollection confirms the saltier version of the Frederic W. Goudy quote on letterspacing blackletter (or lower-case). After all, he is an American type designer, not a British one, and the quote dates from a time prior to the release of the Austin Powers movies.</p>
      <p>Reading the posts here led me to search out this page:</p>
      <p><a href="http://berlinbooks.org/brb/2009/11/typocalyse-now-the-legacy-of-jan-tschichold/" title="http://berlinbooks.org/brb/2009/11/typocalyse-now-the-legacy-of-jan-tschichold/">http://berlinbooks.org/brb/2009/11/typocalyse-now-the-legacy-of-jan-tsch...</a></p>
      <p>When I was a child, I naïvely thought that serifs were an unnecessary and old-fashioned complication to the forms of letters. Thus, Jan Tschihold's youthful folly is entirely understandable. I propose that it was shared, in a different form, more widely than may have been recognized.</p>
      <p>When printing began, printed books imitated manuscripts. Since the letters were formed at one point, when the matrices were made, why not use the form of letter that is esteemed as the best one - the one that is the most elaborate, that requires the most effort to make?</p>
      <p>Despite habit, I suspect that the issues of readability with regard to blackletter were noticed by some even at the very beginning. The rapid emergence of rotunda and bastarda typefaces would seem to confirm this.</p>
      <p>Incidentally, because rotunda and bastarda were very readable, I think it regrettable that this line of development did not continue to be followed in the creation of text types. While Lydian is readable, it is still unlikely to be used for text, and, while Optima could be said to be related, it is derived from Roman and sans-serif typefaces, and does not belong to this line of evolution at all.</p>
      <p>The fact that Roman types were used for Latin text might be put down to authenticity alone. But the fact that blackletter was suitable for the vernacular - the reader's native language - while Roman was used for texts that are in an ancient language which the reader had learned as a second language seems to me another indication that Roman was regarded as more legible all along.</p>
      <p>Also, in the early days of printing, it was difficult enough for printers to cast their own blackletter and roman fonts in a range of sizes. The Roman of Aldus Manutilus closely resembled that of Nicholas Jenson, and the Roman of Claude Garamond was patterned after that of Aldus Manutilus. Printers tended to use one style of roman face and stick to it.</p>
      <p>Obviously, if one is only using one roman face, and one is cutting one's own punches, there will be motivation to make the best ones possible, and one's own personality and limitations and handwriting will all be reflected. So there will be change over time. Thus, Caslon, Baskerville, and Bell all emerged from this type of evolution, as well as Bodoni.</p>
      <p>Given, then, that the world was emerging from a period when printing shops only had a very limited set of typefaces, it's not surprising that Jenson, Poliphilus, Bembo and Garamond all had to be revived. With only Caslon - and, later, oldstyle faces based on the one by Alexander Phemister - as competition, it's also not surprising that Scotch Roman faces - which attempted to soften the characteristics of Bodoni much as Gill Sans, later, was considered a humanist sans-serif - became the fashion.</p>
      <p>In this earlier day, their unbracketed serifs were seen, like the lack of serifs on Helvetica, to be an abandonment of useless, unnecessary ornament. But everything needful for legibility - serifs of some sort, classical proportion - was retained.</p>
      <p>I see Times Roman as being like Caslon - a "sweet spot" that will stay popular for a long time. When in doubt, set it in Times... is, in effect, already the maxim that the same thing, said about Caslon, once was. In the area of sans-serif, Stone and Lucida seem to be today's fashion.</p>
      <p>When Caslon fell, the earlier oldstyle types not being available, it led to the Scotch Roman epoch which looks so dismal to today's eyes.</p>
      <p>When Times Roman falls, though, technical factors will not pressure us to use overly condensed letters. Nor will the designs of Baskerville or Bembo be hidden and unavailable. So there is no reason for the fashions of the future to give us a long, depressing era dominated by typefaces which, to their posterity (as well as our eyes, if we could see them) look awful and thus make their popularity inexplicable.</p>
