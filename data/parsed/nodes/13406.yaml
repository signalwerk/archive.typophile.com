      <p><strong>Losing Sleep</strong><br>
      <em>by Ephram Edward Benguiat</em></p>
      <p>The following passages are taken from an undated typewritten manuscript. It's very likely these were used as notes for one of Ed's speaking engagements. There is no known date of publication.</p>
      <p><em>"To me designing has never been a job or profession. It's a way of life, like a priest or rabbi."</em></p>
      <p><em>"Doing something a long time does not mean you're good. It only means you've done it a long time."</em></p>
      <p><em>"Doing something and getting paid for it doesn't mean you're doing it well. It only means you're doing it."</em></p>
      <p><em>"I don't think that success is the premise to what is good or bad."</em></p>
      <p><em>"The contributions that one makes in typography, design, and art in general cannot be, and must not be measured on how much money is involved. That would lead to total chaos. The word itself (contribution) is to give to a common purpose."</em></p>
      <p>-------------------------------------<br>
      Yes, I'm old, but I'm back in style!</p>
