      <p>"Type production has gone mad, with its senseless outpouring of new types… only in degenerate times can personality (opposed to the nameless masses) become the aim of human development" –&nbsp;Jan Tschicold; The New Typography; 1928<br>
      "All the old fellows stole our best ideas." –&nbsp;Frederic Goudy; date unrecorded<br>
      "The shapes of letter do not derive their beauty from any sensual or sentimental reminiscences. No one can say the O's roundness appeals to us only because it is like that of an apple or of a girl's breast or of the full moon. Letters are things, not pictures of things." – Eric Gill; Autobiography; 1940<br>
      "I fought linotype and montype for some time because it would not justify as well as handset could be made to do; but at last, as always happens, the machine outdid the hand, and got all the best types on it." – George Bernard Shaw; Letter to Ruari McLean, 28/3/1949<br>
      Tim</p>
