      And weight four it too say<br>
      Weather eye yam wrong or write<br>
      It shows me strait a weigh.<br>
      As soo as a mist ache is maid<br>
      It nose bee fore two long<br>
      And eye can put the era rite<br>
      Its rare lee ever wrong.<br>
      Eye have rune this poem threw it<br>
