      <p>A further note regarding the possibility that Goudy's now infamous quote was at the time a slur on Germany made as a point for engaging his audience; this culled from The Book Collector's Packet of 1939. A boycott on "Nazi-made types" was undertaken in the U.S. by the Graphic Arts Forum, "a group of democratically minded graphic arts and advertising people." The banned typefaces included Bauer Bodoni, Bernhard Modern, Eve, Futura, Kabel, Neuland, Trafton, and Weiss.</p>
      <p>Gerald</p>
