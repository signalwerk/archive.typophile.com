      <p>"…a work of art, i.e. a thing made by a man who, however laughable it may seem to men of business, loves God and does what he likes, who serves his fellow men because he is wrapped up in serving God — to whom the service of God is so commonplace that it is as much bad form to mention it as among men of business it is bad form to mention profits."</p>
      <p>"I think it is generally agreed that picture writing was the beginning of our lettering. You might wish to communicate something to someone at a distance. If you have no letters or none common both to you &amp; your correspondent, what else can you do but draw a picture? — the language of pictures is common to all. After a time your pictures are used to signify words and not simply things, and as the system develops and communications become more precise, the pictures become simpler and simpler, more &amp; more conventional, and they come to signify single sounds rather than whole words. And the pictures, by now, have ceased to be pictures. They are, by now, hardly recognizable as representations of things: they are conventional signs, &amp; their pictorial origin is forgotten."</p>
      <p>–Eric Gill, An Essay on Typography, 1936</p>
