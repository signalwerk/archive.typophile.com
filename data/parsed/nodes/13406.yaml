      <p>Some of my faves:</p>
      <p>"People who love ideas must have a love of words. They will take a vivid interest in the clothes that words wear." - <a href="/wiki/Beatrice%20Warde" class="freelinking" rel="nofollow">Beatrice Warde</a></p>
      <p>"Perfect typography is certainly the most elusive of all arts. Sculpture in stone alone comes near it in obstinacy." <a href="/wiki/Jan%20Tschichold" class="freelinking" rel="nofollow">Jan Tschichold</a>, Homage to the Book, 1968</p>
      <p>"Each letter should have a flirtation with the one next to it." <a href="/wiki/Mac%20Baumwell" class="freelinking" rel="nofollow">Mac Baumwell</a></p>
      <p>"Writing is not a series of strokes, but space, divided into characteristic shapes by strokes." <a href="/wiki/Gerrit%20Noordzij" class="freelinking" rel="nofollow">Gerrit Noordzij</a></p>
      <p>"The most popular typefaces are the easiest to read; their popularity has made them disappear from conscious cognition. It becomes impossible to tell if they are easy to read because they are commonly used, or if they are commonly used because they are easy to read." - <a href="/wiki/Zuzana%20Licko" class="freelinking" rel="nofollow">Zuzana Licko</a></p>
