      <p><cite>“Men who would letterspace blackletter would shag sheep” - Frederick Goudy</cite></p>
      <p>That is the correct quote. E. Ginger did the research for "Stop Stealing Sheep", and she actually spoke to an old lady who had been to the event and heard Goudy say the "s" word. Patrick Ames, then publisher for Adobe Press, loved the quote, suggested it as the title for the book and changed it, for obvious reasons. The book <em>was</em> intended for typographic novices, and those were obviously not deemed grown-up enough for real four letter words. I always thought the titel way too obscure, but I do have a collection of model and toy sheep (too small to shag), because lots of friends think it very funny to give me sheep as presents.</p>
    html_clean: |-
