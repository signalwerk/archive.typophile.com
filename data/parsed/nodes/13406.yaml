      <p>A type of revolutionary novelty may be extremely beautiful in itself; but, for the creatures of habit that we are, its very novelty tends to make it illegible, at any rate to begin with.<br>
      <em>Typography for the Twentieth-Century Reader</em><br>
      <strong><a href="/wiki/Aldous%20Huxley" class="freelinking" rel="nofollow">Aldous Huxley</a></strong></p>
      <p>Type design moves at the pace of the most conservative reader. The good type-designer therefore realizes that, for a new fount to be successful, it has to be so good that only very few recognize its novelty.<br>
      <em>First Principles of Typography</em><br>
      <strong><a href="/wiki/Stanley%20Morison" class="freelinking" rel="nofollow">Stanley Morison</a></strong></p>
      <p>Type well used is invisible <em>as</em> type, just as the perfect talking voice is the unnoticed vehicle for the transmission of words, ideas.<br>
      <em>Printing Should Be Invisible</em><br>
      <strong><a href="/wiki/Beatrice%20Warde" class="freelinking" rel="nofollow">Beatrice Warde</a></strong></p>
      <p>If you remember the shape of your spoon at lunch, it has to be the wrong shape. The spoon and the letter are tools; one to take food from the bowl, the other to take information off the page... When it is a good design, the reader has to feel comfortable because the letter is both banal and beautiful.<br>
      <em>Keynote Speech/Type90</em><br>
      <strong><a href="/wiki/Adrian%20Frutiger" class="freelinking" rel="nofollow">Adrian Frutiger</a></strong></p>
      <p>When we experience disappointment with the relationship with letters let's not be afraid to do what come naturally to us: Let's draw.<br>
      <em>Graphis Typography 1 (1994)</em><br>
      <strong><a href="/wiki/Gerard%20Huerta" class="freelinking" rel="nofollow">Gerard Huerta</a></strong></p>
      <p>As we say in Berlin, there are many ways to bake a parrot.<br>
      <em>Rhyme &amp; Reason</em><br>
      <strong><a href="/wiki/Erik%20Spiekermann" class="freelinking" rel="nofollow">Erik Spiekermann</a></strong></p>
      <p>Yes, I'm old, but I'm back in style!<br>
      <em>Typophile Forum (2005)</em><br>
      <strong><a href="/wiki/Norbert%20Florendo" class="freelinking" rel="nofollow">Norbert Florendo</a></strong></p>
    html_clean: |-
