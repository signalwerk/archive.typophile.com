      <p>"Typography, a perfect fusion of form and meaning in which beauty is born, is raised from mere craft and can claim the title of a philosophy; for it also includes ethics, that enobling factor of man's destiny. Thus the printed word is in touch with the spirit." - Raul Mario Rosarivo, 1951.</p>
      <p>"Any work of art that makes us feel the artist tried too hard lacks clarity."<br>
      Clayton Whitehill, The Moods of Type, 1947</p>
