      <p><a href="/wiki/Helvetica" class="freelinking" rel="nofollow">Helvetica</a> is the jeans, and <a href="/wiki/Univers" class="freelinking" rel="nofollow">Univers</a> the dinner jacket. Helvetica is here to stay . <a href="/wiki/Adrian%20Frutiger" class="freelinking" rel="nofollow">Adrian Frutiger</a></p>
      <p>In a way, The Beatles are the Helvetica of pop; just like Helvetica is The Beatles of typefaces . Experimental Jetset</p>
      <p>If you have no intuitive sense of design, then call yourself an "information architect" and only use Helvetica . <a href="/wiki/David%20Carson" class="freelinking" rel="nofollow">David Carson</a></p>
      <p>Anyone who uses Helvetica knows nothing about typefaces . <a href="/wiki/Wolfgang%20Weingart" class="freelinking" rel="nofollow">Wolfgang Weingart</a></p>
      <p>I discovered that I never really used Helvetica but I like to look at it. I like the VW beetle, too, although I've never driven one . <a href="/wiki/Stefan%20Sagmeister" class="freelinking" rel="nofollow">Stefan Sagmeister</a></p>
      <p>I have never designed a logotype without first trying it in Helvetica. It is still the most versatile, classic and readable of all typefaces. <a href="/wiki/Steff%20Geissbuhler" class="freelinking" rel="nofollow">Steff Geissbuhler</a></p>
      <p>Any good typeface can be completely destroyed when misused or extensively overused. Helvetica seemed to sustain a beating like no other. Still fresh, still popular Helvetica is king . <a href="/wiki/Alexander%20Gelman" class="freelinking" rel="nofollow">Alexander Gelman</a></p>
      <p>There was once a typeface that had the reputation of being more legible and functional than all the others. It was used everywhere and for everything, from signs to logos. Then one day readers couldn't stand seeing it anymore and decided to stop reading it – despite its superior legibilty. Bit by bit designers forgot about it and it was only used by lay people. Then it was rediscovered for a while and in fashion again. Even books were published about it . <a href="/wiki/Ruedi%20Baur" class="freelinking" rel="nofollow">Ruedi Baur</a></p>
      <p>Helvetica is the typeface for a deserted island . <a href="/wiki/Friedrich%20Friedl" class="freelinking" rel="nofollow">Friedrich Friedl</a></p>
      <p>We hate to like Helvetica . <a href="/wiki/Hamish%20Muir" class="freelinking" rel="nofollow">Hamish Muir</a></p>
      <p>I remember a time at Yale when my work was being critiqued by <a href="/wiki/Paul%20Rand" class="freelinking" rel="nofollow">Paul Rand</a>. Mr. Rand told me only to use Helvetica as a display face never in text, then he squinted, leaned in, and whispered in my ear, "because Helvetica looks like dogshit in text" . <a href="/wiki/Kyle%20Cooper" class="freelinking" rel="nofollow">Kyle Cooper</a></p>
      <p>(all from the flyer to the book «Helvetica - Homage to a Typeface», edited by <a href="/wiki/lars%20m%C3%BCller" class="freelinking" rel="nofollow">lars müller</a>)<br>
      12 x 16 cm, 256 pages, 800 illustrations, hardcover.<br>
      --- more infos on <a href="http://www.lars-mueller-publishers" title="www.lars-mueller-publishers">www.lars-mueller-publishers</a> --</p>
