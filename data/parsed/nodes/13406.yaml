      <p>Type is like music in having its own beauty, and in being beautiful as an accompaniment and interpretation; and typography can be used to express a state of the soul, like the other arts and crafts. But like them it is too often used mechanically, and so the full expressiveness of this medium is unrealized. If it is used according to a rule or recipe, it becomes dull and loses vividness. Type appears at first to be a rigid medium; but like other rigid media, it is plastic to the living spirit of a craftsman.<br>
      	—J.H. Mason</p>
