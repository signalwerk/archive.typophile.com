    html: <p>Sorry William, no slight intended -- I read a whole bunch of posts (Gerald &amp; Kent's were longest) and didn't check back when I was writing mine. <br> <br>&gt;you didn't address the point that Cheltenham looks like other aspects of the arts and crafts movement - mission furniture and architectural decoration. <br> <br>Yes I did, but I'll take another stab at it. <br> <br>You're right to say that Cheltenham has something in common with, and may have been inspired, by the crude craftsmanship of A&amp;C furniture. But one also finds the forms you mention in the engineering and industrial machinery of that era. The G has always struck me as being very nautical, the bottom right feature suggesting a capstan, or the prow of a Dreadnaught. <br> <br>To me the effect of Cheltenham, and the systematic way it was used in the high tech mass media of the day (see the ad sample in my earlier post), takes it into a completely different realm. And this is what Thomas mentioned too, that the A&amp;C forms were exploited and integrated into a non-craftsman milieu. Really, once the face was developed by a team of foundry engineers such as Morris Benton (wearing lab coats, not smocks, I suspect) for mass production, that's when it stopped being A&amp;C.</p>
