    html: "<p>Nick, <br> <br><i>Take a look at Cheltenham. It is novel. It has, as you said, the look of having been drawn with an architect's tools. I agree. And this is my point: it has a structural modernity of finish quite different to the mainstream of \"revival era\" faces, with their expressive, hand-drawn detailing.</i>  <br> <br>Architect like tools are not new to this industry Nick. Remember Tory's book on letter design.  <br> <br>But chunkiness is certainly indicative of Golden/Jenson. Unless we are not agreeing on what chunkiness is. <br> <br>Cheltenham has the \"look and feel of early \"Arts &amp; Crafts Morris/Roycroftonian\" book faces. Sorry but it does. I am not calling it a revival of letterforms, but look and feel it has. <br> <br>In fact Morris's Golden,  or Jenson is based on \"the work of Nicolas Jenson\". Here is Jenson as revived by the \"Kelmscott Press\". <a href=\"http://lanstontype.com/Jenson.html\" target=\"_blank\">http://lanstontype.com/Jenson.html</a> <br> <br>But here is Jenson revived by Bruce Rogers as shown in Metropolitan in 1914. <a href=\"http://lanstontype.com/Metropolitan.html\" target=\"_blank\">http://lanstontype.com/Metropolitan.html</a> <br> <br>Do you see the difference? Naturally you do, Metropolitan is not chunky. Although still typography, and Bruce Rogers was under the great inspiration of the \"Arts &amp; Crafts\" movement. In particular, note Rogers' work with ornamentation. <br> <br>Take a good look at the two \"Revivals\"  <br> <br>Now here is the work of Nicolas Jenson. Morris seems to be the reincarnation of Hrant by \"adding ink on\" <br> <br>Shown by the first dark example of the type face. Scroll downwards to black text. <br> <br><a href=\"http://histoire.typographie.org/venise/chapitre2.html\" target=\"_blank\">http://histoire.typographie.org/venise/chapitre2.html</a> <br> <br><b>Now scroll down and go to this link same page</b> Here they have used Rogers revival for analyses</p>"
