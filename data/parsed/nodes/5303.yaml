lacks subtlety in execution. This can be a virtue in a typeface: it will accomodate sloppy printing, and will not embarrass typographers who use it without much skill. There are many faces like this.  <br> <br>Personally (with the precedent and advice of Oz), I have designed typefaces that could have been slicker and smoother, but some judicious awkwardness adds character. But no, I don't like Cheltenham, although I did use it for an ad once, and it worked well. </p>"
