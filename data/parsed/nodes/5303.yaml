  - id: 38192
    user: 1215
    date: 2004-06-23T06:48:00
    date_raw: 23 Jun 2004 — 6:48am
    votes: null
    html: "<p>I'm going to try to respond to what I think the original point was meant to get at. I think the terms \"chunky,\" \"clunky,\" and even Nick's \"sturdy\" are misleading. They imply a quality of weight and a stubbiness that, while often present in some of the examples cited, is not necessarily inherent in the kind of unexpected geometry that I think is the primary characteristic.  <br> <br>I think that what A. Scott was referring to is what I have called a \"digital vernacular\" -- a quality of simplified and often unexpected geometry being applied in otherwise traditional forms. From my perspective this trend traces back through faces like Downer's Vendetta (1997) and Majoor's Scala (1991) to van Blokland's Proforma (1988) and Carter's Charter (1987) and ultimately to Unger's Swift (1985). Pre-digital influences include Dwiggins's experiments on the one hand and the Czech \"school\" (Menhart, Preissig foremost, Tyfa also) on the other. <br> <br>It strikes me that there are two threads of motivation in these precedents -- one technical and the other aesthetic. The early digital faces I cited were, as Nick pointed out, to a large extent confronting technical constraints, and their simplified geometry comes from efforts to create robustness in the face of coarse resolutions, as well as to conserve memory. The character that comes through is influenced strongly by the problems set before the designers. <br> <br>The other thread is an aesthetic one. The Czech designers were essentially operating within the general \"expressionist\" zeitgeist. The willfully coarse finish of Menhart and Preissig comes from a desire to infuse energy into traditional letterforms while at the same time stripping them of any excess typographic baggage. <br> <br>Dwiggins, in his own way, was also motivated primarily by aesthetic concerns. His experiments in what he called the \"M-formula\" were foremost an attempt to infuse a certain \"snap\" and \"action\" to the letterforms. His newsface efforts also professed to combat certain optical/technical constraints as well. But I think primarily he was exploring a type aesthetic that was influenced by his own cultural milieu -- Art Deco and Cubism, among others. This aesthetic is seen more overtly in his stencilled ornament and illustration. <br> <br>Nowadays, the technical constraints facing Unger and Carter are largely overcome (at least in print), and yet Swift and Charter still seem fresh and vital. The continued exploration of this formal territory in contemporary designs seems primarily for aesthetic effect.  <br> <br>Speaking for myself, there is a fascination with taking seemingly inexpressive, reductive elements -- straight lines and simple curve segments -- and carefully combining them to create an unexpected grace or an organic tension. The yin/yang of the geometric vs. the organic is an ages-old formal dichotomy that can be found interspersed throughout the history of visual culture. The trend that we see in some contemporary type designs is just another expression of that exploration. <br> <br>I use the term \"digital vernacular\" because this kind of expression seems to embody an inherently digital aesthetic: there is a sense of \"truth to the material\" that is appealing. I say <i>\"seems to\"</i> because strictly speaking, of course, this isn't true at all -- there is nothing about beziers that lends them more to straight lines or simple curves; in fact, the wonderful inventiveness of bezier curves is exactly the opposite, that they can be so complex and supple.  <br> <br>Similarly, there is nothing inherent in the woodcut medium that demands the rough, coarse cuts of the Expressionist work of Kirchner as opposed to the fine detail of engravings by Bewick, for example. And yet the raw woodcuts seem to evince a greater \"truth to the material.\" [But now, I've wandered far afield.] <br> <br>Anyway, those are some of my reflections on the matter. <br> <br>-- K. <br></p>"
