    html: "<p><img src=\"http://www.typophile.com/forums/messages/30/39015.jpg\" alt=\"chelt\"> <br> <br>&gt;Cheltenham was a \"retro-fashion statement\", not a \"production solution\". <br> <br>Cheltenham was too innovative a design to be retro. On reflection, perhaps I overstated by saying that the need for convergence (one typeface for many printing situations) produced its design: rather, convergence made it hugely popular, because with its sturdiness it would hold up under abuse, and yet with its precisely drawn features, it had a neatness that worked in many different media, and sizes right up to display. <br> <br>Yes, its chunkyness gave it appeal to the \"Arts and Crafts\" set, but its appeal was more widespread than that, and in fact it co-existed with the major trend of expressively rendered retro faces of the early 20thC, typified by Goudy's work, Kennerley, Garamont, Goudy Old Style, etc. <br> <br>Ultimately, I agree with you on cognitive dissonance -- the best designs are created intuitively, and we seek to rationalize them afterwards. That is the case with Cheltenham, which exists on its own terms. <br> <br>In this sample, taken from an ad in \"New Idea\" women's magazine, September 1905, you can see that display-size Cheltenham has a mechanically drafted precision quite at odds with the Arts &amp; Crafts ideal. At text size, its heft holds up against the rule at right (about 2 pt.). </p>"
