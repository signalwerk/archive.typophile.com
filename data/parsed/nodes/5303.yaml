    date_raw: 23 Jun 2004 — 7:03am
    votes: null
    html: "<p>I agree (ack) with Gerald G. about Cheltenham being redolent of the arts &amp; crafts aesthetic - not of the Jenson influence in type, but of the furniture and architecture. The tall, narrow, rectangular look is very much the same.  <br> <br>As to the popularity of Cheltenham, which Hector finds inexplicable, I think it is due to its filling a niche. It is narrow, dark, with tall ascenders and chunky, square serifs. This makes it quite readable at medium size in newspaper ads and article headlines.  <br> <br>It does work well in the New York Times as a titling face for articles. Matthew Carter recently tweaked it for the NYT. It would be interesting to see a comparison of the old and new - maybe he fixed some of the awkwardness that Hector objects to. Part of the awkwardness I suspect is in what also makes it work well in some specific situations: the narrowness, darkness, tall extenders, and chunky serifs.  </p>"
    html_clean: "<p>I agree (ack) with Gerald G. about Cheltenham being redolent of the arts &amp; crafts aesthetic - not of the Jenson influence in type, but of the furniture and architecture. The tall, narrow, rectangular look is very much the same.  <br> <br>As to the popularity of Cheltenham, which Hector finds inexplicable, I think it is due to its filling a niche. It is narrow, dark, with tall ascenders and chunky, square serifs. This makes it quite readable at medium size in newspaper ads and article headlines.  <br> <br>It does work well in the New York Times as a titling face for articles. Matthew Carter recently tweaked it for the NYT. It would be interesting to see a comparison of the old and new - maybe he fixed some of the awkwardness that Hector objects to. Part of the awkwardness I suspect is in what also makes it work well in some specific situations: the narrowness, darkness, tall extenders, and chunky serifs.  </p>"
