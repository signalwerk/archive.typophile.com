    date_raw: 23 Jun 2004 — 8:20am
    votes: null
    html: <p>I recently used Cheltenham for signage in Eudora Welty's mother's garden--at larger sizes I found it quite graceful, especially the italic. I had to noodle with it more in the printed materials--the spacing and leading were tricky. It is quite different from anything else I've used, it's kind of a "chubby" type... How's that? <br> <br>Further proof of aesthetic features born from technical necessity is Amplitude. The traps aren't needed, but they've become desirable. And Kent, I really am interested by your take on the "truth in materials" because it's usually associated with an "unfinished" quality (coarse cuts in a wood print, visible strokes in a painting, loose lines in a drawing...). I use the word "unfinished" for lack of a better word--I would never call a Van Gogh unfinished. But could this same quality be applied to type?</p>
