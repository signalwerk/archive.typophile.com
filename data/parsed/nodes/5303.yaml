    html: "<p>Nick, <br> <br><i>Morris &amp; Co did not use machine printing of wallpaper in their factory for two reasons: because the quality was poor, and because it alienated the workers. Subsequently he allowed machine printing of some patterns, to produce affordable versions of his designs for the lower classes.</i> <br> <br>You must be a member of the \"Fabian Society\". <br> <br>This imaginary contradiction proves my point about \"Art Manufacturing\". <br> <br>Roycrofters books used more paper than their communal paper making department was able to produce. But that's not what they said in their advertising literature. You could call it, \"Marketing the Arts\". Know anything about Dard Hunter? That's one of the reasons he left. <br> <br>Anyway, as I have shown, there is nothing contemporary about chunky book faces.</p>"
