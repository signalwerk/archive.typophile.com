    html: <p>BTW, from our Post-modern perspective, it may seem that the A&amp;C movement, preceding 20thC modernism, and harkening back to guild days, was retro. But many aspects of it were forward-looking. Progressive socialism was a feature of the movement. Morris was some kinda feminist, and he and Jane Morris pioneered sensible clothes (especially progressive for women of the time). The holes we put them pigeons in now, are not the same as was around back then. <br> <br>One sees a similar dichotomy in the origin of the sans, early 19thC -- some would say (me) a feature of early industrial modernism, others (Mosley, the Nymph and the grot), a neo-classical phenom. Why not both, or perhaps of some historical significance yet to be invented?!</p>
