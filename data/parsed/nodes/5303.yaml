    votes: null
    html: "<p>&gt;William Morris was an \"Art Manufacturer\". This was what the movement was about. It was to improve the state of man, to enrich peoples lives by ornament. To make their homes, their cities, their books, their beds a nicer place for all to live. <br> <br>Gerald, That's not quite right. The main focus was not, as you say, to give consumers more art-full products. <br>With an emergent \"Marxist\" understanding of the way industrial civilisation works, it addressed the relationship between art, artefacts, and the means of production. <br> <br>There were no easy answers. For instance, Morris &amp; Co did not use machine printing of wallpaper in their factory for two reasons: because the quality was poor, and because it alienated the workers. Subsequently he allowed machine printing of some patterns, to produce affordable versions of his designs for the lower classes.  <br> <br>At Roycroft, a hard core commune stuck to its guns. They were the ones who were surrounded. <br> <br>The broad ideals of the Arts &amp; Crafts movement influenced the socialist structure of the modern state, especially in Northern Europe. But so did the altruism of enlightened industrialists from Wedgwood on. <br> <br>Nothing is neat and tidy, everything overlaps. <br> <br>Now, how about some samples of contemporary chunky book faces, please?!</p>"
