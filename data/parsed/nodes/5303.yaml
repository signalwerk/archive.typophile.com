    html: "<p>This \"digital type\" theory is old news. Sturdy (as opposed to Chunky\") typefaces such as Scala and Charter were produced in the early days of digital, to deal with the exigencies of the new process, in particular 300 dpi laser printers. Adobe Garamond also addressed the issue. <br> <br>A similar problem existed in the phototype era: the hairlines of types such as Galliard and ITC Garamond were prone to disappear during the production process. <br> <br>You can even go back to the early 20th century, and look at the problem printers had with using the same font on both uncoated and coated paper (where fine details were hard to keep right in big print runs) -- and the need for convergence in that era produced the uber-chunky Cheltenham. <br> <br>So, this is an ongoing technical engagement with \"druk\". <br> <br>Digitally, we have been through the rough early days, emerging into digital mastery -- with extreme high-res typography (admittedly, planar lithography can never achieve the palpability of letterpress, or the density of toner, but its resolution is superior).  <br> <br>So, I would say that the present vogue for chunky type, if there is such a trend, is a reaction against the recent high-res phenomenon of typographers spec'ing tiny, ultra-light/ultra-fine type on smooth coated stock, a communal indulgence to \"push it\" to a limit that was previously unattainable. </p>"
