    html: <p>Nick, <br> <br>That is the result of your observation flaw about the "Arts &amp; Crafts Movement". Stress the "Movement". <br> <br>Morris said, "keep nothing in your house that is not usable, or that you do not consider beautiful". He did not dictate beauty. He left room as big as a mansion for other artisans to participate.  <br> <br>Take a look at Tiffany glass. Nothing like Stickley furniture. <br> <br>However, that said, the biggest defeat to your point is that Goodhue, like it or not, was greatly influenced directly by Morris. <br> <br>Read again</p>
