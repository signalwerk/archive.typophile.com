    html: <p>Kent, <br> <br>I assumed Chris knew Goudy designed Pabst Col. Fred Pabst of Pabst Brewing Company. <br> <br>On the other hand many others would not. <br> <br>But Kent, I am having trouble with the essence of the question in this thread. I have developed a theory but am not sure it applies in this case. <br> <br>For instance, would they call this chunky? <a href="http://lanstontype.com/Jenson.html" target="_blank">http://lanstontype.com/Jenson.html</a> <br> <br>Or Pabst. Pabst is obviously a less serious face, meaning it is for display, where Jenson could be both. But there has been mention of false inking. For me Pabst is somewhat playful on "false inking", as if Goudy was making fun of bad presswork. Although, as we know it probably has nothing to do with that, Goudy cut it in hot metal. It is merely playful, nothing serious, nothing that would sound the drums from the "inkist camp". They would blush to use Pabst as an example. After all it makes them look ridiculous. <br> <br>Also I get confused when anyone speaks of "too bold", or "too light". Non of this makes sense unless in context of a specific use. Some faces simply are light, or are bold. Using the word "too" would have value in historical work, in other words if a face was light and the revival was much darker, you could consider it "too bold". Otherwise it really does not have "too" much meaning. <br> <br>Or does it? Which is where my theory may apply.</p>
