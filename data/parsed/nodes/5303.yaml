  - id: 38202
    user: 2021
    date: 2004-06-23T12:37:00
    date_raw: 23 Jun 2004 — 12:37pm
    votes: null
    html: "<p>Gerald, <br> <br>You should look at the typeface with your own eyes, rather than through the lens of monolithic, conventional,  histories based on fine books. (With which I am well aware, you don't have to \"educate\" me, thank you.) I prefer to look at magazines, by the way. <br> <br>Matt McGrew suggest that there were many contributors to the Cheltenham design, including Goodhue, Kimball, Benton, and Phinney. <br> <br>Even if all these were ardent  Morrisonians, with every intention of producing an \"Arts &amp; Crafts\" typeface, does that mean that the finished product will end up worthy of such a pedigree? <br> <br>No, with original designs (more so than for revivals/copies), things don't always turn out as originally intended. One can set out to produce a work that will have a particular appeal, and people will take to it for a quite different reason. <br> <br>Did these folks consider themselves to be part of an Arts &amp; Crafts movement? had the category even been invented? Were they open to other influences? Of course -- yet history distills and simplifies. <br> <br>Yes, the shift was away from the 19th century modern faces, but these persisted well into the 1920s, and other new (in 1890s) faces such as Century built on that Modern tradition. While a revival of that era, it should be pointed out that Bodoni was not an A&amp;C old style. <br> <br>Take a look at Cheltenham. It is novel. It has, as you said, the look of having been drawn with an architect's tools. I agree. And this is my point: it has a structural modernity of finish quite different to the mainstream of \"revival era\" faces, with their expressive, hand-drawn detailing. <br> <br> <br></p>"
    html_clean: "<p>Gerald, <br> <br>You should look at the typeface with your own eyes, rather than through the lens of monolithic, conventional,  histories based on fine books. (With which I am well aware, you don't have to \"educate\" me, thank you.) I prefer to look at magazines, by the way. <br> <br>Matt McGrew suggest that there were many contributors to the Cheltenham design, including Goodhue, Kimball, Benton, and Phinney. <br> <br>Even if all these were ardent  Morrisonians, with every intention of producing an \"Arts &amp; Crafts\" typeface, does that mean that the finished product will end up worthy of such a pedigree? <br> <br>No, with original designs (more so than for revivals/copies), things don't always turn out as originally intended. One can set out to produce a work that will have a particular appeal, and people will take to it for a quite different reason. <br> <br>Did these folks consider themselves to be part of an Arts &amp; Crafts movement? had the category even been invented? Were they open to other influences? Of course -- yet history distills and simplifies. <br> <br>Yes, the shift was away from the 19th century modern faces, but these persisted well into the 1920s, and other new (in 1890s) faces such as Century built on that Modern tradition. While a revival of that era, it should be pointed out that Bodoni was not an A&amp;C old style. <br> <br>Take a look at Cheltenham. It is novel. It has, as you said, the look of having been drawn with an architect's tools. I agree. And this is my point: it has a structural modernity of finish quite different to the mainstream of \"revival era\" faces, with their expressive, hand-drawn detailing. <br> <br> <br></p>"
