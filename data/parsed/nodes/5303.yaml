    date: 2004-06-23T08:45:00
    date_raw: 23 Jun 2004 — 8:45am
    votes: null
    html: "<p>Chiming in with my graphic designer (as opposed to type designer) perspective: <br> <br>I was under the impression that a lot of these newer, sturdier faces were/are a reaction to the anemic digitizing of metal type that used the metal rather than the printed form as the basis for the digital design. These new faces were never metal, so they are designed through-and-through with the final product in mind by type designers who want to achieve the sturdier forms of earlier type. For a while, I didn't like these newer sturdier faces because I held some of the thinner digital versions as the standard of judgement without realizing some of the history. Now I've warmed to them completely and lust after beauties like Whitman. <br> <br>I don't have any scans of old typesetting to back this up with here, but this is my impression. Am I over-simplifying things with this mindset?</p>"
    html_clean: "<p>Chiming in with my graphic designer (as opposed to type designer) perspective: <br> <br>I was under the impression that a lot of these newer, sturdier faces were/are a reaction to the anemic digitizing of metal type that used the metal rather than the printed form as the basis for the digital design. These new faces were never metal, so they are designed through-and-through with the final product in mind by type designers who want to achieve the sturdier forms of earlier type. For a while, I didn't like these newer sturdier faces because I held some of the thinner digital versions as the standard of judgement without realizing some of the history. Now I've warmed to them completely and lust after beauties like Whitman. <br> <br>I don't have any scans of old typesetting to back this up with here, but this is my impression. Am I over-simplifying things with this mindset?</p>"
  - id: 38198
    user: 2021
    date: 2004-06-23T10:11:00
    date_raw: 23 Jun 2004 — 10:11am
    votes: null
    html: "<p>Gerald, Kent, <br> <br>I have admitted that Cheltenham has Arts &amp; Crafts characteristics, in its heft, and perhaps in its proportions (by \"tall\" I presume you mean a small x-height), but the mechanical qualities of its drafting are at odds with the dominant feature of Arts &amp; Crafts/Revivalist type design of the early 20thC, which is its hand-made quality, which is essentially anti-mass production. <br> <br>Certainly, there were formal qualities in Arts &amp; Crafts era design in architecture and design (such as simplicity and geometric pattern -- eg in Macintosh, Wright), which was proto -Deco, -Modern, and -Moderne, but in graphics, typography and type design the movement was resolutely old-world, and as I said, expressive of the hand in its execution. Again, Goudy's types, and Benton faces such as his Garamond and Cloister, and Cooper's Black -- these are the defining, most used faces of that era, and they bear no trace of the ruler, set square, or compass: Cheltenham is very different from these. And Century. <br> <br>But enough of Cheltenham. I'd rather discuss the present day. We do tend to lapse into kicking the old chestnuts around, don't we? In the post where I mentioned Cheltenham, I gave equal space to phototype, but no-one wants to talk about that. ITC Garamond is persona non grata! <br> <br>Chris, you are right in your observation about \"anemic digitizing\", many type designers (including myself) wrestled with this in the early days of digital type. But \"anemic phototype\" was also a problem -- as an art director in the '70s and '80s, I found that the funkiness of old metal type and hand-lettering (which I saw in old books and magazines) was something sorely missing in the slick smoothness of commercial typography. <br> <br>So really, this is an endless phenomenon, the battle of art against commercial slickness -- it is what propelled Morris into type design, among others. <br> <br>Hector, I agree with you that Cheltenham lacks subtlety in execution. This can be a virtue in a typeface: it will accomodate sloppy printing, and will not embarrass typographers who use it without much skill. There are many faces like this.  <br> <br>Personally (with the precedent and advice of Oz), I have designed typefaces that could have been slicker and smoother, but some judicious awkwardness adds character. But no, I don't like Cheltenham, although I did use it for an ad once, and it worked well. </p>"
