    html: <p>I agree wholeheartedly with almost everything Nick just said. <br> <br>From my study of them, I am fairly sure that Benton and paricularly Phinney did not particularly consider themselves part of the Arts &amp; Crafts movement per se, but they were both responsible for the mainstreaming and commercializing of it, getting it into the mass media of the time. <br> <br>J.W. Phinney in particular saw something that was clearly prime for mass-market popularity, and was got ATF to be the first (AFAIK) big foundry to really jump on what would become the bandwagon, directing knockoffs, revivals, and stuff inspired by older models. The part of A&amp;C he saw value in was turning back to historical models for type. The auteur-like private press and careful craftsmanship part of A&amp;C, well, I don't know if that was such a big concern to him. Perhaps it was just irrelevant, insofar as ATF was solely a retail foundry and not really a printer/publisher (its glorious specimen books notwithstanding). So they just made the type, and what folks did with it was up to them. But certainly supplying people who were part of the A&amp;C movement could have been only a tiny part of ATF's sales. <br> <br>BTW, when ATF knocked off Morris, they didn't just do a straight knockoff, but "fixed" some of the letters in ways that make me cringe a little. Although the general character is still present, some of the more interesting details have been eliminated. Reminds me a little of ITC's revivals of the 70s. <br> <br>Sorry if I'm taking this off topic. The 1880s-1920s has long been my favorite period in type design. <br> <br>Cheers, <br> <br>T</p>
