    html: <p>I believe that maybe the "clunkiness" you refer to is an attempt to add life to digital type. Some think digital types are overly homogenized and monotonous--especially compared to the subtle varieties in a letterpressed page. Whitman is surprisingly simple (in some ways) and angular at larger sizes, but at text sizes the angles blend with the curves and it becomes a very readable font. This is true of the roman and italic. <br> <br>I think Scala and Tyfa may fall into this category as well. (was Tyfa first designed for letterpress?) <br> <br>Also, I know I've at least read about it on Typophile, the Dwiggins experimental newspaper font (which is mentioned on the Quetzal post and in Mr. Johnson's Czech link above) does have these qualities. I have a Fine Print issue with a sample, I'll have to post it when I get a chance. Again, at small sizes, these features become more subliminal, right? <br> <br></p>
