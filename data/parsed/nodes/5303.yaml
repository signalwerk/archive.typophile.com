    html: <p>Hmm, my dictionary says that 'chunk' is a 'thick piece' or a 'corpulent animal'. <br>So, I guess 'chunky' typefaces are more about weight and proportions, not asymmetry and roughness. Also, I see that most 'chunky' faces have wedge serifs. <br> <br>Personally, I think some of these 'chunky' typefaces are too dark. That's my only complaint about them. Of course, some fonts like digital Electra, are too light. But Avance, on the other hand, it's too dark (serifs are too big). <br>Smeijers' typefaces (Quadraat, Renard, Arnhem) are well-balanced, I think (I've read books set in Renard and Arnhem FWIW). He usually makes thick stems but the serifs aren't so big or heavy. <br> <br>This is a interesting topic. I'd like to hear more opinions. <br></p>
