  html: |-
    <p>I'm making a tee-shirt for a local group event (The Emmaus walk) and the design is similar to the Chicago Cubs logo.<br>
    <a href="http://www.thesportsbros.com/images/categories/MLB_Cubs.gif" title="http://www.thesportsbros.com/images/categories/MLB_Cubs.gif">http://www.thesportsbros.com/images/categories/MLB_Cubs.gif</a><br>
    I read this: <a href="http://wiki.answers.com/Q/What_font_do_the_Chicago_Cubs_use_in_their_logo" title="http://wiki.answers.com/Q/What_font_do_the_Chicago_Cubs_use_in_their_logo">http://wiki.answers.com/Q/What_font_do_the_Chicago_Cubs_use_in_their_logo</a><br>
    which says,"The Exact font is Century Gothic Bold."<br>
    Unless I'm completely mistaken, that is completely wrong.</p>
    <p>Could you please tell me what font is really used?<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/MLB_Cubs_6520.gif"></div><p></p>
