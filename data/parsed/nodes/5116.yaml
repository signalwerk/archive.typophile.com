    html: <p>Jack -- If you were working in the USA, it would be more difficult to convince others that it could be done with one typeface family. I think the advantage to Garamond would be your ability to squeeze long headlines into narrow measures by using its various bold condensed family members. Of course, it might be too restrained to use only one typeface family for sensational journalism, where the eye-chart style of typography sets the pace. Now, how do I put in one of those smileys?</p>
