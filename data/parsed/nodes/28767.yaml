    html: |-
      <p>David: of course, anything is possible with Photoshop :-)<br>
      But note how in the Richler illustration the lines for the hair look like hair, and on the skin follow the form of his face, whereas in the "Engraver" filter example, the wavy pattern bears only occasional coincidence with the represented form. Where the pseudo-engraving goes across the eye for instance, a real illustrator would have drawn a line along the eyelid, and a circle for the iris. To improve the effect in Photoshop, it would be better to combine using the engraving filter on flat areas, but use Levels for high contrast in areas with linear detail.</p>
