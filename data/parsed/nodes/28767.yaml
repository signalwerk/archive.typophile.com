    html: |-
      <p>Try taking your photo. Adjust the contrast to simplify the image. Size the image. Convert to grayscale. Upsample to 1200 dpi. Convert to bitmap&gt; halftone&gt; line&gt; now work with the line number and angle to get the effect you want.</p>
      <p>Note: this will not produce the wavy contour lines that must be done by hand, but it will give a similar effect. The end result will be an 1-bit tiff that will print with clean lines. Some experimentation is needed to get the best reults.</p>
    html_clean: |-
      <p>Try taking your photo. Adjust the contrast to simplify the image. Size the image. Convert to grayscale. Upsample to 1200 dpi. Convert to bitmap&gt; halftone&gt; line&gt; now work with the line number and angle to get the effect you want.</p>
