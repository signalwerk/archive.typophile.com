  html: |-
    <p>Is there any way in Font Lab to create glyph specific metrics? For instance, when a capital Y is next to a Capital A I would like to have the Y snuggle up real close with the A, but when the Y is next to a T I don't want it to overlap nearly as much.</p>
    <p>Thanks</p>
