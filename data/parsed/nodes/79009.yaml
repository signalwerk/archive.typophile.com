      <p>Hi Kent — and anybody else who's interested, after heading down to St. Brides Library today, and going through a couple of books, I'm pretty sure that the Woolf's used Caslon in their earlier hand-printed editions produced at the Hogarth press. Some text from one of the books (The handprinted books of Leonard and Virginia Woolf at the Hogarth Press, 1917-1932 / by Donna E. Rhein. ISBN: 0835716945);</p>
      <p>[Just off Fleet Street they happened upon] "The Excelsior Printing Supply co., where they bought a small handpress, complete with instruction booklet and some *Old Face* type for £19. 5s. 5d."</p>
      <p>I assume *Old Face* type is meant in the broader sense of the word (classification) and having looked at the printed pieces (most of which are somewhat poor reproductions of the Title pages – not full text blocks) it seems to tally that it was Caslon or something very similar, I was focusing on the swash characters used (A, P and R), the inward curling second leg of the italic lowercase h and the numerals to identify the type.</p>
      <p>Thanks again Kent! Apologies for the poor image quality!</p>
      <p>FB</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/hogarth_002_4807.jpg"></div><p></p>
