    <p>Hi all,</p>
    <p>I'm going to be designing a book about Virginia Woolf, and I'm having some trouble with choice of typeface.</p>
    <p>I was hoping someone here may know the typeface/s that were used by the Hogarth Press; Virginia and Leonard Woolf. My instincts would be Founder's Caslon or Baskerville, more likely Caslon though.?</p>
    <p>Image attached of a page from T. S. Eliots "The Waste Land", from here; <a href="http://cloud.lib.wfu.edu/blog/sca/2010/08/03/the-waste-land-by-ts-eliot-published-at-the-hogarth-press/" title="http://cloud.lib.wfu.edu/blog/sca/2010/08/03/the-waste-land-by-ts-eliot-published-at-the-hogarth-press/">http://cloud.lib.wfu.edu/blog/sca/2010/08/03/the-waste-land-by-ts-eliot-...</a></p>
    <p>I'm going to be heading down to St.Brides Library during the week to view their archives and see if they have any literature relating to the Hogarth Press. I think this looks like what I need: Handprinted Books of Leonard and Virginia Woolf at the Hogarth Press (Studies in Modern Literature, No 52) by Rhein.</p>
    <p>Anyway thanks in advance.</p>
    <p>Best,<br>
    Fred.</p>
