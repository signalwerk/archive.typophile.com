    html: |-
      <p>Tend to agree with Don and even more when you know The Sunday Times uses <a class="freelinking external" href="http://www.emtype.net/sunday_times_01.php" rel="nofollow">Sunday Times</a>, a bespoke typeface exclusively designed by Eduardo Manso.<br>
      The closest I have at the moment are <a class="freelinking external" href="http://www.myfonts.com/fonts/flat-it/rama-gothic" rel="nofollow">Rama Gothic</a> and <a class="freelinking external" href="http://www.myfonts.com/fonts/suitcase/monopol" rel="nofollow">Monopol</a>, different in many points but with the right design for Rama Gothic /g (off for Compacta and Helvetica Compressed) and /r.<br>
      Reminds me of also <a class="freelinking external" href="http://www.typography.com/fonts/knockout/overview" rel="nofollow">Knockout</a>, <a class="freelinking external" href="http://www.typography.com/fonts/champion-gothic/characters/" rel="nofollow">Champion Gothic</a> and a bit of <a href="/wiki/https%3A/%252Fcommercialtype.com/typefaces/giorgio/sans" class="freelinking" rel="nofollow">Giorgio Sans</a>.</p>
    html_clean: |-
