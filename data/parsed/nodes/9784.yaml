  html: <p>what would be the advantages/drawbacks of placing oldstyle figures as the default figure style in an OT font? i'm trying to decide whether i should do it  or not.</p>
  html_clean: <p>what would be the advantages/drawbacks of placing oldstyle figures as the default figure style in an OT font? i'm trying to decide whether i should do it  or not.</p>
comments:
  - id: 62455
    user: null
    date: null
    date_raw: null
    votes: null
    html: <p>My only concern is convention or just plain habit.  Even though you may find oldstyle the one you would most often use, people are accustomed to seeing lining figures as the default and your way might confuse them.  If they have standard style sheets with lining figures used in tables, they can change only the font in the style sheet and get the expected result.  If they use your font, they don't get what they expect.</p>
