    html: <p>Figure style is a big part of the personality of a typeface. If you think oldstyle figures are the ones most in keeping with the style of your font, I'd go ahead and make them the default. <br> <br>It's OpenType, so people can change the figure style to suit their preferences. The only real disadvantage is that only the Adobe apps make it easy to select figure style right now, so people who want to use lining figures might curse you, but that goes both ways.</p>
