    html: <p>Paul, <br> <br>I think Chris mentions the major concern -- people are used to seeing lining figures.  Minor concerns are what would happen when users attempted to typeset math, and what would happen with tabular figures.  If it's an OpenType font, and you include the other figure types, users could just choose what they want.  When I convert my OpenType fonts into TeX fonts, I always use onum for the default fonts because it's what I want.  But I also make lining "versions" because I'll be using those in mathematical expressions. <br> <br>Forrest, <br> <br>TeX and friends can use figure styles (or any other OpenType feature) without any problem.  I use 'otftotfm' to make a variety of different Type 1 fonts that I use in my TeX documents (one with lining figures, one with discretionary ligatures, etc.).  In fact, I'd imagine you could use the same tool on any platform to extract whatever Type 1 variants you want.  It's not quite as convenient as choosing the feature from a menu in InDesign, but it's also not a huge problem. <br> <br>Chris Swingley, Fairbanks Alaska</p>
