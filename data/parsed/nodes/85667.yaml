    <p>Hi. I'm not sure if this is the right place for this, but it must be worth a try.</p>
    <p>I have a bizarre font request.</p>
    <p>Purely for personal fun, I’m interested in a sans-serif futhorc (Anglo-Saxon runes) set evolved to resemble the Japanese kana (either katakana or hiragana), while still identifiable as futhorc.  Preferably matching the dimensions and weight of simplified Chinese characters in another font (I expect creating your own hanzi font would be much too time-consuming). </p>
    <p>I keep some private notes in a mixed runic/hanzi script, and a font like this would be amazing to see, but perhaps challenging to produce.</p>
    <p>I would be willing to make a donation in return for such a font (only a small one, though), and I would use it a lot and enjoy it.</p>
    <p>If this sounds like an interesting project, give it a try.</p>
