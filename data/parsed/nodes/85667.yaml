    html: |-
      <p>Yeah, it is interesting. Runes weren't designed with paper or brushes in mind and were intended for carving, so it would be good to see a modern evolution of the script. Chinese characters and runes are my two favourite writing systems and, although I can use them together, it doesn't have much aesthetic appeal.</p>
      <p>On the other hand, kana and kanji in Japanese (a mixed system) go together nicely. I love looking at Japanese text even though I can't read it. It seems well balanced, with the kanji making skim-reading easy and the kana breaking it up, so it doesn't look as dense as Chinese text.</p>
      <p>If I could make my own mixed system (runes and simplified hanzi) look that good, it would please me greatly.</p>
      <p>As for the magic ring and crystals, I have none of those to give. :P</p>
      <p>And I don't have anything against serif fonts, it's just that a nice, clean sans-serif font is my priority.</p>
