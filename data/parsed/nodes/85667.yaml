      <p>It sounds not so funny for me, it rather sounds like an interesting exercise for the typographical mind at least. If it is to become a project as well this is another question.</p>
      <p>It’s once again about graphically harmonizing different scripts, what about we have struggled so far for at least twelve years now …<br>
      Runes and Kana, sounds a bit strange at the first glance, but it isn’t a strange thing at all. I have worked on harmonizing Runes to Latin and airport pictos to Greek … funny yes, but very serious kind of fun ;-)</p>
      <p>Why “sans serif”?</p>
      <p>@ Simon: you and your folks should have been the first band to seriously think about harmonizing Runes to Kana and Arabic and Gujarati and Cherokee and … but you didn’t bother. We all know :-)</p>
