    <p>A couple of days ago I updated my css for my own personal website to make it a little more readable. I removed italics and boldness from all headlines, shrunk the font a little bit in favour of a bigger line-height, etc.</p>
    <p>Could you give me some feedback on the readability of the site now? And on the general feel of the site?</p>
    <p>The link is <a href="http://www.squawkdesign.com" title="Squawk" rel="nofollow">squawkdesign.com</a></p>
