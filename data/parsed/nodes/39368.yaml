      <p>Lovely illustration on the top bar! I fact the top one-third of the page is really nice. Somehow the rest is not working as well as that.  </p>
      <p>Probably it is an issue of hierarchy. Quite a lot of elements seem to have more or less the same level of prominence that you are not sure what to look at first, what next. </p>
      <p>A few suggestions:</p>
      <p>:: Relook the text of your intro. While the different definitions of Sqawk are sort of fun, I wonder if it may not be an idea to combine those three levels of intro into one crisp, and if possible amusing :), paragraph of not more than three lines.</p>
      <p>:: You might want to introduce some white on the background in the lower half of the page. It's currently a little too monochromatic.</p>
      <p>:: Make the screen-shot of the featured project a little smaller. And avoid the project-title running into the thumbnail.  </p>
      <p>:: The date on the description of the featured projects could perhaps come after the description itself, as against between project name and description. </p>
      <p>Good luck!</p>
