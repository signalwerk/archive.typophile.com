      <p>Florian: I did a little research on Safari's minimum font size. It seems like Safari forces it on the element after all other values have been computed. This means that widths (such as my left padding) are not updated. The only solution would be to stop using ems to specify widths, which I do not want to do... I do not know whether !important would make much of a difference.<br>
      What's your opinion? I saw that did some webdesign, so I think it is safe to ask. (even though this is a typography forum.)</p>
      <p>EDIT: It seems like there is a way around it: <a href="http://www.gunlaug.no/contents/wd_1_03_04.html" title="http://www.gunlaug.no/contents/wd_1_03_04.html">http://www.gunlaug.no/contents/wd_1_03_04.html</a> Just specify the largest font size on the parent and use values smaller than 1em on its children. Does anybody have any experience with this?</p>
      <p>Thanks to everybody who pointed up some (obvious) flaws. However, I directed the post more at readability... Any comments on that? :(</p>
