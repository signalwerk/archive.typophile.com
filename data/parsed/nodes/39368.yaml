    html: |-
      <p><cite>What’s your opinion? […] even though this is a typography forum.</cite></p>
      <p>Hey, there’s more to typography than letterforms – quite the contrary; positioning, size and interaction of text (and other) elements is what typography in a narrower sense is all about. ;°)</p>
      <p>My 2 cents (I hope you find them helpful and constructive):</p>
      <p>Building a scalable website is a honourable task – but it’s full of pitfalls, too.  So, test-test-test, and don’t assume every user will use the same UAs, fonts and font-sizes.</p>
      <p><cite>The only solution would be to stop using ems to specify widths, which I do not want to do</cite><br>
      Maybe you have to compromise … Your background image is based on pixels, too – in consequence text runs across the bright vertical sidebar border.<br>
      <strong>Create true correlations:</strong> If you want the sidebar to have a border, specify the border for this very element, not via the background-image for some superior element (‘div id="dock"’).</p>
      <p>I see you’re fond of the web standards idea – which is laudable – however have in mind that it’s not the validation engine that wants to be pleased but the human user.</p>
      <p>Some concrete points:<br>
      Specifying image size in em will preserve proportions, but it implicates uglily blurred images.<br>
      Your list item contains a h4 heading, a paragraph (date) and another paragraph. If you want these 3 to align properly, treat them equally! If necessary, wrap them up in a container element. Right now, their aligning is more or less coincidental, depending on the user to retain the defaults (which defaults?).</p>
      <p><cite>However, I directed the post more at readability... Any comments on that?</cite><br>
      Well, it’s hard to descend to the details if elements overlap … ;°) However:<br>
      I find the line-height of h1 quite big.<br>
      For the ‘Recent Weblog Entries’ section: Why can’t the titles themselves be clickable? Is it really necessary to have a (to me) distracting extra ‘Read’ link in every single line?</p>
      <p>Best regards,<br>
      F</p>
