      <p>&gt; <em>There are certain names that cannot be trademarked. You can not run willy-nilly with trademarks.  There is government regulation and oversight.</em></p>
      <p>I think the problem we are facing regarding typefaces and their names is the WAY people now search for type.</p>
      <p>Given the fact that there is an active community of type users (and type buyers), I hazard a guess that the majority of searches are done on the web and not through hardcopy catalogs and/or promo material.</p>
      <p>Given the fact that many new designers (and users of type) may not know the more established type foundries, type designers, font vendors and developers, a simple search for <em>Leporello</em> may yield (theoretically) two or more sources -- one on a font distributor site as Leporello™ and one on a "Free Font" site listed as LePorellow (a type rip-off with no trademark info).</p>
      <p>In the past, there was legal recourse since the majority of type foundries were known to each other and could be confronted. But today, a font could be knocked-off relatively easy and placed for download on the web quite quickly and anonymously.  </p>
      <p>The trade-protection of type relies both on the industry itself AND the consumers. Back in the old twentieth-century, designers would often insist on using specific typefaces from reputable foundries. Today the type using market is less likely to care about where it came from but how much it costs if anything.</p>
      <p>For some reason (I can hazard a guess why) brand names are still highly vested among consumers. This is a chief reason why trademarking typeface names is the strongest option for protecting type at this time.</p>
