      <p>The name 'Helvetica' <em>as applied to a typeface</em> is a Linotype trademark. Names of <em>typefaces</em> that are close to that name, especially if deliberately so, fall within the typical bounds of trademark infringement as set by existing laws. If you want to preserve a trademark, you have to defend it. Every time you fail to defend your trademark, you weaken it, because in a subsequent case the defendant can say 'Look, they have not rigorously defended their trademark when it was infringed on this occasion'. That, unfortunate or absurd as the results may sometimes be, is the situation in which trademark owners are obliged to operate.</p>
      <p>The situation for digital fonts is complicated by their status as software. We wanted to call a font Oracle a few years ago, but were advised against it by a lawyer on the grounds that Oracle is an established trademark in the software business. Presumably if we had been making metal type, this would not have been an issue.</p>
