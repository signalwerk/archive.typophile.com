      <p>It should be noted that there is a difference between a claimed trademark and a registered trademark. A trademark can be claimed simply by a statement claiming that 'X is a trademark of...'. The requirements for such a claim are that the trademarked product is in the marketplace, and that you defend that trademark against infraction. If someone uses your trademark and you fail to defend the trademark, then you can lose it. If you have claimed a trademark and someone else comes along and claims that you are infringing their trademark, then you need to be able to prove that your use of the trademark precedes theirs.</p>
      <p>The situation for a registered trademark is actually very similar: you still need to actively defend your trademarks or risk losing them. But the fight will be easier because the registration process requires proof up front that you have a right to the trademark and that it does not impinge on anyone else's trademark. This requires a trademark search, which can be very expensive, especially if you want to register internationally in multiple jurisdictions.</p>
      <p>Given how expensive the registration process is, and the <em>requirement</em> to actively defend your trademarks, one can hardly blame companies for taking a hard line on anything that can be perceived as trademark infringement: if they let anything pass by without a challenge, that can be taken as insufficient defense of the trademark, and it may be lost.</p>
