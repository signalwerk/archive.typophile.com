      <p>YES!!!!<br>
      A typeface/family is a product which is requested, specified, ordered, purchased by name, and in some instances the name serves as the key identifier as to which product it is ("Neue Helvetica™" vs. "Helvetica™").</p>
      <p>Current technology uses "name" identifiers in the font selection menu on virtually every PC/Mac as opposed to numeric or strictly visual identifiers. The branding of a typeface is therefore critical all the way up to "font selection" menu.</p>
      <p>Historically it wasn't always a major branding issue each time a typeface was released, and in fact, many type houses never used names (just catalog numbers) for a great majority of faces during the photo-headline heydays. </p>
      <p>But thanks to the MarketingGods, EVERYTHING in the friggin' commercial universe is branded, trademarked and promoted up the Yin-Yang! And whenever money is to be made, legal battle lines are drawn to protect or defeat the investors.</p>
      <p>Maybe Prince was on the right track for a (short) while when he tried re-branding himself as a glyph with no name.</p>
      <p><em>The typeface formerly known as "Leporello" by Chris Lozos</em></p>
