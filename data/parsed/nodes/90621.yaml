    html: |-
      <p>Theoretically there is no specific problem with a character at this position, but the software has to support its actual drawing on screen. Your solution is as good as anything else; the use of other glyphs to display a Tab, Hard Return, Space, or other special character is common.</p>
      <p>And usually its 'special' status is indicated by having a different color than the surrounding text. See commands like 'Show Invisible Characters" in your favourite text editor. (Microsoft Word, with its intrusive glaringly black "hidden" characters is an exception.)</p>
