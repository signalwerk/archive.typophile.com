    <p>I'm trying to build a custom font that will make control character EOT visible. For instance, the EOT character (ASCII 4) would would be inserted as a symbol when I type cntrl + D.</p>
    <p>I have drawn the glyph in FontLab studio, but when I generate the font, the EOT character is not present.</p>
    <p>Could some kind soul explain how I can achieve this, or point me to a decent resource that I might try to understand the problem?</p>
    <p>Thank you</p>
