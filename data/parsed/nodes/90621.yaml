    html: |-
      <p>I've given up on trying to place a glyph into the EOT position and will instead handle the problem in my code:</p>
      <p>Whenever I see the EOT char (x04), I replace it with the section sign (xA7). In my font, I've replaced the section sign with the symbol I want to use. This only works because I know my software doesn't have to support the section sign.</p>
      <p>It still bothers me that I had to handle this with code. Both Fontlab and Fontforge have the glyph at this position, but I can't figure out how to it.</p>
      <p>Thanks for all the replies, I would have kept spinning my wheels looking for the "perfect" solution had you guys not convinced me it was difficult (if not impossible) to do.</p>
