    <p>Luis Siquot was born in 1945 in Neuquén. While working as graphic designer between 1964 and 1968 he studied cinema, architecture, and modern literature in Córdoba, Argentina. During that time he won several first prizes in design contests. In 1965 he moved for one year to São Paulo, Brazil, to work at the Editôra Abril where he learned magazine design. In 1967 he was awarded a scholarship to study at the HfG Ulm by the German DAAD, but unfortunately the school was closed in 1968.</p>
    <p>At the end of 1969 he travelled to Germany with the same scholarship and studied at the Visual Communication Institute of the Superior Fine Arts School of Hamburg University (IVK-HfbK) between 1970 and 1975. Always a typography lover he made some unpublished or unfinished type designs between 1968 and 1989.</p>
    <p>In 1991, while living and working in Valencia, Spain, he acquired a Mac and all the necessary software to take the first steps in digital type design. As a result of the process since 1995 he has published 12 typefaces with ITC.</p>
    <p>At the moment works and teaches graphic design and typography privately in Córdoba, Argentina.</p>
    <p>Fonts designed by Luis Siquot:</p>
    <p>ITC Abaton<br>
    ITC Arecibo<br>
    ITC Arecibo Too<br>
    ITC Cali<br>
    ITC Florinda<br>
    ITC Juanita<br>
    ITC Juanita Condensed<br>
    ITC Juanita Deco<br>
    ITC Juanita Lino<br>
    ITC Juanita Xilo<br>
    ITC Juanita Xilo Condensed<br>
    ITC Portago</p>
