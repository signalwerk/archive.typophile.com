    html: <p><a class="freelinking external" href="http://www.fontshop.com/fontlist/families/vista_slab/" rel="nofollow">Vista Slab</a> is another slab serif -- which, being a bit sans-like, I can imagine the client being talked into even though they prefer sans -- and I think it captures some of the verticality of Klavika. Adelle looks like a nicer face in its own right though IMHO. I'd also consider <a class="freelinking external" href="http://www.fontshop.com/fonts/downloads/lucasfonts/theserif_classic/" rel="nofollow">TheSerif</a>.</p>
