  html: |-
    <p>I need to typeset a series of training manuals (life skills coaching). The client uses Klavika as their corporate font. I'm not sure if I should just use Klavika for the body text - it might get a bit much – or look at something else.<br>
    The client would prefer to stay with a sans serif.<br>
    Any recommendations much appreciated.</p>
    <p>Cheers</p>
