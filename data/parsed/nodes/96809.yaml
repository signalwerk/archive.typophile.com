    <p>Hello.<br>
    I am near the end of my graphic design program at school. For my portfolio,<br>
    I have chosen to use the typeface Austin. I wanted my book to have a fashionable feel<br>
    to it. I like how it looks as a display and for titles. but what do you guys think about it being used for text? The book is mostly graphic design with short explanations. I feel like this is a similar situation to using Didot for text. The thins don't help for reading.</p>
