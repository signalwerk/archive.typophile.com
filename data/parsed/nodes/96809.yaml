      <p>The Scotch story is rather convoluted.<br>
      At any rate, the Austin type is related to the Carter types Miller and Georgia:<br>
      <a href="http://typefoundry.blogspot.ca/2007/02/scotch-roman.html" title="http://typefoundry.blogspot.ca/2007/02/scotch-roman.html">http://typefoundry.blogspot.ca/2007/02/scotch-roman.html</a></p>
      <p>Really, you could use anything that has an early 19th century provenance, but not Bodoni or Didot.<br>
      Richard Austin’s types were a reaction to that kind of cool neo-classicism, as in his foundry statement:<br>
      <a href="http://typefoundry.blogspot.ca/2007/02/richard-austins-address-to-printers.html" title="http://typefoundry.blogspot.ca/2007/02/richard-austins-address-to-printers.html">http://typefoundry.blogspot.ca/2007/02/richard-austins-address-to-printe...</a></p>
