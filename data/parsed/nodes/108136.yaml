    html: |-
      <p>Grzegorz may have a point regarding the hinting of the font especially if you auto-hint on output. If FontLab is creating many, many hints for each glyph it maybe too much for the system, you may need to just insert a single ghost hint at the baseline position for each glyph.</p>
      <p>Also for a distressed style of font you should turn off 'Use subroutines to compress outlines...etc'. FontLab may try to create thousands of small contour subroutines that will not be of any benefit and may cause errors.</p>
      <p>I am happy to run some diagnostics on your fonts for you if you wish (mwooden at dtptypes dot com).</p>
