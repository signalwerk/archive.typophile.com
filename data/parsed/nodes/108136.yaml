    <p>I have been selling a font family for over a year now, and just recently received a few emails from users saying they are getting a System Validation Error in Font Book, and are advised to not install this font. It's only happening to a couple people, but I want to fix the problem. The font has always worked perfectly for me so there isn't really a way for me to test whether I have solved the problem or not.</p>
    <p>I've read some other forums on the subject... one solution was generating the font with hinting enabled. I checked my settings and this was already done. </p>
    <p>Another suggested a solution that was on the user side:<br>
    1. Deleting the file ~/Library/Preferences/com.apple.systemuiserver.plist and then log out/in<br>
    2. Install the 10.6.2 combo update</p>
    <p>I can't test this as the issue doesn't apply to me, but is anyone confident enough in that solution that I should email it out to consumers? Any thoughts would be greatly appreciated!</p>
