    votes: null
    html: <p>In a more general note, if your font is more about distressed texture than particular curve control, why not distribute it with TrueType outlines? Both problems Malcolm’s just mentioned are of PostScript nature, so they wouldn’t apply. TrueType outlines are in some measure also more ‘native’ technology to Microsoft and Apple, and both companies deal with it very well. Font Book, for example, would list the table with TrueType outlines and indicate it specifically in case of any problems, whereas the CFF/PostScript table didn’t even show up in the report.</p>
