    html: "<p>An age-old problem: the end-user. Not all users keep their systems in the cleanest shape nor do they all use their computer in the same way, so no one answer will fit all. Since you don't have a problem with the font then the font is probably OK. The simplest solution might be to have the users put the \"problem\" font in ~user/Library/Fonts rather than use Font Book to manage them. Font Book has never been known to be the best of font managers anyway.</p>"
