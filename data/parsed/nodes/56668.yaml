    html: <p>Note the distinction between ð and ∂. The Icelandic lowercase eth has a bar through it, just like the uppercase. The character ∂ is a mathematical symbol with no uppercase form, but it is based on a legitimate variant shape of the lowercase d found in some cursive styles (this is also the normal form of the Cyrillic letter д in most italic styles).</p>
