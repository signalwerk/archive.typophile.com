      <p>No, the ‘d’ in Audi is neither a ∂, a ð nor a đ. Just a regular lowercase Latin d. The form without downstroke used to be pretty common in Germany, as it is the usual ductus in <a href="http://www.fontshop.com/fonts/category/blackletter/" rel="nofollow">Blackletter</a> (Audi was founded in 1909).<br>
      You can find the ‘stemless d’ in other logos (like <a href="http://www.brandsoftheworld.com/catalogue/J/12632.html" rel="nofollow">Jade</a>) and also in a number of non-Blackletter typefaces (e.g. <a href="http://www.fontshop.com/fonts/singles/underware/bello_pro_ot/&amp;sample_text=Audi%20with%20d%2C%20not%20%E2%88%82%2C%20%C3%B0%2C%20%C4%91" rel="nofollow">Bello</a> or <a href="http://www.fontshop.com/fonts/singles/linotype/cochin_std_italic/&amp;sample_text=Audi%20with%20d%2C%20not%20%E2%88%82%2C%20%C3%B0" rel="nofollow">Cochin Italic</a>).<br>
      F</p>
