      <p><cite>The character ∂ is a mathematical symbol with no uppercase form, but it is based on a legitimate variant shape of the lowercase d</cite></p>
      <p>It stands for partial derivative (and hence is sometimes simply called "partial", as in "partial f by partial y" for ∂f/∂y). It contrasts the "ordinary" derivative, which is symbolized by a d, and we say "dee x by dee y" for dx/dy.</p>
