      <p><em>The question is when do you use this particular glyph if it has so many uses.</em></p>
      <p>What altaira, Andreas, and terminaldesign are saying is that this character will only come up if you are setting type in one of those three languages. Just like, say, an <strong>a</strong> with an acute accent -- <strong>á</strong> -- is used by certain Latin-based alphabets, but not all of them. You wouldn't use it in an English text, unless you had to type a Spanish name or word, for example. Same goes for the <a href="http://en.wikipedia.org/wiki/Eth" rel="nofollow">eth</a> character.</p>
    html_clean: |-
