      <p>(This Salvo Serif kicks ass.)</p>
      <p>I had never thought of that, Nick, that mixing monospace with unicase could help correct the problems that usually come along with monospaced faces; makes perfect sense.</p>
      <p>Actually, some time ago I started a unicase sans-serif project which I then evolved into something along the lines of what I said about Panoptica, trying to make Uc and lc forms all in a unicase style. Indeed, wasn't easy.</p>
      <p>Meanwhile, for other people searching for something similar to what I was looking for, try going through <a class="freelinking external" href="http://www.fontshop.com/fontlist/genres/monospaced/" rel="nofollow">Fontshop's lists of monospaced fonts</a> as well (as I did once I conquered laziness). Very helpful.</p>
