  html: |-
    <p>So the title says it all. I have an idea for a job I was asked to do and ideally it would require a monospaced typeface. Being a typophile, of course I didn't want just any monospaced typeface; it has to work nicely, as in, it has to make the “monospace” work. Usually the problem lies with wider characters like the M (lc and uc) and with lc F and R, for instance. So I'm looking for something you'd feel comfortable setting a paragraph or two in.</p>
    <p>Are there such things?</p>
    <p>(If it had small caps, that would be almost perfect; if on top of that it had a sans and serif version, that would be perfect.)</p>
