      <p><em>Panoptica could help the idea along great if it had both lc and uc forms for each letter…</em></p>
      <p>There are some unicase faces which have different (optically) sized versions of the same glyph for upper and lower.<br>
      Sort of "Unicase with Small Unicase".<br>
      But that doesn't really work, as the minuscule forms look too strange as "caps" in mixed case setting, while the majuscule forms just look ordinary.</p>
      <p>The whole point of Panoptica is that it solves the inconsistencies in width of a "normal" monospace font by means of unicase design.</p>
