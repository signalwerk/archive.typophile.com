    <p>Hey there everyone,<br>
    I’m finishing up this identity piece and figured I’d ask for some feedback. I’m pretty happy with where I am with it, but opinions can always help push the design. The logo is for a restaurant/deli/wine bar that is more than casual and less than fine. It’s sort of in the middle for 25-55 year-olds who like fabulous food and even better wine. So, what do you think?</p>
