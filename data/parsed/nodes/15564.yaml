      <p>I like very the visual idea and the wine glass. It must be very seldom green wine that will be drinked at your bar. :o) I miss space between two words a bit. And I would do smaller space between “l” and “u” of Blue. And I think the wine glass must have wider foot without topple down even the wine is pushed like in your illustration. Top glass area could be drawn bigger, because you lose details at<br>
      small resolution.<br>
      The line under Jackie Blue is another story. I miss right orientation to the big line. “BAR” must be directed to “e” or it is unclean, “MODERN” to left site of “a”. I think such wide spacing troebles reading especially setted in capital letter and more than 2 words. Less spacing but bigger font would do more sense, because it<br>
      produces good contrast in combination with top line.</p>
