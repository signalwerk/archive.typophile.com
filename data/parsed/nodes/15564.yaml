      <p>First impression: I really like the logo - my reservation is the large ‘B’ of ‘Blue’, it breaks things up a bit, forcing the strapline too far away from ‘Jackie Blue’. Why not keep the ‘b’ the same weight &amp; size as the rest of the title? I was grabbed by the wine glass, It’s appealing, but maybe a deep red would be a better choice of colour. Also, my first impresssion was to read the glass as an ‘i’, so I didn’t mind that aspect of it. I would darken up the strapline a bit also, it might get lost quite easily.</p>
      <p>It looks classy - in my opinion, the only time you see wine swirled around like it’s done in your logo is when connoisseurs are having a sniff of it!</p>
      <p>Dan - I think it’s just you! I like the letterspacing, I like the way it brings the logo together as a unit. There’s enough fluidity in the illustration, the type tightens the logo up nicely.</p>
      <p>Si</p>
