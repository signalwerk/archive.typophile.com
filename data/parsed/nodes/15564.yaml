    html: <p>This is an odd way of putting this but - How masculine do you want this to be? Looking again I find that it feels maybe too femme. Like a soap or powder. If you thicken the verticals on the name I think that floaty feeling will go away &amp; the name will start to feel more even. I know you have modeled the thickness of the verticals on the wine glass - but maybe print one out &amp; take a pencil to it &amp; see if you like it. I don’t care about the tag line saying deli. People are willing to suspend disbelief for a restaurant… The tag does seem a little light &amp; hard to read. Do you really need it?</p>
