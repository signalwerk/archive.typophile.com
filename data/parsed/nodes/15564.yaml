    html: |-
      <p>Let me apologize about the tagline. I didn’t mean to have that on there. Not my words, not my idea, but they’re married to it. You know how it goes.</p>
      <p>Thank you all very much for the comments and suggestions. I took a lot of them into consideration. I also ran it by some people in their target audience.</p>
      <p>I need to let you all know about the area I’m dealing with so you can see how this logo fits into the general scheme of things. The area is a small city with a 4 block long restaurant row. The restaurants are okay, but always packed. Some of the places are cool during the week. The weekends are hell though. They’re full of horny old guys trying to pick up girls half their age. Testosterone is never in shortage here.</p>
      <p>The main goal of this restaurant is to be modern, stylish, refined but approachable. The food is going to be amazing and not pricey. They want to accentuate taste and quality. They also want to stand out from the norm.</p>
      <p>The logoscape here is full of cheesy, redundancies. A lot of red and orange. A lot of royal blue. These colors are very new and really say what needs to be said.</p>
      <p>For the type…They insisted on a sans-serif. I moved forward with the Berthhold Akzindenz Grotesk as my basis because of its modern qualities. It also has an uppity feel because of the tall letterforms.</p>
      <p>I did decide to close up some of the space. I worked the letterforms a bit more to be better kerned and consistent. The wine glass I reworked a bit as well to make sure it was an “I” form more than a “Y” form. I think this is a step in the right direction.</p>
      <p>You can see the changes here:<br>
      <a href="http://www.vigorgraphics.net/clients/JBR-LogoPMS.gif">http://www.vigorgraphics.net/clients/JBR-LogoPMS.gif</a></p>
      <p>I did find out today that they may want to move away from the wine glass completely. I’m a bit disheartened, but hopefully I can sell the design on them during the next meeting.</p>
      <p>In the meantime, more comments?</p>
      <p>Joseph Szala<br>
      Vigor Graphic Design, LLC.<br>
      <a href="http://www.vigorgraphics.net">www.vigorgraphics.net</a></p>
