    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 30.Jan.2006 8.32pm </div>
      <p>- - - - - - - - - - - - - - - - - - - - -</p>
    <p>FOR IMMEDIATE RELEASE:</p>
    <p>Announcing the long awaited launch of Handselecta: The world's first font<br>
    foundry fully dedicated to graffiti-styled typefaces. Volume One available<br>
    now at <a href="http://www.handselecta.com" title="http://www.handselecta.com">http://www.handselecta.com</a> with handstyle fonts by some of the<br>
    world's most accomplished practitioners.</p>
    <p>Fonts available for purchase by:<br>
    -Joker<br>
    -Mene<br>
    -Mesh One AOK<br>
    -Meskyle<br>
    -Sabe KST</p>
    <p>And the roster keeps growing with new fonts in the works by:<br>
    -Ceasr<br>
    -Clark Fly ID<br>
    -Espo<br>
    -Freedom<br>
    -Mike Giant<br>
    -Rust<br>
    -Stab<br>
    -Spark</p>
    <p>-SP One<br>
    -Tester</p>
    <p>Best,<br>
    Christian Acker</p>
    <p>HANDSELECTA | Flip The Script<br>
    <a href="http://www.handselecta.com" title="http://www.handselecta.com">http://www.handselecta.com</a></p>
    <p>- - - - - - - - - - - - - - - - - - - - -</p>
    <p>A pdf version of this press release is available for download at:<br>
    <a href="http://www.handselecta.com/Resources/Handselecta_press_Jan06.pdf" title="http://www.handselecta.com/Resources/Handselecta_press_Jan06.pdf">http://www.handselecta.com/Resources/Handselecta_press_Jan06.pdf</a></p>
