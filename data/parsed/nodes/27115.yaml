  html: '<p>Friends, <br> <br> <br>Your signature is needed to help save the Imprimerie Nationale, one of the greatest repositories of typographic material in the world. (If you have ever used a Garamond revival, or a Didot or a Fournier, you are indebted to the Imprimerie.) Their collection, which spans four centuries, is scheduled to be dissolved in the next twelve months. <br> <br>The petition, in seventeen languages, is here: <br> <br>     <a href="http://www.garamonpatrimoine.org/petition.html" target="_blank">http://www.garamonpatrimoine.org/petition.html</a> <br> <br>I know that the inclusion of YOUR name will inspire others to sign as well. Please step up! <br> <br>Please forgive the wide distribution of this e-mail, but do forward it in its entirety to anyone who you think will join us. <br> <br> <br>Thank you, <br> <br> <br>Jonathan Hoefler</p>'
