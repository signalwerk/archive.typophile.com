    votes: null
    html: |-
      <p>I want to encourage you not to treat it as a mechanistic job. EG - don't assume that the same angle works best for all the letters. On one maybe it stays the same on another maybe you move it 20 points down on another 22 on a yet another 5 etc. </p>
      <p>The variation may give you a richer more interesting feeling, and you may be able to make better letters that way too.</p>
      <p>For instance my guess is that the i could maybe stay the same whereas the r will benefit from a lower angle.</p>
      <p>Another thing I saw was that the lc s looks a little thin compared to the other glyphs. Maybe the middle can be fatter.</p>
