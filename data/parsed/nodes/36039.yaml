  - id: 270692
    user: 2942
    date: 2008-04-05T09:34:00
    date_raw: 5 Apr 2008 — 9:34am
    votes: null
    html: |-
      <p>It's little details like the top of the arm of the r. At smal sizes you might not notice but big you can see that the curve is lumpy. The bottom of the e and it's end need a little more weight. The aldine style diagonal on the echoed in the s is a different angle from the diagonal cut of the descenders. I wonder if it would be good to reduce it in the descenders to that of the s &amp; e. The s falls over backwards. It needs a wider base. I wonder if the r would benefit from starting the crotch of the r deeper down. What if the s had it's terminals out just a little more so the end s might be heavier? What about lettering the ascenders be a little taller? I think that might make the face read better &amp; help make the teeth at the bottom less of an impediment to reading. The bottom of the d seems like a make do solution. In general it is the joins on the letters that need the most help. Look at Cooper Black and maybe the bold weight of DTL Fleischmann, and Freight.</p>
      <p><a href="http://www.dutchtypelibrary.nl/Fleischmann_rdrct.html" title="http://www.dutchtypelibrary.nl/Fleischmann_rdrct.html">http://www.dutchtypelibrary.nl/Fleischmann_rdrct.html</a></p>
      <p>(pull the the weight</p>
      <p><a href="http://www.joshuadarden.com/shop/freighttext.php" title="http://www.joshuadarden.com/shop/freighttext.php">http://www.joshuadarden.com/shop/freighttext.php</a></p>
      <p> I might comment further but I don't have a full glyph set with the cut-ball terminals.</p>
      <p>On some level it's a spit &amp; polish thing. Are all the details the way you want them? Obviously you don't have to do any of this. You may decide that I am mistaken which is quite possible. Or that it's good enough. But what I like about the face is that it's outrageous but it nearly works - very well. I see potential. The ball terminal for instance work better than I thought - even. I would hate to see it be less than it can be. If you are sick of it maybe put it away &amp; come back... But that's just my 2.5 cents.</p>
      <p>What do you think?</p>
