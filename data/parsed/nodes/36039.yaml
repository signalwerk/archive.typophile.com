    <p>Here is a preview of an extensive revision of "Shark," an old typeface of mine.  I started it a few years ago as a hybrid between blackletter and roman, before I knew anything about blackletter.  The revision has ligatures, alternate characters, upper and lowercase numerals, small caps, Cyrillic and Greek alphabets, and the kerning and metrics have been fixed. </p>
    <p>Let me know what you think. Should I keep working on it?  I'm especially interested in feedback from people familiar with blackletter typography. </p>
    <p>-matt</p>
    <p><img src="/sites/default/files/old-images/sample2_1.png"></p>
