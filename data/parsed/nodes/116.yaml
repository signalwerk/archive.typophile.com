    html: <p>Hey Ricardo. Surely, you have a future....;) <br>You found typophile and that's a good start. <br> <br>With "gimmick" fonts...one suggestion... <br>don't attempt to repeat the gimmick  <br>on all the letters. <br> <br>Btw, in this case,  <br>by "gimmick" I mean the wavy round structure. <br> <br>It can work on some letters, but on the H, I, J, L, T... <br>it gives a person vertigo. <br> <br>What program are you using, just curious. <br> <br>good luck and try back with some other stuff. <br> <br> <br>bj</p>
