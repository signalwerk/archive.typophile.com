    html: <p>Hello Ricardo,  I only see now your font and I want to leave some ideias and sugestions. <br> <br>Lowercase letters <br>c - more condensed <br>g - the round parts of this character are a little bit different of others similiar (b,d,p,q) <br>x - more expanded <br>w - probably more condensed <br>y - I prefere the last version because the leg is more identical of the (g). <br> <br>The lowercase letters seems that have few characteristics from the Uppercase. Probably they must have more points in common to have more coerency betten the two parts, its my suggestions.  Good luck for the work. <br>Regards / um abra</p>
