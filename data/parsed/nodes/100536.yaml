      <p>Adding something new and not competing are indeed very important, and nobody should aim to stunt the nice cultural progress that derivation allows. But there's also the issue of not reusing outlines (without permission) in a font that's being distributed. If a designer saves time thanks to another designer having made an effort, I for one feel he needs to: admit to it; and compensate the original designer. Do you feel the same way?</p>
      <p>BTW, I'm not making an accusation of any kind - I haven't even looked very closely at your library. And I certainly think your acceptance of feedback from Ernst is a very good sign.</p>
      <p>For example my Trajic notRoman* was made with the outlines of Adobe Trajan. There's no way it could ever be used instead of Trajan (and in fact it might even help Trajan's sales since it intermixes with it). However not only did I not release it, but whenever somebody emails me asking to <em>purchase</em> it, I say no.</p>
      <p>* <a href="http://themicrofoundry.com/ss_trajic.html" title="http://themicrofoundry.com/ss_trajic.html">http://themicrofoundry.com/ss_trajic.html</a></p>
      <p>BTW anybody interested in voicing an opinion on such matters might elect to do it here:<br>
      <a href="http://typophile.com/node/99822#comment-543360" title="http://typophile.com/node/99822#comment-543360">http://typophile.com/node/99822#comment-543360</a></p>
      <p>hhp</p>
