      <blockquote><p>Adding something new and not competing are indeed very important, and nobody should aim to stunt the nice cultural progress that derivation allows. But there's also the issue of not reusing outlines (without permission) in a font that's being distributed. If a designer saves time thanks to another designer having made an effort, I for one feel he needs to: admit to it; and compensate the original designer. Do you feel the same way?
      </p></blockquote>
      <p>Absolutely. And I feel confident no outlines have been reused in the grunge fonts I have reworked. I base this on the horrible quality of the outlines, spacing and character sets of the fonts I started out with... ;) They were probably created with printouts or samples printed out, then grunged up, scanned and outlined. Which I think is a fair working method.</p>
      <p>And f.ex. Nick Curtis and Halmos Levente are excellent at drawing outlines with beziers, so all their fonts are drawn from scratch, for sure.</p>
      <p>Myself, I also drew my own (rather geometric) version of DIN Mittelschrift (from the german specs) before creating all my experimental variants of it in my (still ongoing) DINfun project.</p>
      <p>I have made every effort to keep CheapProFonts an honest and fair foundry (even fighting some REAL pirates in the background) and have a very clear conscience about my work.</p>
