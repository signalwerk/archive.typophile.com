      <p>Sorry for the delay in posting back to the thread, haven’t been on Typophile for a few days.</p>
      <blockquote><p>BTW, I do know Bleeding Cowboys is a roughed up version of Oklahoma, and that Fontleroy is based on Stuyvesant and Bellevue... And some of the other "grunge" fonts are probably also based on other fonts... But I feel that they all add something new to the designs, and do not compete with the originals in any way.</p></blockquote>
      <p>Those are of course what I was referring to. </p>
      <p>The issue for me is when you can plainly identify that a commercial font was used as the basis for a grunge/distressed font. When the base lettershapes are created by redrawing  — no matter how badly :-) — it is obviously less egregious than actual outline theft, but that does not make it any more ethical in my book (no matter that it is legal in some markets). AFAIC it directly sponges off the designer of the original font because, let’s be frank here, the finished product wouldn’t exist without that original.</p>
      <p>Furthermore when a font such as this is done by an amateur enthusiast and intended to be released for free that’s one thing, but when subsequently given a commercial release that’s something else entirely.</p>
