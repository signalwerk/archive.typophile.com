      <p>@Typoblivion: Yes, my Geometry Script Pro is very close. The original "fancy" logo is just a logo and has never existed as a font AFAIK. When I was working with my "Geometry Soft" project I toyed with making a connected version, I remembered that logo, and I chose to implement some similar letterforms across my two Script versions. It is not identical - it is after all built directly on my original Geometry Soft Pro letterforms). I made a sample image containing the word "fancy" as a homage ;)</p>
      <p>@Gräfenberg: I object strongly to your language and description of my efforts over 5 years. I would recommend investigating matters before you throw your accusations around.<br>
      CheapProFonts is mainly a collection of upgraded "free" fonts, and all fonts reworked by me are done under agreement with the original font designers. They receive up to 50% of the retail price of all my Pro versions sold (which means that the fonts I sell through distributors like MyFonts, Fontspring and Fontdeck leave precious little for myself ;) If you ask any of my 13 collaborators I am sure they can vouch for me.<br>
      I have also created many new font designs of my own. Some of them may not be extremely original, but they are in no way ripoffs.<br>
      CheapProFonts is a good karma project (good quality, low price, fair royalties, generous licensing terms) and I am sad to see you slander me and my foundry  like this...</p>
