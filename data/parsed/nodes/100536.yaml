      <p>First of all: I do know a lot of font history, and I do care very much about type designers and their rights. I just see it slightly different than you regarding some of these cases - I take more into consideration if the fonts add something new, and if they compete in any way with their "originals". If they respectively do and don't (and are drawn from scratch) I think they're OK - and deserve a reworking and a commercial release.<br>
      And there ARE fonts that I have available for reworking that I will NOT rework and release, exactly because of such considerations...</p>
      <p>I don't believe you have "higher standards" - you just have "different standards". So I felt your initial response "I’m certain the maker is guilty of ripping off legitimate commercial fonts" was really uncalled for.</p>
      <p>BTW, Oklahoma started out as a free font, which was probably why Guillaume used it as a basis for what became Bleeding Cowboys. Both fonts now have commercial versions. It's progress. ;)</p>
