    html: |-
      <p>One of the major book romans with that style <strong>a</strong> is Bembo, based on the type cut by Francesco Griffo for Aldus Manutius’ 1495 edition of De Aetna by Pietro Bembo in Venice. <a href="http://www.myfonts.com/fonts/adobe/bembo/" target="_new">Adobe make a good Bembo</a></p>
      <p>Here’s a picture:</p>
      <p></p><div class="imageWrap"><img src="/files/anotherbembo_5390.gif"></div><p></p>
      <p>Compare it to Adobe’s and it becomes obvious the one I used here lacks authenticity, the bowl being too tall and not square enuff.</p>
      <p>Also look at <a href="http://www.myfonts.com/fonts/agfa/poliphilus/" target="_new">Monotype’s Poliphilus</a>, used by Manutius to print the infamous Hypnerotomachia Polyphilus book of fantastic nonsense.</p>
      <p><em>...the way they’re squared off makes them seem rugged and virile to my eyes.</em></p>
      <p>Rigor, robustness, tension. The easiest way to get it is to make the curves and letter form squarish. Presently in some guises I guess it also goes by the name of “hyperellipse”.</p>
      <p>j a m e s</p>
