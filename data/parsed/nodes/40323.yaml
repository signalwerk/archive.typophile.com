      <p>That one is totally missing what I’m talking about. It’s missing any evidence of a broad-nibbed pen or quill like the earlier examples. You can’t see any evidence of the “pulling” of the nib toward the baseline, and the cross strokes being one straight movement of the pen.</p>
      <p>Interestingly, I’ve seen quite a few sans-serif designs that I really love that have this same sort of feeling.</p>
