    <p>I have fallen in love with typefaces with the scribally influenced miniscule a’s. They’re not wimpy or weak at all, and the way they’re squared off makes them seem rugged and virile to my eyes.</p>
    <p>These types of lc a’s seem to be prevalent particularly in <a href="/wiki/garalde" class="wiki">garalde</a> and <a href="/wiki/venetian" class="wiki">venetian</a> <a href="/wiki/oldstyle" class="wiki-create">oldstyle</a> typefaces, but  a few modern serifed fonts have used them as well. This seems to be a particular favorite form of <a href="/wiki/Robert%252BSlimbach" class="wiki">Robert Slimbach</a>, as quite a few of his typefaces have this particular style of a.</p>
    <p><strong><a href="/wiki/Nicholas%252BJenson" class="wiki">Nicholas Jenson</a> types</strong><br>
    LTC Metropolitan Pro (<a href="/wiki/Centaur" class="wiki-create">Centaur</a>)</p><div class="imageWrap"><img src="/files/Metropolitan-Pro_3722.gif"></div><br>
    <a href="/wiki/ITC%252BLegacy%252BSerif" class="wiki-create">ITC Legacy Serif</a><div class="imageWrap"><img src="/files/legacy-serif_3558.gif"></div><br>
    <a href="/wiki/Adobe%252BJenson%252BPro" class="wiki-create">Adobe Jenson Pro</a><div class="imageWrap"><img src="/files/Adobe-Jenson-Pro_3829.gif"></div><br>
    <div class="imageWrap"><img src="/files/spacer_5172.gif"></div><br>
    <strong>Claude <a href="/wiki/Garamond" class="wiki">Garamond</a> types </strong><br>
    <a href="/wiki/Adobe%252BGaramond%252BPremier%252BPro" class="wiki-create">Adobe Garamond Premier Pro</a><div class="imageWrap"><img src="/files/Garamond-Premier-Pro_3436.gif"></div><br>
    <a href="/wiki/Stempel%252BGaramond" class="wiki-create">Stempel Garamond</a><div class="imageWrap"><img src="/files/GaramondNo8_4900.gif"></div><br>
    <div class="imageWrap"><img src="/files/spacer_5172.gif"></div><br>
    <strong>20th Century types</strong><br>
    <a href="/wiki/ITC%252BMendoza%252BRoman" class="wiki-create">ITC Mendoza Roman</a><div class="imageWrap"><img src="/files/ITC-Mendoza-Roman_5326.gif"></div><br>
    <a href="/wiki/Adobe%252BMinion%252BPro" class="wiki-create">Adobe Minion Pro</a><div class="imageWrap"><img src="/files/Minion-Pro2_4153.gif"></div><br>
    <a href="/wiki/Adobe%252BArno%252BPro" class="wiki-create">Adobe Arno Pro</a><div class="imageWrap"><img src="/files/Arno-Pro-Regular-12pt2_3558.gif"></div><br>
    <a href="/wiki/Madrigal%252BAntikva" class="wiki-create">Madrigal Antikva</a><div class="imageWrap"><img src="/files/Madrigal-Antikva_6387.gif"></div><br>
    <div class="imageWrap"><img src="/files/spacer_5172.gif"></div><br>
    Does anyone know anything else about these styles of miniscule a’s?<br>
    And if you have any favorite types with this style of lc a that I’m missing, please post a 72x72 pixel sample. I’d love to see it.<p></p>
