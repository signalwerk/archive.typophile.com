    html: |-
      <p>@Fontgrube only the designer needs to have the CS suite.<br>
      once the form is created with fields, that form is usable by anyone with reader.<br>
      The contents will stay with the file when the file is saved.</p>
      <p>Think to when you are downloading a Passport application.<br>
      You can fill out digital fields and save the document with all fields saved.</p>
      <p>To disable editing, you just have to secure the document so no one can change the content of the fields.</p>
      <p>But whatever works best.</p>
