      <p>@Colin: Why does it have to be a PDF if it needs to be editable? Word processors allow forms with fixed as well as editable contents. </p>
      <p>BTW, OpenOffice.org offers a plugin to edit PDFs in OOo Draw.</p>
      <p>@xil3: It cannot be safely assumed ;-) that Colin's client is willing to buy CS for that purpose. Field contents in PDF forms cannot be saved with Acrobat Reader.</p>
      <p>Andreas</p>
