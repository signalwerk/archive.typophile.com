    html: <p>Adobe Acrobat lets you make changes to the text of a PDF, as long as you embed the fonts AND have these fonts loaded on your computer. But the editing is limited to single lines (i.e., it would be tedious and painful to edit an entire paragraph!). Is this what your client is asking for? (It's not the same as making a form with fields to fill in.) Your client would have to own Acrobat, not Reader, to be able to edit the PDF.</p>
