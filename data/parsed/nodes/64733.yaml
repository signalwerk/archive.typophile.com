    html: |-
      <p>Use the Form creator in Adobe Acrobat. I'm using Adobe Acrobat 9 but it works in lower versions as well. </p>
      <p>Select Forms &gt; Create new Form<br>
      Select 'Start with an Electronic Document'<br>
      follow the prompts.<br>
      When asked to identify fields, select 'Run Auto Field Detection'. This often works better.<br>
      Once complete, Adobe LiveCycle will open up.<br>
      Here you can modify your fields and edit its options. </p>
      <p>For more info, read up on the help for Adobe LiveCycle.</p>
      <p>*LiveCycle should be installed already with the Adobe Creative Suite.</p>
