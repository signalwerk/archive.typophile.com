    <p>Hello,<br>
    I'm Giuseppe Salerno, type designer &amp; calligrapher.<br>
    I wanted to show you the project that took me more the one month. 8 Hours each glyphs.<br>
    Is a Blackletter type.<br>
    Here there is all the information: <a href="http://www.resistenza.es/blaqfont/" title="http://www.resistenza.es/blaqfont/">http://www.resistenza.es/blaqfont/</a><br>
    I hope you will like it.</p>
    <p>I also wanted to show you my calligraphy blog: <a href="http://youareinthecircle.tumblr.com/" title="http://youareinthecircle.tumblr.com/">http://youareinthecircle.tumblr.com/</a></p>
    <p>Bye!</p>
