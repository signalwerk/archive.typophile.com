    html: |-
      <p>Wow.<br>
      This is quite delicious.</p>
      <p>&gt; 8 Hours each glyphs.</p>
      <p>It's a bit uncanny that this seems to be a sort of<br>
      magic number. The punchcutters of yesteryear<br>
      used to average about 8 hours per character, and<br>
      whenever I get serious about doing my best that's<br>
      the number I arrive at myself! This has been true<br>
      whether I've made outline or (grayscale) pixelfonts.</p>
      <p>hhp</p>
