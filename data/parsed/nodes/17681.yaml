    html: <p>If memory serves in order to get more than the standard dictionaries you'll have to go into the "options" of the InDesign installer and enable the languages you need.</p>
    html_clean: <p>If memory serves in order to get more than the standard dictionaries you'll have to go into the "options" of the InDesign installer and enable the languages you need.</p>
  - id: 106960
    user: 7006
    date: 2006-02-02T09:05:00
    date_raw: 2 Feb 2006 — 9:05am
    votes: null
    html: |-
      <p>okay, i did it! here's what i did:</p>
      <p>i went to the folder i previously mentioned (C:\Program Files\Common Files\Adobe\Linguistics\Providers\Proximity\) and copied the following files: pol32.clx, pol103.lex, pol.hyp &amp; polphon.env. I then opened the following folder: C:\Program Files\Adobe\Adobe InDesign CS\Plug-Ins\Dictionaries\Proximity and pasted in these files. Now I get Polish from my drop-down language menu. Thank you all for helping me to work my way through this.</p>
    html_clean: |-
      <p>okay, i did it! here's what i did:</p>
      <p>i went to the folder i previously mentioned (C:\Program Files\Common Files\Adobe\Linguistics\Providers\Proximity\) and copied the following files: pol32.clx, pol103.lex, pol.hyp &amp; polphon.env. I then opened the following folder: C:\Program Files\Adobe\Adobe InDesign CS\Plug-Ins\Dictionaries\Proximity and pasted in these files. Now I get Polish from my drop-down language menu. Thank you all for helping me to work my way through this.</p>
