      <p>CE dictionaries are included in CS Central European version and in <a href="http://www.adobe.com/support/downloads/detail.jsp?ftpID=3168" rel="nofollow">CS2 version.</a><br>
      Some people used old Proximity dictonaries with Roman InDesign versions, but i don't know about their origin. </p>
