    <p>Apologies if this is in the wrong place...<br>
    I have someone needing a complete set of U&amp;lc plus numbers in Opentype format for Regular, Italic, Bold and Bold Italic based on an existing 8 letters. The bold needs to be completed in 4 weeks and the rest within 8 weeks after that. I have no idea what to charge for this project. I've done many projects like this in the past but with studio walls, not as freelance work. Any help would be great!</p>
