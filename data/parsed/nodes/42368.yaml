    <p>Hi,</p>
    <p>I am currently working on a new logo for a carpenter company called "HTG" who make gymnasium interiors etc.</p>
    <p>The client actually came up with the logo idea. The "T" is a technical structure they use on a daily basis, so it seemed reasonable to me to make a logo out of it. What do you guys think? Has this logo got potential? If so, what could be improved?</p>
    <p>Thanks for any feedback.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/HTG_6703.png"></div><p></p>
