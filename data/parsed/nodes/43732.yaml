    <p>I'm curious to know if any type designers here have color synesthesia and whether it influences or inspires your work.</p>
    <p>I don't know how this would manifest, but -- well, that's why I'm asking. This is just a personal query, something I've wondered about for years, nothing to do with research.</p>
    <p>I have it but am not a type designer. It doesn't influence my print design work, but I do occasionally employ it in my abstract art.</p>
    <p>Color synesthesia is perceiving specific colors associated with letters and numbers. See description at <a href="http://en.wikipedia.org/wiki/Grapheme-color_synesthesia" title="http://en.wikipedia.org/wiki/Grapheme-color_synesthesia">http://en.wikipedia.org/wiki/Grapheme-color_synesthesia</a></p>
    <p>Thanks to <a href="http://typophile.com/user/9599" rel="nofollow">Alessandro</a> for references in an earlier post.</p>
    <p>--Suzanne</p>
