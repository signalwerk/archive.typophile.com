      <p>I have it slightly. It's greyscale for me and only has to do with numbers, dates, times of year or week. I can't say it has influenced my design work at all but I have considered working with it somehow in my fine art. I have sketched it out a little.</p>
      <p>Chris, as far as I can explain it, when I think of a number, or a date, I see it kind of in a greyscale continuum. I can't explain why some numbers are lighter and others are darker. I can picture the year in the same way, different months have different tones.</p>
