      <p>To me, it's as if there's a transparent overlay of color over a letter. I see type as black (or whatever the ink color is), but also sense/perceive a color to each letter and number. It's helpful in recalling names and phone numbers -- "no, it's more green than that; must be a 4, not a 9" -- and spelling.</p>
      <p>It doesn't matter which typeface it is, though the bolder the glyph, the stronger the perceived color. It works in handwriting, too.</p>
      <p>Greyscale continuum, Patty -- cool! (BTW, "grey" is more grey than "gray.")</p>
      <p>--Suzanne</p>
