  html: |-
    <p>Join our Mailing list by March 20th, and in addition to our offer of a free typeface-Crewekerne Regular or Adantine Regular, you’ll receive a discount code allowing you to purchase any (or all!) of our <a class="freelinking external" href="http://new.myfonts.com/fonts/gatf/sabio/ " rel="nofollow"> Sabio</a> family from Myfonts.com at a 50% discount.</p>
    <p>Existing mailing list members will shortly receive this discount code by e-mail.  </p>
    <p>To join our maing list, e-mail <a href="mailto:gatf1@live.com">gatf1@live.com</a>, quoting “Join Mailing List” in the subject line.  Remember to tell us whether you would prefer to receive <a class="freelinking external" href="http://new.myfonts.com/fonts/gatf/adantine/ " rel="nofollow"> Adantine</a> or <a class="freelinking external" href="http://new.myfonts.com/fonts/gatf/crewekerne/ " rel="nofollow"> Crewekerne</a> as your complimentary typeface on joining.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/memb1_6389.png"></div><p></p>
