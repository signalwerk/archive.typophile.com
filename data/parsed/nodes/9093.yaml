    html: "<p>Dear friend, <br> <br>Two months are left to the deadline for submission to bukvaraz!, the type design competition of the Association Typographique Internationale. <br> <br>We are inviting you all to submit your work to bukva:raz!. We would much appreciate your entering your designs to bukva:raz! After all, a show is only as good as its pieces, and we are certain that your entry can make a difference. <br> <br>A brief description of the competition follows. More information on bukva:raz! can be found on our Web site, at www.atypi.org/bukvaraz&gt;, or requested from this office. <br> <br>Please let us know if you wish to receive, by e-mail, a special information package, and we shall send it to you at once, nicely compressed, to save download time, and to protect the integrity of the file. <br> <br>The package (in PDF format) consists of the full text of the Call for entries, and the competition Entry form. Kindly specify your choice of compression format: SEA or ZIP. <br> <br>[Please advise us of your current mailing address, so we could fetch you a copy of the printed version of the Call for entries (it does include the Entry form). We would also appreciate your sending us your current telephone and telefax numbers.] <br> <br>If you have questions regarding any aspects of the competition--e.g., the rules of participation, the submission procedure, the judging, etc.,--do not hesitate to ask. We can be easily reached by mail, by telephone, by telefax, and by e-mail (see below). <br> <br>We look forward to hearing from you, to seeing your work entered to bukva:raz!, and, inshallah, selected by the jury for its typographic excellence. Good luck. <br> <br>Thank you in advance, <br> <br>Maxim Zhukov, Chairman, bukva:raz! <br> <br>,  <br> <br>Anna Shmeleva, Secretary, bukva:raz! <br> <br> <br> <br>==================================================== <br> <br>bukva:raz! <br> <br>Type design competition of the Association Typographique Internationale, 2001 <br> <br>Name: <br> <br>In bukva:raz! bukva is the Russian for 'letter' (as in 'letterform') and raz for 'one' (as in 'two thousand and one'). <br> <br>Venue: <br> <br>Moscow, Russia. <br> <br>Date (judging): <br> <br>1-2 December 2001. <br> <br>Organiser (on behalf of ATypI): <br> <br>Type Designers Association, Moscow. <br> <br>Jury: <br> <br>Matthew Carter, Yuri Gherchuk, Akira Kobayashi, Lyubov' Kuznetsova, Gerry Leonidas, Fiona Ross, Vladimir Yefimov. <br> <br>Chairman: <br> <br>Maxim Zhukov. <br> <br>Secretary: <br> <br>Anna Shmeleva. <br> <br>Categories: <br> <br>Text typefaces, display typefaces, pictorial typefaces. <br> <br>Writing systems: <br> <br>Any. <br> <br>Period covered: <br> <br>1997-2001. <br> <br>Deadline: <br> <br>Monday, 5 November 2001. <br> <br>Fee (entry, hanging, etc.): <br> <br>None. <br> <br>Mailing address: <br> <br>bukva:raz! 21 Rozhdestvensky Bvd., Bldg. 2, Moscow 103045, Russia. <br> <br>Telephones: <br> <br>+ 7 (095) 928-3688; + 7 (095) 332-4001 <br> <br>Facsimile: <br> <br>+ 7 (095) 129-0911. <br> <br>E-mail: <br> <br>bukvaraz@atypi.org <br> <br>URL: <br> <br>www.atypi.org/bukvaraz</p>"
