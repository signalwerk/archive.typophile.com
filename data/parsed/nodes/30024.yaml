      <p>Also, the work that Alexei Chekulayev has been doing for Linotype in recent years is quite good: <a href="http://www.linotypefont.com/109331/frutigercyrillic55roman-font.html" rel="nofollow">Frutiger</a>, <a href="http://www.linotypefont.com/109252/saboncyrillicroman-font.html" rel="nofollow">Sabon</a>, <a href="http://www.linotypefont.com/109049/universcyrillic75black-font.html" rel="nofollow">Univers</a>, <a href="http://www.linotypefont.com/109286/wiesbadenswingcyrillicregular-font.html" rel="nofollow">Wiesbaden Swing</a>, <a href="http://www.linotypefont.com/109280/sanmarcocyrillicroman-font.html" rel="nofollow">San Marco</a>. </p>
      <p>BTW, Chekulayev recently extended <a href="http://www.linotypefont.com/search/frutigercyrillic" rel="nofollow">Frutiger</a> for Linotype while some years ago, Tagir Safaev designed ParaType's own Cyrillic version of Frutiger called <a href="http://www.font.org/pt/search=FreeSet" rel="nofollow">FreeSet</a>. Both are good, though I prefer Safaev's version. I think it should be interesting for you to compare these two. </p>
      <p>A.</p>
