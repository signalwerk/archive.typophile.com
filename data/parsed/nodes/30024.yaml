      <p>Hrant, </p>
      <p>I fully agree. If you read Maxim Zhukov's paper, you will find that he firmly believes that some Cyrillic letters *must* be identical with their Latin "relatives". I don't think it's reasonable. </p>
      <p>Most ParaType cyrillizations, and most Cyrillic typefaces altogether, suffer from the fact that Latin and Cyrillic share the same letter proportions. I think the Cyrillic lowercase could be slightly taller, and have larger sidebearings -- that'd be the minimum. I don't see why some forms couldn't be a bit different altogether. </p>
      <p>This is wonderfully proven with ITC Officina and FF Meta. Of both Spiekermann's typefaces (both adapted for Cyrillic by Tagir Safayev), Meta actually works better in Latin text, but for Cyrillic, Officina is far superior. Officina used to be very popular in the West but when Meta was released, it gradually replaced and suppressed Officina. But not in Russia. Officina Cyrillic is still one of the most popular modern sanserifs there, and Meta is hardly present. </p>
      <p>Officina has looser spacing and a higher x-height than Meta: for Latin, it is a bit over the top. For Cyrillic, it works perfectly. I don't even think it's an ad-hoc hypothesis: I believe that the intuitive choice of typographers in both script rooms and their "natural" preference for Meta over Officina or the other way around, delivers actual proof. </p>
      <p>Adam</p>
