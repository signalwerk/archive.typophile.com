      <p>Sebastian, </p>
      <p>Matthew Carter’s Georgia is most likely the best Cyrillic typeface designed by a non-Russian, and one of the best Cyrillic faces ever. It’s perfect in every sense. </p>
      <p>The work done by <a href="http://www.paratype.com/asearch/default.asp?search=safayev" rel="nofollow">Tagir Safayev</a> and by <a href="http://www.paratype.com/asearch/default.asp?search=yefimov" rel="nofollow">Vladimir Yefimov</a> for ParaType is seminal. </p>
      <p>Especially check Yefimov's own Octava, his Cyrillic renditions of ITC Charter (great!), Kis (great!) and Raleigh as well as Safayev's Rodchenko typeface and his Cyrillic versions of ITC Officina Sans (great!) and Serif and of ITC New Baskerville. </p>
      <p>Later check Yefimov's Cyrillic versions of Futura, Futura Futuris, New Standard, ITC Avant Garde, English 157, and Safayev's Cyrillic versions of ITC Kabel, Humanist 521 (Gill Kayo), FF OCR-F, FF Meta. The ParaType version of Humanist 531 (Syntax) is also very good, by Isay Slutsker and Manvel Shmavonyan. </p>
      <p>Some of the new Microsoft ClearType fonts that ship with Office 2007 (Calibri, Candara, Consolas, Corbel) have very decent Cyrillics. I’m not very fond of Constantia and Cambria as designs altogether, but I’d say their Cyrillics are also not worse than their Latins. However, in general, Luc(as) de Groot, Jeremy Tankard, Gary Munch and John Hudson have a fairly firm grip on designing Cyrillics, while Robert Slimbach’s Cyrillics (Minion, Garamond Premier Pro) are more controversial. </p>
      <p>The work of Alexander Tarbeev and his students is also worth looking at. </p>
      <p>A.</p>
