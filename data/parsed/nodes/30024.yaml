      <p>&gt; Uhhh, except making a font in the Latin script<br>
      &gt; Latinized is sort of OK.</p>
      <p>That goes without saying. </p>
      <p>What I'm saying is that all writing systems have undergone "modernismazation" attempts in the 20th century, including the Latin script. For non-Latin scripts, latinization was one of the aspects of "modernismazation". I believe that the drive for modernism is no longer a good idea, which includes dropping the latinization trend for non-Latin scripts, and dropping other modernism-driven trends such as simplification, for all scripts. </p>
      <p>A.</p>
