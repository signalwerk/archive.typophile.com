      <p>Nick, </p>
      <p>both in Renaissance and in modern fonts, Latin and Greek differ noticeably, and there is no "problem". The Greeks had their latinization phase but they're over it now. The Russians don't necessarily have the confidence yet. </p>
      <p>Also, nobody said that the letterforms have to differ *noticeably*. "d" looks like a "p" turned upside down, and the top "B" counter looks like it's the same size as the bottom, but we both know that neither of that is true. Harmonization of forms does not mean making them geometrically identical. </p>
      <p>In fact, the current Cyrillic faces often suffer from the problem that if you set two columns of text, side-by-side, one in Russian and one in English, with the same point size and leading, then either the English is too tight or the Russian is too loose. </p>
      <p>In my opinion, the principle of script harmonization within multilingual typefaces is simple: when set side-by-side in two columns *and* when mixed together within one column, the scripts should *look good*. Now, what "look good" exactly means is up to the type designer to decide. I'm sure you'll agree that it doesn't have to be simple geometric copy-pasteness. </p>
      <p>As for the Cyrillic "ef" in New Standard, it fits. It is a reminiscent of the era, and is probably a way of reaching out to the "greekness" of some Cyrillic forms rather than following a Latin model. In Cyrillic, the double and the reverse letters (ef, zhe, ya, yu etc.) are among the most unorthodox ones. </p>
      <p>I recommend that you order a copy of Yuri Gordon's book (<a href="http://store.artlebedev.com/catalog/books/design/kniga_pro_bykvy/" title="http://store.artlebedev.com/catalog/books/design/kniga_pro_bykvy/">http://store.artlebedev.com/catalog/books/design/kniga_pro_bykvy/</a> ). It shows some nice examples of Cyrillic letterforms in different writing styles, and also their extreme treatment in logos -- which can be helpful in exploring the "acceptable" borders for each character. </p>
      <p>Regards,<br>
      Adam</p>
