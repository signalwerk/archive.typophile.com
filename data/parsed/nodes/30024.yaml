    <p>Dear Typophiles,</p>
    <p>is there anything that could help me understanding <a href="/wiki/cyrillic" class="freelinking" rel="nofollow">cyrillic</a> font design and typography (letterforms, proportions, cultural differences, etc.) as a western-europe-guy capable of reading german, english and some dutch?</p>
    <p>I've found this one:<br>
    <a href="http://store.artlebedev.com/catalog/books/design/kniga_pro_bykvy/" title="http://store.artlebedev.com/catalog/books/design/kniga_pro_bykvy/">http://store.artlebedev.com/catalog/books/design/kniga_pro_bykvy/</a><br>
    and I think I'll buy it if it is available, but I won't understand much, except for the pictures.</p>
    <p>Or do you think I should stop thinking about it, as everything I ever could produce just can be inferior to people who "really understand"?</p>
    <p>Thanks<br>
    Sebastian</p>
