      <p>"I would say that if you go with your imagination, and design an original, new typeface, and make the “ef” work smoothly within that context, you will have a better chance at transcending the weight of history."</p>
      <p>I think this is the best approach to any type design as long as you are not attempting a revival where the historical part is your driving force.<br>
      Regarding history, it has been written, interpreted, revised and reinterpreted many times. If we always base our design logic on this shifting sand, it will always stand the chance of missing the intension. Better to design in the present for the present and allow your new design to be fulfilled in its own terms.  Whatever you do, there will certainly be those who decree, "but it isn't...[siting the historical references which they most agree with]" so why not just let it be its own cosmos. It is probably more efficient to design something and reflect on its plus and minus characteristics than to do nothing because of an endless debate that stops you from ever getting started. There are those who will say it does not follow tradition and there are those who will say it is the same old stuff as we always see. The world has an ample supply of critics. </p>
      <p>ChrisL</p>
