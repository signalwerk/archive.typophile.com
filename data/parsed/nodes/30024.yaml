      <p>Paul, </p>
      <p>I don't think there are any critiques available, online or offline – especially in English. I believe that the Russian type designers who would be able to do such a critique are far too polite and modest to actually publish anything that would criticize fellow type designers (who otherwise do excellent work, like Robert Slimbach). However, if you track Russian typographic publications, you will notice the trend that the work of certain designers is regularly praised and awarded, while others are left unmentioned. Also, typographic conferences such as ATypI are often a good occasion to sit down with some Russian designers and talk with them one-on-one. </p>
      <p>For anyone interested in Cyrillic type design, I recommend the <a href="http://www.tdc.org/events/education/non-latinweek-ends/" rel="nofollow"><strong>TDC Cyrillic Weekend</strong></a> which will be held on March 2-4, 2007 at the Type Directors Club in New York. Maxim Zhukov’s expertise in the field of Cyrillic type design is unquestionable, he was the consultant who helped Hudson, Carter, de Groot, Tankard, Munch and many other Western type designers to get their Cyrillics where they are now. Maxim’s approach on Cyrillic is quite orthodox, with certain rules and schemes. As with anything in typography, these rules are very practical to learn even if at some point, you decide to break them. </p>
      <p>Adam</p>
