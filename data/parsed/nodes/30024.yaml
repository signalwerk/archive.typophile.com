      <p>I think that latinization is the expression of modernism within the realm of writing systems. In the 20th century, type designers were fond of chopping of serifs and simplifying forms, and also unifying the formal language of writing systems -- mostly by imitating the Latin forms. To me, modernism has always been an echo of the 19th-century fascination with the machine. </p>
      <p>My idea for the 21st-century type design is a search for more natural, but also more ad hoc forms -- in all writing systems. Neither directly derived from the writing hand nor overly simplified. The technical limitations of type design are less and less existant, it's possible to draw thousands of glyphs, create glyphs made of components, engineer automatic, contextual substitutions. Typefaces need to find a balance between hand influences, mechanical influences and electronic influences. </p>
      <p>A.</p>
