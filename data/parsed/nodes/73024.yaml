      Which group of words get sung in one breath, that kind of thing.<br>
      There are very precise equivalents in musical notation for that, too, of course.</p>
      <p>@william berkson</p>
      <p>Actually, in my head I *was* excluding Jews when I wrote that. Literacy was always presented to me as a religious requirement - growing out of the story of Joseph in Egypt.<br>
