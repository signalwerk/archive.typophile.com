      <p>&gt;texts were read aloud because the general population was largely illiterate.</p>
      <p>This isn't correct. Among Jews, there was universal education for boys by the second century, so the vast majority of Jewish men were literate. There are a bunch of other reasons for reading aloud, including ritual reasons, the expense of manuscripts, the displacement of Hebrew as a spoken language, etc.</p>
