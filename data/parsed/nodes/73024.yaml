    <p>Slogging through info on hyphenation, I came across this on Wikipedia:</p>
    <p>"<em>The first use of the hyphen—and its origination—is often credited to Johannes Gutenberg of Mainz, Germany circa 1455 with the publication of his 42-line Bible. Examination of an original copy on vellum (Hubay index #35) in the U. S. Library of Congress shows that Gutenberg's movable type was set justified in a uniform style, 42 equal lines per page.</em>"</p>
    <p>Since "often credited" is a bit of a dodge, I turn to the scholars here at Typophile for something more.</p>
    <p>Anybody got a beef with the statement "Gutenberg invented the hyphen"? True, false, we're just not sure... I'm interested in anything.</p>
    <p>Also, were there any precursors - prior to the invention of movable type - that might have made Gutenberg's hyphen more familiar to readers of the time, or did it spring full-blown with Gutenberg?</p>
    <p>Any info greatly appreciated.</p>
