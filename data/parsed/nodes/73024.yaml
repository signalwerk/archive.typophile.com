      <p>The hyphen, in both single stroke and double stroke forms, pre-exists moveable type and, like other aspects of Gutenberg's typography, is found in the manuscript tradition that he was emulating. Gutenberg used the double stroke hyphen, which seems to be most common in the 15th Century.</p>
      <p>Remember also that the hyphen serves two functions: to indicate a word broken at the end of a line, and also to indicate compound words. The Hebrew equivalent, the <em>maqaf</em> was definitely in use by the end of the first millennium AD, as it is a standard feature of the Masoretic codices.</p>
