      <p>Richard,</p>
      <p>&gt; that the end of line hyphen was important as a visual cue to the reader saying,<br>
      &gt; "hey, there's more of the word (or phrase) coming up on the next line."</p>
      <p>What about makaf between two words that are written  in the middle of the line/pagraph? </p>
      <p>If you read the Talmud you'll find guidelines that are very similar to modern day typography, typesetting etc etc. For example, it is mentioned about the spacing, kerning, line length.For example, line length would not exceed three times the word למשפחותיכם (to your families) because with longer lines the reader might lose the lines; even Rashi in his commentary wrote about that issue (line length) !</p>
      <p>Again, things were developed in stages. Though we don't have any document that states these developments there are several cues that show that musical function was developed later on. Early Babylonian MSS have ta'amim  above words that don't bear the accented syllable. That said, their main goal was the division of the verse.  In a later stage the ta'amim appear above the accented words.<br>
      The Tiberian system improved itself by adding more ta'amim, for example meshrtim (servants) which indicates that their functions are  more musical. Probably at the beginning the reading was   emphasizing the intonation,  recitation (diklum) and the distance between intonation and melody/musical was not too far apart. And probably along the way came the maqaf (which has a grammar &amp; musical role).<br>
      Actually the maqaf is not that important. Because if you have a word without ta'am it is basically supposed to be read as if  there is a maqaf.</p>
