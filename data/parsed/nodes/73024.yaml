      <p>John (Quadribloc) evidence is not just religious texts. It is letters from Bar Kochba, who led the rebellion in 135 CE and are written in Mishnaic Hebrew. The Encyclopedia Judaica article "Hebrew" takes this as pretty conclusive evidence of spoken Hebrew being alive at this time, and refuting the early view of Geiger that Mishnaic Hebrew was an artificial construction based on Aramaic and Biblical Hebrew. </p>
      <p>There is also a story in the Talmud of Yehudah haNasi (c. 200 CE), in the Galilee, asking his maid about the meaning of a Hebrew word—indicating that its use was dying out, but some people had still grown up with it, probably in Judea.</p>
      <p>That some people spoke Hebrew in the second century is I think generally accepted. The "hot debate" according to the Wikipedia article is what exactly was the mix of Hebrew, Aramaic, and Greek, and where exactly these were spoken.</p>
