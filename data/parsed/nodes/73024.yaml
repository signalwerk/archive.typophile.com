      <p>Rich, Joshua R. Jacobson, in his standard word <em>Chanting the Hebrew Bible,</em> has this to say about <em>maqaf:</em> ‘A verse that contains too many accented syllables has a “choppy” rhythm. One solution for this problem was to join two or more short words together with <em>makkef,</em> a sign resembling a hyphen. The resulting compound word has only one accented syllable.’ He goes on to give some examples of using <em>maqaf</em> to avoid accents on consecutive syllables and of proclitic and enclitic words.</p>
      <p>So yes, <em>maqaf</em> does have a role in the melodic interpretation of chanted text, but perhaps not in the way you imagined. When we talk about musical notation, most often we have something like that of the evolved western European tradition, a system indicating particular pitch and duration, in Jewish liturgical chant the accent marks — <em>te‘amim,</em> sometimes called cantillation marks — indicate melodic tropes of relative pitch and, to further complicate matters, the actual melodic trope associated with a mark will vary according to the day (e.g. regular shabbat vs high holy day) and also across different traditions. So, for example, following the same text with the same accentuation, an Ashkenazic cantor on a high holy day will be singing different melodies from a Sephardic cantor at a typical shabbat service. I would call the accent marks musical mnemonics rather than musical notation. The cantor has to learn the melodic tropes and how to apply them to text, he doesn't ‘sight read’ the accented text in the way that a musician can follow modern western musical notation, knowing the pitch and duration from the notes on the page.</p>
      <p>The Byzantine and Latin chant traditions also use relative rather than fixed pitch, and historically one can trace notation from something similar to Hebrew accentuation, i.e. marks directly applied to the text indicating melodic tropes, to separate notation on a staff that is the precursor of the modern system.</p>
      <p>The closest parallel to the Jewish model of melodic interpretation of marks in the Christian tradition may be prose chant, as used for instance to sing the prose readings during Mass or Divine Office. In this, punctuation marks are interpreted melodically: typically : and . will each indicate a short melodic cadence to be applied to the preceding syllable(s), and there will be a longer final cadence on the last syllables of the passage, which is otherwise sung <em>recto tono.</em> As with Jewish chant, the priest or lector has to know the melody of the cadences and how to apply them to the text, rather than following a musical notation.</p>
