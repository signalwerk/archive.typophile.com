      <p>This thread inspired me to do some Google searching which ended up piquing my curiosity about the older Babylonian vocalization and Palestinian vocalization used for Hebrew instead of the current Tiberian vocalization.</p>
      <p>I found that one program which extended TEX to handle Hebrew allowed the use of alternate vocalizations: Makor.</p>
      <p>But sadly, it was built to use Omega, which ended up being abandoned. There is current software for Hebrew typesetting, but apparently nothing currently available is fully the equal of Makor. Since Mem is based on Lambda, and Lambda is a successor to Omega, I suppose a port might be remotely possible...</p>
