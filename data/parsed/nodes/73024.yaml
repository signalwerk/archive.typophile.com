      <p>Given the evidence of the New Testament, and, for that matter, the use of Aramaic (often called "Chaldaean" in that context) even in parts of the Old Testament, I'd be inclined to suspect that the evidence of the Dead Sea Scrolls is enough to support a conclusion that Hebrew continued to exist as a <strong>literary</strong> language for a significant period of time - after all, knowledge of the Hebrew language was treated as a universal religious obligation by the Jews, the <em>bar mitzvah</em> continuing to the present, and having existed long before the revival of Hebrew by Ben-Yehuda - but not enough to conclude that it was a spoken language used in daily life right up until 200 A.D..</p>
      <p>But I'll have to admit that we don't really know, and the Wikipedia article does note that the issue is still very controversial among scholars - it hasn't really reached a settled consensus.</p>
