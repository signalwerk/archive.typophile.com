      <p>&gt; So, can it be not a typographic but a musical cue?</p>
      <p>musical...? definitely not at the beginning. The Tiberian system was  developed in several phases; first — the accents above the words  ("copied" the Babylonian tradition); second — the accents under the letters; third — the vowels.<br>
      We don't know all the rules of the maqaf. The most common rule: word preceding the maqaf changes in two ways: the vowel changes as well as its  accent/ta'am.</p>
