      <p>Concerning the use of Hebrew as a spoken language, here is a citation from Yosef Ofer, <em>The History and Authority of the Alleppo Codex</em> (<a href="http://www.jerusalem-crown.co.il/website/files/images/4-eng25.pdf" rel="nofollow"><strong>pdf 182K</strong></a>):</p>
      <p>Yet another source provides surprising information about the use of Hebrew by the people of Tiberias. In the tenth century a Hebrew grammarian of the city wrote a work that has been preserved in part in the Cairo Genizah. He relates that he studied the accent of the people of Tiberias, especially their way of pronouncing the letter resh when reading the Bible and when speaking Hebrew. To that end he would spend long hours in the city streets and squares, listening to the speech of ordinary people, in Hebrew and in Aramaic (Allony 1970, 98-101). This description, which is written in Arabic, indicates that in the tenth century Hebrew was actually spoken in Tiberias and was not only a literary and liturgical language.</p>
      <p>The reference for Alloni is Leshonenu, 1970, 75-105, 187-209. I can't copy paste from the pdf (and with hard to find latin diacritics I won't type it), so here it is in Hebrew (copy pasted):<br>
       אלוני, נחמיה 	  עלי בן יהודה הנזיר וחיבורו "יסודות הלשון העברית" 	  לשוננו לד (תשל) 75-105, 187-209 	1970</p>
