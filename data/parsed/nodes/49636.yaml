      <p>"Barreled Berries" and "Local Strawberries" looks like ATF's Extra Condensed Title Gothic No. 12 to me. Do you mean Red Rooster's Block Gothic? That's got a similar turn-of-the-century headletter gothic feeling. But use all-caps only.</p>
      <p>"Christmas 1925" is Cooper from Barnhart Brothers &amp; Spindler. The "mushroomed" serifs are a dead giveaway.</p>
      <p>The smaller dark headline looks familiar, but I can't place it offhand. I thought it was ATF Miehle Extra Condensed, but not quite.</p>
      <p>"Published Every Wednesday" looks like a Cheltenham. </p>
      <p>Hard to say what the text or the subheads are from these lo-res samples. Maybe someone else will want to take a stab at it.</p>
      <p>The line in "L" seems to be part of the style. Blackletter is not my area of expertise, so I can't tell you why that element is part of the style.</p>
