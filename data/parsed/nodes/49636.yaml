      <p>Can you get images of any of these papers for us to see? Prior to Linotype, they would have probably used some basic body type from one of the smaller foundries that eventually became part of ATF. I don't recall which individual foundries had offices out west. By the 1920s, at least, ATF had a branch sales office in Portland.</p>
      <p>For text, probably something in a Modern or Century vein. For headlines, there are a number of typical faces. Most of these would have gone by pretty mundane descriptive names at the time -- things like Headletter Condensed, Adstyle Headletter, Modern Roman Condensed.</p>
      <p>There are a number of faces in the Font Bureau library that are derived from some of these turn-of-the-century headletters. If you want specific recommendations to replicate the Lebanon papers, we'll need some visuals to go off of. Can you print out from microfiche and then scan something in to post?</p>
      <p>-- Kent.</p>
