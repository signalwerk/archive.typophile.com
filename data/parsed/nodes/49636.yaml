    <p>What were newspaper typefaces 1890’s to 1920’s used in pre-Linotype, small town papers in western Oregon for headlines, text copy, mastheads &amp; advertising?</p>
    <p>Informal project...<br>
    ---------<br>
    Strawberry Labels—Actual or artwork ... see artwork image<br>
    ---------<br>
    Find or design a strawberry crate, barrel or can label to represent 1909 era processors &amp; growers serving Lebanon, Oregon—“Strawberry City” into 1930’s.<br>
    ----------<br>
    Newspaper Articles—Replicate via desktop publishing on a Mac<br>
    ----------<br>
    Create hardcopies of 1890’s-1930’s small town—Lebanon, Oregon—weekly newspaper articles on local strawberry industry using desktop publishing:<br>
    --Lebanon Express (mainly Democratic Party), 1887 to present;<br>
    --Lebanon Express-Advance (Populist paper), 1890’s until combined with Lebanon Express in 1924;<br>
    --Lebanon Criterion (Republican paper), 1898 to 1920’s, known as Linn County Advocate (Jan 1912-Nov 1912)<br>
    --Lebanon Tribune, 1912 to unknown (possibly late 1910’s)<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Lebanon-Canning-Co-200_4883.gif"></div><p></p>
