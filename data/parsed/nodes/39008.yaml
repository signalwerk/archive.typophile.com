      <p>I’m not sure what exactly you’re asking. It’s typical for an identity to be based on Pantone spot colors, and then specify the CMYK mixture to use when spots aren’t available, and then also to specify a completely black and white solution where no color whatsoever is available. I’ve never seen a good corporate identity that tried to be identical in every application, but the good ones are always *consistent*.</p>
