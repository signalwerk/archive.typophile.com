    <p>Hello,</p>
    <p>I’m giving the last touch to a brand identity I’m working on; The logo is set in two colors : a green and a dark grey.</p>
    <p>I’ve recently had some issues printing grey texts in CMYK, so I know it’s not really a good idea, but I really like the look of the grey.</p>
    <p>I don’t like to oblige the client to always use extra spot colors, so I don’t have a hundred solutions :</p>
    <p>#1  forget about the grey, change it for a black.</p>
    <p>#2 make a non-constant identity</p>
    <p>I mean :<br>
    If the job is printed in CMYK, the brand colors are green and black.<br>
    If the job is printed in Spot colors (business cards, letterhead, stickers, trucks, whatever) let’s use the grey !  </p>
    <p>Obviously, my choice goes to #2</p>
    <p>what do you think ?</p>
