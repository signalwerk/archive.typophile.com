    html: |-
      <p>This is the approach I use to make smallcaps in FontLab.</p>
      <p>1. Scale uniformly to the desired height and put into the background mask layer. These will be the guide not only for height, but also for internal space. So, for example, the distance between the uprights of the scaled H will be the distance, edge to edge, of the uprights in the smallcap. This will produce smallcaps that are nicely proportioned relative to each other (presuming that your caps are nicely proportioned).</p>
      <p>2. Paste in another copy of the cap outlines, and scale these uniformly for weight. I usually match the vertical stem weight of my smallcaps to my lowercase, even though the smallcaps will be taller.</p>
      <p>3. Use the FontLab 'Interpolate' function to reduce the height and width of the weight-adjusted caps to match the height and internal space of the mask. This should be done in two passes: one for the y-direction and one for the x-direction. Be careful to maintain weights.</p>
      <p>4. Test and fiddle.</p>
