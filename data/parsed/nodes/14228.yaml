      <p>&gt;annoyance</p>
      <p>I was refering to the flashing icon.</p>
      <p>As for the question: sans is easier, because you don't have to manually extend the serifs.<br>
      So really, just scale down to slightly talle rthan x-height, expand the weight a bit to match overall lower case weight, and perhaps widen a few characters.</p>
      <p>Expanding weight mechanically will mean that your SC have less contrast than your caps, but how this plays out is, as Chris says, up to your eyes to determine. </p>
      <p>How does one assess small caps? -- be sure to try them out in a variety of settings: Caps with small caps title, as an all SC subhead centred above a U&amp;lc text block, as an insert into a LC text block, as title abbreviations in a bus. card, as a side-heading, following a drop cap, etc.</p>
