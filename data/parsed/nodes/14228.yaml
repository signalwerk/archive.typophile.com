      <p>Leslie Cabarga's  book "Learning FontLab Fast" <a href="http://www.logofontandlettering.com/" title="http://www.logofontandlettering.com/">http://www.logofontandlettering.com/</a>  has a section on this. I found it to be a starting point and ended up doing a great deal of visual correction.  For my font, I reduced the caps to 96% to get the stroke weight but this will vary with your font. There is no simple quick way to do it right.  The stroke to counter ratio is different so it must be optically corrected.  Even the slant angles on M and W need work.  As is usual for me in all parts of type design, it is all in the eyes.</p>
      <p>ChrisL</p>
