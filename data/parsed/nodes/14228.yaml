      <p>I agree that making italics is a totally different animal than making smallcaps, but John's stance assumes the -mainstream- belief that italics must be qualitatively more cursive than the roman. At the very least, this depends on the design at hand; but I would go further and state that a proper italics is generally quite close to a roman (except -primarily- in slant). The relationship between the roman and italics in Patria is I think much healthier than what the mainstream stance would produce; both the roman and italic were quasi-mechanically derived from a slanted-roman master (Harrier).</p>
      <p>So basically: if one decides to make the roman and italics "genetically" close, there are indeed methods, good and bad, just like in the making of smallcaps. It's not always "from scratch". But a separate thread, please! Wait, didn't Terry already start one like that? Yeah, the "true italics" thing. Where did that end up going?</p>
      <p>hhp</p>
