      <p>"You have to make italics from scratch"</p>
      <p>I wish I had the benefit of John's experience. I found that out the hard way and I totally agree.  I don't think it is a much an issue of more calligraphic or cursive but what is clearly different enough to be differentiated easily by the reader from roman. After all, italics function within other text is to make itself separate out enough to clue the reader yet not blast out by being so different as to be jarring.<br>
      As for construction--I find all of the techniques for quicker transformation from slanted roman to italic I've seen to be of very limited value (read-not a time-saver).  Maybe other people have found otherwise but I can just draw it quicker straight away.  I just use the roman in the mask layer as a guide for general stroke and counter weight.  The curves just don't translate for me in a way that makes it worthwhile.</p>
      <p>ChrisL</p>
