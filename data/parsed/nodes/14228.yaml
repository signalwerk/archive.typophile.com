      <p><em>The italic caps should have a fairly close visual relation with the roman caps...</em></p>
      <p>I think that is one legitimate approach, but I think it has become too much the default treatment. The reason for this, of course, is that when the first italic types were cut they had roman capitals, and the development of italic capitals happened a bit later and the forms were typically sloped versions of the roman caps. That delay had a lasting impact, I think, because although many chancery scribes would also use roman capitals with their cursive hands, there are examples of more cursive capitals that predate the slanted capitals in italic types. But these examples had no influence on the latter because by the time people came to make slanted capitals in type they seem to have referenced their own roman types rather than chirographic models.</p>
