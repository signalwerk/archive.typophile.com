    <p>What would you say is the best way to make small caps in FontLab? I'm busy with my <a href="http://www.characters.nl" rel="nofollow">Insider</a> and <a href="http://www.characters.nl" rel="nofollow">Nordic Narrow</a> and I wish to make small caps for them.<br>
    Nordic Narrow will be available soon on Fountain. After the first wave of fonts I want to expand the family with small caps and perhaps alternate versions, swash or something like that. </p>
    <p>Would you scale the UC's and them make them heavier in weight? And if yes, doesn't it them become out of proportion in relation to the lc's? </p>
    <p>Does anyone have a practical tip?</p>
    <p>Thanx,<br>
    ®</p>
