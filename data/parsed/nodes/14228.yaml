      <p>For what it's worth, I took a pretty close look at the way Benton did the small caps on ATF Bodoni. For the most part, the small caps are automatically derived from the regular caps, with changes consistent with the Benton optical scaling technology. They used anamorphic scaling to widen the letters slightly with respect to the overall scaling, and used stroke offset to add more weight. Perhaps most importantly, in traditional work anyway, small caps are much more loosely set than either standard lowercase or caps.</p>
      <p>Even so, a few of the glyphs appear to have been completely redrawn (as you will see from studying this <a href="http://levien.com/type/atf_1912/p0075_sm.jpg" rel="nofollow">200 dpi scan</a> of the Bodoni Book 18. Most obviously, the "W" is simplified a bit, so that it is almost halfway between the lowercase 'w' (no middle serif) and the overlapping VV design of the uppercase. I don't remember exactly which glyphs were tweaked, but the serifs on the "H" look a little longer than on the caps, and I think a couple of letters had their widths adjusted.</p>
      <p>Best of luck. Small caps are important for typographic sophistication. Oh, and a query like this doesn't come near pinging my annoyance meter; in general, I'd say spamming involved repetitiveness, and posting without additional content. Congrats on getting distribution!</p>
    html_clean: |-
