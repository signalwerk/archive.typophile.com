      <p><em>The italic caps should have a fairly close visual relation with the roman caps...</em></p>
      <p>I think that is one legitimate approach, but I think it has become too much the default treatment. The reason for this, of course, is that when the first italic types were cut they had roman capitals, and the development of italic capitals happened a bit later and the forms were typically sloped versions of the roman caps. That delay had a lasting impact, I think, because although many chancery scribes would also use roman capitals with their cursive hands, there are examples of more cursive capitals that predate the slanted capitals in italic types. But these examples had no influence on the latter because by the time people came to make slanted capitals in type they seem to have referenced their own roman types rather than chirographic models.</p>
      <p>I think one way to approach italic capital design is to consider that what really distinguishes italic lowercase from roman is <em>speed</em>.</p>
      <p>Roman lowercase letters represent the (re)formalisation of the miniscule: the introduction into the lowercase alphabet of the formal qualities of the classical capitals, as rediscovered in the renaissance. The irony, of course, is that the miniscules had developed, via the uncial, away from that formalism, over hundreds of years, only to meet up with it again right at the time when type met up with the renaissance in Italy. The various local descendents of post-carolingian miniscule letters became more upright, stiffer, and <em>slower to write.</em></p>
      <p>When we apply the term 'cursive' to italic letters, we should reckon what this means in terms of speed. There is a tendency -- perhaps because all type goes at the same speed -- to consider the slant of italics and the 'cursive form' of the letters as somehow two separate components of what makes an italic. But the slant and the form of the chancery writing hand on which italic type is based are <em>both</em> the result of the cursivity, or speed, of the writing. The characteristics of fast writing are compression, slant, lack of reverse strokes (entry and exit strokes only, no double serifs), rapid transition from stem to bowl (deep cuts, again with little reversal)... in other words, all the hallmarks of traditional italic lowercase letters.</p>
      <p>When I'm designing italic capitals, I sometimes ask myself 'How can I add some speed to these?', even if I'm basically following the usual relationship of italic to roman caps.</p>
