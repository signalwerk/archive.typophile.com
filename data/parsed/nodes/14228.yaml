      <p><em>do you think that the need to start from stratch even applies to italic Caps?</em></p>
      <p>The italic caps that can be easily made via slanting roman caps, e.g. those without bowls, can also be easily made in a number of other ways, e.g. from primitives. I think the relatively straight forward relationship between italic caps and roman caps -- compared to the <em>range of relationships possible</em> between the respective lowercases -- can be misleading for designers. Yes, there are methods to quickly arrive at italic caps from roman caps, and there are tricks for adjusting the weight on the bowls. But speaking as someone who has made use of such methods and tricks numerous times, I'm suspicious of them. I think they lead to a kind of dull repetetiveness that tends to make italic caps the least interesting part of any type family. Recently, I've been designing a display face that has a slight slant and some cursive features, and because there is no original roman to start from I was forced to think about the caps in terms of the design as a whole, and not as something derivative. If one has the luxury of time, I think it is worthwhile to approach italic caps in a similar fashion, independent of the roman.</p>
    html_clean: |-
