    <p>Hi guys</p>
    <p>I'm redesigning a corporate branding/template and I am trying to find some evidence to back up my insistence on a ban of the use of cheesy fades/gradients/bevel and emboss combinations/80/90s style photoshopping effects on the images being used.</p>
    <p>Does anyone have any links or images of tacky graphics??<br>
    Annual reports / brochures / anything of the above to help me illustrate my point?</p>
    <p>Thanks<br>
    Emily</p>
