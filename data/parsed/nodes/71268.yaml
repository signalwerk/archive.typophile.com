  html: |-
    <p>After discovering the fantastic world of Art Deco typefaces, I am in the process of creating a typeface that had two aspects of Art Deco that I really like; the flowing sometimes geometric curves of the more single-weight typefaces, and the dynamic cut-out grooves of the contrasting-weight typefaces. </p>
    <p><img src="/sites/default/files/old-images/Untitled-1_5857.png"></p>
