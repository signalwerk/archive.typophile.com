    html: |-
      <p>Thanks for those kind words Stewf!</p>
      <p>I was told that he was just very busy with a project - no doubt one we will all be excited to see. I have a request in to try to see him since he may not be at Atypi either. fingers crossed! </p>
      <p>I will post the talk &amp; it's images at some point after I have settled in at Reading. The main reason being - I have much more stuff that would just assume go in that 20 min at Typecon would not permit. The Atypi slot is 50 min so more things will fit. </p>
      <p>Also I was just at the Boston Rare Books room and found a copy of the Iambluchus ( Aldine/Griffo ) that was printed very well. I think some of those images might make it into the talk as well. I have one more week in Boston coming up and with luck I may find other interesting stuff. And who knows, maybe more folk will send me more cool things to see. I know I would like to put Paul Hunt's font in.</p>
