    <p>I'm wondering about using a name for a font that's already taken.<br>
    Twice! Once by Image Club, and then by Solotype. Just the fact that<br>
    there are in fact two of them already is encouraging (I mean legally)<br>
    and I know that even H&amp;FJ have used names that were already out<br>
    there, but I'm wondering: what are the probable legal ramifications?<br>
    Practically speaking, is it only Berthold that one must avoid tangling<br>
    with like the plague?</p>
    <p>And I'd like to bundle another question in here: What are your thoughts<br>
    concerning serif/sans font systems where each has a different name?</p>
    <p>hhp</p>
