      <p>I am not a lawyer! My answers may not be acurate. Above and below is just what I think is correct…</p>
      <p>&gt;I thought they could mostly get me to stop using it, not<br>
      &gt;sue me for the money I’ve made from it up to that point! :-(</p>
      <p>Like every lawsuit, that would be up to a judge (and jury?) to decide. But they could try, and if they try, it might cost you. The trademark holder probably won't care about your font, just that you are generating income with their property.</p>
      <p>&gt;That’s no good. So I assume people like Solotype and H&amp;FJ<br>
      &gt;had checked the trademarks. How do I do that myself?</p>
      <p>How do you know that? I don't know that. The best thing to do is ask. If you want to register a trademark, you should have a lawyer do research for you to see if the name is in fact trademark-able.</p>
      <p>&gt;More questions:<br>
      &gt;1) If the previous one does not have a trademark, isn’t<br>
      &gt;there something equivalent to “previous art” in copyright<br>
      &gt;whereby it’s no longer possible to obtain a trademark on it?</p>
      <p>Don't know. If no one has a trademark on the name, you can apply for one. If the others don't want you to have it, it is up to them to file an objection with the authorities during a certain application period.</p>
      <p>In terms of copyright and design patents, those are not names, and are not things that fall under trademarks, which is waht I thought you were asking about. Protection for design copyrights and or patents differs depending on where you are. If I were you, I would ask the other other designers, rather than ask for legal advice. Solotype and H&amp;FJ are just a phone call away, right?</p>
      <p>&gt;2) When do trademarks expire?</p>
      <p>Never? ;-)<br>
      Copyright is good for life of the author (or company), plus 70 years. At least in the US, I believe. Whether TMs another matter are?</p>
      <p>&gt;3) If I do trademark it, what can I do about the pre-existing one?</p>
      <p>See what I wrote above. Your trademark application can be contested for a certain period of time.</p>
