    html: |-
      <p>It seems that a font name if registered can be a trade mark or a service mark. The U.S. Congress considers the alphabet is in the same category as the wheel. The practice of assigning diffetent names to the same font was thoroughly explained by Hermann Zapf when he said that he was giving up after what happened to Palatino and its more than 23 names.<br>
      European laws are much better for the type designer and American font lawsuits are few and far between except Monotype vs. Linotype for Times Roman; ATF versus Lanston Monotype ended up with small royalties assessed.  Software is protected under U.S. law.</p>
