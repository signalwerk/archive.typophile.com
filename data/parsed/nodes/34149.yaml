      <p>I know a few of these, not a lawyer, yada yada, but I've been researching this a long time...</p>
      <p>First, DA has the most correct answer.</p>
      <p>Trademarks don't expire. But they only last as long as someone is using them, and trying to protect them. They may become genericized, and then anyone can use them, like "aspirin" in the U.S.</p>
      <p>The basic concept of a trademark isn't at all like a copyright. A copy write says you made (or acquired) something creative and have the final say on reproduction. A trademark claims only that you have a product with a label and it is so intrinsically entwined with the product's value that others using that name might benefit from your reputation, via that label.</p>
      <p>Keep in mind neither you, Solo or Image have to have registered the Trademark to get benefits from it, that just makes things easier in litigation.</p>
      <p>If two parties are using a name to sell two different (unrelated) fonts <em>at the same time</em>, either one would have a poor claim that the name is linked in the markets mind to only their face. Especially if neither is stopping the other. (Unless they are pursuing different markets.) However, the same applies to you, as well, if there are already others using that name, unregistered, good luck getting a judge to give you real trademark power, even if the local PTO had taken your money and given you a certificate. Keep in mind, to maintain that Trademark, you will have to be  a hawk on the butt of anyone using it, as well.</p>
      <p>Others, feel free to correct this.<br>
      ----</p>
      <p>On the other half of the question, If you want a sans and serif with different names are they at least phonetically or thematically related? I have two projects in the cooker using that idea, a sans/serif pair and a text/display pair.</p>
      <p>I also feel that if they are a "close pairing" they should have more similar names. If they share little more than metrics, then a weak link seems right.</p>
      <p>Weren't Myriad/Minion were designed to compliment each other? Similar but subtle.</p>
