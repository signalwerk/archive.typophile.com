      <p>As you don't happen to be in a city that is overrun with professional type designers, I would find the person to teach the course, and get them to design it with your input.</p>
      <p>Different type designers have different strengths, and different ideas about priorities and even process. You'll probably get a better course by getting them to structure it.</p>
