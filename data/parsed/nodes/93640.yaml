    html: |-
      <p>It looks like someone drew over letters from an old chain-train printer, in which case the typeface is probably proprietary to the machine.</p>
      <p>If you want solid—rather than dotted—letters that look as ratty as your original, you could set your copy in Photoshop, rasterize it, apply a Gaussian blur, then adjust the levels to pure black and white.</p>
