    <p>Hi everyone!</p>
    <p>I would love to receive some constructive feedback/suggestions on my personal logo. I'm using Futura at the moment for the 'Jessica Chapman' text, but I would prefer to use a less common typeface. The main reason I chose to use Futura was because I felt the simplistic shape of the Futura 'J' complemented my custom-made J. :)</p>
