      <p>Not user friendly?<br>
      I use GLyphs and find it much more easy to use and enjoyable than FL.<br>
      FL costs 2 times GL, is a conceptually old software, obliging you to do many stupid tasks by hand (stupid means the machine can do them as well). Glyph does it for you.<br>
      Of course some features are still more developed in FL. We'll see for FL6, but if they don't change quickly they'll end like Quark Xpress ;)</p>
