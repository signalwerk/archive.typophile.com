    <p>I just saw an article about a new (I think) font editing application called "Glyphs". Don't know a lot about it, but it apparently is Mac-only and is aimed primarily at graphic designers. The website is <a href="http://glyphsapp.com" title="http://glyphsapp.com">http://glyphsapp.com</a> and it's also in Apple's App Store.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/glyph2_5139.jpg"></div><p></p>
