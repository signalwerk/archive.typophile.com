      <p>You might try UKIJ fonts, a wide variety there. Also, SIL puts out Lateef and Scheherazade, both nice looking. Finally, there are the Paktype fonts. Any of these may suit you. Check the license first.<br>
      Personally, I'd go for a nice Nastaliq, or Sulus face for any names.</p>
      <p>Why aren't you using whatever service others use in-country? There likely is some "standard" font, layout, etc., and it might be better to fit in rather than splash in.</p>
