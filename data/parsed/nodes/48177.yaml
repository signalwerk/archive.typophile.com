    html: |-
      <p>It is true that Kufi doesn't look like a traditional Arabic typeface due to its geometric nature. However Dubai doesn't have the appearance of a typical middle eastern country. I have recently seen a lot of Arabic geometric typefaces in use, most memorable was during the recent Bahrain f1 gran prix and this years TDC winning text family Al Rajhi. I personally really like them. I can understand why many Arab nations believe they are an insult to their cultural traditions.</p>
      <p>I am guessing Arabic geometric inspired typefaces haven't been around for a long period of time. It is only a matter of time before they become more accepted in certain countries like Dubia and Bahrain. The west had similiar acceptance issues with grotesques and early geometrics during the early twentieth century because of the radical change.</p>
      <p>I would give it a test setting to see if it works. If it does still feel to "techno". I would use Nadeem or Geeza since they appear slightly minimal but still have an element of Arabic calligraphy to them,</p>
