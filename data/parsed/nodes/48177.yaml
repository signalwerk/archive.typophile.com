      <p>The DecoType Naskh we made is the Arabic equivalent of, say, the Times New Roman so it's always a safe choice, though in our eyes technically obsolete and too simplistic. We also licensed a Thuluth to Apple based on the same simplified Apple template, so you should be able to use that a s well.</p>
