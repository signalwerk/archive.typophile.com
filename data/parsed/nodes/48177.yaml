    date_raw: 7 Aug 2008 — 7:21am
    votes: null
    html: <p>I was looking at that, but I wasn't sure if it was really forced. That is to say, I've heard people talk about trying to make Arabic type (or any other language system) "helvetica-ized", and completely losing the forms in the process. It looked to me like it would be the equivalent of a "techno" font, with really forced curves and lack of contrasts. I think that first, I want to make sure that the letters look good, then matching avenir comes next...</p>
