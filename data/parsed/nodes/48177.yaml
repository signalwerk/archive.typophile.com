  html: |-
    <p>Hello,</p>
    <p>So I work in-hose for an architecture firm, and we have some of our people doing business in Abu Dhabi. We need to print up business cards with english and arabic translations on them. Although I consider myself very discerning of roman characters in typography, i have no clue what I’m doing in arabic.</p>
    <p>My company won’t spring for any new fonts, as this is pretty much a one-off thing, but my computer has six arabic fonts (i believe they are Mac Standard, yet I can’t seem to find samples on the web...). I would like to avoid the middle-eastern equivalent of comic sans, and (as closely as possible) match the Avenir that already appears on the card. We have an architect in-house who can translate.</p>
    <p>My choices are:<br>
    Al Bayan<br>
    Bagdhad<br>
    Deco Type Naskh<br>
    Geeza Pro<br>
    Kufi Standard GK<br>
    Nadeem</p>
    <p>I would appreciate any help that I could get...</p>
    <p>A</p>
