    html: <p>Custom, but not particulary well done, The designer must have started with an existing font, (over)slanted it and added flourishes.  <br>Look at the way the flourish on the D is attached -- it looks like a cut up O, clumsily glued on. The A is really bad; far too heavy in relation to the rest.  <br>Thus must have been a well paid job and it makes one wonder about the ethical side of doing these kind of jobs...</p>
