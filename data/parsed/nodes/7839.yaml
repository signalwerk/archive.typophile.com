    votes: null
    html: <p>The imperfection of this logo may well have been intentional if they were trying to make it look "old fashioned." The general style has many similarities to the late-nineteenth-century "antique" style. Some examples are Bookman, Century Old Style, Bruce Old Style, Tiffany, etc.</p>
