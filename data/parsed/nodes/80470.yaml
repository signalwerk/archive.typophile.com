    html: |-
      <p>This lovely book is about type from that era which was obviously influenced by hand-lettering.</p>
      <p><a class="freelinking external" href="http://www.artisticprintingbook.com/" rel="nofollow">The Handy Book of Artistic Printing</a></p>
      <p>Also, similar to both Nicks' suggestions, check the local history sections in public libraries and bookstores. Most books of 19th Century photographs will have city scenes with signage.</p>
      <p><a class="freelinking external" href="http://www.handletteringforum.com/" rel="nofollow">The Hand Lettering Forum</a> might be a good source of people restoring these signs or still using the techniques.</p>
