    <p></p><div class="imageWrap"><img src="http://typophile.com/files/nitti3_580_typophile1_4352.png"></div><p></p>
    <p>We are happy to announce that <a class="freelinking external" href="http://www.boldmonday.com/en/nitti/" rel="nofollow">Nitti</a> has been updated to version 3.0. The major change in this new version is the addition of monotonic Greek.<br>
    Also some optimisations, such as a redrawn ampersand and a more distinctive zero, have been included after feedback from users of <a class="freelinking external" href="http://iawriter.com" rel="nofollow">iA Writer</a>, the popular new text editor on iPad and OS X.</p>
    <p><a class="freelinking external" href="http://www.boldmonday.com/en/nitti/" rel="nofollow">Nitti</a> is a monospaced typeface family in five weights that has its roots in the first sans-serif designs of the 19th century – the Grotesques. Originally a British invention, the Grotesques gained massive popularity in mainland Europe and also became widespread in early 20th century USA where it was commonly referred to as ‘Gothic’. The quirky and often idiosyncratic shapes of these designs lend them a humanity and warmth which is still widely appreciated.</p>
    <p><a class="freelinking external" href="http://www.boldmonday.com/en/nitti/" rel="nofollow">Nitti</a> comes in two versions. Nitti Basic offers 264 characters per font and only supports western European languages.</p>
    <p>The full version of <a class="freelinking external" href="http://www.boldmonday.com/en/nitti/" rel="nofollow">Nitti</a> on the other hand offers a generous 611 characters per font including many more accented letters, Greek and Cyrillic. This version covers all European languages together with most Asian languages that use the Cyrillic script.</p>
    <p>To celebrate this launch we’re offering more bundles and a <a class="freelinking external" href="http://www.boldmonday.com/en/nitti_buy" rel="nofollow">special price of 129 Euros</a> for the complete Nitti Basic family bundle.</p>
    <p>Best wishes from Den Haag!</p>
    <p><a class="freelinking external" href="http://www.boldmonday.com" rel="nofollow">Bold Monday</a></p>
