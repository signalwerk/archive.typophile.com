    date_raw: 4 Sep 2001 — 10:36am
    votes: null
    html: "<p> Heh heh.... Actually, you are correct, to a point. I do in fact like many of Emigre's faces, especially those of Licko and Downer, Triplex and Base included. <br> <br>The italics and alternates (many of the alternates are upright versions of the italics, you may have noticed -- kind of a backwards evolution, I guess) indeed took inspiration from Base and Triplex, but also Bauhaus forms (lc \"m\", \"n\", \"r\", \"u\", \"w\" \"x\" and \"y\", among others) as well as some woodcut serif forms (most of the numerals and all characters with a tilde-shaped horizontal stroke). <br> <br>The tight terminal curls (lc \"a\", ital lc \"a\", \"m\", \"n\", et al) were inspired by Jonathan Hoefler's Leviathan Italic -- an italic design which I absolutely love. <br> <br>And the caps... Well, the caps were origianlly going to be mostly sloped romans, but I wasn't happy with that. I wanted as true an italic as I could get, so I wanted that to include the upper case as well. Base and Goudy Sans gave me most of the ideas for those forms, as well as other serified italic forms. <br> <br>Stephen: I'm not sure I understand your criticism of the \"spear\" terminals (lc 'f',  <br>'j', 'r', 't', 'z'). Do you mean in the roman, the italic, the alternates or all three? And what about them doesn't fit? <br> <br>I've had some degree of success using Atlantis at text sizes, especially the italic and alternate sets. I'll try to post a waterfall text setting soon to show you how they work, but until I can get Flash to work properly, I'm still a slave to JPEG images on 72-dpi screens. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":)\"> <br> <br>Thanks once again for all your comments. This forum is an invaluable resource! </p>"
    html_clean: "<p> Heh heh.... Actually, you are correct, to a point. I do in fact like many of Emigre's faces, especially those of Licko and Downer, Triplex and Base included. <br> <br>The italics and alternates (many of the alternates are upright versions of the italics, you may have noticed -- kind of a backwards evolution, I guess) indeed took inspiration from Base and Triplex, but also Bauhaus forms (lc \"m\", \"n\", \"r\", \"u\", \"w\" \"x\" and \"y\", among others) as well as some woodcut serif forms (most of the numerals and all characters with a tilde-shaped horizontal stroke). <br> <br>The tight terminal curls (lc \"a\", ital lc \"a\", \"m\", \"n\", et al) were inspired by Jonathan Hoefler's Leviathan Italic -- an italic design which I absolutely love. <br> <br>And the caps... Well, the caps were origianlly going to be mostly sloped romans, but I wasn't happy with that. I wanted as true an italic as I could get, so I wanted that to include the upper case as well. Base and Goudy Sans gave me most of the ideas for those forms, as well as other serified italic forms. <br> <br>Stephen: I'm not sure I understand your criticism of the \"spear\" terminals (lc 'f',  <br>'j', 'r', 't', 'z'). Do you mean in the roman, the italic, the alternates or all three? And what about them doesn't fit? <br> <br>I've had some degree of success using Atlantis at text sizes, especially the italic and alternate sets. I'll try to post a waterfall text setting soon to show you how they work, but until I can get Flash to work properly, I'm still a slave to JPEG images on 72-dpi screens. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":)\"> <br> <br>Thanks once again for all your comments. This forum is an invaluable resource! </p>"
