  html: <p>This was my first attempt at a sans serif, with accompanying true italic. <br> <br>The idea behind it was to make a humanist sans with some of the organic curves and other elements of old woodcut serif letterforms. As such, much of the italic was actually developed before the roman. Also, many of the characters suggested alternate possibilities, so I've developed an alternate set as well. <br> <br>David Thometz <br> <br><img src="http://www.typophile.com/forums/messages/29/326.jpg" alt="atlantis.jpg"> <br><img src="http://www.typophile.com/forums/messages/29/327.jpg" alt="atlantisitalic.jpg"> <br><img src="http://www.typophile.com/forums/messages/29/328.jpg" alt="atlantisalternate.jpg"></p>
