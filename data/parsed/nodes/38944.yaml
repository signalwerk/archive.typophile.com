  html: |-
    <p>I’m working on a logo that needs to suggest perfection, so perfect that it has become sterile and lifeless, clinical. I’m looking into type for information, but I was wondering what is the perfect functional typeface?</p>
    <p>I think geometric is winning it for me at the moment, the scalpel sharp points on the capital M, N, V, and W suggest laser cut perfection.</p>
