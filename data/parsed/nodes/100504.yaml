    html: |-
      <p>I don't think it's a typeface, more a custom lettering. I don't know any font having /F and /1 that could fit together so perfectly.<br>
      And if you have a <a class="freelinking external" href="http://www.myfonts.com/WhatTheFont/forum/case/168347/" rel="nofollow">closer look</a>, that looks not even well drawn to me. But, if you still need something to start with, you could take any generic sans of your choice, from Futura, Avant-Garde or even Gill Sans, slanting it on purpose. A quick way would be using <a class="freelinking external" href="http://www.myfonts.com/fonts/ef/diamanti-diagonal/" rel="nofollow">Diamanti Diagonal</a>.</p>
