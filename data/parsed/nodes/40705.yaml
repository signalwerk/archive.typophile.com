    <p>At the thread "Type Designer's Work Ethic"</p>
    <p>see <a href="http://www.typophile.com/node/32244" title="http://www.typophile.com/node/32244">http://www.typophile.com/node/32244</a></p>
    <p>Rebecca Alaccari and Patrick Griffin of the Canadatype outfit claim:</p>
    <p><cite>"Both Patrick and I put in an average of 10 to 12 work hours a day, 6 days of most weeks."</cite></p>
    <p>Who is so dumb in the brain as to believes this?</p>
    <p>The Canadatype outfit (<a href="http://www.canadatype.com" title="www.canadatype.com">www.canadatype.com</a>) is a rip-off joint specialized in ripping off the designs made by others without obtaining permission from the original designers.</p>
    <p>For example, for ripping-off the "Mark Twain" design by Gustav Jaeger, it took Rebecca Alaccari and Patrick Griffin less than an hour or two for scanning the "Mark Twain" typeface from a type-specimen book.</p>
    <p>Gustav Jaeger, who contacted me this week, told me in a lenghty talk that the rippers-off Rebecca Alaccari and Patrick Griffin never bothered to get his permission, but instead ripped off his "Mark Twain" font without obtaining a license and now sell this ripped-off font as "Huckleberry" ("Tom Sawyer" could also have been used for the ripped-off "Mark Twain" font by Rebecca Alaccari.)</p>
    <p>Gustav Jaeger told me that the designs of most of his fonts have been registered as design patents at the German design office in Munich.</p>
    <p>(For a short extract see <a href="http://www.sanskritweb.net/forgers/sari.pdf" title="www.sanskritweb.net/forgers/sari.pdf">www.sanskritweb.net/forgers/sari.pdf</a>, page 2.)</p>
    <p>Disregarding the fact that Gustav Jaeger is the owner of the design and that he never granted a permission to the Canadatype rip-off outfit, Rebecca Alaccari and Patrick Griffin now claim at Myfonts that the Canadatype joint is the "owner" of the design.</p>
    <p><a href="http://www.sanskritweb.net/temporary/huckleberry.jpg" title="http://www.sanskritweb.net/temporary/huckleberry.jpg">http://www.sanskritweb.net/temporary/huckleberry.jpg</a></p>
    <p>That's what I call the Type Designer's Rip-off Ethic:</p>
    <p><strong>By ripping-off the designs made by other designers you appropriate the ownership to the designs, irrespective of whether the ownership to the designs has ever been registered at the official design office.</strong></p>
    <p>Cheers to Rebecca Alaccari and Patrick Griffin: Continue your rip-off activities. There will be always idiots who buy "licences" to ripped-off designs for which Rebecca Alaccari and Patrick Griffin never obtained any licences.</p>
