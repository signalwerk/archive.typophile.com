      <p></p><div class="imageWrap"><img src="http://typophile.com/files/resaspt_3740.jpg"></div><br>
      John, humanist faces are characterized by a variance in character width and angled stress. Compare GM Text with Garamond and Times (or Manticore)--and of course the venerable news face Plantin-- and note that they all have a narrow s. <p></p>
      <p>In the GM Text s, the top aperture is plenty open enough, as you can see in comparison to the other faces here.</p>
      <p>GM text replaces Utopia, which had served the G&amp;M well, but David Pratt wanted something with a bit more attitude, on a par with the liveliness of the GM News face, and to contrast with the reserve of GM Sans. So I gave the face wedge-shaped terminals and an angularity that animates the top of the x-height, with some of the "cut" I admire in Nimrod and Palatino.</p>
      <p><em>maintaining the same editorial structure</em></p>
      <p>But it's not the same! They have integrated web and print (physically, too, in the newsroom), and the new editorial structure grew out of that. The six columns gives them the flexibility to break down stories into multiple graphic treatments -- sidebars, charts, pull quotes, infographics, "links" etc., -- which seems to be where news presentation is heading, like it or not. Having six columns gives a little more scope for this than five. In fact, when there's only five coulmns in a paper, and, as can happen, there's not much going on in a page, it can look really dull and more like a newsletter than a paper.</p>
