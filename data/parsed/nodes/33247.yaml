      <p>Let's forget about the Globe and Mail for a bit (although I'll later have some further, illustrated comments about the problems of the narrow column width), because I think your most recent comments have raised a more interesting if troublesome topic: how can we be critical of design, and specifically typographic design?</p>
      <p>In one message you dismissed both the relevance of the findings of the scientific study of reading, on the grounds that they 'can be used to back up just about any theory one may wish to advance', and dismissed the criticisms of designers and typographers -- the 'pros' -- as being reactionary against a 'progressive' design. Of course, this makes the claim that the design in question is progressive an unchallengeable presumption. The other adjectives that have been used are the equally vague 'edgy' and 'funky'. 'Humanist' is used as a synonym for arbitrary and inconsistent. Overall, this form of dismissal of criticism -- not just of my particular criticisms, but of the possibility of criticism: especially and ironically criticism by typographic professionals -- gives carte blanche to any arbitrary decision in design which can be justified by appeals to edginess, funkiness or progressiveness.</p>
      <p>I've known you long enough, Nick, to know that you're a thoughtful designer, so I'm sure you see the problems of cutting off the possibility of criticism in this way and the subsequent reduction of critical opinion to personal preference. But it does raise interesting questions about how we can, as typographic professionals, i.e. as a particular kind of reader, make critical judgements about type design, layout, etc. I don't think there is a 'conflict of interest' between being a typographer and being a reader, because the implication of such a conflict is that the very fact that I might know what I'm talking about disqualifies me from saying anything, which is insane. As far as I know, all typographers are also readers*, and their professional skills and experience make them <em>informed</em> readers; that is, they are capable not only of reading but of examining and drawing conclusions about the material form of text as it relates to their own experience of reading.</p>
      <p>* I know of one example of a type designer who was not a reader, i.e. he was illiterate, but so far as I know no one involved in the planning, setting and arrangement of text has done so without also being able to read it.<br>
      _____</p>
      <p><em>This is a consistent finding in news publishing: print readership is in slow decline, but redesigns provide a spike.</em></p>
      <p>Yes, and this is something that should be a red flag to any type designer and typographer, because this consistent finding says nothing about the quality of the redesign, only about the financial impact of novelty. There is an economic incentive in terms of increased circulation that is very attractive to publishers. I suspect that as the overall readership figures continue to decline we will see more and more frequent redesigns, but also less and less money invested in those redesigns as publishers seek that circulation spike at the lowest possible cost.</p>
