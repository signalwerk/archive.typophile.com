    html: |-
      <p>Thanks Silas. The emphasis is on the sans faces, restricting the serif face just to text, hence the more weights of the sans. From a font production point of view, there are many efficiencies in producing multi-weight families through interpolation. There is actually a display version of the serif face, which is used sparingly, and not mentioned in the guide. </p>
      <p>Yes, they will be using all the weights, as they have a lot of different sections throughout the week, so the Thin will appear in Fashion, of course.</p>
      <p>About the "cheerful delivery". There's certainly a fair bit of personality and calligraphic action in the GM News version of the sans, those qualities were developed to make it the humanist contrast with the stripped-down, more geometric GM Sans sans. With smooth execution, that may come across as cheerful, but I would hope it's more like "pleasant", as a newscaster might be considered, even when delivering bad news. </p>
      <p>It could be compared to other ductus-informed news faces such as Luc De Groot's Corpid, used in the Metro papers, which has some cute qualities too, such as the bendy-stemmed v's and w's, and the semi-serifed i, which don't seem to hurt it.</p>
      <p>Ultimately, the humanist liveliness of the GM Sans was a direction of my design brief, stipulated, I would assume, as a necessary foil for the gridularity of the layout, all rectangles and rules, and the dry tone of the Globe and Mail's headline copy. So I think that on a daily reading basis, when readers have developed a familiarity with the paper as a whole, that bit of warmth won't stand out, but will be a comfortable part of the reading experience.</p>
      <p>Yes, the fonts will go retail after a year's exclusitivity, which may just give me time to develop CE characters and the OpenType features.</p>
