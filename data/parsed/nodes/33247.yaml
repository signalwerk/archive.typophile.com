    html: |-
      <p><em>How did News Designer get the samples of your fonts?</em></p>
      <p>Someone at the Globe must have provided them with a pdf of page A3, which discusses the redesign and shows the fonts -- there's a link to that pdf at News Designer, so you can inspect the fonts up close in that.</p>
      <p>The premise of two matched sans faces is that one is busy, with "some serifs", for use in straight news where the type must carry a lot of the interest, and the other is pared down, for use in feature sections where there is more design space for the art directors and a more reticent face will work better. That distinction emerged during the design process. For precedents, think Tarzana vs Futura, although David Pratt first drew my attention to two "colours" of the same face in Lisboa (not quite the same idea as the Thesis variants?). He wanted a lot of tools (or toys) in the box, but wanted to avoid the typical serif vs. sans play, to give it a contemporary sans-y look. So the contrast is sans vs. sans, as when there is a "GM News" head and "GM Sans" sidebar text.</p>
