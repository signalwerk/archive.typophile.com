      <p>Peter: <em>I think it’s right that ‘funkier’ and ‘edgier’ as brief must be seperated from those terms as foils for criticism. John, how would you have handled an assignment that included those terms in the brief and wanted to retain the considerable layout flexibility advantages of a six column grid over a five column grid on a narrower paper?</em></p>
      <p>I sometimes have clients who throw out similarly vague catchwords as part of what they want in a typeface design, and the only way to interpret such words is as what the client is hoping other people will say about the design when they see it. So its a kind of anticipatory marketing. For me, this kind of thing is always a problem because I like specific targets, so I end up either ignoring these catchwords and focusing on the technical goals of the project that, in the end, are what really need to work, or risk annoying the client by pushing them to explain what they mean.</p>
      <p>I'm typically quite ready to point out to clients the contraditions that are often inherent in their goals, and the choices that these present in terms of where the compromises can fall. What I don't like clients to do is to proceed in the belief that there won't be compromises, even if this undermines the optimism of their marketing strategy. Some goals are simply at odds with each other, and either need to be revised or the inevitable compromises accepted (in which case part of the design brief becomes the minimisation of the impact of these compromises, and at that point we're in the realm of the kind of design issues that I like most: specific functionality rather than vague or fluid stylistic associations). So in the case of a newspaper reducing its page size while maintaining the same number of columns per page, the first thing out of my mouth would probably be about the impact of narrower columns, just as it has been in this thread, and the stylistic aspects of the brief would be of secondary concern to me.</p>
      <p>I suspect that central to the debate that Nick and I have had on this subject is that we're probably quite different kinds of designers, and he is more comfortable dealing in the language of stylistic associations (edgy, funky, etc.). This is clearly a strength on his part in terms of dealing with certain kinds of jobs and clients.</p>
      <p>I'd like very much to have the opportunity to design a text face for a specific newspaper, because the technical challenges posed by both layout design and print production are exactly the sort of things I like to deal with and which I can't often address as precisely as I would like in types that are aimed at broader use (multiple sizes, many different kinds of layout, different output devices, etc.) But I would find a brief that specified styslistic considerations, i.e. that sought to use the typeface to evoke particular associations or catchwords, either frustrating or irrelevant, because I would be setting out to design the most readable typeface possible within the framework imposed by the layout and production, and that would ultimately determine the style of the type.</p>
