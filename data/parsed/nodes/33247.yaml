      <p>Thanks for posting the image, Nick, it demonstrates my complaint very well. The proportions of the s in Utopia and Nimrod are far better suited to newspaper type than the narrower forms in the other types. [Despite it's origins, it should be remembered that Times, as James Mosley observed, had a much more successful career as a book face than as a newspaper face.] The width of the GM Text s relative to the other letters is closest to the proportions of Garamond: a model I consider very inappropriate for a newspaper type. Further, in the examples shown, only GM Text exhibits the drooping top terminal which gives the letter a thrust to the lower right, contrary to the dynamics of all the other letters. In all the other types, the top of the s is designed to optically lift slightly, precisely to avoid this problem. In the narrow Garamond s this feature is particularly strong im order to keep the narrow letter open.</p>
      <p>The other thing that Utopia and Nimrod have in common is a very good evenness of colour, while GM Text has much greater variety in terminal and stroke weight. This does indeed make GM Text funkier, but it is this feature of the design that I don't think fares well in the print quality of the newspaper. If the basic colour of the text is even, then ink gain or loss will still result in an even colour. If the base colour is uneven, then variation in pressure and ink coverage in particular can exagerate certain features of letters (to the point where the heavy upper terminal of the s almost merges into the middle stroke as I saw in one ink-heavy place today). This kind of variation is impossible to avoid in newspaper printing, in which even different areas of the same page can be subject to ink gain or loss due to the density of nearby images. [This is a feature of newspaper production that the Poynter types brilliantly address, providing variant designs for use in closer or further proximity to photographs.]</p>
      <p>Regarding the column width, if they were dedicated to six columns, why did they go to a narrower page size? and why did they decide to force the actual line length to be even narrower by sticking entirely unnecessary rule lines between columns and using ragged right. The average line length in a random story I examined today was only 4-5 words long. We know quite a lot from eye movement studies about what a reader does at the end and beginning of a line, and in very narrow measures the cues to shift to the next line are happening almost as soon as we start a line. Simply put, the columns are too narrow to be read properly, and what happens is vertical skimming. I find myself doing this all the time in the new Globe and Mail.</p>
      <p><em>In fact, when there’s only five coulmns in a paper, and, as can happen, there’s not much going on in a page, it can look really dull and more like a newsletter than a paper.</em></p>
      <p>I think this captures very well the apparent concerns of the redesign: to make the newspaper <em>look</em> interesting. In that I suppose it succeeds, but the only page I <em>read</em> with any pleasure or ease today was the Comment and Letters page, which has a five column layout. It does indeed look dull compared to many other pages, but it's friggin' readable!</p>
      <p>Oh well, the National Post is a more entertaining read anyway: I'd rather be outraged and offended by the content than by the difficulty of reading it. :)</p>
    html_clean: |-
