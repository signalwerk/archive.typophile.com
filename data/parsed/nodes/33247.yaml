      <p><em>Fortunately, unlike, say, a brochure, there’s the opportunity to refine things through successive issues.</em></p>
      <p>Indeed. Maybe I got a dud copy on the first day. It's looked better since then, although I still don't think the printing does the type design many favours.</p>
      <p>The thing with the lowercase s is that I really don't think it does interact well with the other glyphs: I think it stands out, and the main reason for this is that the heavy top terminal sags and gives the whole letter a pronounced downward slope. I also think it is too narrow, and this exacerbates the problem by making the internal curves very tight compared to letters like c and e. [By the way, a good trick to getting the width of the s to harmonise well is to design a Cyrillic at the same time as the Latin: if you design the s with an eye on the Latin a and the Cyrillic в it is possible to triangulate the width.]</p>
      <p>Regarding the layout of the new design, after a couple of days I still think the columns are painfully narrow and a very unpleasant reading experience. When they adopted the smaller page size they should have gone to a 5-column layout. I wouldn't be surprised to find that the new Globe and Mail wins some sort of prize for the narrowest column measure in a national newspaper. When I said it was crude, I wasn't questioning the complexity and precision of the templates. I meant maintaining the same editorial structure based around a six-column layout was crude compared to what we saw when various UK newspapers adopted a smaller format and revised not only the appearence of the paper but the way in which news was structured. [Mark Barratt gave a very interesting presentation on this at ATypI Prague. The most fascinating case was the Times, which maintain a broadsheet and tabloid format side-by-side for some time, so one could compare the ways in which the same stories and images were packaged.]</p>
