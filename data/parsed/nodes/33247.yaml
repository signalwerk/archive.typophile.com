      <p>Nick, when I talked about uneven colour I was not refering to the contrast between thick and thin strokes, which I expect and which we all know how to manipulate to produce an overall even texture. I was talking about the difference in weight between thick stroke and thick strokes, which is exagerated by ink gain as clearly shown in the photograph you posted: the straight ascending strokes are all markedly heavier than other features.</p>
      <p>You quote Paul Wells saying 'We were told the same thing when Ken Whyte shook up Maclean’s, yet circulation has held steady, fully paid-up circulation is rising, and newsstand sales are galloping along.' What that doesn't acknowledge, and probably Mr Wells and most other people are unaware of it, is that the Macleans type was revised after the initial launch of the redesign precisely to address the complaints that had been raised by readers.</p>
