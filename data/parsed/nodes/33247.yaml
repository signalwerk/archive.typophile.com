    html: |-
      <p>Without wishing to diminish what Nick has achieved -- in only four months --, I think there are some problems with the new text face. Maybe the eastern edition of the newspaper is better printed than the western edition, but when I picked up a copy yesterday I really didn't think the quality of the printing was good enough for the kind of subtleties Nick has included in the design, and which look so nice in the PDF. Arguably, this is a problem with the printing and not with the typeface, but surely the design of a typeface for a particular newspaper should take the production standard of that paper into account. I actually found the new text face quite hard to read, and while I like the idea of the ragged-right setting very much, the columns are too narrow. The column width in the old design on the larger page was much better, especially considering that lines in the new columns are made narrower-still by being ragged-right. I find it a very fragmentary reading experience.</p>
      <p>The top of the lowercase s is very cramped, and this catches my eye more than any other letter. I want to grab that droopy terminal and pull it up a bit. Given that the usual aim in 9pt text type is to make very open counters, and Nick has done this elsewhere in the design, I find the s very out-of-character and distracting.</p>
      <p>Overall, the new design is a lot more interesting than the majority of north American newspapers, but I'm not convinced it actually works very well. Compared to the Guardian redesign of a couple of years ago, the new Globe and Mail seems quite crude. Of course, the production standards of the Guardian, like those of most European newspapers, are very much higher and the type very much crisper on the page.</p>
    html_clean: |-
      <p>Without wishing to diminish what Nick has achieved -- in only four months --, I think there are some problems with the new text face. Maybe the eastern edition of the newspaper is better printed than the western edition, but when I picked up a copy yesterday I really didn't think the quality of the printing was good enough for the kind of subtleties Nick has included in the design, and which look so nice in the PDF. Arguably, this is a problem with the printing and not with the typeface, but surely the design of a typeface for a particular newspaper should take the production standard of that paper into account. I actually found the new text face quite hard to read, and while I like the idea of the ragged-right setting very much, the columns are too narrow. The column width in the old design on the larger page was much better, especially considering that lines in the new columns are made narrower-still by being ragged-right. I find it a very fragmentary reading experience.</p>
      <p>The top of the lowercase s is very cramped, and this catches my eye more than any other letter. I want to grab that droopy terminal and pull it up a bit. Given that the usual aim in 9pt text type is to make very open counters, and Nick has done this elsewhere in the design, I find the s very out-of-character and distracting.</p>
