      <p><em>When I described the paper as edgy and progressive, that was a straightforward description</em></p>
      <p>I don't see how the catchwords of popular culture branding exercises constitute a 'straightforward description'. A straightforward description is saying e.g. that the page size is x number of millimetres narrower than in the previous design and there are an average of y.z fewer words per line, etc. 'Edgy' and 'progressive' are judgements about the design, not descriptions of it.</p>
      <p>There seems to be a lot of confusion, these days, about the difference between description of a thing and expression of judgements about a thing, much of it involving the language of marketing hype. People are so used to throwing these vague but positive-sounding catchwords around that critical communication becomes very difficult. I believe much of this confusion is deliberately manufactured by a marketing industry that has a vested interest in making it difficult for people to talk meaningfully about quality.</p>
      <p>I'm not claiming that my criticisms of the new Globe and Mail design are 'objective', and I don't see that they need to be. I'm saying that these are my criticisms and these are my reasons for them. I suppose I could have just said 'I don't like it very much', but that wouldn't be completely accurate and it wouldn't be sufficiently respectful of the work, which deserves some kind of analysis. So I've said what I find problematic and the reasons why these things seem to me problematic.</p>
