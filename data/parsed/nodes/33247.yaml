      <p><em>Postscript</em></p>
      <p>Without wishing to stir further debate, since Nick and I seem to have reached a kind of accomodation, I still wanted to post the promised illustration of a particular problem of the narrow column width and ragged right setting. This is one of those situations in which if you push something too far in one direction, you inevitably end up having to compromise elsewhere. In this case, you purchase the narrow columns and the ragged right setting at the cost of excessive hyphenation. There's no other option, because if you reduce the hyphenation the stories overrun their column inches and half the ragged lines end up with excessively large white space on the right. Achieving a visually pleasing, even rag requires considerable care even on wide measures; on a narrow measure it can only be achieved by plentiful use of the hyphen.</p>
      <p>Ironically, the copy introducing readers to the new design reads: <em>'We have adopted a universal ragged-right format so we can use large-text type in narrow columns, which reduces the need to hyphenate words. This makes for smoother reading.'</em></p>
      <p>The photo below was taken from a randomly selected story last week. When 60% of the lines are hyphenated, two in the middle of proper nouns, I don't think the 'smoother reading' theory is holding up too well.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/GMhyphens_5380.jpg"></div><p></p>
