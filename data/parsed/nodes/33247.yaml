      <p>The penalty of size:</p>
      <p>Big newspapers suffer a typographic handicap from the get-go.<br>
      The state of the art pagination systems that coordinate the activities of several hundred workstations are short on typographic finesse.<br>
      (My anecdotal experience from dealing with newspapers of various sizes -- not an expert on pagination systems.)</p>
      <p>Of particular note are the lack of support for ligatures (even f_i and f_l), and relating to John's interest in hyphenation, the lack of multi-line composition. And of course, because the text is necessarily always live, there is no opportunity for manual tweaking.</p>
      <p>Multi-line H&amp;J software would, I suspect, reduce hyphenation -- just a little thing like nixing partial-word widows would be a huge improvement!</p>
      <p>It would be interesting to compare hyphenation percentages by:<br>
      1. Rag right vs. Justified<br>
      2. Single-line composition vs. Multi-line composition<br>
      3. Characters-per-line</p>
      <p>I wonder if there is research on this?</p>
      <p>Variables such as the number of successive hyphenated lines permitted may also be a factor, as well as letterspace and wordspace settings. And minute changes to tracking, horizontal scaling, line length, and type size can also move the sweet spot significantly. We're all familiar with the situation where changing one letter in a paragraph will suddenly cause several hyphenations where none existed before. With so many variables, setting H&amp;J specs becomes something of an art.</p>
