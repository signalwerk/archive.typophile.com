      <p><em>a model I consider very inappropriate for a newspaper type</em></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/displayed_6598.jpg"></div><p></p>
      <p>John, there is nothing inherently wrong with the form of the humanist/old style of type for news text. Plantin (shown at top) was for many years a succesful news face, and although it has fallen from favour, the old Dutch style that it represents was the driving idea behind Poynter OS.</p>
      <p><em>drooping top terminal which gives the letter a thrust to the lower right, contrary to the dynamics of all the other letters.</em></p>
      <p>It's not about dynamics, by which I presume you mean direction, but shape. The shape of the GM Text s's top terminal is mirrored/flipped in the top stem of the p, and in the top terminal of the a, etc. -- so there is harmony (repetition) of form there, as well as contrast (mirroring). </p>
      <p><em>If the base colour is uneven, then variation in pressure and ink coverage in particular can exagerate certain features of letters</em></p>
      <p>This is incorrect. The "uneven" quality of GM Text, i.e. its pronounced contrast of thick and thin strokes, is designed in anticipation of the substantial press gain that occurs in newsprint, which fattens everything, significantly reducing contrast, toning down features not, as you state, exaggerating them. This is because the same absolute amount of gain has a far greater effect on the relative width of a fine stroke than it does on a thick one. Note the bottom sample. It is precisely because of gain, and the "grey on grey" of news ink on news paper, that an initially dramatic letterform is desirable.</p>
      <p><em>We know quite a lot from eye movement studies</em></p>
      <p>...which can be used to back up just about any theory one may wish to advance as to what is most readable.</p>
      <p><em>the only page I read with any pleasure</em></p>
      <p>Designers and typographers react differently to text than ordinary readers. If there is something in the layout or typography which contradicts their preference or theories about what is ideal, they find it distracting in a way that the intended reader doesn't. Which is why a progressive design will get flak from the pros. </p>
      <p>The Globe and Mail redesign was, of course, done with numerous focus groups, and response was remarkably positive. Of course, as with all redesigns, there will be some lost readers, but most will stick with it and adapt, and there will be new readers attracted. This is a consistent finding in news publishing: print readership is in slow decline, but redesigns provide a spike.</p>
      <p>As Macleans columnist Paul Wells commented recently on his blog, </p>
      <p>"my overwhelming response is a cranky old reader's cliché that redesign editors everywhere have come to wearily expect: I can't read the damned thing.<br>
      We were told the same thing when Ken Whyte shook up Maclean's, yet circulation has held steady, fully paid-up circulation is rising, and newsstand sales are galloping along."</p>
    html_clean: |-
