      <p>Nick: I agree that any redesign takes a bit of warming up to, especially when its as progressive as what we have here.  I say we need more of this sort of work too -- keep the humanist wave rolling.  There's so much to explore, and a daily newspaper is a tremendous place to do so.  Get the public eye tuned to where type design is naturally heading.</p>
      <p>I don't think it will take very long at all for the GM's readers to cozy up though.  The layout and type direction are clean, sensible and purposeful.  Just gotta trust the design team to polish and maintain the system.</p>
