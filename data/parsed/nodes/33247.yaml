      <p>Peter: <em>I think it’s right that ‘funkier’ and ‘edgier’ as brief must be seperated from those terms as foils for criticism.</em></p>
      <p>Yes. I used the term "edgy" to describe the outcome of a design process, and I qualified it in my first post here with regards to all sans heads and all ragged body text. Those features of the design are quite unusual in a newspaper. I don't recall that any client has ever given me a direction to make it "edgy" or "funky", certainly not the Globe and Mail.</p>
