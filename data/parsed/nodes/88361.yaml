      <p>I think that, for years now, the trend has been toward more white space--both via generous margins an increased leading--for more comfortable readability. Remember that the printed book is not just a container, but can be an art object independent of the book's writing and subject.</p>
      <p>I can't imagine a professional book designer/page compositor using white space to increase the number of pages ... at least not if he or she intends to work regularly.</p>
      <p>Decreased white space makes for a cluttered look and certainly inhibits sense and reading comprehension. Increased white space is only "not valid" when it's so much as to decrease readability. And it takes quite a lot of white space for that.</p>
