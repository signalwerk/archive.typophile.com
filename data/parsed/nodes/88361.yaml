  html: |-
    <p>Even through is generally accepted that "design follows function", there's an undeniable trend of using too much white space in book layouts. Is useful sometimes, but it can also looks like a cheat to spend less time diagramming text correctly and charge more by using more pages. It seems that most students down here actually don't like to use forced white space when they enter to the college, yet teachers encourage to "lose the fear" to it.</p>
    <p>I know that a particular advocate <a class="freelinking external" href="http://johnkstuff.blogspot.com/2010/02/kid-page-layouts.html" rel="nofollow">agaisnt it</a> is the cartoonist John Kricfalusi, which has a very neat blog (<a class="freelinking external" href="http://johnkstuff.blogspot.com" rel="nofollow">John K Stuff</a>) with a lot of critique of contemporary art, design and drawing advice. Writer Amid Amidi and him were working on a book of his art for about 3 years, yet has been put on hiatus due to having working with a designer that used a somewhat bland layout with white space and all (<a class="freelinking external" href="http://www.cartoonbrew.com/books/why-there-isnt-a-spumco-coffeetable-book-my-personal-story.html" rel="nofollow">Full story and images</a>). While I mostly agree with John K views, it kinds of discourages me that the layout they rejected, or at least what was shown, wasn't really <em>that</em> atrocious and looks like the thing most of my college teachers always approve.</p>
    <p>What's your opinion about white space in book layouts, or 'minimalism' in general?</p>
