    html: |-
      <p>It's a single typeface: <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=FontShop&amp;ffam=Disturbance%20-%20Regular&amp;fid=23ae0fa938ba4aa68b5b82ceeac9ad21&amp;fsize=60&amp;text=BURKE%20NIAZI&amp;fit=1" rel="nofollow">FF Disturbance</a></strong> by Jeremy Tankard (FontFont, 1993)<br>
      Lower &amp; Capital letters are the same for this font, so you can get this result by setting the text to "burke niazi", "BURKE NIAZI" or even "BuRkE nIaZi"</p>
