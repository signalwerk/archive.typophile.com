    html: |-
      <p>Hi Sam,</p>
      <p>welcome to Typophile!<br>
      Please note that you get faster feedback when you post such ID requests on the <a href="http://typophile.com/typeid" rel="nofollow">Type ID Board</a>.</p>
      <p>Postmarks use custom letters, i.e. there is probably no digital font that perfectly matches your sample.</p>
      <p>For an approximation of the date (digits): this might be a case for <a href="http://www.linotype.com/en/5798/dinnext.html" rel="nofollow">Linotype DIN Next</a>. It has the ‘9’ with the rounded bottom, as an alternative glyph. Neither DIN Engschrift, FF DIN nor PF DIN seem to have this form.<br>
      DIN Next has a Condensed, and a Rounded. Alas, no Condensed Rounded.</p>
      <p>Alternatively, there’s <a href="http://www.lineto.com/The+Fonts/Font+Categories/Text+Fonts/Gravur+Condensed/" rel="nofollow">Gravur Condensed</a>.</p>
      <p>Cheers,<br>
      F</p>
