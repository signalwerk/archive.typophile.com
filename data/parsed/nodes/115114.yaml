    <p>As is well known, at least among the participants of this forum, if not the public at large, in printing such works as his famed 42-line Bible, Johannes Gutenberg employed a font which contained one alternate version of nearly every letter. This was done so that the books he printed would look like handwritten manuscripts, not betraying their mechanically printed nature through every copy of the same letter being identical.<br>
    While this was no doubt a very reasonable thing to do at a time when the handwritten manuscript was the very definition of a book, and thus the measure of quality for a book, it still strikes modern readers as strange. The mechanical perfection of today's books seems to be one of the things that makes them beautiful and easy to read.<br>
    And yet, there's one realm where precisely this level of conservatism persists to the present day. Fonts used for lettering comic books, comic strips, and webcomics strive to simulate hand lettering as closely as possible, often by providing alternate forms of each character (usually by being all-caps fonts, and letting the alternates be selected with the shift key).<br>
    Thus, at Comicraft, we have <a class="freelinking external" href="http://www.comicbookfonts.com/Chatterbox-p/bl029.htm" rel="nofollow">Chatterbox</a>, which appears to me to be closely patterned after the lettering of Sam Rosen, as an example of how comic fonts follow lettering. This page,<br>
    <a class="freelinking external" href="http://bullyscomics.blogspot.ca/2011/01/credit-where-credit-is-due.html" rel="nofollow">http://bullyscomics.blogspot.ca/2011/01/credit-where-credit-is-due.html</a><br>
    shows his lettering, that of Artie Simek, and that of a few other Marvel letterers.<br>
    Of course, there were many unsuccessful attempts to use typographical techniques for comic lettering.<br>
    Thus, this blog page contains an old Charlton comic in which the word balloons were done using a fixed-pitch comic font for the Varityper.<br>
    <a class="freelinking external" href="http://fourcolorshadows.blogspot.ca/2013/06/captain-atom-rocco-mastroserio-1961.html" rel="nofollow">http://fourcolorshadows.blogspot.ca/2013/06/captain-atom-rocco-mastroserio-1961.html</a><br>
    And EC Comics used a Leroy lettering tool (commonly used by draftsmen for neat lettering) for word balloons on its comics, and the results were also unattractive:<br>
    <a class="freelinking external" href="http://marswillsendnomore.wordpress.com/2011/02/07/his-mechanical-brain-is-charged-with-all-knowledge/" rel="nofollow">http://marswillsendnomore.wordpress.com/2011/02/07/his-mechanical-brain-is-charged-with-all-knowledge/</a><br>
    (of course, the story was a classic for the ages, but that is another matter).<br>
    On the other hand, plain old Univers<br>
    <a class="freelinking external" href="http://mikophoto.net/wordpress/?attachment_id=1813" rel="nofollow">http://mikophoto.net/wordpress/?attachment_id=1813</a><br>
    worked out just fine for Dave Berg's "The Lighter Side Of..." feature in MAD magazine.<br>
    As for Comic Sans, the webcomic <a class="freelinking external" href="http://barbarianprincess.com/?p=153" rel="nofollow">The Challenges of Zona</a> started out using that face; while it's a great comic, the face is not that good for comics, as you can see.</p>
