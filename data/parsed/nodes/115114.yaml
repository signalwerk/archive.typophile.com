      <p>The only webcomic that pulls off Comic Sans is Order of the Stick, because it is a match for its art style of primitive round-ended strokes, chosen in all self-awareness (and, of course, because it seldom tries to extend the font's utility beyond the five-pixel x-height it was made for).</p>
      <p>As for Zona, a comic made of 3D models with no hint of anything like an actual ink line anywhere has no reason to limit itself to typefaces that mimic inked lettering, even good ones. I think digital artists who want their work to be like movies would do well to consider the way MAD separated words from pictures, obliterating any suggestion that the words were part of the pictures.</p>
