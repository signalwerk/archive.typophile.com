    <p>Good evening ladies and gents.</p>
    <p>To keep it short, I've been working on this typeface for a while and I would be thankful to receive some feedback on it. It's condensed, and the idea came from that cryptic text at the bottom of movie posters that nobody ever reads. Except its purpose is not to be entirely invisible and that the design took many many turns since then.</p>
    <p>I realize it looks a bit like URW Grotesk Condensed, although I was actually unaware of that until recently.</p>
    <p>So far, I really feel I'm not doing this font a lot of justice - in that, it is too plain, too boring, and has little personality. Or maybe I've just been looking at it for too long. Oh and I made a tz ligature, just because I think it's pretty.</p>
    <p>Anyway, here it is:</p>
    <p>(a dropbox link in case the attachment thing doesn't work right)<br>
    <a href="https://dl.dropbox.com/u/2982701/Director/Specimen%2017.12.2012.pdf" title="https://dl.dropbox.com/u/2982701/Director/Specimen%2017.12.2012.pdf">https://dl.dropbox.com/u/2982701/Director/Specimen%2017.12.2012.pdf</a></p>
