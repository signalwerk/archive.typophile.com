    <p>Hi,<br>
    I’m redesigning our company’s corporate manual which includes a few quite lengthy documents, regarding brand licensing and the company profile etc. I am very new to this and don’t know the ’rules’ regarding layout of these kinds of documents. The original is absolutely hideous an terribly difficult to read. There are a lot of very small (1–2 sentences) clauses, each with its own subheading and I’m just having a bit of trouble with it all. Does anyone have any advice, or can link somewhere with standard legal document layouts etc?<br>
    Thanks</p>
