    html: |-
      <p>Unless you’re reproducing actual legal papers—i.e., motions, writs, court orders, etc.—in their actual format, I would lay them out as separate docs within your manual, organized in a logical way, maybe an outline format. The idea would be to simply make the material readable by your audience. So, again, if you’re not reproducing actual papers, I’d bump up the typeface size if it’s too small, make sure the leading helps readability, and otherwise make it something that will be easy on your audience’s eyes. The idea is to encourage them to read from beginning to end, as well as promote decent comprehension.</p>
      <p>If you think the project can benefit from a professional’s touch, contact me.</p>
