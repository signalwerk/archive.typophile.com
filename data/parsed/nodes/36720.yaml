      <p>What specifically makes it difficult to read? Type too small/too tightly leaded/lines too long/bad choice of typeface/page layout too broken up?. If the subheading are on their own lines, one way of making the document less choppy would be to have the subheads run in on the first line of each clause itself—-set them in semi-bold or bold (depending on the typeface).</p>
      <p>I don’t know that there are specific “rules” for this kind of document. Regular graphic design principles should apply to make the page inviting, easy to read, and easy to comprehend the hierarchy of topics.</p>
