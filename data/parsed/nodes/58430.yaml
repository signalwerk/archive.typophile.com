      <p>It's unfortunate that your photo has only those letters, as they are not generally useful for ID purposes. For future opportunities, try to get letters like A, E, G, J, K, M, R, S, and W, which tend to be more varying between typefaces.</p>
      <p>I could not find a writeup about the origin of the design for Blair, but it is possibly based on existing lettering that Jim Spiece saw elsewhere, as most of his work has been revivals of older designs. </p>
      <p>- Mike Yanega</p>
