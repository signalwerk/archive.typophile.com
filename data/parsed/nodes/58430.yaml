      <p>To follow up on the idea of older designs that might have been similar to the lettering you showed, I looked in the oldest of the Photo-Lettering Catalogs I had (from 1960), and there are a number of typeface families such as Hamilton Gothic, Darius Wide, Paramount Gothic, Amsterdam Card Grotesque and others that include variants that have wide geometric sans letters that look very much like ITC Blair. Almost any of them could have been models for it. </p>
      <p>Most of these were probably never digitized. Today you could pick from ITC Blair,  ITC Flatiron, Akzidenz-Grotesk Extended, Trade Gothic Extended, Engravers Gothic and House Neutraface (1 and 2), and probably find something to replicate the lettering you saw.</p>
      <p>- Mike Yanega</p>
