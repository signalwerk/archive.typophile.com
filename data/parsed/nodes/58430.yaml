    <p>Random one this.</p>
    <p>Just went to Brazil for a holiday. Noticed a lot of the apartment blocks use this font or a similar one. The example is taken from the gorgeous <a href="http://wikimapia.org/2134/Edif%C3%ADcio-Copan-Oscar-Niemeyer-s-Copan-Building" rel="nofollow">Edificio Copan</a></p>
    <p>Looks like ITC Blair but is there something more authentic from the time (mid fifties) that this is based on? Only got a few characters in the image - sorry.</p>
    <p>Thanks for your help.</p>
