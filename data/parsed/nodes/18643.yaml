    <p>The M-formula document was a letter written by <a href="/node/13538/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept"><span class="caps">W.A.</span> Dwiggins</a> to <span class="caps">C.H.</span> Griffith at Mergenthaler Linotype on July 3, 1937. In it, he lists 4 “memoranda” or observations of then current type trends. The M in M-Fomula stands for “marionette,” and refers to the principle in puppet making that explains that for the face of a marionette to “read” for viewers sitting far away, the would-be soft features must be translated as sharp planes – “These sharp-cut planes, when viewed on the stage, by some magic transformed themselves into delicately rounded curves and subtle modellings; and the faces looked like young girls from clear across the room, as well as from the front benches.” Dwiggins then goes on to explain that the curves and lines can be combined to impart a design with “dynamic&nbsp;grace.”</p>
