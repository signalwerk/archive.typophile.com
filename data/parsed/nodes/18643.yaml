    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Concepts" class="freelinking" rel="nofollow">Concepts</a> : M-formula</strong></p>
    <p>The M-formula document was a letter written by <a href="/wiki/William%20Addison%20Dwiggins" class="freelinking" rel="nofollow">W.A. Dwiggins</a> to C.H. Griffith at Mergenthaler Linotype on July 3, 1937. In it, he lists 4 "memoranda" or observations of then current type trends. The M in M-Fomula stands for "marionette," and refers to the principle in puppet making that explains that for the face of a marionette to "read" for viewers sitting far away, the would-be soft features must be translated as sharp planes -- "These sharp-cut planes, when viewed on the stage, by some magic transformed themselves into delicately rounded curves and subtle modellings; and the faces looked like young girls from clear across the room, as well as from the front benches." Dwiggins then goes on to explain that the curves and lines can be combined to impart a design with "dynamic grace."</p>
    <p><strong>Discussion:</strong><br>
    <a href="http://typophile.com/node/41687" rel="nofollow">Cut and then Curved</a></p>
    <p><strong>Additional Articles:</strong><br>
    <a href="/wiki/Kent%20Lew" class="freelinking" rel="nofollow">Kent Lew</a> explains <a href="https://listserv.heanet.ie/cgi-bin/wa?A2=ind0308&amp;L=typo-l&amp;T=0&amp;P=9864" rel="nofollow">what is meant by the M-Formula</a><br>
    <a href="http://themicrofoundry.com/other/wad/WAD_a.gif" rel="nofollow">The M-Formula illustrated</a></p>
