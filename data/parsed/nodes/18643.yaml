    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/13962" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Concepts</a>&nbsp;:&nbsp;M-formula</strong></p>
    <p>The M-formula document was a letter written by <a href="/node/13538" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal"><span class="caps">W.A.</span> Dwiggins</a> to <span class="caps">C.H.</span> Griffith at Mergenthaler Linotype on July 3, 1937. In it, he lists 4 “memoranda” or observations of then current type trends. The M in M-Fomula stands for “marionette,” and refers to the principle in puppet making that explains that for the face of a marionette to “read” for viewers sitting far away, the would-be soft features must be translated as sharp planes – “These sharp-cut planes, when viewed on the stage, by some magic transformed themselves into delicately rounded curves and subtle modellings; and the faces looked like young girls from clear across the room, as well as from the front benches.” Dwiggins then goes on to explain that the curves and lines can be combined to impart a design with “dynamic&nbsp;grace.”</p>
    <p><strong>Discussion:</strong><br><a href="http://typophile.com/node/41687">Cut and then&nbsp;Curved</a></p>
    <p><strong>Additional Articles:</strong><br><a href="/node/add/wiki?edit%5Btitle%5D=Kent%20Lew" title="Create node &quot;Kent Lew&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Kent Lew</a> explains <a href="https://listserv.heanet.ie/cgi-bin/wa?A2=ind0308&amp;L=typo-l&amp;T=0&amp;P=9864">what is meant by the M-Formula</a><br><a href="http://themicrofoundry.com/other/wad/WAD_a.gif">The M-Formula&nbsp;illustrated</a></p>
