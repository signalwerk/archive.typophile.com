  html: |-
    <p>For an event poster, I'd like to replace the original text, attached, (from a 17th-century engraving that is the centerpiece of the poster) with information about the current event (title, date, location). And I'd like this information to appear in a font that emulates the original typeface as much as possible.</p>
    <p>What font would be the best match here to convey a feel for the period? </p>
    <p>Suggestions much appreciated.</p>
    <p>Thanks!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ANewSystem-type_4366.jpg"></div><p></p>
