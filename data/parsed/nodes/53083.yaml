      <p>I like the latest no 4, because of the cleanliness. It gets your point across concisely, and the separations between you and what you do make the message have a bit more authority. It might be an optical illusion, but it looks like the bottom rules don't match the same spacing as your top rules, I didn't notice it until now. I'd be interested to see your thoughts on it, as it is your logo.</p>
      <p>Side note: I had a typo in my previous post, I was referring to no. 3 weights, not no. 4. However, I think that the latest versions work much better.</p>
