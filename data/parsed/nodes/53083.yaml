    votes: null
    html: |-
      <p>I'd like to see your name in the two different weights used in no. 4  in combination with the titles on either side as no.1, however, I would suggest removing the graphic as it doesn't seem to have any relevance other than to separate your titles which could be done without a graphic. I feel like the graphic was thrown in as an after-thought, but only because your using the rules above and below your typography to essentially frame your name.</p>
      <p>If you would like to go with the style of the bottom three samples, where you're titles are going to be below your rules, then I might suggest "Designer/Developer" with a bit of space between, and playing with the weights of those as well. I wouldn't use the same weight usage as your name with the heavier weight on the left, because then your logo will become unbalanced. One other thing to consider is what your message is going to be through your logo. With emphasis on your name, the logo is about you, and with emphasis on your titles, the emphasis becomes about what you're providing.</p>
