    html: |-
      <p>Home Owners: I said none of the pre-1950s typescripts in my collection were close matches. If you want this style for more than these words, then you should consider adapting an existing font, even if it was produced more recently. Some things to look for in such a font are fairly low contrast stokes that are not to heavy, angular, and no flourishes.  Not really that close but might do in a pinch,  <a href="http://www.myfonts.com/fonts/fontdiner/lamplighter-script-marquee/" rel="nofollow">Lamplighter Script Marquee</a>,  <a href="http://www.myfonts.com/fonts/fontdiner/lamplighter-script/" rel="nofollow">Lamplighter Script</a>,  <a href="http://www.myfonts.com/fonts/adobe/coronet/" rel="nofollow">Coronet</a>, <a href="http://www.myfonts.com/fonts/linotype/vladimir-script/" rel="nofollow">Vladimir Script</a>.<br>
      Don</p>
