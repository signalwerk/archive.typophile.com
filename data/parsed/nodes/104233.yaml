    html: |-
      <p>In the 1940s there was very limited choice of fonts, no digital, not even any phototypesetting, and much was done by hand lettering rather than a font. We can locate fonts to match everything in your image except Home Owners, which is a script on a non-geometric arc. I checked my collection of pre-1950s typescripts and while some are close, none match precisely. I suggest Home Owners is probably no nonsense lettering created by the Sears art department.<br>
      Possibly Linotype machines were used as part of the production of the 1940s Sears catalogs -- if any one has any info please speak up -- which would suggest the fonts are from Linotype.  For the sans fonts, there might be something closer but its worth checking the <a href="http://www.myfonts.com/fonts/linotype/trade-gothic/" rel="nofollow">Trade Gothic</a> fonts as  digitized by Linotype. I can't discern the details of the serif font. It could be any of several including <a href="http://www.myfonts.com/fonts/linotype/centennial-2/" rel="nofollow">Centennial</a> as digitized by Linotype.<br>
      Hope your friend succeeds with the pro bono book.<br>
      Don</p>
