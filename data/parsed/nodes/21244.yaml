    html: |-
      <p>Matt, there is a clear hierarchy, outlined in the InDesign help file.</p>
      <p>When applying styles, here’s how to control what InDesign does with existing formatting:</p>
      <p>- To apply a paragraph style and preserve character styles, but remove overrides, hold down Alt (Windows) or Option (Mac OS) as you click the name of the style in the Paragraph Styles palette.</p>
      <p>- To apply a paragraph style and remove both character styles and overrides, hold down Alt+Shift (Windows) or Option+Shift (Mac OS) as you click the name of the style in the Paragraph Styles palette.</p>
    html_clean: |-
