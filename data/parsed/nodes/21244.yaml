      <p>My guess, without actually firing up InDesign, is that the original doc has local formatting, for example Normal style is 12 pt Times, and some one has changed the typeface and point size “by hand”, ie not changing the style sheet. If you go into your original document, and change the style so it matches the actual point size and typeface, you might avoid this problem.</p>
      <p>One of the many reasons I still prefer Quark, where problem workarounds are generally easier to figure out.</p>
