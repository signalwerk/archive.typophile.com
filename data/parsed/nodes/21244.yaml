    html: |-
      <p>First off, usually when copying and pasting text into a styled paragraph, I like to use the “Paste Without Formatting” (Command + Shift + V), which will automatically assign paragraph attributes to the pasted text. This will also prevent styles from other documents from being imported.</p>
      <p>Second, the “little + sign” means the style is unpure, in this because it’s maintaining attributes from its original document. You can make the paragraph pure again simply by Option-clicking the style.</p>
    html_clean: |-
