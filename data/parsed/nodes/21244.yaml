    html: <p>If you hold down the Option key (and I assume the Alt key in Windows will work the same way) when you click on the paragraph style, then the style’s settings will override any other settings applied to the text. (The +plus sign indicates that the current settings of the selected text do not match the specs of the current style.)</p>
