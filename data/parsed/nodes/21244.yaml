    <p>Hi there, please someone help me. I am going crazy and loosing faith in InDesign. </p>
    <p>I have a document where I have made a set of paragraph styles. I have another document that I am copying and pasting text from. Now... when I select the text box and then select the paragraph style I want it doesnt complete change all the specs. Eg, it might change the colour but not the actual typeface, or point size. The paragrapg style still shows the little + sign by the side of it. SOmetimes it is obvious what is wrong but when it is not it is really annoying to try and find it. </p>
    <p>I thought that by just selecting the right para style it would change the block of text. It gets quite annoying when you have to change every single block of text manually. Surely this defeats the object of paragraph styles. </p>
    <p>Please, for the love of god, someone help me..</p>
    <p>Thanks</p>
