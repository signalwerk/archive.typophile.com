    <p>Hi guys, </p>
    <p>I am in the process of making a new modern logo for an established civil engineer company based in Italy.</p>
    <p>I was looking forward in a simple yet effective and expandable only text logo.</p>
    <p>I loved the look of a sans serif font with a slight higher x-height than usual, something like the one on the attached image.</p>
    <p><a href="http://postimage.org/image/jbti12w1n/" title="http://postimage.org/image/jbti12w1n/" class="link-external">http://postimage.org/image/jbti12w1n/</a></p>
    <p>I don't think that the font really is of good quality, so I would like to ask if you could suggest me a font with a similar style but more professional looking, so that I can work from there my logo ...</p>
    <p>Thank you very much for your attention</p>
