      <p>Regarding spacing...you obviously want to do it optically, but I can't help but notice that KANSAS/DESIGN and CITY/WEEK both have the same number of letters which makes me want to at least see an option that works that sort of alignment into it. </p>
      <p>As it is, while KANSAS CITY and DESIGN WEEK are centered at the line-level, it looks odd as CITY and WEEK align vertically OK but KANSAS and DESIGN look off kilter. </p>
      <p>I'm seeing these as two distinct visual groupings:</p>
      <p>&nbsp;&nbsp; K A N S A S<br>
      D E S I G N</p>
      <p> and </p>
      <p>&nbsp;&nbsp;&nbsp;  C I T Y<br>
      W &nbsp; E &nbsp;&nbsp;  E &nbsp; K</p>
