    <p>Hi everyone!</p>
    <p>I'm creating the branding for the 2011 KC Design Week festival.  A very exciting project and I'm narrowing down to final concepts and could use some input.  </p>
    <p>In this case I'm mainly looking for which letters don't work.  For example the first "S" in Kansas is just awful.  Any others make you mad?</p>
