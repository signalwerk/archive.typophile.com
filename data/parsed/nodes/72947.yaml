      <p>Not a fan of the C (doesn't fit with the other lettering options, no mate) and the E and S in DESIGN are just ugly. The outline stroke of the N seems heavier than the stroke weight of the rest of the letters (inconsistent). The first and ugly third S's also seem vertically stretched.</p>
      <p>I agree with Thomas on the K's issue.</p>
      <p>The overall design seems fun, but it also feels rigid. Might just be the grayscale, but might consider adding some other ornamental details or shifting the letter tracking/orientation a bit.</p>
