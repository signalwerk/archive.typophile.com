    html: <p>If the question is why did Microsoft include Thai in this font? The answer is pretty simple - because Tahoma is Windows 'User Interface' font and had to support all the languages Windows XP was localized into except Chinese, Japanese and Korean which use their own UI fonts. <br> <br>Si</p>
