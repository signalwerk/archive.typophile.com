    html: <p>Not sure if it is related or not, but Microsoft also gave Thailand a sweet deal to ward of their switch to linux. The Thai government was about to switch entirely to Linux and MS came in and undercut Linux (which is pretty hard to do ;o) <br> <br>Not sure what Thailand eventually settled on, but perhaps this was part of the bribe.</p>
