    <div class="info">Submitted by <a href="/user/7006" title="View user profile.">paul d hunt</a> : 27.Feb.2006 11.25am </div>
      <p>Greetings from P22,</p>
    <p>We have a couple new things for March 2006.</p>
    <p>We are pleased to offer you a special font set developed for the Philadelphia Museum of Art to coincide with the Benjamin Franklin Tercentenary celebrations. The “Franklin’s Caslon” font set is digitized from the actual printed pieces produced by Ben Franklin’s printing enterprises. Unlike the “Caslon Antique” font that has seen wide use over the last decade, this one really is a Caslon design and a perfect decorative companion to the Lanston Caslon font set. Available as a packaged CD or as a download: <a href="http://www.p22.com/products/franklin.html">http://www.p22.com/products/franklin.html</a><br>
    The introductory sale price will be 20% off, only $23.96 until March 15th 2006.</p>
    <p>Also,</p>
    <p>Our newly expanded Dada Opentype package, made to coincide with the major Dada exhibition at the National Gallery in Washington DC, is an expanded version of the P22 Dada font. As an Opentype font, it has over 500 glyphs and its special features create some unexpected design results.<br>
    This set is  made in a special edition package that we had some fun in designing. It is also available at a special<br>
    price of $19.95, for more information see: <a href="http://www.p22.com/products/dada_se.html" title="http://www.p22.com/products/dada_se.html">http://www.p22.com/products/dada_se.html</a></p>
    <p>Don’t forget our other specials: <a href="http://www.p22.com/specials.html" title="http://www.p22.com/specials.html">http://www.p22.com/specials.html</a></p>
    <p>That is all for now.</p>
    <p>Best Regards<br>
    P22 type foundry</p>
