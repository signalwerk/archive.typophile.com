    html: |-
      <p>This is hand-painted lettering. Similar to <a class="freelinking-external" href="http://new.myfonts.com/fonts/itfmecanorma/ortem/">Ortem</a> and <a class="freelinking-external" href="http://new.myfonts.com/fonts/urw/seagull/">Seagull</a>. This style is usually considered Art Nouveau, and if you use that as the search term you will find a number of similar styles. I searched at MyFonts, Dafont and Abstract Fonts before realizing that this is not a font. You can see that the letters, while very similar, are not identical when they should be the same.</p>
      <p>- Mike Yanega</p>
