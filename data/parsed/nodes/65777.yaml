    date_raw: 30.Dec.2009 3.42pm
    votes: null
    html: <p>I would say it is not hand-painted but stencilled. There is a slight difference between É and E, probably due to stretching of the cutout material. The Ls in VILLA look identical. This is a familiar sort of white-on-blue metal plaque that was made by an enameling process; many cities have civic street numbers that were done the same way in the first half of the 20th c.</p>
