      <p>Thanks riccard0. The first draft of the logotype had even more exaggerated ball terminals but I had to tone it down because it was way over the top. I've considered increasing the contrast between thicks and thins. I've also had a few ideas for some interesting ligatures.</p>
      <p>I'll develop a few more letters and post the results.</p>
      <p>Thanks.</p>
