    <p>Hello! I'm new here and I don't know anyone arround. I'm a little bit ashamed for writing an email like this , but today i recived a job that It's barely impossible for me to do because I don't have enough knowledge to figure out all the names of the fonts that appear in this image. When my college professor that assigned me this task, told me that there are 15 different types of fonts in this two headline blocks, I couldn't believe it . To be sincere I can only know the name of 2 or 3.</p>
    <p>Can you guys help me to IDENTIFY all the fonts?</p>
    <p>Thank you very much. </p><div class="imageWrap"><img src="http://typophile.com/files/Exercise_6287.jpg"></div><p></p>
