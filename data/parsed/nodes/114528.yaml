      <p>If there are 15 different fonts, I would be surprised, but maybe that includes different weights of the same family? In any case, the image does not show the smaller fonts clearly enough to see their details. Is there another, better image you can point us to?</p>
      <p>For example, the "Spanien er belastet.." serif is certainly not Capitolium News, but I can't tell if the e has a horizontal crossbar, what is the y tail like, or what the r serif looks like.</p>
      <p>- Mike Yanega</p>
