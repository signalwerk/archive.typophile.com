    html: <p>Huh. <br> <br>First Wes Anderson film that doesn't have David Wasco as the production designer, I think. He used to do all Anderson's stuff, as well as Tarantino's. <br> <br>This is mostly interesting because David Wasco is Jim Wasco's brother. Jim is a type designer and font production guy (not to mention keyboard player and brewer). I worked with him at Adobe for a bunch of years, and he's now a manager at Agfa Monotype. <br> <br>Sorry for the digression. <br> <br>T</p>
