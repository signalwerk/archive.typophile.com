      <p>OK, there seems to be some confusion regarding the EULA. This is a special arrangement. All IP rights are with Dalton Maag on this font family. The DSMJ has the right to distribute the fonts freely as part of their 'exclusivity' for the next two years. </p>
      <p>The EULA also states that the fonts may be used on up to 25 workstations after which they become commercial. So, a corporate user will actually have to pay a license fee.</p>
      <p>The EULA is there to ensure that users don't distribute the fonts themselves, as much as there are no modifications or reverse engineering. It is a protected font product like any other commercial font. </p>
      <p>So, I can put your minds at rest. The DSMJ is fully within their rights to announce this free download. As a user you may use the fonts in your work as you wish, as long as you follow the EULA.</p>
      <p>Bruno Maag<br>
      Dalton Maag Ltd</p>
