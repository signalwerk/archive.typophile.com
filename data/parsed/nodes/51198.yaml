    html: |-
      <p>Thank you all for your comments. I am pretty chuffed with the design myself.</p>
      <p>Yes, hinting: the font has been autohinted but that, of course, won't do the trick if good display is required. If we get some spare time and don't know what to do with our hands, we'll do some hard core VTT hinting on it.</p>
      <p>Theunis, the font naming convention is intentional. This allows us the same naming for all applications, be they graphic or office. It also means that if a doc is created in one app, the doc can be opened, imported or whatever, in another wihtout losing the font name formatting. And since we're sticking with the 4-style font family it works fine in older versions of Win and Unix, too.</p>
      <p>I realise that this may be a bit tedious for graphics users where you'd expect to see all styles in one font family. But it is a small price to pay for all round compatibility.</p>
      <p>It is our policy to give all glyphs a Unicode value. I realise that a number of these are then put on private area. Not everyone may agree with this policy but I believe it is important to give access to these glyphs also to people who have no OT feature access, such as Word. And since it's Unicode, the glyphs can also be accessed using database driven copy, as long as the Unicodes are stringed correctly.</p>
      <p>And then the question re TTF: it is our policy to produce TTF based OpenType fonts since we are confident that they work pretty reliably in a wide variety of environments. We create CFF based OT fonts only on demand.</p>
      <p>Bruno Maag<br>
      Dalton Maag</p>
