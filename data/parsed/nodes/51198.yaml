      <p>Theunis, hinting is always a nice thing to have. Unfortunately, the commercial reality is that is barely affordable to do for a foundry. It takes about six working days for a plain Latin font to be hinted to a good quality. If you add the S/C you'll increase that easily to eight days. No one is ever going to pay the premium for this in a retail product. The difference between a hinted v. unhinted font would be around £15 per font.</p>
      <p>Yes, please do send me a PDF of the work. I would like to see it.</p>
      <p>Re AGL1.2 and PUA - it appears that we haven't updated our encoding vectors. I am all for standards. We'll create future fonts to follow the AGL standard. But as explained above we had good reason for applying PUAs to the S/c.</p>
      <p>Bruno</p>
