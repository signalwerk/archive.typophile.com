    <p>Sponsored by Danish publishing company Aller (hence the name) and designed as part of the Danish School of Media and Journalisms new CI.<br>
    I art directed and the good people of Dalton Maag, London (Bruno Maag, Marc Weyman and Ron Carpenter) designed and produced. Apart from being the corporate font for our new CI, the fonts are for free download at <a class="freelinking external" href="http://www.dmjx.dk/presserum/skrift.html" rel="nofollow">http://www.dmjx.dk/presserum/skrift.html</a>.<br>
    Henrik Birkvig</p>
