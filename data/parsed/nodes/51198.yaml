      <p>Ok, two answers:<br>
      A download does not count as a license. The license talks of installation of 25 workstations. That means if you have the fonts installed on 75 workstations you are in defiance of the EULA, whether you downloaded the fonts once or a 100 times.</p>
      <p>This is the typical Fontbook bug. It's been around for blimmin' ages and Apple (the lifestyle company) have done nothing to remedy it. This error occurs when TTF fonts are loaded with a missing 'fpgm' table. This table is necessary for hinted fonts but in unhinted fonts it has no effect whatsoever. You can safely ignore this warning. We ought to issue an update I guess.</p>
      <p>You can only link for font styles together. The fonts are engineered so that the Bold can be accessed via the 'B' button in Office apps. That necessitates that the Light has to be separated into its own font family. The way the fonts are engineered at present give the most thorough formatting compatibility, accross platforms and documents possible.</p>
      <p>Bruno Maag<br>
      Dalton Maag Ltd</p>
