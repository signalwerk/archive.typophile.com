      <p>Adobe's document <em>Unicode and Glyph Names</em>, <a href="http://www.adobe.com/devnet/opentype/archives/glyph.html#4" target="_blank" rel="nofollow">section 4</a>, should answer the question. Also see, same document, the entire <a href="http://www.adobe.com/devnet/opentype/archives/glyph.html#6" target="_blank" rel="nofollow">section 6</a>, especially this part (quote):<br>
      <cite>The exceptions are the AGLv1.2 names which are associated with Unicode Private Use Area (PUA) values. These include all the superiors and small cap names. Use of these names will, for the purpose of searching text, lead some current implementations to map names like "Asmall" to the PUA Unicode value from AGL v1.2, rather than to the Unicode value for "A". We now recommend naming these glyphs according to the rules below.</cite><br>
      Better only study Adobe's latest fonts like Arno Pro.</p>
      <p>[Edit: Not meant as a comment about Aller Sans, only addressing Claudio's question. Point is, whether you use Adobe's earlier PUA codepoints or not, you should have a good reason for your decision.]</p>
