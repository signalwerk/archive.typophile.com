      <p><em>It’s not that different to fonts being distributed with Windows.</em></p>
      <p>If a foundry makes free fonts available for one platform, that can lead to corporate sales for the other, and I've heard the theory that this accounts for a lot of the sales of the old sans faces such as Helvetica. Not sure how well that model would continue to work in the OpenType era.</p>
      <p>My philosophy of font marketing (and digital ethics) changed considerably when I read Chris Anderson's essay on "Free" in Wired, although I haven't got around to incorporating my new attitude into any marketing plans yet.</p>
