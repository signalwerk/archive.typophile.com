    <p>Prored is an avantgarde sans serif typeface that contains 5 weights – Light, Regular, Bold, ExtraBold and Black.</p>
    <p>It is small and compact font family with own characteristic expression, constructed to be safe choice for all kinds of typographic tasks.</p>
    <p>With specific curved endings that are adhered on baseline, Prored includes tiny note of singularity – just enough to make it’s own identity recognizable and catchy. </p>
    <p>Taller x-height gives an afterimage of a bit narrowed look, but with rational proportions and well balanced weights, 5 of them are really sufficient and capable to handle extreme typographic issues. Especially charming is Black which can be used also as display typeface in situations where elegant solutions are required in combination with stronger visibility.</p>
    <p>Beside Central Europe, Prored also contains glyphs for Turkish and Baltic languages.</p>
    <p>Highly neutral impression recommends Prored as an excellent choice for branding campaigns or new identities.</p>
    <p>Designed by Slobodan Jelesijevic, 2012.</p>
    <p>Recommended for use in:<br>
    branding campaigns, identities, editorial publications, packages, web design, as web font and many more.</p>
