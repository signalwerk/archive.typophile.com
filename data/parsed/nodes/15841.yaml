    <p>I’m working on an identity package for my full-time employer that requires something more than online business card factories can provide. I’m also getting fed up with some of the copy shops we use for a lot of our other materials who either assume I don’t know what I’m talking about, don’t pay attention to the quality, or don’t have the capabilities I need.</p>
    <p>I’m looking for a printer that can take direction but also offer it, and can do solid offset printing for a reasonable price. I’m not looking to do anything crazy or unusual, but I’m specing stock and inks, etc. and want a conscientious printer. Any other capabilities (Indigo, low-run color copy, etc.) are a bonus.</p>
    <p>I know almost nothing about printers in the NYC area and any help/advice would be great. Even a resource for or list of decent printers would be great, as there are so many to wade through and I can’t afford for this project to come out half-baked. Many thanks in advance.</p>
