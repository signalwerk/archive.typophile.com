    html: <p>Chris the problem with printers in NYC is they aren’t printers, they are print brokers. You need to find a print broker that you trust and your print jobs will be handled in places as close as 26th Street Manhattan and an hours drive in New Jersey and even a flight to Atlanta. Your print broker will have enough contacts to keep the quality and the cost in line for your job. Altag Press was a print broker I used for years, but I’ve used others and got good results.</p>
