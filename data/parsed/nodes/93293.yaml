      <p>Corporate identity developped by <a class="freelinking external" href="http://www.esmog.org" rel="nofollow">Elektrosmog</a> for Kunsthaus Glarus.<br>
      Remembering an <a class="freelinking external" href="http://ww.typophile.com/node/80181" rel="nofollow">older discussion</a>, an alphabet in the 30's made by Walter Cyliax.<br>
      Some similars: <a class="freelinking external" href="http://www.myfonts.com/fonts/parachute/pf-din-mono/" rel="nofollow">DIN Mono</a>, <a class="freelinking external" href="http://lineto.com/The+Fonts/Font+Categories/Headline+Fonts/Lutz+Headline/" rel="nofollow">Lutz Headline</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/device/korolev/" rel="nofollow">Korolev</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/typeotones/wilma/" rel="nofollow">Wilma Base</a>, <a class="freelinking external" href="http://johannesbreyer.com/" rel="nofollow">JB Heureka</a> (very close), <a class="freelinking external" href="http://www.carvalho-bernau.com/jlg/" rel="nofollow">Jean-Luc Godard</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/dizajndesign/dezen-pro/" rel="nofollow">Dezen</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/larabie/monofonto/" rel="nofollow">Monofonto</a>, <a class="freelinking external" href="http://www.colophon-foundry.org/fonts/pdu/regular" rel="nofollow">PDU</a> (by <a class="freelinking external" href="http://www.drieswiewauters.eu/type/project_09/" rel="nofollow">Dries Wiewauters</a>, also very close using some alternates), <a class="freelinking external" href="http://www.dafont.com/sugo.font" rel="nofollow">Sugo</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/alien/tes/" rel="nofollow">Tes</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/urw/engschrift/" rel="nofollow">DIN Engschrift</a>, <a class="freelinking external" href="http://www.t-wo.it/wp-content/uploads/2011/11/T-W-O_Vwk_Spec.pdf" rel="nofollow">Vwk</a> by <a class="freelinking external" href="http://www.t-wo.it/" rel="nofollow">Think Work Observe</a></p>
