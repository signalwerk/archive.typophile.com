    html: <p>Colin,  <br> <br>Are you looking for the small sans serif font at the bottom, or the large white all-caps font? I say this just to get the ball rolling, because I looked for the smaller one yesterday when I first saw the post. I used my <a href="http://bowfinprintworks.com/SansIDPage.html" target="_blank"> Sans Serif Font ID Guide</a> using the assumption that the bar of the 'e' is horizontal, and couldn't find it. I will try again with the assumption that the bar is not horizontal, and see if I see anything. The 'W' is the most distinctive feature and the curved 'l' and round-bowl 'y' are also good 'field-marks' for ID purposes.</p>
    html_clean: <p>Colin,  <br> <br>Are you looking for the small sans serif font at the bottom, or the large white all-caps font? I say this just to get the ball rolling, because I looked for the smaller one yesterday when I first saw the post. I used my <a href="http://bowfinprintworks.com/SansIDPage.html" target="_blank" class="link-external"> Sans Serif Font ID Guide</a> using the assumption that the bar of the 'e' is horizontal, and couldn't find it. I will try again with the assumption that the bar is not horizontal, and see if I see anything. The 'W' is the most distinctive feature and the curved 'l' and round-bowl 'y' are also good 'field-marks' for ID purposes.</p>
