    html: <p>I just looked in the Sans ID Guide for something with a sloped 'e'-bar and found nothing that comes closer than Font Bureau's "Berlin Sans", and I know it's not identical. This is a sans font I haven't catalogued yet, so it makes me think it's either very new, or from a small foundry.  I know I have a long way to go yet for the sort of comprehensiveness I want in that Guide, but with about 700 sans families catalogued, it should be a significant part of the commercial fonts you might expect to see.</p>
