    <div class="info">Submitted by <a href="/user/7006" title="View user profile.">paul d hunt</a> : 29.Mar.2007 1.18pm </div>
      <p>Fontlab Ltd.<br>
    Special Announcement for Customers<br>
    Dear paul,<br>
       Version 3 of TypeTool is out! If you need a good basic font editor for TrueType, OpenType and Type 1 fonts this one is for you. With TypeTool 3 you can not only add and edit characters in your fonts, but you can also change font names, styles, metrics, kerning and a host of other “inside information” that controls how your fonts look and work. And the price is still only US$99.</p>
    <p>   New in version 3 are some very helpful features:</p>
    <p>    * Mask layer editing - now you can edit the mask as well as the outline<br>
        * Bitmap backgrounds - import a bitmap file to use as a template<br>
        * Unicode 5.0 support - new Unicode glyph template images (from Monotype Imaging)<br>
        * OpenType font import and export<br>
        * Metrics and Kerning Editing<br>
        * and many more enhancements</p>
    <p></p><div class="imageWrap"><img src="/files/typetool3pdh032907_4632.png"></div><p></p>
    <p>Get Typetool 3 now!<br>
    If you’re a TypeTool 1 or 2 user you can upgrade to TT3 for  only US$39.95. Just browse to our upgrade page:<br>
    <a href="http://www.fontlab.com/Support/FontLab-Updates-and-Upgrades/" title="www.fontlab.com/Support/FontLab-Updates-and-Upgrades/">www.fontlab.com/Support/FontLab-Updates-and-Upgrades/</a></p>
    <p>If you’re new to font editors TypeTool is the perfect place to start. You can see complete details at:<br>
    <a href="http://www.fontlab.com/FontEditors/TypeTool/" title="www.fontlab.com/FontEditors/TypeTool/">www.fontlab.com/FontEditors/TypeTool/</a></p>
    <p>Our Price: US$99<br>
    Upgrade Price: US$39.95</p>
    <p>Don’t miss Typotechnica!</p>
    <p>The year’s premier font technology conference is happening in just a few weeks in Frankfurt, Germany. Join typography specialists from all over the world and learn about the latest new developments in digital type technology. Browse to <a href="http://www.linotype.com/3194/typotechnica2007.html" title="www.linotype.com/3194/typotechnica2007.html">www.linotype.com/3194/typotechnica2007.html</a> for details.</p>
    <p>Sincerely,</p>
    <p>Fontlab Ltd.</p>
