  html: |-
    <p>I found this via Gerhard Helzel's site.</p>
    <p><a class="freelinking external" href="http://www.oeaw.ac.at/kvk/cte/" rel="nofollow">Classical Text Editor</a> is apparently a well-established and long-maintained Windows program that recently added OpenType support, despite the fact that it's written in... Delphi?!?!! I'm impressed!</p>
    <p><a href="http://www.oeaw.ac.at/kvk/cte/" title="http://www.oeaw.ac.at/kvk/cte/">http://www.oeaw.ac.at/kvk/cte/</a></p>
    <p>I am trying it now and having trouble getting the OpenType features to work, but I'm also using the Windows 7 beta. Let me know if you can control the features. To switch the rendering engine to OpenType, go to Format menu -&gt; Document item -&gt; Font tab, and switch the engine to OpenType. Then you will see OpenType feature checkboxes in the Format -&gt; Font dialog.</p>
    <p>I recommend Vista for this. You can supposedly get to it in XP if you transplant the Vista version of Uniscribe, which is tedious yet possible.</p>
