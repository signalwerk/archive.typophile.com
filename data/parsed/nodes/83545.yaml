    <p>I am interested if any of you can think of any logos or type treatments of extremely long company names- I am working on one company name which is Private Equity Hedge Fund company and it should look more like Corporate style with Extreme Aesthetic design (this is what i got from the CEO of the firm</p>
    <p>Name is:</p>
    <p>ALEXANDER HAWTHORN-SALMAN ANSARI &amp; CO</p>
    <p>it could be AHSA but they insist that with AHSA they want to mention full name as well.</p>
    <p>So please help me guys.</p>
