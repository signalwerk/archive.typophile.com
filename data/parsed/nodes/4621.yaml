    html: <p>I think the name is interesting enough. I used the shortened version of University from German and made it ooni for a project.  <br> <br>The issue comes with the umlaut at the end. Though I am not from Germany I do speak the language and it looks like a improper use for no purpose at all. You say it would say phontically "farbay" Even using the umlaut on the last a it would never phonetically say 'ay'. <br> <br>It like the issue that people have with Haagen Dazs. Sort of evocative, completely incorrect in grammatic acknowledgement and cultural relvevance(the dutch use double vowel 'aa' and such but the Germans do not), but is a fairly strong brand once you get past the semantics. <br> <br>In english and in german it would be 'far-bah'. I think the name is unique enough that it can use the original and implied pronounciaton better than just 'jazzin' it up. <br> <br>As for the colors I would find two colors that share similar hues.  Brown and darkening yellow. Orange and brown. Or go in a completely opposite direction if you so choose. It has got be true to form or a polar opposite. Depending on how you are interpreting the mood, location, price and products offered, etc.</p>
