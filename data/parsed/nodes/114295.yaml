      <p>Regarding composites, you may want to read the section of the FontLab manual on composites, and the use of the "generate glyph" (Cmd/Ctrl - G) command. Basically, do Generate Glyph and type, say "a+acute=aacute" and you will get an aacute created as a composite referencing those two base glyphs. If you go in and try to edit the aacute you will see that these are references to the original glyphs, not editable outlines themselves. This way, changes to either component will affect the composite. Pretty nearly all your accented characters should use glyphs constructed this way.</p>
      <p>The glyphs generated when you click on an empty cell are created based on recipes in the "alias.dat" file. This is an editable plain text file used by FontLab (although I'd be careful to back it up before hacking it).</p>
      <p>T</p>
