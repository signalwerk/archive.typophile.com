    html: |-
      <p>Where to start?</p>
      <p>It might be easier, if you are on deadline, to send your fonts so someone who can make the OpenType fearures work (and no, I don't do that work.) Many of the larger font publishers work this way, Adobe, FontFont, etc. You don't think Slimbach writes all the features for his fonts, do you?</p>
      <p>* * *</p>
      <p>I say they are not contextual because you have not included the context as a part of the substitution statement. OpenType features code is pretty simple in the sense that everything happens "right now." The items to be included in the substitution must be given in their entirety in the statement, as they exist "right now" -- as the instruction is processed.  </p>
      <p>And the order matters. So, if you have liga before clig, much of the "ligaturing" you're attempting in clig won't happen, because there will be no longer be any f i, f f i, etc. And if you put clig first, then what's available for liga to work on will be affected, of course.</p>
      <p>If you're working entirely in FontLab -- I suppose you know you can write off the features file, then alter it in a text editor, then read it back in to FL. I'd recommend that. I, anyway, also make sure all my classes are in that .fea file, then delete the "classses" from the FontLab vfb. This way, I have one file where everything is contained, and if I make a change to either an OT feature or class, when I bring the fie back into FontLab, I don't create an unintended conflict.</p>
      <p>How I'd start if I had to work on your font, starting now. </p>
      <p>1. Make a copy  of the FoltLab .vfb, and work on that. Don't risk you original files.</p>
      <p>2. Write off all the features (making sure the classes are contained) to a plain text  .fea file. Clear the features and clases from FontLab; all you now have are the glyphs. See if you can generate a font. That's the starting point.</p>
      <p>3. Now add one thing at a time -- make up a small, test, ".fea" file. One feature only. Make sure any feature you put in it has all the classes it needs -- i.e., pair the classes in "test" to the features in "test.</p>
      <p>4. Read the "test.fea" back into Fontlab.  At first anyway, both compile the features and generate a font to test that all is well. </p>
      <p>5. Keep adding things one at a time. You will soon discover what's not working.</p>
