    html: |-
      <p>Probably Mark Simonson is onto something, whether you can spot it or not.</p>
      <p>By the way, your clig statements are all messed up. First of all, as Mark says, they're not contextual, as written. Secondly, remember that instructions are performed in the order they're given. So with the order you have:</p>
      <p>sub f f by f_f;<br>
      sub f i by f_i;<br>
      sub f f i by f_f_i;</p>
      <p>the string "f f i" will never be found, because you've already changed part of that string, "f f" (i.e., a portion the string  "f f i") to f_f.</p>
      <p>Etc.</p>
      <p>You have to do it the other way, with the f f i  statement first.</p>
      <p>Here's a portion of the clig description (emphasis added)</p>
      <blockquote><p> Example: The glyph for ft replaces the sequence f t in Bickham Script, <strong>except</strong> when preceded by an ascending letter.</p></blockquote>
      <blockquote><p> Recommended implementation: The clig table maps sequences of glyphs to corresponding ligatures in a chained context (GSUB lookup type 8). <strong>Ligatures with more components must be stored ahead of those with fewer components in order to be found.</strong> The set of contextual ligatures will vary by design and script.</p></blockquote>
      <p>I'd remark that the usual way to debug a long list of statements is to cut things in half, and try each half. Keep cutting until things compile without errors. If you're lucky, you'll spot it. Safest is to just add one more statement at a time. And if the rest of your code is as scrambled as clig, I'd just start with one statement, get it to compile, then add each, one at a time. </p>
      <p>Long ago &amp; far away, I had to do logical proofs -- passed my PhD prelims in math logic. When I used the techniques learned there in trying to debug even little programs, my business partner -- a proper engineer -- finally convinced me of the error of my ways. He succeeded in large part because I kept failing, trying to be "logical..."</p>
