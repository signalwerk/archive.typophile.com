    html: |-
      <p>Without seeing your files, who can say what's wrong. Clean out your bank account &amp; hire Jens Kutilek, he can fix them, I'm sure.</p>
      <p>As for "contextual," try this.</p>
      <p>You have an italic font. You want to be able to set the sequence "iogonek f i." If like most italic fonts, the swoop on the bottom left of the "f" will collide with the ogonek on the first i. What to do? Make up a special f with no swoop on the bottom -- kind of like a Sabon italic f.</p>
      <p>You swap it in with a contextual alternate</p>
      <p>sub iogonek f' by f.alt;</p>
      <p>but what about the i, and all the ligatures with the f?</p>
      <p>Well, if liga is above calt in the features file, all those will be missed. And if it's below, with the sequence "iogonek f i" you'll get the special f followed by a regular i, and those will collide.</p>
      <p>So, you need make up extra ligatures used in "context," but they're in the calt feature, not clig.</p>
      <p>Within calt:</p>
      <p>sub iogonek f' by f.alt;<br>
      sub iogonek f_f_i' by f_f_i.alt;<br>
      sub iogonek f'_i' by f_i.alt;<br>
      sub iogonek f_f' by f_f.alt;</p>
      <p>That assumes liga is before calt. If calt is first, you have to figure our what's what when the program sees liga, namely (I think)</p>
      <p>sub f f i by f_f_i;<br>
      sub f.alt f i by f_f_i.alt;<br>
      etc.</p>
      <p>There might be a way to do this with clig, but it ain't what you've written. Moreover, you need "calt" in the example above, as there in one instance where no ligature is involved -- namely, "iogonek f".</p>
      <p>It's rumored that Bingham Script uses clig, but I don't have that at home to take a peek...</p>
