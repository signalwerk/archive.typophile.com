    html: |-
      <p>Try putting this in the OT Panel at the bottom right:</p>
      <p>languagesystem DFLT dflt;<br>
      languagesystem latn dflt;</p>
      <p>I would also remove the statements referring to Greek and Romanian since they don't seem to be doing anything and/or don't make sense. (There are no Greek characters affected, and nothing following the Romanian statement. I can only see statements affecting Latin characters.)</p>
      <p>Also, clig is for contextual ligatures and all of these are simple substations, not contextual. So, change the feature to liga, instead of clig.</p>
    html_clean: |-
      <p>Try putting this in the OT Panel at the bottom right:</p>
      <p>languagesystem DFLT dflt;<br>
      languagesystem latn dflt;</p>
      <p>I would also remove the statements referring to Greek and Romanian since they don't seem to be doing anything and/or don't make sense. (There are no Greek characters affected, and nothing following the Romanian statement. I can only see statements affecting Latin characters.)</p>
      <p>Also, clig is for contextual ligatures and all of these are simple substations, not contextual. So, change the feature to liga, instead of clig.</p>
