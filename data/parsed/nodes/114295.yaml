      <p>" I was also wondering, when I change diacritics, some don't update to the letters and when I change the a plain letter, not all instances of that letter with diacritics are updated. I assume this is an issue with the classes?"</p>
      <p>Are all your accented glyphs created by means of composites? That's the key thing. If some of them have the base letter or the accent or both decomposed, that could cause the problem.</p>
      <p>"Is there a way to simply copy the default and oldstyle sets and make them tabular automatically?"</p>
      <p>Not currently built into FontLab Studio. The Remix Tools (a paid add-on for FontLab) have this feature. <a href="http://remix-tools.com/monospacer" title="http://remix-tools.com/monospacer">http://remix-tools.com/monospacer</a><br>
      But probably only worth buying the Remix tools if you find their other features valuable, just doing tabular numbers is a nice but minor feature.</p>
      <p>"Or should I first create the tabular sets, copy those and modify the spacing for the proportional sets?"</p>
      <p>Sure, or the other way around. Keep the glyphs as composites so that any change in the design of the base glyphs affects the other set as well. Also, in some typefaces, you might want to make the proportional and tabular "one" different designs.</p>
