    <p>Hello, I'm working on a custom typeface for a Dutch design company and I just came across some problems I have no idea how to fix. Here's a part of the error messages I get:<br>
    [WARNING]  Use of DFLT tag has been deprecated. It will work, but please use 'dflt' instead. [C:/Users/Martin/Documents/FontLab/Studio5/fontlab.fea 48]<br>
    [ERROR]  If you don't want feature 'cpsp' registered under all the language systems you specified earlier on in the feature file by the "languagesystem" keyword, you must start this feature with an explicit "script" statement [C:/Users/Martin/Documents/FontLab/Studio5/fontlab.fea 84]<br>
    [ERROR]  If you don't want feature 'cpsp' registered under all the language systems you specified earlier on in the feature file by the "languagesystem" keyword, you must start this feature with an explicit "script" statement [C:/Users/Martin/Documents/FontLab/Studio5/fontlab.fea 86]<br>
    [ERROR]  If you don't want feature 'cpsp' registered under all the language systems you specified earlier on in the feature file by the "languagesystem" keyword, you must start this feature with an explicit "script" statement [C:/Users/Martin/Documents/FontLab/Studio5/fontlab.fea 88]<br>
    ...<br>
    etcetera.</p>
    <p>[FATAL]  aborting because of errors</p>
    <p>So, what's going on here, how do I fix it and what's it trying to abort anyway? I'm able to generate a TT font, which features pixelated edges compared to an older version of the font I was able to generate in OTF format. I'm assuming the fact I can't generate OTF right now has to do with the errors. I have to have 2 fonts of the typeface finished by the end of the week so it's really appreciated if you can help me out with this. Can someone also tell me what I'm doing by specifying Greek, Latin and Romanian in the script? I assumed I need to specify Romanian to replace some accented characters, but I don't need Greek. I'm working on full language support for Latin.</p>
    <p>Here's an example of the script I'm working with:</p>
    <p>feature clig {<br>
