      <p>A contextual ligature goes like this: If these glyphs are preceded/followed by certain other glyphs (or glyph), substitute with this ligature glyph. </p>
      <p>A normal ligature goes like this: substitute these glyphs with this ligature glyph.</p>
      <p>Every one of your "contextual" ligatures is just a normal non-contextual ligature, which should be placed in the liga feature. For what it's worth, contextual ligatures are rare in fonts, mostly used when you are trying to simulate very complex scripts.</p>
      <p>Regarding tabular figures, basically you need to make copies of your existing figures and modify them.</p>
