      <p>Well, with FontLab, you never have to "copy" the accent. If you are in an active character window, use the sequence "alt" + "insert" (i.e, hold down the "alt" key whilst hitting "insert" -- at least, that is the sequence with Windows), to bring in any component glyph -- by name, Unicode number, or anything else on a long list of options displayed. Move it around the way you move any component around.</p>
      <p>Actually, you can bring in the base character that way, too. Just double click on a grayed-out cell, open it, select the base glyph with alt + insert (or Mac equivalent), and that will be the character the widths &amp; sidebearings have. Same sequence again for any number of "accents." All these will be components -- unless you eventually decompose, which isn't recommended save for glyphs where the components overlap.</p>
      <p>When all the artwork is in place, make sure both the *name* and *Unicode* assignments are proper...</p>
      <p>May I gently suggest that part of your troubles is perhaps because you *don't* know how it should work?</p>
