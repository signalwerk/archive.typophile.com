    html: |-
      <p>In fact FontFont IS embedding-friendly for apps, documents, and even devices.</p>
      <p>§ 2.2 of <a href="http://www.fontshop.com/help/licenses/fontfont/" rel="nofollow">FF’s EULA</a> requires a <strong>subsetted font</strong> used in a <strong>secure format</strong> for permitted <strong>non-editable embedding</strong>. As Sii already mentioned, no format is absolutely secure, but as a foundry you have to define your understanding of security. So ‘secure’ means here: encrypted which may be related to the font file and/or the document containing the embedded font file. Formats with encryption/protection of the whole document are allowed as the fonts are protected within the document. Flash is such a format.</p>
    html_clean: |-
