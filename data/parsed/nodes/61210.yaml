      <p>Thanks Ivo,</p>
      <p>It would seem that with a single user license one could ship a subsetted version of a FF font with say an XBox game (considered secure) to display UI elements, dialogs etc., providing it's not used in input fields. Does that sound right? </p>
      <p>Although app and device friendly - the editable/print preview distinction is still a little document-centric.  </p>
      <p>Perhaps in a device/app world it's better to talk about static vs dynamic content, rather than editable/print-preview. </p>
      <p>Having said that I really like my interpretation of the EULA and if that matches your intentions I'll be pointing our game and device developers over to the FF library immediately. :-)</p>
