      <p>Apart from the obvious fact that no format is secure, FontFont Eula seems to be embedding-friendly for apps as well as docs... </p>
      <p><a href="http://www.fontshop.com/help/licenses/fontfont/" title="http://www.fontshop.com/help/licenses/fontfont/">http://www.fontshop.com/help/licenses/fontfont/</a> </p>
      <p>2.2. Embedding. You may embed the Font Software in documents, applications or devices either as a rasterized representation of the Font Software (e. g., a GIF or JPEG) or as a subset of the Font Software as long as the document, application or device is distributed in a secure format that permits only the viewing and printing but not the editing of the text. You need an additional licence from FSI or its Distributors (i) for the use of the Font Software in documents, applications or devices permitting editing of the text, if such documents, applications or devices shall be distributed to third parties or (ii) if the Font Software is embedded neither as a subset nor as a rasterized representation.</p>
      <p>Also a knock-off of FF DIN is kind of like saying a knock off of Courier New. The underlying design is derived from public domain model, no?</p>
