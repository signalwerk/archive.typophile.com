  html: <p>Client has told us one of their departments doesn't like the sans (too hard to read apparently) and they want a serif added to their ID guidelines. <br> <br>Slab/semi/full serif suggestions welcome. I've had a dig around Adrian Frutiger's other designs (seemed a logical place to start) and Versailles 55 is my favourite thus far - it's a fraction lighter, but the shapes seem very much on par. <br> <br>Any thoughts anybody? <br> <br>Cameron</p>
  html_clean: <p>Client has told us one of their departments doesn't like the sans (too hard to read apparently) and they want a serif added to their ID guidelines. <br> <br>Slab/semi/full serif suggestions welcome. I've had a dig around Adrian Frutiger's other designs (seemed a logical place to start) and Versailles 55 is my favourite thus far - it's a fraction lighter, but the shapes seem very much on par. <br> <br>Any thoughts anybody? <br> <br>Cameron</p>
