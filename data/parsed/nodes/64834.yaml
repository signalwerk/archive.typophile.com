    html: |-
      <p>Hey Zahra.</p>
      <p>I think this entry isn't getting any action because: it's in your blog, as opposed to being a thread, which makes people more tentative to comment; and the title is mundane - try putting "Arabic/Farsi" in there - they'll all come out of the woodwork!  :-) But also, show "tavangar" in a normal Farsi text font alongside, so non-readers can be guided a bit.</p>
      <p>Anyway.</p>
      <p>There might be too much variance in there - it could benefit by some simplification of form, without making it too dry however. See this: <a href="http://www.flickr.com/photos/shch_andrey/4153699318" title="http://www.flickr.com/photos/shch_andrey/4153699318">http://www.flickr.com/photos/shch_andrey/4153699318</a></p>
      <p>BTW, you want a real challenge? Try to get it to <em>also</em> say "Tavangar" in Latin, left-to-right!  :-)  I'm actually seeing a "T" and a "g" in roughly the right spots already...</p>
      <p>hhp</p>
