    <p>Here is a little experiment I carried out and created this in Illustrator. The inspiration came from another logo I found in the ultimate logo bible "tres logos". I am very happy with it but am not sure it could function as the final product and has more space for improvement. What do you think?<br>
    Note: this is written in arabic and is read from right to left</p>
