  html: "<p>ANNOUNCING: <br>Cholla Font Release <br>Mrs Eaves OpenType Font Release <br>ATypI: The Shape of Language <br> <br>-------------------------------------------------------------- <br>Cholla Font Release: <br>Additional weights and styles to compliment the original <br>Cholla fonts. <br> <br>Cholla Italics $95 (Thin &amp; Bold Italic, Thin &amp; Bold Oblique) <br>Cholla Wides $95 (Wide Italic, Wide Bold, Wide Bold Italic, <br>Wide Ultra Bold &amp; Wide Ultra Bold OldStyle) <br> <br>Original Cholla font release: <br>Cholla Sans: $95 (Thin, Regular, Italic &amp; Bold) <br>Cholla Slab: $95 (Thin, Regular, Italic &amp; Bold) <br>Cholla Wide/Unicase: $95 (Wide, Wide Small Caps &amp; Unicase) <br> <br>Cholla Family Volume: $299 (All Cholla fonts.) <br> <br>For more information, check out: <br><a href=\"http://www.emigre.com/EFoICho.html\" target=\"_top\">http://www.emigre.com/EFoICho.html</a> <br> <br>The Cholla typeface family was designed by Sibylle Hagmann in <br>1998-99 and named after a species of cactus she encountered <br>in the Mojave Desert. Cholla was originally developed for the <br>Art Center College of design in Pasadena, California. There, <br>art director Denise Gonzales Crisp and associate designer, <br>Carla Figueroa, collaborated with Hagmann to create a series <br>of fonts that would offer a great deal of variation. <br> <br>-------------------------------------------------------------- <br>Mrs Eaves OpenType <br> <br>Mrs Eaves is the first Emigre font to be released in OpenType <br>format. This format makes it possible to incorporate <br>typographic features, such as small caps, ligatures, old style <br>numerals and lining numerals, all within one font file, thereby <br>simplifying font management and usage. The Mrs Eaves OpenType <br>package contains the equivalent of over 17 fonts. It includes <br>everything in the Regular package, the Smart Ligatures package <br>and more! <br> <br>Mrs Eaves OpenType Roman Italic and Bold: $299 <br> <br>Upgrades: Registered customers who have purchased both the <br>Mrs Eaves Package and the Mrs Eaves Smart Ligatures Package <br>may upgrade to the OpenType Package for $149. <br> <br>For more information, check out: <br><a href=\"http://www.emigre.com/EFoIMrsOT.html\" target=\"_top\">http://www.emigre.com/EFoIMrsOT.html</a> <br> <br>-------------------------------------------------------------- <br>ATypI: The Shape of Language <br> <br>ATypI's Rome conference, September 19 - 22, 2002, will be the <br>biggest gathering of the type and typographic world in a <br>decade, where you will enjoy the treasures of one of the world's <br>greatest cities. <br> <br>\"The Shape of Language\" embraces the following themes: <br>International Issues Forum (problems and solutions); Italian <br>Design Forum (current &amp; retrospective); Historical Perspectives <br>(back and ahead). Conference registration is now open; take <br>advantage of early booking discounts until May 30, 2002. <br> <br>ATypI is the only independent worldwide organisation dedicated <br>to type and typography. ATypI's membership, from more than 40 <br>countries, is truly international and includes the best known <br>and most talented designers whose friendship you are assured. <br> <br>Details from <a href=\"mailto:atypi@sharonirving.co.uk\">atypi@sharonirving.co.uk</a> or <br><a href=\"http://www.atypi.org/rome2002\" target=\"_top\">http://www.atypi.org/rome2002</a>. <br>-------------------------------------------------------------- <br>To order any items announced in this email, go to: <br><a href=\"http://www.emigre.com\" target=\"_top\">http://www.emigre.com</a> <br>(Please do not send orders to the auto reply address.) <br>To order via fax; print out the fax form from: <br><a href=\"http://www.emigre.com/EFax.html\" target=\"_top\">http://www.emigre.com/EFax.html</a> <br>  <br>-------------------------------------------------------------- <br><a href=\"mailto:sales@emigre.com\">sales@emigre.com</a> <br> <br>Emigre Inc <br>4475 D St <br>Sacramento CA 95819 <br>800-944-9021  <br>916-451-4344 <br>916-451-4351 fax</p>"
