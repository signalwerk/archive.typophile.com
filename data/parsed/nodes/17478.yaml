    html: |-
      <p>Just for argument's sake, here's three bulletted list paragraphs.</p>
      <p>In the first and second paragraphs, the bullet is separated from the following text by a tab. In the third paragraph, the bullet is separated from the following text by a wordspace.</p>
      <p>In the first paragraph, the hanging indent is accomplished by a paragraph indent and a first-line outdent. In the second and third paragraphs, the hang is accomplished with an indent-to-here character before the first character of Text.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/3bulls1.gif"></div><p></p>
      <p>Obviously, the tab gives you more control over the amount of space between bullet and text. And at this point, you've made the compositors' job very simple—all they have to do is put a tab between the bullet and the text, and they don't have to worry about any finnicky hidden characters. Unfortunately, look what happens when some nutcase gets ahold of it and starts using text wrapping:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/3bulls2.gif"></div><p></p>
      <p>You'll notice the space+indent-to-here character combo maintains its formatting quite nicely, while the tabs and indents get demolished.</p>
