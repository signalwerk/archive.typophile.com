    <p>Hello,</p>
    <p>I recently started working as a typesetter on study guides for insurance exams. I am working mostly with pre-set styles, but there is a lot of tweaking needed to make the formatting right.</p>
    <p>One of the problems I am having is with bulleted lists.  There is already a style set up for the right bulleted list.</p>
    <p>However, in these bulleted lists are also sub lists with en dashes.  I cannot make the rest of the paragraph indent properly.</p>
    <p>example:</p>
    <p>o Item one<br>
    o Item two<br>
      - for example the second line<br>
      does not line up with the 1st line indent.</p>
    <p>o Item one<br>
      - Does anyone know how to make the<br>
        rest of the paragraph indent.</p>
    <p>Also if there is a way to set a style for these en dash - sub-points please let me know.</p>
    <p>If anyone knows any good resources especially to do with hanging indents, setting tabs, and lists in Indesign CS I would be grateful.</p>
