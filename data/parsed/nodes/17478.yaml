    html: |-
      <p>Here's a quick-and-dirty way to line up the second line:</p>
      <p>Place your text insertion point after the space (after the bullet) and do command-\ (Mac). Note: The subsequent lines must be part of the same paragraph, so if you force a line break, be sure it is a soft line break (shift-return).</p>
      <p>The same thing works in Quark--Adobe copied it from them.</p>
      <p>There is probably a way to make this part of a style sheet, but I'm not sure off the top of my head.</p>
