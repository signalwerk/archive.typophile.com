    html: |-
      <p>I thought the standard technique was to set up your styles:</p>
      <p>1st level bullet:<br>
      Left indent 5mm<br>
      First line indent -5mm</p>
      <p>2nd level bullet:<br>
      Left indent 10mm<br>
      First line indent -5mm</p>
      <p>Then start each bulleted item with the bullet character followed by a tab character which will automatically indent to the value of your left indent. You don't need to set tab positions in the styles.</p>
      <p>AFAIK this works in Quark, Indesign, Word</p>
