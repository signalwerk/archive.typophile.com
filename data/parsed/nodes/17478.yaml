    html: |-
      <p>The main advantage of that way (over the "Indent to Here" method) is that it gives you better control over the space between the bullet and the text. It's smarter but takes a bit more work. I find I use the "Indent to Here" more frequently because it's so simple to do.</p>
      <p>(I just remembered that Quark was not the first to use this idea. A Compugraphic typesetting machine I worked with in the early eighties had a feature that functioned the same way. There was a special character code that could be inserted in a line. Subsequent lines would indent to that spot.)</p>
