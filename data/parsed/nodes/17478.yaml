    html: |-
      <p>For future reference, to make this part of a style, in nested styles you can choose "[indent to here]" in the character drop-down.</p>
      <p>For my money the indent-to-here character is even better than a hanging indent, since it turns a set of regular tabs into an indent grid without needing more than one or two styles.</p>
