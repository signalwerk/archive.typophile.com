    html: <p>well, you could start with the obvious 'jazz', which comes installed on a lot of macs, grotesque sans serifs were popular as well, plus fonts like neuland and berlin... google for 'jazz posters' for layout and colour ideas, or go to amazon and look for cd covers... <a href="http://www.jazzposters.com/" title="http://www.jazzposters.com/">http://www.jazzposters.com/</a> has a lot of stuff as well...</p>
