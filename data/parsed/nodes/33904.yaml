  html: <p>My current project is promoting a Jazz Festival. Concept of this festival's poster is creating harmony using both typography and abstract images. I want to express "rhythm" feeling with typography so that i've been looking through typefaces. I've found "Fitzgerald Black" but  it's not Bold enough for my poster design idea. Any suggestion for this Jazz Rhythm look typeface?  </p><div class="imageWrap"><img src="http://typophile.com/files/Untitled-1_5084.jpg"></div><p></p>
  html_clean: <p>My current project is promoting a Jazz Festival. Concept of this festival's poster is creating harmony using both typography and abstract images. I want to express "rhythm" feeling with typography so that i've been looking through typefaces. I've found "Fitzgerald Black" but  it's not Bold enough for my poster design idea. Any suggestion for this Jazz Rhythm look typeface?  </p><div class="imageWrap"><img src="http://typophile.com/files/Untitled-1_5084.jpg"></div><p></p>
