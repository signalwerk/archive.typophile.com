    html: <p><a href="http://www.corianton.com/" target="_blank"> Corianton</a> has a <a href="http://www.corianton.com/fonts/densmore.html" target="_blank"> Densmore</a>, but that's not it. <br> <br><a href="http://www.larabiefonts.com/index.html" target="_blank"> Larabie</a> is supposed to have a <i>Densmore (a modern  <br>stencil font)</i> according to <a href="http://jeff.cs.mcgill.ca/~luc/fonts.html" target="_blank"> Luc Devroye</a> in his  <br><a href="http://cgm.cs.mcgill.ca/~luc/signature.html" target="_blank"> Signature/logo fonts</a> section, but it's nowhere to  <br>be found, neither on <a href="http://www.typodermic.com/index.html" target="_blank"> Typodermic</a>. <br>There's still <a href="http://www.network54.com/Hide/Forum/message?forumid=22577&amp;messageid=1038922468" target="_blank"> a reference</a> to the font on Larabie's  <br><a href="http://www.larabiefonts.com/forum.html" target="_blank"> Forum</a> though. Frustrating, innit?</p>
