    html: <p><img src="http://www.typophile.com/forums/messages/83/12507.gif" alt="densmore"> <br>I've found it on an old PC! <br>There's nothing on the License, Links or Description tabs of the properties sheet, but on the name tab under 'Font vendor' it says 'Macromedia', and under 'Copyright' it says 'by Ray Larabie - freeware <a href="mailto:rlarabie@hotmail.com">rlarabie@hotmail.com</a>'. <br>Most of the other tabs are empty, except for the embedding tab which specifies that no embedding is allowed (If you need embedability, maybe there's a version available for a small fee?) <br>Its always possible, I guess, that this font has been removed from Larabie's website under pressure from the owner of the original doors album covers etc? <br> <br></p>
    html_clean: <p><img src="http://www.typophile.com/forums/messages/83/12507.gif" alt="densmore"> <br>I've found it on an old PC! <br>There's nothing on the License, Links or Description tabs of the properties sheet, but on the name tab under 'Font vendor' it says 'Macromedia', and under 'Copyright' it says 'by Ray Larabie - freeware <a href="mailto:rlarabie@hotmail.com">rlarabie@hotmail.com</a>'. <br>Most of the other tabs are empty, except for the embedding tab which specifies that no embedding is allowed (If you need embedability, maybe there's a version available for a small fee?) <br>Its always possible, I guess, that this font has been removed from Larabie's website under pressure from the owner of the original doors album covers etc? <br> <br></p>
