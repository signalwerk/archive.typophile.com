  html: |-
    <p>Dear Typophiles, users of FontLab products, </p>
    <p>as we are concentrating our efforts towards a new release of FontLab Studio (in particular, a version that will run on Mac OS X 10.7) and are planning the next versions of our products, we'd like you to answer some questions regarding your views and opinions on future versions of the application that you use. </p>
    <p>We have prepared a questionnaire that should take some 15-20 minutes to complete. </p>
    <p>If you wish to share your views with us, please visit the link:<br>
    <a href="http://bit.ly/fontlabproductquest" title="http://bit.ly/fontlabproductquest">http://bit.ly/fontlabproductquest</a><br>
    and fill out the questionnaire. </p>
    <p>Best regards,<br>
    Adam Twardoch<br>
    product and marketing manager<br>
    Fontlab Ltd.</p>
