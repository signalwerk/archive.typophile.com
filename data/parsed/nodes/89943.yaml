      <p><em>The New Johnston is of course used in the London subway</em></p>
      <p>You can say this if you like, but in London it is the underground railway (and Johnston’s letter was called after it).</p>
      <p>For the resonance of the name ‘underground railway’ (or ‘railroad’ if you prefer), the escape network to the north for slaves, see the good piece in Wikipedia. I've always wondered how far the popular name of the system in London was an unacknowledged link to the US idea.</p>
