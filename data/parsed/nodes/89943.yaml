      <p>Joshua&gt;I haven't sold any, just made some for friends or other typefreaks as a gift, but if you would like one, give me a poke. Transport can be a mess though, even for it's smaller size (It's about 34x59cm) I'd like a bit larger, but then my own printing costs in combination with a nice stock, make it almost impossible.</p>
      <p>James&gt;True, but well, Bodoni and Garamond weren't the original names (if they even had those) of the types when they were used. The Garamond is (in most revivals) even combinations of letterforms inspired by him. So I sortof stuck with giving them the name on how they could be found today as a typeface. </p>
      <p>I actually never had linked the official name of the London underground to the escape network, but that probably has to do with English being a secondary language, and I usually used the word subway instead. But it's a fascinating nod.</p>
      <p>&gt;Paragraph: You are right, I actually didn't recall about the type on the record itself, and originally focused on the Pioneer plaque. However, I must say that the image of the cover is the more iconic image connected to the record. But a good addition still!</p>
      <p>&gt;Te: I included Cooper Black (Easyjet corporate identity) and Bodoni (United Airlines) My main reason for this is that there is of course always type going places, but I had to make a choice on how visible and recognizable the type would be. But additions are always good.</p>
      <p>I included the Frutiger for subs, since it's the corporate identity of the Royal Navy, although this is a tricky one, since I've only seen Frutiger stenciled on hulls in PR renders/fresh launches.</p>
      <p>My first version also included various unnamed stencil type which is used on some bathyscapes. Actually I could include the Trieste (which reached a depth of about 11km) I should try to ID the type used (which is probably custom) </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Trieste-lettering_5717.jpg"></div><p></p>
      <p>Thanks for the addiitons, I'll have a peek at the Gill sub!</p>
      <p>I have some more pictures on my Behance site (don't slag me! it's useful to spread the type around! ;)) Which also includes various slanted pictures with a pretty DoF which actually doesn't add anything and makes the text unreadable. But hey, it's it trendy!<br>
      <a class="freelinking external" href="http://www.behance.net/gallery/Type-Distance-Records/3114413" rel="nofollow">http://www.behance.net/gallery/Type-Distance-Records/3114413</a></p>
