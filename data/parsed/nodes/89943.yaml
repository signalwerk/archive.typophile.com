      <p>It's typefaces that have had an iconic 'outing' such as the Futura on the Apollo lander, or Helvetica on the Space Shuttle.</p>
      <p>The Rijksoverheid font is used for the corporate identity of the dutch government, and since most of the Netherlands is below sea level, it's a small joke ;)</p>
      <p>The New Johnston is of course used in the London subway, Garamond is used for the corporate identity of Stena Line. But yeah the texts do add a tiny bit of information, the lo-res stuff doesn't help. Should have SVG'd it.</p>
      <p>Sorry if I was unclear!</p>
