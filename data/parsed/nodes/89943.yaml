    <p>A few years ago I did this poster which showed various achievements by some iconic or well known typefaces (and one personal preference) This was based on how far the type had traveled from the earths sea level (and still was visible, so I did not include launch notes printed in comic sans!)</p>
    <p>I had to make a reprint this week, and this got me wondering. I went for the easy pickings: Typefaces many people know, and achievements/places many people know. But I'm sure there are many more interesting tales of type traveling out there, especially further in history.</p>
    <p>So, does anyone have some nice stories?</p>
