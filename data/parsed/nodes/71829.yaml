    <p>Hello,</p>
    <p>I would like to know the font used for the word "TODDFEST" in this image: <a href="http://sphotos.ak.fbcdn.net/photos-ak-sf2p/v250/81/58/703761159/n703761159_852889_3083.jpg" title="http://sphotos.ak.fbcdn.net/photos-ak-sf2p/v250/81/58/703761159/n703761159_852889_3083.jpg">http://sphotos.ak.fbcdn.net/photos-ak-sf2p/v250/81/58/703761159/n7037611...</a></p>
    <p>I have tried using WhatTheFont.com without success as it identified each of the cut segments in the letter as separate characters. I have also tried Identifont.com and found some remotely similar fonts, but none that are exactly the same.</p>
    <p>Any help is appreciated.</p>
    <p>Thanks!</p>
