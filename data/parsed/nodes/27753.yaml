      <p>Dear Mr. Greenslade :)    </p>
      <p>You are right about what you are saying. But I think I can't change the most things you mentioned. Otherwise the style that I actually wanted to get will get lost. Exactly like you said.<br>
      I tried to make a x but I failed :) I will show it later to you. Sunday I will go on vacancy for a week. After that I will work again on it :)</p>
      <p>And<br>
      Dear Mr. Pitoyo :)<br>
      Kerning is a think that I have never done before. This is the part where I really need some help. Until now the kerning is just improved. But I first want to finish the letters before I do the kerning.<br>
      Sometimes the face reminds me on Baskerville too. Mainly in small sizes. I think thats because of the loop of the g. I think I will close the loop.</p>
