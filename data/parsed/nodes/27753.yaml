    html: <p>By to by, I also agree with Mr. Greenslade about how your face has a lot of quirkiness. However, this can really turn to your advantage because you can make <em>two</em> versions of it. One for titling, one for text. The former will have tighter spacing, higher x-height, more delicate strokes and so on; and the latter will be 'regularized' for text -- maybe buff the strokes a little bit, too :)</p>
