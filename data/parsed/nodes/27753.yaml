      <p>I like it a lot. It has a classical elegance with some nice subtle contemporary (transitional?) qualities.</p>
      <p>Now for the critique bit...</p>
      <p>I think the bent stems on the d, m, n, r and u add an inappropriate quirky element that i'm not liking too much.</p>
      <p>Maybe lose the skews on both axis on the i dot, and there's a few flat spots that could do with some rounding off, like the tail of the a and g, and the top of the f.</p>
      <p>I'm not sure about the end of the arm? (sorry, not up to scratch on my type anatomy) on the r. It seems a bit vague.</p>
      <p>I'm certainly no expert on serif text fonts but maybe the bowls of the a, e and g need to be a little bigger for clarity at small print sizes.</p>
      <p>But if you change everything i've mentioned it may lose all the qualities you were aiming for.</p>
      <p>Anyway, i could see it becoming a very nice and useful font.</p>
      <p>Now show us your x ;)</p>
