    <p>Hi everybody</p>
    <p>I will use this font only to set my buisness card etc. Thats why I just made the letters I need for my name and my address. I am a bit lazy at the moment :D<br>
    Capitals, numerals, &amp;, @ and a few italic letters to set the URL will follow later</p>
    <p>First I made some sketches and tried to experiment a bit. It was hard for me to find the right direction in which I wanted to go. After a while I had the idea to make something like a "light, low contrast, brush drawn, transitional"!??! Sounds a bit weird. Thats why I named this stuff after the greek goddess of strife <a href="http://en.wikipedia.org/wiki/Eris" rel="nofollow">Eris</a>. After a few test I normalized the letters a bit to make them readable.</p>
    <p>I dont know if the font works? I hope you like what I have done so far. Do you think it will work for small texts or how could I improve it!? Or is this a totally wrong direction that i took? Its the first time that I try to make a "textface".</p>
    <p>Thank you for your help.</p>
    <p><a href="http://lastraw.de/Steven/Working%20001.pdf" rel="nofollow">Working 001.pdf</a>.   </p>
    <p>Bye: Steven</p>
