      <p>"using Pomo as a serious description amounts in intellectual sloth or laziness."</p>
      <p>Well, I wouldn't level that charge at Robert Bringhurst. Here are a few pithy extracts from pp135-36 of v2.5 of his book: </p>
      <p>ELEGIAC POSTMODERNISM: </p>
      <p>"Postmodern letterforms ... frequently recycle and revise Neoclassical, Romantic and other premodern forms. At their best, they do so with an engaging lightness of touch and a fine sense of humor. Postmodern art is for the most part highly self-conscious, but devoutly unserious...."</p>
      <p>GEOMETRIC POSTMODERNISM: </p>
      <p>"Some postmodern faces are highly geometric. Like their predecessors the Geometric Modernist faces, they are usually slab-serifed or unserifed, but often they exist in both varieties at once or are hybrids of the two. They are rarely, it seems, based on the pure and simple line and circle, but almost always on more mannered, often asymmetric forms. And like other Postmodern types, they are rich with nostalgia for something pre-modern. Many of these faces are indebted to older industrial letterforms, including typewriter faces and the ubiquitous factory folk-art of North American highway signs. They recycle not Romantic and Neoclassical but Realist ideas...."</p>
      <p>"Postmodern art, like Neoclassical art, is above all an art of the surface: an art of reflections rather than visions. It has thrived in the depthless world of high-speed offset printing and digital design, where modernism starves. But the world of the scribes, in which the craft of type design is rooted, was a depthless world too. It was the world of the Gothic painters, in which everything is present in one plane...."</p>
      <p>And this from Bruce Mau's fabulous catalogue of "Postmodern" culture (although I doubt that he uses the "P" word): </p>
      <p>"There is no longer any distinction between text and non-text, image and non-image. The entire surface is now described in one language. Everything is now image. With [PostScript] Adobe ushered in an entirely new aesthetic and a new model of 'thinking the page' that will change the way typography itself is conceived." (Life Style, p. 65)</p>
      <p>So, perhaps looking at the technologies of so-called 'postmodernity' (Macintosh, PostScript, Fontographer, Internet, etc.) would allow the cultivation of a valid meaning for the term 'postmodern type'. </p>
      <p>Inevitably, letterforms are always going to refer to something other than themselves (i.e., alphabets). Experiment: try and decipher John Cage's '62 Mesostics for Merce Cunningham,' scattered throughout his book _M_. (Find specimens here: <a href="http://www.ubu.com/historical/cage/index.html" title="http://www.ubu.com/historical/cage/index.html">http://www.ubu.com/historical/cage/index.html</a>). Is Cage's use of Letraset in these musical compositions still 'typography'? This would be another way of approaching the question of 'postmodern type'.</p>
