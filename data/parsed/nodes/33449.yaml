      <p>Let her glare. Maybe you can save a whole class! ;-)</p>
      <p>Anyway. I am glad to be of help.</p>
      <p>I do want to be clear that I am absolutely sympathetic to an educator wanting to touch on this topic in some way - especially if they want or need to appear current at the institution where they are teaching. But I would suggest that she talk about the influence of Pomo thinking, attitudes and culture on graphic design and type rather than refer vaguely to Pomo itself which is a bit of an endless pit if you approach it with any seriousness at all.<br>
      Pomo visual tropes* are plentiful; so stringing together examples of Pomo influence is not hard. </p>
      <p>* ( a visual trope is a familiar and repeated symbol, meme, theme, motif, style, character or thing permeating visual culture. 'Trope' is a word adapted from literary criticism and pretty indespensable for really talking about Pomo.)</p>
      <p><cite>  lends itself to postmodernism </cite></p>
      <p>Or I might say 'lends itself to post modern flavor of expression'; but yes. </p>
      <p>On the other hand cut &amp; paste also let itself to Dada art on the one hand and to Decoupage a form of decoration on the other. </p>
      <p><a href="http://en.wikipedia.org/wiki/Decoupage" title="http://en.wikipedia.org/wiki/Decoupage">http://en.wikipedia.org/wiki/Decoupage</a> </p>
      <p>Cutting &amp; pasting or other forms of obviously artificial juxtoposion in Pomo oriented works is there to point out the presence, manipulation, provisionality, and artificiality of narrative.</p>
      <p>See also </p>
      <p><a href="http://en.wikipedia.org/wiki/Deconstruction" title="http://en.wikipedia.org/wiki/Deconstruction">http://en.wikipedia.org/wiki/Deconstruction</a></p>
