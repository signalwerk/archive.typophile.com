    <p>I was looking for some information on Post Modern type. I need to know the characteristics, the approximate date of their creation, and an example typeface.</p>
    <p>I've done several searches on and looked through all the design books for my typography course. I still can't seem to find anything on it. Any help or nudge in the right direction would be very much appreciated!</p>
