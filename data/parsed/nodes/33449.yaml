      <p>For what it's worth, these would appear to be quite distinct labelling terms (if not downright misnomers): </p>
      <p>1. postmodernism -- a self-conscious aesthetic/anti-aesthetic movement in literature and the arts</p>
      <p>2. postmodernity -- a periodizing term the inaugural date of which varies by discipline: ca. 1945 in Hassan's account of American literature; ca. 1972 in Jencks's account of architecture.  As for typography, Mau would probably settle somewhere mid-1980s, while others might prefer a date of ca. 1990 (Emigre, et al.).  Note however that 'postmodernism' was occasionally used in the 1930s, and even as early as the late-19th century (see Nicholas Zurbrugg's book _The Parameters of Postmodernism_ for details).</p>
      <p>Eben: 'postmodern ... intent' would appear to be a contradiction in terms, insofar as the example of Cage is concerned. Part and parcel of the postmodern condition would seem to be the relinquishment of an author's control over the 'meaning' of his/her text, and analogously, of a typographer's control over the use and interpretation of his/her typeface; although arguably, that disavowal of intention discloses -- yes, paradoxically -- merely another kind of intention, one that responds to the conditions of postmodernity (immanence + indeterminacy, or indetermanence, as Hassan quipped). </p>
      <p>Speaking of Cage's preference for non-intentionality, an _I Ching_ approach to typeface design is remotely conceivable. Just as Cage decided which parameters of a composition would be determined by chance operations, so too might a type designer subject the various parameters of each letterform in the alphabet to a series of chance operations. Parameters such as 'ascender height,' 'bowl width' or 'stroke direction' could easily be modulated at random, ostensibly free of the designer's intention or aesthetic preference. That, for me, would constitute one of many examples of a 'postmodern typography.' </p>
      <p>Nick: I appreciate the fact that an actual type designer has contributed to this topic!  Jeff Keedy is practically the only other typeface designer that I know of who uses the term 'postmodern' to describe what they do. For want of a better term, perhaps?</p>
