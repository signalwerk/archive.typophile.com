      <p>Last but not least... The book <em>Design Writing Research</em>, by Ellen Lupton and J. Abbott Miller, has a great essay, "Laws of the Letter," in which they apply poststructuralist analysis to the history of typeface designs... I think you will find some useful concepts there. Also, Ellen Lupton adapted and rewrote that essay for her more recent <em>Thinking with Type</em>, in case you can't locate the older book.</p>
