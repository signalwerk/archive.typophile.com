      <p>I am sorry if I offened you. You are right I went too far. </p>
      <p>The thing I have against this kind of assignment is that if your teacher had been able to show you what postmodern means then you would not have to take it from a book or a person that a typeface ( or song or book ) is postmodern - it would be something you could detect for yourself. And if you saw a false claim you could detect that too. But you haven't been given the idea of what Post Modern is. It's sort of unfair in a way. Or tough.</p>
      <p>Think about it this way: Can you look at a typeface an decide for yourself if it looks Venetian, Aldine or Egypitine to you? If you study type history a little it can become pretty easy.</p>
      <p>Look here &amp; you will be able to:</p>
      <p><a href="http://typophile.com/courses/type101" title="http://typophile.com/courses/type101">http://typophile.com/courses/type101</a></p>
      <p>However I am arguing that postmodern is not detectable in the same way. Not at all. It's not like apples &amp; oranges it's like apples and civilizations. It is a whole different thing. </p>
      <p>What you can already say without understanding postmodern ideas very well is 'this font seems to be the result of a sort of postmodern sentiment'. Or you could say 'here is a font using pastiche - so is that pomo?' </p>
      <p>Thats the sort of thing which will get you further. But It isn't what you were asked to do. And won't ansswer you question very well even if it's a start.</p>
      <p><cite>weird looks </cite></p>
      <p>The reason you may have goten that look could be:</p>
      <p>a) they don't think it exists<br>
      b) the don't think it should exist<br>
      c) they are looking for a most specific kind of question like the kind I gave eamples of above.<br>
      d) It doesn't exist<br>
      e) They might wish your other teacher would give reasonable assignments</p>
      <p>I am not they guy to explain Pomo to you. Still, since I insulted you I will do my best to give you my take on it. I will warn you that you should take it with some salt &amp; look around for a better explanation. And maybe read some Derida.</p>
      <p><a href="http://en.wikipedia.org/wiki/Jacques_Derrida" title="http://en.wikipedia.org/wiki/Jacques_Derrida">http://en.wikipedia.org/wiki/Jacques_Derrida</a></p>
      <p>To do it I will comment on some previous posts:</p>
      <p><cite> Type revival as recontextualization. </cite></p>
      <p>This isn't really pomo. Not Caslon is a a pomo-ish title. The designer may have been influenced by pomo sentiments. But I don't know that the font is pomo. </p>
      <p><a href="http://www.emigre.com/EFfeature.php?di=111" title="http://www.emigre.com/EFfeature.php?di=111">http://www.emigre.com/EFfeature.php?di=111</a>.</p>
      <p> I say that because I think pastiche is not enough in itself to label a typeface as 'Pomo'. There would have to be intent. </p>
      <p><cite> curation-as-art methodology </cite> </p>
      <p>Curation is not type.</p>
      <p><cite>But then I’m not sure where to draw the line between where things are postmodern by design, or postmodern because of the environment in which they were created.</cite></p>
      <p>Here the distiction should be made between the aesthetics or qualities that resulted from post modern ideas and impulses and the ideas and impulses themselves. Design cannot be Pomo but the content/narrative in a design ( magazine, greeting card, whatever) can be aesthetically reinforced by Design. This can be done by employing pastiche, rejection of genre distictions, etc. </p>
      <p>So far I have just ben negating things. There should be a postive example as well. </p>
      <p>I think Pomo is a little bit like Murder vs. Manslaughter. If there is intent it's Murder/Pomo. If there isn't it's maybe Pastiche or Parody or Ambiguous - but it's not Pomo. Sorry my 'postive' example is murder.</p>
      <p>Put in less bloody terms; Pomo implies and requires either an audience that receives the intent of an author/maker, a viewer that constructs a narative on his/her own, or just an author with intent. Immediately the wole thing is complex and gets ever more complex. It's that complexity that creates a sense that ambiguity ( as opposed to modern objectivity ) is inherently inevitable. </p>
      <p>Also, identification of something as Pomo automatically sets up narative and a triagulation of the labeler, the object in question, and the maker or author - even if the maker is labeler. </p>
      <p>So; no narrative - no Pomo.</p>
      <p>Stories have narratives. Films may have them. Art can (or not). </p>
      <p>But Type does not. </p>
      <p>A promotion of type could be postmodern. But they type cannot be. It's too simple a thing. </p>
      <p>Here is one last example: Iron or even Iron compounds are not an organism. But Iron or Iron compounds can be in an organism. Pomo is complex like an organism. Type is simple like Iron compounds. You wouldn't ask if a compund of Iron had Ape-like qualities would you? But You need Iron to make Apes.</p>
      <p>Again, sorry if I irked you. Hopefully this is of some help. </p>
      <p>BTW: the post modern thing to do now would be to ask your teacher why he/she gave you this assignment and what the intent of it was. And then to deconstruct that intent, to spectulate on the way in which the assignment related to the history of the teacher's life, and to indicate the subjective value the assignment had for you while acknowleging that your opinion is not well informed enough, while also admitting that the narritive you are constructing cannot help but be constructed - however unobjective it may be.</p>
