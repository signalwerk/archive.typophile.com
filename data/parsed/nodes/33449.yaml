      <p><em>the post modern period</em></p>
      <p>The distinction must be made between the idea as a principle and as historical movement.<br>
      That stems from the Post-modern understanding of modernism, eg "modernity's awareness of itself as modern announces merely the empty flow of time itself' (Pinkney). Or, "modernity can only define itself in terms of a temporal break with an organic past, but it is a break that has always already occurred no matter which moment one chooses as its starting point." (Kantaris).</p>
      <p>So Italian Fat Face is not part of the Post-modern era, but may still be a post-modern type design.</p>
