      <p>Robert Bringhurst has a certain notion of the postmodern in mind, in his Elements of Typographic Style: "frequent parody of Neoclassical, Romantic or Baroque form; rationalist or variable axis; sharply modelled serifs and terminals; moderate aperture" (p. 15). Check his book's index for examples (Photina, Quadraat, Nofret come to mind). </p>
      <p>Broadly construed, anything 'PostScript' is, in a sense, 'postmodern' (see Bruce Mau, Life Style). More specifically: post-Fontographer...?</p>
      <p>The following web page page cites examples of what could properly be called 'postmodern' faces: <a href="http://www.aiga.org/content.cfm/the-digital-past-when-typefaces-were-experimental" title="http://www.aiga.org/content.cfm/the-digital-past-when-typefaces-were-experimental">http://www.aiga.org/content.cfm/the-digital-past-when-typefaces-were-exp...</a></p>
