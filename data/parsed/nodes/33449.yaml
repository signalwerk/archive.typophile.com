      <p>Eben: I appreciate that. You've certainly provided ample food for thought. For example, it strikes me that what Cage achieves in his graphic mesostics at the level of the page is analogous to that which a postmodern typeface would achieve at the level of the font: i.e., hybridity, pastiche, playfulness, etc. -- even (if only rarely) at the expense of legibility itself (or in the case of Cage's mesostics, grammar and syntax). Cage's mesostics exemplify a kind of 'visual poetics' which have often been associated with the initial, more creative and experimental phase of postmodern writing. The arrangement of text as visual image dominates even theoretical writings on postmodernism, such as Hassan's The Postmodern Turn. But unlike concrete poetry, etc., Cage's mesostics and other writings (Mureau, Empty Words) deliberately defy the imperative to communicate a syntactic message. I doubt whether typography could ever be so experimental as to completely disavow its conventional raison d'etre (the result would be the "Silence" font -- a blank specimen page -- or sheer noise; in any case, something other than typography as traditionally conceived).</p>
      <p>Cage's is of course not the only literary aesthetic to qualify as 'postmodern.' Consider Thomas Pynchon's novels as a contrast. Mason &amp; Dixon, a weighty historical novel written in parody of eighteenth-century style (although with plenty of historical anomalies) is set in a period typeface (Pynchon scholars have seized on the ebullient ampersand that adorns the book's jacket). This "putting on the costume" (and indeed, "parading") of past styles is also a feature of postmodernist literary aesthetics. Arguably, it comprises a more complex relationship than that which might be discerned in such typefaces as NotCaslon or DeadHistory. But the same principle -- reviving historical styles in order to comment on them, and our lingering attachments to them; usually critically -- seems to inform both projects. </p>
      <p>Just a couple of random thoughts to throw into the mix.</p>
