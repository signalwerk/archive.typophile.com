      <p><cite> it’s just not Black and white anymore </cite></p>
      <p>None of it ever was. And in fact when I posted my friend's long analysis I was interested in showing that pomo has in fact meant many things over time. You can pick from a series of definitions of you want. How is that for shades of grey? </p>
      <p>Joseph, the other thing your post suggests is that type has existed in neat catagories up until recently. This is also a mistake. To be sure you can talk about how 'aldine' a type is or not but it isn't a border. It's hazy too. Less than pomo for sure but hazy none the less. </p>
      <p>But the real point I wanted to make was that Pomo isn't really that descriptive a term for type. It isn't that useful. It's closer to spin - or hype. A description that gets closer to what is going on like 'parody' or 'pastitche' or whatever is actually helpful. Saying 'Pomo' about type is as much or more an assertion about the state of the maker mind as it is about the type. Pomo is scattershot &amp; weak as a descriptor. </p>
      <p>I am willing to climb down a bit and admit that saying pomo about type is might be okay if you are a graphic designer or a memeber of the public. I am sure there are contexts in which that is going to be a useful way of describing work. I would prefer it is they said type that supports a Pomo direction or something but it isn't worth the arguement. Talking about type isn't easy and they should be given some slack. </p>
      <p>On the other hand, if I have a class I want my teacher to teach something that  can use intellectually or practically. That is why I say that for somebody involved in type as a type designer or a teacher; using Pomo as a serious description amounts in intellectual sloth or laziness.</p>
