      <p>Teach is right on with wanting specific faces, characteristics, and dates.<br>
      That way you have to look and think about what you're seeing. Having a variety of "finds" by students will make for interesting discussion.</p>
      <p>It's possible to describe typefaces from a number of different perspectives, which is perhaps a Post-modern idea. Typespeak and Techspeak are de rigueur, but Artspeak has some relevance to post-modern designs -- however, you will have to decide how much of the irony is po-faced, piss-taking, or both.</p>
      <p> </p><div class="imageWrap"><img src="http://typophile.com/files/artefact_4248.png"></div><p></p>
      <p><em>Literally and playfully Post-modern, Artefact (1999) deconstructs the Modern (Didone) class of 19th century types to question the conventions of stress inherited from earlier, chirographically-informed types, governing the acceptability of which strokes are thin, and which thick. Rephrasing the Didone vocabulary, Artefact generates a revisionist colour of corroded notan.</em></p>
