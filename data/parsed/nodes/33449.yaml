      <p>I would say that we are in a middle of a post modern typographic trend. Seems that everyone is doing their own characters based on the topic.</p>
      <p>I.e. check out the swedish super skilled girls behind Hjärta Smärta at <a href="http://www.woo.se/" title="http://www.woo.se/">http://www.woo.se/</a>. They have done some very skilled and cool things that at least I concider post modern.<br>
