      <p>"Maybe you would like to explain what you mean &amp; stop simply waving your hands. Conflation is not a helpful way of thinking - especially about this."</p>
      <p>Please don't get me wrong: hand-waving was hardly my intention. Since you make that criticism in relation to my comments on technology, let me cite Mau once more:</p>
      <p>"If we look closely at the history of typography, it's principally a history of evolving typographic production techniques. The forms are in fact inseparable from the ways in which they were produced. The same will apply to PostScript. The consequences remain to be seen."</p>
      <p>That's the context for Mau's remarks I quoted previously: the "principal innovation [of PostScript] was the invention of a 'page description language' used to describe any point on the surface, whether it was text or image." If text and image are not yet one and the same thing, they are well on the way to becoming so. That, at least, is Mau's conjecture. Technologies such as OCR and image-tagging do tend to blur the boundary somewhat.</p>
