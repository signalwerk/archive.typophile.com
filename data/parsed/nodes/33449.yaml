      <p>Well since some years from the 60s (or mid-80s) are passed, I guess you have to define your term of Postmodernity —— Post Modern type, to me, is a very noisy and crowded indoor space.<br>
      Shall Postmodernism reject boundaries between high and low forms of art, reject rigid genre distinctions, emphasizing pastiche, parody, bricolage, irony, and playfulness ?<br>
      Shall Postmodern art (and thought) favor reflexivity and self-consciousness, fragmentation and discontinuity (e.g. in narrative structures), ambiguity, simultaneity, and an emphasis on the destructured, decentered, dehumanized subject ?</p>
