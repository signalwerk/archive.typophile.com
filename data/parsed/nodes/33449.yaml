      <p>Okay I am back.</p>
      <p>You said:</p>
      <p><cite> goes beyond a theory of postmodernism and into its actual practice </cite></p>
      <p>So you saaaay. But what do you mean? I mean I can say I can fly to the moon. But what would convince you? Admittedly I need less proof re: Mau's practice but I would like some sort of specificity or I will be forced to say 'waving hands' again. I am not saying he isn't or doesn't but it would help if you let us know what your standards are. Don't you think so too?</p>
      <p><cite> Within my own field of expertise (literature) postmodernism was hardly very exciting or trendy from 1992-2002, when Bringhurst wrote and revised his book </cite></p>
      <p>Maybe so, but within graphic design PoMo was hitting big by the time 1992 rolled around and stopped being trendy maybe 5-7 years later. And who was Bringhurst writing for? Not a Lit or Theory audience. No, clearly a graphic design oriented audience. So I contend Bringhurst had motive. You can't really use Lit Crit as guide here. I mean, how much sense would that make?</p>
      <p><cite>  They’re unstable and problematic categories, to be sure, but no more so than in other fields </cite></p>
      <p>I think it would be good if you expanded on this. Even if you think PoMo is a problematic or iffy adventure; it doesn't preclude describing what you you think is essential or descriptive or better still distictive from other ( especially related ) ways of looking at the world. </p>
      <p>That's my core thesis here. I don't see anything in suposedly PoMo type that would not be at home in Dada or some other period that shared 'techniques'. Is there a technique that is unique to Pomo? That would be start at least. </p>
      <p>But even if you can name one or even 100; PoMo isn't just made from one or more approved processi. It isn't just a new &amp; improved Dada 2.0 with 2 new techniques! I am saying PoMo is different &amp; worth talking about  because it goes beyond technique, and aesthetics. Actually, Dada did too. But back to the point: Type as a vessel isn't able to carry that distictiveness- mostly because Type on it's own has no narrative. It can play a part in a narrative. But it does not contain one in the way that a Pynchon's 'Mason &amp; Dixon'  ( that bit about the ketchap was really fun wasn't it!) or Calvino's 'If on a Winter Night a Traveler' does. Or a Cage poem or Mau essay *might*. </p>
      <p>In the case of Pynchon &amp; Calvino you can point to the Narrative acknowledging itself as a narrative. That wasn't new exactly. 18th century lit such as Montesquieu, "Lettres persanes", or Henry Fielding's "Tom Jones", or  Laurence Sterne's "Tristram Shandy"...  did that too which is why Pynchon was keen on revisting the past. And he isn't the only one. Jeanette Winterson &amp; Rushdie have been there too. Still there is something in Pynchon's book which is Postmodern not 18th century. Can you put your finger on it?</p>
      <p><a href="http://en.wikipedia.org/wiki/Metafiction" title="http://en.wikipedia.org/wiki/Metafiction">http://en.wikipedia.org/wiki/Metafiction</a></p>
      <p>If you can; can you locate it in a typeface *itself*?</p>
      <p><cite> If text and image are not yet one and the same thing, they are well on the way to becoming so. </cite> </p>
      <p>I have already shown one way in which this is not so. Mau is blurring what is actually complex &amp; rich and - possibly postmodern. He is not getting at what happening but waving hands. It's entertaining but not enlightening. It's not that it's all becomeing one mushy image gruel. It's not a case of becoming Textimage or Imagetext. It's text in images. And images of text. And XML. And RSS. And they are all specific. Distinct and in a web of  complex relationships. So it's not all becomeing the <cite> same thing </cite> at all. In fact the opposite. It's a case of more different but also related &amp; interrelated than ever.</p>
      <p>I think your best hope for defining some kind of type as PoMo in a really convincing way would be to draw a definition of Pomo outside it's most complex periods : Lit &amp; Theory; and find something distictive there. I am not sayng it can't be done. Just that nobody has done it so far. </p>
      <p>The other model you could use is to say, this period if different. This type was made during this period. It has features which are typical of type from the period. Maybe it was notorious/famous or influential. All of which amounts to: It's periodicity and noteworthiness makes it 'Pomo'. I say that's a poor definition but if you want it you can have it. I only ask that you cop to buying that definition if that's they one you are using.</p>
      <p>The 1st model is harder. The 2nd model is easy. But in either case: confess what standards you are using. </p>
      <p><cite> I doubt whether typography could ever be so experimental as to completely disavow its conventional raison d’etre. </cite></p>
      <p>Yes, it is absolutely neccesary that the type carry significant amounts of 'past style' or it will not be recognized as type and will not work and is there fore not type. I mean you could say that all type has been postmodern from the beginning of time because it carries past styles. But that's not a useful or accurate thing to say. You agree - correct?</p>
      <p><cite> a feature of postmodernist literary aesthetics </cite></p>
      <p>Now we are getting somewhere 'a feature' is right. A feature does not rate as equivalent to an aesthetic. And moreover I have been busy saying that PoMo is essentially beyond Aeshetics too. So showing a feature is not enough. Not by a a long shot. That is to say, I am saying PoMo cannot be defined by aesthetics alone. You can disagree. But say so.</p>
      <p>And finally </p>
      <p><cite> reviving historical styles in order to comment on them, and our lingering attachments to them; usually critically — seems to inform both projects. </cite></p>
      <p>This was your best point I think. You are saying; if I get you; "it's not the same, but it has the same spirit". That really works as long as you don't take things apart and examine the bits. I cannot find the part of NotCaslon &amp; DeadHistory that comments. They do repurpose historical forms. And in a newish way. But repurposing has no point of view in and of itself. It is a technique without a perspective so it isn't 'critical'. Ceratinly commenting; depending on what is said; might be PoMo. The intent lies with the Authors in the case of Type because Type cannot reveal intent in the way that Art, Film, Narrative or I would even argue Architecture can.</p>
