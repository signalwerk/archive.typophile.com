      <p>&gt; ubiquity does not imply lack of quality</p>
      <p>In terms of "inherent" quality the opposite is generally true. But in terms of contextual quality, when a font is used for everything from soup to sex to septic tanks it becomes too diluted to use for anything effectively. Contrary to what some people claim, it's not that it becomes neutral, it's that it becomes confused, hence unreliable. Think of Trajan, poor Trajan.</p>
      <p>&gt; spacing preferences are relative</p>
      <p>Not when it comes to reading.<br>
      When it comes to delivering good notan a font's various attributes have to be in balance. Helvetica's vertical proportions, color and spacing are each optimal for different types of settings. It. Is. Badly. Made.</p>
      <p>&gt; tracking can be applied</p>
      <p>Tracking ruins the spacing of "boundary condition" glyphs,<br>
      most famously the right side of the "r". Tracking is for brutes.</p>
      <p>--</p>
      <p>But there is a good reason to pass on my advice: chances are your teacher, being a graphic designer and not a type designer, really has no idea how (or even that) Helvetica sucks, and might react badly.</p>
      <p>hhp</p>
