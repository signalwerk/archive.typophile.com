      <p>I wonder if some of Cages other ideas might be of use at all.  One of his most famous focuses (and one he later rejected) was his preference for composing for the silence in pieces instead of for the non-silence.  This is an implicit rejection of the earlier mentioned "text and non-text,image and non-image" being the same.  Most are surely familiar with the height of this approach in <em>4'33</em>.</p>
      <p>Part of the problem of defining postmodernism (or even really modernism to an extent) is that there is less unity in the representations of works.  All those isms (big generalization) that fall under Mo/PoMo each had their own approach and results, but had similar thinking or catalysts for action, though looking at their works it might not seem that way (I speak more from the visual and textual arts side, I'm not as well versed in musical/aural).</p>
      <p>Returning to Cage, applying his focus of silence to type, silence would be blank paper, or not-type.  Would designing with a specific focus on negative space in type design affect it?  Does his ultimate rejection of silence play a role (just like with sound, on paper it's impossible to have pure white, the paper inherently has some gray or texture or otherwise).</p>
      <p> A couple of people have mentioned mixing of styles, hybridizations, etc. but these come off to me as much more plain Modernist than PoMo.</p>
      <p>Now what I would do for a real PoMo or perhaps better said PoPoMo piece would be a autogen word processor that would design each letter in a classical style (that is, serif, formal looking, nothing crazy) but that would analyze the text as it was being inputed and begin to adjust font properties (by word or even by letter) accordingly, including changing serifs, weight, angle of weight, slanting it or italicizing it, adding double strikes, color of text, contrast, etc.      Hey wait, that last bit there sounds almost like some nearly lost technology we already have....</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
