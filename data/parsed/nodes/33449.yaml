      <p><em>Mostly it’s just removing thick parts</em></p>
      <p>Yes, I stopped short of thickening horizontals. And I drew it, with adjustments for balance, rather than using cut and paste, so it's true I didn't go all out. The criticism I have always made of my own post-modern work is that I compromise it by relying so much on traditional drawing aesthetics to make it look pleasing to the eye, well, my eye anyway. </p>
      <p>There's a mid 19th century face, can't remember the name, Italian something or other, that completely rotates stress through 90 degrees. So, was that kind of thing purely a formal exercise, or just how knowingly post-modern (Eben's criterion of intent) was it? Does it matter whether the intent is literally articulated as such by the author/designer, or is the articulation non-linguistic, in the work itself? How important is the artist's statement, or should we just leave it to critics to discern and impart intent?</p>
      <p><em>much newer than that release date!</em></p>
      <p>Here's how I blurbed it in on release (Shinntype Specimen Booklet #1, Nov. 1999):<br>
      "A systematic, precisely finished deconstruction of the late nineteenth century <em>modern</em> genre."</p>
      <p>Only later did I discover notan...</p>
