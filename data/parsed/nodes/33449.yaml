      <p><cite>"Part and parcel of the postmodern condition would seem to be the relinquishment of an author’s control over the ‘meaning’ of his/her text"</cite></p>
      <p>You are not making sense here I am afraid. A post modern intent would consist of relinquishment of an author’s idea of an exclusive relationship. This does not in any way mean that they can't have 'intent' or be aware of their own purpose/s as they contruct a frame which they know must inevitably embrace multiple interpretations/meanings. </p>
      <p>So far I have just described a PoMo attitude to doing the work. The distiction you are not getting so far I think is between that &amp; the embedding of some sort of trace of an awareness of relationships and perhaps of liminality in the work itself.</p>
      <p>Re: the 1st term; I agee it is distinct. I think your definition is too short, and also too restrictive. The notion of an anti-aethetic aesthetic being 'neccesary' to PoMo isn't accurate. What going on on is that the aesthetic as a primary urge is left to one side. However, the aesthetic ( meaning pleasing ) is not forbidden in the postmodern.  </p>
      <p>Re: the 2nd term; as I pointed out ealier Historical periodicity is a poor way of defining a thing mostly because it's not very strong, specific or useful. I do agree that the phrase itself is distinct. I don't think we will find it useful to pusue because it is too vague a term.</p>
      <p>Re: Ramdomness as a feature of PoMo; the FUSE projects and other generated type, especially the work of Letterror <a href="http://www.letterror.com/catalog/robot/index.html" title="http://www.letterror.com/catalog/robot/index.html">http://www.letterror.com/catalog/robot/index.html</a> seem to meet your criteria already.</p>
