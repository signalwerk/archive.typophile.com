      <p>Speaking of PoMo type, I have a related question to throw around in here.</p>
      <p>I am reworking a project from school for my portfolio about post-modernist point of view/perspectives from Massimo Vignelli, Jonathan Barnbook, Denise Gonzalez Crisp (professsor at North Carolina SU, and Lorraine Wild (of Green Dragon Office). The book is supposed to be a comparative dialog, with all essays running on the same spreads, 1 essay from each designer, with text reacting with one another depending on the current dialog.  </p>
      <p>One of my problems is (has been) choosing typefaces that represent each point of view (if i should even do that), and/or that represent the designer in general. Currently (the design I'm dumping), with the point sizes all around 8 point-ish, the book ran about 30 pages. With a systematic approach to this, the whole thing seemed to get redundant and uninteresting after a few spreads. I would like to keep that same systematic approach as I think that is a smart way to keep all the text under control and stable.</p>
      <p>I guess I'd like to get some of your opinions on how to approach this or suggestions on how I change what this book is going to be post-redo (now that I don't have an instructor directing it!)</p>
      <p>Any comments would be helpful. My professor got in a car accident on the brink of this project's end, and I never heard from her again! What luck! Thanks very much!</p>
