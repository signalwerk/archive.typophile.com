      <p>Since Hrant has demured the task of writing something coherent &amp; formal ( and I did too actually...) I asked a friendf of mine whose views of these things I respect and this is what he wrote to me:</p>
      <p>" Well...here's the short version of "postmodern" literary theory, as I understand it.  Others might suggest otherwise:</p>
      <p>1.	Postmodernism, before the 1950s, was primarily a mode of description for certain kinds of appropriative forms.<br>
      2.	At some point, in the 1960s and 1970s, it works its way into both literarure and literary criticism as a self-aware attitude.   From my point of view, it is more substantial in literature as an "artistic" development--Borges, Calvino, Barth.  Novelists like Barth theorize it into things like "The literature of exhaustion".  In philosophy, there are related-but-quite different developments, like "The Social Construction of Reality", etc.<br>
      3.	In the 1960s and 1970s, poststructuralist literary theory (Derrida, etc) makes its way through the intelligentsia.  This is a separate development from postmodernism,. as it is a specific reaction to french structuralist theory.   It is "relativizing", but doesn't particularly relate to developments in the arts, or their modes--there is a certain kind of intellectual sympathy/interaction.  From the point of view of postmodern theorists, I suppose, it might itself be considered a kind of development of postmodernism, if you are a postmodern theorist..<br>
      4.	In the late 1970s, postmodern philosophy becomes a broader, more articulated idea.  Lyotard writes "The Postmodern Condition: A Report on Knowledge".  Rorty writes "Philosophy and the Mirror of Nature".  Postmodernism is articulated into a more general description of contemporary thought and knowledge--suspicion of metanarrative, etc.<br>
      5.	 In the 1980s, "postmodern" and "poststructuralism" become catchwords for undergrads everywhere, like ourselves, and often become conflated or generalized into relativized relationships to knowledge.<br>
      6. 	Eventually, it becomes a kind of cultural catchword--Republicans mistake it for "relativism".  Everything self-conscious in the arts becomes "postmodern".  People get fed up and stop using the term.</p>
      <p>You are probably right that a font is not "Postmodern" in the same way that a Calvino novel is postmodern, and also right that that might have been one of the most interesting moments in postmodernism, or the most useful phase.  As far as architecture goes, you may also be right, since a piece of architecture is fundamentally a kind of aesthetic object as well as a functional one that has things fonts do not--like a physical context.  If you build a modern building in an old neighborhood with certain kinds of self-conscious allusion to the older forms of architecture surrounding it, that may be postmodernism.  But a font might be more like a construction material--or not exactly, but it in itself is mostly a form/object which can be put into different contexts.</p>
      <p>I think the bigger question has to do with, as you say, technique, which of course is not "postmodern"--dada is a good example--for that matter, 18th c novels, etc.   That's the problem with step 5, in the 1980s.  I wish people would use the phrase "self-conscious" or "self-allusive" when they just mean self-conscious, instead of invoking a confusing intellectual lineage every time.   This is especially a problem since its original uses are real developments in intellectual history.  Also, often people really mean "modernist", which as you say used all of those techniques and more--no one is more self-conscious/pastiche-using than Dadaists, Surrealists, Theater of the Absurd-ists, Woolf, Joyce, Godard, etc. etc.   One might say that postmodernism was a kind of shift in ideology that stripped modernism of its idealist/elitist project, but is still basically modernist in technique.  In a way, what people mean by postmodernism is a kind of popularization of modernist technique.</p>
      <p>Oh well..."</p>
      <p>Enjoy! Or Not.</p>
    html_clean: |-
