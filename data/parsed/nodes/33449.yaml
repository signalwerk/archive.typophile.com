      <p>Eben, thanks for the apology and the help. I had a feeling Post Modern was going to be a little complicated. I agree that I hate this sort of assignment, too, but I’m stuck doing them. I think she feels the need to pile on more work.  </p>
      <p>During my course, we had studied the usual type classifications like Old Style, Transitional, etc., but never once did my professor mention Post Modern as a classification in any of our lectures. This was part of a very, very long essay for the end of the semester, supposedly hitting on all of the important things we had gone over. But it was never covered in any form so it was a bit…odd. </p>
      <p>The analogies helped a lot. I was looking through one of the books recommended to me on here and I saw that it had all sorts of typefaces in it—from all different classifications, making it impossible to pin down one specific typeface, year, characteristic, etc. Your explanation made it clearer.</p>
      <p>Hahah…you have me half-tempted to ask my professor why she gave us the assignment, deconstruct it, and write her a note. She’ll probably just glare at me.</p>
