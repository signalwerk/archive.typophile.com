      <p>Yes, I was wondering where the quote could come from. I assumed since it was not cited that it was Nick speaking in a faux authoritative italicized voice thus critiquing the underlying assumption I have made that we could or should define PoMo one way or the other. After all are there not multiple perspectives? Why take a single definition to (a modern attitude surely...) to the PoMo? Of course I don't see it that way but that's okay. Still, nice job of taking the part on Nick!</p>
      <p><cite> It’s possible to describe typefaces from a number of different perspectives, which is perhaps a Post-modern idea.</cite> Is that idea encoded in your sample face? If a type face seems to you to be referencing a idea is that enough? Or is this a case of litteral visual deconstruction ( a technique ) minus a PoMo intent. What is there in the font itself that would let you decide?  </p>
      <p>When reading about revivals I have often read criticism of the the idea that it's possible or even desirable to imagine what the type designer was thinking based on study of their type. So far I agree with the critique and that leads me to think there is nothing in the font itself ( leaving interviews &amp; critiques of the font out of it ) to suggest intent. What do you say about that? How does that relate to our arguement? </p>
      <p><cite> have to look and think about what you’re seeing </cite><br>
      I am all for that. I just think it's more helpful to say 'type from the post modern period in design' rather that 'PoMo type'. I know it's a subtle distinction but worth making especially in an academic context where you are meant to be looking and thinking about what you’re seeing. Also, students will have a better shot of actually finding some examples because the won't be wasting time trying to put round pegs in square holes. Or chasing an 'essence' of PoMo which would be a Romantic sort of idea I think...</p>
