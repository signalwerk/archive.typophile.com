      <p>"So don’t think you can cow me into backing down by invoking Bringhurst."</p>
      <p>Eben, you've taken my post completely the wrong way, since I wasn't responding to your comments but, rather, merely trying to contribute further to the forum topic. I invoked Bringhurst not for the purposes of worship or for bullying, but simply because his is one of the very few books on type that I happen to have at my disposal. Ditto Mau -- who as an 'entertainer' playing with 'surfaces', goes beyond a theory of postmodernism and into its actual practice. Within my own field of expertise (literature) postmodernism was hardly very exciting or trendy from 1992-2002, when Bringhurst wrote and revised his book (v.2.5 which I quoted from). Indeed, Ihab Hassan, a prominent literary theorist, proclaimed the 'death' of postmodernism in 1990 -- around the same time something we could (but won't)agree to call 'postmodern type' was being born. </p>
      <p>As for making distinctions: this is precisely Bringhurst's method, differentiating postmodernism from modernism, 'elegiac' from 'geometric' postmodernism, etc. They're unstable and problematic categories, to be sure, but no more so than in other fields (literary theory for example). </p>
      <p>Granted, postmodern typeface and postmodern typography need to be distinguished (I was evidently thinking somewhat like a rhizome in my previous post). For the record, though, Cage is in fact a de facto typographer, ever since his handwriting was digitized and fontified. In homage, P22Cage even includes a 'Silence' font - the definitive postmodernist typographical gesture? I wonder, has 'Silence' ever been used by a designer? </p>
      <p>A couple of salient points mentioned by Bringhurst -- playfulness, hybridity, nostalgia, pastiche and recycling -- allude to theories of postmodernism developed in other fields. I think they reliably inform a working definition of postmodern type. They are starting points -- at least, that's my rationale for posting them -- from which theoretical statements might eventually be formulated. Or not, as the case may be.</p>
