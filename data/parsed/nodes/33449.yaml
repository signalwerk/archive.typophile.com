      <p>Poliphilus, created by Harry Lawrence in 1923, from shots of a 1495 book.<br>
      A relatively new medium, photography, was used to mechanically appropriate the genius of a type founder working in a far older technology. A postmodern, curation-as-art methodology, with the reproduced artefact becoming a hollow simulacrum of its original self. Type revival as recontextualization.</p>
