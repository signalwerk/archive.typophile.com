      <p><cite> Bringhurst &amp; 'Postmodern letterforms' </cite></p>
      <p>At the time when that was written saying postpodern was very fashionable and there was a great deal of confusion about how best to describe what was happening and how to judge it. It was also imperitive that what was happening be addresed in some way. I think if you read what he wrote there he was trying to make a bridge for his readers and what he was building to had to have been hazy in his own esitmation. No wonder hand waving was employed! What other choice did he have? Also, the making of type &amp; the use of type were coming back together which was a case PoMo style classification breaking. So I am not willing to condemn him for having put it that way - especially in that historical context. But I do think with 20/20 hindsight there are now better, more complex, more accurate &amp; more useful constructions that can &amp; should be employed. Also, if you read his "The Solid Form Of Language" you will see that this hand waving is atypical. In general his work is far more specific and grounded. And finally, there is no point in worshiping at the shrine of Bringhurst no matter how much you respect him - which I do in a big big way. So don't think you can cow me into backing down by invoking Bringhurst.</p>
      <p><cite> There is no longer any distinction between text and non-text, image and non-image. </cite></p>
      <p>On the surface of it ( &amp; in the era of Google) this is silly. Text is king because it is searchable. And even the power of the Image is enhanced with the use of tags. Maybe because the quote you have there is short I am not getting what he is after. And this sentence in particular seems to me crafted to sell books via excitement rather than as an excercise in creating greater clarity. I think Bruce is as much an entertainer as he is a theoretician. I am not slaging off him for that, but I am saying look at the source &amp; be critical of it. And again while Bruce Mau is a lot of fun, and thoughful &amp; provocative -  much as I respect him, I don't think he has a corner on truth.</p>
      <p><cite> So, perhaps looking at the technologies of so-called ‘postmodernity’ (Macintosh, PostScript, Fontographer, Internet, etc.) would allow the cultivation of a valid meaning for the term ‘postmodern type’. </cite></p>
      <p>Maybe you would like to explain what you mean &amp; stop simply waving your hands. Conflation is not a helpful way of thinking - especially about this.</p>
      <p>For example, re: John Cage etc: Typography and Type design are differnet things. </p>
      <p>- Certainly he is using type so we can agree it's typography.<br>
      - Is he designing a type face? No. He is using many of them. So there is no PoMo type there. There may be a use of type that supports a PoMo intent. They are not the same thing.<br>
      - There may also be a PoMo peice using type in ways that support a pomo intent. Again, not quite the same thing.<br>
      - A typeface based on this work would also not be Pomo for the reasons I have given before. </p>
      <p>If you are going to use the term Pomo with success get out you have to start making distinctions. With distictions comes relationships and with the investigation of relationships you could build to PoMo. And for the sake of being repetitive : A typeface on it's own does not contain a rich enough body of relationships to be PoMo in and of itself.</p>
      <p>As soon as somebody can make an arguement that is considered and convincing I will back down. I would even like that. But so far nobody has. Also, saying that sombody called something PoMo at one point or another doesn't make it so and isn't the basis for a debate.</p>
      <p>Hrant I llike your logo-ized way of typing PoMo so I stole it.</p>
