  html: |-
    <p><a class="freelinking external" href="http://typinglot.com" rel="nofollow">TypingLot</a> is an urban type collection. I started shooting these with an iPhone, cropped and collected on an instagram account on daily basis. I live in New York and teach in New Jersey. Most of them are from NY/NJ area. However, the collection also includes from other cities that I visited over the last year like Helsinki, Istanbul, New Orleans, Maine, Izmir, Tallinn and Ankara. </p>
    <p>Atif Akin<br>
    <a href="http://paganstudio.com" title="http://paganstudio.com">http://paganstudio.com</a></p>
