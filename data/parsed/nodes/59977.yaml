    <p>Looking for a Sans Serif typeface which will be used for a Gardens identity in South East Asia. </p>
    <p>The object of the typography is to reflect:<br>
    • Clarity (simplicity) for use throughout signage (there will be some areas of the site where the type will be used at a size of three meters in height).<br>
    • Intrigue through organic elements when used at a interpretative level (to subtly reference the concept of the gardens/plant forms – rounded tips, organic flourishes etc).<br>
    • Large variation (from thin to bold/black) with the possibility of a slab serif relative; although this is not a requirement.<br>
    • The type should balance well against the languages of the far east, notably Chinese/Mandarin, Japanese, Malay (all signage will be set in a minimum to two languages)</p>
    <p>I have trailed through numerous type foundries sites to find solutions. One suggestion was Stag Sans although this typeface is primarily used in an editorial context ( <a href="http://vllg.com/Schwartzco/StagSans/mudTyper+Weights/" title="http://vllg.com/Schwartzco/StagSans/mudTyper+Weights/">http://vllg.com/Schwartzco/StagSans/mudTyper+Weights/</a>). </p>
    <p>The other option is Vista Sans (Émigré). Vista has the relevant ‘organic elements’ although feels slightly unrefined and clumsy when used at large type sizes; notably signage.</p>
    <p>It would be great if the family had variations which varied from simplicity (singage) to 'creative' (interpretation/identity).</p>
    <p>Any ideas? Help would be greatly appreciated. Thanks D.</p>
