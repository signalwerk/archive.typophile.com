    <p>FLOOD BOOK, becomes the winner of the 2009 AIGA New Orleans Design Award for experimenting and social relevance. <a href="http://www.aiganeworleans.org/events/design-awards" title="http://www.aiganeworleans.org/events/design-awards">http://www.aiganeworleans.org/events/design-awards</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Page1_FLOOD_BOOK_4887.gif"></div><p></p>
    <p>FLOOD BOOK, as it is named, is a post-Katrina rant—or repetitive chant—with rhyming verse written in Yat which is a local, New Orleanian dialect. Its a little book, the size of a short novella, with compelling illustrations and simple, classical type. The author is Max Cafard, a lifelong inhabitant of the Island of New Orleans, he is a surre(gion)alist writer and pre-ancientist philosopher. He is the author of "The Surre(gion)alist Manifesto and Other Writings" (Exquisite Corpse, 2004) and many other works. His writings have appeared in Exquisite Corpse, Anarchy: A Journal of Desire Armed, The Fifth Estate, and other questionable publications. </p>
    <p>The body of its text is set in Sabon Roman and Italic, 10 point. The book cover and title page were set in Berthold Akzidenz Grotesk, Extra Bold Condensed, 182.829 point and Medium Condensed Italic, 14 point. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Colophon_FLOOD_BOOK_3978.gif"></div><p></p>
    <p>FLOOD BOOK has been included in "Typeface: Classic Typography for Contemporary Design" by Tamye Riggs (Author), James Grieshaber (Collaborator).</p>
    <p><a href="http://www.amazon.com/Typeface-Classic-Typography-Contemporary-Design/dp/1568988109/ref=sr_1_1/192-4528142-6548946?ie=UTF8&amp;s=books&amp;qid=1262357468&amp;sr=1-1" title="http://www.amazon.com/Typeface-Classic-Typography-Contemporary-Design/dp/1568988109/ref=sr_1_1/192-4528142-6548946?ie=UTF8&amp;s=books&amp;qid=1262357468&amp;sr=1-1">http://www.amazon.com/Typeface-Classic-Typography-Contemporary-Design/dp...</a><br>
    <a href="http://search.barnesandnoble.com/Typeface/Tamye-Riggs/e/9781568988108/?itm=6" title="http://search.barnesandnoble.com/Typeface/Tamye-Riggs/e/9781568988108/?itm=6">http://search.barnesandnoble.com/Typeface/Tamye-Riggs/e/9781568988108/?i...</a></p>
    <p>It was also the subject of Mrs. Collins' talk about FLOOD BOOK and notions of readable text, New Orleans-style, Sunday, July 19, 12:00 noon at TypeCon 2009 in Atlanta,  <a href="http://www.typecon.com/calendar.php" title="http://www.typecon.com/calendar.php">http://www.typecon.com/calendar.php</a><br>
    <a href="http://www.typophile.com/node/59406" title="http://www.typophile.com/node/59406">http://www.typophile.com/node/59406</a></p>
    <p>FLOOD BOOK can be purchased here:</p>
    <p><a href="http://www.feltandwireshop.com/products/513" title="http://www.feltandwireshop.com/products/513">http://www.feltandwireshop.com/products/513</a><br>
    <a href="http://www.aiganeworleans.org/shop/books--literature/flood-book" title="http://www.aiganeworleans.org/shop/books--literature/flood-book">http://www.aiganeworleans.org/shop/books--literature/flood-book</a></p>
