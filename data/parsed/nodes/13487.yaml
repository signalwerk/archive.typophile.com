    <p><strong><a href="/wiki/Indicies" class="freelinking" rel="nofollow">Indicies</a> : <a href="/wiki/Organizations" class="freelinking" rel="nofollow">Organizations</a> : Schreibwerkstatt Offenbach</strong></p>
    <p><em>Schreibwerkstatt Klingspor Offenbach e.V. für Kalligrafie</em>, the Offenbach/Klingspor Calligraphy Workshop</p>
    <p>Founded by <a href="/wiki/Karlgeorg%20Hoefer" class="freelinking" rel="nofollow">Karlgeorg Hoefer</a> during the 1980s, this organization offers calligraphy courses to the public. They also organize lectures and exhibitions.</p>
    <p>Their website may be found at: <a href="http://www.schreibwerkstatt-klingspor.de/" rel="nofollow">www.schreibwerkstatt-klingspor.de/</a></p>
    <p>They are loosely associated with the <a href="/wiki/Klingspor%20Museum" class="freelinking" rel="nofollow">Klingspor Museum</a>.</p>
