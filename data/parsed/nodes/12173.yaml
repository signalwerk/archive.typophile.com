    <p>Offenbacher Haggadah from&nbsp;1927</p>
    <p>a limited private print for <a href="/node/12125" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Rudolf Koch</a>s friend notary Dr. Guggenheim. <a href="/node/add/wiki?edit%5Btitle%5D=Max%20Dorn" title="Create node &quot;Max Dorn&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Max Dorn</a>, Offenbach was the artdirector/layouter/executive printer for this project. The book was printed in two colors on <a href="/node/add/wiki?edit%5Btitle%5D=Zerkall" title="Create node &quot;Zerkall&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Zerkall</a> Bütten paper including 12 handcolored illustration pages by <a href="/node/add/wiki?edit%5Btitle%5D=Fritz%20Kredel" title="Create node &quot;Fritz Kredel&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Fritz Kredel</a>. The uniqueness is the combination of the <a href="/node/add/wiki?edit%5Btitle%5D=Jessen" title="Create node &quot;Jessen&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Jessen</a> Schrift (a gothic blackletter design) and hebrew&nbsp;typefaces.</p>
    <p>It contains also pages with musical notes cuted in type by <a href="/node/12125" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Rudolf Koch</a>s son Paul who worked by this time as apprenticie in the print office of <a href="/node/add/wiki?edit%5Btitle%5D=Klingpor" title="Create node &quot;Klingpor&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Klingpor</a>.</p>
    <p>The work was set in the 14pt pre-final version of the later called Peter-<a href="/node/add/wiki?edit%5Btitle%5D=Jessen" title="Create node &quot;Jessen&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Jessen</a>-Schrift.</p>
    <p>The price was in 1928 <span class="caps">60RM</span>, no easy money by this time. Today you have to pay between 600 - 1000 Euro, if you have the chance to get some of these rare&nbsp;items. </p>
    <p>A public copy is available at <a href="/node/add/wiki?edit%5Btitle%5D=Deutsche%20B%C3%BCcherei" title="Create node &quot;Deutsche Bücherei&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Deutsche Bücherei</a>, Leipzig at the Lesesaal des Deutschen Buch- und Schriftmuseums (Typespecimen library) (ask for item <strong>1927 B 3622</strong>) and in the library of the <a href="/node/add/wiki?edit%5Btitle%5D=Klingspor-Museum" title="Create node &quot;Klingspor-Museum&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Klingspor-Museum</a>.</p>
