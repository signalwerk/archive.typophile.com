    <p>Offenbacher Haggadah from 1927</p>
    <p>a limited private print for <a href="/wiki/Rudolf%20Koch" class="freelinking" rel="nofollow">Rudolf Koch</a>s friend notary Dr. Guggenheim. <a href="/wiki/Max%20Dorn" class="freelinking" rel="nofollow">Max Dorn</a>, Offenbach was the artdirector/layouter/executive printer for this project. The book was printed in two colors on <a href="/wiki/Zerkall" class="freelinking" rel="nofollow">Zerkall</a> Bütten paper including 12 handcolored illustration pages by <a href="/wiki/Fritz%20Kredel" class="freelinking" rel="nofollow">Fritz Kredel</a>. The uniqueness is the combination of the <a href="/wiki/Jessen" class="freelinking" rel="nofollow">Jessen</a> Schrift (a gothic blackletter design) and hebrew typefaces.</p>
    <p>It contains also pages with musical notes cuted in type by <a href="/wiki/Rudolf%20Koch" class="freelinking" rel="nofollow">Rudolf Koch</a>s son Paul who worked by this time as apprenticie in the print office of <a href="/wiki/Klingpor" class="freelinking" rel="nofollow">Klingpor</a>.</p>
    <p>The work was set in the 14pt pre-final version of the later called Peter-<a href="/wiki/Jessen" class="freelinking" rel="nofollow">Jessen</a>-Schrift.</p>
    <p>The price was in 1928 60RM, no easy money by this time. Today you have to pay between 600 - 1000 Euro, if you have the chance to get some of these rare items. </p>
    <p>A public copy is available at <a href="/wiki/Deutsche%20B%C3%BCcherei" class="freelinking" rel="nofollow">Deutsche Bücherei</a>, Leipzig at the Lesesaal des Deutschen Buch- und Schriftmuseums (Typespecimen library) (ask for item <strong>1927 B 3622</strong>) and in the library of the <a href="/wiki/Klingspor-Museum" class="freelinking" rel="nofollow">Klingspor-Museum</a>.</p>
