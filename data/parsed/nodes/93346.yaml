    <p>On 24 May, Russia, Bulgaria, Macedonia, and other countries that follow Eastern Ortodox tradition, celebrate Saints Cyril and Methodius day. This day also commemorates the invention of the Glagolitic and Cyrillic alphabets.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Cyrillic-celebrations-2012_6425.png"></div><p></p>
    <p>Similarly to the last year we have decided to do a sale of all our Cyrillic and PE fonts and this year we added a presale of our upcoming face <a class="freelinking external" href="http://www.rosettatype.com/index.php?action=portal/viewContent&amp;cntId_content=2983&amp;id_section=141" rel="nofollow">Sutturah Cyrillic</a> as an extra bonus. Use the code<strong> 1111aa4</strong> during checkout in our e-shop to get 31 % discount on all fonts containing Cyrillic*. The offer ends on 31 May 12:00 PM CET.</p>
    <p>*) The discount applies to:</p>
    <p>Neacademia Cyrillic (price after discount: 66 €/2 fonts, 41 €/font)<br>
    Maiola Cyrillic (128 €/6 fonts, €27 €/font)<br>
    Maiola PE (262 €/6 fonts, 55 €/font)<br>
    Skolar Cyrillic (128 €/6 fonts, 27 €/font)<br>
    Skolar PE (296 €/6 fonts, 61.4 €/font)<br>
    Sutturah Cyrillic Presale (31 €/font)</p>
