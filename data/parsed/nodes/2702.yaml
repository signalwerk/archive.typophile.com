    html: "<p>I disagree. Friz Quadrata is very different in certain ways: look at the g and e in the lower-case, and look at the overall contrast between thicks and thins -- Friz has a much lower contrast than this face, which, I believe, is much closer to the Carmina I identified earlier.</p>"
