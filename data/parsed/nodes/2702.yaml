    html: "<p>I think Chesh is right. Probably a knock-off of Carmina. The character shapes are there, but the spacing is horrible. You often see that with knock-offs. And, it's definitely not Friz. <br> <br>Also: Note to Mark Taylor: Carmina is not \"the Mac equivalent\" of your Fritz font. Carmina is the original and is available for both Windows and Mac. Fritz is just a bad copy. There may or may not be a Mac version of it. You would be better off with Carmina unless you absolutely must have that bad spacing.</p>"
