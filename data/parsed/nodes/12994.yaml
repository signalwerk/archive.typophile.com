    html: |-
      <p>The problem with editing is line and character breaks.  In AI, you often get chunks of letters in groups that make no sense. I would drag select all the text you wish to edit with the pointer tool; then switch to the text insertion tool and drag a box, then paste.  You then get all the text together but usually need to add word breaks where there were line breaks.  Sound like a pain in the tuchous? You bettcha.  That is why it is better to make changes in the originating application unless you are in dire straights.</p>
      <p>ChrisL</p>
