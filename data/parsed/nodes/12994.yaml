    html: |-
      <p>When importing from Word to Quark rather than cut and paste, if you import the text using command e, it will keep it's formatting, and if it was created on a Mac and you have the same font it will import at the same sizes and font, however every text document will need close attention lookout for double wordspaces, incorrect quote marks and apostrophes, en dashes, tabs, ellipsis etc. The typographer's checklist thread will give you further investigations. For the pdf justified text will occasionally alter ranging – if possible I would ask the client to provide the artwork or do the chnages and resend the document – safer in the long run.<br>
      Tim</p>
