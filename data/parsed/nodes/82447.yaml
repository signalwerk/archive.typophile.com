    <p>Been looking for hours on what this is called and how it can be accomplished (hopefully in indesign, illustrator, fireworks or photoshop!)</p>
    <p>It's like a drop shadow, but different.<br>
    The shadow from the letters on the left side land down and to the right, the shadow from the letters on the right land down and the left, and the shadows in the middle go straight down.<br>
    It's like a Star Wars effect.</p>
    <p>I attached a sample of something very similar to what I want to do. </p>
    <p>I appreciate any help!</p>
    <p>Thanks.</p>
