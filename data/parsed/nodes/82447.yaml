      <p>Hi there<br>
      70's effect?<br>
      This looks like a 3D render rather than a normal effect.<br>
      Of course you can accomplish the same in photoshop<br>
      but it will take you a good amount of time, as you have<br>
      to draw all the shadows by hand. There is also some<br>
      reflection on the text which would make it even harder<br>
      to do it by hand.</p>
      <p>It would be easier to use Cinema 4D or something similar.</p>
