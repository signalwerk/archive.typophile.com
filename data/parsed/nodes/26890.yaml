    <div class="info">Submitted by <a href="/user/3" title="View user profile.">Jared Benson</a> : 10.Dec.2003 2.54pm </div>
      <p>FontShop is looking to fill a type related customer service position. This job could be a very good career for the right person. Please note that this is not a graphic or type design position. <br> <br><b>Responsibilities include:</b> <br> <br>_ Answering customer phone calls / emails <br>_ Charging customers credit card <br>_ Preparing fonts on disks for customer orders <br>_ Compiling and compressing fonts for email delivery <br>_ Packing and shipping of fonts and images <br>_ Preparing quotes and invoices <br>_ Minimal technical support <br>_ Font Identification/research <br>_ Font sample production <br>_ Data Entry <br> <br><b>You MUST have:</b> <br> <br>_ Patience and diplomacy with customers <br>_ An eye for detail and follow through <br>_ Ability to multi-task AND DO IT WELL <br>_ Ability to learn quickly and work efficiently <br>_ Ability to learn from your mistakes <br>_ Accurate typing skills <br>_ Basic math skills <br>_ Commitment to learning our business and our products (30,000 fonts and a small image library that is growing) <br>_ Common sense <br>_ Good written and spoken English for business/customer correspondence <br>_ Ability to prioritize and meet daily deadlines <br> <br><b>You MUST have working knowledge of most of these software apps:</b> <br> <br>_ NAVISION Database and Accounting software <br>_ MS Office <br>_ Compression software <br>_ Web browsers <br>_ Email clients <br>_ FileMaker <br>_ Quark/InDesign <br>_ Adobe Acrobat <br>_ Palm Desktop Software <br>_ ATM <br>_ Mac OS 9 and X, Windows <br> <br>This is not a graphic design or type design job. The training period is 3 months but may take up to 6 months to a year to really become competent as the main customer service and sales person. Responsibilities could grow to include customer relations for large licenses, type libraries, complicated font purchases and custom type work. <br> <br>This is a small office and you must be motivated to do your best, come to work on time and be in the office when scheduled. Reliability is a must. Quality, accurate, accountable, and flexible work habits are key attributes. Once trained you will be expected to work independently AND with the team. This is a deadline driven business and teamwork is a must to fulfill the demand for a quick turn around time. Overtime is not the norm but you may be asked if and when necessary.  <br> <br>Salary is commensurate based on skill and experience. Pay rate during training period is $12-$15. Good benefits plan after 3 months. Hours are 8-5, M-F. <br> <br>Please send resum</p>
