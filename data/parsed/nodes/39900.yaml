    html: |-
      <p>If you're making a numbered list, tabular figures are necessary--whether oldstyle or lining.<br>
      If you have a column of phone numbers (say on a business card--even if only two numbers), tabular figures make it so much neater.<br>
      Price lists, dates, contents pages, recipes, etc.<br>
      Wherever one or more numbers appears flush above another, then you should use tabular figures.<br>
      And in those situations, why not have the option of old style figures?</p>
