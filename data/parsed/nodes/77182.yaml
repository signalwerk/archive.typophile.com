    <p>Hi, all:</p>
    <p>Having reached a good basic grasp of InDesign (or so I think), it's time for me to take my typographic skills to the next level: I want to learn better the finer details of kerning, tracking, and h&amp;j--to know when to rely on a font's metrics and how best to tweak them throughout a text when not.</p>
    <p>I know the best way to learn is still by doing, and I plan to do as much as I can. But with a PhD in another field and a full-time day job, and freelance design on the side, it's got to be self-education for me. Courses and apprenticing are out of the question, and anything I can do to speed the process along within reason would be good.</p>
    <p>Here are some of the resources I've already amassed, thanks to past discussions on Typophile.</p>
    <p>Bringhurst's <em>Elements</em> (and Richard Rutter's online interpretation for the web)<br>
    Dowding, <em>Finer points in the spacing and arrangement of type</em><br>
    Felici, <em>Complete manual of typography</em><br>
    Haslam's <em>Book design</em><br>
    Hendel's <em>On book design</em><br>
    Hochuli's <em>Designing books</em> and <em>Detail in typography</em><br>
    Mitchell &amp; Wightman's <em>Book typography</em><br>
    Ari Rafaeli's <em>Book typography</em><br>
    Williamson's <em>Methods of book design</em></p>
    <p>I know these are good for discussions of general approaches to setting type in print. But I really need to know more about the mechanics of adjusting type in InDesign--specifically, using GREP and scripts. I've run across resources like Peter Kahrel's kerning script for InDesign, and his O'Reilly book on GREP, but I don't think I'm even at the level where I could use them properly, or accurately evaluate the relative advantages and drawbacks of GREP and scripts (or recognize when it would be better just to edit the kerning tables in a font directly, something I feel is well beyond my abilities right now). Any suggestions?</p>
