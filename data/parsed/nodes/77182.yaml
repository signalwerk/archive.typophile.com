      <p>I haven't read Mitchell &amp; Weightman's <cite>Book Typography</cite>. </p>
      <p>I'll allow that I find <cite>Art of the Printed Book</cite> and <cite>An Atlas of Typeforms</cite> very good typography manuals. They don't tell you rules, they show you how things were done in times past. Descriptive, rather than prescriptive. We are always reinventing typography, ever so slightly.</p>
      <p>I like Nick's idea.</p>
      <p>I like too exploring some of the old verbotens. For example, think about slight modifications of letters as an aid to justification, or slight changes in tracking. With the old increments of 1/18 unit em, or even the 1/54 unit em, you wouldn't want to do this. Now we have 1/1000 unit em. And InDesign will allow a decimal percentage of that.</p>
      <p>Even rethink the whole notion. In scribal times before Gutenberg, don't you think they modified letters a bit, as they wrote (copied), to get the line to fit? Zapf did some work on alternate characters as an aid to justification and even word spacing. Implementing the idea was a problem for the layout programs, ultimately never addressed.</p>
      <p>Different tools and different audiences offer a chance to reexamine solutions. But they should be *solutions*, not just clever ideas.</p>
