      <p>I see some on your list I'd cross off.</p>
      <p>* * *</p>
      <p>It is probably the old man in me, but most anything from the Hyphen Press is pretty good.</p>
      <p>For the overlap between design and composition, see esp. <cite>Detail in Typography</cite></p>
      <p><a href="http://www.hyphenpress.co.uk/authors/jost_hochuli" title="http://www.hyphenpress.co.uk/authors/jost_hochuli">http://www.hyphenpress.co.uk/authors/jost_hochuli</a></p>
      <p>Though I'd note that some of the spacing in the lovely examples wouldn't survive in the text as set -- generally true for Dowding, too.</p>
      <p>Just one example: All that lovely space between the parens and letters in the examples is larger than a word space in a tight line. You wind up with the parens being closer to the previous word, even though separated by a space, that to the letter it encompasses.</p>
      <p>Composition is all about compromise. Still, the examples in Hochuli's book show some worth considering.</p>
