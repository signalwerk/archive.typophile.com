      <p>Hmm.</p>
      <p>I'd ditch Ari Rafaeli's <cite>Book typography</cite>, but my reasons may mixed with  personal ones. He quoted a portion of an email of mine to another person (not Rafaeli) without my permission. Not only was it a portion, but also dependent on a conversation which was not included. In other words, he distorted my thinking for an ulterior purpose.</p>
      <p>And that, it seems to me, was to elevate himself by running down Rich Hendel, who, I'll allow, is a friend. Aside from that, I find it simply a rehash of early to mid twentieth century British typography. Better to get that from the original sources.</p>
      <p>As to that: I was enamored of Dowding at first, but when trying to actually set books with his tight spacing, kept running into problems. Part of this may be because I set mainly scholarly texts, which are not only peppered with long words, but have a relative dearth of short ones. Along with hyphenation, it is the number of word spaces in a line that control how tight or loose those spaces must be to justify a line -- at least, if you don't alter the type itself. The number of characters has no bearing. </p>
      <p>Just as an example, hyphenation too is worth considering. Some hyphen points are awkward, but will give more even spacing (or tighter spacing) in the text. So, do you go for clearer hyphenation, or more even spacing? Or take it as a compromise, with no clear rules. Would you let a single "A" of a title end a line (as in <cite>A Bridge too Far</cite>, or would you keep it with at least one more word of the title? How about "vol. 21"? Break between for more even word spacing, or keep them together? Etc. </p>
      <p>So I'd take Dowding as a powerful apologist. <cite>Finer points</cite> is worth reading, but in the end, Dowding will sacrifice everything for tight word spacing. And that, I'd argue, is not an aesthetic amenable to reading, which is still the point of setting type. </p>
      <p>Same with Bringhurst, to a lesser extent. Well worth reading, not always worth following.</p>
      <p>Perhaps that is the point: Many of these texts argue strongly for certain positions, and that can be quite useful if you take the arguments as polemics. But if you take these texts as giving rules to follow, things to emulate without question, you're not doing the work of a compositor.</p>
      <p>For books, both interior design and composition are at their best when reading the text is served. Graphic design and typographic purity have to take the back seat.</p>
