      <p>Carding is done to have a constant text page depth. Suppose a page break would create a widow? What to do, run the spread short? That's the most common solution. Maybe you can make/save a line, another solution, which affects word spacing. Or you can card, essentially running one line less on a page, but increasing the leading so the text goes to the bottom of the page.</p>
      <p>All these "solutions" involve compromise. If someone says one solution is like stealing sheep, you can find another who thinks just the opposite.</p>
