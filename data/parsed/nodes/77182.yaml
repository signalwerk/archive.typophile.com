      <p>"I can recommend trying to create a digital facsimile of an old foundry-metal or linotype face document."</p>
      <p>That sounds like a wonderful exercise. I think I'll try it.</p>
      <p>"Zapf did some work on alternate characters as an aid to justification and even word spacing. Implementing the idea was a problem for the layout programs, ultimately never addressed."</p>
      <p>Wouldn't it be interesting if InDesign had a "contextual alternates" option in the justification box? I.e., use variant forms with different widths as a way of justifying lines, which is, of course, what the scribes did.</p>
      <p>Incidentally, printed Hebrew will still use very stretched versions of just one or two characters in a line to justify the line, typically characters with prominent horizontal strokes. This is a holdover from Hebrew's long scribal tradition. The Latin alphabet has never really done this in print.</p>
