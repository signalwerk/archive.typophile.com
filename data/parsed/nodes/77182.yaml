      <p><cite>but you can see in Dowding's own book the downside of being dogmatic about it.</cite></p>
      <p>Yes, if you have the Wace edition. Not if you have the Hartley &amp; Marks edition. </p>
      <p>Spend the money to get Godine's edition of the <cite>Art of the Printed Book</cite>. My copy is not to hand, but there is a sample of 19th century French Typography toward the end of the book where word spacing is quite large. So to is the leading, and the margins. It all fits. No spatial relationship in a book should be considered by itself.</p>
      <p>Here is an irreverent thought I once had: Why is the bottom margin traditionally so large? Now, folio-sized books had to be read at a table or desk. You don't want the first line on the page to be too far away. What about the last line? Suppose you have a significant belly?</p>
      <p>* * *</p>
      <p>As to modifying letters. Set a few lines of type, ragged right. Print out the page. Now "condense" it 1/1000 of an em. Print that out. Put the two pages away, and look at them, independently, the next day. Not together, but sequentially. Can you tell them apart?</p>
      <p>Set justified copy. Find a paragraph where the wordspacing is just going a bit loose. Make the screen display smallish -- normal InDesign screen display with spreads is about right. One thing you'll see about that paragraph is it appears a bit lighter than the others. Now, track it a bit -- usually no more than -4 or -5, condense it to 99 percent, so as to save a line. All of a sudden, its color changes, closer to the other paragraphs.</p>
      <p>Which setting is worse?</p>
      <p>You can do the same thing with carding, which Richard Eckersley was so fond of. No, you can't see a .1 point difference in leading. But the color of the plus-carded page will be lighter. Which is more important, completely regular page bottoms, or the color of the page?</p>
      <p>Etc.</p>
