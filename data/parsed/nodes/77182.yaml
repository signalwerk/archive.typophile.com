      <p>William, it's hard to find Young's books--not surprisingly, libraries in the Illinois systems and Illiac are loath to lend their copies out. But I did track down <em>Logotypes and letterforms</em>. </p>
      <p>Charles, I agree: it seemed pretty clear to me early on that a lot of books on type are polemics (just look at Tschichold!), and that what we get out of most of these sorts of books is not answers but clear statements of principle, and forthright questions and ways of framing answers, values to be traded off against each other when making typographic judgments. That's certainly what I've gotten out of them so far. And since academic texts are the ones I'd be most likely to be setting, the tip about Dowding is well appreciated. I tend myself to favor close spacing (and I saw that Rafaeli got many of his ideas about that from Dowding), but you can see in Dowding's own book the downside of being dogmatic about it.</p>
      <p>I also think Nick's idea is intriguing. I have a copy of <em>Art of the printed book</em> on my shelf and a little bit of time on my hands over the holidays. And maybe after some quality time with Kahrel and Lynda.com I might have the skills to give it a constructive go. (But--call me the neophyte purist zealot--I don't think I could make myself modify letters.)</p>
