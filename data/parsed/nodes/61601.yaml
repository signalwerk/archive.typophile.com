    <p>Hello.  </p>
    <p>I'm a total newbie, so please forgive me if I sound very uneducated.  Typography is far from my specialty, but I know enough about it to know how important it is in the branding of a product.</p>
    <p>My name is Kristen and I am currently putting together a user experience web page.  I work for a company who has traditionally been a market research company and is now starting up a user experience department.  There is going to be a logo, headings and body text, and I'm not sure if they should be the same or different.</p>
    <p>Here is as much info about my page: </p>
    <p>Audience: Primarily, any company that has a product or service (e.g. cell phones, web portals, any company with a web page, etc.) and second, other user experience experts and interaction designers.</p>
    <p>I'm looking for a type face that is very open, easy to read, lots of white space, etc.  Something that is clean but also gives the feeling of modernity and design excellence.</p>
    <p>Any ideas?  Is there a standard I should be using and can I change fonts within a page or should they all remain consistent?</p>
    <p>Any advice would be GREATLY appreciated.</p>
    <p>Thank you!!!</p>
