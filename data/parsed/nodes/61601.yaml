      <p>Kristen, the "get a designer" opinion above is doubly relevant because you say your target audience includes designers! They will pick apart any design that's not highly accomplished, and never trust you with anything. That said, from our end we can certainly recommend typefaces that will help you achieve your goals, while hoping that the suggestions will be used wisely - because for one thing it's not just what fonts you use, it's how you use them.</p>
      <p>One thing we need to get out of the way first: will you be rendering the type as images? Because if not, you either have to use special font "embedding" technology or stick to fonts that are available on most systems (since the text will be rendered on the user's computer) which is highly restrictive.</p>
      <p>BTW, the size declaration of the logo image at the top-right of your web page (<a href="http://www.pmgintelligence.com/" title="http://www.pmgintelligence.com/">http://www.pmgintelligence.com/</a>) is wide by one pixel, causing the "M" to be broken like that.</p>
      <p>hhp</p>
