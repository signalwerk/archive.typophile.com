    html: "<p>how does the OS effect the font? <br> <br><img src=\"http://www.typophile.com/forums/messages/29/8441.gif\" alt=\"idea\"> <br>something i noticed about randy's pairs: disregarding the last pair, each pair has one h with a straight joint, and one with a curvy joint. and their darkness more or less evens when the the straight-joint h has the joint pixel lighter then the curvy-joint h. in such small pixel fonts, the curvy-joint is in itself a clotting-reducer, because it is surronded by two empty pixels which decrease the darkness in the joint.  <br>such forces only exist in one-pixel-stem small fonts.</p>"
    html_clean: "<p>how does the OS effect the font? <br> <br><img src=\"http://www.typophile.com/forums/messages/29/8441.gif\" alt=\"idea\"> <br>something i noticed about randy's pairs: disregarding the last pair, each pair has one h with a straight joint, and one with a curvy joint. and their darkness more or less evens when the the straight-joint h has the joint pixel lighter then the curvy-joint h. in such small pixel fonts, the curvy-joint is in itself a clotting-reducer, because it is surronded by two empty pixels which decrease the darkness in the joint.  <br>such forces only exist in one-pixel-stem small fonts.</p>"
