    html: <p>Hello guys, <br> <br> I think that greyscale fonts are very promising, but the design problems actually still on the classic pixel fonts. More than 20 years and it seems that many good fonts are showing and growing on internet, as a real need for many designers.  <br> <br>Nintendo-like layout solved the resolution design problem 15 years before kiok layout style just start growing tasting all the posibilities of working dot by dot. <br> <br>Now bitmap fonts works well on flash, but many designers work on html for consider that flash is a waste of time, to boring to wait the loading time, now how much years have to pass to saw more than 50% of internet little Flash-pixel fonts working well? ...we can wait a long time for the color fonts as a real thing, btw is interesting to try add greys, but every size needs a diferent grey trheatment. <br> <br>Itay; please finish your gaya version without greys, taste in a paragraph text, and think about <br>today. Your design is great and simple, so then you got a "real usefull" font taht many designers will want to use, <br> <br>MH.</p>
