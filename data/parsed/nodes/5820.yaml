    html: "<p>Note: I think it's important to say what type of monitor you're using at what resolution. This will vastly affect what you see. <br> <br><b>CRT at 1280 x960</b> <br>Through my eyes there are three groups. The difference between the these pairs is REALLY subtle, but I will try my best. <br> <br>light ---&gt; dark <br>[EC] [FB] [DA] <br> <br>The only ones that are too obviously dark to my eyes are the DA pair. Both of the other pairs are fine, though I think that EC gets the nod for eveness when I get my nose 3 inches from the screen (scrambling my brain). <br> <br>My vote: E <br> <br><b>LCD 1152 x 768</b> <br>light ---&gt; dark <br>[EC] [FB] [DA] - same as CRT <br> <br>The choices look way different on the LCD. Part of that is the lower resolution, but part is also the nature of the beast. The shapes were much more defined. It was obvious which branches curve to meet the vertical stem and which meet straight in. Still my choice is E on the LCD. <br> <br>I cheated afterwards with much interest. <br>Thanks for the test. <br> <br>Randy</p>"
