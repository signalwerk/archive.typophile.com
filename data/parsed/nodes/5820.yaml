  - id: 41414
    user: 1250
    date: 2003-04-01T14:49:00
    date_raw: 1 Apr 2003 — 2:49pm
    votes: null
    html: "<p>&gt; point 3 <br> <br>Don't try to use grays in a too-sophisticated manner (even though it's tempting). The low resolution of screens is still a very real limit. So for example in your lc \"a\" the gray pixel where the <i>top</i> of the bowl connects to the stem is supposed to convey a gentle taper of the stroke (right?) but that sort of thing is too subtle* - it just creates more problems in terms of contrast against the background. On the other hand the gray pixel where the <i>bottom</i> of the bowl meets the stem is good, because it helps reduce the clotting. <br> <br>* Note that you have more room for such subtlely in darker weights (and in greater bit-depths). <br> <br>&gt; sell <br> <br>I think bitmap fonts are very hard to sell - they have to be cheap or free. And in my case since I don't make enough fonts during the year, I have to keep a high price bracket. Plus the limit on the number of bitmap fonts that can exist in the market is much smaller than for outline fonts (because of resolution - especially for aliased fonts). <br> <br>Here's a word set in Mana-16PPEM: <br> <br><img src=\"http://www.typophile.com/forums/messages/29/8249.gif\" alt=\"mana_dog\"> <br> <br>If I can get my a-a bitmap fonts to actually work on Windows* then I will give them away, and sell the full (outline + bitmap) versions to people who get hooked. <br> <br>* MacOs would be great too, but it's secondary in terms of users - I want to enable the delivery of large quantities of text to/by \"the masses\", not pretty layouts. <br> <br>&gt; outline font <br> <br>Well, making a good outline font is a lot of work (and the technical task of matching the bitmaps is a little bit of additional work), but it's not a mountain. The tricky part is embedding the bitmaps into the outlines so they work right - the beta version of BitFonter I was using couldn't get it to work. And now MacOS seems to hate bitmap fonts. <br> <br>hhp <br></p>"
    html_clean: "<p>&gt; point 3 <br> <br>Don't try to use grays in a too-sophisticated manner (even though it's tempting). The low resolution of screens is still a very real limit. So for example in your lc \"a\" the gray pixel where the <i>top</i> of the bowl connects to the stem is supposed to convey a gentle taper of the stroke (right?) but that sort of thing is too subtle* - it just creates more problems in terms of contrast against the background. On the other hand the gray pixel where the <i>bottom</i> of the bowl meets the stem is good, because it helps reduce the clotting. <br> <br>* Note that you have more room for such subtlely in darker weights (and in greater bit-depths). <br> <br>&gt; sell <br> <br>I think bitmap fonts are very hard to sell - they have to be cheap or free. And in my case since I don't make enough fonts during the year, I have to keep a high price bracket. Plus the limit on the number of bitmap fonts that can exist in the market is much smaller than for outline fonts (because of resolution - especially for aliased fonts). <br> <br>Here's a word set in Mana-16PPEM: <br> <br><img src=\"http://www.typophile.com/forums/messages/29/8249.gif\" alt=\"mana_dog\"> <br> <br>If I can get my a-a bitmap fonts to actually work on Windows* then I will give them away, and sell the full (outline + bitmap) versions to people who get hooked. <br> <br>* MacOs would be great too, but it's secondary in terms of users - I want to enable the delivery of large quantities of text to/by \"the masses\", not pretty layouts. <br> <br>&gt; outline font <br> <br>Well, making a good outline font is a lot of work (and the technical task of matching the bitmaps is a little bit of additional work), but it's not a mountain. The tricky part is embedding the bitmaps into the outlines so they work right - the beta version of BitFonter I was using couldn't get it to work. And now MacOS seems to hate bitmap fonts. <br> <br>hhp <br></p>"
