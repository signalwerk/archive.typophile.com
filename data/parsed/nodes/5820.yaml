    html: "<p>Itay, it's great to see work in hand-anti-aliasing: it's the ideal method for on-screen readability. Unfortunately, OSes don't support it well. It's a shame, but things like BitFonter are swimming against the current. <br> <br>I've been doing this stuff since '98, but there's still no good way to deliver them... Anyway, some ideas: <br>- The darker the font, the better you can apply the grays. With one-pixel bodies it's pretty hard. <br>- Resist the urge to place a lot of grays: it's better to use less grays than more, simply because blurriness is worse than aliasing. For example, those bits at the tops of ascenders are distracting. <br>- Keep the bodies of the letters as black as possible. For example, in the \"a\" the bottom-right gray is good, but the top-right gray is bad. <br>- Be careful how much you show your work in public: it takes a lot of work to get the grays <i>just right</i>, but it's very WYSIWYS: What You See Is What You Steal... <br>- Consider doing an outline font to match: give away the bitmap-only version, sell the full version. <br> <br>Take this to heart: you have to be extremely pragmatic. You have to make decisions that seem formally incorrect to arrive at good readability. <br> <br>Good luck! <br> <br>hhp <br></p>"
    html_clean: "<p>Itay, it's great to see work in hand-anti-aliasing: it's the ideal method for on-screen readability. Unfortunately, OSes don't support it well. It's a shame, but things like BitFonter are swimming against the current. <br> <br>I've been doing this stuff since '98, but there's still no good way to deliver them... Anyway, some ideas: <br>- The darker the font, the better you can apply the grays. With one-pixel bodies it's pretty hard. <br>- Resist the urge to place a lot of grays: it's better to use less grays than more, simply because blurriness is worse than aliasing. For example, those bits at the tops of ascenders are distracting. <br>- Keep the bodies of the letters as black as possible. For example, in the \"a\" the bottom-right gray is good, but the top-right gray is bad. <br>- Be careful how much you show your work in public: it takes a lot of work to get the grays <i>just right</i>, but it's very WYSIWYS: What You See Is What You Steal... <br>- Consider doing an outline font to match: give away the bitmap-only version, sell the full version. <br> <br>Take this to heart: you have to be extremely pragmatic. You have to make decisions that seem formally incorrect to arrive at good readability. <br> <br>Good luck! <br> <br>hhp <br></p>"
