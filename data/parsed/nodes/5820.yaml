    html: "<p>I agree with everything cristian wrote, except maybe the \"g\" is OK (even though I favor the binocular form with the <i>open</i> bottom). I'd add that if you're going to be funky with the lc \"el\", tilt it the other way (but that might throw off your spacing too much in a bitmap font). <br> <br>Also: one can afford to be more flamboyant with the caps, and I think the UC \"G\" is cool (just maybe some \"tuck-in\" at the join), but I worry about the spacing of the UC \"Q\", since there really isn't any kerning in bitmap fonts (btw, the UC \"R\" is killer). Since you have two pixels of descender space, maybe bring down the tail lower and steeper, and cut the right sidebearing by a pixel. Lastly, I'd lose the last pixel on the tail of the UC \"J\" (you could bring that down another pixel too). <br> <br>As for the letterspacing, do try 2-pixel gaps - it worked for Carter/MS: Verdana's biggest advantage over Tahoma is just that (although it uses up a lot more space). <br> <br>hhp <br></p>"
