    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Tim Ahrens</strong></p>
    <p>Born: Heidelberg, <a href="/wiki/Germany" class="freelinking" rel="nofollow">Germany</a>, 1976.</p>
    <p>Tim Ahrens has studied architecture at the University of Karlsruhe and Typeface Design in Reading. He works as a type designer and architect. In 2000 <a href="/wiki/Linotype" class="freelinking" rel="nofollow">Linotype</a> published his sans serif text face <a href="/wiki/Aroma" class="freelinking" rel="nofollow">Aroma</a>. In 2005 he founded <a href="/wiki/Just%20Another%20Foundry" class="freelinking" rel="nofollow">Just Another Foundry</a>, which distributes his display faces <a href="/wiki/Mashine" class="freelinking" rel="nofollow">Mashine</a> and <a href="/wiki/Zalamander" class="freelinking" rel="nofollow">Zalamander</a>, the sans serif <a href="/wiki/Facit" class="freelinking" rel="nofollow">Facit</a> and <a href="/wiki/Lapture" class="freelinking" rel="nofollow">Lapture</a>, a revival and redesign of <a href="/wiki/Albert%20Kapr" class="freelinking" rel="nofollow">Albert Kapr</a>'s <a href="/wiki/Leipziger%20Antiqua" class="freelinking" rel="nofollow">Leipziger Antiqua</a>.</p>
