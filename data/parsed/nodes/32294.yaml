    html: <p>Not to ignite that debate again, but just to be clear about my own use of the terms, when I say 'even color' I mean having not excessively dark  or light areas that pop out and disturb the texture of the type. I use 'good notan' to refer to shaping the letter well so it has a certain vibrancy of both white and black.</p>
