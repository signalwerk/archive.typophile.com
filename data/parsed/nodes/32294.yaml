      <p>Rachel, for me studying the spacing in typefaces I admire is an essential learning process, beyond all the theories. With the same text in the display box, I switch back and forth between several fonts I admire as well designed and spaced and the one I am working on. That shows me pretty dramatically whether my efforts are working or falling short in meeting the dual goals of liveliness and even color.</p>
      <p>To test whether the spacing is not just even, but appropriately loose or tight for the intended size of type, it is necessary to proof it by printing it out at the intended sizes.</p>
