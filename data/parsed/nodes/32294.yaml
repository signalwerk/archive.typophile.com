    <p>Following on from my last post about the space charcater which was very informative, thanks. Do you have any advise on letter spacing, I've been reading "Letters of Credit", Walter Tracy - which describes a system for correct spacing. The lowercase starts with spacing the "n" and "o" and then using the sidebearing values to space the rest of the characters. It states that the sidebearing for the "n" should be be half the distance between the uprights with slightly less on the right to account for the arched corner. This system seems to produce very loose spacing for me, does anyone else use this method, or are there others.</p>
    <p>R ;)</p>
  html_clean: |-
    <p>Following on from my last post about the space charcater which was very informative, thanks. Do you have any advise on letter spacing, I've been reading "Letters of Credit", Walter Tracy - which describes a system for correct spacing. The lowercase starts with spacing the "n" and "o" and then using the sidebearing values to space the rest of the characters. It states that the sidebearing for the "n" should be be half the distance between the uprights with slightly less on the right to account for the arched corner. This system seems to produce very loose spacing for me, does anyone else use this method, or are there others.</p>
    <p>R ;)</p>
