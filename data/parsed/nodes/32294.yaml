      <p>Speaking of even color, eventually you might also want to search Typophile for the threads where we debated the notion of Notan too. </p>
      <p>And also slightly related I saw a variation on Hoefler's spacing description in an old lettering guide I got via Inter-Library Loan. I suspect everybody else has heard of it already but if not : It described using dots placed like stones or pebbles between letters and then counting them to see if they are equal or nearly so to see if your spacing is good. I think that it was offered not as realistic way of working but as an analogy and as a lay &amp; novice's method.</p>
