      <p>Just to chime in and further emphasize Carl's well worded point--"Your eyes are the final arbiter."<br>
      If you try one of the methods you read about and see something seems a bit off, it is your eyes showing you the way. Learning to see is not the same as learning to look. Like any skill, the more you practice, the better you get.<br>
      I would be willing to bet that all of the methods were developed by looking at spacing of successfully designed type. How was this type designed so successfully before a method was developed? Those designers had well trained eyes.</p>
      <p>ChrisL</p>
