      <p>Rachel, </p>
      <p>Keep in mind that any method that is suggested is only a guideline, meant to simplify and systematise the process of spacing a typeface. Since every design is different, certain methods may not be useful; in fact, with very irregular designs, no method will be useful, except the most reliable one: your eye. The eye is the final arbiter, and Tracy mentions the exception about the right side of n because often that side of n can appear loose. There are exceptions, and only your eye will tell you what they are. It's all coming from what makes the most sense visually, so if a method doesn't seem to be solving problems, the thing is not necessarily to find another method, but to abandon all methods and rely on your visual discernment. </p>
      <p>Type design is full of these caveats. Very little about type design is truly modular or mechanical.</p>
