      <p>aluminum, I think it's because a vector is actually a mathematical path, and we tend to think of a path itself as a noun. A path == a vector.</p>
      <p>Most people don't think of "raster" as a noun -- I bet most Adobe users immediately think of 'rasterize' as a verb. The resulting pixel is a noun, but pixels are expressed simply as "image" or "picture". Calling an image a 'vector' sets it apart from pixels. If there was a 'vectorize' command in Adobe products, using 'vector' as a noun might never have caught on. </p>
      <p>Nonetheless, your irk is completely understandable. I get irked every time I hear people use the word "ironic" improperly.</p>
