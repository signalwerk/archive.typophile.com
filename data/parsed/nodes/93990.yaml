  html: <p>Join Monotype Imaging at Boston's HOW Design Live conference Sunday, June 24, at 9:00am EDT for a presentation by some of the typographic industry’s leading designers. Topics to be addressed will range from type voice and trends to designing for the mobile screen. See you Sunday at Typographic Hat Trick - Three Designers, Three Perspectives. <a class="freelinking external" href="http://blog.fonts.com/2012/06/18/monotype-imaging-at-how-live-boston/" rel="nofollow">http://blog.fonts.com/2012/06/18/monotype-imaging-at-how-live-boston/</a></p>
