    html: |-
      <p>Gerald</p>
      <p>According to Howes the "authentic" Caslon Old Face likely saw its last hurrah in the specimen catalog of 1766. Afterwhich there appears to be repair and replacement work up until 1805. The Chiswick revival of 1844 is based on the recovery of punches and matrices in 1839. Howe's inventory does not list ornaments as original to Wm Caslon I or II. The only mention of ornaments is the cutting of them for the Gresham Press in 1876 (but not necessarily cut or cast by the foundry). Anything offered by Stephenson &amp; Blake would not be authentic in terms of lineage (to punches and matrices).</p>
      <p>Adobe Caslon is based on specimens from "1738 and 1786" [sic 1785 ?]. As I recall the Adobe Caslon ornaments supplied with the font were from "later" issue. They might likely be late 19th or even early 20th c. additions. The printer Wesley Tanner was involved in some way with the Adobe Caslon ornaments. </p>
      <p>Gerald</p>
    html_clean: |-
