      <p>Too late, hrant, the old man is dead ;-)<br>
      I'm not sure what you meant with your post, but if you're referring to the pragmatic use of the font, I didn't really think about that when designing it. I actually kind of like the single &amp; double lines when mixed, but then again I have a soft spot for these kind of cheap looking things (hence the stencil rulers).<br>
      I've designed three display fonts so far &amp; I seem to add a little legibility with each new font, but none of them would really work in the long run. I just have fun designing them &amp; find it an important part of the learning process. There's still a long way to go though...</p>
