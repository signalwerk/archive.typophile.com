      <p>Brioso comes to mind, but it's not a (dictionary) text face really. I suggest you start researching Chinese typefaces, because the chosen style will most likely be the most prominent visual element, and there aren't that many to choose from. The Latin alphabet will have to sit well with the Chinese. As for your other questions, you should find a skilled book / graphic designer to help you develope a good hierarchy and a template that's easy to navigate.</p>
      <p>If you by any chance should happen to think I am one, feel free to drop me a mail :)</p>
