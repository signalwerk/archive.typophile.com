    html: |-
      <p>Some random comments:</p>
      <p>Test the minimal size of Chinese characters first: I think most Chinese fonts are hard to read and will lose "less important" strokes at 8 or 9px. So as long as your Latin font reads well at that size it won't be a problem.</p>
      <p>For pinyin characters, don't forget we also have the vowel ü which can occur in all four tones: ǖǘǚǜ.</p>
      <p>I won't talk about the styles of dictionaries, but if you want some bold Chinese typeface, you'd better choose a right font first -- many Chinese fonts don't have a bold version.</p>
      <p>Finally, note that we usually do not slant Chinese characters. Underlines, setting it in Kaiti (Regular script) or FangSong (Imitation Song) are common alternatives ways to emphasize words without emboldening them.</p>
