      <p>For reasons of rendering clarity and matching the stroke-centric<br>
      nature of Chinese, I might recommend a slab serif. At which point<br>
      I can't resist shamelessly suggesting a very recently released<br>
      design that I played a role in: <a href="http://ernestinefont.com" title="http://ernestinefont.com">http://ernestinefont.com</a><br>
      Ernestine's large x-height and ample width also play a positive<br>
      role in terms of screen rendering. I'd have to double-check<br>
      whether it supports Pinyin, but if it doesn't it would certainly<br>
      be possible to commission an extension.</p>
      <p>hhp</p>
