      <p>Matt: <em>I think the issue is that Microsoft picked the cheaper font to license thinking no one would know the difference.</em></p>
      <p>I doubt if licensing cost per se was the deciding factor. Microsoft was already involved in a production relationship with Monotype -- there were Monotype staff at Microsoft doing the TT hinting -- and Arial needs to be seen as part of a package with Times New Roman and Courier New.</p>
      <p>I also don't think Microsoft thought 'no one would know the difference' between Arial and Helvetica; rather, the difference simply didn't matter to Microsoft. They had a technical requirement for a sans serif core font: that it match Helvetica metrics such that documents created in Windows with Arial could be printed from a printer that used Helvetica.</p>
      <p><em>Segoe is a pretty recent example of Microsoft purchasing a Frutiger clone from Monotype. In this case it seems like an example of Monotype (who now owns Linotype) not willing to sell the Frutiger trademark so selling a knock off typeface instead.</em></p>
      <p>At the time Segoe was developed, Monotype did not yet own Linotype. Far from Linotype being unwilling to license the Frutiger trademark, they had already licensed 'Frutiger Linotype' to Microsoft as a core font for the MS Reader. There really isn't a good explanation for Segoe if it is seen from the perspective of Microsoft looking for something that resembled Frutiger, because they already had a license for Frutiger. So clearly that perspective is erroneous. What MS were looking for, and what they had commissioned Monotype to produce, was a new UI font. I suspect the technical spec for this font was a lot more detailed than the design spec, which was probably pretty vague, e.g. ‘clean, modern’. And Monotype delivered what is either a deliberate Frutiger clone or something that by chance, from seeking to meet the technical and design briefs, turned out to be so much like Frutiger as to appear a clone to most people.</p>
      <p>Having had some experience of delivering fonts for bundling with major software, and knowing how software development cycles work, I suspect there was a point at which MS either had to accept Segoe or throw a wrench in the entire Vista development schedule.</p>
    html_clean: |-
