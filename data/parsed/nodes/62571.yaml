      <p>I suggest that the same width and spacing would be desirable for reasons such as interoperability and graceful degradation.</p>
      <p>However, this quality does not prevent introducing a new font. In essence, backwards compatibility allows some flexibility in design, provided that the technical metrics are unchanged.</p>
      <p>Also note that sliding-scale economics in licensing means that a wealthy firm such as Microsoft might be asked to pay more than the going rate. I am not saying this is applicable, but its reasonable to think that licensing on such a large scale may have involved negotiation. In other words, Linotype may have thought they had Microsoft by the short &amp; curlies, and subsequently upset Microsoft in the board room.</p>
      <p>I believe that Bill Gates once advocated the philosophy that power resides with those who control the underlying property. I am too lazy to seek a quote.</p>
