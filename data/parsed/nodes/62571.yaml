      <p>So I started working with my supervisor <a href="http://or.psychology.dal.ca/~klein/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">professor Raymond Klein</a>, currently the chair of the department of psychology for <a href="http://www.dal.ca/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Dalhousie University</a>, in 2007. Before he met me, he didn't even know what a serif was. Now, he knows who <a href="http://fontbureau.com/people/MikeParker" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Mike Parker</a> is and what makes the typeface <a href="http://fontbureau.com/fonts/Starling" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Starling</a> so significant (Parker read me an amazing back story he had written a while ago). He even went to the opening night for <a href="http://www.helveticafilm.com/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Helvetica</a> without me and, and yesterday, he paid $100 to have the poster from the film framed. Needless to say, it's his favourite font. He's even started reading <a href="http://www.amazon.com/Elements-Typographic-Style-Robert-Bringhurst/dp/0881791326" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Bringhurst</a> following a talk he gave at <a href="http://nscad.ca/en/home/default.aspx" title="Click to visit an external URL." class="freelink freelink-external freelink-external">NSCAD University</a> (and yes, I got him to sign my copy).</p>
      <p>I sent him the "Can you tell Helvetica from Arial?" test and this is the email I got in return:</p>
      <p>"<em>I got 18 too!<br>
      Some of the all caps were hard and the G in AGFA and TARGET got me.<br>
      If I had done some of the other all caps earlier I might have picked up on the tiny difference between the cap As</em></p>
      <p>So, you should be very proud of your student!"</p>
      <p>Praise from Caesar. Thanks Ray.</p>
