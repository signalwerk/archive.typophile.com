      <p>The test really should be can you spot Arial from the "original" since at least one of the logos (National) is clearly not Helvetica as can be seen in the treatment of the lowercase 'a' which has a different tail for bold and black weights than normal weight. In the case of National the type of tail is switched. It's a Grotesque variant, but not an official Helvetica. The author should have stuck to a list of companies where the use of Helvetica in the logos had been vetted like in the Wikipedia entry: <a href="http://en.wikipedia.org/wiki/Helvetica">http://en.wikipedia.org/wiki/Helvetica</a>.</p>
      <p>As to the history of Arial, Wikipedia has a pretty good entry as well: <a href="http://en.wikipedia.org/wiki/Arial">http://en.wikipedia.org/wiki/Arial</a>. The articles linked in the footnotes reference good sources from what I can tell.</p>
      <p>I'm not sure where the myth Microsoft didn't want to pay royalties for Helvetica stems from but it's pretty ludicrous when you consider that the Microsoft logo is actually Helvetica minus the tweaked 'o' and the custom kerning (Why wasn't that one on the test). Furthermore, Microsoft doesn't own Arial, Monotype does and Microsoft licenses the font from them.</p>
      <p>As some may have noticed that if Arial was almost an exact clone, people should be scoring much lower. If you used say Nimbus Sans or Swiss 721 I doubt many would be able to score so high. Granted, Arial is a Helvetica substitute because of the competition between IBM/Monotype vs Xerox/Linotype in the printer market in the early 80s.</p>
      <p>Letters: 'a', 'c', 'e', 'f', 'g', 'j', 'r', 's', 't' and 'y' have strokes that end in a slant in Arial, while in Helvetica they end on the horizontal or perpendicular; however,  it can be hard to discern the slanted start or end stroke on the letters: 'f', 'g', 'j' and 'y' at smaller sizes.</p>
