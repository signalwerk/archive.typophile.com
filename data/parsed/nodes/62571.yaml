      <p><em>Matt, where did you get the reference for Zapf’s two?</em></p>
      <p>Michael, do you mean my reference image for Zapf's Palatino and Monotype's clone?</p>
      <p><em>I’m not sure where the myth Microsoft didn’t want to pay royalties for Helvetica stems from but it’s pretty ludicrous when you consider that the Microsoft logo is actually Helvetica minus the tweaked ’o’ and the custom kerning (Why wasn’t that one on the test). Furthermore, Microsoft doesn’t own Arial, Monotype does and Microsoft licenses the font from them.</em></p>
      <p>I was hasty in saying Microsoft commissioned Arial. Indeed, they don't own it, I should have said they popularized it. But the royalty issue is still an issue. Obviously Arial was cheaper from Monotype than Helvetica was through Linotype. And the fact that Microsoft use it for their own logo doesn't really have anything to do with the fonts they package with their software. Licensing a font for a logo and for a software package vary greatly in price.</p>
      <p>I think the issue is that Microsoft picked the cheaper font to license thinking no one would know the difference. Obviously we all know the difference and the differences in the design of Arial are seemingly arbitrary.</p>
