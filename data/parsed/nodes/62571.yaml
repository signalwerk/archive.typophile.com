      <p><em>There could be a multitude of reasons why one font is selected over another.</em></p>
      <p>Did Microsoft confess to have selected Arial because nobody would notice the difference?</p>
      <p>I've never heard a Microsoft employee discuss it. It just seems like the only answer. Why would you select a typeface with the exact same widths and spacing of one of the most popular typefaces in the world instead of just selecting that popular typeface?</p>
      <p>There were other options, similar typefaces like Univers or even Monotype's Grotesque, but of course those don't share the same metrics as Helvetica. </p>
      <p>And it's not like Arial is the only example of this. <a href="http://en.wikipedia.org/wiki/Segoe" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Segoe</a> is a pretty recent example of Microsoft purchasing a Frutiger clone from Monotype. In this case it seems like an example of Monotype (who now owns Linotype) not willing to sell the Frutiger trademark so selling a knock off typeface instead.</p>
      <p>If you can find any real information about why Microsoft really did select Arial, I'd love to see it. Mark Simonson wrote a great article on the subject a little while ago, <a href="http://www.ms-studio.com/articles.html" title="Click to visit an external URL." class="freelink freelink-external freelink-external">The Scourge of Arial</a>.</p>
