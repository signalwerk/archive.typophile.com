    html: <p> Hi Hubert, I have heard a type designer is lucky if he gets paid for 6% of due royalties for licensing his work. This of course means 94% would be in circulation with no license as pirate copies. so just out of curiosity, how many copies of this font have you licensed, and what does a license to these nice fonts cost. Also what inspired you to do the strange signature lower case "g"s in the majority of you work, I find these lc "g"s disproportionate, unattractive and yet appealing all at the same time, I would guess you must have had discussions with clients over this, as they are very different from normal lc "g"s. </p>
