    html: <p> dear Hrand, <br>Again readability is more than x-hight. Books are one part and there are far enough beautyfull textfaces arround. You dont get paid for bookfaces and sad but true, nobody wants to read long text nowadays. Hardy a book-publisher asks you to design a typeface. I dont take my typographic statements to serious, although I have studied Latin typefaces quite intensive. Every face I do has got some irony in it. Typography in the last 4 centuries has been full of stupid tendencies and very many typographers have been totaly anal. I dont want to be like that and thank god I know loads of different designers I work with, that always question any rule I try to formulate. I love practical work it humbles me every day. </p>
