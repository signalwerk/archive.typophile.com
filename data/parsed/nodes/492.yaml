    html: <p> Hi, Ole <br>If you try to sell the font throu foundries it's nearly impossible to find out who's allowed t use the font. In my case I know, because evervbody who wants to use it has to ask me. By the way I fond out that w-mag is part of fairchild publishing which also publishes Details. So the connection is clear. But I have to talk to them, because we never agreed on the usage in w-mag. The g is just the character I really like. I always try to do something different. The g i used in June is maybe in 2 different fonts as well, but there are a varienty of oher forms used in my fonts. I dont want to get stuck in to much of a style. <br>There are only two licences of June yet. One was limited down to just on print of an art cataloque in Denmark and the other is for Details. They might want to have an exeptional licence, thats why I did not give it to anyone else. <br>But tell me what you are working on and how you want to use it, we might find a way </p>
