  html: <p> I just saw a copy of "W" (it's a thick tabloid-size magazine), and besides having a cool format (it's two upside-down halves, with different typography), it has this pretty amazing font, used nicely for titles, but also a lot less happily for text (for one thing, the color's way too dark for that), and the font seems to have a sans too. Any ideas what this thing is, and who made it? <br> <br>I wasn't about to spend money for the magazine's content, so I have no scans - sorry. <br> <br>hhp </p>
