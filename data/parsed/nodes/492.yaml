    html: <p>Hi Hubert. I do not have any specific use for your fonts at this time but I am a busy designer and I sell clients on certain fonts if I think they are good for a project. Your work is obviously in that category. One project I think it would be great for is in negotiations.I am not able to discuss this yet but I will get back to you via email on that later if anything come out of it. I have some work of my own on typophile you may like as we have similar taste. Check out Unicratica in the critique sans section. It is only caps at this time but it will be a full family hopefully sooner than later. I would welcome your critique of this. <br>I have noticed reference to your work on typophile on a few occasions yet we don't have any of it in the critique section so please upload some images of your work if you like.</p>
