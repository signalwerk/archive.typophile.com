    html: <p> Hey Hrant, <br>If you have seen my webpage you know that I worked quite much in Branding. there is a demand of new especilly sans typefaces (June was first designed in sans, one of the samples shown in the forum is teh sans bold version). But there it is quite usfull to have a big x-hight. I was not to keen to have a typeface for very long copy, but in the cataloque I was talking about earlier it was used in 8p and even 6p and it worked quite well. I have a very traditional typografic backround and I heard about all those legebility stuff over and over again. At the end you never really know why it workes or not. A big part is to get used to an alphabet. Sometimes, when I design a typeface I lose the overall picture of it, because I'm to much into the details. Later it is very strange to see a printed sample. </p>
