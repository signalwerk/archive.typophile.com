    html: <p> &gt; readability is more than x-hight. <br> <br>Totally. <br>It's also more, much more, than familiarity. <br> <br>&gt; there are far enough beautyfull textfaces arround. <br> <br>You think so? Well, even so, beauty changes all the time - fortunately! <br> <br>On top of that, readability has a lot more to do with our reading "hardware" than beauty. And I think designers haven't been doing much (especially not recently) to push the envelope of functionality. This is probably because there's practically no money in it, and capitalism is getting fatter by the minute. <br> <br>&gt; You dont get paid for bookfaces <br> <br>Yes, that is a sad truth. Certainly in retail (as opposed to custom commissioned work) there is zero market. <br> <br>My solution? Simply remove money from the equation! <br> <br>&gt; nobody wants to read long text nowadays <br> <br>I think "nobody" is too strong. <br> <br>&gt; question any rule I try to formulate. <br> <br>Yes, that's very important. <br>But it's also important to try to answer the questions and refine our views, instead of giving up, no? <br> <br>hhp </p>
