  - id: 3301
    user: 1250
    date: 2002-04-29T08:14:00
    date_raw: 29 Apr 2002 — 8:14am
    votes: null
    html: "<p> Hubert, great work. To me June is what post-modernism was *supposed* to become (but largely didn't). <br> <br>This isn't the Critique Forum, so I won't go into that, except to say that I think the structure of your \"g\" solves the \"g-problem\"* in a very smart way; but in terms of finish, I think it's a bit wide, especially in the head. I also think the font's x-height is a bit large for text (except if somebody is daring enough to use it as a news face!), but I saw a more serious problem in \"W\": the text was way too dark, much darker than the headline settings seem to indicate. I think they had had a gain problem, or maybe they used \"deep black\" (CMYK). <br> <br>* Since you're new to this forum you won't know that I have a reputation for an obsession with the lc \"g\". I think it's by far the most difficult Latin character to design (which is what makes it fascinating), and have some pet theories about what it needs to be. <br> <br>Of course, an even more serious problem is that they might have no license! All I have is some phone numbers: <br> <br>HQ: 800.289.0390 <br>Editorial, NY: 212.630.4000 <br>LA Office: 323.951.1800 <br> <br>BTW, what about the sans? <br> <br>hhp </p>"
    html_clean: "<p> Hubert, great work. To me June is what post-modernism was *supposed* to become (but largely didn't). <br> <br>This isn't the Critique Forum, so I won't go into that, except to say that I think the structure of your \"g\" solves the \"g-problem\"* in a very smart way; but in terms of finish, I think it's a bit wide, especially in the head. I also think the font's x-height is a bit large for text (except if somebody is daring enough to use it as a news face!), but I saw a more serious problem in \"W\": the text was way too dark, much darker than the headline settings seem to indicate. I think they had had a gain problem, or maybe they used \"deep black\" (CMYK). <br> <br>* Since you're new to this forum you won't know that I have a reputation for an obsession with the lc \"g\". I think it's by far the most difficult Latin character to design (which is what makes it fascinating), and have some pet theories about what it needs to be. <br> <br>Of course, an even more serious problem is that they might have no license! All I have is some phone numbers: <br> <br>HQ: 800.289.0390 <br>Editorial, NY: 212.630.4000 <br>LA Office: 323.951.1800 <br> <br>BTW, what about the sans? <br> <br>hhp </p>"
  - id: 3302
    user: 1250
    date: 2002-04-29T11:02:00
    date_raw: 29 Apr 2002 — 11:02am
    votes: null
    html: "<p> &gt; there is a demand of new especilly sans typefaces <br> <br>Since trends in type design are much faster on the display side than the text side, that makes sense. But I still don't like it. Serif faces have such a complex beauty, like with June in fact. Not to mention their greater readability. <br> <br>&gt; it was used in 8p and even 6p and it worked quite well. <br> <br>This makes perfect sense, and it alludes to what I wrote about newspaper typography. Below the immersive reading range (about 9-11 point) reading becomes more \"choppy\", and legibility is more important than readability. But in the optimal range, boumas (word shapes) are more important, and a smaller x-height helps. <br> <br>As for the area above the narrow range, it depends on the design. Generally you want a large x-height, especially if it's a Modernist design, but sometimes a Garamond with a small x-height set large conveys a great elegance. <br> <br>&gt; At the end you never really know why it workes or not. A big part is to get used to an alphabet. <br> <br>Familiarity is very important. But it's also used by many people as an escape from thinking about the beast that is readability. It's clear that some fonts are inherently more readable than others, but the reasons are very dark, and this makes most people afraid. <br> <br>Furthermore, familiarity itself is not understood. How quickly is it gained, and in what ways? It's very significant that the people who keep saying \"legibility is unimportant, it's just what you read most\" also don't bother unraveling familiarity itself!  :-/ <br> <br>The truth is out there, but we will never know it completely. However, this does not relieve us (especially not text font designers) of the responsability of understanding the \"scientific\" aspects of the craft. For example: there's a very good *physical* reason that newspaper fonts need bigger x-heights than book faces. <br> <br>hhp </p>"
    html_clean: "<p> &gt; there is a demand of new especilly sans typefaces <br> <br>Since trends in type design are much faster on the display side than the text side, that makes sense. But I still don't like it. Serif faces have such a complex beauty, like with June in fact. Not to mention their greater readability. <br> <br>&gt; it was used in 8p and even 6p and it worked quite well. <br> <br>This makes perfect sense, and it alludes to what I wrote about newspaper typography. Below the immersive reading range (about 9-11 point) reading becomes more \"choppy\", and legibility is more important than readability. But in the optimal range, boumas (word shapes) are more important, and a smaller x-height helps. <br> <br>As for the area above the narrow range, it depends on the design. Generally you want a large x-height, especially if it's a Modernist design, but sometimes a Garamond with a small x-height set large conveys a great elegance. <br> <br>&gt; At the end you never really know why it workes or not. A big part is to get used to an alphabet. <br> <br>Familiarity is very important. But it's also used by many people as an escape from thinking about the beast that is readability. It's clear that some fonts are inherently more readable than others, but the reasons are very dark, and this makes most people afraid. <br> <br>Furthermore, familiarity itself is not understood. How quickly is it gained, and in what ways? It's very significant that the people who keep saying \"legibility is unimportant, it's just what you read most\" also don't bother unraveling familiarity itself!  :-/ <br> <br>The truth is out there, but we will never know it completely. However, this does not relieve us (especially not text font designers) of the responsability of understanding the \"scientific\" aspects of the craft. For example: there's a very good *physical* reason that newspaper fonts need bigger x-heights than book faces. <br> <br>hhp </p>"
