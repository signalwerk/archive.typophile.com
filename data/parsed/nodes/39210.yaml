      <p>To Satya,</p>
      <p>Excuse me - how could you put BASE 02 on this list? It is a easy-to-read grunge face - that was extremely popular and most people never paid a cent to the creator for using it -- including HOLLYWOOD.</p>
      <p>And Gräfenberg, I am not a fan of Gill Sans, but as a former typesetter learned a long time ago that every font (yes even Comic Book Sans) has a place - and that somewhere there is a perfect job for it. I happened to have been given a business card recently, and it was a delight to see -- and then I realized the face I was looking at was Gill Sans Italic. Perhaps since no one I know has used it since 1992 -- it was just a pleasure to see.</p>
