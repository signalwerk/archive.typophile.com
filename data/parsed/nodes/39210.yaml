      <p><em>convert it to letterpress.</em></p>
      <p>Why would you expect faces designed for one medium to work in another without adaptation?<br>
      You know how much difficulty there has always been in adapting the foundry classics to new technology, whether hot metal, photo, or digital, offset or monitor.<br>
      Would you attempt to print a finely-detailed 19th century face designed for coated paper on a laid rag stock, in the manner of 17th century printing?</p>
      <p><em>expire the lame typefaces</em></p>
      <p>I once retired a typeface, but people still kept wanting to buy it.</p>
