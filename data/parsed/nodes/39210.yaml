      <p>Recently I came across a site on Gutenberg in Comic sans. But will you all excuse me if I waffle on a bit about a typeface alluded to earlier in this discussion? Is that allowed?</p>
      <p>On page 1 it was nice to see someone speak up for Excoffon's masterpiece Mistral. Good for you Mr Small caps (or Ms small caps if you are a woman... personally I hate the 'politically correct' Ms, but I'm not a woman...). Excoffon designed this type for the Olive foundry's clients who were mostly small letterpress printers in France and francophone countries still setting type by hand. He certainly didn't design Mistral for graphic designers (who were fairly thin on the ground in Europe in the fifties). In fact Mistral has always been a favouite of 'popular graphics'. Serious graphic designers wouldn't touch it with a barge pole. Nevertheless, even us sophisticated designers should be able to appreciate that much type which dwells firmly within popular graphics is worthy of our appreciation (and perhaps devotion) even though we would never use it. Look at Novarese's superb STOP. I have an archive of about a 150 photos of signs, logos and whatnot in STOP (not to mention Mistral). But let's get back to Mistral again for a moment. John Dreyfus wrote a highly appreciative piece on Mistral in the Penrose annual of 1956. For many years it was the only face available that gave a convincing idea of quickly written spontaneous handwriting. Obviously Mistral no longer represents the handwriting of today but it is still the most popular of all the 'handwriting' typefaces or, to use a more colourful expression, 'shopping list' typefaces that have sprung up since the digital revolution: I mean faces that don't show off a calligrapher's handwriting, but are able to give an impression of decent handwriting of the sort we might do for a shopping list. But Mistral is far more than just a decent imitation of handwriting. In the game of bluff and deception that is implicit in all 'shopping list' faces, Excoffon plays a masterful hand. Of course... designers might prefer real handwriting to fake handwriting but that's another story.</p>
      <p>The version of Mistral that was (or maybe still is) installed in Bill Gates' systems is a real abomination and a horrid travesty of Excoffon's work. ITC put out a light version of Mistral designed by Phil Grimshaw in 1997 (complete with small caps and stacks of ligs). This was another masterpiece and a very fitting tribute to Excoffon. But it seems to have been a commercial fiasco probably because popular graphics is — quite understandably — not interested in paying for fonts.</p>
      <p>Small caps admires the colourful brochure for Mistral, and so do I. Excoffon himself designed other beautiful handouts for his faces. And this is another point worth emphasizing. Don't you all think that it is time for an exhibition of typefounders advertisments? There's much more to be said of Mistral (and of course of its designer too), but I'll stop here to avoid an impulse to write a whole article. </p>
      <p>I'll finish up by returning to the original subject of this discussion 'The worst typefaces'. Someone mentioned ROTIS and I thoroughly agree. Why is ROTIS such an awful face? Because it is a hybrid. Upstairs it tries to be 19th century and downstairs it's Renaissance. I can't stand it.</p>
      <p>Sorry for being so long winded and I apologise for having written too much about one of my favourites rather than the contrary.</p>
    html_clean: |-
