      <p>I find it most interesting that the most vilified fonts fall into the categories of rip-offs, and "write-offs." Enough about rip-offs, and inappropriate use aside, what make Mistral, Comic Sans, Sand and Papyrus so hateful, even to ones who like all fonts, is that we don't like to them scaleable. It disturbs me to try and make a written font for more than a single size, so I'm guessing that it disturbs us when a single outline is used to represent what we expect to be a range of proportions and a variety of edge qualities. Digital outlines at their worst, bringing out the worst in typophiles, I'd say.</p>
      <p>Cheers!</p>
