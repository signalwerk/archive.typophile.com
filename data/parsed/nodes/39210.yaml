      <p>1. Comic Sans doesn't rule. Comis Sans sucks. Big time. The real Vincent Connare knows enough about type to know that's the truth. It is successful for 2 very basic reasons: it was, as mentionned above, bundled with Windows; and 95% of the computer users in the whole world have a total lack of good taste, not only computer or font related but in general. Good taste comes with education and some given skills or hunger for artistic / aesthetic self improvement, which most of the world is lacking, that's a pity but that's the truth. Most of these people are very nice, very sweet, totally harmless and inoffensive, my own sister prints her reports in Comic Sans. She also wears clothes which make my eyes bleed.</p>
