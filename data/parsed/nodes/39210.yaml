      <p>"There are only two kinds of typefaces: those you know how to use, and those you don't."<br>
      Attributed to Alvin Lustig</p>
      <p>I cannot track down a source for this quote, which I read somewhere, with its attribution, about 1991. Whether it is from Lustig or not, I do haul it out whenever this hoary subject gets raised.</p>
      <p>That said, it may well take an extremely talented or sensitive typographer to design something excellent with some of the faces mentioned above.</p>
      <p>**********<br>
      Unfortunately, too many people [including myself] over too many years have tried to do things such as printing "a finely-detailed 19th century face designed for coated paper on a laid rag stock, in the manner of 17th century printing." Blame the perpetrator, not the typeface. It might be that there's no good reason to print Emigre's Journal, or many other types, by letterpress.</p>
      <p>powers</p>
