      <p>As a typographer - I'd say any typeface misued - such as the menu I had to try to read yesterday. Alba in 8 point for descriptions of named foods... - yikes! </p>
      <p>If James R. Harris would be alive to respond - he'd tell you ITC Eras. Why? Because it doesn't lean enough to be an oblique/italic and it isn't straight up -- it's just there, in limbo - leaning....</p>
      <p>Personally, I hold a grudge towards HOBO. I can't stand that face. A quickie job came up for a window washer - and his font was HOBO... why - because he made his logo himself and HOBO was on the darn computer.... LOL</p>
      <p>P.S. In defense of Emigre - when the faces first hit the publishing industry - they were quickly embraced -- but for front cover type. How many time did Tony Greco use Matrix -- oh, and it worked? Not all their faces are winners, but they did add a nice amount of a "new" style to help folks create new looks for front covers....</p>
      <p>Triplex got its time in there -- and who could forget Mason - it was ahead of it's time... okay so 3 fonts in heavy use for a year or two is still quite a typographical accomplishment.</p>
