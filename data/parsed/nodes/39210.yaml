      <p>James</p>
      <p>Well, that's an easy shot these days, but in Emigre's heyday, few would step up to the plate in a public forum to protest. Did I say few? I meant two.</p>
      <p>Digitally speaking, it's quite easy to distinguish a technically bad typeface; convert it to letterpress. Emigre's fonts are dismal failures. Even Journal is quite goofy, and it is the one Emigre face I like a lot. Apparently, if you can't draw or punchcut a typeface, letterpress technology will just show you for what you are. This has nothing to do with "worst" (which is apparently an aesthetic decision), just "bad."</p>
      <p>Gerald</p>
