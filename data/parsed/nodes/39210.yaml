      <p>I have a theory about all this: Some typefaces are novice magnets.</p>
      <p>To the average person, most fonts look more or less the same. But, if a typeface has a strong flavor, it calls attention to itself. It's easy to recognize and makes people feel like they know something about fonts when they recognize it. And it looks "special" compared to normal (i.e., boring) fonts, so using it makes their documents look "special."</p>
      <p>To the experienced designer, such typefaces have too much flavor, call too much attention to themselves, not to mention the fact that often carry the baggage of being associated with amateur design.</p>
