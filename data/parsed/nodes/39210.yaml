    html: <p>There are some really bad typefaces out there by folks who didn't know what they were doing, but they aren't available from reputable foundries and generally shunned by graphic designers. There are some spectacular examples of typefaces used badly, or wrongly chosen for the application at hand. Assuming a typeface meets the criteria its designer set out to achieve, both technically and aesthetically, I don't think one can say any particular face can be called "bad" or "good".</p>
