      <p><em>Arial is a bad font because it tries to be a Helvetica knockoff, but inconsistently blends features of Helvetica and MT Grot...</em></p>
      <p>Do you really think "blending features" was Robin Nicholas' modus operandi?<br>
      Look at the other faces he has designed, such as Nimrod and Clarion.<br>
      He is a more accomplished designer than Max Miedinger.<br>
      As you note with reference to MT Grotesque, Robin went back to the 19th century grotesque. In so doing he was ahead of the trend that has recently seen several foundries release grots in that quirkier, older genre.<br>
      Arial would get more respect if it had been hyped like Helvetica, but the foundry BS is lacking--generally the best they do is apologize for it, saying it's a good screen font!<br>
      It could be argued that Arial is a deconstruction of Helvetica, putting some fibre back into the white bread.</p>
