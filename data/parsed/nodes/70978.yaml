  html: |-
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Picture1_3718.png"></div><br>
    This piece of lettering will serve as a hanger in a retail space. I am producing it out of aluminum (water jet cut from an ⅛-inch thick sheet). I am interested in all critiques but particularly those pertaining to refinement of the lettershapes, interaction between letters, &amp; spacing. I would like to keep this a relatively low contrast script. Structurally, the paperboard models I have produced are sound enough and balance well enough. Dresses hang by their straps that fit into the notches between the m &amp; o, and the a &amp; n. The PDF shows the hanger at actual size on a piece of 11x17 paper. (I have not removed overlaps in the font file, but will before producing this.)<br>
    Thanks.<p></p>
