    html: |-
      <p>Read Karsten Lucke’s guide to font naming: <a href="http://www.kltf.de/downloads/FontNaming-kltf.pdf" title="http://www.kltf.de/downloads/FontNaming-kltf.pdf">http://www.kltf.de/downloads/FontNaming-kltf.pdf</a><br>
      You might also want to search the build forum for other threads pertaining to naming issues. There are lots. As for your OT features, compare your OT code with some working fonts to be sure it’s correct, and make sure to compile the OT features before you create the fonts.</p>
    html_clean: |-
      <p>Read Karsten Lucke’s guide to font naming: <a href="http://www.kltf.de/downloads/FontNaming-kltf.pdf" title="http://www.kltf.de/downloads/FontNaming-kltf.pdf" class="link-external">http://www.kltf.de/downloads/FontNaming-kltf.pdf</a><br>
