    <p>Hi guys,<br>
    I'm having a problem with my typeface and with illustrator cs4, they just recongnize the regular version (i have also the italic).<br>
    And with illustrator and indesign cs4 they don't recognize my ligatures, small caps and linning figures although linotype font explorer recognize at least the ligatures.<br>
    Some help?</p>
