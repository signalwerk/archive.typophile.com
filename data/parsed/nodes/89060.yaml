      <p>That is due to the fact that the python that comes installed on the mac is ucs-2 and not ucs-4. Here is a trace of execution on my mac (python2.5, python2.6 and python2.7 in /usr/bin do the same):<br>
      <code><br>
      501 % /usr/bin/python -c "import sys; print sys.maxunicode;"<br>
      65535<br>
      502 % /opt/local/bin/python -c "import sys; print sys.maxunicode;"<br>
      1114111<br>
      503 %<br>
      </code><br>
      I installed a ucs-4 python (2.6) with macports to use with fontforge to handle glyphs above 0xFFFF.</p>
