    <p>I just switch to a brand new computer and set up everything but can’t get TTX to work.</p>
    <p>I see this when i type ttx in the terminal so I think it’s installed right?</p>
    <p>---------------</p>
    <p> TTX 2.3 -- From OpenType To XML And Back</p>
    <p>    If an input file is a TrueType or OpenType font file, it will be<br>
           dumped to an TTX file (an XML-based text format).<br>
        If an input file is a TTX file, it will be compiled to a TrueType<br>
           or OpenType font file.</p>
    <p>etc .... </p>
    <p>---------------</p>
    <p>But when actually trying to work on a font file I get this:</p>
    <p>---------------</p>
    <p>  File "/usr/local/bin/ttx", line 11, in<br>
        ttx.main(sys.argv[1:])<br>
      File "/Library/Python/2.7/site-packages/FontTools/fontTools/ttx.py", line 295, in main<br>
        process(jobs, options)<br>
      File "/Library/Python/2.7/site-packages/FontTools/fontTools/ttx.py", line 280, in process<br>
        action(input, output, options)<br>
      File "/Library/Python/2.7/site-packages/FontTools/fontTools/ttx.py", line 170, in ttDump<br>
        fontNumber=options.fontNumber)<br>
      File "/Library/Python/2.7/site-packages/FontTools/fontTools/ttLib/__init__.py", line 145, in __init__<br>
        if macUtils.getSFNTResIndices(file):<br>
      File "/Library/Python/2.7/site-packages/FontTools/fontTools/ttLib/macUtils.py", line 28, in getSFNTResIndices<br>
        resref = MyOpenResFile(path)<br>
      File "/Library/Python/2.7/site-packages/FontTools/fontTools/ttLib/macUtils.py", line 18, in MyOpenResFile<br>
        resref = Res.FSpOpenResFile(path, mode)<br>
    AttributeError: 'module' object has no attribute 'FSpOpenResFile'</p>
    <p>---------------</p>
    <p>On Lion with Python 2.7.</p>
    <p>Any ideas what could be wrong? Would really appreciate it.</p>
