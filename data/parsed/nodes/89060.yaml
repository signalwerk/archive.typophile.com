    html: |-
      <p>First, then, do the <code>ls /usr/bin/python*</code> thing. Also, if your machine has <code>/usr/local/</code>, try <code>ls /usr/local/bin/python*</code> in case there is a Python interpreter lurking there.</p>
      <p>Assuming you found, say, <code>/usr/bin/python2.5</code>: Say <code>python2.5 ttx foo.ttf</code> to check if it runs to completion. If <code>/usr/bin/python2.6</code> exists, try again with that.</p>
      <p>Then, open the <code>ttx</code> script in a text editor and change the <code>#! /usr/bin/env python</code> (the sha-bang line) at the top to reflect the latest version that works. Save it, and you should be back to NERV's motto.</p>
    html_clean: |-
      <p>First, then, do the <code>ls /usr/bin/python*</code> thing. Also, if your machine has <code>/usr/local/</code>, try <code>ls /usr/local/bin/python*</code> in case there is a Python interpreter lurking there.</p>
      <p>Assuming you found, say, <code>/usr/bin/python2.5</code>: Say <code>python2.5 ttx foo.ttf</code> to check if it runs to completion. If <code>/usr/bin/python2.6</code> exists, try again with that.</p>
      <p>Then, open the <code>ttx</code> script in a text editor and change the <code>#! /usr/bin/env python</code> (the sha-bang line) at the top to reflect the latest version that works. Save it, and you should be back to NERV's motto.</p>
