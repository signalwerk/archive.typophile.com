      <p><em>KeyError: 'glyph65535'</em></p>
      <p>65535 or 2¹⁶ − 1 is the maximum glyph index in OpenType fonts.</p>
      <p>This error is usually because of a glyph being referenced in an OT feature but missing from the font. The error is in the GSUB table here, so I'd check the classes and substitution features for missing glyphs.</p>
