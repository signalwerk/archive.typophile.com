    html: |-
      <p>One of mine: Pratt.<br>
      The Alternate is a slightly finer cut.<br>
      Try it out at WebINK with reduced linespacing and tighter letterspacing--it's a semi-condensed face with a large x-height and short descenders, so that will give you the kind of typographic punch that one gets in good print newspapers.</p>
