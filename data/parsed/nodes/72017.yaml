    html: |-
      <p>You can find an abridged version of Bringhurst's table in the LaTeX memoir class documentation</p>
      <p><a href="http://mirror.ctan.org/macros/latex/contrib/memoir/memman.pdf" title="http://mirror.ctan.org/macros/latex/contrib/memoir/memman.pdf">http://mirror.ctan.org/macros/latex/contrib/memoir/memman.pdf</a></p>
      <p>(see pages 13-14). The LaTeX source, memman.tex is to be found here:</p>
      <p><a href="http://mirror.ctan.org/macros/latex/contrib/memoir/doc-src/memman.tex" title="http://mirror.ctan.org/macros/latex/contrib/memoir/doc-src/memman.tex">http://mirror.ctan.org/macros/latex/contrib/memoir/doc-src/memman.tex</a></p>
      <p>Just search for "characters per line" in the file and you get the table in LaTeX format.</p>
      <p>Michel</p>
