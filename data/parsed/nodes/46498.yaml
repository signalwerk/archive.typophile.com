      <p>I just tried playing around with Zapfino Forte and Zapfino One, and adding stroke thickness approaches the sample, but the stroke details are wrong, as are the angles. When I tried adding  negative shear the M was too skewed if I got close with the I's. I also tried using path offsets with the outlines, and that was closer in some respects, but still had the wrong calligraphic stroke details.</p>
      <p>My inclination, based on my crude attempts, is to say that someone skilled in calligraphy might quite easily imitate the forms of Zapfino, but not without imparting their own signature technique. That's what I suspect we are seeing. </p>
      <p>If your goal is to approximately replicate this, then I agree with using Zapfino as a starting point, unless you have the calligraphic skill to imitate it.  Unless you match them side by side, I think it would be hard to describe the differences.</p>
      <p>- Mike Yanega</p>
