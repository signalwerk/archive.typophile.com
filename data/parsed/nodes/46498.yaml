    html: |-
      <p>@typerror: <em>And as to the thick/thin disparity I was merely trying to say that the thins are much heavier than Zapf would have done! It has been altered as well.</em></p>
      <p>Assuming Zapf did it. What if it isn't altered Zapfino, but merely a few glyphs that look like altered Zapfino? </p>
      <p><em>You were just pulling my leg, right?</em></p>
      <p>Not really. I just think it's wise not to jump to obvious conclusions based on visual evidence alone. We don't know the Zapfino theory is true, we only assume it is. It's one thing to overlay a sample on top of glyphs from a particular font and say "it was made out of this but modified" on account of the similarities, and it's another thing to acquire and provide proof that that is indeed what actually happened.</p>
      <p>@Nick Cooke: <em>I think you’re wrong James - Michael is right; Zapfino is the starting point.</em></p>
      <p>This is done with outset paths, a bit of skewing here and there and no other manipulation. </p>
      <p>A bit more refinement and you’re there.</p>
      <p>Your overlay drawing proves nothing other than the similarities between the glyphs in the I.D sample and Zapfino 1. It does not prove Zapfino was the starting point. I looked at Zapfino 1 as well, compared the sample, and concluded it may have been derived from Zapfino, or maybe not. Either way, all you've got is speculation based on what you want to believe, what you want reality to be.</p>
      <p>Whoever made the sample glyphs could have drawn them that way by eye using a sample of Zapfino. I could have done it by eye with a sample on-screen or printed and taped to the shadow mask of the screen. Any competent bezier wrangler could have done it by eye.</p>
      <p>I'm not saying it wasn't made out of Zapfino. All I'm saying is we don't <em>know</em> it was with certainty. The overwhelming similarities could be coincidental.</p>
      <p>And I'm playing devil's advocate too. Somebody has to.</p>
      <p>j a m e s</p>
