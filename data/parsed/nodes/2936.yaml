    date: 2004-02-02T21:16:00
    date_raw: 2 Feb 2004 — 9:16pm
    votes: null
    html: <p>I think it is perfectly legitimate for Nick to have included Panoptica in the way that he did. I've seen much more egregious self-promotion by authors, often not only including their own work but waxing at length on just how good it is. Nick just describes Panoptica and explains what he tried to do with the typeface.</p>
