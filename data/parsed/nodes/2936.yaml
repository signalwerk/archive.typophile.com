  html: '<p>A few months ago I asked Typophiles for suggestions for a magazine article I was writing for Graphic Exchange. <br> <br>That article is now finished: <a href="http://www.shinntype.com/Assets/Depts/Essays/NewPlast.pdf">New Plastic Weapons.</a> (1.5mb pdf) <br> <br>(The layout in the pdf here is pretty much a straight dump, and not that which the magazine art director came up with, which restricted the size of the type specimens.) <br> <br> <br> <br></p>'
