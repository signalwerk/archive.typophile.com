    html: <p>Maybe the question of etiquette in promotion should be raised in a thread of it's own.  <br> <br>In my view, Nick Shinn was totally in bounds in including one of his own fonts in this interesting article. It is relevant, above board, not overdone, and he is the author. It helps that the typeface is actually innovative and good! </p>
