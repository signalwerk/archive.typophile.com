    date_raw: 29 January 2004 - 8:45pm
    votes: 0
    html: <p>I remember when Jim brought his inkings to a class I was taking in Oakland, way back in the 70s. I also remember the ﬁrst word mark for <span class="caps">RS</span>. Jim was an inspiration to me.  <br><br>About parody.  <br>I guess it depends on who you are. The Swatch rip oﬀ done by Paula Scher [pg 448, History of Graphic Design; Meegs 3rd edition] becomes paying homage, according to Messrs. Heller and Meegs. Yet when someone emulates a style or really parodies it can be called rip oﬀ.   <br><br>Fossil, for example, is designing in a style and is not just lifting elements and placing them in a new context. Yet some have said that they are just appropriating. <br><br>So when a designer works on a typeface that is based on the original work of a “classic” how would you catagorize that?  Like Filosophia or Mrs eaves by Zuzana Licko. <br><br><br>Nick thank you for your insights and the marijuana review, gawd I remember that. <br></p>
