    html: <p>We're taking the opportunity at <a href="http://www.typecon2004.com" target="_blank"> TypeCon2004</a> this July to explore the work of some of the artists who helped shape the San Francisco aesthetic of the 60s-70s. Jim Parkinson will give a presentation which will include a look at his early work - Jim's talks are always a lot of fun. Roger Black is going to speak... Carl Rohrs, a talented NoCal calligrapher, will give a presentation about Rick Griffin. Carl's talk will showcase the work Rick did for RS, and also his other contributions to the scene - Haight Ashbury posters for the Grateful Dead, his work with Surfer mag, etc. It's going to be a treat to see what these guys were up to back in the day, as well as the great work they're doing now. <br></p>
