    date_raw: 31 Jan 2004 — 8:08am
    votes: null
    html: <p>Wow, paul, did I say Greiman? Paula Scher goes out of her way for the profession and for students and how do I repay her? Apologies to her and to everyone misled by me. I guess I was too lazy to get out my copy of the Meggs book and do the right thing. <br> <br>The argument of parody vs thievery could easily seem to be one of status. "Real" designers "pay homage" while "fake" designers "rip off." I don't believe in this mantra. I think that it is truly about concept and knowledge. Zuzana sees Baskerville as an opportunity for typographic improvement (and does it all justice), whereas Microsoft sees Helvetica as too expensive and comes up with Arial. Hippie steals a style, totally ignorant to the history and real connotations. <br> <br>I guess it gets stickiest with CSA and Duffy with their retro thing. I suppose its never been a crime to revive or reference style, but  it certainly doesn't further design and culture.  <br> <br>Anyway, its a classic argument, one that has been fought out by the best of us to no end.  <br> <br>Aaron</p>
