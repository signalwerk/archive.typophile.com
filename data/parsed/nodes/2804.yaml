    html: <p>The <i>Rolling Stone</i> logo was not derived from a font. It was drawn by lettering artist and type designer Jim Parkinson. You can see his work at his <a href="http://www.typedesign.com/">website</a>, including the <a href="http://www.typedesign.com/logos/rsa.html"><span class="caps">RS</span> logo</a>.</p>
