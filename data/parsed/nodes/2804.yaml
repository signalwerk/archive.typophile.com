    html: "<p>&gt;why is Bookman Swash Italic become so popular...? <br> <br>For the same reason as Avant Garde: it gave art directors lots of opportunity to add value to their work by exercising their typographic discrimination by spec'ing a specific set of alternate characters to create a custom wordmark or headline. And that was more fun and fulfilling than just getting it set plain. Today, types like Perla and Dalliance offer the same opportunity. <br> <br>&gt;Yes, it's sloppy, both in concept and execution, but it's parody. <br> <br>Sorry Kevin, I must disagree with you. The knock-off's execution is pretty slick. Maybe some of the curves could be a bit smoother, but the \"dimensionalization\" is a quite accurate copy, as are many of the letter forms. <br> <br>Please don't dignify such wholesale theft as \"parody\" -- real parody is either mocking, or a travesty. This rip-off is much too close to the original to be either: it adds nothing.  <br> <br>And that's when the purpose of parody is art, which is perhaps justifiable. But this is for a commercial product that capitalizes on the status of a registered trademark. That's outright larceny.</p>"
    html_clean: "<p>&gt;why is Bookman Swash Italic become so popular...? <br> <br>For the same reason as Avant Garde: it gave art directors lots of opportunity to add value to their work by exercising their typographic discrimination by spec'ing a specific set of alternate characters to create a custom wordmark or headline. And that was more fun and fulfilling than just getting it set plain. Today, types like Perla and Dalliance offer the same opportunity. <br> <br>&gt;Yes, it's sloppy, both in concept and execution, but it's parody. <br> <br>Sorry Kevin, I must disagree with you. The knock-off's execution is pretty slick. Maybe some of the curves could be a bit smoother, but the \"dimensionalization\" is a quite accurate copy, as are many of the letter forms. <br> <br>Please don't dignify such wholesale theft as \"parody\" -- real parody is either mocking, or a travesty. This rip-off is much too close to the original to be either: it adds nothing.  <br> <br>And that's when the purpose of parody is art, which is perhaps justifiable. But this is for a commercial product that capitalizes on the status of a registered trademark. That's outright larceny.</p>"
