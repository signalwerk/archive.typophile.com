  html: "<p>Hi typophiles, <br> <br>Today I was reading the newspaper and for the forst time I read a typographic article in the showbussines section. <br> <br>Here it is: \"Canal 13\" one of the biggest TV channels in here are promoting their new soup opera called \"Hippie\" that takes place in the 60s. <br> <br>The \"Hippie\" logo is everywhere in Chile and somehow the RollingStone got it. They are very upset and I can understand why. The office that design the \"Hippie\" logo say that there are too many typefaces like the one used in the \"RollingStone\" logo and that the complain has not a solid base.  <br> <br>In Chile the author rights for a designer doesn't exist, the lawyers don't recognize the graphic and typoface design as a field where the laws can be applied, so I am hoping that this could be a very good start point to eliminate the graphic design copycats, here thay are a plague and I really think that designers won't evolve until we realize that originality is an important fact in a good design. <br> <br>I have always love the typographic work in RollingStone Magazine, and I always think that their logo is a customize font. <br> <br>So, can anyone tell me if I am wrong, and what do you think about the similitud. <br> <br><img src=\"http://www.typophile.com/forums/messages/30/24681.gif\" alt=\"RollingStone v/s Hippie\"> <br> <br> <br>For me the \"Hippie\" logo is a very bad copy, the curves in the horizontal stem in the \"H\" are more natural for an \"R\", the \"e\" and \"i\" are identicals, and the \"Hp\" ligature is a bad varsion of the \"Rl\" in \"RoollinStone\" and owfully consturcted, its funny that the bad construction is evident just where they can't get an exact copy. <br> <br>I need the experts opinion, and I will do all I can to publish our final typophiles veredict in the same newspaper where I read the article, that by the way is the most important in Chile. <br> <br>Thanks for all the opinions, and don't get too upset with the copycats plague. <br> <br>CG <br> <br></p>"
  html_clean: "<p>Hi typophiles, <br> <br>Today I was reading the newspaper and for the forst time I read a typographic article in the showbussines section. <br> <br>Here it is: \"Canal 13\" one of the biggest TV channels in here are promoting their new soup opera called \"Hippie\" that takes place in the 60s. <br> <br>The \"Hippie\" logo is everywhere in Chile and somehow the RollingStone got it. They are very upset and I can understand why. The office that design the \"Hippie\" logo say that there are too many typefaces like the one used in the \"RollingStone\" logo and that the complain has not a solid base.  <br> <br>In Chile the author rights for a designer doesn't exist, the lawyers don't recognize the graphic and typoface design as a field where the laws can be applied, so I am hoping that this could be a very good start point to eliminate the graphic design copycats, here thay are a plague and I really think that designers won't evolve until we realize that originality is an important fact in a good design. <br> <br>I have always love the typographic work in RollingStone Magazine, and I always think that their logo is a customize font. <br> <br>So, can anyone tell me if I am wrong, and what do you think about the similitud. <br> <br><img src=\"http://www.typophile.com/forums/messages/30/24681.gif\" alt=\"RollingStone v/s Hippie\"> <br> <br> <br>For me the \"Hippie\" logo is a very bad copy, the curves in the horizontal stem in the \"H\" are more natural for an \"R\", the \"e\" and \"i\" are identicals, and the \"Hp\" ligature is a bad varsion of the \"Rl\" in \"RoollinStone\" and owfully consturcted, its funny that the bad construction is evident just where they can't get an exact copy. <br> <br>I need the experts opinion, and I will do all I can to publish our final typophiles veredict in the same newspaper where I read the article, that by the way is the most important in Chile. <br> <br>Thanks for all the opinions, and don't get too upset with the copycats plague. <br> <br>CG <br> <br></p>"
