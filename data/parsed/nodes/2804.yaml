    html: '<p>Here’s the evolution of the <i><span class="caps">RS</span></i> logo: <br><br><br><img src="http://www.typophile.com/forums/messages/30/24767.gif" alt="1967"><br><br>1967 Rick Griﬃn original. According to <i><span class="caps">RS</span></i> publisher Wenner, this was a sketch snatched from Griﬃn and he was never given the opportunity to do the ﬁnished art. <br><br><br><img src="http://www.typophile.com/forums/messages/30/24768.gif" alt="1974"><br><br>1974. Cleaned up a bit some time in the early 70s. <br><br><br><img src="http://www.typophile.com/forums/messages/30/24769.gif" alt="1975"><br><br>1975. Redrawn (by Parkinson?). Note the corrected stem weighting on the N. <br><br><br><img src="http://www.typophile.com/forums/messages/30/24770.gif" alt="1977"><br><br>1977. Redesign, by Parkinson. <br><br><br><img src="http://www.typophile.com/forums/messages/30/24771.gif" alt="1981"><br><br>1981. Slight redesign, by Parkinson, to restore some of the ﬂorid quality of the earlier logos. This one stuck and has not been changed since. <br><br><br>(Source: Rolling Stone: The Complete Covers,&nbsp;1998)&lt;/font&gt;</p>'
    html_clean: '<p>Here’s the evolution of the <i><span class="caps">RS</span></i> logo: <br><br><br><img src="http://www.typophile.com/forums/messages/30/24767.gif" alt="1967"><br><br>1967 Rick Griﬃn original. According to <i><span class="caps">RS</span></i> publisher Wenner, this was a sketch snatched from Griﬃn and he was never given the opportunity to do the ﬁnished art. <br><br><br><img src="http://www.typophile.com/forums/messages/30/24768.gif" alt="1974"><br><br>1974. Cleaned up a bit some time in the early 70s. <br><br><br><img src="http://www.typophile.com/forums/messages/30/24769.gif" alt="1975"><br><br>1975. Redrawn (by Parkinson?). Note the corrected stem weighting on the N. <br><br><br><img src="http://www.typophile.com/forums/messages/30/24770.gif" alt="1977"><br><br>1977. Redesign, by Parkinson. <br><br><br><img src="http://www.typophile.com/forums/messages/30/24771.gif" alt="1981"><br><br>1981. Slight redesign, by Parkinson, to restore some of the ﬂorid quality of the earlier logos. This one stuck and has not been changed since. <br><br><br>(Source: Rolling Stone: The Complete Covers,&nbsp;1998)&lt;/font&gt;</p>'
