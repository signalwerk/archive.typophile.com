    html: <p>This does bring up the constant debate between copying and referencing (remember Greiman’s swatch ad vs Herbert Matter’s Swissair? At least her social context and concept were well grounded.)  I think that the copyrights for these things are pretty vague anywhere you go, though I myself couldn’t say exactly. It seems like ever other logotype, lettermark, or logo is the same as the next these days. Can anyone here speak to the legal issues this image might face if it originated in the United States? <br><br>This shameless (and as you said, craftless) rip oﬀ is only made worse by the obligatory peace sign, the only intelligible reference to the social movements of the sixties. I guess it just goes to show that our fascination with retro style has usurped our understanding of the past. <br><br>Ok back to work. <br><br>Aaron</p>
