    html: <p>The problem with faces like Myriad and Arial (and it’s particularly obvious with sans faces) is that they leave a huge part of their “inspiration” unaltered, and this is what makes them unworthy to be given a name of their own, and the distinction of being an original design. <br><br>When a type designer has a genuine design idea, one that applies thoughout the character set, then you get a legitimate piece of work. <br><br>But like all ethical issues, it’s always shades of grey, and applying a “style ﬁlter” to a classic, as in Filosoﬁa, still doesn’t give it the merit of one of Licko’s truly original faces. That may be one reason she has added “gimmicks” to Filsoﬁa (the unicase) and Mrs Eaves (the crazy ligs, the 2 sets of <span class="caps">SC</span>). I’d like to see her do a traditional serifed face from scratch. That would be really special, as she’s aced every other genre including inventing a few of her&nbsp;own.</p>
