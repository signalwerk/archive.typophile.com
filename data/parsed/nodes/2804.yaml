    html: <p>Hi. I’ve been enjoyining reading the discussion about the Hippie logo. I’m tempted to comment on the evolution of the <span class="caps">RS</span> logo but it’s a loooooong story. Short version. Original logo was just a sketch by Rick Griﬃn. I think he made $75. The logo was later reﬁned by John Pistelli (Pistelli Roman). When I ﬁrst started sketching on the logo, I ran right oﬀ the road and into a ditch. My drawings were too hippy-dippy…practically unreadable. I was trying to honor the work of Griﬃn, but got lost somewhere. I turned my attention to another <span class="caps">RS</span> project. A type family. Roger Black wanted the typefaces to be based on <span class="caps">ATF</span> Jenson…or the Golden Types. I was, at that time, very uneducated about type and my work was still heavily inﬂuenced by Griﬃn. The result was a series of typefaces I have described as Nicholas Jenson on acid. Some years later, The Font Bureau invited me to make changes I always wanted to make…and add a few faces. Those types are at the <span class="caps">FB</span>, now known as Parkinson. Anyhow, after the type was taking shape, Roger suggested I try making the logo from those designs. The result was my ﬁrst <span class="caps">RS</span> logo. The 10th Anniversary version. A few years later, Jann Wenner asked me to try and bring back some of the feel of the original logo. I’ve heard that Mick Jagger made some comment to Jann that the 10th Anniversary logo appeared to have “lost its balls.” The result was the logo they use today. The intricated inline, outline arrangement was inspire by the Griﬃn logo but formalized, thanks to some ornate wood type samples and some herb. Regarding the Hippie logo…there have been dozens of knockoﬀs. I just wish they expanded on an idea..pushed it a bit further. Any&nbsp;questions?</p>
