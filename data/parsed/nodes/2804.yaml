    votes: 0
    html: '<p>There have been some intelligent and fair posts about the “Hippie” logo, and some that are perhaps a little harsh. From the representation that shows up on my screen, I don’t see the result as craftless or sloppy; simply a bit lacking in gestalt. The H seems to be arguing with itself, and the two p’s dont carry the same entry stroke as the i.  Why was the serif dropped on the top of the right stem on the H? At ﬁrst glance the piece doesn’t look all that bad. However, why bother with at best a tribute to <span class="caps">RS</span>, or at worst, a weak immitation of the master, Jim Parkinson. <br><br>Even though I am much wrapped up in my own irrelevant world of lead and ink, and don’t chase graphic design work much these days, “Hippie” is something I would have loved to take a whack at. Some people are incureable. <br><br>Some years back I had a studio space in Vancouver’s Gastown area (one of those nice old 1890’s ﬂat-iron buildings. In those days (late sixties) every lettering artist in town was trying to ape what was coming out of San Francisco, and I was one of them. There was a lot of work of that nature, and of course there was a lot of poster work as well. Reminiscing is bad for a person! <br><br>Plagarism depends on what the borrower’s motives are. If one wishes to quietly lift something and pass it oﬀ as their own; that stinks. It’s understandable that a piece of work so knocks a person out that they wished that they had done it. I have always felt that way about Bix Beiderbecke’s (someone for you to research if you are curious enough) musical ideas. For years and years, I tried to play his solos note for note, but I never sounded like anything other than myself, trying to play Bix’s stuﬀ. <br>What made Bix great is the same thing that makes Jim Parkinson great; some inner thing that is just there, and unexplainable. In short, natural talent. That’s what makes a master. <br><br>What I’m saying is, what I have always told my typography students: look at it, learn from it, and then go and have some fun with your <span class="caps">OWN</span> ideas. Good or bad, they are your own.  <br><br>This has gotten as long as War and Peace. Sorry. <br><br>Jim&nbsp;Rimmer</p>'
