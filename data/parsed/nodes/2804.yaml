    html: <p> Everyone, <br>On the second hand, our discussion is about the look of Hippie and how it "pays hommage" to Jim Parkinson's word mark for Rolling Stone. [tongue firmly in cheek here]  <br> <br>Hippie is poor lettering, and not well balanced. <br> <br>What we need to define here is "paying hommage" or diluting or "ripping off".   <br> <br>In my humble opinion, using  a style as inspiration is paying hommage. But when we talk about taking or appropriating images from the past and reusing them in a different context or using them to lend validity or historicisim for a product should that be called "rip off"?   <br> <br>Licko said she was paying hommage with her "classics" inspite of the gimmicks by the dutch guys (was it Erik or Just? who did the ligature programming). Scher said nothing at the time (it was done ex-post facto). <br> <br>So maybe we can define these differences as whether the designer actually says that they are paying hommage or state where they get their inspiration; many type designers are going back in time to get inspiration, or to do revivalist work. <br> <br>I realize that there is no "answer" to this, but like language we can come up with consensus. <br> <br>Maybe that is the direction we could take on this. <br>PS.</p>
