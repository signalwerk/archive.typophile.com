    html: <p><i>I'm more curious about the target market of this "hippie" business. If it is for 20-somethings (and non-historians) perhaps it is better to use the Parkinson design as opposed to the original. They might associate Rollingstone with that time period, but the Rollingstone of today, and wouldn't be able to associate "hippies" with the original artwork. </i> <br> <br>Maybe. But, while Parkinson's logo (and possibly the lame imitation of it) says "Rolling Stone," it doesn't really say "hippie." On the other hand, Griffin's logo (like just about everything else he did) definitely says "hippie," but possibly not "Rolling Stone" (an interpretation which seems to be unnecessary anyway).</p>
