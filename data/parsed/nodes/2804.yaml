    html: <p>It doesn't say "hippie" me either. But, to people that don't truly understand history and culture (this one in particular), visual history especially, I think it would be easy to confuse it. Griffin's logo is not near as eponymous with the so-called rock subculture as is that of Parkinson.</p>
