    html: |-
      <p>I recall seeing the 1974 version at Rick Griffin's house in the late '70s. I didn't realize that it was a cleaned up version of the 1967 original. Thanks to Mark for the evolutionary samples.</p>
      <p><em>Hippy</em> is almost perfectly goofy. Nothing wrong with that.</p>
      <p>Chile had a very rich counter-culture which survived the US-backed dictatorship, but which isn't proving to be sufficiently resilient to survive World Bank and International Monetary Fund policies. Perhaps <em>Hippy</em> reflects that reality rather well.</p>
