    html: "<p>But there is no real text face design without proper spacing. <br> <br>&gt; I'd like to see her do a traditional serifed face from scratch. <br> <br>Really? Aren't there too many people doing that already? She should use her inventiveness, just channel it better. Modula for example is a superb design, but with a hamartia: the overly literal lc \"g\" that makes the font not a text face. She should make a Modula-2 (huh, like the programming language!) with that (and the spacing) fixed. <br> <br>Or maybe I'm getting your \"traditional\" wrong. But Filosofia and Mrs Eaves are highly traditional in my mind - although the former is still a dysfunctional Didone, and the latter requires InDesign's optical spacing to really carry text (and only at larger sizes). <br> <br>hhp <br></p>"
