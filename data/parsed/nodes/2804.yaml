    html: '<p>The "designer" of the logo is a lazy, ignorant rip-off artist. Or maybe the client is to blame. <br> <br>The easy route for designers working on historical projects is to use the shorthand symbols that have now come to be associated (often anachronistically) with a particular era, rather than do the necessary research, immerse oneself in the era, and channel something more authentic. <br> <br>The issue is also one of cultural identity: surely the hippy movement in Chile had some local flavour. Surely Chile had its own local counter culture/rock publications which should be referenced.  <br> <br>Think globally, act locally!</p>'
    html_clean: '<p>The "designer" of the logo is a lazy, ignorant rip-off artist. Or maybe the client is to blame. <br> <br>The easy route for designers working on historical projects is to use the shorthand symbols that have now come to be associated (often anachronistically) with a particular era, rather than do the necessary research, immerse oneself in the era, and channel something more authentic. <br> <br>The issue is also one of cultural identity: surely the hippy movement in Chile had some local flavour. Surely Chile had its own local counter culture/rock publications which should be referenced.  <br> <br>Think globally, act locally!</p>'
