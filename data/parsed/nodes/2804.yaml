    html: <p>I wasn't disagreeing with any of you. I was simply wondering aloud why the designer did it?  <br> <br>Of course it would be better for them to do research. But then, where do you draw the line? Is it alright then, that April Greiman "appropriately" appropriated the design of Herbert Matter? <br> <br>It strikes me strangest, as Nick pointed out, that the design says nothing of Chile. <br></p>
