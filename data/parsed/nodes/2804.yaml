    html: <p>“Must an infringer be a competitor? <br>No. The focus of trademark infringement analysis is on the confusion of actual or potential customers. Accordingly, an infringer’s products or services need only be suﬃciently related to the trademark owner’s products or services so that it is likely that both are promoted to and/or used by common customers.” <br>— International Trademark Association <br><br>So, the inherent legal problem with close parody is that the rip-oﬀ looks like it is a product of, or endorsed by, the owner of the&nbsp;trademark.</p>
