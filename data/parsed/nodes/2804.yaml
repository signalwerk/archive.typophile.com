    html: '<p>Types of the counter culture: <br><br>Windsor Bold, used for the title of The Last Whole Earth Catalog.  <br><br>Cooper Black, in back-to-the-land colour scheme of brown on beige. <br><br>Those faces have a soft and hand-made look, gentle, peaceful, retro in an anti-modern-civilisation kind of way.  <br><br>Anything set with <span class="caps">IBM</span> Selectric type and photocopied. <br><br>In comparison, the Pump look used for Dharma and Greg, and That 70s Show, is a little later, Velvet Goldmine, not hippy but glam. <br><br>The intricate 3-d of Parkinson’s <span class="caps">RS</span> logo always struck me as having a brash slickness like early rock’n’roll, giving a pedigree and a sense of historical import to the publication. The underlying letterforms are very Americana, a lot of Swashed-out Bookman in there, and that was a ’60s retro thing (as in classic Kayser&nbsp;ads). </p>'
