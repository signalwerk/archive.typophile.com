    html: <p>I dislike hearing abuse of the word "parody" as much as anyone, Nick, but I still say this is parody and fair use. The only reason they would ever choose to make it look like that is the expectation that anyone must immediately see that it is meant to look like the Rolling Stone masthead. The viewer is supposed to say, ah, hippies, Woodstock, Rolling Stone, I get it, ha ha. <br> <br>Whether it is commercial or not does not matter, because they only imitated the style to make their reference; they're not stealing the masthead itself and calling their show the Rolling Stone Show.</p>
