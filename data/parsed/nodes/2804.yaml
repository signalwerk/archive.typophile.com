    date_raw: 22 Jan 2004 — 7:38am
    votes: null
    html: <p>Incidentally, if they were trying to invoke the spirit of the sixties by aping the <i>Rolling Stone</i> logo, they're a bit off the mark chronologically. <i>RS</i> began using that particular logo in 1980. Playing off the original logo by Rick Griffin would have been more apt (though perhaps less recognizable). <br> <br>Also, this is not the first time the <i>Rolling Stone</i> logo has been appropriated. Some other examples are the recent movie <a href="http://www.schoolofrockmovie/">School of Rock</a> and the 1985 movie <a href="http://www.impawards.com/1985/perfect.html">Perfect</a> (although, I think <i>RS</i> may have been an accomplice in this last one). I know there have been others.</p>
