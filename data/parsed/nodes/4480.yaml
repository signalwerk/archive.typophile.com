      <p>More stuff. I'm up to around 400 characters so far. This sample doesn't have everything, but it's a bunch. I didn't intend to go this far with this one. I was just working on ideas on how to work the connectors with opentype. At any rate, I've manually added a little bit more resolution to most of the letters. It will take quite a bit more before I'm happy with the digitization. I need to get a scanner (I recently gave my old scsii beast to a thrift store). My 3MP CoolPix isn't cutting it here. It still doesn't seem random enough. I am working out some more fancy OT stuff to randomize the letters. For example, the ll ligature seems to repeat too often. I might mix some of the alternate l's in there somehow. The ff combination also seems repetitive. Maybe it's just becuase I've been looking at it too long. The reality is that the font will probably never be used for more than one sentence anyway, now that I think about it. <br> <br>One question for the OT techies out there: at what point to OT instructions start to bog down the software. I would like to do some contextual stuff to make sure that no two letters are ever the same within three characters or so. It will take a lot of instructions to really get it right. I haven't noticed any slow down yet, but it seems like if it had to parse a couple hundred lines of code for every character it would really start to bog down the host software. <br> <br></p>
