    <p>I put this study together this afternoon. It was good to get out the ink and work on paper for once. I've been meaning to play with cursive contextual alternates for a little while. The good news: no kerning! The bad news: getting all the connectors just right. I'm not sure if this works yet; I'm still against handwriting fonts in general, but they're definitely cooler with some alternates mixed in, and with the connectors done right. I think to do it right I would need to mix in a bunch more alternates, but it's a start, and I like where it's going so far. The letters are pretty low res; my scsi scanner won't work with the powerbook, so I resorted to the digicam : (  <br> <br></p>
