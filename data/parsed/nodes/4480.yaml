    html: <p>It's looking pretty darn random. I just came up with a theory. It seems like the glyphs that suffer the most for lack of randomization are the ascenders/descenders. The l jumped out straight away. <br> <br>Be careful of making your outlines too detailed. I don't think they are bad now. Maybe a little smoother so it's not quite so toothy when it's 400pt. But I wouldn't give the outlines any more nodes. <br> <br>A set of fancy signoffs could be fun, Sincerely, With Deepest Affection, Best Regards, Love, etc. How bout a digitally remastered version? Only kidding :-) <br> <br>You are pushing me to experiment with OT. Rock solid work! <br> <br>Randy</p>
