  - id: 142533
    user: 1
    date: 2004-05-27T22:15:00
    date_raw: 27 May 2004 — 10:15pm
    votes: null
    html: "<p>It's not true randomness. The OT code looks something like this: <br> <br>@random_set_1 = [a d g j l m n o c]; <br>@random_set_2 = [k e i n p q t v z]; <br>@letter = [a b c d e f g h i j k l m n o p q r s t u v w x y z]; <br>@letter_alt = [a.alt b.alt c.alt d.alt e.alt f.alt g.alt h.alt i.alt j.alt k.alt l.alt m.alt n.alt o.alt p.alt q.alt r.alt s.alt t.alt u.alt v.alt w.alt x.alt y.alt z.alt]; <br> <br>feature calt { <br>  sub @random_set_1 @letter @letter' by @letter_alt; <br>  sub @random_set_2 @letter @letter' by @letter_alt2; <br>} calt; <br> <br>If you put in enough of these ugly hacks it starts to appear random. You would also want to make sure that no two letters were ever the same right next to each other. There are only so many of those that happen regularly in English, so I have added specific substitution rules for each of those cases (ee ff gg ll mm nn oo, etc.) Also notice that I have placed an @letter between the @random character. This makes the pattern even more difficult to spot. You might notice the funky h after every t, but you wouldn't notice the funky h after t-anycharacter, (unless you were freaking crazy). <br> <br>In the case of this font, the fact that there are a different set of characters to connect to the o b v w also helps the font appear more random. The randomness feature above needs to be adjusted to get the connectors right for this one, which makes it more complicated. To be honest, I haven't completely figured it out.</p>"
    html_clean: "<p>It's not true randomness. The OT code looks something like this: <br> <br>@random_set_1 = [a d g j l m n o c]; <br>@random_set_2 = [k e i n p q t v z]; <br>@letter = [a b c d e f g h i j k l m n o p q r s t u v w x y z]; <br>@letter_alt = [a.alt b.alt c.alt d.alt e.alt f.alt g.alt h.alt i.alt j.alt k.alt l.alt m.alt n.alt o.alt p.alt q.alt r.alt s.alt t.alt u.alt v.alt w.alt x.alt y.alt z.alt]; <br> <br>feature calt { <br>  sub @random_set_1 @letter @letter' by @letter_alt; <br>  sub @random_set_2 @letter @letter' by @letter_alt2; <br>} calt; <br> <br>If you put in enough of these ugly hacks it starts to appear random. You would also want to make sure that no two letters were ever the same right next to each other. There are only so many of those that happen regularly in English, so I have added specific substitution rules for each of those cases (ee ff gg ll mm nn oo, etc.) Also notice that I have placed an @letter between the @random character. This makes the pattern even more difficult to spot. You might notice the funky h after every t, but you wouldn't notice the funky h after t-anycharacter, (unless you were freaking crazy). <br> <br>In the case of this font, the fact that there are a different set of characters to connect to the o b v w also helps the font appear more random. The randomness feature above needs to be adjusted to get the connectors right for this one, which makes it more complicated. To be honest, I haven't completely figured it out.</p>"
