    html: "<p>Tiff: I have been trying to work out a double f solution. I'm not quite satisfied with what I've got. You are one step ahead of me on the non-connected characters. I'm working on a set of leading strokes that can attach to the first letter in a word, as well as a set of characters sans connecter. There are certain characters that work well without a following connector: an occasional x or t--s's can be nice too. If I do get around to adding the unconnected series, I'll tie the left connecterless to the right connecterless with OT. <br> <br>I have been thinking about some more ink spatter and I've settled on using \"spatter alternates.\" Since the current implementation of OT doesn't allow for inserted characters, I'll have to attach the spatters to different characters. What I'm doing so far is placing the spatters so that they will end up to the far left or right of the spatter alternate (or even show up on another line). This way, the spatters will be connected to random characters. The trick is planning the spatters so they look good where they happen to land. <br> <br>Of course, I'm still adding more alternate caps. I've got three different SC sets. I'm starting to resign myself to the fact that I can't get the randomness perfect with OT. The typographer will have to add a few alternates here and there to polish it off, but at least they'll have plenty to choose from. (See the small caps in the last sample: I've added alternates by hand.)</p>"
