    html: <p>Very, very impressive. Christian, it is so cool to go back through these forums and watch a brand new high-quality type library unfold inside less than five years. You are truly talented. Your designs just keep getting better and better. <br> <br>I worked with Erik van Blokland (Letterror) a few years ago on something similar for the OT implementation of his Kosmik design. Every glyph (including accents and punctuation!) had three variants. We overloaded the Contextual Alternates feature to simulate ideal flipping behavior as best we could. But as you widen the "search radius" the feature code grows geometrically in size. We learned yet another way to crash InDesign. <br> <br>I am hoping that the good folks at Adobe and MS will do the necessary programming to add true flipping capability to their layout engines and support the RAND feature, <a href="http://www.microsoft.com/typography/otspec/features_pt.htm#rand">described here</a> in the OT spec. Then Contextual Alternates can be freed up to do its real job in fonts (like yours) where you do have truly contextual alternates like your loopy d. ("pendant") <br> <br>It would not hurt for a font developer like yourself to drop a line to the Powers That Be at Adobe and second these requests to the InDesign/CoolType programming teams. Especially with one of these PDF samples of your font in action.</p>
