      <p>You're right that the resolution is pretty low. I think I will have to go in and add some more points. In the mean time, I've added even more 'splotchiness'. I added some ink blots in an OpenType feature. I also added one set of caps. (I'll be adding a bunch of alternates for the caps too).  <br> <br>The trick is setting up the OpenType stuff to add as much randomness as possible. Right now I've only got five different ink blots, which appear fairly frequently. I think if I add a bunch more, then make each of them less frequent, the effect will be better. <br> <br></p>
