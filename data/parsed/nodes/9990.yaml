    html: <p>This reminds me of a similar font ( it had a folded structure too) we saw here a while ago but I see you have worked out a method for making the folds automatic instead of intuitively. I readlly like the early images. The structural honesty is nice. When we go to the all black version I think some of the charm is lost. I think that you may be adhering to your rules a little to closely for some of the characters. The T &amp; X for instance. Why not use two pieces of ribbon rather than one? The A on the other hand uses the idea of continuous ribbon &amp; the quirks (charcater) you get to great effect. <br> <br>In you post you say that letters with round parts are missing but the images you link to have rounded parts. I am confused. <br> <br>Regarding the P &amp; B &amp; C - ( <a href="http://www.stud.ntnu.no/~kovalev/bilder/Bilde-2.jpg" target="_blank">http://www.stud.ntnu.no/~kovalev/bilder/Bilde-2.jpg</a> )  I like them. You could go more angular &amp; reduce the number of folds too. <br> <br>What about decorative endings at the terminal end of the ribbon? What about an overflay font or two that could fill in the ribbon, maybe with altrenating color? <br> <br>Anyway, I like it &amp; I hope you finnish it. <br> <br> <br> <br><img src="http://www.typophile.com/forums/messages/29/68265.gif" alt=""></p>
    html_clean: <p>This reminds me of a similar font ( it had a folded structure too) we saw here a while ago but I see you have worked out a method for making the folds automatic instead of intuitively. I readlly like the early images. The structural honesty is nice. When we go to the all black version I think some of the charm is lost. I think that you may be adhering to your rules a little to closely for some of the characters. The T &amp; X for instance. Why not use two pieces of ribbon rather than one? The A on the other hand uses the idea of continuous ribbon &amp; the quirks (charcater) you get to great effect. <br> <br>In you post you say that letters with round parts are missing but the images you link to have rounded parts. I am confused. <br> <br>Regarding the P &amp; B &amp; C - ( <a href="http://www.stud.ntnu.no/~kovalev/bilder/Bilde-2.jpg" target="_blank" class="link-external">http://www.stud.ntnu.no/~kovalev/bilder/Bilde-2.jpg</a> )  I like them. You could go more angular &amp; reduce the number of folds too. <br> <br>What about decorative endings at the terminal end of the ribbon? What about an overflay font or two that could fill in the ribbon, maybe with altrenating color? <br> <br>Anyway, I like it &amp; I hope you finnish it. <br> <br> <br> <br><img src="http://www.typophile.com/forums/messages/29/68265.gif" alt=""></p>
