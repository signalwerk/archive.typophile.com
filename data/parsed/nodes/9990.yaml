    html: <p>All the characters use a kind of flattened ribbon. What if some of it was allowed the ribbon to drape or curve or twist? That would give you some additional forms to work with. Intuitively it seems like a few curves, or drapes could add balance to the face and give you a more complex/richer rhythm. I don't think the face aught to be more frou-frou or lacy. Maybe just less tight. I really like what you have done.</p>
