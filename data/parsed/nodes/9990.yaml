  html: "<p>Hello, everyone, I'm currently working on my first font, which is caps-only. The work is still in a very early stage as you will see. Personally I think it's perfect and I'm ready to go on with rendering. I need you, experienced type designers, to assure me and give me pass before I continue. I am worried about the dimensions (too wide/too thin) of some letters (M, T, W and 4). Some letters, which include round parts, are missing. <br> <br>This is how the font is initially supposed to look like:  <br><a href=\"http://www.stud.ntnu.no/~kovalev/bilder/Bilde-1.jpg\" target=\"_blank\">http://www.stud.ntnu.no/~kovalev/bilder/Bilde-1.jpg</a> <br><a href=\"http://www.stud.ntnu.no/~kovalev/bilder/Untitled-5.gif\" target=\"_blank\">http://www.stud.ntnu.no/~kovalev/bilder/Untitled-5.gif</a>  <br> <br>First version which didn't go well : <br><a href=\"http://www.stud.ntnu.no/~kovalev/bilder/Bilde-2.jpg\" target=\"_blank\">http://www.stud.ntnu.no/~kovalev/bilder/Bilde-2.jpg</a>  <br> <br>The grid and the skeleton of the font, and a filled version for you to see its shape easier: <br><a href=\"http://www.stud.ntnu.no/~kovalev/bilder/Bilde-3.jpg\" target=\"_blank\">http://www.stud.ntnu.no/~kovalev/bilder/Bilde-3.jpg</a>  <br><a href=\"http://www.stud.ntnu.no/~kovalev/bilder/Untitled-4.gif\" target=\"_blank\">http://www.stud.ntnu.no/~kovalev/bilder/Untitled-4.gif</a>  <br><a href=\"http://www.stud.ntnu.no/~kovalev/bilder/Untitled-3.gif\" target=\"_blank\">http://www.stud.ntnu.no/~kovalev/bilder/Untitled-3.gif</a>  <br><a href=\"http://www.stud.ntnu.no/~kovalev/bilder/Untitled-2.gif\" target=\"_blank\">http://www.stud.ntnu.no/~kovalev/bilder/Untitled-2.gif</a></p>"
  html_clean: "<p>Hello, everyone, I'm currently working on my first font, which is caps-only. The work is still in a very early stage as you will see. Personally I think it's perfect and I'm ready to go on with rendering. I need you, experienced type designers, to assure me and give me pass before I continue. I am worried about the dimensions (too wide/too thin) of some letters (M, T, W and 4). Some letters, which include round parts, are missing. <br> <br>This is how the font is initially supposed to look like:  <br><a href=\"http://www.stud.ntnu.no/~kovalev/bilder/Bilde-1.jpg\" target=\"_blank\" class=\"link-external\">http://www.stud.ntnu.no/~kovalev/bilder/Bilde-1.jpg</a> <br><a href=\"http://www.stud.ntnu.no/~kovalev/bilder/Untitled-5.gif\" target=\"_blank\" class=\"link-external\">http://www.stud.ntnu.no/~kovalev/bilder/Untitled-5.gif</a>  <br> <br>First version which didn't go well : <br><a href=\"http://www.stud.ntnu.no/~kovalev/bilder/Bilde-2.jpg\" target=\"_blank\" class=\"link-external\">http://www.stud.ntnu.no/~kovalev/bilder/Bilde-2.jpg</a>  <br> <br>The grid and the skeleton of the font, and a filled version for you to see its shape easier: <br><a href=\"http://www.stud.ntnu.no/~kovalev/bilder/Bilde-3.jpg\" target=\"_blank\" class=\"link-external\">http://www.stud.ntnu.no/~kovalev/bilder/Bilde-3.jpg</a>  <br><a href=\"http://www.stud.ntnu.no/~kovalev/bilder/Untitled-4.gif\" target=\"_blank\" class=\"link-external\">http://www.stud.ntnu.no/~kovalev/bilder/Untitled-4.gif</a>  <br><a href=\"http://www.stud.ntnu.no/~kovalev/bilder/Untitled-3.gif\" target=\"_blank\" class=\"link-external\">http://www.stud.ntnu.no/~kovalev/bilder/Untitled-3.gif</a>  <br><a href=\"http://www.stud.ntnu.no/~kovalev/bilder/Untitled-2.gif\" target=\"_blank\" class=\"link-external\">http://www.stud.ntnu.no/~kovalev/bilder/Untitled-2.gif</a></p>"
