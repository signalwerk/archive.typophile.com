    html: "<p>Hello, Eben. You're right, I myself like the early thin version better, so I'll stick to it then. Thanks for the replies, btw, new ideas are rushing over me... Decorative endings have been pursuing me from the very beginning, but I havent been able to find a way to implement those endings in the way I wanted I'll post an update as soon as I come to the round parts. There are two ways a ribbon can be \"bend\" and I still have a choice to make  Not sure what you mean by \"less tight\", I have a wider, not as tall version which I'll post later  Using as inspiration: <a href=\"http://www.myfonts.com/fonts/redrooster/grand-canyon-rr/light/\" target=\"_blank\" rel=\"nofollow\">http://www.myfonts.com/fonts/redrooster/grand-canyon-rr/light/</a> <a href=\"http://www.myfonts.com/fonts/fontbureau/constructa/regular/\" target=\"_blank\" rel=\"nofollow\">http://www.myfonts.com/fonts/fontbureau/constructa/regular/</a></p>"
