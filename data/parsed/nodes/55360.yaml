    <p></p><div class="imageWrap"><img src="http://typophile.com/files/milton_glaser_MOMA_9770003_3778.jpg"></div><p></p>
    <p>Title: Mahalia Jackson, Easter Sunday, Philharmonic Hall, Lincoln Center.<br>
    This piece is designed by Graphic Designer, Milton Glaser. It is an offset lithograph. I really like the designer's use of vibrant color to bring life to the poster. While looking through Milton Glaser's work, I found that his use of vibrant color is apparent in most of his work. His designs are very visually intriguing, and the viewer's eye is constantly moving over the design.</p>
