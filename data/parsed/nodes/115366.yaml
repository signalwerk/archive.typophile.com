  html: |-
    <p>I'm looking for a programming font similar to Andale Mono.</p>
    <p>But I'd like the font to be more "square" and "strict/severe" than Andale Mono. </p>
    <p>For instance, the "r" in Andale Mono bends - and I'd prefer an "r" with a straight line. </p>
    <p>Which font would you recommend for a website design - a programming font similar to Andale Mono but more "square/harsh/severe/cold/technical-looking"?</p>
    <p>And with few round - bending - or ornamental details :)</p>
    <p>I'd be grateful for any and all recommendations - thanks a lot!</p>
    <p>(The 10 programming fonts listed at: <a href="http://hivelogic.com/articles/top-10-programming-fonts" title="http://hivelogic.com/articles/top-10-programming-fonts">http://hivelogic.com/articles/top-10-programming-fonts</a></p>
    <p>all have rounded shapes either in the "r"' or the "l"-letters.  </p>
    <p>Of those 10 fonts, I prefer Andale Mono because it does not look overtly "designed" - I like its cold, machine-like feel - but it's still not perfect :)</p>
