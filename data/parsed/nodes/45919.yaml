    <p>Hey everyone,</p>
    <p>I was going to write an intro but dont want to waste your time...</p>
    <p>Im starting out as a designer and would like to find a good book about type history that would include info such as the following:</p>
    <p>- genealogy of type such as: akzidenz grotesk -&gt; helvetica -&gt; univers</p>
    <p>- "Like Serifa, Glypha is also based on the general scheme used to design Univers."</p>
    <p>Ive seen histories like Lewis Blackwells 20th Century Type but they seem a too light. Id like something a bit more in depth.</p>
    <p>Any ideas?</p>
    <p>Thanks in advance!!!</p>
