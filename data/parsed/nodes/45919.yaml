      <p>Lawson's book may not be the flashiest book on type ever made but it really helps in understanding the history of type and how and why it evolved, if you are really interested on that and not only on identifying type styles and names give it a second tought. On the other hand it really is a text heavy book and you have to read it on episodes. Also there is no information of modern type styles on the book.</p>
      <p>By the way, Univers might be misplaced on that genealogy (AG-&gt;H-&gt;U). If I my memory doesn't fail both faces were released almost the same year or so. Univers was inovative on the concept and execution of a type family as a system and performed better as text face, Helvetica on the other hand was a restyling of AG and performs better as a display face.</p>
      <p>Héctor</p>
