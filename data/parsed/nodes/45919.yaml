      <p>Héctor: "there is no information of modern type styles on the book". </p>
      <p>&gt; well, it depends what you call "modern", if it is contemporary of course not, for the book was published a long time ago and the author died in 2002; but there is indeed some info about sans serif types from the 20th century, and even if not a lot, it is quite interesting though.</p>
      <p>Helvetica and Univers were indeed released the same year. The actual genealogy would be something like:</p>
      <p>William Caslon IV egyptian &gt; Breite Grotesk &gt; Royal Grotesk &gt; Accidenz / Akzidenz Grotesk &gt; Neue Haas Grotesk / Helvetica + Univers + Folio</p>
      <p>not to mention all the revivals, inspirations, redesigns... including Standard / Basic Commercial, Arial, FF Schulbuch, Paralucent, Monotype Grotesque, FF Bau, Preface... and countless others.</p>
      <p>dr</p>
