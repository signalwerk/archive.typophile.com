      <p>Anatomy of a typeface is a very interesting book, but obviously out of date - though Lawson (who died a couple of years ago, RIP) has indeed some interesting things to say about sans serif as well. The book unfortunately is a no-design: mainly text, no layout, few images printed in a low quality... you might hold on if you already have some knowledge in type, otherwise you'll sleep after a dozen pages. </p>
      <p>The two best books i've ever read about history of type are unfortunately (for you) in french, but they are worth learning the language because they don't have any equivalent in english, both written by yves perrousseaux: "manuel de typographie elementaire" and especially "histoire de la typographie", a huge encyclopedia about the history of typography, large format, nicely laid out, with an unbelievable amount of historical facts and references and filled with very high quality scans of terrific documents. volume one is out since last year, volume two is due to be released in september 2009. A must have, really. If you know any serious publisher in the US or UK, please try to convince him to translate this book. You won't regret it. </p>
      <p>*shameless auto-advertisement mode on*</p>
      <p>Also, regarding how to choose a font for a specific job: there is my own book, which gives a detailed history of about 60 typefaces, their creator, the social background, the connotations of each of them, some examples, and a search tool; it also includes participations by Erik Spiekermann, Alejandro Paul or Xavier Dupre, and it really has no equivalent anywhere, by now. Unfortunately, it is again in french, and won't be out before september... again, if you know a publisher :-)</p>
      <p>*shameless auto-advertisement mode off*</p>
      <p>You might also consider the lecture of "the secret history of type" by simon loxley, a nice book to read if you want to know some details about the lives of great typographers (though the informations are not always interesting, and once again the layout and the printing quality sucks)... But about in-depth info on type history, as far as I know, that's about it.</p>
      <p>dr</p>
