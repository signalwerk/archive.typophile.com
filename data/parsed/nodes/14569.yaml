    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12038" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Terminology</a>&nbsp;:&nbsp;Figures</strong></p>
    <p>Arabic numeral glyphs. Often characterized as <a href="/node/13897" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">oldstyle</a>, <a href="/node/13915" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">lining</a> and <a href="/node/16999" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">tabular</a>.</p>
    <p><img src="/sites/default/files/old-images/Codex_Vigilanus_4373.jpg"></p>
    <p><em>The first appearance of any numerals in a manuscript in Europe:<br>
    Codex Vigilanus, written by a Spanish monk in the year&nbsp;978</em></p>
    <p>The first printed books did not make use of <a href="/node/add/wiki?edit%5Btitle%5D=Arabic%20numerals" title="Create node &quot;Arabic numerals&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Arabic numerals</a> at all. None of <a href="/node/add/wiki?edit%5Btitle%5D=Gutenberg" title="Create node &quot;Gutenberg&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Gutenberg</a>’s printings contain any Arabic numerals. <a href="/node/add/wiki?edit%5Btitle%5D=Ratdolt" title="Create node &quot;Ratdolt&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Ratdolt</a> was one of the first to use printed Arabic numerals in his books – many of which were about mathematics and astronomy. His numerals left behind any traces of medieval forms and are immediately familiar to the modern eye. The zero is a perfect circle. <a href="/node/14192" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Aldus</a>’s zero was a perfect circle, as well as the zeros in <a href="/node/add/wiki?edit%5Btitle%5D=Claude%20Garamond" title="Create node &quot;Claude Garamond&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Garamond</a>’s&nbsp;typefaces.</p>
    <p><img src="/sites/default/files/old-images/Ratdold_4978.jpg"></p>
    <p><em>Numerals with perfect circle zero by Erhard Ratdolt,&nbsp;1482.</em></p>
    <p><img src="/sites/default/files/old-images/Aldus_Griffo_4507.jpg"></p>
    <p><em>Numerals with perfect circle zero by Aldus / Griffo,&nbsp;1502.</em></p>
    <p><a href="/node/add/wiki?edit%5Btitle%5D=Francois%20Guyot" title="Create node &quot;Francois Guyot&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Francois Guyot</a> was one of the first type designer (or was he the first at all?) to cut both a roman and an italic related to each other, evidently with the idea that both may be used together. He used exactly the same numerals for both the roman and the italic typeface (as one can see in the Folger type specimen of c. 1565). His zero is a perfect circle. (<span class="caps">BTW</span>, perfect circle actually means perfect circle - the counter in one of Granjon’s typefaces was drilled, as one can see in Fred Smeijers: ‘Counterpunch’, p&nbsp;158.)</p>
    <p><a href="/node/add/wiki?edit%5Btitle%5D=Ameet%20Tavernier" title="Create node &quot;Ameet Tavernier&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Ameet Tavernier</a> was the first punchcutter who designed inclined numerals for an italic typeface, but he did not dare to touch the perfect circle shape of the zero, so the zero is upright and not&nbsp;inclined.</p>
    <p><img src="/sites/default/files/old-images/Tavernier_5876.jpg"></p>
    <p><em>Numerals for an italic by Ameet Tavernier, 1554<br>
    The numerals are inclined, except perfect circle&nbsp;zero.</em></p>
    <p>Approximately at the same time, <a href="/node/add/wiki?edit%5Btitle%5D=Robert%20Granjon" title="Create node &quot;Robert Granjon&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Robert Granjon</a> cut his first italic with inclined numerals, but he also slanted the zero, which therefore turned into an oval. It is very interesting to observe that Granjon, even if he abandoned the shape of the perfect circle, retained the other characteristic feature of the zero, its monolinear stroke thickness. He must have found it important to still keep the shape of the zero different, while trying to bring the design of the numerals closer to the design of the&nbsp;italic.</p>
    <p><img src="/sites/default/files/old-images/Granjon_5345.jpg"></p>
    <p><em>Numerals for an italic by Robert Granjon, c. 1554<br>
    The zero is also inclined, but still monolinear (without modulation in stroke&nbsp;thickness)</em></p>
    <p>The introduction of numerals of equal width (one of the two features commonly attributed to the so-called ‘tabular figures’ as opposed to the so-called ‘old-style figures’) preceded the new design of numerals of uniform height. Already in 1764, <a href="/node/add/wiki?edit%5Btitle%5D=Pierre-Simon%20Fournier%20le%20jeune" title="Create node &quot;Pierre-Simon Fournier le jeune&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Pierre-Simon Fournier le jeune</a> wrote in his Manuel typographique about numerals of equal&nbsp;width:</p>
    <p>‘The figures of the roman have no respective sets, but one uniform one. They are all cast to the thickness of an n-quadrate; that is to say that two of them put side by side make a square of the size of the&nbsp;body.’</p>
    <p>The first numerals of equal height were cut by <a href="/node/add/wiki?edit%5Btitle%5D=Richard%20Austin" title="Create node &quot;Richard Austin&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Richard Austin</a> for the founder <a href="/node/add/wiki?edit%5Btitle%5D=John%20Bell" title="Create node &quot;John Bell&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">John Bell</a> in 1788. It was the zero that suffered most from this treatment, since it was both squeezed into a far too narrow horizontal space and stretched to capital height at the same&nbsp;time.</p>
    <p><strong>Discussion:</strong><br><a href="http://typophile.com/node/20616">“0”</a><br><a href="http://typophile.com/node/28717">To “oh” or Not to “oh”?</a><br><a href="http://typophile.com/node/29580">Lack of Small-Cap Height Lining&nbsp;Numerals</a></p>
    <p><strong>Additional Articles:</strong><br><a href="http://www.creativepro.com/story/feature/23422.html">dot-font: Numbers Don’t Lie</a><br><a href="http://www.fontshop.com/fontfeed/archives/figuring-it-out-osf-lf-and-tf-explained/">FontFeed: Figuring It Out: <span class="caps">OSF</span>, <span class="caps">LF</span>, and <span class="caps">TF</span>&nbsp;Explained</a></p>
