    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a> : Figures</strong></p>
    <p>Arabic numeral glyphs. Often characterized as <a href="/wiki/text%20figures" class="freelinking" rel="nofollow">oldstyle</a>, <a href="/wiki/lining%20figures" class="freelinking" rel="nofollow">lining</a> and <a href="/wiki/tabular%20figures" class="freelinking" rel="nofollow">tabular</a>.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Codex_Vigilanus_4373.jpg"></div><p></p>
    <p><em>The first appearance of any numerals in a manuscript in Europe:<br>
    Codex Vigilanus, written by a Spanish monk in the year 978</em></p>
    <p>The first printed books did not make use of <a href="/wiki/Arabic%20numerals" class="freelinking" rel="nofollow">Arabic numerals</a> at all. None of <a href="/wiki/Gutenberg" class="freelinking" rel="nofollow">Gutenberg</a>’s printings contain any Arabic numerals. <a href="/wiki/Ratdolt" class="freelinking" rel="nofollow">Ratdolt</a> was one of the first to use printed Arabic numerals in his books – many of which were about mathematics and astronomy. His numerals left behind any traces of medieval forms and are immediately familiar to the modern eye. The zero is a perfect circle. <a href="/wiki/Aldus%20Manutius" class="freelinking" rel="nofollow">Aldus</a>’s zero was a perfect circle, as well as the zeros in <a href="/wiki/Claude%20Garamond" class="freelinking" rel="nofollow">Garamond</a>’s typefaces.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Ratdold_4978.jpg"></div><p></p>
    <p><em>Numerals with perfect circle zero by Erhard Ratdolt, 1482.</em></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Aldus_Griffo_4507.jpg"></div><p></p>
    <p><em>Numerals with perfect circle zero by Aldus / Griffo, 1502.</em></p>
    <p><a href="/wiki/Francois%20Guyot" class="freelinking" rel="nofollow">Francois Guyot</a> was one of the first type designer (or was he the first at all?) to cut both a roman and an italic related to each other, evidently with the idea that both may be used together. He used exactly the same numerals for both the roman and the italic typeface (as one can see in the Folger type specimen of c. 1565). His zero is a perfect circle. (BTW, perfect circle actually means perfect circle - the counter in one of Granjon’s typefaces was drilled, as one can see in Fred Smeijers: ‘Counterpunch’, p 158.)</p>
    <p><a href="/wiki/Ameet%20Tavernier" class="freelinking" rel="nofollow">Ameet Tavernier</a> was the first punchcutter who designed inclined numerals for an italic typeface, but he did not dare to touch the perfect circle shape of the zero, so the zero is upright and not inclined.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Tavernier_5876.jpg"></div><p></p>
    <p><em>Numerals for an italic by Ameet Tavernier, 1554<br>
    The numerals are inclined, except perfect circle zero.</em></p>
    <p>Approximately at the same time, <a href="/wiki/Robert%20Granjon" class="freelinking" rel="nofollow">Robert Granjon</a> cut his first italic with inclined numerals, but he also slanted the zero, which therefore turned into an oval. It is very interesting to observe that Granjon, even if he abandoned the shape of the perfect circle, retained the other characteristic feature of the zero, its monolinear stroke thickness. He must have found it important to still keep the shape of the zero different, while trying to bring the design of the numerals closer to the design of the italic.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Granjon_5345.jpg"></div><p></p>
    <p><em>Numerals for an italic by Robert Granjon, c. 1554<br>
    The zero is also inclined, but still monolinear (without modulation in stroke thickness)</em></p>
    <p>The introduction of numerals of equal width (one of the two features commonly attributed to the so-called ‘tabular figures’ as opposed to the so-called ‘old-style figures’) preceded the new design of numerals of uniform height. Already in 1764, <a href="/wiki/Pierre-Simon%20Fournier%20le%20jeune" class="freelinking" rel="nofollow">Pierre-Simon Fournier le jeune</a> wrote in his Manuel typographique about numerals of equal width:</p>
    <p>‘The figures of the roman have no respective sets, but one uniform one. They are all cast to the thickness of an n-quadrate; that is to say that two of them put side by side make a square of the size of the body.’</p>
    <p>The first numerals of equal height were cut by <a href="/wiki/Richard%20Austin" class="freelinking" rel="nofollow">Richard Austin</a> for the founder <a href="/wiki/John%20Bell" class="freelinking" rel="nofollow">John Bell</a> in 1788. It was the zero that suffered most from this treatment, since it was both squeezed into a far too narrow horizontal space and stretched to capital height at the same time.</p>
    <p><strong>Discussion:</strong><br>
    <a href="http://typophile.com/node/20616" rel="nofollow">"0"</a><br>
    <a href="http://typophile.com/node/28717" rel="nofollow">To "oh" or Not to "oh"?</a><br>
    <a href="http://typophile.com/node/29580" rel="nofollow">Lack of Small-Cap Height Lining Numerals</a></p>
