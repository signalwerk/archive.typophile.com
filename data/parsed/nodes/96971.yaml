      <p>Quadibloc</p>
      <p>Thanks for your reply. I certainly agree with you, specially because of this paragraph, on pages 44/45 of <a class="freelinking external" href="http://www.unicode.org/versions/Unicode6.0.0/ch02.pdf" rel="nofollow">Chapter 2 General Structure of the Unicode document</a> :</p>
      <p>"<cite>Such override behavior is associated with specific scripts or alphabets. For example, when used with the Greek script, the “breathing marks” U+0313  combining comma above (psili) and U+0314 combining reversed comma above (dasia) require that, when used together with a following acute or grave accent, they be rendered side-by-side rather than the accent marks being stacked above the breathing marks. The order of codes here is base character code + breathing mark code + accent mark code. This example demonstrates the script-dependent or writing-system-dependent nature of rendering combining diacritical marks.</cite>".</p>
      <p>But I believe that this does not necessarily imply the displacements shown on the picture above, or at least, there must be some explanation justifying those displacements.</p>
