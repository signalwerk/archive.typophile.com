    html: |-
      <p>When you enter lowercase alpha + combining acute, the Microsoft layout engine is automatically mapping this sequence to the precomposed alphatonos character (U+03AC). This is typical behaviour for any Unicode diacritics with canonical decompositions, since it is faster to display the precomposed characters than to go via GSUB or GPOS.</p>
      <p>What your illustration indicates to me is that something in the Arial glyph lookups subsequently breaks this precomposed display contextually when followed by a second combining mark. This would be the case if the intention was to avoid having to define GPOS mark-to-base attachment lookups for every precomposed diacritic, and is something that I have done in Cambria and Brill (but which turns out to cause a problem with a bug in InDesign, acknowledged by Adobe but not yet fixed). I presume whomever did the Arial OTL work for Microsoft used a similar technique. What happens in such a situation is that mark-to-base positioning of the first combining mark to the letter is applied, and then mark-to-mark for each subsequent combining mark.</p>
      <p>In your illustration, I reckon what is happening is that the font does not contain correct mark-to-base positioning for the combining acute relative to the alpha, and hence when the precomposed diacritic first displayed is decomposed, that mark ends up in the wrong place. The subsequent marks are positioned relative to the acute correctly, but the whole stack is in the wrong place relative to the letter.</p>
