      <p>I would explain the first new image in the same way as before: it looks like the alphas with individual marks are being rendered using precomposed alphavaria and alphabreve characters from the polytonic set, but that this is somehow being inhibited by the addition of a second mark.</p>
      <p>Without analysing the lookup structures in detail, I can't say exactly what is going on.</p>
