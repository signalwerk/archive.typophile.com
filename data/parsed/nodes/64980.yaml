    <p>Hi. I just joined this website because it seemed full of people who knew what they were talking about!<br>
    I have flawlessly used InDesign ME with languages such as Arabic, Urdu, Farsi etc however recently I tried installing something that boasted of providing better compatibiliy for Arabic and this little plug-in is now messing up my Urdu files! I tried un-installing deleting all the Urdu fonts and then re-installing them but no luck. Seems like that plug-in has really invaded the system somehow. Any ideas? I have a screenshot here with the correct text (in Arial) on the left and then in the Urdu Nafees font on the right (which used to work fine before but now is all jumbled with the dots etc in completely wrong places!) </p><div class="imageWrap"><img src="http://typophile.com/files/screen_4616.JPG"></div><p></p>
    <p>Using Arial is okay for some projects but Arial isn't supporting some Urdu characters like the "do chashmi hai" properly </p><div class="imageWrap"><img src="http://typophile.com/files/screen2_6716.JPG"></div><p></p>
    <p>P.S: It's only with InDesign CS3/CS4 ME that I'm facing the problem in. Illustrator is fine, so is MS Word.</p>
    <p>Thanks in advance for any help you can offer!</p>
