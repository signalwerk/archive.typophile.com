    <p>Greater Albion Typefounders has just released Pittsburgh via <a class="freelinking external" href="http://new.myfonts.com/fonts/gatf/pittsburgh/ " rel="nofollow"> Myfonts</a> and <a class="freelinking external" href="http://www.fontspring.com/fonts/gatf/pittsburgh " rel="nofollow"> Fontspring</a>.</p>
    <p>Pittsburgh is the latest (as at August 2011) in a range of inter-war American inspired commercial faces, and takes its place alongside the popular Bettendorff and the Spargo family.  These shaded stab-serif capitals speak of the heyday of heavy manufacture and engineering and bring a gritty feel of the 20s and 30s to any project. Why not indulge in a little heavy engineering today?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Pittsburgh_3474.png"></div><p></p>
