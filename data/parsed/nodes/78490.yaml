    html: "<p>A few years after using this font and illustrating my physics papers, I realized that the arrows showing rotation inside the spheres where pointing in the wrong direction!! If the + sign is regarded as 'up' the nodes should be rotating anti-clockwise, following the so-called right hand rule: if the thumb points in the direction of the current the magnetic field turns in the direction the other four finger are pointing to.  I had to revise all the glyphs of the font as in the attached image, and used it to redo the <a href=\"/wiki/www.ne.jp/asahi/tamari/vladimir/beautiful_univ_rev_oct_2011.pdf\" class=\"freelinking\" rel=\"nofollow\"> Beautiful Universe Theory</a> paper with new illustrations.</p><div class=\"imageWrap\"><img src=\"http://typophile.com/files/bu_font_corrected_3581.jpg\"></div>.<p></p>"
