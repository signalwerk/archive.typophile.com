    html: <p>Best to avoid ambiguous language like “here” and “here” in hyperlinks. They provide no information as to where they will take the user, and create barriers for visually impaired readers using text to speech software. When creating a link that initiates the download of a PDF, it is best to state so in the language of the link and indicate the file size so users know what to expect.</p>
