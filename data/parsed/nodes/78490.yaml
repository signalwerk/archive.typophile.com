    <p>The attached sampler is not for Latin, or any other language, except that of Nature.<br>
    I designed it to illustrate my physics theory. Recently it was used it to good advantage to illustrate my essay "Is Reality Digital Or Analog? Physics Is Undecided - A Beautiful Universe Theory Answers" for a contest. Please feel free to download the pdf, rate and give your opinions about it on the contest website <a href="http://fqxi.org/community/forum/topic/836" title="Click to visit an external URL." class="freelink freelink-external freelink-external">here</a>.<br>
    Below is a typical illustration from the paper.<br>
    The full original 2005 paper "Beautiful Universe" can be downloaded from<br><a href="http://vixra.org/abs/1012.0017" title="Click to visit an external URL." class="freelink freelink-external freelink-external">here</a>; the first sections of both papers are not too technical and can be understood by the layperson. The rest I myself just barely understand!</p>
    <p><img src="/sites/default/files/old-images/FIG-5_6286.jpg"></p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/Beautiful%20Universe%20sampler.jpg" width="2937" height="2573" alt="">
