    <p>The attached sampler is not for Latin, or any other language, except that of Nature.<br>
    I designed it to illustrate my physics theory. Recently it was used it to good advantage to illustrate my essay "Is Reality Digital Or Analog? Physics Is Undecided - A Beautiful Universe Theory Answers" for a contest. Please feel free to download the pdf, rate and give your opinions about it on the contest website <a class="freelinking external" href="http://fqxi.org/community/forum/topic/836" rel="nofollow">here</a>.<br>
    Below is a typical illustration from the paper.<br>
    The full original 2005 paper "Beautiful Universe" can be downloaded from<br>
    <a class="freelinking external" href="http://vixra.org/abs/1012.0017" rel="nofollow">here</a>; the first sections of both papers are not too technical and can be understood by the layperson. The rest I myself just barely understand!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/FIG-5_6286.jpg"></div><p></p>
