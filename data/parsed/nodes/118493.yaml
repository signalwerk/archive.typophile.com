    html: <p>This link to the <a href="http://tex.stackexchange.com/questions/107877/why-did-the-gyre-project-fork-the-urw-fonts-rather-than-just-extending-them" rel="nofollow">TeX StackExchange</a> discusses how URW Gothic L, a clone of ITC Avant Garde Gothic, came to be TeX Gyre Adventor. According to <a href="http://typophile.com/node/55825" title="http://typophile.com/node/55825">http://typophile.com/node/55825</a>  Avant Garde was one of those <a href="http://www.ep.ph.bham.ac.uk/general/printing/psfonts.html" rel="nofollow">35 fonts built into (the first?) Postscript printers</a>. I presume those are the 35 fonts released by URW and mentioned in <a href="http://www.gust.org.pl/projects/e-foundry/tex-gyre/adventor/qag-hist.txt/view" title="http://www.gust.org.pl/projects/e-foundry/tex-gyre/adventor/qag-hist.txt/view">http://www.gust.org.pl/projects/e-foundry/tex-gyre/adventor/qag-hist.txt...</a>.</p>
    html_clean: <p>This link to the <a href="http://tex.stackexchange.com/questions/107877/why-did-the-gyre-project-fork-the-urw-fonts-rather-than-just-extending-them" rel="nofollow" class="link-external">TeX StackExchange</a> discusses how URW Gothic L, a clone of ITC Avant Garde Gothic, came to be TeX Gyre Adventor. According to <a href="/node/55825/" title="http://typophile.com/node/55825" class="link-kept">http://typophile.com/node/55825</a>  Avant Garde was one of those <a href="http://www.ep.ph.bham.ac.uk/general/printing/psfonts.html" rel="nofollow" class="link-external">35 fonts built into (the first?) Postscript printers</a>. I presume those are the 35 fonts released by URW and mentioned in <a href="http://www.gust.org.pl/projects/e-foundry/tex-gyre/adventor/qag-hist.txt/view" title="http://www.gust.org.pl/projects/e-foundry/tex-gyre/adventor/qag-hist.txt/view" class="link-external">http://www.gust.org.pl/projects/e-foundry/tex-gyre/adventor/qag-hist.txt...</a>.</p>
