    html: <p>This link to the <a href="http://tex.stackexchange.com/questions/107877/why-did-the-gyre-project-fork-the-urw-fonts-rather-than-just-extending-them">TeX StackExchange</a> discusses how URW Gothic L, a clone of ITC Avant Garde Gothic, came to be TeX Gyre Adventor. According to <a href="http://typophile.com/node/55825">http://typophile.com/node/55825</a>  Avant Garde was one of those <a href="http://www.ep.ph.bham.ac.uk/general/printing/psfonts.html">35 fonts built into (the first?) Postscript printers</a>. I presume those are the 35 fonts released by URW and mentioned in <a href="http://www.gust.org.pl/projects/e-foundry/tex-gyre/adventor/qag-hist.txt/view">http://www.gust.org.pl/projects/e-foundry/tex-gyre/adventor/qag-hist.txt...</a>.</p>
