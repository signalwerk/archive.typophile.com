  html: <p>What is your opinion on this font? I saw it for the first time on the website of a Californian architecture practice. It looks like a combination of Futura and Century Gothic to me. I was surprised it is available for free. Or would it be considered as lacking authenticity, being an interpretation of the "real" fonts?</p>
