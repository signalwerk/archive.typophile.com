      <p>Hi Hector &amp; welcome to Typophile. According to <a class="freelinking external" href="http://www.fontshop.com/education/pdf/typographers_glossary.pdf" rel="nofollow">The Typographer’s Glossary</a> 'OpenType Pro fonts share the same technical specifications as OpenType Standard (Std, or simply OT) fonts, but support a broader range of languages. Standard OT fonts contain support for Western languages, while Pro fonts include Central European and often Latin Extended, and often Greek and/or Cyrillic and Extended Cyrillic.'</p>
      <p>SB</p>
