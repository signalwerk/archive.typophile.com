    <p>There is a NAB ( <a href="http://nab.com.au/" title="http://nab.com.au/">http://nab.com.au/</a> ) near my work and i love seeing the fonts they use. </p>
    <p>i've been trying to figure it out for a while and wondered if the sans was Apex, but it appears not to be.</p>
    <p>i have no idea what the other main one is.</p>
    <p>Sans:http://nab.com.au/wps/wcm/connect/nab/nab/home/personal_finance/21/320/nab+choice+package+-+because+saving+on+your+home+loan+matters?WT.seg_1=TAB&amp;WT.seg_2=TAB-N&amp;WT.ac=TAB-N</p>
    <p>Other: <a href="https://www.nab.com.au/wps/wcm/connect/nab/nab/home/personal_finance/2/20/8?campaignID=SVV&amp;WT.seg_1=SVV&amp;WT.seg_2=SVV-N&amp;WT.ac=SVV-N" title="https://www.nab.com.au/wps/wcm/connect/nab/nab/home/personal_finance/2/20/8?campaignID=SVV&amp;WT.seg_1=SVV&amp;WT.seg_2=SVV-N&amp;WT.ac=SVV-N">https://www.nab.com.au/wps/wcm/connect/nab/nab/home/personal_finance/2/2...</a></p>
    <p>i really, really, really, like the sans.</p>
