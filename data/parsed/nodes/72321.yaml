      <p>I hate to follow a squirrel dropping, but...</p>
      <p>sii&gt;Commercial desktop fonts are not set to installable embedding...</p>
      <p>first off, for a recent client, we originally sent TT/OTF fonts set to Editable Embedding. They were unable to embed the fonts using MSOffice 2003. We tested the fonts locally using WindowsXP and Word 2007 and had the same result. </p>
      <p>We rebuild the fonts as: TT/OTF with Installable Embedding. Our tests showed the fonts then embedding using WindowsXP and Word 2007. The client also embedded the fonts successfully with Word 2003, 2007 and 2010.</p>
      <p>So on one hand you are saying that we don't set the bit this way for print clients, but on the other, if clients are to use fonts with the embedding bits as intended, we have to set for both print and web the same. I think that's a no-go part as they say in the airline industry. </p>
      <p>In Mexico, I asked you what to call the introduction of a web font to the system so that it could be used for the display of web sites, but not appear in menus or the fonts folder, and you wanted to call it "enumerated to the system." So, what are we to call fonts with bits set to install, that enumerate but don't install? ;)</p>
      <p>sii&gt; Still interested in type designers and font vendors feelings about this.</p>
      <p>I guess my meelings are fixed. </p>
      <p>Cheers!</p>
