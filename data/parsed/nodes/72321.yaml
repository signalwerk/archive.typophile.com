      <p>&gt;Are not some or all of the fonts you’all bundle set for installing so they work with Word?</p>
      <p>No. Historically there were four settings, no embedding, print and preview, editable and installable. Originally Word supported the installable setting as spec’d, and would permanently install (enumerate) embedded fonts set to installable in the system. Although such fonts were relatively uncommon this did cause some user confusion and support issues “how did font ‘x’ get on my system?”. With the Internet and the increased attack vectors and the possibilities of mischief we decided that support for installable embedding was probably a bad idea, and at that point Word started treating “installable” fonts as “editable”, at that point we also set the handful of “installable” fonts we were shipping to “editable”.  In general we try to only ship fonts set to “editable.”</p>
      <p>Earlier in this thread you mentioned having to set fonts to “installable” to solve customer issues. That’s not something I’d encountered before. Happy to investigate that at our end if you can provide a repro case.</p>
    html_clean: |-
