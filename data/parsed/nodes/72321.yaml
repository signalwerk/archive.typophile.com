    html: |-
      <p>@sii and everybody:</p>
      <p>If this decision stands, I am concerned about the technical repercussions.<br>
      IE9 can't know if a TTF or CFF font is "unsuitable by reason of installability" as a web font until it downloads it and inspects. This takes time - at least until the font is cached.<br>
      At that point, if the font is deemed installable, I believe the plan is for IE9 to do a lookback to see if any other resource in *any other* @font-face font stack within the rule might be suitable. (Still more time taken.)</p>
      <p>Frankly, I'm having trouble wrapping my mind around exactly what this means without testing and I find the IE9 preview unwieldy for testing. (When my consulting partner in New York passed away a couple of years ago, my Technet subscription and some other Microsoft affiliations fell through the cracks - so I don't have a build to play with, if there is one available.)<br>
      So I'll revisit when I have more hands-on and hopefully by then some other Typophile members might have had a chance to assess. It's vacation time.</p>
      <p>Lastly, from the department of "Please Don't Pee On My Leg And tell Me It's Raining", I have found the IE Blog posts about this to be a tad on the spinful side. The "must not be set to installable" aspect of the TTF/OTF support is being deliberately played down - let us not talk falsely.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ie9woffannounce_3701.png"></div><p></p>
      <p>Along with JH, I eagerly await further explanation. (Although I think I could write it myself - perhaps I should and see how it compares.)</p>
      <p>rich</p>
