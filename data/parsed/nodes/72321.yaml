      <p>David: <em>...those browsers will maintain backward compatibility forever.</em></p>
      <p>So? They'll presumably continue to support SVG fonts forever too. That doesn't make SVG a necessary format for any font foundry to license for.</p>
      <p>Browser makers want a single, cross-browser compatible web font format. Web authors want a single, cross-browser compatible web font format. Font vendors want a single, cross-browser compatible web font format. And all three groups have very clearly identified WOFF as the only format on which they can all very readily agree.</p>
      <p>Today, the W3C approved transition of the WOFF File Format 1.0 from a working draft to a public review stage. </p>
      <p><em>What's the plan? How do we get to an all and only WOFF future?</em></p>
      <p>By only licensing fonts for web use in WOFF format.</p>
      <p>Given the way browsers are now upgraded, I'd say that within a year more than half of users will be working with WOFF-enabled browsers, and the majority of the rest will still be working with browsers that only support EOT. The number working with browsers that only support raw font linking is going to be very small. EOT is going to be a much bigger albatross around the neck of web authors and font vendors for very much longer.</p>
