      <p>@sii,</p>
      <p>&gt;Have web designers got the message about font licensing?</p>
      <p>And what might that "message" be, pray tell?</p>
      <p>Here's my challenge to you Sii: write up a one, two, hey - even three paragraph guide called, "Font Licensing: What Web Authors Should Know" and publish it. Tell me simply, briefly, succinctly, and accurately exactly how web authors should go about making decisions regarding font licensing. Go ahead, I double dare ya.</p>
      <p>The fact is - in the absence of a universal standaradized font license - you can't do it. Nobody can. Not you, not your lawyers. Plus you wouldn't do it anyway because such a thing would need to draw a "bright line" - and FUD (fear, uncertainty, and doubt) works much more to your advantage.</p>
      <p>The best I can do is parrot Hillel:<br>
      "Do not do unto others as you would not have them do unto you."<br>
      Howzat sound for a rule of thumb?</p>
      <p>I fear, frankly, that IE9's enforcement of the bits is born of nothing more than petulance - a wag of the finger. If MSFT is collectively pissed that, with regards to EOT and web fonts, it got the rug pulled out from under them, I can understand that. But I hope everybody isn't being made to pay for MSFT's frustrations.<br>
      You win some, you lose some.<br>
      Arguing "consistency" - which what the argument is going to be, right? - is, in this instance, baloney.</p>
      <p>Here's what I've decided to do:<br>
      Once IE9 goes into public Beta and the practical implications of handling raw fonts this way - on web authors, font producers, whoever - becomes more clear, I will be using EOTFAST's mailing list - for the first time - to hang a lantern on this and get a reaction. The list is pretty large at this point and includes a lot of font savvy people who actually know what embedding bits are.</p>
      <p>This will be done transparently so everybody can be kept in the loop.<br>
      And the results will be published.</p>
      <p>On the subject of data - I have no doubt that the IE team has compiled much data to support this decision. The problem is that data from a world in which there is no ubiquitous @font-face support and every other browser ignores the bits, means zilch.</p>
      <p>@bill davis</p>
      <p>&gt;web fonts licenses</p>
      <p>Ascender is <em>not</em> offering "web fonts licenses" but you keep saying it does.<br>
      I know they pay you to do that but still.<br>
      You may feel it's harmless sales puffery - putting your best foot forward.<br>
      I call it Orwellian Newspeak. A subscription to a FHOS service is not a "web fonts license" by any web author's - or anybody's - ordinary understanding of the term.</p>
      <p>Bill, the terms and conditions under which Ascender decides to offer fonts is Ascender's decision. My objecting to it or not objecting to it rests on practical considerations from the web user's and web author's point of view.<br>
      But call it what it is, please.<br>
      (Or are we going to have to have yet another <a href="http://readableweb.com/fontconf-in-minneapolisst-paul/#smackdown" rel="nofollow">smack-down</a> to settle this once and for all?)</p>
      <p>Later, I gotta go aggravate other people now.</p>
