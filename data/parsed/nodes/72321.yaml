      <p>WRT the IE team (like all the browser makers) just supporting raw fonts over the objections of font designers, and letting the market sort things out would have been the path of least resistance. The fact that Mozilla and IE did take on board the views of type designers and submitted WOFF for standardization speaks to them doing the right thing. </p>
