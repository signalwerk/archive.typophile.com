    html: |-
      <p>IE definitely should not drop this restriction, Si.</p>
      <p>The reasons why WOFF exists and is being defined as a Web standard remain as valid now as they were a year ago when we started down that path. We've come a long way -- signalled not least by both Microsoft and Opera co-submitting the WOFF spec to the W3C along with Mozilla --, and that's because the concerns about casual misuse of TTF/OTF fonts in a Web-distributed environment are reasonable and need to be addressed. There's a lot of consensus now between font makers and browser makers regarding WOFF, including things like same origin restriction that I thought might be more contentious than it was.</p>
      <p>My preference, as you know, is for IE9 to completely remove support for raw TTF/OTF before release. I don't see any good argument for a browser that supports WOFF to support raw fonts. The idea that this benefits free and open source font makers/users isn't very convincing, because any free or open source font can be freely and openly packaged as a WOFF file and gains compression in the process. Simply put, WOFF is a better technical format for web typography than raw fonts. Further, as I argued on the W3C font list last year, the onus is on protecting that which is most at risk, not on protecting that which does not require protection. Commercial fonts need protection from casual unlicensed use; free fonts do not need protection from technically beneficient formats into which they may be freely packaged.</p>
      <p>I accept your arguments, Si, for why the embedding bit is implemented and how it protects the majority of fonts against unlicensed Web use with IE. But I still don't see any good grounds for supporting the raw fonts in the first place, and while the restriction will ‘reduce foundries policing and legal costs’ relative to open raw font linking, it will increase them relative to not supporting raw fonts at all.</p>
      <p>As for checking off another random feature in the Acid 3 test... I call bullshіt on a nominal Web standards test that demands support for something that isn't a Web standard. And I think Microsoft should call bullshіt on it too.</p>
      <p>I look forward to future IE blog posts further explaining the thinking behind the raw fonts support. But I'm not expecting to have my opinion reformed.</p>
