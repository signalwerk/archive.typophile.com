      <p>As Si has pointed out, Ascender is actively offering web fonts licenses for many of the fonts featured in Microsoft Windows and Microsoft Office. Our <strong><a class="freelinking external" href="http://www.fontslive.com/" rel="nofollow">FontsLive.com</a></strong> web font service does indeed support WOFF. FontsLive also dynamically supports the other formats required to serve web fonts to the various web browsers.</p>
      <p>I firmly agree that WOFF is the future for web fonts and we should focus on that. </p>
      <p>Installable Embedding is a reasonable compromise, so it is better than nothing for a raw font. Yes, we too would have preferred that IE9 not support raw fonts, but we understand their reasons. </p>
      <p>Maybe we should instead focus on writing emails to the Acid3 folks to get them to add support for WOFF to their tests, so then IE9 could drop raw fonts! Rich - do you know who we should contact to start up a campaign to get WOFF support added to the Acid3 tests?</p>
