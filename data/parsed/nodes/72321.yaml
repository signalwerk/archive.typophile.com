      <p>In this view, IE doesn't need to keep pace with a non-standard font-format approach because you're ahead of two of the four other browsers in the standard approach. Why waste time and coding on supporting something that is unnecessary, doesn't provide any benefit, isn't compatible with other browser implementations of the same format anyway, [edit: excise ‘will make IE slower than other browsers due to added processing of checking embedding bits’ -- apparently not the case according to IE programmer], and makes me grumpy?</p>
