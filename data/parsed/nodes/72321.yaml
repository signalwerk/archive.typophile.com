      <p>David, sorry for confusing the term enumerate. </p>
      <p>&gt;But overall, it seems MS has "roto-tilled" the definitions of the embedding bits so users and developers no longer can count on the definitions matching actions of your products. Is that a fair description of the state of Microsoft's treatment of these bits found in ISO's OFF specification?</p>
      <p>No, not at all. The embedding permissions were defined with foundry input, and we’ve gone to lengths to ensure that we observe them, for example in locking documents that contain a print &amp; preview embedded  fonts. The fact that we stopped installing "installable" embedding fonts, but didn't propose changing the wording of the spec meant that we were not imposing our view on the rest of the app development community. </p>
      <p>&gt;And what might that "message" be, pray tell?</p>
