      <p>David, we've been here before. Everyone was telling me that Type 1 PS fonts were going to be the commonly supported format for so long and that OpenType was only maybe going to be the future, maybe one day, maybe just on Windows, maybe never in Quark Xpress which was, of course, going to be the most widely used page layout software forever.</p>
      <p>There is no ‘commonly supported format’ for web fonts. In terms of widely used current browsers there is a combination of EOT and TTF/OTF. Any web designer who thinks he can ‘do his job’ with TTF/OTF only isn't serving well over half his audience. So we're already in a situation of web designers having to serve multiple formats for different browsers, and that is the situation that is not going to change any time very soon. What is going to change soon -- what is already changing -- is browser makers rapidly moving to support a genuine common format in their new browsers, which is WOFF. I can say this with some certainty: EOT as a necessary compatibility evil is going to stick around a heck of a lot longer than raw font linking. From where I'm sitting, raw font linking is already an obsolete technology -- an ‘also ran’ like SVG, Flash fonts, PhotoFonts, etc. --, and IE9's embedding bit-restricted implementation does nothing to change this. Indeed, one of the things that I find weird about IE9's support for raw font linking is that it seems so 2009.</p>
