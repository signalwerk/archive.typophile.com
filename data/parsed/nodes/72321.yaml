      <p>David: <em>...they're also going to need OT because any web designer who doesn't care about all the other browsers...</em></p>
      <p>Of the two browsers in John Daggett's comparison that do not currently support WOFF, one is a co-sponsor of the WOFF format standardisation, and the other appears to be actively engaged in WOFF implementation. Also bear in mind that unlike IE, these other browsers have a proven track record of getting new versions out more often and getting users to update. Backwards compatibility with browser versions that only support raw font linking is not going to be a significant issue.</p>
      <p>There are other browsers not included in John D's comparison, of course, including any number of embedded browsers on mobile devices, but they too have a vested interest in implementing web standards and most have a push model for updates (my Palm Pre updated itself a few days ago, without me having to do anything except acknowledge that I wouldn't be able to make phonecalls while it happened).</p>
