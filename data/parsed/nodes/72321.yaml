    html: |-
      <p>When Safari added support for raw fonts over the strong objections of the web design and font community, one of the main concerns voiced was that unlicensed commercial desktop fonts would be posted to the web either in deliberate violation of the font’s EULA or in ignorance of license restrictions. Apple’s PR mentioning that “any” font could be used under their scheme fueled those concerns. </p>
      <p>As I described at ATypI last year the motivation for only supporting raw fonts set to installable embedding is to minimize the risks around posting of commercial desktop fonts. Commercial desktop fonts are not set to installable embedding, and a Web designer flipping the bits in commercial fonts would no longer be able to claim ignorance around licensing. I hope this restriction will reduce foundries policing and legal costs, and reduce associated ill-will around sending C&amp;D's to small web site owners.</p>
      <p>This solution is not perfect. I would have preferred a new opt-in, and I know most font vendors wanted IE hold-out against any support for raw fonts. However, I hope that future IE blog posts will explain the motivation here, and remove the misconception that the definitions of the embedding permissions have changed. </p>
      <p>Still interested in type designers and font vendors feelings about this. Given the publicity around font licensing, are the concerns of a few years back still valid? Have web designers got the message about font licensing? Should IE drop this restriction?</p>
