      <p>When Rich starts speculating on the psychological motivations behind things he half understands, the conversation must be close to over.</p>
      <p>David: <em>What I said is that web designers who use Photoshop e.g., CANNOT do their job without OT (Comprendo!?). But as of IE9, they can do their jobs and serve well over half the audience too.</em></p>
      <p>Well no, they can't, because the fonts that they're using in Photoshop are not licensed for Web linking. And even if they were, most of them wouldn't work as raw fonts with IE9 anyway on account of the fact that the embedding bits are most likely set to 'Print and Preview', which is the most common setting for commercially licensed fonts. So they're going to need new licenses and new fonts, regardless of what format they're serving to particular browsers. [Of course, you're going to want to do that anyway, since you want to add metadata to your web-licensed fonts.] And they're also going to need EOT because any web designer who doesn't care about IE6-8 isn't really a web designer, not matter how pretty his websites look in Safari, any more than someone who beautifully roasts a suckling pig for a large party of people whom he has been told are mostly vegetarians is a real chef.</p>
      <p>So you'll end up with multiple versions of the same TTF/OTF files kicking around on users systems and servers, with different embedding bit settings, to achieve the same thing in the same IE9 browser that you can achieve on the same day -- not in the future -- with WOFF.</p>
