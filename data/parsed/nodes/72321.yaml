    <p>A roundup of the IE9 team's thinking on fonts was posted yesterday:<br>
    <a href="http://blogs.msdn.com/b/ie/archive/2010/07/15/the-css-corner-better-web-typography-for-better-design.aspx" rel="nofollow">The CSS Corner: Better Web Typography For Better Design</a><br>
    It reports that IE9 will support "raw" fonts but only if the hidden embedding bits are set to "installable".</p>
    <p>In a comment there, I wrote:<br>
    <em>Opera, Firefox, Chrome, and Safari have no such DRM-like restriction built into their support for "raw" fonts. Why is IE breaking with the pack? What issue does support for such a hidden font de-activator address? Why not just drop support for raw fonts instead of this half-in, half-out stuff?</em></p>
    <p>Here's my question:<br>
    Do you think this is a good thing for those who ask for money for their fonts, or a bad thing? (Or conversely, do you think this is a good thing for the "free" font community, or a bad thing?)</p>
    <p>Very interested in how you see this....</p>
