    html: |-
      <p>Bundled fonts: We have boilerplate language in our product EULAs that disallows font format conversion and modification and also limits redistribution to temporary download to output devices (like laser printers) and document embedding based on the embedding permissions in each font. So based on this our product EULAs do not currently allow our fonts to be converted to WOFF for linking. </p>
      <p>Individual fonts: We typically do not license individual Microsoft owned fonts to web developers. Instead we have an agreement with Ascender Corp to license them on our behalf. Ascender is free to license our fonts in WOFF format to their customers.</p>
