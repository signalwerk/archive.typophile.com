      <p>This is all very enlightening.</p>
      <p>I have to agree with John, but with the sole caveat that alarms have been raised since the word "Napster" entered the English lexicon. Piracy is a thing of the present, past, and the future and I think that developers will be focusing on preparedness—and not—alternative directions.</p>
      <p>That said... typography isn't well understood by the public. Unless you are explicitly worried about DESIGNERS stealing fonts—and on that we can agree—I'm not so sure how many people we can expect digging through web servers to pilfer out what they most desire.</p>
      <p>(Funny story: The only person I know who ever tried to pirate a font did so after I suggested they take Pentagram's "What Type are you?" test. Touching in a perverse way.)</p>
      <p>As to db's concern: I'm no software developer but should we see no reason why a TTF/OT conversion service should not be made available? I'm fuzzy on details concerning <em>current</em> conversion services (<em>!!</em>) but if what WOFF has to offer us is compression and meta data I do not see—in theory only—how those elements cannot be tacked on retrospectively but a nicely built piece of code.</p>
