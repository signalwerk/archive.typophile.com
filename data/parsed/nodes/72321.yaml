      <p>David, I have been specific. I've pointed out the specific reasons why existing raw font linking in some browsers is irrelevant to the future of web fonts, why IE9's peculiar hobbled raw font linking doesn't change this but only confuses people, why the proven upgrade take-up of all the non-IE browsers makes raw font linking compatibility a short-term issue, why EOT fonts will be a compatibility issue for very much longer than raw font linking, why all the major browser makers have either already implemented WOFF support or are in the process of doing so, why even the browser (Opera) that first introduced raw font linking has already implemented WOFF support, and why no one other than you is still talking about raw font linking.</p>
      <p><em>Meet your latest gesticulation, IE9.</em></p>
