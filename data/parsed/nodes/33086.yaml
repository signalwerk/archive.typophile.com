      <p>The House of the Bezier Curve</p>
      <p>There is a site upon the net<br>
      They call it Typophile.<br>
      It’s been the ruin of many a poor son<br>
      And God I know I’m one. </p>
      <p>My Uncle was a printer<br>
      He taught me 'bout the type<br>
      I have loved the Baskerville<br>
      And you know that ain't no hype. </p>
      <p>Now the only thing a typehead needs<br>
      Is his FontLab and his Suite,<br>
      And the only time he’s satisfied<br>
      Is when the curves are sweet.</p>
      <p>Oh mother tell your children<br>
      Not do to what I have done.<br>
      To spend your life before the screen<br>
      Trying to make that notan hum.</p>
      <p>Well I got one hand on the trackball<br>
      and the other on the keys<br>
      and I’m going back to Typophile,<br>
      a-cryin' help me, help me please. </p>
      <p>Yes, there is a site upon the net<br>
      They call it Typophile.<br>
      It’s been the ruin of many a poor son,<br>
      And God I know I’m one.</p>
