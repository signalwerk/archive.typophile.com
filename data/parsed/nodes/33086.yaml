      <p>it might sound kind of silly, but typophile has changed my life. I had just started toying with building fonts and was wanting to do a revival of <a href="http://typophile.com/node/2733" rel="nofollow">Nymphic</a> by <a href="/wiki/Hermann%20Ihlenburg" class="freelinking" rel="nofollow">Hermann Ihlenburg</a>. I came here for help and that started my <a href="/wiki/typophilism" class="freelinking" rel="nofollow">typophilism</a>. That was Jan 2004. i'm sure my following onslaught of questions was a bit annoying, but folks like <a href="/wiki/Adam%20Twardoch" class="freelinking" rel="nofollow">Adam Twardoch</a>, <a href="/wiki/Thomas%20Phinney" class="freelinking" rel="nofollow">Thomas Phinney</a>, <a href="/wiki/Hrant%20Papazian" class="freelinking" rel="nofollow">Hrant Papazian</a>, <a href="/wiki/John%20Hudson" class="freelinking" rel="nofollow">John Hudson</a>, <a href="/wiki/Tiffany%20Wardle" class="freelinking" rel="nofollow">Miss Tiff</a> and others were always willing to answer and educate me, for which i will always be appreciative (please forgive me if i didn't list your name in this short list). By the end of the year, I had quit my job and been taken on by <a href="/wiki/P22" class="freelinking" rel="nofollow">P22</a> as an intern for 3 months (a fortunate series of events). I've been at P22 ever since. At Typecon 2005 <a href="/wiki/Jared%20Benson" class="freelinking" rel="nofollow">Jared</a> and <a href="/wiki/Joseph%20Pemberton" class="freelinking" rel="nofollow">Joe</a> invited me to be a moderator at Typophile with my charge being to look over the newly-formed <a href="/wiki/typowiki" class="freelinking" rel="nofollow">typowiki</a>. I never really thought of becoming a <a href="/wiki/type%20designer" class="freelinking" rel="nofollow">typeface designer </a>before all of this, and now i forsee type continuing to be a large part of my future (likely for the rest of my natural life). thanks to all the guys &amp; gals at <a href="/wiki/Punchcut" class="freelinking" rel="nofollow">Punchcut</a> and to all of you who contribute here, you've enriched my life in ways you may never know.</p>
      <p>p.s. and i've made some great friends along the way! who knew you could make <em>real</em> friends in a <em>virtual</em> community? y'all are the greatest!</p>
