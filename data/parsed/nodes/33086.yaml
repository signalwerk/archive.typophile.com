      <p>I suppose I heard about Typophile at typographi.ca, but I cannot recall when. I only occasionally looked at the site. In July 2005 I was at the SHARP conference in Halifax and something I saw here spurred me to write a comment. I decided to join. But I was using a really crappy computer on a really slow hotel dial-up about 3 in the morning, and I kept getting some stupid-ass message that made me believe the action was not working. Since I had to give a talk in only a few hours I slammed shut the laptop and went to sleep.</p>
      <p>The urge to say anything must have left, for I never thought again about making a comment until recently. So I tried to join up. I must have entered the same user name and password, because came back a note that led me to see I'd been a member since that night in Halifax. Who knew?</p>
      <p>Glad to be here; very worthwhile. But I have very little to say to the world these days, so I doubt I'll add very much.</p>
      <p>good night.</p>
      <p>powers</p>
