    html: |-
      <p>Somewhere around the Spring of 2004, while Googling some type related keyword, Typophile popped up as one of the hits. I don’t remember what I was looking for at the time but I became so enamored with the existence of a forum filled with type geeks that I just wandered about the place. Soon, I was hooked and signed up and got my T-shirt, screen name and an avatar—not the current one. I was particularly intrigued with the Critique Forum and was impressed with not only the work of Kris Sowersby, but the dialogue which ensued in the making of his now-released typeface. The whole experience rekindled my dormant interest in type design. I soon after began work on Leporello and posted it for critique. I am still thankful to all those who took the time to help me on my way.</p>
      <p>Thanks to Joe and Jared for the reawakening!</p>
      <p>ChrisL</p>
