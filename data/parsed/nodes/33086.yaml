      <p>As many of you know, I disappeared for a while a few years ago. Rumor was that I had checked into Typophile Rehab; but really, I just took on a very all-consuming creative director job for a couple years.</p>
      <p>Now I've been making my way back on to the forums. But I find I don't have as much to say (or prove, perhaps?) as before. Still, I'm very glad Typophile is still around and going strong. I enjoy touching in now and again and keeping up with things.</p>
      <p>Here's to many more great years of Typophile!</p>
      <p>-- K.</p>
