      <p>Of the last three you showed I like #3 the most.<br>
      Here's the thing. You've done a great job so far, so if you'd stick with v1 it would be almost ok to just use that. But it's true it needs some work done. So even though people have provided their <em>negative</em> input, I'm sure they have positive one as well. Don't get dishearted by it.</p>
      <p>But. To continue on the #3. If all the letters are connected, why are you disconnecting /p/ and /f/ then? I know it could have legibility problems, but you could try doing something in that regard.</p>
      <p>@LumaVine: although an interesting concept, it doesn't work too good because all things being equal all letters are round-shaped and this <em>step F</em> is completely square-ish. That's why it doesn't goo too well with the rest of lettering. I know it's just an idea and I'm saying it's a good one, but it needs a lot of work if it might go further...</p>
