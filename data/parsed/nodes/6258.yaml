  html: <p>Hello, <br><br>I was looking on the web to ﬁnd a version of Univers which I encountered some time ago, called ‘Univers <span class="caps">BQ</span>’. I think this was a digital version from Berthold (but now it can’t be found on their new site). It was a superior digitalisation than the Adobe/Linotype one (See also Detailtypograﬁe by Forssman <span class="amp">&amp;</span> de Jong). And it had the original &amp;-sign!  <br>I know there is something like the Neue Univers (with the new numbering system) from Linotype, but I don’t like it as much as the old one. Could this old ‘Univers <span class="caps">BQ</span>’ version be for sale somewhere? <br><img src="http://www.typophile.com/forums/messages/30/4653.gif" alt="univers"></p>
  html_clean: <p>Hello, <br><br>I was looking on the web to ﬁnd a version of Univers which I encountered some time ago, called ‘Univers <span class="caps">BQ</span>’. I think this was a digital version from Berthold (but now it can’t be found on their new site). It was a superior digitalisation than the Adobe/Linotype one (See also Detailtypograﬁe by Forssman <span class="amp">&amp;</span> de Jong). And it had the original &amp;-sign!  <br>I know there is something like the Neue Univers (with the new numbering system) from Linotype, but I don’t like it as much as the old one. Could this old ‘Univers <span class="caps">BQ</span>’ version be for sale somewhere? <br><img src="http://www.typophile.com/forums/messages/30/4653.gif" alt="univers"></p>
