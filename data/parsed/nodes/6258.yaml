    html: <p>&gt;Futura became such a successful  <br>&gt;and inﬂuential typeface exactly because  <br>&gt;it got rid of the alternative, experimental  <br>&gt;characters <br><br>I think that’s probably close to the truth — we can probably consider that the experimental characters were exactly that, rather than something to be eventually used. <br><br>I actually used one of the “g” variants in a design project, had to cut it out of black paper — no one knew the face it originated from. <br><br>Also, if you look at some of the much later Futura variant/adaptions, I think it’s clear that the experimental forms would not have been possible — even in the bold versions of The Foundry versions they look somewhat ungainly — think about an ultra-black condensed!? <br><br>I was reminded about something yesterday, about the Univers ampersand. I mailed Adobe about this a little while ago — you know of course that now the Adobe Univers is available as OpenType? Anyway, I remarked to them that a new digital Univers, without the “proper” ampersand, seemed like a missed opportunity to me — they could have had it as an alternate form. <br><br>I don’t believe it’s been&nbsp;changed.</p>
    html_clean: <p>&gt;Futura became such a successful  <br>&gt;and inﬂuential typeface exactly because  <br>&gt;it got rid of the alternative, experimental  <br>&gt;characters <br><br>I think that’s probably close to the truth — we can probably consider that the experimental characters were exactly that, rather than something to be eventually used. <br><br>I actually used one of the “g” variants in a design project, had to cut it out of black paper — no one knew the face it originated from. <br><br>Also, if you look at some of the much later Futura variant/adaptions, I think it’s clear that the experimental forms would not have been possible — even in the bold versions of The Foundry versions they look somewhat ungainly — think about an ultra-black condensed!? <br><br>I was reminded about something yesterday, about the Univers ampersand. I mailed Adobe about this a little while ago — you know of course that now the Adobe Univers is available as OpenType? Anyway, I remarked to them that a new digital Univers, without the “proper” ampersand, seemed like a missed opportunity to me — they could have had it as an alternate form. <br><br>I don’t believe it’s been&nbsp;changed.</p>
