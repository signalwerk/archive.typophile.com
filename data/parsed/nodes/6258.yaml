    html: <p>Just as uncomfortable as not being able to purchase a license to a decent digital Annonce Gothic Extended, dude! <a href="http://www.csaimages.com/dir_rf_fon.jsp"> CSA Images</a>' "Bigford" comes close, though. <br> <br>Not every typeface makes it to the screen, unfortunately. That's the harsh reality. <br> <br>And trust me, Bitstream's version is mighty fine. I've got their full type collection on CD-ROM (that was actually my very first purchase as an independent (typo)graphic designer) and I can assure you their digitizations are top notch. Just compare their Zapf Humanist or Humanist Slabserif 712 to Adobe's version of Optima (not that I would use that face in a million years) or Egyptienne F. Suddenly, you'll realize that a lot of lines were meant to be oh so slightly curved, not straight.</p>
