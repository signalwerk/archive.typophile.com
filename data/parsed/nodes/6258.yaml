    html: <p>Rodolfo, yes, I think we agree, I just didn’t understand your linking Futura to art-deco — I think you’re just meaning it’s a product of its era, and art-deco and Bauhaus are of course contemporaneus (sp?). <br><br>With Neutraface, yes, there was no lowercase (<span class="caps">AFAIK</span>), so Christian designed his own to ﬁt — I’m not sure on the origins of Neutra’s lettering, but certainly it was in use in the 1950s. However, again, I’d say that the inﬂuence was Bauhaus/Modernism rather than art-deco. <br><br>Whichever, they both originate in the 1930s. <br><br>Stephen, I don’t believe I have anything to prove — read Rudolfo’s later post. As to names — well I tried my own name, but some villain has apparently pinched it — so it was a pseudonym whatever way I did&nbsp;it.</p>
