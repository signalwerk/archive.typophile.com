    html: <p>I believe the only digital Univers with the Et ampersand are the Linotype Univers and the <span class="caps">BQ</span> Univers. I think I agree with Jean-Francois about the Linotype Univers, something not quite right about it. <br><br>As Jean-Francois also alludes, Bitstream Zurich is obviously an unauthorised clone of the original. <br><br>If you really want the “proper” ampersand I don’t really see any reason not to digitise your own, adding to the original Linotype/Adobe fonts (which are resonably good) — your original licence governs the redistribution. There are plenty of sources around for the artwork, including old Letraset catalogues (only available as rub-down lettering as far as I remember). <br><br>Tiﬀany, were you asking whether the Univers grid you referenced was an original? Hard to tell from your image, but there’s lots of reprints of it in lots of books — I think even the <span class="caps">A4</span> ﬂyer/samples were reprinted, I’ve seen them in bookshops for a couple of quid. <br><br>Hmm, Futura, it’s nice to see some of the more experimental, original forms, especially those&nbsp;“g”s.</p>
