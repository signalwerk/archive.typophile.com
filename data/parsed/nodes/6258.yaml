    html: <p>Isaac, <br><br>The alternative letters are pretty fun. Since Futura has so many round shapes, you can substitute an alternate <i>a,</i> for instance, in a word like <i>page,</i> where you would otherwise have three circles one-after-another. Having read Hrant’s pages, I would now say that this improves the Bouma. The alternative characters can break the pattern, and even substituting a single letter can radically change the look of Futura. <br><br>There were originally several other&nbsp;characters</p>
