  html: |-
    <p>Hi guys!<br>
    I'm building a website in which I decided to use Verlag for titles (they are all png images) and Mercury for texts. I thought to use web font services like <a class="freelinking external" href="http://www.typotheque.com" rel="nofollow">Typotheque</a>, <a class="freelinking external" href="http://fontdeck.com" rel="nofollow">FontDeck</a>, <a href="/wiki/https%3A/%252Ftypekit.com/fonts" class="freelinking" rel="nofollow">TypeKit</a> or <a class="freelinking external" href="http://www.google.com/webfonts" rel="nofollow">Google Web Fonts</a> (that is free!), but I found out that none of these supports Mercury.</p>
    <p>Which alternatives do you suggest? I would like a very contemporary font and I also like Mercury's geometry (for example the fact that the horizontal serifs are flat and not tapered).</p>
    <p>Thank you very much in advance.</p>
