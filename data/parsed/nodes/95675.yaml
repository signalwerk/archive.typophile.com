      <p>Since Mercury is a Fleischmann revival, you could look for other such efforts. Here's an -old- article that might be helpful (second section): <a href="http://www.typographer.org/2005_06_01_digests.html" title="http://www.typographer.org/2005_06_01_digests.html">http://www.typographer.org/2005_06_01_digests.html</a></p>
      <p>Alternatively, you could look for fonts that are "wedge serif", which turns up nice stuff like this: <a href="http://www.myfonts.com/fonts/fontfont/spinoza-pro/" title="http://www.myfonts.com/fonts/fontfont/spinoza-pro/">http://www.myfonts.com/fonts/fontfont/spinoza-pro/</a><br>
      (Noting here that FF is top-tier in terms of screen rendering.)</p>
      <p>hhp</p>
