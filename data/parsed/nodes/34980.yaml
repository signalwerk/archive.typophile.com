  html: |-
    <p>The FdA in Visual Communication is a broad course which focuses on three main areas, typography, illustration and graphic design. </p>
    <p>Students are taught to work across discipline producing a well rounded, work-ready individual. </p>
    <p>There is a real emphasis on work based learning and industry standard practice. </p>
    <p>Recent guest lectures on the course have included Catherine Griffiths and Bob Gill.</p>
