  html: |-
    <p>Hi old pals!</p>
    <p>I'm starting up work for a client who is a singing teacher and loves art nouveau. I thought, "Hey, I don't think I've ever seen an art nouveau website!"</p>
    <p>Now, the fun part... Given that art nouveau has a largely lyrical, hand-drawn, flowing aesthetic... How do I pull this off on the web? I'm not a fan of relying on imagery. I like to liken HTML+CSS to ante-linotype typesetting. You got yer box, see? and you got some stuff to break up the box, and some fonts and metal bits, and color, and texture. Make it work, pal. </p>
    <p>So, I know that there isn't going to be a typeface that completely captures this. But I have to start somewhere. My first thought is Arnold Böcklin, which is sad, I know. Maybe P22 Eaglefeather? </p>
    <p>I have a Typekit account, and am no stranger to installing my own webfonts.</p>
    <p>Also, the lettering.js plugin comes to mind.</p>
    <p>I'd also appreciate if anybody has some links to art nouveau-inspired web designs! I've exhausted my Google-fu at this point.</p>
    <p>Cheers,<br>
    Heinous</p>
