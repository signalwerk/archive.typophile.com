      <p>Sorry about not getting back to you sooner, but I've been fighting bronchitis and was pretty much bedridden all weekend.</p>
      <p>&gt;Do you know how to make the PDF open automatically when the CD is inserted in the computer?</p>
      <p>Uh oh. Fasten your seat belts, boys. I do, but only on Windows, not Mac or Linux. In fact, I’ve heard that OS X no longer supports what used to be called AutoStart on Macs. If you need to create a CD that will automatically play under both Windows and Mac, you’ll need a Mac guru.</p>
      <p>What you want is AutoPlay (WinXP and Vista) or AutoRun (Windows 95 through Win2K). However, there are so many variables and exceptions and special cases (I have 25 pages of notes on autorun) that it’s impossible to guarantee that a CD will autorun on every possible platform without getting into modifying the user’s registry or running weird scripts. I don’t think that’s ethical to do to unsuspecting users. Also, as you can see from Miss Tiffany’s posts, autorun annoys a lot of people, so WinXP and Vista allow the user to disable AutoPlay via the “take no action” option in the Autoplay dialog that pops up when you load a new type of CD or DVD. The bottom line is that your client is going to have to accept that the CD may not work 100% of the time.</p>
      <p>Since there are so many possibilities, I’m just going to outline a basic procedure that should work in most cases.</p>
      <p>1. Copy the following two lines to your favorite text editor or word processor and save the file as a plain text file named <strong>autorun.inf</strong>:</p>
      <p>[autorun]<br>
      shellexecute=yourfilename.pdf</p>
      <p>2. Burn the autorun.inf file and your PDF to the root of CD.</p>
      <p>3. Cross your fingers and test the CD on as many different machines as you can.</p>
      <p>The meaning of the lines in autorun.inf:</p>
      <p>[autorun]<br>
      This must be the first line and must have the brackets.</p>
      <p>shellexecute=yourfilename.pdf<br>
      This line tells WinMe, WinNT 5.x, Win2K, WinXP, and Vista to launch the file named <strong>yourfilename.pdf</strong>. It uses the registered file associations to figure out which application to use. Change <strong>yourfilename</strong> to the name of your PDF file. If the PDF filename has spaces in it, enclose it in double quotes, like this: <strong>“Your Clients File.pdf”</strong>.</p>
      <p>If you think your audience might be using Win95 or Win98, add the following line:</p>
      <p>open=acrord32.exe yourfilename.pdf</p>
      <p>This line tells Win95 and Win98 to launch Adobe Reader and passes Reader the filename <strong>yourfilename.pdf</strong>. Again, change <strong>yourfilename</strong> to the name of your PDF and use double quotes if needed. (Actually, shellexecute will work on Win9x systems if they have Microsoft Layer for Unicode installed. You see what I mean about too many special cases and exceptions?)</p>
      <p>So, to cover Win95 through Vista, your autorun.inf would look like this:</p>
      <p>[autorun]<br>
      shellexecute=yourfilename.pdf<br>
      open=acrord32.exe yourfilename.pdf</p>
      <p>If for some reason the PDF file must be in a subfolder, not the root of the CD, you can use relative paths on the <strong>shellexecute=</strong> and <strong>open=</strong> lines, like this (but the autorun.inf file must always be in the root):</p>
      <p>shellexecute=\mysubfolder\yourfilename.pdf<br>
      shellexecute=“\my sub folder\your file name.pdf”</p>
      <p>open=acrord32.exe \mysubfolder\yourfilename.pdf<br>
      open=acrord32.exe “\my sub folder\your file name.pdf”</p>
      <p>On the <strong>open=</strong> line, you can suppress the Reader splash screen by using the <strong>/s</strong> switch:</p>
      <p>open=acrord32.exe /s yourfilename.pdf</p>
      <p>There are two optional lines you can include in autorun.inf. They are <strong>icon=</strong> and <strong>label=</strong>.</p>
      <p>If you have a Windows icon file (.ico) that you want to display for the CD in Windows Explorer or My Computer, use this:</p>
      <p>icon=youricon.ico</p>
      <p>If you want a text label to appear for the CD in Windows Explorer or My Computer (but it probably won't work on Win95 or Win98), use this:</p>
      <p>label=Your CD name</p>
      <p><strong>Your CD name</strong> can be anything you want, and it can have spaces without needing double quotes around it.</p>
      <p>You can use <strong>icon=</strong> and <strong>label=</strong> together, individually, or not at all. Using all the commands, your autorun.inf would look like this:</p>
      <p>[autorun]<br>
      shellexecute=yourfilename.pdf<br>
      open=acrord32.exe /s yourfilename.pdf<br>
      icon=youricon.ico<br>
      label=Your CD name</p>
      <p>Good luck…</p>
