    html: |-
      <p>I knew I shouldn't have gotten out of bed while my O2 sat was low. The <strong>open=acrord32.exe</strong> line doesn't work on Win9x. What it does is try to open the Reader from the CD, but of course the executable isn't there. The good news is that the buttons in the PDF file worked in Reader version 4.1.</p>
      <p>Without the <strong>open=</strong> line, your autorun.inf would be:</p>
      <p>[autorun]<br>
      shellexecute=yourfilename.pdf</p>
      <p>or:</p>
      <p>[autorun]<br>
      shellexecute=yourfilename.pdf<br>
      icon=youricon.ico</p>
      <p>or:</p>
      <p>[autorun]<br>
      shellexecute=yourfilename.pdf<br>
      icon=youricon.ico<br>
      label=Your CD name</p>
      <p>It is possible to put the Reader on the CD, but the files you need vary depend on which version of the Reader you want to use, and I'm not sure that Adobe approves. The best way to open the PDF file in Win9x is to use a small freeware launcher program. Rather than bore everyone with the details of that, though, I'll wait and see if you post here saying you do need to cover Windows 95 and 98.</p>
