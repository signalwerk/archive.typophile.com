  html: |-
    <p>I'm designing a PDF for a photographer. The PDF opens in full-screen mode, and the user is told to scroll through it using the arrow keys. The last slide needs to have a button that allows the user to click on it and be transported to Page Layout View with bookmarks. Is it possible to make a button like that? </p>
    <p>Also, is it possible to make a button that closes the document? I'm using Acrobat 7 Professional. </p>
    <p>Thank you so much.</p>
