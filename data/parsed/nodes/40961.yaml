    html: |-
      <p>Piece of cake. The trick is that the button has to have multiple actions:</p>
      <p>1. Before adding the button, set up the PDF file to open full screen.</p>
      <p>2. After you create and format the button and have the <strong>Button Properties</strong> dialog open, click on the <strong>Actions</strong> tab.</p>
      <p>3. Under <strong>Add an Action &gt; Select Trigger</strong>, <strong>Mouse Up</strong> is generally fine. The Acrobat help file explains the other trigger options.</p>
      <p>4. Under <strong>Add an Action &gt; Select Action</strong>, choose <strong>Execute a menu item</strong>. Click the <strong>Add…</strong> button.</p>
      <p>5. Under <strong>Actions</strong>, you should now have a little tree diagram. In the tree, highlight <strong>Execute a menu item</strong> and then click <strong>Edit</strong>.</p>
      <p>6. In the <strong>Menu Item Selection</strong> dialog, select <strong>View &gt; Full Screen</strong>. (Since the document is in full screen mode, this switches it to page layout. Note that once the file is in page layout mode, clicking this button again will put in back into full screen mode). Click <strong>OK</strong>.</p>
      <p>7. Repeat steps 4 and 5 to add another <strong>Execute a menu item</strong> line to the action tree and open it for editing.</p>
      <p>8. In the <strong>Menu Item Selection</strong> dialog, select <strong>View &gt; Navigation Tabs &gt; Bookmarks</strong>. Click <strong>OK</strong>.</p>
      <p>9. If you want the user to be sent to another page, repeat steps 4 and 5. In the <strong>Menu Item Selection</strong> dialog, select <strong>View &gt; Go To</strong> and choose an option. Click <strong>OK</strong>.</p>
      <p>10. In the <strong>Button Properties</strong> dialog, click <strong>Close</strong>.</p>
      <p>11. Save the PDF file and then test it in Adobe Reader to make sure it works.</p>
      <p>You can rearrange the sequence in which the menu items are executed by moving lines up or down in the <strong>Actions</strong> tree, but different sequences may not give the same results.</p>
      <p>To create a button that closes the file, follow steps 2 through 5, and then in the <strong>Menu Item Selection</strong> dialog, select <strong>File &gt; Close</strong>.</p>
