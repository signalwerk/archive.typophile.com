      <p>&gt; OH NOES!</p>
      <p>Oh yeah!</p>
      <p>I did some digging: Adobe's 1991 outline version was lacking numerous glyphs. Later Adobe inserted bold solid glyphs instead of bold outline glyphs to complement the missing glyphs, whereas Linotype inserted outline glyphs.</p>
      <p>The entire font family "Neue Helvetica", publicized in a 1984 Linotype catalog, is now public domain. This includes the outline style too, which also appeared 25 years ago.</p>
