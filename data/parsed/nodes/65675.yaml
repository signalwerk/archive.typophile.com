      <p>Just for fun, I "created" as a "new" design the inverse ripoff font, for which the "new" font name "Hoefler-Frere-Jones" is registered at the "Ripoff Font Trademark Office".</p>
      <p><a href="http://www.sanskritweb.net/temporary/sentinel-3.jpg" title="http://www.sanskritweb.net/temporary/sentinel-3.jpg">http://www.sanskritweb.net/temporary/sentinel-3.jpg</a></p>
      <p>The blurb runs as follows:</p>
      <p><cite>"<strong>Hoefler-Frere-Jones</strong> was designed to address the many shortcomings of Typographer Mediengestaltung's <strong>Sentinel</strong>. Unbound by traditions and by technologies that limit its design, or by ornamental details that restrict its range, <strong>Hoefler-Frere-Jones</strong> is a fresh take on this useful and lovely <strong>Sentinel</strong> style. From the Antique style it borrows a program of contrasting thicks and thins, but trades that style’s frumpier mannerisms for more attractive contemporary details. Planned from the outset to flourish in small sizes as well as large, <strong>Hoefler-Frere-Jones</strong> contains features that make it a dependable choice"</cite></p>
      <p>see <a href="http://www.typography.com/fonts/font_overview.php?productLineID=100034" title="http://www.typography.com/fonts/font_overview.php?productLineID=100034">http://www.typography.com/fonts/font_overview.php?productLineID=100034</a></p>
