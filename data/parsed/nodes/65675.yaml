      <p>&gt; <cite>I advocated we should move to a unique ID system that legitimate fonts could register for... I elicited a response from Jonothan Hoefler that seemed to indicate he wasn't game.</cite></p>
      <p>The Hoefler &amp; Frere-Jones outfit made a ripoff clone of the public domain font "Clarendon" in the year 2009:</p>
      <p>see <a href="http://www.sanskritweb.net/temporary/sentinel-1.jpg" title="www.sanskritweb.net/temporary/sentinel-1.jpg">www.sanskritweb.net/temporary/sentinel-1.jpg</a></p>
      <p>This was legal, because everyone is allowed to rip off public domain fonts.</p>
      <p>But the Hoefler &amp; Frere-Jones ripoff outfit was not allowed in the year 2009 to register this "Clarendon" ripoff clone under the font name "Sentinel", because a font with the same font name "Sentinel" is in use since the year 2000/2001 and hence has name priority:</p>
      <p>see <a href="http://www.sanskritweb.net/temporary/sentinel-2.jpg" title="www.sanskritweb.net/temporary/sentinel-2.jpg">www.sanskritweb.net/temporary/sentinel-2.jpg</a></p>
