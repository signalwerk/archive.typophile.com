    html: <p>If Uli is actually correct about this it will be huge boon to the Open Source font movement (assuming they can actually find copies of the original font files). Sure they’ll have to change the trademarked names, but that never stopped anyone. Getting people to design complex families for free is pretty tough, but I doubt they’ll have a hard time getting some people to convert these to bring the old files into Fontforge, expand the character sets to cover the entire range of Latin characters, and generate new OT fonts. Once the procedure is in place a small team could just keep banging them out. It will takes years to get through them all, but it will happen.</p>
