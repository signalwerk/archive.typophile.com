    <p>The font "Helvetica Neue 75 Bold Outline" sold by Adobe is faulty.</p>
    <p>More than two dozen glyphs are NOT online, but solid black:</p>
    <p>see <a href="http://www.sanskritweb.net/temporary/Helvetica-75-outline.jpg" title="www.sanskritweb.net/temporary/Helvetica-75-outline.jpg">www.sanskritweb.net/temporary/Helvetica-75-outline.jpg</a></p>
    <p>This is highly interesting, because the seemlingly same outline font sold by Linotype does NOT have these faults.</p>
    <p>This means that (at least some of the) seemingly identical fonts sold both by Adobe and Linotype are NOT identical, so that it make a difference from where you get them.</p>
  html_clean: |-
    <p>The font "Helvetica Neue 75 Bold Outline" sold by Adobe is faulty.</p>
