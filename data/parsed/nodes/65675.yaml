    html: |-
      <p>@ Uli</p>
      <p>It is true, that fonts with the same names, that come from Adobe, Linotype, Monotype and ITC are not necessarily the same.</p>
      <p>ITC Galliard Std sold by Adobe, does not contain old style figures, superiors, inferiors and more. ITC Galliard Std sold by ITC does contain these characters.</p>
      <p>Except from that there can be big differences in the quality of the hinting, dependent from where you buy the fonts. Linotype does not care as much as Adobe about hinting. The appearance on screen can be big, dependent from where you buy the fonts.</p>
      <p>So, if you want to buy a font, that is available from two or more foundries, you have to compare them, although the fonts have exactly the same name.</p>
