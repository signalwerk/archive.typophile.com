      <p>That's similar to how it works on <a class="freelinking external" href="http://www.classicalmusicmobile.com" rel="nofollow">Classical Music Mobile</a>, a website with a banner that states, "Legal Music Only." The site offers MP3s taken from sound recordings that are out of copyright. The files are not free, but the usual price is only €1 per work, regardless of length. The following explanation appears on the website: "Internationally, sound recordings are protected for 50 years from the end of the year in which they were first released (in the USA, the legislation depends on the States). That means, any recording published or released to the public before 1959 is now out of copyright, i.e. in the public domain."</p>
