    html: <p>Try creating a text file in your text editor, saving it, and then importing it into InDesign and Illustrator. This should work in any version of InDesign; you may need Illustrator CS, as this is the only version of Illustrator that supports Unicode. <br> <br>Note that you can also use the InDesign glyph palette, accessible from the Type menu. <br> <br>By the way, if you have Romanian text, the typographically correct form for the 'cedilla' is actually a kind of small, unattached comma-like mark under the S and T. This may be encoded •••• or T with <i>cedilla</i> because this is the codepoint used in the old Romanian 8-bit codepages. In Unicode, the Romanian diacritics were disunified from the cedilla forms, and given their own codepoints. You will, of course, be limited by what your font supports.</p>
