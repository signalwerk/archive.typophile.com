  html: <p>Hi, <br><br>doing a job for a travel co oﬀering holidays to Romania. <br><br>The website is live (<a href="http://www.festivaltravel.co.uk" target="_blank">www.festivaltravel.co.uk</a>) and the logo is nailed (not here for a crit, certain many here could slaughter my feebleness!) rather I’m here for some much needed deadline slamming into me help… <br><br>I’m using Drescher Grotesk throughout but the client has asked for cedillas and accents. I can see them in the Character Palette (I’m using Panther <span class="caps">BTW</span>) and I can double-click in there to get them to appear as unicode in Tidetext/textedit but of course not in illustrator (10) or InDesign (2). <br><br>I cannot purchase the font/s as Opentype (I guess that would solve the issue?!) and here in London it’s 3.15am and I’ve lost the will to live trying to fathom this out. <br><br>Anyone able to solve this or say for certain it’s impossible? Can’t even ﬁnd how to get the accent for a la carte <span class="caps">ATM</span>. <br><br>Many thanks for any help&nbsp;oﬀered!</p>
  html_clean: <p>Hi, <br><br>doing a job for a travel co oﬀering holidays to Romania. <br><br>The website is live (<a href="http://www.festivaltravel.co.uk" target="_blank" class="link-external">www.festivaltravel.co.uk</a>) and the logo is nailed (not here for a crit, certain many here could slaughter my feebleness!) rather I’m here for some much needed deadline slamming into me help… <br><br>I’m using Drescher Grotesk throughout but the client has asked for cedillas and accents. I can see them in the Character Palette (I’m using Panther <span class="caps">BTW</span>) and I can double-click in there to get them to appear as unicode in Tidetext/textedit but of course not in illustrator (10) or InDesign (2). <br><br>I cannot purchase the font/s as Opentype (I guess that would solve the issue?!) and here in London it’s 3.15am and I’ve lost the will to live trying to fathom this out. <br><br>Anyone able to solve this or say for certain it’s impossible? Can’t even ﬁnd how to get the accent for a la carte <span class="caps">ATM</span>. <br><br>Many thanks for any help&nbsp;oﬀered!</p>
