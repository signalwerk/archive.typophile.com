    html: "<p>I don’t know if you use InDesign, Mark, but John’s suggestion to use the Glyph palette (under Type&nbsp;: Insert Glyphs) is the way to go. It shows all of the characters in a given font; double clicking on any character in the palette adds it at your insertion&nbsp;point.</p>"
