    html: <p>I could be wrong, John, but there might be a simpler solution to Marc’s dilemma. <br><br>Depending on which characters you need, you may be able to type them directly from the keyboard. The tricky part is knowing which keys or key combinations to type. <br><br>Before Panther, you could just check the Key Caps utility. In Panther, Apple kind of hid hid it. <a href="http://www.maccritic.com/tips/article/294_0_12_0_M/" target="_blank">here is a page</a> that tells how to get it out of hiding. It’s called the Keyboard Viewer now. Once you have it open on your screen, you can ﬁnd the characters you want easily by trying diﬀerent shift and option combinations. <br><br>Alternatively, there are charts showing the standard key combinations, such as <a href="http://www.idiomware.com/accents.html" target="_blank">this one</a>. <br><br>It may also be that the font you have does not have the exact accented characters you need. In that case, if you look in the Keyboard Viewer, you will see that there are also accents by themselves. These can be combined with any character using kerning to position&nbsp;them.</p>
