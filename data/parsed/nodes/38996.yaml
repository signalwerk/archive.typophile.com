  html: |-
    <p>I look through hundreds of these things in an average week, and I can’t count the number of times I end up reading something like the following, which absolutely cracks me up every single time:</p>
    <p>“Typography is a critical element of (Business X), because usually it is the very first thing our customers see about us. We are a modern, cutting edge firm fully cognizant of the crucial part a vibrant, consistent look plays on the path to success. In seeking to reflect this company’s unique, progressive philosophy, and after careful consideration, only one typeface fit our vision: Arial.”</p>
    <p>Not sure about you, but to me this is both amusing and an immediate assurance that whatever the business is, I’m not likely to be a patron.</p>
