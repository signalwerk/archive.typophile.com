  html: |-
    <p>Hi all,<br>
    Hopefully, I do not upset anyone with this question if it is off-topic or not...I'm new to fonts and unsure if this forum is focused purely on the world of print, or also includes digital fonts :-)</p>
    <p>The question - are there any available True-Type Font files that actually include glyphs for the control picture range, specifically SOH-STX-ETX... type of control codes to display when those codes are used (vs some of the standard ones I see are smiley, hearts, and upside-down 'L').</p>
    <p>A stackoverflow post referenced this document which is indeed what I'm looking for: <a href="http://www.unicode.org/charts/PDF/U2400.pdf" title="http://www.unicode.org/charts/PDF/U2400.pdf">http://www.unicode.org/charts/PDF/U2400.pdf</a></p>
    <p>you are open to flog me if I'm in the wrong area, otherwise I may need some hand-holding if I must 'craft' my own font file if none exist :-)</p>
    <p>thanks!<br>
    -Darren</p>
