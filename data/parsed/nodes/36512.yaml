    html: |-
      <p>Hyphenation and spelling for Russian is not officially supported in InDesign CS, only in CS2 and CS3. </p>
      <p>However, if you own Adobe Acrobat 6.0 or newer, you can copy all files from <code>C:\Program Files\Common Files\Adobe\Linguistics\Providers\Proximity</code> (Windows) or <code>Library/Application Support/Adobe/Linguistics/Providers/Proximity</code> (Mac OS X) into <code>C:\Program Files\Adobe\InDesign\Plug-Ins\Dictionaries\Proximity</code> (Windows) or <code>Applications/Adobe InDesign CS/Plug-ins/Dictionaries/Proximity</code> (Mac OS X). </p>
      <p>This way, you’ll be able to use spelling and hyphenation in Russian, Polish and a few other languages in InDesign CS. </p>
      <p>A.</p>
