  html: |-
    <p>Hello everybody,<br>
    how can I use hyphenation for Russian in InDesign CS 3.0?<br>
    It seems i don’t have it available form the panel.<br>
    I see in CS2 (4.0.5) that there are a lot more languages and dictionaries.</p>
    <p>Thanks in advance,</p>
    <p>Paolo</p>
