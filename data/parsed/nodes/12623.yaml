    <p><strong> <a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a> : Sidebearing </strong></p>
    <p>The space to the left and right of the left-most and right-most parts of the stroke of a glyph or piece of type, which in metal type determines and in digital type is the starting point for determining the space between that and the previous and succeeding letters.</p>
