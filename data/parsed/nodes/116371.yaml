    <p>Hello</p>
    <p>For a project I'm using Raleway through Google Fonts as a good alternative for Gotham. When I put some headers in a light weight, I get the feeling there's a bit of "warping" going on, so I guess there's no screen hinting apparent. First of all, I thought every Google font was a webfont, and thus adjusted for that particular use... but is that true? Or is it just about .woff-files that are not neccesarily hinted for screen usage?</p>
    <p>Anyhow, I altered the Raleway font through Glyphs to change the weird-looking W and w to its alternative neighbors (changing ASCII-codes and removing the standard ones). This was done with ttf-files, which I downloaded straight from the Google Fonts website. So I'm not sure whether there's a difference in the file types you download and those that are used directly via CSS.</p>
    <p>Thanks in advance!<br>
    Elpee</p>
