      <p>Hi Laurens.</p>
      <p>If you modify a TrueType font, most often the hints are lost. It sounds like that might be what happened in your case. From what I’ve read, Google Fonts usually use autohinting. It should be no problem running your font through an autohinter again after the modifications. </p>
      <p>Ol’ geezers like myself prefer manual hinting, but it takes time and cost money if you have to pay someone for that time.</p>
