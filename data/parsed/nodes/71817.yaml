    html: |-
      <p>As Frode said.</p>
      <p>You might also consider starting "1" on a recto (right hand page). It's traditional that even numbers are on the left hand page, odd numbers on the right. If the contents is on a recto (say page iii), let page iv be blank and begin your text (page 1) on the facing page. Alternatively, if you can't afford a blank, start the very first page as Arabic 1 -- no law about beginning with Roman numerals.</p>
