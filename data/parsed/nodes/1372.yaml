  - id: 11048
    user: 577
    date: 2003-09-30T13:22:00
    date_raw: 30.Sep.2003 1.22pm
    votes: null
    html: "<p>Okay... <br> <br>Here goes:  <br> <br>9.001 is the ONLY shirt I think I might actually wear, and I don't even like it that much. <br> <br>There are very few others (so far) are conceptually strong, well crafted, or relevant to typophile. Fewer still which embody all three of these necessary characteristics. <br> <br>I like 25.006, for example, I just don't think I would wear it.  <br> <br>I think 11.002 is very clever and thought provoking, but I also thought that the first time I saw it (in The Art of Looking Sideways?) so I'm not sure it's right for Typophile. <br> <br>06.003 deserves to be a shirt, just not a typophile shirt. I guess Jared et al get first dips on submitted designs, but if they don't do something with it I'll put up the money to get it produced, just to have one myself. That's an offer. <br> <br>My girlfriend likes 03.001. She also refers to you all as \"type nerds.\" I won't tell you what she calls me. <br> <br>There are a couple of others that have something going on, but again, nothing I would wear. <br> <br>Of course, my closet is categorized by color, which is to say it is a study in various shades of black. Followed by various shades of grey, just to spice it up.</p>"
    html_clean: "<p>Okay... <br> <br>Here goes:  <br> <br>9.001 is the ONLY shirt I think I might actually wear, and I don't even like it that much. <br> <br>There are very few others (so far) are conceptually strong, well crafted, or relevant to typophile. Fewer still which embody all three of these necessary characteristics. <br> <br>I like 25.006, for example, I just don't think I would wear it.  <br> <br>I think 11.002 is very clever and thought provoking, but I also thought that the first time I saw it (in The Art of Looking Sideways?) so I'm not sure it's right for Typophile. <br> <br>06.003 deserves to be a shirt, just not a typophile shirt. I guess Jared et al get first dips on submitted designs, but if they don't do something with it I'll put up the money to get it produced, just to have one myself. That's an offer. <br> <br>My girlfriend likes 03.001. She also refers to you all as \"type nerds.\" I won't tell you what she calls me. <br> <br>There are a couple of others that have something going on, but again, nothing I would wear. <br> <br>Of course, my closet is categorized by color, which is to say it is a study in various shades of black. Followed by various shades of grey, just to spice it up.</p>"
