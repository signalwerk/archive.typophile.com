    date_raw: 23.Sep.2003 3.12pm
    votes: null
    html: <p>Yves, yes of course it's premature (and since you're  <br>counting, there are now 34 yet to post). But it's all about  <br>the hype machine... We could do a totally blind contest and  <br>surprise everybody at the end with the winning shirt, but  <br>that's not very <i>Typophile</i>. <br> <br>The shirts that arrive late in the game have the advantage  <br>of coming in as a surprise - or maybe they have had more  <br>time put in on them. But perhaps the disadvantage of not  <br>getting 'shopped around' here.</p>
