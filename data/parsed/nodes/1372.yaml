    date: 2003-09-23T14:52:00
    date_raw: 23.Sep.2003 2.52pm
    votes: null
    html: <p>Isn't it a bit early for a Top 3? According to the  <br>Shoutbox there's 27 extra Tees down the line who  <br>haven't appeared here yet, and there's a whole week  <br>left for turning in submissons. <br> <br>BTW 09.001. Concept, execution, visual impact, colour  <br>scheme are all flawless. And just like last year's  <br><i>California Job Case</i> it looks incredibly cool. Which is  <br>what any self-respecting Tee needs to do. Furthermore  <br>it discouraged me from sending in a submission of my  <br>own. I feel like I simply can't beat that. <br>No numbers 2 nor 3 yet.</p>
