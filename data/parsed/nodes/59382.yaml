      <p>I prefer consistency, and I think you can make a drop cap succeed if you are very confident and positive about its qualities and virtues. Therefore, I would suggest you use a proper "titling" intitial for the big letters, not just blowing up Scala, which just looks like Scala enlarged, and somewhat klunky. Also, in deference to the scale of the large intial letter, you can make quote marks and accents much much smaller. You can make the opening quote the same size as the closing quote.<br>
      So if you put such subtle nuances into a drop cap/raised initial, then it can command a page without overpowering it, even one with very little else on it.</p>
