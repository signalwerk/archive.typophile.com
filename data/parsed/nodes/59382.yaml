      <p>In this particular case I'm with Will, but if you have the courage and skill, it really is a case-by-case issue.</p>
      <p>On of the last talks Richard Eckersley gave -- Will was there BTW -- involved a book where where the best design solution involved using essentially a different design for each page of the front matter. I think he made his case, at least for the book shown. Richard would also abandon the grid at the drop of the hat if it improved the reading of a book -- though Richard's grids were often subtly complex enough to hold even when one or two elements were absent.</p>
      <p>* * *</p>
      <p>There are ways to use a drop cap with a short first paragraph. For the new paragraph, start a new line, and indent enough to signal what's going on, all the while keeping the general wrap around the cap. But when you start to add in other complexities, as Will says, usually best to simplify.</p>
