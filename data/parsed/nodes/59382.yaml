      <p>If you've got 2-line items you probably want to forget about the drop cap. The drop cap won't look good, and that stick-up cap following the guillemet just looks silly. You have to be really careful with drop caps that have an opening quote or guillemet attached to them.</p>
      <p>Your drop cap example that starts with the word "Ko" is also a good reason to forget the drop caps. Two-letter words look really silly with the first letter as a drop cap unless the two letters are closely fitted together so they read as a single unit.</p>
      <p>&amp; small caps [sometimes full caps] are better to follow drop caps rather than lower case. There's a better color transition.</p>
      <p>When faced with these sorts of quandaries, always simplify.</p>
      <p>powers</p>
