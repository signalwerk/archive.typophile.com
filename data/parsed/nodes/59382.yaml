    <p>Trying to find the best layout for a book of very short prose made me think again of the question of typography vs. textual content. Of course the layout should be consistent and shouldn't impose itself or even work against the text, but is compositional consistency still the priority when the text itself is inconsistent in its structure? Should one in such a case just stick to basics or allow for differences?</p>
    <p>My particular problem concerns titles and possible drop caps. The text has titles, but sometimes they are also the beginning of the first sentence. In that case the first line after the title begins with a lower-case letter, so a drop cap would be impossible.</p>
    <p>Further more, two or three pieces have only two lines (as two separate paragraphs), which makes the drop cap look awkward.</p>
    <p>I've enclosed two samples: one that works for the vast majority of the texts and one for the exceptions.</p>
    <p>What are your oppinions? Would you simplify the layout or allow for such inconsistencies?</p>
    <p>Any suggestions would be much appreciated.</p>
