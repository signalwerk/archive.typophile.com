    html: <p>1- Monotype Grotesque [MT] Bold Extended -- EXCEPT it looks slightly heavier and terminals on the C are not angled as those on the JD label. HOWEVER, I noticed Monotype Grotesque [MT] Bold (not extended) has a C like the one on the label. Is the JD font an earlier version of Monotype's or is it another grotesque altogether? Why are the C's terminals differently fashioned for normal and extended?</p>
