  html: |-
    <p>I was out voted so now I am going as a dog for a Halloween costume party. I wanted to spice up the outfit a bit and make into a dirty dog. My hope is to recreate a Jack Daniel's label with a dog twist called, Jack Spaniel's. As in a springer spaniel. Instead of 80 proof, it will be 80 woof. You get the idea. The bottle will be filled with ice tea.</p>
    <p>There are what I believe to be, six different font types on this label. Any help is much appreciated.</p>
    <p>1- Every drop. . .<br>
    2- Sour Mash: Franklin Gothic<br>
    3- Whiskey<br>
    4- Jack Daniel Distillery: Clarendon Bold<br>
    5- 40% ALC BY VOL. . .<br>
    6- Here at the Jack Daniel. . .</p>
