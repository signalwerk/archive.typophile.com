    html: |-
      <p>Angled terminals like your _V_ are found in the lowercase of Jenson Oldstyle designed by J. W. Phinney of the Dickinson Type Foundry in 1893, </p><div class="imageWrap"><img src="http://typophile.com/files/JensonOSLC_5304.jpg"></div> but not in the uppercase.  Now available as LTC Jenson  <a href="http://www.myfonts.com/fonts/lanston/ltc-jenson/" title="http://www.myfonts.com/fonts/lanston/ltc-jenson/">http://www.myfonts.com/fonts/lanston/ltc-jenson/</a><br>
      The terminal style was popular circa 1900 and it was used in the uppercase of some lettering designs. Some digging might turn up a digital font with the _V_.<br>
      don<p></p>
