  html: "<p>The ATypI Vancouver team has launched the first phase of an extensive city guide for attendees at this year's conference. The site includes general information about the Vancouver area, photos, a transportation guide, and suggested activities for those who are planning a vacation around the conference or bringing their families. Information from the ATypI team is supplemented with a hand-picked selection of links. <br> <br>        <a href=\"http://www.atypi.org/40_conferences/28_Vancouver/10_venue\" target=\"_blank\">http://www.atypi.org/40_conferences/28_Vancouver/10_venue</a> <br> <br>In late-July, the guide will be updated with information about the two conference venues: the Westin Bayshore Resort &amp; Marina (where the pre-conference technology workshop, the Thursday night reception and keynote address, and the Friday morning plenary session will take place), and Emily Carr Institute of Art + Design (where the remainder of the conference will happen). <br> <br>In mid-August, the guide will be updated again, with restaurant, bar and nightclub suggestions and maps. <br> <br>John Hudson <br>ATypI 2003 programme planning committee <br><a href=\"http://www.atypi.org\" target=\"_blank\">www.atypi.org</a> </p>"
