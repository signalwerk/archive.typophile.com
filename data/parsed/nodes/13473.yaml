      <p>"Visiting London earlier this year I saw ads supporting the olympic bid all over the place..."</p>
      <p>Me too. I actually talked about this this morning. Here in New York there was a completely different vibe for the games. I couldn't walk anywhere in London without seeing tons of ads. Here in New York, you're lucky if you happen to run across a couple. </p>
      <p>I love hand done type as its one of my specialities, and I would be inclined to lean toward the Paris logo. It just to me feels a little incomplete. My vote (though it has always been unpopular in the past) is the New York logo. It has a playful vibe, which I like. Though personally speaking I'd like it more if the "1" in 2012 had a pseudo-serif on it. :)</p>
