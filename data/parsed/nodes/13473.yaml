      <p>A bid city's logo is intended to sell the city as a venue, not encapsulate the international spirit of the Olympics. London will create an official identity for the games, now that they have won, and the bid logo will go bye-bye. If you're really interested in what goes into the creation of a candidate city's logo, Brian Collins' account of the creation of the <a href="http://www.amazon.com/exec/obidos/redirect?link_code=ur2&amp;camp=1789&amp;tag=mine0b-20&amp;creative=9325&amp;path=ASIN/1581805497/qid=1120775831/sr=2-1/ref=pd_bbs_b_2_1" rel="nofollow">NYC 2012 Identity</a><img src="http://www.assoc-amazon.com/e/ir?t=mine0b-20&amp;l=ur2&amp;o=1" width="1" height="1" border="0" alt=""> can be found here.</p>
