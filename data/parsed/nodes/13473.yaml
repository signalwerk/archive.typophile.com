    <p>Today the decision will be made on city to host the 2012 Olympic games.</p>
    <p>Front runners are Paris and London.</p>
    <p>Here is a photo displaying <a href="http://news.yahoo.com/news?tmpl=story&amp;u=/050705/483/sin15307051145" target="new" rel="nofollow">proposed logos</a> from each of the candidate cities. </p>
    <p>Can we have your vote, comment or opinion on the logos proposed by Paris, NYC, Moscow, London and Madrid.</p>
    <p>Close up of <a href="http://news.yahoo.com/news?tmpl=story&amp;u=/050705/ids_photos_sp/r1075729323.jpg" target="new" rel="nofollow">Paris 2012 logo</a>.</p>
    <p>If better images are available, please post for our review.</p>
    <p>-------------------------------------<br>
    Yes, I'm old, but I'm back in style!</p>
