      <p>I would not wish the Olympic circus on any city.<br>
      Great for developers, contractors, and the building trade, of course, but the disruption and debt are horrendous for the general population.<br>
      A lot of art galleries and artist studios in London, in the East End, will have to be relocated.</p>
      <p>Hopefully, however, the London Olympics will act as an impetus to develop sports and fitness for all Brits. Kids today don't get enough exercise: driven to school, nowhere to play (habitat removal), privatization of facilities, etc.</p>
