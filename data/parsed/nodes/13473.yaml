      <p>Thank you Christopher,</p>
      <p>I'd be very interested in getting a signed copy of your book, <em>Logo Lab</em>.</p>
      <p>What little insight I had about the process of bid logos comes from limited personal experience. I watched the development of many variations of logos by different designers competing for the Barcelona 1992 Summer Olympic Games. After Jose Trias of Quod won the project, I visited him many times between 1988 and 1989 during the refinement of the complete identity campaign for Barcelona.</p>
      <p>A full campaign is a major undertaking and I respect and appreciate the designers who rise to the challenge.</p>
      <p>--------------------------------------<br>
      Yes, I'm old, but I'm back in style!</p>
