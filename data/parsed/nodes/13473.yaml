      <p>Some comments from <a href="http://38one.com/cleverblog/place-your-bid" rel="nofollow">cleverblog</a> mention that the NYC logo is "too American". In my opinion, when you visually join the split images of Statue of Liberty on left and victorious olympic athelete on right, you get an overall message of "America wins!"</p>
      <p>London's bid logo ribbon motif (in official olympic colors) seems very problematic as an emblem that has to stand up for repro on embroidered patches, tiny pins, etc. So I imagine that Andy Stanfield will continue to refine the logo before official adoption.</p>
      <p>The Paris bid logo as it stands looks colorful if anything, but weak in treatment. The brush forms are not gestured enough to portray energy or movement, and not refined enough to evoke visual harmony. As for it's message, deja vu "I (heart) NY" "I (heart) Virginia" and "I (heart) my dog!"</p>
      <p>I know it's easy to sit back and dis designs, but come on, it's the Olympics of logo design.</p>
      <p>--------------------------------------------------<br>
      Yes, I'm old, but I'm back in style!</p>
