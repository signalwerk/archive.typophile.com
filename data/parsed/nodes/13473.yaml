    html: |-
      <p>Comments by London Olympic Bid logo designer</p>
      <p>Andy Stanfield, Kino Design<br>
      <em>"It's very vibrant. We want the vibrance to inspire people, to get people really backing the Olympic bid. We passionately believe in the Olympic bid and we want other people to actually follow suit and really get behind the bid."</em></p>
      <p>Barbara Cassani, Chairman, London Olympic Bid 2012<br>
      <em>"The London symbol is the River Thames which flows through us and gives us the heart of the city, the backbone of the city. And the shape is also a ribbon, a ribbon of colours. The colours represent the diversity of the city, the people who come from everywhere, and the ribbon itself is something that's used in sport. It's a winners' tape. It's the ribbon from which those gold medals will hang for all those people from London and the UK who win the medals in 2012."</em></p>
      <p>Scripted explaination of logo at the unveiling:</p>
      <p>The new design for London Olympic bid for 2012 has been unveiled at the Tate Modern gallery in London. The ribbon-based design, which represents the shape of the River Thames, beat off stiff competition. Those behind the bid say it's symbolic of the diversity of London and the Olympic spirit. </p>
      <p>The five-colour ribbon design represents London's main waterway, which runs through the heart of the city, and the Olympics games itself. Those behind the bid say this is crucial to the bid.</p>
      <p>-----------------------------------</p>
      <p>I have always had a keen interest in the development and marketing of Olympic Games logos, emblems and identity systems. There are not many projects in design or marketing that present themselves every two years (alternating Summer and Winter Olympics) and have such a major impact globally.</p>
      <p>Here is an excellent blog on designs of 2012 candidate logos:<br>
      <a href="http://38one.com/cleverblog/place-your-bid" rel="nofollow">http://38one.com/cleverblog/place-your-bid</a></p>
