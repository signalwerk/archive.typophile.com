      <p>Sure, I know Superpolator users, and I've gone and I tracked down the Apple <a href="http://developer.apple.com/fonts/ttrefman/RM06/Chap6gvar.html" rel="nofollow">gvar table spec</a>. And this all indicates that variations, like other interpolation mechanisms, rely on designer definition of two or more weights. Unlike MM, the variations approach involves specifying point moves from a default weight, rather than creation of two end-of-axis outlines, but its still an interpolation mechanism.</p>
      <p>So variations are tangential to what I'm talking about in this thread, which is tools for creating -- or at least getting a head start on creating -- secondary weights from an individual outline, whether those secondary weights end up being defined as individual fonts, MM axis masters, or tuple variation data.</p>
