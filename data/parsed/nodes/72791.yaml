    html: |-
      <p>Mark &gt;It is possible to transform glyphs before making a weight change, and then transform them back afterwards</p>
      <p>It is, and this is often a way. The problem with all the transformations, including change weight when the point structures are not compromised, is that they don't "know" the difference between one x thing and the next, the difference between one y thing and the next, much less the connecting things between the things, (going by Stone's terminology of letter parts). </p>
      <p>I just finished 10 of these boldenings, boldening for web text boldness which is more than most. They all followed a similar pattern of; scale, (slant some), and then grab the right subset of the contour points, from a ball terminal, up to the whole x-ht, scale them tiny amounts, tweak multitudes of points 2-5 units to complete the gross coordinates, before micro-tweak for shape.</p>
      <p>We also recently did 4 other boldenings using lost-in-the-mist technology and these were different. There is a moment to select values for the axes while thinking about going to the beach, and then a moment to process while mixing ice cocoa, and then it's right to micro-tweaking shapes. Yes, you have to make the decisions up front on Ultra and Thin, (telling the software about the extreme whereabouts of all the x and y and other things), but then you can go to the beach and phone in your weights.</p>
      <p>Cheers!</p>
