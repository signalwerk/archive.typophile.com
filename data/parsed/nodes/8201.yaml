    html: <p>Noah, handwriting fonts can be a fun project to start learning about font-making but unless your handwriting is exceptional, it rarely makes an interesting font. There are already loads of fonts like this readily available, but maybe there is some demand for one with contextual alternates (but i wouldn't bank on it!) If you like this project, keep at it, but I'm not sure anyone will appreciate it quite as much as you will.</p>
