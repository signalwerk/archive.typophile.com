    html: "<p>To be able to do alternates you need to learn about OpenType. I started with <a href=\"http://www.font.to/downloads/FL46WinDoc.pdf\" target=\"_blank\"> Font Lab's User Manual</a>. <br>That may seem like a big chunk to chew on, but there's a lot of help online. Some starting points: <br><a href=\"http://www.microsoft.com/typography/default.mspx\" target=\"_blank\">http://www.microsoft.com/typography/default.mspx</a> <br><a href=\"http://studio.adobe.com/us/type/main.jsp?xhtml=opentype/main\" target=\"_blank\">http://studio.adobe.com/us/type/main.jsp?xhtml=opentype/main</a> <br>And our own \"Build\" section of these boards.</p>"
