    html: <p>We dont have a referece in a book, and we dont talk with James Montabano yet. We are building the letters on empiric tests at this first step, comparing the problems who occur in common used typefaces, here in chile we found Interstate on highways,and Frutiger on small signages and information in buses(local transportation). In the internet we look at Clearview now,and we want to start to compare some of our proposals with the Clearview typeface. <br> <br>1.- Clearview, 2.-Optica <br> <br> <br><img src="http://www.typophile.com/forums/messages/29/27369.gif" alt=""> <br> <br>Hern</p>
