    html: '<p>Very interesting the use of irregularity on a sans serif typeface to increase its legibility. I like this idea.  <br>Do you have some bibliographic reference about this topic? <br> <br>The irregularity helps to transform letter in words. Letters work better together than isolated.  <br>Maybe it is also a good idea for a sanserif typeface for text. <br> <br>Another question: which will be the colour of the letter and of the panel?  <br>I printed the pdf and looked the paper from far (I have sight handicap and I could be a good tester..). It works very well, but I fear that the eye of "e" and of "a" is a little bit small. <br>In my opinion the capital "E" is too much condensed. </p>'
