    html: <p>I just stumbled across this thread.  <br> <br>Your comparisons and samples of halation look like they are computer generated. This is of no use whatsoever. The optics of halation are quite a complex phenomenon. The only way to truely get an idea of what is going on is to make signs on the appropriate retro-reflective material and document what happens through a carefully controlled experiment. <br> <br>Different retro-reflective materials from different manufacturers (ie Diamond Grade, Prismatic) will create different halation issues. <br> <br>Another thing to keep in mind when dealing with these sorts of fonts is their acceptability to the general highway engineering community. One of the reasons Clearview looks the way it does was it was designed to solve problems of legibility and readability without scaring the very conservative highway engineers with a radical "designed" solution.</p>
