    html: |-
      <p>Personally, I am still quite skeptical about it, but we'll just have to see how it actually works when it comes out. My main problem is that it is simply aggregational rather than self-correcting. (A good example of a self-correcting system is a Wiki.) So all the crud opinions don't get overwritten. One could be hopeful that the "ignorant masses" won't put a lot of effort into adding info, but it feels basically like mob rule.</p>
      <p>The counter to this limitation is that apparently it will be possible to see only the expert ratings by the Type-Expertise team. That is bound to be an improvement in quality (if not quantity) over the ratings of the masses, but is still dependent on how good a team they put together.</p>
      <p>Short answer: we'll have to wait and see.</p>
      <p>T</p>
