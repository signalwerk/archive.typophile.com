    html: |-
      <p>Yup, I saw this earlier this year and I still reserve judgement on its practicality.</p>
      <p>The very core of this system is to sell fonts to the great "unwashed" which is obviously of great value and interest to the existing type industry (companies/individuals that create/distribute fonts for revenue).</p>
      <p>&gt; <em>The patent-pending Type-Expertise Universal Font Classification system has been conceived to meet the needs not only of font users, but also font designers and vendors who require a better way to help their customers choose and purchase fonts, as well as application and operating system developers, who have an inherent need to help their users communicate more effectively.</em></p>
      <p>&gt; <em>According to <a href="http://www.design-expertise.com/about.htm" target="new" rel="nofollow"><strong>Denis Ravizza</strong></a>, chief architect of the new classification system: “The system will fundamentally change how fonts are chosen and purchased, based on a dynamic database that is both universal and multicultural. This database will be enriched over time and through usage by the users themselves, through their knowledge, their design practices and their experience.”</em></p>
      <p>&gt; <em>A font choice made by the user is based on the emotions, the experience and the intuition of the individual. This choice is expressed in words via qualifications, designations and adjectives. These values are the heart of the classification system - the resulting database is its unique and invaluable strength. All those participants who use fonts thereby become a classification in themselves. The system thus doesn't embody a single classification, but instead potentially millions of classifications. </em></p>
      <p>In reply to a post on <a href="http://web-graphics.com/mtarchive/001241.php" target="new" rel="nofollow">WebGraphics.com</a><br>
      June 14, 2004 05:50 AM<br>
      denis ravizza Posted…</p>
      <p>"The first question that comes to mind: does this system have some way to filter for the thousands of crap fonts floating out there? And more generally, will uber-classification really help what is ultimately a subjective process? To answer your question about filtering crap fonts: This will be done in two ways. 1/ The Team Type-Expertise wich includes International Graphic designers is working on keywording, classifying fonts that are up to professional standards. The main database will only contain classifications of fonts that are fully designed with kerning tables, full characters and so forth, they will not go for classifying free fonts that do not match quality standards. Thsis classification is being done by pro type users meaning that as graphic designers we do not or rarely use crap fonts." </p>
      <p>For me (Norbert speaking here), the key questions are:<br>
      &gt; Who in the type industry will have access to the database which will obviously contain great amounts of new registered users, new "emotional" criteria for font purchases?</p>
      <p>&gt; As of yet in my research, I have found no disclosure on the funding of the Type-Expertise project nor business sponsors involved. Is Denis Ravizza undertaking this independently?</p>
