    html: |-
      <p>Sure, the classifications have some arbitrary aspects, and even the choice of system itself is at least partly arbitrary (though I think some aspects are natural, given the typefaces we're trying to classify). I'm pretty happy with most of the classification systems I've seen that were done by and for typographers, and could live with any of them. But what I want is to have *some* overarching system of classification that reflects a consistent view and theory. I guess that's why the whole Type-Expertise thing isn't automatically appealing to me.</p>
      <p>T</p>
