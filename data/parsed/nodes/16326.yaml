    date: 2005-11-18T13:56:00
    date_raw: 18 Nov 2005 — 1:56pm
    votes: null
    html: <p>I've always thought that font classification was a matter of opinion. Obviously, people have made many attempts to categorize fonts. Trying to drill down and make the process more precise strikes me as silly. I realize that some people track music by beats-per-minute or rate wine by acidity, but it's only a starting point, not a final assesment of value. My general opinion is that trying to cram fonts into more than a dozen or so categories is a waste of time. There's no reason that one person's classification system will be useful to another person, especially with all these postmodern hybrid fonts floating around. I suppose it might be interesting to see what people think on average, even if it's not particularly useful.</p>
