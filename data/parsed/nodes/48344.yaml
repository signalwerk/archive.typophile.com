  html: |-
    <p>“Down style” means to capitalize only the first word and proper nouns. Usually in titles.</p>
    <p>This is a title in down style which Microsoft Word calls “sentence case”</p>
    <p>This Is A Title In Up Style Which Microsoft Word Calls “Title Case”</p>
    <p>I refer to the latter as “up style” for lack of a better term. Does anyone know if there is a proper term for “Title Case?”</p>
