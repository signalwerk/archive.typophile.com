      <p>Hi, Chesh</p>
      <p>- It would be nice if the left large loop and the right large loop were exactly the same. They are so close that it is creating tension for me.<br>
      - I love the detail of the swash crossing into the L. Can this happen in other strategic spots?<br>
      - The spot where the tails of the RA cross needs depth. (see point 2)<br>
      - I think the UR and the RA are too loose. And the IO is too tight.<br>
      - I think the spot where the tail ends up seems anti-climatic. </p>
      <p>These are fiddly suggestions. In general I think it works.</p>
      <p>Ps. I like the wonky S, it adds character.</p>
