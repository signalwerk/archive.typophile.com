      <p>I totally agree with Miss Tiffany; As far as the mirrored loops on either side, I would definitely make sure that the pointy-ness of the right curve at the bottom is translated over to the left curve. The left one looks rounder/flatter than the right.</p>
      <p>One other note: The RL Ligature has a nice attribute: the swash "overlaps" the L and there is a gap. Could you do this elsewhere? I think Miss Tiffany suggested the RA cross, or maybe even the A's own crossbar.</p>
      <p>Nice work.</p>
