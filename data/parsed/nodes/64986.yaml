    html: |-
      <p>Yes, note how the two "N"s differ.<br>
      Nasty and inappropriate, IMO--dude is dapper, not grunge.<br>
      But I appreciate the difficulty interpreting his music visually; this is a c.1970 album which includes a "straight" live version of <em>My Favorite Things,</em> and an awesomely skronky freak-out on the title track.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/JohnColtrane_Selflessness_3432.jpg"></div><br>
      Artists dressed smartly then, to be taken seriously (eg Modern Jazz Quartet), and all those crazy Dada and Surrealist artists, you see the photos of them in their suits and ties. Conventional dress, unconventional art.<br>
      Notwithstanding this agent of change, Sun Ra:<br>
      <div class="imageWrap"><img src="http://typophile.com/files/260px-SunRa1960-WonderInn_5461.jpg"></div><p></p>
