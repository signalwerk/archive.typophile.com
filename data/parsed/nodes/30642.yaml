    html: |-
      <p>From personal experience (and lots of knowledge of Hatch; I've visited the shop, studied a bit with Jim Sherraden and read a lot about them), I can tell you that he'd be offended if he was listed as anything but a printer.</p>
      <p>Jim is certainly an artist and there are other great artists that have been associated with Hatch, but they are first and foremost job printers and they are very proud of that and have no pretensions to anything but being great poster and art PRINTERS.</p>
      <p>Aluminum - their work is 100% letterpress, yes, using mostly wood type, although I am sure they have some metal on hand as well.</p>
      <p>Joshua</p>
