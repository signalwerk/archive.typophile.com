      <p><em>“Monotype” FLOWER Decorations</em></p>
      <p>A beautiful specimen published in London, 1924.<br>
      I think it was written by Stanley Morison and designed by Frederic Warde.</p>
      <p><em>The Manual of Linotype Typography, 1923,</em> is heavy on the ornament, with the “Updikist”(?) principal of historical allusion matching ornaments to typeface.</p>
