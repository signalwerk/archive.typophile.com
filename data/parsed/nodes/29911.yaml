  html: |-
    <p>I’m looking for any and every suggestion Typophiles might have for resources on using and creating <a href="/web/20080907025945/http://www.typophile.com/wiki/typographic%252Bornaments" class="wiki-create">typographic ornaments</a>, both how-tos and examples. I mean both senses of “typographic ornamentation”:</p>
    <p> — the ornaments that come as glyphs in fonts (and so ideas on how to arrange them in layout programs like InD), and</p>
    <p> — the use of typographic glyphs (ornaments and otherwise) as ornamentation or illustration, as in for example the <a href="https://web.archive.org/web/20080907025945/http://www.typotheque.com/books/typotheque_posters">Jigsaw specimen poster</a> that Typotheque released.</p>
    <p>Again, any and every idea, personal favorites especially, would be welcome. Thanks!</p>
