      <p>BR!</p>
      <p>I don’t know of any book per se, but certainly a cruise through the work of Bruce Rogers would give you lots of inspiration. </p>
      <p>Another person who used ornaments with great skill is Fred Anthoensen, the scholarly printer who worked in Maine for most of the twentieth century. He did lots of work for the Peabody Museum of Salem, Massachusetts Historical Society, etc. Here’s just one example of his work.</p>
      <p>Bruce</p>
