      <p>Great work Renko and Skylar. That’s it all right. Thanks. I’ll pass that along to the person with the question.</p>
      <p>As for the titling face, I agree Yves, it does resemble some of Michael Harvey’s work, like <a href="http://www.myfonts.com/fonts/linotype/strayhorn-mt/">Strayhorn</a>, but I also found it has similarity to <a href="http://www.myfonts.com/fonts/linotype/agfa-rotis-semi-serif/">Rotis Semiserif</a>, but not a match. I’d like to know what it is.</p>
      <p>- Mike Yanega</p>
