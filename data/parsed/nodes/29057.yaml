  html: |-
    <p>Hi Folks, </p>
    <p>Here are two mysteries. The ‘Black Pearl’ script seems very familiar, but I was not able to find it in my Script Guide or my various books. Any ideas about what it is?</p>
    <p>The ‘PORTLAND, OR’ titling face seems similar to Waters Titling, but it’s semi-serif. Anyone know what it is?</p>
    <p>Thanks for your help,<br>
    - Mike</p>
