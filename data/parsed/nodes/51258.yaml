    html: |-
      <p>I’d use a letterspaced neutral-looking sans (i’d probably plump for Avenir), all caps, aligned with the lefthand stroke of the ’u’ and sized to let the G to nestle in the crook made by the x.</p>
      <p>At the moment ’Consulting’ is too small, and will be lost if the logo is used at small sizes</p>
