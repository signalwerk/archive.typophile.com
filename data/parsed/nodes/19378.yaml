      <p>For fear of fanning the flames...</p>
      <p>Overly restrictive EULAs help no one. PDF embedding is part of graphic design workflow and to require an additional license just in order to show the client the job is overly restrictive. So everybody loses - the foundry doesn't make the sale, the designer has to find another font.</p>
      <p>Reasonable EULAs benefit everyone. The font gets bought, the font gets used, the font gets seen, the font gets bought by someone else, the designer gets more work, you see my point.</p>
      <p>I suppose if your bread and butter comes from selling fonts for use in major identities or custom work for magazines then it really doesn't matter if a few indy designers can afford to buy your font or not... but it would be nice if there were some flexibility to the pricing structure.</p>
