      <p>My comment was more about the way "I" view font purchases. Unless I can comply with the EULA, it's not worth buying it, because by breaking the EULA I open myself up to damages in the same way as if I had simply ripped the font off period.</p>
      <p>I'll probably buy Whitney before the year is out, simply to use on some print only jobs, or converted to curves on small PDF downloads. It's just too nice not to own in some shape or form.</p>
      <p>Argh, Font Snobbery is great isn't it... Maybe one day I'll have the kinds of clients who will pay the sums that allow me to fork out for Whitney fully :-) Keep on trucking in the meantime.</p>
      <p>In closing, licensing models can make a real difference to you income... Just ask any photographer who used to sell Rights Managed images. To keep food on the table, the vast majority of stock photographer now have to sell Royalty Free. But then the photographer population is prolific, whereas good typographers are a rarer beast - and there lies the nub of this issue!</p>
