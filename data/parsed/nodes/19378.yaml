    html: <p>Some foundries really need to wake up to the reality that a basic commercial font licence needs to allow how a font is typically used in the design, printing and publishing industry---and that includes sending font files to a printer with a job, and embedding fonts in a pdf in order to show clients a document, send a job to a printer, or distribute or sell the document (whether it be an downloadable informational brochure or an ebook). Perhaps fonts will cost more with these uses explicitly allowed, but better to have the real cost up front and fully transparent without having to wade through fine print. It reminds me of the moving truck rental industry, where they advertise a great daily rental price, but when you go to pick up the truck you find you also have to pay mileage, collision damage waiver, etc., if you actually want to use the vehicle.</p>
