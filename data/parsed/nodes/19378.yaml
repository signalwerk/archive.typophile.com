      <p>Huge sigh - You make your bed etc.</p>
      <p>Pirated fonts are crap - no doubt. If I was the kind of person who really wanted to use a copy of Whitney or any other high value font for my little website project or whatever, then I will simply fire up bittorrent or similar and find a genuine copy. I am certainly not going to pratt about trying to reverse engineer a typeface from a PDF file, where I'll probably loose all tracking, hinting and every other metric necessary for the font to work properly.</p>
      <p>Font vendors usually don't have the monopolistic luxury of sitting back and making demands - Or maybe they do? Either way, their causes in policy will simply produce effects in their income. Their sales are obviously healthy enough.</p>
      <p>Would a font vendor sue me for using a pirated font? Yes.<br>
      Would a font vendor sue me for overlooking their EULA and releasing a naughty PDF? Yes.</p>
      <p>Therefore, if you buy a font, comply with the EULA or don't bother buying it in the first place.</p>
      <p>As a freelancer with very limited time, do I want the worry of complying with restrictive EULAs? No. Not a boohoo, just the way I see the world.</p>
      <p>I don't restrict people who buy my photographs from putting them in PDFs and they are far more open to being copied than an entire font. Granted I wouldn't want them to put the image on a website at high resolution - that's like simply offering a font for free download.</p>
      <p>Anyway - I am about to buy Apex New due to it's sensible licensing, super friendly author, and upgrading policy. Oh, and I think it's a great Sans!</p>
      <p>I was all set to buy Whitney too, but it now turns out to be too expensive to comply fully with the EULA for the output of PDF brochures that would be downloadable from my clients' websites.</p>
