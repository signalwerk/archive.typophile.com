    html: |-
      <p>Mark: your description of Flash font embedding is accurate for Flash 7, but as of Flash 8 they now do FlashType, which is based on Saffron, and that's an entirely different ball of wax. For one, it's a real font, not just shapes, largely because they want to be able to support editable text in it. As such, it's got stuff like kerning data included.</p>
      <p>Even for Flash 7, it's important to distinguish the file <em>format</em> from the tool. And Macromedia's conversion to (Flash 7 and earlier) outlines is quite lossy. I'm sure you're right that they're much more concerned with file size than quality (they've never seen Flash as a print format).</p>
      <p>Technical quibbles aside, I entirely agree with your argument about paranoia.</p>
      <p>One last point. If people are wanting to be careful about coloring inside the lines, and need to do things that would not be allowed by an ordinary EULA, maybe take a look at one of the <a href="/wiki/Good%20Libre%20Fonts" class="freelinking" rel="nofollow">Good Libre Fonts</a>, released under a free software license. That said, in particular there aren't very many superfamilies out there. Yet :)</p>
