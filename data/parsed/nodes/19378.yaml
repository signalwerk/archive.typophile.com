      <p>&gt;FontFont allows embedding as long as it’s secure and uneditable</p>
      <p>Recently had an off-list debate about this. I was drafting a survey that would ask type designers about their policy regarding font embedding for Web content and included something like "we allow embedding in Web content but only when the mechanism is considered secure eg. Flash." and got feedback that Flash can't be considered secure because of all the 3rd party SWF decompilers.  </p>
      <p>The 'secure' restriction has always bothered me as it's a moving target. I doubt this will ever be tested in court, but it makes life harder for people like Tiffany who try to live their lives totally within the EULA. </p>
      <p>Si</p>
