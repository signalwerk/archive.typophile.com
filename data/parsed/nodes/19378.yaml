      <p>I don't think the EULA that is part of licensing fonts from Hoefler &amp; Frere-Jones is bad or wrong. It is, after all, their EULA, and I knew what was in the EULA when I originally licensed Whitney. I knew I could only use it on certain projects, just as I know that I can only use Font Bureau's fonts on certain projects without needing to extend my license. I don't begrudge either foundry, but I don't want to be seen as a cheapskate if I go looking for a font that has a EULA which does allow for what I need without needing extensive licensing. If the client had the budget I would've just used Whitney because it really was perfect as I experimented with it. But at the end of the day I knew I couldn't use it because of budgetary constraints so I had to move on. I found a font that is working, and is close in design, and pleases the client. </p>
      <p>People who don't calculate the worth of their own time are the people who waste the time hacking into a PDF to get the font. People who go looking for fonts in the same way or visit illicit shareware sites and/or torrents should also not be angry when their own work gets ripped off. </p>
      <p><em>Therefore, if you buy a font, comply with the EULA or don’t bother buying it in the first place.</em></p>
      <p>I'm not sure if you are directing this remark at me or not, Steve. Is it?</p>
