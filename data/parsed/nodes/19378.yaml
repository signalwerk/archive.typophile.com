    html: |-
      <p>I personally think that embedding in things like Flash or PDF is okay. Sure, there are ways to extract some possibly useful font data, but the same can be said of output from a printer. </p>
      <p>In the case of Flash, the data is not super useful--each character is stored as a shape symbol using Flash's internal graphic format. This is why Flash is not a great format for font samples--the shapes it creates are approximations optimized to take up as little space as possible. At actual size it usually looks okay, but if you zoom in, you can see that it's not an exact copy. I've played around with some of these Flash decompilers and what you get is these shape symbols, not fonts. </p>
      <p>Another way to think about it: Every time a font is reproduced on paper is an opportunity for piracy. A magazine has a new exclusive custom typeface. If someone really badly wanted to use it, they could clip up issues of the magazine until they had all the characters, make high-res scans, piece together words... you get the idea. The only way to prevent this kind of piracy is to not allow the font to be used at all by anyone. Font development is not a good career for the paranoid.</p>
      <p>In my opinion, terms of usage should allow anything that doesn't directly interfere with the font developer's means of support--the big one for me is redistribution. The risks associated with embedding are tiny and almost academic compared with, say, casual sharing and borrowing of fonts. I really think that overly restrictive licenses hurt efforts to get people to take EULAs seriously.</p>
