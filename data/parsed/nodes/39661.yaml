      <p>ok, here is the translation:</p>
      <p>"The story is a bit complicated and confused. The road and highway signage is based on relatively international standards, that also involve the fonts to be used. From the beginning of the '60s Italy used the font designed (from 1957 to 1967) specifically for street signs in the UK. The designers of the sign layouts and the of the font in use are <a class="freelinking external" href="http://www.designmuseum.org/design/jock-kinneir-margaret-calvert" rel="nofollow">Jock Kinneir and Margaret Calvert</a>, and the font is <a class="freelinking external" href="http://www.myfonts.com/fonts/urw/transport/familytree.html" rel="nofollow">Transport</a> (URW, 1980).<br>
      The laws on Italian signage (quite depressing) are on any complete edition of the Italian "Codice della Strada" -Manual of road laws and rules, that has specimens of all the alphabets to be used. Some engineers from the Public Works Department, one of which maybe was called Cecilia, worked on it.<br>
      The system designed by Kinneir and implemented in 1963 is an example of stylistic durability.<br>
      In an <a class="freelinking external" href="http://www.hyphenpress.co.uk/books/978-0-907259-09-1/contents" rel="nofollow">article</a> called "Roadside traffic sign" (originally published on the British magazine Design No. 178, 1963) Anthony Froshaug proved that there was no reason for an improvement of that signage system.<br>
      The Italian license plates are designed by the <a class="freelinking external" href="http://www.ipzs.it/scheda_prodgraf_ocv_en.jsp" rel="nofollow">IPZS</a>, the Istituto Poligrafico.<br>
      In Spring 2003 the Triennale in Milano hosted a very interesting show called "<a class="freelinking external" href="http://architettura.supereva.com/sopralluoghi/20030324/" rel="nofollow">Asfalto</a>, the character of the city".</p>
      <p>in my researches though, i found that <a class="freelinking external" href="http://www.myfonts.com/search?search%5Btext%5D=traffic+type+spain+d " rel="nofollow">Traffic Type Spain D</a> (from an unknown designer), as it appears here is a lot closer in look to what appears on the Italian highways than Kinneir's <a class="freelinking external" href="http://www.myfonts.com/fonts/urw/transport/d-bold/" rel="nofollow">Transport</a>, (1957-67), even in its <a class="freelinking external" href="http://www.dft.gov.uk/pgr/roads/tss/workingdrawings/alphabet/" rel="nofollow">Heavy</a> variant.<br>
      what my opinion is, is that the font that is being used took its shape from Kinneir's original design (the similarity with it is out of doubt), but was redrawn and applied without consideration of what were the lighting and optical problems concerned.</p>
      <p>i will let you guys (that for sure have a lot more typographical experience than i do) judge these images, but please let me know your opinions!<br>
      a.</p>
      <p>Below is the comparison between:<br>
      --<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/big_card_telepass_4468.gif"></div><br>
      1) what appears on italian road signs (in particular this one is from the highway)<br>
      --<br>
      <div class="imageWrap"><img src="http://typophile.com/files/transport_bold_3937.png"></div><br>
      2) Kinneir's Transport Bold (preview from myfonts.com)<br>
      --<br>
      <div class="imageWrap"><img src="http://typophile.com/files/traffic_type_5370.png"></div><br>
      3) Traffic Type Spain D (preview from myfonts.com)<br>
      --<p></p>
