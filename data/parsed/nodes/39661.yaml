      <p>I am not going to burden you with all the data I have on this – some of it you don’t want to see. Just one example below:<br>
      A gentleman called Nathaniel Porter has digitized Transport Heavy, and it is being used by various agencies. The data is even worse than the Swedish Tratex font which must have been done by an amateur on on Ikarus system without corrections. This one here is just a raw scan. Amazingly, it works as a font. Too heavy for signs, but just shows how good font software has become if it can actually make a working font from a scan that looks like a piece of German rye bread.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/transport_a_6105.gif"></div><p></p>
      <p>The other illustration is from a project I have been working on for the European Community. It won't be ready for a while – these things take forever and will be tested by the same people who are using Transport Heavy by Mr Porter. I still have to make different bitmap sizes and, thanks to Bitfonter and Adam Twardoch, these will actually be fairly legible. All the other dynamic signs in Europe use bitmaps that have been generated automatically from DIN, Transport or whatever they use in the countries.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/tern_sign_5608.gif"></div><p></p>
