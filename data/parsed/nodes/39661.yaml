      <p>It appears (from what I was told by URW++) that the URW++ digital versions of <a class="freelinking external" href="http://www.urwpp.de/cgi-bin1/dalcgi/source/fontliste0.htd?sprache=deutsch&amp;auswahl=-1&amp;fontnummer=t029000d&amp;gwpb-id=wd9a5805367b73ac6d9987dbeae12bccd5a861fbdec" rel="nofollow">Traffic Type Spain</a> and <a class="freelinking external" href="http://www.urwpp.de/cgi-bin1/dalcgi/source/fontliste0.htd?sprache=deutsch&amp;auswahl=-1&amp;fontnummer=t027014d&amp;gapb-id=wd9a5805367b73ac6d9987dbeae12bccd5a861fbdec" rel="nofollow">Transport</a> were created at the beginning of the '80s, for the SIGNUS signmaking system, and that the artwork for Traffic Type Spain was supplied directly by their representative in Spain.</p>
      <p>In that period URW++ digitalized many European road sign typefaces under request of their signmaking costumers.</p>
      <p>Unfortunately at URW++ there aren't any more information information about the source, the specifications or the designer of Traffic Type.</p>
      <p>Quoting the book <a class="freelinking external" href="http://www.amazon.com/Signs-Lettering-Environment/dp/1856693376/ref=sr_1_7?ie=UTF8&amp;s=books&amp;qid=1199902138&amp;sr=8-7" rel="nofollow">Signs: Lettering in the Environment</a>: "there is not an official commercial release of the Transport type, except for that of Letraset sheets in the 60s and 70s" (pg. 32 of the Italian version).</p>
