    <p>We started to <a href="http://www.typografie.info/typowiki/index.php?title=Schriften_auf_Verkehrszeichen" rel="nofollow">compile a list</a> of official traffic system typefaces. So far we covered:</p>
    <p>FHWA Series Fonts/Clearview - USA/Canada<br>
    DIN Mittelschrift/Engschrift - Germany<br>
    Transport/Motorway - Great Britain<br>
    ANWB-Ee/ANWB-Uu - The Netherlands<br>
    Mittelschrift/Engschrift Austria - Austria<br>
    ASTRA Frutiger - Switzerland<br>
    Tratex - Sweden<br>
    Trafikkalfabetet - Norway</p>
    <p>Who knows more official typefaces?</p>
    <p>Ralf</p>
