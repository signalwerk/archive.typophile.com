      <p>La storia è un po’ complicata e confusa. La segnaletica stradale &amp; autostradale si basa su convenzioni (relativamente) internazionali, che riguardano anche il carattere. L’Italia dagli anni sessanta ha adottato il carattere disegnato (dal 1957 al 1967) appositamente per l’uso stradale in inghilterra. Il progettista che ha disegnato la segnaletica e il carattere in uso è Jock <a href="http://www.designmuseum.org/design/jock-kinneir-margaret-calvert" rel="nofollow">Kinneir</a> (e Margaret Calvert), il carattere è appunto il <a href="http://www.myfonts.com/fonts/urw/transport/familytree.html" rel="nofollow">Transport</a> (URW, 1980).<br>
      La normativa della segnaletica italiana (quanto mai deprimente) si trova in qualunque edizione completa del <em>Codice della Strada</em>, che la riporta integralmente con tutti gli alfabeti prescritti. L’avevano fatta certi ingegneri del Ministero dei Lavori Pubblici, dei quali uno forse si chiamava Cecilia.<br>
      Il sistema progettato da Kinneir e implementato nel 1963 è un segno di durabilità stilistica. Anthony Froshaug, in un <a href="http://www.hyphenpress.co.uk/books/978-0-907259-09-1/contents" rel="nofollow">articolo</a> chiamato “Roadside traffic signs” (originariamente pubblicato nella rivista inglese <em>Design</em> No. 178, 1963), provò che non c’era ragione alcuna per un miglioramento del suddetto sistema di segnaletica esistente.<br>
      Le targhe automobilistiche italiane sono progettate dall’<a href="http://www.ipzs.it/scheda_prodgraf_ocv_en.jsp" rel="nofollow">IPZS</a>, l’Istituto Poligrafico.<br>
      Nella primavera del 2003 a Milano la Triennale ha ospitato una <a href="http://www.triennale.it/triennale/sito_html/asfalto/" rel="nofollow">mostra</a> molto interessante dal titolo “<a href="http://architettura.supereva.com/sopralluoghi/20030324/" rel="nofollow">Asfalto</a>, il Carattere Della Città”.</p>
    html_clean: |-
      <p>La storia è un po’ complicata e confusa. La segnaletica stradale &amp; autostradale si basa su convenzioni (relativamente) internazionali, che riguardano anche il carattere. L’Italia dagli anni sessanta ha adottato il carattere disegnato (dal 1957 al 1967) appositamente per l’uso stradale in inghilterra. Il progettista che ha disegnato la segnaletica e il carattere in uso è Jock <a href="http://www.designmuseum.org/design/jock-kinneir-margaret-calvert" rel="nofollow" class="link-external">Kinneir</a> (e Margaret Calvert), il carattere è appunto il <a href="http://www.myfonts.com/fonts/urw/transport/familytree.html" rel="nofollow" class="link-external">Transport</a> (URW, 1980).<br>
      La normativa della segnaletica italiana (quanto mai deprimente) si trova in qualunque edizione completa del <em>Codice della Strada</em>, che la riporta integralmente con tutti gli alfabeti prescritti. L’avevano fatta certi ingegneri del Ministero dei Lavori Pubblici, dei quali uno forse si chiamava Cecilia.<br>
      Il sistema progettato da Kinneir e implementato nel 1963 è un segno di durabilità stilistica. Anthony Froshaug, in un <a href="http://www.hyphenpress.co.uk/books/978-0-907259-09-1/contents" rel="nofollow" class="link-external">articolo</a> chiamato “Roadside traffic signs” (originariamente pubblicato nella rivista inglese <em>Design</em> No. 178, 1963), provò che non c’era ragione alcuna per un miglioramento del suddetto sistema di segnaletica esistente.<br>
      Le targhe automobilistiche italiane sono progettate dall’<a href="http://www.ipzs.it/scheda_prodgraf_ocv_en.jsp" rel="nofollow" class="link-external">IPZS</a>, l’Istituto Poligrafico.<br>
      Nella primavera del 2003 a Milano la Triennale ha ospitato una <a href="http://www.triennale.it/triennale/sito_html/asfalto/" rel="nofollow" class="link-external">mostra</a> molto interessante dal titolo “<a href="http://architettura.supereva.com/sopralluoghi/20030324/" rel="nofollow" class="link-external">Asfalto</a>, il Carattere Della Città”.</p>
