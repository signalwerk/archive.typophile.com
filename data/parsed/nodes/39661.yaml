      <p>I would say it is not Transport (an official version of which was never relesased for use outside of Great Britain, except for Letraset films), but one of the many copies we can find around the world.</p>
      <p>Unlike the Italian Transport, though, this version of Kinneir’s alphabeth seems a lot more freely interpreted, still keeping many similarities with that design.</p>
      <p>The most curious aspect of these signs is, in my opinion, the Greek version of the Transport, designed to work with the Latin one but used in a different color and placed on separate signs…probably a bit confusing for drivers!</p>
      <p>Does anybody have more precise information about this Greek “Θϱανσποϱτ”?</p>
      <p>p.s. Great picture by the way!</p>
