      <p>Italy uses Traffic Type Spain? That's funny! ;-)<br>
      Do you know if this is the official name and the official typeface? Or is »Traffic Type Spain« just a similar commercial version of the original typeface? (Like Interstate is for FHWA fonts)</p>
      <p>About Spain I just found this statement:<br>
      »En España, según la norma 8.1-I.C, se deben usar dos tipografías que se adjuntan dimensionadas con la norma. Para la señalización en autopistas, autovías y vías para automóviles, se utilizará el alfabeto denominado Autopista; mientras que para las carreteras convencionales, el entorno urbano y el resto de vías se usará el alfabeto Carretera Convencional.<br>
      Exiten versiones comerciales de las dos fuentes. La versión del alfabeto Autopista es la fuente Highway gotic, y del Carretera Convencional es Traffic Type Spain1 .«</p>
      <p>Can anyone help to translate?<br>
      I guess it means they use a font called »Autopista« (based on Highway Gothic) and font called »Carretera Convencional« which is equal to »Traffic Type Spain«. Correct?</p>
      <p>Ralf</p>
