      <p>mmm i'm not 100% sure about it (because i couldn't find a specific name for the font used in Italy, only a specimen of it) but i'm pretty sure it is Traffic Type Spain: i'm doing a thesis on a re-design of this typeface and i'm very interested in the subject!</p>
      <p>here is the translation of what of the spanish text you posted.<br>
      "In Spain, according to the 8.1-I.C law two typographies are to be used. For signage on highways, freeways and normal car-roads (i'm not sure about the technical differences among these kinds of roads) the Autopista font will be used. For conventional streets, urban sorroundings and the rest of the streets the Carretera Conventional font will be used.<br>
      Commercial versions of those fonts can be found. <strong> Highway Gothic is the Autopista's commercial version of the font, while Traffic Type Spain 1 is the Carretera Conventional's version</strong>."</p>
      <p><a class="freelinking external" href="http://upload.wikimedia.org/wikipedia/commons/5/59/BilingualSign_Spain.png" rel="nofollow">Autopista/Highway Gothic</a><br>
