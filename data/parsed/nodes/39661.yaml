      <p>It appears (from what I was told by URW++) that the URW++ digital versions of <a href="http://Traffic Type Spain" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Traffic Type Spain</a> and <a href="http://Transport" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Transport</a> were created at the beginning of the '80s, for the SIGNUS signmaking system, and that the artwork for Traffic Type Spain was supplied directly by their representative in Spain.</p>
      <p>In that period URW++ digitalized many European road sign typefaces under request of their signmaking costumers.</p>
      <p>Unfortunately at URW++ there aren't any more information information about the source, the specifications or the designer of Traffic Type.</p>
