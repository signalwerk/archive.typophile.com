      <p>I just got back from my first trip to Ireland, and I loved the face being used for the text in Irish as illustrated by Richard Hards months ago. So, I took the step of emailing Rennicks, and they promptly responded and described that face as:</p>
      <p>Transport Heavy - Eire Heavy 10</p>
      <p>Which makes sense, as it does appear to be more or less an "Irish" take on the standard Transport.</p>
      <p>However, the person I talked to did not give any indication as to where the font could be purchased or even *if*; so, with that in mind, I thought I'd bump this thread in the hopes that either the information would help the curious or (even better!) help someone find it so that I could eventually get my hands on it as well.</p>
