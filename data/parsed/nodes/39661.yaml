      <p><cite>For signage on highways, freeways and normal car-roads (i’m not sure about the technical differences among these kinds of roads) the Autopista font will be used. For conventional streets,</cite></p>
      <p>Basically, the autopistas and autovías are what in the US would be called Interstates.  They are the roads which are designated with either an A (Autovía, such as A-6) or AP (Autopista, AP-41).  The primary difference between these roads is the design standards (APs are newer, with easier curves and more straight areas with better on and off ramps) and that the Autovías are free to use, while the AP charge tolls.  Carreteras are equivalent to US-highways or state roads, and are designated with an abbreviation for the province plus a number (e.g. M-30)</p>
      <p>The MAIN difference I've seen between the two fonts used in Spain is that Autopista (the font) uses a straight bar tilde over the N in Ñ, whereas the Carretera Convencial uses the squiggly tilde and that Autopista tends to be spaced a little bit looser.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
    html_clean: |-
