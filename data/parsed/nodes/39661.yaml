      <cite>Interstate in the USA?</cite><br>
      --</p>
      <p>Core, actually Interstate is the name of Tobias Frere-Jones’ 1993-4 type design.<br>
      The alphabeths in use in the US highways are called <a class="freelinking external" href="http://en.wikipedia.org/wiki/FHWA_Series_fonts" rel="nofollow">FHWA Series fonts</a>.</p>
      <p>And for what concerns Portugal’s street and highway signs: another “clone” of Kinneir's project, this time not only concerning the font in use, but also the arrows and the layout (together with, it seems to me, the font used for the numbers).</p>
