    html: '<p>This is oozing quite a nice character. <br>The structures are [mostly] modern but the finish is fauve - pretty unique, and surpisingly effective. <br> <br>The only "macro" complaint I have is that <i>all</i> of the strokes should have that flare; some, like the bar of the "t" are too straight. <br> <br>Micro stuff: <br>- I would have the joins in "b", "p" and "q" sharp, not pudgy. <br>- The "g" is charming (love the "missing" ear) but out of character, I guess because its structure is too organic - try making the join and the bottom bowl more geometric. <br>- The "z" is too dark. <br> <br>hhp</p>'
