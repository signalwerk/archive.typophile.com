    html: <p>hey ole, <br> <br>thanks for your comments. my first font, my first critique!  <br>you flatter me with the eunuverse comparison, tho<img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>the name is playford, and i think its the best thing about the font!  <br>messers playford, bell and myself, franklin, are friends;  <br>i thought playford was perhaps feeling a bit left out not having a face bearing his name <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>my family plan (crikey that sounds a bit scary) is to have two weights,  <br>one for reading extended text, and one for display applications. (perhaps playford display / playford read).  <br>this is the display version - much lighter, more contrast, and with features that emerge at larger point sizes.  <br>thats the intention anyway.  <br> <br>the stem thickness *should* be uniform - that fact that they're not is down to my inconsistancy and bad draughting skills.  <br>the idea was that the stems width should equal the widest part of the curved forms. <br> <br>as far as the tapers go on the stems, the idea was to have one side tapered (maybe the internal edge), one side straight.  <br>so i need to go back and redraw a whole bunch of these glyphs. not all, tho;  <br>i don't have a problem with a mixture of curved and straight forms. <br> <br>a - yes, my thoughts exactly.  <br>is it too close to a d?  <br>perhaps i should set some text to get the context.  <br>the a was the first glyph to be drawn. <br> <br>ok, perhaps some uc&amp;lc numerals will smoke out some more crits... worth a try;) <br> <br><img src="http://www.typophile.com/forums/messages/29/12504.jpg" alt="numerals"></p>
