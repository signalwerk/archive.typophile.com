    html: "<p>I'm just a beginner and I'm sure many of the people who have given you advice know much more than I do about the in\"s and out's of type design so please defire to their expertise, but I just wanted to say... <br>I really like #4.  Depending on what you are going for #3 is an excellent choice.  It feels historically/sterotypically correct with what I assume is the genere of the typeface.  What I personally like about #4 is that is is unexpected (at least to me) in that style.  It still reads as an \"a\" to me immediately, but it comes off as a fresh way to represent the character (within that genere).  If you were to choose to do #4, I would however try to replicate the style in the letter \"e\" to maintain some consitency within the character set.  Maybe it can be part of the alternates set. For what its worth</p>"
    html_clean: "<p>I'm just a beginner and I'm sure many of the people who have given you advice know much more than I do about the in\"s and out's of type design so please defire to their expertise, but I just wanted to say... <br>I really like #4.  Depending on what you are going for #3 is an excellent choice.  It feels historically/sterotypically correct with what I assume is the genere of the typeface.  What I personally like about #4 is that is is unexpected (at least to me) in that style.  It still reads as an \"a\" to me immediately, but it comes off as a fresh way to represent the character (within that genere).  If you were to choose to do #4, I would however try to replicate the style in the letter \"e\" to maintain some consitency within the character set.  Maybe it can be part of the alternates set. For what its worth</p>"
