    html: <p>i'm with hrant on the whole "a" issue. that one sticks out like a sore thumb. i'd suggest a single story "a" that looks similar to a rotated "b" with the (now) descender lopped off. i think the tapered vertical strokes are a nice touch, and can go a long way to giving the face a nice character. i'd say, yes, be consistent in its application to similar verticals -- B, D, E, F, H, K, L, M, N, P, R. not sure about the I tho. maybe make it fluted on both sides. have you inspected optima as a reference point?</p>
