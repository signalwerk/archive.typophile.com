    html: <p>i think the caps need a lot of work. <br>there are loads of inconsistancies that have probably arisen  <br>from hand-drawing isolated glyphs on separate pieces of paper :/ <br> <br>i think the stoke widths need to be evened out. <br>the stem width of the U  seems too wide,  <br>that of the I and R too narrow. <br> <br>the other thing i would appreciate some comment on <br>is the tapering present on some of the ascenders (one side of the stem only). <br> <br>heres a H for example. <br><img src="http://www.typophile.com/forums/messages/29/12802.jpg" alt=""> <br>i quite like that feature, and it will look a bit more even  when it is vectorised. <br>i have not applied it consistantly to all characters - is this a problem?  <br>i also have a feeling that its going to play havoc with rendering/hinting,  <br>especially at small sizes. <br> <br></p>
