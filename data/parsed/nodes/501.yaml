    html: <p>Hi Geraint , This reminds me of  a more artistic expression of  Barry Deck's Eunuverse which I really like. First  thing that strikes me is the name, why call it a Franklin? It does not seem like a Franklin.  I think it is great that you are starting from sketches, a lot can be explored with pen and ink. To take this to the next level consider end user. Are you going to make a Family or just  a single weight/style.  The widths are very broad on forms with curves and rather narrow on the rest, I think we may have a problem here with legibility, especially in text settings. The "a"s are designs similar to what I in the past have seen in Gaelic fonts but here the glyph is an "a", and it is a "d" in Gaelic fonts.Interesting. The  "s" seems to small. Best glyphs are the g, h, j, k, t, x, y. Will you make stems the same or is it intentional that some a wider than others and some straight and others with curves (ie. m is straight, r is curved) Soft curves are nice and organic, I do this a lot in my own type designs, but perhaps this trend is coming towards an end.  </p>
    html_clean: <p>Hi Geraint , This reminds me of  a more artistic expression of  Barry Deck's Eunuverse which I really like. First  thing that strikes me is the name, why call it a Franklin? It does not seem like a Franklin.  I think it is great that you are starting from sketches, a lot can be explored with pen and ink. To take this to the next level consider end user. Are you going to make a Family or just  a single weight/style.  The widths are very broad on forms with curves and rather narrow on the rest, I think we may have a problem here with legibility, especially in text settings. The "a"s are designs similar to what I in the past have seen in Gaelic fonts but here the glyph is an "a", and it is a "d" in Gaelic fonts.Interesting. The  "s" seems to small. Best glyphs are the g, h, j, k, t, x, y. Will you make stems the same or is it intentional that some a wider than others and some straight and others with curves (ie. m is straight, r is curved) Soft curves are nice and organic, I do this a lot in my own type designs, but perhaps this trend is coming towards an end.  </p>
  - id: 3427
