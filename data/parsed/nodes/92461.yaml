    <p>My god-daughter is getting married late this year and I'd like to play a practical joke on her on April Fools day.<br>
    I want to modify this picture of an ultrasound of twins with her name on it but I cannot identify the font.</p>
    <p>My PC uses Windows 7 so if the font discovered is not "Normal" then a link to where I could download it would be very appreciated.</p>
    <p>Thank you in advance for trying.<br>
    Porkchop</p>
