      <p>The first digital typesetter, the Digiset, was created by the Dr.-Ing Rudolf Hell GmbH company in Kiel/Germany in the late 1960s… either 1966 or 1968. The first digital typefaces were the ones that were designed for this machine, by Gerard Unger and Hermann Zapf, among others.</p>
      <p>So digital typography began in the late 1960s and early 1970s. It really took off in the 1980s with the introduction of technologies that are now more common, like the PostScript page markup language by Adobe, the Macintosch computer by Apple, and Fontographer by Altsys (later by Macromedia, now by FontLab Ltd.). These inventions led to the design of fonts on personal computers, for use on other personal computers.</p>
