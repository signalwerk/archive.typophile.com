      <p>IKARUS (Dr. Peter Karow/URW) was using spline data for font descriptions, but wasn't the system chiefly used for typeface development?</p>
      <p>The first CRT digital imagesetters were available late 1970s and were using vector-based outline data for fonts, and were used for straight high-resolution typesetting.</p>
      <p>Don't confuse PostScript with digital fonts. There were several PDL (Page Description Language) formats being utilized prior to the development of PostScript. The main breakthrough with PDL/PostScript was that imagesetters could now manipulate and output BOTH type and images simultaneously and composed into a page layout.</p>
      <p>No more paste-ups for graphic artists!!!!</p>
