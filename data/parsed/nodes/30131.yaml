      <p>"why do the histories say that digital fonts only really took off with Post Script language and type 1 fonts? "</p>
      <p>It was not an issue with Ikarus, it was the desktop output that caused the boom. By removing the step of getting type set as galleys and pasted up, you saved countless hours and many dollars. You also brought the infinitely editable layout to be born allowing clients to rewrite anyting any time without the high cost of alterations in the old paste-up days. You also spawned the cottage indudtry of typeseeting at home.  Ikurus was a very capable tool, but it could not do pagemakeup on the fly like the old Mac SE.</p>
      <p>ChrisL</p>
