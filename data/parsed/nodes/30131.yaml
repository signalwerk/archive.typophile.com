      <p>When applied to typography, digital really means that the fonts contain the shape of the letters not in analogue form (a piece of metal, or a photographic image), but numerically. And by implication, with an electronic computer.</p>
      <p>In that sense, the crucial invention is PostScript, in the early 1980s, a programming language invented by Adobe, which was able to digitize complex letter shapes by describing letter outlines with vector paths.</p>
      <p>Earlier technologies had digitized part of the typographic process at some stage or other. For instance, the Monotype (early 20th century) transferred keyboarded text to the casting machine on punched paper tape. This technique was still used with phototype in the 1960s, before the paper tape was replaced by computer tape.</p>
      <p>Also, I'm not sure how all the photo imagesetters of the 1960s and 1970s worked. I know that Diatronic exposed directly from a negative image (on a ground glass plate); but what about the Alphatype and similar video systems -- AFAIK, they worked by exposing single glyph images, displayed on the entire surface of a CRT screen. But were the images on the screen generated entirely from digital information?</p>
