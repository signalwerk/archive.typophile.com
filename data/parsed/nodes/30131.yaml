      <p>One major advantage of Desktop Publishing was the concept of WYSIWYG -- being able to see a scaled representation of one's layout on screen, and modify it interactively prior to printout.<br>
      At first it was high-contrast B&amp;W, type with jaggies, but then anti-aliasing arrived with TrueType and Adobe Type Manager, c.1988. When layout programs Pagemaker and Quark XPress introduced the zoom tool, that was huge too.</p>
      <p>Also, I recall it was nice to get a large greyscale monitor. For a couple of years I worked on a black-and-white Mac Plus, and sh*t would happen like getting dropshadows (cool new digital effect!) on top of the type rather than behind, because it all looked the same on screen. So I'd bluff and say "yeah, dropshadow at top left, pushing the design envelope..."</p>
