  html: <p>which was the first type to be digiatlly reproduced? Did teh Digital Age begin after the invention of the Apple Mac in 1970's or the 1930's to 40's after  Atanasoff-Berry Computer and ENIAC? So when do you think typeography was involved in digital screen based, output products. i know about anti allaising etc.</p>
