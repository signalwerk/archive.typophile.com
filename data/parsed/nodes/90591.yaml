      <p>This is a false dichotomy (which can happen when you flesh out the inane “Don’t we already have enough fonts?” into academese).</p>
      <p>The purpose of design is to resolve conflicting parameters.<br>
      You <strong>can</strong> have it all, or else settle for second best—revivals, retreads and clones.</p>
      <p>If you think there are universal truths and style, you’re not thinking like a creative.</p>
