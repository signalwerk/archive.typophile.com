    html: |-
      <p>It's true that new typefaces are harmless, and like new popular songs, someone might like any given new typeface.</p>
      <p>But while that means the creative endeavor of producing new typefaces should not be <em>suppressed</em>, the question of whether or not we <em>need</em> new typefaces can be thought of in another sense: by how much should the creation of new typefaces be <em>encouraged</em>? Just how <em>urgently</em> do we need more of them?</p>
      <p>I think that if we look at the word "need" from that point of view, while most new typefaces will, even if they're worthwhile and well-done, vanish into obscurity, there will still be the occasional typeface that does fill a void.</p>
      <p>One obvious example is the much-overused and much-criticized typeface Papyrus, which I've noted fills a void as an inoffensive typeface which suggests something foreign and exotic but in a way that is not likely to draw criticism for cultural insensitivity, the way simulation faces are likely to do.</p>
      <p>With the advent of the electronic digital computer, display faces based on, or inspired by the MICR numerals, hideous and inappropriate as they might seem, were still "new" typefaces that could not possibly have been waiting there to be used in a 1923 font catalog.</p>
      <p>And then there are the creative successes that don't meet a "need", as such, but are original enough to demand attention. Bifur, Lydian, Optima and Peignot come to mind. So does Times Roman, although now there's the controversy about Starling.</p>
