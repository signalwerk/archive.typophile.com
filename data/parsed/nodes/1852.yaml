    html: <p> Nice work! <br> <br>I like the curved diagonals on the upper case. I'd like to see it applied to the uc "K" as well. <br> <br>I also really like the numerals, especially "2" and "5". <br> <br>Both uc "Z" and lc "z" look a bit top-right-heavy. Try extending the lower stroke just a bit to balance them. <br> <br>David </p>
