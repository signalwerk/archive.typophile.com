  html: '<p>Hello girls and boys! <br> <br>I am new to this forum and very glad having found it! I´m a graphic design student and i´ve been a bit of a font freak lately. So I tried making one of my own (i know it´s not highly original, but anyhow). If the font turns out ok, it´ll probably be used as a font for a national media arts students´ festival here in Finland. Here is a sample of the outcome so far:  <br> <br><a href="http://www.kyamk.fi/~vi9gvisa/testi.gif" target="_top">http://www.kyamk.fi/~vi9gvisa/testi.gif</a>  <br> <br>What do you think of it? Any feedback is highly appreciated!</p>'
  html_clean: '<p>Hello girls and boys! <br> <br>I am new to this forum and very glad having found it! I´m a graphic design student and i´ve been a bit of a font freak lately. So I tried making one of my own (i know it´s not highly original, but anyhow). If the font turns out ok, it´ll probably be used as a font for a national media arts students´ festival here in Finland. Here is a sample of the outcome so far:  <br> <br><a href="http://www.kyamk.fi/~vi9gvisa/testi.gif" target="_top" class="link-external">http://www.kyamk.fi/~vi9gvisa/testi.gif</a>  <br> <br>What do you think of it? Any feedback is highly appreciated!</p>'
