    html: "<p> Thanks! Good points, one and all, David. I will certainly take these suggestions into consideration.  <br> <br>Here´s an list of Characters I also think I need to work with (let´s see if you guys agree with me): <br> <br>UC: <br> <br>J needs to be condensed a bit <br>Yes, K, (I hurried a bit on that one), needs a whole new form... something in style of the R.  <br>Q´s tail needs to be extended a bit <br> <br>LC: <br> <br>Definitely the ´f´. It Seems to create too much negative space. On the right.   <br> <br>NUMERALS: <br> <br>All numerals should maybe have a same kind of twist as that of number 5´s. Or should they? <br>8´s lower part should maybe be heavier than the upper part. <br> <br>So what do you think? </p>"
    html_clean: "<p> Thanks! Good points, one and all, David. I will certainly take these suggestions into consideration.  <br> <br>Here´s an list of Characters I also think I need to work with (let´s see if you guys agree with me): <br> <br>UC: <br> <br>J needs to be condensed a bit <br>Yes, K, (I hurried a bit on that one), needs a whole new form... something in style of the R.  <br>Q´s tail needs to be extended a bit <br> <br>LC: <br> <br>Definitely the ´f´. It Seems to create too much negative space. On the right.   <br> <br>NUMERALS: <br> <br>All numerals should maybe have a same kind of twist as that of number 5´s. Or should they? <br>8´s lower part should maybe be heavier than the upper part. <br> <br>So what do you think? </p>"
