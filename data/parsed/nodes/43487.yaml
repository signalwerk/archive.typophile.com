    <p>Hey everyone,</p>
    <p>I'm in the middle of a project and came across some older type sheets I inherited from a friend. I've been searching the net frantically for a typeface/font version of Bodoni Flair but can't seem to find one. Would anyone happen to know where I could purchase this file in the electronic form?</p>
    <p>Thanks!</p><div class="imageWrap"><img src="http://typophile.com/files/bodoni_flair_5096.jpg"></div><p></p>
