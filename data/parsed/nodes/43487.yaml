      <p>What kind of world are we living in where a typeface as sweet as Bodoni Flair is not available digitally?<br>
      Maybe someday...<br>
      In the meantime, here's some other similar possibilities:</p>
      <p><a href="http://www.myfonts.com/fonts/bagraphics/pink-mouse/" rel="nofollow">Pink Mouse</a></p>
      <p><a href="http://www.myfonts.com/fonts/canadatype/jojo/" rel="nofollow">Jojo</a></p>
      <p><a href="http://www.myfonts.com/fonts/nicksfonts/omaha-bazoo-nf/" rel="nofollow">Omaha Bazoo</a></p>
      <p><a href="http://www.myfonts.com/fonts/jnlevine/groovy-happening/" rel="nofollow">Groovy Happening</a></p>
      <p>If you do a search on MyFonts.com for "1960s" you'll find a long list of trippy goodness.</p>
      <p>Rob</p>
