      <p>I think what Fowler was probably getting at in William’s comment above, is that <em>ain’t</em> completes a very productive syntactic paradigm in English (contractions of pronominal + be + negation):</p>
      <p>You are not; You’re not; You aren’t<br>
      He is not; She’s not; It isn’t<br>
      We are not; We’re not; We aren’t<br>
      They are not; They’re not; They aren’t<br>
      I am not; I’m not; *I amn’t / ?I ain’t</p>
      <p>Not that most folks use <em>ain’t</em> in precisely that manner—but that’s what Fowler was suggesting over the ridiculously ungrammatical <em>aren’t I</em>.</p>
      <p><cite>and everyone agrees on the meaning… </cite></p>
      <p>I think that may actually depend on where you hail from. In the southeastern U.S. (where I grew up) people use <em>ain’t</em> to mean both <em>isn’t/amn’t</em> as well as <em>hasn’t/haven’t</em>. If you listen closely, some educated Southerners (they do exist!) still differentiate the two by aspirating the second: <em>hain’t</em>.</p>
      <p>I hain’t had enough sleep, so I’m going to bed y’all.</p>
