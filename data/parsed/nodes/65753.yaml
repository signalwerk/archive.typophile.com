      <p>The prescriptivists of the 19th century forced “ain’t” out of standard speech. My guess is that the relatively obscure relationship between “am not” and the contraction bothered some people (the form had formerly been “an’t”). Then probably in reaction to this, people began to use “ain’t” in other meanings—“isn’t”, “hasn’t”, etc.</p>
      <p>More on this: <a class="freelinking-external" href="http://en.wikipedia.org/wiki/Ain't">http://en.wikipedia.org/wiki/Ain’t</a></p>
      <p>Now the stigma attached to the word is so great, and its use so variable in meaning in different groups, that it’s hard to see this come back in its original, logical meaning. The prescriptivists ruined a perfectly good word, innit?</p>
