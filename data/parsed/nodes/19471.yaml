    <p><a href="/wiki/Type%252BDirectors%252BClub" class="wiki">Type Directors Club</a> (TDC) FontTech Weekend  (sponsored by Adobe, Microsoft, and Monotype) featured starring roles by presenters <a href="/wiki/John%252BHudson" class="wiki">John Hudson</a>, <a href="/wiki/Adam%252BTwardoch" class="wiki">Adam Twardoch</a>, <a href="/wiki/Thomas%252BPhinney" class="wiki">Thomas Phinney</a>, and <a href="/wiki/Diane%252BCollier" class="wiki-create">Diane Collier</a>.<br>
    TDC Chairman James Montalbano led a cast of Typophile characters (<a href="/wiki/Paul%252BHunt" class="wiki">Paul Hunt</a>, <a href="/wiki/William%252BBerkson" class="wiki-create">William Berkson</a>, <a href="/wiki/Chester%252BJenkins" class="wiki">Chester Jenkins</a>, and <a href="/wiki/Chris%252BLozos" class="wiki">yours truly</a>) as participants (along with several folks from the REAL world).The ever-gracious Carol Wahler was a wonderful host and made us all feel very at home. John Hudson deserves special gratitude for persevering through his presentations in spite being sick as a dog (please don’t sing “Mad dogs and Englishmen”). Thomas gets the award for best screen-saver with beautiful pictures of his daughter Miranda and Adam Twardoch’s “laptop” wins the “most likely to succeed as a lethal weapon” award. Diane Collier gets my vote for the best one-liner with the quip, “And this is easier than VTT because?...”<br>
    Seriously, it was a great event and I highly recommend it to all type geeks interested in the murky waters of opentype and hinting. Thomas is giving more of the same in Lisbon so if you missed this, you might fly over to AtypI.</p>
    <p>Many thanks to TDC and the presenters for making it all possible!</p>
    <p>ChrisL</p>
