      <p>Thanks James!<br>
      I for one would like to see one on kerning. Class based kerning and exceptions with the effect of diacritics; what can be done with combining glyphs built on the fly; classes accross scripts (probably Greek Cyrillic, and Latin).<br>
      I would also like to see sessions on building non-Latin scripts.<br>
      Others sessions on family extension strategies and workflow.</p>
      <p>I hope others will chime in and give some potential topics for TDC or others to consider.</p>
      <p>ChrisL</p>
