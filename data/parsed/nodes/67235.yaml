  html: |-
    <p>This font was used for the descriptive text on the back of the packaging for the DVD set of the TV show Crusade (a Babylon 5 spin-off).  Note the distinctive characters: g, e, a, r, f, t, m.  WhatTheFont's closest match was Netto, but that is wrong.  Can anyone identify this font?  Thanks, Kirk</p>
