    html: |-
      <p>I agree with Tiffany. The logo is alittle tight. I would increase the letterspacing. Maybe try a different font. Serif fonts always gives more elegant look while sans serif give a modern elegant feel. Try both.</p>
      <p>Most high end stores have a simple clean logo. If they have a tagline, its centered under the logo. The logo is kept simple.</p>
