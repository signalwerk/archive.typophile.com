    votes: null
    html: |-
      <p>The type seems to be set to tight overall. Enlarging the last letter reduces the readability and seems little too tricky for something that is meant to be elegant and upscale. Does this typeface have smallcaps? If you do want to use larger cap letters for each word you either need real smallcaps or you need to work the two caps to fit with the stroke weights/widths of the smaller letters. </p>
      <p>As this is for a high-end jeweler the typographer needs to be shooting for that, as I think it is starting to, before the viewer even reads the tagline. </p>
      <p>The tagline is too tightly fit to the main wordmark. Instead of forcing that fit, perhaps you should work the letter-spacing looser and allow the tagline to float below it with more letter- and word-spacing as well. Or not. Simply centered or aligned differently. Think of Tiffany’s … no tagline. The color almost does the work. Granted they have years and years and a movie worth of history to back up their “brand” mystique, but that doesn’t mean you can’t aim for that with yours. I see the beginnings of this, but I think you could do more by not using fake small caps and working with the lettershapes and spaces.</p>
