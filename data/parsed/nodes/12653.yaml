    <p>Hello,</p>
    <p>I created this logo for a client.  It is a very upscale jewellery and watch store, that’s what is says on the tag line.  The client wants the logo to look very elegant, but also modern.  What do you think?  Also, they suggested a script type similar to Cartier’s logo.  Do you know a similar font?</p>
    <p>Thanks,</p>
    <p>Edgardo</p>
