    <p>Hey! I'm Kelvin and I'm new to the forums. I am working on a project which requires me to do a set of stationary sets for a state government, of which i am stuck right now. None of the composition works for me. and I am not sure why. Below would be the current name card design i am working on. i already went through a few sets  which my lecturer is unhappy with. Would help lots if someone could post a link to where i can find out more about facsimile layouts. Thanks!</p>
    <p>about the design.<br>
    the design is supposed to show how the state is a state that is mountainous and has an abundance of mineral and fertile soil. hence the graphic and colour scheme.</p>
    <p> </p><div class="imageWrap"><img src="http://typophile.com/files/dyecutetcnc_5228.jpg"></div><p></p>
    <p>looking forward for critiques. :)</p>
