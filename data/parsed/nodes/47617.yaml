    html: |-
      <p>Hi Kelvin</p>
      <p>What I notice is a difference in form and typography.<br>
      You used a serif for the name, but a very open typography (somewhat like the Avant Garde, can't see well what it is.)<br>
      That doesn't work for me.</p>
      <p>There is a kind of romance in the colors, the lettering for the logo. But the name, phone etc. has a very cold dimension.<br>
      Perhaps if you alter that, it becomes more of a unity?</p>
      <p>Further, less is more.<br>
      The idea of mountains and letting it come back in the design is good, I think.<br>
      Although the forms contrast to the lettering. Not bad, it gives it more attention.<br>
      But too much is too much! Keep it simple.</p>
      <p>I like the design upper left the best of the once you show.<br>
      Perhaps the logo should be lifted a bit to clear from the forms. I feel it is to close.</p>
      <p>For the reversed side, you might want to think of placing the phone, email etc. in a white letter on that brownish color?</p>
      <p>Play with it!</p>
      <p>Last. The lettering of the logo.</p>
      <p>I see that Perak is close together than state. It looks a bit odd to me. Especialy because the 'st' of state gets a lot of attention and stand closer together than 'ate'.<br>
      That is strange. I would place state closer together.</p>
      <p>Hope this helps.</p>
      <p>Overall, it has a very nice feel!</p>
      <p>Best</p>
      <p>Raymond</p>
