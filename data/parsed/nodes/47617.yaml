      <p>I agree with aluminum. Less is more. Keep it simple. In simplicity you will find the greater force. Too much will clutter and draw away the attention and diminish the overal experience.</p>
      <p>Did your lecturer say why he/she didn't like it?<br>
      That is important. I'm very interested about that. </p>
      <p>Can we see the simple one from your first batch? Even if it is not as elaborate as the one you have shown?</p>
      <p>About suggestions on the font.<br>
      That is in a way personal.<br>
      Find something that will fit your overal idea.</p>
      <p>Personally I always try to use as little fonts as needed.<br>
      In this case I might go for the same as you have used in your logo.<br>
      But remember, that is not the only choice.<br>
      Perhaps you intended to create a contrast. If that is what you intended, then you did well. But I think it is too much.</p>
      <p>Just try a few.<br>
      You will see what works or not.</p>
      <p>Best of luck.</p>
      <p>Ray</p>
