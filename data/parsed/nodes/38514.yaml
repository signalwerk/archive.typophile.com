    html: <p>I don’t know if they can be seen online, but Pentagram has made beautiful calendars, some of which are shown in Alan Fletcher’s “Beware Wet Paint” and in Susan Yelavich’s “Profile—Pentagram Design”, both published by Phaidon in Europe.</p>
