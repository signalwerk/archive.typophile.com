    <p>Summer is here and we feel it would be nice with a new typeface release.<br>
    So with no further ado we give you – <strong>Orbe</strong> designed by <strong><a class="freelinking external" href="http://www.fountain.nu/designers/ruiabreu.asp" rel="nofollow">Rui Abreu</a></strong>.</p>
    <p>Take a peek at:<br>
    <a class="freelinking external" href="http://www.fountain.nu/catalogue/orbe.asp" rel="nofollow">http://www.fountain.nu/catalogue/orbe.asp</a></p>
    <p>Rui has also made a nice promotion video:<br>
    <a class="freelinking external" href="http://www.fountain.nu/catalogue/orbe_video.asp" rel="nofollow">http://www.fountain.nu/catalogue/orbe_video.asp</a></p>
    <p>Download PDF:<br>
    <a href="http://www.fountain.nu/catalogue/img/pdf/FTN_Orbe.pdf" title="http://www.fountain.nu/catalogue/img/pdf/FTN_Orbe.pdf">http://www.fountain.nu/catalogue/img/pdf/FTN_Orbe.pdf</a></p>
    <p>Orbe is a blackletter font intended to interpret the feel of Portuguese calligraphy. It's name, the portuguese for "orb" or "globe", evokes the enclosed beauty and consistency of shapes that naturally cohere in the calligraphic expression.</p>
    <p>With a light and spontaneous feel, it's also exotic with it's flourished details, which makes it a very nice decorative and titling font. The glyphs are a mix of lowercases and uppercases, all aligned at same height, as if the uppercase forms of some letters evolved by speed of gesture to lowercase forms. </p>
    <p>This is Fountain's first OpenType release and features a full CE supported character set, and fancy ligatures. </p>
    <p>About Fountain:<br>
    Fountain is an independent and friendly digital type foundry based in Malmö, Sweden. We've been sending out nice typefaces to the world since 1993.</p>
