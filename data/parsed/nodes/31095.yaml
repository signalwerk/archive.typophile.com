      <p>proto- |ˌproʊdoʊ| |ˌprəʊtəʊ| (usu. prot- before a vowel)<br>
      combining form<br>
      original; primitive : prototherian | prototype.<br>
      • first; anterior; relating to a precursor : protomartyr | protozoan.<br>
      ORIGIN from Greek prōtos ‘first.’</p>
      <p>glyph |glif| |glɪf| |glɪf|<br>
      noun<br>
      1 a hieroglyphic character or symbol; a pictograph : flanges painted with esoteric glyphs.<br>
      • strictly, a sculptured symbol (e.g., as forming the ancient Mayan writing system).<br>
      • Computing a small graphic symbol.<br>
      2 Architecture an ornamental carved groove or channel, as on a Greek frieze.<br>
      DERIVATIVES<br>
      glyphic |ˈglifik| |ˌglɪfɪk| adjective<br>
      ORIGIN late 18th cent. (sense 2) : from French glyphe, from Greek gluphē ‘carving.’</p>
