      <p>Because letters have to be less themselves for boumas to be more themselves. When the whites "talk to each other", boumas are stronger.</p>
      <p>The only time letters matter is when immersive reading breaks, for example when we run into an unfamiliar word; then letters have to be identifiable after (relatively) long foveal observation by the consciousness, which is very easy to ensure.</p>
      <p>Our consciousness likes to separate and identify, so it sees individual active black things sitting on top of a uniform passive white background; but our consciousness is not what makes immersive reading work. The black cannot exist without the white - they are essentially one thing.</p>
      <p>hhp</p>
