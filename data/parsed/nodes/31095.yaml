      <p>If ‘optimal’ -- in the context of notan -- is not the same as ‘perfect’, or even ‘ideal’, then what does it mean? Presuming, based on common usage, that there can't be something ‘better than optimal’, we can at least agree that things can be more or less sub-optimal, closer to or further from optimal, however you are defining the latter. But in the context of notan I am wondering how you recognise these relative states of sub-optimisation. Declaring that favouring the black <em>necessarily</em> comes at the expense of optimal notation seems to me to be begging the question, because it suggests that you are assuming that optimal notan involves some kind of balance between black and white, whereas there are other possibilities, e.g. that it involves specific kinds of tension between black and white.</p>
      <p>[Of course, we presume to talk about optimal <em>typographic</em> notan, i.e. functionally optimal for reading. In the more general sense of notan, I don't think it makes any sense to talk in terms of optimisation: notan is an aesthetic phenomenon.]</p>
