      <p>A rethink on this “protoglyph”.</p>
      <p>for some reason Proto (glyph) seems to indicate that it is the  Proto, or base of glyph. After all Protoplasm is the base form, so protoglyph is the base or clay form for a set of glyphs all based upon, or derived from this scribble.</p>
      <p>To use the term “protoglyph” Hrant has not casually tossed this word in. It is there for a reason, so ignore the picture and concentrate upon the word.</p>
      <p>Here's a term that may clear up my ramble, think about it.<br>
      - ProtoType</p>
      <p>Oho ! Something just occured to me. Left of normal thinking but not inconceivable. With a more complex “protoglyph”, it would be possible to have a font of one (1) glyph, where all characters are taken from using mathematical formula to extract from that single glyph all information to make and display each and every other glyph imaginable.<br>
      Alternately that single glyph cell could be made up of a grid of unconnected points where using same system as before, all characters and glyphs could be determined from.</p>
      <p>Wow, imagine it, all font files would be tiny in size.</p>
