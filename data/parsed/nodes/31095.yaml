      <p>In drawing in the art sense, there is what is known as gesture drawing as in some of Mattisse's work where a quick knowing and skilled hand could, in a few flowing lines, convey an image of a human figure. There is also "tight drawing" like Durer who slowly built up the image with great deliberation. The constructivists and de Stijl artists also were deliberate and "constructed" their work (well duh-ah:-). Both of these styles are still drawing but perhaps Hrant might call gesture drawing chirography.</p>
      <p>ChrisL</p>
