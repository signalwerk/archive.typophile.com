      <p>OK, now that the wonderful brain-dumping has gone dormant I think it's safe to reveal what <cite>I</cite> was thinking, even though it's pretty boring compared to the previous flotsam and jetsam of the human psyche...</p>
      <p>Not too long ago, in a thread as close as a few clicks away, there was (yet another) "discussion" about chirography and its [de]merits. I had made a distinction between painting and drawing, claiming that the former forms the bodies of shapes (and hence can't make ideal notan) while the latter forms the boundaries of shapes (hence has a qualitatively better chance). Well, looking that that protoglyph (which I still think is a useful term) it struck me that you can actually draw a boundary chirographically! Which is not to say it's practical and fruitful to do so. One clue that it isn't is that absolutely nobody does that. And one great reason not to is that the topology of the glyph (in fact that 8 - yes, all I was seeing was a boring numeral) might make it non-sensical, since you can't have crossing outlines. You can make an "o" for example, but to make a decent "x" you'd need to go around in a contortive way (although what else is new about chirography :-). Anyway, even though I think it's unworkable it might still result in interesting experiments and extrapolations, so have fun with the idea if you like.</p>
      <p>hhp</p>
