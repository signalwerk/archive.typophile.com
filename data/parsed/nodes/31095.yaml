      <p>"one's a genius, the other's insane..."</p>
      <p>but seriously, i am trying to figure out what a "protoglyph" is. a glyph is a symbol with meaning, of course, according to our very own typowiki. and proto- is a prefix meaning first, earliest, or original. furthermore, in combination with other words, it means - more or less - a foundation or basis for things which come after it or develop from it. e.g., prototype, protolanguage, etc.</p>
      <p>are you thinking your inadvertant squiggle has a universality or flexibility to be the basis for a whole - ahem - "set" of glyphs?</p>
      <p>jarrod</p>
