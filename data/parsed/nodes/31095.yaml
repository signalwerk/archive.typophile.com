      <p>I think the distinction you're sketching here is the same as (or at least analogous to) the dichotomy between "linear" and "painterly"  theorized by one of the "founding fathers" of the discipline of art history, Heinrich Wölfflin. </p>
      <p>And even before Wölfflin, there are theories of art coming out of Italy that distinguish <em>disegno</em> ("design" or "drawing," epitomized by Florentines like Michelangelo) from <em>colorito</em> ("colorism," epitomized by Venetians like Titian). The term "disegno" in particular is often left in the Italian because "drawing" doesn't entirely capture the additional meanings of composition, limitation, demarcation, etc.</p>
      <p>So maybe you've been "disegning"? :-)</p>
    html_clean: |-
