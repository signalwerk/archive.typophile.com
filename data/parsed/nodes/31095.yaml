      <p>I knew it would have to do with an [anti]chirographic stance in some way! Ha! </p>
      <p>I don't know how mindbendingly obvious this is to anybody but just in case it isn't... <cite> ...draw a boundary chirographically! One clue that it isn’t is that absolutely nobody does that. </cite> You can of course do 'chirographic' work with two pencils bound together. And you are working in the 'boundries' in that case. And likewise you can do faux chirographic work on a napkin by drawing the seemingly 'chirographic' forms out using a non-chirographic method. But Hrant, your example doesn't seem chirographic to me in any way at all. There is no sense of a front moving. And the while the lines are drawn it is their seen relationship and/or their drawn relationship that might make the form 'chirographic'. Still, I can imagine a process where you start out with two pencils to experiment and end up tweaking those forms with an eraser and pencil on your way to a typographic form you wanted. Have I misunderstood you? What process do you have in mind?</p>
