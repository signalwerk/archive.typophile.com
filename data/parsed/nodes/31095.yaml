      <p>If I may attempt to moderate:</p>
      <p>I think it is possible to acknowledge Michael's point that writing outlines of letters, i.e. suggesting structures by visualising the edges of stems instead of stroking them, is an old method that is familiar to anyone who has studied formal lettering. At the same time, within the varieties of forms producible by this method, there are distinctions to be made, as in stroked letters, between formal, constructed letters and informal, cursive letters, and Hrant is talking about the latter. Now, given that distinction, which requires one to look at how a thing is made as well as what it looks like, I'd say that Peter's Helmut Salden example, despite its flamboyance, is actually an example of the formal, constructed letter and hence, as Michael, says exactly the same sort of beast as the traditional versal letter. Okano's Quintet, on the other hand, is clearly distinct in that the outline is cursive. I do think Hrant is getting a little over excited, but that's his wont. :)</p>
