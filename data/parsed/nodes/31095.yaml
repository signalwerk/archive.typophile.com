      <p>Liminography !<br>
      <a href="http://en.wikipedia.org/wiki/Liminality" title="http://en.wikipedia.org/wiki/Liminality">http://en.wikipedia.org/wiki/Liminality</a></p>
      <p>From the wikipedia </p>
      <p><cite>"Liminality (from the Latin word līmen, meaning "a threshold") is the quality of the second stage of a ritual in the theories of Arnold van Gennep, Victor Turner, and others. In these theories, a ritual, especially a rite of passage, involves some change to the participants, especially their social status.<br>
      The liminal state is characterized by ambiguity, openness, and indeterminacy. One's sense of identity dissolves to some extent, bringing about disorientation. Liminality is a period of transition, during which your normal limits to thought, self-understanding, and behavior are relaxed, opening the way to something new.<br>
      People, places, or things may not complete a transition, or a transition between two states may not be fully possible. Those who remain in a state between two other states may become permanently liminal." </cite></p>
      <p>I am suggesting this because the process I am seeing &amp; hearing you think about seems all about process, looking for new methods as in 'technique', but also of thought, and is also concerned with both white and black in terms of their relation or threshold rather than in terms of themselves. And 'liminal' is already a solid academic term. So ya got that cred built right in.</p>
      <p>Happy?</p>
