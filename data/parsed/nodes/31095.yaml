      <p>Discussing this with Eben I realized that some key elaborations might help this idea along. First there's the issue of: what's the difference between this and drawing? I would say that drawing is slow, iterative, vague and deliberate, while this exhibits a true chirographic essence in its flow and certainty. As for the difference between conventional chirography and this, perhaps the best thing I can point to is the way stroke contrast is distributed: in chirography it results from the nature of the [virtual] tool, while in this method it results from an abstract decision on the part of the maker; if you look at that protoglyph, any part of it (I mean the black/body) can be any thickness*, determined only by the "whim" of the designer - something it shares with drawing. But again, it's different than drawing because the organicity of chirography is there. I dunno, does that help?</p>
      <p>* Specifically in my proto-8 the left of the head loop and the base of the bottom loop are heaviest, which is not something natural to conventional chirography. Now, this weighting was not intentional, but it could (and -probably- should) be.</p>
      <p>hhp</p>
