      <p>Well, this thing is chiroliminographic, but that's a pretty exotic subset of liminography. Liminography is basically when you make the black-white border the design constraint. In contrast, chirography is when you make the black body the design constraint.</p>
      <p>Now, you might say that we necessarily make the black-white border no matter what we're thinking, but that's a mechanical issue; the ideological issue is what you believe as being important - your *intent* (and that *does* affect the results). The more you believe notan is important, the more you approach liminography (and I contest, better readability); the more you believe that something like the Moving Front is important the more you approach chirography (which I contest is an arbitrary constraint, so anti-design).</p>
      <p>--</p>
      <p>This "8" is made by hand, but it does not favor the black (which necessarily comes at the expense of optimal* notan). On the other hand, because it's "spontaneous" instead of deliberative &amp; iterative this method can't really result in a proper text font; it's really just an interesting display font philosophy. The "normal" way to make an optimal* text font remains the equivalent of a refrigerator making ice!</p>
      <p>* Not the same thing as "prefect", or even "ideal".</p>
      <p>hhp</p>
