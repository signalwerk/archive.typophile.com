      <p>@Thomas: <em>That category has been getting applied to many typefaces, apparently the distinction being that they are *only* available in digital form, and were not phototype or metal typefaces.</em></p>
      <p>People!<br>
      You’ve got the wrong end of the stick, from Thomas.<br>
      The Wiki page in question lists digital revivals of pre-digital type designs (with the odd mistake, such as Minion).<br>
      The idea is that digital revivals are virtual versions of metal/photocomp typefaces.<br>
      That is, if not misleading, shallow.<br>
      For instance, consider three of my faces:</p>
      <p>1. Scotch Modern. Even though this is a digital revival, it is not a virtual typeface, because the outlines do not look like metal type—rather they look like typography done with metal type, including the artefact of press gain. So, although the fonts are not virtual, they can be used to create virtual facsimiles of old letterpress documents. The distinction is between type and typography, which this “virtual is a digital revival” concept does not address. ITC Bodoni, virtual; digital Bauer Bodoni, certainly not.</p>
      <p>2. Handsome Pro. An original design, and hence not “virtual”? Surely, if any category of digital fonts deserves to be termed virtual, it is those OpenType scripts, with ligatures and ﬂourishes, the express purpose of which is to imitate handwriting and/or hand lettering.</p>
      <p>3. Brown Gothic. As an original design, this would not be considered a virtual font or typeface. Nonetheless, it has been designed speciﬁcally to imitate, when printed by offset lithography, the effect of letterpress printing. I would say that’s highly virtual.</p>
