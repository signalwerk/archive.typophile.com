      <p>Thomas, as far as I can tell, Charles and Chris are not using the word typeface in the same way. Chris is using typeface to mean type family, while Charles appears to agree with me that a typeface is one part of a type family. The definition that he cites from the Chicago glossary of typesetting terms is pretty much identical to my usage.</p>
      <p>[That definition is from 1994, so I take its reference to multiple sizes to imply scalable type. In discussing metal type, I expect there are people who don't treat size as a constituting individual typefaces, i.e. who would consider 9pt Fubar Italic and 10pt Fubar Italic to be a single typeface, but I think that usage is influenced by pantographic production in which different sizes are closely related designs. If one looks at older types, and at things like Koch's Neuland, in which the individual sizes are quite distinctive and may even involve different letter shapes -- consider the variation of the shape of Q in Caslon's different sizes of text type -- it quickly becomes obvious that a generalised definition shouldn't treat different sizes as a single typeface.]<br>
      _____</p>
      <p>I'm interested in terminology that enables one to talk precisely about phenomena. The use of typeface to mean typeface family and font to mean individual typeface, while common -- as your survey revealed --, strikes me simply as hopelessly inadequate to actually talk about the phenomena of typeface designs, their organisation in families and their instantiation in specific technologies.</p>
