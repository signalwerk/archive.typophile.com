      <p>This seems to me one of the better things I have read on this subject, from Yves Peters' FontShop article <a rel="nofollow">'Styles, Weights, Widths — It’s All in the (Type) Family '</a>. The article recognises the variance in usage, and how such variance evolved as type technology changed.</p>
      <blockquote><p>A type family is a collection of related typefaces which share common design traits and a common name. A type style means any given variant of this coordinated design and is the equivalent of a typeface. Just like with the typeface/font debate we understand that some divisions have become blurred. This explains why the term typeface is not only used to specify a single style, but also quite often a type family with a number of weights and styles.</p></blockquote>
      <p>I wonder if the typeface = individual style usage is more prevelant in Europe, and the typeface = family usage in North America?</p>
