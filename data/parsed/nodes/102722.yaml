      <p>Thanks, Thomas. So you would consider this definition, cited by Charles from the <em>Glossary of Typesetting Terms</em> in the Chicago Guides to Writing, Editing, and Publishing series to be categorically incorrect, yes?</p>
      <blockquote><p>Typeface: One of the variations or styles in a type family.</p></blockquote>
      <p>_____</p>
      <p>It seems to me that what we have is two -- hopefully not more than two, at least in broad terms -- different categorisation and labeling systems, both with some historical and conventional usage, but quite probably neither entirely systematically codified (in this, type nomenclature is similar to type design classification, but perhaps not so inherently unsolveable).</p>
      <p>I'm beginning to see how the terminology Thomas favours can be made to cover the phenomena, especially if one includes Craig's 'typeface styles' as a label for what I term typefaces. If one can map labels to phenomena, then one can also map labels to labels, across different terminological systems. This might be a worthwhile exercise, as it would reveal the weak points or holes in either system relative to the described phenomena.<br>
      _____</p>
      <p>Craig, the Brill blurb you cite is using the term 'typeface' as I previously described, as what I consider a synecdoche. It's a marketing text, not a technical document. If I'd written it, I would have likely phrased it thus:</p>
      <blockquote><p>After careful consideration, Brill has taken the initiative of producing a family of typefaces.</p></blockquote>
      <p>But then I'm often more precise than I need to be for the given purpose.</p>
