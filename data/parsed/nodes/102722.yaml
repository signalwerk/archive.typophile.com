      <p>Categorization often bogs down in a face-off between historico-cultural considerations (phylogenetics) and empirical description of physical features and mechancis (taxonomy).</p>
      <p>In this case, John is arguing for the precision of taxonomy.<br>
      That can be problematic, as words don’t have accurate meanings (This and That being the only strictly logical words)—or often even a single meaning.</p>
      <p>I lean more towards phylogenetics.</p>
      <p>From my perspective as a digital typographer, it seems clear that the professional ecology of typography is based on the style-linked RIBBI family of fonts, going under the family name which is the typeface name, and that is how one uses fonts in a layout—with Bold and Italic variants of the Regular default for emphasis and contrast. This named-family system of font organization evolved in the early 20th century, long before Microsoft and the Web.</p>
      <p>From my perspective as a type designer, I conceive of type families as a whole, applying the collection of design vocabulary treatments, which constitute the personality of a typeface, across the various styles in the family.</p>
      <p>The vocabulary which constitutes a typeface is comprised of feature treatments such as x-height, serif style, amount of contrast, etc.—things which the PANOSE system quantiﬁes.</p>
      <p>It is the uniqueness of this vocabulary which creates the virtual concept that people can hold in their heads and use to recognize and identify a unifying principle or “look” in a type family, which transcends the individual fonts, and that is why the <em>fons et origo</em> of a type family needs to be identiﬁed and honored as the Typeface.</p>
