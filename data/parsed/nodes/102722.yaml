      <p>Maybe it will help if I parse your Univers example.</p>
      <p><em>In the context of metal, I define Univers—all sizes, all styles—as a typeface. Nine point Univers 45 light is a font. Do you agree?</em></p>
      <p>Univers is a typeface family.</p>
      <p>Univers 45 light 9pt is a typeface, i.e. it is an individually homogeneous design component of the Univers typeface family. [We're talking about metal here, so individual sizes also constitute separate typefaces because they are individually homogenous designs.]</p>
      <p>A font is any technological instantiation of that typeface. In the case of foundry type, this will usually be regarded as a single case of type with all the characters needed to set text in that typeface, i.e. in that style and size. If someone is working with more languages than are supported by a single case, they might have more than one font for the single typeface. In the case of hot metal type, the font will be a set of brass matrices, and again they might have more than one depending on the extent of their character needs.</p>
      <p>That a single typeface might require more than one font in a particular technology in order to meet the functional needs of the typesetter should alert one to the disadvantage of saying 'Nine point Univers 45 light is a font'. Such usage provides you with no way to discuss technological particularities. Note also that if you talk with letterpress typesetters, they will not say 'I have the 9pt Univers 45 font'; they will say 'I have a font of 9pt Univers 45', by which they mean they have a case of that typeface.</p>
