      <p>Note that the LaTeX use is virtual <em>font</em>, not virtual typeface. As I understand Tom's original post, the search is for a term that denotes types originally designed for digital media, as distinct from say those that are digital font revivals or otherwise versions of types originally designed for metal etc.</p>
      <p>BTW, your example of a LaTeX virtual font corresponds to what is now often referred to generically as a composite font, i.e. a combination of two or more fonts appearing to applications as if a single font, allowing mixing of glyphs from these different component fonts to represent specific characters. The ISO/IEC 14496-28:2012 standard defines a Composite Font Representation, which is a kind of XML wrapper identifying the component fonts and to which characters they apply.</p>
