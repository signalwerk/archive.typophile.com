      <p>The word <em>virtual</em> has been abused often in context with what people describe as <em>the digital world</em>. If there is anything virtual about something digital, it is our boundaries of imagination.</p>
      <p><em>Virtual</em> refers to something unreal, emulated, because it isn’t physical. If only physical things are real, every imagination would be consequently unreal, so I think we can safely say this is not the case with digital fonts or typefaces. Not to mention every computer operation, every mathematical description and every logical explanation, they all would need to be called <em>virtual reality</em>.</p>
      <p>I also suspect that <em>digital</em> in itself is an artificial construct. We use the terms <em>digital</em> and <em>analog</em> in this transitional phase for orientation, because we want to distinguish, we want to differentiate. But in reality, the virtualization of products began thousands of years ago, throughout the entire course of the development of civilization.</p>
      <p>Good examples are currencies and associated values.</p>
      <p>You hear <em>virtual reality</em>, <em>cyberspace</em> and <em>digital</em> all in the same context, when politicians, journalists, book authors and media refer to everything that was made with the help of computers. It appears to me like a new age of mystery label, where everything that breaks out of rational explanations based on products of the past gets a <em>magical</em> label. It is a new dimension, unlike our vintage objects of the past, therefore it must be <em>virtual</em>.</p>
      <p>But I doubt that typefaces are any more virtual today, than they ever were in the age of Gutenberg or the Linotype letterpress. If virtual applies, it should be used for the combinations of letters forming words that tell a story. The thoughts they evoke are virtual in every sense of reality perception. </p>
      <p><em>Virtual</em> is a superfluous, artificial construct that fails to describe the difference of a <em>digital glyph</em> in comparison to, say, one made of metal or wood.</p>
