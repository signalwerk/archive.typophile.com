      <p>I will continue to use Typeface to describe what I design, which is the coherent set of design ideas which are implemented in a font family, even if that family only has one member.</p>
      <p>Richler, for instance, is a typeface, not ﬁve typefaces.</p>
      <p>A symphony, in comparison, is not a movement family.<br>
      A novel is not a chapter family.<br>
      A tennis match is not a set family.<br>
      A dinner is not a course family.<br>
      And so on.</p>
      <p>And for good measure, a font is not a glyph family.</p>
