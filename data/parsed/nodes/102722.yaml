  html: |-
    <p>Hey guys,</p>
    <p>So, somebody on Wikipedia has been fairly successfully propagating the label "virtual typefaces" for what I would call digital typefaces or digital fonts. That category has been getting applied to many typefaces, apparently the distinction being that they are *only* available in digital form, and were not phototype or metal typefaces.</p>
    <p>So, two related questions:</p>
    <p>1) I might argue that every typeface that is available in digital form should also get the same label (whatever that label is). Agree or disagree?</p>
    <p>2) I think the label "virtual typeface" is silly. Nobody uses that term that I am aware of, except this one person. The actual link redirects to "computer font." Some possible labels:</p>
    <ul>
    <li>Computer typeface</li>
    <li>Digital typeface</li>
    <li>Virtual typeface</li>
    </ul>
    <p>For the category label, "font" does not work so well because we are indeed talking about "typefaces" (the entire family).</p>
    <p>What do you prefer?</p>
    <p>Personally, I prefer "digital" over "computer" because these fonts are used on many devices that are not thought of as computers, even if they do have computer chips inside them.</p>
