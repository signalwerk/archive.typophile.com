      <p>Chris: <em>To date, my understanding has been Typeface = an entire family. Font = a specific size. </em></p>
      <p>Nooooooooo. A typeface is an individual design style, so that would be not an entire family but the individual roman, italic, bold, etc. designs. A font is a functional implementation of a typeface <em>or some part of a typeface</em> for a given technology. Hence, a font of metal foundry type would be a tray of sorts in a particular style/weight combination, its functionality determined by the set of languages it can cover. So a single typeface, e.g. Fubar Roman, might be spread across multiple fonts if it happened to support more characters than a single composing tray could hold and had extensions for 'exotics'. You are right that a font, in the context of metal type, would be a specific size, but it is a specific size of a specific style design: a font is not a specific size of an entire family. A family is either a typeface family or a font family, depending whether you are talking about a set of related designs or a collection of fonts.</p>
      <p>What I like about this use of the terminology is that it is technologically independent. The notion of a typeface as described and the notion of a font map neatly to various typesetting technologies and attendant font formats, even though the referants for the word 'font' change and the elements of a typeface that can be captured by an individual font varies for different technologies.</p>
