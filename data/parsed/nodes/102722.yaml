      <p>That’s all very well John, but few people, professional or amateur, are going to agree with you that Caslon Regular and Caslon Bold are different typefaces. </p>
      <p>I have always referred to my font families as typefaces.<br>
      As far as I’m concerned, that <strong>is</strong> careful analytical terminology.</p>
      <p>I would even go so far as to say that Karloff is a typeface, because if it’s not, how can the singular principle that created and unites its family members be otherwise described? Is it a clan of families?</p>
      <p><em>…the disadvantage of saying 'Nine point Univers 45 light is a font'. Such usage provides you with no way to discuss technological particularities.</em></p>
      <p>Nine point Univers 45 Light (metal) is indeed not a font.<br>
      But Univers 45 Light (digital) is, and that doesn’t discount variations such as language encoding or Pro/Standard.<br>
      The default is assumed to be digital, with a minimal Latin script encoding, so there’s no need to mention that.</p>
