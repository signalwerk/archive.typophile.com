      <p>I think it's better to leave the word "virtual" in strictly the sense as that in LaTeX.</p>
      <p>Say, assume that I somehow hacked libfreetype and libfontconfig to let my programs use a typeface named "Hybrid", which is just Times New Roman except an alternative /g/. Programs requesting for glyphs in "Hybrid" will get every glyph except /g/ from Times new Roman but will get a /g/ from another source. That "Hybrid" font will deserve the name of a "virtual" font, because it doesn't actually exist in my hard disk (if it would, I will be violating the EULA of Times New Roman).</p>
      <p>Other uses of this term will cause confusion. Why not just digital or "digital-only"?</p>
