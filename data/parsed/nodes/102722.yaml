      <p>Chris: <em>In the context of metal, I define Univers—all sizes, all styles—as a typeface. Nine point Univers 45 light is a font. Do you agree?</em></p>
      <p>No. I thought I'd been pretty clear: the term typeface does not refer to a family, it refers to one stylistically homogeneous component of that family, e.g. the roman design or the italic design or a particular weight. Univers is not a typeface, it is a family of typefaces.</p>
      <p>Now, I fully accept that many people -- me included -- use the term typeface in a general and imprecise way to refer to a typeface family, but this is a form of synecdoche -- <em>pars pro toto</em> --, or simply abveviation. So, for instance, one says commonly that 'I admire the design of the Univers typeface', when what one probably means is that one admires the design of the whole family.</p>
      <p>But the more precise use is important because one sometimes wants to talk about the individual members of a typeface family, i.e. to talk about the individual typefaces.</p>
      <p>A font is always a technical instantiation of a typeface, part of a typeface or, in the case of MM fonts for instance, more than one typeface. I think this is the fundamental concept to bear in mind when using the word font: it refers to a functional thing within the context of a given technology, not to a design, and that thing may be a tray of metal sorts, a case of brass matrices, a film strip or glass disk, or a computer binary file (or files in the case of e.g. PS Type 1 fonts). It is the functionality of the thing that defines its 'fontiness'.<br>
      _____</p>
      <p>PS. I have no doubt that, when you return to your library, you will find numerous citations to contradict my definitions, and to contradict each other. You will also find many, many sources that use the word 'character' to refer to what we now tend to call 'glyphs'. Over the past twenty years some of us who have worked in font development have found a need, unsurprisingly, to be able to talk precisely and unambiguously about the things we have to deal with on a daily basis. That has meant introducing distinctions that didn't used to exist, or to clarify and be more consistent in our use of existing distinctions. There is no way to talk clearly about the ins-and-outs of text encoding and text display without a distinction between character and glyph. Likewise, there's a professional usefulness in clearly distinguishing between typefaces and fonts, although most people in common usage do not.</p>
