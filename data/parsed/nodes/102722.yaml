      <p>I agree, Michel, but I'm trying to make sense of the criteria by which the usage of 'typeface' that Thomas and others favours can be considered general and predictable. If it doesn't refer to everything gathered under a single name, then on what basis are divisions made into what, I suppose, must be called 'sub-typefaces'?</p>
      <p>Bear in mind that it would be nice if the generic terminology of type were not something that only worked in the context of Latin script, so simply saying something like 'presence or absence of serifs' is not an adequate description of sub-typeface division: it is necessary to describe the <em>kind</em> of division that such a difference constitutes, so that we can identify functional parallels.</p>
