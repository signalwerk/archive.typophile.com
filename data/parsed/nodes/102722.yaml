      <p>@John Hudson: I in no way refuting or discounting your knowledge, skill, and experience. Quite the contrary. You are significantly more specialized and experienced than I in this field. And most other Typophiles for that matter.</p>
      <blockquote><p>“I am a primary source“</p></blockquote>
      <p>To the best of my knowledge, you would have to be the originator of those terms to be a primary source. If you heard or read them somewhere and they are unavailable for reference, that would make you a secondary or indirect source, but a source none the less. A formal APA example:</p>
      <p>————<br>
      <em>A font is any technological instantiation of that typeface. In the case of foundry type, this will usually be regarded as a single case of type with all the characters needed to set text in that typeface, i.e. in that style and size. If someone is working with more languages than are supported by a single case, they might have more than one font for the single typeface. In the case of hot metal type, the font will be a set of brass matrices, and again they might have more than one depending on the extent of their character needs.</em></p>
      <p><em>That a single typeface might require more than one font in a particular technology in order to meet the functional needs of the typesetter should alert one to the disadvantage of saying 'Nine point Univers 45 light is a font'. Such usage provides you with no way to discuss technological particularities. Note also that if you talk with letterpress typesetters, they will not say 'I have the 9pt Univers 45 font'; they will say 'I have a font of 9pt Univers 45', by which they mean they have a case of that typeface</em>.” (Hudson, J. 2013).</p>
      <p>Hudson, J. (2013, May 06). Re: Better term for "Virtual Typefaces"? Wikipedia category [Online forum comment]. Retrieved from <a href="http://typophile.com/node/102722" title="http://typophile.com/node/102722">http://typophile.com/node/102722</a><br>
      ————</p>
      <p>However,</p>
      <blockquote><p>We've been at this a long time, <strong>and have developed working definitions</strong> that enable us to talk clearly about the work we do.</p></blockquote>
      <p>If this is the case, perhaps we are indeed in the midst of (re)defining these terms. Which is quite likely given the multitude changing technologies, and quite exciting too. I am fully aware of the phenomenon of <a href="http://en.wikipedia.org/wiki/Biolinguistics" rel="nofollow">biolinguistics</a> and it has to start somewhere. </p>
