      <p>Yes, I saw those, but they simply don't make any sense to me. Saying that the definition of a 'single typeface' is 'a family of one or more styles' just means that you've made the terms 'typeface' and 'typeface family' synonymous. That doesn't seem useful. And your question didn't provide the option 'It is a single style within a typeface family', so that thought, which seems the most obvious definition to me, wasn't presented to respondents to consider.</p>
      <p>People will doubtless draw different conclusions from your data, but I'm afraid what conclude is that a) a lot of people have not thought about this very systematically, and b) the survey could have been better designed. </p>
      <p>Question 4 employs the phrase 'a single face/style of a font family'.  In this phrase 'face' -- which I presume corresponds to 'typeface' and not to some other kind of face -- is equated to a single style, which is my own usage.</p>
      <p>____</p>
      <p>I've got nothing against sloppy language in any informal context. I'll regularly refer, <em>pars pro toto,</em> to 'type' or 'typeface' when I mean a type family -- e.g. 'Neuland is a great display type' --, just like most other folks do in casual conversation, but I'm aware that in such a situation I am employing a synecdoche, not a careful analytical terminology. If one wants to be able to accurately describe a complex of phenomena then one needs a systematic terminology that enables distinction of those phenomena.</p>
