      <p>I agree that the notion that a typeface only available in digital form isn't a "real" typeface is not sensible. Now, if somehow the only fonts in which it were available had some kind of DRM code in them, so that they could only be displayed and never printed...</p>
      <p>But at one time, I coined a similar phrase. A manual for a computer text processing program assigned some EBCDIC codes to overprinted characters on a particular line printer. Since those characters didn't actually correspond to type slugs, I proposed to call this extended character set a "virtual character set".</p>
      <p>By focusing on the means of production instead of the end product, I perhaps made the same mistake as they did here.</p>
