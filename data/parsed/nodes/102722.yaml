      <p>Thomas: <em>at least we are all pretty much agreed that a “font” is a single style</em></p>
      <p>Because a font is an instantiation of a typeface in a particular technology, the relationship of font to typeface is determined by the nature of that technology. It is very often the case that typesetting technologies have instantiated typeface designs such that each font corresponds to a single typeface style. But that isn't a terminological determination. If you bought a set of Linotype matrices in which the roman and italic designs were duplexed, you were buying a single font that instantiated two styles. If you bought a license for a Type 1 roman Western European ANSI set, a CE roman, and an expert set for roman ligatures and oldstyle figures, you were getting three fonts that instantiated a single typeface style (and to further confuse the matter, each font consisted of multiple computer files and may have included both a printer font and a screen font).</p>
    html_clean: |-
