      <p>Nick: <em>...few people, professional or amateur, are going to agree with you that Caslon Regular and Caslon Bold are different typefaces</em></p>
      <p>You may be right, but then I don't require people to agree.</p>
      <p>I would say that Caslon Regular and Caslon Bold are coordinated designs, which together are part of a family. A family of what? Of typeface designs, each design constituting an individual typeface. A typeface, in my reckoning, is the design of a set of character representations (glyphs in modern parlance) in a single weight and style, because although other weights and styles might be coordinated with it, <strong>it also stands alone</strong>. If we want to talk about coordinated typeface designs, we can talk about families; if we want to talk groupings of e.g. larger functional sets, we can talk about typeface superfamilies or typeface systems. But families, superfamilies and systems are all made up of component designs that also stand alone. You don't need all the parts of the Caslon family in order to have a usable Caslon typeface. What do we call those things that stand alone if not typefaces (and presuming that we're reserving the word font for technical instantiations, not for designs)?</p>
    html_clean: |-
