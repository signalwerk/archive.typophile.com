      <p>Somewhere into here, what you are asking for, John, will confront the same problems as classification in general. There are cases that get pretty fuzzy. This is not a horrible limitation in using the term “typeface” in that way, of course; even if you disagree with the usage some of us are proposing, I think you agree that there needs to be some term or phrase oocupying that same definitional space, right?</p>
      <p>Computer Modern, like Thesis, is a kind of meta-family or meta-typeface. I agree that at least some of its members seem like distinct typefaces. But as one can blend and morph between the various fonts and styles of Computer Modern, there will inevitably be grey areas with such a meta-family. I can think of other examples that are similarly troubling: Rotis, or Penumbra.</p>
      <p>So in any case, no, I do not think that a collection of designs marketed under a single trademark directly defines a typeface (although at least 95% of the time it will be synonymous). Such a definition would in some cases get one in trouble. For example, Caslon Antique is definitely not a member of any broader Caslon family.</p>
