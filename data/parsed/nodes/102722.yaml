      <p>John, no, differences in sizes wasn't particularly a reference to scalable type. We were including metal type, and remember, with photocomp, there could be different masters, an 8-point, a 12-point, an 18-point, all for the same type family. We were talking about differences in *design.*</p>
      <p>But the point that the <cite>Glossary</cite> is from a time before PostScript is relevant, partly technical, particularly in a legal/sales context. Take "font protection": A font would only work on one brand of machine, sometimes only one individual machine. Linotron 202 fonts took advantage of a chip in the typesetting machine, so if you bought a new 202, you couldn't just load your old fonts into the new machine. Some similarities to PostScript fonts there, but I doubt the notion of copyright was the same. </p>
      <p>Anyway, back to scaling type -- any number of books composed in hot metal were scaled in printing. People forget that the metal type was good for only about 5-7 thousand impressions. You don't print a best-selling author from the type as set, you make stereo plates, or pull repro and print offset. With repro &amp; the subsequent camera work, you can scale. I doubt, for example, my first edition of Rex Stout's <cite>The Doorbell Rang</cite> was really set to a 21 pica, nine point measure. From the look of it, probably set to 2o picas &amp; shot up a bit.</p>
