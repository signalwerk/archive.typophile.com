      <p>Well, I hate to contradict a primary source who knows more about this sort of stuff than I do, but I tended to think of a typeface as an entity that has a (simple) name - like "Baskerville" or "Times Roman". That includes different sizes and weights. A font, on the other hand, is a computer file, a package of little lead-antimony thingies, or a round film negative. As for 9 point Times Roman Bold, we have no good and unambiguous name for that.</p>
      <p>However, given there are cases where the italic and the Roman of a typeface haven't really been designed to match each other - and other cases where the companion has a different name (Bembo, for example) - saying that the bold and italic are separate typefaces is something I'm OK with too.</p>
      <p>But <em>the point size</em>?</p>
      <p>Actually, that makes sense too - at least, if the shape is not invariant with size, but instead the letters are optically compensated - 6 point Century Expanded is considerably wider, in proportion to its height, than 18 point Century Expanded, for example, if you look at the ATF hot metal catalog, and the same was true for most foundry types and most Monotype types in the old days.</p>
      <p>But I don't think it's common usage.</p>
      <p>Instead, if one says 11 point Times Roman with long descenders, one is giving a <em>type specification</em>, if anything.</p>
      <p>Using type family for the typeface name, and typeface for the spec, has its attractions, but I think that "type family" was a phrase used only by one typefounder that never really caught on with everybody else.</p>
