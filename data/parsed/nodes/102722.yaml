      <p>In my opinion, adopting the term “virtual” not only requires a contextual re-definition of the term, but opens up a can of worms to the tune of needing to back-label every other typeface in the world based upon its original material design. Not to mention how to deal with ones that were made in different materials at the same time. Too many combinations. </p>
      <p>Prediction: Instead of being called “virtual typefaces” (by one-eyed technophiles with a desire to label all things new) the term will disappear within two years, and what are now being called “virtual typefaces” will be called what they are. Typefaces that only exist in a digital form (or a similar phrase that is a simple and accurate). Ore better yet, what they have always been called. Typefaces. I believe the term “virtual typeface” will eventually be seen as a fad buzz-word, the way we now view the term “<a href="http://en.wikipedia.org/wiki/Information_superhighway" rel="nofollow">information superhighway</a>.”</p>
