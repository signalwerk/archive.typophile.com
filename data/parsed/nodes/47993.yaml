    html: |-
      <p>Well said. I think in the end I don’t mind giving rope even if the requester may be constructing a self hanging. I suspect very few have passed as a result of rough page design. I hope I’ve learned a thing or two by asking a question that revealed a lapse on my part.</p>
      <p>You point out a few obvious clues that suggest the attempt at typography is not fully informed. Still, we can look at the origins of modern psychotherapy and create a very general historical frame—any font directly associated with a time that predates psychotherapy could be crossed off the list. What margins? Well, let’s assume enough for a thumb at the outside and enough inside that the text doesn’t get consumed by the binding. Given that, and the limited set of typefaces willow1 has to choose from, it would seem that there are very few fonts capable of setting a reasonable number of characters in widest possible measure.</p>
      <p>Maybe if we provide as reasonable an answer as possible the asker might take away a better understanding of the task at hand, or even decide to hire a professional?</p>
