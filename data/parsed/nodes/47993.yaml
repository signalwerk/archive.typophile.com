      <p><cite>Yes- there are many Kepler subsets.</cite></p>
      <p>Should be more than enough to cover your bases. Not knowing your margins, and being purely speculative I would be sure to look at the semi-condensed.</p>
      <p><cite>Do you like it? What size would you recommend?<br>
      Do you think a leader of 15 is good?</cite></p>
      <p>Fifteen point could be a little airy. I just picked up Kepler and have not had a chance to work with it much. I would guess that having a more modern x-height you could look at a 9-10.5 pt range type size over 13 or so, again depending on your margins and grid.</p>
      <p>Kepler is a more contemporary take on a modern type that picks up some more humanistic details. It may be too colorful for what you are doing, but could also be a good choice.</p>
      <p>I would work with Adobe Garamond as well.</p>
      <p>See what works well with you measure.</p>
