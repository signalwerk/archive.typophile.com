    <p>I have written a nonfiction book aimed at psychotherapy professionals. What is the best font to use for the text body? The book size is 5.5x8.5. I currently have leading set at 15. The book is currently in Garamond Premier Pro but I am not sure I love it.</p>
    <p>Also, I need a font that has semibold, bold, italic, semibold italic, normal.</p>
    <p>I'm especially interested in fonts included in the Adobe Open Type Collection since that's what I have (in addition to all of the basic fonts included in Word). No budget to buy new fonts.</p>
    <p>I'd appreciate your suggestions - Thank you!</p>
