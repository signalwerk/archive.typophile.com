      <p>If you set it on Vista and install ATM 4.1, you can use Kepler MM, and would have access to infinite variations. It is a fabulous font -- nothing so far released is as flexible. But aesthetically it is rather a mess. The humanist affects aren't convincing and the Baskerville g is in very bad taste. </p>
      <p>A fabulous choice, very close in design, is Matthew Carter's Miller, from Font Bureau. This type virtually sets itself, and is appealing at 9 on 12 -- that's one of its sweet spots. Carter doesn't do bad taste. </p>
      <p>Another related font, which has seen extensive use in Time, is Carter's Time Caledonia. Perhaps now that Time has switched, Carter will release this font?</p>
      <p>Garamond doesn't seem the right choice for a psychotherapy manual.</p>
