      <p>What I find particularly interesting about this discussion is that a writer on psychotherapy is getting deeply involved in the typographical aspects of the the book he or she is about to design and publish. Well, there are other examples of authors making decisions about typefaces to be used for their texts (G. B. Shaw for one), but I suspect that this case reveals a more general and more contemporary tendency that springs from the array of fonts available to authors on their computers. </p>
      <p>How can you make decisions about what typeface to use without knowing more about the book itself? The author has informed us that the size of the book is 5.5x8.5 (inches). What kind of margins does he or she want? What sort of paper? The author thought that 15 point leading might be a good idea. But leading means nothing without a typesize and thus this psychotherapist reveals an entirely understandable ignorance of basic typography. Moreover, designing a book in Word might be comparable to hunting elephants with a pea-shooter.</p>
      <p>The spot-on and pertinent question by Sil concerning childhood incidents with Garamond virtually closes the discussion and really means that if you are a psychotherapist and you are writing and publishing a book you should get a typographer to design it (as David Hamuel implied). How many typographers go in for writing books on psychotherapy? </p>
      <p>A chacun son métier.</p>
