      <p>&gt; match an authentic Hebrew design to an authentic English design.</p>
      <p>Define "match".<br>
      Historically it has sadly meant formal congruence (for example matching serif structures) which simply cannot be conducive to authenticity (or functionality in a text face). See the Hebrew efforts of Gill and Schonfield for a glimpse of how bad it can get; and I really haven't seen anything much better. Alphabets aren't art; they're more like animals. And a Canaan Dog can't be happy in a three-piece suit.</p>
      <p>What you seem to be describing later in your post is encouraging however. The complication is that you need a "multilateral" system, as opposed to the sadly established approach of having one font per script, which results in either a master-slave relationship or a two-left-feet disaster!</p>
      <p>An optimal, if -I feel necessarily- complex, system would be like this:<br>
      <a href="http://themicrofoundry.com/ss_rome2.html" title="http://themicrofoundry.com/ss_rome2.html">http://themicrofoundry.com/ss_rome2.html</a></p>
