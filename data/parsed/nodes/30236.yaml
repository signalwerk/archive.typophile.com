      <p>My knowledge of the problem of matching Hebrew and Roman is way more limited than David or Israel, but for what it's worth, here's my view, just based on looking at English with companion Hebrew. I think that with roman and Hebrew fonts of even moderate contrast, the best solution is to design to keep the two scripts visually out of the way of one another. You can minimize the clash in a variety of ways, but that's about it. </p>
      <p>If you have lower contrast 'sans' style, you can more easily get harmony, as you are reducing the difference between the 'rules' for Hebrew and Roman (horizontal vs vertical stress). </p>
      <p>Also if you have smaller serifs and low contrast that can still work. I put David hebrew font and Friz Quadrata roman together in a display situation, and that was not too bad.</p>
      <p>The drawback is that the low contrast fonts for English are not so good for text, at least in my view. Is this also true for Hebrew? Are most books and newspapers in 'seriffed' fonts with noticeable contrast?</p>
      <p>At any rate, for extended bilingual text I don't really see a solution that closely mixes text. </p>
      <p>For roman-dominated extended text with occasional Hebrew, or Hebrew-dominated with occasional roman, I think Hrant is right in theory: two different specially designed solutions. It ought to be possible to do solutions such as Hrant advocates, but I haven't seen it done harmoniously either way yet, which is maybe what Israel is also concerned about. </p>
      <p>I find reversed-contrast roman fonts--even Bloesma's--ungainly, but that would be the way to go for a roman subordinate to a lot of Hebrew text. The harmony with the dominating Hebrew text would be paramount, rather than the look of the roman on its own. </p>
      <p>My impression is that there is not much English dominated with a few Hebrew words here and there. The other category seems to be more bilingual religious texts, but I may be wrong.</p>
