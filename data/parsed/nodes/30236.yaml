      <p>Where can I see the modern Hebrew font designs you created?</p>
      <p>The shva-na has a few visual forms. In Hebrew publishing which I have seen the two dots next to each other is not used. </p>
      <p>Some publishers use a short horizontal line, like a dash, positioned above the letter. This is problematic when a narrow letter, like the vov, has a shva-na.</p>
      <p>Other publishers use a small asterisk positioned above the letter.</p>
      <p>Both the meteg and shva-na are used in vocalized Hebrew texts. The meteg is used to indicate which syllable is emplasized in pronouncing that Hebrew word. </p>
      <p>The shva-na as you mentioned is to show that the shva which appears below the character is pronounced long, as joined to the sound of the letter and vowel before it, and the letter above it. According to this grammatical rule, the shva-na can not appear above the first letter of the word.</p>
