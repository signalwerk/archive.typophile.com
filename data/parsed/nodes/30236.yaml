      <p>Thank you.</p>
      <p>&gt; I think it would be very useful to add a meteg and perhaps a kamatz katan and shva na.</p>
      <p>?</p>
      <p>EVERYTHING is there:</p>
      <p>The symbol for sheva na' is two dots arranged vertically under a consonant. The "vocal sheva" (sheva na') is a brief, neutral vowel, like the first vowel in the English word.</p>
      <p>THE SAME symbol is used to represent sheva nah, and intermediate sheva (sheva meragef)</p>
      <p>The vowel kamats can be either short or long. the SAME symbol is used to indicate both sounds. In some siddurim -- Sim Shalom,  Rinat Yisrael -- a different symbol is introduced to indicate kamats katan.</p>
      <p>So, how do we know when the Kamats is short/katan  or long/gadol? with the Te'amim/ cantillation marks:  if the kamats is marked with a secondary accent --  this is kamats gadol. A kamats before dagesh hazak is Kamats katan, since the dagesh hazak closes its syllable.</p>
      <p>More grammar?   :^)</p>
      <p>You/we can get rid of  Uni 05C7 (kamats katan/short)</p>
      <p>BTW, the fonts are modern Hebrew, and not Biblical.</p>
      <p>&gt; there is no nikud under the ayin, then the alternate ayin </p>
      <p>I designed the ayin + alternate  to work perfect with nikkud, so no problem that the nikkud will touch the ayin. </p>
      <p>About the rest of your post -- try to be a little bit more regular  :)  so I don't feel that I'm talking to myself :)</p>
