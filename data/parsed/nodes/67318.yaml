    html: <p>Something like Lucida Sans may work. Lucida Sans Unicode has Greek, and there's a Lucida Math that provides mathematical symbols that harmonize with the Lucida superfamily. There's also a Lucida Sans Narrow, but it doesn't comes with the same extended glyph coverage.</p>
