    <p>Perhaps this has been covered on here before, but I couldn’t find it... or maybe it is something that is so common knowledge as to go without comment.</p>
    <p>I’m fairly new to graphic design &amp; typography (at least compared to most on here) and I have compiled a list of type foundries I like, however there are some that I have seen and liked that I never bookmarked, and now I can’t find them.</p>
    <p>I’d like to compile fairly comprehensive list of foundries (and I know there are many I don’t know about out there) that I like, and I figured it would be helpful to start one here. No foundry is too big or too small, but in the interest of simplicity, let’s not repeat listings in the thread.</p>
    <p>I’ll start with an easy one.  </p>
    <p><a class="freelinking-external" href="http://www.emigre.com">Emigre</a></p>
    <p>ok. go.</p>
