  html: |-
    <p>Hello. I'm currently designing a Australian wine label, for which the central inspiration is a building located on the vineyard. The building was built between 1852 and 1858. Just wondering what typefaces might have been popular in Australia (or I guess England) at this time?</p>
    <p>Cheers.</p>
