  html: |-
    <p>Hello,</p>
    <p>I am wondering if anyone else is unhappy with the "case" feature... (In InDesign it moves glyphs like "hyphen", "emdash" etc upward when text is marked as "All Caps" , but it doesn't work when text is directly written in caps or capitalized by selecting "Type/ Change Case".<br>
    I tried to make the case sensitivity work whenever caps are in use by including the following lookup in the "liga" feature. So it is turned on together with the liga feature.</p>
    <p>Maybe someone would like to try it or comment it.</p>
    <p>lookup liga25 {<br>
    sub @positionNormal' [@uppercaseLetters ] by @positionHigh;<br>
    sub @positionNormal' @positionNormal [@uppercaseLetters] by @positionHigh;<br>
    sub @positionNormal' @positionNormal @positionNormal [@uppercaseLetters] by @positionHigh;<br>
    sub [@uppercaseLetters @positionHigh] @positionNormal' [@uppercaseLetters @positionNormal space] by @positionHigh;<br>
    } liga25;</p>
    <p>The classes contain:</p>
    <p>@positionNormal:<br>
    parenleft, parenright, braceleft, braceright, hyphen,<br>
    exclamdown, questiondown, endash, emdash etc<br>
    IN NORMAL POSITION</p>
    <p>@positionHigh:<br>
    parenleft, parenright, braceleft, braceright, hyphen,<br>
    exclamdown, questiondown, endash, emdash etc<br>
    IN HIGH POSITION</p>
    <p>@uppercaseLetters: all the capital letters</p>
