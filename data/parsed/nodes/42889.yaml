    html: |-
      <p>The case feature is invoked with the case command (Caps) so that case specific punctuation is brought in to play with that command as well. Typing in all caps brings no command to bear in opentype since this may bring undesired effects for those not so inclined. This does hide the feature as well as [cpsp} capital spacing but I don't know how one can go about changing it.</p>
      <p>ChrisL</p>
