    html: "<p>I think John and Adam have done a pretty good job of describing the situation. <br> <br>I'll note that the PUA has two subsections, of variable and potentially overlapping size. The End User Sub-area is from E000 up, and is completely arbitrary. The Corporate Use Sub-area is filling in the PUA from the top down, and allows people and companies to define specific characters to mean whatever they like. Commonly people publish their usage of this part of the PUA, which allows for the possibility of shared stuff. <br> <br>Adobe's use of the PUA has been to use a section of the CUS (F6xx-F77xx) for certain glyphs that are fairly common across different font families, and to use the EUS for unusual or unique glyphs. <br> <br>The only reason I mention this is that *if* one is going to use the PUA, I think it is a fine idea to be aware of and make use of Adobe's CUS assignments. To do so, start at: <a href=\"http://partners.adobe.com/asn/tech/type/unicodegn.jsp\" target=\"_blank\">http://partners.adobe.com/asn/tech/type/unicodegn.jsp</a> <br> <br>However, I won't argue with Adam and John's reasons for not wanting to put EUS codepoints in fonts in the first place. If we were starting from scratch, I expect we'd not take the same path ourselves. Of course, these days, there are a lot more and more popular OpenType aware applications than there were when we had to make the decision. <br> <br>Cheers, <br> <br>T</p>"
