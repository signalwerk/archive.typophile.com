  html: <p>I'd like to know if we (already?) have a sort of standard, when designing an Opentype script (or not) typeface, for alternate characters, and for opening and closing version of glyphs. <br> <br>I've opened my copy of Akira Kobayashi's Calcite from Adobe and I've seen normal alternates are named along the line of a.alt, b.alt2, etc. and ligatures are (as explained in FontLab's manual) indicated with f_f_l, s_t, etc. but I've not found out if a naming standard exists for opening versions, swashes, closing versions, different alternates, etc. <br> <br>Besides, I've seen Calcite's alternates and ligatures seem to have an Unicode value. Which criteria has been used to assign, it since these letters are not basic letters of a certain language/script? <br> <br>Many thanks in advance to anyone.</p>
  html_clean: <p>I'd like to know if we (already?) have a sort of standard, when designing an Opentype script (or not) typeface, for alternate characters, and for opening and closing version of glyphs. <br> <br>I've opened my copy of Akira Kobayashi's Calcite from Adobe and I've seen normal alternates are named along the line of a.alt, b.alt2, etc. and ligatures are (as explained in FontLab's manual) indicated with f_f_l, s_t, etc. but I've not found out if a naming standard exists for opening versions, swashes, closing versions, different alternates, etc. <br> <br>Besides, I've seen Calcite's alternates and ligatures seem to have an Unicode value. Which criteria has been used to assign, it since these letters are not basic letters of a certain language/script? <br> <br>Many thanks in advance to anyone.</p>
