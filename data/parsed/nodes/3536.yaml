    html: <p>Claudio,  <br> <br>Calcite's alternates have Unicode mappings from the Private Use Area. As the name suggests, there are no criteria since the mappings are private. You are free to assign the Unicodes E000-F8FF according to your own preferences, or not at all.  <br> <br>As for the glyph name suffixes, I recommend using the "most appropriate" OpenType Layout feature name. For example, a smallcap "a" could be named "a.smcp", a initial form "a.init", a final form "a.fina" and a swash form "a.swsh". If there are more swash forms, they could be called "a.swsh1", "a.swsh2" etc.  <br> <br>Of course, if the swash forms are at the same time parts of some styllistic sets, you could call them "a.ss01", "a.ss02" etc.  <br> <br>If the same glyph is used in more than one feature, I'd subjectively pick the "most appropriate" or "most logical" one.  <br> <br>Regards,  <br>  Adam Twardoch <br>  Fontlab Ltd. / MyFonts.com  <br></p>
