    html: "<p>Electronic documents tend to have a fairly long life, especially today when a single document might be published to multiple media. PUA codepoints have a number of problems. Firstly, they are inherently unreliable: if you switch fonts in a document that includes PUA codepoints, there is no guarantee that your PUA-encoded smallcaps or ligatures won't suddenly become rare Chinese* characters or simply the wrong smallcaps or ligatures. The whole point of the PUA is that it is not standardised, so anyone can use the codepoints for any purpose. Secondly, as soon as you introduce PUA codepoints into a document, you lose the ability to reliably spellcheck, search or sort. <br> <br>*The PUA area of Unicode was originally specified mainly as a place for personal Chinese characters, i.e. for idiosyncratic characters representing proper nouns.</p>"
