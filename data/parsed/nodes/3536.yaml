    html: <p>Adobe's current position seems to be 'we know all the problems with PUA characters, but we don't want to deal with the complaints from users who can't access ligatures and smallcaps in their non-OT applications'. So they continue to include the PUA encodings in their fonts. Personally, I don't think this is doing the users any favours in the long term.</p>
