    html: "<p>Applications that support OpenType Layout features that are used to access these glyphs will naturally be able to access these glyphs via these features.  <br> <br>Private Use Area mappings are devised for applications that support Unicode but do not support any OpenType Layout features or the particular features that you used in your font. In such case (e.g. Microsoft Word), the user can use an \"Insert Symbol\" feature that will bring up a Character Map-alike window, and there, insert the character. Of course, the text stored behind the character inserted that way will be \"garbled\". Meaning: if the user inserts an \"a.init\" or \"a.smcp\" using the PUA mapping, the spellchecker, the hyphenation algorithm or the search/replace feature will not recognize it as a proper \"a\" (while this would be the case if the character is inserted via the OpenType Layout features). So this really is the last resort option. OpenType Layout features are better than PUA mappings, but since there are still applications that don't support OTL, PUA may be the only option to allow the users inserting these characters.  <br> <br>I know that John Hudson advises against PUA, I personally do the same, I also think that Microsoft has the same position. Adobe officially advises against the practice, but have been assigning PUA in their own fonts. My guess is, however, that they will stop doing so at some point.  <br> <br>Regards,  <br>Adam Twardoch <br></p>"
    html_clean: "<p>Applications that support OpenType Layout features that are used to access these glyphs will naturally be able to access these glyphs via these features.  <br> <br>Private Use Area mappings are devised for applications that support Unicode but do not support any OpenType Layout features or the particular features that you used in your font. In such case (e.g. Microsoft Word), the user can use an \"Insert Symbol\" feature that will bring up a Character Map-alike window, and there, insert the character. Of course, the text stored behind the character inserted that way will be \"garbled\". Meaning: if the user inserts an \"a.init\" or \"a.smcp\" using the PUA mapping, the spellchecker, the hyphenation algorithm or the search/replace feature will not recognize it as a proper \"a\" (while this would be the case if the character is inserted via the OpenType Layout features). So this really is the last resort option. OpenType Layout features are better than PUA mappings, but since there are still applications that don't support OTL, PUA may be the only option to allow the users inserting these characters.  <br> <br>I know that John Hudson advises against PUA, I personally do the same, I also think that Microsoft has the same position. Adobe officially advises against the practice, but have been assigning PUA in their own fonts. My guess is, however, that they will stop doing so at some point.  <br> <br>Regards,  <br>Adam Twardoch <br></p>"
