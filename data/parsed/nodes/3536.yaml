    html: <p>Claudio,  <br> <br>there is no single convention adapted by "everyone". However, those who adopt the convention that I recommend, will perhaps benefit from the fact that I'm planning to release an add-in for FontLab that will automatically build OpenType Layout features based on these names. So if you have a set of glyphs named "a.swsh", "b.swsh" etc., my tool will build the "swsh" feature for you.  <br> <br>Note that I have yet no precise plans as for the functionality of that tool and its terms of availability.  <br> <br>Other than that, you can use whatever you want -- there is no and most highly will not be any user software that depends on these glyphname suffixes to do some functionality.  <br> <br>Adam <br></p>
