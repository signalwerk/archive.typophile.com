    html: "<p>First let me thank you. I'm flattered to be helped in my Opentype and Unicode infancy by such professionals as John and Adam Twardoch, and I appreciate enormously the effort Eric is doing as well with Process to promote the Opentype format. <br> <br>You have answered many doubts I had in a few words, but a doubt still remains. Adam, when you talk of \"most appropriate\" OT names, you mean \"preparing the ground\" for something which is not yet standard, or are you suggesting a naming convention already adopted by someone? I mean, while I was waiting for your answers I used temporarily the names \"a.ini\" and \"a.fin\", instead of the four-lettered \"extension\" you mentioned. <br>If it's not a rule I'd prefer to stick to three-lettered \"extensions\": more short and more handy if I have more than a single alternate (i.e. \"a.ini\", \"a.ini2\", etc.) <br> <br>This answers a good part of my question. However, what would you suggest if, instead of regular alternates, swashes and alt.gylphs of a script, I will use the Opentype features in a conceptual or historical way? <br>In a typeface I have in its early stages I will include latin forms from various centuries (I, II, III, IV, etc.), how would you name the alternates? It would be interesting to tentatively define a standard. <br> <br>I understand your suggestion for style sheets is good anyway, expecially when I will use Opentype features in a conceptual way. <br> <br>A last question. If Unicode values are included for PUA usage, will they constitute some kind of problem (besides being a delay in the support of Opentype) in Opentype-savy applications or will they be just additional/unused information (I think so)?</p>"
