      <p>Thanks you guys. some good info.</p>
      <p>The typeface has been chosen. Garamond No. 3.</p>
      <p>another question i have is...What's the best way to determine point size<br>
      on multi size information panels ranging from 2"x3" up to 8x16 feet.<br>
      should there be a system when upscaling type to bigger panels?<br>
      Or should it be more intuitive, what feels right for each size pane.this would be for both copy size and headline.</p>
      <p>I would love to see more examples like this. and any more info. thanks.</p>
