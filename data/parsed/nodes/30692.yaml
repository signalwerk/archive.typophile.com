    html: <p>I'm not sure if this will be of much assistance, but Hoefler &amp; Frere-Jones have designed two very distinct signage typefaces for museums, <a href="http://typography.com/catalog/whitney/index.html" rel="nofollow">Whitney</a> (for NYC's Whitney Museum) and <a href="http://typography.com/catalog/verlag/index.html" rel="nofollow">Verlag</a> for NYC's Guggenheim. There's only a little bit in the site's descriptions about how they fit into museum signage, but it's something.</p>
    html_clean: <p>I'm not sure if this will be of much assistance, but Hoefler &amp; Frere-Jones have designed two very distinct signage typefaces for museums, <a href="http://typography.com/catalog/whitney/index.html" rel="nofollow" class="link-external">Whitney</a> (for NYC's Whitney Museum) and <a href="http://typography.com/catalog/verlag/index.html" rel="nofollow" class="link-external">Verlag</a> for NYC's Guggenheim. There's only a little bit in the site's descriptions about how they fit into museum signage, but it's something.</p>
