    html: |-
      <p>The type of museum might play a role in your design decisions. Legibility is probably first and foremost though. Consider that you will have people of all diferent heights (and eye strengths) trying to read at a fixed level. Larger than usual leading and point sizes over 16 help out in these areas. Museums are often surprisingly darker than you think of them to be also. </p>
      <p>The Museum may have a style guide that they adhere to. The copy editor might be a good person to inquire about that with. Or inquire with the installation manager. They are often aware of what works and what doesn't in their particular galleries.</p>
