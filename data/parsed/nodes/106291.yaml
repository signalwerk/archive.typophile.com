    html: <p>Perfect match is <a class="freelinking external" href="http://www.dafont.com/nova-solid.font" rel="nofollow">Nova Solid</a> by Billy Argel but as suggested by Don, you could do pretty much the same starting with any geometric black sans (Futura, Avant-Garde Gothic, Century Gothic...) and remove counters.</p>
