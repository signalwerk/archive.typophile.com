      <p>Reminds me of Eagle Bold -- the symbol of American recovery, drawn in 1933 by Morris Fuller Benton for the National Recovery Association -- with the counters blacked out.  Metal Font by ATF. Digital font by Font Bureau: <a href="http://www.myfonts.com/fonts/fontbureau/eagle/" title="http://www.myfonts.com/fonts/fontbureau/eagle/">http://www.myfonts.com/fonts/fontbureau/eagle/</a><br>
      Don</p>
