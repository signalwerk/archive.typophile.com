  html: |-
    <p>Atomic Media was started by <a href="/wiki/Matthew%20Bardram" class="freelinking" rel="nofollow">Matthew Bardram</a> and specializes in pixel typefaces.<br>
    Besides the work of Bardram the foundry also represents the type designs of noted designer <a href="/wiki/Susan%20Kare" class="freelinking" rel="nofollow">Susan Kare</a> and <a href="/wiki/Miguel%20Hernandez" class="freelinking" rel="nofollow">Miguel Hernandez</a>.</p>
    <p>Link<br>
    <a href="http://atomicmedia.net/" title="external link to the Atomic Media website" rel="nofollow">Atomic Media</a></p>
