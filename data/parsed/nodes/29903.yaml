      <p>Casey,<br>
      I think Times is so popular because it has been bundled with every Mac and Windows machine since the 80s and is the default face for MS Word (and numerous other non-decision reasons). Most people don't pay much attention to typefaces. They just go with the default.<br>
      Trajan might have started out as a correct choice for some Roman era spectacular film which ended up with big box office. Later, producers trying to promote their film as having "Big Boxoffice" wanted to use Trajan to give it that look of success. Even if the film had nothing to do with Ancient Rome and made no sense, it was a "me too" kinda thing. I can see "The Robe", Spartacus", and the like, using Trajan but now it is down right silly to see it on anything and everything coming out of Hollywood. Times and Trajan are good typefaces but just because you own a nice tuxedo doesn't mean you wear it to wash your car. :-)</p>
      <p>ChrisL</p>
    html_clean: |-
