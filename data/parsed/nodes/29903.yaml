      <p>Amongst designers in NYC (and presumably America), it seems to be Gotham. A lovely typeface to be sure, but fast becoming over prescribed for every design task. </p>
      <p>Otherwise, the mainstays are Helvetica, Adobe Garamond, and Times New Roman. The US government's official typographic standard requires that all official documents be in Times New Roman at 14 points. This was changed over from 12pt Courier New. No word on how this should all be line spaced.</p>
      <p>I personally use a lot of Adobe Garamond, Din, FF Bau, Today Sans, Thesis, and Scala.</p>
