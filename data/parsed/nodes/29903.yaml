      <p>Czech Republic: Arial &amp; Times New Roman. Everywhere. Time tables, road signs, logotypes, billboards, business cards, subway signs, books... And, of course, Comic Sans is as well very popular. The typographic environment in the Czech Republic is extremely poor. Czechs don't have sense for type:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/DSCF0003_5834.jpg"></div><p></p>
      <p>But if you look at stuff designed by professionals, Storm's and Brousil's typefaces are to be seen everywhere in Prague - from posters to books. This support of local type designers among Czech graphic design industry is an interesting phenomenon. There are obvious roots in the last years: Brousil and Storm both offers relatively cheap font packages and all of their typefaces support Central European languages. I used Brousil's <em>Atrament</em> to design this Juggling poster:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/DSC_0147b_6230.jpg"></div><p></p>
