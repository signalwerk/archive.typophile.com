      <p>Our local government (Calgary, AB Canada) uses Optima in the logo and many other places -- almost, unfortunately, to the point of oversaturation (personally I love Optima, but I'm starting to use it less and less because of this).  The University of Calgary does as well....</p>
      <p>Lately, I've been seeing a fair bit of Eras (another of my faves) in different places as well, and Futura (because it is one of the house fonts at the client I'm currently doing an in-house job for, but in other applications as well).</p>
      <p>I recently redesigned my business cards and cranked out a new logo -- the old one was in Papyrus (yes, I know), but the new one uses American Uncial in the logo and Albertus as the text font.  Seems to be different enough to garner positive attention but not strange enough to weird folks out.</p>
