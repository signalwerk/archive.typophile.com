      <p>Thomas said <em>Rotis (hehe, the local traffic uses it in my city)</em>  – this is also true of Auckland City Council, who use it for a lot of municipal signage. NZ Telecom adopted Bliss a couple of years ago, and maybe set a small trend for it. Although one of the local freight companies uses Comic Sans on all of their big trucks, I don't see it so much anymore. The place where I work has just given up a 15-year relationship with Optima. Historically I always thought that both Australia and New Zealand favoured Goudy as a general-purpose jobbing face.</p>
