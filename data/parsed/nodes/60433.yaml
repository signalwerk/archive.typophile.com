      <p>Really.<br>
      There were dramatic differences in letterforms between different sizes of AG, in the normal weight, that Lange evened out.<br>
      In general, he made AG look more like the new Haas face which would be subsequently named Helvetica.<br>
      Which is ironic (or merely incestuous), as Helvetica was a modification of AG.</p>
