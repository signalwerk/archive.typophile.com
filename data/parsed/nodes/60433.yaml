    html: <p>Johnston’s and Gill’s faces wouldn’t have been on packaging in the earlier half of the twentieth century, at least not in the US. And the current versions of Akizidenz are dramatically different from what was in use before Lange started changing the design in the 1950s. Franklin is ok, as are most of the old ATF sans faces, such as Alt Gothic, Inland Gothic, Blair, etc.</p>
