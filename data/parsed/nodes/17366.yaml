      <p>On the grids - the first font I drew seriously back in school was blackletter inspired, and it too used a strict 45° grid, more for the reasons marcox mentions than anything else. I think it's odd that blackletter lends itself so well to such a system, even though it's so calligraphic. Does it simply arise from nib pen writing technique, or was there a philosophy promoting a 45° stroke angle as ideal?</p>
