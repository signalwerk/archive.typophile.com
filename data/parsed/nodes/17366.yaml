    html: |-
      <p>I didn't start with an existing typeface or a caligraphy pen (coudn't find the damn thing) and just started drawing in Illustrator. At first I was just trying to figure out what it meant to combine blackletter and slab. Later, I just went with trying to say "Battle" with it. I wonder what would have happened if we were just given the names of 5 random glyphs and not a word to start with?<br>
      I don't think anyones' approach could be judged right or wrong. They were all just valid departure points. To that end, judging "the winner" is far different than commenting on eachother's solutions within their own context.<br>
      The intriguing thing I noticed was an almost even break in those who were being more based in writing and caligraphy, and those who went more to the wordmark-logo direction. The ambigrams could go both ways :-)<br>
      I think a good time was had by all though.</p>
      <p>ChrisL</p>
