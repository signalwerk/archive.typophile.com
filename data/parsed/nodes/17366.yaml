      <p>I actually did spend a considerable amount of time on my second try because I thought of a way it could be done that could conceivably lead to a full typeface, or at least a style I could use in some future lettering project. My initial entry was built up modularly in Illustrator rather quickly and lacked depth and nuance. With the second try, I started with pencil and paper, the same as I would with a real lettering project or a font. I knew it would be more work, but I think it made a big difference. Whether it becomes an actual font, who knows. I don't think there would be a big market for it, but I'm bad at predicting that sort of thing.</p>
      <p>I liked a lot of the other entries (including yours, Nick). I enjoyed taking part and I don't think I would have come up with what I did on my own. I hope this really does become a regular Typophile thing.</p>
