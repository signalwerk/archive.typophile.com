    <p>We’re kicking oﬀ a new game!<br><b><span class="caps">TYPE</span> <span class="caps">BATTLES</span></b></p>
    <p>Here’s your chance to stretch your type muscles on a weekly basis. Each game kicks oﬀ on Monday with a new challenge, and closes at midnight <span class="caps">PST</span> on Friday. Anyone may submit a design response to the challenge. You may enter as often as you wish. Post anytime. Critiques and comments are welcome throughout the game, from participants and spectators alike. Smack talk is&nbsp;encouraged.</p>
    <p>Winner take all, no holds barred. May be the best designer&nbsp;win.</p>
    <p><b>Requirements:</b></p>
    <p>- Size: 600 width x 400 height.<br> — Color: Black and white only<br> — Format: Please save your graphics as <span class="caps">PNG</span><br> — Only respond with the characters posted in the&nbsp;challenge.</p>
    <p>// <b><span class="caps">THIS</span> <span class="caps">WEEK’S</span> <span class="caps">CHALLENGE</span>:<br>
    // Design the characters in the word “battle” as a slab-serif&nbsp;blackletter.</b></p>
    <p><b><font color="#cc0000">This challenge is now closed.<br>View the next battle: </font><a href="http://typophile.com/node/17477">Franklin Swash</a> (Week of&nbsp;1/23/06)</b></p>
