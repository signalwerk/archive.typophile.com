    html: |-
      <p>The nibbed flat pen is well suited to writing this way. It is much harder to stay vertical with your arm/hand movement. Also, spacing is very predictable with almost uniwidth letters with parallel sides. In centuries past, many books were written with this hand and are still marveled at today.<br>
      Buy a flat pen and try it! It is actually kind of fun.</p>
