    html: |-
      <p>I've found the problem - I hadn't separated the lookups properly like this:<br>
      <cite><br>
        lookup endforms {<br>
        ignore sub @tobeendform' @letter;<br>
        sub @tobeendform' by @endform;<br>
        }endforms;<br>
      </cite><br>
      so the ignore sub parts were covering everything in the calt feature, not just the following lines of code.</p>
      <p>Duh!</p>
