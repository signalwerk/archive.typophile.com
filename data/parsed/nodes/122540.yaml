      <p>@Suijin: There are cognitive aspects to what I am looking for, and a reflection on letter shapes alone needs a complement of psychological studies (as you mentioned: pattern recognition, language development) if we were to make a proposition to alter our alphabet or language structure. Look at the example you gave: a study showing our capacity to understand words in which the orders of letters is randomised: it's an interesting study, but doesn't it feel that we're only at the beginning of something? Taking my personal interest and point of view: are there psychological studies on our capacity of recognition of specific abstract shapes, e.g. do we better recognise a series of circles, points, or segments? What are the pros and cons or using a stylised 'g' (a complex form) versus a simple one? Do we better recognise the 'g' (which I think is the most complex letter - geometrically speaking) or a 'o' or 'i'?<br>
