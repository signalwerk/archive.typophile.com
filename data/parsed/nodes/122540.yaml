      which is a good example of being interesting as cognitive science but not as type design, because artificial intelligence is still at the point where the most rudimentary, stripped-down concepts of letter forms and letter styles are a difficult challenge. The complexities of what actual human type designers do have not really been theorized much yet.</p>
