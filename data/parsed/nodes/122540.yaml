      <p>Well, if you want to say that the shapes of the other glyphs in a font affect one's ability to decode a glyph, of course I agree. The reason that a nearly-closed "C" shape is a problem is that it generally looks like an "O."</p>
      <p>Another consideration is that the norms matter, as well as the actual other shapes in the font. You can make a U that looks a lot like a V, and even if the actual V in that particular font is different and distinctive, it is still a legibility issue.</p>
