      <p>Hi LePierre<br>
      You seek, or will become a Linnaeus of typography! He is the botanist who created a taxonomy of biology classifying species according to their attributes. One way to classify letters and glyphs is topological - how many counters do they have? I,r,s etc= zero.<br>
      R,p,q etc= one. B,g= two.  Or perhaps you are seeking to define  a generic shape, the Platonic ideal for every letter?  In my AlQuds font I did something like that for Arabic when I decided on the simplest most recognizable shape of a letter, given the many fancy calligraphic forms it could take. I did that instinctively and not in the systematic analytical  way you may want for Latin.<br>
