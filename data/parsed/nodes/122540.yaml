      Thank you very much. I have ordered the book, and am reading about Panose and will probably contact its creator, Ben Bauermeister, to find out the recent evolutions. His work is a part of the solution, as it introduced measures of several font characteristics. I'd be curious to see what/if it has been used to measure individual letters, to see if his work has been ported in Fontlab modules...etc. I'll ask him.</p>
