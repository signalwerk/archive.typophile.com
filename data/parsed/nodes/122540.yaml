      <p>This is a cognitive issue. You need to dig into perception, pattern recognition, and even language development. Typography is at it's root a system of marks that are symbols, and the "apprehensibility" of those marks, from a "mark qua letterform" perspective is largely a function of their relationship to other marks of similar form or style, with your brain doing the required processing to "decode" them into language. That's why a single "g" from a highly stylized font might look like nothing (and not adhere to any usual or customary definition) but be recognizable as a "g" in the context of words so similarly styled.</p>
      <p>It's related in a way to why you can read this:</p>
