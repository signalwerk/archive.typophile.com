      <p>Interesting question. Most  times a computer displays a letter or prints it it is implementing a scheme to reduce the geometry of the bezier curves defining the outline to pixel positions - it is all very mathematical. Thankfully the designer only tweaks the vector handles and need not bother with the maths.</p>
      <p>If what you are seeking is the simplest mathematical way to represent letters, analytic geometry can do that. For example  a very thin san-serif I 10 units high is represented by  x=0 , With y more than zero and less than 10. I tried typing more than with its symbol the tilted v, but the html thinks it is the end of the paragraph and deletes the rest! Representing a generic O  is in the form x^2+(y-5)^2=26 (which adds an optical adjustment of half a unit!) where ^ represents "to the power". An x needs two lines one of which is x=y  between zero and 10 for both x and y, and so on. Graphic plotters would use some such representations in the software programs. Hope I got all this right!</p>
