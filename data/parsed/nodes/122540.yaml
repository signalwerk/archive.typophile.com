      <p>I think you have misinterpreted what I meant by “combine”; perhaps I should have said “are configured to form a coherent system”.</p>
      <p>I attempted to explain this with the example of the straight line (I, l and 1, and for that matter hyphen, dashes, macron and underscore) and circle/oval (O, o, zero, degree and ring).</p>
      <p>As individual symbols, the circles are identical, and easy to categorize and identify as such. That is legibility. But which character does this shape, once discerned, signify? For the type designer, the circularity is a given, and the important task, for disambiguation, is both to make sure they are not confused, and also to harmonize their treatment stylistically. </p>
      <p>In a typeface comprised entirely out of straight lines, these nominally circular or oval characters become quadrilateral, yet this conceit is taken in stride by the reader. Again, it is the type designer’s task to make sure that a particular shape is recognized as a specific character, and this is done by typographic means, in relation to the typeface as a whole.</p>
