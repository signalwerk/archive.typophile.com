      <p>While I’m happy to help and discuss this topic, I disagree that geometric analysis addresses what is  fundamental to typography. </p>
      <p>People have been trying to reduce typography to scientiﬁc analysis and management since Dürer, but it seems to me that most geometry in glyph shapes stems from the peculiarities of different technologies—both those used to design, punch or draw the type, and those used to render typography. </p>
      <p>Where the style is a script, the technology is a brush and paper, and the rendering is (hand-spaced) phototypositor, there is no geometry, and yet is this not type? Therefore, geometry is not fundamental.</p>
      <p>In the ﬁrst 25 years of digital type, prior to high-res Retina screens, the discipline of hinting, concerning alignment zones and stem widths, has encouraged neatness and regularity in type design—eminently measurable—but at the same time there has been a parallel track of grunge, deconstruction, distress and skeuomorphic imitation of rough, hand-rendered lettering of analog media. And this too is type!</p>
