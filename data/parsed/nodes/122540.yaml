      <p><cite>Colored animated 3D typography with sound effects anyone?</cite></p>
      <p>In one episode of Star Trek: The Next Generation, an alien language is displayed on an interactive screen as images of rotating balls with colored patterns on them.</p>
      <p><cite>The objection to using these forms entirely unchanged - ie without being redesigned typographically to adapt to the style weight, serif or sans etc., of the Arabic or Hindu or whatever font it is used in- still stands.</cite></p>
      <p>One certainly could borrow the numerals from any number of Latin typefaces designed to simulate Arabic or Chinese, or even just from a calligraphic typeface.</p>
      <p>I can think, though, of a number of reasons this option was rejected.</p>
      <p>Since Arabic does have its own set of digits, it may have been thought that the foreign ones <em>should</em> stand out, so that people don't get too comfortble with them. And an attempt to stylistically Orientalize the Western digits could well have been perceived as patronizing and so on. Or, in a more pragmatic vein, since those weren't the forms people were taught from childhood to recognize, if they don't stand out as alien, they have the potential to cause confusion and slow reading.</p>
      <p>When English texts include words in Greek, Hebrew, Chinese, or some other language with a different script, ordinary typefaces for those scripts are used - often, the equivalent of Century Expanded for the Latin script: the plainest and most standard typeface one can find.</p>
      <p>In the hot metal era, that would simply be all that the printer would have on hand. (For Greek, there is a particular convention, known as Porson Greek, with its own history.)</p>
      <p>There is no temptation to handle those scripts with a hyper-Latinized typeface so that they will "fit in" visually with the surrounding text.</p>
      <p>If a paragraph suddenly contained, say, a word or phrase in heavily Latinized Gujarati... say (and the Gujarati script happens to lend itself to such treatment, with relatively simple forms and no Devanagari overbar - and I've seen it done too for display typography in that language)... unless context were to indicate the language likely to be used, the reader would likely be utterly perplexed as to what language these strange symbols might belong.</p>
      <p>Come to think of it, this is an indictment of the "unified" sans-serif typefaces currently being designed for mobile devices, which are the subject of another recent thread: they may be great for their intended purpose in user interfaces, but they are probably <strong>not recommended</strong> for (the kind of) scholarly publication (that includes interspersed quotes from different languages).</p>
