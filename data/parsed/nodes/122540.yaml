      <p>Hi Vladimir,<br>
      Thank you for the comparison. Getting to a classification is not my objective, however could be an outcome of the ability to compare and measure in an objective way. From this ability, the ability to create an average, which might or not might be identical to a "platonic" ideal - this would be an interesting discussion: it might be the case that an average "g" isn't as pretty, simple, or recognisable as it could be, hence the ability to optimise templates. But one cannot form an ideal without being able to assess the present. Right now, every typographer has his/her own representation and judgements of types, and his/her own ideals, without an objective way to contrast and compare, as it typography was pure design/art, and not also a social communication tool which implies requiring a convention.<br>
      I cannot judge your AlQuds font as I am entirely ignorant of this, but the way you described makes me believe you understand my aim. </p>
