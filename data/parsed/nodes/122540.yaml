    <p>Hello everyone,</p>
    <p>Pardon my amateurism.<br>
    I am looking for sources (books, articles, researchers,..) on the geometric analysis of letter shapes. All typography books and sites I have seen are concerned on type design aesthetically and historically, but do not address its geometric, non-artistic and non-aesthetic foundations:<br>
     - decomposition of letters in sub-shapes, structure of sub-shapes and comparison of letters' super-structures<br>
     - mathematical definitions of distance between shapes and letters, geometric definition of legibility<br>
     - analysis of 1D (no width) versus 2D (with width), geometric analysis of fonts<br>
     - geometric analysis and comparisons (and critiques) of fonts, of alphabets<br>
     - conceptualisation of new letters<br>
     - ....etc.</p>
    <p>Does it even exist? Who in the world and history of typography has written about these fundamental topics?</p>
    <p>Thank you,<br>
    Pierre</p>
