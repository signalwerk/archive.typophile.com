      <p>Digital technology reduces all typefaces to geometric artefacts.<br>
      Here are three solutions of how to convert digital text into typography, each of which required, and constitutes, a “geometric analysis of letters”. </p>
      <p><strong>PostScript Type 1</strong><br>
      This elucidated many geometric qualities of letters, in particular in the way that the invention of hinting—using nominal stem widths and alignment zones to control shape—was required to address the problem of coarse pixel screens. <a href="https://partners.adobe.com/public/developer/en/font/T1_SPEC.PDF" title="https://partners.adobe.com/public/developer/en/font/T1_SPEC.PDF">https://partners.adobe.com/public/developer/en/font/T1_SPEC.PDF</a></p>
      <p><strong>Metafont</strong><br>
      Lines and splines.<br>
      <a href="http://en.wikipedia.org/wiki/Metafont" title="http://en.wikipedia.org/wiki/Metafont">http://en.wikipedia.org/wiki/Metafont</a></p>
      <p><strong>Bitmap</strong><br>
      A simpler approach to geometrizing the alphabet.<br>
      <a href="https://www.fontfont.com/fonts/call" title="https://www.fontfont.com/fonts/call">https://www.fontfont.com/fonts/call</a></p>
      <p>I have also heard that the Bentons developed algorithms for optically scaling typefaces, at ATF in the early 20th century.</p>
