      <p>@Nick: you may not think glyphs matter, I believe they do. I believe recognising a glyph, any glyph, into a letter, is only the tip of an iceberg. I'd like at least to convince you that each glyph has a poetic substance, is a fantastic source for childhood imagination, a monument to be celebrate. It shouldn't be hard, for a visual audience such as yours. So here are some random thoughts: Haven't you ever felt that the uppercase P or F were in danger of falling? Do you sense the majesty of the A, Eiffel tower, star of the alphabet. The B is so fat it's not even funny. One can't spell slim, thin, and lean with it. Glyphs have friends: p,q,d,b make a gang, x and o conspire in secret. Who will write the eternal beauty of an H, ladder to Heaven? Who will say there's simply something wrong and awkward with k, r and Q?<br>
      More seriously, is our alphabet geometrically sound? In the sense of: is there a geometric balance between all letters or are some letters very different from each other while some are very (too) similar to each other? I am surprised by the purity of x and o and their opposition, and I wonder if the resemblance of m and n and u may be a (hidden, taboo) legibility issue. What shapes does our alphabet ignore? The tree letters c, u, n have open counters going right, up, down, but why not (suspending our anthropocentric judgement) a letter with a left one, like a b without a stem?<br>
      (I'm not trying to be clear - just throwing a few thoughts to express why I care about those abstract shapes.)</p>
      <p>@Vladimir: beautiful electronic spin font! Trying to read your paper...</p>
