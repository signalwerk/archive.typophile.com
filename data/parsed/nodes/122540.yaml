      <p>@Thomas: By template, I mean a visual template, a sort of abstract 2D wireframe, or a cloud made of the series of acceptable/recognisable shapes for a letter, so by 'template' I mean a geometric one so I'm not sure what you understood by templates not being geometric. And it's not necessarily about defining things with exact precision, but saying: a lowercase "c" is basically a left-side ellipse, has _those_ relations between the "i" and the "o", has _these_ characteristics compared to a "g".. and why does it need a terminal and/or a finial instead of being clear-cut at its center? For reasons of history or legibility? Is the "c" the easiest letter to write by hand, as it looks like it's part of a group of letters that don't need much ink/pixels? (hence: definition of letter "mass": does this exist?).. Amusing fact: the first word of the bible in yiddish is "Bereishit": בְּרֵאשִׁית which starts with a בְּ because, from what someone told me, it has an opening shape, like a uppercase "C"..<br>
      As you can imagine, those questions or reflections are not related to particular (western) types, but to the abstract form of a letter, I'm just wandering who has written what about this kind of things.<br>
      And I agree it's completely western-centric, as I have no familiarity with other alphabets. One does with what one has.<br>
      But whatever the origin, an alphabet implies the ability to recognise a letter, visually (= geometrically), so the concept would still apply. </p>
