      <p>I'm sorry, you didn't say irrelevant, you said: “I don’t think that the shape of individual glyphs is particularly important, we are very adept at decoding symbols. What is important in type design is how the glyphs combine.”</p>
      <p>I could not disagree more strongly, and I would say the research significantly contradicts the first half of your statement.</p>
      <p>As for the second part, although it is *also* important how the glyphs combine, to the extent that the relative contributions to legibility have been specifically studied, it appears to be quite a lot less important than the individual glyph shapes. If you're talking relative importance, you have it backwards.</p>
      <p>Sorry I don't remember the specific study right now. It's the last one mentioned in the relevant chapter of Sofie Beier's book on legibility. I think it was 2011, an Italian sounding name starting with an R perhaps. But I just loaned out my copy of the book last night.  :(</p>
      <p>I should also say that any discussion of the relevant contributions and importance of two variables is dependent on the population variability of each variable. So for example, if you create a font by taking glyphs from a totally random or unrelated set of fonts, you'll suddenly "discover" that how the glyphs combine makes a huge difference. But within the norms of type design, according to the one study on the topic, it was more like 3:1 for individual glyphs over any higher-level effects.</p>
