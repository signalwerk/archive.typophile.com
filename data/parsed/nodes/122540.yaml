    html: <p>Yes Riccard0 thats the idea.  Playing with the concept lePierre suggested is fun but I rather agree with Nick. Fonts evolve and whatever is currently most used/liked is the acceptable shape of the letter. Cultural influences play a large part.. for example when Arabic numerals  were introduced to Europe they were very close to the Arabic script in style. Since then they have evolved to match Latin  letters serifs and all. Some misguided literary people in Beirut in the 1950s 'discovered' these Westernized  numerals and adopted them as the original Arabic numerals! Now they are the norm sticking out like sore thumbs between the Arabic type, while the traditional Arabic numerals (Indic) languish for non-use. Similar outrages are now plaguing Arabic fonts whereby one of the Google web fonts all but unreadable is being adopted for its novelty. Glyphs  change.</p>
