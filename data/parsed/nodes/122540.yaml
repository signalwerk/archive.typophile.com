      <p>Hi Vladimir,</p>
      <p>I agree the maths of computer displays must be very complex, taking colours, zones of pixels and pixels themselves all into account to refine, simplify or break the original bezier curves and shape contours. Thankfully I am not interested in this, but in the definition of the letter "templates", the mental geometric constructs that our brain create early on in our lives that make us recognise each letter.</p>
      <p>Your second paragraph is a part of the answer: yes the simple template for an "I" is a vertical line, the template for an "O" or "o" is a vertical ellipse, and "x" and "X" are made of intersecting lines.<br>
      Those are the simplest letters, the simplest structures and if we calculate an average of those letters in every typeface, we can expect the deviation to be small. Some letters may have higher deviations, for instance the "a", "g", "z".. Those averages and deviations can be calculated, and from this work a convention can emerge.<br>
      I am looking for people and resources who worked on this.</p>
