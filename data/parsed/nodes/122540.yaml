      <p>@Vladimir: your remark on the evolution of numerals is fascinating, I would love to read about it.</p>
      <p>@riccard0: the averia is interesting, eerie and familiar. Thank you.</p>
      <p>@eliason: there is plenty of luck to have here already! But I concur that the recognition of letterforms impose to ability to compare, and the 'knowledge' of templates, so I should investigate. In addition to a geometric analysis, I would also like to see reflexions on the nature of letter forms, semio/socio/psycho-logic aspects, poetic too, something like what Bachelard did for elements (space, fire, dreams) <a href="http://en.wikipedia.org/wiki/Gaston_Bachelard" title="http://en.wikipedia.org/wiki/Gaston_Bachelard">http://en.wikipedia.org/wiki/Gaston_Bachelard</a> and such a reflection, I think, should come from a combination of art and science. A conceptual foundation for typography that would feed into/explain the choices designers make daily in their choices: why egyptian slabs on the word 'God'? Why should the official printout of the european constitution have high ascenders?..etc.</p>
      <p>@Nick: in what I have seen, most analysis of type is done of the "external" side of type. Let's define the "internal" side of type as the conceptual/abstract definition of letter forms, the "templates": e.g. an "o" is a circle, or vertical ellipse.  The "external" aspect of type is about the surrounding aspects: counter size, ellipse direction, overhang dimension, natural/grunge aspects as you mention them,..etc. It's the internal aspects I'm interested about. I agree with you and the others that a geometric analysis of the external aspects doesn't lead far.</p>
      <p>@DTY: very interesting, however I would ask an Artificial Intelligence team to go further: let's assume we have a group of A.I. beings, who are communicating orally with a basic language, then let's make them mute but let's give them the ability to draw.. what sort of shapes would they draw in order to communicate? In other words, what are the cognitive factors at play in the construction of a written language?</p>
