      <p>@Nick: Readability is the ease with which a written text can be understood by a reader. It refers to entire words, sentences, and paragraphs, and encompass a wide variety of factors such as the text content, the language,..etc. Legibility is closer to may aim, as it is the degree to which individual characters in text are understandable or recognisable based on appearance. Readability is influenced, among other factors, by font choice, point size, kerning, tracking, line length, leading, and justification. However, I would be interested in a degree below entire letters: I want to know the brain reaction to basic geometric elements: circle, vertical segment, horizontal,..etc. I want to tie this analysis to a semantic analysis: history of signs/shapes, psychology, sociology,..etc. I want the beginning of an awareness of a vision of what an "|" provokes, how well it is recognised, and why "–" should or should not be used and why. I want to say "the letter A should be drawn like ∆ because.. and ∫ should replace s because...</p>
      <p>@Vladimir: I'm not looking to create a font, or a software to create fonts, but a I'd like a tool that lets me do geometric calculations I need, I'm just not sure what to use... I could try FontLab and develop my extensions in Python, but there might be tools better suited for this. Do you know? I could perhaps use FontLab to extract path points, or even calculate wireframes out of existing fonts, but I'm not sure.</p>
