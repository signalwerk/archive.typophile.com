      <p>LePierre, it doesn’t matter that I and l are the same character shape, context will usually disambiguate them.</p>
      <p>They were different shapes prior to typography, but ironically, from your perspective, type design has brought them closer together, because of both the recognition of textual context for providing meaning, and typography’s ability to nuance the basic shapes with details that relate to how the bicameral (upper and lower case) system has evolved, namely stem thickness, relative height, and serif treatment.</p>
      <p>So the identicality of I and l is not a bug, but a feature that contributes to the overall readability of typography—although not of course individual glyph legibility.</p>
      <p>I would argue that, assessing the pros and cons of the simple vertical line as a glyph shape for two separate characters, the economy and simplicity of this shape is so powerful that the efficiency (both in execution and recognition) obtained by using it outweighs the drawbacks. This is what design is, a compromise (or transcendent raprochement) between competing criteria, in this instance legibility and readability.</p>
      <p>The same principal has allowed us to identicalize the character forms of O, o, zero, degree and ring, distinguishing them with subtle, typographically meaningful transformations of the basic round shape, without resorting to making any of them heart-shaped.</p>
