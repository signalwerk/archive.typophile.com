    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 22.Mar.2006 11.00am </div>
      <p>===== </p>
    <p>Monotype Foundation Scholarship Event<br>
    Wednesday evening, April 5<br>
    Reception 6:00 – Presentations 7:00</p>
    <p>We invite you to join us for a special event announcing the first Monotype Foundation scholarship. The announcement will be preceded by a special lecture by Matthew Carter on the work of Bruce Rogers. A limited edition print of Bruce Rogers’ original drawings for Monotype Centaur will also be given away at the event. In addition, all attendees will receive, free, the Centaur typeface family as OpenType fonts.</p>
    <p>Fee:<br>
    TDC members $15<br>
    Nonmembers $20</p>
    <p>Type Directors Club<br>
    127 West 25 Street, 8th floor<br>
    New York, NY 10001</p>
    <p>212-633-8943<br>
    212-633-8944 fax<br>
    <a href="http://www.tdc.org" title="www.tdc.org">www.tdc.org</a><br>
    director [at] tdc.org</p>
    <p>RSVP by March 24 to director [at] tdc.org or telephone Carol Wahler at 212-633-8943</p>
