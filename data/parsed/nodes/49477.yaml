      <p>It is indeed custom. Drawn by <a class="freelinking external" href="http://covers.fwis.com/everything_is_illuminated" rel="nofollow">Jon Gray</a> and digitized by FontShop I believe. The actual name is HP PSG. It exists as a full typeface and also has numerous alternate vector drawings of single letters.</p>
      <p>The text that reads "The Computer is Personal Again" is actually an official logo lockup so it is was made separately from the typeface.</p>
