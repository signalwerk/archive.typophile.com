      <p>If I clearly remember, this sample comes from the Russian issue of Harper's Bazaar Magazine. Previously asked <a class="freelinking external" href="http://www.typophile.com/node/68068" rel="nofollow">here</a> and <a class="freelinking external" href="http://typophile.com/node/91407" rel="nofollow">here</a> but still unsolved. As most of fashion magazines, it could be a bespoke typeface exclusively designed for the magazine.<br>
      From one of the above page, you could get various suggestions for "<a class="freelinking external" href="http://typophile.com/node/67084" rel="nofollow">ultra thin constrated sans</a>" in the same style as your sample.<br>
      My selection: <a class="freelinking external" href="http://e-daylight.jp/design/fonts/type/s/stark-debonair.html" rel="nofollow">Stark Debonair</a> (digitized and freely available as <a class="freelinking external" href="http://www.subflux.com/Fonts/FontsRecre_Retro.htm" rel="nofollow">Retro Super Skinny</a>), <a class="freelinking external" href="http://e-daylight.jp/design/fonts/revival/penny-bee.html" rel="nofollow">Penny Bee</a> (never digitized), <a class="freelinking external" href="http://www.myfonts.com/fonts/flat-it/cotoris/" rel="nofollow">Cotoris</a> (closest /R I have), <a class="freelinking external" href="http://www.fontsquirrel.com/fonts/COM4t-Fine-Regular" rel="nofollow">Fine</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/reserves/vanitas/" rel="nofollow">Vanitas</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/andrijtype/seaside/" rel="nofollow">Seaside</a>, <a href="/wiki/%7CSang%20Bleu" class="freelinking" rel="nofollow">|Sang Bleu</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/t26/minerva/" rel="nofollow">Minerva</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/k-type/gill-new-antique/" rel="nofollow">Gill New Antique</a> (could be a good one to customize), <a class="freelinking external" href="http://www.myfonts.com/fonts/typeinnovations/contax-sans/" rel="nofollow">Contax Sans</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/green-type/patriciana/" rel="nofollow">Patriciana</a></p>
