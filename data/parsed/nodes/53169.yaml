    html: |-
      <p>Hi Omar, thanks for linking to my article.</p>
      <p>Most typefaces used for airport signage is indeed <strong>Frutiger</strong>, first designed for Charles de Gaulle, Paris. Other typefaces that can be used for airport signage are eg. <strong>FF Info</strong> (Spiekermann), <strong>FF DIN</strong> (Albert Jan Pool), <strong>FF Transit</strong> (MetaDesign). I have seen uses of Helvetica and Gill Sans, although I find those typefaces not very suitable for airport signage. Good luck.</p>
