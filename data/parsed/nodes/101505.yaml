    <p>I'm an Asian font newbie utterly flummoxed with trying to find appropriate web fonts for a website.</p>
    <p>For western European languages the site will use Helvetica Neue Light, Helvetica Neue Bold and Baskerville Italic.</p>
    <p>But the site will also appear in Mandarin, Cantonese, Japanese and Korean, and I'm trying to find web fonts for those languages that are appropriate equivalents of Helvetica Neue and Baskerville Italic.</p>
    <p>Googling for recommendations has just confused me further. Some people even suggest there's no sense using web fonts for Asian character sets because the file sizes would be impractically large. Others suggest that italic fonts aren't appropriate.</p>
    <p>Can anyone help suggest what approach I should take here?</p>
    <p>Any advice very much appreciated.</p>
