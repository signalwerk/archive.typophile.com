      <p>Yes, please take a look at our <a class="freelinking external" href="http://www.fonts.com/web-fonts" rel="nofollow">Fonts.com Web font service</a>. It has both the Neue Helvetica and Baskerville web fonts you are looking for. And Fonts.com has an extensive selection of Simplified Chinese and Traditional Chinese web fonts as well (along with many other languages too). </p>
      <p>As you pointed out, the Fonts.com Web font service uses dynamic subsetting for all Chinese, Korean and Japanese fonts. Dynamic subsetting automatically detects and instantly delivers the Web fonts for only the characters that are used, thus dramatically reducing font file size and web font download times. I hope you find this to be a solution that will solve your problem.</p>
