    <p>Hi all,</p>
    <p>I need to find a typeface to pair with Courier, both used as body texts. Though I know some suggestions will include replacing Courier, I would like to stick with it. As such, it's been a huge challenge finding a typeface to work alongside it... Any suggestions??</p>
    <p>Thanks so much!</p>
