      <p>Some suggestions:<br>
      There are at least another face inspired by Courier: <a href="http://www.gestalten.com/news/hellschreiber" title="http://www.gestalten.com/news/hellschreiber">http://www.gestalten.com/news/hellschreiber</a><br>
      Whatever typewriter-style font (which I think it’s an appropriate choice) you will end using, make sure it’s dark enough (i.e. no Courier New).<br>
      Depending on the historical scope of the book, a possibility is choosing a text face from the seventies.</p>
