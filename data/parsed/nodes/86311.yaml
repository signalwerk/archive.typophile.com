    <p>Hi, </p>
    <p>I am looking at a good font to pair with <a href="http://www.google.com/webfonts/specimen/Vollkorn" rel="nofollow">Vollkorn</a>. Possibly another font from the google web fonts directory. </p>
    <p>The font will be used as a support font for meta informations (author name, dates, etc.) so a simple, clean, anonymous one would be a good fit.  The website use Vollkorn for all the other text, titles and body, with generous use of bold weight for the titles. The mood of the site is straightforward (the site is about quality content from professional to professional, of every discipline) but elegant (do you think Vollkorn is an elegant font?  I feel the italic is and the bulky bold, while a lot "in the face" i think maintains a more refined esthetic than other fat bolds).</p>
    <p>Thanks in advance</p>
  html_clean: |-
