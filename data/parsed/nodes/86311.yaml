      <p>as I said I don't think XP is a problem here, not for the user base but for the font rendering in itself. In addition the W3C stats are the stats of the W3C website not general web traffic stats. From what I know most of the current XP user base is in countries where there is no audience for my projects; being W3C a global site on average it register more XP user than websites visited only in certain countries. Also worth nothing that in the W3c stats you can see as XP is losing half of its share per year.</p>
