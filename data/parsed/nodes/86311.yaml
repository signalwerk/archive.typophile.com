      <p>I am aware of the rendering problems of the (mostly non Clear Type enabled) windows XP font rendering. But, if you would have looked at Vollkorn in Windows XP before answering,  you would have discovered that it renders good with Clear Type enabled, OK with the standard font smoothing, and a bit less good of Georgia without font smoothing at all. </p>
      <p>Vollkorn has been probably hinted for screen and its letterforms shapes and high line–height help a lot  with screen rendering. That said, your point is generally valid if you mean you have to look at the fonts in various systems and settings before using it on the web, but is not a universal rule valid for all fonts and all people.</p>
