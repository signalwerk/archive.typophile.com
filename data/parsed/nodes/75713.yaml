    votes: null
    html: |-
      <p>StdVW is the first value of StemSnapV. Basically, StemSnapV is a list and StdVW is the first, most important value. </p>
      <p>Also, there is a commandline switch (<code>-nb</code>) in AFDKO's autohint to disable the requirement for those values. </p>
      <p>A.</p>
