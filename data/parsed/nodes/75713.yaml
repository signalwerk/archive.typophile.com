  html: |-
    <p>So I am trying to use the AFDKO Autohinter...</p>
    <p>I generated an OTF with Fontforge and tried to use autohint, which gave me this error:</p>
    <p>'Error: font has neither StemSnapV nor StdVW!' </p>
    <p>I looked in PS Private and StemSnapV was already there in my source file, but many of the fields were removed in the OTF. I think I might try generating a ps file in the morning instead and see if that fixes that problem.</p>
    <p>But what goes in StdVW? Fontforge doesn't automatically put the info in there for me. (:</p>
  html_clean: |-
    <p>So I am trying to use the AFDKO Autohinter...</p>
    <p>I generated an OTF with Fontforge and tried to use autohint, which gave me this error:</p>
    <p>'Error: font has neither StemSnapV nor StdVW!' </p>
    <p>I looked in PS Private and StemSnapV was already there in my source file, but many of the fields were removed in the OTF. I think I might try generating a ps file in the morning instead and see if that fixes that problem.</p>
    <p>But what goes in StdVW? Fontforge doesn't automatically put the info in there for me. (:</p>
comments:
