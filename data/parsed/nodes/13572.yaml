  html: |-
    <p><a href="/wiki/TypeOff" class="freelinking" rel="nofollow">TypeOff</a> has just produced its first T-Shirt, and I am giddy happy.</p>
    <p><a href="http://www.typeoff.de/?p=34" rel="nofollow">See the design here</a>.</p>
    <p>The design is an homage to <a href="/wiki/Experimental%20Jetset" class="freelinking" rel="nofollow">Experimental Jetset</a>, whose Beatles T-Shirt drove two members of our collective bonkers. Of course, the design is just as much of an homage to the four type designers whose names it bears: </p>
    <p><a href="/wiki/Walter%20Tiemann" class="freelinking" rel="nofollow">Walter Tiemann</a><br>
    (1876–1951) Typographer and Professor from Leipzig. Designed typefaces for the <a href="/wiki/Klingspor" class="freelinking" rel="nofollow">Klingspor</a> foundry in Offenbach, e.g., Tiemann Antiqua.</p>
    <p><a href="/wiki/Otto%20Eckmann" class="freelinking" rel="nofollow">Otto Eckmann</a><br>
    (1865–1902) Painter and commercial artist. Designed <a href="/wiki/Eckmann" class="freelinking" rel="nofollow">Eckmann</a> for the <a href="/wiki/Ruhard" class="freelinking" rel="nofollow">Ruhard</a> foundry in Offenbach.</p>
    <p><a href="/wiki/Karlgeorg%20Hoefer" class="freelinking" rel="nofollow">Karlgeorg Hoefer</a><br>
    (1914–2000) Calligrapher and professor at the <a href="/wiki/HfG%20Offenbach" class="freelinking" rel="nofollow">HfG Offenbach</a>. Designed <a href="/wiki/Salto" class="freelinking" rel="nofollow">Salto</a> for the <a href="/wiki/Klinsgpor" class="freelinking" rel="nofollow">Klinsgpor</a> foundry in Offenbach, as well as other typefaces for <a href="/wiki/Ludwig%20and%20Mayer" class="freelinking" rel="nofollow">Ludwig and Mayer</a>, <a href="/wiki/D.%20Stempel%20AG" class="freelinking" rel="nofollow">D. Stempel AG</a>, und <a href="/wiki/Linotype%20Library" class="freelinking" rel="nofollow">Linotype Library</a>.</p>
    <p><a href="/wiki/Rudolf%20Koch" class="freelinking" rel="nofollow">Rudolf Koch</a><br>
    (1876–1934) Calligrapher and teacher. In-house designer at the <a href="/wiki/Klingspor" class="freelinking" rel="nofollow">Klingspor</a> foundry Offenbach. Designed numerous typefaces including <a href="/wiki/Koch%20Antiqua" class="freelinking" rel="nofollow">Koch Antiqua</a>, <a href="/wiki/Kabel" class="freelinking" rel="nofollow">Kabel</a>, and <a href="/wiki/Wilhelm%20Klingspor%20Gotisch" class="freelinking" rel="nofollow">Wilhelm Klingspor Gotisch</a>.</p>
    <p>The shirts are available in boy cuts and girl cuts, in many different sizes and colors. For the moment, we are just shipping within Germany, but if anyone going to TypeCon wants one, let me know.</p>
