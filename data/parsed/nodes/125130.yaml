    html: <p>Héctor give you a pretty good advice. So I would not repeat what he wrote. However I would suggest to concentrate your effort on one style only. Choose the one you personally prefer and do all the design change you need to get the stylistic coherence that Héctor suggest. After and only after you will be ready to work on an alternate style. Keep going.</p>
