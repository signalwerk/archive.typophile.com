    <p>I would like a critique of my first typeface design, it is comprised of 3 versions: a standard clean neo-grotesque, an alternative version that has multiple alternatives, and a "advertising" version that has a much higher x height, along with a shorter ascender/descender line, with a more expressive feel to it. all three versions will be released under the name "Dawson Grotesque"<br>
    All advice is appreciated! This has been a project of mine for quite some time — and is my first baby, so please help me make it perfect for its release in the near future !<br>
    Thanks .</p>
