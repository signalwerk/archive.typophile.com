    html: |-
      <p>Hi Simon, it's certainly a sui generis typeface as it shows influence from grotesque, geometric and humanist sans alike. </p>
      <p>My first impression is that there are some design decisions that need to be standarized throughout the font like for example stroke modulation: some letters like the lower case e, s or t show blunt monolinearity but then some letters show widened incised style terminals and then some others show humanist sans serif style modulation like the lower case g, d, b, q and p.</p>
      <p>Round letter terminals are not uniform either: in the C and the c the upper one is slanted and then on the e and s the lower one is slanted.</p>
      <p>It's not a sin to mix styles as long as the result shows coherence. I believe you have to work on those details to give the font stylistic coherence... unless your point is to make an intentional dissonant postmodernist mix. I believe the font is going in a very interesting direction but needs a better definition of it's style.</p>
