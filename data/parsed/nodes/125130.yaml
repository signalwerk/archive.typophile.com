      <p>The Advertising style is a very good idea!</p>
      <p>One thing that immediately bugged me: the totally different style of the single and double quotes. In the context of the rest of the design, I'd go for the clean, slanted and slightly tapered single quotes. The bells on the double quotes look out of place here, and I think that if you make them square, they'd get too thick for comfort.</p>
