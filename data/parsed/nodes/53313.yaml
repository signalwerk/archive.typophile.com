    <p>I am starting a photography business and I need my type solution critiqued. I am with the icon since I use it for my graphic design business. I would like to have a sans serif with more character, but I know it can't have too much because it has to match the strength of the icon.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/LOGO_4286.jpg"></div><p></p>
    <p>Thanks,<br>
    Tom</p>
