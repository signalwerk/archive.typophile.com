    html: |-
      <p>Can you tell us a bit more about your intended use? I'm not sure I can feel a particular mood conveyed here. The wobbles and unevenness seem to have a purpose but I'm not sure I understand it.<br>
      The spacing seems way too tight.<br>
      I think the letters need to harmonise better. Compare the bowls on ceg and o...the thickness and contours are quite different. I realise you're trying to have some liveliness in there so the curves shouldn't be identical but the stress is moving around a bit too much. See what I mean by looking at Do...the curve on D looks quite monoline but on o you have a pronounced vertical stress.<br>
      Keep going :)</p>
