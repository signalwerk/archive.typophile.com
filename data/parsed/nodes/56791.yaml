      <p></p><div class="imageWrap"><img src="http://typophile.com/files/critics005_5617.png"></div><p></p>
      <p>Thanks for pointing out about the thickness of D and o - many of my uppercase is wrong by that matter, as they looka monoline.<br>
      About the intended use - when I started I didn't had particular idea in mind. I knew that it will not be a font for body text, but that's it. And I see this font as for magazines, and maybe logo, as the flow for 'qactnumpdb' is very nice. But yeah, generally for magazines in 52pt and up. And it looks really nice if body text is serif(I will post some examples with next update).<br>
      I will try out different approaches for making everything more even, as now I tried to increase vertical stress. But it looks weird, as for example S thickest part is = o thickest part, but it looks much more bigger :/<br>
      will update soon!<br>
      and thanks for comment! :)</p>
