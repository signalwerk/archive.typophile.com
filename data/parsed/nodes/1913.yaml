    html: <p>My contribution to the type suggestion pool would be TheSans &amp; maybe Sun (both from lucas fonts). The latter's a tad wierd choice(?), but maybe it'll make the logo interesting. <br>I would go in the direction of a more relaxed font. something alittle curvy and soft. <br> <br>I felt from the start [of the thread] there's something unappropriate about putting the illustration in a rectangle. I would either soften it up, as hrant suggested, or try to make the logo work without it. Maybe the frame could somehow fade in some areas.. I feel it sort of contrasts with the tranquil sleeping girl. <br>Actually, taking away the frame is probably a suggestion thats way too drastic. There are better solutions around. How about softening the joints of the face lines &amp; the frame? <br> <br>its a really really nice illustration in my opinion. the softness conveyed is lovely. <br> <br>the nostril is a hot issue here! <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> i think the current nostril is a tad too pointy. i liked the softness of the mouth and the eyebrow, and it sort of fades when you look at this nostril.  <br>Allso, I have no idea why, but this nostril looks more eastern to me. It makes her look like an indian girl. <br> <br>JPG - say, in art school, did the other boys make fun of your name? :D</p>
