    html: <p>I tried many ways to place the text (to the side ,etc.) but this way is best. I don't like my logos to be extremely long or tall (unless it is appropriate). I also like the icon being the most important thing, and any other way I have tried the text becomes the focal point. In cases where I have to fit the logo in a rectangular area I will make the icon smaller but keep it in the same place. I also have tried smallcaps and all lower. Smallcaps comes on too strong. all lower doesn't seperate the words enough (I'll be lucky to get my client to go without the period and spaces). I have attached a version all lower. If you all think it works I will try and talk them into it. <br> <br>I have moved the nostril some-is it enough? I moved it up and to the left some. I like the way the shadow is on the nostril because it is consistant with the way it hits the nose (to the bottom right).  <br> <br>The only other font I liked was Myriad (I liked Frutiger but Myriad's "e's" looked better) other than Gill Sans. <br> <br><img src="http://www.typophile.com/forums/messages/29/20082.gif" alt=""></p>
