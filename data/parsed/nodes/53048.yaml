      <p>Thank you Verbosus. </p>
      <p>I am researching the revival of neo-grotesque in the last decade.<br>
      Graphik typeface by Christian Swchartz are revival of German typefaces in the 19th<br>
      century or early 20th century. That's why I asked for Recta, one of<br>
      the typefaces that inspired Christian in the design of Graphik as well<br>
      as Plak by Paul Renner, Neuzeit Grotesk by Wilhelm Pischner, Folio and Maxima by Gert Wunderlich in Typoart foundry in RDA.</p>
      <p>I just found an article on Novarese in EMIGRE (no. 26 spring<br>
      1993) and in Etapes nº 13. </p>
      <p>If you could send me some pictures about Recta you appreciate :)</p>
      <p>thanks</p>
