      <p><cite> Looks more like Avenir. </cite><br>
      You are right Nick, in the sense that Recta appears a good compromise between Helvetica and Futura/Erbar. I always liked it because it's warmer, compared to Helvetica.</p>
      <p>Marcus: information, specifically on Recta, are not easy to find. They did not worry producing so much literature and analisys about type designs, they were more likely to proceed through work, and to concentrate on the work's results afterwards.</p>
