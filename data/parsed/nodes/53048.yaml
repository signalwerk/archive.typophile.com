      <p>Hi Marcus. There is some stuff on the Web, like <a href="https://web.archive.org/web/20150123164357/http://grainedit.com/2008/06/17/aldo-novarese-recta-san-serif-typeface-for-nebiolo/" rel="nofollow">this post on grainedit.com</a> that shows some pictures. I have a complete specimen back at my office but I’m moving back to the UK tomorrow so I won’t be able to access it any time soon. Lots of people have Nebiolo specimens these days, anyway. Recta is indeed a pretty big family modeled after Frutiger’s Univers in the sense it has the same kind of rational system behind its weights/widths.</p>
      <p>As far as I know there aren’t any available good digital versions. A guy called Derren Wilson <a href="https://web.archive.org/web/20150123164357/http://www.iliveonyourvisits.com/?p=121" rel="nofollow">posted to his blog a call to arms to digitise Recta in 2002</a>, then <a href="https://web.archive.org/web/20150123164357/http://www.iliveonyourvisits.com/?p=180" rel="nofollow">started doing it himself a couple of months later</a>, but as far as I know he never went further than what’s posted there: lowercase, uppercase and numbers from a single weight with no italics and dodgy spacing, unfinished.</p>
      <p>The biggest issue with reviving typefaces from Nebiolo is related to licensing anyway. In some cases it’s easy to attribute the design to a single individual such as Novarese, but it’s unclear wether the rights to some other designs belong to him (thus to his heirs) or to Nebiolo, or maybe to some other designer like Alessandro Butti or Giulio da Milano or… If they belong to Nebiolo, which closed in the 70’s, as far as I know what was left of the company was sold to FIAT, Italy’s main automobiles producer, but tracking exactly a contact to enquire about the rights to the Nebiolo stuff sounds like a nightmare in such a big organisation.</p>
      <p>Not all is lost though: there’s a small group of people including me, Claudio Piccinini, Piero De Macchi, Enrico Tallone and others, who are actively researching Nebiolo’s history so maybe things will become more clear in the future. When exactly I can’t tell now, but that is my hope.</p>
