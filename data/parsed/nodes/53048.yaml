    <p>Hi.<br>
    I'm looking for information about Recta, a sanserif typeface by Aldo Novarese designed in 1958 while Novarese serving as the art director at the Nebiolo type foundry.Its considered a version of Helvetica/Univers in Italy. Does anyone have information about this typeface? images? typespecimen? </p>
    <p>thanks ¡¡</p>
