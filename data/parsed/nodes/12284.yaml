    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : Designiq</strong></p>
    <p>Graphic studio of <a href="/wiki/Filip%20Blazek" class="freelinking" rel="nofollow">Filip Blažek</a> was founded in 1997, since 2003 the company name is Designiq. Its focus lies in three main fields — the creation of logotypes and corporate identity, promotion of organisations focusing on cultural work, and consulting services for type designers and type foundries.</p>
    <p>The studio employs well educated designers with long-term experience. The studio also works in cooperation with experienced part-time employees (photography, architecture, programming, etc.) and long approved printing presses.</p>
    <p>Services</p>
    <p>Graphic design</p>
    <p>— logotype and corporate identity designs<br>
    — design and implementation of magazines, annual reports and brochures<br>
    — book layout, typesetting, cover designs<br>
    — design and implementation of web pages<br>
    — posters and promotion materials<br>
    — and more...</p>
    <p>Typography</p>
    <p>— support for creating multilingual fonts, including plain or class-based kerning for PC and Mac<br>
    — designing correct diacritics respecting local tradition<br>
    — repairs of old typefaces, conversion of typefaces between Mac and PC platforms<br>
    — individual Python scripts for FontLab</p>
    <p>Consulting</p>
    <p>— help with choosing a suitable typeface<br>
    — consulting the shape, size and position of diacritical marks<br>
    — analysis of present graphic design of newspapers and magazines<br>
    — participation in committees that choose the right graphic design for a certain purpose </p>
    <p><a href="http://www.designiq.cz" title="http://www.designiq.cz">http://www.designiq.cz</a></p>
