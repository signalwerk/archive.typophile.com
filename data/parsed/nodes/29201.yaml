      <p>One possibility, suggested by the extra S, T and E: someone was making movable letters for a sign board. I have a few sets of these, along with a nifty backlit sign. The letters are a gothic style (something like yours), and they're printed on heavy, white plastic cards. You make up the words letter by letter, sliding the cards into a slot on the front of the sign. I got the whole deal for a few bucks at a yard sale. It even included a box of dingbats, arrows and punctuation. Couldn't afford NOT to get it! (Now guests in my living room amuse themselves by making absurd messages.) Just one possibility.</p>
      <p>Skylar</p>
