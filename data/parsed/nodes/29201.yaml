    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ap_6302.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/qz_4761.jpg"></div> I partly post this to see if anybody can take a crack at what typeface this is based on, most likely hand done. But I was wondering if anyone can give me some insight about these screens. I bought them in a junk shop, apparently they had been there a long time. The ink is still on them. At first I had guessed it was used by sign painters, but it seems impractical for individual letters to have a screen that big. Why would someone need a complete alphabet like this?<p></p>
    <p>*Note the % and ! as well as the extra s,t,e. They are about 4.5 feet wide and 2 feet tall. The letters are approximately 10 inches high. Thanks</p>
