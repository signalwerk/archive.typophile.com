    html: <p>Thanks for the feedback. Skyfein, I thought about the moveable letters before also, and that makes the most sense to me. Now that I think about it more, the inclusion of the ! and the % but not any other glyphs seems important. Stores advertising sales and other events would definitely use 50% off, and SALE! Although there aren't any numbers. Makes the most sense though. Thanks.</p>
