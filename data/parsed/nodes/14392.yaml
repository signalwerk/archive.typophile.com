    <p>Does anybody know the typeface used in the Lancome logotype?</p>
    <p>It’s on <a href="https://web.archive.org/web/20081012025510/http://www.lancome.com/" title="www.lancome.com">www.lancome.com</a> - and in every department store cosmetics counter - and attached.</p>
    <p>Elegant, balanced, fine contrast. Are there any other faces that share the same stylistic cues? </p>
    <p>Thanks and regards,<br>
    David Perkins</p>
