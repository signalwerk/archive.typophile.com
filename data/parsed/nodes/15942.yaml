      <p>&gt; As if there was only one Bodoni!</p>
      <p>That's a very good point. And Tiffany (with her "You do need to find a version, such as ITC 12, that has had the contrast minimized") alluded to that too. What I wonder about though is the "essence" of Bodoni, and if optically corrected version with reduced stroke contrast are still Bodoni... And who decides? I wonder about a test like this: put three settings at let's say 10 point: Times, ITC Bodoni-6, and ITC Bodoni-72. Ask people which one, and also which two, is/are Bodoni. What answers would you get, from what type of people? My hunch is that the more you ask people who matter (people proportionally distant from type designers) the more the Bodoni-6 looks closer to Times than to "Bodoni"...</p>
      <p>So I think that scale actually throws off our attempts to apply a consistent style, at least to some extent. The more readable you want to make the smaller sizes of a "stylish" design, the more you're going to have to act pragmatically, to the point of dumping a big chunk of the style. There is a threshold between Display and Text, and since the former is where conscious deliberation of style and formation of perceptions of style happens, while in the latter the participation of style undergoes neutering, it's pretty unclear to me what something like "Bodoni" actually means in text sizes.</p>
      <p>&gt; one wouldn’t use any of these for text anyway.</p>
      <p>Nick, what say you?</p>
      <p>hhp</p>
