      <p><em>Bodoni is a bad choice for text</em></p>
      <p>As if there was only one Bodoni! We’ve been setting a magazine in Filosofia, Zuzana Licko’s Bodoni, very successfully for a dozen or so issues. And I am the first one to complain about type being too small, too contrasty and too tightly tracked. ITC’s Bodoni is ok as long as you use the smaller sizes, and if it wasn’t for other reasons, I’d use GG Lange’s Bodoni Old Face which is warmer and less contrasty than Monotype’s and most other Bodonis. Futura actually goes well with most other serif faces, as long as the x-height doesn’t approach ITC levels from the 70s. Futura  – if tracked enough – makes for even, well-balanced and quiet lines, so the text to go with it simply needs to avoid looking too constructed and mechanical. In other words: no ITC Garamond, no Didot, no Bauer Bodoni. Then again, one wouldn’t use any of these for text anyway.</p>
