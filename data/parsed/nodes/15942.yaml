    <p>hi all, a buddy of mine here at our office is working on a redesign of one of our small mags (small as in small format...roughly 9"x5") he was thinking of trying out variations of futura for headlines (thin to thick) but could not settle on a good solution for a body text. he asked me and i couldn't think of anything suitable off the top of my head so i'd like a little help. anyone have some good suggestions?</p>
    <p>best<br>
    -will</p>
