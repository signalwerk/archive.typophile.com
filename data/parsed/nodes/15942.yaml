      <p>Nick, I've been publishing -in fact selling- fonts since 1982. Only bitmap ones at first (although in Armenian and Arabic, the latter being pretty hard to pull off on an 8x8 grid), but both bitmap and outline fonts since 1987. You can't spend 10 minutes in any heavily-Armenian-populated area (including Toronto) without running into one of my fonts. Yes, my reach is not very broad (yet) but in my niche I'm everywhere. I have won a couple of awards (and I can smell another coming very soon), have been asked to speak at 7 or 8 international type conferences (some of them paid), have given talks in colleges, have 3 open invitations to speak around the world (about anything I find suitable), and have had articles published in various magazines. I will be teaching a type design course at the Art Center starting January. I've done font work for Disney, UCLA, Liverpool University, Agfa, the Israel Postal Authority, Ikea, and many smaller outfits. And I manage to sell <cite>betas</cite> of my fonts for up to $250. As for readability research, although I haven't run my own lab tests or anything, I've been amalgamating the results and thoughts of dozens and dozens of researchers and pundits for 7 years, to the point that people pay me (one time over $1500) to talk about it.</p>
      <p>So it simply doesn't add up that I'm a clueless idiot that everybody should ignore about everything - face it. Just because we disagree doesn't mean one of us is an idiot. And then realize why you keep insisting I'm a clueless idiot: your ego is hurt, and you're at a loss as to how to control me (the uncontrollability of an inexpensive, global discussion forum being something quite unnerving to people who are used to controlling the "internal artistic consistency" of their work for years, insularly) so you lash out and thump your chest. Well, you can't control me. And any "strategy" to subdue me can never work, come on. It makes you feel better? That's sick - even I give you more credit than that. If this debacle is any single person's fault, and if it's any single person's loss, to me it's clearly yours. Not because I'm a perfect person (not even close) but simply because the onus is on you to get a hold of yourself, to <cite>tolerate</cite> - just like I tolerate you. I have not once complained about your manners or attacks - only your content.</p>
      <p>Anyway, coming back to your alpha-male obsession with accomplishments: I think all of that (including my stuff above) is secondary; your own propensity to sell pretty display fonts is secondary. What really matters to me (and many other people) is a humble respect for the craft and its progress; not with expressing myself and milking anything and everything for my own material or egocentric benefit. To me type is in large part about readability, and Nick, you don't know jack about readability. How could you, being a believer in the Emigre mantra? You can only make text fonts by a combination of mimickry and dumb luck (and you're not alone). Which isn't so bad - I know and admire numerous people who make good display fonts, even better than you. The difference is they admit that they're making display fonts. And most of them realize they're not god's gift to type. You don't manage to do either. You think you're hot stuff. Puhleeze. You're just middle of the pack, and moreover you're stuck in a rut because you think you've arrived; at least I know -as I said in my Daidala interview*- that I haven't really done anything notable yet, which means I have a world of growth left.</p>
      <p>* <a href="http://www.daidala.com/25apr2004.html" title="http://www.daidala.com/25apr2004.html">http://www.daidala.com/25apr2004.html</a></p>
      <p>As the Eunoia-Text thread proved, no amount of gentle coaxing -even by people who often agree with you and see nothing at all wrong with the space between your ears- that you shouldn't call your daughter George seems to work. And my attempts to slap you awake haven't worked either. No amount of anything is making you see the huge gaping hole in your type knowledge. Just because you fool some people into thinking you know what you're doing in the realm of text is only helpful to your pocketbook and ego; not really to other people. And to me, Design is about other people.</p>
      <p>Culture isn't about making and selling fashion items.<br>
      And what's not about you, Nick, is Craft.</p>
      <p>hhp</p>
