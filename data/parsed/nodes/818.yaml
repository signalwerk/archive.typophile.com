  - id: 5972
    user: 1
    date: 2002-07-05T00:04:00
    date_raw: 5 Jul 2002 — 12:04am
    votes: null
    html: "<p> I appreciate that though it is a lineal it's not just bezier strokes. <br> <br>Some comments: <br> <br>The angle you use consistently throughout the face is successful. It gives the face a unique feel. There are some places where it doesn't quite work for me, though. For example, it works on the c and the e, but doesn't work on the B or the D. You might try straightening out the bottoms and keeping the slant on the tops of the B and the D. It works really well on the P and the R.  <br> <br>The 's' needs some work. It looks like the inconsistency on the bottom is supposed to relate to the c,t,g,e etc, but it doesn't communicate that relationship very well. Maybe slant the top of the s at the same angle, or ditch the slant on the bottom. <br> <br>The misalignment of the v and the w are too subtle; they look like a mistake instead of a choice. I would leave them off. <br> <br>The tail on the y doesn't relate to its body. I would shorten the cross bar on the G; it creates on awkward space. <br> <br>I'm with max on the f. It could work if it were opened up. The w isn't consistent with the rest of the face; the space on the right is really jarring. <br> <br>Good start. This is a face worth polishing.  <br> <br>cr </p>"
    html_clean: "<p> I appreciate that though it is a lineal it's not just bezier strokes. <br> <br>Some comments: <br> <br>The angle you use consistently throughout the face is successful. It gives the face a unique feel. There are some places where it doesn't quite work for me, though. For example, it works on the c and the e, but doesn't work on the B or the D. You might try straightening out the bottoms and keeping the slant on the tops of the B and the D. It works really well on the P and the R.  <br> <br>The 's' needs some work. It looks like the inconsistency on the bottom is supposed to relate to the c,t,g,e etc, but it doesn't communicate that relationship very well. Maybe slant the top of the s at the same angle, or ditch the slant on the bottom. <br> <br>The misalignment of the v and the w are too subtle; they look like a mistake instead of a choice. I would leave them off. <br> <br>The tail on the y doesn't relate to its body. I would shorten the cross bar on the G; it creates on awkward space. <br> <br>I'm with max on the f. It could work if it were opened up. The w isn't consistent with the rest of the face; the space on the right is really jarring. <br> <br>Good start. This is a face worth polishing.  <br> <br>cr </p>"
