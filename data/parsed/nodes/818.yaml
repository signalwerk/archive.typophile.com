    html: <p> I have seen several of the typographic elements that are going on in work by Darren Scott. I liked this type of work a lot when I first saw it but there is too much of it on the market these days.I like the idea but it just doesn't quite work yet. Perhaps too many things are going on.  <br>A bit of Sibylle Hagmanns' Cholla, some Darren Scotts'Hydrate or Aggregate, etc. I would keep going with this design by simplification. Think about userbility and consider eliminating or toning down some of the untraditional elements. </p>
