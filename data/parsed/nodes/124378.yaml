    <p>I wrote/designed a book! All about A-holes! You know, that negative space found in the letter 'A'? This is my first kickstarter campaign. This book takes my passions in life, both graphic design and humor and makes a pretty wonderful mash-up. </p>
    <p>I am writing in hopes you can help spread the word! Check my kickstarter campaign link below to learn all about the details!<br><a href="https://www.kickstarter.com/projects/1713840944/a-holes-a-type-book">https://www.kickstarter.com/projects/1713840944/a-holes-a-type-book</a></p>
    <p>Thank you!<br>
    - Curtis</p>
    <p>@CSACreative</p>
