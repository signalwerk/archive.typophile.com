      <p>I think MS Office is an excellent tool for what it was intended for—office documents and correspondence. Unfortunately, a lot of people use it for unintended purposes because it is the software they have available. When I worked for a printing company, it wasn't uncommon for us to get business card "production-ready" artwork prepared in PowerPoint.</p>
      <p>If Office users want small caps, they'll have to use font solutions to compensate for the program's "shortcomings."</p>
