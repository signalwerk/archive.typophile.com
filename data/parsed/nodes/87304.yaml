      <p>@oldnick. There is a chart on the internet that tells what apps support what features, and maybe Office users should look at it and figure out on their own that Office doesn't support opentype features very well. I guess you could look at it from the point of view that if they don't know Office's capabilities before buying your font, it's not your fault.</p>
      <p>Maybe I should just ignore Office's shortcomings and expect the users of my font to have better software.</p>
      <p>When I used to work at Kinko's we had a policy that we would not accept Word or other Office documents for printing, because we didn't want to be held responsible for the results. We required the customer to create a pdf and we would accept that. Later, I worked for a printer and the owner was so desperate for business, he would bend over backwards for his customers and accept any type of format. If it was a publisher file, he would spend more money on paying me or one of the other guys to strip it apart and get it into InDesign than he would ever recoup from the customer, who we usually never saw again regardless of how much we invested into pleasing them.</p>
