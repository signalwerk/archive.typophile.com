    <div class="info">Submitted by <a href="/user/7006" title="View user profile.">paul d hunt</a> : 3.Jul.2007 11.53am </div>
      <p>July 3, 2007. Boston.</p>
    <p>Font Bureau, Inc. is proud to present two new script families for summer, whether you’re celebrating a friend’s wedding or baseball season:</p>
    <p>CASEY - a fat-bottomed script in 3 weights</p>
    <p>Casey, Leslie Cabarga’s latest script, recalls “Casey at the Bat,” Ernest Lawrence Thayer’s vivid old baseball poem. Once, fat-bottomed scripts like Casey were everywhere. Today they barely survive as logos for Campbell’s soup, Ford, Coca Cola, and, of course, the Dodgers, yet no recent baseball jersey has been complete without lettering embroidered in this classic form. Cabarga restores the swinging style to current typographic usage; FB 2003–07</p>
    <p><a href="http://www.fontbureau.com/fonts/casey" title="http://www.fontbureau.com/fonts/casey">http://www.fontbureau.com/fonts/casey</a></p>
    <p>BISCOTTI - an informal script in 2 weights</p>
    <p>Biscotti was commissioned in 2004 by Gretchen Smelter and Donna Adjerian for Brides magazine. “We want a typeface that makes the reader feel pretty; it should capture the voice of this happy occasion.” Cyrus Highsmith has prepared a radically simple descendant of the flourished engraved scripts traditionally deemed suitable for such formal occasions, a 21st century typeface that captures the smiling spirit of these classical forms; FB 2007</p>
    <p>Biscotti is available exclusively in OpenType format.</p>
    <p><a href="http://www.fontbureau.com/fonts/biscotti" title="http://www.fontbureau.com/fonts/biscotti">http://www.fontbureau.com/fonts/biscotti</a></p>
    <p>==================== NEWS ======================</p>
    <p>TYPE 101</p>
    <p>Font Bureau founders David Berlow and Roger Black are noted early adopters, sometimes to a punishing extent if a new technology flops. However, after much review, it seems this blog thing has caught on. Welcome to Type 101, Font Bureau’s corner of the web to feature the extracurricular typography discussed, taught, and pondered by our staff. Perhaps we will even offer some sneak previews of upcoming fonts as the blog progresses. Lecture transcripts and views upon the future of screen type legibility have already been archived. Come join the discussion.</p>
    <p><a href="http://type101.fontbureau.com/" title="http://type101.fontbureau.com/">http://type101.fontbureau.com/</a></p>
    <p>Type 101 RSS feed: feed://type101.fontbureau.com/feed/</p>
    <p>——</p>
    <p>ELMHURST EXPANSION</p>
    <p>Christopher Slye’s Elmhurst gains two new styles. Bold Italic and Black Italic were drawn for Rolling Stone and are now available for relicense.</p>
    <p><a href="http://www.fontbureau.com/fonts/Elmhurst/styles" title="http://www.fontbureau.com/fonts/Elmhurst/styles">http://www.fontbureau.com/fonts/Elmhurst/styles</a></p>
    <p>——</p>
    <p>MORE CUSTOM TYPE UNVEILED</p>
    <p>Our Custom section grows with the addition of Vonness, commissioned by Neville Brody for Macromedia.</p>
    <p>——</p>
    <p>CYRUS HIGHSMITH BACK FROM HOW CONFERENCE</p>
    <p>Cyrus Highsmith just got back from the HOW conference in Atlanta where he gave his “Thousands of Tiny Drawings” lecture to scores of designers of all stripes. For those of you who could not make it, keep an eye on Type 101 for more of those Tiny Drawings.</p>
    <p>================================================</p>
    <p>For more information or to request a press kit, please email <a href="mailto:info@fontbureau.com">info@fontbureau.com</a> or call Harry Parker or Robb Ogle at 617 423 8770.</p>
    <p>Best Regards,</p>
    <p>Harry, Samantha &amp; Robb<br>
