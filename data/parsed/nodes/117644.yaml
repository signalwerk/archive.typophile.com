      <p>Presumably the image is from a Mechanix Illustrated from the 1950s?<br>
      Numbers are wrong for Excelsior but are closer to Century 731 BT , available since 1929 as Textype, <a href="http://www.myfonts.com/fonts/bitstream/century-731/" title="http://www.myfonts.com/fonts/bitstream/century-731/">http://www.myfonts.com/fonts/bitstream/century-731/</a> Also Egizio, but  2 is off,   <a href="http://www.identifont.com/show?618" title="http://www.identifont.com/show?618">http://www.identifont.com/show?618</a> available since the mid 1950s.<br>
       Still checking.<br>
      Don</p>
