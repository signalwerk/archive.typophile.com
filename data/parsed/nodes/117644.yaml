      <p>I'll support your initial assumption for Century - due to some little details on serifs...<br>
      More specifically it looks to me like <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Bitstream&amp;ffam=Century731%20BT%20-%20Roman&amp;fid=6872b0037ff4e5dcfefd0bc31a1ee514&amp;fsize=36&amp;text=counts%20began%20referring%20Second%20Party%20Rescuing%20But%20professional%20difficult%20On%20Sno-Cats.%20In%201950&amp;wrap=2" rel="nofollow">Century731 BT (Roman)</a></strong> from Bitstream.<br>
      The numerals ("1950") is also an accurate match for Century while they are totally different in Excelsior.</p>
