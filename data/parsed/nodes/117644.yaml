    <p>I think this face may be Excelsior, but I can't quite tell from the sources I have handy for the appearance of that face.</p>
    <p>Note that the x-height is not extravagantly large, but the descenders are very small. A nice-looking face; originally I had mistaken it for a wider version of Century Expanded.</p>
