    html: '<p>I prefer the first version of the design with the font "Spring LP Std", but as you may know the "LP" is a trademark of LetterPerfect Design. <br>In general Spring is contemporary font of the 90s and depicts the contemporary spirit of that period.  <br>  "Minion" even though a great balanced font would not work good for you on this logotype.  <br>  The flower stands quite ackward with Minion. As I said before you might need a different positioning. <br>  Maybe try some of the following : ITC Edwardian Script , Florens LP Std, Lucida Calligraphy (Handwriting) or even Script MT Std. <br> <br>Salute</p>'
