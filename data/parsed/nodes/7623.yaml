    date_raw: 11 Nov 2004 — 6:10am
    votes: null
    html: <p>It all depends on what the emphasis should be. The first post has an equal balance between the word and the logo. This makes the logo feel less important the Minion version puts more emphasis on the logo which inturn feels extra special. I feel like the first version almost doesn't need the logo because the script is so graphic in itself. I myself prefer the Minion version <br>(although I'm not convinced on the italic.) By introducing Minion or a similar text/display face you will visually be able to connect the logo with other design elements within your identity (ie buisness card font, letterhead type, and whatever else you would need a hard working serif style typeface.) I think the memorability of the logo will come from the special r symbol you have created. The script is also hard to read at small sizes. Not to mention if the script is set in 10 point it will appear completely phony and reproduced. Conceptually if a script isn't printed at a handwritting size than I feel it is being used wrong. However that is my extremest opinion. Again, in my opinion, The Minion Version has more potential to be a solid identity.</p>
    html_clean: <p>It all depends on what the emphasis should be. The first post has an equal balance between the word and the logo. This makes the logo feel less important the Minion version puts more emphasis on the logo which inturn feels extra special. I feel like the first version almost doesn't need the logo because the script is so graphic in itself. I myself prefer the Minion version <br>(although I'm not convinced on the italic.) By introducing Minion or a similar text/display face you will visually be able to connect the logo with other design elements within your identity (ie buisness card font, letterhead type, and whatever else you would need a hard working serif style typeface.) I think the memorability of the logo will come from the special r symbol you have created. The script is also hard to read at small sizes. Not to mention if the script is set in 10 point it will appear completely phony and reproduced. Conceptually if a script isn't printed at a handwritting size than I feel it is being used wrong. However that is my extremest opinion. Again, in my opinion, The Minion Version has more potential to be a solid identity.</p>
