  html: <p>This client creates greeting cards with flowery designs on the front. Each card is handmade and one card is different than the other. <br> <br>The objective is to design a logo that would capture the originality of these greeting cards, and yet be general enough to be placed on similar products as well, e.g. large flower pictures. <br> <br>This logo is meant to be placed on the backside of the greeting cards. <br> <br>I would appreciate some feedback on the following draft. <br> <br>For now I have kept it all one colour, to concentrate on shape and balance, but also because the logo might alternatively be embossed on the cards. <br> <br>Thanks all for your help! <br> <br><img src="http://www.typophile.com/forums/messages/29/53252.gif" alt=""></p>
  html_clean: <p>This client creates greeting cards with flowery designs on the front. Each card is handmade and one card is different than the other. <br> <br>The objective is to design a logo that would capture the originality of these greeting cards, and yet be general enough to be placed on similar products as well, e.g. large flower pictures. <br> <br>This logo is meant to be placed on the backside of the greeting cards. <br> <br>I would appreciate some feedback on the following draft. <br> <br>For now I have kept it all one colour, to concentrate on shape and balance, but also because the logo might alternatively be embossed on the cards. <br> <br>Thanks all for your help! <br> <br><img src="http://www.typophile.com/forums/messages/29/53252.gif" alt=""></p>
