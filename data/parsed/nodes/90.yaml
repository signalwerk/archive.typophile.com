  html: "<p> I think this is a great notion from an earlier Hrant: <br> <br>\"Hmmm. Would it be nice to have a \"Classified Ads\"  <br>section in Typophile? People could offer their fonts for  <br>licensing - it could even become an alternative to  <br>submitting to a font house: font houses would come  <br>here to see what's for \"sale\".  <br> <br>Or maybe make it a subsection of the Critique forum:  <br>finished faces could get an announcement there, citing  <br>the intentions of the designer. I think the News section  <br>wouldn't really work for this type of thing.\" <br> <br>A simple discussion of licensing options and houses  <br>would be of great help to new designers. <br> <br>Stephen </p>"
