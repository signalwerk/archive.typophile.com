  html: <p>Artist For Modern Livin (AFML) is a new company that produces glass and ceramic tiles, vases, decorative and functional glass and ceramics. Greatest influence on the products is mostly Bauhaus school of design. Simple, geometric, and affordable for the people. Artists are German and American. Fabrication is done in one of the worlds largest glass facilities in China. I had three rules to work by. Make logo design reflect aesthetics of Bauhaus era / theory. ALM (no F wanted) should be legible. Icon not required, in fact a typographic solution is desired. Must be designed to be chemically etched (reversed on glass/ stampable on ceramics.<img src="http://www.typophile.com/forums/messages/29/67212.jpg" alt="Artist for modern living"></p>
  html_clean: <p>Artist For Modern Livin (AFML) is a new company that produces glass and ceramic tiles, vases, decorative and functional glass and ceramics. Greatest influence on the products is mostly Bauhaus school of design. Simple, geometric, and affordable for the people. Artists are German and American. Fabrication is done in one of the worlds largest glass facilities in China. I had three rules to work by. Make logo design reflect aesthetics of Bauhaus era / theory. ALM (no F wanted) should be legible. Icon not required, in fact a typographic solution is desired. Must be designed to be chemically etched (reversed on glass/ stampable on ceramics.<img src="http://www.typophile.com/forums/messages/29/67212.jpg" alt="Artist for modern living"></p>
