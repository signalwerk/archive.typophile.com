      <p>&gt;But FontFont said that sometimes PCs perceive a font as OT when really it isn’t.</p>
      <p>In Windows CFF (PostScript) flavor OpenType and digitally signed TrueType fonts (techncially OpenType regardless of extra featres) get the ’O’ icon. </p>
      <p>Cheers, Si</p>
