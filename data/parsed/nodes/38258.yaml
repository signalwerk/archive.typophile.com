  html: |-
    <p>Hello all,</p>
    <p>I had to upgrade (re-purchase) my version of Meta because I was building<br>
    a template for a client and I wanted us both to be working with the same<br>
    version of Meta. I’m on a Mac, they’re on PC.</p>
    <p>Anyway, I bought the regular Mac postcript version and told them to do<br>
    the same. But they bought Open Type. When I got to their office and opened<br>
    the file, the naming conventions for the the 2 versions of Meta were going to<br>
    all have to be changed in my style sheets.</p>
    <p>So _I_ upgraded to Open Type and redid all my style sheets. Then sent them<br>
    the new file and still the same problem. </p>
    <p>Now they say they may not have purchased Open Type. But that would mean<br>
    one of the templates had to have worked. </p>
    <p>By the way, I had them do a screenshot and oddly, the OT logo is next to the<br>
    font names. But FontFont said that sometimes PCs perceive a font as OT when<br>
    really it isn’t.</p>
    <p>I’m awaiting feedback from FontFont. In the meantime, does anyone know if<br>
    there is usually this font name problem? FontFont insisted that if we bought<br>
    the same version, even cross platform, the names used for each style would<br>
    be identical.</p>
    <p>I just want to know if it’s typical to have to change the style sheets to reflect<br>
    the names used on the other system.</p>
    <p>Thanks,<br>
    Jane</p>
