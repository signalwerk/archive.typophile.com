    html: <p>Try contacting the Washington DC AIGA, the DC Art Director’s Club, and DC area design firms. Many federal agencies and contractors require copies of presentations and only accept Powerpoint files. This has created a market for good Powerpoint presentations and local designers are all over it.</p>
