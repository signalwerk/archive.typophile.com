  html: |-
    <p>I’m working on a book and I need good examples of presentation slides.  I want slides that are clear, compelling, and informative.   They can be PowerPoint, Open Office, or anything else.  Preferably they would be from real presentations rather than samples.</p>
    <p>Where should I look for really good slides?  Do you have any to share?  Post a link to a really good one and I might feature it in my new book.</p>
    <p>Thanks,<br>
    Zack</p>
