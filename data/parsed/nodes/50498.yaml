    html: |-
      <p>Next time in the future get your self a mac and buy an application called “Keynote”. Its better, and cleaner then PowerPoint.</p>
      <p>As for the layer, I would use Helvetica Bold as your font, keep every sentence on the left, and align the text. Set the background black and the font white. thats probably the most beautiful color combination there is, also you show contrast so it’ll be easier to read. </p>
      <p>It’ll look good.</p>
