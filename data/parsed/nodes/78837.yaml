    html: |-
      <p>I would go to three columns and less leading.<br>
      That seems more like a magazine, less bookish/brochurey.<br>
      Also, never run body text across a halftone, even if faded.<br>
      You might want to consider adding some lighter weights in the heads (possibly of Chaparral) to spice up the visual interest.</p>
