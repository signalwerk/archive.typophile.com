    <p>Hey there all,</p>
    <p>I'm a new-to-Typophile print designer of the campus magazine at my uni. It's 16*23cm (~6.3*9 in) and there's plenty of content every month, so the space I can work with is really very limited. </p>
    <p>A recent idea of mine is to pair up Avenir and Chaparral Pro in this magazine. The former for titles, the latter for body text.</p>
    <p>What's your opinion of this combination? It would be great to hear what you think as I'm in no way an expert on print design. The way I see it, this solid slab serif provides good readability (which is a key factor for me here) and Avenir complements it really well, with the diverse weights and whatnot.</p>
    <p>Samples:<br>
    <a class="freelinking external" href="http://i56.tinypic.com/nx9rut.jpg" rel="nofollow">Regular 1</a><br>
    <a class="freelinking external" href="http://i53.tinypic.com/16hp01j.jpg" rel="nofollow">Regular 2</a><br>
    <a class="freelinking external" href="http://i51.tinypic.com/28v4vas.jpg" rel="nofollow">Light 1</a><br>
    <a class="freelinking external" href="http://i54.tinypic.com/ak7fqb.jpg" rel="nofollow">Light 2</a></p>
    <p>Light or regular? Thoughts in general?<br>
    Thanks in advance.</p>
    <p>EDIT:</p>
    <p>Taking penn's advice, here's a PDF sample of the <a class="freelinking external" href="http://konyveim.com/tatkontur_reg.pdf" rel="nofollow">regular</a>, and the <a class="freelinking external" href="http://konyveim.com/tatkontur_light.pdf" rel="nofollow">light</a> version.</p>
    <p>Nick, I will try a 3-column design, I'm just worried that it'll be too cramped to be read comfortably (approximately ~1.8 inches per column).</p>
