    html: |-
      <p>In case you don't feel comfortable with adjusting the script, <a href="http://kltf.de/stuff/CompareComponents.zip" rel="nofollow">here is one</a> that I think does what you need. Open exactly two fonts and run it. It compares all glyphs and reports glyphs whose number of components differs. Glyphs are identified by name, so glyph names should match in both fonts.<br>
      (I guess that one of your glyphs carries two identical and same-positioned components which easily goes unnoticed.)</p>
