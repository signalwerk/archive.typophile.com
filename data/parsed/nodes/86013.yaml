  html: |-
    <p>Hi all</p>
    <p>Is there a fontlab function or a macro to highlight the composites in a font. I'm using fontQA to validate a font and it reports that one weight has more composites than other weights.<br>
    It's not a critical problem but i would like to know where the extra composites came from.</p>
    <p>ttmt</p>
