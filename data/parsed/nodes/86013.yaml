    html: |-
      <p>I got this from Atila Korap at Linotype. The version with working indents is at <a href="http://codepad.org/0VV7nHfD" title="http://codepad.org/0VV7nHfD">http://codepad.org/0VV7nHfD</a></p>
      <p>__doc__ = '''Marks glyphs that have components.'''</p>
      <p>from FL import *</p>
      <p>for g in fl.font.glyphs:<br>
      	if len( g.components) &gt; 0:<br>
      		if len(g.nodes) == 0:<br>
      			g.mark = 25</p>
      <p>fl.UpdateFont(-1)</p>
    html_clean: |-
      <p>I got this from Atila Korap at Linotype. The version with working indents is at <a href="http://codepad.org/0VV7nHfD" title="http://codepad.org/0VV7nHfD" class="link-external">http://codepad.org/0VV7nHfD</a></p>
      <p>__doc__ = '''Marks glyphs that have components.'''</p>
      <p>from FL import *</p>
      <p>for g in fl.font.glyphs:<br>
      	if len( g.components) &gt; 0:<br>
      		if len(g.nodes) == 0:<br>
      			g.mark = 25</p>
      <p>fl.UpdateFont(-1)</p>
