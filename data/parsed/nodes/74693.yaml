    html: |-
      <p>@tedbreakmore</p>
      <p>You beat me to it. Thanks. I was going to post this question because I'm getting this message quite frequently also.<br>
      It would be nice if the error message was at least grammatical, eh?</p>
      <p>I assumed bbox meant the bounding box (see the FL documentation), but this is a per-glyph thing and I couldn't see how one could have ascender/descenders sum to that.</p>
      <p>And what happens if you just say, "Hell, screw it. So it doesn't sum to the bbox size. Big deal."<br>
      Anything bad? I haven't visually seen any problems as yet.</p>
      <p>Thanks for the link, Bill. And what are you talking about - it *is* fun!</p>
      <p>rich</p>
