    date: 2010-09-28T12:22:00
    date_raw: 28 Sep 2010 — 12:22pm
    votes: null
    html: <p>This means that, in <strong>Font Info &gt; Most important font dimensions</strong>, the sum of the Ascender and the Descender <em>as a positive number</em> do not total the font's UPM size.</p>
    html_clean: <p>This means that, in <strong>Font Info &gt; Most important font dimensions</strong>, the sum of the Ascender and the Descender <em>as a positive number</em> do not total the font's UPM size.</p>
