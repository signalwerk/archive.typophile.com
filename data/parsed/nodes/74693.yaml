  - id: 431634
    user: 6470
    date: 2010-09-28T13:48:00
    date_raw: 28 Sep 2010 — 1:48pm
    votes: null
    html: |-
      <p><em>Is this because i did not have the scale button checked?</em></p>
      <p>No: it's because FontLab will generate the error message if the two numbers don't add up to 1,000, in this case. It's just something FontLab does...</p>
    html_clean: |-
      <p><em>Is this because i did not have the scale button checked?</em></p>
      <p>No: it's because FontLab will generate the error message if the two numbers don't add up to 1,000, in this case. It's just something FontLab does...</p>
