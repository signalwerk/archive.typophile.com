    html: |-
      <p>Thanks for the comments, gents. I tried the angled terminals on the X and, as Hrant surmised, it looked too much like a multiplication symbol, and seemed to be floating above the baseline. I'm intrigued by Hrant's suggestion of adding a curve to the X.</p>
      <p>Hrant, you're determined to see an uphill S, aren't you? :) If I wanted the S to be "proper," what would you suggest?</p>
      <p>Michał, do you think that if the bottom of the B was straight and parallel to the baseline that the curved top would still work? I'll take a look at the Z but am leery of chopping off the sharp points, although as the face evolves there's less of the sharp neo-Deco construction of early versions.</p>
      <p>I was also considering either rounding the corners throughout as the default (somewhere between DIN Next and Brandon Grotesque) or offering a rounded version. Thoughts?</p>
  - id: 521898
    user: 1250
    date: 2012-09-11T10:04:00
    date_raw: 11 Sep 2012 — 10:04am
    votes: null
    html: |-
      <p>I think to be "proper" in the context of this design the spine of the "S" should appear to go perfectly horizontal, probably for a good stretch. Which means: I like the spine of the very first one (the top and bottom of the newer ones are better though) just with a bit of clockwise correction.</p>
      <p>"Z": One problem is the weight distribution - the diagonal looks darker than the horizontals.</p>
      <p>BTW I'm starting to not like the "W" - it's too close to a perfect zig-zag.</p>
      <p>You can do a rounded version, but I would focus on the flat one more. In fact I might even try [a cut with] slightly <em>concave</em> (AKA "cupped") terminals, for extra definition.</p>
      <p>hhp</p>
  - id: 521910
    user: 65189
    date: 2012-09-11T11:02:00
    date_raw: 11 Sep 2012 — 11:02am
    votes: null
    html: |-
      <p>Yes, perhaps making the bottom stroke of |B| straight and parallel to the baseline will work. Or just making the curve just a bit flatter and not perfectly straight - you know it's often all about tiny details ;)<br>
      I get the point about the |X|. I think Hrant's idea is the good solution.<br>
      I don't think round corners will fit the overall spirit of the typeface. Sharp ones will create black spots and ruin the contrast (that's often the case with |Z| in such expanded fonts with sharp corners). Maybe instead of trying to tame the corners - make the diagonal stroke a curve (double turning, an "s"-like curve), something like (just a quick sketch):<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Untitled-1_4723.jpg"></div><p></p>
