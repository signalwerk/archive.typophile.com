      <p>Thanks again for all the helpful feedback. I present more refinements and fiddling:</p>
      <p>-- New X, with some offsetting/trickery to give the arms a less steep angle, which seems to help their relationship with the baseline. (I wrestled with curves for hours and couldn't produce anything I was happy with.)</p>
      <p>-- New S, which sets aside Hrant's feedback (for now) in search of the S in my mind's eye.</p>
      <p>-- Rounded Z, as suggested.</p>
      <p>-- Flat-bottomed B, with a (very) slightly higher waist.</p>
