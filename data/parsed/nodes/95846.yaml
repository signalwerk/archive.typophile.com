    html: |-
      <p>The "X" is nice of its own, and in an alphabet setting -surrounded by the other diagonal letters- it looks fine, but in a real word it stands out too much, like a pirate map location - it almost feels like it should be in red. :-)  On the other hand you might in fact have arrived at the best compromise.</p>
      <p>The spine of the "S" is working fine now - but the letter itself has become a little bit butch, probably because the top and bottom are too equal. Try making it slightly bottom-heavy, which the "B" for example already enjoys. BTW, I realize now that the bar of the "E" should come up too (or go back to matching the low bar of the "F").</p>
      <p>I think the curve-bottom "B" was better; this new one is out of character.</p>
      <p>The new "Z" isn't working for me at all - it's way out of character. The old one seems to be less of a compromise than the new "X" is...</p>
      <p>BTW, something else you could try, just to see if it clicks: inspired by the numerals, try making the tops of the "S" and "Z" narrower.</p>
      <p>hhp</p>
