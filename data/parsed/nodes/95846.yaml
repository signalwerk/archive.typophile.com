      <p>The new "S" is trying to be "proper" and failing. Maybe go the <em>other</em> way with the spine...</p>
      <p>The "6"/"9" are indeed much better.</p>
      <p>The new shears on the "V", "W" and "Y" fit nicely with new softer look of the face, and I can see how it wouldn't work on the "X", making it too much like a symbol and not a letter (although I would expect it to work on the "A"). Here's an idea: make the "X" a diagonal with the two other opposing arms <em>curvy</em>. You've got a lot of that sort of thing in your design already.</p>
      <p>hhp</p>
  - id: 521889
    user: 1062
