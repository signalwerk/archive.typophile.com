      <p>I'm looking at it some more, and I actually think this is becoming disharmonious... Compare things like the "A" to things like the "D"; with the "D" like that I'm tempted to recommend trying an "A" with a rounded top (like the French used to do in the first half of the 20th century - something that's been revived here and there recently). Now, if you can make two cuts where one is more rigid and the other more fluid*, that would be awesome, especially if each can work for emphasis in a body of the other. But if you plan on finishing one first and then <em>maybe</em> doing another, I would actually revert.</p>
      <p>* Even uniwidth being doable here.</p>
      <p>hhp</p>
