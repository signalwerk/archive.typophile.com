  - id: 522629
    user: 1062
    date: 2012-09-18T07:43:00
    date_raw: 18 Sep 2012 — 7:43am
    votes: null
    html: <p>Thanks, William. I appreciate your attention to detail. Another reviewer in other quarters made comments after looking at a distorted (squooshed!) preview that gave the font the look of bad attempt at Legato-like reverse stress. Just wanted to make sure that wasn't what was happening here.</p>
