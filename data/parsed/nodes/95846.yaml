    votes: null
    html: |-
      <p>Looking good.</p>
      <p>The "B", being so "busy", looks a bit dense. The "D" is suffering from the "bone effect"*, where a curve coming off of a straight segment looks to be bulging outward; you need to pull in the points and extend the BCPs. The "J" is too wide, but also I think a shorter top bar is in order (but not too short). The "L" is too wide; if it does make sense though the "T" needs to be wider; I have a feeling those two letters should meet half-way. The curve of the "P" seems droopy. The "Q" feels cramped at the bottom. You'll also need to modulate the tight joins in the "K" and "R". The "X" and "Z" feel distorted - they might need to be wider. The "W" seems too constructed - try lowering the middle.</p>
      <p>* This optical illusion was actually documented very well by Peter Karow many years ago.</p>
      <p>BTW, I hope you make a lowercase for this! I can picture it being quite cool.</p>
      <p>hhp</p>
