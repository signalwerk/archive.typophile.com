    html: |-
      <p>Very classy feel, nice and sleek.<br>
      |Z| is too narrow. Also, it seems a bit off with the horizontal sharp spikes, if you widen the letter it will become even more apparent. Perhaps it will be better to cut those sharp joints?<br>
      Take a look at how you end the strokes, for instance: top ends of |Y|, |V|, |W| are angled, while you've cut them in |X|. I think you should address the |X| and make it consistent with the others. While the |A| should have the bottom ends cut since it's "standing" on the baseline, every other end of stroke in a glyph should be angled (like you did in every other glyph apart from |X|).<br>
      |B| still looks awkward to me. Maybe slide out the top bowl even more. Also, considering |B|, the fact that the bowls are so bulgy (what I mean is that they exceed beneath the baseline and over the cap height) make it a bit too bubbly. It works on the |D| but with two bowls in |B| it makes it too bubbly in my opinion and while the rest of the font is classy, |B| adds unnecessary playfulness (so to speak) to it.<br>
      Congrats on the design!</p>
