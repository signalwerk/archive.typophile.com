    date_raw: 16 Sep 2012 — 1:49pm
    votes: null
    html: |-
      <p>Another thing you've got going here is the reverse contrast thing on the vertical arches. Normally to look the same these have to be thicker than the vertical strokes; here they look thinner. You're not doing reverse contrast generally; the horizontals seem to be a bit thinner than the verticals otherwise. Is this what you want? Maybe you can make it work, but right now the curves, especially the outer curves on the tight vertical arches in B and S look awkward. Or maybe it's just that the vertical arches look pinched in comparison to the other verticals and horizontals. Have you tried going more whole hog on the reverse contrast? Or fattening the vertical arches? </p>
      <p>Again, you've got something interesting going here, but I think it can benefit from further resolution.</p>
