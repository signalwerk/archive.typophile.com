    <p>Hi gang,</p>
    <p>I'd love to get your feedback on this typeface. While I've been wrangling bezier curves and setting/licensing/ogling type for a couple of decades as an art director, this is my first attempt at type design.</p>
    <p>The spacing hasn't been addressed yet -- I wanted to make sure the glyphs were solid before tackling that task.</p>
    <p>Thanks!</p>
    <p>P.S. -- See below for a link to a PDF, for those who care to inspect the shapes more closely.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/first_complete_alphabet_3545.png"></div><p></p>
