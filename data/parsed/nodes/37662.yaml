      <p>It looks like it's used all over the <a href="http://www.barneys.com" target="_blank">Barney's website</a> (click a few links to see the categories in red). I'm sorry, but I don't believe I've ever seen that font before.</p>
      <p>For future reference, John, it's the MyFonts automated WTF utility that has a max of 25 characters. For the MyFonts Forum, as here, more is generally better for identification purposes.</p>
