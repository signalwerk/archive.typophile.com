    html: |-
      <p>I went through all 25 pages of <a href="http://bowfinprintworks.com/Script11Pg1.html" target="_blank">Part 11 of Mike Y's Script ID Guide,</a> using the distinctive 'y' to try to find this font. The only font with a similar 'y' is Chas HW (which is otherwise not a match).</p>
      <p>Based on the source, this is most likely a custom job for Barneys. You could try contacting someone at <a href="http://www.theingredient.com/" target="_blank">Ingredient</a> as they seem to have designed the site.</p>
      <p> - Lex</p>
