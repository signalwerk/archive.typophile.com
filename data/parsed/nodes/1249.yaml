    date_raw: 28 Jun 2002 — 10:05am
    votes: null
    html: <p>If you are going to experiment along the lines of halftone screens, it might be an idea to experiment with line patterns instead of dot patterns, it might help reduce file sizes / complexity and can look rather nice if done well. <br> <br>As for bitmap fonts, they do exist, certainly on the Mac, and can be edited with packages like FontLab's BitFonter (<a href="http://www.fontlab.com/html/bitfonter.html" target="_top">http://www.fontlab.com/html/bitfonter.html</a>). I can't say i am too hot on the technology side of these though - perhaps you can get some useful info by downloading the manual for it? <br> <br>Enjoy <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)"></p>
    html_clean: <p>If you are going to experiment along the lines of halftone screens, it might be an idea to experiment with line patterns instead of dot patterns, it might help reduce file sizes / complexity and can look rather nice if done well. <br> <br>As for bitmap fonts, they do exist, certainly on the Mac, and can be edited with packages like FontLab's BitFonter (<a href="http://www.fontlab.com/html/bitfonter.html" target="_top" class="link-external">http://www.fontlab.com/html/bitfonter.html</a>). I can't say i am too hot on the technology side of these though - perhaps you can get some useful info by downloading the manual for it? <br> <br>Enjoy <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)"></p>
