  html: <p> Hi, <br> <br>I'm actually working on a 3D font. But it seems that it work best when using midtones instead of B&amp;W only, I'm struggling to find a solution to it. Has anybody think of a method of using images as fonts instead of having to convert everything into vectors. <br> <br>Tilou </p>
  html_clean: <p> Hi, <br> <br>I'm actually working on a 3D font. But it seems that it work best when using midtones instead of B&amp;W only, I'm struggling to find a solution to it. Has anybody think of a method of using images as fonts instead of having to convert everything into vectors. <br> <br>Tilou </p>
comments:
  - id: 9953
    user: 533
    date: 2002-06-28T07:06:00
    date_raw: 28 Jun 2002 — 7:06am
    votes: null
    html: "<p>Another solution, used by Dennis Ortiz-Lopez and others, is to create several fonts that can be layered, one on top of the other. The base font would be the letter shape itself (in solid B&amp;W form). The next font would be, say, a bevel effect, also in solid B&amp;W form, which would be printed in a greyscale or any color determined by the user of the font. Another font could be an outline layer, an inline layer, etc. <br> <br>Ortiz-Lopez' work can be seen at: <br> <br><a href=\"http://ortiz-lopez.com/index.html\" target=\"_top\">http://ortiz-lopez.com/index.html</a> <br> <br>David</p>"
    html_clean: "<p>Another solution, used by Dennis Ortiz-Lopez and others, is to create several fonts that can be layered, one on top of the other. The base font would be the letter shape itself (in solid B&amp;W form). The next font would be, say, a bevel effect, also in solid B&amp;W form, which would be printed in a greyscale or any color determined by the user of the font. Another font could be an outline layer, an inline layer, etc. <br> <br>Ortiz-Lopez' work can be seen at: <br> <br><a href=\"http://ortiz-lopez.com/index.html\" target=\"_top\" class=\"link-external\">http://ortiz-lopez.com/index.html</a> <br> <br>David</p>"
