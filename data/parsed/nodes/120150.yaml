      <p>Your numbers and symbols aren't working because you've given them invalid names. Glyph names have to be alphanumeric and start with a letter. Refer to the names of the original characters. I think you should be able to get away with "one5" even though the recommended format for a ligature would be "one_one_one_one_one".</p>
      <p>The other allowed symbol, the period, would be used if you were setting up your alternates properly (and I understand why you won't be doing that). For example, "one.ss02", accessed by Stylistic Set 2, would be truncated back to "one" upon copying out plaintext.</p>
      <p>Another problem I see is that your substitution order is upside-down. Bigger ligatures should go first, because if X X is already swapped out, X X X won't happen.</p>
