    html: <p>Sorry to be brutally honest, but I've rarely seen anything so bad. That doesn't say 70's scifi to me, it just looks incredibly poorly executed and extremely amateurish. Examine lots of typefaces, look at proportions, think about it for a long time then start again, but with smaller ascenders and descenders. There really is no point critiquing this version as there is so much wrong here.</p>
