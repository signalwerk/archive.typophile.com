      <p>On the other hand, this is how virtually all first fonts look.</p>
      <p>Indeed it wouldn't be fruitful to critique details; however it's still possible to help by providing guidance in terms of overall technical issues, by pointing out good precedents in this genre, and by trying to figure out how this effort can stand out (where for example the long extenders might actually make sense).</p>
      <p>hhp</p>
