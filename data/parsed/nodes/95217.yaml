  html: |-
    <p>This is my first real attempt at building something. The archetype is derived from the LEDish look of typefaces seen in late 70's scifi movies. I penned versions of this in my undergrad days and wanted to commit something to digital form.. and open type/webfont it. Unfortunately, I was working more or less in a vacuum before finding you. I'll do my best to adjust it based on your comments and criticism.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/scifi78-full_5746.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/scifi78_4224.png"></div><p></p>
    <p>The working files can be found here: <a class="freelinking external" href="http://github.com/timBrockman/SciFi78.git" rel="nofollow">http://github.com/timBrockman/SciFi78.git</a><br>
    Thanks in advance.<br>
    Cheers,<br>
    Tim</p>
