      <p>I would say it almost seems like a customized version of <a class="freelinking external" href="http://new.myfonts.com/fonts/adobe/gill-sans/?testdrive=custom%3D0%26dock%3Dfalse%26size%3D72%26w%3D600%26src%3Dcustom%26text%3DWORLD%2520OFFERS%2520HURGADA%26fg%3D000000%26bg%3Dffffff%26goodies%3Dfit%252Cot.liga%26seed%3D23">Gill Sans</a>, which is somewhat predictable, almost, since the British seem to have an immense fondness for Gill Sans. If you change the W and U it might be hard to tell it apart from your sample at first glance.</p>
