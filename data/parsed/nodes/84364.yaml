    <p>I am a first grade teacher searching for fonts that have an "open" "a" format - called ball and stick by some.  The "a" that I'm typing here is what we call the "book" "a" in first grade language.  What type of font should I look for?  I've been looking at sans serif fonts which typically have the "open" "a" format I'm looking for.  If you know the name of the style I'm looking for, and/or a font that you would suggest, please share, and thank you in advance!</p>
    <p>I love fonts and I'm so happy this website exists. </p>
    <p>Thank you!<br>
    Melissa</p>
