    <p>Hi all!</p>
    <p>I'm starting to develop a new logo for a new (small) company for training in psychology. In English "perfil d'alma" its "soul profile".<br>
    I dont like very much the result, but...its the owner idea (she likes it!).<br>
    My post here is more a typhographic question. The letters are not a typeface but draw from a typeface found on a old book see <a class="freelinking external" href="http://typophile.com/node/42228" rel="nofollow">here</a>.<br>
    What do you think about it? Good shapes, kerning/spacing?<br>
    Any comments apreaciated.<br>
    Thanks in advanced.</p>
    <p>António<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/logo_4805.png"></div><p></p>
