  html: |-
    <p>The definition text is some small size of Times Roman, of course. Heading looks like Futura or some Futur-alike. What is the bold text font? Printed in 1967, composited by R.R. Donnelly in Chicago. This is Webster’s Seventh New Collegiate dictionary, which I grew up with as a child.</p>
