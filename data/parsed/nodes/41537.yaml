    html: |-
      <p>&gt; You should NEVER use a debit card online. You loose all the protections that a credit card can give you.</p>
      <p>In the US, it depends on when you notify your bank of the problem. If you do it within two days, your liability is $50, just like a credit card, but if later than two days, your liability could be as much as $500. After 60 days, your liability is unlimited. The real problem is that a thief could drain your entire bank account and you'd be out that money during the time it took the bank to investigate and decide to restore your funds. See the Federal Reserve website on EFT <code class="freelink freelink-error freelink-Array freelink-error-Array">[Bad link]</code>.</p>
