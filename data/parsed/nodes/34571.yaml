    html: |-
      <p>I would agree with James <cite>if the Cyrillic design will be heavily Latinized</cite>, which<br>
      actually happens to be something I wouldn't generally encourage. If it will<br>
      instead be an authentic Cyrillic design, there are many good reasons to, at<br>
      most, simply inform the original designer of what's happening. In this case<br>
      though this is moot since Laura is part of Type-Ø-Tones.  :-)</p>
      <p>The enrichment of a writing system should not<br>
      be held hostage, certainly not to somebody else's<br>
      greed or to some Modernist illusion.</p>
      <p>--</p>
      <p>BTW, "Cyrillization" ("Cyrillification"?) is a misleading term here.</p>
      <p>hhp</p>
