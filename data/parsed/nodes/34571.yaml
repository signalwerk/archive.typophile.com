  html: |-
    <p>Hello everybody. I have a client (graphic designer) who is interested in the cyrillic version of one of Type-Ø-Tones typefaces.<br>
    We proposed them to do custom work. As we are not russian or ukranians we will receive the help of a Russian type designer.<br>
    My question has to do with licences. What exactly has to cover my proposal? Only the development costs for “Cyrillization”? or also the usage licences for their final client as well? If so, how many? If not, what would be the proportional costs for additional licensing of this font?</p>
    <p>I'd appreciate any help from you</p>
    <p>Thanks!</p>
    <p>Laura</p>
