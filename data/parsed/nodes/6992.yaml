    html: <p>Certainly, in a general sense, more and better black-  <br>letter types can be offered that give an art director more   <br>range or a broader palette to work from. But to suggest   <br>that a revival is more justified because of masculine   <br>qualities is a stretch.  <br>  <br>A revival is an organic thing, it won't come from a panel   <br>of specialized practitioners. Getting type designers to   <br>create a revival is like trying to push a string. You have   <br>to get end-users (graphic designers, etc.) to use it.  <br>  <br>Perhaps a better approach to help it back into the   <br>mainstream (which it certainly deserves!) would be to   <br>raise awareness and provide more research. The kind   <br>you've already shown. This will give designers the   <br>courange to use it and the ammunition to sell it to their   <br>clients.  <br>  <br>An example. A recent project I did for a biotech firm   <br>involved creating a program for their key customers.   <br>The program had to be 'trusted,' 'exclusive' and   <br>'professional' without being 'promotional.' One of the   <br>directions we pitched was a blackletter word mark. The   <br>client initially loved it for it's journalistic flavor, but in the   <br>user testing it totally backfired. The users believed it to   <br>be too 'journalistic.' The audience is generally used to   <br>being misrepresented in the media, and therefore the   <br>program would lose credibility. I wouldn't expect this   <br>broad perception, among this audience, to change in   <br>their lifetimes. But that won't stop me from trying it  <br>again, given an appropriate audience.  <br>  <br>I'd love to start a thread here showing some good   <br>blackletter usage.</p>
