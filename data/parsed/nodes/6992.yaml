    html: <p>what i like about blackletter is its androgeny. i really like the contrast of the strong dark forms and the delicate embelishments and script inspired forms. Even texturas which i'd say lean more masculine in the blackletter family have the graceful gothic capitals. maybe frakturs are more masculine, but the influence of the brush infuses femininity to my interpretation of the letterforms. I'd place rotundas more on the femenine side, but the heavy strokes and unfussy forms lend a hint of masculinity. To me roman forms are more masculine with their rigid structure brought basically into alignment of the stone chiseled forms. Actually I think most types have a good balance between the masculine and the femenine. What makes us want to classify a type as one or the other? It's interesting to think about.</p>
