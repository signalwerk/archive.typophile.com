    <p>Eng or engma (majuscule: Ŋ, minuscule: ŋ) is a letter of the Latin alphabet, used to represent a velar nasal (as in English singing) in the written form of some languages and in the International Phonetic Alphabet.<br>
    Lowercase eng is derived from n with the addition of a hook to the right leg, somewhat like that of j. The uppercase has two variants: it can be based on the usual uppercase N, with a hook added (or "N-form"); or it can be an enlarged version of the lowercase (or "n-form"). The former is preferred in Sami languages that use it, the latter in African languages.<br>
    Early printers, lacking a specific glyph for eng, sometimes approximated it by rotating a capital G, or by substituting a Greek eta (η) for it.</p>
