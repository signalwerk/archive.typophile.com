  html: |-
    <p>Hi Everyone:</p>
    <p>I have been working on a new script similar to Fugu. Where Fugu was very relaxed and informal, there is a bit of attitude with Nori. It is a bit more expressive,</p>
    <p>much more activity and movement with the brush this time—each lowercase letter has at least 2 alternates if not more, each uppercase letter has an oversized more energetic alternate. I am at the point in my process where I start compiling my selection of ligatures...some I have already brushed out, some I will compile digitally and others I will go back and produce... I started with the usual suspects but wanted to keep it unique and thought I could turn it over to the type-obsessed community for suggestions and advice... to make it more fun, I thought I'd offer up a free license of the completed font to a randomly selected 'contributor' through, twitter, facebook and typophile forums...</p>
    <p>Bear in mind, I am completely open to suggestions regarding the look, feel, flow of this typeface.</p>
    <p>I will supply a few screenshots, please let me know what you think and what you would like to see.</p>
    <p>Thanks</p>
    <p>Neil</p>
    <p>I am including attachments of the primary and alternative character set and a small passage set in the primary character set.</p>
