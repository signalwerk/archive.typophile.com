    html: <p>Running <code>ftxvalidator</code> with just a filename gives you a report summary, nothing more. Run <code>ftxvalidator -T /path/to/font</code> for a detailed, tabular report. See also <code>ftxvalidator -h</code> (help) for all options available.</p>
