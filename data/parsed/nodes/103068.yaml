    html: <p>You can get the OS X Font Tools from Apple's site at <a href="http://developer.apple.com/fonts/" title="http://developer.apple.com/fonts/">http://developer.apple.com/fonts/</a>. It has a small utility that does the same series of tests as the Font Book validation, but generally gives much more verbose report. You'll also find some accompanying documentation with detailed instructions of how to use it.</p>
