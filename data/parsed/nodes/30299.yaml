    html: |-
      <p>Well, there are two issues here:</p>
      <p>1. As mentioned above, there are different cuts of similar style types which have the similar names, such as as Bodoni, Garamond, Caslon, etc. See this good article by Dave Farey: <a href="http://www.fonthaus.com/xheight/bodoni.cfm">http://www.fonthaus.com/xheight/bodoni.cfm</a></p>
      <p>2. Everyone sells each others fonts. Or should I say, all the large foundries are licensed to distribute each others fonts.</p>
      <p>These fonts shouldn’t be different from foundry to foundry (reseller to reseller) unless they fall into category #1.</p>
