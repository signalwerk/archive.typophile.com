  html: <p>Why is it possible to get a font that’s named the same from Linotype, Monotype, Adobe, Berthold and Bitstream; and why are those fonts sometimes different from foundry to foundry?  If the designer is licensing the font to different foundries, why can’t the designer insist on product consistency from foundry to foundry to preserve the product’s good name, or at least to prevent me from getting a headache?</p>
  html_clean: <p>Why is it possible to get a font that’s named the same from Linotype, Monotype, Adobe, Berthold and Bitstream; and why are those fonts sometimes different from foundry to foundry?  If the designer is licensing the font to different foundries, why can’t the designer insist on product consistency from foundry to foundry to preserve the product’s good name, or at least to prevent me from getting a headache?</p>
