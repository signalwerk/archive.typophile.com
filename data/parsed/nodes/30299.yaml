    html: |-
      <p>Many fonts are named after a famous designer, and are based on the fonts used by that person. For instance, Garamond, based on fonts used by Claude Garamond. </p>
      <p>The problem is, everyone looks at the fonts a little differently, and as a result each revival is different. Some differences are huge. ITC cuts, for instance, always have larger x-heights because it was a corporate decision to do so.</p>
      <p>Fonts from more recent sources usually are licensed, and with these there is some control. However, if you pay enough, you probably can get the right to modify the font.</p>
