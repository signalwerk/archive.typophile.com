    html: |-
      <p>Some fonts predate modern intellectual property rights laws, and have trademarks which are difficult to enforce—not that companies aren’t trying. For example, many foundries have distributed cuts of Caslon, so it’s difficult for one company to take control of it. On the other hand, if another designer tried to distribute their own cut of say, Zapfino, they would probably not be able to do so. </p>
      <p>What’s amazing is that in some cases the name of a historical figure like Aldus can be trademarked as well. So, people designing fonts related to or inspired by his work have to use a different name. Of course, that’s not the only reason why a cut of a font may have a different name. For example, Jan Tschichold’s version of Garamond may have been named Sabon simply to distinguish it from others. </p>
      <p>If this seems confusing it’s be cause it is confusing. The previous comments are also applicable. Companies do resell each others fonts. In some cases, a version of a font might be licensed to another company, while the original creator releases an updated version. Each face has it’s own little story…</p>
