  html: <p>Canadian specialty publishers, headquartered in Vancouver. Among other areas of expertise, Hartley &amp; Marks have published many books on typography, including <a href="/wiki/Robert%20Bringhurst" class="freelinking" rel="nofollow">Robert Bringhurst</a>'s <cite><a href="/wiki/Elements%20of%20Typographic%20Style" class="freelinking" rel="nofollow">Elements of Typographic Style</a></cite>, <a href="/wiki/Gerrit%20Noordzij" class="freelinking" rel="nofollow">Gerrit Noordzij</a>'s <cite><a href="/wiki/Letterletter" class="freelinking" rel="nofollow">Letterletter</a></cite>, <a href="/wiki/Stanley%20Morison" class="freelinking" rel="nofollow">Stanley Morison</a>'s <cite><a href="/wiki/Letter%20Forms" class="freelinking" rel="nofollow">Letter Forms</a></cite> and <a href="/wiki/Robert%20Bringhurst" class="freelinking" rel="nofollow">Robert Bringhurst</a> and <a href="/wiki/Warren%20Chappell" class="freelinking" rel="nofollow">Warren Chappell</a>'s <cite><a href="/wiki/Brief%20History%20of%20the%20Printed%20Word" class="freelinking" rel="nofollow">Brief History of the Printed Word</a></cite>. Along with <a href="/wiki/Hyphen%20Press" class="freelinking" rel="nofollow">Hyphen Press</a>, one of the most significant publishers in English of typographic materials.</p>
