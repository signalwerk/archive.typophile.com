  html: |-
    <p>Does anyone know of a software/shareware program that will print font spec sheets, especially with key commands for Mac O/S?</p>
    <p>In the old days of System 9 for Mac users, I had a type utility called "TypeBook 4.0" that allowed me to create sample pages (specimen sheets) for all of my type fonts. There were several options in TypeBook to do this, and the one that was the best was printing out (for example, a picture font) with the associated keyboard commands to get each character. This was great to have if you used picture fonts a lot, or special characters.</p>
    <p>Unfortunately, TypeBook, at least as far as I can tell, did not make the transition to O/S X for Apple Macintosh computers.</p>
    <p>I have tried demo versions recently of:<br>
    1. Veenix software's "Font Tools"<br>
    2. Extensis software's "Suitcase-Fusion"</p>
    <p>Veenix did not work with O/S x.4 and Suitcase Fusion, besides seemingly taking over your desktop, does not print a "keyboard command" style specimen sheet.</p>
    <p>Thanks.</p>
