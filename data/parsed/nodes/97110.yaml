    <p>This is a link to a picture of the mug, which has "MUG" written on it.  I think I have found the fonts for the 'M' and the 'G' (although I would love some validation based on what you think), but I am really interested in the 'U' font, which I have been unable to find.  Thanks for your help and here's the link.<br>
    <a href="http://www.tumblr.com/tagged/the-mug-mug" title="http://www.tumblr.com/tagged/the-mug-mug">http://www.tumblr.com/tagged/the-mug-mug</a><br>
    If you click the picture and then the 'High-res' link, there is a bigger picture.<br>
    I have also attached a slightly cleaned-up version of just the U, but it is pretty small.</p>
