  html: <p> I've been using News Gothic in 0S 9 with ATM Deluxe 4.6.1 for a long time now without any problems. Upon upgrading to OS X and Suitcase, the font no longer works. I tried a friend of mines copy of News Gothic and get the same result. I tried it with the demo version of Font Reserve also with the same results. Font Doctor says the font isn't corupt. Same with Extensis tech support. Has anyone had this problem with News Gothic or any other face? Thanks. </p>
