    html: <p> From what I've heard, if you're using a couple  <br>hundred fonts or less, you could get away without  <br>Suitcase at all. Apparently, it's managing  <br>thousands of fonts that truly warrants a font  <br>utility. <br> <br>(This last bit is basically hearsay from another  <br>OS X forum. I haven't tried this as I don't fit in <br>that category. So take it for what it's worth.) </p>
