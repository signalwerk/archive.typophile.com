    html: <p> It's me again. Some more info. Only some of the faces show up, like Roman and Italic but not Bold Condensed. This is a real problem because this is our company typeface and I'm literally stuck in OS 9 just to use this font. It's ridiculous. Could it be something with the production of the font and OS X, so maybe it's Bitstream's problem? Maybe I'll try contacting them. <br> <br>Any ideas or advice would help, I need this resolved quickly. </p>
