    html: |-
      <p>That's a good observation Paul. The shapes are similar to CG, except that all the letters would have been compressed from the usual wide shapes, and the middle arm of the E is the same length as the others. <a href="http://new.myfonts.com/fonts/bitstream/engravers-gothic/" rel="nofollow">Engraver's Gothic</a> and <a href="http://new.myfonts.com/fonts/redrooster/steelplate-gothic-rr/" rel="nofollow">Steelplate Gothic</a> are two examples of these letterforms without serifs.</p>
      <p>Looking further, I see that <a href="http://new.myfonts.com/fonts/adobe/copperplate-gothic/" rel="nofollow">Copperplate Gothic</a> comes in an assortment of widths and weights, so it could have been a reasonable starting point, as you suggested.</p>
      <p>- Mike Yanega</p>
