      <p>It's not exactly the same, but <a href="http://new.myfonts.com/fonts/adobe/avenir/" rel="nofollow">Avenir</a> is fairly close. The G, R and M are the same shapes, the S is about as closed, and even the Q is not too far off.</p>
      <p>I could not find an exact match.</p>
      <p>- Mike Yanega</p>
