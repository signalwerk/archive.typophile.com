      <p>For even more obscure stuff: the best resource ever!</p>
      <p><a href="http://cg.scs.carleton.ca/~luc/fonts.html" title="http://cg.scs.carleton.ca/~luc/fonts.html">http://cg.scs.carleton.ca/~luc/fonts.html</a></p>
