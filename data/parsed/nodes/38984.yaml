    <p>Hope this is the right forum.</p>
    <p>While I like all the things that go with the concept of typography, I much prefer just looking at typefaces by themselves. In groups of thousands, sad to say.</p>
    <p>I especially love sans  typefaces, leaning more toward those appropriate for fair amounts of text. That said, I’ve seen a crapload of them, which means I’ve gawked at everything from Agro Sans to the font “Protocol” appearing in something published by the Univ. of Minnesota and featuring an interview with Peter Bil´ak.</p>
    <p>So is there anyone here who could direct me toward some of the more obscure sans faces, or perhaps those unique to businesses not in the Fortune 500? I have literally spent years trudging through the web on this endless search, many times ending with me going “oh my, look at that! That’s beautiful.” Which as I just realized makes me sound like Captain Moron because I probably could have been looking in the same way for women.</p>
    <p>(As he snaps out of it ...) Anyway,  I would greatly appreciate it - I realize no one knows whether I’ve seen certain fonts or not, which is why I tried to create a pseudo-boundary by saying I’ve seen a god-awful lot of them. The most recent being one called “Nexus” (not FF Nexus) used by Bus Atha Cliath in Ireland, if that’s any help.</p>
