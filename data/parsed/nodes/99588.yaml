    <p>I'm currently working on an event poster for a Fashion Show that will feature graphics that have an almost watercolor feel to them. However, I'm having trouble finding a font that's really a perfect feel to accompany it. </p>
    <p>The image is very soft, floral and spring, but I do want a more modern feeling font to counterbalance this and ensure the poster doesn't run too old. </p>
    <p>Does anyone have any ideas about fonts that would interact well with watercolor images that aren't script?</p>
