    votes: null
    html: |-
      <p>The Photoshop technique that HVB mentioned is worth a try. I used it years ago on a poster for a watercolor exhibit. Google "photoshop watercolor type" or similar phrases for tutorials.</p>
      <p>I'd only use it on large headline type, though, and only if the head was on a plain background.</p>
