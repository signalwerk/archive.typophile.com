      <p>How about using photoshop techniques to create a water-color effect? That way you would have total control over how much of an effect is obtained. Or there are many brush-stroke fonts available. One of my favorites is a no-longer used proprietary font by NCL, named NCL Freestyle.<br>
       - Herb</p>
