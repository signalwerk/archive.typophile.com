  html: |-
    <p>Znak Symbols™ is new font family from Slobodan Jelesijevic, released by Tour De Force font foundry. Znak Symbols includes 2 fonts (Znak Symbols 1 and Znak Symbols 2) with set of 94 strictly geometric symbols per one font. Original concept and highly applied graphics from Znak Symbols recommend it for miscellaneous purpose, from ornamental and vignette use to visual communications.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Typophile_Znak_Promo_1_4087.jpg"></div><p></p>
    <p>For more informations and samples, visit:<br>
    <a class="freelinking external" href="http://new.myfonts.com/fonts/tdf/znak-symbols/overview.html" rel="nofollow"> Tour De Force at MyFonts page</a><br>
    or<br>
    <a class="freelinking external" href="http://www.tourdefonts.com/" rel="nofollow"> Tour De Force font foundry</a></p>
    <p>Dusan Jelesijevic</p>
