    <p>Hi</p>
    <p>i did investigating of wood type i printed, you can see begging of this all in of this link<br><a href="http://www.typophile.com/node/61908">http://www.typophile.com/node/61908</a></p>
    <p>Thanks to Florian Hardwig I found that type face i printed was Hamilton German No 2. 8 line type</p>
    <p>I did 2 type specimens of existing letters and made new ones of my owen design for missing ones<br>
