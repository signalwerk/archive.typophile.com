    <p>So I am starting a project wherein the branding is surrounding a famous Catholic saint, Padre Pio. So my ideation has lead to creating a wordmark that emulates a Gutenberg style typeface but also has a very modern feel to it. Basically, I am looking for a font that very subtly implies a blackletter style without such hard strokes.</p>
    <p>...and yes I have looked at Fakir.</p>
