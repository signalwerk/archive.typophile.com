    html: |-
      <p>@doubledaggers Thanks for the suggestions! Those are actually very helpful.</p>
      <p>@oldnick I guess I didn't think about the country that Pio had come from... which is a great point, although I am not sure if Italian typography really reflects Catholicism as a whole. I am trying to touch on more the more archaic roots of the religion, such as scribes and early printing press. I am thinking more of a Benedictine calligraphic style with a modern twist.</p>
      <p>I do not think that Padre Pio was too much into experimental Italian futurist type. </p>
      <p>; )</p>
