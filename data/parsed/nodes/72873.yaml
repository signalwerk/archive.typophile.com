      <p>FWIW, among my prized typographic possessions is a page from a Roman Catholic Missal published in Venice in 1520. The closest present-day equivalent to the alphabet used on my page (which prescribes the ritual for dedicating a new church) would be Tudor Black. I am rather surprised that a quick online search didn't reveal a digital version (at least, not one credited as Tudor Black) other than my inline offering, Fordor Incised NF..</p>
      <p><a href="http://new.myfonts.com/fonts/nicksfonts/fordor-incised-nf/fordor-incised-nf/characters.html" title="http://new.myfonts.com/fonts/nicksfonts/fordor-incised-nf/fordor-incised-nf/characters.html">http://new.myfonts.com/fonts/nicksfonts/fordor-incised-nf/fordor-incised...</a></p>
