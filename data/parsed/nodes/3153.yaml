    html: "<p>Strawberry Field (yes, singular like that) was a Salvation Army home in Woolton, Liverpool, and John used to go play there with his friends when he was a kid. <br>Later, in 1966, he used his childhood memories of Strawberry Field and abstracted them for a song, which he called 'Strawberry Fields Forever'. <br> <br>Here's an excerpt from an interview Lennon gave to Rolling Stone in 1968: <br> <br>Q: \"What is Strawberry Fields?\" <br> <br>JOHN: \"It's a name, it's a nice name. When I was writing 'In My Life,' I was trying 'Penny Lane' at that time. We were trying to write about Liverpool, and I just listed all the nice-sounding names, just arbitrarily. Strawberry Fields was a place near us that happened to be a Salvation Army home. But Strawberry Fields-- I mean, I have visions of Strawberry Fields. And there was Penny Lane, and the Cast Iron Shore, which I've just got in some song now, and they were just good names-- just groovy names. Just good sounding. Because Strawberry Fields is anywhere you want to go.\"</p>"
