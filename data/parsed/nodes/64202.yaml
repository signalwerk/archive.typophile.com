  html: |-
    <p>So, I istall a font I'm working on so I can test it out, and FontLab decides to use that font as the one that shows up in the text entry box in the metrics and preview windows. Of course it happens to be a font that is uneadable at small sizes :o)</p>
    <p>One day I'll figure out why it does this but in the mean time, it's not really a problem for me - I just uinistall it to keep working in Fontlab.  It just amused me and I thought I share.</p>
