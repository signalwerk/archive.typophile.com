    <p>Hello,<br>
     I’m currently working on a comic book and<br>
    doing my own lettering by hand.  I’d like to create my own font, using<br>
    my own lettering (by hand, all caps), so when I type out my stories on<br>
    the computer, I could print it out in my personalized font.  I was<br>
    hoping I could write out the alphabet ten times, so when I type out my<br>
    font it would randomly select a different letter “A”, so as not to<br>
    look too uniform, and more hand drawn.  (i.e.: aaaaaaaaaa bbbbbbbbbb<br>
    cccccccccc...etc.) Does this make sense? Is there any solution to this ?<br>
    I would really appreciate some advice.<br>
    Thanks.</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/19784" class="topic-previous" title="Go to previous forum topic">‹ Problems with wsuperior on PC</a> <a href="/node/19653" class="topic-next" title="Go to next forum topic">programming fonts ›</a></div>
