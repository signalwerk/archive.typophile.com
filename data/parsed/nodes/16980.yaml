    html: |-
      <p>Almost none of these fonts are "license-free" - they have a license, even if there is no charge for the font.</p>
      <p>If you do find "license-free fonts" you are unlikely to find a usable serif family of decent quality. Even in the broader category of no-charge fonts, you'd be hard-put to find a really high quality serif family, with the entire family available, that would be great for general text usage.</p>
      <p>Regards,</p>
      <p>T</p>
