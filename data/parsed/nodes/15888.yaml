    <p>BlackPearl is a British Bastarda, digitalised and reshaped.</p>
    <p>I already Hi-Jacked the "Adam"-Thread, which i am very sorry for ...<br>
    now that the BlackPearl has its unique name i will give it its own Thread.</p>
    <p>I hope to see lots of replies/critiques/ideas regarding the BlackPearl to make me finish this one ... ;-)</p>
    <p>Find the actual prewiev-file here: <a href="http://www.brxnd.de/web/uploads/media/blackpearl.pdf" title="http://www.brxnd.de/web/uploads/media/blackpearl.pdf">http://www.brxnd.de/web/uploads/media/blackpearl.pdf</a>  [1.3 MB]</p>
    <p>thanks. Hope You like it!<br>
    brxnd</p>
