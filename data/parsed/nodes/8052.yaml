  html: <p>Hi <br>I'm having problems on generating a Type1 font in fontographer. I can't get the suitcase with the bitmaps inside? Everytime I generate as Type1 there is just the PostScript Icon. But when I generate a TT font there is no problem. Could anyone help me out here?</p>
  html_clean: <p>Hi <br>I'm having problems on generating a Type1 font in fontographer. I can't get the suitcase with the bitmaps inside? Everytime I generate as Type1 there is just the PostScript Icon. But when I generate a TT font there is no problem. Could anyone help me out here?</p>
comments:
  - id: 54108
    user: 1043
    date: 2004-12-07T09:39:00
    date_raw: 7 Dec 2004 — 9:39am
    votes: null
    html: <p>Make sure that when you do "Generate Font Files", you choose "NFNT" for the "Bitmap font to output" and include a menu name, ID (any number below 16000 will do) and at least one size under "Bitmap sizes to output". This last part is particularly important. If you do not specify a size, it will not generate a bitmap font or suitcase, no matter what the other settings are.</p>
