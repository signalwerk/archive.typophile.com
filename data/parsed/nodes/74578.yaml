    <p>The project is to pick a song lyric and express it through typography. The song I was is 'Playing In Her Hair' by the Dream.<br>
    <a href="http://www.youtube.com/watch?v=og7WtVSt7KQ" title="http://www.youtube.com/watch?v=og7WtVSt7KQ">http://www.youtube.com/watch?v=og7WtVSt7KQ</a><br>
    I know, I know, it's an R&amp;B song.<br>
    Here are two digital sketches I've created. Which one do you think has more potential.<br>
    Any typographic suggestions would be greatly appreciated as well, thank you!</p>
