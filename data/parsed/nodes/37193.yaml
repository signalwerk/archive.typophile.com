      <p><strong>drapeaux:</strong> In response to your comment,</p>
      <p><cite>This is hot. You did a really great job - however I have some quirks ...</cite></p>
      <p>The J needs to be tilted downwards a slant more - I believe that the hand shape of J would be easily superimposed with the letter O resembling the sign for intercourse - maybe make it a little harder to do that. ( I’m pretty sure teenagers and children will get very creative with the hand shapes.)</p>
      <p>The P should be a slant hint lower it is a weeee bit too high in the shape formation , thats the first thing i caught - otherwise it is a perfect shape-form with the hand curves knuckles and thumb positioning.</p>
      <p>May I suggest to you - maybe make the actual letter form of Z behind the shape so that it pops out? (perhaps this is more graphical than useful? I don’t know I’m a designer/artist - I’m not sure what my opinion stands on that as an native ASL speaker)</p>
      <p>I realllllllly LOVE the numbers - this has to be by far the BEST set of hand shapes I’ve seen, i would absolutely LOVE to see a set that follows hand shapes! ( that would be particularly useful in making documentation and educational books in which corresponds to ASL)</p>
      <p>Best of luck with this!</p>
      <p>Thanks for your comments, and I appreciate the kind words!</p>
      <p>I never thought about the superimposing of the letter <em>j</em> and <em>o</em> to signify intercourse, but I did add a stroke to signify motion (where the previous version did not have a stroke.) The <em>j</em> as you see is what would be seen at the end of the motion. It's a good suggestion, and I'll see if I can figure out how to prevent that, but then again, I can't prevent the number 1 rotated 90 degrees clockwise and <em>o</em> superimposed ;)</p>
      <p>I agree with your comment about the letter <em>p</em>. It should be a bit lower, and when I do a revision, I'll definitely fix that.</p>
      <p>I'm not sure what you mean by the actual letter form of <em>z</em> behind the shape? Can you elaborate a bit more on that please? The lines I have there represents motion.</p>
      <p>Again, thank you for your kind words. I wouldn't mind expanding the project, or doing a new set in the BSL (British Sign Language) manual alphabet.</p>
      <p><em>Quincunx</em>: That method worked! Thank you.</p>
