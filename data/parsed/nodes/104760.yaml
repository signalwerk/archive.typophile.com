    <p>Hello all!</p>
    <p>I am currently working on my first font and its been a project of mine for the past week. I am a bit ashamed to say that I had no real plan except for the fact that I love sans-serif and grotesque typefaces. Personally I love it so far and the project has given me an excuse to learn Fontlab as well. </p>
    <p>I am currently looking up kerning tutorials before I start with that, but I would love some critique on my glyphs. I want to make them as good as I possibly can. I am also appreciative for any tips, tutorial links, or recommended literature that I can read up on!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/typeface_4879.png"></div><p></p>
    <p>A PDF is attached for closer inspection! </p>
    <p>Thanks in advance!</p>
