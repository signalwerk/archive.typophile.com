    html: |-
      <p>Good job!</p>
      <p>You kept the overall feel intact throughout the whole font. My only issue is the lowercase g, it seems it isn't quite as refined in thin/thick stroke contrast as the rest of the typeface. I would give that another go.<br>
      Also, the diagonal stroke in your lowercase z seems a little too thin, it makes the z feel too light in comparison with the rest of the typeface.</p>
      <p>I also recommend leaving it alone for a week, and when you return you'll notice alot of things on your own. Awesome job otherwise.</p>
