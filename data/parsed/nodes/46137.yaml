    <p></p><div class="imageWrap"><img src="http://typophile.com/files/TypophileArabic-02_3959.jpg"></div><p></p>
    <p>This is the place to discuss anything and everything to do with making and using typefaces for Arabic, Persian, Urdu, and the many other languages that use variants of the Arab script. Use this forum to meet colleagues, discuss issues and ideas, and present your work. Forum topics include, but are not limited to, questions and advice related to the design or use of Arabic type, technical issues related to making Arabic fonts and resolving text encoding and display issues, announcements of events, exhibitions, etc., and links to Arabic typography on the Web. </p>
    <p>We hope you will stay and participate. Please observe courtesy at all times. This is a community, so please help make it a pleasant and welcoming environment. Offensive or insulting comments will be brought to the attention of the Typophile moderators.</p>
    <p><a href="http://typophile.com/node/18067" rel="nofollow">A guide to uploading graphics can be found here.</a> Please note the only way to add a PDF is to edit the original thread and use the import options available.</p>
    <p><a href="http://typophile.com/node/add/forum/366" rel="nofollow">Start a new thread and begin your discussion.</a></p>
