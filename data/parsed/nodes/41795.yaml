    <p>Hi, I’m new here and i’ve got a problem I hope you can help me with.<br>
    I’m running Indesign CS2 on my mac and were using Smartconnection to communicate our layouts with our clients.<br>
    Recently the font Unit is giving us some headache.<br>
    We’re using linotype fontexplorer X for fontmanagement.<br>
    I’ve been using Unit for this specific client in this configuration for quite some time now. This morning when opening a file in it’s final stage of development Unit regular was reported missing while it was active in Fontexplorer.<br>
    So I cleaned out fontexplorer completely and removed al trace of the fonts on my local disc. Then I restart the machine and copied the fonts from the server and installed the fonts into fontexplorer again. This time Unit medium, bold and black didn’t show.<br>
    Did the thing a few times and every time different styles of Unit went missing.</p>
    <p>Please help Deadline is closing in and we need every workstation available to complete this issue.</p>
    <p>Thanks, Steven</p>
