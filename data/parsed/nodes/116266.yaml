    <p>Business news yesterday included a report of the sale of Harlequin Enterprises by Torstar to News Corp. for $455 in cash and a picture of current books including this one (cropped) </p><div class="imageWrap"><img src="http://typophile.com/files/HarlequinHistorical_3666.jpg"></div><br>
    I was able to find another title in  Terri Bisbin's MacLerie Clan series with more lettering in the identical style. There seems to be a base font for the UC and a swash version. Anyone have any info on the font, or even just some more uppercase letters?<br>
    Thanks.<br>
    Don<p></p>
    <div class="field field-type-text field-field-solved">
          <div class="field-label">Font:&nbsp;</div>
