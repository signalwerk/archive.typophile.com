    html: <p>The biggest problem for me in the conversion between mac and PC has been the unpacking the .sit archives and dealing with resource forks that show up as zero byte files on the PC. If anyone has any suggestions, besides stuffit, I'm all ears.</p>
    html_clean: <p>The biggest problem for me in the conversion between mac and PC has been the unpacking the .sit archives and dealing with resource forks that show up as zero byte files on the PC. If anyone has any suggestions, besides stuffit, I'm all ears.</p>
  - id: 53832
    user: 1735
    date: 2004-12-04T14:12:00
    date_raw: 4.Dec.2004 2.12pm
    votes: null
    html: "<p>James, <br> <br>I've been there, and after several frustrations I've managed to get the problem solved with a strange technique: <br> <br>1. You will need Stuffit Expander 7 or 7.5 (I use 7.5) The recent versions of this PC software can't be used cause you end up with the zero size. <br> <br>2. Right click &gt; Expand with options &gt; Cross Platform &gt; Save files in MacBinary Format &gt; Always <br> <br>3. Use Trantype 2 (best font converter) or the shareware Acute Systems CrossFont 3.3. <br> <br>This work for me. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"></p>"
    html_clean: "<p>James, <br> <br>I've been there, and after several frustrations I've managed to get the problem solved with a strange technique: <br> <br>1. You will need Stuffit Expander 7 or 7.5 (I use 7.5) The recent versions of this PC software can't be used cause you end up with the zero size. <br> <br>2. Right click &gt; Expand with options &gt; Cross Platform &gt; Save files in MacBinary Format &gt; Always <br> <br>3. Use Trantype 2 (best font converter) or the shareware Acute Systems CrossFont 3.3. <br> <br>This work for me. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"></p>"
