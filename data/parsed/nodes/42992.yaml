    <p>Maybe this is just a FontForge thing but figured I’d ask here just to check.</p>
    <p>Shuold one be able to have two anchors of the same class in one glyph?  One being designated the mark anchor and the other the base glyph anchor? </p>
    <p>The reason I ask is that I’d like to specify how different accents build on one another, but at the moment with my font I get odd mixed results on being able to place two+ accents.  Either they pile up as if the other weren’t there, or they stack up ignoring the anchors that I had placed, or they stack properly but the base glyph disappears. (this last one sounds like a bug in the Cocoa text engine).</p>
    <p>However, fontforge doesn’t seem to like the ida of two anchors, one to position an accent, and another to position any accents that would be piled on it.  Am I going about this the wrong way?</p>
