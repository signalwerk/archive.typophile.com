      <p><a href="http://www.christianschwartz.com/dbserif.shtml" rel="nofollow">DB News</a>, developed by Christian Schwartz and Erik Spiekermann for Deutsche Bahn AG, approaches this basic concept; however, it is based on a Jannon-derived Garamond, not a true Garamond.</p>
      <p>I once started sketching out a light, contemporary slab based also somewhat on an ATF Garamond skeleton (not unlike the sort of relationship between Nick Shinn’s Bodoni Egyptian and his Bodoni models). But I didn’t take it very far and it’s been sitting idle for several years.</p>
