  html: |-
    <p>Has there ever been an Egyptian/slab serif based on Garamond's proportions and geometry?  It seems like this could be an interesting blend between the ultimate classic text face and a more 'contemporary' style.</p>
    <p>Here's a couple of quick drawings I made of what said typeface might look like.  Note the classical Garamond 'a' (based loosely on Stempel Garamond) and subtly bracketed slabs in an Egyptienne style.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Cairo_5757.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/Hangar_5478.png"></div><p></p>
    <p>Has something like this ever been done before?  Is it too incongruous?  And ultimately, is it worth pursuing?</p>
