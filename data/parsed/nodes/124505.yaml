      <p>If you are considering color, keep in mind printing costs. If you print it offset you could be facing big printing bills not to mention registration errors. </p>
      <p>If you want full color, then plan on going digital only for the printing process. The downside to digital is that unless you have it done on a commercial digital press the quality will likely suffer.</p>
      <p>Gradations also can be a real pain to print, so be careful there. It's probably best to avoid using one if you can. Take your finished design to a commercial printer and speak with one of their knowledgeable staff. If you want a professional job, avoid any franchise printing operations such as Minuteman Press, and especially avoid Kinko's. Kinko's is great for copies from copiers, but they don't hire professional printers.</p>
