    html: |-
      <p>I searched using "1800s" at MyFonts and came up with one fair candidate that looks like a flattened version of your typeface: <a class="freelinking external" href="http://new.myfonts.com/fonts/fontmesa/flatrock/">Flatrock</a> from Font Mesa. It came closest to having the strange geometry of your sample lettering. Dan Solo (Solotype) also had a number of fonts recreating typestyles from this era that had a similar feeling, but not the angular "O": Riviera, Houdini, Penny Arcade and Dawson (all at MyFonts).</p>
      <p>- Mike Yanega</p>
