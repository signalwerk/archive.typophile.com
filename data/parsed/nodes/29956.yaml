    html: |-
      <p>Will the type be displayed at a size comparable to what you have posted?</p>
      <p>If so, I would suggest opening up the space between T &amp; H and slightly tightening the space between M Y T. Only slightly moreso between the MY than the YT. the corners on the top of the Y should nearly touch the tops of the M and T. </p>
      <p>How's this?:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/myth_kern_4367.jpg"></div><p></p>
      <p>If you're displaying this much smaller, the overall space should open up.</p>
