    <p>I'm trying to kern the word MYTH set in AG Super. The shapes are a little odd, and if I  balance out the spacing it looks pretty hideous. The following image shows it with no kerning above, and tightened to balance out the spacing below.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/mythkerning_3625.png"></div><p></p>
    <p>If I open the rest up enough to match YT with even a tiny space the entire word breaks apart. Pulling stuff together yielded the monstrosity above. Suggestions?</p>
