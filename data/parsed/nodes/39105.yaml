  html: |-
    <p>For those of you stuck in Illustrator/Inkscape or some other such vector malarky, you might want to give <a class="freelinking-external" href="https://web.archive.org/web/20080906232449/http://vectormagic.stanford.edu/">this</a> a quick look.</p>
    <p>It’s a free web app that incredibly quickly converts your raster images to vector. I’m seriously impressed - it easily out performs Illustrator’s Live Trace by a factor of lots.</p>
    <p>I couldn’t find a mention here and if this is old news, I apologise. Sod it, no I don’t, go and have a look, it’s fantastic. :)</p>
    <p>s</p>
