ted, whatever the moral consequences. Eichmann may have lacked a moral sense, but he was thoughtful to the extent that he knew what he was doing and why he was doing it - to carry out Hitler's dreams.  <br> <br>It is significant that, as Grief points out in the article John referenced, Arendt never made clear what she meant by the phrase 'banality of evil'. This muddiness in what she is talking about is what I most object to. It enables she and her defenders so slide between different positions to avoid looking the facts about Eichmann in the face. <br> <br>It is muddle-headedness in defence of illiberalism, and its popularity, that I find objectionable.</p>"
