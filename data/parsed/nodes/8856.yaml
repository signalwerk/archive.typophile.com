    html: "<p>&gt;Are you saying that all contemporary designs are better for society than all revivals? <br> <br>No. I would never be that dogmatic (or fascist). <br>William, we were discussing something you had raised, the \"socialist\" element of Helvetica and modernism. <br>If today's design workers wish to express a socialist sentiment, they should not merely pay lip service by using old Helvetica, but should support their fellow designers (solidarity!), by using typefaces designed by today's type designers. <br> <br>*** <br> <br>I haven't read Eichmann in Jerusaslem, and I am not an Arendt scholar. As I am aware, her term \"the banality of evil\" had a great resonance, to the extent of becoming a cliche. From what I have read of the commentary, including here, it appears that the connection she made between banality, fascism, bureaucracy, and not thinking for oneself made a lot of sense to a lot of people. To repeat one of John Hudson's points: she was contrasting the banality of evil with the sadism of evil. And at the time, when it was customary to demonize and project evil onto the other, her idea of describing evil as banal was a revelation. <br> <br>That is, because no-one had taken Eliot seriously when he wrote \"This is how the world will end. Not with a bang but a whimper.\" (The Hollow Men, 1925) <br> <br>In connection with typography, what could be more banal than a default choice of typeface, absolving the typesetter of any choice in the matter? <br> <br>If the default is a corporate standard, then it is a strictly bureaucratic banality. If it is made by the software, then it is another kind of banality: although the user is more at liberty to replace the default, how much freedom of choice is there really?  When a graphic designer buys a computer and installs professional software, already (s)he has a default library of typefaces which cleverly appears on the font menu. Of course, (s)he may still buy and install other fonts, but the default library is a coercive banality, no matter how marvelous the fonts may be, because it derogates freedom of choice by taking away the need to exercise it.  <br> <br>Is this evil? Of course not, because on the moral scale, evil is an extreme, and banal typography is merely a slightly numbing practice.  <br> <br>Is it inflamatory to speak of the \"banality of evil\" and typography in the same breath? Perhaps, but the moral dimension of banality is a genuine concern for many graphic designers and art directors, who are aware both of the ephemeral nature of their individual work and the problematic nature of the hyper consumerism which it promotes.</p>"
