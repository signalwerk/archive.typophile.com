    html: <p>William-- <br> <br>The rub here I think concerns the definition of "thoughtless." You, and Miller, want "thoughtless" to mean "accidental" or "inadvertent." On that reading, of course, Eichmann was not "thoughtless" at all. If anything, he was meticulous and even obsessive, a trait he shared with most of the Nazi leadership and bureaucracy. <br> <br>It might surprise you to learn, then, that Arendt, far from minimizing this, agreed with you, and documented this quality of Eichmann thoroughly in her book. To put that evidence against her as proof she was wrong about Eichmann is thus misguided; it doesn't "refute" her if she never argued to the contrary in the first place. Indeed, so far as I know, no one--not Arendt, not anyone--argues that Eichmann sleptwalked through World War II and the Final Solution, or that he was hoodwinked or brainwashed into genocide, or that he did not understand the consequences of his actions. <br> <br>As Arendt used the term, "thoughtless" meant "ethically mindless" or "without judgment"--that is, not thinking what one is doing, morally speaking. What Eichmann showed Arendt was that one can know what one is doing and why, yet simultaneously and without guile or irony proclaim contradictory and even pure motives, and even (and monstrously) express astonishment at the lack of gratitude from one's victims (as Eichmann expressed of German Jewish leaders and of his captors) for having done one's job so well.  <br> <br>For Arendt to point this out and trace the consequences of failing to recognize this phenomenon for our moral and political judgment is not at all "muddleheaded." She is holding something ugly and troubling about the human condition up to the light for inspection. That she called this the "banality of evil" without quite being able to put her finger on its precise definition, or to reconcile it with her other accounts of "radical evil" and the nature of totalitarianism, shows only that she was struggling honestly with something complex but of great signifcance. <br> <br>This doesn't mean that there aren't potential problems with Arendt's account; it just means you and Miller haven't raised any of them by accusing her of minimizing Eichmann's evil.</p>
