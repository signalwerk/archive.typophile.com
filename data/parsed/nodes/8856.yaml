    html: <p>Maurice, I am not an expert on Arendt, but Miller is. If you want to refute him, then respond to his arguments and to the evidence he cites, which you don't do.  <br> <br>You quote Arendt in part as saying that he was a person who "commits his crimes under circumstances that make it well-nigh impossible for him to know or to feel that he is doing wrong." And you characterize him as a 'thoughtless functionary', following Arendt. But Miller points out, using the evidence he quotes and I report, that her view is factually wrong - he thought of himself as a complete devotee of Hitler, and acted against his duties as a functionary. Lengthy quotes are not responsive to Miller's evidence, but simply a question-begging repetition of Arendt's views. <br> <br>What I myself find dishonorable in Arendt is that she did not face the issue of Heidegger's culpability in supporting Hitler, but defended him with misleading statements. If you want to defend her honor, explain why her sometime defence and general avoidance of the issue is honorable.</p>
