    html: "<p>William: <br> <br>1. To distinguish between historical instances of fascisim, and a general ideological form, Eco came up with the term \"Ur-fascism'. As he admits: \"In spite of some fuzziness regarding the difference between various historical forms of fascism, I think it is possible to outline a list of features that are typical of what I would like to call Ur-Fascism, or Eternal Fascism. These features cannot be organized into a system; many of them contradict each other, and are also typical of other kinds of despotism or fanaticism. But it is enough that one of them be present to allow fascism to coagulate around it.\" Yeah, cultural theory tends to be a bit smoky! <br> <br>2. Certainly, Utilitarianism as a philosophy means useful to people (the greatest good for the greatest number). However, the word utilitarian is generally understood to mean \"merely\" useful for material ends -- inhuman, in fact. It's a put-down, stemming from the realisation in the latter 19th Century that cold-blooded industrial capitalism could easily be rationalized by such a \"Benthamite\" philosophy, with devastating results for a large number of the population. <br> <br>3. I trust Arendt's assessment. She was at Nuremburg, and her concept of the \"banality of evil\" makes sense in relation to Milgram's behavioral studies of obedience, from the same era. <br> <br>Helvetica, modernism, and socialism: <br>there is some overlap, and many ironies. <br>The grotesque letterform was modern, invented in signage during the birth of the modern industrial era, in London, 1805 (Justin Howes spoke on this at the Bad Type conference). No doubt the sign painters were Chartists (the socialists of the day), but it's more likely that this extreme trend in letterform was just the way that people expressed themselves in the most tumultuous of times. <br> <br>The bauhaus \"socialist\" ideal you refer to: that the artist has a duty to society. <br> <br>If that is the case, the duty of artists is to use today's typefaces designed by members of today's society, not Helvetica.</p>"
