    html: "<p>As you say Hrant, it's not the forms or the genesis that are related to fascism. <br> <br>Form has no relation to politics or ethics -- this is one of the lessons of the 20th century, made clear in the mythical anecdote of the beautiful, functional lampshade made of human skin.  <br> <br>It has also been pointed out that there's a great resonance, in formal aesthetics, between drill sargeant Busby Berkley's Hollwood spectacles, and the Nuremburg Rally as filmed by Leni Riefenstahl. <br> <br>And in type, the Nazi flip-flop over whether blackletter or humanist typeform was better for the Third Reich is clearly documented in Chris Burke's \"Renner\". <br> <br>As for genesis, Helvetica is a revival, made in the WW2-neutral Switzerland, of a widely-used genre (grotesque) at least 60 years old at the time (from Akzidenz Grotesque), while its capitals go back at least to the 1830s, in London (as I show in my essay).  There can hardly be a type of less political provenance. <br> <br>The evidence against Helvetica is entirely circumstantial (nonetheless, such evidence can be grounds for conviction). <br> <br>For those who have not read my essay, the gist of the argument is that the dominant typefaces of today are a limited number of mid-20th Century sans serif faces. <br>The quality of typography is hence traditional, conformist, utilitarian and banal: these are the qualities of a fascist aesthetic.  <br> <br>Helvetica was entrenched in digital culture by the mass-scale distribution of two organizations Apple (as a Laserwriter and system font) and Microsoft (with IE) which enjoy a virtual monopoly -- akin to a totalitarian position. <br> <br>While both communism and fascism were totalitarian movements, the communist aesthetic was anti-traditional and experimental (eg Stalin and Mao's democidal collectivization of agriculture). <br> <br>The origin of the word \"fascist\" is the Latin word \"fasces\", meaning a bundle of reeds (an image used in Nazi regalia). It denotes being bound to the Leader, the Party, the Fatherland, the Ideology.  \"Bundle\" is also the word used to describe how Helvetica etc. are distributed. Hmmm...</p>"
