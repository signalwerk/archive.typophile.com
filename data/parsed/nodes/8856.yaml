    html: "<p>&gt;Helvetica is more an outgrowth of the egalitarean socialist 'one with the worker' aesthetic, with an added sheen of stylishness. <br> <br>That's imprecise. I've described the Fascist aesthetic by four features which may be applied to design objects such as typefaces, but I have no idea what aesthetic qualities you assume are associated with egalitarianism, socialism, and \"one with the worker\".   <br> <br>Besides, while a type design may emerge from particular ideological-historical circumstances, the formal qualities (the shapes) of that typeface have no innate relationship with that ideology, and that typeface may subsequently be used to serve different ideological ends. Typefaces acquire ideological significance through association. <br> <br>These four aesthetic qualities are independent of the appearance of the typeface, and yet they have been acquired by it during use:   <br> <br>Traditional. Helvetica is a revival of the 19th century grotesque. <br> <br>Conformist. Helvetica is chosen because people don't want to stand out in a crowd by using something with a unique personality: \"timeless and neutral\". <br> <br>Utilitarian. Helvetica is the preferred face of timetables, labels and signage. <br> <br>Banal. Helvetica is the default. <br> <br>The same aesthetic qualities also belong to Times Roman, a face of quite different appearance to helvetica. <br> <br>But are these fascist qualities, William asks? <br> <br>&gt;The distinctive thing to me about the fascist aesthetic is that it favors the grand, pompous and brutal, with as much glamor as possible. <br> <br>That could be said of any militaristic state. The four qualities I am focusing on are likewise not exclusive, but I present them as a coherent group, with support from Eco: <br> <br>Traditional. Eco: \"The first feature of Ur-Fascism is the cult of tradition...there can be no advancement of learning. Truth already has been spelled out once and for all...\" <br> <br>Conformist. Eco: \"Ur-Fascism grows up and seeks consensus by exploiting and exacerbating the natural fear of difference.\" <br> <br>Utilitarian. The fascist state exists not for the pleasure of its citizens, but to enforce its ideology on the world. <br> <br>Banality. Eco: \"...the cult of action for action's sake. Action being beautiful in itself, it must be taken before, or without, reflection. Thinking is a form of emasculation.\" This viewpoint follows from Hannah Arendt's perception of the banality of Nazi evil as perpetrated by thoughtless bureaucrats.</p>"
