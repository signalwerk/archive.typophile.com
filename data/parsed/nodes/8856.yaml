    html: <p>John, thanks for the article, which is enlightening, and to my reading confirms very clearly one place where her theories themselves show moral cowardice.  <br> <br>As I said earlier, Arendt was very muddled. You can quote her saying many quite sensible and morally upright things. But also the opposite. And she never forthrightly sorts it out. This is a key to her popularity, in my opinion, as by staying muddled she is able to condemn the Nazis without ever appealing to liberal standards such as truth, democracy, protection of minorities and honest science.  <br> <br>Since many intellectuals, including Heidegger, were and are illiberal, this is a clever way to make herself and them them feel righteous without challenging their illiberalism.  <br> <br>Her quoting with approval Cicero saying he would rather be wrong with Plato than hold true views with people he doesn't like is exactly a point of betrayal of liberal standards.  <br> <br>The contrast here with Popper is noteable. Popper deeply admired Plato, but recognized his illiberalism, and so wrote his lengthy attack on Plato's illiberalism in 'The Open Society and Its Enemies'. Of course Popper is not a darling of the illiberal and so not as popular.  <br> <br>However, it is he, and not Arendt, whom people in oppressed regimes have read as a beacon of light. When I was at the Popper Centenary conference in Vienna in 2002, it was very touching to hear how people in East Germany and Poland were strengthened and given hope and direction by reading Popper. And now he is being read in China and Iran by the champions of liberty.  <br> <br>The liberal standard is truth, and if your friend is supporting an evil, you don't go with him. And that by the way is not only a liberal standard, but a traditional Jewish and Christian one. <br> <br>My problem with Arendt isn't so much that she compromised her standards as that her standards were compromised.  <br> <br>Arendt tried to replace acknowledgement of the truth with another standard of 'thoughtfulness'. But, as Miller also points out, this standard is also rubbish when applied to the Nazi situation. The Nazis were thoughtful. They had a whole system of pseudo-scientific racial theories that justified their actions. And exactly on point they had the 'great' philosopher Heidegger endorsing obedience to the Fuehrer as justified by his system of thought. But they weren't honest.  <br> <br>Nick said earlier that cultural history is 'a bit smokey'. Well not when I write it. I try to stick to real facts, and use them as a test of whatever I say. Understanding history of ideas is a very difficult and slippery, but important subject. I have been working in this field for forty years, and I try to follow what the great English liberal, Bertrand Russell, said on this subject. He said that he always tried to be as clear as possible. He understood that the truth often lay behind a fog of mystery and confusion, but he never took the fog for the reality, but rather strived to get through the fog to the reality. <br> <br>So I do strongly disapprove of those like Arendt who reject the standard of truth and generate fog, however beautiful the fog may appear at times.  <br> <br>Finally, I find rather peculiar, Nick, that you put family/lover in one category. What Heidegger did in having an affair with his 19 year old student, then dumping her, threatened his marriage and children, exploited her, and is morally reprehensible. Arendt's behavior of maybe getting her jollies by sleeping with a famous man with a wife and children is also wrong.  <br> <br>You could argue that Heidegger was more culpable than she, as he was the one with the power in the situation. But the idea that she owed him something because he exploited her for sex - or was it for gratitude for the priviledge of being screwed by a famous Nazi - when she was 19 seems to me grotesque.  <br> <br>Finally a note on one thing mentioned in the article John references. Greif notes that Arendt made something of the fact that Eichmann knew Kant's ethical theories. However Eichmann interpreted the 'categorical imperative' as meaning 'do whatever the Fueherer would approve of, if he were in the same situation'. Um, not exactly true to Kant, an apostle of liberalism and the enlightenment. And very much on point as to what motivated Eichmann, though minimized by Arendt.</p>
