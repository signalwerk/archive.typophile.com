    html: "<p>My $.02, for what they're worth: <br> <br>Nick and John's association of Arendt's \"banality\" with mindless action (and not merely poor taste) is exactly right. There was no question in Arendt's mind that Eichmann was evil, or that he tried hard to please his superiors by coordinating the movement and distribution of rail stock in order efficiently to move Jews to internment centers and finally to the camps, or that he knew where the Jews were headed.  <br> <br>William's secondhand reading of Arendt is wrong. Arendt never argued that Eichmann was an innocent tool; she argued that he was a thoughtless functionary who managed in his own mind and to his great guilt to dissociate performing his tasks and promoting the reputation of his section of the bureaucracy from the gruesome reality of their function. The bureacracy was not to blame. She was making a larger point in the book about \"a new type of criminal\" who \"commits his crimes under circumstances that make it well-nigh impossible for him to know or to feel that he is doing wrong.\" Consider the other Nazis who spent the end days of the war destroying the records of their crimes; was this proof that they knew what they did was wrong? Far from it, she answers; it shows no more than that they knew they had lost the war and were aware of what others would think of their conduct once they discovered it, and they were trying to avoid paying the price for their decisions--nothing more. \"Would any one of them,\" she asked, \"have suffered from a guilty conscience if they had won?\"  <br> <br>But that did not negate or excuse their crimes, or the fact that they were criminals. There was no question in her mind about their guilt, and that of Eichmann. She put that conclusion in stark language at the end of the book, when she imagines the better and more honest argument for his culpability the judges in Jerusalem could have put to him when they pronounced their sentence: <br> <br></p>"
