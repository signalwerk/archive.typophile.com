    html: <p><i>So, for example, when your president lands on the flight deck of an aircraft carrier dressed in a military uniform, one has grounds for concern</i> <br> <br>That was a flightsuit he was wearing, and the flightsuit itself was obviously more for its function than for symbolic purposes.  <br> <br>There is no well-established definition of Fascism. Attempts to define it seem to invariably include a list of current world leaders that do or do not fit the definition. I would argue that Baathism is easily a form of Fascism, and of course others will call me a Fascist for having said such a thing. Or a naïve fool, or ignorant American, or whatever the favored stereotype is at the moment. <br> <br>I have been reading Robert O. Paxton's <a href="http://www.amazon.com/exec/obidos/tg/detail/-/1400040949/qid=1107018982/sr=8-1/ref=pd_csp_1/002-8378800-6244068?v=glance&amp;s=books&amp;n=507846">The Anatomy of Fascism</a> which may be the most successful effort yet at such a definition, though I won't know until I finish it. I'm also reading Canetti's <a href="http://www.amazon.com/exec/obidos/tg/detail/-/0374518203/qid=1107019041/sr=1-1/ref=sr_1_1/002-8378800-6244068?v=glance&amp;s=books">Crowds and Power</a> which, while incisive and well written, suffers from howyousay "Charismatic Atheism." I am also still struggling through <i>Frakturstreit</i>.</p>
