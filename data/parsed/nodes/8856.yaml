    html: "<p>I don't think Arendt ever claimed that Eichmann was 'a thoughtless cog in a bureaucratic machine': the famous banality phrase refers to the <i>way</i> he went about murdering millions of people, having once decided that he would do it (what Eichmann called his 'Pontius Pilate moment'). Arendt is contrasting the reality of this small minded man, obsessing about the train schedules to and from Auschwitz, to the kind of sadistic monster who gets personal pleasure from specific acts of murder (e.g. Stalin's secret police chief, Beria, who insisted on personally executing many 'enemies of the revolution'). Eichmann's Final Solution was designed to depersonalise the murder, by turning it into a bureaucratically ordered, mechanised, assembly line for corpses and ash. And this was something new in our understanding when Arendt wrote <i>Eichmann in Jerusalem,</i> as the comments of the prosecutor show: we expect people who perform monstrous acts to be monsters, and their ordinariness is apalling. I think Arendt's famous quote mischaracterises evil: it is not that evil is banal per se, but that evil <i>can</i> become part of the everyday and the normal. It does not require monsters: Eichmann's system, while it permitted individual sadism, did not require sadism. Nowhere in any of this is it suggested that Eichmann was an unthinking cog in a bureaucracy: he <i>designed</i> the bureaucracy.</p>"
    html_clean: "<p>I don't think Arendt ever claimed that Eichmann was 'a thoughtless cog in a bureaucratic machine': the famous banality phrase refers to the <i>way</i> he went about murdering millions of people, having once decided that he would do it (what Eichmann called his 'Pontius Pilate moment'). Arendt is contrasting the reality of this small minded man, obsessing about the train schedules to and from Auschwitz, to the kind of sadistic monster who gets personal pleasure from specific acts of murder (e.g. Stalin's secret police chief, Beria, who insisted on personally executing many 'enemies of the revolution'). Eichmann's Final Solution was designed to depersonalise the murder, by turning it into a bureaucratically ordered, mechanised, assembly line for corpses and ash. And this was something new in our understanding when Arendt wrote <i>Eichmann in Jerusalem,</i> as the comments of the prosecutor show: we expect people who perform monstrous acts to be monsters, and their ordinariness is apalling. I think Arendt's famous quote mischaracterises evil: it is not that evil is banal per se, but that evil <i>can</i> become part of the everyday and the normal. It does not require monsters: Eichmann's system, while it permitted individual sadism, did not require sadism. Nowhere in any of this is it suggested that Eichmann was an unthinking cog in a bureaucracy: he <i>designed</i> the bureaucracy.</p>"
