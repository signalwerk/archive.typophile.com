  html: "<p>Hi! <br> <br>First post, and all that. Pardon the english in advance. Anyway: <br> <br>I'm looking for typefaces who are and/or typemakers who was/i outspoken fascist/-s. Preferably typefaces designed during any of the world wars or in a fascist regime. <br>Even, to an extent, any typefaces and/or -makers who are to be associated with \"evil\"; fascism, rasism, domestic abuse, almost anything goes. <br> <br>And, one a side note; is Helvetica in any way relatable to fascism? Are there any (be them questionable) essays on the subject? <br> <br>Thanks in advance, <br>J</p>"
