    html: <p>Thanks John, that article does much to explain Arendt's hypocrisy in not living up to her ethical philosophy . <br> <br>William, it appears that love (carnal and person-to-person) was the reason she excused Heidegger.  <br> <br>Perhaps she could have put a "notwithstanding" clause (Canadian term) or a "derogation" (EU term) to provide an exemption for close family/lover -- although this would have weakened her argument in many eyes. In certain jurisdictions the testimony of a spouse is invalid. <br> <br>Anyway, the fact that she compromised on her own standards doesn't discredit them.</p>
