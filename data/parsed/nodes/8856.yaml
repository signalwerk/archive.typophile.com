    html: <p>The mention of fascism, uniformity, and the Gap reminds me of <a href="http://groups.msn.com/CrazyVegan/ljstuff.msnw?action=ShowPhoto&amp;PhotoID=45">this little spoof </a>from a while back. <br> <br>Anyway. Jacob, put simply, Helvetica is related to fascism the way a bulk of modern* san serif type is related to fascism, as Nick indicated. It's not like the VW or <a href="http://www.cbsnews.com/stories/2002/03/27/print/main504730.shtml">IBM</a> in that it doesn't stand higher than the rest in this regard. Homogeneity is not a fascist invention, nor is it necessarily fascist, though the two often go hand-in-hand. I suppose I'm just re-summarizing at this point. <br> <br>Anyway, the <a href="http://www.colophon.com/gallery/futurism/">Futurists</a> are another creative bunch who loved to get their war on and had strong fascist sentiments (from <a href="http://www.unknown.nu/futurism/">what I've read on them</a>), so that's another avenue to explore. <br> <br>*I use "modern" in the design history sense, not to mean contemporary.</p>
