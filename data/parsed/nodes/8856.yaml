    html: <p>Maurice, <br> <br>Even if you mean 'ethically mindless' and 'without judgment' these terms do not apply to Eichmann. He did believe in an ethical system, namely that of the Nazis, according to which it was good to kill Jews in order to purify Europe of racial pollution. He made an ethical choice, a horrific choice, but a choice none the less, and did it knowingly.  <br> <br>Also it is a grotesque irony that the person whom Arendt would probably have taken as the epitomy of 'thoughtful', namely Heidegger, made the choice also to say that his philosophy meant that you should support the Fuehrer completely.  <br> <br>It is interesting that, Steve tells me, the reception of Arendt's book on Eichmann was much better in literary circles than among historians, almost none of whom agree with her. <br> <br>I have spent way too much time on this, and it is also off topic, so I will not add to the debate for a few days at least.  <br> <br>On topic, Andreas' and Gerard's comments were very interesting on the typography of the fascist regimes. Hopefully others knowledgeable on this history will follow up on these</p>
