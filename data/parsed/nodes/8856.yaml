    html: <p>Re. Hannah Arendt. I wish people would read the totality of her account of the Eichmann trial, which is a complex work. 'The banality of evil' has become an empty soundbite, much more banal than that to which she referred (the <i>everydayness</i> of the way in which Eichmann went about the destruction of the lives of millions of people, the obsessive bureaucracy that the Nazi's erected to manage their murder, and the small mentality of the people who ran it). <i>Eichmann in Jerusalem</i> is a challenging book, and I disagree with much that Arendt wrote -- and I'm flummoxed by her continued affection for Heidegger, who appears to have remained unrepentant of his Nazi past throughout his life --, but her writing deserves not to be reduced to a misunderstood journalistic snippet.</p>
    html_clean: <p>Re. Hannah Arendt. I wish people would read the totality of her account of the Eichmann trial, which is a complex work. 'The banality of evil' has become an empty soundbite, much more banal than that to which she referred (the <i>everydayness</i> of the way in which Eichmann went about the destruction of the lives of millions of people, the obsessive bureaucracy that the Nazi's erected to manage their murder, and the small mentality of the people who ran it). <i>Eichmann in Jerusalem</i> is a challenging book, and I disagree with much that Arendt wrote -- and I'm flummoxed by her continued affection for Heidegger, who appears to have remained unrepentant of his Nazi past throughout his life --, but her writing deserves not to be reduced to a misunderstood journalistic snippet.</p>
