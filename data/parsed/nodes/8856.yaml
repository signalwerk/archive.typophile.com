    html: <p>1. Eco is talking about 'Ur-fascism' - his concoction - not fascism. Without the militarism and brutality and anti-egalitarianism of fascism, he seems to be just pasting an emotionally charged word on something that he doesn't like. To me it looks like he is just blowing smoke, but perhaps in context I would be more impressed.  <br> <br>2. Your the way in which you - or is it Eco - use 'utilitarean' is incorrect. Utilitarean means useful to people, not useless.  <br> <br>3. Hannah Arendt was just blowing smoke also. Eichmann was just evil, and not banal. He knew damn well what he was doing and her thesis doesn't hold up against actual testimony against him. <br> <br>You know more about the history of type than I - and I do admire your essays, with the exeception of the stuff about fascism! - but wasn't 'modernism' in architecture and type motivated partly by socialist ideals? The Bauhaus I believe were overtly socialist, and they saw their work, including the type as furthering their ideals. Isn't Helvetica a further wrinkle in the modernist movement in type, a furthering of Bauhaus ideals? Just asking.</p>
