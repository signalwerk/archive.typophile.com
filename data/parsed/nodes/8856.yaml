    html: "<p>My rude language on Arendt's behavior was in response to Nick's comment that it somehow mitigated her later behavior. My point, and I acknowledge that my language should have been less angry, is that her behavior as a student in no way excuses her later behavior in relation to Heidegger's reputation. The term 'calumny' implies that what I said is false. But it is true. I offer different interpretations of her affair, and I don't know what is correct, but whatever way you slice it it doesn't come out honorable.  <br> <br>I never said that she was a self-hating Jew whose views don't deserve consideration. They should be considered and rejected.  <br> <br>Miller's argument is not self-contradictory. He is pointing out that Arendt acknowledges facts that contradict her thesis, and she refuses to accept the implications of these facts, which refute her.  <br> <br>You say above: <br> <br>\"Nick and John's association of Arendt's \"banality\" with mindless action (and not merely poor taste) is exactly right.\" <br> <br>and \"she argued that he was a thoughtless functionary\" <br> <br>You say that my charactization of her view as Eichmann as a \"a thoughtless cog in a bureaucratic machine\" is somehow off base. How is my characterization different from yours?  <br> <br>Furthermore, you are not getting Miller's point. If Eichmann were just doing his job as a bureaucrat, then he would have done what his superior told him. But he went against it because of his fanatical devotion to Hitler, a motive Arendt minimizes, but which was primary.  <br> <br>More generally, you can distinguish between and weak and strong version of the banality thesis. The weak version is that Eichmann was a shallow and silly man, and not a demonic mastermind. Everyone would accept the weak version, including me. The strong version is that he was a \"thoughtless functionary\", as you put it. The strong thesis is false as Eichmann thought about it, and wanted to do whatever Hitler wanted, whatever the moral consequences. Eichmann may have lacked a moral sense, but he was thoughtful to the extent that he knew what he was doing and why he was doing it - to carry out Hitler's dreams.  <br> <br>It is significant that, as Grief points out in the article John referenced, Arendt never made clear what she meant by the phrase 'banality of evil'. This muddiness in what she is talking about is what I most object to. It enables she and her defenders so slide between different positions to avoid looking the facts about Eichmann in the face. <br> <br>It is muddle-headedness in defence of illiberalism, and its popularity, that I find objectionable.</p>"
