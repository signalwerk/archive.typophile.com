    html: "<p>&gt;I don't get the supposed link between Helvetica and fascism, <br> <br>Jacob asked for \"any way relatable to fascism\". <br> <br>I was very impressed by an essay Umberto Eco wrote in 1995, \"Eternal fascism: 14 ways of looking at a blackshirt\", in which he stated, <br> <br>'Ur-Fascism is still around us, sometimes in plainclothes. It would be so much easier for us if there appeared on the world scene somebody saying, \"I want to reopen Auschwitz, I want the Blackshirts to parade again in the Italian squares.\" Life is not that simple. Ur-Fascism can come back under the most innocent of disguises. Our duty is to uncover it and to point our finger at any of its new instances </p>"
