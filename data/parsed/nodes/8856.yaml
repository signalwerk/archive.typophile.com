    html: <p>Ouch <br> <br>Well, if the way to propagandize the concept of fascism is through graphic design (and the use of typefaces per that design) et al, they would be typefaces that could "sell the message." The Italian Fascists had that down pat. The same kind of typefaces are used today in Anglo-American corporate advertising and political campaigns. How many of you have contributed to that crap?  <br> <br>That blackletter may now be associated with what the world considers an "evil regime" has nothing to do with the propagandistic nature of the form, it is simply an historical association, and only powerful in its retrospective use. If the Nazis thought it was so great a propaganda device they wouldn't have tried to kill it off halfway through the friggin war.</p>
