    html: "<p>&gt; traditional, conformist, utilitarian and banal: these are the qualities of a fascist aesthetic.  <br> <br>I really don't think that is accurate, Nick. The distinctive thing to me about the fascist aesthetic is that it favors the grand, pompous and brutal, with as much glamor as possible.  <br> <br>Helvetica is more an outgrowth of the egalitarean socialist 'one with the worker' aesthetic, with an added sheen of stylishness.  <br> <br>If Helvetica were used occassionally as a display face, it would be fine with me. As it is, it is so overused that it makes me cringe. But that overuse is not fascist. It is just a consequence of corporate conservativism and ignorance. It is a boring side of the democratic societies with mixed economies that we have now in rich countries, but it isn't fascist.</p>"
