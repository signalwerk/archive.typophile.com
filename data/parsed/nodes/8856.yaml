    html: "<p>William-- <br> <br>See my post above yours. If you disagree with me over Arendt's views, fine. I think I have the better argument, but I could be mistaken. <br> <br>But to write that \"Arendt's behavior of maybe getting her jollies by sleeping with a famous man with a wife and children is also wrong,\" and to condemn her for \"the idea that she owed him something because he exploited her for sex,\" or out of \"gratitude for the priviledge [sic] of being screwed by a famous Nazi\" is just gratuitous and mean-spirited. <br> <br>I can't think of a better definition of \"calumny\" than to suggest that Arendt got such a charge out of having adulterous sex with an anti-Semitic fascist that it put her so deeply in Heidegger's thrall to feel compelled to whitewash his crimes for the rest of her life. (By the way, Heidegger did not join the Nazis until 1933, and most of his anti-Semitism would likely have been kept delicately out-of-conversational-bounds during the time he and Arendt were together in the mid- to late 1920s.) Was it wrong to have an affair with a married man? Yes. Does it contradict her later views on judgment and responsibilty that she downplayed Heidegger's flaws even in later life and never lost her devotion to his mind? Yes. Was she therefore a self-hating Jew, harlot, and home-wrecker whose ideas deserve no consideration? No, and it's pretty slimy to suggest otherwise. <br> <br>By the way: Arendt's take on Cicero means nothing close to what you take it to mean. Read Greif's article again--or, better, read Arendt's actual essay. Plato does not represent in that passage the \"illiberal tyrant\" (Cicero would not have looked at Plato that way), and the differences between Plato's views and those of the Pythagoreans were not ones that Cicero's imagined characters could resolve with reference to the facts. Greif is using the passage as a metaphor for Arendt's moral cowardice on the question of Heidegger. Arendt, for her part, simply was arguing that when reason and facts fail, you wind up falling back on character, for better or worse. She was not saying that \"when I have to choose between being with a tyrant and being with people who tell the truth, I chose the tryant\"; she was saying, if anything, \"when I have to choose being right with people of poor character and being wrong with people of good character, I choose to be with people of good character.\" That  that position regarding Plato (not hers, but Cicero's) is questionable, and that she let her regard for Heidegger blur her own judgment of his character, in themselves takes nothing away from this point, arguable as some may find it to be. <br> <br>(It's useful, by the way, to think of this in the context of what was to be the opening epigram to Arendt's book on judging, from Cato: \"Victrix causa Diis placuit, sed victa Catoni\" [the victorious cause pleases the gods, but the vanquished cause pleases Cato]--questioning, as I read it, the belief that alignment of one's views with power guarantees the justice or truth of one's beliefs.) <br> <br>There's just no need to take these kinds of swipes at Arendt. Disagree with her, argue with her, but don't churn the swill like that.</p>"
