    html: "<p>&gt;Nowhere in any of this is it suggested that Eichmann was an unthinking cog in a bureaucracy <br> <br>Not so.   <br> <br>Here is Miller quoting Arendt: <br> <br>'According to Arendt, ... he was an ordinary bureaucrat who \"except for an extraordinary diligence in looking out for his personal advancement . . . had no motives at all.\" Her point is that Eichmann, though a high-level Nazi official, was not strongly influenced by Nazi ideas.\"' <br> <br>Then follows Miller's paragraph I quoted earlier refuting Arendt's claim. She is simply wrong about him having no motives, for he was in fact a fanatical devotee of Hitler.  <br> <br>Furthermore, she says, 'in the postscript to Eichmann in Jerusalem...: \"The essence of totalitarian government, and perhaps the nature of every bureaucracy, is to make functionaries and mere cogs in the administrative machinery out of men, and thus to dehumanize them.\" In her view, Eichmann was so much the bureaucratic man that he \"never realized what he was doing [emphasis in original].\"' <br> <br>But the reality was that, contrary to Arendt, he did realize what he was doing and knowingly choose to do it.  <br> <br>Miller, as I quoted earlier, does not think that anyone has made a general claim that people must be specially monsterous to do great evil. In fact in the view of both Judaism and Christianity ordinary people have the capacity for great good and great evil alike, and the choice. The fact that the prosecutor had this view is not indicative that his view is the traditional one, even though it may be common in drama.  <br> <br>The important point here is that you cannot shift the blame from individuals to bureaucracy itself, which is what seems to be the thrust of Arendt's argument, and what Nick and Eco were refering to. <br> <br>Bureaucracy certainly puts pressure on people to do wrong, but so does the rest of life. Some people have more moral courage and some less. Living with bureaucracy is one of the central moral challenges of our times. Arendt says that it is the nature of bureaucracies to dehumanize. But families and rulers could do that before. This pressure is not radically new; what is new is not the pressures but the efficiency of bureaucracy.  <br> <br>Her getting it wrong is to the point here, because a knee jerk reaction of many on these discussion boards is to see every bureaucracy and large organization as evil. All have tendencies to evil, but some are largely good and some largely evil, and there are all gradations in between. And it is up to us as part of them or dealing with them to do our part in a good way, and not to cooperate when they are going to do wrong.  <br> <br>What I see often on these boards is people totally condemning all corporations and also working for them or with them. This to me is an unsound as well as confused attitude. I would rather see a realization of the pressures, and a consciousness that it is within our power to deal with them.</p>"
