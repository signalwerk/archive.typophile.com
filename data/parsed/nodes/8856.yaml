    html: <p>There are plenty of conformist societies that are not fascist. The primary indicator of fascism is the militarisation of society (usually leading pretty rapidly to the fascist ideal of 'total war'). This has been the identifying feature of every fascist regime. <br> <br>So, for example, when your president lands on the flight deck of an aircraft carrier dressed in a military uniform, one has grounds for concern (especially when contrasted to President Eisenhower, who had every right to wear a uniform but, during his time as president, never did). I can't say I've ever felt the same discomfort looking at Helvetica.</p>
