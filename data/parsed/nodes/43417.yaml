      <p>Getting to specific fonts or font families requires a little more effort. Perhaps the two scripts below are more helpful to you.</p>
      <p>The first one makes samples of all the fonts that belong to the family or families provided in a hard-coded array — Minion Pro and Myriad Pro, in this case.</p>
      <p>The second one composes samples of all the fonts belonging to the family that is currently selected in the Character palette.</p>
      <p>Enjoy!<br>
      <code><br>
      var myFamilies = new Array('Minion Pro','Myriad Pro');<br>
      var myStory = app.documents[0].stories[0];<br>
      var myInsertPoint = myStory.insertionPoints[-1];<br>
      var fontFamilies = app.fonts.everyItem().fontFamily;<br>
      var fontIndexes = new Array();</code></p>
      <p>for (var x in fontFamilies) {<br>
      	for (var y in myFamilies) {<br>
      		if (fontFamilies[x] == myFamilies[y]) {<br>
      			x = parseInt(x);<br>
      			fontIndexes.push(x);<br>
      }}}</p>
      <p>for (var z in fontIndexes) {<br>
      var x = fontIndexes[z];<br>
      myInsertPoint.appliedFont = 'Myriad Pro';<br>
      myInsertPoint.fontStyle = 'Regular';<br>
      myInsertPoint.pointSize = 8;<br>
      myInsertPoint.contents = app.fonts.item(x).fullName + '\n';<br>
      myInsertPoint.appliedFont = app.fonts.item(x);<br>
      myInsertPoint.pointSize = 16;<br>
      myInsertPoint.contents = 'The quick brown fox\n\n';<br>
      }</p>
      <p>######################</p>
      <p>var myStory = app.documents[0].stories[0];<br>
      var myInsertPoint = myStory.insertionPoints[-1];<br>
      var myFontFamily = myInsertPoint.appliedFont.fontFamily;<br>
      var fontFamilies = app.fonts.everyItem().fontFamily;<br>
      var fontIndexes = new Array();</p>
      <p>for (var x in fontFamilies) {<br>
      	if (fontFamilies[x] == myFontFamily) {<br>
      		x = parseInt(x);<br>
      		fontIndexes.push(x);<br>
      }}</p>
      <p>for (var z in fontIndexes) {<br>
      var x = fontIndexes[z];<br>
      myInsertPoint.appliedFont = 'Myriad Pro';<br>
      myInsertPoint.fontStyle = 'Regular';<br>
      myInsertPoint.pointSize = 8;<br>
      myInsertPoint.contents = app.fonts.item(x).fullName + '\n';<br>
      myInsertPoint.appliedFont = app.fonts.item(x);<br>
      myInsertPoint.pointSize = 16;<br>
      myInsertPoint.contents = 'The quick brown fox\n\n';<br>
      }<br>
      </p>
