    <p>Hello, I just joined this forum. :) I hope this is the proper place for my post.</p>
    <p>I'm wondering if there is a good, efficient and pretty way to print (or export to PDF) font test/sample pages. I basically need two lines of information per font: 1) name of font; 2) a specific line of copy in a given size. My Suitcase Fusion does this, in a dirtier way, using the "Print Sample Pages" feature. I've typed out the line of copy in the "preview" box, but it's just so much clutter, and I'm unable to get rid of things like file location. Plus, it takes up an entire page per font.</p>
    <p>I've made my own manually in InDesign in the past, but it's incredibly tedious and there must be a better way. </p>
    <p>I appreciate any input! Please let me know if my post needs clarifications, and apologies if this belongs elsewhere.</p>
    <p>Thank you!<br>
    N</p>
