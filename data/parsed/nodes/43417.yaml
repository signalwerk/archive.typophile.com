      <p>Hi Nana, and welcome to Typophile.</p>
      <p>If you know InDesign Scripting, it should be fairly easy to do what you want. Below is a snippet that fills-in a text frame with info about the first 5 fonts available to InDesign. The result for me looks like this:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/IDScript_fontsample_6646.png"></div><p></p>
      <p><code><br>
      var myTextFrame = app.documents[0].textFrames[0];<br>
      var myInsertPoint = myTextFrame.insertionPoints[-1];</code></p>
      <p>for (x=0; x&lt;5; x++) {<br>
      	myInsertPoint.appliedFont = 'Myriad Pro';<br>
      	myInsertPoint.fontStyle = 'Regular';<br>
      	myInsertPoint.pointSize = 8;<br>
      	myInsertPoint.contents = app.fonts.item(x).fullName + '\n';<br>
      	myInsertPoint.appliedFont = app.fonts.item(x);<br>
      	myInsertPoint.pointSize = 16;<br>
      	myInsertPoint.contents = 'The quick brown fox\n\n';<br>
      }<br>
      </p>
