      <p>Could be a modified font or a custom design.<br>
      If nobody finds an exact match here is one that is almost there:<br><img src="/sites/default/files/old-images/ExcaliburMonospace_5368.jpg"><br>
      Its called Excalibur Monospace. Freely available on the web. No download link because I have no idea as to the legitimacy of this font.<br>
      Fonts with some similarity, but not as close: Consolas, Tahoma, Trebuchet &amp; Verdana, all packaged with Microsoft Windows.<br>
      Don</p>
