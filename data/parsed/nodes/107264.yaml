      <p>Thanks Ryuk for digging out the exact match.<br>
      Now that I look at it, and checking the font notes by Adobe, I do recall this awkward and rather ugly creation from the days when the secretaries used the IBM Selectric typewriter. I tried to avoid having it used whenever possible. Thankfully I did not have a lot of tables typed out.<br>
      But this creature is perfect for the Sopranos opening. Its crude text fits the sordid landscape through which Tony drives on the way to his mansion and the harsh antisocial background music.<br>
      Don</p>
