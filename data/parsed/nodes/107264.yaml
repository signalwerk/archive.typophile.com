    <p>I urgently need to identify the font used for displaying the actors' names (ie. James Gandolfini) in The Sopranos opening credits! I have searched as much as I could, but I just keep coming across the ‘Mobsters’ font.</p>
    <p>Thank you very much for your cooperation.</p>
