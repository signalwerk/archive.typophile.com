    html: |-
      <p>Your curve-to-line joins (like on the d and others) are too thick. This is a natural result of pushing a circle into a stem of the same line weight. Fixing it however would require breaking your strict geometric rule,but since it isn't followed at other places it should be an option.</p>
      <p>The curl of the at mark starts at a drop below the a shape making it look like a q. </p>
      <p>Some of your glyphs look like they came from different fonts (thorns, ampersand, dollar sign, math Greek). These should be unified. Also your accents are sized inconsistently.</p>
