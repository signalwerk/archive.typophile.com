    html: |-
      <p>I don't like how the leg (could someone put me right - is that the correct term?) of the R appears to stick out further than the bowl. It looks like your B, just with a broken bum, making it look out of proportion and condensed.</p>
      <p>I would either extend the bowl, or straighten out the leg - more like the Akzidenz Grotesk R, than the Helvetica R.</p>
      <p>I hope that makes sense!</p>
