      <p>Really like this! There is a charming clumsiness to it. However...</p>
      <p>I'm not a type designer,but from a graphic designers perspective, if I was using the typeface, the uppercase W would annoy me. Would work as an alternative character, but I would prefer something more like the lower case w, which is really nice! Basically, I'd rather have a more 'normal' W, and have the option of a fancier version if I wished.</p>
      <p> I don't really like the uppercase R either, but that is just personal preference. Also the uppercase G is too blotchy at the bottom.</p>
