      <p>Hi Zach<br>
      some observations...not a professional so feel free to ignore...:)<br>
      As well as the optical correction mentioned above, on the joins, I think you need some overshoot on the round shapes.<br>
      There seem to be different weights on some of your curves. E.g. c looks quite darker than b.<br>
      B looks narrow.</p>
