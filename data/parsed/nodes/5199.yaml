  html: <p>Great forum! <br> <br>We are selecting fonts for an upcoming novel, St. CROIX. <br> <br>The book is an historical fiction set in the 18th century.  <a href="http://www.tomahpublishing.com" target="_blank">www.tomahpublishing.com</a> <br> <br>Have chosen Bickham for the prologue, first letter on new chapters, and historical quotes.  We like Bickham especially since he would have been contemporary for the time, and the protagonist has a vast personal library.  The author is even including a discussion among characters about Bickham's "new" broadsides from Bickham's "The Universal Penman." <br> <br><a href="http://www.davidsongalleries.com/artists/bickham/bickham.html" target="_blank">www.davidsongalleries.com/artists/bickham/bickham.html</a> <br> <br>We are looking now for an appropriate book text font that will work with the Bickham embellishments. <br> <br>Thanks, <br>Zoe</p>
  html_clean: <p>Great forum! <br> <br>We are selecting fonts for an upcoming novel, St. CROIX. <br> <br>The book is an historical fiction set in the 18th century.  <a href="http://www.tomahpublishing.com" target="_blank" class="link-external">www.tomahpublishing.com</a> <br> <br>Have chosen Bickham for the prologue, first letter on new chapters, and historical quotes.  We like Bickham especially since he would have been contemporary for the time, and the protagonist has a vast personal library.  The author is even including a discussion among characters about Bickham's "new" broadsides from Bickham's "The Universal Penman." <br> <br><a href="http://www.davidsongalleries.com/artists/bickham/bickham.html" target="_blank" class="link-external">www.davidsongalleries.com/artists/bickham/bickham.html</a> <br> <br>We are looking now for an appropriate book text font that will work with the Bickham embellishments. <br> <br>Thanks, <br>Zoe</p>
