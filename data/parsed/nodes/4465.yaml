    html: <p>What Juhani says about non-Unicode-savvy OSes and applications is not true. <b>All</b> the Windows codepages for European languages have both euro and currency characters in separate slots (Western/WinANSI, Eastern European, Cyrillic, Baltic, Turkish, Greek). Microsoft extended their codepages to add the euro many years ago. These codepages are what single-byte fonts and applications work with. <br> <br>Although the currency symbol has few practical uses as a currency symbol, a lot of folks have ended up using it as a bullet or other kind of dingbat. Switching fonts and having it turn into a euro symbol would be a Bad Thing, and I have heard Windows users complain about it in fonts made by people who didn't know better. <br> <br>There is no reason whatsoever to put a euro (U+20AC) symbol in the currency (U+00A4) slot in an OpenType CFF font. For Classic and OS 8/9, the ATM driver maps the euro to the right slot in MacRoman for both viewing and printing. <br> <br>But there are good reasons NOT to double-map the euro symbol, as described above. So, for anybody asking for advice, I strongly discourage it, just as I would strongly discourage putting a euro in the slot intended for the letter E. <br> <br>Regards, <br> <br>T</p>
    html_clean: <p>What Juhani says about non-Unicode-savvy OSes and applications is not true. <b>All</b> the Windows codepages for European languages have both euro and currency characters in separate slots (Western/WinANSI, Eastern European, Cyrillic, Baltic, Turkish, Greek). Microsoft extended their codepages to add the euro many years ago. These codepages are what single-byte fonts and applications work with. <br> <br>Although the currency symbol has few practical uses as a currency symbol, a lot of folks have ended up using it as a bullet or other kind of dingbat. Switching fonts and having it turn into a euro symbol would be a Bad Thing, and I have heard Windows users complain about it in fonts made by people who didn't know better. <br> <br>There is no reason whatsoever to put a euro (U+20AC) symbol in the currency (U+00A4) slot in an OpenType CFF font. For Classic and OS 8/9, the ATM driver maps the euro to the right slot in MacRoman for both viewing and printing. <br> <br>But there are good reasons NOT to double-map the euro symbol, as described above. So, for anybody asking for advice, I strongly discourage it, just as I would strongly discourage putting a euro in the slot intended for the letter E. <br> <br>Regards, <br> <br>T</p>
