    <p>I'm not sure when this originated but...<br>
    what is the status of including the <a href="/wiki/Euro" class="freelinking" rel="nofollow">Euro</a> in the <a href="/wiki/currency" class="freelinking" rel="nofollow">currency</a> slot?<br>
