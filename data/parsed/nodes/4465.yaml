    html: <p>What OS are you on, and what format of fonts are you building? <br> <br>In MacRoman encoding, there's only one slot, and if you want to have both glyphs one has to be unencoded. In Unicode or Windows based encodings, put each in its proper place. <br> <br>If you need to worry about non Adobe Classic Mac apps, there are some extra wrinkles, which I've long since lost track of. I'm sure somebody else will chime in.... <br> <br>T</p>
