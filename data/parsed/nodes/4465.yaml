    html: <p>Oh, well that's easy, then. No reason whatsoever to put the euro in the currency slot. Each gets its own slot, and the euro will show up in the right place for MacRoman, including on Classic and OS 8/9. <br> <br>But you need to have both for Windows and full Unicode environments. WinANSI has separate slots for the two, and Windows users and folks in full Unicode environments will think there's something wrong if a euro shows up in place of the generic currency symbol. <br> <br>T</p>
