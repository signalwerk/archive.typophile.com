    html: "<p>&gt;Eric, don't worry, OT fonts (as other fonts based on TrueType table structure) have room for 65536 glyphs. It's enough for all currencies, which Unicode knows. I'm not sure, whether anybody needs the original currency sign for some purpose. Most Non-Unicode-savvy OS'ies and applications can't handle both currency (00A4) and Euro (20AC) sign in the same time, because they excist in (practically) no single 8-bit character set. A good rule of thumb: when dealing with OT fonts forget old apps and OS'ies. In practice you may put Euro sign in both slots, nobody will hardly complain.</p>"
    html_clean: "<p>&gt;Eric, don't worry, OT fonts (as other fonts based on TrueType table structure) have room for 65536 glyphs. It's enough for all currencies, which Unicode knows. I'm not sure, whether anybody needs the original currency sign for some purpose. Most Non-Unicode-savvy OS'ies and applications can't handle both currency (00A4) and Euro (20AC) sign in the same time, because they excist in (practically) no single 8-bit character set. A good rule of thumb: when dealing with OT fonts forget old apps and OS'ies. In practice you may put Euro sign in both slots, nobody will hardly complain.</p>"
