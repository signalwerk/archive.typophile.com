    html: |-
      <p>FWIW: Have just downloaded and tried that utility; seems to work as described on Adobe fonts. Mixed results on others, but that's acknowledged by the creator. Gives you access to small caps, OS figures, ligatures and related features if they were included in the font. Doesn't get at alternate glyphs. Because of the structured way it creates the name for the font containing the accessed characters, Word users could presumably then code a macro to swap out characters from one font to the other according to their own preferences. (Like, swap numerals to OSF except within a table, swap to small caps where a particular style's used - or where faux small cap formatting is applied! etc.)</p>
      <p>__________________________________________<br>
      Ever since I chose to block pop-ups, my toaster's stopped working.</p>
