    html: |-
      <p>Preferred answer:<br>
      Use only applications that support OpenType Layout features.</p>
      <p>Alternative answer:<br>
      Word uses the Unicode codepoints. Any character with a Unicode codepoint can be entered into Word -- through standard system mechanisms such as an appropriate keyboard layout, the Character Map application (through the clipboard), and also by methods specific to Word, e.g. typing the four-letter hexadecimal code and pressing Alt+X, or through a VB macro.<br>
      <a href="/wiki/Adam%20Twardoch" class="freelinking" rel="nofollow">Adam Twardoch</a>, in <a href="http://groups.msn.com/FontLab/general.msnw?action=get_message&amp;mview=0&amp;ID_Message=5986" rel="nofollow">FontLab forum</a></p>
      <p>N.B.: As Thomas said, Adobe will soon abandon the practice of using PUA codepoints, so the use of the method above is highly discouraged (even with fonts that contain PUAs nowadays).</p>
