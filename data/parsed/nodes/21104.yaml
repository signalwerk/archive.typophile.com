    html: |-
      <p>Adobe's existing OpenType fonts ALL encode every single glyph in the font, with the small caps, oldstyle figures, etcetera at standardized Unicode positions (around U+F6xx-F7xx).</p>
      <p>So there's no need to hack apart the font with special tools. You can access all those glyphs now.</p>
      <p>Mind you, Adobe is also abandoning this approach in new fonts moving forwards: glyphs without legitimate Unicodes, that are alternates or ligatures of standard characters, will be left unencoded (accessible by OpenType layout features).</p>
      <p>Regards,</p>
      <p>T</p>
