      <p>Interesting, but the consequence is that no additional spacing seems to be required if I rely on your grab (I see no room left for additional French spacing if I rely on my grab).  </p>
      <p>Notice as an aside that in TeX, there is no "thin space character"; <code>\thinspace</code> is a kerning command. What babel does with the french option is that it first removes all space between the last letter and the punctuation mark (semicolon, question or exclamation mark) and then it positively kerns  the mark, the kerning being done (indirectly) by the <code>\thinspace</code> command that I, maybe unorthodoxly, redefined above.</p>
      <p>By the way, I heard that inDesign has a "grep" command. Is it then not possible, using a properly chosen pattern,  to add some positive kerning before punctuation marks?</p>
