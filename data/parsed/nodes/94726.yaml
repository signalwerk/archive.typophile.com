    user: 18942
    date: 2012-08-06T14:17:00
    date_raw: 6 August 2012 - 2:17pm
    votes: 0
    html: |-
      <p>For dates, <a href="http://bdl.oqlf.gouv.qc.ca/bdl/gabarit_bdl.asp?Th=2&amp;t1=&amp;id=1606">La typography – Année</a> specifies that the two years must be written full length and separated by a  <em>trait d'union</em> (hyphen) (1965-1978 instead of 1965-78). The same rule is given in my 1976 edition of the "Lexique des règles typographiques en usage à l'imprimerie nationale" (p. 108). </p>
      <p>According to both the <code>.gc.ca</code> link <a href="http://www.noslangues-ourlanguages.gc.ca/bien-well/fra-eng/typographie-typography/ponctesp-poncspac-fra.html">Les signes de ponctuation et leurs espaces</a> and the <code>.oqlf.gouv.qc.ca</code> link <a href="http://bdl.oqlf.gouv.qc.ca/bdl/gabarit_bdl.asp?t1=1&amp;id=3319">La punctuation</a>, French distinguishes <em>trait d'union</em> (hyphen) and <em>tiret</em>. The entry <a href="http://bdl.oqlf.gouv.qc.ca/bdl/gabarit_bdl.asp?t1=1&amp;id=3378">Tiret : généralités</a> of the OQLF simply states that it is longer than the <em>trait d'union</em>. Both sites encode their <em>tiret</em> as an en-dash; my 1976  edition of "Lexique" would have used an em-dash instead.</p>
      <p>Things  get tricky when there are dialogues, where the em-dash seems to be preferred. I have found sites (a full course on typography in Belgium, links in France and Québec) stating that  the em-dash is to be used for dialogues and the en-dash for other instances of <em>tiret</em>. <a href="http://correcteurs.blog.lemonde.fr/2010/09/01/le-cadratin-—-dans-tous-ses-etats/ ">This blog</a> in  <code>lemonde.fr</code> however makes fun of that practice, arguing that there is just one <em>tiret</em> in French and you choose either the en-dash or the em-dash. The same blog states that use of the em-dash has almost disappeared from the press. I had a look at a few of my books and found five from different editors (two from Québec, three from France) that use the em-dash, and two others (one from Québec, one from France) that use the en-dash (consistently, so far as I could see).</p>
