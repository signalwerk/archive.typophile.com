      <p>As a Canadian, I design and do production for many projects for one client that need to be done in both French and English. We use an extra space before a colon and after an opening guillemot (quotation mark) and before a closing guillemot, but not in any of the other instances you’ve mentioned. For a while we were kinda sorta also putting extra space before a question mark and an exclamation mark, but that was dropped; I don’t see much (if any) of that usage in Canadian French.</p>
      <p>David</p>
