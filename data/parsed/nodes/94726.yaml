      <p>This has been super helpful -- many thanks for the detailed feedback and consideration of this issue.</p>
      <p>One final question (for now): Is it standard practice to use hyphens (-) between number ranges instead of the standard (in English) use of an en dash (–)? Also is standard usage to use an en dash (–) in place of an em dash (—) in offset statements and interjections? I am seeing some conflicting advice on this. The manuscript I received from our editor includes things like: "1965-78" and "such and such – and such and such", which, to my eye, <em>looks</em> incorrect.</p>
