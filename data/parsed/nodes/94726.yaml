    html: <p>I generally set semicolon and colon wider than comma and period. The potential pitfall of offsetting the colon to the right is that it will not be centered between figures when setting times, as in 10:00 for instance. But I suppose adding a standard positive kern for <a href="mailto:colon-@figures">colon-@figures</a> to offset the offset is not too burdensome.</p>
