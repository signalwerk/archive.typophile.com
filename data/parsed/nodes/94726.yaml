      <p>After reading more carefully the <a href="http://www.noslangues-ourlanguages.gc.ca/bien-well/fra-eng/typographie-typography/ponctesp-poncspac-fra.html">Government of Canada link</a> I realize there is one major difference with the corresponding information on the <a href="http://bdl.oqlf.gouv.qc.ca/bdl/gabarit_bdl.asp?T1=espace&amp;T3.x=0&amp;T3.y=0">OLF site</a>:  on your noslangues.gc.ca link, it is explicitly said that the thin space is about 25% of a normal space; on the corresponding link of the Office québécois de la langue française (<a href="http://bdl.oqlf.gouv.qc.ca/bdl/gabarit_bdl.asp?t1=1&amp;id=4565">types d'espacement</a>), it is simply said that the thin space is "une espace insécable réduite", a reduced space; nothing is said on how much it is expected to be reduced. On a site in France I have seen that the thin space should be about 50% the width of the normal space. With LaTeX, I get a thin space that is 0.167 of an em, which may be quite large for some fonts; for instance with Arno Pro, I get a normal space of less than 0.2 of an em so that the thin space is about 83% of a normal space, which is too much for me. Here is a test with pdfLaTeX using Arno Pro installed for LaTeX. First the input file (using texlive 2012 and my own arno package)</p>
      <p>\documentclass[twocolumn,10pt]{amsart}<br>
      \usepackage{arno}<br>
      \usepackage[french,english]{babel}<br>
      \begin{document}<br>
      \newlength\iws%<br>
      \setlength{\iws}{\the\fontdimen2\font}</p>
      <p>\selectlanguage{french}<br>
      | e; e | e! e | e? e |\par<br>
      \def\thinspace{\kern 0.5\iws}<br>
      | e; e | e! e | e? e |\par<br>
      \def\thinspace{\kern 0.25\iws}<br>
      | e; e | e! e | e? e |\par<br>
      \selectlanguage{english}<br>
      | e; e | e! e | e? e |\par<br>
      \end{document}</p>
      <p>and now a grab of the output:<br><img src="/sites/default/files/old-images/french-spacing_4013.png"><br>
      The first line uses 0.16657 of an em, the second 50% of the normal space, the third 25% of a normal space and the last line uses the English spacing.  The first line is much too loose. The second and third look fine to me. </p>
      <p>Michel</p>
      <p>PS. Sorry, I don't know how to do that in InDesign.</p>
