    html: |-
      <p>It appears to be Caledonia, designed by W.A. Dwiggins in 1939 for Mergenthaler Linotype. The page you scanned for this sample may have been printed from metal type (or by an offset reproduction of a page printed from metal type), which would account for the "smudged" appearance.</p>
      <p>Caledonia was one of the most popular typefaces for trade book composition in the 1950s and 60s. (<em>The Catcher in the Rye</em> was published in 1951.) Georgia was designed by Matthew Carter in 1993.</p>
