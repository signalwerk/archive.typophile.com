    html: |-
      <p>Thank you for your support!</p>
      <p>@Thomas</p>
      <p>The font should be converted to paths for printing. This only on 10.4 system.<br>
      In 10.6 it is ok.</p>
      <p>@Twardoch</p>
      <p>I disabled that.<br>
      I opened .otf font, and at the exporting i have an error in output window:</p>
      <p>"[FATAL]  aborting because of errors:<br>
      syntax error at "NULL"<br>
      [/Users/user/Library/Application Support/FontLab/Studio 5/Features/fontlab.fea 75]<br>
      ERROR: There was a problem while compiling OpenType font. Final .otf font is not saved. Please, check OpenType features definition for errors"</p>
      <p>More specification:</p>
      <p>For examaple the font "AmericanTypewriter" Bold and Medium.</p>
      <p>In 10.4 looks just Medium style, whatever i choosed (Bold or Medium)<br>
      In 10.6 it is ok.</p>
      <p>I cleanup font cash, etc, etc.</p>
      <p>Thank you again,<br>
      Edmond</p>
