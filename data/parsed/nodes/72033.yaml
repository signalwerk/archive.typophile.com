  html: |-
    <p>Hi everyone,</p>
    <p>I used FontLab Studio to add some special character to AGaramond font for example.<br>
    After that, exported to .otf Mac OS X.</p>
    <p>The font it is ok in Freehand MX on 10.6 display correct, printing ok that special characters.<br>
    In Mac OS 10.4.11 same font, same file, same application, change the style, printing issues, etc.</p>
    <p>What is the difference between 10.4 and 10.6 in this case?<br>
    Or how should i export a font to work normal in Freehand MX, display and printing correct.</p>
    <p>Thank you for your patience,</p>
    <p>Edmond</p>
