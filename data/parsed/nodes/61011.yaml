  html: |-
    <p>Dear Typophilers,</p>
    <p>CakeType is proud to announce the release of Aniek.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Aniek_4586.gif"></div><p></p>
    <p>Aniek is based on a real non-connected handwriting, with an angle to the left. The typeface is designed for optimal readability in small sizes but also works well in larger sizes. The family includes seven weights from Light to Black with an extended (Latin) character set. OpenType features include slashed zero and alternative shapes for the f and fi ligature.</p>
    <p>~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~</p>
    <p>DISCOUNT<br>
    To celebrate the release of Aniek and because it’s summer, we give a 50% discount on the Aniek family package and the two smaller packages.<br>
    This offer is valid during the entire summer of 2009!</p>
    <p><a href="http://www.caketype.com/type/aniek" title="http://www.caketype.com/type/aniek">http://www.caketype.com/type/aniek</a></p>
    <p>~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~</p>
    <p>Best wishes,<br>
    Pieter van Rosmalen<br>
    <a href="http://www.caketype.com" title="http://www.caketype.com">http://www.caketype.com</a></p>
