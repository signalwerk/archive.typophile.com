    <p>Hello, I was hoping I could get some new eyes on this logo. I think it is pretty close to being done, but any critiques would be very welcome. </p>
    <p>A little background on the company:</p>
    <p>1) First off, I did not choose the name of the company. It still urks me.<br>
    2) The company specializes in ceilings of all sorts, but also does woodwork (such as carpentry, cabinetry, and other wood-related practices)<br>
    3) The guy has been doing this stuff since about 1970 and is very traditional in his approaches.</p>
    <p>I obviously tried to encompass these traits and really work to convey a traditional, old-style, blue-collar feel.</p>
    <p>Again, please let me know what you think, be it general or specific.</p>
    <p>Thanks very much for looking!</p>
