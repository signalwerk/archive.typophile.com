      <p>Thank you all for the great critiques. It’s really great to have such good, critical looks available. So that you all very much.</p>
      <p>I am actually going to try sharper corners. I’m not sure if I want them to be square, as part of the concept was that it was to look like it was an old-school wood routed sign, but maybe a little less rounded. Thanks!</p>
      <p>Kristi, to answer your question: all told, this logo probably took about 10 hours of work, not including visual research and planning. And unfortunately, for this one, I did not start by sketching, although I went back to it a couple times. Part of my process is to get jobs, really dig into researching them -visual and otherwise- then let them simmer for a while. In this case what took so long was that the company name is very, very vague and hard to work with, so I got trapped into thinking that I could make it whatever I wanted, which was not the case. When I went back and thought about the founder, the work and what the company actually did I realized the name was just that: a name; and that the actual look and direction for the design was better predicated by those other factors, and not on the name itself.</p>
