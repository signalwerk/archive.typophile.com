      <p>This isn’t a comment on the type... which as been addressed ad-nauseum. First off, this is a very elegant looking design, and would look fabulous as a wood etched sign. Two things jumped out at me.</p>
      <p>First, the border is very nice, but it’s also very heavy and compared to the weight of the text, seems almost too heavy. My eye is drawn to it almost immediately. This almost give the text inside a very trapped feeling to it.</p>
      <p>Second, is more of a nit-picky issue. The rounded corners of the border, though keeping with the soft look of the inner stroke, seems too soft. I think sharp corners would play against the softness of your detail better.</p>
      <p>Those are my opinions, either way, you have a nice design going for this.</p>
