      <p>I’ve seen this elsewhere...this appears to be a nice progression to this point. I agree, silly name, but you’ve done well with what you have to work with.</p>
      <p>It literally says ’ceilings’ but the look and feel certainly give a nice craftsmanship feel to acknowledge the greater service offerings.</p>
      <p>Only major thing is that the ’S’ in ceilings appears optically larger, even though I’m sure it’s not. You might want to fudge the size of that a bit to bring it in balance.</p>
