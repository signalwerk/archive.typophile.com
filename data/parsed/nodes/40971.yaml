  html: |-
    <p>Have a project and a client that doesnt like my first layout. He likes the wordmark itself but he thinks the Y symbolises crossroads and splitting, not sharing and collaborating, which its meant to.</p>
    <p>He would like to see maybe 4 nodes, one in the middle, but that would make the wordmark look crap.</p>
    <p>How would you solve this? Ideas?</p>
