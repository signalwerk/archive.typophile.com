    html: |-
      <p>Good concept. Things like E, F, K are the big strength.</p>
      <p>What you need to do is round out your curves. S, O, Q are good; you should want to make the other curved letters remind you of them. U should not be flat on the bottom. C needs to taper the curve into the horizontals more smoothly with regard to weight. The same thing is not quite as noticeable in D but it would help. G you may need to rethink entirely.</p>
      <p>The stacked LL needs more space in it. CC is a good guide for the amount of space.</p>
    html_clean: |-
