    <p>This was recently posted on Design Observer and I thought you all may be interested.</p>
    <p>The first one contains footage of Frederic Goudy going through the process of making a typeface.</p>
    <p>(note: the smock he wears is for the film only - normally he would wear a shirt, apparently)</p>
    <p><a href="http://typeculture.com/academic_resource/movies/" title="http://typeculture.com/academic_resource/movies/">http://typeculture.com/academic_resource/movies/</a></p>
    <p>Regards, </p>
    <p>Graham</p>
