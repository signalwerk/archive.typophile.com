    html: <p>A little news about TypeCon2003, so attendees can plan their travel accordingly. <br> <br>The conference is expanding to 4 days this year. Previous years have been 2.5-3 days... Workshops will be Thursday and Friday, with the main program beginning first thing Friday morning and running through Sunday at 6pm.  <br> <br>There will also be several special evening events every night as an integral part of the conference. <br> <br>Online registration will begin end of Feb./first of March, and the conference fees will remain very inexpensive, even with the added programming and special events. <br> <br>More information to come...</p>
