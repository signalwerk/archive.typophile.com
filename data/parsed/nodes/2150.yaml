    html: <p>I'm sure someone will disagree with me, but I have to say there are no rules about placement. You should leave it open and call it situation dependant. For instance, You could even use the logo and the wordtype in two different places. With the letterhead, another for instance, the logo could be off to the side toward the top and the wordtype could be used with the address somehow. If you believe they should be used together, I would probably opt for one of those without the E4 ... or ... where the two E4s aren't right next to each other. I'm guilty of not following this entire thread, but I enjoy this solution. Edgy, clever ... without being cute or over-the-top. I love the acid green too. (or that is how my monitor shows it to me anyway)</p>
