    html: <p>just to pick up on the point about people not noticing that the logo says e4, i dont really think this is a problem. I think that the shapes are such a strong form that even if people dont notice at first its a strong enough image to stick in peoples heads. Then when they notice that its an e and a four they will go 'oooo!' Quite afew TV companies in UK have logos like this and I dont think they suffer for it.  <br>Perhaps you could even say e4 matrix under the logo or employ the idea above (see below). What I'm really tryin to say is that I hope you dont back away from this design becuase of an(imho) unjustified thought that people might not see what it says. I think its a great deign (Scotts rotation has really put the icing on the cake).  <br><img src="http://www.typophile.com/forums/messages/29/21207.gif" alt=""> <br><img src="http://www.typophile.com/forums/messages/29/21208.gif" alt=""></p>
