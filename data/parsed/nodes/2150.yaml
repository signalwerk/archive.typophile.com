    html: "<p>I appreciate the discussion about the legibility of the interlocking characters. I am open to debate, but feel that it is fairly legible as is, and and it would only become more memorable if someone uses a little effort to make sense of it.  <br> <br>That being said, e4 will be promoted primarily through word of mouth or personal interaction, which I believe allows for a little more obscurity in the design. <br> <br>Mike, thanks for your ideas. I'm convinced that adding the \"E\" above the \"M4trix\" only complicates things and I don't think i'll be heading down that road. <br> <br>I have been experimenting with this very thing and am pleased by the addition of \"E4\" to the text. but, maybe it's redundant... <br> <br> <br> <br><img src=\"http://www.typophile.com/forums/messages/29/21232.gif\" alt=\"\"> <br> <br> <br> <br>I'd love comments about a few specific things: <br> <br>-My placement of \"matrix\" in the promary usage, which I've offset slightly right to accomodate for the heavy e. <br> <br>-How to use this logo at smaller sizes. (ditch the logotype?, move it to the right as shown?...) </p>"
