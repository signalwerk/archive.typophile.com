  html: <p>Hello, everyone. This is my fist posting to the forum. I've been reading this forum for a few weeks and have learned quite a bit from your critiques. Thanks! <br> <br>I am currently designing a logo for a progressive non-profit, for their new leadership-development program. they have already settled on the name, which refers to this resource network (of 4 parts)... unfortunately i couldn't talk them out of using "matrix" since that word has been killed. <br> <br>I am soliciting any feedback that you may offer, the more brutally honest the better. On this forum I have watched some pretty mediocre designs begin to sing after the valuable critiques provided by all of you. <br> <br>I'd love to hear which direction(s) have the most potential, and any ideas with integrating the "matrix." Thanks in advance. <br> <br><img src="http://www.typophile.com/forums/messages/29/20908.gif" alt="Some different avenues I've been exploring..."></p>
  html_clean: <p>Hello, everyone. This is my fist posting to the forum. I've been reading this forum for a few weeks and have learned quite a bit from your critiques. Thanks! <br> <br>I am currently designing a logo for a progressive non-profit, for their new leadership-development program. they have already settled on the name, which refers to this resource network (of 4 parts)... unfortunately i couldn't talk them out of using "matrix" since that word has been killed. <br> <br>I am soliciting any feedback that you may offer, the more brutally honest the better. On this forum I have watched some pretty mediocre designs begin to sing after the valuable critiques provided by all of you. <br> <br>I'd love to hear which direction(s) have the most potential, and any ideas with integrating the "matrix." Thanks in advance. <br> <br><img src="http://www.typophile.com/forums/messages/29/20908.gif" alt="Some different avenues I've been exploring..."></p>
