      <p>John is more than right in recommending the old volumes getting viewed at with care. A lot of change happens in about Hundred years …<br>
      Nevertheless, even the old books like Faulmann provide plenty of useful and – mostly – reliable information since their making was closely related to typographic practice. On the other hand, when linguists handle the matter of writing systems and alphabets this can bear pitfalls for the graphic practitioner.<br>
      In the Faulmann one finds also some really rare information about off-the-beaten-track alphabets, e.g for Cyrillic in Romania or past Albanian alphabets.</p>
