      <p>I am lucky to own a copy of “Alphabete des Morgen- und des Abendlandes” which was issued by the German Reichsdruckerei in 1927. Surely it is not exhaustive but it covers an admirable range of alphabets both ancient and modern – all (!) set in lead type. It also contains brief references to treatises on language and orthographies respectively.</p>
      <p>Another source I found quite useful is a similar book by Carl Faulmann which has been reprinted and seems to be <a class="freelinking external" href="http://www.abebooks.com/servlet/SearchResults?an=Faulmann&amp;sts=t&amp;x=55&amp;y=12" rel="nofollow">easily to obtain</a>.</p>
      <p>And there is a compendium of lead type alphabets (both ancient and modern languages) from the stock of the French Imprimerie Royal (from the 1990ties).</p>
