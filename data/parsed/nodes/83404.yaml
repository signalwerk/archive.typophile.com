      <p>I am wandering off topic, but the complications of Chinese make generalizing difficult.  For example, many of the "modern" simplified forms are just short-hand versions common for centuries -- some probably pre-date movable type.  Certainly classical Chinese is very different from modern (as Latin is from English), but modern dialects can be transcribed as easily with traditional characters as simplified -- the People's Republic expanded their early computer character set ("Guobiao") largely by folding in the Taiwanese standard ("Big-5," all traditional).</p>
      <p>Some advocate moving Chinese to an alphabetic script to avoid the time spent learning and typing thousands of characters.  The first objection is always that written characters serve as a bridge between modern dialects that otherwise seem mutually unintelligible (such as Cantonese vs. "Mandarin").  Even within the most common dialect (普通话 or "ordinary speech") characters offer the surest way to distinguish among the many homophones; in conversation, it is not unusual for one party to "write" a character with a finger on his or her palm to clarify meaning.  (In modern American English, the meaning of "POS" may or may not be clear: possibilities include "point of sale," "parent over shoulder," and "piece of sh*t"; sometimes the meaning is clear from the context, sometimes you need to spell it out.)</p>
      <p>The consequences of technology for "written" Chinese are staggering.  Before computers, typewriters were simply too complex for ordinary use.  But, with text messaging cheaper than voice, China passed a billion messages per day years ago, when cell-phone screens and keypads were tiny.  Now smart phones let you input characters by drawing them on-screen.</p>
      <p>In modern Chinese, there is overlap between speech and writing, and between hand-written forms and typed.</p>
      <p>David</p>
