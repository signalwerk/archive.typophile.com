  html: <p>Are there books that describe languages and include an alphabet of the language? I can find plenty of books that tell me where languages are used, who uses them, the history, etc., but simple tables of alphabets and orthographies seem to be limited to Omniglot and Wikipedia. I have nothing against Omniglot or Wikipedia but I would like something that I can browse rather than query.</p>
