    <p>I want to add the title of the card at bottom. However, Its debatable since some decks don't have them. The Tarot of Marseilles does have titles and my set is loosely patterned after it. I like the French decks so I like the typography to match the style. I chose Baskerville initially but I'm not certain of it. Can anyone offer some insight or suggestions what I should do typographically? </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/temperance_4891.jpg"></div><p></p>
