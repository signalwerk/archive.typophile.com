      <p>Excellllent. Some suggestions:</p>
      <p><a href="http://www.myfonts.com/fonts/storm/jannon/" rel="nofollow">Storm Jannon</a>. Based on an antique French model, excellent update by Frantisek Storm.</p>
      <p><a href="http://www.typophile.com/node/9245" rel="nofollow">Christian Gothic</a>. No, it's not released, but I'd be happy to let you work with a beta version if you felt it was right.</p>
      <p><a href="http://www.myfonts.com/fonts/bitstream/della-robbia/" rel="nofollow">Della Robbia</a>. It's based on an Italian model rather than French, but has the right flavor of antiquity and matches the low stroke contrast but sharp features of the card you showed.</p>
      <p><a href="http://www.myfonts.com/fonts/shinn/beaufort/" rel="nofollow">Beaufort</a> by Nick Shinn. A beautiful modern update to the same genre as Della Robbia, and by a designer who's still breathing.</p>
      <p>Most of all, have fun! Go with whatever works best visually with your artwork.</p>
    html_clean: |-
