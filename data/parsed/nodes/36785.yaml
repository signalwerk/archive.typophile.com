    html: |-
      <p>Oddly, tho' not really authentic for a French deck (perhaps one based on the Swiss, however), I like the suggestion of the Della Robbia. Look, carefully whether you'll want a boldface to make an impression with the illustrations on the Major Arcana. Brings up a good question: Are you fully illustrating the minor Arcana--i.e, the Ace  of Cups, Nine of Pentacles, etc.--as many decks do? If you've thought of just using the number and suit for the Minor, I'd suggest having a look at the Crowley deck.</p>
      <p>Good luck with this. There are many, many variations. It takes a stout heart, I think, to wade in to a design with such a long history of different versions going back so many years.</p>
