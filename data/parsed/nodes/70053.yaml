    <p>Hi guys,<br>
    i'm totally new here. I wanted to ask you if it's possible to do a string replacement via opentype programming? you know, it's possible to replace ligatures </p>
    <p>sub f f by ff;</p>
    <p>however is it possible to do something like this?</p>
    <p>sub a b by c d;</p>
    <p>So if i type "ab" i get "cd"?</p>
    <p>Thank you for your help and your tips.</p>
