      <p>There are some problems with balance: the axises are off. Consider /g/ — you have critiqued others with the remark that it leans back etc., well so does yours in relation to /e/. And /a/ has a similar disbalance, probably because the bowl has a belly that’s pulling the ear down.</p>
      <p>The way you cut the lower part of /d/'s stem is interesting, but this is an isolated ‘message’ because you treat the same area of /a/ in different, more traditional way.</p>
      <p>I’d like to suggest that you should define some basic characteristics and try to stick to them when constructing the font. These basic characteristics may seem to confine your creativity, but actually they will help you design a harmonious set of glyphs (where i use that word in its meaning of being of one family). And in case you re-define one of your principles, it is far easier to implement.</p>
      <p>I would like to paraphrase a great Dutch designer by stating that a designer first of all analyses a problem and then defines its solution.</p>
