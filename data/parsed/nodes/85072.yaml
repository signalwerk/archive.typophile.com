    html: |-
      <p>Bert. The asymmetrical serifs are indeed a design principle. It's not persued in letters like v w x etc, because of the sharper corner there. I tried it and making it smooth just doesn't work. I might get rid of the asymmetrical serifs, though the difference between letter like v w x and n m l doesn't bother me at all.</p>
      <p>I suppose by "flare-like broadening" you mean the bend to the right at the top of i and j. This is seen in many fonts and is actually to compensate for the serif at the top left. What do you mean with "lean back to the right"?</p>
      <p>I'm glad you like it :-)</p>
      <p>Offtopic: I was told there's an article in the Publish magazine, which briefly discusses something about a mistake in the typography of De Volkskrant. IIRC you mentioned that you once wrote a letter to De Volkskrant about that and they published it, so I thought you might be interested.</p>
      <p>Cheers!</p>
