      <p>There is something not quite right about the execution of what appears to be a design principle: the asymmetric serifs. The left ones are curving, the right ones straight(ish). That principle is not upheld in for instance the /x/ and the /k/. </p>
      <p>The other thing that bothers me is the application of the flare-like broadening of certain elements that unhinge the balance of certain glyphs. Eg in your larger sample it shows in the /ij/ combination. I assume both glyphs share most of their form, but the /i/ appears to lean back to the right in comparison to the /j/. I think that the stress introduced by that broadening needs to be compensated in the lower part of /i/ by (maybe) extending the serif a bit, or putting some stress in the area where the stem approaches the serif.</p>
      <p>That said — I kinda like the overall design.</p>
    html_clean: |-
