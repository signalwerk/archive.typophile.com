      <p>Think about how the sans and serif need to work together. How often will they be mixed inline, and if they are, do serifs not play a role in apparent size? And maybe deviating their apparent size could actually be useful... In any case, remember that in a text font lining things up exactly is almost never the point, so don't discount nudging around things like the x-height. I <em>would</em> keep the caps and numerals lined up though.</p>
      <p>hhp</p>
