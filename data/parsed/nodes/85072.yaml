      <p>This is beautiful work Jasper. I love the thin joins, it looks to be a rationalised Lexicon with influences of things like Arnhem or even Mercury.</p>
      <p>I agree about the x. I've tried this style and it seems very difficult to make it work.</p>
      <p>/u/ may be slightly wide.</p>
      <p>X-height isn't quite even. Look closely at the /v/ next to the /u/. I think this may answer the difficulty Craig raised about the arched letters with their spurs. If in doubt print a line of text and look at it end-on.</p>
      <p>The ball terminals are great, but I think I'd make them crisper on the inside (they look slightly teardrop shaped).</p>
      <p>Tail of /y/ is weak.</p>
      <p>Perhaps, just perhaps, make the bowl of /g/ a fraction smaller.</p>
