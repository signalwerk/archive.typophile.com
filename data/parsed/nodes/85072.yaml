      <p>Redesign x. It is an unintentional swastika that creates a distracting illusion of movement.</p>
      <p>The ball terminal on y is too small.</p>
      <p>f is too limp and too wide. It looks like a willow tree hanging out over a river, but the tiny baseline serif is not big enough to support the weight. This is entirely out of place with lively feeling in the rest of the letters.</p>
      <p>Overall I like the feeling of this face. At first glance it seems like a typical Dutch book face. But the more I look the more I see something much more youthful and vibrant. Keep putting that energy into the font as you fill it out. Watch out for calligraphic curves that start getting soft, which is happening to the loop of the g and the descender of the y.</p>
