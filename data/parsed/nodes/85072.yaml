      <p>First impression: the full stop is too heavy. Aim for something similar to the thinner part of the diagonal width. (Hope this makes sense).<br>
      Also: I prefer slightly taller descenders and ascenders. There IS a point where the portruding parts help figuring out the shape and meaning of words for the reader. That means that there has to be a certain difference between the x-height and the glyphs that ‘hold out their arms’. Try blurring some samples in PhotoShop and you will see what I mean.</p>
      <p>On an altogether different note: why are you aiming for a coherent sans/serif family? Why not cut your teeth on a display face?</p>
