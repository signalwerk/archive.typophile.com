      <p>I have't really looked at the full stop in detail, but I guess you're right.</p>
      <p>The length of ascenders and descenders is a tough call, because it has to match the sans serif. Or would it be ok to give the serif longer ascenders/descenders?</p>
      <p>I'm going sans/serif because 0. It's a great learning experience. 1. It's a way to stand out (if not much) from the crowd. 2. It's functional. 3. Designers like it a lot because they think it takes away their job of pairing fonts, so it should help sales. Perhaps I'll also make a display version out of Sensato Serif, but that's not really on my mind now.</p>
