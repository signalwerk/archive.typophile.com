      <p>Thank you James. The extreme thinning does look a little off at first. It did to me too. However, after a while (non-typedesigners are not bothered by it in the first place) I got used to it. In text, it creates something that untill now (hopefully) could only be achieved with Lexicon. I don't know how to explain it, and really you should see the NRC Handelsblad in real life to find out, but looks 'new', fresh and vivid.</p>
      <p>Underneath is a picture for a quick comparison. As you might tell from the picture, I'm trying to catch that "newness" from Lexicon, while toning down the quirks, making it suitable for display usage too. I also included some Sensato traits, leaving my personal mark. Well, that's the idea.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Picture12_3978.png"></div><p></p>
    html_clean: |-
