    html: "<p>Just jiggle the bait a bit like you're doing :-) <br> <br>Overall, very nice. <br>You'll need to decide if you're doing a super streamlined interpretation and stick with it. Notice the lc x. wobbly (handtooled looking). Not a bad way to go on something like this but you need consisency. <br> <br>U. Add a scroll to the top left like the N <br>k: The upper arm is inconsistent. <br>lower case: color issues. Compare how dark the p is vs the n. Your rounds are generally too thick (I think, but check it in text) <br>q: make the top of the stem a point, not flat. <br>VWvw: serifs on the points? (could be the style) <br>R: right leg too stiff. Maybe a scroll here too. <br>Q: tail needs more pizazz in a font like this, surely! Go absolutely crazy nuts. Make it a 3 mile long dangling mess of scrolls or something. <br>serifs: all serifs are not the same length! Consider a cupped serif. <br>I (cap i): Looks naked. Add some decoration. <br>Euro: give the cross bars some curls <br> <br>Is this guy dead? If so, how dead? Does anyone own the rights? How close is this to the original?  <br> <br>Fish on! <br>Randy</p>"
  - id: 30921
    user: 2910
    date: 2004-04-07T12:26:00
    date_raw: 7 Apr 2004 — 12:26pm
    votes: null
    html: <p>WOW! i got Randy Jones to gimme a crit. I was hopin you'd take a look at this one and give me come feedback. I guess i was too excited to get this up and thus didn't bother with the back history (or even finishing that lc x) But here's <a href="http://www.typophile.com/forums/messages/30/24232.html" target="_blank"> a little backhistory</a>. <br>I started this project because i wanted to find a digital version and couldn't so i figgered i'd have to make my own. As to rights, i tried to find that info out and all i came up with was <a href="http://www.myfonts.com/foundry/atf/" target="_blank"> this</a>, and i'm not sure if this info applies to this face. If so, this will definately just be a personal project for myself, or maybe i could give it away to interested parties? <br>I tried to keep as true to the original as possible, (you can check this against scans of the original in the backhistory) but i'm not opposed to making alternate glyphs. In fact i think i need an lc f without the flourish just for example. I'm not particularly fond of the original A or Q either, so i may try to come up with something for those two as well. <br>This face was first marketed by MacKellar in the 1890s? so I'd guess that Hermann is long departed, or else i would have liked to speak with him about his great display faces! <br>Thanks for the feedback again, Randy. And did any of the scrolls seem square to you? I'm paranoid that i may have not gotten them quite right. (They were a pain in the neck!) Thanks again, and if you could, lemme know what you think after checking out the original.</p>
