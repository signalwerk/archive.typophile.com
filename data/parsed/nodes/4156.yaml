    html: "<p>thanks for all the comments! it seems like i'll hafta make two versions of this one: one version to stay true to the original face and a second version incorporating some of your suggestions. I've got a wedding to go to this weekend, so this'll probably go on the back burner for a week or so. <br>Good catch on the dollar sign Hrant, there are also a few scrolls i'm not too proud of as in the Z. I need to go back and scrutinize a little closer. <br>Tiff, I'll try to work on the spacing so i can set something for you. I was hoping Hrant would point me in the right direction for that one. (I re-read the chapter in Letters of Credit last night so maybe i have a bit better grasp on it now) <br>In the meantime, i'm planning on putting up some proofs back over in the typography section, i gotta finish up that announcement today. Thanks for your time in leaving some tips and suggestions!</p>"
  - id: 30928
    user: 3368
    date: 2004-04-09T10:49:00
    date_raw: 9 Apr 2004 — 10:49am
    votes: null
    html: "<p>Hi Paul, <br>   You have obviously put an incredible amount of labor into NymphicPH <br>thus far!  Very nice. <br> <br>I haven't posted to this thread because there's nothing I can add to the <br>critiques already given by folks with WAY more expertise.  I will simply <br>mention here two things: <br> <br>1) The Klingspor PDF gives a birth date for Ihlenberg as 1843 and death <br>in 1905, with a date for Nymphic of 1899. <br> <br>2) In the case of these really old typefaces, I always strongly favor exact <br>reproduction of the original glyphs, ugly or not.  Surely, even with the many <br>extended characters you are making, there is room left in the basic 255 <br>character set for alternates that are more eye-pleasing than the originals. <br><br></p>"
