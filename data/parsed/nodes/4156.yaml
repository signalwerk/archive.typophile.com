    html: '<p>Pretty solid, I think. Some of the glyphs (like the "c") are killer. <br> <br>Some of your curves (like the top-left curl on the "A", the join between the thin stem and the ball on the inside of the "D", etc.) are malformed. I think the top-right serif of the "x" is out of character. I think the UC Thorn needs a curled stem-bowl join. <br> <br>Spacing: I think it looks pretty decent already. But your wordspace is too huge. <br> <br>Cyrillic: looks pretty cool to me, but I know little about it. <br> <br>hhp</p>'
