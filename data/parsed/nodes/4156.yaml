    html: "<p>And now some crit for the cyrillics. <br> <br>If confused about the names see: <br><a href=\"http://www.unicode.org/charts/PDF/U0400.pdf\" target=\"_blank\">http://www.unicode.org/charts/PDF/U0400.pdf</a> <br> <br>Upercase <br>BE:  belly is too low <br>GHE: serif is waaay too big  <br> <br>Lowercase <br>ghe:  there are a lot of vertical strokes in the cyrillic alphabet; this one makes confusion, looks like a weird cyrillic_pe. <br>soft_sign: keep eyes on this when making lje and nje. <br>ka: right leg same with its latin brother _k_ <br> <br>Here is a good reference on cyrillic, but it's in russian, can't help with that <img src=\"http://www.typophile.com/forums/clipart/sad.gif\" alt=\":-(\" border=\"0\"> try online translation? <br><a href=\"http://www.prodtp.ru/index.php\" target=\"_blank\">http://www.prodtp.ru/index.php</a> <br> <br>Keep up the good work!</p>"
