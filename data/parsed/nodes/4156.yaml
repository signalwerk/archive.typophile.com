    date_raw: 2 Aug 2004 — 3:05pm
    votes: null
    html: "<p>glad i got a bit of response anyway. good thing i'm not in this for the money, or i'd be sorely disappointed with this one! (as evidenced by the interest or lack thereof in this thread) <br> <br>okay so to answer a few questions: <br>weight difference - from <a href=\"http://www.typophile.com/forums/messages/30/24232.html\" target=\"_blank\"> the samples i'm working from</a>, i think that the swash caps, the caps and the lower case are all set in different sizes. Since this is a display face, hopefully the weight difference won't be too disturbing at display sizes. I'll admit, the difference looks really stark in the digital sample... i still need to print it out to see if it looks that way on paper. <br>Right now i have all these in one font with the swash caps available through the OT swash function &amp; the smcp function gives you the swash+normal caps  combo. I think that I will do a couple other versions, balancing the weights better and separating the sets up into different fonts. <br> <br>So you don't like the N.swsh? is it really malformed? or you just don't like the letterform? as iterated before, i'm trying to stick as close to the original as possible (see link above), but i'm totaly open to doing alternate characters (the cap X in the first line of this first sample is one of my alternates). What other characters need alternates besides the N.swsh? <br> <br>Thnx for your help and comments, guys. I really do appreciate all your feedback. <br> <br>p.s. okay i printed it out and that N.swsh IS pretty fugly i'll fix it. But did you mean there should be an alternate character, Hrant? or just that i need to pay better attention? Also, the swash caps ARE a lot heavier, I think i'll lighten em up for any versions that combine all 3 sets or where they're paired with the lc. whaddya think of that?</p>"
