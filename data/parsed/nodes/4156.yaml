      <p>alright, here's a new sample. In this incarnation: <br>1) the font is morticed (thnx hrant) and instead of bracketing the serifs on the lc, i incised them - i'll make a bracketed version after i figger out where i'm going with this (and have a chance to look at Bodoni <br>2) i tried fixing the lc color issues by making my bowls a bit trimmer. <br>3) Manufactured a few alternate characters - mostly just fiddling around slapping parts together. The only one I'm really pleased with is the alt X. Goudy helped me think that one up. The alt k is alright, as is the alt U and alt Q, but that alt j is just nasty! i also tried manufacturing a double s (esset?) but i don't know if it's too jarring to the eye. i don't really know how it should look. i'm still trying to come up with a few more alt characters - trying to imagine "a more elegant g" that would fit in this face and how to make the I less nekkid, the R less rigid and the A less garish <br>4) I don't know how well i did with spacing. I can't tell if it's too loose or not. <br>5) I gave you a sample setting - i don't think this face would ever be used for more than a few lines at a time - if that. <br>6) I added diacritics - i think i did okay positioning all my sputniks, the ring seems too small tho. <br>7) Still working on the vwxyz, so don't fault me there, i'm not finished with those yet. Otherwise chop it up! Lemme know where i'm still missing some of the finer details. If you see anything i did okay, lemme know. <br>Thnx for taking a look.</p>
