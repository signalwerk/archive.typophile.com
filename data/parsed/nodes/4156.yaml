    <p>Okay, here it is. I've been working on this project since Christmas. Maybe you've seen my string hunting for these letter forms, but i finally found em all and did my best to digitize them. As with most designs that I respect, i've started to work on international characters and a cyrillic set to match, but haven't gotten too far on those yet. I would set some text for you, but i haven't messed with the spacing much yet. I need some help in that regard anyway. if any of you want to point me toward some good sources... Any comments at all are appreciated, so lemme know what you think of these letter forms. I tried my hand at two � glyphs, but don't know if either work. help please! also how do the thorns look? Anyone who's versed in Cyrillic, i'd love to hear what you have to say on my small assortment of glyphs, especially the m'agk'ii znak. And what do you all think of that Euro symbol? does it work? Anyhow, hope to get something back on this one. Thnx in advance. <br>P.S. Swash caps are in the works as well. <br></p>
