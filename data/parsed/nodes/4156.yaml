    date_raw: 2 Aug 2004 — 2:41pm
    votes: null
    html: <p>Paul, <br>Many of your "Swash Caps" actually look like Initial caps which might be used by a book designer to start a chapter.  They are bolder than the typical text (perhaps this is what Hrant is getting at). Much of the weight is in the number of line segments, not just the weight.  As Hrant indicated above, this would work better with CAPS and Small Caps. <br>To me, flourishes are meant to entwine. See pointed-pen italic caligraphy or engravers scripts like Bickham. This of course makes for slower reading but it is not a problem with small amounts of text as in invitations or citations where the reader is at leasure to re-read and enjoy the hopefully well-crafted typography. <br>I feel your Swash initials could be used nicely as initial drop-caps with a more traditional roman text face.  This treatment might be fun for an older children's adventure series kind of book. <br> <br>ChrisL</p>
