  - id: 30950
    user: 1250
    date: 2004-08-02T10:22:00
    date_raw: 2 Aug 2004 — 10:22am
    votes: null
    html: "<p>{Typophile really needs to regain its type crit energy. Wake up, guys!} <br> <br>The first big question I guess is: do you want the swash caps to stand out so much in weight, or do you want them to be equal to the small/normal caps? And if it's the latter, what size relationship do you assume (if the swash is a totally separate font)? What you might do is have a smallcaps font where the \"UC\" set is the swash and the \"lc\" set is the normal caps but vertically centered. But then you couldn't mix the actual lc very easily... In terms of the weight, ideally I guess you should have multiple weights for the swash - but that might be outside your \"time budget\". <br> <br>As for form, I think most of your swash caps are solid, but some need a lot of help. Especially those long curls you have on some of them are seriously malformed. Like the \"N\" needs to be totally rethought, I'd say. Some of them are great though, including tough ones like the \"G\", \"U\" and \"X\". <br> <br>hhp <br></p>"
