    html: |-
      <p>U2 through their design agency <a class="freelinking-external" href="http://www.four5one.ie/">Four5One</a> have been using Clarendon for pretty much all their print and web graphics since 2004. It might be interesting and useful for you to have a look at how they have handled the typeface.</p>
      <p>The way they seem to make it work is by always juxtaposing it with with something very modern looking, <a class="freelinking-external" href="http://www.myfonts.com/fonts/linotype/eurostile/">Eurostile</a> in this <a class="freelinking-external" href="http://www.u2wanderer.org/disco/view.shtml?images/alb021-01.jpg">case</a>. They also make nice use of <a class="freelinking-external" href="http://www.myfonts.com/fonts/tilde/aachen/">Aachen</a> in the booklet of the same album. You can sort of see it <a class="freelinking-external" href="http://www.u2wanderer.org/disco/view.shtml?images/alb021-08.jpg">here</a> but it looks better on the inside pages. Also worth checking out is the book U2byU2 were they have used <a class="freelinking-external" href="http://www.myfonts.com/search?search[text]=garamond">Garamond</a> in conjunction with Clarendon, but don’t know how successful this is really. The original use of Clarendon in U2 material is the 2004 <a class="freelinking-external" href="http://www.u2wanderer.org/disco/alb019.html">How to Dismantle an Atomic Bomb</a> album, which is entirely set in Clarendon.</p>
      <p>On looking through the U2 stuff I get the impression Clarendon is a difficult face to work with. I have also found this myself from experience. My own suggestion here would be <a class="freelinking-external" href="http://www.myfonts.com/fonts/adobe/helvetica-neue/cond-thin/">Helvetica Condensed Light</a>. It think that could make the right contrast. I also feel like I can never use anything other than another classic face with Clarendon. I don’t know why that is.<br>
      Anyway I hope this has been of some assistance to you!</p>
