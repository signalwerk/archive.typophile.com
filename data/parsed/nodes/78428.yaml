      <p>It's a shame they don't want to play up their roots. Here you have a credit union, an organization that handles peoples money, established for the benefit of <em>the people who actually make the money!</em> That background should inspire trust, even as they target an expanded membership base.</p>
      <p>There are incredible design possibilities that could be built from that concept, but that doesn't appear to be along the lines of what you're tasked with.</p>
      <p>I, too, see a wind-up key in your latest design, as well as a scatological reference. Kind of hard to avoid that when you have two adjacent round forms with a descender between them.</p>
