    <p>I am working on the logo redesign of E&amp;P Federal Credit Union and would like some input on what I have so far. For a little background, E&amp;P has been the federal credit union for employees of the Bureau of Engraving and Printing (hence E&amp;P) but they are looking for a brand new look as their clientele demographic and business model shifts. Their main group of members now come from both a few local colleges and employees of the environmental protection agency. They are also planning to shut down many branches and become more of a virtual financial institution, where almost all banking services would occur through a new website.</p>
    <p>What they want to say with their new look:<br>
    • Professional and trusted<br>
    • Helping the environment (by going all virtual)<br>
    • Friendly/personal<br>
    • Secure<br>
    • approachable to Generation Y<br>
    • Change name from E&amp;P (acronym for Engraving and Printing) to EP (acronym for absolutely nothing)<br>
    …you get the idea, the same thing every financial institution wants to be viewed as</p>
    <p>Here are the general concepts for the three logos you see below:</p>
    <p>First image is their current logo.</p>
    <p><strong>LOGO 1</strong><br>
    • Reinvention of the infinity symbol to incorporate the letters EP<br>
    • Interlocking letters are secure yet kinetic…like your money should be<br>
    • Rounded letters are friendly</p>
    <p><strong>LOGO2</strong><br>
    • Arrow pointing up…towards the future and showing positive growth<br>
    • Also feels like a protective roof<br>
    • again, round and bold shapes feel friendly</p>
    <p><strong>LOGO 3</strong><br>
    • This is a leaf...I know, cheesy but I'm thinking money tree and the environment both connect to "leaf"</p>
    <p>Any conversation about this work would be helpful and appreciated.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/original_3443.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/eplogo_6337.jpg"></div><p></p>
