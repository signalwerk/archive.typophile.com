      <p>Dan, I'll write a message to you. By the way, you can reach me at viejo_amargadoINhotmail.com. I am certainly eager to hear some bit about the best options for dealing one's fonts with. </p>
      <p>And yes, Scriptorium has been on a long time now. They have specialized in antique fonts, some of them quite interesting. Since one of my almost-completed fonts is a conversion from a XVII-Century printed book, I found Scriptorium an option for wanting to distribute it. But I wanted to know an opinion on the foundry's seriousness.</p>
      <p>I'll also search for IHOF, Paul.</p>
