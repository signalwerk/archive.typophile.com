    html: |-
      <p>Scriptorium/FontCraft have been around for quite a while, in fact I think they were one of the first independents to post a Web site. Dave Nalle was semi-regular on Typo-L but I can't say I've seen him active elsewhere online or at type conferences so it's difficult to form an opinion. His fonts certainly have a following - Tim Burton, and The Pirates of the Caribbean spring to mind. I would assume he's been reasonably successful to have stuck with it for so long, especially when other vendors have given up.    </p>
      <p>Cheers, Si</p>
