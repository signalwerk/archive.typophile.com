      <p>Boring! Why do teams/companies have to make their stuff so amazingly boring? This may seem like a fanboy speaking, but the best "update" to a team's logo/mascot was done by the Seattle Seahawks. They are one of the few teams to go from boring --&gt; cool. But a lot of team's old logos and uniforms were way cooler back in the day.</p>
      <p>The days when teams wear their throwback uniforms are the best. The Cowboys' and Lion's throwbacks are especially improvements over their drab current uniforms.</p>
      <p>And Don is right: Spend some money fixing your team and someone might actually care if your logo has changed.</p>
