      <p>This is definitely better than the one that was floating around the internet a few months ago. <a href="http://cdn3.sbnation.com/imported_assets/104800/3251978803_cc80d945ac_o.jpg" title="http://cdn3.sbnation.com/imported_assets/104800/3251978803_cc80d945ac_o.jpg">http://cdn3.sbnation.com/imported_assets/104800/3251978803_cc80d945ac_o.jpg</a></p>
      <p>I'm glad they just added details to the classic silhouette. The type looks furry, which is cute, I'm not sure it's succeeds in being "aggressive" but at least it doesn't look like it's from the back part of Cedar Point anymore. In general the aesthetics of football has been a race to the bottom. The best thing we can hope for here is that the Lions use this logo update as an excuse to ditch the horrible black they added to the uniforms and go back to the awesome bright blue and silver everyone identifies them with.</p>
