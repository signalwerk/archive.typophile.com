  html: <p>How does one add the "Glyph Variants" Apple Advanced Typography (AAT) feature to a font? (See the circled panel in the screenshot below for Hoefler Text.) <br> <br><img src="http://www.typophile.com/forums/messages/4101/33144.gif" alt="Glyph Variant Screenshot"> <br> <br><a href="http://developer.apple.com/fonts/Registry/index.html">Apple's docs</a> are far from clear on how to add this. In the Morph Input File (MIF), I have used "Character Alternates" (Namecode 17, also visible as a closed panel in the screen shot above) to define sets of alternate glyphs, but that doesn't give me the fancy pop-ups that are context-sensitive to the selected characters, only radio buttons to identify alternate character sets. <br> <br>I'd appreciate any tips. <br> <br>Cheers, <br>Brent</p>
  html_clean: <p>How does one add the "Glyph Variants" Apple Advanced Typography (AAT) feature to a font? (See the circled panel in the screenshot below for Hoefler Text.) <br> <br><img src="http://www.typophile.com/forums/messages/4101/33144.gif" alt="Glyph Variant Screenshot"> <br> <br><a href="http://developer.apple.com/fonts/Registry/index.html" class="link-external">Apple's docs</a> are far from clear on how to add this. In the Morph Input File (MIF), I have used "Character Alternates" (Namecode 17, also visible as a closed panel in the screen shot above) to define sets of alternate glyphs, but that doesn't give me the fancy pop-ups that are context-sensitive to the selected characters, only radio buttons to identify alternate character sets. <br> <br>I'd appreciate any tips. <br> <br>Cheers, <br>Brent</p>
