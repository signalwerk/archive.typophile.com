    date: 2004-04-13T09:42:00
    date_raw: 13 Apr 2004 — 9:42am
    votes: null
    html: "<p>I think you are right Juhani, and have been telling Apple this for years. The Apple font tools are designed by engineers for engineers. I've done work with them, but not by choice: the client needed AAT tables in the font. Even then, we had to have Dave Opstad (ex-Apple font guy) help us with the state tables for contextual substitutions. I understand the tools have improved a bit since then, but they're still nothing like as easy as making OT in FontLab or VOLT, nor even as easy as making a Graphite font with SIL's own text based tools.</p>"
