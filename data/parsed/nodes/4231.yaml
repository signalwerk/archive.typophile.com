    html: "<p>I believe what you need to do is add a 'Zapf' table to the font. This table includes a mapping between glyphs and all variants. <br> <br>See: <a href=\"http://developer.apple.com/fonts/TTRefMan/RM06/Chap6Zapf.html\" target=\"_blank\">http://developer.apple.com/fonts/TTRefMan/RM06/Chap6Zapf.html</a> <br> <br></p>"
