  html: <p>I've recently finished designing a three weight, sans serif typeface and I've run into a problem when printing at text sizes (10pt and below). My laser printer (HP 5MP) seems to add a little weight to some strokes, like lc "l" and "t", "e". It also does weird things like add weight to the "l" half of the "fl" ligature and to the second quote of the double quotes. It's a very subtle thing, but when you look at text, it affects the "color", giving it kind of a spotty texture. <br> <br>I've been told that it might have something to do with hinting, but I'm not sure. I don't know much about hinting. I've tried printing other similar faces (VAG Rounded and  DIN) to see if the same problem happens, and those faces seem to print fine. <br> <br>My next step is to see if the same problem happens on my inkjet. I've also thought about getting a high-resolution match print. <br> <br>I created the font in Fontlab as Type 1, which I've been told has very good hinting capabilities. <br> <br>Any words of wisdom would be much appreciated. <br> <br>Thanks, <br>Pablo</p>
