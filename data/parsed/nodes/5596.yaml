    html: <p>Pablo, If you have a particularly light design, and your HP printer is printing at 600dpi in 10pt, your lowercase stems may be only 4 pixels wide. Without any hinting to hold the stems to consistent widths you may get some stems printing as 3 pixels or some as 5 pixels. This amount of difference of plus or minus 25% is going to be noticeable as you have seen. <br> <br>Try using FontLabs</p>
