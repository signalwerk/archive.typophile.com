    html: <p>I'd like to know about this as well. I have an HP laserjet 2100 (1200 dpi). My problem was that at 12 pt the serifs were distorted and didn't print the same consistently - I could see this clearly with a magifying class. When I did Fontlab's automatic hinting and exported it as a type 1 font, this seemed to cure it. Exporting it earlier with automatic hinting and as a true type font didn't do the trick. <br> <br>(I have read on these boards that hinting does affect laser printers at small type sizes, so the serif problem makes sense.)    <br> <br>But I still don't know how much distortion there is as compared to when it is properly hinted and/or printed offset. </p>
