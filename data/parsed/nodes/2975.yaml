    html: <p>why, yes deb, it is--your amazing water balloon throwing partner. awesome to hear from you. hope things are well for you... <br> <br>as a side note to hrant's and louann's mix-ups, donald norman refers to those mistakes as "description errors" in his book "the design of everyday things". he says it happens when "the intended action has much in common with others that are possible...the more the wrong and right objects have in common, the more likely errors are to occur." his book has lots of interesting info like that. </p>
