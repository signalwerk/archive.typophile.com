    html: <p>Stuart, I checked Koch's "Book of Signs" but found nothing. Then I checked Liungman's comprehensive "Dictionary of Symbols" and saw that although your lefthand shape has parts of both Saturn and Antimony (a crucial component of metal type!), it's pretty much exactly the symbol (actually one of many) for Mercury (more the material than the planet). Your righthand shape didn't come up, but it looks a lot like a Courier rendition of the first... Were you working a lot on a sans/slab superfamily?  :-) <br> <br>Flatland sounds very interesting - I'll check it out - thanks. <br> <br>Grant, funny! <br> <br>hhp <br></p>
