    html: <p>While working on the Bitstream BTN project over the course of 90 days of glyph drawing and font making, I went to bed at around 6:00am and awoke around 1:00pm from a frightening dream of a futuristic scorpion morphing in and out of one of two glyph shapes. <br> <br>Fortunately I was lucid dreaming and awoke to recall the shapes exactly and penned them down. After some searching on the internet at symbols, the closest we could surmise was that the shapes are similar to the alchemy symbol for Mercury. <br> <br><img src="http://www.typophile.com/forums/messages/30/25594.gif" alt="Dream Shape"> <br> <br>Should any symbol experts have a different take, I'd love to hear it. The dream is still without meaning to me. <br> <br>Stuart :D</p>
