    html: <p>Since I've been designing on a computer every day for 14 years, my thinking has become irretrievably altered. Now my dreams "scroll" vertically, instead of moving left to right as I remember they used to do.  <br> <br>Lately, I was hand drawing a thumbnail on a piece of paper. Then off to the bottom left corner (as if it were the pasteboard), I drew a bit that I had every intention of moving over to the center. I actually stuck the pencil in the middle, held it down, and was momentarily surprised when my side scribble didn't click and drag.  <br> <br>Similarly, I've drawn thumbnails and gotten pissed that I couldn't "send to the back."  <br> <br>As I age and move into perimenopause, there are ever increasing numbers of floating pallets to deal with. That's a deadly combo to my brain cells.  I started noticing this 5 versions of Freehand ago. Now I'm convinced InDesign is going to land me in a nursing home.</p>
