  html: <p>ever have dreams about typography or type design? <br> <br>i had my first one last night; at least one i actually remembered.  <br> <br>most of my dreams are really short snippits, as was this one. i was looking through some book about typography, and came across an "example" paragraph set in clarendon. i remember having this discussion in my mind about how clarendon was some sort of breakthrough typeface of vast historical significance. then i woke up. pretty odd.  <br> <br>i now have confirmation that i am a nerd.</p>
