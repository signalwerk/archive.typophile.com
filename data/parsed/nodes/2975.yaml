    html: <p>A long time ago, I was editing (with the author's notes) a book in WordPerfect. It was a labor intensive project. I would go home at night, turn the tele on to unwind. I remember one night going home switching the tv on, laying down on the couch and relaxing my eyes. I opened them up only to see my monitor with thousands of edits that I missed. I kept reaching for the keyboard that would appear on my lap to correct these things, but the keyboard kept vanishing.  <br> <br></p>
