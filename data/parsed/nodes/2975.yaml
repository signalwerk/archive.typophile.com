    html: <p>Funny. <br> <br>It's very interesting how particulars of software interfaces migrate to our physical interfaces - probably due to the amazing adaptability of the human brain. <br> <br>&gt; was momentarily surprised when my side scribble didn't click and drag. <br> <br>One time I was working on a scan of a photo laying to the left of the keyboard. I was trying to show a coworker some difference between the scan and the original - with the mouse I pointed to the area on the scan, then I proceeded to try to roll the pointer off the bottom-left of the screen to the physical photo on the table. I actually got angry for a second when it wasn't working. <br> <br>And it's not just software, but anything you spend a lot of time with. When I used to have a motorcycle, riding it more than I'd walk, I used to catch myself looking to my left (where the mirror would be) even when I was on foot, to see what's behind me. <br> <br>hhp <br></p>
