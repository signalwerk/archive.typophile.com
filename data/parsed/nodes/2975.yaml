    html: <p>&gt;&gt;When I was about 8 I used to have very frightening dreams about abstract shapes (actually , volumes) in conflict <br> <br>Have you read Flatland, by Edwin Abbot? <br>Written, I think, around 1880, its about a 2D world populated by shapes, then a 3D volume appears from another dimension and shakes up the shapes' world. <br>Its heavy with Victorian social commentary. There's a strict hierarchy in Flatland (the more sides you have the higher up you are - but in a 2D world, the shapes can't see each other from above, so they have to judge the number of sides by finding a corner and checking the angles. Women are bottom of the pile, so they are, I think, just lines). I read it a very long time ago, for an undergrad essay I was writing, but I can't remember much of it (or even what f*cked up type of essay I was writing in which this wierd book could play a part). <br>If you're interested, its around $2 at most online bookstores, or there's an online version here <a href="http://www.alcyone.com/max/lit/flatland/" target="_blank">http://www.alcyone.com/max/lit/flatland/</a>, or there's also a Project Gutenberg version available at their website. <br>I've only read the .txt version with ASCII illustrations, the originals are supposed to be very nice, but I never got round to searching them out. Maybe I'll do that now...</p>
