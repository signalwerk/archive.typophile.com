    html: <p>The old Penguin jacket (circa 1950?) uses Gill Sans apart from, as previously mentioned, in the Penguin Books logo. Gill was part of the original Penguin house style for their first few decades. They still keep a similar look for some of the type on the jackets of the Penguin Classics series but are using Futura rather than Gill nowadays.</p>
