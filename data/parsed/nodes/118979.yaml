    <p>I'm afraid of the answer here...</p>
    <p>If I create a logo type for a company that uses letters from lots of different typefaces, does that mean that the license would have to be paid for the font of each letter used? There by making it ridiculously expensive?</p>
    <p>Thanks.<br>
    D~</p>
