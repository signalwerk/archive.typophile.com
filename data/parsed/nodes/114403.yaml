    html: |-
      <p>The R and the O are right for Museo Sans, but the S is definitely wrong. My first guess is totally wrong, though: Gill Sans.</p>
      <p>Franklin Gothic does have the right R and S, but not the O, as noted.</p>
      <p>The R and S are both wrong for Futura.</p>
      <p>Soin Sans gets all three basic shapes right, but I don't think it's the right one.</p>
      <p>Wait; the low contrast had me mistaking the S.</p>
      <p>While Gill Sans was wrong, my instincts may have gotten me close. Look for a typeface more closely based on Johnston's original face for the London Underground. That matches all three shapes.</p>
      <p>Here's <a class="freelinking external" href="http://www.myfonts.com/fonts/p22/underground/" rel="nofollow">P22 Johnston Underground</a> for your inspection... no, that does not have the right R.</p>
      <p><a class="freelinking external" href="http://www.myfonts.com/fonts/hurme-design/hurme-geometric-sans-3/" rel="nofollow">Hurme Geometric Sans 3</a> also gets all three shapes right.</p>
