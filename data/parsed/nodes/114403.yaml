      <p>I think if you search using "geometric sans-serif" you can find many candidates. The white lettering on a pale background makes it hard to judge the legs of the R, but <a class="freelinking external" href="http://www.myfonts.com/fonts/exljbris/museo-sans/?refby=bowfin" rel="nofollow">Museo Sans 700 or 900</a> ought to be pretty close. The S curves and R legs will be the things to look for as long as the O is round.</p>
      <p>- Mike Yanega</p>
