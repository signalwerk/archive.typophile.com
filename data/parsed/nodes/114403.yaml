title: This is Forever -looking to find out the font for the white "IS FOREVER" portion of the print. I already know "this"=Modern No 20 & the White Ornamentals=Bergamot Ornament. Franklin Gothic Demi seems to be it, but not sure because of the "O". Thanks!
