    date_raw: 24 Mar 2004 — 7:02pm
    date: 2004-03-24T19:02:00
    votes: null
    html: <p>I find the concept interesting. I do not exactly understand how it will actually be used? <br>Does it require the typographer/designer to change the font <br>version each time there is a change in voice, etc.or is there <br>some sort of software/technical interface-ie a software translation from dictation to written word. Please elaborate. <br> <br>As far as forms- They do not flow together as is. The incision <br>on certain glyphs look out of place to me. These are marked in orange. What about upper case? <br> <br>"VOX" is a nice name. <br> <br><img src="http://www.typophile.com/forums/messages/29/29193.jpg" alt="vox"></p>
  - id: 28441
    user_id: 804
    user_name: designalchemy
    user_path: null
    user_image: null
    date_raw: 24 Mar 2004 — 7:12pm
    date: 2004-03-24T19:12:00
    votes: null
    html: "<p>In Emigre Magazine #51, Andreas Lauhoff offers an extract of his MA project created at Central Saint Martins in England. The project illustrates the concept of speech-recognizing letterforms which add oral parameters on the rather static notation of type. <br>I would recommend purchasing this copy of Emigre. A very interesting project.</p>"
  - id: 28442
    user_id: 2894
    user_name: wolaka
    user_path: null
    user_image: null
    date_raw: 24 Mar 2004 — 8:32pm
    date: 2004-03-24T20:32:00
    votes: null
    html: <p>Ideally, I envision some sort of speech recognition software making the translation, not the typographer. I am more interested right now in the appearance than the programming issues that are involved, however. I plan on presenting it as a Flash movie where you hear different voices reading text and see a simulation of the letterforms appearing (as if they were being typed or recognized on the fly.)  <br> <br>Uppercase is in progress but the semester is closing in on me fast...  <br> <br>I really like the incised letters, perhaps I should just try to make it a more consistent application by introducing it to other letters like the h, n, etc.? <br> <br>Thanks for the Emigre tip, I'll check that out.</p>
