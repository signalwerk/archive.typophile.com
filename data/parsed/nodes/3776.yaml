    date_raw: 30 Mar 2004 — 9:18am
    date: 2004-03-30T09:18:00
    votes: null
    html: <p>I think the problem with the diagram and the pitch axis is that low pitch ought to be on the left, and high pitch on the right (low notes vs high notes, looking more at frequency than amplitude).  <br> <br>In the case of pitch as seen here in weight, I wonder if there should be a difference in weight stresses. Should the bolder ones also have a verticle emphasis, with more weight on the bottom? <br> <br>Oh, and I can attest to her being more than halfway to being a type designer, if the other half is bullheadedness (in the most positive way)!  <br> <br>Aaron </p>
