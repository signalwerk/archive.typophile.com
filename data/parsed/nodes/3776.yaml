    date: 2004-03-29T09:22:00
    votes: null
    html: <p>Hey, great stuff with the angularity axis! <br> <br>But I think weight isn't Pitch, it's Amplitude. Pitch is (inverse) width. <br> <br>BTW, if you're enjoying making those superb fat glyphs, then it means you're half-way to being cut out for type design. The other half is being bull-headed. <br> <br>hhp <br></p>
  - id: 28449
    user_id: 2894
    user_name: wolaka
    user_path: null
    user_image: null
    date_raw: 29 Mar 2004 — 10:35am
    date: 2004-03-29T10:35:00
    votes: null
    html: <p>The amplitude issue is something I have stuggled with. I'd been thinking that volume would be best expressed with point size. Relating pitch to weight was based on the idea that a higher pitched sound would seem more fragile and/or piercing. By the way, the other variable I am working to develop is inflection/stress through the use of obliques or italics. Any thoughts?</p>
  - id: 28450
    user_id: 1250
    user_name: hrant
    user_path: null
    user_image: /files/pictures/picture-1250.gif
    date_raw: 29 Mar 2004 — 10:44am
    date: 2004-03-29T10:44:00
    votes: null
    html: "<p>&gt; volume would be best expressed with point size. <br> <br>I agree, but that's outside of the font itself. You could say that Amplitude is proportional to apparent size, and that depends on point size, yes, but also weight and x-height propotion - like how ITC Garamond is much \"louder\" than let's say Simoncini Garamond (at the same point size). <br> <br>Inflection/stress: Tough one.  <br>Italics might seem natural, but I would caution against it, since: <br>1) Slant introduces Speed. <br>2) Cursiveness introduces informality/friendliness. <br> <br>I think Stress might be best marked with stroke contrast. <br> <br>hhp <br></p>"
  - id: 28451
    user_id: 2933
    user_name: aaron_carambula
    user_path: null
