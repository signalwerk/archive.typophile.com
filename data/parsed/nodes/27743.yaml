      <p>I'm really leaning to some sort of custom lettering then. I have looked through the Jaspert Encyclopaedia, all the Solotype books I have, the Photo-Lettering catalogs, and my own Script Font ID Guide, and the only other semi-close script I can find is <a href="http://www.myfonts.com/fonts/linotype/monotype-script/">Monotype Script Bold</a>.</p>
      <p>For one thing the inital 'A' is very unusual, starting with the fact that that style of round A is relatively rare to begin with. The next oddity is the connections between letters, which are high, unlike most fonts. My eyeballs aren't precise enough to see if there are any variations in the identical letters, but if this was made in 1997, a customized font is certainly possible. It just seems so unlikely for such a limited-value purpose, in my opinion. I mean, it's not even a logotype. </p>
      <p>If someone does ID this, I will be very interested in the answer. It sure has me stumped so far.</p>
      <p>- Mike Yanega</p>
