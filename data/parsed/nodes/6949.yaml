    html: "<p>I'm not doing links for all these fonts, you're on your own there. <br> <br>Sans: you already have a good list, but I'd add Interstate as well, and the new Neutraface Condensed from House. See also Chalet Comprime (from House). DINSchrift. HTF Gotham Condensed. <br> <br>For display sans you could try Tasse, Industria, Anna, Chasline, Conques <br> <br>Serif: Fashion Compressed (display), ITC Garamond Condensed (text) <br> <br>That's it for now.</p>"
