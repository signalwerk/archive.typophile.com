  html: "<p><i>Well.. myFonts lists around 500 matching typefaces, if you search for '<a href=\"http://www.myfonts.com/search?search%5Btext%5D=condensed\" target=\"_blank\">condensed</a>'.: <br><a href=\"http://www.myfonts.com/search?search%5Btext%5D=condensed\" target=\"_blank\">www.myfonts.com/search?search%5Btext%5D=condensed</a></i> <br> <br>Maybe you could tell us, some more, about what you are rather seeking.? <i>( Serif / Sans Serif.? ) <br> <br>Some of the more popular 'condensed' ( sans ) typefaces.: <br>Univers Condensed ( <a href=\"http://www.myfonts.com/fonts/linotype/univers/\" target=\"_blank\">www.myfonts.com/fonts/linotype/univers/</a> ) <br>Helvetica Condensed ( <a href=\"http://www.myfonts.com/fonts/linotype/helvetica/\" target=\"_blank\">www.myfonts.com/fonts/linotype/helvetica/</a> ) <br>TradeGothic Condensed ( <a href=\"http://http://www.myfonts.com/fonts/linotype/trade-gothic/\" target=\"_blank\">www.myfonts.com/fonts/linotype/trade-gothic/</a> ) <br>Futura Condensed ( <a href=\"http://www.myfonts.com/fonts/linotype/futura/\" target=\"_blank\">www.myfonts.com/fonts/linotype/futura/</a> ) <br>FranklinGothic Condensed ( <a href=\"http://http://www.myfonts.com/fonts/linotype/itc-franklin-gothic/\" target=\"_blank\">www.myfonts.com/fonts/linotype/itc-franklin-gothic/</a> )</i></p>"
