    <p>I’m trying to identify the ornate display type on the Mendl’s pastry box in Grand Budapest Hotel. Unfortunately, clean images of this are difficult to come by.</p>
    <p>Two things to note:<br>
    • The outlined glyphs (Pâtisserie) and the sold glyphs (Nebelsbad) appear to be the same typeface.<br>
    • Seemingly all of the glyphs have median spurs.<br>
    • The capital L strikes me as distinctive (the lower horizontal stroke curves up in an unusual way).</p>
