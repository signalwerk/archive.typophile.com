  html: <p> Does anyone know a good way to convert <br>larger font familes (&amp; smaller)from Mac PS1 <br>to both PC TT &amp; PC PS1 ? <br> <br>Right now I'm using Fontlabs TransType 2.0.2 &amp; it works  <br>vey well for some of my PC font testers, but others  <br>get irregularities in spacing, and some characters that  <br>look good on screen won't print. <br> <br>Anyone have some advice? Maybe a step by step solution? <br> <br>I'm so tired of this- it's a hassle to always have to test everything  <br>several times on a PC's before releasing a typeface. <br> <br>best regards <br>peter </p>
