    html: |-
      <p>I’ve been using a Wacom stylus for almost 20 years, and upgrade when necessary. That is, when the old one which was functioning perfectly well with all the functionality I needed is rendered obsolete by operating system changes; it’s part of the feature bloat “conspiracy” to keep milking purchasers by turning them into perpetual clients.</p>
      <p>When I had to get the “Intuous” version, it came with a big fat “kiddy” stylus, so I sensed that I was no longer part of the company’s main market. Not really a big piss-off now, just a minor inconvenience, as I move up the demographic age categories and become less and less relevant to this kind of product developer.</p>
      <p>So yeah, it’s a pseudo-60s kitsch kiddy popcult kind of logo, so what.</p>
