      <p><strong>Biddy: </strong> <em>If you’ve ever had your heart ripped out when a great idea gets killed by a client, you might not be so quick to judge. </em></p>
      <p>Just a quick story for you Biddy - one I think you can empathize with. A dear, departed friend of mine was the art director for trade books at a very well known publishing house - long before there were computers in the bullpen. It was the days when you received lettering from the typographer, that you put together to create a logo type, you sent that off to the photo house for some transfer type of it and demand a C-print. You went out on a photo shoot and spent the wee hours of the morning going through contact sheets before the 9 a.m. publisher’s meeting — having it altogether - as a comp, so the non-design functioning minds could see what the cover of a book may possibly look like.</p>
      <p>Well, it had been just such a night, and the next morning, Madame President was having PMS. She was not happy with the design work she saw, and I guess was having a hard time verbalizing it - so she picked up her pen and stabbed his work - not just one time - but 8 holes worth. We had a very long lunch that day — and soon after he left his place of employment.</p>
      <p>Again, real world stories for the folks that just haven’t been there - or done that! But Biddy - I know you know that I know that you know exactly what goes on... Nice meeting you fellow graphic arts survivor.</p>
      <p>P.S. I would have put this in an I/M to you - but, oops we don’t have that anymore. So I guess others can read this too!</p>
    html_clean: |-
