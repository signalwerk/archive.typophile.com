      <p><em>So, the hotmetal type is superior to the handwritten,</em></p>
      <p>That’s not my point.<br>
      Novelty is a separate principle, nothing to do with functionality.<br>
      Consider digital type: when it was introduced, its quality was a lot poorer than phototype. It wasn’t really cheaper either, as the capital costs for graphic designers were huge, especially the Laserwriter. The learning curve for going digital was pretty intimidating. So from the point of view of job quality and economics, there was nothing added for me in 1988 by going digital, just a lot of hurdles. But I couldn’t resist the novelty, and could see the writing on the wall. </p>
      <p>**</p>
      <p>Morison was a book-centric Brit, and his quote dates to the days of hand-lettered headlines. But even then, there were plenty of novel type designs. He pointedly ignored such as Kennerley and Cooper Black, that came outta left field, took the typogrpahic world by storm, becoming mainstays of American commercial culture.</p>
    html_clean: |-
