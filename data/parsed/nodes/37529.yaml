      <p>Nick put it this way: <em>In my experience, clients are usually right, and push creative to do more interesting work than standard “good design”.</em><br>
      this is an important point, and one that deserves repeating. we can trash clients all day, because — let’s face it — it’s nice to have someone to blame. but a client often DOES push us to do better work. the illustrator jim mcmullen and i were discussing this very point years ago when i had just graduated and started doing some high-profile work. he said, “there is nothing like a difficult client to focus your work,” and i’ve carried the thought with me throughout my career. i have to qualify it this way, though: i think the client IS often right, but in many cases doesn’t have any idea why, in much the same way as a hummingbird has the FEELING it oughta fly south in november, without any real understanding of why. it’s the designer’s job to listen, to analyse, (bringing their SKILLS into play) to translate what they’re hearing from the client into good, communicative design. and if, after the client’s prodding, the solution is pathetic, it’s a case of the designer not rising to the challenge, and blaming it on the client is just lame.</p>
      <p>to the point of novelty, here’s an interesting quote from stan the man:<br>
      <em><br>
      “Type design moves at the pace of the most conservative reader. The good type-designer therefore realizes that, for a new fount to be successful, it has to be so good that only very few recognize its novelty.”</em><br>
      First Principles of Typography<br>
      Stanley Morison</p>
