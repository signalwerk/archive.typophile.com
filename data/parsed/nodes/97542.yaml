      <p>@ hrant:<br>
      Thanks for your feedback, glad you like it!<br>
      I try to constitute a really high contrast in texture between regular and italic. In my opinion, common contemporary italics in sans-serif families are more "untended" as in classic typefaces, like e.g. a Adobe-Garamond-Italic. And I have considered that such classic italics have generally a tighter spacing, probably to keep the typical flow in an italic.<br>
      And thank’s to point out the broken link =)</p>
      <p>@ J Weltin:<br>
      Good idea! BTW next Olympia will surely come.</p>
