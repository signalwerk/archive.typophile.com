    <p>The Mevum font, which is showcased on <a target="_blank" href="http://26plus-zeichen.de/en/fonts/mevum/" rel="nofollow">26+</a> since 2011 becomes a whole font-family now. An extraordinary true italic with an 18° angle and appropriate bold styles complete the family. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/mevum_grotesque_textfont_teaser_4971.jpg"></div><p></p>
    <p>Concept</p>
    <p>My aim to create a sans serif, which shouldn’t look too cold and clean, but nevertheless have a technical look. Attend from the first sketches until the full realization. A simple rectangle shape with bevelled angles and slightly convex curves formed the base of this concept. Through that, Mevum bridges the gap between human and technology, without the letters appearing too  intellectual and unflexible. Mevum picks up characteristic trait e.g. from architecture, engineering, electronics, science and sports, thus areas that have in common their practicality and orientation after the human being and its lifestyle.</p>
    <p>Characteristics</p>
    <p>In spite of the reduction, the letters should express a friendly and warm personality, without loosing the distinction from one to another. Letters like the capital “I” an the lowercase “l” are especially different. Furthermore the lowercase “a” has a midbar, lowercase “g” is two storied. The combination “rn” shouldn’t look at small text sizes like a letter “m”. Also the letter “f” with its descender is untypical for a common grotesque and grabs into the following leading. Furthermore I focussed on the interaction between regular and the italic styles. In contrary to a common sans serif the italic of Mevum has a 18° angle (a contemporary italic has usually a 8° angle). Therefore the italic expresses a own rhythm and character as the regular. So both—regular and italic—keep their own characteristic texture in running text. I wanted to give the user the opportunity to discover the Mevum. Besides the distinctiv diagonal bar on m, n, p, d there are tiny details such as the truncated corners on the end of the stems or the form of the serifs on top left on letters like B, D, P and R which become especially visible in large textsizes.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/mevum_grotesque_textfont_sample_3455.jpg"></div><p></p>
    <p>Full Characterset: Regular</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/mevum_grotesque_textfont_characterset_regular_6378.jpg"></div><p></p>
    <p>Full Characterset: Italic</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/mevum_grotesque_textfont_characterset_italic_4248.jpg"></div><p></p>
    <p><a target="_blank" href="http://fonts.gestalten.com/downloads/dl/file/id/63/mevum_sample_pdf.pdf" rel="nofollow">Download a Font-Specimen (PDF 4MB)</a><br>
