    html: |-
      <p>Can't find a match. It's close to <a class="freelinking external" href="http://www.myfonts.com/search/avenir" rel="nofollow">Avenir</a> with main differences on /G and /M. Also, could be my eyes but a bit confused by the kerning on 'CHROMEO' which looks kind of weird/amateurish/absent (which could be the earmark of a freebie). Letter width looks also unconsistent, /H and /M looking weird among the others... A way to answer could be to <a class="freelinking external" href="http://pocketmags.com/viewmagazine.aspx?titleid=2086&amp;title=Be+Street" rel="nofollow">buy last issue</a> and inspect PDF type properties...<br>
      Some alternatives: <a class="freelinking external" href="http://www.europatype.com/articledetail/17" rel="nofollow">Europa</a>, <a class="freelinking external" href="http://www.tenbytwenty.com/nevis.php" rel="nofollow">Nevis</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/paratype/circe" rel="nofollow">Circe</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/hurme-design/hurme-geometric-sans-4" rel="nofollow">Hurme Geometric Sans 4</a></p>
