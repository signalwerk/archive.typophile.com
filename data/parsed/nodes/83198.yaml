  html: |-
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/logo NYC_5277.png"></div><p></p>
    <p>&nbsp;<br>
    Reserve your spot today online at <a href="http://brandperfect-tour.com" title="http://brandperfect-tour.com">http://brandperfect-tour.com</a></p>
    <p>Follow the Brand Perfect Tour conversation on Twitter - <a class="freelinking external" href="http://twitter.com/#!/brandperfect" rel="nofollow">@brandperfect</a> – and on Facebook <a class="freelinking external" href="http://www.facebook.com/pages/Brand-Perfect-Tour/154873064574711" rel="nofollow">here</a></p>
    <p>The New York arm of <a class="freelinking external" href="http://brandperfect-tour.com" rel="nofollow">The Brand Perfect™ Tour</a> is taking place on June 22 at The Ney Center at Young &amp; Rubicam Group, 285 Madison Avenue, from 8:30 a.m. to 5 p.m.  Launched in May, The Brand Perfect Tour is a series of global forums hosted in London, then Munich and now in New York City, which bring together brands, brand managers, directors, designers and developers in a unique exchange of communication and discovery. The Brand Perfect Tour is not a singular company, a specific brand, or any one profession or organization – it’s ALL of that. It’s an open exchange of ideas, strategies, processes and technologies designed to improve brand consistency and the user experience in the rapidly evolving digital landscape.  </p>
    <p>Join us in New York to share knowledge and discuss the collective challenges of building, maintaining, growing and delivering a unified customer experience. A task made increasingly more complex and demanding by real-time technological advances, multi-channel interactions and the unpredictable fluidity in consumer trends and “click-thru” behavior.</p>
    <p>More information on the event and speakers can be found <a class="freelinking external" href="http://brandperfect-tour.com/bpt/nyc/i" rel="nofollow">here</a>. Reservations for the Brand Perfect Tour can be made at <a href="http://brandperfect-tour.com" title="http://brandperfect-tour.com">http://brandperfect-tour.com</a>. </p>
    <p>Speakers include:<br>
    Chuck Bigelow, Rochester Institute of Technology<br>
    Dan Rhatigan, Senior Type Designer<br>
    Dennis Michael Dimos, Monotype Imaging<br>
    Doug Wilson, Film Director<br>
    John Oswald, Fjord<br>
    Julie Strawson, Monotype Imaging<br>
    Lee Aldridge, Young &amp; Rubicam Group<br>
    Paul Owen, Landor Associates, New York<br>
    Rietje Gieskes, Landor Associates, New York<br>
    Steve Matteson, Monotype Imaging<br>
    Mike Lundgren, VML</p>
