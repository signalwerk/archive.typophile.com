      <p>I haven't given much thought to where the book would be sold, because it's not actually going to be sold. This is a project for school, but if it were actually going to be sold, I would imagine it in a book store. Your comment about a design looking good as postage-stamp-sized icon is different than designing a book that looks good in a bookstore, was actually extremely helpful. I see what your saying now. </p>
      <p>I agree about adding the authors name. That's actually something I meant to ask my instructor about. We are not technically the authors of these book. We were told to look up recipes online and cite them on a page in our book. So I'm not really sure if I can technically put an author.</p>
      <p>Your idea about adding a subtitle is also good. That will make it look more like a book and add another design element to the slightly boring design. </p>
      <p>I will try a few variations of your suggestions and see what looks best. Thanks again</p>
