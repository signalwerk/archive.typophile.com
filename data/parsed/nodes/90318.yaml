      <p>It's a cocktail recipe book containing classic drinks such as the margarita and the mojito. There are also illustrations inside for each recipe similar to the illustration on the cover that show you how much of each ingredient to add. </p>
      <p>I haven't given much thought to whether it would be sold in a book store or online. </p>
      <p>The book is 6x5 inches.</p>
      <p>Originally the target audience was going to be women who dislike the taste of alcohol. The overall theme plan was "girly drinks". As the project progressed I decided that I didn't want to limit the audience to just women, there may be men that feel the same way about the flavor of alcohol. So the design got slightly more neutral. </p>
      <p>"Mixtour" is one word for my book. </p>
      <p>Since this a project for a typography class, I don't want it to appear like I barely used any text on the cover, but if I add more, such as adding something like "take a tour of these classic cocktail recipes" below the title, would that help...or would that destroy the title that currently looks alright by cluttering it?</p>
      <p>Thank you for the suggestions. I'll give them a try!</p>
