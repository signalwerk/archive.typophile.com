      <p>Does "cocktail book" mean a book about how to mix different drinks, or something else? Is this supposed to look good in a bookstore, or on Amazon.com, both, or someplace else? What size is the book? Who is the target audience? Is "Mixtour" one word? What do you mean by "more text"?</p>
      <p>I like this cover; it looks nice. Maybe there should be more of a contrast between "Mix" and "tour". To me, it's in that in-between area between contrast and conflict. Maybe make "mix" a different color, such as the orange in the drink. Or have it be taller and stick out of the bottom and top of the box. Or both.</p>
      <p>I don't design book covers. This is just one opinion.</p>
