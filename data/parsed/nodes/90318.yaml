      <p>"I haven't given much thought to whether it would be sold in a book store or online."</p>
      <p>You should decide this, or define it yourself, because designing something that looks good as a postage-stamp-sized icon is different than designing a book that looks good in a bookstore.</p>
      <p>I have two thoughts, not so much about design, but more about books. One is that I expect to see the author's name on the cover.</p>
      <p>And here's the other. Many nonfiction books have a subtitle that clarifies what the book is about.<br>
      --Cocktail Mixtour: Mix beautiful drinks and meet beautiful people<br>
      --Cocktail Mixtour: How to mix drinks and become an independent bartender<br>
      --Cocktail Mixtour: Mix sweet drinks and stay on your diet</p>
      <p>But, whether it's in the title or you are just adding some text to the cover, it's still appropriate, especially if you are designing for the bookstore. If you go down this road it may be best to take your title out of the box and put it right on the yellow background.</p>
      <p>I hope someone else checks in with the typographic advice that you actually requested.</p>
