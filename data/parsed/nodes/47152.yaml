    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 7.Jul.2008 1.04pm </div>
      <p>After Ken Barber of House Industries took home <a href="http://www.tdc.org/news/2008Results/index.html">3 TDC2008 Awards</a> for <a href="http://www.tdc.org/news/2008Results/Sable.html">Studio Lettering Sable</a>, <a href="http://www.tdc.org/news/2008Results/Slant.html">Sutdio Lettering Slant</a>, and <a href="http://www.tdc.org/news/2008Results/Swing.html">Studio Lettering Swing</a>, I’ve been chomping at the bit to see the entire set.</p>
    <p></p><div class="imageWrap"><img src="/files/screenshot1_5445.png"></div><p></p>
    <p>The folks at House don’t disappoint. They’ve added more temptation beyond the fonts including an <a href="http://www.houseind.com/index.php?page=accessories&amp;id=663&amp;category=mousepads">ampersand mousepad</a>, <a href="http://www.houseind.com/index.php?page=clothing&amp;id=667&amp;category=studio_tees">ampersand t-shirts</a> (for the whole family no less!), <a href="http://www.houseind.com/index.php?page=accessories&amp;id=673&amp;category=sculpture">cast iron and cast aluminum ampersands</a>, as well as the <a href="http://www.houseind.com/index.php?page=accessories&amp;id=677&amp;category=books">Studio Lettering Book</a>. Isn’t there a Christmas in July tradition?</p>
