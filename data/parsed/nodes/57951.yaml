      <p>If you check the article you can see that Midashi Go MB31 matches Helvetica<br>
      pretty closely, but it is not an exact match. There is no legitimate font that matches<br>
      100%. Pretty much all the best designers here in Tokyo use either Midashi Go MB31 or Gothic MB101.</p>
      <p>If there exists a perfect match then somebody has just made the swap for you,<br>
      replacing the roman characters of the Japanese font with Helvetica. I don’t know<br>
      that I would trust someone else to make that swap for me.</p>
      <p>There are not that many well drawn Japanese fonts to choose from, I would guess<br>
      because of the sheer amount of characters that have to be included in a complete<br>
      font. I think I have included most of the really well made ones in the comparison,<br>
      but if you find out the name of the font you used before then I would love to know.</p>
