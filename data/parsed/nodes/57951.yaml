      <p>When I was living in Tokyo, I bought a CD Rom with about 200 fonts, and some of them were the exact equivalent of Helvetica, as I could test at the time by pairing them on a page. Unfortunately, this was 11 years ago and the CD Rom is long gone in my many archive boxes, as well as the name of the font. But the point is, I disagree with you, there is a right choice. You simply didn't find it.</p>
