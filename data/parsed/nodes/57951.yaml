    <p>I have posted an article on matching Helvetica with Japanese<br>
    fonts on my blog for those who are interested –<br>
    <a href="http://www.andseen.com/?p=353" title="http://www.andseen.com/?p=353">http://www.andseen.com/?p=353</a></p>
    <p>It would be nice with some input from these forums too.<br>
    As I say in the article, there really is no right choice, but<br>
    it would be interesting to do further comparisons and<br>
    to hear from more people.</p>
    <p>I may also continue with more articles dealing with other<br>
    fonts and how to mix the two languages.</p>
