      <p>Hi Mike,</p>
      <p>This is a very subjective question, since it’s hard to guess how much ’tweaking’ you want to do. I looked through hand-drawn lettering fonts for each of the three styles on the cover. (1) = HOW GAMBLERS WIN; (2) = OR THE SECRETS OF; and (3) = ADVANTAGE PLAYING. I looked for fonts without layering that you would use for (1) and (3). </p>
      <p>These would be fonts I might try for these (just ideas based on a quick look):</p>
      <p>(1): <a class="freelinking-external" href="http://www.myfonts.com/fonts/linotype/ad-hoc/">Ad Hoc</a>, <a class="freelinking-external" href="http://www.myfonts.com/fonts/fontfont/ff-rekord/">Rekord</a>, <a class="freelinking-external" href="http://www.dafont.com/repent.font">Repent</a>, <a class="freelinking-external" href="http://www.myfonts.com/fonts/redrooster/sinclair-script-rr/">Sinclair</a></p>
      <p>(2): <a class="freelinking-external" href="http://www.myfonts.com/fonts/p22/escher-hand/">Escher Hand</a>, <a class="freelinking-external" href="http://www.myfonts.com/fonts/bitstream/kooky-bt/">Kooky</a></p>
      <p>(3): <a class="freelinking-external" href="http://www.myfonts.com/fonts/t26/toulouse-lautrec-moulin-rouge/">Moulin Rouge Solide</a></p>
      <p>- Mike Yanega</p>
