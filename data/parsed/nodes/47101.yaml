    <p>Greetings,<br>
    I’m trying to recreate the flavor of this delightful book cover, and I thought you fellow typophiles might have some suggestions for similars to the three typefaces—which are obviously hand drawn—that I could use as starting ponts.</p>
    <p>Your help and expertise is greatly appreciated, as always!</p>
    <p>PS: For our American friends—hope you’re having a great holiday weekend.</p>
    <p></p><div class="imageWrap"><img src="/files/HGW_sample_6117.jpg"></div><p></p>
