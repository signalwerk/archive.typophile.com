  html: |-
    <div class="node-spam-content"><p>I hope this is the right forum for this.</p>
    <p>I'm running this Microsoft utility under Windows 7 Pro x32 on another machine. Whenever I try to use this utility, system brings up Windows Installer with an error message that says:<br>
    "Windows Installer is looking for, but can't find:<br>
    Microsoft Opentype Font File Properties Extension.msi"</p>
    <p>... and gives a browse function for this installer file.</p>
    <p>This utility works fine if I select the "cancel" button on Installer window, however.</p>
    <p>I've tried removing this utility to reinstall it, but I get the same error message. Could anyone shed some light on what the problem could be?</p>
    <p>Also, will this utility run under Windows 7 Pro x64?</p>
    </div>
