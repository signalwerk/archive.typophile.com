  html: |-
    <p>After admiring the street type on my walks to work, I wanted to document and share what I had found. So I created villatype, a visual record and discussion of typography in the public domain. If you are interested in submitting your own found type please feel free to contact me. Visit villatype at villatype.blogspot.com</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/villatype_3553.gif"></div><p></p>
