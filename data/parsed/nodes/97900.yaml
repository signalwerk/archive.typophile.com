    html: |-
      <p>The basic question is: what are the “rules of engagement”? The children at the younger extremes of the spectrum are still learning about how the world works, and how they fit into it. Teens, on the other hand, are trying to find their place in the social hierarchy. So, at one end, the principle at work is Wonder; at the other end, Conformity. Of course, what is cool to teenagers is constantly changing—which makes parents perpetually clueless, and product and/or service peddlers rich.</p>
      <p>So, that which engages the younger minds may remain constant, while the older minds will seek Novelty. IMHO, this typeface works either way…</p>
      <p><a href="http://www.myfonts.com/fonts/nicksfonts/kandinsky-nf/" title="http://www.myfonts.com/fonts/nicksfonts/kandinsky-nf/">http://www.myfonts.com/fonts/nicksfonts/kandinsky-nf/</a></p>
      <p>Although, obviously, not in all caps…</p>
