    <p>Hi, I'm doing a project on "engaging the audience" and getting them to feel inspired and appreciate typography, My audience is 4-16 year olds. My aim is to try and inspire 4-16 year olds to appreciate typography and possibly enjoy it more. I've done some secondary research into my age range and have even tried to make typography attractive via means of colour and shape but i'm not really getting much feedback when i approach people who stop and look. I was wondering if anybody may have some helpful suggestions or advice?</p>
    <p>Thanks!</p>
    <p> </p><div class="imageWrap"><img src="http://typophile.com/files/__6114.jpg"></div><p></p>
