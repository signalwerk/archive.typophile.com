    html: |-
      <p>Your audience is so far apart in the learning curve of language, writing, recognizing letters that you'll have to set up multiple ways to engage them. So I wouldn't bombard the younger audience with too many ways of writing/lettering. </p>
      <p>For the younger ones I think it's more interesting to let them do things with their hands. For instance: take a box of sand and draw letters in it, this also immediately teaches the reason of negative space since your letters will otherwise collapse ;) </p>
      <p>But for your older audience I think letting them discover letterforms in their surroundings could be a good way to engage and teach them. Having them understand why they see a letter, understanding what the main ingredients are of a letterform. Also, this is something they can take along after your project is long done.</p>
      <p>Sadly my own intervention into kid type/typography still will take a while to finish, otherwise I'd hook you up.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ZHDLD_5612.gif"></div><p></p>
      <p>Interested in what you'll come up with!</p>
