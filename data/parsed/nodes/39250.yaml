    <p>Did Amazon create an ebook reader that stands to crush our printed page as we know it? Is this the ipod of books? </p>
    <p>Bezos seems to think so.</p>
    <p>With wireless capabilities, a hard drive, and the ability to have any book written in history at your fingertips in less than a minute, this could get interesting. </p>
    <p>Amazon has taken their time with a device called the Kindle that ships for $399.</p>
    <p>What do you guys think?</p>
    <p><a class="freelinking-external" href="http://www.newsweek.com/id/70983/page/1">http://www.newsweek.com/id/70983/page/1</a></p>
