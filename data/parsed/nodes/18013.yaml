    <p>I am making a logo for a performance art festival. This logo was selected but we are still unsure about the typface. We would like something with a little more personality but without being trendy. I have been looking at techno-ish fonts but can't find anything that is not going to be out of fashion in 2 weeks. It can't be an old style typeface (unless I am proven wrong), I need a sans serif, a bit blocky, but supple enough to use as body text. Would be great if the typface looked like a monospace but is actually  proportinal. Don't know if this last request makes any sense. Anyway, thanks for your help.</p>
