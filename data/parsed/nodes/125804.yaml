      <p>Complement sans serif for Linux Libertine are <strong>Linux Biolinum</strong> which is supposedly similar to <strong>Optima</strong> or <strong>Candara</strong>.<br>
      Ref: <a href="http://en.wikipedia.org/wiki/Linux_Libertine" title="Click to visit a wikipedia page." class="freelink freelink-wikipedia freelink-external">Linux Libertine @&nbsp;Wikipedia</a></p>
