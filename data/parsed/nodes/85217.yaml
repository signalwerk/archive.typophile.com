      <p>Now that's an unusual question.</p>
      <p>This question involves too many links in the chain, though, to be considered a single issue from start to finish.</p>
      <p>When it comes to libraries, one thing to remember is that they tend to be funded by local sources of tax revenue. Hence, they will not be likely to purchase books that are needlessly expensive. </p>
      <p>Thus, they're not likely to purchase luxurious private press editions of works that are already available in more utilitarian editions.</p>
      <p>This additional constraint would need to be kept in mind to answer your original question as posed.</p>
      <p>Because the question that can be answered, or at least examined directly, in a more reasonable fashion is: which kinds of books (as defined in terms of subject area) are more likely to be produced with an eye to quality typography?</p>
      <p>Several categories come to mind.</p>
      <p>Editions of classic works of poetry (such as Edward Fitzgerald's translation of the Rubaiyat of Omar Khayyam, a special case, as there have been several mass-market editions of this work designed to resemble private-press editions in elaborateness), short fiction, or even some essays - the kind of material found in private press editions.</p>
      <p>Books about typography, advertising layout, art, and related subjects.</p>
      <p>Some types of children's books, I think, although someone here has questioned that.</p>
