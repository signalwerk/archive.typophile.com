      <p>I used to work at a public library (although my job didn't include ordering the books). The librarians didn't personally inspect most of the books prior to ordering them. They ordered them based on factors such as which books were on the bestseller lists, which books had received the best reviews, which books were needed to fill holes in the library's collection, etc.  </p>
      <p>I'm sure most librarians love an attractively-designed book, but they generally wouldn't know anything about the typographic qualities of the books prior to ordering them unless it was something that was mentioned, good or bad, in the reviews.</p>
      <p>In recent years libraries have seen more and more of their budgets being used to purchase things other than traditional books -- computers, electronic books, audio books, videos, music CDs, etc. In the future we'll probably much less shelf space devoted to traditional books as more and more of their customers (especially younger ones) will want ebooks instead.</p>
