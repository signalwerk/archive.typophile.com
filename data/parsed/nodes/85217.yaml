      <p>This is a different question indeed.</p>
      <p>It is true that in the wealthy nations, the market demands books that meet a certain standard of typographic quality. Even if it costs a bit more to make a book this way, it will be printed on white paper, such things as margins and leading will be reasonably generous, and so on.</p>
      <p>Of course, we're still not all that rich, so pocket books and paperbacks and second-hand books are still very popular.</p>
      <p>But even pocket books, printed on newsprint, still are more easily readable than many of the books from the later nineteenth century, when there was a great deal of competition to make books as cheaply as possible, and so typefaces were narrow and ugly, and printing was usually in smaller point sizes.</p>
      <p>So I would analyze this situation as follows:</p>
      <p>Artistic typography will make an individual book eye-catching, and so people who have come to the library might pick up that book and look at it first.</p>
      <p>But just getting the basics right - making sure the book is easy and comfortable to read without eyestrain - combined with ensuring that what is in the book is what they are interested in reading will count for more.</p>
      <p>Even here in our educated and civilized society, the most popular books in the public libraries are in the fiction section. Despite the books in Indonesia not having good typographic quality, I suppose you still have, and thus don't "need" more, romance novels, detective stories, and things like that.</p>
      <p>Education that people can apply in their own lives - things like cookbooks, books on household repairs, on sewing - won't be ignored.</p>
      <p>And there will be people who will want to widen their horizons if it's made easy and interesting - books written for the lay person about science, for example, are popular. And your country's traditional literature wouldn't have survived if it wasn't entertaining to the ordinary people.</p>
      <p>But don't set your sights <em>too</em> high. Pretty typography will <em>not</em> bring them to a library that chooses its books on the basis of "Read this, it's good for you". Educating and civilizing people only works if you remember that to work it must be a slow and gentle process.</p>
