      <p>Picture 1: Bembo and Interstate.<br>
      Picture 2: Syntax, Rockwell, Franklin Gothic, and VAG Rounded.<br>
      Picture 3: All of the above, plus Perpetua.<br>
      Picture 4: More of the same, plus Century Schoolbook.<br>
      Picture 5: Ditto, plus Walbaum.<br>
      Picture 6: Also News Gothic ("ccac").<br>
      Picture 7: Also some Deepdene ("Crafts").<br>
      Picture 8: Throw in a little Scala small caps ("ARCHITECTURE"").</p>
