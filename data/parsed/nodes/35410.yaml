      <p>It does come across as mark from the 60's. Very iconic. A few suggestions, first, would be work on the 'A' in Ian. You may not need to make it so disjointed. Second, I would be curious to see what the 'M' would like if the bottom line was removed. Third, the 'B' might not need to be flipped. I'm sure making this changes would bring up the space you're probably tying to address. Do you have a color version? This might fix everyones readability issue.</p>
