      <p>I would echo 'malbrights' comments.</p>
      <p>Your design is getting close to being a really good solid logotype...</p>
      <p>Excuse my dogma, the more I look at it, the more possibilities that I can see that might help the visability of the type, here are an initial few thoughts to try out?<br>
      I think its crucial to get the 'C' clearly visible. Maybe lose the diagonal that links to the 'm'. At first glance you might need to move 'amp' left so the 'C' lines up with the 90 degree vertical of the 'A' - I know this throws everything else out but thats why designing logos is'nt as easy as people think!<br>
      The 'B' doesn't need to be flipped.<br>
      Lose the line under the 'm'</p>
      <p>If you look at some examples of Avant Garde being used by Herb Lubalin, you will see that it does'nt need to be as complicated to look great.</p>
      <p><a href="http://www.graphic-design.com/Type/Avant/Avant2.html" title="http://www.graphic-design.com/Type/Avant/Avant2.html">http://www.graphic-design.com/Type/Avant/Avant2.html</a></p>
