      <p>Personally, I think it's really clever and shows a lot of imagination and hard work. My thoughts would be:</p>
      <p>-- It's too complicated, making it difficult to read and comprehend the concept. I would simplifiy it overall, and try to lose some of the lines which obscure the lettershapes. Granted, you're trying to fill negative space and not leave unsightly gaps, but still, at first blush I find it a little tough to read. Maybe some air might actually help.</p>
      <p>-- Have you seen it in a very tiny version? I'm wondering if the tight kerning will plug up when reduced in size or printed under adverse conditions.</p>
    html_clean: |-
