      <p>This is complicated, maybe a little ugly BUT I like it. Hola raise a good question as to color. I'd say if you make the camera one color and your name another it will work just great. </p>
      <p>Comments:</p>
      <p>I think it's a little odd that the A in Ian is slanted in the opposite direction from all the other angles.</p>
      <p>The C is pretty close to being an O and lost. You need it to look more like a C than a lens. </p>
      <p>I think this is cool, though. As long as you have your name clearly printed in wherever you're using this readability shouldn't be a problem. If you want it to work all by itself start working off some of the feedback you've gotten here and post updates!</p>
