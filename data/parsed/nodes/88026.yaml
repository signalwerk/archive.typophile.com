    <p></p><div class="imageWrap"><img src="http://typophile.com/files/edita_book_3666.png"></div><p></p>
    <p>You asked for it, we delivered! Pilar Cano swiftly responded to the user's requests for additional weights for <a class="freelinking external" href="http://www.type-together.com/Edita" rel="nofollow">Edita</a>. In this upgrade, we are proud to present Edita Book, a slightly darker style of this gorgeous typeface specially engineered for continuous and extensive reading. Edita Book supports the same huge character palette as the rest of the styles in the family and the same beautiful texture. But this time it offers a specific solution for those applications where reader fatigue is part of the designer's problem.</p>
    <p>More information at: <a class="freelinking external" href="http://www.type-together.com/Edita" rel="nofollow">http://www.type-together.com/Edita</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/edita_10-kopia_5614.gif"></div><p></p>
