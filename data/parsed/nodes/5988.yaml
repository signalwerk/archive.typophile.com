    date: 2003-01-10T12:41:00
    date_raw: 10 Jan 2003 — 12:41pm
    votes: null
    html: "<p>Aw, you beat me to it, Mr. Coles.  <br>  <br>Here's the quickie tutorial:  <br>  <br>1. Type the fraction. ie. 1/2 - Be sure to use the fraction bar, Shift-Option-1.  <br>  <br>2. Select the numerator and either a) make it superscript or b) change the font size to 50% size and shift the baseline. If working with a 12pt font, you can change the numerator to 6pt and then give it a 6pt baseline shift. (These functions are easily found in the Text tool palette)  <br>  <br>3. Select the denominator and change its font size to 50% size  <br>  <br>4. Finally, check your kerning - you might need to nudge the characters to get it just right.  <br> </p>"
    html_clean: "<p>Aw, you beat me to it, Mr. Coles.  <br>  <br>Here's the quickie tutorial:  <br>  <br>1. Type the fraction. ie. 1/2 - Be sure to use the fraction bar, Shift-Option-1.  <br>  <br>2. Select the numerator and either a) make it superscript or b) change the font size to 50% size and shift the baseline. If working with a 12pt font, you can change the numerator to 6pt and then give it a 6pt baseline shift. (These functions are easily found in the Text tool palette)  <br>  <br>3. Select the denominator and change its font size to 50% size  <br>  <br>4. Finally, check your kerning - you might need to nudge the characters to get it just right.  <br> </p>"
