    <p>For a while now I haven’t followed the Type-ID section at all. One reason is that helps me spend less time on Typophile, but another is that I feel inadequate in the company of the planet’s best font hounds! But I have noticed (through the [old] search facility) that some ID threads evolve into quite interesting discussions, ones I’d love to be exposed to. And I suspect a few others are in my position, so I have a suggestion:</p>
    <p>Could we have a Best of Type-ID compilation? It would include threads with juicy discussion but also exceptional cases of font sleuthing, and maybe great humor, etc. Assuming Yves is willing to spend <strong>any</strong> time on something like this, what would reduce his load a lot would be if people (especially the pack of alpha hounds*) nominated memorable threads, or even divvied up chronological chunks** of all the ID threads and went through them. It could be a long-term thing, as people have the time.</p>
    <p>* In fact one of the alphas could be the project kahuna instead of Yves.</p>
    <p>** You could give me a chunk too.</p>
    <p>hhp</p>
