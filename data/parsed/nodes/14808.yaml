    html: <p>thank you one and all for your suggestions!  i really appreciate your helpfulness.  i've narrowed it down to between two "types" of invites and am still working on the font situation.  it looks like the smallest they'll need to go w/b 16 pt (but that's from using bradley hand from word, so not sure what the actual font will need to print at to make it fit).  must say i do LOVE the ministry script but think it's a bit formal for what we'll be doing (not much formal or traditional about this wedding!) :D  thanks again!</p>
