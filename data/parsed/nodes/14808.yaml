    <p>hello all!  i'm a newbie and have spent hours and hours searching for the fonts for my wedding invitations on myfonts.com and came up with the following ones i love:<br>
    script - Inspiration ROB  (like best cuz it's funky and more casual)<br>
    rest of invite - garden party or cataneo light  OR<br>
    script - p22 Ruthie<br>
    rest of invite - locarno light</p>
    <p>my questions are these: will those fonts work in a smaller size? say 14 to 16?  do you have any other suggestions for good fonts that won't cost me an arm n leg and that will print nicely?  also, does the P22 mean anything on the font name - like it prints best or only at 22 pt?<br>
    thank you so much for your help!! have a great week!  karen</p>
