    html: "<p>P22 is the foundry name: it has nothing to do with what sizes it will print best at. Most of the invitations we do in our print shop are set no smaller than 16 point, with 20-24 pt. being most common. Maybe it's because older recipients have poorer eyesight (and are more likely to have bigger bank accounts = better gifts).</p>"
