      <p>I recently did <a href="http://typophile.com/system/files?file=InviteRedux.gif" rel="nofollow">my sister's wedding invitation</a> in Ministry Script and she loved it. I splurged on the type cuz its part of my present to her and i just wanted an excuse to purchase it. but if you're looking for something a little easier on your invitations budget, it looks like <a href="http://www.myfonts.com/search?search%5Btext%5D=rob+leuschke" rel="nofollow">Rob Leuschke</a> designs are what you're looking for. If you like the Minsitry Sript suggestion, take a look at some more stuff by <a href="http://www.sudtipos.com/fonts2.htm" rel="nofollow">Sudtipos</a>. I just love their scripts. If I ever get married, I'm gonna use <a href="http://www.myfonts.com/fonts/sudtipos/plumero-script/" rel="nofollow">Plumero Script</a> on my invites.<br>
      ...oh and <a href="/wiki/p22" class="freelinking" rel="nofollow">p22</a> fonts should work at any size, if they don't email me directly! ;^D</p>
