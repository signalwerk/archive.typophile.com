    html: <p>You may very likely find overall similar typefaces, but these slightly bellied/bulgy/curved characters [see the verticals] sure scream (weirdly) custom/ised. They also seem to use ‘<a href="http://www.myfonts.com/fonts/fontfont/clan-pro/?refby=dav" target="_blank">FF Clan (Extended)</a>’, by Łukasz Dziedzic, for their ‘Luxury Hotels’ tagline, so the logo may be ‘customised’ Clan, as well.</p>
