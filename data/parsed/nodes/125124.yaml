      <p>Appreciate the help here, but let's make sure we direct these posts to the Type ID section. The first time a user posts Type ID to the wrong place, they get a personal message directing them to the proper place. Repeat posters may find themselves with suspended accounts. We gotta channel this activity, or it'll overrun Typophile as it did a year ago. Let's rally together on this!</p>
      <p>Interestingly enough, the multiple downvotes does a good job to show Typophile admins and moderators those posts/comments that need attention. While the "meaning" may be ambiguous, it does give the community a tool to help sift signal from noise.</p>
