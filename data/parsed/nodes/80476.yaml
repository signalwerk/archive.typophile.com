  html: |-
    <p>Hi guys,<br>
    I am design a weekly newsletter with the utter classical combination of Helvetica Neue for titles and Adobe Garamond Pro, for body text.</p>
    <p>Most of the people receive the PDF and read it online. Most of the readers are 50/60 years old psychologists, philosophers or social studies related professions. So i wonder if 12 pt/14 pt leading, for reading from a screen is to consider big/clear enough. Most text are many pages long. </p>
    <p>Besides that, i would like to know what other font would you recommend for reading large texts on a PDF from a computer screen? Is the 12 pt ok? Lines are 80 characters long. Here is an example by the way.</p>
    <p>Thanks for any info!</p>
    <p>Cheers,<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/11_4404.png"></div><p></p>
