    html: |-
      <p>the story has some basis in truth</p>
      <p>In the early 90s - an ex-typographer had retired to Florida. He receive<br>
      pemission from Photolettering, Inc. to digitize some of their fonts.<br>
      They thought he (I don't know his name, sorry) was doing it for his<br>
      own personal use -- however, he marketed about 100 Photolettering<br>
      fonts (ie. Advertising Gothic, Algonguin, Angelface, Bonaparte, Lennox,<br>
      Murray Hill, Vogue Didot, etc. - I think to buy the set back then was<br>
      $100.) I remember asking Cosmos (salesperson at Photolettering) how<br>
      it had happened. He assured me they were duped - thought they were<br>
      helping a down and out typographer - and were trying to do something<br>
      to halt the sale. Don't know if they ever did... and now, they are out<br>
      of business too...</p>
      <p>So if I understand you - it looks like Chopin was the digitized version<br>
      they ended up at URW as Polonaise... and for which URW has paid<br>
      a fee to have it.</p>
      <p>I always thought it was clever to rename Polonaiase to Chopin - for<br>
      where else would we know a Polonaise from?</p>
      <p>Thank you.</p>
