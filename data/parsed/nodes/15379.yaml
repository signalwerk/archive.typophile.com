    votes: null
    html: |-
      <p>I have been trying to figure this one out - and would appreciate your help.</p>
      <p>Phil Martin is no longer with us (he unfortunately passed away on October 4, 2005) but he did do the original drawings for Polonaise back in 1977 - and actually published a front cover in it... verifying the time he made it.</p>
      <p>There is a font going around for free named Chopin. I opened it in Fontographer and found it to be dot for dot, line for line and exact replica of the FontShop font named Polonaise.</p>
      <p>One interesting fact I found was from Phil Martin's site - his notes on the face:<br>
      "My German distributor sent me a few words in script, urging that it be developed into a typeface. My assistant, George Brian did most of the work to bring it to completion.  Turned out woman lettering artist in Stockholm, Sweden who had hand-lettered chapter titles for a book, was furious to find she had inspired a typeface. George and I felt she should have taken it as a compliment." </p>
      <p>Now I opened up Dieter's version also in Fontographer - and it is a different set up - more like a scan of the face and retooled - so an original "drawing" and not a switch.</p>
      <p>I have been having a private discussion with someone as to the validity of Chopin.</p>
      <p>Dieter has no claims - even his "copyright" says the year 2000.<br>
      Chopin has no copyright - just the word "Diogene"  while<br>
      Polonaise has: copyright 1999 by Fontshop</p>
      <p>and I don't know what year URW copyrighted it...</p>
      <p>Any one with any thoughts, sugestions, comments?</p>
