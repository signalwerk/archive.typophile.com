    html: |-
      <p>I did not know Phil had died. Now I know why I have not heard from him for so long. :-(</p>
      <p>I'm among several designers who agreed a couple of years ago to digitize those of his fonts which hadn't yet been digitized. So far I've release one family--Grad, the last typeface design he did, originally for his personal use. I'm still working on two other families--Fotura (to be renamed Frizbo) and Bagatelle.</p>
      <p>Regarding Polonaise, you have more information than I do about it. I was just speculating in my comments (above).</p>
      <p>The story I heard (from Phil, I seem to recall) is that most of his fonts that have been digitized were done by a font pirate in the early nineties. The pirate was shut down and URW ended up with the fonts and added them to their library. Phil contacted URW and informed them that the fonts were his designs and they paid him royalties on them from then on. (This is from memory, so some of this may not be entirely accurate.)</p>
