    html: "<p>Polonaise and the others were given the correct names by the unknown pirate when they were digitized. I believe Chopin was the name given to a pirate film font (pre-digital). There are a few of these in the Dover books. Some of the pirated versions of Phil Martin's fonts had similarly clever or \"funny\" names: Jolly Roger renamed Happy Jack, Introspect renamed Looking Glass, Threadgill renamed Twistfin, etc.</p>"
