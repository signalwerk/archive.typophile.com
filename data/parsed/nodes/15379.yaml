    html: |-
      <p>Chopin is most likely the source for Polonaise (note the name). Polonaise is one of Phil Martin's. At least half of the fonts he produced were based on existing fonts, usually with some alteration in the design. </p>
      <p>So, more likely, it is an autotrace of Chopin. (Dover type book + autotrace = crap font, the source of many a free font.)</p>
