      <p><cite>I would see that as good evidence that slant is 99% of what an italic is, and cursiveness is moot. Which is not to say we shouldn’t make true italics for fonts, but maybe: we should start by mechanically deriving it from the roman; and we should charge much more for a “true” italic.</cite></p>
      <p>I tend to agree here. The general public seem to have the impression that italics are just slanted type and I’ve seen no evidence that most readers are at all bothered by fake italics (fake bold is still awful to try and read, tho). Maybe the tradition of doing script-based italics is just, well, unnecessary in many cases. </p>
      <p>Of course, for the sake of the designers who have to stare at them for hours at a time, real italics are probably worth holding onto.</p>
