      <p>PDFCropper is the application, designed to solve the problem with preparing for reading normal sized (A4-like) pdf’s on relative small (Sony Reader PRS500/PRS505, iRex Illiad etc.) devices.</p>
      <p>The problem is that pdf is not reformatable by nature. Yes, there is reflow mode in Acrobat Reader, but at first Acrobat Reader is not available for most e-book readers (especially for e-ink devices),<br>
      and second even with reflow function reading of complex content (technical books, magazines etc.) is not comfortable. Bad formatted pdf’s and wide white spaces make the situation even worse.</p>
      <p>The only way how this problem can be solved (at least based on my experience) to cut original pages into smaller pages with removing white spaces.<br>
      This is exactly what program do. But comparing with similar software PDFCropper is much more flexible, that allows to prepare books with much better quality in a very short time.</p>
      <p>Currently PDFCropper can produce text and image pdf’s. Later additional output formats (lrf, lrs, wolf etc.) will be added.</p>
