      <p>I played around with the Sony reader over the last weekend. It’s interesting, but definitely not ready for anyone who doesn’t buy $250+ gadgets for the hell of it.</p>
      <p>The screen redraw is extremely irritating. It’s not the second it takes that’s the real problem, it’s the jarring experience of the screen flashing black and two pages of type overlaying each other and then settling on the new one. Also irritating is the interface; there are too many buttons and the layout makes little, if any, sense. It needs a manual page attached to the inside of the screen cover, like the little character drawing guides included with Palm OS devices. </p>
      <p>Regarding type rendering the reader is a winner. Characters are rendered crisply and pages are very easy on the eyes. Layouts, however, are gross. Poorly-placed page breaks, widows, and orphans abound. It’s not just bad in the sense a designer will understand, this thing churns out lines that look like early drafts of high-school term papers. The only book on the model I tested was <em>The Da Vinci Code</em>, and the reader managed to make Dan Brown’s deplorable prose even worse. This could be dealt with by just setting standards for books sold via the official store, or even a firmware update that sets some simple rules for displaying text on-screen, but Sony isn’t the sort of company that will make it happen.</p>
      <p>The problems with the Sony reader make me expect it to flop just like the old LCD ebook readers did. It could have a future if it sold for less, and if books were sold at a massive discount to make up for having to read them in this dreadful state. But that not being the case, I cannot see why any serious reader would buy the Sony reader.</p>
