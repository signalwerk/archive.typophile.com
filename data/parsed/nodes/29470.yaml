    <p>Sergey has one of these devices so let me take a few pics of the type using my wife’s EOS 20D (which I have no idea how to use) but here goes...</p>
    <p></p><div class="imageWrap"><img src="/files/TPa_5747.jpg"></div><p></p>
    <p>Bitstream Swiss and Dutch and Freetype too. I wonder if hints are used? Probably not.</p>
    <p></p><div class="imageWrap"><img src="/files/TPj_6744.jpg"></div><p></p>
    <p>Here’s the Swiss, used in the UI - looks a bit blotchy up close...</p>
    <p></p><div class="imageWrap"><img src="/files/d1_4360.jpg"></div><br>
    <div class="imageWrap"><img src="/files/d2_4525.jpg"></div><br>
    <div class="imageWrap"><img src="/files/d3_5686.jpg"></div><p></p>
    <p>These are not quite in focus, but it looks like the bold might be fake? </p>
    <p></p><div class="imageWrap"><img src="/files/TPb_5458.jpg"></div><p></p>
    <p>More UI</p>
    <p></p><div class="imageWrap"><img src="/files/TPh_5041.jpg"></div><p></p>
    <p>And Dutch used for the eBook content. Stem ’color’ seems uneven.</p>
    <p></p><div class="imageWrap"><img src="/files/TPc_6411.jpg"></div><p></p>
    <p>Would you like fake small caps with your fake italics? ;-)</p>
    <p></p><div class="imageWrap"><img src="/files/TPi_4998.jpg"></div><p></p>
    <p>More Dutch text up close.</p>
    <p></p><div class="imageWrap"><img src="/files/TPd_4244.jpg"></div><p></p>
    <p>More like it, Calibri embedded in a PDF - stems still inconsistent, spacing is whack (compared to Office 2007 and Adobe Reader 7). I had to generate the PDF at a small paper size (here 4 x 6) because the 11pt type was too small at A4. Device does not appear to have good zoomability. :-( </p>
    <p></p><div class="imageWrap"><img src="/files/Capture_5950.JPG"></div><p></p>
    <p>Word 2007 and Adobe Reader 7 rendering as a comparison.</p>
    <p></p><div class="imageWrap"><img src="/files/TPg_4242.jpg"></div><p></p>
    <p>Close up</p>
    <p></p><div class="imageWrap"><img src="/files/TPe_5486.jpg"></div><p></p>
    <p>And Cambria.</p>
    <p></p><div class="imageWrap"><img src="/files/Capture_5168.JPG"></div><p></p>
    <p>The original in Word. </p>
    <p>One other quirk, spotted by Sergey, (maybe specific to Word generated PDFs?) is that PDF pages that use fake bolds take a long time to render on the device. That will teach people for using fake bold! An electric shock would be good too.</p>
