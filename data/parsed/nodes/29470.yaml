      <p>In a certain forest-and-trees exchange, you’ve focused on the letterforms and managed to say nary a word about the atrocious typography in that screen shot of “The American University of Paris proudly presents...” Even if the fonts were perfect, it’d still be lousy text typography, which is what ultimately matters.</p>
