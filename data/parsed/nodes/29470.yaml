      <p>I think that it’s up to the type designer to decide what the Roman and Italic (if any) look like.</p>
      <p>However, if a font is intended to be used with true “cursive” italics, then it should be set that way (unless, of course, there is reasoning behind the use of a slanted Roman). Artificially slanted and boldened(?) text should be used only in the absence of true italics or bolds.</p>
