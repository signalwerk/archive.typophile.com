      <p>There’s laziness of action, then there’s laziness of spirit. Speedily making something that’s both ideologically and practically sound doesn’t have to be the former, and spending time making yet another overly-cursive italic can often be the latter.</p>
      <p>That said, I agree that “nobody will notice” isn’t a good enough argument, especially since reading is essentially subconscious. But when you couple it with “we shouldn’t be doing it anyway” then it gets pretty convincing!</p>
      <p>Essentially, my own argument here involves a rejection of the conventional “italics must be more cursive” dogma, something that even leads to people making so-called “upright italics” and thinking they can get away with <cite>that</cite>.</p>
      <p>&gt; But if it’s not acceptable in the cheapest paperback book<br>
      &gt; then it shouldn’t be acceptable on a $300 device - no?</p>
      <p>You don’t know that it’s not acceptable. It would be interesting here to check for any negative reader reactions around the turn of the 20th century, when ATF was churning out mechanically-slanted Romans in place of real Italics (“thanks” to the pantograph).</p>
      <p>hhp</p>
