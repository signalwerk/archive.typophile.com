      <p>First symbol is more fitting for a photography business (due to crop/frame bracketing). Also the arrow contraption looks forced. Furthermore I'm not sure why arrows meet off-center and why they form a loop. I guess, basically, I'd like to echo James' question - what's the rationale behind the symbol?</p>
      <p>Second symbol is just a knitting machine of some sort, sorry.</p>
