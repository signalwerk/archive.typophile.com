    <p>Hi folks,</p>
    <p>My academic unit wants to rebrand and as a consequence is working on a new logo.  I am a documentary filmmaker and have worked on logo designs in the past but am no expert.  before i share my opinions with my colleagues and the graphic artist, I would love your input.  Our department offers a BA and MA  in communication with concentrations in rhetoric, speech communication, health communication, media studies and production.  Thank you so much!</p>
