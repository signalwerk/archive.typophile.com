    html: |-
      <p>I am a big fan of Hipgnosis' work (Storm Thorgerson, George Hardie, et al) -- in addition to Pink Floyd, they also did Led Zeppelin's covers. The LZ logo seen starting with the album "Houses of the Holy" was based on <a href="http://www.myfonts.com/fonts/itc/rennie-mackintosh/" target="_blank" rel="nofollow">lettering by Charles Rennie Mackintosh</a>. But just as with Pink Floyd, you didn't usually see too much text on their covers.</p>
      <p>The AC/DC logo was drawn by <a href="http://www.gerardhuerta.com/" target="_blank" rel="nofollow">Gerard Huerta</a> (info from the man himself <a href="http://typophile.com/node/20336" target="_blank" rel="nofollow">here</a>).</p>
    html_clean: |-
