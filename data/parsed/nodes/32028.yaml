      <p>Well the thing is, I am not trying to completely mimic or copy a album logo, so I didn't write any bands down specifically. I'm trying to have maybe a typeface with similar qualities, or something else unique that someone could suggest.</p>
      <p>I will lists some bands I have been looking at. A lot of their logos are modified type, so its hard to tell what they are.</p>
      <p>Pink Floyd<br>
      Led Zeppelin<br>
      Rolling Stones<br>
      Twisted Sister<br>
      The Who<br>
      Aerosmith<br>
      The Doors<br>
      Kiss ** I am leaning toward a type similar to this.<br>
      ACDC ** This gothic look is also interesting.<br>
      Guns n Roses<br>
      Van Halen<br>
      The Eagles</p>
