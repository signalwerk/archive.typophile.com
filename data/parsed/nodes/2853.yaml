    html: <p>You know, the Riverfront can be pretty fun. There's a lot of crappy tourist-style souvenir stands, but there are also some pretty good reaturants &amp; shops &amp; such. Plus, having reloacted to the landlocked Midwest, the stink of ocean air makes me swoon. <br> <br>When I was wee, my parents used to drag me around to all the quasi-historical re-enactment stuff. Savannah has some of that, too - perhaps there's an old-timey letterpress shop somewhere.</p>
