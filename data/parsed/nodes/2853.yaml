    html: <p>I've always enjoyed walking down the Riverfront with a plastic cup of beer. Mostly because it's fun to drink in public with impunity. The Riverfront also used to have great breakdancing. It's been a while since I've been there though. <br> <br>Valdosta, Georgia has the best all-you-can-eat fried catfish and hushpuppy dinner known to man. Unfortunately it's about 3 hours from Savannah.</p>
