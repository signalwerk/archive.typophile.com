  html: |-
    <p>My friend sent me <a class="freelinking external" href="http://www.princeton.edu/main/news/archive/S28/82/93O80/index.xml?section=topstories" rel="nofollow">this</a> article about a study where students who "[reviewed] material in hard-to-read fonts did better on regular classroom assessment tests than did their randomly selected counterparts reading the same material in easier fonts".</p>
    <p>Sort of interesting. But I'm sure we'll question the generalizability and their definitions of easy-to-read and hard-to-read fonts.</p>
