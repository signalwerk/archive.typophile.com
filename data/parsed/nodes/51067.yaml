      <p>It's likely that the white line through the letters was added later, and is not part of the font. You could use a number of Techno fonts, such as <a class="freelinking external" href="http://www.myfonts.com/fonts/bitstream/space/" rel="nofollow">Space</a> just by slanting the letters and adding the white line.</p>
      <p>- Mike Yanega</p>
