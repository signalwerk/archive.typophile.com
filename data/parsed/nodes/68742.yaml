    html: |-
      <p>Kevin: <em>With the older versions of ClearType every glyph had to start and end on a full pixel boundary which limits how well the spacing between letters can be controlled.</em></p>
      <p>I would rephrase that. In terms of <em>control,</em> full pixel spacing actually provided more control via hinted widths than typical subpixel positioning does. What subpixel positioning enables is closer overall fidelity to natural glyph spacing -- just as ClearType outline rendering provides closer overall fidelity to natural glyph shape -- through increased x-direction resolution. The argument for sub-pixel positioning is really that it reduces the need for the kind of control required in full-pixel spacing environments (which CT without sub-pixel spacing simply broke). The lesson here is that however you render shapes should also be the way you render spacing, and I'm glad MS is finally doing this.</p>
      <p>The fact that Verdana and Georgia, typefaces that was designed and hinted for both full-pixel shape rendering and full-pixel shaping, continue to look better and seem to be more readable in CT with sub-pixel positioning than most other fonts should provoke one of those moments in which we all think carefully.</p>
