      <p>That's really cool, thanks Kevin! (first time I've not felt the need to take pain killers;). </p>
      <p>What's odd about your presentation's content, from (Dawn and the Differentiations, almost to the end), is the insistence of You and the Researchers, on telling the subject, (and the audience) — what they should think of the options, and then reinforcement of the "good" answers, e.g. "...and there was one crazy person who liked the document on the left" —&nbsp;Kevin. Was that 1 Crazy Person the author of the 2000 document on Al Queda? I.E. is there no document for any purpose that should have the form of the document on the left? Then, the Corsiva vs. Times... whew! I'd like to suggest a differentiation study between Corsiva and Times Italic, first;)</p>
      <p>The big thing is, that there is not enough separation in design between the fonts being tested, relative to the differentiation being suggested. And then, there is too much difference between the "good" and "bad" documents being suggested, with insufficient context. </p>
      <p>Cheers!</p>
