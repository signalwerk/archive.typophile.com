    <p>The <a href="http://live.visitmix.com/" title="Generic Mix site (will change from year to year)" rel="nofollow">Microsoft Mix10 conference</a> that took place last week featured two presentations on typography (with videos and slides in various downloadable formats, including MP4):</p>
    <ol>
    <li><a href="http://live.visitmix.com/MIX10/Sessions/DS15" title="The Type We Want" rel="nofollow">Jonathan Snook on Web typography</a>. (Fun drinking game! Down a shot of cranberry juice or moral equivalent at every repeated mispronunciation, including “sã serif,” OS “eks,” and that old standby, “Hohfler.”)</li>
    <li><a href="http://live.visitmix.com/MIX10/Sessions/DS07" title="The Art, Technology and Science of Reading" rel="nofollow">Kevin Larson on onscreen reading.</a></li>
    </ol>
