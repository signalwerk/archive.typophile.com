    html: |-
      <p>&gt; What science was used to motivate the ClearType spacing work? What kind of algorithm is used in the implementation?</p>
      <p>The ClearType spacing work was done not long after the invention of ClearType (before I joined the team), but getting it into the operating system required a fundamental change to the graphics platform. With the older versions of ClearType every glyph had to start and end on a full pixel boundary which limits how well the spacing between letters can be controlled. If a glyph naturally wants to use 6.8 horizontal pixels of space, then that glyph will use 7 pixels of horizontal space. And most every glyph has some sort of rounding error. The new version, which we call sub-pixel positioned ClearType, allows us to start and end glyphs on fractional boundaries. A glyph that wants 6.8 pixels of space can have 6.83 pixels of space. DirectWrite is the new graphics platform that is allowing application to have sub-pixel positioned ClearType. Applications have to be written for DirectWrite as the older graphics engine (GDI) isn’t going away. Both Firefox and IE have announced plans to use DirectWrite in future versions.</p>
      <p>More info on DirectWrite:<br>
      <a href="http://blogs.msdn.com/e7/archive/2009/02/13/advances-in-typography-and-text-rendering-in-windows-7.aspx" title="http://blogs.msdn.com/e7/archive/2009/02/13/advances-in-typography-and-text-rendering-in-windows-7.aspx">http://blogs.msdn.com/e7/archive/2009/02/13/advances-in-typography-and-t...</a></p>
    html_clean: |-
