      <p>Now that I haven't looked at this thing for two weeks, I can see that B is weird in relation to the rest. Thank you Ben for the feedback. It's true that p and d are really off, due to the sharp curves that form from the stem. I seem to have trouble making them smoother like b and q with the x-height and width. And yes, the numerals are way, way off.</p>
      <p>I'll post a pdf when I update this over next week's weekend; I'll probably redraw this from scratch to reconsider things.</p>
