      <p>Thank you all for the feedback! Summer semester has started, so once again I have no time to update this as much as I would want to.</p>
      <p>Anyway, I'll critique myself:<br>
      1. vxy thin, add a little width to w<br>
      2. top of K looks too heavy<br>
      3. what's up with S?<br>
      4. UVW too narrow?<br>
      5. widths are not consistent, some look a bit heavy than the others. for example, B, w, x, etc<br>
      6. make this monolinear, I don't think the width differences work on this. I don't know.<br>
      7. g looks weak, as is j and a<br>
      8. proportions are really off</p>
