      <p>I like the idea, but I think the tail of the "y" is a little too short.<br>
      Also the a curve (at top) is a bit too "open" and you could try to make the K and k merged instead of a horizontal line between the two parts.<br>
      I think you'd better use dots or (unrotated) squares instead of the shapes you now have as points.</p>
      <p>Keep up the good work! ;)</p>
      <p>Kind regards,<br>
      Martijn van Berkel</p>
