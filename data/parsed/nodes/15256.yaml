    date: 2007-12-07T11:30:00
    date_raw: 7 Dec 2007 — 11:30am
    votes: null
    html: "<p>Contains Cyrillic and Greek characters. There are two versions of the typeface which are included in the package: Oz Cooper's original design, which opts out of swashbuckling for a number of characters, and a modified version, where all but the S have swashes added. The original design is based on Barnhardt Brother's original casting of the Cooper Black Italic, with supplementary research done at the Newberry Library in Chicago (which houses Oz's archive of lettering and correspondence) for inspiration. Scans of Oz's hand lettering were analyzed to provide the structural basis for the custom version.</p>"
