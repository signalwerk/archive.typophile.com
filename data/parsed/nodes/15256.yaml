  html: |-
    <p>I'm using a nice bit of <a href="/wiki/Cooper%20Black" class="freelinking" rel="nofollow">Cooper Black</a> Italic for some labelling, and I'm after some alternate swash characters, and some general swash ornaments to go with it. </p>
    <p>I have a vague feeling that I saw some swash capitals at least in a very early copy of <a href="/wiki/uandlc" class="freelinking" rel="nofollow">U&amp;lc</a>. However I can't seem to find any digitised version of the font with anything like this. Can anyone confirm or deny this hunch? Am willing to swap to Goudy Heavyface if need be.</p>
    <p>It seems like a very obvious extension of such a popular font, so I can't believe it hasn't been done before. If i had more time i'd start on my own version immediately...</p>
    <p>Thanks for any leads.</p>
    <p>Toby</p>
