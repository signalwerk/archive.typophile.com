      <p>A severe case of "cutting edge logo": <a href="http://cuttingedgelogos.tumblr.com/" title="http://cuttingedgelogos.tumblr.com/">http://cuttingedgelogos.tumblr.com/</a><br>
      The better known professional typeface in this style is Cocon (<a href="http://www.fontshop.com/families/ff-cocon" title="http://www.fontshop.com/families/ff-cocon">http://www.fontshop.com/families/ff-cocon</a>) (others: <a href="http://www.fontshop.com/people/stephen-coles/fontlists/soft-sans-curve-to-corner" title="http://www.fontshop.com/people/stephen-coles/fontlists/soft-sans-curve-to-corner">http://www.fontshop.com/people/stephen-coles/fontlists/soft-sans-curve-t...</a>).<br>
      The most commonly see free font is Harabara (AKA mangled Helvetica Neue).</p>
