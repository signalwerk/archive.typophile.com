    html: |-
      <p>There is a limit to the number of kerning pairs allowed in an old style kern table. If an OpenType kern feature is expanded to an old style kern table, this limit can easily be exceeded. So, to prevent this from happening, when the system creates an old style kern table on-the-fly from an OT kern feature, it must limit the number of pairs.</p>
      <p>One of the big advantages to using OpenType class kerning is that you can kern many more glyph combinations than were possible with the older kern tables.</p>
      <p>[edited to fix spelling error]</p>
