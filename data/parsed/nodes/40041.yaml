  html: <p>Is there any reason when creating an OpenType font to convert OpenType [kern] feature to "plain" kerning data? Is this only an option to be used when converting OpenType fonts to standard Postscript or TrueType fonts. Would the kerning data if converted to "plain" still work in the final exported OpenType font if the OT kern feature was removed?</p>
