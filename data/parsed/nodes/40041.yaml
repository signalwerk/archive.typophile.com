      <p>Today I upgraded from fontlab 4.5 to 5, but I hadn't really done any more testing to my font yet. Then I did what twardoch recommended. "...edit the "kern" feature in the OpenType panel. You can explicitly convert your class-based FontLab kerning into the "kern" feature in the OpenType panel flyout menu, "Generate kern feature". If you don't do that and the option "Generate "kern" feature if it is not defined" is enabled, then FLS will generate the "kern" feature when generating the font." It asked me if I wanted to rebuild it, and I clicked yes. That fixed all my kerning problems. It looks perfect in textedit now. I haven't tested it in Word yet but my version of word is old anyway and may not be opentype savvy. But hopefully that's fine too. I'll report back on that soon.</p>
      <p>I highly recommend anyone with kerning issues to try this if they haven't.</p>
      <p>THANX AGAIN TWARDOCH!</p>
