      <p>Something to consider is the fact that, even though FontLab lets you do it, the old-style kerning table is not officially part of the spec for OT CFF fonts. So, it may not work. It is supported for the TTF flavor of OT fonts. </p>
      <p>FWIW, kerning in OT CFF fonts <em>is</em> supported in non-OT savvy apps. They just don't get every possible pair. The system creates an old-style kerning table for the apps to use based on a subset of the pairs that would be possible using the OT kern feature.</p>
