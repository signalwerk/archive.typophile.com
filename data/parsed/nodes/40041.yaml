      <p>Ps. I wrote: "For PostScript-flavored OpenType fonts, the operating system takes the GPOS-table (OpenType) kerning, extracts the kerning pairs for the Western codepage only, and produces a virtual kern-table kerning on the fly." </p>
      <p>Note that this is only true if the GPOS kerning in the font is built to certain standards (one lookup of type 2). GPOS kerning may employ other techniques as well (multiple lookups, extension lookup type 9 that allows to overcome the subtable size limitation without using subtable breaks, contextual kerning) — but if your font uses any of these, the virtual kerning conversion done by the system will no longer work, so non-OpenType applications will have no kerning, not even for Western glyphs. In such case, placing the kern-table kerning may be the only solution as well. </p>
      <p>But still, keep in mind that the OpenType specification states:<br>
      "OpenType fonts containing CFF outlines are not supported by the 'kern' table and must use the 'GPOS' OpenType Layout table."*<br>
      <a href="http://www.microsoft.com/OpenType/OTSpec/kern.htm" title="http://www.microsoft.com/OpenType/OTSpec/kern.htm">http://www.microsoft.com/OpenType/OTSpec/kern.htm</a></p>
      <p>The spec does not say that the kern table must not be present in an OpenType PS font, nor does it state that OpenType PS fonts must use only the GPOS kerning. But it says that OpenType PS fonts with kern-table kerning are not "supported" by OpenType, whatever that means. </p>
      <p>A.</p>
