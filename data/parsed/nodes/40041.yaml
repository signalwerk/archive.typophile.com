      <p>For TrueType-flavored OpenType fonts, if your font only has "GPOS-table" (OpenType) kerning, you will get zero kerning in applications that don't support GPOS kerning but only support "kern-table" (non-OpenType) kerning. Incidentally, Microsoft Office 2007 for Windows only supports kern-table kerning but the new default fonts it ships with (such as Calibri, Cambria, Constantia, Corbel, Candara) only include GPOS-table kerning. Result? No kerning at all. I'm still trying to figure out why Microsoft did here what they did. So if you make an OpenType TT font with just GPOS-table kerning, there will be no kerning at all in applications that don't support OpenType Layout. </p>
      <p>For PostScript-flavored OpenType fonts, the operating system takes the GPOS-table (OpenType) kerning, extracts the kerning pairs for the Western codepage only, and produces a virtual kern-table kerning on the fly. So if you make an OpenType PS font with just GPOS-table kerning, there will be kerning in non-OpenType applications but only for Western codepage characters. Cyrillic, Greek or Extended Latin characters will have no kerning at all in those apps. However, if you include kern-table kerning as well, you will get kerning for the non-Western characters at least in some apps. The kern-table kerning is not officially supported by the OpenType specification, but I don't know of any situation where it would actually break anything (the principle behind the OpenType font format is that you can put whatever table you want into the font, and applications must ignore the tables they cannot process). </p>
      <p>Regards,<br>
      Adam Twardoch</p>
