    html: |-
      <p>The internal limit of the OpenType font format is that no more than 10,920 kerning pairs can fit into one subtable within the "kern" table (and most font engines only support one subtable). </p>
      <p>But there are some old Windows GDI-based applications (which still were largely used when the OTF font driver was developed 12 years ago for Windows 2000) which had a smaller limit. </p>
      <p>Today, I'd say the practical limit for the "kern" table is indeed 10,920. </p>
      <p>Best,<br>
      Adam</p>
