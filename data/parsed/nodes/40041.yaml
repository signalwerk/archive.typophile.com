      <p>Assuming the conversion is of your own work...<br>
      You need to expand the kerning - Tools &gt; Kerning Assistance &gt; Expand.<br>
      After pressing this, you have some options, many of which depend on your situation and hopes for the font. Also under Preferences &gt; Generating OpenType &amp; True Type &gt; Kerning, be sure to uncheck "Generate OpenType Kern feature etc." and check "Export old-style non-OpenType etc." </p>
      <p>As for the issue with Preview, I wouldn't worry about it too much. The best plan is to test kerning with various apps.</p>
    html_clean: |-
