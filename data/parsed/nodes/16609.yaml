    <div class="info">Submitted by <a href="/web/20081014000609/http://typophile.com/user/7006" title="View user profile.">paul d hunt</a> : 5.Dec.2005 7.40am </div>
      <p>P22 and the International House Of Fonts announce the release of several new script fonts from Ray Cruz, Michael Clark and James Grieshaber.</p>
    <p>Cruz Script Set </p>
    <p>IHOF is pleased to introduce and welcome graphic artist, consultant and custom lettering designer Ray Cruz on-board. Ray has received over 30 graphic and type awards from the TDC, AIGA, and ADC and other art associations. The Cruz Script Set features three script fonts in three different styles (Ballpoint pen, Brush and Calligraphic pen) plus a font of companion ornaments in the same three styles. The three alphabet fonts are available in optional OpenType format for a more natural effect with automatic character substitution and ligatures. </p>
    <p><a href="https://web.archive.org/web/20081014000609/http://www.p22.com/ihof/cruzscriptspro.html" title="http://www.p22.com/ihof/cruzscriptspro.html">http://www.p22.com/ihof/cruzscriptspro.html</a></p>
    <p>Sweepy</p>
    <p>Lettering artist Michael Clark brings us his newest design, Sweepy. It is based on his popular “Pooper Black” but it is lighter and has connecting letters. Sweepy is a brush script that is casual and fluid. The expanded OpenType version is loaded with alternate characters and ligatures that offer more flexible lettering options.</p>
