  html: |-
    <p>Would someone give me their opinion about this typeface?   <a href="http://www.myfonts.com/fonts/s-core/core-sans-n/" title="http://www.myfonts.com/fonts/s-core/core-sans-n/">http://www.myfonts.com/fonts/s-core/core-sans-n/</a></p>
    <p>The description says "ne0-grotesque" but to me it feels a lot like Frutiger of Myriad, except for a few characters like the 'y.'   A few of the terminals are almost vertical, but most end at a bit of an angle, especially in the heavier weights.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/temp_3548.jpg"></div><p></p>
