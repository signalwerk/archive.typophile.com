    html: |-
      <p>For those who "just want TTX 2.3" on windows, I compiled a version using the above recipe (setup.py build/install + <a href="http://typophile.com/node/67406#comment-407219" title="http://typophile.com/node/67406#comment-407219">http://typophile.com/node/67406#comment-407219</a> instructions) and placed it online at <a href="http://pomax.nihongoresources.com/downloads/TTX%202.3%20-%20win32.ZIP" title="http://pomax.nihongoresources.com/downloads/TTX%202.3%20-%20win32.ZIP">http://pomax.nihongoresources.com/downloads/TTX%202.3%20-%20win32.ZIP</a> (8.2MB).</p>
      <p>This version of TTX was build on a windows 7, using the 32 bit versions of python 2.7 and py2exe (there was no real point in compiling a 64 bit version, because nothing TTX does really benefits from 64 bit instructions)</p>
      <p>No installer, just unpack to your "Program Files" (on win32) or "Program Files (x86)" (on win64) and done. To then also use it from anywhere and everywhere, simply extend your system's PATH variable (control panel -&gt; system -&gt; advanced system settings -&gt; environment variables -&gt; system variables, "PATH" variable) to include "C:\Program Files (x86)\TTX" (the exact drive and folder depends on where you unpack it to, of course)</p>
