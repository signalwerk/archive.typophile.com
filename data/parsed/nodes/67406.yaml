      <p>All I can access right now is my MacBook Pro with OS X 10.5; I use python2.5.1 (as /usr/bin/python). I just downloaded ttx 2.3. In a Terminal window, in the folder fonttools-2.3, I typed <code>setup.py --help</code> to get the required help and did what I was told to do.<br>
