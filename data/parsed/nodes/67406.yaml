    html: |-
      <p>Thanks to a lot of the comments here I managed to install TTX 2.3 on Windows.<br>
      Here's my suggestion for updated instructions on the README.txt file:</p>
      <p>APPROACH I: Using py2exe and InnoSetup</p>
      <p>1. Install Python 2.7 for Windows: <a href="http://www.python.org/" title="http://www.python.org/">http://www.python.org/</a><br>
      2. Install py2exe: <a href="http://starship.python.net/crew/theller/py2exe/" title="http://starship.python.net/crew/theller/py2exe/">http://starship.python.net/crew/theller/py2exe/</a><br>
      3. Install NumPy <a href="http://numpy.scipy.org/" title="http://numpy.scipy.org/">http://numpy.scipy.org/</a><br>
      4. Install InnoSetup 5: <a href="http://www.jrsoftware.org/" title="http://www.jrsoftware.org/">http://www.jrsoftware.org/</a><br>
      5. Download the latest released source code of TTX/FontTools at<br>
         <a href="http://sourceforge.net/projects/fonttools/" title="http://sourceforge.net/projects/fonttools/">http://sourceforge.net/projects/fonttools/</a><br>
         Or alternatively grab the sources from SVN:<br>
         <a href="http://fonttools.sourceforge.net/" title="http://fonttools.sourceforge.net/">http://fonttools.sourceforge.net/</a><br>
      5. Unzip the source code of TTX/FontTools into a folder.<br>
      6. In the folder where you unzipped TTX/FontTools, edit setup.py and add:<br>
         console = ["Tools/ttx"],<br>
         right after this line:<br>
         scripts = ["Tools/ttx"],<br>
      7. In the folder where you unzipped TTX/FontTools, type:<br>
         python setup.py build<br>
         python setup.py install<br>
         python setup.py py2exe --packages encodings<br>
      8. Run Inno Setup and open Windows\fonttools-win-setup.iss<br>
      9. In Inno Setup:<br>
         Edit the line:<br>
         Source: ..\dist\ttx\*.*;<br>
         to<br>
         Source: ..\dist\*.*;<br>
         And delete the line:<br>
         Source: ..\Doc\bugs.txt; DestDir: {app}; Flags: ignoreversion promptifolder<br>
      10. In Inno Setup, hit Build &gt; Compile, then Run &gt; Run.</p>
      <p>The distributable TTX Windows setup executable has been saved<br>
      in the Output subfolder of the FontTools\Windows folder.</p>
