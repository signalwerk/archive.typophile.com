    <p><a href="http://sourceforge.net/projects/fonttools/files/" title="http://sourceforge.net/projects/fonttools/files/">http://sourceforge.net/projects/fonttools/files/</a></p>
    <p>Would anybody explain, how to build WinTTX2.3.exe? I have produced a total chaos in the last two hours. I don’t know, if I have damaged anything now. Adam Twardoch’s (?) instructions, contained in fonttools-2.3.tar.gz instructions don’t seem to be up to date.</p>
    <p>If anybody has prebuilt installers, I am likewise interested. Independent from the question, if anybody can help me to build installers by myself.</p>
    <p>Why don’t the developers provide installers for each version?</p>
    <p>I have installed the following now:<br>
    Python 2.3<br>
    Python 2.3 Numeric-24.2 (I was asked for that during my attempts to build the installer. A version was not specified, but I had on my harddisc, because I needed it already for anything before.)<br>
    Python 2.3 py2exe-0.6.9<br>
    Inno Setup Compiler 5.3.7 (u)</p>
    <p>And these are the instructions:</p>
    <p>Pre-compiled versions are hosted at <a href="http://www.font.org/software/ttx/" title="http://www.font.org/software/ttx/">http://www.font.org/software/ttx/</a></p>
    <p>APPROACH I: Using py2exe and InnoSetup</p>
    <p>1. Install Python 2.3 for Windows: <a href="http://www.python.org/" title="http://www.python.org/">http://www.python.org/</a><br>
    2. Install py2exe: <a href="http://starship.python.net/crew/theller/py2exe/" title="http://starship.python.net/crew/theller/py2exe/">http://starship.python.net/crew/theller/py2exe/</a><br>
    3. Install InnoSetup 4: <a href="http://www.jrsoftware.org/" title="http://www.jrsoftware.org/">http://www.jrsoftware.org/</a><br>
    4. Download the latest released source code of TTX/FontTools at<br>
       <a href="http://sourceforge.net/projects/fonttools/" title="http://sourceforge.net/projects/fonttools/">http://sourceforge.net/projects/fonttools/</a><br>
       Or alternatively grab the sources from SVN:<br>
       <a href="http://fonttools.sourceforge.net/" title="http://fonttools.sourceforge.net/">http://fonttools.sourceforge.net/</a><br>
    5. Unzip the source code of TTX/FontTools into a folder.<br>
    6. In the folder where you unzipped TTX/FontTools, type:<br>
       python setup.py py2exe -f --icon Windows\ttx.ico --packages encodings<br>
    7. Run Inno Setup and open Windows\fonttools-win-setup.iss<br>
    8. In Inno Setup, select File/Compile, then Run/Run.</p>
    <p>APPROACH II: Using McMillan Installer and InnoSetup</p>
    <p>1. Install Python 2.3 for Windows: <a href="http://www.python.org/" title="http://www.python.org/">http://www.python.org/</a><br>
    2. Download and unpack McMillan installer:<br>
       <a href="http://py.vaults.ca/apyllo2.py/22208368" title="http://py.vaults.ca/apyllo2.py/22208368">http://py.vaults.ca/apyllo2.py/22208368</a><br>
       and put the Installer folder into your Python folder,<br>
       e.g. C:\Python23\Installer<br>
    3. Install InnoSetup 4: <a href="http://www.jrsoftware.org/" title="http://www.jrsoftware.org/">http://www.jrsoftware.org/</a><br>
    4. Install Microsoft Visual C++ Toolkit 2003:<br>
       <a href="http://msdn.microsoft.com/visualc/vctoolkit2003/" title="http://msdn.microsoft.com/visualc/vctoolkit2003/">http://msdn.microsoft.com/visualc/vctoolkit2003/</a><br>
    5. Put UPX somewhere within your PATH: <a href="http://upx.sourceforge.net/" title="http://upx.sourceforge.net/">http://upx.sourceforge.net/</a><br>
    6. Download the latest released source code of TTX/FontTools at<br>
       <a href="http://sourceforge.net/projects/fonttools/" title="http://sourceforge.net/projects/fonttools/">http://sourceforge.net/projects/fonttools/</a><br>
       Or alternatively grab the sources from SVN:<br>
       <a href="http://fonttools.sourceforge.net/" title="http://fonttools.sourceforge.net/">http://fonttools.sourceforge.net/</a><br>
    7. Unzip the source code of TTX/FontTools into a folder.<br>
    8. In the folder where you unzipped TTX/FontTools, type:<br>
       python setup.py install -f<br>
    9. Edit mcmillan.bat so the paths in the file correspond to the paths in your system,<br>
       and run it.<br>
    10.Run Inno Setup and open Windows\fonttools-win-setup.iss<br>
    11.In Inno Setup, select File/Compile, then Run/Run.</p>
    <p>The distributable TTX Windows setup executable has been saved<br>
    in the Output subfolder of the FontTools\Windows folder.</p>
