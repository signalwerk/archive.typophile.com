    html: |-
      <p><cite>When I type "sudo setup.py install" in Terminal, I got the error "sudo: setup.py: command not found"</cite></p>
      <p>To know if python is installed and where, you can just type <code>which python</code> in the terminal window. If you type <code>python -V</code> you will be told the version. I am on OS X 10.5.8 on my PowerBook Pro and the installation was almost immediate. If <strong><code>.</code></strong> (the current directory) is not in your path, then <code>sudo setup.py install</code> will not work and give you exactly the message you got because the exectutable <code>setup.py</code> will not be in your path and thus will not be found. You then need to type</p>
      <p><code>./setup.py build<br>
      sudo ./setup.py install</code></p>
      <p>Now, if <code>/usr/local/bin</code> is not in your path and before the FDK path, then when typing <code>ttx</code> in the terminal window, you will still get the old FDK ttx. To see your path, type</p>
      <p><code>echo $PATH</code></p>
      <p>in a terminal window. That gives you a list of folders where executables are to be searched. If <code>/usr/local/bin</code> is not in the : separated list, and before the folder <code>/Users ... /FDK/Tools/osx</code>, then maybe the best thing to do is then to type</p>
      <p><code>open build</code></p>
      <p>which will open the build folder; then double click on the <code>scripts-2.5</code> folder, rename <code>ttx</code> to <code>ttx2.3</code> and move that file into your FDK  executables folder. After that, typing <code>ttx2.3</code> in a terminal window will give you the new ttx.</p>
      <p>Michel</p>
