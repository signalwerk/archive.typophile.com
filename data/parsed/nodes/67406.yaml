      <p>Arno Enslin wrote:</p>
      <p>"It’s this command, that does not work:<br>
      python setup.py py2exe -f --icon Windows\ttx.ico --packages encodings</p>
      <p>error: -f not recognized"</p>
      <p>remove the -f and --icon option</p>
      <p>Then add the following to the setup.py file:</p>
      <p>console = ["tools/ttx"],</p>
      <p>you can add it after the existing line that reads</p>
      <p>scripts' = ["tools/ttx"],</p>
      <p>Without the "console = ..." line it won't create ttx.exe.   The console command is a py2exe command. The scripts command is just some python command evidently, not connected to py2exe which is the thing that actually creates a ttx command line executable.  You can use the "windows = " command instead of "console = "  to create a windows GUI .exe.</p>
      <p>Here's a list of option for py2exe:<br>
      <a href="http://www.py2exe.org/index.cgi/ListOfOptions" title="http://www.py2exe.org/index.cgi/ListOfOptions">http://www.py2exe.org/index.cgi/ListOfOptions</a></p>
      <p>There could be a lot of other extraneous things in that existing setup.py, but adding the "console = ..." line will create the executable.</p>
      <p>(Didn't really know anything about Python till a couple of hours ago though.)</p>
