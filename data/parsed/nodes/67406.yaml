      <p>@ Thomas</p>
      <p><cite>This is the kind of thing that makes me wish TTX were a commercial utility.</cite></p>
      <p>No. There are many OpenSource projects, that are better than commercial projects. But there is a TTX section on the FontLab forum. If more people would ask their questions there, more people could solve problems with TTX. And if there would be an installer and tutorials, more people would be interested in TTX. Making the start with TTX difficult by not updating installation informations, makes TTX inattractive. And as less interested people there are, as less people contribute to the project. And the consequence is, that many people don’t see, what a great tool TTX is. That’s unprofessional. I would prefer a TTX section on Typophile. Maybe we can open such a section here.</p>
      <p>For example it would be very cool, if we could integrate a comment function into TTX. Actually I am using a small search and replace tool, that comments the namerecords, but its extremely slow. It would be much more comfortable to either use a Python search and replace function or to put comments directly into the TTX file during the decompilation.</p>
      <p>And another example: TTX can extract the hexdata of all tables. If a table is unknown, it extracts the hexdata. If a table is known, it decompiles it. If you want to extract a known table, you have to rename or to remove the matching table-py- and pyc-files. This is uncomfortable, but probably it can easily be changed. Such hexdata can be merged into other fonts. They only must have the same glyph order. So TTX can be usefull, even if it is unable to decompile a table correctly. (TTX 2.3 trashes information contained in the featureParams tags of the GSUB-table, but don’t posts an error message.)</p>
      <p>(If you want to have a commercial tool, why don’t you buy OTMaster? In my opinion the price of OTMaster is much too high. DTL even wants to have 50 Euro for the update, although there was not much time between versions 1 and 2. But you have worked for Adobe and probably you have more money. I don’t need most of its functions, especially not the glyph editor. In case of OTMaster you cannot contribute.)</p>
      <p>Do you know, how I have learned CSS? I started to manipulate the skin of Firefox. (You can change almost everything in Firefox. And that is an OpenSource project, that is a thousand times better than the stupid Microsoft Internet Explorer. Microsoft has slowed down the development of websites. We had to live one decade with the MS shit, before Firefox came, because the dominance of MS did not motivate web designers to write clean code for a few users only, that use alternative browsers [or simply, browsers, but not the IE]. LATER I used my knowledge about CSS for websites. If the start with TTX would be easier, probably more people would be willing to learn Python and contribute to the Fonttools project.</p>
