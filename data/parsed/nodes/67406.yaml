      <p><em>I assumed the Mac *came* with Python</em></p>
      <p>It does. Could you have removed it perhaps? The "site packages" are usually in /Library/Python/[version]/site-packages/ and the actual Python frameworks in /System/Library/Frameworks/Python.framework/Versions/[version]. On 10.6 I have three versions there, 2.3 (which FontLab uses), 2.5 (carried over from Mac OS 10.5), and 2.6, which is the version shipped with Snow Leopard.</p>
      <p>I currently use ttx version 2.2 with Python 2.5, and I have successfully used it to »upgrade« fonts from OS/2 table version 3 to 4. So Adam's statement</p>
      <p><em>The current TTX 2.3 supports the OS/2 version 4 table.</em></p>
      <p>is probably true, but ttx 2.2 also seems to handle it :)</p>
