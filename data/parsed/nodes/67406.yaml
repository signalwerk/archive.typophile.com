    html: |-
      <p>Arno,</p>
      <p>please consider that opensource efforts such as TTX/FontTools are made by volunteers in their spare time. The concept of opensource is that any developer can, and is encouraged, to contribute. The software comes free of charge, as is. There is nobody who collects license fees, and there is nobody who gets paid for their work on the software.</p>
      <p>When I produced the build instructions for TTX/FontTools for Windows five or so years ago, I worked on Windows, so I had the time and possibility to research it, put it together and document it. The reason for me doing it was pretty much so that I can make a working build myself, for my own needs. And needless to say, I did it on a fully voluntary basis -- just like Just van Rossum put enormous time and effort to develop TTX/FontTools in the first place. </p>
      <p>Adobe's Read Roberts contributed some code to TTX/FontTools, and fortunately enough, Adobe FDK for OpenType includes a compiled version of TTX for Windows (as you point out, currently, it's the TTX 2.2 version). </p>
      <p>More than two years ago, I completely switched to Mac OS X, and unfortunately, I can no longer maintain build instructions for Windows. I simply don't have the necessary up-to-date software, nor a working Windows machine where I could do it. And I don't have the time. Plus, yes, the motivation of creating a working build MYSELF no longer applies. This is why I contacted Spire, asking him to contribute, since he did make a more updated build more recently. </p>
      <p>Anyone willing to contribute updated build instructions for TTX/FontTools for Windows is welcome to do so (or is welcome to find a Python for Windows developer who is willing to do it, and pay him). This is the key concept of opensource.</p>
      <p>Milton Friedman used to say "There is no such thing as a free lunch". If the lunch is said to be free, it may mean that you need to participate in cooking it.</p>
      <p>Though I can say, if someone writes a simple-to-follow set of instructions for building an executable version of TTX 2.3 for Windows under today's conditions, I can make sure that it gets incorporated into the official distributive. And I'll be happy to continue hosting the executable versions on font.org/software/ttx/ -- this is as much as I can do today. </p>
      <p>Best,<br>
      Adam</p>
