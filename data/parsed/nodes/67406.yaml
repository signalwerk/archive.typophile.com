      <p>Adam's instructions are out of date, and won't work anymore without substantial modifications.</p>
      <p>Several years ago I built a TTX executable for Windows and created an installer for it; even then, I needed to deviate significantly from Adam's instructions. Adam still has my build available for download <a href="http://www.font.org/software/ttx/" rel="nofollow">here</a>.</p>
      <p>It so happens that I recently got a request from Adam to help create an updated Windows build from the latest SVN sources, so I've been working on this in my very limited spare time in the past week or so.</p>
      <p>I've successfully built a working Windows TTX executable using the latest versions of Python 2.x, Numeric, and py2exe. As soon as time permits, I'll be packaging it up into an installer, similar to the one that I built several years ago.</p>
