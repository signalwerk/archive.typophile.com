    html: |-
      <p>I wanted to avoid installing another version of Python because of FontLab. And I prefer standalone versions of TTX, because I want to have all of them installed. I doubt, that I could install another version of FontTools parallel in the Python directory.</p>
      <p>So I have TTX 2.0b1 from the only actually available installer version, TTX 2.0b2 from the AFDKO 2.0_26, TTX 2.2 from the AFDKO 2.5_21898 and TTX 2.3 from FontTools 2.3.</p>
      <p>And I am using the same batch files (in different directories) for all versions except from one, in which the paths are set and that is called by the other batch files (because in the past I had to change the paths in all batch files.)</p>
      <p>For version 2.3:</p>
      <p>@echo off<br>
      set "FDK=C:\Python26\Lib\site-packages\FontTools\fontTools"<br>
      set "TTXcom=call %FDK%\ttx.py"<br>
      set "TTXhelpCom=%FDK%\ttx.py -h"</p>
      <p>For version 2.2:<br>
      @echo off<br>
      set "FDK=C:\FDK_25_21898\Tools\win"<br>
      set "TTXcom=call %FDK%\ttx"<br>
      set "TTXhelpCom=%FDK%\Python\Current\python.exe %FDK%\Python\Current\Scripts\ttx -h"</p>
