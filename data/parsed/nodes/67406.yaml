      <p>I was not able today to build an TTX installer, but at least I am able to use TTX 2.3 now.</p>
      <p>I have installed the following packages:<br>
      numpy-1.3.0-win32-superpack-python2.6.exe<br>
      py2exe-0.6.9.win32-py2.6.exe<br>
      python-2.6.4.msi</p>
      <p>And used this command from the fonttools-directory (in my case C:\fonttools-2.3):<br>
      C:\Python26\python.exe setup.py install</p>
      <p>And then I have deleted the fonttools directory, because I could start ttx either with ttx.py from a subfolder of the fonttools directory or from a subfolder of the Python directory, in which the fonttools (partly?) were copied during the install command.</p>
      <p>ttx.py -h is the help command of TTX (if the Python extension is registered). Just for the case, that someone is less competent than me and needs three days instead of two for something, that would need a few minutes only, if developers would be more interested in users (which are potential developers and bug-reporters).</p>
