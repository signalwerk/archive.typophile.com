    html: <p>"Sexta Feira" looks like the long lost Blippo Bold. The only digital version I know of is called "Graphics", from the Quick Brown Fox (formerly B &amp; P Graphics) <a href="http://www.qbf.de/dceng.htm">Designer Collection</a>. There may be other versions floating around, but I don't know about them. Most major foundries only have Blippo Black.</p>
