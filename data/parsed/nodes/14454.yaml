      <p>WOW! That original is NOT A LOGO. Horrible.<br>
      But back to topic.<br>
      I agree with Joe about the conjoined Ss. I guess for you it was just a ‘spielerei’ (playfull element). Am I right?<br>
      If I design a logo I start from the core business of the company. What do they do, how do they do that, what targetgroup are they aming at, etc. etc.<br>
      In your logo I miss the point. It doesn’t trigger me in any way to think what they could be doing. Joe’s idea is great, to make a single S, perhaps like an infinite sign (the horizontal 8). But I’m afraid that has nothing to do with the core business of your company. </p>
      <p>I’ve checked out the Santos Group website and I see the different projects they have. In that case I’d say it’s very important that you find a good typeface that you can use with ALL of these projects. You can transport the typography throughout the CI and it’ll be nicely consistent. But it needs to have a bunch of personality, if you ask me. Than you could even use it stand-alone, so without a sign/mark.</p>
      <p>This would be my approach for this logo. Ofcourse there are 1.000’s more, so you have to find your own way.</p>
      <p>For some impressions of logo’s that we’ve done and might fit to you, have a look at:<br>
      <a href="http://www.stoerebinken.nl">http://www.stoerebinken.nl</a>  &gt;  Portfolio  &gt;  Logo/Huisstijl  (InBase / Spierts Holding BV / Artefysia / Internet Cafe Kickx / 3Some / MicroMotive / NFG)</p>
      <p>Regards,<br>
      ®ené</p>
      <p>PS  What’s with the favicon? Is that a lion?</p>
