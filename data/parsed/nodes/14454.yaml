      <p>Hey all. Thanks for your comments. I have tried to implement some of the suggested changes into the Santos logo redesign. Here is what I have come up with so far. </p>
      <p><a href="http://www.cis.ksu.edu/~dolezal/santos_redesign_update.gif">http://www.cis.ksu.edu/~dolezal/santos_redesign_update.gif</a></p>
