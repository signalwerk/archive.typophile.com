    html: <p>Be careful with fine lines or gradients with a logo. Think of the end uses. If it will be used small or printed you will want a simple solution (Many typefaces have Inktraps that are designed to fill-in when printing). Develop you logo in black and white when it works at that basic level then explore color options.</p>
