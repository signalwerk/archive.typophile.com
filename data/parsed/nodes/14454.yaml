      <p>If the S in Santos also had some connection to computing it might be stronger… The infinity symbol as a hybrid S for example.</p>
      <p>I agree with Dan that you don’t want something that will only be understood by people at Santos, but I don’t agree that you should throw out a mark entirely.</p>
      <p>Showing a building as part of a corporate identity was very popular in the 1950s (in the US anyway) but it has become retro-cool recently. (See <a href="http://www.house-ind.com">House Industries</a>.)</p>
