    <p>Help. I’m frustrated. I work for a computer science group who builds model-checking software. I am in the process of redesigning their logo. I have attached a file that shows what their original logo was, and what I have done to redefine it. I need some help and/or feedback. The Santos group has several software projects, and they need one logo that will represent them all. The various individual projects include model-checking, software verification, and construction of high-confidence software systems…if that means anyone to the technical readers out there. I feel that I have improved on what they had before, but I think I can still go further. Let me know what you think.</p>
    <p>Thanks,<br>
    Ben</p>
