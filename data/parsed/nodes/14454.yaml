    html: "<p>Ben, I might do a few things: Loose the tilt o. Loose the abstract mark if you are going to consumers (they won’t get it, and you don’t want a logo to be an inside joke). Loosen up the letterspacing and under the name use “software verification” as a division (smaller) and the same your other diciplines, and color code each division. Color coding is not pracitical for print but for your web site it makes sense. In print you could use tints of a color, but make sure they are 20% differences. That is what the eye can see as different.</p>"
    html_clean: "<p>Ben, I might do a few things: Loose the tilt o. Loose the abstract mark if you are going to consumers (they won’t get it, and you don’t want a logo to be an inside joke). Loosen up the letterspacing and under the name use “software verification” as a division (smaller) and the same your other diciplines, and color code each division. Color coding is not pracitical for print but for your web site it makes sense. In print you could use tints of a color, but make sure they are 20% differences. That is what the eye can see as different.</p>"
