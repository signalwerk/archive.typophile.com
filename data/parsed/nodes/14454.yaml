      <p>Here’s an off-the-wall idea:  You could keep the mark (as it is, or more like an infinity sign) and break it with vertical lines to create a gradation.  Well, it would seem like a good idea, if it didn’t remind me of IBM.</p>
      <p>But if you want to convey the idea of software becoming complete, it could work, though something else to give it direction would help that along.  Something like an arrow could emphasize that the software (or whatever) on one side is making a transition and becoming complete on the other, rather than just being broken.  A simple triangle could do the same.</p>
    html_clean: |-
