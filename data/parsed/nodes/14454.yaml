      <p>I like the concept of the mark but I feel it’s missing some depth and has an awkward feel about the centre, you might do well to look at something like a <a href="http://www.mi.sanu.ac.yu/vismath/sequin/">moebius strip</a> which because you can travel both sides of it without lifting you finger has something of the examination process about it (I’m getting carried away here). Your strap line is going to fight a losing battle against print technology at smallish sizes you might need to go to two or three lines or abandon the justification and let ir run the full width of the logo and print it in black.<br>
      Tim</p>
