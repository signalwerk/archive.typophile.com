    html: <p>Thanks for all of the positive feedback. No, the logo doesn’t need the mark, but I felt it might be nice to create a symbol that would be easily recognized and associated with our group. The concept behind the mark is very abstract…much like the work we do at Santos. I chose the interlocking S for santos(not abstract), and broke it up to show how our model checker makes software complete (more abstract). I guess I need to really sit down and look at what we do here…which is difficult for me. I don’t think like a computer scientist; i think like an artist. (insert sigh)p.s.- the icon is a B, for Ben. :)</p>
