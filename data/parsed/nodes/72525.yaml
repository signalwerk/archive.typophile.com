      <p>Very interesting, thanks all!</p>
      <p>In the meantime, I have been able to find out that a (slightly different) digitisation of Times containing these alternate characters has been used by various scholarly journals, some of which are available online. The following screenshot is from one of those publications:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/timesdigital_4932.png"></div><br>
      Whereas the slant of the ‘g’ is less pronounced than in the pre-digital sample shown above, the ‘v’ seems to be virtually identical, doesn’t it?<br>
      &nbsp;<br>
      This journal typeface is embedded as ‘Adv-Times-i’, ‘AdvMacTim-i’ and the like, ‘Adv’ <a href="https://listserv.heanet.ie/cgi-bin/wa?A2=ind0103&amp;L=TYPO-L&amp;D=0&amp;P=41243" rel="nofollow">allegedly</a> being a prefix assigned by some Arbortext typesetting software. If anyone of you is technically capable of inspecting the copyright notice of such a font, try your luck <a href="http://www-users.york.ac.uk/~pf11/jphon06.pdf" rel="nofollow">here</a> — an article from one of the above-mentioned journals that happens to be publicly available as a PDF.<p></p>
