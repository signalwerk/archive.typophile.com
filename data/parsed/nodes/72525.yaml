      <p>Thank you very much for checking these specimen books! I probably wouldn’t have been able to access all of them myself.</p>
      <p>It doesn’t sound unlikely that the characters shown above have been influenced by ‘educational’ glyph shapes, although — if I remember correctly — a two-storey ‘a’ and a three-storey ‘g’ were used in the Roman text. And what is schoolbook-like about that italic ‘v’, slightly reminiscent of a Greek upsilon? Maybe it has to remain a mystery&nbsp;…</p>
