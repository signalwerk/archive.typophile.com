      <p>For typesetting mathematics, Monotype had a variant of Times with alternate v (to avoid confusion with greek nu). Here’s an example from the <em>Monotype Mathematical Sorts List</em> booklet they made:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/times_327_5978.png"></div><p></p>
      <p>There isn’t an alternate g, but Times 569 (the math variant used with the <a class="freelinking external" href="http://www.typeculture.com/academic_resource/articles_essays/pdfs/tc_article_47.pdf" rel="nofollow">4-line mathematics technology</a>) had both alternates:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/times_569_alternate_italic_g_v_4448.png"></div><p></p>
      <p>The slant is not the same as in your example, so it’s not that typeface, but given what your colophon indicated, it would be reasonable to think that Monotype had a variant of Times 327 with those alternate v and g.</p>
    html_clean: |-
