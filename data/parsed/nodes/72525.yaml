      <p>I looked in the McGrew book of American Metal Typefaces and nothing is shown for Times with these letter variants. Also checked Jaspert's Encyclopaedia, Phil's Photo type book, and A.T.A. Type Comparison Book. In the book "Typefaces for Books" by Sutton &amp; Bartam, they show Monotype and Linotype versions of Times New Roman. Both say "educational characters available". Thinking of Bembo Schoolbook, which uses a single storey 'g' in the Roman and Italic versions, and the fact that Morison was the one who directed the Bembo design for Monotype (according to McGrew), makes me wonder of perhaps that could explain these variants.</p>
      <p>- Mike Yanega</p>
