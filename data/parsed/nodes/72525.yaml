      <p>Thank you for visualising this! The letters in the sample I have provided in my topmost article are apparently better drawn than those in the digitisation. The disharmony you have pointed out is why the glyphs from the latter version have always looked somehow off-kilter to me.</p>
      <p>A tolerable two-storey ‘g’ for both upright and italic cuts can be found in versions of Times that come with phonetic symbols (see below for Times New Roman). The alternate ‘v’ doesn’t seem to be present, however:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/timesphonetic_4920.png"></div><br>
      P.S.: The copyright notice is not particularly informative, is it?<p></p>
