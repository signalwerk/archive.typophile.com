    html: |-
      <p>Nathanael,</p>
      <p>I looked at the gif embedded in the thread, showing the s in context. It's just light. In the overall context, the change you've made is infinitesimal and barely perceptible. look at that gif and how heavy the 2 i's look on either side. </p>
      <p>The top and bottom of s are also the lightest features, tapering off to 'hairline' thickness where everything else has either a flared stroke terminal or a horizontal feature. So the s looks like it is too short/small, and it also is lighter overall than the others. This is an example of the trickery necessary to get straight, flaring strokes to look visually the same weight as bowls. They can't all be the same weight in the middle. </p>
      <p>The s is also one of the narrowest shapes in the lot, making it look that much smaller. Your r has this problem too, but it also has a standard flaring vertical stem. In any size less than display, I could see the r turning into an i. </p>
      <p>The wide range of widths or proportions can be toyed with in display fonts, but you'll find as you try to use this, that text faces have a narrower range of proportion that still allows reading to occur smoothly. </p>
      <p>You haven't said what this design is intended for. It's very interesting, as is your other work, but did you have a brief or purpose in mind? </p>
      <p>In overall style, I think some things need to be more related: the exaggerated eyes of g, high waist of k, narrow s and r and some of the tapers lean in a comical, display direction. But the eyes of a and e, which are central shapes to a Latin design, are more conventional and sensible, as are the simple, classic proportions of h, p, o, i, B and W. So there's a dilemma: Make it all more goofy, or all more sensible and conventional? A brief might help with this.</p>
