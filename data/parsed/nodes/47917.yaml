      <p>It only took me the better part of a year, but I got around to making the text version of Solvejg. I haven't started the display version, but when I find the time it shouldn't take too long, since it'll be pretty close to what I had before. Meanwhile, I wonder what everyone thinks of Solvejg Text. I've attached a new pdf up above (NewSolvejgText.pdf).</p>
      <p>Things I've changed: I made all the hairlines sturdier. I widened the S and s distinctly (they look good to me now, but I welcome criticisms, of course). I lengthened the beak of the r, and made the top bowl of the g a little taller. In the italic I fixed some imbalance I was sensing on the bottom of the g. I also fixed various little things that I didn't commit to memory.</p>
      <p>Hope you like it!</p>
