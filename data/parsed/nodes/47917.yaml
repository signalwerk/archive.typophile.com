      <p>Huh. I think the (Roman) "g" is beautiful, and central to the charming feel of the font. I'd definitely keep that.</p>
      <p>Really nice work! Great to see you're still working on it. The Roman makes me want to use it for a children's book with great illustrations. I'm not quite as convinced about the angularity and heightened contrast of the Italic (especially in the "g" actually), it's a strange way of contrasting with the Roman, but not sure what to suggest. :-\</p>
      <p>A couple of details:<br>
      - I agree with Craig about making the "s" a bit looser, so it doesn't get swallowed up too much.<br>
      - Overall, the spacing seems not bad but is still rather uneven.<br>
      - I also wonder about the Roman "e" – maybe it's a bit deflated/lazy/soft too (compared to the angularity of the "a")? But maybe there's something I'm not getting.<br>
      - And your c-cedilla isn't merged (white overlap visible).</p>
      <p>Keep it up! Looking forward to this.</p>
