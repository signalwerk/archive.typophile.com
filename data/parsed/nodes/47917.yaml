      <p>Hi again everyone!</p>
      <p>What a long design process. I think I'm finally just about done with the pixel pushing. Here, in SolvejgInMay.pdf at the top, is the latest in my efforts to make Solvejg happen. A new weight, and a slight refiguring of the old Display weight to make it finer and more Displayey. I'm anxious to get this font <cite>finished</cite>, but I do want some eyes besides mine to see it before I start negotiations, so I turn to you, Typophiles. How do you like it? Is there stuff that I should fix? Do you want the old bold weight to still be available? Let me know any thoughts you have.</p>
      <p>Thanks!</p>
      <p>Edit: Also, I'm not sure what happened to the math symbols in the Text Italic. I'll fix that at some point. The Display Italic might have the same issue but I didn't put its math symbols in the sample originally because they were the same as the Roman's.</p>
