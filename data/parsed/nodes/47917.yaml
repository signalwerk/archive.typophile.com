      <p>It's sort of the same reason that they don't make helicopter cars. They could, but if the thing had to both fly and drive, it wouldn't be that great at either one. If I wanted a display face and a text face in one, it wouldn't be that great at either job. </p>
      <p>But that's not to say that the text face will have no character. I'm retaining as much as I can without making it distracting. (I've started working on it, but other things have kept me away.)</p>
