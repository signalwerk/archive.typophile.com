    html: |-
      <p>I don't have any specific use in particular in mind so far--when I draw fonts, I tend to just come up with an idea and then sketch it out, thinking about the letters themselves rather than the future of the font. That's somewhat a poor way to approach the font, and it's resulted in some far-reaching changes in the past. In my sketches of Newt, the ascenders are impractically high. Most of the fonts I've designed are serif text faces, and such is the case with both the other ones I've put up here (Cyril and Newt), so I've never really had the problem of unclear purpose before.</p>
      <p>I think I want to make Solvejg usable for somewhat long text. I'm realizing that it might be a good idea to make a display version of it and a milder text version. But, I think I will make the g, k, s, and r as you mentioned work better with the (more "sensible") rest of the font. However, I'm afraid if I normalize them too much I'll lose character. I guess I'll save the most flamboyant ideas for the display version.</p>
      <p>Thanks--it helped to get clearer about Solvejg's purpose.</p>
