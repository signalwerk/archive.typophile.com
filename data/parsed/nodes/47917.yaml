      <p>The roman lowercase “g” doesn’t work for me at all, but the cursive version is lovely. Reminds me a lot of Beorcana. </p>
      <p>By the way, the name Solvejg is usually written with an i (Solveig). Solvejg is so uncommon, at least to me, that I first mistook it for a typo. I had to look up the phone directory, which returned nine hits in Norway (“Solveig” returned 17705). It’s a lovely name nevertheless. Makes me think of blonde farmergirls amongst deep fjords and majestic mountains. The English translation would be something like “a sunny road”.</p>
