    html: <p><a href="http://www.fonts.com/findfonts/detail.asp?pid=203825" target="_blank">Frankfurter Medium</a> could provide most of those letters, but you would need to modify the 'g' and perhaps use the 'e' from <a href="http://www.myfonts.com/fonts/linotype/vag-rounded/" target="_blank">VAG Rounded</a>.  <br> <br>If you just want something similar, then either of those fonts might work. Frankfurter has the rounded m &amp; n, if that is what you liked.</p>
