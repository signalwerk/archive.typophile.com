    html: <p>Nick -- <br> <br>That is very unusual. I wonder if the lack of hyphenation was an ideological decision by Ginsberg or the typesetter, or what. It makes for some very gappy lines. This could introduce an unusual dimension in terms of pacing for a certain school of poetry readers, but I can't imagine it was intended by the poet. <br> <br>-- K. <br></p>
