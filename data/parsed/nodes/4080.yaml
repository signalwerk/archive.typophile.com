    html: <p>Bruce Roger's Paragraph's on Printing (Dover) might provide you some useful examples of classical settings as well as some very good advice on composition and typographic design in general.</p>
    html_clean: <p>Bruce Roger's Paragraph's on Printing (Dover) might provide you some useful examples of classical settings as well as some very good advice on composition and typographic design in general.</p>
