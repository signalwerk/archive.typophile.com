    html: <p><img src="http://www.typophile.com/forums/messages/30/32855.jpg" alt="howl"> <br>Allen Ginsberg's "Howl" set in 10/11 Baskerville, 1956. <br>Every line of verse is treated as a justified paragraph, with 3 pica hanging indent. No hyphenation. Title, Cloister Bold. <br>(Sample is 30% larger than actual size, to show sufficient type detail.)</p>
    html_clean: <p><img src="http://www.typophile.com/forums/messages/30/32855.jpg" alt="howl"> <br>Allen Ginsberg's "Howl" set in 10/11 Baskerville, 1956. <br>Every line of verse is treated as a justified paragraph, with 3 pica hanging indent. No hyphenation. Title, Cloister Bold. <br>(Sample is 30% larger than actual size, to show sufficient type detail.)</p>
