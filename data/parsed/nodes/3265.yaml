  html: <p>Does anyone know how to get an automatic ligature into a font. I recently learned how to insert ligatures into the AFM file, but I don't know how to make the AFM usable.</p>
  html_clean: <p>Does anyone know how to get an automatic ligature into a font. I recently learned how to insert ligatures into the AFM file, but I don't know how to make the AFM usable.</p>
