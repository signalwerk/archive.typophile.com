    html: <p>Automatic ligature replacement is either a function of the software being used (that is, to recognize a specific sequence of characters and substitute the appropriate standard ligature), or a function programmed as a feature in an OpenType format font.  <br> <br>For a series of characters to be replaced by a ligature automatically, the font being used still needs to contain the ligature itself as a separate glyph. Inserting ligatures into the AFM file serves not purpose of the ligature itself does not exist as part of the character set in the font.</p>
