    html: "<p>It's not ResEdit. It's a little application called FondModifier. It appears to have been written for them by some \"very bright fellow\" (Cherie's words) who used to work with them at Bitstream. <br> <br>I suppose you could make the modifications with ResEdit if you knew how to read the hexadecimal.  <br> <br>Basically the change is to add back PS glyph name 222: fi and PS glyph name 223 : fl. <br> <br>Using Apple's DumpFOND tool, I checked a C&amp;C font and it shows: <br> <br>/* GLYPH REENCODING TABLE */ <br> <br>Name for character code 0xDE: 'fi' <br>Name for character code 0xDF: 'fl' <br> <br>Maybe you could use Apple's FuseFOND to make this change to the FOND. I think I tried it once and couldn't get it to work. <br> <br>I don't understand how or why this modification works. The fi and fl glyphs should be encoded to Dec 222 and 223 in the encoding array of the PS font. I don't know why a \"reencoding table\" is needed in the FOND.  <br> <br>But that's how it works. <br> <br>-- K. <br></p>"
    html_clean: "<p>It's not ResEdit. It's a little application called FondModifier. It appears to have been written for them by some \"very bright fellow\" (Cherie's words) who used to work with them at Bitstream. <br> <br>I suppose you could make the modifications with ResEdit if you knew how to read the hexadecimal.  <br> <br>Basically the change is to add back PS glyph name 222: fi and PS glyph name 223 : fl. <br> <br>Using Apple's DumpFOND tool, I checked a C&amp;C font and it shows: <br> <br>/* GLYPH REENCODING TABLE */ <br> <br>Name for character code 0xDE: 'fi' <br>Name for character code 0xDF: 'fl' <br> <br>Maybe you could use Apple's FuseFOND to make this change to the FOND. I think I tried it once and couldn't get it to work. <br> <br>I don't understand how or why this modification works. The fi and fl glyphs should be encoded to Dec 222 and 223 in the encoding array of the PS font. I don't know why a \"reencoding table\" is needed in the FOND.  <br> <br>But that's how it works. <br> <br>-- K. <br></p>"
