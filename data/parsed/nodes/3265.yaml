    html: "<p>In this case, the ligatures (as glyphs) have already been drawn (The only one that is missing is the ff). <br> <br>On many Adobe fonts, the ligature replacment seems to happen automaticaly (assuming my preferences are set correctly), but fonts from other foundries (ie Emigre or Storm) don't. I recently heard that by inserting code into the AFM file you can make ligature replacments happen, but my experiments have not yet yielded any results. <br> <br>Maybe the question could have been different: \"What is Adobe doing that no one else is?\"</p>"
