      <p><em> two different characters representing the same letter, each one used depending on certain grammatical rules.</em></p>
      <p>That's self-fulfilling. Just because grammar determines their usage doesn't make them different characters.This is apparent with those characters which have an identical form in both cases, CcOoSsUuVvWwXxZz in Latin. That's the fundamental way casing works, it's the same character in two different sizes. The complexity we have to live with is that in many instances the character has a different form as well as size.<br>
      As I said, Titlecase is a grammatical indicator that works by changing case (a typographic quality), not by changing character, i.e. spelling (a linguistic quality).</p>
      <p><em>The fact that non-alphabetic characters don’t have other-case counterparts is just a complexity we have to live it; it doesn’t make Unicode’s handling of UC/lc incorrect.</em></p>
      <p>The correct casing of characters, both alphabetic and non-alphabetic, is an important part of typography. Beyond typography-lite, Unicode's handling of case poses difficulties; it's incorrect because it's simplistic. Rather like what happened with faux-italic, -small caps, and -bold.  </p>
      <p>Unicode would accomodate expert typography better if it encoded casing for all characters -- not just those which are grammatically meaningful. That would be something like feature tags for the five cases: Caps, Lower case, Small caps, Superior, and Inferior. </p>
      <p>The idea that "oh that's just fancy typography, the icing on the cake, so it doesn't matter" is at the root of the way Unicode handles case.</p>
