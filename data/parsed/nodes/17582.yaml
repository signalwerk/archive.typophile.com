      <p>I also realize I did not answer "I’m not sure what you mean by ‘an upper default in OT fonts’". John, really it's in a good Document, in a good environment, OT font or not, that the default case composition is set to "mixed U&amp;l.c.", and so, the empty blinking cursor is thinkin' uppercase because that first letter composed should be Uppercase. It is not until another character is input that you know for sure it should be uppercase, but, as I hope is a point of no contention, it'll most likely remain uppercase regardless of what is typed next, or for the rest of the document. </p>
      <p>This "Uppercase Default" is true from the beginning of composition (pre-type), and remains true even in digital squirt gun fights like these, I did not make it up, readers did, and All's I'm saying, is writers. By now. should have the tools to make this easy at even the zer0th common denominator level we strive so mightily to serve, (and I don't mean in the deadhead way some have mangled to work it out, where e.g. E.g. Happens because En(2)rage e.g. doesn't have an abreviational period and a solid set of tables on its head to play with. :) )</p>
      <p>To do it right, I think we need a well organized and unambiguous series of case features, applications based on how people read and write, (not based on old fonts), and some other important parts too few to mention, as opposed to splitting up the user's perception of case into an idiot's paradise of menus. This is not to say, once again, the FB Inc. is not "doing things right, even if we have to copy other people's mistakes", because we're well practiced in this area of the type business, but we are taking precautions in case an intelligent forward-looking composition system can be made to work, and in the mean time we're using those precautions to make the "right" tables now. :)</p>
