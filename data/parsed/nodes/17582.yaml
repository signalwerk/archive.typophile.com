      <p><em>The real problem is that a normal keyboard doesn’t apply ‘shift’ the same way to numerals as it does to letters.</em></p>
      <p>That is just a symptom of the underlying issue that I described: the alphabetic case distinction is a character-level distinction, while numeric ’case’ distinction — because usually thought of as a style distinction — is a glyph level distinction. A keyboard is primarily a character input tool.</p>
