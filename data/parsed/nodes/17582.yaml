      <p><em>The system should work for everbody — art directors using small caps are no less important than ancient linguists studying dead languages.</em></p>
      <p>Trust me, the system currently works a heck of a lot better for art directors using smallcaps than for scholars studying ancient texts. Again, what we're talking about for the former is essentially a user interface issue: how to present typographic controls in ways that make intuitive sense to a typographer. Further, the needs of the art director are typically quite simple: he needs an individual piece of text to look a particular way, often without needing to worry about the underlying text encoding at all because the result is to be output in a static medium.</p>
