      <p><em>But seriously, orthographic logic is not the same as typographic logic, which is why we are having this discussion.</em></p>
      <p>Right, but digital typography sits on top of a framework of digital text processing. Unlike bits of lead, digital characters have semantic properties. Text processing and display is multilevel processing: there are the individual encoded characters with their standard properties (e.g. directionality, case folding, canonical composition/decomposition); there are strings of these characters with string level properties (e.g. bidirectional layout); at this level we're still dealing with what is defined as 'plain text'; then there is the first level of display, the direct mapping of characters to default glyphs; then we have what Unicode calls 'higher level protocols' that look after basic rendering requirements beyond straight character-to-glyph mapping (e.g. language shaping for complex scripts, a mix of font and shaping engine responsibilities depending on the technology employed); and finally one gets to the relatively thin layer of typographic refinement that sits on top of the rest of the structure. So however one determines things should be considered in typographic logic, practically one has to consider how these are to be implemented on top of a text processing architecture that begins with a structural model of how individual scripts work at the plain text level.</p>
    html_clean: |-
