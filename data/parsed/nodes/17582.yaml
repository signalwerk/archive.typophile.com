      <p>David Berlow wrote:<br>
      <cite>This “Uppercase Default” is true from the beginning of composition (pre-type) [...]</cite></p>
      <p>I wonder if this is still the problem except for a few relicts -- default numerals, currency &amp; mathematical symbols which are still "uppercase".</p>
      <p>John Hudson wrote:<br>
      <cite>In other words, one wants to be able to say, within a font, ‘The following glyphs are associated with lowercase text’ without needing to rely on such a statement for glyphs [...] one way to do that is to create new font layout features or tables, in which such statements are made. But another way to do it is so take existing layout features, such as ‘onum’, and to say that this feature should be applied as part of text transformation functions triggered by the application UI.</cite></p>
      <p>Maybe it's rather a matter of conceiving things. Just consider oldstyle numerals as lowercase, and lining numerals as uppercase. And make oldstyle numerals default in your fonts. This would make numeral-related UC-to-LC text transformation obsolete.</p>
      <p>It is banal: "Normal" text is made up of lowercase, with some uppercase here and there. "Normal" typing (no 'shift' &amp;c) gets you lowercase. Uppercase ask for 'shift' or the 'All Caps' option ('case' which includes switching to lining numerals), and thus can be regarded as "exceptions" already. All caps, small caps, italics -- there's not much difference from a typographic point of view, they are to make text stand out from "default" lowercase setting. And if someone wants lining numerals in lowercase context too, this again has to be an active decision. Moreover, those who really want lining numerals everywhere could make it the default on application or OS level with future software.</p>
      <p>But then, one could just turn the last suggestion around: It should be possible to set *any* numeral style, say 'onum', as default or preferred on application or OS level. That way it turns out irrelevant which numeral style is set as default in fonts.</p>
      <p>The real problem is that a normal keyboard doesn't apply 'shift' the same way to numerals as it does to letters.</p>
