      <p><em>Your argument that titlecase is like spelling is a justification for assigning casing to plain text. But common sense says that there are some 26 letters in the alphabet, and words are spelled the same way whether in upper, lower, or mixed case.</em></p>
      <p>My specific example was German nouns, in which capitalisation is not optional and an initial lowercase letter constitutes something like a spelling error. The fact is that uppercase letters have grammatical function in a way that italic styling, the presence or absence of ligatures, the use of smallcaps, etc. do not. We expect a grammar checker to pick up on whether the first letter of the first word of a new sentence is a capital, but we don't expect it to pick up on whether that word is set in italics. This is the common sense way in which we <em>use</em> our bicameral alphabet.</p>
      <p><em>Bicameral means that the same character has two components, not that two (or more) separate characters have been arbitrarily associated.</em></p>
      <p>It's begging the question to describe them as 'the same character'. They are the same <em>letter,</em> but that is not the whole basis on which a decision is made regarding how they should be encoded. We must consider how they are used, what kind of functions we expect to be able to perform with encoded text, how best to facilitate those functions. Describing something as a 'cheat' because it 'facilitates basic encoding' seems to me perverse when the goal is basic encoding. It's like saying that kicking the ball in the direction of the goal is cheating at soccer.</p>
