      <p><em>The semantic significance of italics is what I call articulatory. </em></p>
      <p>And so is Titlecase. Your argument that titlecase is like spelling is a justification for assigning casing to plain text. But common sense says that there are some 26 letters in the alphabet, and words are spelled the same way whether in upper, lower, or mixed case.</p>
      <p><em>...as soon as you start keyboarding non-bicameral scripts you learn to think of the shift key in a completely different way.</em></p>
      <p>Well of course! Bicameral means that the same character has two components, not that two (or more) separate characters have been arbitrarily associated.</p>
      <p><em>Almost every text processing operation would have to be handled as rich text,</em></p>
      <p>Now that sounds like progress!<br>
      Assigning casing to plain text is a bit of a cheat, to facilitate basic encoding.</p>
      <p><em>the importance of anomalies is primarily found in textual analysis operations ... not to things like cased unicase display typography.</em></p>
      <p>Eunoia is perfectly logical, and only an anomaly in terms of standard practice. (Which may explain why only a handful of people have licensed the font!) I don't really consider it display typography -- it's more of a theoretical experiment.</p>
