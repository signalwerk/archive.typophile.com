      <p><em>by seeing uppercase letters that are structurally different than their lowercase counterparts as somehow flawed </em></p>
      <p>I didn't say that, I don't see that. The minimum requirement for upper vs. lower casing to be grammatically significant is size. The fact that there are many characters where the glyph shapes are different for the different cases is therefore grammatically redundant. Which isn't to say it's a flaw, it's a complexity (to use your term), and probably serves some other purpose. </p>
      <p><em>I’m getting the feeling that perhaps you’d like people to see unicase as a typographic scheme as valid as traditional mixed-case, </em></p>
      <p>Hrant, it's 2006. Go change some diapers. Stop projecting your feelings onto me and address what I say. Note that in my last post I mentioned five typographic cases, and unicase wasn't one of them.</p>
      <p><em>Repeat: those [expert typographic cases] are not properly encodable. The decisions made would be “incorrect” to various segments of users.</em></p>
      <p>Standards are negotiated. OpenType feature tags are agreed-upon encodings.  Typographers need sophisticated layout applications to work efficiently -- at the moment their menus are all over the place -- and it would be a lot easier for application developers to do their part if the five kinds of casing were encoded. The premise of Unicode is to encode only that which is grammatically significant. </p>
      <p><em>simply because it’s more fundamental;</em></p>
      <p>Not so. Coded text can't exist without typography.</p>
      <p>There's no reason to blow off typography as the icing on the cake. The system should work for everbody -- art directors using small caps are no less important than ancient linguists studying dead languages. </p>
      <p>Small caps are an integral part of the world system -- Microsoft's commitment in the ClearType fonts will see to that: small caps for Latin, Greek and Cyrillic; Regular, Bold, and Italic!</p>
