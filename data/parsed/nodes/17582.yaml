      <p>The correct casing of characters, both alphabetic and non-alphabetic, is an important part of typography. Beyond typography-lite, Unicode's handling of case poses difficulties; it's incorrect because it's simplistic. Rather like what happened with faux-italic, -small caps, and -bold.  </p>
      <p>Unicode would accomodate expert typography better if it encoded casing for all characters -- not just those which are grammatically meaningful. That would be something like feature tags for the five cases: Caps, Lower case, Small caps, Superior, and Inferior. </p>
      <p>The idea that "oh that's just fancy typography, the icing on the cake, so it doesn't matter" is at the root of the way Unicode handles case.</p>
