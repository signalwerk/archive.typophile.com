      <p><em>...you’ve proved my statement...</em></p>
      <p>Actually, copying and pasting removed the semantic significance which you had encoded by italicization, proving that in some instances italics can have orthographic value.</p>
      <p>***</p>
      <p><em>the relatively thin layer of typographic refinement that sits on top of the rest of the structure.</em></p>
      <p>Admittedly, this way of arranging things works far better than what we had before, when it was the other way up. However, I think writing/typography is more fundamental than a veneer.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Anomaly.png"></div><br>
      Cased unicase!?<br>
      The issue of unicase highlights the problem the orthographic system has with casing. Casing is convention, enshrined as standard, but from a typographic perspective it's inconsistent to define upper and lower case as separate characters. The German noun convention, the proper name convention, the first letter of the sentence convention, these are all examples of Titlecase, and departing from the convention is not mis-spelling, but mis-casing. Of course, such casing should be kept in the basic document (ie orthographic), but it begs the question of whether Case is a quality of text or layout. Unicode says that case is a text thing; typographically, it's not.<p></p>
      <p>Keyboards recognize that A and a are not different characters, by only having one set of keys, modified by the shift key. And all but the most basic of word processors recognize the inadequacy of having the same "letter" as different characters for upper and lower case, by making the connection between 41 and 61. A and a, etc.</p>
      <p>According to the 4-level typographic system I outlined above, these could be coded<br>
      1111: 1 (first character) 1 (majuscule) 1 (big size) 1 (baseline), and<br>
      1221: 1 (first character) 2 (minuscule) 2 (medium size) 1 (baseline). </p>
      <p>In practice, we already have the .unic OpenType feature, which, as has been observed, is non size-specific. A .forc feature is unlikely.</p>
    html_clean: |-
      <p><em>...you’ve proved my statement...</em></p>
      <p>Actually, copying and pasting removed the semantic significance which you had encoded by italicization, proving that in some instances italics can have orthographic value.</p>
      <p>***</p>
      <p><em>the relatively thin layer of typographic refinement that sits on top of the rest of the structure.</em></p>
      <p>Admittedly, this way of arranging things works far better than what we had before, when it was the other way up. However, I think writing/typography is more fundamental than a veneer.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Anomaly.png"></div><br>
      Cased unicase!?<br>
      The issue of unicase highlights the problem the orthographic system has with casing. Casing is convention, enshrined as standard, but from a typographic perspective it's inconsistent to define upper and lower case as separate characters. The German noun convention, the proper name convention, the first letter of the sentence convention, these are all examples of Titlecase, and departing from the convention is not mis-spelling, but mis-casing. Of course, such casing should be kept in the basic document (ie orthographic), but it begs the question of whether Case is a quality of text or layout. Unicode says that case is a text thing; typographically, it's not.<p></p>
      <p>Keyboards recognize that A and a are not different characters, by only having one set of keys, modified by the shift key. And all but the most basic of word processors recognize the inadequacy of having the same "letter" as different characters for upper and lower case, by making the connection between 41 and 61. A and a, etc.</p>
      <p>According to the 4-level typographic system I outlined above, these could be coded<br>
      1111: 1 (first character) 1 (majuscule) 1 (big size) 1 (baseline), and<br>
      1221: 1 (first character) 2 (minuscule) 2 (medium size) 1 (baseline). </p>
      <p>In practice, we already have the .unic OpenType feature, which, as has been observed, is non size-specific. A .forc feature is unlikely.</p>
