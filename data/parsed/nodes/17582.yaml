      <p>John Hudson wrote:<br>
      <cite>That is just a symptom of the underlying issue that I described:</cite></p>
      <p>Now I understand your earlier text better by reading your comment on my one ...</p>
      <p>I just wonder if some of these things, say, automatic selection of the contextually appropriate numeral style on application level, are possible. If I have lowercase text, then for emphasis some uppercase words, followed punctuation marks, then figures, and again lowercase. Would a application be able to “decide” whether to put oldstyle (lowercase context) or lining (uppercase context) figures? And respect different typographic conventions, even ideosyncraties ...<br>
      But then, maybe it would help a bit if applications’ ’All Caps’ were used instead of ’Caps Lock’. Or if ’Caps Lock’ would evoke applications’ ’All Caps’. Then, automatism could be omitted.</p>
      <p>Maybe one has to apply a more radical view: uppercase-lowercase as a glyph-level distinction (like smallcaps-lowercase) which accidentally/historically was regarded as a character-level distinction. ’Shift’+[any lowercase character]* then does nothing but apply ’All Caps’ to a single lowercase character. And special unicode values for uppercase are a necessary evil, legacy, one has to live with. (Typographic point of view.)</p>
      <p>* I am writing on a Mac: ’Caps Lock’ applied to numerals does *not* evoke punctuation marks. Which is a little step toward a change of the paradigm.</p>
      <p>Nick Shinn wrote:<br>
      <cite>While it’s OK to make a set of figures to go with lower case alphabetic characters, that doesn’t mean they have to be oldstyle.</cite></p>
      <p>Of course. When applying this broader view (numerals for lowercase &amp; uppercase context), a distinction of oldstyle &amp; lining numerals is too narrow, too design centric — as opposed to function centric. (Which becomes obvious when adding small caps figures ...)</p>
