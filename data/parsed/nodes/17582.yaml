      <p>&gt; it’s the same character in two different sizes</p>
      <p>No, I don't think size is it at all. The essential useful difference<br>
      between UC and lc is that they're used grammatically differently.<br>
      The size, forms, etc. are all on a different level of usefulness. Maybe<br>
      a more useful level to an art director, but clearly not to most people.</p>
      <p>Also, by seeing uppercase letters that are structurally different than their lowercase counterparts as somehow flawed, you're making the same mistake as Thompson: vying for destructive simplification.</p>
      <p>&gt; The correct casing of characters, both alphabetic and<br>
      &gt; non-alphabetic, is an important part of typography.</p>
      <p>Not really. It's more of an important part of orthography, and [the casing aspect of] typography just follows that. I'm getting the feeling that perhaps you'd like people to see unicase as a typographic scheme as valid as traditional mixed-case, and you realize that can only happen by simply ignoring [that aspect of] grammar, so you're advocating classing typographic refinement above basic encoding? If so, I'm sure that won't work.</p>
      <p>&gt; Unicode would accomodate expert typography<br>
      &gt; better if it encoded casing for all characters </p>
      <p>No, it would become a mess. Repeat: those are not properly encodable.<br>
      The decisions made would be "incorrect" to various segments of users.<br>
      Like try to define what an "italic" is, and you won't hear the end of<br>
      it from me.  :-)</p>
      <p>What you're talking about isn't useless, quite the contrary; but that's not the point of unicode, and it shouldn't be. Furthermore: what unicode tries to do is in fact more important, simply because it's more fundamental; billions of people have trouble typing their scripts into computers - they're quite far from worrying about smallcaps and such - not that the most technologically advanced cultures really worry about smallcaps either anyway...  :-/</p>
      <p>Seeing this distinction is critcally important - it has nothing to do with "fancy" or dumb - but with the useful layers of how humans process textual information.</p>
      <p>hhp</p>
