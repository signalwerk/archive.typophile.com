      <p>:)"display-all-text-as-uppercase" in indesign, is really "display all alphabetics as uppercase alphabetics, (i.e. the same as "shift"). " Display all text as uppercase", I believe, is a different thing to users, and thus to type designers.</p>
      <p>There are, 5 cases and a point to be made for a sixth to account for better composition with a particular foreign script (and esp). But the 5 cases we work with most of the time are upper, lower, small cap, infs. and sups. These are not ambiguously used, which is why they should not be ambiguously defined. It's sometimes confusing, because people work in narrow design spaces and don't think all the time about all the space.</p>
      <p>Here is a picture: Garamond is the best of the bad examples. If you choose "lowercase" in InDesign only the "lowercase",  are , figs are still "too big" Can You See?.  Next worst is Trajan, where the figures are not managed for the user as in Garamond, and "lowercase" it says,  but small caps they are, SEEEE?. Is this a good way to teach users? Zapfino shows the true metalheadedness of the situation. As the cases diverge in whatever direction the designer chooses, ht. &amp; wt. being the most effective wedges , the characters we usually think of as appropriate for both, (multicase in FB terms), are stressed, and the need for case specific characters increases.</p><div class="imageWrap"><img src="http://typophile.com/files/Case Studies.jpg"></div><p></p>
      <p>Is the OT ideal that the user needs to manage all of the case outside of A-Z and a-z with other feature tags, or are we trying to hElP? er. no. I think the expectation of users after all this time, is that they will have more power to more easily compose superb typography in a WIDE RANGE OF STYLES, without having to face menus like these... But don't worry, I'll fix it.</p><div class="imageWrap"><img src="http://typophile.com/files/Menu(res).jpg"></div><p></p>
