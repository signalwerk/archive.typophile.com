      <p><em>seeing the difference between orthography and typography</em></p>
      <p>That would be nice, but they overlap.<br>
      Unicode ignores the overlap by encoding capitals as separate characters, not by case.<br>
      So higher level protocols are left to hack the connections between A and a, etc., in order to perform functions like "all caps".<br>
      "All caps" is rich-text typography, but it's as basic to the standard WP software, MS Word, as holding down the shift key on a typewriter -- not exactly art-director stuff.</p>
      <p><em>I don’t know anyone at Unicode who dismisses typographic display in this way: they just insist that it sits above the plain text level at which they encode characters. </em></p>
      <p>Sorry for the colourful figure of speech, but I suspect that the subtleties of expert typography may be perceived as a bit precious, hence the reluctance to incorporate a display function like casing.</p>
      <p>Yes, this is all very moot.</p>
