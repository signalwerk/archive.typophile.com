      <p>That's a different problem. As is the observation that<br>
      there's room for improvement (although there always is,<br>
      even in something like the basic alphabetic structures).</p>
      <p>My own main point (a minor one, I admit, in this broad thread) is that you cannot -and should not- encode things like smallcaps and italics the way you encode formal grammatical distinctions, at least not at such a base level as Unicode. Also, unicase is not a formal grammatical distinction (thank god).</p>
      <p>&gt; the Unicode system is not perfect</p>
