      <p>Tthere’s some confusion of form with function.</p>
      <p>While it’s OK to make a set of figures to go with lower case alphabetic characters, that doesn’t mean they have to be oldstyle. For instance, I could make “Scotch” lining figures (three-quarter cap height) to go with lower case (and upper and lower case) settings — but make a full-cap height set of lining figures to go with an all-cap setting.</p>
      <p>However, while it may make more logical sense to have the OT figures categorized according to the case they’re intended to support, users are used to the conventions of oldstyle and lining.</p>
