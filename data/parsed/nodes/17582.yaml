      <p>Pretending? That's exactly what they are: two different characters representing the same letter, each one used depending on certain grammatical rules. The fact that non-alphabetic characters don't have other-case counterparts is just a complexity we have to live it; it doesn't make Unicode's handling of UC/lc incorrect. And typographic distinctions are completely moot to this point; because they are not formal, codified rules - they're more like personal preferences.</p>
      <p>Think for example of so-called "upright italics", which aren't<br>
      really italics at all (because they're functionally not) but too<br>
      many type people claim they are.</p>
