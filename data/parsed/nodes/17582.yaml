      <p>I’m afraid I still don’t get what your point is :)</p>
      <p>InDesign’s display-all-text-as-uppercase function employs character case mapping without changing the backing string. So it should work for any character with straight casing behaviour. I say straight casing, because Adobe have not implemented Unicode Special Casing support, in this function or in the actual case changing function, so there are some lowercase characters that slip through the net — as Nick found when working with polytonic Greek — or which case correctly only for certain languages.</p>
      <p>I’m not sure what you mean by ’an upper default in OT fonts’. For the most part, there is no assumption of a default text state, and less of an assumption than there used to be in Type 1 smallcap and expert set fonts. I think the ’case’ function is unique in presuming that the default forms and positioning for e.g. hyphen height is going to be for use with lowercase or mixed case text. But this seems to me a very fair presumption about the nature of most text. The fact that there are some fonts that only contain uppercase forms doesn’t seem very relevant: these fonts would have appropriate forms and positioning for their design, and wouldn’t need the ’case’ feature at all. The majority of text is mixed case and within that the majority of consecutive character strings are lowercase. That is a reasonable basis for the default form and positioning for punctuation, symbols and, yes, numerals, in mixed case fonts being designed for use in such contexts.</p>
