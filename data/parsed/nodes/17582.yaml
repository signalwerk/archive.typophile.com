      <p><em>Describing something as a ‘cheat’ because it ‘facilitates basic encoding’ seems to me perverse when the goal is basic encoding.</em></p>
      <p>The problem is that Titlecase, while it is basic to encoding, and arguably to grammar, is a layout feature. Unicode gets around this by pretending that majuscule and minuscule versions of the same letter are different characters, making basic encoding possible without resorting to the higher level of layout features. Sure, it may get the ball in the goal, but so can handball, and that's a foul.</p>
      <p>In terms of grammar, Titlecase is a form of Inflection. Whereas most inflection signifies a grammatical feature by altering the spelling of a word, Titlecase does so by capitalizing the initial letter.  </p>
      <p>The result of the "cheating", which applies case selectively only to letters, and through "characterization", as David Berlow has so astutely pointed out, is that the typographic casing of non A-Z characters is left up in the air: <em>"Is the OT ideal that the user needs to manage all of the case outside of A-Z and a-z with other feature tags? ...an idiot's paradise of menus". </em>  </p>
      <p>As Karsten has noted, ideally the shift key should activate the Case feature. The way it is now, letters keyed as all-caps by using the shift key (or shift-lock), will not automatically display the appropriate "case" of accompanying glyphs, such as figures and punctuation -- unless the "all caps" button is pushed for text which is <em>already</em> in all caps; from the user's perspective, that's absurd. </p>
      <p>So the Unicode system is not perfect. But funnily enough, I don't think that's necessarily bad for good typography. Perfection is hard to come by. OpenType is a powerful tool, and if some expertise is required from typographers to realize all its benefits, then it becomes a focus of interest. If typographers have to think about which figures go with which case, and make a decision, that's good for typography, rather than just having the standard kick in automatically. Nonetheless, there's a lot of room for improvement in the OT menus.</p>
