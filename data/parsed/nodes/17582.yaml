      <p>Okay, now I understand what you’re getting at. Thanks for the examples.</p>
      <p>On one hand, everything you’ve described could be handled at the UI level, largely independent of the font level implementation. This is why, for instance, Microsoft’s XAML typographic features are not identical to the OpenType Layout features that they trigger, and a single UI feature might implement a collection of OTL features. [Which is not to say that I think the XAML feature structure is the best thing going, only that it is an example of the distinction between UI experience and underlying architecture.] Similarly, there is no reason why the ’convert to lowercase’ function in an application couldn’t apply the ’onum’ OTL feature at the same time as converting character case.</p>
      <p>Of what you are typographically identifying as ’case’ — upper, lower, small cap, inferiors and superiors — two are considered case for alphabetic characters from a text encoding perspective, and two different ones are considered case for numeric characters from a text encoding perspective. And that isn’t going to change any time soon, if ever. So the question is what kind of architecture and what kind of UI should exist to handle a combination of character level processing and glyph level processing in such a way that the user only has to think about what he sees on the page/screen, not how it got there.</p>
      <p>Regarding architecture, the question is how, for example, to have oldstyle numerals, which are glyph variants, identified with lowercase text, which is a character class, and how to enable this in a design-specific — i.e. font-specific — way. And, at the same time, how not to lose the significant processing speed advantage of character level actions available for alphabetic case mapping. In other words, one wants to be able to say, within a font, ’The following glyphs are associated with lowercase text’ without needing to rely on such a statement for glyphs that are already associated with lowercase text by virtue of their character mapping to lowercase character codes. Well, one way to do that is to create new font layout features or tables, in which such statements are made. But another way to do it is so take existing layout features, such as ’onum’, and to say that this feature should be applied as part of text transformation functions triggered by the application UI.</p>
