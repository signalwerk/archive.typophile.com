      <p>In typography there are four formal categoric systems.<br>
      The first is abstract, and the other three are geometric, i.e. they concern the graphic qualities of shape, size, and position.</p>
      <p>1. Character Form. This creates the category of character.</p>
      <p>2. Variant Character Forms. This creates categories of majuscule/minuscule, and roman/italic. However, some characters (eg "ess": S,s,<em>S,s</em>) do not have variant forms, while others do (eg "ay": A,a,<em>a</em>).</p>
      <p>(Note that Unicode recognizes both majuscule, which it terms "capital" and minuscule, which it terms "small", but not italic variants. That's somewhat illogical.)</p>
      <p>3. Relative Size. This creates categories of Big (upper case) Medium (lower case, small caps), and Small (inferiors, superiors, numerators, denominators, ordinals) </p>
      <p>4. Relative y-axis Position. This creates categories of Baseline, Superior, and Inferior.</p>
      <p>In practice, there are conventional groupings of character parameters from different categories, which exclude many combinations. So on the basic keyboard you get a default roman set of some Medium characters (eg s) with some variant Medium characters (eg a), and some Big characters (eg S) with some variant Big characters (eg A).</p>
      <p>In theory, Unicase is not a question of Relative Size (3), because size is "case", and unicase means that there is one "common" case, and therefore no distinction based on size. So unicase is a question of what default set is chosen from the Variant Character Forms (2).</p>
