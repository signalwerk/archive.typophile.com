    <p>Appreciate any suggestions for a font that would approximate the font which appears in this sign.  It's from my Grandfathers (actually Great grandfathr's store in VT), built in late 1800.  One very helpful fellow from What's This Font? suggested  the sign was probably done by hand, and rather poorly at that!  <br>  <br>Just need an approxomation for a family reunion next month. <br> <br>Thank's for any and all assistance. <br> <br>Penny<img src="https://web.archive.org/web/20081121164026im_/http://www.typophile.com/forums/messages/83/40389.jpg" alt="Store sign from late1880"></p>
