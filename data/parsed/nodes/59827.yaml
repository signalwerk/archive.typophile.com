    <p>So I just saw this blog entry on the new fonts in Windows 7 <a class="freelinking external" href="http://blogs.msdn.com/e7/archive/2009/07/07/engineering-windows-7-for-a-global-market.aspx" rel="nofollow">http://blogs.msdn.com/e7/archive/2009/07/07/engineering-windows-7-for-a-global-market.aspx</a>, and in it they have a new Devanagari family called 'Aparajita'. It looks like this:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/image_9_5610.png"></div><p></p>
    <p>When I saw this latinized (is it not?) design, this came to mind:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/2439855845_70946d2c63_6597.jpg"></div><p></p>
    <p>Gerry Leonidas holding Jan van Krimpen's drawings from Romulus Greek at the library of the Museum Meermanno Westreenianum (Museum of the Book) in the Hague. <a class="freelinking external" href="http://www.flickr.com/photos/15484239@N00/2439855845/" rel="nofollow">(Photo courtesy of Dan Reynolds)</a>.</p>
    <p>What do you think? Is Aparajita latinized, and if it is, does that matter?</p>
