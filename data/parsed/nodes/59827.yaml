      <p>Actually the serifs aren't the most striking thing to me. The "modern" contrast is unorthodox, and a little amusing, but not unprecedented. "Latinized"? Okay, maybe. I certainly see what you mean.</p>
      <p>What strikes my eyes most, however, (but now, I'm not a native user) is some of the seemingly oversized forms. Seems to me like the Indic equivalent of a huge x-height. I mean, look at that full-figured <em>ka</em>, the <em>ca</em> almost hitting the roof, and the honking loop on the <em>na</em>. I find the angled stroke ending on the <em>ta</em> also a little odd.</p>
      <p>But really, who cares what I [we] think? I suppose the proof in the pudding will be how the intended audience of Devanagari users responds.</p>
