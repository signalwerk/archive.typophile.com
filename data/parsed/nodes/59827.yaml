      <p>Hi! Just wanted to chime-in and say that I'm pretty sure the typeface isn't new, and wasn't developed by Microsoft, in case heads start butting! (Feel free to challenge this assumption!)</p>
      <p>- <a href="http://www.microsoft.com/typography/fonts/font.aspx?FMID=1700" title="http://www.microsoft.com/typography/fonts/font.aspx?FMID=1700">http://www.microsoft.com/typography/fonts/font.aspx?FMID=1700</a> - Aparajita, developed in 2001 by Modular Infotech<br>
      - <a href="http://www.modular-infotech.com/html/otf.html" title="http://www.modular-infotech.com/html/otf.html">http://www.modular-infotech.com/html/otf.html</a> - Modular Infotech's font catalog. If you click on the Devanagari pdf, I believe Aparajita is samples 0710, 0711, and 0712. </p>
      <p>Additionally, I have a feeling that it was designed by Karambir Singh Rohilla (if annyone wants to try to track him down and ask him).</p>
      <p>Yeah, I have seen a myriad of serifed Indic fonts... not sure when that trend started to happen. I personally have never liked them much, and they of course historically make no sense, in terms of the development of the script. This one in particular I just find really hard to read - did they HAVE to choose it, out of all Devanagari display faces? Sigh.</p>
      <p>** edit - Also just wanted to say that this font has been used quite a bit in India by now and wasn't hidden from the public or anything.</p>
      <p>** edit edit - heh.. heh.... links might work now.</p>
