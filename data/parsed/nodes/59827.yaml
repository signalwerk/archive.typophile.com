      <p>Well, I am excited to at least see Microsoft putting out some new non-Latins (hello Apple?).</p>
      <p>This is quite a strange design though. There is a precedent for this style of design, there are several others in this genre already used/available. However, one would hope/assume that the Microsoft versions will be better drawn and engineered with complete character sets.</p>
      <p>Dan is right: there are some really weird things going on with the character shapes. I don't understand some of the decisions made and why it is so consistently inconsistent. At least it will be easily ID-able once it starts popping up in everyone's logos :P</p>
      <p>The sloped italics are also unfortunate, especially with the vowel marks that aren't aligned properly in the regular italic (the bold ones are better).</p>
      <p>Cheers,<br>
      Rob</p>
