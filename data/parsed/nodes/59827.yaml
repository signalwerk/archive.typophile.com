      <p>@Kent<br>
      I think that some of the "x-height" bigness that you mention is ok. It all depends on the size the type is set at! You see this kind of treatment often in display type and lettering. Newspaper headlines come to my mind… (but I look at a lot of newspapers). Some of the difference is like the difference between book hands being written out with a pen, and larger sign lettering being painted with a brush.</p>
      <p>So for a text face, a big round ka like that is probably going to be a no no. But in a display face (that is really going to be used at display sizes…), I think that it can be appropriate. Again, it depends on the usage, just like any sort of typography.</p>
      <p>@Erin<br>
      Welcome to Typophile!<br>
      Good work tracking down Aparajita's info. It is worth noting that most MS faces were not developed by Microsoft, but licensed by Microsoft from designers and/or foundries. Just look at a list of all the latin fonts bundled with Windows!</p>
