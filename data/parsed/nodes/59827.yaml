      <p>I guess I missed it too. Aparajita is actually one of several Indic fonts that were licensed from Modular and developed for Office some time ago and were added to the OS in the Windows 7 time frame to provide additional variety of Indic fonts for the platform. To be honest I've not heard any direct criticism of this design from native speakers and if anything it seems to be one of the preferred Devanagari fonts out there. However, as always if there are improvements that can be made to the design we can take a look, but as for now "undefeated" seems like an appropriate name. :-)</p>
      <p>Cheers, Si</p>
