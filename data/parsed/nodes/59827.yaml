      <p>Modular fonts are mostly rip-offs from C-DAC designs or crude original designs which are unusable. The very fact that Microsoft has chosen to outsource fonts from them speaks volumes about their quality consciousness. The way they churn them out with numbers as names reminds one of the Humanist777s, Swiss555s and likes that plagues Roman typography even now.</p>
