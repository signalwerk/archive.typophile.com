      <p>I can't say whether or not the typeface is "latinized." It <em>does</em> have serifs on it, and it has a stroke contrast that doesn't strike me as one common in traditional examples of writing in the Devanagari script.</p>
      <p>However, I can say that in India, there are <strong>a whole lot</strong> of examples of contemporary display lettering and display typography including Devanagari letterforms that:<br>
      – have serifs<br>
      – and/or have a stroke contrast that isn't traditional</p>
      <p>I doubt that anyone expects Aparajita to be used as a text face in the way that e.g., most of the ClearType collection of Latin faces from a few years back would be used as text faces. As a display face, it might be the right note for certain compositions. In the sample you show above, Claus, there are a few things happening above the headline that I think should be done a little differently. I am going to leave my comments at that, though ;-)</p>
      <p>I wouldn't go so far as to compare it with Romulus Greek, though. Romulus Greek is an exercise in the naiv… it really was intended as a text face, if I have my history correct (I am not the biggest JvK-fan…). Seeing as there are already plenty of other things that remind me of Aparajita, I don't think the oddity found in Romulus Greek applies. But you never know with typographers, calligraphers, artists, and professors. Maybe somewhere, some writing expert is smiling at this post in that familiar Gerry Leonidas way…</p>
