      <p>I am sure it was a decision of someone who cannot read, or understand Hindi properly. Such designs can only appeal to people who never bothered to read, or make meaning out of it. It may look interesting from a foreigners point-of-view, but it's not legible at all - nor in text, neither on the display sizes. There is no visual consistency in the forms, and skeleton.</p>
      <p>To me, it's an ugly design with a weird set of proportions. It's not even refined properly. I am wondering how the complex conjuncts will appear in this design, e.g. in <cite>MRa</cite> or <cite>MNa</cite>?  Just analyze the provided sample only; the <cite>MatraI's</cite> are not coming properly, the <cite>Anusvara</cite> is too small and going slightly off on the letter <cite>Sa</cite> in regular italic (also the <cite>Reph</cite> on <cite>Ma</cite> too), the <cite>MatraE</cite> on <cite>Ka</cite> is not centrally aligned (neither in upright nor in the italic version), joinery in letter <cite>Sa</cite> is detached in Bold version whereas it's connected in the regular version. The letter <cite>Na</cite> looks weak in bold version compared to its neighbors. All the matra's are detached from the <cite>Shirorekha</cite> (Headline), and it's in the middle of nowhere. Also, I have a feeling that the bold and italic versions are automated. These are a few errors I noticed in this sample specific, but am sure I can point-out more if I see the complete character set. I have seen this typeface being used locally and never liked it.</p>
      <p>As a universal note, when we read Devanagari, the <cite>Shirorekha</cite> (Headline) serves as a visual guideline like the Serifs do in Latin. But here with both these styles together, it breaks the consistency somehow and makes it less legible. Historically also, these designs says nothing about the development of Devanagari.</p>
      <p>And yes, as someone said, it's not a new design. A lot of companies in India, including C-DAC, Modular Infotech, Summit Infotech, and  etcetera have been selling it with a different name since long. And now am seeing it with a new name, Aparajita. Well done, Microsoft! Keep it up! ;-)</p>
      <p>--</p>
      <p>Btw, Aparajita in Hindi (usually a girl's name) means, the undefeated.</p>
