    <p>Aniene<br>
    :: Adriane Krakowski</p>
    <p>Adobe Arabic<br>
    :: Tim Holloway</p>
    <p>Calouste<br>
    :: Miguel Sousa</p>
    <p>Quixote<br>
    :: Inigo Jerez Quintana</p>
    <p><strong>Display</strong></p>
    <p>Darka<br>
    :: Gabriel Martinez Meave</p>
    <p>Hogariet<br>
    :: Habib Khoury</p>
    <p>Rayuela Chocolate 2.0<br>
    :: Alejandro Lo Celso</p>
    <p>P22 Sweepy<br>
    :: Michael Clark</p>
    <p><strong>Type System / Superfamily</strong></p>
    <p>Frutiger Next Greek<br>
    :: Adrian Frutiger and Eva Masoura</p>
    <p>Garamond Premier Pro<br>
    :: Robert Slimbach</p>
    <p>Piclig<br>
    :: Christina Schultz</p>
    <p>Relato Sans<br>
    :: Eduardo Manso</p>
    <p>Vista Sans<br>
    :: Xavier Dupré</p>
    <p><strong>Ornament</strong></p>
    <p>FF Headz<br>
    :: Florian Zietz</p>
