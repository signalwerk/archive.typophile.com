      <p># # #</p>
      <p>Addendum:</p>
      <p><strong>TDC52 and TDC2 2006</strong></p>
      <p>New York – Gary Munch, President of the Type Directors Club, has announced that<br>
      the fifty-second annual Type Directors Club competition, TDC52 and the ninth<br>
      annual TDC Typeface Design Competition, TDC2 2006 was successful.</p>
      <p>TDC52 was chaired by Diego Vainesman, MJM Creative Services. The jury included:<br>
      Andy Altman (Why Not Associates, London); Mike Joyce (Steretoype); Alexa Nosal<br>
      (New York); Emily Oberman (Number Seventeen); Woody Pirtle (Pentagram, New<br>
      York); Steve Sandstrom (Sandstrom, Portland, Oregon), and Brady Vest<br>
      (Hammerpress, Kansas City, Missiouri).</p>
      <p>This year entries were received from 29 countries of which, 40% were from outside<br>
      the U.S.. Total work selected included 113 from 17 countries and 92 from the U.S.<br>
      The countries include: Australia, Canada, China, Croatia, England, Germany, Israel,<br>
      Italy, Japan, Korea, Mexico, Netherlands, New Zealand, Spain,Switzerland., and<br>
      Taiwan.</p>
      <p>Each year, for the past six, the TDC honors three students will monetary awards. The<br>
      three students include: First Place $500 Daniel Janssen, University of Applied<br>
      Sciences Hamburg, German<!--
