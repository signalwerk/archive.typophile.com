  html: |-
    <p>Hi all, I'd love to start a conversation about the best high contrast faces available for use in fashion. I'd like to submit the following... would love to hear more suggestions. I'm particularly interested in options with hairlines.</p>
    <p>HTF Didot<br>
    Austin Hairline<br>
    Freight Big Book<br>
    Miller Banner<br>
    Benton Modern Display<br>
    Monotype Modern<br>
    Perpetua Titling<br>
    Didot Elder<br>
    Genath Display<br>
    Romain Headline</p>
