      <p>I would not use a typeface of the digital generation (i.e. post-mid 1980s).<br>
      I see Hoefler types as a quite radical new take on your local culture (I'm speaking of North America, I am Italian), very related to the crispness of vector drawing.<br>
      Once, having met Stan Ridgway on his BBS, I would have liked to try a design of his Wall of Voodoo DVD, and what I though at the time was to scan original woodtypes and then arrange them.<br>
      But maybe you'd need to pair it with something more usable for textsetting…</p>
      <p>EDIT: What about having a look at Marcus Burlile's "collage" alphabets:<br><a href="http://www.identifont.com/show?48W">http://www.identifont.com/show?48W</a><br>
      Maybe anachronistical, but there could be something handy…</p>
