    html: |-
      <p>I see a massive change in Cash's life after he became a christian.  Earlier I see rebellion, strength, arrogance even.  I think of this as a big bold slab serif with funky angles.</p>
      <p>Then, later in life he softened, he let his guard down and yes, became fragile and beautiful like a spider's web or a glass sculpture.  I don't see him losing his masculinity in this at all, but he had less armor protecting the real Johnny inside.  This period I see as a script, or some light-weight yet sturdy serif, something that has a very personal touch.</p>
      <p>I think later in life he also became very aware of his mortality, he probably had a lot of close calls earlier in life, but I think a man changes when he realizes he might not be around much longer, I think his purpose and his focus changed totally from before - so I don't think I could summarize his entire life into just one typeface.</p>
    html_clean: |-
