      <p>No, no, no!</p>
      <p>These are all off by a country mile. Johnny Cash was an outlaw and a criminal before he found God and turned into a "good" or "lawful evil" dude. After that point Cash entered the mainstream yet he remained permanently on the shady side of the law and the establishment.</p>
      <p>These bulky, masculine slab serif candidates are in the ryte ballpark but they lack the subversiveness and non-conformity of the man himself. They're too conventional and law-abiding. (Oh some dys I will do anything just to get a few hyphenates in. Ah, that was a good hit back there).</p>
      <p>The embarrassing part is I can't name any butch slab serifs that evoke these aspects of Johnny's personality.</p>
      <p>They are all good candidates but they lack soul.</p>
      <p>j a m e s</p>
