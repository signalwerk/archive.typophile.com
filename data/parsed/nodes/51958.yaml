    <p>If Johnny Cash were a typeface which would he be? Perhaps something honest, cryptic, charming, humble or brooding?</p>
    <p>I'm currently working on a brief based on a typographic portrayal of his 'Man In Black' so any suggestions on typefaces relating to the song in particular would be great also, although i guess Cash's personality and the song itself are going to have similar references.  </p>
    <p>Again, any suggestions welcome.<br>
    Cheers</p>
