  html: |-
    <p>If the first "press" established in the Americas was in use in Mexico City in 1539, what are the chances that a monumental text by a Jesuit sometime near 1599--in what was then a remote region of Mexico--utilized a typeface designed in the Americas rather than Europe?  I guess my question is, which is more likely under these circumstances, a Mexican or European typeface?</p>
