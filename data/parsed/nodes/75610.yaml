      <p>Thanks Brian. I'm not trying to reproduce the artwork for Replica. That image is important to this thread because it reveals parallel paths - the circles are just illustrative. <strong>The circles allow us to see what is going on between the contours.</strong> They illustrate, rather than plot the contours. I want to plot the contours. The moving ellipse is just a way of us humans engaging with two abstract lines by aiding our imagination in how they might relate.</p>
      <p><strong>A hypothetical ellipse that transforms smoothly along a single path would always plot smooth and corresponding contours from its extrema.</strong> Maybe this is not the optical ideal, but it's what I am endeavoring to produce nonetheless!</p>
      <p>But this is working backwards. I am not trying to invent a function based on the a moving ellipse - I imagine a function capable of tackling my problem already exists - a function where more parameters than height and width can be stipulated when expanding paths. The function does not have to be intelligent enough to know which set of parameters to apply to different parts of the curve, I can expand them separately and specify the parameters such that the ends of each segment correspond.</p>
      <p>I fear I am struggling to convey my ideas.</p>
