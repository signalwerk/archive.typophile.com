      <p>Thanks for responding Brian. Studying various grotesque alphabets confirms the conventions but doesn't give much away about how the contours are formed - I suspect that in all of your examples they are determined by eye and iteration.</p>
      <p>A broad nib pen moving along a central path informs the contours of calligraphic lettering. A traditional grotesque font is an abstract interpretation of this image - these fonts were conceived as outlines from the outset. However, the computer allows us to, where appropriate, reinstate a direct relationship between contours that is longed for when working with outlines only - the crudest expression of this is an /o/ constructed with two parallel paths but naturally this particular function can't cope with more complicated situations.</p>
      <p>Don't get me wrong, I am not searching for a holy grail solution to stroke fonts, just different functions to aid consistency between various components. I hope that somebody can point me in the right direction.</p>
      <p>I didn't want to focus too much on the /u/ as this kind of joint is common to the /n/m/r/b/d/p/q/g/a/. It is because of this recurrence that I am keen to find functions capable of generating contours from a central or single path in each incidence.</p>
