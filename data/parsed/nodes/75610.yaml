      <p>Andrew, thanks for starting this discussion!  I am also very interested in these issues.</p>
      <p>On a related note, I think the joining of the straight part of the u to the curve is also a tricky thing.  As shown in the images posted by brianskywalker, sometimes the points are horizontally aligned, sometimes the inside is higher, sometimes the outside is higher.  I think the appropriate choice is highly dependent on the "shear" of the bottom that you mentioned.</p>
