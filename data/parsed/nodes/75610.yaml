      <p>Brian, I'm really glad that you uploaded that image of Replica as that is exactly what got me thinking about a hypothetical variable gauge ball. The Replica ball accounts for adjusted stroke width and height as it travels from vertical to horizontal. I then tried to imagine what kind of movement and transformation the ball would have to make to negotiate the tapered joint of a lowercase letter, in the case of my example a /u/, and I concluded it would have to shear to achieve this. Also I imagined that the ball would get slightly wider to produce optically adjusted width in the curved stem of a character such as /R/. Looking at the above image I think NORM chose to standardize this but there is no reason not to add more 'standards' to achieve a more adjusted font. For example, maybe for a /B/ the ball gets a fraction wider again for the lower right hand extrema.</p>
      <p>So I'm talking about a hypothetical, flexible gauge. Maybe I have to tell it how to respond to different scenarios, for different components of letters, based on our well established optical adjustments, but it will nevertheless inform the inside and outside contours by following one path and producing contours either side based on parameters. If this hypothetical 'clever gauge' was a function in software, which function is it?</p>
