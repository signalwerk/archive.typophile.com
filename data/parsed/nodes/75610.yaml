      <p>Hi Stephen, glad you found this interesting, I just linked this thread to yours. Hopefully we can evolve some solutions.</p>
      <p>I also dared to mention a pen - this seems to induce some skepticism from Nina in both threads ;-) </p>
      <p>The reason I mentioned a pen was because I enjoy the fact that the inside and outside contours are related. I want to achieve a more complicated relationship between these contours than produced by a fixed width traveling at a fixed angle.</p>
      <p>That is not to say that I want to make a calligraphic font. I want to make a sans serif font on a computer - that is why in my mind's eye I replace the pen with this ball. This imagined 'ball' is more flexible than the pen in the hand, it does not need to be kept at the same angle like a pen does and it can change in width much more than a nib splayed by pressure - on a computer it is not bound by physicality! Again, I don't want to get into the philosophical rights and wrongs of this - there are plenty of fonts on either side of that debate - I'm looking to make something that reconciles the two, a midpoint - and I need to find the tools to do it. Often on Typophile the 'why' stands before the 'how' but I'd like to reverse that order here. It's often easier to ask why than to explain how!</p>
      <p>I think I need to add some more illustrations.</p>
