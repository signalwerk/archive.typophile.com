      <p>&gt;I suspect that in all of your examples they are determined by eye and iteration.</p>
      <p>I think that's probably the case in all the best typefaces. You can certainly expand paths using a non-uniform brush (Illustrator I believe has quite powerful functions to this effect) but you'd have to tell it which paths to expand and contract in the 'right' places and at what rate (for example the SE curve of u needs to thin much more than the SE corner of an o, and different again for a d)...so you'd end up iterating anyway.</p>
