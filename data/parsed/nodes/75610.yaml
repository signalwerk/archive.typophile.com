    html: "<p>As Hrant says, Noordzij's model of the stroke only takes you so far. It seems to me that while Romain du Roi, Metafont or expansion/translation/rotation models do produce sort-of usable results, true Design comes in when you move away from these limiting geometric, modular or algorithmic approaches, and start to draw things optically, with new ideas, critically. I think type design is way too interdependent and complex to reduce that way: the human eyes have to be the final arbiter in all decisions, no?</p>"
