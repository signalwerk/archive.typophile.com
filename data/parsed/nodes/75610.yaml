      <p><cite>"…but doesn't give much away about how the contours are formed"</cite></p>
      <p>What makes you assume they are / should be formed by extrapolating from an inner single line?</p>
      <p><cite>"the computer allows us to, where appropriate, reinstate a direct relationship between contours that is longed for when working with outlines only"</cite></p>
      <p>I would debate that such a «direct relationship» between the contours is necessarily «appropriate», or desired, or even «longed for», in a sans. (If you make an extremely pen-informed font that may be different.)<br>
      I would rather see the necessary optical corrections, like the thinning you show, as reasons to <em>deviate</em> from any sort of «monoline» ideal. For one thing, if this is the way you'd like to construct a font, how do you intend to account for the necessary different thicknesses of vertical and horizontal strokes?<br>
      It seems to me like you're clinging to a logical model that you don't need to need.</p>
