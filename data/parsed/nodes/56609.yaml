      <div class="comment-spam-body"><p>Marble Heart was recently digitized for posterity. It is m-u-c-h older than McGrew thought: A specimen appears in the Hænel catalog of 1847! </p>
      <p>According to Bauer, Hænel imported roman types from GB and France. Since Nicolette Gray does not discuss it, it was probably French:</p>
      <p><a href="http://forums.typeheritage.com/topic/marble-heart/" title="http://forums.typeheritage.com/topic/marble-heart/">http://forums.typeheritage.com/topic/marble-heart/</a><br>
      <a href="http://www.flickr.com/photos/51266334@N08/sets/72157635201975897/" title="http://www.flickr.com/photos/51266334@N08/sets/72157635201975897/">http://www.flickr.com/photos/51266334@N08/sets/72157635201975897/</a></p>
      <p>--Anna</p>
      </div>
