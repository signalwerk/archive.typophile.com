    html: |-
      <p>It's called "Marble Heart", and it was an ATF typeface, based on an 1870s type called "Gothic Double Shade" from the Boston Type Foundry (which was an ATF predecessor). this info comes from Mac McGrew's great book on American Metal Typefaces. It is also shown in the Solotype Catalog &amp; the Phil's Photo "Homage to the Alphabet" book, which means it made it into film type. There is a similar style called Orleans Open that was digitized by FontBank as "OldWest", but I do not think I know of a digital verson of Marble Heart. Maybe Mark Simonson or Mike F. would know.</p>
      <p>- Mike Yanega</p>
