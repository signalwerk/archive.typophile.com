      <p>Thanks Anna. Admirable project. But you might want to find a way of moving to actual sale of the fonts. Why not put them on Myfonts? People who are not part of your project also find the old typefaces interesting and will probably produce their own versions for sale in the near future, since they see nothing in the marketplace.<br>
      Don</p>
