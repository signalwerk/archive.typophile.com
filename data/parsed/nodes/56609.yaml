    html: |-
      <p>Hi Don,</p>
      <p>The original mission of The Type Heritage Project [THP] was to publish a series of textbooks illustrating at least 1,500 already-existing digital revivals of display types originating c1800-WWI:<br>
      <a href="http://typeheritage.com/textbooks/overview/" title="http://typeheritage.com/textbooks/overview/">http://typeheritage.com/textbooks/overview/</a></p>
      <p>In the planning process, I realized the importance of preserving as many of these gems as possible--before maintainable letterpress equipment becomes any scarcer! The THP forum website recruits, coordinates and supports volunteer partners committed to THP's second mission:<br>
      <a href="http://forums.typeheritage.com/undigitized/" title="http://forums.typeheritage.com/undigitized/">http://forums.typeheritage.com/undigitized/</a></p>
      <p>So far, THP partners have produced hundreds of new revivals:<br>
      <a href="http://forums.typeheritage.com/status/" title="http://forums.typeheritage.com/status/">http://forums.typeheritage.com/status/</a></p>
      <p>"Margarethe" is a revival of Marble Heart including a super-rare lower case perhaps not shown by ATF. It was renamed because<br>
      I must [reluctantly!] advise revival developers to do so:<br>
      <a href="http://forums.typeheritage.com/topic/legalities/" title="http://forums.typeheritage.com/topic/legalities/">http://forums.typeheritage.com/topic/legalities/</a></p>
      <p>Later this year, THP will launch an eCommerce font boutique specializing in revivals and others drawn from historical<br>
      materials. A semi-functional model may be previewed here:<br>
      <a href="http://www.vixemporium.com/fontcart/" title="http://www.vixemporium.com/fontcart/">http://www.vixemporium.com/fontcart/</a></p>
      <p>Until then, these fonts are not available unless the partners decide to offer them elsewhere.</p>
      <p>Anna</p>
