      <p>Carlos, you make a good point; a soft break will not reflow later. InDesign gives us a variety of options for forcing a line break at a specific place, and each has its pros and cons.  </p>
      <p>A discretionary hyphen is a good choice if you don't mind having the last word hyphenated. Will only work if the last word is already hyphenated but you just want to change the location of the hyphen. Will reflow properly (if the text reflows later and the hyphen is no longer needed, the hyphen will disappear.)</p>
      <p>If you don't want a hyphen, options include:</p>
      <p>Discretionary Break — Tells InDesign the preferred spot to break a line. Will reflow if necessary. However InDesign will only apply the break if it's near the end of a line, and I've found that InDesign sometimes refuses to break where I want it to because it thinks I'm making that line too short.</p>
      <p>Soft Break —&nbsp;Forces a break at a specific spot. Gives the user total control over the break point, but may cause problems if the text reflows later.</p>
      <p>No Break — Tells InDesign not to break a word or phrase. Often used for phone numbers, URLs, etc., but can also be used to force breaks at certain points. But if the text reflows later it's possible you'll be left with an awkward break.</p>
