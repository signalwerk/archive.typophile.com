      <p>I'll reiterate something I said in <a href="http://typophile.com/node/79598#comment-454162" rel="nofollow">another thread</a> on H&amp;J: In InDesign, the more you limit the variables, the fewer options the engine has to work with, and the more likely you are to wind up with situations where the engine has to “give up” and opt for bad results.</p>
      <p>So, if you really can’t abide hyphenated lines in proximity to one another, then sure, go ahead and set the Hyphen Limit to 1 as in this example. But hyphenation and spacing are always playing against each other; the more you tie the engine’s hands in hyphenation, the more it’s going to have to compromise in spacing, and vice versa.</p>
      <p>I’ll tell you, I regularly work with an unlimited Hyphen Limit in InDesign and I rarely see more than three hyphens in a row, and even three is not that common. (In book work, that is; narrow columns will require more frequent hyphens.) The H&amp;J engine really tries not to stack hyphens and factors in penalties accordingly. </p>
      <p>Again, picking on the example above (nothing personal, Mike): If you limit the hyphenation in this case to words with minimum 7+ letters, then the engine will not be allowed to break words like “tim-ber,” “vic-tim,” “zig-zag,” et cetera. (There are probably thousands of examples.) </p>
      <p>If you really can’t stand these sorts of breaks, then by all means, set that limit. But otherwise, why not give it as much leeway to make good choices as it can get?</p>
      <p>You should really only limit it with what you absolutely cannot abide.</p>
