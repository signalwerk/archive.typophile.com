      <p>Discretionary hyphen will work to force a break if you place it at the beginning of a word, before the first letter.</p>
      <p>But if one wants this kind of micro control over paragraphs and over each line, then it’s probably better to use the single-line composer, instead of the paragraph composer. That way, micro tweaks like those mentioned will do exactly what is expected, as opposed to causing the justification engine to recalculate the entire paragraph, which will often then come up with a different solution than the one intended by the compositor.</p>
