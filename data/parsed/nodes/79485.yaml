      <p>&gt; [my classes] are not graphic design but intro/overview classes</p>
      <p>The three discussions mentioned have a lot of excellent advice. But if you're teaching beginners, I'd suggest just giving them a few basic tips, rather than trying to make them into justification experts.</p>
      <p>Show them some "before/after" examples of good and bad hyphenation.  Explain how line length affects hyphenation. Show how to turn hyphenation on and off, and explain a few of the basic settings. Point out that the Help files for each program explain the other settings if they want to refine the hyphenation further. And show them the right way to manually insert line breaks.</p>
      <p>By the way, one mistake I've frequently noticed in beginning designers is that they insert hard line breaks when manually changing line breaks. This is bad technique, as they are actually creating a new paragraph when they do that. They should use soft breaks instead (shift-return in InDesign).</p>
      <p>Here are a few other goofs I often see. They'll force a line break by inserting a tab or multiple blank spaces, which can cause problems if the text reflows later. And this may be slightly off topic, but many beginners don't know how to use the "indent to here" command in InDesign; a command that's extremely useful in many situations.</p>
