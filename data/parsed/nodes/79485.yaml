      <p>It sounds like a lot of the justification issues that you are having are due to the types of breaks that the students are using. I would suggest teaching them the proper use of breaks that James mentioned above. To improve the look of the justification, make sure you teach them to use their justification settings for a paragraph style (Mac [CMD-SHIFT-OPT-J] win [CTRL-SHIFT-OPT-J). Ugly hyphenation can also ruin a block of copy, so consider the hyphenation settings also. </p><div class="imageWrap"><img src="http://typophile.com/files/justification_3498.png"></div><div class="imageWrap"><img src="http://typophile.com/files/hyphenation_5703.png"></div><br>
      Keep in mind that I am just a student myself, so you can probably get more advanced or specific advice from some of the other members here.<p></p>
