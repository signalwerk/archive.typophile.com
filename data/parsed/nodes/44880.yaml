    <div class="info">Submitted by <a href="/web/20080516072814/http://www.typophile.com/user/7006" title="View user profile.">paul d hunt</a> : 1.May.2008 7.26am </div>
      <p>P22 Sneaky is the newest font by award winning type designer Michael Clark. Sneaky is a connecting-script and sibling of his popular “Pooper Black” type, which shares a similar flow and casual elegance. It features shared details and relative size so that with careful design, the two can be mixed and matched. Sneaky Pro features over 500 glyphs with alternates and a Central European character set.</p>
    <p>The font is available in regular TT/PS/OT formats for only<br>
    $19.95 or in Pro OpenType format for $29.95 (that’s less than 6 cents per glyph!).<br>
    <a href="https://web.archive.org/web/20080516072814/http://www.p22.com/ihof/sneakypro.html" title="http://www.p22.com/ihof/sneakypro.html">http://www.p22.com/ihof/sneakypro.html</a></p>
    <p>P22 type foundry<br>
    <a href="https://web.archive.org/web/20080516072814/http://www.p22.com/" title="http://www.p22.com">http://www.p22.com</a></p>
