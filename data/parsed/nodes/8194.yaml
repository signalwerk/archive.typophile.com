    html: "<p>Michael,  <br> <br>Metafont can only produce bitmap fonts which is a severe limitation. Nowadays, people usually create outline fonts since they are scalable and usable in different resolutions. There are tools that convert .mf to Type 1 or TrueType but this is done by autotracing which results in rather poor quality.  <br> <br>There is a related product called Metapost, created by John Hobby, which allows parametric creation of PostScript graphics. This was later extended by Boguslaw Jackowski, Piotr Strzelczyk and Janusz Nowacki to MetaType1, an outline-based parametric font creation system. However, just like many other parametric font creation systems (e.g. Font Chameleon, Infinifont, LiveType), it never gained the necessary momentum. With no professional support and no solid user interface, the tools for creating these sorts of fonts were never able to reach a broad user base. Even Multiple Master fonts that had good user interface tools (Fontographer, FontLab) were dropped because handling them turned out to be too complicated and the revenues were too limited.  <br> <br>Developing mature applications is a long and laborous effort. The commercial market is difficult, which is visible with the fact that numerous efforts such as Fontographer, FontStudio , TypeDesigner or RoboFog \"died\". The open source community is too weak to develop a good specialty tool of that sort (open source projects work well with mass products such as Mozilla or OpenOffice, with hundreds of engineers working in their spare time or on government/organizational funding).  <br> <br>Today, with the exception of DTL FontMaster and FontForge (which is free), FontLab is the only font creation application that is actively being developed. First version of FontLab was created 12 years ago and in that process, we have learned that a good user interface is crucial to a success.  <br> <br>Font creators are mostly designers, not engineers. They need visual tools. Also, type is often too subtle to rely on parametric creation. While it would be tempting to re-use the exactly same shape of a serif on n, m, i and l, often, subtle changes need to be made for best effect. The more subtle and refined the letterforms get, the less the parametric approach is useful. Donald Knuth's Computer Modern isn't a particularly well-designed typeface and frankly, I have never seen a good typeface made with Metafont.  <br> <br>When people make a profession out of creating type, i.e. they make their living on type design, the issue of a tool being free becomes less relevant. Also, tools such as Metafont are only nominally free. There are no licensing costs but there are substantial costs of maintenance, support and learning. The learning curves are steep, the user communities are small and not integrated, there is no professional support. Therefore, if you work with tools such as Metafont, you're often left on your own. This is a fact often overlooked by those who advertise free or open source software.  <br> <br>There is a good selection of links about parametric font creation at:  <br><a href=\"http://www.myfonts.com/activity/parametric-fonts/\" target=\"_blank\">http://www.myfonts.com/activity/parametric-fonts/</a> <br> <br>Regards, <br>Adam</p>"
