    html: <p>Please be kind, this is my first posting here. <br> <br>I have used MetaFont for around a year now, and there are a few misconceptions.  Indeed, MetaFont is a programming language (which is, BTW, well-documented in the MetaFontBook by Knuth) and there are relatively few fonts for it.  However, with the use of other utilites include a lovely little utility called MFtrace and FontForge, it is possible to create a complete family as any FontForge format (TTF, OTF, PFA, etc.).  For further information on tracing of MetaFonts, look at the Lilypond project ( lilypond.org ). <br> <br>If anyone is interested, I can post some of my MetaFont work (it's not great, but it might give an idea). <br> <br>Adam, I just now noticed that you mentioned autotracing.  It is worth a look at Lilypond to judge its quality yourself. <br> <br>-ray_theray</p>
