      <p>Why does nobody use Metafont? FWIW, I reckon the main reasons are:
      </p><ul>
      <li>Metafont programming is difficult; </li><li>Metafonts can't be converted to Type1 or TrueType, so they can only be used with TeX; </li><li>(Related to the above) Metafonts can't be sensibly embedded in PostScript or PDF files so that they look good on screen.</li>
      </ul>
      <p></p><p> <br>Actually I tend to regard Metafont as an interesting failed experiment. The original idea, that a family of type could be constructed by essentially mechanical means from a single source, turned out to be much too naive (as the Metafonters discovered when they got Zapf's drawings for Euler, and saw that the bold glyphs were not simply the regular ones with thicker strokes!) <br> <br>In Knuth's original AMS article on typesetting, he appears to imagine that one could discover a precise mathematical description capturing the Platonic essence of each glyph, and that different typefaces could then be instantiated by setting appropriate parameters. <br> <br>All that said, it would be very interesting to see what an expert tech-savvy type designer could do with the framework. It's clearly a very bad way to digitise existing designs, but I'm sure something novel and interesting could be made by taking its strengths and limitations into account. Sadly there is no real incentive for such a person to try, until somebody works out a way to convert the result into a font format that could reasonably be offered for sale.</p>
