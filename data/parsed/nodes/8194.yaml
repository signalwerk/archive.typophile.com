    html: <p>Metafont was mind-blowingly advanced when it was first developed (most people forget how much of a debt digital typography today owes to MF and TeX), but the real problem is that it has gotten hardly a whit of new development since John Hobby graduated and moved on. The lack of <i>any</i> sort of GUI is an absolute killer, and the lack of good export to widely used outline formats also hurts deeply. <br> <br>Both problems could be addressed, but haven't. I consider autotracing of bitmaps to be a bandaid rather than a practical solution for working type designers. A proper conversion requires the ability to compute offset curves and boolean operations in cubic Bezier space, which is pretty much rocket science (as it happens, you also need both of these operations to emulate Benton optical scaling, so it's likely I'll write and release code, at least for the primitives). <br> <br>I haven't done enough actual work in Metafont or FontLab (with its Python scripting hooks), but I have read the relevant documentation for both, and suspect that the latter has in fact come close to replicating what Metafont had almost twenty years ago. Of course, this time around there's a decent UI and a viable support community, which is, as Adam points out, much more important than pure technical achievement. <br> <br>Metafont and FontForge may be "only nominally free" in the sense of money changing hands, but freedom in the sense of free software is a different beast altogether. One of the main advantages is that, for all its weaknesses and the difficulty of climbing a learning curve, it won't die just because its creators go out of business. Of course, without a viable community around the software, that's more of a theoretical than a practical advantage, sigh.</p>
