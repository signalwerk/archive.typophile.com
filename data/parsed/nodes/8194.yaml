    html: <p>Many type designers come into type design via the world of Graphic Design, which is more visual than not. Before beginning to draw letters, many of us were already fluent in vector applications like Illustrator and Freehand. Because of this, I personally view something like Metafont as having too steep of a learning curve. Besides, I don't see what benefit it would bring. <br> <br>Also, it may be noble that Metafont is a free standard, but I would rather support companies like FontLab, who I also think is noble even though it is a commercial entity.  <br> <br>The same goes for Apple, actually. I haven't ever had any doubts about shelling out the higher prices necessary for their hardware and software. I feel like I'm getting good value for my investment. I also learned design on Macs in the early 1990s, and can remember a time (even though I was just a teenager) where there was still alot, design-wise, that one couldn't do as well on a PC. Apple and the modern graphic design industry built each other up. Almost symbiotically, if you will. I have never used TeX, and doen't know of very many designers who do. <br> <br>You are certainly welcome to design with Metafont. I'll bet that you can even get tips and support here on Typophile! But it isn't the direction that the industry seems to be going in (or has been going in for a decade and a half). <br> <br>FontLab, especially when used in conjunction with Python scripting, is a rather powerful tool as well. But I don't have the requisite knowledge necessary to make a comparison between its capabilities and Metafont's.</p>
