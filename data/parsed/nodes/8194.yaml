    html: <p>Speaking of Lilypond, they’re now in a process of switching from autotracing to direct conversion from MetaFont sources to PostScript Type 1 with a tool called <a class="freelinking external" href="http://ctan.org/pkg/mf2pt1" rel="nofollow">MF2PT1</a>. It’s a Perl piece of code that uses MetaPost for PostScript output plus Type 1 Utilities and FontForge for font assembly and some post-processing. The overall idea is similar to MetaType1, but as far as I can tell the restrictions are less severe.</p>
