    html: "<p>Jacob,  <br> <br>for anybody interested in creating parametric fonts using the MetaFont paradigm, I recommend looking at MetaType1. It is a package developed by Boguslaw Jackowski, Piotr Strzelczyk and Janusz Nowacki, with some recent support from Johannes Kuester. It is based on MetaPost by John Hobby. MetaPost uses a similar concept as MetaFont, but its output is PostScript code (real outlines), not bitmaps. MetaType1 turns this arbitraty PostScript code into Type 1 code, also allowing adding hints and other font-only related information.  <br> <br>MetaType1 was presented on several TeX conferences:  <br><a href=\"http://www.ntg.nl/maps/pdf/26_15.pdf\" target=\"_blank\">http://www.ntg.nl/maps/pdf/26_15.pdf</a> (paper) <br><a href=\"http://www.ntg.nl/eurotex/JackowskiMT.pdf\" target=\"_blank\">http://www.ntg.nl/eurotex/JackowskiMT.pdf</a> (slides) <br> <br>The big difference between MetaPost+MetaType1 and MetaFont+MFtrace is that using MetaPost+MetaType1, you don't do autotracing but work on actual high-quality outlines all the time. MetaType1 has been used to create or extens several fonts, most of them available free of charge from: <a href=\"http://www.gust.org.pl/fonty/\" target=\"_blank\">http://www.gust.org.pl/fonty/</a> <br> <br>You can get MetaType1 from <a href=\"http://www.typoma.com/en/projects.html\" target=\"_blank\">http://www.typoma.com/en/projects.html</a> <br> <br>Regards, <br>Adam Twardoch</p>"
