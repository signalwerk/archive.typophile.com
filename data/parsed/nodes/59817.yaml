  html: |-
    <p>When I place text in Indesign, it automatically flows into the columns created. How can I over-ride that and place text on the whole page, by simply clicking (the icon for place - apple D) and without having to create a text-frame within the page margins?</p>
    <p>thanks in advance</p>
    <p>Girish</p>
