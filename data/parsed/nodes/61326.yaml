    <p>Hi everybody<br>
    I´m new here so please be kind!<br>
    I´m a Graphic Design student in the university of Buenos Aires, Argentina.<br>
    I have a typography project, that consist in designing a book. i choose Dracula<br>
    and I need a legible font for the text and other for the titles if anybody knows of some would be great! and if you like to give me some tips or suggestions for the design of the book would be great too!</p>
    <p>thanks!</p>
