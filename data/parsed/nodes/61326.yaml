    html: <p>The book was first published in 1897- if you’re after a faithful rendition, late nineteenth century style, Matthew Carter’s Miller would probably be the best choice as the main text font. I doubt the digital Centaur will work well, instead - apart from the fact that there seems to be little relationship between the Victorian age and the Aldine/Venetian typefaces from the Renaissance era. But I guess that - apart from historical considerations - the first thing you should consider is using a good, legibile typeface for a long text, and many have been produced in recent years.</p>
