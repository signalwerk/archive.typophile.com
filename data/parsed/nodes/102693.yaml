    <p>Sign up for Fonts.com Master plan: <a href="http://bit.ly/15YvHyt" title="http://bit.ly/15YvHyt">http://bit.ly/15YvHyt</a><br>
    Google Fonts Users Download Skyfonts: <a href="http://bit.ly/14S9P85" title="http://bit.ly/14S9P85">http://bit.ly/14S9P85</a><br>
    Register for SkyFonts webcast: <a href="http://bit.ly/ZjFbNn" title="http://bit.ly/ZjFbNn">http://bit.ly/ZjFbNn</a></p>
    <p>Monotype teamed up with Google to offer versions of Google Web fonts designed for print. Users of Google Fonts can now work with free, desktop versions of Google Web fonts accessed through Monotype’s patent-pending <a class="freelinking external" href="http://www.fonts.com/web-fonts/google " rel="nofollow">SkyFonts</a>™ technology, which enables cloud-based access to OpenType® fonts. </p>
    <p>SkyFonts is a desktop client utility that operates in the background of Macintosh® or Windows® machines, activating and deactivating OpenType fonts that are available for all applications on the user’s system. Moving forward, as new Google font data is released, such as when characters are added to a font, or when other font enhancements or updates are made, SkyFonts delivers them to users automatically.</p>
    <p>Users of Google Fonts can visit <a class="freelinking external" href="http://www.fonts.com/web-fonts/google " rel="nofollow">Fonts.com/web-fonts/google</a> to download SkyFonts and access desktop versions of the complete Google Fonts inventory. Like Google Fonts, the service is free.  </p>
    <p>Google Fonts users with Fonts.com Web Fonts subscriptions can also use SkyFonts to install and temporarily try typefaces before purchasing on Fonts.com.</p>
