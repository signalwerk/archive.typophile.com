    <p>Apologies for the total newbie question, and if it has been answered before then please direct me to the relevant thread, but I am shortly intending on buying a new laser printer (mono) and was wondering whether I should be looking for a really high DPI or LPA? Or are the two impossible to separate (i.e. you cannot have a low DPI and a high LPI)?</p>
    <p>I am currently thinking of the <strong>HP LaserJet P2055d</strong> which has 1200×1200dpi? Is a Postscript printer I should be aiming at instead? Mostly my work involves rather long technical reports and environmental reports but I wouldn't want to short-change myself too much on quality. I haven't got a massive budget on this so this seems quite a good deal.</p>
    <p>Any thoughts or tips would be appreciated.</p>
