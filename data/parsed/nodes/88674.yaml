      <p>LPI has a semi-arbitrary relationship to DPI. Overall DPI is your first indicator of print quality. Though there are other factors.</p>
      <p>These days, PostScript is not a necessity, especially if you are primarily printing reports. Your HP does have PostScript emulation, which is a third-party clone of PostScript, in the event you need it. For your usage, I don't see any major advantage for having Adobe PostScript.</p>
