      <p>Sebsan:</p>
      <p>You have to make sure only the table (no extra returns before or after) is selected before you cut-and-paste, otherwise it gets hashed. Importing the file often works better.</p>
      <p>Adobe has an excellent forum for InDy help, both mac and PC:</p>
      <p><a href="http://www.adobeforums.com/cgi-bin/webx?14@@.ee6b330" title="http://www.adobeforums.com/cgi-bin/webx?14@@.ee6b330">http://www.adobeforums.com/cgi-bin/webx?14@@.ee6b330</a></p>
      <p>Although it’s listed as “user-to-user”, many Adobe wizards hang out there.</p>
      <p>EDIT: just re-read your post, &amp; realize that you tried to “place”; not enough coffee yet this morning ... although sometimes it works best to place into a “scratch” file, then you cut-and-paste within InDy, not between 2 applications.</p>
