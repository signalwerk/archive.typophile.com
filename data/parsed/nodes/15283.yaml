    <p>Hi,</p>
    <p>I was wondering what were the options to copy tables from Words to InDesign. A simple <em>copy-paste</em> doesn’t seem to work for me. I loose the grid in the process.<br>
    It works fine when I import or <em>place</em> the Words document in InDesign, but that is not a good solution for the job I have to do since the Words documents I receive from my client contain hundreds of tables. Unless I recompile the data and place one table per Words document which would take months.</p>
