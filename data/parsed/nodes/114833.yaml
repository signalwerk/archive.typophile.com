      <p>Thanks for the suggestion, Nick. Beaufort® Extended Regular or Medium would be a great alternative to Modesto Lite Expanded. Then I could use Beaufort® Regular as the text.</p>
      <p>I would like a little more contrast, however.</p>
      <p>I’d like a good sans serif text font to pair with Modesto Lite Expanded. I’ve tried Avenir and Neue Haas Grotesk, and I’ll try Hypatia, as suggested above. Further  suggestions would be appreciated.</p>
