    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/17745" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Designers</a>&nbsp;: Morris Fuller&nbsp;Benton</strong></p>
    <p>Morris Fuller Benton (November 30, 1872 – June 30, 1948) was born into the type business. His father, <a href="/node/16219" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Linn Boyd Benton</a>, was a type-founder and the inventor of the matrix-cutting machine, which revolutionised printing. The son graduated as a mechanical engineer from <a href="/node/add/wiki?edit%5Btitle%5D=Cornell" title="Create node &quot;Cornell&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Cornell</a> and went to work with his father in the newly established type design department of the <a href="/node/13552" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">American Type Founders</a> Company. He went on to become the most prolific designer in America, producing more than 180 types of great diversity. Despite all this, he is less well known today than his contemporary <a href="/node/19481" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Frederic W. Goudy</a>. However, his types have been much digitized and revived, especially by <a href="/node/13681" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Font Bureau</a>.  </p>
    <p>Morris was the chief type designer of the <span class="caps">ATF</span> from 1900 to 1937, and designed a great many typefaces, ranging from revivals of historical originals, such as <a href="/node/12481" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Garamond</a> and <a href="/node/33638" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Bodoni</a>, to new faces of existing fonts such as <a href="/node/add/wiki?edit%5Btitle%5D=Goudy" title="Create node &quot;Goudy&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Goudy</a> and <a href="/node/80529" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Cheltenham</a>, to strikingly bold and original designs such as <a href="/node/add/wiki?edit%5Btitle%5D=Hobo" title="Create node &quot;Hobo&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Hobo</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Stymie" title="Create node &quot;Stymie&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Stymie</a>, and <a href="/node/add/wiki?edit%5Btitle%5D=Broadway" title="Create node &quot;Broadway&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Broadway</a>. In addition, his “gothics” such as <a href="/node/45456" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Franklin Gothic</a> and <a href="/node/add/wiki?edit%5Btitle%5D=Alternate%20Gothic" title="Create node &quot;Alternate Gothic&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Alternate Gothic</a> are much more similar to modern sans-serif fonts such as <a href="/node/13514" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Helvetica</a> than the crude, <a href="/node/19193" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Grotesque</a> versions of his&nbsp;contemporaries.</p>
    <p>Morris has been credited with 221 type designs including: Adscript, Alternate Gothic, Announcement, American Backslant, Benton, Bold Antique, Broadway, Canterbury, <a href="/node/13820" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Century</a> Old Style, <a href="/node/13820" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Century</a> Expanded, <a href="/node/13820" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Century</a> Schoolbook, Chic, Clearface Gothic, <a href="/node/add/wiki?edit%5Btitle%5D=Cloister%20Oldstyle" title="Create node &quot;Cloister Oldstyle&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Cloister Oldstyle</a>, Commercial Script, Dynamic, Empire, Engravers, Engravers Text, <a href="/node/45456" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Franklin Gothic</a>, Freehand, Gravure, Greeting Monotone, Headline Gothic,Invitation, Light OldStyle, Miehle Gothic, Modernique, Norwood Roman, Novel Gothic, Parisian, Raleigh Gothic Condensed, Roycroft, Shadow, Rugged Roman, <a href="/node/add/wiki?edit%5Btitle%5D=Sterling" title="Create node &quot;Sterling&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Sterling</a>, <a href="/node/14230" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Souvenir</a>, Thermotype, Typo Script, Typo Roman, Venetian, Wedding&nbsp;Text.</p>
