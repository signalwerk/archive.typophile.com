    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Morris Fuller Benton</strong></p>
    <p>Morris Fuller Benton (November 30, 1872 – June 30, 1948) was born into the type business. His father, <a href="/wiki/Linn%20Boyd%20Benton" class="freelinking" rel="nofollow">Linn Boyd Benton</a>, was a type-founder and the inventor of the matrix-cutting machine, which revolutionised printing. The son graduated as a mechanical engineer from <a href="/wiki/Cornell" class="freelinking" rel="nofollow">Cornell</a> and went to work with his father in the newly established type design department of the <a href="/wiki/American%20Type%20Founders" class="freelinking" rel="nofollow">American Type Founders</a> Company. He went on to become the most prolific designer in America, producing more than 180 types of great diversity. Despite all this, he is less well known today than his contemporary <a href="/wiki/Frederic%20W.%20Goudy" class="freelinking" rel="nofollow">Frederic W. Goudy</a>. However, his types have been much digitized and revived, especially by <a href="/wiki/Font%20Bureau" class="freelinking" rel="nofollow">Font Bureau</a>.  </p>
    <p>Morris was the chief type designer of the ATF from 1900 to 1937, and designed a great many typefaces, ranging from revivals of historical originals, such as <a href="/wiki/Garamond" class="freelinking" rel="nofollow">Garamond</a> and <a href="/wiki/Bodoni" class="freelinking" rel="nofollow">Bodoni</a>, to new faces of existing fonts such as <a href="/wiki/Goudy" class="freelinking" rel="nofollow">Goudy</a> and <a href="/wiki/Cheltenham" class="freelinking" rel="nofollow">Cheltenham</a>, to strikingly bold and original designs such as <a href="/wiki/Hobo" class="freelinking" rel="nofollow">Hobo</a>, <a href="/wiki/Stymie" class="freelinking" rel="nofollow">Stymie</a>, and <a href="/wiki/Broadway" class="freelinking" rel="nofollow">Broadway</a>. In addition, his "gothics" such as <a href="/wiki/Franklin%20Gothic" class="freelinking" rel="nofollow">Franklin Gothic</a> and <a href="/wiki/Alternate%20Gothic" class="freelinking" rel="nofollow">Alternate Gothic</a> are much more similar to modern sans-serif fonts such as <a href="/wiki/Helvetica" class="freelinking" rel="nofollow">Helvetica</a> than the crude, <a href="/wiki/grotesque" class="freelinking" rel="nofollow">grotesque</a> versions of his contemporaries.</p>
    <p>Morris has been credited with 221 type designs including: Adscript, Alternate Gothic, Announcement, American Backslant, Benton, Bold Antique, Broadway, Canterbury, <a href="/wiki/Century" class="freelinking" rel="nofollow">Century</a> Old Style, <a href="/wiki/Century" class="freelinking" rel="nofollow">Century</a> Expanded, <a href="/wiki/Century" class="freelinking" rel="nofollow">Century</a> Schoolbook, Chic, Clearface Gothic, <a href="/wiki/Cloister%20Oldstyle" class="freelinking" rel="nofollow">Cloister Oldstyle</a>, Commercial Script, Dynamic, Empire, Engravers, Engravers Text, <a href="/wiki/Franklin%20Gothic" class="freelinking" rel="nofollow">Franklin Gothic</a>, Freehand, Gravure, Greeting Monotone, Headline Gothic,Invitation, Light OldStyle, Miehle Gothic, Modernique, Norwood Roman, Novel Gothic, Parisian, Raleigh Gothic Condensed, Roycroft, Shadow, Rugged Roman, <a href="/wiki/Sterling" class="freelinking" rel="nofollow">Sterling</a>, <a href="/wiki/Souvenir" class="freelinking" rel="nofollow">Souvenir</a>, Thermotype, Typo Script, Typo Roman, Venetian, Wedding Text.</p>
