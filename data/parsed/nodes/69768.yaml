  html: |-
    <p>I at first thought they were the same family, but after looking at them side by side, at lease the S is different.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/modern_house_font_5180.jpg"></div><br>
    The Modern House family is used throughout the book in various weights, bold through light/ very light, and doesn't appear in italics.<p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/make_1_4789.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/make_2_6674.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/make_4_4250.jpg"></div><br>
    The Make Magazine Headline font is used in stencil, but may have other weights and styles.<p></p>
