  html: |-
    <p>I at first thought they were the same family, but after looking at them side by side, at lease the S is different.</p>
    <p><img src="/sites/default/files/old-images/modern_house_font_5180.jpg"><br>
    The Modern House family is used throughout the book in various weights, bold through light/ very light, and doesn't appear in italics.</p>
    <p><img src="/sites/default/files/old-images/make_1_4789.jpg"><br><img src="/sites/default/files/old-images/make_2_6674.jpg"><br><img src="/sites/default/files/old-images/make_4_4250.jpg"><br>
    The Make Magazine Headline font is used in stencil, but may have other weights and styles.</p>
