    <p>This is a face I designed when in New York last summer.  It's really two faces, one plain sans and one, well, experimental variant. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/sample-580_5326.png"></div><p></p>
    <p><a href="http://glyphobet.net/blog/wp-content/uploads/2008/02/sample-800.png" title="http://glyphobet.net/blog/wp-content/uploads/2008/02/sample-800.png">http://glyphobet.net/blog/wp-content/uploads/2008/02/sample-800.png</a></p>
    <p>There will probably never be lowercase.  I haven't designed numerals or punctuation yet. Let me know what you think.</p>
