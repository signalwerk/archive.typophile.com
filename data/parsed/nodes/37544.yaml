    html: |-
      <p>I'm curious what the point is of identifying the fonts in all these rock band logos? I think you said before that you're using them in a fanzine (or something similar.) If that's the case, you've already got them scanned, why not just use the scanned images?<br>
      Unless you need to set text in a similar font, I don't know why you'd go through the effort of trying to re-create these from fonts. After all, having the fonts is only one part of re-creating the logo, then you need to set the text exactly the same as it was set in the logo, and use any effects applied.</p>
      <p>Jason C</p>
