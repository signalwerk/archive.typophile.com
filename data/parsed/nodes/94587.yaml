    html: |-
      <p>See <a href="http://www.microsoft.com/typography/tt/sbit.htm" rel="nofollow">Making TrueType bitmap fonts </a> -- but please note the "last updated" date ...</p>
      <p>Bitmap-only fonts are really a technology of the past, and FON files even more so. The Windows 7 command line console must be the very last software to actively need it!</p>
      <p>My home system, Mac OS X, allows <em>any</em> installed font to be used for its Terminal. And it has more advantages -- for example, Terminal also supports ANSI coloring, XTerm style. The same program on Windows 7 shows lots of useless uninterpreted escape codes, since I have no idea how to install ol' ANSI.SYS on Win 7.</p>
