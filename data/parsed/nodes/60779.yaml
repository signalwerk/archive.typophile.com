    html: <p>Not sure if Roman examples will be of use, but Martin Majoor has an open “b” in <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_scala_ot_collection">Scala</a> and <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_nexus_serif">Nexus</a> serif. Unfortunately, he closes it for the italics.</p>
