    <p>I am having trouble with a PS Type 1 font I built in Fontographer nine or ten years ago.</p>
    <p>I was advised to put the Euro glyph in the place of "currency" symbol (unicode 00A4).</p>
    <p>Shift-Option-2 used to bring up my Euro glyph just fine. I have old docs with it in use.</p>
    <p>But today, my CS4 apps insist on substituting a Myriad or Arial Euro glyph when I hit Shift-Option-2 instead of the one I built for my font.</p>
    <p>I can access my original euro symbol through the glyph pallet but it swaps out when I use the key strokes.</p>
    <p>Do I need to re-engineer the font? Or is there another key stroke combination that will bring up the proper glyph without substitutions?</p>
