      <p>I didn't want to re-engineer the old type one font because it's one in a 12 part family set.</p>
      <p>But opening them up in Fontlab, I realized several glyphs have bad names and unicode.</p>
      <p>So I fixed them all and re-imported kerning metrics. Now I need to generate the font.<br>
      _________</p>
      <p>I know type one is supposed to go by the wayside soon --probably-- but I still need to supply a type one set to the foundry.</p>
      <p>I never have figured out how to set up the suitcases for type one with Fontlab. And it was so easy in Fontographer!</p>
      <p>The default suitcase names are Plain, Italic, Bold and Bold Italic. But my old font has:<br>
      Light<br>
      Light Italic<br>
      Light Small Cap<br>
      Medium<br>
      Medium Italic<br>
      Medium Small Cap<br>
      Bold<br>
      Bold Italic<br>
      Bold Small Cap<br>
      Black<br>
      Black Inline<br>
      Black Outline</p>
      <p>I know I've seen this discussed here before. But I can't seem to find the link now.</p>
      <p>Anybody have that link?</p>
      <p>Not that I ever did really understand it when I read it last.</p>
