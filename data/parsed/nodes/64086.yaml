    html: <p>I've had InDesign do something similar. The type engine in it has a tendency to override some things in the font itself, even in OT fonts. My guess is the app is trying to sub the Euro via unicode and finding none does a replace. Hopefully Miguel or someone will chime in on this one for you.</p>
