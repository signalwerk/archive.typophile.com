    html: |-
      <p>Unfortunately I don't have enough experience troubleshooting Type 1 fonts to be helpful here. (FWIW, the current versions of our font tools are aligned with the OpenType format)</p>
      <p>I did however install the Type 1 version of Clarendon, and was able to type the Euro sign just fine in InDesign CS4 and TextEdit (OS X v10.5.8).</p>
      <p>If it's not working in your Type 1 font, I think it will either be a glyph naming problem, or an encoding problem. (Type 1 fonts don't have a 'cmap' table, so it can't be an Unicode issue).</p>
      <p>Is the glyph named "Euro"? (i.e. not "euro" or "currency")</p>
