    html: <p>It seems to me that it's <a href="http://www.myfonts.com/fonts/linotype/itc-century/book/testdrive.html?s=PrinterPal&amp;p=72" target="_blank">ITC Century</a> with tweaked cap heights...</p>
    html_clean: <p>It seems to me that it's <a href="http://www.myfonts.com/fonts/linotype/itc-century/book/testdrive.html?s=PrinterPal&amp;p=72" target="_blank" class="link-external">ITC Century</a> with tweaked cap heights...</p>
  - id: 13931
