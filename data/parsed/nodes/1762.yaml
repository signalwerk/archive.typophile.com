    date: null
    date_raw: null
    votes: null
    html: <p>You can tell it's ITC Century because of the one-sided serif  <br>on the right leg of the lowercase n. In all other versions,  <br>this is a feature that only shows up in the bold weights.  <br>Presumably, ITC did it for consistency. Call me old- <br>fashioned, but it's always bugged the heck out of me.</p>
