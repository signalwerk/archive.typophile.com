    <p>The provisional schedule for this year's TypeTech Forum has been posted on the ATypI site... </p>
    <p><a href="http://www.atypi.org/07_Helsinki/30_program/30_other_events/10_typetech" title="http://www.atypi.org/07_Helsinki/30_program/30_other_events/10_typetech">http://www.atypi.org/07_Helsinki/30_program/30_other_events/10_typetech</a> </p>
    <p>Hope many Typohiles will be able to make it. There's still room on the schedule for additional speakers so if you have something interesting to talk about or demo please contact me directly via <a href="mailto:simonda@microsoft.com">simonda@microsoft.com</a>   </p>
    <p>Cheers, Si</p>
