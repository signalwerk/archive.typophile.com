    html: "<p>My question was a little more precise than JFP's summary. I know from experience that it is possible to design good typefaces for <i>scripts</i> that one cannot read. But I'm wondering how far, within a script, a designer can go to addressing the particular nuances of the ways individual languages use that script? <br> <br>Ironically, I see in JFP's illustrations the beginnings of an analytical, empirical approach to the question. Look, they seem to say, you can collect data, you can observe different frequencies of different kinds of letters in different languages, you can measure (optically if not mathematically) the impact of these frequencies on text. And you can do all this without knowing how to speak any of the languages. <br> <br>[Of course, this ignores all the purely cultural aspects of typography: the things that make French books look French even when they contain English texts.]</p>"
