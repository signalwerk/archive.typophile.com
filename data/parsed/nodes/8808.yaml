    html: "<p><i>I think theses differences are built by designers without noticing what they do</i>  <br>  <br>Right, but recognising this is the first step to noticing and controlling what you do. I'm sure, if one only ever <i>looks at</i> one language in print, that is all you will ever imagine. But I think it is enough to look, not necessarily to be able to read, at a diversity of languages in order to begin to appreciate the differences and to respond to them.  <br>  <br>An interesting thought: if a client came to me and said 'I want you to design a typeface, and it will only ever be used to print text in German', what would I do differently?  I think I would begin by going and looking closely at a lot of German text, so the approach to designing for individual languages is quite similar to designing for different scripts.  <br>  <br>Of course, most of the time, we're not designing for individual languages, but in the reasonable belief that a typeface is going to be used for multiple languages. This is even more the case these days, with Unicode and OpenType encouraging extension of Latin script typefaces for central Europe, Turkey, Africa, Vietnam, etc.  <br>  <br>So here's a question: do type designers try to make 'neutral' multilingual fonts, try to compromise to accomodate the features of different languages, or do type designers each have a kind of personal platonic language in their heads for which they instinctively design?  <br>  <br>Oddly, if I have such a language in my head, for which I instinctively design, I'm not sure that it is English. Maybe Latin.</p>"
    html_clean: "<p><i>I think theses differences are built by designers without noticing what they do</i>  <br>  <br>Right, but recognising this is the first step to noticing and controlling what you do. I'm sure, if one only ever <i>looks at</i> one language in print, that is all you will ever imagine. But I think it is enough to look, not necessarily to be able to read, at a diversity of languages in order to begin to appreciate the differences and to respond to them.  <br>  <br>An interesting thought: if a client came to me and said 'I want you to design a typeface, and it will only ever be used to print text in German', what would I do differently?  I think I would begin by going and looking closely at a lot of German text, so the approach to designing for individual languages is quite similar to designing for different scripts.  <br>  <br>Of course, most of the time, we're not designing for individual languages, but in the reasonable belief that a typeface is going to be used for multiple languages. This is even more the case these days, with Unicode and OpenType encouraging extension of Latin script typefaces for central Europe, Turkey, Africa, Vietnam, etc.  <br>  <br>So here's a question: do type designers try to make 'neutral' multilingual fonts, try to compromise to accomodate the features of different languages, or do type designers each have a kind of personal platonic language in their heads for which they instinctively design?  <br>  <br>Oddly, if I have such a language in my head, for which I instinctively design, I'm not sure that it is English. Maybe Latin.</p>"
