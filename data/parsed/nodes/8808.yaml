    html: "<p>so, we can't try to start again here! John Hudson posted a question on the chat: Do we need to speak the language to design a good font or something like that? <br> <br>I think so in some way. As we dream our letterforms in word of our own language, I'm pretty sure we don't see letters in same way, for their proportion and so on. <br> <br>This remind me a personal experience. When I have designed Bienvenue, I never realised that the a is pretty narrow, because the combination of it started with teh word France Telecom, and naturally the fitting was good until, couple months later, I realised that it was too narrow. I dreamed too much of the a in a context.</p>"
