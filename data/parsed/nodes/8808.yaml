    html: <p>Start with German versus French. In 1997, I realized that German use more variety/various letterforms than French. More ascenders glyphs in various combinaisons, when french use most of the time similar letters, with in some respect, more descenders, in fact very flat language physically speaking. So, German type need to be more straight, more regular to control all the letters togethers. The various forms achieve the rhythm, when in French, the same typeface can quicky be very boring, because French is naturally too flat</p>
