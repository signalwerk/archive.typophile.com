    html: "<p>John: I pretty sure you make your own analyse of the focused language. <br> <br>Take Erik Spiekermann types. There all are quite narrow, square with very large s. large top e counters, large a counter, narrow n, etc. I'm pretty sure he don't see all of \"his mistakes\" (the features I see as mistakes because I'm french! not because I better than him on typeface design!!!!). Remember the number of time when you say that my a are too narrow and French... hum (quiet perfect to me!) <br> <br>I refer to something beyond your control. its not scientific, its just because we are human with difference. <br> <br>Little in same way as a Sumner Stone typeface is very round and soft, quiet (as him, soft, quiet guy!). <br> <br> <br>Univers has been designed to fit German Italian French English perfectly. The result is the page is quite boring! Just look at his books with three columns three languages in same Univers. <br> <br>What can be fun is to apply languages features for OpenType with various letterforms depending of the language used!!! WGL4 with this feature (who make the double work -- without considering the size feature) can be very fun to do ;-) <br> <br></p>"
