    html: "<p>{Changing my torn-up clothes...} <br> <br>JF, it's great to see \"linguistic sensitivity\"! <br> <br>In your nice page with the illustrations there are some interesting things about letterform width with respect to language. I also wonder about two other things: <br> <br>1) Variations in vertical proportions. <br>2) Variations in spacing. <br> <br>For #1, I would point out your figure #5, and note that German relies more on extenders than either French or English. Does that mean German needs a smaller x-height? Especially when you also consider that German words are longer (and a smaller x-height would allow for less overall width of words)? This can also be considered for Latinate languages that use a lot of accents - which is one reason Bilak's Eureka has a small x-height. <br> <br>For #2, I would point to your figure #2, and note that German seems to have more x-height verticals in proportion to rounds - does that affect \"default\" spacing? <br> <br>(Man, I'm actually glad I didn't have to type that over 20 lines in a chat room...) <br> <br>hhp <br></p>"
