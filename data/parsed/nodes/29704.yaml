    html: |-
      <p>Personally, I wouldn't call Democrats right wing because they support the welfare state--now often called the 'safety net'. </p>
      <p>Nader represented a more left-wing approach in his run as leader of the Green Party in the 2000 election. However, he received a less than 3% vote. Not enough to make him a factor for federal funds for the next election--his goal--but enough to elect George W. Bush over Albert Gore.</p>
      <p>There is definitely a left wing within the Democratic party. In order to understand US politics, you need to understand that it is not a proportional representation system. The parties tend to have a much broader range of views within them, and the compromises on policy take place within a party, rather than by coalition of parties. </p>
      <p>That being said, it is true that the US has never had a large socialist movement or party. </p>
      <p>In my view the results of this difference, internally, have been policies in the past 50 years that have been in some respects better than Europe--leading to a more dynamic economy--and in some respects worse, in failing to implement a key feature of the welfare state, namely health security for all citizens. </p>
      <p>After the voting rights act of 1965, which empowered the African American vote, the South turned against the Democratic party. As a result, Republicans have been in the majority more often than not ever since. With the steadily increasing number of new immigrants (over 10% of US citizens are foreign born) this may change. My hope is that this past election represents the beginning of a new era, but time will tell.</p>
