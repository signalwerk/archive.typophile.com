      <p>I always thought fonts (and most software) were subject to use under their EULA. Since you do not actually buy the font itself, only a licence to use it, you must use it according to that licence. In most cases, that involves not distributing the fonts for free.</p>
      <p>But you're right, there's nothing to stop you from doing it, just like there's nothing to stop you from slipping a candy bar into your pocket at the grocery store (to use a tired analogy). A lot of crimes are hard to enforce because they are very hard to detect. That doesn't mean they should be committed.</p>
      <p> - Lex</p>
