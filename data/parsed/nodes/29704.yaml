      <p>&gt; <em>If they aren’t recognized by the gov’t as intellectual property, then why are they not being distributed freely but rather sold?</em></p>
      <p>Since when can the government be trusted to be <em>right?</em> :^D</p>
      <p>&gt; <em>I had no ideas fonts could be copyrighted commercially to be sold for a profit (...).</em></p>
      <p>Why not? Designing a typeface is an artistic activity, just like composing music, painting or making a film. Why should it have any less rights than the others to be sold for profit? Type designers spend countless hours of hard work and a vast amount of skill and creativity in designing and producing a good working typeface. I can imagine they want to get paid for that.</p>
      <p>Life for a type designer is not free, contrary to popular belief. It's not like they haven't got bills to pay. "Oh, you're a type designer? That's all right, you don't have to pay your mortgage." "You say you're a type designer? No prob, the groceries are for free." "Type designer, huh? Fill up your car, no need to pay."</p>
