      <p>&gt;they can’t lawfully be charged</p>
      <p>Yes they can, at least in civil court. In Adobe vs SII, this was done successfully. Also a publisher recently had to pay tens of thousands of dollars for using pirated fonts. And there are other cases. Do you expect type designers--or anybody else--to work for nothing? How are they going to eat?</p>
      <p>&gt;fake democracies</p>
      <p>Yves, what is fake about US democracy? </p>
      <p>Admittedly, the legislative process in the U.S. is to a degree corrupted by money. However, when voters are fed up with people or policies they do make their voices heard. This past election changed both houses of congress. So to me American democracy looks flawed, but not fake.</p>
      <p>You may not like the choices that the American public makes--and I often don't--but that is a different matter from democracy.</p>
