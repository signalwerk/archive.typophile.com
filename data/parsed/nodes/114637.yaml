      <p>That’s really nice attempt! It feels nostalgic.<br>
      Some critics:<br>
      I think Ж in light weight should be wider and I’d raise the kratka (breve) over Й. The accents on ё in regular, medium and bold are out of place.<br>
      P.S. It should say Электромузыка with first letter Э<br>
      I’d also consider making some ukrainian and belorussian letters, just to make the typeface more useful for more people.</p>
