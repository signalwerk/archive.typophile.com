      <p>Ideally you'll like to have a look at the London Underground Station Design Audits, which are held in the London Transport Museum Library. They are a guide to "<em>elements on the station[s] worth conserving as well as a pointer to possible future restoration of deteriorated or missing architectural details...London Underground wishes to conserve all those features which are representative of the station's history where they are still relevant.</em>" </p>
      <p>Unfortunately the museum itself is being 'transformed', so I don't know how accessible the collection is. The website can be found here - <a href="http://www.ltmuseum.co.uk/" rel="nofollow">http://www.ltmuseum.co.uk</a>.</p>
      <p>No idea if this book lists stations with original fittings, but it's worth a look - <a href="http://www.amazon.co.uk/exec/obidos/ASIN/1854142313/qid=1140384229/sr=1-4/ref=sr_1_0_4/026-6296368-4802057" rel="nofollow">Johnston's Underground Type</a>.</p>
      <p>Aldgate's audit mentions "<em>platform canopy at North end probably 19th Century originals. They incorporate 1920s brass trimmed free standing signs.</em>" Not sure if they are 'original' or not, a quick search on flickr found <a href="http://www.flickr.com/photos/ickoonite/23312491/" rel="nofollow">this</a> (I seem to have misplaced all my photographs of the station). It also found this, at <a href="http://www.flickr.com/photos/iantindale/38978031/" rel="nofollow">Aldgate East</a>, just down the road. </p>
      <p>I presume the latter is what you're looking for, and I know there are a lot of the older signs at many of the stations - including tiles - but offhand I couldn't say which. Some of the more central stations ring a bell - Tottenham Court Road and Leicester Square - but I haven't been on a tube for quite some time; south east London doesn't have many tube stations.</p>
