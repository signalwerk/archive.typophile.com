    html: <p>It's been nearly 14 years since I was there, but I remember being pretty impressed by the London City Musuem--by its comprehensiveness in particular. I would not be surprised at all to learn that some of Johnston's original work was being preserved there, in storage or in the exhibits. Give it a try--and like I said, it's a great musuem anyway.</p>
