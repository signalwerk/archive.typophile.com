  html: <p>Hello, I am an amateur font-designer. I mostly do handdrawn sketches, as I can't afford a real fontprogram. Anyway, I wondered how a font based on the musical G-key would look like. I have done some sketches, and I will scan them and post them soon. How do you think it would look?</p>
