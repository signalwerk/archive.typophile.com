      <p>The first poster's lettering reminds me of Schneidler Initials, the basis of Jason Castle's <a href="http://www.myfonts.com/fonts/castletype/shango/" rel="nofollow">Shango</a>.</p>
      <p>The others with the sans lettering remind me of Optima, which I know was designed later, or one of Koch's lineales from the 30's, like Offenbach (see Jaspert for a sample).</p>
      <p>- Mike Yanega</p>
