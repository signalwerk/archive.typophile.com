  html: <p>Hi, <br>I have visited Ascender Corp. site where one can buy Microsoft's fonts. Between Verdana, Georgia and Nina I found Gill Sans (R). I thought it was Montotype's typeface. Am I right? Or not? <br>I know that it's possible to buy it at Adobe, Monotype Imaging, Linotype and Ascender. The prices are different. And what about fonts. Are they different? <br> <br>artur</p>
  html_clean: <p>Hi, <br>I have visited Ascender Corp. site where one can buy Microsoft's fonts. Between Verdana, Georgia and Nina I found Gill Sans (R). I thought it was Montotype's typeface. Am I right? Or not? <br>I know that it's possible to buy it at Adobe, Monotype Imaging, Linotype and Ascender. The prices are different. And what about fonts. Are they different? <br> <br>artur</p>
