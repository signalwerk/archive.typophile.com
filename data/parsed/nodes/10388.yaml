    html: <p>Ascender has rights to various fonts that Microsoft has rights to sublicense (not just the obvious Microsoft badged IP). The retail TTF's Ascender is offering are the latest shipping versions of these fonts. These may be important to people who need complete compatibility with the Office or Windows version of a given font.  <br> <br>Cheers, Si</p>
