  html: |-
    <p>Hello all,</p>
    <p>I'm looking for a humanist stencil font, preferably one including a true italic. </p>
    <p>The job is an identity for three women setting themselves up as a curatorial team, with a focus on painting and textiles.</p>
    <p>I quickly drew some letterforms for the pitch (see attachment,) but I'm not a type designer, and I don't have the time or the money to invest in developing it myself so I need to buy something that already exists.</p>
    <p>Thanks in advance!</p>
