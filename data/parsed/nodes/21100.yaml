      <p>I was going to comment on the 1st pdf, but you fixed a lot in the second! Forgive me if I repeat comments, as I haven't read like a good boy.</p>
      <p>Still, your thins are a little inconsistent in the caps. See the U and B especially. R leg needs a touch more length. It's lifting. Q: put some goudy in already! oops did that slip out? r needs more heft in the horizontal move. Not quite the stem width but close. That beak will be interesting to space. The f too (weight I mean).  w,v too flat on bottom for my taste. Not related at all to the uppers. More point. Dot on j and i seem boogerish, which is a technical term for too blobish in a face where pen is in evidence. Also seem high to me. lc z is too expressive relative to the rest of the lowercase, see next scentence.</p>
      <p>Somehow, I get the feeling that you're designing a set of display caps and text lc. Maybe take it one direction or the other in a commanding way. I'd go towards the caps. They say less "hello, my name is spikey palatino" than the lowers. Can you post some source that's influencing your LC?</p>
      <p>I prefer a slightly shorter cap height, but that's me.<br>
      That's more than my fair share of opining. It's a good start.</p>
      <p>Cheers,<br>
      Randy</p>
