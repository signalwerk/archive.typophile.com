      <p>Paul,<br>
      Don't take an axe to it! You have given yourself a tough task with this one.  Give yourself some time with it.<br>
      Every time I look at it, I get hung up on what is a font metrics issue and what is a glyph shape issue.  I see some proportion group issues as well.  The a as opposed to the s is the most troublesome pair.  They should feel like they are in the same proportion group but the s feels quite narrow compared to the a.  The s can work ok at display sizes but at text size, it is a dark spot.  There is a lot happening in that small space withe three horizontal curves and 2 big serifs.  You have to find a way-to open it up more like the a.  The a may be a tad too wide though.</p>
      <p>I am missing a rhythm in the lower case.  I think you need a bit more of the curve whimsey you have in the caps.  You might try a few lines with a flat pen mimicking your font just to take you out of this stiff stage.  I think you are putting too much pressure on yourself to have something for Typecon that is far along.  This puppy may take more long walks than you expect. Bring it to TypeCon in whatever stage it is by then.  Those guys may have some real insight for you to solve this anyway.<br>
      I have looked at it several times since your first post.  Every-time I think I see something that might help, I go back to it and say to myself, that is not the solution.  I mumble to myself, trying to find some sage advice but come up empty handed. A silly thing I do is look at type upside down just to take away the familiarity you get from long hours with it.  Here I go again, rambling with no nugget to give you.</p>
