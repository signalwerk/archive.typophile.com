      <p>I'm liking this… or at least parts of it. Without comparing this to any Menhardt sources, I have the following reactions:</p>
      <p>The uppercase looks much nicer than the lowercase. The lowercase looks to me like it may have been "too cleaned up." The lowercase a in particular does not feel right to me. Maybe in a text setting? The top curve feels too round and too "perfect." The bottom right does not feel like it is anchored. The b feels lighter than d, p, and q. The arm on the r feels too light and too diminutive, although I like the hook, and I think that its relationship with the s is very cute.</p>
      <p>Plus your lowercase y may be one of the best lowercas y's I have ever seen.</p>
      <p>On the caps, I have less to say. Except that the Q looks like it has been strangled by machine-setting requirements. How about more of a tail-swash?</p>
