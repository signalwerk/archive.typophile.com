    html: <p>Hey Randy, thnx a lot for taking the time to look at this. I always appreciate your insights. I have a long way to go on this before i'll be happy with it, but it's my first original serif and i think i'm learning a lot in the process. It's funny you caught that the lc looks a lot like palatino, i didn't reference it in any way while drawing this, but maybe it's just embedded in my subconciousness and came out. I'm planning a major overhaul on the lowercase. thus far i've done as much as bumping the x-height and changing the head serifs. now i want to go back and put a lot more pen influence in it, including those boogerish dots on the i and j. Your comment on trying to go too display and too text in one font is a great one. I think my problem is i'm <em>trying to</em> think in terms of optical sizes and what different sizes may look like, but all that's resulting at this point is an over-bold display face. hopefully i'll get it all wrangled out in the end so that the text version works for text and the display for, well... you know. If you want to see the sources of my "inspiration," i've tried to capture the essence of <a href="http://diacritics.typo.cz/view_image.php?id=47" rel="nofollow">Manuscript's Capitals</a> and marry them to the more stately lower case of <a href="http://diacritics.typo.cz/view_image.php?id=49" rel="nofollow">Parlament</a> while stealing the overall serif structure of Menhart Antiqua. Hopefully it will all come together for good effect in the end. Thanks for looking!</p>
