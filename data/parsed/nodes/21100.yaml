      <p>Paul, Good show dude! This thing is going to good places!<br>
      I don’t know Menharts work so I am just looking at this as just your own face and not a revival.<br>
      C D seems too wide for the O. The E F seems too wide and perhaps the U and Y as well. I really LOVE that Z and wish you could put some of that whimsey into the M V W and X.  The M seems to be out of balance with itself. The counterspace under the right side looks smaller than that under the left side. Very sweet lookin’ S but the arm of the R feels a bit stiff.<br>
      I love your f but wish there was more of that chopped curve look in some of the other lower case. The a, x, and w seem a tad wide; splendid tail on the y, do more of it! (maybe in the upper right serifs of the v w x and y). The lower case is a bit too tame for me compared to the caps but at 9 point, it may not matter as much. You might think about a more varied stem width on vertical strokes throughout the lc similar to your f.  The s seems a bit light to me and falling over right.<br>
      Relax and have fun with this puppy. It needs your sense of whimsey and it will be a fresh new feel in the text arena while still having enough pop for some display use.</p>
      <p>ChrisL</p>
