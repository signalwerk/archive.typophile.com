      <p>Hi, I am new and young so this is just an opinion, I can't claim any authority.</p>
      <p>I agree with Randy that the lc looks too much like palatino, or it seems to me it is more in the spirit of Zapf than Menhart (my only source on Menhart is Bringhurst). Zapf to me is just as much about pen as Menhart but he is so extremely mechanical in modulation and movement that it is perhaps "easier" to go that way when you do something digital. I would loosen up the lc and try to put some of Mehart's careless flair into the forms. A good example of this flair is the lc z in Manuscript, wich I don't think Zapf would pull in his wildest dreams.</p>
