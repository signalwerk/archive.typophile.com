      <p>I think there are consistency issues here. Mind you, where to break consistency--and what constitutes a break--is a matter of judgment of the designer, and different people will have different views... </p>
      <p>Not working through it systematically, here are some that appear to me. </p>
      <p>The serifs on the caps. the bottom of the E and L are much bigger than the other serifs. They can be a bit bigger, but these seem out of proportion. The vertical serifs can be a bit meatier relative to the horizontal ones, and I would go for thickening the C G etc vertical serifs rather than reducing the E L ones. Altogether, it feels to me like the serifs on the caps need more weight--at least the more pointy right sides anyway. I don't know what will work best, but I think it is worth trying a lot of variations on this, if you haven't already. </p>
      <p>Lower case. The top counter of the a sticks out as being too big. It may be that the letter is too wide overall, or that the top arm needs to be shorter, the bottom counter bigger, etc. I don't know what will work, but it looks too big now. Does it come farther above the x-height than other letters? </p>
      <p>The contrast on the e g look too little compared to other letters. Something else is off on the e; I'm not sure what. I agree with Chris the s looks narrow. But also you have big serifs compared to the size of the counters there, so that may be the problem. Also maybe the vertical part of the stroke may need to be thinner. I don't know exactly, but it needs work. </p>
      <p>The horizontals on the calligraphically stressed z seem too thick. Also on the cap Z the top I would think needs more touch of the pen if you are going to go with the calligraphic stress. Goudy had put some more calligraphic z's into his faces, so if he can do it you can too, but I think it needs more consistency within the letter. </p>
      <p>Overall, the lower case doesn't have the same unity of look as your caps, which have a nice distinctive look. I would consider, if you haven't tried already, flattening the angle on head serifs to resemble the slant on the right part of the foot serifs. This might unify the look with the upper case, which I find the most successful part of this design so far.</p>
