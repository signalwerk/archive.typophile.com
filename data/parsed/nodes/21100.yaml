      <p>The caps have wonderful liveliness. I agree with others that the  diagonals other than the Z need more modelling. You might look to Palatino, which has tapered stems, for an example of how to handle the diagonals, though here you probably would want to do more. My feeling is that the Z is a little too modulated, but that the others need some. </p>
      <p>The stress seems off on the 'e'; the north east quadrant seems too heavy. Overall, I think the stress on your round lc could be refined. The sharp link on the g doesn't seem to go so well with the rest of the character, which is round. </p>
      <p>Check whether the caps and lower case are too much the same weight. I suspect the lc could benefit from lightening. </p>
      <p>The f looks like it got its nose broken in a painful fight. I know you use the same angle on the arches of the mn, but there the contrast between the straight and round is not so great. Here it is extreme and out of character with the rest of the face. </p>
      <p>I think the thick diagonals on the lc also could also benefit with some tapering, I am guessing, though of course less than the upper case. </p>
      <p>I agree with Chris that the feel in the Z and y ought to make itself felt throughout the face. Though it is going to have to be a bit restrained if you want this to work as a text face. </p>
      <p>Good luck!</p>
