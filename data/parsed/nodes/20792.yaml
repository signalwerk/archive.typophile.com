      <p><cite>-edit (disregard this whole post!  I just saw Geoff's links. Thanks. There's my answers)</cite>  </p>
      <p>Thanks guys, but i dont think anyones actually answered the question...</p>
      <p>I know there is no substitute for kerning by eye.<br>
      Metric kerning uses the kerning info stored in the font file, but what info does the 'optical' setting in Adobe kerning use to make its adjustments.</p>
      <p>I guess i should RTFM...</p>
      <p>ok, i did.</p>
      <p>'optical' kerning in CS is used To automatically adjust the spacing between selected characters based on their shapes.</p>
      <p>Hm, see, isn't that what typographer's do when they write metrics for their typefaces?</p>
      <p>Sounds like 'optical' kerning is an approximation for faces with crappy kerning info.</p>
