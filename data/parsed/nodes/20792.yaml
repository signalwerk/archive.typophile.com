    <p>Can someone help me out?<br>
    Whats the difference between these two types of kerning?</p>
    <p>I know that metrics are instructions built into a face that gives software programs instructions about how much space to put between different combinations of glyphs.  Arent these 'metrics' set-up so that faces have correct optical spacing depending on the shape of each glyph?  If so, the what is 'optical' kerning.</p>
    <p>Specifically, i'm talking about type controls in Adobe CS programs.</p>
    <p>Thanks - JonnySchneider</p>
