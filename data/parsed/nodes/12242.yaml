    <p><strong> <a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/17745" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Designers</a>&nbsp;: Gudrun Zapf von&nbsp;Hesse</strong></p>
    <p>Gudrun Zapf von Hesse is a master book binder and lettering artist in pre- and post-<span class="caps">WWII</span> Germany. In the late 1940s, she started teaching at the Städel School of Art in Frankfurt. A typeface that she had been working on since the 1930s, <a href="/node/17010" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Diotima</a>, was released by <a href="/node/12158" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">D. Stempel <span class="caps">AG</span></a> around this time. Somehow, she must have met the chief in-house type designer there (<a href="/node/12150" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Hermann Zapf</a>), as they were married in the early&nbsp;1950s. </p>
    <p>In the 1980s, Gudrun Zapf von Hesse began designing typefaces again. She released several typefaces through <a href="/node/14085" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal"><span class="caps">URW</span></a>, <a href="/node/13429" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Bitstream</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Berthold" title="Create node &quot;Berthold&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Berthold</a>, and <a href="/node/13697" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Linotype</a>.</p>
    <p>She lives with her husband in Darmstadt, Germany. The Zapfs have a beautiful house, full of typographic&nbsp;treats.</p>
    <p><a href="http://www.linotype.com/7-647-7-16331/gudrunzapfvonhesse.html">All of Gudrun Zapf von Hesse’s Linotype faces are available on this overview page at the Linotype&nbsp;Website</a></p>
