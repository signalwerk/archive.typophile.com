    <p><strong> <a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Gudrun Zapf von Hesse</strong></p>
    <p>Gudrun Zapf von Hesse is a master book binder and lettering artist in pre- and post-WWII Germany. In the late 1940s, she started teaching at the Städel School of Art in Frankfurt. A typeface that she had been working on since the 1930s, <a href="/wiki/Diotima" class="freelinking" rel="nofollow">Diotima</a>, was released by <a href="/wiki/D.%20Stempel%20AG" class="freelinking" rel="nofollow">D. Stempel AG</a> around this time. Somehow, she must have met the chief in-house type designer there (<a href="/wiki/Hermann%20Zapf" class="freelinking" rel="nofollow">Hermann Zapf</a>), as they were married in the early 1950s. </p>
    <p>In the 1980s, Gudrun Zapf von Hesse began designing typefaces again. She released several typefaces through <a href="/wiki/URW" class="freelinking" rel="nofollow">URW</a>, <a href="/wiki/Bitstream" class="freelinking" rel="nofollow">Bitstream</a>, <a href="/wiki/Berthold" class="freelinking" rel="nofollow">Berthold</a>, and <a href="/wiki/Linotype" class="freelinking" rel="nofollow">Linotype</a>.</p>
    <p>She lives with her husband in Darmstadt, Germany. The Zapfs have a beautiful house, full of typographic treats.</p>
    <p><a href="http://www.linotype.com/7-647-7-16331/gudrunzapfvonhesse.html" rel="nofollow">All of Gudrun Zapf von Hesse's Linotype faces are available on this overview page at the Linotype Website</a></p>
