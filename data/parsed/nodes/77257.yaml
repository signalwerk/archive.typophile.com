      <p>1 &amp; 2 remind me of the logos on boxes of lawn grass seed where as I can picture the others screenprinted on a effects box or moulded in chrome-painted black plastic on an amp. The  retro block lettering suits the products. I think you need to make the leg of R a lot heavier, and the counters in B closer to the centre, the way R's counter is. I'd like to see 5 all in black with those adjustments.</p>
      <p>The bursts are perhaps a bit too ornate to work with the lettering. I think the third is best and that should be filling the space in the bottom right at optically the same height as the letters.</p>
