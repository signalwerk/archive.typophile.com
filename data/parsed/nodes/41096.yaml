    <p>dear community,</p>
    <p>as the titel suggests i am looking for suggestions concerning a sansserif typeface that..</p>
    <p>a) features an international character set (specifically latin, greek and cyrillic)</p>
    <p>b) provides itself in various weights (light, regular, medium, bold + italics)</p>
    <p>c) has a modern/grotesque appeal to it but is slightly newer/fresher/more contemporary (sorry, i know it depends on ones perspective) then 'classics' like helvetica, trade, et cetera..</p>
    <p>currently i am looking at typefaces like 'akkurat' by lineto or 'national' by klimtype which i personally really like -</p>
    <p>the typeface is supposed to be used as a corporate typeface that will be used within a complete corporate design system.</p>
    <p>any recommandations/suggestions are highly welcome/appreciated!</p>
    <p>thanks a lot + kind regards,</p>
    <p>steffen</p>
