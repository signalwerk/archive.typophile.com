    <p>Hallo.<br>
    I really need to know what font is this. Its from my friends dessert blog, we're making him a birthday present and it would be awesome if I could make him a card in a similar style. I would ask him what font he used, but it's supposed to be a surprise.</p>
    <p>Tried a couple of websides that help with font identification, came up with nothing. You're my only hope ;)</p>
