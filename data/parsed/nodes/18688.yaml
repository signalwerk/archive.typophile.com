      <p>Thanks privateortheris.   It was a garden variety TNR italic.</p>
      <p>What was throwing us off, was that it was used in a logo as a Capital letter and we kept looking a capitals in fonts trying to ID it, and never thought about it being a lower case that was sized up to match the other capitals.  </p>
      <p>Pulling it out by itself for others to look at I guess it was quite obvious.  Sometimes you just can’t see the forest for the trees.  Thanks again.</p>
