    <p>This may not be possible but am going to give it a try.  I only have one letter to ID this font with.  It is the letter V (attached).  The closest I have found is a Zapf Chancery Roman, but it is not quite it as in that font the upper left in the Zapf Chancery has two serifs and the upper right does not have the more rounded (circle).  </p>
    <p>If any one has any ideas I am most appreciative.</p>
    <p>Thanks.</p>
    <p>Willy</p>
