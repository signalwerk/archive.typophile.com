  html: |-
    <p>Can anyone help here? I'm trying to persuade a client to use Freight Sans which I believe fits better with their brand, however they've got hung up on the non-aligning numerals and I can't seem to find an easy way to set them aligned in our print. Maybe it's not possible... if that's the case, does anyone have a work around or any ideas to help sell them back to the client?!</p>
    <p>Any thought appreciated.</p>
    <p>Best,<br>
    Hugo</p>
