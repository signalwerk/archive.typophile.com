      <p>You licensed this from Phil's Fonts.<br>
      <a href="https://philsfonts.com/index.php/results/strip?q=freight+sans&amp;mysubmit=&amp;type=3" title="https://philsfonts.com/index.php/results/strip?q=freight+sans&amp;mysubmit=&amp;type=3">https://philsfonts.com/index.php/results/strip?q=freight+sans&amp;mysubmit=&amp;...</a></p>
      <p>The options are the Pro version, with small caps and alternate ﬁgures integrated as OpenType features, or the plain version, with oldstyle ﬁgures as default, and lining ﬁgures in a separate small caps font.</p>
      <p>I would suggest you either “upgrade” by licensing the Small Caps version to add to what you already have, or license the OpenType version; perhaps the distributor will give you a discount on this.</p>
      <p>**</p>
      <p>This customer service is provided by a disinterested party at no charge, but really you should be contacting the distributor from whom you licensed the font, or the foundry that made it. Why didn’t you do that, rather than asking at Typophile?</p>
