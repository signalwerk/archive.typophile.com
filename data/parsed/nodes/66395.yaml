      <p><cite>All the back label text is align left ragged right. Any justification is pretty much just by chance.</cite></p>
      <p>A mantra I like to go by is 'Dont except chance unless chance gives you perfect.'<br>
      I like ragged right aswell, but as the type is set here, I would consider having the text re-written either to:</p>
      <p>A. make the rag more obvious<br>
      B. add in the extra words you need to keep an even density in the line while allowing for justified text.</p>
      <p>Justified text was popular with the hard-core Bauhaus designers. I can hear Max Bill telling me now, <cite>This is not a book, it is a beer label.</cite></p>
      <p><cite>'*organically grown'</cite></p>
      <p>OK, so you are referencing the ingredients on the next line. Careful – because this looks like a continuous string because of the short measure (line width). Consider what designers of the Bauhaus would have done, would they have accepted what the machine automatically did for them? - well actually... [humor]</p>
      <p><strong>[TIP]</strong> Small Caps for Post code?<br>
      I used to make heavier weight either using a bolder weight or outline and made the type smaller so as to be optically the same as the rest of the address. This technique has been useful for stationary until now where Small caps are becoming more frequent feature.</p>
      <p>/mh</p>
