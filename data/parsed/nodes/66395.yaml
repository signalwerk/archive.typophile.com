    html: |-
      <p>Many thanks to everyone for all the feedback and alternate typeface suggestions, offers and mockups. I'll give them serious consideration.</p>
      <p>I agree that the diagonal neck label compromises the overall geometry but it was something I had no say about. It's not too bad and maybe even adds a little dynamism.</p>
      <p>The wording <em>"total organic"</em> was chosen instead of <em>"totally organic"</em> for syllabic and visual symmetry.</p>
      <p>I think the forward slash within <em>'Zero Alcohol / Total Organic'</em> is probably the most suitable option. I thought dots would not be as complimentary and anything more complex would be un-Bauhaus. I also think there's a popular sense of modernity with the forward slash through its use on the internet.</p>
      <p>I didn't mean to suggest anyone was a campaigner. It was just a lapse in vocabulary :)</p>
      <p>Love that graphic, Ratbaggy. Maybe do the whole alphabet and release them as a poster/postcard series.</p>
      <p>.<br>
      Here are some of the reasons, which may well be misguided or narrow minded, why I considered Helvetica as <em>"the natural choice"</em> for this job ...</p>
      <p>- A sans serif was needed for a modernist design.</p>
      <p>- An angular constructivist sans serif would clash with the logotype.</p>
      <p>- A rounded constructivist sans serif would be too close to the lettering on the Bauhaus building and conflict with the logotype and brand identity.</p>
      <p>- It works well for an <em>'information graphics'</em> aesthetic which connects with a Bauhaus/brutalist <em>'form follows function'</em> and <em>'ornament is crime'</em> ethos.</p>
      <p>- It can be used for all the text other than the logotype and still be legible at very small sizes on the back label and therefore the undesirable introduction of a third typeface is avoided.</p>
      <p>- It has a wide choice of weights which makes it very workable for the labels and the many other contexts in which it will be needed.</p>
      <p>- It has a relatively large x-height which minimizes the lowercase text's ragged horizontal rivers of space that would compromise the overall geometric design.</p>
      <p>- The dates of release for Akzidenz-Grotesk (1896) and Helvetica (1957) bracket the Bauhaus era fairly closely (1919-1933).</p>
    html_clean: |-
      <p>Many thanks to everyone for all the feedback and alternate typeface suggestions, offers and mockups. I'll give them serious consideration.</p>
      <p>I agree that the diagonal neck label compromises the overall geometry but it was something I had no say about. It's not too bad and maybe even adds a little dynamism.</p>
      <p>The wording <em>"total organic"</em> was chosen instead of <em>"totally organic"</em> for syllabic and visual symmetry.</p>
      <p>I think the forward slash within <em>'Zero Alcohol / Total Organic'</em> is probably the most suitable option. I thought dots would not be as complimentary and anything more complex would be un-Bauhaus. I also think there's a popular sense of modernity with the forward slash through its use on the internet.</p>
      <p>I didn't mean to suggest anyone was a campaigner. It was just a lapse in vocabulary :)</p>
      <p>Love that graphic, Ratbaggy. Maybe do the whole alphabet and release them as a poster/postcard series.</p>
      <p>.<br>
      Here are some of the reasons, which may well be misguided or narrow minded, why I considered Helvetica as <em>"the natural choice"</em> for this job ...</p>
      <p>- A sans serif was needed for a modernist design.</p>
      <p>- An angular constructivist sans serif would clash with the logotype.</p>
      <p>- A rounded constructivist sans serif would be too close to the lettering on the Bauhaus building and conflict with the logotype and brand identity.</p>
      <p>- It works well for an <em>'information graphics'</em> aesthetic which connects with a Bauhaus/brutalist <em>'form follows function'</em> and <em>'ornament is crime'</em> ethos.</p>
      <p>- It can be used for all the text other than the logotype and still be legible at very small sizes on the back label and therefore the undesirable introduction of a third typeface is avoided.</p>
      <p>- It has a wide choice of weights which makes it very workable for the labels and the many other contexts in which it will be needed.</p>
      <p>- It has a relatively large x-height which minimizes the lowercase text's ragged horizontal rivers of space that would compromise the overall geometric design.</p>
      <p>- The dates of release for Akzidenz-Grotesk (1896) and Helvetica (1957) bracket the Bauhaus era fairly closely (1919-1933).</p>
