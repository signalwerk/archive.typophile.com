      <p>Thanks everyone.</p>
      <p>The logotype matrix is 5 units high and I would rather not subdivide it. So the A's crossbar either goes where it is or vertically centre. I tried it centre but preferred it 1 unit down.</p>
      <p>Any actual suggestions for an alternate typeface to Helvetica? One that could work for all the type other than the logotype. I would rather not introduce a third typeface.</p>
      <p>I hadn't considered the Marlboro similarity. I'm disappointed in myself for not spotting that.</p>
      <p>The back label type is small but should be OK. Will see for sure when the proofs are done.</p>
      <p>All the back label text is align left ragged right. Any justification is pretty much just by chance.</p>
      <p>The mark before 'organically grown' is an asterisk to link to those after 'barley' and 'hops'. I'm happy that it creates a small indent in this context.</p>
      <p>The decision not to adopt traditional beer styling was a considered one, which was decided upon partly to distinguish the product from alcoholic beers.</p>
