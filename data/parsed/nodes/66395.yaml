      <p>The product's concept is good tasting organic beer that lets you stay sober. The name has no significant link, concept, wordplay or pun. It was found to be suitably appealing among potential buyers and consumers.</p>
      <p>However, there is one word that may suggest a connection between the product and the name ... sobriety.</p>
      <p>It's interesting how the questions of meaning that are asked about the naming and identity of products/brands in development are seldom asked of products/brands already on the shelves, which are mostly accepted at face value and the level of instinct or feeling.</p>
      <p>Beers names that are proper nouns have no inherent meaning. And where is there any real link between the product and the name of these beers for example... Duvel (devil) / Tiger / Cobra / Stella (star in Latin) / Red Stripe / Corona (crown in Spanish) ?</p>
