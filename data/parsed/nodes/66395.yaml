      <p><em>@ francis bold</em><br>
      I think the plain and succinct wording on the label communicates what's inside the bottle perfectly clearly. The rest is mainly tone of voice. The creation of the beer's identity was more concerned with evoking an attitude and shared values than with <em>"strapping the design around the bauhaus movement"</em>.</p>
      <p>Also, I do not think it is either necessary or appropriate for this beer's branding and packaging to communicate the heritage of beer in general. This beer does not share that heritage and it would be misleading to the consumer to suggest that it did. Hopefully the market will assess this product with as little prejudice as possible.</p>
      <p>You're quite right about the silver foil. It is wholly <em>"a unnecessary device to enhance a some what bland label".</em> Worth a shot though, don't you think?</p>
      <p>It's funny, I pictured the bottles' shelf presence in exactly the way you describe. I hope it works. Drawing attention to itself is its primary objective. The rest is for the shopper to decide.</p>
      <p>Glad to hear that <em>"As a consumer i defiantly wouldn't associate this style of design with a beer label"</em>. It was another one of the aims for the design to avoid beer label cliches. The bottle itself and the context in which it will be encountered, as well as some cognition on the part of the shopper, should be enough to overcome any confusion.</p>
      <p>And an association to <em>'energy'</em> drinks, and their kind, is better than an association to the<em>'follow this with 6 shots, a kebab, unsatisfactory sex, projectile vomiting and a hangover'</em> kind of drinks.</p>
      <p><em>@ eliason</em><br>
      Thanks for those positive adjectives ... <em>"Clean, modern, sober, progressive, cool."</em> They're exactly the sort I would put on the Bauhaus beer mood board if I had one.</p>
