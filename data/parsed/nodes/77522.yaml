    html: |-
      <p>I really like Velino since the very first time I saw it and has the potential to become “a new classic”, but IMHO it is too soon for calling it that way. For me, that term is reserved for something like Meta or Minion, i. e., a relatively new typeface that has been included in the exclusive circle of the most reliable and useful fonts according to a considerable number of professionals that have been using it for a wide range of projects and, after confirming that it works well, it is always one of the first options to do the job. It takes a while to get that – and I am afraid it is not just a matter of quality, but a mixing of quality, prestige, marketing, timing and luck (and perhaps other ingredients).</p>
      <p>But, if you really like it, then go ahead! Actually, I’d get a license if I had the money or a project for it.</p>
