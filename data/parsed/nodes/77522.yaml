      <p>I totally agree that it's of course too early to speak on its acceptance into the parlance of design professionals - I was mostly asking if you think it has the versatility, personality, and utility to become one of those elite 'new classics' like Meta, Minion, Miller (hmm, maybe Dino should've chosen a name beginning with M).</p>
      <p>All I can say is that I'm excited to see it used, and possibly to use it myself one day.</p>
      <p>Congrats Dino, and happy new year to everyone!</p>
