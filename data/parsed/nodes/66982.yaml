  html: |-
    <p>FontShop.com recently introduced our <a href="http://www.fontshop.com/fonts/gallery/" rel="nofollow">Gallery</a> page, showcasing additional specimens and examples of type in use found on the Web. When an image is added, it appears on both the <a>Latest Gallery</a> page as well as on any font or package page from the type family in use. Congrats to Klavika, the current frontrunner with <a href="http://www.fontshop.com/fonts/downloads/process_type_foundry/klavika_basic_ot/?t=g" rel="nofollow">18 gallery images</a> added so far! </p>
    <p>We’ve now made it easy for anyone to submit type samples, with our public <a href="http://www.fontshop.com/blog/?p=1585" rel="nofollow">FontShop Gallery Bookmarklet</a>. You can find and install the bookmarklet at the bottom of any FontShop.com product page, as well at the top of the Latest Gallery page linked above — just click "Submit images to the Gallery" and go from there.</p>
    <p>We’re hoping that this is a mutually beneficial feature, for designers and for FontShop. Type designers can submit specimens of their own, which link back to their site; graphic designers can submit work from their portfolios; and FontShop will have a richer diversity of specimens to show off. </p>
    <p>Give it a try and let us know what you think!</p>
    <p>-Ivan B</p>
