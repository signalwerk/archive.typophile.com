    html: <p>I'm a big fan of that Flickr machine tag, but FontShop's goal for this gallery is not quantity but quality, a hand-picked selection of the most interesting design. We're selecting things one at a time for now, either on our own or via submissions. That said, we'll definitely look at ways to let users submit in bulk via their Flickr collection in the future.</p>
