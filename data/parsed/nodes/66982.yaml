      <p>First of all, there is the unresolved question of rights.</p>
      <p>Second, you should be taking advantage of <a href="http://typedia.com/blog/post/machine-tags-for-type/" title="As inaugurated by Typedia" rel="nofollow">the recent <code>type:face=<cite>NAME</cite></code> machine-tag microformat</a>. (There’s also <code>classification</code>, <code>style</code>, and a few other descriptors.) Ideally you would release an API that allows gallery photographs to be aggregated elsewhere, exactly as Flickr does. You can already use the Flickr API to haul in photos thus tagged – several thousand from my stream alone.</p>
