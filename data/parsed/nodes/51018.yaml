      <p>On a serious note:</p>
      <p>Stephan said: "...I am not very sure what lead you to the idea that those were liberals…"</p>
      <p>Interesting question.</p>
      <p>Not only the scientific community favoured roman letters.<br>
      Roman letters were frequently seen and meant as a statement in favour of Roman tradition and hence the Catholic church - which had a strong political party in Germany and of course kept allegiance to the Pope of Rome. The catchword is "ultramontan".</p>
