    html: |-
      <p>When my dad did his PhD at Ohio State in the 50s, they had a bound book produced. I think in early 20th century Europe it would have been not exorbitant to produce a letterpress piece of modest length for something so significant in a person's life (it's not like today where they hand out PhDs for money and some time invested - back then you had to <em>invent</em> something).</p>
      <p>In any case, the important thing is that it be in blackletter.</p>
      <p>hhp</p>
