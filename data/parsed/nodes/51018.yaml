    html: <p>Hmm... A chemistry PhD might not have been set in blackletter, Hrant (if it was typeset at all...). Didn't many in the sciences publish in serif typefaces? Before WWI, there were vigorous debates as to whether German should be set in Fraktur or serif typefaces. This implies to me that quite a lot of content was being printed in serif type. Otherwise, the discussion would not have been a big one.</p>
