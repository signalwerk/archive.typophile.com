    html: |-
      <p>I see two options that I have also seen examples of while working in a digitisation project at the local university library: </p>
      <ul>
      <li>handwritten with latin script, the acknowledgements and preface being handwritten in current script (not necessarily Sütterlin, but something similar); those were considered not to be part of the scientific text, which of course had to be in latin script.<br>
      The sample I have seen was produced on an empty notebook of about 40 pages without rules, ca. 15x25cm. My guess for this choice in this case is the high number of formulas in the text (which was a mathematical dissertation if I remember correctly), and probably also a question of money.</li>
      <li>typoscript. While not everyone had a typewriter ready at hand in the 1900-1910’s, there used to be quite a remarkable number of "writing offices" where you could get your stuff typed from manuscript and/or from dictating it to one of the (usually relatively young and well-educated, both male and female) typewriter operators. Think of the number of internet cafés these days for a comparison (of course this is not really a parallel development, but the idea is that some new technique is invented, not everyone uses it at home or can't afford it, suddenly someone offers it as a service).<br>
      Illustrations and/or formulae would still be handdrawn/written even in typed dissertations. I have seen an example from 1912 from the field of philosophy.</li>
      </ul>
      <p>Which option was chosen might not only have been dependent from money issues, but also from the requirements the university needed you to fulfil. If you had to hand in several copies, it would have been easier and faster to type them or let them be typed by someone else because you could do carbon copies more easily than with handwritten things (still possible, but I have never seen a carbon copy of some 60 sheets of a dissertation in handwriting in any university library).<br>
      The number of formulae would also have played a role, so depending on which specific field and application your hypothetical chemistry doctoral candidate would chose her/his options with regard to several other factors (money, having a typewriter or having the possibility to use one in e.g. some relative’s office, number of copies requested by the local university administration, …).</p>
