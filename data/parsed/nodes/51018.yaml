      <p>Marvellous to see the illustrations of Nietzsche's typewriter script. </p>
      <p>With regard to the presentation of the thesis, I am not so sure that it could be presented in any of the ways proposed at the time of WW1. Certainly, in the 1930s, in America, at Columbia, a doctoral thesis was only considered presentable when printed in book form by, for example, no fooling, and entirely coincidentally, Columbia University Press. The expense entailed ($500? a small fortune in those days) delayed, sometimes for years, the awarding of doctorates to impecunious candidates, some well known to me. I would be surprised to learn that things were any less strict under the German system just a decade or two earlier. Certainly the American system was draconian to an extreme, and was gradually abandoned.</p>
