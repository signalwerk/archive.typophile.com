      <p>With AFDKO and FLS5 you can substitute more glyphs by fewer glyphs, but not the other way round. E.g. you can do this:</p>
      <p>sub m' a' n y by f;<br>
      sub f n' y by e;<br>
      sub f e y' by w;</p>
      <p>The glyphs followed by quote will be substituted by the glyph after the "by", the others serve as context. You have to step through glyphs and substitute them one by one -- and with each line the word transforms a bit more. In the first line, I did a ligature substitution, two glyphs by one.</p>
      <p>I think substituting fewer glyphs by more is possible with TT-OpenType fonts in Volt.<br>
      One could smuggle this kind of substitution into a PS-OpenType font with TTX, but unfortunately it would not work in Adobe apps, so better don't do it.</p>
      <p>[But I should say that this is a bad example since features better do not changes the character code.]</p>
    html_clean: |-
