      <p>I would, but it's actually the most important thing — having mousey run around all day doing things other than shapey curvey is the largest single class of negative difference between this and tools dating back to places few have ever seen. De rodent is yo only finger, thumb, hand, wrist and executor of your eyes' estate when it comes to letter-forming, a complete-enough-seeming task-set to me. To have it also running back and forth fetching tools, layer states and poking "yes" in case FL forgot to activate the CR for the highlighted option, is pure unadulterated consciousness raising, to say the least. </p>
      <p>You might not think about it, but every time I'm deep in the midst of an outline glyph, and all it's dependencies, and their's, and their's, all the way to "the Cleint's" dependencies, and    then    allofasudden, I've got to shoo the little rat out to Long Island City for a part... it has a tendency to disturb the dependency threads and decision speeds. Not by much, but when there's a lotta glyphs and a lot trips to LIC, (for me, at least), it's worth pointing out. As I said up thread, the problem does not exist so much for users with prior letter forming experience to find the least disturbing path regardless of how eclectic, but trying to teach or document, under the circumstances, can be an extra-trying experience. </p>
      <p>Biddy, has other opinions, but that is obviously based on his own concepts of mice and men.-)</p>
