      <p>"What does “You can’t write a manual for a program that requires such a level of ecclecticity” mean?"</p>
      <p>Well, in the example I gave, and there are dozens like this Bill (in FL Studio 5), you have something attached to the glyph window called "Editing Layers" (a nouned panel). It has the name of each layer and a check box beside it. The name is picked when the designer want to make that layer active for editing and the check box is to make that layer visable or invisible (or at least that's the way some of it works, and I assume it's all s'posed to). Sounds simple enough until you try to use it: Then, if, e.g. you just want to see the "mask" you think you'd just uncheck the layers other than the mask, and you'd be done. But that does not happen, instead The only way I've found to see only the mask is to select the mask and then UN-check the mask checkbox. This makes all else disappear, (somethymes). But most assuredly, the outline will will not dissappear if you are on the mask layer and you uncheck the "outline". </p>
      <p>Teach that, and you'll be a fool. Document it and you'd be fool in writing. I have to choose neither fortunately.</p>
    html_clean: |-
