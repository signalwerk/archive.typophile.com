      <p>I get exactly the same effect that David speaks about above when using the layers palette. There are other weird things like the occasional “one-move click auto-deselect” in the mask layer. Here is what I mean. In the glyph layer, you can use the arrow keys to move bezier control handle in single units by tapping on the arrow key until the curve is as you like it. With each tap, the control handle stays selected. Try this in the mask layer though and you don't know what will happen. Sometimes it stays selected and sometimes not. You have to click to select, hit the arrow key, then reselect because it has deselected itself for no apparent reason and not even consistently. If you quit FL5 and then reopen the file, it may work fine for a while--until the voodoo needle strikes the mask layer again. There are plenty of mysterious quirks in FL, weirdest app I ever saw! Somehow, you learn to deal with the flakiness because it is the only tool that despite its goofiness, will do the job.<br>
      Another example,in the OpenType panel, when typing feature code, the curser is never where you think it is. There seems to be added spaces or you can't select what text you want without "guessing" where the text might be. I end up typing all my feature code in a separate text editor and then pasting it into the feature window to avoid the "Where's Waldo" game in the FL feature window.</p>
      <p>All of this said, it is like talking to your whacky uncle Yannis who is a little nuts but very smart and knows how to help you in the end. You put up with the eccentric flake-outs because in the end, it is worth it (and he is family).</p>
      <p>ChrisL</p>
