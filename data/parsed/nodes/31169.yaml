    html: |-
      <p>Ah, I see what you mean now. I'd probably call this 'eccentricity', but it's more complicated than that. I think there are at least two things going on:  </p>
      <p>A. "Holy documentation, Batman!" </p>
      <p>I was talking to a guy who has done programming about my frustrations in learning FontLab, and he said that documentation is an extremely important part of the software development process. I've got to say, I think this part of the process at FontLab could be improved, because there are holes in the documentation. </p>
      <p>For example, the manual says that in the metrics window if you chose a glyph and want to adjust its left side bearing only, one way is to hold down the control key (windows) and use the right and left arrow keys to move one unit at a time. Ok, good. What about the right side bearing? Nothing. So who designs a font only adjusting the left side bearing, not the right? Um, a little eccentric. </p>
      <p>So having spent time with this program, I know the functionality must be there and I'm supposed to play detective. So I start trying combinations, and sure enough, if you hold down control-alt (windows), then the right and left arrow keys will move the right side bearing only. Not in the manual, not even in Ben Kiel's nice summary sheet. Does it also work the same way on the Mac? Well, maybe, you will have to do the detective work. </p>
      <p>David describes a similar adventure concerning how to see the mask only.</p>
      <p>These adventures can be fun, if you dig that sort of thing, but when you are going on these adventures you are not designing a font.     </p>
      <p>B. The Mind of Man </p>
      <p>My friend the cognitive scientist tells me that the latest theory on the way the brain works in storing memories is basically by scenario: come up to the door, turn the knob, open the door, etc.</p>
      <p>So that's the way to explain something in an instruction manual also, so human beings will understand you: take a task that the user wants to do, and explain to him or her the scenario for doing it. For example that's the way Cabarga does it in 'Learn FontLab Fast'. So he has chapters on starting a font, drawing a font, spacing a font, etc. Task-oriented. </p>
      <p>Because the FontLab manual is not task-oriented it is not a manual, but an index of functions--and there are holes in the documentation as well. </p>
      <p>The result is to make it far more difficult than it could be to learn FontLab. For example, Adam, who probably knows more about the program than anybody except the programmers, said that the diagram and explanation on p. 50-51 of 'Learn FontLab Fast' came as a revelation to him: there was everything in one place on how to draw a line in FontLab. </p>
      <p>Ladies and Gentlemen of the jury, I rest my case. </p>
      <p>How to improve it? Since different designers likely have different work processes, particularly at an advanced level, doing the whole FontLab manual organized by task is going to be maybe too huge a job, given the size of the market and the production team. </p>
      <p>What is easier to do is I think answer the type of question I hit on above, based the existing index of functions known as the 'manual': What are the different ways the designer can use this function in designing a typeface? Hence you have question of how to use masks,  sidebearing functionality, etc. etc. etc. </p>
      <p>As I said, users have already started writing this manual. John Hudson's tutorials (in the typowiki) on using the interpolation tool for bolds and small caps are a good example.  </p>
      <p>I'm sure task-oriented documentation will always be a work-progress, but any increase in task-oriented explanations (and filled holes in documentation) in the next edition of the manual will I'm sure be gratefully received by users of FontLab.</p>
    html_clean: |-
