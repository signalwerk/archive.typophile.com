      <p>&gt;I envy folks who can develop a type family in just weeks or months….</p>
      <p>Me too. </p>
      <p>&gt;I think reading the FontLab Studio manual takes a fraction of this time.</p>
      <p>I don't know about others, but to me the FontLab Studio manual is about as readable as the dictionary. It is an index of functions, rather than an instruction manual. Like the dictionary it is invaluable as a reference work, but unreadable continuously.<br>
      'Learn FontLab Fast' is a good readable instruction manual, but it is only a start. If the FontLab manual had some pieces organized by *task* rather than just by function, it would become more readable and hugely cut down on the learning curve for those using the program. </p>
      <p>Also, I hope that in the next round of the manual, FontLab will take advantage of the task-oriented work done. Eg. Ben Kiel's list of keyboard short-cuts (and please expand it!) and Karsten Luecke's recent takes on font naming, vertical metrics, John Hudson's tutorial on using the interpolation and other things in the Typowiki, and Adam, your own many extended and useful answers on Typophile and other places. </p>
      <p>In effect these efforts amount to pieces of an instruction manual that doesn't yet exist. Even if it is uneconomical to produce such a work, piecing together what is already out there would be quite helpful. Maybe a FontLab wiki?</p>
      <p>ps. the example you just gave illustrates what I am talking about. "How can I use the 'mask' function to help me in developing my font?" is a question you and others would have very good answers to, but they aren't written down in one place that anyone can access.</p>
