    <p>Forgive me if these questions have been asked, or if these features already exist. Are these features already in Fontlab and if not, what have you created for yourself as a substitute?</p>
    <p>1. Glyph Marker- This would mark the glyph you last worked on/and or information about what stage you are in editing. (i.e. lowercase g: correcting stroke consistency)</p>
    <p>2. Family Editing- When creating a multi-weight family allowing weights of glyphs from the Roman (or other weight) "copied to template" in the background to allow width and spacing to remain consistent throughout the family. (i.e. seeing each roman glyph in the background while working on your extra-bold weight)</p>
