      <p>apart from the little OT introduction in the FLS5 manual, I think the single best document for understanding OT features is Adobe's <a href="http://partners.adobe.com/public/developer/opentype/afdko/topic_feature_file_syntax.html" rel="nofollow">Feature File Syntax Definition</a> document. (There may be some typos near the end which obscure some things*, and one or two outdated examples; also it looks quite complicated at first; but then, it gives all information you will need.)</p>
