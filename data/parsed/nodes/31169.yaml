      <p>Bill, I really do think it is a matter of language. Couple of examples -- my business partner is, among other fine attributes, a pretty good programmer. He decided to write the last TeX macros using what he called an "object-attribute" structure. "\textpage" was an object. "orientation="x" was an attribute. ???? says I. He offered the following analogy "This is a face. It is an object. It has certain attributes, nose, eyes, hair, etc." "Look," I say. "This is a body. It is an object. It has certain attributes, one of which is a face." The point is that you can't look for meaning in the words borrowed from plain English; Adobe's using "Frame" for InDesign doesn't help me a bit. The meaning of the terms comes from the acceptance of other users, in this case, other programmers. Their (and our) mistake is to assume that people outside the group know what they mean.</p>
      <p>And within typography itself -- I don't like the term "text figures." I know what you mean, I think, but what figure style is used in display and text depends on the context. If your heads, either chapter or subhead, are full caps, you should use lining (capital) figures. If they are Cap &amp; lower case (a cap on each significant word, the rest of the letters lower-case, you have a choice. If initial cap only(the first letter of the first word is all that is capped, old-style (lower case) figures should be used. And in the body copy (text), words like "B-17" should be set full cap, lining figure. Also, I think, references to newspaper sections, such as "C-1." You can set them small-cap/lower case figures, but that strikes me as an affectation.</p>
      <p>To call them "text figures" falls into the same opacity of language as the problem of standard terms borrowed by programmers. Those of us who know what's involved have no problem; doesn't matter what we agree to call them (old-style figures, text figures, whatever). To an outsider, the term "lower case" might be more helpful. And of course, it might not.</p>
