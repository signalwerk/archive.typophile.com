      <p>Or perhaps the question becomes, who is going to supply fonts in the future? People with a strong programming background? People with a strong design (not engineering design) background? Only a special few who have both? If the latter, there are far too few; we would lose the likes of Matthew Carter. To the extent that FontLab is a tool, writing the manual for it's use has to depend on assumptions about who you feel will use that tool. But that's easy to say; I agree that writing such a manual is a difficult task. I mention it only as something for Adam to think about.</p>
