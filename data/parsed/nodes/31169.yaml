      <p>"the outline layer should be “hide-able” just like any other one. "</p>
      <p>It is in it's own ecclectic way. From the outline layer turn off the Mask. Then, make the mask layer the active layer, and "poof" the outline dissappearrs.(that's what I meant to say before). When I first started using FL, I though I'd accidentally deleted the outline, it's box being checked, but my letta' been done disappear'd. But, now, I just go with the flow :) the checks mean something, the layers mean something, and you just have to figure it out. (that's what I'd say in the manual too.)</p>
      <p>If you're going to ask them to revisit this, that'd be great thanks Adam. I pine, you can tell them, for the days when this was so simple (the activity and visiblilty of layers), that it was a keyboard function, allowing one to keep one's  mouse  on the ball.;)</p>
