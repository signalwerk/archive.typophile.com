      <p>Fontographer was way ahead of the curve, providing "user generated content" 20 years before the adbiz caught on.</p>
      <p>But since then all design software has become way more complex and technical.<br>
      It's not just the manual, but the software and interface.<br>
      You get more features and customizability with FL than Fog, but the downside is the shift from art towards engineering (relatively speaking, of course).</p>
      <p>So like has happened many times before in design, as technologies evolve, the creativity moves from being embedded in the craft to being split into two functions - direction and production. And then more.</p>
      <p>The evolution of markets has something to do with this too -- in our (indie type designers) case from Mac-using graphic designers to multiple-platform corporations that require complex fonts that are vastly more complex and robust.</p>
      <p>Terry -- it takes a lot of effort and trial and error, but that's design, ennit?<br>
      It's not quite the same "learning of an instrument" as, say, a calligraphy pen or a piano, but as Adam would say, you want easy or good? (or words to that effect).</p>
      <p>Getting familiar with OT features is certainly worth th effort, because it is really the only fundamental design ability that OT adds to type design, and it is really quite singular, i.e. it's all substitution.</p>
