      <p>I think the language used should be focused on the most likely user. There are some programmers designing type, true, but there are many more with a typography, publishing, and graphic design background. The terms common to these fields seem to be the best to use in manuals and interface. Terms like oldstyle figures are well known to the typography community. The difficulty comes with the young beginner with no background. Whatever terms used will be new and perhaps strange to them. The term leading is a good example. Anyone with a history in typesetting or design is quite familiar with the term. To the "FNG" (@!#%* New Guy) it makes no sense. We then have to mix in modern-day terms like typolinegap, winascent, etc., and the party really begins. The current state of affairs is that we are in the middle of a conglomeration of old farts like me (who have hand set metal type and drawn letters with a brush) and the younger computer generation who are pixel and hinting savvy with a splash of programming to boot. We are as a group a hodgepodge of the visually literate, the techno savvy, and the practiced craftsman of prior media.</p>
      <p>ChrisL</p>
