      <p>biddy,</p>
      <p>No, Learn Font Lab Fast is my wife's book &amp; she has it at work. Like most sensible couples, we try to keep our work addresses separate, even though we're  more or less in the same field.</p>
      <p>But a tip on understanding features generally &amp; the old-style-lining substitution: Take a "professional" font like Adobe Minion &amp; read it into FontLab. Open up the OpenType" features pannel, &amp; using the tool there, write the features off to a separate file &amp; study it. I think everything will begin to click.</p>
      <p>One of the problems I have with FontLab is that I write the features in a text editor (V-Edit) &amp; then bring them in. FontLab keeps telling me I now have new kerning &amp; don't I want to update. What is really going on is the kerning I added in the external file isn't in FL. If I "update," I lose what I just wrote. We all pay for our afflictions, but I sure like writing code in a nice big window, in large type, and with the text handling features of V-Edit.</p>
      <p>BTW, you get a new problem if a font has small-cap-height lining figures. I've been known to put them in a "stylisitc set" to preserve the integrity of "lining" figures.</p>
