    html: "<p>GIF is an image format that most any graphic app (like Photoshop) can save out. It's perfect for type specimens - it's tight: small files with no loss or artefacts (like JPEG). As long as an image has no photos or gradations, GIF rules. <br> <br>Size: if you're going to upload it directly do Typophile (as opposed to putting it on a site somewhere and providing the link) don't make it <i>too</i> big! :-/  Like 600x400 or something should be good. <br> <br>hhp</p>"
