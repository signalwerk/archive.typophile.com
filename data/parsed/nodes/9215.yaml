    html: <p>Keith <br> <br>In regard to your problems with Fontographer, it is very important that you configure your preferences quite carefully and follow the recommendations regarding metrics. [the same applies to FontLab] The Fontographer help site is useful <br> <br><a href="http://www.macromedia.com/support/fontographer/technotes.html" target="_blank">http://www.macromedia.com/support/fontographer/technotes.html</a> <br> <br>but a bit confusing. In the days prior to Macromedia's ownership of Fontographer there was an Altsys sponsored help manual (it was known as the "underground manual") that was floating around the web. Much of that is still available on site but it is scattered around. <br> <br>I've cribbed a bit of that to show a simple sequence for altering existing fonts (for letterpress configuration). See entry October 1 here <br> <br><a href="http://bielerpress.blogspot.com/" target="_blank">http://bielerpress.blogspot.com/</a> <br> <br>While this may or may not be useful to you note it conveys that you must pay very careful attention to your preference settings regarding character set positioning and the manner and sequence for generating the metrics. <br> <br>Gerald</p>
