  html: "<p>I'm an artist and novelist, and became convinced several years ago that I should make a private font for my books. I acquired Fontographer, and have since spent many delightful hours twiddling the little sticks. I now have something I'm pretty pleased with, but have several problems. Keep in mind that I'm basically computer illiterate - terms like \"hinting\" and \"vectors\" are algebra to me. I failed algebra. So any explanations will have to be in \"Jane sees Spot run\" language. <br> <br>First question - I was generating my font in TrueType, but then accidentally hit the Type I button one day, and it came out sharper (why is this?). Unfortunately, a couple symbols are messed up now: the em dash lances the letter following it, and there's too much space after the apostrophe. I've checked the spacing, and it seems fine. What can I do to fix this?  <br> <br>Another problem, both in TrueType and Type I: I can't get the fi and fl symbols to print - they come up in a different font. <br> <br>Now, I'd love to be able to post a sample of my font in your critique forum, but I've never done anything like this. I have a new Dell computer with the new Windows on it. Will it have what I need to post? I read that I need jpeg or something. How do I put my font into this jpeg so you can read it? Could some kind person walk me through this process? <br> <br>Thanks, <br>Keith</p>"
  html_clean: "<p>I'm an artist and novelist, and became convinced several years ago that I should make a private font for my books. I acquired Fontographer, and have since spent many delightful hours twiddling the little sticks. I now have something I'm pretty pleased with, but have several problems. Keep in mind that I'm basically computer illiterate - terms like \"hinting\" and \"vectors\" are algebra to me. I failed algebra. So any explanations will have to be in \"Jane sees Spot run\" language. <br> <br>First question - I was generating my font in TrueType, but then accidentally hit the Type I button one day, and it came out sharper (why is this?). Unfortunately, a couple symbols are messed up now: the em dash lances the letter following it, and there's too much space after the apostrophe. I've checked the spacing, and it seems fine. What can I do to fix this?  <br> <br>Another problem, both in TrueType and Type I: I can't get the fi and fl symbols to print - they come up in a different font. <br> <br>Now, I'd love to be able to post a sample of my font in your critique forum, but I've never done anything like this. I have a new Dell computer with the new Windows on it. Will it have what I need to post? I read that I need jpeg or something. How do I put my font into this jpeg so you can read it? Could some kind person walk me through this process? <br> <br>Thanks, <br>Keith</p>"
