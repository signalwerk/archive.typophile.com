    html: |-
      <p>1. One use for the medium weight is setting negative text (white on black, or some other dark colour. Not sure about the correct English nomenclature.) That will look quite similar to regular set black on white, while regular looks too light. Another use is when printing on cheap paper.</p>
      <p>2. I'd use regular. But there are no rules. Try both, and see what's most pleasing and readable.</p>
