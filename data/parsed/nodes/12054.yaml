    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12038" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Terminology</a>&nbsp;:&nbsp;Kern</strong></p>
    <p><em>Noun</em> – The part of a type that overhangs the <a href="/node/add/wiki?edit%5Btitle%5D=body" title="Create node &quot;body&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">body</a>.</p>
    <p><em>Verb</em> – To kern is to adjust the spacing between characters for visual spacing. For example an <a href="/node/13919" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Upper Case</a> A and a <a href="/node/13807" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Lowercase</a> v, Av can be kerned, or spaced more tightly, to be optically&nbsp;correct.</p>
    <p>See also <a href="/node/12410" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Kerning</a>.</p>
