    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a> : Kern</strong></p>
    <p><em>Noun</em> -- The part of a type that overhangs the <a href="/wiki/body" class="freelinking" rel="nofollow">body</a>.</p>
    <p><em>Verb</em> -- To kern is to adjust the spacing between characters for visual spacing. For example an <a href="/wiki/upper%20case" class="freelinking" rel="nofollow">upper case</a> A and a <a href="/wiki/lowercase" class="freelinking" rel="nofollow">lowercase</a> v, Av can be kerned, or spaced more tightly, to be optically correct.</p>
    <p>See also <a href="/wiki/kerning" class="freelinking" rel="nofollow">kerning</a>.</p>
