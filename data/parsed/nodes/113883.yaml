      <p>&gt; designing a book by project (not by per hour)....</p>
      <p>I have designed a few self-published books for clients, and the prices have varied considerably depending on the details of the project and other factors including how easy or difficult I thought the client was going to be to work with.</p>
      <p>Charges for any design project are based on your time (your hourly fee multiplied by number of hours) and expenses. So you need to estimate how many hours you expect the project to take. Yes, that can be difficult. If others here suggest specific prices, keep in mind that design pricing can vary considerably depending on the details of the project, your level of expertise, and the prices other designers charge in your area.</p>
      <p>&gt; Proofreading</p>
      <p>Even if you (or a proofreader you hire) are proofing the project, be sure to specify in your contract that the CLIENT is ultimately responsible for proofreading and signing off on the project before it's printed.</p>
