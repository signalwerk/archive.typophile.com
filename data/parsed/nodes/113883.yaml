      <p>Abattis, I'm a graphic designer, not a type designer. But most clients want a quote or estimate at the start of the project, so I estimate how many hours it'll take and what my expenses will be (photography, illustration, mileage if I need to attend meetings, printing if billed to me, etc). Something like this:</p>
      <p>Design   $x<br>
      Production $x<br>
      Expenses (listed individually) $x<br>
      Revision #1  $x<br>
      Revision #2 $x<br>
      Revision #3 $x<br>
      and so forth.</p>
      <p>Revisions are often a significant amount of the total, especially in large projects. I just finished a routine project for a corporate client that had 5 rounds of revisions; occasionally I've had 8 or 9 rounds.</p>
      <p>I hate the process of making estimates, but it's part of the job. It's much easier when you've done similar projects in the past and can check your records to see how long they took.</p>
