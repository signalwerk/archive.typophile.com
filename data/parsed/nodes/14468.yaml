    html: |-
      <p>Gregg,</p>
      <p>Having had a more than passing interest in numismatics at one point in my life, I think I can state with some certainty that the lettering on this coin is not a specific typeface, but rather an amalgam or workable letters in the punch-cutter’s bag of tricks. Also, stylistically the letters and numbers really don’t belong together.</p>
      <p>If you’re looking for something close to these letters, your might consider Letteror’s <a href="http://www.letterror.com/catalog/fed/index.html" target="_blank">Federal Series</a>; the numbers are another story — their design reminds me of early sixteenth-century stuff. You might check out <a href="http://www.fontcraft.com/csa/fontcraft.php" target="_blank">Dave Nalle’s</a> stuff.</p>
