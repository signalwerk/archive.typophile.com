  html: |-
    <p>I am hoping that someone on this list might be able to assist me in identifying a specific font.  However, the unidentified font is not from a printed work, but rather on an Irish copper token from the 1790’s.  In the standard production of coinage dies, letter punches were created to punch the various legends into the obverse and reverse of the dies used to create tokens or coins.</p>
    <p>I am working on a book related to these specific tokens, and if it all possible, I would like to identify the typeface used on these tokens.  I have created a very minimal webpage that includes images of the obverse and reverse of the token, as well as close-ups of the individual letters.  The webpage is available at:</p>
    <p>    <a href="http://copland.udel.edu/~gregg/camac.htm">http://copland.udel.edu/~gregg/camac.htm</a></p>
    <p>Any assistance or suggestions would be greatly appreciated and would of course be acknowledged in any publications.</p>
    <p>Thank you very much!</p>
    <p>  — Gregg A. Silvis</p>
