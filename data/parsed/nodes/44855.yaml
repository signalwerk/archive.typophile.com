    html: <p>I suppose it depends on what numbs your mind; what you find creative. But by in large, no, you don't want to be a typesetter. You probably don't want to be designer on salary. To experiment, to be creative, start your own foundry or agency, and see if anyone is willing to pay for your fun.</p>
