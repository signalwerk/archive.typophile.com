    <p>First of all, I would like to introduce myself, I’m Deren. I have just recently completed my first year within the Graphic Design industry after graduating from Middlesex Uni.</p>
    <p>As we know Graphic Design consists of various elements. One thing I have discovered during my uni days even more so during my post as a junior designer, I absolutely love working with typography. What I would desperately like to find out if there are specialist areas/industries/career paths where I can channel my passion of type, type and MORE type?</p>
    <p>I look foward to your advice and input!</p>
    <p>Deren</p>
