    html: |-
      <p>A t-shirt to commemorate the demise of the mini? :-(</p>
      <p>Unless Apple claims some kind of trademark over the symbol you should be good (in my non-lawyerly opinion). There are other symbols in system fonts that may be more problematic (eg., the Apple logo) but this one seems safe. </p>
      <p>Cheers, Si</p>
