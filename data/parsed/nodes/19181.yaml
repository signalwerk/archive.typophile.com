    votes: null
    html: |-
      <p>I went and hunted through the Photo-Lettering catalogs, and they call this Adpata Script. They don’t always credit the designers, but Ed Benguiat was one of their lettering artists. Frank Bartuska was another whose scripts look very similar to Benguiat’s. The ‘Hemlock’ name is, I suspect, a Solotype re-naming. since he seemed to group these scripts in alphabetic clusters, with H and J for brush script styles. I suppose Hemlock is as good an answer as any.</p>
      <p> - Mike Yanega</p>
