    html: |-
      <p>It’s almost identical to a script called ‘Hemlock’ that was one of the film type brush scripts (many are shown in the Solotype Catalog). I think it was digitized as ‘Gideion’ in the Expresiv Brush Script Collection. A German company called Typo Bach is listed as a supplier in the Script Types book I found the font in. The only difference I see is that the ‘i’ has no serif in Hemlock.</p>
      <p>- Mike Yanega</p>
