    html: <p>I think this must be one of the innumerable script faces <a href="wiki/Ed Benguiat" class="wiki-create">Ed Benguiat</a> designed in the olden days — check the similarities with his <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=C.106275.0.2&amp;attributes.sampleSize=48&amp;sampleText=Summerville%27s&amp;sampleSize=48">Benguiat Frisky</a>.</p>
