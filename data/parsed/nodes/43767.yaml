  html: |-
    <p>Hi,</p>
    <p>does anyone know how to order LetterHead fonts from outside the USA?</p>
    <p>Their order form correctly recognized I am writing from Germany (either from my IP or from my email address) but then insisted I check the box for the "state" I live in - offering a choice between US states, the UK and the Netherlands.</p>
    <p>I used their contact form for help, but no answer so far. This leads me to believe that there must be a compatibility problem. I am using Firefox on a Power Mac with Tiger.</p>
    <p>Maybe you can give me some advice how to contact them by other means - there is no phone number on their site.</p>
    <p>Thanks!</p>
    <p>Katharina</p>
