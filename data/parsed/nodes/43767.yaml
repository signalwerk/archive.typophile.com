      <p><cite>Bavaria (German: Freistaat Bayern (help·info), with an area of 70,553 km² (27,241 square miles) and almost 12.5 million inhabitants, lies in the southeast of Germany and is the geographically largest state (Bundesland) of Germany. Its capital is Munich.</cite></p>
