      <p>Well I hadn't seen the animated version of the Xerox one. I actually quite like the way the ball moves and flashes like a photocopier, though not sure that's intentional or not.</p>
      <p>This Barclaycard one looks like all sorts of weird things. Some kind of shredded tulip, a rubber glove caught in the wind, an empty egg, a vortex of paperwork...not really what a bank wants to convey surely!</p>
      <p>Maybe I'll make a compilation of naff logos; I'd have to do the same for nice ones though ;)</p>
