    <p>I just came across this new, bizarre logo for Barclaycard.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/barclaycard_3969.jpg"></div><br>
    <cite>the new Barclaycard identity aims to convey a calm, confident exterior while being warm and vibrant on the inside... and that the globe motif represents a "chip" being released from the constraints of the plastic card and welcomed in by new, exciting methods of payment.</cite><p></p>
    <p>The thing for me is that it's so generic and anonymous. And <cite>empty inside</cite>. More discussion and comparisons <a class="freelinking external" href="http://www.creativereview.co.uk/cr-blog/2008/september/an-ordinary-world" rel="nofollow">here</a>. You can add the new Xerox logo to that list too; what is it with shiny balls and 'friendly' text?</p>
