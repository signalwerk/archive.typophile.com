      <p>I have ſeen long s with dot above uſed at ſome point, but I don’t remember where. That’s the only diacritic I recall having ever ſeen used ſpecifically with long s.</p>
      <p>If you’re ſeriouſly thinking about long s then you should read up on its uſage patterns ſo that you underſtand how it was uſed and in what contexts. Andrew Weſt’s BabelStone blog has two poſts on it: <a class="freelinking external" href="http://babelstone.blogspot.ca/2006/06/rules-for-long-s.html" rel="nofollow">The Rules for Long S</a>, and <a class="freelinking external" href="http://babelstone.blogspot.ca/2006/07/long-and-short-of-letter-s.html" rel="nofollow">The Long and the Short of the Letter S</a>. Note that the diſtribution of long s changes over time, and alſo that it’s different between languages in the same time periods.</p>
      <p>I presume by longs_i and longs_l you are referring to ligatures with thoſe lowercase letters? Then you should alſo conſider doing a ligature with /t/ depending on the ſtyle, and poſsibly also with /b/, /k/, and /h/ depending on how ‘French’ you expect uſers to be ſetting their texts. A ligature with another long s is probably a good idea too, unleſs you are uſing a more ‘buttonhook’ ſtyle like in Linotype typefaces.</p>
