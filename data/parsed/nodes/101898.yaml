    <p><strong>Hi Typophiles!</strong></p>
    <p>I'm designing a typeface in Latin Ext A, and I was wondering if there's any Unicode for the following characters:</p>
    <p>(longs+acute) /longsacute<br>
    (longs+caron) /longscaron<br>
    (longs+cedilla) /longscedilla<br>
    (longs+circumflex) /longscircumflex<br>
    (longs+commaaccent) /longscommaaccent<br>
    (longs_i) /longs_i<br>
    (longs_l) /longs_l</p>
    <p>I know that Long S is part of LatnExtA, that's why I want to also design the diacritics for "s" when it's long s.<br>
    Is this useful? I's it still only a Hist form or does some CE language use it?</p>
    <p>Thank you!</p>
