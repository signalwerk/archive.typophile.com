      <p>The italic /ſ_t ligature is really weird the way the ascender of the t is elongated.<br>
      I mean, there is no functional reason for this ligature (i.e. to avoid a collision).<br>
      IMO it’s made to echo the quaint /s_t roman ligature.</p>
