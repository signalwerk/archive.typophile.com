      <p>No, they're not in Unicode as precomposed characters. There are a couple of ways you could handle this.</p>
      <p>1. If you are relying on the long-s character to differentiate this form from the regular lowercase s, than these diacritics would be best encoded using the long-s character followed by an appropriate combining mark character from the 0300 range. These combinations could then be mapped to precomposed glyphs in the font using the {ccmp} layout feature; alternatively, you could rely on GPOS mark positioning.</p>
      <p>2. You could instead handle the long-s as a glyph variant of the regular s, invoked by e.g. the {hist} feature or a stylistic set feature. In this case, you would handle precomposed long-s diacritics in the same way.</p>
      <p>Note that a single font could support both approaches.</p>
      <p>[George mentioned rules for long-s use. It's tempting to try to use contextual lookups in the {hist} feature to apply these rules, but be aware that the rules are not uniform across languages or, even, time periods.]</p>
