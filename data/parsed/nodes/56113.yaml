  html: |-
    <p>Hello there typophiles! I've got quite a bit of a down-time and have decided to put it to good use and sharpen my type and lettering. I'm hoping to do a series of drawings of New Order song titles and crank one out every month. The first one up for the chopping block is “Fine Time.” I thought this title may be a good way to ease my way into this project given I only have to draw five characters.   </p>
    <p>I would really appreciate your comments on the letterforms and maybe what I can do to add depth. Thanks!</p>
    <p>Ace</p>
