    html: <p>I think italic, unhyphenated, unsuperscripted (as in <cite>n</cite>th) makes the most sense. Italicizing the variable would be in keeping with how you would treat a variable if it were standing alone. And if it is italicized, then the hyphen is superfluous. The superscript could potentially be intrusive or mar the color of the text, and might make scanning the text difficult if there are superscripted markers for footnotes.</p>
