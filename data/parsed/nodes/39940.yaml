      <p><em>It isn’t simply size that make something stand out. […] In fact, aside from zero and one, they are pretty much the same size.</em></p>
      <p>…and so are all the lowercase letters with ascenders and descenders. With text figures (old style, lowercase, etc.), though the glyph may be physically as big as the titling figures - most of the visual information is contained within the x-height.</p>
      <p>I do see your point, though, and partly agree; which is why I'm pretty flexible when it comes to ordinals. I don't think they ‘deserve’ to be on the x-height, as I - the almighty typographer don't deem them to have enough useful information, and being a bit conservative, I like to keep the English-teachers of 1729 happy. And generally, I try to stick with ‘fifth’ on numbers up to ten.</p>
      <p>I do like, though, the Norwegian way of dealing with ordinals. Instead of the ‘th’ ‘rd’, etc. suffix, a punctation mark is used to mark the fact that something is being counted "It was the 5. day of the celebrations".</p>
