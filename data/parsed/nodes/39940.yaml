    html: |-
      <p>CMS (Chicago Mother of Style) says they follow the same rules as stand-alone numerals, which is to say, spell out 1-100 before resorting to mixing numerals and letters (9.8). As for superscripts, it doesn't address them specifically really, but it doesn't use them in its own text. I take this as a de facto endorsement of the policy that ordinals ought not to be superscript in running text.  </p>
      <p>Note that in 17.52, CMS says that it's okay to reformat superscripted ordinal endings when citing the title of a book (while it is not okay to spell it out if the original title contains number-letter ordinals).</p>
    html_clean: |-
      <p>CMS (Chicago Mother of Style) says they follow the same rules as stand-alone numerals, which is to say, spell out 1-100 before resorting to mixing numerals and letters (9.8). As for superscripts, it doesn't address them specifically really, but it doesn't use them in its own text. I take this as a de facto endorsement of the policy that ordinals ought not to be superscript in running text.  </p>
