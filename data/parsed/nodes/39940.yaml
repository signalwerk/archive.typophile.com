    html: |-
      <p>My rule of thumb is: if the typeface includes ordinal letters, and my line-length is long enough that it doesn't look too weird, I try to superscript them. </p>
      <p>To me it's the same issue as with text figures. Numbers aren't <em>more</em> important than the rest of the text, and shouldn't be bigger than the rest of the text — and likewise, ordinals are <em>less</em> important than the rest of the text, and hence, it should be smaller than the rest of the text…</p>
      <p>By the way, yes, they are called ordinals, "because they are used for ordinal numbers: first, second, third." (Bringhurst)</p>
    html_clean: |-
