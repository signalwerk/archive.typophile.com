      <p>&gt;MS Word’s propensity to superscript them </p>
      <p>This can be turned off in Word by going to Tools &gt; Autocorrect Options &gt; Autoformat As You Type and unchecking the "Ordinals (1st) with superscript" box. Also go to the Autoformat tab in the Autocorrect Options dialog box and uncheck the same box.</p>
