      <p><cite>To me it’s the same issue as with text figures. Numbers aren’t more important than the rest of the text, and shouldn’t be bigger than the rest of the text — and likewise, ordinals are less important than the rest of the text, and hence, it should be smaller than the rest of the text…</cite></p>
      <p>It isn't simply size that make something stand out. It isn't that lining (uppercase) numbers are bigger than old style (lowercase) figures that bothers most of us. In fact, aside from zero and one, they are pretty much the same size. But they form a "visual block," and that is visually disturbing. To me, superscripting "th" etc. calls unwanted attention, even if smaller, and raises the same problem</p>
      <p>Just a 20th century guys perspective.</p>
