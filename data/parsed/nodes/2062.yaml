  html: "<p>Attention please! <br> <br>TRUTH in Design wants talented typographers from any philosophy or style to publish high-quality original outline, pixel, and other font families through TRUTH in Design's upcoming type foundry. <br> <br>We will sell your fonts, market and manage them, and return to you a competitive royalty. Processed ttf fonts are not required. 1-bit and 8-bit GIF designs are accepted. Non-Roman fonts are also wanted. <br> <br>Interested? Please contact: <br><a href=\"mailto:truth@truthindesign.com\">truth@truthindesign.com</a></p>"
