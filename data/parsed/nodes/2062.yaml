    date: 2003-11-14T19:47:00
    date_raw: 14 Nov 2003 — 7:47pm
    votes: null
    html: <p>You can give it to us that way, if you want to create a pixel font. If it is of good visual quality and original design, we will font-ify and publish it for you. For outline fonts, the biggest slice of professional type design, you will need a font tool. Free ones are available on sourceforge, FontLab is expensive and excellent. <br> <br>Artists can work in the GIMP, Photoshop, and/or anything that can create a GIF, PNG or TIFF. <br> <br>We are interested in picture fonts too.</p>
