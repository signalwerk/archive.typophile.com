      <p>Suffice it to say that next time you should draw directly in FontLab.  :-)</p>
      <blockquote><p>is there a way in FontLab to shift the glyph position up or down en-masse</p></blockquote>
      <p>Yes, you can do all kinds of things to many characters at once. However: many things that can be automated end up biting you later. Case in point: creating a superscript by simply reducing a glyph and moving it up results in a glyph that's too light.</p>
      <p>hhp</p>
