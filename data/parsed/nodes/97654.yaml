    html: |-
      <p>Either one-by-one OR import (or copy paste) the entire file content into some arbitrary character slot, then move or copy them one-by-one to their proper positions. Same amount of work, but maybe easier switching among windows within one application.</p>
      <p>Either way, the position of each glyph will have to be adjusted, and I've found it works better to enlarge each eps glyph (or the whole page of them) BEFORE copying to FontLab.  Otherwise your carefully designed glyphs may get distorted by their nodes being forced into FontLab's integer-based grid system.</p>
      <p>In FontLab, select the characters to be shifted, then Tools/Action/Contour/Shift.</p>
      <p>   - Herb</p>
