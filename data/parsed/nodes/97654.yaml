    <p>Hi I'm new to font design and have a couple of questions,</p>
    <p>Part one</p>
    <p>I have designed a number of glyphs in a single EPS file, I am wondering if there is a way of importing this file into FontLab and it recognising the individual glyphs. ScanFont use to do this, but it doesn't work on Mountain Lion :-( . Or is it only possible to import glyphs one by one. </p>
    <p>Part two </p>
    <p>Once the EPS has been imported, is there a way in FontLab to shift the glyph position up or down en-masse (in the case of Superscript, Subscript, Denominators, Numerators etc)</p>
    <p>I appreciate anyone's feedback. Thank you.</p>
  html_clean: |-
