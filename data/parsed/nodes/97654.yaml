      <p>Have you tried changing the EPS and bitmap background setting (Preferences&gt;General Options&gt;EPS and Bitmap background) to "Fit between Ascender and Descender" or "Fit between Ascender and Baseline"? I have found better results using this as opposed to the standard "Keep size (1 EPS pt = 1 UPM unit)" setting.</p>
      <blockquote><p>Suffice it to say that next time you should draw directly in FontLab.</p></blockquote>
      <p>Sadly this is not always an option, for example, if someone has passed you artwork or outlines in in an Illustrator or other vector program format.</p>
