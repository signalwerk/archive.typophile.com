      <p>Yes, I agree, reducing glyph size and moving it up would be too light. That's why I have been spending time playing in Illustrator making the glyphs. I have got a test copy that I wanted to try you see. Is there a better way to increase weight in FL. What I did in Illustrator was type font at 300pt, create outline, reduce to 65%, add 0.7mm offset path, remove original, add another 0.5mm offset path and then reduce to the original height. It worked ok. but now I have 40 + glyphs. If there is a better way in FL I am very much up for hearing about that. I know that there is an expand path function but it seems to be a bit hit-and-miss to use. What would you suggest?</p>
