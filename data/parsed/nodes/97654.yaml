    html: |-
      <p>Maybe I haven't learned to set FontLab's eps import settings properly, but if I have an eps image in illustrator (where point locations are mathematically analog), and that image appears, for example, as one fifth the size of illustrator's pseudo US Letter-size page, and I import it into FL, it will end up about 75 units high, with the control points all on grid intersections. This is a distortion of the original image; that distortion is magnified whenI resize the FL glyph by a factor of ten.</p>
      <p>On the other hand, if I expand the image in illustrator close to a full-size page before copying it to FL, it may not need resizing at all, and if it does, the mathematically introduced errors are much smaller.</p>
      <p>I am NOT a professional type designer; others here will probably point out some major error in my process!</p>
      <p>- Herb</p>
