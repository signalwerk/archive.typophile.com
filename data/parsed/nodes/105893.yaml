    html: |-
      <p>Hi,<br>
      That's a really good one - it's part of the Partizan Belgrade Soccer Team logo.<br>
      I would imagine that it's a custom job that only consists of those letters and not available as a regular font.</p>
      <p>Anyhow if you require scalable vectors of the complete logo then get my .eps version from here:<br>
      <a href="https://dl.dropboxusercontent.com/u/37241705/PartizanBelgrade.eps" title="https://dl.dropboxusercontent.com/u/37241705/PartizanBelgrade.eps">https://dl.dropboxusercontent.com/u/37241705/PartizanBelgrade.eps</a><br>
      or if you want it here's a pdf copy:<br>
      <a href="https://dl.dropboxusercontent.com/u/37241705/PartizanBelgrade.pdf" title="https://dl.dropboxusercontent.com/u/37241705/PartizanBelgrade.pdf">https://dl.dropboxusercontent.com/u/37241705/PartizanBelgrade.pdf</a></p>
      <p>It reminds me those crazy neon fonts in the old Letraset catalogue, Oxford, Uptight Neon, Yagi Link Double etc., but check out:<br>
      <a href="http://bowfinprintworks.com/LinedFontGuide03.html" title="http://bowfinprintworks.com/LinedFontGuide03.html">http://bowfinprintworks.com/LinedFontGuide03.html</a><br>
      where you may find something similar (or maybe not)<br>
      Good Hunting.</p>
      <p>Regards<br>
      Doghouse Studio</p>
