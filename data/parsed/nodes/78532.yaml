  html: |-
    <p>Tuesday Feb 1st is the first Tuesday of the month, so it's time for a social evening with your fellow Portland typophiles! Not all discussions have to be about fonts and typography, but it would be good if everyone was at least willing to have such discussions.  :)</p>
    <p>This is our third Portland Type Tuesday, I think. We may soon be too many for this location, but they have a great Imperial Stout on tap, so we're back again at:</p>
    <p>Migration Brewing<br>
    2828 NE Glisan St.<br>
    Portland OR 97232</p>
    <p>7 pm Tuesday.</p>
    <p>I'll be the fellow with the green hat and red mad scientist glasses. Hope we see you there!</p>
    <p>T</p>
