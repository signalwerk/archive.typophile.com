    html: <p>v, it might be helpful if you could clarify what you mean by "three-dimensional product."  <br> <br>When I first read it, I assumed you meant something like letters cast in metal. In other words, physical objects, like House Industries' Neutraface house numbers.  <br> <br>When Frank started talking about 3d digital rendering in some sort of software product, I realized that that could well be what you mean.  <br> <br>Either interpretation seems possible from your description, but they are entirely different things when it comes to licensing issues.</p>
