    html: <p>My take on licenses is that I only buy fonts which licenses aren't stuck in the 1980's. But on the other hand I'm using those for my own stuff sometimes. I'm not sure if this helps or not. <br> <br>If the font is used in a game for a gaming console you don't need to fear that someone cracks the code and pulls out the font for desktop use. Even on a Mac or Windows game the fonts are usually put in hard to convert formats that render the font unusable for desktop use. <br> <br>In a font license the part of the font embedding would affect you I think. That quite fits what you do, embed the whole font in a product that uses it, but the font can't be pulled out of it again. <br> <br>It's hard to guess, as a lot of foundries are still fast asleep when it comes to solutions for modern media. <br> <br>FJ</p>
