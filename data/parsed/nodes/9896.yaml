    html: <p>The OpenType definition of embedding purely relates to embedding fonts in digital documents. I don�t think the 3D object could be described as a document, but maybe it could is the object real or digital? The license could of course talk about embedding and define it in a different way but this would confuse the user. <br> <br>I think this does boil down to the TM and the EULA. If the EULA isn�t clear on this, and few would be, I�d contact the vendor for their opinion. As for using the name, if the designer is claiming trademark in the name you need to get permission and attribute the TM. If the name could be considered generic, say Garamond or Caslon, I think you�re safe to use it. If it�s a newer font I�d go down the permissions route too, and the designer could always TM the name later, and that would cause a problem for your product. <br> <br>Cheers, Si</p>
