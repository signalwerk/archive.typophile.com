    html: <p>I think you could consider it embedding if a rather common technique is used where a font file is <i>embedded</i> into the application. The 3D engine then either renders it in 2D as a texture or creates geometry from its outlines in (semi)real-time. <br> <br>I agree with Si that a custom license would be the safest way in any case. Not necessarily the more costly even.  <br> <br>FJ</p>
