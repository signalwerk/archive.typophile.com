  html: <p>I've been asked to try to get some quick information for a product and not spend any money (yet) doing so... <br> <br>Generically speaking, what I'm trying to determine is what rings we'll need to hop through to produce a three-dimensional product using a font.  The kicker, is that we'll need to use the name of the font (ie Trade Gothic).  So, I'm guessing that we'll need to obtain a special licensing deal for use of font...because of the identification. <br> <br>Or, not?  With the license of our existing fonts are we already covered?  We've bought many fonts in the past (but who saves the TOS) so...this is where I'm fuzzy. <br> <br>Anyways, before we have to get attorneys involved and such I'm hoping that somebody might have some insight even with my lack of very clear product information (just try to take it as I explained it). <br> <br>Thanks, v</p>
  html_clean: <p>I've been asked to try to get some quick information for a product and not spend any money (yet) doing so... <br> <br>Generically speaking, what I'm trying to determine is what rings we'll need to hop through to produce a three-dimensional product using a font.  The kicker, is that we'll need to use the name of the font (ie Trade Gothic).  So, I'm guessing that we'll need to obtain a special licensing deal for use of font...because of the identification. <br> <br>Or, not?  With the license of our existing fonts are we already covered?  We've bought many fonts in the past (but who saves the TOS) so...this is where I'm fuzzy. <br> <br>Anyways, before we have to get attorneys involved and such I'm hoping that somebody might have some insight even with my lack of very clear product information (just try to take it as I explained it). <br> <br>Thanks, v</p>
