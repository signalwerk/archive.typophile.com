    html: <p>The italic especially is misguided. I've heard it said that the erratic slope and poorly drawn letters give it an air of piquancy, but that to me said that it's good because it's bad. Rustic charm is only charming to an extent. The roman as well is too frail and lacks consistency. The stems that overshoot past the counters (p, d) are an especially poor touch. It makes me wonder how well this font corresponds to Claude Garamond's Vraie Parangonne. My bet is not very.</p>
