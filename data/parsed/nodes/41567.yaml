      <p>Well, I'm glad you guys bore me out. I was afraid that everyone would be on the "piquant charm!" boat you mentioned, Number3.</p>
      <p>But no, I can't stand this typeface. My number one complaint on the Roman is b, d, p, and q. The bowls of all those letters seem badly misshapen to me, almost like they were flipped, rotated, and swapped around from the letters they actually belonged to. And I could almost stand the italic if it weren't for that a; the bowl(?) of the a just leans way too far to the right.</p>
      <p>So yeah, thanks for participating in my little game, guys; I'll go back to lurking now. :)</p>
