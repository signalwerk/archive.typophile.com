      <p>There are a number of good digital versions of this  American "Garamond" available. Here are a few of the better ones:</p>
      <p><a href="http://www.fyrisfonts.com/typsnitt/garajannon/book.asp" title="http://www.fyrisfonts.com/typsnitt/garajannon/book.asp">http://www.fyrisfonts.com/typsnitt/garajannon/book.asp</a> (Multiple master available)<br>
      <a href="http://www.p22.com/lanston/garamont.html" title="http://www.p22.com/lanston/garamont.html">http://www.p22.com/lanston/garamont.html</a> (best for lager sizes—too light and squished together out of the box to be useable for text)</p>
      <p>Neither of these fonts really look anything like either Garamond's or Jannon's fonts, IMO.</p>
      <p>The standard "Garamond #3" is terribly ugly at anything larger than 10 pt.</p>
      <p>I'm currently working on a digital font that is based on ATF Garamont, but is somewhat different than the ones currently out there. I will not likely release it.</p>
      <p>The version from the Impemerie Nationale is stunning, expecially the italic when set with the full range of ligatures.</p>
