    html: |-
      <p>Garamond No.3 isn't based on a type of Claude Garamond's at all. It's based on the types of Jean Jannon, in a century after Garamond's.</p>
      <p>As Robert Bringhurst points out in "The Elements of Typographic Style", Jannon's type belongs to the French Baroque era rather than Garamond's type, which has more Renaissance characteristics. Subsequently, Jannon's type has a rowdier form, especially in the italics, and these dissimilar slopes and stresses in the italic were deliberate design elements, not simply sloppy mistakes.</p>
      <p>Other types drawing from this same era have similar characteristics. Check out the italic of the various Caslon text types (Adobe Caslon, ITC Founders Caslon). Many of these same characteristics lasted into Calson's Neoclassical ("transitional") types as well.</p>
      <p>As for Garamond 3, it is drawn closely from ATF's "Garamond" (Jannon) revival of the early 20th century, although as noted, it suffers from lighter drawing of many early digital revivals. I prefer Simoncini Garamond and Monotype Garamond for most uses -- they keep the lively structure of Jannon's letterforms, but seem much better weighted and balanced for text.</p>
      <p>For good versions of Claude Garamond's types, I find Adobe Garamond to be a fine typeface.</p>
      <p>David Thometz</p>
