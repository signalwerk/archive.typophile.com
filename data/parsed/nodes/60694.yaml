    html: '<p>Such complicated answers! Here is how I approach this. First ask, "Should the asterisk disturb the relationship of the word and the comma?" -- Answer: No. Therefore simply set the comma after the word as normal, then set the asterisk, then resize and kern the asterisk (which has a separate and distinct relation to the word).</p>'
