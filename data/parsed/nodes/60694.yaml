      <p>charles_e said:<br>
      &gt;   The publishing world is all agog today about ebooks, repurposed files, etc.<br>
      &gt;   If you assume the print product is the first product, and those files (PDF, XML,<br>
      &gt;   whatever) will be worked over by experienced people for other purposes</p>
      <p>um, i think it would be silly to assume the _first_ product is _print_...</p>
      <p>much stuff -- perhaps the vast majority -- will never get printed at all<br>
      in the world of the future.</p>
      <p>and when something _is_ printed, it will be as an afterthought -- or as<br>
      a _byproduct_ -- with the primary version being the one up on the web.</p>
      <p>&gt;   Part of the rub is no one knows for sure just what files people will<br>
      &gt;   start with for “product 2.” </p>
      <p>i can see your confusion, because you've started with ".xml and .pdf"<br>
      as the initial formats for your print product.  but if you start with a<br>
      plain-text unicode file, and generate all versions from that "master",<br>
      you might be able to discern that the workflow can be quite simple...</p>
      <p>&gt;   There is also some movement toward round-tripping XML with the<br>
      &gt;   first (print) version, but I’d not bet the ranch that will become popular.</p>
      <p>and that's what makes a horse-race, a good old difference of opinion,<br>
      because i _would_ bet that round-tripping (albeit not .xml) will become<br>
      not just "popular", but a required and ultimately "intuitive" part of it all,<br>
      stemming from that light-markup unicode file.  look at it from my view:<br>
      if a particular workflow gives you a "round-tripping" capability, is there<br>
      any reason why you wouldn't make use of it?  that is, if the output you<br>
      copied out of a .pdf were able to be automatically reformatted such that<br>
      it could create an identical .pdf, wouldn't that be extremely valuable to us?<br>
      (try reformatting the text you copy out of a .pdf today, using most tools,<br>
      to grasp firmly how far we fall presently from that round-tripping ideal.)</p>
      <p>of course, given the sheer impossibility of that workflow using our current<br>
      tool-chain (e.g., indesign, heavy markup), you might think that's fantasy...<br>
      but i assure you that it really isn't all that difficult...</p>
      <p>-bowerbird</p>
