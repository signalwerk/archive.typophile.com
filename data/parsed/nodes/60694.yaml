    html: |-
      <p>I'm not a typographer but I deal with footnotes all the time, and the references go after the punctuation in the styles I usually encounter and use (like, I believe, the Chicago Manual of Style). </p>
      <p>(Of course, they may "drive on the other side of the road" in Bendy's world! ;-) )</p>
      <p>Edit: from Chicago Manual of Style online site:<br><em><strong>Q.</strong> It’s probably in the book somewhere, but I cannot find it. Can you tell me the preferred way to place an asterisk when it appears adjacent to a period, or any other punctuation (especially colon and comma)? Inside or outside the punctuation mark? Thanks.</em></p>
      <p><strong>A.</strong> Please see CMOS 16.30, which would apply to note symbols as well as note numbers: “A note number should be placed at the end of a sentence or at the end of a clause. The number follows any punctuation mark except for the dash, which it precedes. It follows a closing parenthesis.”</p>
