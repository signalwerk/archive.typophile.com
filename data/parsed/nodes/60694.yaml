      <p><cite>Kern your example in the order you have it - that is the correct structure. The reason is that the asterisk belongs to the word.<br></cite></p>
      <p>?? I suppose this is an editorial issue, but I would assume the asterisk signals a footnote. If the footnote was about "organizations" only, such as the meaning or history of the word, then yes, the asterisk belongs with the word. On the other hand, if the note applies more to the whole phrase, (in the States at any rate,) it would fall after the comma. In that case, you'll probably have to kern the comma-asterisk.</p>
