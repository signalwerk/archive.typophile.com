    html: |-
      <p><cite>please explain what’s so terrible about having coded superiors, in practicality rather than principle.</cite></p>
      <p>Well, it depends. The publishing world is all agog today about ebooks, repurposed files, etc. If you assume the print product is the first product, and those files (PDF, XML, whatever) will be worked over by experienced people for other purposes, then I suppose the only potential downside is the cost. Part of the rub is no one knows for sure just what files people will start with for "product 2." There is also some movement toward round-tripping XML with the first (print) version, but I'd not bet the ranch that will become popular.</p>
      <p>While no one knows for sure what the new workflows will eventually be, where I come down on all this is that it is unkind to lie about character names or encodings.  "Looks OK in print" with one particular font &amp; encoding is potentially a mess in the making.</p>
