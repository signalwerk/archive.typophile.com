      <p>here is what "round-tripping" means:<br>
      there is a rough equivalence between<br>
      the input that creates a viewable-format<br>
      and the output copied out of that format.</p>
      <p>so if you're gonna use .tei to create a .pdf,<br>
      then you need to get .tei _out_ of the .pdf,<br>
      which can be used to create an identical .pdf.</p>
