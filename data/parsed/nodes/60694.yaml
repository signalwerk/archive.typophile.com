    <p>Hello Typophiles!<br>
    Quick question about using asterisk...here is my sentence:</p>
    <p>"In fact in the UK, coaching has already taken off in more than 70% of organisations*, inspiring staff to think creatively and know how to take action."</p>
    <p>Unfortunately when laying out I get a bigger gap between the asterisk and comma than between the comma and the next word. Should I just manually kern the comma closer to the asterisk? Or does the comma go before the asterisk?</p>
