      i don't know if i truly understand your characterization, and<br>
      -- to the extent that i do -- i would largely disagree with it.</p>
      <p>plus, even if there was some very small aspect of truth in it,<br>
      i'm not sure what your objection to that small truth would be.</p>
      <p>let me rewrite what you said in terms of the topic at hand:<br>
      &gt;   light-markup and remixable text is the only long-term<br>
      &gt;   viable source of archival text.  anything else is a waste<br>
      &gt;   of time, because it won't serve our needs.  we need to<br>
      &gt;   stop spending research money on other archival forms.</p>
      <p>i believe the first of those three sentences is absolutely true.</p>
      <p>further, i think the second follows fairly closely from the first.<br>
      (although there's certainly all kinds of wiggle-room there, eh?,<br>
      because short-term needs often conflict with long-term stuff,<br>
      but let's dance around that little complication, ok?)</p>
      <p>but that doesn't mean i would necessarily agree with the third;<br>
      we do research so as to test things so we will learn new stuff.</p>
      <p>&gt;   If that’s unfair, so be it. That’s how your posts strike me.</p>
      <p>it's not that it's "unfair".  it's that it is _inaccurate_.  but perhaps<br>
      you don't care if your assessment is inaccurate, as you're going to<br>
      assert it anyway.  because, after all, if you cared about its accuracy,<br>
      you would do a better job of reading all of my posts, and carefully.</p>
      <p>but, as you've said, you would rather just avoid seeing them at all.</p>
      <p>fine.  i don't give a damn if you read my posts or not.</p>
      <p>but it strikes me as somewhat curious that you're willing to go<br>
      "on the record" in such a public manner based on partial info,<br>
      with an attitude that's so callous it does not care if it's "unfair".</p>
      <p>&gt;   I don’t argue politics or religion,<br>
      &gt;   not because the subjects aren’t interesting,<br>
      &gt;   but because I have never seen anyone’s mind changed.</p>
      <p>this is disingenuous, and not just slightly so, but to the extreme.</p>
      <p>you're the one who opened up the topic of "round-tripping",<br>
      and i've done some research on that topic, so i engaged you<br>
      in a "window of opportunity for discussion".  discussion, charles.</p>
      <p>and i'm not necessarily looking to change _your_ mind_, or _mine_,<br>
      or anyone else's, but that's always a possibility with _discussion_...</p>
      <p>like i said, i've done some research on the topic, so i can provide<br>
      some _actual_evidence_ in favor of the things that i would say, so<br>
      this is _hardly_ a matter of "politics or religion".  i've got solid data.<br>
      i'm certainly not asking anyone to take anything on "faith".  no sir...</p>
      <p>but you don't want to see any data, do you?  you don't want to even<br>
      _discuss_ the matter.  you just wish you could make all my messages<br>
      become _invisible_.  you would like them to disappear into the ether.<br>
      i'm sorry, charles, but i don't have a lot of _respect_ for that position.</p>
      <p>you said:<br>
      &gt;   Actually, it already does, already has.</p>
      <p>ok, fine, let's see your data in support of that assertion.</p>
      <p>show us where an x.m.l.-based workflow outputting to .pdf has<br>
      given us a round-tripping capability.  i would love to see that...</p>
      <p>or do you just want us to believe what you say, to take it on faith?</p>
      <p>-bowerbird</p>
