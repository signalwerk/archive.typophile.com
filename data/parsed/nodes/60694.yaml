      <p><cite>and that approach is never going to give us a round-tripping capability...</cite> Actually, it already does, already has.</p>
      <p>But my general problem with all your posts that I have read, and I'll state up front that I don't read many and don't read them carefully, is they seem to take the following form:</p>
      <p>"Fusion is the only long-term viable source of power. Anything else is a waste of time, because ultimately it won't serve our needs. We need to stop spending research money on how to remove/store "carbon." Etc."</p>
      <p>(BTW, I happen to agree with the positive elements of the above.) </p>
      <p>If that's unfair, so be it. That's how your posts strike me. </p>
      <p>I don't argue politics or religion, not because the subjects aren't interesting, but because I have never seen anyone's mind changed. All most people in such discussions are doing is looking for new arguments to bolster their own position. Anything else is rebutted or deflected. As time passes, the issues are ignored, and the new arguments either slip into minutia or assume an unspoken premise the other party doesn't accept.</p>
      <p>And that, my friend, is boring.</p>
