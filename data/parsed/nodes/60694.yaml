    html: |-
      <p>Just to ge back on track . . .</p>
      <p><cite>I’ll also build asterisk/comma* and comma*/asterisk kerning into any fonts I design, that seems quite an important omission.</cite></p>
      <p><cite>*Plus other punctuation of course.</cite></p>
      <p>Not to burst any bubbles, but don't forget the dagger and double dagger. Also don't forget the size. We have always set the size of the call the same as the size of the note. That is, if the text is 10-point and the footnote 8-point, we use an 8-point asterisk (dagger, whatever) in the text as a call. And so, it becomes a matter for comps, not designers.</p>
      <p>More bubbles: the usual way of calling notes is with a figure. The number of fonts that have figures suitable for note calls approaches zero. For note calls, you need a set of superiors, 0-9. They need to be named something like zero.super, and be unencoded -- they are not scientific or mathematical superscripts. They usually need to be a bit smaller than numerators/denominators, and need to position to top align with the top of a lower-case letter with an ascender, which should match --pretty closely -- quotes and parenright, else a sequence such as</p>
      <p>(My pal")^note_number </p>
      <p>will make you a bit seasick.</p>
      <p>They need to be properly kerned with each other. They also need to be kerned with quotes, periods, commas, exclamation points, question marks, and brackets. Usual lower-case letters to check are c,f,f_f,g,i,j,q,r,s,t,v,w,x, and y. A few other things, too, but if the basic ones are good, the comp can do the rest by hand without losing too much time.</p>
      <p>FWIW</p>
