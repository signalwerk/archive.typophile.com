    <p>Dear Typophiles,</p>
    <p>I've followed this forum for a long time but this is my first post, so hello to all! :)<br>
    I write this because I really need someone that can help me to find an old Nebiolo Specimen which contains Forma typeface. I'm a young student and I need it for my bachelor's degree. Do someone have a specimen containing that typeface? If someone do have that, can you please scan some pages for me?</p>
    <p>I'll be very thankful, for every image or tips.</p>
    <p>Thank you,</p>
    <p>Gianluca</p>
