    html: |-
      <p>well, that script is pretty cramped and messy. I'm assuming you did that by hand so you might want to check out <a href="http://www.typedu.org/dynamic/lessons/" title="http://www.typedu.org/dynamic/lessons/">http://www.typedu.org/dynamic/lessons/</a> as a reference for where to place the weight of your letters.</p>
      <p>also, the alternating caps or size change (I can't tell which) in the second line, "to join us", is pretty out of place and distracting. </p>
      <p>other than that, the layout looks good. the anchor illustration was a nice choice in the context of a wedding. You also might want to think about putting a period after evening since the next line is a separate thing.</p>
