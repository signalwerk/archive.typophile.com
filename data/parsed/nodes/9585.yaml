    html: <p>In response to myself, I may have to explore more options as related to these laws. <br> <br>Law of Closure- if something is missing, our mind adds it <br> <br>Law of Similarity- our mind groups similar things together <br> <br>Law of Proximity- things that are close together are seen as belonging together <br> <br>Law of Symmetry- symmetrical images are seen as belonging together regardless of distance <br> <br>Law of Continuity- our mind continues a pattern even after it stops <br> <br>Figure-ground- minds have an innate tendency to perceive one aspect of an event as the figure or foreground and the other as the ground or the background <br> <br>3a and 3b fit into the last. For good or bad, i would like some help on that.</p>
