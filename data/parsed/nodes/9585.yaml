  html: "<p>Need some of you pros to get in and get all over this. <br> <br><img src=\"http://www.typophile.com/forums/messages/29/66631.gif\" alt=\"gestalting\"> <br> <br> <br>A friend and i have been trying to put together a name to work under. Though our first \"Fancy Lads Design Club\" is very amusing, we felt we made need to be a bit less sarcastic and more professional. <br> <br>So this is our follow-up. Gestalting. We are subversively mocking the English language and it making any word a verb and the our own profession in a way. Though I know it is gestalten \"to give shape or form\" in German, the english definition of \"gestalt\" is sort of boggling when it is so simple in German. <br> <br>\"an organized whole that is perceived as more than the sum of its parts.\" <br> <br>Here is another interesting summation: <br> <br>This 'gestalt', or 'whole form' approach sought to isolate principles of perception; seemingly innate mental 'laws', which determined the way in which objects were perceived. <br> <br>So what we took from it was the idea of that the whole is greater when the pieces work together. <br> <br>I know the one looks like a Cingular-conjoined twin! <br> <br>And i have also unintentionally created something within the mark by fulfilling the whole. Does that make any sense? <br> <br>Give me some thoughts on color, shape, placement and other things you see or don't see. <br> <br>jp</p>"
  html_clean: "<p>Need some of you pros to get in and get all over this. <br> <br><img src=\"http://www.typophile.com/forums/messages/29/66631.gif\" alt=\"gestalting\"> <br> <br> <br>A friend and i have been trying to put together a name to work under. Though our first \"Fancy Lads Design Club\" is very amusing, we felt we made need to be a bit less sarcastic and more professional. <br> <br>So this is our follow-up. Gestalting. We are subversively mocking the English language and it making any word a verb and the our own profession in a way. Though I know it is gestalten \"to give shape or form\" in German, the english definition of \"gestalt\" is sort of boggling when it is so simple in German. <br> <br>\"an organized whole that is perceived as more than the sum of its parts.\" <br> <br>Here is another interesting summation: <br> <br>This 'gestalt', or 'whole form' approach sought to isolate principles of perception; seemingly innate mental 'laws', which determined the way in which objects were perceived. <br> <br>So what we took from it was the idea of that the whole is greater when the pieces work together. <br> <br>I know the one looks like a Cingular-conjoined twin! <br> <br>And i have also unintentionally created something within the mark by fulfilling the whole. Does that make any sense? <br> <br>Give me some thoughts on color, shape, placement and other things you see or don't see. <br> <br>jp</p>"
