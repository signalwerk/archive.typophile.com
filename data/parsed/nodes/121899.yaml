      <p>Fairly close except it does not have concave sides: Frankfurter Medium by Alan Meeks <img src="/sites/default/files/old-images/FrankfurterAsMilkybar_4679.gif"><br><a href="http://www.myfonts.com/fonts/linotype/frankfurter/">http://www.myfonts.com/fonts/linotype/frankfurter/</a><br>
      Could be edited to make the sides concave. With this change and some minor tinkering it is possible to make something fairly similar to the lettering in the logo.<br>
      Don</p>
