    <p>Hi all,</p>
    <p>It is said many a time that design a logo for one's self can be quiet difficult. Well, it has definitely been the case with me for a long time. I reckon I have had a 1000 different attempts at coming up with something 'clever' and eventually just give up for a few months before giving it another crack.</p>
    <p>Though, I am starting to settle my thoughts into having something...let's saying..'not so crazy'.</p>
    <p>Well, here it is below. Just a play on my initals. I quiet like this idea and where it is going...but I don't know. Throwing my hands up.</p>
    <p>Open to all thoughts. </p>
    <p>Thanks,<br>
    MattBurns<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/B_Logo_3817.gif"></div><p></p>
