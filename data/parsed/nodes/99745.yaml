    html: |-
      <p>Well yes, any attempt at a forgery is a forgery, irrespective of the skill with which it’s done!</p>
      <p>By easy, I meant one that doesn’t take a lot of skill to convince people that it’s authentic, in other words one that confounds close inspection by discriminating eyes.</p>
      <p>So it doesn’t make sense to say that a bad forgery can convince people, because the proof of the pudding is in the eating, therefore a bad forgery that convinces people is a good forgery!</p>
      <p>What you are saying is that a speedily and conﬁdently written forgery can convince, even if a close study would reveal that it is by a different hand. </p>
      <p>There appear to be two levels of discrimination:</p>
      <p>1. Whether the reader is taken in by a quick glance<br>
      2. Whether the reader is capable of distinguishing authenticity by closer inspection</p>
      <p>Certainly, any old signature, conﬁdently rendered, will fool many readers (1), but what interests me is whether loopy Lew’s signature can be easily forged (both by skilled and unskilled writers) to deceive a close inspection by discriminating eyes (2)—forensic typographers, in fact!</p>
