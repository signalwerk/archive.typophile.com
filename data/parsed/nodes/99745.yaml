      <p>My signature is often illegible, but it contains the actual letters in my name, just written quickly. The loops that Jack Lew uses seem totally abstract; the equivalent of signing with a distinctive "X".</p>
      <p>I still think it's conceivable (although probably unlikely) that he invented an abstract "public" signature, to avoid using his real signature on public documents. I was a victim of identity theft last year when someone opened bank accounts in my name and ran up thousands in debts. Somehow the crook knew my social security number, etc. Fortunately I was able to prove it wasn't me, but it was a real nightmare for a while.</p>
