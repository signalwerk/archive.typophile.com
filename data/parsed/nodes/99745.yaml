      <p>My guess is that someone trying to forge his loopy signature would have the same classic problems that any forger encounters (uneven speed and pressure, pen lifts, hesitation, etc). Might be easy to fool the average person but probably not the expert.</p>
      <p>(I'm assuming that his loopy signature is consistent over time, and not just a random series of loops that is written differently each time.)</p>
