    html: |-
      <p>Yes, it’s brilliant and I thoroughly enjoyed it, but rather presumptuous! </p>
      <p>I’m afraid I must disagree with the premise that, “…he may need training if he wants a signature that will stand the test of time and popular opinion.”</p>
      <p>That’s irrelevant. One’s signature is one’s signature, and the only thing that really matters when it’s put on ofﬁcial documents is authenticity; therefore, the key issue is whether it can be easily forged.</p>
      <p>I suspect that popular opinion may be against his signature because people believe, mistakenly, that it is not sufﬁciently signature-ish, in the sense of being authentic—they think “it’s just loops, anyone could do that” —like the argument against modern art, “my kid could do that”. However, I don’t believe that anybody <em>could</em> do it, at least not to the same standard, applied to “normal” signatures, that would deceive an expert who can identify a personal style. (Nothing to do with graphology.) Even if he doesn’t always execute it with the same number of loops, the style is unique, <em>le style, c’est l’homme.</em></p>
      <p>Alternatively, does the signature indicate a lack of gravitas? Will he be like Zuckerberg, coming to work in his pajamas? John already answered that—graphology is a pseudo-science.</p>
      <p>Furthermore, altering one’s signature to curry popular favor is dissembling, not a desirable quality in a public ﬁgure.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Signature_6348.png"></div><br>
      NWS<p></p>
