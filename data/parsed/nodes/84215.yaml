  html: |-
    <p>Los Lana Pro is a handmade display typeface. Unlike other font families, this type has not a modular structure, that is, each character has been individually designed. The coherence of structure elements across different characters is given by irregular strokes. This curveless typeface is perceived as being curved because of its straight lines, which form different-size angles.</p>
    <p>Los Lana Pro is a rustic typeface that captures the stereotypical “Andean hippie” handmade aesthetics. Irregular shapes and broken lines give it a distinct personality. Los Lana Pro looks better in larger sizes. Includes many ligatures, two groups of alternate characters, and titling caps characters. Languages include: Basic Latin, Western European, Euro, Catalan, Baltic, Turkish, Central European, Romanian and Pan Africa Latin.</p>
    <p>Designed by Luciano Vergara</p>
    <p><a href="http://new.myfonts.com/fonts/latinotype/los-lana-pro/" title="http://new.myfonts.com/fonts/latinotype/los-lana-pro/">http://new.myfonts.com/fonts/latinotype/los-lana-pro/</a></p>
    <p><img alt="Merced Italic" src="http://farm7.static.flickr.com/6025/5988794413_f4cba17650_b.jpg"></p>
