    <p>The January edition of the Metal Type newsletter is now out. Click this link to take a look at the video: <a href="http://j.mp/k5KA95" title="http://j.mp/k5KA95">http://j.mp/k5KA95</a></p>
    <p>Plenty of stuff has been added to the forum in the last month, including more pictures of the "Standard Compositor" from 1925. A very unusual linecaster. <a href="http://j.mp/Uf6zuX" title="http://j.mp/Uf6zuX">http://j.mp/Uf6zuX</a></p>
    <p>"First Steps in Letterpress" for the absolute beginner who wants to start letterpress printing at home is now out:<br>
    Amazon US: <a href="http://j.mp/RURW2H" title="http://j.mp/RURW2H">http://j.mp/RURW2H</a><br>
    Amazon UK: <a href="http://j.mp/RkC9tY" title="http://j.mp/RkC9tY">http://j.mp/RkC9tY</a><br>
    Smashwords: <a href="http://j.mp/W5M8F3" title="http://j.mp/W5M8F3">http://j.mp/W5M8F3</a></p>
    <p>All the Best<br>
    Dave Hughes<br>
    York, UK</p>
