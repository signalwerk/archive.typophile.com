    <p>I was just flipping through Slashdot, and I came upon an <a href="http://yro.slashdot.org/article.pl?sid=05/04/17/2118203" rel="nofollow">interesting article</a> about the flaws of using a free typeface under the GNU Public License, or GPL. It appears that embedding one of those typefaces into any document makes it subject to the GPL. </p>
    <p>Some of the comments were particularly interesting such as this one:</p>
    <p><code>by dr.badass (25287)  on Sunday April 17, @11:04PM (#12266364)<br>
    I have to agree, the largest failing of Linux (and Java for that matter) is a good set of fonts. Why not make a bunch of truely Public Domain fonts so everyone can use them?</code></p>
    <p><code>There are plenty of public domain faces out on the web, but they're mostly of the novelty variety, and aren't really terribly relevant. Excepting them, here is why this hasn't happened yet:</code></p>
    <p><code>1) Good type design is pretty hard.<br>
    2) Good type design for all-purpose screen fonts is really hard.<br>
    3) Tools are either expensive or crap.<br>
    4) Good type designers cost money.<br>
    5) There just isn't much incentive.<br>
    6) Open source community attitude toward design issues generally sucks.</code></p>
    <p><code>It's a good idea, but the people to convince are professional type designers and foundries. Bitstream Vera is a (the only?) example I can think of like this, though it's merely under "generous copyright".</code></p>
