      <p>Fonts occupy a strange place between software and graphics; Misunderstanding about how they actually work is rampant. I offered a number of fonts that I'd designed (and packaged) to Debian five or six years ago -- I even offered to license them under the GPL, unmodified.  The only thing that came of it was a heated discussion among the Debian developers over whether TTF or PFB files counted as source code or binary.</p>
      <p>That said, the situation on Xorg has gotten much better lately, with the excellent rasterizing by <a href="/wiki/Pango" class="freelinking" rel="nofollow">Pango</a>/XFT/Cairo (not sure exactly which one does the heavy lifting) under GTK.  In my opinion, fonts render better on Xorg than in OSX or Windows. And a number of international fonts, in addition to the Bitstream Vera family, are included by default, at least under Debian and Ubuntu.</p>
      <p>The <a href="/wiki/FontForge" class="freelinking" rel="nofollow">FontForge</a> home page lists a number of open-source font development projects: <a href="http://fontforge.sourceforge.net/index.html#font-devel" title="http://fontforge.sourceforge.net/index.html#font-devel">http://fontforge.sourceforge.net/index.html#font-devel</a></p>
