  html: <p>I can feel vibes of displeasure from some people regarding <br>the Critique threads, and it's coming out in <br>little barbs and jabs. <br> <br>Consider me jabbed. <br> <br>So I thought I'd clarify. <br> <br>1. I am not the one who proffered the <br>notion of it not being 'okay' to post your own logo versions in <br>another person's thread. <br> <br>If I remember correctly, Joe (Joseph Pemberton) was the first to say something <br>to the effect of, "Let people do their own work!" <br> <br>It made sense, and I took that as an edict. <br> <br>In another thread, Stephen lamented about the practice, calling it selfish, if i remember correctly. <br> <br>So... <br> <br>1. The posting of Joe and Stephen curtails. <br>2. New typophiles join who don't know of the edict. <br>3. Posting work in someone else's thread becomes the norm. <br> <br>I thought it was the right thing to do to speak up ...  <br> <br><a href="http://www.typophile.com/forums/messages/29/25795.html?1076278621" target="_blank">http://www.typophile.com/forums/messages/29/25795.html?1076278621</a> <br> <br>So if anyone would like to discuss, please feel free. <br> <br>My opinion is that the practice is okay if you ask offline. Very simple. <br> <br>I'd appreciate it if you'd use this thread as a forum to <br>voice your opinions ... <br> <br>thanks, <br> <br>bj</p>
  html_clean: <p>I can feel vibes of displeasure from some people regarding <br>the Critique threads, and it's coming out in <br>little barbs and jabs. <br> <br>Consider me jabbed. <br> <br>So I thought I'd clarify. <br> <br>1. I am not the one who proffered the <br>notion of it not being 'okay' to post your own logo versions in <br>another person's thread. <br> <br>If I remember correctly, Joe (Joseph Pemberton) was the first to say something <br>to the effect of, "Let people do their own work!" <br> <br>It made sense, and I took that as an edict. <br> <br>In another thread, Stephen lamented about the practice, calling it selfish, if i remember correctly. <br> <br>So... <br> <br>1. The posting of Joe and Stephen curtails. <br>2. New typophiles join who don't know of the edict. <br>3. Posting work in someone else's thread becomes the norm. <br> <br>I thought it was the right thing to do to speak up ...  <br> <br><a href="http://www.typophile.com/forums/messages/29/25795.html?1076278621" target="_blank">http://www.typophile.com/forums/messages/29/25795.html?1076278621</a> <br> <br>So if anyone would like to discuss, please feel free. <br> <br>My opinion is that the practice is okay if you ask offline. Very simple. <br> <br>I'd appreciate it if you'd use this thread as a forum to <br>voice your opinions ... <br> <br>thanks, <br> <br>bj</p>
