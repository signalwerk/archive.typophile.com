    html: <p>Being that we are all visual, it is often easier (I'm guilty) to take what someone has posted and manipulate it until it is what we think it should be. However, from a teacher's point of view, I can also see how this is not the most direct path to learning on the part of the student. That said, I agree with Kris' idea of an icon. That way no one has to ask offline (although this is good) ... and we can all play with one another nicely. <br> <br></p>
