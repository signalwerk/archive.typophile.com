    date_raw: 10 Feb 2004 — 10:54pm
    votes: null
    html: <p>I think there's more value in manipulating the curve of a letter to match a verbal suggestion, tweaking it until you think it's right, than simply changing your work to match the sample of someone who suggested an improvement. <br> <br>Randy Jones does a great job on his critiques. He uses sketching to point out areas that could be improved, and offers general direction on how to do it. But he doesn't redraw characters (or logos or...) for anyone.</p>
    html_clean: <p>I think there's more value in manipulating the curve of a letter to match a verbal suggestion, tweaking it until you think it's right, than simply changing your work to match the sample of someone who suggested an improvement. <br> <br>Randy Jones does a great job on his critiques. He uses sketching to point out areas that could be improved, and offers general direction on how to do it. But he doesn't redraw characters (or logos or...) for anyone.</p>
  - id: 24232
    user: 2172
    date: 2004-02-11T06:55:00
    date_raw: 11 Feb 2004 — 6:55am
    votes: null
    html: <p>I've offered visuals as examples, so I'm 'guilty' in this case. Offering professional help means opening yourself up to giving away what you normally get paid for. It may be 'bad form' to do it here, but how often do you sketch something for a colleague at your office rather than verbally articulate it because it's just easier? It's the difference between a quick sketch (digital or otherwise) and a fully refined 'suggestion'. <br> <br>We're visual, so it makes sense that this happens. <br> <br>But, I see how it gets out of control sometimes. I agree that an icon/ standard invitation to sketch will probably diffuse the issue.</p>
