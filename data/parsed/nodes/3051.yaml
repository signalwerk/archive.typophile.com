    html: <p>personaly i don't see how a visual/graphic critique is any different from a written/verbal one. in any case a critique is just a suggestion which one is free to accept or reject. everyone has opinions and insight to offer, not all you will agree with. making final decisions allows the person whose work is being critiqued to "own" their design (at least that would work for me emotionaly) for example, if someone recommends a certain typeface for a project and someone else says the same face would be a bad idea, i have to come to the final conclusion of whether to use it or not. the final decision is mine, my own. i always appreciate any comments, critique that anyone on here has to offer and take them all with a grain of salt... from what i've experienced here we're all capbable of playing nice and if the person whose work is being critiqued doesn't want certain types of suggestions, they can always request that they not be made, but then what's the purpose of the critique?</p>
