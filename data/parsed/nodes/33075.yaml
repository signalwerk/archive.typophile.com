    <p>It’s my first post here. So... Hello :)</p>
    <p>I wonder if somebody knows some books in which the typography goes crazy.<br>
    For example. You have a normal written book an all of sudden the linespacing becomes double, triple or even more. You have just one word in a line or the typesize increases from 12pt to 300pt and so on. And maybe as suddenly as the typographic craziness began it  disappears again and the book goes on as if it were a totally normal novel. </p>
    <p>Any idea?<br>
    Would be awesome.</p>
    <p>Cheers<br>
    Vit</p>
