    html: |-
      <p>This is a really innovative take on a display font. I like it lots. Not only is it very different but it's also legible. Complete it and put it out there. I'm sure it will get used. Very nice indeed.</p>
      <p>About your variations: I think the only one that's actually working is the middle one. Filled shapes with negative outlines. But you may as well forget about the other two. If anyone wanted to get the effect of the first variation, they can do it with the original outlined font, and the last one doesn't look good and has some legibility problems.</p>
      <p>About some shapes:</p>
      <p>/H/ is not good. It doesn't resemble H. When I see it in alphabet I know it's an H, but if I'd see in in text I'd have problem recognising it. All the others are.</p>
      <p>/!/ exclamation mark should be heavier. Considerably.</p>
      <p>/%/ should be changed. I suppose it wouldn't be bad to try to overlap circled with the straight</p>
      <p>/@/ although similar to how reg.trademark and copyright are done I suppose it's not a good solution. Although it makes me think who would want to write their email address using this display font (stupid of me... who would want to use Comic Sans in formal papers either?! We can see that many = this means you have to make @ recognisable).</p>
    html_clean: |-
