    <p>Here is my first attempt at making a font :</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/vasymolo_poster_5716.png"></div><p></p>
    <p><a href="http://new.myfonts.com/fonts/bukacake/vasy-molo/" title="http://new.myfonts.com/fonts/bukacake/vasy-molo/">http://new.myfonts.com/fonts/bukacake/vasy-molo/</a></p>
    <p>I would be happy to get any comments from all of you, because I didn't had much feedback from typographers.</p>
    <p>Anyway, when I made it, I didn't tought it would be accepted on MyFonts, so when I saw people was buying it, I started to think about a full charachter set and redesigning all glyphs to make them work better each others. I'm also working on the kerning, hinting and all things that needs to be done to make it more 'professionnal'.</p>
    <p>Thanks by advance,</p>
    <p>Bernard.</p>
    <p>Edit :</p>
    <p>Sorry for bumping guys, but I think my post should be in this place rather than in Release, as it's still a work in progress, and I'd be very glad to get any comment.</p>
    <p>I'm not here to tell you "Yo Dude, buy my font!".</p>
