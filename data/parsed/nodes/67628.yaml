      <p>Elegant and legible, especially for something like this. One thing that bothered me about the original was the counter of the Q, so I'm glad to see you've already changed it for the better. Numerals, currency, braces are great.</p>
      <p>Asterisk and daggers lack twist. I would have expected them to be all outward loops.<br>
      Exclamation could be wider.<br>
      Bottom half of Yen symbol should probably be a vertical rectangle.<br>
      Ampersand seems rigid. I'd try trading the two little loops in the upper right for one big diagonal loop.<br>
      For @, I recommend starting over and not basing it on the A. I can see a big spiral with the inner end connected to the outer end.</p>
