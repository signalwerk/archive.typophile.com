    html: |-
      <p>Because that’s CSS3:</p>
      <p><code>li:nth-child(29) {<br>
      	font-size: 36px;<br>
      	}</code></p>
      <p>Otherwise I had to write li + li + li …</p>
      <p>My consideration was, that probably all webfont-capable browsers understand that CSS3 rule.</p>
      <p>I only know a bit Javascript. More to the point, I already have forgotten the most, that I did know about Javascript, and I never did know much about Javascript. It would be better to change the class of the waterfall-ul by clicking on the items of the style list at the top instad of repeating the code of the waterfall in the markup. And the font-sizes of each li-tag also should be changed with Javascript. That would be much more elegant and additionally it would reduce the file-size, which already is relatively small.</p>
      <p><cite>Works fine in the latest Safari on Tiger</cite></p>
      <p>But that’s not Delicious in your screenshot of Safari.</p>
