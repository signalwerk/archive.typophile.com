    html: |-
      <p>Here's version completely without kerning - only spacing!</p>
      <p><a class="freelinking external" href="http://www.tourdefonts.com/typophile/Enforcer_Regular_spacing_test.pdf" rel="nofollow">Enforcer Regular - Spacing Test</a> (PDF ~450kb)</p>
      <p>I used method of grouping all same/similar shapes (rounded with rounded, straight with straight...).</p>
      <p>I noticed some irregularities (/e/ with /s/ is maybe too close...). Didn't checked so far how problematic combinations looks (/j/, /k/, /v/, /y/, /t/... /T/, /J/, /L/..), but at the this moment, this version is maybe the best so far.</p>
      <p>- - -</p>
      <p>Add-on: I just saw Nina's post. You're absolutely right about everything. It must take some time to figure it out by myself and all your comments were very useful in way making me suspicious if what I done in first place was good. If Arno didn't told me about too much kerning pairs, I'd never roll back to spacing as #1 in whole process.</p>
      <p>Thanks for your kindly support and having a patience with me :)</p>
