    html: |-
      <p>Spacing and kerning are a disaster. I wonder, why you have doubts about the quality. It’s extremely uneven. Why is there kerning between i and j for example? Why is there positive kerning between w and o and negative between r and m? Another example: It’s and like. There is more space between the stems of I and t than between l and i. I and t is less critical in case of your font than t and h. While t and h may need more spacing, although the distance between the stems of t and h are the same as in i and h, the cross bar of the t is no reason for enlarging the distance between I and t.</p>
      <p>By the way, it is better to kern in big point sizes with a big distance to the screen because of rounding imprecisions in FontLab. And kern words, but not whole sentences. You can use a free dictionary like the one, that OpenOffice uses, in FontLab. Try to create a list, in which you have an order of kerning/spacing, alphabetical like aa, ab, ac … or with regard to the forms ii/ij/hn, oo/oe/od, wo/we. (I prefer the alphabetical order.)</p>
      <p>1. There are too many kerning pairs.<br>
      2. There are too many positive kerning pairs. In most well spaced fonts, that I have seen, positive kerning was the exception, but not the rule.</p>
      <p>Check the following articles on "http://www.typeculture.com/academic_resource/articles_essays/": <em>Basic Character Spacing in Type Design</em> and <em>Rhythm in Type Design</em></p>
      <p><cite>Don’t even think about kerning until the spacing is absolutely perfect.</cite></p>
      <p>Absolutely right. And not only with regard to the evenness, but also with regard to the general spacing.</p>
