      <p>I've personally found that learning to <em>see</em> space takes serious time and practice, and is easily trickier than drawing glyphs. So while I don't think that (1) belittling the original poster or (2) showing how super well other people can do their spacing is necessarily the most helpful thing, and while I also don't agree that spacing and kerning can or should be <em>completely</em> separate processes, I'd also say: forget about kerning for the moment; scrap what you have for spacing; and start over with it.</p>
      <p>Take your time with the spacing. Allow your eyes time to learn to see it. Use your eyes, but use a system for guidance. (I myself highly recommend the one Walter Tracy outlines in <em>Letters of Credit</em> as a starting point.) Spacing is very hard to critique from outside, so you'll probably largely need to trust your own eyes and your own system. Work on getting the spacing to a point where it works well in all but the most egregious exceptions, before you think of kerning again, which really should only be used to refine exceptions.</p>
      <p>The reason BTW is not just that it's less work (in the long run) that way, but that you get better results in a variety of settings: Kerning is highly specific, whereas good spacing ensures a good overall «base» texture. If your font needs a lot of kerning to look decent, you'll easily be in trouble once someone tries to set a language you're unfamiliar with that uses character sequences you didn't test. And obviously you can never test all combinations that anybody might want to use, so it's advisable to have a stable basis and refine from there (through kerning). Also, there are still applications that don't support kerning.</p>
