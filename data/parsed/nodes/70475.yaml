      <p>Gornji: Although the screen is a bad place to judge, the text below has zero – 0 – kerning pairs.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/space_5955.png"></div> <p></p>
      <p>Only at this point would I consider kerning. First: troublesome lc combinations, although most can be fixed with adjusted sidebearings and/or character shape. Second: combinations that leave a huge gap, like “T” followed by letters on the x-height, “L” followed by “T”, “A” followed by “V” and so on.</p>
