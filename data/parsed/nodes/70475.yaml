      <p>@ tourdeforce</p>
      <p>It is not possible to decide about the quality of kerning in low sizes on screen. You even have rounding errors in 72 pt (Points? I am not sure at the moment about the unit. I mean the size in FontLab).</p>
      <p>When I kern, I change the size frequently. And in the end I print the pairs (contained in words).</p>
      <p>I cannot really value all pairs in your examples, but only the extreme ones and primary in the bigger size.</p>
      <p>But there were so many red marks (positive kerning indicators) – it looked as more than 15%. Round about 50%.</p>
      <p>1037 pairs are indeed not necessarily too many, but there seemed to be many wrong ones. And again, whole sentences irritate my eyes. Single pairs also don’t give a correct impression. The context is necessary, but words are enough for the kerning on screen (in my opinion). It’s partly dependent from the screen size. On a small TFT I would search for words, that don’t contain more than round about eight characters.</p>
      <p>When you are ready, you could provide a PDF with a list of words, in which all pairs are contained. That’s better than screenshots.</p>
      <p>By the way, I think, that your font is relatively hard to kern, because it does not forgive mistakes. This is probably caused by the regularity of the shapes and the squareness. I generally don’t get warm with the most sans serifs, especially not in big sizes. (I miss the serifs in big sizes more than in low sizes.)</p>
      <p>And you should know, that I am a pure amateur. When I am talking about letters, it is primary feeling, but not a long year experience. But I think, that I have a good feeling for spaces. Probably more than for the features of the shapes. Maybe not, I don’t know. I often can’t comprehend the opinions of the professionals here about some fonts. In my eyes many of the lauded fonts are oversharp or overdetailed. I don’t like Maiola for example. But I extremely like Merlo. I like the Berthold Van Dijck more than the DTL Elzevir, because I can better read Van Dijck. This is partly caused by my printer, but probably not only. My eyes seem to draw lines in the reading process, if the shapes of glyphs are extremely sharp, especially when the irregularities are very limited in a font. Stempel Garamond is already a joy with my laser printer, but if it is printed more dirty and less sharp, I can better read it yet. What I want to say is, don’t give too much on my critique.</p>
