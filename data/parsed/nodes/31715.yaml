    html: |-
      <p>If you test different flavors of otherwise "same" OTFs, you <cite>must</cite> clear all font caches -- both Adobe's AdobeFnt*.lst and the OS's -- before installing the other flavor.<br>
      As regards Windows, perhaps somebody else can jump in and tell how to delete them properly.</p>
      <p>There was (is?) a problem with testing different flavors of OTFs in the Windows-version of InDesign. Say, you install and test the PS-OTFs first, deinstall the fonts, then install the TT-OTFs, InDesign still has the information that fonts were PS-OTFs and looks for PS-outline which are not present in TT-OTFs. (If you place the cursor where was text before, you'll notice that the glyph's metrics are there, but it just doesn't render the outlines.)<br>
      If I remember correctly, it is irrelevant if you test PS or TT flavor OTFs first.<br>
      I thought this bug is removed already, but since you write "but I get nothing just a blank text box" it seems it isn't.</p>
      <p>So it's important to remove all references (caches) to the previously installed different-flavor OTFs.</p>
    html_clean: |-
