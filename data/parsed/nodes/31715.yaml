    html: "<p>I had a similar problem with CFF-flavored Opentype fonts and PS Type 1 fonts on the PC. I installed the OTF font first for testing, then uninstalled it and attempted to install the PS font of the same name. I got an error message saying the font file was damaged. We will probably need to send up a Phinn-signal for this one, because I believe that the Adobe Font Handler is responsible for the problem: all I can gather is that, once a font with a certain name is installed, the Font Handler looks for other instances/formats of that font, and disables them in some way or another.</p>"
