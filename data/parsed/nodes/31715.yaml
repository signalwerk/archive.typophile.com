    html: |-
      <p>For the "AdobeFnt*.lst" files, you should use Windows' search/find function and search for the phrase "AdobeFnt", and include system folders in the search (there's a checkbox somewhere).<br>
      Then delete files looking like "AdobeFnt10.lst" or "AdobeFnt7.lst".<br>
      But don't delete files ending with ".db"!</p>
      <p>For Windows font cache files, someone else must help. I don't use Windows much ...</p>
      <p>I wonder, do you have the very latest version of InDesign (4.0.4)? Just curious, since I encountered this problem with the demo version which was 4.0 or so.</p>
      <p>Best wishes, Karsten</p>
