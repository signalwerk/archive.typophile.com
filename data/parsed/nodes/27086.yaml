  html: '<p>RARE BOOK SCHOOL (RBS) is pleased to announce its Spring and Summer <br>Sessiona 2003, a collection of five-day, non-credit courses on topics <br>concerning rare books, manuscripts, the history of books and printing, and <br>special collections to be held at the University of Virginia. <br> <br>FOR AN APPLICATION FORM and electronic copies of the complete brochure and <br>the RBS Expanded Course Descriptions (ECDs), providing additional details <br>about the courses offered and other information about RBS, visit our Web <br>site at: <br> <br>               <a href="http://www.rarebookschool.org" target="_blank">http://www.rarebookschool.org</a> <br> <br>Subscribers to the list may find the following Rare Book School courses to <br>be of particular interest: <br> <br> <br>52. TYPE, LETTERING, AND CALLIGRAPHY, 1450-1830. (MONDAY-FRIDAY, 14-18 <br>JULY). The development of the major formal and informal book hands, the <br>dominant printing types of each period, and their interrelationship. Topics <br>include: the Gothic hands; humanistic script; the Renaissance inscriptional <br>capital; Garamond and the spread of the Aldine Roman; calligraphy from the <br>chancery italic to the English round hand; the neo-classical book and its <br>typography; and early commercial typography. The course presupposes a <br>general knowledge of Western history and some awareness of the continuity <br>of the Latin script but no special knowledge of typographical history. <br>Instructor: James Mosley. <br> <br>JAMES MOSLEY is Visiting Professor in the Department of Typography &amp; <br>Graphic Communication at the University of Reading. He retired as Librarian <br>of the St Bride Printing Library in London in 1999. The founding editor of <br>the Journal of the Printing Historical Society, he has written and lectured <br>extensively on the history of European and English typography. In 2003 he <br>received the annual award of the American Printing History Association for <br>his contributions to printing history. <br> <br> <br> <br>63. INTRODUCTION TO THE HISTORY OF TYPOGRAPHY. (MONDAY-FRIDAY, 28 JULY - 1 <br>AUGUST). A survey of European and American typographic history from 1450 to <br>the present, but concentrating on the period 1480-1950. Topics will <br>include: the development of Roman and italic; from Old Style to <br>Transitional to Modern (Italian, French, Dutch, and English developments); <br>display types; the coming of machine composition and the historic revivals; <br>typeface nomenclature; and techniques for dating pre-1885 hand-set <br>typefaces and for naming post-1885 machine-set typefaces. In laboratory <br>sessions, students will have a chance to set type by hand, proof, and <br>print. Instructor: Stanley Nelson. <br> <br>STANLEY NELSON has been a specialist for many years in the Graphic Arts <br>Collection of the National Museum of American History, Smithsonian <br>Institution, and he has given many demonstrations and lectured widely on <br>various aspects of typographic history. He is both author and presenter in <br>the 1985 Book Arts Press videotape, From Punch to Printing Type: The Art <br>and Craft of Hand Punchcutting and Typecasting.</p>'
