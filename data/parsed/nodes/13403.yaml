    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Organizations" class="freelinking" rel="nofollow">Organizations</a> : ATypI (Association Typographique Internationale)</strong></p>
    <p>ATypI (Association Typographique Internationale) is the premier worldwide organisation dedicated to type and typography. Founded in 1957, ATypI provides the structure for communication, information and action amongst the international type community.</p>
    <p>Website: <a href="http://www.atypi.org/" title="http://www.atypi.org/">http://www.atypi.org/</a></p>
