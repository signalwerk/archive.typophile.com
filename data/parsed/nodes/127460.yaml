  html: |-
    <p>Hello! First post, and I hope its one you can sink your teeth into a little bit. (For context, this is for the sake of a design... I am not just looking for something to use).</p>
    <p>I have been unable to find examples of a STRESSED SERIF typeface (or many typefaces at all) that include a squared capital A with tapered legs. I don't just mean a flat point, I mean a small crossbar at the top. (images attached) Maybe I am Googling the wrong terminology or something, but Identifont also offered nothing useful. A square-top 4 or a square-bottom V would be similarly interesting/useful.</p>
    <p>1) Do you know of any digitized fonts that include such a glyph?<br>
    2) If not digitized, any nice examples in the wild? I would kill for one elegant reference point.<br>
    3) In general, any tips about designing that glyph so it doesn't feel like a brick? </p>
    <p>All input is much appreciated!</p>
