  html: <p>Hi, <br>there's this big german medical company called Boehringer Ingelheim. They even have their own corporate font. The problem is, I have no idea, what kind of font this EXACTLY is... I need it for use on a PC, hopefully in EastEuropean (EE) or CentralEuropean (CE) version...  <br> <br><img src="http://www.typophile.com/forums/messages/83/16816.gif" alt=""> <br> <br>Any idea, what this thing could be? Looks familiar, doesn't it... <br> <br>Gentlemen, start your engines. <br> <br>Peter</p>
