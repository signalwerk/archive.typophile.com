    html: <p>Yes, the dimensions remind me of Times, yet this one is much-much better done (meaning more "modern"). I thought of some FontShop release, but it looks not like that... No idea so far. Here is the logotype of the company - it uses a more condensed version of their corporate font. Maybe that could help a bit out... <br> <br><img src="http://www.typophile.com/forums/messages/83/16838.gif" alt=""></p>
