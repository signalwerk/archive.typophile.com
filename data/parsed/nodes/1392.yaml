    html: <p>This font looks like Berthold "Concorde" that has had the Q modified. The W is missing from the sample, but all the other letters and numbers, I think, look identical to Concorde. See the sample <a href="http://www.philsfonts.com/detail.html?sku=AB80084001P1" target="_blank"> at Phils Fonts</a> and see if you don't agree that is the base font here. Really it seems that little was changed.</p>
