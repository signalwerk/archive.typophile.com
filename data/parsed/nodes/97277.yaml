      <p>Google is your friend:</p>
      <p>"Foundry Gridnik was developed from the single weight monospaced 'typewriter’ face, originally created by Dutch designer Wim Crouwel in the 1960s. <strong>Crouwel's devotion to grids and systems led to his affectionate nickname of ‘Mr Gridnik’, </strong>and this inspired the new typeface family name. Foundry Gridnik’s distinct geometric design has been described as ‘the thinking man’s Courier’. Crouwel said, ‘I am a functionalist troubled by aesthetics’, and although Gridnik is based on logic, rationality and strict adherence to the grid, it also has a human dimension that sets it apart."</p>
