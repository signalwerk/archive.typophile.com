    <p>am - amor, amori </p>
    <p>                              my gypsy rose<br>
                                  told me<br>
                                  blood tribes do not recruit</p>
    <p>                              i may mate,<br>
                                  neither manifest in destination<br>
                                  nor moribund in mulhabandha<br>
                                  as i’ve been fond of saying...</p>
    <p>                              so yeah he rules. he’s way cool.<br>
                                  i will probably write extensive addenda as i<br>
                                  internalise the others and their rational-emotive<br>
                                  contexts.<br>
                                  the first, of course from music.</p>
    <p>                              i also gonna versify.</p>
    <p>                              but<br>
                                  one popular metaphor which zoltan almost neglects<br>
                                  is love as a drug</p>
    <p>                              Substantiative properties can be characteristic of<br>
                                  some element of the relationship as well.<br>
                                  The difference between a leaf and a powder.<br>
                                  will expound on that. (pharmacological pun<br>
                                  intended)</p>
    <p>                              I. love is an addictive thing which programs it’s<br>
                                  own belief subsystems<br>
                                  A. belief produces behavior (love controls)</p>
    <p>                              II. separation from the beloved is withdrawal<br>
                                  symptoms,<br>
                                  A. curiously neurochemically mirrored by the body<br>
                                  1 Does the body follow the minds orders based on<br>
                                  some belief about attachment<br>
                                  2. At what phase of early childhood are these<br>
                                  beliefs formed<br>
                                  a. analysis of linguistic sophistication of<br>
                                  baby-talk in art may yield a fair assessment</p>
    <p>                              III. Descriptor and ’types’ of subjective high are<br>
                                  the relative merits of the relationship.<br>
                                  A. “making me shake” &amp;<br>
                                  B. Journey metaphor, when taken on the vertical<br>
                                  axis “you make me so high”</p>
    <p>                              IV. Intensity of dosage equals depth of<br>
                                  relationship<br>
                                  A. Can be negative - “the thrill is gone”<br>
                                  B. Inversely proportional if drug tolerance is<br>
                                  implied “cant get enough of you”</p>
    <p>                              V. Duration of effect has lewd and other parallels </p>
    <p>                              A. “all night long” “</p>
    <p>                              and of course, raja yoga - to represent kama in<br>
                                  manifesto amor</p>
    <p>                              Tantric Love Metaphors<br>
                                  and<br>
                                  the cycle of fifths</p>
    <p>                              (under construction)</p>
