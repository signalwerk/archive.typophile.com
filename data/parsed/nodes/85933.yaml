    <p>Sánchez<br>
    Designed by Daniel Hernández</p>
    <p>Sánchez is the Latinotype’s first display type family. It is a serif typeface belonging to the<br>
    classification slab serif, or Egyptian, that bears a strong resemblance to the iconic Rockwell, but<br>
    with rounded edges— offering contrast and balance to the square structure. Sánchez comprises 12<br>
    variants, ranging from extra light to black, each of the same x-height. Regular and italic variants are<br>
    available for free. </p>
    <p><a href="http://new.myfonts.com/fonts/latinotype/sanchez/" rel="nofollow">new.myfonts.com/fonts/latinotype/sanchez/</a></p>
    <p>Selaive</p>
    <p>Designed by Paula Nazal</p>
    <p>Selaive is a geometric typeface that has an air of rebelliousness. The thick and thin versions give you the chance to play a coquettish and seductive game. Its flourishes make it a very dynamic typeface when composing a text, ideal for those who want to add a personal and glamorous touch to their compositions.</p>
    <p><a href="http://new.myfonts.com/fonts/latinotype/selaive/" rel="nofollow">new.myfonts.com/fonts/latinotype/selaive/</a></p>
    <p>Fidel</p>
    <p>Designed by Luciano Vergara</p>
    <p>Fidel Black Essential is a heavily weighted, condensed, sans-serif typeface with a large x-height.<br>
    Ideal for short, high-impact headlines, its design is inspired by Russian Constructivism and old<br>
    Cuban communist posters. Variants include Fidel Black, Fidel Black Italic and Fidel Black Stencil.</p>
    <p>Fidel Black Essential is an excellent choice for headlines, subheadings, posters and logotypes.</p>
    <p><a href="http://new.myfonts.com/fonts/latinotype/fidel/" rel="nofollow">new.myfonts.com/fonts/latinotype/fidel/</a></p><div class="imageWrap"><img src="http://typophile.com/files/news_sept_1typophile_4957.png"></div><p></p>
