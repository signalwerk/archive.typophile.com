  html: |-
    <p>Hello,<br>
    I'd like some of your expert guidance on selecting fonts to use in branding. The company is an eLearning producer and has been using Verdana for 100% of everything. Visually, I'm more relaxed when reading Calibri - as it's not as wide as Verdana. But I'm not sure that a switch to Calibri will mean anything to anyone else.</p>
    <p>How do you recommend we go about selecting (and justifying) a new standard set of fonts for our marketing and corporate communication?</p>
    <p>Thanks in advance for your insights.<br>
    Irene</p>
