    html: |-
      <p>IKEA switched over entirely Verdana last year and nobody outside of typography forums seems to have noticed.</p>
      <p>In making a choice of type for branding, it helps to know as much about the company and product as possible.</p>
      <p>Does the company already have an established identity? To what extent are they open to changing it?<br>
      What is the specific nature of the product line?<br>
      Who are the targeted customers? Are the people who buy the product actually the same as the end users?<br>
      Where are they located? Do they want to express a regional association or conceal it, or do they feel it should be irrelevant?<br>
      What situations require specific font designations, and where can product/publication designers be allowed free rein? Is readability or brand identification the greater concern?</p>
