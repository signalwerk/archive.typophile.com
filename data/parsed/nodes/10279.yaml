  html: <p>i'd like to take this opportunity to introduce myself,  as i just discovered this website this weekend, and i'm amazed i hadn't sooner.   <br>i love typography, but i definitely can't flatter myself to say i know even a quarter of what everyone else seems to know; i'm just a [fourth year] graphic design student. <br>i spent a few hours browsing the forums, especially the critique section, and i must say in that short amount of time i've learned a lot. i definitely feel like i hit the lottery! <br> <br>thanks!</p>
