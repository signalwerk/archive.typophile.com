      <p>Hi Tony,</p>
      <p>Did you try playing with the uppercase of these two letters, it could be more successful. The uppercase N and H have a similar form and could be played with without the llama effect happening.</p>
      <p>Another option is to keep the serif on the lowercase n and remove it from the ascender on the h part.</p>
      <p>Good luck!<br>
      Diane</p>
