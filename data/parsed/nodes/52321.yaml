    <p>I am working on a monogram for a wedding.<br>
    Norman and Helene are the names of the couple to be wedded.<br>
    Her initial feedback is that it is a little too abstract and the "h" looks like a lama.<br>
    Can I get some feedbacks?</p>
    <p>thanks for your time!<br>
    :tony</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/nh_monogram_6248.jpg"></div><p></p>
