    html: |-
      <p>If this looks like a lama...</p>
      <p>You have a good concept here, it is creative and does exactly what it needs to, I'm sure the main issue with the client is that she is expecting a mono using a script wedding face, which will not work with this concept. I think you could try a few different faces as well as Will's idea to finesse out the cut creating a more styled 'n' and 'h'. I do think you need a face that has a visual tie in the 'h' character so when you do make the split the pieces still look part of the same realm.</p>
      <p>Of course, as a married person, this concept could be crushed the minute someone say it represents a break up not a union.</p>
      <p>-titz</p>
