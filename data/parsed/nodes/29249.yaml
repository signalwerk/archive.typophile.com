      <p>Choz, apologies for my entirely too vague comment from last night. (I really shouldn't post late at night.)</p>
      <p>On the surface, yes, ATypI and SOTA, are too different orgs. You <em>could</em> separate them as the former being for the business and the latter for the enthusiast. But, if you delve under the surface you will find many similarities. Both focus on the educational, historical, and technical sides as well. You will find more graphic designers at a SOTA conference (TypeCon) than you will at ATypI, but both conferences garner support from practicing type designers and foundries. As well, both are equally good for networking. Many people who attend TypeCon also attend ATypI. </p>
      <p>TypeCon is held once a year somewhere in the U.S., this year in Seattle, whereas ATypI travels between continents. TypeCon's workshops have a broader interest in the book arts, letterpress, and graphic design, but all from a type enthusiasts point of view; as well as having workshops on the technical side of type creation. ATypI has the TypeTech forum which focuses on type and its creation and use, much more technical and generally not for the beginner. Both organizations are determinedly involved with education. </p>
      <p>For instance, if you do want to hear about DRM, all you have to do is put a bug in the ear of a board member, me for instance, and we can try to get something put together at TypeCon. (The same could be said for ATypI.) Last year, Frank Martinez led a discussion about the legal side of things, most specifically the EULA and copyright I believe at TypeCon. However, the BEST way to get a talk on DRM is to volunteer to speak on it. ;^) Or, to find someone more qualified and tell them to volunteer. Volunteering is what keeps both organizations going. It is to the volunteers and those that attend and participate that make these conferences work and keep the organizations going.</p>
      <p>Simon gave you a very good question and I'll have to second that. You will get out of the group what you put into it.</p>
