      <p>What I am looking to get, at this point, is a sense of what opportunities involvement in any group might bring. It appears that ATypI is a professional group and SOTA is an enthusiast's, to probably oversimplify. The other groups Tiffany mentioned I am not familiar with.  I am curious what people have to say about each, particularly since I am not connected to "the type scene" of my area. If there is one.</p>
      <p>Some things I am curious about are the future of type and such things as emerging computer typography, DRM and its place in type, as well as various things such as independent foundry culture, online collaboration tech, and communicating the value of type as media itself. Or just networking. I imagine I might learn more at this point by just gathering people's impressions, rather than saying, "I feel so-and-so, who shall I hang with?"</p>
      <p>I'll have to say, in some industries, it was worth the price of memebership, and no other commitment, to get the magazine. :)</p>
