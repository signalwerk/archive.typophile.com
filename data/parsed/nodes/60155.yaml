    html: |-
      <p>Nice alphabet. Some of the letters are actually reminding me of posters from Sci-Fi Movies but regarding to readabilty I have some suggestions.</p>
      <p>In the alphabetical context I can read all the letters. But when I imagine seeing them in practical usage I have problems with some capital letters (the lowercase letters are all working for me).</p>
      <p><strong>B:</strong> Almost looks like "G". Maybe try to make the upper shoulder like in "R" and "P".<br>
      <strong>I:</strong> Can easily be confused with an "L".</p>
      <p>I don't understand the concept behind the roundings of your capital letters. Sometimes the thick roundings are a fundamental part of the letters (like in "C", "D", "G" ...) and sometimes they are just decoration (like in "E", "F", "H" ...). Nevertheless you have thin roundings (like in "O", "Q" ...) that are a fundamental part of the letter. It seems too inconsistent which conflicts with the idea of geometry. Might it be possible to use thick strokes for fundamental parts and thin strokes for decoration? This way the "E" e.g. looks like a combination of a vertically flipped "D" and an "E".</p>
      <p>I agree on what pentapus wrote about "M" and "W".</p>
      <p>One more thing -&gt; maybe flip the "t" vertically to give it a more typical look.</p>
      <p>I'm looking forward to seeing more from you "Fraktura"</p>
