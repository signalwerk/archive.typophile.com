      <p>I think the emphasis on the circle is the wrong direction.</p>
      <p>Fraktur capitals are enlarged uncials rather than ornamented Roman caps.</p>
      <p>Unger Fraktur offers several advantages as a model. It was developed in Berlin. It was Paul Renner's preferred fraktur when he used one.</p>
      <p>Good luck.</p>
