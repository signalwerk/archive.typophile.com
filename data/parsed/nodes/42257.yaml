      <p>Don't worry. I wouldn't recommend anything unprofessional. Another few in the vein of Ambiance:</p>
      <p><a href="http://www.fontshop.com/fonts/singles/ihof/p22_corinthia_regular/?sample_text=Genesis%20&amp;sample_size=144" rel="nofollow">P22 Corinthia</a><br>
      <a href="http://www.fontshop.com/fonts/singles/ihof/p22_ruthie/?sample_text=Genesis%20&amp;sample_size=144" rel="nofollow">P22 Ruthie</a><br>
      <a href="http://www.fontshop.com/fonts/singles/ihof/p22_sweepy_ot/?sample_text=Genesis%20&amp;sample_size=96" rel="nofollow">P22 Sweepy</a></p>
      <p>You have the problem in the word "Genesis" of double letters (e and s) so you'll want to edit your headline so that at least the 's's aren't identical. Cut off the trailing tail on the ending 's' for instance. Some fonts, like Ambiance, have contextual alternates for this purpose, but there aren't many in this genre.</p>
