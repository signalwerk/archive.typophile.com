    <p>Hey everyone, I'm new here. :)</p>
    <p>Writing because I'm looking for the perfect font for a design project. I'm doing the logotype for a church, and I need an organic script font to use for the word "Genesis." Ideally something very readable, something that feels very natural and looks current and clean. Any help is hugely appreciated!</p>
    <p>Matt</p>
