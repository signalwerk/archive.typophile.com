      <blockquote><p>Do you have any recommendations for good Open Source Fonts? Is there a good list out there?</p></blockquote>
      <p>I don't know about good but certainly quite exhaustive...</p>
      <p><a href="http://typophile.com/node/97575" title="http://typophile.com/node/97575">http://typophile.com/node/97575</a></p>
      <p>Reynir went to considerable lengths to compile an overview of what is available from different sources.</p>
      <p>The <a class="freelinking external" href="http://store1.adobe.com/cfusion/store/html/index.cfm?event=displayFontPackage&amp;code=1959" rel="nofollow">Adobe Source Sans Pro fonts</a>, released last year come with the level of polish and professional development that you would expect from Adobe's type team (specifically, Paul Hunt) and as such there are few better recommendations. It made <a class="freelinking external" href="http://typographica.org/features/our-favorite-typefaces-of-2012/" rel="nofollow">Typographica's Favorite Typefaces of 2012 list</a> along with another typeface, Alegraya variations of which are available under an open source license.</p>
      <blockquote><p>Would it be possible to just buy a big family and alter the one version I need for my project. Do you think it is possible to speak directly to the designer of the font and ask him if I'm allowed to do that?</p></blockquote>
      <p>You should be able to do this with Adobe's original fonts (those for which the IP resides with them) subject to the license agreement terms and conditions (which include stipulations around how and where the modified fonts can be used). Contacting the copyright holder in such matters is always advisable as they will be able to give you a definitive answer on what you can and cannot do with the fonts.</p>
