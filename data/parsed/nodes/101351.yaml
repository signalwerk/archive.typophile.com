      <p>If you need redistribution rights, you either need a lot of money or use an OpenSource font.</p>
      <p>Nick wrote:</p>
      <blockquote><p><a href="http://www.phon.ucl.ac.uk/home/wells/fonts.htm" title="http://www.phon.ucl.ac.uk/home/wells/fonts.htm">http://www.phon.ucl.ac.uk/home/wells/fonts.htm</a></p></blockquote>
      <p>I wouldn’t recommend these, they aren’t Unicode-encoded, which is a no-no if you want interoperable text.</p>
      <p>Most (free) phonetic fonts seem to look like hack jobs by linguists with no type design skills whatsoever, so you have to be really careful if you want to use an existing font.</p>
      <p>The <a href="http://sourceforge.net/projects/dejavu/" rel="nofollow">DejaVu fonts</a> look decent in my opinion.</p>
      <p><a href="http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;item_id=Gentium_download" rel="nofollow">Gentium</a> is OK but it’s a very specific style that doesn’t necessarily fit with your project.</p>
      <p><a href="http://scripts.sil.org/cms/scripts/page.php?item_id=CharisSIL" rel="nofollow">Charis SIL</a> is a good, robust workhorse font.</p>
