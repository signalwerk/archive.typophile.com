      <p>It's complicated.  :-)</p>
      <p>You have to read the EULA. Especially these days few commercial fonts allow modification - official permission must be obtained. The biggest exception is Adobe, bless them. Personally I'm actually OK with violating a "no-mod" EULA clause* but you might not be. In no case however may the modified font be redistributed; the only usual exception is that a third-party (who however must also have a license to the font) may be commissioned to modify a font (something I myself have had the fortune of doing).</p>
      <p>* Because I believe it's -generally- unreasonable, sometimes even disrespectful. However, the resultant font must stay firmly confined to the modifier; if it <em>does</em> leak out the modifier must accept full responsibility and face the consequences.</p>
      <p>The good news is that these days there are a number of decent "open-source" fonts that are freely modifiable and re-distributable (although very few of those allow you to sell the results, at least not without packaging them in a broader product). I say "decent" however because -as one might expect with free products- such fonts often don't perform adequately when push comes to shove; the amount of time fixing things one shouldn't have to fix can offset the cost of modifying a commercial font... There are exceptions, but it's hard to identify them without serious research. We actually have an active forum member by the name of Charles who has a good deal of experience using open-source fonts in professional projects - hopefully he'll help you find a suitable one.</p>
      <p>BTW, I assume you have some experience using a font editor? It's no cakewalk, although very basic modifications can proceed pretty smoothly.</p>
      <p>hhp</p>
