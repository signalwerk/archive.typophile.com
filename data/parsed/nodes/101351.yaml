    <p>Hey guys,</p>
    <p>I couldn't seem to find an appropriate answer to this question on google.</p>
    <p>I'm planning a project about "phonetic spelling". So I need a font that has all those diacritics and whatever glyphs a phonetic-spelling font has to have. The question that came up is if it is actually "allowed" to just buy a font family and build (alter) my own custom version of it for the phonetic alphabet?</p>
    <p>Is this legally ok? Thinking about the process I'm just thinking of buying a suited font for the project and alter it in Fontlab or Glyhps (or whatever comes in handy) and create my own custom version of it. </p>
    <p>I guess a consequent question is where do I use this font, right?<br>
    The project is going to be a book later. And if it is possible the the font should also be available as a download.<br>
    The reason the font should also be downloaded is that this book project is part of a greater regional project that is about phonetic spelling and it would of course be good if the custom-made font (which is probably a lot of work) is also available later for other uses.</p>
    <p>Can you please fill me in with some details about that matter. What is possible and what not?<br>
    Would it for instance be possible to sell this custom font afterwards that is based on top of an already existing font? I guess not.</p>
    <p>Thank you for your tips and answers.</p>
