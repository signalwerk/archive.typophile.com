      <p>The only restriction on most open-source (AKA "libre") fonts is that you can't sell them (or modified versions) by themselves (although you <em>can</em> sell a broader packaged product).</p>
      <p>It depends on your standards, but there aren't many really good ones, as attested by the fact that out of Typographica's 55 "favorite" fonts of 2012 (that Karl linked to) only at most 1.5 are free.</p>
      <p>If you ask the designer of a non-libre (AKA "proprietary") font for permission to modify it, he will probably demand a fee (or just say no). And the only way to redistribute such a font is to buy the rights, which typically costs thousands of dollars.</p>
      <p>I think your best bet is to see if there's a free (not necessarily libre) font that suits your needs and is of sufficient quality. Failing that you should be able to find a libre font that comes close, and pay somebody* to extend -and often correct- things for you, or do it yourself. Depending on how much work that libre font would need, it might be cheaper to go with an Adobe font instead.</p>
      <p>* Like yours truly.  :-)<br>
      hpapazian at gmail dot com<br>
      There are however many others reading this that can do the job for you.</p>
      <p>hhp</p>
