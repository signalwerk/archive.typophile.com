    html: |-
      <p>So yeah, in Illy ...  Object&gt;Envelope Distort&gt;Make With Top Object to put the type in a frame in order to skew via anchor points. Object&gt;Envelope Distort&gt;Make With Mesh (I used a couple of different sizes from 5&gt;20) to yank and pull the letter shapes. Then after you're finished playing around there go to Object&gt;Envelope Distort&gt;Expand to get all the Paths back. Add some anchor points where needed and fine tune. </p>
      <p>Here's my likeness  quicky (although not done as extreme)  of your example bottom left (but I just couldn't bring myself to mangle the E like that and I used Impact font)...</p>
      <p><img src="http://www.graphicdeclaration.com/images/current.jpg"></p>
      <p>...but of course as with most things in Ps and Illy there are several different ways to go about achieving the same results. It dawned on me half way through the I could simply set up a grid and manipulated the letter shape paths from there. Anyways I'm positive this can all be done in Illustrator. </p>
      <p>Hope that helps.</p>
    html_clean: |-
