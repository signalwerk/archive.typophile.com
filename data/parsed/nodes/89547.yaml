      <p>&gt; I'm quite pleased with my Epson Perfection V33: sharp and fast...</p>
      <p>Thanks. I've been looking at that one as well. It's not as slim and light as the Canon scanner. On the other hand it makes use of the traditional CCD scanning element rather than CIS. So perhaps it's worth it.</p>
      <p>Have you experienced any problem with reflections or inaccurate colors? My friend got an Epson V330 Photo (which I guess is more or less the same scanner but with a transparency bed as well). She has this problem I described before. There will sometimes show up reflections in the painted area (where there are thick paint strokes) on scanned art originals. Very disturbing and nothing she noticed while using other scanners.</p>
