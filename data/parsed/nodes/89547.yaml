      <p>Indeed. My Duoscan F40 was their last prosumer scanner. Great optics, great r&amp;d (glass free transparency bed), great build quality. But as they ceased support and development on drivers and software like ten years ago, it's been long overdue for a replacement. Besides, the CCD is just 1200x2400 dpi. Great back then, not so much today.</p>
      <p>Yeah, at least according to Canon's spec sheet for CanoScan LiDE 210:<br>
      Optical: 4800 dpi x 4800 dpi*<br>
      Interpolated: 19,200 x 19,200 dpi<br>
      *Optical resolution is a measure of maximum hardware sampling resolution, based on ISO 14473 standard.</p>
      <p>So that looks good. But I have no clue if it's speedy when scanning line art. Or if it fails in some other aspect. For instance, I heard that scanners using the more compact CIS (Contact Image Sensor) scanning element rather than the usual CCD can hardly be used when scanning any 3D object as it's focus range is more limited. Don't know if that still holds true.</p>
