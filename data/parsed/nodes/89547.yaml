    <p>Hello everybody,</p>
    <p>I'm finally about to retire my ≈10 years old Agfa F40 scanner (as I rather not resort to using Vuescan—the only solution for this old scanner in OS X Lion).</p>
    <p>Now, what scanner should I get? I mainly scan black and white lettering drawings (both as grayscale and linear). My old scanner had some great optics but was big and heavy. Will I do fine with just a CanoScan LiDE 210? It's thin and light (just 1.6 kg/3.4 lbs) and is capable of scanning 4800x4800 dpi. I must say I like the portability aspect of this scanner. However, it's using CIS rather than CCD, will this work just as fine? I've seen some examples of cheaper scanners producing reflections on the scanned image even though the scanned original was matte paper (the reflections were in some thicker paint parts). Also, from experience I know some cheaper scan software can sometimes be really slow when in lineart mode, but I don't know about Canon ScanGear…<br>
    <a class="freelinking external" href="http://www.usa.canon.com/cusa/consumer/products/scanners/photo_scanners/canoscan_lide210" rel="nofollow">http://www.usa.canon.com/cusa/consumer/products/scanners/photo_scanners/canoscan_lide210</a></p>
    <p>If you have any experience from this Canon scanner (and/or Canon ScanGear for lineart usage) or similar lighter scanners from Canon, Epson or any other manufacturer, please let me know. I'm open for other suggestions as well. :-) Basic question is: Is it possible to get such a light scanner without too much of a sacrifice upon quality?</p>
    <p>Thanks in advance.</p>
