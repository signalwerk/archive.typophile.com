    html: <p>You can.  There are HTML entities that will provide you with these characters.  Em dash, for example, is "&amp; mdash ;" without the spaces.  For a good list of entities, see <a href="http://htmlhelp.com/reference/html40/entities/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">here</a>.</p>
