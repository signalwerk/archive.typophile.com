    html: <p>You can.  There are HTML entities that will provide you with these characters.  Em dash, for example, is “&amp; mdash ;” without the spaces.  For a good list of entities, see <a class="freelinking-external" href="http://htmlhelp.com/reference/html40/entities/">here</a>.</p>
