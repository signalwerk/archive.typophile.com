    html: |-
      <p>Same story. Check the links above. I usually just enter them with alt codes (Google search if you're unfamiliar with the term). The alt code for an en–dash is ALT+0150 on Windows keyboards (in America). </p>
      <p>Doesn't matter how you enter it, really. So long as your website is, as was pointed out, encoded in Unicode, and the font used has the right glyph, it'll show up okay.</p>
      <p>Peace,<br>
      JT</p>
