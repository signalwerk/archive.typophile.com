    html: "<p>I assume you already know that this is a custom job by <a class=\"freelinking external\" href=\"http://www.typejockeys.com/projects/Philippine-Welser\" rel=\"nofollow\">TypeJockeys for Philipine Welser</a>. Closest I've found is <a class=\"freelinking external\" href=\"http://new.myfonts.com/fonts/storm/defender/\" rel=\"nofollow\">Defender</a>. More similars (less close): <a class=\"freelinking external\" href=\"http://new.myfonts.com/fonts/fontfont/zine-slab/\" rel=\"nofollow\">Zine Slab</a>, <a class=\"freelinking external\" href=\"http://www.fontfarm.de/themes/fonts/kofi/02_02_04.php\" rel=\"nofollow\">KofiPure</a>, <a class=\"freelinking external\" href=\"http://new.myfonts.com/fonts/fontbureau/dispatch/\" rel=\"nofollow\">Dispatch Condensed</a>, <a class=\"freelinking external\" href=\"http://new.myfonts.com/fonts/dstype/prelo-slab/\" rel=\"nofollow\">Prelo Slab</a></p>"
