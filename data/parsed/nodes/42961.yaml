    <p>What do you know. First post. (and probably a stupid one at that)</p>
    <p>I’ve decided to create a typeface using my father’s handwriting. I have his letters A-Z a-z and 0-9 all on paper. I’ve never designed a typeface before so, I’m not sure where to begin. Do I scan the letters in and import the file to something like fontlab or do I redraw each letter in Illustrator? Is there a common practice or any tips you could give a beginner?</p>
    <p>Thank you.<br>
    Roger</p>
