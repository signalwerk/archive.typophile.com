    html: <p>All the nodes and control points in digital fonts are on a fine grid of “units per em” (UPM). This means that curves drawn in a normal vector drawing program and then imported into a font program will be approximated just a bit sloppily. This won’t make much difference in a handwriting font, but it’s a real nuisance for more precise designs. So it’s best that you learn to use the drawing tools in your font software. Scan your sample and import the bitmap of each letter as a guide for you to trace.</p>
