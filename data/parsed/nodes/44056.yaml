    html: |-
      <p>Congrats in finishing your thesis.</p>
      <p>Some universities dictate what fonts/sizes are acceptable (and will summarily reject others), so be sure your institution doesn't have specific rules already. (Went through this with mine -- our faculty could do what it wanted, but everyone else governed by the Faculty of Grad Studies had to use Courier. Go figure.)</p>
      <p>Minion/Myriad, Stone Serif/Sans, and Hoefler/GSL would all make fine match-ups, and would add Centaur and Helvetica as well -- I've seen a number of academic/science papers set with that combo that were quite fetching.</p>
