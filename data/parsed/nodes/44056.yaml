    <p>Hi,</p>
    <p>I have alreday asked this question in a "dead" forum (which wasn't entirely related with this topic), so I decided to repost it.</p>
    <p>So, I am bout to finnish my thesis within physical chemistry that contains a couple of mathematical equations with greek characters in them. Everyone uses times new roman and i' trying to stay out of that as far as possible. So far I just have minion in my mind...maybe together with myriad.</p>
    <p>And as a general question, which font would you pick for a informal science newsletter/book?</p>
    <p>Thanks,<br>
    vasco</p>
