      <p>I think that what Yves was after, Jonny B, was more like ... the reason that those - and most high quality fonts aren't free is because they require many, many hours of work to do correctly.</p>
      <p>That said, your situation seems to present a very legitimate need of free fonts <em>as close as possible</em> to the originals. You aren't going to find anything precisely like the Morgan and Stella series for free - or nearly as well made - but you might check DaFont's <a href="http://www.dafont.com/theme.php?cat=501&amp;page=1&amp;nb_ppp_old=10&amp;text=Type+your+text+here&amp;nb_ppp=50&amp;psize=m&amp;classt=pop" target="_blank" rel="nofollow">Sans Serif section</a> for something as close as possible.</p>
