      <p>&gt; <em>they where designed by a Portuguese Designer specifically to a project.</em></p>
      <p>No they were absolutely not -- they were designed by Mario Feliciano not "specifically to a project" but for retail, to sell for profit. So anybody who wants to can purchase a license. That's the mechanics of economy. Somebody produces something, and then sells the fruit of his labour to be able to buy something somebody else produced (like food, lodging, goods, …)</p>
