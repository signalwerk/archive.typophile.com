      <p>Hmm. Maybe I've been reading too many EULAs and I've forgotten what it is like to be a teacher and a student (having been both). </p>
      <p>I think one can study another's work and have a great discussion about it without having to actually create something similar. Articulating why it is good or what makes it work would make a great essay. I guess, in a way, I can see how it would be helpful though. I just think it puts the student in a dangerous position of having to make a choice (find the exact and pirate it or find something close that is genuine freeware, hmmm?) that they otherwise might not. Yes, yes, students have millions of other reasons to find themselves making that decision, but from an educator's perspective I don't think it is wise.</p>
