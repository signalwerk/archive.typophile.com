      <p>Tiff, I had an assignment back in David's 110 class to reproduce exactly an article I had found in a magazine. The aim of the exercise was to get us to observe someone else's work very closely and to familiarize ourselves with the type control aspects of Quark (those were the days, not). It was not a creative project, but more about the tools. In that case I had to find matching (or as close as possible) typefaces from the school's type library. </p>
      <p>JonnyB2's description sounds similar, no?</p>
