      <p>Wow! Thanks guys. Those are a lot of great inputs.<br>
      @ Matthieu Cannavo:<br>
      You’re right, i was experimenting with the sizes of the diagonal bars. I figured to make them bigger, because they would have been a lot too thin at first. But i probably over did it. I did not even realise the E, F and H middle bars are on the geometrical middle and not how supposed to be a little higher =) i made that by accident just pushing the E bar up and down until i thought it was right. I corrected the B too, because if B and E are supposed to be about at the same hight, it’s probably better to find something in between, the F would look a bit weird otherwise.<br>
      @ altsan:<br>
      I knew there was something fishy about the X characters, i must have accidentally mixed up the left and the right side (i’m a bit of a legasthenic) and started it off the wrong way never realising why things look weird. I’ll have a look at the k.</p>
      <p>Now i have to work on it for a while until i’ll upload another version. You are a real help. All of you.<br>
      best regards</p>
