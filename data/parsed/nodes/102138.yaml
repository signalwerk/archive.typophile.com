      <p>@ LexLuengas:<br>
      That’s fine with me. After all i asked for it. I’ve tried with non angled cuts in my first two fonts, which i don’t consider worth talking about. This time i went with the angled cuts because i was curious how it would work out and i liked the combination but i also respect your opinion. The junction of the lower case y is indeed a bit high, but i haven’t seen that before so i only changed it a bit and not the whole way down to the baseline, i just did what felt right. And i want to add, that i don’t think that constructive criticism is negative. Not at all it is a very important part of progress.</p>
      <p>I had a look at all of the suggested changes and i truly appreciate that you guys have taken your the time to have a close look. The result of my further work you see down below. I am sure that i will not satisfy all of you, because i think that is neither possible, nor necessary. In the end i must admit i am a lot more pleased with the result than before, so thanks again. And i’ll come back and post the bold (i’ve started working on).</p>
      <p>best regards</p>
