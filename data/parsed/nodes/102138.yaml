      <p>Let me start by saying that I'm not an expert. I like the font. I see a few areas that trouble me...</p>
      <p>The upper case "S" seems visually too wide compared to the rest of the character set. And, for some reason I can't fathom, it looks like it is tilted slightly.</p>
      <p>The lowercase "w" the negative space in the center seems too open compared to the negative spaces to the left and right. It almost looks like two "v's" moved together.</p>
      <p>In the current usage of the "#" symbol, the glyph is the same height and baseline as the "l" or "X." As hashtags, they take up about the same space as other uppercase glyphs.</p>
      <p>Just for aesthetics, the dollar sign should take up approximately the same space as a zero or eight glyph.</p>
      <p>Just my opinion and it is worth what you paid for it.</p>
