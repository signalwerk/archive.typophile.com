      <p>Looks nice overall, a few potentially awkward areas, though.</p>
      <p>/X, /x look very odd... you've staggered the upper-left-to-lower-right diagonal, which is something I've never seen before.  Usual practice is to stagger the other diagonal, due to the way the eye moves while reading.  IMHO the amount of offset is also rather extreme, at least for the lowercase /x.</p>
      <p>Not sure that /a isn't a tad on the wide side.  Agree with others about /S and /w though.</p>
      <p>Finally there's something that bothers me about the /k... I think the diagonals look a bit top-heavy.  Maybe extending the lower leg (or bringing in the top one) a bit, and/or lowering the junction just a touch, would be worth trying.</p>
