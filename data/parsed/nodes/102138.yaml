    html: |-
      <p>Perhaps the most obvious problem is found in /y/. The junction of its diagonals is faa(...)aar too high. Make them join near the baseline.</p>
      <p>You should definitely make the overshoot at the bottom of /a/ more prominent.</p>
      <p>I really dig the inverted trapezoid tittles, and how they match the idea you came up with for the terminals of /T/, /E/, etc., but they don't pair well with the angled cuts of diagonal stems IMO. I would suggest that you first try out 'normal' cuts and then consider if it is worth to diverge from conventional.</p>
      <p>Cut /t/'s hair. It's starting to look like Marge Simpson.</p>
      <p>Fix the width of /w/, /S/ and /r/. You will never see a /r/ grow that far to the right. The width of the tabular figures forces shapes to be more squarish than the other characters.</p>
      <p>You <em>could</em> make ink-traps for /V/, /W/, /M/, /G/ and alike. Do as you think is best. Overall I think you've done a good job regularizing the weight (...with the exception of /4/, which appears to be darker than for instance its neighbors; the diagonal stroke of /Q/ is also too heavy).</p>
      <p>/j/ is the only character that creases at the bottom.</p>
      <p>Nice /ß/!</p>
      <p>/S/ and /s/ look stretched partly because the cuts are not perpendicular to the strokes.</p>
      <p>Sorry that almost all of my observations are negative. But hey, critique is ment to be useful, not flattering ;-)</p>
