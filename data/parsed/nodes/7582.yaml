  html: <p>My mind isn't working right now, so i decided to have a little fun. I have a new font soon to be released by T26, but I can't seem to come up with a name to give it. So I'm asking you to in the form of a contest. <br> <br>Visit the Positype web site at <a href="http://www.positype.com" target="_blank">http://www.positype.com</a> and click on the link to enter. Just give it your best shot or even a second or third one. <br> <br>The winner will receive the complete font family as well as a Positype 'I Can Be Bought' T-shirt. There will also be a random drawing from all entries for the same prize. <br> <br>The Winners will be notified via email by Nov 23 and subsequently on the Positype web site. <br> <br>Good Luck to everyone and thanks for the help!</p>
