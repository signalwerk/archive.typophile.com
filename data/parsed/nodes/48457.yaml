    <p>Hi,</p>
    <p>i’ve got to design a brochure about an urbanism workshop that will take place in China. In fact, there will be three versions: a French, an English and a Chinese version (combined with a bit of English text). The porblem is: I know NOTHING about Chinese typography. I did read the following threads but I’m just more confuse than I was… </p>
    <p><a href="http://www.typophile.com/node/40032" title="http://www.typophile.com/node/40032">http://www.typophile.com/node/40032</a><br>
    <a href="http://www.typophile.com/node/47267" title="http://www.typophile.com/node/47267">http://www.typophile.com/node/47267</a><br>
    <a href="http://www.typophile.com/node/19200" title="http://www.typophile.com/node/19200">http://www.typophile.com/node/19200</a><br>
    <a href="http://www.typophile.com/node/38166" title="http://www.typophile.com/node/38166">http://www.typophile.com/node/38166</a><br>
    <a href="http://www.typophile.com/node/42433" title="http://www.typophile.com/node/42433">http://www.typophile.com/node/42433</a></p>
    <p>So, basically, can you guide me about choosing a good chinese font (I don’t know yet if the text will be set in traditional or simplified version). I’m in the early stage of the design so I don’t really know what I’m looking for, but as I understand it, I’ll have to work with the font that’ll work best technically with a short squedule (must be send to print on monday, 25!!!). A formal clue: there’ll probably be some <a class="freelinking-external" href="http://www.foundrytypes.co.uk/foundry_gridnik/gridnik.html">gridnik</a> or <a class="freelinking-external" href="http://www.lineto.com">simple</a> in the layout. </p>
    <p>Is there Chinese typographic “rules” that I must know? </p>
    <p>Is there technical issues that I should be aware of (I’m using InDesign Cs3 on 10.5.4)? </p>
    <p>Everything else that you judge important…</p>
    <p>Please remember that I’m a newbie about chinese type so if your answer could be short and consise, I’ll appreciate! It would probably not be possible, but…</p>
    <p>Thanks!</p>
