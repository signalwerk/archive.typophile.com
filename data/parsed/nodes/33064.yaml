      <p>Jackie, I so appreciate your comment about this! </p>
      <p>It may not still be the case, but years ago in the Portland (Maine) Museum of Art, there was a display showing some Winslow Homer pencil sketches of the Civil War, and the resulting engravings that appeared in <em>Harper's Weekly.</em> Homer is a «favorite son» in Maine, so one can appreciate his being made much of, and the Museum owns a number of his works. However, that does not excuse the fact that there was <em><strong>no</strong></em> mention whatsoever of the unsung engraver, the process of translation from pencil sketch to printing block, and so forth. A lost opportunity for taeching people something. End of rant.</p>
