    <p>I'm in the process of assembling a collection of postage stamps designed by type designers with the hope of making a Web site and publishing a series of books on the subject. Although I've acquired several hundred stamps by the following thirteen designers, I'm certain I must be missing someone. Is anyone aware of additional type designers who have designed postage stamps?</p>
    <p>Neville Brody<br>
    Walter Brudi<br>
    S.H. De Roos<br>
    Eric Gill<br>
    S.L. Hartz<br>
    Lance Hidy<br>
    Jan van Krimpen<br>
    Erik Speikermann<br>
    Reynolds Stone<br>
    Georg Trump<br>
    Gerard Unger<br>
    Julian Waters<br>
    Hermann Zapf</p>
    <p>Many thanks.</p>
    <p>Michael</p>
