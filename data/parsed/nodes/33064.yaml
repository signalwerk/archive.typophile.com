      <p>Oh, great idea, Michael! I’m looking forward to your publication, as I’m into type <strong>and</strong> stamps.</p>
      <p>Gerrit Noordzij did some ›postzegels‹, too—and he writes about that in his book <em>De handen van de zeven zusters</em>.</p>
      <p><cite>stamps designed by type designers</cite><br>
      I second Jackie: Where do you draw the line? I mean, before digital typesetting and the possibility of using fonts, every tiny lettering on a stamp was kind of a type design, no?<br>
