  html: |-
    <p>Dave Crossland <a class="freelinking external" href="http://typedrawers.com/discussion/831/ttf-diet-by-karsten-luecke-and-adam-twardoch-reduces-latin-ttf-fonts-by-10" rel="nofollow">informs</a> about new tool: <a href="https://github.com/twardoch/ttfdiet" title="https://github.com/twardoch/ttfdiet">https://github.com/twardoch/ttfdiet</a><br>
    "ttfdiet (TTF DIacritics Encoding Tool) applies a “diet” to a .ttf font: it modernizes the way in which glyphs for precomposed Unicode characters are stored in a TrueType-flavored OpenType font, and reduces the font's file size." [from README.md]</p>
    <p>I installed Behdad Esfahbod's FontTools <a href="https://github.com/behdad/fonttools/archive/master.zip" title="https://github.com/behdad/fonttools/archive/master.zip">https://github.com/behdad/fonttools/archive/master.zip</a> and wrote diet.bat file:</p>
    <p><code>python c:\ttfdiet.py %1<br>
    pause <code></code></code></p>
    <p>- be sure Python (2.6 or higher) is installed and added to the PATH<br>
    - "c:\ttfdiet.py" it is where file ttfdiet.py is stored<br>
    - there is no output font file name, so ttfdiet will create ttf file, with .diet added, in the path where input font file is stored<br>
    - "pause" let me to see what will happen</p>
    <p>It works perfectly. Fonts were tested in BabelPad and FireFox 32.0.3 (winXP sp3). See FireFox:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Font_5578.jpg"></div><br>
    I don't care the file is smaller, important is that errors are clearly visible (I marked some with red circles). I belive font will be better when "diet-proof" or "diet-ready".<p></p>
