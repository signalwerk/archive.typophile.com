    <p>Hi</p>
    <p>First I want to say I rarely post here but I read the forum a lot, It's incredible how helpful you guys are! I have learned a lot about type here, and whenever I have a question I make a search and usually find my answer.</p>
    <p>When I pair fonts, I usually go with my instincts, and the forum confirmed my method. I followed some advices from here to select fonts to pair with <a class="freelinking external" href="http://www.fontshop.com/search/?q=amasis&amp;x=0&amp;y=0" rel="nofollow">Amasis</a>. It's for a data visualisation company. We will be building wireframes and all work documents with those fonts. The sans serif needs to be neutral, have many weights options and be eligible in small size.</p>
    <p>This is what was worth testing so far:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/testpetit_5823.jpg"></div><p></p>
    <p>Do you have other fonts to suggest? What do you think of my picks? </p>
    <p>Thanks a lot</p>
