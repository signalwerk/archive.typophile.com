    html: <p>Document preferences are saved with a document. So existing documents will retain the preferences they had, regardless of whether you change the global preferences when no documents are open. The global preferences affect <i>new</i> documents.</p>
    html_clean: <p>Document preferences are saved with a document. So existing documents will retain the preferences they had, regardless of whether you change the global preferences when no documents are open. The global preferences affect <i>new</i> documents.</p>
