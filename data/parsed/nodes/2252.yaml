    html: <p>You need to set the preferences when no documents are open. If a document is open, the new preferences will be applied only to that document. If you set preferences without any documents open, the new preferences will be applied to any new documents.</p>
    html_clean: <p>You need to set the preferences when no documents are open. If a document is open, the new preferences will be applied only to that document. If you set preferences without any documents open, the new preferences will be applied to any new documents.</p>
