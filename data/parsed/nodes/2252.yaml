  html: <p>I know the answer to this must be simple but i cant find what it is.  <br>All i want to do is set my InDesign so when create a new document the units and increments are in mm rather that points.  <br>I know I can change this when i create the document through prefenences but i want the units always to be in mm when i go to create a document, it leads to a lot of time trying to set a proper grid, columns and gutters. <br> <br>Thanks in advance, <br>david.</p>
  html_clean: <p>I know the answer to this must be simple but i cant find what it is.  <br>All i want to do is set my InDesign so when create a new document the units and increments are in mm rather that points.  <br>I know I can change this when i create the document through prefenences but i want the units always to be in mm when i go to create a document, it leads to a lot of time trying to set a proper grid, columns and gutters. <br> <br>Thanks in advance, <br>david.</p>
