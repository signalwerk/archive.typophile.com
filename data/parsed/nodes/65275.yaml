      <p><cite> .. can FontForge open TTCs? Maybe I should just install that too.</cite></p>
      <p>Sure. Opening: <a class="freelinking external" href="http://fontforge.sourceforge.net/filemenu.html#Open" rel="nofollow">FontForge -&gt; Open</a></p>
      <p>(coincidentally addressing what I said about FontLab: "When opening a TTC file, or a mac dfont -- files which potentially contain several fonts -- you will be given a dlg showing a list of all fonts in the file, you get to pick which you want to open.")</p>
      <p>Saving: <a class="freelinking external" href="http://fontforge.sourceforge.net/generate.html#GenerateTTC" rel="nofollow">FontForge -&gt; Generate Fonts (Generate TTC)</a></p>
      <p>Getting the thing to run seems to be a hit-and-miss affair. I had mixed feelings about my trying to run it under Cygwin (my Windows machine). It froze up every 30 sec, and boy! was it ever <strong>ugly</strong>! Perhaps I'll try again on my Mac.</p>
