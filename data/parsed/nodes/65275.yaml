    <p>Quick question: I have Snow Leopard now, so [some of] the system fonts are TTCs. Since I'm very much a type design learner I like to open fonts and study the outlines up close; but now FontLab says it can't handle TTCs. :-(  Is there any way to make Fontlab accept these files? Or do I need to revert to typing the glyphs in question in Illustrator and converting to outlines to see them up close?<br>
    Thanks for input.</p>
