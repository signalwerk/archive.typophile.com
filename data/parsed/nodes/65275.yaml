    html: |-
      <p>Just to clarify some things.</p>
      <p>1. Fontlab Studio was never supposed to support TTC fonts. There is another product from Fontlab to do this: <a href="http://www.fontlab.com/fontlab-products/compare/" title="http://www.fontlab.com/fontlab-products/compare/">http://www.fontlab.com/fontlab-products/compare/</a><br>
      2. New TTC fonts introduced in Snow Leopard are a little bit different from those on Windows. Apple took font data from the data fork, compressed it and put in the 'cmpf' resource in the resource fork of the file. So new ttc fonts are now resource-based files.</p>
      <p><cite>Does anyone know if FontLab 6 will have TTC support?</cite></p>
      <p>Nobody knows. ;)</p>
      <p>Regards,<br>
      Johnych</p>
