    html: |-
      <p>A TTC is a regular TTF and then some more: it contains the usual tables for one single TTF, <em>plus</em> any number of additional font sections that share some of its tables with the 'base' font and have some private tables.</p>
      <p>(And I am surprised FontLab didn't know that. Perhaps they <em>do</em>, but it's too hard to switch from a one-file-one-font-outline paradigm. (They could do something like, on opening a TTC, ask "What section do ya want?"))</p>
      <p>I'm fairly familiar with the TTC tables; perhaps it's not too difficult to write a 'converter' that creates at least a single file of the 'base font' (and perhaps (oh my!) of the other fonts as well).</p>
      <p>... No promises, though.</p>
      <p>...... Besides, I bet this is one of those forbidden things you sometimes hear about.</p>
