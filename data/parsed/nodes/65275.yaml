    html: <p>Apart from the difficulty of running it on a Mac or PC, Font Forge is quite ugly, compared to the elegant GUI and user-friendly functions of Fontlab. But from my limited experience FF seems strictly professional in treating the basics, for example it lets the user see which tables are associated with which font. Font Forge installs with one click on any Linux operating system and runs smoothly in its native habitat. I tried it from a Ubuntu OS installed temporarily from a USB key on a homeless PC laptop that does not even have a hard disc - and it is all open source. See <a href="http://www.linuxliveusb.com/" title="http://www.linuxliveusb.com/">http://www.linuxliveusb.com/</a> . FF is downloaded as a package from within Ubuntu.</p>
