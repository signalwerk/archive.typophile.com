      <p>The Wayback Machine says: late 1970s=pre-digital era, which means you are most likely looking at a phototypesetting face, which may or may not have been digitized.</p>
      <p>A likely candidate is various weights of Photo-Lettering Inc.’s <strong>Republic</strong>. House Industries bought PLINC’s entire collection, and they offer <em>some</em> of the faces online, based on the old pay-per-headline model. Last time I checked, Republic wasn’t one of their offerings, but things change…</p>
