    votes: null
    html: |-
      <p>The last ampersand reminds me of George from Rainbow:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/7445-1-400x400_5905.jpg"></div><p></p>
      <p>I think you need to start from a strong concept. I'd want the name settled for definite and a clear idea of the style of bar. 'Classic and contemporary' doesn't mean anything to me. What era is 'classic' anyway? Ask questions like what is the client demographic? What is the atmosphere going to be like? What sort of music? Until this is clear, the graphic elements are not coherent. And stay away from fruit showing through...can you read the yellow-on-white italics in your example?</p>
