    <p>Howdy!<br>
    Does anyone have any thoughts on this? Wether you like it or not? It's for a cocktail bar, to be used as both signage and logo. I'm trying to portray a classic feel to the bar, but with contemporary ideologies. Any comments would be greatly appreciated. The colours are not final as the end thing will be a photograph with fruit and other bar related objects showing through the lettering. Thank you for your time!</p>
