    <p>Using FontLab 5, Windows.<br>
    I'm creating an OTF font from a few Type1 fonts. One of the type one fonts is a small cap font. To get the kerning pairs from the old Type1 font into my new font I thought I could pull the Type1 into FontLab and export the AFM file. Then open the AFM in a text editor and change all the lowercase characters to my small cap glyphs.</p>
    <p>For instance:<br>
        KPX A c -18<br>
    becomes<br>
        KPX A Csmall -18<br>
    where Csmall is the name of my small cap c. But it isn't working and I can't see why!</p>
    <p>From the AFM file I'm also deleting all the kern pairs I won't need, like:<br>
        KPX A T -74<br>
    as it's already in there from having procesed the "regular" text.</p>
    <p>When all my substitutions are made in the AFM file I change the StartKernPairs line to reflect the number of pairs I now have.</p>
    <p>However, when I try to import the modified AFM into FontLab it doesn't import any kern pairs, even if I tell it to completely replace them. I'm able to import kerning from other AFM files but I don't see any difference in structure between the ones that import and the one that won't. What am I missing?</p>
    <p>Thanks for any insight<br>
    Ken</p>
