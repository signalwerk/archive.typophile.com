      <p>Hi Ken,</p>
      <p>It doesn't matter if the "number of kern pairs" line is corrrect.</p>
      <p>Try this: In your existing OpenType font, which does have the small caps, but does not have the small cap kerning, export an AFM.</p>
      <p>Now, working in a text editor, from the Type 1 font AFM you've pared down so that all KPX pairs contain at least one small cap, copy only the KPX portion, and paste that at the bottom (doesn't really matter, just easier) of the KPX portion of the AFM you exported from the OT version. (A lot of words trying to be clear. It is really very simple. You could export a AFM from the OT version and type in new KPX pairs. Just cut &amp; paste instead.)</p>
      <p>Save the AFM file and reimport into the FontLab OTF file.</p>
      <p>You'll see immediately in the dialog box the number of new pairs FL found, and added. If it's "zero" added you have a problem, most likely a disagreement of glyph *names*</p>
      <p>As Karsten says, the glyphs in the kerning (KPX) portion must be matched in the character metrics portion. For me anyway, the above copy &amp; paste technique offers the least chance for error with the greatest chance to figure out what went wrong.</p>
