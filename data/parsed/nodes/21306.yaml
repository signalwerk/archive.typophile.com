      <p>I’ve never seen this character, but i have an idea why the designer used it:</p>
      <p>Perhaps the character offers a smoother-set right edge when setting justified type. Since a hyphen is so small and thin, the right edge often looks a bit anemnic. This vertical bar adds “uniformity” to the column.</p>
