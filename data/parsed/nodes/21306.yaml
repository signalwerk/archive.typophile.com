    html: <p>Well, this is all too surprising, as I thought for sure I would see a response today that would include a specific definition of the glyph. Funny how all we have now is some more confusion, a bunch of skeptics, and a hypothesis. Everything said here is valid, and it does make for a valid argument. I did find some more sources, however none of them defined the vertical en-dash, as what I found it to be referred to as, for line breaks. I think that this character is more important for languages that read top to bottom, such as chinese. The obscure reference that I came by suggested that one should chose a typeface with a vertical en-dash when setting a language with this orientation.</p>
