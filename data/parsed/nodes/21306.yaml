    <p>I have this sample from a friend who has asked me what exactly the hyphen-like character at the end of the first and fourth line is. Basically, it appears to be half of a pipe, and it extends from the baseline up to the full measure of the x-height. I tried to do some of my own research, and the only thing that came close was a Mongolian character, i have now forgotten exactly which one, that actually sits above the x-height and ascends to the full cap height. This obviously isn’t a match, and now, I am just curious myself as to what this break character is, and why it was used instead of the usual hyphen.</p>
    <p>This sample, for those of you whom may be familiar, came from the following book:</p>
    <p><a href="http://www.amazon.com/gp/product/0802065198/ref=pd_rvi_gw_2/102-0798949-3412132?%5Fencoding=UTF8&amp;v=glance&amp;n=283155">Design with Type by Carl Dair</a></p>
