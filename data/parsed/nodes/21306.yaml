      <p>I would tend to agree with Roy, but I must say I find it rather frustrating when authors of typographic texts take their own books as opportunities to push unconventional typographic treatments. Most readers coming to such books are looking for instruction, and view the books in question as a sort of gospel example. Setting up line breaks like this, however clever an application it might be, just confuses those seeking knowledge of the conventions and principles of typographic design.</p>
      <p>That said, given the content of the brief passage included in the graphic, perhaps Dair was simply making a visual point, drawing attention to the alternate hyphen glyph as a way of showing the difference between what a conventional hyphen can do to the right margin, and what something more unusual might do. Does he mention optical margin alignment so that right-margin hyphens extend slightly beyond the text block, thereby creating a more consistent right edge?</p>
      <p>My point is simply that despite the fact that such an alternate hyphen glyph might address a certain issue, it does much more to confuse the reader (as your query shows) and misguide the novice typographer (who is likely to think the glyph a dotless-i or simply a typo).</p>
