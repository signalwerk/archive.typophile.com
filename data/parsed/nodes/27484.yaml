    <p>it feels like one of those fonts i should know, like one i have at the tip of my tongue, yet i'm totally stumped. i've tried Identifont and MyFonts too, without success, which was especially surprising since it does have some fairly unique traits (such as the uppercase J and U).</p>
    <p>oh, and i'm not looking for suggestions on similar fonts, i found plenty of close but not quite ones myself (such as Angie, Friz Quadrata, etc).</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/kingdom-titles_4057.png"></div><p></p>
