    html: |-
      <p>[Going back to John's post:] Unicode is not very specific here ...</p>
      <p>Problem is that encoding these spaces creates expectation that they should be present in fonts. (Complaint: Missing!) And type designers who add them likely interpret the use and thus width of these spaces differently, so that hair space might be visibly different in different fonts.* (Complaint: Not the width I expected!) They more "encouragement" for end users to modify fonts.**</p>
      <p>Worse, they obscure the idea of what encoding characters means. The Unicode 5 book, p.205, suggests that<br>
      <cite>U+2009 THIN SPACE and U+200A HAIR SPACE are successively smaller-width spaces used for narrow word gaps and for justification of type</cite></p>
      <p>where, in my understanding, "narrow word gaps" refer to the text level while "justification of type" (things like adjusting uppercase spacing?) is not a matter of text encoding but of design. Inviting to produce ambiguous data: when is thin/hair space a real space, when does it serve as design hack?</p>
      <p>* Unicode 5, p.205, says:<br>
      <cite>where they</cite> [u-2000..U+200A except sometimes U+2009] <cite>are used (for example, in typesetting mathematical formulae), their width is generally font-specific</cite></p>
      <p>** See initial post:<br>
      <cite>3) Is there a script for Fontlab or another tool that will add these automatically?</cite></p>
