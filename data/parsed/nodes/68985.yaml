    html: |-
      <p>Kent, this is why I fill in those Unicode characters. The *figure space* gets the width of a tabular figure, the *punctuation space* the width of a tabular comma, which I sometimes make up &amp; switch with the regular comma -- Minion needs one, for example. When I need one of these spaces, I enter the Unicode from the keyboard rather than counting on InDesign to figure it out.</p>
      <p>Not that it matters, but I use a 155 unit space for a thin, and a 55 unit space for the hair space -- same as John with the hair, &amp; real close with the thin. </p>
      <p>There is some precedent for varying hair space values; what a comp setting metal actually used for a hair space was "whatever suited." The thin space is a different matter; in Linotype is was the spaceband, unexpanded (you could switch in different spacebands). For systems using the em, I'd imagine it varied as well.</p>
      <p>BTW, not all fonts have the same width for lining tabular figures as for oldstyle tabular figures. Well, it's not ideal, but you can live with that. What you can't live with are those fonts where the setwidth for roman tabular figures is different than for italic tabular figures. Ah, font designers. Why end users have to modify fonts.</p>
