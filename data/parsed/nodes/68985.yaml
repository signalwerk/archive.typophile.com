    html: |-
      <p>Kent: <em>BTW, can anyone tell us what the difference is supposed to be between enquad/emquad and enspace/emspace? I haven’t been able to find an explanation yet.</em></p>
      <p>I think the difference is that a font is allowed to ‘lie’ about one set, but not about the other. For example, in a very narrow compressed or very wide expanded font, the nominally en/em characters might actually be proportionally narrower or wider than actual width relative to body height.</p>
      <p>I <em>think</em> the en/em quad characters are the ones that should be fixed relative to the body height, but am not 100% sure about that.</p>
