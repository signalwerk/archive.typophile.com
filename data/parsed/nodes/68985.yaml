      <p>Karsten: <em>Problem is that encoding these spaces creates expectation that they should be present in fonts.</em></p>
      <p>I've never accepted the argument that just because something is in Unicode it should be in any font, let alone all fonts. Glyph sets are determined by font makers. Unless you are claiming support for a character set that includes characters that you don't in fact support, those characters can't be considered missing.</p>
      <p>I do put these space characters into my fonts, but that's because I know they are useful for scholars dealing with manuscript transcription in which capturing different widths of spaces in plain text can be important, and my clients tend to request them.</p>
      <p>FWIW, these are the space widths I use in fonts (most are obvious):</p>
      <p>U+2000 |enquad| 1/2em<br>
      U+2001 |emquad| 1em<br>
      U+2002 |enspace| 1/2em<br>
      U+2003 |emspace| 1em<br>
      U+2004 |thirdemspace| 1/3em<br>
      U+2005 |quarteremspace| 1/4em<br>
      U+2006 |sixthemspace| 1/6em<br>
      U+2007 |figurespace| tabular numeral width<br>
      U+2008 |punctuationspace/ comma width<br>
      U+2009 |thinspace| 1/5em *or* 2/3wordspace (whichever is narrower)<br>
      U+200A |hairspace| 1/18em<br>
      U+202F |NBSPnarrow| 1/5em (or 1/3em for Mongolian fonts)<br>
      U+205F |mathspacemedium| 1/4em</p>
    html_clean: |-
      <p>Karsten: <em>Problem is that encoding these spaces creates expectation that they should be present in fonts.</em></p>
      <p>I've never accepted the argument that just because something is in Unicode it should be in any font, let alone all fonts. Glyph sets are determined by font makers. Unless you are claiming support for a character set that includes characters that you don't in fact support, those characters can't be considered missing.</p>
      <p>I do put these space characters into my fonts, but that's because I know they are useful for scholars dealing with manuscript transcription in which capturing different widths of spaces in plain text can be important, and my clients tend to request them.</p>
      <p>FWIW, these are the space widths I use in fonts (most are obvious):</p>
      <p>U+2000 |enquad| 1/2em<br>
      U+2001 |emquad| 1em<br>
      U+2002 |enspace| 1/2em<br>
      U+2003 |emspace| 1em<br>
      U+2004 |thirdemspace| 1/3em<br>
      U+2005 |quarteremspace| 1/4em<br>
      U+2006 |sixthemspace| 1/6em<br>
      U+2007 |figurespace| tabular numeral width<br>
      U+2008 |punctuationspace/ comma width<br>
      U+2009 |thinspace| 1/5em *or* 2/3wordspace (whichever is narrower)<br>
      U+200A |hairspace| 1/18em<br>
      U+202F |NBSPnarrow| 1/5em (or 1/3em for Mongolian fonts)<br>
      U+205F |mathspacemedium| 1/4em</p>
