    html: |-
      <p>FWIW, it looks like InDesign’s default values for some of those spaces which are subject to interpretation, when not encoded in the font, are as follows:</p>
      <p><strong>hair space</strong> = 0.042 em (don’t ask me why; that’s what I measured)<br>
      <strong>thin space</strong> = 0.125 em (1/8 em)<br>
      <strong>punctuation space</strong> = width of a period<br>
      <strong>figure space</strong> = width of zero (does not change with OT figure features, so unless figs are tabular by default or an encoded figurespace is included, this will not be a tabular space)</p>
