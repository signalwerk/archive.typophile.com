    <p>I've noticed that some fonts contain the following <a href="/wiki/space" class="freelinking" rel="nofollow">spacing</a> characters (presented with various encodings for them) and some don't:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/spacingglyphs_5535.png"></div><p></p>
    <p>1) I am wondering why some fonts have them and some fonts don't.<br>
    2) I'd like to know what the deciding factors might be for either including them or not including them.<br>
    3) Is there a script for Fontlab or another tool that will add these automatically?</p>
