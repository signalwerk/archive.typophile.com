      <p>.. [Em space with a horizontal scaling applied --] just make sure you only apply it to em spaces and not to your text.</p>
      <p>I should've thought of it earlier -- since InDesign CS4 you can use a GREP style to apply the horizontal scale to em-spaces <em>only</em>. A GREP style only can apply character styles, which is sometimes annoying (just a little!), but in this case it's an advantage because you can change the scale in that style, and it'll be changed all over your document.</p>
      <p>Sounds interesting? Create a new GREP style. In the Apply Style list, choose "New Character Style". Select this and name it "em width".<br>
      In the To Text box put "~m" (<em>sans</em> quotes, of course). Insert a number of ems into your document -- you don't have to apply the style manually --, then change the horizontal scale in the "em width" character style to 50% and 200% to see what happens.</p>
    html_clean: |-
