    html: |-
      <p>Rich — Since these spaces are relative to font size and easily calculable, most professional layout and typesetting applications provide for [many of] these spaces without the need for their presence within a font. (The possible exceptions are <em>figurespace</em> and <em>punctuationspace</em>, but even these are often fudged by the software.)</p>
      <p>This has historically been the case, that the typesetting mechanism provides for these, not the specific font, such that I don’t think that most font makers give it any consideration.</p>
      <p>So, as Si implies, until Unicode encoded these, it was a non-issue.</p>
