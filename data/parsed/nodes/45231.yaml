  html: |-
    <p><cite>“Typography is embedded into our everyday life therefore it becomes part of our culture”</cite></p>
    <p><cite>“Can the semiotic theory be applied to topical typography thus bringing more meaning and importance to the chosen subject matter AND typeface?”</cite></p>
    <p>I’m looking at topical typography. Designing a typeface based on a specific area. I have chosen the area, it is a landmark that deals with two cultures and the reclaiming of land. </p>
    <p>I’m thinking of pulling the semiotics out of the area and visually working these into letter forms giving a more meaningful typeface and a deeper visual/verbal representation on the specific area. </p>
    <p>Sound like an interesting project? Perhaps not?</p>
    <p>What other area’s of design would you recommend considering when using type?</p>
    <p>EDIT:</p>
    <p>E.g.</p>
    <p>- typeface design<br>
    - 3D type<br>
    - interactive type</p>
