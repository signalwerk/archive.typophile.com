      <p>The chess pieces are encoded within Unicode, (♔♕♖♗♘♙♚♛♜♝♞♟) so you may have a symbol font on your machine that includes them. There's one (Segoe UI Symbol) in Windows. However I don't think Unicode has enough components to lay out a chess board properly.</p>
      <p>&gt;Ah. The font - and even the JavaScript for displaying a board - apparently aren't commercial products, but are from Google Code.</p>
      <p>P(a)wn'd by Google! </p>
      <p>Si</p>
