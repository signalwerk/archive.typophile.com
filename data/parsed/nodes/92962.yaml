    <p>I was looking around for free fonts usable as webfonts that would allow me to put chess games on my web site in Figurine Algebraic notation.</p>
    <p>There are some fonts suitable to that purpose, but as these web sites evidence, they're not being used as web fonts just  yet...</p>
    <p><a class="freelinking external" href="http://mip.noekeon.org/HTMLTTChess/index.html" rel="nofollow">http://mip.noekeon.org/HTMLTTChess/index.html</a></p>
    <p><a class="freelinking external" href="http://www.strategems.org/fonts/fonts.htm" rel="nofollow">http://www.strategems.org/fonts/fonts.htm</a></p>
    <p>instead, users are still expected to download the special fonts and install them on their computers.</p>
    <p>At least with commercial fonts, apparently some sites are using webfonts for Chess,</p>
    <p><a class="freelinking external" href="http://www.dnaindia.com/sport/commentary_live-wcc-2012-anand-appears-to-have-weathered-the-storm_1687859" rel="nofollow">http://www.dnaindia.com/sport/commentary_live-wcc-2012-anand-appears-to-have-weathered-the-storm_1687859</a></p>
    <p>although it's possible that the site is just using something that I happen to have on my computer. (The white Knight, for example, is the letter N: the font is not Unicode, so it's easier to compose the chess games without special software.)</p>
