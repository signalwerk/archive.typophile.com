      <p>Gustavo</p>
      <p>Hi again. Ok, here are 3 places you might look into. Dublin Institute of Technology, <a href="http://www.dit.ie">www.dit.ie</a>, NCAD National College of Art and Design at <a href="http://www.ncad.ie">www.ncad.ie</a> and the Dun Laoghaire Institute of Art, Design and Technology at <a href="http://www.iadt.ie">www.iadt.ie</a>. Take a look at all of them, though the last has a very fine reputation. My wife went to NCAD where she learned to be a great weaver, hand-woven fabrics. Good luck.<br>
      Jordan</p>
