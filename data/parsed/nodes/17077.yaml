    <p>Greetings,</p>
    <p>I’m planning moving to Ireland this year thus I’m looking for any design related course around. Specific courses would be great too, like typography, photography or just graphic design. </p>
    <p>It doesn’t have to be in Dublin, since I’m still planning the trip. Actually it would be interesting to hear about courses um Scotland also. I left England off because it’s too expensive.</p>
    <p>I really appreciate your help.</p>
