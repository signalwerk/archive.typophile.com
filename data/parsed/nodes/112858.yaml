    html: |-
      <p>Surpising, I didn't hit this with a quick run through of the usual categories for this type of font [techno, sci fi, futuristic, automotive etc.] either at Dafont or Myfonts. Hope someone finds it for you.<br>
      Its not too difficult to make using Serpentine Sans ICG Bold Oblique<br>
      <a href="http://www.myfonts.com/fonts/imageclub/serpentine-sans/" title="http://www.myfonts.com/fonts/imageclub/serpentine-sans/">http://www.myfonts.com/fonts/imageclub/serpentine-sans/</a><br>
      Just delete the dots on i, thin the center horizontal stroke of s, fill in the ink traps, and the casual reader would probably not notice any difference.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/SerpentineSansBoldObliqueEdited_3477.jpg"></div><br>
      A little additional work and you could have a perfect match.<br>
      Don<p></p>
