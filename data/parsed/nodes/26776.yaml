    html: "<p>I have recently added quite a lot of small booklets (pdf-format) at the Omnibus site, showing how my typefaces look in \"print\". I have used fairy tales in different languages for the ones available (in English, Esperanto and Swedish), and more will be added: in German, Italian (Boccaccio's Decameron, one short story per booklet), French and Spanish, but it will take some time. <br> <br>Besides showing different typefaces, they can be good reading. The booklets can be downloaded at <a href=\"http://www.omnibus.se\" target=\"_top\">www.omnibus.se</a>.</p>"
