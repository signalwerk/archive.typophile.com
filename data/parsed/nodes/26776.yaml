    html: <p>We've just released a varied selection of new, unique fonts. <br>These include our new Nicodemus Byzantine font, the Gregorius Gothic font, the Honorius Roman font, the Caledonia Arts &amp; Crafts font, plus several others. <br> <br>These new fonts also debut a redesign of our page which I think you'll find very appealing. <br> <br>Take a minute to check it out today.  Just go to <a href="http://www.fontcraft.com" target="_top">http://www.fontcraft.com</a></p>
