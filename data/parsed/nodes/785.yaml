    html: "<p>Hrant said <br> <br>&gt;Hey Joe, I think the one you really  <br>&gt;want is Berlusconi - now there's  <br>&gt;a people's man! :-/ <br> <br>No, I'll pass. Thanks.  <br> <br>(I'm sorry that my comments are apparently so unfeeling or out of touch so as to give you the idea that I'd appreciate Mr Berlusconi.) <br> <br>And yes: from now on, I'll keep my non-type opinions to myself.  <br> <br>Sincere apologies to the group. <br> <br> <br> <br>'darrel' said <br> <br>&gt;Of course, pirated fonts aren't a  <br>&gt;good thing, as they do certainly  <br>&gt;hurt sales--but not quite to the extent  <br>&gt;the intellectual property companies  <br>&gt;(foundries, music labels,  <br>&gt;moview industry, software companies, etc.)  <br>&gt;make it out to be. <br> <br> <br>I don't at all mean to be smug, but, how exactly do you know that? <br> <br>The third-party organizations in the US and UK and presumably elsewhere that cite the amounts of  revenue potential that software piracy drains from various entities (who expect to be collecting such revenue), cite only as the result of taking and closely analyzing detailed surveys repeatedly, over time. <br> <br>Some extrapolation might be necessary, and as such, they might actually be only as generally accurate as a typical countrywide population census might be, but how can you strongly infer that they purposely lie by inflating the numbers? <br> <br>If you're privy to some authenticated survey document that reveals inflation of survey results, I'd love to see it. <br> <br>By the way, these discussions about profit make me cringe, too. I did not get into type thinking about profit. I got into it for the type and what I thought could be done with it esthetically. <br> <br>The tax people eventually want designers seeming to be in business to eventually declare whether they're hobbyists or really in a for-profit enterprise, so in my case, I chose the latter. (I never felt right about starting a type company as a non-profit - in the sense that the Internal Revenue Service defines non-profit.) <br> <br>Along with being in business for oneself comes a lot of responsibilities. I think that if what I do is any good at all, that I should be able to expect a fair return on its sales. I also think that I should be able to expect others to respect my property. <br> <br>Pirates subvert both those basic, human expectations. <br> <br>And for what?  <br> <br>The pirate seeks to steal my property and upload it to others, dilute my revenue potential and wreak my business and my life, and break my artistic spirit, all to make themselves look cool? <br> <br>How exactly does that make them the big man, except to other thieves, other thugs? <br> <br>Sorry. I don't see the aura in it worthy of worship. <br> <br>I look at a font pirate who takes and blindly uploads, and I see a selfish, immature, pitiful, very misguided person looking for love and acceptance while making some of the worst life choices possible for themselves. <br> <br>I think it's especially hard to forgive pirates who rip off dozens of companies, and do uploads that go on for hours or days at a time. I'd say that kind of heartlessness doesn't change. <br> <br>In my case, I know this about font pirates:  <br> <br>We spent much of the '90s being ripped off by pirates who one might expect to see in a list of names, and by others whom one might be surprised to see there.  <br> <br>They kept me from properly providing for my 84 and 92 year old grandparents when they came to live with us in '98, no longer able to care for themselves. They pretty much took out of my wallet money for my son's college education. Another family member, formerly employed here, is now clinically depressed because of how they took dealing with auditing the ongoing font theft problems. (I guess everyone reacts differently, some being more emotionally fragile than others.) <br> <br>No, they haven't broken my spirit. <br> <br>With it all (and believe me, it's considerable torture), I'm actually sad for the so-called pirates.  <br> <br>I believe that the only way to demonstrate that such pirates have made an effort to effect change in themselves would be to do this: <br> <br>- Deliver a sincere, signed, written letter of apology  <br>  to each foundry ripped off.  <br>  Ideally, to each artist, since we  <br>  are talking about individual human beings  <br>  being ripped off. <br> <br>- Destroy the pirated copies they have, and <br>  recommend to those who follow them, to do the same. <br> <br>- Make some effort at starting a long-term  <br>  repayment of some token amount of money. <br>  (It's like with loaning money to a family  <br>  member or friend, where you expect to be  <br>  paid back, but they never quite do. <br>  Even some token effort would show they care.) <br> <br>The ripoffs are about personal decisions, about property and (for better or worse) about money (read, in tax terms: current revenues unrealized). <br> <br>It seems logical to me that a mere \"Well, you know, I've matured now...\" really doesn't cut it and actually just exhibits zero maturation and more antisocial behavior. <br> <br>To those who continue to pirate commercial fonts: You are seeing the fonts as something that they are not, nor were ever intended to be. <br> <br>Speaking in general: Collect all the freeware, non-pirated, non-cloned, non-autotraced, public domain fonts you want. But if you want our fonts intended for retail commercial sale, be sure you have a license or bill of sale to document that they should legally be present on your computer(s). <br>Now, we actively notify the U.S. Treasury Department and other official bodies charged with going after entities that misuse or defile U.S. Trademarks, copyrights, etc. What a pain. But that's what they're paid to do. So now, if pirates won't heed my simple plea to stop, they'll eventually open their door to a uniformed agent. <br> <br>Regarding the music industry fight (for example, via RIAA): Unless it's in the public domain, contrary to popular belief, it isn't 'your' music (meaning 'the fans' music'). It is the property of the rights holder (who may or may not be the original creator). It's only a matter of time before that whole issue is settled. <br> <br>I also support the antipiracy effort the movie industry is mounting anew. The informative commercial before 'Spy Kids 3-D' last weekend was very good. (Although I couldn't understand why the URL to find out more, at the end, was flashed for about a second. Way too brief.) <br> <br>The light at the end of the tunnel, for audio and video pirates first, really is an oncoming train. Unfortunately, I think a lot of confused kids (and their parents) are going to get some very unpleasant surprises. <br> <br>It could all be avoided if people simply took stock again of what constitutes others' property. <br> <br>I'll just leave my opinion on that there. I really don't want to keep getting off the type track. <br> <br>But what you see going on with the RIAA? I believe that it's just a matter of time - measured shortly - that the commercial type industry starts to adopt the same tactics. Piracy has made it necessary. <br> <br>Joe <br> <br> <br></p>"
    html_clean: "<p>Hrant said <br> <br>&gt;Hey Joe, I think the one you really  <br>&gt;want is Berlusconi - now there's  <br>&gt;a people's man! :-/ <br> <br>No, I'll pass. Thanks.  <br> <br>(I'm sorry that my comments are apparently so unfeeling or out of touch so as to give you the idea that I'd appreciate Mr Berlusconi.) <br> <br>And yes: from now on, I'll keep my non-type opinions to myself.  <br> <br>Sincere apologies to the group. <br> <br> <br> <br>'darrel' said <br> <br>&gt;Of course, pirated fonts aren't a  <br>&gt;good thing, as they do certainly  <br>&gt;hurt sales--but not quite to the extent  <br>&gt;the intellectual property companies  <br>&gt;(foundries, music labels,  <br>&gt;moview industry, software companies, etc.)  <br>&gt;make it out to be. <br> <br> <br>I don't at all mean to be smug, but, how exactly do you know that? <br> <br>The third-party organizations in the US and UK and presumably elsewhere that cite the amounts of  revenue potential that software piracy drains from various entities (who expect to be collecting such revenue), cite only as the result of taking and closely analyzing detailed surveys repeatedly, over time. <br> <br>Some extrapolation might be necessary, and as such, they might actually be only as generally accurate as a typical countrywide population census might be, but how can you strongly infer that they purposely lie by inflating the numbers? <br> <br>If you're privy to some authenticated survey document that reveals inflation of survey results, I'd love to see it. <br> <br>By the way, these discussions about profit make me cringe, too. I did not get into type thinking about profit. I got into it for the type and what I thought could be done with it esthetically. <br> <br>The tax people eventually want designers seeming to be in business to eventually declare whether they're hobbyists or really in a for-profit enterprise, so in my case, I chose the latter. (I never felt right about starting a type company as a non-profit - in the sense that the Internal Revenue Service defines non-profit.) <br> <br>Along with being in business for oneself comes a lot of responsibilities. I think that if what I do is any good at all, that I should be able to expect a fair return on its sales. I also think that I should be able to expect others to respect my property. <br> <br>Pirates subvert both those basic, human expectations. <br> <br>And for what?  <br> <br>The pirate seeks to steal my property and upload it to others, dilute my revenue potential and wreak my business and my life, and break my artistic spirit, all to make themselves look cool? <br> <br>How exactly does that make them the big man, except to other thieves, other thugs? <br> <br>Sorry. I don't see the aura in it worthy of worship. <br> <br>I look at a font pirate who takes and blindly uploads, and I see a selfish, immature, pitiful, very misguided person looking for love and acceptance while making some of the worst life choices possible for themselves. <br> <br>I think it's especially hard to forgive pirates who rip off dozens of companies, and do uploads that go on for hours or days at a time. I'd say that kind of heartlessness doesn't change. <br> <br>In my case, I know this about font pirates:  <br> <br>We spent much of the '90s being ripped off by pirates who one might expect to see in a list of names, and by others whom one might be surprised to see there.  <br> <br>They kept me from properly providing for my 84 and 92 year old grandparents when they came to live with us in '98, no longer able to care for themselves. They pretty much took out of my wallet money for my son's college education. Another family member, formerly employed here, is now clinically depressed because of how they took dealing with auditing the ongoing font theft problems. (I guess everyone reacts differently, some being more emotionally fragile than others.) <br> <br>No, they haven't broken my spirit. <br> <br>With it all (and believe me, it's considerable torture), I'm actually sad for the so-called pirates.  <br> <br>I believe that the only way to demonstrate that such pirates have made an effort to effect change in themselves would be to do this: <br> <br>- Deliver a sincere, signed, written letter of apology  <br>  to each foundry ripped off.  <br>  Ideally, to each artist, since we  <br>  are talking about individual human beings  <br>  being ripped off. <br> <br>- Destroy the pirated copies they have, and <br>  recommend to those who follow them, to do the same. <br> <br>- Make some effort at starting a long-term  <br>  repayment of some token amount of money. <br>  (It's like with loaning money to a family  <br>  member or friend, where you expect to be  <br>  paid back, but they never quite do. <br>  Even some token effort would show they care.) <br> <br>The ripoffs are about personal decisions, about property and (for better or worse) about money (read, in tax terms: current revenues unrealized). <br> <br>It seems logical to me that a mere \"Well, you know, I've matured now...\" really doesn't cut it and actually just exhibits zero maturation and more antisocial behavior. <br> <br>To those who continue to pirate commercial fonts: You are seeing the fonts as something that they are not, nor were ever intended to be. <br> <br>Speaking in general: Collect all the freeware, non-pirated, non-cloned, non-autotraced, public domain fonts you want. But if you want our fonts intended for retail commercial sale, be sure you have a license or bill of sale to document that they should legally be present on your computer(s). <br>Now, we actively notify the U.S. Treasury Department and other official bodies charged with going after entities that misuse or defile U.S. Trademarks, copyrights, etc. What a pain. But that's what they're paid to do. So now, if pirates won't heed my simple plea to stop, they'll eventually open their door to a uniformed agent. <br> <br>Regarding the music industry fight (for example, via RIAA): Unless it's in the public domain, contrary to popular belief, it isn't 'your' music (meaning 'the fans' music'). It is the property of the rights holder (who may or may not be the original creator). It's only a matter of time before that whole issue is settled. <br> <br>I also support the antipiracy effort the movie industry is mounting anew. The informative commercial before 'Spy Kids 3-D' last weekend was very good. (Although I couldn't understand why the URL to find out more, at the end, was flashed for about a second. Way too brief.) <br> <br>The light at the end of the tunnel, for audio and video pirates first, really is an oncoming train. Unfortunately, I think a lot of confused kids (and their parents) are going to get some very unpleasant surprises. <br> <br>It could all be avoided if people simply took stock again of what constitutes others' property. <br> <br>I'll just leave my opinion on that there. I really don't want to keep getting off the type track. <br> <br>But what you see going on with the RIAA? I believe that it's just a matter of time - measured shortly - that the commercial type industry starts to adopt the same tactics. Piracy has made it necessary. <br> <br>Joe <br> <br> <br></p>"
