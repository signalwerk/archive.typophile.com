    html: <p>I'm not arguing <i>for</i> piracy, I'm asking for realism <br> <br>What I'm saying is that if you eliminated piracy, then people who use pirated fonts would have options open to them, other than to buy the fonts they previously used for free. <br>I'm also arguing that in many cases, they would take one of those options rather than pay for a font. <br>I'm therefore also saying that its false that "every pirate copy has indeed cost the industry some tangible, definable cost". <br> <br>&gt;&gt;I'm a human being. I can define something for myself as my property. My expectation is that you will not try to take my property. I'm naturally surprised when you do. Sounds basic to me.  <br> <br>My point is that property is a cultural phenomena, defined, not by you or me, but by people with...oh yeah, that's it...lots of property. Its not part of the human condition, although its often presented that way. <br>(Notice, for example, in the Americas, how European's stole everything in sight first, made stealing illegal second, built a society based on the right to defend your property from theives third).</p>
