    html: <p>The main problem with font piracy is how easy it is to do. In the past, it required hard work to pirate a font. Since fonts went digital, it takes little more than a decision to do it. Until a solution to this basic problem is found, producers of fonts are entirely at the mercy of people's willingness to take the end user licensing agreement seriously. I have no doubt that most font piracy is due to shear laziness, ignorance, and apathy, not people who have a philosophical problem with the concept of property.</p>
