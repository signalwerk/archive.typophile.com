    html: <p>"Yes, for amateurs and collectors, there is nothing at all wrong with seeking out free fonts..." <br> <br>Most of the amateurs and collectors or other users of free fonts aren't much of a legitimate market to worry about. THEY DON'T BUY FONTS. And folks who have to use fonts for a living pretty much depend upon technically functional fonts, so most free fonts are relatively useless. I collect free fonts, but I don't think I've ever used one. I simply find it an interesting historical phenonmenon. I'm not saying that all commercial fonts are technically functional either, but most of the better known foundries can be trusted in this regard. <br> <br>The whole "free font" thing has been made to be a bigger deal than it really is (by the commercial vendors). If someone is offering copied Adobe fonts in PC TT, would anyone really want to use them for anything you'd want to put out there? <br> <br></p>
