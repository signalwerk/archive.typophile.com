    html: "<p>&gt; RIAA .... the commercial type industry starts to adopt the same tactics. <br> <br>You mean alienating potential future customers and creating even more motivation for piracy, with not a hint of anything positive -certainly not profits- to show for it? That's just like US foreign policy: reduce terrorism by making more enemies... <br> <br>Fortunately that can't happen in the font world, because none of us have nearly enough power to give us self-destructive delusions of omnipotence. <br> <br>-- <br> <br>I'd recommend doing what Carter and Frutiger do: ignore what you can't change. Don't look back - just keep making newer, better stuff faster than the old stuff becomes undesirable (through piracy or otherwise). <br> <br>hhp <br></p>"
