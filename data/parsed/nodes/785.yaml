    html: <p>&gt;&gt;how can you strongly infer that they purposely lie by inflating the numbers?  <br> <br>They don't have to purposely lie to inflate the numbers, they could just purposely ignore a patently obvious secondary factor which makes the bare numbers (of pirate copies) unreliable as a guide to the actual cost to the industry in lost revenue. <br>While estimates of the number of pirate copies that are in circulation are only likely to be wildly inaccurate, estimates concerning the proportion of users of pirate copies who would have paid for the font if a pirate copy had not been available can be nothing more than fantasy guesswork. <br> <br>Those with an interest in making the financial cost to the industry seem as large as possible can simply assume that every pirate copy has cost the industry the full retail price in lost revenue. <br> <br>Those with a more realistic outlook are aware that most users of pirate fonts would never have paid for the font if they hadn't been able to use a pirate copy. Zero piracy would make some difference to industry revenue, but not much. The largest difference would be the increase in usage of freeware and software-bundled fonts. <br> <br>=============== <br> <br>&gt;I should be able to expect others to respect my property.  <br>&gt;Pirates subvert both those basic, human expectations.  <br> <br>Since when was respect for property a basic human expectation? <br></p>
    html_clean: <p>&gt;&gt;how can you strongly infer that they purposely lie by inflating the numbers?  <br> <br>They don't have to purposely lie to inflate the numbers, they could just purposely ignore a patently obvious secondary factor which makes the bare numbers (of pirate copies) unreliable as a guide to the actual cost to the industry in lost revenue. <br>While estimates of the number of pirate copies that are in circulation are only likely to be wildly inaccurate, estimates concerning the proportion of users of pirate copies who would have paid for the font if a pirate copy had not been available can be nothing more than fantasy guesswork. <br> <br>Those with an interest in making the financial cost to the industry seem as large as possible can simply assume that every pirate copy has cost the industry the full retail price in lost revenue. <br> <br>Those with a more realistic outlook are aware that most users of pirate fonts would never have paid for the font if they hadn't been able to use a pirate copy. Zero piracy would make some difference to industry revenue, but not much. The largest difference would be the increase in usage of freeware and software-bundled fonts. <br> <br>=============== <br> <br>&gt;I should be able to expect others to respect my property.  <br>&gt;Pirates subvert both those basic, human expectations.  <br> <br>Since when was respect for property a basic human expectation? <br></p>
