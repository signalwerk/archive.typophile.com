    html: <p>I believe it is what Daniel Quinn calls "Mother Culture" in his books, Steve. Cultural "norms" so engrained that may not be questioned, and to do so will be met with extreme opposition. <br> <br>Sadly, the western world works to those cultural norms and there is little point arguing the toss with people who cannot (or more accurately, will not) see another way of working or thinking. Those who have an interest in maintaining their own philosophies will of course spin figures to suit their own ends (pretending that, if only there were a magic way to prevent piracy, all the pirates would go out and buy the fonts. Ha, right!), and defend their standpoint vigorously. <br> <br>Far better, I think, to put your philosophies into practice. Work on opensource or freeware lines and prove to people that there is room for more than one philosophical standpoint on property. Create a typeface of worth and use that will stand the test of time, and give it away, or dare to think of alternative licensing schemes. <br> <br>Teach by example, by doing what you believe in. Prove that other methods can work too. <br> <br>And Hrant... I owe you a beer for saving me the trouble of typing ;)</p>
