    html: "<p>&lt;em&gt;I don't at all mean to be smug, but, how exactly do you know that?&lt;/em&gt; <br> <br>'Cause I know people (sometimes myself) that have used software, fonts, movies, music, etc. that they wouldn't have purchased anyways. <br> <br>BTW, I work for a software company as well, and understand the problem. However, not every piece of pirated intellectual property is a lost sale. Some are. Some aren't. Some actually lead to sales.  <br> <br>I'm not *for* pirating. It's illegal, and not a good thing. I'm just not for the way companies (in general) make obnoxious claims as to how much they are loosing to piracy.  <br> <br>&lt;em&gt;If you're privy to some authenticated survey document that reveals inflation of survey results, I'd love to see it. &lt;/em&gt; <br> <br>Like I said, I can only *prove* first hand experiences with it. That said, I don't think the intellectual property owners can prove the losses, either. It's a pretty muddy area. <br> <br>Listen, I appreciate your stand on Pirating. You are not alone.  <br> <br>&lt;em&gt;The informative commercial before 'Spy Kids 3-D' last weekend was very good.&lt;/em&gt; <br> <br>It was bullshit. Kids trading a few badly ripped movies on the internet is not a devastating blow to the movie industry. What is bad is me having to sit through that sob-story ad (hey...how about cutting the lead's salary a bit!?) then 3 commercials, then TWENTY MINTUES of previews, and then 1 1/2 hour of crappy film making (Johnny English).  <br> <br>OK, that rant had little to do with type, but I had to get it out of my system. <br> <br>Anyways, a good movie is a good moview. People will go see it and/or buy the DVD if they like it. Those pirating it probably aren't willing to fork over the $8 to see it in the theater anyways. <br> <br>The current problem with inellectual property owners and distributors is their complete lack of trust in their own consumers. You can't win piracy. It'll never go away. So live with it, and respect and cultivate the consumer that appreciates the wares you are providing. All IMHO, of course. <br> <br>Off topic: <br> <br>&lt;em&gt;But what you see going on with the RIAA?&lt;/em&gt; <br> <br>I see the RIAA somehow convincing our legal system that 14 year old Cindy sharing a copy of a Brittney Spears song is somehow damaging the industry in the realm of $100,000 while at the same time somehow convincing the judge that their decade of price fixing was only damaging the consumer a total of $15. It completely boggles the mind how the RIAA is working right now and what they are getting away with. Gotta agree with Hrant. <br> <br>&lt;em&gt;I've never gotten the impression that there has been any effort to inflate piracy figures.&lt;/em&gt; <br> <br>It's not the number of pirates that is wildly incorrect--it is assuming that every single pirated piece of property was a lost sale. There is simply no way to make that correlation. Your example of raided design firms does nothing to in fer that the design firm would have boughted the fonts in the first place (though it can probably be easily infered with hindsight, they would have.) <br> <br>But, anyways, you have your POV on the issue and others have a different one. There probably isn't much use convincing each side. ;o)</p>"
