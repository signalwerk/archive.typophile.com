  html: <p>"This was mentioned by the brilliant lettering artist and type designer Keith Tam in another thread. It is a great deal. I have a pessimistic opinion of why more teachers don't push this, but I think it should be a mandatory purchase. Train them straight away that purchasing fonts is the way to go. " <br> <br>Just a guess, but it's probably because the fonts are Opentype, and since they're from Adobe they're probably going to be full featured Opentype.  And, being that schools still pretty much only teach Quark, they can't take advantage of the extended features in the fonts. <br> <br>Quark is shooting themselves in the foot by not, first, going Unicode, and second, by not including Opentype support.</p>
  html_clean: <p>"This was mentioned by the brilliant lettering artist and type designer Keith Tam in another thread. It is a great deal. I have a pessimistic opinion of why more teachers don't push this, but I think it should be a mandatory purchase. Train them straight away that purchasing fonts is the way to go. " <br> <br>Just a guess, but it's probably because the fonts are Opentype, and since they're from Adobe they're probably going to be full featured Opentype.  And, being that schools still pretty much only teach Quark, they can't take advantage of the extended features in the fonts. <br> <br>Quark is shooting themselves in the foot by not, first, going Unicode, and second, by not including Opentype support.</p>
