    html: <p>"Most of the amateurs and collectors or other users of free fonts aren't much of a legitimate market to worry about. THEY DON'T BUY FONTS." <br> <br>Exactly. Free fonts aren't necessarily bad. Of course, pirated fonts aren't a good thing, as they do certainly hurt sales--but not quite to the extent the intellectual property companies (foundries, music labels, moview industry, software companies, etc.) make it out to be. <br> <br>Bad knock-offs, I think, are probably the most damaging, as they appear legit, and, technically, may be, but they harm the the integrity of the original work. <br> <br>One bit of advice I thought was good was to try and obtain a new face for each project you work on. This is a great way to build a library of good type over time without a large up-front burden. <br> <br>Another problem is that I think a lot of graphic designers fail to see the full cost of running a firm and fail to charge accordingly. It takes money to keep hardware, software, typefaces, updates, etc all running. <br> <br>There is a case for free fonts, though. I'm an example. I now work for a government agency and as much as it pains me to say it, getting a PO for a full set of Univers isn't a big priority when it comes to spending tax payer money ;o) <br> <br>So, to all of you type designers who have released the odd nice freeware face, thank you!</p>
    html_clean: <p>"Most of the amateurs and collectors or other users of free fonts aren't much of a legitimate market to worry about. THEY DON'T BUY FONTS." <br> <br>Exactly. Free fonts aren't necessarily bad. Of course, pirated fonts aren't a good thing, as they do certainly hurt sales--but not quite to the extent the intellectual property companies (foundries, music labels, moview industry, software companies, etc.) make it out to be. <br> <br>Bad knock-offs, I think, are probably the most damaging, as they appear legit, and, technically, may be, but they harm the the integrity of the original work. <br> <br>One bit of advice I thought was good was to try and obtain a new face for each project you work on. This is a great way to build a library of good type over time without a large up-front burden. <br> <br>Another problem is that I think a lot of graphic designers fail to see the full cost of running a firm and fail to charge accordingly. It takes money to keep hardware, software, typefaces, updates, etc all running. <br> <br>There is a case for free fonts, though. I'm an example. I now work for a government agency and as much as it pains me to say it, getting a PO for a full set of Univers isn't a big priority when it comes to spending tax payer money ;o) <br> <br>So, to all of you type designers who have released the odd nice freeware face, thank you!</p>
