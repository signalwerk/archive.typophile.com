    html: <p>steve paxton said <br> <br>&gt;What I'm saying is that if you eliminated piracy, <br>&gt;then people who use pirated fonts would have <br>&gt;options open to them, other than to buy the fonts <br>&gt;they previously used for free. <br> <br>They have those options open to them now.  <br> <br>The market is flooded with fonts bundled with applications and has been since 1988 or so, as I recall. <br> <br>First of all, I have a very hard time believing there are people who get themselves to the point in their experience level where they simply collect professional, for-retail fonts and never actually use them commercially. But if there are such people, then somehow they need to get the message (perhaps through a collecting organization of some kind) that they should restrict their collecting to freeware that's not cloneware, until they are ready to buy.  <br> <br>The people (whether 'collectors', or art directors, designers, or production people) who amass commercial fonts without buying them do so because built-in OS fonts and application-bundled fonts are simply not enough. <br> <br>That is, the commercial non-bundled fonts are indeed more desirable. Otherwise, the bundled fonts certainly would suffice. <br> <br>(And yes, I've heard about those who believe it's a numbers game. Who took the old circa-1987 Image Club Graphics headline distortion, "He with the most fonts wins!" and grafted the mentality onto a rationale for mass piracy.) <br> <br>Somehow, then, such pirates need to get their heads wrapped around the concept that if they need fonts beyond bundled fonts, and beyond non-clone freeware, that payment is expected of them. <br> <br>I think this group is very comfortable with the idea of fonts requiring large amounts of research and development time. <br> <br>Typically, companies that make comercial fonts expect that that R&amp;D expense will be paid for over time by the market.  <br> <br> <br>&gt;(Notice, for example, in the Americas,  <br>&gt;how European's stole everything in sight  <br>&gt;first, made stealing illegal second,  <br>&gt;built a society based on the right to  <br>&gt;defend your property from theives third). <br> <br>'European's' certainly are possessive, it appears. <br> <br>I think that colonial history doesn't apply to this discussion. It's intriguing, of course. And we're all very lucky we don't live in such barbaric times. <br> <br>But I think that not strictly focusing on the idea that modern day commercial for-retail fonts are commercial software (since 1984, or since the advent of EULAs, perhaps) that has always been meant to be metered and purchased, tends to cloud the issue. <br> <br>And people are already too confused about this, in many corners. <br> <br>Joe <br> <br> <br></p>
