se with an interest in making the financial <br>&gt;cost to the industry seem as large as possible  <br>&gt;can simply assume that every pirate copy has  <br>&gt;cost the industry the full retail price in  <br>&gt;lost revenue.  <br> <br> <br>No. Sometimes it would have been a discounted price. But yes, every pirate copy has indeed cost the industry some tangible, definable cost. <br> <br>Most every instance of piracy is, after all, a conscious act. <br> <br> <br>&gt;Those with a more realistic outlook are aware  <br>&gt;that most users of pirate fonts would never  <br>&gt;have paid for the font if they hadn't been able  <br>&gt;to use a pirate copy.  <br> <br> <br>I think that's also false, and I'd never make such an assumption. <br> <br>If the user is of the mindset that a commercial software product is not worthy of payment (and it's known that the manufacturer expects the user to make payment is the user keeps it), then the user should not have the product in their possession. <br> <br> <br>&gt;Zero piracy would make  <br>&gt;some difference to industry revenue, but not  <br>&gt;much.  <br> <br> <br>Not true. It's an ongoing problem that has been with us since 1986 in the commercial world. That lost revenue for every year since 1986, is indeed significant. <br> <br> <br>&gt;The largest difference would be the  <br>&gt;increase in usage of freeware and software-bundled fonts. <br> <br> <br>I don't think that one has anything to do with the other.  <br> <br>There will always be marketers who seek to prop up application software with fonts or clip art, though. (And there will always be graphic designers unfamiliar enough with the nature of competition to blindly rely on them.) <br> <br>There will always be freeware fonts. And that's fine*. (*With the caveats already discussed.) <br> <br> <br>&gt;Since when was respect for property a basic human expectation? <br> <br> <br>Well, why not? I think it is.  <br> <br>I'm a human being. I can define something for myself as my property. My expectation is that you will not try to take my property. I'm naturally surprised when you do. Sounds basic to me. <br> <br> <br>Why argue **for** piracy? <br> <br>Joe <br> <br> <br></p>
