    html: <p>To my <br> <br>&gt;&gt;how can you strongly infer that  <br>&gt;&gt;they purposely lie by inflating the numbers?  <br> <br>Steve Paxton said <br> <br>&gt;While estimates of the number of pirate copies <br>&gt;that are in circulation are only likely to be <br>&gt;wildly inaccurate,  <br> <br> <br>I think that's false.  <br> <br>I think it's quite possible to be accurate enough. There's always a certain amount of 'educated guesswork' necessary looking at historical trends of product usage, future projected usage, etc. That's normal. <br> <br> <br>&gt;estimates concerning the proportion of users  <br>&gt;of pirate copies who would have paid for  <br>&gt;the font if a pirate copy had not been available <br>&gt;can be nothing more than fantasy guesswork.  <br> <br> <br>I think that's also false.  <br> <br>For instance, a large number of the users of pirate font software copies are people who work in the graphic arts. It's often art directors and also production workers at service bureaus. That's been well known since the dawn of desktop publishing.  <br> <br>Nearly two decades of police-accompanied raids on those businesses documented by the third-party monitoring organizations now have many thousands of logs of what software was present at the point of the raid. <br> <br>There is plenty of data (and would have been by 1995) to get an accurate enough picture of the extent of piracy. An honestly accurate enough view. <br> <br>Fantasy guesswork (again, I'd call it 'educated guesswork' since it's by professionals who have data collected to start with, and then extrapolate data professionally for a living) happens all the time in business projections.  <br> <br>I've watched the type industry for 30 years, and the microcomputer software industry since the early '80s, and I've never gotten the impression that there has been any effort to inflate piracy figures. <br> <br>I run a business. I want the numbers to be as accurate as possible. <br> <br> <br>&gt;Those with an interest in making the financial <br>&gt;cost to the industry seem as large as possible  <br>&gt;can simply assume that every pirate copy has  <br>&gt;cost the industry the full retail price in  <br>&gt;lost revenue.  <br> <br> <br>No. Sometimes it would have been a discounted price. But yes, every pirate copy has indeed cost the industry some tangible, definable cost. <br> <br>Most every instance of piracy is, after all, a conscious act. <br> <br> <br>&gt;Those with a more realistic outlook are aware  <br>&gt;that most users of pirate fonts would never  <br>&gt;have paid for the font if they hadn't been able  <br>&gt;to use a pirate copy.  <br> <br> <br>I think that's also false, and I'd never make such an assumption. <br> <br>If the user is of the mindset that a commercial software product is not worthy of payment (and it's known that the manufacturer expects the user to make payment is the user keeps it), then the user should not have the product in their possession. <br> <br> <br>&gt;Zero piracy would make  <br>&gt;some difference to industry revenue, but not  <br>&gt;much.  <br> <br> <br>Not true. It's an ongoing problem that has been with us since 1986 in the commercial world. That lost revenue for every year since 1986, is indeed significant. <br> <br> <br>&gt;The largest difference would be the  <br>&gt;increase in usage of freeware and software-bundled fonts. <br> <br> <br>I don't think that one has anything to do with the other.  <br> <br>There will always be marketers who seek to prop up application software with fonts or clip art, though. (And there will always be graphic designers unfamiliar enough with the nature of competition to blindly rely on them.) <br> <br>There will always be freeware fonts. And that's fine*. (*With the caveats already discussed.) <br> <br> <br>&gt;Since when was respect for property a basic human expectation? <br> <br> <br>Well, why not? I think it is.  <br> <br>I'm a human being. I can define something for myself as my property. My expectation is that you will not try to take my property. I'm naturally surprised when you do. Sounds basic to me. <br> <br> <br>Why argue **for** piracy? <br> <br>Joe <br> <br> <br></p>
