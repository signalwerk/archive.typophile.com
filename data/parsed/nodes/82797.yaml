      <p>This website is not really for me- I am a painter wanting to gain a bit of understanding about fonts.  I did the "Font 101" already, which was interesting, but it is not immediately apparent what information is applicable to using fonts responsibly.</p>
      <p>Specifically, I have had to make several paper products (programs and postcards) for an event I am planning.  I am a painter, but I want to take baby steps to understanding how to use multiple fonts in one item.  I have a fine arts degree, but I am no designer.  I will pick up recommended books, but does anyone else have advice for amateurs (who probably will not read a whole book).  Basic rules for responsible font usage?</p>
      <p>Thank you for your time and brain.</p>
