    html: |-
      <p>First of all, congratulations! A new typophile is always cause for celebration.</p>
      <p>There's a big difference between "typography" (i.e., the design and composition of texts) and "kinetic typography," though I suppose you could argue kinetic typography is a subset of typography. The standard tool for kinetic typography is Adobe After Effects, which, as Stickly mentioned, isn't cheap. However, if you have access to a video camera, you could do it stop-motion style, which doesn't need to involve software at all. <a class="freelinking external" href="http://vimeo.com/6382511" rel="nofollow">This</a>, for instance, was created by traditional stop-motion, entirely without assistance from software.</p>
      <p>If you are interested in typography in the traditional sense, you might want to read "Thinking With Type" by Ellen Lupton, which is a fun introduction to typography, or "The Elements of Typographic Style" by Robert Bringhurst, which is a more in-depth foray.</p>
      <p>Welcome to Typophile!</p>
