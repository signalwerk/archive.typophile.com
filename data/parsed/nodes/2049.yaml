    date_raw: 30 Nov 2003 — 2:19am
    votes: null
    html: <p>A bold would help sort out the 'random-noise-pixel' I see in the current rendering.  <br> <br>I second the critique of the lowercase 'a' - its ligature pixel shimmies up the baseline and causes reading damage. Flatten that, and give yourself a proper terminal on the 'g' and you've got a nice readable pixel serif. <br> <br>but why nitpick when pixel fonts are quirky by nature. <br><a href="http://en2.wikipedia.org/wiki/Quirinus" target="_blank">http://en2.wikipedia.org/wiki/Quirinus</a></p>
    html_clean: <p>A bold would help sort out the 'random-noise-pixel' I see in the current rendering.  <br> <br>I second the critique of the lowercase 'a' - its ligature pixel shimmies up the baseline and causes reading damage. Flatten that, and give yourself a proper terminal on the 'g' and you've got a nice readable pixel serif. <br> <br>but why nitpick when pixel fonts are quirky by nature. <br><a href="http://en2.wikipedia.org/wiki/Quirinus" target="_blank" class="link-external">http://en2.wikipedia.org/wiki/Quirinus</a></p>
