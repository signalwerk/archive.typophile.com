    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12038" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Terminology</a>&nbsp;:&nbsp;Semi-serif</strong></p>
    <p>A post-modernist category of typeface that mixes elements of both the <a href="/node/13702" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Serif</a> and <a href="/node/12132" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">sans serif</a> forms.</p>
    <p><strong>Discussion:</strong><br><a href="http://typophile.com/node/13079">Other sans-serif/serif hybrids besides Dead History?</a><br><a href="http://typophile.com/node/29946">The Best Term for a Typeface That Combines Elements of Both Serif and Sans&nbsp;Serif?</a></p>
    <p>&lt;–! Note: I’m not sure this is the right term, as there are straight text fonts with “Semiserif” in the name. “Hybrid” something or “Mashup” might be a more appropriate wiki page for this type of font. - S.&nbsp;Coles</p>
    <p>Note: Stephen, i’m not sure how the term “semi-serif” is used in reference to these other types of fonts. Can you point me toward some samples, so that I can expand this article to include both usages?&nbsp;–&gt;</p>
