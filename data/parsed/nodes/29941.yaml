    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a> : Semi-serif</strong></p>
    <p>A post-modernist category of typeface that mixes elements of both the <a href="/wiki/serif" class="freelinking" rel="nofollow">serif</a> and <a href="/wiki/sans%20serif" class="freelinking" rel="nofollow">sans serif</a> forms.</p>
    <p><strong>Discussion:</strong><br>
    <a href="http://typophile.com/node/13079" rel="nofollow">Other sans-serif/serif hybrids besides Dead History?</a><br>
    <a href="http://typophile.com/node/29946" rel="nofollow">The Best Term for a Typeface That Combines Elements of Both Serif and Sans Serif?</a></p>
    <p>&lt;--! Note: I'm not sure this is the right term, as there are straight text fonts with "Semiserif" in the name. "Hybrid" something or "Mashup" might be a more appropriate wiki page for this type of font. - S. Coles</p>
    <p>Note: Stephen, i'm not sure how the term "semi-serif" is used in reference to these other types of fonts. Can you point me toward some samples, so that I can expand this article to include both usages? --&gt;</p>
