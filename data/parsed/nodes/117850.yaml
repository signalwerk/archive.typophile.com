      <p>Don't want to rain on the parade but I have compared an assortment of Mr. Steffmann's fonts with digital fonts created earlier by others and found that -- after standardizing the glyph sizes -- the digital outlines were point for point identical. The only differences being that he had added some glyphs to make the fonts more complete. I didn't compile a comprehensive list, but some specific ones are in posts to the font ID forum -- which unfortunately is not indexed.<br>
      Don</p>
