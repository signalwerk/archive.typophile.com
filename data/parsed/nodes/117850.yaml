      <div class="comment-spam-body"><p>You might find it helpful to read some books on Fraktur. There is a fairly comprehensive collection of Fraktur in Judith Schalansky's _Fraktur Mon Amour_ available from many sources including US Amazon <a href="http://www.amazon.com/Fraktur-Mon-Amour-Judith-Schalansky/dp/156898801X" title="http://www.amazon.com/Fraktur-Mon-Amour-Judith-Schalansky/dp/156898801X">http://www.amazon.com/Fraktur-Mon-Amour-Judith-Schalansky/dp/156898801X</a><br>
      There is an excellent study of the social context of Fraktur in Peter Bain &amp; Paul Shaw's _Blackletter: Type and National Identity_  <a href="http://www.amazon.com/Blackletter-National-Identity-Shaw-Bain/dp/1568981252/ref=sr_1_1?s=books&amp;ie=UTF8&amp;qid=1405025209&amp;sr=1-1&amp;keywords=blackletter+and+national+identity" title="http://www.amazon.com/Blackletter-National-Identity-Shaw-Bain/dp/1568981252/ref=sr_1_1?s=books&amp;ie=UTF8&amp;qid=1405025209&amp;sr=1-1&amp;keywords=blackletter+and+national+identity">http://www.amazon.com/Blackletter-National-Identity-Shaw-Bain/dp/1568981...</a><br>
      If you can read German Albert Kapr's _Fraktur: Form und Geschichte der gebrochenen Schriften (German Edition)_ <a href="http://www.amazon.com/Fraktur-Geschichte-gebrochenen-Schriften-German/dp/3874392600/ref=la_B001K1IVRC_1_2?s=books&amp;ie=UTF8&amp;qid=1405025466&amp;sr=1-2" title="http://www.amazon.com/Fraktur-Geschichte-gebrochenen-Schriften-German/dp/3874392600/ref=la_B001K1IVRC_1_2?s=books&amp;ie=UTF8&amp;qid=1405025466&amp;sr=1-2">http://www.amazon.com/Fraktur-Geschichte-gebrochenen-Schriften-German/dp...</a><br>
      Don</p>
      </div>
