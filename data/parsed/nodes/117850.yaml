      <p>O.K. with some digging I found this<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Rostrot_3676.jpg"></div><br>
      Answers my question.<br>
      Looks like a generally successful design concept for a monoline Fraktur.<br>
      Most letters , particularly the lower case, except for the usual problem with _k_ and _w_, would seem to work well for readers unfamiliar with Fraktur. The uppercase resolves some problems, but still has ambiguities for readers unfamiliar with Fraktur. Some examples:  _D_ and _O_, _K_ and _R_, _C_ and _S_. BTW, _G_ would make a good logo for Twitter.<br>
      In my opinion, for whatever it is worth, the font could be improved if it provided some alternate versions of the problematic letters. Unlike most Fraktur, this one could work particularly well in low resolution situations.<br>
      Don<p></p>
