      <p>For a contemporary monolinear (but not monospaced) Fraktur, see <a href="http://fontsinuse.com/uses/3385/grimms-maerchen-ohne-worte-by-frank-floethman" rel="nofollow">Rostrot</a> by Georg Seifert:</p>
      <blockquote><p>
      This modernized blackletter started out in 2006 as a graduation project at the Bauhaus-Universität Weimar. Georg Seifert tried to answer the question how Fraktur typefaces would have looked like today, if they hadn’t fallen out of fashion. In Georg’s hands, the old Teutonic letterforms had to undergo the same stylistic shifts and transformations as Roman typefaces did: less ornamentation, a simplified construction, and a drastically reduced contrast. The result is a “grotesque” monolinear blackletter, Rostrot, and its “seriffed” sister style with some contrast, RosenRot. The fonts were never officially published, but come bundled with Judith Schalansky’s book Fraktur Mon Amour. — <a href="http://fontsinuse.com/uses/3385/grimms-maerchen-ohne-worte-by-frank-floethman" rel="nofollow">Fonts In Use</a>
      </p></blockquote>
