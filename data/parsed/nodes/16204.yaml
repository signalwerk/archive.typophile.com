    <p><a href="/web/20150123175318/http://typophile.com/wiki/Ingo%20Preuss" class="freelinking" rel="nofollow">Ingo Preuss</a> released his ultra fat family BATTISTA coming in OpenType format and in five styles: Regular, Italic, Open, Stroke &amp; Ornate.  </p>
    <p>The BATTISTA typeface stands in the long tradition of the designs developed by Giambattista Bodoni, who made his famous typefaces in the end of the eighteenth century. Similar designs can be found on various specimen books e.g. Alexander Wilson, John Bell, Edmund Fry and Alexander Thibaudeau. One of the best italics was available by Stephenson Blake &amp; Co. foundry form Sheffield, England. In the end of the nineteenth century an unknown punch cutter at the German type foundry Schelter &amp; Giesecke made an very bold cut of this Bodoni design. He brought both designs, the regular and the italic to an new level of harmony.</p>
    <p>Compared to the original Bodoni designs the new typeface was a lot bolder, which was well taken by the audience in this time. The BATTISTA typeface is an remarkable design, assembled of ultra bold and very fine shapes, but in all, the spirit of Bodonis design was well preserved.</p>
    <p>Have a look to the <a href="https://web.archive.org/web/20150123175318/http://www.preusstype.com/pdf/Battista_web_v101.pdf" target="_blank" rel="nofollow">specimen PDF</a>!</p>
    <p>The typefaces can be licensed from <a href="https://web.archive.org/web/20150123175318/http://www.preusstype.com/fam-battista.php" target="_blank" rel="nofollow">Preusstype</a> and <a href="https://web.archive.org/web/20150123175318/http://www.myfonts.com/fonts/preusstype/battista/" target="_blank" rel="nofollow">MyFonts</a>.</p>
    <p><a href="https://web.archive.org/web/20150123175318/http://www.preusstype.com/" title="www.preusstype.com">www.preusstype.com</a></p>
