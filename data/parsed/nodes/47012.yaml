      <p>yes guillemets I wrote this about 1997-99</p>
      <p><a href="http://www.microsoft.com/typography/developers/fdsspec/punc.aspx" title="http://www.microsoft.com/typography/developers/fdsspec/punc.aspx">http://www.microsoft.com/typography/developers/fdsspec/punc.aspx</a></p>
      <p>Guillemets</p>
      <p>These quotation marks commonly called 'French quotes' or 'duck's feet' are said to have been named after a French typecutter Guillaume (William) Le Bé. Guillemets is the French word for quotation marks. The similarly named Guillemot is a narrow billed, sea auk with duck like feet found in cold northern regions of the world.</p>
      <p>These pointing quotation marks are used in many languages and point differently dependent on the language. The German language uses these quotation marks with the right pointing guillemets as the open quotation marks and the left pointing guillemts as the close quotation marks. In French typography the left pointing quillemets are used as the open quotation marks and the right pointing quillemets are the closing quotation marks.</p>
      <p>Traditionally in French typography the left pointing guillemets are followed by a non-breaking word space or thin space of 1/8 the em and the right proceeded by a non-breaking word space or thin space of 1/8 the em.</p>
      <p>    * Single left pointing quillemet<br>
            Unicode: U+2039</p>
      <p>      Advance width rule : This character's advance width is proportional and the same as the single right pointing guillemet.</p>
      <p>      Height alignment : This character aligns on the lowercase x-height at the same vertical height as the single right guillemet. </p>
      <p>    * Single right pointing quillemet<br>
            Unicode: U+203a</p>
      <p>      Advance width rule : This character's advance width is proportional and the same as the single left pointing guillemet.</p>
      <p>      Height alignment : This character aligns on the lowercase x-height at the same vertical height as the single left pointing guillemet. </p>
      <p>    * Left pointing quillemets - guillemet ouvrant<br>
            Unicode: U+00ab</p>
      <p>      Advance width rule : This character's advance width is proportional and the same as the right pointing guillemets.</p>
      <p>      Height alignment : This character aligns on the lowercase x-height with the same vertical alignment as the right pointing guillemets. </p>
      <p>    * Right pointing quillemets - guillemet fermant<br>
            Unicode: U+00bb</p>
      <p>      Advance width rule : This character's advance width is proportional and the same as the left pointing guillemets.</p>
      <p>      Height alignment : This character aligns on the lowercase x-height with the same vertical alignment as the left pointing guillemets.</p>
      <p>      Language note : In French typographic usage the left pointing guillemet - guillemet ourvant is followed by a non-breaking word space (espace mots insécable) and the right pointing guillemet - guillemet fermant is preceded by a non-breaking word space. In Microsoft Word 97 the non-breaking space U+00A0 is automatically inserted when the French language is selected and a guillemet is typed. Some French typographers prefer to use a non-breaking thin space (espace fine insécable) with the guillemets.</p>
      <p>Vincent Connare</p>
