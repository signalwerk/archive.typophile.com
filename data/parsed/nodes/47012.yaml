      <p>James, are you worried about this?: "Traditionally in French typography the left pointing guillemets are followed by a non-breaking word space or thin space of 1/8 the em and the right proceeded by a non-breaking word space or thin space of 1/8 the em."</p>
      <p>If your question refers to this, fear not: those spaces are added by the typesetter, not the typeface designer. If you are asking about something else, just ignore this comment.  :-)</p>
