    html: |-
      <p>&gt;<em> Is this just one of those things I have to figure out by eye?</em></p>
      <p>Yes, it is. If you are worried about how well your eye judges this black/white balance, try setting a sample text in InDesign using various good fonts (Adobe fonts, FSI fonts, other favorites you might have…). Grab French and German text from Google News or any other favorite source. Replace the quote marks yourself, or let InDesign do it for you (it should switch them automatically if you change the text's language to French, for instance). See how text set in these fonts look. Make print-outs. Compare with the same text set in your font. Then you will see. It isn't so hard; you just have to trust you eyes and your intuition.</p>
