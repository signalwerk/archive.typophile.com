    html: |-
      <p>I think the problem might be related to the font being rendered using different rasterizers. In your web browser you're seeing the font rendered using your machine's ntaive rasterizer (OSX or Win), but Photoshop is using it's own internal rasterizer.<br>
      Lucida Grande is a well hinted TrueType font, and it looks to me like you're seeing the hints being interpreted differently (or on a Mac, seeing the results of downsampling.) In particular, note in your example how the ascenders are 1 pixel taller than the caps in the HTML version, but the ascenders align with Caps in your version. This could be a result of hints being applied differently.</p>
      <p>In that case, you won't be able to get the exact same image in your browser as in Photoshop even if the fonts are exactly the same, but they should be close.</p>
      <p>Jason</p>
