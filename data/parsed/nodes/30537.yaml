    html: |-
      <p>I would agree with Jason that the difference you see is due to the rasterizer. Lucida Grande will look different still when viewed in a Windows or Linux browser, due to the different rendering engines on those systems.</p>
      <p>You can only count on "Lucida Grande" being installed on Mac OS X systems, since it's the main UI font and I don't think you could delete it even if you wanted to. But Lucida Grande is just a newer version of Lucida Sans with an incredibly large character set. There is a similar version of Lucida Sans included with Windows 2000/XP called "Lucida Sans Unicode." Finally, the basic Lucida Sans ships with Microsoft Office products and thus can commonly be found on many Windows and Mac systems. It also has a true italic, which Lucida Grande and Lucida Sans Unicode lack.</p>
      <p>The most interesting thing about the three different versions is that while their common glyphs share mostly identical outlines, each one is hinted differently, giving it a noticeably different look when rendered at smaller sizes (at least under Windows).</p>
      <p>So, for cross-platform rendering on a website, you might write your style definition like this:</p>
      <p><code>font-family: 'Lucida Grande', 'Lucida Sans', 'Lucida Sans Unicode', sans-serif;<br>
      </code></p>
