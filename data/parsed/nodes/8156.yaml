    html: '<p>One extra suggestion: <br> <br>Avoid to start the family name with multiple capital letters in FontLab 4.x/Mac (like "XYZFontname") . This may result in improper ps file names. And surely the safer way to prepare all names is to click on the "Build Names" button. <br> <br>Johnych</p>'
