  html: "<p>okay so i'm trying to get family font-naming down and I'm following (or at least trying to follow) Adam Twardoch's \"Font Family Naming in FontLab\" but I'm having some problems. <br>First of all Adam's font naming scheme is working wonderfully for TTF fonts, but i'm having the following problems with PS versions: <br>Let's say the font family name is \"XYZ Fontname\" <br>In Indesign separate styles are being split up in the menu, ie. small caps, light version, etc. <br>Also the Regular versions are showing up in the the menu as \"XYZ Fontname\" and then in the style menu as \"Fontname Regular,\" \"Fontname Italic,\" etc. I just want the \"Regular\" and \"Italic\" to show up. If anyone can help me out, I'd appreciate it. Thnx.</p>"
  html_clean: "<p>okay so i'm trying to get family font-naming down and I'm following (or at least trying to follow) Adam Twardoch's \"Font Family Naming in FontLab\" but I'm having some problems. <br>First of all Adam's font naming scheme is working wonderfully for TTF fonts, but i'm having the following problems with PS versions: <br>Let's say the font family name is \"XYZ Fontname\" <br>In Indesign separate styles are being split up in the menu, ie. small caps, light version, etc. <br>Also the Regular versions are showing up in the the menu as \"XYZ Fontname\" and then in the style menu as \"Fontname Regular,\" \"Fontname Italic,\" etc. I just want the \"Regular\" and \"Italic\" to show up. If anyone can help me out, I'd appreciate it. Thnx.</p>"
