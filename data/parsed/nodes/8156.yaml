    html: <p>A couple of extra suggestions/comments. <br> <br>- make sure that the PostScript FullName includes the style, even for the "regular" face. <br> <br>- Make sure the PostScript FontName uses a dash between the family and the style. The family part should be the same as the family part of the FullName, with spaces omitted. <br>   If you had the dash after XYZ and before Fontname I could imagine that might have the effect you mention. <br> <br>Regards, <br> <br>T</p>
