    html: <p>It's hard to say without having a look, but don't forget to <br>run Font Cache Cleaner when you're testing font names. <br>OSX caches the names and then tortures you with them later. <br>That is, if you're using said OS. <br><a href="http://homepage.mac.com/mdouma46/fcache/fcache.html" target="_blank">http://homepage.mac.com/mdouma46/fcache/fcache.html</a></p>
