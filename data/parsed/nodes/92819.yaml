      <blockquote><p>And I guess deleting the space after the "½" kicks in makes it go to "11/2"? Is being forced to have a space between the "1" and "½" an acceptable compromise?</p></blockquote>
      <p>Deleting the space <em>before</em> the "½" makes it into "11/2", I think is what you meant. Which of course would cause "one-and-one-half" to be incorrectly read as "eleven-halves." But in plain text, you'd almost always have a space (or something) between the "1" and the "1/2" for precisely that reason. Tal noted the pros and cons in his <code class="freelink freelink-error freelink-Array freelink-error-Array">[Bad link]</code>, and the "space" compromise is mentioned in both categories.</p>
