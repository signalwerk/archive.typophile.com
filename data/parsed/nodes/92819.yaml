    <p>Hi all</p>
    <p>I'm using the opentype code from Tal Lemming to create fractions</p>
    <p><a href="http://talleming.com/2009/10/01/fraction-fever-2/" title="http://talleming.com/2009/10/01/fraction-fever-2/">http://talleming.com/2009/10/01/fraction-fever-2/</a></p>
    <p>Fractions like ½ on there own are working as expected in Indeisgn</p>
    <p>If I try 1½ I get 11 as the top of the fraction and 2 as the bottom of the fraction.</p>
    <p>I know the code is meant to work like this but how would I get 1½</p>
    <p>Should a number followed by a fraction have a space between the number and the following fraction.</p>
    <p>ttmt</p>
