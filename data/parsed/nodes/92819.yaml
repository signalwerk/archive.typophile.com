      <p>I experimented with nut fractions when I was making Scotch Modern, but couldn’t get them to work in the Fraction feature in both InD and Quark, so just implemented the basic fractions as pre-composed.</p>
      <p>However, I have since thought of a better way to do nut fractions in the feature—but haven’t had cause to  implement it, as all my subsequent faces have had “slash” fractions, not nut.</p>
