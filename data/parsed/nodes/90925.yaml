    <p>I'm not a designer, just the editor,  but I'm noting in horror that our new typeface Garamond ITC by BT (not sure what the BT means) displays inconsistent spacing after a terminal punctuation--periods and colons.  Most of the time, at our point size (9), it seems that the initial letter of the following sentence is "jammed" right up to the period. At other times, depending on the letter, it's not.</p>
    <p>It' less noticeable before a B or a W. But jams right up against an "A"  (.A ). A "T" seems to almost overhang the period. It's pretty damn close to the "H," too. As well as a quote mark. (.")</p>
    <p>What's causing this? Is there any way to fix it, globally?  BTW, I'm not fond of this font (x-height seems so high). But we have a far amount of leading, so tolerable. </p>
    <p>Also, I just copied this from the pdf over to a Word page and there's NO space before the offenders mentioned above (pairs that look too tight). What's going on???</p>
    <p>Thanks for any advice. I'm not sure I can get the publisher to change fonts in this redesign. I note that a magazine he likes uses the same ITC Garamond font -- but with much more leading than we use (I don't like that version either) but they have healthy spaces before the next sentence.</p>
    <p>I'm not an expert at all this...so speak in layman's terms, if you please!  MH</p>
