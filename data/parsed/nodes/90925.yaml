      <p>You’re using Quark XPress?<br>
      That means you can edit the kern tables in a document-specific manner (and transport the settings from one document to another).<br>
      No need to tinker with the fonts.<br>
      This is a long-standing feature of Quark that InDesign doesn’t have.<br>
      It’s quite straightforward — identify all the kerns between the problem letters and the space character, and delete them.</p>
