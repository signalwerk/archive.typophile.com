      <p>Don't change to InDesign until you also learn to use FontLab -- FontLab is to type what PhotoShop is to images. As of 2012, InDesign does not provide for writing a kerning program in the application.</p>
      <p>On the other hand, Quark will let you overwrite the kerning in the font as published. You can also specify using more space with the spaceband character generally, I believe. InDesign provides for this, too.</p>
      <p>Because type is now *licensed* rather than *owned,* it can be hard to hire people to work on your fonts. And the skill is usually bundled in with the skills of a compositor or type designer. The cheap way is for your art director to learn a couple new tricks.</p>
