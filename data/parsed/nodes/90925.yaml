      <p><cite>oops...tried to upload a screen shot. That didn't work. Could this be due to anything but the font and is it possible to fix kerning between a period and a space?!<cite></cite></cite></p>
      <p>Sure, depending on the layout program. With InDesign, just change the kern value used each time it happens. Better is to fix the kern values in the font (and make sure the typesetter doesn't use "optical" as opposed to "metrical" kerning), but strictly, that depends on whether or not the End User Licensing Agreement (EULA) permits modification to the font. Less strictly, I can't think of any font publisher who would object to an end user fixing a kerning bug.</p>
      <p>With what you describe: the capital letter *A* overhangs it's setwith (negative sidebearings) in many fonts, so it can be hard to say what's going on with an *A*, but your description of the *T* does make it sound like a kerning issue. Probably a kern between the space and the next letter, with the period being an innocent bystander, but the effect of that is as you describe.</p>
      <p>There are still a lot of space-kern problems in 2012. Adobe's Janson has such issues -- the sum of the kerning in the string *f_space_quotedblleft* gives a result where the f becomes closer to the open quotes than the quotes to the following letter, even though there really is a space in the text.</p>
      <p>If this is professionally set, mark the proofs and tell the typesetter to fix it. If it isn't professionally set -- now you know why there are "real" typesetters.</p>
      <p><cite>Edit</cite></p>
      <p>By the way, I think your instincts about ITC Garamond are spot on. It is a bit of a joke around the type community I inhabit -- though that's admittedly the stogy book world. We think of it as an advertising face, best suited for, say, fast food placemats, where it was actually used . . . McDonald's, maybe?</p>
