    <p>Back in September I thought about learning Cyrillic and I needed a typeface to dig into. <a class="freelinking external" href="http://theleagueofmoveabletype.com/league-gothic" rel="nofollow">League Gothic</a> seemed a rather straightforward to draw, so I’ve made this Cyrillic cut and left it forgotten. Now I've dusted off the work and here it is, the League Gothic Cyrillic.</p>
    <p>I’m not a native Cyrillic reader. I’ve looked into basic calligraphy and analyzed a bunch of different typefaces, but of course that’s still just <a class="freelinking external" href="http://twitter.com/gerryleonidas/status/159779909294768128" rel="nofollow">‟a clueless tourist attempt”</a>. If this indeed were to be merged into the project, it would really need to be decent. Make it a tough critique. Thanks a lot.</p>
    <p><img src="http://typophile.com/files/LeagueGothicCyrillicSample.png"></p>
