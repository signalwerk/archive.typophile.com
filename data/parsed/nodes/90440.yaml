      <p>@Rolek, Congratulations on your attempt , it seems pretty well done! </p>
      <p>About your concerns of the shape of some letters:<br>
      - about -Л- and -Д- and triangular shapes or not - long story short - both are correct, but the so called "rectangular" shapes are preferred in Russia, and "triangular" are preferred in Bulgaria and Ukraine (as far as I know). The difference has historical roots, and has a stylistic aspect also... but nowadays I consider it more a personal preference and commercial targeting - it is often wise to make the "classic Russian" type your "main Cyrillic" and if it suits the typeface, to put "triangular" as alternates.</p>
      <p>- ascenders in some of lowercase glyphs (if you are looking for reference in my "bulgarian cut" of Myriad Pro), meaning that -к-, -ж-, -ю- have ascenders - is typical Bulgarian - it also has historical and stylistic roots - so it's wise (commercially) to implement these only as alternates :)</p>
      <p>- same goes to a strange lovercase -в- and -б- , triangular lovercase -л- and -м-, -п- looking like based on latin -n- and -и-,-й-,-ш-,-щ- based on latin -u-...</p>
      <p>Do not misunderstand me... I consider both ways of implementing Cyrillic as correct, just have a personal preference to Bulgarian Cyrillic, because I find that it is more "in tone" with it's Latin counterpart, thus keeping the overall style of the typeface  - on the other hand "Russian style Cyrillic" has far bigger market and many defenders - so it's better to keep making Cyrillic that way....</p>
