      <p>Ivan, those are really interesting thoughts. I once came across a <a class="freelinking external" href="http://karandash.eu/study-myriad-bulgarian-cut/" rel="nofollow">remake of the Myriad Pro’s Cyrillic</a> from a Bulgarian designer Vassil Kateliev and it answers the concerns of the letters Д and Л you’ve just raised. Now I see you have Bulgarian background too; are you sure those issues are not related to this so-called Bulgarian cut alone? I’ve seen cases of both cursive and italic styles of Russian Cyrillic that indeed had those letters based on a triangle, but still can’t quite recall any upright ones.</p>
      <p>In regard to the form of a lowercase ф, I’m curious if it has something to do with a particular style of a typeface. I mean, is it possible that condensed grotesques like ParaType’s Hermes mentioned above deliberately have the letter ф with two distinct bowls as opposed to single one in a humanist face like Myriad, for example?</p>
