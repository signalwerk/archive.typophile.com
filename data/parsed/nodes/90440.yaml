      <p>Great work Grzegorz, League Gothic is one of my favourite fonts and I'm really happy to see that someone made the effort to cyrillise it! </p>
      <p>I just want to add some details about cyrillic characters as a native speaker. Hope that can be of any help to you and everyone else who is interested. Unfortunately most of the cyrillic examples which can be found in OSs and even Pro fonts are not very good.</p>
      <p>Some of the main problems usually are with the letters Д, Л, Ф. Д and Л should actually be based on a triangle, more like the letter A. The rectangular shape is also considered correct but in many cases it's not very legible due to the big resemblance to П. </p>
      <p>Your first version of the Ф was actually more accurate in my opinion. It should be like an O cut in two halves and the stem added between them.</p>
      <p>The greatest problem though is with lowercase forms. As in latin there are actually different forms derived from handwriting. In most typefaces lowercase is just made to resemble the uppercase, and the result is something like small caps. </p>
      <p>Here are a few examples of very beautiful cyrillic fonts with proper lowercase so you can see what I mean.<br>
      <a class="freelinking external" href="http://sdrv.ms/TCNNix" rel="nofollow">http://sdrv.ms/TCNNix</a></p>
      <p>You can also look at this site <a href="http://www.hermessoft.com/" title="http://www.hermessoft.com/">http://www.hermessoft.com/</a> for other examples. There are very comprehensive specimens of different typefaces.</p>
