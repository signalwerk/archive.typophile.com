      <p>It was my intent to make the lowercase <em>б</em> turn-up subtle, but it indeed gets lost entirely, especially on screen, where it's mainly expected to be used, after all. Similarly with both <em>Д</em> and <em>Л</em>, but I can't quite imagine how this could be worked out at such compression.</p>
      <p>Fusing two bowls for lowercase <em>ф</em> seemed to me like cheating at first, but now I've dug this further and it seems you're right, Kevin. Simply merging <em>d</em> with <em>p</em> still feels too barbaric to me, but it definitely has to be some form of two distinct bowls. It’s the Greek lowercase <em>φ</em> in which a single bowl is more adequate, I suppose.</p>
      <p>Thanks for your feedback! There are few really useful resources to be found at <a class="freelinking external" href="http://cyreal.org/" rel="nofollow">Cyreal</a>, I’ll check that later.</p>
