    <p>I'm trying to export a six-layered font from FontLab Studio, but the .otf files are doing strange things in Illustrator. I don't know if I have missed something in the Font Info window in FontLab, or if it's an Illustrator setting I've overlooked (but I've tested the beta version on several computers now and the problem persists).</p>
    <p>The font has 6 layers. 3 of them stack perfectly on top of each other when pasted in place. The other 3, however, do not. As illustrated in the screenshots here, one layer (Eclisse) sets itself a fraction higher than the baseline; one layer (Tonale) sets its baseline noticeably higher than it is supposed to; and one layer (Inline) sets its baseline significantly higher still.</p>
    <p>When I highlight this text and change it back to one of the other, properly-working layers, the baselines align perfectly, so I haven't just accidentally nudged the text box. I've been right through the Font Info panels in FontLab and can't for the life of me work out why this problem could be happening.</p>
    <p>Any help or guidance would be greatly appreciated!</p>
