      <p>That was what I was going to ask. Particularly regarding vertical metrics. For each vertical metric, you should set all the fonts in the family to the largest value from any member font. That will likely resolve the problem.</p>
      <p>If not, get in touch with FontLab support and they would be happy to help sort it out.<br>
      <a href="http://www.fontlab.com/contact-and-support/product-support/problem-report/" title="http://www.fontlab.com/contact-and-support/product-support/problem-report/">http://www.fontlab.com/contact-and-support/product-support/problem-report/</a></p>
