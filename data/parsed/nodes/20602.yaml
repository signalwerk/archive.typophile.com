    <p>OK. This is a rather big challenge, further complicated by the fact that I can't find a representative image online, but here goes...</p>
    <p>I'm hoping someone can give me an exact match for the heavy sans serif typeface used in the original title sequence to Jacques Demy's film, "Les Parapluies de Cherbourg."</p>
    <p>NOTE: This is /not/ the same face used in posters or packaging (whether vintage in the original French or translated later into English as "The Umbrellas of Cherbourg"). The title sequence may in fact be handlettered, but I suspect it is based upon some grotesk that we may all know. I haven't been able to get stills from the sequence into my system yet, but until then, here's a quick (albeit small) sample:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/umbrellascherbourg01_3744.gif"></div><p></p>
    <p>I hope someone will be familiar enough with this classic to help me (or will have the DVD in his/her collection).</p>
    <p>Sorry if this is a stumper...</p>
    <p>--Michael.</p>
