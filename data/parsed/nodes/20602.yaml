    html: |-
      <p>I couldn't find a reference on title credits for the original film other than Bernard Evein, Production Design/Art Director from <a href="http://www.imdb.com/title/tt0058450/fullcredits" target="new" rel="nofollow">IMBd</a> database. If someone has the video or DVD, they could run through the credits.</p>
      <p>IMHO -- Roger Excoffon was still very much alive and active during the production of the film in 1964, and I can't imagine the producers not "tipping the hat" to or not directly consulting someone as well known and respected in France as Mr. Excoffon.</p>
      <p>That leads me to speculate that the film title may have been done from a modified version of Antique Olive (Nord), specifically customized for film, as it visually reads and repros differently from print. It was easy enough in those days to create a filmstrip font for a photo headliner machine, so a custom photo font for optical titling is my best guess.</p>
      <p>It may also account for the variations in print titles and posters, as Mr. Excoffon (if he did it), or the person who actually designed it, had only one specific application using the only font created. If your sample of the film's title was the only occurence of that face, then I would say it could have been produced as a one-off by hand. But if the rest of the credits used the face, then it was produced as a customized filmstrip for a photo-headline device. That's my best guess.</p>
