    html: <p>i like the colors. they are very soft and sympathic.  <br> <br>if you're printing the backside of your sheet, the negative wouldn't work well, because you will see a shadow of the front-side-logo. what do you think of punching or lasering it out. or you might try to flip the logo. <br> <br>your logo "wdp" is quite rough. i think to rough for the layout and colors. <br> <br>i personally dislike folded business-cards because there are a bit unpractical. <br> <br>can you make a sample-letter with text? blanc letters are difficult to comment because you'll never send a blanc letter. <br></p>
