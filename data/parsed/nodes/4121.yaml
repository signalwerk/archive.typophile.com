    html: <p>the reason for the dots is becase i would like to have a more interesting visual element in my identity system. a purely typographic solution wouldve worked but that wouldve definetly pushed it more towards the technical and cold direction you were talking about. im a fan of minimal design and grid systems. its the kind of design i like to do most and hopefully i can continue to work on those type of projects with my future clients.</p>
