    date: 2003-02-10T18:27:00
    date_raw: 10 Feb 2003 — 6:27pm
    votes: null
    html: "<p>It's interesting, Tiepolo looks like a clone of Hiroshige (by Hollandsworth, now Batty), and was made by Richard Baker, the same guy who made Hiroshige Sans in 1986, the same year - in fact the same year as the original Hiroshige! I smell something. It's like they made a version they could sell themselves, and a version they could sell to ITC... <br> <br>Also note that there seem to be different versions of just Hiroshige: MyFonts shows one with slabby serifs, others with flaring ones, and even one with possibly something in between! <br> <br>So the sample actually looks a lot like both Hiroshige Sans and Tiepolo, which both have a closed \"P\", unlike Hiroshige... although you'll note that that \"P\" was modified <i>anyway</i>, so... The \"E\" I'd have to look again. <br> <br>hhp <br></p>"
    html_clean: "<p>It's interesting, Tiepolo looks like a clone of Hiroshige (by Hollandsworth, now Batty), and was made by Richard Baker, the same guy who made Hiroshige Sans in 1986, the same year - in fact the same year as the original Hiroshige! I smell something. It's like they made a version they could sell themselves, and a version they could sell to ITC... <br> <br>Also note that there seem to be different versions of just Hiroshige: MyFonts shows one with slabby serifs, others with flaring ones, and even one with possibly something in between! <br> <br>So the sample actually looks a lot like both Hiroshige Sans and Tiepolo, which both have a closed \"P\", unlike Hiroshige... although you'll note that that \"P\" was modified <i>anyway</i>, so... The \"E\" I'd have to look again. <br> <br>hhp <br></p>"
  - id: 58952
