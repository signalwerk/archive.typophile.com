    date: 2003-02-11T09:15:00
    date_raw: 11 Feb 2003 — 9:15am
    votes: null
    html: "<p>I agree there are very subtle differences and smells of some liscense trickery. However, I believe the sample provided is in fact Tiepolo (at least that's what my helmet tells me). The reason being the P. In Hiroshige sans, the E is indeed the same as Tiepolo, but the P is not closed as you indicated above, while it is in Tiepolo and in the sample. The sample is not large enough to detect any discernable difference in the other letter forms: <br> <br>Hiroshige Sans <br><a href=\"http://www.myfonts.com/fonts/glyph/hiroshige-sans/hiroshigesansbook/testdrive.html?s=PARK%2BEAST&amp;p=96\" target=\"_blank\">http://www.myfonts.com/fonts/glyph/hiroshige-sans/hiroshigesansbook/testdrive.html?s=PARK+EAST&amp;p=96</a> <br> <br>Tiepolo <br><a href=\"http://www.myfonts.com/fonts/linotype/itc-tiepolo/book/testdrive.html?s=PARK%2BEAST&amp;p=96\" target=\"_blank\">http://www.myfonts.com/fonts/linotype/itc-tiepolo/book/testdrive.html?s=PARK+EAST&amp;p=96</a> <br> <br>ITC-Tiepolo <br>I move to add an (x) on this one. <br>Does anyone second the motion? <br> <br>R</p>"
