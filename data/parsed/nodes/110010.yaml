  html: |-
    <p>This font may be a version of <a class="freelinking external" href="http://en.wikipedia.org/wiki/Garamond" rel="nofollow">Garamond</a> or (more likely) <a class="freelinking external" href="http://en.wikipedia.org/wiki/Cheltenham_%28typeface%29" rel="nofollow">Cheltenham</a>, but I haven't been able to locate a version of either of these fonts that matches the samples I've seen "exactly" (although the version used in the type specimen on the Cheltenham Wikipedia page seems quite close).</p>
    <p>Here's a sample (from an ad for a lawn tractor):<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Example of font used in many 80s print ads 2_6147.png"></div><p></p>
    <p>Any suggestions (or, ahem, definitive answers) would be appreciated.</p>
    <div class="field field-type-text field-field-solved">
          <div class="field-label">Font:&nbsp;</div>
        <div class="field-items">
