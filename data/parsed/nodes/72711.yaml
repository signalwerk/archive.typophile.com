    html: |-
      <p>Mandatory is an amateur digitization of the UK  car number plate typeface. A cleaner, well-done version is <a href="http://www.liquitype.com/workshop/type_design/cp-mono" rel="nofollow">CP Mono</a> by <a href="/wiki/Tino%20Meinert" class="freelinking" rel="nofollow">Tino Meinert</a>. It comes in 5 weights and is, despite its good quality, free as well. See <a href="http://typophile.com/node/27362" rel="nofollow">this thread</a> for more license plate type. </p>
      <p>Frode already mentioned Lineto. They also have <a href="http://www.lineto.com/The+Fonts/Custom+Typefaces/Alpha+Headline/" rel="nofollow">Alpha Headline</a>. It comes in 4 weights, but is available only ‘at the end of 2012’.<br>
      Lorenzo Geiger’s <a href="http://lorenzogeiger.ch/#11" rel="nofollow">Trans-Am</a> is similar.</p>
      <p>See also the fonts by <a href="http://www.binnenland.ch/" rel="nofollow">Binnenland.ch</a>; Blender, T-Star and Regular, maybe FRAC.<br>
      For a more angular direction, check out <a href="http://www.houseind.com/fonts/unitedcollection" rel="nofollow">House United</a> – styles aplenty. Only one weight, but nevertheless 12 styles: <a href="http://new.myfonts.com/fonts/suitcase/vafle/?refby=mfde" rel="nofollow">Vafle</a> by <a href="/wiki/Tom%C3%A1%C5%A1%20Brousil" class="freelinking" rel="nofollow">Tomáš Brousil</a></p>
    html_clean: |-
