    <p>Hello,</p>
    <p>Wondering what fonts you recommend that are between:</p>
    <p><a href="http://www.dafont.com/mandatory.font" title="http://www.dafont.com/mandatory.font">http://www.dafont.com/mandatory.font</a></p>
    <p>AND</p>
    <p><a href="http://www.imdb.com/media/rm2471790592/tt1152836" title="http://www.imdb.com/media/rm2471790592/tt1152836">http://www.imdb.com/media/rm2471790592/tt1152836</a></p>
    <p>Ideally its not another free font, would like something a little more pro. I really like Mandatory but it only has one weight.  Perhaps its built off of (or stolen from) another font?</p>
    <p>Thanks Guys,<br>
    Peter.</p>
