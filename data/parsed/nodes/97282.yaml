    <p>Hi guys,</p>
    <p>Just wanted to let you know about the 2nd edition Print Handbook. It might be the sort of thing you find useful. Each order now comes with a digitally printed sheet so you can compare offset to digital printing.</p>
    <p>Take a look: <a href="http://www.printhandbook.com" title="http://www.printhandbook.com">http://www.printhandbook.com</a></p>
    <p>Plus, here are a few freebies too: <a href="http://dl.dropbox.com/u/91438316/PHFreebies02.zip" title="http://dl.dropbox.com/u/91438316/PHFreebies02.zip">http://dl.dropbox.com/u/91438316/PHFreebies02.zip</a></p>
    <p>Andy</p>
