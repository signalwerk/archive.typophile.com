      <p>I'm seeing lowercase s (or &amp;), capital E, then O with a flourish (instead of C). An alternate capital S would work, where everything from the left-side beginning of the S to the dotted blue line is simply removed. </p>
      <p>Then maybe the bottom of the C terminates a little lower so it's less like an O. The little swirl on the lowercase o is fine. I'd like to see more contrast between thick and thin strokes.</p>
