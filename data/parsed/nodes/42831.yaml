    <p>Funny, I could swear that I posted a quite lengthy answer to a question about writing “100%” in Korean just hours ago. Now, I cannot find a trace of the thread, in my own trackback or anywhere on Typophile.</p>
    <p>I think I might be responsible for the disappearance of the thread, because of a followup post where I unthinkingly used the ’less than’ sign a few times, thereby messing up the html tags of the page. Or it might be a simple database glitch, unless someone has deliberated erased the thread.</p>
    <p>For the record, two equally valid ways to write 100% in Korean are:</p>
    <p>백 퍼센트 (<em>baek peosenteu</em>; from “percent”) and 백 프로 (<em>baek peuro</em>; from “pro”)</p>
