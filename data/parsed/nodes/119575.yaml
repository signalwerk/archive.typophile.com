    html: |-
      <p><strong><a href="http://Nissan AG Condensed Bold" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Nissan AG Condensed Bold</a></strong> by Berthold looks like an exact match, but I think this font is not available anymore.<br><strong><a href="http://Akzidenz Grotesk Cond (Bold)" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Akzidenz Grotesk Cond (Bold)</a></strong> is also an exact match except of /R.<br>
      There was an old version of Akzidenz Grotesk Condensed Bold with a straight /R leg but I can't find it anymore.<br>
      You can try to embolden the Akzidenz Grotesk Condensed (not Bold) which still has a straight leg, but I don't know how close it would be to your sample.</p>
    html_clean: |-
      <p><strong><a href="http://Nissan AG Condensed Bold" title="Click to visit an external URL." class="freelink freelink-external freelink-external link-external">http://Nissan AG Condensed Bold</a></strong> by Berthold looks like an exact match, but I think this font is not available anymore.<br><strong><a href="http://Akzidenz Grotesk Cond (Bold)" title="Click to visit an external URL." class="freelink freelink-external freelink-external link-external">http://Akzidenz Grotesk Cond (Bold)</a></strong> is also an exact match except of /R.<br>
      There was an old version of Akzidenz Grotesk Condensed Bold with a straight /R leg but I can't find it anymore.<br>
      You can try to embolden the Akzidenz Grotesk Condensed (not Bold) which still has a straight leg, but I don't know how close it would be to your sample.</p>
