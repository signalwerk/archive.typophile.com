    votes: null
    html: |-
      <p><strong><a class="freelinking external" href="https://web.archive.org/web/20141113051713/http://www.findmyfont.com/index.php/fonts/font-preview?fset=Berthold&amp;ffam=NissanAG%20Cnd%20-%20Bold&amp;fid=42a9c0905df2a779ddbfa9103dabec12&amp;fsize=60&amp;text=HUMANS%20OF%20NEW%20YORK&amp;wrap=2" rel="nofollow">Nissan AG Condensed Bold</a></strong> by Berthold looks like an exact match, but I think this font is not available anymore.<br>
      <strong><a class="freelinking external" href="https://web.archive.org/web/20141113051713/http://www.findmyfont.com/index.php/fonts/font-preview?fset=Berthold&amp;ffam=AkzidenzGroteskBQCond%20-%20Bold&amp;fid=178081502d7c3eb6ddcb37792925bd8a&amp;fsize=60&amp;text=HUMANS%20OF%20NEW%20YORK&amp;wrap=2" rel="nofollow">Akzidenz Grotesk Cond (Bold)</a></strong> is also an exact match except of /R.<br>
      There was an old version of Akzidenz Grotesk Condensed Bold with a straight /R leg but I can't find it anymore.<br>
      You can try to embolden the Akzidenz Grotesk Condensed (not Bold) which still has a straight leg, but I don't know how close it would be to your sample.</p>
    html_clean: |-
      <p><strong><a class="freelinking external link-external" href="https://web.archive.org/web/20141113051713/http://www.findmyfont.com/index.php/fonts/font-preview?fset=Berthold&amp;ffam=NissanAG%20Cnd%20-%20Bold&amp;fid=42a9c0905df2a779ddbfa9103dabec12&amp;fsize=60&amp;text=HUMANS%20OF%20NEW%20YORK&amp;wrap=2" rel="nofollow">Nissan AG Condensed Bold</a></strong> by Berthold looks like an exact match, but I think this font is not available anymore.<br>
      <strong><a class="freelinking external link-external" href="https://web.archive.org/web/20141113051713/http://www.findmyfont.com/index.php/fonts/font-preview?fset=Berthold&amp;ffam=AkzidenzGroteskBQCond%20-%20Bold&amp;fid=178081502d7c3eb6ddcb37792925bd8a&amp;fsize=60&amp;text=HUMANS%20OF%20NEW%20YORK&amp;wrap=2" rel="nofollow">Akzidenz Grotesk Cond (Bold)</a></strong> is also an exact match except of /R.<br>
      There was an old version of Akzidenz Grotesk Condensed Bold with a straight /R leg but I can't find it anymore.<br>
