    <p>The Vtg Stencil series of fonts from astype are based on real world stencils. The UK No. 76 design was derived from authentic stencil plates from Great Britain from the 1960's and 1970's. The fonts are avilable at <a class="freelinking external" href="http://www.myfonts.com/fonts/astype/vtg-stencil-uk-no-76/?refby=as" rel="nofollow">myfonts</a>, <a class="freelinking external" href="http://www.fontspring.com/fonts/astype/vtg-stencil-uk-no76" rel="nofollow">fontspring</a>, <a class="freelinking external" href="http://www.fontshop.com/fonts/family/vtg_stencil_uk_no_76/" rel="nofollow">fontshop</a> and <a class="freelinking external" href="http://www.astype.de/font_v_vtg_stencil_uk_no76.php?fontname=vtgstencilukno76" rel="nofollow">astype</a>.</p>
