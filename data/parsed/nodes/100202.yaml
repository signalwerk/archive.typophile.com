    <p>Monotype Imaging Holdings Inc. has announced the commercial launch of its <a class="freelinking external" href="http://typecast.com/ " rel="nofollow">Typecast</a>™ application, a browser-based tool for designing Web pages with Web fonts. </p>
    <p>The Typecast application launches commercially after a year and a half in private and public beta programs, bringing the design community a tool that helps to save time and create better quality Web typography.</p>
    <p>Typecast lets Web designers combine, compare and style Web fonts quickly without performing screen captures in third-party applications or through hand coding. Users are able to visually style text directly within the browser, which offers more scope for creative experimentation, better typographic control and a simplified workflow. As designers work, Typecast generates production-ready HTML and CSS code behind the scenes. When designers are ready to start building their sites, they can export that HTML and CSS, plus generate embedded code that will serve their project’s typefaces to their site.</p>
    <p>Designers can set styles such as font size, line spacing and coloring, and also apply OpenType® features such as ligatures, small caps, fractions, lining and old style figures, and swash characters. Designers are able to try fonts on real, full-length project content, not just short snippets. Using side-by-side comparison and testing, designers can see at a glance what’s working and what’s not. Styles can be adjusted across entire projects with just a few clicks. </p>
    <p>Typecast is available at four subscription levels, each with monthly, yearly and tri-yearly billing options. Prices start at $29 per month for an individual plan, and all plans include a free standard subscription to <a class="freelinking external" href="http://www.fonts.com/web-fonts " rel="nofollow">Fonts.com Web Fonts</a> worth $10 per month, enabling Typecast subscribers to use more than 20,000 Web fonts on their live sites. Typecast is available as a free trial for 14 days.</p>
    <p>Typecast allows designers to experiment with fonts from Typekit®, Fontdeck®, Webtype® and Google® Web Fonts as well as Monotype’s <a class="freelinking external" href="http://www.fonts.com/web-fonts " rel="nofollow">Fonts.com Web Fonts</a>, which features thousands of typefaces, including timeless classics such as the Trade Gothic®, Avenir® and ITC Avant Garde Gothic® families, as well as cutting-edge designs and hand-tuned fonts. </p>
    <p>Further information about <a class="freelinking external" href="http://typecast.com/ " rel="nofollow">Typecast</a>, including a <a class="freelinking external" href="http://typecast.com/experiment-with-type/play#home-link " rel="nofollow">video</a> that details the application, is available at <a href="http://typecast.com" title="http://typecast.com">http://typecast.com</a>, where visitors can also view customer videos from <a class="freelinking external" href="http://typecast.com/customers/happy-cog " rel="nofollow">Happy Cog</a>, one of the world’s most respected design agencies, and international publishing company <a class="freelinking external" href="http://typecast.com/customers/conde-nast " rel="nofollow">Condé Nast</a>, which used Typecast to redesign vogue.co.uk.</p>
    <p>A public beta program for Typecast began one week prior to Monotype’s Oct. 30, 2012 acquisition of Design by Front Limited, the company behind the Typecast application. The product continues to be developed from Belfast, Northern Ireland, where Monotype now holds an office.  </p>
    <p>About Monotype<br>
    Monotype is a leading global provider of typefaces, technology and expertise that enable the best user experience and ensure brand integrity. Based in Woburn, Mass., Monotype provides customers worldwide with typeface solutions for a broad range of creative applications and consumer devices. The company’s library and e-commerce sites are home to many of the most widely used typefaces – including the <a class="freelinking external" href="http://new.fonts.com/font/linotype/Helvetica " rel="nofollow">Helvetica</a>®, <a class="freelinking external" href="http://new.fonts.com/font/linotype/frutiger " rel="nofollow">Frutiger</a>® and <a class="freelinking external" href="http://new.fonts.com/font/linotype/univers " rel="nofollow">Univers</a>® families – as well as the next generation of type designs. Further information is available at <a href="http://www.monotype.com" title="www.monotype.com">www.monotype.com</a>.</p>
