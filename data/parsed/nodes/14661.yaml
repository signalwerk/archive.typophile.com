    <p>Hello.</p>
    <p>I'm a second year student currently studying BA Graphic Design. (I am soon set to enter my third year.) I am on the look out for as much experience as possible, and would preferably like to spend some time in the US upon graduation, in July of next year. I would love to gain some sort of work experience, placement, or internship. </p>
    <p>I would be grateful for anyone to offer any advice on how to achieve this, be it types of companies to contact, times of the year to contact them, and such.</p>
    <p>Regards,</p>
    <p>Matt.</p>
