    html: |-
      <p>Have you researched the visa issues? As a UK citizen I did an internship in the US in 1995, and at that time there were new rules that seemed to require that an intern on a J1 visa had to return to education. So "after graduation" may preclude you automatically. Sadly my company stopped accepting non-US interns a few years back, and I wouldn’t be surprised if other US companies have done so as well, esp post 9/11 as dealing with the INS has become more difficult.</p>
      <p>Having said that my sister managed to get a year admin placement at a New York animation house through the Mountbatten exchange program in the UK. <a href="http://www.mountbatten.org/" title="http://www.mountbatten.org/">http://www.mountbatten.org/</a></p>
      <p>I think they avoid the return to education requirement by having an education element (evening classes) during the placement. </p>
      <p>Cheers, Si</p>
