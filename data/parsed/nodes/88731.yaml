  html: |-
    <p>Happy New Year, everyone!</p>
    <p>I'm searching for the font the NFL and the Packers use for some promotional items. </p>
    <p><img src="http://a1.sphotos.ak.fbcdn.net/hphotos-ak-ash4/404916_10150469633275073_71671905072_8935558_1780370767_n.jpg"></p>
    <p>I also included another file for further clarification.</p>
    <p>Here's what I've got so far... Dispatch is pretty darn close. I'm assuming it's a custom version of Dispatch? Look at the E and C, they are both different, while most other glyphs are spot on. The C is critical for my researching purposes, that's the only reason why I'm not going to purchase Dispatch. I don't like how hard the counter-form is. </p>
    <p>I might have to just customize it myself for this project but it would be nice to have a typeface to use where I don't have to alter characters. </p>
    <p>Thanks for any help!</p>
