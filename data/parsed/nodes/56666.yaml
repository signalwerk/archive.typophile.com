    <div class="info">Submitted by <a href="/user/13181" title="View user profile.">Ivo</a> : 6.Apr.2009 12.23am </div>
      <p>Spring gives life to a fresh bunch of <a href="http://www.fontfont.com/" rel="nofollow">FontFonts</a>. One of them is the comprehensive collection of modern pictograms in FF Dingbats 2.0. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ff_dingbats_500_3622.png"></div><p></p>
    <p>Designed back when <a href="http://www.fontshop.com/fonts/downloads/elsner_flake/zapf_dingbats_ot/" rel="nofollow">Zapf Dingbats</a> were the only symbols in font form, the FF Dingbats™ package was the first to illustrate modern communication, with some 800 images and icons of faxes, ISDN, disks, and keyboards. But the face of the tech world has changed significantly since the early ’90s. Floppy disks and cassette tapes have gone the way of the dinosaurs. So <a href="http://www.fontshop.com/fonts/designer/johannes_erler/" rel="nofollow">Johannes Erler</a> and <a href="http://www.fontshop.com/fonts/designer/henning_skibbe/" rel="nofollow">Henning Skibbe</a> have revisited FF Dingbats, redesigning it for the new modern age of flat panels and iPhones®.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ff-dingbats-20-490_6006.png"></div><br>
    <em>The old and the new FF Dingbats</em><p></p>
    <p><strong>What else is new in FF Dingbats 2.0? </strong><br>
    The style and finish of the pictograms is now consistent with today’s stylistic vocabulary. Arrow and number fonts have been reworked and extended. All symbols have been sorted into clear categories and the font “Strong Forms” font includes the most needed symbols with simpler, bolder lines. Also new in 2.0: quickly add color fills via an OpenType-powered <a href="http://ffdingbatsfont.com/glyph-set/index.html" rel="nofollow">layering feature</a>. All this makes <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_dingbats_20_ot/" rel="nofollow">FF Dingbats 2.0</a> a state-of-the-art font package again and the largest collection of contemporary symbols and icons for office communication.</p>
    <p>» Get a free Sampler font and learn more about FF Dingbats 2.0 OpenType at the new microsite <strong><a href="http://ffdingbatsfont.com/" rel="nofollow">FFDingbatsFont.com</a></strong></p>
