      <p>This is like any list based on stats, it shows what's popular, not really what's "Best," (even though the title states differently). Look at what's popular in music, a lot of garbage, and the real gems get discovered only by those in the know. I designed Zaner 1) because I loved the style and thought it deserved reviving in digital format and 2) because I thought it would sell well, as the masses buy scripts. I don't think the masses care as much about workhorse text faces, unfortunately. Welcome to the market economy.<br>
