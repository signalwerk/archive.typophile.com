    html: <p>I think this is a reflection of MyFonts' market position. It's the populist type site, presenting itself more to casual users than learned designers. Anyone not well versed in typography is going to take more to the overt uniqueness of a display face than the subtleties in design and craftsmanship of a great text face. (Just went through this advising my old college newspaper on their redesign... tried to explain why Adobe Jenson is not the best choice for a newspaper.) Plus, non-designers tend to think more in terms of individual elements than the whole picture, meaning they may see more conservative text fonts as boring, while designers visualize the same font in context as rich and expressive. I'm sure that if you looked at other resellers, they'd have totally different bestsellers.</p>
