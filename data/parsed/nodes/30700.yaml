      <p>Colin, Myfonts has a multiple personality. As part of being e-populist, it is an exemplary Long Tail company, meaning that most of its sales come from most of its products, not the few best sellers. So on the one hand, it hypes its big hits in the de rigueur dumbarse manner, but at the same time it makes a huge quantity of fonts from hundreds of foundries available. There's quality there, of all kinds, to satisfy typographers with the most exquisitely recondite taste.</p>
      <p>Myfonts also has some of the best (and no doubt most used) font info and font previewing mechanisms around, for its savvy clientelle.</p>
