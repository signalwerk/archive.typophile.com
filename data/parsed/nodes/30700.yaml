      <p>I had thought for some time that grunge is a bit of a misnomer because it's a little too all-inclusive. I have an "Antiquated &amp; Distressed" category in FontExplorer that is quite different from most grunge fonts. One font I use from time to time is Caslon Antique, it looks slightly weathered/distressed to my eyes, but it doesn't strike me as grunge at all. </p>
      <p>I think part of why grunge fonts are so popular is that they are a quick means of getting some personality/attitude in a project for those not having the talent or time to do it by hand (or mouse).</p>
      <p>Not that I'm always thrilled to use them, but some customers of mine are really hot on them so I can't avoid them entirely. Most of the time I can take an existing "normal" font and add my own "grunge" to it, generally the results are better, I have more control, it's a compromise I can live with.</p>
