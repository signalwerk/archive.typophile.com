      <p>I think that there are obvious differences between distressed type, type that looks like it was printed hundreds of years ago, and grunge. I can really dig the first two, but to me grunge still just looks gross, no matter how much thought and craft went into designing it. I think of grunge type as the type that came out of the 1990s rock music scene, stuff that's really been manipulated to just look dirty and ugly. It was certainly appropriate for that context—most of the music was commercial crap that sounded dirty and ugly, as was much of the music journalism—but now I just wish that grunge type would disappear like the bands of that era did. </p>
      <p><cite>I think part of why grunge fonts are so popular is that they are a quick means of getting some personality/attitude in a project for those not having the talent or time to do it by hand (or mouse).</cite></p>
      <p>I see a lot of that. A designer hasn't got a good idea, or doesn't want to put time into something, so she just slaps a nice photo on a page and sets the type in Guilty at a precarious angle. Two hours later she's trying to pass the design the design off as dynamic and edgy.</p>
