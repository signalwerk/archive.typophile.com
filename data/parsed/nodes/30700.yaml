    <p>"With each new year, we reflect on the great fonts that appeared on MyFonts during the previous year. In this newsletter we present to you the best fonts from the top ten font design styles of 2006: best text font, retro font, ornament font, techno, Roman, formal script, handwriting, brush script, grunge, and calligraphic fonts. To keep things fair, we let you—the customer—be the ultimate judge of results by using sales numbers to decide each winner. Thank you for putting together such a nice list!"</p>
