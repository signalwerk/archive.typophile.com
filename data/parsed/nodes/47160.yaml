    <p><strong>UPDATE</strong> We're now taking pre-orders in the <a href="http://typophile.bigcartel.com/" rel="nofollow">Typophile Store</a>.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/typ_tee_winner_promo_2008_6741.jpg"></div><p></p>
    <p>After a heated battle and much deliberation the winning tee has emerged! SN Rajpurohit from Ahmedabad, India has won the contest with his subission <em>Light, Regular, Bold &amp; Bold Italic</em>. </p>
    <p>We don't expect the world to get it, and that's parf of the point. The tee will be printed on an American Apparel shirt in "Light Blue" with gray ink. Stay tuned for pre-order information.</p>
    <p>Satya will receive a copy of the mighty <strong><a href="/wiki/FontBook" class="freelinking" rel="nofollow">FontBook</a></strong> (A $99 USD value, thanks to FontShop!) and a $100 gift certificate to <a href="http://www.threadless.com" rel="nofollow"><strong>Threadless</strong></a>, (thanks Skinnycorp!).</p>
    <p>Thank you for the <a href="http://typophile.com/typophile_tee_contest_2008" rel="nofollow">hundreds of entries</a>. We had a difficult time judging them all.</p>
