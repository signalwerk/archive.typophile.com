    html: <p>Kenn, it has been built and opens today. The image is a press one, and so is primped somewhat! <br> <br>John, I think it was very brave of them to try this, and using Romano-Celtic lettering on such a monumental and central scale on a building who's focus is the literary tradition of Wales seems fitting and amusing - at least, to me. I'm not sure I see it as aping any more than modern-day typographers "ape" any of those in the past. Whether it is the world's best example typographically speaking is of course debatable - for example, some of the spacing has been compromised in order to maintain structural integrity of the building. <br> <br>Then again, you know an awful awful lot more about type than I <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
  - id: 53169
    user_id: 1262
    user_name: John Hudson
    user_path: null
    date_raw: 26 Nov 2004 — 5:44am
    date: 2004-11-26T05:44:00
    votes: null
    html: "<p>The issue I have with it is one of scale and appropriateness to the structure of the building, which is massive and, from the pictures I've seen so far, overbearing in a very literal way. These are letterforms that belong at a smaller scale: they are intimate, not monumental. This is why I think it looks like a pastiche (and very much a pastiche of David Jones' quite personal lettering, rather than a new interpretation of his historical inspiration). So to me it looks like something that has been done by someone who doesn't really understand what is in his hands. And this is confirmed by their website, because on <a href=\"http://www.wmc.org.uk/index.cfm?method=building.inscription\">this page</a> there is an image that is captioned <i>Romano Celtic Heritage</i>. This is a detail of David Jones' inscription that begins 'Cara Wallia derelicta...' (a poster of which is sitting about two metres to my right as I type this), made in London c.1959. Many of the letterforms on the new building appear to have been copied directly from this inscription. The original, by the way, is in black and green, not the red seen on the website. <br> <br>You'd think they would at least credit him -- a major Welsh artist --, rather than trying to pass of his unique work as some kind of generic ancient heritage.</p>"
