    html: <p>I almost regret the original posting. Almost. <br> <br>I'm glad that John made his comments on David Jones (who I am ashamed to admit I know virtually nothing about - but feel the need to find out more), Sadly, it has now spoiled the design for me. <br> <br>Originally the design reminded me of a rather more human scale plaque outside the Glynn Vivian Art Gallery in my hometown of Swansea.  <br> <br>John, I was wondering what you think of it? I have got in contact with the gallery today and they tell me it is by Ieuan Rees, a calligrapher and graphic designer in Newport. I thought I would post it here for others to see. <br> <br><img src="http://www.typophile.com/forums/messages/30/54643.jpg" alt="glyyn vivian"> <br> <br>(Many many thanks to Peter B for keeping his emails for so long, without whom the photo would have been lost to the ancient god of broken powerbooks)</p>
