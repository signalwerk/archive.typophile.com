  html: '<p>Today sees the launch of about $170m worth of national art center in Cardiff, the capital of my country. The architecture comprises of locally approporiate materials such as Welsh slate (arranged to mimic south Wales cliff faces) and copper, along with the usual glass and steel so beloved of modernism. <br> <br>Whats really interesting though is the backlit inscription over the copper entrance. Here is a photo at night: <br> <br><img src="http://www.typophile.com/forums/messages/30/54417.jpg" alt="architectural inscription"> <br> <br>(The Welsh part of the inscription is not, as many will assume, a translation of the English. It reads "creating truth like glass from the furnace of inspiration") <br> <br>Geek note: Ff is one of the 29 letters of the Welsh alphabet, that comprises of a, b, c, ch, d, dd, e, f, ff, g, ng, h, i, j, l, ll, m, n, o, p, ph, r, rh, s, t, th, u, w and y.</p>'
