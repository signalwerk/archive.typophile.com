    date: 2004-11-26T18:58:00
    votes: null
    html: <p><i>I wonder why they coloured it red?</i> <br> <br>Looking again at the enlarged image <a href="http://www.wmc.org.uk/index.cfm?method=building.inscription">here</a>,  I can see a grid of fine lines through the lettering, and some distortions that suggest this is actually an application of Jones' inscription in tile someplace. I wonder where? So I expect the colouring was done as part of this earlier architectural application, presumably because the red made for a more striking image, or perhaps it matched the carpet...</p>
