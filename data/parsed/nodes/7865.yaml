      </p><hr size="0"><!--!-/quote-!--><p></p><!--!-quote-!--></blockquote>
      <p></p><p> <br> <br>I find the day time photo of the signage very exciting and appropriate. The letter forms give the appearance of being incised or debossed. The whole canopy/roof structure has the feeling of a massive cliff with incised lettering.The signage blends in with the background material therefore the copy can be used in monumental size with out being overbearing. <br>Hopefully we can get better daytime close up photos of the signage so we can see the details. <br> <br>The night photo of the signage fails miserably and is only a rendering so I would not put to much faith in the effect it creates. Hopefully they used as much sensitivity for the night time appearance as the daytime.  <br>The use of white copy on a dark background with that line spacing is terrible. Hopefully a real night shot will show the correct effect. <br> <br>Kosmo <br> <br><img src="http://www.typophile.com/forums/messages/30/54442.jpg" alt="day.jpg"> <br><img src="http://www.typophile.com/forums/messages/30/54443.jpg" alt="night.jpg"></p>
