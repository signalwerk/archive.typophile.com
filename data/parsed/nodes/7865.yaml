    date_raw: 29 Nov 2004 — 11:00am
    date: 2004-11-29T11:00:00
    votes: null
    html: "<p>Thanks for posting the image of the Ieuan Rees piece, David. I've not seen this before (I don't think I've been in Swansea since I was about eight years old). This is a nice piece: the density of the text is similar to Jones' work, but of course the lettering style is quite different and much more regularised: Jones never claimed to be a calligrapher, and considered his inscriptions as paintings not writings. What I particularly like about the Ieuan Rees carving is the white painted lettering, the blue of the slate, and the rise and fall of the lines of text: whitecap waves in Swansea Bay.</p>"
