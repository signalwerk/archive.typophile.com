    html: <p>David, yes, the colours in the National Library of Wales image are about right. The original inscription is in black and olive-green opaque water-colour, underpainted with Chinese white. Jones also worked over the outlines and counters with white paint. <br> <br>I'm not being pedantic. Basically, I think the use of this lettering on this building is a lie, from the failure to credit Jones to the terrible misunderstanding -- betrayal is not too strong a word -- of his vision. It is a form of historical fa</p>
