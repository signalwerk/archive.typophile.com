    html: |-
      <p><cite>"From the writing direction M’s first stroke is thinner by nature."</cite><br>
      Well it's nice that we can overcome that "nature". :-)</p>
      <p>There are a few low-contrast fonts that have thick "outer" and thinner "inner" strokes on the "M"; some Emigre fonts come to mind, like <a href="http://emigre.com/fontpage.php?SFaiWBol.html" rel="nofollow">Fairplex</a>, <a href="http://emigre.com/fontpage.php?PTriSB.html" rel="nofollow">Triplex Serif</a>, <a href="http://emigre.com/fontpage.php?SVisSLBlA.html" rel="nofollow">Vista Slab</a>, or <a href="http://emigre.com/fontpage.php?PChoSlB.html" rel="nofollow">Cholla Slab</a>. I've linked to the bold cuts because the contrast scheme is easier to see in them – it's not very strong, but the pattern is there.<br>
      BTW, sometimes (but not always) these same fonts also have a nontraditional contrast scheme on the "N" (with the diagonal being lighter than the stems).</p>
      <p>FWIW, for sans look at Bell Gothic/Centennial.</p>
