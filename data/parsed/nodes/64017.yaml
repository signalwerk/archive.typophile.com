      <p>Hrant,<br>
      don’t be so picky about my phrasing: i meant it is the traditional writing model that we practice that way since the Roman Capitalis Monumentalis. What’s wrong about it? If your M is wide enough you can cope with the four thin/thick/thin/thick strokes quite well. If it’s narrower there is nothing to prevent you from not following this writing model. I think however that a consistent writing direction should be coherent. So, basically it could go all the other way round, like in Frode’s post. But it has to look and feel right.<br>
      I might try that in a future design.</p>
