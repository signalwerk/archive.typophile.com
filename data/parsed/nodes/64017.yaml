    html: <p>I'm glad too see my question evoked some good conversation. The typefaces I'm looking for are indeed HI-contrast serifs, but where the first stroke is a thick one. The Emigre fonts mentioned are interesting, but the difference in contrast is too small to what I had in mind. Slab-serifs can actually get away with this quite easily, but where the contrast is higher, the convention is much harder to break.</p>
