      <p>Some examples of twisted M’s. Some of these were eventually made by using typefaces, but it seems that in all cases the M’s were twisted by people that did not have a clue on how to draw or mount an M.<br>
      <a href="https://www.flickr.com/photos/albert-jan_pool/galleries/72157639083877753/" title="https://www.flickr.com/photos/albert-jan_pool/galleries/72157639083877753/">https://www.flickr.com/photos/albert-jan_pool/galleries/72157639083877753/</a></p>
      <p>When you check my other galleries you’ll also find twisted A’s, upside down S etc. The only cases where flipping or other coarse ways of modifying the contrast (anything less subtle than Balance, M of ITC Mixage etc.) seems to make some sort of sense is in Art Deco lettering. Enjoy!</p>
