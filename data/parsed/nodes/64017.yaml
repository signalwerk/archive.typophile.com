    html: |-
      <p>I think this 'tradition' comes from baroque type design, as seen in typefaces like bodoni. These typefaces are based on geometry and drawing. Before that, the letters where based on the writing with a broad nipped pen. This means that both the 1st and the 4th stroke om the M have equal width.</p>
      <p>That typeces which break your aforementioned tradition look weird to your eyes is in my view purely because we are not used to seeing them, not because they are illogical or counterintintuitive. That said: type design is a notoriously conservative discipline, so there might not be too many typefaces around that break these unwritten rules.</p>
      <p>greetings Jeffrey<br>
      <a class="freelinking external" href="http://www.infraordinaire.com/wordpress" rel="nofollow">infraordinaire</a></p>
