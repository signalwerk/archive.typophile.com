      <p>In <a href="http://www.shinntype.com/artefact.html" rel="nofollow">Artefact</a> (1999), I used reversed stroke contrast as one means of deconstructing traditional chirographically-informed typography.<br>
      The "M" does indeed have "backward" stress.<br>
      IMO the type is perfectly legible en masse, despite its gnarliness.<br>
      It looks weird, weirder now than when released, I would hazard, because general taste today is more conservative than during the experimental fervor of the New Typography that accompanied the digital revolution--although by 1999 that was on the way out.</p>
    html_clean: |-
