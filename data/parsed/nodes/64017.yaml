      <p>&gt; What’s wrong about it?</p>
      <p>At the very least, it's arbitrary, hence anti-design. But actually, as I explained in my Mexico City talk (and over the past few years online) it's outright harmful* too: when you "paint" the black you cannot give the white the attention it needs (even if you really honestly want to). And reading relies on notan (the black-white harmony) not the black only. My old review of Legato might help explain this - the last one here:<br>
      <a href="http://typographica.org/000969.php" title="http://typographica.org/000969.php">http://typographica.org/000969.php</a></p>
      <p>* I'm talking about text[y] faces.</p>
      <p>hhp</p>
