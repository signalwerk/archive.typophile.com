      <p>I recently noticed that on the side of some of the Lindenmeyr Munroe (paper company) tractor trailers around here (CT, USA) that the <em>M</em> is backward. Their official logo does not have it like this.</p>
      <p>I had seen one zoom by the other day, and I thought I was imagining things. I recalled this thread and wondered if I was overthinking majuscule <em>M</em>s. But last night I came up behind one on the highway. I was slightly disappointed* to see it displayed correctly on the back. As I passed the semi, I took a look at the side. There it was: a five-foot high backwards <em>M</em>.</p>
      <p>* <em>Not because I think it should be backwards. More because I was <strong>so</strong> sure that it was backwards for that fleeting moment (no pun intended) it drove by me the first time...</em></p>
