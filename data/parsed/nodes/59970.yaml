    <p>Hi there<br>
    I'm working on a japanese version of an image book I designed<br>
    a year back. The english version uses Cronos Pro and ITC Giovanni<br>
    for the text. I would like to match the feel of the latin fonts.<br>
    But I'm afraid I'm going to use the wrong fonts<br>
    and it will be some sort of a japanese version of Comic Sans. Smile.</p>
    <p>Can anyone suggest japanese font to replace Cronos Pro and<br>
    Giovanni?</p>
    <p>Cheers</p>
