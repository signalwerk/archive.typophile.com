      <p>(1) <a href="http://store1.adobe.com/type/browser/P/P_1801.html" rel="nofollow">Kozuka Gothic</a> (小塚ゴシック) and <a href="" rel="nofollow">Kozuka Mincho</a> (小塚明朝) from Adobe<br>
      Adobe’s Kozuka Gothic and Kozuka Mincho are easy to get and have as a modern and warm feeling as Cronos has.</p>
      <p>(2) <a href="http://www.screen.co.jp/ga_product/sento/sample/hirg.html" rel="nofollow">Hiragino Kaku Gothic</a> (ヒラギノ角ゴシック) and <a href="http://www.screen.co.jp/ga_product/sento/sample/hirm.html" rel="nofollow">Hiragino Mincho</a> (ヒラギノ明朝)<br>
      Hiragino Kaku Gothic and Hiragino Mincho are loaded on Mac OSX. They were designed by <a href="http://www.jiyu-kobo.co.jp/home.html" rel="nofollow">Jiyukobo</a> (字游工房), which is one of the most respected foundries in Japan.</p>
      <p>(3) <a href="http://www.jiyu-kobo.co.jp/ytl/ygf.html" rel="nofollow">Yu Gothic-tai</a>(游ゴシック体) and <a href="http://www.jiyu-kobo.co.jp/ytl/ymf.html" rel="nofollow">Yu Mincho-tai</a> (游明朝体)<br>
      They are designed by Jiyukobo as well.</p>
      <p>(4) <a href="http://www.typebank.co.jp/english/fonts/gothic/" rel="nofollow">TypeBank Gothic</a> (タイプバンクゴシック) and <a href="http://www.typebank.co.jp/english/fonts/mincho/" rel="nofollow">TypeBank Mincho</a> (タイプバンク明朝)<br>
      TypeBank Gothic and TypeBank Mincho are well designed fonts.</p>
      <p>(5) <a href="http://www.morisawa.co.jp/font/fontlist/details/fontfamily008.html" rel="nofollow">Gothic MB101</a> (ゴシックMB101) and <a href="http://www.morisawa.co.jp/font/fontlist/details/fontfamily001.html" rel="nofollow">Ryumin</a> (リュウミン)<br>
      They are ones of the most frequently used font in Japan.</p>
      <p>Type Project’s <a href="http://www.typeproject.com/product/axis_basic/" rel="nofollow">AXIS</a> is also a nice sans serif font. AXIS doesn’t has the serif companion but Kozuka Gothic might be a good companion.</p>
