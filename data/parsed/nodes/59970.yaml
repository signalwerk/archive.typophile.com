      <p>Also consider the Ryo "PlusN" fonts, available as two serif families (Ryo Text PlusN and Ryo Display PlusN) and one sans serif (Ryo Gothic PlusN). These combine the kana and punctuation of the Ryo "Std" fonts, which were specifically tuned for readability, with the kanji and other glyphs from the Kozuka Mincho and Kozuka Gothic families.</p>
      <p>Roughly 70% of Japanese text is comprised of kana, so making the kana glyphs more readable increases overall readability.</p>
      <p>I believe that the Ryo PlusN fonts are bundled with the Japanese versions of the Creative Suite.</p>
