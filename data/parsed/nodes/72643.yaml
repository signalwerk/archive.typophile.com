  html: |-
    <p>Tímea Andorka a friend of mine re-designed 12 volumes of 'Mérleg könyvek' ('Balance Books'), a Hungarian book series publishing mainly essays in philosophy and aesthetics,  as part of her thesis in graphic design. I thought this might be of some interest for people on Typophile as every cover features photographs of hand-made type. What you can see below are the final versions of the 12 covers. For higher resolution images and further material you can visit her <a class="freelinking external" href="http://felantix.blogspot.com/2010/05/konyvsorozat-tervezes-2010.html" rel="nofollow">blog</a>.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/boritok1_resize_6676.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/boritok2_resize_5037.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/boritok3_resize_6336.jpg"></div><p></p>
