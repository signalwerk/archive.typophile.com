    html: |-
      <p>Hi Mirko,</p>
      <p>the best available digital version is Garamond Simoncini EF by Elsner and Flake (previously in the Scangraphic catalogue), which mantains the typical inktraps feature of the original metal typeface and has - as a separate font - the small caps and old style figures, but in the roman only. Unfortunately, the old style figures aren't particulary well spaced. The other versions - commonly named "Simoncini Garamond" - are lighter. Einaudi's typeface (now named "Einaudi Garamond") is a completely different face, and, as you perhaps already know, is not available commercially. And yes, I confirm that the phonetic glyphs are not included in any of its version.</p>
      <p>Here is the page of Garamond Simoncini at EF's site:</p>
      <p><a href="https://www.fonts4ever.com/search_result_details.php?f_item_name=Garamond%20Simoncini%20Family%20Set&amp;view=1&amp;set=1&amp;subset=1&amp;products_id=1724#familyName" title="https://www.fonts4ever.com/search_result_details.php?f_item_name=Garamond%20Simoncini%20Family%20Set&amp;view=1&amp;set=1&amp;subset=1&amp;products_id=1724#familyName">https://www.fonts4ever.com/search_result_details.php?f_item_name=Garamon...</a></p>
