    <p>Hi! Ciao!</p>
    <p>I am interested in "Simoncini Garamond" font family (mainly because it is similar to the custom font used by Italian publisher Einaudi.<br>
    I have a few questions for you. ;-)</p>
    <p>– Which is the best version in circulation of this typeface (Adobe, Linotype, ...) and where you advise me to buy it (myfonts.com, fonts.com, ...)?<br>
    – Do you know of interesting variations? (I like the "tall, rangy and delicate" design  of this font).<br>
    – None of the versions of which I am aware integrates IPA phonetic characters: you confirm this? :-(</p>
    <p>Thank you!<br>
    Mirko</p>
