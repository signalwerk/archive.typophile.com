    <p>Hi, well I'm trying to unite two letters but when doing so the final shape is distorted.<br>
     What I did was converted the letters to Create Outlines. After that I selected both shapes and united them in the Pathfinder tab. The result was a distorted final shape.<br>
     What can I do so it doesn't distort.</p>
    <p> Thanks.</p>
