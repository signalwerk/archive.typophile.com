      <p>Never mind, I found the solution. Turns out I had to remove the check-mark beside Align New Objects to Pixel Grid in the mini menu of the Transform tab.<br>
      Hope this helps anyone having this problem.<br>
      Thanks anyway.</p><div class="imageWrap"><img src="http://typophile.com/files/resolved_6352.jpg"></div><p></p>
