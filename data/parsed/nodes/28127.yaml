    <p>Dear Typophiles,</p>
    <p>Here are three pages from my thesis showing my <a href="http://typophile.com/node/28085" rel="nofollow">modified version</a> of ITC Mendoza in action, esp. the small caps that Randy discussed with me earlier. I should've posted something like this right away.</p>
    <p>I agree that the small caps look too heavy and too small, esp. when used as on p. 155.</p>
    <p>EDIT: But I still think that beefing up the serifs, esp. the top serifs (and also the horizontal stem of e.g. T) was an improvement. The original ones look too anemic to me. The small caps of slab-serif faces seem to be a little problematic, though.</p>
    <p>BTW, do you think the italics (EDIT: i.e. the ordinary lowercase italics) are too heavy? Their weight I haven't changed, compared to the ITC original.</p>
    <p>Feel free to comment on anything on these pages, including the setting!</p>
    <p>Note that since setting the thesis, I have changed the fi and fl ligatures (making them wider, among other things) and reduced the sidebearings (esp. the right one) of the numeral 4. The specimen that I posted earlier (see the link above) shows the corrected versions, but I was too lazy to reset the pages I'm posting now.</p>
    <p>Olli</p>
