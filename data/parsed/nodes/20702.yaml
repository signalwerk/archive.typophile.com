      <p>Yes, Norbert, I have also been looking for samples of other template lettering, but only found Old English. I agree that using manual lettering tools would make sense, since it lets anyone make professional-looking letterforms on any size drawing. However, when Trina said that she thought these were current drawings, it raises the possibility of using a plotter-printer with computer fonts.</p>
      <p>Still, it surprises me that they would use such an archaic-looking style on modern documents.The only digital versions I can think of right away of typefaces that I think have a similar antique feel are <a href="http://www.myfonts.com/fonts/efscangraphic/windsor-sb/">Windsor</a> and <a href="http://www.myfonts.com/fonts/agfa/musketeer/">Musketeer</a>. I think Stephen’s suggestion is a bit too formal looking.</p>
      <p>- Mike Yanega</p>
