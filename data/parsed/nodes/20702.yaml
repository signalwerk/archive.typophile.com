    html: |-
      <p>I never used the LeRoy system, but I did use a Varigraph and another mechanical pantograph system whose name I can’t recall.</p>
      <p>The Varigraph had several sets of templates with several lettering styles. I can remember using Stymie Bold and Franklin Gothic(ish) styles. You traced using a stylus in the template (metal), the pen nibs were connected to the other end of a pantograph arm. You could size and slant of desired lettering by adjusting dials near fulcrum of arm.</p>
      <p>After outlining in ink, I had to fill in the characters by hand with India ink. These kind of lettering devices were very common with architects and engineers.</p>
      <p>As for the Post Old Style, on closer look the “A” is somewhat similar.<br>
      (Sorry about poor repro... quick snapshot. I could scan tomorrow if you’d like.)<br>
      Obviously my sample is the bold weight (Post Old Style Roman No. 2), but notice the difference in the cap S treatment between 10 pt. (slightly slanted) and the 24 pt. (upright). Also note the 24 pt. lowercase “y”... I love this old stuff!!!</p>
      <p>(edit-a-bit): There are 2 cap “S” in the 10 pt. sample. One is roman (POST) and one is italic??? (STYLE)!</p>
      <p></p><div class="imageWrap"><img src="/files/Post-oldstyle-1_3880.png"></div><p></p>
