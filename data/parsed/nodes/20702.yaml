      <p>Seeing more of the lettering makes it look like this might have been hand lettered, although I realize that the details of different type sizes would often vary within a typeface. In this sample, notice how the smaller E’s are not the same as the large one in ’CHARLES’. It’s not even clear that the identical letters in the same size are actually identical.</p>
      <p>Two questions Trina:</p>
      <p>1) Can you see variation in the identical letters in the original, or is that just the scan? (To me, the S’s for example, do not look <em>identical</em>, even though the shapes are about the same.)</p>
      <p>2) What is the actual date of the document? (This could help rule out certain styles, although if you just want to look like this it may not matter.)</p>
      <p>A problem may be finding digital types that will be close enough for your purposes, but making any font into an outline is the easy part.</p>
      <p>- Mike Yanega</p>
