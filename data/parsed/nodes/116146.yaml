    <p>JollyGood Sans- the sensible alternative to the font that must not be named.</p>
    <p>(I know I'm late to the game- After more than a years' work, Comic Neue beat me by a few weeks :( )<br>
    <img src="http://www.jollygoodfonts.com/images/jollygood_cover_s.png"><br>
    <img src="http://www.jollygoodfonts.com/images/jollygood_waterfall_s.png"></p>
    <p>A while ago I decided to stop mocking comic sans and instead do something about it. I created <em>JollyGood Sans</em> as a replacement that would keep the fun, informal, handmade feel of CS, but with a more polished look (seriously, have you taken a close look at the capital H in CS?). </p>
    <p>The result is a family of <em>11 fonts</em> (more on the pipeline) that are legible, web-friendly, and have very complete character sets, including ligatures and alternate letterforms.</p>
    <p>I hope it gives designers an alternative for when a comicsans-ish touch is needed.</p>
    <p>JollyGood Basic is free, the rest are 60% off for a limited time.</p>
    <p><a class="freelinking external" href="http://www.jollygoodfonts.com/" rel="nofollow">JollyGood Fonts</a></p>
