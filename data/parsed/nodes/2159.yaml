  html: <p>{From Bauhaus to Your House} <br> <br>Has anyone read this book? What are your thoughts? <br>Although I still think the world of the Bauhaus greats in general, the book offers a very convincing "other side of the story". The book seems to kind of make the point that in trying to "start from zero" they ended up with zero.  <br> <br>Are there other books anyone knows of off-hand dealing with the negative aspects of bauhaus? <br> <br></p>
