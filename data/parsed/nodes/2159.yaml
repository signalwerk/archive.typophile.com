    html: "<p>I don't know how they deal with disobedient printers in Switzerland or Brazil, but this taken from Savage's <i>A dictionary of the art of printing,</i> London 1841: <br> <br><i>Every chapel</i> [a kind of local guild of typesetters and printers working together in a single printing office] <i>is haunted by an imaginary spirit, named Ralph; and when any person refuses to obey it's mandates, this spirit begins to</i> walk <i>as it is termed. The first act is, in general, to hide the offender's composing stick; if this does not answer, his galleys are secreted; then the page cords, which secure his work, are cut, and his labour rendered more than useless, because he has to distribute his pie</i> [spilled type] <i>as well as recompose his matter; if he still remains contumacious, the whole of the types in his case are transposed, so that he cannot proceed in his business; and if he should still set the chapel at defiance, he is smoked, all the members of the chapel surrounding his frame; each with a lighted match of brimstone, and singing a doleful ditty...</i> <br> <br>And from Moxon's <i>Mechanick Exercises,</i> 1683: <br> <br><i>...and the Penalty for the breach of any of these Laws and Customs is in Printers Language called a</i> Solace.<i> ... But if the Delinquent prov'd Obstinate or Refractory, and would not pay his Solace at the Price of the Chappel, they</i> Solac'd <i>him. The manner of Solacing, thus. The Workmen take him by force, and lay him on his Belly athwart the Correcting-stone, and held him there while another of the Work-men with a Paper-board, gave him </i>10l. and a purse<i>, viz. Eleven blows on his Buttocks; which he laid according to his own mercy. For Tradition tells us, that about 50 years ago was one Solaced with so much violence, that he presently Pissed Blood; and shortly after dyed of it.</i></p>"
