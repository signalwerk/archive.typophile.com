stified setting): the �perfect rectangle� was seen as an  <br>inheritance from the old typography, and a purely formalist device,  <br>since it goes against the natural, organic spacing of letters and  <br>words. <br> <br>In a nutshell: the Bauhausians were seen as formalists by the  <br>later modernists, who saw themselves as functionalists. The same  <br>reasoning used for typography can be applied to type design: while  <br>one can easily (but not very accurately) associate the Bauhaus with  <br>Paul Renner�s Futura, or (somewhat more correctly) with Bayer�s  <br>and Joost Schmidt�s experiments, the geometrical sanses were  <br>rejected by the later modernists as formalist, �artistic� letterforms.  <br>They would prefer the anonymous �jobbing� grotesks of the late  <br>19th century. And while Emil Ruder, for instance, saw the release  <br>of Univers almost as a holy grail of typography � a grotesk with  <br>high design qualities �, there were still those who would regard  <br>it as being too �authored�. <br> <br>Hope that helps.</p>"
