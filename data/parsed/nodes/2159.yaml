    html: <p>John, <br> <br>Although I misunderstood your original post I am thankful that I did. Your effort has not been wasted on me. <br> <br>I have been exposed to Tschichold from different directions. Not only Hans Schmoller but also Nick Schwabe. Nick was the master Swiss printer that gave me his book. The one we had talked about where the Church developed a peculiar habit  of beheading people like me. <br> <br>Nick belongs to the famous Schwabe printing family. He was a shareholder of the Schwabe publishing firm responsible for printing many books Tschichold designed, and some of which, he wrote. I would guess you will find Schwabe, the firm, indexed in books about Tschichold. <br> <br><a href="http://www.lanstontype.com/PrivatePress.html" target="_blank">http://www.lanstontype.com/PrivatePress.html</a> <br> <br>Most remarkable is how different Tschichold is described by different tradesmen within the same industry. <br> <br>Hans Schmoller  of Penguin was an interesting designer himself but for that matter so was Nick Schwabe. Nick's work was decidedly <i>Swiss Style</i>. But once in a while Nick would express his classical typography. He was good. Also Nick was certainly the finest pressman I have ever had the pleasure to work with. <br> <br>I am telling you about Nick because I have no reason to believe he has passed away and probably still lives in British Columbia. <br> <br>But I have a little story about Swiss training. Nick taught me how to set type. Part of which is, sadly I report, distributing types correctly back into their case.  <br> <br>Certainly this is not the end of the story but it is as far as I dare tell. <br> <br>If you value your life you will <i>not ask Nick the end of my story of how hand setting types was taught in Switzerland.</i> <br> <br>Morality aside, it worked very well. I got pretty good at it.</p>
