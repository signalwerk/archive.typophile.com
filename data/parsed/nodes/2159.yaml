    html: <p>Pyramids have been around a long time, think Aztec, think Mid East. <br> <br><a href="http://home.globalcrossing.net/~kjohnson/" target="_blank">http://home.globalcrossing.net/~kjohnson/</a> <br> <br>Now if the chap built his pyramid out of stone rather than glass he would certainly have something of great puzzling influence. <br> <br>Glass buildings have also been around along time. There are beautiful glass railway stations in Hamburg for instance. Pei�s pyramid is interesting, but <i>mudhif on the Eurphrates is more interesting.</i> Mind you, the native Marsh people of the Nile were a good deal more cultured than Walter Gropius. <br> <br>I thought we got over the "western pyramid cult" in the seventies. You weren't one of  those guys who slept under one I hope. <br> <br>Pei�s pyramid seems like an expensive way to keep out the rain. Not to mention heat prostration in the summer and a really big chill in winters. Think terrorist target. Remind me to avoid that place. Frightening! Form and function, oh yeah! In any event one must not get stuck on one single example that may or may not have merits, exceptions only prove the rule. <br> <br>And this is the rule. <br> <br><a href="http://craton.geol.BrockU.CA/guest/jurgen/bau1.htm" target="_blank">http://craton.geol.BrockU.CA/guest/jurgen/bau1.htm</a> <br> <br>So what are the merits of this nauseous beauty. Zero! Get my point. I have a conspiricy theory. Bayer was shareholder and of the same family that makes Bayer Aspirin. That Bauhaus was concocted by the advertising world to sell headache pills. Remember the old adds. Thump, thump, thump! <br> <br>Eat too many of those and your serifs will go away!</p>
