    html: "<p>The biggest problem with 'Bauhaus' typography (and note that the biggest proponent of asymetric typography, Tschichold, was not involved with the Bauhaus) is that it is very hard to do well. Tschichold could do it well, and could also do classical typography well, and his realisation was that in the latter it was easier for the average craftsman to achieve an attractive result. Only a handful of people produced really good modernist typography: more of it was sterile. I suspect that the same is true of architecture, although in that field one should take into account materials and building techniques as well as aesthetics when one talks about what constitutes modern.</p>"
    html_clean: "<p>The biggest problem with 'Bauhaus' typography (and note that the biggest proponent of asymetric typography, Tschichold, was not involved with the Bauhaus) is that it is very hard to do well. Tschichold could do it well, and could also do classical typography well, and his realisation was that in the latter it was easier for the average craftsman to achieve an attractive result. Only a handful of people produced really good modernist typography: more of it was sterile. I suspect that the same is true of architecture, although in that field one should take into account materials and building techniques as well as aesthetics when one talks about what constitutes modern.</p>"
