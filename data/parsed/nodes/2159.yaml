    html: "<p>Rodolfo: <br>&gt; Blame it on Mies! ; ) <br> <br>He designed some awful buildings, yes, but he was a great architect anyway. Some of his projects have amazing subtleties. I'd blame Philip Johnson instead. <br> <br> <br>John: <br>&gt; it is very hard to do well. [...] <br>&gt; I suspect that the same is true of architecture, [...] <br> <br>I think you're right. <br> <br> <br>Brian: <br>&gt; it seems to me that Kahn's work does highly  <br>&gt; resemble the Bauhaus <br> <br>I don't think Kahn's buildings look like Bauhaus. Kahn was more sensible and subtle than the Bauhausians. See the materials, for example. <br> <br>&gt; even though he had a lot of spoken ideas that  <br>&gt; were different. This is another point the book  <br>&gt; was making...tons of ideas were going around,  <br>&gt; but everything still looked the same. <br> <br>Good point. I must say, the greatest architects were usually pretty bad at expressing themselves through words. :-( <br> <br>&gt; It seems that Kahn's addition could have better  <br>&gt; related to its context. The context is an entire <br>&gt; campus built in gothic revival. How does the  <br>&gt; International style fit in here? I'm not saying  <br>&gt; that it can't.. at this point I'm still asking  <br>&gt; questions, because it's not immediately obvious. <br> <br>Very good question. <br> <br>&gt; But he says his building \"revealed the structure\" <br>&gt; of the gothic one next door... I need to see  <br>&gt; how. Is putting something plain (possibly  <br>&gt; boring) next to something exciting revealing the <br>&gt; structure of anything? <br> <br>Those horizontal lines in the facade correspond to the floors of the old building (which match the floors of his new building too). Kahn's addition also has the same height of the old building. Maybe these 'tricks' don't 'reveal' anything, but anyway, he was able to create some subtle visual links between the two parts. <br> <br> <br>William: <br>&gt; My experience is that their actual buildings,  <br>&gt; though, are emotionally cold and inhospitable. <br> <br>I understand. And if you were talking about the post-Bauhaus 'International Style', I'd have to agree with you. <br> <br>&gt; Tom Wolfe's book, which this thread started  <br>&gt; with, argues that the Bauhaus people where so  <br>&gt; good at convincing people of their superior  <br>&gt; taste that they paid for buildings that very few <br>&gt; people liked, and many detested. <br> <br>Ok, this might have been true, but after the end of Bauhaus, the 'glass-and-steel-box' style became popular, the big companies wanted it. This is what we usually call 'International Style' in architecture. This 'International Style' borrowed the superficial look of the modern architecture, but the great spatial explorations of the modernism were left behind. <br> <br>I went to the library today and found Wolfe's book. I gave it a quick glance, and noticed he says good things about Johnson's project for AT&amp;T. To me, this building is 'International Style' too. It's another 'cold glass-box', with a fancy thing at the top... <br></p>"
