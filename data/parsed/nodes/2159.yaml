    html: <p>The printer's chapel does "not" have anything to do with the Church, not directly at least. There were strange industry culthood rituals that ran amuck. Printers' devils are probably losing their status. I made a great little devil. <br> <br>Frankly I enjoyed the paper stretcher. Was that ever a great prank. I remember hauling that thing to Cambie by bus  from  Victoria Street. What an idiot. <br> <br>But keep in mind all printer's initiations and pranks were not funny. Few in fact. <br> <br>I am surprised more people don't read about the trade. I am glad you do. <br> <br></p>
