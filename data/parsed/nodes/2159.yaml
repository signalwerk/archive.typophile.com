    html: "<p>Brian: <br>&gt; It has a really striking picure that I hadn't seen before of one section of Yale (a  <br>&gt; museum I think) <br> <br>Do you mean, <a href=\"http://www.architectureweek.com/2002/0710/culture_1-1.html\"> The Yale Center For British Art</a>, by Louis Kahn? If so... <br> <br>&gt; which was done in gothic revival, next to an addition in  <br>&gt; bauhaus style, and it looks rather pathethic, even though it is \"simple\" and  <br>&gt; \"clean\" which is still how people like to describe \"good\" design, and think that if  <br>&gt; they say, \"this is good because it is simple\" that they are automatically justified.  <br> <br>Well, I've never been there, and I agree that this kind of 'automatic' link 'simple=good' is wrong. But this building designed by Kahn is certainly not 'pathetic'. IIRC, it has some great (complex) ceiling devices for natural lighting (it's a museum) in the intern spaces. The building is only apparently simple. And Kahn is far from the Bauhaus style, he was <a href=\"http://www.greatbuildings.com/buildings/Institute_of_Public_Admin.html\"> not</a> a 'modernist'. <br> <br>&gt; If we keep rebuilding mimics of the past we aren't really making much progress. <br> <br>Of course, completely agreed. (But then, what to say about 'post-modern' architecture? Robert Venturi? 'Learning from Las Vegas?' ;-) <br> <br> <br> <br>William: <br>&gt; I agree with Wolfe that the Bauhaus had mainly a disasterous influence in architecture. <br> <br>I'm sorry, I don't recall reading this book by Wolfe. But anyway, I can't agree with this. The modern architecture (including the Bauhaus) represents a new way of understanding and organizing space. Which doesn't mean it didn't have its (big) problems... And it was not easy for me to understand the great contributions of modern architecture (I went to architecture school). <a href=\"http://www.amazon.com/exec/obidos/tg/detail/-/0262680378/002-2743001-2411231?v=glance\"> This book</a>, a collection of articles written by Colin Rowe, helped me understanding many questions, but I'm afraid it's a bit too 'heavy'/'academic' for non-starters. <br> <br>&gt; But in typography I think it has more of a mixed legacy - some good, some bad.  <br> <br>OK, I think I agree. <br>In any case, let me clarify this: Bauhaus architecture was one thing, Bauhaus typography was another. The contributions of Bauhaus to architecture are mostly exclusively related to architeture. And, FWIW, I think Bauhaus was more important to architecture than to typography... <br> <br> <br> <br>Gerald: <br>&gt; I don't tell people how to think. I just tell them what I think of what they think!  <br> <br>Sounds OK to me. <br> <br>&gt; Hitler was right, Bauhaus sucks.  <br> <br>Hmmm. <br>Anyway, this is interesting... Just a thought... What would've happened if Bauhaus continued to exist in Germany? I mean, because of the end of Bauhaus, those guys had to move to USA. And this was an important factor to the rising of the 'International Style', as we know it...</p>"
    html_clean: "<p>Brian: <br>&gt; It has a really striking picure that I hadn't seen before of one section of Yale (a  <br>&gt; museum I think) <br> <br>Do you mean, <a href=\"http://www.architectureweek.com/2002/0710/culture_1-1.html\" class=\"link-external\"> The Yale Center For British Art</a>, by Louis Kahn? If so... <br> <br>&gt; which was done in gothic revival, next to an addition in  <br>&gt; bauhaus style, and it looks rather pathethic, even though it is \"simple\" and  <br>&gt; \"clean\" which is still how people like to describe \"good\" design, and think that if  <br>&gt; they say, \"this is good because it is simple\" that they are automatically justified.  <br> <br>Well, I've never been there, and I agree that this kind of 'automatic' link 'simple=good' is wrong. But this building designed by Kahn is certainly not 'pathetic'. IIRC, it has some great (complex) ceiling devices for natural lighting (it's a museum) in the intern spaces. The building is only apparently simple. And Kahn is far from the Bauhaus style, he was <a href=\"http://www.greatbuildings.com/buildings/Institute_of_Public_Admin.html\" class=\"link-external\"> not</a> a 'modernist'. <br> <br>&gt; If we keep rebuilding mimics of the past we aren't really making much progress. <br> <br>Of course, completely agreed. (But then, what to say about 'post-modern' architecture? Robert Venturi? 'Learning from Las Vegas?' ;-) <br> <br> <br> <br>William: <br>&gt; I agree with Wolfe that the Bauhaus had mainly a disasterous influence in architecture. <br> <br>I'm sorry, I don't recall reading this book by Wolfe. But anyway, I can't agree with this. The modern architecture (including the Bauhaus) represents a new way of understanding and organizing space. Which doesn't mean it didn't have its (big) problems... And it was not easy for me to understand the great contributions of modern architecture (I went to architecture school). <a href=\"http://www.amazon.com/exec/obidos/tg/detail/-/0262680378/002-2743001-2411231?v=glance\" class=\"link-external\"> This book</a>, a collection of articles written by Colin Rowe, helped me understanding many questions, but I'm afraid it's a bit too 'heavy'/'academic' for non-starters. <br> <br>&gt; But in typography I think it has more of a mixed legacy - some good, some bad.  <br> <br>OK, I think I agree. <br>In any case, let me clarify this: Bauhaus architecture was one thing, Bauhaus typography was another. The contributions of Bauhaus to architecture are mostly exclusively related to architeture. And, FWIW, I think Bauhaus was more important to architecture than to typography... <br> <br> <br> <br>Gerald: <br>&gt; I don't tell people how to think. I just tell them what I think of what they think!  <br> <br>Sounds OK to me. <br> <br>&gt; Hitler was right, Bauhaus sucks.  <br> <br>Hmmm. <br>Anyway, this is interesting... Just a thought... What would've happened if Bauhaus continued to exist in Germany? I mean, because of the end of Bauhaus, those guys had to move to USA. And this was an important factor to the rising of the 'International Style', as we know it...</p>"
