    html: <p>Dan,  <br>  <br>If you like Bauhaus! I would have to agree with your mother. <br> <br>What is good about Bauhaus. Maybe you could show me here? <br> <br><a href="http://www2.helsinginsanomat.fi/extrat/kaupunki/puretuttalot/puretuttalot.asp" target="_blank">http://www2.helsinginsanomat.fi/extrat/kaupunki/puretuttalot/puretuttalot.asp</a> <br> <br>Besides Dan, I don't tell people how to think. I just tell them what I think of what they think! <br> <br>And, William I can't find anything in typography that Bauhaus has offered that I can't live without.  The grand master of Bauhaus returned to traditional typography in his later days and denounced his previous works. I am not clear on whether that was ever published. I was privileged to a clear headed lengthy monologue by Hans Schmoller who worked for Penguin after Jan Tschichold. <br> <br>Hans was a pretty interesting typographer in his own right. Certainly took a different approach than I. The results sometimes similar. As in good, real good. <br> <br>By the way, most people pronounce Tschichold wrong. I don't. <br> <br><a href="http://www.lanstontype.com/EndPapers.html" target="_blank">http://www.lanstontype.com/EndPapers.html</a></p>
