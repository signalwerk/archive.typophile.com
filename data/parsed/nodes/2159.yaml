    html: "<p>Rodolfo, thanks for the book suggestion! I need something to determine how much weight to put on Wolfe's comments. His arguments seem correct, but he himself seems to poke fun at his own off-centered viewpoints. <br>GG, one of your links had a picture of the book in it. (don't know if you've read the book.) <br><img src=\"http://www.typophile.com/forums/messages/30/21086.jpg\" alt=\"thebook\"> <br> <br>I'm not saying I don't like Kahn or the Bauhaus overall. In fact, Paul Klee has been my favorite artist for quite some time, and I like what Peter Behrens for example did with sans, but mainly just because of when he did it.  <br>  <br>After looking through several sites, it seems to me that Kahn's work does highly resemble the Bauhaus, even though he had a lot of spoken ideas that were different. This is another point the book was making...tons of ideas were going around, but everything still looked the same. Kahn talks about how going back to the beginning is where all the excitement is. If this isn't Bauhaus... I mean, that's straight from the mouth of Gropius. (O white god!)  <br> <br><a href=\"http://www.greatbuildings.com/architects/Louis_I._Kahn.html\" target=\"_blank\"> kahn info</a> (click the blue links on this page) <br>and <br><a href=\"http://www.rochesterunitarian.org/Kahn/\" target=\"_blank\"> more kahn info</a> (I apologize in advance for the massive amount of red you are about to see.) <br> <br>I like many of Kahn's aspirations, particularly regarding artificial &amp; natural light. But about other things I'm not sure: \"Beauty was not within his immediate concerns.\" This is especially confusing when, for example, <a href=\"http://members.tripod.com/~freshness/essay1.html\" target=\"_blank\">here</a> it talks about Kahn saying how beautiful columns are, but his addition doesn't have any columns, does it? (maybe it does on the inside?) It's just a wall, with lines, that supposedly reveals the structure of the original. His connections between columns and bringing in light and dividing spaces is pretty brilliant though, and I see how the inside brings in light. But still confused on the outside. <br> <br>It seems that Kahn's addition could have better related to its context. The context is an entire campus built in gothic revival. How does the International style fit in here? I'm not saying that it can't.. at this point I'm still asking questions, because it's not immediately obvious. <br> <br>If he would have said that the building was about contrast, I might at least see where he was coming from. But he says his building \"revealed the structure\" of the gothic one next door... I need to see how. Is putting something plain (possibly boring) next to something exciting revealing the structure of anything? The book does mention that the interior made use of some clever innovations. <a href=\"http://www.yale.edu/yuag/\" target=\"_blank\">[pic of the lighting]</a> That's really nice! Except, still, I don't see how it relates to gothic architecture. Another museum he did used long vaults (long hallways were an international style thing) and I see how that relates, but that was in texas, and later on. <br> <br>One more link: <br><a href=\"http://www.greatbuildings.com/buildings/Yale_Center_for_British_A.html\" target=\"_blank\">Kahn summary</a> <br>A quote from Kahn on this page... <br>\"A museum seems like a secondary thing, unless it is a great treasury. A treasury, a guarded love for your source. Oh, what a place that would be! Not just an accumulation crowded together. You go through halls and halls and halls. The Museum of Cairo is a confined building that looks more like a storage house than it does a museum.\" <br> <br>which is this: <br><img src=\"http://www.typophile.com/forums/messages/30/21087.jpg\" alt=\"cairo\"></p>"
