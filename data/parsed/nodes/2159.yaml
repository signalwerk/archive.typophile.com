    html: "<p>Hi Brian <br> <br>I too very much like Bauhaus-inspired architecture, but I also loved Tom Wolfe's book. It's a really fascinating and well-developed argument.  <br> <br>Another book you may like is Prince Charles'  <br>\"A Vision of Britain: A Personal View of Architecture.\" Here's a couple of lines I got off Amazon's website about it: \"The Prince's central point is that modern architecture has lost sight of its surroundings. Rather than creating structures that harmonize with their location, using local materials and respecting the history of the site, many modern buildings seem determined to draw attention to themselves -- or rather, to their architects. Like any art, architecture is a matter of taste. But while you can hide a bad statue or painting, an ugly building is a blot on the landscape that's darn hard to avoid.\" <br> <br>I read this book way back when it was published -- I think in the mid 1980s. It caused quite a stir at the time, but now his argument seems pretty sensible. The book also includes some fairly decent drawings by the prince himself. <br> <br>Troy <br> <br></p>"
