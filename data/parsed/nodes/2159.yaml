    html: <p>&gt;The modern architecture (including the Bauhaus) represents a new way of understanding and organizing space. <br> <br>I am willing to accept from you, Eduardo, that there is a lot to be learned from the experiments of the Bauhaus. My experience is that their actual buildings, though, are emotionally cold and inhospitable. Tom Wolfe's book, which this thread started with, argues that the Bauhaus people where so good at convincing people of their superior taste that they paid for buildings that very few people liked, and many detested. <br> <br>In the US, when the Bauhaus influence started waning - I guess by the end of the 70's - new buildings started looking a lot better. To me the Bauhaus is a period of bad taste and bad buildings, and kind of inverse Victorianism, which I also dislike.     <br> <br>I haven't studied the history, either in architecture or typography, but of course we are surrounded by the stuff in one way or another. I not infrequently see some very spare, bare bones typography looking good, but very rarely architecture.  <br> <br>The use of Sans serif titling faces with serif text faces is I am guessing an indirect legacy of Bauhaus, and it often works well.</p>
