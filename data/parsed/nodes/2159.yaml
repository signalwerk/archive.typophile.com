    html: "<p>To further address the 'What has Bauhaus done for me?' discussion: <br> <br>I've always been partial to Johannes Itten's <a href=\"http://www.dezignare.com/newsletter/Johannes_Itten.html\"><i>The Art of Color</i></a>. Now, I can't say that I'm 100% in line with his ideas, but he certainly contributed positively to the world of visual expression. And, as it's been pointed out, most everyone has contributed <i>something</i> positive in their lives. And what can replace the entertainment of seeing Bauhaus (the font) pop up in the weirdest places?</p>"
