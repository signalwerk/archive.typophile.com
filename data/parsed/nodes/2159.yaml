    html: <p>Not exactly the response I was hoping for. <br>Wolfe starts off comparing it to the Vienna Secession, how they both had their own singular building, which was the center for the "compound" out of which all the rules and ideas came from. <br> <br>His main critique is that it became so important and so highly regarded that an attempt at anything else was considered "bourgeois", and almost even spiritually wrong. (The book makes many religious references.) Another main point is how clients didn't ever actually like the designs they were paying for, but kept paying for them anyways, allowing the designers/architects to dictate to them what was good and bad.  <br> <br>It deals mostly with architecture, rather than type or any other art, but certainly the applications can be made. It talks about how even Philip Johnson used to like to be called "Mies van der Johnson" and that even the architects who realized the flaw of everything looking "bauhaus" had to become part of the system in order to be taken seriously and still move away from it (Robert Venturi.) <br> <br>It has a really striking picure that I hadn't seen before of one section of Yale (a museum I think) which was done in gothic revival, next to an addition in bauhaus style, and it looks rather pathethic, even though it is "simple" and "clean" which is still how people like to describe "good" design, and think that if they say, "this is good because it is simple" that they are automatically justified. <br>And here's a random thought; I really hope the new WTC design isn't just another "glass box" but is instead something really creative. If we keep rebuilding mimics of the past we aren't really making much progress. (Maybe this relates to redoing old typefaces?) <br>Anyhow, good book. Would like to read others like it. <br> <br> <br> </p>
    html_clean: <p>Not exactly the response I was hoping for. <br>Wolfe starts off comparing it to the Vienna Secession, how they both had their own singular building, which was the center for the "compound" out of which all the rules and ideas came from. <br> <br>His main critique is that it became so important and so highly regarded that an attempt at anything else was considered "bourgeois", and almost even spiritually wrong. (The book makes many religious references.) Another main point is how clients didn't ever actually like the designs they were paying for, but kept paying for them anyways, allowing the designers/architects to dictate to them what was good and bad.  <br> <br>It deals mostly with architecture, rather than type or any other art, but certainly the applications can be made. It talks about how even Philip Johnson used to like to be called "Mies van der Johnson" and that even the architects who realized the flaw of everything looking "bauhaus" had to become part of the system in order to be taken seriously and still move away from it (Robert Venturi.) <br> <br>It has a really striking picure that I hadn't seen before of one section of Yale (a museum I think) which was done in gothic revival, next to an addition in bauhaus style, and it looks rather pathethic, even though it is "simple" and "clean" which is still how people like to describe "good" design, and think that if they say, "this is good because it is simple" that they are automatically justified. <br>And here's a random thought; I really hope the new WTC design isn't just another "glass box" but is instead something really creative. If we keep rebuilding mimics of the past we aren't really making much progress. (Maybe this relates to redoing old typefaces?) <br>Anyhow, good book. Would like to read others like it. <br> <br> <br> </p>
