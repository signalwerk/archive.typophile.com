    html: "<p><i>Besides young Tschichold�s common influence, it <br>was clear to me that the Swiss school had little <br>to do with the Bauhaus. But I have to tell you <br>it�s the first time I�ve heard they�re opposed, <br>even in some senses :-) <br> <br>Could you explain that?</i> <br> <br> <br>Hugo, first let me try to explain what may be misleading in what  <br>I wrote: not �opposed to the Bauhaus�, but, <i>in some senses,</i> to  <br>Bauhaus typography. And when I mentioned �Swiss typography�  <br>(a term almost as loaded as �international style�...) was as a  <br>conspicuous example of a more general spirit. The �Swiss school�  <br>itself, BTW, was not monolithic (one of the things Maldonado advises  <br>against is the monolithical assessment of modern architecture,  <br>and we should take the same care when talking about typography). <br> <br>To answer you, let me quote one of the leaders of the modernists  <br>of the fifties, Max Bill [ from a �dialogue� of texts that happened  <br>in 1946: Bill, in his �On typography�, attacked Tschichold for his  <br>ideological about-face, Tschichold then responded with his �Glaube  <br>und Wirklichkeit� (�Faith and reality�). Both texts are fundamental,  <br>and, even though I side with Bill ; ) I recognize that Tschichold�s  <br>is brilliant. ] Anyway, on to Bill. He attacked the modernists of the  <br>twenties and thirties, Bauhausians also, for, among other things, <br> <br>�that which constituted fashionable accessories: the thick rules, <br>the fillets, the huge bullets, the overdimensioned folios, and other  <br>such attributes [...] all these elements are useless and superfluous  <br>when the disposition itself is correctly organized, when the groups  <br>of words are placed in just relations of proportion.� (sorry if this  <br>sounds convoluted � I�m freely translating from a French translation  <br>of the German original). <br> <br>And I add: for justified composition (the Bauhausians didn�t do  <br>unjustified setting): the �perfect rectangle� was seen as an  <br>inheritance from the old typography, and a purely formalist device,  <br>since it goes against the natural, organic spacing of letters and  <br>words. <br> <br>In a nutshell: the Bauhausians were seen as formalists by the  <br>later modernists, who saw themselves as functionalists. The same  <br>reasoning used for typography can be applied to type design: while  <br>one can easily (but not very accurately) associate the Bauhaus with  <br>Paul Renner�s Futura, or (somewhat more correctly) with Bayer�s  <br>and Joost Schmidt�s experiments, the geometrical sanses were  <br>rejected by the later modernists as formalist, �artistic� letterforms.  <br>They would prefer the anonymous �jobbing� grotesks of the late  <br>19th century. And while Emil Ruder, for instance, saw the release  <br>of Univers almost as a holy grail of typography � a grotesk with  <br>high design qualities �, there were still those who would regard  <br>it as being too �authored�. <br> <br>Hope that helps.</p>"
