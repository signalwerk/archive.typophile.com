    html: "<p><i>Your theory of his reasons for returning to classical typography conflict with mine however. Do you have source on that. I am very interested in him and his works. Also, as you know, Tschichold and I had a mutual friend.</i> <br> <br>In what I've read of Tschichold's own writing, he never rejects asymetric typography; rather, he rejects his early ideological insistence on asymetric typography, and acknowledges that both asymetric and classical typography have their place, with the latter being most appropriate for books. I think it is important to look at the kind of material Tschichold was designing at different points in his career, and that the move to classical typography coincides with a move from advertising and what we would now call 'identity' design (e.g. stationery) to book design -- and book design of a specific kind: predominantly literary texts in octavo format. <br> <br>I have an interesting German book that combines Tschichold's writings -- illustrated with samples of his work -- from both halves of his career. Most English language publications, excepting Ruari Maclean's not very good biography, deal with either his asymetric typography <i>or</i> his classical book design, as determined by the interest/bias of the translator or publisher. The German book is better, I think, because it conveys the consistency of Tschichold's attention to detail and quality, and makes one realise how this, not apparently opposing styles, is really key to understanding what Tschichold was about. In his early career, he developed asymetric typography to a very high level, and wrote books urging other typographers to follow suit. In his later career, he applied exactly the same level of quality to classical typography, and wrote what amount to style guides that would enable other typographers to achieve pleasing results. This is why I think the relative ease of achieving such results in the classical style, compared the more difficult task of achieving beauty in asymetric typography, was an important factor in Tschichold's <i>volte face</i>, especially as it is expressed in pedagogical efforts such as the essays in <i>The form of the book.</i> The fact that he developed his classical book design techniques in the context of the Penguin publishing programme is also interesting, and suggests a context in which mass-production of attractive typography, achievable by designers and printers following style guides, would become preferable to more difficult works requiring individual genius of the kind Tschichold himself had demonstrated in his early career.</p>"
