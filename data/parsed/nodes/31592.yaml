      <p>hey everyone,</p>
      <p>thanks for your suggestions so far - i am enjoying looking through them and some are definitely in the running.</p>
      <p>one thing i had not considered was that some “families” contain both sans and serifs. for example, FF Quadraat as Jelmar suggested or Scala + Scala Sans. </p>
      <p>it may be a matter of semantics, but would you all consider serif versions and sans versions to be in the same family? or each their own family?</p>
      <p>to explain a bit further what i want to do: i will be making a large scale visual tapestry of many distinct pieces of text, ranging from two word phrases to a few sentences. so on one level, the viewer will be able to experience the piece as a purely visual thing, like a painting. on another level, as viewers moves closer to the piece, they will be able to read each individual statement, which - i hope - will provide a whole other level of dialogue with the piece.</p>
      <p>what do you all think about a sans and serif together in this context?</p>
      <p>thanks!<br>
      jarrod</p>
