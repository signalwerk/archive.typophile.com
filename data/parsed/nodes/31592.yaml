    html: |-
      <p>Usually the sans and serif faces that are in one family, are designed to work well together. The one may be derived from the other. Or designed individually, but staying close to each other. Usually there is something like a ’skeleton’, so to speak, to be seen, on which both faces are based.</p>
      <p>But I’m not sure if I would call it ’one’ family. Most of them are sold seprately, so based on that I would say they are not.</p>
