    <p>hi all,</p>
    <p>I am starting a typographically based art project. I would like to use one large font family - i.e., several weights, italics, ligatures (standard and discretionary, if possible), etc. Less commonly used glyphs like fractions and so forth are not as important. Also, it should simply be beautiful. (Open to interpretation, of course.)</p>
    <p>I’m leaning toward serif faces but both sans and serif are welcome. Feel free to throw out the usual suspects, but I’m also interested in more, let’s say, obscure possibilities. </p>
    <p>Of course, it has to be purchasable (not proprietary).</p>
    <p>thanks much!<br>
    jarrod</p>
