    <p><a href="http://www.flickr.com/photos/joepemberton/1348286155/" title="Photo Sharing"><img src="http://farm2.static.flickr.com/1050/1348286155_9338f272a5_m.jpg" width="240" height="180" alt="Jimmy, Karen, Jeannie"></a> <a href="http://www.flickr.com/photos/joepemberton/1348301461/" title="Photo Sharing"><img src="http://farm2.static.flickr.com/1176/1348301461_d19da18895_m.jpg" width="240" height="180" alt="Stewf and Zara"></a> </p>
    <p>A few Typophile regulars met up in San Francisco for dinner at <a href="http://www.farmerbrown.com">farmerbrown</a>. Tasty food. Good conversation. Thanks to Karen Huang (<a href="http://www.snogblog.com">snogblog</a>, <a href="http://www.manic.com.sg">Manic</a>) and husband Jimmy for providing a good excuse to get together.</p>
    <p>The rest of the pics are <a href="http://www.flickr.com/photos/joepemberton/sets/72157601927859003/">on Flickr</a>.</p>
    <p>(And thanks Hrant for the heads-up.)</p>
