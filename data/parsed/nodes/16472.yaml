    html: |-
      <p>The visual of pigeons nested/taking flight from the counter forms in the letters of 'Desert View Lofts', which should probably be stacked to prevent it from getting too long ('Desert' on top of 'View Lofts'). The 'D' and the 'O' are particularly good spots for this.</p>
      <p>Do not use Photoshop for creating logos (except to save them for the web, etc.). Use Illustrator's vectors to create a logo that can scale to any size without resolution loss. It also tends to force you to keep your illustration cleaner and simpler.</p>
