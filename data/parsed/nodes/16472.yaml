  html: |-
    <p>My brother in-law has asked me to design a logo for his business and since this is the first time I have attempted to design a logo from scratch I was wondering if anyone could give me a few ideas. I realize that most of you do this for a living so I would not want you to spend too much time with me, all I need are a few ideas to get me going in the right direction. I am comfortable using Illustrator and Photoshop.</p>
    <p>Here is a little background. My brother in-law breads and races pigeons in Tucson, AZ.   The name of his business is DESERT VIEW LOFT <a href="http://www.desertviewlofts-tucson.com" title="http://www.desertviewlofts-tucson.com">http://www.desertviewlofts-tucson.com</a>  He needs a logo that will work on everything from biz cards to T-shirts.</p>
    <p>Any help would be greatly appreciated. Once I have a few working logos I'll post them for review.</p>
    <p>-Steve</p>
