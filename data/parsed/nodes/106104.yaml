      <p>[Corrected post. Had bad connection and I mangled my post]<br>
      Good points Nick.<br>
      Perhaps what we have is a mutual influence process between technology, the arts, current events etc. The influence is clearly not one way.  Each is both initiator and recipient.<br>
      There is no hope of a "true" explanation that attempts to describe a complex relationship in a few words.  My terse phrase about Art Deco clearly lends itself to interpretations that could indeed be seen as "cart before the horse." This the reason for editing before publication. Unfortunately posting in an e-forum does not benefit from this.<br>
      As for Benton and Morrison, a few thoughts, with which you may or may not agree.<br>
      Benton, encouraged by DeVinne during the Century project, was enamored by technology that could produce more precise typefaces. He was unsatisfied with the existing ATF font library, inherited from a hodgepodge of foundries and designers. His solution, as you note was historicism -- a quest to use new technology to produce revivals of the great designs of the 18th century and earlier that would meet the demands of industrial society. At ATF from the late 1890s onward he axed most of the fonts in the catalog -- with all their fascinating variety -- and directed the creation of a new precisely ordered, mechanized world of fonts.<br>
      The adoption of new technology was in itself a forces for font redesign. For example, designing fonts for Monotype and Linotype machines was subject to severe design restraints.<br>
      Don</p>
