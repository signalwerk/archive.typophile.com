      <p>I agree that it's sometimes useful to have a wide open brainstorming session at the start of a project as unfocused as this one. But then choices have to be made. Various posters have suggested a wide range of topics. This would be a good time for you to try and specify some terms of reference for your project. After you have some results is the time to look at a variation or a new issue.<br>
      As  a final comment, the references suggested are excellent and a worthwhile use of your time, but I would suggest that you also spend some time looking critically at a few type specimens from different periods -- some of the books have fonts organized by time period -- and ask some simple questions such as why did a new type design or fashion meet a need at that time and why was it abandoned later. The answer varies and says a lot about changing cultural values, technology, current events etc.<br>
      Don</p>
