      <p>Sort of taking you at your word...</p>
      <p>For handset type, up until the 1890s, I'd recommend Updike's <cite>Printing Types, Their History, Forms, and Use: A Study in Survivals</cite></p>
      <p>One link:<br>
      <a href="http://www.abebooks.com/book-search/title/printing-types/author/daniel-berkeley-updike/page-1/" title="http://www.abebooks.com/book-search/title/printing-types/author/daniel-berkeley-updike/page-1/">http://www.abebooks.com/book-search/title/printing-types/author/daniel-b...</a></p>
      <p>If you've used Abe's I'd reorient the search for hardcover, and most reliable retailers, then get whatever condition your budget allows. I've been at this over 30 years, and still consult Updike from time to time. Remember there are two volumes.</p>
      <p>Of course, there is always Amazon,<br>
      <a href="http://www.amazon.com/Printing-Types-Their-History-Forms/dp/1584560568" title="http://www.amazon.com/Printing-Types-Their-History-Forms/dp/1584560568">http://www.amazon.com/Printing-Types-Their-History-Forms/dp/1584560568</a></p>
      <p>but I don't think I'd want it (judgement not made by having one to hand). There was a good edition under the imprint of The Belknap Press of Harvard University Press, 1966.</p>
      <p>For an interesting exploration on how the initial machines affected things, esp, Monotype, one picture -- or one tiny part, maybe -- is Dowding's <cite>Factors in the Choice of Type Faces</cite>. Wace edition, if at all possible. Skip the other Dowding book.</p>
      <p>As you get into photocomp &amp; the contemporary era, everyone's probably got an opinion. While I don't agree with some of what Kinross' author's say, I don't think anyone would debate the importance/quality of what the Hyphen Press publishes.</p>
      <p><a href="http://hyphenpress.co.uk/" title="http://hyphenpress.co.uk/">http://hyphenpress.co.uk/</a></p>
