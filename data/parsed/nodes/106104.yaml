      <p>A lot has been written on the art of making and using typefaces, and on the history of type.</p>
      <p>How type relates to history in general, though, has only been hinted at in asides; i.e. that its development suffered in Spain and Russia because of heavy censorship. How it relates to philosophy has been touched on hardly at all.</p>
      <p>It's not a coincidence that the Netherlands, home of the Elzevirs, has been very influential. Caslon, and even Times Roman, both show a profound Dutch influence.</p>
