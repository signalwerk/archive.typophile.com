      <p>Don, the arts are not merely reactive, but, being part of cultural ecology, shape civilization.</p>
      <p>For instance, with regard to your explanation of Art Deco, why did earlier eras of technological advances not produce Art Deco? And isn’t it putting the cart before the horse to say that “sleek new products” gave rise to Art Deco?</p>
      <p>Paradoxically, the technological advances of the early 20th century were employed in the commercial arts to produce historicism. That was Benton’s agenda at ATF for Linotype, and Morison’s at Monotype.</p>
