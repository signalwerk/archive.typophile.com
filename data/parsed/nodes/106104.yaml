    <p>Hello,</p>
    <p>I am a new member of this group. I am not a graphic designer, nor a font/typeface designer. However I am fascinated with fonts, their history, philosophy and art. And of course their creators.</p>
    <p>Since there is a note saying that any subject can be posted to this forum, here is where I am doing so. However, if there is a more appropriate forum to do so, I would be grateful to know about it.</p>
    <p>Thank you,</p>
    <p>Shab</p>
