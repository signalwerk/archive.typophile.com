      <p>Type design is a very narrow and specific subject, when you focus just on letter forms. However, it lies at the intersection of art, science, industry, literature and culture, so in another way what is relevant to its history is vast. So really you have to start with a specific question—almost any will do, but it needs to be authentic, coming from you, and specific, if you are to make satisfying progress in your efforts, in my opinion. So what is your specific question?</p>
      <p>Basic more recent works than Updike that will give you some grounding are Bringhurst's <em>Elements of Typographic Style</em>, though it is narrower than it presents itself, and <em>Letters of Credit</em> by Tracy, which is broader than it presents itself.</p>
