      <p>Also interesting are historical advances that did <em>not</em> affect the appearance of type — such as, for instance, the invention of printing. Gutenberg, of course, gave us his best impression of the scribal hand of a monk.</p>
      <p>Also, the invention of digital type began not with forms that arose naturally out of the limitations of the medium but with desperate imitations of the best of the metal type era.</p>
      <p>One possible conclusion: historical shifts outside the realm of typography have a more profound impact on the forms of letters than technological shifts within typography.</p>
      <p>Though this does ignore the contributions of individual designers, who, after all, are the people responsible for advances in the design of type.</p>
