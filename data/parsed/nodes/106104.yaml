      <p>Such a vast area.<br>
      Some examples on history and art movements:<br>
      1. Blackletter typefaces were an essential part of the issue of German cultural identity from the 15th century until about 1942, as opposed to the countries in the area formerly ruled by the Roman Empire. See  _Blackletter: Type and National Identity_ edited by Peter Bain and Paul Shaw, 1998 ISBN 1-56898-2.<br>
      2. The development of display typography in the 19th century was fueled by the rise of the consumer society. Visual advertising was contested between typography and lithography. Type makers continually innovated to try and match the visual impact of lithography.<br>
      3. The rise of imperialism, jingoism, and assertiveness circa 1898 shifted typographic interest from fine esthetics and carefully constructed artistic printing to strong typefaces, such as Doric, a heavy sans designed for scare-head newspaper headlines such as "War in Cuba."<br>
      4. The breakdown of Western Civilization's consensus of rationality, order and optimism in the early 20th century spawned radical new thinking in politics and the arts, including new typefaces which were designed for crude impact.<br>
      5. The post WWI zeitgeist of technological advances and sleek new products produced the Art Deco ethos, which included the geometric and simplified designs for typefaces<br>
      6. Science Fiction created a demand for futuristic technology typefaces, usually very simplified with bizarre features.<br>
      I trust you can think of many others.<br>
      Don</p>
