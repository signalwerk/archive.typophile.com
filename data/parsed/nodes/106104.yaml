      <p>Nick, I don't see Benton an historicist. Is Hobo historicist? Or Souvenir?  Benton just tried to produce better crafted versions of whatever was out there, plus some new designs like Clearface, and other things. To me he didn't really have an overall agenda, other than to sell type. He did have an approach to type, which was to keep himself invisible, and sell good craftsmanship. The historicism was under way, with William Morris having made it fashionable in the 90s. M.F. Benton is just riding the crest of all the various waves passing by. </p>
      <p>Morrison was clearly historicist, but even he is complicated. Monotype did revivals before his influence, and he championed Gill, and at least backed Times New Roman, which wasn't really historicist.</p>
