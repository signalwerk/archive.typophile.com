      <p>Dom:</p>
      <p>I won’t post anytinhg new here, but I think the insight of someone working at a Faculty (as a Design Technician) can probably add some factual data to your magazine feature.</p>
      <p>3)<br>
      I work in a faculty in Porto, Portugal. It’s a traditional Fine-Arts School.<br>
      The course is “traditional” Graphic Design oriented, having a strong multimedia component on the last 2 of a 5 year course. So as Nick said, to study Type Design in deph, here too is complicated:</p>
      <p><cite>“If you are looking to study type design, you will probably not find it as a separate course near you, and it is an oddity as part of a general design degree.”</cite></p>
      <p>Actually, Type Design as a discipline, is integrated on the second year of the Graphic Design course and it can not be taught separately. It must stress that, on the second year, students also do composition and poster design. So it can be tricky for them to invest enough effort in this subject, and drawing, and history, and geometry, and...</p>
      <p>Nevertheless, there are some students who do persue Type Design as a “personal quest” all the way to the fith year and develop very interesting work.</p>
      <p>Actually this last year there was a pretty valuable effort from one of the fourth year teachers to implement a Type Design assignment - Students were required to complete a working digital font from scratch. So many of them who had never used font software really had to take this on. The only problem here was that the school lacks the infrastructure to do this... maybe next year we’ll be ready. This is due in part to the old traditional way of aproaching Type Design - Paper Drawings! I’m not against it, I still do them as a mandatory phase of Type developing, but the problem develops if you don’t materialize your fonts and test them on real samples.</p>
      <p>So, you can say that at least this Faculty (taking on account that this is a traditional school) is doing it’s share <cite>on getting students intersted in font design and helping them persue the art as a career</cite></p>
      <p>This takes me to the other two questions. </p>
      <p>2)<br>
      At least here is very difficult to develop Type Design as a profession because there’s a very small demand for it, and usually it’s lettering. So the few that develop should really be enough to “freshen the industry bood”. Altough... I really don’t know this. My doubt comes from the last “big clients” like Fundação de Serralves, Grupo BPI and Grupo EDP. They all comissioned their work from international companies... so I think that, as a nation, we need to overcome our national prejudice first to stregthen our own industry.</p>
      <p>1)<br>
      Chris said it all!</p>
      <p>By the way, which computer arts issue will your feature be on? I’d like to read it then!</p>
      <p>Cheers,<br>
      Pedro</p>
      <p>——<br>
