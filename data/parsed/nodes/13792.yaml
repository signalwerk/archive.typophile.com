      <p>“1) Is it easy for font designers to sell work and make money - is it a good career move?”<br>
      Making the move into type design is not only accomplished by springing up with an irresistable and original new design. There are other jobs too, but I a person is talented enough to start out with best sellers, yeah! it’s a good career move. . </p>
      <p>“2) Is there enough new blood coming into the industry?”<br>
      Over the last 10 years, I think there’s been enough new blood to make a couple of Hollywood epics. New designers are coming into the industry in better shape than ever. </p>
      <p>“3) Do colleges and universities do a good enough job of getting students intersted in font design and helping them persue the art as a career?”<br>
      Some do, and those send not just designers/ Other universities are not so thorough, but for the top 1% of potential type designers, it’s the student, not the school.</p>
