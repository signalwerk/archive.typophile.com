      <p>Dom, </p>
      <p>a hint: people prefer to say “type design” rather than “font design”. Typefaces are the letterform designs while fonts are merely the digital files that store them. Similarly, you wouldn’t call a digital photographer a “JPEG designer”. </p>
      <p>Regards,<br>
      Adam</p>
