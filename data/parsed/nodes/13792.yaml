    <p>Hi everyone - i’m writing a feature for a UK-based gfraphic design mag called Computer Arts on what life for font designers is like at the moment - what do you guys think?</p>
    <p>1) Is it easy for font designers to sell work and make money - is it a good career move?</p>
    <p>2) Is there enough new blood coming into the industry?</p>
    <p>3) Do colleges and universities do a good enough job of getting students intersted in font design and helping them persue the art as a career? </p>
    <p>Thanks</p>
    <p>Dom Hall</p>
