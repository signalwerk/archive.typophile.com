      <p>1) Is it easy for font designers to sell work and make money - is it a good career move?</p>
      <p>It’s very difficult to make all your income from type design. Many independent foundries are run by people with supplememtnal forms of income, such as graphic design and teaching. Many successful foundries don’t rely on retail font sales, but on commissioned work. Starting out with a best seller, hmm, you may be a one-hit wonder! (But hopefully the royalties will last for a few years, subsidizing subsequent flops, and the reputation will lead to commissions.)</p>
      <p>2) Is there enough new blood coming into the industry?</p>
      <p>All the time. Independent foundries have blossomed as a business sector, thanks to e-commerce.</p>
      <p>3) Do colleges and universities do a good enough job of getting students intersted in font design and helping them persue [sic] the art as a career?</p>
      <p>As good as can be expected, given that it’s a small industry. If you are looking to study type design, you will probably not find it as a separate course near you, and it is an oddity as part of a general design degree. There are very few places where type design can be studied in depth, such as the MA at Reading University.</p>
