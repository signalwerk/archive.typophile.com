      <p>I think Nick has it right. I don’t think people go into type design for the money—designers go into it because they have a burning interest. If what you call a good career move is doing something that interests you then yes. If you think you will make Bill Gates jealous, then you will be disappointed.</p>
      <p>ChrisL</p>
