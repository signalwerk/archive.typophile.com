    html: |-
      <p>Object &gt; Path &gt; Outline Stroke<br>
      then<br>
      Pathfinder Palette &gt; Add to Shape, then Expand</p>
      <p>If your outlines are complex or dashed, instead of Object &gt; Path &gt; Outline Stroke, you will need to use<br>
      Object &gt; Flatten Transparency with Vector/Raster balance at 100, and Convert Strokes to Outlines checked.</p>
