    html: |-
      <p>I came across this thread looking for a solution to the double stroke problem.  Here's the solution that satisfied my needs, based on the techniques mentioned in this thread so far:</p>
      <p>1. Convert Text to Outlines (cmd + shift + o)<br>
      2. Object &gt; Path &gt; Offset Path.  Set offset to the stroke you would like.<br>
      3. Object &gt; Compound Path &gt; Release<br>
      4. Ungroup.  (cmd + shift + g)<br>
      5. Pathfinder &gt; Add to Shape, then Expand.</p>
      <p>The result is a shape that mimics a text stroke.</p>
    html_clean: |-
