    html: "<p>Why do you need to put a stroke on it? Try doing a path-offset path (by the number of points you want) and it will create a separate shape behind the type that is slightly larger. That way, you aren't crowding the inner elements of the type: it stays completely intact, you are just building around it.</p>"
