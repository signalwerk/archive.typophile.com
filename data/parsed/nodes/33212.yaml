      <p>You could approximate this look with bold condensed weights of Radiant, available from many foundries. In fact, I think that's what "Gwyneth Paltrow" and "Summer 2004" are set in.</p>
      <p><a href="http://www.myfonts.com/fonts/redrooster/radiant/rr-bold-condensed-alternate/" title="http://www.myfonts.com/fonts/redrooster/radiant/rr-bold-condensed-alternate/">http://www.myfonts.com/fonts/redrooster/radiant/rr-bold-condensed-altern...</a></p>
      <p>Font Bureau's Roxy is another option:</p>
      <p><a href="http://fontbureau.com/fonts/sans/Roxy/charset" title="http://fontbureau.com/fonts/sans/Roxy/charset">http://fontbureau.com/fonts/sans/Roxy/charset</a></p>
      <p>It has the rounded A you'll need.</p>
