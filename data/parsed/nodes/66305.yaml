  html: <p>I've re-drawn the Italics, and started testing the weights with lower case glyphs. I try not to over-do the diagonal stress, so it'd work through the weights with fairly egual strength, even though in thin weights there is only so much one can do. That is why tried to damp the heavier weights.</p>
