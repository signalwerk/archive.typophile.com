      <p>I enjoyed Cloverfield, but I can understand people having a problem with the camera work. I also liked the ST teaser. </p>
      <p>I've got a copy of the Star Fleet Technical Manual from the Seventies and I can confirm the Microgramma reference. (I also have the set of blueprints of the Enterprise from back then, too.) (Me, a Trekkie? Never. :-)</p>
      <p>FWIW, Eurostile (set in all caps) can be substituted for Microgramma. The caps are identical. Both were designed by Aldo Novarese.</p>
  - id: 253608
    user_id: 17377
    user_name: Scott Leyes
    user_path: null
    date_raw: 23 Jan 2008 — 5:33pm
    date: 2008-01-23T17:33:00
    votes: null
    html: <p>BTW, the ST Technical Manual and Mr Scott's Guide to the Enterprise are both considered "Taboo" by the folks who own/run the license (Paramount). They usually only bless the newer stuff (written published after TNG started up), and 90% of that is by Mike &amp; Denise Okuda (Mike is responsible for most all of the graphics on next Generation/DS9/Voyager/&amp; all but the earliest movies). For example, all of the condensed fonts in TNG displays/signage looks like compacta, but it's actually Corporate Condensed (which I always found funny for a Trek universe).</p>
