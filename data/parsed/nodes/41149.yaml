    html: <p>According to the <a class="freelinking external" href="http://www.amazon.com/Starfleet-Technical-Manual-TM-379260/dp/B000LI40T8/ref=sr_1_4?ie=UTF8&amp;s=books&amp;qid=1200947451&amp;sr=8-4" rel="nofollow">Starfleet Technical Manual</a>, the hull markings are in Microgramma Extended.</p>
