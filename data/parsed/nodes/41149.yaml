    html: <p>BTW, the ST Technical Manual and Mr Scott's Guide to the Enterprise are both considered "Taboo" by the folks who own/run the license (Paramount). They usually only bless the newer stuff (written published after TNG started up), and 90% of that is by Mike &amp; Denise Okuda (Mike is responsible for most all of the graphics on next Generation/DS9/Voyager/&amp; all but the earliest movies). For example, all of the condensed fonts in TNG displays/signage looks like compacta, but it's actually Corporate Condensed (which I always found funny for a Trek universe).</p>
    html_clean: <p>BTW, the ST Technical Manual and Mr Scott's Guide to the Enterprise are both considered "Taboo" by the folks who own/run the license (Paramount). They usually only bless the newer stuff (written published after TNG started up), and 90% of that is by Mike &amp; Denise Okuda (Mike is responsible for most all of the graphics on next Generation/DS9/Voyager/&amp; all but the earliest movies). For example, all of the condensed fonts in TNG displays/signage looks like compacta, but it's actually Corporate Condensed (which I always found funny for a Trek universe).</p>
