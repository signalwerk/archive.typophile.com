    html: <p>Yes, Starfleet Bold Exteded was a modified version of Microgramma Bold Extended with an outline, usually a red outline when used for hull markings (note the image of the back of the box shows only uppercase, distinguishing Microgramma from Eurostile). This is a later style that made its way into canon in the movies.</p>
