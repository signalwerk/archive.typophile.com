    <p>[Originally posted in: "Critique » Typography / Composition"]</p>
    <p>Hi folks,</p>
    <p>Web licensing issues aside, what do you think of this type combination I suggested recently (Graublau Sans Web with Lucida sanserif), and my typeset example?</p>
    <p>Blog post:<br>
    <a href="http://nicewebtype.com/notes/2009/05/22/nice-web-type-likes/" title="http://nicewebtype.com/notes/2009/05/22/nice-web-type-likes/">http://nicewebtype.com/notes/2009/05/22/nice-web-type-likes/</a></p>
    <p>Example:<br>
    <a href="http://nicewebtype.com/fonts/graublau-sans-web/" title="http://nicewebtype.com/fonts/graublau-sans-web/">http://nicewebtype.com/fonts/graublau-sans-web/</a></p>
    <p>If you’re not sure where to start, consider (from the text in the example page itself) any of my claims about the two faces. Do you agree? Do you disagree? Why? Also, please criticize the typesetting of the example itself.</p>
    <p>If we want web typography to be respected as a part of our art and craft, web typesetting deserves our fullest criticism – judging the work on aesthetic merits while accounting for available technologies.</p>
    <p>Tim</p>
