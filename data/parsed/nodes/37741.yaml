      <p>“The body in minion will be fine with the header in Arial and you could try to place the indent in italic helvetica, etc”</p>
      <p>I think if you are doing the body in Minion, then you should choose either Helvetica or Arial for heads and indents. Use the regular italic and/or bold for the heads, contrasting or matching the indent depending on the tone you need for the content. E.G. if it’s a softer story, use Helvetica regular heads and regular or italic for the indent, or when you’ve got something harder, use the Helvetica bold for heads and sightly condensed italic for indents. If you want, you can also get a Minion Bold Condensed of some sort for heads. If you get enough Minion, you could easily do the whole thing in Minion for a Modern/Serious/Traditional/Formal magazine for medical articles.</p>
      <p>Cheers!</p>
