      <p>After seeing the first example, I was going to suggest the indenting of the abstract, which you have done on the second example. I suggest trying it at double the amount ... it may not look better, but it is worth a try (your goal is to keep that line of text in the 60-90 characters per line range, to improve readability).</p>
      <p>Also, some publications will use italics for the abstract to signify it is not a part of the article itself. I’m ambivalent on that one myself. Blocks of italic can be harder to read, but a visual signal of uniquness is useful.</p>
