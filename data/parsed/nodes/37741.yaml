      <p>Two columns sounds right for the line width you describe. You might find 1 cm gutter between to be a bit much. 1 pica is traditional and I think 1 cm is over 2 picas. Do a test and see, you might want to cut the gutter to 0.5 or 0.75 cm.</p>
      <p>Many articles in scientific works start with an abstract, and this is traditionally set in a single column. Use a larger type size and an indent so that the line measure does not get to be too long.</p>
      <p>Illustrations can be either one or two columns wide, as appropriate. A 1 column illustration in the middle of a two column layout can be problematic, as you have been told, because the word spacing around then (where the type goes to a half column) can be too loose.</p>
      <p>What you really need to do is to build a dummy page now, to see how things look. Post the PDF and we will be better able to comment on it.</p>
