    html: |-
      <p>Thanks for the offer John, I design on the Mac and generate all final fonts on the PC. </p>
      <p>But this is all so very interesting. The vfb files that I'm using to generate the fonts that are giving me these odd error messages are fairly old, they go back to 2003 or so. I might have made them with FL 4.x (could they be as old as FL 3?) That is the version I started on.</p>
      <p>I created a new vfb, copied all of the font header information from the old data, copied all of the glyphs and appended them to the new file, copied the features and the classes, and generated a new font, and none of those rasterizing errors were present, when I ran the new font through Font Validator.</p>
      <p>So I wonder if they were really errors or some odd sloppy file housekeeping inherited from some old version of FL.</p>
