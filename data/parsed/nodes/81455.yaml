      <p>I assume you’re validating a TrueType font and that the error appears in the section for the PREP table?</p>
      <p>In that case it appears something is wrong with the code for the TrueType hinting. Did you do the hinting in FontLab only, or also used other tools?</p>
      <p>BTW: There is a help section in Font Validator where every error code is explained a little more in detail. It’s in the same directory as the application itself.</p>
