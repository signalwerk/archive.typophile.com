      <p>Hi Charles,</p>
      <p>You're asking a very good question. I wasn't at TypeCon, so I don't know if any model syllabi were distributed.</p>
      <p>(I'm taking some time off from teaching to go back to school myself.) </p>
      <p>I know I would tend to put off refinements such as oldstyle figures and small caps to the second semester. On the theory that first students have to recognize color in text sizes and shapes in display sizes, before they can appreciate these and recognize them on sight. On the other hand, actual composition assignments are necessary during the first semester. I tested students on ligatures in the first semester, but they need to use them for it to sink in.</p>
      <p>HTH,</p>
      <p>-Peter Bain</p>
