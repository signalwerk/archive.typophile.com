      <p>I've had that happen, resulting from a corrupted glyph path.<br>
      To fix it is painstaking, you have to progressively delete glyphs, compiling each time, to find the bad glyph at which point the process is crashing.<br>
      Then, replace that glyph with fresh paths.</p>
