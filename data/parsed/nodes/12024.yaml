    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>: <a href="/node/12212" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Tools</a>/<a href="/node/12015" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Software</a>&nbsp;:&nbsp;Fontographer</strong></p>
    <p>Fontographer is design software; an application for designing fonts and exporting various <a href="/node/13544" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Font</a> file&nbsp;formats.</p>
    <p>Sometimes people incorrectly refer to <a href="/node/12023" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">typographers</a> and <a href="/node/15002" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">type designers</a> as “fontographers” – an incorrect reference to the software and not the practice of designing&nbsp;type.</p>
    <p>The program first appeared on the market in 1985, released by <a href="/node/add/wiki?edit%5Btitle%5D=Altsys" title="Create node &quot;Altsys&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Altsys</a>, a software developer from Texas. Altsys, who developed Fontographer from version 1.0–4.0 was bought during the early 1990s by <a href="/node/44707" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Macromedia</a>. Macromedia then released version&nbsp;4.1.</p>
    <p>Following version 4.1.x, Macromedia halted the development of Fontographer. For almost a decade, no serious work was done to the software, although several mysterious beta versions (Version 5) were floated to selected members of the type design industry. During the late 1990s, Fontographer began losing market share among professional designers, as <a href="/node/12240" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">FontLab</a> became a more powerful tool. The lack of <span class="caps">OS</span> X support for Fontographer inflicted another serious blow to its market&nbsp;share.</p>
    <p>On May 9 2005 <a href="/node/12240" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">FontLab</a> Ltd. announced the licensing of the full Fontographer product line from <a href="/node/44707" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Macromedia</a> Inc. and its further&nbsp;development.</p>
    <p>Many well-established (i.e. older) type foundries have built custom <a href="/node/13582" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Python</a> scripts that automate repetitive tasks in Fontographer. Thus some firms still use&nbsp;Fontographer.</p>
