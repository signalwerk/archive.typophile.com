    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a>: <a href="/wiki/Tools" class="freelinking" rel="nofollow">Tools</a>/<a href="/wiki/Software" class="freelinking" rel="nofollow">Software</a> : Fontographer</strong></p>
    <p>Fontographer is design software; an application for designing fonts and exporting various <a href="/wiki/font" class="freelinking" rel="nofollow">font</a> file formats.</p>
    <p>Sometimes people incorrectly refer to <a href="/wiki/Typographer" class="freelinking" rel="nofollow">typographers</a> and <a href="/wiki/Type%20Designer" class="freelinking" rel="nofollow">type designers</a> as "fontographers" -- an incorrect reference to the software and not the practice of designing type.</p>
    <p>The program first appeared on the market in 1985, released by <a href="/wiki/Altsys" class="freelinking" rel="nofollow">Altsys</a>, a software developer from Texas. Altsys, who developed Fontographer from version 1.0–4.0 was bought during the early 1990s by <a href="/wiki/Macromedia" class="freelinking" rel="nofollow">Macromedia</a>. Macromedia then released version 4.1.</p>
    <p>Following version 4.1.x, Macromedia halted the development of Fontographer. For almost a decade, no serious work was done to the software, although several mysterious beta versions (Version 5) were floated to selected members of the type design industry. During the late 1990s, Fontographer began losing market share among professional designers, as <a href="/wiki/FontLab" class="freelinking" rel="nofollow">FontLab</a> became a more powerful tool. The lack of OS X support for Fontographer inflicted another serious blow to its market share.</p>
    <p>On May 9 2005 <a href="/wiki/FontLab" class="freelinking" rel="nofollow">FontLab</a> Ltd. announced the licensing of the full Fontographer product line from <a href="/wiki/Macromedia" class="freelinking" rel="nofollow">Macromedia</a> Inc. and its further development.</p>
    <p>Many well-established (i.e. older) type foundries have built custom <a href="/wiki/Python" class="freelinking" rel="nofollow">Python</a> scripts that automate repetitive tasks in Fontographer. Thus some firms still use Fontographer.</p>
