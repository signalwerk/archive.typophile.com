  html: |-
    <p>I'm trying to figure out the name of this particular script font and I'm stumped! It's used throughout <a href="http://loveshackfancy.com" title="http://loveshackfancy.com">http://loveshackfancy.com</a> (although they appear to use a variety of fonts, the only ones I can identify are Callie Hand and Ginette). These images might not all be the same font either (where it says "Halter Mini Dress" it appears to be different for the first two words... whereas the word DRESS exactly matches the images above it).</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/collection_banner_dresses_4001.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/collection_banner_bottoms_4230.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/p_fancy-dress-4_5128.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/p_love-halter-dress-2_4482.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/p_halter-mini-dress-5_4054.png"></div><p></p>
    <p>Can anyone help me? Hoping it's actually a font...</p>
