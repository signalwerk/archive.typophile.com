      <p>I’ve got 2 of these in the works at the current time. Both are fully functional but need a little design refinement.</p>
      <p>1. Smalltalk generator. Remember this one? It spews out pretentious things to say at type conferences. I was hoping to release this before/at TypeCon but ended up being too busy running to and fro to get it out there.</p>
      <p>2. Typophile RSS reader. This aggregates all feeds into one stream, but flip it over and you can set it to focus in one any particular group (General Discussions, wiki, etc)</p>
      <p>What would be the killer widget? What does everyone want to see?</p>
