      <p>You're right Georg, Phosphor and Red Rooster's <a href="http://www.myfonts.com/fonts/redrooster/phosphate-rr/" rel="nofollow">'Phosphate'</a> are almost exact copies of the Erbar typeface. Letraset's <a href="http://www.myfonts.com/fonts/letraset/follies/" rel="nofollow">'Follies'</a> is modified more, but still quite similar. However, the '!' mark sets the 'identical' ones apart from the Erbar design, and Michael seems right about 'Phosphor' being the answer this time.</p>
      <p>- Mike Yanega</p>
