    html: <p>Unfortunately, there is no Light font of <a href="http://www.fontshop.com/fonts/downloads/itc/itc_officina_std_complete_vp/" rel="nofollow">ITC Officina</a>. It's probably too late to change, but <a href="/wiki/Erik%20Spiekermann" class="freelinking" rel="nofollow">Spiekermann's</a> later release <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_unit_complete_collection_ot/" rel="nofollow">FF Unit</a> includes Light and Thin weights.</p>
