    <p>Hi there.</p>
    <p>The company I work for has recently chosen to use Officina in all branding.</p>
    <p>We have purchased the standard family package but this didn't include a light weight. </p>
    <p>The problem we have come across is that the only light version of Officina I can find is a Display cut which does differ from the original, especially the serif I which is important as this letter is in our name. </p>
    <p>Is there another light version out there which I have missed.</p>
    <p>Thanks Jon</p>
