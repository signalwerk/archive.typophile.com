    html: <p>I can't find this exact font but I found one very similar to it. It was published in 1999 by Bright Ideas (a defunct foundry), is named <strong>Stacker</strong>, and is now apparently freeware available on the net. Do a search for "Bright Ideas Stacker font", in quotes, to find a download link.</p>
