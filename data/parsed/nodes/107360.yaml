    html: |-
      <p>The one I would go with is -Stack.</p>
      <p>I remember it from the Letragraphica section at the back of the old 70's-80's Letraset catalogue.<br>
      Although Bowfin has it listed from a Spanish Letraset page scan, and Luc Devroye seems to have the same pic.<br>
      Not sure about a digital version though.<br>
      Hope this helps.</p>
      <p><a href="http://bowfinprintworks.com/LinedFontGuide05.html" title="http://bowfinprintworks.com/LinedFontGuide05.html">http://bowfinprintworks.com/LinedFontGuide05.html</a><br>
