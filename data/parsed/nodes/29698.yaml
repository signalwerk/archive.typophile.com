    html: |-
      <p>I agree that there's no <em>reason</em>, and I've personally never used ligatures myself other than the 'standard' ones like fi, fl, and the like. In modern use, there is no real reason to use ligatures besides that of clashing shapes. I find the ct and st ligatures for example way too distracting and too culture-specific.</p>
      <p>But it's fun to look at mediaeval texts using ligatures where adjacent letters share stems or bowls as space-savers and to try to decipher them. There's no clash between the a and the t, but I tried playing the mediaeval scribe for fun.</p>
      <p>Eben, thanks for the crit. I actually drew the letters from scratch just to set 'Beatrice'; they don't come from an existing design. As you probably suspected, I drew the a and the t separately and just hacked and sewed them up. I have now modified the letters a bit following your suggestion.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Beatrice2_5180.jpg"></div><br>
      I think it does read better, although it still demonstrates how foreign the mediaeval conjoined-at-the-stem ligature is to the modern eye.<p></p>
