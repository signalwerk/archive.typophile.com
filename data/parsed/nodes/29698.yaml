      <p>I looked at <a href="http://www.myfonts.com/fonts/dstype/esta" rel="nofollow">Esta</a> and <a href="http://www.emigre.com/fontpage.php?PMEJLigR.html" rel="nofollow">Mrs Eaves</a>, two with lots of ligatures that I knew off the top of my head, but neither had it. Mrs Eaves is known as the "ligature queen" and it doesn't have one, so I'm not sure if you're going to have much luck. But I hope I'm wrong.</p>
      <p>If you can't find one but are still wedded to the idea of an at ligature, you may need to do it yourself in Illustrator or FontLab. You could either take a ct ligature and move the join to the at, or take the tail of the a and attach it to the t. Actually, looking at the Mrs Eaves ligatures font, you could switch an e for a t in the ae ligature, but you'd probably either have to lower the crossbar of the t or raise the bowl of the a to make a straight horizontal connection.</p>
    html_clean: |-
