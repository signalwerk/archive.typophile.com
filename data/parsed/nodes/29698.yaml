      <p>The problem with your critique is not that you are somehow 'wrong'. I just think one of the the assumptions you seem to be making may inhibit the optimal success of this kind of ligature: the assumption being that whole parts of the letters may be able to stay rigid or intact. in the process. In order to make my rough samples look even sorta kinda okay, I had to give the crossbar more weight so it could better compete for attention with the arcs, and I had to shorten the tail of the t. Better still to put all the elements in play! If you leave the bowl on the way to the t at an angle you may be able to straigten it out by the end. Or you might find an arc shape works better. </p>
      <p>But if there is one thing I keep bumping into over &amp; over again as I design type it's the reality that every part relates and has to be seen in the context of every other part, feature or aspect. So it stands to reason that you might have to rethink the whole thing. Who knows maybe the over shoot in the top of the a will look good if it's made a bit taller to make room for the arc <cite>in the context of the rest of it...</cite></p>
    html_clean: |-
