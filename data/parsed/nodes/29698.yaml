      <p>Paradoxically, it's when letters become less themselves and more parts of larger wholes (that are read faster than the compiling of the individual letters) that readability (as opposed to letterwise legibility) is promoted; and looking deliberatively at the individual letters does not reveal this necessity.</p>
      <p>For example, I've tried to make the tittle in my Patria <cite>slightly</cite> too large. When a person tells me that it's slightly too large (and it's happened a few times already) I know (well, at lease I think) I've succeeded.  :-&gt;</p>
      <p>hhp</p>
