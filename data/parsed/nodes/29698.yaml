    html: |-
      <p><cite>Why are there ct and st ligs? </cite> As far as I can tell the long s used to need a connection. When the s sharnk to x height it kept it's connection in some cases. If you look in an old book with long s' you will see it's quite natural. I don't know about the ct ligature.  But before you write it off go look at some good ones. You may find yourself changing your mind.</p>
      <p><cite> any reason not to ligate from the tail of the a </cite></p>
      <p>Indeed. That seems more natural. But they alook like Be AT rice to me that way.</p>
      <p>I had a quick go at it - but I actually like Allessandro's Caps best.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/junk_3962.gif"></div><p></p>
      <p><cite> There’s no REASON to be chickenshit afraid of ligation. </cite></p>
      <p>Except fear of abject failure. Doing it well is tough. If you have a deadline or some other reason that makes it impractical it maybe isn't the best plan. On the other hand if you have time to play in - you can't do anything well unless you do it alot. So I say ligate to your hearts' content. Upsetting the apple cart ( and then fixing it) is a good way of finding out how the apple cart works.</p>
