    <p>Dear Friends</p>
    <p>I'm looking for a face along the lines of Adobe Garamond, Jenson, or Centaur that features an <em>at</em> ligature. Would any of you know of such a face?</p>
    <p>Specifically, I'm trying to do a masterful job in setting the name "Beatrice," so I'm very interested in any ideas you may have for setting this name. The client is a marriage and family therapist.</p>
    <p>Thanks to Christopher Lewis from myfonts.com for tuning me into this fontastic resource of typographic knowledge and exploration!</p>
    <p>—Jaddie</p>
