      <p>Thinking about this more deeply:<br>
      I don't know if anybody has brought this up, but the important question is why have an "at" ligature? A question not based on a general dislike of ligatures, but one based on a like of focused purpose.</p>
      <p>I presume it's because of some sort of separation/joining between the two parts of the name, both in terms of syllabification as well as the fact that "Bea" is the common short form. So maybe a ligation is not the only way to mark this; maybe a flourished "a" would be better - something like this:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/a_6255.gif"></div><p></p>
      <p>Sort of like a subtle, engrained hyphen.<br>
      BTW, in such a scheme I might abridge the left part of the crossbar of the "t".</p>
      <p>hhp</p>
