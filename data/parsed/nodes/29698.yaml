      <p>At first I thought you meant something to do with '@'. Silly. </p>
      <p>Now that I get you, here's the thing: ligatures are there to solve typgraphic problems and the cobination 'at' isn't one of these classic problems. So I don't think you will find a face with that ligature already made. </p>
      <p>You can make your own but unless you do it carefully it will jump out like a sore thumb. </p>
      <p>This 'Beatrice', will it be in running text or is it a logo? If it's in running text it might be more 'masterful' to loose the ligature. ;-) If it's a logo or something else then that might make more sense. </p>
      <p>Maybe you should look at the ligatures that made for KPN by Pieter van Rosmalen. They walk the line between decoration/embelishment &amp; success in semi-running text. Maybe he would make your ligature for you. Or you could ask around here. </p>
      <p>Here is a link <a href="http://www.caketype.com/custom_kpn.html" title="http://www.caketype.com/custom_kpn.html">http://www.caketype.com/custom_kpn.html</a></p>
      <p>Maybe you should sketch what you have in mind &amp; post an image.</p>
