      <p>That's really interesting, Eben, about how you made those tweaks to the sample aside from adding the arc. I didn't notice them before, but now I see them. That's something for me to keep in mind should I ever make a typeface of my own.</p>
      <p>On a slightly unrelated note, Jaddie, I've been wondering why the tittle (I've never used that word before) of the i is so high. When I looked at the sample of Throhand of the Font Bureau site, the reason became clear: it's because the x-height is low, and the high tittle balances the i when it is near ascending letters. But in this sample, because the only ascending letter is the B, the high tittle seems out of place. I'd suggest lowering it to a less evident spot.</p>
