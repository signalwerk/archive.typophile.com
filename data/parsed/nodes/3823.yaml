    votes: null
    html: <p>Beautiful, indeed! It's really quite lovely, and  <br>for some reason, <a href="http://www.psyops.com/html/services.html" target="_top">PsyOps</a> comes to mind if you're <br>considering distribution. RXC doesn't just run a <br>foundry, I hear he acts as a mentor for designers  <br>with potential to produce some premium final  <br>products. Give it some thought. <br> <br>I like the raised period for added handwritten <br>feel, but maybe it's just a tad too high. <br> <br>Hrant is right, we need to see a full character <br>set and maybe a bit larger to make up for the <br>low-res of the Web. <br> <br>Great work, Andrij. There is a real shortage of <br>modern handwritten scripts that really look like <br>they were made by hand and not a computer.  <br>Keep working toward that end and you'll have  <br>something unique.</p>
    html_clean: <p>Beautiful, indeed! It's really quite lovely, and  <br>for some reason, <a href="http://www.psyops.com/html/services.html" target="_top" class="link-external">PsyOps</a> comes to mind if you're <br>considering distribution. RXC doesn't just run a <br>foundry, I hear he acts as a mentor for designers  <br>with potential to produce some premium final  <br>products. Give it some thought. <br> <br>I like the raised period for added handwritten <br>feel, but maybe it's just a tad too high. <br> <br>Hrant is right, we need to see a full character <br>set and maybe a bit larger to make up for the <br>low-res of the Web. <br> <br>Great work, Andrij. There is a real shortage of <br>modern handwritten scripts that really look like <br>they were made by hand and not a computer.  <br>Keep working toward that end and you'll have  <br>something unique.</p>
