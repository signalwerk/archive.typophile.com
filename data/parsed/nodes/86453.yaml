  html: |-
    <p>Just a note to say I found the font used for the headers of many Boy Scouts of America council websites (and the national site, too). </p>
    <p><a class="freelinking external" href="http://www.scouting.org/" rel="nofollow">http://www.scouting.org/</a></p>
    <p>The font is Berstrom DT.</p>
    <p>The official BSA design guidelines for websites specify the use of Times New Roman and Arial in almost everything. The logo headers are an exception.</p>
    <p>I was trippin' trying to figure out how somebody customized TMR to look like that.</p>
