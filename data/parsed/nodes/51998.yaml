      <p>"angry young computer" seems to be a grotesque. The 1985 Phil's Photo "Homage to the Alphabet" book shows something called California Grotesque which is similar in feel, but not the details of the descenders (the g is the wrong kind, and the y tail isn't as upturned). <a class="freelinking external" href="http://www.myfonts.com/fonts/urw/grotesque-no-9/" rel="nofollow">Grotesque No.9</a> shows some of these features, but the weight isn't right. <a class="freelinking external" href="http://www.myfonts.com/fonts/agfa/atfiedler-gothic-bold/" rel="nofollow">Fielder Gothic Bold</a> shows one surviving member of what was a large family with varying widths and details in the days of phototypes.</p>
      <p>In the 60's phototypes were widely used, and gothics/grotesques came in every imaginable variation or weight, widths and letterform  feature (r curve, g tail, a tail, y tail, c closure). That means that finding the same typeface in digital font format is probably unlikely. You can search using grotesque or gothic condensed and find many of today's equivalent styles.</p>
      <p> - Mike Yanega</p>
