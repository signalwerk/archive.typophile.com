      <p>It looks like Square Grotesk, a display phototype family by Techni-Process of New York from the 1960s. My understanding is that California Grotesk was a derivative. The alternate l/c "g" looks to be a custom variation, I would have to pull the original film out of storage to check. Not digitized.</p>
      <p>Here's a page from the specimen book</p><div class="imageWrap"><img src="http://typophile.com/files/SquareGrotesk50series_6269.jpg"></div><p></p>
      <p>The Burroughs Corporation mark looks custom drawn.</p>
