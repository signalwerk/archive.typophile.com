  html: |-
    <p>I've just discovered that the printer I've been using at home, an old HP LaserJet 1200 inherited from my parents, actually supports printing at 1200 dpi by 1200 dpi. The driver I had been using only offered resolution up to 600 dpi, and I hadn't bothered to check. Silly me.</p>
    <p>I changed the driver, and printed a quick proof of my current type design experiment. Before, using the 600 dpi setting, I had judged the printer unusable for proofing type. Turns out that at 1200 dpi, it's actually quite serviceable, at least for my means and purposes.</p>
    <p>Here are some snapshots. The first and last images are of the type at 12 points; the middle two, at 14 points. The design is a continuation of the hangul text design I blogged about previously, to which I've tried adding matching Latin, Greek, and Cyrillic components. The latter two scripts in particular are very much incomplete, as are accented characters. Many glyphs are just place-holders left over from previous type design experiments.</p>
