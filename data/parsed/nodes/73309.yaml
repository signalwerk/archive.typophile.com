    <p>International Competition to Recognize Designers and Websites that Integrate Web Fonts to their Greatest Use</p>
    <p>WOBURN, Mass., Aug 17, 2010 -- Monotype Imaging Holdings Inc. (Nasdaq: TYPE), a leading global provider of text imaging solutions, has announced the Web Font Awards, an international competition designed to recognize websites that incorporate exceptional use of Web fonts. The Web Font Awards will be sponsored by Monotype Imaging with support from Carsonified, a UK-based company that produces events for Web professionals. </p>
    <p>"Now that Web fonts are a reality, Web designers worldwide are able to experience the beauty of typographic choice," said Allan Haley, director of words and letters at Monotype Imaging. "The Web Font Awards will be aimed at celebrating this newfound freedom, while also promoting awareness, adoption and outstanding use of Web fonts that exemplify the power of typography - online." </p>
    <p>Qualifying designs can be built with Web font technology from any provider, including self-built solutions, as long as the site or Web page uses actual fonts.<br>
    Further information, including submission guidelines, eligibility requirements, judging criteria and procedures, award ceremony and prize details will be announced next month and published on <a href="http://www.webfontawards.com" title="www.webfontawards.com">www.webfontawards.com</a>, where qualifying Web designs will be posted and visitors can rate designs. Designers and agencies can sign up now at <a href="http://www.webfontawards.com" title="www.webfontawards.com">www.webfontawards.com</a> to receive notification when the call for entries is open and contest rules are posted. </p>
    <p>In addition to Carsonified, producer of the Future of Web Design conferences, Monotype Imaging is working with media partners to present the Web Font Awards, including Cincinnati-based HOW magazine, which serves graphic design professionals; Creative Review, a UK-based publication focused on the communication arts; Slanted, a Germany-based typography magazine; and Novum, a graphic design magazine, also headquartered in Germany. Additional support will be provided by The Association Typographique Internationale, or ATypI, which is a nonprofit global forum and focal point for the type community and business. </p>
    <p>About Monotype Imaging<br>
    Monotype Imaging combines technology with design to help the world communicate. Based in Woburn, Mass. with offices in the U.S., Europe and Asia, Monotype Imaging brings text imaging and graphical user interface capabilities to consumer electronics devices such as laser printers, copiers, mobile phones, digital televisions, set-top boxes, navigation devices, digital cameras, e-book readers and consumer appliances. The company also provides printer drivers and color imaging solutions to printer manufacturers and OEMs (original equipment manufacturers). Monotype Imaging technologies are combined with access to more than 13,000 typefaces from the Monotype®, Linotype® and ITC® typeface libraries - home to some of the world's most widely used designs, including the Times New Roman®, Helvetica® and ITC Franklin Gothic™ typefaces. Fonts are licensed to creative, business and Web professionals through e-commerce portals, direct and indirect sales and custom design services. Monotype Imaging offers industry-standard font solutions that support all of the world's major languages. Information about Monotype Imaging can be found at <a href="http://www.monotypeimaging.com" title="www.monotypeimaging.com">www.monotypeimaging.com</a>.<br>
    Monotype is a trademark of Monotype Imaging Inc. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. Times New Roman is a trademark of The Monotype Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. Linotype is a trademark of Linotype GmbH registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. Helvetica is a trademark of Linotype Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions in the name of Linotype Corp. or its licensee Linotype GmbH. ITC is a trademark of International Typeface Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. ITC Franklin Gothic is a trademark of International Typeface Corp. and may be registered in certain jurisdictions. All other trademarks are the property of their respective owners. © 2010 Monotype Imaging Inc. All rights reserved.</p>
