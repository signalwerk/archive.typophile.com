    html: <p>I would also suggest the DIY approach of writing it in actual lipstick, and then go about vectorizing or taking a picture of it, whichever the case may be. Might just be more of a person preference, but I would feel a much stronger sense of attachment by doing it that way. Hands on approach to something like that is also something great to achieve.</p>
