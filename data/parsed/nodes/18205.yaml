    html: |-
      <p>&gt; InDesign and better fonts </p>
      <p>Luc, nice to see you here again. You may have missed my point, I said InDesign <em>and</em> OpenType fonts provide an <em>automatic</em> solution. By <em>better</em> fonts I meant OpenType fonts with more ligatures (mapped using GSUB) than your typical Type 1 font. As opposed to <em>same</em> OpenType fonts with the same number of ligs as your typical Type 1 font. </p>
      <p>Theoretically someone could write a page layout app that would do a good job with sets of Type 1 or regular TrueType fonts (perhaps referencing an online database mapping the expert sets in some kind of virtual GSUB). But is seems like an awful lot of work when OpenType provides all the information an app needs.  </p>
      <p>Cheers, Si</p>
