      <p>From InDesign CS2 Help System:</p>
      <p><strong>
      </strong></p><ul><strong>Ligatures</strong></ul><strong>
      <p></p></strong><br>
      InDesign can automatically insert ligatures, which are typographic replacement characters for certain letter pairs, such as “fi” and “fl,” when they are available in a given font. The characters that InDesign uses when the Ligature option is selected appear and print as ligatures, but are fully editable, and do not cause the spell checker to flag a word erroneously.<p></p>
      <p><strong>
      </strong></p><ul><strong>Discretionary Ligatures</strong></ul><strong>
      <p></p></strong><br>
      Discretionary Ligatures Font designers may include optional ligatures [i.e. – “ct”, “st”, “sp”] that should not be turned on in all circumstances. Selecting this option allows these additional optional ligatures to be used, if they are present.<p></p>
      <p>© 2005® Adobe® Systems® Incorporated®. All® rights® reserved®.</p>
