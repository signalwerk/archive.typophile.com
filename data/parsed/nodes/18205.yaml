      <p>Hi Dan-- Wie gehts?</p>
      <p>You are right that GPOS and GSUB are typical tables in<br>
      TrueType flavored OpenType fonts. But they can be found<br>
      in many blue-blooded TrueType fonts as well. These are<br>
      mostly for Arabic scripts where positioning and replacement<br>
      are crucial. </p>
      <p>Thanks to google's capability of opening binary files such<br>
      as TrueType files, you can find examples of such fonts by<br>
      a simple search such as<br>
            filetype:ttf  GSUB</p>
      <p>I do not wish to hijack this thread though.</p>
      <p>All the best and see you soon,</p>
      <p>Luc</p>
