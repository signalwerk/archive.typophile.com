    html: |-
      <p>Regarding Sii's comment that OpenType fonts are "better"<br>
      because ligatures are placed automatically.</p>
      <p>Fonts are inert objects. Ligatures are placed by applications<br>
      that use fonts. The only responsibility of a font is to<br>
      store enough information so that applications can work<br>
      with ligatures. Type 1 and truetype fonts can both store<br>
      ligatures. In the AFM files of type 1 fonts, one can store<br>
      additional information that may help applications with<br>
      automatic ligature subsitution and placement of ligatures<br>
      on the page.  The famous GPOS and GSUB tables in OpenType<br>
      can be introduced in truetype fonts as well--there is nothing<br>
      that ties these tables umbilically to OpenType.</p>
      <p>So, how exactly are OpenType fonts better?</p>
