      <p>Austin is an interesting suggestion, with a good match for the serifs.<br>
      Note that the "Austin Text" version seems to have a contrast that more closely matches the wordmark than Austin does. Also, Austin Text Roman seems a closer weight than Austin Text Semibold.<br>
      Don</p>
