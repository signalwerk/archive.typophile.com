      <p>Already asked [[<a href="http://typophile.com/node/34307">http://typophile.com/node/34307</a>|here]], [[<a href="http://www.typophile.com/node/106798">http://www.typophile.com/node/106798</a>|here]] and re-asked [[<a href="http://www.typophile.com/node/106900">http://www.typophile.com/node/106900</a>|here]] and still unsolved. So I'm afraid and even if your request is URGENT that might probably be a custom lettering for the brand. I suggested [[<a href="http://www.myfonts.com/fonts/laura-worthington/yana">http://www.myfonts.com/fonts/laura-worthington/yana</a>|Yana]] as alternative but far from being even loosely similar.<br>
