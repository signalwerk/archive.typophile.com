      <p>Agree wholeheartedly with Ryuk—this is a custom wordmark.</p>
      <p>As a base for recreating all but the cap initials, try Austin, by Commercial Type (will require editing):<br><a href="https://commercialtype.com/typefaces/austin">https://commercialtype.com/typefaces/austin</a></p>
      <p>For the initial caps (and that |O|), these faces from Letterhead Fonts may be a decent starting point for editing:<br><a href="http://www.letterheadfonts.com/fonts/confection.php">http://www.letterheadfonts.com/fonts/confection.php</a><br><a href="http://www.letterheadfonts.com/fonts/englishrose.php">http://www.letterheadfonts.com/fonts/englishrose.php</a></p>
      <p>And this one:<br><a href="http://www.myfonts.com/fonts/typotheticals/koster/">http://www.myfonts.com/fonts/typotheticals/koster/</a></p>
