      <p>I was given a word document with the typesetting on it and I was told it was Nanum Myeongjo, which I can find on my Mac, but ... in Word and (more importantly) InDesign, neither recognise the font and tell me it is a Korean font?</p>
      <p>They display it in English if I choose English, but whilst some letters are similar and some seem to be the same, some are very wrong (e.g. 'S') and the formatting is completely wrong... meaning different vertical and horizontal scaling of letters next to each other and much 'bolder' looking and the kerning and tracking much narrower.</p>
      <p>I am confused and thought my computer maybe defaulting to something like Cambria in some sort of modified form.</p>
