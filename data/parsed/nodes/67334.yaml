    html: |-
      <p>Wow, very nice work. I like how the letters consist of many straight lines rather than curves. You don't see that very often, but particularly as a book face it will look amazing.</p>
      <p>I think the 'z' looks too heavy near the stem. Also I'm wondering why the tittle on the 'j' is bigger than the tittle on the 'i'. I've never seen it before. Does it have something to do with the Renaissance style lettering?</p>
