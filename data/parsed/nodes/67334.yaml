    <p>Hello Typophile,</p>
    <p>I would like to have your critique for this scholar project.<br>
    It's a renaissance inspired italic serif based on old calligraphy principally by Arrighi.</p>
    <p>It's no vectorized yet, so there is some irregularity along the letters.</p>
    <p>Thanks in advance</p>
