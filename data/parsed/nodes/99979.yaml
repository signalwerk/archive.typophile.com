    <p></p><div class="imageWrap"><img src="http://typophile.com/files/OpenTypeNew_6366.jpg"></div><p></p>
    <p>Read Blog - <a href="http://bit.ly/SDzhIb" title="http://bit.ly/SDzhIb">http://bit.ly/SDzhIb</a><br>
    View Brochure - <a href="http://bit.ly/Wuq431" title="http://bit.ly/Wuq431">http://bit.ly/Wuq431</a> </p>
    <p>Monotype Imaging Holdings Inc. has released a new cloud-based technology that allows support for advanced, OpenType features in all popular browsers that support Web fonts and HTML5. Available to all subscribers of Monotype’s <a class="freelinking external" href="http://www.fonts.com/web-fonts " rel="nofollow">Fonts.com Web Fonts service</a>, the first-of-its kind capability enables Web designers to use discretionary ligatures, small caps, fractions and other typographic features available in OpenType fonts, regardless of whether full, native support for OpenType features is available through the browser.</p>
    <p>Using Monotype’s new solution, Web designers are able to use standard CSS techniques for controlling OpenType features, while relying on Fonts.com Web Fonts to ensure that pages render properly, as intended, regardless of the browser the visitor is using. When working on their Fonts.com Web Fonts project, users can use the OpenType feature control to activate individual OpenType features. </p>
    <p>Web designers are able to see which OpenType features are available in a selected font and which features are being used in selected text. Monotype plans to release hundreds of additional Web fonts containing OpenType features this year while enhancing the OpenType feature tool to provide greater control to designers for specifying when and which OpenType features are applied to a selection of text.</p>
    <p>Use of Monotype’s OpenType feature technology is open to all Fonts.com Web Fonts subscribers. A detailed <a class="freelinking external" href="http://www.fonts.com/support/faq/opentype-features-tab " rel="nofollow">FAQ</a> is available on how to use the new technology at <a href="http://www.fonts.com/support/faq/opentype-features-tab" title="http://www.fonts.com/support/faq/opentype-features-tab">http://www.fonts.com/support/faq/opentype-features-tab</a>. </p>
    <p>About Monotype </p>
    <p>Monotype is a leading global provider of typefaces, technology and expertise that enable the best user experience and ensure brand integrity. Based in Woburn, Mass., Monotype provides customers worldwide with typeface solutions for a broad range of creative applications and consumer devices. The company’s library and e-commerce sites are home to many of the most widely used typefaces – including the Helvetica®, Frutiger® and Univers® families – as well as the next generation of type designs. Further information is available at <a href="http://www.monotype.com" title="http://www.monotype.com">http://www.monotype.com</a></p>
