    html: <p>Supposedly, map publishers like Rand McNally did (maybe still do) a similar thing. They would make little "mistakes" here and there on their maps. Maybe a small creek would zig instead of zag. If the same mistake showed up on another publisher's map, they would use this as evidence of copyright infringement and take them to court.</p>
