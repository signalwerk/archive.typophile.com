    html: |-
      <p>Okay, this is going to sound kind of weird... It's Baker Danmark 5 with an upside down cap E. </p>
      <p>Why would it have an upside down E? One possible explanation: Back in the film font days, piracy was a big problem (some things never change). One of the tricks the producers of film fonts did was to flip or rotate one of the letters in the film font print they sent out to a customer they suspected of pirating their fonts. If the font with the flipped letter showed up elsewhere, they had their proof. Typical letters that were flipped or rotated were N, E, and U. I have seen many knock-off fonts in old film font catalogs with "wrong" characters like this.</p>
      <p>The other possibility is that the E was flipped purposely by the designer, but I doubt it.</p>
      <p>I don't know of any digital version of the Baker Danmark series, so I'm guessing this is from something printed at least a decade or two ago.</p>
    html_clean: |-
