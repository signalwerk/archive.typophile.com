    html: |-
      <p>Cover 1 (Bad Reputation):</p>
      <p>I don't think "Joan Jett" is Kabel - the 'a' is wrong. I'm guessing it's Avant Garde Extra Light with the alternate 'e'. I can barely see "BAD REPUTATION" but it's consistent with Helvetica Bold.</p>
      <p>Cover 2 (I Love Rock-n-Roll):</p>
      <p>"JOAN JETT &amp; the blackhearts" looks like Wexford, which is available as <a href="http://www.haroldsfonts.com/wexley.html" target="_blank" rel="nofollow">Wexley</a>. "I Love Rock-n-Roll" is hand-drawn.</p>
      <p>Cover 3 (Glorious Results...):</p>
      <p>"Joan Jett..." shows up as Spectrum in my old Letraset catalog. It can be found digitally as <a href="http://new.myfonts.com/fonts/martinwait/new-spectra/" target="_blank" rel="nofollow">New Spectra</a> but without some of the alternates used in your sample. The hand-drawn looking font might be harder to track down.</p>
      <p> - Lex</p>
