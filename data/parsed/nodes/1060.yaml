    html: "<p> Kent: <br>Not a caesura (which seems to be a mid-sentence thingie), but you got the letter correct, so here's your free paragraph: <br> <br>According to Parkes's \"Pause and Effect: An Introduction to the History of Punctuation in the West\" (which it seems you returned to the library a bit too early :-), the pilcrow is a symbol for \"paraph\" (which can also be marked by a double-slash, or a full-height cent-like sign), and it started as a \"C\", for capitulum. <br> <br>Complimentary Extra Bonus Sentence: <br>BTW, Parkes also says that the pilcrow replaced the \"paragraphus\" (which was marked in various ways, including a section symbol). <br> <br>Tiffany: <br>Parkes also writes: \"Scribes used the [double-slash] as a direction to the rubricator, but it was often left to fulfil the function of the paraph itself.\" <br> <br>hhp </p>"
    html_clean: "<p> Kent: <br>Not a caesura (which seems to be a mid-sentence thingie), but you got the letter correct, so here's your free paragraph: <br> <br>According to Parkes's \"Pause and Effect: An Introduction to the History of Punctuation in the West\" (which it seems you returned to the library a bit too early :-), the pilcrow is a symbol for \"paraph\" (which can also be marked by a double-slash, or a full-height cent-like sign), and it started as a \"C\", for capitulum. <br> <br>Complimentary Extra Bonus Sentence: <br>BTW, Parkes also says that the pilcrow replaced the \"paragraphus\" (which was marked in various ways, including a section symbol). <br> <br>Tiffany: <br>Parkes also writes: \"Scribes used the [double-slash] as a direction to the rubricator, but it was often left to fulfil the function of the paraph itself.\" <br> <br>hhp </p>"
