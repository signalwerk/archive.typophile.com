    html: <p> The §ection §ymbol is used to refer to §ections. It often accompanies the ¶ilcrow, which is used to signify ¶aragraphs. Often used in reference to legal documents and some other scholarly works. Please don't replace it. <br> <br>The character you're thinking of, John, is the generic currency symbol (dec 219), placed at shift-option-2 on the Mac keyboard. That's where you'll find the euro in many updated fonts; however, this placement is sometimes debated by those who feel there is a reason to keep the currency symbol. (You can find a discussion of this over on the ATypI list a couple months back.) <br> <br>-- Kent. </p>
    html_clean: <p> The §ection §ymbol is used to refer to §ections. It often accompanies the ¶ilcrow, which is used to signify ¶aragraphs. Often used in reference to legal documents and some other scholarly works. Please don't replace it. <br> <br>The character you're thinking of, John, is the generic currency symbol (dec 219), placed at shift-option-2 on the Mac keyboard. That's where you'll find the euro in many updated fonts; however, this placement is sometimes debated by those who feel there is a reason to keep the currency symbol. (You can find a discussion of this over on the ATypI list a couple months back.) <br> <br>-- Kent. </p>
