    html: <p> John; I am not sure if you are right. the § is not to be replaced. They talked about replacing the currency symbol. But they changed that since then. The § is used for example in law books. <br>The currency Symbol and the Euro sign should now be both in a typeface. The euro has become an xtra unicode number ($20AC) and it is an xtra glyph. <br> <br>Jacques </p>
