    html: "<p>Thankyou both for your comments. <br>Here is a \"light\" version of Fear: <br><a href=\"http://www.dazeofourlives.com/fearlite.gif\" target=\"_top\">http://www.dazeofourlives.com/fearlite.gif</a> <br>which WAS produced using a filter. (The Offset Path filter in Illustrator.) It's just for comparison really. The \"levels of jitteriness\" idea is very interesting. <br> <br>Re: ITC. I totally agree about their generally bland type collection. But they and they alone still pay the designer an upfront royalty for each font they publish. No other font publisher does this.  <br>Personally - and this is probably not the right forum to discuss this - I have no idea how anyone except the elite type designers make any money from their craft. Every font is so labor intensive that it just doesn't make economic sense to pursue type design as anything more than a hobby.  <br>So for me - if I'm not going to get a $2500 check from ITC in advance of sales - then why bother devoting hundreds of hours for the paltry sums I might get through other outlets? It works out to what - a dollar an hour? I cannot justify spending time on type design when I have bills to pay, etc. <br>Anyhow - sorry for the negative rant.</p>"
