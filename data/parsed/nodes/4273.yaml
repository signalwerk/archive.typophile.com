  date_raw: 4 Sep 2001 — 11:41am
  votes: null
  html: "<p>Fear is the prospective name for a decorative font: <br><a href=\"http://www.dazeofourlives.com/fear.gif\" target=\"_top\">http://www.dazeofourlives.com/fear.gif</a> <br>Obviously it is a work in progress. So far I have only come up with the HAMBURGERFONTS characters, plus \"D\". (I submitted it to ITC, but it was rejected.) <br>I'm very happy with the basic concept. I've never seen a font where the stroke essentially weaves in and out like this. Hopefully you can see the hand behind this work. It was not produced with a digital filter. <br>I'd be interested in any opinions. <br>Many thanks.</p>"
  html_clean: "<p>Fear is the prospective name for a decorative font: <br><a href=\"http://www.dazeofourlives.com/fear.gif\" target=\"_top\" class=\"link-external\">http://www.dazeofourlives.com/fear.gif</a> <br>Obviously it is a work in progress. So far I have only come up with the HAMBURGERFONTS characters, plus \"D\". (I submitted it to ITC, but it was rejected.) <br>I'm very happy with the basic concept. I've never seen a font where the stroke essentially weaves in and out like this. Hopefully you can see the hand behind this work. It was not produced with a digital filter. <br>I'd be interested in any opinions. <br>Many thanks.</p>"
