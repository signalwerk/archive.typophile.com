    html: '<p>Joe and Stephen! <br>You are too kind. Thanks for the compliments. <br>Daze gets a lot of traffic and I published the first collection in book form last year. <br> <br>The most common comparison people make is Edward Gorey: <br><a href="http://www.geocities.com/SoHo/Square/3441/object1.html" target="_top">http://www.geocities.com/SoHo/Square/3441/object1.html</a> <br> <br>But there is another humorist called Glen Baxter whose work I love. At The New Yorker Cartoon Bank: <br><a href="http://www.cartoonbank.com/search_results.asp?mscssid=CJ6KCUR2S1S92MD000GPBQXDMWKV2US9&amp;s_keywords=&amp;s_artist=baxter&amp;s_caption=&amp;s_id=&amp;s_topic=&amp;s_fromdate=&amp;s_todate=&amp;x=26&amp;y=13" target="_top">http://www.cartoonbank.com/search_results.asp?mscssid=CJ6KCUR2S1S92MD000GPBQXDMWKV2US9&amp;s_keywords=&amp;s_artist=baxter&amp;s_caption=&amp;s_id=&amp;s_topic=&amp;s_fromdate=&amp;s_todate=&amp;x=26&amp;y=13</a> <br> <br> <br>Typographically, I have great fun playing with 19th century types for designs used in Daze of Our Lives material. I really think it was such a rich, inventive and eclectic time for type design. The modern age and minimalism definitely killed a lot of that spirit off. <br>Again, thanks - and spread the good word about Daze for me would you?</p>'
    html_clean: '<p>Joe and Stephen! <br>You are too kind. Thanks for the compliments. <br>Daze gets a lot of traffic and I published the first collection in book form last year. <br> <br>The most common comparison people make is Edward Gorey: <br><a href="http://www.geocities.com/SoHo/Square/3441/object1.html" target="_top" class="link-external">http://www.geocities.com/SoHo/Square/3441/object1.html</a> <br> <br>But there is another humorist called Glen Baxter whose work I love. At The New Yorker Cartoon Bank: <br><a href="http://www.cartoonbank.com/search_results.asp?mscssid=CJ6KCUR2S1S92MD000GPBQXDMWKV2US9&amp;s_keywords=&amp;s_artist=baxter&amp;s_caption=&amp;s_id=&amp;s_topic=&amp;s_fromdate=&amp;s_todate=&amp;x=26&amp;y=13" target="_top" class="link-external">http://www.cartoonbank.com/search_results.asp?mscssid=CJ6KCUR2S1S92MD000GPBQXDMWKV2US9&amp;s_keywords=&amp;s_artist=baxter&amp;s_caption=&amp;s_id=&amp;s_topic=&amp;s_fromdate=&amp;s_todate=&amp;x=26&amp;y=13</a> <br> <br> <br>Typographically, I have great fun playing with 19th century types for designs used in Daze of Our Lives material. I really think it was such a rich, inventive and eclectic time for type design. The modern age and minimalism definitely killed a lot of that spirit off. <br>Again, thanks - and spread the good word about Daze for me would you?</p>'
