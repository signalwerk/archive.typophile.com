    html: <p> This is a cool effect, and the characters are suprisingly legible at all sizes. <br> <br>At risk of offending potential marketers of my own fonts, don't feel too badly about the fact that ITC rejected yours. I find many (not all) of ITC's fonts to be overly sterilized anyway. (As evidence, witness what they did to the Storm Typefoundry's beautiful Biblon typeface, or ITC "Garamond".) <br> <br>I suspect you'd do well with this font on MyFonts.com. <br> <br>I look forward to seeing more of the character set, including lower case characters. <br> <br>David Thometz </p>
