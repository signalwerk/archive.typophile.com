    html: <p>The vignette/frame really doesn't work and the text describing the scents is completely illegible. I agree with the previous poster that the "herbal soaps" line doesn't work, it's one ornate font too many, plus it's slightly superfluous information, as the previous line already says "herbal" I'd go for a single descriptive text for each scent saying "Mint and Comfrey Soap" or "Mint and Comfrey Herbal Soap" in one clear and easy to read font, maybe a different colour for each scent.</p>
