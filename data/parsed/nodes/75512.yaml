    html: |-
      <p>There are many issues with the labels but here is a simple way to improve your labels</p>
      <p>Purchase some handmade looking soaps that have relatively the same bar size as your clients soap. Choose examples with labels that look professionally designed. Purchase some regular soaps as well...now, measure the size of the type for the brand, fragrance, weight, description, ingredients, make a comparative list side by side to see what size your type should be for each application. </p>
      <p>You should also be looking at soap in stores and recording what you like about the various labels and choose ways in which your soap will stand out from the rest in a positive way.</p>
      <p>Make sure that your label is readable from a shop-able distance from the shelf.</p>
