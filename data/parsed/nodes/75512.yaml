      <p>I like the layout of the small text and the images of the herbs and flowers. That part looks simple and clear, but I don't think the gothic-revival "herbal soaps" and the sort-of Art Nouveau frame work with it. The "flavours" (if that is the right term) are too small, and in a fairly illegible face. If you want to keep that frame you're not really using the space in it properly. For example, the third one down. It's orange &amp; what?</p>
      <p>Below is an example of taking away everything that I think gives it too much of a homemade, slighty botched-together look. Find something equally clean and clear to say "Rosemary". Perhaps put "Rosemary (etc.) Soap" so you don't need to have the "herbal soaps" line.</p>
      <p> </p><div class="imageWrap"><img src="http://typophile.com/files/Lavendar_5640.png"></div><p></p>
