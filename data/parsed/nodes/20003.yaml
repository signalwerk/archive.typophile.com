    html: |-
      <p>The ri needs some adjustment, you could cut the arm of the r and/or reduce the serif on the i; the dots on the i are grabbing attention; I find the m much too condensed. The glass isn't really saying refreshing, perhaps a taller glass with some indication of liquid/ice cubes would help, I also think you are going to have problems with the weight of the stroke in reproduction but equally you don't want it to overwhelm the lettering. As a thought you could create the logo in two lines with the glass/straw device taking the place of both i's (I really don't know if that will work).<br>
      Tim</p>
