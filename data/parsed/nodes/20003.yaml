      <p>I like the underlying concept, I think the name is interesting (in a good way), but I really think you're asking for problems with the thin stroke weight on the glass (the lettering is also very thin, it might look very fiddly at a small size). Maybe widen your idea around the drink idea - maybe look at more than a glass, off the top of my head you could possibly use a slice of lemon/lime that you'd find in a cool drink - the fruit would also suggest freshness, and the associated yellow/green would back this up. Just a thought, I'm sure there are lots of other drink related objects you could make use of.</p>
      <p>Si</p>
