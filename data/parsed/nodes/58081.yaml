  html: |-
    <p>I just found this recently. <a class="freelinking external" href="http://batorfizsolt.spaces.live.com/default.aspx">Bátorfi Zsolt</a> posts <a class="freelinking external" href="http://batorfizsolt.spaces.live.com/Blog/cns!78E216F5ABAE195D!119.entry">this XAML code</a> that you can paste into XAMLPad or better yet Robby Ingebretsen's <a class="freelinking external" href="http://kaxaml.com/">Kaxaml</a> and use to see OpenType features at work. The XAML code can be modified and expanded to change or add fonts or features.</p>
    <p>You'll need Windows for this, preferably the 7 beta or Vista, but alternately XP with the .NET 3.0 or 3.5 framework installed.</p>
