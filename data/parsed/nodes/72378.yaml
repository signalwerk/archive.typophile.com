  html: |-
    <p>205 is a new type foundry founded in 2010 by Damien Gautier (Lyon, France)<br>
    Almost display fonts but not only...<br>
    Opentype fonts, it's sure! With opentype features (ligatures, alternate glyphs, etc.)</p>
    <p>Already available :<br>
    – Amiral : a strong stencil typeface (uppercases only)<br>
    – Bloo : a four cut font in homage to "Codex80" by Jean Alessandrini<br>
    – Caporal : an elegant stencil font<br>
    – Colonel : a four cut stencil font – uppercases and lowercases – : cut, rounded and sharp angles<br>
    – LeChaufferie : a display font with 1200 ligatures !<br>
    – Robin : a dingbats font with infinite possibilities thanks to 5000 kerning pairs</p>
    <p>Éditions Deux-Cent-Cinq publishes also books on typography, architecture and contemporary photography.<br>
    Visit the website : <a href="http://www.editions205.fr" title="http://www.editions205.fr">http://www.editions205.fr</a></p>
