    html: <p>&gt; <i>I was looking for some funny one-phrase</i> <br>&gt; <i>jokes, but couldn't find anything</i> <br>&gt; <i>practical. The "seems-once-it-was-funny"</i> <br>&gt; <i>link at EyeWire is not working properly</i> <br>&gt; <i>- as if all the images except for the</i> <br>&gt; <i>only one were deleted or something...</i> <br> <br>That's because when Agfa bought the guts of the EyeWire site from Getty Images and ran their stupid little page spider over it, they neglected to capture images that were referenced in JavaScript or in file subdirectories. I should know where stuff is, because I built that site. Now it's nothing more than a shell of it's former self. Hey Agfa! Ever heard of a link-checker? Yeesh. <br> <br>However, I did happen to archive that very page on my own site. <br> <br><a href="http://www.splorp.com/junk/bumperstuck/" target="_blank">http://www.splorp.com/junk/bumperstuck/</a> <br></p>
