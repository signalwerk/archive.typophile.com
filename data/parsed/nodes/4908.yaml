    html: <p>Su Wong marries Lee Wong. The next year, the Wongs <br>have a new baby. <br> <br>The nurse brings over to the parents a lovely, healthy, <br>bouncy, but definitely Caucasian, white baby boy. <br> <br>"Congratulations," says the nurse to the new parents. <br>"Well Mr. Wong, what will you and Mrs. Wong name <br>the baby?" <br> <br>The puzzled father looks at his new baby boy and says, <br>"Well, two Wongs don't make a white, so I think we <br>will name him Sum Ting Wong." <br> <br><a href="http://www.bemboszoo.com" target="_blank">http://www.bemboszoo.com</a></p>
