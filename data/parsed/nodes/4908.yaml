  html: "<p>Re: <a href=\"http://www.typophile.com/forums/messages/73/6391.html\" target=\"_blank\">http://www.typophile.com/forums/messages/73/6391.html</a> <br> <br>It's getting warmer and warmer, and my stock of Tees needs to be refreshed. So, I was thinking of making some funny typ-o-shirts myself, silkscreening them and wearing them proudly. <br> <br>I was looking for some funny one-phrase jokes, but couldn't find anything practical. The \"seems-once-it-was-funny\" link at <a href=\"http://www.eyewire.com/magazine/features/bumperstuck/index.htm\">EyeWire</a> is not working properly - as if all the images except for the only one were deleted or something... <br> <br>Can anyone help me with some jokes? Eh? :D</p>"
