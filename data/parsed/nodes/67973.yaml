      <p>The school I attended was great at dipping your toes in the water and then allowing you to swim as much as you chose. I did a lot of toe dipping, a little wading and less swimming.</p>
      <p>Since you're researching a post-graduate course, I'm guessing it would be useful to know that my degree is a BFA in graphic design.</p>
      <p>Latin font design - I took a class that introduced me to this<br>
       <br>
      History of aesthetics of type design - Not certain about this one, I had a class in the history of type and I had a type design class. Don't know if that counts. </p>
      <p>Digital font production (e.g. fontlab) - Had a semester long class in this, but only many years after graduation did I realize that I was woefully unprepared. Learned more from the manual and trial &amp; error, than from the class.</p>
      <p>Font hinting/programming - I've been taught what I know of this from knowledgeable friends.</p>
      <p>Calligraphy - This was covered for half of the semester of type design , I am horrific at it.</p>
      <p>Typesetting (stylistic principles) - My internship required typesetting .</p>
      <p>Hand printing (letterpress, printmaking) - I was taught letterpress over two weekends so I could teach a high school level community outreach program. I learned as much as the students did from that program.</p>
      <p>Graphic Design - My school covered this in great detail, but more was learned from the first 4 years of actual work. School got me in the right mind and taught me how to think, but I didn't learn until I was on my own.</p>
      <p> Information Design - I had a semester long course in this , which isn't enough.</p>
      <p>Web Design - I had a semester long course in this, and then a couple jobs in this field.</p>
