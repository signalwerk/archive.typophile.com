      <p>At least a portion of my days as a recent college grad were spent re-running paragraph rags, identifying typefaces/"cuts", and specifying display type spacing adjustments; skills that are now frequently automated at mediocre levels, the expertise of type historians, or often impossible to achieve online. Were these now obsolete trade skills like journeyman wood engraving, or stages on the way to higher level thinking and design? Do they even belong in undergraduate education at all, or are they better suited to on-the-job training where they may have value to someone seeking subtle detailing and the authority they project?</p>
      <p>A hypothetical graduate program might embrace writing (whether stone cut, analog ink or digitally fleeting pixels) as communication design through letterforms, rather than just typography. I realize I'm describing a program in architecture committed to teaching forestry, or at least wood joinery. The wider end of the funnel.</p>
      <p>some answers:</p>
      <p>Latin font design<br>
      Doesn't this begin with handwriting, and reading 3rd Grade handouts that were typed in Courier? Schooled at all levels, workshops, professional critique, self-taught.</p>
      <p>Non-latin font design<br>
      Encountered cyrillic at the end of the Cold War, and non-latin since then at irregular intervals, critique from experts, and self-taught.</p>
      <p>History of aesthetics of type design<br>
      See previous, formally in design study from undergraduate to graduate investigation, workshops, and self-taught.</p>
      <p>History of technology of printing/type; Printing technology (offset, screen-to-laser), Hand printing (letterpress, printmaking)<br>
      Undergraduate, workshops, employment and participation in evolution of technology, self-taught. Letterpress is not hand printing in print history.</p>
      <p>Calligraphy/Handlettering/Typesetting<br>
      Undergraduate, graduate investigation, workshops, professional training, self-taught</p>
      <p>Quantitative reading research/Empirical research methods<br>
      Undergraduate, exposed to applications on-the-job, self-taught</p>
      <p>Advanced (college level) mathematics<br>
      Yep, but I've forgotten it.</p>
      <p>Linguistics/Writing Systems<br>
      Small bits of exposure, self-taught</p>
      <p>Graphic Design/Information Design/Book Design/Web Design<br>
      Undergraduate, graduate, self-teaching, workshops.<br>
      (Why are these last? Without them typography would not exist today. Not to mention Advertising, the incessant trumpet of trade.)</p>
      <p>May I humbly suggest "fine art" as an overlooked category?</p>
