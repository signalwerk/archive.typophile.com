      <p>Nick,<br>
      I don't think I'm getting ahead of myself, and in danger of tripping up, just yet. The aim is to get enough information to inform a discussion among interested parties on what might be offered as advanced training in typography. For example, I think there could be a linguistics course tailored to typographers interested in designing for languages they don't speak, without their becoming linguists (which certainly would bring the whole question of pre-reqs into play). What I'm hearing is that almost everyone involved in typography today has taught themselves what they needed to know in many fields that their formal education did not cover. Typography is like the center of a web that touches many academic fields.<br>
      Juliet</p>
