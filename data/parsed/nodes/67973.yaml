      <p><cite>For example, I think there could be a linguistics course tailored to typographers interested in designing for languages they don't speak, without their becoming linguists</cite></p>
      <p>This would be an extremely specialized course, and one which probably has nothing to do with linguistic courses that are actually taught. Linguistics programmes cover a broad range of topics, but it is rare enough to find courses that merely deal with writing systems at all. Mainstream linguistics is mostly about identifying language universals these days (generative grammar and such); old-school linguistics was heavy on philology.</p>
      <p>Why would anyone need to become a linguist to design for languages they don't speak? Do you mean for users of different languages but the same alphabet, like English speakers designing for Czech or Finnish? Or do you mean designing different scripts than one's own, like Devanagari or Chinese characters? In either case, one could learn the different design rules, and one could actually learn the languages themselves, but that is different from becoming a linguist. People might say "linguist" when they mean "polyglot", but that is careless usage.</p>
      <p>I have a feeling you might simply be referring to language courses. One could imagine a course for just teaching the Arabic script, not the spoken language. Is that what you are referring to?</p>
