      <p>Interesting topic.</p>
      <p>I've been a calligrapher from an early age, but my academic background is as a historian.  In college I wasn't even aware that there was such a thing as a college course in typography.  So I went to college and then graduate school in medieval history and English/linguistics.  Along the way I took courses in typesetting (compugraphic) outside of college and interned at Applewood Press where I learned to set wood and metal type and do basic book design.  In graduate school I also took courses in Paleography and Codicology and my fist typeface designs came from work I did in my Paleography classes.  I've also worked as an editor and art director, which gave me more experience working with type.  Through the 80s I found myself doing a lot of hand lettering for book and magazine titles, and that naturally transitioned into designing type once the digital tools became available.  The rest is history...</p>
      <p>Dave<br>
      <a href="http://www.fontcraft.com" rel="nofollow">The Scriptorium</a></p>
