      <p>I'm a graphic designer (mid-level) with a BFA in graphic design from <a href="www.risd.edu" rel="nofollow">RISD</a>.<br>
      ________________________________________________________________________</p>
      <p><strong>Latin font design</strong>—mostly self-taught building through the foundations in typesetting learned in college (under <a href="www.fontbureau.com/people/CyrusHighsmith" rel="nofollow">Cyrus Highsmith</a>);  studied the history of design; sketching (my own ideas &amp; replicating fonts I like); type-design books.</p>
      <p><strong>History of aesthetics of type design</strong>—college typography I, II, &amp; III; general exposure to typography forums, etc<br>
      <strong>History of technology of printing/type</strong>—fare amount of exposure while in college—history of graphic design, typography classes (I,II,III); base-level literature about the history of graphic design </p>
      <p><strong>Calligraphy</strong>—self-taught from an early age<br>
      <strong>Handlettering</strong>—self-taught<br>
      <strong>Typesetting (stylistic principles)</strong>—college typography I, II, &amp; III</p>
      <p><strong>Printing technology (offset, screen-to-laser)</strong>—I've learned a fair amount on-the-job (doing presschecks, meeting and talking with printers), and I've experimented on my own (I have three different printers)</p>
      <p><strong>Hand printing (letterpress, printmaking)</strong>—Medium experience level. I learned the basics in college and explored much more on my own.</p>
      <p><strong>Quantitative reading research</strong>—I know what it is, but thats about it<br>
      <strong>Empirical research methods</strong>—I know generally how it works.</p>
      <p><strong>Linguistics</strong>—Learned the basics in my type classes at RISD.<br>
      <strong>Writing Systems</strong>—Learned the basics in my type classes and history of graphic design at RISD, supplemented with notes about it in some graphic design history and typography personal reading.</p>
      <p><strong>Graphic Design</strong>—Very well trained in school and a few industry/studio settings.<br>
      <strong>Information Design</strong>—Very well trained. College, research, peer-guidance,<br>
      <strong>Book Design</strong>—Very well trained. College, hobby, sole-venture, contracts, etc<br>
      <strong>Web Design</strong>—Self- and peer-taught. Ever-growing knowledge, but I didn't learn design specific to web at school.</p>
      <p>--------------------------</p>
      <p><strong>Production management</strong> - On-job<br>
      <strong>Photo typesetting</strong> - @ RISD<br>
      <strong>Printing management</strong> - if working with printers counts<br>
      <strong>Semiotics</strong> - learned @ RISD<br>
      <strong>Psychology of persuasion</strong> - job-shadowing in the ad world, college, on-the-job<br>
      <strong>Marketing</strong> - some classes<br>
      <strong>Animation</strong> - a few school projects and some self-initiated projects<br>
      <strong>General Systems theory</strong> - Learned a great deal from a professor and the rest self-taught<br>
      <strong>Communication</strong> - (this seems a little broad, but) yes</p>
