      <p>I'm a full-time font developer, with a BFA in Graphic Design from RISD and an MA in Typeface Design at the University of Reading. I also studied on the graduate-level in Germany, but did not complete a degree. I teach typeface design at the higher education level in Germany, too.</p>
      <p>--------------------------</p>
      <p><strong>Latin font design</strong>: Formal and informal education<br>
      <strong>Non-latin font design</strong>: Formal and informal education</p>
      <p><strong>History of aesthetics of type design</strong>: Formal and informal education<br>
      <strong>History of technology of printing/type</strong>: Some formal education</p>
      <p><strong>Digital font production (e.g. fontlab)</strong>: mostly learnt on the job</p>
      <p><strong>Font hinting/programming</strong>: this has almost entirely been learnt on the job</p>
      <p><strong>Calligraphy</strong>: I did a number of self-initiated exercises here as a grad student in Germany, but I a really untrained (and unpracticed) here<br>
      <strong>Handlettering</strong>: I did a number of self-initiated exercises here as a grad student in Germany, but I a really untrained (and unpracticed) here<br>
      <strong>Typesetting (stylistic principles)</strong>: My training here has been mostly formal</p>
      <p><strong>Printing technology (offset, screen-to-laser)</strong>: Formal and informal education<br>
      <strong>Hand printing (letterpress, printmaking)</strong>: I guess that I spent a few days setting type by hand in RISD's typesetting studio</p>
      <p><strong>Quantitative reading research</strong>: I am going to leave this blank…<br>
      <strong>Empirical research methods</strong>: this one, too…</p>
      <p><strong>Advanced (college level) mathematics</strong>: I never took college level math or science classes</p>
      <p><strong>Linguistics</strong>: I have studied several languages at the university level, but I never took any linguistics classes<br>
      <strong>Writing Systems</strong>: I had some practical education at the university level writing Chinese. Otherwise, my formal education in Writing systems comes from the MATD course</p>
      <p><strong>Graphic Design</strong>: Well, I have a BFA in Graphic Design, and worked as a professional graphic designer for about three years<br>
      <strong>Information Design</strong>: This was a popular element of the BFA course at RISD while I was there, and I interned for an info design studio for half a year<br>
      <strong>Book Design</strong>: I am completely uneducated when it comes to book design :-D<br>
      <strong>Web Design</strong>: I spent a lot of time designing of the web in 1999–2000… this was all professional. I have no formal education in the subject, and have not kept myself up to date much informally since</p>
