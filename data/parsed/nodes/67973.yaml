      <p>"How much of this was during your years of formal education, and how much was on your own?"</p>
      <p>Much of it was both. I did all the research related studying in grad school at Ohio State and we had a very firm education at Carnegie Mellon University where we studied calligraphy and typesetting. We had great guest lecturers like Herman Zapf and Wolfgang Weingart; Semiotics from Gui Bonnsieppe and Martin Krampen; Typography from Jack Staufagher and Ken Hiebert.</p>
      <p>Digital Font Production, Latin Script Font Design, Hinting and Programming was all self taught. I did take a weekend class from Maxim Zukov on Cyrillic though (which was fabulous!). I am self-taught in Greek, however but I spoke Greek as a child so it is not so foreign to me.</p>
