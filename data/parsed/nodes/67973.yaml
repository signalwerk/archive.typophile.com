      <p>I'm one of the brief generation of type designers who slipped between the end of the apprenticeship tradition of the old foundries and the beginning of academic/institutional training in the field. One thing those of that generation seem to have in common is very large libraries.</p>
      <p>Latin font design — <em>mostly self-taught; some initial mentoring from Gerald Giampa</em><br>
      Non-latin font design — <em>self-taught and mentored by, among others, Maxim Zhukov, Fiona Ross and Gerry Leonidas</em></p>
      <p>History of aesthetics of type design — <em>largely self taught</em><br>
      History of technology of printing/type — <em>self taught</em> </p>
      <p>Digital font production (e.g. fontlab) — <em>FontLab 2.5, 1994: self-taught was the only option</em></p>
      <p>Font hinting/programming — <em>Microsoft seminar 1997; VTT lessons from Laurence Penney and mentoring from Beat Stamm and Mike Duggan; pay other people to do Python programming for me; self-taught VOLT</em></p>
      <p>Calligraphy — <em>one morning's instruction from my mother when I was about nine; crap handwriting</em><br>
      Handlettering — <em>very little</em><br>
      Typesetting (stylistic principles) — <em>one short community college course on the basics, 1993</em></p>
      <p>Printing technology (offset, screen-to-laser) — <em>self-taught some theory; hung around print shops a lot</em><br>
      Hand printing (letterpress, printmaking) — <em>very little</em></p>
      <p>Quantitative reading research — <em>yeah, I read a lot</em> :)<br>
      Empirical research methods — <em>no systematic training, but good research and critical thinking skills are about the only lasting benefit of my BFA</em></p>
      <p>Advanced (college level) mathematics — <em>Ha! Failed grade 11 algebra once, and only scraped by the second time</em></p>
      <p>Linguistics — <em>briefly audited an introductory university course in the late 1990s, but quickly concluded that I wasn't going to learn much about what interested me, which was mostly the interaction of language and writing systems</em><br>
      Writing Systems — <em>mostly self-taught</em></p>
      <p>Graphic Design — <em>Bah!</em><br>
      Information Design — <em>very little, but I enjoy discussing it with people who do it</em><br>
      Book Design — <em>my initial interest in type; one short community college course, 1993, but then type design distracted my attention</em><br>
      Web Design — <em>a little, mostly learned from my wife</em></p>
