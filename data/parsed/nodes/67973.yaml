      <p>I'm not sure whether typography is truly central to my work, but it is a significant source of income for me. I do random freelance work that includes a fair amount of typesetting and occasional creation of odd glyphs of type (generally a few sorts of one or another ancient script needed for a particular job), but I am probably more an editor/writer than a typesetter. I have never studied art or design.</p>
      <p>----</p>
      <p><strong>Latin font design</strong>: I haven't done any, apart from precomposing some diacritic combinations, which doesn't really count<br>
      <strong>Non-latin font design</strong>: Self-taught</p>
      <p><strong>History of aesthetics of type design</strong>: Minimal self-taught knowledge<br>
      <strong>History of technology of printing/type</strong>: Self-taught</p>
      <p><strong>Digital font production (e.g. fontlab</strong>): Self-taught</p>
      <p><strong>Font hinting/programming</strong>: Limited self-taught knowledge</p>
      <p><strong>Calligraphy</strong>: Nothing, apart from some self-taught knowledge of paleography<br>
      <strong>Handlettering</strong>: Nothing<br>
      <strong>Typesetting (stylistic principles)</strong>: Self-taught</p>
      <p><strong>Printing technology (offset, screen-to-laser)</strong>: Some knowledge picked up on the job as an editor, plus a small amount of knowledge about older technologies picked up from family<br>
      <strong>Hand printing (letterpress, printmaking)</strong>: Nothing</p>
      <p><strong>Quantitative reading research</strong>: Nothing<br>
      <strong>Empirical research methods</strong>: Depends what kind - I do academic research, and thus have some graduate-level training in and experience of research design, but I don't work in a field where controlled experiments are feasible, so I don't have practical experience of designing controlled studies, though I can read them critically.</p>
      <p><strong>Advanced (college level) mathematics</strong>: Three undergraduate classes (calculus and statistics), but nothing that could really be considered advanced mathematics</p>
      <p><strong>Linguistics</strong>: One undergraduate class and two graduate classes (in anthropological linguistics, not in a linguistics department, so it was more sociolinguistics and historical/comparative, not so much syntactic theory)<br>
      <strong>Writing Systems</strong>: Good knowledge of Greek alphabet, originally self-taught, plus very limited self-taught knowledge of several other ancient and modern scripts</p>
      <p><strong>Graphic Design</strong>: Apart from traditional academic book interiors, nothing<br>
      <strong>Information Design</strong>: Self-taught in regard to statistical charts, otherwise nothing<br>
      <strong>Book Design</strong>: Self-taught<br>
      <strong>Web Design</strong>: Not much as yet</p>
