    <p>Dear typophiles,</p>
    <p>I am doing background research for the TypeCon Education Forum this summer where we will discuss what might comprise a post-graduate degree program in typography here in the U.S.<br>
    Please look over the list below and respond by identifying any areas which you have been educated in, have had training in, or have investigated on your own in order to further your typographic work.</p>
    <p>This survey is meant for anyone who considers that typography is central to their main line of work. You do not have to be a type designer. Also, feel free to add any areas you think have been overlooked. My objective is to learn what kind of backgrounds those who are currently working in the field have. </p>
    <p>Thank you for taking the time to respond. This information will have a direct effect on the panel discussion planned for TypeCon in Los Angeles, and the more responses, the more meaningful the data.</p>
    <p>Juliet Shen</p>
    <p>Latin font design<br>
    Non-latin font design</p>
    <p>History of aesthetics of type design<br>
    History of technology of printing/type</p>
    <p>Digital font production (e.g. fontlab)</p>
    <p>Font hinting/programming</p>
    <p>Calligraphy<br>
    Handlettering<br>
    Typesetting (stylistic principles)</p>
    <p>Printing technology (offset, screen-to-laser)<br>
    Hand printing (letterpress, printmaking)</p>
    <p>Quantitative reading research<br>
    Empirical research methods</p>
    <p>Advanced (college level) mathematics</p>
    <p>Linguistics<br>
    Writing Systems</p>
    <p>Graphic Design<br>
    Information Design<br>
    Book Design<br>
    Web Design</p>
