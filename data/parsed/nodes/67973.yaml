      <p>Craig, James, I don't believe there is enough typography taught in any bachelor program (with the possible exception of Reading's "BA in Graphic Communication" to go straight to PostGrad. This is not to disrespect the amount of typography that IS taught in design programs, but it is a small part of the curriculum.</p>
      <p>And then, when one considers how broad the rubric of "typography" is, and that postgrad students may be coming from disciplines other than graphic design, such as behavioral science, linguistics, programming, computer engineering, business studies, art history, &amp;c., &amp;c., might it not be a good idea to have a taught undergraduate course in typography which covers those bases? And then indeed a student could progress from the general to the particular.</p>
      <p>Juleit, can you have advanced training without basic training? You will end up with scientists who have no facility as typographers doing readability research with Arial and Mistral.</p>
