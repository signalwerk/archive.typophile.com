      <p>Illustrator can get you most of the way there, especially if you use a little Gradient Mesh to take the place of some of the standard gradient fills. Photoshop can be used to enhance the Illustrator lettering. Or Photoshop can be used to do all of the colouring, once you have paths created in vector software.</p>
      <p>Both methods require 'handwork' though, which can take quite a bit of time depending on the complexity of what you're aiming for. Since this is a special effect more than a stock solution I would think this suitable myself but there are some plugins for both Illustrator and Photoshop I think that can generate 3-dimensional shapes on the fly if you don't want to go the whole hog with something like Maya.</p>
