      <p>You might want to look into <a href="http://www.povray.org/">POV-Ray</a>, a free open-source 3D rendering application that's available for Windows, Macintosh, and Linux.</p>
      <p>POV-Ray is unusual in that you create scenes <em>not</em> by modeling them in a GUI application, but instead by describing them in a text file using a scene description language (SDL). POV-Ray has direct support for TrueType fonts, so you can render extruded 3D text pretty easily.</p>
      <p>For example, here's a scene I threw together in a couple of minutes:</p>
      <p><code>#include "colors.inc"</code><br>
      <code></code><br>
      <code>camera {</code><br>
      <code>  location &lt;0, 2, -18&gt;</code><br>
      <code>  look_at &lt;0, 0.25, 0&gt;</code><br>
      <code>  angle 15</code><br>
      <code>}</code><br>
      <code></code><br>
      <code>light_source {</code><br>
      <code>  &lt;500, 500, -1000&gt;</code><br>
      <code>  White</code><br>
      <code>}</code><br>
      <code></code><br>
      <code>text {</code><br>
      <code>  ttf "frutbd.ttf" "Typophile" 1, 0</code><br>
      <code>  pigment { SlateBlue }</code><br>
      <code>  translate -2.3 * x</code><br>
      <code>}</code></p>
      <p>This produces the following image:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Typophile_POV-Ray_4785.png"></div><p></p>
      <p>Note the full alpha transparency. This makes it a snap to drop rendered scenes into Photoshop layers.</p>
      <p>Don't be intimidated by the whole SDL thing. If you all you want is simple extruded text, you don't even really have to learn the language. You can just play around with the parameters in the script I posted and see what comes out. Later on, if you're feeling adventurous, you can start to read the <a href="http://www.povray.org/documentation/">documentation</a> at your own pace; eventually, you'll be able to come up with a lot of different cool effects.</p>
