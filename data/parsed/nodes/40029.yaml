      <p>It's been such a long time since I've done this. Extreme 3D had a handy function of importing EPS files and using the splines to built its geometry. I think many more modern 3D programs have similar functions, either importing some form of Illustrator curves or handling text as geometry directly, but I don't know which ones.</p>
      <p>One thing you might find you have to do is to add points to your curves before exporting The curves generated by the 3D software are not always as supple as in drawing programs, especially when rendering is set in a faster mode. The extra points will give stability to the shapes.</p>
