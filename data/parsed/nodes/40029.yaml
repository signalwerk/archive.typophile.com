    <p>I've recently become interested in creating three dimensional type to include in my design work. In school, 3D programs were never offered so we stuck to the basics of Freehand, Illustrator, In Design and Photoshop. The kind of 3D type I'm talking about can best be illustrated by the work of Nik Ainley, <a href="http://shinybinary.com/art.html" title="http://shinybinary.com/art.html">http://shinybinary.com/art.html</a> Specifically this image: <a href="http://shinybinary.com/images/art/2020visions.jpg" title="http://shinybinary.com/images/art/2020visions.jpg">http://shinybinary.com/images/art/2020visions.jpg</a></p>
    <p>There's something about the three dimensional type interacting with the various bubbles and swashes that really make it pop.</p>
    <p>What software is required to produce type such as this? I've heard of Maya, 3D Studio Max, etc, but don't know the difference between them or which would be best for exporting the type in to Photoshop for best edit-ability.</p>
    <p>Any advice would be greatly appreciated. Thanks!</p>
    <p>Jenkin</p>
