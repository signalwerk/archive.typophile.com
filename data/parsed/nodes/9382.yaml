    html: <p>Alright - a discussion! I don't think there's any doubt in most peoples minds that digital has gotten to the point that it is viable in almost all circumstances - I did a 80' x 220' building wrap with a photo that started digital. <br>Great. It's cleaner, no grain, etc. This is basically the same thing that people started complaining about in the digital music world 10 years ago resulting in a myriad of filters that would give you that "analog" sound. Why not buy a tape recorder on Ebay for nothing because that's what they're worth these days. <br>I get no feeling from digital other than the skill of the photographer. That may be a plus, but the other side of the coin is that when you hear a pianist, you're not just listening to him, you're listening to his piano. There is no varation in digital pianos of the same brand whereas every Steinway sounds different.  <br>There is a randomness to analog processes (like mixing photographic chemicals and doing exposures) that we are going to lose and I guarantee you at that point we will try to recreate it digitally. It can't be done. Life as simulation</p>
    html_clean: <p>Alright - a discussion! I don't think there's any doubt in most peoples minds that digital has gotten to the point that it is viable in almost all circumstances - I did a 80' x 220' building wrap with a photo that started digital. <br>Great. It's cleaner, no grain, etc. This is basically the same thing that people started complaining about in the digital music world 10 years ago resulting in a myriad of filters that would give you that "analog" sound. Why not buy a tape recorder on Ebay for nothing because that's what they're worth these days. <br>I get no feeling from digital other than the skill of the photographer. That may be a plus, but the other side of the coin is that when you hear a pianist, you're not just listening to him, you're listening to his piano. There is no varation in digital pianos of the same brand whereas every Steinway sounds different.  <br>There is a randomness to analog processes (like mixing photographic chemicals and doing exposures) that we are going to lose and I guarantee you at that point we will try to recreate it digitally. It can't be done. Life as simulation</p>
