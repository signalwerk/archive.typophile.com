    html: <p>oh and at the last London Third Tuesday Typocircle event, I used my Nikon FM-2 with a motordrive and it was nice and solid and about the same size as the D2H and I shot Ilford 3200 B&amp;W pushed to 6400 but I haven't developed them yet. But when I do I'm going to scan the negatives and not bother printing them traditionally. I'll print them digitally. Should be fun and hopefully grainy. <br> <br>Clive Bruton laughed when I told him it was my old Nikon (with the manual 50mm lens) said the photos would look like a retro Andy Warhol party.  <br> <br>the manual lens was great and the high speed was good since there was no flash and I could estimate the distance people were at then sneak a shot in without having to refocus. Only problem is the motordrive is a bit retro sounding and louder than I remember. Film and the gear is better in memory sometimes but nice for nostalgia.</p>
