    html: <p>Ok it's now a fence time now on photo... I have a News/Sports Nikon D2H camera.. and a can take Actors and head shots.. it's more for news and quick and great. My printing to a new Epson 800 prints well and better than most a A4 or 8x10'' 35mm film ..  <br> <br>my latest head shots are at  <br><a href="http://www.sueridermanagement.co.uk/presenters/MilesCrawford/miles.htm" target="_blank">http://www.sueridermanagement.co.uk/presenters/MilesCrawford/miles.htm</a> <br> <br>They were shot with the Nikon D2H with a large soft box and an umbrella fill and a back light. <br> <br>I printed on the Epson 800 onto Calumet gloss paper at 600dpi and they look better than 35mm on to old Ilford Cibacrome <br> <br>I shoot with studio lights 2-4 flash and 2 x box or umbrellas and no problems.  <br> <br>I converted them, added them to the site and printed them for the client all in one day he got them on Monday from a Sunday shoot. Fastest turn around he would have expected.  <br> <br>Magazines still want film as 6cm x 6cm or 6cm x 4.5.  <br> <br>But the next Nikon 2DX is about 12meg pix and the Canon new one is higher and there are others now making higher pixel cameras that will kill the media cameras.  <br> <br>If your customer wants film then you have to take it, but if you want good shots and prints you can do it in digital or any thing now.  <br> <br>But I don't need a polaroid back and I can shoot 900 shots on to a digi card,. No polarods or 10 shot 120 magazines.. only. I can do a few shots download them to the computer show the client and off we go.  <br> <br>I recently scanned some negatives into digital and I am finding that the quality is not as good as my Nikon D2H shots at 200 ASA. and I can simulate low res 3200 ASA on the digi camera and convert them to B&amp;W as well as with old Kodak recoding film or the Ilford 3200 film Simulated grain and all. So I love the pro Digital world. But the medium format cameras digital backs are too much for now since they will be useless in a year or two.</p>
