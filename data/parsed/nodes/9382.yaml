    html: <p>I find that even good quality digital cameras do not do a good job on highlights where the shape of the pixel shines through. And because the size that the photograph can be used at is limited, I am far happier to get a transparency and getting it scanned to the size I need. As for integrity, I presume this was a reference to "capturing the moment" and printing the whole frame, subjects I recall from tutors at college as well, they are disciplines that are good for a photographer to develop (no pun intended) but they were only intended as a baseline, the first steps to gaining experience. <br>Tim</p>
