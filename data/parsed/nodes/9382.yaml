    html: <p>Ok maybe I over-stated my belief in the perfection of digital. Back in the day I was known to use a super-fast speed AND over-develop to get A LOT of grain. I like grain too Paul. In fact I really love seeing what people can do with infrared film, and it doesn't get much grainier than that. <br> <br>Problem is, I like both. I really enjoy seeing how the photographer uses his equipment to get his vision across. I can't see either as best, because they are both only tools. I think a photographer who is starting out, that is if this is his chosen profession, should understand both. Or at least, if he chooses to go only analog or only digital, understand that he won't always get the job because he doesn't offer what the client wants. Or, on the other hand, if he is good enough at the one tool he has chosen to use, he will get clients based on what he has to offer.</p>
