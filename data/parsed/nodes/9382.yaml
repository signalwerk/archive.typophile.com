    html: <p>I've shot over 1200 images with my Canon 20d in the past few weeks. Any of these photos can be printed at up to 20"x30" with similar quality to 35mm prints. With no developing involved, I've already saved about $400 over comparable film shooting. I love the instant feedback you get with digital. <br> <br>I learned traditional photography with film and I do think the whole process improved my work. Now that digital SLRs are here though, I see no reason to go back for anything other than nostalgic purposes.</p>
