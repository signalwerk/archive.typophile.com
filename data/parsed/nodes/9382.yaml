    votes: null
    html: <p>I can't disagree with that, Amy. I think for educational purposes there should be no argument of analog v. digital. The variety of technologies only strengthens a students abilities. <br> <br>I don't think it is fair, however, to say one is more superior to the other in terms of the professional world. It isn't the tool, but the result, isn't it? <br> <br>However, as for film grain etc ... Well, with camera backs/cameras offering upwards of 22 megapixels (such as Hasselblad's 528C and the SinarBack54) it is possible to take photos undetectable to the eye ... Unless, of course, you open the file in photoshop and zoom in beyond 100% ... <br> <br>Why this talk of grain? I thought grain was the enemy. ;^)</p>
