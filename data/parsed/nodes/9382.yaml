    html: <p>I can appreciate the idea of the craft of photography, but the technology has changed. What was once tinkering in the darkroom has now become tinkering on the computer. I will always respect those who have and do still use film and chemicals to make prints. But the fact of the matter is even with digital backs for cameras you still need to understand exposure and lighting. I doubt the photography world will ever not be split 50/50 and this is what will drive those who wish to attain perfection in what they do.</p>
