    date: 2005-02-24T13:00:00
    date_raw: 24 Feb 2005 — 1:00pm
    votes: null
    html: <p>In my Intermedia Design MFA program (comprised of graphic designers, photographers &amp; book artists), we spend lots of time battling out the "analogue vs. digital" debate. Some professors believe that undergrad students who know traditional color printing techniques make better images than those who only know how to tweak color settings in Photoshop.  <br>At this state institution, our traditional color printing lab was last year turned into a digital lab. Mounds of letterpress equipment and metal type collect dust while waiting to be removed so another computer lab can be built. Time will tell, I suppose, how all of this affects student work.  <br>I'm not waxing nostalgic, but I think, in an ideal world, analogue technology should at least be available as a learning tool, if not a practical one.</p>
    html_clean: <p>In my Intermedia Design MFA program (comprised of graphic designers, photographers &amp; book artists), we spend lots of time battling out the "analogue vs. digital" debate. Some professors believe that undergrad students who know traditional color printing techniques make better images than those who only know how to tweak color settings in Photoshop.  <br>At this state institution, our traditional color printing lab was last year turned into a digital lab. Mounds of letterpress equipment and metal type collect dust while waiting to be removed so another computer lab can be built. Time will tell, I suppose, how all of this affects student work.  <br>I'm not waxing nostalgic, but I think, in an ideal world, analogue technology should at least be available as a learning tool, if not a practical one.</p>
