    html: <p>I don't think digital can duplicate film in all aspects nor do I think that the opposite is true. They are two different mediums that are closely related, but separate. I personally would rather look at film grain than jpeg artifacts, but once you get up to a certain amount of megapixels (10+) and are shooting RAW, digital becomes viable for almost anything. Viable but not necessarily the right tool. I think both are worth pursuing as a photographer keeping in mind what you want to achieve and which tool will get you there. Much like choosing the right lens or filter</p>
