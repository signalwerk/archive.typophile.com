  html: "<p>Photography question: <br> <br>I know this question is far from dead-center on typography, but I wanted to get a perspective outside of the photography world... <br> <br>Photographers are split down the middle on the issue of digital being able to duplicate film in all aspects.  They say that any effect (particularly in regards to black and white) can be replicated with some tinkering in Photoshop.  I remember my photography profs. in college really emphasizing the idea of integrity, and this practice just doesn't seem to go along with that. <br> <br>What do Typophiles think of this?</p>"
  html_clean: "<p>Photography question: <br> <br>I know this question is far from dead-center on typography, but I wanted to get a perspective outside of the photography world... <br> <br>Photographers are split down the middle on the issue of digital being able to duplicate film in all aspects.  They say that any effect (particularly in regards to black and white) can be replicated with some tinkering in Photoshop.  I remember my photography profs. in college really emphasizing the idea of integrity, and this practice just doesn't seem to go along with that. <br> <br>What do Typophiles think of this?</p>"
