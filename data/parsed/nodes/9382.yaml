    html: <p>I think it must be added that when you say something like "limitations become nil" you are also counting on the tranny being developed spot-on perfectly. I'm still not convinced. I think we all need to meet and see this perfection. ;^) With digital you know right away if you need to shoot again or more of the same. With analog you are counting on the shot being perfect and the development being perfect and the print to be perfect if the other two are perfect before you even know if you have a perfect shot. With digital, it seems to me, that you can see the exposure is perfect right away and you are biting your nails waiting for perfect developing.</p>
