      <p>OK, I generally use the term “revival” to refer to faithful digitizations, rather than fonts which add cuts or styles to a family, change details, or provide variants, which is what Giorgio does.</p>
      <p>Given the distinctive nature of Corvinus, I would say that Giogio comes within the bounds of what is generally understood to be a revival, although the term “redesign” would probably be more accurate.</p>
      <p>In fact, while many redesigns/revivals meekly tone down the more distinctive features of their model, Giorgio not only incorporates many of the unique details of Corvinus, but also ramps up its fundamental qualities—its squareness and its thin vertical serifs.</p>
