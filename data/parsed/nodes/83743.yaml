      <p>I still think you haven’t seen the full family, Nick. There is more Corvinus than the black skyline style <em>revived</em> by David Berlow and <em>interpreted</em> by Christian Schwartz. I tried to explain that what you probably mean by “distinctive nature” isn’t so singular to this one typeface only but was a general trend in the 1930s all foundries tried to jump on with their own releases.</p>
      <p>FB Skyline, a rather faithful revival of Corvinus black condensed: <a href="http://www.fontbureau.com/fonts/Skyline/" title="http://www.fontbureau.com/fonts/Skyline/">http://www.fontbureau.com/fonts/Skyline/</a></p>
      <p>A spread of Corvinus: <a href="http://www.flickr.com/photos/bogtrykkeren/4277301002/sizes/l/" title="http://www.flickr.com/photos/bogtrykkeren/4277301002/sizes/l/">http://www.flickr.com/photos/bogtrykkeren/4277301002/sizes/l/</a></p>
