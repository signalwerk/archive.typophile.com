      <p>Well, you cannot say that Imre Reiner invented high-contrast typeface with thin vertical serifs in general.</p>
      <p>What “distinctive quality” of Corvinus do you mean exactly then, Nick? As I said, there have been similar jobbing typefaces before the release of Corvinus in 1934, eg. Radio and Rundfunk by Berthold, Meridian by Klingspor, Kontrast by Weber, Eden by Ludlow, and several later, like Bayer-Type from Berthold, Mondial by Stempel, Candida by Ludwig &amp; Mayer, Schadow by Weber, Patria from Schriftguss AG, Die Schlanke by Ludwig &amp; Mayer, Pergamon by Ludwig Wagner, Quirinus, or Sparta from Genzsch &amp; Heyse.</p>
      <p>However, Corvinus was more extensive and indeed more widely known than the others, especially outside of Germany.</p>
