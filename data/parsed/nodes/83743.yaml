    html: |-
      <p>I’m not familiar with all those faces, Indra.</p>
      <p>I don’t believe that trends deﬁne typefaces, but vice versa.<br>
      Trends are critical rationalizations of properties that are common to a sequence of type designs identiﬁed by a critic, historian, or cultural commentator. Even if the critic recognizes a commonality which has not previously been articulated, it was nonetheless ﬁrst created in an individual type design, and named subsequently.<br>
      A typeface is a collection of related design themes which have been realized with synergy—the whole concept is greater than the sum of the parts, it’s an emergent quality.</p>
      <p>Corvinus is a type which combines:<br>
      - high contrast<br>
      - vertical stress<br>
      - squarish rounds<br>
      - vertical hairline serifs on blunt-ended terminals of curved strokes</p>
      <p>Imre Reiner found a way to fuse those together into a unique design.</p>
      <p>If Eden is Corvinus without the vertical thin serifs, then the question is: which came first?<br>
      Because it looks like one is an adaptation of the other, with or without those serifs.<br>
      (Although they might have occured independently, but how would one know?)</p>
      <p>Giorgio has it both ways, with alternates.</p>
      <p><em>…you cannot say that Imre Reiner invented high-contrast typeface with thin vertical serifs in general.</em></p>
      <p>With Nick (Curtis), I could say that he invented this:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/C_srif_4177.jpg"></div><br>
      And if another designer used that device in a squarish didone, then it would be a copy/revival/redesign of Corvinus.<p></p>
