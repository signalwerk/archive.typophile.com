    html: |-
      <p><em>What is the difference between Quirinus and Corvinus?</em></p>
      <p>There are quite a few differences, actually. There are a number of subtle differences in the uppercase characters—immediately obvious in the C and M—and the lowercase characters  with ascenders in Quirinus are unserifed at the top. Alessandro Butti is generally more playful in his designs than Imre Reiner…or, at least, that is my humble opinion...</p>
      <p>I should also note that Ludlow's Eden iis in the same ballpark, as is Stephenson Blake's Coronation, the latter being distinguished by its rather odd, clumsily rounded serifs.</p>
    html_clean: |-
