    <p>I'm working on my personal identity and site design and I found Quirnus by Alessandro Butti in the encyclopaedia of typefaces. I can only seem to find it in bold but I'd love to get the regular and italic as well. Does anyone know if these have been digitised and if so where can I buy the family. </p>
    <p>Thanks for any help you can give </p>
    <p>Kilian</p>
