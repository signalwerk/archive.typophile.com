  html: |-
    <p>Hola a todos, ayer hice un post anunciando esto mismo, pero creo que en nuestro idioma es mejor...<br>
    Se trata de un portal de recursos tipográficos y de diseño llamado the rank (<a href="http://the-rank.com" title="http://the-rank.com">http://the-rank.com</a>)<br>
    En su directorio se reúnen, entre otras cosas, resursos tipográficos tanto comerciales como gratuitos, "rankeados" de 1 a 5 para facilitar su elección.<br>
    the rank también posee un servicio de sindicación RSS (<a href="http://hello.the-rank.com" title="http://hello.the-rank.com">http://hello.the-rank.com</a>) y actualmente está en curso un certámen de envío de sitios web personales.<br>
    Espero que este servicio gratuito sea de vuestro agrado,<br>
    saludos...</p>
