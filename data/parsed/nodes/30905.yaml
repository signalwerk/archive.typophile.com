      <p><strong><a href="http://www.tiposlibres.com">DEJANDO HUELLA 10</a></strong></p>
    <p>3, 4, y 5 de mayo de 2007<br>
    Ciudad de Queretaro, México</p>
    <p>Este año TiposLibres festeja el Décimo Aniversario del Ciclo de Conferencias DEJANDO HUELLA 10.<br>
    Teniendo conferencistas de diferentes partes del mundo ARGENTINA, BRASIL, CHILE, ESPAÑA, EUA, CANADA Y MEXICO..</p>
