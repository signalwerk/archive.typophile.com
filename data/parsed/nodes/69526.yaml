    html: |-
      <p>@ Chris</p>
      <p>As I said, I am not a physicist, but in the theory (probably there is more than one theory), there is a singularity in every black hole. If Hawking is right, then black holes irradiate and loose energy/mass. As smaller the hole, as more energy/mass it looses through emission. And in the end it explodes. But when it explodes, its mass is almost zero. That is odd, because if you believe in the big bang, it has started with a singularity (with the mass of the universe). With regard to the time and the stability the big bang singularity is probably an exception from our point of view, because there was nothing outside that singularity – the big bang singularity was the only possible point of view – and therefore there was nobody, who was able to compare the lifetime of that singularity with any processes. There was no relation to anything, because the big bang singularity was everything. You could not say, how long the big bang singularity has existed, before it has exploded.</p>
      <p>However, the zero is fascinating. (There is an ingenious idea about full and empty zeros in the beginning of the book <em>Picnic at the Way Side</em> by the brothers Strugatzki. Really ingenious.</p>
      <p>There is a book with short stories about singularities, which I likewise can recommend, but I don’t know, if it was translated into English: <em>Singularities</em> by Peter Schattschneider.)</p>
