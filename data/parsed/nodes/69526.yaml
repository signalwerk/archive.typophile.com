    <p><strong>This week's battle: Draw the number 10, to commemorate the 10th anniversary of Typophile.</strong></p>
    <p>To celebrate our 10th anniversary, we are inviting everyone to draw the number 10! After collecting the best entries, we plan to incorporate them back into our logo for this year and then perhaps even create some limited edition artifacts for the community.</p>
    <p>Winner take all, no holds barred. May the best designer win.</p>
    <p>// REQUIREMENTS</p>
    <p>- Solution must be typographic and contain only the numerals "1" and "0".<br>
    - Numerals must be custom drawn. No use of existing fonts!<br>
    - Image size: 550 width x 400 height. 72 dpi*<br>
    - Color: Black and White<br>
    - Format: PNG, GIF or JPG (Preferred in that order. Make sure there are no spaces in the name)<br>
    - Please keep an EPS or other vector formatted file on hand in the event we choose your design.</p>
    <p>*Please try to keep your file sizes to a minimum! 50k per file max.</p>
    <p>// ABOUT TYPOPHILE TYPE BATTLES</p>
    <p>This is your chance to flex your type muscles on a weekly basis. You have one week to create and submit your entry. Anyone may submit a design response to the challenge. You may enter as often as you wish. Post anytime. Critiques and comments are welcome throughout the game, from participants and spectators alike. Smack talk is encouraged.</p>
    <p>As with any street battle, there is no panel of judges and no prize — only the ability to call yourself the best on the block.</p>
    <p>Link directly to this battle: <a href="http://www.typophile.com/battle40" title="http://www.typophile.com/battle40">http://www.typophile.com/battle40</a><br>
    Link to the battle directory: <a href="http://www.typophile.com/typebattles" title="http://www.typophile.com/typebattles">http://www.typophile.com/typebattles</a></p>
