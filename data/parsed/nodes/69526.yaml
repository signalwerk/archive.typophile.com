    html: |-
      <p><cite>I see 11s in Arno's last entry.</cite></p>
      <p>Well, I would not say, that my attempt of the ten is clear, if you don’t know, that it is a ten. I did know that before. But eleven? The idea behind of it is, that nothing remains nothing. The arrow above nothing means "There is nothing.", while the figure zero means "I am something, but I mean nothing." I always was in the opinion, that the zero is the most fascinating number. In nature nothing does not exist. Otherwise it would be a violation of the uncertainty principle. The maximum of nothing is "almost nothing". Nothing is bursting the human mind in the same way as infinity.</p>
      <p>In this way (my contribution) I could describe numbers on an endless number line. All zeros after the ten would not have an arrow above.</p>
    html_clean: |-
