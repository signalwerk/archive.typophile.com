      <p>@ Chris</p>
      <p>As far as I have understood, singularities have no volume, independed from their mass. And their own mass compresses them. But let’s assume, time does not end for the case, that the universe ends in a singularity again and that there is an observer of the singularity with our feeling of time. Then it may exist for billions of billions of billions of billions of billions of years, until something happens, that brings it to explosion. But because there is no observer, it would not matter, if it directly after compression explodes. There does not seem to be a difference between infinity and zero with regard to the time in case of the big bang singularity.</p>
