      <p>@ Riccardo</p>
      <p>Well, all you had to do is to cut a bit of the one at its buttom and drag it down a bit.</p>
      <p>@ ihoff</p>
      <p><cite>Would that be why 'singularity' is called that instead of, say, 'nothingness'?</cite></p>
      <p>I just saw your question. I am not a physicist, but singularities (in black holes with a wide event horizon) seem to be very stable in contradiction to virtual particles in the vacuum. So the gravitation field gives evidence of the existence of something. On the other side you could ask, how real those things are, that we can’t see, and whether the universe exists, if nobody is there, who observes it. (Not only singularities, but everything, that is only for moments in our consciousness or that is pure theory. This consideration gives room for speculations about the possibility of a simulation of that, which we call reality, because the simulation only had to take into account the content of your or my consciousness – even not the contents of the consciousness of all humans, because every human individual only sees cuttings of some other individuals – temporarily. Otherwise the computer [in a wide sense of that term], which would be required for the simulation, would require more interactions between particles in every moment, than particles exist in the universe.) That’s the main reason, for which I hope, that the mankind survives or becomes replaced by another terrestrial species in the course of the biologic evolution or the evolution of a synthetical intelligence, that was developed by a biologic terrestrial species. There are millions of people, who believe in the existence of extraterrestrial life, although it is absolutely unevident, that it exists. (I only believe in nature, but not in Gods or substitutes of Gods. On the other side zero or infinity make it almost impossible, to believe in nothing.) But if we are the only creatures in universe, our self destruction would eliminate the only observer of the universe. And then the universe would be the most conceivable waste of beauty.</p>
