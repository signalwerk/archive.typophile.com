    <p>Hi,</p>
    <p>I mistakenly posted this originally in the solved sans area and I hope that a moderator sees this and removes the other.</p>
    <p>I have been asked to do some graphics for the Peter Hughes Burns Foundation as it seems that the person who did the original work is not around. I was given some rough raster drawings, which I decided to convert to vector, so that I have something to work with.</p>
    <p>I copied the graphics fine, but am having trouble identifying the fonts and wonder if somebody could help me?</p>
    <p>The first one is on the main logo, found on the website on the top left hand corner of the page:<br>
    <a href="http://peterhughesburnfoundation.org.au" title="http://peterhughesburnfoundation.org.au">http://peterhughesburnfoundation.org.au</a></p>
    <p>The second is on this graphic:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/survivor_5963.jpg"></div><p></p>
    <p>Blessings and thank you in advance for your assistance,<br>
    Roger Barnes</p>
