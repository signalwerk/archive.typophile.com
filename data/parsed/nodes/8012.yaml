    html: <p> Tschichold (who in those days called himself Ivan) used whatever the typesetters had. There was some Akzidenz Grotesk around, and there were a few precursors to Futura (which only came out in 1927, two years after Tschichold's manifest), namely Kristall Grotesk, but also Erbar. If I was at my desk in Berlin, I could pull out the specimen books and be more exact. <br> <br>At the Bauhaus, the composing room had a lot of Schelter Grotesk, which -- btw -- was the actual model for Helvetica (or Neue Haas Grotesk, as it was originally called). It looks like a clunky version of Akzidenz, with an anglosaxon style "doubledecker" l/c g. Tschichold used that as well, since Schelter &amp; Giesecke was a foundry from Leipzig, where T. worked and lived. And local printers bought local fonts, wherever they could. Fonts were a bitch to ship in those days... <br> <br>Christian Schwartz has just about finished designing a new face based on Schelter Grotesk, using some of the specimens from my library. He is calling it FF Bau (the name "Haus" was gone) and it'll be published by the FontFont library. Look out for it - Tschichold would approve. </p>
