      <p>I actually like your WORK in the portfolio better than the website. Don’t really know what it is. Maybe your logo. Not to keen on that now that I see in your portfolio what you can do, but its a straight up nice and easy website. Easy to figure out so I don’t waste time on finding my way around - which is very cool.<br>
