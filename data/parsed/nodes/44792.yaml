      <p>Thanks for the comments guys. I think the grey could be a great option. Know what you mean about the f’s now you say it. I guess my thought was that I just wanted to design it unrestrained and not be held back by anything. I thought that as its a website, nothing else, not a company I didnt have to brand the name at all, and legibility was not that important in terms of logos or anything. I was quite influenced by RayGun music magazine. The whole form over function thingy. But I think I definetely need to work on the large F a bit.</p>
      <p>Wordpress indeed. Im knid of new to blogging actually, as you may have guessed :-)<br>
      am just figuring it out by reading forums. Will work on the comments.<br>
      thanks so much for the comments again.</p>
