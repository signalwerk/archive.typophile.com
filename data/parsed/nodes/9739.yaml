  html: "<p>Hello people... this is my first post here... so here we go. <br>I'm doing a logo for my wife's new law firm and I wanted to know what are your thougths about it. <br>The firm is young and it is form by three young lawyers who want a classic identity. So I decided to go with Trajan for this project. <br> <br>The options I've explored are this: <br> <br><img src=\"http://www.typophile.com/forums/messages/29/67266.gif\" alt=\"Logo options\"> <br> <br>1 - Names in Caps - Text Line in Small Caps. <br>2 - Names in Small Caps - Text Line in Caps. <br>3 - Names in Caps - Text Line in Small Caps aligned right. <br>4 - Names in Small Caps - Text Line in Small Caps centered with the \"&amp;\". <br> <br>My first try with all the text in caps I think is good but after trying with small caps in some parts of the logo I'm not so sure. <br>So, what do you think about it? Any input and suggestions will be welcome. <br> <br>Thanks a lot. <br> <br>Germ</p>"
