      <p>Since you two already mentioned both of Nick's fonts, I'll add another that resembles this mostly because it has a strangely emotional weirdness to the lettering. It's called <a class="freelinking external" href="http://new.myfonts.com/fonts/volcano/deadman/?testdrive=custom%3D37994%26src%3Dcustom%26text%3Dimitation%2520of%2520life%26size%3D44%26fg%3D000000%26bg%3DFFFFFF%26w%3D600%26goodies%3Dfit%252Cot.liga%26dock%3Dfalse%26seed%3D23">DEADman</a> from Volcano (Christoph Seiler). It comes with blobs and spatters too, like Olicana Rough has, I think.</p>
      <p>- Mike Yanega</p>
