    <p>I was wondering what the general consensus was on how Gotham performs in body text. I want use it for my portfolio but I'm not a big fan of geometric san serifs for use in body copy thus am not confidant in using it. </p>
    <p>Alternatively I'm gonna use Akzidenz or Feijoa.</p>
