  html: |-
    <p>Can anyone point me in the right direction of how to embed fonts in Flash CS3, while using Actionscript 3.0 and CSS to manipulate formatting of the text in a given dynamic field?</p>
    <p>I sort of achieved what I was looking for using AS2 but I also didn’t embed the fonts that the CSS styles are made up of. I can’t even imagine how the CSS will be able to tell Flash what embedded typeface to use (via “font-family”?). Does this even make sense?</p>
    <p>Should I upload an example?<br>
    I’m interested in having two or more typefaces that are embedded, show up on a single line together, oppose to separate text fields.</p>
    <p>(I wish typography was easier in Flash...)</p>
    <p>=[</p>
    <p>anything helps | thnx guys! =)</p>
