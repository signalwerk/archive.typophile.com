    <p>I’m currently working on a pretty dry piece of material, a bland technical document where the author uses a lot of bullet points, and stepped indenture, and outlined lists (I.A.1.a...). </p>
    <p>My questions are:</p>
    <p>1. Is there a standardized rule of thumb when it comes to indents? Perhaps a formula has been devised that I’m not aware of. I’m currently using a 2 step, but have had 3 step in the past.</p>
    <p>First Step: Left Indent .1806, First Line Indent -.1325 Bullet Tab .1806<br>
    Second Step: Left Indent .313, First Line Indent -.1000 Bullet Tab .313<br>
    Third Step: Left Indent .4455, First Line Indent -.1399 Bullet Tab .4455</p>
    <p>Clearly there isn’t a consistency between these indents, I’ve just eyeballed using the tab toolbar.</p>
    <p>2. When setting up outlined lists, what’s the standard flow? Is it I.A.1.a. or something different? I remember creating outlines in 7th grade English class, but I don’t remember what the format was anymore.</p>
    <p>3. Finally, when doing bulleted lists and when those lists are indented, should I continue to use the same bullets for the indentures? Or should I change bullet styles (color, character, size)? I like the look of the sideways carrot </p><div class="imageWrap"><img src="/web/20081008043319im_/http://www.typophile.com/files/Sideways Carrot_5451.jpg"></div> and tend to use the standard bullet • for second step indentures.<p></p>
    <p>I hope these questions aren’t too confusing. I don’t have The Elements of Typographic Style available which I imagine would have these answers. Any help will be very appreciated.</p>
    <p>*Edit: Attached KittyHawk.PDF. It’s still in draft form, so some of the comments aren’t complete and I’m still formatting the images. I’d be interested to hear thoughts on the design.</p>
