    html: <p> If this is your first effort, I think you have great instincts - make sure they survive your upcoming "formal" learning effort. <br> <br>I'd go further than Stephen and say that I think there are actually too many good ideas here! They're fighting for attention, and I think more discipline would create more functionality. So I'd spread out the good ideas over multiple fonts*, instead of maybe trying to make one "ultimate" font (which never works). For example, your "e" has a nice organic feel, and the stem on your "o" is amazing, but together they're maybe too much of a good thing. And then there are some glyphs which are a bit *too* plain, like the "x" I think has a lot more potential. <br> <br>* Maybe a set of fonts that work together? <br> <br>hhp </p>
