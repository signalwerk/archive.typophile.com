    html: <p> I agree with Hrant. I think you have (at least) two really good fonts here. <br> <br>"b", "e", "f", "k", "m", "n", "o", "q", and "t" all have a similar feel, taking the more innovative road, while <br> <br>"d", "g", "h", "p", "u", "v", "w", "x", and "z" all fit together in the more conservative path. <br> <br>The remaining characters ("a", "c", "i", "j", "l", "r", "s", and "y") could adequately fit with either of the other two sets as they are, or they could be pushed even closer to conformity to either set with slight modifications. <br> <br>I'd love to see a new "x" designed to echo the design of the "k", for example. And inverting the existing "n" could be an interesting approach to the "u", especially with how that would position the "u"'s tail. A similar treatment could be adapted to the "d", "g", "p" and "y". <br> <br>I'm excited to see what you do with this font. <br> <br>David </p>
    html_clean: <p> I agree with Hrant. I think you have (at least) two really good fonts here. <br> <br>"b", "e", "f", "k", "m", "n", "o", "q", and "t" all have a similar feel, taking the more innovative road, while <br> <br>"d", "g", "h", "p", "u", "v", "w", "x", and "z" all fit together in the more conservative path. <br> <br>The remaining characters ("a", "c", "i", "j", "l", "r", "s", and "y") could adequately fit with either of the other two sets as they are, or they could be pushed even closer to conformity to either set with slight modifications. <br> <br>I'd love to see a new "x" designed to echo the design of the "k", for example. And inverting the existing "n" could be an interesting approach to the "u", especially with how that would position the "u"'s tail. A similar treatment could be adapted to the "d", "g", "p" and "y". <br> <br>I'm excited to see what you do with this font. <br> <br>David </p>
