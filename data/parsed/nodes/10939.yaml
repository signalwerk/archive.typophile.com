    html: <p> Hello Luis and congratulations for the type face, good starting. I also want to make some suggestings and questions. The l/c x have different expessures, which is visible if you use as a display font, but is looking great with small sizes. I prefere to see that kind of forms a relation betten then which create a better uniformity for all letters, for exemple ( use the letter (o) to create the bowl of the (g), (b), (d), (p), (q), or using the letter (n) to give the aperture and struture for the (y),(u).  <br> <br>1 &gt; Did you use any over-shoot (baseline overshoot, x-height overshoot ) to differentiate the limits of the round parts?  <br> <br>2 &gt; How you make the relation betten letters when use the round terminal ( b, e, q).  <br> <br>Its very interesting your type face and I want to see how your serene grow up during the time.  <br>Boa aparição Luis e força com esta tua bonita tipografia / Comprimentos.  <br> <br>Ricardo Santos </p>
