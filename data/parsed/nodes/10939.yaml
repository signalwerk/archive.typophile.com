  html: <p><img src="http://www.typophile.com/forums/messages/29/859.jpg" alt="serene sans.jpg"> <br> <br>This is the first time that i attempted to do a typeface,and i may say this site is the major responsible to put my hands on work. So  i just wanna say tanxs to everyone who participates in here and continue with the good job in the maintenance of this wonderfull place. <br> <br>As a begginer, i have many doubts in how to do a typeface, and i know i still have many work to do on this font, i start it about a month and now i really would like to hear some opinions and some answers to technical problems that i have, to continue and improve my work. <br>I haven't done the capitals neither the numberals, since there are some points that i need some help. <br> <br>So comments are very welcome. <br> <br>Since now tanxs to all <br> <br>Luis</p>
