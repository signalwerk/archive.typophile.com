    <p>I have recently purchased a copy of this book by Doyald Young. It is a great read but I am having some trouble finding a couple of the faces that he mentions.</p>
    <p>on page 133 of the book the typefaces 'Kristal' and 'Vogue' are mentioned in a roundup of faces 'paying homage to Futura'<br>
    My google skills may be lacking but I thought I would throw it out there.</p>
    <p>Any ideas?</p>
    <p>Best.</p>
