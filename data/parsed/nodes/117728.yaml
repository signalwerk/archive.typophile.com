      <div class="comment-spam-body"><p>I think you may be referring to Kristall Grotesque, originated by Weber in 1937. It was sold by other metal foundries under the names Polar, Rund Grotesk, Saxo and Predilecta, as well as others (source: Jaspert). There may be digital incarnations under any of those names.</p>
      </div>
