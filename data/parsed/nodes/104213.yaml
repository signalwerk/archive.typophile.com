    <p>Hello<br>
             Yesterday I bought Fontlab studio 5.2.  I had messed about with Fontforge. But I decided to get something with more muscle for professional j0bs. </p>
    <p>        So about 14 hours ago I bought Fontlab Studio 5.2 after reading that it is the industry leader in its field. </p>
    <p>       So far. So good. But after installing I opened it and it asked for my serial number. I put that in. It said that it was right. Then Fontlab closed. Strange. But OK. I opened it again. The splash screen came up. Then it vanished. No program appeared. Hmm. Windows Task Manager showed no Fontlab process running at all. </p>
    <p>      I tried again. I reinstalled. No help. I restarted my PC. No help either. The FAQ list was of no help. Nor was the provided Fontlab manual. </p>
    <p>     So I emailed the Fontlab customer issues page with a critical issue request. </p>
    <p>     About 16 hours later after repeating the above request I've still got 2 auto emails but no help whatsoever. </p>
    <p>     However, with raw cunning I sorted it out. I installed Python 2.75 as a 32 bit MSI [even though I ma on 64 bit windows 7] and now I have it working. Interestingly Fontlab's GUI says "Python is Installed" which makes me think that why on earth didn't they install python FOR me in the first place. </p>
    <p>      So marks so far for the makers of Fontlab Studio:</p>
    <p>     Installation Process: D-           *Why on earth do I have to hunt for the right Python? It's not my job."<br>
         Customer Service:     F                  * Is there any?  </p>
    <p>     Not good so far. I hope that I can give the product an A+   Fontlab is lucky that I am enough of a saint to do so if it deserves it.</p>
  html_clean: |-
    <p>Hello<br>
             Yesterday I bought Fontlab studio 5.2.  I had messed about with Fontforge. But I decided to get something with more muscle for professional j0bs. </p>
    <p>        So about 14 hours ago I bought Fontlab Studio 5.2 after reading that it is the industry leader in its field. </p>
    <p>       So far. So good. But after installing I opened it and it asked for my serial number. I put that in. It said that it was right. Then Fontlab closed. Strange. But OK. I opened it again. The splash screen came up. Then it vanished. No program appeared. Hmm. Windows Task Manager showed no Fontlab process running at all. </p>
    <p>      I tried again. I reinstalled. No help. I restarted my PC. No help either. The FAQ list was of no help. Nor was the provided Fontlab manual. </p>
    <p>     So I emailed the Fontlab customer issues page with a critical issue request. </p>
    <p>     About 16 hours later after repeating the above request I've still got 2 auto emails but no help whatsoever. </p>
    <p>     However, with raw cunning I sorted it out. I installed Python 2.75 as a 32 bit MSI [even though I ma on 64 bit windows 7] and now I have it working. Interestingly Fontlab's GUI says "Python is Installed" which makes me think that why on earth didn't they install python FOR me in the first place. </p>
    <p>      So marks so far for the makers of Fontlab Studio:</p>
    <p>     Installation Process: D-           *Why on earth do I have to hunt for the right Python? It's not my job."<br>
         Customer Service:     F                  * Is there any?  </p>
    <p>     Not good so far. I hope that I can give the product an A+   Fontlab is lucky that I am enough of a saint to do so if it deserves it.</p>
