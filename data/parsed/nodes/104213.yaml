      <p>I don't know about the internals (*), but Glyph's unique look-and-feel comes from some <em>heavily</em> utilizing native Mac OS X components.<br>
      It would need not as much "porting" or "re-writing", but rather first finding out how these components actually work; and then you need to find a way to implement similar features on Windows or Linux.</p>
      <p>(*) It can be expected that <em>wherever possible</em> its programmers would use native Mac components, even for "internal" stuff. Suppose OS X contains a native OpenType Feature compiler -- why create one yourself? .. Except that you won't get the same "for free" on Windows.</p>
      <p>Adobe tried to circumvent the whole UI porting problem by programming their own interface, freely borrowing ideas from both Mac and Windows. Alas, it handles as bad as Windows 1.0 once did.</p>
