    <p>I haven't posted on these forums in a long time, but years ago, when I was an undergraduate, Typophile was a big part of my formative design education.</p>
    <p>I was a teaching assistant for a section of Type II at my design school, The Creative Circus. As part of my TA duties, I had five to ten minutes of each class to talk about whatever type-related thing I wanted to talk about. I wrote a blog post about these mini-lectures, and I'd love to hear what y'all think. I'm sure there are things that some of our more curmudgeonly members can pick apart.</p>
    <p><a href="http://edoctor.tumblr.com/post/83022679290/doctor-overanalyzes-typography-ii" title="http://edoctor.tumblr.com/post/83022679290/doctor-overanalyzes-typography-ii">http://edoctor.tumblr.com/post/83022679290/doctor-overanalyzes-typograph...</a></p>
