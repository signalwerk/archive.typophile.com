  html: |-
    <p>Hi,</p>
    <p>i'm looking for a deco serif similar to the style of Artifex/Kimera Type Foundry.<br>
    <a href="http://www.kimeratype.com/pdf/specimenArtifex.pdf" title="http://www.kimeratype.com/pdf/specimenArtifex.pdf">http://www.kimeratype.com/pdf/specimenArtifex.pdf</a><br>
    Artifex is cool (and maybe would match on a "fashion"-project which is in the pipeline), but it is missing lining figures and has only one style (regular), no italics*, no thicker weights.<br>
    Can you suggest me s.th. similar? Keywords: Deco, hybrid, playful, sharp, "feminine", but not totally "over the top"…</p>
    <p>*this is not so important</p>
