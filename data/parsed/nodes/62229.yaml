      <p>@sii:<br>
      I have nothing against language lists on foundry pages. It is good information for customers.</p>
      <p>But I doubt such a client you describe will have specified "Norwegian Bokmål" and/or "Norwegian Nynorsk" in their shopping list. And if they did, they would probably be satisfied to find just "Norwegian", right?</p>
      <p>@ font foundries:<br>
      If you want to attract Norwegian customers: just list support for "Norwegian" -- if you separate it into Nynorsk and Bokmål you just present yourself as a faux-knowledgable ignorant. Not trustworthy. ("If they know that little about our language they probably do not know how to design our glyphs properly")<br>
      If you want to inform international customers needing to set documents in Norwegian: list it as "Norwegian (bokmål &amp; nynorsk)" if you must, but keep it as ONE entry! But then you might as well also list "English (UK, USA, Canadian, Australian)" -- this makes just as much sense...</p>
      <p>It is mostly about spelling.</p>
      <p>The separation of bokmål and nynorsk is getting out of hand -- no need to spread the confusion outside of Norway ;)</p>
      <p>Norwegian is just Norwegian!</p>
