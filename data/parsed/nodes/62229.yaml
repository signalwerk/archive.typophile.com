    html: |-
      <p><em>But then you might as well also list “English (UK, USA, Canadian, Australian)” — this makes just as much sense...</em></p>
      <p>You may be up to something there ... :)</p>
      <p>I think the term "language support" is somewhat misleading, because what really matters are orthographies, not languages.</p>
      <p>For example: In Switzerland people speak German (among other languages), but their orthography is different from the ones used in Germany. The Swiss use no ß. So a font which contains äöü but no ß may be perfectly fine for "German (Swiss)" but not "German (Germany)". Or if you want to set an old German text which contains the long s, you would have to look out for a font supporting "German (pre-1901 reform)" or something like that.</p>
      <p>Or take Latin: Regular Latin can be written with the bare ASCII set, but I remember my schoolbooks used to indicate long and short vowels, so there would be a need for "Latin" as well as "Latin (Grammatical)" support.</p>
      <p>Then there are languages which aren't written at all ... and Languages that are written in multiple scripts, e.g. Serbian which uses Latin as well as Cyrillic, making it necessary to differentiate and not just list "Serbian" as supported.</p>
      <p>Your point about Norwegian is perfectly valid, I just wanted to add some more general considerations.</p>
      <p>Cheers,<br>
      Jens</p>
