  html: |-
    <p>More and more foundries include larger character sets with extended language support in their fonts. This is good.<br>
    (Not all design the "foreign" glyphs well, but that is another discussion ;)</p>
    <p>But when promoting their language support I have noticed that many foundries list "Norwegian (bokmål)" and "Norwegian (nynorsk)" -- and some even also just "Norwegian" -- as separate entries in their list of supported languages. This looks just ignorant to a native Norwegian, as both official languages of Norway use the same character set -- they are to be considered more like dialects.</p>
    <p>If you want to bloat your list of supported languages then go ahead and include both, but why not also include "English, American, Australian, British, Cockney, Ebonics" etc.? Makes just as much sense...</p>
    <p>If you include the Æ, æ, Ø, ø, Å and å glyphs (and some other standard european diacritics) in your fonts they support "Norwegian". Plain and simple. OK?</p>
    <p>So there you have it -- I hope to see some edited "supported languages" lists now...<br>
    ;)</p>
    <p>Roger</p>
