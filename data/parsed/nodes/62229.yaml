      <p>I'm aware of these sources, and have used them myself when deciding for the language support of my reworked fonts - but they are all language related. There is already great enough "confusion" about the two official languages of Norway - but this should have nothing to do with typography. It is a linguistic choice and not really a character set choice. Let's keep the distinction for the linguistics.</p>
      <p>A writer/translator may list knowledge (and a choice) of both languages - that makes sense. But a type designer/foundry listing support of both languages just appears really unknowledgeable about Norwegian (basically not a good way to promote the design quality of the fonts)...</p>
      <p>I am feverishly advocating that we keep this (quite political) distinction away from the type design area. Whichever norwegian language a user choose to write has nothing to do with the character set - both can be written with a font that supports Norwegian.<br>
      Just as you can write "color" and "colour" with the same font without specifically listing that it supports "English (American)" and "English (British)" ;)</p>
