    <p>Hello,</p>
    <p>I'm designing a wedding invitation with Reina.<br>
    I've found difficulties in finding another good font with a x height that match Reina's and looks good with it.<br>
    It will be good also if the font to pair with Reina had several weights. </p>
    <p>thanks very much! :)))) </p>
    <p>(sorry for the bad English) </p>
