  html: <p>Does anyone know the details of how FontLab's .NAM files work? Every sample .NAM file I've seen covers only glyphs WITH Unicode values, but my concern is when I have glyphs I'd like in my font which DO NOT have a Unicode value. Any help would be appreciated. Thanks!</p>
  html_clean: <p>Does anyone know the details of how FontLab's .NAM files work? Every sample .NAM file I've seen covers only glyphs WITH Unicode values, but my concern is when I have glyphs I'd like in my font which DO NOT have a Unicode value. Any help would be appreciated. Thanks!</p>
comments:
  - id: 48779
