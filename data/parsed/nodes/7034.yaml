    date: 2004-10-07T03:22:00
    date_raw: 7 Oct 2004 — 3:22am
    votes: null
    html: <p>Purpose of the .nam file is to map Unicode to PS Name, so it is natural that glyphs that don't have Unicode indexes are not included into .nam file. <br> <br>Note that it is not necessary to put names with "uniXXXX" structure into .nam file, they are processed by FontLab automatically.</p>
    html_clean: <p>Purpose of the .nam file is to map Unicode to PS Name, so it is natural that glyphs that don't have Unicode indexes are not included into .nam file. <br> <br>Note that it is not necessary to put names with "uniXXXX" structure into .nam file, they are processed by FontLab automatically.</p>
