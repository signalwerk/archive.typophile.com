  html: <p>In <a href="https://web.archive.org/web/20150123144818/http://typophile.com/node/51142" rel="nofollow">this</a> thread SuperUltraFabulous (Mike) refers to <a href="https://web.archive.org/web/20150123144818/http://www.linotype.com/304434/ginkgo-family.html?subviewmode=FONTS&amp;samplestr=hamburgefontsiv" rel="nofollow">Ginkgo</a> as a ripoff of Dolly. Have anyone here used it, or have any opinions? My first impression was that this was a very affordable text typeface. I saw the Dutch/Underware-ish touch in it, but never mistook it for Dolly. It looks lovely, though I'm concerned with the bad spacing in the online type tester.</p>
