    html: |-
      <p>Actually thanks for bring this topic up.</p>
      <p>I know what you meant Frode, and I’m not picking on you, :-)  but by even mentioning the price you made <em>the</em> key point about how type designers who make obviously derivative fonts get the attention of graphic designers and make customers out of them—lower prices.</p>
      <p>A scenario:<br>
      Frode, I’m sure that you are very familiar with Dolly, perhaps this is one of your favorites. </p>
      <p>Let’s say you don’t own it. A client or a project necessitates “friendly low contrast” type— tho not any one particular design or foundry. Your smart. The gears start rolling in your head, you have 10 different tabs open in your browser with different designs, you’ve even printed out some PDF’s. You winnow the chaff from the wheat. (I happen to consider myself the expert in and comparison-shopping)</p>
      <p>You’ve got Dederon on your screen and now your thinking. It’s expensive, but thorough. A little wide, but that does emphasize reading direction. It has a sans counter part, but you happen to hate the wobbly looking lowercase g. The repertoire is extensive—yes, but you can develop a hierarchy with other fonts and the sans looks like Lisboa which you might already have or get .</p>
      <p>Dolly is nice. You like almost everything about it except lc g because the ear is too small, you can also forget about opentype automation or numeral options. AND WHERE ARE ALL MY SEXY BUT UNNECESSARY LIGATURES AT? The kerning in Dolly is leagues better so much that it makes Dederon seem downright unprofessional (type a couple of choice <a class="freelinking external" href="https://web.archive.org/web/20150123144818/http://www.fontshop.com/fonts/downloads/suitcase/dederon_serif_family/?&amp;sample_text=%E2%80%9CAsk%20Jeff%E2%80%9D%20or%20%E2%80%98Ask%20Jeff%E2%80%99.%20The%20chef%20d%E2%80%99%C5%93uvre!%20Two%20%5Bof%5D%20(of)%20%E2%80%98of%E2%80%99%20%E2%80%9Cof%E2%80%9D%20of%3F%20of!%20of*.%20%20Ydes%2C%20Yffignac%20and%20Ygrande%20are%20in%20France%3A%20so%20are%20Ypres%2C%20Les%20Wo%C3%ABvres%2C%20F%C3%B4ret%20de%20W%C5%93vres%2C%20the%20Voire%20and%20Vauvise.%20Yves%20is%20in%20heaven%3B%20D%E2%80%99Amboise%20is%20in%20jail.%20Lyford's%20in%20Texas%20%26%20L%E2%80%99Anse-aux-Griffons%20in%20Qu%C3%A9bec%3B%20the%20%C5%81yna%20in%20Poland.%20Yriate%2C%20Yciar%20and%20Ysa%C3%BFe%20are%20at%20Yale.%20Kyoto%20and%20Ryotsu%20are%20both%20in%20Japan%2C%20Kwikpak%20on%20the%20Yukon%20delta%2C%20Kv%C3%A6ven%20in%20Norway.%20%20Kyulu%20in%20Kenya.%20not%20in%20Rwanda.%E2%80%A6 " rel="nofollow"> words</a> in FontShop or Myfonts)</p>
      <p>And now we have Ginkgo. Looks very similar to Dolly and it’s fabbed in OpenType. Cheaper. Linotype or Fonts.com don’t seem to let you preview the kerning, but did I forget to mention its CHEAPER?— you can actually snatch this for about $94.  Oh and there’s the thing you mentioned about the bold too. You even get a bold italic. The lowercase g has a more defined ear than the other two.</p>
      <p>I might have different design priorities than you do or quality expectations. Fonts that have poor spacing and kerning are always a big no-no for me, even if the paux pas lies with international characters. For some folks, such as an American user that will probably will not work with a letter beyond the alphabet, it might be fine. You might care more about convenience, you might like this or that... you get the idea. But the dollar or euro does seem to help us along with our decision making doesn’t it? For $94 Ginkgo isn’t looking that bad.</p>
      <p>The point is that sooner or later someone is going to land on Ginkgo and buy it for whatever reason. Should they? I don’t think so. Why? Because the like the graphic designer that’s doing some serious comparison shopping, so does the type designer making his or her sketches. They ask themselves: “Has this been done already?, Did I base my design on historical models, my own genius (like Unger), or is it a matter of ‘I want to do look like XYZ foundry or XYZ font—I want some of that business’’’? </p>
      <p>Gingko’s type designer had to have known he was making something very close to Dolly and for the reasons stated in the other thread (I can really visualize Dolly behind Ginkgo), I don’t think Ginkgo is a sincere attempt. I don’t think there’s any excuses left for the “me-too” design. The font development cycle takes too much effort and time for an accident.</p>
      <p>More wrinkles: </p>
      <p>There have been designers who have asked or at least stated they were inspired by XYZ font and maybe even got the blessing of the foundry because wanted to try a variation on the original theme.<a class="freelinking external" href="https://web.archive.org/web/20150123144818/http://www.macrhino.com/delicato.html " rel="nofollow"> Delicato is an excellent example.</a> I find that honorable.</p>
      <p>I’m also okay with the type designer that explores another type designers styling but uses unique techniques <a class="freelinking external" href="https://web.archive.org/web/20150123144818/http://typophile.com/node/60949 " rel="nofollow">St. Atmos</a> is another excellent example. (Please correct me on my usage of the words technique and styling.)</p>
      <p>Questions (some I’ve asked before):</p>
      <p>When does a design turn from being a member of the same genre, into a competition design, into a derivative design, and then mostly gravely into a copy? </p>
      <p>Is it using a similar stylistic affection (like brushy foxtail terminals or blocky terminals) onto of a different skeleton or structure?<br>
      </p><div class="imageWrap"><img src="https://web.archive.org/web/20150123144818im_/http://typophile.com/files/LucidaFax_6103.png"></div><br>
      <div class="imageWrap"><img src="https://web.archive.org/web/20150123144818im_/http://typophile.com/files/ms_3806.png"></div><p></p>
      <p>Is it the other case: somewhat similar skeleton different details?<br>
      </p><div class="imageWrap"><img src="https://web.archive.org/web/20150123144818im_/http://typophile.com/files/droid_3703.png"></div><br>
      <div class="imageWrap"><img src="https://web.archive.org/web/20150123144818im_/http://typophile.com/files/arrietta_3846.png"></div><p></p>
      <p>What about borrowing a glyph or two and making the rest different?<br>
      </p><div class="imageWrap"><img src="https://web.archive.org/web/20150123144818im_/http://typophile.com/files/nassim_6089.png"></div><br>
      <div class="imageWrap"><img src="https://web.archive.org/web/20150123144818im_/http://typophile.com/files/quartzo_6333.png"></div><p></p>
      <p>Could we say that Dolly originated the genre of brushy low contrast type?  </p>
      <p>Would that constitute Dolly as the historical model or prototype for all the following inspired works and should we view it the same way we would new release that’s spin on the—let’s say—the gerald genre?</p>
      <p>There’s more to add. But I’ll let you talk amongst yourselves,</p>
      <p>Mike Diaz</p>
