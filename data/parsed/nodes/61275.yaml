      <p>Bram de Does's <a href="https://web.archive.org/web/20150123144818/http://www.teff.nl/fonts/lexicon/index.html" rel="nofollow">Lexicon</a> predates Dolly by at least a decade. Lexicon is far pricier, too… but it is just simply divine. Dolly is its own typeface, and I would never see it as a Lexicon-copy. To say that Dolly initiated the brush-terminal oldstyle serif genre is not the case. Even Lexicon is probably not the first example of this…</p>
      <p>I think that Ginkgo is different from Dolly. But don't take my word for it! If it is different enough for this year's TDC judges to have selected it as one of the best typefaces that they saw in the competition, then that is good enough for me.</p>
