      <p>Do the judges really verify for originality or is it case by case, design by design?</p>
      <p>Cassius, Geneo, Novel, and even the genius Alda share some genetics with Dolly—some more distant than others—tho all stand on their own. </p>
      <p>It’s the application of a global softness— no hard points as if drawn by a wide tip marker. It’s the puffiness of a leg or a spine that imparts humor, friendliness, or even femininity. There is also a 3D quality to the serifs or slabs that Dolly started.</p>
      <p>The except is Gingko, which I think does not on its own.</p>
      <p>Even though Lexicon has more contrast, I do see what you are talking about.</p>
      <p>(I’ve brought this up before)<br>
      Structurally Dolly does have a progenitor... ?:</p>
