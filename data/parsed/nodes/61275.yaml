      <p>&gt; But don’t take my word for it! If it is different enough for this year’s<br>
      &gt; TDC judges to have selected it as one of the best typefaces that they saw<br>
      &gt; in the competition, then that is good enough for me.</p>
      <p>What is this, an infomercial?<br>
      A jury is made up of humans, so mistakes happen. Don't you remember the Alex White stuff? But most of all, as Mike suspects, even if a jurist is inclined to research originality he's absolutely not given the time. In fact my biggest complaint about how most competitions are run is the hopelessly breakneck speed - it's almost like the point is raising money and publishing results, and the actual judging is a necessary evil.</p>
      <p>But here's an idea that might allow competitions to gauge originality within the very short timeframe: a font jury could have an expert ID hound (chosen of course from the incomparable pack here) who would quickly identify a potentially too-close precedent and bring it to the attention of the entire jury on the spot. Of course that presumes the judging is NOT seen as a necessary evil, but instead something to be done delicately and diligently... just like type design itself.</p>
      <p>hhp</p>
