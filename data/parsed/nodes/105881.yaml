      <p>There is one more trick … especially when working on a low contrast typeface, it may save a lot of time.</p>
      <p>Start with an upright typeface<br>
      – reduce the weight of the horizontal strokes by approx 10%. Unless you already have made a high contrast or a thinner version, you’ll have to do this manually. When you already created one of such variations, Multiple Master (or whatever it is called in the program you’re working with), combined with different interpolation values for x and y will be of great help.<br>
      – scale the typeface in horizontal direction by approx 96%. Depends a little on the angle, colour and the width of the italic you have in mind. Has to be balanced against the reduction of horizontal weight as well.<br>
      Do several rough tests with different reductions of weight and amount of scaling with some key characters to get the right color. Especially with sans serifs this is very critical.<br>
      – slant the typeface at a rational angle. Doing so, the bcp’s become easier to handle &amp; the rational angle makes shure that they will never create bumps in the transitions from straight to curve when they are short.<br>
      Go here <a href="http://issuu.com/fontfont/docs/ff_din_round" title="http://issuu.com/fontfont/docs/ff_din_round">http://issuu.com/fontfont/docs/ff_din_round</a> and check page 20–21. Don’t bother about the typeface in question having round stroke endings. The mathematics described go for all italics and for all transitions from straight lines to curves.</p>
      <p>Now take a close look on what Briem suggests. I’ve never tried to combine his suggestions with my procedure, but I think that when you follow his suggestions after getting the weight right using my procedure, you’ll be heading for a perfect italic!</p>
