    html: <p>"Incubator experiment 1" on youtube.com, shows that a few simple overlapping bilatrally symetrical shapes, circularly oriented,  when under the influence of interpolation, and animated, as in this example, can lead to 1,000s of still shapes of interesting design. I personally, find the still variety to be a bit boring and repetitive, but I can see how massing them into arrays and then printing them, could be interesting, to some.</p>
