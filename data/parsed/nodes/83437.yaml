      <p>What specific secret method are you looking for? In terms of the icons, they are elements repeated radially then combined with various masking/combining/cropping. Doesn't seem too top-secret. </p>
      <p>As for taking them all and combining them into an image, there is software out there that does this. Google 'photo mosaic software' to find some options.</p>
