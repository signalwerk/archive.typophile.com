    <p>Hi everyone!</p>
    <p>I' experience a really odd situation with Table of Contents for an InDesign book.<br>
    I have 25 chapter in 25 indesign docs with sections defined as 1.1 to 1.x.<br>
    I created a book with all files.<br>
    I go to chapter one and tryed to created a Table of Contents of all book.<br>
    Aparently it creates all text correctly and put them alphabetically ordered but it order also the pages in ascending way (what gives a complet wrong Table of Contents).</p>
    <p>like this:</p>
    <p>A   1.1<br>
    AA  1.2<br>
    B   2.1<br>
    CC  2.2<br>
    etc</p>
    <p>Anyone knows what is going on?<br>
    I try to google it...but no luck</p>
    <p>Thanks in advance</p>
    <p>António Fonseca</p>
