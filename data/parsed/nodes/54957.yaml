      <p>After some weeks with ADOBE tech support, they come up with this awnser. I posted just in case someone had the same problem:</p>
      <p>----------------------------------<br>
      There are a number of bugs regarding prefixes and TOCs in CS3 marked as<br>
      fixed I tested and could replicate without too many problems.</p>
      <p>Same steps in CS4 work fine!</p>
      <p>Our advise is to download CS4 trial and test this to see if this work<br>
      successfully.</p>
      <p>So unfortunately there are no fix for this in CS3, but the issue was<br>
      fixed in CS4. So only solution would be to upgrade to this version.</p>
      <p>We are sorry for any inconvenience!</p>
      <p>--------------------------------</p>
      <p>António Fonseca</p>
