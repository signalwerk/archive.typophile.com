      <p>António -- Try something: Check in the Book Palette flyout menu &gt; Document Numbering Options and see if Document Chapter Numbering is set to "Continue from Previous Document in the Book".</p>
      <p>If not, see if checking this makes a difference in how the TOC feature treats your documents.</p>
      <p>You will need to set this separately for each chapter file in the Book palette. Then you may also need to select Book Palette &gt; Update Numbering &gt; Update Chapter &amp; Paragraph Numbers.</p>
      <p>I'm not sure if this will make a difference, but it's something that might be worth trying. (You might want to back up your files: working with the Book palette and updating/synchronizing can sometimes have undesired effects and you'll want to be able to go back if this doesn't work and instead screws something up.)</p>
      <p>HTH</p>
      <p>-- K.</p>
