      <p>Oh, okay, so each "chapter" file is really a Section, with section prefix? </p>
      <p>So, you might have </p>
      <p>Acessório 3.24<br>
      Adaptadores com agulha 2.12<br>
      Adaptadores sem agulha 3.12<br>
      Adesivo em não tecido 1.8</p>
      <p>like that?</p>
      <p>I've been testing and I can re-create your problem. Looks like it has nothing to do with the Section prefix and numbering. The problem seems to be the Alphabetical sorting. Even with typical pagination, the TOC feature sorts entries, but does not treat page numbers as uniquely attached to entries and leaves them in ascending order.</p>
      <p>I would contact Adobe and submit this as a bug report.</p>
      <p>Maybe if Eric Menninga visits this thread, he might have some insight.</p>
      <p>Good luck.</p>
      <p>-- Kent.</p>
