      <p>Let me see if I understand -- You have 25 chapters. Each chapter might include multiple sections. Each of these sections, within each chapter, will begin numbering anew. So, you might have page 2.4 (Section 2, page 4) in Chapter 1, but also in Chapter 5?</p>
      <p>If that's correct, then InDesign might be choking on all the duplicated numbers (though I don't see why it should). Not sure why it's not keeping the associated page numbers with the entries.</p>
      <p>Normally a Table of Contents is not organized alphabetically, but rather in content/pagination order. Sounds more like you are creating an Index (even if you are putting it at the beginning of the catalog). Have you considered using the Index feature to generate your list instead? It's a lot more work to put in the markers, but it's probably more robust and might be better at handling your unique situation.</p>
      <p>Of course, at that point, it might just be easier to make up the list manually, the good ol' fashioned way. Unless you're planning on doing a lot of switching things around and want to have the TOC update automatically.</p>
      <p>Another solution might be to just generate the TOC in typical pagination order (which if I understood you correctly, InDD did just fine). Then copy the text into a word processing document, sort your list alphabetically, and reimport into your design file. If formatting is an issue, you might be able to export the text as tagged text and work around that in your sorting.</p>
      <p>-- K.</p>
