    html: |-
      <p>OK. I will try to explain better my situatin.</p>
      <p>- We have 25 documents marked on the numbering options as different sections. Sections go like this: 1, 2, 3, 4, etc.<br>
      - We also use the "include section prefix" option and set it up to: 1., 2., 3., 4., etc.<br>
      - We use "Start page numbering at: 1" instead of automatic page numbering because we need it to start anew, we want the pages to be numbered like this: SectionPrefix.PageNumberOfTheSection</p>
      <p>So, our catalog chapters go like this: 1.1, 1.2, 1.3, 2.1, 2.2, 3.1, 4.1, 4.2, etc.</p>
      <p>Hope that's clear enough for you to understand how the numbering is structured.</p>
      <p>Onto the problem now. The table of contents.<br>
      Ideally we would create a book, include all the 25 documents and add a new document for the TOC itself, then we would go create the TOC through the method we all know and select the option "Include book document: X.indb". This indeed creates a TOC and does indeed grab all the titles from all the 25 documents in the book. Problem is, it sorts them by ascending page number, while we need it in entry alphabetical order.<br>
      Ok then, select the  "Sort entry in alphabetic order" option in the TOC menu you would say. Well we did, and this is what's happening:</p>
      <p>Acessório                     1.1<br>
      Adaptadores com agulha        1.2<br>
      Adaptadores sem agulha        1.2<br>
      Adesivo em não tecido         1.2<br>
      Adesivo em não tecido         1.2<br>
      Adesivos                      1.3<br>
      Água bidestilada              1.3<br>
      Agulhas                       1.3<br>
      Agulhas de mesoterapia        1.4<br>
      Álcool etílico sanitário      1.4<br>
      Algodão em corda              1.4<br>
      Algodão hidrófilo             1.5<br>
      Algodão hidrófilo             1.5<br>
      Aplicadores de algodão        1.5<br>
      Aventais plásticos            1.6<br>
      Bastões de limpeza            1.6<br>
      Bata para tratamentos         1.6<br>
      Batas                         1.7<br>
      Batas                         1.7<br>
      Bolas e discos de algodão     1.7<br>
      Caixa dispensadora            1.8<br>
      Calça de pressoterapia        1.8<br>
      Calção em não tecido          1.8</p>
      <p>Acessório is not on page 1.1 (nor are all the other products listed in the correct page)! It's just the alphabetical order kicking in with the ascending page number sorting at the same time, creating a mess for which I have no explanation. As you can probably guess this is no good. It just connects the products starting with A with the first pages, B with the next ones and so on.</p>
      <p>Basically we'd like to know how to remove the page numbering sorting from TOC.</p>
      <p>I'd be a very happy man if someone could explain what's happening here, though it might be a bug.</p>
      <p>Thank you very much for reading!</p>
      <p>António</p>
