      <p>@ adilturbo</p>
      <p>David Lemon’s tutorial is a step by step tutorial, but for PostScript flavored fonts only.</p>
      <p>1. Set the alignment zones with the help of the tutorial.<br>
      2. Set the standard stem values with the help of the auto function of FontLab. It is in the font info panel. (You have to use the autohinting function of FontLab first [F7].) Later you can manually tune the standard stem values.<br>
      3. Remove all hints.<br>
      4. Hint the fonts with the AFDKO autohinting macro. (There is a bug in the macro, which I have corrected. You can download it <strong><a href="http://forum.fontlab.com/adobe-fdk-for-opentype-afdko/bug-in-autohintscript-belonging-to-the-afdko-25-21898-t7057.0.html" rel="nofollow">at the FontLab forum</a></strong>.)</p>
      <p>There are a few FontLab options, that you should deactivate:<br>
      "Use subroutines to compress outlines in the CFF table" and "Autohint unhinted glyphs".</p>
      <p>PostScript hinting is much easier than drawing the outlines. So, if you have designed the typeface, you are for sure able to hint it.</p>
      <p>I never have hinted a TrueType font. I don’t know, how difficult basic TrueType hinting is, but Delta hinting seems to be a science. I have heard, that only a few people have the knowledge and the abilities to set Delta hints.</p>
