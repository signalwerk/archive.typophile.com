      <p>TrueType or PostScript flavored fonts?</p>
      <p><strong><a href="http://typophile.com/files/hinting.pdf" rel="nofollow">The PostScript hinting tutorial by David Lemon</a></strong> is good. It only misses the information about how to set the stem weight values. But a while ago Ken Lunde and David Lemon have provided useful information in the thread <strong><a href="http://typophile.com/node/59506" rel="nofollow">PostScript hinting -- number and weight of standard stems</a></strong>.</p>
      <p>By the way, Adobe works on a new tutorial. I hope that it will be released with the next version of the AFDKO (Adobe Font Development Kit for OpenType). Or is it already available? That would be very cool.</p>
      <p>The AFDKO contains an excellent autohinting program. But the alignment zones and the stem weight values have to be chosen manually.</p>
      <p>If you want to hint a TrueType font, I can’t help. I only know one tutorial. There is a link on the myfonts website. But as far as I remember it is not about Delta hinting.</p>
      <p>You also should have a look into the FontLab manual.</p>
