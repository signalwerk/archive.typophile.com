      <p>Hi Neha,</p>
      <p>you might like <a href="http://www.fonts.com/FontPackages/SuperFamilies/11-01-2004.htm" rel="nofollow">Legacy</a>. Like Centaur, it is a revival of the work of <a href="/wiki/Nicolas%20Jenson" class="freelinking" rel="nofollow">Nicolas Jenson</a> – and it has a sans companion!<br>
      Furthermore, I can imagine <a href="http://new.myfonts.com/fonts/ef/today-sans/" rel="nofollow">Today Sans</a> to work quite well.</p>
      <p>Related thread: <a href="http://typophile.com/node/31046" rel="nofollow">Sans Companion for Bembo Book</a><br>
      F</p>
