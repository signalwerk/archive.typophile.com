      <p>Shinntype's <a href="http://www.shinntype.com/figgins.html" rel="nofollow">Figgins Sans</a> has a small x-height and large contrast between cap and lower case stem widths.</p>
      <p>You could use it with an oldstyle like Centaur or Bembo, or with <a href="http://www.shinntype.com/scotch.html" rel="nofollow">Scotch Modern</a>, which it was designed to partner.</p>
