    html: |-
      <p>Technically, you could make a Mac font family with up to 48 styles with Family Builder, but that was only because Outline, Shadow, Condensed, and Extended were available besides Italic and Bold. Practically no fonts were shipped with anything but families comprised of the basic four-font scheme (R/I/B/BI). So you still had to break multi-weight families into subfamilies back then.</p>
      <p>Building Mac Type 1 fonts isn't really any different now, it's just that FontLab is designed for so many more possibilities.</p>
