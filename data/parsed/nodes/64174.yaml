    <p>I know it is being depreciated but I need to generate a large font family in Mac PostScript Type 1 format.</p>
    <p>And none of the current family members are named Plain, Italic, Bold or Bold Italic.</p>
    <p>I remember seeing this discussed here before and the process just seemed ridiculously complicated.</p>
    <p>Does anybody have a link to those earlier discussions?</p>
    <p>________________</p>
    <p>Also... the whole process of generating type one and suitcases used to be so simple using Fontographer years ago.</p>
    <p>Is that still the case with the new updated Fontographer?</p>
    <p>Or have things just become that much more complicated across the board now?</p>
