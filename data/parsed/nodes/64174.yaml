      <p>Have you read the section "Building Font Suitcases" in the FontLab manual (page 312)? Seems like all the necessary info is there. </p>
      <p>I think the only thing you can't do with FontLab is put more than the basic four-font family into one suitcase. But I'm pretty sure that Family builder couldn't do that either. To do that in the olden days I used the Finder, which let you open suitcases as if they were folders and move fonts in and out of them. Not possible anymore with the OS X Finder, unfortunately.</p>
