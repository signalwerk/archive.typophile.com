      <p>Too busy, font overkill.<br>
      The silly little ampersand is getting crushed.<br>
      But perhaps that ﬁts the agency.<br>
      Not a <em>Mad Men</em> watcher, so I wouldn’t know.</p>
      <p>While none of the type is anachronistic in the sense of being designed after the supposed date, the Eurostile is a bit passé. The Ogilvy &amp; Mather-ish ampersand is an afterthought, at odds with the reductive quality of the Futura Black/Albers stencil style. Sure, stencils are hip now, but did the designer think that people wouldn't get the 60s thing without the ampersand and the still-techy Eurostile? </p>
      <p>From 1968:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/PapasMamas_6663.jpg"></div><p></p>
