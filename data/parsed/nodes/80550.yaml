    html: |-
      <p><em>a "bland" typeface can do one heck of a job</em><br>
      A complete family of faces for a brand will include simpler versions as well that may have to work in an Office environment. We’ve done versions of Bosch Sans and DB Sans (exclusive for Deutsche Bahn, German Railways) to the widths of Arial (which is fitted to Helvetica widths) so text wouldn’t re-run in documents that don’t have the original font installed. Those are compromises and may look less than perfect, but this is what we do to make things work. But this doesn’t mean that all the members of an exclusive family of faces for a big brand have to be faceless (pardon the pun). All our recent families have included Sans and Serif, normal and condensed, even wide and compressed. They all share certain features and belong together, not like twins but like sisters, brothers, nieces and nephews. Designing one corporate typeface is so 80s and betrays a design philosophy that aims for uniformity and is hardly adequate for today’s media requirements. Wo wants to read a printed annual report in the light weight of geometric sans? Or tight spreadsheets in a generous serif? A brand needs to express all its communication in the appropriate visual voice. And type is visual language that needs to whisper, shout, sing and murmur, wherever necessary.</p>
