    html: |-
      <p><em>something more quirky in Adobe Clean</em></p>
      <p>Putting more Gill into Myriad and cutting bits off the ends qualifies as quirky? Pretty lame, considering Adobe’s history and typographic talent still in the building. Seems another occasion where some art director or brand person wanted something a little “different” but not too original, lest that might test badly in focus groups.</p>
      <p>And, @typodermic:<br>
      I never signed anything with Nokia. I supplied very rough outlines for a few weights with incomplete character sets which were turned into complete fonts by Jelle Bosma at Monotype. I suppose I could go back to the original sketches and make a new typeface, although some people here would find that one old-fashioned and tired. So far, however, all my designs from the late 80s (like FF Meta and ITC Officina) are still selling quite well. But then again, life is probably too short to warm up old ideas. I’d rather work on new ones.</p>
