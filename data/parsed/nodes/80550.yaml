    html: |-
      <p>The comparison on the DaltonMaag site is unfair. It only shows one of the Condensed weights. Nokia is a big family, including a Wide version (made by Jelle Bosma at Monotype) which is far less explicit but therefore perfectly suited to being used on UIs. Nokia Serif doesn’t even get a mention at all. Seems that Nokia never used it. That puts them far behind cleverer companies who realize that they need more typographic expression across all media than offered by 3 weights of a generic Sans.</p>
      <p>I have posted a <a href="http://spiekermann.com/en/downloads" rel="nofollow">PDF</a> on my blog that contains an early (2002) presentation of the complete family, with some comments by me about the shortcomings of these early pre-release fonts.</p>
      <p>Either the communication and marketing people at Nokia didn’t bother to look at what they had (it seems that they change personnel very often, losing knowledge with every generation) or Bruno Maag’s selling talent won the day. It would have been a much better idea to look at the existing fonts, analyze them from a branding and technical point of view and then bring them into the present. Ten years is a long time for any technology, including fonts, but there is no reason why old benefits could not be combined with new requirements. Technically, Nokia Pure is a great typeface, as everything is that DaltonMaag produce, but it won’t be half as memorable as the good old Nokia Sans and Serif were.</p>
      <p>Designing fonts for brands needs a combination of technical and branding know-how and this time the engineers seem to have won. Unless, of course, Nokia deliberately wants to be as bland as Microsoft.</p>
