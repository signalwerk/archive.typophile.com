    html: |-
      <p>I thought Nokia Sans looked good on recent Nokia touch devices but the phones themselves failed to conquer the market. It looks obvious Nokia are trying to distance themselves from the past in an attempt to seem contemporary.</p>
      <p>Do all brands need to be timeless? Is it wrong to rebrand every decade? For a quick-changing industry that barely existed 25 years ago, a strong identity that was for some time omnipresent and well recognized might be keeping the associations the public has with the brand to a certain popular technology that now is a decade old.<br>
      Perhaps, had Erik's typeface had less character, the association the brand has with the now 'old' type of phones would not be so strong and the font could stay.</p>
      <p>If you look at Nokia history it would seem absurd for them to use their branding from the time they were selling rubber and paper. Five years old Nokia phones are now this: Nokia rubber. </p>
      <p>Nokia is trying to rebrand quite desperately, and understandably so. Just to think that 4 years ago Nokia E61 was the ultimate 'internet phone'—this alone brings a smile on my face.<br>
      The game has changed and they want to convince everyone they're still on top of it. They want to cut the associations with the technology now seen as obsolete.</p>
      <p>Coca-Cola on the other hand—back when Nokia produced paper—sold sugar water. Now, Coca-Cola sells sugar water. They are more of the type of company that could do with a 'timeless' brand.</p>
      <p>Is it me or… Doesn't Dalton Maag's press release look a tad ironic with the rotisesque Stroudley they use on their website?</p>
      <p>Quick, somebody tell them their brand looks dated!</p>
