      <p>What's troubling you exactly with what Bringhurst says?</p>
      <p>The Chicago example is interesting. By putting the footnote call after the guillemets, it shows that the reference concerns the whole "A vrai dire, ..." and not only the last citation « Vois combien ... » within it.</p>
      <p>I forgot to mention it last time, but an interesting online resource about french (ortho)typography is Jean-Pierre Lacroux, <em>Orthotypo</em>, available at <a href="http://listetypo.free.fr/JPL/Orthotypo-Lacroux.pdf" title="http://listetypo.free.fr/JPL/Orthotypo-Lacroux.pdf">http://listetypo.free.fr/JPL/Orthotypo-Lacroux.pdf</a></p>
