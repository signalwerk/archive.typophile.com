    html: |-
      <p>Different countries speaking French may have different rules, but in France it's generally the Imprimerie Nationale's rules which are followed. In the <em>Lexique des règles typographiques</em> (1990) p. 25, the rules given are that footnote calls are preceded by a thin, unbreakable space and that the footnote calls always precede punctuation, including guillemets when citing material.</p>
      <p>The examples given are :</p>
      <p>Veuillez agréer ¹... (thin space before the footnote call)</p>
      <p>.. le nom attributé à une rue, à un établissement, etc.¹. (no space after or before)</p>
      <p>Chateaubriand l'appelle « le grand expiateur ¹ » (thin space before and after the footnote call)</p>
