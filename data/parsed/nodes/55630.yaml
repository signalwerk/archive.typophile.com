    <p>Dear All,</p>
    <p>I'm an English Canadian designer working with a French Canadian designer on a project that involves both English and French typography. I've read a number of Forums that touch on the issue of "air" around punctuation in French typesetting. As my French is poor, I'm wondering what refinements are encouraged in French typography with specific regard to superscripts for footnotes, as well as punctuation in general. Should the Superscripts be set before, on top of or after punctuation? I've attached some samples that point to a specific style, but are these styles correct? And if so, which one is best suited to book typography?  I am a proponent of TEOTS, and yet Bringhurst hardly touches on the subject. </p>
    <p>Thanks in advance.</p>
