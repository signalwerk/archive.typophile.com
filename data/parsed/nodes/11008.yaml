  html: <p>For those who haven't already heard, the Bitstream Vera fonts have finally been released in their official, open-source version.  As the GNOME site says, "happy font hacking"... <br> <br><a href="http://www.gnome.org/fonts/" target="_blank">http://www.gnome.org/fonts/</a> <br> <br>(Oh, and incidentally, Vera Sans Mono has become my default monospaced font.  It's quite readable, and I like it even better than Andale.)</p>
  html_clean: <p>For those who haven't already heard, the Bitstream Vera fonts have finally been released in their official, open-source version.  As the GNOME site says, "happy font hacking"... <br> <br><a href="http://www.gnome.org/fonts/" target="_blank" class="link-external">http://www.gnome.org/fonts/</a> <br> <br>(Oh, and incidentally, Vera Sans Mono has become my default monospaced font.  It's quite readable, and I like it even better than Andale.)</p>
