    html: <p>Hi, Samann. <br> <br>Once again, I agree with Hrant -- the 3rd <b>h</b> is the one I like best, followed by the 4th one. <br> <br>As for your earlier questions... I like your typeface. It has a certain elegance. But yes, I feel that the <b>s</b> needs some work. And I agree with DeWitt's comments about the <b>e</b> and the <b>g</b>. <br> <br>I look forward to seeing more of your work!</p>
