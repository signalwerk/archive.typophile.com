    <p>&lt;font class="dontLookLikeCrap"&gt;Hello! <br> <br>I am currently finishing the lc glyphs of my first typeface, an - yet to be named - sans serif font. <br> <br>Before advancing too much I would appreciate some comments on this preview: <br> <br> <br>I know there is still a lot of work to be done - especially with the e, r and s. <br> <br>How do you like the feel of it? does it feel too light for a regular? <br> <br>I would be grateful for some feedback - no need to be gentle! <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0">&lt;/font&gt;</p>
