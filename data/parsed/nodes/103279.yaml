      <p>'Le Chat Cambrioleur' must be <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Bitstream&amp;ffam=AlternateGothic2%20BT%20-%20Regular&amp;fid=ee80a9129db5d24062f0d322cdc55900&amp;fsize=60&amp;text=LE%20CHAT%20CAMBRIOLEUR&amp;fit=1" rel="nofollow">Alternate Gothic2</a></strong> although <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Linotype&amp;ffam=Trade%20Gothic%20-%20Bold%20Condensed%20No.%2020&amp;fid=66f2d1e45be09de0c1e35f906cf0a4d8&amp;fsize=60&amp;text=LE%20CHAT%20CAMBRIOLEUR&amp;fit=1" rel="nofollow">Trade Gothic (Bold Condensed No. 20)</a></strong> is also close</p>
      <p>------------------<br>
      I found it using "Find my Font": <a href="http://www.findmyfont.com" title="http://www.findmyfont.com">http://www.findmyfont.com</a></p>
