      <p><a href="http://www.testpilotcollective.com/tpc/" target="_blank" rel="nofollow">Test Pilot Collective</a>. Bastard was given away as a free font toward the end of 2001 (I have a copy of the User License). If you want to use it commercially, I'd contact them.</p>
      <p>If you simply like the squared, thick n' thin style of Bastard, it seems to have been heavily influenced by <a href="http://old.myfonts.com/fonts/redrooster/eden-pro/" target="_blank" rel="nofollow">Eden Bold</a>.</p>
