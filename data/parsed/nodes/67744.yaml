      <p>James</p>
      <p><em>The legacy of modernism expressed by design pedants and pundits of the USA and Europe would love us to believe that there are all these universal rules and principles that must be learned and manipulated.</em></p>
      <p>For me, modernism is the most poignant idea. I return to it time and time again to measure the ideals against the realities. The term is misleading because is at once a philosophy (perpetual) and a movement (partially eclipsed). It is a misconception that modernism is a rule, given that it's origin is dynamic departure, and that the modernist movement encapsulates a broad spectrum of political ideas from socialism to fascism, disparate and united all at once. The search for empirical truths is one emergent aspect of modernism, but by no means definitive as suggested.</p>
      <p><em>But a good afternoon spent studying design untouched by modernism reveals that it’s all just a matter of taste, and tastes change with the wind.</em></p>
      <p>I think it is also important to note that the protagonists of the modernist movement took many cues from outside their own culture and time, Josef and Anni Albers looked to indigenous South American culture, Gaugin worked toward primitivism etc. In that sense modernism is touched by the things one might consider untouched by modernism. These influences have been taken up inside of it, as an influence, something to react to, something to learn from, some forgotten value – eclipsed by religious art, illusionism and the weight of European culture – reinstated.</p>
      <p>This is what a college assignment should challenge, embrace, assault, imbue.</p>
