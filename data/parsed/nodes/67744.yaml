    html: |-
      <p>Of course there are certain rules which make a design that will always have some degree of aesthetics, think of the golden ratio, using only red and black as printing colors for typography or things like contrast types (color or shapes) They will always give you an image, if correctly used, that will be pleasing to the eye.</p>
      <p>But mostly, these rules are there to be broken, to make more visually appetizing designs. Those rules have been in use for a long time and give us visual clues on what to expect since we've seen them so much around. But in the end the main point the design will have to convey is information or a message, which in the end is what graphic design is all about, and that's how such assignments (at least in my opinion) should be rated.</p>
      <p>So design isn't really subjective, it's all down to the message you want to get across. If you think your instructor is letting himself be led by own opinions and not the briefing, it's best to analyze why he would find it that way (or better just ask him) Myself, of course depending on the brief, wouldn't let conventions or strict uses of a type hinder me with creating a design, but of course I don't know how strict the assignments are.</p>
      <p>Remember, your own design always makes perfect sense while a different person can sometimes just not understand it, or find it pleasing.</p>
