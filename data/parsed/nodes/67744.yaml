      <p>I will give you credit, you somehow made Arial look better than I thought it could look. I would have chosen a different typeface to highlight the Gothic sans serif family of typefaces. That said, having been a student I know that students don't always have access to a wide variety of fonts. As oranginas pointed out there isn't much that's remarkable about Arial. It's pretty much a cheap knockoff of Helvetica and Franklin Gothic because Microsoft didn't want to pay licensing (that's the story I've heard at least).</p>
      <p>You're going to run into a lot of subjectivity in design. When I was in school my advisor and I had vastly different ideas about design. He is very old-school, influenced heavily by the Swiss aesthetic whereas my heroes are designers like Paula Sher, David Carson and Miles Reid. None of whom can in any way be linked to the Swiss aesthetic. Aesthetic is aesthetic and it's purely subjective. Some people prefer structure and minimalism and I prefer to see designs that break rules. In order to break those rules though, we need to learn the rules, and we need to learn what can or cannot be broken.</p>
      <p>Anyway, good luck in school. It's very important that you don't take criticism personally, even if someone is trying to make it a personal thing. They're probably making it personal because we are all human and we all react to design in personal ways.</p>
