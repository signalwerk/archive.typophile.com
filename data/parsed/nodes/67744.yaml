      <p><cite>In order to break those rules though, we need to learn the rules, and we need to learn what can or cannot be broken.</cite></p>
      <p>What we really need to learn is that most of those rules are entirely subjective to begin with. The legacy of modernism expressed by design pedants and pundits of the USA and Europe would love us to believe that there are all these universal rules and principles that must be learned and manipulated. But a good afternoon spent studying design untouched by modernism reveals that it’s all just a matter of taste, and tastes change with the wind.</p>
