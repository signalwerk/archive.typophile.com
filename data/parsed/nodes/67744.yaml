    <p>So I'm in graphic design II at a university, and our latest project was to choose 3 typeface families and produce layouts for each. For each one, we had to use one typeface from that family and showcase it by displaying the alphabet and using general information to use and show as copy. </p>
    <p>One of my three was definitely my favorite and i was excited for the critique that night to find out what my instructor thought. Turns out he didn't really like it. He said of my three it was the most innovative but he wasn't crazy about it. I personally think he didn't like it because he wouldn't use the type the way I did. </p>
    <p>So my question is, are typography and design subjective or are the universal rules and boundaries that must be adhered to in order to be successful?</p>
  html_clean: |-
