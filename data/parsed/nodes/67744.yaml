    html: <p>The impractical aspects of design are largely subjective. The practical aspects are not. And what is practical and impractical is also subjective, especially if the brief is quite open. If your professor just doesn’t like your fonts on arbitrary aesthetics grounds then use the fonts you like. But if you have picked fonts that fail to meet the project brief, or that keep the design from functioning as it should, pick new ones. Make sure to ask your professors why they aren’t crazy about your designs—you’ll learn more that way, and so will they.</p>
