      <p>Design is subjective only when the "aim" is lost to the viewer or from the designer when creating it. When you watch a film you take in something through your own world view. However when you see the making of the same film and understand the "aim" of the director, you will better understand the work to see it through the director's eyes, their personality, their world view.</p>
      <p>So rather than asking is design subjective, remember that design is intention.<br>
      A few questions arise from this:</p>
      <p>- Did your work truly communicate what was intended?<br>
      - Did your work come out based on the limitations of your own style?<br>
      - Or you designed for the problem at hand instead?<br>
      - If the receiver doesn't think so, then why?<br>
      - Did their justification help you understand what you missed?<br>
      - Does the receiver understand what you communicate? Why or why not?<br>
      - If you had more time, more skill, more budget, would you have done it the same way? That is to say, did you execute this in the best way possible for the problem at hand.</p>
