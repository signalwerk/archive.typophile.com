    <p>HI all,</p>
    <p>I could really use some advice, as I'm driving myself nuts worrying about this. So any input would be very, very much appreciated :) </p>
    <p>Long story short - I was working on a large design job for a publication over the last year. During the project I tried out several different typefaces, and finally the client and I settled on the DIN Condensed family. </p>
    <p>I'm not entirely sure where I got the fonts from in the first place, but I was using them. I then planned to purchase the font license before the project went to print. i.e. I'm trying to be completely legit.</p>
    <p>The problem is, now that all of the work is done I can't actually find where I can purchase EXACT version of DIN Condensed that I've been using. </p>
    <p>I didn't realise there would be any difference between versions, so I went ahead and bought FF DIN Condensed OT. I then removed the version I had been using, but found that inDesign didn't recognise it as the same font!</p>
    <p>The original font files had names like 'FF DINCond-Bold' and 'FF DINCond-Medium'.</p>
    <p>The new ones that I've purchased have names like 'DINOT-Cond.otf' etc...</p>
    <p>So my questions are:</p>
    <ul>
    <li>Does anybody know where I can purchase those fonts? And do I even need to seeing as I have a license...?</li>
    <li>I find it quite confusing, as there seems to be dozens of versions of DIN alone... How can you tell exactly which version a font is before you buy?
    </li><li>I've since found versions of all of the DIN Condensed fonts available for download on the free fonts website [name removed by moderator] - does this mean I didn't need to purchase the fonts at all? i.e. they are public domain, as the website says...</li>
    </ul>
    <p>Apologies for all the questions. I could just really use some advice (worrying myself sick that I've screwed up!<br>
    Thanks a million.</p>
    <p>Cheers<br>
    Dee</p>
    <p>P.s. by all means tell me if I'm worrying about nothing!</p>
