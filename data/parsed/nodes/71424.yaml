    html: |-
      <p>Dee, sounds like the fonts you originally used were Postscript versions, and you purchased Opentype versions. They should be essentially the same, and you would merely go to "Find Font" in InDesign and replace the Postscript version with the Opentype versions.</p>
      <p>The website you mentioned is illegally posting fonts. I checked it out, and they are hosting and allowing free downloads of fonts that are owned by major type foundries. They may have some public domain fonts on there, but I would steer clear of that site.</p>
