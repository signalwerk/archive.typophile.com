    html: |-
      <p>Sorry, but the lettering on this book cover (circa 1899) was hand lettered, not typeset.</p>
      <p>The look of TIVERTON TALES could be replicated with something like Carlton (good for everything but the R):<br><a href="https://www.myfonts.com/fonts/itc/carlton/">https://www.myfonts.com/fonts/itc/carlton/</a></p>
      <p>Carlton isn’t half bad for BY ALICE BROWN, either.</p>
