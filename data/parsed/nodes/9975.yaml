  html: <p>I'm sure there is a thread on this, so if someone can point me in the right direction I'll willingly go. <br> <br>I have fonts (both Postscript and TrueType) from the "old days - Sys. 9.2.2).  I can't figure out how to get them to work on my 10.3.8 Mac.  Double clicking on some cause the "Preview" software to launch with an empty file.  Unstuffing does't. Changing the name to .(dot) LWFN or FFIL or anything else so far doesn't work.  I'm lost and I need Algerian for a project today. <br>Help? <br> <br>Thanks in advance.</p>
