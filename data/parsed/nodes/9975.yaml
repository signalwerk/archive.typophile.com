    html: "<p>Just a hunch, Neil. If you're using a \"memory stick\" to copy the fonts, it's possible that the suitcase file is losing its resources on the way. Many USB memory sticks (or whatever they may call them) are formated using a PC disk format that does not recognize the resource fork in a Mac file. Not all Mac files contain resource forks, but Mac font suitcases do, and it's where all the font data is stored. <br> <br>A simple way to tell if this is in fact what's going on would be to stuff the fonts before transfering them with the memory stick and unstuffing them on the other Mac. <br> <br>Incidentally, Fontbook doesn't recognize PostScript fonts directly. It sees them only via a suitcase (screenfont) file. To install them, double-click on the suitecase file or drag it onto the FontBook icon. Ironically, OSX will generally not let you see the screen fonts stored in the suitcase file but uses the linked PostScript fonts for screen display instead. However, all the style, metrics and kerning information is stored in the suitcase file. PostScript font files by themselves cannot be installed and nothing will happen if you try to open them in FontBook. <br> <br>One more thing:  <br> <br>Font suitcases no longer have an icon that looks like a suitcase. Instead, look for the letters FFIL on the icon. \"Font Suitcase\" will also be shown as \"Kind\" in the Finder. <br> <br>PostScript font files have the letters LWFN on their icons and are listed as \"PostScript Type 1 Outline Font\" under \"Kind\" in the Finder.</p>"
    html_clean: "<p>Just a hunch, Neil. If you're using a \"memory stick\" to copy the fonts, it's possible that the suitcase file is losing its resources on the way. Many USB memory sticks (or whatever they may call them) are formated using a PC disk format that does not recognize the resource fork in a Mac file. Not all Mac files contain resource forks, but Mac font suitcases do, and it's where all the font data is stored. <br> <br>A simple way to tell if this is in fact what's going on would be to stuff the fonts before transfering them with the memory stick and unstuffing them on the other Mac. <br> <br>Incidentally, Fontbook doesn't recognize PostScript fonts directly. It sees them only via a suitcase (screenfont) file. To install them, double-click on the suitecase file or drag it onto the FontBook icon. Ironically, OSX will generally not let you see the screen fonts stored in the suitcase file but uses the linked PostScript fonts for screen display instead. However, all the style, metrics and kerning information is stored in the suitcase file. PostScript font files by themselves cannot be installed and nothing will happen if you try to open them in FontBook. <br> <br>One more thing:  <br> <br>Font suitcases no longer have an icon that looks like a suitcase. Instead, look for the letters FFIL on the icon. \"Font Suitcase\" will also be shown as \"Kind\" in the Finder. <br> <br>PostScript font files have the letters LWFN on their icons and are listed as \"PostScript Type 1 Outline Font\" under \"Kind\" in the Finder.</p>"
