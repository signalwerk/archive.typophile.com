    html: <p>I don't know the answer to that.  <br> <br>Personally, I have found FontBook to be sufficient for my own purposes and less trouble than the more full-featured font managers that I have tried to use with OSX (Font Reserve 3 and Suitcase X). If you use Classic a lot, be sure to check the preferences in FontBook and select "Installing fonts makes them available for Classic Mac OS." I also use the option to have FontBook copy rather than move fonts when installing them. <br> <br>If I had to continually activate and deactivate fonts in my work or needed auto-activation, FontBook probably wouldn't be a good choice.</p>
