    html: <p>H B M, Classic knows nothing of dfonts.  <br> <br>dfonts are required by low-level Unix stuff in OSX. Standard Mac TrueType fonts are stored in the resource fork of a font suitcase file. The low-level Unix stuff in OSX doesn't support resource forks in files, so the dfont format was created to get around this. <br> <br>dfonts are not needed per se once OSX is up and running and any standard format (Mac or Windows TrueType, PostScript Type 1, OpenType) will work fine.</p>
    html_clean: <p>H B M, Classic knows nothing of dfonts.  <br> <br>dfonts are required by low-level Unix stuff in OSX. Standard Mac TrueType fonts are stored in the resource fork of a font suitcase file. The low-level Unix stuff in OSX doesn't support resource forks in files, so the dfont format was created to get around this. <br> <br>dfonts are not needed per se once OSX is up and running and any standard format (Mac or Windows TrueType, PostScript Type 1, OpenType) will work fine.</p>
