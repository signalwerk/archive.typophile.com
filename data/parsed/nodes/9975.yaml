    html: <p>It doesn't "use them the same way" in the sense that its rendering is different (for all font formats), but OS X will generally recognize valid Type 1 fonts from OS 9 just fine. You might want to read Apple's white paper on fonts in OS X to see if clearing your font cache or something will help. <br> <br>There is absolutely no need to turn your pre-existing TrueType fonts into dfonts to make them work on OS X, either. I have no idea where somebody got that idea. <br> <br>Cheers, <br> <br>T <br> <br>Thomas Phinney <br>Program Manager <br>Fonts &amp; Core Technologies <br>Adobe Systems</p>
