  html: |-
    <p>Can anyone recommend a shop that makes plates for photopolymer letterpress in Europe (the closer to Switzerland the better)? The two shops I keep reading about are both in the US. There must be something like that on this side of the Pond too, right?<br>
    If possible (and if I get to be picky), I'd likely prefer a place that makes the plates and also offers the printing itself, to reduce overhead / shipping costs / time.<br>
    Thanks for any pointers!</p>
