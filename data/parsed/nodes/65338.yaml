  html: |-
    <p>Hi Typophiles</p>
    <p>I am working on a packaging project with Edwardian Script ITC as the secondary typeface. The capital Z however is a bit tricky. </p>
    <p>Do anyone know of a script that has a capital Z that would fit together with Edwardian Script but be more regular in it's shape? Right now I am trying on Snell Roundhand on for size but would like to hear from you. The Z has to stay above the baseline because I need to place a small text below. Worst case I need to draw the Z myself but it would be an easier process if I could substitute the letter and kern my way to a nice result.</p>
    <p>I did a search and someone posted Ballantines, but the capital Z looks a bit like a capital L to me...<br>
    <a class="freelinking external" href="http://www.fontshop.com/search/?q=ballantines+script+&amp;site=d&amp;start=26&amp;num=25">http://www.fontshop.com/search/?q=ballantines+script+&amp;site=d&amp;start=26&amp;num=25</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Z_for_Zoo_5707.png"></div><p></p>
