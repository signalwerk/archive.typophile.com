    <p>John McCain’s so tough he kicked readability’s butt, with too many capital letters and a floating <strong>c</strong>. And in case you didn’t notice how tough that logo is, he’s got a star, too. </p>
    <p>So much for boumas. But I have to give him credit for approving a presidential campaign design entirely devoid of red and blue. </p>
