      <p>I think he could do better with a titling serif face or something like DIN/Alternate Gothic. Mantinia comes to mind, as I can imagine the two c’s on McCain fit snuggly within each other in the font’s double c glyph.</p>
      <p>Has any candidate taken the DIN route, btw? Most of them went either the heavy-weight grotesques route, or the low ascender/descender serifs route.</p>
      <p>And a second thought, I wonder if we’ll start to see Gotham in these kind of design soon, since the font’s usage is quite universal, at least in the US.</p>
