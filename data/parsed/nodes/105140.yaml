    <p>This is from an 1878 edition of <em>Le tour de France par deux enfants</em>.  I’ve had a go at identifying it, but without a definite result.  I haven’t seen any font that has a baseline J and the same Q...and then there’s the ?</p>
    <p>Maybe this will be obvious to a more practised eye.</p>
