      <p>Actually, it’s an Art Nouveau typeface. This late-nineteenth/early twentieth century trend was revived in the 1960s and became a staple of psychedelic poster art, then spilled into the mainstream.</p>
      <p>It’s not a face I’m familiar with, but searching for “Art Nouveau typeface” might help…</p>
