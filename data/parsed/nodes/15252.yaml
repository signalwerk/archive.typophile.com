    <p>Kia ora folks. It has been a long and gruelling process, but my business partner and I have formed a graphic design company right here in New Zealand, called The Letterheads. (We are aware of the existence of <a href="http://www.letterhead.com/">these people</a>, and even enquired about the purchase of the domain name. However, US $20,000 is a bit too much)</p>
    <p><a href="http://www.theletterheads.co.nz/">So here is our website</a>. We would be very appreciative of your criticism!</p>
    <p>Ka kite.<br>
    Kris.</p>
