    date: 2005-01-28T13:01:00
    date_raw: 28 Jan 2005 — 1:01pm
    votes: null
    html: <p>Daniel-that was a very good reaction. I don't know if any mark or even wordy display of characters really fully explain disc golf regardless of how simple it is. It is literally frisbee golf, with a circular disc thrown into a basket of sorts. <br> <br>Your observation about what is the mark conveying is exactly what i'm asking myself. Is it enough? Do the type and mark feel cohesive? The real problem is all the competitors rely on the swoosh factor. We all know some peoples thoughts about swoosh-esque mark. Something I may or may not have avoided. <br> <br>Darrel-you are also correct. That is the image or at least to some. This is for a non-profit org that is trying to progress the way leagues and tournaments are run and improving the overall image by leading by example. I have really had to do alot of kicking and fighting to make sure my friend understands how the overall image and goals must meet in the middle. Hopefully we can shed that image of the stoner dude sport. <br> <br>James-Thanks for the critique. It is by no means perfect or in the long run the final version. Hopefully something better will come about.</p>
    html_clean: <p>Daniel-that was a very good reaction. I don't know if any mark or even wordy display of characters really fully explain disc golf regardless of how simple it is. It is literally frisbee golf, with a circular disc thrown into a basket of sorts. <br> <br>Your observation about what is the mark conveying is exactly what i'm asking myself. Is it enough? Do the type and mark feel cohesive? The real problem is all the competitors rely on the swoosh factor. We all know some peoples thoughts about swoosh-esque mark. Something I may or may not have avoided. <br> <br>Darrel-you are also correct. That is the image or at least to some. This is for a non-profit org that is trying to progress the way leagues and tournaments are run and improving the overall image by leading by example. I have really had to do alot of kicking and fighting to make sure my friend understands how the overall image and goals must meet in the middle. Hopefully we can shed that image of the stoner dude sport. <br> <br>James-Thanks for the critique. It is by no means perfect or in the long run the final version. Hopefully something better will come about.</p>
  - id: 58437
    user: 2933
    date: 2005-01-28T13:22:00
    date_raw: 28 Jan 2005 — 1:22pm
    votes: null
    html: <p>In the logo line of work you must remember that the logo is but a signature, it is what surrounds it that makes the communication. A good logo (and name) only serve as a point of reference, something people will associate with you, once they know who you are. It need not even draw them to you, though it is nice when it does. Your surrounding materials (from posters to sign up sheets) tell them you're serious. Refining your current mark is all you really need to do to have that first step toward a respectable sport.  <br> <br>Why is it named "core?" Sometimes an association like this might have a little tagline that it can lock up for communications to people who have no idea what's going on.  <br> <br>Keep the mark abstract, like you have it. It's endearing and simple. Looks to me like a disc in the basket, or two different sized discs, or one in motion</p>
    html_clean: <p>In the logo line of work you must remember that the logo is but a signature, it is what surrounds it that makes the communication. A good logo (and name) only serve as a point of reference, something people will associate with you, once they know who you are. It need not even draw them to you, though it is nice when it does. Your surrounding materials (from posters to sign up sheets) tell them you're serious. Refining your current mark is all you really need to do to have that first step toward a respectable sport.  <br> <br>Why is it named "core?" Sometimes an association like this might have a little tagline that it can lock up for communications to people who have no idea what's going on.  <br> <br>Keep the mark abstract, like you have it. It's endearing and simple. Looks to me like a disc in the basket, or two different sized discs, or one in motion</p>
