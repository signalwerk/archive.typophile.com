    html: <p>Josh explain the Core name, is it an acronym. If it is you might, at first, use the full name under Core. I wouldn't dismiss golf related motifs the PGA and its industry have invested millions of dollars into getting people to reconize "Golf" icons. I would research what they have done and what works. As for the mark over Core it looks like a double halo and is stagnate. Not like something moving or something in a basket. Good start keep going.</p>
