  - id: 58439
    user: 3063
    date: 2005-01-29T11:38:00
    date_raw: 29 Jan 2005 — 11:38am
    votes: null
    html: "<p>No it is not an acronym. The name Core came about as we spoke about what the organization wanted to do. Core felt the need to act in ways that establish stronger professional standards and organizational structure in the sport of disc golf. Though the word 'core' has different definitions, many fit very well to the mission. <br> <br>By defintion: <br> <br>Core - The basic or most important part,  a reactor core(which is more about creation and action)&lt;- which is our plan also. <br> <br>The name doesn't have the punch of a well...Punch(A neopolitan pizza joint), yet it is a strong word that one can define, associate meaning and as an added bonus also allows circular motifs to be used if needed. It may be a bit dry, but give us a little time and we'll see what comes of it. <br> <br>I am on the boat that naming is very hard. One of our goals though was not to use 'disc'(ie: Discraft, Disc N Dat)in the name and avoid swooshes(flight paths, rainbows, whatever). <br> <br>I also agree with you both and try to practice and  preach that a mark should be great at the beginning and add value through sales or exposure. Unfortunately, being a side project it takes a back burner at times. <br> <br>In the meantime I will take all this great feedback and see if I can put it to use. <br> <br>Web presence: <a href=\"http://www.corediscgolf.com\" target=\"_blank\">http://www.corediscgolf.com</a></p>"
    html_clean: "<p>No it is not an acronym. The name Core came about as we spoke about what the organization wanted to do. Core felt the need to act in ways that establish stronger professional standards and organizational structure in the sport of disc golf. Though the word 'core' has different definitions, many fit very well to the mission. <br> <br>By defintion: <br> <br>Core - The basic or most important part,  a reactor core(which is more about creation and action)&lt;- which is our plan also. <br> <br>The name doesn't have the punch of a well...Punch(A neopolitan pizza joint), yet it is a strong word that one can define, associate meaning and as an added bonus also allows circular motifs to be used if needed. It may be a bit dry, but give us a little time and we'll see what comes of it. <br> <br>I am on the boat that naming is very hard. One of our goals though was not to use 'disc'(ie: Discraft, Disc N Dat)in the name and avoid swooshes(flight paths, rainbows, whatever). <br> <br>I also agree with you both and try to practice and  preach that a mark should be great at the beginning and add value through sales or exposure. Unfortunately, being a side project it takes a back burner at times. <br> <br>In the meantime I will take all this great feedback and see if I can put it to use. <br> <br>Web presence: <a href=\"http://www.corediscgolf.com\" target=\"_blank\" class=\"link-external\">http://www.corediscgolf.com</a></p>"
