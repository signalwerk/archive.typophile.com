  html: |-
    <p>This is an experimental type face where all glyphs are constructed using solid equilateral triangles. It turned out one can build the whole character set out of triangles with little or no compromise on harmony. The result: a new sort of blackletter with more than a hint of minimalism. Althoght I have not finished the metrics and kerning, it produced quite serviceable text even at small sizes, that could have made any tonsured monk very proud.</p>
    <p>Any comments?</p>
    <p>Tybor</p>
