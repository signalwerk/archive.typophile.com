      <p>for me it s an interesting typo - good modular work.<br>
      this is some sort of modern blackletter typeface - i think you should generate more vertical elements, develop the font as a COND one... for example take the small "e" - if you make it 3-4 modules higher it will look far different and will not have any reading problems.<br>
      anyway - it is still good work!!!<br>
