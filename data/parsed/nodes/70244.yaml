      <p>Thanks for your insight--makes me feel better that I'm getting advice from respected authorities in the field! </p>
      <p>I will then stick to Times New Roman for body copy--and Arial for the headers, name tents, badges, etc. Now all I have to worry about is my mac knocking all the margins out of whack everytime I open a document.</p>
      <p>At least I tried to branch out, but it seems like in this case, Arial and Times are the safest bets to keep the documents consistent from staff member to staff member. Thanks!</p>
