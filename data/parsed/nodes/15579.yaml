    <p><a href="http://www.creativepro.com/story/feature/23498.html" title="http://www.creativepro.com/story/feature/23498.html">http://www.creativepro.com/story/feature/23498.html</a></p>
    <p>Its interesting how the perception of Halloween has changed. My mother was really into the holiday and we would go to great measures to make a spooky fun place for the kids and the adults. One thing we would do is put fish nets hanging from the ceiling of the dinning room and put streamers draped through the holes. This gave the room the look of a magical forest. We also always had hot chocolate and apple cider for the adults who were almost always outside and never invited into a house. Not at my mothers place, the parents were incouraged to come in and enjoy the event. We would get hundreds of visitors when some neighbors would only get a few. A fun time.</p>
