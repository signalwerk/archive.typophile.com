    html: |-
      <p>In St. Louis, the tradition is for kids to tell a joke or do a trick before receiving candy. This is how I celebrated the holiday all through childhood, and would begin thinking of the perfect joke the first of October.<br>
      Years later, I moved to Lawrence, Kansas. When Hallowe’en came, I was excited to have the holiday in this new town. I got everything ready for kids to come to the door, and when the bell rang with the first trick-or-treater, I opened the door eagerly.<br>
      “Trick or treat...” the four year old said, with trepidation.<br>
      “What’s your trick?” I asked, expectantly.<br>
      “Huh?” he replied.<br>
      “Do you have a joke or something?” I encouraged.<br>
      “No...”<br>
      “Well, you have to tell me a joke or it’s just begging,”</p>
      <p>The kid started to cry.</p>
      <p>No other kids had jokes that night, either.</p>
      <p>It wasn’t until the next day that I related the story to friends and was informed that the St. Louis tradition of telling jokes or doing tricks wasn’t practiced in Kansas. Or in any other city I’ve lived in since. Very disappointing.</p>
