      <p>There are some nice Halloween images <a href="http://oldhaunts.blogspot.com/">here</a>, mostly from the 60s and 70s. One of my favorites is the <a href="http://oldhaunts.blogspot.com/2005/07/drink-up.html">Bloodweister</a> image. </p>
      <p>For a few hears, Halloween kind of lost its charm for me. My mom isn’t much of a party planner, and the same goes for me. But recently, I’ve begun to feel excited again about putting on a costume. If people are planning to dress up, I want to know what everyone’s costumes are!</p>
