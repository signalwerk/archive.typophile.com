    html: <p>Well in England Halloween is a pain. The trick treat knockers are usually older and scary they come a day too early. I had a girl come to my door on Oct 30 and say trick or treat. She was about 16. I looked at her and said ’you’re a day early’. She said ’it’s my religion.’ and then I said ’go back to school, it’s tomorrow’ and shut the door. Other years if you were home and didn’t answer the door you will get you door egged!!!! And It is very hard to get dry egg off a wood door...I now hate this commercial American crap holiday. It use to be fun.</p>
