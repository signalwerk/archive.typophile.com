    <p>Here are pdf samples of Clarissa, as requested by Hrant.</p>
    <p>I have redone the tail of the 'Q', as suggested by cerulean. Is this a bit too fancy in the context of the rest of the letters?</p>
    <p>I have not touched the possibly bloated 'g' yet. This will need some experiments with different approaches.</p>
    <p>Since my original posting, I have been working on the italic. I am aiming for a true italic, with little ticks on the bottom right of the relevant glyphs, and different letter shapes for a, f, v, w, y, etc. The bowls and arches are a bit more cursive than obliqued roman. The rest of the glyphs are just obliqued.</p>
    <p>I have also attached character sets for each.</p>
    <p>I wanted to post these in the original thread, but this does not seem to work.</p>
