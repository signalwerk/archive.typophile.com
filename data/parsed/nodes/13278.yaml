    date: 2005-06-28T16:31:00
    date_raw: 28 Jun 2005 — 4:31pm
    votes: null
    html: |-
      <p>Hrant, I think I know what you mean about "over-crowded fishing boat", but I am just guessing. The ticks on the 'l' and 'i' can pile up, and be distracting, much like a sequence of closely-spaced plain verticals. In combination with 't', we can really go fishing: e.g. "little". So I have just exchanged one distraction for another. Having said that, I think my distraction is prettier :-)</p>
      <p>Concerning the kerning of 'gj': well, of course! In the spirit of test word nerdism, I searched for all occurrences of 'gj' in the American English dictionary that comes with the Unix spell checker, ispell. Just three hits: 'logjam', 'jogjakarta', and 'Kwangju'. No hits on 'qj'. That's saved me a bit of work.</p>
      <p>Back to serious stuff.</p>
      <p>By 'agressive base spacing', I think you mean base spacing that is motivated by making kerning easier or better. For a Latin font, this could mean spacing 'r' correctly with a round to the right, so we do not need to kern all the accented variants of 'ro', 're', etc. There would be less work kerning next to verticals, as there are fewer accented variants of such glyphs. My thoughts on this are that a smaller kerning table is not much of a benefit in itself. A kerning-aware application will work just as well kerning 'ro' and not 'rn' as it would kerning 'rn' and not 'ro'. However, a non-kerning application will produce a better output if the base spacing is designed to work reasonably well without kerning. So why not add a bit to the utility of the font by making it work better in a word processor?</p>
      <p>I suppose that reducing the number of kerns could make some improvement in real type quality, in that the type designer is less burdened with the drudgery of producing excessive kerns, and can concentrate on more important things in the design. I get the impression from what you say that this is a real issue in some non-Latin scripts. Is it such a problem in Latin fonts? I only have a little experience with kerning. I had a go at the basics, with accented variants, using class kerning. I stripped it all out, because I was still messing with letter shapes, proportions, and spacing.</p>
      <p>Anyway, I have rambled on enough, more than likely completely missing the point. It is a hot, thundery night in Brum, and I have nothing better to do.</p>
