      <p>&gt; to reduce the “logjam effect” that occurs in words like “filling”</p>
      <p>But haven't you replaced the logjam* with an over-crowded fishing boat?  :-)</p>
      <p>* BTW, don't foget to kern the "gj"!</p>
      <p>&gt; I am aiming to make the spacing halfway decent without kerning</p>
      <p>Here's the (generally ignored) twist to this though:<br>
      People who would use a typesetting app that doesn't support kerning (by default) are not the type of people to mind slightly off spacing anyway! So you can save yourself a lot of extra kerns by making your base spacing more "aggressive". This is especially relevant in some non-Latin scripts, where such a technique (not minding the occasional touch when the kerning goes unused) can actually save you thousands of kerns.</p>
      <p>hhp</p>
