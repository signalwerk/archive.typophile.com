      <p>I made a mistake with the encoding on the charset for Clarissa regular, so the utf8 page is missing. What is the procedure for posting updates and corrections? I do not want to clutter this forum with new postings.</p>
      <p>I have also just noticed that the italic is showing signs of its evolution: 'q' has no 'dink' at top right, whereas 'a' and 'g' have dinks. I have tried both styles. The current style should have dinks everywhere, except on the 'b'. 'Dinkless' is cleaner, but tends to make the relevant letter shapes a bit vague, I think. Comments on this would be welcome.</p>
