    html: |-
      <p>Thanks for all the detailed help, Hrant. Just a few words before I work on the stuff you described.</p>
      <p>I agree about the 'U'. The all caps sample really shows it up.</p>
      <p>Letter 'a' should indeed have a more space to the right. The tail at bottom right takes up some whitespace relative to, say, 'n', so there must be a bigger distance to the main stem. The distances to the main stem in 'a' and 'n' are identical at present. I forgot to adjust the spacing for 'a' after adding the tail: it originally did not have a tail.</p>
      <p>I feel the right sidebearing of 'i' is less of an issue: I added 26 units to the main stem spacing to compensate for the tail. If the right of 'i' is too tight, I would expect 'l' to have to same problem,  as the tails are the same. I will try some small variations.</p>
      <p>On the subject of the tail on the 'i' and 'l', I did this partly to provide more space around these glyphs, to reduce the "logjam effect" that occurs in words like "filling", which I consider to be a defect of most sans serif fonts compared to serif designs. Do you think this works? A more common approach is a left facing serif on the top of the stem of the 'i' as well as a tail on 'l', but this produces different stem spacing for 'il', 'll', and 'li'. Trebuchet does this. I will try some sample text in Clarissa and Trebuchet to compare.</p>
      <p>With the 'r', I am aiming to make the spacing halfway decent without kerning, so the font will work in a word processor. Looking at other fonts, the policy seems to be to space 'r' correctly next to a stem, kern it closer to rounds, and increase the space next to 'f' and 't'.<br>
      Like the 'i', I think the adjustment I need is small.</p>
      <p>Anyway, I think it is about time for some kerning, so it might be a while until my next update.</p>
