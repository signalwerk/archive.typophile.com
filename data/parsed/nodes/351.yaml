    date_raw: 14 Jun 2003 — 10:58pm
    votes: null
    html: <p>I <i>love</i> the new keyboard editor, but I wouldn't recommend installing it unless you have a definite need for it and are willing to take some time to figure out how it works. I made a Biblical Hebrew keyboard this week, from which I can input all <i>nikud</i> and <i>teamin</i>. Very cool. <br> <br>I will note that there are some bad presumptions in RichEdit that affect Office 2002, Wordpad etc. and which can cause problems with custom keyboards (e.g. some combining marks not being treated as such). It's an odd bug, because the keyboard is actually working perfectly, and is entering the correct characters, but they are not being processed correctly. You can solve the problem by using the keyboard in a plain text editor and copy/pasting it into the RichEdit application. I'm informed by MS that this bug is fixed in Office 2003.</p>
    html_clean: <p>I <i>love</i> the new keyboard editor, but I wouldn't recommend installing it unless you have a definite need for it and are willing to take some time to figure out how it works. I made a Biblical Hebrew keyboard this week, from which I can input all <i>nikud</i> and <i>teamin</i>. Very cool. <br> <br>I will note that there are some bad presumptions in RichEdit that affect Office 2002, Wordpad etc. and which can cause problems with custom keyboards (e.g. some combining marks not being treated as such). It's an odd bug, because the keyboard is actually working perfectly, and is entering the correct characters, but they are not being processed correctly. You can solve the problem by using the keyboard in a plain text editor and copy/pasting it into the RichEdit application. I'm informed by MS that this bug is fixed in Office 2003.</p>
