    html: <p><i>Is it substantially harder than let's say ResEdit?</i> <br> <br>It is a visual editor, so probably easier for most people to figure out than ResEdit. You get a diagram of a keyboard, you click on a key and up pops a character entry dialogue. There are various ways to enter character codes, including typing from an existing keyboard, but I usually use the U+XXXX Unicode hexadecimal input. The aspect of it that may be confusing for some people has to do with understanding how keyboards work, and the relationship of hardware and software. <br> <br>You activate additional keyboard in Windows XP by accessing Control Panel / Regional and Language Options. Click 'Details' on the Languags tab. This will bring up a window in which you can add a language and a keyboard/IME. There are two Armenian keyboards available, an Eastern and a Western. <br> <br>RichEdit is a system component for rich text layout. Wordpad is a RichEdit client, and I believe Office uses a custom version. <br> <br>I'm not aware of any reason not to install the .NET framework. In any case, it is going to be included in your next Windows upgrade, since it is a central element of Microsoft's new architecture.</p>
    html_clean: <p><i>Is it substantially harder than let's say ResEdit?</i> <br> <br>It is a visual editor, so probably easier for most people to figure out than ResEdit. You get a diagram of a keyboard, you click on a key and up pops a character entry dialogue. There are various ways to enter character codes, including typing from an existing keyboard, but I usually use the U+XXXX Unicode hexadecimal input. The aspect of it that may be confusing for some people has to do with understanding how keyboards work, and the relationship of hardware and software. <br> <br>You activate additional keyboard in Windows XP by accessing Control Panel / Regional and Language Options. Click 'Details' on the Languags tab. This will bring up a window in which you can add a language and a keyboard/IME. There are two Armenian keyboards available, an Eastern and a Western. <br> <br>RichEdit is a system component for rich text layout. Wordpad is a RichEdit client, and I believe Office uses a custom version. <br> <br>I'm not aware of any reason not to install the .NET framework. In any case, it is going to be included in your next Windows upgrade, since it is a central element of Microsoft's new architecture.</p>
