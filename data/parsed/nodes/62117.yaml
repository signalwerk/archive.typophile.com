      <p><cite>Good point if one already has Haas Unica, but if one doesn’t and wants to buy it and can’t, it becomes an entirely different matter… It becomes something like the search for the Holy Grail…</cite></p>
      <p>I did not make this comment because I already have Unica. I made this comment as a type designer who sees no point in slavishly copying the past. In fact I had forgotten I even owned a copy until I read this thread and it sparked my memory.</p>
      <p><cite>or what else do you have in mind?</cite> While I think the Helvetica/Unica/Univers is way past its prime, and the thought of a humanist Unica sends shivers down my spine, I have a large grotesque family being released in the next few weeks with the relaunch of the new terminal design website.</p>
