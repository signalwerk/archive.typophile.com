  - id: 1030
    user: 1019
    date: 2003-06-12T07:12:00
    date_raw: 12 Jun 2003 — 7:12am
    votes: null
    html: <p>Masthead (the mag about mags) isin't about what mags are hot...(well there is a back section about the upcomings) But really its an excellent resource for following and understanding trends, content, organization - lots of crits. For instance there was a big uproar in the magazine world about a certain issue of Flare that had a pinch of product placement on the cover (a big no no!) and that was discussed at lenght in Masthead. the 25/25 isin't the 25 prettiest either, its about what was truely innovative abotu certain spreads, articles, illios, editting stuff like that.  <br> <br>anywho - maybe its not as technical as you would like, but I don't think anyone should design by a how-to-book in any case.</p>
