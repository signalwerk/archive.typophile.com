    html: <p>Thanks a lot <br> <br>Maybe i need to explain a bit more now, i'm not really interested in books like 'the more fun magazines in the world' or things like that. I mean i'm not searching infos about magazines that don't look like magazines. I need infos on how to organise and design a serious magazine, and about the grids used. As as i said many of the books are only about book design, and its pretty different. There are some materials on how to make a newspaper, its bit more close i think, but not enough. But maybe there is a real lack in this area. <br> <br>Anyway thanks for the all the info provided, i didn't bought any books for now on the subject because i was not really impressed of what i seen online, but maybe i'm gonna try it now and spend some books (</p>
