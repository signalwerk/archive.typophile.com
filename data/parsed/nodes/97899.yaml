  html: |-
    <p>in FL 5.1 when you generate a font whiteout copyright info (a beta version, for example) the new FL 5.1 will attribute your font to Adobe.<br>
    Adding this into your copyright: "Copyright 2012 Adobe Systems Incorporated. All rights reserved."<br>
    And this into your trademark: Please refer to the Copyright section for the font trademark attribution notices.<br>
    Not Good.</p>
    <p>Also, in some case, it will "replace" your own copyright data.<br>
    Worst.</p>
    <p>The old FL 5.0 used to say "Generated in 2012 by FontLab Studio. Copyright info pending."</p>
