    html: |-
      <p>That was equally true in FontLab 5.0.0 et.seq.  It has always put in the Adobe © notice if you generate an .otf font without having your own copyright text. </p>
      <p>This is because of the Adobe components in FontLab's internal open type generation software. Personally, I've neither seen the "Generated ... by FontLab" appear in FL 5+ nor seen it replace the © data.</p>
      <p> - Herb</p>
