    html: |-
      <p>FontLab uses the Adobe FDK for OpenType (AFDKO) to generate OpenType fonts. It contains all kinds of defaults for things if you don't set them explicitly. Same thing happens if you were to use AFDKO from the command line with a bunch of text files and .pfbs and left out your copyright string.</p>
      <p>Keep in mind, these tools were written for internal use at Adobe originally. Releasing them for other people to use came later.</p>
