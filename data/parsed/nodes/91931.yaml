      <p>@John Hudson: From my research, it seems the Gothic script became a more formal script some centuries after it came in to use, so this would not really explain the initial reasons for it's design, right? Please do correct me if I'm wrong :-)</p>
      <p>Here's my take in my essay:</p>
      <p>During the 11th century, Europe went through a period of high economic growth. As a part of the population got wealthier, the demand for books increased, pressurizing scriptoria to produce more books in less time. With an increase in demand came an increase in competition to not only produce books faster, but cheaper at the same time. This resulted in the development of a new script in France and Belgium, with a much more compressed and angular design than the previously used Carolingian minuscule. Due to it’s economical width, this new script, later called the Protogothic script, required fewer pages to be used, bringing down costs spent on parchment, and making books lighter. The latter was especially important for the improved transport and storage of books, as one can imagine. Another advantage of the Gothic script was it’s relative simplicity, making it easier to teach to the monks.<br>
      Although uncertain, there seems to be a relation between the tall Gothic architecture and the tall (or narrow, depending on your viewpoint) Gothic typography. Fashion will always remain an elusive subject, so the precise reasons for this new design, other than it’s economic functionality, remain unclear.</p>
