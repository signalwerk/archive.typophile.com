    html: <p>All mature scribal cultures develop both formal and informal styles. The Carolingian minuscule had, however briefly, imposed a single uniform model which then diverged, predictably, into formal and informal styles regionally. The blackletter styles represent formalisation, a typical characteristic of which is the frequent lifting of the pen (contra the reversals characteristic of informal styles) and hence deliberate slowness that encourages care in the forming of the letters and their consistency.</p>
