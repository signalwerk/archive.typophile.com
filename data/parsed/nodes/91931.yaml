      <p>I would say it has everything to do with the meaning of the word.</p>
      <p>Anything formal is easier to teach/learn to do adequately. The informal is what requires one to control one's own intuition, which is much harder - without much practice and even introspection it looks like a big mess. The twist here though is that the formal is generally more helpful to others, and it's also more difficult to innovate.</p>
