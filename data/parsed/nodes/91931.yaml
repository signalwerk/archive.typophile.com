    html: <p>I should point out that the term 'Gothic' in this context is a bit problematic. It is a later term, mostly found in English sources, and is confusing because, of course, there was also a Gothic language with its own script and palaeography. I think the term 'blackletter' is better as a general category, and within that category care should be taken to distinguish the individual styles.</p>
