      <p><em>...how can it be more easy to learn, if it has so much more strokes per letter?</em></p>
      <p>Because the strokes are repetitive and simple, and the fact that the formal script must be written more slowly than the cursive means that more care is taken: a scribe can easily produce page after page of consistent text in a formal style, which is the purpose of such styles. Formal hands are book hands.</p>
