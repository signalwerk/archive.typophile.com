      <p>Ok, I feel like I got it now :-) John, time to write a book perhaps? You seem to know a lot... In any case, thanks a lot. Do you mind if I mention your name in a footnote as a source for my essay?</p>
      <p>Here's my last version. Sorry for the long read.</p>
      <p>Until the 11th century, the Carolingian minuscule was a relatively standardized script in Western Europe. It was a very elegant and legible script, still treasured for it’s beauty by designers these days, but it’s time to make place for a new script had come. This new script would later be known as the Gothic script.<br>
      During the 11th century, Europe went through a period of economic growth. As a part of the population got wealthier, the demand for books increased, pressurizing scriptoria to produce greater volumes of books. With this increase in demand for books, the emphasis of a script’s purpose came to lie more in the writing of books, which were seen as formal objects, as opposed to informal every day usage. This resulted into a formalizing process of the Carolingian minuscule. A typical characteristic of formal writing is the frequent lifting of the pen, thus writing slower deliberately to encourage greater care in the forming of the letters and their consistency. France and Belgium were the first to introduce a more formalized script, called the Protogothic script, in the 11th century.<br>
      To understand how the Protogothic script, as well as the Carolingian minuscule, was written, it is important to be aware of the tool used to write with. This tool, the ‘broad-nip pen’, is still used today to understand the underlying structures behind modern day typography. It was, and is, constantly held at the same angle of approximately 45°, lifted of the parchment with every new stroke. The formalization of the Carolingian minuscule resulted in previously single-stroke curves, being replaced by several vertical and diagonal strokes throughout the alphabet. This gave the Protogothic script a much more angular design. This angularity, in turn, led to a much more compressed design, for curves take up more space than straight lines. [Picture of comparison between Carolingian minuscule and Protogothic script to come.]<br>
      Although uncertain, there seems to be a relation between the verticality and perpendicular Gothic architecture and the Gothic script. Fashion will always remain an elusive subject, though, so our focus here is in the functional and cultural aspects of the design of scripts.<br>
      Due to it’s economical width, this new script required fewer pages to be used, bringing down costs spent on parchment, and making books lighter. The latter was especially important for the improved transport and storage of books, as one can imagine. Another advantage of the Gothic script was it’s relative simplicity, making it easier to teach to the monks.</p>
