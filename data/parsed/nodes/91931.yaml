      <p><em>From my research, it seems the Gothic script became a more formal script some centuries after it came in to use.</em></p>
      <p>By my classification, all Blackletter styles are formal, because all are slow to write, all require frequent lifting of the pen, all favour consistency over fluidity, all are disconnected, all are upright... these are the classic characteristics of formal Latin book hands, contra informal, cursive hands. The process of development of 'protogothic' that you describe is a process of formalisation of the Carolingian minuscule, from a semi-cursive script featuring a lot of pen reversals and organic terminals, to a non-cursive script featuring a lot of pen lifts and constructed terminals. Consider: the Carolingian letter <em>n</em> can be written in two strokes with a reversal between them; the pen never needs to leave the page. A textura <em>n</em> requires a minimum of six strokes, with the pen lifted and repositioned between each stroke.</p>
