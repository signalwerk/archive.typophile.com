      <p>In part, as Bert suggests, it is part of a larger aesthetic movement, about harmonising the appearance of text to the cultural context in which it is encountered. This is continuous factor in the development of new writing styles and, later, new typographic styles. [An area of research for me is the development of the 'English Roman', which results in Baskerville's types, and which can most easily be made sense of in terms of trying to find a new model for text that harmonises with neo-classical applied arts.] Blackletter styles harmonise with the strong perpendicular and verticality of Gothic art and architecture, just as the Carolingian minuscule had harmonised with the softer and more curvaceous Romanesque forms.</p>
      <p>The other thing to bear in mind is that, almost all the time, what you are going to see reproduced in picture books of mediaeval manuscripts are prestige volumes, and especially volumes intended for communal liturgical worship. The formal script is used because these are formal books.</p>
