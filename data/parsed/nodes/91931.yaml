    <p>Hey people,</p>
    <p>I used to think that the development of the Gothic script was mainly caused by economic necessity. The Gothic script is narrower, thus more space-efficient, thus cheaper to write in. However, it's development in the 11th century coincides with economic growth in Europe, making this theory unlikely. Also, it seems odd to use such a depressing looking script, when times are good. Gothic architecture makes much more sense in that way. Could anybody shed some light on this?</p>
    <p>Cheers! jasper</p>
