  - id: 133395
    user: 2289
    date: 2006-07-09T04:25:00
    date_raw: 9 Jul 2006 — 4:25am
    votes: null
    html: |-
      <p>I find the icons dominate the logotype you could try placing them beneath or to the side of the type, while at the same time they contain too much detail to reproduce at smaller sizes, they also are drawn from different points of view, in different styles; the paint pot is more lifelike, the house a simplified icon and the hammer a silhouette, the fact that one bleeds off the circle, one follows the edge of the circle and the last is placed centrally doesn't help. Obviously one cannot cover all the products of the business in the icons, I would consider working up one symbol that captures, at least partially, the more important aspect. It could use the pallette of the type as long as a monocolour version is considered.<br>
      On the type front I might consider developing M,N,Y from E and U, making the L slightly narrower and redrawing the 4 as a slightly wider character (probably as wide as O). The tagline is too small and weak I might look at a heavier weight.<br>
      Tim<br>
      {edit: sorry, some of my comments overlap with the previous post}</p>
