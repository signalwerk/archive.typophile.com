    html: "<p>It works and it looks nice and i like the colours, but i don't like this logo. The #4 in the title with three images is confusing as stated. Especially with the 4 services listed that don't directly correspond to the icons. The icons match but only because they are so simple- there is nothing unique about them to set them apart. The type is too plain for my tastes. For such a long title why not throw some different weights/ styles/ etc? Also the L and M look too wide for some reason.</p>"
