    html: <p>First you don't need three colors for this logo, it makes no sense. You need to work on the letter spacing on the subheads, way too much space between (an example) w and a. In the title S 4 Y is poorly spaced, the 4 Y is floating. Look at the negative space and balance the look. Illustrations are fine.</p>
