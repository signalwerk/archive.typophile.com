    html: "<p> It's supposed to show the use of various styles of type over the years. For each \"row\" the first hill is the main movement, the second is a revival. Note that this thing seems to be \"pseudo-quantitive\": it's not based strictly on numbers (as the author admits), but it does contain views of certain specific things. For example, note the little wobble in the descent of the revival of \"Victorian Bizarre\". Also, the hills don't seem to be to relative scale. For example, the peak of \"Modern\" should be much higher than that of \"Caslon\" (considering the greater use of type 200 years later), but it's all been normalized instead. <br> <br>I'd love to have a graph that extends to today. But I'm not remotely qualified to make it, especially since I have a feeling it starts getting really messy in the past 20 years. <br> <br>So, what do you guys think about: <br>1. The [supposed] regularity of the main trends. <br>2. The timing of the revival hills. <br> <br>hhp </p>"
    html_clean: "<p> It's supposed to show the use of various styles of type over the years. For each \"row\" the first hill is the main movement, the second is a revival. Note that this thing seems to be \"pseudo-quantitive\": it's not based strictly on numbers (as the author admits), but it does contain views of certain specific things. For example, note the little wobble in the descent of the revival of \"Victorian Bizarre\". Also, the hills don't seem to be to relative scale. For example, the peak of \"Modern\" should be much higher than that of \"Caslon\" (considering the greater use of type 200 years later), but it's all been normalized instead. <br> <br>I'd love to have a graph that extends to today. But I'm not remotely qualified to make it, especially since I have a feeling it starts getting really messy in the past 20 years. <br> <br>So, what do you guys think about: <br>1. The [supposed] regularity of the main trends. <br>2. The timing of the revival hills. <br> <br>hhp </p>"
