    date_raw: 8 Apr 2002 — 2:53pm
    votes: null
    html: "<p> The thing with the graph is that it doesn't have to be (and maybe even shouldn't be) strictly quantitative to be useful. Note how it's showing classes of fonts, not individual designs - and that's a good thing. So the hard numbers would undoubtedly help, but it would take the analysis and insight of a real guru to \"distill\" it into something really useful. <br> <br>Maybe we can build a foundation here, with this small seed question: what are the main style categories since the 1950s? I'm thinking of stuff like \"American Grotesk\" (Franklin Gothic) or \"Humanist Sans\" (Syntax) or \"Aldine Revival\" (JY Aetna), etc. BTW, even just determining the optimal level-of-detail on this thing is an issue of itself... <br> <br>Also, maybe we're getting ahead of ourselves: Is Denman's graph even a solid foundation to build from? Franklin Gothic, for example, isn't represented... <br> <br>hhp </p>"
    html_clean: "<p> The thing with the graph is that it doesn't have to be (and maybe even shouldn't be) strictly quantitative to be useful. Note how it's showing classes of fonts, not individual designs - and that's a good thing. So the hard numbers would undoubtedly help, but it would take the analysis and insight of a real guru to \"distill\" it into something really useful. <br> <br>Maybe we can build a foundation here, with this small seed question: what are the main style categories since the 1950s? I'm thinking of stuff like \"American Grotesk\" (Franklin Gothic) or \"Humanist Sans\" (Syntax) or \"Aldine Revival\" (JY Aetna), etc. BTW, even just determining the optimal level-of-detail on this thing is an issue of itself... <br> <br>Also, maybe we're getting ahead of ourselves: Is Denman's graph even a solid foundation to build from? Franklin Gothic, for example, isn't represented... <br> <br>hhp </p>"
