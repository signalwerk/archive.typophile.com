  html: "<p>I thought to share an interesting graph that I recently stumbled across: <br><a href=\"http://www.themicrofoundry.com/other/trends.gif\" target=\"_top\">http://www.themicrofoundry.com/other/trends.gif</a> <br> <br>It's from page 195 of \"The shaping of our alphabet\" by Frank Denman (Knopf, 1955). The chapter home to the graph (#12, \"Where do we go from here?\") is actually a riveting read itself, and contains a completely unexpected and very eloquent defense of... alphabet reform! I tell you, the things one finds by mistake. <br> <br>Anyway, rather than offer my interpretations of the graph, <br>I'd like to stay quiet and hear of the things you see in it. <br> <br>hhp</p>"
  html_clean: "<p>I thought to share an interesting graph that I recently stumbled across: <br><a href=\"http://www.themicrofoundry.com/other/trends.gif\" target=\"_top\" class=\"link-external\">http://www.themicrofoundry.com/other/trends.gif</a> <br> <br>It's from page 195 of \"The shaping of our alphabet\" by Frank Denman (Knopf, 1955). The chapter home to the graph (#12, \"Where do we go from here?\") is actually a riveting read itself, and contains a completely unexpected and very eloquent defense of... alphabet reform! I tell you, the things one finds by mistake. <br> <br>Anyway, rather than offer my interpretations of the graph, <br>I'd like to stay quiet and hear of the things you see in it. <br> <br>hhp</p>"
