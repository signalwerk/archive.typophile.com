    html: |-
      <p>Perhaps I was being overly hasty, but there were two things that made me assume that it wasn't likely a regular retail font.</p>
      <p>1) The slightly clunky transitions of curves to straight lines are pretty typical of average "free" fonts, and almost never seen in decent quality retail fonts.</p>
      <p>2) Making the horizontal strokes the exact same thickness as the vertical strokes. If they want them to *look* the same thickness, they should make the verticals a bit thicker than the horizontals, to give the visual appearance of a constant thickness.</p>
      <p>These are both typical beginner mistakes in type design. I suppose they could be doing these things knowingly and on purpose, trying for a deliberately naive look. They succeeded well enough to fool me at first glance.  :/  First time I've been wrong when I expected something to be a "free font."</p>
      <p>Cheers,</p>
      <p>T</p>
