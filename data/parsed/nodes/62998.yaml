    html: |-
      <p>It may suit you, and of course you can choose as you like. But it creates a visibly "wrong" result. The optical correction I refer to is quite visible at 72 dpi, including in the sample shown, which is how I noticed it as a problem in that font. We're talking something like 5-15% difference in stroke thickness, which in the sample shown would have made a difference of 1-2 pixels.</p>
      <p>Cheers,</p>
      <p>T</p>
