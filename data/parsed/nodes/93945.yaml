      <p><em>If you could confirm, I have found that manually only a single tatweel can be inserted at the allowed places while word shaping interface allows three levels of tatweel at the same place. </em></p>
      <p>Yes. I'm not sure if this is a feature of Tasmeem or of ACE itself, but multiple entries of the kashida character result in a single (medium length) kashida. I would probably have implemented this differently, equating one kashida character to the narrowest kashida, two to the medium, and three to the long, but this seems to me an equivocal decision: there is no standard for kashida behaviour, and hence people implement what makes sense to them, always with the knowledge that, at some stage, one needs to start swallowing additonal kashida characters. In our Aldhabi font for MS, we can accommodate up to 10 kashida characters as a long, ligated kashida stroke; if a user enters 11, 12, 13 etc. kashida characters the stroke doesn't get any longer and the additional kashida character glyphs are swallowed in the display.</p>
