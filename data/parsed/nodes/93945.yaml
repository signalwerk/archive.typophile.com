      <p>I pointed out this thread to Thomas Milo, and have received permission to post here a passage from his reply that might be helpful:</p>
      <p>"<br>
      Regarding kashida insertion Albazi seems to be unaware of the text shaper interface, nor does he realize that we have three levels of kashida:</p>
      <p>1. soft kashida, designed for large text corpora. It can be sprinkled into the text only with the TextShaper menu, which contains stylistic presets plus an editor with elaborate configuration parameters. The TextShaper can also be used to wipe or reduce kashidas categorically.<br>
      2. hard kashida, designed for interactive, visual placement using the WordShaper interface. Hard kashida cannot be wiped or affected by the textShaper interface.<br>
      3. U+0640 Taweel, which can be typed as usual, but will be ignored in "illegal", i.e., grammatically impossible positions. With another font such Tatweels become visible agail. Their codes remain in the text stream. The WordShaper menu contains a Text Normalisation sub-menu, that allows for converting Tatweel into hard kashida.</p>
      <p>This architecture is necessary because Tatweel is not a normal character and kashida is not a predictable, fixed elongation. Historically, the script grammar for it varies between styles.<br>
      "</p>
      <p>hhp</p>
