    html: |-
      <p>Very nice font with so much ligation. The elongated tatweels are very beautiful and charming. Congratulations, Great work.</p>
      <p><em>What I am wondering is how you handle the tatweel glyphs themselves.</em></p>
      <p>The glyph string really becomes</p>
      <p>/behinitial.three/tatweel/tatweel/tatweel/  </p>
      <p>in my font as described by you.</p>
      <p>Actually in my font the tatweel at such places changes to alternate glyph tatweel.alt and the tatweel.alt is an empty glyph with some width. In simple words tatweel.alt glyph is similar to space glyph. While behinitial, behinitial.one, behinitial.two and behinitial.three has the same width i.e. width metrics but having long elongations going far away from glyph width metrics. So their elongations go far crossing the width metrics covering the empty spaces of tatweel.alt</p>
      <p>Thanks,</p>
