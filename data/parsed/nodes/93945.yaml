    user_image: /files/pictures/picture-43535.png
    date_raw: 13 Jul 2012 — 11:33am
    date: 2012-07-13T11:33:00
    votes: null
    html: |-
      <p>I have made tatweel alternates in quite a different way at glyph level so my approach is also different. I used the "calt" feature for this purpose and used different lookups for each level of ligation in ascending order like this </p>
      <p>Lookup1</p>
      <p>behinitial -&gt; behinitial.one<br>
       | tatweel</p>
      <p>Lookup2</p>
      <p>behinitial.one -&gt; behinitial.two<br>
       | tatweel tatweel</p>
      <p>Lookup3</p>
      <p>behinitial.two -&gt; behinitial.three<br>
       | tatweel tatweel tatweel</p>
      <p>because there are only three levels of ligation in my font. This way will become a bit longer in your font due to 10 levels of ligation in your font but it works in MS Word as well as in InDesign.</p>
      <p>@dezcom, thank you so much for your nice and encouraging words. </p>
      <p>Thanks,</p>
  - id: 515598
    user_id: 1262
    user_name: John Hudson
    user_path: null
    user_image: /files/pictures/picture-1262.gif
    date_raw: 13 Jul 2012 — 1:37pm
    date: 2012-07-13T13:37:00
    votes: null
    html: |-
      <p>You lookup description explains the selection of the alternate letterforms preceding the kashida(s) but not ligation or swallowing of the kashida glyphs themselves. So, for instance, the substitution</p>
      <p><code>behinitial.two -&gt; behinitial.three<br>
      | tatweel tatweel tatweel</code></p>
      <p>results in the glyph string</p>
      <p>/behinitial.three/tatweel/tatweel/tatweel/</p>
      <p>I have similar 'calt' lookups to handle all my letter variant substitutions too (although I've already decomposed to archigraphemes by this point, so I'm handling a generic 'B' initial letter without dots rather than 'beh'). What I am wondering is how you handle the tatweel glyphs themselves.<br>
      _____</p>
      <p>This is the sort of thing I am doing with Aldhabi. The elongations are independent strokes of varying length that are designed to flow into contextually selected letterforms. The right side joining of the elongation is a standard shape, allowing the preceding letterform to be selected based on the presence of the elongation. The left side joining of the elongation varies, so I have an elongation stroke of each length for each of eight different left join shapes. All this was worked out by the designer, Tim Holloway. He designed the narrowest elongation of each join shape and the widest, and an intermediate 'standard' elongation, and then I used interpolation to create all the others.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/kashidas_4616.png"></div><p></p>
