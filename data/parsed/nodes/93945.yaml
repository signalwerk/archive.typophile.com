    html: <p>My approach was a simple one, using FontLab's 'Blend Fonts' function (Tools menu). I created separate .vfb sources for each width of elongation stroke. Then I used the 'Blend Fonts' function to create Multiple Master width sources (one for narrowest to standard elongation, one for standard to widest elongation; it would be possible, of course, to do this with only the narrowest and widest, but Tim wanted more control over the shape in the most common intermediate widths, which correspond to the swash sin). Once I had the Multiple Master sources, I went into FontLab's 'Edit Axis Graph' dialogue (Tools / Multiple Master menu) and set the low and high values to match the actual advance width of the two elongation masters in UPM font units; this allowed me to specify and generate discreet intermediate instances based on precise widths.</p>
    html_clean: <p>My approach was a simple one, using FontLab's 'Blend Fonts' function (Tools menu). I created separate .vfb sources for each width of elongation stroke. Then I used the 'Blend Fonts' function to create Multiple Master width sources (one for narrowest to standard elongation, one for standard to widest elongation; it would be possible, of course, to do this with only the narrowest and widest, but Tim wanted more control over the shape in the most common intermediate widths, which correspond to the swash sin). Once I had the Multiple Master sources, I went into FontLab's 'Edit Axis Graph' dialogue (Tools / Multiple Master menu) and set the low and high values to match the actual advance width of the two elongation masters in UPM font units; this allowed me to specify and generate discreet intermediate instances based on precise widths.</p>
