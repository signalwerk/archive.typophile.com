      <p>It means if another font is applied to the same text then the swallowed kashida will re-appear. </p>
      <p>In my font I have used a different approach for kashida ligation. Also in my font if the kashida is inserted after three levels then, instead of swallowing, the calligraphic kashida changes to a straight kashida. Similarly if a kashida is inserted at a place where the Arabic Naskh script grammar does not allow kashida then also the straight kashida appear at that place. My font kashida ligation and kashida rules both work 100% in MS Word as well as InDesign.</p>
      <p>If you find any shorter way of kashida ligation that work in MS Word as well as in InDesign then please also contribute it with us. Your approach has always helped us a lot.</p>
      <p>Thanks,</p>
