      <p>It is important to distinguish and not equate ACE and Tasmeem, in order to be clear what we're talking about. Tasmeem is a plug-in for InDesign that provides a particular user interface for working with the advanced typographic features of ACE fonts via the ACE layout engine. ACE fonts are OpenType fonts with a custom table made use of by the ACE engine, which provides script-grammatical shaping for Arabic text and enables the kind of advanced typographic controls accessible via an interface like Tasmeem. The interface is not the engine.</p>
      <p>Regarding the kashida, this is an interesting topic. While the use of the 'kashida key' described by Muhammad is indeed convenient, it involves manually editing the underlying text string in order to affect a change in the appearance of the text. This isn't quite on the level of the old type 1 'expert set' fonts for Latin ligatures, as the 'tatweel' character in Unicode is generally ignored in text search and sort operations, but it is still philosophically counter to the normal distinction between content and display.</p>
      <p>Muhammad is incorrect to suggest that use of manual kashida insertion is not supported by ACE and that use of the Tasmeem word shaping interface is the only way to access elongations. What ACE does not permit is insertion of the kashida in places where is it not permitted by script grammar (which varies, around some general rules, according to script style). If a user keys a tatweel character code in such a position, ACE trashes it from the string; hence Tom's term 'trashida'.</p>
      <p>There are actually three ways to work with kashida in Tasmeem: the manual method as described above, the word shaping interface, which is really only suitable for precise control of shorter passages of text or display settings (e.g. the very elegant poetry settings in a recent Brill publication), and the text shaping interface that can be used with stylistic presets and parameter controls to sprinkle the kashida in the text.</p>
      <p>It should be noted, by the way, that automatic kashida insertion for text justification basically doesn't really work anywhere: the insertion logic is simplistic, not script-grammatical (and definitely not tailored to specific styles as it should be), and incompatible between different apps and vendors. Visually, it works only with flat styles of type with strictly horizontal baseline connections. Since it is applied after text shaping has occurred, it breaks any OpenType font -- such as Muhammad's, MS Arabic Typesetting or Urdu Typesetting and the Aldhabi font -- that uses cursive attachment positioning to capture top-joining and other vertical relationships of Arabic script.</p>
