      <p>I don't think it would be a good idea for Turkish to revert back to Arabic, mostly because as an Altaic language it relies heavily on vowels, while Arabic is built for consonantal rendering. However -as I opined in my talk at ISType in 2012*- it would be beautiful and in fact culturally functional if Turkish type designers would inject some Arabic flavor into their Latin designs.</p>
