      <p>Muhammad has done a very impressive job, and I was privileged to be able to offer him some technical advice along the way. In addition to the app bugs to which Muhammad refers, there were also challenges getting the font to compile correctly in VOLT due to GPOS table size overruns.</p>
      <p>Having a richly featured OpenType naskh font of the kind Muhammad has made also enables one to make some meaningful comparisons between the OpenType and DecoType ACE approaches to the same style. Muhammad's font requirtes 3700 glyphs and a <em>lot</em> of GSUB and GPOS lookups to support only one language (Arabic), and requires the typographer to be knowledgeable and sensitive enough to know how to utilise the many stylistic set features manually to produce various results. DecoType Naskh, on the other hand, uses only 541 glyphs to support all the languages covered by the Unicode Arabic block*, and significant parts of the layout intelligence are handled, with much greater ease and efficiency, by the ACE engine rather than font lookups, while various typographic options are accessible through front-end pre-sets in Tasmeem (alongside further manual control for those who want it).</p>
      <p>_____</p>
      <p>* DecoType's recent fonts are even more efficient. Their Nastaliq has only 452 glyphs, and I suspect the Ruqah is even smaller.</p>
