    html: |-
      <p>I am really thankful to John Hudson for liking and appreciating the font. Without his valuable help I would not have succeeded in preparing such a Masterpiece of Arabic Naskh font.<br>
      Indeed DecoType ACE (Tasmeem) is a splendid piece of work. The greatest ease of work in Tasmeem is that it shows all the variables for a word before implementation as compared to my OpenType font in which there is no way to do so as it is just a font not a software or software-plugin. But using different combinations of letter alternates to produce various shapes for a word is very easy in my font as there are only 20 stylistic sets and these 20 sets can be learned easily in only few minutes.</p>
      <p>My font also has some advantages over DecoType ACE.</p>
      <p>(1) DecoType ACE works only in InDesign while my font works in all the applications that support OpenType Arabic fonts.<br>
      (2) My font has a compatible bold style also while DecoType ACE has regular style Naskh only.<br>
      (3) The Kashida (Tatweel) insertion and removal is not easy in DecoType ACE as every time you have to go to word shaping interface and make your selection when you are inserting the kashida. Even you can not remove the kashida from a word with Backspace key, instead you have to make your selection again from the word shaping interface.  Though it looks very easy in a short work of a single page or few pages but it becomes quite time consuming at longer document level.<br>
      While in my font the kashida insertion is very easy by the kashida key and it works in all applications and similarly the kashida can be very quickly removed by the backspace key. Even at a document level the kashida can be easily removed by find and remove command.<br>
      (4) In DecoType ACE Marks placement is not very  good and in some words the marks placement is even very bad as compared to my font that has a very precise placement of marks and it contains the control to use close marks or distant marks.<br>
      (5) In Zuhair Albazi Naskh the user can apply any specific letter shape or mark shape to a complete paragraph or even to a complete document with a single click while in DecoType ACE it is not possible.<br>
      (6) The DecoType ACE Naskh looks very beautiful at large size but on document level i.e. at small size it does not look so good. At small size the text looks a bit irregular specially when it contains marks. While Zuhair Albazi Naskh Font's beauty and smoothness remains at its peak whether the text is smaller or larger.</p>
      <p>Thanks,</p>
