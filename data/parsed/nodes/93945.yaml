      <p>I do it during OpenType glyph processing. First I ligate multiple individual kashida glyphs to the longer variant kashida stroke, in descending order of length, longest to shortest. Then, in a separate lookup I ligate the longest kashida stroke plus an additional individual kashida to the longest kashida stroke, which swallows the individual kashida:</p>
      <p><code>kashida.10 kashida -&gt; kashida.10</code></p>
      <p>At present I'm doing this in the 'ccmp' feature, and this works find in MS apps, but kashida ligation done in this way doesn't work in InDesign ME, so I need to see if I can figure out a workaround in another feature.</p>
    html_clean: |-
