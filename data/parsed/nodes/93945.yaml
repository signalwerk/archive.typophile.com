      <p>Ah. That's sort of clever but complicated, and doesn't it lead to complexities in the left connection of the elongated initial? An alternative solution for you would be simply to make your elongated initial forms full width and swallow the tatweel glyphs as I so:</p>
      <p><code>behinitial.three tatweel tatweel tatweel -&gt; behinitial.three</code></p>
      <p>That seems simpler, I think, and means that you can apply 'curs' attachment directly from the /behinitial.three/ to a connecting letterforms on the left.</p>
  - id: 515614
    user_id: 43535
    user_name: Zuhair Albazi
    user_path: null
    user_image: /files/pictures/picture-43535.png
    date_raw: 14 Jul 2012 — 10:44pm
    date: 2012-07-14T22:44:00
    votes: null
    html: |-
      <p><em>doesn't it lead to complexities in the left connection of the elongated initial?</em></p>
      <p>I did not face any complexity in the left connection as right from the beginning I made the left glyphs accordingly.</p>
      <p><em>An alternative solution for you would be simply to make your elongated initial forms full width and swallow the tatweel glyphs as I so:</em><br>
      <code>behinitial.three tatweel tatweel tatweel -&gt; behinitial.three</code><br>
      <em>That seems simpler, I think, and means that you can apply 'curs' attachment directly from the /behinitial.three/ to a connecting letterforms on the left.</em></p>
      <p>It is also a good approach. Before adding calligraphic tatweels to my font I tested several approaches and I remember I have also tried something like this in the beginning.</p>
      <p><code>behinitial tatweel tatweel tatweel -&gt; behinitial.three</code></p>
      <p>In this case there are at least two benefits. (1) No need to make separate glyph of tatweel.alt (2) direct cursive attachment towards left side letter.</p>
      <p>But I adopted the other approach so that the marks can be placed on tatweel.alt and they appear on the the elongated letter accordingly as in the image.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Graphic1_3690.jpg"></div><br>
      In first line words have a single tatweel, in second line have two tatweels and in third line have three tatweels. The mark length auto-increase with increasing tatweel length and if another mark is placed after first, second or third tatweel then the first mark length auto-decrease accordingly.<p></p>
      <p>If I adopt the above described new approach and make the elongated glyph several components for marks placement then the marks will require a lot of work and much positioning data that is not possible in my font. So in my font the marks placement on tatweel.alt saved me from thousands of mark positions</p>
      <p>Thanks,</p>
