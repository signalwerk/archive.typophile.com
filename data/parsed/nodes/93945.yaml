      <p>@Ryan Maelhorn:<br>
      <cite>What makes this the most beautiful Arabic font? Although it seems to be quite the workhorse as far as allowing users to change things around, overall the outlines look rather lazy and bland to me.</cite></p>
      <p>Except for fonts which are limited to special software (InDesign) this is the <em>only</em> Arabic font to properly support the script, instead of taking ugly shortcuts.</p>
      <p>Also, since English is not the original poster's first language, I'm willing to allow that the "One of" in the title was intended to apply to "the most beautiful" as well as "the most advanced" (to achieve the proper idiomatic English parallel construction, it should have been "One of the most advanced and most beautiful Arabic OT Naskh Fonts").</p>
      <p>I am no judge of Arabic script aesthetics, but the typeface appeared to me to have a pleasing shape with no obvious need for improvement.</p>
