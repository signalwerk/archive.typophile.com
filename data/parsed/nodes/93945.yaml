      <p>محترم جناب زہیر البازی صاحبب<br>
      السلام علیکم ورحمۃ اللہ وبرکاتہ</p>
      <p>میں کئی روز سے آپ کا ٹائپو فائل پر کام دیکھ رہاہوں اور یہ سوچ رہا تھا کہ ماضی کے تقریبا تین عشروں پر مشتمل فن خطاطی سے تعلق کی بنا پرکچھ عرض کروں۔آج کچھ فرصت ملی ہے تو کچھ  لکھتا ہوں۔ سب سے پہلے تو میں آ پ کو خط نسخ کے اس نئے فوتٹ  کو ڈویلپ کرنےپرمبارک باد پیش کرتا ہوں۔جیسا کہ آپ کے علم میں ہے کہ علم و تحقیق کا کارواں سدا چلتا رہتاہے اور  انسانی فطرت کے مطابق لوگ خوب سےخوب تر کی تلا ش جاری رکھتے ہیں۔راقم الحروف گزشتہ تین دہائیوں سے فن خطاطی کا ادنی  طالب علم ہے اور اس موضوع پر دوکتب کامولف بھی ۔وہ دوکتب یہ ہیں<br>
      ۔تذکرہ خطاطین جس میں عالم اسلا م کے بیس نامور خطاطوں کےحالات ،خدمات اور تین سو سے زائد نوادر محفوظ ہیں<br>
      ۔مقالات خطاطی سیّد نفیس الحسینیؓ</p>
      <p>آج کل میں ایک نئے فونٹ کو ڈویلپ کر نےکے لیے کوشاں ہوں اورامید ہے کہ اس بارے میں آپ کا تعاون اورماہرانہ مشورے مجھے حاصل رہیں گے۔دراصل میری دلی خواہش ہے کہ لاہوری نستعلیق کر ایک خوبصورت فونٹ ڈویلپ کروں جو فن خطاطی کے تمام محاسن اور جمالیاتی خوبیوں کا مجموعہ ہو۔افسو ہے اب تک کوئی ایسا فونٹ تیار نہ ہوسکا۔راقم کی ناچیز رائے میں اس کی بڑی وجہ یہ رہی کہ تریبا تمام فونٹ کریکٹر بیسڈ ہیں جس کی وجہ سے جوڑوں اورپیوند وں میں وہ حسن نہ آسکا جوخطاط کے قلم سے ممکن ہے۔دوسری وجہ یہ ہوئی کہ عموما فونٹ پرکام کرنےوالے فن خطاطی کی باریکیوں سے ناواقف پائے گئے جبکہ خوبصورت فونٹ تیار کرنےکے لیے یہ بنیادی شرط ہے۔<br>
      بہر حال مختصرا عرض ہے کہ اس بارے میں راقم نےاپنے مطالعے کے بعد جو طریقہ کار وضع کیاہے  اس میں تین پروگراموں سے مدد لی جائے گی یعنی<br>
      1.Adobe Illustrator<br>
      2.Font Developer<br>
      3.MS Volt<br>
      ان میں سے پہلے پروگرام کی مدد سے خطاطی کے دستیاب لیگیچرز کی آئوٹ لائن بنائی جائے گی۔دوسرے پرگرام لیگیچرز اورچند گلپس اور تیسرے کی مدد پر پروگرامنگ۔<br>
      میری آپ سے گزارش ہے کہ اپنے تجربےکی بنیاد پرمطلع فرمائیں کہ کیااس عمل کومزیدمختصر کرناممکن ہےاور کیایہ ممکن ہے کہ ابتدائی دو پروگراموں کی جگہ صرف ایک پروگرام یعنی<br>
      Fontlab<br>
      استعمال کیا جائے اورکس طرح استعمال کیاجائے۔<br>
      میں آپ کے مثبت جواب کا منتظر رہوںگا۔<br>
      اگر آپ راقم کی ناچیزعلمی خدمات سےآگاہی حاصل کرنا چاہیں تویہاں ملاحظہ فرمائیں</p>
      <p><a href="http://www.openlibrary.com/authors/Muhammad" title="www.openlibrary.com/authors/Muhammad">www.openlibrary.com/authors/Muhammad</a> Rashid Shaikh<br>
      عید کی پیشگی مبارک بادکے ساتھ آپ سے اجازب</p>
      <p>محمد راشد شیخ</p>
