      <p>I suggest instead of further asking you should test fontlab also. If you have the practical knowledge of font creator then it will not be difficult for you. I have not used font creator so do not know much about it. Also there is much material about fontlab that you can easily find on web. In fontlab you can also copy and paste directly from illustrator. It is one of the most wide spread font tool used by top type designers but it has some limitation.</p>
      <p>It allows maximum 6399 glyphs per file or per font. Looking at your ambitions it will not fulfill your need as 6399 is very small number of glyphs for a ligature based Nastaleeq font that may contain much large number of glyphs. In this case you may try Asia Font Studio that support up to 65,535 glyphs per file. It has almost same interface and same functions as Fontlab Studio so if you get satisfied with fontlab then you may start work in Asia Font Studio.</p>
      <p>In short, you have to test these software by yourself to find out which one is easy for you and which one gives best output outlines in a font.</p>
