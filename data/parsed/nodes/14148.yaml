    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a> : Pangram</strong></p>
    <p>Pangrams are short passages that include all 26 characters of the <a href="/wiki/Alphabets" class="freelinking" rel="nofollow">alphabet</a>. They're commonly used to help users of the font quickly assess a character set. They may also be useful to designers in the process of designing their own work but they are too compact for a more thorough assessment. Perhaps the most common pangram is <em>The quick brown fox jumps over the lazy dog.</em></p>
    <p>Clever pangrams:<br>
    <em>Boxer M. Tyson packs his bags with Jay-Z DVDs, Quik, Holyfield's ear.</em> -- BJ Harvey</p>
    <p><em>Typophile Boxing! Papazian jousts with quaking, anonymous detractor. Fight at eleven.</em> -- <a href="/wiki/Joseph%20Pemberton" class="freelinking" rel="nofollow">Joe Pemberton</a></p>
    <p><em>Abacist’s deaf dog hijacked luminous parquetry studio, avows ex-yakuza.</em> -- <a href="/wiki/Hrant%20Papazian" class="freelinking" rel="nofollow">Hrant Papazian</a> (This is a rare, alphabetically ordered pangram.)</p>
    <p><em>Wham! Volcano erupts fiery liquid death onto ex-jazzbo Kenny G.</em> -- <a href="/wiki/Jonathan%20Hoefler" class="freelinking" rel="nofollow">Jonathan Hoefler</a></p>
