    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12038" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Terminology</a>&nbsp;:&nbsp;Pangram</strong></p>
    <p>Pangrams are short passages that include all 26 characters of the <a href="/node/12248" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">alphabet</a>. They’re commonly used to help users of the font quickly assess a character set. They may also be useful to designers in the process of designing their own work but they are too compact for a more thorough assessment. Perhaps the most common pangram is <em>The quick brown fox jumps over the lazy&nbsp;dog.</em></p>
    <p>Clever pangrams:<br><em>Boxer M. Tyson packs his bags with Jay-Z <span class="caps">DVD</span>s, Quik, Holyfield’s ear.</em> – <span class="caps">BJ</span>&nbsp;Harvey</p>
    <p><em>Typophile Boxing! Papazian jousts with quaking, anonymous detractor. Fight at eleven.</em> – <a href="/node/12037" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Joe&nbsp;Pemberton</a></p>
    <p><em>Abacist’s deaf dog hijacked luminous parquetry studio, avows ex-yakuza.</em> – <a href="/node/12245" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Hrant Papazian</a> (This is a rare, alphabetically ordered&nbsp;pangram.)</p>
    <p><em>Wham! Volcano erupts fiery liquid death onto ex-jazzbo Kenny G.</em> – <a href="/node/12061" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Jonathan&nbsp;Hoefler</a></p>
