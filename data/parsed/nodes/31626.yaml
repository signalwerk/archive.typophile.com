    html: |-
      <p>"Can someone tell me the name some famous typefaces were released/designed when the designer was a student."</p>
      <p>Someone's already asked how famous, and I'm wondering at the definition of student*, but both these fellows were enrolled at RISD when they designed these faces and probably more for the last named:<br>
      FF Providence, Guy Jeff Nelson<br>
      FF Dolores, Tobias Frere-Jones</p>
      <p>A little math indicates that one (*besides Knuth), must've been born after 1960, (or perhaps before 1640), and, before about 1980, to up-to-now have designed a font that became famous while they were in school. This may be further limited, as the glut of new designs made even the best school projects drown in the many-to-be-marketed by around 2000, (2000 - 22yrs.old - 2 yrs. marketing to make famous font = 1976 birth). bringing the range of possible fame in fonts in school to but 16 possible graduating classes. On the other side, one could not study with a public type design product until 1987 at the earliest, (- 22yrs.old - 2 yrs. marketing = 1963 birth) bringing the possible years down to 13 for anyone who adopted Fontographer as early as 1987...</p>
      <p>...so I'd be interested in how many you find.</p>
      <p>Cheers!</p>
