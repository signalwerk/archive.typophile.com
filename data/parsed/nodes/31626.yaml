    html: |-
      <p>Both Litteratra and Grotext (redesign still not finished ...).</p>
      <p><cite>talks about Jan Tschichold working out Sabon Italic [...] when they were students</cite></p>
      <p>Do you know to which drawings the book refers? <cite>Leben und Werk des Typographen J.T.</cite> shows a sheet with an italic alphabet, dated 1918 (he was 16 then), but it would seem a bit farfetched to consider it as an early Sabon. The footnote says: "Schriftstudie, vermutlich nach Granjons Kursiv" / "a type study, presumably following Granjon's Italic".<br>
      However, when 18, Tschichold was an excellent calligrapher -- impossible <cite>not</cite> to be jealous!<br>
      When looking into the small catalog, I wish I could have visited the Tschichold-exhibition at the Kunstgewerbemuseum Zurich in 1976. But I doubt the new-born that I was then would have understood what it was about ...</p>
