      <p>Although to me the 'award-winning = peers recognition = fame' is very relative, plus, that the typefaces developed under one or more tutors (more often than not) carry a lot of those tutors' creative input --<br>
      I guess the typefaces below can be regarded as [well] known:</p>
      <p>FF Strada - Albert Pinggera, while at the KABK / Royal Academy of Art, The Hague<br>
      Dolly - Underware, could be put on the same list<br>
      Resident - of Paul van der Laan, was released by Linotype while he was still a student at KABK</p>
      <p>and more recent:<br>
      Rumba - of Laura Meseguer, Type and Media, KABK<br>
      Neutral - of Kai Bernau, Type and Media, KABK</p>
