      <p>I'm not sure how you define "fame"; commercial success is one option, but the data is difficult to get to, and you should allow a few years for sales momentum to build. Another option is peer recognition; competitions, awards, and the like. So, with apologies for any I may have forgotten, the TDC has awarded:<br>
      Nassim by Titus Nemeth,<br>
      Tisa by Mitja Miclavcic,<br>
      Calouste by Miguel Sousa,<br>
      Maiola  by Veronika Burian,<br>
      Noam by Adi Stern,<br>
      Gentium by Victor Gaultney, and<br>
      Rayuela by Alejandro lo Celso. </p>
      <p>The Creative Review also awarded student projects: Veronika's Maiola and Malou Verlomme's Ficus. </p>
      <p>Not strictly an answer to your question, but laudable nevertheless is the work of Tim Ahrens, which has garnered considerable recognition while Tim is a part-time student. </p>
      <p>And, attempting foresight, I am sure that David Cabianca's Cardea will turn many heads when it is eventually released.</p>
