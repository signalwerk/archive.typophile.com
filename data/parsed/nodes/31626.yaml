      <p>Josh Darden designed a bunch of typefaces while in high school. I think his first one was at age 14 or 15, like Christian. He partnered with his pal Tim Glaser on many of the early typefaces. His earlier faces were GarageFonts releases like Diva, OUT, and Locus, and Index and Profundus a bit later.</p>
      <p>I was working at GF circa 1999-2000 when <em>Time</em> magazine chose Index to appear on the front cover of one of their special issues. That was a huge deal, as they rarely deviated from their standard typography.</p>
