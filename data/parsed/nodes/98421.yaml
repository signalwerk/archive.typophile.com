      <p>Nice list.</p>
      <p>First rule: If it's a good font, trust the type designer and don't mess with spacing. How to know if it's a good font? Ask.</p>
      <p>Also: A font is ideal within a pretty tight size range; there is no easy compensation for going outside this range.</p>
      <blockquote><p>If you are not sure, go with tighter spacing</p></blockquote>
      <p>This is the only thing in your list that strikes me as wrong. Overly loose wordspacing can be ugly and wasteful (and slightly slow down reading) but overly tight wordspacing can totally ruin reading.</p>
      <p>hhp</p>
