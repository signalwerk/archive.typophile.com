    <p>Hi typophiles,<br>
    I'm a humble web designer trying to improve my typography skills. At this point I'm particularly concerned with spacing issues. I've read several books and at the moment these are the tips I've been able to gather. I'm hoping some of you might help me improve, correct or refine this list or point me to any relevant literature on the subject. Please excuse me if I get any of the terminology wrong. Like I said, I'm a novice. Also, I'm having to write this on a tablet so I apologize in advance for any mistakes in the text.</p>
    <p>Letter-spacing<br>
    ------------------------------------------------------------<br>
    Reduce if:<br>
    - large body size (+ adjust kerning)<br>
    Augment if:<br>
    - small body size<br>
    - all caps (+ adjust kerning)</p>
    <p>Word-spacing<br>
    ------------------------------------------------------------<br>
    Typical starting point: 1/4 of body size<br>
    If you are not sure, go with tighter spacing<br>
    Must be clearly less than line-spacing<br>
    Make sure the "image" of each word is clearly separate from the previous and the next but don't let the lines fall apart. Enforce continuity. Step back and see if your paragraphs are disintegrating.<br>
    Word-spacing can be augmented if:<br>
    - typeface has large counters<br>
    - you are using an extended family<br>
    - you are using all caps<br>
    - you have long lines<br>
    - you have a small body size<br>
    Reduce if:<br>
    - large body size</p>
    <p>Line-spacing<br>
    ----------------------------------------------------<br>
    Augment if:<br>
    - light text on dark background<br>
    - long lines<br>
    - large x-height<br>
    Reduce if:<br>
    - short burst of info</p>
    <p>Line-length<br>
    -----------------------------------------------------<br>
    Ideally 35-65 characters</p>
    <p>Justified text<br>
    ----------------------------------------------------<br>
    Avoid when you have short ines of text.<br>
    Improve by:<br>
    - splitting words<br>
    - adjusting word-spacing (make sure uneven spacing doesn't break up your paragraphs)<br>
    - adjusting letter-spacing (with caution!)<br>
    - using dirty tricks (reduce letter width to 97-98-99%)</p>
    <p>Left-aligned text<br>
    --------------------------------------------------<br>
    Improve by:<br>
    - not permitting several equally long or similarly shaped lines go one after the other<br>
    - not permitting each line to be shorter than the previous one (formng a triangle paragrapgh shape)</p>
