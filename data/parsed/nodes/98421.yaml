    html: |-
      <p>The lowercase ‘i’ and ‘n’: use either the width of the i (especially if it is a serif), or the space between the two stems of the n as starting points to define your standard word space.</p>
      <p>A shortcut for using the i as a starting point: start with a few lines of text from your publication. Copy paste to a second paragraph. In the first copy of the text substitute i’s for the space, like this:</p>
      <p>I'mislowlyibeginningitoibuildiailibraryiandiwouldiloveitoigetisomeiadviceitoimakeisureitheifontsiIibuyiareigoodiquality.<br>
      I'm slowly beginning to build a library and would love to get some advice to make sure the fonts I buy are good quality.</p>
      <p>Now play with the wordspace settings in the other bit of text to approximate that to the way the first bit looks.</p>
      <p>As you may notice, if you are seeing Georgia (which is a Typophile default), that font has word spaces that are equal to the width of the i.</p>
      <p>Working with the inner space of n is a bit more complicated, but with a large zoom percentage you’ll get there eventually.</p>
