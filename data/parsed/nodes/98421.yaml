    html: |-
      <p>Word space: start with width of lc i or inner space of lc n. (A quarter of body size is too general and allows for too much variation.)<br>
      Never cheat by adjusted letter spacing. (Changes ‘color’ and is thus unforgivable.)<br>
      Limit horizontal scaling of glyphs to no more than 2% either way (if too noticeable avoid!).</p>
      <p>General rule: aim for even ‘color’ (eg, squint through eyelashes and note even/uneven structure — correct if necessary).</p>
      <p>Extra rule: correct ‘rivers’. If there are too many of those, something is wrong with the general settings — start over.</p>
