  html: |-
    <p>I have used @font-face in a web page using BPdots-Squares (from backpacker.gr) and noticed something weird. The typeface is OTF and has a set of stylistic alternates for several greek characters (using ss01, salt, tilt and liga open type features to generate them). So, the weird thing is that while various browsers (namely, IE, Opera, Chrome and Safari) ignore the stylistic alternates (as it was expected), Mozilla doesn't (as shown in the example below):</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/explorer_3951.png"></div>Explorer<p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/chrome_5891.png"></div>Chrome<p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/mozilla_4736.png"></div>Mozilla (as you can see characters μ, ρ, φ, θ, β and γ are different - all of them are characters that belong to the stylistic alternates set)<p></p>
    <p>Can anyone explain why this might be happening?</p>
