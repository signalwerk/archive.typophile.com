    <p>Hey guys, does anybody know of a font that is really similar to Effra?</p>
    <p><a href="http://www.daltonmaag.com/browse/fonts/dama/effra" title="http://www.daltonmaag.com/browse/fonts/dama/effra">http://www.daltonmaag.com/browse/fonts/dama/effra</a></p>
