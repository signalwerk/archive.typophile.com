  html: |-
    <p>I’m embarrassed to say that only came across the <a href="http://bnd.bn.pt/">Biblioteca Nacional Digital</a> page today. What’s so interesting about it? Check out the <a href="http://purl.pt/index/geral/news/PT/indexOD.html">list of recent digitized books</a>, and I’m quite sure you’ll be as hyped as I am now. I mean, look at these beauties <a href="http://purl.pt/index/geral/date/PT/1685.html">from 1685</a>, for example. And this stuff seems to be available for free download in PDF format or <a href="http://purl.pt/170/1/P52.html">JPG files</a>!!!</p>
    <p>Here’s another pearl: <a href="http://purl.pt/107">Nova Escola para aprender a ler, escrever, e contar</a>. This book is where <a href="/wiki/Dino%252Bdos%252BSantos" class="wiki">Dino dos Santos</a> got his inspiration for <a href="http://www.myfonts.com/fonts/dstype/andrade-pro/">Andrade</a>.</p>
    <p>I hope the <a href="http://en.wikipedia.org/wiki/Mafra_National_Palace#Library">Library of Mafra National Palace</a> decides to digitize its contents as well...</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/38821" class="topic-previous" title="Go to previous forum topic">‹ Upcomi</a></div>
