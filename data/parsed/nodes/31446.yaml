    <p>hello all,<br>
    Working by myself I find I'm lacking in the "bouncing of ideas" off a workmate, so I would appreciate any advice. </p>
    <p>I am redesigning my local County Councils Child Care newsletter aimed both at parents and child care professionals.</p>
    <p>I have managed to convince the committiee that Futura would be a good display font for use in the headlines ect, but I am at a quandry as to what to use for the body copy. Setting it all in Futura doesn't sit well, Univers is easy to ready, and Frutiger looks good as well. Their prefered font is Arial. I have convinced them that Helvetica is better so thier prefered font is Heltvetica now.</p>
    <p>What I would like is suggestions for fttns that have a bent towards art neuveu, due to the councils location in the UK, and are legible at 11-13 point. I will be printed on Arjowiggins Iniut paper at 130 gsm</p>
    <p>Any sugestions gratefull recieved<br>
    Cheers<br>
    Martin<br>
    PS I have a budget of up to £100 for the font family I need at least a italic, bold and reg version.</p>
