    html: <p>Well, I disagree with your organization's legibility guidelines -- I think that using a sans here would hinder it if anything. The only Art Nouveau, readable sans-serif I could find is <a href="http://www.myfonts.com/fonts/linotype/itc-benguiat-gothic" rel="nofollow">Benguiat Gothic</a>. It's by far the most readable Art Nouveau sans I could find, but I still wouldn't consider it a terrific choice for body text -- the letterforms are ornate enough to distract your readers. If you're committed to Art Nouveau, use this, but if you're not, look for a humanist sans-serif. May I recommend the newly released <a href="http://beorcana.com/specs3.html" rel="nofollow">Beorcana</a> by Carl Crossgrove, a fellow Typophile? It's specifically designed to be extremely legible, although I'm not positive if I would want to combine it with Futura. Might the Display sizes of it work for headlines too?</p>
