    html: |-
      <p>Finding a companion to Futura just recently came up on Typophile <a href="http://typophile.com/node/31131" rel="nofollow">here</a>. The person was looking for a companion for a Futura logo to be used for short passages of text. The consensus as to what to use for text appeared to be Futura (again), Bodoni (what <a href="/wiki/Robert%20Bringhurst" class="freelinking" rel="nofollow">Robert Bringhurst</a> suggests because of the two typefaces similar mechanical feel), a humanist sans like Syntax or Gill, or a slab serif like Beton, Memphis, or Lubalin Graph. You should note that the person looking for help was adamant about using another sans serif; most would suggest using a serif for extended body text.</p>
      <p>In the thread, it came up that Futura came out of the Bauhaus and Art Deco movements, so I question your interest in using an Art Nouveau typeface, especially since Art Nouveau, to my knowledge, is most associated with France, not the UK.</p>
      <p>Some suggestions: <a href="http://www.linotype.com/90672/avenirnext-family.html" rel="nofollow">Avenir Next</a>, <a href="http://www.houseind.com/index.php?page=showfont&amp;id=18" rel="nofollow">Neutraface</a>, and <a href="http://fontbureau.com/fonts/Relay" rel="nofollow">Relay</a> could be good choices for sans-serifs that evoke both the geometric and Art Deco flavors of Futura. I'd, however, recommend a serif for body text, although other than Bodoni, no other one comes immediately to mind. The other thread I mentioned largely came to the conclusion that using sans-serifs for extended texts is not a great idea, so I'd really look into serifs.</p>
      <p>I'm not so up on my Art Nouveau typefaces, so I can't make any suggestions there.</p>
