    html: |-
      <p>I'm always on the lookout for nice new fonts, and of course any given purpose is going to have its own requirements.  That said, I do have a short list of useful standbys that I'm personally fond of.</p>
      <p>Sans: Frutiger, Futura, Helvetica, Syntax (not too original, am I? &lt;g&gt;)<br>
      Serif: Adobe Jenson Pro, Bembo, Centaur, Palatino, Sabon, Schneidler<br>
      Japanese: Epson Kyôkasho, Kochi-Subst (or Sazanami) Mincho, M+ 2C </p>
      <p>I've never actually tried them, but lately I've been admiring some recent discoveries:
      </p><ul>
      <li>Novel Sans Pro (also Rounded)
      </li><li>Comenia Sans
      </li><li>Goudy Text CT (from Castle Type; OTOH I don't much care for the Monotype version)
      </li><li>LTC Metropolitan Italic Alt (a bit closer to Arrighi's original than Warde)
      </li><li>Poetica (esp. Poetica Chancery III)
      </li></ul>
      <p></p>
