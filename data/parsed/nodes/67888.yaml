    <p>Hello people!</p>
    <p>I've ever searched the similar topic, at Google, before I post new topic, but there's not a similiar topic to mine, now I'm going to post new topic:</p>
    <p>What are your favourite fonts?<br>
    My favourite fonts:<br>
    — BD Cartoon Shout (the most favourite)<br>
    — Bernhard Fashion BT<br>
    — Bible Scrt<br>
    — Calibri (the most favourite)<br>
    — Cambria (the most favourite)<br>
    — Candara<br>
    — Cartwheel<br>
    — Charlotte Sans LET (the most favourite)<br>
    — Dakota<br>
    — DigitalStrip (the most favourite)<br>
    — DraftPunk LTD (the most favourite)<br>
    — ElegaGarmnd BT (the most favourite)<br>
    — Freehand 575 BT<br>
    — Galette (the most favourite)<br>
    — Gentium<br>
    — Impress BT<br>
    — ITC Officina Sans Std and LT [Book]<br>
    — Komika Text Kaps (the most favourite)<br>
    — Lucida Sans Unicode (the most favourite)<br>
    — Myriad (Pro, Web Pro and Bold)(the most favourite)<br>
    — Neo Sans Regular (the most favourite)<br>
    — OfficinaSanITC (Bol and Boo)(the most favourite)<br>
    — Omnes<br>
    — Quicksand<br>
    — Sans Serif FLF Condensed Italic (the most favourite)<br>
    — Segoe Print (the most favourite)<br>
    — Segoe Script<br>
    — Titilium</p>
    <p>Did I have good choices?</p>
    <p>And yours?</p>
