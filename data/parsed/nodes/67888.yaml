    html: |-
      <p>Times (New) Roman was designed for a particular purpose, and fulfills that purpose quite admirably.  If you want to fit a relatively large amount of prose into a constrained space without overly sacrificing readability, aesthetics, or professionalism, it's a fine choice.  (Or, as an acquaintance of mine put it, "In a two-inch-wide newspaper column, Times Roman is da bomb.")  The main problem with it IMO is that it tends to be egregiously misused.</p>
      <p>BTW I thought Stanley Morrison designed it?</p>
