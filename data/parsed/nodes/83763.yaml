  html: |-
    <p>I’m designing a book of poetry with all the text aligned to a baseline grid. Just a couple of the poems have sub-sections with titles. I don’t seem to be able to select a spacing after those subtitles that looks right to me and still keeps everything on the basic grid—though I can keep it to a twice-dense grid so that the lines “come back” a little later.</p>
    <p>What do you think looks better: losing the baseline alignment for a part of a page, or having unnecessarily large spacing after a subtitle?</p>
    <p>(I’m talking about Garamond 10.5/13pt text with a 6.5 pt space after the subheadings, which are Garamond Bold 10.5/13.)</p>
    <p>Thanks!<br>
    -Courtney</p>
