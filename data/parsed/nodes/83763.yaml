    html: |-
      <p>The "twice-dense grid" will grant you the best control.<br>
      Or you could leave no space after the subheadings, since they're already bold.<br>
      (If they span multiple lines, in InDesign you could apply the "Align only the first line to the baseline grid" option)</p>
