    html: <p>Yes, I did try it with no space, but it looked confusing since there are breaks of 13 points between stanzas of the poem, and not having a space between the subhead and first stanza of the section made the title seem to refer only to that first stanza, not the whole section. BTW I also have breaks of 26 pts after the poem title (Garamond Bold 13/13pt) and before each new section subhead.</p>
