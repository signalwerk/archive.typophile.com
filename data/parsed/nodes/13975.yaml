      <p>Wow!<br>
      So $740.00 from 1924 is roughly worth $7,982.71 for the font family using the Consumer Price Index.<br>
      And we thought things were cheaper in the <em>good ol’ days</em>.</p>
      <p>Paul, the colophon is great and shows real promise on the revival of Lanston’s Italian Old Style (and ornaments?). Does anyone know why Monotype Italian Old Style turned out looking so <em>non-Italian</em>?</p>
      <p>———————————————————————-<br>
      Yes, I’m old, and like my Italians Old Style!</p>
