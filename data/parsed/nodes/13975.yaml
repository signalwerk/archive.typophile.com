    <p>Thought this might be of interest to history buffs.<br>
    I recently unearthed several samples sheets (very poor copies of original) from one of Lanston Monotype’s promotional pieces from 1924.</p>
    <p>It’s for <em>Italian Old Style</em> by Frederic W. Goudy, with specimen samples of the Roman and Italic faces, and a <a href="http://www.acmedigital.net/Aimages/Ital-OS_prices.jpg" target="new"><strong>price sheet</strong></a> for type caster matrices.</p>
    <p>This PDF includes the <a href="http://www.acmedigital.net/Aimages/ITALIAN_.pdf" target="new"><strong>Italian Old Style</strong></a> cover, Roman &amp; Italic specimens and price sheet.</p>
    <p>The only digitized version I found available is <a href="http://www.fonts.com/FindFonts/detail.htm?pid=202522" target="new">Monotype Italian Old Style Roman</a> which differs in many respects, sort of sterilized, like they took the <em>Italian</em> out.</p>
    <p>The <a href="http://www.fonts.com/findfonts/detail.htm?pid=202523">Italic</a> is altogether different from Goudy’s version, very much like a standard italic afterthought.</p>
    <p>Monotype also added a bold and bold italic weight, though Goudy only designed a Roman and Italic.</p>
    <p>It seems that <a href="http://www.lanstontype.com/Giampa/Goudy-Type-Face-List.html" target="new">The Lanston Type Company</a> has Italian Old Style on their list of Goudy designs to digitize in the future... let’s hope they do.</p>
    <p>—————————————————————————————<br>
    Yes, I’m old, but so what!</p>
