  html: |-
    <p>Hi all!</p>
    <p>I'm happy to announce that we've done Italics for our Foco fonts.<br>
    Gentle angle, slightly narrower, cursive features; great for subtle emphasis on body copy and beautiful at display.</p>
    <p>The italics are long waited and requested a number of times, including here at Typophile.</p>
    <p>Hope you like it?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Foco_ToTypophile_4667.gif"></div><p></p>
    <p><a href="http://www.daltonmaag.com/browse/fonts/foco" title="www.daltonmaag.com/browse/fonts/foco">www.daltonmaag.com/browse/fonts/foco</a></p>
    <p>(A few samples and details can be seen on my flickr: <a href="http://flickr.com/photos/fabiohaag/3214681859/" title="http://flickr.com/photos/fabiohaag/3214681859/">http://flickr.com/photos/fabiohaag/3214681859/</a> )</p>
    <p>Cheers</p>
