  html: |-
    <p>Dear type community,</p>
    <p>I have to work sometimes with chinese characters and regardless of the sad fact that I can't read Hanzi (chinese characters) I would be interested in seeing and learning from excellent examples of chinese typography, which right now I haven't found yet and probably couldn't even tell (badly distorted typefaces I saw a lot).</p>
    <p>I would be delighted if somebody could recommend a nicely done book and/or magazine in chinese language (preferrably mixed with english terms).</p>
    <p>Thanks,<br>
    Philipp</p>
