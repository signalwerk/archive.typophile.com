  html: |-
    <p>Is there a place I can find copies of the original Berthold FrankReuhl? Whether it's specimens or simply books printed using this.</p>
    <p>One of the main things I've attributed to Frank Reuhl is it's rounded smoothness and uniformity. From the small number of glyphs I've seen, the original is not completely so.</p>
    <p>Thanks!</p>
