      <p>Tim: <cite>“small caps” (please forgive this simplification).</cite><br>
      John: <cite>what you see in the lowercase alphabet are not ’smallcaps’</cite></p>
      <p>John, I am not so naive as to think the cyrillic lowercase is the same thing as small caps. I had hoped my little note in parentheses would make that clear.<br>
      However, I believe it is not senseless to study the proportional relations between cyrillic uppercase and lowercase, and even relate that to latin small caps. For example, the reason why the в (lowercase ve) is proportionally wider in the lowercase (see the above illustration) is certainly the same as the reason why a latin small cap B would be made relatively wider than letters with only one counter.</p>
