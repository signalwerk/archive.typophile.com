      <p>Craig, a lot depends on how small caps are set in combo with U&amp;lc.</p>
      <p>For old-style types in which the small caps are “petite”, very close to x-height, it was customary to letter space them, they <em>are</em> capitals, after all. (They appeared a lot like old style figures—which are tabular—with a lot of inherent sidebearing space.) By the same token, small caps that are a lot larger than x-height may be set tight, like the lower case.</p>
      <p>Compare:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Micro_6551.png"></div><p></p>
      <p>1. Petite small caps, normal spacing<br>
      2. Petite small caps, letter spaced<br>
      3. Small caps, normal spacing</p>
      <p>In the top face, which is something of an old style, setting #2 is preferable.<br>
      In the bottom face, a didone, #3 is preferable, because letterspacing doesn’t suit this kind of didone (unless it is an all cap setting, with lots of spacing).</p>
      <p>And remember: <strong>Real typographers never set caps with small caps!</strong></p>
