      <p><em>How would you set an acronym at the beginning of a sentence (or are small-capped acronyms also something that real typographers don't do)?</em></p>
      <p>I forget.<br>
      With acronyms, a lot depends on the typeface and the genre of job it’s being used in.<br>
      One also has to consider what the ﬁgures are like.</p>
      <p><em>Nick, why didn't you build more generous spacing into the petite caps in the oldstyle font?</em></p>
      <p>It makes sense to match the default look of small caps to that of All Caps (with “cpsp” if it’s in the font).<br>
      That way, it’s a benchmark that typographers can relate to, adding tracking as necessary.<br>
      For instance, in a “title page” usage mixing All Caps with All Small Caps, you want to have a consistent letterspacing when the typographer adds, say, 100 units of tracking throughout.</p>
