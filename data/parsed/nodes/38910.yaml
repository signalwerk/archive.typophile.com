      <p>WGL4 stands as a pretty good basis for pan-European language support.</p>
      <p>Microsoft's expanding procurement requirements reflect their own market priorities, which might not be everyone else's market priorities, especially not every font foundry's priorities. How many font makers are selling end user licenses in Vietnam or Kyrgyzstan? There are a few things that can be picked up from examining the Win7/8 release versions of e.g. Constantia. For example, if you are making Greek fonts -- even Monotonic ones -- you might want to consider including the numeric koppa character: apparently there was enough of a call for this (it is used as a symbol in legal documents) for Microsoft to add it to all their fonts with Greek support.</p>
