      <p><em>Is there any way to optimize this task or do i have to draw them from zero?</em></p>
      <p>I'd say it depends on the typeface.<br>
      You can start by doing global transformations to the upper case glyphs.<br>
      1. Scale down: Actions&gt;Contour&gt;Scale<br>
      2. Add weight: Actions&gt;Effects&gt;Bold<br>
      In either of these, you may add slightly more to the x axis.</p>
      <p>For serif fonts, cutting, pasting, and dragging can also be useful methods.</p>
      <p>A good way to see what's working is to compare, in the Metrics window, those letters that are basically the same in all three cases, C, O, S, V, W, X.</p>
      <p>It's also a good idea to test your small caps, in a piece of text in InDesign or Quark, against a typeface of similar style.<br>
      Try it in a piece of text with "U.S." or similar ambiguous acronyms, and with all-small-cap lead-ins to text paragraphs.</p>
      <p>In page layout applications, you can get a feel for the transformation required by making faux small caps using scaling and stroking.</p>
