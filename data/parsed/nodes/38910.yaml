      <p>&gt;A good test of the width-guide is the smallcap O</p>
      <p>For my design, based on Caslon, the small cap O looked better scaled not as wide as the H was scaled. I just checked and in Merganthaler Linotype's Caslon Old Face (1923) they do the same thing. I can't remember whether I checked what they did while doing mine, but in any case I think it works well. I don't have any 18th century Caslon model for the small caps, so I don't know what Caslon did--except that I can guarantee it won't be consistent! </p>
      <p>I also just checked Adobe Garamond and Minion. In both of these the O is proportionally a bit wider--not narrower--than the H, compared to the caps. And in neither of these fonts are the counters as wide as they would be following John's guidelines.</p>
      <p>My conclusion is that there are no hard and fast rules here, and one can do it successfully different ways. </p>
      <p>edit: I cross-posted with Charles. I see that he also reduces the rounds a bit compared to the straights.</p>
