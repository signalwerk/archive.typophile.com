    html: "<p>Some of the comments in this thread about proportional scaling and width may be confusing to some people, since the illustrations for the how-to have disappeared. In my method, the width gain is all in the stem weight, which works pretty well perhaps because of the kind of proportions my uppercase letters seem to have. One of the first stages of the process is to make a mask of the caps scaled to the smallcap height that will serve as a guide to the <em>internal</em> width of the smallcaps. As Charles notes, you may be more pleased if this scaling is non-uniform: scaling the width less than the height if you want relatively squarer smallcaps from relatively narrower uppercase letters. My uppercase letters tend to be pretty wide, so I've not found this kind of adjustment necessary in most designs.</p>"
