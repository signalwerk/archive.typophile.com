    html: <p>Hrant, note that I said balance colour between the uppercase, smallcaps <em>and lowercase.</em> There is a threeway relationship to be established. Often, if smallcaps are proportionally similar to the uppercase then they will appear too narrow relative to lowercase letters, just as uppercase letters would appear too wide if their proportions were similar to typical smallcap letters. As you reduce the height of caps, you need to compensate horizontally for the reduction of counter space, especially for a letter like B. Of course, I am talking about text faces in text settings.</p>
