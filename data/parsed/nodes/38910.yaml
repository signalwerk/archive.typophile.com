    html: <p>John is quite right about certain full caps going too wide when scaled to small caps, especially when the scaling isn't linear. Having said that, I find it easier to rework CDGOQ (&amp; maybe B, P, R and U) -- take a few units out of each side. This may just be a personal foible, although I make the small caps  "smaller" than what John indicates, and that may be part of it. The thing to remember is that the first, formulaic step is just a beginning; I don't think you get all the way to a final set of small caps through any formula. With that in mind, whatever "first steps" work best for you is the way to go.</p>
