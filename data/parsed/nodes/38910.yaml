    html: "<p>Tim, I like what you propose, but I really think the lowercase Cyrillic letters need to be considered independently of smallcaps. Yes, many of them are based on the same shapes as the uppercase forms, but the very fact that they need to proportionally harmonise with some lowercase letters that are differentiated from the uppercase letters requires them to assume a different set of proportions. It is helpful to bear in mind that Cyrillic was a unicameral (uncial) alphabet for a lot longer than either Latin or Greek, and that its conversion into a bicameral alphabet happened relatively suddenly. So what you see in the lowercase alphabet are not 'smallcaps', but uncial letters writ small, while the uppercase represent the same uncial letters writ large. This is a very different evolutionary path than that which produced smallcaps from uppercase letters (brilliantly explored in Margaret Smith's essay 'The Pre-history of \"Small Caps\": from All Caps to Smaller Capitals to Small Caps', in volume 22 of the <em>Journal of the Printing Historical Society</em> (UK)). The term smallcaps presumes the pre-existence of uppercase letters; the division of an uncial script into a bicameral alphabet is a different process. When the bicameral alphabet introduces foreign letterforms not native to the preceding uncial script, as the Petrine reform of Cyrillic did, then the proportions of the two cases of letters adapt to their new partners, and lose the relationship that they might have had to each other. This, of course, makes true Cyrillic smallcaps possible.</p>"
