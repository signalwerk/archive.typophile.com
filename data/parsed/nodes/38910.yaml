    <p>Hi All,</p>
    <p>I´m currently working on a font that i would like to try adding small caps to it. Is there any particular drawing method to create them using the pre-draw capitals? Something like scaling down the capitals and then exterpolate them maybe? Is there any way to optimize this task or do i have to draw them from zero?</p>
    <p>As a beginer, any expert help or tips on this would be greatly apreciated.</p>
    <p>Thanks in advance<br>
    Regards</p>
