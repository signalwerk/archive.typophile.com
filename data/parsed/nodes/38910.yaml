      <p>When I was working as an art director, I liked to use small caps, but for most fonts I found them much too short and small.<br>
      So I always make the small caps in my fonts quite a bit taller than the x-height, so that they work OK in all-small-caps settings, and as acronyms. I suspect that many type designers make them to look good in a caps-with-small-caps setting, or to match a paragraph of caps-with-small-caps against a paragraph of upper and lower case, in a specimen. But that's not how they are generally used.</p>
      <p>I have recently discovered another reason for bigger small caps -- Cyrillic. Because the lower case Cyrillic (especially in Russian) has the look of small caps, with capital letterforms and few extenders, it's necessary to bump up the size of the small caps in a typeface to get adequate differentiation.</p>
