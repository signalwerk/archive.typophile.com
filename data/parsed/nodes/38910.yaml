      <p>The latter is exactly what I was interested in. I wanted to know in which way the proportions <cite>within</cite> the uppercase differ from the proportions <cite>within</cite> the lowercase. That's also what my above diagram is about, isn't it? The diagram is supposed to visualise the relation between the intra-uppercase proportions and the intra-lowercase proportions.</p>
