      <p>It's tricky stuff, this is.</p>
      <p>For the characters I need for phonetics, I had to make matching small caps of a handful of characters, which needed to be able to blend in with actual lowercase characters -- the small caps characters depict valid phonemes on their own. Usually, one only needs to worry about caps-and-small caps.<br>
      I also need some of these reversed, upside-down, or both (rotated!), which may have side effects on the stroke contrasts. Stuff like</p>
      <p>vɛʀy dʀoʊl, mˈlɔːːːːd</p>
      <p>.. to top it off, there are also a couple of "required" superscripts. Same problem there: I'd prefer nice, fat, same-stroke-width ones over regular-made-smallers. I already found out "just" vertically shrinking a lowercase 'h' to get 'ʰ' doesn't quite <em>do</em> it for me.</p>
