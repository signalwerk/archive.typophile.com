    html: |-
      <p>The pattern pieces (line and box draw characters) were not intended to be included in all WGL4 fonts: they are only included in the spec for console fonts. This used to be clearer in early documentation of WGL4, which distinguished between the core set and the optional inclusions. Unfortunately, more recent documentation has omitted this distinction; I'm not sure why.</p>
      <p>There really is no reason to include line and box draw characters in anything but a monospaced font, since they are entirely dependent on such spacing in order to work correctly. So, for example, of the ClearType fonts, which were based around the WGL4 set -- with some additions -- only Consolas supports these characters.</p>
