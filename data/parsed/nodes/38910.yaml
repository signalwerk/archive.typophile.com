      <p>Bill,</p>
      <p>I've never actually held special no. 5 mats in my hand, and Bill Loftin (Heritage Printers) has finally shut down, so I can't ask. But yes, I think that meant they were duplexed mats -- roman and italic on one matrix.</p>
      <p>Note the the roman small capitals on these matrices are a bit larger than what you see in the regular font; I imagine they were intended for display. A good supporting argument for Adam's notion that small caps should be a separate font. I'd argue (&amp; for all I know, Adam always felt this way) that this idea works when the small caps are for display, but another set of small capitals should be included in the basic fonts for running text.</p>
