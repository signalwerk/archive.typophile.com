    html: |-
      <p>When I'm making "serviceable" small caps from full caps, I don't scale the full caps proportionally, as recommended by John Hudson -- I usually have about a 4 percentage difference -- if the vertical is scaled to 62 percent, then the horizontal is scaled to 66 percent. This will make you do some work with round letters (C, G, O, Q for sure), but will give a better overall balance.</p>
      <p>The weight increase I used in Fontographer was 9 units, but FontLab seems to require less. Don't forget to move them back up to the baseline (half the "embolding" value), and rework the left &amp; right sidebearings. And don't forget to "remove overlap."</p>
      <p>That's the start, now clean them up.</p>
      <p>P.S. "serviceable" meant I could get away with them in about a 10-point setting, in running text. The most common reason I made them up was to get a set of italic small caps. Sizing there is relatively easy; match existing roman small caps. If you're starting with the roman, size the "new" small cap "x" just a bit taller than the lower-case "x". I let the size change when "embolding," so the final size comparison has to wait till you've done that. Now check things with an "E." If both the "X" and "E" look right, most of the alphabet should feel right, so highlight all &amp; have at it.</p>
    html_clean: |-
