    html: <p>It probably depends on to whom you are making the claim. Some years ago, at a Unicode conference, I was sitting next to Michel Suignard from Microsoft, who was primarily resposible for defining the WGL4 set, and I recall that he agreed with my interpretation of the then published spec that the line and box draw characters were optional, outside of the core set. But one possible reason for the removal of the core/optional distinction in the documentation might be that software developers want to be certain about what characters a font contains if it claims WGL4 support. An equivocal option would be to claim that a font provides 'WGL4 language set support'.</p>
