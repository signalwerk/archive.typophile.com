    html: |-
      <p><em>Strange that the combining diacritical marks are not a part of WGL4. Doesn't that put Microsoft &amp; Unicode a bit at odds?</em></p>
      <p>No. WGL4 is a superset of 8-bit encodings for European languages using the Latin, Greek and Cyrillic scripts, plus a few additions. Since it deliberately only supports those languages that do not require combining marks, it omits them. It is also worth noting that WGL4 is pretty old now, and it's been almost a decade since it was defined as the procurement requirement for any work I've done for Microsoft. We extended even those ClearType fonts that are not Office core fonts to support Vietnamese and some symbol and extra numeric glyphs not in WGL4.</p>
      <p><em>We get in a number of manuscripts these days where even simple ones like an a with an acute are typed as two characters, U+0061 followed by U+0301.</em></p>
      <p>Which Microsoft would automatically map to the precomposed character in the font cmap during display.</p>
