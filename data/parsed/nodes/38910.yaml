      <p>But in the design of a Cyrillic type, the width of the lowercase в needs to be coordinated with the width of the lowercase а. So this is a very good example of what I am talking about. Yes, the reasons why в proportionally wider in the lowercase than in the uppercase is related to the reason why a smallcap B is proportionally wider than the uppercase, but the precise width of the в is determined relative to other lowercase letters, most importantly а, not relative to the uppercase. This explains why an actual Cyrillic smallcap В might well have a different proportional relationship to the uppercase than the lowercase has. These comments are based on a lot of experience designing Cyrillic types. Smallcaps can be derived systematically from uppercase letters, but lowercase letters need to be designed independently, proportionally relative to each other. So this is why I think it is a mistake to look at the particular proportions of lowercase Cyrillic letters as something that can be related to smallcaps, because I think these proportions involve other influences.</p>
      <p>A good experiment would be to apply your approach to typefaces that include Cyrillic smallcaps, so you can show a three-way relationship. This would reveal the difference between the proportions of actual smallcaps and lowercase letters relative to the uppercase.</p>
