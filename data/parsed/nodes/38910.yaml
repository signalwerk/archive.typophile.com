      <p>I generally use the IBM extended <a href="http://www.borgendale.com/glyphs.htm" rel="nofollow">Universal (or Unified) Glyph List</a> (which is undoubtedly descended from a common source as WGL4) as the basis of character support if I want to expand coverage outside Latin-1.  That's mostly because the first fonts I designed were targeted at OS/2 users, of course.  Since then I've just kept the habit because I figure it's as good a system as any.</p>
      <p>I don't mean that I <em>support</em> the whole thing, just that I use it as a rough guideline for "I should really plan to support these characters" up to a certain cut-off (usually about the 383 mark, although I often include the 505-529 region as well).</p>
      <p>It used to be divided into a few language-specific versions. TypeTool (and presumably FontLab) includes obsolete mapping tables for them; I created an updated one for the full UGL which I use.</p>
