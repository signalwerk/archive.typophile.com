    html: |-
      <p>Maybe, it probably depends on the (text) designer. When I use small caps in display, it is usually for a subhead -- usually a first-order subhead. Full caps are usually too big at text size; if you set them smaller, the size is right but the weight too thin. Small caps at text size have the right weight, but are too small. A set of small caps just a bit larger than "regular" or x-height small caps would be about ideal.</p>
      <p>Truth to tell, I try to avoid small caps for subheads, because of my belief that the correct letterspacing of them (and the attendant word spacing) varies with how many words there are. Frequently, the number of words in subheads varies considerably, authors just don't think of all the problems they give us designers ;-).</p>
      <p>Small caps can work quite well in running heads, sometime they too vary considerably in length, but there are far fewer chapters than subheads.</p>
      <p>I'm not sure how a designer that favors cap-small cap in display would feel; I confess that design leaves me cold, but maybe that's just saying it doesn't fit my temperment and meager skill -- I rely mainly on space and color when I design.</p>
