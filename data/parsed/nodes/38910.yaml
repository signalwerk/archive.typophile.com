      <p>I would say - but I'm no pro myself - that you can safely use your existing capitals. </p>
      <p>There are probably designers that use Multiple Master technology and such to extrapolate the small weight increase that scaled down caps need to work well, but I think you can also use the Bold Filter in FontLab (or the Expand Stroke option in Illustrator) to achive something similar.<br>
      Having said that, extrapolations done with these options do need a lot of editing afterwards, because the Expand Stroke/Bold Filter are usually pretty destructive to the lettershapes.</p>
