      <p><em>but shouldn´t that space be larger in the small caps since they´re steams are bolder?</em></p>
      <p>Again, much depends on the design of your original uppercase letters and also, of course, on the height of your smallcaps. My typical smallcaps are noticeably taller than the lowercase x-height, but with the same vertical stem weight at the lowercase letters (usually based on the width of the lowercase i stem). With these sorts of proportions, and the typical width of my uppercase letters, this approach produces the kind of smallcaps I find most useful. Optically, it means that the smallcap text is a touch lighter and more open in appearance than lowercase, which I think is a benefit, especially since naïve users cannot be relied upon to letterspace smallcaps. If any of these variables are different, then the scaling factor used to develop what I think of as the width-guide should be adjusted.</p>
      <p>A good test of the width-guide is the smallcap O. If one has a very round, Garamondish uppercase O, then a non-uniform width-guide -- i.e. one in which the uppercase is scaled less horizontally than vertically to determine the interior widths -- could easily result in a smallcap O that is too wide. Here is Constantia, showing the proportional relationship of uppercase, smallcaps and lowercase, with the smallcaps derived from the uppercase using a uniform width guide. I wouldn't want the smallcap O getting any wider than this.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/HHhOOo_4674.gif"></div><p></p>
      <p>Bill: <em>deriving the proportions of the small caps with one uniform rule throughout the alphabet isn’t the only way, and perhaps for some designs not even the best way.</em></p>
      <p>True, but if the regularised approach produces an unfortunate result for one of the smallcap letters it may also be an indication that something is wrong with the uppercase.</p>
      <p>By the way, not everyone starts with the uppercase. When designing Cambria, Jelle Bosma started with the smallcaps and then designed the uppercase. I suspect this might be his usual procedure.</p>
      <p>PS. Note that the illustration in this post does not show kerning.</p>
