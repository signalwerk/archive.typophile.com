      <p><em>Do you check each of the Cyrillic lowercase letters that can be regarded reduced versions of their uppercase counterpart individually against the a, or do you also consider the horizontal proportions within the letters that can be regarded reduced versions of their uppercase counterpart?</em></p>
      <p>This is the thing: I <em>don't</em> regard them as reduced versions of their uppercase counterparts. I think it is a mistake to regard them as reduced versions of their uppercase counterparts, just as it would be a mistake to regard the uppercase letters as big versions of the lowercase.</p>
      <p>I understand your diagram, but what I am saying is that it misses the input from the other lowercase letters. This input is important, especially in the case of an Cyrillic designed to harmonise with an existing Latin design in which several key letters are inherited from the Latin (thanks to Peter the Great!). It also misses the cumulative input derived for iterations of the lowercase design, i.e. not just the influence of lowercase-distinct architecture in some letters, but the influence of the cumulative design decisions about lowercase letters.</p>
      <p>I design the Cyrillic lowercase and the uppercase largely independently -- as independently as the Latin lowercase and uppercase --, and unlike smallcaps the proportions of lowercase letters are not derived from uppercase. Within the set of letters that share similar uppercase and lowercase architecture, the same kind of proportional awareness is important <em>within the individual cases</em>. For instance, the variation of internal width in the sequence инпџцшщ is similar to that in the sequence ИНПЏЦШЩ, but they are arrived at independently, checking lowercase against lowercase and uppercase against uppercase.</p>
