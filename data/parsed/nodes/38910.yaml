    html: <p>I recently started with John Hudson's method--which he suggests only as a starting point for later adjustments--and have continued to use the FontLab Interpolation tool for curves, as well as widening stems by hand. However, I didn't follow Hudson's model exactly, as I made the small caps a bit wider, as Charles suggests and as I believe is traditional. I don't know how much wider as it just did it by eye. Also I adjusted relative weights of vertical arches, corrected diagonals and joints, etc by eye. I don't know how much adjustment is needed if you use the RMX tuner, but next time around, after I have made my weights MM compatible, I will probably use it as a starting point.</p>
