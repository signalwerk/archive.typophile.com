      <p>Bill,</p>
      <p>The "4 percent" is just sort of an average I noticed as I was making up small caps over a number of years -- usually in italic, sometimes in roman. As you say, you have to make even these initial decisions by eye -- or at least, I do, and it seems you as well. The scaling values pretty much depend on the lowercase letters; at least, for the small caps that are to set in running text. As I remember, I've used as little as 59 percent with vertical, and probably as much as 75 percent.</p>
      <p>For another set of "display" small caps, you have more freedom. If you have, or the library has, Adrian Wilson's <em>The Design of Books</em>, look at the "special two-letter small caps" for Caslon Old Face. In my copy, it is page 39. These sorts were available for just a few fonts in the Linecaster days.</p>
      <p>Charles</p>
