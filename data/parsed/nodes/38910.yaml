      <p>Jumping in a bit late here...</p>
      <p>Karsten,<br><cite>If your font is MultipleMaster, with a weight axis, try Tim Ahrens’ RMX Tuner</cite></p>
      <p>The RMX Tuner is not intended for creating 'sets' of reduced glyphs (such as small caps).<br>
      The most suitable of the Remix Tools for creating small caps is the RMX Scaler. You can simply select your capitals, run the Scaler and create the small caps with your preferred suffix. Since you can precisely control the weight, width and height, and add spacing it is a 'one-stop-shop' and often does not require any further corrections at all.</p>
      <p>If you then realise you want to change the horizontal propoertions of the small caps (e.g. making the B or S wider) you can easily do so with the Tuner. </p>
      <p>William,<br><cite>I don’t know how much adjustment is needed if you use the RMX tuner</cite><br>
      I suggest you open a preview window next to the glyph window so you can instantly see the effect and choose the scaling and weight intuitively and visually. I believe this method is better and quicker than any other digital tool available. Note that if you use the Scaler right after you have used the Tuner the adjustment values are entered automatically.</p>
