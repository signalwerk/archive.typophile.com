    html: |-
      <p>There are two helpers for this:</p>
      <p>If your font is MultipleMaster, with a weight axis, try Tim Ahrens' RMX Tuner:<br>
      <a href="http://justanotherfoundry.com/tools/RMX/" rel="nofollow">http://justanotherfoundry.com/tools/RMX/</a><br>
      This gives the best results that an automatic method can provide today, and should be your first choice.</p>
      <p>If the font has a single axis only, you may try the Glyph Tweaker script:<br>
      <a href="http://www.kltf.de/kltf_otproduction.htm" rel="nofollow">http://www.kltf.de/kltf_otproduction.htm</a><br>
      [Scroll down a bit. Requires RoboFab and Dialog Kit.]<br>
      First measure basic stem widths and height of your caps. Then run the script and fill in these values, plus stem widths and height of the small caps.<br>
      The script relies on FLS' Bold function, so the outlines are only as good as this function allows. If you switch on FontAudit, you will see what I mean. Especially diagonals need corrections -- Bold cares for x and y directions only. Still this is a good starting point to get the proportions. I put these into the uppercase's mask layer and adjust uppercase by moving nodes or with John Hudson's method to match the automatically generated proportions.<br>
      In essence, what this script does is combining the operations which Charles Ellertson describes: scaling and bolding. I did not want to calculate scaling and bolding factors myself each time, and put the according formulas into a script.</p>
      <p>Charles -- <cite>The weight increase I used in Fontographer was 9 units, but FontLab seems to require less.</cite></p>
      <p>Yes, it is: 2 units FOG Change Weight = 1 unit FLS Bold.</p>
