    html: |-
      <p>Not that'd I'd expect anyone to go to all the work, but theoretically...</p>
      <p>The small caps needed for phonetics should be drawn up special. They also have a Unicode code point, unlike small caps generally. They need to blend into the general lower-case letters, and be kerned with other phonetic &amp; lower case sorts, but probably not against each other.</p>
      <p>The small caps to be switched in by an OT feature probably should be the ones used in running text, for acronyms &amp; abbreviations. Depending on your school of thought, that has implications for height &amp; width. Kerning is only needed against each other and punctuation, &amp; maybe full caps, though that's another issue (used in some legal styles like "Harvard Blue," etc.).</p>
      <p>The "Display" small caps are those intended for use in a subhead, chapter number, that sort of thing. Maybe even a TABLE or FIGURE head... It can be argued that these do not have to mix with lower case letters, and can have different height/width properties. They probably have to work with full capitals. One way to deal with them would be to use a separate font, as Adam Twardoch has mooted from time to time. Or perhaps a stylistic set.</p>
      <p>The compositor can do some work by using different character styles. Any needed differences between the "display" &amp; "running text" will likely be small, and the layout program's scaling for a few percentages points change is one way to go. It isn't ideal for several reasons -- the contrast of the characters will change a little (stem, fine lines), as will the weight generally if you use more than about 5 percent. Kerning will be maintained within the set of small caps the character style is applied to, but not with characters not included the character style, with punctuation being the most common problem.</p>
      <p>Then, I suppose if you're being really pure, except for the phonetics which have a Unicode index, you need them both mapped from capitals and mapped from lower case (c2sc and smcp). <cite>[Edit: FWIW,  I don't think this is worthwhile generally. In fact, with fonts where it's legal to modify them, I've been known to go in &amp; take out the lower-case mapping. There is always some handwork in using text extracted from a pdf,  and 99.9 percent of the time, any odd full caps are going to occur where you expect them to.]</cite> </p>
      <p>Just some of the issues that can come up with small caps in the use of type. </p>
      <p>Personally, I wouldn't bother to do all that in a font. Too much work for too little gain -- esp. since the designers who select what typeface will be used in a document will get bored with one font family fairly quickly, and move on.</p>
