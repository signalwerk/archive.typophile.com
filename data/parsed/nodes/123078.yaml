      <div class="comment-spam-body"><p>EDITED:<br>
      A true mystery. The usually reliable reference for the source of Nick's Fonts <a href="http://home.kpn.nl/savoogt1963/FontSources.htm" title="http://home.kpn.nl/savoogt1963/FontSources.htm">http://home.kpn.nl/savoogt1963/FontSources.htm</a> states that the lowercase of Xanthippe is unknown.<br>
      Some variant of a "titling text" by a 19th century foundry. But which one?<br>
      Since writing this I checked and found some similar fonts but nothing spot on.<br>
      I wonder where Nick saw the font with the lower case.<br>
      Don</p>
      </div>
