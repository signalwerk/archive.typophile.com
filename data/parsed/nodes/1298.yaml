  - id: 10344
    user: 618
    date: 2003-09-17T10:50:00
    date_raw: 17 Sep 2003 — 10:50am
    votes: null
    html: "<p>This is marvelous! Roman and italic. <br> <br>Things to look at in the italic: <br> <br>- The \"s\" The pen angle is too flat. <br>- Look for consistency in your modulation. ie the s, e, c -vs- p, m, n. (I'd say thin down the s, e, c etc) <br>- You're poothooks/serifs, could use a bit of thinning. <br> <br>I guess that's the main thing apart from your s. Pick a thin extreme and stick with it! Great stuff. <br> <br>Randy</p>"
    html_clean: "<p>This is marvelous! Roman and italic. <br> <br>Things to look at in the italic: <br> <br>- The \"s\" The pen angle is too flat. <br>- Look for consistency in your modulation. ie the s, e, c -vs- p, m, n. (I'd say thin down the s, e, c etc) <br>- You're poothooks/serifs, could use a bit of thinning. <br> <br>I guess that's the main thing apart from your s. Pick a thin extreme and stick with it! Great stuff. <br> <br>Randy</p>"
  - id: 10345
    user: 1250
    date: 2003-09-17T11:04:00
    date_raw: 17 Sep 2003 — 11:04am
    votes: null
    html: "<p>This is really nice! It dances on the page, but it's a great stylistic match to the roman. The two glyphs that don't seem to work are the \"g\" and \"s\". <br> <br>But there's a problem: in a body of roman it's not standing out enough. You can either increase the slant (although I personally like gentle slants), or make it lighter (slightly), or narrower (first choice), or give it a slightly smaller x-height - or of course a combination of those. <br> <br>Keep it up! <br> <br>hhp <br></p>"
    html_clean: "<p>This is really nice! It dances on the page, but it's a great stylistic match to the roman. The two glyphs that don't seem to work are the \"g\" and \"s\". <br> <br>But there's a problem: in a body of roman it's not standing out enough. You can either increase the slant (although I personally like gentle slants), or make it lighter (slightly), or narrower (first choice), or give it a slightly smaller x-height - or of course a combination of those. <br> <br>Keep it up! <br> <br>hhp <br></p>"
