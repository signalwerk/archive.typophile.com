    date: 2003-09-25T16:47:00
    date_raw: 25 Sep 2003 — 4:47pm
    votes: null
    html: <p>Hi Eduardo. <br> <br>Nice improvements! The color looks more even when printed than it does on screen. I have that same problem. Hinting novice. <br> <br>Hope you don't mind but I took the liberty of doing a quick suggestion for your <b>s</b> in photoshop. In my opinion, you need to take the weight out of the curves and put it into the spine. It matches the other characters in the italic better. In the roman it's ok to have less weight in the spine, more in the curves. Here it looks clunky. Again very quickly done in photoshop. <br> <br>This looks really nice! <br>I'd say you are pretty close. <br> <br>Cheers, <br>Randy <br><img src="http://www.typophile.com/forums/messages/29/16945.gif" alt=""></p>
