    html: "<p>It looks nice, but I think it's too cursive. <br>Some quick comments: <br>- s is wide and dark, and needs more slant; <br>- keep the k's leg aligned to the baseline; <br>- m is narrow; <br>- make a double-storey g; <br>- abdpq are too light comparing to hmn.</p>"
