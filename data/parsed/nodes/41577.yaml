      <p>I agree with the sentiment of other posters that there are many way to misuse the data from studies, and care needs to be taken to not overgeneralize from the results of any study. Our goal shouldn’t be to develop a marketing/advertising literature, but to understand what makes a good (legible, readable, comfortable, pleasant, and engaging) reading experience. </p>
      <p>Peter makes a very interesting point when he points out that the metrics that scientists use like reading speed, comprehension, eye movements, distance threshold, and preference don’t precisely match our intuitive understanding of a good reading experience. And the Sheedy study didn’t detect reading speed or distance threshold differences between the five versions of ClearType, but did find that version 1 had a higher preference with the 10 point text and version 2 had a higher preference with the 12 point text. People are able to see and prefer differences between the ClearType versions, but they didn’t result in measurable performance differences. In several other studies researchers were able to measure both reading speed and preference differences between ClearType and black &amp; white rendering.</p>
      <p>My intuition is that there is a (complicated) relationship between reading performance measures and a good reading experience. Of course I could be wrong. There is much still to be discovered, and new measures likely need to be developed. At ATypI 2006 and in Typo Magazine I talked about one measure we developed looking at affect and measuring the corrugator (frowning) muscle. At ATypI 2007 I talked about research into measuring eye fatigue – this work will hopefully appear in Eye Magazine.</p>
    html_clean: |-
      <p>I agree with the sentiment of other posters that there are many way to misuse the data from studies, and care needs to be taken to not overgeneralize from the results of any study. Our goal shouldn’t be to develop a marketing/advertising literature, but to understand what makes a good (legible, readable, comfortable, pleasant, and engaging) reading experience. </p>
      <p>Peter makes a very interesting point when he points out that the metrics that scientists use like reading speed, comprehension, eye movements, distance threshold, and preference don’t precisely match our intuitive understanding of a good reading experience. And the Sheedy study didn’t detect reading speed or distance threshold differences between the five versions of ClearType, but did find that version 1 had a higher preference with the 10 point text and version 2 had a higher preference with the 12 point text. People are able to see and prefer differences between the ClearType versions, but they didn’t result in measurable performance differences. In several other studies researchers were able to measure both reading speed and preference differences between ClearType and black &amp; white rendering.</p>
      <p>My intuition is that there is a (complicated) relationship between reading performance measures and a good reading experience. Of course I could be wrong. There is much still to be discovered, and new measures likely need to be developed. At ATypI 2006 and in Typo Magazine I talked about one measure we developed looking at affect and measuring the corrugator (frowning) muscle. At ATypI 2007 I talked about research into measuring eye fatigue – this work will hopefully appear in Eye Magazine.</p>
