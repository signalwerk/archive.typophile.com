      <p>Paul, to go back to the begining I wonder if you or the other participants of the Reading seminar are aware that my 2004 Thessaloniki presentation “Lateral Interference, Response Bias, Computation Costs and Cue Value: Perceptual Processing Touchstones for Typedesign and Typography; or Why Strategic Construction, a Well-Motivated Contrast Scheme and ‘Space Craft’ Still Matter," was a direct response to Kevin’s “The Science of Word Recognition?” Both were printed in the Czech design magazine <em>Typo</em> along with papers by Mary Dyson and Hran Papazian.</p>
      <p>Essentially the paper questions the “science” of the “science of word recognition.” and in doing so draws inspiration from Ole Lund’s Reading PhD on legibility studies.</p>
      <p>My focus was and is neither legibility studies <em>per se</em> nor human measures testing, but perceptual processing in reading, that is perceptual mechanics. It is meant to address the typographer or type designer's pre-understanding of what they are manipulating in the context of their making.</p>
