      <p>The article about eye fatigue that I mentioned above was published by Eye Magazine last year. The web version lacks the images, but all the text is there.<br>
      <a href="http://www.eyemagazine.com/opinion.php?id=157&amp;oid=414" title="http://www.eyemagazine.com/opinion.php?id=157&amp;oid=414">http://www.eyemagazine.com/opinion.php?id=157&amp;oid=414</a></p>
      <p>Eye strain caused by poor typography (small text and low contrast in this study) results in a different physical response than eye strain cause by an inability for the eye to properly focus (accommodation and convergence) or eye strain caused by poor transmission of text to retina (glare and astigmatism). For these two poor typography conditions the solution is quite clear: high contrast (black/white) and larger text than is used on the Eye magazine website.</p>
