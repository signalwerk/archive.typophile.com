      <p><em>In German we don’t have separate terms to describe legibility and readability</em></p>
      <p>That's the great think about English, we have terms that split hairs infinitely. I don't think that the comfort i'm referring to here is the same as legibility. I think something can be perfectly legible and may yet be uncomfortable, but I could be wrong. Maybe what I'm interested in boils down to personal preferences, as what is comfortable for one person may not be for another. In relating to CT, I think it's great to have a tuning tool that allows the user to tune the rendering to their greatest degree of comfortable reading. The studies I cited above show that there is not a significant difference in legibility for differing levels of CT adjustment, but they do show that there is a clear preference by users for certain settings over others. It would be interesting to try to find out what unconcsious factors affect making decisions about what type readers find more or less comfortable.<br>
      In regards to the studies written about by Sheedy, they were funded by Microsoft. My understanding is that Microsoft's goal is to make the reading experience of reading on screen as comfortable as reading on paper. The fact is referred to that people often prefer to print out documents rather than to read them on screen. I doubt that printed documents are <em>that much more</em> legible than screen documents. I think this is due to the fact that it's simply more comfortable to read the printed document than the on-screen version.</p>
      <p><em>I guess you haven’t been interested in those threads</em></p>
      <p>I used to read them, but found that they often get bogged down quite rapidly. I guess I should expect the same here.</p>
