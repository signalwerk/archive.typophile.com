      <p>Very strange to make this comment here, but anyway.</p>
      <p><cite> I have heard talk of studies that are looking at the effects of patterns created by type and certain patterns actually creating discomfort, even at the level of causing stress and fits in the reader. </cite></p>
      <p>The main research in this area is from Arnold Wilkins, from the University of Essex. He has identified a narrow range of frequencies which cause discomfort (or may trigger worse effects, such as epileptic fits). The periodicity he has identified can be seen in any modulated image: from a floor pattern to a painting; of course, typeset text was a prime candidate to look into. He has had some interesting results, well worth looking into.  </p>
      <p>Oh, and he was in the Department last week: we are looking to test the effect across scripts, and we have some ideas about the contribution of counter shapes to the onset of visual stress or its absence. </p>
      <p>See you tomorrow!</p>
