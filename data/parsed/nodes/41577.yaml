      <p><em>but her reading comprehension a couple of years less so</em></p>
      <p>Did you ask them to define what they meant by comprehension? I presume they are linking comprehension to vocabulary, so if someone doesn't know the meaning of a word they are judged not to comprehend the text even though they may have a perfectly sound grammatical comprehension, i.e. they understand the structure of the thoughts but not all the content. That's fair, but vocabulary is something that facilitates reading comprehension: it is a resource that is used during reading, rather than being something intrinsic to reading as an activity (it is also used during speaking, writing, and a good deal of thinking).</p>
