      <p>There is only one crucial measure of readability, and that is comprehension. All other measures -- speed, comfort, pleasure -- are meaningful only relative to comprehension, because if one hasn't taken in what the text contains (which is not necessarily the same thing as understanding the text, which depending on the nature of the text may take years) then everything else is worthless. We read in order to comprehend text; everything else -- the pleasure or pain the text gives us, the things we do with the information therein -- is secondary. One can go further: comprehension is reading, reading is comprehension. If you read without comprehending, you are not really reading, you are just going through the mechanics, when what matters is the result. Most discussion of readability focuses on the mechanics, rather than on the result.</p>
      <p>I want people to be able to read comfortably because, as Peter says, comfort is a human need. So in other words I want people to comprehend text while in a comfortable state. There are other human needs that can be typographically addessed: aesthetic pleasure, cultural connectivity, a sense of both history and progress. Unfortunately, the most common experimental measure, relative to comprehension, is none of these things, it is speed. Capital makes speed a virtue, because 'time is money'. But speed is not a human need.</p>
