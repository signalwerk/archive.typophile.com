      <p>Paul, I think things become bogged down because we assume that everyone has a basic undestanding of what legibility and readibility are. And to a great extent we do. When we cannot read something because of how the characters are formed we say the writing is illegible, and when we cannot navigate a text because of how it is set or layed out we say the text is unreadable. </p>
      <p>The problem arises when science introduces measures — like frequency of regressive saccades, or reading speed — to precisely gauge these largely lived-experiential matters. Science tends to use metrics that don't fully encapsulate the reality it tries to investigate.</p>
      <p>The solution is to not generalize data about small differences in the frequency of regressive saccades or small differences in words per minute to bald statements about large issues. That a serif type performs better than a sans across a wider range of trackings is not necessarily a statement about relative legibility. It might just mean that sans serif types are more sensitive to bad spacing.</p>
      <p>You ask about the importance of comfort relative to legibility. To me they are countervailing pressures. Legibility is a basic requirement, so should be fully understood. Comfort a human need that promotes the engagement a text seeks.</p>
