      <p><em>the results of typography’s affect on comprehension and retention.</em></p>
      <p>Right Steve, retention is the concept.</p>
      <p>Related to that is re-reading.<br>
      I often reread text, for varying reasons. It could be a software manual, and that makes it painful. However, I'll also reread a passage that explains a new idea perfectly with a clever turn of phrase, just to enjoy the writing. I read several parts of <a href="http://www.alistapart.com/articles/understandingwebdesign" rel="nofollow">Understanding Web Design</a> by Jeffry Zeldman more than once, especially the section <em>The Sustainable Circle of Self-Respect,</em> man that guy can write, and I share his sentiments. If you find writing that puts your own thoughts or feelings into words, the clarity is worth wondering at. At the other end of the spectrum, I'll usually skip bits of novels I find boring. When reading <em>The Curious Incident of the Dog in the Night-time,</em> a novel written in the person of an autistic child with a penchant for maths, I must confess I didn't read a single one of the paragraphs containing mathematical formulae, which the author had tried so hard to integrate into the story.</p>
