    html: <p>Eben, do you really think we need a crutch? It seems to me that, as a species, we've been making language visible and reading it for many centuries now, and if anything we've demonstrated extraordinary facility at it. When you consider the range of linguistic systems, writing systems, spelling systems, and the range of shape sets and styles within which humans read effectively and comfortably, the idea that we <em>need</em> reading science to help us seems perverse. I am very interested in reading science, but I don't really expect it to be practically useful to typeface design. I think it might be able to explain the <em>why</em> of some things, which interests me, and one of the things I would like it to explain is that extraordinary facility with which humans read. That's worth knowing because it would tell us something about what we are. I'm not sure that it is worth knowing that test subjects read X typeface fractionally faster than Y typeface in document setting A. If I think about everything that makes typography compelling, delightful, significant, that kind of information barely registers. Indeed, the factors that might influence a typographer to use typeface Y instead of typeface X, despite the demonstrated readability advantage of the latter, are all more interesting than that advantage.</p>
