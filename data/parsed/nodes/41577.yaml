      <p>In my understanding "readabilty" and "reading comfort" are the same thing.<br>
      In German we don't have separate terms to describe legibility and readability, so I use "Lesekomfort" (reading comfort) to translate the word "readability".</p>
      <p>So with reading speed you directly measure the comfort. It's not like you could read something fast, but feel uncomfortable doing it. It's because of the comfort that you can read it fast.</p>
