      <p><em>there is a greyscale rendering of Verdana as well in the same graphic i mentioned above, i don’t think the PDF article reproduced the distinction well enough in the illustration, but maybe it’d different in print?</em></p>
      <p>The text being tested in this Sheedy article are five different forms of ClearType. ClearType figures out which sub-pixels should be turned on ignoring color, and then tries to diffuse the perception of color. The different forms are using different degrees of color filtering. At one extreme is nearly unfiltered text, which is very sharp, but very colorful. At the other extreme is a grayscale, which has no color but is less sharp. This is not a traditional grayscale as it doesn’t use a box filter, but a rectangular filter. The default form of ClearType that we’ve been using is the middle selection of the five options. </p>
      <p>Unfortunately it’s very difficult to show these differences in print as they are dependent on LCD subpixels. The best way to see the differences between these text samples is onscreen using MS Reader. Three of these options are now available as tuning preferences in WPF.</p>
      <p>Cheers, Kevin</p>
