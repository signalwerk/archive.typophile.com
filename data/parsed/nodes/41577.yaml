      <p>I agree with you Paul. Too often, readability threads get into pißing contests that become more about opinion clashes of the posters than just helpful discussion.<br>
      I think that reading comfort, as you describe it, is different than the typically cited number of eye movement regressions definition of readability. What Paul is talking about is more the social science way of seeing preference of reading rather than the physiology measure of eye movements. That is not to say that there may be some degree of correlation between the two. What the correlation means, however, is still a matter of opinion. For me, there is great value in examining the user preference angle. I do feel it is a moving target by demographics or specific intended audience. My mother's type preference is not the same as my daughters no matter what the Larson studies say.</p>
      <p>ChrisL</p>
