      <p>Comprehension, yes.<br>
      And beyond that, will it change your life?</p>
      <p>Colin Weildon's research, which, as he's an ad man, is in a somewhat different league than Kevin Larson's, asked readers questions about facts buried in the text, to see which type layouts work best. Sans vs. serif, that sort of thing. The goal was to find out what best gets readers deep enough into the text to respond to the "call to action" in an advertisement, which appears well into the copy, if not at the end, urging them to call now or clip the coupon.</p>
      <p>The sense in which a comprehension of advertising copy may become actionable is similar to whether the ideas in a novel "stick" with the reader, because it's one thing to comprehend the grammar, another to get what writer is saying, something else to be moved by the writing, and something else again to read words that change your life -- whether it's buying something new or changing your political viewpoint.</p>
      <p>Type can do all that.</p>
