      <p>I think that reading comfort is important because it breaking through a readers comfort zones can be a great way to manipulate them. For example, if the <em>Harry Potter</em> novels had been set in Eureka Serif and not whatever traditional Aldine they were set in, it would have fought against the warm fuzzies feelings Rowling uses to pull readers into her story. But in books that come at a reader from a deeper or more radical perspective, it can be useful to deliberately use something unexpected; good examples would be Octavia Butler’s novel <em>Parable of the Talents</em> and Warren Ellis’ <em>Crooked Little Vein</em>, both set in modern faces (Didones IIRC) that keep the reader from settling in effortlessly. Of course one has to be careful not to go too far; I’ve gone through a book about the Bauhaus set entirely in Futura and wanted to kill the designer by the end.</p>
      <p>This approach is not limited to books, of course. If a signmaker passes over Arial/Helvetica for Meta, the most generic sign suddenly becomes a lot more eyecatching, especially if there’s a <strong>g</strong> in there somewhere. The NYT article on ClearviewHWY noted that ATT became much more successful at spreading its message after a switch to ClearviewHWY. At the Dallas/Fort Worth airport I noticed people staring at the letters in the signage, just taking in how good whatever typeface it was really looked; good luck pulling that off with Helvetica.</p>
      <p>At the end of the day it all comes down to remembering to break Typographic rules now and then.</p>
