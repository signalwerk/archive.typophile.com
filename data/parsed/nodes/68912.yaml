      <p>OK, I looked for an N with a slight curve to the legs and I think this may be <a class="freelinking external" href="http://new.myfonts.com/fonts/fontbureau/fb-californian/">Californian</a> (a.k.a. Berkeley Old Style). Goudy was famous for having odd details in his typefaces, partly because he cut his own masters.</p>
      <p>- Mike Yanega</p>
