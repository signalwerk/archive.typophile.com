    html: <p>Aha! I may be mistaken in my memory of the King's type, and might be confusing it with another experiment of the same period. I've tracked down an illustration of a type by Ricketts that may, in fact, be the King's type, and it is not as I remembered it. It is still pretty horrid, but does not display the bloated x-height and truncated extenders that I must be remembering from something else. Unfortunately, the illustration is not captioned, so I can't be absolutely certain that this is the King's type, but it makes sense in the context of Dwiggin's comments. Also, the title of the work is The Kingis Quair. <br> <br><img src="http://www.typophile.com/forums/messages/30/7323.jpg" alt="The King's Fount?"> <br> <br>Additionally, I found mention online that the King's Fount is shown in Goudy's <i>Typologia</i>, but I don't have my copy handy.</p>
