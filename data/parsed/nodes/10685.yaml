    html: <p>Tiffany, <i>Book Fancier</i> is a Dwiggins text that, as far as I know, was never published. It was probably never completed. It comprised a series of essays on the various elements of a book. I have a copy of the section on Design, which was used in the first setup proof of Eldorado. I've seen little bits from the section on Paper that were used in some test proofs of the second Falcon.  <br> <br>I'd never come across this section on Type. This looks like it's an early draft (and seriously in need of an editor). Too bad you don't have a note on where you found it. I'm going to guess this was written sometime around 1942-44.  <br> <br>The rest of this manuscript has been on my list of things to track down next time I can make it over to the collection in Boston. <br> <br>-- K. <br></p>
