    html: <p>Matha -- <br> <br>The only reproductions of the other uncial experiments that I'm aware of are two small photos in <i>American Proprietary Typefaces</i> published by the APHA (American Printing History Association). These images accompany John Kristensen's essay "The Experimental Types of W.A. Dwiggins." John runs the Firefly Press in Somerville and knew Dorothy Abbe. The extant materials pertaining to the uncials are in the Dwiggins Collection at the Boston Public Library. <br> <br>Tiffany -- the 264 and 264a materials are cataloged with the Winchester stuff, Folio Box N; the proofs that John reproduced are from folders 29 &amp; 30, I think, in case that helps you find anything in your collection. <br> <br>-- K. <br></p>
