    html: <p>The M-formula as laid out in the document of July 3, 1937, is a typically engaging expression of WAD's ideas along these lines; but it was not a sudden epiphany on Dwiggins part. Neither was it formulated specifically in relation to newspaper designs, as one might infer from Unger's article. I have evidence of at least two earlier documents outlining some of the same ideas -- although neither of these specifically mentions marionettes. One of these, in fact, from February of the same year, is essentially a proto-M-formula. I haven't tracked down the drawings to see whether he put these ideas into practice before the July document. The application of the theory to small, newspaper types came about a year later. <br> <br>My point is that the M-formula is a culmination of thinking that WAD had been doing in this direction for about two years. <br> <br>-- K. <br></p>
    html_clean: <p>The M-formula as laid out in the document of July 3, 1937, is a typically engaging expression of WAD's ideas along these lines; but it was not a sudden epiphany on Dwiggins part. Neither was it formulated specifically in relation to newspaper designs, as one might infer from Unger's article. I have evidence of at least two earlier documents outlining some of the same ideas -- although neither of these specifically mentions marionettes. One of these, in fact, from February of the same year, is essentially a proto-M-formula. I haven't tracked down the drawings to see whether he put these ideas into practice before the July document. The application of the theory to small, newspaper types came about a year later. <br> <br>My point is that the M-formula is a culmination of thinking that WAD had been doing in this direction for about two years. <br> <br>-- K. <br></p>
