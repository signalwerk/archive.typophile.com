    html: "<p>J-F -- I also have a problem with the H, among other things. Here is something Dwiggins said at one point (this was in reference to the earlier uncial 264a, but he always did this H):  <br> <br>\"Damned interesting to see how easily you can take it, you swallow the D, B and G without thinking. P not bad -- better if the tail were longer. H is the only one that stops you -- and you'd get used to that.\" <br> <br>I don't happen to agree, but I thought it was interesting to see his thought on the matter. (This quote is taken from John Kristensen's essay; he didn't give a specific citation for the source.) <br> <br>-- K. <br></p>"
