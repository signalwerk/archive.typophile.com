    html: <p>With the idea of "where does intuition start and logic end" in regards to type design. I found this little ditty in my notes as well. Shame on me for not having a date attached. Maybe Kent can help with this one? I'm pretty sure Dwiggins wrote it though. Hmmm...  <br>  <br>-----  <br>  <br>Book Fancier  <br>-- Type  <br>  <br>Obviously, there is no reason for writing a thing if the <br>words are made up of characters that cannot be  <br>deciphered. A letter is good if it is easy to read. No  <br>concession that interferes with ease of reading can be  <br>made either to beauty or to mechanical felicity.   <br>  <br>Legibility is the first law.  <br>  <br>The tests of legibility are use and survival. Laws governing  <br>legibility may be deduced from a study of the characters  <br>that have survived. Or may be evolved by experiment in the  <br>laboratory. Knowledge from either source is deservable.  <br>  <br>Legibility being granted the question of excellence passes  <br>into the domain of art. It happens in the case of  <br>letterforms--that artisitic excellence and art are never very  <br>far apart. If a letter is well made in the true sense it is both  <br>a beautiful design and a legible sign.  <br>  <br>The quality of good proportion</p>
