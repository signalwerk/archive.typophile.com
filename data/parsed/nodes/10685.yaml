    html: <p>Yes, I've seen the King's Fount, but I don't recall in what books it is shown (perhaps the brilliant and eclectic <i> Typographical Printing Surfaces</i>?). I think I recall Matthew Carter showing it in his talk on experimental type design at ATypI 94 in San Francisco. It is truly hideous, and also very difficult to read due to the almost complete absence of extenders. Basically, Ricketts took the view that all legibility was in the x-height ergo one could dispense with ascenders and descenders. It is, perhaps, an object lesson in the importance of the distinction between legibility and readability.</p>
