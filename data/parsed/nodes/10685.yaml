    html: <p>Wow, Tiffany, thanks for sharing all that. <br> <br>&gt;&gt; "The gouts and agglomerations of tails give a jagged and stuttering look to the page <br> <br>On the other hand, readability is all about <i>contrast</i>. Otherwise we'd read all-caps better. Conscious deliberative appreciation of the page is not strongly correlated to subconscious immersive reading. <br> <br>&gt;&gt; "it would take our habit of reading roman as a starting point .... <br> <br>Now that's the way to do it! <br> <br>(And Kent, I'm touched... :-) <br> <br>&gt; maybe we are moving into an anglo-american world <br> <br>Yes. And it's about the same as Benito's and Hitler's version... <br> <br>&gt; Peignot style H will be better? <br> <br>Huh, that's exactly what I was thinking! <br> <br>&gt; intimately and daily involved in the making of both marionettes and type <br> <br>What I see different here is that WAD was not in fact intimately involved in the making of <i>very small</i> type (where my "subvisible" came from), at least at that point - that's why the connection he made seems so impressive. <br> <br>-- <br> <br>BTW, maybe "illogical" was the wrong idea. But he was still wrong about extenders, and he had enough information that he didn't need to be - it's just a matter of looking for it. Something lacking even more today! So maybe in comparison to us WAD <i>was</i> more analytical after all...  :-/ <br> <br>hhp <br></p>
