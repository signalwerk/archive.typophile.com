  html: <p>I think I prefer the italic. It works a tiny bit better. In both the italic and the Roman the 'h' keeps jumping out at me (same as in the nasty 'Dwiggins Uncial thing'). He could have used a 'h' with an ascender. Not many words in English with 'h' and 'l' next to each other. It wouldn't have messed up his plans too much.  <br>The 'f' and the 'g' are wonderful.  <br>In terms of readability, though, I don't know. But then I'm not a very logical person and I don't like tomatoes. <br> <br>M.</p>
