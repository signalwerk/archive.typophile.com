    html: <p>To get back to Dwiggins and logic/intuition (after a very short nap). I think the most serious attack we can make on him in relation to the above experiment concerns the serious anachronism inherent in his perception of the Irish-English/semi-uncial as an essentially 'English' letter. I'm wondering what the level of scholarship was like on that sort of thing in the 1940s? What sources might he have been using? <br> <br>In the 8th and 9th centuries the 'English' he's talking about didn't exist yet. Letter frequency statistic are completely different for Old English and Modern English, so his theory about the suitability of semi-uncial is way off. On top of that, the letter forms he's talking about were developed for use in Latin texts and not English (or even Irish). <br> <br>But I love it anyway. To hell with logic. <br> <br>Matha.</p>
