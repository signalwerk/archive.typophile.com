    html: "<p>Hrant: <i>Making the connection from wooden figurines to subvisible type is all about intuition.</i> <br> <br>Okay, we have different definitions of intuition. In the case of the M-formula, I see a purely logical path, based on observation and experience, from the marionette to the typeface, as explained by Dwiggins in his own words. If this connection had been made by someone with only a passing knowledge of either marionette or type making, then I'd ascribe it to intuition. In the case of someone like Dwiggins, who was intimately and daily involved in the making of both marionettes and type, the connection might even seem to be an obvious one. Perhaps the lesson in this is that type designers benefit from having other hobbies. <br> <br>Re. Dwiggins uncial: one of its bastard children has to be 'FF Disturbance', even though I'm pretty sure that Jeremy Tankard had never seen Dwiggin's original when he designed Disturbance.</p>"
    html_clean: "<p>Hrant: <i>Making the connection from wooden figurines to subvisible type is all about intuition.</i> <br> <br>Okay, we have different definitions of intuition. In the case of the M-formula, I see a purely logical path, based on observation and experience, from the marionette to the typeface, as explained by Dwiggins in his own words. If this connection had been made by someone with only a passing knowledge of either marionette or type making, then I'd ascribe it to intuition. In the case of someone like Dwiggins, who was intimately and daily involved in the making of both marionettes and type, the connection might even seem to be an obvious one. Perhaps the lesson in this is that type designers benefit from having other hobbies. <br> <br>Re. Dwiggins uncial: one of its bastard children has to be 'FF Disturbance', even though I'm pretty sure that Jeremy Tankard had never seen Dwiggin's original when he designed Disturbance.</p>"
