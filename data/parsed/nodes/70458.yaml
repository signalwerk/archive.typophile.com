  html: |-
    <p>Shakespeare says in Sonnet 77:</p>
    <p>Look what thy memory cannot contain,<br>
    Commit to these waste blacks, and thou shalt find<br>
    Those children nursed, delivered from thy brain,<br>
    To take a new acquaintance of thy mind.</p>
    <p>Is there a typographical meaning to "waste blacks"?</p>
