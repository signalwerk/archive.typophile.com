    date: 2007-07-10T14:54:00
    date_raw: 10 Jul 2007 — 2:54pm
    votes: null
    html: "<p>Thinking aboyt your question some more I would have to say no - there isn't just one best way to set it or to design it. The # varies quite a bit from font to font. Some of the best designed ones vary a great deal from each other &amp; make sense in the context of the font they are in. But that also brings me back to my earlier question. Some fonts don't have such a wonderful # sign. And if you are using one you might be tempted to poke at it. But In general I would suggest using a font whose glyph set works, even the #. Then you don't have to muck around... Does this make sense to you?</p>"
