    html: |-
      <p>In the 'NUMBER SIGN' (U+0023, #), the "horizontal" lines are usually perfectly or nearly-perfectly horizontal while the "vertical" lines are slightly slanted forwards. The symbol is usually as wide as the figures or the currency symbols, and the lines are typically of equal thickness even in a typeface that has a modulated stroke: </p>
      <p><a href="http://www.unicode.org/charts/PDF/U0000.pdf" title="http://www.unicode.org/charts/PDF/U0000.pdf">http://www.unicode.org/charts/PDF/U0000.pdf</a></p>
      <p>In the 'MUSIC SHARP SIGN' (U+266F, ♯), the "vertical" lines are usually perfectly vertical and the "horizontal" lines are slanted upwards. The symbol is often narrower than the number sign, and the horizontal lines are usually thicker than the verticals. </p>
      <p><a href="http://www.unicode.org/charts/PDF/U2600.pdf" title="http://www.unicode.org/charts/PDF/U2600.pdf">http://www.unicode.org/charts/PDF/U2600.pdf</a></p>
      <p>A.</p>
