    html: |-
      <p>Funny - when I think of a number sign in use for display type - shrunken and superscript is all I can think of.</p>
      <p>I think of #1 BESTSELLER for say, a Tom Clancy book - and it is always prominent on the cover, uptop and center. Then the words like <em> The New York Time s</em> Bestseller - normally in all caps is divided among the oversized 1 </p>
      <p>I can't begin to tell you how many times as a typesetter it was set that way....</p>
      <p>In text, I just go with the # sign of the font I'm in, however, trouble in today's type - the number sign is made as a full character, and we are getting very use to seeing it as #1 and don't think twice about it -- and so many think inch marks are quote marks and foot marks are apostrophies....</p>
      <p>Don't get me started...</p>
