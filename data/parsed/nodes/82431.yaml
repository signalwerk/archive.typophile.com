    html: "<p>I think phone numbers can work well in osf, but it is a matter of preference. If the osfs are too far off from the lining figs they have a tendency to draw attention to themselves. In any case, I wouldn't give up on Swedish faces: Fountaintype have some alternatives.</p>"
