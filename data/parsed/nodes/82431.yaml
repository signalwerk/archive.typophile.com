  html: |-
    <p>Hi,</p>
    <p>I'm designing a business card for myself and I've come to a crossroads regarding priorities.<br>
    For my phone-number I'm unsure whether or not I should use Berling Antikva, which comes from my home-country Sweden or if I should choose a face with titling numerals, like Adobe Garamond Pro.</p>
    <p>I was curious to see the general consensus here on Typophile, what would be more important to you personally?</p>
    <p>For reference here is Berling: <a href="http://www.identifont.com/samples/ef/Berling.gif" title="http://www.identifont.com/samples/ef/Berling.gif">http://www.identifont.com/samples/ef/Berling.gif</a><br>
    And Adobe Garamond Pro: <a href="http://www.prepressure.com/images/dict_old_style_numerals.png" title="http://www.prepressure.com/images/dict_old_style_numerals.png">http://www.prepressure.com/images/dict_old_style_numerals.png</a></p>
