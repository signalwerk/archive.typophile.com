    <p>Hi everybody,<br>
    Im a brand new user and Im completing a week of work experience at Emerystudio, this morning I was given a student brief to design a logo for an apartment development and I went a little of the track and design a new typeface from some pen doodles that i did when I was bored,<br>
    this is the first version, all done in Illustrator, Id love some feedback so that I can develop it in font lab and use it for a 3rd folio piece ( Im studying Visual Communication at MONASH)</p>
    <p>sorry for the image low quality</p>
    <p>Thanks!</p>
    <p>melanie yencken</p><div class="imageWrap"><img src="http://typophile.com/files/111Barkly-linefont_6434.jpg"></div><p></p>
