      <p>I like this - it's a good idea for an apartment development, it has an architectural quality that also puts me in mind of Piet Mondrian. I could envisage that on the side of a building in sheet steel of maybe 1 cm thick by 15 cm deep.</p>
      <p>With a bit of refinement here and there it would look great. Make the n, u and y the same width as the b, d, g, o, p, and q. I'm sure you can sort the rest yourself.</p>
      <p>Nick Cooke</p>
