    html: |-
      <p>This is interesting. It has potential for some cool alternate characters, not to mention the ligature possibilities. Also, a lower case 'w' has to have a center stroke that partially meets the x-height in order to look balanced, same goes for an uppercase 'W'. On some rare occasions this not true. </p>
      <p>I understand that this is a mock up, but with such a simple approach to a typeface, i.e. grid bound, you have to follow the rules of the grid and create characters with consistent themes and "color". Some of the most simple typefaces are the most meticulous. Look at Wim Crouwel's faces for example. </p>
      <p>Lastly, I would try making the diagonal strokes on the 'k, v, w &amp; x' meet flush with the x-height, that is have them be squared off on the ends.</p>
      <p>Great Job, looks cool.</p>
