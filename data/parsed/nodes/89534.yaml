      <p>Pretty sure this was designed for the magazine, but look at some of the Bodoni or Didot fonts, and imagine slanting the Roman, because the italic 's' usually has ball terminals. I thought obliquing RR <a href="http://new.myfonts.com/fonts/redrooster/bodoni-rr-campanile/" rel="nofollow">Bodoni Campanile</a>, for example, might be close. </p>
      <p>- Mike Yanega</p>
