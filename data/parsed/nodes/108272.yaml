      <p>There is a font out there called Firenze Normal that has your 'I' exactly , albeit upside down. Unfortunately, it does not contain an X or Y.</p>
      <p>It has no internal copyright and I didn't find it on any reputable download site - so I'm not linking to it.</p>
  - id: 569438
    user_id: 205259
    user_name: donshottype
    user_path: null
    user_image: /files/pictures/picture-205259.jpg
    date_raw: 16 Jan 2014 — 11:46am
    date: 2014-01-16T11:46:00
    votes: null
    html: |-
      <p>Hi Mike, the Firenze initials that I found -- presumably the same as your copy -- consist of auto-traced images, with little if any editing and the date 1998. The auto-tracing is fairly accurate, as these things go, but I suspect that this is the work of an amateur font enthusiast. As to what it can be used for, this is a very grey legal area. Neither a copyright claim nor an open font license.<br>
      Don</p>
