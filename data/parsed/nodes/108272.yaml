      <p>The initials might not be digitized. As a somewhat similar substitute from the same general era you might consider the Cloister Initials designed by Frederic W. Goudy.<br>
      LTC Goudy Initials from Lanston Type Company:<br>
      <a href="http://www.myfonts.com/fonts/lanston/ltc-goudy-initials/" title="http://www.myfonts.com/fonts/lanston/ltc-goudy-initials/">http://www.myfonts.com/fonts/lanston/ltc-goudy-initials/</a><br>
      Cloister Initials from Group Type:<br>
      <a href="http://www.myfonts.com/fonts/grouptype/cloister-initials/" title="http://www.myfonts.com/fonts/grouptype/cloister-initials/">http://www.myfonts.com/fonts/grouptype/cloister-initials/</a><br>
      Also perhaps Fleur Corner Caps by House of Lime:<br>
      <a href="http://www.dafont.com/fleur-corner-caps.font?fpp=100" title="http://www.dafont.com/fleur-corner-caps.font?fpp=100">http://www.dafont.com/fleur-corner-caps.font?fpp=100</a><br>
      Don</p>
