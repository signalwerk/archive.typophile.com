    votes: null
    html: |-
      <p>Luc Devroye has a relevant page:<br>
      <a href="http://luc.devroye.org/fonts-52964.html" title="http://luc.devroye.org/fonts-52964.html">http://luc.devroye.org/fonts-52964.html</a><br>
      It includes a link to digital fonts created by Dick Pape based on images in books, which AFAIK does not violate most IP laws, where there is no design patent in force. Dick Pape created Florentine Initials.ttf, full alphabet, based on images in a Clarence Hornung book that reproduced the 19th century letters.<br>
      <a href="http://luc.devroye.org/pape/Dover%20Publications/Dover%20Publications,%20Clarence%20P%20Hornung/" title="http://luc.devroye.org/pape/Dover%20Publications/Dover%20Publications,%20Clarence%20P%20Hornung/">http://luc.devroye.org/pape/Dover%20Publications/Dover%20Publications,%2...</a><br>
      Auto-scan of similar quality to the Firenze initials by anonymous.<br>
      Don</p>
