    html: |-
      <p>Letter I from Florentine Initials by M. Huttler, Konrad Fisher of Munich as shown in Petzendorfer's Schriften Atlas of 1898.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/FlorentineInitialsByMHuttlerKonradFisherMunich@PetzendorferSchriftenAtlas1898_5798.jpg"></div><br>
      Petzendorfer does not include J, X and Y.<p></p>
