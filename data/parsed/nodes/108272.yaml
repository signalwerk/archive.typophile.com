      <p>For 'INTERIORS' and 'EXTERIORS', have a look to Paul Renner's <a class="freelinking external" href="http://myfonts.us/td-KIy06h" rel="nofollow">Futura</a>.<br>
      I like also <a class="freelinking external" href="http://marketplace.veer.com/font/Silver-Thread-JBT0000108" rel="nofollow">Silver Thread</a>, a digitization of <a class="freelinking external" href="http://e-daylight.jp/design/fonts/type/l/lc-hairline.html" rel="nofollow">L&amp;C Hairline</a>.</p>
