      <p>A short legal note:</p>
      <p>1) Trademark</p>
      <p>The trademark "DIN" was registered at the German Patent Office in 1920.</p>
      <p>See the website <a href="http://www.din.de" title="http://www.din.de">http://www.din.de</a>, where this is said in German: <cite>"1920 DIN wird als eingetragener Verein beim Amtsgericht Berlin gemeldet. Geschäftsstelle ist in der Sommerstraße 4a. Das DIN-Zeichen wird als Warenzeichen beim Patentamt registriert."</cite></p>
      <p>2) Design</p>
      <p>The design of the DIN typeface is older than 25 years. Therefore according to the German design ("Geschmacksmuster") law this typeface design is already in public domain.</p>
      <p>I will not be surprised, when I learn that another ripoff foundry grabs Linotype's clone and sells it as "DIN Ultra-Next".</p>
      <p>By the way:</p>
      <p>Fontshop tried to grab the trademark "DIN", but did not succeed:</p>
      <p>see <a href="http://www.sanskritweb.net/temporary/FF-DIN-1.jpg" title="www.sanskritweb.net/temporary/FF-DIN-1.jpg">www.sanskritweb.net/temporary/FF-DIN-1.jpg</a></p>
      <p>and <a href="http://www.sanskritweb.net/temporary/FF-DIN-2.pdf" title="www.sanskritweb.net/temporary/FF-DIN-2.pdf">www.sanskritweb.net/temporary/FF-DIN-2.pdf</a></p>
      <p>The above German legal gibberish means that the illegal Fontshop registration of the trademark "DIN" was annulled by the registration office.</p>
