      <p>I was wondering whether it would be problematic to have more than one "standard".<br>
      But the round style here throws some light on that issue.<br>
      DIN Round is actually very appropriate to several of the original uses of the typeface--where it was "output" by Rapidograph pen (in technical drawings) or router (e.g. signs "engraved" in plastic laminate or stainless steel).<br>
      So the variety of styles does not really create more than one standard, it merely represents a single standard as it would appear in different media.<br>
      Equally legitimate would be a crude "brush" version of the face, as rendered by a clumsy artisan...</p>
