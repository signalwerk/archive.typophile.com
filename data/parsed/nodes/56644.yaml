      <p>As i was the one who asked Albert "Din" Pool to design FF DIN back in 1995, i need to explain my reasons:<br>
      I had noticed a trend to use apocryphal typefaces, i.e. those that don't have a designer in the real sense. DIN was designed by a committee of engineers, first in the 20s, and then again a few times over the years. In the early 60s, Günter Gerhard Lange from Berthold sat on the DIN committee and was responsible for bringing a little more real design into the very technical drawings that had been executed using t-squares and compass only. You can see the Berthold influence in the S and a few other characters, which owe a lot to Akzidenz Grotesk, itself a kind of standard in Germany at the time (and sold as Standard in the US).</p>
      <p>The DIN Mittelschrift as released by Adobe/Linotype was a digital version of these rigid engineering drawings. Albert's brief was to take the regular weight and subtly make it a good typeface. He did it so well that it looks exactly like the original, but much better, especially in smaller sizes. Albert also added weights, and that not only made the face usable for designers, but also showed that he is a very good type designer. FF DIN looks as if DIN had always had those weights because Albert didn't let his ego interfere with the job. The new "old" design answered the need for a neutral "undesigned" typeface and has since become a favourite of designers around the world, even in places where nobody connects it with the signs on the German Autobahn.</p>
      <p>Akira took a different approach because Albert's interpretation of the original in the public domain could not be improved. He didn't set out to improve the original, but designed his own interpretation. There is no reason why designers shouldn't use one as well as the other – they're different enough.</p>
    html_clean: |-
