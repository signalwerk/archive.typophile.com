    html: <p>I second what BJ said. "Beverly Hillbillies" is a trademark, so using that might be a problem. But the names of characters on the show are not trademarked; additionally, they are generic, common surnames. <br> <br>Besides, look how many unrelated movies and TV shows have the same titles. <br> <br>Paul</p>
