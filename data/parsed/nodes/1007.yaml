    html: <p>I'd disagree. You <i>can</i> use the names for fonts  <br>(Drysdale, etc.) provided no existing trademark  <br>exists in a similar trade channel. However, you can't <br>use "Beverly Hillbillies" Font Pak or something because  <br>BH is a registered trademark in various classes <br>and they'd get you for diluting the mark. <br> <br> <br> <br>bj</p>
