  html: "<p>I am currently working on four fonts under the working titles Clampett, Bodine, Drysdale and Hathaway. Now, anyone familiar with 60s TV kitsch will recognize from <a href=\"http://www.timvp.com/beverlyh.html\" target=\"_blank\"> whence</a> they came. <br> <br>If I were to market these together in a package, does anyone foresee a phone call from the CBS legal department in my future? <br> <br>If so, I'd rather avoid such a headache and simply re-name the fonts. <br> <br>On a side note: Has anyone here ever named and released a font only to discover that name in use by another font? <br> <br></p>"
  html_clean: "<p>I am currently working on four fonts under the working titles Clampett, Bodine, Drysdale and Hathaway. Now, anyone familiar with 60s TV kitsch will recognize from <a href=\"http://www.timvp.com/beverlyh.html\" target=\"_blank\" class=\"link-external\"> whence</a> they came. <br> <br>If I were to market these together in a package, does anyone foresee a phone call from the CBS legal department in my future? <br> <br>If so, I'd rather avoid such a headache and simply re-name the fonts. <br> <br>On a side note: Has anyone here ever named and released a font only to discover that name in use by another font? <br> <br></p>"
