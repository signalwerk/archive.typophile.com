    votes: null
    html: |-
      <p>There is even a feature for this, 'ital', yet I have not heard of applications which support this feature if present in Latin-script fonts -- afaik Adobe defined it with CJK fonts in mind. So you would need to offer the same behavior in an 'ssXX' feature too, at least.<br>
      I consider it as a convenient way for fonts whose italic lowercase are accompanied by upright uppercase, and have used it for both Litteratra and the OpenType version of df Rialto.<br>
      Since not all applications support OpenType layout tables, it makes sense to provide a separate italic font too ...</p>
