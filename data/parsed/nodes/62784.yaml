    html: |-
      <p>Karsten: <em>afaik Adobe defined it with CJK fonts in mind</em></p>
      <p>Yes. It enables one to build an East Asian font with a relatively small Latin subset, for e.g. Japanese Romaji, without needing to duplicate the entire Asian glyph set in multiple fonts for different styles of Latin letters. The 'ital' feature is, I believe, supported in the Asian versions of Adobe applications.</p>
      <p>I would say this feature is not only East Asian-specific but also CFF-specific. It solves a problem that, in TrueType, would be solved by making a TrueType Collection (TTC) font.</p>
