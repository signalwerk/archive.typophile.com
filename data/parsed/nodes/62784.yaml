  html: <p>How do you go about using stylistic alternatives to swap out the entire font for italics in a single file? Is this even a good idea?</p>
  html_clean: <p>How do you go about using stylistic alternatives to swap out the entire font for italics in a single file? Is this even a good idea?</p>
comments:
  - id: 371458
    user: 29994
    date: 2009-10-06T12:40:00
    date_raw: 6 Oct 2009 — 12:40pm
    votes: null
    html: <p>It is possible (just swap each and every character), but it does not sound like a good idea. Your poor users won't be able to select italic the usual way, only with using software that support stylistic sets. Changing some text containing italics in another font to yours won't change the italics to yours. And the italics variant will not show up in any font menu.</p>
