  html: |-
    <p>Dear fellow typophiles,</p>
    <p>I've just made my font <em>Hexa</em> freely available on my <a href="http://www.behance.net/gallery/Hexa-(free-font)/2759421" rel="nofollow">site</a> and you're all very welcome to try it if you like. I'll be grateful if you let me know what you think and send me a sample, should you use it for something.</p>
    <p>A Happy New Year to all of you<br>
    &amp; best regards from Budapest,<br>
    Akos</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/09_resize_5442.jpg"></div><p></p>
