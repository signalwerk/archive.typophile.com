  html: |-
    <p>I thought fontmakers tried not to have the same name for a font that someone else has. Is there a legality regarding this?</p>
    <p>Someone’s link had me browsing at Fountain, and I see Peter Bruhn has a <a href="http://www.fountain.nu/catalogue/ftn_farao.asp" target="_blank">Farao</a>, while Storm also a <a href="http://www.stormtype.com/typefaces-fonts-shop/typeface.php?id=206" target="_blank">Farao.</a></p>
