    <p>Just putting together a New Zealand Film critique mag, using scala sans, but not sure im that happy with it... i like the weight, but some of the shapes arent really working for me... any suggestions?</p>
    <p>using minion pro on the inside also... what do people generally think of discretionary ligatures in the body text?</p>
    <p>cheers</p>
    <p>Duncan</p>
