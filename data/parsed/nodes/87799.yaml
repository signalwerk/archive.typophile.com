    html: |-
      <p>Hi Arjun</p>
      <p>I agree with Lai, in the first example, the letters need, when put together, to form cohesive word(s). Also, as the client is a foundary, maybe you should have a lot more strength in the strokes, this will counter the large negative spaces which are also breaking the composition up. </p>
      <p>I think the same thing is happening in the second example, to me the strokes coming off the letters are going the wrong way, in the english language we read from left to right, those strokes seem to be counter-intuitive, moving from right to left.</p>
      <p>Overall I think the concept is heading in the right direction and has the right feel, just needs some simplification. What about linking the letters along the x-height axis, this will leave everything above and below the lines 'borderless' yet at the same time allow you to tidy up the baseline, and be able to do the same along the top.</p>
