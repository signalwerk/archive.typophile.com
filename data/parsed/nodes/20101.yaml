    <p>I need some practical advice on recommending a font for academic texts.</p>
    <p>I'm giving a workshop to my students on using open source software to write their thesis, in the hope that they will abandon Word, perhaps for OpenOffice, or better yet Lyx. I will  introduce basic typographic concepts, but work within practical limits.</p>
    <p>All of the students currently use the default TNR 12pt to set text on a US letter page. I'm wondering what I should recommend that they consider instead. (They won't pay a dime for a font). Palatino? Charter? Lido? Computer modern? The choice should be pragmatic.</p>
