      <p>Kon,</p>
      <p>You mean well, but I'm gonna have an uphill battle convincing students to give up Word; to get them to "study Latex just so the thesis will look prettier" is a lost cause. To persuade students to spend money on fonts when they still have debt belongs in DSM-IV ;-)</p>
      <p>As for the fonts, let's agree to disagree a little here. I don't think CM is a good typeface for humanities or social sciences. URW Garamond I don't appreciate. Times New Roman is too condensed to serve well on letter paper without obscene margins. Palatino is one of my choices, though.</p>
      <p>Regards</p>
