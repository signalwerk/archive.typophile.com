      <p>1. Optima Nova is a very elegant and readable font. Yes it is not free! That's why I said about Palatino for free. </p>
      <p>2. Well Computer Modern, Palatino, Times New Roman and Garamond are nice for lengthy texts unless the texts are really boring. In that case a really bad font is needed to blame.</p>
      <p>3. If you use GUI for LaTeX you miss most of its non-WYSIWYG philosophy. </p>
      <p>Where can I find an example of such a thesis so I can get an idea how much of LaTeX it would need.</p>
