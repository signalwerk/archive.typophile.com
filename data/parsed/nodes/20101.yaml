      <p>I really like your idea of introducing them to TeX or one of its variants. But why LyX? A nice editor would help them understand better the philosophy behind TeX. There are some supporting packages on LaTeX to help with the typography [like komascript or memoir]. And few free fonts to choose from <a href="http://www.math.uiuc.edu/~hartke/computer/latex/survey/survey.html" title="http://www.math.uiuc.edu/~hartke/computer/latex/survey/survey.html">http://www.math.uiuc.edu/~hartke/computer/latex/survey/survey.html</a></p>
