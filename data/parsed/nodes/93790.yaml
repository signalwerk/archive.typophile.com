    <p>P22 Cezanne was initially designed by <a href="/wiki/Michael%20Want" class="freelinking" rel="nofollow">Michael Want</a> in 1996 while he was at <a href="/wiki/P22" class="freelinking" rel="nofollow">P22</a> type foundry. Cezanne is based on the hand written correspondences of French Impressionist painter <a href="http://en.wikipedia.org/wiki/Paul_C%C3%A9zanne" rel="nofollow">Paul Cézanne</a>.</p>
    <p>P22 Cezanne was originally created for the Philadelphia Museum of Art. Upon it’s release it quickly became one of the most popular fonts of the1990’s, and has remained very popular to this day.</p>
    <p>Cezanne Pro was designed by <a href="/wiki/James%20Grieshaber" class="freelinking" rel="nofollow">James Grieshaber</a> in 2005 to expand on the original Cezanne font. Cezanne Pro was realized as an OpenType font to includes full Western and Central European character sets and Cyrillic for typesetting in dozens of languages. It features several types of numerals, ligatures, snap-on swashes, and word glyphs. Cezanne Pro includes over 1,200 glyphs and “smart features” that will automatically substitute letter combination’s to create an even more natural handwriting effect than was possible with the original Cezanne font.</p>
