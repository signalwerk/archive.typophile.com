      <p>1) Loosen the "IN".<br>
      2) Loosen the "NE".<br>
      3) Maybe ligate the "NT".<br>
      4) Remove the trapping - the slight bends in the "crotches" of the "N"s, the top-inside of the "A", etc.</p>
      <p>hhp</p>
