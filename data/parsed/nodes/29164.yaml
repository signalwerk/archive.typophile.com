      <p>HI there, </p>
      <p>A nice simple logo that I think could work quite nicely. </p>
      <p>A couple of little things, I dont know how you feel about it but I have never been a great fan of kerning letters to the extreme that they start to fall apart. I think the PARTNER on the MP-var version is a no go. The other two work a lot better, they work as one element. </p>
      <p>Secondly, it may just be my eyes but I think that the MAINT part of the logo is maybe kerned a little too tightly. Because the MAI are kerned to the extent where they are attached to each other the uprights start to create some strange negative spacing and shapes, I can almost see a 'W' and a 'V' in there, I think that maybe you should open up the kerning a little, and then see how the letters react to each other. </p>
      <p>If you are as you say going to be using this on vehicles and signage, the logo does need to be a little clearer. It may blur into a shape rather than read as a word as you have it now. </p>
      <p>Matt</p>
