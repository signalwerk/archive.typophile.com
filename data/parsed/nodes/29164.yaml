      <p>To my eyes the biggest issue is the the spacing in partner. The PA &amp; AR are too loose compared to the rest of the text. I would loosen the rest of the text Instead of tightening the others however untill the they match the A &amp; it's sidebearings. You could overcome some of the odd shapes in Maint by making a dot on the i. </p>
      <p>This will sound a bit heavy I am affraid but do you have anything else? Why these types anyway? It looks okay to me but only okay. Do you have time to consider other options?</p>
