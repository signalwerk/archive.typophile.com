    <p><a href="http://www.hubertjocham.de/item.php/type/display/Narziss/" rel="nofollow">Narziss</a> is an upright swirly neoclassic typeface.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/WassNarziss_5968.jpg"></div><p></p>
    <p>"Since Mommie I gradually got more into swirly ornaments. The massive contrast in the neoclassic style is perfect for thin swirly extentions to the characters. Even in an upright typeface. Narziss is very elegant in big headlinesizes. Use it only very big."</p>
    <p>The basic style of Narziss-Regular is a neoclassical display font with big contrast. The Narziss-Drops have some unique characters with drops that are not usually there. The spencerian swashes of Narziss are swirls which grow out of the existing strokes and overlap with the next characters.</p>
    <p>For more information: <a href="http://www.hubertjocham.de/item.php/type/display/Narziss/" title="http://www.hubertjocham.de/item.php/type/display/Narziss/">http://www.hubertjocham.de/item.php/type/display/Narziss/</a></p>
