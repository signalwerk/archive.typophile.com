      <p>I don’t think language is the primary factor to consider, but code pages.<br>
      If your typeface supports a particular code page, then ALL the glyphs you create for its characters should fit nicely with one another—because it’s not just frequent combinations you want to look good, but every combination, and just about every combination will show up in text eventually, somewhere or other, and your typeface should be prepared to deal with them all.</p>
      <p>Frequency combination charts are useful in reducing the number of kern pairs for non-class-kerned fonts, but well-designed fonts don’t have a lot of kern pairs anyway.<br>
      Kai, this business of letter frequencies is a red herring (a falsity, an irrelevance, a distraction).</p>
      <p>When languages non-native to the designer have special characters, such as, for me, the Slovak “lcaron” and “dcaron”, then it helps to see how the character works in setting. That’s an interesting example—because for a long time Slovaks have been making do with foreign fonts that treat the accent more like an apostrophe, inserting a gap into the accented word. Now Peter Biľak (Typotheque) is saying, “Wait a minute, a gap in a word, caused by a mere accent, is silly,” and designing types which minimize the width of that accent.</p>
      <p>Correct me if I’m wrong, but I don’t think there is any special concern for Finnish, typographically speaking, other than frequent diereses. So you should pay special attention to getting the dieresis right; in particular the distance between the dots, their size and vertical position relative to the dot on “i”, and, as Chris says, how it may kern, with T,V,W,Y and f. </p>
      <p>Having said that, there are letter combinations that occur in Finnish that are unlikely in English, such as aa. If you look to older typefaces from English-language designers as your model, it may well be that the aa combination is not anticipated in their design.<br>
      But I think such errors are less likely in newer typefaces, as type designers are better informed on such matter now.<br>
      Anyway, if you are proceding from scratch—which is the best way to go— rather than “reviving” or modifying other designs, you won’t have to worry about that kind of thing.</p>
      <p>For a “pan-latin” perspective, these are excellent resources:</p>
      <p><a href="http://www.diacritics.typo.cz" title="www.diacritics.typo.cz">www.diacritics.typo.cz</a><br>
      <a href="http://www.microsoft.com/typography/developers/fdsspec/lowercase.aspx" title="www.microsoft.com/typography/developers/fdsspec/lowercase.aspx">www.microsoft.com/typography/developers/fdsspec/lowercase.aspx</a><br>
      <a href="http://www.microsoft.com/typography/developers/fdsspec/diacritics.aspx" title="www.microsoft.com/typography/developers/fdsspec/diacritics.aspx">www.microsoft.com/typography/developers/fdsspec/diacritics.aspx</a></p>
