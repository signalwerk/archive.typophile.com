      <p>One thing to consider, is whether the language contains unusual lettercombinations that can cause problems. In norwegian, for instance, the combination <em>gj</em> is quite common (<em>Gjengen gjekk gjenom gjerdet</em>), and in many otherwise great typefaces this combination causes the letters to collide in a terribly unaesthetic way. </p>
      <p>Another thing to check, is the frequency of different types of letters. If a language contains a lot of uppercase letters, like german, it is often wise to make the uppercase letters look less dominant. The same goes for letters with ascenders, descenders or umlauts.</p>
