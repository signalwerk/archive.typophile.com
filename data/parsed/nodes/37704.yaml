    <p>Hello all,<br>
    Long time lurker, first time writer here.</p>
    <p>I am a graphic design student and I’m starting my thesis work on typeface design. My intention is to design a typeface specially for setting finnish language texts. My only problem thus far is, that I’m not sure what I should take in consideration when designing the typeface specifically for a single language. I know about fixing kerning and such, but I have no idea what else there is. If there even is anything more.</p>
    <p>So, I’m hoping someone here could point me to some direction, on where to find some information on this. Books, essays or webresources that I can actually quote on my thesis would be wonderful, but any kind of comments on the matter are appreciated.</p>
    <p>Thank you,<br>
    Kai Talonpoika</p>
