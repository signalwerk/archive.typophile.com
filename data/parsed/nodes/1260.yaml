    html: "<p>Bienvenido Sergio, from one from Madrid... <br>At first sight I like it but 3 ideas: <br>I think you should work with \"UA\", even though I like them with \"UN\", but this is the problem, I read UN (la Universidad de Navarra...?) <br>25 ok in the same color, have you tried in the blue one? <br>I like the text in gray but it is kind of hard to read for me, maybe becouse the gray is too light and the font thin, I don't know if this could be more legible in Upper case. <br>Well, I hope it helps, y bienaventurados aquellos que pueden trabajar al lado del mar .... algun dia lo conseguire.</p>"
