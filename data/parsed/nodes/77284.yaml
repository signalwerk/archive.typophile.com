    html: <p>It is the proportion of the cross that pushes it towards the christian look.  Make the top stem the same length as the lower and horizontal bars to give it that perfect Swiss 3 by 3 grid.  If that is not enough, try moving the cross right a small amount so you just get the beginning of the lower stroke terminal of the cross cutting into the lower S curve.</p>
