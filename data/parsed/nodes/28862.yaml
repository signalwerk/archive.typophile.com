    html: |-
      <p>There are two ways you can go, I think. Either treat it as a product, and you need to make it happen, or as not one, and you don't <em>have to</em>.</p>
      <p>If this is a product you want to sell, each additional part demands a multiplication of refinement. In software-land, feature sets get locked well before a product's ships. Even really great ideas get shelved for later versions because otherwise, the first version never gets out the door. Cut out the most belaboring aspects, add what is needed to stay competitive, and keep track of your hours. :)</p>
      <p>If it is a labor of love, your magnum opus, and all about the journey...<br>
      Take time, make more notes, get feedback and keep adding things. Or go for a walk if it isn't too hot. Have a life. Let things stew a bit in your brain and see what, if any, is the purpose. Get back to it when your vision takes you there. But don't rush or over-analyze it until you are sick of the project.</p>
      <p>It's a good face, and everyone here "can't wait" to see it released. But we actually can wait. So figure out how far this needs to go for you, and go. Then stop. :)</p>
    html_clean: |-
