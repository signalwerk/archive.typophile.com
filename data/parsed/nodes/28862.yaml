      <p>you mean this ?:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Jasonchop_6508.png"></div><p></p>
      <p>It's a personal logo of a sort. The father of my girlfriend at the time was a curator at the National Museum in Taiwan, and quite an accomplished ink painter and calligrapher himself, helped me with the design. I forget what it literally translates to, but it kind of sounds like "Jason". It's the first thing I ever literally carved in stone. </p>
      <p>Since then I've put it in the "apple" key space in my fonts. Maybe it's not right, but I don't think it's right to put the Apple, inc. logo there either unless they're licensing the font.</p>
      <p>The reverse curl of the mu is indeed rare (I've usually seen them extend left and hang straight), but I have seen it in other fonts. I'll have to get back to you on which ones.<br>
      Too many older fonts never even bothered with matching shapes for all these special characters and just substituted from whatever their basic serif or commercial pi font was. I hope that doesn't go on too much anymore.</p>
      <p>I have read Briem's pages, but it looks like I'm due for another review.</p>
      <p>If the fi lig connected to the top of the dot instead of the bottom, the arch of the f would be much wider and more open. The hook of the regular f is very tight in comparison already. Is it wise to make them more dissimilar?</p>
      <p>I'm not sure what I was thinking with the infinity other than I did not want it to be a sideways eight.</p>
      <p>This is something I've been meaning to ask in a more general context (rather than specific to this font alone) but exactly what features differentiate a text and display face (and other optical size categories, if that's the right term) of the same weight?</p>
