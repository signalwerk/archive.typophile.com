    html: "<p>Florin isn't working, x still has reversed stress, counter of a should be more symmetrical I think, and W's usually have the thicker diagonal continued all the way to the top. Serifs of s have no relation to other letters (consider making them like c, ß, or S), and ß has wrong stress: on the bottom it should be like s, and on the top, the outward-facing curve should have it, not the in-pointing one (viz. <a href=\"http://www.myfonts.com/fonts/linotype/sabon/roman-oldstyle-figures/win-t1/19867/character/00DF/CP2/1\" rel=\"nofollow\">Sabon</a>). Z too light, WwX too heavy. Corner at bottom of inner curve of J no good. M too wide. Cedilla not bold enough at parts. 9 needs a corner at the terminal, not curves. © way bolder than ®. \"<cite>n</cite>-ary product\" sign comes below baseline. Ah, revising: so much fun, no? Keep fighting the good fight.</p>"
    html_clean: "<p>Florin isn't working, x still has reversed stress, counter of a should be more symmetrical I think, and W's usually have the thicker diagonal continued all the way to the top. Serifs of s have no relation to other letters (consider making them like c, ß, or S), and ß has wrong stress: on the bottom it should be like s, and on the top, the outward-facing curve should have it, not the in-pointing one (viz. <a href=\"http://www.myfonts.com/fonts/linotype/sabon/roman-oldstyle-figures/win-t1/19867/character/00DF/CP2/1\" rel=\"nofollow\">Sabon</a>). Z too light, WwX too heavy. Corner at bottom of inner curve of J no good. M too wide. Cedilla not bold enough at parts. 9 needs a corner at the terminal, not curves. © way bolder than ®. \"<cite>n</cite>-ary product\" sign comes below baseline. Ah, revising: so much fun, no? Keep fighting the good fight.</p>"
