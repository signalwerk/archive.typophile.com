      <p>Assuming you agree that this is worth trying out I should add that the n &amp; m do have that 1st serif that make them semi cohesive already but the way the arms are coming out don't look quite right to me with the rest of the design. What if you used something more like the b's bowl top join. That feels more relaxed. </p>
      <p>As for the r I would either give it a b like arm connection or alter the wave for that glyph. I realize that it was the concept glyph but I think it could be better. You could raise the height of the r's arm &amp; ball too. And or you could try to make the glyph less wide. It's creating an odd break in flow as it is. The a might be slightly less wide too.</p>
