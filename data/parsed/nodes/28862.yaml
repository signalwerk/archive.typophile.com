      <p><cite> This is something I’ve been meaning to ask in a more general context (rather than specific to this font alone) but exactly what features differentiate a text and display face (and other optical size categories, if that’s the right term) of the same weight? </cite></p>
      <p>This is topic much discussed. There are ways of searching typophile - ( admitedly not all the search boxes work for me) but google can help. In general though it's things like x height being in a certain range and a a whole bevy of other tendencies. Really your face is never going to be used to set a novel or a whole story in a magazine even - so it will not be a text face per se. But it could be used for pull qotes and a whole range of other near text tasks now that it would not have been acceptable for before. Actually, do you agree it is better now - or not so much?</p>
      <p>About the serifs- (CGS etc.) Your right about their needing to be different while maintaing consitancy. My adice to is to go look at the many &amp; in some cases contradictory things that have been done &amp; find a model which you think suits your font best &amp; try it. Alternatively - trust your eyes. Find what feels right. Try things. </p>
      <p>I was looking at the mu in the new Arno Pro from adobe &amp; it actually kinda close to yours. It's basically down with a slight curve in &amp; then a ball-ish blob. It's less wild than yours if you see what I mean. But realated. It comes with the trial version of the latest Photoshop. Maybe it's in the font shops too. The bold 36pt has a weight kinda like yoyr too. Have a look if you want.</p>
