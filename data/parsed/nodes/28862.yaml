    html: <p>I think there is something worth keeping in this idea. And that there are several ways to find a way of doing that. The idea I have is that you could begin the stroke not inside the o but instead at the left of the loop. But that might be sucky. Try it &amp; find out. I would sketch it in pencil over &amp; over until you get what you want. And I would consider some more expected options too. Leave yourself open to the best solution. Have you contacted/email anybody on the board to ask about the font? I am glad it's giving you greater satisfaction. I have been told by people I trust that sometimes the best thing after an intense bout of development is to take a break &amp; work on something else to give your eyes &amp; brain a chance to freshen up. I am not saying that's what time it is - just that it's an option.</p>
