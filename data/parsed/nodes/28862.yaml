    html: <p>Try renaming your font for the purposes of checking. I had Font Explorer seemingly cacheing some of my old data. It didn't go away util I changed the font's name. There is probably another work around but that's the one that worked for me. You should also be aware that FOG doesn't work in whole numbers. It uses fractions. So when you export to TT at 1000 UPM some numebers may round up or down on you producing results that may not be expected. You have come pretty far with this. Why not go the extra mile? Also, re-reading the thread I started to wonder what you meant by <cite>I’m not sure how to efectively implement them all.</cite> What upm are you working in?</p>
