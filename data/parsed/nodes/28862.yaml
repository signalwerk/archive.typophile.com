      <p>It would be great if this could work as a text face. As it is, it's a bit too bold and tightly spaced, so I'll have to loosen it up and make a lighter weight version once it is fully nailed down. (To say nothing of corresponding italics. I've never done those before.) </p>
      <p>And, I have opened up the g in the next iteration quite a bit. I also increased the em square to 2048 (surprisingly painless).I'm still poking around for other things to tweak. I should be ready to show those developments later today.</p>
      <p>In the mean time, here is a sample to compare with your example of Sansa Slab, plus a few extra letters:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/agamemnon10-shortsample_6340.png"></div><p></p>
      <p>In version 11ß, the bowl of the b will have a similar top to the archof the h,n, and m. but as I understand it, you're suggesting that follow on to the p as well, and also be reflected on the underside of the d, q, and maybe the g.</p>
      <p>The wave I speak of is most clearly evident on the top of the r, but it is present on the top of the p, q, and g as the curve of the bowl flows into the serif, and similarly on the bases of the b and d. To apply your suggestion (in the manner that I'm understanding it, which could be wrong) would wind up putting notches in the d and p that aren't there now. Am I getting this right?</p>
