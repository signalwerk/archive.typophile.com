      <p>I love the italic <cite>g</cite> from Galliard, but I wouldn't put it in my Cyril. Just because a glyph is good doesn't mean it fits. The 9 is interesting, but I don't think it works here. I also question the motive behind the 3: to make a good emoticon? Which will people use more often: the 3 or the emoticon? If you really want to be able to have a good heart, just draw a picture of one and stick it somewhere in the font.<br>
      If something looks wrong, don't hesitate to fix it, even if it does mean "quite an overhaul". In your case, it actually won't take a whole lot to just widen the caps that need widening, like OGHCDB. Make them all look consistent with each other. Giving them similar amounts of white space is a good place to start. (This feels a bit weird, because I can remember when I was on the other end of this exact same critique with <a href="http://typophile.com/node/12860" rel="nofollow">Cyril</a>. In my case, the font was totally not what I had meant to draw the first time, so I redrew it, but I don't think that's really necessary here.) The new 4 strikes me as better, but I think I prefer the old 6. The 1 needs more character.</p>
