      <p>I've learned the hard way, too. Whenever I am about to submit a monster post, I do a quick copy-paste into notepad, just in case. I trust the intarweb as far as I can throw it.</p>
      <p>If I want the 0's to look like real inf/sup numbers, I try that trick of making them independent of the intended combined symbol. Or, I go for something else completely, and draw the percent as it's own item, then duplicate the last 0-type-thing for the perthou.</p>
      <p>On ∞, I'd say that your overall proportions are successfully distinct, and that it would still be a far leap to say it would look too "8" afterwards. Especially when the '8' of the same face is the more classical offset thins touching a thick. There is some decorative face that probably has an '8' like your ∞, but then there is probably one where the x looks like your asterisk, too.</p>
      <p>Perhaps a fresh single-character thread might do the trick, if you aren't confident in the design.</p>
