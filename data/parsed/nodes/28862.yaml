    html: |-
      <p>Some of the foreign-language characters aren't looking good.<br>
      Russian:<br>
      Zhe should definitely point outward. zhe could probably use mirror, not rotational, symmetry, much as it makes the chirality seem wrong.<br>
      Left leg of El/el should be light.<br>
      Sha and Shcha are too narrow.<br>
      Ya should probably not have a light left leg.<br>
      be should have that flourish on top. This one looks very incomplete.<br>
      ef, strangely, should probably be rotationally symmetric. (Russian is full of paradoxes, isn't it?)<br>
      I'm not a Russian, but I think Russians would agree with me on this: Never ever make ascending myagkij, tvyordij, and yery.</p>
      <p>Greek:<br>
      Lambda is upside-down.<br>
      Xi should have weight in it somewhere. Most people make the strokes thick to solve that.<br>
      Pi doesn't need serifs on its serifs on top.<br>
      Almost all the lowercase forms look very amorphous. Try drawing a "normal" text face in Greek, then use that study to make the Greek here less erratic. These letterforms are too all-over-the-place to read with anything like smoothness.</p>
