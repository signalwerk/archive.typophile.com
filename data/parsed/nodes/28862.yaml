      <p>I may be trying to hold you to a higher or simply different standard than you are interested in. Which may well be unfair. But, I think this face might actually sell with more of the kinks worked out. (You should get other folks opinions on that) </p>
      <p>But that makes me think: what sells more? Display or text? 'Text' is answer. And the closer to a text face a display face is ( &amp; this is a display face) so that you can use it for pull quotes &amp; stuff the better it will sell. So the suggestions I have been making have been geared towards making the face a bit more suitable for text. If thats not your thing- no problem.</p>
      <p>So. Assuming you could be interested in the text thing: About the b h n : One of the features that help identify a b h or n is  the notch where the leg joins. If you look at the face FF dax you see an alternative solution. But conventionally speaking, and your face has some of it's roots in convention, there is usually a notch. </p>
      <p>About rotating &amp; mirroring: Conventionally the q should not mirror the p. The d aught not to mirror the b. Sure they do in some faces like DIN. But it is a 20th century affectation having to do with modernist reductivism. I don't see that focus in your type. There are many other alternatives but first let's look at the traditional one:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/sansaslabsample_4107.gif"></div><p></p>
      <p>These are from Sansa Slab (Ourtype). See how the forms differ? Look at d the q! I see the d &amp; q as a more vaiable place for your wave. Maybe the r too. Maybe not though. I would maybe make it more narrow. Maybe a different kind of wave aught be available for the b h &amp; n. So I think you should retain your ripple but think about ways to integrate &amp; vary it with the greater diversity of forms found in text faces. Applying 'rules' can backfire if it interferes with the distictiveness of a letter. </p>
      <p>BTW - You are right to be concerned with cohesion, but there are many ways of achieving that. The wave was not enough. There is stem weight, optical weight matching, spacing repeated themes in the ornament, and the ends of strokes. </p>
      <p>If you can clarify what you want from the face the choices are easier. For instance: if you plan on the face being used at 36pt and larger then your g with it's narrow opening may be okay. Looking at large text it doesn't bother me at all. But if you want people to be able to think of using this font at 12, 14, 16pt etc; then I would definitely open that thing up right away! Context helps. Keep thinking about your intended use &amp; the choices you make will be easier &amp; smarter. 100% of these suggestions are refutable in the right context.</p>
    html_clean: |-
