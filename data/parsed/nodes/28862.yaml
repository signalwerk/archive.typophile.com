      <p>Thanks! I appreciate that. You have been good at taking my suggestions in too. About the muttering: I think it's okay. </p>
      <p>Here is what I would do: If you have been on the board long enough to know who you respect here; tell them. Ask them for help. Be ready for harsh reality or praise. Whichever it is. It might also be that they don't have time or they don't think enough of the design to rate it. That would be the worst I suspect. But be ready. </p>
      <p>The thing is, when you started this design looked pretty scary. Not that it was ugly. It just had a ton of unresolved aspects. It probably looked like too much work to wade into casually. Now though I think you have a shot. You have done much of the that work now. Your face is decidely quirky but it's getting more solid all the time. And quirky &amp; solid are a great combination I think. </p>
      <p>And I do want other folks to have a look in. I think the font will benefit from that.</p>
      <p>Do you know how to use the typophile IM? </p>
      <p>Do you know how to access user profiles &amp; find out if they accept email or not?</p>
      <p>Cheers!</p>
