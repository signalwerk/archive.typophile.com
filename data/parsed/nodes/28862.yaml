    html: "<p>Here are some ideas to keep you busy:  Pull the nose of the 2 in slightly. ( Maybe)  Give it more overshoot on top. The tops of the eights &amp; nines seem to thick maybe. The left side of the 7 seems to light/weak. The curve on the lc k could be more weighty/exuberant. I can't find a way to love the flat r - why not lower the join of the n &amp; m &amp; make an r that matches? Why not throw in the p while your at it? ( it might be better like the b) What about a loop at the beginning of the Q's tail instead of a reverse. That might be more 'ballsy'. heh heh ( rolling of eyes obligatory ). But more meaninfully it would create a more 'even' feeling in the weights. The Q is too light now. In the case of your font I think a flat side to the inside of the O in OE might be better. Why does the l &amp; t drop their bottom? I am not diggin' it. How does that go with the rest? I like the lc v but the lc w &amp; y still don't quite sing to me. The left bottom of the lc z needs more weight somehow. It feels lopsided. The ae seems too wide &amp; lumpy to me. The UC W could be wider. Why not? It's such an exumberant face in general why not give it some room? What about dropping the Join on the UC Y? It seems a bit cramped with those big serifs. I would add mnore weight back to the CAp S in the middle. I don't lknow if the UC T needs to be quite so wide. The N needs some air &amp; width ( a bit ) - The C needs more space &amp; a more gracelful left curve. The G too. Even more, actually. The serif on the UC M makes it look like it's sad. Your best glyphs have a a hardy readdy to do anything feeling about them. The UC A has it. TheB,R,g,s,o &amp; V too. Get that spirit in the rest.  The $ is not wide enogh at the bese especially the left side. British Pound sign - same thing.</p>"
