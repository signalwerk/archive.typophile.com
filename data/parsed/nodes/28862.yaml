      <p>I have expanded the character set into a very large chunk of the Latin Unicode space (including coverage for Vietnamese and a buttload of other stuff don't know), as well as limited inclusion of Greek, Cyrillic, and Cherokee. Actually the Cherokee is pretty complete but I have no idea whether or not it would be legible to native readers (same with the others too). I'd be happy if these scripts just don't look too stupid or inappropriate. I'm sure to get flamed for deriving too much from the Latin for these other scripts, but hey, I'm learning here! </p>
      <p>There are some bugs involving missing or incorrectly ordered glyphs in the new output files (pr-AgamemnonTwentySeven-dis1.pdf and pr-AgamemnonTwentySeven-ffd1.pdf, attached in the first post), but those are FontForge and/or Acrobat issues and I've been talking to George Williams to get those resolved.</p>
