      <p>My guess is that when you are making the Latin B etc you are most likely working in an abstract way in the sense that you are taking an (unfamiliar?) shape and deciding how to interpret it. It's great - but fairly abstract.</p>
      <p>If you want to evaluate what you are up to and gain focus - I suggest that you apply your type to a design project. Even a faux one - but ideally a real one. That will help you notice what is &amp; isn't working - and ground the work in a 'reality'. </p>
