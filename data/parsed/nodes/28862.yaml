    html: |-
      <p>3 pages of intelligent critique and subtle iterations is alot to wade into! I feel like Eben has already answered very well on all the details that actually have answers, and speculated far beyond my skill level on those that are arbitrary. But outside voices are being welcomed so....</p>
      <p>I am going to have a go at the entire set, by commenting on version 0.15's glyphs as they strike me. This may be too little or too much, but I can't tell before I start. No matter how I am phrasing it, I am not saying any are "right" or "wrong", but simply musing. Take any negativity as a mis-emphasis on my part. This face is already beautiful. Ignore most of what I say, please, as I will just write it all, including possibly incorrect or irrelevant details. I have looked at the prior versions only as they come up in the thread. My feedback will consider the designs in context to each other, not as simply standalone letters, but it is based on personal aesthetics, not tradition, which others here are sharper with. And I am assuming that it is targeting both versatile display use (med-large sizes, med-short passages) and decorative use (large sizes, shorter passages).</p>
      <p>Regarding OT Alternate glyphs: I don't have Fontographer, nor have I even seen it in a long time, but I imagine you can create alternate glyphs, name them and assign them to whatever space you like. Does it support Unicode number addresses? If so, you can implement alternate sets, substitutions and such through VOLT, a free tool from MS. To make things simple for now I would just recommend adding any alternates you think are "essential" to some blank spots and ignore the functional aspects.</p>
      <p>--<br>
      A:Where there is no accent, It seems that the top serif could have a curve like the top of many other letters. I see it being flattened to fit the accents like it is now, coexisting in the same face.</p>
      <p>A w/accents: I love the proportions.</p>
      <p>Accents acute/grave: It seems that the bottom curve could look more natural, giving it a less constructed look, and more aerodynamics.</p>
      <p>C/G: I wonder why the vertical serif doesn't bend a hair right at the top</p>
      <p>D w/bar: The left of the bar seems to disappear at smaller sizes.</p>
      <p>E: is this a "flagship glyph" I love all of it.</p>
      <p>J: I love the hook's termination.</p>
      <p>L w/bar: this comes across as heavier at small sizes.</p>
      <p>M: The serifs are... odd. It feels as if it is collapsing in on itself. I think the center of the serif's arc should be contained by the stroke, even if it is still slightly weighted inwards. But I think it would look fine with shorter top serifs and everything centered. Lots of options here.</p>
      <p>N: I might tweak this if it were mine, depending on what, if anything, I did to the M. But pretty nice.</p>
      <p>OE: The sidebearings for this appear to be tighter than the O's, but I bet they aren't. Probably an artifact created by it being darker. Even tho' I think the -E is the same size, it looks shorter than on the AE.</p>
      <p>Q: The stroke connecting the inner loop to the underbar becomes thinner at small sizes. Possibly fixable by making where it intersects the bottom of the outer loop wider by a unit or two. Or just fiddling with hinting. Otherwise, fantastic design.</p>
      <p>S: Would a semiserif like the 's' look good, or silly? I don't know.</p>
      <p>V/W/Y: The upper-right most serif seems to have an oddness like the 'M' I think the 'X' shows a more soothing arrangement. I realize the stroke has a different angle, but it is still possibly inspiring.</p>
      <p>Thorn: The righthand side could be rounder, or the counter could be more like the 'P'.</p>
      <p>a: love it. It looks so flowing, yet it has that uniformity that makes tpye cool. should the top of the bowl be thinner at it's thinest part? I suck @ 'a', so just ignore me.</p>
      <p>ae: at large sizes, the bottom of the join looks slightly heavier than needed. The righthand of the a-'s counter could hook in, to mimic the naked 'e' contour. </p>
      <p>fi: Brilliant. pleasant, hip, general goodness. What about bringing the f's tip's approach in lower, more audaciously. Right now, it is  a surprisingly cool look, and fi ligs are show-off glyphs, no? I might try an acute, rotated abt. 45 clockwise or so as the merged dot.</p>
      <p>fl: looks good, the top is fantastic.</p>
      <p>i/^: I hate dealing with those. Some faces use a skinnier accent.</p>
      <p>r: this has come a long ways. very practical, but the width of the counter does a great job of avoiding that rn=m effect, as you wanted.</p>
      <p>ss lig: why does the long s look so much like a long s, but the short s looks quite different? Does this contribute? I know I just suggested getting wild with the 'fi', but in this lig, I feel that the part within the heart (the standard baseline-to-xheight) should flow like "normal" letters, for those languages where it is exactly that. Considering that, I personally tend to customize only the top connection.</p>
      <p>v/w: These might look really neat with the same effect as the stroke in the 'y'. The sound arrangement of the serifs might be a good model for the 'M'.</p>
      <p>y: There is an interesting optical illusion going on here. At very large sizes (several inches) the left diagonal appears constant width (I think it actually is). At medium and smaller sizes (3/4 inch and under)the stroke appears to taper towards the bottom. This may be caused by screen hinting, or has something to do with the serifs on 3 corners, but not the outside bottom one. Just something to consider, unless it is all in my mind.</p>
      <p>Either way, this is one of my favorite lc's.</p>
      <p>prime: where is it?</p>
      <p>double prime: Interesting, in a good way.</p>
      <p>Dot period/elipsis, etc.: This seems to feel heavier than the text. I think it would look funny if it was the size of the accents (which are great), but it might look a little more cohesive if they were a hair smaller. In the lorem ipsum, they also seem to sit a little low on the line, intermitantly. I think that must be a scaling artifact.</p>
      <p>daggers: alternates with mirrored center strokes could be a great feature, in case users wanted them to match in either direction.</p>
      <p>&amp;: Very cool. I love the arced serif on the right, and the grace of the diagonal stroke.</p>
      <p>@: the very end of the hoop seems like it could have a flaring, like the c/e, but that might be a dumb idea, too. :)</p>
      <p>Numerals: A third numeral with a ball terminal could compliment the 2 and 4.</p>
      <p>Superiors: The horizontals feel very light, especially as the face gets smaller. Not that they should math the regulars, but just a little more weight?</p>
      <p>Superior 3: It looks different from the regular 3, but it doesn't feel like there is a purpose to that alteration. Is the regular 3 too noisy to condense? </p>
      <p>fractions: the inf. 4 seems to sit differently in 1/4 and 3/4</p>
      <p>Infinity: The "two thin stems next to each other" looks kinda forced, and without precedent elsewhere within the face. Additionally, it seems to kinda go against the spirit of the symbol, which is a continuum. I like the thick/thin/thick idea in general.</p>
      <p>Delta: I love the horizontal that looks a lot like the face's serifs.</p>
      <p>mu/micron: I don't care if this is in other faces or not. A real keeper. The beauty is wound well into making it more useful as a symbol, esp. at smaller sizes. Great job!</p>
      <p>Latin ordinals: Overall, nice and legible. You may look at how the bar interacts with numerals, and consider making it narrower. I can't guess from looking at the documents.</p>
      <p>%/perthousand: the 0's dominate the bar.</p>
      <p>equal or greater / equal/less: Do you have a preference for them touching? Does anyone? Is there a correct approach? I happen to usually prefer them as discrete shapes (like plus or minus), but I haven't researched it.</p>
      <p>cent: has a much heavier vertical bar than '$'. Why? (Keep in mind my treatment of both on !Crass Roots, I might just be crazy, and even considering my opinion batty on your part.)</p>
      <p>Euro/Sterling/etc: I love the center bars on these, they feel good to the eye.</p>
      <p>Florin: This is the most inconsistent glyph, in my opinion. The broadening, serifless shaft seems to just make it stick out, and the join with the top arch looks a touch abrupt. The vertical proportions however, look good, not too heavy-handed.</p>
    html_clean: |-
