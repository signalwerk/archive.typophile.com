      <p>While I haven't found another mu with a similar recurve to the one in Agamemnon, the following have at least a noticeable rightward hang to the descender:</p>
      <p>Adobe Garamond<br>
      Bodoni<br>
      ITC Cheltenham<br>
      Souvenir<br>
      ITC Veljovic italic</p>
      <p>What I noticed a lot more of, though, was the use of an italic mu in otherwise upright fonts, and quite frequently a mu from an alltogether different font, often without even regard to matching weights. These are from the big foundries like Adobe, Bitstream, URW, etc. Those that do have a matching mu often look like a u with a p descender snapped on the left upright, though about as often there is a lachrymal descender.</p>
