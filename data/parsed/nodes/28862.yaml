      <p>Nice!</p>
      <p>But of course I found things that bugged me too. So here is what I noticed when I printed the pangram sheet: </p>
      <p>- on the second line 'funtidrk' the ti seem to be clashing. It's a spacing kerning issue. But before you address that you might want to alter the  't' which looks odd &amp; a little weak compared to the robustness of the other glyphs. The ending that works for l is not strong enogh for the t</p>
      <p>- with such a robust face the 'eth' ( reverse italic looking d with a slash) will need to be ajusted the slash is still in danger of being swallowed by the bowl. Why not extend the height of the ascender to that of the h &amp; d?</p>
      <p>- I am still finding the Cap M looks pidgeon toed. Can you alter those serifs at the bottom?  On a related note the serif in the upper right of the Cap N seems overlong to me.</p>
      <p>- If the end of the question mark stroke ( near the dot) was just a bot lighter and perhaps had form more lik ethe end of the lc r I think it would be better.</p>
      <p>- the lc u seems too wide. Try reversing that lc n perhaps. It needs to have that bite out of it too - like the nmr &amp; so on.</p>
      <p>Cheers!</p>
