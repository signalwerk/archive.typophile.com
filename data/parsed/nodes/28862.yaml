      <p>Wow. This is polishing up nicely. I think you have made a good case for this flavor in type. I really like the lc r, the Delta, and the UC DE&amp;Z.</p>
      <p>I have not looked in some time so I think my eye is fresh - here is what I am noticing now: </p>
      <p>The weight of the c seems to light compared to the other glypshs. I think the top might be built up a lttle too. When your a zomed in it's not that noticable but when the letters are smaller it jumps out at me. The Cap C is also less poshed &amp; strong that the Other Glyphs. On the f thorn ligature I might let the arc start slightly higher on the left. The join on the ct ligature could be a bit weitier as it joins the t. There seems to be a litle toomuch weight on the right side of the u. The top left serif on the AE lig might have more weight &amp; flourish. The join in the middle of the a is bothering me. What if the join was straighter or more narrow? I think either thing would help it read as an a better/faster. The diacritics seem too close to me -especially over the d &amp; h. The double story g needs much much more work. But I expect you know that. It's a good idea to have though! The Ogoneks sem clunky - too much weight in their tops I think. I amnot sure about the blob end on the acute/grave. I like it's style but I think they should be more narrow &amp; pitched a bit hgher maybe. Have you read Adam T on french vs polish for this diacritic? The C in your copyright should be smaller. Why not go with a purely circular zero in the old style numbers? That would be cool. What abour harmonizing the ball weights in the old style a bit more too? They all look cool but they don't play quite well enough together yet. They are all grabbing too much limelight from each other because of the over-variation. What if the leg of the Cap l was shorter &amp; had more flair &amp; weight? What if the Join on the left side of the cap Y tapered slightly as it joined the base? The top right leg's Join on the Cap X might look better is it was slightly lower. Maybe that Breve should bend more/go higher. The Paragraph Mark seems a bit too heavy to me. The Q options will be a big selling point for this face. I think if the tails on the 1st two were heavier as they ended it would make the read as Qs more effectively. How about an Alt lc k.</p>
      <p>I hope these ideas are useful to you. You have put in a ton of effort and I think it might pay off. I wold take Tiff's idea seriously too. </p>
      <p>You know... The x height you have now is great for smaller text but the intensity of style is more appropriate for larger sizes Headlines and Display. Do you see what I mean? In a way I could imagine taking the design in 2 directions now. One for text that would be slightly softer in it's character and made for smaller sizes like you already have but maybe with some additional optical adjustments - Then you could have another one for Display &amp; headlines that would keep it's current character but be for larger sizes and so have longer ascenders and decenders and maybe some of the joins would become less bulky - stuff like that. Have you sen font families that do that kind of thing? If not. I can point you at some.</p>
      <p>Cheers!</p>
