      <p>I did at last figure out how to get the y-acute and multiply characters to appear in the font. For some reason they won't be saved in the TrueType font file when saved with Mac Standard encoding, but they will when encoded as Mac Expert, even though they appear in the Mac Standard character set. Weird, huh?</p>
      <p>The Mac Expert set includes positions for small caps and punctuation, OSF, more superior/inferior/fraction numbers, and lots of spaces marked .notdef. Most of these positions, even if they are defined, don't have Unicode numbers assigned to them. It'll be a pain to put everything in place, but I can do it once I find out what those numbers are.</p>
