      <p>I realize ∏ in a Latin font is meant as a mathematical symbol and not for writing Greek, but looking at the wikipedia page Eben linked, ∑ is set the same way in equations. Should that be similarly oversized too?</p>
      <p>Looking at these characters in several other fonts, I can find no consistency to this rule. Hoefler Text has both at standard cap height, in Helvetica they both drop their bottoms to the decender height, in Chicago they both go below the baseline, but not that deep, and in Courier they extend both above the cap height and below to decender level. If there is one correct way, then three of these fonts must be wrong!</p>
