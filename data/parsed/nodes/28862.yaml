      <p>About the lc : I can thing of two things to try : You could pull the upper arm back slightly &amp; see if you like that better at text size. OR you could add weight to it and move the spacing slightly further to accomodate it.</p>
      <p>I think the e is fab. You could add a little weight to the bottom - not an issue at display size but it would make the text size work better. Maybe the s could benefit from some similar tratment above &amp; below - but be careful. Even small changes are a big deal!</p>
      <p>I basically like your CG&amp; S. What issues do you see?</p>
      <p>The main thing I am noticing at text size is that the X height portions of letters are maybe too contrasted with the overshoots. The w is dwarfed. The m &amp; n seem to jump. I don't think you have to match the usual text convention. But the 'deviancy' could be softened.</p>
      <p>BTW if all this seems too text centric the other thing you could do is go back &amp; make a display version! That would be an awesome pairing.</p>
      <p>What about a ball terminal on the 2? The Pound Serling might be better with one too.</p>
      <p>BTW I really like the german double s. Could I see it in use? </p>
      <p>I think the euro is okay but it is a little light. What about a heavier initial mark on the right?</p>
      <p>The Bar D ( Eth) &amp; Bar L have bars that are too heavy. The lc eth has the cross bar at too acute of an angle. and it is too far down. Have you seen this? &lt; a href=http://briem.ismennt.is/2/2.11/index.htm&gt;(link) Thorn and eth: how to get them right</p>
      <p>What is next to that Yen Sign? It seem interesting!</p>
      <p>The infinity is pretty weird. What's the idea there?</p>
      <p>What if the fi lig joined at the top rather than the bottom of the dot?</p>
      <p>What precedent is there for a curl under the 'mu' sign? That looks odd to me.</p>
      <p>Apart from a funny feeling the sterling sign is going to fall over I think I like the Currency symbols. They seem to match the spirit of what your doing.</p>
      <p>The Section symbol seems to belong in another font though. It's so quiet &amp; small. Maybe try making a new one from a Cap S. Ahve a look at some other fonts. Also it should be bigger and taller - that is the Height should be that of the Cap but it should descend to the depth of the lc g.</p>
      <p>I saw a lc k like yours the other day on a font caled Olive Green Mono. It's on the italic. I suggest you have a look at it! It has a motion woth emulating.</p>
