      <p>I have not looked at the font in a while to try to see it fresh eyes. Now that I have come back to look again here are my suggestions: </p>
      <p>Move thedot on the i up It looks cramped. The i deresis too.<br>
      Make the w slightly less wide. It's a little ungainly<br>
      Wheras the r &amp; m are really strong designs, the t seems unfinnished. I would start again with it maybe. That r is maybe the best thing in the font. It's so robust &amp; confident. You might have to reduce the anle at which the arm ends to get better letter fitting later on but its tasty!<br>
      The little serif on the g is too light. It doesn't fit. It lacks confidence. </p>
      <p>This would be a good time to start looking at the white shapes between letters and see what you are making. The white shapes should be balanced with each other. You can solve a portion of this with kerning but you should try to get 50-75% there with the basic combinations so you don't make yourself crazy making special kern combos for 1000s of combinations. To get good interletter spacing you have 3 choices- modify the shapes, modify the side bearings, modify the kerning. It's tricky.</p>
      <p>The nice robust body weight of the shapes of the font seem like they need slightly beefier serifs to me.  The letters look like tigers with the feet of deer. What if they were thicker or if you reduced the curve very slightly?</p>
      <p>I think the crossbar on the l creates as many problems as it solves. The l's shape ( especially the height at which the tail ends ) is the problem along with the sidebearings. In contrast the i is working.</p>
      <p>The extreme thins vary a little too much maybe. I would think about harmonizing them. Look for example at the lc o &amp; the uc E or UC L. To me they don't belong together. I think the n gets the contrasts just right.</p>
      <p>I hope some of this helps.</p>
