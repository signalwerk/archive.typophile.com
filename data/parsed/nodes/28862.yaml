      <p>Two things inspired the new Q. The first being that the previous Q is kind of weird, and the second in that I liked what happened when I added the loop to the pound sterling, so I wanted to see if it would work on the Q. I didn't really look around too much for historic inspiration as much as my vague memories of elementary school handwriting lessons (which among other things gave me a psychological block against writing to this day).</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ag13pound15poundQ_5551.png"></div> <div class="imageWrap"><img src="http://typophile.com/files/ag16-Q-1_4741.png"></div><p></p>
      <p>I guess my intention was to get something a little more normal for this character and as far as that goes it failed pretty badly. I suppose I could go back to an early version of the Q resembling an O with a stick through it, but I don't really like that idea.</p>
