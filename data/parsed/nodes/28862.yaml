      <p><cite> I appreciate all the help you’re giving me, Eben. Still, I can’t help but wonder what might happen if still other voices were to make themselves heard. </cite></p>
      <p>I could not agree more.</p>
      <p>Do you have good relations with anybody else on the type board? Why not email some people you respect &amp; ask them if youcan email them a PDF?</p>
      <p><cite> The u is not simply a rotation of the n. Is the difference in width causing further problems? Would the problems be resolved by matching the widths? </cite> </p>
      <p>You are right about the n &amp; u not just being rotated! But I think that your n rotated would be a better base from which to work out a corrected u than the one you have now. And you would be starting with a width &amp; stem weight that was matching. </p>
      <p><cite> I’m fairly certain the stems are of consistent width, but I will measure them again to make sure, Even then, some might be giving the illusion of being irregular and need adjustment to compensate.</cite></p>
      <p>That might be going on. Yeah.</p>
      <p><cite> I’ll give the ! a shot, but I’m not sure how much I can do with it. </cite> </p>
      <p>If it was me I would narrow the beginning of the base of the stroke inward to create a contrasting weight - so that the top flares out in comparison. Have a look at other faces though &amp; see if any of them inspire.</p>
      <p>About the diagonals. I have a couple of thoughts about that. One is that compared to the issues you have solved now these were more minor. It may be a good time to adress them now however. On some level I have been reticent to suggest changing these until I saw the effect of the other changes because the two aspects relate to each other and with one thing sorted out for the most part it's easier to se what to do about the next. I also had a sense from you (and I wasn't sure I disagreed) that some of the important character of the design might be caught up in these diagonals &amp; serifs.</p>
      <p>But now that I see where we are I think that yes you could adjust things. To my mind the biggest blockage in getting the diagonals sorted is the serifs. Most of the glyphs have an unusual pidgeon toes look to my eye. I think that may be fine now and a source of color in the face but I think it may just bee too strong. The serif have a big impact on how the diagonals feel. Why not bring them in on the interior a little in some cases or center them more? I would try both &amp; see what you think. More centering could bring up letter spacing issues of course.. </p>
      <p>But let's do this. Let's pick just 3 letters &amp; try a few things with them. </p>
      <p>- UC V let's try trimming the inside serif on the right side. </p>
      <p>- For the K let's try bringing the upper diagonal stroke back to the left a little. The join can occur higher up. </p>
      <p>- In the case of the lc x offset the lighter digonals by making the pitch or angle more vertical. You could also widen &amp; open the letter up a little by offsetting the heavy diagonals more too. You don't have to do that with the UC X because the glyph is less cramped with stuff going on. </p>
      <p>There are other ways of doing these things too. Look around try different things.</p>
      <p>With diagonals the solutions are often one-off. A common approach or priciple might be shared across letters but the circumstances are often too unique for the 'solution' to be common across more than one letter.</p>
      <p>about the el: I didn't mean the e &amp; the l. sorry. It's jist that l &amp; 1 look alibe so I was sounding it out. All I meant was that with the base of the l having the shape it does I would be good if it overshot the baseline. You could also change the shape to be flat &amp; sit on the baseline. I am not suggesting either one is better. I just think the l floats as it is &amp; looks odd.</p>
      <p>what don't you like about the lc z?</p>
      <p><cite> I’d like to get the basic letter shapes settled before trying the fancy stuff. </cite></p>
      <p>exactly. I agree.</p>
