    html: |-
      <p>gamma has a straight stem descending below the baseline, which neither upsilon nor nu have. upsilon is curved, and nu has a corner at the bottom, like U compared to V. </p>
      <p>I've drawn up a conjectural evolution of the gamma and nu. I think the nu evolved along a similar path to the mu, so I showed the mu for comparison, because it's more straightforward. I know I've seen the second form for the nu, in <a href="http://www.greekfontsociety.org/pages/en_typefaces16th.html" rel="nofollow">GFS Complutum</a>, which is from the 16th century. These evolutions are my educated guesses, not confirmed historical stuff, so don't quote me too exhaustively. I don't know how we get from the Upsilon form to the upsilon form, but I'd guess it was quite a bit of lazy handwriting among scribes. </p><div class="imageWrap"><img src="http://typophile.com/files/allpurposetemp_3945.PNG"></div><br>
      Bow to my mad MS Paint skillz.<p></p>
