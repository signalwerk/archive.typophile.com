    html: |-
      <p>Here goes. I'll just give a running commentary as I scroll down the PDF.</p>
      <p>-The 'S' and 's' bug me. The contrast is really wonky.<br>
      -Why are some serifs flat, and others curved?<br>
      -'&amp;' looks like an '8'<br>
      -I dig the ball terminal on the '4' and some other letters. I wonder if this could be incorporated into other characters.<br>
      -I think 'C' needs a spur.<br>
      -'G' doesn't really fit. The bottom is too thin, and it could use a spur also.<br>
      -'T' is off-putting. Maybe the curves on top should go the other way to better match the other characters.<br>
      -'k' looks very poorly constructed.<br>
      -The bottom of the 't' is cut off abruptly - it works though. Maybe introduce this into other letters as well.</p>
      <p>Overall, it's got a nice feel, but it's a little inconsistent. With some refinement and redrawing, this could be a very nice display face.</p>
      <p> - Lex</p>
