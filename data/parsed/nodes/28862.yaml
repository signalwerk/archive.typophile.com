    html: |-
      <p>Some observations:</p>
      <p>AX has wrong weight distribution (it's mirrored to usual ones).<br>
      B too big upper part.<br>
      CGOD bowls slightly to light compared to other stroke weight<br>
      J strange<br>
      K upper arm too thick<br>
      S needs serifs<br>
      U not round enough</p>
      <p>e maybe 45° is too much for the bar<br>
      hmn uppermost parts of the bows are too much to the left. more tension!<br>
      r too wide, needs a foot serif<br>
      s too wide, needs serifs<br>
      x wrong weight distribution</p>
      <p>4 bar too high<br>
      69 no weight in the bowls?</p>
      <p>Have a look at other typefaces, don't copy them, but see why they work, how the weight is distributed, how the proportions are, etc.<br>
      And there's an error I tend to do as well: I do way too much special characters before the basic ones are settled. It multiplies the time needed for corrections...</p>
      <p>Sebastian</p>
