      <p>Thanks, Sebastian. I'll get on to those fixes you suggest.<br>
      6 and 9 always give me trouble.</p>
      <p>Though sometimes I sketch out  few letters, I tend to design my fonts in Fontographer from the beginning, usually starting with "h", "V' and "O" then hashing out the basic forms by collaging components from  them to the rest of the characters before fine tuning the shapes. This leads to all the mistakes you noted, but they'll eventually get worked out. It also makes it relatively easy to rapidly construct the special characters that, I agree, really would be better left for later.</p>
      <p>What do you think of my other projects here: Palormak and Cartmeign in this subforum, and Triangulor in the experimental section?</p>
