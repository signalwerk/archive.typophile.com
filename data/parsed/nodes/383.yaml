    date: 2003-06-19T11:41:00
    date_raw: 19 Jun 2003 — 11:41am
    votes: null
    html: <p>If that is a standard business card size, you can't mail it in the US. The machines will choke on them and the post office probably would refuse them outright (learned this the hard way with my wedding invites ;o) <br> <br>The days of 'anything with a stamp can be mailed' are long gone. <br> <br>Check with your local post office and get the latest mailing standards booklet from them before attempting to sell the client on the idea of making these as postcards. <br> <br>Also, if it is standard business card size, the important info on the back (phone number/address) seems to be incredibly small. <br> <br>As for colors, there are few paper vendors that produce duplex papers (different colors on each side). Not sure if there is a brown/orange out there, but you may want to look into that (should reduce your printing to one color, so it may save you a few bucks over a double-impression of orange). <br> <br>The logo is great.</p>
    html_clean: <p>If that is a standard business card size, you can't mail it in the US. The machines will choke on them and the post office probably would refuse them outright (learned this the hard way with my wedding invites ;o) <br> <br>The days of 'anything with a stamp can be mailed' are long gone. <br> <br>Check with your local post office and get the latest mailing standards booklet from them before attempting to sell the client on the idea of making these as postcards. <br> <br>Also, if it is standard business card size, the important info on the back (phone number/address) seems to be incredibly small. <br> <br>As for colors, there are few paper vendors that produce duplex papers (different colors on each side). Not sure if there is a brown/orange out there, but you may want to look into that (should reduce your printing to one color, so it may save you a few bucks over a double-impression of orange). <br> <br>The logo is great.</p>
