    html: <p>whenever I hear of someone using multiple Emigre  <br>fonts I'm interested to see what sort of mess they've  <br>gotten themself into. I agree with Keith, the front is  <br>minimal, and I think it works. try to carry your delicate  <br>minimalism to the back. <br> <br>I'm confused as to why you felt the need to introduce  <br>Base 9 when you already have Akzidenz Grotesk (my  <br>first-glance guess) to contrast Matrix Script. again, I  <br>agree with Keith; dump Base 9 and play that post-mod  <br>italic off of your nice 19th cent grotesk! <br> <br>one more thing, if this is a standard size business card  <br>(which it appears to approximate) then I don't think it's  <br>viable as a postcard by USPS regs. <br> <br>oh yeah, last thing, where did that second italic come  <br>from? dump that one too and use the grotesk in its  <br>place.</p>
