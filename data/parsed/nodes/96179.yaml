      <p>And, incidentally, one has to follow the link Hrant gave to get the answer to the original poster's question:</p>
      <p>There is no brave youth except Ali, and there is no sword which renders service except Zulfiqar.</p>
      <p>I suspect, though, that in Arabic, this type of construction has an idiomatic meaning not found in English; that what is really meant would be conveyed by the paraphrase:</p>
      <p>There is no brave youth like Ali, and there is no sword which renders service like Zulfiqar.</p>
      <p>... in order to convey the meaning that Ali is the bravest of youths without the flat statement that absolutely no other brave youths exist.</p>
      <p>The Wikipedia article also notes that Ali was the first male follower of Muhammad, and even exhibits an ambigram in which the two names transform into one another by being turned upside down.</p>
      <p>This explains Muhammad Ali.</p>
      <p>The article also supplies information pertinent to the original query, although the answer appears to me to finally end up as ambiguous. While it's a motto that a jihadist might well revere, it's also one that apparently resonates pretty broadly through the mainstream Muslim world in legitimate contexts as well.</p>
