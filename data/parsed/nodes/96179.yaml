      <p>I don't want to put too much politics into this forum, but sometimes I feel that some things need a reply.</p>
      <p>Untrammeled free enterprise can indeed have bad results; we've seen that in the Industrial Revolution and to a lesser extent in the Great Depression.</p>
      <p>But in the period from 1948 to 1968 or so, the Western world made capitalism work, as even the United States was not afraid to participate in the economy with tax money to moderate the problems unfettered capitalism can lead to.</p>
      <p>On the other hand, the countries calling themselves "socialist", however much they were pledged to high ideals, were, in practice brutal totalitarian regimes not much different from Nazi Germany.</p>
      <p>The fact that people are able to keep what they earn from working, and they can save some of it and put it to productive use - earning money from use or rental of tools or housing they own - is not a bad thing. For the government to be the only employer and the only landlord is what is bad, because while the ballot box is the basis of freedom, it's a slender reed for keeping governments honest - politicians don't always keep their campaign promises in democracies, and there can be particularly egregious cases of that. So there need to be other centers of power in a society - religion is one of them, and private wealth another.</p>
      <p>We don't live in a perfect world, so we can't get along without governments, but we also can't rely on having enough control over the government to let it take care of everything.</p>
