    <p>I'm just finishing up an awesome tattoo design for a Lebanese client who is of Muslim faith. I used the sword of Ali as an integral part of the composition and now that the design has  passed the initial approval stage I need to recreate the 'letter shapes' to finalize the design. </p>
    <p>Here's an example of the sword of Ali sourced from Google ...</p>
    <p><img src="http://www.graphicdeclaration.com/images/swordofali_1.jpg"></p>
    <p>And a larger image of the words(?)</p>
    <p><img src="http://www.graphicdeclaration.com/images/swordofali_2.jpg"></p>
    <p>What is written on the sword? And could you please suggest a font that I could use. </p>
    <p>Thanks in advance!</p>
    <p>n.</p>
