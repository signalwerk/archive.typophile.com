      <p>Believing that there is no God but Allah is only "intolerant" in the same way as Christians and Jews are, who believe there is no God but Y-h-v-h.</p>
      <p>Christians acknowledge Jews as "people of the book" in somewhat the same way that Muslims acknowledge Christians and Jews, as Islam teaches that Jesus and Moses and Abraham and others were actual prophets sent by God.</p>
      <p>The historical decision by the Mughals and associated regimes to extend eligibility for "dhimmi" status to Hindus is not necessarily in line with the main stream of Islamic jurisprudence; I believe, based on my limited understanding of the matter, that those in the Middle East who subscribe to a conservative interpretation of Shari'a would hold that Hindus should properly have been given the choice of conversion or death (or at least slavery) like other pagans (i.e. sub-Saharan Africans).</p>
      <p>Given the conditions of life as a "protected person" under Muslim rule, as experienced in the present day by Coptic Christians in Egypt, for example, or by members of religious minorities in Pakistan, Islam doesn't seem particularly tolerant if you judge it by the standards of modern industrial societies. Like the U. S. with its First Amendment, and founded by people fleeing religious intolerance in Britain.</p>
      <p>Compare what we are now to the Muslim world, after we've been shocked to the core by the Holocaust into a thorough rejection of inequality in all its forms, and they come off badly.</p>
      <p>Compare Europe in the Middle Ages to the Muslim world in the Middle Ages, though, and the Muslim world denied Jews full equality - treating them a lot like blacks under segregation - while the Christian world massacred them with regularity.</p>
      <p>From some Muslim perspectives, even in the modern era the Islamic world comes off favorably - since the Holocaust happened in the West, and what do you mean it doesn't count? But given the effort and sacrifices made by the United States, Britain, Canada, Australia, New Zealand in fighting the Axis in World War II, and what France, Poland, Norway, Belgium, Holland, Czechoslovakia, and others suffered under Nazi occupation, what do you mean the misdeeds of the Nazis are <em>our</em> fault?</p>
      <p>I think the moral argument is a futile one here; both sides can make a case, and all that is generated is hot air.</p>
      <p>I see this issue in coldly practical terms instead. The United States has an immense industrial base and advanced military technologies. It got away with Negro slavery precisely because nobody in Africa had the Bomb in the 1776-1865 period.</p>
      <p>After September 11, 2001, everything happening in the Islamic world is under intense scrutiny. The wisest policy for any regime wishing to continue in existence at this time is to distance itself as much as possible from terrorism - and doing so basically includes stuff like full legal equality for non-Muslims, non-belligerency towards Israel, total cooperation with the United States in its global hunt for terrorists.</p>
      <p>This has nothing to do with what's fair. Those who have the power to act in order to protect themselves and their loved ones from deadly violence will do so. Those who do not must simply politely ask, and count on our innate sense of fairness and benevolence to produce a positive response, that the U.S. watch where it is having its drones fire their weapons.</p>
      <p>On the other hand, watching Barack Obama withdraw the U.S. from Afghanistan, maybe I'm being too (optimistic/pessimistic) in thinking that there is no way that the U.S. will ever stop stomping on the whole Islamic world until the last violent extremist there is wiped out.</p>
      <p>I put "optimistic/pessimistic" in brackets there because I both do want a decisive victory over terrorism, and no harm to come to the blameless people who make up the overwhelming majority of the world's Muslims. I think both goals can be achieved if more cooperation is forthcoming.</p>
