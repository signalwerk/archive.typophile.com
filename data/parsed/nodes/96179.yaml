      <p>فتى means young adult, and in this context it refers physical features usually associated with youth and being youthful.</p>
      <p>And indeed, you need a calligrapher to do the text (you could use something like <a class="freelinking external" href="http://en.wikipedia.org/wiki/Kelk_%28software%29" rel="nofollow">Kelk</a>, but without strong experience with Arabic calligraphy the result can be very poor).</p>
      <p>(The bi forked shape of the sword is an urban myth, it was named Zulfiqar, which mean “has/with spines”, because its back had spine-like indentation.)</p>
