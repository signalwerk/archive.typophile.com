      <p>As far as I am aware, the OP need have no grounds for concern that he is going to be inadvertently helping to recruit terrorists or something like that.</p>
      <p>However, the First Amendment protects the right of people to use their own voice to speak as they like; that right would be taken away if other people had the right to borrow your voice to speak their words. Therefore, in my opinion, the complaint that "freedom of the press" is only for people who own printing presses, or the view that the First Amendment implies that there have to be things like public access channels on cable TV, are misguided.</p>
      <p>So the First Amendment can't be used as an argument to push someone into doing a tattoo he doesn't feel right about.</p>
