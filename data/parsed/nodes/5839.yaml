  html: <p>in quark (with preferences set to smart quotes on), after importing text, i would just do a simple find/change from " to " and it would automatically do the left and right smart quotes for me.  <br> <br>it seems that indesign is making me do the left and right quotes individually. single quotes are even more problematic.  <br> <br>is there a simpler way? <br> <br></p>
