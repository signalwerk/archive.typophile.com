    <p>My wife is currently in a stats class in her masters program and asked me how she would go about typing an X Bar. I've attached an image of the character. I've done some digging around online and found the character mentioned on <a class="freelinking external" href="http://ta.wikipedia.org/wiki/%E0%AE%95%E0%AE%A3%E0%AE%BF%E0%AE%A4%E0%AE%95%E0%AF%8D_%E0%AE%95%E0%AF%81%E0%AE%B1%E0%AE%BF%E0%AE%AF%E0%AF%80%E0%AE%9F%E0%AF%81%E0%AE%95%E0%AE%B3%E0%AF%8D" rel="nofollow">this page</a> (third character from the bottom).</p>
    <p>I see that Lucida Sans Unicode has it as a character, and I can copy and paste the X bar from that page into Word when using that font. I've checked the Character Map in Windows and couldn't find it, so I'm curious though how I would go about typing this on a PC. Is there a key combination using the Alt key + a series of numbers?</p>
    <p>Thanks for any help.<br>
    David</p>
