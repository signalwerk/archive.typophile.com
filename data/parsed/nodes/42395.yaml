    html: <p>For typesetting formulas in academia the usual tool is <a class="freelinking external" href="http://en.wikipedia.org/wiki/TeX" rel="nofollow">TeX</a>. TeX editors are available as free software for most operating systems. The TeX system will create any symbol used in mathematics and statistics.</p>
