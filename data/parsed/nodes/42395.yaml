      <p>x̄<br>
      For the web at least, here is how you can do it.<br>
      <a href="http://www.personal.psu.edu/ejp10/psu/gotunicode/statsym.html" title="http://www.personal.psu.edu/ejp10/psu/gotunicode/statsym.html">http://www.personal.psu.edu/ejp10/psu/gotunicode/statsym.html</a></p>
      <p>This should apply to regular programs as well, I'm not entirely clear on unicode support in non-web contexts, but it appears to work in most. For example copy and paste the x here. It should work in most apps.</p>
      <p>BTW. Character map doesn't show it because this is actually one regular character and then a special modifier TO the character. The x here may not be correct, but the modifier should be.</p>
