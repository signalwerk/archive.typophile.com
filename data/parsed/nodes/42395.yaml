    html: <p>I don't think that the x-bar (or any other letter-bar) is included in a standard font set. Normally, the typesetting program will add the bar itself by writing the letter and then drawing the line over the top. If you want a symbol like this in Word, you should be able to use the Microsoft Equation plugin (something like Insert &gt; Object &gt; Microsoft Equation x.x). You can use the dialog that appears to create the x-bar (and a whole equation that includes it). If you're looking to use mathematics symbols seriously, consider the LaTeX typesetting system.</p>
