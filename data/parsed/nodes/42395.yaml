    html: |-
      <p>As an alternative to Word's equation editor,<a class="freelinking external" href="http://sbarnhill.mvps.org/WordFAQs/Overbar.htm" rel="nofollow"> this</a> page explains how to construct an overstrike character and assign a shortcut key.</p>
      <p>But for doing statistics or other math, wouldn't a math pi font be a better solution in the long run? The American Mathematical Society has free Postscript distributions of Computer Modern and AMSFonts at <a class="freelinking external" href="http://www.ams.org/tex/type1-fonts.html" rel="nofollow">http://www.ams.org/tex/type1-fonts.html</a>. TrueType versions are on the Mozilla website at <a class="freelinking external" href="http://www.mozilla.org/projects/mathml/fonts/" rel="nofollow">http://www.mozilla.org/projects/mathml/fonts/</a>.<br>
      Wolfram's downloadable Mathematica 6.0 fonts are at <a class="freelinking external" href="http://support.wolfram.com/mathematica/systems/windows/general/latestfonts.html" rel="nofollow">http://support.wolfram.com/mathematica/systems/windows/general/latestfonts.html</a>, and MathType fonts are at <a class="freelinking external" href="http://www.dessci.com/en/dl/fonts/" rel="nofollow">http://www.dessci.com/en/dl/fonts/</a>.</p>
      <p>(These are all properly licensed or donated fonts, so I don't believe the links violate any Typophile rules.)</p>
