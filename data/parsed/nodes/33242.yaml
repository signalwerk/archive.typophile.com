  html: |-
    <p>Hello,</p>
    <p>Is it possible to change line indent in one paragraph style??</p>
    <p>I would like to use zero indent after cyan subhead, and 3-4 after first paragraph. </p>
    <p>Cannot find any simple solution.</p>
    <p>Can nested styles help here?</p>
    <p>Thanks.</p>
