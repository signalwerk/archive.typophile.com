    <p>Monotype Imaging Holdings Inc. (Nasdaq: TYPE), a leading global provider of text imaging solutions, has announced that fonts from its Helvetica®, Frutiger®, Futura® and Garamond typeface families are shipping with CorelDRAW® Graphics Suite X5, the newest professional graphics applications suite from Corel Corp. Comprising 32 fonts from the Linotype® collection, the designs have also marked their debut in any CorelDRAW product. </p>
    <p>“These classics represent some of the world’s most popular fonts of all time, now part of CorelDRAW,” said John Seguin, executive vice president of Monotype Imaging. “By working closely with its CorelDRAW Graphics Suite user community to bring forward meaningful features, Corel recognizes the tremendous value of type and its importance to CorelDRAW Graphics Suite users.” </p>
    <p>“Text is a central piece of graphic communications. The importance of fonts has never diminished and in fact can be seen as more critical than ever, especially when considering the worldwide distribution power of the Internet,” said Shawn Cadeau, senior vice president, Global Product Marketing &amp; Product Management of Corel. “CorelDRAW Graphics Suite is clearly enhanced with the inclusion of these premier faces.”</p>
    <p>The first Helvetica fonts were created more than 50 years ago for fonts for metal type. Linotype redrew and extended the family in the 1980s for use in phototypesetters, introducing the typeface as Neue Helvetica. Today, Helvetica is considered one of the most famous and widely used typefaces of all time, popular in branded identities, advertising, signage and other commercial forms of communication. Helvetica is also seen in consumer electronics devices such as mobile phones and digital games.</p>
    <p>The original Frutiger typeface was released in the 1970s after debuting in signage at the Charles-de-Gaulle Airport near Paris. More than 30 years later, Akira Kobayashi, head of typography at Linotype GmbH, began collaborating with the typeface’s designer, Adrian Frutiger, to build upon the family and refine aspects such as character spacing and legibility. </p>
    <p>The Futura design, released in 1928 by typeface designer Paul Renner, is based loosely on three shapes – the circle, triangle and square. The Germany-based Bauer Type Foundry assisted in turning the geometric forms into a type family, which Renner improved over time to enhance legibility. Today, Futura remains a popular choice for expressing strength, elegance and conceptual clarity.</p>
    <p>The Garamond design dates back to Claude Garamond, a punchcutter and type designer from the early 16th century. The Garamond #3 typeface, included in the latest release of CorelDRAW Graphics Suite, is based on a variation from the early 20th century that was modeled after the forms of Jean Jannon, a French printer who created a version of Garamond about 60 years after Garamond’s death. </p>
    <p>Monotype Imaging’s fonts that are a part of CorelDRAW Graphics Suite X5 are based on the OpenType® font format, which offer an extended character set to support the English and Romance languages, as well as most Central European and Eastern European languages. Helevtica, Frutiger and Futura are also featured as OpenType Pro fonts, which provide the ability to use advanced typographic features and effects, such as the automatic insertion of old style figures, ligatures and small capital letters. </p>
    <p>CorelDRAW Graphics Suite X5<br>
    With more than 50 new and enhanced features, CorelDRAW Graphics Suite X5 includes major enhancements to asset management, color management and Web graphics. A wide variety of learning resources and additional content has also been added. CorelDRAW Graphics Suite X5 is available in English, French, German, Italian, Spanish, Brazilian Portuguese, Russian, Polish, Czech, Swedish, Finnish, Hungarian, Turkish and Dutch. Further information about CorelDRAW Graphics Suite, in addition to a free, fully-functional downloadable trial version, are available at <a href="http://www.corel.com/coreldraw" title="www.corel.com/coreldraw">www.corel.com/coreldraw</a>.  </p>
    <p>About Monotype Imaging<br>
    Monotype Imaging (Nasdaq: TYPE) combines technology with design to help the world communicate. Based in Woburn, Mass. with offices in the U.S., Europe and Asia, Monotype Imaging brings text imaging and graphical user interface capabilities to consumer electronics devices such as laser printers, copiers, mobile phones, digital televisions, set-top boxes, navigation devices, digital cameras, e-book readers and consumer appliances. The company also provides printer drivers and color imaging solutions to printer manufacturers and OEMs (original equipment manufacturers). Monotype Imaging technologies are combined with access to more than 13,000 typefaces from the Monotype®, Linotype and ITC® typeface libraries – home to some of the world's most widely used designs, including the Times New Roman®, Helvetica and ITC Franklin Gothic™ typefaces. Fonts are licensed to creative, business and Web professionals through e-commerce portals, direct and indirect sales and custom design services. Monotype Imaging offers industry-standard font solutions that support all of the world's major languages. Information about Monotype Imaging can be found at <a href="http://www.monotypeimaging.com" title="www.monotypeimaging.com">www.monotypeimaging.com</a>. </p>
    <p>Monotype is a trademark of Monotype Imaging Inc. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. Times New Roman is a trademark of The Monotype Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain other jurisdictions. Linotype is a trademark of Linotype GmbH registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. Helvetica and Frutiger are trademarks of Linotype Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions in the name of Linotype Corp. or its licensee Linotype GmbH. ITC is a trademark of International Typeface Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. ITC Franklin Gothic is a trademark of International Typeface Corp. and may be registered in certain jurisdictions. Futura is a registered trademark of Bauer Types S.A. CorelDRAW is a trademark or registered trademark of Corel Corp. and/or its subsidiaries. OpenType is either a trademark or registered trademark of Microsoft Corp. in the U.S. and/or other countries. © 2010 Monotype Imaging Holdings Inc. All rights reserved. </p>
