      <p>"Eatopia": <a class="freelinking external" href="http://www.myfonts.com/fonts/charlesborges/alpine-script/" rel="nofollow">Alpine Script</a><br>
      "youthathon": a <a class="freelinking external" href="http://www.dafont.com/tektrron.font" rel="nofollow">Tektrron</a>, slightly customized, could work<br>
      "quipio": hard to say, customized (finials curved), very generic (non distinctive, even boring to me) and too few letters. From hand-drawn to any geometric sans, including freebie. Some: <a class="freelinking external" href="http://www.myfonts.com/search/futura/" rel="nofollow">Futura</a>, <a class="freelinking external" href="http://www.myfonts.com/search/avant+garde/" rel="nofollow">Avant-Garde Gothic</a>, <a class="freelinking external" href="http://www.myfonts.com/search/helvetica/" rel="nofollow">Helvetica</a>, <a href="/wiki/%5B%5Bhttp%3A/%252Fwww.myfonts.com/search/avenir/" class="freelinking" rel="nofollow">Avenir</a>, <a class="freelinking external" href="http://www.google.com/webfonts/specimen/Raleway" rel="nofollow">Raleway</a>, <a class="freelinking external" href="http://fontfabric.com/nexa-free-font/" rel="nofollow">Nexa</a>...  Your best chance is probably asking to <a class="freelinking external" href="http://www.behance.net/gallery/Quipio/6058507" rel="nofollow">Sumesh</a><br>
      "ONSBAY": <a class="freelinking external" href="http://www.myfonts.com/search/lithos/" rel="nofollow">Lithos</a></p>
