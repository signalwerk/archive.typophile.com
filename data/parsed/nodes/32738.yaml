    <p>AP (1 April 2007) </p>
    <p>In stunning developments a formerly obscure group of type fanatics have asserted themselves in the public arena. </p>
    <p>Standing in front of the Washington monument, Chris Lozos has announced he will be running for President. When asked why he said that he hasn’t heard a single pun from any of the other candidates in either party. Challenged on his qualifications, Chris argued that anybody could do better than the current guy. </p>
    <p>In a related development Hrant Papazian has been annointed King of Armenia. King Hrant’s first act was to declare that there will never be another election in Armenia, as he intended to save his country from the pitiable fate of Los Angeles, California. </p>
    <p>In Beirut, Lebanon, John Hudson announced his conversion to Islam, and has been appointed chief negotiator to reconcile Hezbollah and the government of Israel. Speaking through a translator, Hudson explained that Arabic is much more elegant than his former Church’s blackletter, and the Lebanese food is much better than the English fare he is used to. The government said that for anybody who can draw both Arabic and Hebrew, the negotiation ought to be easy. </p>
    <p>Simon Daniels, at Microsoft, reported these developments on his ‘Type News’, but added that they don’t matter, as the nation-state is finished, and actually Bill Gates rules the world.</p>
