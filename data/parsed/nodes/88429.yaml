    html: <p>By a collection of a few sentences, do you mean pull quotes, etc? I may get flayed for saying so (I am a noob typesetter in the real world and a noob on this board), but I think Avenir looks good in sentence case (initial uppercase followed by lower) alongside all-caps Gotham headlines, and yeah, I'm not that sold on Gotham in sentence case.</p>
