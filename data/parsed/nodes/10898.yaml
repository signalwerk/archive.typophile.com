  html: <p>This is my second go around with typeface design. <br> <br>I'm halfway done with it, putting it up for some early feedback.  It'll be a monoface.   <br> <br>I think I like the way the stroke of the 'r' ends and I'll probably make the 'g' 'm' &amp; 'n'look and feel like the 'r'. <br> <br>The 'y' is rough, i'm having problems with it. <br> <br>I do realize this name is probably taken, but i like it. <br> <br><img src="http://www.typophile.com/forums/messages/29/8430.jpg" alt="intentional"></p>
  html_clean: <p>This is my second go around with typeface design. <br> <br>I'm halfway done with it, putting it up for some early feedback.  It'll be a monoface.   <br> <br>I think I like the way the stroke of the 'r' ends and I'll probably make the 'g' 'm' &amp; 'n'look and feel like the 'r'. <br> <br>The 'y' is rough, i'm having problems with it. <br> <br>I do realize this name is probably taken, but i like it. <br> <br><img src="http://www.typophile.com/forums/messages/29/8430.jpg" alt="intentional"></p>
