    html: <p> I do like the thick-and-thin stems - it has a nice Art Deco feel, and I can't remember a font like this offhand. <br> <br>The main problem is that without an lc this can't be a text face... Why would the lc look terrible? Maybe it gains too much width because of the 2-pixel stems? I'd like to see what you have. Also, maybe try a version of 16-pixel height. <br> <br>hhp </p>
