    html: "<p>here's what I had for the lc: <br> <br><img src=\"http://www.typophile.com/forums/messages/29/2729.gif\" alt=\"lc\"> <br> <br>the first 2 rows are trying to follow the same stem-width \"rule\" set by the UC - the 1st row is just more strict about it than the second. <br> <br>the other option, the 3rd row, would be to leave out any thickness to the lc, which might work - but... I think that would also defeat the whole purpose of this font.</p>"
