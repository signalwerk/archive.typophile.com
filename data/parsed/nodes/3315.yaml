  html: "<p>this is a sketch I'm working on right now - I've been trying to make a family, ideally for body text, but in the end it could end up only being worthwhile as a display font (if it's worthwhile at all, that is!) <br> <br>unfortunately the lowercase in this style looks terrible - and I don't see any way of making it look right - so I'm thinking of making it into a small caps face, which would make it a less impossible matter of combining the right heights for UC / lc.   <br> <br>so, I have a question: <br>has this been done already?  :D <br> <br>it just seems like such an obvious idea, someone must have done it already (as a bitmap, like this)? <br> <br>any thoughts or criticism of the face itself are also greatly appreciated. <br> <br><img src=\"http://www.typophile.com/forums/clipart/your_image.gif\" alt=\"senator\"></p>"
  html_clean: "<p>this is a sketch I'm working on right now - I've been trying to make a family, ideally for body text, but in the end it could end up only being worthwhile as a display font (if it's worthwhile at all, that is!) <br> <br>unfortunately the lowercase in this style looks terrible - and I don't see any way of making it look right - so I'm thinking of making it into a small caps face, which would make it a less impossible matter of combining the right heights for UC / lc.   <br> <br>so, I have a question: <br>has this been done already?  :D <br> <br>it just seems like such an obvious idea, someone must have done it already (as a bitmap, like this)? <br> <br>any thoughts or criticism of the face itself are also greatly appreciated. <br> <br><img src=\"http://www.typophile.com/forums/clipart/your_image.gif\" alt=\"senator\"></p>"
