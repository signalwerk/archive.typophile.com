    html: <p>i actually kind of like the idea of scriptina, but the spacing is terrible, the letters are poorly drawn, and i hate the colliding loops in double character such as dd, &amp;c. i think scriptina would be okay with (quite) a bit of attention. Does anyone know where to find more info about scriptina? Who is it designed by? is it really legit? is there a EULA for it anywhere. Dennis, maybe you can help me out?</p>
