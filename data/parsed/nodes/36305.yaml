    html: <p>Bickham Script, perhaps. I don’t consider myself a “professional” at recommending fonts, but I used that font for the company’s (where I work) 50th anniversary holiday party last year. The invite was designed like a wedding invitation — mostly white, a touch of “gold” and black type. It worked really well for that in combo with Copperplate Gothic (33bc, I think it was) that I used for most of the copy “meant to be read.” (It’s not an ambitious combo for fonts — I don’t get much free rein with fonts here.) That font above seems to be a little on the casual and froofy side, for lack of better term. But maybe that’s what she wants. It could work in the right proportions. Good luck.</p>
