      <p>I was just looking at Bickley as an option as I already have it and I agree with PD Hunt about Scriptina but I’ve seen it too many times before like Zapfino and was looking for something that gave me an edge? I’m hoping to use the script oversized as a clear spot varnish on a white card so it’s not to in ya face with a mocca shade type over the top of that?</p>
      <p>Scripts are soooo difficult to get right in my opinion, with other types you can usually say yep I love it or noooooo that font is making my eyes bleed, but script....???</p>
      <p>Deano.</p>
