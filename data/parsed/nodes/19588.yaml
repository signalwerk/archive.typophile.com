    html: |-
      <p>Ouch, a hand written script... See <a href="http://typophile.com/forums/typeid/faq/#Q_15">section 14</a> of the FAQ.</p>
      <p>Those are the hardest. Because they are so easy and cheap to produce there are literally thousands of them floating around on the web.</p>
      <p>Have you ever seen this script in another context, with different characters, especially repeating ones? It could even be a custom lettered logo for all we know, and only these 6 characters exist.</p>
