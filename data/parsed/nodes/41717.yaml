    <div class="info">Submitted by <a href="/user/7006" title="View user profile.">paul d hunt</a> : 5.Feb.2008 2.35am </div>
      <p>Introducing two new font families from Norwegian designer Torleiv Sverdrup</p>
    <p>International House of Fonts welcomes Mr. Sverdrup to its roster. He has been a freelance graphic designer for more than 20 years. Since 2005, has spent most of his time working on type design.</p>
    <p>Regarding what motivates him, Torliev states: “I get inspiration wherever I go. Whenever I get an idea, I start from scratch, working with just a couple of letters. These letters then serve as “matrix” for the remaining letters.<br>
    The final result is often quite different from my initial idea, as I let things evolve as they go. The creative process is the drive, the engine, of my work: it is like a voyage during which you have enter many hitherto unknown ports of call.”</p>
    <p>Hoy is a decorative font whose name derives from one of the Orkney Islands. Inspired by the wonderful encounter between the Celtic and Norse cultures in this specific geographic location, the font has adapted some of the features of the Insular half-uncial. It is playful and relaxed, and easily recognizable by its roundness.<br>
    <a href="http://www.p22.com/ihof/hoy.html" title="http://www.p22.com/ihof/hoy.html">http://www.p22.com/ihof/hoy.html</a></p>
    <p>Spiggie is a sans-serif, named for a Shetland beach. The beach traces a tight curve between the shoreline and the sea, which is paralleled in the font‚s controlled yet smooth character. The design language reaches back to the art deco period and the 1920s, yet retains a distinct modern flavor.<br>
    <a href="http://www.p22.com/ihof/spiggie.html" title="http://www.p22.com/ihof/spiggie.html">http://www.p22.com/ihof/spiggie.html</a></p>
    <p>Both fonts include Regular, Italic, Bold and Bold Italic variations in basic formats (TrueType, PostScript &amp;<br>
    Opentype) for $19.95 per face or $49.95 per family. The Pro Opentype versions (Pro includes ligatures, Fractions, Central European character sets) are $29.95 per face or<br>
    $69.95 per family.</p>
    <p>As a special introductory price, you can order both families for $75 for basic or $99 for Pro.<br>
    <a href="http://www.p22.com/hoyspigspecialpro.html" title="http://www.p22.com/hoyspigspecialpro.html">http://www.p22.com/hoyspigspecialpro.html</a><br>
    Discount is valid until Feb 29, 2007.</p>
    <p>Takk!</p>
    <p>P22 type foundry, Inc.<br>
    <a href="http://www.p22.com" title="http://www.p22.com">http://www.p22.com</a></p>
