      <p>k.l.</p>
      <p>Thanks that worked, still getting to grips with the RoboFab syntax</p>
      <p>I think I was trying to do this with my first attempt.</p>
      <p><code><br>
      from robofab.world import CurrentFont<br>
      f = CurrentFont()</code></p>
      <p>f['A'].leftMargin -=20</p>
      <p>f.update()<br>
      </p>
