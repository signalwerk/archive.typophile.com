  html: |-
    <p>Hi all,</p>
    <p>Is it possible to use RoboFab control the sidebearing of glyphs.</p>
    <p>I was thinking something like this might work.</p>
    <p>This code just prints the sidebearing - 20, what I really wanted to do is decrease the left sidebearing by 20.</p>
    <p><code><br>
    from robofab.world import CurrentFont<br>
    f = CurrentFont()</code></p>
    <p>A = f['A'].leftMargin</p>
    <p>A-=20</p>
    <p>print A</p>
    <p>f.update()</p>
    <p></p>
