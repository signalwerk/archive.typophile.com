    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Publications" class="freelinking" rel="nofollow">Publications</a> : Print Magazine</strong></p>
    <p><strong>Publisher:</strong> F&amp;W Publications (USA)<br>
    <strong>Editor:</strong><br>
    <strong>Frequency:</strong> Bi-monthly</p>
    <p>An American design magazine targeted at all sorts of designers in a variety of different areas (Print, Interactive, Motion, Type). The magazine has been published since 1949. Each volume includes an American design annual and a European design annual. Additionally, most issues feature some sort of awards that graphic designers and students across the globe can submit their work too.</p>
    <p>F&amp;W Publications also publish <a href="/wiki/How%20Magazine" class="freelinking" rel="nofollow">How Magazine</a> and <a href="/wiki/ID%20Magazine" class="freelinking" rel="nofollow">ID Magazine</a>.</p>
    <p><strong>Website:</strong> <a href="http://www.printmag.com" rel="nofollow">www.printmag.com</a></p>
