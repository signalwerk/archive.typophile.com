      <p>If you can locate an image of the Egenolff-Berner typefoundy specimen sheet of 1592, it will give you an idea of how Garamond's types were used in the 16-17th century.</p>
      <p>Jean Jannon also issued a specimen sheet with his typefaces, later misattributed to Garamond.</p>
      <p>The Storm Typefoundy has some really good Jannon revival fonts.</p>
      <p>PS. Linotype has an interesting 'What makes a “Garamond” a Garamond?' page at <a href="http://is.gd/54GCX" title="http://is.gd/54GCX">http://is.gd/54GCX</a>. This page has a link to the Egenolff-Berner specimen sheet.</p>
