      <p>When I heard what the author had to say about the book "The Rule of Four", I was astonished when he claimed that Hypnerotomachia Poliphilii was this incredibly obscure old book.</p>
      <p>In fact, of course, pages from it illustrate many books discussing the history of printing, because, along with De Aetna by Bembo, it illustrates the early roman of Aldus Manutilus.</p>
      <p>Another thing about Hypnerotomachia Poliphilii that was noted as an indication of its obscurity was that only parts of it (written in a difficult Latinate form of Italian) were translated into English. This was true, but the book was translated in its entirety to another language which cannot be called excessively recondite: French.</p>
      <p>And, as it happens, the French translation of Hypnerotomachia Poliphilii also appears in many books on typography - as just what you seek, an illustration of Garamond in its original form.</p>
