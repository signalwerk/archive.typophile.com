    date: 2008-01-17T13:31:00
    date_raw: 17 Jan 2008 — 1:31pm
    votes: null
    html: <p>What Stuart is saying about doing some pre-visualization is what I would recommend too. Take a photo of the door &amp; then use photoshop to place your number. Be sure to consider the light. I think the 'a' would read faster/easier if it had a tail. But your design reads okay as it is. What color is your wall? Will you leave the metal bright or paint it? When you are working with physical stuff sometimes it's fun to make things thick. I think this might be nice as cast aluminum... Or even wood if it was done nicely. Maybe 1 inch thick... If it is cut from thin sheet metal it might not have the same impact that it does on screen... Unless - maybe if you can set it off the wall using spacers.... Anyway - that's probably enough from me!</p>
    html_clean: <p>What Stuart is saying about doing some pre-visualization is what I would recommend too. Take a photo of the door &amp; then use photoshop to place your number. Be sure to consider the light. I think the 'a' would read faster/easier if it had a tail. But your design reads okay as it is. What color is your wall? Will you leave the metal bright or paint it? When you are working with physical stuff sometimes it's fun to make things thick. I think this might be nice as cast aluminum... Or even wood if it was done nicely. Maybe 1 inch thick... If it is cut from thin sheet metal it might not have the same impact that it does on screen... Unless - maybe if you can set it off the wall using spacers.... Anyway - that's probably enough from me!</p>
