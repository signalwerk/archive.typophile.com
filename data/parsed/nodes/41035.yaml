    html: |-
      <p>hey. thanks for the comments - I should have given a bit more detail - the metal will be quite thin, only 5mm, and it will be painted black, mounted on a white wall. I have seen some samples of a similar size (30cm tall) and finish so I have a good idea what the final result will look like.</p>
      <p>I was thinking that if i didn't make it black I would have it unfinished so it would rust over time but that just might make it well messy and give rusty rain lines down my nice white walls, unless its set off the wall...</p>
      <p>Eben - good point regarding the tail of the a, I will try some variations, readability is my main concern. I know what you are saying about making it thick, substantial, but I am having to have it quite thin on a purely  practical level, cost and manufacture.</p>
      <p>I will post a picture once I have it sorted.</p>
      <p>ta!</p>
