    html: |-
      <p>Be sure to mock it up in the metal and door colors before you send it out, chances are unless you paint it black, if it's brushed aluminum the 3 will appear much lighter than the 'a' which will be in shadow even if your door is white even if the thickness of the metal is minimal . . .</p>
      <p>I only mention this because regardless what you choose for typefaces, the end application is where you'll find disappointment if all these variables aren't considered . . .</p>
      <p>Stuart :D</p>
