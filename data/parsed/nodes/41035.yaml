    <p>Hello typophile people, my first post, but i have been lurking for a while..</p>
    <p>I have produced a couple of designs for a number for my flat. I intend to get it cut from metal and mounted on the wall next to my front door, the design is roughly 30cm tall so its nice and big.<br>
    Could i have an opinion on the two numbers I have produced, and maybe some alternate typeface suggestions? I want to keep with the 'a' within the '3' so I have a single piece, and it has to be readable for the postman! I prefer the version using Stone Sans as the '3', my other half prefers the helvetica compressed '3' but i find it looks too industrial.</p>
    <p>Any opinions and suggestions welcomed. ta.</p>
    <p><a class="freelinking external" href="http://owen.hermetech.net/misc/3a_01.jpg" rel="nofollow">http://owen.hermetech.net/misc/3a_01.jpg</a></p>
    <p><a class="freelinking external" href="http://owen.hermetech.net/misc/3a_02.jpg" rel="nofollow">http://owen.hermetech.net/misc/3a_02.jpg</a></p>
