      <p>Most Microsoft programs don't support anti-aliasing, which is why solid pixels are replacing the top curves.  </p>
      <p>If this font is for screen application, you should be editing it in Bitfonter (<a class="freelinking external" href="http://www.graphics.com/modules.php?name=News&amp;file=article&amp;sid=2675" rel="nofollow">http://www.graphics.com/modules.php?name=News&amp;file=article&amp;sid=2675</a>)<br>
      I haven't personally used this program, but it looks like it has all the necessary features to manually change the mishap that is occurring in your font.</p>
      <p>If it is meant for print, then it should be of little concern to you how it looks on screen as long as the printed resolution maintains the integrity of the forms.</p>
      <p>I hope this helps! Your project sounds exciting...being un-relient on someone else's translation of Helvetica! Keep it up.</p>
