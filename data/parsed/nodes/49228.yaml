    votes: null
    html: |-
      <p>Thanks for the comments James.<br>
      I am definitely aware of the "Arial situation". I agree with you on some of the concerns raised and I really appreciate your input. </p>
      <p>&gt;&gt;"Erik Spiekermann likes to point out that, for what it is, Helvetica is perfect. Arial is a knockoff of Helvetica, and a knockoff of perfect must be imperfect. "</p>
      <p>I am sure the issue has been overly discussed among professionals, however, I am really curious to what extent can we consider that a certain design has reached "perfection", and thus any further modifications would necessarily mean a departure from the ideal form - in other words a closed matter. I would like to read more about this issue.  </p>
      <p>Personally, I do tend to favor the idea that this is quite a relative matter. I might be wrong, as I do not have formal training in this area, but I think that terms such as "perfect" may be too rigid for describing a type. While one could say that a certain shape is perfect from a technical standpoint there is also a lot of subjectivity in appreciating its  aesthetics. </p>
      <p>While I agree with you that modifying a masterpiece has little chance to lead to another one, we also know that most beginners start by imitating them. From the little I know of type design I kind of get the impression that many of the fonts that are used today have   "evolved" from other pre-existent designs. That kind of makes me think that type design can be subject to "evolution". On the other hand it might be true that the Arial Team did not intend at all to further refine and develop the "Helvetica design" but just to have a slightly modified "clone". </p>
      <p>While it is true that I had Helvetica in mind when I was drawing the shapes, I freely drew them without any external visual help. As a consequence version 1 came out almost identical to Helvetica (excluding at this point the fact that there are a lot of technical problems).  </p>
      <p>That in fact adds support to your theory, in the sense that when having a certain pattern in mind and trying to get the "perfect" shape you end  up in the same place. On the other hand it can also mean that we are so used ("conditioned") to this shapes (we can draw them from mind) that we consider them perfect.  </p>
      <p>&gt;&gt;"I know that you’re doing this as a learning experience, but I think you’re getting into a negative feedback loop, because to refine you can’t really do anything but hack and tweak" </p>
      <p>I am not sure whether you are saying that the particular modifications that I made are bad, or you just think that anybody who will try to do such a thing will end up "mutilating" Helvetica.</p>
      <p>&gt;&gt;"You’re putting all of your energy into trying to force something good and original"</p>
      <p>As a beginner, I would really appreciate some feedback on the original aspect of Helvetica. From what I read it appears to me that Helvetica was also designed based on a previous type.  Just for curiosity i put together several fonts including Helvetica Arial, and Akzidenz Grotesk (that I think preceded Helvetica). Arial looks almost indistinguishable from Helvetica, and Akzidenz also looks very similar to me. I added the first and fourth versions of my font, and included a detail of version 4 at the bottom (vs Helvetica light) for you to compare - pointing out certain elements that were consistently changed for all glyphs. </p>
      <p>Thanks for input, and I hope that with more practice I can reach a point were the font will not look just like a collection of semi-random tweaks. </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/SansSerifs_comparison-2_5915.PNG"></div><p></p>
