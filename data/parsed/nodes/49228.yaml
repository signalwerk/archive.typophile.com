      <p>The first thing that flagged to my eyes were the bowls and round elements that rest on the baseline {a,b,c,d,e,g,o,p,q,s,u}.  Typically the rounded characters rest slightly below the baseline, or slightly above the x-height or cap-height.  They look unintentionally forced to me.</p>
      <p>The vertical chop on the k's arm looks kind of lonely, maybe incorporate that in some of the other terminals somehow.</p>
