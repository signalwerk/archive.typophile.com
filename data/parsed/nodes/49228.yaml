      <p>You've done a nice job of evening out the character weights. As an exercise, I think it's already a success! If you want to push it further...</p>
      <p>Monolines can be <em>tough</em>. Getting that stroke weight optically consistent should be your first priority.</p>
      <p>It does look an awful lot like Helvetica. I think you could afford to take some more liberties, go a little crazy, then pull it back.</p>
      <p>The vertical cut on the arms of the K and k is at odds with the rest of the terminals (maybe this feature is something you can play with to differentiate your typeface from other monolines). The hook on the G, and to a degree the tail of the Q, feel a little more forced than the rest of your solutions; they might warrant a little more sketching.</p>
      <p>Keep going and keep learning!</p>
