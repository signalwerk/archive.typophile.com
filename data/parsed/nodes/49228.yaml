      <p>I think that you’re getting into an Arial situation, and I’ll elaborate. Erik Spiekermann likes to point out that, for what it is, Helvetica is perfect. Arial is a knockoff of Helvetica, and a knockoff of perfect must be imperfect. You’re doing the same thing the Arial team did: trying to make a font with Helvetica’s character by making a bunch of semi random tweaks to the letters. And what you’re creating here is a mutilated Helvetica. </p>
      <p>I know that you’re doing this as a learning experience, but I think you’re getting into a negative feedback loop, because to refine you can’t really do anything but hack and tweak You’re putting all of your energy into trying to force something good and original to come from modifying Helvetica instead of doing something that allows you to really focus on coming up with something that just works on its own.</p>
