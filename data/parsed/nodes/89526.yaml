    html: |-
      <p>I will definitely try your suggested variant with the Gutenberg A font, which is still under development. As to the /r/ after /e/, I just liked the way it looked when designing the logo. Anyway, "round r is sometimes found after other letters such as e, g, i, which likewise do not end in a bow, in manuscripts from Southern Germany and Austria dating from the end of the Middle Ages" (from A. Derolez (2003) "The Paleography of Gothic Manuscript Books", page 91).<br>
      Thank you very much for your comments.</p>
