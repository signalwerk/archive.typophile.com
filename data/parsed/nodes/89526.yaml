  html: |-
    <p>I would like to introduce typophiles to <a class="freelinking external" href="http://www.alterlittera.com/" rel="nofollow">Alter Littera - New Letters of Old</a>, a "personal" digital-type foundry located in Madrid, Spain. Alter Littera produces and markets opentype fonts reviving some of the most beautiful bookhands from medieval Western manuscripts, as well as some of the finest European and North-American typefaces designed from the mid-fifteenth through the early-twentieth centuries.<br>
    So far, only five fonts have been completed (although many more are currently under development), namely:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/gutenberg_b_3864.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/gutenberg_c_3660.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/deutsche_schrift_5836.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/caslon_gotisch_3508.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/alter_gothic_6274.png"></div><br>
    Please visit our <a class="freelinking external" href="http://www.alterlittera.com/" rel="nofollow">website</a> for further details (including full character maps and OpenType features, type sepecimens, font samples, and image galleries). Every comment/suggestion will be very much appreciated.<br>
    Thanks in advance for your interest.<p></p>
