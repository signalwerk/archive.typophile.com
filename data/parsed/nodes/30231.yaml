    html: |-
      <p>To make a circle, you should have just 4 points. One each at 12, 3, 6 and 9 o’clock. </p>
      <p>The same would apply to the spiral. You also want the bezier handles to adhere to a 180 or 90 degree angle (or, at the very least, keep them all at 2 consistent angles).</p>
    html_clean: |-
