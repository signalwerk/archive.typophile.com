      <p>The spiral tool might be an easier way to draw a simple spiral, but how do you calculate what decay is required to draw your spiral, and how can you calculate the radii required (without redrawing parts of it in the first place) and then calculating what is required for the second spiral; it is simpler and quicker to redraw it from scratch using your original file as a guide.</p>
      <p>Tim</p>
