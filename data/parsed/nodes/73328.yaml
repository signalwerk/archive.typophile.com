  html: <p>Whats the implications or basing a new font on another? For instance I was playing with Futura and have manipiulated it to have curved inside corners. As this example shows. </p><div class="imageWrap"><img src="http://typophile.com/files/Damo1_5682.jpg"></div><p></p>
