    html: |-
      <p>If you’re doing this just for you as an excercise …<br>
      Otherwise you are manipulating digital data – you have to check the font’s EULA first, if it allows you to do so in case you intend to distribute this as a new font. The latter won’t be possible anyway, because there exist licensing rights to this typeface. This would be called a derivative design, but as you are just manipulating the existing data one could call it also theft.<br>
      Please do a research on Futura first.</p>
