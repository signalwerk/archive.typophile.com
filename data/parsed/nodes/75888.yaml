    html: <p>Thanks. I´m a close friend of the CEO,  and as far as I know the company is finishing their negotiation on permits from both Cuban and American governments. I dont think they are yet at  a stage where they have a clear corporate image, colourscheme, etc. (and their current logo is really bad! as it´s the few documents they have prepared for investors andthe officials in charge of granting permissions... ´The coreteam at the moment are businessmen, not creatives. Ill soon´be meeting  the marketing director, who is going to be my inmediate boss. I was told about him being asked to join the project a couple of days ago.  I insisted to my friendthe importance on having a good marketing director, and I offered myself to  be one of the two editors of their onboard magazine. The other editor and the graphic designer are close friends of mine, and though the designer is very experienced I asked here looking for some sort of recommendations on fonts to use (or avoid)  to pass on the info to my friend. As I said upthread I´ll be more involved in the selection of copy and translation (it´s going to be a bilingual magazine).</p>
