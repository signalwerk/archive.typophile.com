      <p>The company is being developed now, waiting for the permits etc, and I´ll be involved in the copy side of the onboard magazine. The ships might be sailing some time next year, but in the first quarter of 2011 the editorial team for the onboard magazine needs to be ready preparing the launching issue. As I said, my area is coordinating writers and translators. I love design, and have been register on this forum for a long time, but only to educate my eyes... I´m a translator and a storyteller. I´m sure the designer (whom I asked to join this forum) will have his own ideas etc but what I´ve notice in this "tribe" (using Seth Godin´s concept) is the good level of collaboration and support.<br>
      I´m sure not being clear got the deserved "Comic Sans" suggestion  upthread.</p>
