      <p>&gt; I dont think they are yet at a stage where<br>
      &gt; they have a clear corporate image</p>
      <p>If management hasn't given that much thought, it may fall to the marketing director and his team to define it, based on their understanding of management's goals. But it needs to be careful thought out, and it's essential that the CEO agrees with the direction the creative team is taking. </p>
      <p>For example, you wouldn't want a marketing team to create a visual identity that's young and hip, and then find out the CEO wants a more traditional image that appeals to an older crowd. Or create an onboard magazine aimed mostly at tourists, and then find out that your CEO is aiming mostly for business travelers. Etc.</p>
