    html: |-
      <p>adiazpaz, the problem was that your original question was way too broad. As far as I know there isn't some group of fonts that is specifically appropriate for ferries.</p>
      <p>You said it's a new company under development. Your company will need to develop a complete visual identity system, including a logo, fonts, color palette, stationery, formats for ads, signage, etc., and hopefully all these elements will work harmoniously together, and will be applied consistently to your ships as well as your printed materials, website, and advertising. </p>
      <p>Yes, this is a lot of work! It will require you to carefully consider what image you want to project, how you're going to differentiate yourself from your competition, and so forth.</p>
      <p>And going back to your original question, in order to recommend fonts, folks here would need to know a lot more specifically about the image that you're trying to project.</p>
      <p>A good starting point might be for you to collect images and printed samples from other ship companies to find examples both good and bad to study, and to see what your competition is doing. My guess is that some of the best examples would come from large cruise lines that have big budgets, and while your budget might not be in the same league you might get some good ideas from their examples.</p>
