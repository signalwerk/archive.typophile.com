      <p>Well, at this first stage (untill a change of the US law and all Americans -other than those of Cuban origins- can visit Cuba) most passangers are going to be Cuban-Americans, with the exception offew who can travel to Cuba with an OAFC permit. Of course the aim is that once the ban is lifted (which seems likely, sometime next year) many US tourist might be going to Cuba and together with theexisting regularflights they´ll have theseferries from Port Evergaldes andKey West to Havana. So I guess is mostly family visits, on the first wave, and general  tourists later on.  The CEO is my friend and he listens to everything I say. I sort of advice him or other issues... </p>
      <p>As I said I haven´t yet met the new marketing director and I don´t know which strategies he thinks to implement, but the CEO wants a "modern", "21stCentury"  look  -whatever that means.</p>
      <p>At the moment I´m working on likely themes for the mothly magazine (around seasonal events, Havana´s cultural calendar etc), creating a pool of writers etc. My question was just to get ideas on fonts to pass it on the likely designer for the magazine -whom I chose because of friendship and think that´d make a better way of working. The CEO wants me to edit the magazine (the idea of having an onboard magazine was mine)  and asked me to form my own team.</p>
