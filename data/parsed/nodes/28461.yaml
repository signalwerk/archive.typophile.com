    html: |-
      <p>You probably don’t want to hear what I think about square ’Techno’ fonts, but let’s just say that they are hard for me to ID because there is too little that’s memorable about them.</p>
      <p>I looked through the Indie Fonts Book 2, and spotted something quite close to the ’DIE 7 WEB WUNDER’ lettering — close enough to make modification easy — and it’s <a href="http://www.t26.com/fonts/display.php?f_id=301">’Tremble’</a> by Adam Hayes of Identikal. The only letters you would need to modify are the U, N and R — all relatively simple forms that you could make from other letters in the font. In fact, the R looks like it might have been made from the K or k; and the U &amp; N could be made by deleting one line of the O.</p>
      <p>If that approach doesn’t appeal to you, I’d start searching the Dafont.com ’Techno’ category for a freebie, if no one else ID’s this.</p>
      <p>- Mike Yanega</p>
