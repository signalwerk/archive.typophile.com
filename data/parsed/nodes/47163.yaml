    html: |-
      <p>&gt;Rocky vs. Greta vs. Sunday Times Modern</p>
      <p>If I'm not mistaken, Rocky is a headline face, as is Sunday Times Modern. The Sunday Times now uses Greta Text for text, but you can't really compare it to the other two because of the different function. </p>
      <p>There is a <a class="freelinking external" href="http://www.typotheque.com/fonts/" rel="nofollow">Greta Display and Greta Grande</a>, but as I said over at <a class="freelinking external" href="http://typographica.org/001139.php" rel="nofollow">Typographica</a>, I find them too sparkly, whereas Greta text is a real winner, one of the "best of 2007." For headlines I would prefer both Rocky and Sunday Times Modern to the display versions of Greta. </p>
      <p>For headline, from what I see online--not the best test--I definitely prefer Rocky. It has the combination of weight, balance and bite that seems to me just right for headlines. I don't know about the issue of weights that one reviewer of the new Sunday Times brought up, but I'm pretty confident that all of the weights and widths of Rocky would work well, given that Carter drew it.  </p>
      <p>Incidentally, I prefer Rocky to "Postoni" the Headline Bodoni that Carter drew for the Washington Post. It is also very good, though, and I know it well as I look at it every morning. I'd rather see Rocky though.</p>
    html_clean: |-
