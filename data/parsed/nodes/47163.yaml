    <p>What's wrong with Rocky, the current featured typeface? </p>
    <p>Nothing. </p>
    <p>It's not too fat, too thin, too wide, too narrow, unbalanced in any way. </p>
    <p>Not too showy, not too bland. </p>
    <p>It just sits there being perfectly readable, gracious, calmly doing its job. </p>
    <p>Amazing.</p>
