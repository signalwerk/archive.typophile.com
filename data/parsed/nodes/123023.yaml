    html: |-
      <p>The closest I have is <a class="freelinking external" href="http://summittype.com/fonts/17020/pinecrest.html" rel="nofollow">Pinecrest</a> but from SummitSoft Corp., a very well-known untrusted source for original design. Designed by <a class="freelinking external" href="http://hardyseiler.de" rel="nofollow">Hardy Seiler</a> for <a class="freelinking external" href="http://www.mintcollective.de" rel="nofollow">MINT Collective</a>, it is somehow similar to <a class="freelinking external" href="http://www.myfonts.com/search/flower" rel="nofollow">Flower</a>, <a class="freelinking external" href="http://www.myfonts.com/search/albertus" rel="nofollow">Albertus</a>, <a class="freelinking external" href="http://www.myfonts.com/search/quorum" rel="nofollow">Quorum</a>, <a class="freelinking external" href="http://www.myfonts.com/search/dragon" rel="nofollow">Dragon</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/mti/memo" rel="nofollow">Memo</a> or <a class="freelinking external" href="http://www.myfonts.com/search/amerigo" rel="nofollow">Amerigo</a>. A <a class="freelinking external" href="http://www.myfonts.com/search/copperplate" rel="nofollow">Copperplate</a> would work also nicely as base font (<a class="freelinking external" href="http://www.myfonts.com/fonts/wiescherdesign/copperplate-classic" rel="nofollow">Copperplate Classic</a> for instance).<br>
      You may also be interested in <a class="freelinking external" href="http://www.myfonts.com/search/tautz" rel="nofollow">Tautz</a>.</p>
    html_clean: |-
