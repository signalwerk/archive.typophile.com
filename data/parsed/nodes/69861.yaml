    <p>(aus <em>Frammenti della Bellezza</em>)</p>
    <p>Dieses <a href="http://typophile.com/files/Kleid_u9_ret.gif" target="_blank" rel="nofollow">Bildschirmfoto</a> zeigt eine Situation während der Zeichnung der <em>Vision</em>. Große Freude hatte ich an der ‘9’, die sich, so wie ich fand, aus der Geste der Dame auf dem Bild entwickelt hatte. In ihrer Form spiegelt sie den Arm wider, den sie zum Kopf führt und spontan wünschte ich mir ein Parfum dazu, „Nr. 9“ vielleicht, dass mit ihrer anmutigen Geste formal spielen könnte.<br>
    Dazu hier das kleine ‘u’, an dessen linkem Stamm sich eine kleine Ausbeulung zeigt, die den Verlauf der von unten heraufgeführten Kurve auffängt. Die Linie wird ein wenig nach aussen gedrückt. So in etwa wie die linke Aussenkontur des Unterarms der Dame sanft durch den darunter liegenden Muskel leicht nach aussen gewölbt wird. [<a href="http://typophile.com/files/u_Stelle_Waerme.gif" target="_blank" rel="nofollow">Abbildung</a>] Solche Details verleihen den Buchstaben Wärme und Sanftheit.<br>
    Die ‘9’ wechselt ihre Aussenkonturen ab in dem langen Bogen nach oben. Mein Auge fällt dabei auf den Vergleich mit den beiden Muskeln im Oberarm in dem uns zugewandten Teil des Arms. Verstärkt durch die Bewegung der Geste überkreuzen sie sich im Inneren: Der Teil von oben aus der Schulter kommend taucht in die Form des Armes ein, der von unten von der Brust hergeleitete Bereich windet sich vorbei nach oben. Die charakteristischen Aussenlinien, die dabei entstehen sind sehr aufschlussreich und man kann fast ein bisschen über sie „meditieren“, wenn man inspiriertere Aussenlinien an den eigenen Buchstaben erschaffen will. Goethe hat einmal gesagt, <em>die Formen des Körpers enthalten alles in sich</em>.</p>
