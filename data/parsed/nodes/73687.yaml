    html: <p>I like the mark a lot! As for the type, I understand why you chose bank gothic, its based on geometric forms, however, it was designed quite some time ago (Bauhaus era) and has an indefinable 'old' quality to it...at least in the eyes of designers :)...if you want to use a 'squarish' geometric face I would recommend something like the new H&amp;FJ face <a href="http://www.typography.com./fonts/font_overview.php?productLineID=100041" rel="nofollow">Forza</a> or you can go with typefaces that are slightly more humanistic in nature as opposed to the technical/mechanical look and feel of Bank Gothic or FB Agency, such as <a href="http://new.myfonts.com/fonts/processtype/klavika/" rel="nofollow">Klavika</a>, <a href="http://new.myfonts.com/fonts/dtptypes/sentico-sans-dt/" rel="nofollow">Sentico Sans</a> or <a href="http://new.myfonts.com/fonts/hvdfonts/klint-lt-pro/" rel="nofollow">Klint pro</a>. The last kind of faces I would recommend would be the geometric sans of late such as Gotham, Proxima Nova or other similar faces (do a MyFonts search for geometric sans).</p>
