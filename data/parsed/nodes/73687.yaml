  html: |-
    <p>I've been working on a new logo for a firm of independent mortgage brokers and financial consultants. The company work mostly within the construction and property sectors, and their name was made up from scratch, having no real meaning.</p>
    <p>They wanted something clean, corporate, and professional, and a logo that would inspire confidence in their clients.</p>
    <p>I'm only working in black for now, but would appreciate any feedback, particularly on the choice of typeface. I wanted a face that would reflect the simplicity and geometric nature of the 'EC' icon, but the more I look at it the more I'm unsure that Bank Gothic is right.</p>
    <p>Thanks!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ec_logo_4169.jpg"></div><p></p>
