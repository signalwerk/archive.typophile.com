    html: <p>First I was inclined to say that this is some display version of Bembo. But maybe it’s just the regular <a href="http://www.fontshop.com/fonts/downloads/monotype/bembo_pro_volume/?&amp;fg=000000&amp;bg=ffffff&amp;sample_size=50&amp;sample_text=kunst%2C%20film%20og%20musik&amp;ft=liga" rel="nofollow">text cut</a>, which is a bit on the light side anyway. That’s probably why they came up with <a href="http://www.fontshop.com/fonts/downloads/monotype/bembo_book_pro_complete_pack/" rel="nofollow">Bembo Book</a>.</p>
