      <p>I shudder to think of that.<br>
      Even if you tried to compile an objective list of the most widely used typefaces, or the best selling typeface, you would still produce nothing of value to designers or typographers (although that might give you a list of what to avoid if you wanted a “unique look”).</p>
      <p>We could never “compile” a list based on the merits or quality of designs for the very reason you mentioned.</p>
      <p>As for personal taste or preference, you really can’t argue about what someone “likes.” I like vanilla, you like chocolate, but today we’ll both try strawberry. You can say, “Jane has good taste, and Bob has bad taste,” which again amounts to almost nothing of value.</p>
      <p>Personally, I really have an affection for Goudy Sans (with original alternates). I’ve only used it twice, in fact, I don’t think I actually want to use it. I just love the shapes, the rhythm and modulating color it creates on the page. But I don’t find it a very useful typeface. It’s like Arrighi’s forms in the <a href="http://www.acmedigital.net/jiansabu/arrighi.htm" target="new"><em>Operina</em></a>, beautiful but basically unusable.</p>
      <p>——————————————————————<br>
      Yes, I’m old, but I’m back in style!</p>
