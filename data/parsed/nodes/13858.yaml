    html: '<p>okay, so just for experiment’s sake, i make a wiki entry for <a href="/wiki/essential%252Btypefaces" class="wiki">essential typefaces</a>. The rules are outlined there. Anyone who’s registered and wants to play is more than welcome to join in. One thing i was debating was, instead of having people cast anonymous votes, having them place their initials next to faces they felt essential. That way it might be interesting to compile a list of faces that <a href="/wiki/Tiffany%252BWardle" class="wiki">Tiffany Wardle</a>, <a href="/wiki/John%252BHudson" class="wiki">John Hudson</a>, <a href="/wiki/Nick%252BShinn" class="wiki">Nick Shinn</a>, <a href="/wiki/Hrant%252BPapazian" class="wiki">Hrant Papazian</a> or any other # of typophiles feel is essential. Anyhow, as i said, just an interesting experiment... lemme know what you think.</p>'
