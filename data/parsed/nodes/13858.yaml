      <p>Will, the essential typefaces for someone starting a studio are usually the ones you’ve already heard of. A lot of work can come from clients with established styles/fonts and they’ll expect you to match them. The essentials for us as a group? Heh. You’d never get agreement on 5 of them, let alone 100. I think we all have a handful that we use regularly when there are no constraints other than our own preferences. There are certainly other (and arguably better) versions of some of these fonts, but they continually come up in my life.</p>
      <p>These are <em>not</em> my favorites, just ones that I’ve had a need of/use for repeatedly.</p>
      <p>Adobe Garamond<br>
      Futura<br>
      Helvetica (all variations)<br>
      Gill Sans<br>
      Mrs. Eaves<br>
      Meta<br>
      Times New Roman/Times<br>
      The web fonts (Verdana, Georgia, etc.)<br>
      Univers<br>
      Frutiger<br>
      Minion<br>
      Trade Gothic<br>
      Franklin Gothic<br>
      Bell Gothic<br>
      Unibody<br>
      Rotis (well, I’ve seen it all over, but haven’t had to use it)<br>
      Adobe Caslon<br>
      Trajan</p>
      <p>However, a lot of this list is determined by generational trends, design fads, etc. Also, notice the lack of script faces. I could make it longer, but I honestly don’t have the time. The majority of my work is given to me, rather than chosen by me. When I have control, other fonts I’ve chosen in the past few years are:</p>
      <p>FF Scala &amp; Scala Sans<br>
      FF Absara<br>
      Melior<br>
      Adobe Jenson Pro<br>
      Filosofia<br>
      Citizen<br>
      Mantinia<br>
      Whitman<br>
      Dalliance</p>
      <p>I’m not sure they’d make many people’s ’essentials’ list, but they worked very well for what I used them for. I often avoid ’typical’ fonts, unless it’s the best solution.</p>
      <p>I guess my overall point is that a consensus would be impossible, mainly because our love of a font doesn’t make it essential or even particularly useful. It’s the equivalent of asking what color t-shirt is most essential; maybe useful individually, but completely subjective generally.</p>
