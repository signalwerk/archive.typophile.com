    html: <p>A new designer asking the very question, “What typefaces should I have to get started?” might like to know our opinions. That’s why I confined my submissions to faces that have broad general usefulness or durable use in a certain area. ’Desert Island Type’ is a tired idea since it discounts all the end users and is vain. ’How many fonts can you get’ doesn’t answer anyone’s questions. This list could be useful to anyone wishing to know some good first steps outside of the System Fonts bubble. One thing that might enhance it is a longer entry explaining the font’s merits; or why the font is “essential” for that particular use.</p>
