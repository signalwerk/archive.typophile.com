    <p>This may be a repeat topic- but has anyone here considered putting together a list of typefaces that are THE classics? Maybe top fifty serif, top fifty sans... I think it would be cool to see which are agreed upon across the board. I know that there are various books, such as Bringhurst’s, that feature a group of classics, but it leaves out newer typefaces. (would <a href="/wiki/Mrs%252BEaves" class="wiki">Mrs. Eaves</a> make it, maybe?)</p>
    <p>Any references, past threads, etc. would be greatly appreciated.</p>
