    html: |-
      <p>I examined a couple of fonts from the first link and they all had the same name — "By JOSSQ-DMF in BeiJing" —, which was displayed in Photoshop CS's font list. I'd say the fonts in the second link are of better technical quality.</p>
      <p>You could try to "fix" the fonts by starting to change their names with a font editor, like <a href="/wiki/FontLab" class="freelinking" rel="nofollow">FontLab</a>, for example. However, there might be additional problems with these fonts, as the Unicode values and glyph names seemed to be all over the place.</p>
      <p>(Disclamer: I know nothing about Chinese fonts)</p>
