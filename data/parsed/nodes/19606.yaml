  html: |-
    <p>I downloaded some fonts from <a href="http://www.sino.uni-heidelberg.de/edv/sinopc/chinese_fonts.htm" rel="nofollow">this website</a> and installed the fonts. However, Photoshop doesn't have those fonts in the font list even when other programs like MSWord does. Other recently installed Chinese fonts do work like ones from <a href="http://www.sinosplice.com/chinese/fonts/" rel="nofollow">here</a>. Is there a way to fix this? :\</p>
    <p>I have Windows XP with Window's own language input thing and PS6.</p>
  html_clean: |-
    <p>I downloaded some fonts from <a href="http://www.sino.uni-heidelberg.de/edv/sinopc/chinese_fonts.htm" rel="nofollow" class="link-external">this website</a> and installed the fonts. However, Photoshop doesn't have those fonts in the font list even when other programs like MSWord does. Other recently installed Chinese fonts do work like ones from <a href="http://www.sinosplice.com/chinese/fonts/" rel="nofollow" class="link-external">here</a>. Is there a way to fix this? :\</p>
