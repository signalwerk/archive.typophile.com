    html: |-
      <p>Hi Kristin,</p>
      <p>Dan Barthel was the owner of The Font Company out of Phoenix, AZ and now lives in Ft Myers, FL . . . I have his phone number if you wanted to REALLY get all the inside scoop . . .</p>
      <p>Generally speaking, he was among the first groups along with a handful of young employees he trained to scan and digitize fonts from filmstrips and did a number of conversions for Harry Brodjian of Alphatype faces in the late 1980s. Among those included were Parade and Contemporary Brush Bold which were eventually licensed by Robert Norton for Microsoft . . . I'm certain they used the Ikarus system to make their digitizations . . .</p>
      <p>The Font Company eventually went on to digitize a good amount of faces and nearly all of them were distributed by the Precision Type Company until it closed its doors in the mid-2000s . . . Get your hands on one of those catalogs to see the entire library they released . . .</p>
      <p>At some point in the 1990s Dan decided to close up shop and tossed all the assets digital or otherwise and start over in another business but walked away from the font business all together regardless . . .</p>
      <p>Because of my research for the Filmotype story, tracing it through its timeline eventually lead me to The Font Company when Harry Brodjian took over the Filmotype name to release new desktop typesetters and re-release Filmotype and Alphatype fonts digitally . . . It's all documented in my Filmotype book you can get here: <a href="https://web.archive.org/web/20150123083702/http://www.fontbros.com/merchandise.php" title="http://www.fontbros.com/merchandise.php">http://www.fontbros.com/merchandise.php</a></p>
      <p>Feel free to write offline if you want to contact Dan directly via phone at diner (at) fontdiner (dot) com . . .</p>
      <p>Best,<br>
      Stuart</p>
