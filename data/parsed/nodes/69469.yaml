    <p>Does anyone know the story of "the Font Company" that used to sell a ton of fonts from Phoenix. I did an initial search on the web and didn't find anything definitive. We are still limping along with some old versions of fonts we purchased from them. They seem to break down over time and stop working. I've purchased replacements from URW, which had a partnership with the Font Company, I gather. I'm just curious about the history of this company. The Typowiki link takes me to the search engine rather than an entry.</p>
    <p>Typedia  crashes</p>
    <p>Thanks,</p>
    <p>Kristin</p>
