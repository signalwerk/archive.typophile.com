    html: |-
      <p>As it turns out, only Firefox understands a font with only the DFLT script, and with the ReqFeatureIndex value set to zero, to indicate the feature at offset index 0 must always be turned on.</p>
      <p>Chrome and IE, unfortunately, don't understand this at all, and need to also see a "latn" script (or whichever block covers your ligature source glyphs) in order to be able to apply any feature. And then they must also be told to enable the "liga" opentype feature specifically, through CSS, despite the ReqFeatureIndex value in the default LangSys table indicating that this feature should always be turned on.</p>
      <p>I've implemented these workarounds, and <a href="http://pomax.github.io/CFF-glyphlet-fonts" title="http://pomax.github.io/CFF-glyphlet-fonts">http://pomax.github.io/CFF-glyphlet-fonts</a> should now show the custom glyph in the "with GSUB" section in all major OS/browser combinations.</p>
