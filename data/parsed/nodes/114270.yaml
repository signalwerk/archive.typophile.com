  html: |-
    <p>Hey all,</p>
    <p>I'm working on an on-page glyphet font generator in JavaScript,  and am making decent headway, except I've run into a problem with GSUB ligature substitution...</p>
    <p>If you load <a class="freelinking external" href="http://pomax.github.io/CFF-glyphlet-fonts" rel="nofollow">http://pomax.github.io/CFF-glyphlet-fonts</a> in Firefox, you'll note that the "small" font, without GSUB table, renders the character "~" as a rectangle with a cutout. The second font has a GSUB table for the 'liga' feature with a lookup type 4 to turn the sequence "c,u,s,t,o,m" into "~", <a class="freelinking external" href="http://github.com/Pomax/CFF-glyphlet-fonts/blob/gh-pages/binaries/with%20GSUB/customfont.gsub.ttx#L271" rel="nofollow">http://github.com/Pomax/CFF-glyphlet-fonts/blob/gh-pages/binaries/with%20GSUB/customfont.gsub.ttx#L271</a>, which works in Firefox, but not in Chrome or IE (of course IE doesn't like plain .otf, so the fonts are repackaged as uncompressed WOFF as well, as fallback option).</p>
    <p>I tried running the larger font through TTX, as well as tried loading it in FontForge, to see if those found any obvious errors, but neither seem to complain about the shape and content of the GSUB table, so I'm not sure if I've done something wrong definition wise, or whether there are specific values that a font with GSUB ligatures needs to set before it'll work in Chrome/IE. I know <a class="freelinking external" href="http://symbolset.com" rel="nofollow">Symbolset</a> works in all three browsers, and relies on GSUB tables for the icon ligatures, so I tried to see whether they did something different from what I implemented, but I couldn't really find anything (the TTX xml for symbolset is also quite huge!)</p>
    <p>Does anyone here have experience with cff-opentype fonts for webfont purposes, with GSUB liga features, and might they be willing to have a quick look at what I might be doing wrong?</p>
    <p>- Mike "Pomax" Kamermans</p>
