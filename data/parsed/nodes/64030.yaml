      <p>I think having some jumbo type is good. The "1" example is definitely the best so far.</p>
      <p>Are you allowed to use color?</p>
      <p>My initial reaction is that the grid work is a little too conventional. This sort of assignment is often intended to bring out originality and extreme designs. Also, in your examples, you should clearly delineate where the edge of the page is, otherwise it isn't clear what the negative space is.</p>
      <p>On the subject of negative space, it doesn't seem like much attention is being paid to the negative space. For grid inspiration, I often look to Kimberly Elam's <a href="http://studioresourceinc.com/typographic.htm" rel="nofollow">Typographic Systems</a>. I tend to lump this approach under the category of "Swiss" design, which is not totally accurate, but it's the single best label for finding relevant examples.</p>
