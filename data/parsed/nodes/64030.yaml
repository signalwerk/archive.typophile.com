      <p>Usually such critiques are posted under the Critiques forums.</p>
      <p>I.D. - why is everything angled? Just because one can, doesn't mean one should. Your angles suggest the Features and Departments are in conflict. There's no stable ground for the eye to rest on. So good effort on trying something different, but I think you'll want to rethink a TOC at an angle. Perhaps just the ID logo should be angled?</p>
      <p>Recipe: Same problem as your ID take with the angled text. The vertical text however is great. I like the balance you're getting with Ingredients vs Directions. Perhaps have the ingredients text be flush right with a small spacing between it and the Ingredients title. Then do the opposite to Directions (flush left with small space between text and Directions). And then space the lines of text to ensure a good reading "rhythm". Also as far as final production goes, you may want to give your straight-to-the-edge text a bit of margin. For bleed and cropping purposes. Nothing worse than seeing more text than you expected get cut off during printing and finishing...</p>
      <p>Again this is your project so don't take my suggestions/critiques as the only possible solution or even a better solution than what you have. Design is invariably about solving multi-variable problems and what may work as a solution in one case, may not be appropriate in another. Hope this helps.</p>
