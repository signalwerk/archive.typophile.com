      <p>I'm no designer, so take this for what it's worth.</p>
      <p>I like the table of contents.  It's interesting and readable.  I can't tell whether the shapes represent something concrete or if they're just abstract, but I like it anyway.  The hierarchy is clear, the text is readable, the layout guides me through the information.</p>
      <p>Maybe it's just me, but just looking at the recipe gives me a headache.  Society has conventions for the layout of recipes, and for good reason: they make recipes easier to follow.  We don't interact with a recipe in the same way we interact with a magazine article or a page in a novel.  With a recipe, we read a line or two, then go get something from the pantry and put it in a bowl.  Then we come back, read another line or two, grab something from the refrigerator, and stir things together.  As we read, our eyes are constantly jumping between the ingredients and the directions, and when we stop and follow a direction, we have to remember not one, but two places.  Your design makes this process harder, not easier.  Give the poor readers a break and guide them through the information.  Edginess has to take a back seat to usability here.</p>
      <p>Good luck with your assignment.</p>
