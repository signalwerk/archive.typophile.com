    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Foundries" class="freelinking" rel="nofollow">Foundries</a> : Adobe Systems</strong></p>
    <p>Adobe Systems, founded in 1982, invented the PostScript page description language and then later various graphics software. As part of that, they invented the <a href="/wiki/Type%201" class="freelinking" rel="nofollow">Type 1</a> font format, the first scalable outline format usable on multiple vendors' output devices.</p>
    <p>Adobe initially licensed most of its typefaces from <a href="/wiki/Monotype" class="freelinking" rel="nofollow">Monotype</a>, <a href="/wiki/ITC" class="freelinking" rel="nofollow">ITC</a> and <a href="/wiki/Linotype" class="freelinking" rel="nofollow">Linotype</a>. Later it began a program of "Adobe Originals," initially led by <a href="/wiki/Sumner%20Stone" class="freelinking" rel="nofollow">Sumner Stone</a>. The two famous full-time type designers for Adobe have been <a href="/wiki/Carol%20Twombly" class="freelinking" rel="nofollow">Carol Twombly</a> and <a href="/wiki/Robert%20Slimbach" class="freelinking" rel="nofollow">Robert Slimbach</a>, although many other Adobe staffers have designed one or two typefaces.</p>
    <p>In the early 1990s, Adobe invented the "multiple master" flavor of Type 1 fonts, with interesting axis-based capabilities. In the late 1990s, Adobe moved away from Type 1 and multiple master fonts to collaborate with Microsoft on the development of the <a href="/wiki/OpenType" class="freelinking" rel="nofollow">OpenType</a> font format.</p>
    <p>At the same time, Adobe's output of original designs slowed, and in the 2000s it became just a trickle. This was due both to cutbacks in font development staff and funding, and also to the increasing size and complexity of the typefaces Adobe produced, in terms of multilingual coverage and typographic features.</p>
    <p>Despite being at the cutting edge of type technology, Adobe's type designs have generally been regarded as fairly conservative by the type community (despite a brief foray of adventurousness in the late 1990s). However, arguably this has kept Adobe typefaces from suffering from the "flavor of the month" phenomenon of passing popularity.</p>
    <p>website<br>
    <a href="http://www.adobe.com/type" title="http://www.adobe.com/type">http://www.adobe.com/type</a></p>
