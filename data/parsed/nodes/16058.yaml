    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/wiki/foundries" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Foundries</a>&nbsp;: Adobe&nbsp;Systems</strong></p>
    <p>Adobe Systems, founded in 1982, invented the PostScript page description language and then later various graphics software. As part of that, they invented the <a href="/node/add/wiki?edit%5Btitle%5D=Type%201" title="Create node &quot;Type 1&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Type 1</a> font format, the first scalable outline format usable on multiple vendors’ output&nbsp;devices.</p>
    <p>Adobe initially licensed most of its typefaces from <a href="/node/add/wiki?edit%5Btitle%5D=Monotype" title="Create node &quot;Monotype&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Monotype</a>, <a href="/node/13402" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal"><span class="caps">ITC</span></a> and <a href="/node/13697" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Linotype</a>. Later it began a program of “Adobe Originals,” initially led by <a href="/node/add/wiki?edit%5Btitle%5D=Sumner%20Stone" title="Create node &quot;Sumner Stone&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Sumner Stone</a>. The two famous full-time type designers for Adobe have been <a href="/node/16061" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Carol Twombly</a> and <a href="/node/16060" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Robert Slimbach</a>, although many other Adobe staffers have designed one or two&nbsp;typefaces.</p>
    <p>In the early 1990s, Adobe invented the “multiple master” flavor of Type 1 fonts, with interesting axis-based capabilities. In the late 1990s, Adobe moved away from Type 1 and multiple master fonts to collaborate with Microsoft on the development of the <a href="/node/12420" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">OpenType</a> font&nbsp;format.</p>
    <p>At the same time, Adobe’s output of original designs slowed, and in the 2000s it became just a trickle. This was due both to cutbacks in font development staff and funding, and also to the increasing size and complexity of the typefaces Adobe produced, in terms of multilingual coverage and typographic&nbsp;features.</p>
    <p>Despite being at the cutting edge of type technology, Adobe’s type designs have generally been regarded as fairly conservative by the type community (despite a brief foray of adventurousness in the late 1990s). However, arguably this has kept Adobe typefaces from suffering from the “flavor of the month” phenomenon of passing&nbsp;popularity.</p>
    <p>website<br><a href="http://www.adobe.com/type">http://www.adobe.com/type</a></p>
