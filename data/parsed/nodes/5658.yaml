    html: <p>Took a quick look through Letterhead Fonts, but didn't see anything quite like it.  It doesn't look like anything I have already collected for the Script Font ID Guide, so I'm inclined to guess it's a custom design. It does appear to be a font, and not hand drawn, I think, unless whoever lettered it is very consistent and steady.</p>
