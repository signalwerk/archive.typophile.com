    html: <p>Thanks for the advice Jesus. Thanks for looking too Mike. Upon looking at the credits on the website, it appears that Mark Allen did the Calligraphy. He's released one font back in 1994.. the name of that murdered ceasar in "The Gladiator". But nothing else. It appears my chances of getting text that looks just like this is nill. I suppose Bickham Script is still my favorite <img src="https://web.archive.org/web/20141114081104im_/http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
