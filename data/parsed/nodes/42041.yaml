  html: |-
    <p>I've managed to escape knowing these two typefaces, although they're quite popular. The first is the sans serif Print magazine uses for its body copy. It's a wide typeface, and is rounded when it's bolded. Does anyone know this without me scanning and posting it?</p>
    <p>The second (I've attached) has a lowercase l that curves at the baseline and a slightly squared o.</p>
