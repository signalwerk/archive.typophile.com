      <p>ARMED FORCES POLICE: no perfect match. Some interesting alternatives: <a href="http://www.myfonts.com/fonts/nicksfonts/route-66-nf" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Route 66 NF</a> (matching almost everything, not enough bold though), <a href="http://www.myfonts.com/fonts/letterbox/berber" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Berber</a> King Caps Bold (using alternate /<a href="http://www.myfonts.com/fonts/letterbox/berber/caps-bold/glyphs.html#glyphs/508403/342" title="Click to visit an external URL." class="freelink freelink-external freelink-external">A</a> and reworking /M centre vertex), <a href="http://www.myfonts.com/fonts/marksimonson/refrigerator-deluxe" title="Click to visit an external URL." class="freelink freelink-external freelink-external">MS Refrigerator Deluxe</a> Bold (using alternate /<a href="http://www.myfonts.com/fonts/marksimonson/refrigerator-deluxe/heavy/glyphs.html#glyphs/488468/183" title="Click to visit an external URL." class="freelink freelink-external freelink-external">S</a> and reworking /M centre vertex)</p>
      <p>AOYAMA CITY: <a href="http://www.myfonts.com/fonts/chank/nicotine" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Nicotine</a> should work nicely. Alternative: <a href="http://www.myfonts.com/fonts/redrooster/los-alamos" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Los Alamos</a> Fat Man</p>
      <p>MY RUGGED 211: nothing convincing, reminding me of this previous <a href="http://typophile.com/node/99394" title="Click to visit an external URL." class="freelink freelink-external freelink-external">discussion</a>, feels really "custom" to me (mainly because of this unconventional /G)... Anyway, some alternatives: <a href="http://www.myfonts.com/fonts/coniglio/nomad" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Nomad</a> (reworking almost everything...), <a href="http://www.myfonts.com/fonts/suitcase/vafle" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Vafle</a> Condensed, <a href="http://www.myfonts.com/fonts/fdi/iwan-reschniev" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Iwan Reschniev</a> Black (reworking /G and /S terminals, not enough bold), <a href="http://www.myfonts.com/fonts/chank/nicotine" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Nicotine</a> (mainly reworking /R leg, /S transition and adding a leg to /G), <a href="http://www.myfonts.com/fonts/jnlevine/sign-kit" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Sign Kit JNL</a> (reworking /G and digits), <a href="http://www.myfonts.com/fonts/dizajndesign/komu" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Komu</a> A (the closest I guess, only needs little tweaking on /M centre vertex and /R leg to do the trick)</p>
    html_clean: |-
