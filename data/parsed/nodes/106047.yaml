    html: |-
      <p>ARMED FORCES POLICE: no perfect match. Some interesting alternatives: <a class="freelinking external" href="http://www.myfonts.com/fonts/nicksfonts/route-66-nf" rel="nofollow">Route 66 NF</a> (matching almost everything, not enough bold though), <a class="freelinking external" href="http://www.myfonts.com/fonts/letterbox/berber" rel="nofollow">Berber</a> King Caps Bold (using alternate /<a class="freelinking external" href="http://www.myfonts.com/fonts/letterbox/berber/caps-bold/glyphs.html#glyphs/508403/342" rel="nofollow">A</a> and reworking /M centre vertex), <a class="freelinking external" href="http://www.myfonts.com/fonts/marksimonson/refrigerator-deluxe" rel="nofollow">MS Refrigerator Deluxe</a> Bold (using alternate /<a class="freelinking external" href="http://www.myfonts.com/fonts/marksimonson/refrigerator-deluxe/heavy/glyphs.html#glyphs/488468/183" rel="nofollow">S</a> and reworking /M centre vertex)</p>
      <p>AOYAMA CITY: <a class="freelinking external" href="http://www.myfonts.com/fonts/chank/nicotine" rel="nofollow">Nicotine</a> should work nicely. Alternative: <a class="freelinking external" href="http://www.myfonts.com/fonts/redrooster/los-alamos" rel="nofollow">Los Alamos</a> Fat Man</p>
      <p>MY RUGGED 211: nothing convincing, reminding me of this previous <a class="freelinking external" href="http://typophile.com/node/99394" rel="nofollow">discussion</a>, feels really "custom" to me (mainly because of this unconventional /G)... Anyway, some alternatives: <a class="freelinking external" href="http://www.myfonts.com/fonts/coniglio/nomad" rel="nofollow">Nomad</a> (reworking almost everything...), <a class="freelinking external" href="http://www.myfonts.com/fonts/suitcase/vafle" rel="nofollow">Vafle</a> Condensed, <a class="freelinking external" href="http://www.myfonts.com/fonts/fdi/iwan-reschniev" rel="nofollow">Iwan Reschniev</a> Black (reworking /G and /S terminals, not enough bold), <a class="freelinking external" href="http://www.myfonts.com/fonts/chank/nicotine" rel="nofollow">Nicotine</a> (mainly reworking /R leg, /S transition and adding a leg to /G), <a class="freelinking external" href="http://www.myfonts.com/fonts/jnlevine/sign-kit" rel="nofollow">Sign Kit JNL</a> (reworking /G and digits), <a class="freelinking external" href="http://www.myfonts.com/fonts/dizajndesign/komu" rel="nofollow">Komu</a> A (the closest I guess, only needs little tweaking on /M centre vertex and /R leg to do the trick)</p>
