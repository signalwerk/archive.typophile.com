      <p>For the bottom image, ARMED FORCES POLICE, I thought I had a list of several sans with this boxy S, but all I have at hand is a condensed version, Schmallfette Binder-Style, designed by Joseph Binder and released by D. Stempel AG in 1959. Digitized as <a href="http://www.myfonts.com/fonts/nicksfonts/bindlestiff-nf/" rel="nofollow">Bindlestiff NF</a> by Nick Curtis. If you expand it, and adjust the M, you will be fairly close.<br>
      Don</p>
    html_clean: |-
