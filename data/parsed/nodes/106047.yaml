      <p>An alternative, and perhaps easier, approach is to start with Morris Fuller Benton's Bank Gothic, make it narrower, square the sloped terminations and do other edits. A useable starting point is the Linotype version <a href="http://www.myfonts.com/fonts/linotype/morris-sans/" rel="nofollow">Morris Sans Com</a> in the Heavy Condensed Weight.<br>
      Don</p>
