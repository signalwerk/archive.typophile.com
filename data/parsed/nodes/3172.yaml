  html: "<p>I'm hopeing some of you on typophile would be able to help me with this: <br> <br>I need to find fonts that resemble fonts on your sale receipts (other than courier, letter gothic..) and a newspaper typeface (like the Mercury font designed by Hoefler Type Foundry.)  <br> <br>Sorry I don't have any scans to show at this moment.. </p>"
