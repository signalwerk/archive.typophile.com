    html: <p>If you want a rough, quick-printed dot-matrix or inkjet look for the receipt font, you could look into something like the <a href="http://www.veer.com/results.asp?Image=TPT0000075">Spikee</a>, <a href="http://www.veer.com/results.asp?Image=TPT0000076">Tickee</a> or <a href="http://www.veer.com/results.asp?Image=TPT0000063">Yeti</a> families from Test Pilot Collective.</p>
