    html: "<p>There's some free fonts in that style: <a href=\"http://www.cape-arcona.com/\" target=\"_blank\"> Cape-Arcona</a>'s  <br><a href=\"http://www.cape-arcona.com/sites/fonts/font_address.html\" target=\"_blank\"> Address Unknown</a> might do. David M. Cushman's  <br><a href=\"http://www.formsubstance.com/dirt/\" target=\"_blank\"> Receipt</a> from Dirtfonts seems currently unavailable.</p>"
