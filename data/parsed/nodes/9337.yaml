    html: <p>I agree with Ryan's reply, but if you want something similar (i.e. with the swoosh underline), you will need a graphics application, like Illustrator (to adjust and connect the swoosh), and then get <a href="http://letterheadfonts.com/contributors/tomkennedy/ballpark.shtml" target="_blank">"Ballpark Script"</a> from Letterhead Fonts, or <a href="http://www.flashfonts.com/flashsite/fontspage.htm" target="_blank">"Casey"</a> from Flashfonts. A more antique swoosh design is <a href="http://letterheadfonts.com/contributors/tomkennedy/ephemera.shtml" target="_blank">"Ephemera"</a> also from Letterhead.</p>
