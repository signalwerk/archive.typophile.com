      <p>I favor version B. It's a bit more subtle, but the line break still gets the point across. I don't see trying too hard to be clever here at all. It's a wedding . . . to the people involved, you can never try too hard.</p>
      <p>Also, don't dumb down a good design just because everyone might not get it at first. Chances are that everyone will get it right away anyway, as they'll all know the bride&amp;groom's names. </p>
      <p>penn</p>
