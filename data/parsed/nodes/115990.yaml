    html: <p>Beware of blanket statements like "all sans fonts are informal and plain" - a good sans can project a sense of  modernity and clarity. And on the other hand serifs can be stiff and fussy and project more of a schoolbook vibe. Readability and serifs is still an open discussion - well set sans can be very readable. Georgia, by the way, is a strong font and could be persuasive, but then I have seen Gill Sans do a good job as well.</p>
