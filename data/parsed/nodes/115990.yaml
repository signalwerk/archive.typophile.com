    html: |-
      <p>Besides making a font more readable, serifs are formal and elaborate (while sans fonts are informal and plain). You need such characteristic to persuade.</p>
      <p>An obvious choice here is Georgia. It's very functional, and persuasive, but it's used for so many things that it's not very focused (if that matters).</p>
      <p>hhp</p>
