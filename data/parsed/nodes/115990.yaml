      <blockquote><p>Best done by the writing, not the font selection.</p></blockquote>
      <p>That's like somebody asking for an opinion on a book he's written on a book review forum, and being told that a career choice comes first. This is Typophile, so the context is type. Chips on shoulders are best be left at the door.</p>
      <p>TheSans is a great design, but if it works well for an art book* it can't be a very good choice for this task. Specifically, I think it's too informal, too friendly here.</p>
      <p>* Central question: what kind of art? There's no way one typeface can be great for all genres.</p>
      <p>hhp</p>
