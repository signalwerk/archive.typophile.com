      <p>You are correct. That is my opinion. </p>
      <p>I’ve never typeset a book in a sans serif, but I have been using Fresco Sans for a magazine in a supportive role. It has a lot of flavour, which might be a dealbreaker, but the spacing is impeccable: ideal for text sizes. If you’re typesetting Norwegian, you’ll need to make some modifications though (obtain permission, or hire the foundry to do them).</p>
      <p>Another typeface I have worked with that I consider suitable for extended text is FF Legato.</p>
      <p>Some other sans serifs I’d like to look closer at in the future includes FF Milo, Seravek, FF Balance, DTL Haarlemmer Sans and DTL Documenta Sans.</p>
