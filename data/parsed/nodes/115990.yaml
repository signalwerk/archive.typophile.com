    <p>Hi all,</p>
    <p>I am new to the forums and hoping to get some much needed advice. </p>
    <p>I am in the business of writing formal reports that convince the reader of a particular argument - much like a lawyer just not as ultra formal. I currently use Calibri but I have decided to search for a different sans serif font as I have read that system fonts are generally poorly designed. </p>
    <p>I seek a sans serif font which is versatile enough to be used on screen and in print whilst holding the readers attention and maintaining legibility over long body copy. I would like a sans serif font that is interesting but maintains a certain degree of formality so as to remain credible.  </p>
    <p>I came across MVB Solitaire which seems to have had good reviews. I would greatly welcome any other suggestions from the community. </p>
    <p>Your advice is very much appreciated. </p>
    <p>Many thanks</p>
