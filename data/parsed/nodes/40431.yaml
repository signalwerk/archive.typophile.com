      <p>The first thing to consider is, "What are you after?" Any document you prepare should not violate good Unicode practice; that is, if it is to have any life beyond what you are preparing. A <cite>manuscript</cite> -- I suppose now more properly termed a <cite>typescript</cite> -- usually has a further life. For example, if if is to be published, the files used to print your typescript will be edited by a publisher -- usually using a computer with a different operating system &amp; perhaps a different text editor than you used (Murphy's law). Then those files will be passed on to a typesetter. It really helps if the files that will be worked on by the editor and typesetter use proper Unicode.</p>
      <p>So, what you are after is making OpenType features that let you typeset and print your typescript as you want it to appear, using Charis as a font. Unless you are providing "camera-ready copy" (i.e., the publisher requires you pay the typesetting bill, &amp; you're getting around that by setting it yourself), I can almost guarantee you Charis will not be the font the publisher's designer finally picks. It likely won't even be Charter.</p>
      <p>Nor are you designing a typeface for sale --  it will be just for your own use.</p>
      <p>So it seems to me that likely the only person you have to please is yourself, and you can hack the code anyway you want.</p>
      <p>If that's right, aside form finessing the glyphs the way you want, all you need do is write some features. For small caps, just look at how Adobe does it.</p>
      <p>Best I can tell, Adobe doesn't usually provide (foot)note calls (I'd guess what you are terming "superiors"). These should be made up just like the small caps, i.e., named something like "zero.super" with no Unicode index, then use a feature -- you can use the InDesign "superscript" feature -- to set them. If you have the numbers as superscripts in your file (i.e., U+2070-U+2079 plus 00B9, 00B2, and 00B3), then using any other font that lacks these characters means they drop out. Not what you want. Use  regular 0-9 in the file &amp; write a feature to get the "superscript" glyphs in your typescript.</p>
      <p>Also see the thread</p>
      <p><a href="http://typophile.com/node/16879" title="http://typophile.com/node/16879">http://typophile.com/node/16879</a></p>
      <p>For kerning, there are many posts on this forum on writing class-based kerning. There are -- or at least were --pretty good threads on small caps &amp; other number forms too, but most of these were back before the server was changed, &amp; I don't have a reference.</p>
      <p>Hope this helps. If you are trying to turn Charis into a font that can be used for general bookwork, I'd be interested -- even to the point of helping -- but my time is pretty much committed. We would also have to take a good look at the license &amp; make sure we are adhering to it. And I have to say, I'm only a typesetter, there are a lot better code-writers &amp; glyph designers out there.</p>
      <p>FWIW</p>
      <p>Charles</p>
