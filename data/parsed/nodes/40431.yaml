      <p>Jcrippen, </p>
      <p>you may not be aware that Charis is in fact an extended version of Charter, a typeface designed by Matthew Carter for Bitstream and later licensed to ITC. There are OpenType versions of Charter that include typographic small caps, olstyle numerals and other characters that may be of your interest. </p>
      <p>There is the an excellent <strong><a class="freelinking external" href="http://www.font.org/ptCharter" rel="nofollow">ParaType "multilingual"</a></strong> version of Charter in OpenType PS format with 866 glyphs per font, including Latin Extended, Cyrillic Extended (very well designed, much better than the one in Charis), Latin smallcaps, Cyrillic smallcaps and oldstyle numerals, but not superscripts. </p>
      <p>Then, there is the <strong><a class="freelinking external" href="http://www.font.org/mf/fonts/bitstream/charter-bt-pro/" rel="nofollow">Bitstream "Pro"</a></strong> version of Charter in OpenType PS format with 603 glyphs per font, including Latin Extended, Latin smallcaps, oldstyle numerals, superscripts but no Cyrillic. </p>
      <p>There is also the <strong><a class="freelinking external" href="http://www.font.org/fc/FindFonts/RecentReleases/2007/CharterPro.htm" rel="nofollow">Monotype ITC  "Pro"</a></strong> version of Charter in OpenType PS format that includes Latin Extended, Latin smallcaps, subscripts and superscripts, but no Cyrillic. </p>
      <p>Finally, there is the <strong><a class="freelinking external" href="http://www.font.org/mf/fonts/linotype/itc-charter/" rel="nofollow">Linotype ITC  "Com"</a></strong> version of Charter in OpenType TT format with 383 glyphs per font, including Latin Extended. </p>
      <p>You may consider using one of those versions (e.g. the ParaType version) in conjunction with Charis, rather than trying to expand Charis yourself. </p>
      <p>Regards,<br>
      Adam</p>
