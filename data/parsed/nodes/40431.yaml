      <p>About English smallcaps, all of them but four are defined in Unicode, and also in Charis. You find their unicode position by searching for the string 'LATIN SMALL CAPITAL LETTER' in the file <a href="http://www.unicode.org/Public/UNIDATA/NamesList.txt" title="http://www.unicode.org/Public/UNIDATA/NamesList.txt">http://www.unicode.org/Public/UNIDATA/NamesList.txt</a>. You can design those that are missing ("F", "Q", "S" and "X") in some corporate position, say uniF7xx.</p>
      <p>To make them "functional" i.e. get them to work with <code>\textsc{}</code> in xeLaTeX, you need to fill the GSUB 'smcp' subtable that already figures in CharisSIL but was left empty.  With  FontForge, you click on <a href="http://fontforge.sourceforge.net/fontinfo.html#Lookups" rel="nofollow"><code><strong>Element &gt; Font info &gt; Lookups</strong></code></a>, then <code><strong>GSUB</strong></code>, open the tab <code>'smcp' Lowecase to Small Capitals lookup 28</code> and double click on <code>'smcp' Lowercase to Small Capitals lookup 28 subtable</code> and fill the subtable by repeatedly clicking on <code>&lt;New&gt;</code>, putting the lowercase on the left and the name of the corresponding smallcap on the right. Here is what it looks like after filling the smallcaps from 'a' to 'c'.  </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/smcp_gsub_4139.jpg"></div><p></p>
      <p>When you are finished, you click OK for the subtable, OK for the lookups.</p>
      <p>For kerning you click on <code><strong>Windows &gt; New Metrics Window</strong></code> and do as told <a href="http://fontforge.sourceforge.net/metricsview.html" rel="nofollow"><strong>here</strong></a>. </p>
      <p>Michel</p>
