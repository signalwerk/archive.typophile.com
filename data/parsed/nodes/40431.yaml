      <p>Everyone,</p>
      <p>Thanks bunches for all the comments and recommendations. I’m going to tinker with Charis for a while until I’m either satisfied or fed up with it. As charles_e pointed out, my needs tend towards the phonetic symbology more than anything, but I’m also trying to be sensitive to good typography and book design, something that is all too frequently ignored in linguistics, waved away by the claim that “all those funny symbols are hard enough”. So I’m trying to put together a typeface that has both good body text quality as well as good appearance in complex tables and which still supports difficult phonetics typesetting problems (like tone bars and multiple stacked diacritics, for example). Hopefully I’ll be able to put together something good enough for personal use, if not public scrutiny.</p>
      <p>BTW, I would never trust some faceless publisher to prepare my work. I’ve seen far too many ugly disasters from supposedly well-informed publishers in the linguistics world. I’ve put many years into learning how to hack TeX/LaTeX and now Xe(La)TeX, so I much prefer delivering camera ready copy rather than relying on random grad student drones cut-pasting text into ancient kluged up templates and munging the resultant mess to fit some heartless “Times Roman or Nothing” requirement. I’ve seen some decidedly awful muck published by supposedly respectable publishers (I’m looking at you, Mouton de Gruyter), with letters swapped in from various fonts with different x-heights, and worse yet, obviously rescaled versions of raw Word documents blithely disgorged onto a press and then sold to libraries at usurious prices. I’ve no intent to repeat such monstrosities.</p>
      <p>Also, as a regular user of XeTeX, as well as being fairly well versed in various text encoding problems, I’m acutely sensitive to the misuse of characters. I’d never abuse assigned characters just for their appearance, and much prefer having proper features in the font. Since Charis is open-licensed, I figured I’d just hack in the features I wanted and wouldn’t have to worry overmuch about licensing issues. I’d much rather be using, say, Aldus &amp; Palatino, but then I’d have to create all the phonetic glyphs and other symbols on my own and then subsequently worry about the legality of it. I figure that adding features and tweaking a few shapes is probably somewhat easier than designing a complete set of IPA glyphs and a bunch of obscure diacritics.</p>
