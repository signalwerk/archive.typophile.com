      <p>James,</p>
      <p>When it comes time to publish a book, let me know. I'm not sure which university presses have a publishing program that includes linguistic studies (check the AAUP website), but I do know a number of university presses that use typesetters who will not commit any of the atrocities you mention. I'm not going to get into particular presses on a public forum. Of course, you have to get them to accept the manuscript -- easier with a subsidy, BTW. </p>
      <p>For commercial publishers, you're on your own, but they may be quite happy to take camera-ready copy. </p>
      <p>In passing, we used TeX for almost 20 years -- our implementation was called Buffalo Tex, so named by my business partner who wrote the macros &amp; pagination program. He was originally from Borneo, and felt this implementation was as good a workhorse as a water buffalo, &amp; I agree. The problem was color management. I don't know if the other, more popular TeX-based programs have dealt with this -- esp. for color images. Color management (profiling a printer's press &amp; paper) for B&amp;W was possible with our TeX, but color images were a nightmare. Could be done, but "danger lurked at every twist &amp; turn." If your work involves images, you need to pay attention to this aspect.</p>
      <p>Good luck with it.</p>
      <p>BTW, Aldus metal was wonderful, Aldus PostScript Type 1 was pretty bad. I don't know if any foundry has reworked it since then. Charis with longer descenders &amp; a touch higher ascenders, ligatures, etc. would be a nice font for linguistics. I can't off the top of my head remember the parentheses, but they can be more of a problem in linguistics than some other fields -- dramatic plays are another type of work where the parenthesis are important, esp. how italic letters fit following (or preceding) a roman paren. Etc.</p>
