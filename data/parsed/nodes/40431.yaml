    <p>I need to do some low level hacking on Charis SIL for some linguistics texts that I’m writing. Charis SIL has all the weird diacritics, phonetic symbols, and other characters that I need for the basic text, but it lacks functional small caps, there are a bunch of kerning problems, and there are a few glyph shapes that I want to adjust (the super- and subscript numbers were obviously just scaled down and are thus too light, for example). I’ve never done serious font design, so the only thing I know how to do is add glyphs and tinker with outlines. But now I’m faced with doing some OpenType stuff that I have no understanding of. Are there any good references on how to go about adding small caps, alternate forms, and other OpenType things to a font? Better references than just reading the standard and trying to figure it out on my own?</p>
    <p>I’m probably going to use FontForge for the job, since I’m already somewhat familiar with it. I could use FontLab, but I don’t know my way around it at all.</p>
    <p>Any suggestions on where to start?</p>
