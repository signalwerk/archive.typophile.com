      <p>Adam, (he said, jumping in again), thanks for the information. I use Charter a fair bit, &amp; if I get a project and want to use Charter where Cyrillic is needed, I'll certainly get the Paratype version.</p>
      <p>But for a linguist, esp. one doing work with an orthography for languages that never had a written form, phonetic symbols are usually needed, as are the full compliment of combining accents and space-modifying diacriticals. These are in Charis, &amp; while I don't have access to the versions of Charter from the foundries you mention, I'd doubt they are included.</p>
      <p>Moreover, the licenses of Monotype &amp; Linotype seem to prohibit an end user from modifying the font for their own use.</p>
      <p>Mixing Charter &amp; Charis is possbile, but the size &amp; weight of Charis is a bit greater than Charter, at least the versions I have. It would be quite a lot of work to make them mix in a document, but you could do the work once &amp; add them to the font, licensing permitting.</p>
      <p>The world really needs a few typographically good Open Source Fonts with the character complement of Charis.</p>
