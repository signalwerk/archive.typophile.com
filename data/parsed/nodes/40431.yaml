      <p>While most small caps are now *defined* in Unicode (after some version number), whether or not you want to use the ones with a Unicode number in a document is another question. It is the same problem as putting the Unicode superiors in the file for (foot)note calls. If you open that file with a different font which lacks the small caps or superiors in Unicode, they will not show; and you can't apply any scaling or sizing tricks to characters that don't show. And using the Private Use area does not make the document any more transparent.</p>
      <p>For a document that will have further uses, I still think small caps should be presented in a particular instance (i.e., the book) via a  feature. What should be in the file are full caps or lower-case letterforms, whichever is the (second) best choice.</p>
