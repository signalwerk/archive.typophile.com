    html: "<p><em>Important note</em> : although Unicode includes a number of 'LATIN SMALL CAPITAL LETTER' characters, these are not intended for use as typographic smallcaps. These are phonetic transcription characters, and are encoded because, unlike stylistic smallcaps, they need to be unambiguously distinguished from uppercase or lowercase characters in plain text. Typographically, these characters need to align to the font x-height and spaced to fit with lowercase letters, so are typically shorter than stylistic smallcaps would be and more tightly spaced.</p>"
