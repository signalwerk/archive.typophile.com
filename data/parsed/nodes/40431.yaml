      <p>&gt; <cite>I realize that FontForge is having troubles with Charis' features.</cite></p>
      <p>Charis contains both AAT and OpenType tables, with some that are shared and, thanks to George Williams, the <a href="http://sourceforge.net/project/showfiles.php?group_id=103338" rel="nofollow">last version of FontForge</a> can now tackle that cross bred beast. What I described above gives a font that seems to work well with TextEdit provided the font is saved with both "Apple" and "OpenType" tables (I tried with charis-4.012).</p>
