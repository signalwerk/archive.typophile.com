      <p>I typically associate that peak of fanzines with the 80s and 90s and as such you may want to look at grunge fonts. This recently created thread on <a class="freelinking external" href="http://typophile.com/node/97963" rel="nofollow">grunge fonts</a> might be a good place to start.</p>
      <p>You may also find <a class="freelinking external" href="http://www.fontsquirrel.com/fonts/list/style/Grunge" rel="nofollow">Font Squirrel's filter for grunge fonts</a> a good source and the variety of filters on dafont's web site.</p>
