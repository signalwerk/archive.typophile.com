      <p>Recently worked with Rich Jacobs who curates a show of old 80's / 90's skate/punk zines called MOVE - to release a font of his handwriting. He still authors a hand made zine called MOVE and we thought his hand lettering was really unique - so we made a font of it  - You can see it here : <a href="http://www.voltageltd.com/move-zine/" title="http://www.voltageltd.com/move-zine/">http://www.voltageltd.com/move-zine/</a></p>
