      <p>There are many types of contemporary 'zines using all kinds of typography, as you can see from the link in Nathaniel's post. Restricting yourself to grunge doesn't make a lot of sense.</p>
      <p>Gestalten published a book on the topic: <a href="http://shop.gestalten.com/books/behind-the-zines.html" title="http://shop.gestalten.com/books/behind-the-zines.html">http://shop.gestalten.com/books/behind-the-zines.html</a></p>
      <p>I don't think there's a typeface that is specifically "zine." However, there is a common thread amongst 'zine publications -- and that is form, formal experimentation, materials and budget constraints. It would be nice if your mode of production used in your project somehow recognized these material interests.</p>
