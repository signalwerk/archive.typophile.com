  html: |-
    <p>While not mind-bogglingly impressive this super old Unger design looks sophisticated enough this if it were released this very day it would not feel out of place. (a lo-fi Kontrapunkt condesed?)</p>
    <p>He also has readability down-packed... notice the ink traps and slabs.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/NAGO_PB00672a_X_1114608828_4054.jpg"></div><br>
    <a href="http://www.hetnago.nl/object.php?id=10666" title="http://www.hetnago.nl/object.php?id=10666">http://www.hetnago.nl/object.php?id=10666</a><p></p>
    <p>But the best part?...</p>
    <p>Notice his handwriting. Don’t you need that!? I do. Mr. Unger needs to digitize it right now.</p>
    <p>Squatty x-height, low contrast, and semi-connections. What’s not to love!</p>
    <p>Mikey :-)</p>
