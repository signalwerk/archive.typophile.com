    html: |-
      <p>It is a counter-proposal, Unger’s reaction to the <a href="http://fontstruct.fontshop.com/fontstructions/show/new_alphabet" rel="nofollow">New Alphabet</a> by <a href="/wiki/Wim%20Crouwel" class="freelinking" rel="nofollow">Wim Crouwel</a>.</p>
      <p>Unger wrote:</p>
      <p>Result differs too much from the original.<br>
      Too many subtleties become lost.<br>
      For the old forms, one needs to invent new subtleties that can be reproduced well by the new machines.</p>
