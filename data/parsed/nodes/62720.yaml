    <p>Just wandering if anyone can help me indentify this font.<br>
    It is used in the book Wonderful Wiener Werkstatte — Design in Vienna 1903-1932 by Christian Brandstatter.</p>
    <p>Berlin Grotesk is close, but not a clean cut.<br><a href="http://new.myfonts.com/fonts/berthold/berliner-grotesk-be/medium/">http://new.myfonts.com/fonts/berthold/berliner-grotesk-be/medium/</a></p>
    <p>Thanks!</p>
