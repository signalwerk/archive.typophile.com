      <p><cite>I have seen "Optimise" and "Clean up" functions in FLS5 but they appear to alter the curves a bit.</cite></p>
      <p>Indeed they do. But can you tell the difference? </p>
      <p>The answer to that is mainly how you look for the difference. One way is to toggle back &amp; forth with the glyph displayed at 256 points &amp; watch things change. Yup, it's different.</p>
      <p>Another way is to print out the characters, both the original ttf and the optimized .otf, using a laser printer, at, say, 12 point (or whatever size will typically be used). Shuffle the paper &amp; go home. Come in the next day, look only at the paper, and see if you can tell them apart.</p>
      <p>We use to do this with loudspeakers, after raunchy stereo salesmen would try &amp; tell us how much "better" the more profitable speaker system was. The "we" here is a couple recording engineers, who had far better ears than the salesman.</p>
      <p>So the parallel for you, if you can't tell the glyphs apart, when used as they will be used, would be to get a type designer to critique the differences -- again, as used, not at 256 points on the screen, overlayed.</p>
      <p>(Loudspeakers? I use Magneplaners. There are better choices if you're into rock 'n roll with a lot of bass... Otherwise, plan on a lot more money...)</p>
