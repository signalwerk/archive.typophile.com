      <p>Peter, much is going to depend on how the TTF outline looks to begin with. If a quadratic bezier outline has been fairly cleanly defined with on-curve points used only at extrema and where necessary, FontLab Studio -- Windows, at least, I've never tried the Mac version -- does a remarkably good job of converting to an accurate cubic (PS) bezier without introducing interpolated on-curve points between extrema. This illustration shows an original TTF outline and a converted PS outline; note that the number of cubic nodes is not affected by the number of off-curve quadratic points in the original:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ttf2ps_6632.png"></div><p></p>
      <p>It is as accurate in its preservation of curve quality as I think you can get given the fundamental differences in the mathematics involved. At typical type sizes, even at high resolution, these differences are smaller than the eye can discern. Here are the two outlines superimposed:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/overlay_3822.png"></div><p></p>
      <p>If the original TTF outline is less cleanly defined, then FontLab will tend to multiply the number of PS points, sometimes inserting them everywhere that the TTF off-curve points imply an intermediate on-curve point. The earlier FontLab conversion algorithm did this everywhere.<br>
      _____</p>
      <p>David, I'd be interested in seeing some illustrations of the results of the two RoboFont options. I think I understand what you mean, but pictures, thousands of words, etc..</p>
