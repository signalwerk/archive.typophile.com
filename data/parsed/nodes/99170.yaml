    html: <p>The InDesign cursor scaling bug was fixed some time ago. However, we've found issues with some third-party PDF creators that assume a 1000 unit em for CFF fonts, and that mess up scaling and metrics. This won't stop us from producing fonts with higher UPM values if the details of the individual design require it, but it does mean that we try to stick to 1000 for PS fonts whenever possible.</p>
