    html: |-
      <p>It is not necessary to change the UPM size to 1000 for an OpenType font. There are many typophile threads attesting to this.</p>
      <p>IIRC, the 1000 limitation applies to Type 1 fonts (pfb/pfm) but NOT to CFF OT fonts.</p>
      <p>Are there any known circumstances where a CFF OT  will fail if it has a UPM other than 1000? Six years ago Adam Twardoch said that InDesign assumes 1000 and uses a text cursor to match, so if the font has a UPM of 2000 the cursor would be sized at 50%.</p>
      <p> - Herb</p>
