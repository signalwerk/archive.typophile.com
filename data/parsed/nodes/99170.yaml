      <p>I think mathematically/theoretically you cannot reduce data (while preserving the shape) via conversion, you can only increase it. The number of on-curve points (of which a quadratic derivative <em>may</em> have fewer) is only half the story; off-curve points (of which a cubic original <em>necessarily</em> has fewer) have to be there too.</p>
      <p>hhp</p>
