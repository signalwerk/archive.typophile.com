      <p>There are two flavours of OpenType (OT): Compact Font Format (CFF) aka PostScript (PS), and TrueType (TT). The main difference between a TT font and a TT-flavoured OT font is the presence of OT look-up tables in the latter.</p>
      <p>Meaning? Unless you absolutely <em>need</em> the font to have the CFF flavour, leave it as TT. You and the world will be much happier.</p>
