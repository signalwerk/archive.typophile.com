    <p>Hi, I have been reading about the advantages of OTF format and want to extend an old font beyond standard latin alphabet (A-Z). However, the font is originally in TTF format. I am wondering, after looking at the various pages on this site, is there a way of reducing the number of nodes in a OTF that has been converted from TTF without altering the shape of the glyph? I have seen "Optimise" and "Clean up" functions in FLS5 but they appear to alter the curves a bit. </p>
    <p>Also when reducing the font from 2048 to 1000 em, what is the best way of doing it? Clean up everything first, then reduce, or reduce first, then clean everything up?</p>
    <p>Thanks for your help.</p>
  html_clean: |-
