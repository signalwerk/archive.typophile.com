  html: <p> How does one calculate appropriate licensing fees for broadcast? Specifically a network television sitcom using freeware fonts for opening credits? <br> <br>Both MTV's The Osbournes and CBS's Still Standing are using my freeware fonts primarily in the main title sequences of both shows. <br> <br>In the case of The Osbournes, the font usage has spilled out into licensed merchandise and continues to grow the brand based upon my work. <br> <br>I'm usually not a stickler about licensing nor am I trying to be greedy and take money out of the franchise. I do however feel that if a major network is going to use a typeface as the basis of the brand of the show that they would attempt to compensate the typeface creator by acquiring the appropriate licensing for the font. <br> <br>While it is truly flattering and I'm excited to see the fonts in use so notibly, no attempts to contact me have been made by either network. <br> <br>I open it up to the group to offer any advice, opions, or suggestions as to what would be fair compensation for the usage. <br> <br>Thanks for the ear, <br>Stuart :D </p>
  html_clean: <p> How does one calculate appropriate licensing fees for broadcast? Specifically a network television sitcom using freeware fonts for opening credits? <br> <br>Both MTV's The Osbournes and CBS's Still Standing are using my freeware fonts primarily in the main title sequences of both shows. <br> <br>In the case of The Osbournes, the font usage has spilled out into licensed merchandise and continues to grow the brand based upon my work. <br> <br>I'm usually not a stickler about licensing nor am I trying to be greedy and take money out of the franchise. I do however feel that if a major network is going to use a typeface as the basis of the brand of the show that they would attempt to compensate the typeface creator by acquiring the appropriate licensing for the font. <br> <br>While it is truly flattering and I'm excited to see the fonts in use so notibly, no attempts to contact me have been made by either network. <br> <br>I open it up to the group to offer any advice, opions, or suggestions as to what would be fair compensation for the usage. <br> <br>Thanks for the ear, <br>Stuart :D </p>
