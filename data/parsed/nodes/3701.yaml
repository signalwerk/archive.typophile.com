    html: "<p> While 'threaten' may be too strong a word, I  <br>agree. You have to make it absolutely clear  <br>they're dealing with the Font Diner 'legal' or  <br>'licensing department' and not with Stuart  <br>Sandler, the small-beans, nice guy, type  <br>designer. <br> <br>Here's an approach: <br> <br>Write a letter (from your Font Diner licensing  <br>dept.) saying you're aware they're using the  <br>fonts in violation of the licensing agreement.  <br>Attach an invoice to the letter. No confrontation  <br>or name-calling necessary. It gives them the  <br>benefit of the doubt and doesn't paint you as a  <br>pushover. <br> <br>Then if they don't pay it, you'll have more  <br>ground to call a lawyer or seek legal action. <br> <br>Good luck with it. (And geez, don't apologize <br>for having a successful font!) <br> <br>PS -- I'd love to see the work... <br> <br>PPS -- Please don't misconstrue this as bona <br>fide legal advice. (I only play a lawyer on <br>the web.) </p>"
