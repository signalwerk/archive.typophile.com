    html: <p>Thanks for the tip Jim, however it has reached internet saturation already as that. <br> <br><a href="http://www.google.com/search?hl=en&amp;lr=&amp;ie=ISO-8859-1&amp;q=osbournes%2Bfont">googled here</a> <br> <br>Different than the Harry Potter face, this font was always freely distributed. It wasn't until this discussion I transitioned my Silverware library to TT only and the end user needed to buy the commercial license of the face to get the PS version and the license. <br> <br>By the way Joe, I took your suggestion but sent 'em an invoice and it eventually was paid. Not by MTV or the production company who did the titling, but by the artist who designed the credits because font licensing was his responsibility to MTV. <br> <br>Oh well, the license expires each season, so if I see the faces used come fall, you can bet another invoice will be showing up in MTV's mailbox. <br> <br>Stuart :D</p>
