    html: <p> I had contacted MTV but they were not at all responsive and frankly I don't have the $$$ to sick a lawyer on them. <br> <br>You are correct, there are no specific terms in my freeware licensing that would protect the fonts from use without some commercial license in place. <br> <br>Other thoughts that I had entertained were to revised the license on my freeware faces to include something to the effect of if it's used for broadcast the Font Diner must be credited or a commercial license must be purchased. <br> <br>If I tell people they must purchase a commercial license for commercial use, I'll get a ton of e-mail from individuals wanting to use it on their business cards and websites. Those aren't the folks I am concenred with as much as I am a major network or company. <br> <br>Another great suggestion I received was to create a "pro" version of the fonts and release them as commercial quality at either my site or My Fonts. Right now, the fonts were done very early in my font making career and are quite techincally poor quality. <br> <br>Perhaps it would encourage people to pay up for the better versions. Not becuase I intended it that way by releasing a lower quality first font, but becuase the older version is really quite horrid. <br> <br>Stuart </p>
