    html: |-
      <p>(Limited Budget + Unlimited Number of Users) = Not gonna happen with any commercial font/foundry.</p>
      <p>About the only way you could pull this off is to commission a custom face/faces of your own, but that's gonna put you way over budget too.</p>
      <p>Try sticking to "core" fonts that ship with most/all computers these days (Times Roman, for example). Heck, even Apple only uses a dozen or so faces in their Keynote templates, and they've got deeper pockets than most.</p>
