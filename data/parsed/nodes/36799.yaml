    html: |-
      <p>Font embedding as defined in the OpenType and TrueType specs relates to embedding fonts in 'documents', I think font vendors might take the position that "templates" are not documents in this sense. </p>
      <p>If you (or your attorney) can successfully argue that templates are 'documents' then you might look to 'editable' embedding fonts. Two big gotchas here, the only people who regularly set their fonts to editable are Microsoft and Adobe, second gotcha would be that most font EULAs wouldn't allow commercial redistribution.</p>
      <p>So in my opinion embedding is a dead-end here, especially if it's a way to avoid paying licensing fees. </p>
      <p>You might want to look at what Ascender did with their Creativity Font Pack where the fonts are bundled with templates.</p>
