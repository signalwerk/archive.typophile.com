  html: |-
    <p>I want to sell stationary templates which will have fonts embedded, but am struggling to find a font that allows this, as I will not be able to control the end number of users. Does anyone have a suggestion as to where I could buy a font for this use? Its only a small personal project of mine, so there is a very limited budget.</p>
    <p>Thanking you in advance for any assistance offered.</p>
