    html: "<p> Posts missing!? <br> <br>Clive Barker: site has no style sheets, and is poorly designed and coded. Is that what you meant? <br> <br>Netscape 4.79 is browser of choice for one reason alone: it doesn't tolerate mistakes in code as IE does. Also, given the developing nature of CSS it's a prerequisit to test in multiple browsers. <br> <br>The issue with the highlighted page is that the functionality doesn't carry from page to page within the site, and it's poor user interface design to rely on something that will change in implementation from site to site (or even page to page). Built-in browser functionality is preferable, and more consistent. <br> <br>It's such a good idea that MS stole the idea from it's Mac Business Unit and put it into Win browsers too. <br> <br>The latest Nav/Mozilla releases are both stable and fast, something IE on the Mac hasn't been up to 5.1.3 (everything before was a dog!). Mac IE 5.1.3 still has bugs with encoding and form submission, but it is getting better. <br> <br>The one thing IE does better than Nav 4.x is render complex tables quickly - but the Nav/Mozilla 6.x releases make up for that. <br> <br>As for consistency - sure IE is more consistent, but that's just because so many people (idiots) use it as their benchmark and don't test in other browsers. <br> <br>The really dumb thing about IE up to the most recent releases was that the Win version running under emulation in VPC was faster than the \"native\" Mac version!? </p>"
