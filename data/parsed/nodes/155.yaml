    votes: null
    html: <p>Joe, long term I think it's a mistake to not "test against a huge amount of variables" -  web sites take just as long, if not longer, as print to put together. Some of those sites are going to be "historical records". <br> <br>Right now there aren't many sites that have been up, and intact, for four years or more, but I've certainly worked on "sub-sites" that are pretty much intact from the day they first went up - in that time period. <br> <br>No one is really going to want to come along five or ten years later and tear those things apart again to make them work (because someone relied on the dominant browser of the time - which had non-standard features). Clean code is your future - no one wants to go back and do it again, elegance in code is just as evident as elegance in design. <br> <br>Four year's ago IE had next to no market share, things will change as development goes on in the morass that is HTML development. Right now, IMO the market choice for browsers is richer than it's ever been - there are at least three different Gecko-based browsers, IE, iCab, OmniWeb and Opera - just for the Mac. The 6.x releases of Mozilla and Netscape are pulling together nicely, the other Gecko browser, Chimera has some nice features and is well integrated into MacOS X. <br> <br>With AOL switching its browser to a Netscape-based offering it's clear to me that the competition is far from over. <br> <br>&lt;blink&gt;"My name is Joe"&lt;/blink&gt; (too)</p>
