    html: <p> Kermie, I still find IE a bit of a dog, I also think you have to put the whole thing in a little bit of historical context. I like Nav 4.x because it's low overhead (processor, memory and HD) and it's pretty stable. IE renders... how people think they want things to render, but it's a processor hog, it wants plenty of RAM and at regular intervals it just stops working. <br> <br>Although, 5.1.3 is much improved over 5.0. <br> <br>On the other hand we have several 'Zilla/Gecko based browsers - which are standards compliant - if a little wobbly. <br> <br>The historical angle with Nav 4.x is that it's old code, I think v4 was launched about 98, when IE was truly... not good. <br> <br>As far as standard compliance goes, we wouldn't have gotten very far if Netscape hadn't pushed the boundries - tables were a Netscape, unofficial, extension to the HTML spec. </p>
