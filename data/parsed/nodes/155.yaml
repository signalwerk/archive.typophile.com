    html: '<p> Clive, I think your obviously strong dislike of MS is preventing you from seeing what most of us clearly do: overall, IE is a better browser (irrespective of how it got there). <br> <br>I happen to use NS4.7x, but simply because I have a massive "legacy email" situation, and the handful of sites I go to are adequately stable under NS. But whenever somebody points me to a new site, I simply dread clicking on the link, and like one time out of four my dread ends up being justified! :-/  In which case I fire up IE, and go to that site, with very rarely a problem. <br> <br>Use the newer versions of NS? There are more horror stories there. <br> <br>The bottom line is this: <br>Compliance, shmompliance - people need tools that *work*. <br> <br>hhp </p>'
