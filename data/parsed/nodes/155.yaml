    date_raw: 11 Apr 2002 — 12:32am
    votes: null
    html: "<p> Do you mean design purist? If that's what you  <br>mean, then I'm guilty as charged. (HTML is not  <br>a pure art. People have been breaking HTML  <br>to make it work since before Al Gore invented  <br>the 'net.) <br> <br>On the web there are a hundred things that  <br>are beyond a designer's control (color,  <br>resolution, browsers, fonts, platforms,  <br>plugins). I'm all for reigning in what I can.  <br>Which means I want to know what px size my  <br>user's type is in order to craft that experience. <br> <br>My take: if you have a really long block of  <br>content, run it in a narrower column with  <br>slightly more line spacing. Or break it into  <br>more pages with appropriate pacing so the  <br>reader can pause briefly between chunks of  <br>content (like we've tried to do in our articles).  <br>Or better still, provide a printable version or  <br>PDF. <br> <br>I dread the day when web sites are designed  <br>for the lowest common denominator. Jakob  <br>Nielsen can have the all Arial, all vanilla  <br>web. <br> <br>Now that I'm finished ranting, please don't <br>put me into a black and white, \"for users or <br>against users\" camp. There may be very <br>viable--albeit few--instances to use this text  <br>resizing thing... <br> <br>In the end, I'm a believer in making decisions  <br>based on the maximum benefit to the  <br>maximum number of users (but again, not the  <br>lowest common denominator.) <br> <br>//jp </p>"
