    html: "<p> Kevin, the solution is to have the same size screens running at the same res on every desk. <br> <br>ie there is no solution. <br> <br>Look at your own screen, I don't know what you're running, but with any Mac you can just switch resolution via the control strip - mine goes from 640*480 up to 1920*1080. As you can imagine, from my viewpoint, switching between those ranges of resolutions is going to result in vastly different physical text sizes. <br> <br>But, 10 pixels is always 10 pixels. <br> <br>The ideal solution is to use ems as measuring units - but MS fcuked this up for the world by making everyone think that a good default text size is 18px - wrong, wrong wrong. <br> <br>On most screens a good base text size is more like about 12px, some are going to want to go up to 14px or so. <br> <br>Clever people are going to try to set their preferences to a base font size that works for them, while 90% of the web designers [sic] out there are thinking to themselves \"this 18px default is far to big, I'm gonna have to size that down to  (fontsize) \"2\" or 0.75em...\" and the smart people go \"huh, what's wrong with these jerk off designers, I can't read this stuff!?\". <br> <br>Making sense, probably not. <br> <br>Here, tip from the top: if you're thinking to yourself \"10px\" is excellent text size, think again. 10px is legible on most screens, I have a problem with it on large screens and would rather have 12px - but that's not the real problem. The real problem is that you *cannot* go much below 10px, you can only realistically go to 9px. <br> <br>There aren't enough pixels to rasterise text at 8px (specialist bitmaps aside). <br> <br>So, if your text is 10px, and you want a picture caption/credit - you've only got 9px to go to, and there really isn't enough differentiation in the rasterised text to really show that you've done anything (it's not like 10pt and 9pt at high res). <br> <br>So go with 12px, you can then get some decent differentiation by going to 10px for small bits. Those (few) that genuinely find 12px too big can use the text zoom to get down to 90%, those that find it too small can go up to 120%. <br> <br>So go for the middle 80%. <br> <br>I know as web designers we all get stuck in \"it's got to be 600*800\", but the reality is that most people are running 1024*768 and higher. <br> <br> <br>Joe </p>"
    html_clean: "<p> Kevin, the solution is to have the same size screens running at the same res on every desk. <br> <br>ie there is no solution. <br> <br>Look at your own screen, I don't know what you're running, but with any Mac you can just switch resolution via the control strip - mine goes from 640*480 up to 1920*1080. As you can imagine, from my viewpoint, switching between those ranges of resolutions is going to result in vastly different physical text sizes. <br> <br>But, 10 pixels is always 10 pixels. <br> <br>The ideal solution is to use ems as measuring units - but MS fcuked this up for the world by making everyone think that a good default text size is 18px - wrong, wrong wrong. <br> <br>On most screens a good base text size is more like about 12px, some are going to want to go up to 14px or so. <br> <br>Clever people are going to try to set their preferences to a base font size that works for them, while 90% of the web designers [sic] out there are thinking to themselves \"this 18px default is far to big, I'm gonna have to size that down to  (fontsize) \"2\" or 0.75em...\" and the smart people go \"huh, what's wrong with these jerk off designers, I can't read this stuff!?\". <br> <br>Making sense, probably not. <br> <br>Here, tip from the top: if you're thinking to yourself \"10px\" is excellent text size, think again. 10px is legible on most screens, I have a problem with it on large screens and would rather have 12px - but that's not the real problem. The real problem is that you *cannot* go much below 10px, you can only realistically go to 9px. <br> <br>There aren't enough pixels to rasterise text at 8px (specialist bitmaps aside). <br> <br>So, if your text is 10px, and you want a picture caption/credit - you've only got 9px to go to, and there really isn't enough differentiation in the rasterised text to really show that you've done anything (it's not like 10pt and 9pt at high res). <br> <br>So go with 12px, you can then get some decent differentiation by going to 10px for small bits. Those (few) that genuinely find 12px too big can use the text zoom to get down to 90%, those that find it too small can go up to 120%. <br> <br>So go for the middle 80%. <br> <br>I know as web designers we all get stuck in \"it's got to be 600*800\", but the reality is that most people are running 1024*768 and higher. <br> <br> <br>Joe </p>"
