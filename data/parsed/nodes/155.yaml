    html: <p> Joe, certainly, the stats have changed. But certainly they'll change again. AOL has a huge influence - globally, cross-platform. <br> <br>Also you have to remember that for most Mac installs over the last three years (perhaps more) the default (and often only) browser was IE - installed by Apple. <br> <br>As I wrote before IE 5.1.3 is a decent browser - the first time I could say that about IE (note, recently updated to 5.1.4, due, surprise, surprise, to security issues) - but it still tends to launch into Classic when running X!? <br> <br>Anyone who's had to develop web sites knows that IE 5.0 was a dog (real encoding issues on forms, complicated by poor memory management), and IE 4.5 for Mac was the main reason many sites couldn't be developed with fairly advanced DHTML. <br> <br>Nav 4.7 may be a bit of a clunker, but it is solid. <br> <br>Going out for a late lunch booze-up you guys will have to continue on your own! </p>
