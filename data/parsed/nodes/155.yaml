    html: "<p> Our comrade raises a lot of good points. Why  <br>recreate functionality that a browser can do?  <br>Especially when you can only do it poorly at  <br>best? <br> <br>This isn't a question of being 'user friendly' it's  <br>a matter of practicality. <br> <br>Regarding the size differences Kevin brings up: <br>I think this is not a difference between Mac and  <br>PC, it's the difference between Internet Explorer <br>and Netscape (it's platform independent). <br> <br>Try this: if you're running IE, go to your <br>preferences and select \"Language/Fonts\" and  <br>notice the default resolution is 96 dpi, while in  <br>Netscape I believe it's 72 with no option to  <br>change it. When I change this setting to 72 it's  <br>much more true to what I'm used to in Netscape. <br> <br>Question: Is the whole Windows OS 96dpi? That's  <br>my suspicion but I'm not sure. <br> <br> <br>The other Joe </p>"
