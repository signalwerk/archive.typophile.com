  html: |-
    <p>Hi everyone, just wondering if anyone can help me pick a font to go with LT chickenhawk (<a href="http://www.dafont.com/lt-chickenhawk.font" title="http://www.dafont.com/lt-chickenhawk.font">http://www.dafont.com/lt-chickenhawk.font</a>).</p>
    <p>We've fallen in love with this font, although we're planning to tweak it a bit for our purposes - and want to use it to write our company name on signage and business cards. (We're doing tea and cake so like the cutesy handmade feel of it)</p>
    <p>I'm trying to find a suitable body font to go with it and really struggling - I'm not generally a fan of script-type fonts, but other fonts I've looked at look sterile and out of place next to this hand drawn font. Any suggestions?</p>
