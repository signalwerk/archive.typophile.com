    html: |-
      <p>Since FontLab uses the AFDKO, the Adobe site is a good resource (IIRC, the FontLab manual <em>does</em> mention a few deviations). Your ignore line can be found here:</p>
      <p><a class="freelinking external" href="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html#5.f.ii" rel="nofollow">Specifying exceptions to the Chain Sub rule</a></p>
      <p>The most confusing part of it is it also needs a at least one part tagged with a ' (in regular substitutions this marks the to-be-replaced glyph(s)).</p>
