    html: |-
      <p>Speaking of those 'ignore sub' statements: Within any lookup in a features file (which often means within a feature, unless you've specified lookups within a feature), scanning stops at the first match. So, in OpenType layout, if 'sub f i by f_i' matches, then that substitution is made, and everything in the lookup after that is ignored/skipped. The 'ignore sub' statements function exactly like any other 'sub' statement in this regard, except that instead of performing a substitution, nothing is done.</p>
      <p>So, the statement 'ignore sub x f' i' by f_i' can be read as "if f and i is preceded by x, do nothing." This is a match, like everything else, and subsequent lines in the lookup are skipped.</p>
      <p>Don't know if that actually helps! :)</p>
