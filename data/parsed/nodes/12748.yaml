    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a> : Glyph</strong></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Typophile_Glyphs_6569.gif"></div><p></p>
    <p>In general terms a glyph is a symbol that has a meaning -- an arrow, a letter, et cetera. In digital typography the term refers to a single, specific instantiation of a character that appears in a font; the outlines for a particular punctuation, letters or <a href="/wiki/Figures" class="freelinking" rel="nofollow">figures</a> (numbers). For example, a given <a href="/wiki/OpenType" class="freelinking" rel="nofollow">OpenType</a> font might have three different glyphs for a lowercase "a" character: a default double-story form, an alternate single-story form, and a small cap version. In that font, lowercase "a" is one character but three glyphs.</p>
