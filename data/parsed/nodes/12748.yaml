    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12038" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Terminology</a>&nbsp;:&nbsp;Glyph</strong></p>
    <p><img src="/sites/default/files/old-images/Typophile_Glyphs_6569.gif"></p>
    <p>In general terms a glyph is a symbol that has a meaning – an arrow, a letter, et cetera. In digital typography the term refers to a single, specific instantiation of a character that appears in a font; the outlines for a particular punctuation, letters or <a href="/node/14569" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">figures</a> (numbers). For example, a given <a href="/node/12420" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">OpenType</a> font might have three different glyphs for a lowercase “a” character: a default double-story form, an alternate single-story form, and a small cap version. In that font, lowercase “a” is one character but three&nbsp;glyphs.</p>
