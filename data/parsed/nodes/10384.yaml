  html: <p>Hey! <br> <br>First I've got to say that yes, I am a complete typography-n00b, and I will probably taint this forum with my stupidness. :D <br> <br>Anyways, I have a poster that I'm working on   that consists of vector art and is kind of Film Noir'ish in style, so I'm basicly just wondering if the gurus of type could make some suggestions when it comes to the choice of font? (Preferably free...) <br> <br>Thanks in advance. :D</p>
