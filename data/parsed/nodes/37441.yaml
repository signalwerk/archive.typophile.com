      <p>Hola Juan Pablo,</p>
      <p>Tu fuente me gusta mucho. Se ve súper interesante. Por alguna razón la asocio con las letras que salían en las comiquitas de la pantera rosa. ¿Podrías publicar más ejemplos de frases con los caracteres que llevas hechos hasta ahora?. Si me permites, a continuación mi opinión: Tengo la impresión que la "e" empuja demasiado hacia a la derecha. Aunque se me hace que podrías dejarla así como está si tuerces un poquito los ascendentes de "b" "b" "d" "l" "h". Las descentes de "p" y "q" también las veo muy rígidas. Creo que si logras la soltura que tiene “a” podrías reafirmar esa intención de espontaneidad que estás buscando.</p>
      <p>Saludos desde Bogotá, Colombia.</p>
      <p>—<br>
      Carlos Fabián Camargo G.</p>
