      <p>[I'll write this post mixing spanish &amp; English. Sorry for the mix, and for this poor english.]</p>
      <p>Carlos, muchas gracias por tu ayuda. Estoy de acuerdo con tus comentarios. Pienso que hilando fino se pueden encontrar esos problemas y otros muchos más. Pienso que voy a hacer esta tipografía en esta versión (medio «Cartoonish», me gustó el calificativo) y otra más orientada a texto, probablemente serif o al menos con remates sugeridos (similar a Pascal u Óptima).</p>
      <p>*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*</p>
      <p>Litera, Thanks a lot for your help. I hope to make this font in the future, but first I have to finish my first typeface: kalidoscopio, maybe I'll do a text version of this. Regards!</p>
