      <p>This font is definitely a GO... I normally don't like playful fonts, but this one looks really good. Cartoonish. It reminds me of my youth when I was watching cartoons and type in those was obviously very playful like this one is. But still non-intrusive... like some are... Like Comic sans perhaps... ;)</p>
      <p>So. All I can say is: DO IT. Not plenty of these around. And of this quality. And I also suggest you make an even more playful version of it with less baseline bound letters. And some slant/rotation variation.</p>
