      <p>Doesn't exist.</p>
      <p>Rights to the typeface are owned by Linotype, but nothing digital has been released. VGC released poor quality typositor strips, but prior to that it was only electrotype, hence metal. Master drawings (Henk Krijger) are in the University of Amsterdam special collections. </p>
      <p>By the way, if anyone can connect me with someone owning a strip (or metal sorts for that matter, I'd be grateful.</p>
