    <p>There was some discussion here a while back about the <a href="/wiki/Raffia%20Initials" class="freelinking" rel="nofollow">Raffia Initials</a>. I can't locate the original thread. But there was a fellow looking for a specimen. If he could contact me off list I have since located a printed specimen of the complete character set printed at 72-pt. These are reproductions from letterpress printed sheets so there is some outline disturbance. I will scan these in the next several days.</p>
    <p>Gerald<br>
    <a href="http://BielerPress.blogspot.com" title="http://BielerPress.blogspot.com">http://BielerPress.blogspot.com</a></p>
