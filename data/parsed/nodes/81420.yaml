  html: |-
    <p>Hi all,<br>
    Does anybody know whether a truly embeddable version of Helvetica Light exists anywhere? It needs to conform to either of the following criteria:<br>
    1. Installable embedding allowed: fonts may be embedded in documents and permanently installed on the remote system.<br>
    2. Editable embedding allowed: fonts may be embedded in documents, but must only be installed temporarily on the remote system.</p>
    <p>I really don't want to use Arial, although I might if I can find an embeddable version of Arial Light.</p>
    <p>Can anyone help here?<br>
    Thanks in advance<br>
    Steve Brown</p>
