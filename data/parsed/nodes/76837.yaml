      <p>I think the biggest aesthetic problem with text figures in this situation is their varied vertical alignment: for instance, see the 4/3 fraction in the denominator of the fifth large fraction. The fraction bar appears to be closer to the 4 than the 3 — which, of course, it is. If the numerator and denominator of the small fraction had several more digits, the effect might disappear, but it's very noticeable with only the two digits. Of course, a fraction like f/e, for instance, gives you the same problem. I recall a math text that adjusted the numerator and denominator baselines to avoid this issue:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/mathfractions_6112.jpg"></div><p></p>
      <p>An interesting solution, but it made equations with several fractions look inconsistent and haphazard.</p>
      <p>In the useful examples provided by SciTechEngMath, the oldstyle figures don't help the legibility of fractions and superscripts, certainly, but I definitely like the look of them in a line of text. For instance, I actually think 4π looks very nice with OSF as does any nonfractional term with a combination of digits and variables. OSF next to italic lc letters or lc Greek letters is, I think, very attractive. I recall that Bringhurst's chapter on page proportions had a bit of math (also, like the examples above, in Minion) and used OSF — but this was all inline, I think, and didn't include anything as complicated as the above. I thought of it, though, because of the frequent use of π and φ (he uses the letter, I think, not the math symbol ϕ), which look quite nice with OSF.</p>
      <p>Josh</p>
