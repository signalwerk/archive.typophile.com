      <p>IMHO, the lining option is far better than the oldstyle for scientific data. BTW, I think even in common text OsF is not always the better choice, although there is a solid general opinion favouring them.</p>
      <p>These figures are more distinctive and elegant, but become distracting if the text has lots of numbers. The argument about x-height of OsF to match lc is valid. But when you have a text/language with many ascenders, numbers with descenders may become a bit strange or appear misaligned. This may not be an issue for English, where |y| is very common and increases the descender frequence. But for Italian or Portuguese, languages with much less descender usage, this may cause OsF 3, 4, 5, 7 and 9 not to fit so well to the text.</p>
      <p>Besides this, sequences of figures with ascenders (like 886), in a passage without other numbers, may give the idea of a lining standard (and even to be set in bigger type size) for the average reader.</p>
      <p>Just for literature I have no doubt to take OsF as a primary choice.</p>
      <p>Between disciplines from which I handled some amout of material, I never saw OsF figures used for Mathematics or Biology. But I saw some books about Philosophy, History or Law using OsF. For these, OsF just work if few numbers were present. About chess notation, I tried to do this when editing a small chess magazine, but had to give it up. There is so much amount of lining characters in chess notation and this makes OsF appear very small and shifted towards bottom.</p>
      <p>An interesting possibility is to have figures in an intermediary size. Let's say, a lining which matches uc height, an oldstyle which matches lc x-height and a third set using lining numbers with height mid-sized between x- and X-height.</p>
