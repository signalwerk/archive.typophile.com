      <p>I am very glad to see this post, as I have wondered about this myself. I think I had a relatively early dawning of "typographical awareness" and I have yet to encounter a math or science text that uses text figures (proportional oldstyle, or even oldstyle at all). I have occasionally typeset texts with small amounts of math and used them, but I'm not sure what I would do for an extensively mathematic text. As much as I would like to use oldstyle figures, I feel that only titling figures are accepted in these technical areas, in a way similar to how only one form of the theta is recognized as a mathematical symbol, or only one form of the lowercase g is used in IPA transcriptions. However, I don't know for sure why this is, and indeed, I'm very curious. My best guess is that mathematicians, scientists, etc. may see it as a legibility problem for certain characters, but I think overall equations and charts look both more attractive and more easily scannable/readable when set in OSF. Anyway, it's a very interesting topic. I look forward to more responses.</p>
      <p>Josh</p>
