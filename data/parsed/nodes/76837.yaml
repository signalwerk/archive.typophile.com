      <p>I'm involved in scientific research as my "day job," and have been intrigued by this question before, as well.</p>
      <p>I once read a book by Werner Heisenberg (reprinted by Dover: <a href="http://www.amazon.com/Physical-Principles-Quantum-Theory/dp/0486601137/ref=sr_1_1?ie=UTF8&amp;qid=1291176215&amp;sr=8-1" title="http://www.amazon.com/Physical-Principles-Quantum-Theory/dp/0486601137/ref=sr_1_1?ie=UTF8&amp;qid=1291176215&amp;sr=8-1">http://www.amazon.com/Physical-Principles-Quantum-Theory/dp/0486601137/r...</a>) that used text figures in the equations. It was mostly legible, with the exception of the 0 and the 1. Specifically, the 0 looked too much like a lc /o/ (which is occasionally used to, for example, indicate an element of solid angle -- anyone who tells you /o/ is never used as a variable or operator is lying) and the 1 of the typeface used looked too much like some variant of a small caps /I/, which would make someone question if that is how they choose to indicate the imaginary unit at first glance -- not a good thing to be confused about!</p>
      <p>My personal thoughts are to avoid text figures in equations. First, most of the target audience for such material is not used to looking at text figures in type. As a result, it distracts from the content when the figures are different than what the reader looks at day in and day out. Second, some text figures suffer from the ambiguities noted with the Heisenberg book above, though that can be fixed through appropriate selection of the typeface. Finally, once one delves into science mathematics beyond, say, the high school level there are few numbers in most equations -- equations at this level are mostly combinations of variables and operators, both upper and lowercase (and often with uc and lc greek and sans/serif/blackletter in one equation!). When a number appears, there is no reason why it should blend in with the lowercase. If anything, it should stand out as a pure number in a sea of variables, and make the reader wonder what quirk of calculus made it appear there.</p>
