      <p>Thank you both for sharing, Nick and Josh!</p>
      <p>Nick, in response to your comment regarding me getting the two backward: it appears as though several fonts on my system have the two reversed or, as is the case with how Typophile is presently displaying for me, identical. Inspection of the page element with the trusty UnicodeChecker.app shows that the page has character U+03C6 when I mention the single stroke form, and U+03D5 when I mention the two stroke form. Experimentation shows that Lucida Grande (among others) has the correct forms in the correct spots, whereas Adobe Garamond Premier Pro (among others, including all of the Japanese faces I have installed) seems to have the two forms reversed. Fascinating, but completely unrelated to "old style figures in mathish places." I apologize for so rudely sidetracking this thread.</p>
