      <p>Oldstyle figures are OK everywhere except in formulae, equations, and fractions.<br>
      They are even used by some for superior figures as reference numbers.<br>
      And some even use them in all-cap and all-small cap settings.<br>
      IMO, chess moves are fine with oldstyle figures, in fact they improve the appearance of text.<br>
      But only if you're playing with Staunton pieces, the Man Ray design requires modernist sans serif type with lining figures. </p>
      <p>Everybody is quite used to OSF these days, due to Georgia's pervasiveness.<br>
      This issue has been discussed at Typophile with regard to legal documents.</p>
      <p>Prior to 1800, all typography, including the first log tables, used oldstyle figures, because that was all there was.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/DuchampRoussy_Ray_4622.png"></div><p></p>
