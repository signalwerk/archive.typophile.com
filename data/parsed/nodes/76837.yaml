      <p>There are two places in Unicode where the distinction occurs.</p>
      <p>Basic Greek:<br>
      <a href="http://www.unicode.org/charts/PDF/U0370.pdf" title="http://www.unicode.org/charts/PDF/U0370.pdf">http://www.unicode.org/charts/PDF/U0370.pdf</a><br>
      03C6<br>
      03D5<br>
      This enables the distinction as either between an archaic "scripty" form (open top, one-stroke -- BTW you got that backward) and the more modern closed form, OR the "legacy" use of a few Greek letters (e.g. also theta) for scientific/math purposes.</p>
      <p>Here are the strictly mathematical characters, which extend to whole alphabets:<br>
      <a href="http://www.unicode.org/charts/PDF/U1D400.pdf" title="http://www.unicode.org/charts/PDF/U1D400.pdf">http://www.unicode.org/charts/PDF/U1D400.pdf</a></p>
      <p>AFAIK, there are more fonts which have the two "basic" encodings than those which are specialist with whole "math greek" alphabets.<br>
      For instance, I have included the basic variants in my Modern Suite fonts, which have no special math features, as primarily stylistic options -- although they may be used for math as the Unicode values are correct.</p>
