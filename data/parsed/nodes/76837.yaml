      <p>I do remember that in one British book - I think it was "Teach Yourself Calculus" - there were log tables in the back which were set using oldstyle figures rather than ranging figures.</p>
      <p>So, while for reasons outlined above, oldstyle figures are generally inappropriate for complex equations (in addition, 0 and 1 could easily be confused with small capital O and I, again because of lack of context) in older works, where oldstyle figures were the norm, they would be used where feasible.</p>
      <p>The Doctrine of Fluxions, by James Hodgson, and published in 1736, and available on Google Books, is set in Caslon, and although this textbook on calculus has equations in it, it uses oldstyle figures in them; back when Caslon was what people used when they set type, that's what they used for equations too, and they managed.</p>
      <p>On the other hand, when it is merely tabular matter instead of equations, oldstyle figures are not a problem, which is why they've been used even in recent works. For an old example, Astronomia Accurata, or the Royal Astronomer and Navigator, by Robert Heath, from 1760, also on Google Books, might be commended.</p>
      <p>As an example of the early use of ranging figures in mathematics, Mathematical Treatises, by the Reverend John West, dating from 1838 might be noted - it is set in Bell, apparently.</p>
      <p>On the other hand, Cours d'Analyse de l'École Polytechnique, by Jean-Marie-Constant Duhamel, dating from 1841, although set in Bodoni, uses oldstyle figures throughout.</p>
      <p>These are just a few random examples, of course.</p>
