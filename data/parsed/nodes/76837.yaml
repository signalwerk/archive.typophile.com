    <p>Does anybody know about how old style figures are used in technical areas that use a lot of symbolic notation like math, most sciences, linguistics, logic, chess books, etc., if at all? I've never seen them in a work of any such discipline, though that's not saying much. I don't seem to recall them in any of the textbooks I used for these subjects, but perhaps I wasn't typographically "aware" at the time.</p>
    <p>Thanks in advance.</p>
