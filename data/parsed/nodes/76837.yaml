      <p>Thank you for posting those links, quadibloc!</p>
      <p>For those interested in some of the nitty-gritty of the rules that have been imposed upon mathematical typesetting, this is an interesting summary (with the later half giving technical details of possible TeX implementations):<br>
      <a href="http://www.tug.org/TUGboat/Articles/tb18-1/tb54becc.pdf" title="http://www.tug.org/TUGboat/Articles/tb18-1/tb54becc.pdf">http://www.tug.org/TUGboat/Articles/tb18-1/tb54becc.pdf</a></p>
      <p>Tragically, the article is obsolete as ISO 31 has been superseded by ISO 80000 as of 2009. But, the guidelines given for typesetting formulas are still reasonable guidelines. I have been very pleased to see that more and more places are following the advice concerning the use of roman type for the imaginary unit, the differential and in non-variable subscripts. European publishing houses (Springer-Verlag and Cambridge University Press come to mind in my recent memory) seem to do a better job (on average) of sticking to these rules than their American counterparts, though. Like anything in the design of a text, these small details make a big difference in the speed of comprehension when encountering a new equation.</p>
