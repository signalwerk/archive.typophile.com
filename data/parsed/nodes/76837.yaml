      <p>It is the convention in mathematics that the variables used in formulas are printed in italics. It makes them stand out more from numerals, distinguishes them from the conventional characters used to stand for functions, and fits better with Greek lowercase letters also used for variables (from, of course, Porson Greek).</p>
      <p>From <a class="freelinking external" href="http://www.typeculture.com/academic_resource/articles_essays/" rel="nofollow">here</a>, "The Monotype 4-line System of Setting Mathematics" and "Three Typefaces for Mathematics" might be of interest.</p>
      <p>And Donald Knuth's <a class="freelinking external" href="http://projecteuclid.org/DPubS?service=UI&amp;version=1.0&amp;verb=Display&amp;handle=euclid.bams/1183544082" rel="nofollow">famous paper</a> in which he introduced TEX to the world, also being available for free download, would be worth a look as an introduction to the subject.</p>
