      <p><cite>Everybody is quite used to OSF these days, due to Georgia's pervasiveness.</cite></p>
      <p>I should had pointed my observation is based on local usage. Brazil has a very poor typographic culture and things like small caps, OsF and ligatures are widely unknown. So, OsF are still seen as a stylish, fancy design instead of an usual option for numbers – even in Georgian times. Maybe time will improve this.</p>
