      <p>Josh:</p>
      <p>I see what you mean about changing the height of the baseline. That would be very effective when there is only one or at the most two fractions on a given line, but would turn quite hairy quite fast.</p>
      <p>(Please forgive the following confusion of symbols -- the preview on my browser showed both forms of phi becoming one and the same, even though they show up correctly in the typing window!)</p>
      <p>I am curious about your comments regarding the use of ϕ versus φ (two stroke versus single stroke lc "phi"). I have seen both used in various contexts in both papers and books. The one I see the most is the two stroke form (ϕ), which is almost invariably the one selected for the azimuthal coordinate of a spherical coordinate system and is also frequently used for the electric potential in certain literature. When I see the one stroke form (φ) it has usually been in the context of quantum mechanics to represent a wave function, and is sometimes mixed in expressions with the two stroke version when they wish to use spherical coordinates (i.e., the two stroke form represents the azimuthal coordinate while the one stroke represents the wave function, so you may have some perverse form like φ(ϕ)). I was unaware of there being much of a convention regarding this.</p>
      <p>Could you please share what you know about the choice between the two forms?</p>
      <p>Thanks!</p>
