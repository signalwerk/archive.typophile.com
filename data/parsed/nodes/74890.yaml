    <p>I am designing a logo for a polish company and would like to use a typeface designed by a Polish type designer. I came across Grotesk Polski FA, but I have not found anywhere to "try it out" or test set the companies name to see if it works. Does anyone know of a website that has it? I have had no luck with the websites I normally go to.<br>
    Thanks!</p>
