      <p>Grotesk Polski FA is based on Antykwa Półtawskiego, digitalised by J. M. Nowacki, and available for free <a class="freelinking external" href="http://www.jmn.pl/poltawski.html" rel="nofollow">here</a>.<br>
      You could also try <a class="freelinking external" href="http://www.2plus3d.pl/artykuly/danova-typograficzne-spotkanie-z-jackiem-mrowczykiem" rel="nofollow">Danova</a>, by J. Mrowczyk, which bases on both typefaces (then contact 2plus3d.pl magazine). You can use Danova for longer texts; and that's probably important.</p>
