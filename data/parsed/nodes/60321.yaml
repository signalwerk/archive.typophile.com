      <p>"Ye" is a personal pronoun -- think "you" or "y'all." :)</p>
      <p>(Second-person singular and plural are the technical terms.)</p>
      <p>"Oh ye of little faith..."<br>
      "Judge not, that ye be not judged."</p>
