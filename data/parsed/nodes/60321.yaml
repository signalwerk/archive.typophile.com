    html: |-
      <p>The interesting thing to me is the inconsistency of the way some of the contractions were done. For example, one "THE" uses an HE ligature, but others don't, and isn't YE just an archaic form of THE?  It's almost like the stonecarver found his layout needed these adaptations to maintain symmetry on the face of the stone, as each line is centered. Almost as if he worked from the edges toward the center.</p>
      <p>- Mike Yanega</p>
    html_clean: |-
