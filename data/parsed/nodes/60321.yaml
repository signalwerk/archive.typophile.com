      <p><em>What is the small ’E’ and ’D’ all about?</em></p>
      <p>I imagine that those were ways of saving space... If you look at old manuscripts and even early printed books, you will see many abbreviated words -- the abbreviations were a way to save space or make words fit. (By the way, I just found a PDF on early American tombstone inscriptions <a href="http://www.davidrumsey.com/farber/Early%20American%20Gravestones.pdf" rel="nofollow">here</a>.)</p>
