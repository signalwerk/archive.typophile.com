    <p>Hey all,</p>
    <p>I am mainly a Production Artist, but I have a client who has asked me to come up for a new logo for her homeowners association. Logos are NOT my forte and I actually cringe when someone asks me to do one. I always try to give it a shot though.</p>
    <p>A little background:<br>
    * they currently use 2 logos - one is a flower pot and the other is a phoenix. they hate both<br>
    * the history is that the neighborhood came together to help each other after a 1991 firestorm<br>
    * they are actively involved in the community<br>
    * they want something 1C, simple and stylish</p>
    <p>The top 5 logos are what I have submitted so far and have been rejected. The bottom two are ones I am working on... their feedback from the top logos was:</p>
    <p>an image with hills and the rest using NHPA<br>
    use NHPA in some creative way<br>
    do the image in medium or dark green</p>
    <p>Any feedback help anyone can give is greatly appreciated. Thanks!</p>
    <p></p><div class="imageWrap"><img src="/web/20080907160442im_/http://www.typophile.com/files/nhpa_logo_4466.jpg"></div><p></p>
