      <p>This is worth doing.</p>
      <p>The one thing I would recommend is to consider the funky weight distribution very precisely, by taking into account frequent letter adjacencies in actual text. In fact as a general rule the more irregular a design the more it should worry about linguistic data. See for example the development of Excoffon's Mistral, where the vertical position of glyphs was determined through the analysis of French.</p>
      <p>hhp</p>
