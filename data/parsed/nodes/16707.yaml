    date_raw: 11 Dec 2005 — 10:05pm
    votes: null
    html: <p>Are you designing the glyphs individially or in the context of other letters? In the first case you might design them abcdefg in the second case you would put the a in words &amp; design the word with special interest in the a like 'bat' 'vat' 'saavy' 'maintain'. I suggest that you re-rough your ideas in the context of words - the second route. It is as important to design the white spaces between words as it is to design the black. By designing in the context of words you will see the consequence of your design descisions and realize that you are really designing words - but in parts.</p>
