    html: <p>Very lively and fun. I disagree with Eben about the m, but in the capitals there is definitely a weight discrepancy between the straights and the rounds. And your capital M stands out as rather uptight; loosen it up and get it to join the party. I think your asterisk ought to be wilder too; try it with five or six of those slightly bifurcated triangular terminals instead of the rounded.</p>
