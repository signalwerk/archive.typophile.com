    html: <p>i have been looking at other fonts and Fontesque is actually a favorite of mine. i wasn't familiar with Shinn's website though so thanks for the link. i've looked at P22 and Font Diner fonts as well. as this is my first font, i'm a little overwhelmed by all the details that are involved in designing one. i'm always struggling between developing and expressing the essence of the indivual letterforms and working within the constraints of having to establish and maintain a consistently through the whole alphabet. the process is really interesting.</p>
