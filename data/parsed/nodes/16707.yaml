    <p>i'm another one of those City College of San Francisco type design students who have been posting on the forum. this too is my first typeface. it's also my first time postingon Typophile.<br>
    this is a work in progress, originally inspired by type styles from the 50s and 60s...but it seems to have evolved into something more personal, which is okay but unexpected. it definitely still needs work on the spacing so i'm well aware of that. some of letterforms need to be tweaked and adjusted as well. also, there's actually *more* consistency in the letters currently than i was originally shooting for and now i'm thinking about loosening it up a little.<br>
    so i would love some feedback from people on anything about this typeface.</p>
    <p>thanks. jill.</p>
