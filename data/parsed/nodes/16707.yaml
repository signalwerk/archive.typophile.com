    html: <p>I think your m won't fly when you start seting stuff in this. It somehow lacks 'm'ness. The verticals in P &amp; several other letters seem overly thin where your O is quite a bit thicker. This face has the quality of a doodle - so it feels really casual. Thats fine but I think it would be nicer &amp; more versitale with a little more consistancy of stroke. I agree you can loosen it up but not randomly. It should be done to create distictiveness between letters and to help you recognize letters. Your numbers have this quality. They have more vivacity and are easier to recognize than your letters. If you can get more of the number feeling into the letters they will get better.</p>
