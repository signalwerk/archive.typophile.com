      <p>I would say "correct" depends a lot on your budget! :-/  I say this because ideally you'd like to have a custom font (or a custom extension to a font you're using) that handles everything you need, but that can be very expensive... On the other extreme you could do a passable job by carefully choosing free fonts; you won't get a high level of visual harmony, but people will certainly be able to read it. Somewhere in the middle: choose a libre (free to modify) font that has as much of what you need as possible, and pay somebody to extend it. It all depends on how visually picky you are.</p>
      <p>hhp</p>
