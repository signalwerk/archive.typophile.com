    <p>Hey guys, I searched for this topic meticulously but I can`t seem to find good answers on the internet (maybe I looked in the wrong places, i can`t tell), so maybe some of you can help me out. </p>
    <p>What is the correct procedure of carrying the look and feel of your mobile app typeface to the different markets, especially if the typeface doesn`t support certain glyphs like the asian ones. Are you actually looking for alternatives in the that language (if so where?), or are you simply using the iOS/Android unicode feature in which the device replaces the type with a standard OS typeface.</p>
    <p>Thanks for any help in advance.</p>
