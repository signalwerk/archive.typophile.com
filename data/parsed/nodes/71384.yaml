    <p>Howdy,<br>
    First post here.  Looks like a great community.  I came across this awesome slab serif and fell in love with the 'S'.  I searched through 29 pages of MyFont slab serif faces &amp; didn't see one like this.  It's quite possible that I missed it.</p>
    <p>Can anyone ID this type?<br>
    Thanks!</p>
