    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a> : Typorati</strong></p>
    <p>1. Collective noun, possibly coined by <a href="/wiki/Grant%20Hutchinson" class="freelinking" rel="nofollow">Grant Hutchinson</a> of <a href="/wiki/Veer" class="freelinking" rel="nofollow">Veer</a>, describing the typographic movers and shakers who attend type conferences like <a href="/wiki/TypeCon" class="freelinking" rel="nofollow">TypeCon</a> and <a href="/wiki/ATypI" class="freelinking" rel="nofollow">ATypI</a> and regularly contribute to discussion on typographic blogs and forums like <a href="/wiki/Typographica" class="freelinking" rel="nofollow">Typographica</a> and <a href="/wiki/Typophile" class="freelinking" rel="nofollow">Typophile</a>. </p>
    <p>First recorded usage 22 September 2003 by <a href="/wiki/Grant%20Hutchinson" class="freelinking" rel="nofollow">Grant Hutchinson</a>...<br>
    "It'd be sorta nice to share the month of March with typorati such as Mr Goudy (March 8th), Mr Bernhard (March 15th) and Ms Gladstone (March 19th)."<br>
    <a href="http://typophile.com/node/1525" title="http://typophile.com/node/1525">http://typophile.com/node/1525</a> </p>
    <p>"Veer is in New York this week hanging out at <a href="/wiki/TypeCon" class="freelinking" rel="nofollow">TypeCon</a> and rubbing serifs with the typorati."<br>
    <a href="http://blog.veer.com/archives/000797.html" title="http://blog.veer.com/archives/000797.html">http://blog.veer.com/archives/000797.html</a></p>
    <p>"For an interesting Friday read, try this enlightening thread where the typorati discuss why are we so passionate?"<br>
    <a href="http://blog.veer.com/archives/000942.html" title="http://blog.veer.com/archives/000942.html">http://blog.veer.com/archives/000942.html</a></p>
    <p>2. Typographic ephemera and collectable material</p>
    <p>"Collectable Typorati - Nothing says ‘pure type geek’ like a collection of vintage specimen sheets, dog-eared Letraset catalogs, and a pile of first-run <a href="/wiki/Fuse" class="freelinking" rel="nofollow">Fuse</a> posters littering the studio."<br>
    <a href="http://blog.veer.com/archives/000902.html" title="http://blog.veer.com/archives/000902.html">http://blog.veer.com/archives/000902.html</a> </p>
    <p>3. Typographic literati</p>
    <p>Person(s) with knowledge and interest in Typography and/or related subjects.</p>
