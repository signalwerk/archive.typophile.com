    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12038" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Terminology</a>&nbsp;:&nbsp;Typorati</strong></p>
    <p>1. Collective noun, possibly coined by <a href="/node/12088" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Grant Hutchinson</a> of <a href="/node/12009" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Veer</a>, describing the typographic movers and shakers who attend type conferences like <a href="/node/12014" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">TypeCon</a> and <a href="/node/13403" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal"><span class="caps">AT</span>ypI</a> and regularly contribute to discussion on typographic blogs and forums like <a href="/node/12035" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typographica</a> and <a href="/node/12022" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typophile</a>. </p>
    <p>First recorded usage 22 September 2003 by <a href="/node/12088" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Grant Hutchinson</a>…<br>
    “It’d be sorta nice to share the month of March with typorati such as Mr Goudy (March 8th), Mr Bernhard (March 15th) and Ms Gladstone (March 19th).”<br><a href="http://typophile.com/node/1525">http://typophile.com/node/1525</a> </p>
    <p>“Veer is in New York this week hanging out at <a href="/node/12014" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">TypeCon</a> and rubbing serifs with the typorati.”<br><a href="http://blog.veer.com/archives/000797.html">http://blog.veer.com/archives/000797.html</a></p>
    <p>“For an interesting Friday read, try this enlightening thread where the typorati discuss why are we so passionate?”<br><a href="http://blog.veer.com/archives/000942.html">http://blog.veer.com/archives/000942.html</a></p>
    <p>2. Typographic ephemera and collectable&nbsp;material</p>
    <p>“Collectable Typorati - Nothing says ‘pure type geek’ like a collection of vintage specimen sheets, dog-eared Letraset catalogs, and a pile of first-run <a href="/node/14028" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal"><span class="caps">FUSE</span></a> posters littering the studio.”<br><a href="http://blog.veer.com/archives/000902.html">http://blog.veer.com/archives/000902.html</a> </p>
    <p>3. Typographic&nbsp;literati</p>
    <p>Person(s) with knowledge and interest in Typography and/or related&nbsp;subjects.</p>
