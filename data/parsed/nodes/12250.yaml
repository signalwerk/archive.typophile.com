    <p><strong>Publishers:</strong> Independently published by Stuart Bailey (UK) &amp; <a href="/wiki/Peter%20Bi%C4%BEak" class="freelinking" rel="nofollow">Peter Biľak</a> (CZ)<br>
    <strong>Editors:</strong> Stuart Bailey, <a href="/wiki/Peter%20Bi%C4%BEak" class="freelinking" rel="nofollow">Peter Biľak</a><br>
    <strong>Frequency:</strong> Bi-annual</p>
    <p>Since its conception in 2000, DDD has immatured into a jocuserious fanzine-journal-orphanage based on true stories deeply concerned with art-design-music-language-literature-architecture and uptight optipessimistic stoppy/revelatory ghostwriting by friendly spirits mapping b-sides and out-takes pushing for a resolution in bleak midwinter through late summer with local and general aesthetics wound on an ever tightening coil.</p>
