    html: "<p>&gt;&gt;I've heard there are ways to record streamed audio <br> <br>Well a TV/radio tuner card is the easiest way, but mine seems to be incapable of picking up Radio 4 at the moment. If all else fails I could record the program as an mpeg from the TV, then convert to a sound file. <br>Another way of recording:  <br>Most decent sound cards, and even some crap ones, have a switch in the software control panel to set recording source between line-in, microphone, or 'what I hear'. <br>Free software such as wavelab lite will then record 'what you hear' to a wav file. Converting from wav to mp3 or CD audio shouldn't be a problem. <br> <br>There are other ways, but I think these would be the most straightforward.</p>"
