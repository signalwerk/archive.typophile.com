    date_raw: null
    votes: null
    html: <p>Blag originated in cockney slang, where it meant to steal something. More recently it has been used in a general sense of 'nabbing something' whether legally or not. So one might say that one 'blagged the best seats in the cinema', for instance. It is also used to refer to talking someone into giving you something, e.g. 'I blagged my way into the nightclub'. <br> <br>By the way, I've found the best way to blag BBC radio on Windows is <a href="http://www.xi-soft.com/default.htm">Net Transport</a> which will save streaming audio and video in native formats. Then you can convert to MP3 with something like the <a href="http://www.boilsoft.com/rmtomp3/">Boilsoft</a> converter.</p>
