    html: |-
      <p>Yes, UK time. It'll be five individual programmes on the theme. <br> <br>The listing only goes up to Wednesday at the moment, but here's the detail so far: <br> <br><br>
      </p><blockquote><hr size="0"><!---quote-!--><b>quote:</b><p>1/5. John Carey, chairman of last year's Man Booker Prize judges, explores the process of reading and the science of how words on a page create pictures in the mind.<!---/quote-!--></p><hr size="0"></blockquote>
       <br> <br><br>
      <blockquote><hr size="0"><!---quote-!--><b>quote:</b><p>2/5. John Carey, chairman of last year's Man Booker Prize judges, explores the process of reading. Does reading in a different language or page layout affect our understanding of a text?<!---/quote-!--></p><hr size="0"></blockquote>
       <br> <br><br>
      <blockquote><hr size="0"><!---quote-!--><b>quote:</b><p>3/5. In the third programme in the series, John Carey investigates the importance of the personal imagination each reader brings to a text. He talks to neuroscientists about the reading process, and asks authors Sue Townsend and Francis Spufford to explain their experience of reading.<!---/quote-!--></p><hr size="0"></blockquote>
       <br> <br>Hopefully, typical of the sort of thing that the BBC can do so well.<p></p>
