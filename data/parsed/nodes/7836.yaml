    html: "<p>on Windows you can convert (record) the real audio RAM file after you download it from the bbc site (right mouse clips/save) then I've tried this: <br> <br><a href=\"http://www.audioutilities.com/audio-mp3-recorder/audio-reocrd-wizard.htm\" target=\"_blank\">http://www.audioutilities.com/audio-mp3-recorder/audio-reocrd-wizard.htm</a> <br> <br>You have to follow thier instructions how to record from your source. Run the Audio Utilities program and then create a new .mp3 file. Run RealAudio. Open the .ram file. Select record in the Audio Utilities then play in Real Audio and it records it into mp3.</p>"
