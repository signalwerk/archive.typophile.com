      <p>John has made an excellent case. We started by wrongly contrasting corporation and independent, when what is probably the most interesting model for high quality type today is something in between, the small cooperative group. Font Bureau has long been the progenitor for that, but it is very interesting to consider also Ascender. When it started it was two designers (or technicians or whatever you want to call them) -- Steve Matteson and Tom Rickner -- and two businessmen to mind the store, Ira Marachnik and Bill Davis. It must be abundantly clear that the designers find it worthwhile to be in such an arrangement.</p>
      <p>One footnote: Hoefler had assistants working for him as early as 1994. When I visited his studio then, there was already an anonymous drone, hard at work on proliferating the Didot, if I recall correctly. Jonathan was really nice to me and said, 'do you realize you are already one of the world's ten best designers?' Of course it wasn't true, and we haven't spoken since, a couple of years later, Jonathan had a fit with me for releasing a Didot under the name Didot (he said he had 'impeccably trademarked the name Didot'), but it was a generous gesture to make to a timid beginner and I have always been grateful for his encouragement.</p>
      <p>But I digress. To John's last few questions:</p>
      <p>'How many big type companies have gone bankrupt and disappeared in the past thirty years? How many times have the surviving ones been in receivership or have changed hands? How often have they been bought or sold by parent companies with no interest in or knowldge of type and typography? Do you really think this is a sensible, viable model conducive to the development and maintenance of high standards of design and manufacture?'</p>
      <p>I don't have any ready answers. Except to say, ultimately, printers probably need the same basic library of 700 or so fonts they have always needed, and ultimately, the owners of those fonts may make some money selling them again, if there ever is any real progress in type technology and the old data finally obsolesces. And someone has to own the existing intellectual property and stay in business doing that. That the property is actually worth anything, still, touches significantly on William's point about drawing office expertise. </p>
      <p>So: what is the point of Mono/Lino, other than to prove that adept and creative businessmen can create miracles? I suspect there are many, but as designers, we tend not to think about that end of the business. Designers are never interested in much beyond their fee, n'est-ce-pas? Or their wages. I am hoping to write an article on the merger for MD, and am hoping that Bruno will consent to an interview next week, and I expect I will learn something from that. In the meantime, John, I suspect that if you chose to argue against your point, you could probably come up with some interesting insights. I wonder if it's possible to do a sort of Keynesian analysis of the type industry?</p>
