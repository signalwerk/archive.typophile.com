      <p><em>I don’t know what kind of a deal you got with Microsoft for ClearType, John, but I recall your lamenting the comparatively higher fees commanded by lawyers. Do you think you could have cut a better deal if you were the CEO of a large company?</em></p>
      <p>I'm very happy with the fee I received for the CT font work. My comment about lawyer fees wasn't a lament, merely an ironic comment on what MS pay for global trademark searches on typeface names.</p>
      <p>I don't know how much Monotype charged for the Cambria development, so I don't know if it was significantly different from what the independent designers charged. But I'm pretty sure that what the Monotype designers got paid in salary from Monotype was less than the independent designers received as design fees. From the type designers' perspective, that is what matters. If independent designers can be competetive in pricing and quality with large foundries and still make more money than their colleagues who work for e.g. Monotype, that is obviously the better situation for type designers to be in. Some people, I suppose, like the regularity of a pay cheque and don't want to have to go looking for work, but it doesn't appeal to me.</p>
