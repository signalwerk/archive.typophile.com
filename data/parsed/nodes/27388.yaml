      <p>I can't say I'm surprised by this merge. The bigger gets bigger and the "Indies" keep on fighting! I can't really tell if it's for better or for worse. I've never been a fan of either of them. I respect them for sure, but I've always preferred the close contact you get with the smaller foundries. They become "part of the family"... that would hardly happen as part of the "Giants".</p>
      <p>From a marketing point I think you might even have an advantage being small. As mentioned already the smaller foundries keep working harder and connect easier with the trendier designer. From my own experience things travel VERY fast over the Internet if you're able to get the right connections. The awareness of MAC Rhino Fonts have increased a lot with a very limited marketing budget.</p>
      <p>Now let's hope this merge will have a good outcome for the whole type industry. I think we need both big and small players on this arena.</p>
