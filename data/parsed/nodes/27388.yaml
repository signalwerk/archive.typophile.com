      <p>Come on, Nick, I'm still waiting for you or anyone to tell me which is the inauthentic character in the Joanna italic caps. What makes it so interesting is that the error was made by a very skilled draughtsman who only realized the mistake years later. What's interesting about that is that it shows how very difficult it is for someone else to get inside a designer's head. Only Eric Gill knew, at once, how he was going to draw a given character. The draughtsman/drone is quite unlikely to be able to understand why a line is here rather than there or a curve goes this way instead of that way. A quite separate issue is that Gill's drawings were not capable of being made into literal type (his proposed g in Aries is the most spectacular example I can think of). Considerable interpretation was needed by the punchcutter or 'art director' as the case may be. All of that aside the wrong character in Joanna really does stick out once your attention has been drawn to it. </p>
      <p>Your proposal that the drawing of a text character should have aesthetic value in and of itself I still find unconvincing. Let us say that you are trying to reproduce Bodoni's types as precisely as possible, as Sumner Stone was trying to do in the ITC Bodoni project. What you will notice, in examining a character as simple as the o, is that to reproduce in digital what Bodoni did in metal, you must produce a drawing that mimics the myriad little o within o curves that are characteristic of the tools Bodoni used and the way he used them. The resultant drawing of this character, with its complex and painstakingly comprehended irrationalities, is not something that anyone with skill in drawing would naturally draw, and is never likely to be of any independent aesthetic interest. But it makes a good typeface. It is merely a means to an end. I have no objection whatever if it so happens that the drawing has aesthetic value. But that can never be the goal. For this reason, Stone insisted that the executants on the Bodoni project could proof characters only at the sizes they were intended to be used at. They weren't used to this, and it was a struggle to get them to do it. </p>
      <p>You get a completely different perspective on what type means when you stop looking at the character on the screen or on the drawing board, and stop trying to make it more beautiful, but instead, look at the type, tiny, on the page, and try to figure out where, and why, it needs a smidgin more here, and a smidgin less there. Now you go back to the drawing, and you try to do what it takes to get that smidgin corrected. Your drawing is now no longer a drawing independently conceived. It is merely a tool, merely a vehicle, part of a process that has one goal uppermost: to produce the printed character on the page (or screen or whatever), just as it is intended to be used.</p>
      <p>I don't expect a display typeface designer ever to be able to understand this process intuitively. Text people are text people; display people are display people; very seldom do the twain happily meet, and there is no reason why they should. One cannot be all things.</p>
