      <p><em>In the meantime, John, I suspect that if you chose to argue against your point, you could probably come up with some interesting insights.</em></p>
      <p>Perhaps, and I think your point about the remarkable achievement of keeping Monotype and Linotype alive is well made. At the same time, if you were to argue against your own point, you could start by simply repeating most of what you wrote in the Segoe thread: something that has been forgotten in the rosy glow of the press release. I wonder how Adrian Frutiger and Hermann Zapf feel about the Monotype purchase of Linotype?</p>
      <p>[ Regarding fitting, I don't think I'm being defensive, even though there is a significant difference between telling Sumner in a private conversation that you find something a little odd in the spacing of his lowercase o and announcing in a public forum that you think I don't 'understand typeface fitting, and probably never will'. I fit and kern my types carefully and systematically, and I'd be happy to discuss my approach, although its the sort of thing that is easier to talk about when one is sitting next to someone looking at a FontLab metrics window. There are some discussions on Typophile on the subject to which I have contributed some thoughts, including an interesting and illustrated debate with David Berlow about the correct way to space italics.</p>
      <p>I think a legitimate complaint can be made, by people who prefer a looser fit, that my fitting tends to be on the tight side. But optimum spacing is size-specific, and so we have this problem in one-size-fits-all scaleable type: how tight or loose should the default spacing be? The really good typesetters I know track almost every type they work with, hardly ever accepting the in-built spacing. In the absence of finely tuned optical sizes, I think ultimate spacing has to be performed by the typesetter, and will often make or break a piece of work. That said, I'm trying to space my current types a touch more loosely. But my approach to obtaining <em>consistency</em> in spacing remains the same. ]</p>
