      <p>Bill, you underestimate the extent to which digital media has changed the game.<br>
      The brevity of the feedback loop is insane -- being able to make incremental and multiple changes to a font and immediately view a high res printout makes it possible to gain in months the experience that took our predecessors years. </p>
      <p>On the one hand, it's nice to see a general professionalism spreading in a flourishing multi-foundry, font-using universe, but we should also beware of institutionalized conservatism, whether it comes in educational or corporate packages.</p>
      <p><em>Type in the end is primarily an industrial process</em></p>
      <p>History suggests an opposite trend. The Linotype put a miniature foundry at a publisher's disposal, for on-demand use; the Mac digitized the foundry's production processes and put them on a desktop. That changes the aesthetic, but what you're saying is it always need an orchestra and a recording studio to make a record, and only symphonies are worth listening to.</p>
