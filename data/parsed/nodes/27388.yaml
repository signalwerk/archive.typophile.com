      <p>&gt;For the revivals that were made from photos of printed type, projected on the wall and “traced”, I presume that those drawings would be an interim stage, over which the final “thin” (tracing) paper drawings were made.</p>
      <p>The drawings I looked at all had a signature of a single person who drew them at the bottom right, and a signature of the boss who signed off that they were satisfactory. </p>
      <p>For the Caslon Old Face (1923) I looked at, I'm pretty sure the projectoscope was used to project the faces of metal types, not printed samples. Also there was latitude for the person drawing the type in following the tracing of the projectoscope tracing, as there were written instructions to "follow the style of the type." The same person--Dorothy Rickert--I think did all the 12 pt and many of the smaller sizes. (The boss was a 'T.W.') Some of the larger sizes were done by others. But this project was an immense labor as each point size was draw differently--i.e. not 3 or 4 masters, and adjustments of others through the pantographic punch cutter. The projectoscope was also used to check the final punch against the original drawing, as quality control.</p>
