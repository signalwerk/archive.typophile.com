      <p><em>Bach = Michelangelo = Shinn</em></p>
      <p>Well, the Art of the Fugue is the kind of generative stuff that Eno delegates to a computer, but JSB crunched his own minims. And Michaelangelo, he did all the toes and little willies on everybody on the Sistine ceiling himself. Me, I personally hand-kern all the fonts in my mom and pop shop.</p>
      <p>Design attribution in collaborative production environments is a bit of a football. You've got your auteur theorists vs your socialists, trying to decide who deserves most props. The brutes hired to render the sublime ideas of the great men don't get much credit, which makes it a little easier for the boss of the monopoly to be self-effacing. </p>
      <p>But I think there are enough people who began in production work who later set out on their own and achieved success, to discredit the notion that their contributions as drafstmen were rote. Drawing is drawing so worthy of reverence, drafting is drafting, the fundamental skill of type post Benton punch-cutter, and when doing a revival in particular it's just as important in the long run (if not more so) than concept and art direction. Face it Bill, it's the drawing of Monotype Bembo that makes it sublime. That's a combination of freehand and french curve, not just drawing a circle, although even that has its merit, as in the old Giotto saw. </p>
      <p><em>I never saw HTF Didot being co-attributed to anyone else, did you?</em></p>
      <p>Not specifically. I was pointing out that H&amp;FJ profile their staff on their web site, which is an admirable practice. In general, people who are not the "designer" of a typeface are not credited by the publisher. However, when an employee first sets up their business (eg Darden, Ragan), they may list their involvement in particular typefaces, to establish credentials. So in the multi-foundry internet era, that information is more readily available than in the heyday of Linotype.</p>
