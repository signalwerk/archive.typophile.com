      <p>&gt;Kent does have a teeny bit of an edge in this game as his wonderful font Whitman is an imaginative synthesis of Joanna and Caledonia. So he has done a thorough study of Joanna, as well as Dwiggins’[s] faces.</p>
      <p>Precisely. David Saunders (for it was he who drew the Johanna Italic caps for which there was no artwork as Gill intended the Roman caps to be used with it) tells this story against himself to illustrate the kind of subtle thing that can go wrong when you go into a project like this without researching it properly. The Joanna Italic caps was one of his first projects at Monotype; he only realized his error when later studying the Perpetua caps. Now consider that there was then nobody there who knew any better, and that nobody thought the defect worth fixing, and you get a sense of the loneliness of typographical insight and the rare miracle of typographical perfection. Kent has really been able to get inside Gill's head, I am full of admiration for that. To understand what is and isn't Gillish isn't a small imaginative achievement.</p>
