      <p>It makes sense that Joanna Italic was one of David Saunders first projects at Monotype, because it has several sore thumbs (as William observed). Nonetheless, the idiosyncracies do give it a quaint charm, which is perhaps why no one was particularly bothered -- not that they didn't know any better. Gill's type designs have much "bad" drawing, so perhaps one should sympathize with Mr Saunders and the folks at Monotype.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Ds_4603.jpg"></div><p></p>
      <p>Consider the cap D italic in Perpetua -- it would be standard practice -- then as now -- to base its curve on a rotation of the curve in C or O, but this was not done, so the D we've been living with all these years is "bad". I've done a "correction" (centre character) showing how such a thing might be standardized, by matching the D's curve to that of C. But bear in mind the tenor of the times when Goudy, Cooper, and Gill were dealing with the straightjacket of the drawing office ("because they've always done it that way," as Goudy moaned about having the "a" in his Garamond plumbed up), and that the foundries must have been prepared to give some ground.</p>
