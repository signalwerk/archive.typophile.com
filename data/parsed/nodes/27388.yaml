      <p>Why wasn't Monotype bought by Linotype?</p>
      <p>The Heidelberger Druckmaschinen AG ("Heideldruck") is the world's largest prepress and printing maschine company with 3.5 billion Euro annual sales and 18,000 employees in the current fiscal year 2005/2006. Why should Heideldruck as the biggest company in this industry want to sell its small font department Linotype to Monotype? Why didn't Heideldruck buy the small Monotype outfit (although Heideldruck would have enough financial means to buy all font companies worldwide) ?</p>
      <p>10 years ago, the former Linotype had debts to the amount of 300 million Deutschmark. Heideldruck's CEO Hartmut Mehdorn waited like a vulture until Linotype was on the brink of bankruptcy, and then he bought Linotype for the symbolic purchasing price of one Dollar and transformed Linotype into a font department of Heideldruck. See the extract from a report made by Joachim Peters at that time attached below in German language.</p>
      <p>It is my guess that now, 10 years after, Linotype was again on the brink of bankruptcy, and Heideldruck  decided that the font business is not lucrative enough and got rid of Linotype by selling it to Monotype, presumably again for the symbolic price of one Dollar.</p>
      <p>-----------------------------------------------------------------</p>
      <p>Wie Heidelberg Linotype-Hell für einen Dollar bekam<br>
      (How Heideldruck bought Linotype for one Dollar)</p>
      <p>(Extract from a German article by Joachim Peters, 06/1997)</p>
      <p>Als im Oktober 1995 Hartmut Mehdorn den Vorstandsvorsitz bei Heidelberg übernahm, befand sich die Linotype-Aktie schon im freien Fall. Für Heidelberg hat Mehdorn eine Einkaufsliste aufgestellt. Hinter Linotype-Hell stand darauf ein senkrechtes Kreuz: Abwarten, bis der Patient stirbt. </p>
      <p>Die Nachricht moribundus kam telephonisch um Pfingsten 1996. Mehdorn hörte den Bittsteller Dr. Königs an und gab Order zu kaufen. Die Abwicklung erfolgte streng nach der Etikette der Großfinanz.</p>
      <p>Der Bankier Dietrich-Kurt Frowein trat nach einem Jahrzehnt Amtszeit als Aufsichtsratsvorsitzender von Linotype-Hell zurück. Zugleich besann er sich auf zwei weitere Funktionen: Vorstandsmitglied der Commerzbank und Aufsichtsratsmitglied von Heidelberg. Die Commerzbank hielt über ihre Vermögensverwaltungsgesellschaft Frega rund 17 Prozent der Aktien von Linotype-Hell, weitere 33 Prozent lagen bei Siemens.</p>
      <p>Heidelberg war bereit, Linotype-Hell zu übernehmen, wenn die Commerzbank 75 Prozent der Aktien im Paket anbietet. Siemens nickte. Es galt also noch, von den freien Aktionären ein Viertel des Stammkapitals einzusammeln. Zeit- und zielgerecht taumelte der Kurs noch einmal steil nach unten und erreichte den Tiefpunkt von 60 Mark pro Aktie. Die Commerzbank machte ein Übernahmeangebot zum Kurs von 95 Mark. 8000 freie Aktionäre stießen ihre Depots ab.</p>
      <p>Heidelberg bekam das Gesamtpaket von 79 Prozent der Aktien rechnerisch für maximal 180 Millionen Mark. Praktisch war es der berühmte Kauf für einen Dollar. Linotype-Hell bringt 300 Millionen Verlustvortrag mit, der Heidelbergs Steuerlast etwa in Höhe des Kaufpreises mindert.</p>
