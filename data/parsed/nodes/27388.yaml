      <p>&gt;You are the defensive one Bill, a corporate apologist. Indie-envy?</p>
      <p>You'd rather I be an apologist for Richler and the Shinn School of Fitting? You know I love your work, Nick, let's leave it at that.</p>
      <p>William, I have discussed your point about the drawing offices until I was blue in the face. Of course I am aware of it. It is unquestionable that the types they produced, as printing types, are superior to most of what we see in print today. You just have to compare books printed in the 1930s, 40s, 50s, with books printed today. It's all there. What it comes down to in the end is size optimization. Size-specific masters have been available since the days of photo. There hasn't ever been much demand for them. However, I do think drawing-office style size optimization is the only way to produce type that is as good as ... drawing office type, and there is one man doing it the right way today, Sumner Stone. I wrote a drastically simplified article about what Sumner's been doing a couple of issues ago in MacDirectory; unfortunately, in the web edition, they never posted the most important part, the illustration page. I'm hoping I can get something workable together and post the url for anyone interested in reading this, although it is perhaps a bit simplistic for Typophile readers.</p>
      <p>Of course it's unquestionable that this particular expertise is not where it once was. </p>
      <p>My point about independents is that the kind of mistakes that are likely to be made by an independent would ideally be precluded in a more corporate environment, and I still really do think great type is a corporate (in the deepest sense of the word) endeavour. </p>
      <p>I think Karsten's point about cooperation is overly optimistic. Your best friend may spend a few hours, at most, looking at your work and offering a few tips. But nobody is going to spend a month examining your font for problems unless you're both working for or with a foundry. </p>
      <p>Carl writes, 'I wonder what informs your pronouncements about other people’s work.'</p>
      <p>If I had to summarize, I'd say, paying attention to the drawing office model. Carl, I guess you weren't in the loop when Steve Matteson asked me to redraw Bembo for Monotype, in 1996. We got a nice draft of the 72 point going and then I decided to pull out of the project when I started working with Adobe. </p>
      <p>He continues, 'Are there typefaces you’ve released that we can examine for perfection in every aspect?'</p>
      <p>Well, the Adagio Didot family looks pretty good, but it hasn't had a distributor since Precision Type went out of business, and I've been too lazy to look for anyone else, and in any case, it's in need of drastic revision, at least in my opinion. It would be pointless to re-release it without doing something to make it better. My multiple master of News Gothic for Bitstream is also pretty good - that came out a few years ago on the first Type Odyssey CD - and it's really a competent piece of work if you consider it was done in two weeks and the production fonts were made in Fontographer. In both cases, I had some very expert helping hands, Jeff Level and Jim Lyles. I must have a dozen or so other fonts in the pipeline that I'm in no hurry whatsoever to release and if you send me a private email I'll be glad to send you some work to take apart. I would really like that. The project that is closest to getting released is probably my revival of Pilgrim for Lino, but if you want to know the probable timeline, you'll have to ask Bruno. We've been talking about it and exchanging views and looking at data since 1996, and for all I know it may be another ten years before it gets released to my satisfaction. Very little of what I choose to work on is particularly commercial, and things tend to happen slowly. But what's the rush? </p>
      <p>I think I know what I'm interested in, as regards type, at this point.  I asked Mac Directory magazine to let me do some articles on type designers, and they agreed. So I had to ask myself, who do I really admire? Whose work do I really want to think about and write about? And really, I suppose it's very boring, but I decided that at this point, though I usually find something to like in nearly every font I see, it came down to Zapf, Frutiger, Carter, Stone, and Berlow. These are all very great problem-solvers in type. I don't see others of that calibre around, and I'm not convinced that there are many developing that kind of calibre. And partly that's because of a real lack of rigour. </p>
      <p>What's a lack of rigour? Well, for one thing, people going overboard the minute you make the slightest criticism of their work. You know Carl, a few months ago I was talking to Sumner about Cycles and I said I thought the fitting of the o shapes was too loose. He didn't get all snippy. One reason why is that Sumner really, really knows why he fits the way he does and is interested in discussing it. I learned a lot from it. And it was unthinkable that he would treat me as a pariah for bringing it up. I mentioned it to Matthew Carter a week or two later, and he had some insights into the possible underlying technological reason of different fitting systems, and so it goes on.</p>
      <p>I've never had a discussion of that quality online, but I keep on trying. And aren't we straying rather far off topic? We should be celebrating what a miracle it is that Lino and Mono are still alive and well, and that their combination is probably going to make for even greater health. Around 1994, Ricky Schreiber at Linotype told me it was clear the American division of Linotype would have to close, and he didn't see how any part of the corporation could survive. The reason was that Linotype had determined that almost everyone who wanted an imagesetter had already bought one, and imagesetters were these companies' primary source of income. The other foundries were in the same boat. But somehow these amazing businessmen, Bob Givens, Bruno Steinert, and of course Ira Marachnik and Bill Davis (now of Ascender) kept their enterprises afloat after their legs had been cut off. Isn't that a really quite remarkable achievement? These people aren't ordinary businessmen, not least because their devotion to type is unquestionable. To have been so successful, for so many years, against such unbeatably bad odds -- that's something worth a word or two of unstinted praise.</p>
