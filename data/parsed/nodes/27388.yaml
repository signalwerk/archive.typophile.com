      <p>I think the merger marks the paradigm shift.  For years, when the font-output machinery drove the wagon, large companies were the only ones who could put it all together.  Today everything is separated. Type design and distribution (and output is in the users hands). The overhead in having a large corporation having everything in-house is a cost issue that is hard to pass on unless there is constant new development to cover it. Today's smaller and more independent groups work in consort but handle only their own overhead.  Yes, type people "are small people" but they need very small parking places and use less fuel.</p>
      <p>ChrisL</p>
