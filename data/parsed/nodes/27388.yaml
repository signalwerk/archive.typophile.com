      <p>David:</p>
      <p><em> Unfortunately the point was not responsibility, but completeness. And the fact is, though this is from the point of view of someone looking from the outside, (and at a seven-year development with no documentation ;), you did not, could not, and probably still cannot do it ALL (make CT products, e.g.) internally.</em></p>
      <p>Sorry, but you're wrong on that one. MS gave us the tools, we made the fonts.</p>
      <p>Ironically, considering Bob Given's comment that 'We need to be a strong company to deliver products to the likes of Adobe and Microsoft', one of the things I needed to do in mastering the CT fonts was to rebuild the Cambria OTL tables from VOLT because Monotype's own tools had generated GSUB table errors.</p>
      <p><em>The requirements of these kind of fonts for the future is not clear...</em></p>
      <p>This is true, although I'm not sure in which sense you mean. It is true in both senses:</p>
      <p>The requirement to have this kind of font in the future is not clear (the same point that Matthew made to MS when they asked him to design Verdana and Georgia: a font optimised for a particular technology will be obsolete before too many years).</p>
      <p>And the obverse of this coin:</p>
      <p>The requirements of a font optimised for CT in the future is not clear,  because CT itself is a moving target.</p>
      <p><em>But smaller foundries are never going to be able to make much less distribute these fonts succesfully.</em></p>
      <p>Who said anything about distributing? Bob Givens made a comment about <em>delivering to Microsoft,</em> suggesting that a company needs to be big and strong in order to deliver products to Microsoft. I made the observation, based on experience, that this is not the case. When Microsoft goes shopping for multiple font families to bundle with products, obviously a company like Monotype with a large library has an advantage. When Microsoft goes shopping for new, custom designs, small foundries and independent designers have a creative advantage, which they can leverage if they organise themselves in ways that maximise their ability to deliver. The CT font project was an interesting case because Monotype was the one corporate participant alongside a group of independent designers. Hinting was split between Monotype (Cambria, Candara, Meiryo), Tiro (Constantia, Corbel) and LucasFonts (Calibri, Consolas), and Tiro was responsible for final mastering of all the western fonts, including the Monotype submission. [Tiro was subsequently given the job of taking Cambria and making a math font out of it.]</p>
      <p>In conclusion, there are many good reasons why a company like Monotype buys a company like Linotype. But you don't need to buy Linotype in order to be able to deliver fonts to Microsoft. That's just silly pressreleasesprache.</p>
