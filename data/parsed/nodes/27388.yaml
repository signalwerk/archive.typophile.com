      <p>In general terms, the purchase of Linotype seems to be simply part of Monotype's acquisition policy of several years standing, beginning with ITC. But I agree with Nick that synergy in the font business doesn't necessarily reside in conglomeration of big foundries into one very big foundry, and that most of the creative development, especially in the retail font market, has been taking place outside of big foundries. Linotype realised this years ago, and got rid of most of their internal design staff, eventually settling for one creative director (Akira) working with individual designers outside the company, and this is a model that has worked very well for them.</p>
      <p>Bob Givens' is quoted as saying: <em>“We need to be a strong company to deliver products to the likes of Adobe and Microsoft. Font people are tiny people. We are tiny businesses in comparison to these big companies. We will be much stronger together than we are alone”.</em></p>
      <p>As a very small foundry that delivers to both Adobe and Microsoft, I have to say that I disagree. What has been ably demonstrated in the past few years is that small foundries and independent designers can compete with the large companies for OEM contracts as well as they can compete in the retail font market, especially when what is desired by the client are new designs. The primary material advantage of the older and larger foundries is in what Peter Lofting at Apple calls 'the shoebox', i.e. the store of historical types which they can endlessly repurpose for new formats. Monotype's shoebox just got a whole lot bigger.</p>
      <p>The secondary material advantage was technical savvy, which Monotype in particular has tried hard to maintain. But open access to decent manufacturing and QA tools has largely eradicated that advantage. It is interesting to note, in reference to Bob Givens' choice of Adobe and Microsoft as examples, that these two companies have been at the forefront of making font development tools freely available and, hence, of enabling small foundries and individual designers to compete in technical quality with larger companies. Since Adobe and Microsoft clearly have an interest in enabling such competition and in not becoming tied to a monopolistic megafoundry, I question the logic behind Bob's statement. Does making a company bigger really make it more attractive to clients who have demonstrated a desire to enable smaller companies to compete?</p>
      <p>Occupying the middle ground, between the megafoundry and the boutique foundry, are the ex-Monotype folk at Ascender Corp., who have probably been the most aggressive OEM-based type business for the past couple of years. For the time being, that is probably where Monotype sees its biggest competition in its most important market. Perhaps this is the context in which the acquisition of Linotype should be seen.</p>
