      <p><em>“I don’t know what the figures are, but myfonts.com seems to have all of the mindshare and most of the marketshare.”</em></p>
      <p>I only know what our numbers are (shhh... it's a secret...) and the relative size of the marketplace. Based on that, I am comfortable in saying that MyFonts.com does not have <em>“all of the mindshare and most of the marketshare”</em>. Yes, they are a prime mover in the marketplace, but so are Veer and FontShop. I would argue that the majority of creative consumers purchase products from sources they like - more often than sources that simply have more to choose from. Selection and price are strong persuaders, but so are ease of use, site functionality, customer service, alternative product categories, voice and attitude, quality of marketing materials, affective use dead-tree media, etc. All of the above companies share many of these qualities, but they also differ drastically in how they implement them.</p>
