      <p>I hesitate to wade into the Gill tangent, but this thread seems already far afield from the original Lino/Mono merger topic.</p>
      <p>I will hazard a guess about your Joanna Italic challenge, Bill. The cap D strikes me as unGillish. The relation of outside curve to inside is such that the counter shape seems to bulge more at the top, giving the whole character a much higher center of gravity than seems appropriate for the design. By comparison, the Ds in Joanna Roman and the Perpetuas seem to sag a little lower.</p>
      <p>If we're talking about errors that need to be corrected, however, I personally would have liked to see the extra weight in the crossbar of the T fixed in both Roman and Italic. But this characteristic is not unGillish (it's part of his original), and so doesn't fit the criteria of your initial query.</p>
      <p>-- K.</p>
