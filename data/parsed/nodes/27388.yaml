      <p>Re. optical sizes: David, I'm in total agreement.</p>
      <p>Re. Constantia: Bill, just to clarify, the Constantia C does actually have an overshoot, the bug was in the hinting (the bottom of the C was linked to the wrong CVT value, I believe).</p>
      <p>Re. Bill: <em>The first was that you had provided a bad initial impression of all of the CT fonts by setting the one-line large examples in the book about them with InDesign Optical Kerning.</em> Ah, yes. You see, I consider character set showings to be, inverting Mr Gill, pictures of letters, not type. I track them out a bit, so that people can easily examine the individual shapes, and I apply the optical kerning feature because such showings often involve combinations of letters that do not occur in text and which may not be accounted for in the kerning data in the font. The purpose of these showings is to give some idea of what is in the font and what the letterforms look like. To judge fitting, you need to look at type -- at text -- not at pictures of letters.</p>
      <p>Re. Karsten: <em>Agreed. I even wonder if a metrics window is the right tool for kerning.</em>  Somewhere in the Typophile archives is my specification for a kerning environment, which is a large room with a wide, curved cinema screen on which one pixel = one em unit, and a control console with dials to adjust interglyph spacing. :)</p>
      <p>Seriously, though, I think the FontLab metrics window in FLS5 is a pretty good kerning environment. There is always going to be a disconnection between the tools for specifying spacing in digital fonts and the application of spacing at the target size and target medium, and that disconnection requires a human imagination to bridge it. Looking at kerning strings on screen, at the size at which it is practical to work with them optically -- i.e. large enough that pixel rounding errors do not obscure the results <em>too</em> much (they will always obscure the results to some degree, hence the desire for an evironment large enought for one pixel to equal one em unit) -- it is necessary to consistently imagine the desired spacing of the target size(s). The tendency, looking at glyphs at such large sizes, is to tighten the spacing too much, so of course the feedback from print tests at target sizes is essential.</p>
      <p>A typesetter I know who did a lot of manual kerning in headlines in his long career would always print out the pseudo-word 'millioon' in the intended size and spacing, and tape it to the top of his screen while working on kerning, as a visual reference. This was the inspiration for the 'second preview' option in FontLab, which I asked Yuri add: a constant field below the current spacing/kerning preview in which one can put e.g. 'millioon' as a reference.</p>
