      <p>What is big? As far as I can see, Font Bureau is the minimum size to produce what to me is good work. But that wouldn't be possible without its exceptional personnel. But William, when you say 'This just doesn’t seem to correspond to current realities', I doubt that you are looking at typefaces the way I am. Let me give you one example, not taken from one of the rather too defensive bad spacers in this discussion. I pick up the catalogue for the NPG McBean exhibition, and look at the Director's Foreword. Immediately, several words and word combinations stand out:</p>
      <p>Director's Foreword<br>
      'real'<br>
      McBean's<br>
      'Surrealised Portraits'<br>
      Pepper's</p>
      <p>In each case, the left quote looks normal, but the right quote is much, much too close to the preceding character. Is the right quote not properly fitted? No, such a thing could not be possible with such a popular, admired typeface. Could the graphic designer have done some weird thing? Is this some odd effect of Adobe Optical Kerning? </p>
      <p>I open the typeface. As I would expect, the left and right quote marks are reasonably well-fitted, in reasonable balance. Where is the problem coming from? As a last resort I look at the kerning. Here I find some astonishing values: n-quote right, -140, r-quote right -37, l-quote right, -100, and so on. I've never seen anything like it. It makes the typeface unusable with kerning -- in my eyes. </p>
      <p>This is not the kind of thing that could happen with a Font Bureau font, an Adobe font, or any of the Lino/Mono fonts that have gone through the traditional quality control process.</p>
      <p>As far as I know, nobody, in all these years in which there have been hundreds of thousands of publications using this attractive typeface, has ever commented on this obvious and frequently-occurring flaw. </p>
      <p>It illustrates my point that by and large, most fonts produced today by individuals, have decisive flaws that could be avoided if the designers were working in cooperative environments.</p>
      <p>By and large, the model of the single artist/artisan just doesn't cut it with type. There is too much to go wrong. A typeface is not an artwork whose possible flaws may subsequently have no functional effect. A typeface is a utilitarian tool and its flaws will multiply into any publication or application that uses it. Ego and art have their places in typeface design, but by and large I think they need to be balanced by the discipline of a cooperative, industrial environment.</p>
      <p>To those who are defensive about their spacing, all I can say is, your spacing isn't going to get any better until you acknowledge you need help. I realize that every independent wants to market himself as an all-competent master. But that's too much to expect from any one person, with some rare exceptions. There are so many things that go into a fully functional, fully utilitarian, fully successful typeface. There is no need to be ashamed if one cannot master every facet.</p>
      <p>I'm trying to think through John's point about venture capitalists. My first reaction is to ask, what's the matter with type being backed by venture capitalists? Isn't that vaguely how capitalism works? Isn't it normal for business enterprises to require some kind of financial backing?</p>
