      <p>Well, at the field trip talk, I'm afraid I didn't study the signature boxes in the bottom right corner of those drawings (looking at the glyphs instead), but I recall there were several, and I got the impression from at least one speaker that the draftsman had to sign off on each drawing -- with the example of one guy who spent four years on a typeface family doing thousands of drawings. Surely as part of Griffiths' meticulousness, he would have wanted to have consistency provided by using the same draftsman for a typeface, so that mean their names were recorded on the drawings? But you're saying the signatures represent the "art director" rather than the draftsman?</p>
      <p>For the revivals that were made from photos of printed type, projected on the wall and "traced", I presume that those drawings would be an interim stage, over which the final "thin" (tracing) paper drawings were made.</p>
