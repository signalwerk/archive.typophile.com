      <p><em>David Saunders, who ran the Monotype Drawing Office for many years, told me that he would often hire applicants with no previous experience whatever. He would give them a circle to draw. If they could correct their drawing reasonably well, they’d have the job.</em></p>
      <p>The more sophisticated Linotype equivalent was the infamous S test, in which prospective drawing office staff would be required to copy a drawing of a letter S. Matthew Carter told me of a particularly devious variant, in which the original S would be in a rectangle, and the objective was to draw an extrapolated S in a rectangle of different proportions.</p>
      <p>When I was helping Gerry Leonidas and Fiona Ross sort and pack the Linotype non-Latin archives for shipment to Reading, we came across a file of S test results from Fiona's department at Linotype Paul in the 1980s. She could still pick out who had drawn each one.</p>
