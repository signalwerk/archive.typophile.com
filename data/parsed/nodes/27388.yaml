      <p><em>I have posited that one of the drawing office ladies may have had some hand in it,</em></p>
      <p>Wait a minute, I thought I was the one suggesting that the drafstmen might get more credit for design?</p>
      <p>Robin Kinross, in Modern Typoraphy, attributes much of Imprint's success to the drawing office.</p>
      <p><em>Someone who does not distinguish between art on the highest level and mere craft</em></p>
      <p>Moi? I don't think reviving an old typeface is art. (And certainly not the highest level of design.) That's why I would give credit to the drawing office, not the overseers, in such circumstances.</p>
      <p><em>One thing I find so funny about all these discussions of master drawings is the assumption that the master drawing came fresh from the Master’s hand and that was that.</em></p>
      <p>I find it funny that you assume other people made that assumption. Most people are thinking master as in Multiple Master. Or would Multiple Master be a supergroup, like Twombly and Slimbach tag-teaming on Myriad?</p>
      <p><em>The kind of ‘drawing’ that is necessary to get this kind of effect has very little to do with the kind of drawing necessary for display type.</em></p>
      <p>Not so. It's true that as you say, design drawing has to be appropriate to the task for which it is intended--whether that is text or display. But it also true that irrespective of design, a good type drawing is a thing of beauty in its own right, with a quality of line that has vigour, grace, balance, proportion. This attention to quality is part of the synergy.</p>
