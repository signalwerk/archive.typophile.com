      <p>"[Griffith] would have wanted to have consistency provided by using the same draftsman for a typeface". </p>
      <p>Actually, when he was boss, the letterdrawing process was an assembly line, so it did not matter who signed. Consistency was assured by a highly disciplined approach at the top that was projected all the way down to the straight-line drafters (i.e. the traineees who only drew straight lines and only exactly where they were told to).</p>
