      <p>I don't know what the figures are, but myfonts.com seems to have all of the mindshare and most of the marketshare. I would imagine that one hope in the Lino/Mono alliance is to be able to compete better online, but myfonts.com already seems to be to fonts what Google is to search engines. </p>
      <p>However, it is always incredibly unlikely that real font income will primarily come from retail sales, and it is worth noting that Lino/Mono were much more interested in talking about fonts and mobile phones last week, than fonts and traditional printing.</p>
      <p>Moving down the feeding chain, for a company like Font Bureau, retail sales have always been a minor focus. The major focus has been on identifying the few customers still willing to pay handsomely for very high quality fonts, and delivering a product that actually works for its intended use. </p>
      <p>It's a much more difficult world for smaller foundries, which don't have the technical expertise to attract that calibre of customer. Smaller foundries are much more like to have to rely on impulse purchases, most likely of novelty, decorative fonts that don't require the expert construction of a successful newspaper or book font. </p>
      <p>It's amazing how many things can go wrong with a text font. I was just looking at a luxurious catalogue set in Scala Serif, a font I've always thought highly of, and I noticed that the sidebearings of the left and right single quotes were disturbingly out of balance. I wondered if this was a problem with the font? With one of the many versions of the font? With a pirated version? Was the designer of the text using some special kerning that put the quote marks out of balance? Who knows! At least with Font Bureau fonts, you never have to worry that things like that will go wrong. The basic problem, of course, isn't the font, but the person who is using it. If people setting type today don't know, and don't care that quotation marks look correctly balanced, what's the point?</p>
