      <p>&gt;The tools published by MS and Adobe, (and Apple once), were to aid in the competition of formats, not to make competition among their suppliers. </p>
      <p>I don't think this contradicts David's claim but in way of clarification. The reason that internally-produced tools like VTT, VOLT and Font Validator were released free of charge to anyone making fonts was to improve the technical quality of fonts being used on the Windows platform. The fact that these same fonts could be used on Macs, Linux, and other platforms was not a major concern. Likewise the fact that these tools might level the playing field is not a bad thing for companies like Monotype or Linotype, as it increases the available expertise of people they can hire or partner with.  </p>
      <p>I realize that I'm talking about type and I apologise if that is considered a bad thing.</p>
