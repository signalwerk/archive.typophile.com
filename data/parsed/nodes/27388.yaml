      <p><em>I remember reading somewhere that Van Krimpen gave credit to R for his abilities and went sofar as to state that he took into account these abilities when designing typefaces.</em></p>
      <p>Hermann Zapf made the observation that when Rosenberger was cutting punches for his types by hand, it wasn't necessary to produce highly finished drawings, because he could rely on Rosenberger to correctly interpret the designs. This is the nature of collaboration between artists and craftsmen, something one may see in other fields too, whether in fine or applied arts. The creative genius is rightly associated with the artist, i.e. with the originator of the idea, of the particular combination of forms, their associations and their application. The artist is usually a master in at least one medium -- Zapf of course is both a first class calligrapher and a fine draughtsman --, and the craftsman's job is to translate into a different medium, in Rosenberger's case steel. The key to this collaboration is that the media are all media of the human hand and the hand tool: a process of translation from hand drawn letters to hand cut letters.</p>
      <p>The question of who gets credit for 'design' in such a collaboration depends on whether you identify the design process with the creative genius of invention or with the complete process of defining the finished form. Since the nature of this kind of collaboration precedes and exists parallel to industrial models of design and manufacture, the application of the term design is in some ways inappropriate or, at least, a difficult fit.</p>
    html_clean: |-
