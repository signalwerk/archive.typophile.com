      <p>I am a little concerned about the way Bob Givens's quote has been taken out of context. In full, he said,</p>
      <p>“We need to be a strong company to deliver products to the likes of Adobe and Microsoft. Font people are tiny people. We are tiny businesses in comparison to these big companies. We will be much stronger together than we are alone”.</p>
      <p>Si of course meant the extract humorously, but it's getting a life of its own, and the fact is that there is nothing exceptionable in what Bob Givens actually said. </p>
      <p>I also don't see why this should be bad for designers. During the press call, Steinert and Givens went out of their way to mention their commitment to the actual font designer, and they really didn't have to. The issue, in the end, is never what your royalty percentage is. The issue is how many copies the foundry can sell. Combined marketing + combined and better targeted advertising probably = more sales. </p>
      <p>More compellingly, I think this stronger entity can better deal with font format problems, inconsistencies and new technologies, such as OT, Multiple Master (which I have persuasively heard - not for attribution - is due for a revival 'sometime'), etc. etc. In the past few years, the important decisions have been made exclusively by Adobe and Microsoft, and the results have not altogether been happy. I believe the combined Linotype Monotype entity will be able to change that paradigm and I couldn't be happier. Of course any merger can fail to work out well, or can fail to work out well in some particular area if not in others. But why expect the worst when there are so many potentially positive elements here? </p>
      <p>I must say, too, that I know very well Bruno Steinert's passionate commitment to the font industry in general and to Linotype and its legacy in particular, and if there is anything I can be certain of, it is that he has made the best choice for Linotype. This experienced strategist knows very well that you sometimes have to make a daring sacrifice in order to gain a great and lasting success.</p>
