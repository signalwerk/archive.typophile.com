      <p>John: "we have this problem in one-size-fits-all scaleable type"<br>
      We who? </p>
      <p>We all have this problem that some have made one-size-fits-all the default, and claimed it is more than one-size-fits-all. I, and some others have managed to sell the ideas that one-size-fits-some, and one-size-fits-one, are good too, (better usually) and that one-size-fits-all "needs some work on the software side", starting with a proper report from all devices of the resolution, ending with a variety of contour transformations and filtering techniques — to "truly 'begin' to solve", if required, one-size-fits-all.</p>
      <p>But the good news is, your spacing is fine. One-size-fits-all should work at the "master size", without the composer's intervention, and with predictable intervention otherwise, to taste over a range dependant on the design, (and in the presence of proportionally tracked kerning) One-size-fits-some "display range", and one-size-fits-some "text range" are not as hard to use, and one-size-fits-something "special" is the easiest, unless you don't use it "there". The basic fault with the master sizing of the one-size-fits-all design is, if there isn't one, it leads to a total disconnect between the master and optical size (monster-sizing for the lowest common denominator, e.g.). </p>
      <p>Then, some hell breaks loose. I learned this at Merg, so, sorry, but it's vaguely not off the topic. ;)</p>
