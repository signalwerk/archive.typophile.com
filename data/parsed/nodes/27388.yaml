      <p>Philosophically, I must admit I am in agreement with Bob Givens and with Jelle. I have long thought that to produce even a wholly successful font with just a hundred basic characters usually requires a large-ish company. The reason is that so many skill sets go into a really good font, and no single person (other than Matthew Carter of course!) has them all. You really need other people working with you. And they need to have an economic stake in what you are doing. Critique from friends is no substitute. </p>
      <p>I think the ClearType project showed clearly the kinds of things that go wrong when a corporate organization of professional type people is not involved in the production of an important typeface. To give but one example, after the initial criticisms of ClearType on this forum, John finally learnt that optical kerning in Adobe InDesign will always spoil a well-fitted typeface. But it took seven long years of enthusiastic use for that message to get across. What this reveals of course is that John doesn't understand typeface fitting, and probably never will. But that's OK! Lots of very fine technicians and designers don't understand it. However, they need to be working within a corporate group where there is someone who can be relied upon to sort these problems out. Each of us has only so much expertise, and only so much strength in any particular area of typeface design. That's why I think, that for most of us, and for most typefaces, the greatest chance of success is to working with the maximum number of highly qualified people, and this can only happen within a large organization dedicated to typeface manufacture. </p>
      <p>For this reason, I think the Monotype/Linotype merger will ultimately have a beneficial effect on the industry, but only if the businessmen who run it are successful enough to ensure that real expertise is preserved and strengthened under the larger umbrella. There is every indication this will be the case, but only time will tell how the story unfolds.</p>
      <p>Type in the end is primarily an industrial process which requires an industry around it. The paradox is that it still requires the individual artist/artisan to keep it on track. But the individual artist/artisan needs the corporation to keep on track as well. In type, everyone needs everyone else.</p>
