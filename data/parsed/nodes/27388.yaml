      <p>Nick, the point about the 'wrong' Perpetua D is that it is exactly the way Gill liked his D's and MT respected that. But - - you're so far off what Gill and Morison were trying to do with Perpetua. For heaven's sake, they had it hand cut by Malin first, specifically to get it away from looking like the drawings - - why not have a look at what Morison wrote about the development of the typeface in Talley of Types? You have a misconception about the process if you think that any of these people wanted to transfer an exact miniaturized replica of a perfect drawing to the printed page. That is not what they were trying to achieve, with Perpetua, with Gill's other typefaces. You'll get a clearer picture of this after you've looked at the book(s). The drawings were not a desired end product, merely an approximate guide to an end result. Drawings such as these cannot be taken as intended representations of the final type, and were never meant to be. That's why they can't be used as the basis for a digital implementation. You're still thinking like a lettering artist -- which is fine.</p>
      <p>Kent could probably elucidate this better, but does he think it worth the bandwidth?</p>
      <p>With regard to the pie, David is absolutely right. When the Microsoft Windows 95 Font Pack came out, and sold in the 8 or even 9 figures, InfoWorld estimated that Microsoft had made more money from that one product than all type foundries put together since the beginning of time. Nobody has ever disputed this assertion (maybe they should have), and that would have put MS as history's most successful font company a good ten years ago. One wonders how much MS expected this success? After all, they productized it, and that's not something they undertake lightly. It's equally interested to note that they haven't productized anything like that since. Smart company. But I guess that isn't news.</p>
