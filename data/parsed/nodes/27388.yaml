      <p>No, Jelle, I didn't do your VOLT work over again, I made use of your VOLT work in order to rebuild the OTL tables after encountering the Font Validator error message generated in response to the lookups produced by your tool. Thanks for the explanation about the Font Validator limitation -- which surprises me, since I'd presumed FV to reflect the spec in this regard --, and I happily withdraw any hint of criticism about the way in which you'd built the fonts. I raised this example to make the point that one doesn't need to be a 'big, strong' company in order to deliver products to a company like Microsoft, and being such a company doesn't guarantee that you will deliver what a company like Microsoft wants (which in this case, for better or worse, happened to include OTL tables that would pass Font Validator).</p>
      <p>No, I'm not shy about letting people know what kind of work I do, because there is one thing at which 'big, strong' companies like Monotype Imaging are currently more successful, and that is getting press releases noticed by the media. So those of us working independently need to blow our own horns, while Monotype gets blown by e.g. <a href="http://www.macworld.co.uk/news/index.cfm?NewsID=15426&amp;Page=1&amp;pagePos=3" rel="nofollow">Macworld</a>.</p>
