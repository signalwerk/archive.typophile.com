      <p>John, you're in fine form. You have correctly identified why it is not possible to have useful typographic discussion on these blogs and the reason of course is that they are really public. I think the biggest difference between you and me is that you have always treated them as very public affairs, and I have always treated them as if they were entirely private, which is quite incorrect. I've had the transient pleasure of a bit of sport, but essentially these are tools for promoting business interests and probably should be respected as such.</p>
      <p>To be perfectly fair about you and spacing, I have based too much of my opinion on two facts observed during those very painful but nonetheless productive threads that arose when ClearType was announced. The first was that you had provided a bad initial impression of all of the CT fonts by setting the one-line large examples in the book about them with InDesign Optical Kerning. This made me finally use this feature and identify some of its problems which I knew must exist but had never actually tested, and to you belongs the credit of subsequently discovering that this horrible device changes the spacing between all letter combinations except O and O. I think the other thing that was open to criticism was the general tightness of the spacing of your font, which was probably not ideal for small screen display sizes. From this it would be fair to deduce that your judgment is not always perfect, especially under pressure (and whose is?) but it isn't fair to go on to say that you know nothing about spacing, because there is also evidence on the other side that you do have a rational system and that you do carefully implement it, and the truth is that I have not looked at your recent work in sufficient depth to offer an opinion beyond the comparatively little I saw in 2004 or whenever it was. (We'll leave aside the issue of the non-overshooting C in Constantia which was revealed online ... due no doubt to momentary pressure, but also illustrating neatly the kinds of things that can go wrong in type even when every care is taken, also that every designer needs a gnome to look over his shoulder. It is the kind of mistake that is easy enough to make in a typeface of just 100 glyphs; it is that much easier to make when the font comprises a thousand or more.) </p>
      <p>Your point about good typesetters tracking type according to size is also well-taken. Isn't it interesting how many of them still use PageMaker, still the only program to facilitate this process automatically according to the type size chosen? </p>
      <p>If I may offer a small criticism, it is that while it is productive to work in a FontLab (or Fontographer) metrics window, the acid test is always print or whatever else the final application of type may be, and I think designers need to be encouraged not to rely on metrics windows too much. </p>
      <p>As to your question about what Zapf thinks about the merger, I understand that he is enthusiastic for a number of reasons. He was extremely annoyed, however, by some of the things I said in my Sumner Stone article, which just goes to show that you can't please everyone, not that I tried.</p>
