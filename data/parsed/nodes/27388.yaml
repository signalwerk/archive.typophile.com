    html: <p>I take it you're not, then, an adherent of the Arianna Stassinopolous Huffington school of art history (which I probably do not grasp any better than the likely incorrect spelling of her fabulous name) which I think declares that the man is the work, the work is the man? That theory, obviously not so crudely stated, is implicit in a great deal of, say, Nietzsche Contra Wagner and Der Fall Wagner, and it must have plenty of earlier precedent. Does anyone know anything about those earlier precedents? I like to think that man's handiwork reveals his inner secrets more fully than anything else. And I always have a little difficulty giving unqualified credence to allegations of unparalleled parental abuse when the allegator is lining his pockets with the disclosure, as seems to have been the case with Gill's unfortunate (whichever way you look at it) daughter.</p>
