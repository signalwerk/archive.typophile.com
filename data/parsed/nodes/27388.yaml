      <p>&gt;the traditional quality control process</p>
      <p>I think you are missing something important here: the large companies ain't what they used to be. </p>
      <p>I visited the Museum of Printing and Larry Oppenberg showed me some of the Merg. Linotype drawings (they have over 300 k) and told me about the design process. They had a room full of people drawing type in Brooklyn, with supervisors and at the top Chauncy Griffith. That was expertise and quality control. And I suppose something of the like was going on at Monotype.   </p>
      <p>The advent of photo type and then digital type seems to have been a one-two punch to the traditional large companies. In the first generation of digital the BIG companies made a lot of the classic types too light. This was not a model of competence, but a mess-up. Currently Linotype has I believe one person on staff who draws type as part of his job--Akira Kobayashi--and Adobe has one--Robert Slimbach. </p>
      <p>Some of the mentors in the field now are those who went through the old drawing shops before they collapsed. But you also have some gathering of expertise at schools like Reading and KABK. And you have importantly the type conventions, typophile and just a wonderful generous spirit in the type world, a spirit that is hard to find elsewhere. </p>
      <p>I think Karsten nailed it when he said type expertise is scattered among places of different sizes and independents.</p>
