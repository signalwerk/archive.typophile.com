      <p>&gt;Rädisch’s skills</p>
      <p>Let me second that. If you look at the drawings and the dramatic optical scaling that Rädisch did, you can see that they are an important part of the design process. Certainly there is more originality in Van Krimpen, but Rädisch made an important contribution. A comparison is in 'Printers Type in the Twentieth Century'. I have also seen specimen or display books from van Krimpen with Romulus, and Dreyfus's book. I assume these, or at least van Krimpen's are in foundry type. (The monotype was also based on Rädisch's foundry type.) They are among the most beautiful books I have ever laid eyes on.</p>
