      <p>Referring to David Peace's <em>Eric Gill: the inscriptions,</em> the first sign of what I'll call the sagging D appears in the stonecut work in the Stations of the Cross for Westminster Cathedral, carved during the First World War. Prior to that, all the Ds I've seen have a higher centre of gravity. The sag in these stonecut letters is not so pronounced as in the Felicity D, but then they are also upright. But in almost all of Gill's postwar stonecut lettering the D seems to sag somewhat, whether upright or italic.</p>
      <p>Since I can always be relied upon to make reference to Mr Gill's 'other interests', I'll remind everyone of the advice he gave to Will Carter regarding the lower bowl of the uppercase B: it should be 'like a young girl's buttock -- the way it hangs gently'. Perhaps the same can be said for the D.</p>
      <p>Here is one of my favourite Gill inscriptions, showcasing the sagging D in SEDENTES just a few years after its first appearance. This was carved in 1922. I stumbled across it entirely by chance in Amiens cathedral, but knew immediately that it was a Gill.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/GillAsquithAmiens_4083.jpg"></div><p></p>
