      <p>Oh, this is very good, thank you David, that must surely be the funniest thing anything has ever said on Typophile. Much better than my 'Zweet dreams, Zuzana' on an entertaining typographica thread that has evidently been 'suppressed' -- perhaps under threat of legal action from 'someone'? </p>
      <p>This reminds me of an incident on the OpenType list in 2000, when I more or less innocently pointed out that ATM 4.6.1 suddenly did not support GX fonts anymore. </p>
      <p>Harold Grey, from Adobe, whos loves self-promotion more than he loves veracity, piped up to say it happened 'After consulting with Apple, who informed us that GX under Mac OS 9 was essentially a "dead technology" '.</p>
      <p>This was all news to Apple. The redoubtable Dave Opstad, evidently too furious to realize he was addressing the list rather than Mr Grey wrote, </p>
      <p>'Harold, I'm curious...whom did you consult with here? Neither Peter Lofting, John Jenkins nor myself have spoken with you or anyone else from Adobe about this.'</p>
      <p>Dead shocked silence on the list, as it dawns on everyone that Adobe has been exposed in the dissemination of a nearly unforgivable fib to Apple. The unbearable pressure is finally relieved by David Berlow, who quipped,</p>
      <p>'I hate it when daddy and mommy fight, so this can go off line?'</p>
      <p>Now if Apple is Daddy, Adobe is Mommy, and David is Junior, where does this put Mono and Lino? Grannie? </p>
      <p>And this, to try and sashay back into the topic, raises the question what that genius, Dave Opstad, is doing for Agfa/Mono, where he has apparently been employed for a couple of years or so? Dave is the genius (no exaggeration here) whose GX team, back in the mid-90s, gave us just about all the functionality of OpenType, transparency for any program that wanted it, and a thousand other even more brilliant features, in under 4MB of RAM, on both Windows and Mac. Of all the brilliant technology projects that went nowhere, this was the most brilliant I am aware of. So what's he doing for Agfa/Mono? It must be something really interesting . . . .</p>
