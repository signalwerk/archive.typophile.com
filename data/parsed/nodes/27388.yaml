      <p>I dunno Grant, why not give us some numbers? </p>
      <p>The funniest thing about the font industry is how close everybody is with their numbers. I can't see that these numbers are of any particular value to their competition anyway. But everyone seems to think so. So let me put a couple of more general questions to you, Grant.</p>
      <p>1. Suppose that we all had an idea of what myfont.com's marketshare was. How could this knowledge possibly harm myfont.com and how could it possible help its competitors?</p>
      <p>2. Same thing with your numbers. Suppose we knew you sold 38,000 units netting $x per month on average for the first quarter this year, x % from catalogue, x % from the web. To what extent is this knowledge really going to hurt you or help your competitors? </p>
      <p>It sometimes seems that the font biz is the only biz in the world where people are afraid to come out with this info, and I have the theory that this might actually be harmful rather than helpful. One reason being that you can't really do any substantive economic forecasting about an industry if you don't have adequate factual information. </p>
      <p>To what extent does this truly tiny industry benefit from secrecy? </p>
      <p>Hey, if someone can establish that this probably somewhat holey veil of secrecy is actually beneficial for the industry, I'm all for it. Anything that helps the font industry is a good thing. But what if this secrecy is a self-defeating mechanism? Is that possible?</p>
