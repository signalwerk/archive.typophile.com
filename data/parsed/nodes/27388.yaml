      <p>Bill: <em>It illustrates my point that by and large, most fonts produced today by individuals, have decisive flaws that could be avoided if the designers were working in cooperative environments.</em></p>
      <p>On this point, we are to some extent in agreement. Much of my own work is cooperative, involving a team approach to development of fonts for complex scripts. Where I think you are wrong is in assuming that cooperative = corporate (in the capitalist sense). I see a lot of good work being done by small teams of people who are dedicated to both design and technical quality, and who can afford to be so dedicated because they are the recipients of the money that is paid for the work that they do. At the least, such dedication to quality is more difficult in a situation in which the bottom line is to provide a profit to someone who is not involved in that work, who is not familiar with that work, who has no stake in that work other than as a line item in an annual report.</p>
      <p>Many of today's successful independent designers started working doing pretty much everything themselves, because that was the only financially viable way to operate, and I think that you are right, Bill, that this sometimes led to problems in the products. At the same time, we can also see the massive problems in whole lines of products that came out of the large type companies in their hasty efforts to convert historical libraries to new formats in order to be able to survive and compete. And both independent designers and large companies during that period suffered from lack of well developed QA procedures for the new formats, inadequate production and testing tools, insufficiently documented font formats, etc. Solutions to most of these problems have only come in recent years, with the advent of OpenType, and not only have these solutions benefited both large companies and independent designers, in many cases they have been driven by the needs of those independent and small font developers, actively involved in discussions with Microsoft and Adobe, actively involved in beta testing font production and testing tools and, crucially, sharing information <em>cooperatively.</em> An event like Linotype's Typotechnica is a good example of this -- and a great credit to Linotype --, and I don't think anyone attending these events, or even reviewing the programme of speakers, can be in any doubt about who is learning from whom. The speakers are almost all independent font developers.</p>
      <p>As independent font developers become more successful and experienced, attracting bigger clients and being able to charge higher fees, they can afford to start hiring staff (as Hoefler and Frere-Jones have done, for example) or taking on collaborative projects with other designers (as I have done for the Adobe Arabic and Thai fonts, and am doing on other projects) or contracting technicians and programmers. What remains the same, though, is that the income generated by their work is going to the people who make the type and to the people who care about the quality of the work, which in the long run is a more stable financial basis for the type business to operate on. How many big type companies have gone bankrupt and disappeared in the past thirty years? How many times have the surviving ones been in receivership or have changed hands? How often have they been bought or sold by parent companies with no interest in or knowldge of type and typography? Do you really think this is a sensible, viable model conducive to the development and maintenance of high standards of design and manufacture?</p>
