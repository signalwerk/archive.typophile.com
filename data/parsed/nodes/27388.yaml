      <p>&gt;Face it Bill, it’s the drawing of Monotype Bembo that makes it sublime.</p>
      <p>I wonder. First of all, nobody really knows who is responsible for Bembo, and I have posited that one of the drawing office ladies may have had some hand in it, and am conducting some research into this very tenuous hypothesis, if it can even be called such. But no, the drawing is not what makes it great. There have been dozens of marvellous drawings of Bembo in modern times, in photo and digital. And none of them can hold a candle to the metal Bembo. What is the secret of metal Bembo? It's in the punches, not the drawings, that's for sure. A lot of very, very, very talented people have worked on post-metal Bembo, and they have all failed. As for the rest, it is difficult to argue with someone who does not distinguish between art on the highest level and mere craft. </p>
      <p>One thing I find so funny about all these discussions of master drawings is the assumption that the master drawing came fresh from the Master's hand and that was that. Of course that is not the case. It was tested and corrected dozens, hundreds, thousands of times until the person actually responsible for the type _in print_ (and therefore responsible for a huge capital investment) was satisfied. </p>
      <p>Back to Bembo, off topic as it is, I think it's wrong to say that what makes it work is even in the punches. It's the way it comes out on the printed page when everything is done right. To get anywhere close to duplicating that at text sizes today would require the very reverse of 'good' drawing, because good drawing is not the same thing as fidelity to the necessarily flawed letterpress impression. It also requires individual optical sizes of course, particularly below 12 points where the variations are large. The kind of 'drawing' that is necessary to get this kind of effect has very little to do with the kind of drawing necessary for display type. Until you stop thinking about curves and start thinking about bits of typographic density, you can't really understand text type - - in my view, which admittedly is absolutely personal and which I don't seek to impose on anyone else. I am hoping Lino will continue to go with my approach on Pilgrim, but who knows? There are not many digital types that employ it -- offhand I can only think of Slimbach's Jenson and Carter's Monticello.</p>
      <p>&gt;The type design community seems to be a very giving group who help each other and cheer each other on.</p>
      <p>If you know anyone, Chris, who will spend a hundred or so hours per weight helping me really come to grips with a typeface, please tell me their names. People in the type community are very nice and will often spend a few minutes or even let us say half an hour looking over something one has done and give some help.</p>
      <p>But to get the kind of help that really is needed, there has to be a common economic interest in the success of the work. And that requires an organization of at least Font Bureau size, to get back to the topic. The only times I have ever had the kind of attention I seek, working in painstaking detail over countless hours, was in 1993-4 with Jeff Level and 1997-8 with Robert Slimbach. Relationships like that aren't easy to find, and I did not succeed in keeping either of them going though I tried for all I was worth.</p>
      <p>Speaking of Font Bureau, David, I still don't understand what you said:</p>
      <p>"The basic fault with the master sizing of the one-size-fits-all design is, if there isn’t one,"</p>
      <p>one what? if I knew that, then perhaps I would understand</p>
      <p>"it leads to a total disconnect between the master and optical size (monster-sizing for the lowest common denominator, e.g.)."</p>
      <p>and then I would like to know more about what was observed in this respect at Mergenthaler.</p>
      <p>sorry to be so dense!</p>
    html_clean: |-
