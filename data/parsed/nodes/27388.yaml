      <p>"This is not the kind of thing that could happen with a Font Bureau font, an Adobe font, or any of the Lino/Mono fonts that have gone through the traditional quality control process."</p>
      <p>This is untrue and simplistic.</p>
      <p>A QA stage in font production still doesn't guarantee perfection in all details, and a small foundry staff doesn't preclude a thorough QA cycle. Since the start of PostScript (for a manageable example), there have been many classic types from large foundries which have needed re-versioning to fix issues of spacing, kerning, and other technical functionality, even leaving out the typical complaints about design. It's the nature of software. It's worth noting that type now is software as well as a tool. Previous technologies had their issues and limitations; bugs are part of the picture now. And bugs of the magnitude of the one you mention don't disable the typeface from working; there are degrees of functionality. </p>
      <p>Bill, you might follow Karsten's example and dig a little deeper into the actual workings of a few more typefaces before sounding the alarm that independent type designers are unqualified to deliver reasonably functional typefaces. Shall we tell the UK Guardian, San Francisco Chronicle or Martha Stewart to dump all their proprietary type families, since they were made by mere independents? Think of Letterror, Underware, or House Industries, each with a small staff of highly competent designers and technicians, not only providing fonts of high quality, but innovating in the application of new technology. </p>
      <p>I wonder what informs your pronouncements about other people's work. Are there typefaces you've released that we can examine for perfection in every aspect?</p>
