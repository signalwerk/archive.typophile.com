      <p>&gt;Wait a minute, I thought I was the one suggesting that the drafstmen might get more credit for design?</p>
      <p>You have, without any basis in known historical fact, suggested that simple technical draughtsmen should get more credit for designs, not realizing that most of them knew virtually nothing about type -- and didn't care. The decisive insight for me on this issue was when Saunders told me that the drawing office girls never saw the finished type. </p>
      <p>I have, with extremely little basis in known historical fact, begun to explore whether in the case of one particular typeface, where the history is a little foggy, it might be possible that one particular drawing office lady (there is only one possible candidate) might have had a hand in Bembo. This guess of mine is admittedly naive and is unlikely to yield any results. </p>
      <p>It is significant that in the golden era of typographical research, there was never any suggestion of this.  Just as there was not, in most cases, any reason to suppose that the punchcutter, in the pre-Pantographic, pre-Master Drawing era, had any substantive input into the process (i.e., except in the rare cases when the punchcutter was not working under someone else's direction). Does anyone seriously suppose that Rädisch deserved design credit for van Krimpen's typefaces? (A question a little worth asking but unlikely to yield anything of interest.) Or, to give another example, take the punchcutter Vafflard, who I had always felt certain was the 'auteur' of his typefaces. But Unger has seriously demolished this cherished belief of mine in his essay a few years ago on Vafflard. He has even gone so far as make a most persuasive case that Vafflard's types are merely largely faithful recuttings of Garamond's. I could, and would, argue these points, but my position, after Unger's careful research, is very weak.</p>
      <p>'I find it funny that you assume other people made that assumption. Most people are thinking master as in Multiple Master. Or would Multiple Master be a supergroup, like Twombly and Slimbach tag-teaming on Myriad?'</p>
      <p>Nick, the drawings for metal typefaces are always referred to as master drawings. Masters for the pantograph, masters for manufacturing, etc. etc. This is the conventional vocabulary. Ever since there have been drawings for typefaces, they have been referred to as Master Drawings. I realize it's a little confusing, with the additional burden of the concept of the Multiple Master and its new vocabulary.</p>
      <p>'Not so. It’s true that as you say, design drawing has to be appropriate to the task for which it is intended—whether that is text or display. But it also true that irrespective of design, a good type drawing is a thing of beauty in its own right, with a quality of line that has vigour, grace, balance, proportion. This attention to quality is part of the synergy.'</p>
      <p>Lovely. Vigor, grace, balance, proportion, synergy. Beautiful words. Like a distillation of one of Dwiggins's ads. And it misses the essential industrial point. What we need in text type is first and foremost an industrial product that maximally enables the customer to perform the act of reading on some final manufactured object such as a book or a screen.</p>
      <p>Now let's put it all into practical terms: if we know what 'quality of line' is, and aren't just using fancy words (to impress an imaginary public), we ought to be able to tell which is the erroneous character in the caps of Joanna Italic. Have you had a go?</p>
