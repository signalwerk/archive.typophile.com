      <p><em>FB’s volume in retail fonts is way below the Big Sites and none of us, not even FS actually compete with those big retail sites, unless we’re on them</em></p>
      <p>But FB has chosen not to compete -- its web site positions the company primarily as a supplier of fonts for periodicals to the trade, not Helvetica and scripts for the masses. Although scale it out a bit and change the g, and Bureau Grotesque could become Bureau Helvetica :-)</p>
      <p>In theory, a reciprocal distributor-foundry arrangement may be possible, where FB could distribute, say, the fonts that Veer distributes, but that would get messy as FB would end up selling Shinntype fonts et al. And all those extra fonts would dilute its market position, if not actually compete with its own product. Another marketing option would be a "distributed retail co-op", where several foundries sell each others fonts as well as their own. That's something I'd like to do, if I ever get it together to add e-commerce to my site.</p>
      <p>The big sites depend on representing a lot of foundries, fairly indiscriminately, to bottom trawl the end of the long tail, and in order to keep a constant stream of fresh product enlivening their sites, which no foundry can do at the same rate, although FB and House keep up a fair clip. FSI and Linotype maintain production rate by actively courting freelance designers. FB and Emigre publish both in-house and freelance designs.</p>
      <p><em>But smaller foundries are never going to be able to make much less distribute these fonts succesfully.</em></p>
      <p>It would be nice to think that the Internet levels the field, but the traditional retail distinctions of manufacturers, wholesalers, retailers, factory direct, and distributor house brands still apply, along with the conflicts they produce. Then mix in custom work done by individuals who work for or own one or more of those categories, or freelancers, and it gets messy. Nothing to do with technological capabilities.</p>
