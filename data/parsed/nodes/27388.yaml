      <p>&gt;Research will, I believe, give credit to some of those people as designers of those Linotype faces, rather than, as stands, the senior figures who art directed. More Lardent, less Morison.</p>
      <p>It is not good to assume that the lowly drawing office employee had any talent whatever, other than being able to draw very simple things accurately. David Saunders, who ran the Monotype Drawing Office for many years, told me that he would often hire applicants with no previous experience whatever. He would give them a circle to draw. If they could correct their drawing reasonably well, they'd have the job. This does not, of course, resolve certain mysteries, like who is really responsible for Bembo? Or, for that matter Times. But Lardent had nothing to do with it, so it seems. Either you believe the Giampa fantasy, or you look at Tracy's careful study of Plantin and Times, which completely explodes the myth of Lardent's involvement. I did not agree with Walter Tracy's later, positive assessment of the Giampa claim, and he was so frail at the time . . . though I must say he gave me some nice tips on Pilgrim.</p>
      <p>&gt;Anyway, all workers are drones, e.g. Michelangelo doing the Sistine Ceiling, or Bach The Art of the Fugue.</p>
      <p>So drone = Bach = Michelangelo = Shinn? </p>
      <p>In any case Papa Berlow is absolutely correct in stating that there were a lot of drawing office people who, for example, only drew straight lines and only drew them where they were told. On the other hand, there were, indeed, some more sophisticated drawing people, i.e. there was a spectrum. But it is nearly impossible at this point to make a case for any of them having any substantive input into the aesthetics of any of these typeface designs. Furthermore, heck, you have a drawing, and the drawing is great, and you make the punches. What if the testing then shows all kinds of defects in letters x y and z? Who is responsible for fixing them? Where does that show up? Yak yak. Let's face it, the interesting stuff at Lino is being done by Dwiggins, Griffith, Jones, Burke, etc. . . . not that anonymous drone. It is a little more difficult to work things out at Mono, given Morison's complex interactions there and his own interest in promulgating a picture that would do him the most good.</p>
      <p>And Nick, in 1994, Hoefler's anonymous drones were not getting any credit for the work they did. I never saw HTF Didot being co-attributed to anyone else, did you?</p>
      <p>BTW, Lardent's 'Times' was digitized by Matthew Carter and used to set at least one menu I have. </p>
      <p>You know, if you look at a Talley of Type, it is above all about how Morison and his successors were always learning how to make type, it was always experimental, they were always making mistakes, there was always something new to learn. For all his self-serving spin, Morison is so very modest next to the people nowadays who claim they know all about type. There doesn't seem to be any type that Morison et al. write about where they don't say, 'this is what we did wrong.'</p>
      <p>Speaking of rather interesting design errors that have proliferated into digital, can anyone tell me what is the obvious, unGillish error in the upper case italic of Joanna that needs to be fixed?</p>
    html_clean: |-
