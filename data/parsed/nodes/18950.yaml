      <p>: : : :</p>
    <p><strong>1 April, 2006 - U.S. Government Announces Font Anti-Piracy Initiative</strong></p>
    <p><em>Washington, D.C.</em> — Today the Bureau of Alcohol, Tobacco &amp; Firearms (ATF) announced a major offensive to stop font piracy. Its team of specially trained investigators apprehended a syndicate of online font software pirates and is investigating reports of counterfeit fonts. For complete information visit: <a href="http://www.fontpolice.net/" title="http://www.fontpolice.net/">http://www.fontpolice.net/</a></p>
    <p>: : : :</p>
