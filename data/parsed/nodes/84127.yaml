      <p>Thanks, Nick. I don't see Unit as all that square. Your Alphaville is futuristic, as the name indicates, rather than humanist. To me the Caslon thing has the jelly bean awkwardness. I guess that I should have said squarish with humanist proportions and rounded corners. Kobayashi's Euro Candy is square and wide, with rounded corners. And, as I think Shaw says, not nearly as successful a design as Akko. </p>
      <p>Hrant, I don't expect change, as I don't see where it's going to come from. When there were scribes, there was a continual evolution of letter forms. But since printing eclipsed the scribes, I guess by about 1500, I don't see changes in the skeletons of the letter forms. The dropping of the long s was about the biggest thing, and that was dropping a form rather than inventing one.</p>
