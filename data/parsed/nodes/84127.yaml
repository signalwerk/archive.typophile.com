      <p><em>What amazes a naïve present-day individual, who assumes that Roman is more legible than Textura, however, is that text types persisted for so long before being displaced by Romans. Here, we can say that they persisted because "people want to read what they are used to reading", which explains why that form persisted for so long, and yet Romans eventually won out, proving they were superior.</em></p>
      <p>Where are you talking about? Germany and its neighbours? There was the small matter of the Second World War that put an end to the use of blackletter, first by the Nazis who realised that it wasn't useful for communicating with most conquered peoples (cf. the notorious Bormann memorandum), and then after the War by the western powers because of its association with the aesthetics of Nazism. [Notably, blackletter remained more common in East Germany, since the Russians didn't really understand the Latin script controversy; something I learned when I was in Leipzig.] So there is nothing in this that proves that roman types are 'superior'; rather, it demonstrates that script preferences are predominantly cultural (cf. the relative prominence of roman types in Catholic Bavaria compared to other parts of Germany), and it takes a major cultural crisis to change them dramatically.</p>
