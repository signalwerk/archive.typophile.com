      <p>John, thanks for the reminder that scribes kept going until the typewriter. That influenced Baskerville, as I learned from you, but those types don't change structure. I wonder if the dominance of type in visual culture, and its high readability crowded out other experiments. There were new forms of script from the pointed flexible pen nib, but what was adopted in type, Baskerville, is the humanist style redrawn with such a pen, rather than the florid style of Bickham. Maybe what's going on is just that the Carolingian Miniscule is so wonderfully readable, that other more florid styles could never get a grip as text type. </p>
      <p>By the way, I'm rethinking the ascender-descender thing, Hrant. If you count the semi-ascenders like the ij and t, then there are 9 ascenders and 4 descenders, with the j having both. So there you have 13 letters, half the alphabet, with ascenders or descenders. Would say sticking a descender on the right of the n—the most likely candidate——really help? I suppose we can type some text with the eng, and see. </p>
      <p>Ok, curiousity has got the better of me. Here's some of John's last post with the n replace by an eng:</p>
      <p>"I thiŋk the popularity of civilité types is the best example, aŋd suggests to me the persisteŋce of the idea -- loŋg after Guteŋberg followed textura maŋuscripts aŋd Aldus aŋd Griffo adapted humaŋist book haŋd aŋd chaŋcery italics -- that typographic cultureshould follow the lead of professioŋal, formal documeŋt productioŋ. It also suggests to me why this idea decliŋed iŋ the face ŋot of the eclipse of the scribes but the explosioŋ of ŋew scribal styles iŋ the 17th aŋd 18th Ceŋturies: type fouŋders aŋd publishers couldŋ’t afford to keep up with chaŋgiŋg fashioŋs of coŋtemporary writiŋg."</p>
      <p>Probably it ought to be a straight descender, to not fight with the g and y, but I kind of like it! </p>
      <p>[Confession: I first tried the n descender as a teenager!]</p>
