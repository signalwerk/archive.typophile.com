      <p>Bill: <em>That influenced Baskerville, as I learned from you, but those types don't change structure. I wonder if the dominance of type in visual culture, and its high readability crowded out other experiments. There were new forms of script from the pointed flexible pen nib, but what was adopted in type, Baskerville, is the humanist style redrawn with such a pen, rather than the florid style of Bickham.</em></p>
      <p>Yes, but I do recommend taking a serious look at the much earlier civilité phenomenon, which is something else entirely and, I think, represents the both a serious attempt to follow scribal fashion in text type and the ultimate financial case against doing so. The number of fonts of civilité type produced was significant, and it must have required considerable investment. I don't think we can say for sure that the subsequent dominance of the roman model is based on its 'high readability', or not on that alone. A variation on the notorious Emigre dictum seems apt: people want to read what they are used to reading. During that time when what a lot of people read on a daily basis was handwriting, there remained a tension between the conservatism of book typography and the greater variety of written styles. Every once in a while, some brave and brilliant type maker such as Granjon tried to resolve the tension by making type in the image of contemporary writing. As you say, in the 18th Century, the tension was resolved in a different way, by creating a new roman using the familiar structures but the characteristics of the pointed nib. But it was the writing masters who did this, not the type makers.</p>
