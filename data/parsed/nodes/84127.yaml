      <p>Bill, while the Italian humanist formal hand that is the model of our roman lowercase forms is directly descended from the Carolingian minuscule (note spelling), I think it is a mistake to refer to it as such. The Carolingian minuscule forms exhibit a number of differences from the later forms that are characteristic of the style, notably the absence of serifs, which the Italian humanist hand brought over from the capitals to the lowercase, surely one of the most important developments of the Latin script in terms of subsequent typographic tradition.</p>
      <p>Note that I wasn't associating familiarity with ease of reading -- as you say, it is a prerequisite, but given how quickly we seem to be able to familiarise ourselves with new styles, I don't think it is a critical issue --, but with cultural preference. This seems to me an important factor in the relationship of writing and type during the long periods of overlapping scribal and typographic cultures, because if you look at the documentary culture in e.g. late 16th Century France and the Low Countries, or in late 17th Century England, you see the sources of tension that lead on the one hand to the development of civilité types and on other to the writing of roman forms with a split nib that provides the model for Baskerville. These developments occur, I believe, in response to the desire to create a unitary text culture or aesthetic, (unitary in the sense of bridging writing and typography, not in the sense of having a single style of letters: within this unitary culture, a lot of different styles exist and are used to complement or contrast with each other).</p>
