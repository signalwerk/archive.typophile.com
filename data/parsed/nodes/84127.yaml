      <p>@John Hudson:<br>
      <cite>I don't think we can say for sure that the subsequent dominance of the roman model is based on its 'high readability', or not on that alone. A variation on the notorious Emigre dictum seems apt: people want to read what they are used to reading.</cite></p>
      <p>It is quite true that the current persistence of Roman types, versus other alternatives, is not in itself very conclusive evidence of how readable they are.</p>
      <p>What amazes a naïve present-day individual, who assumes that Roman is more legible than Textura, however, is that text types persisted for so long before being displaced by Romans. Here, we can say that they persisted because "people want to read what they are used to reading", which explains why that form persisted for so long, and yet Romans eventually won out, proving they were superior.</p>
      <p>Also, one can consult Typographical Printing-Surfaces, and get some objective data which might support a claim that Romans are more legible - overlapping the outlines of different letters, and counting the proportion of area that is different. Certainly, it strongly <em>seems</em> as though they are more legible than the typical Gothic writing style.</p>
      <p>However, an alternative hypothesis is that text types declined along with the rise of the vernacular - so educated people who used to read books in Latin, set in Roman type, moved over to reading their books in the vernacular, and thus demanded these books in what they were used to. (On the other hand, reading a book in a second language is, of course, a more demanding task - and so the choice of Roman for Latin books again points to Roman type as being more legible.)</p>
      <p>In moving from old-style typefaces to more recent ones, counters have opened, and x-heights have increased. To me, that says that despite people reading what they're<br>
      "used to", incremental improvements in the direction of higher legibility are possible, and they will be accepted. Of course, historically, these changes resulted from economic pressures to use smaller sizes of type to save paper.</p>
