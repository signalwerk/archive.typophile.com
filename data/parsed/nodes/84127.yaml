      <p>The situation at the beginning of typography, vis à vis a unitary aesthetic, isn't what I was talking about. A unitary text culture exists by default whenever a script is reduced to typography, because the dominant formal book hand inevitably seems to become the model of the typographic book, followed by adoption of informal hands in secondary roles. We see this not only in the European situation, but repeated throughout the world. The tensions to which I referred, develop subsequently, as written text adopts new forms.</p>
      <p>Also note that unitary text aesthetic does not necessarily imply particular styles or forms of letters in contemporary use in both type and writing, but modal harmony between type and writing. We see this in the 18th Century English experience, where there is a need to develop a form of roman type-like writing that harmonises with contemporary script styles, rather than with the obsolete broadnib italic.</p>
      <p>By the way, having got a good picture through my research of the development of what I call the 'English Roman' by the writing masters and engravers, I am now looking at pre-Baskerville applications of the style in <a href="http://www.afamilystory.co.uk/desborough-surrounds/rothwell/parish-church/images/304.jpg" rel="nofollow">stonecut lettering</a>. Again, this seems to me further evidence of the desire for a unitary text culture, in which people seek to surround themselves with a harmonious aesthetic of the written, engraved, carved and typographic word.</p>
      <p>In the 19th Century, the text aesthetic begins to be influenced more and more by other aspects of culture and society, so one starts to see ‘industrial’ styles of lettering and then, as the scribal culture declines with the introduction of the typewriter, a stronger connection between text and design, particularly architecture.</p>
