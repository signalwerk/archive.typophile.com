      <p>I tend to limit my use of the term serif to near-horizontal and bilateral terminals or to constructed terminals -- e.g. the triangular ascender terminals that require a secondary stroke --, and don't apply the term to all entry and exit strokes. My reason for this is that I also work with Greek and other scripts with a traditionally steeper pen angle, and while the entry and exit strokes of Carolingian minuscule are serif-like the same constructions in Greek are not. I like to be able to talk about entry and exit strokes independently of serifs for this reason.</p>
      <p>I'm happy to accommodate the view that the entry and exit strokes of Carolingian minuscule are serifs, though, and amend my earlier point to say that the Italian humanist hand brought over the bilateral roman serif from the capitals to the lowercase.</p>
