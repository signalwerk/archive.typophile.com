      <p>You're right of course about the model being the humanist revival of Carolingian minuscule, not the original, which didn't have the serifs. Is there a simple name for the humanist revival, which added serifs, and became more upright?</p>
      <p>I am skeptical about a unitary aesthetic. It seems to me likely that after the introduction of printing, the kind of formal hand that was used before for books, for extended reading, was no longer called for, even though hand written materials were widely used. So maybe what is going on is the acceptance of more cursive styles for hand written material, but for text type, the model remained the humanist minuscule. </p>
      <p>Oops, this doesn't take into account the long battle over whether to use blackletter for text. So there's more to the story...</p>
