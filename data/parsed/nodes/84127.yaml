      <p>Michael, sorry, I should have explained more fully. I was concerned that someone would jump on this after I posted. I know about the serifs you have shown. </p>
      <p>What happened, according to the lovely illustrated lecture I saw recently at the TDC, done by Sumner Stone, is this: in an effort to make the Carolingian minuscule more like the Imperial Capitals, in the 1400s they were fitted with more symmetric serifs, in place of the hooks and barbs that are more natural with the pen. And the strokes were made more vertical. The Imperial Caps were originally brush drawn, and serifs built up with more strokes than the Carolingian minuscule. So the humanist modification was an effort to harmonize a script that was a product of the pen with one that was product of the brush.</p>
      <p>Sumner said his beautiful Magma was an effort to find another way to harmonize the upper and lower case.</p>
