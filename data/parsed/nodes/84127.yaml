      <p>The ligatures are pointless, but harmless, as they are options. What I really like about Akko is that it manages to have some strength along with softness. </p>
      <p>We have being experiencing what I like to call the "attack of the soft sans", with cuteness and friendliness being the goal. These are both worthy goals, but the results have appeared to me often as weak or cloying. Although cuteness can be wonderful, it has a limited use, and for a few words in display. </p>
      <p>Rounding often leads to an obese "jelly bean" look in heavy weights, and weakness in the light weights. </p>
      <p>Here by having the strokes more stiff and square, with more humanist proportions, to me the result has some strength. I can see the inspiration in the Japanese examples he shows—I also heard his talk at TypeCon—and I think the result is something fresh, which is pretty rare. I think the bolder rounded weights are most attractive, and I hope will be used. </p>
      <p>And indeed, the general inspiration, Cooper Black, is one of the few very rounded serifs that has strength along with its friendliness.</p>
      <p>Is there another very square sans with rounded terminals? Here it seems he's introduced a new style, and executed it very well.</p>
