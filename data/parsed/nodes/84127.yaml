      <p><em>Your Alphaville is futuristic, as the name indicates, rather than humanist. </em></p>
      <p>The name refers to the movie, in which Alpha 60, the computer which runs the city, quotes from Borges' <em>New Refutation of Time</em>. The intention was to recontextualize type with a little bit of something from many generations of letter technology. The upstroke in the face is informed by calligraphy, the modulation of stem thicknesses by metal type, and the squareness and geometric curves by vector drawing software. It's Postmodern, not futuristic.</p>
