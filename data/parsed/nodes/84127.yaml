      <p>Hrant, as I have said before, I don't think the lower case roman has problems of differentiation. Certainly the s and c and t are highly differentiated, and I don't see that they need any further help. Also while the ct ligature is historical, as far as I know the "st" ligature is an anachronism. The original ligature was the historical long s and t. </p>
      <p>I suppose that someone can use them playfully to good effect in the right context, but personally I find the st and ct ligatures distracting and irritating. </p>
      <p>In a cursive, connected script, I don't have any objection to them in principle, but I do for roman text type.</p>
