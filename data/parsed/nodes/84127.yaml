      <p>Bill: <em>When there were scribes, there was a continual evolution of letter forms. But since printing eclipsed the scribes, I guess by about 1500, I don't see changes in the skeletons of the letter forms.</em></p>
      <p>Typographic printing fairly rapidly took book production out of the hands of scribes, but scribal culture isn't eclipsed by any means, and persists as invaluable to commerce, diplomacy, etc. until the development of the typewriter. During this time there are some interesting and telling examples of novel scribal developments in letterforms very directly influencing tastes in typography. I think the popularity of civilité types is the best example, and suggests to me the persistence of the idea -- long after Gutenberg followed textura manuscripts and Aldus and Griffo adapted humanist book hand and chancery italics -- that typographic culture should follow the lead of professional, formal document production. It also suggests to me why this idea declined in the face not of the eclipse of the scribes but the explosion of new scribal styles in the 17th and 18th Centuries: type founders and publishers couldn't afford to keep up with changing fashions of contemporary writing.</p>
