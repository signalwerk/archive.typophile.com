  html: <p>Hi all, <br> <br>If you taek a stroll on to <a href="http://www.1001fonts.com" target="_blank">www.1001fonts.com</a> and do a search for a typeface called "Pill Popper" you should find that it has no uppercase letters. <br> <br>I created this during my college/uni years and never got around to doing the uppercase. It's downloadable as a TTF only - I created it with some cheap program called Font Creator Program v4 (original, eh?!?) which did me well back then. <br> <br>Anyway, I thought some of you geniuses might feel the urge to give it some uppercase siblings. I've not got much time to do them so maybe someone out there can. <br> <br>If someone does finish the font off - let me know,and I'll amend the download on the site with the new font and the your name/details! <br>Cheers!</p>
  html_clean: <p>Hi all, <br> <br>If you taek a stroll on to <a href="http://www.1001fonts.com" target="_blank" class="link-external">www.1001fonts.com</a> and do a search for a typeface called "Pill Popper" you should find that it has no uppercase letters. <br> <br>I created this during my college/uni years and never got around to doing the uppercase. It's downloadable as a TTF only - I created it with some cheap program called Font Creator Program v4 (original, eh?!?) which did me well back then. <br> <br>Anyway, I thought some of you geniuses might feel the urge to give it some uppercase siblings. I've not got much time to do them so maybe someone out there can. <br> <br>If someone does finish the font off - let me know,and I'll amend the download on the site with the new font and the your name/details! <br>Cheers!</p>
