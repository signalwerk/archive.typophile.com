      <p>Thank you for your responses, gentlemen.</p>
      <p>I guess my actual question is: have you used Capsa or Musee in creating something?  And out of anything you created, can you share a sample?  A book page, a magazine article, a logo, a headline, etc.?</p>
      <p>I want to get a sense of how these typefaces might be used in the real world, beyond the mouth-watering PDF specimens already available.</p>
      <p>Thank you in advance.</p>
      <p>Rahim</p>
