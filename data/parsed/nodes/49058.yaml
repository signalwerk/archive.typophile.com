    <p>Dino dos Santos is a busy guy.  I've been looking at specimens of his Capsa and Musee.</p>
    <p>Has anyone used these?  If so, how did you like working with them?  Any specimens you'd like to share?</p>
    <p><a class="freelinking external" href="http://www.typetrust.com/fonts/font.php?id=NjQz" rel="nofollow">Capsa</a></p>
    <p><a class="freelinking external" href="http://www.typetrust.com/fonts/font.php?id=MTU2" rel="nofollow">Musee</a></p>
    <p>Thanks for offering your impressions.</p>
    <p>Rahim</p>
