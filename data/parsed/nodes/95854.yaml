  - id: 520243
    user: 8008
    date: 2012-08-28T09:14:00
    date_raw: 28 Aug 2012 — 9:14am
    votes: null
    html: |-
      <blockquote><p>I think the new |2| has more balanced counters.<br>
      As for the |4|, I’m not sure, but I suspect it’s slightly concave so not to appear optically convex.</p></blockquote>
      <p>The counters in the /2/ might be more balanced but not many people would even call the bottom shape a counter or try to balance it. To me it looks grim. As for the /4/, I would have thought one wanted to open the counter up, not close it. I'm really not getting that at all, it certainly isn't convincing me it's straight (or not convex), that's crazy. Plus it looks so much wider than the other numerals :/</p>
      <p>Nick, how many years must pass before one can "swipe" a design? Five, fifty, five hundred, never? Who decides? Why is a revival so much more acceptable? Isn't a revival a similar excuse for lack of originality/creativity masquerading as being the saviour of a design that would otherwise have been lost to us through the ruthlessness of natural selection? Maybe there's nothing new under the sun? After all, it's not like Segoe UI is traced from Frutiger. </p>
      <p>I quite like Segoe UI although the places I dislike it tend to be where it deviates from Frutiger the most so maybe it's not Segoe UI that I like at all! As for the morals of its existence, I'll happily let others be the judge.</p>
    html_clean: |-
