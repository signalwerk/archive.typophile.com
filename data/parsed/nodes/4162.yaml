    html: "<p>James, I checked out Glamour today. Typopgraphy-wise it looks busy, but they probably know what they're doing. As for the Perpetua, I think it's working great. Some questions: <br>1) Do you think they're actually going to the trouble of using the optical sizes properly? If you look at page 72 for example (the May issue), there's at least three sizes of the type, but they all seem to be the same master. <br>2) Did they ask for the optical sizes, or is that something you convinced them was a good idea? <br>3) How did they choose Perpetua in the first place - did they ever verbalize a reason to you? I actually think it's a good -and interesting- choice, I'm just wondering what their thought process was. <br>4) Are you sure Monotype doesn't mind? Sure, the data is from scratch, but stylistically it's totally Perpetua, no? On the other hand, the magazine owns a license to a version of the original, so... <br> <br>hhp <br></p>"
