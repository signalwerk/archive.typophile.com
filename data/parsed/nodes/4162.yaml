    date_raw: 11 Apr 2004 — 3:24pm
    votes: null
    html: "<p>Stephanie, the issue of readability is extremely complex - to the point that it might not be understood within our lifetimes. But I think we can grasp parts of it, like the issue of vertical proportions (especially x-height). On the other hand, you'll never get everybody to agree on the details! In fact the following explanation isn't something \"the establishment\" endorses (but mostly because they simply haven't bothered to think about the issue enough - to take it seriously). <br> <br>Just like there's a duality between display and text type, there's a duality between legibility and readability. The former relies on the clear decipherability of individual symbols. As you say, it's easy to ensure decent legibility*; you'd have to make the text very small, the lighting very poor, or the letterforms extremely strange to reduce legibility substantially. This makes it fall in the realm of display typography, because people have plenty of time to decipher and compile the letters. But the latter (readability) deals with reading at the limits of performance, like when you're deep into a fast-paced novel, or trying to finish an article before an important meeting. In this case, the brain is more in a hurry, so it uses more of the retina, and relies more on its powerful heuristics to partly guess what the words are (to speed things up)**. Part of the reason to rely on guesswork is that most of the surface of the retina has low resolution, so you can't even see the individual letters very well (unless you take the time to look at all of them directly, but that slows things down unacceptably - and the point is unnecessarily). But you <i>can</i> see the outlines of words much deeper into the retina, and because these outlines -when taken in the context of \"expected\" phrases and grammatical structures- are enough to nail down the actual word, it works out geat. This means that such \"immersive\" reading relies more on ascenders and descenders in proportion to the x-height compared to \"deliberative\" reading. <br> <br>* Which is why most people think any old font is fine for any setting. <br> <br>** This is why typos are missed more in high-speed reading. <br> <br>So the optimal x-height for a given situation depends on the point it's at between pure legibility and pure readability. Take the case of a newspaper: because it's disposable, the paper is cheap, the point sizes are small; and then there's the fact that newspapers are often read while in motion, and in poor/variable lighting. All these things combine to make a good newspaper font to have a large x-height. But if you look at a book, it's read in much longer stints, in much more controlled environments, with less regard for economy; so a book face should have more generous extenders because more of  such reading is done \"immersively\", so the outlines of words are more important than their \"brute\" size. <br> <br>-- <br> <br>As for the greater usage of sans in magazines, I suspect it's a cultural thing, not something driven by functionality, because serif fonts are more readable (nominally) for any decent amount of text. <br> <br>hhp <br></p>"
