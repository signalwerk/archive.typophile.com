    date: 2004-04-07T08:46:00
    date_raw: 7 Apr 2004 — 8:46am
    votes: null
    html: <p>Thanks for the plug Eduardo.  <br> <br>I've done a bunch more besides Vanity Fair, and in all those experiences it has ALWAYS been the art director of the magazine that had a very particular view of what the magazine should be typographically. I have not always agreed with their vision, but happily created whatever they asked me to create. So I think Stephanie should really look at the art directors and plot the various magazines they have worked on. I'll bet bullets to bagels that there is a consistent type selection going on throughout their careers. Whether or not it is good magazine typography is a matter of opinion. <br> <br>On a related note, if you find a current issue of Glamour, there are a bunch of things in there that I've recently done, A high contrast Perpetua Display in 6 optical sizes (for those of you who fancy those things) and in particular a Roundhand script whose rights will revert back to me in 2005. I'm busy working up a bunch of alternate glyphs for the OpenType it will become. I would post a sample, but Glamour has the exclusive rights to it till May 2005.</p>
    html_clean: <p>Thanks for the plug Eduardo.  <br> <br>I've done a bunch more besides Vanity Fair, and in all those experiences it has ALWAYS been the art director of the magazine that had a very particular view of what the magazine should be typographically. I have not always agreed with their vision, but happily created whatever they asked me to create. So I think Stephanie should really look at the art directors and plot the various magazines they have worked on. I'll bet bullets to bagels that there is a consistent type selection going on throughout their careers. Whether or not it is good magazine typography is a matter of opinion. <br> <br>On a related note, if you find a current issue of Glamour, there are a bunch of things in there that I've recently done, A high contrast Perpetua Display in 6 optical sizes (for those of you who fancy those things) and in particular a Roundhand script whose rights will revert back to me in 2005. I'm busy working up a bunch of alternate glyphs for the OpenType it will become. I would post a sample, but Glamour has the exclusive rights to it till May 2005.</p>
