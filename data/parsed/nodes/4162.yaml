    html: <p>The Font Bureau have also designed a number of typefaces for various magazines. David Berlow has done several. Tobias Frere-Jones did quite a few while he was there, before he joined up with Hoefler. Cyrus Highsmith has worked on a bunch. <br> <br>Magazines include <i>Traveler, Worth, Premiere, Newsweek</i> (I don't think Carter's Vincent was ever used for Newsweek's text; are they still using FB Scotch for body copy?), <i>Esquire, Fast Company, Vibe, Martha Stewart Living.</i> I'm sure there are others. <br> <br>If you track Roger Black's magazine redesigns, you'll find a trail of FB custom-developed typefaces. <br> <br>-- K. <br></p>
