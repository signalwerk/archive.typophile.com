  html: <p>I'm interested in researching typefaces that have been designed specifically for magazines.  I've started with Hoefler typefaces, but am not sure where to go next.  Also, I'd like to learn more about what makes a good magazine font and specific issues that are taken into consideration when designing them. <br> <br>Are there are recommended starting points or resources that may be of help? <br> <br>Thank you kindly!</p>
