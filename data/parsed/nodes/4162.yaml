    html: '<p>Great information thus far. Thanks to everyone!  <br> <br>A few more questions:  <br> <br>On the subject of art directors, any good ones with noticable track records that I should check out to get a good idea of their influence on type design?  <br> <br>Why is a high x-height used? Does it involve readability?  <br> <br>For that matter, are we talking about display type or text type? I would assume that readability is not as much of an issue with display type than it is with text type. In the case of display type, are there any deciding factors formally, or is style the main issue?  <br> <br>As for text type - how does the design of magazine text type differ from book text type? Are there any technical issues with the printing process that might require a special design, or is the design focused more on formal issues?  <br> <br>"They tend to be more often sans than serif. Not sure why."  <br> <br>Hrant, is this in reference to text type? I seem to recall seeing mainly serif typefaces in most magazines (at least in large bodies of text). Or are you speaking of display typefaces or something used for titles, headings, etc.?  <br> <br>Thanks again for the insight. I am a novice when it comes to type but am eager to learn more!</p>'
