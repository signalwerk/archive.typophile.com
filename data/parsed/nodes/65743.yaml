    html: |-
      <p>Your head will explode if you try to narrow down one typeface and examine its usage in several brands. The opposite approach might be more effective. </p>
      <p>Might I suggest the topic of political candidates?  You might find the research easier if the branding is just for one person with clearly stated positions, rather than products with more nuanced messages. Plus, with politicians, you can definitively show which typeface "won."</p>
      <p>There is a wealth of information analyzing Barack Obama's smart choice of Gotham for his political campaign. McCain chose more safe, traditional (dull!) branding with a somewhat military-looking logo. </p>
      <p>Just a thought!</p>
