    html: |-
      <p>That lettering brought to my mind immediately Cartoon Bold (Howard Allen Trafton, 1936). I don't know why no one has made a mainstream digital version of this, because it is still seen in use all the time.</p>
      <p>There <em>are</em> digital version out there, including David Rakowski's <a href="http://www.faces.co.uk/fonts/Intecsas/Adineski-Bold-IN20125/" target="_blank" rel="nofollow">Adineski Bold</a>, Fontbank's <a href="http://www.buyfonts.com/value_for_money/caricature.htm" target="_blank" rel="nofollow">Caricature</a> and Cancun on CorelDraw CDs.</p>
