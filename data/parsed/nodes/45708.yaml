      <p>Bill: <em>The question here is not whether the written forms were influential, which everyone agrees, but whether Jenson and Griffo made a fundamental change and advance. That Stone does seem to think so in the above quotation, and that the change was away from the written forms. Do you disagree?</em></p>
      <p>I don’t think the change was significantly ’away from the written forms’, at least not in terms of the text culture in which both print and manuscript, type and writing, were still very much in daily ’conversation’. As I wrote in the earlier discussion, I think the kind of features to which Sumner draws attention — treatment of serifs, of connection between strokes, of subtle variation in weight — are very important within a narrow history of typography and more specifically of typeface design. And perhaps they are most important in terms of being able to make letters <em>smaller</em> while retaining open counters, clean connections and crotches, etc.. But the letter forms are still ’fundamentally’ the same as the written forms: the treatment of terminals are idealisations of the written terminals, the variations of weight are variations on a pattern established by the ductus of the pen, and the counters and crotches that are being given attention to survive the printing process as the same counters and crotches that result from the writing of the same letters. And I think one of the best ways to judge the significance of these innovations, in terms of moving away from the written forms, is to compare them to 19th century types that really do leave the chirographic models behind (and in many cases become ugly and difficult to read in the process).</p>
