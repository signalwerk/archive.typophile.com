      <p>Eliason, Noordzij focuses on rotation within the stroke, which he says is mannerist, and not earlier. I don’t see a discussion of rotation between different strokes. Stone doesn’t discuss rotation. </p>
      <p>The thicker right strokes of the H’s in your picture may be partly because they veer a bit to the diagonal, and perhaps are borne down on more. It looks like this is a deliberate effort to distinguish the H’s from two I’s or LI. The pen seems to be held at something like a 60 degree angle for this style of letters, (cf the Youtube video), so, contrary to the stone-inscribed Capitals, the verticals are generally lighter than the horizontals and diagonals also quite thick. I suspect rotation of the pen is not required. </p>
      <p>Thanks, James, the quote from Harry Carter is apt. I would just expand on that by saying that the ’skill of his punchcutter’, apparently Griffo, is a mastery of design, as well manual dexterity. To cite just one example, the diagonals are lighter than they would be than if written by pen at a constant angle, and so more even color of the text is achieved.</p>
