      <p>Bill, my suggestion is that the break Sumner documents is <em><strong>not</strong></em> <strong>fundamentally</strong> <em><strong>away</strong></em> from writing in the scribal tradition. A contrast scheme that it imposed remained in place and persists into the digital present.</p>
      <p>Rather, the break is away from the earlier more literal paraphrase in type design of scribal exemplars. The development is augmentative, not radically transformative. The contrast scheme introduced by scribal writing persists but changes in weights and connections as well as increased formality are introduced, sometimes on the basis of historical precedents. The basic letterform is still critically dependant on writing in the scribal tradition. Nevertheless, the shift from strict paraphrase to feature-manipulative exploration atop a received contrast styling template is decisive — the flesh and blood of type design.</p>
