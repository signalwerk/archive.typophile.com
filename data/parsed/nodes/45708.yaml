      <p>Bill: <em>He says that the symmetric serifs did not arise from any written form. It arose rather from painted and carved forms.</em></p>
      <p>They’re serifs. As such they are a standard feature of the humanist bookhand. They’re not something new, only something given an idealised treatment by making them closer to classical inscriptional form. Since the serif of the manuscript bookhand also owes its origin to the classical serif, I don’t think the detail of the treatment is very significant.</p>
      <p>Again, what I think we need to remain conscious of is that we’re talking about a single text culture, with simultaneous and parallel manuscript and typographic forms. There’s a tendency to portray print media as revolutionary and progressive, but I think that is basically bad history and overlooks the degree to which the material form of that media is well established by the manuscript tradition.</p>
      <p><em>I don’t want to quibble about what is ’fundamental’ or ’essential’, but what I do think is that Jenson and Griffo had a conscious goal of improving on their written predecessors, that they were willing to contradict the written models, and that they succeeded particularly in increasing readability.</em></p>
      <p>I think they had a conscious goal of producing books in a format and style suitable to the subject matter and tastes of Italian humanism. I’m not going to guess whether they ’increased readability’ because we don’t know very much about renaissance reading habits, in print or manuscript. What we can say is that succeeded in making the standard size of text smaller than it had generally been previously, because that is observable.</p>
      <p>Re. Noordzij and rotation:</p>
      <p>When Noordzij writes about rotation and the stroke he is talking about writing styles based around rotation, which is the characteristic development of mannerist writing. That is, he is not talking about rotation as a phenomenon within writing but as a strategy that is central to a particular kind of stroke and hence to a particular kind of writing. Noordzij is also talking about rotation <em>in the stroke,</em> not rotation in the transition between strokes and not in the treatment of terminals.</p>
      <p>There are three kinds of rotation that can occur during the act of writing: unconscious, deliberate and habitual. The importance of unconscious rotation can be demonstrated by having a robot write a translation based style such as the humanist bookhand with a broadnib pen, or using a fixed angle broad brush stroke in a computer drawing program. Even a strongly translation based style such as textura blackletter, written by a human with a handheld tool, is full of modulation caused by minor and largely unconscious rotation.</p>
      <p>Deliberate rotation involves consciously rotating the hand or arm during writing to achieve particular affects. One of the most obvious examples is the creation of a thin hanging terminal to a translated horizontal stroke or curve, e.g. at the top of an uppercase C G or S (as in the ’SEASONINGS’ example above). Note that the pen never leaves the page to create these forms: they are not ’built up’, but are true terminals to the stroke, made in a continuous movement.</p>
      <p>Habitual rotation is what happens when a scribe has internalised deliberate rotation as a feature of writing, so that it happens unconsciously as he or she writes, allowing speed and confidence.</p>
      <p>We’re in an unfortunate situation in the West now, in that we don’t have a professional scribal class anymore. We have calligraphers, but calligraphy is really art made with letters and words, not text for reading of the kind that is produced on a quotidian basis in a manuscript society. This makes it somewhat difficult for us to judge what might be possible, or not possible, in the context of a formally written manuscript hand, produced by an experienced professional scribe who spends everyday producing text in this hand.</p>
      <p>But we do have the recent evidence of one of the world’s last surviving major manuscript cultures, in Pakistan and India, where until recently many newspapers were produced by professional scribes in the Persian nasta’liq style of Arabic script. Now it happens that the nasta’liq script uses a fourth kind of stroke that Noordzij does not describe, presumably because it has not been a feature of European writing (although I fully expect that examples of it can be found in the work of European and American calligraphers, who have experimented with tools and techniques beyond the European scribal heritage). Nasta’liq is written with a broad nib reed, like other Arabic scripts, but one of the characteristics of the style is the systematic variation in weight between letters; the thinnest strokes are not achieved by either translation or rotation, but by lifting one corner of the nib. [If the characteristic stroke pattern of the European pointed split nib is called by Noordzij ’expansion’, perhaps the stroke model of nasta’liq might be called ’contraction’, because the fixed width of the broad nib is contracted by removing part of it from contact with the page.] In writing nasta’liq, the scribe must perform a number of extraordinary feats: writing starts above the baseline and letter clusters slope downward, so he must anticipate the depth of the full letter cluster as he starts to write it so as to end in the correct relationship to the baseline; alternating stroke weight is also reckoned backwards from the final letter, which is never thin, so he needs to determine the number of varying strokes across the letters in the cluster and start with the appropriate weight; as with all the major Arabic script styles, consistency is an expectation, so he must be able to produce the same shapes in exactly the same way, time after time, day after day.* And in the midst of this, he must perform one of the trickiest manipulations of the pen, lifting and lowering a corner of the nib repeatedly at just the right moments. In order to write with speed and confidence, all these things need to be internalised and habitual.</p>
      <p>*I have a splendid example of two <em>bismillah</em> in nasta’liq style written by the Turkish calligrapher Kemal Batanay that demonstrate the virtue of consistency: they are written twenty-two years apart, and are all but identical. These are calligraphs, of course, not scribal text, but the consistency they demonstrate is an expectation of the style, not of the writer. In something like newspaper production, there is a secondary need for consistency, because the identities of the different scribes should not draw attention.</p>
      <p>So I’m wary of making claims about what scribes, in renaissance Italy for instance, could and could not do. I think one needs to look at a lot of examples and then talk about what they <em>chose</em> to do. The choice might well have been influenced by ease or efficiency, but that’s something different from manual or material restriction.</p>
