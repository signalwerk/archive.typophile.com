      <p>Bill, as I understand it, a letter such as the lower case l (in the music sample I referenced) was made with a combination of rotation and pressure adjustment.<br>
      It starts off at the top with the nib parallel to the baseline, but the pressure is not as great as those letters which begin with an angled stroke, therefore the width of the stroke is not as thick as it would be with the pen held at an angle and heavier pressure.<br>
      At the bottom of the main stroke, the pen was rotated to the standard angle to finish the letter.</p>
      <p>On the crossbar of the t, which ends with the terminal vertical, the pen was rotated from the standard angle to vertical, and eased up at the same time.</p>
      <p>However, I could be wrong about this, perhaps the scribe used a different technique, perhaps even two pens of different nib width.</p>
      <p>At any rate, the flat-footed and perpendicular terminals of serif-less strokes cannot be made with a broad-nibbed pen held at a fixed angle.</p>
      <p>However they were made, they represent a technique of construction to achieve a design effect which is not a straightforward representation of “pen rules”, and so offer an obvious precedent—standard practice, in fact— for the inventions of 15th century type designers.</p>
