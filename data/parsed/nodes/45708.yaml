      <p><em>In it Sumner Stone argues that the Jenson and Griffo made a fundamental break with scribal tradition, to letter designs that were critically dependent on the sculpting of metal, rather than on purely pen-written shapes. </em></p>
      <p>I would agree with Stone in the case of Griffo whose work clearly shows a sculptural sensibility, but not Jenson. His work is still tied to the idea of recreating a form rather than creating it. By that I mean that Jenson was looking at a pen letter model as a guide. Griffo was moving away from that idea as can be seen in De Aetna. There are variants of certain lowercase letters and some are — to my eye — sculptural and some still based on pen lettering. Griffo was apparently moving away from the pen model. The typeface of the Poliphili doesn’t have this same level of variance and the letters seem to me to be entirely sculptural. The difference is whether the letter is created positively as in pen lettering or negatively as in carving. </p>
      <p>George<br>
      I felt bad because I had no shoes, until I met a man who had no Bodoni</p>
