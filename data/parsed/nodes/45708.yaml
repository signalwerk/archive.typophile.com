      <p>Bill, I have not read Sumner’s article (my copy of the newsletter has not arrived yet), but it seems to me that you are getting a little over excited when you say ’what is at issue here is Stone’s view that the letter forms of Jenson and Griffo reflect forms that are a product of built up letters, and not written letters’. At least, it seems that way from your summary of Sumner’s line of thought, because Sumner appears to be talking fairly specifically about serifs, i.e. stroke terminals, not ’letter forms’ in toto.</p>
      <p>I’ll just make a few very quick comments:</p>
      <p>1. The point about the difficulty of making classical Roman serif shapes with a pen — especially a reed or quill — is acceptable only within the context of scribal ’publishing’, i.e. document production, in which writing is expected to be fairly fast, even when the formal roman bookhand is being written. More slowly, and as often seen at larger sizes, such serifs can be formed with a pen, as countless calligraphers have demonstrated. So it is not a question of scribes being unable to make such forms with their pens, but of them typically making a different form in the humanist bookhand. In fact, I’d go so far as to say that the whole debate about whether this is possible is a red herring because what really matters is...</p>
      <p>2. ...the conscious decision by early type makers to model their serifs on the classical Roman forms rather than on the typical humanist bookhand serifs. I don’t think this is because there is anything specifically ’sculptural’ about these forms, though. I think they viewed these serifs as a classical ideal, something that resonated with the renaissance rediscovery of classical Roman literature and art and, as such, most appropriate to the subject matter of their books. </p>
      <p>3. But the letter forms themselves are still very much based around the stroke of the written forms, even as details become idealised. And it is interesting to note how this model persists: the structure of typographic letters and their characteristic contrast patterns continue to derive from written forms even as the tools of writing change (most dramatically in the 18th century), while terminals and serifs are subject to idealisation. So in the same way that we can observe someone like Griffo idealising the serifs while following the structure and ductus of the humanist bookhand, we can see Bodoni doing the same thing, three hundred years later, with a different writing model based on a different tool with a different ductus, treating terminals as balls and serifs as fine lines: the forms, in this case, suggested by the characteristics and abilities of the tool, but idealised in their typographic interpretation.</p>
    html_clean: |-
