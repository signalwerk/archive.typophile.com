      <p>Carl, I don’t have calligraphy experience, but I do use my eyes. I am generally fascinated with history of ideas and innovations, and my eyes tell me that Jenson and Griffo made an important advance. But what exactly the advance was, and how it came about is not so obvious. That’s why I’ve read with interest others who have studied this. I’m not relying on them alone, but I’m trying to learn from them.    </p>
      <p>&gt;tools don’t enforce any kind of stylistic choices, certainly not pens of various materials or brushes.</p>
      <p>I don’t really agree with the thrust of your argument, even though your statement here is probably strictly speaking correct: there is no strict “enforcement” of a style. Enforcement, no, but influence, even big influence, yes. </p>
      <p>My eyes and experience do tell me that tools often have a big affect on style. If you are building with stone or wood it makes a difference how the structure is built, even though in theory you can make one look more like the other. The styles of building that evolve from one building material and another tend to be distinctive. </p>
      <p>In the area of writing, when I visited China I saw the influence of the brush vs the pen quite dramatically. I saw hand painted signs all over the place. They were always competent, and often quite well done. The reason is that writing characters with the pointed brush is a traditionally important part of education in China—it goes together with brush painting. But when Roman characters were written with the pointed brush they almost always looked awkward and even childish. The pointed brush just doesn’t lend itself very well to writing Roman, which is mainly influenced by the broad pen. And the writers just didn’t know ’pen rules’ well enough to make the pointed brush to do what would indeed be quite difficult to do with it anyway. </p>
      <p>So I do think that tools have an important impact on writing style. How much of a role they played here, I am not clear, but I tend to think from Stone’s illustrations that the use of brush painting and/or stone carving did have some influence.</p>
