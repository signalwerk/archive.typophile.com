      <p>The questions to me are:</p>
      <p>1. Whether there is something conceptually different going on, not based on the pen? In other words, Jenson and Griffo were making their modifications not based on anything derived from the pen, but rather some different concepts: balance of characters, readability. They were willing to depart from the pen to serve these ideals, even though the pen formed characters were their starting point, and their changes were “conservative,” in that they only changed the written forms where they could see a gain from the point of view of these ideals. </p>
