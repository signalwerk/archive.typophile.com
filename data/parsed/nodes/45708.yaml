      <p>Here is an illustration of “pen rules” on an “A”: the thick-thin that results from a broad pen with no rotation or expansion.<br>
      .<br>
       </p><div class="imageWrap"><img src="/files/Pen rules_3816.gif"></div><br>
      .<p></p>
      <p>Now look at the amazing painted letters buried at Vesuvius, posted by James Mosley on his blog.<br>
      .<br>
      </p><div class="imageWrap"><img src="/files/Mosley Painted Letters_3796.gif"></div><br>
      .<br>
      Now notice how the pen rules are systematically changed, and the contrast pattern changed. The weight of the right diagonal of the A is the same as the bottom of the stem of the T. Pen rules would make it thicker. Note the cross bar of the A. It should be thicker than the left diagonal of the A following pen rules—it’s significantly thinner. But notice the graceful top of the T—it is thicker than all the other horizontals, violating the rules again. The diagonal of the R is, again, about the weight of the stem, not significantly thicker in its cross section, as it would be under pen rules. <p></p>
      <p>This argues strongly, as Stone has written, that Jenson and Griffo were picking up a different way of looking at letters that comes not from directly from the pen, but from a significantly different tradition going back to antiquity, and derived from painted and carved letters.</p>
