      <p>&gt;One, you have to press down the right amount to form the initial head of the “bone”. then, two you must lift the right amount. So far that’s two manipulations outside the tool’s basic envelope.</p>
      <p>Eben, it’s not at all “outside the envelope” of what is natural to the brush. I really don’t see how you can say that the first thing every Chinese child is taught in brush writing is “outside the envelope.” It is one of the I think seven or eight strokes that all Chinese characters are made of. </p>
      <p>If you look at <a class="freelinking-external" href="http://www.youtube.com/watch?v=noBlKOw4OhA&amp;feature=related">this video</a> you will see two things. </p>
      <p>First the word “happiness” written with the round brush by a skilled Chinese calligrapher looks very clumsy, as I mentioned earlier is typical, as pen rules are violated. </p>
      <p>Second, the writing of the first Chinese “Happiness” character begins with the “bone” stroke you write of, and is written like lightning, effortlessly with a flick of the brush. It is not some strain unnatural to the brush. The brush, being soft, has huge expansion and contraction natural to it. It does take a lot of practice to gain control of that expansion and contraction, but that is true whatever you want to do with a round brush. The bone stroke is not particularly more difficult than any other to gain control of. </p>
      <p>The running ’grass script’ or cursive, also done with a brush I don’t see also violating the nature of the brush. None of it that I have seen done with the brush looks like the results of a pen or a chisel.</p>
