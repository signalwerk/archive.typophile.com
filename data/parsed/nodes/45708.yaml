      <p>&gt;chinese glyphs require nothing so much as being built up</p>
      <p>This is not correct, if by ’built up’ you use the term the way Noordzij and others do. Each stroke is done as a continuous movement of the brush. It is not built up of many strokes to fill in an outline, mental or drawn. Of course there are many strokes usually in a single character, but they are clearly separate. In fact, the Chinese dictionary is partly arranged by number of strokes, showing how clear and fixed this is—both the number and order, by the way. </p>
      <p>&gt;surely you are not denying that an expert letter maker can and will often go past the simple ’logical envelope’ of his tool...</p>
      <p>Yes, I am denying that if you are talking about scribes. They have a priority on producing a lot of text, and cannot take time to do something that is unnatural to the tool and highly time consuming. </p>
      <p>If you are talking about an illuminated cap, then yes, they had time to build up an elaborate picture that may involve build up and a lot of manipulation. They may well have done that with pen, though I don’t know. My impression is that brush work was also used.</p>
