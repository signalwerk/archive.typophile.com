      <p>Perhaps what I’m getting to is that remarks about what occupies the dominating position must be taken with a grain of salt. </p>
      <p>The story might be a good deal more complex. Noordzij’s scheme raises the possibility that retroactive admiration for the Roman inscriptional capital <em>as well as, or simultaneous with</em> a lateral (in time) application of aspects of a well-understood textura construction of exit strokes (at least) to the recently revived carolinian minuscule are both at work in the Florentine and Paduan writing after Bracciolini: the one offering a new solution to the writing of the carolinian minuscule and the other pressing for further exploration in the writing of the majuscule. I’m curious to know what the “more complex” (Sumner Stone) stroke patterns used in the Florentine and Paduan manuscripts (especially for the caps) were. New initiatives and existing admirations work in tandem.</p>
      <p>In a recent lengthy essay by Kay Amert evaluating Stanley Morison’s “Aldine hypothesis” about influences on French roman types of the early sixteenth century (“Stanley Morison’s Aldine Hypothesis Revisited,” <em>Design Issues</em>: Volume 24, Number 2, Spring 2008), Kay Amert states: “The connoisseurship that led Stanley Morison to grasp the importance of the Aldine roman for later punchcutters is misplaced when imputed in a literal sense to the punchcutters themselves. Rather than suggesting the close copying that is the method of modern revivals, the approach to the romans produced by these punchcutters suggests, instead, the application of a <em>synthesizing intelligence, the exercise of a keen critical sensibility cultivated in the practice of the craft, and a desire for originality in its pursuit.</em>” [my emphasis]</p>
      <p>I think “synthesizing intelligence” is apt, both in relation to the Florentine and Paduan writing and the Jenson type. Noordzij’s importance is to not let real developments in writing drop out of the equation in the hunger to insist on the autonomy of type in relation to writing.</p>
