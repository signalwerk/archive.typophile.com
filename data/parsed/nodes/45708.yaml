      <p>Bill: <em>The issue of how much Stone’s essay is right or wrong relates more to what scribes were actually doing in the 15th century, and how different and in what way were Jenson and Griffo.</em></p>
      <p>According to your summary (still no sign of the newsletter in my mailbox), one of Sumner’s statements is that the classical form of serif could only awkwardly be made with the pen (which, by the way, may as often have been a reed as a quill; there is a famous portrait of <a href="http://www.abcgallery.com/H/holbein/holbein11.html">Erasmus by Holbein</a>, in which he is depicted holding a reed pen). If this is accurate reporting, then this is at issue, even if you don’t think it is the core of the matter. If this is at issue, then so is the notion that there is something ’critically dependent on the sculpting of metal’ in Jenson and Griffo’s innovations.</p>
      <p>I’m interested in the choices people made, and I’m interested in them because I think they were choices, not things that were materially dependent. In the case of serifs, I think we’re looking basically the same thing, regardless of whether were looking at manuscript or type: inclusion in the formal text style of these classical stroke terminations <em>which are not a feature of any preceding post-classical writing style.</em> In other words, they are as fresh and innovative in the humanist bookhand as they are in the humanist types. But the scribes want to be able to write quickly, and they make the serifs semi-bracketed and as a single movement perpendicular to the stroke, creating an asymmetrical form. The punch cutters have time on their side, since they making a single form to be reproduced many times, so can more closely follow the classical model. But the impetus is the same in both cases: to incorporate a feature of classical Roman lettering into their text style.</p>
      <p>I think we’re probably making a mistake if we try to make sense of this period in terms of type either copying writing or, alternatively, breaking away from writing. We’re talking about a relatively short period during which developments in writing and typography were happening almost simultaneously, and both were happening in a very specific literary context, in which makers of books — whether manuscript or print — were looking for appropriate forms for classical works and new texts inspired by encounter with those works.</p>
