      <p>Peter, in your post you don’t mention the subtle changes in weights and connections, as well as increased formality (verticality) that Stone mentions (quoted above). To me these are even more telling of a “mental shift”, which you say you can agree with Stone on. Using Imperial style serifs is only one of the features. </p>
      <p>The historical point here, which I think some taking issue with Stone reject, is that the Imperial caps, done with brush and chisel, already showed a different approach than the pen written forms. These media, used with many fewer and also bigger letters had the freedom that the scribe didn’t have. And they altered the pen-natural weights, size and shape of serifs and connections to suit their aesthetic sensibilities. And that freedom was reborn in the punch cutting medium. That’s the new historical insight I found in Stone’s analysis. </p>
      <p>Nick didn’t use the word “matrix”; are you speaking of his point that the “modularity” of type had a crucial affect on the designer?  This was, as I mentioned, similar to a point you made in the earlier thread. I do think it is a second critical factor in the new approach to letters of Jenson and Griffo.</p>
