      <p>I have seen so much disinformation in the past several decades. I was talking to a lettering buddy the other day and we got to giggling about how there has been much made of an album logo he did decades ago. Demonic it is said. He actually used some Bible pages as the inspiration! He said he finally went online to correct it but people would rather create false information than believe the truth.</p>
      <p>20/20 hindsight and critics. All BS.</p>
      <p>As to the H. Could it be as simple as the H needed an entry serif on the left hence the lighter weight of the down stroke to compensate for that very serif. The right side was a more speeded up stroke and visually did not need a top serif so it was a simple “draw down” and manipulated to create weight at the base! Simple as that. Second nature to a calligrapher. No research needed. No need to spend millions of taxpayers money to figure it WORKED OUT JUST BEAUTIFUL. Just like using odd numbers in the garden.</p>
      <p>I have said 100000000000 times that the first stroke you lay down defines all the rest. Whether it is manuscript, logo or type design this is true.</p>
      <p>To say that modulation has not had a place in letters since its genesis is just wrong! All you have to do is look at the development of the Aleph (Phonecian) to our current A, scratch to pen. Modulation all the way, and pen manipulation to boot, depending on the style.</p>
      <p>Michael</p>
