      <p>In his “Het primaat van de pen” (The primacy of the pen) Gerrit Noordzij formulates in a single sentence what he tries to maintain in Letterletter #11 (pages 96 to 105 of the Letterletter book) as follows: “Jenson’s roman follows the construction of the late-gothic textura.” [my translation] The section on page 104 and 105, along with the four-part illustration on page 103 — that in the original Letterletter edition went with it — makes a compelling case for this point of view. </p>
      <p>The argument is mainly about the serifs.</p>
      <p>Manuscript evidence Stone interperts as showing efforts to put Imperial capital-style serifs on the humanistic lower case, Noordzj interprets as showing assimilation of the construction principles of a late-gothic textura into the humanistic lower-case domain.</p>
      <p>Jenson’s roman paraphrases. But what what his roman paraphrases represents is the issue.</p>
      <p>This could make Jenson’s innovation seem progressive, not grudging, and remove the plebian stigma Stone places on the presumably now subdominant lower case. Progressive, because for centuries innovations leading to the late-gothic textura had made the medieval script-letter the training-ground for the consolidation of the word.</p>
