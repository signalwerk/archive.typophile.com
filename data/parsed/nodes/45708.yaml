      <p><strong>Michael</strong>, when you write about my “telling you what you can do” you are completely misreading me. I am not talking about you as a contemporary calligrapher, but about historically what was actually done by scribes, not calligraphers—a category that I believe didn’t exist. </p>
      <p><a class="freelinking-external" href="http://en.wikipedia.org/wiki/Image:RomanVirgilFolio014rVergilPortrait.jpg">Here are actual Rustic Capitals</a>. To me they look like they were written with a broad pen, not particularly flexible, and with no rotation of the pen tip. Can you point me to where you think the pen must have been rotated? </p>
      <p>Were your “Countryside” letters made with a rapid zig-zag filling in the form of the letters? If so, that is exactly the kind of thing that Noordzij calls “building up” letters, and not writing. You keep not answering my question of whether the distinction between built up lettering and writing is a valid one. And you never give me any references to any historical facts that contradict what I have been reporting on my reading. After you answer, I think we can communicate better. </p>
      <p><strong>John</strong>, I was focusing on the difference of Sumner Stone’s view from Noordzij’s. Stone still  gives a big role to the influence of the written forms. But he does go beyond the serifs as part of the departure from writing. As I quoted earlier, he writes,  </p>
      <p>“the details, like the serifs and the subtle changes in weights and connections of strokes clearly distinguish these stately letters from pen-written manuscript forms.”</p>
      <p>In writing of the changes in weights and connections, I believe he is referring to the same factors that I argued in the earlier thread, which help even color and readability, as well as pleasing form.</p>
      <p>I thought you conceded that such manipulation was going on with Jenson and Griffo, and this did represent a change. Peter Enneson did write that perhaps Noordzij did err in not sufficiently such “feature manipulation.” </p>
      <p>As to my excitement, that is just <em>joi de vivre</em>. Many of you English seem to think that enjoying yourself is <em>infra dig</em> as English schoolboy slang has it, but I am unrepentant. </p>
      <p>The question here is not whether the written forms were influential, which everyone agrees, but whether Jenson and Griffo made a fundamental change and advance. That Stone   does seem to think so in the above quotation, and that the change was away from the written forms. Do you disagree?  </p>
