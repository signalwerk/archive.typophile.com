      <p>I suspect the reality is far more mushy. </p>
      <p>I have seen a reasonable amount of  of pen based lowercase that looks quite a lot like Jenson and Griffo’s work. </p>
      <p>This isn’t the only one or even the best example but it’s a start:</p>
      <p><a href="http://www.flickr.com/photos/ebensorkin/1553408656/in/set-72157601975232363/" title="http://www.flickr.com/photos/ebensorkin/1553408656/in/set-72157601975232363/">http://www.flickr.com/photos/ebensorkin/1553408656/in/set-72157601975232...</a><br>
      <a href="http://www.flickr.com/photos/ebensorkin/1550029204/in/set-72157601975232363/" title="http://www.flickr.com/photos/ebensorkin/1550029204/in/set-72157601975232363/">http://www.flickr.com/photos/ebensorkin/1550029204/in/set-72157601975232...</a></p>
      <p>The part of this post that seems somehow fishy to me is the idea that the Roman Capitals were really a problem for the pen. They were not made the same way by the pen exactly. And punchcut they are also not quite the same either. But I don’t get a sense of a problem in either case. The Roman caps of Jenson and Griffo maybe have been harmonized by sharing a technique of production as much or more than as a result of an intellectual or deliberate effort to harmonize somehow these forms that were especially hard to marry. So this heavy emphasis on models in all cases seems like a red herring to me - at least so far.</p>
      <p>Moreover the ideas of Edward Catich are ceratinly to accepted by everyone. In fact, James’ comment about the the ideas in ’the stroke’ “a logical path carefully crafted only after its destination was determined” seem to apply at least well in case of Catich. The opposite view being that in fact it is perfectly possible to arrive at the shapes of Roman letters simply by the application of a chisel. That you can after the fact create a representation with a brush proves little. In short, it’s a chicken or egg problem.</p>
      <p>My take is that the break with the scribal was a slow process of letting go not sudden “fundamental break ” that shows up in the twinkling of an eye. Unless one man’s lifetime is seen as sudden. </p>
      <p>The fundamental problem with these kinds of statements too is that the 15th &amp; 16th century is have perhaps the very most diverse kinds of scribal hands in use of any period. This sheer diversity makes any simple or easy to understand narrative sound suspect from the outset.</p>
      <p>I may have the wrong end of the stick on this. But that’s how it looks to me just now.</p>
