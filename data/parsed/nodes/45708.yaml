      <p>John, you raise some interesting questions in your comment. </p>
      <p>First, what Stone actually says about the attempts at Imperial majuscules later in the century is: “if they are viewed as attempts at a faithful rendering of the inscribed Imperial forms we must judge them to be noble attempts, but in the end rather crude approximations [illustration]. ...The use of the file and graver combined with a considerably slower pace ...allowed the punch cutter to craft forms which imitated the original inscriptional letters more accurately...”</p>
      <p>He doesn’t go into what was a limitation of the pen, of necessary speed of the scribe, etc. </p>
      <p>But what I do think is worth mentioning here, and I suspect from what he writes that he would agree, is that the tradition in letters was not only a matter of pen writing by scribes. There was also a tradition of painted and stone incised letters. This I think is a point made by James Mosley with regard to the evolution of the sans serif:  the sans came first with sign painters. </p>
      <p>That’s one reason to think that Noordzij’s schematic history of the control of type forms by ’the stroke’ of the pen leaves out something important. Here what we see is the imitation of forms that likely evolved out of a display type with different different practical and aesthetic demands than the text letters of scribes. </p>
      <p>As to what extent they thought they were breaking away from writing, I would guess that three things were going on. </p>
      <p>One is that they wanted to capture the aesthetic of the Imperial Caps, with their great dignity and elegance. And they knew that they were not from any scribal hand that they knew about, though contemporary scribes were then trying to imitate them. </p>
      <p>The other thing that was going on is that they felt, perhaps from the Roman incised models, that a different and superior look could be achieve by altering weights and connections from the normal pen forms. Whether they where thinking at first in terms of aesthetics only, or readability as well, I don’t know. But I do think they clearly knew they were not imitating writing, as I’m sure they could all write those formal hands, and knew their pen formed shapes intimately. </p>
      <p>Finally, as Peter Enneson argued in the other thread, once they started doing type, with its uniform repetition of shapes, issues of what modifications enhance readability, especially at small sizes, would have been thrust upon them, as we know from designing type ourselves. As Peter pointed out, if I remember rightly, the natural variability of hand writing doesn’t push forward issues of evenness of color in the same way as 26 endlessly repeated letter forms.</p>
