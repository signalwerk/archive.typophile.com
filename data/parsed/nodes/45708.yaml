      <p>William, I wish you would rely more on your own observations of the visual evidence, and less on the great words of others. </p>
      <p>To me this seems obvious: There isn’t (and wasn’t) a hard, binary distinction between brush, chisel-pen and other kinds of letters. As John points out, scribes, stonecarvers, and punchcutters all had choices about how to shape their letters. Various scribal styles emphasized certain features; Uncials were highly rounded with a flat pen angle (yet not a constant, fixed angle), Capitalis Quadrata was much like the inscriptional roman, but pen-written. Maybe not in very lengthy texts, but then again, very much developed as a repeatable, scribal hand. The serifs which appear in the now-eroded inscriptions as “sculptural” may indeed have been outgrowths of a highly developed scribal tradition. Where did those brush-written caps come from? They didn’t appear magically without precedent. These inscriptions aren’t divorced from this scribal tradition if the tool making the strokes happens to be a brush. The brush can have a chisel point. We also don’t know for sure that it was a brush. The smoking brushes have not been found. Maybe it was a big wide wooden chisel dip pen. Those Trajan caps exhibit a cornucopia of pen tricks. </p>
      <p>The rustic capitals do indeed involve pen rotation; nearly any style of calligraphy/script/lettering will require pen modulation and/or rotation. Get clearer examples so these details can be discerned. Look at uncials, quadrata, rustic caps, textura, fraktur, etc. Even better would be to try to imitate great historic examples of them. Not easy getting those shapes just holding the pen at one angle is it? Certain styles demand it, others not at all. But it’s the chosen style that dictates, not the tool. </p>
      <p>Note that all these can be written (yes, like handwriting) using either a soft goose quill, a metal calligraphy nib, a fountain pen, and any number of other tools; since it isn’t the tool driving the style, stroke angle, pen rotation or stroke widths (see John’s discussion of Nastaliq, and even more, <strong>look</strong> at some Nastaliq writing), it must have been the writer’s choice that determined those shapes and the appearance of the writing. </p>
      <p>The tools don’t enforce any kind of stylistic choices, certainly not pens of various materials or brushes. it’s the tools and materials of typefounding that we can regard as comparatively restrictive, and yet still a great spectrum of choices was available to early typefounders. From Gutenberg to Griffo we see this. They could choose to mimic scribal forms, which some of them clearly did, and they could choose to idealize or abstract scribal forms, which some also did.</p>
