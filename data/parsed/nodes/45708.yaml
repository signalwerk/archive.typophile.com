      <p>&gt;This ability to push past the tool’s tendency blurs things considerably.</p>
      <p>Eben, I think you are missing the point here. The point is that craftsmen are influenced by their instruments. With enough practice you can scratch your right ear with your left foot, but chances you’re going to your right hand. The question is not what people could conceivably do, but what they actually did. </p>
      <p>The shape of the Chinese characters was influenced by the fact that they were written with a brush. When they were scraped on bones they looked quite different—the “seal style”. And when they were carved in wood they looked somewhat different again. </p>
      <p>Are you telling me that these obvious and systematic differences are just accidentally related to the writing medium?</p>
      <p>Similarly, the shape of Roman letters has been influenced by the tool they were written with for thousands of years, the broad pen. Are you denying this?</p>
      <p>If not, then the question is whether people using brushes and chisels to do inscriptional letters influenced the shape of the Imperial capitals. </p>
      <p>It seems to me a pretty reasonable question, and Stone’s answer is ’yes’. </p>
      <p>Why do you think that his answer is wrong? What is your story of why the carved capitals show a different pattern from any surviving ancient written capitals—but rather more similarity with the painted caps that survived Vesuvius, as shown in James Mosley’s blog—thanks Craig for the “heads up” on this interesting post.</p>
