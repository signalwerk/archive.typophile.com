      <p>Kent, thanks for your post. </p>
      <p>I tried, though, to characterize Noordzij’s views accurately, not to endorse them without qualification. </p>
      <p>In fact in my initial post here I said that Stone’s argument meant that Noordzij’s theories need qualification. I think Noordzij is open-minded in an unusual and to my mind good way. He is willing to make sweeping statements he thinks are right. But he invites discussion and contradiction, and welcomes it, thinking correction and progress will come that way. I invited Michael to explain where he disagrees with Noordzij—and with Stone—but he only responded with irrelevant personal attacks on my supposed state of abysmal ignorance.   </p>
      <p>I also qualified my statement about the broad pen by saying it was ’relatively’ stiff. As I understand it, the feather quill pen cut to a relatively snub tip was much less flexible than the later pointed version, which was then replaced by highly flexible steel pens for the ’copperplate’ style. </p>
      <p>I was reporting on Stone’s views, which I quoted above. He I see was trained in calligraphy, as well as being the fine type designer we know. He says unequivocally that “This conscious departure [of Jenson and Griffo] from scribal models was a defining moment in the history of roman type design.” His view is that the characters, including serifs, of Jenson and Griffo depart from models of scribal pen strokes with the broad pen.  </p>
      <p>As I said, I have felt the same way for some time, though with no deep study of the issue. That’s why I was delighted to read Stone’s strong case for the ’revolutionary’ view. Now Stone and I may be wrong. But in Stone’s case if he is mistaken it is not for lack of knowledge of calligraphy, or, it seems, of history.</p>
      <p>edit: I cross posted with you, John. I’ll respond to your interesting post later.</p>
