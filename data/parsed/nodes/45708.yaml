      <p>Compared with what came before, typography was a very indirect way of making words.<br>
      So a design space was opened up between punchcutter and printer, in which was considered how delicate shapes made in metal matrices morphed into smudges of ink on paper.<br>
      In this design space it became apparent that the shapes of the smudges were to a large extent independent of the qualities of the tools previously used to make writing or lettering, and dependent more on the way that punchcut forms morphed during the founding process, and subsequently the way that the ink shapes that were created on the surface of type further morphed when pressed into paper.<br>
      So what happened AFTER the punchcutter “sculpted” the letters in metal was the primary consideration.<br>
      What punchcut shapes would eventually produce the most legible, most readable pages?<br>
      The punchcutter/engraver could imitate the characteristic letter forms of pen and brush (as John notes, fast writing) , chisel, and even the punchcut lettering of goldsmiths.<br>
      And he could also make new forms specifically geared to optimize printed text.<br>
      So type making emerged as a synthetic skill, dependent on the punchcutter’s execution certainly, but also with a strong element of design, creating a tool for another, the printer, to use.  </p>
      <p>In a way, the process may be likened to the (hypothetical) job segregation of lapidary lettering, with one person lettering by brush, for another to carve. </p>
      <p>The scultping of metal isn’t particularly relevant, any more than the sculpting that occurs when the scribe trims his quill. Both are making the tool that makes the letters.</p>
