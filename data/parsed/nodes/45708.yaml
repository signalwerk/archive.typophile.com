      <p>Bill, I thnk the sequence Noordzij’s scheme suggests is first, the ‘phase-one’ adaption of the Imperial capitals to the  Carolinian minuscules in manuscript writing that Stone associates with Poggio Bracciolini. The majuscules here “relied on thea stroke pattern derived from the pen-written minuscule.” Then there is an assimilation of a “late-gothic” textura construction into the humanistic lower-case domain. The key here is the figure 9 on Letterletter page 101. The serif here is not fully symmetrical per force of the tool, much like the terminals in figure 3 from page 103 and the serifs in Jenson’s type.</p>
      <p>I don’t know the date of the textura Noordzij shows in figure 2 of page 103, or figure 3 of the same page. I assume figure 3 is from the same pool of evidence Stone uses for his claim s about the the minuscules in the second phase of Imperial capitals to the  Carolinian minuscules, where Stone says something closer to the Imperial caps takes the lead. I doubt Noordzij is playing with chronology here. Perhaps I’ll try to find out.</p>
      <p>More likely the change to a retracting serif in the Carolinian-derived minuscule, based on an assimilation of construction principle drawn from textura, set up a dynamic in the development of the lower case which could then branch out, once the transition to type was made, into a more literal assimilation of the formal features of the Imperial Roman (than in Bracciolini’s case) and a subsequent feedback of those assimilations into a more formalized lower case such as occurs perhaps in Griffo.</p>
      <p>Stone says that the construction of the Imperial Capital became more complex. It could well be that the innovation of using a textura-based construction to write the minuscule, carried over to the writing of Imperial Capital, led to the discovery that one could also come to a closer approximation of the formal features of the inscriptional Imperial Capital.</p>
