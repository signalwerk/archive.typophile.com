      <p><cite> Of course there are many strokes usually in characters, but they are clearly separate. </cite></p>
      <p>Yes, clearly. But that is once again, not to the point. The point is to look at an individual stroke. If you do, you will see that even the simplest most basic stroke in chinese the horizontal one for “1” requires several culture specific, envelope pushing moves to complete it. </p>
      <p>One, you have to press down the right amount to form the initial head of the “bone”. then, two you must lift the right amount. So far that’s two manipulations outside the tool’s basic envelope. Then you change direction twice ( not outside the envelope ) but you must also change pressure which is a manipulation or outside the envelope. Three. Then you join the reverse carefully so as to hide what has happened. Hiding the stroke is the most obvious and hallmark quality of being “outside the envelope”. That’s 4 culture specific, envelope pushing moves. </p>
      <p>If you want to use architectural analogies then I think the urge to hide how something is made with trim to cover nails or bolts etc. vs. letting the bolts be seen is the better comparison. But even that fails to take up the equally salient manipulations that are not hidden per se but which are nonetheless clearly manipulations and not part of the simple tool logic.</p>
      <p><cite> to do something that is unnatural to the tool and highly time consuming </cite></p>
      <p>Not if it becomes habit. Cultural habits are very powerful. In fact, look at Chinese &amp; Japanese running hand. When it’s good, it is really incredible. A tour de force really. But of what? Tool logic? Not at all! It’s a tour de force of manipulation. And the whole point is what? Speed and expression. The same can be true of arabic, armenian, latin, or any other system. If it exists in writing depends not on the tool but on the scribe.</p>
      <p>Don’t get me wrong. There were plenty of so-so scribes too. I have seen their work. In it you can see plenty of tool logic. But it’s not all that there was all the time, even in longer texts.</p>
      <p><cite>Yes, I am denying that if you are talking about scribes.</cite> It is true that you can do something just passable in latin writing without manipulation. Whereas in Chinese you have no hope whatsoever. That is a real difference. But I don’t think you will find a single scribal page that has no manipulations in it even if they are angle lapses or unintentional. People are not machines. So manipulation can’t be gotten rid of. Reality is not so pure as your idea. Influence is not destiny. This is a thing is grey.</p>
