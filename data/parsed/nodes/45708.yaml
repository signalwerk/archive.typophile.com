      <p>Nick, you’re writing about the running text in black, not the illuminated caps, right?</p>
      <p>How does the running text violate ’pen rules’? It looks to me similar to the illustrations by Noordzij of pen-made serifs on black letter, made without rotating the pen (in both the Stroke and Letterletter). The thick-thin patterns seem consistently following pen rules—thin lower left to upper right strokes, medium horizontals, heaviest, top left to bottom right diagonals, etc. Perhaps you could circle or highlight where you think rotation occurs. Some of the hair lines curve, but I am assuming that is drawing the pen barely touching the paper, right? </p>
      <p>In the Vesuvius letters, advantage is taken of the brush not only to rotate a lot between strokes, but swell the stems, do sharp serifs (as pointed out by Stone), and the whole thing is upright, not slanted. Strokes, eg of the swelled stems, may be built up as well—I don’t know. I’d like to hear a sign painter like John Downer talk about how the Vesuvius painted letters were done.</p>
