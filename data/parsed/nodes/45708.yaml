      <p>Michael, I don’t think we’re on the same page here, because Stone and Noordzij are referring to the *writing* a scribe would do then, quickly and with the fixed width (not expansible) pen held at more or less a constant angle. They are not talking about built-up letters, as Eliason notes. </p>
      <p>Because of the multi-colors it looks like your lovely “seasonings” is also built up, no? I am not a calligrapher, as you are, but I dare say that it is not possible to *write* in single strokes the ’seasonings’ letters even in one color with a fixed width pen held at a constant angle. </p>
      <p>Yes, they did have a ’chisel’ or broad tip pen, going back in antiquity, but it was not particularly flexible until the 18th century, if I’ve got the history right. </p>
      <p>edit: I cross posted. I see that you made many strokes. Stone may be wrong, but I think you’re not getting the distinction between “writing” and built up letters, which is key for both Stone and Noordzij.</p>
