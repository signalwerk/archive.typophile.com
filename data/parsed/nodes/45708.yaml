      <p>Bill, you’re example doesn’t support the Stone thesis.<br>
      Consider blackletter, and in particular the <em>textus precissus</em> style (with horizontal stem terminals on the lower case).<br>
      Ratdolt’s specimen shows this (in fact, most of his fonts were blackletter or rotunda, not humanist: most incunabula printing was blackletter).<br>
      To repeat, the more formal and slower the writing, the more scribes were inclined to invest time in pen rotation.</p>
