      <p></p><div class="imageWrap"><img src="/files/pen_5931.jpg"></div><br>
      Here’s what I mean by Jenson being “anti-chirographic”.<br>
      Consider the nib angle at the top left joint (the start of the main curve) in these three letters.<br>
      In the p it’s almost horizontal, in the n has more of a slant, and in the h is almost 45°.<br>
      This creates an unevenness, with three curves that have different entry angles and tightness (i.e. length of radius).<br>
      It differentiates the underlying shapes of these three letters, rather than repeating any consistency that would be caused by straightforward writing, or a reductive design approach that would emphasize geometrical similarities in the shape of the curve.<br>
      So why does such a disruptive effect work in type?<br>
      Because of the subtle adjustments with which the variety of serif shapes and stroke weights counteract the variety of curve shapes and angles of stress, within the context of even colour. For instance, note how the counter of the h is wider than the counter of the n, to accomodate the extra weight of the upward diagonal which intrudes into the internal area.<p></p>
