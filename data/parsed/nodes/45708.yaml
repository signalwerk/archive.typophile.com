      <p>John, Unger’s quote does highlight the fact that so much about text was already in place because of long scribal tradition. As I have already agreed with you, much in type is derived from past writing. The question is what was new in the creation of roman type, and how new it was. </p>
      <p>I am not clear what Unger means by ’ergonomic’ in this context. Is this about ease of writing or ease of reading? At one of the TDC events a calligrapher pointed out to me that it is easier to write with slanted stems, but easier to read with vertical ones. —And that was one of the changes to the lower case by Jenson and Griffo. </p>
      <p>Nick, thanks for the insights on the changes of Jenson. Peter Enneson brought up in the other thread about how repetition of characters changed the challenge to type designers. I really like your term ’modularity’, which captures the essence of the challenge. It includes both the repetition of identical characters, and that each must fit with every other character.  </p>
      <p>You are no doubt right that the letter fitting demanded by modularity influenced letter forms. But I think that also evenness of color was, as Peter argued, pushed forward as a problem by modularity. Also readability at small size was another factor, as I argued in the earlier thread—and John agreed with me on that one.</p>
