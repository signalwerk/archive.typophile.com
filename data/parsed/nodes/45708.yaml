      <p>&gt;to insist on the autonomy of type in relation to writing.</p>
      <p>I certainly haven’t said and don’t think that type is autonomous of earlier writing. I don’t think that Stone says that anywhere, either. What he says is that punch cutting added a *new* element, different from writing, to the design process, and that I find convincing. </p>
      <p>I would agree that Stone goes too far when he writes “Letterforms could no longer be viewed, even mentally, as a series of strokes with an edged tool.” I think that an “underlying force” of writing, to use van Krimpen’s phrase, remains there. Even though Stone’s statement is strictly speaking probably right—for real pens—I follow Noordzij in thinking that it is a very useful exercise to visualize what an edged tool would do, and then consider how what you want to do departs from it.</p>
      <p>But if Stone goes a little farther than I am comfortable with, in my view Noordzij sometimes goes flying over the right balance in the other direction. I can’t find the quotes at the moment, but if I run across them I’ll add them to the thread.</p>
