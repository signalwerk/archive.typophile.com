      <p><em>Jenson and Griffo made a fundamental change</em></p>
      <p>Sweynheym and Pannartz made the first type based on humanist writing—Roman capitals plus Carolignian miniscules, after the Italian humanist style of writing. </p>
      <p>One important innovation of Jenson’s lower case was the straight right side of the “h”. His contemporaries followed the scribal practice (both blackletter and humanist) of a curved right side.</p>
