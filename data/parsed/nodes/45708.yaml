      <p>Eben, just so you have what Stone actually says about the Roman inscriptions, here it is:</p>
      <p>“The tool for laying out inscriptions was a flexible flat brush, and the letters in inscriptions were both fewer and larger than those in manuscripts. Although the overall impression of the Imperial forms is that they were made with an edged tool, the details, like the serifs and the subtle changes in weights and connections of strokes clearly distinguish these stately letters from pen-written manuscript forms. The ancient letters were then carved into stone, a step which allowed for additional refinement”</p>
      <p>Stone’s point I don’t think relies solely on Catich being right. It is rather the distinguishing features of the actual carved vs manuscript letters—and then those cut in metal. Stone’s article is copiously and aptly illustrated, and to me the illustrations make his case pretty convincing.</p>
