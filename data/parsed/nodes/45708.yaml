      <p>Carl, it is true that wood and stone are building materials rather than tools, so the analogy is inexact, though I think the point is right. </p>
      <p>The pointed brush, which I also mentioned, is, however right on point, and I think you are mistaken about the capabilities and limitations of the stiff broad pen vs the limitations of the pointed brush. I have had both in my hands, and they are extremely different animals. </p>
      <p>The pointed brush is great at doing extreme expansion and contraction of the stroke, but is unaffected as to direction, as it is round. The stiff broad pen held at constant angle varies width with the direction of the stroke, but is quite limited in expansion and contraction. I think even a very good calligrapher who was skilled in both instruments would be very hard put to reproduce the stroke of the other instrument. The pointed brush might do it with extreme skill and knowledge of roman lettering, but some build up would be necessary, I think. To get Chinese brush strokes with a pen would be nearly impossible, I think. I mean without doing build-up, of course. The ’ductus’ of these two writing instruments is just extremely different. </p>
      <p>Trying to do roman calligraphy with a Chinese pointed brush or Chinese brush style letters with broad pen would be basically an exercise in frustration. (There are other styles of Chinese characters influenced by other tools, but that is a different matter.)</p>
      <p>A broad brush is, of course, much closer to the pen than is the round, pointed brush.</p>
