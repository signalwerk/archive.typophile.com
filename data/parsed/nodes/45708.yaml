      <p><em>the medium was single letters carved of metal,</em></p>
      <p>That line of thinking leads to over-simplification, in directly comparing pen with counterpunch.<br>
      The new medium was a stretched-out industrial process involving more than one person— matrix-making, casting, composing, inking, making the impression, and re-using type.<br>
      As with all mechanization, craft becomes production work, and artistry becomes design/management.<br>
      It is this distancing of the decision-maker from the mark-maker which engenders abstraction, emphasizing the role of design.<br>
      At this point, McLuhan’s laws of media become apparent, in particular #4 Retrieval: the content of any medium is an older medium.</p>
      <p>But not necessarily any one medium; and so Incunabula type design was free to synthesize elements of pen, brush, and chisel media, as well as address issues specific to the new process. Retrieval was a traditional practice of page making, ensconced in the hierarchy of styles on the introductory page of manuscripts, starting with oldest (Roman capitals), below that Uncials, and then the most recent, Carolignian body text.</p>
