      <p>I’m sorry to be a johnny-come-lately to this thread.</p>
      <p>Here is how I see the development I’m presuming Sumner seeks to narrate.</p>
      <p>As a protoypical entity the serif is an arifact of the entrance and exit strokes of formal writing. Type designers from Jenson and Griffo on use it’s inscriptional manifestations in the Roman Inscriptional Capital as exemplars for their typographical fillings of the serif role.</p>
      <p>The question: is what does this development signify?</p>
      <p>Is it fair to say it is a break with scribal tradition, or is it rather a break with the more literal paraphrase of scribal exemplars characterizing the work of their illustrious type design predecessors? Substituting instead an inscriptional paraphrase of an even earlier scribal tradition, mediated perhaps by the broad stiff brush, but formalized in sculptural terms beyond it. Even scribal tradition can be said to paraphrase when it sets out to adapt the form of the Roman inscriptional majuscule to the carolinian miniscule.</p>
      <p>If his title is any indication, Sumner’s suggestion seems to be that the break away from literal paraphrase signifies a mental shift. This I can accept.</p>
      <p>I think Nick’s comment about matrix making opening up a space is essential, and John’s explorations of the force of the terms <em>fundamental</em> and <em>critically dependant</em> are very apt.</p>
      <p>Noordzij’s point is not a point about literal paraphrase but shape paradigms for contrast styling and construction. The contrast schemes and construction schemes imposed by writing with the broad-nibbed and later the straight pen remain fundamental in a paradigm-setting sense. In this sense a critical dependance on writing persists. [adding just after the fact] That a scultptural sensibility and a more acute awareness of the active significance and formal logic of negative space becomes apparent doesn’t undermine this critical dependance.</p>
