      <p>Bill — I believe when Michael rails against some of your points, it is not Noordzij that he is dismissing (not always) but rather your very literal reading of some of Noordzij. I believe we all know that it helps sometimes to read GN with a grain of salt, because he has rhetorical devices of his own.</p>
      <p>Specifically in this instance, I believe there is an inherent disconnect in yours and Michael’s discussion. When GN references the fixed-width pen, it is easy for many of us today to conjure an image of the stiff metal Speedball nib of our intro art classes. We therefore think of the fixed-width pen as “fixed” — i.e., inflexible.</p>
      <p>When Michael uses the term “quill,” instead, I believe he is doing it deliberately, because the fixed-nib pen of the era in question was in fact a prepared feather, a quill. As such, it is actually surprisingly flexible. Not nearly as flexible, and not in the same ways, as the later flexible, split-nib pen of the English writing masters. But more flexible than one might initially imagine.</p>
      <p>So, it is not accurate (historically or otherwise) to assume that a fixed-nib pen has no flexion, no pressure-and-release, and that any waisting or other effects must necessarily be built-up and not written.</p>
      <p>I’m not reading back carefully over your statements to double-check that I am interpreting you correctly. If I haven’t been reading closely enough, forgive me. </p>
      <p>But I hope this one observation might help bridge at least some of the gap.</p>
      <p>— Kent.</p>
