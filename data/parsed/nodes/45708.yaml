      <p>The most significant way in which design came to the fore in typography was in meeting the demands of a modular system of shapes, in which each letter form was required to fit nicely with every other, without the luxury available to scribes of contextual adjustment. This is particularly evident in Jenson’s serif shapes, for instance the way the ear of his r fits against the following n, a, and v. </p>
      <p>That modularity was a defining issue is even more apparent in the work of other Venetians, such as Lauer, who practically did away with serifs on the outside of letters, to better allow them to combine, in the phrase of Fred Smeijers, “like children’s blocks”. </p>
      <p>Many of Jenson’s letters, while ostensibly having the smack of chirography, are in fact almost impossible to duplicate with a pen—abrupt stroke weight transitions that defy adjustments of rotation and pressure. The main curve of his p is particularly mysterious in this respect, of chirographic origin in its angled stress, but at the same time anti-chirographic. (This may be seen in comparing Bruce Rogers’ working drawings of Centaur, which play up the scribal quality of the type, against the original.)</p>
