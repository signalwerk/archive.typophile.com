      <p>My copy of the <em>Letterspace</em> newsletter arrived today, and I have read Sumner’s article twice but want to read it a few more times before writing in response to it. I want to try to be very clear about how I agree with his analysis while still thinking that he overstates his conclusion.</p>
      <p>In the meantime, here is something else I read today, from Gerard Unger’s recent little pamphlet <em>Typografiw als voertuig van de wetenschap</em> (in Dutch and English):</p>
      <p><cite>Letters and the ways in which they work together as words and texts have taken on their shapes in the hands and minds of sculptors, writers, and typographers essentially on the basis of ergonomic concerns. Prior to the development of typography, the shapes of letters and the basics of typography were largely fixed already in manuscripts. This pertains to type areas, type sizes, interlinear spaces, and many other conventions. During the subsequent period covering over five centuries the typographic system has been further refined and enriched.</cite></p>
      <p>This encapsulates nicely the context in which I believe the development of typography should be viewed: as part of a much larger and longer engagement between text and reader, in which the innovations of typography present media-specific refinements, but not revolutionary developments or ‘progress’. In a note to this paragraph, Gerard directs us back to J.P. Gumbert’s essay ‘“Typography” in the manuscript book’, in <em>The Journal of the Printing Historical Society</em> No.22 (1993)*</p>
      <p>*This, to my mind, is a prize volume of this series, since it contains not only Gumbert’s fine essay but also Peggy Smith’s excellent work on ‘The pre-history of “Small Caps”’.</p>
      <p>More in a couple of days...</p>
