      <p>The marriage of inscriptional capitals and pen-made small letters whether in handwriting or in type is not a perfectly happy one, and many of the artists who have turned their hands to designing typefaces have tried to undo it. At first there was doubt as to which should be the dominant partner and impose its idiom on the other. However, Jenson to a large extent and Aldus completely laid down a pattern of a consortium preserving the purity of the antique capitals and making the lower-case conform with them as best it could. Such was the prestige of Aldus and the skill of his punchcutter that this arrangement of the priorities has been the rule ever since.</p>
      <p>Harry Carter, <em>A view of early typography</em> (1969), page 46.</p>
