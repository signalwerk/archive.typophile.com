      <p>&gt;the treatment of terminals are idealisations of the written terminals</p>
      <p>So you don’t agree with Stone, as I understand him. </p>
      <p>He says that the symmetric serifs did not arise from any written form. It arose rather from painted and carved forms. If you accept that the distinctive treatment of serifs and weights in inscriptional characters doesn’t come from writing, then he has a strong argument, as the ideal wasn’t a written one, either ancient or medieval. Do you think that the distinctive features of the letters eg on the Trajan Column, that we don’t see in surviving writing, as I understand it, were actually written forms?</p>
      <p>&gt;the variations of weight are variations on a pattern established by the ductus of the pen...</p>
      <p>I don’t want to quibble about what is ’fundamental’ or ’essential’, but what I do think is that Jenson and Griffo had a conscious goal of improving on their written predecessors, that they were willing to contradict the written models, and that they succeeded particularly in increasing readability. </p>
      <p>I do think that more upright forms with more even color, and at smaller size all increased readability. What you seem to be saying is that they were just trying to make letters that were just more perfect forms of written models. That I think flies in the face of the fact that they were willing to straighten eg the right stem of the n, as Nick points out, and systematically *contradict* the ’pen rules’ as far as the weight of diagonals.</p>
      <p>I am getting a deja vu experience here. When I studied history of science, I read how devoted Catholic Pierre Duhem argued strongly that modern science continuously evolved from medieval science. Alexander Koyré on the other side argued for the discontinuity of Galileo’s breakthroughs and the reality of revolution in science. I always thought that Koyré had the better of the argument. Jenson and Griffo’s innovations are no way as great as Copernicus and Galileo’s, but I still think there is a conscious and deliberate innovation going on.  </p>
      <p>&gt;To say that modulation has not had a place in letters since its genesis is just wrong!</p>
      <p>I never mentioned “modulation,” so I don’t know what you are talking about. </p>
      <p>Noordzij identifies three sources of modulation in the written stroke. First is “translation.” When  a broad pen with fixed width and angle moves through a curve, the width of the stroke changes with the curve. This was always there. Second is “rotation,” when the pen is rotated on its axis, also changing the width of the stroke; he says historically this only came in a systematic way with mannerism. Third is “expansion,” where more pressure on the pen broadens the stroke, and which he says only came in a dramatic way with the pointed, more flexible pen tip. The pointed flexible tip pen culminated in the “copperplate” style of script, and influenced ’transitional’ style type design. </p>
      <p>It seems you dismiss Noordzij as an ignoramus, as all of this went on since antiquity. I think you are flat wrong on that, but I am here to learn. If you can give some historical examples and analyze them concerning rotation and expansion, I’ll be happy to change my views.</p>
