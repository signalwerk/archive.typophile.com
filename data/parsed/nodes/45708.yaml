      <p>Michael, Bill: As a moderator I think I see some smoke forming if not actual flames, so let’s keep the tone a bit more chill please.</p>
      <p>Don’t get me wrong, I am all for <cite> joie de vivre</cite> but...</p>
      <p>As for my own view: </p>
      <p>I think that in the urge to make distinctions it is often the case that things are set out more starkly than reality offers them up to us. For instance I am recalling a presentation I saw at last year’s TypeCon where the fine art of the touch up or cheat in calligraphy was celebrated. Now at some point one of us might say, well that’s crossed the line!  That’s not “pen formed”. But really it is. Just not in the “pure” sense. My point here is that there are distinctions to make, and they are important/meaningful. But what you call them, and here you make them is significantly up to you.  </p>
      <p>As for G Noordzij he definitely wasn’t interested in setting out anything hard &amp; fast, just in offering a different lens, the lens of his practical physical observation. This is one of the reasons I like his work so much. </p>
      <p>Michael, keep in mind that while you <cite> can</cite> do nearly anything at all with a pen; I absolutely agree, the question of what was normally done by scribe in the 15th/16th century while hugely broad is not nearly <cite>so</cite> broad.  There are distinctions to be had between that profoundly varied body of work and Jenson/Aldine type.</p>
      <p>Notice, also I am using cite tags to make italics not all caps.</p>
      <p>The thing about the Jenson and Aldine letters are that they are a huge cultural touchstone. And what they did seems border on magic, partly because it was so influential, and partly because of the myth machines that have grown up around the actual work. And partly because it was a sort of visual genius. All this means that the urge to get in there and make your own interpretation is great. I should know. I am involved in that now too. But you have to be as skeptical and dispassionate as you can be. And show what you mean.</p>
      <p>Bill, maybe you can show us what you mean by more even color in an example. </p>
      <p>What they did was complicated and changed over time. And just like you need to use a pen to get it - you need to see original Jenson &amp; Aldine books to get a sense of them. </p>
      <p>And lastly, the simple distinctions of this is “pen based” and this is “typographic” and this is “carved” and so on are to my mind, growing less useful by the day. What I think would be more useful is to show the thing you mean, eg the visual distinction and avoid the urge to throw too much extra jargon over the top. Typographic and calligraphic jargon is mushy mushy stuff however much we may treasure it. And as such it has a wonderful use as grease to get conversations started - but not too much as grist with which to go deeper.</p>
