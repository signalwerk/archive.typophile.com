      <p>Peter, in the beginning I tried to report accurately on Stone’s article, and quoted some bits. </p>
      <p>In the course of the discussion I’ve added some of my own views, but tried to make clear when I was adding, or refering to Stone or Noordzij’s views. </p>
      <p>The Vesuvian letters are not in Stone’s presentation, though he refers to the Imperial letters as laid out “by a flexible flat brush” followed by carving. I thought the graphic of the painted letters posted by James Mosley made the case even more strongly than the carved letters he shows, or those on the Trajan Column, which tend to have less thick-thin contrast than these painted letters, if I’m not mistaken. </p>
      <p>As I quoted earlier Stone argues that “Although the overall impression of the Imperial forms is that they were made with an edged tool, the details, like the serifs and the subtle changes in the weights and connections of strokes clearly distinguish these stately letters from pen-written manuscript forms.”</p>
      <p>My analysis of the differences between pen rules and the painted letters is intended to elucidate Stone’s point—using an illustration he doesn’t use—about the subtle changes  in the Imperial letters that none the less show a conceptual difference from pen written letter forms. I could have taken a picture of inscribed letters, but I think the painted are even clearer.</p>
