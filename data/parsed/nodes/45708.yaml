      <p><cite> Are you denying this?  ... Are you telling me that these obvious and systematic differences are just accidentally related to the writing medium? </cite></p>
      <p>Not at all. I mean: not so much as an iota. I get that idea. I support it, believe it, and am frankly, quite deeply impressed by it. As are we all from what I have read here.</p>
      <p>But look at the chinese brush: chinese glyphs require nothing so much as being built up; albeit in a special way only possible with that brush. These is absolutely no way that you can make a formal chinese character without some expert tweaking - eg the reverses and lifts required. Again, I am in no way stating that any other tool could make chinese characters the way the chinese brush does. I am saying something different. I am saying that the brush is far from being the only factor in the shapes that are made with it. A calligraphic culture is at work there. Think too of the enormous array of styles that the chinese brush is used to make. Far larger than with any other calligraphic tool I would say.  So it isn’t a single character or direction or fate that the chinese bush offers. Not at all, instead it offers a profound flexibility - and I would say a profound need for envelope pushing. You could try coming back with talk about the running hand style but I don’t know that I can believe that it’s all brush logic there either.</p>
      <p>So back to the latin. Nobody, as I said before, is trying to deny that the tool/medium is powerful. What they are saying though is that it is not *all* powerful and utterly determanistic. And in that wiggle room there is room to question your assertion.</p>
      <p>Now it’s my turn, surely you are not denying that an expert letter maker can and will often go past the simple ’logical envelope’ of his tool...</p>
