      <p>Peter, I don’t think anyone disagrees, including me, that the Carolingian minuscule is a pen-developed script, and that it was the point of departure for Jenson and Griffo’s work.  </p>
      <p>I think when you say “critical dependence on the contrast schemes” of the Carolingian minuscule I think you are overstating the case, as I think while the influence is clearly very important, the deliberate and systematic departures are there as well. </p>
      <p>They were willing to do thinner serifs and thinner diagonals that change the contrast scheme of the pen drawn letters, and even completely reverse the contrast in the case of the z, if I remember rightly. </p>
      <p>I understand why John Hudson is unwilling to acknowledge how significant this change was, as he doesn’t accept any influence on readability beyond legibility of individual characters.  However, as you do think the focus on rhythm and color are important for readability, I would think that you would also label this treatment of letters a “conceptual change”, as Sumner Stone does.</p>
