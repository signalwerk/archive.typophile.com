    html: <p>I don’t know why, but I’m reading the ‘ee’ as ‘ec’, perhaps because they are too different. Also, the ‘c’ at the start of the word ‘check’ is quite large, and looks a little of place (it reads somehow like ‘designCheek’). The ‘d’ also connects with the following ‘e’ at a strange angle. Other than that, I like it!</p>
