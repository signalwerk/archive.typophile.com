      <p>I'm convinced that interiectio is the word which was abbreviated into the modern exclamation point:<br><a href="http://textwrap.wordpress.com/">http://textwrap.wordpress.com/</a></p>
      <p>It makes more sense than io, which means something more like "hey!" in Latin.</p>
      <p>I remain unconvinced that the interrobang has legs. It was a nice idea, but it has hobbled along for years, unrecognized and unadopted by the public.</p>
