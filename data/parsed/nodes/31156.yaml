      <p>Alessandro: <em>The slanting of the stem as practiced in Beneventan writing (southern Italian hand, cultivated in the mother house of the Benedictine order at Monte Cassino) most probably contributed to the origin of the question mark.</em></p>
      <p>This slant was, in turn, derived from Greek writing. The influence of the Byzantine tradition in southern Italian Christianity persisted long after the schism. I recently heard a recoding of Beneventan liturgical chant, and more of it was in Greek than in Latin. And of course the Beneventan letter a is indistinguishable from a Greek alpha.</p>
