      <p>Actually Malcolm Parkes' book was reprinted last September. You can get it directly from Ashgate for £67.50 (still not very cheap) <a href="http://www.ashgate.com/default.aspx?page=637&amp;calcTitle=1&amp;title_id=10972&amp;edition_id=3772" rel="nofollow">here</a>.</p>
      <p>The ? has been around in various forms ever since c. AD 800. It was also used as an exclamation mark before something different, more like ! first appeared in Italy in the late 14th c. None of these marks have anything to do with abbreviations, or the Beneventan script, to the best of my knowledge (I believe the slant mentioned above only refers to the stem of d, and there is nothing specifically Greek about that).</p>
  - id: 325308
    user_id: 1262
    user_name: John Hudson
    user_path: null
    date_raw: 27 Jan 2009 — 4:37pm
    date: 2009-01-27T16:37:00
    votes: null
    html: |-
      <p>Marc: <em>I believe the slant mentioned above only refers to the stem of d, and there is nothing specifically Greek about that</em></p>
      <p>Alessandro and I were not referring to the angled stem of the Beneventan d but to the angle at which the broad nib is held relative to the horizontal. In most western scripts, the angle is fairly close to 45 degrees, but in eastern scripts, including the Byzantine cursive Greek, it is steeper and, in some cases, may even rotate past the vertical. The Beneventan script is a kind of hybrid.</p>
      <p>I don't know whether Alessandro is accurate in saying that the distinctive arrangement of thicks and thins in some question marks is derived directly from the Beneventan script. But I am confident that many of the characteristics of the Beneventan script are derived from those of Greek scripts with which the scribes of Monte Cassino were certainly familiar.</p>
  - id: 325404
    user_id: 14427
    user_name: MHSmith
    user_path: null
    date_raw: 28 Jan 2009 — 4:33am
    date: 2009-01-28T04:33:00
    votes: null
    html: "<p>John, sorry I got you wrong (I still think Alessandro meant what he said, i.e. angled stems, an idea he got from the Wikipedia article he links to). Still, Beneventan has a normal Latin pen angle and its letterforms are based on later Roman cursive. Bits &amp; pieces of Greek occur within Latin texts in Beneventan manuscripts (F. Newton, The scriptorium and library at Monte Cassino 1058-1105, Cambridge 1999, p.198) but I can't see Greek writing having any influence on the Beneventan script itself. Anyway, to move back to punctuation, Beneventan mss were rather late (11th c.) in adopting question marks at the end of sentences: before that they used special intonation marks on single words within the question. Of course medieval punctuation on the whole is about intonation rather than syntax. And it wasn't done with the full breadth of the nib (apart from dots), rather with a light touch, hairlines from the corner of the nib and so on.</p>"
