      <p>The ? has been around in various forms ever since c. AD 800. It was also used as an exclamation mark before something different, more like ! first appeared in Italy in the late 14th c. None of these marks have anything to do with abbreviations, or the Beneventan script, to the best of my knowledge (I believe the slant mentioned above only refers to the stem of d, and there is nothing specifically Greek about that).</p>
