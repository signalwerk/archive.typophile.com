      <p>I did some research on this topic some years ago for my typography book. In the end I didn't include any of these vague theories. So far there seems to be no bulletproof theory about the origin of question mark and exclamation mark. Which is of course surprising, since these signs are rather young compared to period, colon and so on.<br>
      The origin in Questio and Io sounds reasonable, but I never saw any handwritten document from that time, that would support this theory. You can find some very old examples of the question mark in »Pause and Effect: Punctuation in the West«. The shapes are really remarkable and very different from our upright form today. </p>
      <p>Ralf</p>
