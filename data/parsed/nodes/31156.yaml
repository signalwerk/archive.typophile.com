    <p>I'm doing a project at university about the development of the <a href="/wiki/interrobang" class="freelinking" rel="nofollow">interrobang</a>. So far I have found out who designed it etc, and that it is made up of a ? and !. Now I am trying to find out how the ! and ? came about. So far I have found that the ! developed from the latin 'io', meaning 'joy', but I can't find any specific information about the question mark. I have found a couple of theories, one that says it developed from a 'Q', and another that says it developed from a 'Q' and an 'o'. Can anyone help me verify this? Or have I got my informatiuon completly wrong??!</p>
    <p>I would also like to find out how these letters (the i, o and q) developed and arrived in the alphabet, so if anyone knows any good sites for information that would be good! Although I am more stuck on the development of the ! and ?, so any information anyone has on those would be great please! (i have checked wikipedia btw! :) )</p>
