      <p>Miss Tiffany's right. Just a bit of show-n-tell. :o) </p>
      <p>... It's sort of bit late for me to be asking for a crit, 'cause they've already been printed and paid for, but I'll go with "super-card". My day job calls for lots of tight and sparce so in my freelancing, I like to "cut loose" a bit where I can and this card works quite well for me in that regard. </p>
