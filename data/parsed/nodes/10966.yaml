  html: <p>A few years ago I designed some faceplates for an audio company that included a numbered dial. I discovered that most Postscript fonts have the numeral "1" extend slightly below the bounding box. This looks good in body text, but as the number "10" floating in space, the one and zero look like different sizes.  <br> <br>Anyway, I just decided to scrap all software for this project and hand-coded directly into Postscript. This got around the bounding box issue and I was also able to mathematically plot the dial positions. <br> <br>Has anyone else here typed "showpage" and had fun with raw Postscript?</p>
  html_clean: <p>A few years ago I designed some faceplates for an audio company that included a numbered dial. I discovered that most Postscript fonts have the numeral "1" extend slightly below the bounding box. This looks good in body text, but as the number "10" floating in space, the one and zero look like different sizes.  <br> <br>Anyway, I just decided to scrap all software for this project and hand-coded directly into Postscript. This got around the bounding box issue and I was also able to mathematically plot the dial positions. <br> <br>Has anyone else here typed "showpage" and had fun with raw Postscript?</p>
