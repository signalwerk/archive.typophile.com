      <p>&gt; What is the evidence for this?</p>
      <p>I've seen two sources that concluded that age 10 was the average of this shift. One I forget (I can find it if you... pay me? :-) the other is "Legibility in Children's Books", Watts and Nisbett, 1974.</p>
      <p>Whatever the age is, I believe there must be a shift at some point, because I believe adults can read blurry clusters of letters (otherwise they would have no trouble reading long novels in sans, but THEY DO HAVE TROUBLE). The only way there wouldn't be a shift is if adults read by compiling letters into words, as young children do (if more efficiently). You know what I think of that theory.</p>
      <p>Don't underestimate puberty.  :-)</p>
