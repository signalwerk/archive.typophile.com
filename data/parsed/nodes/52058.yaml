      <p>I don't want to sound ignorant here, but wouldn't the best typeface for a children's book just be a very legible and clear face?</p>
      <p>I mean, helvetica is clear and has a large x-height which I think would help young eyes recognize familiar shapes.  I'm certainly no helvetica evangelist, but it's just the most obvious for my argument.</p>
      <p>Also, there is a school of thought that would lean towards serifed faces, in which case wouldn't a slab serif be legible?</p>
      <p>I wonder if, like talking baby-talk to a baby can prolong its actual understanding of language, I wonder if novelty fonts that adults recognize but require more experience and intelligence to read could make it impossible for a child to read?</p>
      <p>I had a look at the ones you suggested here and they do look good, I'm just wondering.</p>
