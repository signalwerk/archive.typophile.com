      <p>I am unfamiliar with Watts &amp; Nisbett, though look forward to reading it eventually. What evidence to they provide that supports your point?</p>
      <p>The typical understanding is that brain structures become less capable of changing at puberty. The brain is incredibly malleable at birth, but reaches critical windows for learning, where learning becomes more difficult afterwards. For example before the age of 5, learning a new language is nearly effortless. Learning a new language after 5 but before puberty is harder, but it’s very likely that you’ll learn to speak it without an accent. Learning a new language after puberty is certainly still possible, but more difficult, and few will sound like native speakers. I wouldn’t expect any brain organization to change at puberty, such as a change in reading mechanisms. If there was a change I would expect to find a drop in reading speed at this time while adapting to the new reading technique (perhaps you would expect a sudden increase?), but reading speed gradually increases during primary school, high school, and all the way through college. A long gradual increase sounds to me like improving a single reading technique with years of practice.</p>
