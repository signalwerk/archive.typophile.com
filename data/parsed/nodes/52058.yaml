      <p><cite>Sassoon P was intended to help in the process of learning to write, not so much in the process of learning to read. </cite></p>
      <p>Sorry, that’s not quite correct.</p>
      <p><cite>The Sassoon Primary project started as research with children, asking them what features of letters and spacing they liked best and what was easiest for them to read. The findings are reported in Computers<br>
      and Typography (Sassoon 1993) published by Intellect. […] The original Sassoon Primary Type was a typeface<br>
      designed with children and for children to replace the type they read. […] Educational publishers were quick to recognise the usefulness of a typeface that could represent handwriting yet not be a strict model.</cite><br>
      — from: <a href="http://www.clubtype.co.uk/fonts/sas/sassoonfonts.html">Dr. Rosemary Sassoon &amp; Adrian Williams: Why Sassoon?</a></p>
      <p>There is the Typographic Design for Children Project at the University of Reading: <a href="http://www.kidstype.org/">kidstype.org</a><br>
      And a related thread: <a href="http://typophile.com/node/14206">Type for kids</a><br>
      F</p>
