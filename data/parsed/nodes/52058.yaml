      <p><em>Evidence indicates that around age 10 kids start moving from: reading individual letters and compiling them into words; to directly reading multi-letter clusters. The latter benefits from serifs; the former does not benefit, and might very well suffer from serifs.</em></p>
      <p>What is the evidence for this? I haven’t seen anything that would suggest this is true. I believe that once children learn to decode words (have phonemic awareness and understand the spelling to sound correspondences) that there are few changes to the reading process. People become more efficient readers the more time they spend reading. This continues throughout one’s life, not just in childhood.</p>
      <p>Cheers, Kevin</p>
