      <p>Watts and Nisbett was a long time ago for me! Sadly I'm not the organized professional scientist that you are. I [have to] rely more on the nebulous aggregate impression of all the things I've read and processed. This makes it harder for me to formally convince people (well, at least Westerners), but I feel it also makes my conclusions more likely to lead to practical improvement. For example there seems to be no room for anecdotal evidence in your method; it's as if it never existed. The stance that "serifs cannot help reading because my model of reading says they can't" is not what I call Science. Doubt is the catalyst.</p>
      <p>Puberty: what I've read does not match what you state. My belief is that puberty is not the end of a phase, it is itself a period of pronounced transition from one phase to another. Many parents almost don't recognize the behavior of their children when they enter puberty! And when they come out they're not who they were before. Many things change in the brain, and I include reading strategy in that. Simply put, puberty is a transition from learning to doing. Learning the letters, to reading text. Not the same thing.</p>
      <p>&gt; A long gradual increase sounds to me like improving<br>
      &gt; a single reading technique with years of practice.</p>
      <p>It's strange to think that the human brain must be so one-dimensional and clunky. In my reading model (using the term loosely) there is a gradual introduction of the "adult" reading strategy*, applied in a way as to avoid a performance drop. The brain being obsessed with efficiency, it refuses to suffer a drop in performance. And in order to do this it gradually moves from letterwise decipherment to immersive reading (picking up blurry clusters of letters). So bouma reading replaces letterwise reading to the extent that the former is ready to take on the responsibility. And it never replaces it fully, because letterwise reading still makes more sense in the fovea. This last bit is what your field testing is picking up; but it's failing to pick up immersion. When it comes to reading, good field testing is very very very hard. It's like Huey said. And he knew what he was up against even though he was a century behind us not because of some study he read, but because he had good instincts. We are not robots, and scientists who try to think like robots are just wasting time/money.</p>
      <p>* Which gets better over time all the way into senility because the brain gets increasingly assured in taking guesses at boumas, through increased exposure to real, contextual boumas in text. It starts getting better at guessing at increasingly blurry (deeper into the parafovea) and low-frequency boumas.</p>
      <p>This transition from full-letterwise to mostly-bouma reading is sort of like a really good automatic transmission in a car: your speed does not drop when upshifting, without you doing or thinking anything consciously different. It's a somewhat complex trick, and the brain is much more complex.</p>
      <p>hhp</p>
