      <p>Dyslectic and pseudo-dyslectic kids need clues to discern some glyphs from look-a-likes and it is quite evident that serifs help in this.<br>
      In a sans the d, p, q and b are essentially identical forms, whereas the serifs in the same glyphs of a serifed face help with the orientation and ‘reading’. Whether mirrored, or upside down, a serif d is hard to mix up with a serif p. </p>
      <p>Which leads to this conclusion:<br>
      If the choice is between Century Schoolbook and Sassoon Primary: Century is a more distinct typeface. Use that.</p>
      <p>On a side note: Sassoon P was intended to help in the process of learning to write, not so much in the process of learning to read. And there have been done tests that indicate that starting to learn reading with ALL CAPS only texts is the best way to do this. Caps differ more from each other than lower case glyphs. But we are talking four and five year olds now. Your target audience is probably a bit older…</p>
      <p>. . .<br>
      Bert Vanderveen BNO</p>
