    <p>Hi there, I'm sure this matter has been raised before, but I'd like to share some thoughts about it. I'm planning a book for a primary school; it's about the local history of our town, and it should help the kids (age 6-10) in knowning its main historical facts, the public characters, the old jobs, etc. It will be filled with pictures, drawings and illustrations, and will feature exercises too - eg, the young readers will have to answer questions and fill the empty spaces provided in the pages. Now, one of the main thing here of course is the choice of typeface. The first typefaces I have thought about are, for obviuos reason:</p>
    <p>- Sassoon Primary<br>
    - Century Schoolbook (ATF)</p>
    <p>Which are very different indeed. Sasson seems a natural choice but I'm wondering if Century Schoolbook could work as well. I'd also like to discuss some other choices.</p>
    <p>PS The book will be probably set in two colums, with text flush-left, set at about 12 points with no  hyphenation.</p>
