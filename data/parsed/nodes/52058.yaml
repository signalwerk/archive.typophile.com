      <p>Evidence indicates that around age 10 kids start moving from: reading individual letters and compiling them into words; to directly reading multi-letter clusters. The latter benefits from serifs; the former does not benefit, and might very well suffer from serifs.</p>
      <p>It's useful here to distinguish between learning to read versus reading to learn. So if you're teaching 8-10 year olds to read [better], you might want to use serifs; but if your main purpose is to allow 6-10 year olds to read about something as easily as possible, I would avoid serifs. It's not that most kids simply freeze when they see a serifed letter of course, it's that some will become frustrated (without necessarily even realizing it). By the same token, ideally you would use a looser font with a large x-height, at a somewhat large point size (although those approaching 10 might be held back by such typography).</p>
      <p>That said, there are about 2 million* choices that would be better than Helvetica. For one thing, this book is about your town, which is in northern Italy today, not in Switzerland 50 years ago. Issues of legibility and readability do not preclude cultural considerations.</p>
      <p>* Well, OK, not 2 million. More like 2000.</p>
      <p>hhp</p>
