    <p>* well not quite.</p>
    <p> interesting to see a mainstream article on fonts by someone who clearly has no grasp of the subject matter. :/ </p>
    <p>"Here's a quick primer on typefaces: They are divided into two main groups - serif and sans serif. Serifs, simply, are letters with tiny horizontal lines added to the top and bottom."</p>
    <p>Originally appeared in the Sacramento Bee ... nobody bothered to notice that<br>
    the lead no longer makes sense when the story is published elsewhere.</p>
    <p><a href="http://www.philly.com/inquirer/magazine/20080101_Are_you_an_Arial_or_a_Comic_Sans_sort_.html" rel="nofollow">Are_you_an_Arial_or_a_Comic_Sans_sort?</a></p>
