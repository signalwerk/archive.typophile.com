      <p><em>Print, How, STEP, Baseline, eye, etc.</em></p>
      <p>I thought you meant mainstream = general media, not trade.<br>
      Of course trade press writers, such as Allan Haley and John D. Berry, know their stuff! </p>
      <p><em>well-researched.</em></p>
      <p>Whenever I've been interviewed by mainstream media, the reporter has never done any homework and starts from scratch, and while the stories may be professional, they are stodgy with background. For instance, last year, in response to a press release I sent out for a new typeface, a newspaper reporter devoted less than 20% of the resulting article to the typeface, with the rest devoted to a potted history of digital fonts. Fortunately, she didn't mention good old bancomicsans.</p>
