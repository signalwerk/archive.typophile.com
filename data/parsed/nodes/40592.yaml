    html: |-
      <p>&gt; the reporter has never done any homework and starts from scratch</p>
      <p>Not surprising. I spent nearly 10 years as a newspaper reporter, and you were expected to produce from 3 to 5 stories a day. This was at smaller papers. For the Bee, I suspect this story was one day's work, perhaps with a few smaller stories put in.</p>
      <p>The author was probably aiming the article at the general reader (you know, grade 10 reading level and all) and not the trade. I didn't see any glaring errors, which is a step above most.</p>
      <p>I consider it a good article (not great) in that it gets the word out about type, and it had a nice plug for Helvetica (the movie).</p>
