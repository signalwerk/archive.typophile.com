      <p>Yee Haw Industries recently gave a great talk for AIGA Raleigh. They brought with them a locked up chase for an announcement that used all original (19th/20thc) wood and lead type, and hundreds of limited edition ephemera printed from wood type or wood engravings. (Very cool stuff).</p>
      <p>They have one of the most extensive collections of wood type in the U.S. and, while designers/printers Julie Belcher and Kevin Bradley often draw images and type, the work is clearly of their hand. I have a large wall menu (4 ft. x 5 ft.) they designed and printed packed solid with various widths and heights of beautifully aged sans serif wood types, similar to the fonts Jonathan was probably looking at when he designed the Champion family. So I would guess the letterforms are "authentic" and not digitized, which adds to the poster's quality.</p>
      <p>Of course, the design is a translation of the DaDa sensibility by the designers. If you haven't seen much of their work, visit <a href="http://www.yeehawindustries.com/new/home.html" title="http://www.yeehawindustries.com/new/home.html">http://www.yeehawindustries.com/new/home.html</a>. Enjoy!</p>
