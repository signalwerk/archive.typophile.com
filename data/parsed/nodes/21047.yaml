      <p>kevin/julie-yee-haw industrial letterpress:<br>
      hi y'all, typography on the large dada print from the national gallery exhibition,<br>
      the wood type is gothic, (20 pica-black type) up to (70 &amp; 90 pica-red,) hamilton type foundry from the 1860's. no computer involved,  no manipulation of the font, hand pulled straight from the wood blocks. we also did 2 dada posters, a small dodger of hugo ball poem - with some amazingly beautiful small metal type, 4 greeting cards, one-of-a-kind journals with typography covers and some mini card packs. I don't have any of these on our web site yet - as they were exclusive to the national gallery for the duration of the show... but very soon.</p>
