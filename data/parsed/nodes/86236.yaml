    <p>This is a bit of an odd question. Several years ago I made a font based on some sketches made while looking at blueprints at the Canadian Center for Architecture. They were early 20th century, but I don't have a year, and do not have any other information about those blueprints. Now I'm looking for a way to keyword and describe this font and am a bit at a loss as to how to describe it. It seems to have influences from Art Deco and the Arts &amp; Crafts movement, but wonder if there is any more exact terms/description I can use? </p>
    <p><img src="http://www.pixilate.com/images/66.png" alt="Montreal Architect lettering"></p>
    <p><img src="http://www.pixilate.com/images/67.png" alt="Montreal Architect font"></p>
    <p>A closer look here: <a href="http://www.pixilate.com/fonts/montreal-architect" title="http://www.pixilate.com/fonts/montreal-architect">http://www.pixilate.com/fonts/montreal-architect</a></p>
