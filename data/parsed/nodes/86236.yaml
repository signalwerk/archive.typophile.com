      <p>I'm sure there is, but I'd say you'd play the game by their rules. If you can only choose from two or three so-so decriptions, but your font sells better having it listed _their_ way, it is what it is. I don't think 'blueprint' will be listen as a category...</p>
      <p>If you would be able to indicate a time period on these sites, 'Jugendstil', 'Art Nouveau', 'Berlage' or 'Amsterdam School' comes to mind. But having a closer look -again- at your font (k, n, s, K, N 1, etc) I'd say yours is a bit less 'static'.</p>
