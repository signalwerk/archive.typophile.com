    html: |-
      <p>There are several webfonts services in Japan for Japanese fonts but they all operate in a similar way, they either provide fonts with a limited subset of say 3,000–6,000 glyphs or they want to analyze individual webpages and generate a subsetted font based on the contents of those pages.</p>
      <p>I think you probably want to ask "why?" a little more to figure out why this is needed because the solutions aren't necessarily simple.</p>
