    <p></p><div class="imageWrap"><img src="http://typophile.com/files/!CR-OFLspec_4920.png"></div><p></p>
    <p>!CRASS ROOTS OFL</p>
    <p>"Manly? Yes, but androids like it too."</p>
    <p>A descenderless, anti-kern stencil font that you could actually make stencils from. Still best with a razor, not quite scissor friendly. A license you could make most anything from. Inspired by 'mechs, intended for streetart/craft/physical use.</p>
    <p>OpenType (TT-flavor), hinted, approx 190 glyphs. Includes fi, fl, Et, .~ and +/- ligs. Component of upcoming !CRASS ROOTS Display Family, and the new Signature font of !Exclamachine Type Foundry.</p>
    <p>I particularly like how the brackets and the f* ligs came out.</p>
    <p>Available here or here:<br>
    <a href="http://www.abstractfonts.com/font/12093" title="http://www.abstractfonts.com/font/12093">http://www.abstractfonts.com/font/12093</a></p>
    <p><a href="http://openfontlibrary.org/?ccm=/media/files/ChozCunningham/30" title="http://openfontlibrary.org/?ccm=/media/files/ChozCunningham/30">http://openfontlibrary.org/?ccm=/media/files/ChozCunningham/30</a></p>
