      <p>Thank you very much Dan, that makes my day. My main goal was to make a design that would look consistent, yet physically hold up as a carboard or other cutout. Without making a dot-matrixy-thing. This required an approach that I suppose borders on the mysterious notanic arts that pop up here now and again. Actually, I just cut out the most fragile looking ones, then toyed with them. Some broke, and were redrawn. </p>
      <p>I've got your feed in my bookmarks now. I've been a fan/user of your blackletter resources page for a while but hadn't noticed who's tools I was perusing. Thanks for the head up, theres lots of other stuff there for me to go chew on!</p>
      <p>I like your letters a lot. I am fond of real stencil art and miss all the great graffiti from my hometown. Good stencil letters evoke such gravity, and pull the background up to the plane of the letters themselves. The DURCH BLICK feels both fast-moving and yet dense. Looking forward to seeing more.</p>
      <p>Just for fun, I'm going to mimic that with my face to see how vastly different it comes out, even though I might categorize both in the "industrial" subtype:<br>
       </p><div class="imageWrap"><img src="http://typophile.com/files/crassblick_5855.jpg"></div><p></p>
      <p>(Faux-bliqued on-the-fly.) My data per pixel wins! :) But it doesn't look as inarguable. :(</p>
