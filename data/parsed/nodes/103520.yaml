      <p>It's so close to Windsor D Extra Bold Condensed (<a class="freelinking external" href="http://www.myfonts.com/fonts/urw/windsor/d-extra-bold-condensed/specs.html" rel="nofollow">myfonts link</a>)  - apart from the F and the tips of the Z - that it looks like someone just rounded those off. The <a class="freelinking external" href="http://www.faustone.com/img/fuzz_unit_intro.jpg" rel="nofollow">new replicas</a> use the original font though, but you probably know that... :)</p>
      <p>(Just passing through searching for Windsor-related posts...)</p>
