    html: |-
      <p>The horse has left the barn but a few comments:</p>
      <p>IMHO this does not make a good logo. It makes a great, and interesting, and even elegant type treatment for say an article title where it can be offset/balanced with page layout, but it is too imbalanced, distended, and horizontal for a logo.</p>
      <p>All the weight is at one end or the other, and it virtually dissipates into nothingness at the end. The name implies things that are good in a design firm... design with gravity, with weight and substance and impact. But the treatment actually implies the opposite; mass dissolving into nothingness.</p>
      <p>It's too horizontal. It will work on a web site header or letterhead, and maybe on a pen, but the constraints it poses on usage in other applications is rather severe, both in terms of form and readability.</p>
      <p>It points up the fact an interesting and compelling design type design doesn't automatically translate into logo effectiveness and utility.</p>
      <p>Part of the problem is the length of the name, which is right at the limit of manageability. A company name with five syllables is working at a disadvantage. </p>
      <p>I would have tried having the name go bold-light-bold or light-bold-light and simply adjust the spacing for visual balance and readability. It would have been more compact and symmetrical. Not sure if it would still work as a logo, though. This situation sort of begs for a mark/symbol that can be used with/without the logotype.</p>
