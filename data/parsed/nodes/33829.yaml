      <p>Dear Tiffany,</p>
      <p>Thank you very much for your thoughts. Yes the conception derived from the modularity of space and architectural wide planes/floors of contemporary galleries. I was impressed by The Tate Modern's spacious galleries and i was thinking very much about them when i was designing. The "space" typeface is not News Gothic but Franklin Gothic Book. </p>
      <p>* Thank you Tim for your insights. I will consider them and post reviews asap.</p>
      <p>* Thank you Patricia. I liked somehow the embedded Cross in the center of the 4th piece.</p>
      <p>*As for the 2nd piece i have some earlier drafts distinguishing AE from one another I'll review it and post later.</p>
