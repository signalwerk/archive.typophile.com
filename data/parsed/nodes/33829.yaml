      <p>While 3 and 4 have a Piet Mondrian effect, which I am not sure works with the contemporary, they need some work to make them more apparent as AE, combining upper and lower case (4) doesn't really work for me especially when ae could work in lowercase, while 3 is a bit too FF. 5 and 6 are a little too obvious and they seem as if I have seen them before or at least the essence of them. 1 and 2 seem to have the most mileage in developing they both are a little severely geometric and I am not keen on the use of Helvetica for SPACE in 2. I hope you don't find this harsh, welcome btw.</p>
      <p>Tim</p>
