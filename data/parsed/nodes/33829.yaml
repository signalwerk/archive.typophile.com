    <p>Hello to all,</p>
    <p>This is my first post in Typophile forums, thank you to everyone who comments and criticises the attached drafts for my freelance project...</p>
    <p>It is for a gallery in NY, a new exhibition space for Contemporary Art. The new Gallery space is going to allow in a "contemporary context" other curators to showcase their works varying from Art Brut to Outsider Art and New media Arts to innovative Art productions...</p>
    <p>These are my first ideas/drafts on the job. I would like to hear your opinions and constructive critiques. I very much appreciate your time and valuable suggestions.</p>
    <p>Ayse</p>
