    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 6.Aug.2007 12.57pm </div>
      <p>. . . . . .<br>
    ATypI 2007 - Brighton, U.K.<br>
    September 12-16, 2007<br>
    Hands On 07</p>
    <p>. . . . . .<br>
    <em>News and updates</em></p>
    <p>- Register now! Early bird registration ends August 14</p>
    <p>- TDC and SOTA Exhibits</p>
    <p>- Poster session</p>
    <p>- In celebration of our 50th anniversary, 5 additional T-shirts available for purchase at the conference designed by:<br>
      -  Johanna Bilak (thanks to Maarten Idema for the DrawBot2 scripting)<br>
      -  Neville Brody<br>
      -  Ale Paul<br>
      -  Lawrence Zeegen<br>
      -  Juliet Shen<br>
      Designs will be available to view soon.</p>
    <p>- Program highlights:<br>
      - 2 days of TypeTech Forum to include a track by FontLab and Dutch Type Library<br>
      - 3 days of concurrent sessions in the main program<br>
      - Keynote presentations to include talks by Richard Hollis, Humphrey Stone, David Crow, Ken Garland, James Mosley, Matthew Carter, and Michael Harvey<br>
      For complete TypeTech program details, see: <a href="http://www.atypi.org/05_Brighton/typetech/20_main_programt" title="http://www.atypi.org/05_Brighton/typetech/20_main_programt">http://www.atypi.org/05_Brighton/typetech/20_main_programt</a></p>
    <p>For main program details, see: <a href="http://www.atypi.org/05_Brighton/20_main_program" title="http://www.atypi.org/05_Brighton/20_main_program">http://www.atypi.org/05_Brighton/20_main_program</a></p>
    <p>- Opening reception to include a film screening</p>
    <p>- Auction and Garden Party events</p>
    <p>- 4 optional tours as well a free lettering walk around Brighton</p>
    <p>And much more....</p>
    <p>- For registration details and to sign up for the conference, visit the ATypI Store at: <a href="http://www.atypi.org/store" title="http://www.atypi.org/store">http://www.atypi.org/store</a></p>
    <p>. . . . . .<br>
    For questions and more information, please send email to secretariat (at) atypi.org</p>
