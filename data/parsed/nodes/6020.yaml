    html: "<p>Hi Guys, <br> <br>Some people think that a font for text, can�t be flavored enough, like Underware fonts. I am disagree with that. I mean, some guys uses this argument to critique a text font, i understand that text reading have to be transparece to the reader, but pleasent forms are refreshing if they work technically  good.  <br> <br>It seems that there is a prejudice about that. A friend of mine, Juan Pablo, ask me about sacrifice coolness or decide about: Display or Text. The same guy put an example of this with Emigre fonts, who describes as Display decorative fonts, pretending to be text fonts. <br> <br>What do you think about this? It an intesenting discussion, i dont know if there are similar prejudices around there?  <br> <br>mh.</p>"
