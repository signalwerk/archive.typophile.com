oint that Garamond should be \"uneven\". <br> <br>A parting comment re sans. Scour the internet and look for the new Ancient Greek (sans) that Dann Carr has cut for a book titled Fragments of Parmenides, printed and published by Peter Koch. The text was translated by Robert Bringhurst. It's a really lovely type, and another version has been done digitally, but at the moment I can't recall who did that one. <br> <br>Jim Rimmer <br> <br> <br> <br></p>"
