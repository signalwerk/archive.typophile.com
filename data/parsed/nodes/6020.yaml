    html: <p>It seems to me that generally a text type should be artistically strong enough to work for display, if it is optically scaled (big sizes 'go on a diet' for display). In other words, the letter forms will still be identifiable as the same face at both sizes. It may not be great at display, but it should look pretty darn good. The only exceptions would be designs for very small sizes like Bell Centenial or Biblion, where there are extreme distortions for the sake of legibility at a very small size.  <br> <br>But the other way around doesn't work. There are excellent display types that won't work at all as text. There is an assymetry here.  <br> <br>I think Hrant is right that the two different kinds of reading are different, and for extended text the typeface must be able to become transparent. If it is so mannered that it cannot become transparent it will fail as text type.  <br> <br>But he is wrong in ignoring that we also look at that same text type in what he calls the 'deliberative' way. We aren't always immersed. We look at the page, the subheads, the first few words more slowly. We go in and out of immersion. That's why the aesthetics and flavor of the text type are important. Ugly is a liability in a text type also, in my opinion, unless it is absolutely tiny, so the legibility trumps every other consideration.   <br> <br> </p>
