    html: <p>Nick, <br> <br>&gt;"Reading theory" is bunk. <br> <br>Seriously?  Optical correction is a fact of life, and it seems (to me at least) that the practice of optical correction and readability/legibility are a perfect marriage (albeit a shotgun wedding).  Can optical correction really have a point without readability?  I'm not defending Hrant, which reminds me... <br> <br>Hrant, <br> <br>I was thinking about the bouma thing today and it dawned on me--if words can have established shape recognition, why can't individual letters.  They obviously can.  Still seems like a chirographic convention to me--the broad-nib pen is the genesis of certain "sub-stroke" features (like the one in bicameral "a", moving from the start of the bowl and into the lower portion--this can't be a perfect geometric curve or the eye will notice that something is a little off). <br> <br>Even a good sans with very little modulation demonstrates the sub-stroke. <br> <br>Right?...</p>
