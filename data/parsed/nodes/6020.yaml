    html: <p>Hrant, you are not my analyst, parent or spouse, so don't tell me what's good for me. And I ain't never gonna trust ya -- you'll have to convince by the logic of your argument. <br> <br>And oh no, not the old whipping boy of "Emigre relativism". Please, get over your nemesis of "we read best what we read most" -- or come up with a counter catch-phrase that's as succint and memorable! <br> <br>Certainly, there is a genre of traditional serifed type, and a way of using it, that requires optical scaling, but this is a special case (which has for too long stultified typography), not a general principle. <br> <br>A good typeface from either genre will be sufficiently well designed that it can pass muster in an unintended, alien environment. <br> <br>The exception is outrageously wacky display faces (such as the faux Japanese), and display faces that have extremely fine features, such as Giza, Throwhand (an interest of David Berlow), or ultra-thins. However, it's amazing that faces such as digital Bauer Bodoni can be used as text faces at all, given the delicacy of its detail, but it can, because the design is so strong. <br> <br>There is a myth which you adhere to, that there is some profound mechanics of extended immersive reading, far above mere aesthetics, which you are particularly privvy to.  <br> <br>But it's not that clever; quite simply, some typefaces are better than others. By the same token, some musicians are better than others -- virtuosi. When they play, the listener becomes deeply immersed. Nothing to do with the maestro's scientific understanding of acoustical bio-mechanics.  <br> <br>Making fonts (aka type design) is a craft, requiring a combination of aesthetic discrimination, originality/personality, and technique. "Reading theory" is bunk.</p>
