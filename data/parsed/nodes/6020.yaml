    html: <p>Kirsten <br> <br>These types spring from metal sources and were done in  a range of sizes from 5 point to in some case 96 point, so they were intended for use as diaplay as well as text. Most certainly the foundries producing them would did a lot of scaling of parameters and weights to make them work. I think very few of these have not been translated in to digital format. <br> <br>Garamond <br>Garamont <br>Bodoni <br>Baskerville  <br>Caslon <br>Spectrum  <br>Lutetia <br>Venezia <br>Joanna <br>Fournier <br>Post Roman <br>Palatino <br>Athenaeum <br>Cloister Oldstyle <br>Bembo  <br>Bell  <br>Dante  <br>Juliana <br>Italian Oldstyle (Goudy) <br>Romulus <br>Perpetua <br>Plantin <br>Sabon <br>Times New Roman <br>Van Dijk  <br>Walbaum  <br>Bulmer <br>Trump Mediaeval <br> <br>I have listed serif faces only, not wishing to fall into the trap as to whether or not sans types are suitable for text, but what the hell, I have never paid much attention to the "sans-aint-for-text" club. If I like it I'd use it. <br> <br>Jim Rimmer</p>
