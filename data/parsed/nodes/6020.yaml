    html: <p>In fact letters are the foundational elements - and for most of us they're the only things we're <i>explicitly taught</i>, which is why reading via boumas seems counter-intuitive*. But once we're taught the atomic units we start fending for ourselves, and we learn things (boumas) without explicit instruction, simply because it helps reading performance. <br> <br>When you think about it (and when you take into account certain pieces of empirical data, not to mention tons of anecdotal evidence) you realize that it only makes sense. After all, why would the brain <i>refuse</i> to take in the "ing" string for example as a cognitive unit? And why would it be so hard to read the word "readjust"? <br> <br>* Another "problem" with the bouma model is that it's anti-Modernist. <br> <br>I think the most elegant way to look at this is to see a letter as a single-element bouma. <br> <br>hhp <br></p>
