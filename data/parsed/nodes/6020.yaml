    html: <p>&gt; that is hardly the fault of the metal types. <br> <br>When did I say it was? <br>My point was that a metal "typeface" that works well in both display and text effectively contains many different fonts, each tuned to its size. A given single font cannot do both text and display well, or at least not at the highest level. <br> <br>hhp <br></p>
