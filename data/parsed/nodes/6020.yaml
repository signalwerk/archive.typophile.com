    html: <p>Most people will tell you that a display font will rarely look good for text, but a text font can be made to look good for display. I myself agree with the first part, but believe that at the very top end of text face design the second part is untrue. It might sound paradoxical, but a "real" text face needs to have a certain ugliness about it. One clue is that -as most people will admit- optical scaling matters. <br> <br>hhp <br></p>
    html_clean: <p>Most people will tell you that a display font will rarely look good for text, but a text font can be made to look good for display. I myself agree with the first part, but believe that at the very top end of text face design the second part is untrue. It might sound paradoxical, but a "real" text face needs to have a certain ugliness about it. One clue is that -as most people will admit- optical scaling matters. <br> <br>hhp <br></p>
  - id: 42572
