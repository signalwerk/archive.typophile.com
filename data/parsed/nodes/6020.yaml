    votes: null
    html: "<p>Nick, Nick, Nick. You <i>have</i> to snap out of this - the sooner the better. Trust me on this one. <br> <br>Type is more than about aesthetics, and this is the reason there's a duality. <br> <br>You yourself have made both display fonts and text fonts. When I think about how you can be capable of making the latter, my tentative conclusion is disconcerting: you do it by mimicking precedent. Disconcerting, because this shakles you; you'll only be able to make text fonts that are as original (hence culturally valuable) as your display fonts by understanding reading, instead of pretending that aesthetics and cultural norms are everything. <br> <br>Don't be afraid of dumping the sad Emigre relativism. <br>Type design is so much better without that hogwash. <br> <br>hhp <br></p>"
