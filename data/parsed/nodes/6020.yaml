    html: "<p>&gt; text reading have to be transparece to the reader, but <br>&gt; pleasent forms are refreshing if they work technically good. <br> <br>No face can -or should- be totally transparent. But there is a qualitative difference between the transparency needed in text versus display design, and this is due to the nature of the intended reading experience: deliberative, where we have time to read a handful of words and we can consciously appreciate the formal details; versus immersive, where the subconsious reading mechanism takes over, because it becomes a performance issue. Readability really only matters when a reader is pushing the limits of perception/cognition - otherwise virtually everything is pretty legible. <br> <br>&gt; it IS the use of a display type for text. <br> <br>Only if you use a peculiar -maybe pointless- definition of \"text\". <br>Really <i>any</i> text is \"text\", even if it's one word. But a <i>useful</i> definition of \"text\" versus \"display\" entails a consideration of how humans read. It's been shown for example that when a font is too large reading slows down a lot. So to me \"text\" means a setting that crosses into the subconscious, immersive mechanism. This is where boumas start to matter, and where an x-height can be too large for example, or spacing too loose. This to me is a useful boundary to think about in the text/display discussion. <br> <br>&gt; If you scaled that same display fce down into 12 point and <br>&gt; set the same text the effect might be less successful. <br> <br>Exactly, and not just aesthetically, but functionally. <br>And what does that tell you? <br> <br>&gt; not always graceful. <br> <br>Exactly. And that's why I say \"ugliness\" has merit in text face design, because it's really only ugly at the deliberative level. At the immersive level it's <i>required</i> to make a text font \"click\" for real. <br> <br>(I wish Walter Tracy were alive, and a Typophiler...) <br> <br>hhp <br></p>"
