    html: "<p>HBM <br> <br>As nearly as I can figure it the reason that some people dislike sans is because they were told in art school that they should (as a text face). <br> <br>I do agree that sans type for the most part don't make the most ideal type for large texts, but I think they were not designed for that. <br> <br> For a good many years I convinced myself that I disliked Bodoni . . .all Bodoni, because I read somewhere that I should dislike it. And then one day I took a really good look at it (since I had come into possession of a large number of matrices for casting it) and discovered that to my new eyes, it was lovely. <br> <br>I get a little tired of type police. For the past 20 years or more my attitude has been that there is no bad type, some are just better than others. If you apply yourself, you can make any type work, with the possible exception of Murray Hill. I do reserve the right to dislike something. <br> <br>I think that if any type has gone through the jury system of a respected, established manufacturer it can't really be inept. <br> <br>To answer your other question I like the following sans for both text and display. <br> <br>Futura <br>Hess Sans Serif <br>Philadelphia Lining Gothic <br>Plate Gothics (Copperplate) <br>Gill Sans <br>Goudy Sans <br>49J Gothic (Lanston Monotype <br>Twentieth Century <br>Univers <br>Helvetica <br>Optima <br>Franklin Gothic (Looks great in 8 point, Yummy!) <br>New sGothic 206 <br>Grotesque (English Monotype) <br>Kabel <br> <br>And all seriousness, I would add Cheltenham to my Roman list. <br> <br>Hrant: <br> <br>If the type I listed did not come out to be the same typeface as when they were metal types that is hardly the fault of the metal types. In any event the ones that I am aware of that are available on the computer still look pretty good to me. Probably because the maker has done extensive scaling and altering. Some of the current Garamonds look a little stiff-assed, and kind of missed the whole point that Garamond should be \"uneven\". <br> <br>A parting comment re sans. Scour the internet and look for the new Ancient Greek (sans) that Dann Carr has cut for a book titled Fragments of Parmenides, printed and published by Peter Koch. The text was translated by Robert Bringhurst. It's a really lovely type, and another version has been done digitally, but at the moment I can't recall who did that one. <br> <br>Jim Rimmer <br> <br> <br> <br></p>"
