    html: <p>Miguel <br> <br>I often wonder if the classification of type into text and display is not more than a little subjective. <br> <br>I have used 30 point Garamond italic for a broadsheet wherein the entire text was set in this display size. I have seen others do the same kind of thing and the effect is striking. So perhaps this is a little off the discussion, but it IS the use of a display type for text. If you scaled that same display fce down into 12 point and set the same text the effect might be less successful. <br> <br>There have been many comparison studies made by scaling different type-size fonts to a common size to compare weight and stroke. I don't think anyone ever came to common understanding over it. So a text face is often huskier and has differing perameters, and if you blow it up, it becomes a medium weight, and not always graceful. <br> <br>Sumner Stone designed a lovely face that he has named Arepo, and considers it a display face. I wonder if it wouldn't serve well as a text type. It has all the attributes of a type that would serve in text. It's very attractive, but doesn't holler and shout or draw attention to any one letter. <br> <br>Jim Rimmer <br> <br> <br> <br></p>
