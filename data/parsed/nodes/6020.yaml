    html: "<p>No, Mrs Eaves is lousy for long text because its spacing is bad (and it's too loose for the ideal point size range - see below). Mrs Eaves is only a text face if you use InDesign's optical spacing. <br> <br>You're confusing the x-height issue: in terms of ideal readability, correct vertical proportions depend on target point size range; in fact a book face needs a smaller x-height than a display face! <br> <br>BTW, the Emigre relativism precludes a font not being appropriate for text because of a too-small x-height. WRBWWRM simply says: vertical proportions don't matter. <br> <br>Understanding readability requires thought, not idolatry. <br> <br>hhp <br></p>"
