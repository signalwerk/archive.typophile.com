    html: <p>"Some of the current Garamonds look a little stiff-assed, and kind of missed the whole point that Garamond should be "uneven"." <br> <br>A while back Jeffrey Atherton and I were doing some research for a book on Gutenberg and we invited Nicolas Barker over to pick his brain. I was working with him on another project at the time so he graciously obliged. He started out his "interview" with a discussion of a very early application of digital type software, that being the use of the mathematical powers of the computer to find the Garamondness in Garamond. It seemed apparent he was only using this as a teaching metaphor, as a point of intellectual approach for us to pursue, but I thought the example quite remarkable. <br> <br>Gerald Lange</p>
