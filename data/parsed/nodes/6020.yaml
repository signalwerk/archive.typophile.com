    html: "<p>&gt;infant photos <br> <br>Actually, I was 10 when that was taken. <br>The ravages of time have taken their toll -- please allow me the VANITY of a snotty Pottersque avatar. <br>Hrant, welcom to the KID KLUB! <br>Stuart? AW, 2 KEWT! <br> <br>&gt;reading theory is bunk <br> <br>A. Scott's question was 'do you find the designing of text faces to be too \"academic\"?' <br>No, but discussing it can get that way. <br> <br>As far as I'm concerned, reading theory has ABSOLUTELY NOTHING to do with the CRAFT of making a typeface. The old guys who designed all the most readable faces managed perfectly well without if FOR CENTURIES. <br> <br>Sure, science and LOGIC can help explain how people and things work, but whenever they are used as the basis of creativity the results tend to be BANAL and inhuman. <br> <br>As Rilke said (sorry, this is from memory, of a translation) \"ONLY THROUGH LOVE can one understand a work of art\". There's enough art in typography to make his statement applicable. <br> <br>&gt;I honestly consider text to BE display just with more rules and different goals. <br> <br>Right on, Stuart. And I'm sure that's the way Nic Jenson worked on the definitive roman type, which was what we would consider a large text size, around 14 pt in size. Like all subsequent type designers who have produced a smooth text face, he was obviously very UP CLOSE AND INTIMATE WITH HIS GLYPHS, and THE WAY THEY COMBINE with one another. <br> <br>For text, as opposed to display, the principles are simple: <br>1. Sturdier details (eg thicker hairlines and serifs) <br>2. Avoid small counters <br>3. Wider sidebearings and serifs <br>It's that simple -- if you follow these principles, you can turn any display type into a text type. However, if your typeface has uneven color as a display face, it will have uneven color as a text face too, and such faults tend to be more obvious at text size.  <br> <br> <br> <br></p>"
