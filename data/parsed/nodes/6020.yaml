    html: <p>Hrant bite your tongue, shallow . . . . Sheeesh! :D <br> <br>Seriously, I've designed both text and display and I honestly consider text to BE display just with more rules and different goals. <br> <br>I'm sure somebody will jump don't my throat here and tell me they are totally different but it's still the same number of letters, attention to spacing and kerning and make no mistake COLOR is just as important to a display face as a text one. <br> <br>Beyond that, I have a grass is greener on the other side philosophy about designing text since display is my preference. I would love to design the next Helvetica or Times so I am compelled to experiment to figure out what works and why with text designs. <br> <br>It's like sitting down to design a display font and saying my goal is to create something that looks like a 1940s Chinese menu. I can easily judge the success of the face or not when I've gotten a few glyphs into it. I think the same goes for a text face if I define a goal for it before I start. <br> <br>I enjoy making fonts, all kinds of fonts and I highly suggest that a type design NEEDS to actually make both kinds at least once. It'll raise acute design issues they hadn't considered in there preferred font making style. <br> <br>My 2� <br> <br>Stuart :D</p>
