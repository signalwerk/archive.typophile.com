    html: "<p>&gt; I think very few of these have not been translated in to digital format. <br> <br>With a huge difference: no optical scaling. Different cuts for different sizes are what make a typeface suitable for text and display - and at that point you might say it's no longer the same typeface - you would certainly say it's no longer the same font. <br> <br>If you look at the optical progression in ATF Garamond, you'll notice gradual curves below 12 and above 14, but an abrupt shift between 12 and 14. That's because the ATF boys saw that as the cutoff between text and display. Usually I myself would put it between 11 and 12, but considering that Garamond is small on the body, it makes sense. <br> <br>And if you put the 6 point ATF Garamond (enlarged) next to the 48 point ATF Garamond next to Times, and you ask laymen \"which two fonts are the same\", you'll get them pairing up the 2nd and 3rd all the time. And if you ask them \"Which one is ugly\", they'll point out the 1st one vitually all of the time. Ugly has virtue in text. <br> <br>hhp <br></p>"
