    date_raw: null
    votes: null
    html: <p>What's all this display OR text nonsense? <br>It's up to the typographer how to use what font where. <br> <br>For instance, you could use a "text" face if you want a bit of sturdiness -- maybe you are doing a subtle tonal effect, or running type over a busy picture, or printing on  a very textured stock. Or you want to make the type look like has been blown up big, really in your face, say with a high contrast image or an image with a coarse graphic screen. Or maybe you are going to give the type a faux effect, and you need the heft to withstand the distress. <br> <br>At the opposite end, you can use display faces quite small on coated paper, especially on a small sheet that people will hold close. And when you need a precious effect. <br> <br>So really, typefaces should be designed to look good both small and large.  <br> <br>Rather than "Display" and "Text", consider "Fine" and "Strong" as the terminology. </p>
    html_clean: <p>What's all this display OR text nonsense? <br>It's up to the typographer how to use what font where. <br> <br>For instance, you could use a "text" face if you want a bit of sturdiness -- maybe you are doing a subtle tonal effect, or running type over a busy picture, or printing on  a very textured stock. Or you want to make the type look like has been blown up big, really in your face, say with a high contrast image or an image with a coarse graphic screen. Or maybe you are going to give the type a faux effect, and you need the heft to withstand the distress. <br> <br>At the opposite end, you can use display faces quite small on coated paper, especially on a small sheet that people will hold close. And when you need a precious effect. <br> <br>So really, typefaces should be designed to look good both small and large.  <br> <br>Rather than "Display" and "Text", consider "Fine" and "Strong" as the terminology. </p>
