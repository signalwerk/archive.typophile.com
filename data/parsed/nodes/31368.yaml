      <p>To a naive person, crafsmanship may have a different meaning. People of little means have always felt the only option was to use their own hands--that the sweat and toil of their own hands had more to say than the perfection of craft by someone else's. I think of it as well like the crude, hard to read, crayoned, get well wishes from my kids several years ago when I was getting heart bypass surgurey. Their own hands may have been poor at the lettering craft, but the meaning was far more powerful than any of Zapf's finest work.</p>
