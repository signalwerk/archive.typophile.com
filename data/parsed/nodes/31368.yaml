      <p>Thanks to Hrant for giving us something to think about and talk about. </p>
      <p>Wormwood said,<br>
      "We have no idea of the context in which it was made."</p>
      <p>Yes we do know some context. Just based on the picture Hrant posted we know it marks a grave from 1905. I extrapolated more context from the link that contained the picture. It is a grave at the Wassamssaw Baptist Church in Berkeley County, South Carolina. The closest stonecutters at that time were a hundred miles away in Charleston — cars, expressways and freight forwarding weren't around at that time BTW. The stone is more than likely limestone, the cheapest stone available and it's very soft. There is plenty more context that I gathered.</p>
      <p>I think Miss Tiffany and dezcom get it right. When my time comes I couldn't care less. Gravemarkers are for the living, not the dead. But my living thoughts are that I would prefer mine be made by someone without skills that cares rather than a hired hand. The key that Shula's marker was made by someone that cared is the poem.</p>
      <p>Hrant, just saying that they could've sold some deer carcasses to cover the expense is being flippant. I am, nevertheless, glad you're giving your honest thoughts.</p>
    html_clean: |-
