      <p>By the way, here is how a headstone is done in our cemeteries:<br>
      After the burial of the deceased, the grave is sealed with a stone placed horizontally (not vertically) then the electric stone-cutter is driven from LTR inscribing the RTL wh+how info in fascinating Calligraphy, without prior outlining. More surprisingly, the inscription takes place only after fixing the stone leaving no room for errors. Incredible!</p>
