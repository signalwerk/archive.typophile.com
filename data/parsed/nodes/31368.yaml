      <p>Like BlueStreak, I've now managed to extrapolate a lot more from the picture...</p>
      <p>Shula's parents had already died from the same plague that finished her off. Only her 8 year old twin brothers remained, who were now homeless as the family shack had been reposessed by a merciless landlord. Winter came early in 1905 and it was amidst a bitter snow storm on the edge of the cemetary that the two crippled and pox ridden boys, Walta and Hecta, struggled to fulfill their dead mother's wishes by creating a lasting memorial to her beloved daughter. If they lifted even a stick from the ground the sheriff would shoot them for stealing firewood, so Walta made do and used the rotten stumps of Hecta's diseased fingers to scratch the words into the freezing cement. Or maybe not.</p>
