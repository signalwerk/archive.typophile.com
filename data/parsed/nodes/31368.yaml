      <p>Wait, that doesn't look like stone, it looks like cement! Maybe the father was a cement guy? So I'm guessing they poored the cement into the typical wood frame on the ground, then figured to just use a branch or something while it was still wet. I'm certainly a fan of heartfelt spontaneity, but: Had they never seen a headstone before? And when they were finished, didn't they realize it was too cruddy? They could have made a second, better one - or even just resurfaced it with a bit more cement and tried again. I think it's pretty safe to say they didn't care.</p>
