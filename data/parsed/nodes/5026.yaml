  html: <p>&lt;font class="dontLookLikeCrap"&gt;This is for the SF Chinatown Night Market.  They want something that will appeal to corporate sponsors for the event, but still allude to the roots of this event.   <br> <br>There are two concepts, the one I am showing right now focusses more on the Sanf Francisco aspect of the event, not so much the NIGHT-MARKETness of the event (that comes later). <br> <br>I don't think Filosphia is appropriate really, but it says San Francisco to me, and I'm including it for that reason. <br> <br>The second treatment happened kinda by accident, this was used for the chinese characters on the other concept, but I liked how it looked with Latin glyphs.  But it seems a little thin, and I only have one weight to work with. <br> <br>New Clarendon seems to be working the best.  Says SF, looks conservative and classic. <br> <br>Could try some Sans treatments, but since the Chinese characters are more traditional brushstroke I think a serif is the way to go. <br> <br>Would really love your input/suggestions.  Spent a lot of time on the mark/illustration so the type part has got to happen between now and tomorrow morning :/ <br> <br>Thank a bunch folks. <br> <br>&lt;/font&gt;</p>
  html_clean: <p>&lt;font class="dontLookLikeCrap"&gt;This is for the SF Chinatown Night Market.  They want something that will appeal to corporate sponsors for the event, but still allude to the roots of this event.   <br> <br>There are two concepts, the one I am showing right now focusses more on the Sanf Francisco aspect of the event, not so much the NIGHT-MARKETness of the event (that comes later). <br> <br>I don't think Filosphia is appropriate really, but it says San Francisco to me, and I'm including it for that reason. <br> <br>The second treatment happened kinda by accident, this was used for the chinese characters on the other concept, but I liked how it looked with Latin glyphs.  But it seems a little thin, and I only have one weight to work with. <br> <br>New Clarendon seems to be working the best.  Says SF, looks conservative and classic. <br> <br>Could try some Sans treatments, but since the Chinese characters are more traditional brushstroke I think a serif is the way to go. <br> <br>Would really love your input/suggestions.  Spent a lot of time on the mark/illustration so the type part has got to happen between now and tomorrow morning :/ <br> <br>Thank a bunch folks. <br> <br>&lt;/font&gt;</p>
