  html: <p>Is there a set of rules for the use of AE and OE ligatures in English? I realize that modern English does not use these ligatures, but if I chose to use them, would I substitute them for EVERY occurrence of "ae" and "oe", or would it be selective? <br>e.g. what if the 'o' and the 'e' belong to separate syllables?</p>
