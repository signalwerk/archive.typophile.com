    html: <p>These letter combinations constitute diphthongs, i.e. two vowels pronounced as a single vowel. Their use in modern English is largely limited to words of French origin, but they can now always be replaced by the sequences ae and oe. Conversely, they cannot be used in all contexts that ae and oe occur. Languages with phonetic spelling systems typically treat all combinations of two vowels as diphthongs unless marked otherwise by a diaeresis; English, with its etymological spelling system, does not have this consistency and generally fails to visually distinguish diphthongs.  <br>  <br>Traditionally, the </p>
