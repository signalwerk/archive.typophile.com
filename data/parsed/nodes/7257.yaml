    html: "<p>Dan, great post. <br> <br>Erik Spiekermann pointed out something very insightful during his talk at TypeCon: he gave the example of how \"regular\" German people who weren't really Nazis would do things to gain favor with the regime, like a poster designer putting a little swastika on the tail of an airplane in the background. I guess you could say that sort of thing was -and is- part of \"business\". He also hinted (at least from my perspective) that the same sort of thing happens in the US now, in effect linking American companies -and their employees- with war crimes in a way. Certainly in all walks of life -including here on Typophile- some people are more likely to bootlick the powers that be than others. <br> <br>hhp</p>"
