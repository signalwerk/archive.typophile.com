    html: <p>I just want to make one thing clear here. Some people might counter my last post saying that the swastika is a great universal, historical symbol (which is was), and that I (or others) are only arguing that it should remain in history's dustbin because it remains such a powerful movtivator for things like Zionism, which many people in the world are against. <br> <br>Let's please not get into a discussion about Judaism or the Middle East. Even without the tragedy of the genocide of the Jewish people during the Holocaust, I think that enough evil could be assigned to the swastika to have it left in history's dustbin. At least 6 million Jews died in the Holocaust, but most likely another 5 million people died in concentration camps as well, and all in all, 50 million people died in the second world war, most of them civilians. One could easily argue that the Nazi party was responsible for a great deal of this, and is therefore evil. So, even if we leave Judaism out of the argument, the swastika is still bad. It has too much blood on it. <br> <br>I really like the topics of foundries, industry, and blackletter type. I don't want to start a flame war about religion, the holocaust, racism, or any of that in this thread. If anyone would like to discuss their feelings about Zionism, the Republican party, Islam, or anything else in any of those directions, I'd glady contribute to that discussion, but in another thread.</p>
