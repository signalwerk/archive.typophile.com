    html: "<p>&gt; who banned Fraktur? <br> <br>A very catalytic question. <br> <br>Typophile actually has a SIG devoted to blackletter: <br><a href=\"http://www.typophile.com/forums/messages/4077/4803.html\" target=\"_blank\">http://www.typophile.com/forums/messages/4077/4803.html</a> <br>There you will find some solid history (although it's hard work rummaging through it all), as well as opinions rarely heard elsewhere. <br> <br>To me, the long and the short of it is that: <br>- The Nazis first promoted it as the pure German letter style. <br>- When they realized it was causing legibility issues in occupied countries they banned it, blaming the Jews (of course). <br>- These days however blackletter is struck down as a means of furthering political purposes (in fact as a counter-weapon diametrically opposed to the original Nazi intent of promoting it), essentially by maintaining a negative graphic association with the Nazis in the contemporary mindshare. Steven Heller is perhaps the most prominent example of such sleight of hand. <br> <br>It's time to bring the stately old doberman back into the sunlight. <br> <br>hhp</p>"
    html_clean: "<p>&gt; who banned Fraktur? <br> <br>A very catalytic question. <br> <br>Typophile actually has a SIG devoted to blackletter: <br><a href=\"http://www.typophile.com/forums/messages/4077/4803.html\" target=\"_blank\" class=\"link-lost\">http://www.typophile.com/forums/messages/4077/4803.html</a> <br>There you will find some solid history (although it's hard work rummaging through it all), as well as opinions rarely heard elsewhere. <br> <br>To me, the long and the short of it is that: <br>- The Nazis first promoted it as the pure German letter style. <br>- When they realized it was causing legibility issues in occupied countries they banned it, blaming the Jews (of course). <br>- These days however blackletter is struck down as a means of furthering political purposes (in fact as a counter-weapon diametrically opposed to the original Nazi intent of promoting it), essentially by maintaining a negative graphic association with the Nazis in the contemporary mindshare. Steven Heller is perhaps the most prominent example of such sleight of hand. <br> <br>It's time to bring the stately old doberman back into the sunlight. <br> <br>hhp</p>"
