    html: "<p>Well, at the very beginning punchcutters were recruited from the goldsmithy trade, because they had experience engraving metal. Also, since type involved melting metal, naturally there was a synergy with certain industrial fields. For example, Antwerp was famed for its forged crossbow \"leaf springs\", and later for making rifle parts, and subsequently for type. And come to think of it, this might be related to Caslon, since he started off by engraving rifles, and then came his derivations of Dutch type! <br> <br>Baskerville: <br>His great success in the japanning trade basically financed his typographic efforts. And although there was no <i>material</i> synergy between the two that I can see, some experts on Baskerville point out the \"ideological\" parallels between japanning and Baskerville's style of type. <br> <br>hhp</p>"
