    html: <p>With regard to Linotype, it is important to remember that the identity of Linotype as a specifically German company is a relatively recent development. For most of its history, it was largely an American and British business, which established a continental presence through relations with French and German foundries. I don't know much about the activities of the major German foundries -- Berthold, Stempel, Haas -- during WWII, but I do have the very nice Berthold Hebrew type specimen from 1924.</p>
