  html: <p>I was just reading a handgun publication and inside there was a story about the Browning/Colt 1911 pistol. In this article, the author stated that among other companies, Lanston Monotype had a contract with the US Government to manufacture 1911's during WWII. Apparently their contract was cancelled before they made any.  <br> <br>This got me wondering if type foundries in the past have manufactured products other than type.  <br>Anyone have any information about that?</p>
  html_clean: <p>I was just reading a handgun publication and inside there was a story about the Browning/Colt 1911 pistol. In this article, the author stated that among other companies, Lanston Monotype had a contract with the US Government to manufacture 1911's during WWII. Apparently their contract was cancelled before they made any.  <br> <br>This got me wondering if type foundries in the past have manufactured products other than type.  <br>Anyone have any information about that?</p>
