    html: <p><i>Whenever I'm on my way to NYC, on the NJ turnpike, I pass the 'AGFA' building on the right. And I always wonder what the heck goes on in that building.</i> <br> <br>As far as I know, Agfa only went into the type business with its purchase of Compugraphic in 1988. But since we were talking earlier about the involvement of both the American and English Monotype companies in armament manufacturing during the two world wars, it may be appropriate to note that Agfa was a member of IG Farben conglomerate (and is today owned by Bayer, one of the other members of IG Farben). Among other war crimes for which IG Farben was found culpable were the use of concentration camp labour and production of the Zyklon B pesticide used in the gas chambers in the extermination camps. After the war, several IG Farben officials received prison sentences at the Nurenberg trials, and the conglomerate was broken up into its original constituent companies. Of these, Agfa, BASF and Bayer remain in business.</p>
