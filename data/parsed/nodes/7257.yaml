    html: "<p>The Nazi government banned Fraktur on January 3, 1941. At this point in history, they were winning the war, and were very concerned with their image abroad. In the occupied (and unoccupied) countries, they wanted the people to read German newspapers. Trouble was, no one could read them! They came up with a ridiculous excuse, saying the Schwabacher (the forerunner of the Fraktur style) was invented by the Jews. <br> <br>The letter is quite famous, it was concidently typed up on a sheet who letterhead was stil in Fraktur. Here is a free translation from the original German (I found the German text in Kapr's book &lt;i&gt;Fraktur, For and History&lt;/i&gt;): <br> <br>National Socialist Party of German Workers  <br>Represenative of the Führer  <br>Munich and Obersalzberg,  <br>January 3, 1941 <br> <br>Announcement, not for publication  <br>For general information, I hereby report on the order of the Führer:  <br> <br>The so-called Gothic type style, seen as a symbol of German writing, is false. In actuallity, the so-called Gothic type can be traced to the Schwabacher-Jewish letters. Just like they later occupied the newspapers, the Jews slowly took over the the printing of books and publishing houses in Germany, from these actions stemmed the powerful influence of the Swabacher-Jewish letters. <br> <br>Today, in a discussion with the Reichsleiter, Herr Amann, and Herr Adolf Müller, the Reich printing office owner, the Führer decided that the country's official type style should be Antiqua [serif typefaces]. As soon as possible, printed matter should begin to be made with these typefaces. When it is possibly, school books should also be reprinted, and in town schools and community colleges, this type of writing should be taught exclusively. <br> <br>The authorities responsible will see to it that government agencies shall stop using the Schwabacher-Jewish letters: official certificates, street signs, and other such things will now only be finished in the new official typefaces. <br> <br>Per order of the Führer, Reichsleiter Herr Amann will see to it that all newspapers and magazines, especially those in foreign circulation, or which should be in circulation abroad, switch over to the new official type. <br> <br>signed,  <br>M. Bormann <br> <br> <br>I shouldn't have to say that the grounds for this letter were entirely false, and fabricated! There is no link between Swabacher and Jews. I also doubt that Jews ever controlled the media, or the book industry, in Germany.</p>"
