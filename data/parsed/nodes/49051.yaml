    html: |-
      <p>It's now much stronger. The weak point is still the g. The top part needs to be less lopsided. (And there's some funky overstrike going on right now.)  Maybe an ear, too.</p>
      <p>I'm not entirely sure the difference in the way the curves join n and u, for example, works. I'd rather see the n-join carried over to the u. (I realize you've consistently thinned the lower joins, but I think they look too thin.) </p>
      <p>Also, the second join on the m needs some love, the y is a tad heavy where the tail joins, and the top of the s is too flat.</p>
      <p>Overall, I like where this is going. Keep at it!</p>
