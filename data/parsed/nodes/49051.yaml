    html: <p>The tail of the Q is a bit off center on italic and roman. The g (double storey) on your sketch is better than the first one you've drawn, but not a good one yet. I prefer the one storey so far. I think there is too much curve in it, also the little point on bottom left side of the top of the counterform doesn't help it. I think some oblique line A, M,N and some bowl are too thick especially where the stem meet the oblique. The bowl of the P and the R on the italic version are too little especially the P. The top of the 6 and the tail of the 9 should be like the 2 and 3. Keep going.</p>
