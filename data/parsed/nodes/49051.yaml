      <p>I haven't printed it to judge accurately, but it looks to me like your straight verticals appear stronger than the thicks of your rounds, esp. in lowercase.</p>
      <p>I would consider:<br>
      - rethinking the g completely<br>
      - evening the counters on the a more<br>
      - widening the V<br>
      - narrowing the r<br>
      - altering the curve of the J - looks like it will tip over<br>
      - smoothing the bend in e's tail<br>
      - alternate ways of making the Q's tail</p>
      <p>Though the top of it may be too wide, there's something I really like about the s.</p>
