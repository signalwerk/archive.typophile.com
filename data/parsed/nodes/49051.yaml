    user: 21313
    date: 2009-03-11T14:51:00
    date_raw: 11 Mar 2009 — 2:51pm
    votes: null
    html: |-
      <p>Thanks for the comments speter and sim. I'm reworking the 'g' again adding a tail to it. Update images and pdf's soon to come.</p>
      <p>@speter</p>
      <p>I recognize that the lower joins look too thin to fit the entire font...one thing that I am toying with right now to remedy the situation is trying open-joins on P, B, and R, to make the thin lower joins more acceptable.</p>
      <p>@sim</p>
      <p>I recognize that the 'little point' in the two-story 'g' does not follow the continuity of the other notched points in the font; 'g' has a notched joint at a bowl joining another curved stroke. I would like to keep it because I am looking to create a continuity in the counter forms and g's top counter is close to a's lower counter in proportion and scale. If there is consensus among everyone that looks at that the multiple story 'g' cannot work in this way, then I will abandon it and go with the much simpler 'g'</p>
      <p>Side Note: I thought that the circle + hooked tail 'g' was '3-story' as it has 3 distinct counter forms.</p>
      <p>-Eric MacLeod</p>
