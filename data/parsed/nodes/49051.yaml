    html: |-
      <p>Here is the newest version of Marquam (Please see revised pdf in first post). The new  I have trimmed down some curvy, quirkiness to make the font more serious. </p>
      <p>There are too many changes to showcase individually in images, but I can mention them. Looking back at previous versions of this is kind of embarassing now, but:</p>
      <p> • 'a' has lost the wavy terminal<br>
       • 'g' has balanced counters and a smaller top-story<br>
       • unnecessary notches have been filled in in capitals<br>
       • 'S,s' have more balanced counters<br>
       • '6,9' have terminals closer to the '4', then to '2,3,5'<br>
       • more even outer-curves on 'u,n,h'<br>
       • flat crossbar on 'e' </p>
      <p>I have also added an italic companion. Any feedback on the changes would be greatly appreciated.</p>
      <p>Thanks,<br>
      -Eric MacLeod</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/marquam-2-24-09_5102.gif"></div><p></p>
