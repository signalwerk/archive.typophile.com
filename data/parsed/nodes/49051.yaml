      <p>Here is the latest version of it. I am putting this on my <a class="freelinking external" href="http://typophile.com/node/57755" rel="nofollow">typophile blog</a> instead of continuing this thread. I am working on interpolating weights by hand, since I do not have Fontlab, and therefore do not have the Python nudge-scripts. I am going to make the kerning mostly consistent throughout the family so that blacks appear tighter and lights appear whiter.</p>
