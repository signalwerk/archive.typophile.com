    html: <p>Gerry, <br>&gt;… then again, she talks to her television,… &lt; <br><br>Perhaps speaking to electronic objects is a universal Greek Grandmother thing. (Getting their Yia Yias out&nbsp;:-). <br>My Yiayia had a very large arch-shaped old wooden radio in the 1950s which often behaved badly. It lived prominently in her kitchen—as you know, the kitchen is the central focus of a Yiayia’s house. There was an ethnic radio station which, for 2 hours a day, played Greek music and advertised local Greek merchants (usually restaurants). It didn’t matter much to her if the radio was being problematic the rest of he day. It could hiss and buzz through “Inner Sanctum” or “Jack Benny” but if it made one disagreeable sound during “Grecian Melodies,” my Grandmother would launch into a frenzied list of accusations and a string of Greek curse words which would embarrass my mother. It always ended with, “Ou na hkatheis” and a slap on the radio’s side. The radio, knowing the power its mistresses voice, immediately behaved and played beautifully. This prompted her to say, “En daxy” and so went each night as I remember. <br><br>ChrisL</p>
