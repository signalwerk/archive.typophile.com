    html: <p><i>Photocopied files from library sources don't seem to break any laws </i> <br> <br>It depends on how much you copy and for what use. I think posting something would go beyond "fair use" unless you limited yourself to a small portion. <br> <br><i>so I assume out of print articles are alright as well.</i> <br> <br>As a publisher, I have to object to this notion, which I've seen not infrequently here on Typophile. Out of print does not mean out of copyright.</p>
