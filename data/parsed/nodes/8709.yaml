    html: <p>Hm. Maybe checking out the <a href="http://www.cla.co.uk/licensing/he/he_state.html" target="_blank">Copyright Licencing Agency’s page for <span class="caps">UK</span> <span class="caps">HE</span> Institutions </a> would be better than pronouncing on the hierarchy of ethics over law and the like (ﬁrst return on Google for “copyright licensing <span class="caps">UK</span>”, not too diﬃcult).  <br>Where we read that within a <span class="caps">HEI</span> you can photocopy 5% or an article or a chapter of a publication for study, or to distribute as part of a study pack, e.g. in the case of diatance learners. At the same time, it expressly forbids scanning in. Pretty simple; and could please any pedants inclined to observe that modern photocopiers are in eﬀect scanners reﬂect on the distinction between a single copy whose destination is known, and unlimited, uncontrolled copies.  <br><br>In the way of a postscript I will add that when Typo Papers started going out of print we did look into other distribution models. However, the earlier issues in particular were produced on a traditional workﬂow (paste-ups, ﬁlm, etc.); to resurrect a print job from a legacy pre-press environment and generate <span class="caps">PDF</span>s is, as they say in some areas, non-trivial. So, don’t hold your&nbsp;breath.</p>
