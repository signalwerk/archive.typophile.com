    html: <p>It also depends very much on where you are. In Europe, it seems to be pretty widely legal that you can photocopy an entire book if it is for your own use. In Canada, photocopying even one page for pretty much any purpose seems to be illegal, althought I suspect that this might have relaxed a little in recent years. Shortly after I was at university here, big signs went up around the photocopy machines in the library warning students that they should not copy any material that was still in&nbsp;copyright.</p>
