    html: "<p>Of course I do, Hrant, but remind me why is this relevant? Chris asked for help, and my name was mentioned as someone who could; I clariﬁed whether I can, and in what manner. You could do the same, as long as you keep in mind that the moment you bought a copy of any publication you essentially agree to respect the author’s and publisher’s copyright as determined by whichever legislation applies. Any decisions in the realm of ethics come over and above legal obligations, to further protect the rights holder, rather than open up distribution to third parties. So, even if the law allowed you to photocopy and distribute a TypoPapers article without clearance, the ethical stance would be to seek permission from the originator. But you could never claim an ethical ground for ignoring rights in the name of “freedom of information” or something similarly vacuous. (To be more precise: you could argue that there is a case for reviewing proprietary and patented/registered information in cases where substantial public interest is at stake, as in the case of pharmaceutical companies holding rights to vaccines — but this is an exceptionally complicated point unlikely to be settled by us chatting away&nbsp;here.)</p>"
