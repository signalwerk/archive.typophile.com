    <p>Anyone know where I can get a copy of: "On the Peculiarities of Cyrillic Letterforms" (Typography Papers 1. 1996, Reading University Press), Maxim Zhukov.? <br>I went to the Reading site only to find out that Volume 1 is out of print. Does anyone know if I can get a copy in any form? Text, Xerox, PDF, print?  <br>I am mostly interested in Maxim Zhukov's article (and any other good source for Cyrillic letterforms). <br> <br>ChrisL</p>
