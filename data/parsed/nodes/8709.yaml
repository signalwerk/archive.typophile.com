    html: <p>Hrant, <br>I assume it would be okay to post the page you speak of.  Photocopied files from library sources don't seem to break any laws so I assume out of print articles are alright as well. <br>Thanks also for the link to the previous discussion. Too bad Vladimir Yefimov's primer on designing Cyrillic letters is only available in Russian. Some enterprising publisher might be wise to translate it.  It sounds like a great feature for a typography journal as well. Perhaps "Typo"? Maybe Filip is watching? <br>Thanks again for your always useful sources. <br> <br>ChrisL</p>
