    html: "<p>In response to Steve’s post, one thing I’ve learned in four years of linguistic publishing is that the line between linguistic academia and typography is very frequently thin enough as to go unseen—if it exists at all. <br><br>The key, I think, to success in publishing (or writing in the ﬁrst place) works that deal with certain kinds of typography is to do so with the linguistic and the typography market simultaneously.  There’s a niche genre out there that’s been way under-represented—“manuals” that deal with the broad and ﬁne points of the world’s writing systems (a volume devoted to each, of course).  For example, someone needs to write a book that discusses every aspect of the Thai writing system:  history, writing instruments, cultural aspects, minute characteristics of each character, etc. <br><br>It would sell, and in a few diﬀerent markets at&nbsp;that.</p>"
