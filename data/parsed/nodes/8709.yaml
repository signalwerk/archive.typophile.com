    html: <p>Gerry, <br>Thank you for your clariﬁcation on the copying issue and your insight.  <br><br>It is strange how we have become accustomed to the digital world and <span class="caps">PDF</span>s have become nonchalantly assumed today. I spent nearly 30 years in the world of paste-up, rubylith, and camera created ﬁlms yet now it seems like a century ago. I am spoiled by the immediacy we have today (here we are talking from half way around the world).  I have to return to the sense of value that things had before.   <br>Thanks for having the vision to have produced the Typo Papers material to begin with and thanks for your contributions here on Typophile. <br><br>ChrisL</p>
