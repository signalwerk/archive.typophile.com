    html: |-
      <p>I know this is a bit late, but you're correct, it is Vag Rounded.</p>
      <p>That sarky fellow who suggested you "do a search first" was way off - Wolff Olins designed the distinctive Tate logo, but the font was commissioned by Newlyn: <a href="http://www.newlyn.com/work/client/tate" title="http://www.newlyn.com/work/client/tate">http://www.newlyn.com/work/client/tate</a></p>
      <p>As far as I can see, it's not commercially available, but the suggestions you've had are good alternatives. There are also, it seems, various people who have emulated the font itself, though in my opinion it needs some tweaking.<br>
      For example: <a href="http://fontzone.net/font-details/Tate-Regular/" title="http://fontzone.net/font-details/Tate-Regular/">http://fontzone.net/font-details/Tate-Regular/</a><br>
      though in this one the lower case "t" needs to have its tail removed. </p>
      <p>I hope that's been a bit helpful!</p>
      <p>...and Marten Fischer should take his own advice next time and do a proper search.</p>
    html_clean: |-
