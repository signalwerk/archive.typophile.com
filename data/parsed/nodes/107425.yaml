    <p>So I think this should follow from the title. I looked on Wikipedia and saw it called "Gaelic Type" as well. I am hoping that someone has already made this so I don't have to do it myself! </p>
    <p>It seems like the Hebrew script would be this quite well, not just because it shares the fact that there are no capital letters. Do you know that font that is over all of the Irish pubs across the world? That is what I am thinking (with the option to add in dots or flourishes). </p>
    <p>Something like <img src="http://upload.wikimedia.org/wikipedia/commons/c/c0/Gaelic-text-Duibhlinn.png"></p>
    <p>I'm not referring to the 'sword' typeface used in The Hobbit movie. The closest thing I found was on someone's engraving service. <img src="http://www.cjstones.com/prod_images/lettering/HebrewScript.jpg"></p>
