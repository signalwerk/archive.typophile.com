      <p>I'd like to congratulate you for hanging the double quotes at the start of a line, but you will need to carefully check that it is all done – on 0002 line 7 I spotted one that wasn't, for example. Have you seen your bugs printed using the same process as the rest of the book I suspect they will fill in, they also aren't sitting comfortably in their space. The chapter numbers are too heavy. The decreasing point size will need a careful approach that ultimately might not be worth the effort. I have to agree with Héctor that the font might be too dull.<br>
      Sorry to be mostly negative.<br>
      Tim</p>
