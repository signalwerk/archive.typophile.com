    html: <p>Kevin loose the justified type. Make it all rag right. Its just easier to read and since you have a lot of conversation it lends itself to rag right type anyway. Also it would read better if you could increase the leading by a point. All the text seems to be running into each other. The purpose of the typesetting should be that it isn't noticed, only the content of the work.</p>
