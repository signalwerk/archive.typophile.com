      <p><em>I’d like to congratulate you for hanging the double quotes at the start of a line [...]</em></p>
      <p>slightly pushing the topic sideways, but what's the 'protocol' for hanging quotes? a couple of my tutors were emphatic that all quote marks at the beginning of lines should be hanging, whereas the technicians in the print room were rather dubious and said it looked bloody awful. not to menion the fact that inDesign seems to have no automatic function for turning them on and off?<br>
      I had a look through some of my books and none of them seemed to have hanging quotes...</p>
