    html: |-
      <p>I suppose the best answer to that is to say try it, select a passage that combines speech with non-speech and see what you think. If you are doing your setting using style sheets then instead of creating one that has the indent you have chosen create two one with the standard indent and one with slightly less to compensate for the width of a double quote, if you decide that the hanging doesn't work it is easy enough to edit the style sheet.<br>
      The reason I congratulated the poster is that I find the ragged indent caused by double quotes is distracting when I read. You might decide that you prefer it without. Technicians, if they are like the ones I had at college, often have their views because that is the way they have been doing things since their apprentice days that doesn't necessarily mean they are wrong but it could be that the technology didn't exist (or was more difficult to implement) when the views were formed.<br>
      Tim</p>
