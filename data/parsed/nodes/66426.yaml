      <p>Mårten Thavenius has designed a sans serif family based on the work of Engelhardt (primarily the Gentofte street signs, I believe) which he calls Skilt Gothic and which should be released by Font Bureau some time in the first half of this year.</p>
      <p>You might contact Thavenius via this <a class="freelinking external" href="http://www.fontcaster.com/?p=3" rel="nofollow">contact page</a> to see if he might have already done some work on the house numbers style that you seek.</p>
