      <p>As Ken mentions, my upcoming release is based mostly on the Gentofte street signs and to some extent the design Engelhardt made for the Baltic Exhibition in 1914. Those designs are far from the curly figures in the sample above. </p>
      <p>The street signs Engelhardt made were in a very rough gothic tradition with a lot of local flavor and a strong personal style.</p>
