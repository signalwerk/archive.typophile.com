  html: |-
    <p>Who can design a TrueType font based upon the original font design sheets for the house number font made by Danish industrial designer Knud V. Engelhardt.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/150px-Knud_V_Engelhardt_3941.jpg"></div><p></p>
    <p>I got some photos of the letters a-j, but would like someone to design the rest of the alphabet.</p>
    <p>Interested? Please let me know a est. time and price.</p>
    <p>Thanks for your time.</p>
