    html: |-
      <p>If you intend to keep the same all-caps formatting, I might suggest letterspaced caps in one of the following:</p>
      <p>Adobe Garamond (which I think has special display caps, at least in some versions, and a very nice italic)<br>
      Trajan (famously overused and often misused, but may be appropriate and effective here)<br>
      Perpetua Titling (looks similar to what you have)<br>
      Waters Titling (gorgeous)<br>
      Brioso Pro (for a little more personality)</p>
      <p>Note that at least the first two faces mentioned above come free with InDesign, and maybe other Adobe software, so depending what program you're using, you may have them already.</p>
      <p>Using small caps for the smaller text underneath the name, with oldstyle figures, will add a classier look. It looks like you may already have true small caps, but the osf will help. Letterspace everything more than feels necessary: for the name, you might start with 200 "units" (1000/em) = 20%.</p>
      <p>Also, I sometimes find that using large small caps can be better than full caps in this kind of situation, as they're wider and seem to have a stronger stance. (I would use the small caps from the next optical size up, ideally.)</p>
      <p>I hope this helps. </p>
      <p>Josh</p>
