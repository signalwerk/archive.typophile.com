    <p>Dear Sir or Madam,</p>
    <p>I recently joined a polo club, and we have decided to create business cards which we can handout during events. Since appearance plays a large role at such events I really want to put some effort into creating great looking business cards. Currently I am considering using some decadent colored paper. I have also looked into using <a class="freelinking external" href="http://www.drukkerijdouma.nl/diensten/foliedruk/" rel="nofollow">gold</a> or <a class="freelinking external" href="http://www.packvision.nl/NL/Folies/Parelmoer_Folies/" rel="nofollow">pearl</a> lettering. To top it off i might want to use <a class="freelinking external" href="http://creativebits.org/files/126895462_d86b4b5425.jpg" rel="nofollow">gold edging</a>, not sure about that though.</p>
    <p>Since this seems to be the place where typophiles hang around I am open for suggestions on fonts. Can anyone recommend some free fonts which would create a classier look? I browsed the forums and saw some very nice fonts, such as the Diamond font from <a href="http://www.orangeitalic.com/" title="http://www.orangeitalic.com/">http://www.orangeitalic.com/</a> but 299$ is too exotic for me!</p>
    <p>Here is what I created so far:<br>
    (still has the bleed margins or something)<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/polocard_mini_3883.jpg"></div><p></p>
