  html: "<p>Hi there! I am not sure if I am in the right place, and if not, I apologize in advance. Its kind of an ID question, but the thing is, I am not even sure a typeface exists. I am looking for a typeface that looks like it was carved into a tree — as young lovers might do: “Robert [hearts] Betsy,” etc, … If you can help, that would be fantastic. Thanks so much!</p>"
