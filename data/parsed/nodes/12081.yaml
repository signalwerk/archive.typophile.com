    html: <p>Bethany, I would suggest not so much a font but a technique. Open Photoshop type some simple text or use a symbol (like a heart) and apply layer effects to create a cutout effect. Make the layer opacity 0% and you will have the layer effect with no fill. Find a tree image and apply.</p>
