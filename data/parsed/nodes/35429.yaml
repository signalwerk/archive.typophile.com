    <p>Hi, how are you all today?</p>
    <p>Yesterday a friend of mine sent me a sample that he's trying to ID, but couldn't. I took a look and wasn't able to come up with anything off the top of my head, nor with my limited type books. So I go to the place I always go with these questions...</p>
    <p>Does anyone have any idea what typeface is used for the outline/shadow numbers in this type sample?<br>
    Thanks in advance!</p>
