    html: |-
      <p>From some Google searches, it seems this book was from 1872, and was published by A. S. Barnes, which seems to have been an American publisher (may still be). If that is the case, this should surely be a metal or wood type, and finding it as a font is unlikely. Since my best book on American Metal Type is for the Twentieth Century (McGrew), it is also unlikely to find it there -- I tried, and didn't see it.</p>
      <p>- Mike Yanega</p>
