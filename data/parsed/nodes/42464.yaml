    html: |-
      <p>First list: delete Clarendon (of no importance whatever) and add: Sabon, Galliard, and Janson. The first two kicked off the typhoon of new tyefaces in our era--more instant classics since 1970 than in the entire history of movable type until then. And Janson has been a consistent winner in book design, if nowhere else.</p>
      <p>Your distinction between classic and contemporary is somewhat pointless: a first-rate new face aims to become a timeless classic, as Sabon and Galliard certainly have.</p>
      <p>And don't forget to give credit to the foundry ITC, which since the late sixties revived interest in typography as a living growing creative medium open to newcomers, well before digital and Postscript. Adobe moved into a field fertilized and sown by ITC.</p>
