  - id: 261478
    user: 14529
    date: 2008-02-25T12:53:00
    date_raw: 25 Feb 2008 — 12:53pm
    votes: null
    html: "<p>ITC did two things wrong: they did bastardize Garamond with a version with really bad proportions and too much x-height, though the condensed form worked nicely. And they wasted their time on a series of text faces actually designed for advertising instead of editorial use, like Berkeley Oldstyle, where the first weight is too light for editorial text and the next weight up is too heavy. Yet we all learned from these mistakes. Denying the importance of ITC in type history is like denying the importance of George Balanchine in ballet.</p>"
