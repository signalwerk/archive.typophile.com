      <p>I think it only natural to add either Avenir or Gotham (both may be repetitive) to the contemporary list. Then again, Frutiger (the man, myth, legend) could own that list with Univers as well, which I think, needs to be there. I was under the impression that Frutiger (the typeface) was very influential as well. Akzidenz may belong somewhere, and DIN is big too, but I've only been a professional designer for two years, so maybe I don't know fad from movement yet. Consider my suggestions as something for consideration.</p>
      <p>I second Caledonia from Robert. Dwiggins Represent!</p>
