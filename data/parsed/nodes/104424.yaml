      <p>An extremely popular font of the design that matches your sample was sold under the name Devinne in the late 19th and early 20th centuries. When it declined in popularity the foundries used the name for another design, as shown in your links. Because of copyright/trademark issues the original Devinne font has to be sold under other names. Here is one: <a href="//www.myfonts.com/fonts/woodentypefonts/de-vinne/">De Vinne</a> by Wooden Type Fonts.<br>
      Don</p>
