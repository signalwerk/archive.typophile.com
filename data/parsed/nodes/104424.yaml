    <p>Hello</p>
    <p>I am looking to find out more about the serif font used in BLAST 1, the famous British Vorticist publication. THe sample attached is of the serif face in question, the rest of the publication primarily uses a heavy Grot. </p>
    <p>If you don't know it already, well worth a look at some truly avant-garde typography considering the context. <a href="http://dl.lib.brown.edu/mjp/render.php?view=mjp_object&amp;id=1143209523824844">http://dl.lib.brown.edu/mjp/render.php?view=mjp_object&amp;id=1143209523824844</a></p>
    <p><img src="/sites/default/files/old-images/BLAST_1143210659593763_6473.gif"></p>
    <p>thanks as always for any time and assistance.</p>
    <p>M</p>
