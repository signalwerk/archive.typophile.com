      <p>The Bitstream Romana is related, and on MyFonts they give the following description:</p>
      <blockquote><p>The French interest in the revival of suitably edited Oldstyle romans as an alternative to a world of Modern typefaces started in 1846 when Louis Perrin cut the Lyons capitals.</p>
      <p>About 1860, as Phemister was cutting the Miller &amp; Richard Old Style in Edinburgh, Theophile Beaudoire turned the idea of the Lyons capitals into a complete Oldstyle typeface, with similar overwhelming success; it was generally known as Elzevir in France and Roemisch, Romanisch, Romaans or Romana in Germany, Holland and Switzerland.</p>
      <p>In 1892, Gustav Schroeder, at the Central Division of ATF, expanded the series, adding a boldface under the name DeVinne. It was promptly copied, initially in Europe by Ludwig &amp; Mayer, and spread rapidly throughout the US and Europe, becoming the best known member of the series. ATF made popular an ornamental form under the name De Vinne Ornamental.</p></blockquote>
    html_clean: |-
