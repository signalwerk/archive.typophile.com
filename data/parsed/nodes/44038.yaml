    <p>A bit of last minute news, but the annual WAD Lecture at the BPL in Boston is happening tomorrow and it shouldn't be missed. </p>
    <p>The 34th Annual William A. Dwiggins Lecture<br>
    Wednesday, April 9, 2008, 6:00 pm<br>
    RABB Lecture Hall, Boston Public Library<br>
    Copley Square, 700 Boylston Street, Boston</p>
    <p>Free Admission</p>
    <p>Presented by The Society of Printers and<br>
    Trustees of the Boston Public Library.</p>
