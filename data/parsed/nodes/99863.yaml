      <p><cite>Lately I've been reading a lot of articles on kerning and I've been reading a lot about <strong>type designers</strong> and their meticulous ways.</cite></p>
      <p>By the way, if you go back to the Dark Ages -- before, say, 1992, programmatic kerning was done by compositors. For years, Linotype gave as one of their reasons for sticking with the 18-unit em for kerning &amp; I believe tracking values was their customers wouldn't want to change their kerning programs. Their customers, of course, were all typesetting shops. As if we couldn't multiply by 3... (Yup, the new em was a 54-unit em. Don't remember the year - late 1970s? -- Nick Shinn would probably know.)</p>
      <p>To this day, except for Matthew Carter's fonts, if a font's primary use in our shop  is to be for setting text, the first thing I do is throw out the foundry kerning. Matthew's kerning is almost always to my taste, just not quite extensive enough, esp. with punctuation.</p>
      <p>There is a point to this nostalgia. There is pretty much no way a type designer can get all the needed kerning, and absolutely no way they can accommodate all legitimate differences of taste on "proper" kerning. Don't blame them if things aren't to your taste. </p>
      <p>Typesetters are not people who only know what the "place" command is, and can fill out paragraph styles. They have other responsibilities. In the end, proper kerning is the user's job.</p>
