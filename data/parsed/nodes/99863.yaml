      <p>In Minion, "Yp" is kerned but "Yq" (which needs it more) isn't. They're about equally [in]frequent: Ypres and Yqem (AFAIK the most frequent words exhibiting those pairs) are both relatively obscure Western European localities. The former is losing relevance as WWI history becomes more boring; the latter is gaining relevance as wine becomes more interesting. My Mana series of <em>bitmap</em> fonts has both those kerned. I average ~8 kerns per glyph, all hand-made - no kerning classes (most recently for a reputable medium-sized foundry that paid me handsomely). Caveat: I have yet to deal with very large charsets.</p>
      <p>What makes you think I consider Adobe fonts the ne plus ultra of spacing (or anything else)? But they're still <em>so</em> much better than 99% of the open/free/libre stuff. Because somebody paid somebody good money. AND Adobe allows modification, so precious to you and me.</p>
      <p>BUT, all that said: You want perfection? You gotta leave this solar system. We don't do perfection 'round these parts.</p>
      <blockquote><p>Why I throw out kerning. To many surprises</p></blockquote>
      <p>You want to reduce surprises? Throw out technology.</p>
      <p>hhp</p>
