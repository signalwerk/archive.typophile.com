    <p>Hello all,</p>
    <p>Lately I've been reading a lot of articles on kerning and I've been reading a lot about type designers and their meticulous ways.</p>
    <p>I was wondering,<br>
    If these are the same (type of ) anal people who come up with the built in kerning info / pairs, why do we still need manual kerning?</p>
    <p>Is this mainly personal taste?</p>
