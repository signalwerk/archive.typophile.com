      <p>With Adobe Jenson, set an f, a space, a quotedblleft, and something else -- say a lower-case l.</p>
      <p>Let us know how you like it -- hint: it's the visually transposed wordspace.</p>
      <p>Why I throw out kerning. To many surprises that can ruin your day if you discover them when first proof is due in three more days...</p>
