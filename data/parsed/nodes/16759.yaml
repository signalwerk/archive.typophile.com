      <p>Alexander, do hire a graphic designer, but since they usually know little about the intricacies of type, tell him to: see/use this thread; and to seriously consider what I think will work really well for you: AF-Generation by Dirk Wachowiak. It goes from round to sharp and light to dark and IIRC narrow to wide - so you can choose exactly what you need, and maybe even mix them depending on things like size, background etc. It's really a uniquely versatile design.</p>
      <p><a href="https://web.archive.org/web/20150123175210/http://www.fontfactory.com/search.php?search=1&amp;mode=0&amp;search_text=generation&amp;x=0&amp;y=0" title="http://www.fontfactory.com/search.php?search=1&amp;mode=0&amp;search_text=generation&amp;x=0&amp;y=0">http://www.fontfactory.com/search.php?search=1&amp;mode=0&amp;search_text=genera...</a></p>
      <p><a href="https://web.archive.org/web/20150123175210/http://www.acmefonts.net/" title="http://www.acmefonts.net/">http://www.acmefonts.net/</a></p>
      <p>BTW, that new Gugi doesn't look "Modern" at all... and that's a compliment!</p>
      <p>hhp</p>
