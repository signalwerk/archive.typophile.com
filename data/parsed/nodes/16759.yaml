      <p>Among sans faces, <a href="https://web.archive.org/web/20150123175210/http://houseindustries.com/index.php?page=showfont&amp;id=24&amp;subpage=viewfonts" rel="nofollow">Simian</a> is in the same sort of space as Section, and very stylish. The display versions are a bit weird, but the text versions might work for you.</p>
      <p>More self-conscious but very well done is <a href="https://web.archive.org/web/20150123175210/http://emigre.com/EF.php?fid=84" rel="nofollow">Cholla</a>, which I saw used here in Washington DC at the Hirschhorn Gallery. Also a bit along the self-conscious line, but which I like better is <a href="https://web.archive.org/web/20150123175210/http://fontbureau.com/fonts/Amplitude" rel="nofollow">Amplitude</a>, which, like Simian is by Christian Schwartz.    </p>
      <p>Jeremy Tankard's <a href="https://web.archive.org/web/20150123175210/http://www.typography.net/type/aspect.htm" rel="nofollow">Aspect</a> is both both architectural and avant-garde.</p>
      <p>If you like stuff that is somehow both modern and Baroque you will go nuts over <a href="https://web.archive.org/web/20150123175210/http://www.stormtype.com/" rel="nofollow">Storm's faces</a></p>
