      <p>Similar to Propane is Infinity by Thirstype, but I think Apex Sans would be a much better choice, especially for what is probably a long proposal. It's more "professional" than Infinity, but still has the contemporary feel I think you want. It is possible that I see Apex Sans as architecty due to it's use by thirst in a series of posters for IIT's series of lectures on architecture. I stole (uh, aquisitioned?) one of them and hung it over my desk so I could gaze at it. So my vote is for Apex Sans.</p>
      <p><a href="https://web.archive.org/web/20150123175210/http://www.idonline.com/adr01/iit.asp" rel="nofollow">small examples</a><br>
      <a href="https://web.archive.org/web/20150123175210/http://www.underconsideration.com/speakup/interviews/images/iit_poster.gif" rel="nofollow">another one</a></p>
      <p>Isn't it funny how we use ambiguous words like professional and contemporary and expect that we know what the other means? Because I don't even know what I mean by them.</p>
    html_clean: |-
