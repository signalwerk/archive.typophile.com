      <p>I'm afraid I can't offer much help on the AFDKO front. I suspect the first error message is because Adobe's own practice is to limit encodings to one per glyph, and their tool enforces this. As you say, there are easy ways around this, such as copying the cmap table from a font that hasn't been through the AFDKO tool.</p>
      <p>With regard to VOLT, it is possible to export VOLT formatted OpenType feature data from FontLab, but I don't think it is very reliable. I do all my OTL work in VOLT, so have never had occasion to test this very thoroughly.</p>
    html_clean: |-
