      <p>Boy, this stuff has me feeling thick once again!</p>
      <p>I'm working with an existing font just for learning purposes. When using makeotf from the AFDKO I'm getting two errors.</p>
      <p><code>makeotf [Warning]  Source TTF font contains multiple Unicode values ['060C'] for glyph uni060C. Only the first will be used.</code></p>
      <p>and</p>
      <p><code>makeotf [Error] For TTF fonts, the Glyph Order And AliasDB file must preserve the original font glyph order, and use the same names as are derived by the 'tx' tool. GlyphOrderAndAliasDB.</code></p>
      <p>The first seems to indicate that one can't have glyphs with more than one Unicode code point. Which seems odd, though something I know that can be easilly rectified.</p>
      <p>The 2nd error is a little more perplexing for me. I've written a Python script in FontLab that dumps out all the glyph names in a similar fasion to the example GlyphOrderAndAliasDB file that comes with the AFDKO. Does this error mean that its in the correct order as compared to the TTF file I generated from FontLab? Is there anything that will do this out of fontLab? I didn't see anything in the multitude of files that come with the AFDKO that seemed to do so. I'm in the process of looking at the tx tool.</p>
      <p>In regard to VOLT; I exported the vlt file from FontLab but is there a way to transfer the OT features I already have in FontLab for VOLT so they can be expanded upon?</p>
      <p>Thanks again,<br>
      Ken</p>
