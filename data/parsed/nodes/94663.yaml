    html: |-
      <p>You can use the Adobe Font Development Kit for OpenType (<a href="http://www.adobe.com/devnet/opentype/afdko.html">AFDKO 2.0</a>). The syntax is basically the same as that used in FontLab, but it can compile GPOS mark positioning features. So you can save your OpenType feature code from FontLab as a .fea file and then use this as the basis of a larger AFDKO feature file including the GPOS.</p>
      <p>Alternatively, if you want a tool with a visual interface, you could rebuild your OTL features in <a href="http://www.microsoft.com/typography/volt.mspx">VOLT</a>. I've documented my <a href="http://www.tiro.com/John/FontLab-to-VOLTworkflow.pdf">FontLab-to-VOLT workflow</a>, which might help your decision making.</p>
    html_clean: |-
