    <p>I'm trying to learn about mark and mkmk (and am COMPLETELY clueless) and opened a newer version of Times New Roman from a new Windows 7 machine that seemed to be using it.</p>
    <p>The mark feature comes in with code that looks like it could be correct but all the lines within the lookups are commented.</p>
    <p>The beginning of the feature looks like this:<br><code>feature mark { # Mark Positioning<br>
     # Latin<br>
    lookup mark5 {<br>
    #    mark hookabovecomb -280 1410;<br>
    #    mark tildecomb -455 1440;<br>
    #    mark gravecomb -280 1460;<br>
    #    mark acutecomb -280 1460;<br>
    #    mark uni0302 -15 1010;<br>
    #    mark uni0304 -15 1180;<br>
    #    mark uni0305 -15 1430;<br>
    #    mark uni0306 0 1040;<br>
    #    mark uni0307 -15 1080;<br>
    #    mark uni0308 15 1080;<br>
    #    mark uni030A 15 1040;<br>
    #    mark uni030B -50 1000;<br>
    #    mark uni030C 0 1010;<br>
    #    mark uni030D 0 1050;<br>
    #    mark uni030E 0 1050;<br>
    #    mark uni030F 60 1000;</code></p>
    <p>If I un-comment the lines I get a syntax error trying to compile at the very first "mark" line.</p>
    <p>Does FontLab even support mark and mkmk?</p>
    <p>Thanks for the help,<br>
    Ken</p>
