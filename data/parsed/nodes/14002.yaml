    html: |-
      <p>Most foundries have a submission process. I'd find a foundry that seems to fit with your work and create a list of foundries you want to solicit. They usual have a submission process they want you to follow. Some are okay reviewing semi-completed work, others want final fonts.</p>
      <p>Starting your own retail operation takes a lot more work, and involves order fulfillment and tech support for your fonts that lots of designers avoid by going through a foundry.</p>
