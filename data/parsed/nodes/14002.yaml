    html: |-
      <p>hey man - they are all on typecon! ;-)</p>
      <p>I can say, all my marketing is made through my web site. But if you understand marketing in a wider range, its goes beyond physical (visual) things. Its good to have some friends and colleagues in the scene. They can make a note on the right spot, a review or just use your work. But all this needs time and passion. You have to be present on some point and the things will happen. Maybe not the fastest way.</p>
      <p>Classic ads for type faces I have seen last in magazines from the late 50ths. In a time type faces costs real money. Will it work today? Maybe, if you have the new Futura it could be worth. </p>
      <p>Today many small foundrys made their own stuff - books, magazines, posters and the little goodies. Don't know if this realy helps selling the fonts, but it spreads the word and its worth a news. - So hopefully they get their adverts in a form of an nice article for "free".</p>
      <p>I expect to see more and more cooperations of independent designers like The Village (<a href="http://www.vllg.com" title="www.vllg.com">www.vllg.com</a>) in the near future, so they can bundle their strengthens.</p>
      <p>--<a href="http://www.astype.de" target="_blank" rel="nofollow">astype.de</a>--</p>
