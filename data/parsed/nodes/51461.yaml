  html: <p>Reading the Sci Lit on "Crowding" is tough but exciting too. I have much more to read and I need to re-read to be sure I have it but this does stuff seem promising to me despite some seemingly ( typographically ) naive choices made in some of the experiment designs. More on this later...</p>
