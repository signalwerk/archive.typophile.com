  html: "<p>hey, <br> <br>I recently bought an apple! (yay!). But the following problem: I bought some fonts on my pc but I don't know how to get them to work in os x. The fonts have the extensions .afm .pfm .pfb. I'm aware that there isn't an adobe type manager for os x. unfortunately <img src=\"http://www.typophile.com/forums/clipart/sad.gif\" alt=\":-(\" border=\"0\">. anyone got a suggestion? <br> <br>thanks in advance</p>"
