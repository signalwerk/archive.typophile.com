    html: <p>Try <a href="http://www.asy.com/scrcf.htm" target="_blank"> CrossFont</a>. Every now &amp; again I have to use a font on a Mac (I'm a die-hard PC user - mostly because I'll die with hardly any money) and CrossFont usually does a good job of making them usable on a Mac platform.  <br> <br>IIRC, the trial version is fully functional except that it doesn't do batch conversions. If you have a bunch of fonts, it might be worth the $45 for the license. <br> <br>Hope that works for you.</p>
