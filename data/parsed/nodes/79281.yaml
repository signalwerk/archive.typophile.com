    html: |-
      <p>@eliason Thank you for those links.  They are helpful.<br>
      I did find a few of them before posting as well but had not thought to post them for reference.<br>
      I wasn't able to find any recent threads and only a few posts really broke it down in the form I was looking for.</p>
      <p>as a jumping point this is a combination of what I have been using as well as multiple categories I have added from my research the last few days.</p>
      <p>-Serif<br>
      -Sans Serif<br>
      -Script<br>
      -Slab Serif<br>
      -Condensed Serif<br>
      -Condensed Sans Serif<br>
      -Small Caps<br>
      -Wood Type<br>
      -Black Letter<br>
      -Ornament<br>
      -Angular<br>
      -Numbers<br>
      -Distressed<br>
      -Deco<br>
      -Retro<br>
      -Handwriting<br>
      -Sign Painter<br>
      -Headline Serif<br>
      -Headline Sans Serif<br>
      -Body Serif<br>
      -Body Sans Serif<br>
      -Generic Logo Fonts</p>
      <p>Its a lot of classifications but they become quite useful for me, I am a freelance designer and jump around from packaging to branding to publishing and these categories allow me to quickly grab what I need.  These are built from necessity and experience but I am always open to others thoughts and critiques.</p>
