    <p>I am in the process of cleaning up my fontcase library and I am starting off this time by taking better care to define each font into a collection.  I have my basic classifications listed already; serif, sans serif, blackletter, script etc etc...</p>
    <p>What I am looking for is good deeper classifications others may be using.<br>
    Some other Categories I have are Condensed Serif, Condensed Sans Serif and Wood Type</p>
    <p>I know these may differ depending on the persons library and preference but I was curious to see how others are breaking their libraries down and hope to get some good ideas in the mean time.</p>
