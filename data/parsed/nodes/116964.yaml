      <p>Yes this is derived from Engravers Old English </p><div class="imageWrap"><img src="http://typophile.com/files/EngraversOldEnglishInUse_4687.jpg"></div><br>
      <a href="http://www.myfonts.com/fonts/mti/engravers-old-english-mt/" title="http://www.myfonts.com/fonts/mti/engravers-old-english-mt/">http://www.myfonts.com/fonts/mti/engravers-old-english-mt/</a><br>
      <a href="http://www.myfonts.com/fonts/tilde/engrvrs-old-eng/" title="http://www.myfonts.com/fonts/tilde/engrvrs-old-eng/">http://www.myfonts.com/fonts/tilde/engrvrs-old-eng/</a><br>
      I checked the home page of your supply store and find that _BORN~X~RAISED_ is a logo for a casual clothing company -- in the Los Angeles streetwear style -- and that it also uses similar letters for various slogans on its products. Presumably the company's designer simplified the Engravers Old English alphabet for it's product line, or used a existing simplified alphabet. Other companies, such as Nike have done the same thing with blackletter alphabets. AFAIK nothing digital is available for purchase by the public.<br>
      There are various other attempts to simplify the design including a typewriter typeface for the IBM Selectric designed in the 1970s<br>
      <div class="imageWrap"><img src="http://typophile.com/files/OldeWorldIBMSelectricTypeballIBM_3906.jpg"></div><br>
      which has some similarity to the letters.<br>
      Don<p></p>
