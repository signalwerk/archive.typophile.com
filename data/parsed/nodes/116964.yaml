      <p>I knew I had seen the _BORN~X~RAISED_ letters before.<br>
      The letters are very similar to iron on lettering from a craft store, Hobby Lobby which are made by "Joy - Letter Shop.  See <a href="http://shop.hobbylobby.com/crafts-hobbies-and-fabric-crafts/iron-on-letters-and-numbers/?brand=Joy&amp;dimensions=2%22" title="http://shop.hobbylobby.com/crafts-hobbies-and-fabric-crafts/iron-on-letters-and-numbers/?brand=Joy&amp;dimensions=2%22">http://shop.hobbylobby.com/crafts-hobbies-and-fabric-crafts/iron-on-lett...</a><br>
      So if you want a name for this font you could call it Joy Old English.<br>
      Don</p>
