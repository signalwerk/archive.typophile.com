    html: <p>You are correct Mark. All the text on my original design was hand-lettered. Unfortunately some time after I did it changes were requested and (apparently) the agency had lost track of who had done the original (me!), so the hack job that is used now was created, I'm—assuming done in-house. The script of the word "Greatest" is done so poorly that it's beyond me why Artslons would want to replicate it.</p><div class="imageWrap"><img src="http://typophile.com/files/Fuddruckers_3671.gif"></div><p></p>
