  html: <p>I'm working on a sans serif design, not quite mono-lineal, some humanist   <br>structure but no humanist modulation, and I find myself constantly   <br>questioning if I have drawn my shapes correctly. When setting sample   <br>words, some parts of strokes appear thicker and some thinner. Parts   <br>that would normally be made thinner by the shape of the pen, the upper   <br>left and lower right of the 'o', right stroke of 'v', appear thick. Where I   <br>might expect a thickening of the stroke, lower left and upper right of   <br>the 'o', left stroke of the 'v', I see instead a thinning.   <br>   <br>Am I mad or is this a common experience? I imagine that my mind   <br>'expects' the normal pen based modulation that I've been accustomed   <br>to working with in my past few projects and is reacting against the   <br>mono-linearity of this new design. I'm finding it very distracting   <br>and I don't know what to do about it except to keep measuring all   <br>my strokes to confirm that they are in fact the same width.   <br>   <br>Ideas? Similar experiences?</p>
  html_clean: <p>I'm working on a sans serif design, not quite mono-lineal, some humanist   <br>structure but no humanist modulation, and I find myself constantly   <br>questioning if I have drawn my shapes correctly. When setting sample   <br>words, some parts of strokes appear thicker and some thinner. Parts   <br>that would normally be made thinner by the shape of the pen, the upper   <br>left and lower right of the 'o', right stroke of 'v', appear thick. Where I   <br>might expect a thickening of the stroke, lower left and upper right of   <br>the 'o', left stroke of the 'v', I see instead a thinning.   <br>   <br>Am I mad or is this a common experience? I imagine that my mind   <br>'expects' the normal pen based modulation that I've been accustomed   <br>to working with in my past few projects and is reacting against the   <br>mono-linearity of this new design. I'm finding it very distracting   <br>and I don't know what to do about it except to keep measuring all   <br>my strokes to confirm that they are in fact the same width.   <br>   <br>Ideas? Similar experiences?</p>
