    html: <p>You're not mad and this is quite common. I find that even the slightest 'correction' for this, i.e. the slightest modulation, will compensate to produce the appearance of an unmodulated stroke. The likeliest explanation for the phenomenon (and ghost modulation is quite a good term for it) is that we are so accustomed to the 'normative' forms of our letters being modulated, and in a particular way, that our minds reject the absence of modulation and see, instead, a reverse modulation. The effect is most obvious in letters with 'mirrored' forms, e.g. <i>A O V o v;</i> in Tiffany's illustration above the effect is much less troubling in the <i>d.</i> I suppose if one was exposed only to totally unmodulated letterforms for an extended period of time, one would eventually be 'cured' of this phenomenon, but how likely is that? It is sensible to introduce very minor modulation to counter the perception.</p>
