    html: <p>&gt; Are you designing on screen? <br> <br>Yes <br> <br>&gt; If so, do printed letterforms have the same issue? <br> <br>Not that I've noticed, so if so, it's not as strong. I'll give it a <br>look when I get home. <br> <br>&gt; In your sample, the only one that looks off is the v. <br>&gt; If anything the thick should be on the left. <br> <br>I first noticed the effect with the v; it seems strongest there.  <br>According to my theory, the left stroke should appear thin. <br>After repeatedly seeing 'v' with conventional modulation, <br>thick on the left, thin on the right, by comparison a mono- <br>lineal v will seem <i>too thin</i> on the left and <i>too <br>thick</i> on the right compared to what your brain has <br>become used to. <br> <br>When I resumed work on this design last night, after <br>reading around 50 pages of Adobe Garamond, the effect <br>was very evident. Looking at it today, it's not quite as clear <br>in the round characters, still somewhat visible in the v. <br>Maybe that's the lesson, don't try to be original after <br>extended reading or your gut feeling will tell you to make <br>your design look like the typeface you've just been <br>immersed in.</p>
