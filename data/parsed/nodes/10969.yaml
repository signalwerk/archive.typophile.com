    html: <p>&gt; I think that's part of it (especially for a type designer), but <br>&gt; there are [probably] optical issues as well <br> <br>I think it's fair to call this an optical issue, not just a matter <br>of familiarity. It's likely similar to color fatigue, where the <br>world looks blue after you've spent a couple minutes <br>wearing yellow sunglasses. But I also think that since we <br>spend so much more time reading modulated text than we <br>do wearing colored sunglasses, the effect is more <br>permanent. <br> <br>&gt; I find that even the slightest 'correction' for this, i.e. the <br>&gt; slightest modulation, will compensate to produce the <br>&gt; appearance of an unmodulated stroke. <br> <br>And it seems you're not alone. Myriad compensates for this <br>effect in both the o and v. Adobe's Frutiger compensates <br>only in the v, but does so quite dramatically. Agfa/ <br>Monotype Gill Sans compensates in o and v. Linotype <br>Helvetica Neue compensates only in v. Neufville Futura has <br>no compensation at all. <br> <br>So it appears that I should add some optical compensation <br>to my design. Seems to be standard best practice today for <br>the most common digital sans fonts.</p>
