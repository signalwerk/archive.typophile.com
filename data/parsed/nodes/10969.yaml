    html: <p>When I was reading Smeijers's "Couterpunch", in the chapter about adding something to the lc "j" to make it sit on the baseline*, my mind started thinking about "reform", and it immediately hit me that the Latin lc "a" is facing the "wrong" way! I  now realize that it's not so simple, but the power of suggestion is indeed powerful. <br> <br>* BTW, I don't know if he realizes it, but that sort of thing is totally contrary to his otherwise highly conservative approach to type design! <br> <br>&gt; we are so accustomed to the 'normative' forms of our letters being modulated <br> <br>I think that's part of it (especially for a type designer), but there are [probably] optical issues as well - just like a perfect circle/square *appears* imperfect. <br> <br>hhp <br></p>
