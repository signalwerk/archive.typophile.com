    html: <p>Hi Aaron. You're definitly mad. So am I :-) <br> <br>Are you designing on screen? If so, do printed letterforms have the same issue? The trouble I've had designing onscreen is by the time you zoom out to get a sense of the whole letter (or even a word) the anti-aliasing starts messing with my mind as you've described. While I still design on screen, there is an element of trust in your measurements untill you pull a print.. <br> <br>In your sample, the only one that looks off is the v. If anything the thick should be on the left.  <br> <br>Good luck. <br>Randy</p>
