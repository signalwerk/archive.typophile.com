    html: <p>How do you manage to sell them so cheap?</p>
    html_clean: <p>How do you manage to sell them so cheap?</p>
  - id: 414050
    user: 27336
    date: 2010-06-02T09:20:00
    date_raw: 2 Jun 2010 — 9:20am
    votes: null
    html: |-
      <p>Well, all of the fonts (except my own designs) are free fonts to begin with - the original, basic versions are available from all the usual freefont sites. So I cannot really charge too much for my reworked, multilingual Pro versions. ;)</p>
      <p>But the main reason is that the whole idea of CheapProFonts is to reach users in regions where the economics is not strong enough to purchase other commercially available fonts that contain all the needed characters - like Eastern Europe and South America.</p>
      <p>So I have set the price level as low as I can - without actually losing money on the project. It is a hobby, that also happens to create a little pocketmoney for myself and the designers I work with.</p>
      <p>More on the history of CheapProFonts here:<br>
      <a href="http://www.cheapprofonts.com/About.php" title="http://www.cheapprofonts.com/About.php">http://www.cheapprofonts.com/About.php</a><br>
      :)</p>
