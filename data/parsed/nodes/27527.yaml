    <p>Hi Folks,</p>
    <p>I am happy to report that I have a Lettering class starting up soon. We did this last year and it was <em>fun</em>! </p>
    <p><strong>GRPH 151 Lettering and Type</strong><br>
    Wednesdays: 1:00–5:00pm<br>
    CCSF Ocean Campus: 50 Phelan Ave., Health Center 207<br>
    8-week course: August 16–October 4<br>
    CRN 76937 </p>
    <p>Here is a <a href="http://www.ccsf.edu/Departments/Graphic_Communications/Gallery/Student/Lettering_Type/Lettering_Type.htm" target="_blank" rel="nofollow">gallery</a> of last year's student work, and here is the <a href="http://www.ccsf.edu/Catalog/Art/grphcors.html#GRPH%20151" target="_blank" rel="nofollow">catalog entry</a> for a formal description (ignore the pre-requisite).</p>
    <p>All that entry requires is enrolling at <a href="http://www.ccsf.edu/Offices/Matriculation/step1.htm" target="_blank" rel="nofollow">City College</a>. Everything else we can take care of on the first day of class.</p>
    <p>BTW, it's a one-unit class, making it a whopping <strong>$26</strong>!</p>
    <p>Feel free to email me with questions,</p>
    <p>Amy Conger<br>
    <a href="mailto:aconger@ccsf.edu">aconger@ccsf.edu</a><br>
      <a href="http://fog.ccsf.cc.ca.us/~aconger/" rel="nofollow">ccsf.edu</a>: my academic web site<br>
    <a href="http://www.abecedarienne.com" rel="nofollow">abecedarienne.com</a>: my fonts and art web site</p>
