      <p>Hm. Important exchange.</p>
      <p>The balance is that there's loss of OSIX support even on Motorola machines, patched up search, another step towards less clumsy networking, being held hostage by boot camp and then there is the time machine as only the legitimate selling point. For that the tedious new graphix are a heavy price to pay in terms of performance.</p>
      <p>I stick to OS 10.4.9 with WinXP on Parallels, until there's a functional upgrade. No need for bootcamp whatsoever. My present configuration is rock-solid, well integrated and fast on a 2.4Ghz, 4Gb memory MBP.</p>
      <p>For FontLab and Fontographer I use Windows because I happen to have these versions, for CS3 Mac for speed or Windows for convenient Unicode interchange and most international functionality, as the MacOS still hasn't caught up with Windows.</p>
      <p>I gave up on the MacOS searching function. If I really want to find what I am looking for, and not everything else that looks vaguely like it but what I am not looking for, then I search with the Windows file browser.</p>
      <p>Thomas Milo<br>
      DecoType<br>
      <a href="http://www.decotype.com" title="www.decotype.com">www.decotype.com</a></p>
