      <p>Eben, my advice is to think carefully about whether you need to run any software that isn't compatible with 10.5. For example, some applications like Freehand or Quark 6.5 have not been updated and are not known to work reliably on 10.5. If you're application software is current-- CS 3, Quark 7.x, now would be a good time to upgrade. Keep in mind that we are currently on the fourth 10.5 update, so many serious issues have already been addressed. </p>
      <p>As Mark pointed out, there are some nice features with 10.5. For example, once I started using Quicklook (space bar) to preview files, I've needed to keep fewer applications open. My problem now, is that I now try to do it on my Windows system, and puzzle for a second about why it isn't working.</p>
