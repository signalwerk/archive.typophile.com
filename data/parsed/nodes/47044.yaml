      <p>Upgrading OSX isn't quite the decision dilemma that upgrading Windows is. Consider OSX upgrades more like service packs...they're fairly painless so you might as well go with the newer version if you can.</p>
      <p>The big thing is .5 is Time Machine.</p>
      <p>Bootcamp vs. Parallels isnt' really a security thing. Both are Windows. ;o)</p>
      <p>Parallels wins out for me as I can run it at the same time as everything else. Store your work files in OSX, and access them from Windows running in Parallels. That way your disk image isn't as large and you can wipe and restore Windows at anytime without loosing your work files.</p>
