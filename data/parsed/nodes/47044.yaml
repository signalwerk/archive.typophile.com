    html: |-
      <p>I've been using Leopard since it was released. Initially it was a bit wonky, but that's been pretty much sorted out.</p>
      <p>My favorite Leopard features (things I would miss if I had to go back to Tiger) are: Quick Look, Time Machine, the streamlined networking user interface, and Spotlight (which works much much better than the Tiger version).</p>
      <p>I thought I would like Spaces, but I haven't found it to be that useful. Cover Flow looks cool, but I tend to avoid using it. Quick Look is better if I want to browse the contents of files.</p>
      <p>I disable the 3D dock and the translucent menu bar. Other than that, the window "chrome" looks nicer and is more consistent.</p>
      <p>In general, I find Leopard to be at least as stable as Tiger. One of the reasons I upgraded so soon was that I was having a lot of stability issues with the Finder in Tiger on my main machine. Leopard cleared it up. Although it may be that re-installing Tiger would have worked just as well.</p>
      <p>One thing: If you have a pre-Intel Mac, you lose the ability to run Classic apps. (Intel Macs can't run Classic apps, even in Tiger.) My experience with OS X is that most of the stability problems I had (especially anything to do with fonts) were related to Classic, so I don't think this is a bad thing.</p>
