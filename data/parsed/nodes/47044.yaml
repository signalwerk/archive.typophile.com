      <p>I figure the decision on BootCamp vs. Parallels depends on how marginal your system is already. If you have a huge surplus of RAM and multi-core processors, you'll have no problem running everything at once. On a lower-end system, or if you're playing resource hogging games, you might be better off with the dual-boot setup.</p>
      <p>My old 500 MHz G4 is pretty well topped-out running 10.4.11, and I don't expect to be in a position to upgrade the whole system any time soon.</p>
