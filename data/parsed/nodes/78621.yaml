      <p><a href="http://www.fontsquirrel.com/" title="http://www.fontsquirrel.com/">http://www.fontsquirrel.com/</a> of course, which focuses on the "high" quality end of free fonts (sometimes this is relatively spoken, sometimes this really means high quality)</p>
