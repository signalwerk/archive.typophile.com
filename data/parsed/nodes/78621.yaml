      <p><a class="freelinking external" href="http://arkandis.tuxfamily.org/" rel="nofollow">http://arkandis.tuxfamily.org/</a> - Mostly GPL'd. Meant to replace commercial fonts.<br>
      <a href="/wiki/https%3A/%252Ffedorahosted.org/liberation-fonts/" class="freelinking" rel="nofollow">https://fedorahosted.org/liberation-fonts/</a> - Smaller siblings to the GoogleOS fonts.<br>
      <a class="freelinking external" href="http://gutenberg.sourceforge.jp/en/index.html" rel="nofollow">http://gutenberg.sourceforge.jp/en/index.html</a><br>
      <a class="freelinking external" href="http://moorstation.org/typoasis/typoasis1.htm" rel="nofollow">http://moorstation.org/typoasis/typoasis1.htm</a> - the typOasis<br>
      <a class="freelinking external" href="http://mplus-fonts.sourceforge.jp/" rel="nofollow">http://mplus-fonts.sourceforge.jp/</a><br>
      <a class="freelinking external" href="http://savannah.gnu.org/projects/freefont/" rel="nofollow">http://savannah.gnu.org/projects/freefont/</a> - GPL'd Times/Helvetica/Courier lookalikes<br>
      <a class="freelinking external" href="http://scripts.sil.org/default" rel="nofollow">http://scripts.sil.org/default</a> - There's more than Gentium here now.<br>
      <a class="freelinking external" href="http://users.teilar.gr/~g1951d/" rel="nofollow">http://users.teilar.gr/~g1951d/</a> - Licensing more open than a hippie's mind.<br>
      <a class="freelinking external" href="http://www.aimwell.org/Fonts/fonts.html" rel="nofollow">http://www.aimwell.org/Fonts/fonts.html</a> - Old standards, mostly GPL'd<br>
      <a class="freelinking external" href="http://www.dafont.com/" rel="nofollow">http://www.dafont.com/</a><br>
      <a class="freelinking external" href="http://www.dejavu-fonts.org/" rel="nofollow">http://www.dejavu-fonts.org/</a> - Bitstream Vera has grown!<br>
      <a class="freelinking external" href="http://www.greekfontsociety.gr/" rel="nofollow">http://www.greekfontsociety.gr/</a> - Largely OFL. Several Latin cuts.<br>
      <a class="freelinking external" href="http://www.kingthingsfonts.co.uk/" rel="nofollow">http://www.kingthingsfonts.co.uk/</a> - For-free and for fun.<br>
      <a class="freelinking external" href="http://www.linuxlibertine.org/" rel="nofollow">http://www.linuxlibertine.org/</a> - Linux Libertine and Biolinum<br>
      <a class="freelinking external" href="http://www.nowacki.strefa.pl/" rel="nofollow">http://www.nowacki.strefa.pl/</a> - Open-licensed revivals.<br>
      <a class="freelinking external" href="http://www.peter-wiegel.de/Fonts.html" rel="nofollow">http://www.peter-wiegel.de/Fonts.html</a> - Some OFL/GPL. Many display types.<br>
      <a class="freelinking external" href="http://www.pia-frauss.de/" rel="nofollow">http://www.pia-frauss.de/</a> - For-free script fonts with a commercial option.<br>
      <a class="freelinking external" href="http://uwes.suche-plus.de/galerie/galerie5a.html" rel="nofollow">http://uwes.suche-plus.de/galerie/galerie5a.html</a> - OFL. As refined as a boot-to-da-head.</p>
      <p>... and I'm still just scratching the surface.</p>
