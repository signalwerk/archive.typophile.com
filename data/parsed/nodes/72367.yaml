    html: |-
      <p>I suspect that the Q was designed that way to avoid needing to go much below the baseline. A typeface may have been used as a model but these letters could be entirely the work of the artist who did the plaque lettering.  Is the '2007' in the file name an indication of when this photo was taken, or when this plaque was made?  If the plaque is pre-digital, it begins to make the font question less probable, although many pre-digital typefaces have been digitized.</p>
      <p>What do you know about the age of the plaque and the artist who did it?</p>
      <p>- Mike Yanega</p>
