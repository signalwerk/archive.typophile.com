    html: <p>Way too many to list - but if my font purchasing habits are any indication then <a class="freelinking external" href="http://christianschwartz.com/" rel="nofollow">Christian Schwartz</a> and <a class="freelinking external" href="http://blog.positype.com/" rel="nofollow">Neil Summerour</a> are at the top of the list. I have quite a few of their faces.</p>
