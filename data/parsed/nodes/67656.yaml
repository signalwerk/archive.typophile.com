    html: |-
      <p>As Simon says - too many to list - so just some random picks: <a class="freelinking external" href="http://klim.co.nz/" rel="nofollow">Kris Sowersby</a> (National), <a class="freelinking external" href="http://new.myfonts.com/search/scaglione/people/?view=list" rel="nofollow">Scaglione &amp; Burian</a>, and many of the designers at <a class="freelinking external" href="http://www.ourtype.be/" rel="nofollow">OurType</a> including Smeijers (Ludwig and many other superb designs), Thiemich (Alto). Dan Reynolds' <a class="freelinking external" href="http://www.linotype.com/5831/malabar.html" rel="nofollow">Malabar</a>. Some of the work of <a class="freelinking external" href="http://www.felicianotypefoundry.com/main/" rel="nofollow">Feliciano Type Foundry</a> (Merlo, Rongel, Stella). <a class="freelinking external" href="http://www.linotype.com/793/adrianfrutigertraces.html" rel="nofollow">Adrian Frutiger</a> has done great work his entire career - more recently, new releases of classics like Univers Next and produced new designs such as Frutiger Serif. <a class="freelinking external" href="http://www.gerardunger.com/" rel="nofollow">Gerard Unger</a> is notable (Swift).</p>
      <p>For broader surveys see <a class="freelinking external" href="http://typographica.org/2009/features/our-favorite-typefaces-of-2008/" rel="nofollow">Typographica's Favourites of 2008</a>, and <a class="freelinking external" href="http://tdc.org/tdc/tdc2-2009-winners" rel="nofollow">TDC Best of 2009</a> and <a class="freelinking external" href="http://www.tdc.org/news/2008Results/" rel="nofollow">2008</a> - which gives you an idea of who's who, out there.</p>
