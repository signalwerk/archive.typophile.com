    date_raw: 22 Feb 2010 — 1:37am
    votes: null
    html: <p>To me, <a class="freelinking external" href="http://christianschwartz.com" rel="nofollow">Christian Schwartz</a> because he consistently delivers outstanding designs, <a class="freelinking external" href="http://www.ludwiguebele.de" rel="nofollow">Ludwig Übele</a> because his designs are much more ineresting than most stuff designed at the moment, <a class="freelinking external" href="http://www.lucasfonts.com" rel="nofollow">Lucas de Groot</a> simply because he designed TheSans, and Robert Slimbach, who has given us some of the most useful types available today. And, last but not least, Adrian Frutiger, the greatest master of all.</p>
