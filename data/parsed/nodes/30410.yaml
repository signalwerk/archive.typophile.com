      <p>I'm with Tiffany and Chris in liking the integration very much as well. It looks like you spent a lot of time on it. The only parts I don't love are the V's serifs. They remind me of <a href="http://www.myfonts.com/fonts/linotype/copperplate-gothic" rel="nofollow">Copperplate Gothic's</a>, which I find jarring here. I'd suggest either extending and refining them, making them more traditional in appearance, or removing them altogether. At the least, the righthand serif on the left stroke of the V needs to be smoothly bracketed; right now, the transition between the stroke and the serif is too abrupt.</p>
      <p>EDIT: I better chime in with a "welcome!" as well.</p>
