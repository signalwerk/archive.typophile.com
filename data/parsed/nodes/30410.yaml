    <p>Hi! My name is Vinu Chaitanya and I am a graphic design student from India. I am new here... and 18 hrs old typophile.<br>
    This is my first post. I thougt I would start off by getting some feedback on this letter integration attempt of mine. The letters I have used are the intitial of my name... 'V' and 'C' ( for Vinu Chaitanya). I would be grateful if you would spend a couple of minutes to tell me what you think I need to do to improve it in any way. I found the integration of V and C to be challenging because of the structures of these two letters... one being round and curved while the other having slanting lines with a pointed end. Waiting for feedback.</p>
    <p>Vinu Chaitanya<br>
    Graphic design student<br>
    India<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/vc_4668.jpg"></div><p></p>
