    html: <p>Between the two revisions, I prefer the serifed V, as the unserifed one feels a bit plain, as well as oddly proportioned for a sans serif letter. The V's new serifs are impeccably executed. My only concern is that the serifs place emphasis on the white space in between the V's strokes, distracting from the white space shape of the C. You might try removing one of the serifs to see if that de-emphasizes the center white space as it should be. But, again, I really like your design -- it feels fresh, but is easily "read."</p>
