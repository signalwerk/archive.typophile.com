    html: |-
      <p>There is a font that calls itself the "final word in geometric fonts" (or words to that effect) called Geometry Soft Pro (<a href="http://new.myfonts.com/fonts/cheapprofonts/geometry-soft-pro/" title="http://new.myfonts.com/fonts/cheapprofonts/geometry-soft-pro/">http://new.myfonts.com/fonts/cheapprofonts/geometry-soft-pro/</a>), which has almost every variation of rounded geometric letter you would need. Apparently, the non-rounded version leaves off the word 'soft'.</p>
      <p>- Mike Yanega</p>
