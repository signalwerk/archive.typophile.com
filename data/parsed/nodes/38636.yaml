    <p>This is a first attempt for a logo for an event that a group of local churches want to put on called “The Bridge.”  The demographic we’re trying to meet is high school through mid-twenties.  The purpose of the event is to provide an open environment for Christian students to get plugged into spirituality groups at the local churches, as well as a forum for young people interested in Christian spirituality to explore what it might mean for them.  Just want to put that out there so you understand what we’re going for.  Please contribute your honest, frank and respectful comments.</p><div class="imageWrap"><img src="/web/20080821154342im_/http://www.typophile.com/files/bridge 1_6421.png"></div><p></p>
    <div class="forum-topic-navigation clear-block"><a href="/web/20080821154342/http://www.typophile.com/node/38847" class="topic-previous" title="Go to previous forum topic">‹ Logo for graphic design studio</a> <a href="/web/20080821154342/http://www.typophile.com/node/40034" class="topic-next" title="Go to next forum topic">Suggestions on Serifs that will compliment Chalet(in my new logo). ›</a></div>
