      <p>i have to disagree with litera’s comments. i think it’s not generic <em>enough.</em></p>
      <p>infographics are pretty hot in youth culture right now, visuals that look like public warning glyphs and the like. you’re kinda close to that aesthetic, but right now it’s simply boring.</p>
      <p>the type is sitting between styled and unstyled, and needs some attitude in one direction or the other. either remove your opinion entirely so that it reads as <em>just</em> typographic information—helvetica, something generic—or make it flashier, somehow.</p>
