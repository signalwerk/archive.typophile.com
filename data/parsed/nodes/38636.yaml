      <p>Thanks for the feedback.  When I presented it to the group of people working on this event, it received a pretty bland response.  By and large, folks wanted it to look more “bridge-y.” They also thought that it was too static.</p>
      <p>So I went back to the drawing board with several ideas in mind:<br>
      1. Make it more youthful, playful<br>
      2. Make it more suggestive of a bridge.<br>
      3. Keep the plus sign, since that was the core shape that I was riffing on.</p>
      <p>I came up with this:</p>
      <p><a href="https://web.archive.org/web/20080821154342/http://www.fpcukiah.org/misc/thebridgeslantedskinny.png" title="http://www.fpcukiah.org/misc/thebridgeslantedskinny.png">http://www.fpcukiah.org/misc/thebridgeslantedskinny.png</a></p>
      <p>What do people think?  Improvement?  Or go back to the drawing board again?</p>
