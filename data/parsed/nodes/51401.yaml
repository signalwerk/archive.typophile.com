      <p>Translating into Malay language (Bahasa Melayu)</p>
      <p>Pernah lihat Teka Silang kata Jawi?<br>
      <a href="http://typophile.com/files/Silang%20Kata%20Kelopak_0.pdf" title="http://typophile.com/files/Silang%20Kata%20Kelopak_0.pdf">http://typophile.com/files/Silang%20Kata%20Kelopak_0.pdf</a></p>
      <p>Mulakan dari ruangan yang hampir dengan nombor sambil menulis ke arah tengah bunga, setiap nombor merupakan permulaan kepada dua patah perkataan:<br>
      Satu mengikut arah jam dan yang satu lagi arah lawan jam.<br>
      Isi setiap kelopak dengan huruf-huruf hingga seluruh bunga dipenuhi. </p><div class="imageWrap"><img src="http://typophile.com/files/FlowerUmberlla_4398.jpg"></div><br>
      _____________ Peraturan + Petunjuk _____________ <p></p>
      <p>Perkataan mengikut arah jam dan lawan arah jam yang akan membina sekuntum bunga adalah:-<br>
      1. Perkataan yang berlainan tetapi sering digunakan.<br>
      2.  Kesemuanya sama panjang.<br>
      3. Dikawal oleh sesuatu petunjuk untuk membentuk bulatan yang mempunyai huruf yang sama.  </p>
      <p>_____________ Matlamatnya _____________   </p>
      <p>1. Membina lebih banyak perbendaharaan kata yang penting dengan usaha dan masa yang sedikit.<br>
      2. Membina sistem ejaan yang betul dengan bantuan rangakaian huruf yang berfungsi mengesan kesalahan dan membetulkan ejaannya.<br>
      3. Menekankan perbezaan antara perkataan yang hamper sama bunyinya.<br>
      4. Menambah kefasihan lidah dengan bantuan petunjuk.<br>
      5. Meningkatkan kecekapan daya ingatan dan kepandaian melalui penggunaan gambar-gambar.<br>
      6. Menggalakkan penggunaan bahasa Melayu dalam perhubungan.<br>
      7. Memberi kesoronokan kepada semua di dalam dan di luar kelas.<br>
       _____________<br>
      Selamat MenCuba</p>
