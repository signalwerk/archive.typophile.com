    <p>Dear Friends,<br>
    Flower Crosswords are distinguished by their Rules + Clues + Goals:<br>
    _________________ Words in a flower _________________<br>
    1. are filtered out of a School Dictionary,<br>
    2. are of the same length (3,4,5 or 6-letter long),<br>
    3. go clockwise + CCW, from the tips of the petals toward the flower's heart,<br>
    4. are controlled by a SINGLE letter forming an OUTSTANDING letter wheel,</p>
    <p>In this sample, all the 4-letter words end with K, forming a K-wheel (blue in color).<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/K-flower_6516.jpg"></div><br>
    _________________ A flower can be made Cluless if _________________ <p></p>
    <p>1. only the vowels (A,E,I,O,U) are given/taken away, or<br>
    2. one or more letter-wheels is given/taken away, or<br>
    3. a list of the CW +/or the CCW words is given.</p>
    <p>Out of a single n-petal Flower Crossword, 2n Flower Crosswords can be made simply by CW+CCW rotating it one letter 2n times, thus helping teachers to test classrooms of 2n learners without allowing them to copy from one another.</p>
    <p>______________ Flowers are set with these Goals _______________<br>
    1. Multiplying ones vocabulary with less effort+time by exploiting their Word-Doubling property:<br>
    _ If less than half of the clues is answered, the crossword is done.<br>
    2. Building error-free spelling with the help of the error-detecting &amp; correcting letter-wheels.<br>
    _ Example: BOOK can not be BOKE to go in line with the K-wheel?<br>
    3. Emphasizing narrowly distinguished tones &amp; subsequently<br>
    4. Strengthening Tongue-Twisting with the help of keywords.<br>
    _ Hold the K-Flower for example &amp; go on twisting+turning+singing a song with the 4-letter K-words.<br>
    5. Developing memory efficiency &amp; intelligence by attacking words from different positions:<br>
    _ If FISH is attacked 3 times (in F,S+H flowers), won't it be fully digested?<br>
    6. Encouraging communication in English through an integrated approach where grammar skills are not formally taught but naturally assimilated through constant practice of the language.<br>
    7. More to be discovered.<br>
    ________________________________________________<br>
    Happy Exploring with Flowers</p>
