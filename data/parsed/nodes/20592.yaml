    html: |-
      <p>One of the font writers said;</p>
      <p> Gentium1021.zip which contains my modified versions of Gentium and Gentium Italic with the extra glyphs in the Private Use area. The TTF files have been renamed to avoid confusion with the originals, but the fontname is unchanged. To install them, backup your original Gentium fonts, uninstall them, and try these.</p>
      <p>They work fine in Wordpad, so they should be OK with other applications besides Word provided you have some means of actually typing them. </p>
      <p>In Wordpad, hold down the alter key and type the codepoints 57344 to 57348 and press space to insert the capitals. Hold down alter and type codepoints 57349 to 57353 to type the lowercase.</p>
      <p>What we have done is altared a text, modifyed glyphs, created private use area glyps, typed text in Word, copied it to Live Type or Final Cut Pro to make it work and it reverts to the assigned unicode range.  There is no unicode range assigned to the Triqui language.</p>
      <p>There are three downloadable fonts from SIL that do have the charachers mad but cannot be used in Live Type or FCP.</p>
      <p>We need to import fonts from text files into Power Video Karaoke and none of the fonts we have works there either,</p>
      <p>I think I am barking up a gree that just isn't there.</p>
      <p>I need the áíóú as well so that led me to modify some of the others and nothing works with Final Cut Pro, Live type or private areas.  Modifying the existing fonts works as well though Live type does not recognize the modified glyphs even when Word does.  iMovie does as well,  but not Live type....</p>
      <p>I really wanted to use Macintosh but I have no Karoke answer there, may need to go back to one of the doze machines.</p>
      <p>Simple as it should be, typing in word, making it work, copying to live type and outputting a file for use in Final Cut Pro just is not happening.</p>
      <p>Thanks, someone must know how to make it work.</p>
      <p>bobby</p>
