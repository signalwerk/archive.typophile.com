    <p>Fonts for teaching Triqui, a language created by a missionary named Barbara Hollenbech.</p>
    <p>I have a Triqui Song book that uses underlined fonts.  In Final Cut Pro and Type Styler on a Macintosh, none of the fonts use underline and I have been trying to use the SIL underline fonts to create a Karaoke file with Apple Applications.</p>
    <p>I need a font which has built in underline vowels a, e, i, o, and u, both in Capital Letters and non cap letters.  </p>
    <p>Nothing from SIL works with the Macintosh Applications.</p>
    <p>Several people have designed fonts (including me) but upon inserting text in Type Styler, they revert to different characters or just don't show up.</p>
    <p>Help</p>
    <p>anyone</p>
    <p>thanks</p>
