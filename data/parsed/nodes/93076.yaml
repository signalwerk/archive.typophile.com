    <p>Contest for young deigners „MAKE ME”</p>
    <p>We invite you to take part in the 5th edition of “make me!” contest for young designers.</p>
    <p>The contest is directed to young artists aged between 20 and 30. We accept works from various areas of design, including fashion. </p>
    <p>The main prize of PLN 20 000 as well as awards in the form of study tours and internships create the possibility of development and improvement of one’s skills. </p>
    <p>Works are to be submitted between 15 March and 30 June. </p>
    <p>The rules - <a href="http://www.lodzdesign.com/uni/wp-content/uploads/2012/03/LD2012_make_me_2012_Regulations_ENG.doc" title="http://www.lodzdesign.com/uni/wp-content/uploads/2012/03/LD2012_make_me_2012_Regulations_ENG.doc">http://www.lodzdesign.com/uni/wp-content/uploads/2012/03/LD2012_make_me_...</a><br>
    application form - <a href="http://www.lodzdesign.com/uni/wp-content/uploads/2012/03/LD2012_make_me_2012_APPLICATION-FORM_ENG.doc" title="http://www.lodzdesign.com/uni/wp-content/uploads/2012/03/LD2012_make_me_2012_APPLICATION-FORM_ENG.doc">http://www.lodzdesign.com/uni/wp-content/uploads/2012/03/LD2012_make_me_...</a></p>
