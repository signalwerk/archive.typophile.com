    html: |-
      <p>If I had to pick (for what reason and why?) I am tempted to choose <a href="http://www.fontbureau.com/fonts/AlphaGeometrique" target="new">Alpha Geometrique</a> (all weights), by <a href="http://www.fontbureau.com/people/ClotildeOlyff" target="new">Clotilde Olyff</a>, whose body of work and exploration into letters and forms I truly admire.</p>
      <p>The faces are <em>everything</em> that type “shouldn’t be”.<br>
      I would be freed from trying to make words legible and can evoke higher cognitive functions, play with typographic rhythms and aesthetic placement of glyphs. </p>
      <p>Could I communicate?<br>
      Yes, but very slowly... and either delight or befuddle the reader.</p>
      <p>Why should I care.<br>
      By selecting only one family of type, I’ve made a commitment to explore possibilities that are important only to me. With such harsh restrictions on using a font, maybe I’ll even see more letter shapes around me (as does Clotilde in sand pebbles below) and start setting words using items found in the environment.<br>
      </p><div class="imageWrap"><img src="/files/olyff_pebbles1_4921.jpg"></div><p></p>
    html_clean: |-
