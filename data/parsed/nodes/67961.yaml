    <p></p><div class="imageWrap"><img src="http://typophile.com/files/rue_release_6111.jpg"></div><p></p>
    <p>TypeTogether is proud to introduce Rue Display, an organic, casually ornamental, narrow-faced sans serif designed by Winnie Tan. </p>
    <p>Rue's spirited and exploratory design is the materialization of a feeling about fonts as a family of organisms taking on a life of its own, in work and play. It was conceived as a typeface, used as an image and discovered as an ornament. </p>
    <p>It comes in 10 weights of light, regular, medium, semibold and bold, each with italics.</p>
    <p>GET RUE DISPLAY NOW SPECIAL<br>
    INTRODUCTORY OFFER: 20% OFF - Use discount code 392fcfab</p>
