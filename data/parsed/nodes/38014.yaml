    <p>This may not belong on the type i.d. board, but here goes...</p>
    <p>I have a cut of Au Bauer Text Initials that I purchased waaaay back int the 80's from Phil's Fonts; it's not a particularly good cut, with stray points and path directional issues, along with kerning/spacing concerns.</p>
    <p>Does anyone here know of a newer version of this? I'm sure other fonts exist with other names, any would do, but I'm thinking it's time to retire the old girl and replace her with a good, clean opentype face. Any suggestions?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/aaa_4555.jpg"></div><p></p>
