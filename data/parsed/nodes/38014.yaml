      <p>I have an old version called OptiBauer which implies that it's from (ugh) Castcraft.</p>
      <p>Phil's Fonts still lists it too, but that's probably what you bought. </p>
      <p>You might check out Shango: <a href="http://www.myfonts.com/fonts/castletype/shango/" title="http://www.myfonts.com/fonts/castletype/shango/">http://www.myfonts.com/fonts/castletype/shango/</a></p>
      <p>or Cresci: <a href="http://www.myfonts.com/fonts/letterperfect/cresci/" title="http://www.myfonts.com/fonts/letterperfect/cresci/">http://www.myfonts.com/fonts/letterperfect/cresci/</a></p>
      <p>both are available as Open TYpe.</p>
