      <p>This reminds me of one of Ray Larabie's old freebies, <a class="freelinking external" href="http://www.myfonts.com/fonts/larabie/dyspepsia/" rel="nofollow">Dyspepsia</a>, and it also has some similarity to <a class="freelinking external" href="http://www.myfonts.com/fonts/fontfont/prater-script/" rel="nofollow">Prater Script</a>. </p>
