    date_raw: null
    votes: null
    html: "<p>I would say there are two forces to consider, and they form the duality at the heart of type design: regularity, and readability. In this case the former would want your diacritics to align with stuff, like the cap height, ascender height, etc. And the latter would want you to eyeball things to balance the whole for optimal functionality, irrespective of alignment. The proximity of your font to the Display or Text extremes of the \"function axis\" determines how much weight you should give to each force. <br> <br>BTW, sorry to ruin your day Paul, but \"sputnik\" is already a reserved term in type: it's the informal name for the generic currency symbol, that circle with the four rays.  :-) <br> <br>hhp</p>"
    html_clean: "<p>I would say there are two forces to consider, and they form the duality at the heart of type design: regularity, and readability. In this case the former would want your diacritics to align with stuff, like the cap height, ascender height, etc. And the latter would want you to eyeball things to balance the whole for optimal functionality, irrespective of alignment. The proximity of your font to the Display or Text extremes of the \"function axis\" determines how much weight you should give to each force. <br> <br>BTW, sorry to ruin your day Paul, but \"sputnik\" is already a reserved term in type: it's the informal name for the generic currency symbol, that circle with the four rays.  :-) <br> <br>hhp</p>"
