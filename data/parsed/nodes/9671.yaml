    date: null
    date_raw: null
    votes: null
    html: <p>Filip Blazek, if memory serves me well, told me (when looking at a font of mine) to align lowercase diacritics with the dot of the i.  <br> <br>When I look at the results blown up large, it looks too high up but when you look at say 10pt text, it looks just as it should. <br>Logically, the dot of i makes sense since it finds a level that already exists and eliminates the jarring sense for the eye having to sort out yet another vertical resting place and perhaps the fatigue which another level might bring.</p>
