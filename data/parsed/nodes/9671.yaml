  html: <p>is there a rule for how high diacritics should come off the glyph which they accent? I have been centrally aligning them on the dot of the i &amp; j, but in many cases this seems too high? (but i'm not sure). Could anyone give me some advice/help with this one? <br> <br>p.s. <b>sputnik</b> (spoot'-neek) n. Russian for travel companion; thus i like calling diacritics by this name. there's your trivia for today...</p>
