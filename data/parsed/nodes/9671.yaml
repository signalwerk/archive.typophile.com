    html: "<p>&gt; regularity :display :: readablility:text, right? <br> <br>Yes. But always remember that nothing exists in a pure state, the axis extreme is never attained. <br> <br>&gt; Should the accents (for text) be fairly tight? or looser? <br> <br>I don't know you well enough to know what those qualifiers really mean to you in ems.  :-) <br> <br>But in general, I would say that accents for Text should be tighter than for Display, since you want a letter to be itself and distinct from other letters (like its non-accented base) more than a [compound] form that's pleasing during deliberative observation. <br> <br>hhp</p>"
