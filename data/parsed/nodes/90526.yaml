  html: <p>In an earlier post <a href="http://www.typophile.com/node/89216" title="http://www.typophile.com/node/89216">http://www.typophile.com/node/89216</a> Nick Shinn mentioned trade versus commercial use of a font. What do these terms mean?</p>
  html_clean: <p>In an earlier post <a href="/node/89216/" title="http://www.typophile.com/node/89216" class="link-kept">http://www.typophile.com/node/89216</a> Nick Shinn mentioned trade versus commercial use of a font. What do these terms mean?</p>
