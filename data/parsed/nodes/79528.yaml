    <p></p><div class="imageWrap"><img src="http://typophile.com/files/gill_1_4474.jpg"></div><p></p>
    <p>Eric Gill had exacting and pointed opinions about postage stamps, their purpose, and their design. Unfortunately, his theories didn't always hold up when put into practice, and he had a less than successful career as a designer of stamps. Accompanied by nine of Gill's previously unpublished preparatory drawings and sketches for stamps, <em><a class="freelinking external" href="http://www.katranpress.com/books11.html" rel="nofollow">Notes on Postage Stamps</a></em> is a short, previously unpublished essay by Gill in which he succinctly lays out his philatelic ideas—some of which were a little too idealistic and some of which were spot-on. All of them are interesting and thought-provoking.</p>
    <p><em>Notes on Postage Stamps</em> contains fifty-six full-color illustrations, most of which will be completely unfamiliar to historians and enthusiasts of Gill's work. An afterword by Michael Russem chronicles Gill's seven attempts at stamp design—only two of which resulted in published stamps.</p>
    <p>Learn all about it at <a href="http://www.katranpress.com/gill" title="www.katranpress.com/gill">www.katranpress.com/gill</a></p>
