      <p>Hi Jason,</p>
      <p>My further comment here is rather delayed. Just wanted to mention that I did contact Monotype and was able to purchase the font from them (Noori Nastaliq). The rendering for Unicode Urdu text under Windows XP/Uniscribe is quite good with this font. Unfortunately, InDesign ME (CS2) does not fair nearly so well. The text is all squashed together -- have tried numerous style options to see if some configuration exists in InDesign which would help .. but nothing. The text renders OK in InDesign ME in many common Arabic Unicode fonts, with the exception of some missing characters in most fonts (esp. 06BE: ARABIC LETTER HEH DOACHASHMEE).</p>
      <p>The Noori Nastaliq font contains all the required shapes. In fact, I am working at conversion of documents from InPage to Unicode. I hoped that the Noori font would be the best bet, since it seems to be the Unicode equivalent of the InPage legacy fonts. The font does work well, just not in InDesign ME.</p>
      <p>So... just wondering still whether anyone here has a story to tell about working with Urdu text in InDesign ME, Nastaliq style? Any successes?</p>
      <p>Jeff</p>
