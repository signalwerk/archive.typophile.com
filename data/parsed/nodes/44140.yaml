    html: |-
      <p>In a recent web search, I came across this page:</p>
      <p><a class="freelinking external" href="http://www.winsoft-international.com/en/products/tasmeem-fonts-nastaliq.html" rel="nofollow">http://www.winsoft-international.com/en/products/tasmeem-fonts-nastaliq.html</a></p>
      <p>which discusses a Nastaliq face for the software package Tasmeem, so apparently that program does support Nastaliq now.</p>
      <p>Also, while it may not be comparable to Monotype's groundbreaking Noori Nastaliq typeface, or the improved version used with InPage, SIL does have an open-source font package, Nastaliq Navees - it requires QuickDraw GX to work; I don't know if that restricts it to the Macintosh, or if that problem was solved now that we use OpenType everywhere.</p>
      <p>A web search seems to imply that QuickDraw GX was dropped by Apple after System 7 was replaced by System 8.</p>
