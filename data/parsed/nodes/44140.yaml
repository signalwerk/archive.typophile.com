      <p>Since you asked about '<em>software</em> and fonts', you might have a look at the <a href="https://web.archive.org/web/20150124010937/http://www.winsoft.eu/www/eng/products_solutions/WinSoft-Tasmeem.php" target="_blank" rel="nofollow">Tasmeem</a> plug-in for InDesign ME. There's a lively discussion about it on <a href="https://web.archive.org/web/20150124010937/http://29letters.wordpress.com/2007/01/15/arabic-calligraphy-written-by-hand-or-type-set-on-the-computer/" target="_blank" rel="nofollow">Pascal Zoghbi's blog</a>, with contributions by its inventor and news in the last comments.<br>
      (To be a bit more precise, at the heart of it there is a layout engine called ACE which interacts with fonts of a special format, and the Tasmeem plug-in gives InDesign ME access to both.)<br>
      I should emphasize that I do not know Arabic. My interest is in technology, and this is the best thing I have seen in years.</p>
      <p>Karsten</p>
