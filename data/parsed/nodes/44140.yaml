      <p>Tom, John, and others,</p>
      <p>I had met you, Tom, a few years back at a Unicode conference (28th).</p>
      <p>I have been distracted with a variety of other tasks recently, and had not seen the further communication here. I was quite delighted to see the new information, and to find out that so much progress is being made. I am just looking at the Winsoft website, and the Nastaliq font looks beautiful (but I must admit to a fairly untrained eye). Would anyone know when it will be available to purchase? (Says "soon available"). I guess I'll write to Winsoft about that.</p>
      <p>John..  I did work with some Nastaliq text in CS4, and although it renders fairly will with Noori, and Alvi, and a couple other fonts -- more than a page of text causes an application crash -- I have tried over and over again on an otherwise stable system (in a clean virtual machine). So... something still not completely ready within "native" InDesign CS4 ME. I did interact for some time with a person from Winsoft about this.</p>
      <p>If Tasmeem and this new font work well for long books, I believe this will be a good solution for our needs.</p>
      <p>BTW: For those who asked about the Noori OpenType font... I believe that it is no longer available -- Monotype has stopped selling it. Not certain, but I believe that the original designer is now under control of the font software.</p>
      <p>There is one other OpenType font I stumbled across which has produced nice looking results, but I have been unable to determine who the author is -- that is "Jameel Noori Nastaleeq" (one source is <a href="https://web.archive.org/web/20150124010937/http://urdu.ca/1" title="http://urdu.ca/1">http://urdu.ca/1</a>). Does anyone know any further details about this font?</p>
      <p>Thanks again for the discussion.</p>
      <p>Jeff</p>
