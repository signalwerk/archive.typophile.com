      <p>Sorry for not answering yout question about the structure of DecoType fonts. Instead I was carried away by the Extended A and B pages  of the Unicode Standard. They keep having the effect on me of a red flag on a bull - I am sure you get the picture. They are monuments of bureaucratic stupidity. Character codes can be standardized, typography can't. It's a highly individualistic activity that cannot be nailed down by international negociations - which was exactly how it happened in the case of the Arabic Presentation Forms.</p>
      <p>For familiarization, however a template may help. We are developing a series of them, the first two of which are introduced and explained by Titus Nementh and can be downloaded here:</p>
      <p><a href="https://web.archive.org/web/20150124010937/http://sehstoerung.sonance.net/pdfs/T_Nemeth%20-%20A%20primer%20for%20Arabic%20Typeface%20Design_web.pdf" title="http://sehstoerung.sonance.net/pdfs/T_Nemeth%20-%20A%20primer%20for%20Arabic%20Typeface%20Design_web.pdf">http://sehstoerung.sonance.net/pdfs/T_Nemeth%20-%20A%20primer%20for%20Ar...</a></p>
      <p>Please beware that this is only the tip of the iceberg, and not a recipe for DecoType design. It is just a first acquaintance, but they do guide one through the steps to produce a correctly structured Tasmeem compatible typeface.</p>
      <p>Thomas Milo<br>
      DecoType<br>
      <a href="https://web.archive.org/web/20150124010937/http://www.decotype.com/" title="www.decotype.com">www.decotype.com</a></p>
