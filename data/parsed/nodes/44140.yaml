      <p>I noticed the concerns above about the price of Tasmeem. I have some good news. Our partners WinSoft have drastically changed course and made Tasmeem affordable for the general public - and we just completed a new DecoType Nastaliq. It is language-configurable so that it can be set to follow Urdu, Persian, Ottoman or Arabic practice - as well as free-style. </p>
      <p>Nastaliq is the core script of the Persian writing tradition, and equally important in the areas under its cultural influence. Notably the languages of Afghanistan (Dari, Baluchi, Uzbek, Turkmen, etc.), Pakistan (Punjabi, Urdu, Saraiki, etc.), India (Urdu, Rekhta, Kashmiri), and the Turkic Uyghur language of the Chinese province of Xinjiang, rely on Nastaliq. Under the name Taʿliq has also been beloved by Ottoman calligraphers who developed the Diwani and Ruqah styles from it.</p>
      <p>The new DecoType Nastaliq for the first time in the history of typography covers all the orthographies concerned. Since the whole Unicode Arabic block is supported, even Pashtu and Sindhi can be handled, even though these languages traditionally did not use Nastaliq.</p>
      <p>The font offers all attested variant letter shapes and swashes, presented to the user through the Tasmeem WordShaper and TextShaper interfaces. It has around 300 glyphs and weighs around 140Kb. Word-shaping integrity has been tested on 27 billion letter blocks.</p>
      <p>Here's a sample:<br>
      <a href="https://web.archive.org/web/20150124010937/http://www.decotype.com/Tasmeem/rawae_l-Hasanu_Embossed.pdf" title="www.decotype.com/Tasmeem/rawae_l-Hasanu_Embossed.pdf">www.decotype.com/Tasmeem/rawae_l-Hasanu_Embossed.pdf</a></p>
      <p>Thomas Milo<br>
      DecoType<br>
      <a href="https://web.archive.org/web/20150124010937/http://www.decotype.com/" title="www.decotype.com">www.decotype.com</a></p>
    html_clean: |-
