      <p>Dear Thomas Milo,</p>
      <p>I would like to extend sincere thanks and appreciations on behalf of all Omani people for the efforts and valuable contributions you have made to Arabic computer typography. I knew that our Ministry of religious affairs has commissioned Decotype to work on an electronic copy of the 'Omani Mushaf' that was celebrated last September in the Grand Holy Mosque. Please I am very interested to know more details about how you are approaching this problem and difficulties encountered so far. </p>
      <p>I wish I can attend one of your technical talks about that subject but obviously due to the distance separating us it would be very hard.</p>
      <p>The field of computer typography is totally new to me and recently I have developed special interest to study computational problems faced with the Arabic script. Typography in my point of view is among the most demanding nowadays.</p>
      <p>Regrads,</p>
      <p>akalabdul</p>
