      <p><em>In comparison the Linotype and Monotype Nastaliq look uninteresting.</em></p>
      <p>Linotype's nasta'liq typeface, Qalmi, has not been available for many years. There is no OpenType version of it. It relied on custom software not unlike, in some respects, ACE/Tasmeem. I have a copy of the Linotype nasta'liq layout patent documentation, and it's a very clever system: miminal glyph set, dynamic positioning and connections, contextual offset of dots relative to adjacent shapes, etc.</p>
      <p>The design of Qalmi was specifically targeted at Urdu newspaper production, so should be judged in that context, not against fine calligraphy: the hairline strokes are heavier than one would expect in classical nasta'liq, and the design is more horizontal, although vertical mim and jim shape connections still create some very tall letter groups: this feature of the script is not sacrificed to the technology. The professor responsible for national examinations in Urdu in the UK still considers it the best nasta'liq typeface he ever worked with and bemoans its unavailability.</p>
      <p>The Monotype approach to nasta'liq was always very different. They took the ligation approach, with &gt;20,000 ligature glyphs, some for whole words. Inspired, I believe, by Tom's ACE approach, Monotype more recently revised their nasta'liq OpenType approach and massively reduced the number of ligatures, but it is still a hybrid system using ligatures for some combinations.</p>
      <p>In response to the original message: InDesign CS4 ME supports the OpenType cursive attachment positioning, which CS3 did not, so it is likely that Noori Nastaliq and similar fonts may work better in this version. I have not tested this with a nasta'liq font, but have with naskh fonts that use this feature.</p>
      <p>Tom, the new DecoType nasta'liq looks very good, as I would expect.</p>
