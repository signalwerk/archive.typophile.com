      <p>I pretty much used them as an abbreviation for "each and every final init medial isol form" of a letter.</p>
      <p>I'm still reading through the primer and the format, but just to see if I'm understanding your approach,</p>
      <p>Because Unicode for Arabic treats the base (skeletal) letters and those with marks as separate letters (‹ح› ,‹ج› and ‹خ›) this requires in normal OT fonts that the glyphs be repeated for all morphs, differencing for example the two letters n and ñ, the letter of which has a preferred encoding of ‹n› + ‹~›.</p>
      <p>So DecoType essentially performs an internal decomposition of ‹ز› into ‹ر› + ‹·› which allows the base form to have the same advantages that Latin/Cryillic/Greek has with the combining diacritics, since ‹a›, if it's been encoding with all its combining marks can have a hundred or so variations with a single diacritic and limitless if the mark-to-mark has been added?  (given our recent discussion on the ¿ mark in another thread I'd like to note the previous sentence is one that could have greatly benefited from its use in English).</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
