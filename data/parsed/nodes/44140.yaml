      <p>Kudos to Thomas and his crew for what surely must count as a milestone achievement.</p>
      <p>I haven't looked closely yet, but I would be interested to find out more about how the DecoType format and Tasmeem work and what the implications might be concerning the possibility of more efficient fonts or design processes for hangul (Korean alphabet) or Chinese logographs. These also involve combining a relatively small number of elements into innumerable arrays of forms, and in hangul's case at least, simple repetition of the exact same shapes won't do—finer control of the shaping is required. I wonder if the solution used by DecoType can handle this sort of thing.</p>
