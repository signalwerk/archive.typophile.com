      <p>Sorry but I am not impressed. Muddling through is one thing. What I am interested in is solutions. The fonts which you mention are supported in ID CS5 ME are incomplete in one respect or another, also due to structural limitations as to what can be done in OT/TT. If OT/TT is sufficient for you, fine.<br>
      (I prefer to compare approaches and technologies to see which will be more fruitful in the long run. There is no place for lol-ing or being-a-fan. Both are childish.)</p>
