      <p>Your question how we handled the Extended A and B pages is based on a common misunderstanding regarding the purpose of Unicode. It's explained more elaborately here:<br>
      <a href="https://web.archive.org/web/20150124010937/http://www.forensicswiki.org/wiki/Arabic_PDFs" title="http://www.forensicswiki.org/wiki/Arabic_PDFs">http://www.forensicswiki.org/wiki/Arabic_PDFs</a></p>
      <p>ACE handles the Unicode blocks 06XX and 07XX. The Extended A and B pages are legacy font pages that put designers on the wrong footing: it's old fashioned legacy stuff. With a few Koranic exceptions all of it can be ignored. The so-called "ligatures" can be substituted with the corresponding characters the 06XX block, i.e., the nominal characters of - extended - Arabic. How to build a font for Arabic is really outside the domain of the Unicode Standard. As for computer typography, it has authority over <em>what</em> to render, not over <em>how</em> to render. </p>
      <p>Thomas Milo<br>
      DecoType<br>
      <a href="https://web.archive.org/web/20150124010937/http://www.decotype.com/" title="www.decotype.com">www.decotype.com</a></p>
    html_clean: |-
