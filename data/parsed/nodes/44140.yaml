      <p>Hi Arif,</p>
      <p>For us it is an honour to get your compliments. Digging into the "nastaliqistan" was a great adventure. In fact our new Nastaliq is done by my partner Mirjam Somers, on the basis of the techniques and technologies we developed over the years. But in the end of the day, what counts is the result. And for us the fact that you consider this a serious nastaliq is very gratifying indeed.</p>
