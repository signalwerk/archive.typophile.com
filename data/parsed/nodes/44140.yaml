    <p>Hello,</p>
    <p>This is my first post to this forum. I have already appreciated some of the wealth of information experience available here.</p>
    <p>Presently I am doing some research into software and fonts capable of authentically handling Urdu (<a href="/web/20150124010937/http://typophile.com/wiki/Nastaliq" class="freelinking" rel="nofollow">Nastaliq</a>) typesetting work (long books). I have come across a package called InPage, bundled together with a family of fonts called simply "Noori Nastaliq" by Kamal Mansour.</p>
    <p>Ideally, I am hoping to find an OpenType font solution which will function well within InDesign CS/CS3 ME (where my experience lies). Does anyone here know where the Noori Nastaliq fonts might be found? I have been looking around on the Internet for a bit without success. Also, does anyone here have a success story of working with Urdu text within InDesign ME. If so, are there particular fonts which are recommended?</p>
    <p>I'd be grateful for any good advice.</p>
    <p>Jeff</p>
