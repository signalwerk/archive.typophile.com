      <p>Karsten,</p>
      <p>Thank you for taking the time to reply. I have seen Tasmeem, and must agree that it appears to be a significantly and uniquely powerful addition to InDesign ME. However, I am working with long documents and would require the features to be enabled for more than 2 pages -- i.e Tasmeem "Publisher Edition" needed. The price of that edition was a bit "frightening" the first time I looked ($12,500). That said, I acknowledge the significant amount of development that must have gone into this product (InDesign additions and fonts). I was still hoping that some success for Nastaliq style might be possible in a somewhat less expensive product (the Noori font looks OK in Word -- any Uniscribe aware application really). Perhaps InDesign ME does not implement as much of OpenType glyph positioning (or other) as provided through many Uniscribe aware applications.</p>
      <p>I should still give Tasmeem a try, as there is a 45 day trial available. The cost is a bit of a hurdle.</p>
      <p>Jeff</p>
