      <p>As promised, a specimen booklet, designed by Titus Nemeth. The last two pages show Nastaliq:</p>
      <p><a href="https://web.archive.org/web/20150124010937/http://www.decotype.com/Tasmeem/DecoType_Classics.pdf" title="www.decotype.com/Tasmeem/DecoType_Classics.pdf">www.decotype.com/Tasmeem/DecoType_Classics.pdf</a></p>
      <p>The second example is a bit rough, but it is kind of wonderful. It is my pet project: Persian in two totally different scripts and spelling methods:</p>
      <p><a href="https://web.archive.org/web/20150124010937/http://www.decotype.com/Tasmeem/persian_cyrillic_nastaliq.pdf" title="www.decotype.com/Tasmeem/persian_cyrillic_nastaliq.pdf">www.decotype.com/Tasmeem/persian_cyrillic_nastaliq.pdf</a></p>
      <p>One Arabic-based (language=Farsi, script=Nastaliq) and one Cyrillic-based (language=Tajiki, script=Adobe Minion). Please notice that this material, which was found on the BBC World website, uses basic Cyrillic, stripped of diacritics required for correct Tajiki spelling, ignoring all the specialized Cyrillic letters defined for this in the Unicode Standard. The reason is of course obvious: the BBC must have been confident that none of you computer typographers would have bothered to support Tajiki :-)</p>
      <p>The contents in both columns are practically identical, which make this a fascinating semi-bilingue. As said, the typography is a bit rough, with time I will upload smoother versions. The point I want to make now is that Tasmeem can handle many pages of complex text involving Nastaliq.</p>
      <p>I like this sample particularly because from 1988-91, I was involved in developing the Cyrillic portion of Robert Slimbach's Adobe Minion. We were all pioneers, back then. Together with David Birnbaum, we defined the Cyrillic character set. Prof Birnbaum took care of most of the Slavic, I supported the Slavic and worked out all the other orthographies of mainly Turkic Central Asian languages. Our work laid the basis for Unicode's Cyrillic Block. At the time I only did it to speed up Adobe's interest in Arabic. Boy was I wrong. It took another two decades.</p>
      <p>Thomas Milo<br>
      DecoType<br>
      <a href="https://web.archive.org/web/20150124010937/http://www.decotype.com/" title="www.decotype.com">www.decotype.com</a></p>
