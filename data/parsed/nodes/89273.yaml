    html: |-
      <p>Goudy Old Style with some sort of weight reduction. </p>
      <p>One way to get this effect: In Illustrator, add a stroke to the text (1 pt. for the size shown); convert to outlines and expand the stroke; finally, using the Pathfinder palette, subtract the expanded stroke from the body of the letters.</p>
      <p>There are other ways to do this, but something like this has been done.</p>
