      <p>I've worked on a few projects for middle eastern based companies looking to build more of a presence in the UK. The fundamental thing our research taught us was that a 'western' audience has difficulty discerning characters from other alphabets. A text based mark won't work in isolation unless your target audience is 100% familiar with the character set used. You must be 100% sure who your audience is.</p>
      <p>Looking at it as a composition it looks a little unbalanced to me, just waiting for it to topple down to the right.</p>
