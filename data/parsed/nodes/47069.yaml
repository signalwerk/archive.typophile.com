      <p>Ohkay! To help you write/draw the logo:<br>
      Qatar is a three-letter word = (Qaf + 6a + R)<br>
      Qaf + a H-flipped Qaf joined together = Boat<br>
      The Arm of 6a = Boat's sail.<br>
      The body of 6a = The body of a fighter<br>
      A number of Rs + Bayti = Waves<br>
      _______________________________________<br>
      HaHaHa with Flowers</p>
