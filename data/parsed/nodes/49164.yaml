    <p>Hi Guys,<br>
    As a newbie to type creation I’d like to start off on the right foot and create fonts that generally cover most languages. (I have a background in Graphic Designer and after many years of loving and appreciating all styles of fonts, I’d like to have a crack myself)</p>
    <p>My question is;<br>
    If I was to design a typeface and wanted to set off on the correct foot to start with, what would generally be the complete character set based around English that also covers the most widely used other main languages? (I understand that there are many more Glyphs catering for many minor langusges, but if I eventually wanted to sell a font, what would be a sufficient Character Set that a Foundry would see as being acceptable for the wider market?</p>
    <p>I want to start designing the correct way early in my endevours by designing Character Sets that anyone would say is professional and covers the major langusges and their respective glyphs. I have looked through FontLab, but their ’Encoding’ selections look overwhelming.</p>
    <p>A guiding hand, and anyone’s wisdom would be greatly appreciated.<br>
    I have already started looking through these fantastic forums and am amazed at the information available.</p>
    <p>I have created all forms of Graphics in my time, from the basic business card &amp; tee shirt prints, to in-store displays and creating art for Licensed Product all around the world, but after many years I’ve got the bug, and I think there is nothing more beautiful in the designing world than a beautiful font!</p>
    <p>Thanks for having me, and if you could answer my various questions on Character Sets &amp; widely used languages that would be great.</p>
    <p>Cheers Guys</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/49290" class="topic-previous" title="Go to previous forum topic">‹ School Branding</a> <a href="/node/16768" class="topic-next" title="Go to next forum topic">Concert Ticket Design ›</a></div>
