    html: |-
      <p>I find it a bit strange that the top is all caps and then suddenly there's a capital in Sin. The capital S rather unbalances the bottom half. Also, in the Bello one, there's a lot more whitespace (blackspace?) around the "S" half of the cupcake, whereas the "in" half has a lot of concentrated white in one area, if you get my gist. Also, there's a slant on the sides of the cupcake bottom while the fonts are also slightly italic/slanted, but at a different angle, and it all just combines to make the bottom half look a bit messy. </p>
      <p>Given the round and fluffy top section and the dark, somewhat jagged bottom section, have you thought about choosing a different font for the bottom that's also in caps, but maybe more jagged and pointy to contrast with the rounded font on the top?</p>
      <p>I understand the "the bomb" joke, but the fuse does seem a bit superfluous. But that might just be because I'd be expecting the bottom half to be round, like a cartoon bomb.</p>
