    html: |-
      <p>Other revivals:<br>
      <a href="http://www.fontshop.com/search/?q=cochin" rel="nofollow">Cochin</a><br>
      <a href="http://www.myfonts.com/fonts/mti/fournier-mt/pro-regular/" rel="nofollow">Fournier</a></p>
      <p>Fournier-inspired:<br>
      <a href="http://www.dardenstudio.com/typefaces/corundum_text" rel="nofollow">Corundum</a></p>
      <p>And of course any of the Fleischmann-derived styles, such as Fleischmann, Freight, Farnham or Mercury.<br>
      For display, Mercury or Freight probably your best bet, although may be over-familiar from periodical use.</p>
