      <p>if you want to include her art ... fill the letters with it. it doesn’t have to be the same every time it’s seen - the letterforms are consistent the fill is flexible yada yada</p>
      <p>I’d suggest finding something other than Helvetica ... just cause I think it’s a cop out. But there’s nothing wrong with that.</p>
      <p>a little research shows Shani is a deaf artist ... that’s a pretty distinct point of difference. while everyone’s experience of the world are different hers is going to be totally different from the ’norm’ - presuming it’s the right Shani Marchant</p>
      <p>thanks re:ideas</p>
