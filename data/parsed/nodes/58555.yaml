      <p>Paul —</p>
      <p>If you wish to contact me offline, I’ll be happy to set up a PDF sample of some of the Amplitudes at extremely small sizes for you to review. Be aware, however, that Amplitude does not include italics, which you indicated in your brief.</p>
      <p>FB’s <a class="freelinking-external" href="http://www.fontbureau.com/fonts/GriffithGothic">Griffith Gothic</a> is based on Bell Gothic, but includes italics. I could provide a sample of that as well.</p>
      <p>What you might really need is a dedicated agate, like Font Bureau’s <a class="freelinking-external" href="http://www.fontbureau.com/fonts/PoynterAgate">Poynter Gothic Agate</a> or H&amp;FJ’s <a class="freelinking-external" href="http://designarchives.aiga.org/entry.cfm/eid_440">Retina</a>. Unfortunately, these specialized faces are not available for Retail license, though you might try contacting the foundries and seeing whether or not they would license for your needs.</p>
      <p>— Kent.</p>
