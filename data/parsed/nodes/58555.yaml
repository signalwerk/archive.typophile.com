      <p>Interesting Cameron - I was totally thinking Helv Neue since this is the opposite of trying to make a design statement. The Roman weight seems about right. .75 points? Wow.  Thanks for the tip on the weight.</p>
      <p>Thanks everyone else for the tips - Miniscule seems interesting - I have downloaded the specimen and will print and take a look.</p>
      <p>This piece is for England so I have contacted the printers (who have experience doing tickets) and asked for advice.</p>
      <p>I work in the concert industry and some of the legalese is amazing.</p>
      <p>I have seen ads from Live Nation for one band. The legalese:<br>
      “All artists, dates, and venues subject to change without notice”.</p>
      <p>So exactly what am I buying a ticket for?</p>
      <p>Am I buying a ticket for Rod Stewart and when I get there Ozzy Osbourne is going to be playing?</p>
      <p>I have talked to all our agents and they tell me that this “legalsese” has never saved anyone, from anything. If the artist doesn’t play you give refunds. Period.</p>
      <p>Lawyers, bah…</p>
      <p>pbc</p>
