      <p>I recently used microprinting for a check-security feature; the text appears to be a hairline rule, but when viewed at 8x magnification it can be read clearly. I used .75 pt. Helvetica Neue 55, and ran plates at 4,000 dpi.</p>
      <p>By the way, I used to work for Siegel+Gale, who specialized in both corporate identity and legal-language simplification; the law in some states (here in the U.S.) requires that legal language must be above a certain point size for some consumer contracts (a ticket might be an example) to be binding.</p>
