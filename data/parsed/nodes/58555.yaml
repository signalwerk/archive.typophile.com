    html: <p>An agate is what you want. Christian Schwartz’s Amplitude Wide Regular is a good choice, but there are other similar faces. Miniscule is in my opinion way too quirky for mainstream use. In any case the printing quality has to be anno the beginning of the twentieth century to make it gel. And I’m sorry to say that Michael’s Pseudo is not very legible in small sizes, but it does look rather smart in normal sizes and up.</p>
