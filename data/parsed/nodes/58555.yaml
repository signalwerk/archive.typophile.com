      <p>Nina I’ve seen Pseudo in some of Michael’s printed test sheets and the offset printed group specimen from Reading. It suffers the same closed forms as Helvetica making it badly legible in small sizes. Further, the ’scrapings’ he did inside the counters where curves exit the stems are rounded so the whole m-formula effect goes out the window.</p>
      <p>Paul another suggestion for your micro-print: Unger’s Big Vesta:<br>
