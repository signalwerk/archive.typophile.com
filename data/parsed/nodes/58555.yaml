  html: |-
    <p>I have a project where I have to strip in an obscene amount of legalese onto a ticket. Think 3-4 pts. It will be printed on an offset press. I know that I am asking the impossible but is there any font out there that has any chance of printed cleanly at this size? If it could be read with really strong reading glasses (or by Superman) it would be a major victory.</p>
    <p>I am thinking condensed sans of some type. I will need a book and bold weight in both standard and italic.</p>
    <p>The character of the font is not important other than it’s ability to be read smaller than anything should ever be printed.</p>
    <p>tia</p>
    <p>pbc</p>
