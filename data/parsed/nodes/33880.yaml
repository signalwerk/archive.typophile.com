    <p>Who owns the "Linotype" design rights (Geschmacksmusterrechte)?</p>
    <p>In August 2006, nearly one year ago, Monotype Imaging Inc. is said to have acquired the Linotype GmbH from its German owner, the Heidelberger Druckmaschinen AG.</p>
    <p>But apparently, Monotype only acquired Linotype as a naked company shell without the design rights (Geschmacksmusterrechte).</p>
    <p>If Monotype had acquired the design rights too, then today, one year later, Monotype would be registered as owner of the design rights at the German and European design offices.</p>
    <p>But this is not the case. I checked dozens of entries at the design offices and discovered that the Heidelberger Druckmaschinen AG is still the owner of the design rights.</p>
    <p>Example: Who owns the design rights to "Zapfino"?</p>
    <p>Answer: Neither Linotype GmbH nor Monotype Imaging Inc. own the design rights to "Zapfino", because the design rights are still owned by Heidelberger Druckmaschinen AG.</p>
    <p>The registration documents for "Zapfino" are difficult to locate. Therefore, for the convenience of readers, I scanned some of the public documents as evidence:</p>
    <p>For the entries of the German design office see:</p>
    <p><a href="http://www.sanskritweb.net/temporary/zapf1.pdf" title="http://www.sanskritweb.net/temporary/zapf1.pdf">http://www.sanskritweb.net/temporary/zapf1.pdf</a></p>
    <p><a href="http://www.sanskritweb.net/temporary/zapf1a.gif" title="http://www.sanskritweb.net/temporary/zapf1a.gif">http://www.sanskritweb.net/temporary/zapf1a.gif</a></p>
    <p><a href="http://www.sanskritweb.net/temporary/zapf1b.gif" title="http://www.sanskritweb.net/temporary/zapf1b.gif">http://www.sanskritweb.net/temporary/zapf1b.gif</a></p>
    <p>For the entries of the European design office see:</p>
    <p><a href="http://www.sanskritweb.net/temporary/zapf2.pdf" title="http://www.sanskritweb.net/temporary/zapf2.pdf">http://www.sanskritweb.net/temporary/zapf2.pdf</a></p>
    <p><a href="http://www.sanskritweb.net/temporary/zapf2a.gif" title="http://www.sanskritweb.net/temporary/zapf2a.gif">http://www.sanskritweb.net/temporary/zapf2a.gif</a></p>
    <p><a href="http://www.sanskritweb.net/temporary/zapf2b.gif" title="http://www.sanskritweb.net/temporary/zapf2b.gif">http://www.sanskritweb.net/temporary/zapf2b.gif</a></p>
    <p>Note that file zapf2.pdf was "last updated on: 15/05/2007".</p>
    <p>Note that above temporary files will be deleted in a few days.</p>
    <p>The design office registrations are public evidence and cannot be refuted by Linotype or Monotype as "false" registrations. This has the following legal consequence:</p>
    <p>If, for example, Linotype sells you a "license" to "Zapfino", you do not obtain a license to "Zapfino", because neither Linotype nor Monotype own the design rights to "Zapfino" and hence cannot sell any licenses to these design rights.</p>
    <p>The same is true for other "Linotype" fonts. By generalisation we can say:</p>
    <p>Who buys fonts at Linotype, gets nothing, because Linotype owns nothing.</p>
