  html: "<p>I'm about to start a little personnal pixel font project and I cannot help but wonder: <br> <br>Because of their nature, how can one make sure their pixel font hasn't already been done by someone else (even if they start from scratch)? <br> <br>Only talking about small sizes that is. <br> <br>And if it has been already created, <br> <br>-What happens if both people can prove they initially created it from scratch? <br> <br>-Does the earlier one prevail? <br> <br>-Is there other ways of telling them apart (is one supposed to design bigger sizes included with it so we can distinguish them?)  <br> <br>-Or, in a more drastic manner, should we keep ourselves from designing things that are very \"standard\" to make sure each is different? <br> <br>Feel free to add of your own.</p>"
