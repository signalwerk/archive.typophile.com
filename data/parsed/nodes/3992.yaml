    html: <p>Hrant, thanks for the info! <br>I think I'll start without the gray pixels ;) <br> <br>What about the kerning of pixel fonts? <br>I've done it in fontographer before using standard outlines. Next time I'm planning to switch to FontLab. <br> <br>Do you need to do your kerning in pixels as well so that it will snap? Also, do you know if it's possible to have some glyphs overlapping on each other? (example, a long "tail" on the Q like in Baskerville.) God, I need to learn these english typographic terms =)</p>
