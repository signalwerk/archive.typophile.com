    html: <p>Grayscale bitmaps are simply* bitmap fonts that use shades of gray instead of just black and white, the point being that a careful** application of gray pixels can deliver greater fidelity and readability (while being careful not to introduce too much fuzz). On the surface you can just "paint" your grayscale fonts in something like Photoshop, but when it comes to deliver them as robust fonts, you don't have the same luxury as with 1-bit fonts in terms of delivering them as "true" bitmap fonts (for example by embedding them in TT fonts for Windows), you have to make pixelfonts (like you're doing anyway). The difference is that pixelfonts are outline fonts, but ones that only "click" for one point size. The tricky thing with grayscale pixelfonts is that the way you place <i>partial</i> pixels is technically challenging, in terms of ensuring correct rendering in both platforms and various apps. The other negative is that they look lousy when set large (unlike 1-bit pixelfonts, which can look cute, if not very versatile). <br> <br>* Actually, the availability of gray makes the creation of such fonts a very different exercise - so the difference really isn't "simple" at all. <br> <br>** Careful being what automatic-from-outline rendering algorithms are NOT. That's why it needs to be done by hand (for sizes below about 22 pixels). <br> <br>You can look at <a href="http://www.ultrafonts.com" target="_blank">http://www.ultrafonts.com</a> to see grayscale pixelfonts in action. <br> <br>hhp <br></p>
