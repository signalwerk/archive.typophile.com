    html: "<p>This is a very interesting topic indeed, with many facets to it. <br>I think the key is to be both pragmatic and honest. <br> <br>You can't know if somebody has already made what you're making (although asking on Typophile is a pretty solid method of finding out). But that doesn't mean it's worth going on with your design or not! As long as you don't consciously copy somebody without credit, you're morally safe. But that doesn't mean it won't be a waste of time! On the other hand, the action of making something yourself has its own rewards. <br> <br>For smaller sizes, chances are in fact that something 95% similar has already been done. Does it matter if it was done before? Not really. As long as you don't pretend yours was earlier. <br> <br>Larger sizes: I don't think that's significant (because WYSIWYG is illusionary anyway), except maybe if the other font also has a large size (that's different than yours) - but even then it might be moot. <br> <br>Here's a real cruncher: Should you consciously AVOID finding out if your design has already been done?! Maybe yes. Because if you start something then find something extant that's very similar you will be tempted (if you're an honest person) to intentionally make yours different in some hoaky way! :-/ And that's bad design. <br> <br>If you're sincerely worried, you might consider going with grayscale pixelfont design, where the chances for conflict are much less. <br> <br>So in some ways it's good not to pay too much attention to what others are doing. Personally for me this is a tug-of war: I relish knowing what's out there, but I'm also too full of myself to draw too much inspiration from what I do see! I can be very negative and over-confident, always seeing ways that I can do something so much better, often in a totally different way. But in practice I hit many of the same obstacles everybody else does. I think that's OK because my constant critique of what I see keeps people (including me) always on their toes and looking ahead. <br> <br>In the case of my Mana (a grayscale font), I started the 16-pixel version 6 years ago, and now that it's released I don't see anything similar (and it's hard to imagine something similar that's not consciously copied). But I've been working on the 13 for about 2 years now, and recently I realized it's somewhat close to Arial (at 13 PPEM)! Does it matter? Morally, no, because I didn't look at Arial when I was making it - I made it by carrying over as much of the essence of the 16 that I could, without violating the essence of the 13 pixel constraint, so to speak. But it would very much matter practically, because nobody would buy it... except that it's grayscale! <br> <br>hhp <br></p>"
