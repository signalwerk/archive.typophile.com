    html: "<p>Kerning: yes, you can (and should) do kerning - and like you suspect it just has to be defined in \"whole units\". For example if your Em is 8 pixels high the kern values would be mutiples of 125 (+/-). In practice, few people kern pixelfonts though. <br> <br>Overlapping: In a \"true\" bitmap font you might have trouble defining pixels outside of the bounding-box (I think it depends on the format), but in a pixelfont it's not an issue, since it's basically an outline font. But you don't often have to do it; in Mana-16 for example only the Florin and Ordfeminine do it - although the cap accents do extend over the top of the Em. <br> <br>BTW, the old metal term for \"overlapping\" - or actually just a part of a letter projecting beyond its sidebearings- was \"kern\"! <br> <br>hhp <br></p>"
