      <p>"A summary of the current state of web font embedding."</p>
      <p>I believe IE still supports the MS method (though not sure about IE7), but Firefox, AFAIK, and most of the newer non-IE browsers don't bother supporting any embedding at all.</p>
      <p>(And, IMHO, this isn't really a bad thing).</p>
      <p>Using flash or an image is the only way to truly get the typeface you want, but introduces a variety of accesibility and usability issues that should be carefully weighed.</p>
