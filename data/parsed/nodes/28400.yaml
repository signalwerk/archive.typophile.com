    <p>I'll be giving a presentation at a conference in early October* and so far there are two things I need that I'm missing and am having trouble finding. Any inadvisably kind person is requested to please help.</p>
    <p>* <a href="http://www.esummit2006.am/" title="http://www.esummit2006.am/">http://www.esummit2006.am/</a></p>
    <p>1) A summary of the current state of web font embedding. Until ~2 years ago I had a good grasp of it, making some PFRs and even "delivering" Mana via MS embedding (thanks to the help of Mårten Thavenius) but I can't say I really know what's on the ground these days - like how effective Fairy (now called something else) is in practice, what else might be out there now, etc. Of course I can find articles online, but I'm interested in the aggregate de facto reality, not a collection of various de jure "official party line"-type statements.</p>
    <p>2) The "ñ" glyph from Interstate. An EPS of it would be ideal, but if a person who has the font feels uneasy about that, a really large (like 800 pixel tall) black-on-white rendering of it should do. Weight/width: no need to have a perfect match, but the closer I can get to what's on the following sign the better: </p><div class="imageWrap"><img src="http://typophile.com/files/canada_s_6095.jpg"></div><p></p>
    <p>My email: hpapazian_at_gmail_dot_com</p>
    <p>hhp</p>
