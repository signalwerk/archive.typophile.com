    html: |-
      <p>Well, until about 2-3 weeks ago that "n" didn't have any diacritic on it at all! I guess somebody complained (damn mexican-speakers ;-) and it resulted in a macron... Actually, it's not even a decent macron from a font - look at how it spans the entire width of the "n", which makes it seem to extend more rightward. The thing is, the small homey white street signs along secondary intersections feature a real tilde... but that's because they're hand-made. And that will be one of the points in my talk: technology can demote culture. The more convenient something is, the more you have to care.</p>
      <p>&gt; are you looking for a straight macron-like tilde, or the real deal?</p>
      <p>I'm looking for a real "ñ" with a tilde (which only exists in<br>
      Interstate, or actually other FHWA clone fonts too I guess).</p>
      <p>hhp</p>
