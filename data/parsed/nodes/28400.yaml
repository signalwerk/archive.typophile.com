      <p>In the "Cañada" photo above, is that supposed to be a tilde above the n? It looks like a macron, and isn't how the ñ glyph of Interstate looks nor the official FHWA alphabet either. Truth be told, the official alphabet doesn't even have an "n" with a tilde (see their guide to the fonts <a href="http://mutcd.fhwa.dot.gov/SHSe/Alphabets.pdf" rel="nofollow">here</a>). But, I have seen it around, specifically on road signs near Cañon City, Colo. (like in <a href="http://www.rockymountainroads.com/colorado025/i-025_sb_exit_140_03.jpg" rel="nofollow">this photo</a>, small as it is, cropped below).</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/i-025_sb_exit_140_03_4992.jpg"></div><p></p>
      <p>To clarify, are you looking for a straight macron-like tilde, or the real deal?</p>
