    html: <p>SIFR is generally considered the state of the art for font embedding right now (even though it's really a flash trick), google it and you'll find plenty of information. In general designers seem to be staying away from embedded type, due to poor support for the the older proprietary formats and SIFR being too complicated for a lot of implementations. It might be worthwhile to survey designers who threw in the towel on HTML and went to Flash, just to see how many of them did it to get away from the font limits of HTML/CSS.</p>
