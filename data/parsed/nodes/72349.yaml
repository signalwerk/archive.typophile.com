      <p>Hi Selma,</p>
      <p>that looks like a tightly spaced <a href="http://new.myfonts.com/fonts/adobe/futura/?testdrive=dock%3Dfalse%26size%3D28%26w%3D720%26src%3Dcustom%26text%3DDAVID%2520CARRADINE%26fg%3D000000%26bg%3Dffffff%26goodies%3Dfit%26seed%3D20?refby=mfde" rel="nofollow">Futura Light</a>.</p>
      <p>For the headline (and the future):<br>
      Actually, anything but ‘ID font’ or similar is good. Try to find a descriptive title, so that we can discern the numerous threads. It could be ‘tight light caps’ or ‘thin geometric sans-serif’ etc. Typing out the sample text (‘David Carradine’) is another good option.</p>
      <p>Florian</p>
