      <p>No problem. This kind of fake is easy to do actually (using Chrome and a PC at least). Find <a href="/wiki/https%3A/%252Ftwitter.com/SergioRamos/status/394207206339796992" class="freelinking" rel="nofollow">a tweet</a>, right click it, inspect element, double-click element on elements panel and replace with your words. Printscreen. Done!<br>
