    <p>Last Saturday, after the match between Real Madrid and Barcelona, Madrid defender Sergio Ramos supposedly tweeted this (if you understand Spanish, you'll notice the involuntary joke). Ramos is famous for tweeting less than fortunate comments all the time –so this could be legit–, but this one looked fake, basically because of the type.</p>
    <p>It looks like Georgia, which is used by many Twitter clients, but not quite. It's a bit rounder, thinner and with less contrast. Any thoughts on wether it is actually Georgia or something else?</p>
    <p>Many thanks in advance.</p>
