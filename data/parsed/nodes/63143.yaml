      <p>My sugestion is "far from graphic design" itself, but if you are going to study the world’s population communication via digital devices there is a new study (I did not read it...) of the Portuguese author António Damasio about "Rapid-fire Media May Confuse Your Moral Compass". Occording to USC Annenberg media scholar Manuel Castells, Damasio’s study has extraordinary implications for the human perception of events in a digital communication environment.<br>
