      <p>If this is a design program, I would avoid straying too far into the realm of behavioral science. That said, the interesting side of this topic (however amorphous it is) is on the social and behavioral side. For example, many studies suggest that handheld communication is fueling anxiety in young people and altering family dynamics. But any meaningful discussion on those topics requires some hard scientific data. </p>
      <p>Instead of looking at how design influences behavior (which is more of a behavioral science issue than a design issue), I would suggest one of two approaches to this thesis.</p>
      <p>1. Create your own design solution to this problem. Identify the shortcomings -- as you see them -- of all the different types of communication. And then tackle them with your design. That's not very scientific or thesis-like, but it's firmly in the design realm and it would be much more than simply re-packaging research.</p>
      <p>2. Make the subject of your thesis a graphical representation of the subject matter and/or statistics, and then have the writing be about the best way to represent the topic.</p>
      <p>Just a few ideas.</p>
