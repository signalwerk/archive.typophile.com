      <p>Brainstorm rant:</p>
      <p>Well, just make sure the actual thesis posits a question, and attempts to answer it. It shouldn't really be an information dump. Don't put the horse before the cart. ie. "I want to do this so I ask this question." In my experience, the strongest theses have visual component that complements the written component. Of course you can do it the other way around, but then the thesis ends up being a long artist statement for the most part. </p>
      <p>I think your initial idea has a spark. Broadly speaking, well yes, technology always changes the way we communicate/relate/engage one another. In what instance is this a good thing or bad thing? ex. I'm going to the movies and I want to let someone know where I am. Text messaging seems appropriate, right? Ok, now, I want to break up with my girlfriend...   see where I'm going?</p>
      <p>The question ends up being, how do these technologies change us, change language, change the communication rather than simply stating that they change us. Because that answer is, yes. This is the common pitfall in most theses—the "this, therefore that" argument. Steer away from tautology. </p>
      <p>You said the phrase, quality of the communication. It's worth exploring. But this word is loaded. What is quality in a communication? Concise? Explicit? These are things you will have to explain.</p>
      <p>I think you have a nice start and plenty of time. Good luck!</p>
      <p>Reading material: Amusing Ourselves to Death by Neil Postman (it's a nice followup to Marshall McLuhan)<br>
      The Idea of Design by Richard Buchanon</p>
