    <p>Hi there,<br>
    I'm enrolled in the fourth, and final, year of a graphic design degree. In this year we're asked to work on one 8 month-long project; thesis. I would be very appreciative just to hear anyone's thoughts/suggestions/comments on my project idea.</p>
    <p>[THE PITCH]<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/texting_5821.jpg"></div><p></p>
    <p>An exploration of hand communication. It's evident that a large percentage of the world's population communicates more frequently via digital devices. This undoubtedly affects the shape of culture, language and communication. </p>
    <p>Some of us spend more time and effort with the tools to communicate, than with the quality of the communication itself.</p>
    <p>It is my intention to explore all of the ways we communicate manually, by hand, with the hopes of discovering an engaging medium to share this information. Most likely printed ephemera.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/122154814_462df2f7c6_4700.jpg"></div><p></p>
    <p>---------------------------------------------------------------------------------------</p>
    <p>Any ideas or suggestions of what to look for are greatly appreciated!<br>
    Thanks</p>
