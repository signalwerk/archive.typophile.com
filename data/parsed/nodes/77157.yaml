    html: |-
      <p>@andiawmasry: I don't think you understand the bug report. You can't do *manual* kerning in Illustrator between the ligature and a following glyph. It's nothing to do with whether the font's built-in kerning was properly constructed. (Though it would be interesting to see if Illustrator also fails to correctly use the built-in kerning between a ligature and a following glyph.)</p>
      <p>Cheers,</p>
      <p>T</p>
