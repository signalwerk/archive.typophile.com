    <p>I was wondering if someone could comment on something I don't understand about kerning.</p>
    <p>My font is named "dugud". The attached image shows two words "offkey" then "iffy". The ligatures in both are in red. In "offkey" there's ligature sub for "ffk". In "iffy" there's a ligature for "ff".</p>
    <p>Note the arrows above. I can kern between the initial "o" in offset and the following "ffk" ligature (black arrow). I cannot kern at all between the "ffk" and the following "e" (orange arrow).</p>
    <p>For the word "iffy" the situation is the same. At the black arrow I can kern, at the orange arrow I cannot.</p>
    <p>The type sample was created in Illustrator. If I turn off ligature substitution I can kern everything.</p>
    <p>Any thoughts?</p>
    <p>Regards,</p>
    <p>Doug</p>
