    html: |-
      <p>IMHO, Illustrator is indeed so have not "friendly" with otf feature, LoL. But the problem also would be recheck to the "kerning classes" groups definition. I Just remembering you. Think, In this case, kerning for "k" and "f" should be separate to be two session:<br>
      "k" ----&gt; "k_left" and "k_right". Same way for<br>
      "f" ----&gt; "f_left" and "f_right". </p>
      <p>And then:<br>
      "ffk" should be completely grouping with "k_left" and "f_right", and<br>
      "ff" should be completely grouping with "f_left" and "f_right"</p>
      <p>I hope this correct.<br>
      Nice to introducing you.<br>
      Best regards.</p>
