  html: |-
    <p>I’ve been re-setting the original <em>ca.</em> 1904 score to <cite>Peter Pan</cite> as found at ‹<a href="https://books.google.com/books?id=J-wQAAAAYAAJ">https://books.google.com/books?id=J-wQAAAAYAAJ</a>›, which has been a fun exercise in LilyPond, but I’m curious about the font used on the title page and as song titles though the book. (Apparently I’m “not authorized” to attach a sample image. ☹) The usual type ID sites don’t recognize this, which makes me wonder whether it has ever been digitized. Does this look familiar to anyone here?</p>
    <p>Edit: I’ve succeeded in uploading a picture to ‹<a href="http://www.typophile.com/statuses/2119">http://www.typophile.com/statuses/2119</a>›.</p>
    <p>Edit 2: Looks like attachment is now permitted to me; yay!</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/font-id/Peter_Pan.png" width="1110" height="650" alt="Peter Pan score title page">
