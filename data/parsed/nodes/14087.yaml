    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Foundries" class="freelinking" rel="nofollow">Foundries</a> : Thirstype</strong></p>
    <p>Thirstype is an international group of typographers creating and publishing new typefaces. The foundry was launched in 1994 by <a href="/wiki/Rick%20Valicenti" class="freelinking" rel="nofollow">Rick Valicenti</a> to publish his font Bronzo, and was soon expanded to present the work of <a href="/wiki/Barry%20Deck" class="freelinking" rel="nofollow">Barry Deck</a>, <a href="/wiki/Magnus%20Rakeng" class="freelinking" rel="nofollow">Magnus Rakeng</a>, <a href="/wiki/Patric%20King" class="freelinking" rel="nofollow">Patric King</a>, <a href="/wiki/Chester%20Jenkins" class="freelinking" rel="nofollow">Chester Jenkins</a>, <a href="/wiki/Paul%20Sych" class="freelinking" rel="nofollow">Paul Sych</a>, <a href="/wiki/Frank%20Ford" class="freelinking" rel="nofollow">Frank Ford</a>, <a href="/wiki/Patrick%20Giasson" class="freelinking" rel="nofollow">Patrick Giasson</a>, and <a href="/wiki/Claudio%20Piccinini" class="freelinking" rel="nofollow">Claudio Piccinini</a>.</p>
    <p>The foundry is presently based in New York City.</p>
    <p><a href="http://www.thirstype.com/" title="http://www.thirstype.com/">http://www.thirstype.com/</a></p>
