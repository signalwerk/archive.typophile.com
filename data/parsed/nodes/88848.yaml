  html: |-
    <p>Hi,</p>
    <p>this is a great forum with awesome font suggestions.  I've tried many of the fonts that you recommend.</p>
    <p>What are your suggestions for: sans serif, business use font, not heavy in weight, can be used to write documents several pages long, that's easy to read in both print and on screen?</p>
    <p>I love documents printed in Whitney - it looks great in print with easy to read characters.  Whitney suffers on screen (e.g. in a pdf document).  The letters: 'a' and 's' are a particular problem because some areas of those letters are so skinny that they almost disappear.</p>
    <p>2 others that come close - but not close enough are:</p>
    <p>- FF-Din looks good in print, and OK on screen.<br>
    - Calibri works great on screen, but I feel it will date quickly just like Arial because it is a default font for MS Word.</p>
    <p>Suggestions?????</p>
