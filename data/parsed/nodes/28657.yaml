      <p>AllGiggles, since you seem to be writing from the UK, you may not be aware of the unique aesthetic that has developed amongst American college athletic logos. A perusal of the myriad designs at <a href="http://www.logoserver.com/College.html">this site</a> will show you some of the trends that have developed — bold, oblique, and high-contrast type (often with pointed serifs), everything on an angle, every mascot sneering, etc. There are some historical marks presented at the site (Alabama’s all-smiles elephant from who-knows-when comes to mind) to give you a historical perspective, too.</p>
      <p>As for official logos for colleges and universities, there does seem to be way too many marks that include <a href="http://www.und.edu/">a torch</a> (signifying knowledge), <a href="http://www.northwestern.edu/">complicated seals</a> (asserting legitimacy by harking back to European institutions), or (almost exclusively) serif type. </p>
      <p>Some institutions have worked hard to update their identities, often giving a modern facelift to their crests and seals (<a href="http://www.luc.edu/logo/about.shtml#">Loyola Chicago</a> and <a href="http://www.cornell.edu/identity/">Cornell</a> come to mind). </p>
      <p>My institution, the University of Notre Dame, has done the same, recently updating their identity to include <a href="http://mark.nd.edu/">this simplified mark</a>. However, it should be noted that the <a href="http://nd.edu/aboutnd/about/sights/images/wall_seal640.gif">university seal</a> — a more complicated, historical version of what’s seen in the new mark — is still used for official business and can be found many places on campus.</p>
    html_clean: |-
