    html: |-
      <p>They’re not all boring, I quite like the Direct Gov example you cited, but I agree that Wigan college etc. ain’t great.</p>
      <p>My own beef with uni logos is the University of Nottingham - they had a great logo (I think The Chase designed it), and they’ve semi-introduced a watered-down version that takes a portion of the old logo and then replaces the beautiful typography with a couple of lines of Dax. The clincher is that they had a new building made in the last few years, and the signage on the entrance still bears the previous logo. So, their marketing department have created a de-personalised, bland, modern-looking logotype to represent a red-brick university steeped in heritage. Nice one. (There are 2 unis in Nottingham, the other is an old poly which has, incidentally, rebranded to appear more established).</p>
      <p>It comes down to design by committee, and letting everyone in the place have their say on it… I can see why it happens, but you would think that a marketing department should really know better.</p><div class="imageWrap"><img src="files/before_5843.png"></div><div class="imageWrap"><img src="files/after_4326.gif"></div><p></p>
