      <p>Everytime I look at the type logo for my university, I frown at the lack of optical justification on ‘UNIVERSITY’ The right arm of the _Y_ is flush with the downstroke of the el in Drexel and therefore makes it feel like UNIVERSITY isn’t wide enough on the right side.</p>
