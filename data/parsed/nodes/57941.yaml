      <p>I have just come across this thread and as both a calligrapher and lettering artist /craftsman with over 40 years experience I find all the various diverse  comments interesting. I believe that Michaels comments, to me, are nearer the mark than most. I am a different person when I perform with a square edged pen than when i am designing or carving letters. Designing letters for print satisfies the designer in me, carving satisfies the craftsman in me while calligraphy  satisfies the artist in me. So I feel blessed that the diverse commissions I receive always pleases and fulfills one or more aspect of me. To me calligraphy is more spiritual and emotional and allows, at times, my Welsh spirit to escape.<br>
      Lettering in many guises on the other hand satisfies the perfectionist in me and gives me an outlet to solve visual problems which I love. But if my finances would allow it I would only carry out large scale freely written calligraphy as it would involve all my senses and be an extension of myself.</p>
      <p>If you don't mind I would like to share a personal experience with you which I feel has a bearing on this thread.</p>
      <p>In 1988 my wife Barbara died at the young age of 44. At the time my daughter Victoria was 13 years old and Angharad was just 6. I had no relatives near at hand so I had to look after them on my own without financial help for nearly 7 years. How I managed to look after them and carry out commissioned work still baffles me. But the interesting thing, as far as this thread goes, is that for the following 11 years after Barbara died I could not do any calligraphy at all however hard I tried. But designing letters and carving I managed to do because there was no emotion involved and I could stop and start around my family demands and duties. But with calligraphy as it is instant and personal I could not get fully involved and totally engrossed as calligraphy demands.</p>
      <p>So to me Calligraphy is more personal and it needs a totally different type of involvement than lettering so that all my senses can work together and perform without any interuption. Lettering on the other hand allows for interruptions and that makes a big difference.</p>
      <p>I agree that calligraphy that needs manipulation or add ons is not true calligraphy in the same way that paper folding that nedds scissors is not true origami.</p>
      <p>Ieuan Rees</p>
