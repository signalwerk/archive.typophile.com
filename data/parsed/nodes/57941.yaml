    html: <p>This is a very thorough discussion, but I can add a few elements not addressed. For me, having studied both Asian calligraphy and Western for 30+ years, gesture is at the heart of it. The stroke begins off the page, in motion. And when the hand lands on the page it makes marks, the other part of my definition--markmaking. I don't really include "beauty" in my definition except to note that when there is a coming together of tactile awareness of tool, medium, surface, and intention it often results in something you can't NOT look at, because it communicates such focused intensity and connection of hand and mind.</p>
