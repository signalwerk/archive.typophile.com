      <p>A word means whatever it generally means to people. If you use it another way, it will confuse them. Here is the Concise Oxford on the definition of Calligraphy:</p>
      <p>"1. Handwriting, esp. when fine or pleasing. 2. The art of handwriting." </p>
      <p>That pretty much lines up with Noordzij's distinction between writing with a continuous stroke and built up lettering. </p>
      <p>The important thing, as far as history, is that with a continuous stroke, the tool has a very big influence on the final shape of the letters and words. With built up letters, such as punch cutting (actually take-away letters) and pencil (pantographic punch cutting afterward) and Bezier curves, the tool doesn't have as dominant an affect on the shape. </p>
      <p>With letters built with extended, but overlapping brush strokes, as is evidently the case with sign painting--and perhaps the original of the Imperial Caps--is sort of an in-between category as far as production of letters.</p>
      <p>The skills involved are, obviously related but different. Skill in using a brush or a pen in a continuous stroke, or the overlapping strokes of the sign painter, are obviously special skills that take a lot of practice, and talent, aside from a person's ability to do built-up letters. </p>
      <p>My impression is that people would not normally use the term 'calligraphy' to apply to sign painting techniques. But I think it is important not to get bogged down in definitions. Meanings are in normal usage somewhat vague, and to assume they are precise is to go on a frustrating wild goose chase. </p>
      <p>For producers of letters, I think Noordzij's distinction--continuous vs built up--is quite useful.</p>
