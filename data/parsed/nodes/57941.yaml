      <p>Calligraphy is the more difficult one to define as it could potentially have several meanings. I doubt that a consensus will be reached on that one. Lettering, I believe, is simply creating letters which could include calligraphy. The most traditional forms of calligraphy are associated with the broad-edged pen in western calligraphy and brush in eastern traditions. Calligraphy is usually associated as being more direct, but then again… so is showcard writing and even common handwriting. I remember hearing a well known calligrapher once dismiss all pointed pen scripts as not being calligraphy. Where I work, if they say to do something 'calligraphic' it usually means broad-edged letters. I think of calligraphy as being more directly written, but I wouldn't consider that a definition. </p>
      <p>The root of the word means beautiful writing, but that doesn't necessarily constitute a definition. A piece of lettering could be purposefully made ugly or frightening to achieve a specific effect.</p>
      <p>Graham: Good point about the traditional built up letters. </p>
      <p>Maybe this is why Calligraphy Review was changed to Letter Arts Review back in the 90's.</p>
