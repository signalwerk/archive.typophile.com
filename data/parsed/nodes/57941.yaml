      <p>I can't argue with calligraphy meaning "beautiful writing," because that's what it literally means in Greek: kallos+graphe, beauty+writing. </p>
      <p>However, one could go to the store, buy a set of pens marketed as a "calligraphy set," go home and attempt to make something very ugly with them. And god knows that although many people may believe their calligraphy is beautiful, it definitely is not to the rest of the world. I don't think that someone producing bad or ugly calligraphy is not creating calligraphy, just as someone playing an instrument poorly or purposefully "ugly" doesn't cease to produce music.</p>
