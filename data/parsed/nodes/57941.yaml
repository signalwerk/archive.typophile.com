      <p>Thanks for your kind words and here is my site address which I hope will be of some interest </p>
      <p><a href="http://www.ieuanreeslettering.co.uk" title="www.ieuanreeslettering.co.uk">www.ieuanreeslettering.co.uk</a></p>
      <p>To answer John's question</p>
      <p>'What if the style of writing relies upon such methods in order to fulfil its normative forms'</p>
      <p>Yes I would agree that scripts that need manipulation to aid legibility such as Rotunda for example is calligraphy, but we must take into account that Rotunda was written with a flexible quill and would allow for easy manipulation. Trying to do the same with a modern steel nib is not so easy and fluent an the results too often appear too conscious, constructed and laboured. If manipulation can be done easily and effortlessly and allows the writer to perform flowingly then yes I would call that calligraphy. But if on the other hand manipulation and add ons prevents natural flow and needs too technical an approach then I would not call it calligraphy. However I do a lot of calligraphy for graphic purposes that need manipulation and add ons to gain certain visual affects but I call such work 'Calligraphics'</p>
      <p>Ieuan</p>
