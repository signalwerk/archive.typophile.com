      <p>All right let us settle this for all intents and purposes now: )</p>
      <p>Stephen, Graham, James M, Charles, Gerard, Fred ( I know you lurk ), Nick, Paul, John, Peter, and all you other letter bastardizers. Belly up!</p>
      <p>Calligraphy: the art of beautiful writing. (period) Now whether you want to include the brush, ruling pen, etc. is up to you. Straight out of the pen... no futzing what so ever. That is what I consider my calligraphic side.</p>
      <p>Lettering is, TO ME, letters built up, drawn, touched up, futzed with, noodled ........ ad infinitum. A more lengthy process.</p>
      <p>Let me go further! Typography: The application of letters to design... primarily TYPE but not discounting the use of calligraphy, lettering etc. in the commission of a "layout."</p>
      <p>It is a concept that I have been using for almost thirty years, and you guys are not the only ones who struggle with this. Calligraphers think amending letterforms is cheating. Go figure.</p>
      <p>Michael</p>
