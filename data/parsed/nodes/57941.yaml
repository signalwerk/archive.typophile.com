      <p>I would say lettering could be rendered in a number of ways -- you could draw the outline, carve it into wood, burn letters into your lawn, construct them out of paperclips, etc. Calligraphy would almost always be the result of a tool being dragged across a surface, leaving a trace of the movements of your arm and/or hand.</p>
      <p>Of course, much like the difference between art &amp; design, there's a million examples you could come up with that fall in a gray area.</p>
