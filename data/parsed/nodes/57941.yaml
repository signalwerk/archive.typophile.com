    html: "<p>Calligraphy, by my understanding, is a subset of lettering which implies emphasis on the artistic quality of letters themselves, as opposed to just their message.  Consider Grotesk types, for example (Akzidenz, Helvetica, etc.)--they're designed specifically so that the letterforms themselves are not particularly noticeable.  However, compare these typefaces with lettering done using a calligraphy nib: the difference is extremely obvious.  You pay attention to the curls and flourishes of calligraphy.  You don't pay attention (unless you're a typographer--then the rules are different :) to the straight lines or even widths of sans-serif type (or in the case of most people, serif type as well).  i'm reminded of Brioso, a Robert Slimbach font based on Italian lettering written using quill pens.  Brioso effectively sits on the fence between utilitarian lettering and calligraphy--one notices the letterforms and the way they're drawn, but the unique features of the typeface are subtle enough that the letters don't hog the attention from the text itself...</p>"
