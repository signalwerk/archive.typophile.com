      <p>Talent is largely a myth applied to people who are skilled, fortunate, and persistent. People have aptitudes, but anyone can learn to do something if they really want to devote the time and effort to it. The trouble is that we all have only so much time and effort to give.</p>
      <p>I think the distinction you really mean to make when you speak of "talent and skill" is between art and craft, concept and execution. Creativity is a skill also, and you can be taught to be creative if you want to learn. But you'll have to decide if it's worth it to you, because technical skill is far more valuable and you can get by quite easily with it alone. A lot of people wait until their other skills have made them extremely successful and <em>then</em> learn to have original ideas because they have more freedom to do so.</p>
