    <p>Hey all. I have a philosophical question about design. Apologies in advance if it's not typographical enough, but I've always like the discussions you get into and appreciate your opinions.</p>
    <p>As a bit of background, I'm a designer who got to be a designer after several years as a newspaper copy editor. Once I moved to newspaper design, I freaking loved it. I moved cities this year and when I got a new job, I shifted from newspapers to a small company that does marketing-ish design work (brochures, letterhead, business cards, logos).</p>
    <p>I've always set my sights on improvement and pushing myself, no matter what I'm doing. Recently, I've felt frustrated that my design work hasn't skyrocketed; that my creativity doesn't poor out of me.</p>
    <p>Then I realized why, maybe, that is:</p>
    <p>I'm not a design talent. I'm skilled at design. I know how to make things work and look good, but I'm not highly original.</p>
    <p>So the question is, though talent can't be taught, can skill be tweaked to a level of excellence? If I wanted to, say, strike out on my own to do work similar to what I do now, is my skill enough to make it last?</p>
