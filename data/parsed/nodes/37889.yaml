    html: |-
      <p>So talent and skill have to be on opposing ends? I guess I could see that but I've never thought of them as opposing. I've always seen them as two things which can be a part of a great whole. </p>
      <p>I think you need to add humility to your list Patty.</p>
  - id: 233154
    user_id: 18714
    user_name: lindsaydurango
    user_path: null
    date_raw: 12 Oct 2007 — 11:26am
    date: 2007-10-12T11:26:00
    votes: null
    html: |-
      <p>Let's bring some physics in. Let's forget about two-dimensional sliding scales. Instead of Point A and Point B creating a straight line, what if it is two ends of a curving path? Maybe spiral shaped; or a parabola; or twisted and crossed like those awareness ribbons.</p>
      <p>So no, not opposite, and elements that exist on that scale are consequently more complex than being defined as "more skilled, less talented" or "more talented, less skilled."</p>
      <p>***</p>
      <p>But honestly, I think that the talent/skill/compromise discussion is bringing up interesting points about talent and skill, but perhaps is clinging too tightly to the vocabulary.</p>
      <p>The observation at its root is that creative people who are better in business environments are able to compromise and work well with others.</p>
      <p>Maybe people silly with skill are used to finding solutions to problems (myself as an example: one of the things I really like about my job is finding the best and fastest way to format pages. Doesn't take much talent, but it's certainly a skill. And it makes me question every step I take. "Is my approach the best approach, or is there one that's better?")</p>
      <p>And now let's look at pure talent: I always think of it as an outpouring. "Just get it on the page." The talent itself is not necessarily about process; more about the idea itself. And that's when you get a running head on a chapter opener that shouldn't be there.</p>
      <p>**</p>
      <p>I still argue for that 3-dimensional sliding scale.</p>
