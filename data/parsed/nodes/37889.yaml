      <p>I think that it was Mies Van Der Rohe who said “I don’t believe in talent, I believe in work.”</p>
      <p>Very few individuals have talent that just pours out; it seems to me that those who do are usually at least a little crazy and burn out on drugs, booze, and other such nonsense. Successful creative types churn out a whole lot of mediocre stuff that either gets forgotten about or thrown away. Or maybe they’re at a big firm where a dozen designers and a small host of production staff attack problems in teams, tweaking every weak spot over a period of months. But it’s rare to pull off amazing stuff consistently on your own.</p>
      <p>Maybe your work is just stagnating and you need to make a change in your life. Creativity is largely the directed output of all the stuff that goes into ones subconscious mind and gets churned around, it could be that you just need to start putting different stuff in. This could be as small as going to the movies more often or as big as moving to another country. But it’s worth a shot.</p>
