      <p><em>“The fundamental skill is talent. Talent is a rare commodity. It’s all intuition. And you can’t teach intuition.”</em></p>
      <p>It may be that intuition cannot be taught (at least not directly), but I'm certain it can be learned, or at least acquired.  Intuition is an epiphenomenon of [the right kind of] experience, and <em>anybody</em> can gain experience.  The more you master the tools of your trade, the more you analyze and respond to the work of others, the more you practice applying your skills and creativity in interesting new ways, the more you engage in honest self-critique and accept feedback from trusted sources, the more you hone your intuition.   It appears to be the case that in any given domain some people hone their intuition more efficiently than others, and for some people the effort required to achieve some desired result may be so monumental that it's either not possible or not practical.  But it would be a mistake to abandon an endeavor just because intuition is required and can't be taught.  Just because it can't be diagrammed on a chalk board or explained in a lecture doesn't mean it can't be obtained.</p>
