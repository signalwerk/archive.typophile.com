      <p>Well, what if it's true, simply within the context of a sliding scale?</p>
      <p>Two ends of most any scale are opposite, but the elements measured by those scales fall somewhere between the two ends points.</p>
      <p>So, talent isolates itself? But if it's tempered with skill, it'll all be good.</p>
