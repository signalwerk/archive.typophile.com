      <p>Lindsay: Speaking from experience.... There is a school of thought in personnel/HR that people have innate "aptitudes"--for example, an aptitude for abstract thought &amp; facility with words, an aptitude for flat (2-dimensional) design, an aptitude for 3-dimensional design, good hand-eye coordination. The Johnson O'Connor Foundation, in particular, has designed tests for evaluating these aptitudes--from assembling a "wiggly block" puzzle [3-dimensional problem solving], to picking up steel pegs with a tweezer [manual dexterity], to drawing some x,y, z coordinates that have been flashed briefly on a screen. They created these tests originally to find the best people to work in factory positions, and then expanded the tests to determine better fits in offices and such. (It's very much of a time when people joined a multinational corporation and moved around within divisions.) JOF is now independent of any particular company, and their findings are not accepted in some HR circles, but I personally have found them helpful. In NYC, a lot of rich kids are sent to JOF for their battery of tests.</p>
      <p>This testing is quite distinct from the widely administered Meyers-Briggs personality tests. The overlap might be: what is easier for you to do and is more fulfilling tends to be what you have an aptitude for.</p>
      <p>I know that I'm not answering your question as posed, but there you go. I suspect the real question is whether you can run your own business: i.e., run your own office and accounting, meet with clients, manage expectations, meet deadlines without excuses, and write a coherent business plan. </p>
      <p>-Paul</p>
