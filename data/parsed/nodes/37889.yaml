  - id: 233147
    user_id: 3275
    user_name: pattyfab
    user_path: null
    date_raw: 12 Oct 2007 — 10:33am
    date: 2007-10-12T10:33:00
    votes: null
    html: |-
      <p>I've worked with some extremely talented designers (and photographers, illustrators, etc) who I will NEVER work with again because they  had a "my way or the highway" approach to design. They forget that they are serving a client. I had a designer who refused to take the running head off a chapter opener - which is editorially incorrect as it repeats the chapter title already on the page - because it would have compromised her design. We went back and forth, back and forth, until I finally got her to come up with a different design element to replace it. I never hired her again. She completely wasted my time - and was ironically sharing a studio with another very famous pain-in-the-a** designer who I would love to out here but discretion forbids it. </p>
      <p>There is no shortage of talent out there, but if said talent doesn't come along with skill and resourcefulness - and cooperativeness - then it's wasted in this field.</p>
