    date: 2007-10-12T09:51:00
    votes: null
    html: <p>I think that is a dangerous way to put it. It is insulting to the skilled and it sheds very negative light on the talented. AND it separates them making it seem as if the talented can't possess skill and the skilled can't possess talent. Black and white definitions like that don't help anyone in life.</p>
