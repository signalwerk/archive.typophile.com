  html: |-
    <p>Ever seen a whole book set in Comic Sans?<br>
    Not a kids’ book, twenty-four pages set in twenty-four point text, I mean a <em>proper</em> book.<br>
    <em>The Royal Road to Card Magic</em>, 2nd edn. I plucked a copy off the shelf of my local WHSmith, thinking to myself, “Is this title familiar because I’ve read about it somewhere, or just because I’ve seen it on this shelf before?”, and opened it at random, as one does.<br>
    Eek!<br>
    Maybe the great VC should have a quiet word with the publisher?</p>
