      <p>Yikes. Don’t think this book had the budget for that though. Seeing the thread about colophons, it would have been amusing had this book had one, i.e., being proud of the type choice and wanting to point it out to the general reader... but, no. </p>
      <p>Note, everything from the TOC to the index was set in CS; only the title page, haff-title, and publisher’s imprint page were set in regular book faces...<br>
      _______________________________________________<br>
      Ever since I chose to block pop-ups, my toaster’s stopped working.</p>
