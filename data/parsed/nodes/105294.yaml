    <p>Hi Everyone,</p>
    <p>I'm new here and have a question concerning designing a typeface from an original logo design.</p>
    <p>I've designed a logo for a client in which I designed every character of the the logo.<br>
    I'd now like to create an entire typeface from those letters for my own use and to potentially sell to the public.<br>
    This typeface will not be available for my client.</p>
    <p>Does anybody know the legal ramifications around designing a typeface in this way?</p>
    <p>Is it possible to do so or does the client retain ownership of the original typographic forms restricting you from creating the typeface?</p>
    <p>Or are you free to develop the typeface on the basis that you created the original forms?</p>
    <p>Any knowledge on the subject would be greatly appreciated.</p>
    <p>Thanks.</p>
