    html: |-
      <p>Is the logo just their name set in type, or is there also a graphic symbol? </p>
      <p>Whether it's legal or not probably depends on your contract with the client. Since many logos incorporate pre-existing fonts, your contract probably doesn't guarantees font exclusivity, does it? But if the logo is just type, or if the font was very distinctive, it would likely piss off your client if you make it into a font that anyone (even competitors) can use, since that greatly reduces the uniqueness of their logo.  And a pissed off client might sue you and/or start saying bad things about you.</p>
