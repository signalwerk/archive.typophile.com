    html: |-
      <p>I think it all depends on what you have agreed on with the customer. When you told the customer that you made him something special and exclusive, I think he’d be surprised at least as soon as he sees headlines in the very same style that were made using your typeface. Just imagine someone using it for a similar trade or product … So when you are still on good terms with that customer I would not take the risk in spoiling the relationship.<br>
      No matter wether you have sold the customer exclusive rights to use that logo or not, when your customer and his lawyer are willing to see that you have been unfair or enabled others to mimick ‘his’ logo or whatever, you will be likely to spend money on a lawyer as well. In many countries, design protection is not precisely or properly (if at all) regulated or governed by law, so it usually all depends on how such a case is handled, defended etc … I think, this is not necessarily the kind of things designers like to occupy themselves with, let alone paying someone else to take care of that.<br>
      So when you sell something as a designer, not only make shure that you are getting paid reasonably for the job, also make clear agreements on which rights on your work you are selling to the customer.</p>
