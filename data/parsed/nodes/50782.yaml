  html: |-
    <p>I was working on a project for my typography class and wanted to use a medicine for the project. I can’t seem to find any known typeface that goes with any medicine on the market right now. I was really wanting to do Nexium. Does anyone know if this drug was custom designed or if it has a common typeface that can be downloaded, or bought? I’m new in the type world, so go easy on me.</p><div class="imageWrap"><img src="/files/footer_nexium_pill_5004.gif"></div><p></p>
