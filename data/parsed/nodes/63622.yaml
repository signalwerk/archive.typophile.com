      <p>Fortunately, the login area on the main page is not done in Flash, so it's accessible from the iPhone.  Once you log in, click "My Account", and there will be the navigation links at the top of the page.  For example, if you click on "Forums" at the top, you can eventually get to the point where you can read and reply.</p>
      <p>But yes, ideally, Typophile would serve a site that didn't use Flash, at least for iPhones and mobile devices without Flash.</p>
