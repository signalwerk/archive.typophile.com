    <p>I've been a lurker on here for a while, always ending up reading through all of the posts on the first page before I actually get through to post something (and honestly a little intimidated).  So I guess that means I am new, or somewhat new....anyhow, I have a question and I couldn't find anything through the search.</p>
    <p>Anyone using an iPhone app to follow this forum?  I am only at a desk for very small amounts of time during the day and would love to keep up with the forum without having to go through Safari and enlarging it every time.</p>
    <p>I know that there are a few apps that support a few types of forums, but the ones that I have tried don't work here (Forums, Tapatalk, TouchBB).  </p>
    <p>If there isn't an app that is already in use, would it be possible to install the support apps from one of the mentioned apps on to the server? This would allow Forum reading apps to interface with the site, and I am guessing that would make quite a few people happy, well.....at least one.</p>
    <p>I asked Tiffany this question earlier, so if this has come up recently and I haven't seen it, sorry.</p>
    <p>Thanks!</p>
    <p>Robb</p>
