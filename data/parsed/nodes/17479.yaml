    html: |-
      <p>i was just searching for Bailey and i couldn’t find it. there’s a font called ITC Bailey that keeps coming up but it’s totally different. </p>
      <p>i saw Bailey (by Lettergraphics) in the Feb 06 issue of HOW in an article called Foxy Fonts by Allan Haley (page 80). the article is about typefaces designed during the 60s and 70s.<br>
      when i saw this sample i assumed that whoever designed the font-in-question based it on Bailey.</p>
      <p>Stark seems like a decent match, but there’s got to be a digital version of Bailey out there somewhere because i know i’ve seen it…</p>
      <p>———————<br>
      nc</p>
