    html: <p>I wonder why they went with an emboss for the movie, rather than just going with thermography? The expense of the emboss would see to outweigh the "cool" of seeing the name debossed on the back of the card as he flips it. <br> <br>I think it'd be pretty fun to work as an art director for a film and create all those props. <br> <br>Of course, then I'd be on the receiving end of critiques of some non-period typeface that accidently creeped in. Maybe it's better if I stay out of the movies.</p>
