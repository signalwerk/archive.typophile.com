    html: |-
      <p>I love Mandel's work. He balanced art and technique so superbly.</p>
      <p>I have his "Du pouvoir de l'écriture", and I do recommend it (if you read French) but there's little technical stuff in there - it's mostly cultural. As Sevag says, Richard Southall's book is a better bet; he worked with Mandel on his most significant "lo-fi" type (Colorado) and the last chapter is a highly detailed account of that project.</p>
      <p>BTW Mandel's successor of sorts in the realm of phone book type is Piero De Macchi, whom I had the pleasure of meeting at ATypI-Rome in 2002. His Nomina is pretty amazing.</p>
      <p>Maxim, I didn't know about that article - what a keeper!</p>
      <p>hhp</p>
