    <p>Does anyone have any more information or resources for the work of Ladislas Mandel? </p>
    <p>Apart from Luc Devroye's resourceful [http://luc.devroye.org/fonts-32467.html|page] and an [http://collections.bm-lyon.fr/mil/search?query=creator:%22Mandel,%20Ladislas,%201921-2006%22|online archive] at the Musée de l'Imprimerie, I haven't found anything else.</p>
    <p>I have been recommended [http://www.abebooks.co.uk/servlet/BookDetailsPL?bi=1356009474&amp;searchurl=an%3DLadislas%2BMandel%26bt.x%3D0%26bt.y%3D0%26sts%3Dt|these] [http://www.abebooks.co.uk/servlet/BookDetailsPL?bi=837948946&amp;searchurl=an%3DLadislas%2BMandel%26bt.x%3D0%26bt.y%3D0%26sts%3Dt|books] too.</p>
