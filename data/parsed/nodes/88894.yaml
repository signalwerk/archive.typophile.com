    <p>I've read that  <a class="freelinking external" href="http://new.myfonts.com/fonts/linotype/gill-sans/gill-sans/" rel="nofollow">Gill Sans</a> has no contrast at all. (E.g. <a class="freelinking external" href="http://www.mediumbold.com/04_thinking/type/typeterms/index.html" rel="nofollow">1</a>, <a class="freelinking external" href="http://okaydave.com/projects/saintpetersburg/typography.html" rel="nofollow">2</a>, <a class="freelinking external" href="http://issuu.com/naomifarrar/docs/sans_serif_11" rel="nofollow">3</a>, <a class="freelinking external" href="http://www.foamtrain.com/glossary/ccc.html" rel="nofollow">4</a>) Assuming this is correct:</p>
    <p>I understood contrast derived from modulation of the stroke width, and I clearly see variations of stroke width in Gill Sans (where the curve of the lowercase 'n' joins the upright, or the upper part of the lower storey of the lowercase 'a', for example). This inplies to me that Gill Sans must have some (albeit subtle) contrast.</p>
    <p>What have I misunderstood?</p>
    <p>Many thanks<br>
    Dave Higgins</p>
