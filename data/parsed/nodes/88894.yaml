    html: |-
      <p>First of all, it's important to realize that:<br>
      1) People simplify to understand.<br>
      2) Mathematical equality of vertical and horizontal<br>
      thicknesses results in the former appearing thinner.<br>
      3) Things look thicker when they touch, and this effect<br>
      increases with the acuteness of the angle they join.</p>
      <p>And #3 is where modulation (the way I like to define it)<br>
      kicks in: the thinning of joins to avoid visual "clotting".<br>
      In contrast :-), contrast means the difference in thickness<br>
      (and not just between verticals and horizontals) between<br>
      various parts without factoring in #3.</p>
      <p>If you look at Futura for example, it tries to be totally<br>
      zero-contrast* but to achieve that the joins (like in the<br>
      lc "a") are thinned (modulated) a great deal.</p>
      <p>* Something I actually wouldn't attribute to Gill Sans.</p>
      <p>hhp</p>
