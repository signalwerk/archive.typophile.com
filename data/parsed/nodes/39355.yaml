      <p><em>Also, this typeface so far has been made entirely in Illustrator, and i have no idea how to turn it into an actual font. Does anyone have any links or info i could read up on how to combine my characters in Illustrator into a font?</em></p>
      <p>Hi. You need to get a font creation program (<a href="http://www.fontlab.com/" rel="nofollow">Fontographer and FontLab</a> are two, but there are others) and bring your Illustrator drawings into it. Check out the <a href="http://typophile.com/node/12369?" rel="nofollow">How-To</a> section of the TypoWiki for more info on the practical aspects. Check out the <a href="http://typophile.com/node/12157?" rel="nofollow">Books</a> section to find literature on the subject of designing or creating a typeface. Also, a Google search will probably get you some online tutorials on the basics.</p>
