    <p>hey everyone,</p>
    <p>Well, i took a shot at making a typeface. I am still working on it, specifically the numbers. I don't know if anyone on here skateboards, but the typeface is sort of inspired by a skateboard company called Krooked. Tell me what you think. </p>
    <p>Also, this typeface so far has been made entirely in Illustrator, and i have no idea how to turn it into an actual font. Does anyone have any links or info i could read up on how to combine my characters in Illustrator into a font?</p>
    <p>thanks!<br>
    josh</p>
    <p>http://img.photobucket.com/albums/v79/guccipingpong/typeface.jpg</p><div class="imageWrap"><img src="http://typophile.com/files/typeface_5316.jpg"></div><p></p>
