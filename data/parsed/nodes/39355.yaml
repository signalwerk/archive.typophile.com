      <p>Hi again:</p>
      <p>If the alphabetics are rough and square then the numerals should be that way too. </p>
      <p>Or if you want to be smoother in the numerals you should bring that to the letters because it create harmony. </p>
      <p>Users will mix letters and numbers together in the same world so all these characters have to jive together.</p>
      <p>Mikey :-)</p>
