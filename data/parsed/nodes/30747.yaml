  html: <p>Hello all.  I am a cartographer (well, cartography grad student) with a keen interest in typography and type design.  I was wondering if you knew of typefaces designed specifically for cartography, or at least with an eye to cartographic usage.  I know only of <a href="https://web.archive.org/web/20190730202153/http://www.linotype.com/2276/cisalpin.html?PHPSESSID=1298682fc3cee7d2c05788eaa248e93c#bild03">Cisalpin</a> by Felix Arnold.  A cool face, but without enough weights/varieties.  Many of my fellow map-makers rely heavily on Garamond, Helvetica, Frutiger, Meridien, Sabon, Gill Sans, Univers, and Stone for labeling and annotation.  These are great faces and surely sufficient for most map designs – just wondering if any cartography-specific faces are out there.  I look forward to continuing my typographic education here on Typophile!</p>
  html_clean: <p>Hello all.  I am a cartographer (well, cartography grad student) with a keen interest in typography and type design.  I was wondering if you knew of typefaces designed specifically for cartography, or at least with an eye to cartographic usage.  I know only of <a href="https://web.archive.org/web/20190730202153/http://www.linotype.com/2276/cisalpin.html?PHPSESSID=1298682fc3cee7d2c05788eaa248e93c#bild03" class="link-external">Cisalpin</a> by Felix Arnold.  A cool face, but without enough weights/varieties.  Many of my fellow map-makers rely heavily on Garamond, Helvetica, Frutiger, Meridien, Sabon, Gill Sans, Univers, and Stone for labeling and annotation.  These are great faces and surely sufficient for most map designs – just wondering if any cartography-specific faces are out there.  I look forward to continuing my typographic education here on Typophile!</p>
