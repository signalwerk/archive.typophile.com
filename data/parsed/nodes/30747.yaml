      <p>I've been working for some time now on <a href="https://web.archive.org/web/20190730202153/http://www.gestaltungssache.at/content/terranova/terranova.pdf">this</a>, which is based on <a href="https://web.archive.org/web/20190730202153/http://memory.loc.gov/ammem/gmdhtml/gutierrz.html">that</a>.</p>
      <p>At the moment I'm reviewing it after a half year of letting it alone, redesigned the basic characters. All the others are very inconsistent (best to be seen in texts with ligatures on).</p>
