    html: <p>Dan, those cartographic typefaces are really cool, especially Kursivschrift. But why do most of them have such strong obliques and "reverse" obliques (which I've never seen before) -- is it a German thing or a cartographic thing?</p>
    html_clean: <p>Dan, those cartographic typefaces are really cool, especially Kursivschrift. But why do most of them have such strong obliques and "reverse" obliques (which I've never seen before) -- is it a German thing or a cartographic thing?</p>
