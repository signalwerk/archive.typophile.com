      <p>I just got finished reading <a href="https://web.archive.org/web/20190730202153/http://www.typotheque.com/site/index.php">Typotheque's</a> amazing Fedra Sans and Serif type specimen. As Fedra is so incredibly well-done, comes in four weights and three widths, and can be serif, sans, small cap, and italic, it might be ideally flexible for cartography.</p>
      <p>While they're not necessarily made for maps, both <a href="https://web.archive.org/web/20190730202153/http://www.veer.com/products/typedetail.aspx?image=FOT0000074#specimen">Incognito</a> and <a href="https://web.archive.org/web/20190730202153/http://www.veer.com/products/typedetail.aspx?image=FOT0000069#specimen">Zanzibar</a> (by Gabor Kothay) come from the spirit of antique, exotic maps. Incognito is especially cartographic, taking its ornaments and swashes from a book of maps. I'm desperately in love with both of them.</p>
    html_clean: |-
