    html: |-
      <p>I think this is a cartographic thing.</p>
      <p>In cartography, creating a hierarchy of information is very important. Not-upright text has to instantly visibly different, hence the sharp incline. Reverse inclines allow you to add a third dimension. I suspect that this is ok on maps because the normal, text-based legibility rules we are accustomed to in books do not apply. Perhaps Zachary could say something about this?</p>
      <p>A new typeface that also has some elements for cartography is <a href="/web/20190730202153/http://www.typophile.com/node/29422" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Carl Crossgrove</a>'s Beorcana – <a href="https://web.archive.org/web/20190730202153/http://beorcana.com/">http://beorcana.com/</a></p>
    html_clean: |-
