      <p>I've been working for some time now on <a href="http://www.gestaltungssache.at/content/terranova/terranova.pdf" rel="nofollow">this</a>, which is based on <a href="http://memory.loc.gov/ammem/gmdhtml/gutierrz.html" rel="nofollow">that</a>.</p>
      <p>At the moment I'm reviewing it after a half year of letting it alone, redesigned the basic characters. All the others are very inconsistent (best to be seen in texts with ligatures on).</p>
      <p>Even if it was finished, it wouldn't be quite useful for modern cartography though... But there was this little voice in my head, that told me to mention it :-)</p>
