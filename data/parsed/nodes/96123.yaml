      <p>I don’t think the issue of the chirographic relationship between inner and outer outlines (i.e. how difﬁcult it would be to write a font glyph with a pointed nib pen) is particularly relevant to serifed, contrasting stroke typefaces.</p>
      <p>You might just as well discuss their “punchographic” quality.<br>
      Fred Smeijers did something like that in <em>Counterpunch</em>.</p>
      <p>The Stroke is a useful paradigm for analyzing type structure with words, and type designers may certainly use it as part of the conceptual scaffolding of a face, but the relationship between stroke and counter in serifed, contrasting stroke type plays a minor role for the reader, entangled in a complex relationship between glyph parts.</p>
      <p>Most letters (18 out of 26 in the English lower case) don’t have enclosed counters, and serifs and terminals are more instrumental in determining negative space than the stroke.</p>
      <p>While it is easy to see, and postulate, a relationship between the two elements of stem shape and negative shape in a sans face, it’s almost impossible to see this relationship in a contrasty serifed face, because stroke shape is confounded with serif shape, terminal shape and stroke contrast, and obscured by optical cheats, such as the heavy bottom of Times’ /e, that further divorce the typographic stroke from one that might have been made by a simple broad-nibbed pen held at a consistent angle.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/aen_5709.png"></div><br>
      Having said that, a low contrast slab serifed face like Turnip does show more of the counter-to-stroke relationship than a face like Times.<p></p>
