      <p>I know Hammer believed his fonts were for text, but most people now don't (and I believe our aggregate views do become more refined over time - although dips are unavoidable).</p>
      <p>We do know that designers follow trends, and I think this applies not just to style but to thought as well. Morison convinced Dwiggins and JvK to go slanted-Roman*, but then they changed their minds. And as you say I'm sure the anti-extender stance of Dwiggins and Hammer were not isolated views. But is it true that extenders have only gotten respect in the past few decades? I think there were periods in the past where people realized they're important functionally.</p>
      <p>* Although not the right way.</p>
      <p>hhp</p>
