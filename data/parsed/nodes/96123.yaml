      <p>DB: I think "they" is me. :-)</p>
      <p>Hrant: The RE styles are quite different, but I don't remember consciously reducing the inner/outer tension. What you are seeing may be a factor of weight: in Turnip (print and screen), the inner/outer tension gets louder as the design gets heavier and there is more allowable variation in thickness. TurnipRE-Regular is lighter than Turnip-Regular and even Turnip-Book. </p>
      <p>It also may be affected by how you are seeing the RE fonts rendered. A preview of this and other Reading Edge fonts across various renderings is here: <a href="http://www.fontbureau.com/ReadingEdge/" title="http://www.fontbureau.com/ReadingEdge/">http://www.fontbureau.com/ReadingEdge/</a></p>
      <p>J Tillman: I agree that the Font Bureau PDF specimen shows the font on the smaller and tighter end of Turnip's range. If you are interested, I would be happy to send you supplemental materials. Since it appears I can't attach PDFs to this thread, please get in touch: <a href="http://djr.com/about/contact" title="http://djr.com/about/contact">http://djr.com/about/contact</a></p>
      <p>I'm not the expert at making these specimens, but I do know that care is taken to show the font without a lot of primping, so you are seeing default spacing (or something very close to it), despite the justified setting. [Edit: I started responding, and then got breakfast and missed Kent's post. See his explanation above.]</p>
