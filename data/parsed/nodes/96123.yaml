      <blockquote><p>even though I can't see them?</p></blockquote>
      <p>There are different kinds of seeing. Rest assured that your inner mind can see things that are "subvisible"; and everything matters.</p>
      <blockquote><p>italics need to have the same darkness as the roman.</p></blockquote>
      <p>It depends. Not all Italics can/should have a strong slant, and/but they cannot fail to work for emphasis in a body of Roman (even when just an "I" is emphasized, which is one reason so-called "upright Italics" can't really work) so sometimes you might elect to lighten the color. Or make it look smaller on the body (rarely done). Or both. Or any combination of the various factors above...</p>
      <blockquote><p>I would prefer unjustified text</p></blockquote>
      <p>Indeed - there's no gauging the spacing otherwise.</p>
      <p>Coline BTW is quite interesting - I hadn't noticed it before.</p>
