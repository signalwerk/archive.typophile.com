      <blockquote><p>Kent, my contention is that Dwiggins's <em>thinking</em> was out of touch with his <em>doing</em>.</p></blockquote>
      <p>Yes, I’m well aware of this. And my contention is that <em>your</em> thinking about Dwiggins’s doing is out of touch with <em>his</em> thinking about his doing. You have conflated your “chirography” with his “calligraphy.” Dwiggins was not Johnstonian.</p>
      <p>We all see the past through our own contemporary lenses. What inspires you about Dwiggins’s experimental work may or may not be what inspired Dwiggins. Which is fine: we take our inspirations where we find them. But our interpretations do not in turn define the objects of our inspiration nor the motivations of their originators.</p>
      <blockquote><p>because we don't hold up Hammer's work as aiding readability while we do do that for the M-formula.</p></blockquote>
      <p>Again, to be clear, you may hold up [your interpretation of] the M-formula as “aiding readability;” but if you study the original formulation carefully, you will find that that was never Dwiggins’s objective, certainly not in any sense that you like to employ that phrase.</p>
      <p>You may see potential in the results of his explorations that inform your own particular thinking and that you wish to build upon, which is certainly a valid prerogative; just be mindful that your aims are not necessarily the same as Dwiggins’s pursuits.</p>
      <p>If his results coincide with your thinking about Readability, it may be just that: coincidence.</p>
