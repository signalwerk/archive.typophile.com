      <p>The strange thing about Dwiggins though is that -as far as I know- he never explicitly verbalized his strong un-calligraphic leanings - in fact he often extolled the pen! Or maybe his thoughts have been "filtered for publication"... But probably it's a case of a designer with incredible inventive intuition - so strong that his formal intellect could not keep up to explain what was going on. In fact some of Dwiggins's formal statements can only be described as ludicrous, such as the view that extenders are only for show, with no positive role to play in readability!</p>
      <blockquote><p>running contrary to common traits of text face design: balance, stability, evenness.</p></blockquote>
      <p>Which <em>must</em> make sense at least on some level, since information can only arise from contrast.</p>
      <p>Do you remember that slide from my Mexico City talk (that you requested) where I showed two opposite "poles"? One thing I was trying to say there was exactly that the textbook Modernist desires for things like balance, stability and evenness belong towards the display end of the axis, not the text end (although neither extreme of the axis can exist in a pure state).</p>
      <p>hhp</p>
