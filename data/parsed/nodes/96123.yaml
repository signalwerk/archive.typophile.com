      <blockquote><p>In fact some of Dwiggins's formal statements can only be described as ludicrous, such as the view that extenders are only for show, with no positive role to play in readability!</p></blockquote>
      <p>I don’t think that Dwiggins was the only designer of his time who might have thought like this. Victor Hammer, for instance, believed that ascenders and descenders <em>slowed down reading.</em>  He preferred Latin to any of the modern European languages he was familiar with, as it features much less of them in text. Not that Dwiggins and Hammer worked under similar circumstances, but … there you go.</p>
