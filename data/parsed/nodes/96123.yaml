    html: |-
      <p>For what it's worth, here is what was going through my head while drawing Turnip:</p>
      <p>I think of Bookman and the late-19th/early-20th century "oldstyle antiques" as <em>faux</em> oldstyles: the serifs/terminals are kind of calligraphic-ish, the structure not so much. The inner and outer shapes do virtually the same thing; the diagonal stress is gone, and with it, the dynamism that you get from the calligraphy-inspired thick/thin relationship.  </p>
      <p>Seeing how Bookman feels static feels in text, I figured that a sense of movement within the letter shapes, especially horizontal movement, has value in a block of text. Not sure if it's about making a text more readable, but maybe more compelling? I wanted that kind of movement in Turnip, like what happens naturally to shapes rooted in calligraphy, but in a more blatant, non-calligraphic sort of way. So I tried pitting inside against outside in hope that the tension would make each character look like it was unable to sit still.</p>
      <p>I wrote a little more about the drawing on my personal site, if it's relevant: <a href="http://djr.com/typefaces/turnip/#story" title="http://djr.com/typefaces/turnip/#story">http://djr.com/typefaces/turnip/#story</a></p>
    html_clean: |-
