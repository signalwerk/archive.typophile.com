      <p>Hrant: <em>Which must make sense at least on some level, since information can only arise from contrast.</em></p>
      <p>Contrast, in the sense of differentiation, isn't at odds with balance, stability or, even, evenness in design. You don't need a building to be unbalanced and off-kilter in order to tell where the door is and how many windows there are.</p>
      <p>With regard to differentiation: in my 'Same Difference' lecture at St Brides a few years ago, I looked at kinds of sameness that occur in writing systems and the job of differentiation that the type designer must do, and at the kinds of difference that occur and the job of 'making same' that the type designer must do. On the whole, I reckon we are given more difference than sameness to work with, so the bulk of our work is in creating kinds of sameness that do not decrease the necessary sameness but that produce visual harmony and stable relationships between signs.</p>
