      <blockquote><p>Hrant: Do you remember that slide from my Mexico City talk (that you requested) where I showed two opposite "poles"?</p></blockquote>
      <p>I do! One of the dichotomies that most spoke to me was "expression" (for display) vs "service" (for text).  Related to the original post on readability, I struggled with how Turnip should fall on this spectrum...namely how prevalent the inner/outer play should be.</p>
      <p> John's right that the inner/outer play can take over at mid-to-large sizes, but I was mainly interested in text size (print and screen), where the effect is more subtle but there's still a little kick to it (M-formula sort of stuff, I suppose).</p>
      <p>I can't speak for the goals of the other designers mentioned, and I can't say that this "kick" improves readability across the board. But for Turnip, I had a certain kind of use in mind. When you write with dialect, for example, it's not about directly conveying information but about cultivating a reading experience. Similarly, I consider the "expressive" aspects of Turnip to be part of "services" rendered.</p>
