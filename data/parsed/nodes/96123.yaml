    html: <p>What is interesting to me about this design, with regard to Peter's original question, is the way in which the results of David's approach differ optically from those of Evert's in Legato. This is most obvious at larger sizes, where edge perception overrides shape perception, but it leads me to think that there is probably a mid-to-large size range at which Legato is more readable than Pumpkin. The difference I perceive is that at larger sizes the counters of Pumpkin start to pop out, especially in the heavier weights, whereas in Legato the relationship of inner and outer shapes aims for a less dynamic tension and maintains a strong sense of black shape structure even as size and weight increase. As David says, the effect of his approach is to 'make each character look like it was unable to sit still'. Is that a good goal in terms of readability? I don't know. It is roughly the opposite of my own approach, which is to create a sense of stability, but then I am often dealing with writing systems that have built-in instability of various kinds.</p>
    html_clean: <p>What is interesting to me about this design, with regard to Peter's original question, is the way in which the results of David's approach differ optically from those of Evert's in Legato. This is most obvious at larger sizes, where edge perception overrides shape perception, but it leads me to think that there is probably a mid-to-large size range at which Legato is more readable than Pumpkin. The difference I perceive is that at larger sizes the counters of Pumpkin start to pop out, especially in the heavier weights, whereas in Legato the relationship of inner and outer shapes aims for a less dynamic tension and maintains a strong sense of black shape structure even as size and weight increase. As David says, the effect of his approach is to 'make each character look like it was unable to sit still'. Is that a good goal in terms of readability? I don't know. It is roughly the opposite of my own approach, which is to create a sense of stability, but then I am often dealing with writing systems that have built-in instability of various kinds.</p>
