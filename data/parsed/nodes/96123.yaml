      <p>I'm not a font designer, and so have a different starting point here. I looked at the Font Bureau's specimen (printed out) and I think the Regular size, shown with bold and italic, looks like a very readable text font for extended text. If you agree with this, please tell me why it is so. To my eye, at this 9 point size, the square insides are not noticeable. It just looks like a nice low contrast font. So is this a nice font because of the square insides, even though I can't see them? Or is it because of the big (wide) counters? Or some other reason. This is the way my brain works. Look at some type that works and figure out why it does. So... why?</p>
      <p>Off topic #1: I have ranted in the past that italics need to have the same darkness as the roman. <a href="http://typophile.com/node/77718" title="http://typophile.com/node/77718">http://typophile.com/node/77718</a> And Turnip's italics look good to me.</p>
      <p>Off topic #2: Type specimens should show the text fonts at the size they will probably be used! Maybe the designer thinks they look best for long text at size 9 with pretty tight leading, but I am skeptical that a novel or textbook would have them this small. I think the designer should be forthright and say that, for instance, the font looks best at 10.5/13.1 and the specimen should be set this way.  I shouldn't have to look at small text and try to guess how it will look at a usable size. And I would prefer unjustified text so I don't have to guess at how it looks straight out of the can.</p>
      <p>If you like Turnip, you might want to take a look at Coline: <a href="http://www.emilie-rigaud.com/index.php?/project/coline/" title="http://www.emilie-rigaud.com/index.php?/project/coline/">http://www.emilie-rigaud.com/index.php?/project/coline/</a></p>
      <p>Edit: What do you think about the capital letters like T and F not letting the lowercase letters slide in close? I wish the specimen had shown a few of these. My guess is that it  looks just fine, but I wish I could see it.</p>
