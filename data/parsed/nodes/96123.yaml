      <blockquote><p>I think Hammer created amazing display type.</p></blockquote>
      <p>In fact, all of Hammer’s typefaces are text typefaces, as far as he was concerned (except perhaps Andromaque). He certainly used them for book printing … quite extensively so. Hammer’s work is certainly calligraphic though … he was in the Edward-Johnston-line. Our association with his work as being in the “display” arena is probably because of his stylistic unorthodoxy, and also because of the terribly poor photo and digital versions of American Uncial. This, though, has nothing to do with David’s awesome typeface! Sorry for the tangent.</p>
      <p>I brought Hammer up because I think that our current ideas around reading might only have come about 70 some-odd years ago. Before these ideas got to designers and foundries, other things might have been going on. I suspect that there were plenty more type designers who thought like Dwiggins or Hammer might have.</p>
