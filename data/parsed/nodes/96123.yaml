      <p>I must be expressing myself poorly, because I actually agree with almost everything you just wrote. I'm not nearly as informed about Dwiggins as you are, but I do understand that his M-formula idea does not directly support my ideas on readability (and I'm certainly not trying to co-opt Dwiggins's prestige).</p>
      <p>I guess what I'm saying is that Dwiggins -even though I think he was a genius, and I never use that word lightly- didn't realize all the ways that his ideas could be useful (which is normal for anybody); and one of those ways strikes some contemporary designers (and not just me BTW) as more significant than anything he seems to have <em>explicitly</em> thought about: the breaking of chirography to benefit functionality. Was that dumb luck, or killer instincts? We can't know - but faith makes me prefer the latter. And if he didn't even realize he was being un-chirographic*, oh well - at least he gave us a wonderful gift.</p>
      <p>* Or un-calligraphic, which in spirit at least is quite close.</p>
