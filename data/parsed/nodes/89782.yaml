      <p>Hrant, I must agree, and I think .99 could actually make more people buy fonts "on impulse", expand the market and certainly reduce piracy. Of course there's an issue where a crappy product would be leveled with an amazing product, but maybe the sheer ammount of purchases would of course also reflect that gap.</p>
      <p>Sil, maybe it should be like iBooks or newsstand, a separate entity or something. And maybe if they do it the "apple way" instead of having to rely on outside, uncurated/unchecked .otf files this lock down on font installing wouldn't happen.</p>
