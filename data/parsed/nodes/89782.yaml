    <p>What do you think about it?</p>
    <p>There's something about it that I think could really work, namely, immediate, hassle-download-free installation for even the less knowledgeable layman, direct to user updates with minor effort (re-installing a font in font book for example presents more steps than anyone other than a designer/font enthusiast would want to bother go through), revisions and multi device licensing (as in installing in every device I'm logged in).</p>
    <p>There are platform, store issues etc. but somehow it seems like a very simple, elegant way of making them available to the public.</p>
    <p>I think it'd be really cool to have something like that made and work platform independently that would somehow "talk" to your os and do all the dirty work simply and elegantly.</p>
    <p>Anyone with me on this?<br>
    Cheers<br>
    Rodrigo</p>
