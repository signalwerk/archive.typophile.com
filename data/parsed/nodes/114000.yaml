  html: <p>I was wondering if anyone had any knowledge or experience with "apple garamond".  From what I have read it seems to not have been released publicly and a quality revival is no where to be found. It was something that I was looking to pursue, but didnt want to go full steam ahead, only to be abruptly stopped by a quality revival or even the existing typeface existing digitally already...</p>
