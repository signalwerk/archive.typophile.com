      <p>Thanks Bart.</p>
      <p>I'd call it a finer point of copyright?</p>
      <p>And--I suppose that's that.</p>
      <p>Here's my email exchange with Sudtipos.</p>
      <p>Moderators: please delete my .pdf here. 'Tis demanded by the GODS, it is! /JarJar<br>
      --------<br>
      From: [me]<br>
      To: [sudtipos]<br>
      Re: An amateur font designer's legal goof</p>
      <p>To whom it concerns,</p>
      <p>I have attempted to contact Mr. Giaccone with the following, but it seems the email bounced or was blocked. I hope that this reaches you.</p>
      <p>----<br>
      Mr. Giaccone,</p>
      <p>I reused your work (and/or your company's work) on "Mr. Giacco Bold," in combination with "Ubuntu Bold," by way of the "Blend" tool in FontLab. I was very pleased with the result, and further adapted it to a font which I released at openfontlibrary.org --</p>
      <p>[URL removed my moderator]</p>
      <p>-- and I notified the community about this work, at typophile.com --</p>
      <p>[URL removed my moderator]</p>
      <p>-- to discover their wise caution that I have perhaps done something illegal (although that was certainly never my intent).</p>
      <p>Please advise. I will happily remove the font from openfontlibrary.org if that is your wish (and on the presumption that this is best, I have already sent an email to the site owners there, advising them to take it down).</p>
      <p>I will also happily make the source files available to you if you are unable to find them at openfontlibrary.org by the time you read this.</p>
      <p>I would of course also be happy to find any legal arrangement that would allow for the distribution of a derivative work, such as what I had developed for a font entitled "Earthbound."</p>
      <p>With admiration for your work,</p>
      <p>Alex Hall<br>
      Amateur font designer</p>
      <p>----<br>
      To: [me]<br>
      From: [sudtipos]<br>
      Re: [SPAM] An amateur font designer's legal goof</p>
      <p>Hello<br>
      We do not allow any modification of our fonts and of course we do not<br>
      allow free distribution. The use of our outlines for derivative work is<br>
      protected by law.<br>
      I assume you don't have the original MrGiacco license too.<br>
      Please remove all the fonts from everywhere as soon as possible we would<br>
      not like to take any legal action on that.</p>
      <p>----<br>
      From: [me]<br>
      To: [sudtipos]<br>
      Re: [SPAM] An amateur font designer's legal goof</p>
      <p>As my previous email stated, I have notified openfontlibrary.org that it is advisable they take down the font (it seems that their infrastructure provides no facilities for a submitter to take down what they have posted). I have seen no reply from them; perhaps it's only a matter of time before they see my email (it's only been half a day). I have given as much effort to openness and honesty about the circumstance as could reasonably be expected, and it is now out of my hands.</p>
      <p>It's a great looking derivative work, in my opinion, and I'm disappointed that an admiring inquiry about the potential use of it (and if I may say so, my brazen confession about my genuine lack of awareness of the legal ramifications of my work) would be marked as [SPAM]. I'm attaching the sources. I hope you will reconsider adapting this work which is rightfully yours, and if you do so, I wouldn't be offended if you send me a complimentary personal font license of the result :)</p>
      <p>Conveniently, if indeed my inquiry was "spam," or unsolicited email, I suppose your reply is also, which makes it public domain, so that I may amuse myself to publicly post my inquiry, with your company's cold reply :)<br>
      ----</p>
