      <p>Well, that's the thing, HVB--if you mean the .zip file at openfontlibrary.org, that's what it seems I have no way to delete (so that I'm waiting on their response). (And thanks for editing that, Chris. I'd actually prefer my posted emails be snipped, too . . .)</p>
      <p>@hrant true that, and I'm doubly embarrassed to have misread Sudtipos (and Bart).</p>
      <p>I'll take solace in that I've done my best to repair my blunder.</p>
      <p>I've looked into pulling together a quick and dirty rework using only the "Ubuntu" font, in compliance with their license, to post an update which would replace it with such a revision (effectively deleting the old), but it turns out the change wouldn't be substantial enough to warrant renaming the font per their license terms (it would have to be "Ubuntu revision X by Y" or something like that), so that it would have to end up at a different URL (and therefore not overwrite the old version).</p>
      <p>So I think my last comment would be that if you bold "Ubuntu" by 35 em and condense it by 88 percent, it looks pretty cool. (And it's legal to do so, if you follow their license terms!) Not as cool as it might look to blend the vectors from that with "Mr. Giacco," but whoops--we can't do that! :/</p>
    html_clean: |-
      <p>Well, that's the thing, HVB--if you mean the .zip file at openfontlibrary.org, that's what it seems I have no way to delete (so that I'm waiting on their response). (And thanks for editing that, Chris. I'd actually prefer my posted emails be snipped, too . . .)</p>
      <p>@hrant true that, and I'm doubly embarrassed to have misread Sudtipos (and Bart).</p>
      <p>I'll take solace in that I've done my best to repair my blunder.</p>
      <p>I've looked into pulling together a quick and dirty rework using only the "Ubuntu" font, in compliance with their license, to post an update which would replace it with such a revision (effectively deleting the old), but it turns out the change wouldn't be substantial enough to warrant renaming the font per their license terms (it would have to be "Ubuntu revision X by Y" or something like that), so that it would have to end up at a different URL (and therefore not overwrite the old version).</p>
      <p>So I think my last comment would be that if you bold "Ubuntu" by 35 em and condense it by 88 percent, it looks pretty cool. (And it's legal to do so, if you follow their license terms!) Not as cool as it might look to blend the vectors from that with "Mr. Giacco," but whoops--we can't do that! :/</p>
