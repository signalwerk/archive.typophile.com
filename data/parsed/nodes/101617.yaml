      <p>Very honorable plan of action - thank you. I think once you pull the current version you can/should contact both Giaccone and Sudtipos and explain yourself. Unless they're crazy protectionists (of which there certainly are some out there, believe me) they will forgive your mistake and respect your corrective action.</p>
      <p>To be honest, if you don't announce that you re-used outlines it's hard for people to prove it; they can certainly <em>feel</em> it, but it's not actionable. So much of the junk on Dafont, etc. is covertly plagiarized, it's sad. And doubly sad when you have to watch people on the ID section of Typophile -which is essentially the watering hole of type design- suggest such fonts... And when you merely raise a red flag, they even have the gall to whine about being bullied... Clearly they don't want ethics cramping their style! But of course keeping such a shady genesis secret wouldn't make it OK - it might in fact make it less OK.</p>
      <p>BTW if Bart was indeed sending you into a trap, I can see where he's coming form. There's so much cavalier, remorse-less plagiarism going on, and so few people willing to change their attitude, that it can feel like the only way to get people to stop is to scar them. Me, I try the soft touch first (not that that always works either).</p>
      <p>hhp</p>
