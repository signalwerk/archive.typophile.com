      <p>Hrant, did you read the EarthboundExtraBoldFontSample PDF? </p>
      <blockquote><p>[Earthbound] was created by doing a 50/50 vector blend of the fonts “Ubuntu Bold” and “Mister Giacco Bold,” and it was tweaked from there. [...] I found Giacco Bold by running the title logo from the Super Nintendo video game of the same name through online font identification tools (such as whatfontis.com and whatthefont, I believe). I thought I might use Mister Giacco Bold as the logo and header font for my web site earthbound.io, partly just because I like it, but also because it's stylistically similar in ways to the font of said video game. I was very close to using it, however, I took another look through my font collection, and noticed it is strikingly similar to Ubuntu Bold. I was then undecided whether to use Giacco or Ubuntu, which led to the idea to blend them into one font, which I tried, and I love the result. I hope you may enjoy and find uses for it as well. If you do, please credit me and link to earthbound.io.</p></blockquote>
