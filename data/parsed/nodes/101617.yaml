      <p>hrant, no apology is necessary for saving me potential legal trouble :)</p>
      <p>(I'm frankly floored that sending outlines through an algorithm--no matter how much it alters the outline--I'm floored that this may not be OK. But on the other hand, if I had personally spent a lot of time and care creating an outline that someone else did that with, I can imagine myself not being OK with that.)</p>
      <p>Also, your suggestion (hrant) for reworking it sounds doable. (I was also thinking of redrawing guide contours from scratch, with both fonts as reference, and stroking those with a uniform width--if I'm using the right terms there--because I wonder if the stroke widths are uneven.)</p>
      <p>Meanwhile it looks like I better take down the release, and the .pdf sample here, which I think has the font embedded, and upload a revision at openfontlibary.org that only uses "Mr. Giacco" as visual reference.</p>
      <p>Bart, I frankly read that as a snarky way to expose me to potential trouble I was unaware of (I don't know whether I misread you there), but I may have a mind to call your bluff (if indeed you were having fun with me as I suppose), and find out Diego Giaccone's opinion directly.</p>
      <p>Assuming the attached .png image as a conceptual sketch could safely remain here (the image is of little or no practical use other than reference), I remain curious about any design feedback.</p>
