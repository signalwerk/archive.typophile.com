      <p>I didn't, sorry.</p>
      <p>Alex, it's probably an honest mistake (one that many people unwittingly make) but re-using the outlines of a commercial font is not OK. Even if a person thinks it's ethically OK (which I personally don't) it's actually legally not OK because the outlines are essentially code that define a font, so they're copyrighted. You're OK on the Ubuntu end, but not the Giacco end... So unless you get permission from Diego Giaccone and Sudtipos, to do the right -and legal- thing, you'd have to pull it, and redraw it (or not). Sorry for the bad news.  :-/</p>
      <p>And of course somebody making a derivative of Earthbound isn't OK either.</p>
      <p>Here's an idea: put Giacco in the background layer, and modify Ubuntu while referring to Giacco.</p>
      <p>hhp</p>
