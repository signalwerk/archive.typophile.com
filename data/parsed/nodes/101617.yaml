      <p>Haha, yeah I don't know what's up with the no-response. I hope it's a technical thing, like they get too much spam to have seen my emails, or their programmers are saying "Oh, crud, yeah, let's make it easier to delete a font than to manually delete entries from a database . . . " :)</p>
      <p>Re the spacing, I agree and have had no luck so far adjusting that (global bearing or kerning percent changes have butchered the spacing or crashed editors). This font simply copied new or changed glyphs directly onto the original Ubuntu spacing and kerning tables (I think--it seems Ubuntu Regular is itself very loose). I wouldn't release them thus, except for my hurry to at least post any kind of legit update.</p>
      <p>If/when I get the spacing improved, I may post the word "blurt" here.</p>
