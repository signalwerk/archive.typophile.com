    <p>Hello!</p>
    <p>Beginner here, playing with font development tools. I made (so far as my skill is able) and released a font yon:</p>
    <p>[URL removed my moderator]</p>
    <p>As it says there, it is a "blend" of "Ubuntu Bold" and "Mr. Giacco Bold."</p>
    <p>I welcome comments and feedback, as I'm curious what may need help with this. Although I probably wouldn't be able to implement feedback; my hope is that if anyone has a fancy for this, they'll use it as inspiration or a basis for something production-grade (whether it's usable for production, I have no idea).</p>
    <p>All of the source files are in the .zip distribution archive yon; attached here is a (very many-page) .pdf sample, as well as a .png sample showing all the glyphs.</p>
    <p>Thanks!</p>
    <p>[Attachments removed my moderator]</p>
