      <p>I have reworked this legitimately from scratch, and updated the distribution with that reworking, which should now be clear to download:<br>
      http:/www.openfontlibrary.org/font/earthbound-extrabold</p>
      <p>I took your suggestion, hrant/hhp (and thank you for the suggestion) of modifying the "Ubuntu" font, with "Mr. Giacco" as reference. This round, I only directly used Ubuntu outlines, and actually entirely redrew many glyphs, by making new beziers, along hand-drawn paths chosen from what my eye liked between Ubuntu and Mr. Giaccone's fine work :) I then expanded those beziers (and oh how fun it was to discover how to expand a line to an outline!) to the same dimensions as Ubuntu.</p>
      <p>(I have still seen no reply from openfontlibrary.org, by the way--even after I asked Sudtipos to forward my email to them--and they still list the prior, illigitimate version. The *newest* version is legitimate--I can't do anything about the old version; I've done my very best due diligence to have it removed . . . I hope they wake up to my request . . . )</p>
      <p>Accordingly (and after that perhaps arduously too long preamble), here are samples which I welcome anyone to pick apart; if you wish, please tell me what may work and not work for you in the fonts. I beleive they're different enough to warrant a new font name (and I believe my release files etc. comply with the Ubuntu Font License). Extensive .pdf samples are in the distribution yon.</p>
      <p>You may only notice the differences from the Ubuntu fonts if you examine both closely (well, I don't know, to my eyes they look quite different at a glance), so I'm including a sample of Ubuntu and Ubuntu Bold.</p>
      <p>Thank you again, y'all for your kind help.</p>
      <p>Earthbound Regular and Semi-condensed ExtraBold:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/EarthboundRegular-and-Semi-condensed-ExtraBold-FontSamples_5902.jpg"></div><p></p>
      <p>Ubuntu Regular and Bold, for comparison:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/UbuntuRegular-and-Bold-FontSamples_3608.jpg"></div><p></p>
