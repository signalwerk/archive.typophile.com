  html: |-
    <p>Hi all,</p>
    <p>I need a hand discovering what font is used in the following image:</p>
    <p><a href="http://www.syssol.ca/images/sub/4a_Rnav.jpg">http://www.syssol.ca/images/sub/4a_Rnav.jpg</a></p>
    <p>There are also other examples of this font all over the main page of our website - <a href="http://www.syssol.ca/main.htm">http://www.syssol.ca/main.htm</a> .</p>
    <p>We had this site developed 3-4 years ago, however the developers apparently “lost” the CD containing the PSDs, fonts, etc.  One of the guys contacted them and tried to ascertain the name of the font, but to no avail.  We’re doing an update and I can’t for the life of me find the font, which is making the creation of new buttons rather difficult.  ;)  Thanks for any help you may be able to provide.</p>
    <p>Regards,<br>
    - Nick</p>
