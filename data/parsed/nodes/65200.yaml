    html: |-
      <p>According to Mac McGrew’s ’American Metal Type Faces of the 20th Century’ Bookman Oldstyle is a result of thickening the strokes of the original Miller &amp; Richard design. The contrast, in particular, is much reduced. The ATF version shown from 1906 looks pretty much like itself, including the popular swashes. The low contrast allows for those meaty swashes, which are the blessing or curse of many shop signs. </p>
      <p>The descenders in the ATF version are even more squashed than later versions.</p>
