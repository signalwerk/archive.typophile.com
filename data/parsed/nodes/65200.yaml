      <p>The two main 19th century styles of text face, Modern and Old Style (which ironically came later) are pretty generic.<br>
      So Century OId Style is what one would expect a modern face, Century, to look like, given an old-style treatment.</p>
      <p>Most interestingly, it creates a huge scale of page.<br>
      Check out the large size in the 1925 Linotype Manual to appreciate how tight it sets, both in horizontal fit and vertically (as you note), it blows avery other face in the manual out of the water.</p>
      <p>It was well used for these qualities in the 1960s, 70s and 80s in advertising and brochures—making it far more popular, in my experience, than Bookman.</p>
      <p>I used Century Old Style quite a bit in the early 1990s as both a text and display face, but Bookman in its various manifestations always struck me as being too crudely fitted for nice typography. But perhaps people today are more appreciative, given the present interest in slab serif styles.</p>
