    html: <p>Phemister’s Old Style for Miller &amp; Richard became one of those iconic faces of its period as to be practically generic, and it spawned a number of imitations/inspired-bys. Century Oldstyle and Bookman Oldstyle are but two, evolving in slightly different directions.</p>
