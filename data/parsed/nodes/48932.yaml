    html: |-
      <p>Hi,</p>
      <p>As far as the plots go, it might be an idea to use gnuplot instead of MATLAB, and use the epslatex option terminal to produce the output, which renders all text (including number on the axis) natively in LaTeX.</p>
      <p>As for the PDF conversion, your LaTeX distribution might have come with pdflatex, which converts latex directly to PDF. Are you using MiKTeX? You might also look at <a href="http://www.toolscenter.org/" title="http://www.toolscenter.org/">http://www.toolscenter.org/</a> for a pretty good IDE that should automate the process for you.</p>
      <p>I hope this is useful.</p>
