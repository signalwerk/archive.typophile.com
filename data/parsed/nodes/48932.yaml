      <p>I just noticed a second problem - I’ve been using LaTeX -&gt; PS -&gt; PDF on a Windows machine.  I’ve just been viewing the PS in GSView and using its ’Extract’ option and ’pdfwrite’ to convert the file to a PDF.  I didn’t even notice at first - it was exaggerated on printing - but the font colour inside the PDF isnt actually black, but rather a dark grey.  Printing directly from GSView is fine, but conversion to PDF leaves the font this dark grey colour which, on printing (from the PDF), looks rather bad.</p>
      <p>Any suggestions?</p>
      <p>Thanks in advance.</p>
