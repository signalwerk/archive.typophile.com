    html: |-
      <p>&gt; pdfLaTeX couldnt handle including the .eps file.</p>
      <p>You can use the command epstopdf to get graphicname.pdf from graphicname.eps; with the graphicx package, pdflatex can then handle it with \includegraphics[width=\columnwidth]{graphicname} (or you choose the width you want).</p>
    html_clean: |-
