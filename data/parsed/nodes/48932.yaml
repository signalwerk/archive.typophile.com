    html: <p>Found the culprit... psfrag requires the color package, and for some reason just using the color package is whats causing the final pdf to have this dark grey font... weird.  Not sure whether its a bug or some genius decided that grey so dark its almost indistinguishable was just a good default font color.. but the option ’monochrome’ fixes it.</p>
