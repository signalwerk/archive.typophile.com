    <p>Hi,</p>
    <p>Im including some MATLAB plots in a LaTeX document and have used the psfrag package to (successfully) assimilate the axis labels and title with the font in my LaTeX document.  What I’m wondering is whether there’s a simple way to do the same for the axis scale labels (ie. the numbers that accompany the ticks along each axis).  I can use psfrag to manually replace each and every one, although its incredibly cumbersome.</p>
    <p>Is there a better way?</p>
    <p>Thanks.</p>
