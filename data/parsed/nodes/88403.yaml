      <p>I am just a font civilian but I have a similar dilemma/trilemma...</p>
      <p>My self-pub book will have this as the primary cover graphic...</p>
      <p><a href="http://www.mediafire.com/?rkxxrc9599dle6n" title="http://www.mediafire.com/?rkxxrc9599dle6n">http://www.mediafire.com/?rkxxrc9599dle6n</a></p>
      <p>I was keen on using Gotham Bold or Ultra for the cover and chapter headings, and Gotham Book for long text passages, and Gotham Light Italics for short vignettes of a few sentences to a few paragraphs that break up the text.</p>
      <p>But the comments about Gotham's unsuitability for text give me pause.</p>
      <p>So, I guess the go-to solution is Mercury or Miller... But if I am doing that I might as well go for (much cheaper) Proxima Nova instead of Gotham...</p>
      <p>Appreciate any suggestions for achieving a hip look. </p>
      <p>Gunnar</p>
