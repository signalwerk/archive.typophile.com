  html: <p>I'm currently designing an industrial design portfolio, and planning on using either Gotham Bold, Black, or Ultra for titles in all caps, and most likely Mercury for larger paragraphs (though I have also considered Miller). What I am looking for is a sans serif font that I can use for short sentences that go under photos in my portfolio. I don't want to use gotham because it looks too spaced out for a body text. Is there a second sans serif that I can use that plays well with both gotham and mercury? I'm looking for something that looks clean and modern, and that is easy to read on a mainly white background. What would you suggest?</p>
  html_clean: <p>I'm currently designing an industrial design portfolio, and planning on using either Gotham Bold, Black, or Ultra for titles in all caps, and most likely Mercury for larger paragraphs (though I have also considered Miller). What I am looking for is a sans serif font that I can use for short sentences that go under photos in my portfolio. I don't want to use gotham because it looks too spaced out for a body text. Is there a second sans serif that I can use that plays well with both gotham and mercury? I'm looking for something that looks clean and modern, and that is easy to read on a mainly white background. What would you suggest?</p>
