    html: |-
      <p>I like the look of Whitney in smaller sizes a lot, but I don't like Whitney's angles so I don't want to use it for headings. I want to use Gotham Ultra in all caps for the headings because I want something that is modern, simple, geometric, and somewhat architectural. Because it's for an Industrial design portfolio, where the headings are all that are going to be read during the first look through, the headings typeface is very important to me. Having said that, I don't like the look of Gotham for body font, so my hope was to use only capitals for titles, and then another font for the short captions. I am aware that this is not common practice, but was wondering if there was a way to make it work?</p>
      <p>I'm looking at Benton Sans as a way of meeting in the middle, and using it for headings and body text, but although I like it for body text, I wish it was more geometric and came in as thick of variations as Gotham does.</p>
      <p>Is there a font similar to Gotham that also reads well as body text?</p>
