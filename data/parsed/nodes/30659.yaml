    html: |-
      <p>jeez, talk about WAY late to this conversation — wish I had known earlier!</p>
      <p>This typeface was actually completely hand-drawn, though, may have been based off of another typeface from the era. That being said, I haven't been able to find any evidence that it was nor have I been able to find any evidence as to who actually did draw this typeface for the film. Going out on a limb, thus far my guess is that it was either Godard's editor Agnes Guillemot, some random, uncredited genius, or Godard himself (which I'm not discounting).  </p>
      <p>I'm actually in the midst of creating a typeface inspired by the these titles in masculin-feminin (in my free time, so it is taking a while). During my research, I found out that Godard was actually the nephew of Maximilien Vox—who was still alive during the production of these films, so perhaps he played a role as well. I got in touch with Godard's production company in search of the truth, but have yet to hear back....but will keep trying.</p>
      <p>Attached an images from my typeface that is in the works...hopefully coming sooner rather than later!</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/agnes_5_4626.gif"></div><p></p>
