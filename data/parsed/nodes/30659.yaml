    <p>There was a post by 'ktz' back in October I found in the archives about this font. I watched the film the other night and loved the typeface too. The sample ktz found did look hand drawn - but I think there must be a mechanical version, check out the attached sample I came accross. Can anyone have another go at identifying this for us?</p>
    <p>cheers,</p>
