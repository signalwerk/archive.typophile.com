    <p>This is my new typeface Turbine. It will be part of the fontfont family soon but I think it is still a lot of work to do. The idea is quite simple: A squarish grotesk with open apertures. I would be very happy to get some comments and suggestions.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Turbine_TypeSpecimen_2014_1_4468.gif"></div><br>
