    <p>Hello guys,</p>
    <p>I am currently working on a little website + logo for a friend, you can hardly call it a website. Its just one page really. </p>
    <p>This is what it looks like right now: <a href="http://img.skitch.com/20100219-tpjdn2re3sbmsnps8qn46cph5w.jpg" title="http://img.skitch.com/20100219-tpjdn2re3sbmsnps8qn46cph5w.jpg">http://img.skitch.com/20100219-tpjdn2re3sbmsnps8qn46cph5w.jpg</a></p>
    <p>I am pretty satisfied with it already though I dont really know what I am doing HTML wise (nor typograhphy wise haha).</p>
    <p>I'd appreciate if some of you could share their knowledge and help me to further improve the design. Which web font for instance do you think works the best with Gotham Bold?</p>
    <p>Thanks. Jake.</p>
