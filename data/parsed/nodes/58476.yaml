  html: |-
    <p>I’m trying to remember the name of a typeface I saw not too long ago on the type ID board (I don’t remember anything else about the context except what the face looked like).</p>
    <p>Clues:</p>
    <p>• It is an unbracketed slab serif of medium weight<br>
    • It is <strong>quite</strong> extended<br>
    • The capital K splits like a Helvetica K<br>
    • The capital J has a ball terminal<br>
    • The capital R’s leg hooks up in the Clarendon fashion</p>
    <p>Bonus clue:</p>
    <p>• I also saw it recently on one of my grandmother’s circular Springbok puzzles. The puzzle dates back to 1965, so the face is predigital.</p>
