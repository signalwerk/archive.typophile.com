      <p><em>If you are willing to overlook the fact that Ratzinger is against free speech, he’s a great guy.</em></p>
      <p>I don't think he is against free speech. In his role as prefect of the Congregation, he insisted that people teaching <em>in Catholic institutions</em> should agree not to teach anything contrary to Church doctrine. That doesn't seem to me an unreasonable requirement, and people not willing to accept that requirement left and went to teach at non-Catholic institutions. They continue to publish and to teach, just not in Catholic colleges.</p>
      <p>During the twenty-two years that Ratzinger headed the Congregation, only one theologian, Tissa Balasuriya, was excommunicated: for misrepresenting the doctrine of original sin and casting doubts on the divinity of Christ. If one doesn't accept such basic Christian beliefs, it seems to me one effectively excommunicates oneself <em>latae sententiae.</em> The excommunication was rescinded only a year later, after discussions in which Balasuriya clarified his opinions to the satisfaction of the Holy See. Ironically, given the charge that Ratzinger is opposed to free speech, the most important thing that came out of the whole Balasuriya episode, were new norms of investigation by the Congregation <em>aimed at safeguarding the rights of theologians accused of unorthodox opinions.</em></p>
      <p>The only other excommunications during Ratzinger's time at the Congregation were of seven women who were illicitly ordained by a schismatic priest, himself illicitly declared a 'bishop' by a schismatic sect.</p>
