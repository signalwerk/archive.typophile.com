      <p><em>doesn’t the bible predict that these kinds of things will happen in the end times?</em></p>
      <p>War and rumour of war? Yes, but then there has never been a time in many, many millennia when human beings somewhere on this planet were not engaged in war. It is a perrenial state of human affairs. So war isn't a very reliable indicator of coming end times.</p>
      <p>More importantly, Christ urges us not to try to guess when the end will come, but instead to be always ready for 'the thief in the night'. I don't think the revelation, or Apocalypse, recorded by St John on Patmos is given so that we can read it like so many entrails to guess what will happen when. Rather, it is an image of the final judgement against which we can judge ourselves <em>now,</em> and a promise of the renewed creation.</p>
      <p>Ideas about the end time are one of the largest areas of disagreement between Catholicism/Orthodoxy and fundamentalist protestantism of the kind believed by many members of the Bush administration. The whole notion of 'the rapture' -- the taking up of the elect before the tribulation --, which is central to the fundamentalist hope for the Apocalypse, has never been a part of orthodox Christian teaching: it is the invention of late 18th and early 19th century American 'dispensationalist' ministers, most widely popularised by John Darby, founder of the Plymouth Bretheren. The word 'rapture' does not occur anywhere in the Bible: it is an English corruption from the Latin <em>simul rapiemur</em> (shall be caught up together) from 1 Thess 4:15-17. Ironically, in this very passage St Paul makes it clear that he is referring to what happens to the just who are still alive at the time of the resurrection of the dead at the Second Coming. There is no way that the fundamentalist fantasy of the rapture can be derived from this passage.</p>
