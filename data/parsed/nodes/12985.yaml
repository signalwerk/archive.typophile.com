      <p><em>the Boy Scouts</em></p>
      <p>I'm an Eagle Scout, and I worked for the Boy Scouts of America locally for a brief time. During that time, a regional manager gave us the "official speech" regarding homosexuality. Until that point, I had always argued (vehemently), that as a private organization, the Boy Scouts of America had a right (upheld by the US Supreme Ciurt on multiple occasions) to choose its own memebership policiies. After I discovered what the people who ran the organization were really like, I lost a lot of my resepect. Basically, he told us (after making some insulting remarks not just about homosexuals, but also about journalists, democrats, and Americans in general) that the organization could not admit gay leaders because one church had threatend the organization with cutting off all funds should they change their policy. I won't name this church, but it was at the time the biggest ecclesiastic financial supporter of the organization, and had told the Scouts that it would even form a <em>counter</em> movement, should the organizers get out of line.</p>
      <p>That was not moral values (on behalf of the Scouts, I mean… on the church's part, maybe). Money was more important to them than holding on to a belief or making a stand. I would have had more respect for them if the talk had been something like, "we think this is wrong. period." But that was not the case.</p>
      <p><em>If you disagree with Catholicism or any other organization, club or institution, go get enlightened and create your own. (Speaking highly simplistically of course.)</em></p>
      <p>But the Catholic Church has a long history of being reformed from within. It has been a cycle for over a millenium. Of course one has to hold on to a certain set of beliefs to be a Catholic. But there are certain traditions within the Church that are not doctrinal. That Jesus is divine, the resurrection, etc, that IS Doctrine. The Immaculate Conception and Mary's Assumption into Heaven, even the Papal infallability that made these beliefs dogmatic, those are Doctrine, too. How the Church will live in the modern world is not a dogmatic decision to be made, but rather a question of dialogue, love, charity, and relationships (with God, and with each other).</p>
      <p>__<br>
      <a href="http://www.typeoff.de" title="www.typeoff.de">www.typeoff.de</a></p>
