      <p>Blackletter isn't always blackletter… I like Fette Frakture. I just don't like it in this application, because I think that it is inappropriately spec'd. I would react the same way if something equally as wierd, like Hobo, would be on the screen.</p>
      <p>Fette Fraktur is one of the best Romanticist frakturs. For Revolution of 1848 things, or for 19th Century-type Gemütlichkeit advertisements, it is great. There is a local museum in the next town over with the word "Heimatmuseum" painted across it in Fette Fraktur. Just perfect!</p>
      <p>This site seems to be a legit fan club (if it was tounge-in-cheek, like <a href="http://www.whitehouse.com" title="www.whitehouse.com">www.whitehouse.com</a>, then a real Nazi-like <a href="/wiki/Schaftsteiffelgrotesk" class="freelinking" rel="nofollow">Schaftsteiffelgrotesk</a> like <a href="/wiki/Tannenberg" class="freelinking" rel="nofollow">Tannenberg</a> would be appropriate). I would recommend something really Catholic and old-school. Like a <a href="/wiki/textura" class="freelinking" rel="nofollow">textura</a>. </p>
      <p>These can be hard to come by in digital form. But <a href="/wiki/Karlgeorg%20Hoefer" class="freelinking" rel="nofollow">Karlgeorg Hoefer</a>'s Notre Dame is a start. Or maybe something Reformation/Counterreformation. Benedict the XIV strikes me as a real Counterreformation-type of guy, even though I've heard that he admires Martin Luther. Why not get the best of both typographic world and use a <a href="/wiki/Swabacher" class="freelinking" rel="nofollow">Swabacher</a>? <a href="/wiki/Elsner%20%2B%20Flake" class="freelinking" rel="nofollow">Elsner + Flake</a>'s Alte Schwabacher is good. Another good choice might be a real decorative Bavarian fraktur, something that would fit in on a beer label from one of the brewery's near Benedict XIV's home town. That might seem wierd, but it would have a lot more of a tangible connection that this!</p>
      <p>Blackletter can be so lyric (here is just one <a href="http://www.typeoff.de/?p=27" rel="nofollow">example</a>, which I happend to photgraph today). Fette Fraktur is a great old jobbing face. But it has nothing to do with Benedict XIV, the Catholic Church, or this funny website.<br>
      __<br>
      <a href="http://www.typeoff.de" title="www.typeoff.de">www.typeoff.de</a></p>
