      <p>I'm often amazed at how people want to push notions of 'free speech' onto private organizations like churches, the 4H Club, the Boy Scouts, et cetera. Ironically, people pushing that agenda are treading on the free speech of the very organizations they claim to want to improve. Corporations  and public (governmental) institutions are one thing, but private organizations (clubs, private schools, churches, newspapers) are quite another.</p>
      <p>Why should you or anybody else have to apologize for a religious leader calling their followers to follow (and removing from their positions of authority those who will not)? The notion of a God-run organization (as the Catholic church purports to be) answering to the will of the people is strange at best and heretical at worst.</p>
      <p>If you disagree with Catholicism or any other organization, club or institution, go get enlightened and create your own. (Speaking highly simplistically of course.)</p>
