      <p>The Church is in the late stages of her 500-year cultural struggle with protestantism, which is now primarily a struggle with the highly sucessful materialist and effectively atheist societies that protestantism has produced. As you say, Dan, the Church has a long history of reform from within, but the sign of that reform has always been that the Church cleaves <em>more faithfully</em> to its perrenial teachings, i.e. that it to some degree withdraws from its engagement with the world and the values of the world, and reaffirms its distinctiveness from the world. As Christ said to his apostles: 'You are in the world but you do not belong to the world'. This is what the Church is called to be: in the world but not of the world. So the question 'how will the Church live in the modern world?', cannot be framed in terms of the values of the world -- which are in any case inconstant and largely deterministic --, because as soon as you frame it that way you have already surrendered and given up on your vocation. These things that you list: dialogue, love, charity*, and relationships are exactly right, because they are part of that vocation, and also because, genuinely pursued, they are counter to the simultaneously sentimental and cynical values of our society, which treat dialogue, love, charity, and relationships as either 'warm feelings' of license or as means to power and possession.</p>
      <p>* Charity, of course, <em>is love;</em> specifically, Christian love, as distinct from eros and also from agape. The principle quality of charity that distinguishes it from other forms of love is freedom. There is a deterministic element to both eros and agape, in that each is preceded by a bond (of attraction or of family).</p>
