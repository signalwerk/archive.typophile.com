      <p>In <em>Typographical Printing-Surfaces</em> (1916), Legros and Grant present the at sign and the <em>Arrobas</em> sign as two different signs (or three if you count italic).<br>
      At is the familiar @, with a plain terminal that ends on the middle of the right side of the glyph.<br>
      Roman <em>Arrobas</em> has a two-story a and a taller, thinner enclosure that ends in a ball terminal below the a’s stem.<br>
      Italic <em>Arrobas</em> has a one-story a and ends in a somewhat swashy thickening at the bottom of the glyph.<br>
      </p><div class="imageWrap"><img src="/files/atsignlegros_3669.jpg"></div><p></p>
