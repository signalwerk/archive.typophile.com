      <p>That’s a great link, and it has badly dented my scepticism. In fact it sent me to the abbreviations at the back of my big dictionary of the Real Academia Español, 14th edition 1914 (didn’t think of looking there), where @ is shown for the arroba.</p>
      <p>And that document of 1775, with its well-shaped @s, is impressive. It’s pretty late, though. It would be good to have more and earlier examples, from Italy, Spain, England... </p>
      <p>The examples of typographical @ for arroba given in the link are very English or North American in appearance, as Spanish types in the 19th century often are, so were maybe made for ‘at’ and adopted for the other purpose.</p>
      <p>And I’d clearly misread Lapi...</p>
      <p>Well now. What about a typographical @ earlier than 1822?</p>
