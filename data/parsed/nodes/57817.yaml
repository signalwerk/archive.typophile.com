      <p>That claim by Professor Giorgio Stabile of his discovery of the @ sign in a document of 1536 has been doing the rounds for years, but to be fair to the professor he doesn’t claim it in quite these terms.</p>
      <p>“One can’t say this is the first example of its use, as ancient financial institutions may have earlier examples lying forgotten in their archives,” Stabile said over iced tea in Rome’s scenic Piazza Navona. The professor discovered the document while doing research for a visual history of the 20th century, which is due to be published by the Treccani Encyclopedia. In the document a trader called Francesco Lapi describes the arrival in Spain of ships bearing treasure from Latin America. “There an amphora of wine, which is one thirtieth of a barrel, is worth 70 or 80 ducats,” Lapi wrote in his letter, sent from Seville to a colleague in Rome. “No symbol is born by chance,” Stabile said. “This one has represented the entire history of navigation on the seas and has now come to typify travel in cyberspace.”</p>
      <p>I forget where I found this fancy piece of stuff, but it is all over the Web.</p>
      <p>What I wonder is, how many early financial documents Stabile looked at. Italy was the home of some very sophisticated accounting practice a long time before the 16th century, and there are plenty of surviving archives that have been studied. I shouldn’t be surprised to learn that there is a symbol looking like @ in much earlier documents from one of the big trading or banking centres like Venice, Genoa, Milan or Florence. It might be worth asking one of the economic historians who read these archives.</p>
      <p>And I’m no palaeographer, but I personally doubt if @ has anything to do specifically with amphoras of wine. (But just a moment. Wine imported to Europe from the New World in 1536. That has to be a first.) Or with the Spanish weight called the <em>arroba</em>. The term <em>arroba</em> is derived from Arabic, and probably dates from a long time before the <em>reconquista</em>. Maybe there is a symbol for the <em>arroba</em> (or even the amphora) that looks a bit like @. Incorrigibly sceptical as I am, I suspect that the term <em>arroba</em> was only recently adopted as a convenient Spanish (and French) name for a symbol that didn’t have one. If there is proof to the contrary, please let us see it.</p>
      <p>Less excited historians do indeed seem to agree that the modern @ is simply a flourished form of Latin <em>ad</em> (at), for use in repeated lines of accounts containing phrases like “so many pounds or barrels of something at – @ – so much per pound/barrel”. Commercial documents are full of abbreviations or symbols for other Latin commercial terms like £ (capital L) for <em>libra</em> (pound as currency), <em>per</em> (for which we keep the Latin word), % for <em>per centum,</em> and &amp; for <em>et</em>. The so-called <em>solidus</em> or forward slash (maybe a long s) for dividing shillings and pence (<em>solidi</em> and <em>denarii</em>) is another. So we are lucky that the computer keyboard – which is a typewriter keyboard (and typewriters were designed as office machines) – was not cluttered with the symbols for more of them, like <em>per</em>, which can be quite elaborate. These symbols were made as types for commercial printing and schemes for printers’ type cases in the 19th century show them. </p>
      <p>If it’s of interest, here is @ in a specimen of the Miller foundry in Edinburgh dated 1822:</p>
      <p></p><div class="imageWrap"><img src="/files/Miller P2 p 1822 with @ - 500_4030.jpg"></div><p></p>
      <p>Is this a typographical first? Or are there offers of something earlier? </p>
      <p>Perhaps Dr Stötzner can tell us. <a href="http://www.signographie.de/cms/front_content.php?idart=145" title="http://www.signographie.de/cms/front_content.php?idart=145">http://www.signographie.de/cms/front_content.php?idart=145</a></p>
