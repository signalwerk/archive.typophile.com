  html: <p>For those of you who are interested in <a class="freelinking-external" href="http://en.wikipedia.org/wiki/Orthography">orthography</a>, I came across this which speaks of what may be <a class="freelinking-external" href="http://bits.blogs.nytimes.com/2009/05/05/internet-star-least-473-years-old/">the first known use of the @ symbol</a>. Orthographic history is really *not* one of my stronger suits, so I can’t confirm or deny this. Just thought it may be of interest.</p>
