    html: <p>While the current <a href="/wiki/www.rae.es" class="wiki-create">DRAE</a> has the symbol in its entry for arroba, at least up until mid 1900s I couldn’t find an example of its use in the dictionary.  Not to say it wasn’t used as an abbreviation before computers, in fact the entry in the DPHD makes it sound like it was used before and then simply “popularized” because of computers, but in terms of being common enough to make it into the dictionary ... doesn’t seem so.</p>
