      <p><cite>“ … the at sign and the Arrobas sign as two different signs”</cite></p>
      <p>An interesting sample! But I would not term it “two different signs”. It’s just *three different glyphs* and two different uses. (See also the two different glyphs for Pound at the left side.)<br>
      And this bobble terminating the tail – punchcutters game, hardly more than that.</p>
      <p>However, the actual intersting aspect of this sample is that an upright two-storey (at) occurs in lead type *at all*.</p>
