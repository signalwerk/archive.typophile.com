      <p>I am delighted to see Mr. Mosley respond to that. I can not offer a printed sample antedating 1822 (one can hardly beat a St. Bride’s scholar in a matter like this ;-).<br>
      As for paleography, surely more investigations into old manuscript archives would have to be undertaken. 1538 is impressively early. The only hint on a possible even earlier usage I found was in a paleographers manual from Portugal (see <a href="http://www.signographie.de/cms/front_content.php?idcat=143" title="http://www.signographie.de/cms/front_content.php?idcat=143">http://www.signographie.de/cms/front_content.php?idcat=143</a> ). The indication of “52” at the first @ in this image means “1520 decade”. Unfortunately, no original source is specified in that booklet.</p>
      <p>If any further research upon the @ emerges I am prepared to register it under Signographie.de/Focus. </p>
      <p>Finally, cheers to Mr. Mosley for the “Dr” Stoetzner, but I have to refuse this honouring unless a kind of “Dr occ[assionis] c[ausa]” may apply ;-) .</p>
