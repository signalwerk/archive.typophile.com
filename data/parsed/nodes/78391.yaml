  html: |-
    <p>Two excellent releases from Font Bureau.<br>
    Condor is nicely done in a very tricky genre, and it grew on my over the weeks it was Featured Face at Typoophile.<br>
    Bullen is flat out awesome — a quite "authentic" piece of historical fiction, with suitably inventive italics.</p>
