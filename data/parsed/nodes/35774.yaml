      <p>In design school they started us off with... </p>
      <p>The Elements of Typographic Style by Robert Bringhurst</p>
      <p>And it scared the crap out of all of us, definetly not what I would call a begginer book, definetly an intermediate (once you get the basics down) book though, and re-reading it since college has really been great.</p>
      <p>I would actually suggest...</p>
      <p>Thinking with Type: A Critical Guide for Designers, Writers, Editors, &amp; Students by Ellen Lupton</p>
      <p>Its a fantastic begginer book, and I think the more contemporary refrences and samples she shows will help you relate alot better than bringhurst's more "classic/elite/typesetting" approach.</p>
