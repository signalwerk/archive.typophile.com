      <p>Check out this page under Typophile's Resources section:<br>
      Resources-&gt;Books-&gt;<a href="http://www.typophile.com/books/typography" rel="nofollow">Typography</a></p>
      <p>There's actually a book called <a href="http://www.amazon.com/Type-Typography-Phil-Baines/dp/0823055280/ref=pd_bbs_sr_1/104-4581592-5638319?ie=UTF8&amp;s=books&amp;qid=1186416060&amp;sr=8-1" rel="nofollow">Type &amp; Typography</a> by Phil Baines and Andrew Haslam that works as a pretty good introduction, but I'm not sure if it's been reviewed on Typophile yet. Otherwise Bringhurst's <cite>Elements</cite> is a decent way in.</p>
