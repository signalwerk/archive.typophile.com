    <p>Hi guys,<br>
    I came across this site after long hours searching online for typography help.</p>
    <p>I have many questions, to begin with here's a little something about myself.<br>
    I'm a young web designer. I've been on the field for about six months so I'm still learning everything that heads towards me.<br>
    About two weeks ago I got my evaluation at work. I got some really good feedback on the type of work I do.<br>
    My boss mention I should improve myself in typography. At first I was really shock to hear I needed improvement on the area where I thought I had it under control or at least thought I knew enough.</p>
    <p>I guess I'm completely clueless about typography.<br>
    Right now I have no idea how to start, what book to read or what classes should I take..etc.</p>
    <p>My question is:<br>
    Where is the starting line to typography?</p>
    <p>More like baby steps for me right now. I really love my job. The only concerned is my lack of typography and I don't want this to effect my job.</p>
    <p>Thank you in advance. </p>
    <p>-KG</p>
