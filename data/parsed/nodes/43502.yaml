      <p>I’ve never been to Russia, but you will certainly need a visa in order to enter. You will probably have to apply for this long in advance. I have even been told (although I cannot verify this yet) that you have to book your accommodation before you can apply for a visa. Your hotel will send you a letter that states that you really will be staying there at the certain dates, etc.</p>
      <p>I’ve been to the past four ATypI conferences, and am really looking forward to this year’s. I’m sure that even a little bit of Russian would go a long way in St. Petersburg, but I’ll be so busy writing my dissertation in the weeks (and days…) leading up to the conference that I doubt I will be able to learn any myself.</p>
