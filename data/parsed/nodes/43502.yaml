      <p>Technically you cannot get tourist visa (which is strongly recommended) until you have your hotel booking. So any “visa service” includes hotel booking.</p>
      <p>For hotels there are 2 options: small hotels (also called “mini hotels”) and regular hotels. Small hotels may be unusual: sometimes they occupy only a part of the building. So you may share building entrance with either regular (and usually quite old) condo. It somtimes is interesting and lets you better feel how it is here. But there will be no lobby bar :). Most mini hotels are in walking distance from conference venue in the area which is filled with restaurants and caffees.</p>
      <p>There are few regular hotels. “Moscow” is the one where we have booked many rooms (<a href="https://web.archive.org/web/20081008041751/http://www.hotel-moscow.ru/english/home.htm" title="http://www.hotel-moscow.ru/english/home.htm">http://www.hotel-moscow.ru/english/home.htm</a>). It is OK, w<!--
