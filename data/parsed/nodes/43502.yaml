    <p>So I have been thinking of submitting a talk to Atypi for the 2008 meeting in St. Petersburg Russia. Any thoughts on what it will cost to be there? Have you been there before? What did you do? How much Russian (language) do you need to learn? What about visa/entry issues?</p>
