  html: '<p>Association Typographique Internationale (ATypI) Annual Conference  <br>Prague, Czech Republic, 30 September � 3 October, 2004  <br> <br><b>CROSSROADS OF CIVILIZATIONS</b> <br>The conference, which is co-produced by the Academy of Arts, Architecture and Design in Prague (Vysoka skola umeleckoprumyslova) will focus on the special creative contribution of the Central and East European design world and its relation to international typographic developments. In addition, there will be papers covering many aspects of the creative work of typographic designers worldwide. The conference program is being developed by the ATypI 2004 Program Planning Committee. Members are Alan Z�ruba, Frantisek Storm, Peter Bilak, Filip Blazek, Pavel Zalenka, Erik Spiekermann, Adam Twardoch, Emil Yakupov and Maxim Zhukov.  <br> <br>The ATypI 2004 Program Planning Committee invites submissions of abstracts for presentations on themes related to the contributions of Central and East Europe design worlds, as well as on general subjects of typographic interest. Appropriate topics include, but are not limited to: typeface design, outstanding individuals in the field, typographic media new and old, font technology, printing history, the use of type in graphic design, multilingual typography, and design education. Proposals are welcome for practical demonstrations as well as lectures and panel sessions.  <br> <br>Abstracts should include the title of the proposed presentation, the presenter�s name(s), a short summary (approx. 100 words) suitable for publication in the conference program and a short biography of the presenter (approx. 100 words). Please also indicate the length of the presentation if it is shorter than forty minutes. Forty minutes is the maximum length for a lecture or demonstration, including questions, but panel sessions may run longer and include short presentations by participants. The deadline for submissions is 1 March 2004.  <br> <br>Presentation proposals should be sent to the Program Planning Committee by e-mail to &lt;<a href="mailto:pragueprogram@atypi.org">pragueprogram@atypi.org</a>&gt; or by mail to  <br> <br>ATypI 2004 Prague Conference <br>ATypI Secretariat and Conference Office <br>6050 Boulevard East, #2H  <br>West New York, New Jersey, USA <br> <br>About ATypI: Association Typographique Internationale is the only worldwide organization dedicated to type and typography. Founded in 1957, ATypI provides the structure for communication, information, education and action within the international type community. ATypI annual Conferences are attended by delegates from more than 40 countries. Recent conferences have been held in Vancouver (2004), Rome (2003) and Copenhagen (2002). <br> <br>For more information, visit <a href="http://www.atypi.org" target="_blank">http://www.atypi.org</a> or contact the ATypI Secretariat &amp; Conference Office. <br> <br>ATypI Secretariat &amp; Conference Office <br><a href="mailto:secretariat@atypi.org">secretariat@atypi.org</a> <br>6050 Boulevard East, #2H  <br>West New York, New Jersey, USA  <br>t. +001 201-453-1526  <br>f. +001 201-861-3365 </p>'
