    <p>I am curious about the limits of <a href="/wiki/fontlab" class="freelinking" rel="nofollow">fontlab</a>, if there are technical boundaries I suppose. I am working on some font projects that are super complex– I don't think there are any glyphs that have less than a few thousand nodes, many are 10,000+ At this point I have about 33 glyph cells filled, but I was hoping to potentially do hundreds (at least the most basic roman set, but with extensive OT substitutions). </p>
    <p>The problem is though that fontlab crashes when importing some of the images (from illustrator), but generally if I can cut down on the number of nodes it works. However, generating the font files never works. Fontlab crashes instantly with any setting. I saw at this thread <a href="http://typophile.com/node/4173" title="http://typophile.com/node/4173">http://typophile.com/node/4173</a> that turing off the compressing subroutines could help, but no luck for me.</p>
    <p>Is this simply an issue of too complex designs? I have already oversimplified these images more than I originally hoped and even if I could simplify them further, I still don't have as much in here as I want. Maybe there is something else going on unrelated to the number of nodes.</p>
    <p>Thanks for the help.</p>
    <p>Rob</p>
  html_clean: |-
