      <p>I wonder if there is a reason you feel you need these complex graphics to be accessible as glyphs in a font? I ask because of the way fonts are used; In early PostScript days people played with very noisy fonts and many discovered upper limits on output devices. SInce then, it's very unusual to see glyphs in typefaces that use as many as one thousand nodes, much less multiple thousands. is it likely someone will be setting pages with the font you are making? I imagine each glyph would need to be quite large for the detail to be evident. What is so complex about them? Are they halftones? Maybe this is something that should simply exist as EPS files.  </p>
      <p>Or, as an alternative, have you considered making a Photofont? Since the size of the picture resources there is your only technical limitation, you could put any amount of detail in the images.</p>
    html_clean: |-
