      <p>While I was/am hoping to make a full font of glyphs, I have thought about ideas similar to your idea Hrant.</p>
      <p>It would be where each font only has one or a few pre determined phrase that would make an image. Either it would be one large one made broken up into parts like you said, or it would be smaller individual elements that would be arranged into a larger composition. Those concepts would work in some ways for me, but they fall short in the aspect that it looses a lot of it's "font" nature where there is less opportunity to make your own image with your own word combination. It makes it more of a puzzle that you assemble with only one outcome rather than legos which you can make into anything. </p>
      <p>But, seeing as how a significant aspect of this project is dealing with technology, I am restricted by what that technology can handle. My ideas have be flexible to adapting to the current limitations. It might be the situation now where they will have to start out simpler, maybe with only a few possible compositions from each font, then eventually they can get more extensive as computers and softwares advance.</p>
