      <p>My plans for this overly complex font I am preliminary calling an "art font." It isn't consisting of letters, nor is it a traditional dingbat font. There are images, some have halftone-like patterns, most are simply intricate. I am not considering it a dingbat though because, in theory, the scales and locations of the glyphs would change depending on what you type. Open Type substitutions are highly necessary for this to work, because I want to be able to type something and then have the different letter combinations or entire words and sentences change the composition the images make. </p>
      <p>That maybe sounds confusing. Basically, I want to use words and phrases to create collaged images. Conceptually though, it is important this this is a font, that works, and not just an EPS image.</p>
      <p>Rob</p>
