    <p>The problem is though that fontlab crashes when importing some of the images (from illustrator), but generally if I can cut down on the number of nodes it works. However, generating the font files never works. Fontlab crashes instantly with any setting. I saw at this thread <a href="/node/4173/" title="http://typophile.com/node/4173" class="link-kept">http://typophile.com/node/4173</a> that turing off the compressing subroutines could help, but no luck for me.</p>
    <p>Is this simply an issue of too complex designs? I have already oversimplified these images more than I originally hoped and even if I could simplify them further, I still don't have as much in here as I want. Maybe there is something else going on unrelated to the number of nodes.</p>
    <p>Thanks for the help.</p>
    <p>Rob</p>
