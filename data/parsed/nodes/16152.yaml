      <p>Chris,</p>
      <p>The fact that it is a font that creates the image is key. In some cases the composition that is made would be random due to what the user would type, but other times there would be keyword substitutions that would in some ways make a predetermined image created by me. This is also, in some ways, about technology and the technology's role in the process. The process of me making the "software," the software making the image, and the final output of a printed (or digital) picture and a font file. </p>
      <p>In an "art" setting, say a gallery, I would like to sell the pieces as buying the rights to that phrase, therefor you would purchase the image and or just the font file (I don't know yet), but then you could recreate that exact image simply by typing the phrase. The idea is similar to some of the early conceptual artists like Mel Bochner. He did his "measurement room" pieces where he used tape and (helvetica I believe) number stickers on the walls to measure all the dimensions of a room. The only tangible element that he sold though were the plans and directions on how to measure the room– that way the buyer could recreate the piece in other spaces. </p>
      <p>Rob</p>
