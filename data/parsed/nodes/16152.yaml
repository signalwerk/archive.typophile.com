      <p>I remembered reading something about this somewhere and found this in Stephen Moye's <em>Fontographer: Type by Design</em> book (page 23):</p>
      <p>"<strong>14. Avoiding long paths.</strong> Finally, avoid excessively long and/or complex paths. To se why, read the following passage from <em>Adobe Type 1 Font Format</em>: 'many versions of the PostScript interpreter have an internal limit of 1500 flattened path elements per character; exceeding this bout results in a limitcheck error. Each character outline in a given font design must not exceed this limit when rendered.'"</p>
      <p>A glyph with over 10,000 nodes would hit that limit rather quickly, I would imagine. I realize it's Type 1 fonts Moye is writing about, but I would think other font formats have similar limitations (particularly PostScript-flavored OpenType fonts).</p>
    html_clean: |-
