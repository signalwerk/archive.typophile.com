    html: |-
      <p>No matter how you twist it, it will ALWAYS come down to the Type 1 limitation at some point: </p>
      <p>1. When a document that uses an OpenType PS font is printed on a PostScript printer, the printer driver converts it to one or more Type 1 fonts since PostScript (at least Level 1 and 2, but I think also 3) don't have the notion of the CFF format. The conversion is lossless so there is no quality loss because the glyph definitions in OpenType PS and Type 1 are based on the same drawing model. </p>
      <p>2. Some applications, e.g. Corel Draw, *always* convert TrueType / OpenType TT fonts to Type 1 when sending them to the printer. While PostScript Level 2 and 3 understand TrueType natively (encoded as so-called Type 42), yet Corel's printing engine doesn't use it. Note that FontLab applications do a smart conversion from TrueType to PostScript curves by removing unnecessary points in the destination PostScript outlines. However, the Corel printing engine does not do that so the increased number of on-curve points in the TrueType font results in a converted Type 1 fonts with the same, relatively large number of nodes. So a complex TrueType font is even more likely to make the PostScript printer crash when used with Corel Draw. </p>
      <p>3. The PostScript printer driver on Windows has the ability to convert TrueType to Type 1 the same way as Corel Draw does. This is off by default in the printer driver if you use a modern PostScript printer, but with some imagesetters and older printers, it's on. Then, the "Corel" limitations apply to all applications that the user uses. The Mac OS printer driver has similar capabilities though I don't think the user has explicit control over it as on Windows (but I may be mistaken, I don't know the Mac OS printing subsystem well enough). </p>
      <p>Regards,<br>
      Adam</p>
