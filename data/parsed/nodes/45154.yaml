    html: |-
      <p>Don't lapidate me, but I sometimes actually like to use underline: when writing letters (i.e. e-mails as well), underlining for emphasis gives it an additional "hand-written" note without having to resort to italics for body text, which is an overkill for readibility.</p>
      <p>You know, they say, there is no bad type, only people who cannot use it. I think, this applies for most design elements, including underlining. (Though I'm not claiming to know how to use it, I'm pretty confident about using it in that context).</p>
      <p>Szabolcs</p>
