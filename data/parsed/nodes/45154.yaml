    html: |-
      <p>Another workaround would be to make two character styles, one with underlines and one without. After your text is set, you can easily replace critical characters ( , „ ¿ g j p q y for example) with the find&amp;change function (Menu/Edit/Find&amp;Change). There you would only replace the character styles and the chosen characters will have a gap in their underlining.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Bild_6122.png"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Bild3_3767.png"></div><p></p>
      <p>(hope the second picture helps ;-)</p>
