    html: |-
      <p>Sure. Get the underline through the character palate. One of the options is *offset*. Change that until you clear your descenders as much as you want.</p>
      <p>The snippet below is down &amp; dirty; looking at it, it needs a bit more weight (I used .33 points for the rule) and still a bit more offset, but it does clear the descenders.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/underline_3759.gif"></div><p></p>
