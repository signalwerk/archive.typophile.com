    <p>Hi Everybody, </p>
    <p>Hope the weather is as good where you are as it is here, and that you're not stuck in an office like me…</p>
    <p>Quick question;</p>
    <p>Does anyone know if in InDesign it is possible to set underlines to miss out descenders - so that there is a small gap? </p>
    <p>Best wishes, </p>
    <p>Graham</p>
