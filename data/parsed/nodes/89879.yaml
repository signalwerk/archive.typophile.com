  html: |-
    <p>Dear members,</p>
    <p>I have a specific geo-typographic question and was hoping you could help me out. I'll be travelling to Brussels towards the end of the month and I'll have a couple of days' spare time on my hands - I wanted to know whether you could possibly suggest some sights of typographic interest in the vicinity. I'll certainly visit The Printing Museum, but other than that I haven't found very much on the Internet.</p>
    <p>Thank you very much in advance for your suggestions<br>
    and all the best from Budapest,</p>
    <p>Akos</p>
