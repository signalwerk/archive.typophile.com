    votes: null
    html: |-
      <p>Kerning: horizontal space adjustment between two glyphs. Part of the typeface design.<br>
      Tracking: horizontal space adjustments during typesetting. Not part of the typeface design.</p>
      <p>IMHO the problem is rather the narrow space between H and I.</p>
    html_clean: |-
