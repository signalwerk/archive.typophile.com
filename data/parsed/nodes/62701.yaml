    html: |-
      <p>djipster -- Don't be afraid of decreasing the space in R A P.</p>
      <p>paragraph -- If there were no tracking applied to the word, the A would stand out even more. Tracking, in so far, has a positive effect rather than a negative one. Unfortunately it didn't help much in this case.</p>
