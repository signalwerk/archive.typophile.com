  html: <p>I just found this forum and boy am I lovin it. I'm glad I'm not the only branding nut out there. I will probably utilize this board some as I am kinda an island to myself at my job and don't really get much extra creative input. Anyway - here is one that I just wrapped up - I just want to get some feedback on it. <br> <br>The company sells a couple of very specific software suites (ComputerEase - an accounting software and LaserFiche - a document management software) does networking, and sells some hardware. They came with more of a blaze orange color in their design history and a logo that was pretty dated. <br> <br>I wanted to subtly enforce the idea of a computer screen through the shapes in that particular font.  I also wanted the logo to show support and partnership (the m and v were a bonus) as they move into a consultancy role. We also use that shape repetitively on some pieces as a pattern (see folder) and some broad solids of the orange and blue. <br> <br>Looking forward to comments/criticisms/snide remarks etc... <br> <br>I will try and post some of the other items later that go with this identity <br><img src="http://www.typophile.com/forums/messages/29/40478.jpg" alt="MicroVision"><img src="http://www.typophile.com/forums/messages/29/40479.jpg" alt="folder"></p>
  html_clean: <p>I just found this forum and boy am I lovin it. I'm glad I'm not the only branding nut out there. I will probably utilize this board some as I am kinda an island to myself at my job and don't really get much extra creative input. Anyway - here is one that I just wrapped up - I just want to get some feedback on it. <br> <br>The company sells a couple of very specific software suites (ComputerEase - an accounting software and LaserFiche - a document management software) does networking, and sells some hardware. They came with more of a blaze orange color in their design history and a logo that was pretty dated. <br> <br>I wanted to subtly enforce the idea of a computer screen through the shapes in that particular font.  I also wanted the logo to show support and partnership (the m and v were a bonus) as they move into a consultancy role. We also use that shape repetitively on some pieces as a pattern (see folder) and some broad solids of the orange and blue. <br> <br>Looking forward to comments/criticisms/snide remarks etc... <br> <br>I will try and post some of the other items later that go with this identity <br><img src="http://www.typophile.com/forums/messages/29/40478.jpg" alt="MicroVision"><img src="http://www.typophile.com/forums/messages/29/40479.jpg" alt="folder"></p>
