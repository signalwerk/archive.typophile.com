    html: <p>excellent. <br> <br>love the fact that the icon is made up of the "m" and "v" and the subtle hint of the computer screen is great. <br> <br>nothing to critique really as it is a finished piece . . .although nothing i could think of would improve this logo...well, except the logo by itself that you posted looks as though you have centered the icon above the "ov" (where the two words join). i am not sure this works for me, it looks unbalanced. the logo works great the two ways you have it formatted on the folder (that is what it is, yes?) <br> <br>anyway. great job. i look forward to seeing more of your work and getting feedback from you as well with posts. welcome to the forum. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br></p>
