      <p>There are doubtless ways you can get it illegally, but short of that, I don't know of anything. It's a retail, commercial font. You can always try contacting the vendor (Hoefler &amp; Frere-Jones, contact info above) and see if they can do anything for you. Of course, a large portion of their clientele is freelance designers, so I don't immediately see why they would discount it for you.</p>
