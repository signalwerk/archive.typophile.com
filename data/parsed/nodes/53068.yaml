      She was discovered barely alive after bleeding for two days in an empty house without food, water or heating near her home. Her relatives found the charred bodies of her father Daud (42) and two brothers Ismat (12) and 'Alaa (11) victims of a projectile from an Israeli tank or jet plane, and at first thought she was burned too. When they found her she only had five units of blood left in her and was immediately hospitalized. Her first words to her rescuer were "sorry uncle, I stayed in your home without your permission".</p>
