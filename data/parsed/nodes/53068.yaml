      <p>The above text translate as:<br>
      "In the Name of God the Merciful and Compassionate"<br>
      "Long Live the Steadfastness of Gaza"<br>
      "Dear Hasan: May God give you patience and comfort these days"<br>
      "We pray that the smile will return to the children of honor"<br>
      This last is the result of a fortunate type error where a dot was deleted from the word Gaza غزة to make it 'Eza عزة-honor.</p>
      <p>Below is a verbatim record of a text chat with Hasan made on Dec. 6 2008 in the 'peaceful' cease-fire days when Gaza was six months into a devastating  Israeli blockade that prevented foods, medicines and gasoline from reaching the area, resulting for example in daily electricity cuts.  Hasan's Arabic is translated within square brackets.  I answered in English or transliterated Arabic  because of my slowness to type Arabic.  Hasan's often-repeated refrain لا زلنا نقرع جدران الخزان that "‫we still knock on the walls of the water tank" refers to the novel <em>Men in the Sun</em> by Ghassan Kanafani (available from Amazon) where a group of  Palestinians try to cross the desert smuggled inside the tank of a water truck to seek work in the Gulf. Before they perish from the heat of the sun they pound the walls of the tank to call for help.</p>
      <p>Here is the chat, initiated by Hasan.  The text formatting is garbled in places because of the difficulty of alternating right-to left Arabic lines with English left to right ones. I apologize to Hasan for publishing his private remarks, but they show his gentle poetic spirit and the ironic humor that help him survive impossible conditions:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/hasan_4732.jpg"></div><p></p>
      <p>8:24 PM<br>
       me: hello dear Hasan how are you?<br>
       Hasan: Thanks<br>
        I am fine<br>
        and you<br>
       me: and the situation?<br>
        tamam elhamdillah [fine, thank God]<br>
       Hasan: Very Good<br>
       me: good<br>
      Hasan:<br>
        ‫لا زلنا نقرع جدران الخزان‬<br>
        ‫الحمد لله اتبعنا النصيحة‬<br>
      8:25 PM<br>
       ‫وصرنا ننام بكير‬</p>
      <p>We still knock on the walls of the water tank. Thank God we now followed the advice to sleep early]</p>
      <p>me: ya haram..bas elmneeh annak laysa wahdak..<br>
      [poor guy, but its good you are not alone]<br>
      8:26PM Hasan<br>
       ‫علشان الصحة نراها كيف تصير‬<br>
        ‫ولا نت ولا كمبيوتر من أجل عيوننا‬<br>
        ‫والأكل خففنا، والمشي جربنا، وما عاد نحتاج مستشفيات ‫فسكرت</p>
      <p>[and see how health improves. No internet or computers benefits the eyes and we no longer need hospitals because they have closed]<br>
      me: aah hadi iuqta muhemme...la takrahanna shay'an la3allahu khayrun lakum!<br>
      [This is important.."Hate not something it may turn out for your good!"]<br>
       Hasan: ‫وصرنا نعتمد بالأكل على الخضروات الطبيعية لأنو ما في غاز‬</p>
      <p>[and we rely on raw vegetables becausae there is no gas<br>
      me: nuqta muhemme<br>
      [an important point - [correcting a typo]]<br>
       Hasan: ‫هاها‬<br>
       [haha]<br>
      me: sharru alamr ma yudhek!<br>
      [the worst happening is one that makes you laugh]<br>
      8:27 PM me: what do you think will happen?<br>
       Hasan: ‫الفجر قادم‬<br>
        ‫عما قليل تشرق الشمس[The dawn is coming. Soon the sun will shine]</p>
      <p>22 days later the Israeli jets started pounding Gaza and contact with Hasan was cut...</p>
