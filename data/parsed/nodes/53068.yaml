    <p><img src="/sites/default/files/old-images/Hassan_6370.gif"></p>
    <p>. </p>
    <p>Please join us in praying for our typography colleague and friend in Gaza, Arabic type designer Hasan Abu Afash, and wish him, his family, and his people peace and safety.</p>
    <p>The text above is set on Adobe InDesign ME Tasmeem using his fonts, Hasan Hiba, Hassan Noor, and Basim Marah. Hasan worked very hard on these fonts in the past year and half in blockaded, electricity deprived, Gaza.  He is a self-taught, talented, typographer and a hardworking family man.  His third baby was born few months ago. Here is what he wrote us on Christmas eve, 2008:</p>
    <p>Happy Holidays to ALL.<br>
    Please pray for me (us) in my terrible situation here in GAZA.<br>
    Hasan</p>
    <p>Please visit his "Hiba Studio" website to appreciate his hard work and dedication to Arabic typography on the occasion of the new year. We are sure this can help alleviate some of his suffering in Gaza today:</p>
    <p><a href="http://hibastudio.com/">http://hibastudio.com/</a></p>
    <p>Hasan's typography friends.</p>
