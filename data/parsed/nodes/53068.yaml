      <p>No news is...bad news. The military operations are being enacted in civilian neighborhoods so there is that danger. There is no gasoline for electricity which affects the water supplies. There is lack of food and medication and the hospitals are overloaded with care for the wounded. It makes for an ongoing humanitarian catastrophe. </p>
      <p>Today a friend e-mailed me the URL of another Gaza graphic artist. Omayya Joha is a cartoonist, designer, and mother of a child called Noor ('Light', a popular Arab name which is also the name of one of Hasan's fonts). She also holds a degree in mathematics. This seems to be the only page in English about her on her website, an interview with Al-Jazeera:<br><a href="http://www.omayya.com/new_omayya/carton-206.html">http://www.omayya.com/new_omayya/carton-206.html</a></p>
      <p>We pray for the safety of Hasan, Omayya and their families, for a cease-fire and a just peace.</p>
