      <p>Israel is obviously opposed to the money ending up in the hands of Hamas,<br>
      and British law mandates that should a British organization enter into any sort of negotiations with a terrorist group, that organization's leaders will be brought to trial and may be sentenced to jail, the source said.</p>
      <p>"Therefore, Israel and BG have come to a new understanding of transferring<br>
      the money into an international account - allowing the deal to go through,"<br>
      he said.</p>
