      <p>The question is also not whether Israel did everything it possibly could to free Gaza. It certainly didn't, because it feared attack. But if you are going to have peace you have to reduce the fears of both sides. What Israel did was a marked REDUCTION in control over Gaza. Gone were the Jewish settlements and gone were the check points within Gaza. If Hamas were interested in peace, the thing to do was reciprocate, and show good will. But instead it showed rockets aimed at civilians in Israel. </p>
