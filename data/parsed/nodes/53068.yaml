      and 10% of the revenue, estimated to be worth hundreds of millions of dollars a year, is to be designated for the PA's Palestinian Investment Fund, under the auspices of the office of Palestinian Authority President M. Abbas.</p>
      <p>"However, now that the PA is no longer in control of the Gaza Strip,<br>
      or the marine area off of its coast, Israel, should it purchase the gas,<br>
