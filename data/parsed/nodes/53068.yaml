      Any reading of the Old Testament shows that even with a state of their own in Palestine after ancient Israel (which defeated the Canaanites who were there before them), as well as every other state in the area before or since, has been subjected to the constant invasions from all directions by armies ranging from those of Alexander the Great to the Mongol invasion, the Crusaders who massacred Moslems, Jews and Christians in Jerusalem on an equal footing, to the current US-Israeli alliance that is  subjugating large chunks of the Middle East and beyond. It is like building on quicksand. Neither the Zionists nor Hamas nor anyone else can ever fulfill a dream of permanent exclusive domination of the land. The Bible also says "the meek shall inherit the land": a democratic solution is the only way in Israel-Palestine, or whatever the place will be called in the future, if that can ever be achieved through mutual agreement. At one time I thought it should be called the Land of Abraham because he is respected by all the people involved. But this sort of speculation is unimportant in the face of the humanitarian crisis facing the people of Gaza today. In a chat Hasan said he took a walk in his neighborhood and was appalled by the extent of the devastation...he said "my mission is to record the pain and the sighs..." but then said that he cannot do that because he does not have a laptop that can be used in periods when the electricity is unavailable, nor torches to see with at night. Hasan and Gaza deserve this and much much more.</p>
