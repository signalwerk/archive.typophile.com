      <p>John said <em>Israel is in many ways an impressive country whose small population has made remarkable achievements in e.g. the fields of medicine and agriculture</em><br>
      There are many remarkable Israelis and institutions, no one is denying that they made good use of their statehood. But by 'agriculture' are you referring to the 'making the desert bloom' myth? Palestine was always a fertile land (milk and honey anyone?) and in the mid 19c. the Arabs of Jaffa used to export oranges to Europe, well before the Zionists came to settle and in time expel most of the original people of Jaffa. Far from encouraging agriculture, in the West Bank Israel has uprooted hundreds of thousands of olive and citrus trees to make Israelis-only roads and settlements. See for example  <a href="http://books.google.com/books?id=NmXBmOGbHL4C&amp;pg=PA124&amp;lpg=PA124&amp;dq=Israel+destroyed+olive+trees&amp;source=bl&amp;ots=EJ3JCpSyLp&amp;sig=n64R6qrBgd9Bk9EXWA0-0G9QGCA&amp;hl=en&amp;sa=X&amp;oi=book_result&amp;resnum=1&amp;ct=result#PPA123,M1" title="http://books.google.com/books?id=NmXBmOGbHL4C&amp;pg=PA124&amp;lpg=PA124&amp;dq=Israel+destroyed+olive+trees&amp;source=bl&amp;ots=EJ3JCpSyLp&amp;sig=n64R6qrBgd9Bk9EXWA0-0G9QGCA&amp;hl=en&amp;sa=X&amp;oi=book_result&amp;resnum=1&amp;ct=result#PPA123,M1">http://books.google.com/books?id=NmXBmOGbHL4C&amp;pg=PA124&amp;lpg=PA124&amp;dq=Isra...</a><br>
