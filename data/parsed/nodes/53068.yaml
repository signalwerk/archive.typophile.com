      <p>According to the original bilateral arrangement between Israel and the PA,<br>
      some 60 percent of the revenues from the sale of the gas will go to BG;<br>
      30% will go to BG's partner in the deal, the British energy company CCC,<br>
      and 10% of the revenue, estimated to be worth hundreds of millions of dollars a year, is to be designated for the PA's Palestinian Investment Fund, under the auspices of the office of Palestinian Authority President M. Abbas.</p>
      <p>"However, now that the PA is no longer in control of the Gaza Strip,<br>
      or the marine area off of its coast, Israel, should it purchase the gas,<br>
      would no longer be making payments to the PA, but rather would have to pay Hamas," explained the BG source.</p>
      <p>Israel is obviously opposed to the money ending up in the hands of Hamas,<br>
      and British law mandates that should a British organization enter into any sort of negotiations with a terrorist group, that organization's leaders will be brought to trial and may be sentenced to jail, the source said.</p>
      <p>"Therefore, Israel and BG have come to a new understanding of transferring<br>
      the money into an international account - allowing the deal to go through,"<br>
      he said.</p>
      <p>The deal appears to exclude Hamas from receiving any of the revenues from the gas sales.</p>
      <p>Hamas, meanwhile, intends to ask for changes in the agreement with BG, Bloomberg reported two weeks ago. "It is unreasonable that the owner of the gas, Palestine, gets 10% only," Mohammed al-Madhoun, the director of Hamas leader Ismail Haniya's office, told the Palestinian Information Center, a Hamas Web site.</p>
      <p>"The government has no problem cooperating with the British gas company but only after modifying some points of the 1999 contract."</p>
