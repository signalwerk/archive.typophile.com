      <p>Vladimir, thank you for the news from our friend Hassan. It is good to know that he is personally safe and in good morale, though the news of his cousin's family is devastating.</p>
      <p>Saad: <em>Appeasing wrong only make more wrong.</em></p>
      <p>One aspect of the overall tragedy of the situation in Palestine is that 'hawks' -- those who want war -- on both sides characterise any compromise as 'appeasement'. So, the hawks in the Israeli Likud party called it appeasement when Sharon withdrew from Gaza and from south Lebanon. And they said that Hezbollah and Hamas would exploit this withdrawal to bring in more weapons, longer range rockets, to strike at Israeli towns and cities. And sadly, they were right: this is exactly what Hezbollah and Hamas did, just as they have always exploited every period of 'ceasefire' for the same purpose. [Although in the case of Gaza, Hamas not only used the withdrawal to prepare for more rocket attacks on Israel but also to launch an internal war against Fatah.]</p>
      <p>So the vicious circle goes around again: the hawks on both sides feed each other's desire for war. Any compromise is seen as a weakness to be exploited and characterised as appeasement when the exploitation is realised.</p>
