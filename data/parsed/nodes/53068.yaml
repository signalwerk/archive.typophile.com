      <p>This is hypnotic...I have been watching the poor dove retreat away from the advancing  text over and over and over. At least it has dropped the dagger so peace may yet be achieved. The slogan says <em>May God grant victory to our brothers in Gaza</em>. No mention of the sisters. The unblinking dot on the G makes it look like the Arab letter ghain to complete the name of Gaza غزة in Arabic...its well-intentioned, and rather sad. </p>
      <p>The following drawing by the Gaza cartoonist Omayya Joha was uploaded to her website three days after the Israeli offensive began.The text says <em>O Gaza we will redeem you with our souls and blood</em> She signs her name with a key, symbolizing the key to her original family home in Palestine, now Israel.<br>
      from http://www.omayya.com/new_omayya/carton-206.html</p><div class="imageWrap"><img src="http://typophile.com/files/PIC20090110231815_5304.jpg"></div><p></p>
