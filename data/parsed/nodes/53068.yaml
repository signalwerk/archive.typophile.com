      <p>Vladimir: <em>No but the the Holocaust has been always invoked to distract attention from the crimes of Israel against the Palestinians, and to pile feelings of guilt on people who are innocent of that older crime, to make them support Israel.</em></p>
      <p>I think this is a common misunderstanding of the reason why the Holocaust is invoked: it has nothing to do with guilt. It has to do with the historical reality of the vulnerability of Jewish minorities in non-Jewish states, which culminated in the targeted destruction of the most economically secure and culturally assimilated Jews in Europe: the German Jews. It is a mistake to think that the Holocaust is invoked in order to instil a sense of guilt in today's generations of Germans or other Europeans with their own histories of anti-semitism; it is invoked as <em>evidence</em> that Jews have never been safe in any land that they cannot call their own, even when they had been assimilated into German culture and lived as German citizens for many generations, even when they thought themselves safe and secure and prosperous.</p>
      <p>Historically, Jews fared better as minorities in Muslim states than in European state, but they were still treated as second-class citizens, obliged to pay special taxes that Muslims did not have to pay, and restricted in the public exercise of their religion. So when the constitution of Hamas declares that all of Palestine is an Islamic <em>waqf</em> -- an inalienable religious endowment for all time -- the Jews consider this unacceptable (and I don't imagine Arab Christians are too thrilled by the prospect either!) The Jews want not only to inhabit their historical homeland, but to govern themselves and not to be subjugated.</p>
      <p>Of course, the Palestinian Arabs want the same thing, on the same poor piece of land.</p>
