      <p>Dear Colleagues<br>
      Dearest Hasan</p>
      <p>i hope hasan and his beloved family are Ok in Gaza.<br>
      i was also trying to contact him for the last 5 days but i am not able.<br>
      neither by email nor by phone.</p>
      <p>usually i always see him online on ichat or so...<br>
      and we chat so technical OT stuff or just friends talk...</p>
      <p>he always asked me to pray for him and all of the Palestinians living in Gaza in the end of each chat we had.</p>
      <p>and even before bombing started, they were in not able tog et so much food supplies, electricity was always coming only few hours (so it was like precious time when he is online for us to exchange all the needed info...), and the humanitarian issues were getting worse and worse by the day.</p>
      <p>and now it is always a question of how we can help.<br>
      but actually there is very little that we can actually do.<br>
      or maybe even nothing, due t the Israeli extreme blockade on the Strip.</p>
      <p>i hope i will read him own comment in this thread soon.<br>
      and i hope the bombing of Gaza will stop soon.<br>
      and no more innocent blood is shed.</p>
      <p>peace</p>
      <p>Pascal Zoghbi</p>
