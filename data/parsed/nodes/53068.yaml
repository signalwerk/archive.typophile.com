      <p>Saad: <em>...unlike with “holy war” it was originated as a *defensive* act and it is not limited to combat and war.</em></p>
      <p>If, by 'holy war' you are referring to the crusades of the Middle Ages, the first crusade was raised in response to a direct request from Byzantium for the Latin Christians to help defend against Muslim conquests, which had gradually eaten up the lands that had been part of the Byzantine Empire for several hundred years. The immediate cause was the expansion of the Seljuk Turks into Anatolia. Since western Christian's were unlikely to be sufficiently motivated by assisting Byzantium hold onto its territory, the focus became the recapture of Jerusalem and the Holy Land. Note: <em>re</em>capture, to take back what had been taken.</p>
      <p>Ironically, the crusader attitude to the Holy Land has much in common with Hamas' view of Palestine as an eternal Islamic <em>waqf</em> -- that which was Christian/Muslim once is Christian/Muslim for all time.</p>
