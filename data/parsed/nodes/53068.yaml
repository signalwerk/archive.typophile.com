      <p>Saad, the question is what is the Palestinian "cause". If it is to eliminate the Jewish state, then the attack after 12 days is understandable as a continuing battle in a war. </p>
      <p>But I cannot see any way that it is a move designed to produce peace. You keep answering some other question, not why IF HAMAS WERE INTERESTED IN PEACE, they would have attacked Israel with Qassam rocket attacks only 12 days after Israel withdrew, which Palestinians had said they wanted for years and years. You have never addressed the "if" part of my question. Israel and I think most of the world saw the attacks as an act of war in answer to a concession, a step toward peace. </p>
      <p>Saad, it is not an Israel-Egypt truce, but a peace treaty. As the <a class="freelinking external" href="http://en.wikipedia.org/wiki/Israel-Egypt_Peace_Treaty" rel="nofollow">wikipedia web site shows</a>, it says "Peace" in English, "Shalom" in Hebrew and "Salam" in Arabic. The reality is a peace treaty; whether you like it or not is another matter. </p>
      <p>Your repeated statement that Jews and Arabs live side by side in peace in a democratic country is conditioned on your other view that the area must live under a majority Islamic state. Have I understood you rightly? In other words you reject a two-state solution, right?</p>
      <p>As I have said, because of recent history in the near future Jews will not trust a majority Muslim or Christian or any other population to keep them safe. So if you want to eliminate the Jewish state, rather than accept a two-state solution, even as a temporary solution, then you have a prescription for war. Do you disagree?</p>
      <p>There is only one country in the Middle East where substantial numbers of Muslim Arabs and Jews are living peacefully side by side in a democratic state, and that is Israel. And and they have done so for 60 years. The Muslim Arabs are also legally equal. I don't deny that Israel has discriminated against its Muslim citizens, but that is most likely to be remedied if there is peace.</p>
