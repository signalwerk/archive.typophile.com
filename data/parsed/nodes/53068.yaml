      <p>Saad, I am happy to hear that you want both Israelis and Arab Palestinians to live in peace in the land. I am still not entirely clear whether you mean by this a two-state solution. Clearly Aziz does not accept this. </p>
      <p>Your statement that Jewish immigration was stealing land illegally is not my understanding from reading the history, unless you mean that the British mandate and their laws where illegitimate. Almost all Jews under the British lived on land legitimately bought from local land owners, as I understand it. </p>
      <p>Aziz, I never said that the Palestinians were responsible for the holocaust. But what I did say is that the Israeli Jews won't give up control of the bullets--control of state power--because they know what happened when they didn't have the means of self-defense. You and many others are so filled with anti-Jewish hate that you are willing to believe neo-Nazi lies, such as the pages you linked to here. That kind of thing gives Israeli Jews zero confidence that they can survive without control of their own state.  </p>
      <p>I have been reading about the background to this, and the picture I am getting is this: The Jewish settlers under the British mandate where mainly worried about the European powers who were in control in Palestine as well as main Arab powers, and failed to attend to the needs of the local population, and to talk with and negotiate with them. There were honorable exceptions to this, such as the group of Jewish intellectuals lead by philosopher Martin Buber, who advocated a bi-national state. However, both the Arab powers and locals paid little attention to this group.</p>
      <p>If there was neglect and obtuseness on the Jewish side, on the Arab side there was violent intolerance. Amin Al-Husseini, Mufti of Jerusalem, as discussed in the other thread incited anti-Jewish riots and allied himself with Hitler in attacking the Jews. These anti-Jewish killings led most Jews to think they needed a militia to protect themselves, and they organized it. But in any case when the UN was considering what to do with Palestine, the Arab powers rejected also a bi-national state--one with Jewish and Arab cantons, on the model of Switzerland. And they began to lay siege to the Jews to drive them out, or at the very least remove any possibility of self-government, even on a local level. </p>
      <p>Fatah until 1992 and Hamas today have said they want to destroy the Jewish state, so that the Jews are without bullets, and only reliant on the benevolence of those currently spew anti-Jewish hatred. As I said, Israeli Jews will never willingly accept being left defenseless.</p>
      <p>Currently the best hope is that with a new US and Israeli government, and the Arab governments now willing to support a two-state solution, a negotiated peace will finally happen. If Netanyahu gets elected in Israel, I am more fearful of the possibilities of peace. But it was the right-wing Begin who made peace with Egypt, so maybe there will even be hope with Netanyahu, I don't know. Also there is great danger of Hamas provoking Israel into another war, as Hamas leadership seems to prefer war and death as preferable to a two-state solution. But Europe as well as the US and Egypt want to restrain Hamas. So I see hope for peace in the fact that Europe, the US, Israel and the Arab powers all want a two-state solution, even if the road ahead is filled with difficulties and dangers.</p>
