      <p>Vladimir: <em>Neither the Zionists nor Hamas nor anyone else can ever fulfill a dream of permanent exclusive domination of the land. The Bible also says “the meek shall inherit the land”: a democratic solution is the only way in Israel-Palestine, or whatever the place will be called in the future, if that can ever be achieved through mutual agreement.</em></p>
      <p>I agree with this statement.</p>
      <p>Israel is in many ways an impressive country whose small population has made remarkable achievements in e.g. the fields of medicine and agriculture that could be and should be shared with all the region. The possibilities for mutual prosperity, which is the best foundation for stable peace, are great. But that is impossible so long as there is unwillingness to share the land.</p>
      <p>I am familiar with the voices of those in Israel, very many of them, who protest the treatment of the Palestinians, because these voices are heard in the newspapers and because Israel is a society that permits dissent. But it is very difficult to hear the voices of Palestinians -- and I presume they must exist -- who want to find ways to live alongside the Israelis in peace, nor am I surprised, since the rhetoric of the men with the guns is that Zionists must be driven out of the land.</p>
