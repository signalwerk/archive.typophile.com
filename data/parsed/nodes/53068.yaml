      <p>John, I am disappointed that here our Arab colleagues are not criticizing the extremists on their own side, as I have criticized and rejected those on the Jewish side--and the Israeli press indeed has a lot of questioning and criticism. </p>
      <p>It reinforces my feeling that fanatic, self-destructive hatred of Israel by Arabs is the biggest obstacle to peace. The Israelis know they have to get out of the occupied territories; Sharon's aggressive and destructive fantasies are over--even Sharon knew that. But the fanatics on the Arab side who want to destroy the Israeli state still rage, and have a huge following. </p>
      <p>Yesterday, on Shabbat I had a memorable experience when I saw the old retired Rabbi at our synagogue. He teased me, saying "Praying today? something must be weighing on your mind?" --He knows I like to study more than pray.</p>
      <p>And I told him about this and the other thread, and those suffering in Gaza. He replied,</p>
      <p>"I was there when we had no bullets. And I saw what happened."</p>
      <p>He was referring to when he arrived at Auschwitz, and was separated from part of his family. He saw ovens across the fence, and said to another young man "That must be a bakery." And other young man, from Poland, said "No they are burning our families in those ovens." He couldn't believe it, and said to his friends from his small town: "Don't talk to those Poles; they are depressing." But he very soon found out that it was all too true. Most of his family, and Jews from his town, perished in those ovens. </p>
      <p>He went on to say, "Do I grieve for the mothers who have lost children? Yes, absolutely. Do I grieve for Hamas? No. To defend yourself is a good thing." By the way, he has 40 relatives who have been running from Hamas rockets in southern Israel, for years. </p>
      <p>The demand here that Israeli Jews give up their bullets--which is what the demand to give up control of a state amounts to--is not going to happen willingly. Land can and will be compromised, but not that. Too many remember what happened when we didn't have any bullets.</p>
