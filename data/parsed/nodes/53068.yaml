      <p>Saad, I agree that the conflict between the Palestinians and Israelis is not a religious struggle. Like almost all wars from the beginning of time it is about land and resources, although expressed in modern notions of statehood. However...</p>
      <p>While the interpretation of jihad as spiritual and moral struggle is both valid and longstanding, so too is the use of the term as applied to military struggle against unbelievers, including the spread of Islam by conquest. This can't simply be ignored or denied, when so many Islamic sources, including the Qur'an, use the term in exactly this way. The word, like many others, has more than one meaning. It is no more honest to ignore its historical meaning as a war against the infidel than it is to ignore its meaning as a spiritual and moral struggle.</p>
      <p>Further, the term has been adopted by militant groups both specifically, e.g. Jamaat al-Jihad and Palestinian Islamic Jihad, and generally, in referring to themselves as jihadi. This is not an association that was imposed on these groups by the west, this is an association they chose for themselves.</p>
