      <p>Saad, according to timelines I am reading on Wikipedia, Israel withdrew all its forces in 2005. Also Sharon said that Israel intended to withdraw from the West Bank, though I don't remember how specific he was. Israel did control entry and exit to the Gaza strip, but there was no blockade. Twelve days after the complete withdrawal the rockets from Gaza resumed. This more or less guaranteed that the Israelis would continue control the borders in an effort to stop the rockets and import of other weapons. </p>
      <p>I want to know why Hamas did this rocket fire except to provoke and continue war? The rockets into Israel have been condemned by human rights organizations as a violation of human rights, as well as the Hamas firing of them from highly populated areas. The fact is that this was an unprovoked attack after a peaceful move that was very difficult for Israel.</p>
      <p>If they were at all interested in building a peaceful solution why would they do this? </p>
      <p>It was only after the Hamas coup d'etat against the Palestinian Authority in 2007 that both Israel AND Egypt started a blockade, sometimes eased, sometimes not, until the invasion in December. But Hamas didn't attack Israel in 2005 because of a blockade in 2007. And they didn't attack Egypt in 2007 or 2008, who also blockaded.  </p>
      <p>To build toward peace, efforts of one side to stop hostilities need to be responded to on the other side. A peaceful effort of Israel, even if incomplete, was answered with bombs against it. Are you telling me that they didn't have a choice? Or that the choice to bomb was promoting peace?</p>
      <p>Again, I am not saying that Israel hasn't done a lot wrong, but how is Hamas continuing rocket fire justified?</p>
