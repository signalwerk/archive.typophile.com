      <p>If you are alluding to Islamic "Jizyah" tax of 1000 years ago, this *was* tax for any non Muslim group in exchange for not being drafted in the army.  It is a protection tax that was completely abolished centuries now!  The first Iraqi Government in 1920s, included three Iraqi Jewish cabinet members! That is more than the Shiites had, and definitely not a second class citizens treatment!  </p>
      <p>&gt;&gt;The Jews want not only to inhabit their historical homeland, but to govern themselves and not to be subjugated.</p>
