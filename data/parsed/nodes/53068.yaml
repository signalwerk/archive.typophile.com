      <p>&gt;&gt;it is invoked as evidence that Jews have never been safe in any land that they cannot call their own, even when they had been assimilated into German culture and lived as German citizens for many generations, even when they thought themselves safe and secure and prosperous.</p>
      <p>Why exaggerating? As ugly as the Holocaust will for ever be, Jews were not safe only in a *specific* limited time periods and at a *specific* limited locations.  This happened and could happen to *many* groups of people at many other time periods and locations, before and after the Holocaust.  One does not need to conclude that they must then be living alone in their own state to be safe! But if one must do that, why not choosing an **empty** land in Germany or England for that purpose?</p>
