      <p>Saad, I'm afraid I see many here, and in the Middle East as feeding the "Angry Wolf" rather than the "Wise Wolf".</p>
      <p>Operationally, you can tell that the compassionate wolf is being fed in three ways. First there is a real effort to listen to other parties and to try to understand the way those who disagree with you view the situation. That listening is different from two monologues. </p>
      <p>In particular you can see that if one asks a question, the other answers it, to the point. For example I asked here why Hamas continued to shoot bombs into Israel after Israel had withdrawn from Gaza. Neither you, nor Aziz, nor Vladimir answered. Further, Aziz posted links to Neo-nazi holocaust-denying sites, which frankly no one believes unless they want to feed hatred of Jews. Everyone else recognizes that they are full of hate-filled lies.  </p>
      <p>Second, you can see if one is willing to acknowledge the truth of the other side's statements, and where they are right. And you are willing to acknowledge where your side has been wrong. I have condemned the aggressive policies of Sharon which led to settlements in Gaza and the West Bank, the extensive first Lebanon war, etc. And I have prayed for the survival of our colleague in Gaza. To me that is feeding the compassionate wolf. </p>
      <p>Finally, a sign that you are actually thinking about solving the problems, rather than escalating conflict, is that you recognize that the other side is not one monolith, but has factions, some of which may help peace. The path to peace has to find that on the other side.</p>
      <p>For example, in Israel there have always been factions that want peace and reconciliation, and also factions that are more aggressive and bellicose. The same on the Palestinian side. I have said that the Palestinian authority is on the side of peace now, and Hamas is not. Of course Hamas itself is split, and some may be more willing to build a peace--I certainly hope so. But I don't see any recognition on your side that there are Israelis with whom you could build a peaceful and prosperous middle east. </p>
      <p>It is true that even the Israeli doves will not agree to destruction of the Jewish state--that is, they they should be governed by others. As I said, recent history will mean that they never agree having no bullets. </p>
      <p>Also I would note that the Israelis lost their own blood--not American or British--to win their independence, at a point when there was a transition from European rule to local rule. And they have defended it with their blood, though with more help of arms from others.</p>
      <p>At some point this needs to be accepted, I think. For example, do you insist that now Muslims should attack all of Spain that was once Muslim, so that those in Morocco who still have keys to their homes in Analusia--and they do exist--can return? Do you think that it's a good idea for those Muslims who went to randomly kill Hindus and others in Mumbai, so that all the parts of India that were once Muslim return to Muslim control? </p>
      <p>Yes, there are Jewish fanatics that say all of King Solomon's territory has to be put on Jewish control, and who want to fight to do it. I think they are equally fanatic and certainly feeding the angry and vengeful wolf. </p>
      <p>And though I don't know any English who say it, they could try to wage war to recover all their empire under Queen Victoria, as the British know better how to rule--and there are certainly those who do say that. </p>
      <p>The point is, you can try to make peace, and make it, or you can nurse past grievances, feeding the vengeful wolf, and get more war and more suffering and tragedy.</p>
