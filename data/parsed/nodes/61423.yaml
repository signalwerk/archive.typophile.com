    <p>Hello all,</p>
    <p>I'm working through this idea for an ambigram logotype, for a hair salon. (pro bono)<br>
    As many of you are aware, an ambigram is something that reads the same upside down.<br>
    I thought it was a nice play on the name of the salon.</p>
    <p>I've been staring at it a bit too long and would like to put it up on the table for just criticism.<br>
    Thanks</p><div class="imageWrap"><img src="http://typophile.com/files/twist_ambigram_3899.jpg"></div><p></p>
