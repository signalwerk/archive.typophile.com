      <p>I would like to see the middle stroke of the 'w' to be pushed a little to the left so it would be in the optical center of the letter. Maybe also make it a little higher. I think that this would not destroy the connection of 'i' and 's'. This is very subtle and maybe also a little guesswork.</p>
      <p>The comment is regarding to (M) in which I would start/end the word with the dots featured in (F). I can't tell you the reason why but the dots do not only look better they are also supporting the overall message. They make me think of a Hair Studio. The later iterations do more remind me of hair in general but don't seem to work for the studio in my eyes. Maybe it's a bit too experimental to work as a brand. Somehow it reminds me of <a href="http://img.snowrecords.com/cd/1/5275.jpg" title="http://img.snowrecords.com/cd/1/5275.jpg">http://img.snowrecords.com/cd/1/5275.jpg</a> which is absolutely gorgeous but would not be suitable for a professional studio.</p>
      <p>After reading my comment again I want to say that you've done a great job so far. Especially the whole process is very positive and your recent versions are really looking extra good. Take my advice as the result of my personal taste. I am not talking about having it wrong and making it right. It's just my feelings about it.</p>
