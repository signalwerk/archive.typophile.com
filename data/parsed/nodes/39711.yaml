    votes: null
    html: |-
      <p>I don't see "human communication" as being relevant to the digital/tangible nature of the propertry, it relates more to the means of sale.<br>
      You can by tangible property online, books, for instance, from Amazon, with no human communication.<br>
      You can even buy groceries that way now, at the supermarket.</p>
      <p>Conversely, I have been commissioned to create fonts, in very direct relationship with my clients, and the fonts have been licensed to them with almost identical terms as for retail fonts. (The difference being a period of exclusivity.)</p>
      <p>Similarly, a distributor of fonts or stock photography may assist a client/customer in searching for a licensed product.</p>
