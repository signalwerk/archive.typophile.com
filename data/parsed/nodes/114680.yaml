    html: |-
      <p>Seems to be cast with something from the pre-digital era. For Roman letter fonts the master could have been prepared with a letter routing machine, particularly the Leroy Lettering Machine. There are some fonts for Roman letters based on routing machine letters [see http://typophile.com/node/114201]. Perhaps a search of Cyrillic fonts might disclose a version of the routed letters.<br>
      One font that could be used to produce an approximate rendition of the Soviet Era phone booth plaque is Andriy Konstantynov's Pancetta<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/PancettaRegCyr_5797.jpg"></div><br>
      <a href="http://www.myfonts.com/fonts/konstantynov/pancetta-pro/" title="http://www.myfonts.com/fonts/konstantynov/pancetta-pro/">http://www.myfonts.com/fonts/konstantynov/pancetta-pro/</a><br>
      Don<p></p>
