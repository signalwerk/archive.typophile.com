  html: |-
    <p>Hello, fellow typophiles! :)<br>
    I will save you the long introduction and frivolous background details. Suffice it to say that I setting a brochure in TypeTogether's lovely <a href="http://new.myfonts.com/fonts/type-together/adelle/" rel="nofollow">Adelle</a> and am looking for a good sans-serif companion to use in headings. Do you have any helpful suggestions? I'd prefer a typeface with some kind of lighter weights (like thin, extra-light, display, etc.) but that's not a deal-breaker. Really, I just need something that will act as a good complement to the graceful slab-serifs of Adelle. So far, I have these in consideration:</p>
    <ul>
    <li>Gibson (Canada Type), <a href="http://new.myfonts.com/fonts/canadatype/gibson/" rel="nofollow">http://new.myfonts.com/fonts/canadatype/gibson/</a></li>
    <li>Depot New (moretype), <a href="http://new.myfonts.com/fonts/moretype/depot-new/" rel="nofollow">http://new.myfonts.com/fonts/moretype/depot-new/</a></li>
    </ul>
    <p>I'd possibly consider <a href="http://new.myfonts.com/fonts/fontfont/milo/" rel="nofollow">FF Milo</a> or <a href="http://new.myfonts.com/fonts/fontfont/kievit/" rel="nofollow">FF Kievit</a>, but I'm not convinced that their overall designs are similar enough to the style of Adelle to be good complements.</p>
    <p>Thanks for your time!<br>
    Evan</p>
