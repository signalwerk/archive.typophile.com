      <p>Bram, type founding was a highly industrial process for at least a good hundred years or so. The Industrial Revolution brought standardization to all sorts of things, even places where it did not necessarily need to be.</p>
      <p>This is interesting in light of the fact that no German government ever really declared Fraktur to be its official type style of choice (a vote in the pre-WWI Reichstag was more or less deadlocked between Fraktur and Antiqua), although the NS-Regime did ban it towards their end. I guess that standards are another matter altogether.</p>
