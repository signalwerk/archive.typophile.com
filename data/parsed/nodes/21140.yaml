      <p>Well, these things are complicated because there are always exceptions.<br>
      The first old style, Jenson does have the angled crossbar on the e, but it also has a lot of calligraphic details. </p>
      <p>The typefaces done by Griffo for Aldus were less calligraphic and had the straight crossbar. Garmand and other french had Griffo's type, and if I've got it right basically lightened it a bit, with smaller serifs--an elegance. </p>
      <p>The Dutch, influenced probably by black letter, increased the x-height of these designs, increased the weight of the serifs and the general blackness of the letters. They also, as G. Noordzij pointed out, were willing to change the stress on different letters, reflecting writing by pen which changed the angle of the pen. </p>
      <p>Caslon was basically imitating Dutch faces, adding his own personality and take on the letters. Baskerville, also English, started a different look by taking Caslon's face, making it wider, with smoother curves, upright stress, and more regularity. Generally a 'neoclassical' feel. </p>
      <p>So Jenson=Venetian, the school of Aldus to Garamond is another, and the Dutch are another. Caslon is an English variation on the Dutch. Baskerville is something new. He is taken up on the continent and his ideas taken to their extreme by Didot and Bodoni. There are definitely lines of influence, but each designer had his own take on letters also.</p>
