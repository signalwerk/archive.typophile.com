      <p>Ah yes, I'd forgotten about the angles relating to the kerning... however a comparison of the different angles in mean-height lowercase n, u and v, and also the main strokes of p and q, would still support what I'm saying about the slope inconsistencies in general.</p>
      <p>I think my point was to claim that particularly the Dutch and English oldstyle italics were not harmonised (or regularised, as Bram says). </p>
      <p>And yes, in the case of Caslon I can argue with it as a bad decision and think other faces are superior, but then we have a lot more to choose from these days. Later (better?) reworkings of Caslon, like <a href="http://www.fontshop.com/?fuseaction=catalog.fontpackage&amp;searchby=manufacturer&amp;displayfontid=M.153.0.0">Imprint</a> show a much more orderly conception of what a regularised accompanying italic should look like.</p>
