      <p>&gt;What makes them distinctively German, though?</p>
      <p>Their heavy use in Germany is one thing. Another specific "German" feature about a lot of late-19th century through 1940ish typefaces is (too) short descenders (someone out there please correct me if these too-vague details are inaccurate): The German type foundries had some sort of standardized sort measurements… these were based on the proportions of <a href="/node/13772" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">fraktur</a>. All fonts within a point size had to have the same baseline "height". Fraktur typically has a tall x-height, and small ascenders and descenders. <a href="/node/14507" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Roman</a>, or <a href="/node/13832" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Antiqua</a> typefaces don't tend to look good with the same big x-height… so that could be dropped down, and the design could have relatively longer ascenders. But the descender length couldn't change because the baseline was uniform. This allows for the easier mixing of types, I guess.</p>
      <p>I think that German typefaces before <a href="/node/13514" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Helvetica</a> (begun in Switzerland but expanded by <a href="/node/12158" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">D. Stempel AG</a> in Frankfurt) are almost all very calligraphic in origin, with exception of the sans serifs and some of the Modern (<a href="/node/30993" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Didone</a>) designs.</p>
