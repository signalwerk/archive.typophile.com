      <p>There is a ton of <em>German</em> type. I hope that the Germans who read and post here will forgive me for leaving things out, especially all of the great blackletter type, which would be just too much to go into here!</p>
      <p>A short, short, short list:<br>
      1. Garamond type came to Frankfurt with Jacob Sabon around 1580.<br>
      2. At first glance, Walbaum might look quite similar to Bodoni or Didot types, but it is really quite different, and (maybe became) quite German.<br>
      3. Lots of fantastic 19th Century sans serif type.<br>
      4. Walter Tracy brought a beat down on German serif typefaces of the first half of the 20th Century, writing (if I remember correctly) that Koch Antiqua was the only good one.<br>
      5. But there was a lot of great serif type… some of which, unlike Koch Antiqua, were real text faces (although Koch Antiqua in metal was used for books, too). Great types were cast from designs by Schneidler and Tiemann, for instance. I'm sure that there were many more.<br>
      6.Palatino.<br>
      7. Optima.<br>
      8. Despite my misgivings about some of it, the East German communist regime had a state-sponsored type foundry, which brought out some interesting work.</p>
