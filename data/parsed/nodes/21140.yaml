      <p>You might look at the text of Jan Middendorp's 'Dutch Type'. The initial text talks about this a little. The book is expensive but maybe you can find it in a bookstore or  a library. Even though it's expensive, I think it was well worth it. Here's a link:</p>
      <p><a href="http://www.typotheque.com/site/book.php?id=4">http://www.typotheque.com/site/book.php?id=4</a></p>
      <p>The Dutch Oldstyle is usually described as having shorter ascenders &amp; descenders plus a larger x height resulting in less metal use per glyph and more economical use of paper as well. The Italian &amp; french are descriobed by Karen Cheng as 'lighter &amp; more refined' and the English as more sturdy &amp; less refined. </p>
      <p>Keep in mind that none of these generalizations is based on clean or easy separations - and the real data underling these genralizations is complicated &amp; messy. For one thing - lots of the type described as english french etc was actually made in the low countries. Or Germany. But the urge to tell a story &amp; generalize in the face of real complexity is too strong to resist... Unfortunately it is often less than acurate too. But take what I say with some salt. I have only been looking at type seriously for a year or so.</p>
