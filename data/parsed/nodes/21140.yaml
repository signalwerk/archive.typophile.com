      <p>Exactly,</p>
      <p>That's why I put the word "oldstyle" instead of "Garalde", "Aldine" or anything. Speaking of which, Aldus' Venetian is earlier than Garamond's style, too.</p>
      <p>My aim is to figure out whether classifying oldstyle faces (and just oldstyle faces) by region is relevant and logical. To my knowledge most resources only made distinction between Venetian, French (as in Garamond's), Dutch and English, but only vaguely mention the unique features of each.</p>
      <p>Put simply, I want to find some identifying characteristics that, although cannot be applied universally, can be used to categorize Fournier as being French, Caslon as being English, and Plantin as being Dutch.</p>
      <p>Bringhurst's historically based clasification can be one of the characteristics, because it doesn't discount newer faces like Palatino, Perpetua, and such.</p>
      <p>I suspect that another good characteristic is the x-height to ascender to descender proportion. This method, in my opinion, is more accurate than simply saying "This typeface has a large x-height and long ascender" because it takes the three proportions into account. As you can see, I attempted to differentiate Dutch oldstyle from German oldstyle with this method. I'm not sure if it hits the jackpot, but it's a good place to start.</p>
      <p>Irregularity can be another good point, but I would see it in a different light: the italic. As we all know, italics was originally not designed to work as roman companions. Dutch and English oldstyle faces have italics that are 'regularized' (read: designed with the roman in mind), while Venetian and French roman and italic were two separate entities.</p>
      <p>But this idea, born solely out of curiosity, could just be another useless attempt at catching the wind. So I really don't know.</p>
      <p>I have yet to read all of your recommended articles -- which are all very relevant to the topic -- aside from Mr. Bringhurst's.</p>
      <p>But I have a hunch that I should start with Mr. Hoefler's posting first.</p>
      <p>Keep the comments coming!</p>
