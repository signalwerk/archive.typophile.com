      <p>Hi Bram</p>
      <p>Well yes we know what you mean... the problem originates with the Vox terminology because it equates oldstyle (your term) with 'Garalde'. 'Garalde' is a compound name that conflates two different categories - the oldstyles of GARamond and the late venetian styles of ALDus.</p>
      <p>William is right about the essential progression of the differing national styles historically, but by the time he mentions Baskerville (transitional) and Dan mentions Walbaum (modern) we are no longer in oldstyle territory, and outside of the scope of your question.</p>
      <p>Interestingly enough, Jaspert (1958) lists only 30 faces in the Old Face section of the Encyclopedia of Typefaces – so in a sense, this is already the simplest way to organise the oldstyle faces. A key attribute would be the irregularity* of genuine oldstyle faces when contrasted with the technical refinements that produced later types. </p>
      <p>The situation only gets really complicated when trying to include all those 20th century revivals and text faces within an oldstyle classification – which is where Robert Bringhurst's ideas about a historically-based classification come in useful.</p>
      <p>Related articles about the relative uselessness of classification in general are Jonathan Hoefler's 'On Classifying Type' which is mentioned at <a href="http://typophile.com/node/17412">http://typophile.com/node/17412</a> and also a great discussion on this from last year at <a href="http://typophile.com/node/9757">http://typophile.com/node/9757</a></p>
      <p>Historical and structural distinctions between French, Italian, English and Dutch oldstyle typefaces are reduced to English/Dutch vs. Continental Taste by Catherine Dixon in her 'Typeform Dialogues' project, which is an attempt to work up a new classification system and iron out the vagaries of the old systems. One of her significant findings was that type designers consciously 'aim for the gaps' in classification systems – if you think about Unger Fraktur (1793) being a hybrid between forms of traditional blackletter and the proportions of the (then) modern roman of Didot, then you can see that this idea has a lot of precedent. I guess it was like the Dead History of its day.</p>
      <p>Although 'Typeform Dialogues' is currently on hold, Dixon's system is written up pretty comprehensively in Baines &amp; Haslam's <a href="http://www.amazon.com/gp/product/0823055280/sr=8-2/qid=1152410008/ref=pd_bbs_2/002-1701602-4475220?ie=UTF8">'Type and Typography'.</a></p>
      <p>* This is a real problem if you think about where/how to classify <a href="http://www.fontshop.com/?fuseaction=catalog.fontpackage&amp;searchby=manufacturer&amp;displayfontid=FF.475.0.0">Beowolf</a> because while it's based on an oldstyle face, the technology that creates Beowolf, and its resulting irregularity of forms are really not 'genuine' oldstyle.</p>
    html_clean: |-
      <p>Hi Bram</p>
      <p>Well yes we know what you mean... the problem originates with the Vox terminology because it equates oldstyle (your term) with 'Garalde'. 'Garalde' is a compound name that conflates two different categories - the oldstyles of GARamond and the late venetian styles of ALDus.</p>
      <p>William is right about the essential progression of the differing national styles historically, but by the time he mentions Baskerville (transitional) and Dan mentions Walbaum (modern) we are no longer in oldstyle territory, and outside of the scope of your question.</p>
      <p>Interestingly enough, Jaspert (1958) lists only 30 faces in the Old Face section of the Encyclopedia of Typefaces – so in a sense, this is already the simplest way to organise the oldstyle faces. A key attribute would be the irregularity* of genuine oldstyle faces when contrasted with the technical refinements that produced later types. </p>
      <p>The situation only gets really complicated when trying to include all those 20th century revivals and text faces within an oldstyle classification – which is where Robert Bringhurst's ideas about a historically-based classification come in useful.</p>
      <p>Related articles about the relative uselessness of classification in general are Jonathan Hoefler's 'On Classifying Type' which is mentioned at <a href="/node/17412/" class="link-kept">http://typophile.com/node/17412</a> and also a great discussion on this from last year at <a href="/node/9757/" class="link-kept">http://typophile.com/node/9757</a></p>
