    html: |-
      <p>&gt;These are not rationalised italics but letters based on the inconsistencies of handwritten forms.</p>
      <p>The irregularities in the slopes of old style italics generally do have a logic to them, and it is not really a handwriting logic. For example generally the ascenders are more vertical than the stem of the n. I suspect this is because a more extreme slope would create kerning problems. The lesser slope of k ascender compared to the l, for example, is because of problems in drawing a balanced looking old style k (looped top) with an extreme lean in the ascender. </p>
      <p>In the case of Caslon in particular, the AVW in the original Caslon have their thick diagonals nearly the same slope as the H. This makes the thin diagonals slope more extremely. You can argue with it as a bad decision, but it does has some visual logic to it. I believe that Moxon, the early English type designer, recommended it. It works to an extent with the caps as initial caps with lower case letters. In an all-caps italic setting it clearly doesn't work very well. But then I don't think they were planning to use italic all caps back then. The frequent presence of the swash JQTY as standard is a sign of the same approach to italic caps as leading letters.</p>
