      <p>The short ascenders are not only German. The 'Dutch' faces had shorter ascenders and descenders, also probably under the influence of black letter. </p>
      <p>The shortened descenders was the fashion also in the US from the late 19th through mid century at least. Some thought very short descenders were important to economical setting. Merganthaler Linotype faces were also cast on a 'standard' baseline, which enforced short descenders. They had to make special provision for 'art' faces with full descenders.</p>
