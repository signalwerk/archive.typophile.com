      <p>The industrial revolution and the mechanization of the press are very good points on the standardization of types. And yes, I remembered from reading somewhere that Monotype and Linotype has a rough classification system comprised of text faces and art faces. The former complied with their matrix standard while the second can really go out and about.</p>
      <p>The Legibility Group's newspaper face was very easily identifiable, though. Noticeably short descender and ascender, normal to condensed width, noticeable open counterspace, Transitional-Modern roman construction, and so on.</p>
      <p>The Dutch typefaces are just like that, but with an Oldstyle construction in mind. Indeed, 20th century romans like Times New Roman was based on Plantin.</p>
      <p>Teutonic faces, on the other hand, seem to have a moderate x-height (caused by short descender <em>but</em> normal ascender), an Oldstyle-Transitional construction and that glyphic quality (see the hook of 'a' on Palatino)</p>
