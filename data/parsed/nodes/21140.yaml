      <p>I think I failed to define the word 'regularized'. By that, I meant that the Italics were designed to go with the Romans, regardless of their slope angles and such.</p>
      <p>But indeed, orderly slopes was more prevalent the more recent you go in years. In that respect, English face like <a href="http://store.adobe.com/type/browser/F/CASF/F_CASF-10105310.html">Caslon </a>had a more 'regularized' italic in comparison to <a href="http://www.myfonts.com/fonts/linotype/janson-text/56-italic-oldstyle-figures"></a>Janson.</p>
      <p>The fact that the digital rendition of Garamond from Monotype has such an individual italic is an entirely different thing.</p>
