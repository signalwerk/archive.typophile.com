    <p>Okay,</p>
    <p>So we've been classifying and identifying oldstyle typefaces using the above terms forever. But let's clear things up -- beyond the usual x-height proportion and greater/lower face contrast and weight -- shall we?</p>
    <p>I find <a href="http://www.paratype.com/help/class/default.asp?ClassCode=11000">this ParaType article</a> to be very helpful as a starting point. My theory is, there's gotta be a simpler way to organize oldstyle faces.</p>
    <p>Of course, I could be totally wrong and this is just another futile attempt to reinvent the wheel.</p>
    <p>Is there a simpler way to organize oldstyle faces? What makes an oldstyle a French, Italian, Dutch or English.</p>
