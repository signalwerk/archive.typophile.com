      <p>Happy reading, Bram</p>
      <p>You're not the only American I know who's commented on an unwillingness to embrace the Vox terminology... I think Forrest Norvell did the same last year.</p>
      <p>Somewhere – maybe in Bringhurst, or more likely in Lawson's 'Anatomy of a Typeface' – I recall seeing a comparison chart of slope degree and/or irregularity of italics within a range of faces; has anyone else seen this lately?</p>
      <p>As for <cite> Dutch and English oldstyle faces have italics that are ‘regularized’ </cite> I have to disagree. </p>
      <p>One of the attributes of the  Caslon Old Face that always made me reluctant to use it was (and still is) the unharmonised slopes of the italic. Jaspert states <cite> In the italic, as in many old face italics, the capitals are irregular in their inclination; the A, V and W appear to be falling over. </cite></p>
      <p>When you examine the italic lowercase close up, it's apparent that the slope of the main strokes of b,d,f,h,j,k,l,p and q are in no way consistent with each other, or necessarily with the rest of the mean-height lowercase characters.</p>
      <p>The model for Caslon's work, especially in the italic, was type by Cristoffel van Dijck, Amsterdams leading typefounder of the preceding century. This irregularity of slope is of course related closely to the <cite> change of the stress on different letters, reflecting writing by pen which changed the angle of the pen </cite> that William is talking about at post #3. These are not rationalised italics but letters based on the inconsistencies of handwritten forms.</p>
      <p>Not all handwriting needs to look unbalanced. My reasons for discriminating against Caslon are the same as my reason for disliking <a href="http://www.linotype.com/112288/rotisfontfamilygroup-clan.html"> Rotis </a> – there is an intrinsic lack of balance in the face, and certain characters look like they're about to fall over. Once you notice this, it's very hard not to see the same flaw ever after on each successive viewing.</p>
      <p>To argue for a regional or national variation in rationalising italic slope angles relatively within the italic (or to the construction of the associated roman face) – you would have to go to a later historical period, and here the French founders of the early 18th century have the advantage, but by this point we are dealing with transitional typefaces, rather than oldstyle.</p>
