      <p>From my minimal experience with Suitcase, my advice would be to first make sure you have the Suitcase plug-ins installed for all of your Adobe CS applications. The plug-in ensures that fonts used in certain documents will load when the document is opened. Just check the Plug-ins folders for each app.</p>
      <p>Second, (this works in Suitcase X1, at least) you can create an Application-specific font set within Suitcase which will open each font added to it when that application is launched. </p>
      <p>1) Go to File &gt; New Application Set...<br>
      2) Drag and drop fonts to the application set.<br>
      3) For this to work, Suitcase needs to be launched prior to launching the applications.</p>
      <p>I hope this helps.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/appSet_4787.jpg"></div><p></p>
