    <p>Hi there,</p>
    <p>I did a search for this question, but couldn't find an answer.</p>
    <p>I have FF DIN (Mac Postscript) and just bought FF DIN Italic Regular and Italic Light. They both show up in Suitcase, but Italic Regular is missing from all CS2 apps. Italic Light is fine though. Italic Regular shows up in Quark 6 and even bloody Word; just not in Adobe apps.</p>
    <p>Any ideas or tricky tricks?</p>
    <p>Cheers.</p>
