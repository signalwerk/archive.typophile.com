    html: |-
      <p>If the font previews correctly in Suitcase, there is a high probability that it is functional. </p>
      <p>Unfortunately, you don't mention your specific OS. If, in fact, you have Mac OS 10.4 (Tiger), you might want to try clearing your Mac OS font caches. This would be performed by deleting the following folder /Library/Caches/com.apple.ATS/. Immediately reboot. </p>
      <p>In some cases, fonts may not appear the same way in the menus of different applications. That doesn't seem likely to me in this case though. This sort of issue can be verified by installing the font in the system. I would recommend testing it by placing it in /Users/yourusername/Library/Fonts/. </p>
      <p>If you're still having trouble, let us know the various versions of Mac/Win and Suitcase.</p>
