  html: |-
    <p>I'm pleased to announce that "Printers' Tales" is now available on the Kindle.</p>
    <p>You can get your copy here:</p>
    <p><a href="http://j.mp/OhdJj6" title="http://j.mp/OhdJj6">http://j.mp/OhdJj6</a> (USA)</p>
    <p><a href="http://j.mp/NRVdxY" title="http://j.mp/NRVdxY">http://j.mp/NRVdxY</a> (UK)</p>
    <p>Please don't buy the book if you are a contributor to it. I'm still working on a special "contributors' edition" for the Kindle, drop me an email, and I'll get a special edition sent to you when completed.</p>
    <p>Overall, I'm very pleased with how the project has turned out. Thanks to everyone who has helped out with tips on producing the cover, etc.</p>
    <p>All the Best<br>
    Dave Hughes<br>
    York, UK</p>
