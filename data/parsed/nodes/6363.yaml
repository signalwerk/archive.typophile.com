    votes: null
    html: <p>The idea that someone might still be using film type setting may not be that far-fetched. It's still not a bad application for short headlines. However, I agree it seems like the sort of thing SOMEONE would have digitized. The big problem is that very likely the name was changed. Jim Parkinson has a Sans Serif font called Richmond, and so does Linotype, although theirs is a Blackletter style. I only found one reference to Richmond Old Style and it was a reference to seeing it used for TV show titles. (perhaps more evidence that a font exists?) <br> <br>Maybe someone out there knows how much photocomposition is still being done?</p>
