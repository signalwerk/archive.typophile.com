    html: "<p>Si, I'm not sure that this is what you need, but <a class=\"freelinking external\" href=\"http://www.codestyle.org/css/font-family/index.shtml \" rel=\"nofollow\"> Code Style</a> has a pretty complete (and ongoing) survey of Web fonts - in fact, it's the best around. Their recent (April 11, 2009) <a class=\"freelinking external\" href=\"http://www.codestyle.org/css/font-family/sampler-WindowsResultsFull.shtml \" rel=\"nofollow\"> Full Windows font survey results</a> are fascinating, if not incredible: Franklin Gothic Medium is on 97.62% of surveyed Windows machines? Gill Sans MT is on about half of all surveyed Windows machines?</p>"
