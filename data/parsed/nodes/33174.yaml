    html: <p>OK, for Type 1 fonts for the PC, remember that most PC programs don’t use the .AFM file, they use a .PFM file — it is just that you can simply open an .AFM file in a text editor &amp; see what is there. But I can’t imagine that either FontLab or Fontographer would generate a .AFM &amp; not a .PFM, as long as you have the right “boxes” checked off. Of course, I’ve been know to have limited imagination . . .</p>
