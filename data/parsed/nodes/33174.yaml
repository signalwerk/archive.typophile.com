    <p>hey there everybody -</p>
    <p>I am having trouble generating PC version of my font - every PC format I generate out of my either my fotlab or fontographer file the kerning is lost. the kerning works fine for this same font if it generated as a MAC format. i have tried generating an open type, true type and type 1 version for the PC and the kerning will just not work. any thoughts on what might be the casue? thanks!</p>
