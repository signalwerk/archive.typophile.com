    html: |-
      <p>I think Ray's suggestion is one of the best I can think of too, but another choice might be Canada Type's <a href="http://new.myfonts.com/fonts/canadatype/birthday/" rel="nofollow">Birthday</a>, by Rebecca Alaccari. It has the same sort of looping ascenders and monotone strokes that we associate with children's handwriting.</p>
      <p>The odd feature of the Golden Book script is the G is  more of a printed style, compared to the L and B. That mix is hard to find, and most scripts are more slanted.</p>
      <p>- Mike Yanega</p>
