    <p>I know there are certain fonts designed especially for low-resolution output (desktop printers and such) such as Charter, Oranda, Amerigo, and even the Stone family. I’d like to understand more about the characteristics that make these fonts more appropriate for the low-res environment.</p>
    <p>For instance, I’ve pretty much settled on using <a href="https://web.archive.org/web/20080907092444/http://www.felicianotypefoundry.com/main/?page_id=23">Stella</a> for my own business where my output would consist mainly of my inkjet printers and clients who print PDF documents and presentations that I produce for them. I tested several fonts, including Proxima Nova which printed very clean — cleaner than Stella — but my wife (who needs glasses to read) still felt that Stella was easier to read. Where exactly do you strike the balance?</p>
    <p>Thanks,<br>
    Addison</p>
