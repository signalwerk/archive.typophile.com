  html: <p>I realize this sample is too awkward to get a true sense of value, but, generally speaking is this typeface just too f'd up to be of any use?  Anyone see any value here? <br> <br>I originally intended it to be a text face but obviously that won't work. Maybe a cheesy display face? <br> <br><img src="http://www.typophile.com/forums/messages/29/1498.jpg" alt="mullet"></p>
