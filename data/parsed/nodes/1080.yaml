    html: <p> I think this would be a really funny display face. I  <br>wouldn't suggest trying to sell it, but for your own  <br>uses, this would be great. the forms would really  <br>become images of their if you used them in the right  <br>way -- and, of course, for the right subject. <br> <br>since this would not be a font to use for the purpose of <br>legibility, you might want to funk-up the "straight"  <br>characters (Uc H, I, L, T &amp; Lc i, l, x, z). I'm not sure how  <br>these would look, but currently they look too boring in  <br>the context of this font. <br> <br>great link, Joe! </p>
