      <p>@Joe Clark:<br>
      <cite>Narrowing a window is a desperate measure.</cite></p>
      <p>I can't speak for Nick Shinn, but if I'm uncomfortable with the line length on a classic HTML web site, I'm much more likely to just narrow the window than attempt to change my browser's default font settings.</p>
      <p>I <em>do</em> mind the fact that I can't adjust the proportions of the page used by this forum because of how the HTML is set up. Not much, as the line width is passable, and the page fits my current browser window size on my current screen resolution without scrolling side to side, but I would prefer it if the page design could flow with the size of the browser window and accommodate smaller window sizes.</p>
      <p><cite>your browser window (there’s only one at any given moment, is there not?)</cite></p>
      <p>Huh? Why would there only be one browser window? This is another annoyance I have with the Typophile site; because the front page uses Flash, I can't just right-click on FORUMS to open it in a new window; I have to lose the front page, and the opportunity to check out the items indicated there as new or hot, in order to get to the main Forums menu. (Of course, there's the browser's back button, but then I lose the main menu, and the page has to be rendered again.) I even find tabs cumbersome - it's much better to have the actual page present on a window, so one knows right away which one it is.</p>
