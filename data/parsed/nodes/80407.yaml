      <p>I haven't done a whole lot of web work. However, I recently did convince a client that the "skinniness" of the text was appropriate because the Canadian government said so:</p>
      <p>"The number of characters on a line of text influences the speed of reading and the ease of comprehension: a line of text that is too short can slow reading and cause eye fatigue as the eye must move more often from one line to the next, whereas a line that is too long may cause the eye to skip to the next line. With respect to long texts, the ideal length of a line is between 50 and 70 characters."</p>
      <p>See: <a href="http://lois-laws.justice.gc.ca/eng/PDF_full.html" title="http://lois-laws.justice.gc.ca/eng/PDF_full.html">http://lois-laws.justice.gc.ca/eng/PDF_full.html</a></p>
      <p>I first read this in a thread on Typophile. (link needed!)</p>
      <p>Rhetorically (in the ethos/pathos/logos sense), I'm sure this would carry no weight for a non-Canadian client, and even less weight in a randomly sent email to a stranger from abroad.</p>
      <p>For typographically sensitive designers doing small websites without a lot of sidebars this will be an ongoing problem, especially with many clients using big wide monitors.</p>
      <p>I hope this is not too pedestrian for your tastes.</p>
