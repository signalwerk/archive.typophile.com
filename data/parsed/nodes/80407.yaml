      <p>The human mind does not read one letter at a time. We take in groups of letters or even entire words at once, while simultaneously examining the shapes in our parafoveal vision to both consider what is coming up and to reconsider what was just in focus. As we do this our eye jumps across the page in movements called saccades. After around six or eight saccades the head starts to move instead of just the eyes. Little head movements are tiring and annoying and as lines lengthen the eye tends to jump up and down to other lines. This is why a good line length tends to fall in the range of 55–75 characters per line, depending on the font and size it is set at.</p>
      <p>I’m pretty sure that Unger covered some of this in <em>While You Are Reading</em>. Bill Hill also brought it up at Typecon 2007, I’m not sure if he has written about that somewhere.</p>
