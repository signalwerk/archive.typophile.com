      <p>I get that the original rant is a call for the website to change itself. But it probably won't happen. There is an easy fix though in the meantime. </p>
      <p>Stylish is a nice addon for firefox and chrome users. I believe there's a mac version.<br>
      It lets you write your own CSS change to a site, and every time you visit the site thereafter, your custom CSS sticks. You can wrap those lines. Can't solve the problem for the whole world, but at least for yourself.</p>
      <p>Firebug is another great add-on and almost goes hand-in-hand with Stylish, it makes it easier to identify the CSS class or ID or tag that needs to be changed.</p>
      <p>With stylish installed, visit metafilter --&gt; right click the S icon --&gt; write new style --&gt; for this site. Give it a name at the top. Paste this line just before the final }.</p>
      <p>.copy { width: 500px !important; }</p>
      <p>Change the 500px to whatever you prefer. Save and close. One could also resize the text, change to a preferred font, etc. I've tweaked a lot of the pages I visit this way and it makes your general web experience a lot nicer.</p>
