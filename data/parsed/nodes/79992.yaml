    html: <p>I have done one of these tests using a physical set of colour tabs, and they are so finely calibrated that the test results can be thrown off if you accidentally touch the surface of one of the tabs, since the oil in your fingertips will affect the colour. All of which is to say that I don't think an online version of this test, given all the variables of system, gamma, monitor brightness, etc., should be taken as anything but a very crude indication of your colour vision acuity.</p>
