      <p>Mark, gotta say that it's an ingenious explanation. And since I only notice this on sunny mornings it might also be a correct one too.</p>
      <p>Nick, it sounds like your B sensitivity fluctuates, while in my case R and G do. But there's definitely a warm/cool effect of perception. This has a weird effect of how waking up and looking around with a warm-tinted eye makes the morning seem <em>better</em> and more pleasant. It's a fleeting feeling, but it is a noticeable one nonetheless.</p>
      <p>Kent, next time it happens try remembering if it is R-ed for R-ight or if it's g-R-een for R-ight, i.e. 1 or 2. That's how I ended up tracking which one had which tint the last time, and it helped noticing the flipping.</p>
