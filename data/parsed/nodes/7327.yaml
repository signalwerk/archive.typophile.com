  html: <p>I have a feeling this is either very easy or very hard/impossible. <br> <br>I am in the middle of building a unicase typeface that is designed to use alternative adjacent characters. Currently, Set 1 is mapped to the uppercase and Set 2 is lowercase, but they will need to be re-ordered for the system to work correctly. <br> <br>What I would like to be able to achieve in FontLab is to be able to alternate these on the fly, rather than the user having to swap on the fly by hand.  <br> <br>So, if I type "Thomas Phinney may know", then the substitutions would be "ThOmAs PhInNeY mAy KnOw" - the very first character is the 'seed', so to speak, and all characters after that alternate. <br> <br>I'm a tad out of my depth. After reading the manual and consulting with a very nice Frenchman, it seems likely that I need to set up a context-dependent substitution - the FLab manual gives the example of replacing a smallcap with a lowercase letter if preceeded by a capital, but that technique isn't 'chaining' (for want of a better word) a whole series of substitutions. <br> <br>Can anyone help? Is this even possible?</p>
  html_clean: <p>I have a feeling this is either very easy or very hard/impossible. <br> <br>I am in the middle of building a unicase typeface that is designed to use alternative adjacent characters. Currently, Set 1 is mapped to the uppercase and Set 2 is lowercase, but they will need to be re-ordered for the system to work correctly. <br> <br>What I would like to be able to achieve in FontLab is to be able to alternate these on the fly, rather than the user having to swap on the fly by hand.  <br> <br>So, if I type "Thomas Phinney may know", then the substitutions would be "ThOmAs PhInNeY mAy KnOw" - the very first character is the 'seed', so to speak, and all characters after that alternate. <br> <br>I'm a tad out of my depth. After reading the manual and consulting with a very nice Frenchman, it seems likely that I need to set up a context-dependent substitution - the FLab manual gives the example of replacing a smallcap with a lowercase letter if preceeded by a capital, but that technique isn't 'chaining' (for want of a better word) a whole series of substitutions. <br> <br>Can anyone help? Is this even possible?</p>
