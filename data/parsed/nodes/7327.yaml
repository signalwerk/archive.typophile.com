    html: |-
      <p>This is actually not very hard at all to program, although (in my quick formulation at least) it requires you use placeholder glyphs for intermediate processing, and multiple lookups. Actually, FontLab will automatically break this into multiple lookups if you don't, so you can ignore that part in my sample code; I just put it in there for those who need/want to understand an extra level "under the hood." <br> <br>So here's my solution, expressed in FontLab/FDK syntax. I tested a first version of this, so I'm pretty sure it works. The only thing that needs to be done is define and add a set of placeholder glyphs and enumerate them, where I have referred to [@placeholders]. <br> <br>feature calt { # Connection Forms <br> # Latin <br> <br>lookup calt1 { <br><br>
      </p><blockquote>sub [A-Z] [A-Z]' by [@placeholders] ; <br>sub [a-z] [a-z]' by [A-Z] ;</blockquote><p></p>
      <p>} calt1; <br> <br>lookup calt2 {<br>
      </p><blockquote>sub [@placeholders] by [a-z];</blockquote><p></p>
      <p>} calt2; <br> <br>} calt;</p>
