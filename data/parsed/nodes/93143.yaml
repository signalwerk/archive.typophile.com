      <p>"pty ltd" looks like a combination of Cyne (Typotheticals) and P22 Bayer Universal.</p>
      <p>"eye dream" appears to be the same, with the the stroke endings graphically rounded. (and pretty badly, if you ask me, looking at the 'd' and 'a'.</p>
      <p> - Herb</p>
