    <p>Hi,</p>
    <p>I've been through a few other websites which provide suggestions based on the image, and I went through the questionnaire on Identifont which suggested Chickens and Arista 2.0 - both of these are similar but slightly different to the one I'm after.<br>
    <a href="http://www.myfonts.com/fonts/sparkytype/chickens/" title="http://www.myfonts.com/fonts/sparkytype/chickens/">http://www.myfonts.com/fonts/sparkytype/chickens/</a><br>
    <a href="http://www.myfonts.com/fonts/zetafonts/arista-2-0/gallery.html" title="http://www.myfonts.com/fonts/zetafonts/arista-2-0/gallery.html">http://www.myfonts.com/fonts/zetafonts/arista-2-0/gallery.html</a></p>
    <p>The logo I'm looking at is for an Australian company called "Eye Dream Pty Ltd". They're quite small so don't have their own website as far as I can tell, but the logo is at the bottom left of this website: <a href="http://coloronpro.com.au/" title="http://coloronpro.com.au/">http://coloronpro.com.au/</a> and is also attached.</p>
    <p>If anyone can help me identify this font I'd really appreciate it. </p>
    <p>Thanks, </p>
    <p>Ashleigh.</p><div class="imageWrap"><img src="http://typophile.com/files/eye dream logo white_5816.png"></div><p></p>
