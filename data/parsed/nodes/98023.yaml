      <p>This must be <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Dafont-2&amp;ffam=OptimusPrinceps%20-%20Regular&amp;fstyle=&amp;fsize=60&amp;fid=975a25240fde1fe6412a62621e21bed1&amp;wrap=2&amp;text=KINFOLK" rel="nofollow">Optimus Princeps</a></strong> free font by Manfred Klein which is actually similar to <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Adobe&amp;ffam=Trajan%20-%20Regular&amp;fstyle=&amp;fsize=60&amp;fid=5b4016f5e0cfa7fb7dc84d0a55197038&amp;wrap=2&amp;text=KINFOLK" rel="nofollow">Trajan</a></strong> by  Carol Twombly (1989).<br>
      I don't know if this should be considered a plagiarism or just a different interpretation of the <strong><a class="freelinking external" href="http://en.wikipedia.org/wiki/Roman_square_capitals" rel="nofollow">Roman Square Capitals</a></strong> found in Trajan's Column.</p>
      <p>-----------------------------------------------<br>
      I found it using Find my Font - <a href="http://www.findmyfont.com" title="http://www.findmyfont.com">http://www.findmyfont.com</a></p>
