  - id: 99710
    user: 1844
    date: 2005-12-12T13:34:00
    date_raw: 12 Dec 2005 — 1:34pm
    votes: null
    html: <p>They might be PC executable ZIP files. If so, 'squeeze' them with <a href="http://echoone.com/filejuicer/" rel="nofollow">File Juicer</a>. You'll get normal ZIP files on the other end, which are easily openable on Mac OS X.</p>
    html_clean: <p>They might be PC executable ZIP files. If so, 'squeeze' them with <a href="http://echoone.com/filejuicer/" rel="nofollow" class="link-external">File Juicer</a>. You'll get normal ZIP files on the other end, which are easily openable on Mac OS X.</p>
