    date_raw: 12 Dec 2005 — 7:48am
    votes: null
    html: <p>Hi Doug, looks like they sent you some PC application (executable) files, perhaps further compression? Tell them you need .ttf or .pfb font files to be of any use on a mac. I use PC fonts from time to time and they work fine under tiger.</p>
