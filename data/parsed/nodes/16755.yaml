  html: |-
    <p>I asked the client to send me their advertising font (trade gothic light) and it arrived in a .zip file and when expanded ALL the files are EXEC files. Not sure what's up. I have a mac running tiger and the fonts are coming from a PC.</p>
    <p>thanks,</p>
    <p>doug</p>
