    html: <p>Good practice in a high-volume color copy shop dictates that the machines be calibrated every morning for color accuracy and registration, so the earlier in the day a job runs, the better it stands a chance of being as perfect as the copier is capable of achieving. Ambient humidity plays a factor, too; on very damp days, high-speed copiers tend to jam more often, which can screw up the calibration. On the other hand, if the air is too dry, there's a problem with jams caused by static build-up, so--during cold weather--earlier in the day is better, too...</p>
