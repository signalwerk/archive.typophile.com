      <p>A big question is whether it's a PostScript laser printer or not. (For this purpose, even third-party PostScript emulations are fine.)</p>
      <p>If it's not a PostScript laser printer, or you use a PS compatible laser in a non-PS mode such as PCL, whatever you do will get sent as RGB data by the printer driver and converted to CMYK at the printer end. It's impossible to get really nice solid colored text in this case. Sorry.</p>
      <p>If it IS a PS laser, you need to be using a PS driver, and an application that allows you to set your colors as CMYK colors, and to turn off color management for your CMYK color space. Then you can specify solid CMYK colors. For example, a nice bright red might be 100C-100M-0Y-0K. As long as the printer's registration is okay, that would print out pretty well.</p>
      <p>Being an Adobe guy, I know how to do all this in InDesign, but not QuarkXPress. Last time I looked, Word's internal color model was strictly RGB. What application are you using?</p>
      <p>Regards,</p>
      <p>T</p>
