      <p>Thomas is spot-on about keeping the colours "pure" and if you can, that's certainly the way to go. I've also had good luck with  reproducing colours with one (and even two, depending on what sort of percentages you end up with) of C, M, or Y, plus K, which at least gives you a little more flexibility.</p>
      <p>I can't find the file right now, but I did a project a number of years ago that used a nice teal with a rich brown that worked out very well. Getting one of the fans that translates Pantone colours into CMYK would also be very useful as a starting point.</p>
