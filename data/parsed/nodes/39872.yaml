    html: <p>Your best bet for color reproduction on a laser is to get a Pantone CMYK palette, find a color you like, and print a sample of the nearest ten colors to see if you can find something that matches it. Some colors look great on a laser and some look dreadful—it’s really just a trial and error thing. I have a KonicaMinolta laser printer and the color is pretty terrible overall; when I want good laser color I use a Docutech system or just have it run off at a local print shop that keeps their high-end Xante machines in tip-top shape.</p>
