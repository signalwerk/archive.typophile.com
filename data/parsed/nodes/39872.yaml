    <p>I'm about to print a book using coloured text for footnotes and qoutes, as well as coloured underlines. Does anyone have any experience doing similar things? What colours did you pick? I'm after whats working well with lot's of whitespace. </p>
    <p>My initial idea was using magenta, since it's both contrasting and readable against white paper. Also, I might need to use a laser printer - and any other colours besides C, M, Y &amp; K will output a lower resolution. (Am I right?)</p>
    <p>I'm lusting for a bright red.</p>
