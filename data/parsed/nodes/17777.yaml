  - id: 107860
    user: 9356
    date: 2006-02-08T19:37:00
    date_raw: 8 Feb 2006 — 7:37pm
    votes: null
    html: <p>Fleischman and Rosart could equally (more accurately?) be called Dutch transitional or rococo, in their addition of newly formalised ornamentation and a tendency towards lightness to baroque predecessors. Fournier's usually considered neoclassical, though certainly he reinjected a welcome dose of baroque variety into the constructionist Romain du Roi. Terminology is not exact, though calling the Aldine (which refers to a specific italic designed in 1500) "baroque" does seem rather revisionist. Garamond's types were likewise made from 1530 to 1545; and in 1750 Bodoni turned 10.</p>
