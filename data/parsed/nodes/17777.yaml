      <p><em>onsider the original designs for Aldine, Bodoni, Caslon or Garamond</em></p>
      <p>Of these, only Caslon is baroque, but it owes a lot to pre-baroque Dutch oldstyle types. The Aldine and Garamond types are renaissance, and Bodoni is romantic. For French baroque, you should look at Fournier, not just the types but also how he used them in those small format, delicate and ornamented page layouts. For Dutch baroque, you should look at Fleischmann and Rosart.</p>
    html_clean: |-
