    html: <p>For modern versions of Baroque and Classical styles, Storm Serapion is (very) French Baroque and Smeijers' Renard and Arnhem are Dutch Baroque and Neoclassical respectively. Indigo Antiqua is subtly eclectic, and Frere-Jones' Nobel in its uncondensed light and book weights is a recent take on avant-garde puritanism.</p>
