      <p>I agree with chri1753 about Fleischman and Rosart being more Rococo than Baroque, and I would put Fournier as well into this class of typefaces. In my mind, Rococo is more than a sub-category of late Baroque, since historically the former <strong>replaced</strong> the latter, not only in printing and type design, but also in architecture, painting, fashion, music and lifestyle.<br>
      By the way, Baroque being the style of seventeenth-century <strong>Catholic</strong> Europe, I've always found a bit puzzling to read it used for Dutch typography from this particular era — the Netherlands being quite a fiercely Protestant country at the time.</p>
