    date_raw: 16 Nov 2011 — 7:19am
    votes: null
    html: <p>I'm not sure there are industry standards for this calculation. With other software, it's typically called a 'site license' where the corporation buys a license for use by any/all of its employees. But not all software does this. So, sometimes they'd simply charge for the price * 20,000. Sometimes they may give a quantity discount. Sometimes they do a flat fee for the entire company. Sometimes they do a smaller flat fee, then an annual per-user license fee.</p>
    html_clean: <p>I'm not sure there are industry standards for this calculation. With other software, it's typically called a 'site license' where the corporation buys a license for use by any/all of its employees. But not all software does this. So, sometimes they'd simply charge for the price * 20,000. Sometimes they may give a quantity discount. Sometimes they do a flat fee for the entire company. Sometimes they do a smaller flat fee, then an annual per-user license fee.</p>
