    <p>This logo was developed recently and it has been unusually difficult trying to get an answer out of the brand agency as to what font(s) make up the logo they have developed. I have tried to match up a font but so far unsuccessfully.</p>
    <p>It would be great if anyone could help me id the font in this logo so we can build some new creative inline with the logo design.</p>
