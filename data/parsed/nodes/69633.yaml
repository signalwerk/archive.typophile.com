    <p>"It bothers me that so many major companies have lined up, like lemmings, to create campaigns with huge sans-serif lettering, hyphenated to the point of illegibility."</p>
    <p>See here:<br>
    <a href="http://www.coroflot.com/public/individual_file.asp?individual_id=212054&amp;portfolio_id=3593856" title="http://www.coroflot.com/public/individual_file.asp?individual_id=212054&amp;portfolio_id=3593856">http://www.coroflot.com/public/individual_file.asp?individual_id=212054&amp;...</a></p>
    <p>I'm looking for examples of this--I know I've seen it everywhere, but I can't pull up any campaign or company in specific at this moment.</p>
    <p>Also curious what other people think about the practice, and if there are instances of it being used well, or not.</p>
