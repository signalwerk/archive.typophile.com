      <p>I suppose you're right, Steve. Well, you have to be. And not to disparage my country-folk too greatly, but let's face it--America (which is where I've seen a lot of this advertised) isn't the sharpest knife in the country drawer. There's still illiteracy. I imagine to those people this is really annoying--considering the words are not even breaking for syllabic nuances, just for visual effect. Plus, Gatorade doesn't even use the grammatical symbol for a line break--the hyphen. Good luck to our immigrants as well.</p>
      <p>Certainly debates over whether it works, who cares--it sells, won't be solved. Maybe Gatorade needs to grab my attention. But a booklet for "Commercial Opportunities for Museums and Cultural Institutions?" I digress somewhat, maybe the title "Intelligent Naivety" does it for the same reason I did. But I'm positive there are many more examples out there that have done this just because it's trendy, as Don put it.</p>
