      <p>I saw that one. The news story noted that, hey, it could happen sometime in the next million years. And so people wondered why the headline. But if one looked into the real details, there was a reason to think there was some real chance of it happening soon - of course, if it didn't, than it might happen instead quite far in the future.</p>
      <p>So the news story was garbled; the scientist involved had noted a real issue, and he wasn't the one sensationalizing.</p>
      <p>Also, there are several fonts of the general kind alluded to above <a class="freelinking external" href="http://www.blambot.com/fonts_symbol.shtml" rel="nofollow">here</a>, a site I discovered thanks to the use of their fonts for the <a class="freelinking external" href="http://www.hello-cthulhu.com/" rel="nofollow">Hello Cthulhu</a> webcomic.</p>
