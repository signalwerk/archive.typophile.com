      <p>On this topic, given the theory that if students have to work a little to read their textbooks, then they will spend more time on their words, and, lingering there, remember them better...</p>
      <p>If someone, who understands only English, or some other language written with the Latin script, looks on a book written in Chinese or in the Ethiopic script or some other writing system which looks exotic from that perspective...</p>
      <p>there is the possibility of entertaining the fancy that such a book contains within it profound secrets and mysteries. Rather than simply being an ordinary book like all the other ordinary books.</p>
      <p>And, therefore, I have toyed with the idea (one could go to the Korean writing system for inspiration) of devising an alternate representation for the English language, which could be learned with less difficulty than learning either another language or a large repertoire of symbols (such as Blisssymbols) for making English-language texts look profound and mysterious.</p>
      <p>Applications might include text in backgrounds in comic strips - i.e. text on an alien monolith could contain hidden jokes, because it's "really" in English instead of in the alien language it purports to be. Think of the Interlac alphabet used in the Legion of Super-Heroes comic...</p>
