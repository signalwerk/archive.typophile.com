    html: |-
      <p>I think that we can at least hope that this particular research will not lead, say, to a revival of Fraktur for selected passages in school textbooks.</p>
      <p>The reason, though, unfortunately, will be that schoolteachers and school administrators will recognize that the chief problem is not to get the children to read their textbooks more slowly, to absorb the information therein... but rather to get them to look at them <em>at all</em>. Hence, this is a technique only applicable if one has a disciplined and motivated student population.</p>
      <p>And, given that those students who have "Tiger Mothers" might not have English as a first language, there are even <em>other</em> issues that might have to be considered. Disfluent text could be considered discriminatory, after all.</p>
