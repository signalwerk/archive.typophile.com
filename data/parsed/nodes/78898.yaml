    html: |-
      <p>The study I remember reading concluded that information presented in harder-to-read fonts was easier to remember.</p>
      <p>But the information presented in each font was brief. The time it took to read the control (Arial) versus the time it took to read the "disfluent" sample (i.e. italicized, slightly smaller, Comic Sans or suchlike), for someone who was already a reader, couldn't have diverged by more than a fraction of a second.</p>
      <p>What they measured was not "disfluency," it was <em>emphasis</em>. As designers, we know that type in black-on-white 14pt Arial with not much space around it says (to paraphrase Stefan Sagmeister) "I am going to bore the shit out of you." Pretty much anything else, <em>italicized</em>, with proportionally more space around it, <em>in comparison</em> says "read me and pay attention."</p>
