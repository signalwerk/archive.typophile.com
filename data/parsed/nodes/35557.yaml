    <p>I’ve got a client that is having some of their branding re-done, but they don’t have a clue who did this one or what the font is. Any help is greatly appreciated! </p>
    <p>It’s the “KLINE” font I’m having trouble with. It’s pretty close to MVB Magnesium, but it has uniform strokes, whereas MVB Magnesium has a combination of broad/narrow strokes.</p>
    <p>The “construction” font is Times New Roman bold. </p>
    <p>Thanks for any help you can offer!</p>
