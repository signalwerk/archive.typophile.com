    html: <p>Make your outer and inner contour just as you’ve described. Make a circle 100 x 100 units. Move the circle to anywhere along the inner contour between the top or bottom and one of the sides. Adjust the curve of the outer contour until it touches the edge of the circle. Move the circle further along the curve and adjust the outer contour as needed. When one quadrant looks okay, note the lengths of the control nodes of the outer contour in the adjusted section. Use the same values for the other three sections. In this method, the inner contour controls the overall shape. If you prefer the outer contour, you would adjust the inner contour instead. Note, however, that this will result in corners at the top and bottom of the inside of the O, which you probably don’t want.</p>
    html_clean: <p>Make your outer and inner contour just as you’ve described. Make a circle 100 x 100 units. Move the circle to anywhere along the inner contour between the top or bottom and one of the sides. Adjust the curve of the outer contour until it touches the edge of the circle. Move the circle further along the curve and adjust the outer contour as needed. When one quadrant looks okay, note the lengths of the control nodes of the outer contour in the adjusted section. Use the same values for the other three sections. In this method, the inner contour controls the overall shape. If you prefer the outer contour, you would adjust the inner contour instead. Note, however, that this will result in corners at the top and bottom of the inside of the O, which you probably don’t want.</p>
