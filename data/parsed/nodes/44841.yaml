      <p>Sorry, I didn’t read the original post carefully. </p>
      <p>To expand on Mark’s point about visual vs geometrical: generally horizontals look thicker than verticals of the same physical width, so that when the top and bottom of an oval are the same as the sides they look thicker. </p>
      <p>You can see this effect most strikingly by playing with the widths of the strokes in a ’plus sign’: for the lines to look the same weight the vertical has to be thicker than the horizontal.</p>
