    html: |-
      <p>By the way, a method that may work better is to draw your inner ellipse first. Add at two nodes between the top, bottom, and side nodes, all the way around. Then, do Contour &gt; Paths &gt; Make Parallel Path... with a setting of 100 units. (Depending on the direction of the path, you may need to change it from left to right or right to left. Also, the path directions will need to be corrected after the procedure, since they will end up going the same direction, which you don’t want.) If you don’t add the extra nodes, the result will be identical to your initial example. The extra nodes force the distance to be the same all the way around (or at least closer to that ideal).</p>
      <p>Here’s how it looks:</p>
      <p></p><div class="imageWrap"><img src="/web/20080705163831im_/http://www.typophile.com/files/ellipses_4523.gif"></div><p></p>
      <p>The one on the left is your original O, the one on the right was constructed starting from the inner contour with extra nodes added and the Make Parallel Path command.</p>
