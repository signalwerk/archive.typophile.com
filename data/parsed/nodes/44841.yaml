    <p>Hello All,</p>
    <p>I am new to typography and I am trying to create a font set with Fontlab.  But I am having trouble making the capital letter “O” evenly wide in thickness all the way around.</p>
    <p>For example, if I draw the black circle/oval in guidelines of (0,0) to (400,1000) and the white circle/oval in guidelines (100,100) to (300,900) I get an oval shaped “O”.  Then the mid-points of “O” i.e. the vertical mid-point measurement from (200,0) to (200,100) and (200,900) to (200,1000) is 100.  Similarly the horizontal mid-point measurement from (0,500) to (100,500) and (300,500) to (400,500) is 100.  So the width of the character line at these points is 100 but the width of the character line at other parts is not 100.</p>
    <p>Does anyone know how to make the “O” even all the way around at 100 units thickness.</p>
    <p>Thanks.</p>
    <div class="forum-topic-navigation clear-block"><a href="/web/20080705163831/http://www.typophile.com/node/45286" class="topic-previous" title="Go to previous forum topic">‹ So how do I learn this whole encoding thing?</a> <a href="/web/20080705163831/http://www.typophile.com/node/45236" class="topic-next" title="Go to next forum topic">Installing AFDKO ›</a></div>
