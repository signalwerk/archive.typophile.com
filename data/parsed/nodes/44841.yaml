      <p>Just use the circle drawing tool in FontLab—drag the mouse with the shift key down. That will get you very close to a geometrical circle. Strictly speaking it is not possible to draw a real circle with bezier curves, but you won’t be able to see the difference. </p>
      <p>An O made with two circles generally doesn’t look right, as Mark said. Only Avant Garde has that, I think, though I may be wrong.</p>
