    <p>Hey Everyone!</p>
    <p>I’m doing a logo for a birthday party room &amp; retail space for girls. Basically, 1/2 the place is a retail store thats selling dolls, puzzles, etc &amp; the other side is a dressup, karaoke for the kids who have parties.</p>
    <p>Its called bella club. </p>
    <p>I want you to critique my logo (so far). Black is probably not the final color.</p>
    <p>1- The diamonds represent a black &amp; whote harlequin counter thats inside the retail area. Do you think the white is TOO white?<br>
    2- Do you enjoy the outer glow? Will this be hard to quality control when in vector (e.g. printing errors, etc).<br>
    3- Too adultish? Age group is 4-12. Mind you, the soccer moms are the ones paying for all this (higher income target audience).<br>
    4- My clients are trying to add a crown to this. Do you think its missing something or do you feel its finished?</p>
    <p>Thanks in advance</p>
