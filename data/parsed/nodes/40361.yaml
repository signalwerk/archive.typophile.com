    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/31465" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Writers</a>&nbsp;: Andy&nbsp;Crewdson</strong></p>
    <p>Andy Crewdson is a type historian and critic (<a href="http://typophile.com/node/40358">perhaps from Bethesda, Maryland</a>) who studied history at <span class="caps">UC</span> Berkeley, and more recently in Washington, <span class="caps">DC</span>. Crewdson created the popular blog <a href="/node/add/wiki?edit%5Btitle%5D=Lines%20and%20Splines" title="Create node &quot;Lines and Splines&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Lines and Splines</a> and later replaced it with <a href="/node/40362" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">New Series</a>. He has been noticeably absent from typographic discussion and publishing since 2003, a fact bemoaned almost yearly with cries of “Whatever happened to Andy Crewdson?” on all the type blogs and&nbsp;forums.</p>
    <p><strong>Discussion</strong><br><a href="http://www.google.com/search?q=site:typophile.com+crewdson">Typophile Threads</a><br><a href="http://www.google.com/search?q=site:typographica.org+crewdson">Typographica&nbsp;Posts</a></p>
    <p><strong>External Links</strong><br><a href="http://www.themorningnews.org/archives/personalities/andy_crewdson_of_lines_splines.php">Interview on <em>The Morning News</em></a> (2000)<br><a href="http://www.typotheque.com/authors/andy_crewdson/">Writing on Typotheque.com</a> (2002-03)</p>
