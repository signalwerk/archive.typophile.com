    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Writers" class="freelinking" rel="nofollow">Writers</a> : Andy Crewdson</strong></p>
    <p>Andy Crewdson is a type historian and critic (<a href="http://typophile.com/node/40358" rel="nofollow">perhaps from Bethesda, Maryland</a>) who studied history at UC Berkeley, and more recently in Washington, DC. Crewdson created the popular blog <a href="/wiki/Lines%20and%20Splines" class="freelinking" rel="nofollow">Lines and Splines</a> and later replaced it with <a href="/wiki/New%20Series" class="freelinking" rel="nofollow">New Series</a>. He has been noticeably absent from typographic discussion and publishing since 2003, a fact bemoaned almost yearly with cries of "Whatever happened to Andy Crewdson?" on all the type blogs and forums.</p>
