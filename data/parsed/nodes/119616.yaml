      <p>@ Martin: The program is mostly film music with choir, sometimes even just choir a cappella. Even so, it's ridiculously off-register and nonsensical, since it sounds like a call to the poster reader to sing one specific song. Can't change it, though.</p>
      <p>By the way, I'm supposed to add three sponsor/affiliation logos. That's a bit tricky. They take up a lot of space and attention unless I make them so small as to blend with the text, at which point they might become very hard to read on the flyer (which is apparently going to be A6 format?).  I could stow them on the top of the page with the choir and orchestra logos, but it doesn't fit well with the diagonal movement up there, and makes the whole arrangement look messy.</p>
      <p>Argh... what do you think?  I'm currently leaning towards the second.</p>
      <p>(As for the drop shadow: I know it's out of fashion, but I like it here. I'll pretend it's for retro purposes!)</p>
