    votes: null
    html: |-
      <p>@ Jürgen: I can't seem to get the smoke right, it feels too cartoonish. I've left it away for now. (Unless you have a suggestion on how to make it fit into the abstract style of the rest of the graphic?)</p>
      <p>It wouldn't have occurred to me that the guy could be wearing flappy shorts. The hat and the fact that his legs wear skinny trousers are pretty unambiguous IMHO. I've tried manipulating the bottom of the coat, but whatever I did looked worse than before. Making the edges of the coat more symmetric actually favored the "shorts" impression, and removing the gap between them made him look like an exhibitionist rather than a mobster...</p>
      <p>By the way, I had to change the title on the poster because the boss of the project (who is the orchestra director) apparently insisted on his exceptionally stupid-sounding, kindergarden-worthy, misleadingly-spelled, content-challenged Swiss German title. That also required me to rearrange the title graphically, during which I changed the font to make it fit the width of the doorway.</p>
      <p>Finally, I caved and added a solid black drop shadow to the text on the red bar after all. Can I get away with it if I blame it on the retro style of the poster?  ;o)  It just gives the title some clout; without it, it feels fuzzy and incorporeal to me.</p>
      <p>@ Gabrielle: Good catch on the reds!  I changed them to be the same.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/film_19_small_3706.png"></div><p></p>
