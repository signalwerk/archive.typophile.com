    <p>The choir I'm singing in is having a design competition for its next concert poster, and I'm planning to take part. The theme is movie themes. Here's my current draft:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/film_10_small_4991.png"></div><p></p>
    <p>Any obvious blunders? Suggestions for improvement?</p>
    <p>I'm not too fond of the film strip carrying the logos, but I think that's a required element of the orchestra's logo.</p>
    <p>Cheers</p>
