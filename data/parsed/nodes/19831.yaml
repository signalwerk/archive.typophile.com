    html: |-
      <p>On just the word LIFE, the closest match is Pakenham Bold Cond<br>
      <a href="http://www.myfonts.com/fonts/typodermic/pakenham-boss/cnd-bold/testdrive.html" title="http://www.myfonts.com/fonts/typodermic/pakenham-boss/cnd-bold/testdrive.html">http://www.myfonts.com/fonts/typodermic/pakenham-boss/cnd-bold/testdrive...</a></p>
      <p>but that's not going to give you the whole alphabet you want I bet.</p>
      <p>Railroad Gothic isn't bad either<br>
      <a href="http://www.myfonts.com/fonts/linotype/railroad-gothic/railroadgothic/" title="http://www.myfonts.com/fonts/linotype/railroad-gothic/railroadgothic/">http://www.myfonts.com/fonts/linotype/railroad-gothic/railroadgothic/</a></p>
      <p>Interstate gives you the shorter cross bar (not sure that's the term) on the E and F</p>
