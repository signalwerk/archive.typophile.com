    <p>In any event, despite the fact that this typeface does have a lowercase k and an uppercase D, not shown in the illustration, that are sufficiently distinctive that it appears to have been intended for display... the sharp serifs and strong angled stress reminded me of a certain contemporary typeface from 1935 which had recently been embroiled in controversy concerning an alleged earlier origin in 1904.</p>
