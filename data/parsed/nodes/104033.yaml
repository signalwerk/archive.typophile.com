    <p>The "ILANO" seems to be like Futura squished and with the edges of the letters angled (in Futura the lower part of the L does that already) and with the A missing the crossbeam, but I'm not sure.</p>
    <p>"RISTORANTE ITALIANO" - Impact?</p>
    <p>The M looks like a squished Times New Roman?</p>
