    html: |-
      <p>This demonstrates the correct formation of the ligatures for the combination of shadda (the above, w-like sign) and the below vowels that, when in sequence with shadda form ligatures above the letter. They are the best illustration of ligature formation, because when not ligated with shadda the vowels sit underneath the letters, so the difference between ligation and non-ligation is really obvious. The second, left-most example illustrates the middle of the three mark ligations in your original illustration: U+0651 U+064D (the marks can be entered in either order).</p>
      <p>I believe the reason you were not seeing the ligatures forming in your own test is that you had failed to enter a letter before the marks. What you are seeing as a result is a sequence with dotted circle inserted, which the Uniscribe shaping engine is applying because it detects what it considers a script-level error, i.e. an Arabic mark without a preceding letter.</p>
