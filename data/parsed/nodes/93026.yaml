      <p>After reading about the <cite>Lookup Flag bit enumeration</cite> at this MS <a class="freelinking external" href="http://www.microsoft.com/typography/otspec/chapter2.htm" rel="nofollow">document</a> the flag <strong>0008 Ignore Marks - If set skips all combining marks</strong> called my attention.</p>
      <p>How do I know, or better yet, how does the computer know, whether a glyph is a combining mark ?</p>
  - id: 509952
    user_id: 1262
    user_name: John Hudson
    user_path: null
    user_image: /files/pictures/picture-1262.gif
    date_raw: 15 May 2012 — 8:08pm
    date: 2012-05-15T20:08:00
    votes: null
    html: <p>Glyphs are categorised in the font GDEF table. Glyphs need to be classified as marks in order to be positioned with GPOS anchor attachments, and can then be processed or skipped in other lookups. So, for example, marks may be skipped in letter ligation lookups. [It is possible to skip all marks, or to skip a particular collection of marks, although for compatibility with current software this requires the collections to be mutually exclusive.] Ligatures are also classified as such in the GDEF table, and are assigned a number of 'components' equal to the number of underlying characters. GPOS mark attachment can then be assigned per component so one can associate combining marks with letters within a ligature and position them correctly. [This runs into problems if a single ligature may represent variable numbers of underlying characters, but that doesn't occur in real world situations very often.]</p>
