      <p>John Hudson</p>
      <p>This was great. A lot of information in just one paragraph. I'm really thankful for your help.</p>
      <p>But I'm still pondering about my original question. There's no doubt in my mind (you just proved it) that my Word is working correctly. Why then, the substitutions shown on the figure attached are not taking place, specially after we consider the fact that these substitutions are prescribed by the <strong>very first lookup</strong> in the font Lookup List Table ?</p>
      <p>I have one hypothesis and I ask for your judgement on this :</p>
      <p>1) As I said before, all the substitutions we're talking about come from the 'ccmp' feature which refers to a lookup table, which is the first one, to be applied, on the font.</p>
      <p>2) The OpenType client, in this case MS Word, has the option of not using a specific feature, as stated <a class="freelinking external" href="http://www.microsoft.com/typography/otspec/chapter2.htm" rel="nofollow">here</a> under <strong>Features and Lookups</strong> : <cite>Features define the functionality of an OpenType Layout font and they are named to convey meaning to the text-processing client. Consider a feature named “liga” to create ligatures. Because of its name, the client knows what the feature does and can decide whether to apply it.</cite></p>
      <p>3) So my hypothesis is that MS Word is not applying the feature 'ccmp' for the 'arab' script with its default language, for some unknown reason. Maybe they had to change the order of the lookups in a new version of the font, and had to abandon this feature. But they had to keep it in the font file, in order to maintain its validation for old users, which I believe is the unique purpose of the 'sfnt' file format.</p>
      <p>4) To test this hypothesis I'll have to study all the other features in the font and see how they behave. The problem is that I'm doing this "by hand", which means, I'm parsing the file manually, by looking at its contents with a binary editor. And this is very time consuming and boring, as you can imagine. </p>
      <p>5)Do you know of any software that could show me these OpenType font tables in a straightforward manner ?</p>
      <p>Again, I thank you in advance, for your priceless help.</p>
  - id: 510028
    user_id: 1262
    user_name: John Hudson
    user_path: null
    user_image: /files/pictures/picture-1262.gif
    date_raw: 16 May 2012 — 11:26am
    date: 2012-05-16T11:26:00
    votes: null
    html: |-
      <p>What is happening in your original test is that the Uniscribe shaping engine is intervening in a way that breaks the glyph input string for the ccmp lookups because it considers the text string to be invalid because the marks are not preceded by a letter.</p>
      <p>The dotted circle that you see is not part of the mark glyph in the font, it is dynamically inserted by Uniscribe as a generic base for combining marks that do not have a valid base before them. In this case Uniscribe is treating each mark in a sequence not preceded by a letter as invalid, not just the first mark in the sequence. So what you end up with in the glyph string (logical order) is</p>
      <p><code>| dotted circle | mark 1 | dotted circle | mark 2 |</code></p>
      <p>So the ccmp ligation of the two marks is not occurring because there is a dotted circle glyph between them in the glyph string.</p>
      <p>In effect, Uniscribe is performing a kind of spellchecking, and inserting the dotted circle to provide visual indication that it thinks there is something wrong with the text. Don't get me started on how stupid it is to perform spellchecking operations at a script shaping level, but that's what Microsoft do.</p>
      <p><em>5)Do you know of any software that could show me these OpenType font tables in a straightforward manner ?</em></p>
      <p>DTL OTMaster would be my tool of choice. I'm not sure whether the free, 'Light' version has this capability though.</p>
