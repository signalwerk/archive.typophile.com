      <p>wolfattack: It basically sounds like hinting is a Windows problem then?</p>
      <p>Basically, yes. </p>
      <p>And there are two things about typography on windows that have undefined ends for the purpose of considering the end of hints. One is that ClearType of all kinds does "not use" all the resolution in y. Because of this, 130 dpi, which is what MS pad claims, is really only giving you 100. ClearType is like a little bleach. In addition, fonts with thin to skinny features are problematic on windows even if hinted, and this goes on as long as CT lasts, or until everyone has 300 dpi screens. Everyone. </p>
      <p>On testing hinting, I don't bother beyond the following: if the y direction hints do what they are supposed to, in aligning the overshoots and other vertical features, maintain a minimum of 1 pixel for each vertical feature, and consistently round like-features together from 9-67 px, the font is hinted for my world, where recommendations for size use are included in the presentation of the font during trials and licensing. This way, even if a skinny style is perfectly hinted, but does not render well on windows below 80 ppm, I can warn the web designer.</p>
