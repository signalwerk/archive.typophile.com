      <p>Font rendering is platform-specific (where platform is typically operating system, but can be individual applications (e.g. Adobe apps, which use their own rendering engines) or subsets of the system (e.g. the Metro environment on Windows 8). So the best way to test font rendering, hinted or otherwise, is to test widely on as many platforms as possible.</p>
      <p>It would be great to have a single test app that incorporates the different rendering engines from the different platforms, and allows you to switch between them and to compare them side-by-side.</p>
