      <p>Below doesn't address the thread, except to remind folk that much of this will change fairly soon now. I'm using an 18-inch Windows machine (9 x 16 inches), half tablet, half desktop, depending on your whim. And as a tablet, yes, mine's bigger than yours...Once nice thing about it is the resolution of that 18-inch screen is 120 ppi.</p>
      <p>Big tablets and laptops ---  The 15-inch Dell (Windows) is up to 235 ppi, and the 15-inch MacBook Pro essentially the same at 221.</p>
      <p>Slightly smaller tablets -- the Kindle Fire is at 340, and the iPad Air at 264.</p>
      <p>Phones: The smaller iPhones are close 400. There are better android devices, at least in terms of resolution. Way better than the first generation laser printers -- the Oppo Find 7 has an effective ppi of 534 ppi, if my math is right.</p>
      <p>Soon, hinting will matter only if you want the type to appear better on the old desktop computers. How long will people hang on to their old equipment? (Whilst admitting I'm hanging on to an Windows NT machine.) With Microsoft ending support for the XP-generation machines, nobody should be going on the internet with them.</p>
      <p><cite>Edit:</cite></p>
      <p>Just as a reminder, the old Linotron 202 typesetting machine, the gold standard in the 1970s and 1980s, had an resolution of about 960 dpi. By the time you actually exposed &amp; developed the the photographic paper, you're significantly lower than that. A bit more loss making the negative, an little more burning the plate. And then, apply the ink to <cite>paper</cite> with an offset press... </p>
      <p>Of course, there are resolution errors, rounding errors, and other distortions, and they're all quite different. But it won't be very long before the screen is as good as typesetting for offset printing used to be.</p>
