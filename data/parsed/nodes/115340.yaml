    <p>Hello everyone.</p>
    <p>I'm curious how everyone tests hinting of fonts? I know this may be obvious for some, but hinting is a fairly new thing for me, and so far i've only done auto hinting with TTFAutoHint.</p>
    <p>Without sounding totally dumb, I can't even seem to figure out how to test the quality of the hinting. Being on OSX, it seems like I'm having trouble finding a place to see how a TTF file actually is displaying.</p>
    <p>I've tried a few of these online drag and drop font testers, but there seems to be no change between loading an unhinted font, and a ttfautohinted font. Here are the sites I am referencing...</p>
    <p><a href="http://readableweb.com/latest-version-8-2-of-drag-n-drop-pangram-font-tester/">http://readableweb.com/latest-version-8-2-of-drag-n-drop-pangram-font-te...</a><br><a href="http://www.impallari.com/testing/">http://www.impallari.com/testing/</a><br><a href="http://fontdragr.com/">http://fontdragr.com/</a></p>
    <p>To make sure it wasn't just my files, I tried downloading the sample font files from the TTFAutoHint site and dropping them onto one of these sites and there is no difference in display between the autohinted file and manual hinted file.</p>
    <p>Do these sites just not show the hinting? Is this because i'm on a OSX and not Windows? Does anyone have any suggestions on ways to test the hinting of a font?</p>
    <p>Thanks!!!</p>
