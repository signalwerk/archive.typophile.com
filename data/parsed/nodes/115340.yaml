      <p>+1 (mostly) to what Jack B. Nimblest Jr. wrote - the 'mostly' growing out of the difference between manually hinting a font (a very fine level of control available) and autohinting a font (only a 'broad brush' level of control available).</p>
      <p>But by and large I declare a font adequately hinted for my world under the same criteria as Jack's.</p>
      <p>And, certainly, take heed:</p>
      <p>"In addition, fonts with thin to skinny features are problematic on windows even if hinted, and this goes on as long as CT lasts, or until everyone has 300 dpi screens. Everyone."</p>
      <p>Until then, beware of extremes.</p>
