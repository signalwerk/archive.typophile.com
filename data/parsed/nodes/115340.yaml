      <p>@wolfattack:</p>
      <p>I'm the guy who put the test page together at Readable Web that you cited.<br>
      Direct link:<br><a href="http://readableweb.com/tests/draganddrop/pangram-dragndrop-testfont.htm">http://readableweb.com/tests/draganddrop/pangram-dragndrop-testfont.htm</a></p>
      <p>Truetype hinting only comes into play when there's a TrueType interpreter in the graphics display engine that's programmed to interpret the truetype hinting code that the autohinter adds to the font.<br>
      Yes, it's mainly a Windows thing.<br>
      By now I've autohinted thousands of fonts and my opinion is that TTFAutohint 1.0 is certainly the best performing autohinter available.<br>
      Also - since all I'm concerned with is how fonts look in web browsers on various platforms, I first turn to view the results of my work in IE 8 on Windows XP. (That's the most demanding environment. If the hinted font looks good there, it will likely look good everywhere.)<br>
      I then branch out  - checking it on the latest version of IE in Win 7 (which uses the DirectWrite rendering engine), plus Chrome and Firefox on XP and Win 7.  Plus various Mac and Android devices, too. </p>
      <p>To get a really good result, you might need to tweak some of the outlines to make them a bit more "autohinter friendly". The autohinter has a personality, it "likes" some curves and shapes better than others.  (The notion might amuse, but it's true.)<br>
      (Tip: converting the Truetype outlines to PS outlines and running the Adobe autohinter first and checking the readout might help identify some irregularities that might also trip up the Truetype authohinter. The two are not all that dissimilar in their predilections.)</p>
      <p>I would also recommend that if the x-height of the font is not in line with ye olde system fonts like Arial, Verdana, Georgia, et al - meaning an x-height somewhere in the Goldilocks zone of 46% - 54% of the m-square (ie: 960 units on a grid of 2048) consider scaling up or down accordingly.</p>
      <p>I have seen startlingly - I mean, really amazingly better - hinting results solely from simply following the pack and scaling the font into that "traditional" zone.</p>
      <p>What I've found is that most designers are Mac centric and just don't want to go the extra mile to keep a windows machine handy just for the purpose of hinting and testing truetype fonts.  (And I certainly can understand why - it's a pain in the ass and there are just so many hours in the day.)</p>
      <p>Also, many type designers are focused near-totally on graphic design and just don't and won't ever accept it as their responsibility to provide a Truetype font hinted for the screen.  They just don't care, never will, and many have ongoing animosity about the fact that the Truetype flavor of Opentype and therefore the need for hinting still exists.  (Damned Microsoft!)<br>
      I'm not finding fault with this.  It's just the way it is. An observation.</p>
      <p>Hope some of this was helpful.</p>
