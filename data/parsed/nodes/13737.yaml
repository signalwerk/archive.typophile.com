      <p>I left the Typographic world in '94 and warped over to multimedia and web publishing. At that time things that <em>moved</em> interested me more than things that remained stagnant.</p>
      <p>The only thing that inspired me to jump back into type lore was many comments by young designers I started to see on the web.</p>
      <p>My favorite comment:<br>
      Re: Favourite typeface/font!<br>
      Reply #21 on: 1 Jun 05 by Stacey<br>
      <em>I've been using Univers a bit recently. It's kind of a relaxed Frutiger... or something</em></p>
      <p>-------------------------------------<br>
      Yes, I'm old, but I'm back in style!</p>
