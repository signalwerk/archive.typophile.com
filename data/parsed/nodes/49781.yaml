    <p>I’m working on a font that contains Smallcaps and a number of ligatures - fi fl ff ffi ffl ft fb fh fk fy ty.</p>
    <p>When testing the font and selecting small caps some of the ligatures return to there small cap glyphs, but ligatures fi fl ff ffi ffl do not change.</p>
    <p>Whats the normal practise for this situation - Is it best to create small cap versions of  FI FL FF etc.</p>
    <p>Also why do ligatures like ft fb change to the small cap glyphs but not fi fl ?</p>
    <p>Rr.</p>
