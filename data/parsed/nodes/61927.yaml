    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Grafika-Typophile_5233.gif"></div><br>
    Grafika is a completely original design, done in an “Art Deco” spirit reminiscent of the 1920s and ‘30s. I designed Grafika many years ago to be typeset for title cards, and both opening and end credits for the Merchant/Ivory feature film “Savages”. After the film's run, the design languished in my archives until recently when I rediscoved it. I have digitally redrawn Grafika, completing it with all the altenates, ligatures, math, foreign accented characters and punctuation that weren’t required of the original design for film. For more info and perspective on Grafica, read my <a class="freelinking external" href="http://blog.alphabetsoupblog.com/?p=450" rel="nofollow">BLOG</a> posting or download the <a class="freelinking external" href="http://www.michaeldoret.com/AlphabetSoup/Grafika_Brochure.pdf" rel="nofollow">Grafica PDF Brochure</a>.<p></p>
