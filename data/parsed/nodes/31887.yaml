  html: |-
    <p>Does anyone know where I can find more work/information on Ben Drury. I can’t seem to find much via Google. I know he’s a London-based designer and has quite an eye for custom lettering and type-logos.</p>
    <p>This is about the largest collection of his work I’ve found:<br>
    <a href="https://web.archive.org/web/20081007001838/http://www.wehaveaproblem.com/exhibitions/drury/trustmelondon.html" title="http://www.wehaveaproblem.com/exhibitions/drury/trustmelondon.html">http://www.wehaveaproblem.com/exhibitions/drury/trustmelondon.html</a> </p>
    <p>and I have the <a href="https://web.archive.org/web/20081007001838/http://www.amazon.com/Futura/dp/1861541341/sr=8-1/qid=1172775004/ref=pd_bbs_sr_1/103-8102982-7102227?ie=UTF8&amp;s=books">Futura </a> book he designed (which if you haven’t seen, is excellent.)</p>
