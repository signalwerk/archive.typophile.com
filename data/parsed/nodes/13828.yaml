    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indicies" title="Create node &quot;Indicies&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indicies</a>&nbsp;: <a href="/node/17745" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Designers</a>&nbsp;: Albrecht Duerer</strong> <em>Albrecht&nbsp;Dürer)</em></p>
    <p>Germany’s most famous painter of the Renaissance era. Lived in Nuremberg, but traveled at least once to&nbsp;Venice.</p>
    <p>In addition to his painting, Dürer was very interested in the proportions of the human body, perspective, and letterforms. He tried to develop a system to discover the geometric building blocks of the Roman alphabet (both the classical Roman uppercase letters, and the lowercase <a href="/node/13831" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Textura</a> letters (a variety of <a href="/node/12128" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Blackletter</a>).</p>
    <p>While his books on letterforms are beautiful, they were not influential in the course of typographic development. Dürer, however, did play an enormous role in the development of European typography: together with <a href="/node/13826" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Johann Neudoerffer the Elder</a>, he worked at the court of Holy Roman Emperor <a href="/node/13829" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Maximilian I</a> to create the <a href="/node/13772" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">fraktur</a> style of type (another <a href="/node/12128" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Blackletter</a> variety), in&nbsp;1517.</p>
