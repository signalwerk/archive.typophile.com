      <p>Ahh, that is vital info. Cochin and Mrs. Eaves aren't what you're looking for.</p>
      <p>Engravers is fairly benign so really any serif will sit well with it. We recently designed a <a href="http://www.therugmerchants.com/" rel="nofollow">rug shop identity</a> with Engravers and <a href="http://www.fontshop.com/search/?q=Warnock" rel="nofollow">Warnock</a>.</p>
      <p>Other contemporary serif faces:</p>
      <p><a href="http://www.fontshop.com/search/?q=Fresco%20OT" rel="nofollow">Fresco</a><br>
      <a href="http://www.fontshop.com/search/?q=Swift" rel="nofollow">Swift</a><br>
      <a href="http://www.fontshop.com/fonts/downloads/paratype/itc_charter_ot/" rel="nofollow">ITC Charter</a><br>
      <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_nexus_serif_ot/" rel="nofollow">FF Nexus</a></p>
