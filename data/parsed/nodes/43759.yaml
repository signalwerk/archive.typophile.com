    <p>HOLLYWOOD SIGN MELTDOWN LINKED TO GLOBAL WARMING<br>
    An inconvenient truth found in the Hollywood Hills</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Hollywood_Sign_4728.jpg"></div><p></p>
    <p>April 1, 2008 - Hollywood Hills, CA - Citizens and tourists alike noticed a<br>
    disturbing change over the last few days in the landmark sign. Portions of<br>
    the letters are melting off and dripping down the mountainside. Fans have<br>
    always tolerated the crooked baseline (due in part to seismic activity) but<br>
    the dripping letters have caused widespread alarm among tourists, actors,<br>
    scientists and local officials. Font experts at the Ascender Typographic<br>
    Preservation Institute (ATyPI) were on the scene analyzing the Hollywood<br>
    sign to determine the cause of the dramatic changes.</p>
    <p>"We use proprietary algorithms in our hinting software to accommodate<br>
    increasing levels of carbon dioxide in the atmosphere. These algorithms<br>
    enhance the legibility by optimizing the placement of letters on the<br>
    physical grids used to hold billboard fonts" said Thomas Rickner,<br>
    world-renowned font software specialist best known for his work on the<br>
    Verdana, Tahoma and Georgia fonts for Microsoft. "But the velocity of<br>
    pixelation modification in the Hollywood sign is both perplexing and<br>
    alarming. I've never seen anything like this before." he added.</p>
    <p>The National Commission on Historic Typefaces has engaged Charles Bigelow,<br>
    the distinguished Melbert B. Cary Professor at Rochester Institute of<br>
    Technology, to conduct a study on the impact of global warming on fonts<br>
    exposed to the environment. "We will be analyzing everything from gas pumps<br>
    to ancient Greek inscriptions chiseled onto buildings that aren't there<br>
    anymore, to see how fonts will change over time," said professor Bigelow.<br>
    "As Le Corbusier once said, 'Fonts of the future are usually fonts of the<br>
    past.' The only thing we won't be studying is outdoor signage on bank<br>
    buildings, since most financial institutions are now adopting Comic Sans as<br>
    their corporate font, to better celebrate their recent achievements. We need<br>
    to wait until the paint dries before doing further analysis."</p>
    <p>Meanwhile, as the famous Hollywood sign continues its decay, the Institute<br>
    will attempt to collect portions of letters which have melted and fallen to<br>
    prevent them from being sold on EBay.</p>
    <p>The enclosed photo was supplied by Dr. Matt Stevenson of the Ascender<br>
    Typographic Preservation Institute. No rights reserved.</p>
