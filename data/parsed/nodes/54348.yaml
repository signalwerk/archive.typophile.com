  html: |-
    <p>B&amp;P Typefoundry &amp; Sang Bleu are happy to announce the release of the Sang Bleu Type Collection. The collection is constituted by 9 fonts (Pro sets), all initially developed to act as display typefaces for the last issue of Sang Bleu. Most of the fonts are based on the Romain BP, which is Sang Bleu's main body text font. The collection also extends to extremes unusual like the Hairline Compressed or the Hairline Sans, providing graphic designers very strong stylistic tools. All fonts are designed by Ian Party and developed by B&amp;P.</p>
    <p>You can download a free trial version on our website to play with and  test for your futur projects.</p>
    <p>please visite BP website </p>
    <p><a href="http://www.bpfoundry.com/" title="http://www.bpfoundry.com/">http://www.bpfoundry.com/</a></p>
    <p>And to view more visit </p>
    <p><a href="http://sangbleu.com/" title="http://sangbleu.com/">http://sangbleu.com/</a></p>
    <p><a href="http://ianparty.com/" title="http://ianparty.com/">http://ianparty.com/</a><br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/SangBleu-family_4359.gif"></div><p></p>
