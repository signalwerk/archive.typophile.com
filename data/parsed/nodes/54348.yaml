      <p>SangBleu BP is based on the structure of Romain du Roi, like the Romain BP, that detail that appears on the "l" is on the Romain du Roi as well, it was a nice reference to the first modernist typeface. this detail is an alternate, the typeface as a "normal" "l" too. (like the double serif)</p>
      <p><a href="http://www.bpfoundry.com/fonts/cut.htm?font=18&amp;cut=52" title="http://www.bpfoundry.com/fonts/cut.htm?font=18&amp;cut=52">http://www.bpfoundry.com/fonts/cut.htm?font=18&amp;cut=52</a></p>
