    html: |-
      <p>Good eye, Randy! Here is today's result after some tweaking.  <br> <br>First, the bowls now intersect the verticals instead of blending into them. The top and bottom of the bowls also hit the stroke lower/higher to make more room for ink collection at small sizes. <br> <br>Second, I canted the top of all of the ascenders and tops of the vertical strokes. <br> <br>Third, the "i" and "j" now have round dots. <br> <br>The letters most changed were the  "a" and "b" and "q".  <br> <br>Now the question, should I keep going and try to sell this thing or start over? <br> <br></p>
