    html: <p>I'm only a beginner, but I personally think it's terrific. Very readable. My only thoughts at the moment are that for some reason, the opening at the top of the x gives me the illusion of being larger than the bottom. It would probably help the x to look a little more solidly "grounded" to open the bottom just a tad. Also, personally I think the lip (right word? bottom bit) of the e could come just a teensy bit further out. I didn't notice this in the running text, but in the display "furtive" the e seems to be slightly too far right.</p>
