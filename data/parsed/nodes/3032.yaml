    <p>This is not my first attempt at a serious sans design, but it is my most recent. It is in the very early stages of development, only the lowercase is drawn. It's a very sterile design with one goal in mind, legibility. It has sacrificed unique features to be extremely usable in a variety of typographic situations. Does anyone have comments? <br> <br></p>
