    date: 2004-02-09T11:32:00
    date_raw: 9 Feb 2004 — 11:32am
    votes: null
    html: "<p>Hi Matthew. <br> <br>Have I ever been <a href=\"http://www.typophile.com/forums/messages/29/10694.html?1053368946\">there</a>. But what a great learning opportunity. Just looking at the hamburger sample above I see three things you can learn from Frutiger's genius. <br> <br>1. The first is the terminals on the a, e and g. Frutiger brings the weight farther into the curve which makes for a more natural modulation. <br> <br>2. The bowl of the g rests above the baseline. Yours looks raised maybe a hair, but still low (ie. very close to the b). <br> <br>3. Check out the stem endings in the following glyphs: a, m, b, u, r, and g. Notice how Frutiger shaves his stems a bit to open the join, but also to appear optically the same width as the other side of the join. By comparison, yours are looking hefty. <br> <br>The resolution is too low to tell, but check to see if the counters on your b and g eat in to the stem (rather than run tangent, actually overshooting the stem). <br> <br>That said, yours is very well crafted. Nicely done. <br> <br>Randy</p>"
    html_clean: "<p>Hi Matthew. <br> <br>Have I ever been <a href=\"http://www.typophile.com/forums/messages/29/10694.html?1053368946\" class=\"link-lost\">there</a>. But what a great learning opportunity. Just looking at the hamburger sample above I see three things you can learn from Frutiger's genius. <br> <br>1. The first is the terminals on the a, e and g. Frutiger brings the weight farther into the curve which makes for a more natural modulation. <br> <br>2. The bowl of the g rests above the baseline. Yours looks raised maybe a hair, but still low (ie. very close to the b). <br> <br>3. Check out the stem endings in the following glyphs: a, m, b, u, r, and g. Notice how Frutiger shaves his stems a bit to open the join, but also to appear optically the same width as the other side of the join. By comparison, yours are looking hefty. <br> <br>The resolution is too low to tell, but check to see if the counters on your b and g eat in to the stem (rather than run tangent, actually overshooting the stem). <br> <br>That said, yours is very well crafted. Nicely done. <br> <br>Randy</p>"
