    <p>I am thinking about purchasing a set of Futura.<br>
    Which foundry should I go for? What is your preferred version, and why?</p>
    <p>I was thinking of going with a <a class="freelinking external" href="http://www.linotype.com/247688/futura1-valuepack.html">Futura Value Pack from Linotype</a> (about $150 6 fonts in 3 weights), but then I saw the  <a class="freelinking external" href="http://www.myfonts.com/products/bitstream/cambridge">Cambridge CD set from Bitstream</a><br>
    and since it has a total of 200 fonts for only $199, I thought it was a great deal. </p>
    <p>I am trying to build my font library at home for freelance projects, and Futura is a face I like to use frequently at work. I currently don't have a huge need for any special character sets, so I am leaning toward the Bitstream set since it includes many other fonts my library lacks. I wasn't sure if the price difference was simply because of the more limited character set, or if there is a quality difference between the foundries.</p>
    <p>Thanks! I value your opinions, and any guidance you can give.</p>
