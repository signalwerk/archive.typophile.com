    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Concepts" class="freelinking" rel="nofollow">Concepts</a> : Readability</strong></p>
    <p>"Legibility" is based on the ease with which one letter can be told from the other. "Readability" is the ease with which the eye can absorb the message and move along the line.</p>
    <p>--from ‘Types of Typefaces,’ by J. Ben Lieberman, 1967</p>
    <p>Whether this distinction reflects an underlying difference in reality is controversial. For some of the controversy see:</p>
