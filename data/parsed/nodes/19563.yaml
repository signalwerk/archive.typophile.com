    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Concepts" class="freelinking" rel="nofollow">Concepts</a> : Readability</strong></p>
    <p>"Legibility" is based on the ease with which one letter can be told from the other. "Readability" is the ease with which the eye can absorb the message and move along the line.</p>
    <p>--from ‘Types of Typefaces,’ by J. Ben Lieberman, 1967</p>
    <p>Whether this distinction reflects an underlying difference in reality is controversial. For some of the controversy see:</p>
    <p><strong>Discussion:</strong><br>
    <a href="http://typophile.com/node/17431" rel="nofollow">What Makes an Italic Easy to Read?</a><br>
    <a href="http://typophile.com/node/28777" rel="nofollow">Do Ligatures Improve Readability?</a><br>
    <a href="http://typophile.com/node/14373" rel="nofollow">Readability/Readerability</a><br>
    <a href="http://typophile.com/node/29048" rel="nofollow">Reading Research: What Is Needed?</a><br>
    <a href="http://typophile.com/node/31427" rel="nofollow">Large x-heights = More Readable?</a><br>
    <a href="http://typophile.com/node/83684" rel="nofollow">Readability</a></p>
