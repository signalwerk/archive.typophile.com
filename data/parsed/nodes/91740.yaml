  - id: 503546
    user: 181264
    date: 2012-04-04T18:53:00
    date_raw: 4 Apr 2012 — 6:53pm
    votes: null
    html: <p>I think the cross bar of the lower case 't' is what I question the most about this font.  I think I worked out the overall stroke balance from glyph to glyph very well, and still managed to pack it full of extreme width differences.  I tired to have every glyph have a thinner form tying into a bigger, thicker, or if you like, bolder stroke, and not just a little bit bolder.  On top of that I wanted it to be incredibly readable, and on my humble inkjet printer, it's very clear at 6 point, and likely would be at lower sizes than that.  The overall tone and color of the text appears even, and yet when you look at it at good size with anything longer than a quick glance, you can't help but notice it is full of flavor.</p>
    html_clean: <p>I think the cross bar of the lower case 't' is what I question the most about this font.  I think I worked out the overall stroke balance from glyph to glyph very well, and still managed to pack it full of extreme width differences.  I tired to have every glyph have a thinner form tying into a bigger, thicker, or if you like, bolder stroke, and not just a little bit bolder.  On top of that I wanted it to be incredibly readable, and on my humble inkjet printer, it's very clear at 6 point, and likely would be at lower sizes than that.  The overall tone and color of the text appears even, and yet when you look at it at good size with anything longer than a quick glance, you can't help but notice it is full of flavor.</p>
