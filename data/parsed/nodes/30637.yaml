      <p>I love the mark. Very sexy. However, the only logo that really integrates the type and the mark well is #2. The others seem as though the type is a completely separate element.</p>
      <p>In the logos you've created, I'm reading "Black" as one idea and "Blue Ball" as a second idea, and I keep wondering why the circle (ball) isn't blue. I believe "Black &amp; Blue" should be read as one single phrase (unless "blue ball" is some sort of pun re fetishism).</p>
      <p>The ampersand in logo 1 is my favourite. It reflects the whip from the mark well. As for typeface suggestions: I'll have to mull it over a bit more.</p>
      <p>Great job so far.</p>
      <p> - Lex</p>
