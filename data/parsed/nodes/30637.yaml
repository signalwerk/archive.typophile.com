      <p>For the text I would recommend if you are going to use a white keyline on text, in Illustrator (or similar), that you create the black text in one layer and duplicate the layer place it behind the previous one and then put a stroke on that, otherwise the stroke cuts off parts of the type.<br>
      Tim</p>
