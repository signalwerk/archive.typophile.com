      <p>Was about to create a new post about this news, but will instead simply point you to this alternative news source:<br>
      <a href="http://gizmodo.com/5914780/harvard-scientists-make-graphic-designers-look-lazy-by-using-dna-to-create-a-new-font" title="http://gizmodo.com/5914780/harvard-scientists-make-graphic-designers-look-lazy-by-using-dna-to-create-a-new-font">http://gizmodo.com/5914780/harvard-scientists-make-graphic-designers-loo...</a> </p>
      <p>The letter blocks are 64-by-103 nanometers.</p>
      <p>Also, the article in Nature is here:<br>
      <a href="http://www.nature.com/nature/journal/v485/n7400/full/nature11075.html" title="http://www.nature.com/nature/journal/v485/n7400/full/nature11075.html">http://www.nature.com/nature/journal/v485/n7400/full/nature11075.html</a></p>
      <p>This also makes me wish IBM had gone ahead and made a font from the work they did on the atomic logo:<br>
      <a href="http://www-03.ibm.com/ibm/history/exhibits/vintage/vintage_4506VV1003.html" title="http://www-03.ibm.com/ibm/history/exhibits/vintage/vintage_4506VV1003.html">http://www-03.ibm.com/ibm/history/exhibits/vintage/vintage_4506VV1003.html</a><br>
      <a href="http://www-03.ibm.com/press/us/en/photo/28500.wss" title="http://www-03.ibm.com/press/us/en/photo/28500.wss">http://www-03.ibm.com/press/us/en/photo/28500.wss</a></p>
      <p>Not sure Stanford could have completed the task with their even smaller technique:<br>
      <a href="http://www.sciencedaily.com/releases/2009/01/090130154918.htm" title="http://www.sciencedaily.com/releases/2009/01/090130154918.htm">http://www.sciencedaily.com/releases/2009/01/090130154918.htm</a></p>
