    html: |-
      <p>Puh-leeze.</p>
      <p><em>Harvard's Wyss Institute for Biologically Inspired Engineering</em></p>
      <p>How about Sensibly Inspired Engineering. All this little venture proves is that, feeling rather godlike, some scientists have succeeded in torturing the building blocks of life into predetermined shapes, without regard for the consequences. Personally, I shudder to think of what kind of life form might emerge if you strung these letterform Frankensteins into a seven-letter sequence that said “be fruitful and multiply yourself”—but not those exact words.</p>
      <p>(Props to Woody Allen)</p>
