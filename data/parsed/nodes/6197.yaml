    html: "<p>Of course, I was just saying I have additonal respect in this particular instance. <br>The tricky matter with history is to work on it leaving apart prejudices. A lot of historians \"demonized\" the figure of Adolf Hitler without any information on his formation (sorry for the pun) and life events. <br> <br>I've recently bought the book \"Adolf Hitler: Eine politische Biographie\" by Rainer Zitelmann in its italian edition and I think is the most honest and balanced analysis on him to date. <br>Different times, different places, but similar unfortunate events could contribute negatively to a personality (as Hitler) as well as a positive one. I'm thinking about the incredible series of bad luck and misfortunes passed by Abraham Lincoln before becoming Presidents of the US at the age of 51. <br>This \"parallel of sorts\" occurred to me reading a book on self-esteem by David Brooks and Rex Dalby, always in italian edition. <br> <br>The problem is the lack of information available on the childhood/teenage years/young age of Hitler. If you read Zitelmann's and some parts of the Mein Kampf you can see how much many decisions of Hitler came out of frustration and despair, although Hitler does not admit it. <br> <br>If Hitler had met a sensitive and good hearted person or friend (or more) in his Vienna years we could have ended up having a painting artist instead of a self-destructing dictator.</p>"
    html_clean: "<p>Of course, I was just saying I have additonal respect in this particular instance. <br>The tricky matter with history is to work on it leaving apart prejudices. A lot of historians \"demonized\" the figure of Adolf Hitler without any information on his formation (sorry for the pun) and life events. <br> <br>I've recently bought the book \"Adolf Hitler: Eine politische Biographie\" by Rainer Zitelmann in its italian edition and I think is the most honest and balanced analysis on him to date. <br>Different times, different places, but similar unfortunate events could contribute negatively to a personality (as Hitler) as well as a positive one. I'm thinking about the incredible series of bad luck and misfortunes passed by Abraham Lincoln before becoming Presidents of the US at the age of 51. <br>This \"parallel of sorts\" occurred to me reading a book on self-esteem by David Brooks and Rex Dalby, always in italian edition. <br> <br>The problem is the lack of information available on the childhood/teenage years/young age of Hitler. If you read Zitelmann's and some parts of the Mein Kampf you can see how much many decisions of Hitler came out of frustration and despair, although Hitler does not admit it. <br> <br>If Hitler had met a sensitive and good hearted person or friend (or more) in his Vienna years we could have ended up having a painting artist instead of a self-destructing dictator.</p>"
