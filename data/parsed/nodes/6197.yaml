    html: <p>I'm sorry, Matha, but in my case it's just respect. Which I always have in front of death and suffering caused by people. <br> <br>And Hrant, well, you know that our view on the Emigre library is quite the opposite than yours. And I'm still surprised you like Democratica and Ottomat. Maybe because you know Miles and me? No, I don't belive so. Maybe because the conceptual framework of Democratica (on the disbading of the Soviet Union) was really close to your experience. And maybe because my Ottomat (Tomazooma) was indirectly an homage on the American indian tribes. <br>But both these things do not show graphically in our types... <br> <br>Amyway you've an odd perception of what Emigre actually represented and of its importance. It's not surely the recennt Tarzana that has fostered what has come later. <br>May I ask you when and how you first came in contact with Emigre? <br>Also, say what you want, but Ottomat was influenced heavily by Triplex and Triplex Italic, after Gill and Futura/Semplicit</p>
