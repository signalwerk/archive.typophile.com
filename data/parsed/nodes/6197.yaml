    html: <p>&gt;I think the separation can certainly be useful [for helping out blackletter], it's just a bit devious to pretend they're not related. <br>You've summarized the problem in treating the issue very good, Hrant. I'll keep the separation, as Butler suggested, and it will not be a project on the swastika. But the nazist swastika usage will be addressed in one way or the other. <br> <br>I don't share the fatalistic attitude towards history's inability to help reflections and understand past errors ("teaching lessons" is more pretentious). An example is Paul's assumption on the arab Israeli people. The preconceptions against islamic culture are not a byproduct of so-called "compassion" towards the hebrew one (compassion is hardly an excuse for another form of violence). The preconceptions against islam are constantly reinforced by its fanatic fringes (which, of course, does not represent the actual religious beliefs) and the fact that christianity (but mostly so-called "christianity" and occidental culture in general) fears Islam. To me, and I am catholic, this is senseless, but it's a pretty diffused fear (especially in the US). We should turn back this attitude against the american reaction to the terrorism also. I wrote a letter to a Senator and to the US President, from the Food First webpages, as Emigre talked about it, knowing perfectly that it wouldn't have served nothing. They went ahead with their "military systems". But I did. <br> <br>Anyway, I think it would be better to save further ideas for a specific thread, if you agree. We're straying a little off the path while I would concentrate more specifically on the issues connected to the blackletter usage as propaganda. We may do one when I will decide to work on this book project, if you like the idea. I would love to have the opinion of many designers. I just don't know when... <br> <br>If you wish to keep talking of the issue, please start a new thread, so people can notice it.</p>
