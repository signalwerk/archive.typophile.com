    html: "<p>This post has taken about seven tangents. A few points I'll   <br>add to the array of topics:  <br>  <br>The Swastika vs. Blackletter:  <br>I think the separation between the two is easy for me, but   <br>perhaps, maybe not for people who lived it. Our cultural   <br>experiences shape our understandings. See my next point.  <br>  <br>Blackletter:  <br>If I compile all the usage of blackletter I've seen in my   <br>lifetime (outside of history books) growing up in Southern   <br>California, I associate blackletter with newspapers and   <br>Mexican groups. (At least, in San Diego, where I grew up,   <br>most of the Hispanics are Mexicans. I'll apologize now if   <br>other Hispanic groups in the US use it). At least in Southern   <br>California Latinos own blackletter, and therefore, that's my   <br>association to it as well.  <br>  <br>The UN Logo:  <br>What the wheat? Surely he's not talking about the hammer   <br>and sickle?</p>"
