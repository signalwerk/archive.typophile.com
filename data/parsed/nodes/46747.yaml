  html: |-
    <p>An old thread <a href="http://www.typophile.com/node/34363" title="http://www.typophile.com/node/34363">http://www.typophile.com/node/34363</a> didn't seem to resolve this issue, wandering off as threads are wont to do . . .</p>
    <p>Recently, we set a book for a publisher in southwest, where a number of editors at the press have a Spanish background. (As far as I know though, most of their formal schooling was Anglo.) Anyway, they felt that when a excalm- or questiondown was followed by a capital letter, the exclam- questiondown should ride on the baseline, otherwise, it should not.</p>
    <p>We wrote a simple calt feature to take care of this<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/down_5956.gif"></div><br>
    Where (F) is foundry, and (1) and (2) show the added calt feature.<p></p>
    <p>Any thoughts before we consider adding this to other fonts (where the license permits).</p>
