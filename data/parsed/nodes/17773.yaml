      <p>Thanks for that link to Louise Fili, Stephen. I actually checked out "French Modern" from the library and scanned some pages for reference.</p>
      <p>I bought Estilo through MyFonts earlier today and am playing with that. </p>
      <p>I actually purchase Coquette about a year ago on another chocolate related project. However, I don't think it will work for this project.</p>
      <p>I'm trying to avoid the high contrast Deco faces, which is why I was looking for a serif. I want my design to whisper Deco as opposed to shouting it.</p>
