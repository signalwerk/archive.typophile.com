      <p>Have you been down the road of sans deco types like <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontpackage&amp;startrow=1&amp;records=&amp;currpage=1&amp;totalrecords=5&amp;displayfontid=FB.100193.0.0&amp;fontRendererText=chOcOlates" rel="nofollow">Anisette</a>, <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=EF.100997.0.0&amp;attributes.sampleSize=48&amp;sampleText=Chocolates&amp;sampleSize=96" rel="nofollow">Bernhard Fashion</a>, <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=ITC.100474.0.0&amp;attributes.sampleSize=48&amp;sampleText=Chocolates&amp;sampleSize=48" rel="nofollow">ITC Vintage</a> and <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=C.9363.0.0&amp;attributes.sampleSize=48&amp;sampleText=Chocolate&amp;sampleSize=48" rel="nofollow">Arwen</a>?</p>
