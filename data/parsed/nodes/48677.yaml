    html: <p>Could be a cut &amp; paste job? The p and r are on a different slant, from each other and the rest of the letters. The i has a different serif to m &amp; n which is different to the p. The terminal of the n is also singular. Could have been someone’s calligraphy made into a font with scan font or something?</p>
