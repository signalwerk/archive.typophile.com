      <p>By the way, Paul: I saw your Kilkenny typeface. Wouldn't it be possible to have a PDF of it? I see most IHOF faces have it.</p>
      <p>I grew a fondness for late 19th and early 20th century faces (which I used to quite dislike) in the last year or so, and I collect material.</p>
      <p>I have a Coca Cola tray which reproduces a calendar from 1891, and I always guessed if the face used was a lead type. It's "Kilkenny Swash", so the lead original is probably to pre-date at least of 5 years compared to your 1896 dating.</p>
