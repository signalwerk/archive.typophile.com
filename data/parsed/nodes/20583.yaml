      <p><em>William’s more narrow definition of a “rock star” is interesting and clever.</em></p>
      <p>Yeah, but I don't think you need to be under 30. I would still call Matthew Carter a "rock star." Truth be told, when I was asked to describe him by some of my designer buddies, that was the actual term I could used.</p>
      <p>Rock Star=1. Larger than life persona<br>
                       2. High level of notoriety in your field<br>
                       3. A person that exudes confidence and/or charisma<br>
                       4. One who performs rock music for a living and is astronomically successful at    doing so</p>
      <p>The term "rock star" in and of itself isn't bad, its just the context that its used. Its kind of like talking about how great your "lawnboy" is at a landscaping convention.</p>
