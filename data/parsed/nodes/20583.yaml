      <p>&gt;So few type designers seek fawning attention, and the work is so different and un-spontaneous.</p>
      <p>Yeah, Christian Schwartz announces on his 'Orange Italic' that he's "prepared to be famous"--knowing that no type designer is ever going to be famous. </p>
      <p>But to lighten up about the 'rock star' thing: </p>
      <p>To be a rock star you have to be under thirty and ridiculously successful at what you do. Hoefler was a rock star, but sorry now he's just a type designer. Hoefler &amp; Frere-Jones could have been a 'boy band', but now they're just working stiffs. That makes today's actual type rock stars: Underware--whoops they just got too old--and the aforementioned Mr. Schwartz, who shortly will be just another overworked type designer.</p>
      <p>Get to work Kris Sowersby! :)</p>
