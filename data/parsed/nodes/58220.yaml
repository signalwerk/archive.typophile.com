    html: |-
      <p>I thought that that g and y style of descender was pretty common among Bauhaus/geometric style typefaces. But I was wrong. Even the extensive alternate-rich Mark Simonson's Mostra Nuova (<a href="http://new.myfonts.com/fonts/marksimonson/mostra-nuova/" title="http://new.myfonts.com/fonts/marksimonson/mostra-nuova/">http://new.myfonts.com/fonts/marksimonson/mostra-nuova/</a>), which features a similar g, doesn't offer the right y (a feature for Mostra Nuovissima, Mark? ;-)<br>
      For typeface in the style you can peruse Mike Yanega's Bauhaus-style Font ID Guide (<a href="http://www.bowfinprintworks.com/BauhausFaces.html" title="http://www.bowfinprintworks.com/BauhausFaces.html">http://www.bowfinprintworks.com/BauhausFaces.html</a>).<br>
      Here's some suggestion for similar construction:<br>
      <a href="http://new.myfonts.com/fonts/cubo/cyclo/" title="http://new.myfonts.com/fonts/cubo/cyclo/">http://new.myfonts.com/fonts/cubo/cyclo/</a><br>
      <a href="http://new.myfonts.com/fonts/atype/scripio-a-simple/" title="http://new.myfonts.com/fonts/atype/scripio-a-simple/">http://new.myfonts.com/fonts/atype/scripio-a-simple/</a><br>
      <a href="http://new.myfonts.com/fonts/btn/register-sans-btn/" title="http://new.myfonts.com/fonts/btn/register-sans-btn/">http://new.myfonts.com/fonts/btn/register-sans-btn/</a></p>
      <p>That said, if it's just for something quick &amp; dirt...<br>
      <a href="http://www.dafont.com/cyclo.font" title="http://www.dafont.com/cyclo.font">http://www.dafont.com/cyclo.font</a></p>
