    html: |-
      <p>For the words THOR HEYERDAHL consider a condensed version of Trend Sans One <img src="/sites/default/files/old-images/TrendSansOneAsThor_3974.gif"><a href="https://www.myfonts.com/fonts/latinotype/trend/">https://www.myfonts.com/fonts/latinotype/trend/</a> This is all lowercase, except for _A_.<br>
      I note that the _R_. which appears twice in this phrase, is different from the _R_ on PIONEER.  So PIONEER appears to be a different font.<br>
      The unusual _N_ in PIONEER is the same as the _N_ in COGNAC so they are presumably the same font. I have seen the unusual _G_ in COGNAC somewhere...<br>
      Don</p>
