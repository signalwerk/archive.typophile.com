    <div class="info">Submitted by <a href="/user/2942" title="View user profile.">Eben Sorkin</a> : 29.May.2008 9.35am </div>
      <p>TypeCon2008 Update - 5/29/08 - TypeCon2008 Registration is Now Open!</p>
    <p>TypeCon2008: Punkt<br>
    July 15-20, 2008<br>
    Hyatt Regency Downtown<br>
    Buffalo, New York</p>
    <p>presented by The Society of Typographic Aficionados (SOTA)</p>
    <p>in partnership with the Western New York Book Arts Collaborative, the Buffalo Academy of Science Charter School, the Roycroft Campus Corporation/Roycroft Inn, the University at Buffalo, and the Albright-Knox Art Gallery</p>
    <p>————————————————————————————————-<br>
    - TypeCon2008 Early Registration Now Open<br>
    - Book Your Hotel Room at the Hyatt Regency in Buffalo<br>
    - Thanks to Our Sponsors and Partners<br>
    ————————————————————————————————-</p>
    <p>Greetings! Now’s the time to register for TypeCon2008! This year’s conference is going to be an incredible event you won’t want to miss. TypeCon2008 features more than 70 legends and innovators, including Chuck Bigelow, Matthew Carter, James Craig, John Downer, John Hudson, Dard Hunter III, Akira Kobayashi, Pete McCracken, Jan Middendorp, David Pankow, Elizabeth Resnick, Stefan Sagmeister, Paul Shaw, Erik Spiekermann, Ilene Strizver, Jakob Trollbäck, Doyald Young, House Industries, and NLXL.</p>
    <p>TypeCon2008 explores type for the screen, printing history, Dutch design, type in motion, the American Arts and Crafts movement, Arabic calligraphy and typography, and much more. Special events include the third annual Type and Design Education Forum, an exhibition of international type and design, and a closing night gathering at the home of the Roycrofters.</p>
    <p>Don’t miss this fantastic week of speakers, workshops, exhibitions, typographic site-seeing, and more. </p>
    <p>TypeCon2008 website - <a href="http://www.typecon.com" title="http://www.typecon.com">http://www.typecon.com</a></p>
    <p>————————————————————————————————-<br>
    EARLY BIRD REGISTRATION IS NOW AVAILABLE! DON’T MISS THIS CHANCE TO SAVE BIG!<br>
    ————————————————————————————————<br>
    SOTA is committed to bringing you a high-quality and affordable conference. Conference registration and workshop fees are the lowest you’ll find at an event of this quality in North America. Early-bird discounts are offered to all attendees registering by June 16. Join SOTA while you register for the conference, and receive an extra discount!</p>
    <p>TypeCon2008 will offer a variety of great presentations and panel discussions, focused hands-on workshops, tours, special events, an international exhibition of new type and design, and more.</p>
    <p>Conference registration fees and deadlines are as follows:</p>
    <p>Early registration (through June 16)<br>
    SOTA members: $235 professionals/$125 students<br>
    Non-members: $275 professionals/$150 students</p>
    <p>Regular registration June 17 through June 30)<br>
    SOTA members: $275 professionals/$145 students<br>
    Non-members: $320 pro/$165 students</p>
    <p>Late/walk-up registration (after June 30)<br>
    SOTA members: $320 professionals/$165 students<br>
    Non-members: $375 pro/$185 students</p>
    <p>Optional pre-conference workshops<br>
    Wednesday-Thursday, July 16-17 - 9:00 am-5:30 pm<br>
    $50 per half-day session | $100 per full-day session (plus materials/lab fees, if any)</p>
    <p>Optional pre-conference type and design education forum<br>
    Thursday, July 17 - 9:30 am-5:30 pm<br>
    $100 for the day (including your choice of breakout sessions)</p>
    <p>Secure registration is now available on the TypeCon2008 website. Seating is limited - register today to book your spot!</p>
    <p>Direct link to TypeCon2008 registration - <a href="http://www.sotalink.com/registration" title="http://www.sotalink.com/registration">http://www.sotalink.com/registration</a></p>
    <p>TypeCon2008 website - <a href="http://www.typecon.com" title="http://www.typecon.com">http://www.typecon.com</a></p>
    <p>————————————————————————————————-<br>
    ROOMS ARE GOING FAST AT THE TYPECON2008 HOTEL AND HEADQUARTERS - HYATT REGENCY DOWNTOWN BUFFALO - BOOK YOURS TODAY!<br>
    ————————————————————————————————-<br>
    The TypeCon2008 conference hotel and headquarters is the Hyatt Regency in downtown Buffalo. The center of activity for TypeCon2008, the Hyatt is in a terrific central location near to the main workshop venue, dining, and nightlife.</p>
    <p>The Buffalo Hyatt Regency has just installed the wonderful Grand Beds we enjoyed so much in Boston. The Hyatt has plenty of space for us, an inviting restaurant and lounge in the atrium, an award-winning steakhouse on the premises, fitness center, and many other amenities.</p>
    <p>The Hyatt Regency is offering TypeCon2008 attendees an incredible rate on rooms! Instead of the $124 per night rate previously announced, we have negotiated an even better deal for TypeCon2008 attendees - just $109 (plus taxes) per night for single/double rooms. This is an amazing bargain in Buffalo during the height of summer, and the hotel will be completely sold out during TypeCon2008.</p>
    <p>Book your room ASAP - the special TypeCon2008 attendee rate is available until June 18, 2008, or until our room block fills, whichever comes first. We always fill our room block fast, and demand is higher than ever this year. Book now to avoid disappointment.</p>
    <p>To book online with your credit card, please visit this link:</p>
    <p><a href="http://buffalo.hyatt.com/groupbooking/buffasota2008" title="http://buffalo.hyatt.com/groupbooking/buffasota2008">http://buffalo.hyatt.com/groupbooking/buffasota2008</a></p>
    <p>Enter your travel dates in the “Find Rooms and Rates” section, and enter G-SOTA in the field calling for Group/Corporate #. If the website says the hotel is sold out or you experience any other issues, please make your reservation by phone instead.</p>
    <p>To book by phone, call the central Hyatt Reservations Department at 1-800-233-1234 or the Buffalo Hyatt directly at 1-716-856-1234 and mention TypeCon and Group Code G-SOTA.</p>
    <p>Hyatt Regency Buffalo TypeCon2008 discount reservations site - <a href="http://buffalo.hyatt.com/groupbooking/buffasota2008" title="http://buffalo.hyatt.com/groupbooking/buffasota2008">http://buffalo.hyatt.com/groupbooking/buffasota2008</a></p>
    <p>Hyatt Regency Buffalo information site - <a href="http://buffalo.hyatt.com" title="http://buffalo.hyatt.com">http://buffalo.hyatt.com</a></p>
    <p>————————————————————————————————-<br>
    THANKS TO OUR PARTNERS AND SPONSORS<br>
    ————————————————————————————————-<br>
    We’d like to thank the wonderful individuals and businesses that make TypeCon possible. Without their continued support, we would not be able to offer such an affordable, high-quality event. Please support our sponsors and partners!</p>
    <p>ORGANIZING PARTNERS:<br>
    Western New York Book Arts Collaborative - <a href="http://www.wnybookarts.org" title="http://www.wnybookarts.org">http://www.wnybookarts.org</a><br>
    Buffalo Academy of Science Charter School - <a href="http://www.bascs.org" title="http://www.bascs.org">http://www.bascs.org</a><br>
    Roycroft Campus Corporation/Roycroft Inn - <a href="http://www.roycroftcampuscorporation.com" title="http://www.roycroftcampuscorporation.com">http://www.roycroftcampuscorporation.com</a><br>
    University at Buffalo - <a href="http://www.buffalo.edu" title="http://www.buffalo.edu">http://www.buffalo.edu</a><br>
    Albright-Knox Art Gallery - <a href="http://www.albrightknox.org" title="http://www.albrightknox.org">http://www.albrightknox.org</a></p>
    <p>HEADLINE SPONSOR:<br>
    Monotype Imaging - <a href="http://www.monotypeimaging.com" title="http://www.monotypeimaging.com">http://www.monotypeimaging.com</a></p>
    <p>72 PT SPONSORS:<br>
    Daidala - <a href="http://www.daidala.com" title="http://www.daidala.com">http://www.daidala.com</a><br>
    Font Bureau - <a href="http://www.fontbureau.com" title="http://www.fontbureau.com">http://www.fontbureau.com</a><br>
    FontShop - <a href="http://www.fontshop.com" title="http://www.fontshop.com">http://www.fontshop.com</a><br>
    Microsoft - <a href="http://www.microsoft.com" title="http://www.microsoft.com">http://www.microsoft.com</a><br>
    Linotype - <a href="http://www.linotype.com" title="http://www.linotype.com">http://www.linotype.com</a><br>
    MyFonts - <a href="http://www.myfonts.com" title="http://www.myfonts.com">http://www.myfonts.com</a><br>
    P22 type foundry - <a href="http://www.p22.com" title="http://www.p22.com">http://www.p22.com</a><br>
    Veer - <a href="http://www.veer.com" title="http://www.veer.com">http://www.veer.com</a></p>
    <p>48 PT SPONSORS:<br>
    Adobe - <a href="http://www.adobe.com/type" title="http://www.adobe.com/type">http://www.adobe.com/type</a><br>
    Ascender Corporation - <a href="http://www.ascendercorp.com" title="http://www.ascendercorp.com">http://www.ascendercorp.com</a><br>
    FontLab - <a href="http://www.fontlab.com" title="http://www.fontlab.com">http://www.fontlab.com</a><br>
    Process Type Foundry - <a href="http://www.processtypefoundry.com" title="http://www.processtypefoundry.com">http://www.processtypefoundry.com</a><br>
    URW++ - <a href="http://www.urwpp.de" title="http://www.urwpp.de">http://www.urwpp.de</a></p>
    <p>OTHER SPONSORS: Canada Type, House Industries, Mark Simonson Studio, Munchfonts, Typeco, TypeTrust, YouWorkForThem, E-phemera Fonts<br>
    MEDIA PARTNERS: Graphic Design: USA, Print magazine<br>
    TECHNOLOGY PARTNERS: Apple Computers, Three Islands Press<br>
    EVENT PARTNERS: Advertising Club of Buffalo, Buffalo Convention and Visitors Bureau, Eric Mower and Associates, Karpeles Manuscript Library Museum, Pecha Kucha, Rochester Institute of Technology (RIT), Type Directors Club (TDC)<br>
    ASSOCIATION PARTNERS: American Printing History Association (APHA) Hallwalls Contemporary Arts Center, Type Club of Toronto, the Typophiles</p>
    <p>TYPECON2008 IDENTITY DESIGNED BY:<br>
    David A. Moore, Buffalo, New York - <a href="http://www.brokencans.com" title="http://www.brokencans.com">http://www.brokencans.com</a></p>
    <p>SPONSORSHIP AND VOLUNTEER OPPORTUNITIES AVAILABLE: If you would like to contribute to TypeCon2008 by sponsoring, donating goods and services, or volunteering, please send an email to <a href="mailto:info@typesociety.org">info@typesociety.org</a>. </p>
    <p>————————————————————————————————-<br>
    ABOUT TYPECON AND SOTA<br>
    ————————————————————————————————-<br>
    TypeCon is the annual conference of SOTA, an international non-profit organization dedicated to the promotion, study, and support of type design, typography, and the related arts. For more information about SOTA, please visit the website at <a href="http://www.typesociety.org" title="http://www.typesociety.org">http://www.typesociety.org</a>.</p>
    <p>Have questions, need answers? Send us an email at <a href="mailto:info@typesociety.org">info@typesociety.org</a>.</p>
    <p>See you in Buffalo!<br>
    _________________________________________________________________</p>
    <p>You are receiving this email because you subscribed to the TypeCon email news list. To unsubscribe, please email <a href="mailto:typecon-news-unsubscribe@typesociety.org" title="mailto:typecon-news-unsubscribe@typesociety.org">mailto:typecon-news-unsubscribe@typesociety.org</a>, or use the subscription form located at <a href="http://www.typecon.com" title="http://www.typecon.com">http://www.typecon.com</a>.<br>
    _________________________________________________________________</p>
