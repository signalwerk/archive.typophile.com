      <p>SmartyPants software contextually substitutes single and double “dumb” quotes by curly quotes, however:</p>
      <p>All single quotes are treated as “right” quotes — this allows the apostrophe for abbreviation to work correctly.<br>
      So you have to adopt the North American style of using double quote marks for primary quotations, to make the system work correctly.</p>
