    <p>As an old-school-trained typo (ie: pencils and character counting, definitely a dead art) I sometimes struggle with applications like Flash, which seem never intended to natively support what I consider to be basic typographic considerations such as ligatures.</p>
    <p>Using my Mac, I can easily type Option-Shift-5 for an ’fi’ lig and Option-Shift-6 for an ’fl’, but what do I do when I want more ligatures?</p>
    <p>I’m specifically after an ’ffi’ lig, which I don’t know the key combination for. But how would I determine the key combos for this, or for an ’ffl’ - especially when I have an expert set available?</p>
    <p>Is there an app or utility which would look at the font and tell me what key combo to use? I seem to remember something that did this under Mac System 7, 8 and 9 (showing my age now, lol), but can’t find anything similar for OSX.</p>
    <p>I’m not sure if this final bit of info is relevant or not, but it’s an Open Type font I’m using - a well-crafted one too, so I’m sure the ligatures will be present.</p>
    <p>Please help me find them!</p>
