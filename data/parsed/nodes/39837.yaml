      <p>Jon — In case you check back, and in case it still might not be clear from the foregoing, OT layout features, like {liga}, are bits of programming inside the font that provide rules for substitutions and the like. In order for a user like yourself to take advantage of these features, an application needs to provide support for them. </p>
      <p>There are specifications for certain features to be activated by default; others are discretionary, to be applied on an ad hoc basis. The application needs to be written to implement these kinds of OT layout features and then provide an interface for the user to activate or deactivate them. </p>
      <p>Apparently Flash does not do so yet.</p>
      <p>Levels of support for OpenType layout features vary widely between applications still, and this whole arena is still in a state of flux. </p>
      <p>HTH. Sorry to have left you hanging earlier. I’m glad that Zachary provided a workable solution for you.</p>
      <p>— K.</p>
