      <p>Flash currently lacks support for OpenType advanced typographic features.<br>
      OpenType substitutions (ligatures, for example) don’t work in it.</p>
      <p><a href="http://weblogs.macromedia.com/emmy/archives/2007/05/tiny_clarificat.cfm">Adobe is working on a “new low level text framework” for the next Flash Player</a>. Priorities seem to be bidirectional / complex text layout support. Maybe we will finally have OT support in Flash?</p>
      <p>I wonder how this will perform in terms of CPU load... I imagine it could get very heavy very quickly, AS code and OT lookups running at the same time.</p>
      <p>— <a href="http://www.omine.net/">omine.net</a></p>
