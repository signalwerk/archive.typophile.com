      <p>In old Postscript fonts, these ligatures, when provided, would have been accessible via the keyboard because they would have been put in place of other characters (rather than having a place of their own). So, for instance, typing a W would yield the ffi character in an old Adobe expert set. Other foundries had/have different standards. (For instance, H&amp;FJ and Font Bureau would put ffi in the ∞ position in their regular fonts.)</p>
      <p>In an Opentype font, however, ff-ligatures have their own unique place, but cannot be accessed via the keyboard. They must be deployed via OpenType layout features (specifically the {liga} feature). Or they may be manually inserted, if the application offers a method to do this (such as the glyph palette in Adobe applications).</p>
      <p>If your application provides neither of these, then you may be out of luck.</p>
      <p>— K.</p>
