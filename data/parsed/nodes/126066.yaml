    <p>Hey guys!</p>
    <p>I'm thinking on returning to typography once again (it must be the third time). I've been concentrating myself in code essentially for the past years and I think I will continue with it but every time I come around my type books, my "still to finish" work or whenever I receive some money from MyFonts on one of the fonts I have that I wouldn't use I think: "Should I get back?"</p>
    <p>So, as somewhat a transition, "what if I started by doing some scripts that would help me and other developers?"<br>
    I'm a pretty good developer so I don't think this would be that hard.</p>
    <p>Are you finding a lack in that subject? Something you would like to see done?</p>
