    html: "<p>I'd say \"Don't look at the Bauhaus font, period\". In my opinion it's Benguiat's black sheep (for the name, if not for any other reason: the design is light years away from Bauhaus-stated \"rationale\"). <br> <br>I think such a \"hard\" design like the one you're attempting, Philippe, leaves not so much space for interpretation. You risk to fall in the obvious or to overtly charge it of the things Cristian grouped as \"flaws\" which would make the thing not so usable. <br> <br>So, my only advice (very personal) would be to use the geometric framework you like as a basis to add subtle elements in order to increase the interest of the Eye. I.E. something like terminal parts, fake or true inktraps, modulation in some form. But this of course will send you in another direction.</p>"
    html_clean: "<p>I'd say \"Don't look at the Bauhaus font, period\". In my opinion it's Benguiat's black sheep (for the name, if not for any other reason: the design is light years away from Bauhaus-stated \"rationale\"). <br> <br>I think such a \"hard\" design like the one you're attempting, Philippe, leaves not so much space for interpretation. You risk to fall in the obvious or to overtly charge it of the things Cristian grouped as \"flaws\" which would make the thing not so usable. <br> <br>So, my only advice (very personal) would be to use the geometric framework you like as a basis to add subtle elements in order to increase the interest of the Eye. I.E. something like terminal parts, fake or true inktraps, modulation in some form. But this of course will send you in another direction.</p>"
