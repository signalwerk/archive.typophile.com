    html: <p>Thanks for the feedback. <br> <br>The S was difficult to make, I didn't want the center point to be in the middle but I might have to. As for the E, I tried to have the top and bottom extensions to be equal but I remember it made it look too "prominent", but now that I look at the other letters it might be a good idea to change it. I'll have the change the 3 or else it would look like an inverted 3. <br> <br>I definitly have to reduce the A's lenght. I'll post more soon.</p>
