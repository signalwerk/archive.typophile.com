    html: "<p>Hi phillipe <br> <br>I think this needs a lot of feedback and a lot of modifications from you. <br>your big A is one, but there are others, let get started: <br> <br>Firts, i must think that mathemathicaly your design is very consistant, but opticaly has a lot of defects. <br> <br>the termination of your  of your C and G is not quite right, i think  you should make a diagonal cut there. <br> <br>The detail on you H and T is bothering me <br> <br>the round corner on your F makes the letters fall to the right. <br> <br>your L looks more like an H <br> <br>on your S, Y, Z, 2 and 5 the youu should drop down the center point. <br> <br>i dont understand the extension of the bottom horizontal  on your E, and in you S the left termination should be shorter. <br> <br>you should rotate 90 degrees your X and see how it looks. <br> <br>keep the good work <br> <br>CG <br> <br>PD. i think you should work a lot on the optical corrections, your O should be a little bit bigger. <br> <br></p>"
