    html: <p>Hi, Philippe, <br> <br>I think that your new 7 is an improvement. But I think that your 5 is trying to be an S, or a horizontally-flipped Z... maybe the top vertical stroke should have a right-angle transition to the middle horizontal stroke, rather than a curved one. <br> <br>I agree with Cristian that the center points of S, Z, 2 and 5 should be dropped a bit -- slightly above the center, to keep the top counterspaces from seeming bigger than the lower ones. <br> <br>&gt; <i>it looked like a harder version of Burosama</i> <br> <br>I think you mean <a href="http://www.myfonts.com/fonts/bitstream/itc-busorama/bold/">Busorama</a>, right? <br> <br>Keep up the good work! <br>R.</p>
