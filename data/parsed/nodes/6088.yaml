  html: <p>Hello all. I'm posting an image of a font I am working on. It's my first font and I just started reading about the font-mojo, so it's gonna take some time before this font is ready. I noticed after going through my font list that it looks somewhat like Burosama (not as classy maybe). I wanted to give it a 1930s look while trying to bring something new as well. There's a lot to do still anyway. Let me know what you think of it.</p>
