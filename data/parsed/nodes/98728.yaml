      <p>Ah yes, Scruton. While it's worthwhile to watch/read his stuff, but I'm usually dropping out because of his assumptions on 'the contemporary' in culture and arts. His stance on how people should fill the 'free time' they get in the western world only fits the elitist few. If we all lived according to his thoughts on the arts, the world would be a quite boring place.</p>
      <p>Sure people should be taught more to appreciate art and culture (according to Scruton this should be done to teach people true emotions and beauty) But hey, some people care less, and to always direct your personal flame war at them as the destroyers of society (as Scruton does) gets really old fast.</p>
      <p>To stay on topic, Niemeyer was an amazing architect who showed us the possibilities of architecture and need to break from the mold. With construction methods becoming more advanced these days, he is a great icon who showed how to merge technique and aesthetics.</p>
