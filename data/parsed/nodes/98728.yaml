      <blockquote><p>Visiting Glasgow, one expects a lot of Mackintosh, but he was marginal and designed few major buildings...</p></blockquote>
      <p>No doubt, but he was well felt across the pond ... no more so than in F.Ll.W's Prairie School. </p>
      <p>Tomas Jefferson also had the right 'clients' didn't he tho ...  and a very far reaching architectural influence at that. </p>
      <p>One of my all time favorite architects from times past is Hawksmoor ...a London architect. His Westminster Abby towers are f'n awesome. Even tho he was schooled by Wren I consider Nicholas Hawksmoor to be a transitional architect who indeed had a crazy influence. In all his stuff there's a distinct edge to his ordering.</p>
      <p>You don't get that with Niemeyer's work nor with his protégés such as Hadid and company ... ;)</p>
      <p>n.</p>
