      <p>Niemeyer’s quote on beauty was a riposte to functionalism.<br>
      By that, he didn’t mean that the clever solution to a functional problem could be considered beautiful, but that there was a sensual enjoyment to be had from the perception of form.</p>
      <p><em> … not very many architects have been able to determined a whole city's vibe. </em></p>
      <p>Visiting Glasgow, one expects a lot of Mackintosh, but he was marginal and designed few major buildings in his day, despite his present reputation. However, the city centre is full of Victorian Greek Revival buildings, a large number designed by Alexander Thomson, which really set the tone of the place.</p>
    html_clean: |-
