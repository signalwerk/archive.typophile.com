    html: <p>I went on a long walk across London many years ago, visiting all of the surviving Hawksmoor churches. I want to go back to Christchurch Spitalfields some day, because it has been beautifully renovated inside now; when I was there it was in terrible state. They are an eccentric collection of buildings, each quite different from the others and from pretty much everything contemporary. I don't think his sense of proportion was as good as Wren's, but he was more imaginative and less prone to repeat himself.</p>
