      <p>That reminded me of a line quoted by Eric Bana's character in Hanna, "Music; a combination of sounds with a view to beauty of form and expression of emotion". You could take everything after "sounds" and be talking about type or indeed, architecture.</p>
      <p>I have been thinking about this a lot lately but is beauty a transcendent thing or infinitely subjective? Beyond that it is deeply personal but I am intrigued by perspectives.</p>
