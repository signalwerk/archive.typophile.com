      <p>Hey cio, I suggest you start with much smaller words if you've never done this before. What you have now are nice stylisticly but readability is not there. Show this to someone who has no idea what it is and they should be able to say 'Hey that's suchandsuch' Forget the style for now. It is the solution of the ambigram that should denote its style. Going into it with a pre-determined is a problem in itself. Conquor the four letter words you're familiar with, then try 5, then maybe 6. There are limits to what can be done...even by John. How do I know this?</p>
      <p>John is actually my professor and I work closely with him, have done amibgrams myself for his typography final (where he let us do whatever we wanted as long as it related to type). I also get to see some of his commissioned work as I help him digitize his ideas since he doesn't always have time.</p>
      <p>I hate to say this but as John says, if it's not a success, it's trash. Don't sit there and play around with something that needs to be completely reworked. Maybe this isn't what you were looking for but that's my opinion. :)</p>
      <p>Dave</p>
