      <p>Thank you both for your comments. I have found them very helpful.</p>
      <p>David, I will be trying out shorter names and words as well...I guess I had just gotten a bit ambitious ^_^. And I agree that sometimes, if something cannot work, there is no use in fighting with it. That is why I attempted two entirely different styles, instead of just wracking my brain on the first design that I came across. </p>
      <p>timd, your reading is correct. I am happy that you were able to see the two names (Robert and Rocio). I wrote Rocio with a lowercase r because I could not figure out how to fit an upside-down uppercase r into Robert successfully...but I will keep trying. Using an ampersand to try to create the R in Rocio is a great idea. </p>
      <p>Unfortunately (for my design), I have an unusual name. So if anyone that is not familar with it may not be able to pick it out right away or may question if their reading is correct (even if it is, as in timd's case).</p>
      <p>Again, thanks and I'll keep trying...^_^.</p>
