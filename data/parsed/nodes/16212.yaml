  html: <p>I fell in love with ambigrams after reading Angels &amp; Demons by Dan Brown, and after my friend showed me more of Langdon's work, I had to give it a shot myself...are they readable? I've been looking at them so long that i can't tell anymore. </p><div class="imageWrap"><img src="http://typophile.com/files/rr_ambi1.jpg"></div> <div class="imageWrap"><img src="http://typophile.com/files/rr_ambi2.jpg"></div><p></p>
