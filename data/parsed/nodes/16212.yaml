      <p>I'm reading 'Robert and rocio', the problem is that although Robert sprang out at me the lack of word breaks and an unfamiliar word (rocio) make the rest difficult to pick out. I prefer the Art Nouveau lettering, I wonder if you might employ an ampersand and develop a way of making the R of rocio uppercase.* The dot on the i could also be combined with the c.<br>
      Tim<br>
      *I hope my reading is accurate, if not most of my comments will be rubbish</p>
