  html: "<p><!---Attachment: widesans.swf-!--></p><center><table border=\"1\"><tbody><tr><td><img src=\"http://www.typophile.com/forums/icons/mime_gif.gif\" align=\"LEFT\" alt=\"application/x-shockwave-flash\">widesans.swf<br><a href=\"http://www.typophile.com/forums/messages/29/widesans.swf\"><b>widesans.swf</b></a> (2 k)</td></tr></tbody></table></center><!---/Attachment-!--> <br> <br>Hi. <br> <br>This is my attempt at a single weight, ultra-extended sans. I wanted to steer clear of curveballs for my own learning purposes. I was shooting for rounds that gave a nod to, but weren't squared (like bank gothic or eurostile extended). Also this is my first time to attach a swf. Hope it works. <br> <br>-Randy<!--!-/attachment-!--><!--!-attachment:--><p></p>"
  html_clean: "<p><!---Attachment: widesans.swf-!--></p><center><table border=\"1\"><tbody><tr><td><img src=\"http://www.typophile.com/forums/icons/mime_gif.gif\" align=\"LEFT\" alt=\"application/x-shockwave-flash\">widesans.swf<br><a href=\"http://www.typophile.com/forums/messages/29/widesans.swf\"><b>widesans.swf</b></a> (2 k)</td></tr></tbody></table></center><!---/Attachment-!--> <br> <br>Hi. <br> <br>This is my attempt at a single weight, ultra-extended sans. I wanted to steer clear of curveballs for my own learning purposes. I was shooting for rounds that gave a nod to, but weren't squared (like bank gothic or eurostile extended). Also this is my first time to attach a swf. Hope it works. <br> <br>-Randy<!--!-/attachment-!--><!--!-attachment:--><p></p>"
