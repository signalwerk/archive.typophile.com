    html: <p> He he. <br> <br>Is it just me or is Microgramma the same (or almost exactly the same) as Eurostile also by Novarese. As mentioned in the first post, I was trying to design something that, as marc mentioned, is less geometric (the shoulders of the letters aren't nearly as square). <br>In fairness though, the lower case is quite Eurostile-ish, particularly where the branches/bowls meet the vertical stems. I may have to rework the way these join to reference Novarese less. Thoughts? <br>All that aside, my favorite is the uc G. <br>Thanks. <br>Randy </p>
