  html: |-
    <p>Hello, everybody. This is to let you know of my latest font release: Riff. It's my third typeface design and the first more "serious" one. Since I have no formal type design education, it's always a great deal of work to figure things out. Hope you enjoy it. Hope you buy it. Hope. :)</p>
    <p><a href="http://new.myfonts.com/fonts/estudiocrop/riff/" title="http://new.myfonts.com/fonts/estudiocrop/riff/">http://new.myfonts.com/fonts/estudiocrop/riff/</a></p>
    <p>Thanks for your time. Feedback's apreciated.<br>
    Cheers!</p>
    <p>Dado<br>
    <a href="http://www.dadoqueiroz.com" title="www.dadoqueiroz.com">www.dadoqueiroz.com</a><br>
    www.flickr.com/dadoqueiroz</p><div class="imageWrap"><img src="http://typophile.com/files/riff-flickr_4190.png"></div><p></p>
