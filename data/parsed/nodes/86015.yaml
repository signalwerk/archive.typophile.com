  html: |-
    <p>I'm trying to identify the attached font from the source book of the Ancient Kingdoms: Mesopotamia RPG by Necromancer Games, 2004. WhatTheFont didn't help. Any help would be greatly appreciated.</p>
    <p>If anyone can recommend a similar font, that is a readable font with a bronze age/cuneiform feel to it, that would also help.</p>
    <p>Thank you.</p>
