    html: |-
      <p>I like a pointy tip, as in Geometric 415, some weights of Futura, Neutraface, Nobel, the aforementioned Eagle.</p>
      <p>Gill Sans has a nice A. As does Today Sans.</p>
      <p>Gotham is nice at the lighter weights, but from Bold on down the counters start to fill in.</p>
      <p>I think this is kind of a strange topic. Most of those A's are kind of uninspiring. Were you bored or something? Or doing a logo where you need a big A?</p>
      <p>I tend to focus more on the R with Sans, am partial to the Franklin Gothic/Gotham/Avenir style.</p>
