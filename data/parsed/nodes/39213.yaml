    <p>Though I generally shy away from any article that involve phrases like "<a href="http://www.newsweek.com/id/70983" rel="nofollow">Reinventing the Book</a>", I’m still mighty curious about Amazon's font selection for its Monday-launched e-book device, Kindle. I mean, for starters, out of all typeface in the world, why <a href="http://gadgets.boingboing.net/2007/11/18/amazon-kindle-ebook.html" rel="nofollow">Caecilia</a>?</p>
    <p>However, I think that Amazon might have gotten it right this time, because the device was:</p>
    <ul>
    <li>Birthed with a culturally-centered principles, and</li>
    <li>Built by sociologists and ethnographers</li>
    </ul>
    <p>As quoted from the article:</p>
    <blockquote><p>...he [Jeff Bezos] ticks off a number of attributes that a book-reading device...must have. First, it must project an aura of bookishness; it should be less of a whizzy gizmo than an austere vessel of culture.</p></blockquote>
    <p>Compare this with <a href="http://www.learningcenter.sony.us/assets/itpd/reader/" rel="nofollow">Sony Reader's</a>:</p>
    <ul>
    <li>Feature and benefit-centered principle, and</li>
    <li>Clunky reading interface that attempted to mirror exactly the appearance of a physical book or a PDF file (that looked like it was designed by a programmer instead of a sociologist). Look, dudes, with every new medium must come a new presentation model that is specifically suited to that medium, even if the contents themselves are old and dusty.</li>
    </ul>
    <p>As quoted from their website copy:</p>
    <blockquote><p>The Sony® Reader provides a new way to experience reading. It boasts an impressive display, utilizing breakthrough technology that’s almost paper-like. In addition, the text can be magnified for sight-impaired readers. Daylight readable, high contrast, high resolution, near 180º viewing angle.</p></blockquote>
    <p>I think that if any revolution is to take place, it has to take the human spirit into account. From what I’ve read so far, Amazon seemed to do just that; but it remains to be seen whether those words were true to principle or just extremely empathic/clever PR.</p>
    <p>Your thoughts?</p>
    <p>Note: this article is a repost of <a href="http://linkenfuego.wordpress.com/2007/11/19/though-i-generally-shy-away-from-any-article-that-involve-phrases-like-“reinventing-the-book”/" rel="nofollow">what I’ve written in my blog</a>, because I think that the content is relevant to our community.</p>
