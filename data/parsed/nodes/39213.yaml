      <p>With all these talks, then, why would you ever want to read on an ebook device over a regular book? I’m mighty curious, because our community is pretty steeped in tradition.</p>
      <p>For me, it’s a question of habit. I’m used to reading one storybook at one time before finishing it and moving on to another book. Had I have a habit of reading, say, 3 novels at a time, or doing a comparative study of some sorts, then I might use Kindle to save some space on my bag. That’s the only reason for using that I can think of.</p>
      <p>Again, the question of the day is “why would you ever want to read on an ebook device over a regular book?” I’d love to know all of your opinions.</p>
      <p>I also think that if a multifunction device like Kindle is to succeed, it’s got to offer something more than just <em>convenience.</em> <a href="http://linkenfuego.wordpress.com/2007/06/28/i-have-now-just-realized-that-the-web-development-software-coda-is-equal-to-iphone-in-spirit/" rel="nofollow">After the iPod, everything also has to be <em>elegant.</em></a> And I’m not just talking about it in the physical sense, but also in the user interaction and mental sense.</p>
      <p><a href="http://youtube.com/watch?v=BKUKQ7QqOHw" rel="nofollow">Watching its instructional video</a> almost made me wish for an iPhone-like interface. Everyone in <a href="http://typophile.com/node/39250" rel="nofollow">lazyeye88’s post</a> would agree, no ;^) ?</p>
