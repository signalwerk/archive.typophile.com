      <p>examples of use:</p>
      <p>- you are a freelancer and need to go to other countries for 1 week, 1 month, 5 month, where you wont be able to get books in a language you understand. though, you dont want to carry 20 kg of books with you.</p>
      <p>- you travel very often and you dont want to carry heavy and big books or magazines with you.</p>
      <p>- you enjoy to read magazines but you always throw them away after use, and you dont want to hurt the forests too much.</p>
      <p>- you own 2000 books and suddenly you decide to go and live in another country for 3 or 4 years, then going back. its not worth the cargo shipping, but you miss your books.</p>
      <p>- you are a kid going to school and you are tired of the 15kg bags which destroy your back.</p>
      <p>- you are in starbucks coffee and you wish to read a nice book, novel or magazine, right here, right now. if the ebook reader has wifi, it'd be great to download articles on the go.</p>
      <p>etc etc etc.</p>
      <p>dr</p>
