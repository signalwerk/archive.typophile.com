  html: |-
    <p>Just released a nice set of numbers, rescued from a 1838 Type Specimen Book issued by the Fonderie Clement, Bruxelles.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ClementNumbers_6258.png"></div><p></p>
    <p>The 5 is my favorite, the upper part is unique.<br>
    I fell in love with it. And so I decided to digitize them all.<br>
    I hope you enjoy them! I made them with love.</p>
    <p>Available for download at <a href="http://goo.gl/cgxts" title="http://goo.gl/cgxts">http://goo.gl/cgxts</a> Just $15</p>
    <p>I'm not completely sure, but I think that Clement was a Didot's apprentice, who then started his own foundry. If anyone has more info on that, I will appreciate it.</p>
    <p>Cheers,<br>
    Pablo</p>
