    <p>1This is pretty simple for professionals, yet apparently not for someone like me who just wants to make ONE font from an image.<br>
    I need someone to convert these glyphs in this image to a TTF. The ordering is in IBM 437 format and I don't mind it being converted and arranged for ISO 8859-1 at this point:</p>
    <p><img src="https://dl.dropboxusercontent.com/u/67765234/Photos/dft_base.bmp"></p>
    <p>Due to the gray pixels, it needs to be in 2bpp. It's easy to find free and easy B&amp;W raster font editors, but <strong>how</strong> exactly does it cost over $150 to add a few bits of gray to a glyph??</p>
