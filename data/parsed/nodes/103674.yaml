      <blockquote><p>... convert these glyphs in this image to a TTF ...</p></blockquote>
      <blockquote><p>... how exactly does it cost over $150 to add a few bits of gray to a glyph??</p></blockquote>
      <p>So what do you want, <em>exactly</em>? TTF fonts are regular fonts -- outlines, which are usually filled with black. The only "raster" images inside are low-resolution optimised bitmaps. (Disregarding, for the moment, recent non-standard additions of PNG bitmaps.) Regular TTF fonts can be displayed by any software that support fonts. You will get grayscale at the discretion of the software used, its settings, and the size you display it at (some software automatically disables antialiasing at larger sizes).</p>
      <p>A raster font, on the other hand, is pretty much what your image shows: a single bitmap or a list of bitmaps, which need custom software support to display.</p>
