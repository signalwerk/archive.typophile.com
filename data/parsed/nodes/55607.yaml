    html: |-
      <p>Mike, </p>
      <p>in FontLab Studio 5, to make sure nothing changes, you should have a "kern" feature generated in the OpenType panel, and also all the classes imported into the lower-right part of the OpenType panel (using <em>Import FontLab Classes</em> from the OpenType panel flyout menu). Only then you can dump or freely rearrange your classes in the Classes panel. </p>
      <p>Of course once you've imported the classes into the OpenType panel (i.e. converted them from the FontLab syntax into AFDKO syntax), in Preferences / General Options / Unicode and OpenType, disable <em>Add all glyph classes to OpenType feature definition code</em>, and in Preferences / Generating OpenType &amp; TrueType / Kerning, disable <em>Generate OpenType kern feature if it is undefined or outdated</em>.</p>
