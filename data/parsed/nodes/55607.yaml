  html: |-
    <p>In Fontlab, if a font is complete regarding all kerning classes and kerning pairs and the information is compiled into the OpenType kern feature… and you happen to copy and paste a non key glyph over a glyph that is marked with the red 'key glyph' mark… does anything actually change?</p>
    <p>I imagine nothing would change being that all the kerning and class information is already compiled but I'm still curious about this. I'd hate to 'update kern feature' and re-compile and have things change… It doesn't look like there's a quick way to re-tag a key glyph after it changes either… any thoughts?</p>
    <p>Thanks,</p>
    <p>Mike</p>
