    <p><a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_massive_ot/" rel="nofollow">FF Massive</a> is a typeface system designed by Amsterdam based designer <a href="http://www.fontshop.com/fonts/designer/donald_beekman/" rel="nofollow">Donald Beekman</a> (aka DBXL). With original sketches dating back as far as 2001, FF Massive already has a long history and has since been used in many <a href="http://www.dbxl.nl/" rel="nofollow">DBXL</a> designs. It is suitable for logos, flyers, posters and magazine headlines. Be it Drum’n’Bass, Techno or Trance, FF Massive has a distinct musical background. With its 2010 release the FF Massive OT family was expanded with an extra outline version into eight different OpenType fonts, divided in four variations which together form a versatile typographic system. The eight different FF Massive variations enable the user to compose a number of combinations, which can lead to surprising results, especially with the use of contrasting colours. The fonts come with a <a href="http://image.static.fontshop.com/blog/newsletters/january11/pdfs/ff_massive_manual.pdf" rel="nofollow">PDF manual</a> (1.4 MB) explaining how the FF Massive type system is best employed. Enjoy!</p>
