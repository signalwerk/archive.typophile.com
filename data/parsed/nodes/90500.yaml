    html: |-
      <p>In terms of curve definitions, there are two: cubic (PS)<br>
      and quadratic (TT). Most people design in the former, but<br>
      most actual fonts end up in TT format. Ideally you design<br>
      in the same curve definition model as the output format,<br>
      but most people never get comfortable (or bother getting<br>
      comfortable) designing in quadratics.</p>
      <p>hhp</p>
