      <p>This is a slab serif with median spurs. You may have an exact match in Anton Krylov's Insane Rodeo <a href="http://www.dafont.com/ifc-insane-rodeo.font?fpp=100&amp;text=OREGON+TRAIL" title="http://www.dafont.com/ifc-insane-rodeo.font?fpp=100&amp;text=OREGON+TRAIL">http://www.dafont.com/ifc-insane-rodeo.font?fpp=100&amp;text=OREGON+TRAIL</a><br>
      Also lots of similar fonts, including several well made ones from Font Mesa:<br>
      Cowboy Western:<br>
      <a href="http://www.myfonts.com/fonts/fontmesa/cowboy-western/" title="http://www.myfonts.com/fonts/fontmesa/cowboy-western/">http://www.myfonts.com/fonts/fontmesa/cowboy-western/</a><br>
      Gold Spur<br>
