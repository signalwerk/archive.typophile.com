    <p>Hallo everyone. I have an interesting question.</p>
    <p>I am designing a photo book with lots of photographers contributions from different countries. It is a dutch publisher, but the book is in english only.</p>
    <p>One section contains one contribution per photographer, and it is in alphabetical order according to the names of the photographer. </p>
    <p>There are a few of them which have last names starting with W, and one of them is Wåhlstrand.</p>
    <p>My dutch colleauges sorted it as if the å was an a, but the photographer is swedish, and å comes almost lasst in the swedish alpahabet. While it is not in the dutch and english alphabets at all. </p>
    <p>So my qusetion is, should I treat it as an å or an a? The book is in english, the photographer is swedish, the publisher is dutch. How do I treat an å in english alphabetica order?</p>
  html_clean: |-
    <p>Hallo everyone. I have an interesting question.</p>
    <p>I am designing a photo book with lots of photographers contributions from different countries. It is a dutch publisher, but the book is in english only.</p>
    <p>One section contains one contribution per photographer, and it is in alphabetical order according to the names of the photographer. </p>
    <p>There are a few of them which have last names starting with W, and one of them is Wåhlstrand.</p>
    <p>My dutch colleauges sorted it as if the å was an a, but the photographer is swedish, and å comes almost lasst in the swedish alpahabet. While it is not in the dutch and english alphabets at all. </p>
    <p>So my qusetion is, should I treat it as an å or an a? The book is in english, the photographer is swedish, the publisher is dutch. How do I treat an å in english alphabetica order?</p>
