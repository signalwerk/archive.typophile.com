  html: <p>Hi, all. I'm new here. I'm David Thometz (a.k.a. "Gulliver" or "GulliverUT") and I'm out here in Salt Lake City. I've been an admirer of all of your designs for some time, and have been doing my level best to be a self-taught type designer. (Uh-oh... :D ) <br> <br>I have quite a few fonts in the works. This is the first one I have publicly shown, although I have been using my own fonts in my freelance designing for years. <br> <br>While Architrave is my own design, it was largely inspired by (and could be described as a transporter accident between) Clarendon and Jenson. <br> <br>I would welcome any comments, as well as suggestions on how to go about marketing and licensing some of my fonts. <br> <br>Thanks for making such a forum as this possible. <br> <br>David</p>
