    html: "<p> I think your running text sample is super. <br> <br>An aside concerning numerals: I myself prefer to give them vertical stress (like in some of Gill's work) instead of the traditional horizontal. So as much as I like that zero I rarely use it, and have been looking for something nice* with vertical stress that is still distinguishable from the letter \"o\". Last month I found it: look at the one in Berthold Wittingham. <br> <br>* The traditional old-style solution of making the zero a thin circle with no stroke contrast I find horrid. And I think it was made that drastic because back then the *compositor* had to be able to easily distinguish it when sorting a type case. We no longer have this issue, so there's no real need to make it so ugly. <br> <br>BTW, you had asked about marketing, and I for <br>one think that myfonts.com is the best avenue <br>for many designers. <br> <br>hhp </p>"
    html_clean: "<p> I think your running text sample is super. <br> <br>An aside concerning numerals: I myself prefer to give them vertical stress (like in some of Gill's work) instead of the traditional horizontal. So as much as I like that zero I rarely use it, and have been looking for something nice* with vertical stress that is still distinguishable from the letter \"o\". Last month I found it: look at the one in Berthold Wittingham. <br> <br>* The traditional old-style solution of making the zero a thin circle with no stroke contrast I find horrid. And I think it was made that drastic because back then the *compositor* had to be able to easily distinguish it when sorting a type case. We no longer have this issue, so there's no real need to make it so ugly. <br> <br>BTW, you had asked about marketing, and I for <br>one think that myfonts.com is the best avenue <br>for many designers. <br> <br>hhp </p>"
