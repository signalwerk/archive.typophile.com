  - id: 141706
    user: 1203
    date: 2002-01-08T22:42:00
    date_raw: 8 Jan 2002 — 10:42pm
    votes: null
    html: "<p> Joe: <br> <br>To be completely honest, I've hate a sort of love-hate relationship with the shapes of these characters as well (lc \"f\", \"j\", \"t\", \"y\" and, to a lesser extent, the tail of the lc \"a\"), and for the very reason you mentioned. My opinion pendulum swings back and forth from \"novel, quirky and interesting\" to \"odd, unfamiliar shape that seems wrong\" and back again. <br> <br>I decided to take the risk of showing them as is, trusting that unfamiliar might just be unfamiliar and not necessarily bad. I'm actually surprised that you're the FIRST person to mention it on the forum -- I really thought more would have before now. (One of my friends offline mentioned it as well, with the same reservation against passing final judgement until I got more of a body of feedback.) <br> <br>I tried a few alternate forms, such as a \"buttonhook\" curve (which ended up being used instead as the lc \"f\" and \"j\" and the smooth-curved \"t\" in Tinhorn, showing elsewhere on the Serif Forum). I also tried forms based more closely on Clarendon and Jenson, but neither of these seemed quite right for this font either. The final curve shape could be described as roughly similar to Clarendon's ball-terminal lc \"j\" with the ball knocked off, or a bent-and-thickened Jenson lc \"j\" (at least, as revived in the Centaur &amp; Hightower forms). <br> <br>So, now that it has been mentioned, does anyone else have an opinion on these forms? Are they \"novel, quirky and interesting\" or \"odd, unfamiliar shapes that seem wrong\"? Or something else? <br> <br>===== <br> <br>Sbo: <br> <br>Of course, the only glyphs that I have completed for the italic set are the dark black ones on the Architrave Italic display. The greyed glyphs are merely sloped romans, and will be replaced as the italic characters are completed. The italics are being designed generally narrower than the romans, sloped to an average of 12 degrees right of vertical, and as cursive in stroke form as is feasible.  <br> <br>Regarding the lc \"g\", do you think that only the italic form should lose the \"ponytail\" ear, or are you suggesting losing it in the roman and sans forms also? I considered both a horizontal ear and also an abbreviated curve ear for the italic \"g\", but I kind of like the distinctiveness of the exaggerated ear form as designed. <br> <br>As for the italic lc \"g\"'s tail, I modeled it after many versions of the triangular-shaped loop of the Jenson italic form (compare Centaur Italic [Arrighi], Bembo Italic [also based on Arrighi], Hightower Italic, and Adobe Jenson Italic, among others). Architrave is a rather heavy typeface in weight, and I know that it does tend to clog in greyscale JPEG images onscreen. It doesn't seem to have that problem when printed or in vector-based applications. Getting the font's hinting done may help solve the problem. Still, I'll look at ways to air out the loop. Some time in the future, I'm sure I'll get around to doing a lighter weight for book and long text applications. <br> <br>I have to agree with you somewhat on the italic lc \"x\", and \"y\" -- they are the greenest and most unruly of the forms I posted so far, as they are only a first draft. I do want them to be distinctive and playful, but these currently look like they might throw a disk at any time. (Watch me get sued for negligence by my own font....) <br> <br>The lc \"z\", however, looks pretty good to my eye, except for some obvious need for careful kerning and hinting. The swash tail was a deliberate design decision. What specifically would you suggest for these characters (x, y, z)? They're only a couple of days old, so I know that my eyes are still not seeing them completely objectively...  <br> <br>The forms for the \"0\" (zero) were also a deliberate stylistic decision, as I have always liked the \"sideways stress\" forms. They serve not only to distinguish the \"0\" (zero) from the uc \"O\", but also to provide visual distinction from the \"6\" and \"9\" figures. I'm sure I'll adapt the form somewhat for the italics, but don't expect a narrower uc \"O\", at least not in this font. <br> <br>I'm still working on the italic ligatures, as I naturally want to finalize the component characters first. <br> <br>===== <br> <br>Thanks for the comments, all! I hope I'll hear more. I'll post again as the fonts develop. <br> <br>David </p>"
    html_clean: "<p> Joe: <br> <br>To be completely honest, I've hate a sort of love-hate relationship with the shapes of these characters as well (lc \"f\", \"j\", \"t\", \"y\" and, to a lesser extent, the tail of the lc \"a\"), and for the very reason you mentioned. My opinion pendulum swings back and forth from \"novel, quirky and interesting\" to \"odd, unfamiliar shape that seems wrong\" and back again. <br> <br>I decided to take the risk of showing them as is, trusting that unfamiliar might just be unfamiliar and not necessarily bad. I'm actually surprised that you're the FIRST person to mention it on the forum -- I really thought more would have before now. (One of my friends offline mentioned it as well, with the same reservation against passing final judgement until I got more of a body of feedback.) <br> <br>I tried a few alternate forms, such as a \"buttonhook\" curve (which ended up being used instead as the lc \"f\" and \"j\" and the smooth-curved \"t\" in Tinhorn, showing elsewhere on the Serif Forum). I also tried forms based more closely on Clarendon and Jenson, but neither of these seemed quite right for this font either. The final curve shape could be described as roughly similar to Clarendon's ball-terminal lc \"j\" with the ball knocked off, or a bent-and-thickened Jenson lc \"j\" (at least, as revived in the Centaur &amp; Hightower forms). <br> <br>So, now that it has been mentioned, does anyone else have an opinion on these forms? Are they \"novel, quirky and interesting\" or \"odd, unfamiliar shapes that seem wrong\"? Or something else? <br> <br>===== <br> <br>Sbo: <br> <br>Of course, the only glyphs that I have completed for the italic set are the dark black ones on the Architrave Italic display. The greyed glyphs are merely sloped romans, and will be replaced as the italic characters are completed. The italics are being designed generally narrower than the romans, sloped to an average of 12 degrees right of vertical, and as cursive in stroke form as is feasible.  <br> <br>Regarding the lc \"g\", do you think that only the italic form should lose the \"ponytail\" ear, or are you suggesting losing it in the roman and sans forms also? I considered both a horizontal ear and also an abbreviated curve ear for the italic \"g\", but I kind of like the distinctiveness of the exaggerated ear form as designed. <br> <br>As for the italic lc \"g\"'s tail, I modeled it after many versions of the triangular-shaped loop of the Jenson italic form (compare Centaur Italic [Arrighi], Bembo Italic [also based on Arrighi], Hightower Italic, and Adobe Jenson Italic, among others). Architrave is a rather heavy typeface in weight, and I know that it does tend to clog in greyscale JPEG images onscreen. It doesn't seem to have that problem when printed or in vector-based applications. Getting the font's hinting done may help solve the problem. Still, I'll look at ways to air out the loop. Some time in the future, I'm sure I'll get around to doing a lighter weight for book and long text applications. <br> <br>I have to agree with you somewhat on the italic lc \"x\", and \"y\" -- they are the greenest and most unruly of the forms I posted so far, as they are only a first draft. I do want them to be distinctive and playful, but these currently look like they might throw a disk at any time. (Watch me get sued for negligence by my own font....) <br> <br>The lc \"z\", however, looks pretty good to my eye, except for some obvious need for careful kerning and hinting. The swash tail was a deliberate design decision. What specifically would you suggest for these characters (x, y, z)? They're only a couple of days old, so I know that my eyes are still not seeing them completely objectively...  <br> <br>The forms for the \"0\" (zero) were also a deliberate stylistic decision, as I have always liked the \"sideways stress\" forms. They serve not only to distinguish the \"0\" (zero) from the uc \"O\", but also to provide visual distinction from the \"6\" and \"9\" figures. I'm sure I'll adapt the form somewhat for the italics, but don't expect a narrower uc \"O\", at least not in this font. <br> <br>I'm still working on the italic ligatures, as I naturally want to finalize the component characters first. <br> <br>===== <br> <br>Thanks for the comments, all! I hope I'll hear more. I'll post again as the fonts develop. <br> <br>David </p>"
