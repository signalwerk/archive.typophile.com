    html: <p> Thanks for the compliments and encouragement, Hrant. <br> <br>I've always liked the numeral "0" in Stempel Garamond, and I'm amazed that more fonts don't take advantage of that model. It's a great way to distinguish the numeral at a glance from uc "O" or lc "o". <br> <br>And I agree, the design is close to where it should be. I was hesitant to add the bar serifs on uc "E" and "F", but in the end, I thought they helped solve the kerning problem more than they detracted from the design. <br> <br>Any other thoughts? <br> <br>David Thometz </p>
