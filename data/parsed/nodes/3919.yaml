    html: <p> Regarding Architrave Italic <br> <br>Nice work.. I think the lc 'g' should get rid of the chinese-looking pony-tail. You should perhaps also open up the lower loop in 'g', it need to be stretched in its height. Lowercase 'x,y,z' need some serious work. They all have weak endings (tails) and look like skecthes. Also.. I dont like the '0' (zero). I don't think it's needed to differentiate more it from the uc 'O'. <br> <br>Characters that I really like are;(lowercase) b,h,k,v,w.....and a few of your ligatures. <br> <br>Good luck! <br> <br>Sbo </p>
