    html: "<p> Ricardo: Thank you for your encouragement and comments. <br> <br>Regarding the lc \"b\" and \"q\", are you referring to the serifs themselves, or the spurs? The serifs were taken from the Clarendon model, and the spurs were elements I liked and exaggerated from the Jenson model. <br> <br>As for the mismatched terminals on the uc \"C\" and lc \"c\", that was a personal preference call.  In the lc \"c\", the obliquely-positioned terminal serif seemed to work, to my eye, something like the Clarendon upright serif in the uc \"C\" and the ball terminal of the lc \"c\". I also didn't want the font to look TOO uniform, so I incorporated little quirks wherever I thought it would work without upsetting the entire font. (Other examples of this include the spur on the lc \"e\" [also borrowed from Jenson, without the slope], the unorthodox lc \"x\" and the foot serifs on the uc \"V\" and \"W\", as well as much of the numeral sets.) <br> <br>I'd be very interested to hear more thoughts on this as well. Do the quirks work together, or have I disrupted the balance of the font? <br> <br>Thanks very much for the input. <br> <br>David </p>"
    html_clean: "<p> Ricardo: Thank you for your encouragement and comments. <br> <br>Regarding the lc \"b\" and \"q\", are you referring to the serifs themselves, or the spurs? The serifs were taken from the Clarendon model, and the spurs were elements I liked and exaggerated from the Jenson model. <br> <br>As for the mismatched terminals on the uc \"C\" and lc \"c\", that was a personal preference call.  In the lc \"c\", the obliquely-positioned terminal serif seemed to work, to my eye, something like the Clarendon upright serif in the uc \"C\" and the ball terminal of the lc \"c\". I also didn't want the font to look TOO uniform, so I incorporated little quirks wherever I thought it would work without upsetting the entire font. (Other examples of this include the spur on the lc \"e\" [also borrowed from Jenson, without the slope], the unorthodox lc \"x\" and the foot serifs on the uc \"V\" and \"W\", as well as much of the numeral sets.) <br> <br>I'd be very interested to hear more thoughts on this as well. Do the quirks work together, or have I disrupted the balance of the font? <br> <br>Thanks very much for the input. <br> <br>David </p>"
