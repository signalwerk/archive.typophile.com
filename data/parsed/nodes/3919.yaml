    html: "<p> Regarding 'g': It should not lose the ear completely. It only need to be modified. I am suggesting it for the Roman and Sans form also. Try shorten it down, losing about half the ear.And adjust. <br> <br>The 'l' looks pretty, but is heavy on its tail.  <br> <br>About '0': It may be a stylistic decision, but its not working for me, and looks as if something wrong happend in fontographer.  <br> <br>I would like to see the text set tiny. And perhaps a light version, which would be more userfriendly.. <br> <br>UHm.... Consider to be more generous with the uppercase 'R' when it comes to its tail. Perhaps it should go under the baseline, and get more of a curve.  <br> <br>Just some thoughts... <br> <br>Good luck! <br> <br>Sbo </p>"
