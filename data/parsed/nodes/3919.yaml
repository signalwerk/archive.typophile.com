    html: "<p> David, this is cool. <br> <br>Even though the result could be called playful, to me you're trying something very difficult (trying to put just the right amount of irregularity), and I think you're succeeding! <br> <br>It's both new and old, and I think you've drawn just the right amount of inspiration from your sources (not too much). The serifs on the diagonals are brilliant, and your numeral zero is a superb idea (since numerals have horizontal stress anyway, right?). <br> <br>Keep it up - but one word of warning (which you probably already know, though): this design, know when to cut it off; don't spend too much time refining - it's not the point, I don't think. <br> <br>Best Wishes, <br>hhp </p>"
