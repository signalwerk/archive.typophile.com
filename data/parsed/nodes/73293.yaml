    html: "<p>The little black dress analogy is about a black cocktail dress which can be worn anytime and is easy to accessorize. Anytime means cocktail parties. When I've heard it referenced in chick flicks and makeover shows it always about evening wear. The LBD makes you look good but doesn't need to be robust. The little black dress isn't daring or creative, it's a safe fallback. The typographic equivalent of the ritzy cocktail party? I guess: somewhat highbrow design. Times New Roman is out because it's now considered lowbrow. Helvetica, maybe but doesn't pair well with other sans like Franklin. Maybe Futura. It's versatile and looks classy. There's no other font more LB than Futura. Case closed.</p>"
