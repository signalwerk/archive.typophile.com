    html: |-
      <p>The thing about a "little black dress" is that (a woman) can wear it <em>anywhere</em>.</p>
      <p>Today, there are pretty well two typefaces that belong in that category.</p>
      <p>Times Roman.<br>
      Helvetica.</p>
      <p>But the sense I get of the mood of this forum is that most of the people here are down on the use of overused faces. Even good ones. (After all, Papyrus isn't Comic Sans.)</p>
      <p>Even though its subtle flaring is unsuited to even medium-resolution digital use, one might add Optima to the list.</p>
