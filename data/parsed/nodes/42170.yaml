    <p>Is there a certain formula for greating a grid?<br>
    my page size is 8x10.5 with 9 collumns/12 rows with a gutter<br>
    of 0.0625 vertically and horizontally. I would like to change<br>
    my gutter to 0.1667 in having the text justified with last line aligned left.<br>
    It sounds like a mouthfull I know. attached is a screenshot to illustrate my<br>
    thoughts.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/grid_5899.jpg"></div><p></p>
