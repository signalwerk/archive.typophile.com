    html: |-
      <p>I would argue that you need to do whatever makes reading the text easier for the reader(s)... Also, you are making two changes at the same time: going from ragged right to justified <em>and</em> increasing the width of the gutter...</p>
      <p>With justified text there is the risk of having rivers of white space (due to unequal wordspaces), but it will give you less lines of text overall.</p>
