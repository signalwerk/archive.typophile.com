    html: |-
      <p><a href="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html#4" title="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html#4">http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html#4</a><br>
      A feature file "rule" is a statement that specifies glyph substitution or glyph positioning. A feature block may contain glyph substitution rules [§5], glyph positioning rules [§6], or both.<br>
      A lookup is a group of rules of the same type. See §4.e.</p>
      <p>lookup titl0 {<br>
           sub @upcs by @titling ;<br>
      } titl0;</p>
      <p>lookup titl1 {<br>
          pos @quotes &lt;0 -100 0 0&gt;;<br>
      } titl1;</p>
      <p>feature titl {<br>
        script DFLT;<br>
        language dflt ;<br>
            lookup titl0;<br>
            lookup titl1;<br>
      } titl;</p>
