    <p>To preface, this is my first post to the forum and I've done a fair amount of digging on the issue, but haven't found any solution to my question. Apologies in advance if it has been answered somewhere else. And I must say, that the community here has been extremely invaluable so far!</p>
    <p>I have designed Titling Alternates (labeled <code>titling</code> in OpenType Classes) for the Uppercase (<code>upcs</code> in OpenType Classes) glyphs in my font.</p>
    <p>For this, my feature is as follows:</p>
    <p><code> feature titl { sub @upcs by @titling; } titl; </code></p>
    <p>I want to also vertically position the quotes (<code>quotes</code> in OpenType Classes) to match the height of the Titling Alternates when that feature is activated. Normally, this is done by creating duplicate glyphs and adjusting them manually, then calling to that respective OpenType Class. However, I want to avoid creating the duplicate glyphs. To do this, I've created a new feature for <code>case</code> and used something like:</p>
    <p><code>feature case { pos @quotes &lt;0 -100 0 0&gt;; } case;</code></p>
    <p>This is working great, however I want to make everything accessible through the Titling Alternates Feature and it currently isn't since the quotes are set up in the <code>case</code> feature.</p>
    <p>My immediate solution was to simply do something like this...</p>
    <p><code>feature titl {<br>
      sub @upcs by @titling;<br>
      pos @quotes &lt;0 -100 0 0&gt;;<br>
    } titl; </code></p>
    <p>...but for some reason, it's compiling a duplicate feature of <code>titl</code> in my OpenType Feature Preview. And upon exporting the font for testing, the quotes position feature isn't working.</p>
    <p>I'm a novice type designer and somewhat new to OpenType coding and syntax so I'm sure I'm doing something wrong. Any ideas on how to properly set this up so it's accessible in the Titling Alternates Feature?</p>
    <p>Thanks in advance!</p>
