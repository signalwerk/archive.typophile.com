      <p>I tried manually inserting the feature code Janek provided using RoboFont to test the idea, but it didn't seem to work as I had hoped (I'll caveat that by saying I'm probably doing something wrong).</p>
      <p>However, using FontLab 5, the feature (of combining GPOS and GSUB) works in the exported OTF as anticipated using ID CC, but the feature does not work in Illustrator CC (or CS6). The OTF is only utilizing the GSUB glyphs in AI.</p>
      <p>I understand that combining GPOS and GSUB into one feature is odd, but this is more of an experimental exercise. Right now, I'm happy with the results; however, I may just end up creating modified glyphs (repositioned), adding a class then using GSUB. This will probably produce the most predictable results among the design programs.</p>
      <p>Thank you all for the great feedback!</p>
