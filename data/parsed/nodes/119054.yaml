    html: <p>FontLab 5 uses an old version of AFDKO that only compiles kern feature GPOS. You would probably need to compile the feature code directly in the font with AFDKO, or use one of the newer font tools that use the more recent AFDKO code (DTL OTMaster, Glyphs, RoboFont). Note that I've never tried combining GSUB and GPOS lookups in a single feature using any of these tools; I do all of my OpenType Layout work in VOLT.</p>
