    html: <p>The smaller top curve of the 's' is probably the most distinctive element in that small sample. Medium weights from <a href="http://www.myfonts.com/fonts/urw/futura/t-medium/" rel="nofollow">URW++</a>, <a href="http://www.myfonts.com/fonts/ef/futura/ef-medium/" rel="nofollow">Elsner+Flake</a>, <a href="http://www.myfonts.com/fonts/neufville/futura-nd/medium/" rel="nofollow">Neufville Digital</a>, and <a href="http://www.myfonts.com/fonts/paratype/futura-futuris/pt-futura-futuris-medium/" rel="nofollow">ParaType</a> all look pretty close. Adobe and Linotype's medium weights have similar shapes but are a bit lighter.</p>
