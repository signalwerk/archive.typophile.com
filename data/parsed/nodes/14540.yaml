      <p>From my experience, woodtype is spaced much more poorly ‘out of the box’ than metal — so there are plenty of opportunities to play with reglets and tweak the little things. If that’s what you’re into.</p>
      <p>If you’re going the metal type route, try to leaf through a copy of Geoffrey Dowding’s <em>Finer Points in the Spacing and Arrangement of Type</em>. If the instructor is more of a fine arts bent, I’d doubt that they’ll delve too deeply into that realm of spacing.</p>
      <p>If they don’t supply paper, make sure you get something decent to print on. I’ve had good luck in the past with Mohawk, Neenah, Cougar, and French. Past that, there’s always the pricier fine art papers (Arches, BFK, Stonehenge, etc.).</p>
      <p>And as Chris says, be sure you’re not packed too tight (esp. if you’re using cover weight stock).</p>
      <p>And, of course, have a ball.</p>
