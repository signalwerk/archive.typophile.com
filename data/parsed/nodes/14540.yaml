      <p>So, I’ve been to 2 classes, and will be doing my first solo composition lockup tonight (I think). I got to set and print a line of metal type in the first class, which was slipped into a pre-fab lockup and printed. I really enjoyed it. I had no idea how…disorienting?…it would feel. I think of type as this flexible mesh, a fabric that can be stretched and pulled on the computer (no, I don’t scale my type). The solid, immutable nature of the metal type (especially if you only have one size) is so foreign to me, but also kind of…reassuring? Knowing that x word in x font will be x picas wide and that’s what you have to work with is simultaneously annoying and really nice. It creates solid design posts around which you need to slalom; it limits the variables. The downside is the kerning. I’m not sure how much (if any) adjustment I’m permitted to make (to letters like ‘T’, for example) to the University’s type.</p>
      <p>The teacher doesn’t push typography on us, but is very open to my attention to it and has kind of tagged me as the ‘expert’ for letter spacing. I’m still trying to figure out where the character palette is to adjust the kerning on the Vandercook.  ;)</p>
      <p>Anyway, I’m bringing my camera in and hopefully I can post some photos from the UArts shop. I don’t have enough experience to say whether it’s a good or an OK shop, but it’s got a nice selection of faces (metal and wood) and seems well-organized.</p>
      <p>Again, thanks for the tips. Hopefully, I’ll be able to post my composition for critique in the next week or two.</p>
