    <p>I’ve just signed up for a class on <a href="wiki/letterpress" class="wiki">letterpress</a> printing, using a Vandercook press (not sure if it’s a Universal or an SP, etc.). It’s taught by a more fine-arts oriented instructor, so I get the feeling there will be more loose exploration and technical craft and less  typographic stricture. So, I was wondering if anyone has any recommendations for a first-timer on a letterpress: what to try, what do you enjoy most about using it, how do you design for the letterpress, your experiences, anything. I’m hoping to really dig in and get my hands dirty (in the figurative and literal senses) when the time comes.</p>
    <p>Thanks!</p>
