      <p>“<em>Curious to know what you begin to experience or comprehend as you physically move type and your re-orientation to letters which are upside down &amp; backwards.</em>”</p>
      <p>Every so often, my brain wigs out and I have to shake my head, but it’s not as hard as I thought. Punctuation seems to be my weakness. I’m learning the value of a clean type surface. So much easier to read shiny type on a dark background than cruddy type.</p>
      <p>It’s interesting that older metal type is set, in a way, in reverse from its typical output (light on dark vs. dark on light).</p>
