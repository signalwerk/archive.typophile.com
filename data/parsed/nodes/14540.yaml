      <p>The Vandercook is a very friendly creature.  Very “hand operated” except for ink spread and washup.</p>
      <p>Just enjoy it Chris.  Don’t get the packing too tight or your crush your type.  You only need a kiss impression. Make sure the packing has been changed to get even impression.  We used to do kerning with a bandsaw on big type but there was plenty of it in those days. Don’t forget to lock up your form and DON’T PUT YOUR FEET UP ON THE FURNITURE :-)</p>
      <p>Oh, and don’t wear a tie :-) it can get caught in the rollers. ChrisL</p>
    html_clean: |-
