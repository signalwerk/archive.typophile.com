    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12038" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Terminology</a>&nbsp;: Oblique or Sloped&nbsp;Roman</strong></p>
    <p>Oblique or Sloped Roman letterforms are sometimes incorrectly called <a href="/node/12463" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">italic</a>. Like italics, obliques are used to offset, or give emphasis to, certain parts of a text otherwise set in upright <a href="/node/14507" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">roman</a> type. </p>
    <p>Oblique styles may also be called slanted roman since they are the same letterforms found in the roman face but have been slanted. In some instances they are mechanically slanted (where a slant is created by the font software) or hand-drawn slanted by the&nbsp;designer.</p>
    <p><a href="/node/12463" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Italic</a> letterforms (sometimes called “true italics” to further distinguish from obliques) have been drawn so that they are more formally differentiated from upright roman letters.<br>
    Adrian Frutiger’s <a href="/node/13517" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Frutiger</a> uses obliques in lieu of Italics. But Frutiger Next (from <a href="/node/13697" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Linotype</a>) has italics, for&nbsp;example.</p>
    <p>There are various schools of thought about whether obliques or italics are more proper for the emphasizing of text. <a href="/node/12136" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Stanley Morison</a> was briefly in favor of sloping letters instead of true italics. The divide may have begun at that&nbsp;time.</p>
    <p>Most desktop publishing and word processing applications will slant the roman on the fly if the italic or oblique style of a given font is not available. It is considered incorrect in professional design and publishing circles to use artificial obliques in this&nbsp;way.</p>
    <p>Many <a href="/node/12132" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">sans</a> faces have accompanying obliques rather than italics. For example, <a href="/node/13516" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Univers</a>, <a href="/node/13514" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Helvetica</a>, <a href="/node/12494" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Futura</a> and <a href="/node/12657" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Gotham</a>. Some modern sans faces are being designed with custom drawn italics, such as Nexus Sans, Trebuchet <span class="caps">MS</span>, Myriad,&nbsp;etc.</p>
    <p>For more about the visual characteristics of italics, see the wiki entry for <a href="/node/12463" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Italic</a>.</p>
    <p><strong>Additional Articles:</strong><br><a href="/node/14321" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Obliques How-To</a><br><a href="http://www.marksimonson.com/article/128/fake-vs-true-italics">Fake vs. True&nbsp;Italics</a></p>
