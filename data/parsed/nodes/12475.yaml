    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a> : Oblique or Sloped Roman</strong></p>
    <p>Oblique or Sloped Roman letterforms are sometimes incorrectly called <a href="/wiki/Italic" class="freelinking" rel="nofollow">italic</a>. Like italics, obliques are used to offset, or give emphasis to, certain parts of a text otherwise set in upright <a href="/wiki/Roman" class="freelinking" rel="nofollow">roman</a> type. </p>
    <p>Oblique styles may also be called slanted roman since they are the same letterforms found in the roman face but have been slanted. In some instances they are mechanically slanted (where a slant is created by the font software) or hand-drawn slanted by the designer.</p>
    <p><a href="/wiki/Italic" class="freelinking" rel="nofollow">Italic</a> letterforms (sometimes called "true italics" to further distinguish from obliques) have been drawn so that they are more formally differentiated from upright roman letters.<br>
    Adrian Frutiger’s <a href="/wiki/Frutiger" class="freelinking" rel="nofollow">Frutiger</a> uses obliques in lieu of Italics. But Frutiger Next (from <a href="/wiki/Linotype" class="freelinking" rel="nofollow">Linotype</a>) has italics, for example.</p>
    <p>There are various schools of thought about whether obliques or italics are more proper for the emphasizing of text. <a href="/wiki/Stanley%20Morison" class="freelinking" rel="nofollow">Stanley Morison</a> was briefly in favor of sloping letters instead of true italics. The divide may have begun at that time.</p>
    <p>Most desktop publishing and word processing applications will slant the roman on the fly if the italic or oblique style of a given font is not available. It is considered incorrect in professional design and publishing circles to use artificial obliques in this way.</p>
    <p>Many <a href="/wiki/Sans%20Serif" class="freelinking" rel="nofollow">sans</a> faces have accompanying obliques rather than italics. For example, <a href="/wiki/Univers" class="freelinking" rel="nofollow">Univers</a>, <a href="/wiki/Helvetica" class="freelinking" rel="nofollow">Helvetica</a>, <a href="/wiki/Futura" class="freelinking" rel="nofollow">Futura</a> and <a href="/wiki/Gotham" class="freelinking" rel="nofollow">Gotham</a>. Some modern sans faces are being designed with custom drawn italics, such as Nexus Sans, Trebuchet MS, Myriad, etc.</p>
    <p>For more about the visual characteristics of italics, see the wiki entry for <a href="/wiki/italic" class="freelinking" rel="nofollow">italic</a>.</p>
    <p><strong>Additional Articles:</strong><br>
    <a href="/wiki/Obliques%20How-To" class="freelinking" rel="nofollow">Obliques How-To</a><br>
    <a href="http://www.marksimonson.com/article/128/fake-vs-true-italics" rel="nofollow">Fake vs. True Italics</a></p>
