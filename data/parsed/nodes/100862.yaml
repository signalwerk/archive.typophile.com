    <p></p><div class="imageWrap"><img src="http://typophile.com/files/fontspro2_4340.jpg"></div><p></p>
    <p>Read The Fonts.com Blog: <a href="http://bit.ly/13KE7DT" title="http://bit.ly/13KE7DT">http://bit.ly/13KE7DT</a><br>
    Subscribe Here: <a href="http://www.fonts.com/web-fonts" title="http://www.fonts.com/web-fonts">http://www.fonts.com/web-fonts</a><br>
    View a Typecast Demo: <a href="http://vimeo.com/43763778" title="http://vimeo.com/43763778">http://vimeo.com/43763778</a> </p>
    <p><a class="freelinking external" href="http://www.fonts.com " rel="nofollow">Fonts.com</a> has redefined its Professional Fonts.com Web Fonts plans to make them more affordable, while adding a free <a class="freelinking external" href="http://typecast.com/ " rel="nofollow">Typecast</a> subscription (worth $29 per month). The new professional plans start at just $40 per month and include 1 million page views per month, but additional page-view packages are available, as needed. </p>
    <p>Like before, professional plans also include the self-hosting option and desktop fonts for creating website mockups. Current Web Font Professional plan subscribers, as well as 1 million, 1.5 million or 2 million page view Web Font Standard plan subscribers will be upgraded automatically to make life easy.</p>
    <p>Typecast is a powerful, browser-based design app that takes the pain out of designing with Web fonts. It lets designers, pair and compare Web fonts in the browser on full-length text without having to create screenshots, assemble comps or hand-code CSS. </p>
    <p>Sliders, drop menus and simple inputs make it easy to set text in precise detail, and because you’re designing in the browser, you’re able see changes in real time and make better, faster decisions about quality, style and rendering. </p>
    <p>As you design, standards-compliant HTML and CSS is produced behind the scenes, allowing for the quick sharing of Web-ready designs with developer colleagues, which leads to more accurate prototypes. </p>
    <p>Best of all, Fonts.com and Typecast work great together. All of Fonts.com’s 20,000 plus Web fonts are available in Typecast. All Fonts.com accounts are linked to Typecast, so getting the Web fonts used in your Typecast design onto your website is simple. When it’s time to export your designs and start prototyping, Typecast will determine which fonts to serve up and provide an embed code that includes them. Going forward, you can continue to use Typecast to manage the font selections in your Fonts.com Web Fonts projects. </p>
    <p>Fonts.com aims to reshape typography on the Web, and believes this combination will help Web designers make sound typographic decisions and refinements with their favorite typefaces.</p>
