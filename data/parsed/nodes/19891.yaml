    html: |-
      <p>I originated this post following a very nice email exchange with Stefan Hattenbach during which I realized I had no idea he had designed some beautiful fonts. I guess my motivation was for my own information - to know who among the people who frequent this site are actually type designers and what they've done. I'm a graphic designer and do buy fonts for jobs and would like to patronize Typophiles when appropriate. This is a 'community' after all, and reading another thread (<a href="http://typophile.com/node/19846" title="http://typophile.com/node/19846">http://typophile.com/node/19846</a>) in which Rory expresses frustration trying to communicate with foundries it occurred to me he might find a more supportive group here - and perhaps end up buying a font. </p>
      <p>It also gives some perspective on their contributions to the threads. I think the wiki when complete might stimulate some sales - at least from me.</p>
      <p>But that said, I don't think the criteria need to be too rigid. Let's hope nobody dies any time soon...</p>
