    html: |-
      <p>Looking for somewhat similar styles, I saw <a href="http://new.myfonts.com/fonts/canadatype/sincerely/">Sincerely</a>, based on an old script by Karlgeorg Hoefer called "Elegance" that shows up in the Solotype Catalog (p. 96). The weight is too light, but added stroke would produce something with a feel like the handwritten lettering on the album, in my opinion.</p>
      <p>- Mike Yanega</p>
