    <p>This flier has been making the round of the interwebz. At first I was sure it was a prop of some kind; somehow it looks so modern to my eyes. </p>
    <p>But no, there it is, in the <a class="freelinking external" href="http://digital.archives.alabama.gov/cdm4/item_viewer.php?CISOROOT=/voices&amp;CISOPTR=2020&amp;CISOBOX=1&amp;REC=6" rel="nofollow">Alabama online state archives</a>.</p>
    <p>I'm curious about two things: what's the soft serif used for "Paid organizers..."? Not the Cooper, the lighter text face.</p>
    <p>And why does it look so computery? (If the answer is that I spend too much time looking at a screen and I've simply lost my mind, that's fair.)</p>
    <p>I insert page 2 simply for historical completeness. <strong>It is not an endorsement of the messages contained in any sense.</strong></p>
