      <p>Well, I don't believe in heroes. But Willberg does has authority, or more authority than many do. He has—for example—more authority than I do. He has written books that have been published, and have gone through peer review. This means that his opinions are not voices from the wilderness, but are statements that others are willing to go behind. I agree with them.</p>
      <p>But I do not call these fonts by this name because Willberg did. I call them that because I find the term appropriate. That Willberg might have viewed them similarly is just cream on top of this. But even if Willberg hadn't thought this, I would still find these font distasteful.</p>
      <p>There are plenty of fonts with political messages. There are typefaces that are definitely Royal, and that I associate with Monarchy as a form of government (Romain du Roi, but also the Petrine Cyrillic reforms, and any typeface ever used by an Imprimerie Royal, a Reichsdruckerei, or Her Majesty's Stationery Office.</p>
      <p>As for imperialistic fonts… well, Trajan! I've seen Soviet memorials with very Roman-like capitals. It fits perfectly, I think.</p>
      <p>&gt;<em>You say, you see font (font or fonts?) as a kind of political message. This is your point of view.</em></p>
      <p>That's right, it is my point of view. When I write, I gladly speak my own point of view. It is a free country (and a free Internet) after all. And I think that the "Schaftstiefelgrotesks" are fascist. I don't believe in banning them (I don't believe in banning any speech). But I think that their use today—outside of certain historical applications—is just distasteful.</p>
      <p>As for horror movies where the bad guys are zombie Nazi solidiers… but all means! I think that the Schaftstiefelgrotesks &amp; Co. are great in this sort of thing. Also for museum pieces about the 1930s. But probably not for much else…</p>
