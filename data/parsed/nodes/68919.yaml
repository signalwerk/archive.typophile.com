      <p>Black and white are fine for type, but thinking in black and white, in polar opposites only is simplistic thinking that is extremely dangerous. </p>
      <p>There is much to study and admire in Prussian history. For example, Bismark started the welfare state, or "government safety net," which we only completed--imperfectly--a few weeks ago in the US. Here Prussia was ahead of us in America by over a century, if you ask me. </p>
      <p>However, Prussian militarism and the German nationalism of the 19th century is part of the ancestry of Nazism, and it is important in my opinion to recognize that, and to critically assess it, and condemn the bad aspects of it. It is only one of many conflicting strands in German history, many very admirable. But illustration of the strength of militarism in Germany is that Einstein was so revolted by it that he renounced his German citizenship--before WWI--and took Swiss citizenship. And by the way, the Swiss have never been imperialists to my knowledge, so not every country had an imperialist phase. In any case "everybody does it" is no excuse for wrong actions.  </p>
      <p>The question of honoring soldiers who fought bravely in a bad cause has come up again this month in the state where I live, in Virginia, where the Governor declared as <a class="freelinking external link-external" href="http://www.washingtonpost.com/wp-dyn/content/article/2010/04/06/AR2010040604416.html" rel="nofollow">Confederate History Month</a>. Gov. McDonnell left out any mention of slavery. Further, he at first said that slavery wasn't that important, and that honoring the fight of Confederates for "freedom" was the main thing. He was forced to back down and apologize by huge numbers of people who expressed outrage against this. </p>
      <p>I have no problem with Southerners in the US honoring their ancestors who fought with great bravery for the Confederacy. But I do have a big problem with saying their fight was in a good cause.  </p>
      <p>Personally I find Gov. McDonnell's actions and words disgusting and inexcusable. I would feel the same way about any history of the US that left out its monstrous injustice to the American Indians. </p>
      <p>So I have no problem with your admiring much in Prussian history. But I do have a big problem with *uncritical* admiration, because it means admiring what is bad, sometimes even evil in the past of one's nation or group. And uncritical all-or-nothing defense allows those evils to be revived and perpetuated in the name of patriotism. </p>
      <p>To me self-criticism of one's nation is a profound ethical obligation.</p>
