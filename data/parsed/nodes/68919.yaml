      <p>Arno, you are using "equal" as an equivalent to the German "egal" and it's not. Your sentence doesn't work in English, though I get what you mean because of my alas poor German. </p>
      <p>I didn't say that Tannenberg is an inherently evil typeface, and I don't believe it is. I said that the style is, like it or not, associated with militarism and Nazism. Lots of other people corroborate this fact, as others have mentioned and quoted above. </p>
      <p>Tannenberg is a deliberately aggressive style, with its heaviness and sharp angularity. Can you use it successfully in another context, without the baggage of history? I don't know--and I don't know why anyone would bother to try when you have tens of thousands of other choices, including many beautiful black letter styles.</p>
