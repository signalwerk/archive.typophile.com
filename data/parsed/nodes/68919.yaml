      <p>@ Florian</p>
      <p>"Schaftstiefel Grotesk" is a political statement. Which was used first from the mostly socialdemocratic or socialistic workers in the printer's industry in Germany. I do not have a problem with these guys, it was their opinion and that's all. </p>
      <p>But we as typographic pros should not give a political statement about a font. Call it a good one or a bad one, a beauty or ugly. But you would not call a font a democratic one or a socialist one, do you? It says nothing about a font, but more about the political thinking of the speaker. And this does not belong to a statement of a font (from pro side). Otherwise we should include an option to check all fonts in general if it is political correct or not.</p>
      <p>That's what I think.<br>
      Please take it as a constructive suggestion to your excellent work, Florian.</p>
