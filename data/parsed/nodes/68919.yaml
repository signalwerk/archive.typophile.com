      <p><cite>Call it a good one or a bad one, a beauty or ugly. But you would not call a font a democratic one or a socialist one, do you?</cite></p>
      <p>And that is not only true for fonts. Thinking, that everything, which a slaughterman of humans makes, is bad, is a limited world view. With regard to aesthetics or functionality even the person behind a piece of art or any invention, is totally unimportant! Just read the prologue of Oscar Wilde’s <em>Dorian Gray</em>. If George Bush, Dick Cheney, Donald Rumsfeld or Sarah Palin had written good poems, I would not less appreciate their poems than the good poems of authors that are not criminal, fascistic or simple-minded. Yes, even a simple minded person can create a great piece of art. It may be, that it was not intended, but that is unimportant. It is not important, what the author wants to say, but it is important, what the piece of art is saying. Things work or they don’t work or they are half-baked. They are ugly or beautiful or boring. That’s all.</p>
      <p>Nevertheless a font like Tannenberg can be the best choice for the poster of such a splatter film. It is not good for the rehabilitation of that typeface, because it forces prejudices again, but you cannot expect not to use that typeface in such a context only, because you want to see that typeface unshackled from the prejudices.</p>
      <p><em>Ein [sic!], zwei, die</em> is even wrong German orthography.</p>
