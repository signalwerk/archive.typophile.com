      <p>Being able to find good, reliable sources in print is an excellent thing. It helps one form better judgement. When one is defining one's own beliefs and practices, it is helpful to see who had held similar standpoints before, and why. Sources are strengthened by the other things that they did, wrote, and made in their careers, in parallel to this. So, quoting Willberg alone is not necessarily enough. But, I consider Willberg's writings to be an excellent source for many matters of book design and German-language typesetting. I regularly consult Willberg's texts on a number of matters. But I also consult a number of other texts by other authors, and I consult with living, breathing designers, too (although admittedly, some of these designers are Willberg students…)</p>
      <p>That aside, I would call these nasty designs <em>Schaftstiefel Grotesks</em>, whether Willberg did or not, because I think that this term puts their design in a helpful political context (to assume that design is not political seems quite a silly notion to me… design is political, history is even more political, and interpretations of history are even more political than that). But having Willberg in my corner on this is just a bonus.</p>
