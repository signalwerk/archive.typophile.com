      <p>Just checking on Tannenberg. According to the <a class="freelinking external" href="http://en.wikipedia.org/wiki/Battle_of_Tannenberg_%281914%29" rel="nofollow">Wikipedia article</a>: </p>
      <p>"Although the battle took place near Allenstein, Ludendorff's aide Max Hoffmann suggested to name it after Tannenberg  in an attempt to erase the defeat in the medieval Battle of Grunwald (Tannenberg) of 1410 in which the Teutonic forces were defeated by the Poles and Lithuanians.[2][3]  As pointed out by Christopher Clark, the actual Tannenberg is some thirty kilometres to the west, and there was no intrinsic reason - other than the historical battle and its emotive resonance in the narrative of German Nationalism - to name for it the 1914 battle." </p>
      <p>This information confirms that Jan is quite correct that the name "Tannenberg" is a "strong reference to German nationalism"—and a militaristic nationalism at that. </p>
      <p><a class="freelinking external" href="http://www.globalsecurity.org/military/world/europe/de-kaiserliche-militarism.htm" rel="nofollow">This article</a> explains the connection of the 1410 Battle of Tannenberg (Grunwald) to Prussian "chauvinistic militarism." </p>
      <p>Georg, I keep getting the impression that the Prussian chauvinist militarism of the past is something you really admire.</p>
