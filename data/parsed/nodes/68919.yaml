      <p>&gt;<em>If there’s one thing the Nazis were good at it’s branding and propaganda. The bizarre and fascinating imagery they left behind has served as the perfect cliché for “the bad guys” ever since (as William proved). And yes, Tannenberg surely is part of that. It was named after the battle of Tannenberg, a strong reference to nationalism. It reminds me a lot of the germanic runes the Nazis liked so much (SS-logo), more than the New Typography of the 20s that’s being mentioned as an influence (Grotesk/monoline). I think it perfectly fitted the Nazi’s idea of what they considered modern. There’s no way of seeing Tannenberg out of context.</em></p>
      <p>Once again, Jan has hit the nail on the head for me. He has summed up the point better than I can, and with far fewer words. This is a good summary of how I view the Tannenberg typeface. I don't think that I have anything further that I can add to this conversation.</p>
