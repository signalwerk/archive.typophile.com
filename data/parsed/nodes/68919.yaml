      <dl>
      <dt>For what it's worth, here's Judith Schalansky's take:</dt>
      <dd><em>An abudance of new Blackletter types were created around 1900 with the intention of adapting the historic forms to the new era and its new demands. Some of the most beautiful Blackletter types appeared, incorporating artistic trends of the first half of the twentieth century. [...] Here we also find some of the doubtful, so-called ›Jackboot Grotesques,‹ such as Tannenberg. These simple Gothics, like many contemporaneous faces, reflect the affinities among abstraction, avant-garde, and totalitarianism.</em></dd>
      </dl>
      <p>There you have it. Her use of scare quotes is justified by the academic context.</p>
      <p>Among the samples of "Modern" Blackletter that Schalansky has compiled, I do note a similarity in the one design of Erich Meyer already noted, with other equally geometric faces appearing in the early 1930s by Robert Golpon, Max Bittrof and others.</p>
      <p>I see no problem in holding up some of these as great designs.</p>
      <p>The type on the film poster is graceless.</p>
