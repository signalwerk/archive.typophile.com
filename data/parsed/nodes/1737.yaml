  html: <p>Ok, pretty new to this but anyways... <br>I have downloaded the .txt kerning pairs document here at typofile long time ago, usefull info. I see in Fontlab - Kerning Assistance - that one is able to open Kerning Assistance files and .txt files as well. How do I do this? And can I use the kerning pairs.txt?</p>
