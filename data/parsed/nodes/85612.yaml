  html: |-
    <p>Hi,<br>
    I'm working on an artist monograph, and I'm looking for a classic, elegant &amp; geometric typeface such as Bodoni. Can be a bit more avantgarde.<br>
    I'd use Bodoni but somehow I feel it's been used and abused, so I'd be grateful for any suggestions of fonts that would create the same effect, but are bit "fresher" for the eye.</p>
    <p>thanks,</p>
    <p>.a</p>
