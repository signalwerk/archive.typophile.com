  html: <p>Hi all. <br> <br>This is last friday's effort from my Friday Fonts campaign. I'm continuing to work on my <br>grotesque, but needed a break. <br> <br>It's based on a photo I took of an antique child's toy. The original was woodburned so I  <br>tried to keep some of that appeal. Hopefully it still has some appeal. When I eventually  <br>revamp my website, I was thinking of maybe offering it as a free font. Or should I try  <br>to sell it? <br> <br>Thanks for your thoughts, <br>Randy <br><img src="http://www.typophile.com/forums/messages/29/10941.gif" alt="AT Tenement"></p>
