      <p>There are very few handwriting fonts with both upright and italic versions. If you need italic for emphasis, I suggest using a bolder weight instead. Here are a variety of <a href="http://fontfeed.com/archives/contemporary-handwriting-fonts/" rel="nofollow">professional handwriting fonts</a>, many of which have multiple weights.</p>
      <p>It may be too late to make a change, but I don't think Karinna is a wise choice for body text. It's far too idiosyncratic and will distract readers. If you can tell me a little more about the book, I could offer some appropriate alternatives.</p>
