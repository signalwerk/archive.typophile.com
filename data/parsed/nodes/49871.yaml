    <p>Hi everyone!</p>
    <p>I need a little help from you guys. I'm in the process laying out a book for a client, the body text of the text will be 'Korinna' <a href="http://www.myfonts.com/fonts/adobe/itc-korinna/" title="http://www.myfonts.com/fonts/adobe/itc-korinna/">http://www.myfonts.com/fonts/adobe/itc-korinna/</a>, now between all the chapters there will be excerpts from a journal/diary, and the client wants a handwriting font that's legible, now I know there are alot of handwriting fonts out there but I need something really professional and nice, and also it should have a regular font + italic.</p>
    <p>Thanx for all your help until now</p>
    <p>Sruly</p>
