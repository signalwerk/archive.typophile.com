  date_raw: 27 Oct 2005 — 11:07pm
  votes: null
  html: '<p>For those of you who think that all web sites should be hosted on the www sub-domain, but have been unceremoniously logged out of Typophile while doing so: the problem has been fixed. All you need to do is clear your cookies from typophile.com and <a href="http://www.typophile.com" title="www.typophile.com">www.typophile.com</a>. The new session cookies will be from .typophile.com which will keep you logged in on any sub-domain of Typophile. In fact, you can look at Typophile on nearly any sub-domain you can think of, switching willy-nilly from one page to another.</p>'
  html_clean: '<p>For those of you who think that all web sites should be hosted on the www sub-domain, but have been unceremoniously logged out of Typophile while doing so: the problem has been fixed. All you need to do is clear your cookies from typophile.com and <a href="http://www.typophile.com" title="www.typophile.com" class="link-lost">www.typophile.com</a>. The new session cookies will be from .typophile.com which will keep you logged in on any sub-domain of Typophile. In fact, you can look at Typophile on nearly any sub-domain you can think of, switching willy-nilly from one page to another.</p>'
