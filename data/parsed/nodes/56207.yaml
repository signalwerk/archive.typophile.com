    <p>I'm a web designer with low level PHP skills. I'm also a budding type designer. Somehow, I have to convince my boss that it is a good idea for me to learn <a href="/wiki/Python" class="freelinking">Python</a>. </p>
    <p>So my question is, aside from using the Django frameworks which I am already tentatively working with, what else could I possibly use as an argument to let me spend company time learning Python? Specifically, what can I do with it that will best build the skills needed to use Python effectively in working specifically with type, but also are productive for Python use in general?</p>
