    html: |-
      <p>There are such lists — search your harddrive for “Mapping” folders which contain files with the “.nam” extension. From within FLS, you may set your default mapping file in the preferences/options dialog “General Options / Unicode and OpenType” and choose a particular mapping file e.g. when you use functions like “Glyph / Glyph Names / Generate Unicode ...”. Indeed there were a couple of Typophile threads indirectly dealing with them, maybe you’ll find some by googling with the keywords “glyph” and “naming”.</p>
      <p>Karsten</p>
