  html: |-
    <p>There are occasions in Fontlab when two (or more?) glyph names automatically generate the same Unicode character (e.g. <em>arrowleftup</em> and <em>uni2196</em>). My question is, is there a list of the glyph names which map to a particular Unicode character and if so where? I guess this query is likely to be related to a wider topic of how best to name your glyphs which may have gone before. Ring any bells?</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/40178" class="topic-previous" title="Go to previous forum topic">‹ Uruguay &amp; Chile -&gt; Christmas postcards</a> <a href="/node/31132" class="topic-next" title="Go to next forum topic">The Best Hundred ›</a></div>
