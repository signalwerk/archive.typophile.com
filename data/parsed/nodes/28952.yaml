    html: '<p>There will most likely be several "attractive" deals on film/paper output units as more and more printers migrate to CTP (computer-to-plate) technology. As handsome as RC apper output is, it comes with a knotty problem: the chemistry used to develop and fix the paper, which need to be disposed of properly. Fixer is normally processed to extract the silver it contains, and people who do this for a living often will take it off your hands for nothing. Exhausted developer, on the other hand, is really nasty stuff and has no commercial value.</p>'
