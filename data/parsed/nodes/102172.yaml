      <blockquote><p>Extra question: you think it would help if I let clients know that these fonts cost a lot of money too. Or is this irrelevant?</p></blockquote>
      <p>That is very relevant, particularly if your design solution is not the only consideration for how they will use the typeface. In a large corporation a brand redesign incorporating a typeface could result in that typeface being used for every conceivable kind of output, including digital embedding, web fonts, broadcasting, all of which they will need to license for. If they are going to be paying for it, and considerably more than your consultation fee (possibly year on year), they will want to know that up front.</p>
