      <p>&gt; I charged her for a day worth of work.... </p>
      <p>You may have underbid, but once you give a client a price you can't increase it unless the scope of the project changes. A deal's a deal. But hey, you're still making some money and getting a portfolio piece. And maybe this can lead to other projects with her (brochures, web site, etc.)</p>
      <p>&gt; the worst part is that it will seem like I<br>
      &gt; overpriced this logo in her eyes</p>
      <p>I understand how you feel, but if you've given this logo some careful thought and feel an all-type solution is the best approach, then you need to make your presentation with confidence and explain your reasoning.</p>
      <p>And if she doesn't like your approach, go back to the drawing board and come up with something else. I've been in presentations by big design firms where the client hated the initial logo concepts; it happens sometimes. That's why it's often a good idea to present multiple concepts, or at least have a few alternatives in your briefcase that you can pull out if the client doesn't like your main idea.</p>
