      <p>&gt;  it looks so simple, they think ...<br>
      &gt; “it must have been easy for you to make that</p>
      <p>Yep. Taking complex ideas and distilling them into a simple solution can be very difficult, but clients often don't realize that. </p>
      <p>&gt; I still don't know how to calculate my working hours</p>
      <p>That's a common problem. I've been doing this for 30 years and I still miscalculate all the time. But it helps to break it down into categories. How much time will I spend talking/meeting with the client? How long doing research? Concepts? Final art? Revisions? (Or as one of my design professors once said, carefully calculate how long the job will take; then multiply by 3 ;)</p>
