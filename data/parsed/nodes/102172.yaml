      <p>&gt; you think it would help if I let clients know<br>
      &gt; that these fonts cost a lot of money too. </p>
      <p>There are two issues here. If you mean you want to impress them that you paid a lot of money out-of-pocket for those fonts, reducing your profit because your bid included any expenses, well that's up to you. </p>
      <p>But if you mean that THEY will need to purchase copies of those fonts, that's a separate issue. They won't need fonts to reproduce the logos because you'll provide finished logos in formats that don't require them to have the fonts on their computer (bitmapped, or vector art where the type has been converted to paths). So they would only need the fonts if you're recommending that they also use those same fonts when setting text (in ads, for example). In that case the cost of fonts would be highly relevant, since they'll need to purchase copies.</p>
