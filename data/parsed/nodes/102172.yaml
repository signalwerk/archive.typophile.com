    html: |-
      <blockquote><p>The logo is the sizzle – the identity is the steak.</p></blockquote>
      <p>No.</p>
      <p>Different cuts of steak have different identities, t-bone, sirloin, etc.. The 'logo' is an integral element to a particular cut of steak.  Think of the logo as the marbling of fat content, or the bone in the t-bone, etc.. The rest of the identity is defined by texture, shape, colors, etc..</p>
      <p>Paul Rand added character to IBM's branding/identity by simply adding a few horizontal lines to the existing capital letters. Think of those few horizontal lines as the marbling of fat in a sirloin steak. Those lines define IBM's identity. And how those lines are PERCEIVED is the sizzle of the steak.</p>
      <p>In Rand's words 'a logo can only be successful by association'. How that association is perceived is the sizzle. It is how YOU perceive the mark. Not the other way around. </p>
      <p>Don't sell steak, sell the sizzle.</p>
      <p>Logos in general (and the overall identities too, and to a certain extent graphic design in general) have become trite and stale just because of the failure to teach that simple principle on the college or university level! </p>
      <p>In my humble opinion of course.</p>
