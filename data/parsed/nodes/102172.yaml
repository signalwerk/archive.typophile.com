      <p>The logo is the sizzle – the identity is the steak.</p>
      <p>A logo on its own is only half a job –&nbsp;you should also demonstrate how it works in practice either with mockups or visuals.</p>
      <p>For example a clothing line will need packaging – even if it is only a bag or stationery or a mocked up embroidered logo, how and where you apply it – what colours you use it on; whether you have to develop a small-use logo with simpler more open features; how small it can go how it would work on an illuminated sign. Demonstrate that you have considered the production processes.</p>
      <p>A couple of mood or concept boards showing thought process, a couple of logo presentation boards (1 showing the logo in all its glory, 1 showing the minimum size, exclusion zones, colour and mono versions) and a couple of boards of visuals or mockups.</p>
      <p>If the logo is accepted the development for all the collateral can be used to cover your costs.</p>
      <p>Tim</p>
