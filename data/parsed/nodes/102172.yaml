    html: |-
      <p>@AnaBanana: Selling someone a minimalist typographic concept is a common challenge. Be it a wordmark, layout, website &amp;c. Primarily because it looks so simple, they think “I could have done that myself” and “it must have been easy for you to make that, so it’s not worth much.”</p>
      <p>To make the sell easier, begin by clearly articulating your understanding of their context. Goals, clients, competition &amp;c. This will create in them a sense of “this person understands me.”</p>
      <p>Then, lead them through your thought process, starting with concept sketches, various choices &amp;c. Explain why these selections didn’t make the cut.</p>
      <p>After leading them through this process, <em>then</em> show them your final concept. You will find them to be far more receptive if they know you were making informed decisions due to your understanding of their context, and that you explored alternatives which lead you to your final selection. It is this process that is of greatest value. Not the fact you appeared to have simply “chosen a font.”</p>
      <p>Through trial and error, I have found this method to be significantly more effect then simply showing them the final concept and asking them for feedback. This tends to result in the “that looks boring and simple” outcome. Back to the drawing-board. If they understand how you got there, they will see more value in your work — “Wow! I get it! This guy clearly but a lot of thought and consideration into this. I understand how he got there and how this seemingly simple design has inherent value. I feel smart.”</p>
      <p>When showing a potential client my portfolio, almost all of which is minimalist type, it can be a hard sell at times. Showing them a “boring” business card, possibly one of the strongest pieces, almost always results in “Really? You think that’s impressive?” But, if I start by showing the original which I was asked to redesign, identified its shortcomings, explored longest and shortest names, factored across multiple degrees, long and short job titles, 2-4 phone numbers, 1–3 line address and so on, resulting in an automated in use by at least 3,000 employees at any given time over the course of a over a decade without breaking, and in order for a new employee to get cards, all they need to do is go to form on their intranet, enter their data, which is then sent to the printer, produced, and shipped back to them so they have cards waiting for them on their desk first thing Monday morning, all without human hands even touching them, the response is far closer to “Holy crap that’s awesome! How can I get one of those!” Every time.</p>
      <p>I also strongly recommend against the “show them three and let them pick their favourite” meth0d. Ninety percent of the time you’ll get the “a little from each” result. Additionally, it undermines your authority. <strong>You</strong> are the expert with the ability to make informed decisions <em>by design</em> as opposed to by chance. To put the power of decision making in their hands takes this away from you and lessens their perception of your value. Upon entering into a business contract with you in which they are giving you money in exchange for knowledge, ability, and skills you possess and they do not, this should not be an issue, provided the process has been managed properly.</p>
      <p>I opt for a process based approach, allowing for revisions. It has been my experience that I seldom need more than three to arrive at a final solution—provided there is a thorough brief which the client has signed off on, clearly stating what they understand, and what they intend you to deliver.</p>
      <p>If they make a comment, suggestion, observation &amp;c which you honestly did not consider, always say “I did not think of that. Thank you for bring that to my attention. I will be mindful of that during my next round of revisions” or something to that effect. Understand that your client knows more about their context they you can. Humility goes a long way in fostering trust and respect between client and designer, which in turn results in a more efficient process. If they make a comment about something you <em>did</em> consider, but chose not pursue, explain how and why. If they insist, there’s not really a lot you can do. You put your best foot forward, empowered them to make informed decisions by explaining your work, but you can’t take away their ability to choose. Going around in circles is bad for everyone. Everyone will get tired and frustrated, the work and relationship will suffer, and you probably won’t see them again (at this point, you probably won’t want to though either. Be mindful that time = money for all parties involved.</p>
      <p>Certainly have some fall-backs in place, and when all else fails, sell them their favourite colour, get sign-off, and move on to the next job.</p>
