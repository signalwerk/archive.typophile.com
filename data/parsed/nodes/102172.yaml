    html: |-
      <p>You need to sell it to them the same way you would with any logo — by doing a nice presentation in which you explain the thought process behind the logo, why it communicates the ideas that their logo needs to communicate, and how it differentiates them from their competition. </p>
      <p>Also it might be helpful to show them mockups of how the logo could be used on their stationery, website, signage, products, etc. (these mockups don't need to be finished designs at this point, the idea is just to help them visualize how the logo would look in actual use).</p>
      <p>If presenting a type-only concept makes you nervous (and apparently it does), you may want to have some other concepts ready as alternatives. In most logo projects I've been involved with we typically presented several different concepts.</p>
