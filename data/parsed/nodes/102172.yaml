    html: <p>To my mind neither Jeep nor BMW are good examples, as I would imagine that most people (e.g., people buying the cars or consuming media in which these brands would likely show up) see a car before they see the typeface. With that in mind I would imagine that the primary concern with any update to those brands would focus on emphasising the core traits of those brands, embracing their history as much as their contemporary perception by consumers, jobs for which I would imagine many existing typefaces serve that purpose. You could <em>probably</em> choose a number of similar typefaces to do the job without greatly changing perception of the logo/logotype.</p>
