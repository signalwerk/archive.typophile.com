    html: <p>It just looks like STOCK PHOTOGRAPHY. It feels that it brings down the rest of your work. I suggest using just type. <br> <br>"Obviously, generic iconography, in and of itself, means different things to different people." <br> <br>The goal of an icon is to have recognition visually as to what you do. I am not saying that all icons are immediately recognized, but I feel that the pen is a mixed message. I don't think on every job there has to be an icon, especially if there isn't one that fits.  <br> <br>I know some of you argue that there is type that will be with the icon. But that backs up what many on here are saying- why have an icon at all. Why force something to work when it doesn't, especially when you have a classy clean type solution already. The pen will draw attention away from the foil stamp. <br> <br>Even with the pen, your work looks good as always Scott. Have a good weekend.</p>
