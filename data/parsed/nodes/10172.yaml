  html: <p>I don't usually post this early in my project, but I've got a serious issue that I need some help on. This is one for you intellectuals and ultra-business-minded communicators. <br> <br>I am struggling to even come up with a concept for my client because of the nature of his business direction (which we need not spend time debating here). He has decided to make a career alteration which will include returning to practicing law (mostly estate planning type stuff) and real estate brokering. In my experience developing solutions for both of these types of professionals, I have discovered many dynamics that are unique to each type. I am not successfully thinking of a concept that will satisfy both. <br> <br>I know that there are some great minds out there, so I'm hoping that some of you might have some stellar ideas on how to merge a legal practice and a real estate brokerage into one identity. Before I share any of my current considerations (which are weak) I will wait to hear your untainted response(s). <br> <br>Thank you.</p>
