    html: <p>Scott, nice work! (I fell off the radar for a bit, so this is the first I'm seeing of it.) <br> <br>I agree with Tom and John, I like everything but the pen. Part of it is the fade on the pen. It makes it look like pre-fab stationary to me. For a law firm, I envision a crisp image, with defined edges. Essentially, I see it as grey &amp; fuzzy vs. sharp &amp; clean, and the latter wins. <br> <br>So, I'm not anti-pen, but I'm not feeling the execution. As it is, I think it'd be stronger without than with. The fountain pen is a good choice for a law firm, so I'd develop that. Perhaps make the body of the pen glossy, so you have reflections to work with in the mark to make it end cleanly? Not sure. <br> <br>It's definitely interesting that the firm wanted such a visually active stationary set, but I wouldn't be surprise if law firms start to open up their visual identities a bit, as the twentysomethings of today become the partners of tomorrow. Again, Scott, nice work.</p>
    html_clean: <p>Scott, nice work! (I fell off the radar for a bit, so this is the first I'm seeing of it.) <br> <br>I agree with Tom and John, I like everything but the pen. Part of it is the fade on the pen. It makes it look like pre-fab stationary to me. For a law firm, I envision a crisp image, with defined edges. Essentially, I see it as grey &amp; fuzzy vs. sharp &amp; clean, and the latter wins. <br> <br>So, I'm not anti-pen, but I'm not feeling the execution. As it is, I think it'd be stronger without than with. The fountain pen is a good choice for a law firm, so I'd develop that. Perhaps make the body of the pen glossy, so you have reflections to work with in the mark to make it end cleanly? Not sure. <br> <br>It's definitely interesting that the firm wanted such a visually active stationary set, but I wouldn't be surprise if law firms start to open up their visual identities a bit, as the twentysomethings of today become the partners of tomorrow. Again, Scott, nice work.</p>
