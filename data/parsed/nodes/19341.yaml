  html: |-
    <p>Anyone know of a font editor which can edit TrueType collections (.ttc files) directly?</p>
    <p>A lot of software can break a ttc up into a set of ttfs, but if you’ve got a ttc with a single glyf table and a single kern table but n cmap tables, and want to change a glyph shape or a kern value, it would be good to do this just once to the ttc, not n times to the ttfs.</p>
    <p>More generally, why did TrueType collections not catch on?  Are they more widely used in the Far East than in the West?  Maybe there are tools to edit them in Japan or China?</p>
    <p>Many thanks.</p>
