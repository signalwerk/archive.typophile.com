    <p></p><div class="imageWrap"><img src="http://typophile.com/files/FontExplorerX_3641.jpg"></div><p></p>
    <p>Download FontExplorer X Pro 4.0: <a href="http://www.fontexplorerx.com/" title="http://www.fontexplorerx.com/">http://www.fontexplorerx.com/</a><br>
    Check out Fonts.com Subscription Plans: <a href="http://bit.ly/12j0rc5" title="http://bit.ly/12j0rc5">http://bit.ly/12j0rc5</a><br>
    Read Blog Post: <a href="http://bit.ly/11TONOD" title="http://bit.ly/11TONOD">http://bit.ly/11TONOD</a></p>
    <p>Monotype has introduced version 4.0 of its award-winning <a href="/wiki/%20http%3A/%252Fwww.fontexplorerx.com/%20" class="freelinking" rel="nofollow">FontExplorer® X Pro </a> font management solution for Macintosh® platforms. The new release, which breaks new ground with features such as support for Web fonts, OpenType® features and Monotype’s SkyFonts™ technology, is <a class="freelinking external" href="http://www.fontexplorerx.com/ " rel="nofollow">available separately </a> or as part of Monotype’s top-level <a class="freelinking external" href="http://www.fonts.com/web-fonts " rel="nofollow">Fonts.com Web Fonts subscription plans</a>. Customers are able to take advantage of advanced capabilities for selecting, accessing and managing large numbers of fonts quickly and easily.</p>
    <p>FontExplorer X Pro 4.0 introduces several features, including:</p>
    <p>•	Web font support – FontExplorer X Pro can now import, preview and organize Web fonts, including WOFF (Web Open Font Format) and EOT (Embedded OpenType) files.<br>
    •	Website font preview – Selected elements on any website can be viewed within FontExplorer X Pro where users can customize the fonts, colors and spacing of text.<br>
    •	Slide show feature – Selected fonts can be displayed as a slide show and can overlay documents to help designers gauge how font selections will appear in projects.<br>
    •	Mini view – FontExplorer X Pro can now work in a small window, allowing for more screen space for design apps, while providing easy access to the user’s font library.<br>
    •	Enhanced smart sets – One of the most popular features of FontExplorer X Pro, smart sets operate as filters for designers to access fonts that meet predetermined criteria. Smart sets now support multiple languages, as well as OpenType features available within certain fonts.<br>
    •	Improved main font list – Enhancements include the ability to view OpenType feature information and preview font selections using either a multi-line or waterfall view.<br>
    •	SkyFonts Support – FontExplorer X Pro now supports SkyFonts technology, Monotype’s platform for easily trialing, installing and synchronizing desktop fonts from Fonts.com or Google Fonts across workstations.<br>
    •	Connectivity through Fonts.com Master and Professional subscription plans – Subscribers of either plan can take advantage of all the benefits of FontExplorer X Pro through built-in SkyFonts technology.</p>
    <p>Monotype’s Fonts.com Master and Professional subscription plans feature access to more than 20,000 Web fonts, and more than 7,000 traditional desktop fonts, including selections from the Monotype® Libraries which comprise the Monotype, Linotype®, ITC®, Bitstream® and Ascender® collections. Subscribers also receive SkyFonts technology; Monotype’s <a class="freelinking external" href="http://typecast.com/ " rel="nofollow">Typecast</a>™ application, a browser-based tool for designing Web pages with Web fonts; and now FontExplorer X Pro. </p>
    <p>Further information about Fonts.com subscription plans is available at <a href="http://www.fonts.com/web-fonts" title="http://www.fonts.com/web-fonts">http://www.fonts.com/web-fonts</a>. </p>
    <p>Fonts.com Web Fonts Master and Professional subscribers are provided access to version 4.0 for Mac® platforms and version 2.4 for Windows® systems, which includes the capability to connect with SkyFonts technology. FontExplorer X Pro for the Mac may be purchased separately for $89/€89 (including VAT) through the all-new fontexplorerx.com store. Customers using FontExplorer X Pro Mac 2.0 or later can upgrade to version 4.0 for $39/€39 (including VAT). Customers using FontExplorer X Pro 2 for Windows can download version 2.4 for free. FontExplorer X Pro licenses purchased on or after March 1, 2013 may be eligible for a free upgrade. Further information is available at <a href="http://www.fontexplorerx.com/" title="http://www.fontexplorerx.com/">http://www.fontexplorerx.com/</a>.</p>
