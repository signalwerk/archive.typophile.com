      <p><a class="freelinking external" href="http://forum.fontlab.com/index.php?topic=313.0" rel="nofollow">Adam Twardoch's guide to font naming in FontLab</a> should help you work out a naming scheme that is optimized for most platforms and applications.</p>
      <p>I always set naming manually using a combination of FontLab, TTX, FontForge and DTL OTMaster, the last two primarily for checking.</p>
