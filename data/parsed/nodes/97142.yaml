    <p>I ran the widely recommended Adobe FDK's compareFamily with some errors and warnings. I tried to look for some documentation of these errors (how to fix them) but have found nothing or very little. Is there such documentation, or maybe a kind soul who's willing to explain? Quite a lot of points here, but clearing out at least the most critical ones would be a really great help!</p>
    <p>I ran the compareFamily to a bunch of bought fonts as well and got similar errors in them too so I'm wondering how relevant/critical these errors are? I understand the script was made for Adobe, so not all of the checks are relevant to others.</p>
    <p>I'm working in Fontlab.<br>
    ---------------<br>
    Error: The first 32 chars of the Mac platform name ID 18 Compatible Full Name must be unique within Preferred Family Name group. </p>
    <p>Names are unique, but not in the first 31 chars. Is it a problem?<br>
    ---------------<br>
    Warning: Only Italic style bit set, Compatible SubFamily Name with Win Platform is not 'Italic' for Font</p>
    <p>All italics have the box checked. All italics are actually named Oblique. Does this mean that I should set "Italic" in the Style Name field even though all other appropriate name fields use "Oblique"?<br>
    ---------------<br>
    Error: font does not have a BASE table. This is necessary for users who are editing in a different script than the font is designed for.</p>
    <p>Where is this BASE table defined?<br>
    ---------------<br>
    Error: font has OS/2.ulUnicodeRange1 bit 3 set for Unicode block Latin Extended-B, but the test heuristics say it should not be set.</p>
    <p>Lots of similar errors found. Having limited knowledge, I used the Fontlab's green diamond to define the codepages. Should I trust the diamond or what?<br>
    ---------------<br>
    Error: The BlueValues (and OtherBlues) pair have distance greater than the maximum limit.<br>
    	Font<br>
    	Pairs: -30 0<br>
    	Distance (30) is greater than 1/BlueScale (25.24)<br>
    	BlueValues: [-30, 0, 504, 539, 697, 744]<br>
    ---------------<br>
    Error: More than 4 fonts with the same nameID 1, compatible family name</p>
    <p>Is this related to the 31 unique character limit above?<br>
    ---------------<br>
    Family Test 5: Check that style settings for each face is unique within Compatible Family group, in all languages.</p>
    <p>Error: These two fonts have the same italic and bold style setting<br>
    	Font 1: Hairline<br>
    		Italic Bit: 0 Bold Bit: 0<br>
    	Font 2: Thin<br>
    		Italic Bit: 0 Bold Bit: 0</p>
    <p>All italics have the box checked, no fonts have the bold checked.<br>
    ---------------<br>
    Error: More than two usWeightClass values in the Group<br>
    	usWeightClass values: [250, 300, 350, 400, 450, 500, 550]</p>
    <p>Each of the weights have their own number, isn't that correct practice?<br>
    ---------------<br>
    Family Test 12: Check that GSUB/GPOS script and language feature lists are the same in all faces, and that DFLT/dflt and latn/dflt are present.<br>
    	Warning: font does not have script 'DFLT' language 'dflt' in table GPOS.<br>
    	Warning: font does not have script 'DFLT' language 'dflt' in table GSUB.</p>
    <p>	GSUB Table - script:tag list.<br>
    	latn:  MOL    ROM    dflt</p>
    <p>	lookup group ID to lookup index list:<br>
    	ID 1:   maps to lookups [2].<br>
