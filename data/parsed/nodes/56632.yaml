      <p>It seems to me the opening could be more or less the shape of the tongue with it looping up into what appears to the the top of the bun (?) .</p>
      <p>And with the full-color shaded version you do have the advantage of being able to articulate the entire concept, but the 1-color version is where the problem needs to be solved.</p>
      <p>The colors and textures are fun. But I still think the tongue needs to be solved first.</p>
