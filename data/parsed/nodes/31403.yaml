    html: <p>Hey cerulean, I considered your comment as a challenge &amp; made a pixel font (see Micro3) according to your parameters (also using "wandering pixels" this time) just for comparison &amp; -obviously- this one is a lot more like your Fourmat (nice name BTW)... Even the capital B which I found quite a challenge turned out pretty much the same, but then again, there's only so many ways to make a letter using a limited amount of pixels.</p>
