    html: |-
      <p>I am working at the design studio that does the design of the good magazine,<br>
      We didn't do the logo though. </p>
      <p>It is custom made by a design studio called Area 17 ( <a href="http://www.area17.com" title="http://www.area17.com">http://www.area17.com</a> ) and it's not a typeface, it is loosely based on Trade Gothic Bold Condensed No. 20 and of course some Alternate Gothic is there too.</p>
      <p>Trade Gothic Bold Condensed No. 20 is one of the typefaces we use in the magazine.</p>
