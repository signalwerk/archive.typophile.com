    <p>Hi everyone<br>
    I’m currently working on a translation of Beatrice Warde’s <cite>The Crystal Goblet</cite> for a French publisher, and there's a rather obscure point which I’d like to have your cooperation about. At some point, Mrs. Warde alludes to “a virago with a hatchet” which was supposed to be a fierce enemy of wine (if I’m not mistaken) — does someone know what all this is about ?<br>
    Thank you very much</p>
