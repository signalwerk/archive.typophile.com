      <p>EK, legally I don’t know for sure. It certainly would seem like I’m within my usage rights, as I have a license. I know they have a verbiage on their website that says their fonts are all visibly and invisibly digitally signed, and they can all be traced. I’ve also heard that they don’t distribute actual font files anymore, but rather an application that loads the font into the operating system during boot, but that’s not confirmed, and maybe not uncommon (like I said, I stick to pretty standard fonts being a web dev, not buying too many these days).</p>
      <p>As far as my opinion, I wouldn’t be losing any sleep if I happened to find the font elsewhere :)</p>
