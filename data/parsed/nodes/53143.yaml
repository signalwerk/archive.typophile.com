      <p>It's a font-object related function:<br>
      <code>SetClassFlags(classIndex,isFirst,isSecond)</code><br>
      You need to iterate through classes, and depending on whether the class is 1st/left or 2nd/right (e.g. check if a tag is found in class names), set the according flag(s):</p>
      <p><code>isFIRST_TAG = "_1ST"<br>
      isSECOND_TAG = "_2ND"<br>
      f = fl.font<br>
      classes = f.classes<br>
      for cIdx in range(len(classes)):<br>
      &nbsp;&nbsp;&nbsp;&nbsp;cName = classes[cIdx].split(":",1)[0]<br>
      &nbsp;&nbsp;&nbsp;&nbsp;if cName.startswith("_"):<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;if isFIRST_TAG in cName:<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;f.SetClassFlags(cIdx, 1, 0)<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;elif isSECOND_TAG in cName:<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;f.SetClassFlags(cIdx, 0, 1)<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;else:<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;f.SetClassFlags(cIdx, 1, 1)<br>
      </code></p>
      <p>Then update font.</p>
