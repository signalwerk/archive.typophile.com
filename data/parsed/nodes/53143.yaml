    <p>Hi,</p>
    <p>I know the classes in FontLab can be accessed by using the "fl.classes" property in Python, but how do I set the right/left checkboxes in the classes window?</p>
    <p>...Any chance that the unofficial Python API reference might be updated some time?</p>
    <p>Thanks,</p>
    <p>-Paul van der Laan</p>
    <p><a href="http://www.type-invaders.com" title="www.type-invaders.com">www.type-invaders.com</a></p>
