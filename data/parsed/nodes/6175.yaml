    html: <p>It looks like a Victorian typeface called 'Hogarth', as seen in the Dover book of Victorian Display Alphabets by Dan X. Solo.  Apparently it is one of the fonts included in the Dover "Victorian" Fonts CD made with fonts provided by Dan Solo. <br> <br>If you need evidence to support this I can scan the showing from the book.</p>
