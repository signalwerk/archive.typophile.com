    html: |-
      <p>&gt; <em>That is a lot of work.</em></p>
      <p>Indeed. What I do is set things in InDesign and then just take a snapshot by pressing Command+Shift+4 on OS X.</p>
      <p>&gt; <em>I don’t even know how to control the quotes in this forum.</em></p>
      <p>The best way I know is by using HTML entities. You can specify them by Unicode (hex), decimal or abbreviated form. Here's a short list:<br>
      quoteleft – &amp;#x2018; / &amp;#8216; / &amp;lsquo;<br>
      quoteright – &amp;#x2019; / &amp;#8217; / &amp;rsquo;<br>
      quotedblleft – &amp;#x201C; / &amp;#8220; / &amp;ldquo;<br>
      quotedblright – &amp;#x201D; / &amp;#8221; / &amp;rdquo;</p>
      <p>&gt; <em>In any case, in all the Adobe fonts I know, there is no kern between /quotedblleft{}/quoteleft{}, and there should be [...]</em></p>
      <p>OK, so something like this? All the lines are set in Arno Pro Regular. The top lines show the font as it is currently, with no kerning between quotes. The bottom lines have 75/1000 units of kerning.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Arno_quotes_3816.png"></div><p></p>
      <p>&gt; <em>For a different example, using Warnock Pro Light, set the string A/quoteright{}/comma{}.</em></p>
      <p>Yeah, it looks bad. This combination requires a kern triplet, or more conservative kerning at least.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Warnock_A_quote_6051.png"></div><p></p>
      <p>&gt; <em>If I have to (i.e., if it will get things fixed), I’ll spend half a weekend setting examples to post.</em></p>
      <p>Please do. I'll make sure these bugs get logged, and will certainly be fixed next time the fonts get revised. No need to post them here. You can send the material directly to me at msousa adobe.com</p>
      <p>What would be nice is if you could post a list of unusual kerning combinations, like the quote/quote examples you've just provided. This type of thing should actually be posted on the Wiki. If you don't know how to do that, just start a new thread.</p>
