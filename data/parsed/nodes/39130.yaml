    html: |-
      <p>Miguel,</p>
      <p>Take pity on an old print guy. The only way I know to do this is to set something in InDesign, export a PDF file, open that up in Photoshop, then save the file as a GIF so I can post it. That is a lot of work.</p>
      <p>I don't even know how to control the quotes in this forum. Consider:</p>
      <p>"'Oh' he said 'don't do that.'"</p>
      <p>Now typographically, that is rendered</p>
      <p>/quotedblleft{}/quoteleft{}Oh/quoteright{}/space{}/quoteleft{}don't do that/period{}/quoteright{}/quotedblright</p>
      <p>But that's not what gets displayed.</p>
      <p>In any case, in all the Adobe fonts I know, there is no kern between /quotedblleft{}/quoteleft{}, and there should be -- anything from about 75/1000 to 150/1000, depending on the font &amp; word space value. The same between /quoteright{}/quotedblright{}. And in the UK, those sequences are reversed, but the kerning should still exist between the two quotemarks.</p>
      <p>/quotedblleft{}/quoteright should also have a kern, as in </p>
      <p>"'Tis of the I sing."</p>
      <p>For a different example, using Warnock Pro Light, set the string A/quoteright{}/comma{}. The kerning is so tight the comma winds up looking like some strange diacritic on the "A".</p>
      <p>If I have to (i.e., if it will get things fixed), I'll spend half a weekend setting examples to post.</p>
