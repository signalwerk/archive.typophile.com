      <p>Hello Charles, it's funny to find this in an Arno thread since kerning in Arno is much better than in some older fonts: Quotation marks are spaced generously which I like. Two consecutive quotation marks align nicely. And there's kerning between quotation marks and comma/period -- and the other way round too.&nbsp;&nbsp;;-)<br>
      Some combinations like&nbsp;&nbsp;A'.&nbsp;&nbsp;or&nbsp;&nbsp;V.'&nbsp;&nbsp;may require contextual refinement, but this can be said for most typefaces. Yet another dimension of kerning horrors ...</p>
