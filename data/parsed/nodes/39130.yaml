    <p>A colleague of mine owns Arno Pro. He's doing work which contains transliterations, and needs an h with a dot above. He wanted to modify his copy of Arno Pro and add it in. When he opened the font in fontlab, he discovered that none of the kerning pairs show up, and when it gets saved again, all the kerning (and who knows what else) gets stripped from the font.</p>
    <p>I didn't quite believe him, so I took a look myself, and sure enough, FontLab shows no kerning. Not in the metrics window, and not in the OpenType window. (The feature shows up, but there's no lookups!)</p>
    <p>Is Adobe using some new kind of system?</p>
    <p>Thanks,<br>
    Harbs</p>
