    <p>In the course of time I have posted some info on my PhD research titled <em>Harmonics, Patterns, and Dynamics in Formal Typographic Representations of the Latin Script | The regularization, standardization, systematization, and unitization of roman and italic type since their Renaissance origin until the Romain du Roi</em> on this forum. Based on my more recent ﬁndings I now think it’s possible that movable type was developed as a ‘font format’, in which different horizontal and vertical dynamics and dimensions for (different point sizes of) Gothic and roman type were captured in (geometric) models and in which intelligence was put in (the proportions and related spacing of) punches and matrices to make the cutting, striking, justiﬁcation and casting as simple as possible. This also would have made the distribution of roman and italic type all over Europe easier.</p>
    <p>There is ample proof that the font technology developed in the 1970s and 1980s at for instance URW and Adobe is the result of a cooperation/interaction between type designers and software developers. That probably also has been the case at other companies involved in font-technology development. Perhaps movable type was the result of a comparable interaction between artists, i.e. calligraphers, and craftsmen, i.e. engravers and gold smiths too.</p>
    <p>I think it’s quite plausible that different type design and production methods, basically the one that ‘relies on the eye’ and the forenamed ‘systematized’ one, were used besides each other in Renaissance Italy, but that Jenson’s (production) model became dominant because it was adapted by Griffo and subsequently copied by Garamont. Nowadays we mostly think of this trio as excellent ‘type designers’, but in their times their types must have been especially very practical to (re)produce by the endusers.</p>
    <p>At the <a href="http://www.tagderschrift.org" rel="nofollow">Tag der Schrift</a> at the Berufsschule für Gestaltung Zürich on 25 May I will elaborate on this ‘font format’ hypothesis. For those who are interested, I have made the <a href="http://www.lettermodel.org/downloads/Mythical_Eye_Zurich.pdf" rel="nofollow">slides</a> already available for downloading.</p>
    <p>FEB</p>
