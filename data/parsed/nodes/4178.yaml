    html: '<p>Oops, missed one of your questions there. <br> <br>Typically, caption is about 6-8 points, text is 9-13, subhead 13-24, and display is &gt;24. But we post all the details in the "readme" for each font package, including the exact sizes that each cut is intended to cover. The Minion Pro readme can be found here: &lt;<a href="http://www.adobe.com/type/browser/pdfs/readmes/minionproopticalsreadme.pdf" target="_blank">http://www.adobe.com/type/browser/pdfs/readmes/minionproopticalsreadme.pdf</a>&gt; <br> <br>I hope that helps! <br> <br>T</p>'
