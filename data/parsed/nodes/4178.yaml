  html: <p>Hey guys, <br> <br>I'm working on a series of biographies (3 series of 5 books) One is on literature, one on music and one on politics. In each I'm using the same fonts (so far I have Frutiger I'm sure about) but in literature I use the serif in italic, in music the normal serif and in politics the small caps serif.  <br> <br>I'm hesitating between Minion MM or Bembo as a serif. What are your opinions? Any other sans come to mind other than Frutiger to complement one or the other? <br> <br>Thanks! <br> <br>Em</p>
