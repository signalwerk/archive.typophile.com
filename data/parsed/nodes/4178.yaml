    html: <p>The small caps feature of OT fonts is not accessible from within current versions of Quark (or any other program that does not support OT layout features, for that matter). <br> <br>This is one of the main reason why those of us who still depend upon Quark (for whatever reasons; we needn't debate them here) find the upgrade to OT versions to be of less value. <br> <br>-- K.</p>
