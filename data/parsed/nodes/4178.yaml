    html: "<p>I have read that the digital version of Bembo, as opposed to the great original metal version, has problems. In the discussion on the Yale site for Matthew Carter's new face for Yale, influenced by the metal Bembo, he mentions the weakness of the digital version. <br> <br>I know the original Minion and Minion Pro, which is definitely better. I don't know the MM version, but I have read on these boards that the Pro version is improved from it.  <br> <br>Minion Pro is wonderfully serviceable because of its completeness: optical weights, and small caps in all sizes, as well as small caps semi-bold, bold, italic, swash characters, ornaments, etc. A bonus is also that you can use Poetica as a formal script companion to Minion, as its letterforms are similar to Minion italic.    </p>"
