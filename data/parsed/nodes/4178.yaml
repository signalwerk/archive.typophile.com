    html: <p>An understandable concern! But as long as the font is OpenType and has real small caps, the small caps formatting in InDesign will use those real small caps. Otherwise it will indeed synthesize fake small caps. <br> <br>Emilie, you might want to browse the OpenType User Guide. I put in a lot of info about exactly these sorts of concerns. See <a href="http://www.adobe.com/type/opentype" target="_blank">http://www.adobe.com/type/opentype</a> and look for the link on the right. <br> <br>Cheers, <br> <br>T</p>
