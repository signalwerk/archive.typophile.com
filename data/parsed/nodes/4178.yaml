    votes: null
    html: "<p>I can only comment as a reader, not a professional. But ... <br> <br>I'd avoid digital Bembo. It really is grey and dull. It's a terrible pity, because it was in its day such an exquisitely fine typeface: deep warm black type on cream paper. Now it's hardly ever any good. (The Tufte books are fine, but iirc he set in metal then printed from a proof). I think it should be sent to an honourable grave, or reworked a la the New Yale typeface. <br> <br>If you must use Bembo, please use ff, ffl and ffi ligatures and OS numbers. Bembo really needs them. <br> <br>I personally dislike Minion. You see much too much of it. It's too mannered and too polished. But far sooner Minion than Bembo. But on the whole I'm with the re-open nominations crowd. <br> <br>Dante, suggested above, is nice. The other possibility if you are looking for a classic \"academic but friendly\" look is some sort of Baskerville -- alongside Bembo the type of choice for that sort of product in the mid-20th century. But they've been largely killed by digitization as well. I have seen one book (history) in Storm Baskerville, which I thought looked as it should, but I'm not sure about the figures. I don't know if anyone has experience of using it.</p>"
    html_clean: "<p>I can only comment as a reader, not a professional. But ... <br> <br>I'd avoid digital Bembo. It really is grey and dull. It's a terrible pity, because it was in its day such an exquisitely fine typeface: deep warm black type on cream paper. Now it's hardly ever any good. (The Tufte books are fine, but iirc he set in metal then printed from a proof). I think it should be sent to an honourable grave, or reworked a la the New Yale typeface. <br> <br>If you must use Bembo, please use ff, ffl and ffi ligatures and OS numbers. Bembo really needs them. <br> <br>I personally dislike Minion. You see much too much of it. It's too mannered and too polished. But far sooner Minion than Bembo. But on the whole I'm with the re-open nominations crowd. <br> <br>Dante, suggested above, is nice. The other possibility if you are looking for a classic \"academic but friendly\" look is some sort of Baskerville -- alongside Bembo the type of choice for that sort of product in the mid-20th century. But they've been largely killed by digitization as well. I have seen one book (history) in Storm Baskerville, which I thought looked as it should, but I'm not sure about the figures. I don't know if anyone has experience of using it.</p>"
