    html: <p>I don't want anyone to think that I disparage Minion; I can see its virtues, but I cannot love them. I guess it's a matter of taste. Minion seems to me slightly mannered, perhaps too polished, its elegance too studied. When it comes to tea, it spreads its napkin carefully, drops no crumbs, eats its cake with a fork and holds its cup ever-so-daintily. It avoids talking about sex, religion or politics. It leaves when it should and writes its thank-you note that evening. One's mother says, "When are you having that nice Minion over, such a charming boy." I prefer something a little rougher, quirkier, more dangerous. <br> <br>And because it's such a pleasant guest, one does see it around a lot. Better, no doubt and by far, than some of the others one sees all the time. But unlikely to thrill.</p>
