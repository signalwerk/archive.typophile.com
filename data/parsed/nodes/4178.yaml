    html: <p>Em, <br> <br>If you look at the comparison of fake and real small caps in the OpenType User Guide (linked previously), I think that it's pretty clear from just the weight differences. That is, fake small caps always look too light (using caps, lower-case or real small caps for comparison). <br> <br>If you want to tell "is there a small cap feature in the font) you can use the Glyph Palette in Illustrator CS or InDesign. It allows you to filter by layout feature, so you can see what all the, say, swash glyphs look like. Or all the small caps. <br> <br>One can also go online to adobe.com and drill down to the page for the font, and see a bunch of turqoise blue (cyan) icons on the right that tell you what kinds of goodies are in the font. Or one can download the "glyph complement" PDF to see them. <br> <br>Regards, <br> <br>T</p>
