    html: <p>The only reason I am tired of Minion is because it's our corporate typeface. Otherwise, it's a lovely piece of work. <br> <br>I'm surprised to hear that Rob thinks he has a version of Minion with no ligatures. Every version we've issued, with the possible exception of Minion Web, has at least fi and fl ligatures. I suppose you could be on Windows and using QuarkXPress, in which case you couldn't use those ligatures (which are still present). InDesign can get at them, though. <br> <br>Cheers, <br> <br>T</p>
