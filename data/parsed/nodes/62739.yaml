      <p>Naming and classification of type has long been practiced in sort of an after-the-fact way. First, someone creates a variation on the norm which is different enough to be noticed. In the conversations that follow among type afficionados, a new name comes about as a way to mark the new breed. Afterwards, there are variations on that form and then discussions evolve to decide if these variations belong to that genre or not.  You can find numerous threads here online with posters arguing nuances of definition. As long as there are people with a keen enough interest to care about the flavors of type, there will be new names and new arguments to define or reject a definition of a type classification. Enjoy the rhetoric; peruse the analytic dialogue; nitpick your exacting set of stipulations but fear not, there will be more to come:-)<br>
      Yes, there will be something beyond "neohumanist sans".</p>
      <p> ChrisL</p>
