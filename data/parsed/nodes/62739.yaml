    <p>For a while now I have been pondering a question. It may be stupid but it is also interesting to think about and I wanted to see what response the typographic community may have to it. </p>
    <p>Do you guys think that this century will see the invention of a completely new classification of type? That is to say a mainstream type class that is not Serif or Sans or Script, something truly new that could not be classified as anything seen before in type? Or do you think that typography has branched out as far as it will and will not see anything entirely unseen before? </p>
    <p>It is interesting for me to think about because I cannot fathom a way that type could be drastically different without becoming a new alphabet and yet it is difficult for me to believe that it could not be done. </p>
    <p>Perhaps this will pose an interesting question for some of you, maybe it has been asked before or it could be just the simplistic pondering of an ignorant student. Either way I would love to hear some responses. :)</p>
