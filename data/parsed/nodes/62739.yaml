      <p>Michael, I know there are always new typefaces and new styles of type all the time and there is definitely nothing wrong with that. I guess what I am wondering about is the possibility of a new classification of type. </p>
      <p>I guess I imagine the evolution of type as something like the evolution of animals. With different branches, each resulting from variations of earlier branches of type with each branch continuing to evolve into various subcategories and so on. So with all of typography being the all encompassing top of the chain and the various writing systems below that. So i have begun to wonder if it is possible within our writing system to create a new classification without it evolving from something else. If we might see the creation of a new kingdom in the taxonomy of type so to speak. </p>
      <p>Though I admit this idea might be a bit far out there I find it an interesting train of thought.</p>
