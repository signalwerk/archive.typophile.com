      <p>Cody,<br>
      As my young friend Michael says, I am an old fart. I still like to see the envelope pushed and hope you will keep trying yourself.<br>
      Personally, I ignore classifications other than just having some fun with my friends who love that sort of thing. I just design type without trying to make it either fit or not fit a classification. I feel more comfortable approaching form as naively as possible and solving structural problems that come about. I do have a great deal of interest in how the finished product is meant to function so categories like text, display, and signage do mean a lot to me.<br>
      My only advice to you is to allow your typeface to be what it is and not just try to will it to be different. It may or may not be seen as groundbreaking by others but you have no control over that anyway. Just make type and let the categories fall where they may.</p>
      <p>ChrisL</p>
