      <p>Yes thank you that is quite similar. However Many of the ideas there do not exactly fit with my question. I guess my question has more to do with the possibility of having something completely remote from anything before. </p>
      <p>Perhaps it is just my naivety as a young designer but I find the thought of something completely new and completely different quite exciting. Yet on the other hand it seems quite daunting to imagine something so far removed from everything that has evolved into the various type classifications we have today. On one hand It seems that everything we have can be traced back in history to various points of origin and it is difficult to imagine the creation of type without drawing from the past. On the other hand however I cant help looking at artists like Jackson Pollock and wondering if I will see a time when typography takes such a turn. This does not necessarily mean that I think it may take an abstract turn, just a turn in a completely new direction that no one has addressed yet.</p>
