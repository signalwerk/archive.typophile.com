      <p>First of all, you can export all the glyphs in one .svg from illustrator, import them into fontforge, and save a lot of time. Just copy each glyph to the appropriate slot.</p>
      <p>I would also recommend you try to work directly in Fontforge. The way you draw things is probably roughly the same. I never use the pen tool in FF - I just select the corner or curve tool and click away. Probably I could become more productive using the pen tool.</p>
      <p>Multiple Master isn't exactly outdated; Superpolater works on the same principle of Adobe's MM. Adobe type 3 fonts are, however, deprecated. So you can't <em>release</em>  MM fonts very easily. But MM can be great for development. That said, Fontforge's MM implementation seems to be broken, and the only alternatives seem to be either Superpolator or to work for Adobe.</p>
      <p>Anyway, here is a thread with some help on bolds:<br>
      <a href="http://www.typophile.com/node/74895" title="http://www.typophile.com/node/74895">http://www.typophile.com/node/74895</a></p>
