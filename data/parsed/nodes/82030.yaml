      <p><cite>I am wondering (I am by no means an expert in font creation) whether there is an easy way to create different weights in FontForge?</cite></p>
      <p>There is not. If you want to a bold font then start drawing. If you want to create a bold font easily then stop drawing type families and move on to something that interests you more. </p>
      <p><cite>Superpolater works on the same principle of Adobe's MM</cite></p>
      <p>Only if you are interpolating between only two fonts. Once you go beyond that it does a hell of a lot more. Try extrapolating between three masters on two axes with MM. For that matter, try having an MM font with three masters.</p>
      <p><cite>That said, Fontforge's MM implementation seems to be broken, and the only alternatives seem to be either Superpolator or to work for Adobe.</cite></p>
      <p>There's also Fontlab, which has semi-functional MM support with an awkward but useful interface. As long as you aren't working with components it will do the job. One can also interpolate between two fonts with Robofab, although that isn't exactly the most user-friendly interface. And the MM system in Glyphs is supposedly wonderful.</p>
