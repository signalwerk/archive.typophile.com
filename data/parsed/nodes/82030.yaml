    <p>Hi there,<br>
    I've had this FontForge .sfd file sitting on my computer for months now that I have occasionally pulled out, worked on, and then put away again until I had more time to repeat the cycle.</p>
    <p>I am wondering (I am by no means an expert in font creation) whether there is an easy way to create different weights in FontForge?</p>
    <p>My typical workflow involves creating a glyph in Illustrator, saving it as an .svg, and then importing each glyph individually into their appropriate character space in FontForge. This is time consuming, but perhaps it is easier to create different weights in Illustrator than FontForge?</p>
    <p>I often hear of Multiple Master fonts, but I have no experience with creating them (and I understand they are outdated?)</p>
    <p>Any assistance would be appreciated.</p>
    <p>Many thanks!</p>
