      <p>First, draw your font in FontForge.<br>
      Save a copy of your sfd file under a different name.<br>
      select the glyphs you want to render in a different weight<br>
      From the Element menu, select Style&gt;Change Weight…<br>
      Set your parameters in the dialog window and click OK</p>
      <p>The results may be a bit messy and require significant tweaking, but it'll give you something to start with.</p>
      <p>Once you have a clean version of your font in two weights, with the same number of points, starting points, and path directions in each corresponding glyph, you can interpolate between and even extrapolate beyond them using Element&gt;Interpolate Fonts. This is not the Multiple Master method, but the effect is similar.</p>
