    html: |-
      <p>dafont is very useful and contains much better typefaces that 99% of all the other free font websites; i'm using it quite often, when i'm in need of a very specific titling font for a packaging project (and i do packaging all year long) that doesn't require a perfect kerning. when i can't find what i need in quality foundries such as sudtipos or fontdiner, when hubert jocham is unavailable, dafont is very handy, even though full of problems (one of them being the big amount of ripoffs, even if they seem to be removed quite fast). to name dafont the 'root of all evil' is a bitter (some bad experience?) and rather stupid comment, in my opinion. I don't know fontsquirrel.</p>
      <p>this being said, i second drdoc's comment on rockwell sketch :-)</p>
      <p>dr</p>
