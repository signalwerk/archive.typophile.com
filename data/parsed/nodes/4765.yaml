    html: "<p>I've purchased a number of fonts form FontShop, and I've never been able to _find_ the EULA.  <br> <br>I'm in Canada, so the EULA may be different, and since I wasn't made aware of it, its application seem...moot. <br> <br>I have relied instead on a little booklet called \"FontShop's Guide to Legal Typeface Use\" put out by FontShop Canada some time ago. It states that: \"most font manufactures will allow you the right to produce a modified [font]... subject to the same licensing requirements as the original font.\" <br> <br>Now, I haven't relied on this booklet for other foundries, but the booklet goes on to discuss a hypothetical swash version of a FS font, so it certainly strongly implies that modifications are permitted, at least in Canada.</p>"
