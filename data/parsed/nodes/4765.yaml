      <p>Anyhow, back to the main question: <br> <br>Open the "OpenType" panel in FontLab. The left side lists the OT features, the right side lists the code for the currently selected feature. <br> <br>Click on the "+" sign at the bottom left of the OT panel. This adds a feature. The feature will initially be called "xxxx". <br> <br>In the right pane of the panel, you'll see the initial template of the feature code appear. Change the two occurrences of "xxxx" in the right pane " to the feature you want. Let's say lowercase to small caps ('smcp'). <br> <br>The remaining line to change and expand on is this one: <br> <br>&gt;  sub by ; <br> <br>You need to fill that out and duplicate i<!--
