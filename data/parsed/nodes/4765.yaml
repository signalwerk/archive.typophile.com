    <p>Okay, so along with the redesign for the magazines I work on, I'm going to rebuild our typefaces (Scala Sans and Scala) as OpenType fonts, to access all the small caps, etc. since we're switching to InDesign. <br> <br>I have no idea where to start.. I have been looking through the documentation in FontLab... it's abyssmal to say the least. I've opened a couple OpenType fonts, only to find a near indecipherable list of code terms for OpenType. <br> <br>I had to rebuild this font earlier in the year to unite all the family styles (the original Scala and Scala Sans were all pulled apart so that you don't jump to bold by clicking bold. Because most of the magazine text is written in Word prior to being laid out, it's imperative that the family function works correctly.) So I've got all my metrics, bitmaps, outlines already saved in FontLab, and united as families, but I don't know where to go from there. <br> <br>This is the list of functions I want to include: <br> <br>Standard ligatures (ff, fi, fl, ffl, ffi) <br> <br>Lining numerals <br> <br>Non-lining numerals <br> <br>Small Caps <br> <br>Multiplication Symbol (this is used constantly in my texts, and needs to be present... can I define a discretionary alternate that says "if number x number" then "number [multiply] number"? There's probably about five or six discretionary rules I'd need to incorporate. <br> <br>There's also a set of expert symbols that I'd like to incorporate as alternate/additional characters. <br> <br>The range of weights will be regular, regular italic, bold, bold italic, black, black italic. Scala doesn't have a black italic caps, so I'll have to leave that out. <br> <br>Basically, I need some guidance. I've not done a lot of coding, and this seems pretty crazy, but if the House Industries guys can learn to do it, so can I!</p>
