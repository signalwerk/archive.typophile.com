    html: "<p>Urm. I'd love to advise, but FontShop's end user license doesn't permit you to modify their fonts. It reads: <br> <br>\"You agree not to modify, adapt, translate, reverse engineer, decompile, disassemble, alter, or otherwise attempt to discover the source code of the Software.\" <br> <br>So you should contact FontShop and let them know you want OpenType versions of the fonts. <br> <br>That aside, it would not be at all difficult to add a handful of OpenType features like those you're contemplating. You could indeed do a contextual alternate that substituted a multiplication symbol for an x in the manner you describe. <br> <br>Regards, <br> <br>T <br></p>"
