      <p>Diner: <cite>There is a thread I started at Typophile and I would be interested to know what your experience has been so far offering webfonts.</cite></p>
      <p>Thanks for inviting me here, I am not spending as much time on Typophile as I wished.</p>
      <p>To answer Stuart's question - it is too early to evaluate our webfonts solution, we launched it just a month ago. We've had a very good feedback, but it will be interesting to see how the sales will be on a longer term (and not just the short term affected by the hype). From the webfonts sales that we had, the most interesting thing is that it was people who never bought fonts before. We offer a possibility of webfonts also for a clients who licensed desktop fonts earlier, but that was little used so far.</p>
      <p>We've worked on the webfonts solution since March, so had plenty of time to think about the licensing terms. We decided to go with a model, that I as a customer would feel most comfortable - that is as close to possible to one time costs. There is a one time licence fee, but because bandwidth costs money, we had to introduce a monthly limit (500MB per used font, per month, for free). So if you buy a package of 6 fonts, you get 3GB for free, which is a bandwidth of a serious site. Another possibility that we considered, was to give fonts for free, but user paying for bandwidth from the first hit. We decided against it, because it was a lot more unpredictable.</p>
      <p>I think there is plenty of room for other alternatives, so I am very curious to see other developments.</p>
      <p>Peter<br>
      <a href="http://www.typotheque.com" title="http://www.typotheque.com">http://www.typotheque.com</a></p>
