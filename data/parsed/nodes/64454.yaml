      <p>Why rent when you can buy? it's not a question for users, but for foundries.</p>
      <p>In the short term, because foundries don't find enough inherent protection to make them happy in the existing formats/setups for people hosting fonts themselves. Certainly not for raw desktop fonts....</p>
      <p>But financially, if it's a rental, it's easier to make the price scale with the volume of the site. Foundries can potentially price to be attractive to the very low end and still charge enough at the high end.</p>
      <p>At least, that's what I like about rental from the foundry side.</p>
      <p>From the user side, it can be made affordable regardless of who you are.</p>
      <p>Cheers,</p>
      <p>T</p>
