    <p>It's totally out of character for me to sort of put myself out there in our community but I'm starting to form the germ of a concept that I'd really like some thoughts on . . .</p>
    <p>Firstly, listen to this interview: <a href="http://web20show.com/2009/11/episode-58-font-squirrel/" title="http://web20show.com/2009/11/episode-58-font-squirrel/">http://web20show.com/2009/11/episode-58-font-squirrel/</a></p>
    <p>Second, think about this . . .</p>
    <p>We create fonts to resell so that graphic designers can enhance their work with our fonts as part of their design toolkit and we grant permission for them to create lots of different works with our fonts by the license we offer them . . .</p>
    <p>We sell these fonts for a fixed one time price which allows this use . . .</p>
    <p>So, are be being greedy to force users to 'rent' fonts to display on web pages when we can simply offer a specific buy once downloadable package for them to use on their own site as Ethan is doing with Font Squirrel?</p>
    <p>This seems to me as sort of a 'love or money' issue because folks are being opportunistic in their drive to sell rental services when in reality foundries can make the same money just plain selling fonts for web use . . .</p>
    <p>Perhaps the cost is directly related to the number of domains they wish to use the font on and there is no question some foundries may wish to only offer fonts on a rental rather own basis . . .</p>
    <p>I'm just putting it out there that nobody has had the guts to say selling fonts for print design use is no different than selling fonts for web display use so why couldn't people outright buy the right to do so?</p>
    <p>Thanks for your ear,<br>
    Stuart :D</p>
