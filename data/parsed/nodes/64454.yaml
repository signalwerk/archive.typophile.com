      <p><cite>…wouldn’t we make the same or more sales if we sold webfonts for $20-$30 per font per site?</cite></p>
      <p>That assumes users will be willing to pay roughly the same price that they would for a per-seat license with almost no restrictions on creating static content. I doubt that they will. I think that this is probably because designers, and even moreso their clients, have a really hard time wrapping their head around the difference between a font licensed for static content creating and a font licensed for dynamic content rasterization on multiple computers. They don’t even like buying more than one license for the entire business, even if they have 10,000 employees. So getting them to pay $30 per font for one web site that uses six fonts and will get completely redesigned in two years doesn’t seem likely to me. </p>
      <p>To me licensing each font for $5 or $10 a year, per-font, per-site seems like a better option. Or to do what Typotheque does; charging more for no limit on the number of sites/server a font can be used on but requiring clients to own their own licenses and charging for excessive bandwidth consumption.</p>
