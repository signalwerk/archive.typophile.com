      <p>Thanks for chiming in on this discussion Richard, I know you're following the webfonts thing very closely . . .</p>
      <p>Yes I'm a type designer selling my works at my own site fontdiner.com and selling collaborative works under the foundries Sideshow, Filmotype and Tart Workshop at fontbros.com, myfonts.com and veer.com</p>
      <p>While most discussions have been focused on the technology of webfonts, very few have been focused on the customer . . .</p>
      <p>Ultimately a license must be purchased as with desktop use or seat licenses and since there isn't an end user per se to license the works to, the only recipient of a webfont license IMHO could possibly be the owner of the website, even if it's spec'd out by a designer, the person who owns the URL ultimately is the buyer and beneficiary of this type of license. In my mind, given that, the license should be URL specific . . .</p>
      <p>Taking that further, getting back to the technology piece, yes, a font could be rented (Typekit) and yes, a font (all webfont assets) could be purchased or given away (Font Squirrel) for a one time fee . . .</p>
      <p>I personally agree with James that URL binding is an important piece of this puzzle because we don't want to DRM fonts, but we want to do what we can to assure they're being used in accordance with the license that is being sold for this use . . .</p>
      <p>And to Ethan's point, his preference is that the fonts are owned by the designer and they, like all current desktop users should be on the honesty system and can use them on any site under their control . . .</p>
      <p>The designer is an agent of the client and even if they license fonts on the clients behalf to do design work, even for web work, ultimately I don't feel you can license a font to a designer who can use the font for other projects and implement the same @ font-face kit for each client's site they work on which is why I think URL binding means the font is purchased PER project and PER client as it's needed . . .</p>
      <p>Beyond that, I don't think there is really much more to it . . .</p>
