      <p><cite>Or, rather, the ’belief’ that it’s extra protection. ;o)</cite></p>
      <p>Actually, it seems obvious to me that font subscriptions (e.g. Typekit) are better protection than WOFF. Typekit obfuscates font data in a number of ways, and although their techniques are well-understood and reversible (at least in theory), it looks like a greater deterrence than WOFF's wrapper.</p>
      <p>During the recent W3C web fonts meeting in Santa Clara, I was interested (but not surprised) to hear of impending WOFF support outside the browser, prompting me to wonder out loud if OS support was inevitable. One response was that Linux system support would happen. If/when OS support emerges, then we are that much closer to WOFF being the equivalent of any other desktop font -- and avoiding that is one of the main reasons for the web font format debate in the first place.</p>
