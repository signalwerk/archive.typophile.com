      <p>(I'm going to risk making Richard scream. Sorry, Richard. I can't think of a better word for it.)</p>
      <p>To me, the "rental" model (e.g., Typekit), is a desirable alternative to the "purchase" model we've had up until now. Whether it's viable remains to be seen, but I'm hopeful.</p>
      <p>When I tell non-type people that I make fonts, they always say something like, "So, does that mean you get paid whenever your font is used in an ad or a book or whatever?" When I tell them it doesn't work that way, that I get paid the same royalty whether my font is used in an ad seen by millions of people or a birthday party invitation seen by a dozen, they are surprised. I think a lot of people who "steal" fonts do so because they want to use them for personal projects and don't think it's fair that should they have to pay the same price for fonts as professional users.</p>
      <p>The reason the "purchase" model has been used is partly historical, going back to when fonts were only bought by typesetting shops. But it's also because there's been no practical way to measure how much a font is used. Can you imagine keeping track of your font usage and sending reports to foundries and paying licensing fees based on that? </p>
      <p>However, when you serve fonts on the web, you can put a meter on usage. This could (and should) lead to fairer pricing for font users. Plus, I think this is a model that is easier for users to understand because it's based on how much they use a font, not simply whether they have it on their computer or not. It puts font licenses on a sliding scale, instead of the current all or nothing situation. Musicians often make more from live performances than from CDs or MP3 sales. The "rental" model would, in effect, be like live performances for fonts.</p>
      <p>I don't think the "rental" model will replace the "purchase" model (it doesn't work at all for desktop fonts), but I think that, like markets for other goods and services, there is room for both. Not everyone chooses to buy movies on DVD. Most people are happy to rent. The "rental" model simply hasn't been an option for fonts.</p>
