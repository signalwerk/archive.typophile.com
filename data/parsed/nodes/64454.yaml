      <p>Think of the way a lot of site hosting is done. </p>
      <p>You can install a blog manager on your web server (which you're most likely renting) and deal with all the configuration and other stuff yourself (I do this with my own blog), or you can go with a hosted service like Blogger and let the service worry about that stuff. It's not like one is inherently better than the other, it just depends on what works best for your needs and how much you're willing or able to deal with the technical details. </p>
      <p>I think we'll see the same sort of thing with web fonts. </p>
      <p>Another thing to think about: Are you prepared to do technical support for users who can't figure out how to get your fonts working on their websites in different browsers?</p>
