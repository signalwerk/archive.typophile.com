      <p>I'm a little late to the discussion -- it's been a busy couple weeks for us. And I'm not sure there is a whole lot more I could add, especially considering Mark Simonson's excellent note about the rental business. Mark was one of the first designers we worked with at Typekit, and I always appreciate his openness and clarity.</p>
      <p>I guess my ultimate reaction is this: It's early. Very early. Browsers supporting font linking have only been in circulation for a matter of months. The most successful brands on the web have been around only a handful of years. Even the most seasoned web designer has a bit more than a decade of professional experience. How will this all come together? How will individual web site owners and giant corporations make use of webfonts? I can't begin to guess.</p>
      <p>One of the reasons we started working on the Typekit idea was to try a bunch of stuff and look for answers. Some of our customers like the idea of subscribing to a library of fonts and trying lots of alternatives in their designs. Other customers have commissioned fonts and are eager to finally use them online. And there's a whole group of our customers aren't even interested in choosing fonts -- they just want cooler looking blog templates.</p>
      <p>Which one of these methods will win? Probably no single one, or perhaps something we haven't even thought of yet. But it seems like now is the time to experiment and iterate, so that's what we're trying to do.</p>
