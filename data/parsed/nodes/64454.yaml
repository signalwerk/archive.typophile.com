      <p>I think a big issue web designers have is: "How do I sell my client on this extra font cost? I have no idea. Rather than have this conversation, I could use a free font or consult Aluminum's russian buddies." </p>
      <p>How to remove this fear:<br>
      Web designers know how to sell hosting to their clients. Make fonts part of the hosting bill and the fear is gone. Seems like it would make sense to offer embedded fonts right from the control panel, and bundle the billing in the hosting package. How big would the audience be if a typekit/typotheque style solution was offered Fantastico style? As a web designer I'm used to a fee-for-traffic solution. I expect it in that context. My clients all expect to pay $xxx monthly for web hosting, and if we go over our bandwidth, we pay. Just like a cell phone. Just like Peter's font hosting model. A great partner in this endeavor would be the web hosts themselves.</p>
