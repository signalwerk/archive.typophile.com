      <p>"For those in the know, what is the low, median, and high end of traffic volumes? Also, how would pricing slide accordingly? Compare that to the cost of ’cloud’ hosting for the same bandwidth . . ."</p>
      <p>This came up in a presentation of Kernest this past weekend.</p>
      <p>There are valid concerns with the outsourcing of hosting of files if you are a major bandwidth user. If your site is pulling enough traffic that it could bring down one of these services, that's not going to make you, nor the service very happy.</p>
      <p>However, a good counterpoint was brought up in that if you are running a site of that size, you already are likely outsourcing a lot of your file hosting...your jQuery is on Google, your images on are on CDN, your DBs are on a farm. Etc. So that perhaps isn't as critical of an issue as one may thing at first. Plus, if you're that big of a site, you would likely want to work directly with the foundry to license your own @font-face agreement to leverage the CDN you are already using.</p>
