      <p><cite>I think it’s only a matter of time before web designers and site owners take a pass on that…</cite></p>
      <p>I disagree. It’s not like font designers are the music or movie industries trying to get teenagers to pay for one license to subscribe to some music, another license to get the same music as a ringtone, another for their music games, etc. Fonts are serious tools for serious businesses. The cost of url-bound font license should be paid by the client just as the cost of server hosting, CMS systems, etc. For businesses shifting their ad budgets from print to digital the cost of font rentals is probably going to be irrelevant to executives who are patting themselves on the back for all the paper they aren’t buying anymore. And for a small business it’s probably an easier sell than buying an expensive new type family or two.</p>
      <p><cite>Further, I think it’s a double-standard…</cite></p>
      <p>So what? Like JFK said, life is not fair. Business is full of double standards. This is nothing compared to some of the corruption and kickbacks that go on in printing and ad buying. As long as there’s no dishonesty involved I don’t think it will be a problem.</p>
