      <p>@Thomas Phinney<br>
      TP&gt;it’s not a question for users, but for foundries.</p>
      <p>I'm sorry, Thomas, but this is upside-down thinking.<br>
      Starting with the premise of - what are <em>we</em> willing to do? what's best for <em>us</em>? what makes <em>us</em> "comfortable"? - and then hoping customers will go along doesn't usually have a happy ending.</p>
      <p>Do I have to go digging through back-issues of the Harvard Business Review and the Wall Street Journal to prove this case? I don't have to. All I have to do is wait until the results are in. (They may already be in, actually.)</p>
      <p>Try starting with - "What do web users seem to want? What's their reality? How do they see things? What's their normal expectations? What fits into their normal workflow?"<br>
      And then maybe you'll get somewhere.</p>
      <p>BTW - there is no rental model. Typekit, Typotheque, and Kernest don't rent in the common sense of the word. They are font-hosting and font-obfuscation services. Calling it a rental clouds the specifics. The "service" part of it and the "obfuscation" part of it might, in the long term, prove more significant and useful than the fonts themselves.</p>
      <p>Also, what constitutes the "volume" of the site?<br>
      And why should site owners see a connection between what it costs them to use a font and the "volume" of the site?<br>
      I certainly don't. I see a connection between the bandwidth expended by the services company on my behalf but that's about all.<br>
      Are you aware of any potential customers who see it differently?</p>
      <p>@all<br>
      To anyone's knowledge, has any formal market research been done about any of this?</p>
      <p>Respectfully, Rich</p>
