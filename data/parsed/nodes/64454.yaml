      <p>Hi Stuart!</p>
      <p>I am very interested in all models because neither type use, nor type users fall into a single web font box. Unfortunately, if I spend a lot of time on free fonts discussions, I'll be raising my prices. Nevertheless, I think this much is worth every penny. </p>
      <p>One primary concern of mine at the beginning of mass market DTP was to ensure that the bottom of the price market was well covered by free and very high quality fonts in the form of OS and application bundles. I think this was accomplished with the help of OS and app developers, and that same effort leaped to web fonts where some of the same bundled defaults have served the web for the last 15 years. </p>
      <p>One of my primary concerns <em>now</em>, at 'the beginning' of web fonts, is to establish the position of the bottom of the price market. So, I'd like to introduce you to the <a href="http://www.eeulaa.org/index.php?option=com_content&amp;view=article&amp;id=49:recommendations-data-fields&amp;catid=27:personalization&amp;Itemid=59" rel="nofollow">EPAR</a>, where the field is being leveled for all font developers by an openly published and developable table that will make it possible for non-commercial font folk to have an effective database of font information without developing the kinds of proprietary databases most commercial font developers have. </p>
      <p>I hope the "free font" and "f**k the foundries" activists take this new table very seriously, get involved in the final definition of this table, and then take full advantage of this table by working diligently to turn those heaps of unknown typographic quality into a much more useful heap, perhaps... putting FontSquirrel out of business, but I hope not. </p>
      <p>Cheers!</p>
