      <p>And not to sidetrack this discussion, but I think that this is another part of some other discussions that are going on about rights-managed type sales. I’ve been advocating rights managed type since I realized how hard it can be for design students to afford to buy contemporary type for their projects. In the last six months web font services have eliminated that problem for at one area of design. The same can be said for freelancers, small design firms, and their small business clients who want great type but are better off amortizing type costs across subscription fees. In the next year PLINC will be able to do something similar for display type used on physical mediums. </p>
      <p>The benefits of this seem pretty huge to me. Small design businesses are going to have access to oodles of fonts other than what they get with their copy of Type Odyssey. As font designers we get ripped off less and make more money by spreading lots of small transactions across people who would otherwise have just used another classic face on projects with tight budgets. I think that will translate to more cool new ideas because we don’t have to worry so much about people not buying really risky fonts that push the boundaries of form and technology but have to cost an arm and a leg with the existing, mostly royalty-free licenses.</p>
