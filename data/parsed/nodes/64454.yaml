      <p><cite>What do you mean by rights-managed type sales?</cite></p>
      <p>In the world of stock images there are two licensing models. Royalty-free stock means that once you’ve paid for the stock photos you can use them for just about anything short of pornography, in any quantity, without paying more. Rights-managed images are priced based on nature of use, quantity of reproduction, and how many years you plan to keep reproducing an image. If you just want to use a rights-managed photo on ten coffee cups you pay relatively little. For an annual report with a print run of 25,000 you pay more. And for a book cover with an initial print run of 250,000 that might be reprinted five times you pay through the nose. </p>
      <p>To me a rights-managed approach makes much more sense for type designers and users.</p>
