      <p>"How about the tens of thousands of businesses that license photography and illustrations this way and have been doing so for several decades?"</p>
      <p>I don't license photos on per-views of my web site. Granted, a lot of us used to pay for photography and illustration on a per-printed-piece model in the past. Some of us still do, though that pricing model seems to be taking up a smaller and smaller part of the market.</p>
      <p>So comparing fonts to commercial art works in that sense.</p>
