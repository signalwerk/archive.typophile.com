      <p>We license fonts for print use the way we do because there isn’t a better option. Trying to license fonts on some sort of per-use basis makes business much more complicated, and then means less time drawing letters, which is not something that interests a lot of type designers. But with the web it suddenly becomes much easier to work with a service that charges per-use in some way and cuts users off if they don’t pay. Catching infringers is infinitely easier because someone can just create a spider that looks for your fonts and automatically alerts a lawyer to send out a cease-and-desist-or-pay-me order.</p>
      <p>And font designers deserve the money. Users are buying this stuff because it allows them to make more money. Designers don’t usually go out of their way to sell their services at the lowest possible cost just because the clients would like that. Likewise, we should be looking for every angle to make a buck. I’m not in this because I want to be Saint James who helped spread literacy to the downtrodden with cheap type. I do it because I want my passion to pay for vacations in Provence.</p>
