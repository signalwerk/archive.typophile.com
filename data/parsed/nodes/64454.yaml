      <p>@Randy</p>
      <p>I don't we web developers/designers have any fear of this. We've been doing just fine without @font-face up to this point. We'd like it. We're going to use it when it makes sense (technically and legally), but we're not losing sleep over it either.</p>
      <p>I agree with the hosting part, though I think it's important to separate web designers/developers from web hosting options. Sometimes it's the same, very often, it is not.</p>
      <p>But the point about hosting being a service makes a lot of sense for both the consumer (web designer) and provider (font foundry) in a lot of situations. That's pretty much what Typekit and Kernest and the like are. They are font hosting services.</p>
