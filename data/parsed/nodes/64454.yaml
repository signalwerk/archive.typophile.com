      <p>Getting back to Mark and James comments, the thought is just because you CAN rent a font in the webosphere doesn't mean you should . . .</p>
      <p>I'm trying to reverse the case and say if we as font designers make a majority of our income via seat licenses at $20-$30 a font, wouldn't we make the same or more sales if we sold webfonts for $20-$30 per font per site?</p>
      <p>Another thought is that perhaps at checkout of a one time purchase when they enter the domain name, it scrapes an Alexa.com history of the domain and returns a traffic volume statistic that informs the price of the purchase or says we'll be in touch with a price via e-mail . . .</p>
      <p>Again, I'm not trying to advocate for fixed price webfont purchase so much as I am to say that it's an option worth exploring and nobody has really considered it when in fact offering webfonts at a fixed price is likely for many foundries to create an new sales channel for older works . . .</p>
