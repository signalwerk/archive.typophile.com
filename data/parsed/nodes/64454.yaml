      <p>&gt; Why Rent When You Can Own?</p>
      <p>Because it's equitable?</p>
      <p>Fonts licensed for desktop use have "the number of computers" as a natural quantum. It's fair, easy, scalable, and has endured for twenty years because it serves everyone equally well. News organizations license fonts for thousands of computers, small businesses license them for a couple, individuals for just one. The market has been very effective in determining prices (despite Ethan's cryptic comment above.)</p>
      <p>What hosted solutions offer is this same promise for the web, where "traffic" is the standard unit of measure. Hosting offers a reliable way to meet different levels of use, far more effectively and reliably than any kind of single-price (or tiered-price) solution. Surely we want to make it possible for everyone to use our fonts, not only major corporations but small businesses, non-profits, and individuals as well?</p>
