      <p>@diner</p>
      <p>You remind me of Nick Nolte's character in the movie Lorenzo's Oil. He keeps saying, "I'm just a simple man asking simple questions." And through asking his series of "simple" questions he saves his son's life by finding an effective treatment for a debilitating and ultimately fatal disease. A disease that, beyond a diagnosis, has the top medical people completely stumped.<br>
      It's a good model to follow. (Argh! I said it again!)<br>
      I'm actually a little stunned. What you're suggesting is an approach that the retail font folks have treated like the plague.</p>
      <p>But why don't you try it and see? If the fonts on diner are all under your control you could do a split run and see what happens. Start a new site that, on the same site, offers a choice between a web friendly presentation and the typical print oriented presentation.</p>
      <p>Excuse me for waxing philosophical but...<br>
      For awhile, right out of college, I sold a line of big ticket, luxury items. High-pressure sales that demanded you to be a hard closer. During orientation by the regional sales manager he told us something that I never forgot: You can say anything to a prospective customer as long as you say it with a smile. It's true. Whatever happened to asking nicely? And saying "Thanks for your order"?<br>
      Are these things considered old fashioned or unnecessary?<br>
      Recently I bought a font from a major font design studio and did not even receive a thank you email. Nothing. That's never happened before. Quite the opposite actually.<br>
      I bought a font from TypeCulture and not only got a thank you email but actually got a little something in the mail, too. I will very much remember where I was treated as a welcome customer and where I wasn't.<br>
      Whenever I get the feeling that a company feels like they're doing me a favor by selling me something, if it's not too late, I walk. And then, as long as I can help it, I won't be back. The reverse is true, too.</p>
      <p>If you were to organize your site the right way - font squirrel is certainly a good model but you'll probably want to make some changes to protect your fonts from casual download. And then create a friendly atmosphere and ask nicely and follow up appreciatively. Avoid an attitude of entitlement, apply some commonsense salesmanship, and I think you'll sell plenty.<br>
      What have you got to lose?</p>
      <p>Regards, rich</p>
