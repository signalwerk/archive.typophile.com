      <p><cite>"BTW - there is no rental model. Typekit, Typotheque, and Kernest don’t rent in the common sense of the word. They are font-hosting and font-obfuscation services."</cite></p>
      <p>Yes, it's a service. What they're renting is access, not the font files themselves. But the key point is that it's an ongoing payment instead of a one-shot up front. I agree that the obfuscation etcetera is a big part of *why* a hosted service makes sense... from the foundries' perspective. The customer couldn't care less.</p>
      <p><cite>TP&gt;it’s not a question for users, but for foundries.</cite></p>
      <p>"I’m sorry, Thomas, but this is upside-down thinking."<cite></cite></p>
      <p>Well, no. The reason it's a question for foundries is that today, users do not in fact have the option of buying for web font usage. They may very well want to, but foundries have generally been unwilling to go there (with the notable exception of Ascender).</p>
      <p><cite>Also, what constitutes the “volume” of the site?</cite></p>
      <p>There are many different ways one could measure it, and the folks renting or selling the font licenses can pick whichever suits them. TypeKit uses the bandwidth of font downloads.</p>
      <p><cite>"And why should site owners see a connection between what it costs them to use a font and the “volume” of the site?"</cite></p>
      <p>Why shouldn't they? If they're large they are paying for their bandwidth usage in other ways. Cloud computing services charge based on volume in various ways. And, what James said.  :)</p>
      <p>Of course the question of what will happen ultimately depends on *both* the buyer and the seller. I expect that we'll find that some users are willing to "rent" and that some are not. I expect that we will see both service and sales models that are successful. It's a big world out there, and I believe there's room for several vendors to make a go of it.</p>
      <p>Cheers,</p>
      <p>T</p>
