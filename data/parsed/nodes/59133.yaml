      <p>Last night I dreamed I was on my way to a party and realized I wasn't wearing small caps; so I selected myself, assigned the stylesheet, my parentheses shrunk down, and all was good. Maybe I should go out more.</p>
      <p>I'm quite convinced about this version now, which I'll run by the editor and publisher shortly: All references to names in small caps without full caps, references in short parens, other content in full-height parens. I think it works:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/parens_prefinal_5118.gif"></div><p></p>
      <p>…and it produced surprisingly few conflicts or awkward situations, too.<br>
      (The font looks nicer of course, this is a screenshot from InDesign.)</p>
      <p>Thanks again for all the fish, er, input!<br>
      (Randy, thanks also for pointing out Atma. Now that's an impressive array of caps :-&gt;)</p>
