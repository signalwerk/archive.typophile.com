      <p>I'm not too fond of the short parentheses followed by -- or following -- full caps. I also don't like full cap + small caps in general and agree that ideally the names of all cited authors should be set in small caps only.</p>
      <p>It seems to me that there's a parallel between capitalizing names such as "da Silva" and "van Beethoven" when starting sentences and setting names such as "LeDoux" in all small caps when citing them.</p>
