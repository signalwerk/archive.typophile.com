      <p><cite>"I was wondering if in Nina’s case there were just a few references, much repeated, then all small caps for the names might work"</cite><br>
      Hm, it differs from text to text. This is an anthology with, uh, 15 contributions, some of which are rather cluttered with references while others have only very few.</p>
      <p>Stupid question of the day: Is it "wrong" if I set them in SC every time, not just the first time they appear?<br>
      Rationale: If I set them in mixed case once they appear the second time, I lose the benefit of "pulling them away" from the running text (by means of small caps / short parens); I assume the reader will get used to the idea that small parens with all small caps contain references, and skip over them more easily if he (or she) isn't interested. So having all references, whether they appear for the first time or not, set in the same way seems logical to me, even if maybe it doesn't look so pretty… What do you think?</p>
      <p>I'm actually working on "streamlining" the small caps and parens right now.<br>
      Will be curious to do some test prints later and see if it's "too much".</p>
