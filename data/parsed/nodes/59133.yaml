      <p>I just don’t think there’s a need for these small-cap parens. Then again, I don’t think acronyms (not actually the case discussed here) need to be set in small caps, so I obviously hold contrarian views.</p>
      <p>I certainly think it’s open to dispute whether small-cap settings of proper names can actually go ahead without full caps where necessitated by the name. Hence, Semir Zeki, Ludwig van Beethoven, and Johnny iPhone need true-cap S, Z, L, B, J, and P. I’m not sure you can get away with using nothing but small caps (“all small caps” in OpenType jargon).</p>
      <p>—<br>
      Joe Clark<br>
      <a href="http://joeclark.org/" title="http://joeclark.org/">http://joeclark.org/</a></p>
