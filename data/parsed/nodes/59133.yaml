      <p>"Interesting: It looks like it might be possible to differentiate between parentheses for pure references (short ones), and comments that belong to the text (full-height ones)!"</p>
      <p>In fact, in the example above I've set everything included between the two quotation-parentheses - zeki, 1978 etc. - all in small caps, commas and parentheses included. I'm sure Whitman, like other quality fonts, was designed with a very strong attention to the details in every glyph, so why don't use those features when you have it?</p>
      <p>About the leading: my example text was set in 11/13, but I feel Whitman, like Adobe Garamond, tends to work better with a little less leading, in general - so that the text block looks "thicker". But it also depends on the line lenght of your page. If it can help in any way, sometimes I tried to reduce the leading from 13 to, say, 12,8, gaining one line per page and a much more thicker text block.</p>
      <p>By the way, Zeki rules. :-)</p>
