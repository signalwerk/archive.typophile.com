      <p>As I said, in the first example of Nina, I think the short parens are an advantage. Also I have set a situation with a lot of Biblical references, with the abbreviation in all small caps and the figures in text figures, and they definitely looked better that way rather than full parens. I think that in some situations they are a definite design plus. </p>
      <p>I was wondering if in Nina's case there were just a few references, much repeated, then all small caps for the names might work. But it is pushing it. Often, as Joe says, putting full names in all small caps is problematic, but I do think there are situations in which the short parens are very useful.</p>
