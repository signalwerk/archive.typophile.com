      <p>I agree that those small cap parentheses look very nice indeed, but I have a feeling they're intended for paragraphs or lines set only in small caps. To my eye, the short parenthesis looks worse next to a full cap than the full paranthesis does next to a small cap or text figure. And if the text has cascading parantheses, you may get into even more trouble. </p>
      <p>But yes, they look absolutely wonderful. By the way, have you found examples of historical use of small cap parantheses? Or are they a new invention?</p>
