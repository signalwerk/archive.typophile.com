    <p>Please excuse the uninformed question (I'll gladly be pointed somewhere if this was discussed before): I think I've never worked with a font before that had small cap parentheses, and now that the wonderful Whitman has presented them to me, I'm both thrilled, and not quite sure if/how best to use them.</p>
    <p>The book in question is a German sorta semi-scholarly nonfiction publication. I'm setting quoted researchers' names in SC, so together with OSFs the small cap parens seem to work quite nicely in situations like these:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/parens1_3973.gif"></div><br>
    …but I'm uncertain for parentheses that have a cap-initialled small cap name and a year:<br>
    <div class="imageWrap"><img src="http://typophile.com/files/parens2_6670.gif"></div><br>
    The small ones look nicer to my eye in the overall texture; but I wonder if that small cap parenthesis doesn't look a bit silly in front of the cap?<p></p>
    <p>Mostly I guess I'm worried I'll open up a can of worms because sometimes these "short" parentheses will be rather close to a parenthesis with more stuff in it that isn't in small caps, so I'll need the full-height ones there…<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/parens3_6143.gif"></div><br>
    Stuff like this makes me think I'll run into far less trouble if I just stick to the full-height ones. But the small ones look better. And what would one use them for, if not for stuff like this?<br>
    Can you tell I'm confused?<p></p>
