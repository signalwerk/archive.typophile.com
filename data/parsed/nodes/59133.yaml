      <p><cite>"I just don’t think there’s a need for these small-cap parens"</cite><br>
      Not a dire need. But wouldn't you agree they are a subtle enhancement?<br>
      If you're talking need/functionality and not "looking nice", I'd argue that's pretty much the same in this case: they stick out less, so there's less obstruction of the "flow" of the text, and less errant attraction of attention to details that don't carry that much (crucial) meaning. No?</p>
      <p>Re setting names in all small caps: Would you argue that in any circumstance/ application, proper names *need* (as in "depend on") the distinction between caps and lowercase? FWIW, my German I.D. card (of all things!) has my name in all caps. As do my credit card, my bank statement, etc. etc.… not to mention all the shop signs of this world that have the owners' names in all caps. &amp; that seems to work. (Note that I'm not saying it's necessarily good practice; but it seems to work.)</p>
      <p>BTW, I don't generally believe in thusly bells-and-whistles-laden typography. Sometimes I just set text in the Roman, maybe some emphasis here and there and let it be, and that seems ideal. Some texts (or more precisely: some *readers* of some genres of texts) just seem to need more help than others… to my understanding.</p>
