    html: |-
      <p>The style of the Arabic font to use will depend in large part on the type of document you are producing and its audience.</p>
      <p>Caslon Arabic, for all practical purposes, is not appropriate for a contemporary document. It was also not successful in its own time as well, due to its failure in capturing the natural spirit of Arabic Naskh writing of the period. Despite being a pioneering work in adapting Arabic to metal type, it can't be used nowadays.</p>
      <p>John Hudson is right, most Naskh fonts will be too dark when compared to most versions of Caslon, and that includes the font Karim he recommended. I have the font but was not able to typeset a text with it to compare to Caslon because it did not work in InDesign. Perhaps I need to check with Linotype to see if they have an updated version.</p>
      <p>I did however set a text for comparison using Arabic Typesetting, which has an excellent companion Latin designed by John Hudson, and believe that its color will work better than many Naskh fonts because it is already designed lighter in weight, and will be closer to the Latin font's color. As you can see in attached image, once you match the size of the Latin in Arabic Typesetting to Caslon, the size of the Arabic will be fairly compatible.  I included two TT letters at the bottom of the English text to demonstrate, one is Caslon, the other Arabic Typesetting.</p>
      <p>Line spacing will usually be more in Arabic compared with Latin text of the proper size, but if the two texts do not appear next each other and lines do not need to be the same, this should not be a problem. If the line spacing needs to be the same you may can adjust the leading so it is a little larger than usual in Latin, and perhaps a little tighter that usual in Arabic.</p>
      <p>document, <img src="/sites/default/files/old-images/Caslon_Arabic_test_3934.png"></p>
