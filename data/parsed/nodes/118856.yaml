      <p>Which version of Caslon are you using? Your instinct re. harmonising the overall colour of text is sound, although note that you may need to set the Arabic at a larger nominal point size than the Latin.</p>
      <p>A custom Arabic type would be a lovely idea, but if that's not reasonable given the budget, then I would go for something like Tim Holloway's <a href="http://www.linotype.com/898/karim-family.html">Karim</a> type, i.e. a fairly traditional neo-naskh style. However, you should check the weight, as it might be too dark for some versions of Caslon.</p>
