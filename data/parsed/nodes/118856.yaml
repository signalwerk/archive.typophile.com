    <p>Hello all,</p>
    <p>I am about to embark on designing a bilingual publication in English and Arabic. With the client we have been using Caslon for a couple of existing projects already however this is the first time that the project needs to be designed with arabic as well. Overall I am looking for an arabic typeface to match Caslon. From what I understand (I am an absolute novice at this) however this kind of matching is not necessarily always visual but more based on the specific cultural context of the arabic typeface is that correct?</p>
    <p>As a westerner not accustomed to using arabic typefaces at all I would be interested in an arabic typeface that would visually (at least in it's grayness / contrast) match the Caslon I am otherwise using but would be interested in any opinion or advice on the matter. </p>
    <p>William Caslon appears to have designed an arabic typeface as well - however I can't really discern what his interpretation was like in terms of readability and overall functionality as an arabic typeface - would anyone of you be familiar with any contemporary re-makes of his arabic type?</p>
    <p>I hope this questions are not in any way offensive to the visitors to this board - as I said I am very much a novice to this.</p>
    <p>Attached is the only image of Caslon's Arabic that appears to circulate the web...</p>
    <p>Thank you in advance for any reply.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/WilliamCaslon-EnglishArabic-1785 (1)_4017.png"></div><p></p>
