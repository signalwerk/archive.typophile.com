      <p>David, </p>
      <p>FontLab Studio 5.1.x is a free update to FLS 5. Nominally, there are no new features apart from some that "came in for free" (as they were already implemented). The vast amount of the effort (2-man-years) went into porting the code to Mac Intel. *Actual* new features will be included in FontLab Studio 6, which we're currently working on. </p>
      <p>Thanks!<br>
      Adam</p>
