      <p>Hello all, </p>
      <p>We have just made available a pre-release build 4447 of FontLab Studio 5.1.2 for Mac OS X. </p>
      <p>If you're a FLS for Mac user, please review the release notes, download that build and report your findings. Visit:<br>
      <a href="http://bit.ly/fls512mac4447" title="http://bit.ly/fls512mac4447">http://bit.ly/fls512mac4447</a><br>
      for download information and more details.</p>
      <p>Regards,<br>
      Adam Twardoch<br>
      Fontlab Ltd.</p>
      <p>(Ps. This new Typophile is slightly confusing to please bare with me.)</p>
