    html: <p>We're not going to get anywhere with Indy/Kernus until we stop treating as a mysterious black box which somehow may, or may not, do the right thing to spacing in some particular case, but instead, approach it as a bad program which generally does bad things in an entirely predictable way, no matter what its input. <br> <br>This is pretty easy to illustrate. Take the behaviour I illustrated in Adobe Garamond Pro. My objection is that it destroys the font by inserting unwanted  space between u and m in the word jumps at 12 points. This is wrong because in any normal font, the distance between u and m has been perfectly spaced. This is not conceivably a letter pair that under any normal circumstances needs spacing repair or additional kerning. To make matters worse, Indy/Kernus also subtracts space between j and u (again, a letter combination invariably perfectly spaced under all normal circumstances) thus entirely distorting the spacing of this most common word.  <br> <br>OK. So what do we do? Stop, for Heaven's sake, acting as if this were a one-off event. Instead, test this same letter combination with a wide variety of fonts. <br> <br>What I found at once is that for every serif font I tested at 12 points, Kernus/InDesign invariably subtracted space between j and u and added space between u and m. I tested Times, Georgia, Mrs Eaves, Mrs Eaves small and petite caps (slightly different), Palatino, Minion, Courier, Didot, and most illuminatingly, ITC Bodoni Ornaments. <br> <br>Now, instead of wasting our time looking at nono combinations in a particular font, let's look at a simple row of mmmmm and nnnn <br> <br>These are again rows that could not conceivably need alteration of any kind. <br> <br>Yet InDesign/Kernus invariably tampers with them. It generally adds positive space. For example, for both nn and mm, it adds 14 units in Minion at 12 points. (Is there anyone here who can convert this into PS font units? In any case, by any measure, this is a shocking alteration to the most fundamental spacing property of a font.) <br> <br>For Adobe Caslon by contrast it adds 4 to mm and 6 to nn. For Copperplate Gothic it subtracts 32 units.  <br> <br>I'm sorry folks, but this is a Frankenstein come to life.  <br> <br>This is not behaviour that can possibly be justified by any rational theory of typography or graphic design.  <br> <br>&gt;Finally, I would just note that Adobe bought, rather than licensed, the relevant patent and source code (when the original URW went bust, I think). I know that some further modifications were made, so calling it "Kernus" is not really quite accurate - though it's certainly descended from the Kernus technology. <br> <br>This gives the erroneous impression, Thomas, that Adobe initiated the relationship with URW. It did not. It inherited the relationship from Aldus, which licensed jack-in-the-box from URW for PageMaker 5. Not for the first time, I express the wish that you would get your Adobe corporate history right! Why should it be up to me to remember these ridiculous arcana?  <br> <br>Is anyone seriously going to tell me that a program which invariably tampers with the nnnn combination of ANY font can be defended on any grounds whatsoever?</p>
