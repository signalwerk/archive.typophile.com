    html: "<p>&gt; the \"metrics -18\" notation refers to the <br>&gt; spacing settings; my metrics minus 18 units <br> <br>Oh. I figured that was an en-dash. :-) Especially since you didn't state the intended usage size (while I know you know that's important). Tsk tsk tsk...  ;-) <br> <br>&gt; The intended size for that example is \"large\" <br> <br>Well, 18 is close to what I would call \"large\" myself. To me large is anything above 40 (this is based partly on the work of the Bentons, as well as the span of the fovea wrt [typical] viewing distance). <br> <br>The question (wrt my previous statements) becomes: is a global tracking adjustment adequate for bringing your 10/12 spacing to 18? I think considering the particular forms in \"jump\", it's probably fine. Which means my statements stand. <br> <br>&gt; Tracy's guidelines <br> <br>BTW, I think you're ascribing a degree of accuracy to his guidelines that they can't enjoy - and I don't think Tracy intended them to - he was a very \"eye is the final arbiter\" guy. Which I agree with to some extent, although I don't see it precluding a higher degree of \"method\" than what some people [like to] stop at. It's always easier to just eyeball - you just can't reach the pinnacle that way. <br> <br>-- <br> <br>&gt; So is gauging notan analytical or by feeling? <br> <br>I'm not sure. <br>But it's clear we're seeing (in the useful sense of the term) different things... The question reverts again to what [we think] users need/want; and how much we trust the senses/analysis of others versus our own. <br> <br>&gt; Random house: \"a patterned repetition of a <br>&gt; motif, formal element, etc., at regular or <br>&gt; irregular intervals [pe: can be of space] <br>&gt; in the same or a modified form.\" <br> <br>I think this is a non-productive definition (assuming your \"can be of space\" interjection), because it reverts to Pattern again; pattern and rhythm become interchangable. I think it's more productive to restrict rhythm to something that exists in a directed continuity (like time). That way you have two distinct, focused concepts/terms. The problem is our consciousness needs to take a cold shower. <br> <br>hhp</p>"
