    html: "<p><i>Dan, you're a Philistine ;-)</i> <br> <br>That's probably the nicest thing I have been called all year! <br> <br> <br><i>Ultimately, there is no such thing as a bad typeface, only inappropriate usage.</i> <br> <br>This is just a platitude. While there *may* not be such a thing as a bad typeface, there are certainly bad fonts. If I make a font and sell it to you, and it doesn't even function properly, then it is a bad font. No brilliant use on your part will be able to save it,* and chances are that brilliant use with such a poor quality tool would be highly unlikely.  <br> <br>So, I'm saying that there IS such a thing as a bad font: this is not a design issue, but rather a production one. <br>  <br> <br><i>Besides, I've yet to see conclusive proof of \"Optical\" fixing up the spacing of a \"bad\" font. Hrant thought it would be a piece of cake with Mrs Eaves, but it didn't turn out like that.</i> <br> <br>I don't have the depth to objectively evaluate InDesign's optical spacing feature, although I do use it occasionally, and have been pleased with its results. However, I didn't say that the InDesign feature was good, I said that if a manufacturer were to pull off something which really would improve poorly spaced fonts, that would be praiseworthy. I'm sure that many graphic designers and software users would agree with that. <br> <br> <br>*Even if you, with your excellent capabilities, could make good design with a bad font, that doesn't mean that the average user would be able to discover enough work-arounds.</p>"
