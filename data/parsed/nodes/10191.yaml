    html: <p><i>There is no rhythm in text type. Because there is no flow.</i> <br> <br>How many times do we have to have this conversation? How many times does it need to be explained to you that visual rhythm does not imply flow? How many times does this have to be demonstrated with diagrams? How many times does it have to be suggested that you are confused by notions of musical rhythm, which is temporal and hence sequential (flow)? How many times does it have to be explained that <i>visual</i> rhythm is not temporal, but immediate? How many times does it have to be explained that rhythm in type design is about the relationship of shapes to each other, and not descriptive of the reading process which we know is saccadic? How much clearer can we make it, than to repeat that the relationship of any shapes in a group can be more or less rhythmic, and that this doesn't imply anything about flow or, indeed, anything about the reading process at all? How often do we need to go over the same ground before it sinks in?</p>
