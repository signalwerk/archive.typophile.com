    html: "<p><i>(hey, I should run a Fourier analysis!)</i> <br> <br>I see I'm not the first one with this idea. Hrant just now <a href=\"http://www.typophile.com/forums/messages/30/69434.html?1113261551\">posted</a> a <a href=\"http://www.malgil.com/esl/aldus-fft/\">link</a> to someone who's done just that, starting from a page of Aldine italics. <br> <br>Anyway, here are Fourier transforms of the two 10-point settings above. First, mine, then Adobe optical kerning. <br> <br><img src=\"http://www.typophile.com/forums/messages/30/69458.png\" alt=\"FFT of Century Catalogue, my spacing\"> <br> <br><img src=\"http://www.typophile.com/forums/messages/30/69459.png\" alt=\"FFT of Century Catalogue, Adobe optical kerning\"> <br> <br>The ladderlike forms sorrounding the vertical line at the center represent the line spacing. The dark splotches to the left and right are the main stroke rhythm. I speculated that the peak would be harper in my version, more spread out in optical kerning. I think that is true, but the effect is very subtle: <br> <br><img src=\"http://www.typophile.com/forums/messages/30/69460.png\" alt=\"histograms of FFT\"> <br> <br>Interestingly, the peak of the main stem frequency is at a very slightly higher frequency in the optical kerning sample; perhaps that corresponds to Peter's perception of more darkness. <br> <br>This was interesting, but the differences between the FFT plots are subtle, and not easily accessible to interpretation, so I have yet to be sold on the general usefulness of the technique for understanding spacing.</p>"
    html_clean: "<p><i>(hey, I should run a Fourier analysis!)</i> <br> <br>I see I'm not the first one with this idea. Hrant just now <a href=\"http://www.typophile.com/forums/messages/30/69434.html?1113261551\">posted</a> a <a href=\"http://www.malgil.com/esl/aldus-fft/\">link</a> to someone who's done just that, starting from a page of Aldine italics. <br> <br>Anyway, here are Fourier transforms of the two 10-point settings above. First, mine, then Adobe optical kerning. <br> <br><img src=\"http://www.typophile.com/forums/messages/30/69458.png\" alt=\"FFT of Century Catalogue, my spacing\"> <br> <br><img src=\"http://www.typophile.com/forums/messages/30/69459.png\" alt=\"FFT of Century Catalogue, Adobe optical kerning\"> <br> <br>The ladderlike forms sorrounding the vertical line at the center represent the line spacing. The dark splotches to the left and right are the main stroke rhythm. I speculated that the peak would be harper in my version, more spread out in optical kerning. I think that is true, but the effect is very subtle: <br> <br><img src=\"http://www.typophile.com/forums/messages/30/69460.png\" alt=\"histograms of FFT\"> <br> <br>Interestingly, the peak of the main stem frequency is at a very slightly higher frequency in the optical kerning sample; perhaps that corresponds to Peter's perception of more darkness. <br> <br>This was interesting, but the differences between the FFT plots are subtle, and not easily accessible to interpretation, so I have yet to be sold on the general usefulness of the technique for understanding spacing.</p>"
