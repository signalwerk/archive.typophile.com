      <p>Thanks for your response, Bill. <br> <br>1. More master drawings does not always equal better. In fact, one of the things I find appealing about the ATF Bodoni series is its butter-smooth consistency across the entire size range. Bodoni is well suited to this consistency, while of course for a Garamond you have to make the counters smaller at bigger sizes and so on. <br> <br>What specific Mono and Lino fonts do you consider do be more technically skillful than the best of the ATF fonts? My Lino book is from the early '30s, and has some pretty good examples but nothing that really blows me away. I don't have enough Mono material to judge -- I've studied Centaur very carefully, but I certainly wouldn't consider it a better example of technical excellence than, say, Cloister. Among the refinements of the latter are variant short- and long-tail R's, fairly important in a Jensonian. Among the flaws is a very thin right side bearing for the 'e' in the 16pt size, and a fat one for the 'r'. (needless to say, the Centaur design itself is superior in many ways to Cloister, but that's as true of the Wiebking cuts as the Monotype) <br> <br>2. I don't see the same trend in Benton's 'o' spacing that you do. The 'o' space in his 1900 Century Expanded is much tighter than Benton/Whitehall (I'm looking at 10pt samples in the 1934 ATF book). What I <i>do</i> see is consistently generous 'o' spacing at text sizes, and consistently tight 'o' spacing in display. <br> <br>3/4. I chose AC solely because of the prominent serifs, and the noonn spacing solely because it draws attention to the philosophical underpinnings of spacing: are you spacing the stems and mostly ignoring the serifs (as recommended by Tracy), or are you mostly paying attention to the closest approach between the two letters (e.g. the serifs for the nn pair)? I am not at this point doing an exhaustive review of InDesign's kernus. Isn't that the job of, uh, writers in the trade press and industry consultants? <br> <br>6. You're conflating a whole bunch of different things here: design for optical scaling, linear interpolation, Multiple Master technology itself, and Adobe's use of it. MM is actually capable of many tricks other than straight linear scaling, but suffers from the same problem as Metafont: while powerful, you have to be a computer scientist to effectively use all the features. <br> <br>In any case, even though I am one, I don't plan on using MM as the basis for my optically scaled releases. Because I am stark raving mad, I am designing my own font technology from scratch. It bugs the hell out of me that I don't really grok spacing yet. <br> <br>And now, a fun challenge: <br> <br></p>
      <!--attachment: ccat-69201.pdf*mime_pdf.gif*application/pdf*28.4*Take+the+challenge%21*ccat%2epdf --><!--attachment: ccat-69201.pdf*mime_pdf.gif*application/pdf*28.4*Take+the+challenge%21*ccat%2epdf --><p></p><center><br>
      <table border="1">
      <tbody><tr>
      <td><img src="http://www.typophile.com/forums/icons/mime_pdf.gif" align="left" alt="application/pdf">Take the challenge!<br><a href="http://www.typophile.com/forums/messages/30/ccat-69201.pdf" target="_blank"><b>ccat.pdf</b></a> (28.4 k)</td>
      </tr>
      </tbody></table>
      <p></p></center><p></p>
      <!--/attachment--><!--/attachment--><p> <br> <br>Both columns are my Century Catalogue in 10 pts, and in one I've enabled InDesign's optical kerning (Kernus). Please print this out on a high quality printer, and post your answers to these questions: Which column is better? How much better? Why? Which one do you think is which is which? Why do you think so? I invite all typophiles to comment; among other things I want to find out whether most people see the same thing, or wether perception of spacing is hugely subjective. I'll post the answers and my thoughts in a bit.</p>
