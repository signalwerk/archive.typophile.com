    html: <p>Raph, although I agree with your approach to discerning correct optical values, that is, studying how ATF did it, I have several points of divergence. <br> <br>1. You are likely to see better examples of optical compensation in some Monotype and Linotype families because ATF fonts were often optically sized from a single master drawing using expert manipulations of the pantograph. Mac McGrew has been extremely informative on this point, though I don't think he has published everything he knows. I don't really think anything can beat the achievements of the Mono and Lino drawing offices _when they were at their best_. I would rashly and roughly place peak points as the late 20s for Mono and the mid 50s for Lino.  <br> <br>2. There has always been a distressing tendency amongst good designers and technicians to space o shapes too widely. Adobe Caslon is but one of a countless thousands of examples. By contrast, Benton, at the end and apotheosis of his career was spacing o's very tightly, as for example in his last completed typeface, Benton. This is the approach I prefer, but it is not a majority position.  <br> <br>3. Adobe Caslon is not a good example for setting at 72 points because it is explicitly designed not to be used about 14 points. (It would be interesting to see what Indy does to a variety of words with Big Caslon at 72 points.)  <br> <br>4. Confining the test only to no/on combinations does not begin to show the problems 'optical kerning' can get you into. Comparison should also be made at a variety of type sizes. It is not necessary to go to the trouble of illustrating every combination, since the curious can easily replicate the settings on their own computers. <br> <br>5. Adobe has never in the past been able to make a proper optically scaled font because of the corporate mandate to ensure that 72 point type is usable at 6 point, and vice versa. This idiot proofing of the product is understandable but should be dropped. Has it been dropped in the new Garamond? I doubt it. I've had it sitting on the shelf for months and I suppose I will now actually have to look at it.  <br> <br>6. An ideal optical axis is not achievable with simple interpolation as we know it. Perhaps with EvB's superpolation, but that's another story. That's a technology I have been meaning to explore for some time. In any case, the new Garamond is of course a multiple master, even though just a few instances are being sold in the OT version. But notably, it was designed as two entirely separate MMs, one for text sizes, and one for display. That said, I do not see how even the most expert manipulation of MM technology can produce an ideal scale in the 6-12 point range. It is for this reason that Stone does not use it in his Cycles series, which is the closest we come in digital to a series of types drawn with the same attention to size optimization as was routine before 1960.</p>
