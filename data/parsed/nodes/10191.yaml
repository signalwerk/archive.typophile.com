    html: "<p>On brain hemispheres: here's an <a href=\"http://coe.sdsu.edu/eet/Articles/brainhemisphere/index.htm\">accessible yet scientifically grounded</a> article. I'm personally a very unbalanced person; my ability to improvise is extremely weak compared with my logical and analytical reasoning. As such, I have a strong tendency to seek a deep theoretical understanding in areas where many would insist that \"if you gotta ask, you'll never know\" (<a href=\"http://afroamhistory.about.com/od/louisarmstrong/a/armstrongquotes.htm\">Loius Armstrong</a>). Will this imbalance prevent me from making beautiful fonts? Either way, it's my path to follow. <br> <br>In any case, I stand by my assertion that (good) spacing is hard. If it were easy, then everybody on this thread would be agreeing, and even amateur shareware fonts would be well spaced. The empirical evidence suggests otherwise. <br> <br>Hrant: no, the \"metrics -18\" notation refers to the spacing settings; my metrics minus 18 units (of 1000) between each pair. The intended size for that example is \"large\", but my metrics were very much tuned for 10/12 point setting. I am <i>not</i> claiming that the top line is better for display sizes; the \"mp\" plainly looks gappy. <br> <br>Hrant is of course correct in assuming that my metrics aren't based on mechanically making the spaces between the stems equal. Maybe the \"j\" could use a little more space on the right (if you're Peter or William), maybe a bit less (if you're Hrant). Tracy's guidelines side with the former camp; his 'j' right stroke space is the same as that of 'i'. <br> <br>Good luck with your Beirut talk! Your snideness is forgiven, just this once anyway.</p>"
