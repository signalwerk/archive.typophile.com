    html: "<p><i>Raph, what happens with perceptably terrible spacing? I mean, very irregular.</i> <br> <br>There ain't no such thing as irregular spacing, Peter, 'cause irregular ipso facto and all that implies regular, and regular is rhythmic. And you heard the man, there ain't no rhythm in text type: it's all a 'romantic product of our consciousness' and that ain't cool. Unless, of course, the man is wrong, and all the hepcats know what rhythm just means regular in its arrangements like. And sweet. <br> <br>[The device employed in this message is known in classical rhetoric as berlowia]</p>"
