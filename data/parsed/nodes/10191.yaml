    html: "<p>I don't know enough to say which is which. My own subjective view (taking cover): <br> <br>The left hand column is better. <br> <br>Only slightly better. <br> <br>This is based almost entirely on one letter combination \"ff\" which seems to me to be too widely spaced in the right hand column. An argument, I suppose, for ligatures. \"ff\" is a common combination and it bothers me perceptibly that it looks wrong. <br> <br>I think the right hand column spaces \"it\" too close (compare \"it\" and \"in\" on line 1); also perhaps \"ie\" and \"le\". To my eyes at least the left is more even on these particular combinations. <br> <br>On the other hand, the right hand column seems to me to get the \"he\" space in \"the\" better: in this case the left hand column seems to put excessive space between those two letters, so that \"the\" tends (fractionally) towards \"th e\". (Not helped, to my my eyes, by the \"t\" falling forwards.) <br> <br>But (except for the ff, IMHO), neither could be said to be bad.</p>"
