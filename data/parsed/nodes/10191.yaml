    html: "<p>&gt; One learns by doing, not by theorizing. <br> <br>One learns to refine existing norms by doing. <br>One uncovers future potential (ie marks progress) by theorizing. <br> <br>I study calligraphy to understand. Somewhat like insurance investigators study car crashes... <br>And one big reason I want to understand is for people to stop using it as an excuse against me, as a diversion for their own failings in the realm of progress/theory. By assimilating the practices that other people (in particular people who resist good theory) know, I can exert more effective pressure. <br> <br>-- <br> <br>Speaking of theory: <br>Raph, your theory about the relative balance of stems versus serifs in spacing (which is quite good - I'll be using it) fits very well with \"known\" theories about optical scale in general: that smaller features have more weight in proportion to size. Just like how serifs need to be stronger for smaller sizes. It makes sense that this applies to the White as well. <br> <br>Furthermore: The validity of this theory does not preclude InDesign from doing an \"adequate\" job for <i>both</i> text and display, but -depending on the algorithm- it could indeed mean it's better at one more than the other. If InDesign does not use \"feature weight\" in its calculations (and I would actually be surprised if it did - it seems quite difficult*), it makes great sense that it would indeed be better at display. <br> <br>* Too expensive to solve for this industry. <br> <br>Holding More Water All The Time.</p>"
