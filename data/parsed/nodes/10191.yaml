    date: 2005-04-08T22:08:00
    date_raw: 8 Apr 2005 — 10:08pm
    votes: null
    html: "<p>InDesign's optical kerning is definitely the one on the right. No question. One can tell because of the cases where letter features from adjacent letters almost touch on the left sample but have been spaced out on the right, like \"Wh\" and \"rn.\" <br> <br>Overall, I think I like your spacing better. But there are a few cases where I prefer InD's work. I'm curious: which treatment do people prefer for the e-apostophe-s combo in \"nature's\" on line 5? I think I like the way InD has tucked the \"s\" in nice and tight, but I can imagine this won't be to everybody's taste. <br> <br>Just a couple of comments on InDesign's optical kerning: <br> <br>1) Personally, I tend to use well-spaced fonts with decent kerning, and I only turn on optical kerning on the fly for specific problem combinations that were not kerned at all in the font. For example, the \"nT\" combo in OpenType frequently gives me trouble. Dang interCap words! <br> <br>2) Remember, it's just another feature. It's not on by default. You don't like it, you don't have to use it! Personally, I find there are some fonts whose overall spacing seems improved by turning it on, but they're generally not fonts I would use. <br> <br>Finally, I would just note that Adobe bought, rather than licensed, the relevant patent and source code (when the original URW went bust, I think). I know that some further modifications were made, so calling it \"Kernus\" is not really quite accurate - though it's certainly descended from the Kernus technology. <br> <br>Cheers, <br> <br>T</p>"
