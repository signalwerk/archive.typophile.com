    html: <p>&gt;One learns by doing, not by theorizing.  <br> <br>Making theory and practice a dichotomy is a fundamental mistake. Theory and practice should interact and correct each other. If theory were useless, science would be useless instead of conquering the world, as it has.  <br> <br>"There is nothing so practical as a good theory." - Kant <br> <br>That being said, in my view the state of theory in reading and typography is not very strong, so the main guide currently for practitioners has to be the eye and experience.</p>
