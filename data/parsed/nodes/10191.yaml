    html: <p>I don't think it makes much sense just to look at the numbers. You run the risk of making the same kind of mistakes that newbies often make by paying too much attention to the "side bearing" numbers in their font editor; you see way too little space to the right of the j all the time. <br> <br>Instead, I prefer to follow Peter's approach and concentrate on the visible features, in this case the gaps where the serifs visually connect letters together, and the blocks of space separating the vertical stems. <br> <br><img src="http://www.typophile.com/forums/messages/30/69294.png" alt="visual features of &quot;jump&quot;"> <br> <br>I've spaced this font according to Tracy's philosophy of making the space between stems even. For this word, the blocks of space are all rectangular, so are easy to quantify. With vee-shapes and rounds, you'd also get triangles and concave lens shapes. With perfectly even stem spacing, the blue blocks would all be square. <br> <br>Given the pattern of serifs at the top and bottom of the lowercase line, even stem spacing leads to very <i>uneven</i> gap sizes (visualized here as tan circles). In this example, medium, tiny, huge. Indeed, at display sizes the mp pair looks gappy. <br> <br>From what I can see, InDesign's optical kerning simply applies a different balance to the two visual features, making size of the gaps more consistent, at the expense of making the stem spacing more uneven. <br> <br>I propose that, at text sizes, stem spacing is more important, and that at display sizes, the gaps at closest approach are also important. Using existing tools conservatively, this suggests designing the metrics of fonts to optimize text sizes, while turning on InDesign's optical kerning for display. Of course, expert spacing by hand is always best, but in the cases where that's not practical, I think what InDesign does is useful. <br> <br>Of course, what I really want to do here is space the different optical sizes differently, according to the principle of varying relative importance of blocks of space and gaps at closest approach. But that's also clearly a lot more work; otherwise I think most font releases today would be optically scaled.</p>
