    html: "<p>Hrant, I asked: on what do you base your preference for the o.k. version? <br>You replied: I put my middle finger on the monitor port and feeeel the viiibes, maaan. <br>I ask myself: am I to take this as a hostile comment or a trivializing move? Should I see it as directed at myself, or Nick? <br> <br>Then you say: I use my gray matter to analyze the information from my sense of vision. <br>Should I read you as being sarcastic here? Or bitter? <br>I do not see how this helps me understand your preference for the second. Do you mean you think about what visual inspection yields? And is the thrust of this that others don't? Or am I to understand that in theory you prefer the o.k. concept because it address more adequately what the visual cortex's needs? And don't you need to show then that there is a mismatch between what the visual cortex needs and what our obsessions, if that is what they are, with colour or rhythm on a craft level lead us to strive for? <br>You have not shown there is a mismatch. If I am to trust your perceptions about a mismatch, I will need you to work things out at ths level. You say immersive reading is counterintuitive, but yet you use your intuition to elaborate your understanding of it. And if your intuition is superior, or better grounded, you have an ethical imperative that governs how you behave on line.  <br>I was asking for you to pinpoint specific things about the spacing of the o.k. version that could help me see what you see in the second 'jump'. <br> <br> <br>You say there is no rhythm, and I say this is like saying there is no God. I am more interested in understanding belief, or what 'range of convenience' a word like rhythm can have 'vis a vis' type than I am in outlawing it. Perhaps you do not find it useful. Others do. And it helps them do good work. So I want to see how the concept of rhythm or colour works itself out in the details of construction, contrast manipulation and space craft. And not just for writing with prefabricated letters, but all writing.</p>"
