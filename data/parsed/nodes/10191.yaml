    html: "<p>\"can't be all feeling,... \" <br>\"in particular spacing need[s] to be quite analytical.\" <br> <br>\"good notan ( [=] balance/tension among the White/Black) <br>\"I squint, move back &amp; forth (like those charmed snakes),  <br>and try to see holes &amp; clots\" <br> <br>(I'd bet we all do the squinting / seeing holes and clots thing.) <br> <br>So is gauging notan analytical or by feeling? <br>I think the squinting and moving / seeing holes and clots is the 'analytical' end of your practice, but in doing this you 'feel' tensivities / equivalencies or balance /[and yes] rhythms. <br> <br>Random house: \"a patterned repetition of a motif, formal element, etc., at regular or irregular intervals [pe: can be of space] in the same or a modified form.\"  <br> <br>I don't see how putting space in the 'um' of 'jump' brings the o.k. version into notan; it just destroys the visual integrity of the wordform by making the 'ju' bond and the 'mp' bond strong and weakening the 'um' bond disproportionately. Your proposals for the metric version have the same effect. Pushing this any farther leads to visual_wordfrom_resolutional response_bias collapse. <br> <br>William: \"the state of theory in reading and typography is not very strong.\"  <br>Exactly, so let's do what's necessary to strengthen it.</p>"
