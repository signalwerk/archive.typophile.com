e used for body text. <br> <br>It amazes me that spacing is so hard. After all, it's just a handful of numbers. Yet, we often find that people who draw beautiful letter shapes stumble over the problems of spacing (Mrs. Eaves is a commonly cited, and dramatic, example). I wonder to what extent it's possible to understand spacing systematically, or whether it will always remain a black art, with all but the most talented and experienced masters doomed to forever crank out poorly fitted fonts.</p>"
