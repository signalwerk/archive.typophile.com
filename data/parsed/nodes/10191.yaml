    votes: null
    html: "<p>&gt;If you actually do want fauve spacing for some reason, that's a different story.  <br> <br>\"Wild beast spacing\"? I would say that prefering the original spacing paradigm for metal era fonts is more like a preference for \"original instruments\" in listening to Baroque music. In terms of glyph finish, Storm's work is along the same lines with his funky versions of the classics. <br> <br>\"hedging\" <br> <br>No way, dude.  <br> <br>&gt;e-apostophe-s combo <br> <br>IMO, the tighter fit of Optical looks better here, but the reason is that Raph's space character is quite narrow. In general, the appearance of \"apostrophization\"  should be related to word spacing. When I first started kerning fonts, I tended to overdo it, and the apostrophe is one instance where that's easy to do. However, more recently, I've come to appreciate that there are certain glyphs where ample sidebearings are part of the character -- the apostrophe and the figure 1 being the most obvious. In fact, getting really precise, it may be a good idea to have separate glyphs (although the BCPs could be identical), differently fitted, for the apostrophe and single quote. And of course, with OpenType, that's possible! Christopher Slye or Adam Twardoch (Zapfino Extra) have probably already done it.  <br> <br>Are the apostrophe and the quotemark separate Unicode characters? <br> <br>&gt;Just a couple of comments on InDesign's optical kerning <br> <br>I agree with you completely Thomas. But I woud add that I am critical of \"Optical\" spacing for two reasons:  <br> <br>(1) The myth of poorly spaced indie fonts. It's tempting for many people to think that there is a technological fix for the amateurishness of fonts from \"boutique\" foundries. That's the myth. The reality is that the virtues of \"Optical\" technology are quite modest, and that spacing is an aesthetic and cultural quality of types which shouldn't be given the \"one size fits all\" treatment. Many Indie foundries do brilliant spacing. Some may do \"dodgy\" spacing, but it is nonetheless a quality of their work, which should not be quantified and eradicated by a megacorp bot. <br> <br>(2) By engaging in critical discussion of Optical, we gain a better understanding of the threshold between what is appropriate for automation, and what still requires manual work. While I am aware of the benefits (and inevitability) of progress, I favor a balanced approach somewhere between \"the old way was best\" and \"let's automate everything\".</p>"
