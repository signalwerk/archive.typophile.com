    html: "<p>About Raph's challenge: <br> <br>Mostly what I see, I see at a glance. There is a perceptible distance on what I called in Typo 13 the 'gestural-atmospheric' axis. The text on the left is more even and regular and quietier, the one on the right more assertive and active and generally a tad darker, but having said that, I have to say the distances between them are quite slight. I cannot say the one is right, the other wrong, or the one is good the other bad. <br>Both are readable on my screen. Readability and legibility are, I am coming to believe, gross measures. Legibility of type is a matter of thresholds (perceptual discrimination affordances at a distance, or small size or in inferior lighting); Readability of a type-in-use a matter of degrees (visual wordform resolutional affordances, which seem to be quite generous). Spacing and rendering are matters of tolerences. Beyond a certain point (and the allowances might be quite sensitive) space manipulation alters the gestural-atmospheric consistency or character of the typeface.  <br>Does optical spacing cause that kind of shift? and if so, do we prefer the gestural-atmospheric 'attack' of the altered protocol?  <br>For the purpose of continuous reading both spacing implementations seem tolerable. On closer inspection the column on the left shows a level of refinement the one on the right doesn't have. I see this in the 'Wh' combination of the opening word, and the decision about where to break the line in line 9&amp;10 of the second paragraph. However, the spacing of powers' at the end of line 3 seems worse. So how to fix (with optical kerning) the \"Wh\" of the second without touching 'power' if we want it's gestural-atmospheric mood? <br>Which 'attack' would I prefer? Depends on the character of the text I am setting, and the medium (newspaper / book / magazine / etc).</p>"
