    html: "<p>First, a couple of errata. In the \"noonn\" graphic, the values for the \"optical +17\" line should be (-14, 0, -16, 6). This actually changes my evaluation of InDesigns optical kerning somewhat; it is sensitive to scale, but in this example only microscopically. These values vary by only 2 units (out of 1000) from the 12pt optical setting. <br> <br>Second, in comparing ATF Cloister with Monotype metal Centaur, I want to make clear that the fit flaws I described are in the latter; in my post 236, that was very unclear. <br> <br>You guys are good! The column on the right is indeed InDesign's optical kerning (and thanks, Thomas, for pointing out that it isn't quite correct to simply call it \"Kernus\"). On the left is my own attempt to space the font. In fact, it's my third from-scratch stab. This time, I tried really hard to get the side bearings right, then kern with a very light touch. In particular, I made it a point not to kern round-round or serif-round combinations. <br> <br>I find it fascinating that there isn't unity on which is better (or maybe Hrant is just the outlier whose judgement should not be trusted). Even Paul Stanley's preference for my spacing is suspect, because the lack of the 'ff' ligature is a bug in the font that will get corrected before release. <br> <br>My spacing could no doubt be improved. In fact, I now consider a comparison against InDesign's optical kerning an important tool in discovering places where spacing can be improved. <br> <br>The word \"powers\" is definitely spaced more like a metal face (optical kerning hairline spaces po and kerns owe quite a bit). Because this is a historical revival, I'm not sure that's a bad thing, but InD's optical is also absolutely a valid stylistic choice. I cannot agree, though, for cases such as \"liberty\", which to my eyes has \"ib\" too tight and \"rty\" far too loose. <br> <br>It's interesting that Peter perceives InDesign's optical kerning as \"darker\". I fiddled with the tracking values (+3 for my sample, -2 for InDesign) so that they'd take exactly the same amount of total width. To my eyes, there isn't a significant difference in color, so I wonder if this is something that other people see as well. <br> <br>If you look at just the stems, my sample is far more even (look at \"institute\", line 15, for a striking example). Here is a fundamental question: is InD's variation in stem spacing signal, or noise? In the frequency analogy, my stems form a stable carrier frequency, with features such as arches added on, while the more varied stem spacing of InD is like frequency modulation of that carrier wave; it will occupy a broader peak of spatial frequencies. (hey, I should run a Fourier analysis!) <br> <br>You can also look at the spacing, in terms of the \"features\" concept of Peter's Typo 13 essay. In particular, I space the rvwy class tightly, much more so than InDesign. So, in my spacing of \"ty\", these two letters visually connect (they're not quite touching, but presumably the gap is so narrow that it wouldn't be seen in the parafovea), while in InDesign the gap between them would count as a visual feature. From a readability standpoint, which feature is better, connection or gap? Are they both functionally useful for recognizing the \"ty\" pair, perhaps, so the choice is merely aesthetic? <br> <br>For pairs such as \"vi\", I strongly prefer my spacing, because it avoids creating a large triangular gap. This is especially so for a word such as \"evinces\" (4th line from bottom), where the large gap contrasts with the relatively tight ev and nc spaces. (this effect is even worse for the yp pair, as can be seen in one of the nonsense words) <br> <br>Even so, I'd have to agree with Paul that InDesign's optical kerning isn't <i>bad.</i> In many cases, such as a poorly spaced text font, or if you have Hrant's eyes, it would definitely be an improvement. So I think we can put to rest any assertion that optical kerning should not be used for body text. <br> <br>It amazes me that spacing is so hard. After all, it's just a handful of numbers. Yet, we often find that people who draw beautiful letter shapes stumble over the problems of spacing (Mrs. Eaves is a commonly cited, and dramatic, example). I wonder to what extent it's possible to understand spacing systematically, or whether it will always remain a black art, with all but the most talented and experienced masters doomed to forever crank out poorly fitted fonts.</p>"
