    html: <p>Pardon me Hrant, if I implied that your designs lack grace. Like everyone, you use the left side of the brain when you draw, write and design, thereby thinking with the hand. I studied calligraphy as a practical discipline because it was interesting, enjoyable, and because I thought it might give me a better "feel" for letter forms -- as an adjunct to more academic study. I'm assuming you have some of the same motivation, despite the premium you place on intellectual theory</p>
