    html: "<p>Nick, I actually do think my forms are not very graceful, but they do have \"feeling\" - I'm human too after all. But type design can't be <i>all</i> feeling, and some aspects of it -in particular spacing- need to be quite analytical. <br> <br>Peter, that thing was directed at Nick's \"it has to be felt\". And not really hostile, more like snide. <br> <br>To [try to] elaborate more (on the phrase right after that), I would say that I look for good notan (balance/tension among the White/Black), which however depends on intended point size (and I've been assuming that's what the \"18\" is in Raph's illustration). I squint, move back &amp; forth (like those charmed snakes), and try to see holes &amp; clots. BTW, are you guys squinting (adequately) when you gauge spacing? <br> <br>&gt; And is the thrust of this that others don't? <br> <br>I don't know what others are doing. We're each born with slightly different eyes, and of course quite different objectives. The trick is to guess what <i>users</i> want/need. <br> <br>&gt; You say immersive reading is counterintuitive <br> <br>To the layman. By looking and thinking, a person can still unlearn one's intuition (because it's not infallible). For example how point sizes that <i>seem</i> most easy to read are in fact a bit too large. But I certaily can't \"proove\" the validity of my opinions - which however shouldn't stop me from thinking and acting. And each of us has to constantly and dynamically draw a line concerning who to believe about what; based on the aggregate of what somebody has learned about us, a person could choose to believe John, or me; it's the decisions we each [have to] take. <br> <br>Specfics: for 18 point, I think the top one needs adjustment for each of the three pairs(\"ju\" a hair tighter, \"um\" a hair looser, and \"mp\" a bit tighter), while the bottom one just needs the \"um\" a hair looser. (BTW, I can't quantify \"hair\" and \"a bit\", but I can tell you that the latter is more.) <br> <br>&gt; You say there is no rhythm, and I say <br>&gt; this is like saying there is no God. <br> <br>I don't think so. I think it's more of a terminological confusion caused by the romance of the consciousness (which forgets we're animals). The reason there's no rhythm is quite simple, mechanical even: to me (and I think dictionaries agree) rhythm is a pattern in a flow. But there is no flow in reading (except at the level of linebreaks, but that's far removed from letterform notan), so there is no rhythm. There <i>is</i> Pattern - let's please use that instead, no matter how unromantic it is. <br> <br>&gt; prefabricated letters <br> <br>I think this is also a misleading (or at least archaic) term. <br>Please read my \"reply\" in Typography Papers 4. <br> <br>-- <br> <br>BTW, I'm supposed to finish getting ready for my Beirut talk, so if I become silent it's not a slight or a mark of detachment. <br> <br>hhp</p>"
