    html: <p>An alternative to taping small coins under setsquares etc would be to find the small self-adhesive cork pads that some shops sell to stick under plates etc to stop them scratching polished furniture. These pads are thinner than coins, so will raise your drawing edges just enough to stop ink leaking under them, but not so much that you lose accuracy. <br> <br>And, if you can find them (they are long discontinued, but you can still come across them in suburban art materials shops), Graphos pens are better for drawing freehand than Rapidographs - there's a huge range of Graphos nibs, and it's well worth stocking up with them if you find a shop that still has any; I've got stocks that I bought for pennies (as the shop owners were basically glad to find someone mad enough to want this 'old' technology) that will probably last me until the day I die (or get too blind to draw any more).</p>
