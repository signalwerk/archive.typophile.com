    <p>Hello everyone,<br>
    I am new here, and this is my first post on Typophile.</p>
    <p>I am a student of Graphic Design at the National Institute of design, Ahmedabad, currently in the second year. We are having an ongoing course in typography and for an assignment we are supposed to research and study different typefaces and their designers. The typeface that I have chosen to conduct the research is Myriad Pro. Though I have found quite some information on the web but I was hoping if anybody could add to my research by providing some useful information about the design process, history and other interesting nuances or stories which are not published - or - hard to find online because this is a dedicated forum for type design and typography. </p>
    <p>Any kind of help and inputs would be greatly appreciated.<br>
    Thanks, Manushi</p>
