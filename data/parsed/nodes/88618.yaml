      <p>AFAIK it's the only font that Slimbach has made that has trapping*.<br>
      I've heard from a few sources that he doesn't believe they're useful.<br>
      And since Twombly's first famous font (Mirarae**) has some juicy<br>
      trapping, I suspect she had to put her foot down to get trapping<br>
      included in Myriad. And if it's true that the two didn't get along,<br>
      I'm sure that didn't help.</p>
      <p>* <a href="http://themicrofoundry.com/ss_trapping1.html" title="http://themicrofoundry.com/ss_trapping1.html">http://themicrofoundry.com/ss_trapping1.html</a></p>
      <p>** <a href="http://new.myfonts.com/fonts/bitstream/mirarae/" title="http://new.myfonts.com/fonts/bitstream/mirarae/">http://new.myfonts.com/fonts/bitstream/mirarae/</a></p>
      <p>hhp</p>
