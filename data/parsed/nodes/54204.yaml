    <p>Hi,<br>
    You may remember that you guys helped me design the "Dorsol Plants for Seattle City Council" logo a few weeks ago. </p>
    <p>I just posted the website yesterday. It shows the final version the candidate and his campaign manager approved. I think the white and shades of green look good set into the earthy color scheme.<br>
    <a href="http://dorsolplants.com" rel="nofollow"><strong>Dorsol Plants website</strong></a></p>
    <p>Here is the website of one of young Mr. Plants' opponents:<br>
    <a href="http://www.bloomforcouncil.com/meet_david_bloom.html" rel="nofollow"><strong>other candidate</strong></a></p>
    <p>Mr Bloom has a long resume, but the graphic design kind of sucks, don't you think? He doesn't even have a proper logo, just the title set in Gill Sans. The welcome page isn't pleasant to look at...but maybe that's just me. </p>
    <p>Thoughts?</p>
    <p>Dina</p>
