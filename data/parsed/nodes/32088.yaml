      <p>Don’t feel squeamish about changing the lettershapes. This situation of yours is a classic reason for custom ’lettering’. One way to escape from the font’s forms would be to print out &amp; hand draw over the forms to get them to sit nicely together. Or make outlines &amp; do it digitally. Whichever gives you the freedom you need. Or indeed both. You might want to look at Mark Simonson’s lettering too.</p>
      <p><a href="https://web.archive.org/web/20080829233654/http://www.ms-studio.com/letteringdesign.html" title="http://www.ms-studio.com/letteringdesign.html">http://www.ms-studio.com/letteringdesign.html</a></p>
