      <p>Andrew, my copy of LFLB is at the office, so excuse me if I duplicate advice already offered therein. Putting text on a curve messes royally with the inter-character spacing, so you’ll <em>always</em> need to kern and respace to achieve even typographic colour right around the curve. Word spacing should almost always be closed up for the same reason.</p>
      <p>I always found it safer to a) do this on a copy of the setting in case I mess it up and have to revert to the original, and quicker to b) get the spacing done satisfactorily before any ’convert to paths’ operation.</p>
      <p>In a lot of cases where the text runs around a complete circle in an ’over and under’ fashion, it can help to place punctuating dingbats, flowers or bullets symmetrically (say at at 9 o’clock and 3 o’clock) – again to fill gaps and achieve even colour.</p>
      <p>Printing a proof and examining it upside down from a distance is a quick way to check for spottiness and bad spacing. </p>
      <p>Leslie talks quite a lot about making the baselines and foot serifs of the type follow the curve, which is easily done after the ’convert to paths’ operation. You’ll need to work with duplicates of the original circle (in the original position relative to the type outlines) and the pathfinder function.</p>
