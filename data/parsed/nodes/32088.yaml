    <p>I’m looking at the Leslie Carbarga book, “Logo, Fonts, and Lettering Bible” which has a great feature on tweaking text on a curve. </p>
    <p>I’m curious if anyone has any other insight into the process of text on a curve. I’m working on a packaging label that will be set in a circle and could use some tips. Leslie of course is a master so, some of his steps seem to miss that extra novice detail.</p>
