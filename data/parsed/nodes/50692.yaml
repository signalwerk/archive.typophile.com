    html: <p>i would grab some primers, either for child learners or for students for whom these might be second languages. I have some great textbooks for Russian, but I’m sure one could find these in a decent sized library for the languages for which you are seeking. i tried to look at primers to find regional preferences for languages that use Devanagari script and found these to be useful resources when i could find them.</p>
