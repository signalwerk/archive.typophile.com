      <p>Hi Richard,</p>
      <p><cite>some character formations are unique to different languages and countries</cite></p>
      <p>that’s quite the topic I am exploring in my Manuscribe project. It’s about researching international school scripts and the ‘dialects’ of handwriting – I held <a href="http://florian.hardwig.com/manuscribe/index.html#atypi-2007">a presentation at last year’s ATypI</a> about it.<br>
      For my master’s thesis, I focussed on Latin script only. However, I do have some copybook samples and the like in other scripts aswell, Cyrillic at least.</p>
      <p><cite>if anyone has compiled a “localized pre-school” alphabet chart?</cite><br>
      Yes, there is a <a href="http://flickr.com/photos/hardwig/1359668869/in/photostream/">poster</a> – Latin only. Ken Barber made use of it while doing research for the <a href="http://www.houseind.com/index.php?page=showfont&amp;id=665&amp;subpage=studio_how_lang">culture-specific character sets</a> in his Studio Lettering fonts.</p>
      <p>You can contact me via <em>forename</em>@<em>surname</em>.com</p>
      <p>Florian</p>
