  - id: 307240
    user: 7006
    date: 2008-10-20T06:43:00
    date_raw: 20.Oct.2008 6.43am
    votes: null
    html: <p>Additionally, it may be hard to find certain models for letter drawing techniques. When i was learning Russian, we only ever did script writing excercises and were never formally taught to write in block letters, i’m guessing this would be similar to the experience of most young students learning to write in countries which use the cyrillic alphabet. Anything I might say about Arabic would be mostly guess work, but I would think that teaching of the relation between initial/medial/final forms would be an important aspect in teaching the basics of the script to new learners.</p>
    html_clean: <p>Additionally, it may be hard to find certain models for letter drawing techniques. When i was learning Russian, we only ever did script writing excercises and were never formally taught to write in block letters, i’m guessing this would be similar to the experience of most young students learning to write in countries which use the cyrillic alphabet. Anything I might say about Arabic would be mostly guess work, but I would think that teaching of the relation between initial/medial/final forms would be an important aspect in teaching the basics of the script to new learners.</p>
