      <blockquote><p>The typeface he chose was Fournier, a French face, and I would imagine that there was some discussion about its foreign quote marks</p></blockquote>
      <p>Nick — Forgive me, but there’s something about this anecdote that strikes me as slightly incredible. Do you mean to say that four years on after the original release of the Fournier revival in 1925 by the English Monotype company, they still had not furnished the fonts with conventional English quotation marks? Or perhaps just not for the American market? I sincerely doubt they would have been that purist and impractical.</p>
      <p>In fact, the sample of Monotype Fournier that is tipped in to <em>The Fleuron</em> No. V  (1926) has a passage with perfectly ordinary English quotation marks.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/FleuronV-FournierSample_580_6644.jpg"></div><p></p>
      <p>Perhaps the Lakeside Press had only an original font cast by Fournier himself with which to hand-set Rockwell Kent’s book? Yeah, right. </p>
      <p>No, I suspect those guillemets in <cite>N by E</cite> are a particular Kentian affectation.</p>
