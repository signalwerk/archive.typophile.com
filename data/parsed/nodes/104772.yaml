      <p>I think i disagree — the more glyph shapes, the more archaic, the less glyph shapes, the less archaic. At least that is what the global public thinks. </p>
      <p>But first, I have been reading English now for a while, and never ever had difficulty with the complex use of ', for the 11 things it is used for, with more use in the depths of typewriter quality.</p>
      <p>Beside that though, the central factor that drove England to differences, is economy, we just followed. Take no accents, ? and ! only at the end, use the fewest letters, (we on this side of the pond didn't even want W). That no English wanted a new glyph just for quotes in the mid-19th century is hardly surprising to economic theory. </p>
      <p>I'm agreeing that English-speaking countries had the least politically centralized control over publishing; but that a common adherence to a dwindling shape repertoire thrived none-the-less, I think can only be explained by the desire for more, faster, from less, and not a failure to grasp significant novelty. </p>
      <p>Remember, also at the time of this historic quote split, Englishmen were going binary in thought ahead of the world... Curtis had his ideas and then discovered the <em>I Ching</em>, Boole (of the Booleans), followed and published, essentially anticipating something that could understand just two characters. </p>
      <p>Don't seem archaic to me.</p>
