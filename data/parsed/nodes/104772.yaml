      <blockquote><p>Makes sense, but on the other hand when a culture addresses a failing late, it's more likely to copy another culture's solution, because the more recent it is the more likely a culture is exposed to others. </p></blockquote>
      <p>That may have some truth when there is an established solution to be adopted. But my whole point is that by the time you have the rival national printing centers of the 1600s, each backed by either royal or religious authority, there still was no established convention for quotation marks to be borrowed or adopted. </p>
      <p>At the same time, the different customs did not develop in isolation, and I don’t think it’s hard to imagine some common ancestral proto-quotation attempts from which the different national styles evolved — perhaps with one eye on the others and one eye on what each thought was the better solution.</p>
      <p>With multiple solutions evolving more or less simultaneously within strong, rival traditions, you end up with several surviving, parallel conventions. Unlike more basic punctuation marks which were formalized earlier within a more-or-less single dominant tradition.</p>
      <p>That’s my hypothesis anyway.</p>
      <p>BTW, all you grad students, this would be an interesting thesis project: to trace the emergence and divergence of the different conventions for quotation marks — researching original manuscripts and primary sources to identify proto styles and early examples of the emerging norms in the different traditions.</p>
