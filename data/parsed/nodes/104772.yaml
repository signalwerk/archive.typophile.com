      <p>In&nbsp; <a href="http://www.lexpress.fr/culture/deux-points-et-guillemets-le-proces-verbal_779087.html" rel="nofollow"><strong>Deux-points et guillemets : le " procès-verbal "</strong></a>, <a href="http://communaute.lexpress.fr/journaliste/pedro-uribe-echeverria" rel="nofollow"><strong>Pedro Uribe Echeverria</strong></a> (L'Express), publié le 07/08/2009 à 10:27*</p>
      <p>Echeverria gives this picture of various shapes from 1529 to 1897:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/ponctuation-1_189_6471.jpg"></div><br>
      He says that the history of the guillemet goes back much earlier than the sixteenth century and relates it to the <em>diplé</em> that was in use in medieval manuscripts for citations; here is an example&nbsp; he found dating from the fifth-sixth century.<p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/diple-5e-siecle_457_5169.jpg"></div><br>
      He also mentions that in 1857 Baudelaire expressed his dislike for the comma-shaped quotation marks his editor intended to use for his <em>Les fleurs du mal</em> and that the editor finally used rounded parentheses-shaped guillemets.<p></p>
