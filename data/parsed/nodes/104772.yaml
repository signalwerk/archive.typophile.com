      <p>I have found that the idea of using diacritics to quote is very old. Isidore of Seville (6th c.) mentions more than twenty forms of quotation, each one of them associated with a particular sign. I don’t think that the answer to Nina’s question relies on a late-evolution principle, because, somehow, the evolution of the quotation marks seems to be more straightforward than, let’s say, that of the comma or the semicolon. Semicolons, for instance, were still mainly abbreviation marks (for –us, among other Latin suffixes) during the 16th century.</p>
      <p>The 66 99-style quotation marks evolved from the ordinary comma. Printers used to mark quotations by means of starting each line with a couple of commas followed by a fixed space. They were confident that context would provide clues for the reader to know the precise places were a quotation started and ended. (According to Uribe Echeverría and others, this custom derives from the early-medieval diple, a wedge-like sign that some scribes wrote at the margins of the manuscripts to mark quotations.) Later on, some printers started to insert a couple of commas in the precise place where the quotation began, but to differentiate them from regular commas, they used to put them upturned in the galley. That is why they are inverted (66) with respect to the commas and raised with respect to the baseline. Soon, typographers envisioned that a new sign should be engraved (99) to join in a couple that would render much better typographic compositions.</p>
      <p>The solution was good in terms of diacritics, though it was obvious that the new quotation marks (“ ”) were ugly. During the 18th century, printers in Europe started to lower down the signs and to draw them in a slightly different fashion, curved at first, like tiny parenthesis, and later, angled (« »). Almost every typographic culture in Europe enthusiastically adopted these new quotation marks. The question is why that didn’t happen in England and the United States.</p>
      <p>My theory is that the explanation lies in politics. The United States started a rebellion at the end of the 18th century, and from then on, they had no recess until the last third of the following century. During this time, they developed as the only big nation of the world that grew richer, stronger, and more powerful than their former rulers. Surviving and growing at a fast rate was a priority, and that originated a lack of leadership in some cultural-related things. Think on Spanish, French, and Portuguese, for instance, languages that until recently were (or still are) fully regulated by their original countries. English and English culture had a different course. Therefore, many of the novelties that Europe adopted during the 18th and 19th centuries didn’t flourish in the United States or England: Metrical Systemis just another example. Regardless of typographic and literary styles, an English book of the 18th century is almost identical to one recently printed – the very same signs used in the very same fashion.</p>
      <p>In my humble opinion, compared to other European major languages, English typographic style (orthotypography) is very archaic, and quotation marks are the best reminders of the fact.</p>
