  html: "<p>This is such a basic question that it feels a little silly to ask (please do direct me to sources where it has been answered before): I’m wondering how it comes that type and placement of quotation marks vary so much between languages and countries. With a few little exceptions (dashes, potentially ellipses, and such), we don’t see this kind of crazy diversity with other punctuation (speaking within Latin here). So why quotes?</p>"
