      <p>Rockwell Kent wrote, designed, and illustrated <em>N by E</em>, published in Chicago in 1929.</p>
      <p>The typeface he chose was Fournier, a French face, and I would imagine that there was some discussion about its foreign quote marks—but in the end they decided they really must use that typeface—guillemets included—and it would have been too much trouble to change to an English font every time quote marks were called for.</p>
      <p>Given that most of the narrative occurs at sea or in Greenland, the offshore quality of the quote marks is appropriate.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/NXNW_6527.png"></div><p></p>
