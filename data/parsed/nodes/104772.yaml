      </p><div class="imageWrap"><img src="http://typophile.com/files/didot-guillemet_4301.png"></div><br>
      No quotemet in Didot's <em>caractères millimétriques</em> or in any of the other fonts used to set the book.<p></p>
      <p>*Méron goes much earlier; the English-like guillemets he shows look however  much smaller in height than the <em>nouvelle gravure</em> quotemets.</p>
