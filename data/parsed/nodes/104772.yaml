      <p>If I’m not mistaken, marks for indicating quotation were fairly late to develop or formalize (sometime in the seventeenth century, I believe), much later than the period, comma, semicolon, colon, question mark, et al. </p>
      <p>So, I would guess that the lack of a single standardized convention prior to the spread of printing would have left open the opportunity for different national centers of printing to adapt and evolve different conventions.</p>
