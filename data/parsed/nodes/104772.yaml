      <p>Concerning the remark Baudelaire made to his editor about quotes (mentionned in Echeverria's article in L'Express culture), <em>" Vos guillemets singulièrement retournés. Est-il nécessaire d'en mettre tout du long ? " </em> it may be worth looking at how they could appear in French at the time; here is grab from  <a href="http://gallica.bnf.fr/ark:/12148/bpt6k5628946k" rel="nofollow">Étude sur Montaigne</a>, on <a href="http://gallica.bnf.fr/" rel="nofollow">Gallica</a> dated 1859.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/montaigne-guillemets_5621.png"></div><br>
      Similar marks continue that way for many lines, till the citation ends; the opening guillemet is a rounded one. There are very long citations in one or two of Baudelaire's poems and it is likely that it was  those marks repeating till the closing guillemet that were his main concern in the given quotation. They are not without reminding the use of the <em>diplé</em> in the middle ages.<p></p>
