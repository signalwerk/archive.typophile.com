    html: <p>I think that shape should not be discussed independently of spacing and kerning. The French guilllemet is vertically centered (and appears to have had approximately that position since 1530 if the cuts of the Imprimerie nationale are faithful to the original) and there is a thin space separating each of them from the quoted text. On the other hand, English double quotes are on the contrary often kerned to get closer to the quoted text. It is rather clear that the guillemet does not have an ideal position or shape for such kerning. In fact, since the 19th century, spacing in English texts has been reduced, in my opinion, to the bare minimum. Is it just for economic reasons? Whatever the answer, I wonder if the move towards reading on the screen will change the relevant parameters.</p>
