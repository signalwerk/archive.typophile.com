      <p>.I see there is something coming out with a fish bones in the negative space. What about upgrading the red color part to look like some lips .. You know those images where the space draws a negative space form while negative space form draws the space form.</p>
      <p>example: <a href="http://picasaweb.google.com/rjc.uk.web/OpticalIllusions/photo#5029226944519385362" title="http://picasaweb.google.com/rjc.uk.web/OpticalIllusions/photo#5029226944519385362">http://picasaweb.google.com/rjc.uk.web/OpticalIllusions/photo#5029226944...</a></p>
      <p>just a small note: If You go with this style of visuals, perception normally gets only 1 of 2 shapes if no one explained the idea to the viewer.</p>
