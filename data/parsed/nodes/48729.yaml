      <p>A lot of super feedback here! Thanks to every one of you. </p>
      <p>shawkash: I like the idea. I'm gonna play around with it, but I'm not sure what the other shape would look like. I think I'd rather go safe with 1, then "add" another one, with it being easily misunderstood.</p>
      <p>DavM: I've experimented a little with this idea, which is great btw. It's a problem though as the piranha has eyes very close to the mouth, which makes the eye not even visible when the head is being cut off like it is in the logo.</p>
      <p>Although this is a logo I'll continue to work on, I might not even need it at the moment. In not many months I'll be applying for several internships and showing off my portfolio, making it useless to apply as a company called "Piraja Studio", it seems alot better to apply as a person, using my full name. I might consider using the mark though, as I'm really happy with the way it's going.</p>
      <p>I'll give you a version with my name in it instead, so you can come with feedback on the new typography!</p>
      <p>Again, thanks alot - you're all great!</p>
