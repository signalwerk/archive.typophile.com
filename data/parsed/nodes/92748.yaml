    <p>The following samples are from fictional ads from the game GTA: San Andreas.<br>
    For a modification for GTA IV, we are busy recreating some of these ads to a more high quality version. Of course we try to use the same fonts. We already have recreated several of these ads, but of the following ads, I have not been able to recognize the fonts being used. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Samples_3667.png"></div><p></p>
    <p>Sample #2 reminds me of a font I ever had, but I can't recall the name and thus not check if it is the one being used.<br>
    Sample #3 is hard to identify due to only having these letters.</p>
    <p>Could you please help me with identifying these fonts?</p>
    <p>Thanks in advance!</p>
    <p>Kind regards,<br>
    Martijn</p>
