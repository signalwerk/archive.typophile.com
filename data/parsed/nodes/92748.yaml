      <p>1. "Sprunk" could be <strong><a class="freelinking external" href="http://www.myfonts.com/fonts/softmaker/colonel-serial/" rel="nofollow">Colonel Serial Bold</a></strong>, artificially expanded</p>
      <p>2. "LOVIN' A LOAN, get the money..": the image is not very clear,<br>
      but it looks like <strong><a class="freelinking external" href="http://www.myfonts.com/fonts/mti/abadi-mt/" rel="nofollow">Abadi MT Condensed Extra Bold</a></strong> - maybe a bit compressed...</p>
      <p>3. Can't be sure for the "MOTEL" as the image contains only a few common letters,<br>
      but I think <strong><a href="/wiki/Frutiger%20Pro%2077%20Black%20Condensed" class="freelinking" rel="nofollow">Frutiger Pro 77 Black Condensed</a></strong> is a close enough match</p>
      <p>Good Luck with you GTA IV<br>
      Fivos</p>
