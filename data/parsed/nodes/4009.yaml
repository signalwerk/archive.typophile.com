    html: <p>Monib, what you're doing is extremely significant. <br> <br>Mostly because I actually don't know anybody else who's done experiements dealing with the extremely important issue of Familiarity in readability. I urge you to take this up again, and please keep me in the loop! And let me know if I can help. What you end up finding can validate/invalidate tons of anecdotal opinions that I for one can't trust on its own. Emigre says one thing, Noordzij says another. I think they're both essentially wrong, but one can be more wrong than the other!  :-) <br> <br>The careful gradual shifting of a typeface (serif would be better though) is a superb way of measuring the effects of familiarity. This is very valuable stuff - go all the way with it. <br> <br>hhp <br></p>
