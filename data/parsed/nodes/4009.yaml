  html: <p>Hi guys, <br> <br>I'm hoping someone can help me track down some typo-research. A bit of background first... <br> <br>About 7 years ago I did some legibility research in which I created a booklet featuring text that gradually degraded and became illegible over time. It began with a clean sans serif face, and by the end of the 20 pages it had morphed into an illegible font. When reading through it the eye actually 'learns' the font and by the end of it is actually quite legible. The purpose of the exercise was to explore how 'illegibility' is something the eye/brain can 'learn'. <br> <br>I have since lost all the research work that I did for this, but I know that a few other people in the typo-community have also made very similar experiments. I really need to find references/samples of this same experiment. I'm not after other types of research, I need this specific approach in particular. Anyone have any clues? I recall reading similar reference to it here and there but I can not pin point a reference. The University of reading might have something in their archives...? <br> <br>If anyone can provide any leads I would be most appreciative. <br> <br>Thanks, <br>Monib <br> <br></p>
