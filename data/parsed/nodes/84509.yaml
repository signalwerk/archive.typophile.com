    html: |-
      <p>I'm on Windows 7 and use suitcase fusion 3 to manage my fonts and have had success with this method:</p>
      <p>Install fonts via Suitcase Fusion.</p>
      <p>When I need to update the font, I delete the current version from Suitcase.</p>
      <p>Close the program.</p>
      <p>Close FMCore.exe (via Task Manager)</p>
      <p>Create the new font.</p>
      <p>Reopen suitcase and reinstall the font.</p>
      <p>This is the best method I have found that doesn't require me restarting my computer.</p>
    html_clean: |-
      <p>I'm on Windows 7 and use suitcase fusion 3 to manage my fonts and have had success with this method:</p>
