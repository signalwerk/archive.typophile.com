    <p>Hey guys,</p>
    <p>I'm pretty new to all this and am constructing my first font. I've created a pretty complete set of glyphs + ligatures, then got FontLab to create a bold version and a italic (in truth a slanted) version of this. FontLab did an ok job with the bold version, I did have to redraw a lot of the glyphs. The 'italic' version was pretty straightforward... but it somehow just won't work on my system...</p>
    <p>I did follow the naming conventions - as far as I can tell - but maybe I did something wrong. Restarting Illustrator or Photoshop doesn't seem to do the trick so I'm kinda lost here. Any suggestions as to what a starter could be doing wrong?</p>
    <p>Here is a screenshot of my font info for the three fonts:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/loose_problem_5200.jpg"></div><p></p>
