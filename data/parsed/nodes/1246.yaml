  html: <p> What's your take? <br> <br>How far are we away from widespread  <br>adoption of OpenType, the new cross-platform  <br>font format? <br> <br>Quark doesn't even support it yet, right? <br> <br>Could you argue that if Quark doesn't adopt it  <br>that widespread adoption will never really  <br>happen? <br> <br>Or could you argue that it's a good sign Quark  <br>should be abandoned for InDesign? (Yeah,  <br>right?) </p>
