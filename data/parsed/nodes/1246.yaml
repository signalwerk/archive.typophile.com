    html: "<p> Stuart: <br> <br>I think the main problem is that it would be incredibly difficult for anybody to create such a plug-in. So much so that it's probably not feasible. I suspect Quark's codebase makes some pretty deep-rooted assumptions about text handling, and they don't expose nearly as much of the app to plug-in developers as InDesign does, yet doing this in InDesign proved to be quite a bit of work. In all likelihood, Quark will need to make some underlying architectural changes first. <br> <br>If it were feasible, then Adobe probably still wouldn't do it. I mean, why would we put immense work into making our competitor's product better? If we were going to make a plug-in, we'd sooner do something that would help an Adobe product. (This is purely for example purposes - don't start any wild speculation!) <br> <br>T </p>"
