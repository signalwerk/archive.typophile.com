    html: <p> The other side of this coin (other than user  <br>adoption) is how easy or valuable the <br>creation of OpenType fonts is. A part of  <br>this equation is that once a face is in OT format, <br>seperate cross platform development is no longer  <br>an issue. <br> <br>You can see how these go hand in hand. If type  <br>foundries/resellers are pushing the benefits of  <br>OpenType and making the fonts available, the  <br>adoption will potentially move faster. <br> <br>You can see how Adobe is pushing the technology  <br>in this way, having already ported their  <br>entire font library to OT. (No small task, I imagine.) </p>
