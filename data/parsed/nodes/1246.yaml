    html: "<p> Plus side: Yes, OpenType fonts can work just as well as Type 1 in existing apps, even QuarkXPress. Plus, the font files are cross-platform. <br> <br>Down side: Apps that don't go out of their way to do so don't get the cool typographic features. Apps that don't know Unicode will still only be able to access platform-specific encodings and generally be hobbles as much as they have always been. <br> <br>Sideways side: Although it's nice to make an OpenType font in that you've got one font file for both platforms, that really only simplifies sales (single downloadable instead of two). At Adobe we've found that due to platform-specific issues, we still have to test on both platforms just as extensively as before. Although, we do have better automated testing utilities now (such as CompareFamily, part of the OpenType FDK from Adobe). <br> <br>I'm doing some pretty in-depth stuff on OpenType library conversion at ATypI this year. The techie stuff (the \"how\") is in the Font Technology Forum, and a more general presentation (the \"what\") in the main conference. <br> <br>T </p>"
