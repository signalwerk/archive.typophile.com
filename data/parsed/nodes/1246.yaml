    html: "<p> The biggest barrier to widespread adoption of InDesign is not any real advantages Quark might have. It's all the scaffolding put in place over the last decade to make Quark work. I would encourage anyone with a newer machine (e.g. capable of running OS 10.2 and with at least 512MB of RAM) to grab one copy of InDesign (buy it with the Adobe Design Collection for your next new machine) and start doing one-machine projects on it, and see how fast it sells itself. <br> <br>Quark adopting OpenType? Ha, Quark can't even handle freakin' UNICODE. Not even in their hyper-expensive Passport version. ID does multilingual typesetting out of the box, but Quark can't even make use of the simple CE characters already found in every Microsoft TT and Apple AAT font. <br> <br>Do ease into ID slowly, but do prepare to abandon the Quark ship eventually. They're continuously dismissive of any questions regarding intelligent fonts. <br> <br>(nota bene: I have a financial interest in OpenType font sales.) </p>"
    html_clean: "<p> The biggest barrier to widespread adoption of InDesign is not any real advantages Quark might have. It's all the scaffolding put in place over the last decade to make Quark work. I would encourage anyone with a newer machine (e.g. capable of running OS 10.2 and with at least 512MB of RAM) to grab one copy of InDesign (buy it with the Adobe Design Collection for your next new machine) and start doing one-machine projects on it, and see how fast it sells itself. <br> <br>Quark adopting OpenType? Ha, Quark can't even handle freakin' UNICODE. Not even in their hyper-expensive Passport version. ID does multilingual typesetting out of the box, but Quark can't even make use of the simple CE characters already found in every Microsoft TT and Apple AAT font. <br> <br>Do ease into ID slowly, but do prepare to abandon the Quark ship eventually. They're continuously dismissive of any questions regarding intelligent fonts. <br> <br>(nota bene: I have a financial interest in OpenType font sales.) </p>"
