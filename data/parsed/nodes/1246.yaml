    html: <p> Joe, you've asked some really key questions. I think that an argument could be made that until Quark supports OpenType features, you won't see widespread adoption -- at least, not in the publishing industry.  <br> <br>Publishers are pretty much wedded to Quark. InDesign has some attractive features, but nothing compelling enough to overcome the inertia. Converting even a small shop over to InDesign is a serious proposition and investment, let alone a large established design department. <br> <br>That said, Quark may have some serious challenges if it doesn't get carbonized soon. As OS X stabilizes and gets more established, the fact that Indy runs native may become compelling enough for some operations to make the switch, especially if Adobe offers cross-grade pricing comparable to a Quark upgrade.  <br> <br>If Indy makes inroads, then OpenType will make inroads, and Adobe's gamble will have paid off. Until then, it looks like a crap shoot to me. <br> <br>-- K. </p>
    html_clean: <p> Joe, you've asked some really key questions. I think that an argument could be made that until Quark supports OpenType features, you won't see widespread adoption -- at least, not in the publishing industry.  <br> <br>Publishers are pretty much wedded to Quark. InDesign has some attractive features, but nothing compelling enough to overcome the inertia. Converting even a small shop over to InDesign is a serious proposition and investment, let alone a large established design department. <br> <br>That said, Quark may have some serious challenges if it doesn't get carbonized soon. As OS X stabilizes and gets more established, the fact that Indy runs native may become compelling enough for some operations to make the switch, especially if Adobe offers cross-grade pricing comparable to a Quark upgrade.  <br> <br>If Indy makes inroads, then OpenType will make inroads, and Adobe's gamble will have paid off. Until then, it looks like a crap shoot to me. <br> <br>-- K. </p>
