    votes: null
    html: "<p> Stuart, good question. I'm not all that OpenType aware myself yet. ;-) But I think there are two levels of OT awareness. I think you're right, the first -- just being able to use OT fonts -- is accomplished by the very nature of OS X. In earlier OSes, it can be accomplished with the latest versions of ATM. <br> <br>But I think the second, more interesting level of OT awareness -- accessing the typographic features: automatic ligatures, optical versions, auto true small caps, etc. -- requires that the application be written to utilize these features. Maybe that's just Carbon apps, though. It may be that the OS X font panel, which I think is used by all Cocoa apps, includes access to all OT features. I'm not sure. <br> <br>But Quark going straight to Cocoa? -- yeah, right. I'm not holding my breath. <br> <br>Too bad you won't be able to come to TypeCon this year. I think that Tom Phinney is giving a presentation on OT that should prove quite enlightening. <br> <br>-- K. </p>"
