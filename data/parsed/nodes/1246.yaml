    html: "<p> Thomas -- <br> <br>Here's the question in my mind wrt OpenType in Quark (or any other non-OT-savvy app): Can I access the style variants? Sure, I won't have access to the cool typographic features like auto ligatures, swashes, and stuff; but my fear is that since the SC, for instance, is bundled in to the OT font and is accessed through OT style swapping, I won't be able to actually access it through the font menu as before. Or what about the optical styles of a face like Minion? <br> <br>Can you please clarify? What will or won't I be able to access if I license a Pro font and pull it up in Quark?  <br> <br>-- Kent. </p>"
