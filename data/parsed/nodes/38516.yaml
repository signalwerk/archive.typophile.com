      <p>I like this.  I think you should get rid of the lowercase (bottom section) and stick with the variable-width uppercase.  H, I, K, L , N and T don't need to have curved upper corners, straighten them out.  With those as simple rectangular letters, the curved letters will be more interesting.  The I in particular doesn't work;  I think you should get rid of your 1, and use the current I as your 1, and make new, plain rectangular I.  The 2 and 7 should match the Z, the 8 should take a cue from the X, the 5 should have a rectangular top, and the 3 should have a curved bottom. </p>
      <p>I don't think you should "forget" about this font and "start a new one from scratch."  Even if this won't end up being the best font in the world, you'll still learn something by working on it, and the next font you design will be even better. </p>
      <p>-matt</p>
