    html: <p>Thanks for all the replies. <br><br>I had a look at Avenir Next, and most likely I’ll recomend it for my client, even though I ﬁnd it a little to geometrical for my taste. Personally I have no problems with Kievit. It’s a great font, and I think Mike Abbink has done a wonderful job. I have never experienced the postscript errors myself (even though it might have seemed that way), but it seems to be a common problem among the others working for this publisher. This publisher produces in between 60 — 100 books a year. <br><br>As I mentioned I haven’t experienced these problems myself. I work in InDesign 2/3, but I know that several others use Fram Maker for practical reasons. I’ve had plenty of discussions on why they still use <span class="caps">FM</span>. I would also like to mention that in saying ‘the others’, I’m talking about people who don’t have any typographic education … they just make books. What’s a correct English term for this? They might be clever at using the programs, fast and cheap, but sadly no passion. But I guess that’s a common problem. (Do I sound irritated?) <br><br>Anyway … I will also have a talk with <span class="caps">FF</span> in Germany to see if they know what’s wrong, because the best would be to keep using&nbsp;Kievit.</p>
