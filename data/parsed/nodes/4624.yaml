    html: '<p>Not absolute rules, but guidelines are helpful. One of them in fact is: all things being equal, serifs help readability. There is both empirical and anecdotal evidence to support this, and virtually none for sans fonts. Besides evidence, it also happens to make great sense once you get a grasp of how people actually read. <br><br><a href="http://www.themicrofoundry.com/ss_read1.html" target="_blank">http://www.themicrofoundry.com/ss_read1.html</a> <br><br>Furthermore, a text font is not like a painting: it’s much more about our subconscious reading “ﬁrmware” and a lot less about fashion. <br><br>As for Familiarity, it is indeed important, but it’s still only half the story (at most). <br><br>hhp <br></p>'
