    html: <p>I’ve only been using <span class="caps">ID</span> 3 for a couple of months, but it seems as though some of the more practical funktions that <span class="caps">FM</span> has, still are missing. I.e. generating several indexes in one document … but I’m note sure of this. Another thing is that I don’t know if <span class="caps">ID3</span> has eased working with footnotes and sideheads. I suspect that <span class="caps">FM</span> is still a bit more practical for longer documents. I’m starting a 500 page book in <span class="caps">ID</span> next week, with sideheads. So I’ll be back then to post reports. <br><br>But … I’ve heard that Adobe will not be producing <span class="caps">FM</span> for Mac anymore, so I hope they will improve InDesigns practical functions (if needed, it might be me not ﬁnding these&nbsp;functions).</p>
