  html: <p>I did a job last year, making new text-templates for a Norwegian publisher. I ended up using Minion and FF Kievit. It worked out just perfect, but now, one year later we're revising the templates cause we're having problems with Kievit. <br> <br>I had FF cut a special version with normal figures in Kievit Regular, and OSF in Kievit Caps. Mainly for practical usage. But ever since we started using the new templates, we've had postscript errors because of the typeface from here to eternity. <img src="http://www.typophile.com/forums/clipart/sad.gif" alt=":-(" border="0"> <br> <br>Now I have to find a substitute. Any suggestions. What I'm looking for is a legible OpenType font (Kievit is not OT), with true Caps and Italic. It has to be friends with Minion, and have atleast weights in regular, medium and bold. <br> <br>Rune D</p>
  html_clean: <p>I did a job last year, making new text-templates for a Norwegian publisher. I ended up using Minion and FF Kievit. It worked out just perfect, but now, one year later we're revising the templates cause we're having problems with Kievit. <br> <br>I had FF cut a special version with normal figures in Kievit Regular, and OSF in Kievit Caps. Mainly for practical usage. But ever since we started using the new templates, we've had postscript errors because of the typeface from here to eternity. <img src="http://www.typophile.com/forums/clipart/sad.gif" alt=":-(" border="0"> <br> <br>Now I have to find a substitute. Any suggestions. What I'm looking for is a legible OpenType font (Kievit is not OT), with true Caps and Italic. It has to be friends with Minion, and have atleast weights in regular, medium and bold. <br> <br>Rune D</p>
