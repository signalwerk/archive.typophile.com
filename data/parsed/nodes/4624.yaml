    html: <p>Yes, thereis some research suporting the use of serif type over sans serif for long texts but this is not a clear choice based on data of an entire set of typographic specs and there isn’t that much diﬀerence in readability anyway.  You ﬁnd variances in the data based on where the testing was done and the backgrounds of the the people sampled.  There are even cultural diﬀerences hinting at the possibility that you can read better that which you are more used to reading (people from countries where sans serif is prevalent read it better than people from countries where it is not). <br>I personally prefer sans serif for text so long as it is in a good typeface and set with good typography.  I ﬁnd Bodoni to be an incredible beautiful typeface which I use often when it can be set large enough but ﬁnd it too diﬃcult to read at smaller “book sizes”. <br>Once upon a time, books were set in blackletter (which is very hard to read for people today).  There probably was some outcry when people ﬁrst started using Roman type to set books. <br><br>Why do we need such absolute rules today when anything is possible?  There always fas been good and bad in the design of everything.  Time has a way of sorting it out but not always in the way we might predict.  The paintings of the French Academy were the rage of their day and those of the Fauves were looked upon with disdain.  Today the tables are turned.  Let typgraphers use whatever types they deem best, serif, sans or mix.  When done well, I welcome them all. <br><br>The world is a big place and technology has made it possible for us to do things quickly which were never possible before.  We don’t need to stymie typographers with iron-clad rules from previous generations.  We should have open minds and let the talents of typgraphers now and in the future come to bear.  Some will succeed and some will fail but none will succeed if we don’t let them try. <br><br>Chris&nbsp;L</p>
