    html: |-
      <p>As someone who mainly plays with free fonts, there is a point where I draw the line. </p>
      <p>If I try and put it on a vector curve and it goes awry (what’s up with that?), out it goes. </p>
      <p>I don’t mind some kerning, because I rarely have more than a few lines in my stuff. Someday when I get one of those round tuits, I will go back and check some of the old fontplays for bad letter spacing. I wasn’t very aware of that kind of thing for a long time.</p>
      <p>And after I use them a few times, out they go. I can always get them again if necessary.</p>
      <p><strong>But if I was a pro designer</strong>, I doubt I would put up with much grief. Life is too short. And if you have a deadline, what price can you put on headaches?</p>
      <p>And with a couple timely purchases (for very little money), I have enough good fonts to design up a storm, if I had a clue about what I was doing.</p>
      <p>But I’d definitely keep an eye out for sales, like that half-price sale one of the designers was doing last week. I have a bit of bargain hunter in me, that thrills in an extra good deal.<br>
      ; )</p>
