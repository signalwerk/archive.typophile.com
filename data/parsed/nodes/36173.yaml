    <p>(EDIT: WHAT A TERRIBLY SPELLING ERROR I MADE. (“Horde” instead of “Hoard.”) It is too early for spelling.)</p>
    <p>So, I’m curious how you all manage your font collections on your com-put-ers. Do you purchase/download any and all fonts you can get your hands on? Do you pick and choose only the finest that you can find? A combination of the two?</p>
    <p>I ask because I have a ton of fonts, some of which aren’t exactly of the highest calibur, but I can’t bring myself to prune them. I wouldn’t feel so bad if I knew others were. :D</p>
