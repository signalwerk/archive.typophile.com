      <p>I go through this all the time, but not only for fonts. My natural instinct is toward hoarding, it runs in the genetic line. </p>
      <p>But my esthetic and philosophical leanings sway toward a yearning for Zen-like simplicity.</p>
      <p>To quote Edward Tufte:</p>
      <p><em>“What can be done with fewer is done in vain with more.”</em></p>
      <p>I like to keep my font collection at less than 1000 typefaces, so if I purchase a new family I “retire” old fonts by archiving them in a fonts folder.</p>
