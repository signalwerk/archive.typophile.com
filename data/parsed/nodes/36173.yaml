      <p>&gt; some of which aren’t exactly of the highest calibur, but I can’t bring myself to prune them.</p>
      <p>Are you hoping to do work of the highest calibre? If so, then prune out the weeds from your font list. You can’t do good work with bad tools.</p>
      <p>Since the dawn of DTP there seems to be a competitiveness about font acquisition. It’s like a contest, where the guy with the most fonts wins. The free and warez font sites seem to feed that. </p>
      <p>I’d rather have 100 good quality fonts than 5000 poor quality ones. Over 95% of the free fonts are . Now, if you paid reasonable money for fonts, you should never completely eliminate them. Archive them to a CD if they have gotten old and tired, as some have, but be ready to spring them back to life when you get the project that will be perfect for that particular look.</p>
