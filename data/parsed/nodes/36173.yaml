    html: <p>Like pattyfab, I use FontExplorer X, and it’s really easy to manage by just categorizing the entire library once. Right now, I’d prefer to buy small, essential families then work my way up by selecting high quality type from other foundries; however, at the time, I went ahead and purchased the Adobe Type Collection. Though expensive and it has some junk, I should be fortunate to have many high-quality families and the best well-known classics (though often overused) to choose from. In the end, though, I’d still rather pick and choose type from other foundries because there’s some amazing typefaces out there. Ah well.</p>
