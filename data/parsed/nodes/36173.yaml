      <p>I have a complete font library and a working font library. The second is “pruned”. But I never know when I might need something so I keep a complete one on my hard drive too.</p>
      <p>I only add to my font manager out of my working font library. If I need one of the fonts in my main library I dupe it into the working one first.</p>
      <p>I don’t like FontExplorer to manage my fonts so that also doesn’t let programs crash with activated fonts out of my main library, the primary reason that fonts get corrupted.</p>
      <p>pbc</p>
