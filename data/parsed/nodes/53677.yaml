    <p>I would like to know what the initials TC stand for in <a href="http://www.fontshop.com/fonts/downloads/red_rooster/administer_tc_1/" rel="nofollow">TC Administer</a>, <a href="http://www.fontshop.com/fonts/downloads/red_rooster/century_new_style_tc_1/" rel="nofollow">TC Century New Style</a>, <a href="http://www.fontshop.com/fonts/downloads/creative_alliance/tc_europa_bold/" rel="nofollow">TC Europa</a>, <a href="http://www.fontshop.com/fonts/downloads/creative_alliance/tc_jasper/" rel="nofollow">TC Jasper</a>, and <a href="http://www.fontshop.com/fonts/downloads/red_rooster/kingsley_tc/" rel="nofollow">TC Kingsley</a>.</p>
    <p>I think it is the original designer/foundry/manufacturer, possibly <a href="/wiki/Leslie%20Usherwood" class="freelinking" rel="nofollow">Leslie Usherwood</a>'s Typesettra Ltd. <em>(TC would then be Typesettra Collection).</em> Does anybody have more information?</p>
