    html: |-
      <p>Todd,</p>
      <p>Thanks for all the feedback. I'm extremely new at type design (I've only been at this 2 weeks), so could you elaborate or show examples of what you are talking about? Specifically with the oval counters having optical problems?</p>
      <p>I haven't seen Arbor before or the Caslon Italian style, but really similar idea to what I was trying to pull off. The font started just as an experiment to see if this style was possible. I did some searches on MyFont and didn't see anything similar, so I decided to go for it.</p>
      <p>Do you think there's enough differences between this and Arbor to continue? Or would it be possible to add differences, so that there is more of a distinction? I also plan on releasing an extended version, as well as different weights.</p>
      <p>Again, thanks for the great feedback. That's exactly what I was looking for.</p>
