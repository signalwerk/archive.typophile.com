    html: |-
      <p>I did something a little like this for a friend's album art. I'll come back with a link to it later.</p>
      <p>My starting point was the five-line pica Italian in the white Taschen book -- A Visual History of Typefaces etc. As I was working on it, Chester Jenkins released Arbor. So I emailed him and asked about why he had dropped the triangular serifs which is the part that attracted me most to the idea. He had come to the shapes of Arbor without reference to Italian specimens, but he pointed me to Paul Barnes' Calson Italian which is really spectacular.</p>
      <p>IMO the reverse stress tends toward a 1970's feel if you draw glyphs like the R with a blobby leg. Alternatively you can bring in the triangle serifs which can give the shapes energy, I think because the diagonals counterpose the railway track feel of the big top and bottom slabs.</p>
      <p>It's hard to get the right colour, especially when you compare the lightness of your M to the other glyphs. Also, I think your oval counters have an optical problem in that they swell at the edges -- more like a dog bone than a lozenge.</p>
      <p>When I did this I wound up with a squalid collection of black lumps, but at least it was fun.</p>
    html_clean: |-
