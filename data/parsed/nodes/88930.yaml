    <p>The <a class="freelinking external" href="http://www.typesociety.org/" rel="nofollow">Society of Typographic Aficionados</a> is pleased to announce the third annual SOTA Catalyst Award for young people who have created original work in type design, type history, or other areas related to typography. The award recognizes a person 30 years of age or younger who shows both achievement and future promise in the field of typography.</p>
    <p>The recipient will be awarded up to $1,500 USD in reimbursement for transportation and lodging expenses to attend the <a class="freelinking external" href="http://www.typecon.com/" rel="nofollow">TypeCon2012</a> conference in Milwaukee, Wisconsin — July 31st – August 5th. They will also have their conference registration fee paid for and will give a 20-minute presentation during the main conference program. The SOTA Board of Directors hopes that this introduction to a large audience of typographic aficionados will be a catalyst in the career of the recipient.</p>
    <p><strong>Judging Committee</strong></p>
    <p>Geraldine Banes (formerly Geraldine Wade)<br>
    Amelia Hugll-Fontanel<br>
    Charles Nix<br>
    Mark Simonson</p>
    <p><strong>Submission Deadline</strong></p>
    <p>March 9th, 2012</p>
    <p><strong>Notification of Award</strong></p>
    <p>March 30th, 2012</p>
    <p><strong>Requirements</strong></p>
    <p>You must be 30 years of age or younger on August 2nd, 2012 and must attend TypeCon2012 in Milwaukee — August 2nd - 5th, 2012 — to make a presentation during the conference.</p>
    <p>The following materials must be emailed to <a href="mailto:catalyst@typesociety.org">catalyst@typesociety.org</a> by the submission deadline. A single PDF file (may be multiple pages) containing the following information is preferred:</p>
    <ol>
    <li>Examples of a specific project or related group of work to be the topic of the presentation</li>
    <li>A brief description of the presentation (100 words or less)</li>
    <li>A letter explaining your involvement in typography (300 words or less)</li>
    <li><strong>Optional:</strong> Online links to additional work or background information</li>
    </ol>
    <p>Include your name, date of birth, postal address, organization or university affiliation (if applicable), email, and phone number with area code. Applicants from outside the U.S. or Canada should include their country dialing code as well.</p>
