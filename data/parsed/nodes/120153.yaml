    html: |-
      <p>I have seen typefaces like Mason in places like Dafont; as a serious typeface it has a place in display use (I <em>could</em> see it (or perhaps remember having seen it used) used for chapter headings in a novel, if it was a murder mystery following in the Da Vinci Code trend; that's <em>its</em> cliché niche) - I find it too outré rather than too cliché for sword and sorcery use, though (that was the fault of <em>my</em> suggestions).</p>
      <p>Another cliché suggestion would be Freehand or a similar face, like Kingthings Calligraphica.</p>
