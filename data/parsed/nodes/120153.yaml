    html: |-
      <p>Plenty of good suggestions here. Faunus is pretty subtle, though.</p>
      <p>Riffing on the Jenson Oldstyle / Kelmscott direction, one could also go with a more classic Jenson, such as</p>
      <p>Cloister <a href="http://www.myfonts.com/fonts/lanston/ltc-cloister/">http://www.myfonts.com/fonts/lanston/ltc-cloister/</a><br>
      Centaur <a href="http://www.myfonts.com/fonts/adobe/centaur/">http://www.myfonts.com/fonts/adobe/centaur/</a><br>
      Adobe Jenson <a href="http://www.myfonts.com/fonts/adobe/jenson/">http://www.myfonts.com/fonts/adobe/jenson/</a></p>
      <p>“Sword &amp; Sorcery” implies a sort of wild, low fantasy setting, though. I am thinking Fritz Leiber and the like. This stuff was especially popular back in the 1970s and became associated with the art nouveau revival that was popular at the time. In that vein, the earlier suggestion of my revival, Cristoforo, is reasonable. I'd avoid Arnold Boecklin as being a bit of a cliche, but there's plenty of other stuff in that vein.<br><a href="http://www.myfonts.com/search/art+nouveau/fonts/">http://www.myfonts.com/search/art+nouveau/fonts/</a></p>
