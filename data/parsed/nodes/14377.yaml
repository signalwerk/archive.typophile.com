    user_image: /files/pictures/picture-1262.gif
    date_raw: 5 Aug 2005 — 12:44pm
    date: 2005-08-05T12:44:00
    votes: null
    html: <p>I filled in the wiki entry for vyaz', but now I'm getting the 'Access Denied' bug again. The compressed letterforms used in vyaz' begin life in Greek uncial lettering, and are related to the style of lettering often employed in Orthodox icons. In vyaz', the letters are compressed even more, and made to interlock in a variety of ways (shared stems, stacking, enclosure).</p>
