      <p>Hi Hildebrant,</p>
      <p>This image may look a bit intimidating, but it has nothing to do with calligraphic craftmanship at all. It is a probably the work of a cheap street calligrapher or another member of a sorry class of incompetent charlatans. There are very few real calligraphers left, and their work is in a totally different league. </p>
      <p>The text is HQ 2:255, tye so-called Throne Verse<br>
      (<a href="http://en.wikipedia.org/wiki/Throne_Verse" title="http://en.wikipedia.org/wiki/Throne_Verse">http://en.wikipedia.org/wiki/Throne_Verse</a>)</p>
      <p>Here's a better, be it less elaborate, example:<br>
      <a href="http://pgssajkm.blogspot.com/2008/05/ayatul-kursi.html" title="http://pgssajkm.blogspot.com/2008/05/ayatul-kursi.html">http://pgssajkm.blogspot.com/2008/05/ayatul-kursi.html</a></p>
      <p>And here's another nice example of rubbish:<br>
      <a href="http://www.dr-umar-azam.com/dreams_in_islam/images/6.jpg" title="http://www.dr-umar-azam.com/dreams_in_islam/images/6.jpg">http://www.dr-umar-azam.com/dreams_in_islam/images/6.jpg</a></p>
      <p>I also had a - computerized - go at it here:<br>
      <a href="http://www.saudiaramcoworld.com/issue/200704/images/keyboard/calli_100_4478.jpg" title="http://www.saudiaramcoworld.com/issue/200704/images/keyboard/calli_100_4478.jpg">http://www.saudiaramcoworld.com/issue/200704/images/keyboard/calli_100_4...</a></p>
      <p>Thomas Milo<br>
      DecoType<br>
      <a href="http://www.decotype.com" title="www.decotype.com">www.decotype.com</a></p>
