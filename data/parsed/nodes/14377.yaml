      <p>Maxim,</p>
      <p>Here's the image of my old faithful Church Slavonic IBM Selectric Golf Ball. </p>
      <p><a href="http://www.decotype.com/images/100_6924.JPG" title="http://www.decotype.com/images/100_6924.JPG">http://www.decotype.com/images/100_6924.JPG</a></p>
      <p>The background text is a page of the Handbuch der altbulgarischen Sprache by A. Leskien, the dean of the neogrammarians.</p>
      <p><a href="http://en.wikipedia.org/wiki/August_Leskien" title="http://en.wikipedia.org/wiki/August_Leskien">http://en.wikipedia.org/wiki/August_Leskien</a></p>
      <p>The golf ball was produced by IBM Nederland in thr 1980's in collaboration with the University of Utrecht I believe. I bought ot from from the old IBM Direct Shop at the Johan Huizingalaan in Amsterdam. Unfortunately I no longer have the actual machine, I donated it to the Scryption Museum in Tilburg, NL.</p>
