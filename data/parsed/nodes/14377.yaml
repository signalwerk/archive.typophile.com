    html: <p>Do you mean, <a href="http://www.typophile.com/forums/messages/30/13843.gif" target="_blank" rel="nofollow"><em>this</em> kind of thing</a>? It's called <em><a href="http://www.paratype.com/help/term/terms.asp?code=369" target="_blank" rel="nofollow">vyaz</a></em>. It is discussed and shown in a great number of Russian (and non-Russian) books on paleography and early printing. One good source that comes to mind is Зернова А. С. <em>Орнаментика книг московской печати кирилловского шрифта, 1677-1750</em>. Москва, 1963, but the titles are many. A fairly good listing of Russian books on type and typography can be found <a href="http://www.whitemouse.ru/font/b1900.wmb" target="_blank" rel="nofollow">here</a>. By the way, Paul, the sample you have attached to your post is just god-awful.</p>
