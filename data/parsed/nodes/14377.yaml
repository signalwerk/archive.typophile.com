      <p><em>Spas na Krovi</em> is a careful, and quite expensive, fin-du-siècle fake, imitating the classical 16th-century Moscow style (in a way, it is a Russian version of the Sacré-Cœur). Just compare it with the <a href="http://www.dni.ru/upimg/m_13656.jpg" rel="nofollow">real thing</a>. </p>
      <p>And, speaking of a good, classical <em>vyaz</em>, have a look at the lettering on the <a href="http://www.cominf.ru/kremlin/images/glavakol.jpg" rel="nofollow">Ivan the Great Bell-Tower</a> in the Kremlin (1505–8).</p>
      <p>Now the good news. It looks like your ring <em>was found</em> by one Evgeny Kutuzov, a fan of the popular Russian actor <a href="http://www.karachentsov.ru/root/from_people/" rel="nofollow">Nilkolay Karachentsov</a>...</p>
