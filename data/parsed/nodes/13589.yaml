    <p><strong><a href="/wiki/Indicies" class="freelinking" rel="nofollow">Indicies</a> : <a href="/wiki/Education" class="freelinking" rel="nofollow">Education</a> : Hochschule für Gestaltung und Buchkunst Leipzig</strong></p>
    <p>University for art and design in Leipzig, Germany. Typography and Type Design are taught there (by <a href="/wiki/Rayan%20Abdullah" class="freelinking" rel="nofollow">Rayan Abdullah</a> and <a href="/wiki/Fred%20Smeijers" class="freelinking" rel="nofollow">Fred Smeijers</a>, respectively).</p>
    <p>The HGB is one of Germany's most exclusive schools for graphic design and type design, as well as for fine art and painting. During the years of the East German communist republic, it was that country's most prestigious art/design institution. <a href="/wiki/Albert%20Kapr" class="freelinking" rel="nofollow">Albert Kapr</a> spent many years teaching there, for instance.</p>
