    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indicies" title="Create node &quot;Indicies&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indicies</a>&nbsp;: <a href="/node/12011" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Education</a>&nbsp;: Hochschule für Gestaltung und Buchkunst&nbsp;Leipzig</strong></p>
    <p>University for art and design in Leipzig, Germany. Typography and Type Design are taught there (by <a href="/node/13588" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Rayan Abdullah</a> and <a href="/node/13587" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Fred Smeijers</a>,&nbsp;respectively).</p>
    <p>The <span class="caps">HGB</span> is one of Germany’s most exclusive schools for graphic design and type design, as well as for fine art and painting. During the years of the East German communist republic, it was that country’s most prestigious art/design institution. <a href="/node/13549" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Albert Kapr</a> spent many years teaching there, for&nbsp;instance.</p>
