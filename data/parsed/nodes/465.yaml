    html: <p>BJ, <br> <br>hey, i'm not that "old" - Mr. Brody is....something....let's see...around 50. i'm  not. anyway....it's not important. <br> <br>no. i don't think these are rhetorical questions.  <br> <br>Mortimer Leach - he, for example, drew curves - 1/3 wider than the straight stems. you can study his artwork. and compare it.  <br> <br>you can agree with his "method"/method - or not. and always ask - why 1/3 wider?  <br> <br>is that fixed? quantitative? subjective? <br> <br>a good study is Bodoni (1926) and Sheldon (1947)  - same cap height, not the same  x-height - Sheldon is more-more generous with x-height. and , of course, not the same ascenders &amp; descenders. <br> <br>so --- is that fixed? quantitative?  <br> <br>that's my opinion. maybe i'm wrong. or maybe there's no maybe. maybe. <br> <br>===== <br> <br>what are you doing? what kind of artwork?  <br> <br>David Hamuel <br></p>
