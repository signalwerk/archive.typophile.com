    votes: null
    html: <p>&gt; <br> <br>Ed Benguiat shared this with me years ago. His approach was to take the weight of the heaviest part of the vertical stem of the lowercase o, and use that as the weight of vertical stem on the upright characters in the caps. This approach does assume that the lowercase o is properly rendered in relation to the remaining lowercase. While not locked in stone it has severed me well over the years. <br> <br>James</p>
    html_clean: <p>&gt; <br> <br>Ed Benguiat shared this with me years ago. His approach was to take the weight of the heaviest part of the vertical stem of the lowercase o, and use that as the weight of vertical stem on the upright characters in the caps. This approach does assume that the lowercase o is properly rendered in relation to the remaining lowercase. While not locked in stone it has severed me well over the years. <br> <br>James</p>
