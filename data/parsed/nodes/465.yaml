  - id: 3038
    user: 1353
    date: 2003-06-26T13:27:00
    date_raw: 26.Jun.2003 1.27pm
    votes: null
    html: <p>Oh, now I get it. <br>I think it's very simple. Uppercase need to be slightly heavier than lowercase. Otherwise, since Uc letters have more white space around them, they (Uc) would look lighter than lc. <br>But it should be just a slight extra weight. No more than 110%, I think. Of course, this percentage depends on the typeface too, some typeface may need more Uc extra weight. <br>A priori, there's no negative consequences. It's just a necessary optical adjustment.</p>
    html_clean: <p>Oh, now I get it. <br>I think it's very simple. Uppercase need to be slightly heavier than lowercase. Otherwise, since Uc letters have more white space around them, they (Uc) would look lighter than lc. <br>But it should be just a slight extra weight. No more than 110%, I think. Of course, this percentage depends on the typeface too, some typeface may need more Uc extra weight. <br>A priori, there's no negative consequences. It's just a necessary optical adjustment.</p>
