    html: <p>Further...after a hiatus, i'm back into <br>type-design-obsession mode. After lots of <br>methodical Monoline stuff, i jumped into  <br>thicks/thins but finally  <br>with a shape-based  <br>method sted of a mimic method. <br> <br>The key was getting the bowls on the 8 and the <br>0 established, and then taking the thick/thins <br>from there... but I've been doing it <br>minus the overshoot. <br> <br>Kinda like the Benguiat thing. <br> <br>I call it Nudge 80...a safe way off the <br>Grid Bros. Monoline Express! <br> <br>bj</p>
