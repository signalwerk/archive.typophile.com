    html: <p>&gt;Mortimer Leach - he, for example, drew curves - <br>&gt;1/3 wider than the straight stems. [...] <br>&gt;you can agree with his "method"/method - or not. <br>&gt;and always ask - why 1/3 wider?  <br>&gt;is that fixed? quantitative? subjective? <br> <br>See, in this case (if I understand your questions  <br>correctly), the more we try to achieve "fixed" values  <br>(proportions, weights, etc), the more we get arbitrary  <br>("subjective") ones. <br> <br>I don't know much about Leach's work, so I may be  <br>wrong, but his method sounds highly arbitrary to me,  <br>because it doesn't seem to care about other factors  <br>that might affect optical compensation. For example,  <br>heavy typefaces would need larger (round-shapes)  <br>compensation than thin ones. <br> <br>&gt;a good study is Bodoni and Sheldon [...] <br>&gt;so --- is that fixed? quantitative? <br> <br>I think you kinda answered your own question. ;-) <br>It's not fixed, each typeface has its very own  <br>proportions (horizontal, vertical, weights, contrasts,  <br>etc). And all those little details make them what they  <br>are. <br> <br> <br>&gt;[...] I don't think these are rhetorical questions. <br> <br>They're kinda rhetorical, I think. Like Bj said, there's no  <br>definitive answer. To me, in this case, the questioning <br>*is* the answer itself. ;-) <br> <br></p>
