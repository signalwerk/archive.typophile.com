    html: <p>"Respectable"? Awww, shucks. <br> <br>Look how small my cap height is compared to the lc x-height. The question is, do the caps look too light in actual text? I actually remember somebody complaining about that to me, but being one of the very few people who's seen Patria at 2400 dpi, I'm not sure they need to be heavier... And note that my caps are very tightly spaced. Looser spacing requires darker forms. <br> <br>So they might indeed be too light, but maybe the more important thing I'd note is that your ideal weight increase depends on relative proportions, and spacing. <br> <br>hhp <br></p>
