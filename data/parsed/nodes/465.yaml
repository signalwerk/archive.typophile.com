    html: <p>bj -- <br> <br>As you've said, there isn't a fixed percentage. It's an  <br>*optical* compensation, so you have to *look* and see  <br>what it needs. Some designs might need more, some  <br>might not. It may also depend a little upon cultural trends,  <br>and also perhaps printing technology (see below). <br> <br>If you had asked me I probably would have told you  <br>that I made the Whitman capital stem 110% of the  <br>lowercase. But I see now that I didn't. Go figure. <br> <br>In writing about the cutting of Linotype Monticello  <br>(a revival of Binny &amp; Ronaldson's Pica Roman No. 1,  <br><i>aka</i> Oxford) C.H. Griffith wrote that he was surprised  <br>at how heavy the capitals appeared in contemporary  <br>proofs made with type freshly cast from the original  <br>matrices, compared to specimens from the original era.  <br>The theory he developed was that 19th century printing  <br>technique tended to build up more color on the lowercase  <br>than the capitals and the typefounder then added more  <br>weight to the capitals to compensate and get them to  <br>print more in harmony with the lowercase. But 20th  <br>century technique did not have the same effect and so  <br>the extra weight in the capitals was more pronounced  <br>in his contemporary proofs. The result is that he slimmed  <br>down the weight in the capitals in order to get an  <br>equivalent harmony in Linotype Monticello. <br> <br>I seem to remember Matthew saying that when he did  <br>his recent digital revival of Monticello, he chose to slim  <br>the weight of the capitals even further, relative to the  <br>lowercase, because the capitals of 19th-century style  <br>types (even as adjusted by Griffith in the 50s) still  <br>tended to look too heavy to the modern eye.  <br> <br>I say, Trust your eyes. And if you don't trust your eyes  <br>yet, then train them by looking closely at other typefaces  <br>and developing your own judgement about which look  <br>balanced in the capitals and which do not. <br> <br>-- K. <br> <br></p>
