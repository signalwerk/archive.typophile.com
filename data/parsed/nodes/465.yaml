    date_raw: 7.Jul.2003 12.13pm
    votes: null
    html: <p>BJ, <br> <br>Have you made any headway on your 20-25 fonts? I'd like to see a broader sampling, and more contemporary designs (last 10years) to see how they stack up. <br> <br>I've decided my personal preference is between 103 - 110%. Anything more seems dark to me. Although I must admit my test is flawed. I'm comparing horizontal width of the stem of the h with the stem of the H. This doesn't neccesarily fully take into account the font's modulation. For example, Adobe Garamond. The roman weight is 111%, but text settings don't look dark. I think this is because on the "width of lc 'o' = UC stem" test the caps looked narrow. This tells me the over all color is even, dispite the "heavy" % <br> <br>Hope that makes some sense? <br> <br>Randy</p>
    html_clean: <p>BJ, <br> <br>Have you made any headway on your 20-25 fonts? I'd like to see a broader sampling, and more contemporary designs (last 10years) to see how they stack up. <br> <br>I've decided my personal preference is between 103 - 110%. Anything more seems dark to me. Although I must admit my test is flawed. I'm comparing horizontal width of the stem of the h with the stem of the H. This doesn't neccesarily fully take into account the font's modulation. For example, Adobe Garamond. The roman weight is 111%, but text settings don't look dark. I think this is because on the "width of lc 'o' = UC stem" test the caps looked narrow. This tells me the over all color is even, dispite the "heavy" % <br> <br>Hope that makes some sense? <br> <br>Randy</p>
