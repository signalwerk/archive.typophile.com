    date: 2003-06-30T11:27:00
    date_raw: 30.Jun.2003 11.27am
    votes: null
    html: "<p>Hi BJ, <br> <br>Thanks for starting up this thread. I haven't come to a difinative answer on this yet. I scaled back the caps in my Friday Fonts thread. They went from 112% to 106%. What i wanted was for them to optically look the same. As I got darker in weight, the difference went up slightly. I think the Black weight is 109%. The light weight I recently posted will be around 105%.  <br> <br>Here's what I did with my lunchhour: <br>Adobe Garamond <br>Bembo <br>Bauer Bodoni <br>ITC Officina Serif <br>Neue Helvetica <br>Futura <br>Univers <br> <br>(Rounded to the nearest integer) <br> <br><img src=\"http://www.typophile.com/forums/messages/4101/12350.gif\" alt=\"cap weight comparison\"> <br> <br>Perhaps we will see a trend that serifs have a larger difference? Bembo need to go on a diet! Actually heavy caps has always been a beef for me about Bembo. <br> <br>As far as the Ed Benguiat LC o = UC stem, here are the grades for the roman weights: <br> <br>AGaramond: cap too narrow <br>Bembo: cap too wide <br>BBadoni: cap too wide <br>Officina Serif: exact <br> <br>NHelv: cap slightly wide <br>Futura: cap slightly wide <br>Univers: exact <br> <br>So much for my theory about bolder weights having more % difference between cap and lc! <br> <br>Randy</p>"
    html_clean: "<p>Hi BJ, <br> <br>Thanks for starting up this thread. I haven't come to a difinative answer on this yet. I scaled back the caps in my Friday Fonts thread. They went from 112% to 106%. What i wanted was for them to optically look the same. As I got darker in weight, the difference went up slightly. I think the Black weight is 109%. The light weight I recently posted will be around 105%.  <br> <br>Here's what I did with my lunchhour: <br>Adobe Garamond <br>Bembo <br>Bauer Bodoni <br>ITC Officina Serif <br>Neue Helvetica <br>Futura <br>Univers <br> <br>(Rounded to the nearest integer) <br> <br><img src=\"http://www.typophile.com/forums/messages/4101/12350.gif\" alt=\"cap weight comparison\"> <br> <br>Perhaps we will see a trend that serifs have a larger difference? Bembo need to go on a diet! Actually heavy caps has always been a beef for me about Bembo. <br> <br>As far as the Ed Benguiat LC o = UC stem, here are the grades for the roman weights: <br> <br>AGaramond: cap too narrow <br>Bembo: cap too wide <br>BBadoni: cap too wide <br>Officina Serif: exact <br> <br>NHelv: cap slightly wide <br>Futura: cap slightly wide <br>Univers: exact <br> <br>So much for my theory about bolder weights having more % difference between cap and lc! <br> <br>Randy</p>"
