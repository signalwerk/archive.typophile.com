    html: <p>&gt; C.H. Griffith wrote that he was surprised at how heavy the capitals appeared in contemporary proofs made with type freshly cast from the original matrices, compared to specimens from the original era <br> <br>Is it possible this has to do with gain (which was greater in the past), since a certain [absolute] amount of gain applied to both lc and UC bodies would actually bring them closer in relative weight? (This would also affect stroke contrast, in fact to an even greater extent.) <br> <br>-- <br> <br>BTW, it also happens that caps are sometimes made intentionally much darker than the lc. Usually this happens in very small sizes and/or darker weights, where all-caps setting might benefit from extra punch. I remember David Berlow saying something to this effect on the ATypI list a while back. <br> <br>hhp <br></p>
