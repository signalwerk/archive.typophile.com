  html: <p>Hi all, I'm working on a logotype using <a class="freelinking external" href="http://www.fontshop.com/fonts/downloads/typetogether/bree_complete/" rel="nofollow">Bree</a> and am trying to find a complementary font for use in the rest of the identity package. It's a somewhat unique face so I'm thinking maybe something fairly non-descript? I'm leaning towards wanting a sans but I'm not entirely set on that. Any suggestions very welcome, thanks.</p>
  html_clean: <p>Hi all, I'm working on a logotype using <a class="freelinking external link-external" href="http://www.fontshop.com/fonts/downloads/typetogether/bree_complete/" rel="nofollow">Bree</a> and am trying to find a complementary font for use in the rest of the identity package. It's a somewhat unique face so I'm thinking maybe something fairly non-descript? I'm leaning towards wanting a sans but I'm not entirely set on that. Any suggestions very welcome, thanks.</p>
