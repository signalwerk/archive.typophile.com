      <p>I'd actually been looking at their other typefaces already, good suggestion :)</p>
      <p>I like Karmina but I have a feeling my client is going to lean away from using a serif as they've already shown a preference for sans typefaces thus far in the project. Any thoughts on a sans that might fit Bree? Or I wonder if using Bree with the alternate characters (i.e. not the unique g, k, y, z) might actually work?</p>
