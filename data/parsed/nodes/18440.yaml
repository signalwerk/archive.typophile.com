    <p>I need to find a condensed sans that works reasonably well with Adobe Garamond. The sans face will be used in small size (about 6 to 7 points) inside a CD cover booklet so legibility and line length is an issue.</p>
    <p>I like Storm's Sebastian, but it's too wide.</p>
    <p>Any suggestions?</p>
