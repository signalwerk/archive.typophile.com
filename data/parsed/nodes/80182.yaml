    html: |-
      <p>I've had the same question. You might think Legacy Sans would work, because Ronald Arnholm modeled both sans and serif Legacy on the same Jenson original as Rogers did Centaur; However, Legacy Sans is totally out of scale with Centaur, both as a whole and as to x-height. You'd have to perform surgery to make them compatible.</p>
      <p>Nick, didn't Bringhurst use Scala Sans in Vs 2.4 and 3.0 and of his typographic style book? Don't the modernistic touches in that font jar a bit with stately Centaur?</p>
