    html: |-
      <p>&gt;What sans-serif font would you [...] recommend for the body, if I were to use Centaur Regular for the headings?</p>
      <p>I think, and this goes back to some of my earliest posts on the topic of font family compatibility, if you you just give us one point to think of, like you're using Centaur heads, 360 degrees or a veritable universe of body types are possible. </p>
      <p>If, on the other hand, you give us two points, like you're using Centaur heads for a medical journal... you know what can be drawn through two points.</p>
