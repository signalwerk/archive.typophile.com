      <p>Nick, I had sort of forgotten that little point about titling vs text. In that case, I would go with Legacy sans, which looks fine when not chockablock with Centaur in the text.  My apologies to imightberebecca for being inattentive.</p>
      <p>Also, in speaking of Centaur's form, I had in mind the original, which I think is much better represented in digital form, however imperfectly, by Bitstream's Venetian 301, rather than the clumsy Monotype version, which does deserve your aspersions.</p>
