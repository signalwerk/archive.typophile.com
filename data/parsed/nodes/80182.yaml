    html: |-
      <p>PJ, are you taking relative size into account?<br>
      The request is for a body text sans to accompany Centaur at display size.</p>
      <p>As soon as Centaur acquires any size, its details start to make it look chiseled and horsey, as if drawn with a big old pen on rough paper. That's not stately.</p>
      <p>Therefore, an angular, humanist sans such as Seria Sans or Fedra, at a smaller size, will harmonize with it.</p>
    html_clean: |-
