    html: <p>About Seria Sans - I look at it and see great concentration and care being taken in drawing those verticals. I think, though, that it's another sans which is perfectly well scaled on its own, but seems all of a sudden over-large, even gross, in company with Centaur, like Shrek with Fiona before she morphed. A quest is in order.</p>
