    <p>This is for the recently canned, the belatedly laid off, the retired, the dismissed, those tired of taking orders, those baffled by human behavior and anyone who wonders what to do when.  I put my 30 years of experience into the book I needed when I started freelancing, but those who need it most might miss it. Originally titled “The Freelance Survival Guide” (the publisher renamed it to appeal to a broader market and fit into their “Start &amp; Run” series) it’s filled with information, encouragement and guidance for the free-fall of self-employment.  “Start and Run a Creative Services Business” is the new title—nothing I would’ve picked up when I was in school.  </p>
    <p>Of course, my favorite chapter is Nine Sure Signs You’re Not Getting Paid,but of broader interest is the chapter filled with sage advice about professional practices, information on the creative process in general and current issues surrounding theft of creative product.<br>
    Here is the table of contents for your review, and excerpts are accessible on my homepage by clicking on the book icon:</p>
    <p>&gt;&gt; Getting Started<br>
    &gt;&gt; Creating Your Work Environment<br>
    &gt;&gt; Take a Personal &amp; Portfolio Inventory<br>
    &gt;&gt; Keeping Your Clients<br>
    &gt;&gt; Identifying &amp; Targeting Your Market On-line<br>
    &gt;&gt; Partnering Alliances<br>
    &gt;&gt; New Business Cold Calling Tips<br>
    &gt;&gt; Negotiating with Vendors<br>
    &gt;&gt; Nine Sure Signs You’re Not Getting Paid<br>
    &gt;&gt; Fees and What to do When Clients Don’t Do the right thing<br>
    &gt;&gt; Scoundrels &amp; Scalawags, Piranhas &amp; Barracudas<br>
    &gt;&gt; Life Rafts for the Drowning<br>
    &gt;&gt; Sage Advice from a Veteran<br>
    &gt;&gt; Online Resources you can use</p>
    <p>I’m afraid with the new title it will be missed by the people who can use it<br>
    most—so I’m out here beating the bushes hoping to get the word out.  If you’ve read this far, you deserve a free cartoon at my site called Melon at the Plaza. Click on complimentary cartoon or the book icon.</p>
    <p>Thank you for your time.</p>
