    html: |-
      <p>This is cool, but, really, nothing new. Rendering text as images via a web server has been around for quite a while.</p>
      <p>While this is fun, for true web use, it’s not ideal, as image based text just isn’t as accessible...which is a primary benefit of using the web.</p>
      <p>That said, you could improve upon this a bit by making sure that you also render appropriate alt attributes for the images that are created. </p>
      <p>Also, I’m thinking GIF files would likely be a better option for type.</p>
      <p>BTW, the hand-rendered typefaces are lovely and I’m sure there’s a market for this.</p>
