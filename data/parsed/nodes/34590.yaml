    <p>We are a swiss graphic design studio and wanted to share with you our latest typographic project, <a href="http://www.fontself.com/" target="_blank">FONTSELF</a>.<br>
      It allows new kind of possibilities in the print and electronic design processes.</p>
    <p>Do not miss our latest demos as well:<br>
      <a href="http://www.fontself.com/demo/newsmaker_en.php" target="_blank">http://www.fontself.com/demo/newsmaker_en.php</a><br>
      <a href="http://www.fontself.com/demo/writemaker_en.php" target="_blank">http://www.fontself.com/demo/writemaker_en.php</a></p>
    <p>Any comments or questions are welcome!<br>
    It is still an ongoing project, but check the website for all the details...</p>
    <p>No release date yet, but expect a progressive evolution of the project.</p>
