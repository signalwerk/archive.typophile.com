  html: |-
    <p>In my sophomore year (now a senior) we were required to make a typeface. Although that was just the beginning of the assignment, the second parts like making a specimen, won't help me now. Needless to say, since that class I've fallen in love with type. Researching, reading, but never producing anything.</p>
    <p>I've decided that as a personal project, I would like to revisit what I originally called December and take the forms created in illustrator and turn them in to an actual font. Lowercase, numerals, so on and so forth. I've picked up "Learn Fontlab Fast" and I'm about to dive in over the weekend. I have some sketches for lowercase, and already plan on refining some of the shapes. But I figured why not see what the masters at typophile have to say. </p>
    <p>I've attached two images, one of the grid and one of a setting I did while I was working on the other parts of the assignment. I've learned a lot since then, I can already see problems with parts, but fresh eyes might see something I'm missing.</p>
    <p>Thanks for your help, and I look forward to becoming more and more involved with type design and this fun place.</p>
    <p>-MDF</p>
