    <p>Well, figured I'd post it up in here for some suggestions before turning in my rough comp in 2 days... TEAR IT APAAAARRRRRTTTT!!!!</p>
    <p>Sssignment specs:<br>
    1. complete name of font must be clearly spelled out in at least one place on the poster<br>
    2. the poster is to be completed using type only, and no "cutesy contrived images".<br>
    3. establish a very <strong>strong</strong> grid and build your piece on that grid.</p>
    <p>So after the thumbnail critique from the teacher today he suggested I go with the first PDF I'm posting, and the 2nd PDF is just a bunch of really rough basic designs I whipped out.</p>
    <p>so yeah.... go to town (PDF's are attached)</p>
    <p>(FYI typeface used is "krone", a spinoff of ITC Korinna, while I was assigned Katrina, another spinoff of ITC Korinna)</p>
