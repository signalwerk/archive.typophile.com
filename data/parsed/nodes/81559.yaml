  html: |-
    <p>What is the attached font?</p>
    <p>It's from the letterpress lab at the university of oregon. It is 15 pica sans serif. It is not labeled, and it bares no foundry stamp or company insignia. It is most likely older than 1965, and could be as old as 1900.</p>
    <p>It only exists in caps, although there are a few varying figures. (two types of A's, etc.) I tried to pick the figures with a similar grain pattern, the thought being that they would be of the same shipment of type.</p>
    <p>It is possible that this font has not been digitized, but any help you guys can offer would be amazing!</p><div class="imageWrap"><img src="http://typophile.com/files/woodsanssmaller_4592.jpg"></div><p></p>
