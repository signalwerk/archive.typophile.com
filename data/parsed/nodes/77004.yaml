      <p>@polymeris: “<em>I have an hypothesis about word readability I have been developing</em>…”</p>
      <p>What is your hypothesis?</p>
      <p>Taking a new study like the one Kevin mentioned and looking at it's reference section is a great way to start a literature review. An alternative strategy, if you or any of your colleagues have access to the Web of Science Citation Database is to find an old study of relatively high profile and create a citation map. This shows you every article that referenced it in the future. By using both methods you end up attacking the problem from two sides at once. One of the older studies I have come across:</p>
      <p>Roethlein, B. (1912). The relative legibility of different faces of printing types.<em> The American Journal of Psychology, 23(1)</em>l, 1–34.</p>
      <p>And while many of his studies are confounded, Miles Tinker is also a good place to start as most of his writing is an easy read.</p>
      <p>See also:</p>
      <p>Garvey, M., Pietrucha, T. &amp; Meeker, D. (1997). Effects of font and capitalization on legibility of guide signs. <em>Research on Traffic Control Services: Transportation Research Record-series, 1605</em>, 73–79.</p>
      <p>Zineddin, A., Garvey, R. &amp; Pietrucha, M. (2003). Effects of practice on font legibility. Proceedings of the Human Factors and Ergonomics Society 47th annual meeting.</p>
      <p>Zineddin, A. (2002). The impact of familiarity and word-superiority effect on large format text applications. Unpublished dissertation. Pennsylvania State University.</p>
      <p>I believe Zineddin still works with the Federal Highway Administration in Washington DC, but it has been some time since we have spoken. He is very personable and was more than willing to share his work with me.</p>
      <p>Good luck.</p>
