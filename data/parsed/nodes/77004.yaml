      <p><em>...my own effort to maximize reading comfort..</em></p>
      <p>Bill, we all do that.<br>
      In fact, your approach to Caslon was very similar to mine re. Scotch Modern, a genre which you consider to have poor readability.<br>
      I don't believe our approach was informed by scientific empiricism or scientific readability theory in any way (as opposed to long established theories of readability held by the typographic trade), it's just post-facto rationalization of what is quite simply a type revival done according to one's personal taste, facilitated and informed by the state of the art at a particular point in time -- that is to say, what is technically and economically feasible.</p>
      <p>Did you do empirical testing during font development?<br>
      AFAIK, the only legit type designers who have are James Montalbano (Clearview) and Jason Smith (Mencap).<br>
      However, I'm not sure how truly scientific Smith's work was, or whether it was more along the lines of focus group research.</p>
      <p>**</p>
      <p>I recently came across some interesting paragraphs in <em>The Shocking History of Advertising</em> (1952) by E.S. Turner, set in Times Roman BTW.</p>
      <p>"The leading writer on psychology in advertising (which was taken rather more seriously in America) was Professor Walter Dill Scott, Director of the Psychological Laboratory at Northwestern University, Chicago. His book <em>The Psychology of Advertising</em> was issued in Britain in 1909.</p>
      <p>"In the previous century psychology had been an abstract study, couched in intimidating jargon. In order that practical use might be made of its conclusions, 'psychological laboratories' like the one at Northwestern University had been set up, and those psychologists who could pass on their knowledge in simple terms had begun to address advertising clubs. Many of the truths they announced had been discovered, empirically, generations ago. It is open to argument whether the psychologist gave the advertiser new ideas, or whether he merely told the advertiser which of his ideas were good ones (which the advertiser probably knew already)."</p>
      <p>Note that the author equates empiricism with general practice, rather than laboratory experiment!</p>
      <p>In assessing the relevance of readability science, and attempts to use it to prescribe styles of typeface or typography, it should be borne in mind that similar attempts to influence behavior -- which is the true nature of the agenda -- "better advertising through science", have been going on for over 100 years, with extremely limited success. A little awareness of the cultural nature of the endeavor might perhaps give some pause to any belief that "readability science" is of any practical use at all in typography, or ever will be.</p>
      <p>Consider the sitability of chairs.<br>
      The sleepability of beds.<br>
      The driveability of cars.<br>
      The walkability of shoes.<br>
      The wearability of shirts.<br>
      The memorability of names.<br>
      The lookability of makeup.<br>
      The cookability of vegetables.<br>
      The drinkability of beverages.<br>
      "Readability" is not a scientific term.</p>
