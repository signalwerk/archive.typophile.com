      <p>Sofie Beier used empirical measures to test the letter recognition rates of different letter designs in three different typefaces. The typefaces were all new designs, and the empirical data was used to create the final designs. Two methods were used to reach her findings, a distance threshold (as with Clearview Hwy) and a time threshold.</p>
      <p>Beier, S. &amp; Larson, K. (2010). Design Improvements for Frequently Misrecognized Letters. <em>Information Design Journal</em>, 18(2), 118-137.</p>
