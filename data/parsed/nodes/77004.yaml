      <p>As I said, it's a question of personal taste, which we share.<br>
      These faces are about the love of old letterpress, and trying to port that quality into the digital realm.</p>
      <p>Here I compare Scotch Modern with a typical digital rendering of the didone style.<br>
      Like you, I have not simplified and cleaned up the glyph, but attempted to incorporate the trace of the letterpress process, with a rounded finish, not square cut. Also, I have kept the horizontal flow I saw in the original. And varied the width of hairlines/serifs.</p>
      <p>The micro-detailing we have employed is a contemporary, practical method now, with pre-press and press gain being so small in the digital, high-res (offset lithography) workflow.</p>
      <p>As "independent" designers, these face of ours are not typical, in the way that, say, Adobe fonts of these genres are geared towards a broad corporate market that company represents, or Font Bureau types of these genres target the periodical market. (Even though FB publishes your Caslon.)</p>
      <p>I would say these are the deciding factors in our common approach, not anything we've read about reading theory.</p>
      <p> </p><div class="imageWrap"><img src="http://typophile.com/files/minimum_3922.png"></div><p></p>
