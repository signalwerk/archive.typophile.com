    <p>Hello everyone,<br>
    I am an amateur typographist, enthusiastical but not very experienced. I'm pleased to find this forum, in hope I may learn a little.</p>
    <p>I have an hypothesis about word readability I have been developing, and putting into practice creating a variant of a standard typeface. I am almost done with that. But before I go into details and publish either the modified type or my assumptions, I'd like to empirically test them!</p>
    <p>Do you have any ideas how one would go about that? Any established methods?</p>
    <p>I figured I could put up a webpage that would flash words taken randomly from a dictionary file, rendered in either the original type or the variation, and then queries people to see if they can remember the words. See is if there is any significant difference... What do you think?</p>
    <p>Just to clarify, with "word readability", I mean the ability to quickly recognize words, abbreviations, etc. (but not long sentences) written in the type, in a setting e.g. on the road, where time matters and conditions may not always be ideal. Not books or small type.</p>
    <p>Thanks in advance for your comments!</p>
