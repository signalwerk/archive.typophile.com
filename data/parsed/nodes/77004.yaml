      <p>I am on the trail of finding who first distinguished between readability and legibility, and I think it was a scientist, but I have yet to confirm that. </p>
      <p>If we define legibility as the ability to distinguish one letter from another quickly in isolation, and readability as the ability to read whole words quickly, comfortably, and with good comprehension, I think the scientific validity of the distinction is shown by the first visual in the article I linked to, among other things. There a word with individually highly legible letters is very difficult to read. </p>
      <p>As I explained in the article, the only experimental testing in developing the font was with my own eyes. I agree with you about the poor results of research so far, but I am not dismissive of the promise of future research efforts, as you are. Based on the success of scientific methods in other fields, I am optimistic that such research will eventually bear fruit. </p>
      <p>I don't see how our processes could have been identical, since we bring standards that are in a few points in conflict, and those differences show in the final results.</p>
