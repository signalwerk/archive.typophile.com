      <p>Nick, we both were concerned with ink spread, but that was by no means my only concern.</p>
      <p>You write, "It's a question of personal taste."</p>
      <p>My decisions were not only a question of taste, but also of my being guided by my theories of readability, as partly explained in the article. There were developed by reading, reflection, discussion with others, looking at type, and drawing type and testing it. </p>
      <p>My theories are not the same as yours, and so my process somewhat different as well. It's not only a matter of taste.</p>
