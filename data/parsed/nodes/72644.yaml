    <p>Hello! I'm starting a project for the development of studying materials for children with learning disabilities, and I was wondering if any of you could direct me to (or has any knowledge of) studies on typography for these specific subject.<br>
    I was thinking that the most appropriate would be the use of a clear and simple "ductus" but I've never done anything like this and all the help you could give me would be great!<br>
    Thank you so much!</p>
