      <p>Dear Gerry and Mr. Shinn, thank you for your answers. The first text I read was that of Kevin Larson (from Microsoft I believe), and he talks about the "poor" importance of word shape recognition in comparison with serial letter and parallel letter recognition theories... then I found a number of papers about the subject but none seemed to me to be of great seriousness, that's why your references are important (if you don't know where to look, the web won't tell you... ). My job is to find a typeface that will be used to help children learn to read with exercises/games (there's no long text reading involved), children with learning disabilities, and as far as I've searched there is no real study on this, even for dyslexia experts seem to differ a bit too much on their studies.<br>
      My first thoughts are those of intuitiveness, but there are so many opinions about this that I can't find an answer... I'll "dig" into the names you've given me now and hope to see some light...<br>
      Thank you*</p>
