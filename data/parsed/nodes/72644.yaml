      <p><cite> to help children learn to read with exercises/games (there's no long text reading involved)</cite></p>
      <p>I think that the design of the games and exercises is the most important thing, then the use of illustrations and non-representational elements (e.g. arrows) in combination with the layout. Typefaces are not that important in this context. For example, do your images show nouns, verbs, or abstracts? Do the children read the image before the text, and how much can they infer? And so on. </p>
      <p>Apart from Myra's work, which is directly relevant, I am reminded of research done by Guille Noel in Edmonton and Parma on games to help recovering patients with aphasia.</p>
      <p>Good luck!</p>
