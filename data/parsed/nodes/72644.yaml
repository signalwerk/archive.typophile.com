      <p>Firstly, when you talk about printed material for children you need to be clear about the separation of typefaces to read in, and typefaces that may be used as models for writing from.<br>
      Secondly, there is a lot of research in this field. Start by looking up people like Rosemary Sassoon (has a number of books published, and a PhD, on related matters), Sue Walker's <a class="freelinking external" href="http://kidstype.org" rel="nofollow">Kidstype project</a>, the work of researchers like Myra Thiessen, Ann Bessemans, and others. There are also studies by designers developing specifically with writing system acquisition in mind (e.g. Hans Eduard Meier's Schulschrift). Florian Hardwig (with Rosemary's contributions) hs done interesting work on this side of things. This stuff is off the top of my head, there's much more around.</p>
      <p>One more thing: I'd be very careful with any claims any designer makes about their typeface being better for readers with this need or that special condition. Typeface like Mencap, Teiresias, Read, Sylexiad (and others whose names escape me) make -- to different degrees -- all sorts of claims that they are research-based. Even if there is some research behind them (because some are just based on "designer's intuition") it is often pretty straightforward to see that the research is looking at the wrong thing, or making fundamental assumptions to facilitate the experiment which in reality invalidate the results. In most cases researchers investigate what is most accessible to measurement, rather than what is relevant. Very few at all look into the design of documents at the level of the spread, rather than the letter -- and even fewer combine research into typography and research into the language used.</p>
      <p>Aaaanyways, opinions are like the proverbial, so what do I know? But do look into this seriously, there's a lot of material around.</p>
