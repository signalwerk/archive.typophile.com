      <p>Dear Mr. Shinn, thank you!<br>
      There is a story behind every character, and when you buy it you can read about it: The red heart is called MO (from eMOtional), she carries all the little emotions. The blue shutter box is called GU (from lanGUage), he can't stop talking. The orange bunny is called MI (from autonoMI), he's the tallest, oldest and most helpfull.  The cloud is called CI (from soCIal), she's fluffy and warm and loves hugs.</p>
      <p>There were a number of reasons for using Sassoon, just as an example it has the 7 (seven) with the horizontal bar in the middle and that's the way we write it... And those exit strokes you talked about are very close to the way our primary teachers write and teach to write! ohh and it looks great with different kerning adjustments!</p>
      <p>For know there is no digital version, and it is only sold in Portugal and Spain. It would take a while to put it in other languages because this involves linguistics and reading/writing therapists...<br>
      The best seller is the Sound Safari... kids love animals... :)</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/CAD07_5215.jpg"></div><p></p>
