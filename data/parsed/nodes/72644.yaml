      <p>Gerry is right, the research that designers of faces for the reading-challenged do is really just product development. It's useful up to a point, but AFAIK, none of these faces have been tested against popular and well-established faces such as Futura, Frutiger, Verdana, Arial, Clearface, or Comic Sans. Yes, Comic Sans; I doubt any serious researcher, or typographer, would consider it a prime candidate for a "readability" face, on account of its name and reputation, and yet why not?--theoretically it checks off a lot of boxes for a readability face. Clearview has been the most rigorously tested of faces (for highway signage), but do those results translate for small text?</p>
      <p>At least FS Me (for Mencap) has been designed by an established type designer (usually these faces are amateurish clunkers), and it's interesting that Jason Smith has given it a contemporary look -- not just for purposes of branding, but to facilitate readability "at the level of the spread".</p>
      <p>Many of the typeface readability research results that are bandied about use the RSVP (Rapid Serial Visual Presentation) method. Ask yourself how much relevance that has to reading a book.</p>
