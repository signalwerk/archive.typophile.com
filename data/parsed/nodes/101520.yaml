    <p>Dear typophile people!</p>
    <p>Now, for the first time, you can see something concrete from GlobalType. Here is a first layout consisting out of six POIs (Points Of Interest).</p>
    <p>Requirements:</p>
    <p>1. GoogleEarth has to be installed in an actual version.</p>
    <p>2. The oceanographic map of Marie Tharp and H. C. Berann should be activated. If you don't use it yet, you may find it here:</p>
    <p>3. The KMZ file that you can download using the following URL can, after the download, be opened with a double-click. This should open GoogleEarth and imports the GlobalType POIs into the sidebar. This should work with Windows, Macintosh and Linux.</p>
    <p>I hope somebody of you may find the time for making expeditions in this collection, telling me your impressions here. Don't care that the text is in German language, you later will find localized versions. Please tell me if you are running into problems.</p>
  html_clean: |-
    <p>Dear typophile people!</p>
    <p>Now, for the first time, you can see something concrete from GlobalType. Here is a first layout consisting out of six POIs (Points Of Interest).</p>
    <p>Requirements:</p>
    <p>1. GoogleEarth has to be installed in an actual version.</p>
    <p>2. The oceanographic map of Marie Tharp and H. C. Berann should be activated. If you don't use it yet, you may find it here:</p>
    <p>3. The KMZ file that you can download using the following URL can, after the download, be opened with a double-click. This should open GoogleEarth and imports the GlobalType POIs into the sidebar. This should work with Windows, Macintosh and Linux.</p>
    <p>I hope somebody of you may find the time for making expeditions in this collection, telling me your impressions here. Don't care that the text is in German language, you later will find localized versions. Please tell me if you are running into problems.</p>
