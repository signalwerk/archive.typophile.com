      <p><cite>What’s paradoxical about something like a Bold-Italic style<br>
      in a font is that people will howl when it’s missing, but on<br>
      the ground they almost never need it!</cite></p>
      <p>Yes, indeed, I think you’ve put your finger on it!</p>
      <p>But . . . I can also sympathize with the frustration on that occasion when it turns out you need it and it’s not there. For example, more than once I’ve spec’ed heads in one of the bold Bureau Grotesques after having carefully grilled the editor or scoured the manuscript to make certain that there aren’t any book titles or emphasis in a heading — only to have an eleventh-hour edit or AA introduce something that absolutely *must* be italicized. Very frustrating.</p>
      <p><cite>How difficult is it to test drive fonts from Font Bureau? I noticed they have that option.</cite></p>
      <p>Blake — Yours seems like a very serious and sincere exploration. I know that FB does work out test licenses on occasion. It’s not my place to make any promises; I’m just a freelancer. If you have good control over your design and production team and fonts don’t stray out of the office, then give the Font Bureau a call and talk to Harry Parker. He can give you the low-down on test drives. He’s typically in the office afternoons and into the evening, Eastern time.</p>
      <p>— K.</p>
