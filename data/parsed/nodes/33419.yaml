      <p>Blake — I thought the Bold Italic might make a difference. That’s why I mentioned it.</p>
      <p>I can’t speak for others about omitting the bold italic, but for me, I never expected Whitman to be so well received. My personal focus is on book work, and I almost never use  bold italic. I expected the face to appeal only to a few others with similar needs. </p>
      <p>Frankly, I was more interested in getting the initial fonts released, and then possibly doing the bold italic later, if there was call for it. In restrospect, this was probably a bit short-sighted, but I’d already spent about two years on the design and I really wanted to see some return before investing in more styles.</p>
      <p>There was a brief bit of internal debate at FB about releasing the family without the bold italic. And Mike Parker told me the cautionary tale of Ruzicka’s Primer, which was released without a bold and never got one, which Mike argues really hurt its success. I promised that I would get to it after we’d had a chance to see how well Whitman was received.</p>
      <p>Then, as fate would have it, I became immersed in an all-consuming director job for a couple years.</p>
      <p>So, I’m only now coming around to finish up the family. Better late than never, I suppose.</p>
      <p>Also, from conversations I’ve had with other colleagues, Bold Italic is held by many to be something of the ugly step sister in most families, and many designers dislike doing them. It seems this is often the first style passed off to interns or assistants.</p>
      <p>— Kent.</p>
