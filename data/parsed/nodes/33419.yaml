      <p>Blake —</p>
      <p>While you’re contemplating your decision, you should know that I recently completed <strong>Whitman Bold Italic</strong>, along with <strong>Semibold</strong> and <strong>Semibold Italic</strong>, for a Font Bureau client. These should end up in their Retail library pretty soon. (I know a lot of people have been waiting patiently for these.) Corresponding small caps fonts are also in the works.</p>
      <p>If you need more information sooner rather than later, you can contact Harry Parker at the Font Bureau.</p>
      <p>You may also be interested to know that I’m in the final stages of the <strong>Whitman Display</strong> family, an expansion of some custom work that was done for the <cite>Tacoma News Tribune</cite> and <cite>Minneapolis Star Tribune</cite> newspapers a few years ago.</p>
      <p>Here are a few first-ever public previews:</p>
      <p></p><div class="imageWrap"><img src="/files/WhitmDis_ShowingBeta_6550.gif"></div><p></p>
      <p></p><div class="imageWrap"><img src="/files/WhitmDisCond_ShowingBeta_5168.gif"></div><p></p>
      <p></p><div class="imageWrap"><img src="/files/WhitmDisComp_ShowingBeta_4447.gif"></div><p></p>
      <p>I can’t tell you the timing for eventual release; but if you’re interested, Harry could help you there as well.</p>
      <p>Incidently, Whitman and Bliss were introduced to each other in the <cite>Virginia Quarterly Review</cite> in late 2003, and from what I can tell, that marriage is still healthy and happy.</p>
      <p>— Kent.</p>
