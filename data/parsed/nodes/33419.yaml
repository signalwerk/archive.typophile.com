      <p>Ooh, bold italic! That was the main concern we had with Whitman. Now it’ll be a serious contender. Thanks Kent!</p>
      <p>Why are so many contemporary serif fonts omitting a bold italic face? I noticed at least a few other good faces without a bold italic. What gives? On occasion when I use reversed type, I’ll use the bold weight for legibility purposes. With as many books and publications we mention in our text, a bold italic is a must.</p>
      <p><a href="http://www.blakedinsdale.com">—Blake</a><br>
      <a href="http://illumination.missouri.edu">Illumination magazine</a></p>
