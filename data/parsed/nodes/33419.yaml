    <p>Hello,</p>
    <p>I’m just getting started on redesigning a university’s research and arts magazine. Wide variety of readers, from young adults to old folks. I want the new look to be contemporary, sophisticated, unique. We’ve been using mainly Janson and Univers since the magazine’s introduction about a decade ago.</p>
    <p>A few fonts that I’m taking a closer look at:</p>
    <p>Serifs: Whitman, Kingfisher<br>
    Sans: Bliss, Apex new, Klavika</p>
    <p>Whatever sans we go with will need to be a fairly extensive family.</p>
    <p>Any suggestions on either serif or sans serifs? Or combinations?</p>
    <p>Thanks!</p>
    <p>Also, out of curiousity, does anyone know a ballpark figure for what custom faces cost? Probably out of our league, budget-wise, but I didn’t see any info on Hoefler’s site.</p>
