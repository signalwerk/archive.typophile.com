    html: |-
      <p>It's Impact, or Knockout 68.  --With a gradient, beveling, and a very heavy shadow.  </p>
      <p>They may have also modified it, because the resolution for television is so low that you often can't have a lot of variation in the stroke or letter-form on a non display face.</p>
