  html: |-
    <p>Hi</p>
    <p>I am working on a brochure with very narrow columns and our client doesn’t want the very long E-mail and URL addresses to be hyphanated. I can’t set them in a smaller size and they will obviously not shorten their addresses. Is there a miracle solution?</p>
    <p>By the way I’ve seen in Dot dot dot magazine that they encapsulate URLs in &lt; &gt; symboles. Just like this  &lt;www.dot-dot-dot.nl&gt;. Is this a typographic standard?</p>
