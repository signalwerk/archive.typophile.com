      <p>Hi Sebsan!</p>
      <p>The only thing I can think of is to omit the ‘www’ part from the URL - check first that the server can cope with short URLs eg. ‘typophile.com’ because it can sometimes be a problem.</p>
      <p>This doesn’t really help with email addresses though… make sure you don’t hyphenate them, your client won’t thank you for it!</p>
      <p>Si</p>
