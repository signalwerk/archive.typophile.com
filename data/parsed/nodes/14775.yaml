    html: |-
      <p>It’s not a typographic standard as such, but the way some mail programs show url’s — in the same way as underscoring.<br>
      But I do think it’s an elegant solution to your problem. The only thing that could be bothersome is hyphenation: I think that’s undesirable (could be confusing!), so don’t use it and doublecheck all url’s in your text before going to print…</p>
