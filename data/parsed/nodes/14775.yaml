      <p>The Modern Language Assotiation (MLA) puts out a <a href="http://en.wikipedia.org/wiki/The_MLA_style_manual">style guide</a>.</p>
      <p>I believe the MLA standard is <em>not</em> to include web addresses in body copy, but to list them in something such as a bibliography or list of references. I think that web addresses in running copy look really ugly, but how to get around it…?</p>
