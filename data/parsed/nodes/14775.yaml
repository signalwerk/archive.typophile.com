    html: |-
      <p>“…Just like this . Is this a typographic standard?”</p>
      <p>Some applications used the bracketing with greater/lesser than as a way to automate creating links from URLs in text. This is less of an issue now since most apps are smart enough to make links on the fly.  In printed documents, the advantage is that you know the beginning and end.  This does not help your problem when you have long URLs.  The only solution is using one of the phonebook fonts (perhaps Telefont) which are designed for use at small sizes.</p>
      <p>ChrisL</p>
