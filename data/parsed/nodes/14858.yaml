      <p>I wonder why the brown? I think I might like a stronger color to go with paul &amp; the blue in the backgrounds of the photos. What about some sort of Fushia purple or red? It’s hard to know if I am seeing the real color you intend of course… Photos-wise I think I like the blue backgrounds best. Any chance they could all be blue? In terms of layout the U bothers me a little because the bowl of the ‘u’ isn’t as plain as the openings in the other letters. Maybe the photo could blend into the background a bit towards the edge. Actually. Did you try black letters ( or deep grey ) &amp; a white background? That might be sweet. What about breaking the thing into 4 rectangles like this:</p>
