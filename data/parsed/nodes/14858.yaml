      <p>Now we’re rolling - so far I have played with Ebens ideas - the bowl of the u is slightly altered to appear a little more regular. I really like the blue background thing so I replaced the top and bottom photo backgrounds - the masking is down and dirty right now - nothing like masking hair! I like the white with black text - but unfortunately the suits seem to think that we have to get our moneys worth out of the ink we use - so white space here is generally a no no. We shall see. Perhaps Dans idea is the answer to this although in my mind it gets a little busy - you never know…<br>
      <a href="http://pages.sbcglobal.net/pbc1313/temp/temporary.html">adverts</a><br>
      thanks and<br>
      peace</p>
