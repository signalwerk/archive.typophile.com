  html: |-
    <p>With Photina designed to be a good pairing with Univers sharing a similar x-height, is there a proper way to use these two in the digital domain?  What I’m running into is 18pt Photina is not 18pt Univers.  Is there a proper convention of offsetting these sizes so that they line up properly?</p>
    <p>As far as I know there’s only one digital version of each, Monotype and Linotype respectfully, so pairing specific digitizations of these typefaces seems out of the question.</p>
    <p>Any advice on this matter is greatly appreciated.  Photina italic shreds.</p>
