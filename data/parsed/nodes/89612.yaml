    <p>I still have a few glyphs left and some cleanup left to do with extra points that I'll be working on later, then trying to find a place to put it up for sale(Any suggestions?). Line height(As in next line spacing) was getting wonky when I was playing with it in illustrator while mixing different type sizes, but it was fine in In-Design.- So, I am not entirely sure what's going on.</p>
    <p>Is the spacing between lines calculated by ascender, descender, caps height, x-height?</p>
