    html: |-
      <p>Updated with png previews for now. I'm trying to re-work my display specimen right now so it looks more visually appealing. I have about four different places that I am going to try submitting this one to.</p>
      <p>- Changed the lower waist on the H.<br>
      - Changed the Y to more of a square structure. This made a big difference, made it feel more complete.<br>
      - Reworked the X as well, more narrow and line weight made it feel more uniform.<br>
      - Changed the diagonal weights, also another big improvement.<br>
      - Finished metrics and kerning. (Probably could use a bit more fine tuning, but overall I think it's ready to submit).<br>
      - Scaled down asterisk.<br>
      - Scaled % sign down to CAP height.<br>
      - I forgot to put the Yen symbol on this one, but I fixed the line weight on that, kept it as a normal Y shape.<br>
      - Completed the remaining glyphs out of the default 245 glyphs. </p>
      <p>The K didn't seem to work at all when I moved the waist down.- It felt disconnected and strange.</p>
      <p>Thanks everyone for their feedback so far- It's amazing what small changes can really do when you put them all together.</p>
