  html: |-
    <p>Hello everyone, </p>
    <p>This is a logo that I'm working on for my church (translated from Romanian as Independent Baptist Church). I’d greatly appreciate your input in this design. </p>
    <p>Some additional information: the church is conservative, yet friendly. The “tagline” to go with the logo is “Building on the Word” (a reference to the Bible, obviously). The font I’m currently using is Amerigo BT. </p>
    <p>Thank you in advance for your help. </p>
    <p>Dan</p>
