      <p>The open book part is a nice mark. Have you played with flatter ends on it?</p>
      <p>The serifs on Amerigo are sharp and angular, they don't seem to compliment the open book. Since all the letters are connected,my eyes want to see the letters spaced a little further apart. I had to read it twice before I actually figured out what it said. Something about the N and A forms an M to me</p>
