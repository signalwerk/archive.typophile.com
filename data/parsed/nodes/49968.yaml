    <p>Hello Typophiles:</p>
    <p>I need some help to get my German on!</p>
    <p>I'm setting a book in StormType's Walbaum Text with Optima all-caps titling, but there are several places where I'd like to use Walbaum at titling sizes.</p>
    <p>I like Storm's cut because they softened the face with slightly rounded edges of the serifs. The serifs also have slightly "scupped" top and bottom faces. I think this gentle flaring of the characters works nicely with Optima's bell-bottom-wearing profiles. But, Storm's cut is meant for use at 11-point and below - these rounded shapes look too chunky when enlarged.</p>
    <p>Does anyone know of a cut of Walbaum that has thinner and perfectly square serifs like H&amp;FJ's gorgeous Didot for use at display sizes?</p>
    <p>I suppose I could sneak a little Didot in where needed (purists gasp here), but it's got that Frenchy look.....and this is a book about German philosophy no less (Kant, Schopenhauer!)</p>
    <p>I may just have to settle for using tiny tracked-out Walbaum small caps subtitles under Optima titles...</p>
    <p>Thanks - DiSH</p>
