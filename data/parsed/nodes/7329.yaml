  html: "<p>Would anyone be so kind to help me with my problem: how to build a CE font with all of these Central European characters such as a ogonek, e ogonek and so on? I use Fontographer 4.5, I drew all the glyphs, but when it comes to generating a font - I am helpless. My font works perfectly on screen, but when I tried to use it in InDesign and print something, it just didn't work. <br> <br>I am really desperate, so I would appreciate any kind of help. many thanks in advance.</p>"
