    html: "<p>Fontographer is not the best tool to create CE fonts. I am afraid you'll have to do fonts in FontLab. The only way to create working Type 1 fonts with CE characters in Fontographer is to name all glyphs correctly: a ogonek as \"aogonek\", C caron as \"Ccaron\" etc. You have to rename all glyphs manualy. Also the order of glyphs is important, it should follow the order in CE encoding for Mac (Mac CE) or PC (CP 1250).</p>"
