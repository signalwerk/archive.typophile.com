    html: <p>Hi <br> <br>The specimen you show for the Plantin Regular does not at all correspond to the original metal Plantin 110. I'm looking at one of the Monotype Corp Ltd spec books. In fact, in the lining "alternate" numerals, the Plantin has ball terminals!!! <br> <br>Don't know if the digital wizards would have switched in the Italian Old Style figures, or something similar. Good catch on your part though. <br>Sort of a shame they would have screwed around with this. <br> <br>Goudy was a bit long gone before digital so I doubt he had anything to do with this.  <br> <br>Gerald</p>
