    html: <p>Mostra Nuova is definitely your best bet —&nbsp;to replace Market Deco too. If you want something with less character maybe <a href="http://www.fontshop.com/fonts/singles/monotype/burin_sans_std_regular/" rel="nofollow">Burin Sans</a>, <a href="http://www.fontshop.com/fonts/downloads/fountain/dessau_pro/" rel="nofollow">Dessau</a>, or a <a href="http://www.fontshop.com/fontlist/alternatives/futura/" rel="nofollow">geometric sans</a>.</p>
