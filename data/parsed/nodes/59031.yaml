      <p>The most basic reason I can think of is to help the reader find his or her place in a book, especially if the title is on the verso and the section or chapter name is on the recto. Another reason would be if a page gets separated from a book, to easily identify it.</p>
      <p>But here's an article on running heads, by John D. Berry, which goes into a lot more detail: <a href="http://www.creativepro.com/article/dot-font-running-heads" rel="nofollow">How to deal with those little scraps of text on a page that tell us what document we're reading, and where we are in it.</a></p>
      <p>Why at the top? Berry writes, "There's a practical advantage to keeping both the running head and the page number at the top of the page. If the text may end at different points on different pages, or if you might need to add a line or cut a line at the bottom of the page to avoid a widow, then a running foot would draw attention to these variations; a running head would not."</p>
