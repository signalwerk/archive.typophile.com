      <p>The John Berry article noted above pretty much says it all. That's a good place to start.</p>
      <p>Keep in mind that each book's needs have to be considered; there's no one-size fits-all way to handle running heads. I'm looking at a recent book done here. On the verso we placed the part-title rather than the chapter title. No folio on the verso. On the recto, only the folio. Why? I'm not sure. Probably as Berry remarked: sometimes we just do these kinds of things to running heads for something "different" or "noticeable," to prove we are designers.</p>
      <p>The content of running heads is primarily an editorial decision, rarely a design decision. When an editor hands over a manuscript for design, there should be a separate file with the contents for running heads. The appearance of running heads is primarily a design decision, often done in consultation with the editor.</p>
      <p>powers</p>
