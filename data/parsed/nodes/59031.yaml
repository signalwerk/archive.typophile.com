      <p>@ Chiba:</p>
      <p>If you have decided to use only one folio per spread, you should just decide where you want that folio for design reasons. In a few pages readers will be accustomed to its placement, and when they need folios they'll find them with no problem. Don't make too much of a scientific quest out of this question.</p>
