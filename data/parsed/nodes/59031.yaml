      <p>I didn't read the Berry article, so if I repeat, forgive me. But I think Will has it about right, it is an editorial prerogative.</p>
      <p>BTW, in journals, the article title is often on the verso, author on the recto.</p>
      <p>When done best, the running heads often mirror the contents page. There are books where the A-level subheads are listed in the contents. In such cases, the best running head structure would be chapter title on the verso, current A-head on the rightie.</p>
      <p>If subheads aren't on the contents, but there are part titles (&amp; they'd be on the contents page), then it would be part title on the verso, CT on the recto.</p>
      <p>The contents page and running heads work best as a sort of mini-index, that is, helping the reader find what they are interested in in the book/journal. Seems to me a lot of contemporary editors forget this -- or I'm out-of-date again.</p>
      <p>Repeating the book title for 300 pages sort of implies you think the reader is too stupid to be reading the book anyway. But come to think on it, that's how a lot of editors seem to feel, so maybe it is appropriate.</p>
      <p>YMMV</p>
