      <p>Keoxa may have it. In the 1600s, books were sold unbound. You had the bookseller do binding according to how much wealth you had, and the amount you wanted to spend. Samuel Pepys mentions this many times in his diary, as he was amassing his eventually large library.</p>
      <p>I suspect the very stingy book buyer might have several smaller books bound together to save costs. In such a case a tradition of putting the title on the running heads may have developed.</p>
