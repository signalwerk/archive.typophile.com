    <p>We were discussing this at university the other day and noone, the tutor included, knew the answer to this question: why do books have their title at the top of the (often verso) page?</p>
    <p>A modern justification might be for photocopying or faxing so the page can be taken out of context, but they were putting the running title of the book at the head of pages centuries before anyone even dreamt of a fax machine.</p>
    <p>Any clues?</p>
