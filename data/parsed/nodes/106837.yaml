    <p>Hey</p>
    <p>I have been reading a lot of diverging sources on this. So I am relying on you to help me out. It will be used for a programming language akin to CSS.</p>
    <p>So that's what we currently have:</p>
    <p>hairline 50<br>
    thin 100<br>
    ultralight 150<br>
    extralight 200<br>
    light 300<br>
    book 350<br>
    normal 400<br>
    medium 500<br>
    semibold 600<br>
    bold 700</p>
    <p>Here are the complicate ones:<br>
    extrabold<br>
    heavy<br>
    black</p>
    <p>1/ What's the correct order for these 3?<br>
    2/ Does ultrablack corresponds to one of these? Is it a separate weight?<br>
    3/ Which one corresponds to 800? 900?</p>
