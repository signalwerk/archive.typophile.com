    html: <p>Hi guys, thanks for all the input. Lots of suggetions there ;) <br> <br><img src="http://www.typophile.com/forums/messages/29/6324.jpg" alt="spartanV20"> <br> <br>I have fixed the "S" (almost) and closed the "N". I think it looks much better. <br>Dropped the crossbar on the "A" and tightened the spacing between P-A, A-N. <br>Have also made small size comparisons. <br>1. same as large <br>2. reworked the helmet segments and added circles to compensate for the crossbar (not sure about that) <br>3. original with new "S" &amp; "N" <br> <br>Hrant, I didnt understand the "chevron" so I interpreted that with circles ;) <br>BJ, tried to make the tail of the "R" smaller, but it looked odd. Will try again. <br>Darrel/John, is the S-N width resolved? <br>Colin, how is the top counter of the "S" looking now? <br>Stephen, thanks ;) <br> <br> <br>Thanks again everyone ;) <br> <br>Bren</p>
