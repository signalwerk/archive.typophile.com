  - id: 44144
    user: 1262
    date: 2003-02-04T19:19:00
    date_raw: 4 Feb 2003 — 7:19pm
    votes: null
    html: "<p>I second Darrel's suggestion to use a normal P. Think about it: the justification for the R is that the left side of the counter forms the nose-piece of the helmet. There is no such justification for repeating this shape in the P. It looks odd, and it draws attention away from the R. <br> <br>Personally, I would try this with <i>only</i> the R having an abnormal shape (and the T, of course, where it is cut off by the crest of the helmet). I think it is a mistake to remove the crossbars of the A's: sure it looks Greek, but it looks like two uppercase <i>lambdas</i>, which confuses me into reading it as SPLRTLN. Actually, in the context of the two pseudo-<i>lambdas</i>, the cut-off T begins to look a lot like a <i>gamma</i>. And then do I read the P as Latin P or Greek <i>rho</i>? SRLRGLN, anyone? <br> <br>Making Latin letters look like non-corresponding Greek letters is a bit naff: like reversing the letter R to make things look 'Russian'.</p>"
    html_clean: "<p>I second Darrel's suggestion to use a normal P. Think about it: the justification for the R is that the left side of the counter forms the nose-piece of the helmet. There is no such justification for repeating this shape in the P. It looks odd, and it draws attention away from the R. <br> <br>Personally, I would try this with <i>only</i> the R having an abnormal shape (and the T, of course, where it is cut off by the crest of the helmet). I think it is a mistake to remove the crossbars of the A's: sure it looks Greek, but it looks like two uppercase <i>lambdas</i>, which confuses me into reading it as SPLRTLN. Actually, in the context of the two pseudo-<i>lambdas</i>, the cut-off T begins to look a lot like a <i>gamma</i>. And then do I read the P as Latin P or Greek <i>rho</i>? SRLRGLN, anyone? <br> <br>Making Latin letters look like non-corresponding Greek letters is a bit naff: like reversing the letter R to make things look 'Russian'.</p>"
