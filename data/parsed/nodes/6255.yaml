    html: <p>Thanks for the greek alphabet lesson John ;) point taken about the naff-ness. The client wanted this concept and I had to oblige to get paid. <img src="http://www.typophile.com/forums/clipart/sad.gif" alt=":-(" border="0"> <br> <br>The job hasn't gone to print yet so I will show them this version and see what they say. No doubt that they love the "authenticity" of the last logo, but lets see what happens. <br> <br><img src="http://www.typophile.com/forums/messages/29/6277.jpg" alt="spartan"> <br> <br>Darrel, you were right about the detraction. I have based the new "P" on Trajan. <br> <br>Not much I can do with the "T"(without cutting into the "R"), I guess it will have to look like a gamma symbol. <br> <br>Thanks for the input guys. <br> <br>Bren <br> <br></p>
