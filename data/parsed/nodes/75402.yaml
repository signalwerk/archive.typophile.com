      <p>Sorry to contradict my esteemed colleague and partner at Commercial Type, but Brunel for the most part uses models that are earlier than Miller. Brunel draws most of its inspiration from the moderns that Mrs Henry Caslon started producing around 1796, believed to be cut by John Isaac Drury. Some of the punches have survived and are at St Bride Printing Library. Miller draws on the Wilson specimen of 1812, and the Miller specimen of 1813, though in a looser manner than Brunel sticks to Drury. For example the lower case g clearly belongs to Wilson’s English No. 1 circa 1789, the model for Mardersteig’s Fontana and David Quay’s Wilson. For a more detailed analysis see James Mosley’s article<br>
      <a href="http://typefoundry.blogspot.com/2007/02/scotch-roman.html" title="http://typefoundry.blogspot.com/2007/02/scotch-roman.html">http://typefoundry.blogspot.com/2007/02/scotch-roman.html</a></p>
      <p>Of course the reality is that Scotch Romans and British Moderns are quite close, and Miller and Brunel share much of the same DNA, which Mosley covers so well in the English Vernacular (Motif 11)</p>
