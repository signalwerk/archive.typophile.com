      <p>Peter,</p>
      <p>This is Brunel by Paul Barnes. You can find more information <a class="freelinking external" href="http://moderntypography.com/Typedesign/Brunel/index.html" rel="nofollow">here</a> and <a class="freelinking external" href="http://christianschwartz.com/brunel.shtml" rel="nofollow">here</a>. The models for this face, which is a British Modern, are a bit later than the models for Matthew Carter's Miller, which is a Scotch Roman. Contact us at info (at) commercialtype.com if you are interested in details on how to license this family.</p>
