    <p>Hi,</p>
    <p>Can anyony id this Didot-ish font used in Fortune Magazine. I'm not sure if the current redesign uses it, but this is from 2009.</p>
    <p>It's similar to Didot, Bodoni, Benton Modern Display etc., but I can't quite pin it down.</p>
    <p>Sorry for the unsharp image.</p>
