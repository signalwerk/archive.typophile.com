    <img src="http://origin.myfonts.net/118/fs/u/29/ae5482ee7039f32898dddc06da5447.gif" alt="Proforma" width="600"></p>
    <p>But I am confused on how to do it because there are some issues on character sets, color, legibility (His Excellency Fred Smeijers said one can do wedgies on the serifs), and even chemistry [H&amp;FJ brings up the topic on font grades, to cope with how ink reacts with paper (I know lazyheads, you are all crying right now :'{ )].</p>
    <p>So the question remains: what do newspapers really need in the design of its typefaces?</p>
