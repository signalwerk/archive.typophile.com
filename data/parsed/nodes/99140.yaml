    <p>Hello everyone. I am a novice in type design aiming on making a serif (and if possible, a sans-serif companion) type system aimed at newspaper use.  I am still in development, and I am looking at some other fonts that look great on print.</p>
    <p>Acta and Acta Display - Dino dos Santos for DSType<br>
