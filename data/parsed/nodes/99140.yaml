      <p>Repeating myself:</p>
      <blockquote><p>a text face in general can't be optimal if it looks too nice when used for display</p></blockquote>
      <p>You need a certain ugliness in this case*. I admit many people don't agree with that view. But to me the fact that scale changes everything is a no-brainer.</p>
      <p>* Same sort of thing that happens for example with the binocular "g" in <em>any</em> text face; if it's too pretty other more important things are going wrong.</p>
      <p>hhp</p>
