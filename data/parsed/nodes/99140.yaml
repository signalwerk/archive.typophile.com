      <p>This is a big challenge. For one thing although the technical stuff is huge, "mood" still plays a role, and you have to end up with a design that reflects the character of the newspaper.</p>
      <p>The one recent effort that I think has revealed deep insight into news face requirements is Christian Schwartz's Houston Chronicle typeface*. It aptly demonstrated how features that look ridiculous when large turn into gold when small. In fact, as I've opined before a text face in general can't be optimal if it looks too nice when used for display (although many designers dispute this).</p>
      <p>* <a href="http://www.christianschwartz.com/houston.shtml" title="http://www.christianschwartz.com/houston.shtml">http://www.christianschwartz.com/houston.shtml</a></p>
      <p>BTW there's a huge reference you've missed: David Berlow. Hopefully he'll chime in.</p>
      <p>hhp</p>
