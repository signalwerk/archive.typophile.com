    <p>Hello everyone. I am a novice in type design aiming on making a serif (and if possible, a sans-serif companion) type system aimed at newspaper use.  I am still in development, and I am looking at some other fonts that look great on print.</p>
    <p>Acta and Acta Display - Dino dos Santos for DSType<br>
    <img src="http://origin.myfonts.com/s/aw/original/117/0/60320.jpg" alt="Acta" height="300"><br>
    <img src="http://origin.myfonts.com/s/aw/original/117/0/60324.jpg" alt="Acta Display" height="300"></p>
    <p>Arnhem - Fred Smeijers<br>
    <img src="http://cdn.ilovetypography.com/img/arnhem-2.gif" alt="Arnhem"></p>
    <p>Century - L.B. Benton + M.F. Benton<br>
    <img src="http://fontmatters.files.wordpress.com/2011/02/century.jpg" alt="Century" height="360"></p>
    <p>Charter - Matthew Carter<br>
    <img src="http://origin.myfonts.net/118/fs/u/5a/88e9c919bcd39f695fa74fd5049f08.gif" alt="Charter" width="600"></p>
    <p>Farnham - Christian Schwarz<br>
    <img src="http://cdn.myfonts.net/s/aw/720x360/37/0/19306.png" alt="Farnham" height="300"></p>
    <p>Miller - Matthew Carter<br>
    <img src="http://origin.myfonts.net/114/fs/u/47/514cf3edb5df84d0d6f681ba822fc5.gif" alt="Miller" width="600"></p>
    <p>Periodico - Eduardo Manso<br>
    <img src="http://cdn.myfonts.net/s/aw/720x360/105/0/53841.png" alt="Periodico" height="300"></p>
    <p>PROFORMA - Petr van Blokland<br>
    <img src="http://origin.myfonts.net/118/fs/u/29/ae5482ee7039f32898dddc06da5447.gif" alt="Proforma" width="600"></p>
    <p>But I am confused on how to do it because there are some issues on character sets, color, legibility (His Excellency Fred Smeijers said one can do wedgies on the serifs), and even chemistry [H&amp;FJ brings up the topic on font grades, to cope with how ink reacts with paper (I know lazyheads, you are all crying right now :'{ )].</p>
    <p>So the question remains: what do newspapers really need in the design of its typefaces?</p>
