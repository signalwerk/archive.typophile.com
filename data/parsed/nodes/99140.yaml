      <p>They need types that will work well on the presses on which their publication is printed; paper stock and ink gain are key issues, especially for body type.</p>
      <p>They need types that will not waste space, which is at a premium in a medium which is quite literally downsizing.</p>
      <p>They need display types which are tightly ﬁtted.<br>
      For serifed headline fonts, very ﬁne details for use huge.</p>
      <p>They need types with unique personality, to stand out in the SND awards every year. </p>
      <p>They need types with contemporary style, because newspapers are more like magazines now that news is delivered fast by TV, Internet and tweet.</p>
