      <p>Craig, sorry: something missing there (fixed). The AHRC pay fees and living expenses to UK residents, or fees only to EU residents. The University's own studentships are open to all nationalities. The rationale is clear: the funding council uses tax revenue, so the benefits should go to taxpayers. The University has more independence, so it can afford to seek out the very best worldwide. (Jo de Baerdemaeker, from Belgium, and Myra Thiessen, from Canada, were recent award holders. Titus Nemeth, an Austrian, is a current one.)</p>
      <p>The AHRC professional preparation studentships are primarily intended for recent graduates or professionals relatively early in their career who can make a convincing argument for support in their developing specialised skills. The UoR studentships are different, in that they have a clear research focus; no terminal practical element in these proposals. </p>
      <p>Nick, I am not sure what in your own experience is relevant to an announcement of funding opportunities for MA students. The AHRC studentship I refer to has nothing to do with the system of research grants or fellowships, which I suspect you would have applied for. But you seem to have little respect for a process you deride? Why apply if you don't trust the system? (No need to answer.)  </p>
      <p>In any case, this is money that can make the difference between "I can" and "I can't" for someone to realise a life-changing goal. Any such opportunity should be welcomed.</p>
