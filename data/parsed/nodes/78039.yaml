    <p>(With apologies for cross-posting)</p>
    <p>We are looking for exceptional candidates for full-time postgraduate study in the Department of Typography at Reading. The University will award one AHRC-funded studentship for our practice-based MA programmes: Book Design, Information Design or Typeface Design, with entry in October 2011. </p>
    <p>We will also be putting candidates forward for doctoral and MA studentships funded by the University of Reading.  </p>
    <p>These schemes offer different levels of support depending on your country of origin and residence (AHRC is only open to UK/EU applicants, but UoR to all nationals. They are very competitive. Read the details, and if you have questions email Carolyn Davidson at <a href="mailto:c.davidson@reading.ac.uk">c.davidson@reading.ac.uk</a> . The links below are thin on details; if you are interested, email Carolyn at first instance, with a description of your background and area of work. If you are a current student you will need to be predicted a high grade at graduation. Be prepared to work very quickly to put in a good application, and think about possible referees.</p>
    <p>Send your completed applications (including two references) to Elaine Harris by Friday 18th February 2011 at Joint Faculty Admissions Office, University of Reading, HUMSS 126D, Reading RG6 6AA (<a href="mailto:e.harris@reading.ac.uk">e.harris@reading.ac.uk</a>). Ms. Harris will also be the first point of contact for any enquiries relating to the competition. See <a href="http://www.reading.ac.uk/typography/pg-taught/typ-pgtcourses.aspx" title="http://www.reading.ac.uk/typography/pg-taught/typ-pgtcourses.aspx">http://www.reading.ac.uk/typography/pg-taught/typ-pgtcourses.aspx</a> and <a href="http://www.reading.ac.uk/research/res-pgr-degrees/FundingOpportunities/res-pgstudarts.aspx" title="http://www.reading.ac.uk/research/res-pgr-degrees/FundingOpportunities/res-pgstudarts.aspx">http://www.reading.ac.uk/research/res-pgr-degrees/FundingOpportunities/r...</a> . </p>
