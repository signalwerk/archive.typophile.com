  html: "<p> The task: supply my brother, a CAD/CAM/machinist guy, with an AutoCad version of a client logo so he can cut it out of metal. <br> <br>The challenge: Illustrator's DXF/DWG export filters seem to be, ahem, buggy. Brother can't open my files. <br> <br>The solution: Paste the logo into Fontographer, save as PC TrueType file. Brother sets the logo as type, and the aluminum starts to fly. <br> <br>I do love a good workaround! </p>"
