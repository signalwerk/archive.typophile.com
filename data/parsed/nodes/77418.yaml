    <p>I'm looking for a font that will be able to translate some text my sensei sent me. I'm trying to design a card for him but for the life of me can not find a decent Japanese font for it (with Kanji, found a few kana ones). I think I might need unicode ?</p>
    <p><a href="http://www.wazu.jp/gallery/samples/AoyagiKouzanFont2OTF__Japanese.gif" title="http://www.wazu.jp/gallery/samples/AoyagiKouzanFont2OTF__Japanese.gif">http://www.wazu.jp/gallery/samples/AoyagiKouzanFont2OTF__Japanese.gif</a><br>
    looks awesome. but doesn't seem to work on my computer. I've installed for 20 and none seem to translate well, which makes me think I need unicode version?</p>
    <p>found it here <a href="http://www.wazu.jp/gallery/Fonts_Japanese.html" title="http://www.wazu.jp/gallery/Fonts_Japanese.html">http://www.wazu.jp/gallery/Fonts_Japanese.html</a></p>
    <p>I need to use this text:<br>
    山下武道こくさいきょかい</p>
    <p>and help/direction would be amazing.</p>
