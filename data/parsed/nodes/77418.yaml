      <p>Here is the correct string in plain text: 山下武道こくさいきょうかい (a "う" was missing).</p>
      <p>Here is the version that substitutes the kana with the appropriate kanji: 山下武道国際教会.</p>
      <p>Unfortunately, Kazuraki is not included on the CS5 DVDs, but is available on our Type Showroom for a very reasonable price of $35 (I provided the link in an earlier post to this thread). This font includes glyphs for all kana and 1,483 kanji. It is also fully proportional.</p>
