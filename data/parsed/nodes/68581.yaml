    html: |-
      <p>I've made some bitmap stuff in my time, and your effort is not bad, but try makin it either 9 or 11 pixels in width; symmetry would get lot easier.</p>
      <p>D is weird, and N is only 7 pixels. X is cool; very Space Invaderish. </p>
      <p>Make numerals two pixels narrower, and you skip that problem.</p>
      <p>Space the with two pixels, and things look a lot more natural. T,F,L and such only need one.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/nepofont_5187.png"></div><p></p>
