  html: |-
    <p>Hey Guys, we were asked to make a font under these conditions:</p>
    <p>- Use only Horizontal and Vertical Lines<br>
    - Cannot simulate a curve leaving pixels white on the corners.<br>
    - Uppercase Characters and Numbers Only.</p>
    <p>This is what i have so far - <a href="http://fontstruct.fontshop.com/fontstructions/show/nepo_3" title="http://fontstruct.fontshop.com/fontstructions/show/nepo_3">http://fontstruct.fontshop.com/fontstructions/show/nepo_3</a></p>
    <p>- Height is 7px and Width is 10px</p>
    <p>- Small Version<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/nepofont_4319.PNG"></div><p></p>
    <p>- Medium<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/nepofontmedium_6016.PNG"></div><p></p>
    <p>Some of my thoughts:</p>
    <p>- The D looks weird<br>
    - Is my X Valid?<br>
    - Other ways to make the M, N and W ?<br>
    - The S and the 5 look too much alike?<br>
    - Help with Spacing</p>
