    html: |-
      <p>Wow, tricky!<br>
      For the "N", have you tried maybe making just a flipped "U", which would look a bit like a lowercase "n"? Might work in such a font. Also, for the "M", I'd maybe try reducing the middle stem to one line (a bit like what you do in the "B").</p>
      <p>One idea for the "D" (which I agree looks funky), although this would likely necessitate changes to other letters too: Have you tried giving it "serifs" on the left side – i.e. moving the left vertical stem a bit to the right and letting the top and bottom lines protrude out to the left? Don't know if it'd work, but it might be worth a try.</p>
