      <p>To me, the bottom one says "church" the clearest. The top would be my second choice. For some reason, I think "community college" when I look at the second and third logos.</p>
      <p>For the bottom one, I agree that "CORNERSTONE" could use a little space, both between the letters, and on either side. Try to match the space on the sides with the space on the top. It looks off that there's so little space in "CORNERSTONE" and so much in "Faith Fellowship". The letterspacing in the latter doesn't work.</p>
      <p>There should also be more space between the two lines of text. The text seems too close to the image below as well (the sun is almost poking Fellowship's 'i' out :P).</p>
      <p>What type of church is this? Most religions have a symbol that can identify them easily. Was the decision to leave out a Cross / Star of David / &amp;c. intentional?</p>
      <p> - Lex</p>
