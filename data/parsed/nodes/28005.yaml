      <p>What are your communication goals, Jeremy? As others have pointed out and I agree with, these logos don't say 'church' or even "religion' to me, so clearly you have other driving factors. If you are avoiding religious iconography simply because they are "overdone", I think your reason for avoiding them is not very strong. I'm trying to imagine the client meeting with church representatives where you tell them about playing down the religious aspect. Is there something in the client's creative brief or desires that led you in this direction?</p>
      <p>Frankly, a well-chosen typeface and sensitive typesetting will take you much further than any of the imagery you've used. (One example that I've seen on book covers and some films is H&amp;FJ's <a href="http://www.typography.com/catalog/requiem/index.html" rel="nofollow">Requiem</a>. I think you might be trapping yourself into doing something that feels generic for non-churches in an effort to avoid the generic for churches. Christian institutions have been integral in design, art, and architecture for centuries. There's more than enough there to draw from without falling on overdone solutions. Much of it is subtle and can be incorporated with stylistic choices, rather than direct references (crosses, doves, etc.).</p>
      <p>This is an instance where your logos aren't bad, per se, just perhaps not as appropriate as they could be.</p>
