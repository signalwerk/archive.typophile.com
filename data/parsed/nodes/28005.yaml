      <p>I think the corporate-looking sans is wrong for a religous community. People want warmth and emotional support out of a religous community, not neutrality. </p>
      <p>Also I don't see the point in avoiding the Cross. I'm not a Christian, but if I were I think I'd see the Cross as very positive, particularly if I were looking for a church to join. To me the logical solution includes a cross and a more human font, like one of Goudy's. <a href="http://www.lcms.org/" rel="nofollow">Here's</a> an example of the feeling I am talking about. Ok, that example has a bit too much swooshiness, but you get the idea. "The obvious is better than the obvious avoidance of the obvious". If you can be innovative as well, fine, but something more conventional that works is good too.</p>
      <p>Also, speaking of Goudy, he said 'Anyone who would letter space lower case would steal sheep.' And Erik Spiekermann wrote a whole book "Stop Stealing Sheep." There are better solutions.</p>
