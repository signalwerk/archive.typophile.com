      <p><cite> can someone tell me why chruches need logos?</cite></p>
      <p>Probably so they have something to put on the sign and their letterhead. Kudos to them for paying for something that matches and looks good rather than something haphazard and impromptu.</p>
      <p>I'm guessing that this church is Christian (with "cornerstone" and all), and if so, I like the image of the leaves in the first example ("I am the vine, you are the branches..."). But, I agree with the others that you need type that is warmer, more inviting, and far less corporate. For this reason, I like the way you set "Cornerstone" in the third example. Lowercase just seems more friendly (but, please not <em>all</em> lowercase a la at&amp;t).</p>
