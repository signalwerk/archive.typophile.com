      <p>Careful consideration needs to be done when selecting the typeface. Look for something that would be appropriate if it actually were inscribed on a cornerstone (avoiding cliches like Trajan).</p>
      <p>The circle in the square, while graphic and easily reproduced at smaller scales, is so generic that if I saw it without the accompanying text, I would never think "Cornerstone Faith Fellowship."</p>
