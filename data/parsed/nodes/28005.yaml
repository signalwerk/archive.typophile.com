      <p>I like the leaf graphic, but it may not be immediately recognizable as church from the graphic alone. The sans "CORNERSTONE" lettering seems spaced to closely, especially on the bottom one. I'm not particularly fond of that sans font. Doesn't seem solid enough for a place with the name Cornerstone. On the bottom graphic, try modulating the white horizontal curving line to make it more calligraphic. Also, lowercase looks bad letterspaced. Instead, having the "Faith Fellowship" align right might look good. The "Faith Fellowship" is also pretty lightweight compared to everything else in the bottom one. The C graphic in the second one is nice, but does not match any of the the font choices. The C in the 3rd one is kinda awkward--should lean more towards either a recognizable graphic (what is going on?) or a letter (is that a G?). I hope these suggestions are helpful to you--its just the stuff that immediately came to mind. Those logos are great to start from.<br>
      Eron</p>
