      <p><em>XL for Latin Extended, XLC for Latin Extended plus Cyrillic</em></p>
      <p>I don’t like this, because:</p>
      <p>1. In the 21st Century, every OT font should have full CE support. Yet you still need to communicate this users through some sort of extension. I like “Pro” because, if nothing else, at least you know that they remembered to put CE in. Maybe CE isn’t such a big deal in North America, but over here, you can’t sell fonts without it. It is the bear minium, and even it doesn’t cover all your working bases… right now, the EU has 25 member countries, and two writing systems. In a few years, it will certainly have three (Cyrillic), or even four (Arabic?).</p>
      <p>2. and because…</p>
      <p>&gt;XLC…</p>
      <p>And then a CE + Greek font would be XLG? What happens when you put in Greek and Cyrillic? XLCG? Then Hebrew and Arabic? Helvetica World would need an XLCGHA extension. Or maybe XLCGHAV, since Vietnamese accents are in there, too.</p>
    html_clean: |-
