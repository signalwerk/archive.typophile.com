    html: <p>I think it makes sense for vendors with large legacy libraries (eg Linotype, Adobe and Monotype) to standardize the naming of OpenType edition fonts. Here the "Pro" vs "Std" designation seems to work fine. Where things break down is the specialist fonts, that include just one or two carefully selected OpenType features. An example might be Ed Interlock.</p>
