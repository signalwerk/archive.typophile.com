    <p>Thomas Phiney or another Adobe person may be the best resource for this question. (hopefully they are available).</p>
    <p>Is the designation “Pro” (as part of a font name) an Adobe proprietary name or is it useable by any foundry? Is this term considered to be a de-facto standard for large glyph set Opentype fonts? </p>
    <p>We were discussing this in another thread where I was debating what to name one of my fonts but thought this forum a better place to get an answer.</p>
    <p><a href="https://web.archive.org/web/20081013095557/http://typophile.com/node/18796" title="http://typophile.com/node/18796">http://typophile.com/node/18796</a></p>
    <p>Any thoughts?</p>
    <p>ChrisL</p>
