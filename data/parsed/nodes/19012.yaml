      <p>This question came up when Adobe released their first OpenType Pro fonts. From... </p>
      <p><a href="http://www.microsoft.com/typography/links/news.aspx?NID=1474" title="http://www.microsoft.com/typography/links/news.aspx?NID=1474">http://www.microsoft.com/typography/links/news.aspx?NID=1474</a></p>
      <p>&gt;<em>But what exactly makes an OpenType font a Pro font? </em><br>
      &gt;An Adobe OpenType font only gets the Pro designation if it has a minimum base character set and a reasonable number of OpenType features. The minimal Pro character set includes ISO-Adobe and Adobe CE character sets, plus the euro, litre, foursuperior and estimated symbols. </p>
      <p>&gt; <em>Can I call the OpenType fonts I make Pro fonts?</em><br>
      &gt; According to the OpenType list postings Adobe is not claiming any trademark on the Pro designation with reference to OpenType fonts. Although anyone is free to use the word, it would reduce end-user confusion if the type community remains consistent in their use of the term. </p>
      <p>But Adobe could always change their mind. So you might want to reconfirm with Tom. </p>
      <p>Si</p>
