    html: |-
      <p>The trouble with the Latin script, in particular, is that it is an open set. I'm not sure anyone has a really good idea of what would constitute a full list of languages written in the Latin script, and in Africa and the Americas it tends to be the script of choice for newly written languages. Even though no new decomposable diacritics are being added to Unicode, new Latin letters continue to be added. When Unicode 5.0 is rolled out later this year, it will contain 27 additional Latin letters for writing modern languages, plus others for phonetic transcription.</p>
      <p>A fully extended Latin font -- i.e. one intended to support all the languages written in the script -- would also, as a basic requirement, need to support dynamic mark-to-letter and mark-to-mark positioning for a very large number of combining mark characters. Any OpenType font without extensive GPOS feature support would not qualify.</p>
      <p>I don't find the term 'Pro' very helpful in the kinds of fonts I produce. The minimum requirements for a Pro font defined by Adobe are fine -- basically a kind of pan-European Latin coverage, minus some minority languages -- but of course the term doesn't tell you what else is in a font beyond the minimum. Frankly, I don't think this kind of information can be conveyed in a font name, because the information is too complex. What this suggests to me is that there needs to be better access to font name table entries, so that one can query a font from within, say, an application menu and find out information about character set coverage.</p>
      <p>Ideally, somewhere down the road, the actual cmap table of a font could be crossreferenced to a database of languages at the system or application level, so two-way queries could be made, e.g. 'Show me all the fonts that support language X' or 'Show me what languages X font supports'. A lot of work needs to be done to catalogue this information, though, and it will require a large, collaborative effort. The WRIT project I worked on for MS in 1998 was aimed at this kind of cross-referencing of fonts to languages: we just got our toes wet with approx. 700 reasonably well documented languages.</p>
    html_clean: |-
