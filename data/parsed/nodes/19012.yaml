      <p>Well, I don’t think either Israel or the EU wants a merger with the other party.</p>
      <p>I don’t know if an Arabic-speaking country will be considered eligible for EU membership anytime before 2020 or 2030, but if one would be, it would probably be one of the North African ones. But by that time Europe will have such a large Arabic-speaking minority that Arabic will have to be added into the pile of quasi-official languages. I bet that there are already more Arabic-speakers living in the EU than say, Czech-speakers.</p>
      <p>I don’t think that there are any Cyrillic-using countries in the EU yet, but Bulgaria or Serbia will probably join before 2015 or 2020. And there is always Ukraine… some of the western half of Ukraine was part of “Europe”* until 1917/18.</p>
      <p>*As a part of the Austro-Hungarian Empire</p>
