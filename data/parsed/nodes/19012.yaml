      <p>Sorry, I was on vacation last week, so catching up a lot this week. Luckily, I saw the Phinn-signal!  :)</p>
      <p>Adobe does not have a trademark on the "Pro" designation for fonts, and welcomes other foundries using it, if they like. In an ideal world, we think the usage should be consistent, but it's up to each foundry what they do.</p>
      <p>Adobe's practice is to use "Pro" to designate (A) Latin fonts which have Adobe CE coverage in addition to the Adobe Western 2 character set, and (B) fonts with the Adobe-Japan1-5 or greater character set as opposed to fonts with the Adobe-Japan1-4 or lesser character set.</p>
      <p>For case (A), these fonts may also have Greek and/or Cyrillic coverage, but it is not required.</p>
      <p>For OpenType fonts that do not have CE coverage, Adobe calls them "Standard" regardless of the number of features involved. For example, Poetica Standard is is the result of merging 17 Type 1 fonts and has quite a few OpenType features. Similarly, Utopia Standard has an awful lot of typographic extras, but no CE coverage.</p>
      <p>Regards,</p>
      <p>T</p>
