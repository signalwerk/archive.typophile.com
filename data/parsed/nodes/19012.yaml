      <p>I would hope the type community could devise a standard for the sake of the type consumer. It may even be better to have a system like Adrian Frutiger came up with for Univers where two numbers told the tale quite easily. There could be 2 letters instead or 3 if need be but something is needed to let the consumer know what they are getting.</p>
      <p>ChrisL</p>
