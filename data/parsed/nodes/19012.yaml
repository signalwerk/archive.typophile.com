      <p>Geoff Riding:<br>
      <cite>... but it seems that more and more fonts are being released exculsively in OpenType format nowadays, would this render the “Pro” term meaningless?</cite></p>
      <p>If all fonts by a foundry have the CE additions, then it is not really necessary to attach "Pro" to each font name ...</p>
      <p><cite>Typotheque appears to use "Std" and "Pro" terms to differentiate between Extended Latin and Cyrillic, Greek support.</cite></p>
      <p>I wonder if it's really important that "Pro" means the same with all foundries. The chaos is already there. Some even relate it to existence of OT feature, not to language support as was Adobe's way to use it.<br>
      Typotheque documents make it very clear what they mean by "Std" and "Pro" -- so I see no problem there. It is more problematic if foundries would add it for mere marketing reasons, without knowing what this "Pro" designates for them. (Related, what do I get when I license an "OpenType" font?)<br>
      When licensing fonts, I look very carefully what I will get and never trust mere words.</p>
      <p>Karsten</p>
