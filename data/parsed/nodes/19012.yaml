      <p>Dan,<br>
      I am not saying that my little XL-XLC, etc., was the answer. I was just posing the question in hopes that something better would come out of this discussion than my first utterance. I also feel that CE should become a normal expectation as well as Greek and Cyrillic. The issue is letting the consumer know what they are getting.  Thnere will be quite a number of legacy fonts out there for some time that will not be extended with a full character set right away. I am just looking for a way to distinguish those that do from those that don't.  If we settle on just "Pro", then we need define it in a meaningful way. If we need some other expressions that fill the bill, then let's come up with a system.<br>
      I certainly don't want to tie a type naming system to the politics of the EU and who may or may not become part of it at some point. We are a world of numerous languages and several scripts. We all have a need to set type no matter what our political affiliations are to become. I think we can come up with a system that includes all glyph systems and scripts and use it before the political dust settles on the EU.</p>
      <p>ChrisL</p>
