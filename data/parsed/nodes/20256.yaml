  html: |-
    <p>I'm working on project about MF Benton's gothics and have seen references to Miehle Gothic but have not been able to find it. Monotype has a few Miehles but no Gothic. In fact the faces look more like semi serifs then gothics. Also, if anyone can add to or subtract from the list below please do. They must have been designed by Benton not reworked such as Globe Gothic (as far as what I have been able to ascertain).</p>
    <p>Franklin Gothic 1902<br>
    Alternate Gothic 1903<br>
    Clearface Gothic 1905<br>
    Miehle Gothic 1906<br>
    News Gothic 1908<br>
    Lightline Gothic 1908<br>
    Novel Gothic 1928<br>
    Agency Gothic	1932<br>
    Raleigh Gothic Condensed 1932<br>
    Headline Gothic 1936</p>
    <p>Thanks,<br>
    Chuck</p>
