    html: |-
      <p>AFAICT, "Miehle Gothic" would be a wider version of the semi-serif design in question.</p>
      <p>According to Mac McGrew's American Metal Typefaces of the Twentieth Century, which shows Miehle Extra Condensed, "Normal and and Condensed widths [of Miehle] were drawn but apparently not completed."</p>
      <p>I once had a particular interest in the Miehle faces for a project I was working on, and even did a quickie digitization of Miehle Extra Condensed. I've never seen any further info on the other faces, although if there were any it would probably be at either Columbia University or the Smithsonian.</p>
      <p>Patricia Cost might also have more info, if you can get it from her.</p>
      <p>Cheers,</p>
      <p>T</p>
