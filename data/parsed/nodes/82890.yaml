    <p>Hi Guys,</p>
    <p>Can anyone please help ID the font used in 'Football'.</p>
    <p>It's from an old Mattel Electronics Computer game from the 70's.</p>
    <p>I'm thinking it's maybe handlettered based on something like Bauhaus/Horatio but haven't found an exact match.</p>
    <p>Cheers,<br>
    Ryan.</p>
