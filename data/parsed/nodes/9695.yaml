  html: <p>Hello, as the subject implies, I'm hoping to get some ideas for a clear, bold face for use on a PDA application I'm cooking up.  <br> <br>The ideal font would be fairly narrow, generously tall, and of ample weight. I'm looking for something that fits a lot of characters on a short line but can be read clearly from an arm's length.  <br> <br>Here <a href="http://www.heavy-meta.com/fonts.jpg">is a screenshot</a> of the leading contender - 'Standard,' one of the minml fonts. You can see the environmental contraints of the application from that shot pretty well.  <br> <br>Any ideas? Thank you.  <br> <br>Ian</p>
