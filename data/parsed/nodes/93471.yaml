      <p>The title of this thread is misleading!  :-)</p>
      <p>First question, always: Why?</p>
      <p>What issues is the font supposed to address?</p>
      <p>If it will be a text font start with the "n" and "o"; if it will be a display font start with things like the "a" and "g". This last one will play a big role in the vertical proportions. (I'm assuming you're making a Latin font.)</p>
      <p>What I wish I was told? About my own limits.</p>
      <p>hhp</p>
