      <p>My two cents: Try to find the letterforms that are repeated. In the font you are reading now, that would be groups like hmnu, pdbq, HI, LEF, AVW and so on. Add to that the most used letters and the letters that has the most unique shapes in your particular design.</p>
      <p>I wish I was told this:<br>
      You don’t have to satisfy everyone with your design. Opinions are subjective, even among professionals. Listen to feedback (because this field is a lot bigger and more complex than you’d ever imagine), but when push comes to shove just draw what you like or what you need*.</p>
      <p>I am not a professional type designer (yet), so perhaps what I suggest is BS. I have no idea. You judge!</p>
      <p>* Most of my ideas rise from frustration: I can’t find any typeface that does what I want to do good enough. It might be about a vibe, or it might be some technical thing.</p>
