    <p>I'm going to start drawing some glyphs, leading to my first type design. I'm still looking for a collaborator who is amenable to ...creative... ways to ultimately be compensated for doing the heavy lifting. But because I know exactly how that sounds, I may wind up going the whole way alone.</p>
    <p><strong>What letters should I draw first?</strong></p>
    <p>I want to establish the vertical proportions, so /H/x/l/p/ ...? I want to establish the stroke contrast and angle of stress. What would you do?</p>
    <p>What else do you wish you were told before you started your first typeface?</p>
