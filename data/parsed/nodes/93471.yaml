      <p>Get your basic characters down BEFORE you start making new weights and expanded character sets.<br>
      Learn about anchors and how to use them (the same with composite characters)<br>
      Set up metric and kerning classes as you go.<br>
      Take it slow and don't get ahead of yourself.</p>
