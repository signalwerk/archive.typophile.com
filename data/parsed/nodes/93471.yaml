      <p>As they say, ( or as someone said), 'a good font isn't a collection of beautiful letters. It is a beautiful collection of letters'. No letter is complete until you can see how works in words and have taken the time to fix any little thing that seems a bit 'off'. </p>
      <p>Regarding Hrant's comment, "Why": For your first font the only possible answer is, because you want try and  make a font.</p>
