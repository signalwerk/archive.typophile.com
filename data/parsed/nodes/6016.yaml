    html: <p>Mike to avoid double posts, when you get the error message, consider that a message your post is posted. To check just go back one page and scroll up to topics, you will see your name listed as the last post in your forum. <br> <br>Addison, I would think silk screening would be the way to go but, what I would do first is contact a print broker. A print broker usually has a small plant but is wired into other printers who have different kinds of presses like letter press and of course silk screen.</p>
