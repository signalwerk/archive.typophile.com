  html: <p>I have a request from an architect client for a transparent business card. Papers such as Glama Natural and Neenah UV may do the trick, but he would like a <i>clear</i> business card--like acetate. Can anyone offer any advice concerning this? Is silkscreening an option? <br> <br>Thanks, <br>Addison</p>
