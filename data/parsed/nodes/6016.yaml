    html: <p>Tiffany, I often work in consort with a print broker bidding on a job. They know there will be at least 3 bids on a print job. By working closely with me they can even give me ideas that will make the job look great but also save my client money. They don't want to piss me off I make them money too! <br> <br>Sorry for diverting the subject from Allisons need. In Photoshop users magazine there are lots of short run digital printers throughout the US. My guess is they are in places with cheap facilities (Rent). You might check out one of these sites, but, you probably won't end up doing a press check in a traditional way. They might post a proof online. One site you might check on is CreativePro. </p>
