    html: <p>Hot stamping is another way to decorate plastic. A very good friend of mine runs a hot stamping and plastic fab company. You can reach <a href="http://www.urunlimited.com/" target="_blank"> UR Unlimited</a> best by phone (707 528 8871) since their website doesn't have much information. You want to speak with Gary or Mayumi.  <br> <br>My dad helped him build a huge laser for his business and we hire them to hot-stamp our plastic injection-molded pickup covers.  <br> <br>I've mentioned in another thread the usefulness of nameplate makers for these unusual requests. These are the guys that regularly diecut and print on plastics, and they are pros. I think there's a danger of a clear business card looking hoaky if it isn't done very well. </p>
