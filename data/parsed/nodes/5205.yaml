    html: <p>That  ain't no font  - it's hand painted. You could try <a href="http://www.myfonts.com/fonts/fontbureau/interstate/bold/testdrive.html?s=PETERSEN&amp;p=72" target="_blank">Interstate</a> or <a href="http://www.myfonts.com/fonts/fontfont/ff-din/bold/testdrive.html?s=PETERSEN&amp;p=72" target="_blank">Din</a> to get a similar look.  <br>But you won't match this with a single font, the Rs don't match.</p>
