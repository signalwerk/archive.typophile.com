  html: <p>I'm helping a friend do a book on an old Dansih Boat, we have all these ol pictures and a model builder is building a Down Scale version of the boat - i need help to identify the font use for the boat name on the sides. <br> <br>So if anyone could help me out it would be great. <br> <br>/ Jan <br> <br><img src="http://www.typophile.com/forums/messages/83/38281.jpg" alt="Boat seen from side with type"></p>
