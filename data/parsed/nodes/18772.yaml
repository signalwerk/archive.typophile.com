  html: <p>Vienna? no, Vendetta! a bit off topic, but just saw the move and thought it was fab. I’m not as much the font spotter in the theater as is our friend <a href="wiki/Mark Simonson" class="wiki">Mark Simonson</a>, but i did notice gill sans in a couple places — how very british of them! anyhoo, just thought i’d creat a space for typophiles to vent about Vendeta. (extra points for individuals who can recreate the lovely alliteration using the most instances of the letter v!) ;^P</p>
