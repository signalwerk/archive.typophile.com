    html: |-
      <p>Thank you bowfinpw,<br>
      as you said, the «a» is the big difference.<br>
      Yes, the date is accurate, and in regard of the overprinted colors, it most be a woodtype face.<br>
      I know I should look in «American Wood Type: 1828-1900» or other reference book, but a don't have a copy.<br>
      The other thing is that this one most be European (it's a Swiss poster). I already check some original German specimens from the late 20's, and got nothing.<br>
      My first bet was Ackzidenz or Folio (we are 2 years before Helvetica), but none of their versions go that compressed, and the «a» is always different.</p>
      <p>Any other ideas?</p>
