      <p>That 'a' is the hardest part of this, and if the 1955 date on the page is when this was printed, we are probably looking for something that may not have made it into digital form.</p>
      <p>The best I could do with what I could find so far was <a class="freelinking external" href="http://new.myfonts.com/fonts/adobe/helvetica/?testdrive=custom%3D0%26dock%3Dfalse%26size%3D34%26w%3D720%26src%3Dcustom%26text%3Dbeckmann%2520glass%26fg%3D000000%26bg%3Dffffff%26goodies%3Dfit%26seed%3D23">Helvetica Compressed</a>. Then I think it would need to be stretched vertically, and you might get sort of close.</p>
      <p>- Mike Yanega</p>
