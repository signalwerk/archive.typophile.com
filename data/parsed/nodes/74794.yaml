    <p>Hi all,<br>
    this is a question I will be happy to delete once I know the answer.</p>
    <p>I am in Fontographer and saving my .fog file with the name of the font I want, lets call it "font.fog" for now (I don't have a name for the font anyway).</p>
    <p>I "generate font files" to an .otf file and it comes out as "Untitled Regular".<br>
    everywhere I save the file beforehand, it has a name. how do I tell it what weight+name this file should be as an .otf?</p>
    <p>Thanks!</p>
