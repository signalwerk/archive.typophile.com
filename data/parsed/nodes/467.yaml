    html: <p>Funny, I thought we were trying to ID the masthead font but then I noticed all these posts about Metro and figured out everybody was shooting for the teeny little font below it. <br> <br>Regarding the masthead, it could be Coronet but the cap 'T' is so home rolled, I wonder if it's a one off job that somebody did a while back to slightly alter Coronet - That 'D' is unmistakable. <br> <br>Now regarding the font below, I got another chuckle since it so closely matches my Lionel Family which was inspired by lettering I found in an old Lionel Train repair manual. I'm attaching a sample for your consideration. It's my first serious text face and I'm quite fond of it. <br> <br>Upon a critique by Matthew Carter, he insisted there was no reason for this font to exist because Futura already existed :D <br> <br><img src="http://www.typophile.com/forums/messages/83/12264.gif" alt=""></p>
    html_clean: <p>Funny, I thought we were trying to ID the masthead font but then I noticed all these posts about Metro and figured out everybody was shooting for the teeny little font below it. <br> <br>Regarding the masthead, it could be Coronet but the cap 'T' is so home rolled, I wonder if it's a one off job that somebody did a while back to slightly alter Coronet - That 'D' is unmistakable. <br> <br>Now regarding the font below, I got another chuckle since it so closely matches my Lionel Family which was inspired by lettering I found in an old Lionel Train repair manual. I'm attaching a sample for your consideration. It's my first serious text face and I'm quite fond of it. <br> <br>Upon a critique by Matthew Carter, he insisted there was no reason for this font to exist because Futura already existed :D <br> <br><img src="http://www.typophile.com/forums/messages/83/12264.gif" alt=""></p>
