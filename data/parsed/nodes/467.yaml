    html: <p><i>MSS by WAD</i> was the Typophile Chapbook XVII, 1947.  <br>(The original Typophiles, that is.) But that was pretty  <br>much just essays by Dwiggins. Your Metro sample is  <br>from page 224 of the second volume from the set of  <br>Typophile Chapbooks XXXV and XXXVI, <i>Postscripts on  <br>Dwiggins</i>. This was begun shortly after WAD's death  <br>as a commemorative and was published a couple  <br>years later in 1960. <br> <br>-- K. <br> <br>BTW, I'll probably be showing images of some of WAD's  <br>original ink sketches for Metro as part of my TypeCon  <br>presentation. <br></p>
