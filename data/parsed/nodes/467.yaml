    html: "<p>Tim: <br> <br>The sub-line, I have as Intertype Vogue Bold. A very popular sans right through to the end of letterpress in the late sixties in our area (newspaper). Mac McGrew dates the light and bold weights as being made by Intertype in 1930. Medium and Extrabold coming in later years. Mac's book, American Metal Typefaces of the Twentieth Century, is an Oak Knoll publication, still available, case bound and perfect bound. It's a fine thing to have if for no other reason than to be able to satisfy one's self about identifying the naggingly familiar types that show up and drive us crazy.  <br> <br>My guess is that the masthead proper is a piece of good hand-lettering. <br> <br>Jim</p>"
