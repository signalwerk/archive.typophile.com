  - id: 3095
    user: 1215
    date: 2003-06-27T17:31:00
    date_raw: 27 Jun 2003 — 5:31pm
    votes: null
    html: <p>Oh, and my guess on that nameplate is that it was  <br>done up as a logotype (original meaning of the word),  <br>one piece of metal (maybe a zinc?), based on Coronet,  <br>but taking advantage of the single piece to make the  <br>script fully connecting. (Look at the ending curves of  <br>the two n's -- each slightly different.) I suspect that it  <br>would have been impossible to space this tight as a  <br>font of individual sorts. Even on an angled body. <br> <br>Middleton designed Coronet for Ludlow in 1937, so  <br>it would have been <i>au courant.</i> <br> <br>-- K. <br> <br></p>
