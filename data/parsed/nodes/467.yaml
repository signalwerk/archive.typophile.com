    html: <p>Hmm. Sorry to contradict, guys, but that sans doesn't  <br>look like Metro to me. Granted, it's a small sample. But  <br>the tail of the Metro g continues further around the  <br>curve, and so does the top of the a; the Metro s has  <br>a more closed aperture top and bottom; the Metro w is  <br>slightly narrower and quite idiosyncratic, with unequal  <br>interior and exterior angles; and the overall x-height  <br>of Metro is proportionately a little larger. <br> <br>This looks more like an import to me. I'm thinking  <br>probably Erbar. Unfortunately, there are no good online  <br>samples, as there has not yet been a digitization of the  <br>original Erbar, not that I'm aware of. <br> <br>-- K.</p>
