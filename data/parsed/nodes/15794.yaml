      <p>Miguel, although the basic spacing procedure you describe is quite sound, I do note some problems in your PDF, but these are typically kerning issues. For instance there is too much space between the roman <em>wa</em> combination.</p>
      <p>The biggest problem I have with your approach is that it seems to presume that the glyphs themselves have already been design and grouped prior to spacing. I space as I go along, and consider spacing to be intrinsic to glyph design. I don't think you can correctly judge the relative widths of letters without previewing them in words or pseudo-words, and this means that spacing has to be done <em>as part of glyph design</em> and not as a secondary stage after the outlines are complete. Calouste has many very nice features -- kudos on the Armenian --, but the r is a bit too wide and the s is a bit too narrow, and I wonder if this would have been so if you had addressed the spacing concurrently with the design of these letters.</p>
