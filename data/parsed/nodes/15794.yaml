      <p>"David Berlow: HnHing and HOLAing are new verbs for me. Would you elaborate on these steps? Thanks!"</p>
      <p>I use large "unkernable" pairs, like "rv" and "LA" to make sure the kernables, like "AV" and "ra" do not end up "overkerned." HnHing is to make sure, after the HOD and sometimes V are spaced, that the "n"fits nice to them, so then it can be the prime control for the l.c...clear?</p>
