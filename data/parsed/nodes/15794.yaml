      <p><cite>spaced n and o visually, balancing the white area between and inside the characters (the string noonnon is good for that)</cite></p>
      <p>I’ve been doing that with l/c HOHHOOH for 30 years. Print out large proofs, hang them on the wall, walk away until the letters look like 12 pt, have someone adjust the distance between them with you shouting instructions from a few meters (or feet) away, and finally take a pencil and divide the space between the letters on the wall. That gives you the initial sidebearings for straight and round sides. That was the method at Do-I-Get-Sued-For-Mentioning-Berthold way back in the 70s. A picture with me in front of H and O is around, but not published anywhere except on an old FontShop xmas card which made use of the<br>
      HOHOHO. If only posting images were easy.</p>
