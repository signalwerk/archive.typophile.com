      <p>For lowercase, I use: nuonubnuvnupnu first. This gives a straight-against-a-straight rhythm that helps me see the basic side bearings in a symmetrical space. I then reverse the n's and u's (unounbunvun) to see if it still holds up. I also use the typical "o" necklace.  I am new to type design so I wonder if any of you see a problem with this process? (Is there a madness to my method).  My basis comes from Calligraphy classes I took from Arnold Bank some 40 years ago.<br>
      For the caps, H and O necklaces (as shown by others)  </p>
      <p>ChrisL</p>
