    votes: null
    html: |-
      <p>Hrant: <em>The main reason for this is that I feel that users who don’t have kerning enabled aren’t picky anyway; so if you can assume that kerning is available, you can streamline things a fair amount.</em></p>
      <p>Given my market, I have to assume that large numbers of users are working with MS Word. Kerning is off by default (although not for complex scripts, thankfully), and most users don't know how to turn it on. I think such users may well be 'picky', but if they see a font that has bad spacing because kerning isn't on, they're not going to spend time finding out why this problem exists and how to turn on kerning: they're just going to blame the font and use a different one.</p>
  - id: 91795
    user_id: 1844
    user_name: Miguel Sousa
    user_path: null
    date_raw: 24 Oct 2005 — 4:16am
    date: 2005-10-24T04:16:00
    votes: null
    html: |-
      <p>I agree with John. Although MS Word users don't get everything out of their fonts (because kerning is not on by default), they will still get the most out of it, given that the font is well spaced. Glyph sidebearing values have to exist in the font, either we want it or not. Kerning information doesn't. So, relying on kerning and adding superfluous pairs to the font (and I'm not refering to the extra kerning data that John included for the Ethiopic font, for example), simply makes its size bigger, and adds more data that the applications have to deal with (which means it's more prone to errors and will use more resources).<br>
      My view is, if you can do it with spacing, don't do it with kerning.</p>
