      <p>Hrant: <em>The main reason for this is that I feel that users who don’t have kerning enabled aren’t picky anyway; so if you can assume that kerning is available, you can streamline things a fair amount.</em></p>
      <p>Given my market, I have to assume that large numbers of users are working with MS Word. Kerning is off by default (although not for complex scripts, thankfully), and most users don't know how to turn it on. I think such users may well be 'picky', but if they see a font that has bad spacing because kerning isn't on, they're not going to spend time finding out why this problem exists and how to turn on kerning: they're just going to blame the font and use a different one.</p>
