    <p>I would like to share with all of you, the <a href="/wiki/spacing" class="freelinking" rel="nofollow">spacing</a> method I used on <a href="http://www.adhesiontext.com/pdf/Calouste.pdf" rel="nofollow">Calouste</a> <em>(PDF file)</em>, the typeface I designed at Reading.</p>
    <p>After trying out a few spacing methods with no success, I felt the need to devise my own system, which has proven to generate fairly good results (not just for me but also for other people that have used it). The method is definitely not an outstanding innovation, nevertheless I haven't come across anything exactly like it elsewhere. Basically I took advantage of <a href="/wiki/adhesiontext" class="freelinking" rel="nofollow">adhesiontext</a>, the text tool I had developed earlier.</p>
    <p>I can't guarantee this method will work on every typeface. However I'm able to say that it made miracles on mine, as some could attest. Perhaps with a few adaptations it can still be useful and applicable in other cases.</p>
    <p>I would also want to warn that, as it will be obvious, this is a <strong>REALLY</strong> tedious process. Nonetheless, the outcome will most likely be quite rewarding, and time-saving.</p>
    <p>Finally I would like to add that this procedure might also help to drastically reduce the number of kerning pairs needed (at least that's what happened to me...).</p>
    <p><strong>The Method Used</strong></p>
    <p><strong>1.</strong> I divided the lowercase alphabet in 3 groups, <em>bdhilmnopqu</em>, <em>acefjkrt</em> and <em>gsvwxyz</em>, on the assumption that:</p>
    <p>a) the space on <strong>both sides</strong> of each element of the <strong>1st group</strong> can be determined, and relates to the space attributed to, at least, <strong>one side</strong> of another element in the same group, which has a similar shape. (e.g. the space on the <strong>right side</strong> of <em>b</em> and <em>p</em> is the same as <em>o</em>. Or, the space on the <strong>left side</strong> of <em>h</em> is the same given to the same side of <em>l</em>);</p>
    <p>b) the space on <strong>one side</strong> of each element of the <strong>2nd group</strong> is determined, and is equal to the spaces given to the elements of the <strong>1st group</strong> with a similar shape (i.e. the space on the <strong>left side</strong> of <em>k</em> is the same given to the same side of <em>h</em>, despite the fact that the space on the <strong>right side</strong> (of <em>k</em>) has no relation with any character in the <strong>1st group</strong>);</p>
    <p>c) the space around the elements of the <strong>3rd group</strong> has no direct relation with any of the other characters in the alphabet. (this is very design-dependent, as for example if <em>g</em> is not binocular-style, it should be included in the previous groups).</p>
    <p><strong>2.</strong> I spaced <em>n</em> and <em>o</em> visually, balancing the white area between and inside the characters (the string <em>noonnon</em> is good for that). Then replicated those amounts (with the necessary adjustments) to the rest of the elements on the <strong>1st group</strong>, always keeping in mind to assign the same value to similar/equal shapes. (e.g. the <strong>left side</strong> of <em>m</em> might receive the same amount of the same side of <em>n</em>. But (for a serifed typeface) <em>p</em> might need less space on the <strong>left side</strong>, because it might not have a serif on the baseline)</p>
    <p><strong>3.</strong> I printed a few test documents only with words that could be set using characters from <strong>1st group</strong>, and made the necessary corrections/adjustments.<br>
    Note: Here I would like to say that, in this first trial, it was clear that some of the glyphs had to be slightly changed (specially the <em>o</em>), because they were "breaking the rhythm/pattern".</p>
    <p><strong>4.</strong> After a *few* other print-outs and tons of adjustments, the elements of the <strong>1st group</strong> were finally acceptably spaced, so it was time to do the next step.</p>
    <p><strong>5.</strong> The next step consisted on adding, sequentially, each element of the <strong>2nd group</strong> to the <strong>1st group</strong>, and space it against the elements of the <strong>1st group</strong>. This meant generating test documents with the set of characters <em>bdhilmnopqua</em> and space the <em>a</em>, then <em>bdhilmnopquc</em> and space the <em>c</em>, and so on.<br>
    Note: It's very likely that the elements of the <strong>1st group</strong> will still need some fine adjustments along the way, which could also be used on characters with related shapes.</p>
    <p><strong>6.</strong> The following step was simply doing the process described above, but this time with each element of the <strong>3rd group</strong>.</p>
    <p><strong>7.</strong> Finally, I set a "normal" text and the overall spacing was just about right. Some fine-tuning, and from this point on was "kerning time"...</p>
    <p>That's about it.</p>
