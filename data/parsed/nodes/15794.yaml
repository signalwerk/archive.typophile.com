    html: |-
      <p><strong>Simon:</strong><br>
      <em>The proof of the spacing is in the setting. Which pages of the PDF showcase the spacing the best?</em></p>
      <p>Well, can't really say. Maybe the ragged-right columns, but the paragraphs on pp. 10-11 are not that bad. Nevertheless you'll definitely have to print it out to see it properly. On screen things don't look as good.</p>
      <p><em>The typeface looks lovely by the way. Has someone snapped it up or are you licensing it yourself? We’re always on the lookout for good multilingual typefaces.</em></p>
      <p>Thanks. No, not yet. I'm opened to proposals. Meanwhile I'm designing more weights, small caps and the other needed bits.</p>
      <p><strong>Erik:</strong><br>
      <em>have someone adjust the distance between them with you shouting instructions from a few meters (or feet) away</em></p>
      <p>Nice. This year's students should try that. It surely will make spacing more interactive and less boring. Besides, there will be more than a pair of eyes judging, which might be a good thing (or maybe not...).</p>
      <p><strong>Hrant:</strong><br>
      <em>The Latin is superb and the Armenian is inspired*, in fact better than some of the best native designers.</em></p>
      <p>Uau, thanks! As I didn't know the script, or the language (which unfortunately I still don't), I had to do a substantial amount of research, to inform my design decisions. Then it was submitted to people that can actually read it, and the necessary changes were made.<br>
      There are still a few things that I will like to change, but the essencial is there.</p>
      <p><strong>John:</strong><br>
      <em>For instance there is too much space between the roman wa combination.</em></p>
      <p>Yes, you're right. I'll have to check that. (Although it's not as noticeable as when printed)</p>
      <p><em>and this means that spacing has to be done as part of glyph design and not as a secondary stage after the outlines are complete.</em></p>
      <p>I completely agree with you, and as I say in the note to point 3, the glyph outlines are likely to have to be changed. Otherwise certain letter combinations will never work, despite of how well the typeface is spaced.</p>
      <p><em>I space as I go along, and consider spacing to be intrinsic to glyph design.</em></p>
      <p>Absolutely, can't agree more. However, one can do that once he/she is experienced, like you. The experience that enables one to pinpoint that the problem is on the glyph's design, and not on the space around it (or vice versa).<br>
      Since this was the first typeface I designed, I felt the need to fix one of the variables (the design) and tackle the other (the spacing) separately. Then whenever I felt that changing the spacing was no longer useful, I would turn to the design and make the necessary adjustments. Then go back to spacing, and so on.<br>
      Of course, it goes without saying that Gerry (Leonidas) played an important role here, telling me when I should put the design in stand-by, and start caring about spacing. That was when I approach the problem and developed the method.<br>
      But as you might understand, when learning typeface design, it's difficult to handle these two issues (glyph design and spacing) at the same. Despite of the fact that they're interdependent, one has to come aware of that gradually, otherwise things will end up all over the place. At least that's how I felt.<br>
      All in all, I simply wanted to share the method that worked for me. I thought that it would eventually be helpful to others, and, at the same time, use all your comments to improve it.</p>
      <p><em>kudos on the Armenian —, but the r is a bit too wide and the s is a bit too narrow</em></p>
      <p>Thank you. You might be right about the <em>r</em> and <em>s</em>, but this might also be one of those situations where the designer's experience, sensibility and/or views (about how the structure of a certain letter must be) enter a subjective and more personal area. For example, for some reason I can't really explain, I'm very sensitive to the <em>sa</em> combination, and will almost like/dislike a particular typeface just based on that. OCD (obsessive-compulsive disorder), go figure...</p>
