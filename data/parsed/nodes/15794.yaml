      <p>Miguel, the thing with me is that I -generally- oppose the conventional wisdom of making the base spacing work "perfectly" without kerning, and only using kerning to polish things up. The main reason for this is that I feel that users who don't have kerning enabled aren't picky anyway; so if you can assume that kerning is available, you can streamline things a fair amount. Another reason is actually related to Armenian type design, where relying heavily on kerning, especially positive kerning, can save you a ton of effort - noting here that (to me) in Design, economy of effort is central - and the time I save NOT making "fool-proof" kernless spacing is time I can use for things that are needed more.</p>
      <p>Anyway, in reference to what I wrote before what it boils down to is that when my black bodies start getting affected because of spacing considerations, sometimes this is "damped" by the eventual presence of kerning too, depending on the character and its probable adjacencies*. But it's not numeric, it's more... fudgy, although it's also iterative (of course) so subject to tweaking.</p>
      <p>* <a href="http://typophile.com/node/5106" title="http://typophile.com/node/5106">http://typophile.com/node/5106</a></p>
      <p>hhp</p>
  - id: 91781
