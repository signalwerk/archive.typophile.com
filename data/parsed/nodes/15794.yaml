      <p>Miquel, my approach to kerning is to use a list of real words that show combinations in context, so I start with a word that include an 'aa' combination, and then one with an 'ab' combination, and so on. I have good lists for Latin and Greek, and a slightly less good one for Cyrillic (it is Russian-centric, and isn't reliable for other languages). Once I've done this, I extend to diacritic letters either using classes or simply by copying kerning, depending on the size of the project. After that, I do diacritic exceptions e.g. 'Tä' as distinct from 'Ta'.</p>
      <p>If I'm working on a script for which word lists are difficult to obtain, e.g. Ethiopic, I use class-based kerning and make it as thorough as possible, even if this means including kern data for combinations that may never occur in natural language. I'd rather try to ensure that any combination will look good, rather than trying to guess what might be common or not. Nyala, which will ship with Windows Vista contains the class-based equivalent of more than 65,000 kern pairs. I usually enjoy kerning, but I didn't enjoy that! If I don't have an actual word list, I create FontLab preview lists that show pairs in context of regularly spacing glyphs.</p>
      <p>Because almost all of my projects involve OTL tables developed in VOLT, I use Sergey Malkin's excellent 'kern2volt' conversion tool, which examines expanded kern table data and builds efficient classes based on kerning values. So my workflow is FontLab class kerning -&gt; expanded (flat) kern table values* -&gt; VOLT via kern2volt.</p>
      <p>* FontLab Studio 5 includes special handling for very large kern table export as a result of one of my extended Arabic projects that had more than 72,000 expanded kern pairs.</p>
