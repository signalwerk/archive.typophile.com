    <p>Hi there,</p>
    <p>I’m wondering if someone can help me identify the attached font. It’s almost identical to Rian Hughes’ <a href="http://www.veer.com/products/typedetail.aspx?image=DET0000269#specimen">Wormwood Gothic</a>, being sold by Veer. However, I’m looking to identify the original face, without the degradation and roughing up that Wormwood has.</p>
    <p>I’ve seen it used in a few recent commercial applications, but I recall seeing it most often used in boxing posters from the 1950s and forward.</p>
    <p>Any thoughts or suggestions would be appreciated. Thanks.</p>
