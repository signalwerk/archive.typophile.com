    <p>I'm concepting out some UI ideas for game and my AD wants to find a font that looks like futuristic graffiti. He wants something in the style of Extreme-G or Virtual On, but readable enough for buttons.</p>
    <p>Any recommendations for fonts like that?</p>
    <p>Here's references,</p>
    <p><a class="freelinking external" href="http://gamesdbase.com/Media/SYSTEM/Nintendo_N64/Title/big/Extreme-G_XG2_-_1998_-_Acclaim_Entertainment.jpg" rel="nofollow">Extreme-G Logo</a></p>
    <p><a class="freelinking external" href="http://www.game-ost.com/static/covers_soundtracks/1/6/16227_353907.jpg" rel="nofollow">Virtual On Logo</a></p>
    <p>Thanks!</p>
