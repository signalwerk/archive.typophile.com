    <p>Tom, old buddy, old pal—</p>
    <p>I have a problem which, so far, nobody else here seems to know how to solve. I have a collection of AI pattern brushes which will allow users to create some spiffy borders, just by drawing a rectangle and clicking—which, I figure, is pretty idiot-proof, but some people CAN surprise you.</p>
    <p>As I outlined in another thread which I will not link to since my last post with a thread got shelved for moderator approval, I had to use zero-width spacing lines to line up some of the elements so that they would work correctly. Which is cool, unless someone wants to apply a stroke to the overall pattern, which is not cool—because, THEN, my brilliant workaround becomes ANOTHER problem.</p>
    <p>So, I figure you gotta know a guy who can help me solve this little problem, since I also figure that the pattern works—once the individual elements have been made into swatches—without the spacers, as long as the 0,0 origin point remains the same. I just don't know HOW to get to the Postscript and, even if I did, if the Postscript is not readable by a human being—which, since we are talking about me, is a bit of a stretch—I am, have been and shall forevermore remain clueless about how to solve what OUGHT to be a very simple problem.</p>
    <p>So, if you know a guy—or even a guy who knows a guy—could you clue me in, please. I figure I can do pretty good selling a set of 12 for about three bucks a pop, and all twelve for around $25 to $30.</p>
    <p>Or, maybe, even give them away if they have to buy SOMETHING ELSE to get them “free”. <em>Capisce?</em></p>
