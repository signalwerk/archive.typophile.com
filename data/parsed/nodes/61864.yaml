    <object width="501" height="282"><param name="allowfullscreen" value="true"><param name="allowscriptaccess" value="always"><param name="movie" value="http://vimeo.com/moogaloop.swf?clip_id=6382511&amp;server=vimeo.com&amp;show_title=1&amp;show_byline=1&amp;show_portrait=0&amp;color=00ADEF&amp;fullscreen=1"><embed src="http://vimeo.com/moogaloop.swf?clip_id=6382511&amp;server=vimeo.com&amp;show_title=1&amp;show_byline=1&amp;show_portrait=0&amp;color=00ADEF&amp;fullscreen=1" type="application/x-shockwave-flash" allowfullscreen="true" allowscriptaccess="always" width="501" height="282"></object><p>
    Handcrafted with love by Brigham Young University (BYU) design students and faculty, for Typophile Film Fest 5. A visual typographic feast about the five senses, and how they contribute to and enhance our creativity. Everything in the film is real—no computer generated (CG) effects!</p>
    <p>Shot with a RED One, a Canon EOS 5D Mark II, a Canon EOS 40D, and a Nikon D80.<br>
    Stop motion created with Dragon Stop Motion.</p>
    <p>Creative Director &amp; Faculty Mentor:<br>
    <a href="http://www.brentbarson.com">Brent Barson</a></p>
    <p>Writing &amp; Storyboarding:<br>
    Brent Barson, Jessica Blackham, Analisa Estrada, Meg Gallagher, John Jensen, Regan Fred Johnson, Colin “The Pin” Pinegar</p>
    <p>Construction, Paint &amp; Glue:<br>
    Brent Barson, Wynn Burton, Analisa Estrada, Meg Gallagher, Olivia Juarez Knudsen, Casey Lewis, Reeding Roberts, Deven Stephens, Brian Christensen (Brain Sculpture)</p>
    <p>Animators:<br>
    Brent Barson, Wynn Burton, Analisa Estrada, Meg Gallagher, Olivia Juarez Knudsen, Reeding Roberts, Deven Stephens</p>
    <p>Cinematographer:<br>
    Wynn Burton</p>
    <p>Editing:<br>
    Brent Barson, Wynn Burton, Analisa Estrada, Meg Gallagher, Reeding Roberts</p>
    <p>Hand Models:<br>
    Analisa Estrada, Meg Gallagher, Olivia Juarez Knudsen, Deven Stephens, Michelle Stephens</p>
    <p>Original Music:<br>
    <a href="http://www.micahdahl.com">Micah Dahl</a></p>
