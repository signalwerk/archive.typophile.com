  html: |-
    <p>I would like to announce the release of CR8type version 2.1<br>
    This is a minor update. The following features have been added in this version (2.1):</p>
    <p>- OpenType tables can now be retained to allow editing of OpenType TT fonts.<br>
    - all name ID’s be accessed, including those belonging to OpenType specs.<br>
    - edit all OpenType metrics and description entries in required tables.<br>
    - now faster opening very large (over 10,000 glyph) TrueType fonts (2 to 15 times faster than FontLab &amp; AsiaFont Studio).<br>
    - effectivly no limit on the number of points per glyph, so complex images (eg signatures) can be traced using CR8tracer.<br>
    - and some minor bug fixes.</p>
    <p>Allan Murray<br>
    CR8 Software Solutions<br>
    <a class="freelinking external" href="http://www.cr8software.net/type.html" rel="nofollow">http://www.cr8software.net/type.html</a></p>
