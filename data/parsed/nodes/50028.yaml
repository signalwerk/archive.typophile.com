      <p>Rene, I’m surprised that no one has tried to answer this one. I thought it looked like something I had seen, but just couldn’t recall where. The strong diagonal stress of the C, G and presumably the O, should ring some bells for someone here. I have a feeling that this is an old font that has been in a lot of budget collections, but is not offered by any major foundry. Something like Opti or Brendel perhaps, but not places that design their own fonts.</p>
      <p>Any ideas? </p>
      <p>- Mike Yanega</p>
