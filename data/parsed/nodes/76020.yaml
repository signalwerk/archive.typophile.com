    <p><a href="http://www.drama-magazine.com" title="www.drama-magazine.com">www.drama-magazine.com</a> and click on "view issues"</p>
    <p>I'm a starting graphic designer and really want help to find out what these are (i've tried "What Font is That" and "Identifont" already).</p>
    <p>There are a few fonts, as far as I can count: the serif one used for people's name, a curved-joined san serif font ("Nicholas Hoult" name), and a simple San Serif for some of the text (it's not Futura, it's more narrow, and has an angle (the e goes up, the W's middle bar pushes to the left - I think it's like "Organic" or something).</p>
    <p>Please please, would also love to know if you know what the Drama title font is.<br>
    Thanks.</p>
    <p>P.S. Enjoy the photography</p>
    <p>P.S.S. I just put samples of the fonts here, if that's easier. Thank you</p>
