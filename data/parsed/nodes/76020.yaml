    html: <p>One sans should be <a class="freelinking external" href="http://new.myfonts.com/fonts/itc/avant-garde-gothic/" rel="nofollow">Avant-Garde Gothic</a> tweaked, the other sans <a class="freelinking external" href="http://www.typography.net/type/font/bliss" rel="nofollow">Bliss</a> and the serif a combination of <a class="freelinking external" href="http://new.myfonts.com/fonts/adobe/caslon/regular/" rel="nofollow">Caslon Pro</a> and <a class="freelinking external" href="http://new.myfonts.com/fonts/adobe/caslon/italic/" rel="nofollow">Caslon Pro Italic</a> (swash caps available as opentype features).</p>
