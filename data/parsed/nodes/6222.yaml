    html: <p>Kudos to ATypI for adding this special membership level, and making it happen so quickly. We should all strive to make this a truly global community; I think we're making great strides. <br> <br>Based on Hrant's post, which has a delightful air of challenge, I will point out that <a href="http://www.typesociety.org/">SOTA</a> has a history of offering inexpensive membership fees and conference admission. <br> <br>SOTA already offers a reduced membership fee of $35USD per year for all members residing outside North America. This membership level is deemed Global Professional, and carries the exact same benefits as the regular Professional membership level (which is $60USD). <br> <br>The annual SOTA conference, TypeCon, is already priced so low that I don't know how it could go any lower, unless SOTA were awarded some outrageous endowment (not that we're not trying!). Registration is under $150USD for professionals, and less than $100USD for students. When we announce the exact admission fees for <a href="http://www.typecon2003.com/">TypeCon2003</a> in a few weeks, I think people will be pleasantly surprised. SOTA members receive a 20% discount off conference admission. Speakers and volunteers get in free. <br> <br>For the price of conference admission, TypeCon2003 includes 3 days of programming (accompanied by refreshments; ask Ray Larabie about the cookies), free admission to some very cool evening events, and more of the good things you expect from an event produced by our community.  <br> <br>If anyone wants to discuss SOTA and TypeCon further, let's move over to the <a href="http://www.typophile.com/sota">SOTA SIG</a> here at Typophile. This is ATypI's thread, and they should have it all to themselves.  <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br></p>
