    html: "<p><i>Come on, by the middle of Saturday you could have had a strong idea how many extra books you'd be left with...</i> <br> <br>Hrant, if you really think anyone was worrying about what to do with the stack of books <i>or even looking at them</i> on Saturday during the conference, you've obviously never worked in those kind of conditions. The conference team has to spend a huge amount of energy simply to stay on top of all the aspects of the conference that have been planned for, to keep everything running smoothly. They do not have time to come up with creative solutions to every unforseen circumstance, although they must handle many unexpected things; their priority must always be to concentrate on the steady operation of the conference as planned. <br> <br>By the way, by Sunday morning a lot of people who had received tokens for the book had not picked up their copy yet, because they were waiting until the last minute so they would not have to carry it around. I doubt very much if anyone on the team was keeping a tally of the books: it wasn't a priority. As to giving the books away: it would have cost ATypI a lot of money to ship them back to England, and then what should have been done with them? They would still be sitting in Sharon Moncur's office, waiting for the additional expense of moving them somewhere from where they <i>might</i> be sold and some money might filter back to the association. <br> <br>Finally (and I mean finally, because this is a bloody silly conversation), let me recount another circumstance of the conference. I produced 150 copies of a software CD to be distributed to attendees of the Font Technology Forum. I guessed we would have a max of 100 attendees, but I didn't want to run the risk of not having enough. I paid to have the CDs produced and to have them shipped to Rome. In the end, I had about 60 left over, which were handed back to me by the conference team on the Sunday afternoon. What did I do? I wandered around and handed them out to anyone who happened to be in the lobby. Now, I'm sure there are some people who would have liked a copy who didn't get one, and there are some people I would have liked to give one to whom I didn't see in the lobby at that time. If I'd thought about the CDs at any time after the Thursday afternoon, I would have realised that there were extra copies that could be handed out to 'deserving' people. Frankly, the CDs were the last thing on my mind. <br> <br>If I had been one of the people who carried away an armful of books to save them from an ignominious fate, I would glady send a copy to anyone who did not receive one in Rome who was willing to pay postage. As it is, I only have one extra copy, but I'll send it to Matha if he shuts up about it.</p>"
