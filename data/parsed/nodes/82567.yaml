      <p><em>Mr. Shinn: “The process of automatically scanning, bitmapping and auto-tracing seems a bit apologetic and half-hearted, as a way of challenging copyright and license restrictions, and not worthy of debate: scanning is not the manipulation of digital data, but a form of photography, and therefore a mechanical, analogue process.”</em></p>
      <p>I understand the point you are making, especially since Gill Sans would or could be considered public domain. However, I think the gray area is massive and arguable regarding making a copy of type using mechanical, analog processes. There is an opinion held that if the appropriation originated from the digital font, then it’s a violation for fonts with patent protection (based on U.S. patent law). While I think that is the way it should be, I don't think that is the actual, standing legal basis of the typographic design patent. I interpret the design patent to only protect the digital points and curve algorithms in their digital form.</p>
      <p>Here’s a quote: “The Lucida font family (designed by Bigelow and Holmes) were some of the first digital fonts to be given a patent. If a designer were to copy them, even by redrawing them from scratch using pencil and paper, he would be in serious legal trouble.”</p>
      <p>That came from this source: <a class="freelinking external" href="http://scripts.sil.org/cms/scripts/page.php?item_id=UNESCO_Font_Lic" rel="nofollow">http://scripts.sil.org/cms/scripts/page.php?item_id=UNESCO_Font_Lic</a></p>
      <p>Has that opinion of a typographic design patent ever been challenged and/or legally upheld? While Sans Guilt may not be the ideal test case, it does present an interesting question regarding legal ownership of type and fonts.</p>
