      <p>Um, no. The difference between a non-open source typeface and an open source typeface is that the latter can be redistributed and modified. This has nothing to do with ‘traditional’, which I associate — and the other comments re. ‘process’ concur -- with how a typeface is made not how it is distributed. Plenty of typefaces made in a traditional way -- created by a designer, manufactured to a high level of technical quality -- have been released as open source, and libre, fonts. What the autotracers are doing isn't particular to open source -- plenty of commercial knock-offs of fonts have been made in the same way --, nor is playing the word games of conceptual art to excuse lack of original creative effort.</p>
