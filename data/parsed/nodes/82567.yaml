      <p>Hrant, by "epochal", I was referring to the way this project has been associated with the expiry of the Gill Sans copyright—70 years after the death of the notorious Mr. Gill. But this is not the beginning of a new era of permissable Gill Sans clones, first to challenge the status quo, because there already exist several Gill Sans clones. So this project's raison d'être—the legal and ethical questions which it purports to raise—are already out there. So what other reason is there to publish these fonts? </p>
      <p>Free, badly-made, distress-style fonts is already a well-populated genre, for obvious reasons.</p>
      <p>It is disingenuous to state that OSP is "trying to clarify the complicated legal matter around typographical heritage, technology and intellectual property", because its agenda is to promote open source. I doubt that Monotype will play into this publicity stunt.</p>
      <p>Anyway, my opinion was sought, and I've obliged.</p>
