      <p>BlueStreak writes: "Some say the patent law regarding digital fonts protect the outlines (the shapes) even after they are printed. I disagree. Once you print the letterforms, they are no longer software."</p>
      <p>Do you know what a design patent is?<br>
      <a href="http://en.wikipedia.org/wiki/Design_patent" title="http://en.wikipedia.org/wiki/Design_patent">http://en.wikipedia.org/wiki/Design_patent</a></p>
      <p>The first ever design patent issued in the USA, in 1842, was for a typeface.</p>
      <p>"Patent and copyright law in the U.S. do not protect typefaces."</p>
      <p>Copyright does not protect the abstract concept of the design. Design patent does precisely that.</p>
      <p>"You can legally scan and retrace the letters to create new outlines. You did not copy the protected software. You copied the analog shapes of the letters which have no legal protection in the U.S."</p>
      <p>All true if and only if there is no design patent in play. In general, there are not a lot of these for fonts; AFAIK only Adobe routinely pursues these. Also, design patents only last 14 years, so that too means that they are irrelevant for Gill Sans.</p>
      <p>Of course, I'm not a lawyer. Anybody whose livelihood depends on this would be well advised to consult a lawyer on these issues.</p>
      <p>Cheers,</p>
      <p>T</p>
