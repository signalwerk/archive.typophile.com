      <p>No problem, Mr Streak.</p>
      <p>"It was my mistake to think the design patent was only applicable to fonts. I was unaware they actually are applied to typefaces as well."</p>
      <p>What do you mean by the distinction?</p>
      <p>To simplify only a little: when I use the terms, "typeface" means the abstract design and refers to potentially an entire family, and "font" means the instantiation of a single style of that design, these days in a digital outline format such as .otf or .ttf. This is ~ the most common usage of the terms in the type industry, though there is no universal agreement on correct usage.</p>
      <p>As I understand it, a design patent applies to each individual style of a typeface, as instantiated in a font. What's being patented is the abstract design, but it needs to be instantiated in something (a font) to have something to attach the patent to.</p>
      <p>Regards,</p>
      <p>T</p>
