      <p>I agree with Rich that the terms of the license are immensely important. I also think that discussing EULA details should be seen as completely within the purview of highly appropriate topics for Typophile, even if those details don't interest everyone. No, EULAs are not typography or type design per se, but they are exceedingly closely related.</p>
      <p>I have a love/hate relationship with EULAs myself. I find them interesting in the abstract, I think they are incredibly important, I don't mind scanning EULAs to find important license conditions... and yet one of the most boring things I've ever done was to try to craft a font EULA. Ugh. I still need to go back and finish it, but... ugh.</p>
      <p>Cheers,</p>
      <p>T</p>
