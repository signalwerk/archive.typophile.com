      <p>As to this statement:</p>
      <p><em>"This is not necessarily what we are interested in. We are interested in the process, in ways of producing....Test out ideas and processes."</em></p>
      <p>Alternative *ways of producing* has been my focus for eight months now.</p>
      <p>Because the idea that the same processes used to create and deliver fonts for a relatively small professional market working with fixed-size media would be the same for a mass market consisting of amateurs, professionals, and everyone in between for a variable size media like the web, just doesn't make any sense.</p>
      <p>It wouldn't make any sense even if fonts were a physical, not a digital product.</p>
      <p>Imagine if, in 1912, the *average person* had the ability to produce their own newspaper and/or magazine which they could magically distribute to the whole world.<br>
      Could the American Type Foundry of 1912 possibly fill the demand for quantity and variety?</p>
      <p>Of course not. In this respect, the same economic pressures are at work.</p>
      <p>Ahh, but what the frack do I know?</p>
