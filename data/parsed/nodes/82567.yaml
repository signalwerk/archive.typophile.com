      <p>I'm still not sure what the letter the OP posted and the argument made by Mr. Fink are attempting to accomplish.</p>
      <p>Some things require trade skills--"sweat of the brow"--so to speak. Some can (and should) be produced mechanically (I'm thinking of products where consistency is a priority). If I decided I'm going to sell hand-made machine screws, no matter how much time I spent making them, I would most likely not meet the same level of quality as a mass-produced screw.</p>
      <p>Some products can exist in both worlds--with an established distinction between the "handmade" and the "mass-produced". </p>
      <p>In the latter, both have their own, specific, qualities which would place one above the other in terms of desirability in different circumstances. This difference is usually in regards to aesthetics. While the mass-produced item may fulfill the desired function, aesthetically, the hand-made may be more pleasing.</p>
