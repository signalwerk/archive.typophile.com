      <p>"Typefaces, yeah. Their digital incarnations, no."</p>
      <p>Well, I think quality is related to the technical format of a given historical moment, sure. But what I was suggesting in an implicit way was related to the care, you may say the attention, you put into a product. Which, in the case of a typeface involves an aspect which I think can’t be reduced to one of its parts (i.e. "aesthetic", "technical", etc.), but to the whole of it.</p>
      <p>To make you an example, I take the type on your website.<br>
      The typeface you used in your logo seems to be derived by autotracing (I may be wrong, given it's tiny, but I suppose so). Autotracing is a thing I find mostly inappropriate, since – in my opinion – there isn’t a piece of software following faithfully complex curves and transitions.<br>
      This is particularly noticeable at bigger point sizes, but on paper looks unpleasant also in small sizes. And that’s just one aspect, I am not getting into spacing, kerning and overall evaluations of the typeface.<br>
      Please note I have taken as an example a typeface which is irregular in its vocation, but I criticized (in this instance) an aspect which I do not consider only technical.</p>
      <p>Scrolling down your page: aliased type, now that we can use webfonts, to me it becomes more problematic than ever. In my browser I have difficulties to read the summaries of the articles, because the point size is small, the typeface you choose is quite light and tightly spaced. In many cases, small point sizes would be infinitely better aliased.</p>
      <p><cite>Business and technology enable design up to a point, but then they get in the way.</cite></p>
      <p>@Nick: I agree, although each technology has its advantages in defining a part of its value. There is to say that digital designs are somewhat "disincarnated" as long as they don’t get printed. And I wouldn’t live in the world of "Freejack". :)</p>
