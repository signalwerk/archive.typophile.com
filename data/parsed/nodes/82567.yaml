      <p>You’ve raised a fascinating legal question. It is a huge gray legal area where I can see some disagreement by many parties, and a case begging for a legal precedent.</p>
      <p>I’ve read some unofficial legal interpretations/opinions based on U.S. law that say you cannot legally do what you’ve done, i.e., print and scan a digital font to retrace the shapes to then create a new digital font. Some say the patent law regarding digital fonts protect the outlines (the shapes) even after they are printed. I disagree. Once you print the letterforms, they are no longer software. There is no legal protection from that point on. Patent and copyright law in the U.S. do not protect typefaces. You can legally scan and retrace the letters to create new outlines. You did not copy the protected software. You copied the analog shapes of the letters which have no legal protection in the U.S.</p>
      <p>The form of type design appropriation you describe is not new to the digital world. It’s been practiced since the beginning of type.</p>
      <p>I think the name Sans Guilt is exceptionally clever, and am eager to see how this proceeds</p>
