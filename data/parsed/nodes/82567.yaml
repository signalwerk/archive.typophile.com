    <p>Dear Typophile members,</p>
    <p>A few weeks ago  <a class="freelinking external" href="http://ospublish.constantvzw.org/" rel="nofollow">we</a> sent this open letter to Monotype.<br>
    The purpose of this letter is to generate a dialogue around the issue of reinterpreting material sources in a predominantly digital culture.<br>
    We are Looking forward to hear your opinions about this matter on this thread or directly on our  <a class="freelinking external" href="http://ospublish.constantvzw.org/news/sans-guilt-it-looks-like-the-story-continues" rel="nofollow">blog</a><br>
    OSP </p>
    <p>======================================================<br>
    From:<br>
    Open Source Publishing<br>
    Rue du Fortstraat 5<br>
    1060 Bruxelles, Belgium<br>
    <a href="mailto:mail@osp.constantvzw.org">mail@osp.constantvzw.org</a></p>
    <p>To:<br>
    Monotype Imaging headquarters<br>
    500 Unicorn Park Drive<br>
    Woburn, MA USA 01801<br>
    <a href="mailto:us@monotype.com">us@monotype.com</a></p>
    <p>Brussels, 11 April 2011</p>
    <p>Dear Monotype,</p>
    <p>We are writing you because we just published Sans Guilt [1], which is a reinterpretation of the Gill Sans released under an Open Font license.</p>
    <p>We are OSP [2], a design collective based in Brussels that has been working with Free and Open Source software since 2006.</p>
    <p>We believe that the 71th anniversary of the death of Eric Gill implies that his work is now in the public domain. To mark this anniversary we decided to liberate the Gill Sans and make a free and open source release of it.</p>
    <p>We created three variants from different sources. One was scanned from original drawings (Sans Guilt Drawing Based — DB), another from hand-printed letterpress (Sans Guilt Lead Based — LB) and a third had a digital file as a basis (Sans Guilt Monotype Based — MB). The work was done in collaboration with students from the Royal College of Art in London.</p>
    <p>Our liberation of the Gill Sans raises legal and ethical questions surrounding proprietary font software and works of typography that are in the public domain. As designers, we can not answer those questions theoretically so the Sans Guilt project is an attempt at finding practical answers.</p>
    <p>To us it seems that the central question about any font reinterpretation is that of identifying and transforming material sources. Throughout history fonts have always been adapted from previous renderings, often transposing the design from one technology to another.</p>
    <p>In order to explore this historical context and to understand how to work with this complicated matter, we released Sans Guilt. The DB-variant is based on original drawings by Eric Gill that we found in the RCA library. The images were scanned and then traced using a custom software to produce PostScript outlines. The LB-variant started from the Gill Sans letterpress available at the RCA printshop. Students manually printed the movable type and than scanned the result.</p>
    <p>The third variant is possibly the most problematic. Because to us the digital is material too, we wondered if we could use a digital source as a starting point for liberating the Gill Sans. For the MB-variant we set a text in a page layout software with a licensed Monotype Gill Sans. This text was then turned into a bitmap and ran through a software that converted each glyph back into a PostScript outline.</p>
    <p>Although Gill Sans as a design work is in the public domain, the font software that we used to create the material sources for our reinterpretation is not. In the case of computer fonts there is a blurring of boundaries between technology and visual design. By turning the text into a bitmap image we did not reuse any part of the digital information of the Monotype Gill Sans itself. We believe that the bitmap is solely a representation of the design work of Eric Gill which we consider to be in the public domain since 2010.</p>
    <p>With the creation of Sans Guilt and by writing you this letter we are trying to clarify the complicated legal matter around typographical heritage, technology and intellectual property and we are looking forward to discuss the implications with you.</p>
    <p>Kind regards,</p>
    <p>OSP</p>
    <p>[1] <a href="http://ospublish.constantvzw.org/foundry/sans-guilt" title="http://ospublish.constantvzw.org/foundry/sans-guilt">http://ospublish.constantvzw.org/foundry/sans-guilt</a><br>
    [2] <a href="http://ospublish.constantvzw.org/about" title="http://ospublish.constantvzw.org/about">http://ospublish.constantvzw.org/about</a></p>
