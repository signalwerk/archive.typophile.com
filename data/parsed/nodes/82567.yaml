      <p><em>Was Hendrix's guitar playing more important than the stage antics?</em></p>
      <p>Yes.</p>
      <p><em>And if so, why was it more important?</em></p>
      <p>Would anyone have gone to just watch a man writhing around on a stage? Would they buy and listen to recordings of a man writhing around on a stage? The physical, visual performance was an adjunct to the music, hence secondary, hence less important. It was part of the live performance of the music, but while the music is separable from the stage antics and remains valuable, the opposite is not true.</p>
