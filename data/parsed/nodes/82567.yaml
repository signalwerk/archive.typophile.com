    html: |-
      <p>This is not quite so epochal as it is being touted.<br>
      Gill Sans cannot be liberated, because it is not imprisoned.</p>
      <p>There have been many interpretations of Gill Sans, by various foundries, often riffing on his name.<br>
      Fountain has one (Eric Sans), so does Typodermic (Jillican) and K-Type (Gill New Antique). And Softmaker/Fontsite (Chantilly).<br>
      And how about Jan Tschichold's rather blatant 1933 appropriation, now published by Préscence as Tschichold?!</p>
      <p>As long as one doesn't engage in point piracy, or copy a recent, distinctive style of type design too closely, there is not really an issue here—certainly not for a design as old as Gill Sans, whose designer is long gone. Or unless you want to get into an argument with someone like me who actually designs new typefaces.</p>
      <p>This is not a design issue, but a business and legal matter.</p>
      <p>The process of automatically scanning, bitmapping and auto-tracing seems a bit apologetic and half-hearted, as a way of challenging copyright and license restrictions, and not worthy of debate: scanning is not the manipulation of digital data, but a form of photography, and therefore a mechanical, analogue process. To really challenge the law, one would have to perform and publish a bit-to-bit transformation.</p>
      <p>Sans Guilt MB is a dull student project, a technical exercise masquerading as critical design.<br>
      The technical quality is poor, it doesn't look like the students are picking up much technique or learning anything practical about the aesthetics of line and weight.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/eeee_3492.png"></div><br>
      Design is not the uninspired manipulation of an exisiting work, serving as second fiddle to prop up a written treatise.<br>
      Designers should design. But artists don't have to, and the students involved were from the RCA.<p></p>
      <p>Guilt Sans LB is a paltry offering in a well-worn genre. Metallophile, for instance.</p>
      <p><em>Throughout history fonts have always been adapted from previous renderings, often transposing the design from one technology to another.</em></p>
      <p>That's incorrect. Throughout history, fonts have been made from both new type designs, and as revivals from older designs—not necessarily from specific "renderings".</p>
      <p>Bodoni revivals, for instance are rarely facsimiles or straight media transpositions, but are usually new works based on the designer's knowledge of various interpretations within the Bodoni genre, a synthetic assimilation. Neither is the postmodern Bodoni Egyptian an adaptation, although it is pointedly informed by the Bodoni archetype. </p>
      <p>Revivals have generally sought to perpetuate the use of typeface designs by transposing them from older technolgies to new, and also to give cultural relevance to new media.</p>
