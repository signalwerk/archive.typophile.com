      <p>I have found the original Tahoma Font Specification dated March 07 1995 which is the date the original bitmaps in the form of a .fon library were delivered to the Windows 95 development team.</p>
      <p>This specific spec is for the first use of a font using the name Tahoma. It actually was the protype font ’Ohana’ renamed. </p>
      <p>I supplied a bitmap font in a .fon form for 18, 22 pt VGA that would be used during the Windows 95 installation process. The reason a bitmap was necessary was during system installation there isn’t a rasterizer present so static bitmaps were used for text and graphics.</p>
      <p>Outlines were made and a .ttf created Sept 02 1994 to a full Win/ANSI character set. This font was fully hinted in TrueType. </p>
      <p>The original idea that Matthew had was to do something like Geneva on the Mac but the final result was a bit too close and it got scrapped.</p>
      <p></p><div class="imageWrap"><img src="/files/ohana_4132.jpg"></div><p></p>
      <p>I also made some bitmap only TrueType fonts of the original Tahoma bitmaps which had 3 sizes of bitmaps (11,12 and 14 ppem) and only circles for outlines. These were the ones used in testing and later when Tom Rickner was hinting he had to match the bitmaps I put in. The  font at that time was called Tahoma Condensed.<br>
      </p><div class="imageWrap"><img src="/files/tahomacd_5463.jpg"></div><p></p>
