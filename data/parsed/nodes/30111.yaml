    html: |-
      <p>Yes I was incorrect thinking about older versions and not the final families. I moved off the fonts once they went to the final stages and worked on other things. </p>
      <p>the Verdana and Tahoma UC H have the same stem width of 198 and ’O’ is 206 in both, but the overall black width of the ’H’ in Verdana is 1383 with an advance width of 1539, and Tahoma the ’H’ is 1232 with an advance width of 1383. Matthew made the black of the characters wider in many cases to increase the readability and to fix the compressed nature of Tahoma that was originally made as a UI font.</p>
