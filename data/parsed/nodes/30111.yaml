    html: <p>Verdana is included with the MS Internet Explorer installer, and is therefore ubiquitous. Also it is designed to be very legible on screen at very small sizes. I don’t know how one would measure its popularity, though. Certainly it is one OF the most popular web fonts, but I have doubts that it is THE most popular.</p>
