      <p>Joe,<br>
      There may be a few designers who hold visibly successful designers up as "Rock Stars" but that is true of any profession (Boot-licking is an old established custom.). Like most designers, I have labored in anonymity for my entire career.  I feel I have done some very good work as well as some in the more odoriferous category.  Like most designers, I have my opinions about the assorted "Rock Stars" in our field--some I hold in great esteem simply because I admire their work.  There are other "Rocky-horror Stars" whom I perceive as quite ordinary in their work and I say so if the subject arises. I don't feel it appropriate to name names here and begin a "Sucks / Doesn't Suck" list. I think what we see (and what starts stereotypes) is that the most vociferous (read obnoxious) boot lickers in our profession ooze praise with such a phony veneer that we remember those people above all the many others who just go about their business.  In a crowded subway car, we remember the guy who hasn't had a shower in a month, not the rest of the people along for the ride. We really don't "know" what designers as a group feel.  We only have heard opinions stated by others.  We can create self-fulfilling prophesies by only recognizing designers who fit the narrow stereotype and ignoring those who don't.  Perhaps what we need is a comedian like Jeff Foxworthy who has a routine where he asks "How do you know if you are a redneck?" and then gives answers involving trucks, beer, trailer parks, and NASCAR:-)</p>
      <p>ChrisL</p>
