      <p>I'll add my "ehw" here because your stereotypes are so superficial that they make your whole approach seem shallow. I don't understand the need for the hair color, clothing preference, stereotypes. When I get a client brief suggesting that middle-aged moms will be the target user I don't ask what color their hair is (unless it's related to the product!) or what they eat for breakfast (unless it's relevant!). I ask broader questions like how they shop, what activities occupy their free time, how they get their information, what is their income level. Do they make decisions for others. Et cetera.</p>
      <p>I'd be more interested in the deeper stereotypes about designers. For example(s):</p>
      <p>Why do designers put celebrity designers on pedestals believing they can do no wrong? (Maybe we don't. I can think of plenty of examples where celebrities work is heartily critiqued, just not by any major design organizations.)</p>
      <p>Why do designers (who presumably try to help others change) have a difficult time with change themselves? (We're riding a bandwagon or two like most people we criticize.)</p>
      <p>Why do most designers seem to lean leftward in their politics? (Do they really think politically or do they just want to question the status quo because it's hip or because it's what "good" liberals have done since the sexual revolution?)</p>
      <p>When asked why designers want to succeed in design, why is the answer often "fame"? (Is it because answering "money" is unrealistic?)</p>
      <p>As for me, I haven't worn all black since. Geez. Since like 2001. =)</p>
