      <p>Oh yes, Chris, you have to aim higher.. not that there is anything WRONG with being a plumber! </p>
      <p>When I went through Customs on my way to NYC, the agent asked me what I was doing in the big city. I answered that I was going to a Type Conference. “A Tape Conference”? she asked. “No, Type... letters, alphabets...,” I tried to explain. She just looked at me deadpan. The next time I was asked why I was in NY, I replied, “Conference on Letters”. The gentleman I was speaking to raised an eyebrow, “Leather?” he said. “No, no!,” I said, “LETTERS - L E T T E R S!” The third and final type someone asked me, I replied “I’m a designer here for a design conference”. That was easy!</p>
