      <p>Alchion, you're asking the wrong crowd here.</p>
      <p>There's a distinction between the cultural stereotype of any given group, and the perception of the characteristics of a specific group by a group member. The latter is usually quite diffuse, because:<br>
      a. members know their own groups quite well and have a sophisticated, many-facetted view of that group<br>
      b. people are almost never member of one and only one social category. So they're not often going to think of themselves solely as stereotypical members of said social category, because in the image of oneselve, other categories "interfere" and add to the self-image<br>
      c. not only the image of a social category that one is a member of is diffuse, and gets more blurry around the edges, so is the actual category itself (perhaps with the exception of male-female, and even then...)<br>
      d. all of the above.</p>
      <p>Then, on the other hand, there's the social stereotype which is often very shallow, cliché, etcetera. The social stereotype is well known to practically all members of the culture in which the stereotyped group lives, and because of that, and all the stuff I mentioned above, it's better to ask non-group members about the stereotype than group members.</p>
      <p>Final remark: stereotyping in marketing campaigns often leads to the target (stereotyped) group being hurt, or dismissing the campaign as being shallow. I wish you much subtlety and humour, and I'm curious about the result ;-)</p>
