      <p>Off-Topic: You might be a Designer if:<br>
      You admire the type in Campell's Alphabet Soup...<br>
      Oh those delicously rounded san serifs!</p>
      <p>Back On-Topic: My Two Cents:<br>
      Designers are fiercely overprotective of big ideas. They will champion them at all costs... Very detail-oriented; "I wonder what type of wood grain is on that workstation desktop?"... Specifics are everything to them: the visual look of gloss inks, the tactile feel of certain papers, the correct usage of typography... For most modern designers, their life is married into technology. It's an arranged marriage, but they accept it. Most designers that I know are very technologically literate... The designer stereotypes that I pick up on the most are always the ones on the edge of trendiness: VW/mini driving, coffee smoking, fashionistas. (I'd argue that this is a learned behavior)... Designers love seeing good design work, and will let people know about it, "Did you see the execution of that commercial!?!"...</p>
      <p>I hope this helps out, just off the top of my head. Cheers. - Aron</p>
