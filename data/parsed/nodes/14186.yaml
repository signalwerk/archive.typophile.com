      <p>Holy moley, this is a super great thread! There are so many valid points on here that could be discussed ad nauseum. I wish I could comment on a lot of these past posts:</p>
      <p>When I was going to design school in the early 80s, everyone had a stereotypical idea of what an artist was. In fact, I remember seeing some graffiti on the art building that read “You’re not an artist, you just dress like one”. And I think the all black dress code might harken back to that time. I don’t see many designers all in black anymore and I teach at an art college. We have a small percentage of goth dressers now and get everything from jeans and tshirts and long hair to dye jobs and hand-made clothing. Designers like to express themselves in different ways. One commonality I do find is the love for all things design - as someone mentioned previously.</p>
      <p>I can remember going shopping with a girlfriend of mine who is a furniture designer/builder. We were in a shop and I turned round to see a beautiful fabric on a shelf. “Look at that!” I mused and reached for the fabric. “Oh, I know,” cooed my friend, as she reached for the shelf and ran her hand along it “I think this is curly maple!”</p>
      <p>I think (but could be wrong since I am in the thick of it) that most design (be it graphic, industrial, type, etc.) used to be shrouded in a bit of mystery. That is, most people couldn’t wrap their heads around what design was and what differentiated one designer from the next. Years ago, when I told people that I was a typesetter and I sat in a room by myself along with a linotype machine that filled it, people just stared at me. “So you’re an artist?” they’d ask. “Um, Okay, sure”, came my reply. I think that with the advent of user-friendly software that most people can buy and understand, being an artist/designer has become more common - people understand what it is that we do. They see the results of it and can appreciate our roles. (I’m sure I am not speaking for type designers as I do remember the speech that Erik Spiekerman gave re: When people now ask me what I do for a living, I tell them I am a brain surgeon and they are happy with that answer and walk away). But maybe the first step here would be to differentiate between kinds of designers.</p>
      <p>As for me, I am a typography teacher, graphic/web designer and mother of 2. I do my best to stay current with the design industry and love reading and surfing the web. I love doing anything design related. I sew vintage style dresses and might have 2 or 3 pieces of black clothing somewhere in my closet. I have about 50 pairs of shoes, I kickbox regularly and I paint and exhibit when I can. My hair has varied from time to time. My husband is an industrial designer and audiophile who drives me crazy with his record collection and constant speaker building and amp testing. When he’s not renovating some part of the house and neglecting all of the details, he’s off mountain biking or bicycle racing. He’s involved with human factors to pay the bills. </p>
      <p>How stereotypical is all that? I haven’t a clue. But please, keep the posts coming - they are great to read!</p>
    html_clean: |-
