      <p>I totally agree with Joe. Forget the shallow stereotypes. There is really a big difference between graphic designers and typographers (mostly found on this site). </p>
      <p>I'm a Dutch graphic designer and typographer, so I can't really judge about the mentality in America. I would say here in Holland we have two kinds of designers; the ones that want to be in the foreground, and the ones that just love what they do and don't need to be in the foreground.<br>
      The ones that want to be in the foreground dress 'different', need their own little personality to be most shiny, feel that they are the middle point of any party and know everything better just because they are a designer. I don't know many of them personally, I just see them from the outside. So perhaps I'm also  wrong with my judgement. :-)<br>
      The other group is not that unnormal from most people. Perhaps clothing wise you would not directly identify them as a designer. But if you look carefully the magic is in the details. That pants are just a bit more special, those glasses just have a different shape and his/her voice is just a bit more loud. </p>
      <p>I don't feel offended at all by the earlier comments. I think your not that far off if you describe my first group of designers. Fortunately there are not that many of them out there. </p>
      <p>In general I would say:</p>
      <p><strong>Designer love:</strong> beautifull things, to be trendsetters, to be innovative, to talk to fellow-creatives about what they do, to make the world a better and more beautifull place and to get paid while doing that.</p>
      <p><strong>Designers hate:</strong> stereotypes (unless they can use it for their work), not being understood, financial arguments with the client, rainy days and advertising agencies. </p>
      <p>I hope this helps...</p>
