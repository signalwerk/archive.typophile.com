    <p>I am doing research for marketing materials the be used for a new non-profit graphic designers group based in northern america. We have a name and domain registered (which can not disclose at this stage as we still have trademarking and legal issues pending) The name has dual meaning, one which implies that designers and creatives are almost a species unto themselves.As I mentioned before, I want to design marketing materials and an advertising campaign around this theme, so I need to do a bit of research to discover what the most common perceptions are with regards to designers/creatives- aesthetics, dress code (or lack there of), body language, interaction, sleep patterns, attitude toward life, politics, clients, the law, etc...<br>
    I realize this can be an endless list, but it will of course be narrowed down to the stereotypes that are most commonly percieved by the public at large.<br>
    I would expect this research to get off in some crazy directions. I expect the final expressions will be full of humor. </p>
    <p>Designers Feel: Superior, Egotistic, Passionate, hate when less creative folks get paid more then themselves, etc...</p>
    <p>Designers Desire: Sexual partner to position themselves as letterforms during intercourse-like Eastern Indian's have The Karma Sutra, etc..</p>
    <p>Designers Wear: black turtlenecks, have cool glasses, have tattoos of letterforms instead of names of loved ones....</p>
    <p>Designer Think:</p>
