      <p>Being <strong>concerned</strong> about an oppressed minority is one thing (a very good thing), for example how I often bring up the plight of American Indians. But being <strong>offended</strong> is fake; essentially, it’s <strong>acting</strong> offended. And tripping over yourself to feel such offense... requires therapy. In some people it really seems like a Munchausen-type syndrome or something!</p>
      <p>I myself have always been a sucker for siding with underdogs. I remember when I first moved to the US as a kid, they put me in summer school; I knew nobody there; but when I saw a kid being teased and pelted with stuff, I went and stood by him, not even knowing if he wasn’t a nasty bastard; I remember being asked why the hell I was doing that; but I don’t exactly remember my reply - probably because my English was lousy. However, I was not <strong>offended</strong>; I was not eager to raise the Call of the Whine. I don’t know for sure if Jimmy has anything against gays or not; it doesn’t much matter; he could have something against <strong>Armenians</strong>, and I still would be able to look beyond that (as was once the case on Typo-L, about 6 years ago). Each and every one of us is a product of circumstance and the behavior of other people. When it comes to individuals, be more eager to tolerate than to complain, to focus on the content instead of the ripples. It is injustice and discrimination in the <strong>systems</strong> that we need to focus on.</p>
      <p>hhp</p>
