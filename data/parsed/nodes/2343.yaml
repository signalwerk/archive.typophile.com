  - id: 18822
    user: 1014
    date: 2003-12-10T09:36:00
    date_raw: 10 Dec 2003 — 9:36am
    votes: null
    html: "<p>Lance - I really enjoy a lot of House of Blues work that I've seen,  <br>in print mostly, but some of it Tshirt designs. <br> <br><a href=\"http://www.hob.com/\" target=\"_blank\">http://www.hob.com/</a> <br> <br>In this specific design, where there should be soul,  <br>I feel a rigidity in the colors and in the layout. <br> <br>The scroll, if you use it, could be freeflowing. <br>I have some examples I could send you. <br> <br>With a two-word name, I wouldn't break it up like <br>you have done. <br> <br>Have you sketched anything out. <br> <br>1 suggestion <br> <br>try sketching out Hobson's Choice, <br>hobson's choice and HOBSON'S CHOICE. <br> <br>...on a straight line and stacked in the <br>varying Case Treatments. <br> <br>This will give you a feel for the letters you have <br>at your disposal, the shapes the letters make <br>together, etc. Look for harmonious interplay. <br> <br>From that, figure out a general 'flavor' that you would  <br>like to convey. I would also pick your friend's <br>brain a little more and show him/her some <br>type samples. <br> <br> The current typeface choice seems more <br>classical than bluesy, in my humble opinion. <br> <br>For some reason, I see possibilities here: <br> <br><a href=\"http://onewayout.com/fonts/font.html\" target=\"_blank\">http://onewayout.com/fonts/font.html</a> <br> <br><a href=\"http://www.letterheadfonts.com/\" target=\"_blank\">http://www.letterheadfonts.com/</a> <br> <br>Also, Hobson's Choice, as you prob. know is <br>a misnomer ... perhaps you could play off that? <br> <br> <br>bj</p>"
    html_clean: "<p>Lance - I really enjoy a lot of House of Blues work that I've seen,  <br>in print mostly, but some of it Tshirt designs. <br> <br><a href=\"http://www.hob.com/\" target=\"_blank\">http://www.hob.com/</a> <br> <br>In this specific design, where there should be soul,  <br>I feel a rigidity in the colors and in the layout. <br> <br>The scroll, if you use it, could be freeflowing. <br>I have some examples I could send you. <br> <br>With a two-word name, I wouldn't break it up like <br>you have done. <br> <br>Have you sketched anything out. <br> <br>1 suggestion <br> <br>try sketching out Hobson's Choice, <br>hobson's choice and HOBSON'S CHOICE. <br> <br>...on a straight line and stacked in the <br>varying Case Treatments. <br> <br>This will give you a feel for the letters you have <br>at your disposal, the shapes the letters make <br>together, etc. Look for harmonious interplay. <br> <br>From that, figure out a general 'flavor' that you would  <br>like to convey. I would also pick your friend's <br>brain a little more and show him/her some <br>type samples. <br> <br> The current typeface choice seems more <br>classical than bluesy, in my humble opinion. <br> <br>For some reason, I see possibilities here: <br> <br><a href=\"http://onewayout.com/fonts/font.html\" target=\"_blank\">http://onewayout.com/fonts/font.html</a> <br> <br><a href=\"http://www.letterheadfonts.com/\" target=\"_blank\">http://www.letterheadfonts.com/</a> <br> <br>Also, Hobson's Choice, as you prob. know is <br>a misnomer ... perhaps you could play off that? <br> <br> <br>bj</p>"
