  html: <p>Hi guys, i'm working on this t-shirt design for a friend and i was wondering how you all think it's going.  and it's also gotta be on a website as a title... <br> <br>Hobson's Choice is a band with music "like U2 mixed with blues."  they're gonna be big i tell ya...  anyway, what do you all think?  i've seen some great suggestions on other forums so i'd love some great feedback for this too.  thank you, <br>-Lance <br>-----<img src="http://www.typophile.com/forums/messages/29/22040.gif" alt="hobsonschoiceonblue"></p>
