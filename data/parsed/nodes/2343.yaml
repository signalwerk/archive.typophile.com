    html: "<p>For people not familiar with the term, Hobson's choice refers to a hostler, someone who would rent out horses, named Hobson who allowed customers only to take whichever horse was closest to the front of the stable. (Similar is the slogan about early Ford cars - you could get them in any colour, so long as it was black.) <br> <br>The ragged one-way street sign looks like a good start. Perhaps the left end of the box could be left open, and the shaft of the arrow could turn into the neck of an electric guitar, an effect I've tried and utterly failed to get across here:  <br> <br><img src=\"http://www.typophile.com/forums/messages/29/24308.gif\" alt=\"What do you get when you cross an arrow and a guitar?\"></p>"
