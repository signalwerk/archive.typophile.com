    <p>hi all. looking for some "pairs". </p>
    <p>1st mrs eaves: looking for a sans to pair with mrs eaves. subhead and logo mrs eaves,<br>
    need a sans for the copy text.</p>
    <p>2nd copperplate (light and medium): looking for a sans to pair copperplate with.<br>
    a sans that somehow "reduces" that elegant copperplate feeling (subhead and logo are<br>
    set in copperplate, looking for a sans to set copy text and all other texts).</p>
    <p>thanks: lars</p>
