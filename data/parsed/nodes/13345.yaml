    html: <p>Lars, do you really need to use a sans for copy? Generally, in my opinion they are less readable. Goudy Old Style might be a good serif pairing for Copperplate, as Goudy also did it, and Goudy Old Style is fairly wide. Of course this would get an 'old fashioned' look, which may be good or bad, depending on the purpose of your piece.</p>
