    html: '<p>A great number of lettering artists in the Golden Age of same fully expected—and, in fact, encouraged (by way of how-to books—others to copy their work, so there are no ethical problems, especially since you state your intention to credit the original designer. Legal implications are another matter: if "DesignerName" is still living, or if his/her heirs administer an estate, or if another foundry has trademarked the name, then you may have problems (in the last instance, if a certain foundry has trademarked the name, you WILL have problems).</p>'
