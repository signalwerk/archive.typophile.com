      <p>I'll skip the legal and ethical parts. Wether or not you have the legal or ethical right to release, you are obviously a fan of the work, and should make it for yourself. Additionally, OpenType is a fascinating tool for communicating that that we've barely begun to dig into. </p>
      <p>As far as names, I wouldn't use a "BlahBlahHandLettered" + "rough" and "smooth". It isn't exactly hand lettered, once you redesign it as a smooth crisp face. Perhaps "Blah Blah" and "Blah Blah Hand", instead? Even better, perhaps instead of using the designer's name,"Blah Blah" could be a word association from an aspect of their life, philosophy or influence on you? That idea is again, totally separate from any legal reasons.</p>
