      <p>Legally, you're probably okay if you don't use the designers name to promote either font. Ethically, I'm with Tiffany, you need permission from the designer even if you don't use their name and regardless of how much you modify or regularize the scans.</p>
      <p>As an alternative produce the font and write a letter to the type designer using the font. Ask mundane questions about his/her inspiration from Latvian carved folk art inscriptions. If they reply without mentioning the font - you're in the clear!</p>
