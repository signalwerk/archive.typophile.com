      <p>If you do this project with the firm, final conviction that you will never try to release it for sale or distribution, I see it as a valuable way for you to learn a lot of useful things about type design. I think the different treatments/interpretations could be interesting. </p>
      <p>However, there are definitely ethical problems doing this for future sale. For one, if the type designer is alive, have you considered asking them if you could digitize their handwriting, for any purpose? If this person is a type designer, I would be very hesitant to even propose making type from their handwriting unless you had entered an agreement with them that you would allow them to approve or edit what you produce. How could you be sure they are not planning to do their own handwriting face?  Why choose the handwriting of a type designer and not a musician, parent, or other person who has no involvement in type design? This makes your situation more delicate. </p>
      <p>The best approach is to ask the type designer about it and see what they would agree to. I suspect the designer would want to be involved with any typeface made from his/her handwriting. Contact the designer. Do not expect to release such a design without their involvement.</p>
