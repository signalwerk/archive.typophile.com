      <p>I really don't know, but if it is someone who died 50 or more years ago, my hunch is that it would be OK legally and morally. For example, Christian Schwartz, Dennis Pasternak and George Ryan have all done typefaces based on the same piece of lettering by Oswald Cooper, who died in 1940. And the later two are even with the same foundry! As you will see, they are all different: </p>
