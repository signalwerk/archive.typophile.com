    <p>For years now I've been a fan of a certain type designer's hand lettering, of which I have a small gathering of samples. Recently I designed a broadsheet using letters drawn from scans of these samples by tracing each individual letter and placing each vector outline into position, one at a time, in Illustrator. However, after years of making small adjustments to fonts, I've finally decided to try my hand at developing one, and am planning to do so based on the above mentioned hand lettered samples.</p>
    <p>My plan is 2-fold:</p>
    <ol>
    <li>To scan and trace the hand-lettering samples in rough form (that is, "keeping" the rough edge of the calligraphic letterforms) and develop an OpenType version with various ligatures &amp; auto-replacements. Additional glyphs would have to be created from scratch for missing letters, analphabetics, numerals, etc.</li>
    <li>Use the same scans again, but this time draw each letterform from scratch to create a smooth version of each. Again, additional glyphs would need to be created for missing letters, analphabetics, numerals, etc.</li>
    </ol>
    <p>The two would be called something like "DesignerNameHandLettered - Rough" and "DesignerNameHandLettered - Smooth." These are only throw-away name suggestions, but they may come into play in my queries below.</p>
    <p>To begin with these would simply be an experiment for myself, to go through the process and see what I can put together. However, if they result in something useful, there might be the possibility of releasing them into the world.</p>
    <p>So, my questions:</p>
    <p>What are the ethical/legal implications of developing the "rough" version, which would be more or less directly traced from the samples I have, along with the additional glyphs I would make to fill in the gaps.</p>
    <p>What are the ethical/legal implications of developing the "smooth" version, which would be all original outlines, loosely based on the samples, along with the additional glyphs I would make to fill in the gaps.</p>
    <p>Assuming that such endeavours are ethically/legally doable, what sort of naming protocol might I employ? That is, my "Rough" and "Smooth" name variations are awful, so I'm looking for some general input on this front.</p>
    <p>I've refrained from mentioning the designer by name as I'd like to deal with the general implications of such a project first. (For example, including the designer's name in the font names may pose an issue, but I'll address that down the road...)</p>
    <p>Any and all advise would be appreciated...</p>
