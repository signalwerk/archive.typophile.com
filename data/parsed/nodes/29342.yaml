      <p>Thanks for the feedback so far, much of which is what I expected, yet hoped against. Given the tendency of designers &amp; foundries to issue multiple versions of classic faces (Garamond, Bembo, etc.), even utlizing the name of the original designer (and in such cases we're talking about designers who actually made the type [for print]), I had my fingers crossed for a unanymous green light. Of course, those faces are hundreds of years old and thus public domain, and, really, I'm not quite that foolish.</p>
      <p>To add a bit of information, the designer in question is no longer alive (died last centry). The letterforms are not "handwriting" but carefully crafted caligraphic letterforms, in the shape of Roman capitals (some of you out there are probably getting close to figuring out who and what I'm talking about). I've also just discovered that the designer's surname is trademarked by the foundry that handles the designer's fonts (OK, now I'm sure there are a few who known who I'm talking about.)</p>
      <p>There are a handful of fonts commercially available by this designer, but all of these were designed as type for print, as opposed to hand-drawn letterforms meant as calligraphy.</p>
      <p>So, for the moment I'd like to see where this thread goes, to see if others might have different perspectives, or, better yet, first-hand experience with such a project. Once things flesh out a bit more here it looks like my next task will be contacting the designer's estate and or trademark-owner, which will likely, I'm afraid, squash the idea completely.</p>
