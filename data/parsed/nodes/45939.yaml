    <p></p><div class="imageWrap"><img src="http://typophile.com/files/zandvoort-promo_6455.jpg"></div><p></p>
    <p>I've finished up a font and have decided to unleash it on the world for free.</p>
    <p>Zandvoort is a Font containing numbers (1-99) in circles. Both open (black numbers in a black outlined circle) and closed (white numbers in a black circle) versions are included.</p>
    <p>It should be pretty easy to find the number you need, as everything is laid out very systematically. Use the Shift and Option keys to access all the numbers.</p>
    <p>You can get it here:<br>
    <a href="http://www.archive.org/details/Zandvoort" title="http://www.archive.org/details/Zandvoort">http://www.archive.org/details/Zandvoort</a></p>
