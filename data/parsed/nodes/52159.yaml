  html: |-
    <p>Hello.<br>
    One of the exercise during my type[media MA we are working on the revivals of old typefaces.<br>
    I choose book with "funny" typeface, where the letters have "very strange countrespaces".<br>
    Now, thanks to typohile forum ( <a href="http://typophile.com/node/50478" title="http://typophile.com/node/50478">http://typophile.com/node/50478</a> ), I know it´s Benedictine, typeface designed by Joseph E. Hill, under direction of Edward E. Barlett for Mergenthaler Linotype.</p>
    <p>I am showing here my work in progress...</p>
    <p>Jano</p>
