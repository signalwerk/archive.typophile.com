    html: |-
      <p>wow … how can this be ??<br>
      I checked their site and it has nothing to do with SGI whatsover, but from I saw there (in image-text links) helped me ID the typeface as SGI ‘s custom designed font, by fellow Typophile Joe Stitzlein for Landor Associates.</p>
      <p>The “y” is not flipped, that’s how it appears in the typeface.</p>
      <p>I think someone should make them aware of this, SGI typeface is exclusively licensed to SGI. For reference, check out <a href="http://www.sgi.com">www.sgi.com</a>.</p>
