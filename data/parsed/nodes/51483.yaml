  html: |-
    <p>This demi roman text font was used from the teens through the thirties on the piano roll labels of Rythmodik and then Ampico in NYC and Rochester. It bears many similarities to more common fonts, but I have been casually searching without success since about 1960. Unfortunately, the lc examples are mostly in about 8pt and get blobby. </p><div class="imageWrap"><img src="/files/ampico300_4757.gif"></div><p></p>
