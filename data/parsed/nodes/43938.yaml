    <p>I am working on a mailer for a type project. We had to pick 3 plays and come up with a theme. Mine are Romeo and Juliet, Palm Beach, and Xanadu. My theme is facade. I'm having a hard time with Xanadu, so I thought I might get some feedback. Thank you for your time. I'm completely open so fire away.</p>
    <p>Thanks,</p>
    <p>Desi</p>
