    html: |-
      <p>I would suggest you look up the Pan-Pacific Auditorium. It's where parts of Xanadu were filmed. The deco update is something to reference thematically.</p>
      <p>And listen to the song Dancin:</p>
      <p><a href="http://www.youtube.com/watch?v=0eEOFvBdD2k" title="http://www.youtube.com/watch?v=0eEOFvBdD2k">http://www.youtube.com/watch?v=0eEOFvBdD2k</a></p>
      <p>The periods which are referenced musically are at the heart of the Xanadu idea. Big Band meets Rock Band. The grandiosity, and fun, and over the top(-ness) never dies.</p>
      <p>The film and sound quality is crap, but the song is great!</p>
      <p>Have fun!</p>
