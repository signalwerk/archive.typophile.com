      <p>That all depends on whether you consider the amount of work it took to get MyFonts to where they are today. Sell one font on your own at 100% royalty rate, versus, say, ten at 50% (conservative estimate of differing exposure levels!) and it becomes clear that MyFonts is the better option. If you're coming at it from a point of "I spent ages making this font and they just take their cut for doing not very much" then go out on your own. I prefer the "MyFonts get me way more exposure than I could dream of getting on my own and they only charge a small (relative to other distributors) cut for it" way of thinking. Each to their own though, I suppose.</p>
