    html: |-
      <blockquote><p>I think everyone would, and I always try to buy direct, I just use MyFonts to find what I need because it has such a large library and great interface.</p></blockquote>
      <p>Keep in mind that there are some of us who only sell through distributors. This is a business decision that each font maker must make, whether to take on the responsibility of dealing with customers and payments directly or not. I did this for a while, and I liked the direct contact with customers most of the time, but the extra percentage of income from the direct sale of a license was not worth being on-call 25/7 for support issues, which most often were from novice users with installation or download difficulties. I am a one-person operation. I'm happy to pay my distributors for taking this burden from me and leaving me to do what I do best (presumably).</p>
      <p>Sorry for going somewhat off-topic, but there seems to be an assumption that distributors are a bad deal for font makers, and that they should be avoided if possible. If MyFonts' "large library and great interface" makes it easy for you to find the fonts you want, don't be a jerk. If font makers don't want you to buy their fonts on MyFonts for some reason, they shouldn't be on MyFonts.</p>
    html_clean: |-
