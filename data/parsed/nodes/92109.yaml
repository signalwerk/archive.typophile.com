    html: <p>Well, as long as there are designers happy to give MyFonts half, MyFonts will take half. You never get more if you don't demand it. And no, as great as MyFonts.com is, it didn't take an effort anywhere near 50-50 parity to the development of over 100,000 fonts by 1000 foundries. The simplest way to earn more money -- a much more cost-effective use of time than developing another font for sale at MyFonts -- would be to organize with other foundries and demand a higher base rate for all designers or else MyFonts will find themselves lacking products to take half the profits of. But I have a Norma Rae streak in me.</p>
