    date: 2012-04-18T01:36:00
    votes: null
    html: |-
      <p>As I said before - most of the foundries in the top 50 will be on much better royalty rates than 50%. Most will be on 65% but some are as high as 80% I believe. I think 50% is a fair amount for new foundries - the exposure is greater than it was when these foundries joined up at better rates.<br>
      Nothing's set in stone though. Show your fonts to MyFonts and make them an offer royalty-wise. Worse they can do is say no.</p>
  - id: 506096
    user_id: 15738
    user_name: pdxuser
    user_path: null
    date_raw: 18 Apr 2012 — 2:05am
    date: 2012-04-18T02:05:00
    votes: null
    html: |-
      <p>I agree that if you're a less experienced, lesser-selling type designer, you should get less. But that's because you're selling less, not because the industry's biggest competitors are taking advantage of your weaker position and helping themselves to a larger chunk of your already tight income. 80% is fair, but 50% isn't. And if one designer is getting a better rate than others, I can see why they wouldn't have complaints.</p>
      <p>But for the record, I'm not a type designer. I just think Monotype is using its market dominance and ownership of the channels of commerce to take advantage of its smaller rivals.</p>
