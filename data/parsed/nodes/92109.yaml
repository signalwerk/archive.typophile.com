      <p>That’s the <a href="http://vllg.com/faq#panel=31-32-33" rel="nofollow">Village</a> approach, no? But then, many of their member foundries are on MyFonts and other distributor websites, too.</p>
  - id: 506085
    user_id: 15738
    user_name: pdxuser
    user_path: null
    date_raw: 18 Apr 2012 — 2:07am
    date: 2012-04-18T02:07:00
    votes: null
    html: |-
      <p>Type designers constitute a very limited pool of talent, and their expert work is very time-consuming. They are therefore difficult to quickly replace, so a strike could be highly effective. Losing distinctive, well-known bestsellers like Museo and Storefront Pro would be especially problematic. People looking for those fonts will just Google them and start buying elsewhere.</p>
      <p>Of MyFonts' 50 bestselling fonts, 11 come from itself (Monotype, aka Berthold, Bitstream and Linotype -- and several others that aren't in the top 50), while of the rest, the majority share comes from just 7 sources: Jos Buivenga (exljbris), Hannes von Döhren (HVD), Hubert Jocham, Emily Lime, Ryan Martinson (Yellow Design Studio), Parachute and URW++. I'd imagine Mark Simonson, owner of #1 bestseller Proxima Nova; and Font Bureau, with two entries on the top 50 and a large library; could also wield some influence.</p>
      <p>There's also grounds for a DOJ antitrust suit against Monotype, as they are the Walmart (MyFonts), Target (fonts.com), Proctor and Gamble (Monotype), Johnson &amp; Johnson (Linotype) and Unilever (ITC) of their industry, setting the terms by which every smaller manufacturer must sell their wares if they want to be in the world's largest stores.</p>
  - id: 506089
    user_id: 44424
    user_name: tourdeforce
    user_path: null
    date_raw: 18 Apr 2012 — 1:13am
    date: 2012-04-18T01:13:00
    votes: null
    html: |-
      <p>Thing is that popular fonts like Museo or Proxima Nova would probably never become so popular if there was no MyFonts.</p>
      <p>Why don't you make an test. Create one font family and start selling it on your own. Let's say for first 6 months. And then sign in on MyFonts and report us results from both sources.</p>
      <p>(and it's a question of font attractiveness also, that moves you up on the list)</p>
