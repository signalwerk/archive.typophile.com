      <p>Mark, what do you think about charging for tech-support?</p>
      <p>&gt; there seems to be an assumption that distributors are a bad deal for font makers</p>
      <p>In some cases it's a bad deal, but it's crazy to think it's generally a bad deal, simply because there are many successful type designers who use -and keep using- distributors! Not that I consider myself "successful", but I've been quite happy with Linotype since 1998 and delighted with FontFont since December.</p>
      <p>hhp</p>
