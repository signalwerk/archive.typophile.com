    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Blackletter" class="freelinking" rel="nofollow">Blackletter</a> : Textura</strong></p>
    <p>A style of <a href="/wiki/Blackletter" class="freelinking" rel="nofollow">Blackletter</a>. Also called <a href="/wiki/Gothic" class="freelinking" rel="nofollow">Gothic</a> or <a href="/wiki/Gotisch" class="freelinking" rel="nofollow">Gotisch</a>.</p>
    <p>By the 1100s, scriptoriums in and around Paris had so altered <a href="/wiki/Carolingian%20Minuscule" class="freelinking" rel="nofollow">Carolingian Minuscule</a> that the lettering styles of the day no longer bore any resemblance to those of c.800. This geographic area—Paris and its environs—held the avant garde of the mid-1100s onwards. The 1140s, for instance, saw the creation of the Gothic style of architecture in St. Denis, a Parisian suburb.</p>
    <p>The name textura refers to the fabric-like quality of a page set in the script; "textura" literally means "an even effect in weaving." Textura is often said to bear a stylistic similarity to this new style of art and architecture. Together with Gothic art and architecture, Textura spread across Europe, taking hold everywhere except Italy, which did not show much appreciation for the Gothic. Two types of textura flourished simultaneously: <a href="/wiki/Textura%20Quadrata" class="freelinking" rel="nofollow">Textura Quadrata</a>, which features diamond-shaped heads and feet; and <a href="/wiki/Textura%20Prescisus" class="freelinking" rel="nofollow">Textura Prescisus</a>, which is characterized by the absence of feet and an even baseline.</p>
    <p>By 1400, virtually all books in Europe were written out in Textura hands. When <a href="/wiki/Johann%20Gutenberg" class="freelinking" rel="nofollow">Johann Gutenberg</a> developed <a href="/wiki/movable%20type" class="freelinking" rel="nofollow">movable type</a>, he based his forms on Textura letters.</p>
    <p>As printing spread outward from Mainz, the Textura style was quickly abandoned for <a href="/wiki/Schwabacher" class="freelinking" rel="nofollow">Schwabacher</a> and <a href="/wiki/Antiqua" class="freelinking" rel="nofollow">Antiqua</a>.</p>
    <p><a href="/wiki/Wynken%20de%20Worde" class="freelinking" rel="nofollow">Wynken de Worde</a> brought a Textura font of type to England in 1480. <a href="/wiki/Old%20English" class="freelinking" rel="nofollow">Old English</a> types of the 19th Century are sometimes based on typefaces that developed out of his contribution.</p>
