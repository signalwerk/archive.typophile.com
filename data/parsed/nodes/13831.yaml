    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12128" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Blackletter</a>&nbsp;:&nbsp;Textura</strong></p>
    <p>A style of <a href="/node/12128" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Blackletter</a>. Also called <a href="/node/add/wiki?edit%5Btitle%5D=Gothic" title="Create node &quot;Gothic&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Gothic</a> or <a href="/node/add/wiki?edit%5Btitle%5D=Gotisch" title="Create node &quot;Gotisch&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Gotisch</a>.</p>
    <p>By the 1100s, scriptoriums in and around Paris had so altered <a href="/node/13704" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Carolingian Minuscule</a> that the lettering styles of the day no longer bore any resemblance to those of c.800. This geographic area—Paris and its environs—held the avant garde of the mid-1100s onwards. The 1140s, for instance, saw the creation of the Gothic style of architecture in St. Denis, a Parisian&nbsp;suburb.</p>
    <p>The name textura refers to the fabric-like quality of a page set in the script; “textura” literally means “an even effect in weaving.” Textura is often said to bear a stylistic similarity to this new style of art and architecture. Together with Gothic art and architecture, Textura spread across Europe, taking hold everywhere except Italy, which did not show much appreciation for the Gothic. Two types of textura flourished simultaneously: <a href="/node/add/wiki?edit%5Btitle%5D=Textura%20Quadrata" title="Create node &quot;Textura Quadrata&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Textura Quadrata</a>, which features diamond-shaped heads and feet; and <a href="/node/add/wiki?edit%5Btitle%5D=Textura%20Prescisus" title="Create node &quot;Textura Prescisus&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Textura Prescisus</a>, which is characterized by the absence of feet and an even&nbsp;baseline.</p>
    <p>By 1400, virtually all books in Europe were written out in Textura hands. When <a href="/node/13707" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Johann Gutenberg</a> developed <a href="/node/13771" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">movable type</a>, he based his forms on Textura&nbsp;letters.</p>
    <p>As printing spread outward from Mainz, the Textura style was quickly abandoned for <a href="/node/14506" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Schwabacher</a> and <a href="/node/13832" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Antiqua</a>.</p>
    <p><a href="/node/add/wiki?edit%5Btitle%5D=Wynken%20de%20Worde" title="Create node &quot;Wynken de Worde&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Wynken de Worde</a> brought a Textura font of type to England in 1480. <a href="/node/add/wiki?edit%5Btitle%5D=Old%20English" title="Create node &quot;Old English&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Old English</a> types of the 19th Century are sometimes based on typefaces that developed out of his&nbsp;contribution.</p>
