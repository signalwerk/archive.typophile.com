      <p>apankrat: <em>I am concerned with the case when someone finds a font that looks nice in his own browser, assumes that it looks as nice for everyone else and then proceeds to build a production website with it.</em></p>
      <p>But isn't browser/platform testing a basic best practice in web design anyway?</p>
      <p>That said, I'm all for ample warnings, Alex, and I'm sure Typekit will do their best to show render variation. Their impressive <a href="http://blog.typekit.com/2010/01/26/screenshots-of-all-our-fonts-in-every-browser-on-every-platform/" rel="nofollow">screenshot effort</a> is evidence of that.</p>
      <p>John Hudson: <em>To me, the rush to the web fonts market looks pretty much identical to the rush to the desktop publishing market, so I'm expecting a lot of bad typography and difficult to read text, and the better part of twenty years to clean up the mess.</em></p>
      <p>I too feared this <a href="http://typographica.org/2007/on-typography/embedded-web-fonts-return-uh-oh/" rel="nofollow">a few years ago</a> when @font-face was available but good webfonts were not. I'm happy to say my fears were not realized. Not then, and not yet. We're not out of the woods — webfonts haven't hit the mainstream — but I have increasing confidence in the ability of web designers responsible for major sites to make the right choices, typographic or otherwise. The web is a much more mature medium than DTP was in those early days of digital.</p>
