    html: |-
      <p>&gt;Where the responsibility for hinting (or better put correct appearance of typefaces) should reside? </p>
      <p>For the web, if you mean there, the responsibility for the design and hinting of the face has been put on the font, by the operating systems. One OS says no hinting, or all hinting. The other OS says some hinting or all hinting, though I suppose there are times when no hinting on Windows would work too. </p>
      <p>From there the question becomes point/pixel size of use, with designers, developers and distributors each perhaps having parts of the responsibility. The Browsers don't do anything complimentary to the problem, being trained to deal with so few fonts, dealing with all the fonts is going to be problematic for browsers for some measurable time. </p>
      <p>Then, when browsers "get" how to use the OS scaling and rendering, or make their own, it's the author's turn to be confounded. If the latter happens widely, it'll be the W3C's responsibility, I think. Early Signs are, even with the brilliance and energy of Typekit, "Yes", many web authors are confounded.</p>
      <p>&gt;The web font market is simply daunting.</p>
      <p>Do you mean to the type designer?</p>
      <p>Cheers!</p>
