    html: |-
      <p>Hi everybody,</p>
      <p>I'm Type Manager for Typekit. This is a great conversation!</p>
      <p>With regard to rendering quality, Stephen is correct —&nbsp;the performance of typefaces served by Typekit generally reflects the web-readiness of the font files we receive. We're working on some administrative tools right now that will help us spot rendering inconsistencies and aid discussion with foundry partners as we consider including new type (or revised type) in our library.</p>
      <p>On the technical side of things: unless we receive TrueType files, we make them. In our experience, CFF fonts don't render as well as the same fonts converted to TTF. And neither Internet Explorer 6 nor 7 will load EOT files made with TTFs. If we do receive TrueType files from our foundry partners, we use those —&nbsp;and they usually look best, manual hinting or not.</p>
      <p>John, I agree, IE9 looks wonderfully impressive.</p>
      <p>Sii, John, Alex, as for rushing to market and coping with subpar Windows experiences at the present time, you make fair points. Windows rendering isn't great for some web fonts right now (though for others, under the right conditions, it is great). But people choose Typekit for lots of reasons.</p>
      <p>Typekit has brought the creative freedom of type choice to a large, eager audience and has catalyzed (or at least encouraged) browser makers, type sellers, type designers, web designers, and businesspeople to take web typography seriously. These benefits alone are worth the sacrifices of getting involved early.</p>
      <p>Stephen's suggestion about rendering "Arial for Windows users and Ratio for the rest" is prescient. My colleagues at Typekit HQ have a long list of features in the development queue, one of which is the ability to toggle kits off in certain environments. You can see early stages of this technology present in our <a href="http://blog.typekit.com/2010/04/09/typekit-now-supports-fonts-for-the-ipad/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">experimental iPad support</a>.</p>
      <p>Still, features and business aside, the aspect of Typekit's early presence in this market that I most respect and value is the success with which it continues to define the relationship of type within existing, standard web design practices.</p>
      <p>Typekit provides a mental model that did not exist previously — for dealing with font files, styles and weights, character subsetting, and more, as well as the relationship between these new-to-web things and things that web designers already understand, like file size, CSS font properties, and markup.</p>
      <p>Linking a font to a website can be simple, like adding a CSS background image. But when you want to use different styles of a typeface, use several typefaces, or attempt to keep current with browser support, things can get awfully hairy. Some people would rather these things be dead simple. So they use Typekit.</p>
      <p>The excitement and freedom of this mental model, (not to mention of course, the idea of many visitors seeing beautifully drawn type) is what folks weigh against caring that their Windows visitors' text might seem as decrepit as nearly every other aspect of Windows users' personal computing experience.</p>
      <p>Even then, as Stephen said, not all fonts render poorly. Only some. Typekit presents this information to users via a <a href="http://blog.typekit.com/2010/01/26/screenshots-of-all-our-fonts-in-every-browser-on-every-platform/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Browser Samples</a> tab so they know what to expect. And in cases where type designers improve the Windows rendering of their fonts, we upgrade our library. That means any website using Typekit to serve these fonts will see an immediate and automatic improvement in rendering.</p>
      <p>There's a lot to be excited about.</p>
      <p>Jarrod, your blog looks great. I just added a screenshot to <a href="http://www.flickr.com/groups/typekit/pool/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Typekit's Flickr pool</a>.</p>
