      <p>Rich: <em>You took issue with my statement that everyone is now a typographer but in a publishing environment where everyone can and, as a practical matter, has to be their own typographer how else would you like me to phrase it?</em></p>
      <p>In coherent sentences? :)</p>
      <p>But let me take issue once more: no one is forcing, as a practical matter, any self-publisher to be his own typographer. In very large part, the details of microtypography are taken out of his hands by the font itself, which is why it is crucial to have a well-made font, one that sets well and reads well. Similarly, macrotypography can -- and in many cases should be -- taken out of his hands by pre-made templates and style sheets designed by people who know what they're doing. And in the great majority of cases what the self-publisher should be doing is using Georgia or Verdana for text, because that's the best guarantee of readability, which is the prerequisite of text. If this self-publisher <em>takes it on himself</em> to use a different font, for the sake of novelty, he isn't being forced to be his own typographer: he's just doing something that, in all likelihood, he isn't qualified to do.<br>
      ___</p>
      <p>Rich, in all seriousness now, let me explain how I see the current situation of web text re. fonts.</p>
      <p>You wrote: <em>…the choice of fonts has gone from around eight (families) to tens of thousands.</em></p>
      <p>I think the situation is more dramatic than that. Restricting our discussion to Latin writing system fonts, the choice has gone from exactly two font families that were designed and made for continuous reading on screen to some many thousand that were not.</p>
      <p>Fonts fall into three categories when looked at with regard to web typography:</p>
      <p>1. Fonts that were designed and made specifically to be read on screen, without regard to print conditions. There are a number of these, if one includes embedded OEM device fonts such as those David Berlow made for the Palm Pre, but in terms of the web there are essentially two, Georgia and Verdana, that can be reliably spec'd in CSS.</p>
      <p>2. Fonts that were not designed specifically for screen reading, but which have been made in such a way as to have good screen legibility. Times New Roman and Arial are classic examples: print typefaces hinted for screen legibility. [That a font such as Times New Roman may become less, not more, readable when antialiased and spaced on a subpixel grid is a good indicator of the crucial role of proportion and spacing in the distinction between print and screen typography.] The Microsoft ClearType fonts also fall into this category, due to their being designed for use as document fonts in print at the same time as looking good within a particular screen rendering model. And the first offerings of text ‘web fonts’ from FontShop and other foundries also seem to fall within this category: typefaces designed for print being repurposed for the web with some hinting.</p>
      <p>3. Fonts that were not designed for screen reading and which have not been made in such a way as to have good screen readability. This accounts for a very large percentage of Rich's ‘tens of thousands’ of fonts, and in Windows GDI environments includes <em>all</em> CFF fonts.</p>
      <p>The good news about web typography is that I think Stewf is right that as a design medium the web is more mature than desktop publishing was in the years of typographic desolation, and there are a lot of sophisticated web designers capable of doing good work when given appropriate resources. But that doesn't change the fact that there are nothing like enough fonts in category 1 to maintain <em>current standards</em> of web readability if everyone suddenly wants to embrace diversity and novelty as typographic goals.</p>
    html_clean: |-
      <p>Rich: <em>You took issue with my statement that everyone is now a typographer but in a publishing environment where everyone can and, as a practical matter, has to be their own typographer how else would you like me to phrase it?</em></p>
      <p>In coherent sentences? :)</p>
      <p>But let me take issue once more: no one is forcing, as a practical matter, any self-publisher to be his own typographer. In very large part, the details of microtypography are taken out of his hands by the font itself, which is why it is crucial to have a well-made font, one that sets well and reads well. Similarly, macrotypography can -- and in many cases should be -- taken out of his hands by pre-made templates and style sheets designed by people who know what they're doing. And in the great majority of cases what the self-publisher should be doing is using Georgia or Verdana for text, because that's the best guarantee of readability, which is the prerequisite of text. If this self-publisher <em>takes it on himself</em> to use a different font, for the sake of novelty, he isn't being forced to be his own typographer: he's just doing something that, in all likelihood, he isn't qualified to do.<br>
      ___</p>
      <p>Rich, in all seriousness now, let me explain how I see the current situation of web text re. fonts.</p>
      <p>You wrote: <em>…the choice of fonts has gone from around eight (families) to tens of thousands.</em></p>
      <p>I think the situation is more dramatic than that. Restricting our discussion to Latin writing system fonts, the choice has gone from exactly two font families that were designed and made for continuous reading on screen to some many thousand that were not.</p>
      <p>Fonts fall into three categories when looked at with regard to web typography:</p>
      <p>1. Fonts that were designed and made specifically to be read on screen, without regard to print conditions. There are a number of these, if one includes embedded OEM device fonts such as those David Berlow made for the Palm Pre, but in terms of the web there are essentially two, Georgia and Verdana, that can be reliably spec'd in CSS.</p>
      <p>2. Fonts that were not designed specifically for screen reading, but which have been made in such a way as to have good screen legibility. Times New Roman and Arial are classic examples: print typefaces hinted for screen legibility. [That a font such as Times New Roman may become less, not more, readable when antialiased and spaced on a subpixel grid is a good indicator of the crucial role of proportion and spacing in the distinction between print and screen typography.] The Microsoft ClearType fonts also fall into this category, due to their being designed for use as document fonts in print at the same time as looking good within a particular screen rendering model. And the first offerings of text ‘web fonts’ from FontShop and other foundries also seem to fall within this category: typefaces designed for print being repurposed for the web with some hinting.</p>
      <p>3. Fonts that were not designed for screen reading and which have not been made in such a way as to have good screen readability. This accounts for a very large percentage of Rich's ‘tens of thousands’ of fonts, and in Windows GDI environments includes <em>all</em> CFF fonts.</p>
      <p>The good news about web typography is that I think Stewf is right that as a design medium the web is more mature than desktop publishing was in the years of typographic desolation, and there are a lot of sophisticated web designers capable of doing good work when given appropriate resources. But that doesn't change the fact that there are nothing like enough fonts in category 1 to maintain <em>current standards</em> of web readability if everyone suddenly wants to embrace diversity and novelty as typographic goals.</p>
