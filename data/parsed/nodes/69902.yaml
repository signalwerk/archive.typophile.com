    html: |-
      <p>Tim: <em>As far as I am aware, there is no such thing as TT Autohinting in FontLab.</em></p>
      <p>There is, and if you set it up carefully you can get quite good results if you can count on subpixel rendering in the x-direction. FontLab TT autohinting is essentially a conversion of PS hinting data, treating PS blue zones and y-direction alignment CVT zones and PS standard stem hints as CVT distances. If the blue zones and standard stems have been appropriately set, the conversion of PS stem hints to TT instructions is quite good. Within a user-set tolerance, stem hints will be snapped to standard CVT distances. Links are anchored top or bottom relative to  The TT autohinter also tries to apply interpolation. There are TT autohint options that provide additional control over the process, and the results are editable.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ttautofl_6588.png"></div><p></p>
      <p>I've had clients who could not afford manual hinting, but were satisfied with what I call semi-automatic hinting, in which I set the vertical alignment zones manually and fill in and edit standard stems in the TT hinting dialogue, and then run the FL autohinter. Then I usually so some small amount of editing, e.g. popping up the xheight at some size or changing the ppem size at which a stem jumps in thickness. In some cases, where the target environment is subpixel, I find the autohinting results best if no x-direction instructions are used.</p>
      <p>Is this kind of approach capable of making a top quality screen readability font? No. But in terms of converting existing PS designs to get decent screen display, then it is quite good.</p>
