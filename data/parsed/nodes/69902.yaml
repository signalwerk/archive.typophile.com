    html: |-
      <p>@begsini</p>
      <p>If you use Typekit, you sign a EULA and agree to an arrangement that prevents you from improving the font. Or making it worse, if that's your druthers.<br>
      Plus, you don't get the font to install either in the OS, or on a pre-production server.</p>
      <p>How a designer can take responsibility for the typography of a site under those conditions beats me. But if you enjoy swimming with a straightjacket on, good luck. Stick with it.<br>
      In its effort to prevent "casual download" by visitors to your site, the "service" has no choice but to prevent you from creative tinkering.<br>
      The primary responsibility of the service, first and foremost, is to serve fonts under conditions acceptable to those who contribute them. Your needs are secondary. (And it's a take it or leave it proposition, from all I've seen and heard and experienced.)<br>
      That is simply the nature of it.</p>
      <p>If you want the freedom to "optimize", why don't you seek other options?</p>
