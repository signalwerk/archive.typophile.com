      <p>&gt;<em>We're working on some administrative tools right now that will help us spot rendering inconsistencies...</em></p>
      <p>This sounds like an essential feature to have. </p>
      <p>More and more often I see sites whose typography looks like a butt, and sure enough every time it happens to be designed by someone with a Mac and @font-face directive. They are just ignorant about rendering issues and don't realize their site looks awful to a half of their visitors. Visitors that they end up loosing for a reason that stays a mystery to them.</p>
      <p>Do not get me wrong though - I think Typekit is a great and timely idea which is executed well. I just wish you would be more open about major usability issues that it has at the moment. These issues are not your fault, and they can be fixed by working with foundries, but they must be clearly and visibly disclosed for your users to be consciously aware of them.</p>
      <p>The process of detecting inconsistent rendering is easy to automate, and detected fonts should be clearly marked in your font library for all users to see. And even if you don't have this detection automated, it still takes only few seconds to manually check how all font styles look in all browsers, so the tagging for rendering inconsistencies should be a part of your approval process for a specific font.</p>
