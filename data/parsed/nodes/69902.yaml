    html: |-
      <p>Tim: <em>Like I said above, there is no such thing as TT autohinting in FL, even though the options dialogue misleadingly calls it so. Autoconversion would be a more appropriate term.</em></p>
      <p>FontLab TT autohinting also does things like interpolating cusp positions, generating triple hints, and even attempts some deltas, all of which are TT specific and not directly converted from PS hints. The autohinting process is a combination of conversion of aspects of a shared paradigm (vertical alignment zones, standard stem values) and automation of some TT-specific features.</p>
      <p><em>I think you are wrong there. It does not refer to the PS standard stems directly, you have to import them as TT stems and TT alignment zones first.</em></p>
      <p>This applies if you wish to do any editing of the TT hints and are converting PS hints to instructions within a VFB. If you have not put any values in the TT stems and alignment dialogue, the autohinter will use the values in the PS standard stems and blue zones by default during TTF generation. If you have not provided such information, then FontLab will try to automate that too. Basically, what FontLab does during hint automation is to use as much information as you provide and automate whatever is missing, so you can intervene within the automation at almost any step, for the whole font or for individual glyphs.</p>
    html_clean: |-
