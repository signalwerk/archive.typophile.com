      <p>Richard: <em>The primary responsibility of the service, first and foremost, is to serve fonts under conditions acceptable to those who contribute them. Your needs are secondary.</em></p>
      <p>The way I look at it, Typekit and similar services are trying to create a market by making a product available in a way that is acceptable to the makers of that product. When a market is established, then it functions as a market, which means that consumers can make choices based on quality, options, etc.</p>
      <p>There are fonts being made available through Typekit and other services that I wouldn't consider to be of high enough technical quality for web use, and I am quite sure that foundries licensing WOFF fonts will also be offering fonts that I don't think are fit to purpose. That's what happens when people rush to market.</p>
