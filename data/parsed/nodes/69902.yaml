    html: |-
      <p>@tim ahrens<br><em>I have read many of your posts and I do not understand what your perspective is</em><br>
      Flattering. Truly, with no disprespect meant, that means I'm probably on the right track. </p>
      <p>@tim brown<br>
      Hi. Hope all is going well.</p>
      <p>@apankrat<br>
      I like your approach. Not sure where it can take us, but real interesting. </p>
      <p>@johnhudson<br><em>There are fonts being made available through Typekit and other services that I wouldn't consider to be of high enough technical quality for web use, and I am quite sure that foundries licensing WOFF fonts will also be offering fonts that I don't think are fit to purpose. That's what happens when people rush to market.</em><br>
      To my eyes, I see a lot of crap, too. But...<br>
      1) As long as the presentation includes in-browser specimens, everything is up-front and if somebody chooses a font that, to me, stinks, that's their choice. It's when someone's being asked to choose a screen font from some enhanced Flash representation or generated image that's unacceptable.<br>
      2) As for rushing to market: except in rather unusual cases where getting it right the first time is crucial to success, all of the advantages lie with those who get into the market as early and as visibly as possible. These new services that are springing up like daisies now are also-rans. As soon as I met them in Atlanta, I immediately knew that the guys from Typekit "got it" as far as the marketing piece.<br>
      Rushing to market is almost always the name of the game.</p>
      <p>BTW - there's some very interesting work being done with file conversion and autohinting. To the point where, it seems to me, there won't be much of a problem soon.<br>
      At least by most web author's standards. Even for body text.</p>
      <p>rich</p>
