    <p>I know there's been some discussion about Typekit here (as well as competing solutions, of course). I decided to try it out on a new blog I'm starting:</p>
    <p><a class="freelinking external" href="http://www.supernrmal.com" rel="nofollow">Super Nrmal</a></p>
    <p>Using a sharp looking typeface called Ratio by <a class="freelinking external" href="http://cargocollective.com/pstype" rel="nofollow">pstype</a>.</p>
    <p>P.S. Not optimized yet for Internet Explorer.</p>
