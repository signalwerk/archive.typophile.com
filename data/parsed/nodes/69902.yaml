      <p>Rich: <em>…all of the advantages lie with those who get into the market as early and as visibly as possible…</em></p>
      <p>Some of us want the advantage to lie with the reader.</p>
      <p>To me, the rush to the web fonts market looks pretty much identical to the rush to the desktop publishing market, so I'm expecting a lot of bad typography and difficult to read text, and the better part of twenty years to clean up the mess. It isn't good enough to say that ‘if somebody chooses a font that … stinks, that's their choice’, because typography serves first reader, then the text, and only then the author/publisher.</p>
