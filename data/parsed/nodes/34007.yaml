      <p>Thanks all for the replies.</p>
      <p>The thing is that this tiny type is going to be optimized as image —yes, I know the best would be to do it as HTML.</p>
      <p>I noticed that Univers in very small sizes 9 pt roman using sharp is very readable but I find the typeface very cold. (eventough at that size might not matter)<br>
      I would like to find another one...that maybe goes well with Bembo or Bodoni.</p>
      <p>Hrant: I would prefer b&amp;w.</p>
      <p>Thanks for sharing your thoughts</p>
