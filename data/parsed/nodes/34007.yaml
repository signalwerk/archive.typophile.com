    html: |-
      <p>As you seem to suspect, you're not going to get a lot of "warmth"<br>
      at 9 pt (which if you're on a Mac is 9 PPEM) especially in b&amp;w.<br>
      And there's nowhere near enough resolution to try to match this<br>
      or that outline font...</p>
      <p>If you're sure you don't want anti-aliasing* then there's a website<br>
      that lets you fool with all kinds of settings and shows you comparisons<br>
      of bitmap font renderings... except I don't remember what the site was.<br>
      Help guys!</p>
      <p>* Which BTW does not need to mean blurry:<br>
      <a href="http://www.themicrofoundry.com/manademo/" title="http://www.themicrofoundry.com/manademo/">http://www.themicrofoundry.com/manademo/</a></p>
      <p>hhp</p>
