    <p>I'm doing a custom version of Gizmo for a client. Now they want it in Chinese!</p>
    <p>Obviously I can't do that, so does anybody out there know any Chinese fonts which have the blobby/brushy characteristics of this font?</p>
    <p>Any help would be much appreciated.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/CustomGizmo_4789.jpg"></div><p></p>
