      <p>Also go to <a href="http://www.arphic.com.tw/usa/fontGallery/fontLists/big5-10.htm" title="http://www.arphic.com.tw/usa/fontGallery/fontLists/big5-10.htm">http://www.arphic.com.tw/usa/fontGallery/fontLists/big5-10.htm</a><br>
      select traditional or simplified, and then look under "POP" or "cool" (or others)</p>
      <p>or</p>
      <p><a href="http://eng.dynacw.com.hk/DesktopDefault.aspx?TabId=4696" title="http://eng.dynacw.com.hk/DesktopDefault.aspx?TabId=4696">http://eng.dynacw.com.hk/DesktopDefault.aspx?TabId=4696</a></p>
      <p>then "OpenType fonts" (on the left), then "windows/mac" then "font samples," then "pop" and "freestyle"</p>
      <p>To purchase you may need to google for local agents.</p>
