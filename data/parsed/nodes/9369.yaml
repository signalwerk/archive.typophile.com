    html: <p>Hugh, <br> <br>Well compared to where they were before,these are all a huge improvement. <br> <br>From my standpoint I think 2 and 3 are the contenders. 2 is good, not because of the swoop (which isn't stringy enough for me) but because it seems to match best the range of services these guys offer. <br> <br>I like 3, especially if the kite was larger and somehow indicated the string part...I like orange and blue. It would be nice to see something in the technical arena with some serifed type. <br> <br>If pressed I would choose 3 because it is just beyond the conventional in that sector. If 2 was chosen I would be less excited though confident that the mark would work well. <br> <br>1 isn't asertive enough. It seems too whimsical, and 4 far too sedate and doesn't feel like the kite is flying. It really just looks like a word with a diamond. <br> <br>Good luck! Let us know how it goes. <br> <br>Jon</p>
