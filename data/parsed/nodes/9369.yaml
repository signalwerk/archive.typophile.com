    <p>Attached are logo comps that I will be showing this week. Mainly want feedback - I have a clear favorite, but I want to see what others get out of it. All four are very similar because there is a pretty clear brand image and visual style we will be utilizing based on all of our work up until this point. What sort of feel/energy does each give, what kind of company (personality/values) does it relate? <br> <br>The old company was called On-line Services, their old logo featured a globe with a satellite. Their old tagline was "Meeting the needs of today and tomorrow". They have nothing to do with the internet or telecommunications (beats me). Their services are varied and many but the main offerings are Staffing, Engineering Support, and Document Scanning/Records Management. (Yes I know - try to wrap your arms around all that and more). However - the owner is very entreprenural and every year seems to add new services. Generally he is quick to market and somehow grabs niche clients that have made his business very successful. But they need a change. Their current identity says nothing about who they are or what they do - in fact it says all the wrong things. <br> <br>The company is in a high growth mode right now expanding into seemingly unrelated venues and this new logo will not only be unveiling a new image, but a new name as well. The idea was that with such a broad service offering the company name had to be broad and non-descriptive. Yet it needed to encompass the feeling and personality of the company and be memorable. It was decided a metaphor name with a descriptor (at least at first) would be the best way to go - also helping it to stand away from the pack of ScanTecs and other similarly named companies. They wanted something that had its own wings. The name kitestring was born out of a sense of support (one unifying theme), friendliness, and ease of use (yeah flying a kite isn't always easy, but once its going it seems that way, you know - its a "breeze")  <br> <br>As we roll out the logo there will probably be subheads for each division which will disappear further down the road as the brand becomes more established in our market. (Ie. kitestring Techhnical Staffing, or kitestring Medical Records Management) I will most likely indicate this in a smaller maybe italic type beneath, somewhat separatd. <br> <br>The tagline we are using for them is "Support for companies that soar" Still somewhat generic, enough to encompass what they do - yet it gives a feeling and it positions them as being business to business. <br> <br>The new look will be very clean - with tons of whitespace - the idea is to elevate the brand from its current identity. <br> <br>To see the old and ugly click on <a href="http://www.On-LineServices.com" target="_blank">www.On-LineServices.com</a> <br> <br>here is the new and hopefully less-ugly <br><img src="http://www.typophile.com/forums/messages/29/65839.jpg" alt="kitestring"></p>
