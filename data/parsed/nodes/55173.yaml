    html: "<p>I don't know what size you need, but I've had good luck with Staples item #714409, which is equivalent to Avery #5660/8660. They're clear and laser-compatible. I've never tried them on an inkjet, but the package says they're inkjet compatible. These are 1\" x 2-5/8\" address labels, but they probably come in other sizes too.</p>"
