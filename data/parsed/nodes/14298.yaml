    html: |-
      <p>While they both could be called humanist sans, Myriad and Lucida are two different typefaces.</p>
      <p>Myriad was designed by a team at Adobe, led by Carol Twombly and Robert Slimbach:<br>
      <a href="http://store.adobe.com/type/browser/P/P_1706.html" title="http://store.adobe.com/type/browser/P/P_1706.html">http://store.adobe.com/type/browser/P/P_1706.html</a></p>
      <p>Lucida Grande is a display version of Lucida Sans. Both were designed by Kris Bigelow and Charles Holmes:<br>
      <a href="http://store.adobe.com/type/browser/P/P_1359.html" title="http://store.adobe.com/type/browser/P/P_1359.html">http://store.adobe.com/type/browser/P/P_1359.html</a></p>
    html_clean: |-
