  html: "<p>Hi there, <br> <br>I am trying to identify the font that was used for the poster artwork of \"The League of Extraordinary Gentlemen\". <br> <br>My sample is pretty big, so I'll just link to it: <br><a href=\"http://www.adventurefan.de/birdseed/lxg_font.jpg\"> Sample</a> <br> <br>I am not sure, but I think the white font and the greenish font are the same. However, the white font uses capital letters only for the 'L' in 'League', the 'E' in 'Extraordinary' and the 'G' in Gentlemen whereas the green font is all in captions. <br>Thus I'd assume that only capital letters have those spikes. <br> <br>In case I am wrong and it is indeed two different fonts that were used, then I'd be very grateful to find out both font types. <br> <br>Thanks for your help, <br>Chris</p>"
  html_clean: "<p>Hi there, <br> <br>I am trying to identify the font that was used for the poster artwork of \"The League of Extraordinary Gentlemen\". <br> <br>My sample is pretty big, so I'll just link to it: <br><a href=\"http://www.adventurefan.de/birdseed/lxg_font.jpg\" class=\"link-external\"> Sample</a> <br> <br>I am not sure, but I think the white font and the greenish font are the same. However, the white font uses capital letters only for the 'L' in 'League', the 'E' in 'Extraordinary' and the 'G' in Gentlemen whereas the green font is all in captions. <br>Thus I'd assume that only capital letters have those spikes. <br> <br>In case I am wrong and it is indeed two different fonts that were used, then I'd be very grateful to find out both font types. <br> <br>Thanks for your help, <br>Chris</p>"
