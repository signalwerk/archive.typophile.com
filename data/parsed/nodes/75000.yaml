  html: <p>Specifically relating to typography (hand-drawn scripts)—though I'd be open to any broader suggestions as well—I'm looking for something that fits the young teenage girl demographic without having to give up some good design principles. Those two often seem to be at odds with each other, but if you know of anything that may help me collect some helpful inspiration I'd appreciate it. Thanks.</p>
