      <p>&gt; I'm curious – why is it, according to your philosophy, that the development absolutely has to move from serif to sans rather than the other way round?</p>
      <p>Nina, Maybe I can explain it to you by comparing type with a human body and its clothes. In my view the serif design is the human body on which you can put clothes. These clothes could be a sans or a slab or maybe even something else. One thing is sure: the clothes have to fit more or less with the body. After being dressed the body itself becomes almost invisible, only very specific details will be recognized (like long leggs, short arms, a big butt). </p>
      <p>Now, if you start with the clothes (sans serif), what body could be inside? You hardly can't tell because the clothes will hide all details of the body. There could be anybody inside.</p>
      <p>If you want to dress Mr. Walbaum, you will come up with a suite that looks like Akzidenz Grotesk. But if you take a suite like Akzidenz Grotesk, you can imagine a whole range of different bodies inside.</p>
      <p>&gt; Could you point to a superfamily that started with a sans, and what specific<br>
      problems you see in it because of that line of derivation?</p>
      <p>Hrant, I can give one example of a family that started with a sans: my much adored Syntax. When in 2000 Syntax Serif was released I was very disappointed. Syntax Serif has been forced in a shape that looks artificial and frightened, where Syntax looks strong and self-confident. </p>
      <p>This I found on MyFonts about Syntax Serif: "With this new design, Meier has at last given shape and structure to the invisible muse that inspired him in the 1950s when he conceived his monoline sans serif based on humanist or Oldstyle letterforms."</p>
      <p>&gt; (Please feel free to point me somewhere else if you've explained this before.)</p>
      <p>Nina, I have explained this in my type design philosophy which you can find on my website: <a href="http://www.martinmajoor.com/6_my_philosophy.html" title="http://www.martinmajoor.com/6_my_philosophy.html">http://www.martinmajoor.com/6_my_philosophy.html</a></p>
    html_clean: |-
