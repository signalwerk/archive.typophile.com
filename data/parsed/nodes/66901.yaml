      <p>Just to split a hair: Syntax and other humanist sans designs adapt the grotesque or monolinear style to the proportions or skeleton of a Renaissance face. The experiments by Lew, Tschichold, Carter etc. are more motivated by the interest in a modulated Renaissance design without serifs. The contrast here is important. </p>
      <p>I think this is worth distinguishing. The results are certainly visibly different. Otherwise why would Martin Majoor be considering it a 4th style in a superfamily like Nexus?</p>
