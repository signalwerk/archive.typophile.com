      <p>This Sabons Sans thread has taken an interesting direction - a discussion about the relation of sans and serif, and their origins. Since the common opinion about Sans typefaces is that they first appeared in the Nineteenth century (William Caslon), I would like to point you to Sumner Stone's argument about the pre-Roman origin of the Sans, explained in many essays appeared in recent years. In "The Essential Form", for example, Stone states that "Although the recent history of the sans begins only 200 years ago, its earliest appearances are in the simplified drawings which make up the Sumerian and Egyptian scripts of around 3100 BCE." He refers to epigraphic inscription and not to calligraphic letters, by the way. As I already mentioned, I guess Stone's writings on the matter is really interesting; you can check his arguments in the essays "Letters Lost", "Warp and Woof", "The Essential Form" and "Transitions in form the pre-serif letter", here:</p>
      <p><a href="http://stonetypefoundry.com/alphabetfarmjour.html" title="http://stonetypefoundry.com/alphabetfarmjour.html">http://stonetypefoundry.com/alphabetfarmjour.html</a></p>
    html_clean: |-
