      <p>Just some points of information:<br>
      The sketches and proofs pictured above are contained in the archive of Tschichold's working material at the Deutsche Nationalbibliothek (Leipzig).<br>
      These photographs were taken in 2006 by Fred Smeijers, who immediately perceived how interesting this sanserif design was when he encountered it.<br>
      The images are printed in my book _Active literature: Jan Tschichold and New Typography_, published by Hyphen Press:<br>
