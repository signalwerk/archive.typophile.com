    html: |-
      <p>Nicola, thanks for sharing this. Very intriguing! I assume many of you know about Dwiggins' experiment, and Matthew Carter's very similar experiment, also from the 60's. Both seem to have started with a Renaissance serif design and removed serifs. Kent, thanks for showing your trials. Great minds think alike! </p>
      <p>I don't think of Syntax as being as closely related because it's very slightly modulated; it's still clearly a humanist sans. But Meier did eventually develop a semi-serif, Syndor, intended as a hybrid of Syntax and Barbedor. It looks to me like a different path. Vestigial serifs.</p>
      <p>There were a bunch of flared sans designs in the 20th century as well as a number of modulated sans designs with an angled stress. Craig brought up <a class="freelinking external" href="http://www.typophile.com/node/53266" rel="nofollow">in this older thread</a> a design by Gill with the flared quality, which is more like Stellar, Mentor Sans or Magma. The stressed sans designs like Lydian and Stahl seem to be directly derived from the broad pen, rather than a serif type as a starting point.</p>
      <p>Then there are more typographic designs like Amira and Amerigo, which don't seem as much tied to a specific tool or a serif precursor. Clearly there are numerous ways to approach this idea, and the variations make all this experimentation worthwhile. </p>
      <p>Martin, I like your idea in the Trilingual Typography thread that a contrasting sans could fit a niche in a superfamily.</p>
