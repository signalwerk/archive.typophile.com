      <p>"In my view the serif design is the human body on which you can put clothes."</p>
      <p>Martin, while I can easily understand your point, I guess I just see it as only one way of looking. It makes it sound as though there is a dependency or a dominant-submissive relationship between serif and sans. I don't agree with either. To me, they are just different forms. The sans has less history in calligraphy and more in industry but these things are superficial. I don't see one as being born from another. They are like paternal twins, both from the same family but each true to itself as an individual, whichever one was born first.</p>
