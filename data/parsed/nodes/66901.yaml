      <p>I think you can go from a sans to a serif if you don't get too bogged down with getting the family resemblance right through matching the shapes. The resulting serif, if done well, may not have an obvious relationship with the sans, but will harmonize well by capturing the spirit rather than the details in the shape. I'm thinking of something like Meta Serif or Galaxie Copernicus here.</p>
