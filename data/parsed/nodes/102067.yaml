      <p>Swedish and furniture of course screams IKEA... And they used Futura for a long time, before swithcing to Verdana, for whatever reason. So any combination of especially the bolder weights of Futura and furniture feels comfortable, coz you've seen it so many times already.</p>
      <p>I would 2nd Nick Shinn here and say: live a little, explore, try out. Try out things you never have seen and see what works, and what does not. You might well just start by using the fonts already on your computer, and you would hardly ever see or use otherwise. Try to find the characteristics in typefaces for yourself.</p>
