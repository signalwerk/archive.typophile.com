      <p>Wow, it's quite amazing to get all this opinion, advice and suggestions in such short time. This forum is great!</p>
      <p>As some of you and also my teacher pointed out, using Futura is not very creative for this assignment. It's suitable cause It makes you think of Ikea (Ikea sans looks almost identical to Futura) and numerous other swedish furniture companies, but good graphic design is not about reproducing whats already out there. If you want to stand out you need to find new and exciting approaches to things.</p>
      <p>So… I've left the safe Futura-harbour behind and am doing some exploring right now. Fountain and Monokrom, for example, are new and pleasant acquaintances. Thanks a lot you guys.</p>
