    <p>Hello typhofiles,<br>
    I am a graphic design student that could use some help. At the moment I am working on an assignment where I am to create a visual identity for a design hotel which has swedish furniture design as it's theme. It should reflect both the contemporary design and the design history.</p>
    <p>When I think of swedish furniture design I think of functionalism, rational design, clean and stylistically pure furniture. I immediately thought of Futura for the typography, and therefore chose the classic combination Futura and Bodoni.</p>
    <p>My teacher however had this to say about my choices: Excepted+safe=boring. He told me to explore the world of typography and come up with something that feels more modern.</p>
    <p>Any suggestions on where to start looking? Any hands-on suggestions on which fonts to try? Any help is appreciated. Thanks!</p>
