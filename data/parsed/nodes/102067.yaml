      <p>I think Henrik's use of "modern" (which might have come from his teacher) could be throwing things off, especially if we don't know if he meant to capitalize it or not. :-)  It's a supremely over-loaded term. In Spain for example "el modernismo" refers to things like Gaudí's crazy-amazing stuff! I have a feeling he just meant "contemporary" but -very humanly- wanted to save three syllables.</p>
      <p>Age however indeed has nothing to do with it; ubiquity on the other hand does.</p>
