      <p>Like the Swiss design style from the 1950s, the Scandinavian design style has a <em>halo effect</em> that reaches beyond borders and time. There are even similarities (due to the roots and influences of the time) in both styles, in terms of clarity and simplicity of design solutions. </p>
      <p>Swiss design refers more to graphics than furniture and has a strong industrial tendency. A great distinction of Nordic design is the warmth of bright colours in contrast with dark elements, materials like birch wood and soft, organic shapes found in Swedish furniture design. </p>
      <p>I believe that a designer’s understanding of Swedish design today is more influenced by contemporary interior styles than <a class="freelinking external" href="http://www.houzz.com/swedish-style-chairs" rel="nofollow">what people recognize</a> as Swedish Design today. It certainly doesn’t stop at Ikea.</p>
      <p>Futura is a post WWI font influenced by Art Deco and the Bauhaus philosophy. Aside of graphical shapes, it has almost nothing in common with what I would classify as modern Swedish furniture style.</p>
      <p>If warmth, organic shapes, bright wood and a lot of white are style elements of Swedish interior design, then I would look into a Humanist Sans Serif typeface. Certainly nothing industrial, like Helvetica Neue and nothing too close to Bauhaus or Art Deco, like Futura.</p>
      <p><a class="freelinking external" href="http://www.fontsquirrel.com/fonts/open-sans" rel="nofollow">Open Sans</a> comes to my mind, as well as <a class="freelinking external" href="http://www.myfonts.com/fonts/garagefonts/freight-sans-pro/" rel="nofollow">Freight Sans Pro</a> (this is the new Facebook font). A great balance provides <a class="freelinking external" href="http://www.myfonts.com/fonts/carnoky/samo-sans-pro/" rel="nofollow">Samo Sans Pro</a>, which isn’t commonly used, but well designed. Another option would be <a class="freelinking external" href="http://www.myfonts.com/fonts/r-type/gesta/" rel="nofollow">Gesta</a> – maybe because it has this dry approach with a subtle softness and narrow characters.</p>
