    <p>From a Microsoft typography site:<br>
    <a href="http://www.microsoft.com/typography/glossary/ch4.htm" rel="nofollow">TERMINALS<br>
    are not what you think they are. They are a particular kind of curved stroke. They are not even curved strokes that end. They are certainly not strokes that end in serifs.<br>
    The most sensible terminal is a tail (see above). But the part of a C before it hits the arm (see above) is a terminal. Strokes at an edge seem to be eligible for 'terminal status'. The part of an S after the spine and before it hits an arm is a terminal. The ear on a g is a terminal.<br>
         A swash, (like those with which, by extending the serifs, ITC ruined Bookman), is a terminal. A loop, as that which wraps round the counter of a Baskerville g, is a terminal. A link, as that which joins the two parts of a g, is sometimes a terminal.</a></p>
    <p>Huh? I thought terminals described the handling of the ends of strokes. Is the link between bowls of a lowercase /g/ really a terminal?</p>
