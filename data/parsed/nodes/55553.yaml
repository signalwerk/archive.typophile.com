  html: |-
    <p>In the <a class="freelinking external" href="http://typophile.com/node/55454" rel="nofollow">Best Century</a> thread, Nick Shinn mentions that the classic match to Century is Franklin Gothic, which obviously comes from more of a newspaper tradition.</p>
    <p>I'm curious as to what other combinations could be considered "classic"?</p>
    <p>We have:<br>
    Century -&gt; Franklin Gothic<br>
    Helvetica -&gt; Helvetica (LoL, those witty Swiss...)</p>
