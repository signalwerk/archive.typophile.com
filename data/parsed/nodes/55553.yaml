    html: <p>In the late 70s early 80s nearly every ad used Futura Extra Bold Condensed for the headline and Century Oldstyle for the text And everything was kerned "tighter than a waterbug's ass". That was the actual terminology we used back at Great Faces. It's been quite a while since I've seen Century Oldstyle used in advertising.</p>
