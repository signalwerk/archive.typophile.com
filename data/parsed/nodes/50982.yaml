      <p>I’d say that since about 90% of the enormous amount of labour happens after the characters are initially drawn it’s a bit of a big ask. Plus characters will need to be re-drawn along the way. You’re seeking a patient saint!</p>
      <p>You never know what people are willing to do though. Maybe there’s a business niche being missed for out-sourced kerning and hinting.</p>
