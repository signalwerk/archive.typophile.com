    <p>Hello all—</p>
    <p>Just wondering. I’m thinking of finally making my own Font family but I was wondering:</p>
    <p>Would it be too much to ask to do all the work myself but to ask another to simply convert the .ai vectors into an actual font using the appropriate software? I have everything I need... my hands and Illustrator... but I don’t have a font program and as this stage in the game it’s far too much to invest in.</p>
    <p>That was my only question. I’m not quite sure how much work it’d be to take ready-made letters and then, bring them into the correct software.</p>
    <p>Muchas Gracias—</p>
