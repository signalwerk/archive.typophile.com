    html: <p>James, I would contact some type foundries - T-26, Typetrust, Fontshop, PsyOps, Fountain, to name just a few, show them your design and see if they’re interested. If they like the design, most of these places will develop your drawings into a functioning typeface. There may be some independent type designers around here that would do the same for a fee, and/or split in royalties. It really depends on the appeal of your design. You might want to post some word settings to see if folks are interested.</p>
