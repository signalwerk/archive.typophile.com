    votes: null
    html: "<p>Kyle, there are multiple reasons to design in a font program rather than Illustrator, including: 1. You can easily preview your letters in combination with other letters, in words, at will. This is critical to a good font. 2. There are problems transferring from Illustrator to a font program, so it is easier for all concerned to start in a font program. Google with preface of site:typophile.com, and you will find threads on it. 3. The drawing tools in font programs themselves make it easier to adjust curves for letters. I think that anyone who does it will tell you that investing $99 for a basic program is worth it. And also get “Learn FontLab Fast”. Then when it comes to kerning and all the technical stuff and expansion of character set, etc., you may, if it is good, be able to get a foundry to do it with by sharing profits, or, if not, paying them to do the work.</p>"
