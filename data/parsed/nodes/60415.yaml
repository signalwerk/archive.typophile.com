    <p>I am fortunate to live within half an hour’s driving distance of 3 great printing museums in Belgium. During recent visits I took some pictures and posted them on my web site. You’re invited to take a short virtual vacation and look around in the:<br>
    - <a class="freelinking-external" href="http://www.prepressure.com/library/fun/historische-drukkerij">Historische drukkerij</a><br>
    - <a class="freelinking-external" href="http://www.prepressure.com/library/fun/kaartenmuseum">Kaartenmuseum Turnhout</a><br>
    - <a class="freelinking-external" href="http://www.prepressure.com/library/fun/plantin-moretus">Plantin-Moretus museum</a></p>
    <p>To wet your appetite, here is a little teaser.</p>
    <p></p><div class="imageWrap"><img src="/files/museum_antwerpen_plantin_moretus_6_4685.jpg"></div><p></p>
    <p>Enjoy!</p>
