    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/17745" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Designers</a>&nbsp;: Hrant&nbsp;Papazian</strong></p>
    <p>An Armenian born in Beirut, Papazian currently lives in the Glendale suburb of Los Angeles. He runs his type business via the <a href="http://www.microfoundry.com">Micro Foundry</a> website.</p>
    <p>Regarding some of his theories on latinization and the mixing of scripts, see his article in the fourth issue of <a href="/node/12244" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Spatium</a>.</p>
    <p>Papazian teaches “Introduction to Typeface Design” at <a href="/node/12596" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Art Center College of Design</a> in Pasadena,&nbsp;California.</p>
    <p>Hrant is by all measures the most prolific forum poster on matters regarding typography and type design (as well as sharing his thoughts on hosts of other topics) on the&nbsp;Internet.</p>
    <p>See the <a href="/node/add/wiki?edit%5Btitle%5D=Daidala" title="Create node &quot;Daidala&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Daidala</a> <a href="http://www.daidala.com/25apr2004.html">interview</a> or “The Bouma Supremacy” in <a href="/node/12083" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typo Magazine</a>.</p>
    <p>Not to be confused with <a href="/node/16006" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Shram H Paparazian</a>.</p>
