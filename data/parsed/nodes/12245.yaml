    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Hrant Papazian</strong></p>
    <p>An Armenian born in Beirut, Papazian currently lives in the Glendale suburb of Los Angeles. He runs his type business via the <a href="http://www.microfoundry.com" rel="nofollow">Micro Foundry</a> website.</p>
    <p>Regarding some of his theories on latinization and the mixing of scripts, see his article in the fourth issue of <a href="/wiki/Spatium" class="freelinking" rel="nofollow">Spatium</a>.</p>
    <p>Papazian teaches "Introduction to Typeface Design" at <a href="/wiki/Art%20Center%20College%20of%20Design" class="freelinking" rel="nofollow">Art Center College of Design</a> in Pasadena, California.</p>
    <p>Hrant is by all measures the most prolific forum poster on matters regarding typography and type design (as well as sharing his thoughts on hosts of other topics) on the Internet.</p>
    <p>See the <a href="/wiki/Daidala" class="freelinking" rel="nofollow">Daidala</a> <a href="http://www.daidala.com/25apr2004.html" rel="nofollow">interview</a> or "The Bouma Supremacy" in <a href="/wiki/Typo%20Magazine" class="freelinking" rel="nofollow">Typo Magazine</a>.</p>
    <p>Not to be confused with <a href="/wiki/Shram%20H%20Paparazian" class="freelinking" rel="nofollow">Shram H Paparazian</a>.</p>
