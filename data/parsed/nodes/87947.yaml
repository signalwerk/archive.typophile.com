    html: |-
      <p>The use in English of the word “mock” as an adjective to describe an imitation is somewhat like that of the French loan-word “faux”, not quite so scathing as the way “mock” is used as a verb.</p>
      <p>Mock turtle soup is an English soup that was created in the mid-18th century as a cheaper imitation of green turtle soup. It often uses brains and organ meats ... [wiki description].</p>
      <p>Lewis Carroll created the Mock Turtle character for <em>Alice in Wonderland</em>: the humour is implicit.<br>
      (George Lois did something similar in the 1960s, inventing the <a href="//www.georgelois.com/pages/Logos/logos6.html" rel="nofollow">Nauga</a> beast as the origin of Naugahyde, for a vinyl furniture product.</p>
      <p>In the early 20th century,  a postmodern housing style incorporating elements of Elizabethan (16th century) architecture was applied to houses and apartment buildings (blocks of flats) in the Anglosphere. This was down-market, and was satirized by the intelligensia as “Tudorbethan” (Poet Laureate John Betjamin’s neologism of Tudor and Elizabethan), or “Mock Tudor”—playing on the typographic similarities between Mock Turtle and Mock Tudor (homotypy?)</p>
      <p>I’m not surprised that Andron English, so cleverly evoking <a href="http://en.wikipedia.org/wiki/Merry_England" rel="nofollow">Merrie England</a>, is a hit in the UK—a tip of my (Robin Hood) hat to you, Andreas!</p>
    html_clean: |-
