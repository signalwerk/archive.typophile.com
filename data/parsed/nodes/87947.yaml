    <p>The rather peculiar <strong>Andron 2 English</strong> renders itself increasingly popular recently, especially among British designers.</p>
    <p>I take the great pleasure to announce that <a class="freelinking external" href="http://new.myfonts.com/fonts/andreas-stotzner/andron-2/" rel="nofollow">Andron 2 English Regular</a> now has got most welcome kinship: matching <strong>Italics and Semibold</strong> fonts. So the possibilities of fancy typography with Andron English – become three times as great and funny!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/And-2-ENG-muster2_5867.jpg"></div><p></p>
    <p>Andron 2 English Italic and Andron English 2 Semibold feature the usual classic and acknowledged original Andron feeling, yet provide the same specific glyph varieties known from Andron 2 English Regular. </p>
    <p>All three fonts have entirely matching glyph sets. However: the Italics come with some very special extra: a set of 48 beautiful <strong>typographic ornaments.</strong></p>
    <p>On request I provide a 2-page specimen PDF (ca. 1,7MB) per Mail.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/And-2-ENG-muster1_5728.jpg"></div><p></p>
    <p>For all orders placed until 31 December (directly to me) I offer <strong>special introduction prices</strong> (you’ll save 25% and more from the usual MyFonts prices).<br>
    At MyFonts the two new fonts will be available by beginning of the new year.</p>
