    votes: null
    html: |-
      <p>Nice suggestion Nick !<br>
      And some good sources to check, but the one from Nicolete Gray cost more than $1000 and is hard to find.<br>
      Definitely out of reach for me, I will have to wait to sell more packs ;-)</p>
      <p>I admit that so far, I made a compilation without caring too much about classifying by date or rationalize it. I'm from a web designer background and I'm not a specialist about typography and font history.<br>
      I just wanted to provide a large choice of ornaments at a fair price (and easy to use with illustrator, I don't like use fonts for ornaments).</p>
      <p>I picked ornaments in a lot of different type foudry catalog available by Internet, thanks Google books and Gallica ( gallica.bnf.fr )<br>
      So here is some catalogs I used :<br>
      . American Type Founders<br>
      . Barnhart bros. and Splinder<br>
      . George's Bruce<br>
      . Cleveland Type Foundry<br>
      . Farmers type foundry<br>
      . franklin Type Foundry (Cincinati)<br>
      . Inland Type Foundry<br>
      . Keystone Type Foundry<br>
      . Mackellar, Smiths 7 Jordan Co.<br>
      . Imprimerie Edmond Monnoyer<br>
      . Palmer &amp; rey<br>
      . Fonderie Turlot</p>
      <p>Actually, the more I worked on these ornaments, the more I learned.<br>
      I'm currently reading the old and excellent "Grammar of ornaments" by Owen Jones.<br>
      And I realized that behind the nineteenth century, the inspiration for lot of these ornaments come from old civilizations (Egypt, Greece, Roma, etc.) and previous era (renaissance, Baroque, etc.)<br>
      It would make sense to categorize them in this way too.</p>
      <p>Searching ornaments, choosing and vectorize it was a time consuming task.<br>
      If these ornaments sells well, I plan to release more and to take time to organize it better.<br>
      Also, I would love to create a manual to explain the proper way to create genuine ornaments (huge project...)</p>
