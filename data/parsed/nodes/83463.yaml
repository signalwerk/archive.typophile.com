      <p>@riccardo, it should be should :-)</p>
      <p>***</p>
      <p>Back on track:<br>
      Nicely done, but what are your sources?</p>
      <p>The Victorian era was very long and encompassed many different genres, from revivals to original styles (both Arts and Crafts and Art Nouveau occurred during the era).</p>
      <p>The <em>Manual of Linotype Typography</em> of 1923 associates typefaces with ornaments, by style and era.</p>
      <p>Nicolete Gray's <em>19th Century Ornamented Type Faces</em> does a brilliant job of identifying the different genres of Victorian type by decade, and associating them with contemporary movements in art and architecture. Perhaps you could use her timeline as a basis for metadata, adding depth and resonance to your collection—and it would suggest ways of matching type style to type ornament.</p>
