      <p>You've taken it to the next level, Vincent! Compilation, artwork, and packaging — I especially like the way you've sorted the ornaments into different categories and explained how to use them in Illustrator.</p>
      <p>**</p>
      <p>People always say Victorian decoration is derivative of previous cultures, and Jones' book lends credence to that understanding.<br>
      But it's much harder to recognize what's new and original, within that cauldron of crazy prolific synthetic invention—especially for we decoratively challenged children of modernity who have spent a century associating newness with the opposite of decoration.</p>
