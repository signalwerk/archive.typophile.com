    <p>Hi all,</p>
    <p>I felt in love with these quaint but charming ornaments with this victorian touch.</p>
    <p>I decided to select and vectorize hundreds of ornaments from old nineteenth century type foundry catalog.</p>
    <p>You can download here a free pack with 85 ornaments  : <a href="http://www.vectorian.net">http://www.vectorian.net</a><br>
    If you like it, you can also buy the complete pack at a affordable price (more than 900 ornaments for $57)</p>
    <p>It's nor exactly a font, but it helps  for any typographic antique design.</p>
    <p>I'm especially proud of the illustrator frame borders : you can in seconds create antique borders by combining them.<br>
    If you resize the frame, the border pattern adapt.</p>
    <p>I had a lot fo fun preparing this pack, and I hope you will like it too :-)</p>
    <p>Vincent,</p>
