    html: |-
      <p>@ Nick</p>
      <p>Whaow, thanks for appreciating it !<br>
      I' m blessed to hear that from you as I know and love your work :-)<br>
      By the way, I plan to release a manual and a demonstration video.</p>
      <p>You're right about the twentieth century rejection of ornaments and decorations.<br>
      We're living in the "less is more" era, and in my daily job I create minimalist Web Designs (in an Apple / Braun style).<br>
      That's maybe why I felt in love with these quaint ornaments, which are lively, exuberants and imperfects.</p>
      <p>Creating a victorian inspired website was a playful experience, and as a web designer I see more and more vintage design, texturized and distressed elements in websites...<br>
      Designers try to inject more life in their creations and get rid of the aseptic and clean design.</p>
