  html: |-
    <p>Please take a look at <a class="freelinking external" href="http://www.TypeIsArt.com" rel="nofollow">www.TypeIsArt.com</a> it was recently re-released with some additional features and a new interface design.</p>
    <p>Take it for a spin... and let me know what you think. Any feature requests? Typefaces you think would make for a good Special Edition? I'm working up a list for the next version and would love to have your opinion.</p>
    <p>If you happen to be in Buffalo for TypeCon2008 this week please stop in at <a class="freelinking external" href="http://www.224Allen.com" rel="nofollow">SP@CE224</a>  between the end of the day and any night's festivities (5PM-9PM). If the door is locked, ring the white doorbell and I'll open up. We are just a block South and a block West from the venue where Sagmeister is speaking on Wednesday. </p>
    <p>Let me know you're in for TypeCon2008 and I'll uncork a bottle of Ex-Libris Cabernet Sauvignon.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/TIA_mini_4447.jpg"></div> <p></p>
    <p>Here are some tips for those who bothered to scroll down this far.</p>
    <ul>
    <li>There are several key combinations that affect the selected object. (move/rotate/scale)
    </li><li>Hold down the space bar and use the arrow keys to move all objects at once.
    </li><li>Don't forget to save!
    </li><li>Let it sit for 10 minutes for an animated treat.
    </li><li>Check it out again soon to see the first Special Edition featuring a treat from the folks at P22.
    </li></ul>
