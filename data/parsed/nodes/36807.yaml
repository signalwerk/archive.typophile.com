    html: <p>It would be interesting if Apple were to get into eBooks using this type of device and the iTunes store to deliver the DRM'd content. I'd love to agree with you that they'll go that way, but I'm not convinced books are considered cool enough. I wonder if they are looking beyond the browser with its PDF style pan, scan and zoom interface to a page based interface, like the NYT Reader. Also although it’s great to see all those Microsoft, Linotype and Monotype fonts on the iPhone I would have thought if eBooks were on their radar they’d be investing in screen type, and revisiting their rendering philosophy – I suppose they still have time to go there, but my magic 8-ball says ‘signs point to no.’ I guess we'll have to wait and see.</p>
