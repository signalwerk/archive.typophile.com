      <p>Actually, in this respect, Tiger already has it.  You can turn on resolution independence in Tiger but type is about the only thing that scales cleanly. This picture shows Safari running at 144, with the UI Rez window running at 72.   <a href="http://media.arstechnica.com/images/tiger/safari-scaled-2x-big.jpg" title="http://media.arstechnica.com/images/tiger/safari-scaled-2x-big.jpg">http://media.arstechnica.com/images/tiger/safari-scaled-2x-big.jpg</a></p>
      <p>Apple DOES have a new type technology, although in part it could just be a rebranding of existing technology.  However, I don't have a beta of Leopard, and so beyond knowing of CoreText via random clues on Apple's site, I don't have a clue exactly what it is (I joined the Apple mailing list for it, but there haven't been any posts at all).  Maybe they'll be supporting more OT features, but until it's released I'd imagine only the Adobe folks on the forum here would know, and they can't say anything about it.  Given what CoreAnimation, CoreImage, CoreAudio, etc, brought to earlier versions, decent speculation could be made.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
