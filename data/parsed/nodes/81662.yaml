      <p>Hi fakeheadlines, I'm a web developer at Betfair.</p>
      <p>The titling face is Block Berthold aka. Block BE by Heinz Hoffman.<br>
      For any more points, the company's design guidelines are openly available online here <a href="/wiki/https%3A/%252Fpromotions.betfair.com/betfair-new-brand-assets/" class="freelinking" rel="nofollow">https://promotions.betfair.com/betfair-new-brand-assets/</a></p>
      <p>Cheers,<br>
      Sebastian</p>
