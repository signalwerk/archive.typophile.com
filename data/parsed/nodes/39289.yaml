    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12038" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Terminology</a>&nbsp;:&nbsp;Saccade</strong></p>
    <p>Saccades are fast, frequent and irregular eye movements which progresses the eye from one reading position to the&nbsp;next. </p>
    <p>Saccades have been recorded at up to 500 degrees per second. At this speed, visual input is reduced and no information is&nbsp;processed.</p>
    <p>A saccade is proceeded by a <a href="/node/39290" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">fixation</a> during which information is processed in the <a href="/node/39291" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Fovea</a>.</p>
