    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a> : Saccade</strong></p>
    <p>Saccades are fast, frequent and irregular eye movements which progresses the eye from one reading position to the next. </p>
    <p>Saccades have been recorded at up to 500 degrees per second. At this speed, visual input is reduced and no information is processed.</p>
    <p>A saccade is proceeded by a <a href="/wiki/fixation" class="freelinking" rel="nofollow">fixation</a> during which information is processed in the <a href="/wiki/fovea" class="freelinking" rel="nofollow">fovea</a>.</p>
