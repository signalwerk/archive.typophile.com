  html: |-
    <p>Hi,<br>
    I'm new here. And this is my first try at creating a text type. I really appreciate some help.</p>
    <p>This is what i got now, a single weight version with almost all characters I need.</p>
    <p>The concept:<br>
    minimálstíle CE is a typeface designed to replace Helvetica in certain situations.<br>
    I like Helvetica and Eurostile a lot, so these and my handwriting were the foundations for my design process. I always tried to optimize my handwriting, less lines if possible, no 180° turn backs, just easy curves. The result was the single line b, d, n, p, q, and r. I love the squareness of Eurostile and it even makes it easier to chop off the "unnecessary" parts. I observed Helvetica, because its still the best designed typeface. The horizontal cutting is one of my favorite features, so I decided to design my font the same way.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/minimalstileCE3_3774.jpg"></div><p></p>
