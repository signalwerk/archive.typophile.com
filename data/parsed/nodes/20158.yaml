    <p>While attending CHA, the Craft and Hobby Tradeshow held in Las Vegas this year, several owners and designers of online scrapbook consignment stores were discussing piracy. They are angry and frustrated with the piracy of their products.</p>
    <p>However, during this same discussion, the owners of a leading online store stated that they could use any font as part of their digital products- papers, icons, elements, lettering, word art, etc. without fear of violating copyright laws. Their reasonig is this:  Fonts are mechanical devices, and therefore cannot be protected by copyright. They suggested that fonts require a patent in order to protect them from illegal use, such as file sharing, commercial use, etc.</p>
    <p>As a graphic designer in the digital scrapbook and clip art industry, I am very concerned about the issue of copyrights, trademarks and patents and how they apply to fonts, true type fonts, typography and type faces.  Fonts and type faces are used frequently in the design of scrapbook papers, elements, ribbons, etc.</p>
    <p>Any insight on this subject would be greatly appreciated.</p>
