      <p>Hi-</p>
      <p>Thanks for the reference to Jen's Blog. I am an acquantance of Jen's and am familiar with her blog.</p>
      <p>I guess what I'm looking for is more information from the Font Foundry's on commercial use, licensing for commercial use, etc.  </p>
      <p>I want to protect my own interests, artwork and designers from copyright infringements of all types. In order to best serve my company and the customers that purchase our downloadable designs, I want to be able to post information about the licenses we have purchased for commercial use, as well as inform the digital community about copyright law and what constitutes an infringement.</p>
      <p>I am confused by other graphic designer's interpretation of font EULA's. They are under the impression that they can use fonts in their graphic designs and then sell their designs online or in retail stores.</p>
      <p>It seems clear to me that the fonts they claim can be used for commercial projects, are actually licensed only to the end user: for personal, non-commercial use. Most of them site Microsoft Word or Works as their source for fonts and claim that the EULA allows them to use Microsoft's Fonts in their commercial ventures.</p>
      <p>After reading about fonts on Microsoft's site, I did not come to the same conclusion. Rather, I learned that Microsoft has a license agreement with many different Font Foundaries and the license they are providing is only to the end user for personal use only.</p>
      <p>If this is the case, then none of the type faces these companies and their designers are using, and claiming to be free fonts, or shareware, can be used legally in graphic designs of papers, ribbons, elements, etc. </p>
      <p>Each designer must purchase a commercial license agreement for the fonts and type faces they are using in their artwork.</p>
      <p>Am I right?</p>
      <p>*** gina jane ***</p>
      <p>'relationships are the greatest art'</p>
