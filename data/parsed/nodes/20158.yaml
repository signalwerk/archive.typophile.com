    html: |-
      <p>"Their reasonig is this: Fonts are mechanical devices, and therefore cannot be protected by copyright."</p>
      <p>Digital fonts are not mechanical devices (that's a truly absurd claim), and Type 1 digital fonts have been found in a summary judgment by US Federal District Court (Adobe vs SSI) to be protected as software, and subject to copyright law. I'll go so far as to say that if Type 1 fonts are software, then OpenType and TrueType fonts sure as heck are software too.</p>
      <p>Most other countries in the world consider digital fonts to be protected under copyright law, and most first-world countries (notably in the EU) have considerably stronger protections for fonts than the US does.</p>
      <p>Regards,</p>
      <p>T</p>
