      <p>ginajane --- “Their reasonig is this: Fonts are mechanical devices, and therefore cannot be protected by copyright.”</p>
      <p>Thomas Phinney--- "I’ll go so far as to say that if Type 1 fonts are software, then OpenType and TrueType fonts sure as heck are software too."</p>
      <p>Wow- I totally agree with you. We are having a similar battle with copyright laws protecting our designer's original templates of boxes, cards, wrappers, and novelty packaging.  We have had customers rip off our templates alter them just slightly and claim them as their own.<br>
      Their response has been that our templates ought to be patented, however, if the original pattern is not 3-D or mechanical in nature, it is copyright protected the moment the first pencil marks are made- or the first digital pixels are placed on the canvas in Illustrator or Photoshop...etc.</p>
      <p>I am going to forward this thread to the site owners of the infringing company. I think it will enlighten them.</p>
      <p>Also- I want to clarify that we do not provide text in PDF files nor do we 'share' fonts or provide free fonts. </p>
      <p>Our company has purchased commercial use licenses for hundreds of fonts in order to be sure we are not violating the EULA. </p>
      <p>Our use of fonts is to embellish the art or graphics in our papers, and elements. The type becomes merged into the graphic. Our files are sold as a download in JPG or PNG formats.</p>
      <p>Samples of our work can be found at my site:</p>
      <p><a href="http://www.daisiecompany.com" title="http://www.daisiecompany.com">http://www.daisiecompany.com</a></p>
      <p>*** gina jane ***</p>
      <p>'relationships are the greatest art'</p>
