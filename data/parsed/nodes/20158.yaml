    votes: null
    html: |-
      <p>Gina, </p>
      <p>Yes. You are right. Just because a software package comes bundled with oodles of fonts, does not mean someone can use them in a project for sale which requires them to bundle the same fonts to be sold again. In general, the person who licensed the software is the only person who has the right to use the fonts.</p>
      <p>Very few people -- a challenge to link to foundries that do -- allow for re-distribution of their fonts by the original person who licensed them.</p>
