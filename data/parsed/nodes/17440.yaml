    <p>I know it's an odd and obsolete request, but I decided that if any community would have connections to a dinosaur such as a Linotype machine, it'd be this one. </p>
    <p>I guess I should introduce myself first (and hopefully not come off as <em>too</em> bad of a newbie.) My name's Eston, and I'm a student at the University of Michigan in Ann Arbor. </p>
    <p>I'm currently taking a journalism class at the University, and my old-school professor is really fond of the Linotype and the whole hot type era, as it was just fading away as he started his career as a reporter. He's starting a website (that I'm helping him get off the ground,) and I'd love to get a Linotype slug custom-made for him as a sort of nostalgic gift.</p>
    <p>The problem is that these machines are near-impossible to find, let alone in a working form. Do any of you have (or know anyone that has) a <em>working</em> Linotype machine that may be able to cast a slug for my professor? I'd be willing to pay for one.</p>
    <p>Thanks. Sorry this isn't a wonderful first post, but I'll definitely be sticking around. Now, where is my Bringhurst book... I think I should read that before I say much more. :)</p>
