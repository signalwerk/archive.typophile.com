      <p>I'm an end user of type rather than a designer, but having said that, we do augment our fonts whenever the EULA - or special permission -- allows. So, I do have some experience with moving characters (and usually move the ornaments), adding characters, and writing simple features.</p>
      <p>So here is my thinking: If you are switching on ornaments using either stylistic sets or the ornament features, there is no need to make the substitutions complicated. One to one works just fine. The user has already had to take an action to "turn them on," and should be well aware that the characters keyed -- or in the file -- will not be what appear.</p>
      <p>Having said that, we prefer to have the ornaments coded, in the Private Use area. As you say, any later use of the text now has a flag that the characters so encoded need attention. Moreover, they are accessible from programs that support Unicode but do not support some OT features.</p>
      <p>YMMV</p>
