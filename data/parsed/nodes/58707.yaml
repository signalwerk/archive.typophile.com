      <p>Karsten: That's the most reasonable implementation of 'ornm', if one is to do it at all... but it doesn't work well with non-OT-savvy representations of text. It relies on choose-one-of-many-alternates abilities that are lacking in too many places, and may continue to be lacking for another 5-10 years in some places, or even indefinitely in others.</p>
      <p>I think your option is every bit as theoretically valid as using PUA codepoints, but less useful in the real world. I came to this conclusion in large part from looking at real-world workflows and talking to engineers working on applications.</p>
      <p>Regards,</p>
      <p>T</p>
