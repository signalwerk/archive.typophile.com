      <p>I'm with Charles on this one. Pretty strongly so. If it's not a variant of a real character, it should not be an alternate of that character through an OpenType feature.</p>
      <p>If I could deprecate one more feature from the OpenType spec, I'd do that to 'ornm' and put it in the same purgatory as 'crcy' and 'dpng'.</p>
      <p>Cheers,</p>
      <p>T</p>
