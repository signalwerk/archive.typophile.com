    html: "<p>Just a thought. If <em>ornm</em> is used to 'link' ornaments to, say, the glyph encoded as bullet, then this feature has a useful function: to categorize otherwise unencoded ornaments as ornaments and allow applications to present them in 'controlled' manner (rather than exposing any glyph in a glyph palette). This of course requires that applications treat OT layout tables, if present, as kind of a <em>cmap</em> extension rather than mere gimmickry.</p>"
