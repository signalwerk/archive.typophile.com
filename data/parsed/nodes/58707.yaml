      <p>To be clear, what I'm advocating is using the PUA encoding without using any Opentype feature to switch a character with an ornament. That way, if you shift to a font that lacks the ornament -- actually, lacks a glyph with the same PUA number -- you get nothing but "salmon," which is as it should be.</p>
      <p>You can access PUA characters from the glyph pallet of course, but you can enter the Unicode number directly in InDesign. Or MS Word or EditPad Pro, for that matter. Dunno about Quark, but likely.</p>
      <p>Using an OT feature as you describe has all the minuses you've noted, with, I suppose, a plus that people who don't know how to enter a Unicode character directly in ID have a crutch.  </p>
      <p>Come to that, I also dunno about a Mac. To enter a Unicode number with Windows (make sure NumLock is on), hold down "alt" key, hit "+" on the keypad, followed by the numbers (also using the keypad), with any alpha caps from the regular keyboard. Then let go of the alt key. Takes longer to describe than to do. Probably something similar with the Mac.</p>
      <p>In either case, a *readme* with the font would be nice. I always made a readme listing all the features, and any other special functions/features, and I only have to please two other comps. And of course myself, the next time I go back into the font, muttering "what the hell did I do  . . .</p>
