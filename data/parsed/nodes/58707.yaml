      <p>Thanks for your input. </p>
      <p>If I read you correctly, you're advocating opentype substitution a → orn.1, provided orn.1 has a PUA encoding? Is that what you meant?</p>
      <p>I did a little test on this in InDesign CS2: </p>
      <p><strong>Access method one: opentype substitution a → orn.1, with and without PUA on the orn</strong><br>
      When switching to a different font it reverts, orn.1 → a. I had hoped the PUA encoding would prevent the return.</p>
      <p><strong>Access method two: glyph palette hunt and peck</strong><br>
      When switching to a different font it highlights in red, regardless of PUA encoding. This is the preferred result.</p>
      <p>- - -</p>
      <p>So PUA doesn't help in the way I'd hoped it would, but perhaps it's still worthwhile so that the illustrations are accessible in unicode apps without a glyph palette (not sure what that might be? Photoshop?). Here is what I'm currently thinking: use opentype sub for the banners (ornm &amp; stylistic set) because that will make user's life much easier. For the illustrations, leave them unencoded and unfeatured with access via glyph palette. Yes this means a font switch will result in 4===4 showing up, but banners require attention to compose, are often converted to outlines/rasterized, and are rare -- so I don't think it's too much of an issue.</p>
      <p>This seems like it might suit the pragmatists amongst us, but I'm curious what the by-the-spec crowd thinks?</p>
