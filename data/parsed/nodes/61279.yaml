    <em>If you Google the title, a link that starts a PDF download should be second on the list.</em></p>
    <p>It talks about the typographic design of airplane safety manuals &amp;c. A great example of how our work as typographers can help save lives. Does anyone else have practical examples where the application of typographic principles can help save lives?</p>
