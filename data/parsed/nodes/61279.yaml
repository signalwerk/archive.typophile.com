      <p><cite>[I]f I were to alphabetize Karel van der Waarde (by last name), what would be the proper syntax? I’ve often wondered how to deal with that naming convention.</cite></p>
      <p>It depends on whether you are creating an international name index or one targeted at a Dutch audience (it's a Dutch name).</p>
      <p>Internationally, it would be the "v" of "Van der Waarde, Karel". I think it's safe to say that 'international' stands for 'not using the Dutch system'!</p>
      <p>The Dutch system is to ignore lowercase prefixes: so, under "W" -- but still with the prefixes, so the full entry would be "van der Waarde, Karel". (Me, I'm listed under "J", and perfectly happy with that.)</p>
      <p>Prefixes in Holland are sorted normally, so in a block of "[xx] Waarde"'s "aan de Waarde" comes first, then "de Waarde", then "van den Waarde" and finally "van der Waarde". Another convention is to put the prefixes after initials, and in that case sorting is either on initials themselves, or (rather arbitrary) by street name or something like that:</p>
      <p>Waarde, A van<br>
      Waarde, B de<br>
      Waarde, C van der</p>
      <p>As I'm writing this it sounds increasingly confusing; nevertheless, we usually can find the one we were looking for.</p>
      <p>[Edit] I might as well add I am as confused about quadruple Spanish names and the eternal conundrum "Sung Song Blu Nigel" [*] -- Sung Song Blu, with the taken 'Western' name "Nigel", but with last name sorting, is it Sung Song Blu, Blue Sung Song, or Sung Blu Song?</p>
      <p>[*] Somehow these guys/gals never call themselves "John" or "Jack", it's always something take right out of Jane Austen.</p>
    html_clean: |-
