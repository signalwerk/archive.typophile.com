      <p><em>Adobe Reader decomposes them regardless of glyph name</em></p>
      <p>Which implies that my method is sound. The Unicode presentation form codepoints are mapped in the cmap table to representative glyphs -- e.g. 'f_f_i' -- so that if such codepoints are encountered in text then they will display correctly. On the PDF side, it doesn't matter whether decomposition takes place by parsing glyph names or by normalisation of the presentation form codepoints to alphabetic characters: the result is the same, and there seems no point in providing duplicate sets of ligatures in a font with different names and mappings.</p>
