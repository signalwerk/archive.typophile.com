      <p>Charles, what gets into a PDF -- and hence what you can get out of a PDF -- depends on how the PDF is created. For quite a while now it has been possible to store original document character strings in the PDF, which is what a good PDF-export tool will do. This should remove all chance: the characters used to encode the original document correspond to the characters stored in the PDF (in practice, this might mean normalisation of some kind, and I've had mixed results when dealing with complex scripts).</p>
      <p>The whole glyph name mapping thing is only important when you're dealing with a PDF that has been distilled from a print stream: either a print-to-PDF function or distilled from a .ps file. In that case, the original document character strings are not available, because all Acrobat can get from the print stream is the embedded font and the glyph IDs. This is where Acrobat tries to parse the glyph names in the font to reconstruct the text.</p>
