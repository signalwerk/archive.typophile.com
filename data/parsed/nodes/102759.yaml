      <p><em>In that case, liga should use the Unicode format, f_f_i, &amp; no number. That is, not map it to the presentation form. </em></p>
      <p>{liga} is an OpenType Layout feature, which means it maps from glyphs to glyphs independent of the characters in the text string. So let's say you have the word 'office', encoded as a sequence of six Unicode Latin alphabetic characters; with the {liga} feature active it will display with the ffi ligature. Now let's say you have a document from some legacy process in which the word 'oﬃce' is encoded as three alphabetic characters with a Unicode presentation form ligature character in the middle. In my scheme, both encodings are displayed with the 'f_f_i' ligature glyph, one via the {liga} feature and one via the cmap table. The <em>only</em> difference between the two is that the use of the 'f_f_i' glyph naming means that the Unicode presentation form ligature character will not be preserved in PDFs in which text strings are reconstructed from parsed glyph names; instead, Acrobat will parse the 'f_f_i' ligature glyph in the PDF as representing the alphabetic character sequence ffi. And I think that is a Good Thing.</p>
      <p>I suspect we might be talking about different kinds of legacy encodings here. I'm talking about mechanisms that used Unicode presentation form codepoints to represent common Latin ligatures. This is different from mechanisms such as Adobe's expert set PS Type 1 fonts, which used 8-bit encodings for ligatures. Such documents require character transform operations to be cleaned up and standardised as Unicode encoded text, but in that case my recommendation would always be that legacy encodings of a ligature surch as ffi should always be converted to the underlying alphabetic character sequence and never to the Unicode presentation form ligature codepoint.</p>
