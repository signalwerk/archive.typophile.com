    html: <p>The only reason to include both is if you want to not only correctly display legacy texts that use the Unicode presentation form codepoints to hard code ligatures but also want to preserve that encoding in PDFs with text reconstructed from parsed glyph names. Personally, I think you are doing users a favour if you <em>don't</em> do this, and instead let parsed glyph names map back to the letter sequence ffi, rather than to the presentation form codepoint. So my recommendation is to use the 'f_f_i' format name, but map that glyph to the Unicode presentation form.</p>
