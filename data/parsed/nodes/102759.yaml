      <p>John &amp; Theunis -- </p>
      <p>Kind of academic for me, since we only set books, which means new manuscripts &amp; no legacy issues. So when I have to work on fonts, I only anticipate Unicode.</p>
      <p>But if you are trying to provide for reading in ASCII files with a new typeface, wouldn't those files perforce use *names* from the Adobe Glyph list, with any somehow-progam-generated Unicode being the presentation form?</p>
      <p>In that case, liga should use the Unicode format, f_f_i, &amp; no number. That is, not map it to the presentation form. </p>
      <p>In fact, if I were doing this, I'd try to map any legacy characters (i.e., PostScript = 7-bit ASCII + fibs)  to the now-correct Unicode, so any new document would have the correct encoding.</p>
      <p>What's missed with this thinking?</p>
      <p>EDIT -- could one use {ccmp} to deconstruct legacy ligatures?</p>
