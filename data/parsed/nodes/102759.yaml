      <p>Charles, you are right. I <em>do</em> get text extracted from a PDF at times, and when it contains a single "ffi" glyph I see this as a separate glyph. It doesn't mean anything for the display of text, but text search fails when I search for "difficult"; and one of my side jobs involves re-purposing text for XML and ePub export.<br>
      In addition, I'd like my own PDFs as "clean" as possible – copying text out of it again should return plain text.<br>
      So when I encounter these glyphs, I find-and-change them to regular text.</p>
      <p>Of course this assumes that the software that is used to create is aware of the {liga} feature. Older software may not, and may rely on the presence of the actual Unicode /ffi glyph.</p>
      <p>The problem in <em>constructing</em> a font lies here: if one adds an OTF f_f_i glyph, you could map the same glyph to the assigned Unicode. That way you are sure that whatever the software does, it will result in the same glyph. However, it is also possible to assign another glyph to the Unicode position! This is "unaware" of the {liga} code and the associated glyph.</p>
      <p>I am working on a basic font creation program and was asked whether it should (a) allow the above anyway, as it is merely a question of interpretation and should be left to the font creator, (b) remove the few Unicodes for 'hardcoded' ligatures so the user can only create them through the {liga} feature, or (c) basically point (b) but <em>also</em> automatically add the ligatures as single Unicode glyphs.</p>
      <p>From a technical point of view I'd say (b), because the Unicode ligatures were actually a <em>very</em> bad idea – in my informed opinion :-) – and this effectively prohibits the user making bad mapping decisions.</p>
