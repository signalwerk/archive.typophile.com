      <p><em>could one use {ccmp} to deconstruct legacy ligatures?</em></p>
      <p>Deconstruct to what? Remember, OTL features affect only glyph display, not text encoding. There wouldn't be any point in decomposing a legacy ligature glyph to underlying alphabetic glyphs only to recompose to a ligature glyph, all the while preserving that legacy codepoint in the text string.</p>
