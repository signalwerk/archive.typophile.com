      <p>@Theunis:</p>
      <p><cite>From a technical point of view I'd say (b), because the Unicode ligatures were actually a very bad idea – in my informed opinion :-) – and this effectively prohibits the user making bad mapping decisions.</cite></p>
      <p>I agree completely. And we'll have Unicode around a lot longer than OpenType. The XML files, if they fulfill their intent, will be the electronic form of the archived document. Acid-free paper, please. </p>
      <p>"Legacy" issues should be resolved as quickly in that document's life as possible. When things stop being used, people forget what they mean, even if that meaning can still be checked. Who, for example, remembers EBCDIC -- one convention for high-order ASCII. Yes, I know presentation forms are different, but in this case, it seems to  me to amount to a kind of competing encoding, and that's bad.</p>
      <p>I'm sensitive that the needs of complex scripts go beyond ligaturing in Latin-based languages. I'm arguing that ligatures are different -- ligatures <cite>per se</cite> aren't desirable, just like the two-character logotypes (e.g., Vo) with the Linecaster weren't desirable. One's a property of a particular font -- why have ligatures in Palatino, for example, and one's a property of a particular manufacturing technology. Nothing to do with the language in either case.</p>
      <p>Edit:</p>
      <p>I just had a thought about</p>
      <blockquote><p> Older software may not, and may rely on the presence of the actual Unicode /ffi glyph.</p></blockquote>
      <p>Don't really think so. What software both used Unicode &amp; had non-OpenType ligaturing capabilities?</p>
