    <p>I am working on a large branding project for a worldwide brand and I have to select and recommend Arabic and Persian fonts.<br>
    There are obv. many iterations on Linotype, but would anybody be able to recommend tasteful/classical designs as I'm uncertain<br>
    which of those are deemed as tasteful Arabic fonts. I wouldn't want to go and select the Arabic version of Comic Sans or something.</p>
    <p>Thanks<br>
    Pete</p>
