      <p>If you can get in touch with Dr. Nadine Chahine at Linotype she can advise you quite expertly. But Rosetta's stuff is definitely a strong option too. I'll alert both of them to this thread and they can duke it out.  :-&gt;</p>
      <p>BTW there are in fact differences in taste between Arabs and Iranians when it comes to type. Also note that two of their numerals are different (although one of those is only mildly so). At least for any large/display type you should seriously consider diverging your design. Not least because they don't like being mistaken for one-another...</p>
      <p>Wow, I just had [another] great idea. Too good to reveal yet.</p>
      <p>hhp</p>
