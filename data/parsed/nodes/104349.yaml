      <p>Well, what should I add. Thanks for the recommendations of Rosetta fonts. You have essentially three options:</p>
      <p><a href="http://rosettatype.com/Nassim" rel="nofollow">Nassim</a> which is currently most know for being used by BBC Arabic/Persian/Urdu/Pashto in language-specific design versions, probably most classic from the lot.</p>
      <p><a href="http://rosettatype.com/Aisha" rel="nofollow">Aisha</a> which is more playful, but still solid Arabic typeface in Maghribi style.</p>
      <p><a href="http://rosettatype.com/Eskorte" rel="nofollow">Eskorte</a> which is an excellent design, softer, but still serious. And the accompanying Latin is proper Pro font with small caps and other typographic extras.</p>
      <p>Nassim and Aisha are by Titus Nemeth, Eskorte is by Elena Schneider, but it was developed with Titus’ consultancy. These are high-quality OpenType fonts and available as webfonts.</p>
      <p>If you have more questions, do not hesitate and get in touch via email <a href="mailto:david@rosettatype.com">david@rosettatype.com</a> .</p>
