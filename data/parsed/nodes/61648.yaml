    html: |-
      <p>i assume you are dealing with a specific person<br>
      at the video-game company, or as go-between.</p>
      <p>be frank with this person, but also understand<br>
      that this is a negotiation, not an interchange<br>
      among "friends", and that both sides desire<br>
      to have a fair and equitable deal done here...</p>
      <p>state your desire to "do a great job for you",<br>
      especially as "it will be seen by lots of people";<br>
      express reservations that the amount of time<br>
      you would ideally like to spend can't be offset<br>
      by leveraging the product to other customers,<br>
      as the video-game company gets it exclusively.</p>
      <p>here's where the frankness comes into play.<br>
      ask your contact, directly and forthrightly,<br>
      how much they've budgeted for your work.</p>
      <p>you can add that this will give you an idea of<br>
      how much time you can devote to the project.</p>
      <p>your contact will probably give you a range...<br>
      this should make your decision much easier.</p>
      <p>if your contact wants you to go first, do this:<br>
      "you have 2 million customers; at a dime each<br>
      for my work, that would work out to $200,000.<br>
      or -- at a penny a piece -- it would be $20,000."</p>
      <p>you can even bring up the idea of payment based<br>
      on royalties, such as a penny for every game sold.</p>
      <p>your contact will never go for this type of deal --<br>
      because they want to avoid the messy accounting,<br>
      and they want blockbuster profits to stay internal.</p>
      <p>but taking this tack will motivate your contact to<br>
      produce the range they have budgeted for you...</p>
      <p>don't be afraid to take the top end of the range.</p>
      <p>but it's perfectly ok to take the middle part of it,<br>
      if it seems like it will be a generous enough offer...<br>
      (it's much better to underpromise and overdeliver.)</p>
      <p>you can also give the client some choice-points;<br>
      they can get the mid-range of their budget for<br>
      the basics, or pay extra for more of your time...<br>
      (a company rolling in cash will want your best.)</p>
      <p>in the event the range you are given is too low,<br>
      don't be afraid to say it, and stand your ground.</p>
      <p>even if the price is great, don't let them get the<br>
      impression that they have offered you too much.</p>
      <p>"that's a little bit lower than i had in mind, but<br>
      i guess we can make it work..." is a good line...</p>
      <p>remember, it _is_ a negotiation, and they don't<br>
      want to feel that they have paid you too much.<br>
      (companies rolling in cash are sensitive to that.)</p>
      <p>in this vein, if you hear your contact saying,<br>
      "that's a little bit higher than we had in mind,<br>
      but i guess we can make it work", you'll know<br>
      that you've done this little dance successfully.</p>
      <p>(and if your contact is experienced at doing this,<br>
      that is the line they will use to signal you that.)</p>
      <p>whatever you settle on, once you've agreed to it,<br>
      you must put on a good face and do a good job.</p>
      <p>you'll probably end up spending more time than<br>
      you anticipated -- pretty much a fact of life --<br>
      but a deal is a deal and you'll need to stick to it.</p>
      <p>(at the same time, don't let 'em extend the work<br>
      unless they're also willing to extend the budget!)</p>
      <p>enjoy the work, and then enjoy seeing your work<br>
      all over the world, and do congratulate yourself!</p>
      <p>let us know how it goes...</p>
      <p>-bowerbird</p>
