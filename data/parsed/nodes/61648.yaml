    html: <p>Hire a lawyer to advise you on the negotiations. Do not do this on your own. Your client will have access to legal counsel. You should make sure you are similarly assisted. Find someone who has worked in the type licensing world so they can advise you on what are the customary price ranges for these sorts of licenses. Do not do this on your own. This is all about managing and protecting intellectual property. Make sure you manage and protect it.</p>
