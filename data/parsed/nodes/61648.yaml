      <p>I guess I gtt  what you're saying but it still doesn't make much sense to me to quote a price that way. Fonts are (in my experience) commissioned to be used as tools. Tools to make headlines or hey, even art. Maybe some of them could be vanity pieces but I've never seen it. You brought up art but I'm specifically talking about font design: I don't know anything about art pricing.</p>
      <p>I think clients deserve something better than a quote based on gut instinct about how I "feel" about the use of a font. I think it's unprofessional and similar to market vendors who size up their customers wallets and making up a price. That's what you can be if you like. If you're asking "what's your budget for this project?" you're no better than a weasley used car dealer, in my mind anyway. Yeah,k I'm judgmental about that kind of thing. If a store has no price tags, I'm out of there.</p>
      <p>I price separate aspects of the job: work and licensing. When I sell fonts through a vendor, I don't charge more based on "far reaching" or artistic. A customer might be using it for a dog food label, album cover or a lost dog poster. I charge based on the number of users, just like MyFonts.com and other vendors. It's consistent and to me, consistent pricing is fair. If the fonts are going to be included with software or whatever, there's a custom contract involved and a system to deal with that. Often the licensing cost is higher than the work cost.</p>
      <p>Licensing and work: two different things. Licensing doesn't affect the work cost.</p>
      <p>Work is worth $X.<br>
      Licensing the font is worth $Y<br>
      If lawyers have to get involved in licensing details then of course, that has to be taken into consideration.</p>
      <p>I charge the client $X+$Y</p>
      <p>There is a "giant mega-company" extra charge but I'll get to that later. It has nothing to do with how deep their pockets are.</p>
      <p>If the work is non-exclusive and it's only going to be used by 1-5 users, the extra charge for licensing is around the standard retail price. So for a single font for a single user, the licensing aspect might only crank up the cost by $20. Most clients want a site license for a custom font, so I adjust the licensing cost. If they're going to include it with software, they want to sell it, I factor that into the licensing cost.</p>
      <p>I don't think this model would work for exclusive fonts, but I wouldn't know as I don't do exclusives.</p>
      <p>"well, that indicates to me that you would charge the exact same to a cash-poor client as you charged a client with deep pockets. it’s ok with me if you do that."</p>
      <p>Well, I would hope so. When a rich guy walks shops at Wal-Mart, they don't charge more. If Bill Gates wants to commission a font for a lost dog poster, I'm not going to charge him more. If you don't keep those costs separate, work and licencing, at least in your own mind when you're quoting, then you're not being professional, or ethical. It's a simplistic model; I'm sure other people have much more elaborate pricing systems. But, at the very least, the very least keep those two aspects separate.</p>
      <p>But there is something to charging more for larger companies. The bigger they are, the longer they take to pay. Small-medium company: you get your check the next week. Big company: add 6 months at least. They also require reams of paperwork. You invoice, they want a work order. Then they want an invoice again. Then they want tax forms and it goes on and on. So, you can work for days just on the paperwork. With small companies it's usually just an invoice and check sent within a week of job completion. But this type of charge should be reasonable. It's not thousands of dollars of inconvenience to have to sign a ton of forms and wait for a check. Hundreds, sure but not thousands.</p>
