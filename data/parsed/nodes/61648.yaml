    html: |-
      <p>I find that type of job is the most difficult to price. If I'm working on a font I get to keep/sell after the job is done, I charge less, about a fifth of the exclusive price. If it ends up being more work that I expected, I don't feel ripped off because I can make if back in the following decades of font sales.</p>
      <p>But these jobs where I don't get to keep the font afterward, I'm just clocking in hours. Of course, no client is ever satisfied compensating for hours; they want a number up front. The time on a font can vary so much so it's really tough to do a proper estimate from the initial description. The solution that's worked well for me for non-exclusive or fonts the client owns is to offer free test work. I give a really vague price range just to see if they're expectations are reasonable. I explain that there's no obligation to pay for the test font. If it's non exclusive, it's still mine and if it's not then it's not my problem. Be clear about that in your negotiations.</p>
      <p>The test font: It depends on the job but in general, I create a few letters, let the client test it on their equipment, do some test hinting, kerning on those letters, weight tests etc. If they bail out at that point, you've lost hour of two of work and there should be no hard feelings. I've done about 80 custom font jobs over the last decade and nobody's ever bailed out on me. Okay, one guy. I could have spent those hours negotiating the price, working on contracts, sending emails back and forth and it would have been time wasted anyway. I prefer to spend my time in FontLab instead of on the phone or Gmail.</p>
      <p>By the time I've gone back and forth and have a working test font, I have a very clear idea of how much work is involved in the project and I can give them a proper price quote. I don't need to crank it up to allow for overruns. I can make a fair price. How much they've budgeted for their work or how deep their pockets appear to be shouldn't matter. Work is work: if you crank up the price based on what the client seems to be willing to pay . . . then I don't like you. I get paid what I'm worth. If it's too steep, they can try someone else. A lawyer? How annoying for the client. How annoying for me. How nice for the lawyers. I just set my price, set my terms and do the work and get paid. Maybe some of you think that's a naive way to do business but it works. Apart from the rights to the font (a separate matter) there's never been a need for me to use a lawyer. My client is a customer. Unless they've actually violated an agreement, there's no need to go down that road.</p>
      <p>Maybe some people have had bad experiences with clients but I've never had a problem  . . . except that one guy. I get the final quote to the client within days, not weeks, I get the job done and money in my account. The test font allows the client to do some early testing and in some cases it can vastly change the scope of the project. Clients often think they know what they need and find out later that they need something different. It happens a lot, actually. </p>
      <p>Once in a while, a job goes a bit longer than I had anticipated. Sometimes, shorter. Time spent on fonts is time spent building my skills/speed, not time wasted. A few times I've asked a client for more because the scope of a job changed and they've always agreed.</p>
      <p>That's my angle anyway and my experience with it has been very good. 10 years, and about 80 jobs.</p>
