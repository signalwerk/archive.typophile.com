    <p>Hi Everybody:</p>
    <p>I got some great advice to post this question on the forum...so here goes:</p>
    <p>I apologize for being vague, but I have to. I have a client that has approached me to expand a font I had done some work on awhile back. Currently, the basic glyphs are being used but this font needs to be expanded to include a full character set including diacritics, loads of clean up, lots of hinting and so on so that it can be used in a video game. It's a well-known video game with multiple iterations.</p>
    <p>To say the least I am excited to take on the project but I need to provide a price...this is where I am concerned. I want to price it fairly but I do not want to 'give it away' given that this is a well known brand and very well known video game.</p>
    <p>I am not looking to retain rights to the font.</p>
    <p>Does anyone have any ideas as what my mindset needs to be, hoe I should be thinking about pricing this?</p>
    <p>Thoughts?</p>
