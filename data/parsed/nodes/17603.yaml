    html: |-
      <p>Josh, with all due respect, you may not be designing the book from scratch, but you should still be concerned with the content, IMHO.</p>
      <p>In addition to Maxim’s and William’s suggestions, I would add that, according to Robert Bringhurst’s <em>The Elements of Typographic Style</em>, French hyphenation is different (at least sometimes) from English hyphenation. Perhaps there are French hyphenation dictionaries or plug-ins for the program you will be using to lay out the text.</p>
      <p>Also, if I am not mistaken, the text on the spine of French books traditionally runs from the bottom up rather than from the top down.</p>
