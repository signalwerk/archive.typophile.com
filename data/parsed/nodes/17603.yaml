    html: |-
      <p>The biggest thing you will need to address is the hyphenation but I’m not sure how to deal with that - I have traditionally been concerned with the other way around (translations into English).</p>
      <p>I agree with Ricardo that you do have to pay attention to the content but your wife should be able to help with that.</p>
      <p>The french also use different symbols for dialogue but I assume that will be in the manuscript and not something you will need to format. Also, I find a lot of french publishers don’t indent paragraphs, but I think that’s weird. I have also learned that European book design to a large extent is far plainer and less decorative than American. I have no idea why this is or why it should be.</p>
