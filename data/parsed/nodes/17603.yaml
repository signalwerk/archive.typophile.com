  html: |-
    <p>I have been approached to layout a book in French and I was wondering if there is anything special I should think about before I accept or decline the project. My wife speaks french and was the editor of the english version of the book in question. She will be helping me if I accept the project. What should I know about layout in French that differs from what I know about laying out a book in English?</p>
    <p>Thanks.</p>
