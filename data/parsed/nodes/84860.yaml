  html: |-
    <p>Hi, I am a web designer, and not very good with fonts.</p>
    <p>We are using typekit.com to render our fonts online. I need to use Corbel for a project, but they do not have it. I need the font for numbers, and the way they have set up their search would be painful for find something similar, basically I have to go font by font.</p>
    <p>I was wonder if you experts could help me identify other fonts that have similar numbers look, so I can search by name.</p>
    <p>Thanks, I am attaching a picture of Corbel font.</p>
    <p>- JC</p>
