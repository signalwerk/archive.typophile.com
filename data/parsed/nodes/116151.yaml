  html: <p>Hey guys! I'm currently working on some collateral material for a brand I've created. I'm looking for a serif style font that has variations in their baselines for its numericals. Fonts in the vein of <a class="freelinking external" href="http://www.myfonts.com/fonts/tilde/poster-bodoni" rel="nofollow">Poster Bodoni</a> or <a class="freelinking external" href="http://www.myfonts.com/fonts/dootype/encorpada-classic" rel="nofollow">Encorpada Classic</a> are what I've been playing with. Thanks for any suggestions!</p>
  html_clean: <p>Hey guys! I'm currently working on some collateral material for a brand I've created. I'm looking for a serif style font that has variations in their baselines for its numericals. Fonts in the vein of <a class="freelinking external link-external" href="http://www.myfonts.com/fonts/tilde/poster-bodoni" rel="nofollow">Poster Bodoni</a> or <a class="freelinking external link-external" href="http://www.myfonts.com/fonts/dootype/encorpada-classic" rel="nofollow">Encorpada Classic</a> are what I've been playing with. Thanks for any suggestions!</p>
