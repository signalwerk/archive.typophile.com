    html: |-
      <p>The type of numerals you're after are called "old style figures" or "ranging figures" or (more rarely, but quite suitably) "text figures". They were unpopular for about a century (after being the standard style for text cuts of typefaces for the previous four centuries or so), but have recently had a significant resurgence – just about any professional serif face designed in the past decade (and quite a few in the preceding ones) will have them somewhere, and quite a few will have them as standard.</p>
      <p>That said, the high-contrast style you've been looking at (the "didones" or "moderns" originally appearing in the nineteenth century) feature old style numerals more rarely than most – mainly because that's precisely when they went out of fashion, so the original fonts now revived often didn't have them. Here's some that MyFonts throws up for a search for didone+old-style numerals:</p>
      <p><a href="http://www.myfonts.com/search/tag%3Adidone+tag%3A%22old-style+numerals%22/fonts/" title="http://www.myfonts.com/search/tag%3Adidone+tag%3A%22old-style+numerals%22/fonts/">http://www.myfonts.com/search/tag%3Adidone+tag%3A%22old-style+numerals%2...</a></p>
