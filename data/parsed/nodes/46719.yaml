    html: |-
      <p>So far the only italic I found with an 'n' like this is <a class="freelinking external" href="http://www.myfonts.com/fonts/ef/edwardian/" rel="nofollow">Edwardian</a>, but if you look at the other letters many of them do not match. I think Disney has used certain typefaces as starting points, but customizes them to suit their readability needs. Perhaps all they did was borrow the idea of the Edwardian n (although the C matches pretty well too).</p>
      <p>- Mike Yanega</p>
