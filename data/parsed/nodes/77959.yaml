    html: |-
      <p>I would also like to know what the actual usage is. I personally use the thin space (I use the LaTeX <code>babel</code> package with the <code>french</code> option and it is automatically put where needed, and sometimes where not needed) and I feel it is lacking when I read documents without it, but it is definitely a matter of taste.</p>
      <p>The way the Office puts it: "Si l’on dispose de l'espace fine, il est toutefois conseillé de l'utiliser devant le point-virgule, le point d'exclamation et le point d'interrogation" <em>i.e.</em> if you have access to a thin space, it is advised to use it in front of the semicolon, the exclamation mark and the interrogation mark. Now, who follows the advice? The 2010 French General Income Tax and Benefit Guide from Canada Revenue does not use it. Nor does the guide from Revenu Québec. Many <a href="http://www.etudes.umontreal.ca/programme/caract_prog/index.html" rel="nofollow">pdf documents describing programs on my own campus</a> (Université de Montréal) do not use it either. It would probably be ill advised to state that those that edited those documents were all mistaken. </p>
      <p>As for the colon, a full space seems to be the standard; its use is advised by both the French imprimerie nationale and the Quebec Office de la langue française. The LaTeX babel package however provides the option <code>\frenchbsetup{ThinColonSpace=true}</code> that allows the user to opt for a thin space instead of a full space when the selected language is French (you can switch between languages as you like). Who asked for it, I don't know, but if it is there, someone must use it.</p>
