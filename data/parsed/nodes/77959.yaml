    <p>Hi,<br>
    I recently started doing bilingual graphic design and am being faced with the trouble of typesetting in French. I feel I need to know more about the rules of French typesetting.<br>
    Anyone know of a good book I could buy or an online resource to get me started?<br>
    Thanks in advance for your help<br>
    Jenna</p>
