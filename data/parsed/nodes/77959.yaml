      <p>Interesting links, Michel. Always revealing to compare and contrast a French and English version of the same document.</p>
      <p>I have always used no space before exclamation mark in FRC, and I still believe this is correct – in contrast to FRF where a thin space is always used. It's interesting that your link to Québec's La Banque de dépannage linguistique says that either is acceptable: "Pas d'espacement ou une espace fine" (No space <em>or</em> thin space).</p>
      <p>So perhaps it's less of a firm rule, more a matter of taste?</p>
      <p>It would be interesting to hear any further opinions on which is preferable, especially from French Canadian typesetters or designers...</p>
