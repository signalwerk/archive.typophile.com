    html: |-
      <p>Are you doing French for France, Canada or somewhere else? I ask as there are differences in the typographic conventions. </p>
      <p>For instance, both FRF (for France) and FRC (for Canada) use a thin space between a quote mark and the text being quoted. FRF also uses a thin space before an exclamation mark, but FRC generally doesn't.</p>
      <p>So, for instance,</p>
      <p>ENG: He said: "No!"<br>
      FRF: Il a dit : « Non ! »<br>
      FRC: Il a dit : « Non! »</p>
      <p>(note: thin spaces are the prefered option for these "extra" spaces around punctuation and very easy to do in InDesign, etc. If you can't do a thin space, use a non-breaking space.)</p>
      <p>I'm hoping to put a resource on my work <a class="freelinking external" href="http://www.worldaccent.com/french/typesetting/" rel="nofollow">French typesetting</a> page soon. But if you are typesetting Canadian French, there is an excellent comprehensive PDF (in English) available to <a class="freelinking external" href="http://cprp.ca/pdf/langue/Guide_1_0_eng.pdf" rel="nofollow">download here</a>.</p>
      <p>Let me know which area of the world you're targeting and I'll try to offer some more advice.</p>
      <p>By the way, Felici's book (mentioned above) is a great read, I think.</p>
