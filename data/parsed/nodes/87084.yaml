    <p>I really curious how to copy text from illustrator CS5 to indesign CS5 maintaining text formatting. I usually layout first in illustrator then paste objects into indesign for press. But I can't maintain text formatting in indesign when copying. Pls advise any idea to solve the issue. Many Thanks!!!!!!!</p>
