    <p>Hey there,</p>
    <p>I’m working on an id for a service co that helps retailers expand. They’d like a high end look..see themselves as “premium, strategic, operational experts, using new approaches to take businesses to new levels.” They’d like to appeal to retailers. possibly show movement or arrow. </p>
    <p>So far I’ve used tarzana wide lowercase (love the a) with star above made using 3 lines, diff shades. a modern look with the movement in the mark rather than the face.</p>
    <p>Also used Mrs. Eaves all uppercase (+ arrow in oval) for classic approach. (is this font outdated?)</p>
    <p>fonts that come to mind given the brief would be much appreciated! </p>
    <p>(also would love a sans serif suggestion..I have overused engravers gothic but love it.  love verlag (also like luxury) but expensive.)</p>
    <p>thanks for the help in advance.</p>
