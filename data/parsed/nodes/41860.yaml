      <p>At this stage, you probably need to be thinking in a more holistic way of a visual identity, rather just a typeface. Once you have some sort of broader brand idea a lot of these decisions - choice of typeface, colour etc. become easier and more focussed.</p>
      <p>Btw if you need a typeface that cues luxury, <a class="freelinking-external" href="http://www.houseind.com/index.php?page=showfont&amp;id=536&amp;subpage=viewfonts">this</a> could be a place to look.</p>
