    html: |-
      <p>The key to the luxury look is that you can afford to waste space.<br>
      That may be why faces that are markedly condensed or expanded look upscale, because they force one to space them out (copious letterspacing and/or leading) and use them large so that they don’t look crammed or fill in.</p>
      <p>Faces with a small x-height, like Mrs Eaves, look upscale because they too are not designed to cram in as much text as possible; book face proportions for a leisurely read.</p>
      <p>Albertus and Optima are elite because they’re not your common or garden sans or serif.</p>
