      <p>“do you have opinion on the faces?”</p>
      <p>Both Tarzana and Mrs Eaves are very expressive typefaces, but they also express very different things (Which was why I thought you’re probably starting at the wrong end).  </p>
      <p>I don’t know if Mrs Eaves is outdated, I live some distance away from the world of typographic fashion :). But if it’s appropriate for the story you’re trying to tell, that shouldn’t be a concern. With brand identity, it can’t be driven too much by what’s hot this season.</p>
      <p>(Btw. You may want to post what you have done so far. People find it easier to respond to a specific piece of work.)</p>
