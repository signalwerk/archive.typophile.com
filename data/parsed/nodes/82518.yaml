    html: |-
      <p>Awesome! That's seriously elegant. It already looks pretty refined to me, but I'd like to share some ideas. Cool to see some Dutch words in there ;-)</p>
      <p>The style of w and W, might be a personal or historical thing, but it tends to become a little dark (even in such a light typeface) and distracting. I'm not saying you should change it, but at least try a different structure if you haven't already tried that.</p>
      <p>The style of k and K looks a bit out of place to me and I'd make one of the diagonals thicker.</p>
      <p>Perhaps s and S should have one or two terminals thickened as in the c?</p>
      <p>The g looks a bit too geometrical to me. It seems to lack part of the elegance. Definitely stick with a double storey g though!</p>
      <p>I think your M needs rethinking. I prefer the middle part to almost reach the baseline and the side parts to be more vertical.</p>
      <p>The proportions of your capitals are much different from the usual humanistic proportions. I'm not sure it looks 'wrong', but I'd like to see what it looks like with more humanistic proportions, e.g. much wider D, H, N, U, T, narrower K, wider E and F.</p>
      <p>Keep going! I'm looking forward to updates on this one!</p>
    html_clean: |-
