      <p>Wow, this is deliciously beautiful Frode. Congratulations on such a graceful design. I like the way you've mixed wide and narrow proportions. </p>
      <p>To me the M sticks out, it's rather narrow — I think I'd try bringing the centre vertex to the baseline but keep all the angles the same. The W may look a bit narrow too.</p>
      <p>Head of ampersand seems to be nodding to the right.</p>
      <p>Q: longer crossbar?</p>
      <p>K/k: try a branched structure?</p>
      <p>Numerals are splendid.</p>
      <p>£: I think I'd go for a slanted stem in the roman, for this style of typeface, more elegant, the current one looks a little stiff.</p>
      <p>Italic /ae/ may be too much like /oe/?</p>
      <p>Wonderful. Are you thinking about any other weights?</p>
