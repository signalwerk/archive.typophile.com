    html: |-
      <p>Hi Frank! Don’t worry, I’m not! I actually just got a (somewhat angry) mail from them. What do you guys think about that? The selection of ultralight stressed sans serifs is rather slim, and I wasn’t aware of Sangbleu Sans until very late in the process. If this was a regular weight grotesque or humanist I don’t think anyone would worry about being to close to something else. None of my shapes were inspired by Sangbleu — in fact this started out as more of a "fixing Fashion Thin" thing. I drew inspiration from Futura (rythm) and Neutraface (lowercase), Optima and Peignot (stress) and a bunch of concepts I’ve been wanting to explore that people said you shouldn’t, particulary retaining the geometry in the cursive.</p>
      <p>Hope the US is treating you well, btw!</p>
