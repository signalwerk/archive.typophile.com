      <p>PS. The Safari rendering in that comparison is using the ‘medium’ subpixel rendering setting that Apple recommend for LCD screens. It looks like crap, and the Safari rendering is better in ‘light’ mode or even in greyscale mode as recommended for CRT screens.</p>
