      <p>@John Hudson</p>
      <p><em>Adobe make their OpenType FDK code available for free</em><br>
      If I'm out to lunch, it certainly won't be the first or last time. The impression I got was that there were tools outside of the FDK. I'm going to ask the person I got the info from if I've got this right. Probably not if you don't think so. Thanks. I'll check.</p>
      <p><em>The learning curve seems to me to be as high as the software demands, and isn’t some kind of artificial construct.</em><br>
      Look, you and Ross can probably navigate around in VTT like it was Windows Notepad. But that's a result of years of working with it. There was a lot of trial and error, I'm sure, that you dimly remember if at all.<br>
      I could be out to lunch on this, too, but I suspect you may be too close to it to fairly judge. Once you lose those newbie eyes, that's that. It's really hard to take a fresh look.<br>
      When it first appeared I paid special attention to this:<br>
      <a href="http://blogs.adobe.com/typblography/MinionPro_DF3vsDF4embedding/" title="http://blogs.adobe.com/typblography/MinionPro_DF3vsDF4embedding/">http://blogs.adobe.com/typblography/MinionPro_DF3vsDF4embedding/</a><br>
      It's an Adobe Flex app put together by Miguel Sousa in conjuction with a post about text rendering in the new NYTimes Reader.<br>
      <a href="http://blogs.adobe.com/typblography/2009/05/times_reader_2.html" title="http://blogs.adobe.com/typblography/2009/05/times_reader_2.html">http://blogs.adobe.com/typblography/2009/05/times_reader_2.html</a><br>
      This seemed like the basis for one heckuva lot friendlier interface for hinting than I'm seeing in VTT.<br>
      Anyway, you don't need to be a forensic scientist to spot the cobwebs on the Microsoft Typography site or to notice that WEFT hasn't been updated since 2003 (with no talk of doing so, either - I guess the ball is in Ascender's court now).<br>
      And the stark difference in rendering between Mac and Windows - at least at larger text sizes - is an embarassment, really. I just get the overall impression that the attitude towards font-creation tools and documentation has been that they're good enough and there's no great need to make them appreciably more accessible to the average type designer, let alone the average would-be type designer.<br>
      I understand that the market for such tools is limited. This isn't ASP.NET. But I think MSFT gets enough competitive advantage out of its investment in fonts to expect more. I'm sure sii wouldn't complain if his department's budget were to expand.<br>
      BTW - I <strong>do</strong> think @font-face will create a great desire for educational materials aimed at those without formal training in design.<br>
      Being able to use fonts in web pages will really be a huge change. Hard to predict what's going to happen when you can design a font and get an instant worldwide viewing.<br>
      Look at Flickr and photography, YouTube and video, Google Blogger and bullshit.</p>
      <p>@dberlow<br>
      <em>Time alone?</em><br>
      You saw my invisible subtext, did you?<br>
      No, I don't think so. I'm all ears as to any suggestions.</p>
      <p>rich</p>
