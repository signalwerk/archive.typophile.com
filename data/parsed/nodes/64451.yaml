    html: |-
      <p>I can confirm that build demonstrated at PDC is doing sub-pixel layout and positioning. If you look at the video, you can see smooth scaling and tracking which would not be possible otherwise.</p>
      <p>IE8 used high-resolution layout, but it did not affect text where glyphs always had integral pixel width. Using Dwrite for rendering only in this case would remove jagginess, but would not improve spacing. It requires real sub-pixel text layout to make it work.</p>
      <p>Regarding ways to switch rendering modes, this is not determined yet. There are different factors to take into account: technology available on client machine, user preferences, backward compatibility of page layout. At least my opinion is that rendering mode should not be exposed to web designer to control.</p>
      <p>Thanks,<br>
      Sergey</p>
