    html: |-
      <p>&gt; MS was somehow ‘keeping’ VTT difficult to learn</p>
      <p>I agree that this is absolutely not true. Since Y's highest quality is achievable without it, VTT is essentially for X. X hints being rarely if ever interpreted (to a useful result for text), MS could easily be said to have helped make VTT extremely easy to learn. The Mac doesn't need VTT's capabilities at all, and windows has too many behaviors. So, VTT is no longer an expert's choice for web font development. That leaves the 'high end TT hinting" Thomas refers to, which has, most unfortunately, become uncoupled from web font quality, where they once were 'one'.</p>
      <p>Cheers!</p>
