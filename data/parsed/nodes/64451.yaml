      <p>Richard:</p>
      <p><cite>The impression I got was that there were tools outside of the FDK.</cite></p>
      <p>There aren't "tools" in the sense of applications or the like. There's a motley collection of Python scripts. Some of those, many of the key ones, are already in the FDK. Basically Adobe is licensing for free all its most valuable code related to making fonts. Besides the code used to actually compile OpenType features and OT-CFF fonts, there's the CompareFamily tool, the Adobe auto-hinter and the obscure-yet-powerful TX conversion tool. Adobe's licensing its crown jewels of font development for free. There's certainly no attempt or desire to keep anything of great consequence proprietary.</p>
      <p>Cheers,</p>
      <p>T</p>
