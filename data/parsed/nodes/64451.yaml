      <p>It is not the OS making all decisions. Users already tuned ClearType to their eyes, DWrite applied its rasterization algorithms, IE chooses to use different layout parameters depending on font/size/scenario, font designer expressed his intent in hinting. </p>
      <p>What kind of control page author do you think should have? Will this control available for every page be better than user settings applied to whole Web inside your browser?</p>
      <p>Unfortunately, I can't give you build of IE using DWrite to play with right now. FireFox is experimenting with DWrite to, although I did not see any, even experimental, build available publicly. You can check out few FireFox screenshots at <a href="http://blog.mozilla.com/nattokirai/2009/10/22/better-postscript-cff-font-rendering-with-directwrite/" title="http://blog.mozilla.com/nattokirai/2009/10/22/better-postscript-cff-font-rendering-with-directwrite/">http://blog.mozilla.com/nattokirai/2009/10/22/better-postscript-cff-font...</a>.</p>
      <p>Thanks,<br>
      Sergey</p>
