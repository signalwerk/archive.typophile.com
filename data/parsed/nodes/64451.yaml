      <p>@Richard:</p>
      <p>The need for expert help to do high end TT hinting isn't going away any time soon. With some investment, TT autohinting could be significantly improved, raising the baseline and reducing the relative advantage of manual high-end hinting (with tools like VTT). The other thing that can be done is to develop auto-hint assistance that feeds into the manual tools, reducing the amount of expert work required to get to the best results. I've heard of multiple folks investigating or doing both approaches, but so far it's all proprietary (in the stricter sense of tools not being available to the public, not just that they're not open source).</p>
      <p>Cheers,</p>
      <p>T</p>
