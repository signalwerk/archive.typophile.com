    html: <p>Rich, I never said that VTT was easy to learn, only that a) the learning curve is commensurate with the complexity of the software and the job that it does and b) it is less steep than learning to hint at the actual instruction level or even in the TypeManTalk language that preceded VTT. Your comments implied that MS was somehow ‘keeping’ VTT difficult to learn, suggesting that it could be easier. I don't think VTT could be much easier than it is, and if you want something easier then use a less complex (and less powerful) tool such as FontLab Studio, which is adequate for a lot of jobs.</p>
