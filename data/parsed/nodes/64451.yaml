      <p>So, sub-pixel positioning used on text means the the image of the glyph changes from position to position among the text, for "better spacing". Adobe does this in text rendering and it works 'perfectly well" for print preview on screens in zoomable apps. </p>
      <p>sergeym &gt;I mean sub-pixel positioning of glyphs, which is not available in GDI.</p>
