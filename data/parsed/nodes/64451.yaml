      <p><cite>Sergey, can you explain how IE8 is rendering CFF fonts? Obviously it isn’t using the same Windows PS rasteriser as Firefox, but nor is it using the WPF renderer. It appears to be applying subpixel rendering (CT?) in the x-direction, but no y-direction antialiasing.</cite></p>
      <p>Interesting. IE8 is using only GDI for text rendering. I have to look at this closer to understand what the differences are between us and FireFox. And I’ll prepare few screenshots showing DWrite in IE9, to show sub-pixel rendering of TrueType and CFF fonts.</p>
      <p><cite>Based on the video presentation on Channel 9, I’m led to believe that DirectWrite will respect the current behavior of fonts - such as line breaks, word spacing, etc...<br>
      True? Not counting the inevitable edge cases - will it be essentially backwards compatible? Dare I say “seamlessly” so?</cite></p>
      <p>I am not ready now to talk about compatibility story in relation to DWrite. The best answer I can give you is that we are aware of this issue and looking at it. At least there is an ability in Dwrite to use glyph metrics compatible with GDI. There are other aspects other than compatibility, e.g. transforms, animations, SVG, that make using subpixel positioning the best option.</p>
      <p>Thanks,<br>
      Sergey</p>
