      <p>sergeym wrote:</p>
      <p><cite>GDI is not capable doing sub-pixel in any Windows version. You need WPF or Avalon to render sub-pixel.</cite></p>
      <p>That's not true at all. All versions of Windows from Windows XP on fully support subpixel rendering of TrueType fonts via native GDI.</p>
      <p>Here's the relevant MSDN documentation page for the GDI function <a href="http://msdn.microsoft.com/en-us/library/dd183499%28VS.85%29.aspx" rel="nofollow">CreateFont</a>. Note the <cite>CLEARTYPE_QUALITY</cite> parameter, which was introduced with Windows XP.</p>
      <p>If ClearType weren't supported by GDI, almost nothing on your screen would be able to use it.</p>
