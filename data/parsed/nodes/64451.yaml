      <p>Two things there:</p>
      <p>@DaveB: DirectWrite is continuing to use WPF rendering. Microsoft can't just take GDI away, but they can encourage people to use something better, which is what they're doing. Of course, they could also improve GDI, which they seem to be less interested in, beyond turning (an earlier version of) ClearType on by default.</p>
      <p>@James: I think Microsoft believes that most fonts look better under DirectWrite than under GDI. For OpenType CFF, that's certainly true. I don't think anybody needs to pay experts to make fonts look good under DirectWrite... only if the foundry wants to really maximize the potential rendering quality. But that has always required expert help.</p>
      <p>Cheers,</p>
