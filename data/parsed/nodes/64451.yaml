      <p>sergeym &gt;what control [should the] web developer have over rasterization parameters. And I said none, </p>
      <p>I guess, this is what is at the heart of my request for the quest for a typographic media query in CSS. </p>
      <p>If a web developer could: either have control via query over the OS's rasterization parameters and only in the browser set them to the web publisher's desires, or use a media query to deliver font software sensitive to the apparent preferences of the user, or some combination of each — some web design would flourish. </p>
      <p>Then "all we'd have to deal with" are the multitude of web developer's size and style habits for type, and the fact that the users defaults should never be confused with their true preferences.;)</p>
      <p>But I grant that just saying "No", is easier on everyone but the user. </p>
      <p>JH&gt;I don’t mind the multiplicity so much as I mind the lack of documentation.</p>
      <p>And even if you have "documentation", well, see MS white paper on CT. We're perfectly free to do anything we want except the right thing. Give it time, you'll mind the multiplicity. Perhaps even enough to someday want variation technology on the client side. </p>
      <p>end part I</p>
