    <p>I can tell the font has that glyph, but I have no idea how to use it.</p>
    <p>There’s no keyboard shortcut, and copying and pasting either from the character map in FontExplorer or the web just results in a ?. I’ve tried PopCharX, but it doesn’t even show up in the character map there. </p>
    <p>Quark Xpress 7 is supposed to have a glyphs palette (like Indesign has had for years now), but until then how do I get to this character?</p>
