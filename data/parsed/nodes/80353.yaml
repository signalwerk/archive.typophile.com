    <p><strong> <a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12013" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Conferences</a>&nbsp;: Ampersand&nbsp;Conference</strong></p>
    <p>Ampersand is a conference specifically focussing on web typography. It is held in the Brighton, <span class="caps">UK</span> and organised by Clearleft, a web design consultancy based in&nbsp;Brighton.</p>
    <p>Ampersand is billed&nbsp;as:</p>
    <blockquote><p>An affordable one-day event for knowledgable web designers <span class="amp">&amp;</span> type&nbsp;enthusiasts.</p></blockquote>
    <p>The inaugural event will be held on Friday June 17th in the Brighton Dome Corn Exchange, Brighton, <span class="caps">UK</span>.</p>
    <p>The line up will&nbsp;be:</p>
    <ul><li>Vincent Connare, creator of Comic&nbsp;Sans</li>
    <li>Jon Tan, web designer at Analog <span class="amp">&amp;</span> cofounder of&nbsp;Fontdeck</li>
    <li>Jonathan Hoefler, president of Hoefler <span class="amp">&amp;</span> Frere&nbsp;Jones</li>
    <li>David Berlow, type designer <span class="amp">&amp;</span> cofounder of The Font&nbsp;Bureau</li>
    <li>Tim Brown, type manager for Typekit <span class="amp">&amp;</span> maker of Nice Web&nbsp;Type</li>
    <li>John Daggett, Firefox developer <span class="amp">&amp;</span> editor of the <span class="caps">CSS3</span> Fonts&nbsp;Module</li>
    <li>Mark Porter, former creative director of&nbsp;guardian.co.uk</li>
    </ul><p>More information at <a href="http://ampersandconf.com/">http://ampersandconf.com/</a></p>
