    <p><strong> <a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Conferences" class="freelinking" rel="nofollow">Conferences</a> : Ampersand Conference</strong></p>
    <p>Ampersand is a conference specifically focussing on web typography. It is held in the Brighton, UK and organised by Clearleft, a web design consultancy based in Brighton.</p>
    <p>Ampersand is billed as:</p>
    <blockquote><p>An affordable one-day event for knowledgable web designers &amp; type enthusiasts.</p></blockquote>
    <p>The inaugural event will be held on Friday June 17th in the Brighton Dome Corn Exchange, Brighton, UK.</p>
    <p>The line up will be:</p>
    <ul>
    <li>Vincent Connare, creator of Comic Sans</li>
    <li>Jon Tan, web designer at Analog &amp; cofounder of Fontdeck</li>
    <li>Jonathan Hoefler, president of Hoefler &amp; Frere Jones</li>
    <li>David Berlow, type designer &amp; cofounder of The Font Bureau</li>
    <li>Tim Brown, type manager for Typekit &amp; maker of Nice Web Type</li>
    <li>John Daggett, Firefox developer &amp; editor of the CSS3 Fonts Module</li>
    <li>Mark Porter, former creative director of guardian.co.uk</li>
    </ul>
    <p>More information at <a href="http://ampersandconf.com/" title="http://ampersandconf.com/">http://ampersandconf.com/</a></p>
