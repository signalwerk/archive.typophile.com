      <p>I don't think Monticello is a Scotch roman. The others are. Miller (Font Bureau), also by Matthew Carter, is better than Georgia for these purposes, I suspect, because Georgia was designed for screen. You might also look at Goudy Modern, because of it being very American in feel it might go with the building. </p>
      <p>Which one--Carter, Berlow, Highsmith, Goudy etc.--is best is just a matter of trying and seeing what pleases your eye in the context. I would think that taking photos and doing mock-ups with different styles would be one important step. Even better would be doing sample signs and taking them into the building...</p>
