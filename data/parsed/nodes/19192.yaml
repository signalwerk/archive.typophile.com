      <p>Golden Cockerel is inappropriate -- Renaissance, not Gothic.<br>
      Schrift is Jugendstil, much too late, as is Victorian Swash, although the Victorian Gothic might be OK in a secondary role (it's too thin for the lead)..</p>
      <p>You really need a systematically fancy face to harmonize with the patterning in the building.</p>
      <p>In this sample, you can see the highly formalized use of pattern that was a big part of Owen Jones' theory, so influential in the 3rd quarter of the 19th century. So I would imagine that any wayfinding system would, to be correct, have to have quite a substantial border, the design of which integrates with the typography. Why not take your cue from some feature of the decoration in the building?<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/NewDom.jpg"></div><p></p>
