    <p>I'm redeveloping a wayfinding system for this building: The Pennsylvania Academy of Fine Arts ( <a href="http://www.pafa.org" title="http://www.pafa.org">http://www.pafa.org</a> ) as a school project. I need to research typefaces that would be appropriate for the building signage and figured this would be the best place to get that help!</p>
    <p><cite>The building, designed by the Philadelphia firm of Frank Furness and George Hewitt, is generally considered to be primarily the work of Furness who finished the project after the partnership dissolved in 1875. Furness had been a pupil of Richard Morris Hunt who introduced him to the esthetics of the modern Gothic revival. This included John Ruskin's appreciation of the richly colored designs of 14th-century Venice, Owen Jones's and Christopher Dresser's Eastern influenced ornament, and Viollet le Duc's use of foliated decoration combined with cast-iron architecture.</cite><br>
    <cite>Rising 70 feet above the sidewalk, the Academy must have seemed a towering fortress in 1876. Today, dwarfed by more recent buildings, it looks like a decorated jewelbox. On the facade, heavy courses of dark stone rise toward a roofline marked with such colorful elements as red and black brick patterning, fanciful floral motifs, and a bas-relief frieze depicting famous artists of the past. A gothic window dominates the central pavilion and creates a motif that recurs inside.</cite><br>
    <cite>After entering through a low vaulted hall, the visitor steps into the spectacularly ornamented Grand Stairhall. Its staircase, bordered by richly tiled floor and walls, and bronze and mahogany banisters, sweeps upward to the gallery level. This grand space is ringed with gothic arches carrying gold rosette-studded walls. The vaulted ceiling above is painted a brilliant blue with silver stars. Beyond are the galleries where foliate columns support exposed steel beams, one of several radical design elements in the building.</cite><br>
    <cite>The Academy is considered one of the finest surviving examples of Victorian Gothic architecture in America. It provides the museum with a magnificent setting for the presentation of its collections and special exhibitions. As the modernist architect Louis I. Kahn observed, the Academy is truly a life-giving and inspired building.</cite></p>
    <p>The brunt of the info is located in the archives page: <a href="http://pafa.org/archive.jsp" title="http://pafa.org/archive.jsp">http://pafa.org/archive.jsp</a></p>
    <p>I have access to a fairly large selection of Studio Fonts (420 families) plus my own little archive that I've started. I know it's going to be hard but I guess just suggest what you think would work and I'll try to find one that's hopefully similiar in quality with what I have. I don't suppose a foundry/designer might let me use a typeface for a specific educational project and then trash it.</p>
    <p>Any help, including just pointing me in the right direction would be great.<br>
    Thanks fellow Typophiles.</p>
