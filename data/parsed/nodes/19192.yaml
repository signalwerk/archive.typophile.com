      <p>Great work!</p>
      <p>It's nice that you've taken the plunge into incorporating decoration.<br>
      Tiffany is not authentic, in the sense that it's not a revival of any particular 19th century face.<br>
      However, as has been noted, type would not have been used at display size then, so the very idea of a printed Victorian display/signage typeface is spurious. (Except perhaps for the British cast-iron street name signs, recently revived by Device, but in a distressed version.)<br>
      So to use a genuine display face, an original design drawn c.1970 by Ed Benguiat, a designer with amazing chops in decorative type design, in a very sympatico neo-vicky style, is a brilliant choice.</p>
    html_clean: |-
