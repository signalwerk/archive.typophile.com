      <p>I think Lawson would back me up on this one:</p>
      <p><cite>The development of the group of types called square serif parallels that of the gothics. Both forms represented the typefounders' answer to the challenge of the nineteenth century: to find a new typographic expression for industrializede society.</cite></p>
      <p>Whereas the Scotch Romans were also developed at this time as a twist on the Bodoni-Didot faces, the square serifs were one of the new developments in type during the victorian period.</p>
