    html: |-
      <p><em>type would not have been used at display size then</em></p>
      <p>...in the context of this project, for signage.<br>
      They lacked the technology to make printed typography sufficiently durable (lamination, light-fast inks); also, there were sign painters on hand.<br>
      The closest they would have gotten is constructed frames where the printed signs would be protected by glass, and you can find such in old railway terminals still, for timetables, announcements, and advertisements.</p>
