      <p>ITC version of <strong><a class="freelinking external" href="http://www.myfonts.com/fonts/itc/bookman/" rel="nofollow">ITC Bookman</a></strong> includes some swash variants.<br>
      It matches /e/u/b/ (ITC Bookman Medium Italic) and /h/ (<strong><a class="freelinking external" href="http://www.myfonts.com/fonts/itc/bookman/swash-medium/glyphs.html" rel="nofollow">ITC Bookman Swash Medium</a></strong> slanted, but I have no idea about /T/ &amp; /R/</p>
      <p>-----------------------------------------------<br>
      I found it using Find my Font - <a href="http://www.findmyfont.com" title="http://www.findmyfont.com">http://www.findmyfont.com</a></p>
