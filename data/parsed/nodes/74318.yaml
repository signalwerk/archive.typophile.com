  html: |-
    <p>Greater Albion have just released two new families through <a class="freelinking external" href="http://www.fontspring.com/foundry/gatf " rel="nofollow"> Fontspring</a> and <a class="freelinking external" href="http://new.myfonts.com/foundry/Greater_Albion_Typefounders/ " rel="nofollow"> Myfonts.com</a>. </p>
    <p>The first of these, <a class="freelinking external" href="http://new.myfonts.com/fonts/gatf/cirflex/ " rel="nofollow"> Cirflex</a> was inspired by a 1930s shop sign, and makes an ideal typeface for Streamline Era and Art Deco design.  Cirflex is offered in regular and bold weights.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/life3_4229.png"></div><p></p>
    <p><a class="freelinking external" href="http://new.myfonts.com/fonts/gatf/oxonia-roman/ " rel="nofollow"> Oxonia Roman</a> is a text family, offered in two weights and two widths, deriving it's inspiration from classic Roman typefaces.  It is intended for the setting of text legiblyin quantity, and compliments our Anavio and Vectis faces particularly well.  Think of it as a sort of restrained lower-case Trajan. :)</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/life1_4025.png"></div><p></p>
