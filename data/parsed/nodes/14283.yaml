    <p>I've just realised I've been registered here for over 3 years without a single post (that I can remember) - shocking! Anyway...</p>
    <p>Magnitude is a typeface I originally started back in 2001 as a modular unicase family. There was some interest back then from T26 but I couldn't finish it because I was too bust with work. I resubmitted to PsyOps but it was rejected as they said they were concentrating on text faces.</p>
    <p>Now, my question is... should I just finish the typeface as is or should I add some lowercase characters to make it more versatile? Also, any crits/suggestions welcome. Thanks folks.</p>
