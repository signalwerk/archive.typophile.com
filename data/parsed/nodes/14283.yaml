      <p>Here's an older sample including some usage:<br>
      <a href="http://www.stimuli.co.uk/typefaces/magnitude.pdf" title="http://www.stimuli.co.uk/typefaces/magnitude.pdf">http://www.stimuli.co.uk/typefaces/magnitude.pdf</a></p>
      <p>Rene, thanks for your honesty :) Since this has been kicking around for a few years now I'm kind of indifferent to it. I thought if it was extended to upper/lowercase then my interest might grow again but I'm not sure how difficult it would be to develop the lowercase using the modular grid the rest of the face was designed with.</p>
      <p>I think I'd still like to pursue this face anyway, even if just to finally get it finished so I can stop thinking about it all the time!</p>
      <p>Any more comments more than welcome.</p>
