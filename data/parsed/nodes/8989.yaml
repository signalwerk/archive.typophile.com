  html: '<p>============================================================ <br>Linotype Press Release - Compatil meets M�venpick <br>============================================================ <br> <br>The Linotype Compatil type system � a core element in the  <br>revitalized M�venpick brand <br> <br>Bad Homburg, January 31, 2005. The type system Compatil from  <br>Linotype Library now serves as a central design element for  <br>communicating the new brand values of the multinational  <br>corporation M�venpick. �Offering enjoyment � indulging in  <br>special treats � nurturing the genuine,� these are the  <br>brand values which M�venpick�s new image aims to express.  <br>Carolin Versteeg, Head of Brand Consulting at the  <br>responsible communication agency �külling partner identity�  <br>in Zurich, comments on her company�s strategy: �The brand  <br>should appear elegant but not luxurious; classic,  <br>straightforward, sensuous and international, with Swiss  <br>style. The myriad possibilities offered by the Compatil font  <br>family are very convincing, especially for a complex  <br>Corporate Design program.� As a result, the various  <br>emotional accents of the font styles Fact, Text and Exquisit  <br>can all be implemented as integrated components in the new  <br>Corporate Design. Although the M�venpick brand has a clear  <br>and unified parent company strategy, specific brand worlds  <br>had to be established which fulfilled the needs of each  <br>corporate division � in essence, four operatively  <br>independent entities (Hotels &amp; Resorts, Service Gastronomy,  <br>Travel Gastronomy and Wine). The differences between the  <br>divisions can best be noticed in the choice of color climate  <br>and typography. Consequently, two strategic goals could be  <br>attained: revitalizing the parent company brand as a whole  <br>as well as defining communication measures tailored to the  <br>specific target groups of each division. Florence Mayor,  <br>Head of Corporate Communications for the M�venpick Group  <br>explains it like this: �As a new CI standard, the Compatil  <br>type system is convincing not only because of its high  <br>quality design but also because of its impressive systems  <br>concept � which corresponds well with our corporate  <br>structure, integrating various divisions within one parent  <br>company.� After the successful restart of the brand�s image  <br>in 2003, the rebranding will subsequently continue in all  <br>corporate divisions of the M�venpick Group to be completed  <br>by the end of 2005. <br> <br>For further references on the new M�venpick brand image  <br>please visit: <br>- <a href="http://www.moevenpick-group.com" target="_blank">http://www.moevenpick-group.com</a>  <br> <br>Further information on the Compatil type system can be  <br>found at: <br>- <a href="http://www.linotype.com/6-1806-6/compatil.html" target="_blank">http://www.linotype.com/6-1806-6/compatil.html</a> <br> <br> <br>If you would like further information, please contact: <br> <br>Linotype Library GmbH <br>Du-Pont-Stra�e 1 <br>D-61352 Bad Homburg <br>Tel.: +49 (0) 61 72 - 484 - 24 60 <br>Fax: +49 (0) 61 72 - 484 � 5 24 60 <br>E-Mail: <a href="mailto:info@linotype.com">info@linotype.com</a> <br>Website: <a href="http://www.linotype.com" target="_blank">http://www.linotype.com</a> <br> <br>------------------------------------------------------------ <br>Linotype Library GmbH, based in Bad Homburg, Germany and a  <br>member of the Heidelberg Group, looks back onto a history of  <br>118 years . Building on its strong heritage, Linotype  <br>Library develops state-of-the-art font technology and offers  <br>more than 6,000 original fonts, covering the whole  <br>typographic spectrum from antique to modern, from east to  <br>west, and from classical to experimental. All typefaces (in  <br>PostScript� and TrueType� format as well as more than 1,400  <br>fonts in OpenType�) are now also available for instant  <br>download at <a href="http://www.linotype.com" target="_blank">www.linotype.com</a>. In addition to supplying  <br>digital fonts, Linotype Library also offers comprehensive  <br>and individual consultation and support services for font  <br>applications in worldwide (corporate) communication. <br>------------------------------------------------------------</p>'
