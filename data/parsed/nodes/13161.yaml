      <p>There were Scangraphic specimen books around in the early 1990s. Somewhere I have a set, one with black covers, the other with white. I don’t remember for sure what the difference was, but perhaps one was for the proprietary library, the other for desktop (Type 1) offerings. (Or maybe film and digital.)</p>
      <p>Later, the company exhibited for a year or two at either Seybold or MacWorld, and gave away a smaller book of one-line showings of fonts available in PostScript Type 1. (All this is from memory; can’t find the books right now.)</p>
      <p>FontHaus used to sell Scangraphic fonts; I have Zapf Renaissance and Today Sans from that period.</p>
      <p>-- Kathleen</p>
