    html: |-
      <p>Scangraphic fonts were digitized on Ikaurs equipment in close collaboration with URW in the 1980s. Scangraphic is based in Hamburg, just like Elsner+Flake and URW++, and the activities of the companies are somehow interconnected. Veronika Elsner, now co-head of Elsner+Flake, was the first type designer who worked at URW (she was hired by Peter Karow in 1975 or so). Jelle Bosma (now Monotype Imaging) worked at Scangraphic when the company digitized their type collection. The Scangraphic fonts were converted to Type 1 about 1992 and used to be sold via some channels mentioned above. Since Scangraphic literally abandoned the font business, last year Elsner+Flake has taken over their font collection. They added Euro characters to all the fonts, remastered them, re-issued in Type 1 format and additionally published in OpenType PS format. </p>
      <p>Adam</p>
    html_clean: |-
