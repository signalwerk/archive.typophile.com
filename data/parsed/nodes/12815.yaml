      <p>good quality workmanship. I think lower case "g" is a little more flowing/curvacious and playfull than the rest of the characters. I do not mind that but wonder if it was intentional or?<br>
      It seems these days the lc "g" often get a bit more play.<br>
      I am not sure I see the reason it is called "Mare". I think of "Mare", a female horse and expect something bold, strong and curvacious. Name change should be a  consideration unless you will be building very bold weights.</p>
