      <p>I think it looks good. </p>
      <p>The 's' and 'S' are tilting to the right. (The dollar sign as well)</p>
      <p>The ear on the 'g' needs some work.</p>
      <p>The 'æ' would probably look better without the tail on the 'a'.</p>
      <p>The 'Registered trademark' is too big. It should be superscript. But that is nitpicking. :)</p>
      <p>MKSG</p>
