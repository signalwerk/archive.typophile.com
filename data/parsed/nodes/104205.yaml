    <p>Anyone out there with a clue as to what this Engravers Roman-ish slab serif face is?<br>
    Western Railway is close candidate, but no cigar: <a href="http://www.myfonts.com/fonts/jnlevine/western-railway/" title="http://www.myfonts.com/fonts/jnlevine/western-railway/">http://www.myfonts.com/fonts/jnlevine/western-railway/</a></p>
