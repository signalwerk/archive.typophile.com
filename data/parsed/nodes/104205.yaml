      <p>Here is a true Latin with triangular serifs and no fancy tips:  <a href="http://www.myfonts.com/fonts/fontmesa/great-western/" rel="nofollow">Great Western</a> by Font Mesa. Not quite as close as Western Railway, but better designed and executed.<br>
      Don</p>
