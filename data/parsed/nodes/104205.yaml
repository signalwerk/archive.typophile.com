    html: |-
      <p>Note the generally triangular serifs. This resembles a 19th century style then called Latin. Not certain if there is an exact digital match, but if there is one,  our typophiles will probably find it for you. This is pretty close, a font from the Connor's Sons catalog of 1888 digitized as <a href="http://www.myfonts.com/fonts/nicksfonts/ysleta-nf/" rel="nofollow">Ysleta</a> by Nick Curtis. In this font the Latinate serifs are clipped in an angled style called Detroit or Mansard -- a refinement that may or may not be present in your samples. This version of the Latinate  style was also known as <a href="http://www.myfonts.com/fonts/woodentypefonts/aetna/<br />
      " rel="nofollow">Aetna </a> or Painter's Gothic.<br>
      Don</p>
