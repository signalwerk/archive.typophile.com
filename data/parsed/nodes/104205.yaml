    html: <p>Thanks Don. These guys use it willy nilly so often and the funny little detailed roughness of the E is identical in both cases so much so that it makes me feel strongly this is a digital typeface somewhere. I've asked them but they are a small market and they don't know. They can't even point me to the people who did the work for them originally.</p>
