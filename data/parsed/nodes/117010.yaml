      <p>Thanks for the response. </p>
      <p>Just for some more background on this... I'm a web designer and was curious why Hoefler &amp; Frere-Jones developed their own webfont delivery system. One of the reasons cited was that hackers could steal their fonts easily. Honestly, I thought that this was a b.s. response, until I found videos like this <a href="/wiki/https%3A/%252Fwww.youtube.com/watch%3Fv%3DjS9ge9xFZ-w" class="freelinking" rel="nofollow">https://www.youtube.com/watch?v=jS9ge9xFZ-w</a>. People are also apparently using Fontlab to rebuild compete font sets this way. To make it clear, Fontlab is just a tool (a good one at that), so I don't mean to call them out.</p>
      <p>Yes, I've traded fonts with other designers. I've never met a designer that hadn't done this. That's just the reality. I'm just wondering if there was an easy way to find these sets and delete them. I blame nobody but myself. I should have kept better records.</p>
