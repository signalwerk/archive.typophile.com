      <p>&gt; I've never met a designer that hadn't done this. </p>
      <p>Yep, it's very common, especially among younger designers who are used to trading videos and MP3s. Most designers I've known save a copy of every font they have access to. Like you said, it's just the reality of the situation.</p>
      <p>Employers and clients sometimes add to the problem by providing illegal copies of fonts and refusing to reimburse if the designer wants to buy them legally.</p>
      <p>And you're right about record-keeping; big agencies often keep track of licenses but most designers don't. I've purchased many fonts but didn't start saving the licenses until a few years ago. It just didn't occur to me.</p>
