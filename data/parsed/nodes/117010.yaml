      <p>Holding a clear and compliant license trail is a good start. If you are unable to verify that the font data you hold conforms to the license then you can confirm with the foundry or designer in question. If the license you hold is for an agency you own, have owned or previously worked for, then the license is only valid for the agency but again, some foundries or designers may be willing to transfer those rights directly to you if all the paperwork is in order.</p>
      <blockquote><p>Apparently, hackers are rebuilding fonts from stolen sources such as .TTFs, WOFFs, EOTs and PDFs. In these cases, the kerning is not set properly and many glyphs are often missing. What is the best way to check to see if a font set is legit?</p></blockquote>
      <p>This is a worrying statement as it indicates that you may have received, knowingly or otherwise, fonts for which you are not licensed and which may have been obtained illegitimately, oh my! If you did know, that is not cool; if you are in doubt and want the real thing, support the industry and buy fresh.</p>
