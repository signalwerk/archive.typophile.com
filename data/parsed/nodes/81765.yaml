  html: |-
    <p>Why is it that hints are not shown when Fontlab opens a TrueType hinted font?<br>
    Is there any way to open a TrueType hinted font in FontLab and see the hints?<br>
    This doesn't happen with Type 1 hinted fonts, i this case FontLab shows all hints.</p>
