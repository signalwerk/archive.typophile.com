    html: |-
      <p>ResEdit is for Mac OS only. It wouldn't do any good with Windows, anyway. It edits the part of a file known as the "resource fork" (as opposed to the "data fork"), which Windows doesn't normally use.</p>
      <p>I don't know of any way to convert Mac .keylayout files to Windows format. I suppose it's possible, but probably quite difficult.</p>
