      <p>Hi all,</p>
      <p>I think I fixed the problems I was having by creating composite characters for the intermediate characters (such as U+004B U+0313) and assigning a Unicode codepoint (1E32). Also, I found that my combination of tools didn't like the Capital W space modifier character (1D42). When I changed the modfier for my uppercase characters to the lowercase w space modifier (02B7) that solved the problems with incorrect word wrap.<br>
      My goal is to have a keyboard where users can type Roman characters in the plain and shifted states, and type the specialized language characters in the Caps Lock and Caps Lock shifted states. I'm using MSKLC and was hoping to use the SGCaps feature to accomplish this. However, I've found that I can only enter a single Unicode codepoint in the SGCaps field. In my case, I want to type in the character, diacriticals and space modifiers so that a single keypress will enter all the characters and let OpenType composite them. When I do this in the normal and shifted states it works fine...but I lose the ability to type Roman characters.<br>
      I sent an message to the MSKLC group listed above...but it appears that responses are only generated periodically.<br>
      Any ideas on how I can do this in Windows?  I've done this same thing with Ukelele on Mac OSX and it works great. Instead of switching keyboards continually the users can just set the Caps Lock key.<br>
      On Windows I also tried Keyboard Layout Manager...but it doesn't appear to support mulitple codepoints in any state and relies upon dead keys.<br>
      Thanks for any suggestions...this forum has been great for helping me get started!</p>
