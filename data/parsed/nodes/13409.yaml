      <p>GrandpaMike, to add a menu flag for Mac OS X, create an .icns icon file, with the same filename as the keyboard layout and the suffix .icns.  Put it in Library/Keyboard Layouts, next to your keylayout file.  </p>
      <p>I use <a href="http://www.mscape.com/">Iconographer</a> to make icon files.  For a keyboard layout, the file only needs to contain a "small" 16×16-pixel colour layer, and 1-bit mask.</p>
      <p>For an example, see my <a href="http://zajac.ca/dvorak-uk/">Ukrainian Dvorak keylayout</a>.</p>
