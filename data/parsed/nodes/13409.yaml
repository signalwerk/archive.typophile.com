    date: 2005-07-26T18:21:00
    date_raw: 26.Jul.2005 6.21pm
    votes: null
    html: <p>As long as the ID is negative, it will work.  If the ID conflicts with another layout, it'll be automatically assigned a new one at runtime (i.e. I don't think this affects the actual file).  Keep in mind, though, that a Unicode keyboard layout won't be available in non-Unicode programs.  It may be helpful in certain situations (it depends on what characters you want) to give it an ID for the MacRoman encoding.  That way, the layout will be available in any program, but the Unicode characters just may not work. Again, this depends on just how many of the characters are going to require Unicode.</p>
