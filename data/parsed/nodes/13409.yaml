    <p>I want to create a keyboard layout for Mac and PC. Mac OS X uses XML .keylayout files. I am not sure but I think windows also uses XML. </p>
    <p>I am creating the file using a tool on the web found at <a href="http://wordherd.com/keyboards/" title="http://wordherd.com/keyboards/">http://wordherd.com/keyboards/</a></p>
    <p>My question is about some of the settings. I think I need a Unicode layout, it is for Armenian, but which unicode Script/Resource ID should I select? What are the differences?</p>
    <p>Is there a better tool for creating the keyboard layout?</p>
