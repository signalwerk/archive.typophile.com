      <p>trama,<br>
      muy atractiva, elegante tu fuente!<br>
      Yo que vos, acentúo un poco más esos pequeños quiebres que hacés en algunas ascendentes como la "b" o la "l" de Rambla.<br>
      Es tan solo para que no parezca "error", muchas veces las ideas cuando aparecen así, un poco tímidas, llevan a que sean vistas como desprovistos.<br>
      Intentá un poco mas acentuado el quiebre entonces, a ver como queda.<br>
      Creo, a su vez, que el doblez en la d, te pide la inclinación contraria, pero es a mi parecer nada más. Algo me hace ruido en la "d" particularmente.<br>
      Bueno, ojala te sirva de algo mi crítica, que desde ya, es solo mi opinión, la typo está muy bien lograda.<br>
      Best!<br>
      Maximiliano R. Sproviero<br>
      Lián Types.-</p>
