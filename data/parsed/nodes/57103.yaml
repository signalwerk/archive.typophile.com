    html: |-
      <p>Wow, this is amazing for a first try! I like condensed<br>
      There are only two things I can pick out as distracting. The bars on the x seem to be broken; is that intentional? And While I like the curvy y, I wonder if a straight one might be nice?<br>
      I like all the quirks that seem very current; the a, c, e and f especially. I also like the echoes of Meta, with the terminals that curve slightly like on k and u. I'm not convinced about on d though.<br>
      The trap on your cap A looks a bit big.<br>
      I'm very impressed! Keep going :)</p>
