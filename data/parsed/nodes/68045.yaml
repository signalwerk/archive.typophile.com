  html: |-
    <p>We've recently updated several of our older fonts.  The most recent of these are:</p>
    <p><a href="http://www.fontcraft.com/fontcraft/?p=1374" rel="nofollow">Moravia</a> - based on unique poster lettering by Alphons Mucha.</p>
    <p><a href="http://www.fontcraft.com/fontcraft/?p=1816" rel="nofollow">Brandywine</a> - based on original book caption lettering by legendary Amercian artist Howard Pyle.</p>
    <p><a href="http://www.fontcraft.com/fontcraft/?p=1883" rel="nofollow">Gaiseric</a> - an update of one of my original font designs first released in 1998 and subsequently used in the Spiderwick books.</p>
    <p><a href="http://www.fontcraft.com/fontcraft/?p=1945" rel="nofollow">Stuttgart Gothic</a> - based on 19th century calligraphy samples originally developed from early printed type.</p>
    <p>Many of the updates include added characters and other refinements.</p>
