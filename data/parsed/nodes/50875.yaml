      <p>Hi Ben,</p>
      <p>there are several Flickr groups dedicated to lettering and signs, like <a href="http://www.flickr.com/groups/signpaintr/">Signpaintr</a> or <a href="http://www.flickr.com/groups/center-for-vernacular-type/">The Center for Vernacular Typography</a>. <a href="http://www.publiclettering.org.uk/">Public Lettering</a> – a walk in London by <a href="/wiki/Phil%2520Baines" class="freelinking">Phil Baines</a>. Lots of good stuff on <a href="http://www.stadtgespraeche.com/">Stadtgespräche</a> aswell.<br>
      But my favourite link is <a href="http://www.vernacular.fr/">Jules Vernacular</a>.<br>
      More links in the <a href="http://www.typebase.com/">Typebase</a>.<br>
      F</p>
