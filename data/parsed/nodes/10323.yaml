    html: <p>i dont really want to draw it as a 'true' bitmap font, i just want it to be pixelated and it to be 'faithful' to its pixels at a certain point size.  <br> <br><a href="http://atomicmedia.net/am/make.htmlx" target="_top">http://atomicmedia.net/am/make.htmlx</a> is kind of what I'm trying to do, except I'm trying to use a taller more detailed font.  <br> <br>The font has descending parts that reach down to 4 pixels below the baseline, and 13 pixels above it. I might scale the 13 pixel top down to a 12 pixel top, though. <br> <br>I'm lost with fontographer settings.. It's been a year or two since I've used it seriously. I feel pretty sad for having to ask..</p>
