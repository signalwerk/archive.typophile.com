  html: <p> I can't for the life of me figure out how to set up fontographer to let me draw an 18 pixel (maximum difference between longest ascending bit and lowest descending bit) font.  <br> <br>Whats the magic formula for the Ascent, Descent, Em Square, for me to be able to draw a 18 pixel tall grid in the Guides layer, that'll let draw pixels into it and then generate 18 pixel bitmaps that are identical? (13 px above the baseline, 5 below). </p>
