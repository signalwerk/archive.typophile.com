  html: <p>OK, it's a shameless plug for a blog-in-progress but it might be enlightening to know what went on in the Golden Age of instant photography before bean counters and corporate stiffs fouled the nest. Comment and ask questions and we'll keep it going as long as there might be interest in "the olden days." Here's the link -- <br> <br><a href="http://giam.typepad.com/the_branding_of_polaroid_/" target="_blank">http://giam.typepad.com/the_branding_of_polaroid_/</a></p>
