    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Oswald Bruce Cooper</strong></p>
    <p>Oswald Bruce Cooper 1879-1940</p>
    <p>Oswald Cooper, known as Oz Cooper or simply Oz, came to Chicago in 1899 intending to become an illustrator. He ended up studying lettering with <a href="/wiki/Frederic%20W.%20Goudy" class="freelinking" rel="nofollow">Frederic W. Goudy</a> at the <a href="/wiki/Frank%20Holme%20School%20of%20Illustration" class="freelinking" rel="nofollow">Frank Holme School of Illustration</a> in Chicago along with <a href="/wiki/William%20Addison%20Dwiggins" class="freelinking" rel="nofollow">William Addison Dwiggins</a>. He later taught at the school and after it closed due to bankruptcy he continued the school’s correspondence courses which he had help set up. In 1904 he formed Bertsch &amp; Cooper with Fred S. Bertsch providing design and lettering services. In 1914 they added typesetting to their services and were the most complete design agency in the Midwest with 50 employees. His hand lettered advertisements for Packard automobiles were famous.</p>
    <p>Cooper was adept at <a href="/wiki/calligraphy" class="freelinking" rel="nofollow">calligraphy</a> and was able to letter 12 and 14 point letters freehand with no rulers or guidelines. He was also a very good copywriter and was offered a standing job by one agency. From 1918 to 1928 <a href="/wiki/barnhart_brothers_and_spindler" class="freelinking" rel="nofollow">Barnhart Brothers &amp; Spindler</a> Foundry began issuing typeface designs by Cooper. These included <a href="/wiki/Cooper%20Old%20Style" class="freelinking" rel="nofollow">Cooper Old Style</a>, and his most famous design <a href="/wiki/Cooper%20Black" class="freelinking" rel="nofollow">Cooper Black</a> which he described as a type for “far-sighted printers with near-sighted customers.”</p>
    <p>He was also one of the founding members of the Society of Typographic Arts in 1928 and the 27 Chicago Designers in 1936. His archive, which contains nearly all of his working drawings, in housed in 8 boxes in the Newberry Library in Chicago.</p>
