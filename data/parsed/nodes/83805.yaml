    html: <p>Compare, for instance, Stempel Garamond, Adobe Garamond, Garamond Premier, etc. Garamond italics are almost always based on the work of Robert Granjon, whose italics were indeed a little uneven and eccentric. How much this is preserved varies with the adaptation.</p>
