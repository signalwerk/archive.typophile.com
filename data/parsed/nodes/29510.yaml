    <p></p><div class="imageWrap"><img src="/files/squashA_1_6514.jpg"></div><br>
    I’m designing a new logo for the Hungarian <a href="http://en.wikipedia.org/wiki/Squash_%28sport%29">Squash</a> Federation, and i’m not sure if the mark of my mockup is recognizable enough. I was thinking i put here just the mark without any comment, but than i realized it would be a silly guessing game, and the logo will be used in a certain context where the recognition is easier...<p></p>
    <p>A few comments on my layout:</p>
    <ul>
    <li>i still need to work on the colors, this just the first approach</li>
    <li>the kerning of the the title is default kerning of the font. Will be finalised at the end.</li>
    <li><em>Magyar Fallabda Szövetség</em> means Hungarian Squash Federation</li>
    </ul>
    <p>Any feedback is welcome, thanks,<br>
    Péter</p>
