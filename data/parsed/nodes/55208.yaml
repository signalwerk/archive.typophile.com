      <p>Are the FontNinjaCamouflageTM shirts for sale?</p>
      <p>* * *</p>
      <p>The camp 1 vs 2 may be ok for describing different kinds of designers. But the association of certain pieces of software with either camp 1 or 2 is rubbish.</p>
      <p>During RoboThon I realized something funny. On the one hand, that attendants who are FLS users show an almost religious awe for UFO and UFO applications. On the other hand, that in their essence, UFO and UFO applications are actually more similar to Ikarus/FontMaster's than FLS's philosophy:<br>
      <em>— The UFO font format.</em> Rather than one file per font as with FLS, an UFO is a collection of separate files for outlines, naming and other metadata, kerning, classes, features -- not unlike FM fonts. Rather than FLS's .vfb, both UFO and FM's .be (plus assorted files) are open in that they are well documented and can be easily read/written by third parties. For those who haven't recognized: We need to define font names and lots of metadata whenever we produce fonts -- regardless of the application we use. There are font info dialogs in FLS, in FM, even in Area51, and all of these give access to more or less the same amount of info simply because that's what the end product requires. (Noticed the long list of data in UFO's <a href="http://unifiedfontobject.org/filestructure/fontinfo.html" target="_blank" rel="nofollow">fontinfo.plist</a>?) Even Visual Joe needs to be some sort of a Ninja if he wants to produce fonts that work. Period.<br>
      <em>— The UFO applications.</em> AFAIK, the philosophy behind UFO-based applications is to have one tool per each well defined step in the font production workflow. Which is exactly FM's philosophy of offering separate modules.<br>
      <em>— The price.</em> I do not regard this as a valid argument since whatever helps saving time is worth its price, but since it pops up frequently: If I license FLS, ScanFont, Metrics Machine, Pre- and Superpolator and various other UFO applications shown at RoboThon, I easily pay as much or more than for the FM suite.</p>
      <p>To make one thing clear: I like the UFO format and the applications too because they provide great interfaces for dealing with tendious tasks, like Metrics Machine for manual kerning or Prepolator for making masters compatible with each other. Because their interfaces make it easier to understand rather abstract ideas, like Superpolator visualizes interpolation in a multi-dimensional design space. Because UFOstretch combines interpolation and scaling in a single UI -- which combination, by the way, is what Tim Ahrens' RMX tools did before albeit behind the curtains. What I dislike, however, is adhering to some myths -- this app for Visual Joe, that one for the Font Ninja -- when a quick look at different formats and tools would easily prove them to be wrong. Remember that when FOG was still around it was actually FLS that was considered <em>the</em> camp 2 application?&nbsp;&nbsp;:D</p>
      <p>I also want to add that this <a href="http://typophile.com/node/55673" target="_blank" rel="nofollow">RoboThon</a> was, of all conferences I have attended, the best and most stimulating one. I have never before seen more new tools and ideas in only two days. It is not hard to predict that the next few years are going to be terribly exciting.</p>
