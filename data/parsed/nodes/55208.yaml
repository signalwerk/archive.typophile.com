    html: |-
      <p>Randy: 'To summarize, there are two camps of type designers'</p>
      <p>Classifications always imply the risk of simplification and placing those who work on fonts into two groups of type designers is perhaps a somewhat rough division. For my presentation in the main program of the ATypI TypeTech Forum in Lisbon in 2006 I made this <a href="http://www.fontmaster.nl/pdf/FM_docs/Automating using FM.pdf" rel="nofollow">presentation PDF</a> in which (among other things) I tried to analyze the market for font tools. Although I came to three (partly overlapping) groups, namely <em>type designers</em>, <em>font producers</em> and <em>programmers</em>, inevitably this is at the end a generalization and simplification also.<br>
      &nbsp;<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/fontprod_involvement_5662.gif"></div><br>
      &nbsp;<br>
      Irrespective of one is a non-technical designer or a skilled coder, presumably the goal is always to come to an as perfect as possible product in the most effective, i.e. economical way. Revenues, costs and time have to be balanced. If time isn't the most important issue, a production may be allowed to be less effective to a certain extend. But for most of us time is a very important issue and therefor a production has to be <strong>consistent</strong> and every part of it has to be <strong>reproducible</strong>.<p></p>
      <p>In my opinion coding only makes sense if the requested functionality is not available yet. If extensive batching functionality is built-in already like in FM, it does not seem to make much sense to start coding when one's first priority is to get the job done, I reckon.<br>
      The command <strong>files</strong>, as shown above, are very simple and in readable English. I must underline here that there is no command <strong>line</strong> involved; the command (text) files can be selected from the standard dialogs in the FM modules.</p>
      <p>Furthermore, complexity is relative: matching an OT Layout features file to the character set in for instance FLS, seems to me more complex than selecting an all-covering features file and to let the app do the matching, like FM does with the modified 'HOT' tool.<br>
      The more technical skilled, who use the AFDKO to add features to OpenType fonts can alternatively use OTMaster, which also contains the modified 'HOT' tool, to do the same job much more easily and the non-techies can use the tool the very same way to come to the same result.<br>
      By the way, coming AFDKO downloads will contain (download) info on OTM.</p>
      <p>This topic is not only about the non-technical versus the 'Ninjas', but above all about the willingness to discuss one's workflow and to look for improvements. The outcome doesn't necessarily have to be a switch to, or incorporation of, the <a href="http://www.fonttools.org" rel="nofollow">DTL FontTools</a>, but can result into an improvement of the current workflow also. Blindly focussing on one (set of) tool(s) and/or one operating system doesn't seem to me a solid basis for development or innovation anyway. </p>
      <p>Already more than twelve years ago I decided that FM would become a suite of modules, which each had to cover a different and clearly described part of the font production. The very versatile modular (IK/BE) font data storage system that FM uses, dates from the 1970's and shows how visionary Dr. Peter Karow was. As Karsten stated, the BE and IK formats are well documented and public.<br>
      In my opinion the 'open' modular/modular system of FM is unbeatable when it comes to consistency and reproducibility. But one can consider me biased, of course.</p>
