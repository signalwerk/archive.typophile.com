      <p>Nick: '[...] if that’s his market position, there’s no point in berating those who aren’t in it for not buying his product [...]'</p>
      <p>Although I actually would not mind if this discussion eventually leads to more sales for us, it was not my direct intention starting this topic. I agree with John's statement that 'for someone who makes money from producing new fonts on a pretty continual basis, as I do, this [switching to a FM workflow, FB] would be a challenge'. If such a font tools switch does not result in more (financial) benefits, it simply does not make sense, of course.</p>
      <p>What bothers me though, is what sometimes seems to me as a somewhat restricted view on font production and related tools. It would be a good thing for everybody if matters were placed in a broader perspective. The outcome does not necessarily have to be a change of tools and subsequently workflow, but could for instance lead to a more efficient use of the preferred tools. It could even put pressure on the developers of these tools to come up with additional functionality. It is for instance quite possible that some of the things said here, will make me rethink some issues concerning FM, like functionality and policy.</p>
      <p>One has to be careful not to base conclusions on a sort of common wisdom. For instance, I love the Mac since my first Plus in 1986 and I treasure Apple as being the last of the <strong>original</strong> hardware developers, but I always have the feeling that Microsoft does not get the acknowledgement it deserves in the font community because of a very much black and white view on the (historical) development of the Mac and MS OS's.<br>
      Having read a couple of books on the development of the personal computer (<em>Fire in the Valley: The Making of The Personal Computer</em> is for instance an informative one), I think that there is at least room for some more nuance. Furthermore, with the direct financial support for type related events by MS and the development of free tools like VTT and VOLT, we should perhaps cuddle (figuratively speaking, of course) Sergey, Simon and others at MS somewhat more.</p>
      <p>One general misunderstanding is that FM is very technical. Let me underline that I am a designer with a certain interest for font technology and above all for workflow organization, but I am far from a programmer (and I don't want to become one, like the FM programmers don't want to become designers). I reckon that most people on this list are capable of for instance making AppleScripts like I do.<br>
      Handling command files in FM is basically easy and the syntax is very simple. As John pointed out, using FontMaster requires a fairly substantial rethink of ones approach to font development. That is probably the main difficulty.</p>
