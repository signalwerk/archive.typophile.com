      <p>These are among the Windows font tools we use regularly that are more sophisticated and advanced than anything available on the Mac platform: VTT, VOLT, FontChef, Font Validator, even humble fpEdit and the MS console tools like cacheTT and FastFont. Some of these tools are just nice to have, but others like VOLT and VTT are pretty much essential for the kind and quality of fonts our clients want.</p>
      <p>Regarding layout capabilities, the options for working with complex scripts on the Mac remain very slim, and it is notable, I think, that those programs that do enable users to work with complex script text on a Mac (using cross-platform compatible OT fonts, not Mac-only AAT) do not originate from Apple: they are all third party and only some of them are available in compatible Windows versions. Apple have done some good work in recent years providing access to OT typographic layout, but their basic support for many languages and scripts is still tied up in AAT, which I think is a dead-end. In terms of professional graphics and publishing software, there is roughly parity between Windows and Mac, but that is due to Adobe and Quark bypassing the operating system for text layout.</p>
