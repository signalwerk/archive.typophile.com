    html: |-
      <p><em>...something that I don’t understand.</em></p>
      <p><em>A designer should...</em></p>
      <p>You won't understand it if you think in imperatives based on what is the logical best practice.<br>
      As I have attempted to explain by offering myself as an example, there are a lot of Mac-centric type designers from an arts background who are uncomfortable having their work increasingly directed to the left side of the brain, all numbers and code.<br>
      Logic may not be the best practice if it hampers intuition and good taste.</p>
      <p><em>the idea of defining letter-to-letter distances by way of sidebearings plus kerning...there is no necessity for imitating this...</em></p>
      <p>It is a tangible metaphor rooted in historical practice, and it explains much about the structure of type glyphs in the traditional genres. That is its necessity, especially so given the predominant conservatism of typographers.</p>
      <p>But just because this kind of metaphor (like layers in layout applications) continues to be a necessity, doesn't mean that we shouldn't also experiment and dig deeper with new tools.</p>
