      <p>Note that DTL products to date have been available for Mac as well as Windows, and the decision to limit further development to Windows seems to be a recent one, presumably based on experience.</p>
      <p>Nick, I think DTL products are well attuned to their target market, which I take to be a particular segment of professional font developers. I'm part of that market, although I currently only use two DTL products (KernMaster occasionally and OTMaster frequently), and I have to concur with Frank that Windows is the primary development platform of this market, both in terms of the platform within which fonts are developed and the target environment in which the fonts are used. Quite simply, I could not make the fonts that I make or provide a service to the clients I have working on a Mac development platform (by which I mean running Mac OS software; running Windows software on Mac hardware is still running Windows software). The Windows font development tools are more advanced and sophisticated than those available on the Mac, as are the layout capabilities of Windows software, notably for complex scripts. I can quite understand, however, how for you, making the kind of fonts that you make and for the kind of customers whom you make them, FontLab on a Mac is a sufficient tool.</p>
      <p>As Frank acknowledges, FontLab has been very successfully marketed, and it is also aim at a wider market to begin with. So the relevant question would seem to be why DTL products do not have a larger share within their target market, i.e. the people who would most benefit from the library batch processing and automated build features of DTL tools? I think the answer involves workflow disruption and learning curve issues: using FontMaster requires a fairly substantial rethink of ones approach to font development, and if one has established workflows built around other tools moving to an FM development stream may be a significant undertaking. I think if one had a fairly large library of fonts and made most of one's income from licensing of existing fonts, then this move would be manageable, since the downtime involved would not impact the main source of revenue. But for someone who makes money from producing new fonts on a pretty continual basis, as I do, this would be a challenge.</p>
