      <p>To summarize, there are two camps of type designers:</p>
      <p>Camp 1: Visual Joe's<br>
      - - - - - - - - - - - - -<br>
      Includes hobbyists, part-timers, and full-time-professional type designers. This group often comes from a design background. They want to build fonts that will be used by the design community using design applications. It is in their financial interest to never spend the time to learn a hoard of acronyms, mysterious information tables, command-line mumbo jumbo etc. Why? Because they can make fonts their audience will buy and use with success, using one application that insulates them as much as possible from "the dark side"... namely Fontlab. And that makes them happy. They enjoy drawing, and fear coding.</p>
      <p>Camp 2: Font Ninjas<br>
      - - - - - - - - - - - - -<br>
      These are all full-time type professionals. It is in their financial interest TO SPECIALIZE IN "THE DARK SIDE." Why? Because their clients demand it, as Ninja Hudson has pointed out. Their clients have unique needs for language or feature support that creates a space in the market for Ninjas to operate. They understand that within these constraints, the actual drawing of glyphs is the tip of the iceberg, and they use a full quiver of tools(including DTL's offerings) to tackle complex production needs. They enjoy drawing, and enjoy challenge of using code to speed production. In addition, sometimes Visual Joe's get in over their heads and need to hire a Ninja to beat up their problem. </p>
      <p>I'm not going to set the world on fire with these observations. I'm in Camp 1 with Nick. John is in Camp 2 with Chris Lozos (just checking to see if you're still reading Chris). </p>
      <p>Frank: just to clarify, is it your desire to sell your product audience to include Visual Joe's?</p>
