      <p>[Mr Lozos] <cite>Tracking this thread at the peril of masochistic consumption.</cite></p>
      <p>:D&nbsp;&nbsp;&nbsp;If you refer to OTM, it says MacOS 10.4 but works on my MacOS 10.3.9.</p>
      <p>Being a bit late to the party, I'd like to get back to two early posts:</p>
      <p>[Nick] <cite>by developing a product that is not attuned to the market</cite></p>
      <p>[James] <cite>I think that many type designers don’t know the first thing about DTL products because as we come into the field we learn Fontlab, Fontlab, and Fontlab. ... Maybe if DTL evangelized its software better more people would start using it. Send someone to Typecon to teach a class.</cite></p>
      <p>Every ATypI conference comes with a FontLab and a FontMaster track, so it is not that FM has no presence at all. For whatever reasons not many people are willing to even have a look. This is something that I don't understand.<br>
      A designer should be able to handle, or at least know, more than one tool because it frees one from mistaking tools' peculiarities (or constraints?) for the essence of the product they help create. Just one example: Quite a few Typophile threads about spacing and kerning with FLS classes indicate that people mistake a specific implementation (spacing, kerning, classes, key-glyphs) for a general idea of how letter-to-letter distances are to be defined. Make a step out of FLS and into AFDKO-syntax class kerning and you will notice that there are no key-glyphs -- these are FLS's solution to establish a link between plain kerning and classes. (The key-glyphs' kerning values are "representative" of their classes' kerning values.) Make another step, this time into OT layout table architecture, and you will notice that there is nothing like "kerning" at all but only adjustment of glyphs' placement and/or advance (width). And making some more steps ... the idea of defining letter-to-letter distances by way of sidebearings plus kerning is rooted in an older technology, metal type, and there is no necessity for imitating this either in digital font formats nor the tools used for creating digital fonts. So having a closer look at different tools may reveal the implicit understanding of what we consider as the essence of what we create, and enables us to re-think what we do and re-think tools. What I see today is way too much scratching on the surface.</p>
      <p>That James mentions TypeCon but not ATypI is telling, though I am not sure if it means that one gained momentum while the other lost some, or that TypeCon is for Americans while ATypI is for Europeans. Perhaps DTL should consider TypeCon as being equally important?</p>
