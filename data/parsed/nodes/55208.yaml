      <p>I can't speak to the reasons, perhaps masochistic, why others might want to be repeatedly editing font data that could, and probably should be managed via a single data source. I do know why I value having a tool like OTM that gives me direct access to the internals of sfnt format tables. Because one of our principle clients has delivery requirements that include VTT and VOLT sources, this means that the formal source of any font at some stage becomes a TTF with VTT and VOLT private tables. Although outlines and initial table data originate in FontLab, as soon as we move close to a beta version of the font, the TTF becomes the source. This is what is shipped to the client, who look after final compilation from VTT and VOLT and shipping. In addition to our own fonts, we also sometimes are updating existing fonts for the same client and, again, the sources are TTF files. This means that we have to edit some data directly in the TTF tables, because there is no external data source.</p>
      <p>I've taken various approaches to this over the years, including creating and managing external data sources via TTX. And when we had to process 500 fonts in multiple formats in the late '90s an external data source was essential scripted (FontLab-to-spreadsheet-to-FontLab). But since most of the time I am working with only a small number of fonts at a time, I find it often easiest to go in and edit the tables directly, with a tool like OTM or FontChef, rather than editing an external data source and then run through an automated update procedures.</p>
