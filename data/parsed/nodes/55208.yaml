      <p>Chris: 'Mostly, trying to just figure out what your product actually does [...]'</p>
      <p>The FM modules, including DTL OTMaster, mostly simplify all kinds of (repetitive) type design and font production tasks. The command files I showed earlier are powerful by themselves, but bundled with the automated features generation, batching the OT production becomes very easy.<br>
      As you know, the modified Hatch OpenType tool ('HOT') will remove the features that are not covered by the character set during font generation (see also <a href="http://www.fontmaster.nl/pdf/FM_docs/Name_table_entries.pdf" rel="nofollow">this PDF</a> on font naming).</p>
      <p>To proof yourself how versatile the software is, please <a href="http://www.fontmaster.nl/english/downloads.html" rel="nofollow">download</a> the Light version of OTM (which also contains the modified 'HOT' tool) and open an as large as possible OpenType font. Subsequently go to <a href="http://www.adobeforums.com/webx/.3bb58628" rel="nofollow">this Adobe forum page</a> and download the Minion features file that was posted there by Thomas Phinney a couple of years ago.<br>
      In OTM Light go to <em>File-&gt;Import...</em> and select at the bottom of the dialog  <em>Files of type: Adobe DFK features file</em> and select the Minion features file. You will be asked what to import and when done, you can have a view at the outcome in <em>Tools-&gt;'GPOS'/'GSUB' Table Viewer</em>.</p>
      <p>Please note that the more the character naming in the font used matches the one in the features set, the more features will be generated.</p>
      <p>As you can imagine, the same way you can update (and standardize) your OpenType fonts (irrespective of the program used to generate these) with your own standardized features file that covers all possible features.</p>
