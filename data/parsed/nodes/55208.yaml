      <p>Adam,</p>
      <p>Although I actually expected you breaking in at an earlier stage, I am pleased to see you commenting now. As I acknowledged earlier, FLS is very well promoted and your debating talent is a formidable instrument for this. But although cleverly formulated, you seem to either cover up or miss some of the points I brought forward here.</p>
      <p>'[...] But they ['type design applications', FB] all meet at one low level: the final font file [...]'<br>
      That being a fact, the functionality the applications offer, the file structures, the consistency, the quality of the output, workflow options, et cetera, very much differ. The output can be the same in name, but the consistency of the generated font data is simply not identical. Also the offered options to control all factors of the font production are not the same in the available apps, as I for instance have proven in the examples given above.</p>
      <p>As far as I know (please correct me if I am wrong), there is for instance no application besides FM that automates the features generation (in batch). And shortly we will release FM with support for the new 2.5 version of the AFDKO (currently FM supports version 2.0), like is already built-in in OTM. What are your plans for FontLab Studio, which currently supports version 1.6? Furthermore the quality of the generated font data by FM is unsurpassed.</p>
      <p>'[...] The values were wrong but they went undiscovered for years. How do I fix such a problem? [...]'<br>
      In batch I assume, with a text editor. Changing a UFM file is fairly simple.</p>
      <p>'[...] Rebuilding the entire font that possibly went through a multiple-application workflow is risky [...]'<br>
      I fully agree with this statement and actually it underlines my point that workflows can be unnecessary complex and that it makes sense in some cases to switch to a new less 'multiple-application' one based on a different font editor.</p>
      <p>'[...] are you sure that DTL FontMaster 4.0 or FontLab Studio 7 will generate exactly the same metrics and kerning that the versions [...]'<br>
      I can't speak for FontLab Studio 7, but I am pretty sure that DTL FontMaster 4.0 will generate the same metrics (the underlying system is in use for more than thirty years now and has proven to be very reliable and consistent). Kerning is a different issue, of course, because normally the kerning is fixed data and a revision would imply a changed font.</p>
      <p>'[...] Also, none of the tools on the market for “high level” type design will ever give you the ability to do “everything perfectly” [...]'<br>
      Perhaps not, but we come quite close with the FM modules.</p>
      <p>'[...] thanks to its [Python, FB] support in FontLab Studio, people have implemented functions that we never have thought of [...]'<br>
      A couple of comments in this topic made clear that there are quite some type designers that are not willing or capable of handling 'numbers and code'. So, the additional Python scripting is probably mostly used by a relatively small group of techies. FM offers easy to control (but under the hood complex) batch functionality for <strong>all</strong> users. Also, additional scripting does not always improve the stability and consistency of the production environment.</p>
      <p>Furthermore, I have seen quite some functions programmed in Python, of which we actually already thought of and which are implemented for a long time in FM now.</p>
      <p>'[...] Now I only wish that VOLT, VTT, Microsoft Font Validator and of course DTL FontMaster supported Python as well [...]'<br>
      I am afraid that you completely missed my point; please re-read my other contributions to this topic ;-).</p>
